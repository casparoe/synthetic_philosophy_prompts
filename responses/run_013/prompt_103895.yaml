answer: |-
  ## The Calculus of Caution and Craving

  Anya Patel didn’t gamble; she *negotiated with probability*. Her abacus wasn’t just for show on her actuarial desk; it was the physical manifestation of her internal decision engine. Most people saw risk as a binary cliff or a smooth slope. Anya saw it as a landscape with treacherous ravines and dizzying peaks, demanding different gear for different terrain. Her rule, etched on a worn index card taped to her monitor, was her compass:

  > **r(p) =**  
  > **2p²** for p ≤ 0.2 (The Ravines: Small chances of disaster)  
  > **√p** for p > 0.2 (The Peaks: Chances of glory, however small)

  It meant she amplified tiny probabilities of catastrophe and amplified the *psychological weight* of even minuscule chances of windfalls. Expected Utility (EU) was for spreadsheets; Risk-Weighted Expected Utility (REU) was for living.

  "Flood zone assessment, Block 7B," Anya murmured, fingers dancing over the abacus beads. "Baseline premium: $1500 annually. Client probability of catastrophic loss: 0.05. EU says premium should be… $750 based on loss value. But *my* r sees that 5%." She tapped the card. "r(0.05) = 2*(0.05)² = 2*0.0025 = 0.005. But r(0) = 0, so weight *for* the disaster outcome is r(P[disaster or better]) - r(P[better]) = r(1) - r(0.95)." She calculated: r(1) = √1 = 1, r(0.95) = √0.95 ≈ 0.9747. Weight = 1 - 0.9747 = 0.0253. "So the disaster feels like 2.53%, not 5%. Still…" She compared it to the EU weight of 0.05. "Disaster feels *less* likely than reality? No." She frowned. "The REU weight *for the disaster outcome* is 0.0253, but in REU, the weights don't sum to 1 like probabilities. It's about the *impact* assigned. Compared to EU weighting it at 0.05, my r is weighting it at 0.0253 – which is *less*. That can't be right for risk aversion…"

  She stopped. She’d inverted the cumulative. *REU weights outcomes based on the chance of getting that outcome OR BETTER, not worse.* She needed the worst outcome first. For the disaster (worst outcome):
  * P[disaster or better] = P[any outcome] = 1.0
  * P[strictly better] = P[no disaster] = 0.95
  * Weight = r(1.0) - r(0.95) = √1 - √0.95 ≈ 1 - 0.9747 = **0.0253**

  For the 'no disaster' (best outcome):
  * P[no disaster or better] = P[no disaster] = 0.95
  * P[strictly better] = 0 (nothing better exists)
  * Weight = r(0.95) - r(0) = √0.95 - 0 ≈ **0.9747**

  Total weight = 0.0253 + 0.9747 = 1.0. Good. The disaster outcome, with only a 5% probability, gets a weight of 0.0253 – significantly *less* than its 0.05 probability under EU. But for risk *aversion*, shouldn't the bad outcome get *more* weight? Her r-function for low p (convex) was *suppressing* the weight of small-probability disasters? That aligned with her *risk-seeking* for gains on the concave part, but not her intended risk aversion for losses. Flustered, she realized her initial setup: she was weighting the *outcomes*, but for risk aversion on losses, the convex r(p) for low p should make the *worst* outcome loom larger. The mistake was in how she applied the cumulative probability.

  She started over. Order outcomes worst to best: Disaster (Utility = -100,000), No Disaster (Utility = 0).
  * For Disaster (worst):
      * P[Disaster or better] = P[Disaster or No Disaster] = 1.0
      * P[Strictly better] = P[No Disaster] = 0.95
      * Weight = r(1.0) - r(0.95) = √1 - √0.95 ≈ 1 - 0.9747 = **0.0253**
  * For No Disaster (best):
      * P[No Disaster or better] = P[No Disaster] = 0.95
      * P[Strictly better] = 0
      * Weight = r(0.95) - r(0) = √0.95 - 0 ≈ **0.9747**

  REU = (0.0253 * -100,000) + (0.9747 * 0) = **-2,530**

  Standard EU would be: (0.05 * -100,000) + (0.95 * 0) = **-5,000**

  Her REU was *less negative* (-2,530) than EU (-5,000), meaning by her r-function, the gamble looked *better* than it did under EU. This was the *opposite* of risk aversion for losses! Her convex r(p) for low p (2p²) was intended for *losses*, but applied to the cumulative P[outcome or better], it was downweighting the very small chance of disaster. This was actually reflecting *optimism* about small-probability bad events? That couldn't be right. She felt a headache coming on. The mathematical formalism was clashing with her intuition. How could a convex r(p) lead to downweighting a small-probability loss? Was her entire understanding flawed?

  She took a deep breath. She needed a simpler example. Imagine a gamble: 95% chance of $0, 5% chance of losing $100.
  * Order worst to best: Lose $100 (U=-100), Win $0 (U=0).
  * For Lose $100 (worst):
      * P[Lose $100 or better] = 1.0
      * P[Strictly better] = P[Win $0] = 0.95
      * Weight = r(1.0) - r(0.95) = √1 - √0.95 ≈ 1 - 0.9747 = **0.0253**
  * For Win $0 (best):
      * P[Win $0 or better] = 0.95
      * P[Strictly better] = 0
      * Weight = r(0.95) - r(0) ≈ **0.9747**
  * REU = (0.0253 * -100) + (0.9747 * 0) = **-$2.53**
  * EU = (0.05 * -100) + (0.95 * 0) = **-$5.00**

  Again, REU (-$2.53) is *better* than EU (-$5.00). Her r-function makes the gamble look *less bad*. This was risk-seeking for losses? But she intended her convex r(p) for low p (2p²) to make her *risk averse*! The problem was clear: applying r(p) to the cumulative P[outcome or better] for the *worst* outcome involved r(1) and r(1 - p_loss). Her convex r(p) meant r(1 - p_loss) was *higher* than the identity function for small p_loss (since 1 - p_loss is large, >0.8, and √p > p for p<1), so r(1) - r(1 - p_loss) became *smaller* than p_loss. Hence, the weight on the worst outcome was *less* than its probability. This downweighting of small-probability losses is characteristic of *risk-seeking* or *optimism*, not aversion.

  Anya slumped back. Her carefully crafted two-piece r-function, designed to embody both caution for small disasters and boldness for small windfalls, was mathematically producing the *opposite* effect on losses than she intended. The convex part (2p² for p≤0.2) applied within the REU formalism was making her *less* sensitive to small-probability losses, not more. Her entire self-conception as someone who paid premiums to avoid disaster was built on a mathematical misinterpretation. The landscape of risk she thought she navigated so precisely was a mirage. The abacus beads blurred before her eyes, symbols of a calculus that didn't calculate what she felt in her bones. She needed to rethink everything. The index card on her monitor suddenly looked like a lie.
