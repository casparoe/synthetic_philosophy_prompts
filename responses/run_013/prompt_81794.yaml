  ### Indistinguishable Leaves and Further Questions  
  - **Leaf A (Impossible Worlds) and Leaf E (Restricted-Propositions)**: Both predict identical agent behavior in many cases (e.g., long-proof failure).  
    - **Further Question to Prise Apart**: *Can the agent know propositions involving concepts they possess but cannot combine logically (e.g., "if arithmetic is sound, then \(Q\)")?*  
      - Impossible Worlds: **Yes** (knowledge includes worlds where combinations are arbitrary).  
      - Restricted-Propositions: **No** (proposition is outside the agent’s "closure-triggering" set).  

  - **Leaf B (Structured) and Leaf F (Resource-Bounded)**: Both explain failures for complex logical equivalents.  
    - **Further Question to Prise Apart**: *Does the agent know all *semantic consequences* of \(P\) (e.g., \(Q\) true in all models of \(P\))?*  
      - Structured: **No** (knowledge tracks syntactic/proof structure, not semantics).  
      - Resource-Bounded: **Yes** (if computationally feasible), but may not *believe* it.  

