prompt: |-
  I have been asked to write out my metaethical position in a form my colleagues can attack, and before I circulate it I want to know whether it actually hangs together. Here is where I have landed.

  (i) There are no framework-independent moral truths: a moral judgement is true or false only relative to a moral code, and there is no standpoint outside every code from which such judgements could be assessed.

  (ii) A moral code is individuated by its constitutive commitments rather than by its surface norms — by the things its adherents could not abandon and still be following that code. Two communities whose members behave identically may therefore be following different codes, if what underwrites the behaviour differs.

  (iii) Because of (i), the only legitimate way to criticise someone who belongs to another code is immanent critique: showing them that a surface norm they accept contradicts a constitutive commitment of their own code.

  (iv) Codes can nonetheless be ranked. One code is better than another when it is more internally coherent and when its adherents can reflectively endorse it as a whole.

  (v) There is no standpoint from which to condemn a whole code as such — only particular norms within it.

  (vi) Toleration is the right response to codes we find repellent.

  I suspect these do not all fit together, but I cannot see where the seams are. Tell me which commitments are genuinely in tension and which pairs only appear to be; rank the real tensions by severity; and for each, say what would have to be given up and what that would cost. I would rather have the cheapest single revision that relieves the most pressure than an undifferentiated list of everything that could be trimmed. Please answer in British English.
reasoning: |-
  Okay, let me think through this user's metaethical position carefully. The user has outlined six key theses and wants to know if they cohere, where the tensions are, and what minimal revisions might help. 

  First, I need to understand the core structure. The position seems to be a sophisticated form of relativism - denying framework-independent truths (i) while allowing for internal critique (iii) and even cross-code evaluation (iv). That's already an interesting tension point. 

  Looking at (iv)'s claim that codes can be ranked by coherence and reflective endorsement - this seems to presuppose some trans-code standards, which directly contradicts (i)'s claim that there's no external standpoint. If coherence and reflective endorsement are themselves framework-dependent concepts, then (iv) becomes circular. But if they're framework-independent, that violates (i). That's probably the most severe tension.

  The user mentions toleration (vi) as the response to repellent codes, but this feels underdeveloped. If all critique must be immanent (iii), and we can't condemn whole codes (v), then toleration might follow - but is "toleration" itself a normative claim? The user hasn't specified which code this obligation belongs to. That's another pressure point.

  I notice (ii) about code individuation seems stable but has implications. If codes are defined by deep commitments, immanent critique becomes harder because surface contradictions might not violate core commitments. This could weaken (iii)'s practical force.

  For repair suggestions: The cheapest fix might be to reframe (iv) as entirely internal - "better" only means "by this particular code's standards." But that makes cross-code evaluation impossible, which the user seems to want. Alternatively, they could soften (i) to allow some minimal trans-code standards like coherence, but that costs relativistic purity.

  The user is clearly sophisticated - they've anticipated many issues but want the seams revealed. They prefer minimal revision, so I should prioritize which tension most threatens structural integrity while preserving their core relativist commitment. The (i)/(iv) conflict seems most acute, followed by whether (vi) can be grounded without violating (v) or (i).

  British English phrasing is requested, so I'll avoid Americanisms and use terms like "judgement" with two 'm's, "criticise" with 's' not 'z', etc. The tone should remain academic but accessible since it's for colleagues.
answer: |-
  Right then, let's dissect your position. It's a thoughtful and internally sophisticated relativism, but several key tensions exist, primarily revolving around the ambition of (iv) and its relationship with the core relativistic commitments. Here's a breakdown of the genuine tensions, ranked by severity, the cost of potential revisions, and the minimal repair strategy you requested:

  1.  **Severe Tension: (iv) Ranking Codes vs. (i) No Framework-Independent Truths & (v) No Condemning Whole Codes**
      *   **Nature of Tension:** This is the core instability. Claiming one code is *objectively* "better" than another (due to coherence + reflective endorsement) implicitly requires a *transcendent standard of evaluation*. What makes coherence and reflective endorsement *the* criteria for "betterness"? If this standard isn't itself framework-dependent, it violates (i). If it *is* framework-dependent (e.g., "better *according to the evaluator's code*"), then the ranking isn't genuinely cross-code; it's merely stating a preference *within* the evaluator's framework. This clashes with the apparent ambition of (iv) to offer a *general* way to rank codes. Furthermore, ranking one code as "better" *as a whole* seems directly equivalent to condemning the other *as a whole*, violating (v).
      *   **Cost of Giving Up (iv):** You lose the ability to make any comparative claims about the *overall* merit of different moral codes beyond their internal consistency. Moral progress or regress across codes becomes unintelligible except as internal shifts. You are left with pure relativism + immanent critique only.
      *   **Cost of Softening (i) or (v):** Abandoning strict (i) means accepting *some* framework-independent moral truths (e.g., "coherence is good," "reflective endorsement is good"). This fundamentally shifts your position away from robust relativism towards a form of universalism or at least a minimal objectivism about meta-norms. Abandoning (v) allows condemning whole codes, but then (iv)'s ranking becomes indistinguishable from condemnation from a privileged standpoint, further undermining (i).

  2.  **Significant Tension: (vi) Toleration as the Right Response vs. (i) No Framework-Independent Truths & (iii) Only Immanent Critique**
      *   **Nature of Tension:** Prescribing "toleration" as the universally "right response" to repellent codes sounds like a substantive, framework-independent moral claim. Where does this obligation come from? If it's part of *your* specific code, then (vi) only means "*We* should tolerate them according to *our* code." This doesn't provide a reason for adherents of other codes (especially illiberal ones) to tolerate *you*, nor does it obligate you to tolerate codes that fundamentally reject toleration (the classic paradox of toleration). If toleration is presented as a *transcendent* norm, it violates (i). Furthermore, (iii) confines legitimate critique to immanent arguments. If toleration isn't a constitutive commitment of the repellent code, you cannot use (iii) to argue *they* should be tolerant. (vi) thus seems like an external prescription smuggled in.
      *   **Cost of Giving Up (vi):** You lose a normative prescription you find appealing. You are left only with the descriptive relativistic picture and immanent critique, without a general "ought" about how to respond to difference.
      *   **Cost of Grounding (vi) in (iv):** You could try arguing that a code prescribing toleration ranks "better" by (iv)'s standards (more coherent, reflectively endorsable). However, this runs headlong into the severe tension above. Why should *that* ranking be accepted universally? It risks being circular: "Our code is better because it values coherence/endorsement, and coherence/endorsement are good because our code ranks highly by them."

  3.  **Minor Tension/Potential for Clarification: (ii) Deep Individuation vs. (iii) Immanent Critique (Practicality)**
      *   **Nature of Tension:** If codes are defined by deep constitutive commitments rather than surface norms, immanent critique becomes significantly harder in practice. Identifying the *true* constitutive commitments of another community's code from the outside is fraught with difficulty and risks misinterpretation. You might successfully show a surface norm contradicts *what you perceive* as their deep commitment, but if you've misidentified that deep commitment, your critique fails. This doesn't contradict (iii) logically, but it makes it a much more precarious endeavour than if codes were defined by observable norms.
      *   **Cost:** Not a logical contradiction, but a significant practical limitation inherent to your definition. Mitigating it requires deep hermeneutic charity and cultural understanding, which your framework acknowledges but doesn't guarantee.

  4.  **Apparent Tension (Resolvable): (iii) Only Immanent Critique vs. (v) No Condemning Whole Codes**
      *   **Nature:** This might seem tense because if you can't condemn a whole code, and critique is only immanent, does that mean *no* substantive external criticism is possible? However, your position *allows* for condemning *particular norms* within a code via immanent critique (showing they contradict the code's *own* commitments). Condemning a *particular norm* isn't the same as condemning the *whole code as such*. (v) allows for strong internal reform while maintaining that the code *itself* can't be rejected *in toto* from an external "view from nowhere."
      *   **Resolution:** These are compatible. Immanent critique targets specific inconsistencies *within* a code, aiming to reform it according to its own standards, without needing to reject the entire framework. (v) simply states there's no external justification for declaring the *entire* framework invalid *as a whole*.

  **The Minimal Cheapest Revision to Relieve the Most Pressure:**

  *   **Target:** Address the **Severe Tension (1)** between (iv) and (i)/(v).
  *   **Revision:** **Reformulate (iv) explicitly as an internal, framework-dependent claim.**
      *   *Original:* "(iv) Codes can nonetheless be ranked. One code is better than another when it is more internally coherent and when its adherents can reflectively endorse it as a whole."
      *   *Revised:* "(iv) Codes can be ranked *relative to a specific evaluative framework*. One code may be judged better than another *according to a particular framework* when it is deemed more internally coherent and when its adherents are seen as being able to reflectively endorse it as a whole *by the standards of that evaluating framework*."
  *   **What it Costs:**
      *   **Ambitious Ranking Lost:** You sacrifice the idea that codes can be ranked *objectively* or *generally* "better" or "worse." Rankings become perspectival, tied to the evaluator's own moral code. You lose the potential for a universal standard of moral progress.
      *   **Potential Circularity:** The ranking now simply reflects the preferences *built into* the evaluating code. Saying "Code A is better than Code B (by our standards)" offers no *external* reason for Code B's adherents to care, or for neutral observers to accept this ranking.
  *   **What it Preserves:**
      *   **Core Relativism (i):** Framework-independent truths remain absent. Judgements, including comparative ones about other codes, are only true relative to a code.
      *   **No Condemning Whole Codes (v):** Ranking *relative to your framework* isn't the same as condemning *the whole code* from a God's-eye view; it's stating a preference or assessment *within your own framework*.
      *   **Deep Individuation (ii) & Immanent Critique (iii):** These remain intact.
      *   **Toleration (vi):** You can preserve (vi) as a prescription *of your own code*. It becomes "Our code commits us to toleration as the right response, *even though we cannot prove this obligation transcends our framework*." This avoids claiming a transcendent truth for toleration. However, the tension described in point 2 above remains, now framed as an internal commitment rather than a universal demand.

  **Conclusion:**

  Your core relativistic theses (i, ii, iii, v) hang together reasonably well. The major stress point is the ambition of (iv), which strains against the denial of any external standpoint in (i) and (v). The cheapest revision is to explicitly make the ranking in (iv) framework-dependent. This preserves your relativistic core but significantly reduces its normative reach beyond immanent critique and internal prescriptions like (vi). It accepts that your condemnation of, say, a deeply illiberal code is ultimately an expression of *your* framework's values, not an objective judgement accessible to all rational beings. This is the price of consistent relativism. If you find this cost too high (losing a robust sense of cross-code moral improvement), then a more fundamental revision, likely abandoning strict (i), would be necessary, moving you towards a different metaethical territory altogether.
