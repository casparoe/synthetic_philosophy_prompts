  ### Decision Procedure for Forecast Review Desk  
  **Objective:** Provide a structured, one-hour decision process using a 12-year hindcast archive (20-member ensembles, two model upgrades) that terminates in one of four fixed verdicts. The procedure must not yield "we don't know" and must distinguish between unpredictability (fundamental chaos), underdetermination (fixable with better data/models), and risk decisions.  

  **Key Distinctions Retained in Procedure:**  
  1. **Unpredictable vs. Undetermined:**  
     - **Unpredictable:** Inherent chaos (e.g., sensitive dependence on initial conditions). *Better measurement **cannot** fix this.*  
     - **Undetermined:** Insufficient data, model error, or unresolved processes. *Better measurement **could** fix this (e.g., more gauges, higher-resolution models).*  
  2. **Risk Acceptance:** Handed to the director when uncertainty is quantifiable but the cost/benefit trade-off is non-technical (e.g., safety vs. cost).  
  3. **Dropped Distinction:** Whether forecast horizons are fundamental limits (e.g., chaos theory) or model artifacts (contested; not resolved here).  

  **Fixed Verdicts (Director Actions):**  
  1. **`HIGH CONFIDENCE`**: Use the forecast as-is (central estimate ± tolerance).  
  2. **`MODERATE CONFIDENCE`**: Use the forecast range (10th–90th percentile) and activate contingency plans.  
  3. **`SCENARIO-BASED`**: Prepare for 2–3 distinct outcomes (e.g., early/medium/late ice breakup) with probabilities.  
  4. **`CONSERVATIVE ACTION`**: Ignore the forecast; deploy pre-defined fail-safe (e.g., worst-case threshold).  

  ---  
  ### Decision Procedure (60-Minute Workflow)  
  **Inputs:** Target variable, lead time, tolerance (e.g., ±10 cm), and action threshold (if applicable).  

  #### Step 1: Archive Sufficiency Check (5 mins)  
  - **Question:** *Are there ≥10 hindcast cases with similar initial conditions?*  
    - **Test:** Filter archive for same season (±15 days), lead time, and key drivers (e.g., snowpack for snowmelt; river discharge for crests). Ignore model upgrades if archive is homogenized.  
    - **Insufficient if:** Cases <10.  
    - **Verdict:** `CONSERVATIVE ACTION`.  
    - **Why:** System is *undetermined* (fixable with more data/model improvements).  

  #### Step 2: Point Forecast Reliability (15 mins)  
  - **Question:** *Does the ensemble mean (or median) fall within tolerance of observations in ≥70% of cases?*  
    - **Test:** For each hindcast case, calculate `|ensemble mean – observation|`. Count cases ≤ tolerance.  
    - **Sufficient if:** ≥70% of cases pass.  
    - **Verdict:** Proceed to **Step 3**.  
    - **Insufficient if:** <70% of cases pass.  
    - **Verdict:** Proceed to **Step 4**.  
    - **Why:** Failure indicates *unpredictability* (chaos) or model error. Distinguishing requires expert input (not feasible here).  

  #### Step 3: Spread Reliability (10 mins)  
  - **Question:** *Is the ensemble spread consistent with observed errors?*  
    - **Test:**  
      1. Compute the *spread*: Standard deviation (SD) of ensemble members for each case.  
      2. Compute the *error*: Absolute difference between ensemble mean and observation for each case.  
      3. Calculate `Avg(SD) / Avg(error)` over all cases.  
    - **Sufficient if:** Ratio = 0.8–1.2 (spread ≈ error).  
    - **Verdict:** `HIGH CONFIDENCE`.  
    - **Insufficient if:** Ratio <0.8 (overconfident spread) or >1.2 (underconfident spread).  
    - **Verdict:** Proceed to **Step 4**.  
    - **Why:** Overconfidence = *unpredictability*; underconfidence = *undetermined* (e.g., missing processes).  

  #### Step 4: Event or Interval Reliability (20 mins)  
  - **Question A (Event, e.g., flood threshold):** *Are event probabilities reliable?*  
    - **Test:**  
      1. Define event (e.g., crest > evacuation threshold).  
      2. For each hindcast case, compute forecast probability: `% of ensemble members > threshold`.  
      3. Bin probabilities (0–20%, 20–40%, etc.). For each bin, calculate observed frequency of the event.  
      4. Check: `|Observed frequency – Bin midpoint| ≤ 0.2` (e.g., for 20–40% bin, midpoint=30%; observed must be 10–50%).  
    - **Sufficient if:** All bins pass.  
    - **Verdict:** `MODERATE CONFIDENCE`.  
  - **Question B (Interval, e.g., snowmelt volume):** *Does the 80% ensemble interval capture observations?*  
    - **Test:** For each case, check if observation lies within the 10th–90th percentile of the ensemble.  
    - **Sufficient if:** Coverage ≥70% of cases.  
    - **Verdict:** `MODERATE CONFIDENCE`.  
  - **Insufficient for A/B:**  
    - **Test:** Check for bimodal ensemble distributions in current forecast (e.g., ice breakup clusters around two dates).  
      - **Sufficient if:** Clear separation (≥ tolerance) between clusters; ≥5 similar hindcast cases per cluster.  
      - **Verdict:** `SCENARIO-BASED` (assign probabilities based on cluster size).  
    - **Insufficient if:** No clusters or cases <5.  
    - **Verdict:** `CONSERVATIVE ACTION`.  
    - **Why:** Failure implies *unpredictability* (if spread was narrow) or *undetermined* (if spread was wide).  

  #### Step 5: Risk Handoff (Director Decision)  
  - **Trigger:** Verdicts `MODERATE CONFIDENCE` or `SCENARIO-BASED`.  
  - **Action:** Director chooses action based on risk tolerance (e.g., cost of false alarm vs. missed event).  
  - **Not a verdict:** Embedded in procedure outputs.  

  ---  
  ### Procedure Execution on Cases  
  **Case 1: Crest Height (5-day lead, ±10 cm, evacuation threshold)**  
  - **Director's Concern:** Hates uncertainty; wants binary "evacuate or not."  
  - **Steps:**  
    1. **Archive:** 50 similar cases → sufficient.  
    2. **Point Forecast:** Ensemble mean within 10 cm in 50% of cases (<70%) → insufficient.  
    3. **Spread:** Ratio = 0.6 (overconfident) → insufficient.  
    4. **Event Reliability:**  
       - Bin 0–20%: Forecast prob. 15%, observed 5% → |5–10| = 5% (<20% tolerance) → pass.  
       - Bin 20–40%: Forecast 30%, observed 35% → pass.  
       - ... All bins pass → `MODERATE CONFIDENCE`.  
  - **Publish:** "50% probability of exceeding evacuation threshold. Activate contingency plans."  
  - **Judgment Calls:** Bin tolerance (0.2) arbitrary; assumes homogeneous events.  
  - **Misfire Risk:** False confidence if threshold sensitivity is nonlinear (e.g., 1 cm error causes dam failure).  

  **Case 2: Ice Breakup Date (3-week lead, ±3 days)**  
  - **Director's Concern:** Pre-positioning crews costs $50k/day; late deployment risks flooding.  
  - **Steps:**  
    1. **Archive:** 12 cases → sufficient.  
    2. **Point Forecast:** Median date accurate within 3 days in 33% of cases (<70%) → insufficient.  
    3. **Spread:** Ratio = 1.5 (underconfident) → insufficient.  
    4. **Interval Reliability:** 80% ensemble interval covers observations in 40% of cases (<70%) → insufficient.  
    5. **Scenarios:** Current ensemble bimodal: Cluster A (April 10 ±2 days, 60% of members), Cluster B (April 20 ±2 days, 40%). Hindcast: 6 cases similar to A (5 observed early breakup), 4 to B (3 late) → `SCENARIO-BASED`.  
  - **Publish:** "60% probability of early breakup (April 10), 40% late (April 20). Pre-position crews by April 5."  
  - **Judgment Calls:** Cluster separation defined ad hoc; small hindcast samples per cluster.  
  - **Misfire Risk:** Misses novel drivers (e.g., unprecedented warm spell).  

  **Case 3: Seasonal Inflow Total (6-month lead, ±10%)**  
  - **Director's Hate Case:** Wants a single number for allocations; hates ranges.  
  - **Steps:**  
    1. **Archive:** 12 cases → sufficient.  
    2. **Point Forecast:** Mean within 10% in 25% of cases (<70%) → insufficient.  
    3. **Spread:** Ratio = 0.7 (overconfident) → insufficient.  
    4. **Interval Reliability:** 80% interval covers observations in 75% of cases (≥70%) → `MODERATE CONFIDENCE`.  
  - **Publish:** "Inflow forecast: 100–120 GL (10th–90th percentile). Allocate based on 100 GL; hold 20% reserve."  
  - **Judgment Calls:** Coverage threshold (70%) arbitrary; ignores tail risks beyond 90th percentile.  
  - **Misfire Risk:** False confidence if inflows are fat-tailed (e.g., drought risk underestimated).  

  ---  
  ### Where the Procedure Misfires  
  1. **Unseen Extremes:** Fails if the archive lacks rare events (e.g., 100-year flood). Hindcasts may show reliability, but the model may not extrapolate.  
  2. **Model Structural Errors:** Cannot detect if all hindcasts share the same bias (e.g., missing permafrost thaw in snowmelt).  
  3. **Cascading Uncertainties:** For compound events (e.g., bloom depends on inflow + temperature), errors accumulate silently.  
  4. **False Confidence:** Overreliance on interval coverage (`MODERATE CONFIDENCE`) when tails are fat (e.g., seasonal inflow).  

  ### Settled vs. Contested  
  - **Settled:**  
    - Ensemble spread should match error (Step 3); unreliable without it.  
    - Hindcast assessment is necessary for reliability (all steps).  
  - **Contested (Not Resolved Here):**  
    - Whether weather-type predictability is capped at ~2 weeks (chaos limit) or extendable with better models.  
    - Whether "model error" can be eliminated or only reduced.  

  ---  
  **Final Output:** Analysts run this procedure in 60 minutes using archive queries and simple stats. Verdicts force clear director actions, and risk decisions are handed off where appropriate. Publish ranges/scenarios when possible; fall back to conservative defaults when not.
