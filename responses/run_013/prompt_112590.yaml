  2. "Moderate Confidence": The forecast has some reliability but with significant uncertainty. The director should use the forecast but also consider the range (e.g., the 10th-90th percentile) and have contingency plans.
  3. "Low Confidence": The forecast is not reliable. The director should not rely on the forecast and instead use a pre-determined conservative action (e.g., worst-case scenario or a fixed safe threshold) and activate contingency planning.
  4. "Scenario-Based": The forecast is not reliable, but there are a few distinct scenarios (e.g., early/late ice break-up) that are well separated and can be assigned probabilities. The director should prepare for each scenario.

  We note that "Low Confidence" does not mean "we don't know" but rather that the forecast is unreliable and the director must act conservatively.

