  We are designing a decision procedure for forecast analysts at a regional water authority. The procedure must be executable by analysts without dynamical systems training, using a hindcast archive (12 years, 20-member ensembles, with two model upgrades). The procedure must terminate in a fixed set of verdicts that the director can act on, and must not output "we don't know". The procedure must handle various forecast requests (crest height, snowmelt volume, ice break-up date, bloom start date, seasonal inflow) with different lead times and tolerances.

  Key distinctions to make:
  - Unpredictable system: The system is inherently chaotic (e.g., due to sensitive dependence on initial conditions) and no amount of data or model improvement will make it predictable beyond a certain lead time.
  - Undetermined system: The system is not sufficiently constrained by the model or data. This could be improved with better models, more data, or higher resolution.
  - Risk acceptance: When the remaining uncertainty is about how much risk to accept (a decision for the director).

  The procedure must also distinguish between issues that better measurement would fix (e.g., initial condition errors, parameter uncertainties) and those it would not (e.g., fundamental chaos, model structural errors that are not resolved by more data).

