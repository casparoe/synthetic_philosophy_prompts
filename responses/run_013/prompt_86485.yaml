prompt: |-
  I teach a grad seminar in decision theory — we do Savage, then the last third of the course is the heretics (rank-dependent stuff, Buchak's risk-weighted thing, a little Gilboa–Schmeidler). I'm writing the final and I need one big question on risk-weighted expected utility. The problem I keep having is that a student who's memorized 'expected utility bakes in risk neutrality and the risk function fixes that' can write two pages and get most of the marks. I want the question to be unanswerable that way.

  So the question has to make them actually do something with the machinery, and I'll hand them the machinery in the question stem — they dont have internet and I'm not asking them to cite anything, so the stem should give them everything. Here's what it should give them: a gamble is a finite list of money outcomes with probabilities, written from worst to best; the risk function r takes probabilities to probabilities, is increasing, r(0) = 0, r(1) = 1; and for a gamble with outcomes x1 ≤ x2 ≤ ... ≤ xn and probabilities p1, ..., pn,

  REU = x1 + Σ (from i = 2 to n) r(p_i + p_{i+1} + ... + p_n) · (x_i − x_{i−1})

  i.e. each gap between consecutive outcomes gets weighted by r of the chance of landing at x_i or better.

  Three parts I want in the question.

  (a) Short warm-up. Have them show that r(p) = p collapses REU to ordinary EU, and compute REU for the gamble G = ($0 with prob 1/2, $100 with prob 1/2) under r(p) = p² and under r(p) = p³, and say what 'risk averse' amounts to in this setup — something like r(1/2) < 1/2, i.e. rejecting the fair coin-flip gamble.

  (b) The real crux. Take G as above, and take the two-stage thing: flip a fair coin; heads you play G, tails you just get $100 for sure. Written as a single one-shot gamble over final outcomes, that's $0 with prob 1/4 and $100 with prob 3/4. Have them compute the REU of that one-shot gamble under r(p) = p², then compute the value of the two-stage version by evaluating each node with REU and working backwards — same r(p) = p² — and explain the gap. The point I want them to land on is that REU is not a function of the final distribution over money: the shape of the tree matters, because the risk function gets applied to cumulative probabilities at each stage. Then have them say which description they think the theory should treat as authoritative, and whether the gap is a bug or the whole point.

  (c) Interpretive, and this is where I want them to be honest. Give the strongest case for each side of (b). In particular I want them to say what a defender has to concede about an agent who, at the outset, ranks the one-shot and the two-stage descriptions of the same final lottery differently — is that just what it is to care about risk, or does it leave the agent open to being pumped? And what would a critic say the theory has to give up to close the gap?

  Deliverables: write the exam question itself (I'll paste it straight in, so it has to be self-contained and readable — it's the last question on a three-hour final, so aim it at about 45 minutes of work), a model answer of about 700 words, and a marking scheme with five must-hit points, marks out of 25, and a one-line note for each about the characteristic way students miss it. I want the marking scheme to seperate a real A from a B, so it should name the specific moves the A answer makes that the B answer doesn't.

  One thing on the model answer: keep a clear line between the parts that are just arithmetic and the parts that people who actually work on this argue about. Don't write up the bug-or-feature bit as if the field had settled it — flag where the disagreement is genuinely live and who would say what.
reasoning: |-
  We are creating an exam question on Risk-Weighted Expected Utility (REU) with three parts (a, b, c). The question must be self-contained and include the necessary machinery. The goal is to force students to engage with the mechanics and not just regurgitate memorized lines.

  Part (a) is a warm-up: show that with r(p)=p, REU becomes EU; compute REU for a simple gamble under r(p)=p² and r(p)=p³; and define risk aversion in this context.

  Part (b) is the crux: compare the one-shot gamble (0 at 1/4, 100 at 3/4) and the two-stage gamble (first flip fair coin: heads then play (0 at 1/2, 100 at 1/2), tails get 100). Compute REU for the one-shot with r(p)=p², then compute the two-stage by backward induction (with r(p)=p² at each stage) and explain the gap. Then discuss which description should be authoritative and whether the gap is a bug or a feature.

  Part (c) is interpretive: present the strongest case for each side (bug vs feature) and discuss implications (e.g., vulnerability to Dutch books, what the theory must give up to avoid the gap).

  The exam question should be clear and self-contained. The model answer should be about 700 words, and the marking scheme should have 5 must-hit points, with a total of 25 marks and notes on common mistakes.

  Let's design the question:

  **Exam Question: Risk-Weighted Expected Utility**

  In this question, we consider the Risk-Weighted Expected Utility (REU) model. We represent a gamble as a finite list of money outcomes, ordered from worst to best: \( x_1 \leq x_2 \leq \dots \leq x_n \), with corresponding probabilities \( p_1, p_2, \dots, p_n \) (which sum to 1). The model uses a *risk function* \( r \), which maps probabilities to probabilities and satisfies:
  - \( r(0) = 0 \),
  - \( r(1) = 1 \),
  - \( r \) is increasing: if \( p < q \) then \( r(p) < r(q) \).

  The REU of a gamble is computed as:
  \[
  \mathrm{REU} = x_1 + \sum_{i=2}^{n} r\left(\sum_{k=i}^{n} p_k\right) \cdot (x_i - x_{i-1})
  \]
  That is, for each gap between consecutive outcomes, the weight applied to the gap \( (x_i - x_{i-1}) \) is \( r \) of the cumulative probability of getting at least \( x_i \).

  **Part (a)** [7 marks]
  (i) Show that if \( r(p) = p \) for all \( p \), then REU reduces to the ordinary expected utility (EU) of the gamble. (You may assume the EU is \( \sum_{i=1}^{n} p_i x_i \).)
  (ii) Consider the gamble \( G \) that yields $0 with probability \( \frac{1}{2} \) and $100 with probability \( \frac{1}{2} \). Compute the REU of \( G \) when \( r(p) = p^2 \) and when \( r(p) = p^3 \).
  (iii) In this model, what does it mean for an agent to be risk averse? Specifically, what condition on \( r \) would imply that the agent rejects the gamble \( G \) (i.e., prefers $50 for sure to \( G \))? Explain briefly.

  **Part (b)** [12 marks]
  Now consider a two-stage gamble. First, a fair coin is flipped. If the coin comes up heads (probability \( \frac{1}{2} \)), then you play gamble \( G \) (as defined in part (a)). If the coin comes up tails (probability \( \frac{1}{2} \)), then you get $100 for sure. This two-stage gamble can also be represented as a one-shot gamble over final money outcomes: with probability \( \frac{1}{4} \) you get $0, and with probability \( \frac{3}{4} \) you get $100.

  (i) Compute the REU of the one-shot representation (with outcomes $0 at \( \frac{1}{4} \) and $100 at \( \frac{3}{4} \)) using the risk function \( r(p) = p^2 \).
  (ii) Compute the REU of the two-stage gamble by working backwards. That is, first compute the REU of \( G \) (using \( r(p)=p^2 \)) as in part (a). Then, at the initial node, you have a gamble that yields the REU of \( G \) (if heads) with probability \( \frac{1}{2} \) and $100 (if tails) with probability \( \frac{1}{2} \). Compute the REU of this initial gamble (again using \( r(p)=p^2 \)).
  (iii) Compare the two values from (i) and (ii). Explain why they are different. What does this difference reveal about how REU treats compound lotteries?
  (iv) Which representation (one-shot or two-stage) do you think should be taken as authoritative for the agent's preferences? That is, which one reflects the agent's actual evaluation of the gamble? Is the difference between the two a bug (a problem for the theory) or a feature (an intended aspect of the theory)? Explain briefly.

  **Part (c)** [6 marks]
  (i) Present the strongest argument in favor of the view that the difference in part (b) is a bug (i.e., a problem for REU) and the strongest argument that it is a feature (i.e., a desirable aspect of REU).
  (ii) Suppose an agent ranks the one-shot and two-stage representations differently (even though they have the same final distribution). What might a defender of REU say to justify this? What might a critic say about the agent's vulnerability to exploitation (e.g., Dutch books)? 
  (iii) If we wanted to eliminate the gap between one-shot and compound representations, what modification to the REU model would be required? (You do not need to give a full model; just indicate the kind of change needed.)

  ---

  **Model Answer**

  **Part (a)**
  (i) Let \( r(p) = p \). Then the REU formula becomes:
  \[
  \mathrm{REU} = x_1 + \sum_{i=2}^{n} \left(\sum_{k=i}^{n} p_k\right) \cdot (x_i - x_{i-1})
  \]
  We can rewrite this by expanding the sum. Note that the coefficient for a particular outcome \( x_j \) (for \( j \geq 2 \)) in the gaps is the sum of the cumulative probabilities for the gaps that include it. Specifically, \( x_j \) appears in the gap from \( x_{j-1} \) to \( x_j \) (with weight \( \sum_{k=j}^{n} p_k \)) and in the gap from \( x_j \) to \( x_{j+1} \) (with weight \( -\sum_{k=j+1}^{n} p_k \))? Actually, we can rearrange:

  Consider the expansion:
  \[
  \mathrm{REU} = x_1 + \left[ r(p_2 + \dots + p_n)(x_2 - x_1) \right] + \left[ r(p_3 + \dots + p_n)(x_3 - x_2) \right] + \dots + \left[ r(p_n)(x_n - x_{n-1}) \right]
  \]
  With \( r(p)=p \), this becomes:
  \[
  = x_1 + (p_2 + \dots + p_n)(x_2 - x_1) + (p_3 + \dots + p_n)(x_3 - x_2) + \dots + p_n (x_n - x_{n-1})
  \]
  Now, let's collect the coefficients for each \( x_i \):
  - For \( x_1 \): \( 1 - (p_2 + \dots + p_n) \) because \( x_1 \) has a positive term \( x_1 \) and then subtracts \( (p_2 + \dots + p_n) x_1 \) in the first gap. Actually, it's easier to expand:

  \[
  = x_1 + (p_2 + \dots + p_n) x_2 - (p_2 + \dots + p_n) x_1 + (p_3 + \dots + p_n) x_3 - (p_3 + \dots + p_n) x_2 + \dots + p_n x_n - p_n x_{n-1}
  \]

  Grouping by \( x_j \):
  - Coefficient of \( x_1 \): \( 1 - (p_2 + \dots + p_n) = p_1 \) (since \( p_1 + p_2 + \dots + p_n = 1 \))
  - Coefficient of \( x_2 \): \( (p_2 + \dots + p_n) - (p_3 + \dots + p_n) = p_2 \)
  - Coefficient of \( x_3 \): \( (p_3 + \dots + p_n) - (p_4 + \dots + p_n) = p_3 \)
  - ...
  - Coefficient of \( x_n \): \( p_n \)

  Thus, \( \mathrm{REU} = \sum_{j=1}^{n} p_j x_j \), which is the expected utility.

  (ii) For gamble \( G \): outcomes \( x_1 = 0 \) (prob 1/2), \( x_2 = 100 \) (prob 1/2). 
  Using the REU formula:
  \[
  \mathrm{REU} = 0 + r\left( p_2 \right) \cdot (100 - 0) = r(1/2) \cdot 100
  \]
  - When \( r(p) = p^2 \): \( r(1/2) = (1/2)^2 = 1/4 \), so REU = \( 1/4 \times 100 = 25 \).
  - When \( r(p) = p^3 \): \( r(1/2) = (1/2)^3 = 1/8 \), so REU = \( 1/8 \times 100 = 12.5 \).

  (iii) The agent is risk averse if they prefer $50 for sure to the gamble G. The sure $50 has utility 50 (if we assume linear utility in money, which we are since outcomes are money and no transformation is applied). So, for the agent to reject G, we require REU(G) < 50. In the REU of G, we have \( r(1/2) \cdot 100 < 50 \), which implies \( r(1/2) < 1/2 \). Therefore, the condition for risk aversion (at least for this gamble) is that \( r(1/2) < 1/2 \).

  **Part (b)**
  (i) One-shot representation: outcomes $0 with prob 1/4, $100 with prob 3/4. Ordered: \( x_1=0, x_2=100 \), with \( p_1=1/4, p_2=3/4 \).
  REU = \( 0 + r\left( p_2 \right) \cdot (100 - 0) = r(3/4) \cdot 100 \).
  With \( r(p)=p^2 \), \( r(3/4) = (3/4)^2 = 9/16 \), so REU = \( (9/16) \times 100 = 56.25 \).

  (ii) Two-stage gamble: 
  - First, compute REU of G (as in part (a)(ii)): with r(p)=p^2, REU(G)=25.
  - Now, at the initial node: we have a gamble that yields 25 (if heads) with prob 1/2 and 100 (if tails) with prob 1/2. So outcomes: 25 and 100. Since 25 < 100, we have \( x_1=25, x_2=100 \), with \( p_1=1/2, p_2=1/2 \).
  REU(initial) = \( 25 + r\left( p_2 \right) \cdot (100 - 25) = 25 + r(1/2) \cdot 75 \).
  With r(p)=p^2, r(1/2)=1/4, so REU = 25 + (1/4)*75 = 25 + 18.75 = 43.75.

  (iii) The REU for the one-shot representation is 56.25, and for the two-stage representation is 43.75. They are different. The difference arises because in the two-stage evaluation, the risk function is applied at each stage. In the first stage, the chance of getting at least 100 in the initial gamble is 1/2 (the tails branch), so the gap weight is r(1/2)=1/4. In the one-shot, the chance of getting at least 100 is 3/4, so the gap weight is r(3/4)=9/16. The theory does not reduce compound lotteries to their one-shot distribution; the way the uncertainty unfolds matters.

  (iv) The REU theory, as presented, treats the two-stage representation as a compound lottery and evaluates it by backward induction. Therefore, the two-stage representation is the authoritative one because the agent is assumed to evaluate the gamble as it is presented. The difference is a feature of the theory because it captures the idea that agents care about the timing of resolution of uncertainty and the way risk is encountered. This is the whole point of the risk-weighted model: it allows for sensitivity to the structure of the gamble.

  **Part (c)**
  (i) The strongest argument for the bug view is that two representations of the same final distribution (1/4 chance of $0, 3/4 chance of $100) are evaluated differently. This violates the principle of description invariance, which is a normative requirement for rationality. It leaves the agent open to Dutch books: if the agent prefers the one-shot representation (value 56.25) over the two-stage (43.75), then a bookie could sell the one-shot and then replace it with the two-stage (which is identical in final outcomes) and the agent would pay to switch back, leading to a sure loss.

  The strongest argument for the feature view is that the two-stage gamble involves an early confrontation with risk: at the first coin flip, there is a 50% chance of having to face the risky gamble G (which the agent dislikes). The one-shot representation hides this intermediate risk. REU captures the intuition that agents are not only concerned with final outcomes but also with when and how risk is resolved. This is a desirable feature for descriptive purposes and aligns with the common aversion to early resolution of bad risks.

  (ii) A defender of REU would say that the agent's different rankings reflect a genuine concern for the structure of risk. The agent is not indifferent to how the uncertainty unfolds, and that is a legitimate aspect of preference. The critic would argue that this leaves the agent open to exploitation via Dutch books, as described above.

  (iii) To eliminate the gap, we would need the REU to be linear in probabilities or to satisfy the reduction of compound lotteries. Specifically, we would require that the risk function is linear, i.e., r(p)=p, which would collapse to expected utility. Alternatively, we could modify the REU model to apply the risk function only to the final distribution, but that would change the theory fundamentally (and it would no longer be the original REU).

  ---

  **Marking Scheme** (Total 25 marks)

  **Must-Hit Points** (each worth a portion of the marks, but the 5 key points are):

  1. **Part (a)(i): Correct reduction to EU.** [3 marks]  
     - Must show step-by-step that when r(p)=p, REU becomes the expected value.  
     - Common mistake: Just stating that it becomes EU without showing the algebra.

  2. **Part (a)(ii): Correct computations for both r(p)=p² and r(p)=p³.** [2 marks]  
     - 1 mark for each: 25 and 12.5.  
     - Common mistake: Using the wrong cumulative probability (e.g., r(1/2) for the gap).

  3. **Part (a)(iii): Correct condition for risk aversion (r(1/2) < 1/2) and explanation.** [2 marks]  
     - Common mistake: Saying risk aversion is r concave without connecting to the specific gamble.

  4. **Part (b)(i): Correct REU for one-shot (56.25).** [2 marks]  
     - Common mistake: Misidentifying the cumulative probability (e.g., using r(1/4) for the gap).

  5. **Part (b)(ii): Correct backward induction (43.75).** [3 marks]  
     - Steps: REU of G is 25, then REU of (25, 100) with probs (1/2,1/2) is 25 + (1/4)*75 = 43.75.  
     - Common mistake: Not computing REU at the initial node correctly (e.g., using the outcomes without evaluating the subtree).

  6. **Part (b)(iii): Explanation of the gap (due to applying the risk function at each stage).** [3 marks]  
     - Must mention that the cumulative probabilities at each stage are different (1/2 in the two-stage vs 3/4 in the one-shot for the chance of $100 or better).  
     - Common mistake: Just stating they are different without explaining why.

  7. **Part (b)(iv): Authoritative representation and bug/feature.** [2 marks]  
     - Must say the two-stage is authoritative because REU evaluates compound lotteries by backward induction.  
     - Must recognize the gap as a feature (intended) because it captures the structure of risk.  
     - Common mistake: Saying the one-shot is authoritative or that the gap is a bug.

  8. **Part (c)(i): Strongest arguments for both sides.** [2 marks]  
     - Bug: Violation of description invariance/Dutch book.  
     - Feature: Captures the timing of risk resolution.  
     - Common mistake: Only giving one side or weak arguments.

  9. **Part (c)(ii): Defender's justification and critic's exploitation argument.** [2 marks]  
     - Defender: Genuine concern for risk structure.  
     - Critic: Dutch book vulnerability.  
     - Common mistake: Not mentioning Dutch books.

  10. **Part (c)(iii): Modification required (linear r or reduction to final distribution).** [1 mark]  
      - Common mistake: Suggesting changes that do not address the reduction of compound lotteries.

  But note: the question asks for five must-hit points to separate A from B. We have 10 items above, but we can group into 5 key points that are critical for an A:

  **Five Must-Hit Points for High Marks (A vs B):**

  1. **Correct algebraic derivation in (a)(i).** (Shows understanding of the REU formula) [3 marks]
  2. **Correct computation of the gap in (b): 56.25 vs 43.75.** (Shows ability to apply the formula in compound settings) [5 marks: 2 for (b)(i), 3 for (b)(ii)]
  3. **Explanation of the gap as due to stage-wise application of r.** (Shows understanding of the mechanics) [3 marks in (b)(iii)]
  4. **Recognition that the two-stage is authoritative and the gap is a feature.** (Shows grasp of the theory's intent) [2 marks in (b)(iv)]
