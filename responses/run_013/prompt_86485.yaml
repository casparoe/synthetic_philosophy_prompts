answer: |-
  ### Exam Question: Risk-Weighted Expected Utility

  **Background:**  
  In this question, we explore Risk-Weighted Expected Utility (REU), a model of decision-making under risk. A *gamble* is defined as a finite list of monetary outcomes \(x_1 \leq x_2 \leq \dots \leq x_n\) with probabilities \(p_1, p_2, \dots, p_n\) (summing to 1). The model uses a *risk function* \(r\) mapping probabilities to probabilities, with:  
  - \(r(0) = 0\),  
  - \(r(1) = 1\),  
  - \(r\) increasing (if \(p < q\), then \(r(p) < r(q)\)).  

  The REU of a gamble is computed as:  
  \[
  \mathrm{REU} = x_1 + \sum_{i=2}^{n} r\left(\sum_{k=i}^{n} p_k\right) \cdot (x_i - x_{i-1}).
  \]  
  Here, each gap \((x_i - x_{i-1})\) is weighted by \(r\) of the cumulative probability of getting at least \(x_i\).  

  **Part (a)** [7 marks]  
  (i) Show that if \(r(p) = p\) for all \(p\), then REU reduces to ordinary expected utility (EU). (Recall EU is \(\sum_{i=1}^n p_i x_i\).)  
  (ii) Compute the REU for gamble \(G = (\$0 \text{ with prob } \frac{1}{2}, \$100 \text{ with prob } \frac{1}{2})\) under:  
  - \(r(p) = p^2\),  
  - \(r(p) = p^3\).  
  (iii) In REU, what condition on \(r\) implies risk aversion for \(G\)? Specifically, when would an agent prefer \(\$50\) for sure over \(G\)? Explain briefly.  

  **Part (b)** [12 marks]  
  Consider a two-stage gamble:  
  - Stage 1: Flip a fair coin (heads: probability \(\frac{1}{2}\), tails: probability \(\frac{1}{2}\)).  
  - Stage 2: If heads, play gamble \(G\) (from part (a)). If tails, get \(\$100\) for sure.  

  This two-stage gamble is equivalent to a one-shot gamble with outcomes \(\$0\) (probability \(\frac{1}{4}\)) and \(\$100\) (probability \(\frac{3}{4}\)).  
  (i) Compute the REU of the one-shot gamble (\(\$0\) at \(\frac{1}{4}\), \(\$100\) at \(\frac{3}{4}\)) using \(r(p) = p^2\).  
  (ii) Compute the REU of the two-stage gamble using backward induction and \(r(p) = p^2\):  
  - First, compute the REU of \(G\) (using \(r(p) = p^2\)).  
  - Then, treat the initial node as a gamble between the REU of \(G\) (if heads) and \(\$100\) (if tails), and compute its REU.  
  (iii) Compare the results from (i) and (ii). Explain why they differ.  
  (iv) Which representation (one-shot or two-stage) should be considered authoritative for the agent’s preferences? Is the difference a *bug* (a flaw in REU) or a *feature* (an intended property)? Explain briefly.  

  **Part (c)** [6 marks]  
  (i) Give the strongest argument for why the difference in part (b) is a *bug* and the strongest argument for why it is a *feature*.  
  (ii) Suppose an agent ranks the one-shot and two-stage versions differently. What would a defender of REU say to justify this? What would a critic say about the agent’s vulnerability to exploitation?  
  (iii) To eliminate the gap between one-shot and compound evaluations, what must REU give up? (Briefly indicate; no need for details.)  

  ---

  ### Model Answer  
  **Part (a)**  
  (i) If \(r(p) = p\), REU becomes:  
  \[
  \mathrm{REU} = x_1 + \sum_{i=2}^{n} \left(\sum_{k=i}^{n} p_k\right) (x_i - x_{i-1}).  
  \]  
  Expanding the sum:  
  - Coefficient of \(x_1\): \(1 - \sum_{k=2}^n p_k = p_1\) (since probabilities sum to 1).  
  - Coefficient of \(x_i\) (for \(i \geq 2\)): \(\sum_{k=i}^n p_k - \sum_{k=i+1}^n p_k = p_i\).  
  Thus, \(\mathrm{REU} = \sum_{i=1}^n p_i x_i\), which is EU.  

  (ii) For \(G\), outcomes are \(x_1 = 0\) (\(p_1 = \frac{1}{2}\)), \(x_2 = 100\) (\(p_2 = \frac{1}{2}\)). REU is:  
  \[
  \mathrm{REU} = 0 + r\left(p_2\right) \cdot (100 - 0) = r\left(\frac{1}{2}\right) \cdot 100.  
  \]  
  - With \(r(p) = p^2\): \(r\left(\frac{1}{2}\right) = \left(\frac{1}{2}\right)^2 = \frac{1}{4}\), so \(\mathrm{REU} = 25\).  
  - With \(r(p) = p^3\): \(r\left(\frac{1}{2}\right) = \left(\frac{1}{2}\right)^3 = \frac{1}{8}\), so \(\mathrm{REU} = 12.5\).  

  (iii) An agent prefers \(\$50\) for sure over \(G\) if \(\mathrm{REU}(G) < 50\). Since \(\mathrm{REU}(G) = r\left(\frac{1}{2}\right) \cdot 100\), this requires \(r\left(\frac{1}{2}\right) < \frac{1}{2}\). Risk aversion is implied by \(r(p) < p\) for \(p = \frac{1}{2}\).  

  **Part (b)**  
  (i) One-shot gamble: \(x_1 = 0\) (\(p_1 = \frac{1}{4}\)), \(x_2 = 100\) (\(p_2 = \frac{3}{4}\)). REU is:  
  \[
  \mathrm{REU} = 0 + r\left(p_2\right) \cdot (100 - 0) = r\left(\frac{3}{4}\right) \cdot 100.  
  \]  
  With \(r(p) = p^2\), \(r\left(\frac{3}{4}\right) = \left(\frac{3}{4}\right)^2 = \frac{9}{16}\), so \(\mathrm{REU} = 56.25\).  

  (ii) Two-stage gamble:  
  - REU of \(G\) (from (a)(ii)): 25.  
  - Initial node: Gamble between 25 (heads, prob \(\frac{1}{2}\)) and 100 (tails, prob \(\frac{1}{2}\)). Outcomes ordered as \(x_1 = 25\), \(x_2 = 100\). REU is:  
  \[
  \mathrm{REU} = 25 + r\left(p_2\right) \cdot (100 - 25) = 25 + r\left(\frac{1}{2}\right) \cdot 75.  
  \]  
  With \(r(p) = p^2\), \(r\left(\frac{1}{2}\right) = \frac{1}{4}\), so \(\mathrm{REU} = 25 + 18.75 = 43.75\).  

  (iii) The REU values differ: 56.25 (one-shot) vs. 43.75 (two-stage). The gap arises because REU applies the risk function *at each stage* of the compound gamble. In the two-stage version, the risk function weights the gap using the local cumulative probability (\(\frac{1}{2}\) for tails), whereas the one-shot uses the final cumulative probability (\(\frac{3}{4}\)). REU is sensitive to the *structure of uncertainty resolution*, not just the final distribution.  

  (iv) The two-stage representation should be authoritative because REU evaluates compound gambles via backward induction (the agent experiences uncertainty sequentially). The difference is a *feature*: it captures how agents care about the timing and nesting of risks (e.g., aversion to early exposure to downside risk).  

  **Part (c)**  
  (i)  
  - *Bug argument*: The difference violates **description invariance** (rational agents should not care about equivalent descriptions of the same final lottery). This leaves agents vulnerable to Dutch books: e.g., if an agent prefers the one-shot (56.25) over the two-stage (43.75), a bookie could "sell" the one-shot and "buy back" the two-stage, exploiting the inconsistent valuations for guaranteed profit.  
  - *Feature argument*: The difference reflects **real psychological attitudes toward risk resolution**. Agents may dislike the two-stage gamble because it exposes them to an immediate 50% chance of a low-payoff subtree (G), even if the final outcomes are identical. This is descriptively accurate and allows REU to model anxiety about nested risks.  

  (ii)  
  - *Defender*: Ranking differences are legitimate—they encode preferences over *how risk unfolds* (e.g., agents may prefer "late resolution" of bad outcomes). REU respects this as rational.  
  - *Critic*: This agent is exploitable via Dutch books (as in (i)), violating **dynamic consistency**. The theory sacrifices normative robustness for descriptive flexibility.  

  (iii) To close the gap, REU must assume **reduction of compound lotteries** (treating compound and one-shot gambles identically). This requires \(r\) to be linear (\(r(p) = p\)), collapsing REU to EU—abandoning its core innovation.  

