  You're a philosopher who has spent a career on aggregation, thresholds and risk, and I'd like you to think carefully here rather than give me the standard tour. I'm a retired radiation biologist; for thirty-odd years my job was to do the kind of arithmetic that makes philosophers wince. Take a dose so small that no individual's risk rises by anything you could ever measure, multiply it by a few hundred million people, and the sum is a real number that goes into a real regulation — the linear no-threshold framework basically runs on that move. So when I started reading philosophy in retirement and came across the old puzzle about one person being tortured for fifty years versus a googolplex of people each getting one speck of dust in the eye for a second, I assumed I'd land on the add-it-all-up side. I don't, and I can't tell wether that's a considered judgment or just squeemishness about large numbers. Before you answer, brainstorm a little for yourself: what is the disagreement here actually about? Then give me the most important implications. What follows for someone like me, who spent a working life helping to justify rules that rest on summing harms that are negligible one by one? Should I have thought differently about my sums, and if so, where exactly does the reasoning go wrong? One thing I keep tripping over: in the puzzle the specks are certain, trivial harms, whereas my numbers were always tiny probabilities of serious harm, and I suspect that changes what can be added to what. If you think the puzzle is rigged, or that "which is worse" is the wrong question, say so and argue it. Continuous prose only, please — no headings, bullets, bold or tables, just paragraphs, the way you'd write a long letter to a colleague who can take it.
