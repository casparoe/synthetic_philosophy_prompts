answer: |-
  Below is a restatement of the Hart-Fuller debate using compiler/language standard vocabulary, followed by a residue analysis. I’ll adhere to British English and your specified analogues.

  ---

  ### **Restatement in Compiler Vocabulary**  
  **Hartian Positivism (Standard as Rule of Recognition)**  
  - **Rule of Recognition = Language Standard + Committee Revision Process**: The standard document and its committee-driven evolution define what constitutes a "conforming program". Validity is purely procedural: if a program compiles without diagnostics under a standard-compliant implementation, it is well-formed and valid.  
  - **Valid Legal Norm = Conforming Program**: A program that satisfies the standard’s syntax, constraints, and semantics is "lawful".  
  - **Undefined Behaviour (UB) as Open Texture**: UB represents gaps where the standard intentionally withholds guarantees (e.g., dereferencing `nullptr`). Implementations may resolve UB arbitrarily, reflecting Hart’s "penumbra of uncertainty".  
  - **Implementation-Defined Behaviour (IB) as Delegated Discretion**: IB grants implementers freedom (e.g., `sizeof(int)`) but requires documentation—analogous to delegated rulemaking.  
  - **Conformance as Obligation**: A compiler engineer’s "internal viewpoint" treats conformance as binding; deviations (e.g., language extensions) are non-portable and non-conforming.  

  **Fullerian Natural Law (Legitimacy Constraints)**  
  - **Inner Morality = Legitimate Standard Design**: Fuller’s eight desiderata translate to constraints ensuring the standard is:  
    - **General, Public, Prospective**: Rules must not target specific programs (generality), be documented (publicity), and avoid retroactive breaking changes (prospectivity).  
    - **Clear, Non-Contradictory, Possible**: Syntax/semantics must be unambiguous (clarity), avoid conflicting requirements (non-contradiction), and not demand impossible behaviour (e.g., no `while(true)` if termination is required).  
    - **Stable, Congruent**: Revisions (via committee) must preserve backward compatibility (stability), and implementations must adhere to the standard (congruence—no covert non-compliance).  
  - **Illegitimate Standard**: A standard violating these (e.g., mandating logically impossible optimisations) loses legitimacy. Conforming programs may "work" but lack moral authority.  

  ---

  ### **Residue Report**  
  **What Translates Cleanly**  
  1. **Rule of Recognition → Committee Process**: The iterative, procedural nature of standard revisions mirrors Hart’s rule of recognition.  
  2. **Open Texture → UB**: Both acknowledge necessary gaps where predictability is sacrificed for flexibility.  
  3. **Delegated Discretion → IB**: Implementers, like officials, exercise bounded freedom.  
  4. **Fuller’s Principles → Standard Design Ethics**: Clarity, consistency, and feasibility directly map to compiler engineering concerns (e.g., avoiding ambiguous grammar).  

  **What Translates with Distortion**  
  1. **Internal Point of View**: A programmer’s "binding" attitude toward standards resembles legal obligation but is **instrumental**, not normative. Conformance ensures portability/efficiency—not moral duty. The residue is *pragmatism*, not *oughtness*.  
  2. **Grudge Informant Test**: Fuller’s unjust-but-valid law (e.g., Nazi informant statute) has no clean analogue. A "conforming but harmful" program (e.g., exploiting UB for security flaws) is seen as *defective design*, not moral failure. The standard lacks a "morality" filter.  
  3. **Normativity of Obligation**: Conformance is a technical requirement; violating it yields a compiler error—not guilt. Legal "obligation" carries thicker, social normativity lost in translation.  

  **What Cannot Be Expressed**  
  1. **Law vs. Morality Distinction**: In compilers, "ought" (e.g., "programs *should* avoid UB") is advisory; in law, it’s contested ontology. Fuller’s fusion of morality/legality has no counterpart—standards are amoral tools.  
  2. **Open Texture’s Depth**: Legal open texture involves *interpretive judgment* (e.g., "reasonable doubt"). UB/IB lack this; they are resolved by implementations deterministically, not through deliberation.  
  3. **Committee Authority vs. Moral Gravity**: The committee’s revisions are technical, not moral. Fuller’s critique that "law must aspire to justice" cannot map—justice is irrelevant to `-O3` optimisations.  

  ---

  ### **Critical Residue Analysis**  
  1. **Internal Point of View as Pragmatism**: The programmer’s "binding" sense reduces to *utility*: "I follow C++23 because otherwise my code breaks". Hart’s "acceptance as common standard" survives only as collective engineering practice.  
  2. **Normativity Lost**: Conformance is a functional checkbox—**no residue of obligation remains**. A segfault is not "punishment"; it’s causal outcome.  
  3. **Grudge Informant Vacuum**: A program exploiting UB to leak data is "non-portable", not "unjust". The moral dimension evaporates.  
  4. **Is/Ought Distinction Collapses**: In standards, "is" (the spec) and "ought" (best practices) blur. Committee proposals often embed technical "oughts" (e.g., "don’t use `rand()`"), but these lack normative weight.  

  ---

  ### **Conclusion: Defect in Vocabulary or Legal Clarity?**  
  The residue points to **both**:  
  - **Compiler Vocabulary’s Limits**: It is descriptive and instrumental, stripping away normativity, morality, and the hermeneutic depth of legal interpretation. Open texture becomes a *bug*, not a *feature*.  
  - **Legal Debate’s Over-Abstraction**: Hart/Fuller treat "law" as a coherent ontological category. But standards reveal that **authority without justice is mundane**—committee drafts lack the gravitas of legislatures. Fuller’s inner morality, when applied to ISO C++, feels like *style guidelines*—important, but not "moral".  

  The exercise exposes a truth: **law’s perceived normativity relies on social context**, absent in compilers. Where Hart saw rules, and Fuller saw morality, engineers see constraints and edge cases—a useful demystification.  

  ---  
