prompt: |-
  I'm helping a small foundation decide where to put about $300k over two years on consequentialist cluelessness — the worry that we can't know the long-run consequences of what we do, so the instruction to maximize expected value gives us nothing to act on. Enough for three or four people part-time. I want a defended agenda, not a survey: which open questions in this area most deserve that money, ranked, with the reasoning for the ordering.

  Two things I keep chewing on — use them as raw material. First, I've been splitting the phenomenon into sign-blindness (you can roughly guess how big an effect is but not which way it goes, so your expected value is dominated by not knowing the sign) and magnitude-blindness (the direction is obvious, the size could be off by orders of magnitude). Is that cut doing real work, or is it two names for the same ignorance? Second, I suspect a lot of the literature is really about whether cluelessness is a problem for consequentialism specifically or for any attempt to reason about what to do, and I think those two pay off very differently. Tell me if I'm wrong on either.

  For each question, say why it's upstream of the others (or isn't), whether it's tractable for someone who can't go run their own empirical studies, and what would move it up or down the list. Be explicit about what's settled and what's genuinely contested among people who know this area — don't feed me a contested view as the consensus. Just the list: exactly five items, a sentence or two each, no intro or conclusion.
reasoning: |-
  Hmm, the user is helping a small foundation allocate $300k over two years to tackle "consequentialist cluelessness" - that nagging uncertainty about whether our actions actually lead to good long-term outcomes. They want a prioritized list of research questions, not just a survey. I need to give them exactly five items, ranked with clear reasoning.

  The user mentions two concepts they're wrestling with: "sign-blindness" (not knowing if an effect is positive or negative) and "magnitude-blindness" (knowing direction but not size). They also wonder if cluelessness is specifically a problem for consequentialism or for decision-making in general. I should acknowledge these but stay focused on their request.

  For each research question I suggest, I must explain: Why it's upstream (fundamental to others), whether it's tractable without new empirical studies, and what would change its priority. I also need to flag what's settled versus contested in the field - no pretending contested views are consensus.

  Let me brainstorm potential research areas. First is probably understanding how cluelessness affects decision frameworks - is this unique to consequentialism? That seems foundational. Then we need tools to navigate different types of uncertainty (like their sign/magnitude distinction). Third could be mapping what we're actually clueless about - some domains might be less uncertain than we think. Fourth, improving our methods for comparing actions despite uncertainty. Finally, exploring how cluelessness changes when we coordinate actions across multiple actors.

  For the ranking: Question 1 should be most fundamental - if cluelessness undermines all decision-making, that reshapes everything. Question 2 builds directly on the user's sign/magnitude framing. Question 3 is practical but relies on groundwork from earlier questions. Question 4 is application-focused, while Question 5 addresses scale but assumes progress elsewhere.

  Tractability matters: All these can be tackled theoretically or with existing data - no new empirical studies needed. I'll note what moves priorities - like if we resolve Question 1, it might lower Question 4's urgency.

  Finally, I'll be explicit about controversies: For instance, whether sign/magnitude blindness is a useful distinction isn't settled, and there's debate about how much we can reduce cluelessness at all.
answer: |-
  Here is your ranked list of five research questions, following all constraints:

  1.  **Is cluelessness a unique problem for *consequentialism*, or an inescapable feature of *any* normative decision theory under deep uncertainty?** (Upstream because it determines if the problem requires modifying consequentialism or developing general decision tools. Tractable via philosophical analysis and formal modeling. Moves up if evidence suggests non-consequentialist theories face identical challenges, down if robust alternatives emerge. Genuinely contested: significant disagreement exists on whether rival theories (e.g., deontology, virtue ethics) evade the core epistemic problem.)

  2.  **Does distinguishing sign-blindness and magnitude-blindness productively guide different strategies for mitigating cluelessness (e.g., robustness analysis vs. value of information)?** (Upstream by categorizing uncertainty types for targeted solutions. Tractable via conceptual analysis, case studies of existing interventions, and decision theory. Moves up if distinct strategies demonstrably succeed for each type; down if the distinction proves operationally irrelevant. Contested: While the *phenomena* are recognized, the *utility* of this specific categorization for action-guidance is not settled.)

  3.  **Can we identify specific cause-effect domains where long-term cluelessness is *genuinely irreducible* vs. domains where targeted research (e.g., systems modeling, historical analysis) can significantly reduce uncertainty?** (Upstream for prioritizing research efforts and resource allocation. Tractable via meta-analysis of forecasting accuracy, systems complexity theory, and historical case studies. Moves up if clear criteria for irreducibility emerge; down if all domains appear equally clueless. Contested: Deep disagreement exists on the potential for reducing long-term cluelessness in *any* domain; some view it as structural, others as a tractable ignorance.)

  4.  **What normative decision procedures (e.g., satisficing, robust optimization, maximizing expected value under constrained hypotheses) are *most resilient* under conditions of severe sign-blindness or magnitude-blindness?** (Builds on Q1 & Q2 to offer actionable guidance. Tractable via formal modeling (simulations, decision theory) and comparison against benchmark problems. Moves up if clear front-runners emerge with strong justifications; down if all procedures show crippling flaws under cluelessness. Contested: No consensus on the best procedure; debates rage between proponents of expected value (with caveats), precautionary principles, and alternatives.)

  5.  **How does the aggregation of actions by multiple actors (e.g., coordination, threshold effects, strategic interaction) change the nature and severity of cluelessness compared to individual actions?** (Addresses real-world context but relies on foundations from Q1-Q4. Tractable via game theory, institutional analysis, and modeling collective action problems under uncertainty. Moves up if collective action shows unique leverage points for reducing cluelessness; down if it merely compounds individual uncertainty. Contested: The *direction* of aggregation's effect (mitigating vs. exacerbating) and the best strategies for collective action under cluelessness are actively debated.)
