prompt: |-
  For some time I have been following the long-running disputes between archaeologists and proponents of a lost advanced civilisation — the Atlantis and ancient-astronaut literature and its relatives — and I keep encountering a style of argument for which I have no name. Its structure is not the naive one of citing a single decisive discovery. Rather, the proponent assembles a heterogeneous collection of small incongruities: an artefact that someone says resembles a modern device, a drawing that someone says depicts an aircraft, a map that someone says reproduces a coastline that could not have been known, a word that someone says is a loanword from a distant culture. Each item, taken alone, is weak, and the orthodox reply to each is different and locally plausible — the object is a ritual item, the drawing is a bird, the map is simply inaccurate, the resemblance is coincidence. The proponent's response is not to defend any one item but to appeal to their number, often with an explicit probabilistic flourish: what are the odds, they ask, that all of these should be coincidences? And from this they conclude that the best explanation is the existence of the lost civilisation.

  Two things about this trouble me, and I want to know whether either has been named. The first is that the items are not independent in the way the probabilistic flourish requires: several are the same disputed object redescribed, or one author's assertion repeated by another, so the "many" is smaller than it looks and the multiplication of improbabilities is not licensed. The second is harder for me to state. Even granting genuine multiplicity, there seems to be something illicit about moving from "the orthodox account has no tidy explanation for each of these" to "therefore the heterodox account is probably true," when the heterodox account does not itself predict the items in any specific way. But I suspect this second worry is not quite right either, because there are cases — in the history of science and in forensic reasoning — where a heap of otherwise-unexplained observations really does justify a new hypothesis, and I cannot say what separates those cases from this one.

  So: is there an established name or treatment for this pattern — the aggregation of individually inconclusive anomalies, sold by their number and by a spurious multiplication of probabilities, into support for a hypothesis that predicts none of them individually? If the phenomenon has no settled name, please coin one and define it, and in either case tell me how it stands to the nearest things I do know: argument from ignorance, the Gish gallop, the conjunction fallacy, and whatever the philosophy of science has to say about the evidential weight of anomalies. What I am after is not a label but the carving — what exactly the move is, what it is not, where the line falls between an illegitimate pile of anomalies and a legitimate one, and whether the legitimate version can be specified without begging the question against the heterodox side.
reasoning: |-
  Okay, the user is wrestling with a specific argumentative pattern they've observed in debates about lost civilizations like Atlantis. They've noticed proponents amassing multiple weak anomalies—artifacts, drawings, maps, linguistic quirks—and using their collective weight to claim probability favors a heterodox explanation. The user sees two core problems: the anomalies aren't independent (undermining probability math), and the leap from "orthodoxy struggles" to "heterodoxy wins" feels illicit. 

  Hmm. This is sophisticated. The user isn't falling for obvious fallacies; they're spotting nuanced epistemic cracks. Their frustration is palpable—they want to name and dissect this move, not just dismiss it. The second worry about legitimate vs. illegitimate anomaly-heaps is especially thorny. They mention scientific revolutions where anomalies did justify new theories, so they're aware this isn't black-and-white. 

  First, let's validate their intuition: yes, the non-independence issue is real. Many "anomalies" are parasitic on prior claims or reinterpretations. A single odd artifact might spawn ten derivative articles, creating an illusion of multiplicity. That's not evidence multiplication—it's evidence inflation. 

  The deeper issue is explanatory asymmetry. The orthodox account might have patchy explanations for each anomaly (e.g., "that could be a bird or a ritual object"), but the heterodox account doesn't actually predict these specifics—it just retrofits them. Contrast this with, say, Mercury's orbit: Einstein's relativity specifically predicted the anomaly's exact value. That's predictive power; Atlantis theories merely absorb vagueness. 

  The closest existing term is "anomaly accumulation," but it lacks the probabilistic overreach. I'll coin "probabilistic bundling fallacy" to capture the fake math veneer. For the explanatory gap, "explanatory opportunism" fits—the theory doesn't guide evidence; evidence drags the theory. 

  Legitimate anomaly use? Three litmus tests: (1) Anomalies must resist accommodation within orthodoxy without absurd contortions; (2) The new theory must predict novel facts beyond retrofitting old puzzles; (3) Anomalies should cluster around a mechanism the theory explains. Atlantis theories fail all three. 

  User might still wonder: "But what if orthodoxy is dogmatic?" Fair—but the burden shifts to heterodoxy to make testable predictions. Until then, the pile of "maybes" stays just that.
answer: |-
  You've identified a profound and pervasive argumentative pattern that straddles epistemology, probability, and scientific reasoning. It lacks a single universally accepted name, but it can be precisely dissected and named. Here's the breakdown:

  ### 1. **The Core Fallacy: "Probabilistic Bundling of Non-Independent Anomalies"**
     - **Description**: Aggregating multiple weak, ambiguous, or disputed pieces of evidence, treating them as independent observations, and falsely multiplying their individual improbabilities to claim overwhelming support for a hypothesis.
     - **Why it fails**:
       - **Non-Independence**: As you noted, many anomalies are reinterpretations of the same data (e.g., the same artifact described as "ritual object" vs. "advanced tech"), or derive from a single source amplified through repetition. This violates the statistical assumption of independence, making probability multiplication invalid.
       - **Ad Hoc Nature**: The anomalies aren't *predicted* by the hypothesis (e.g., Atlantis). They are retroactively gathered and interpreted through its lens. This reverses proper scientific inference.
       - **Asymmetry of Burden**: Orthodoxy must explain each anomaly *separately*, while heterodoxy avoids specific predictions. The heterodox "explanation" is often unfalsifiable ("Atlantis did it").

  ### 2. **Your Second Concern: The Illicit Leap from "Orthodoxy Fails" to "Heterodoxy Wins"**
     This is the deeper epistemological flaw. It conflates two distinct issues:
     - **Weakness of Orthodoxy**: Current models may have gaps or imperfect explanations for some anomalies.
     - **Strength of Heterodoxy**: The alternative must provide *positive evidence* and *testable predictions*.
     
     The fallacy assumes these are the only two options (false dilemma) and ignores:
     - Unknown unknowns (future orthodox explanations).
     - Other unconsidered hypotheses.
     - That the heterodox theory may explain *nothing else* beyond these cherry-picked anomalies.

  ### 3. **Names and Related Concepts**
     - **Best Existing Term**: **Anomaly Accumulation** (used in philosophy of science/skepticism).  
     - **More Precise Coinage**: **The Syncretistic Probability Fallacy** (emphasizing forced synthesis of disparate anomalies + probabilistic misuse).  
     - **Nearest Kin**:
       - **Conjunction Fallacy**: Misjudging P(A & B & C...) as > P(any single item). Related, but not identical.  
       - **Gish Gallop**: Overwhelming with quantity, but lacks probabilistic dressing.  
       - **Argument from Ignorance**: "We can't explain X, therefore Y." This is a component, but your case adds faux-probabilistic bundling.  
       - **Texas Sharpshooter Fallacy**: Firing shots randomly, then drawing a target around the hits. Perfectly captures selective use of anomalies.

  ### 4. **Legitimate vs. Illegitimate Anomaly Use**
     Legitimate scientific revision uses anomalies **only when**:
     - **Consilience**: Anomalies converge on a *single, coherent* mechanism (e.g., Mercury's orbit anomaly + light bending both supporting relativity).  
     - **Predictive Novelty**: The new theory predicts *new, specific* phenomena later confirmed (e.g., cosmic microwave background radiation predicted by Big Bang theory).  
     - **Explanatory Scope**: The theory explains *more than just the anomalies* it was invented for.  
     
     **Atlantis-type theories fail these tests**:  
     - Their "anomalies" are globally/culturally disparate with no coherent causal link.  
     - They predict nothing new or testable.  
     - They explain only the anomalies they retroactively collect.

  ### 5. **Philosophy of Science Perspective**
     - **Lakatos' "Research Programmes"**: Orthodoxy can tolerate "auxiliary hypotheses" to explain anomalies without collapsing. Heterodoxy must prove it's "progressive" (predicts novel facts), not "degenerative" (only reinterprets old data).  
     - **Kuhn's "Paradigm Shifts"**: Anomalies alone don't topple paradigms; a *better* paradigm must emerge.  
     - **Bayesian Critique**: Each anomaly must update the *likelihood* P(Evidence | Hypothesis). If P(E | Heterodoxy) is vague or arbitrarily defined (e.g., "Atlantis might leave some artifacts"), the probability update is negligible.

  ---

  ### Why This Isn't Scientific Revision (e.g., Continental Drift)
  When Wegener proposed continental drift, skeptics listed anomalies (e.g., fossil distributions). But:  
  - Wegener predicted *new* patterns (e.g., rock strata continuity).  
  - A *mechanism* (plate tectonics) later explained anomalies + made novel predictions.  
  - Anomalies were geologically *coherent*, not a random global assortment.  

  Atlantis theories lack this predictive and mechanistic rigor. The "evidence" is a disconnected heap of reinterpreted cultural outputs, not unexplained empirical data demanding a new causal model.

  ### In Summary
  The move is **Syncretistic Probability Fallacy**: Bundling non-independent, ambiguous anomalies under an unfalsifiable hypothesis, then misapplying probability to simulate rigor. It's illegitimate when:  
  1. Anomalies lack independence,  
  2. The hypothesis predicts nothing specific,  
  3. No consilience or novel prediction exists.  

  Legitimate anomaly-driven science requires a hypothesis that *outperforms* orthodoxy in explanatory depth, coherence, and prediction—not just exploiting gaps. This standard doesn't beg the question; it demands heterodoxy meet the same burden all theories face: **What can you predict that I couldn't have guessed?**
