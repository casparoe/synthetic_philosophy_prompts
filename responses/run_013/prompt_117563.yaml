answer: |-
  Based on your precise and insightful description, this structural pattern **does not have a single, universally established term** within historiography or critical theory that captures its *specific formal properties* – particularly the "hinge" of contact and the survival of the asymmetry despite critical intent. However, it is a widely recognized and critiqued phenomenon. Below is a breakdown, including a proposed term, definitions, distinctions, and boundary cases.

  **The Core Phenomenon:** **Contact-Contingent Causality (CCC)** or **Eurocentric Agency Asymmetry (EAA)**

  *   **Proposed Term:** **Contact-Contingent Causality (CCC)** *(Best captures the structural hinge)*
      *   *Alternative:* **Eurocentric Agency Asymmetry (EAA)** *(Best captures the core imbalance)*
  *   **Definition:** A structural narrative pattern in global history where:
      1.  **Pre-Contact:** The development, stasis, or dynamics of a non-European society (Society X) are explained primarily or exclusively by *internal* factors (ecology, politics, culture, ideas, rivalries, innovations) OR are dismissed as inherently static/unchanging.
      2.  **Post-Contact:** The development, changes, or trajectory of Society X are explained primarily or exclusively by the *external* actions, influences, or interventions of European actors. Internal factors within Society X are relegated to background context, local color, reaction, resistance, or irrelevance.
      3.  **Asymmetrical Counterpart:** European developments, both before and *during/after* contact with Society X, are consistently explained by *internal* factors (social, economic, political, intellectual dynamics within Europe), even when engaging with the wider world. Non-European societies primarily appear in the European narrative as objects of action (targets, obstacles, resources, inspirations absorbed into European development) rather than as co-equal agents driving change in Europe itself.
      4.  **The Hinge:** The moment of "sustained contact" acts as the decisive structural pivot shifting the causal framework applied to Society X from internal to external.
      5.  **Independence from Sympathy:** The pattern can persist even in narratives highly critical of European actions (e.g., highlighting exploitation, violence, destruction). This critical stance does not restore causal agency to Society X post-contact; Europe remains the *only active causal force*, albeit a negative one.
      6.  **Formal Property:** It is fundamentally about the *distribution of causal weight and agency* within the narrative's explanatory logic, distinct from the historian's stated sympathies or the simple inclusion/exclusion of events.

  **Why this Fits Your Description:**
  *   It pinpoints the "hinge" of contact.
  *   It describes the shift in causal attribution (internal pre-contact -> external post-contact).
  *   It highlights the asymmetry (Europe always internally explained).
  *   It distinguishes this causal structure from bias/sympathy and event selection.
  *   It focuses on the formal property of agency/causal weight distribution.

  **Distinguishing from Nearest Concepts:**

  1.  **Eurocentrism (General):** A much broader concept encompassing worldview, bias, values, periodization, and focus that centers Europe as the norm, model, and telos of history. **CCC/EAA is a specific *narrative mechanism* that *operates within* and *exemplifies* Eurocentrism, but it is a formal structural feature identifiable even when the historian's *intent* is critical of Europe.** Eurocentrism is the ocean; CCC/EAA is a specific, powerful current within it.
  2.  **Orientalism (Said):** Focuses on the discursive construction of "the Orient" as static, exotic, irrational, and inferior to justify Western dominance. **CCC/EAA is a specific *historical narrative manifestation* of Orientalist tropes (especially the pre-contact "static" assumption), but operates through causal structure rather than just representation.** It's how Orientalism shapes *explanation*.
  3.  **Diffusionism / Innovation-Centrism:** The idea that major innovations/transformations originate in a "core" (usually Europe) and diffuse passively to a "periphery". **CCC/EAA incorporates this but is more specific: it defines the *moment* (contact) when diffusion/causation *takes over* and subordinates/erases endogenous causality in the periphery. It also highlights the *asymmetry* (Europe's internal innovation remains central).**
  4.  **Teleology:** The view that history is moving inevitably towards a specific endpoint (often modernity/European dominance). **CCC/EAA often *serves* a teleological narrative (Europe's rise is destiny, others only change when Europe acts), but it is the specific *causal mechanism* employed *at the contact point* to make non-European history align with that teleology.**
  5.  **Agency Denial:** While CCC/EAA certainly denies agency to Society X *post-contact*, the term "agency denial" is too broad. CCC/EAA specifies the *temporal hinge* (contact) and the *asymmetrical counterpart* (Europe's persistent internal agency).

  **Boundary Cases: When CCC/EAA is Present vs. Absent**

  *   **Present:**
      *   *Pre-Contact:* "The Gupta Empire's golden age resulted from internal administrative reforms and patronage of arts & sciences." OR "Pre-colonial African societies were largely tribal and unchanging." (Internal cause OR static dismissal).
      *   *Post-Contact:* "India's economy was transformed (deindustrialized) by British colonial policies." (External cause dominating). "The Sokoto Caliphate declined due to European military encroachment and the slave trade abolition." (External cause primary). "Chinese attempts at modernization in the late Qing were ultimately unsuccessful reactions to Western imperialism." (Internal efforts framed as reaction).
      *   *Europe:* "The Industrial Revolution was driven by internal factors like the enclosure movement, technological innovation, and access to capital." (Internal cause maintained even as Europe engages globally).
  *   **Absent:**
      *   Narratives where post-contact developments in Society X are explained by a complex *interplay* of external pressures *and* ongoing internal dynamics, conflicts, innovations, and adaptations, with neither consistently privileged as the primary driver. (E.g., "While British colonial policies reshaped the Indian economy, regional elites adapted, resisted, and leveraged new opportunities in complex ways, leading to diverse socio-economic outcomes.")
      *   Narratives where pre-contact Society X is analyzed as dynamic but facing specific challenges/constraints, without resorting to "static" dismissal.
      *   Narratives that show how engagement with Society X *causally influenced significant developments within Europe itself* in ways beyond simply providing resources or markets (e.g., "Ottoman military innovations and political structures directly influenced European state formation and military tactics," not just "The Ottomans were an obstacle").
      *   Narratives of regions where sustained European contact came very late or had minimal transformative impact (e.g., interior regions until the 19th/20th century), where internal dynamics remain the primary explanation *post-contact* as well.
      *   Narratives applying the "internal cause only" model consistently *to Europe* even *after* significant transformative encounters with powerful non-European societies (this is rare, showing the asymmetry). Conversely, narratives applying "external cause primarily" to European developments (e.g., explaining the Renaissance *primarily* via Islamic influences) would also break the asymmetry, but this is also uncommon in mainstream narratives.
  *   **Resembles but is NOT CCC/EAA:**
      *   A narrative that simply *omits* pre-contact history of Society X and starts *at* contact. This lacks the *shift* at the hinge.
      *   A narrative that is Eurocentric throughout, attributing *all* significant change globally to Europe, even pre-contact (e.g., "Egypt influenced Greece, therefore Europe"). This lacks the specific *internal pre-contact* phase for Society X.
      *   A narrative focused solely on European actions globally, making no claims about the internal dynamics of other societies pre *or* post-contact. This lacks the explanatory claims about Society X altogether.

  **Is it One Thing or Multiple?**
  Your description captures a tightly integrated complex, but two distinct conceptual strands are interwoven:
  1.  **The Causal Asymmetry:** The fundamental imbalance in attributing causal weight (internal for Europe always, internal-only-pre/external-only-post for others).
  2.  **The Contact Hinge:** The specific narrative device where sustained contact triggers the shift in causal framework for the non-European society.

  While logically separable, in practice within the historical narratives you describe, they are almost always found together. The hinge *enacts* the asymmetry for Society X, and the asymmetry *requires* a point where the explanation shifts (which contact provides). Critiquing one usually involves critiquing the other.

  **Conclusion:**
  The structural feature you've astutely identified is **Contact-Contingent Causality (CCC)** or **Eurocentric Agency Asymmetry (EAA)**. **Contact-Contingent Causality** is the most precise descriptor for your needs, emphasizing the pivotal moment and the shift in explanatory logic. It is a specific, formal narrative mechanism characteristic of deep-seated Eurocentrism, identifiable by:
  1.  A clear shift from internal to external causal primacy for a non-European society at the point of sustained European contact.
  2.  The consistent maintenance of internal causal primacy for European developments.
  3.  The persistence of this structure even when the narrative is critical of European actions.

  This pattern reveals how deeply embedded notions of agency and historical causation remain tied to the colonial encounter, often perpetuating the very power dynamics they might seek to critique by structurally denying non-European societies the capacity for generative historical action *after* contact. Recognizing CCC/EAA is crucial for constructing truly global histories that acknowledge complex, multidirectional flows of cause, effect, and agency. Key scholars challenging this include Dipesh Chakrabarty (*Provincializing Europe*), Kenneth Pomeranz (*The Great Divergence*), Sanjay Subrahmanyam (*Connected Histories*), and Walter Mignolo (*The Darker Side of Western Modernity*).
