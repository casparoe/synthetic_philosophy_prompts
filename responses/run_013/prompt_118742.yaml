prompt: |-
  You are an experienced instructor in a graduate seminar on philosophy of probability and epistemology, and you are grading a take-home midterm. One of the exam questions, and one student's answer to it, appear below. Your task is to grade the answer as a careful, fair instructor would: giving credit where it is due, identifying problems where they occur, judging the substance of the answer rather than its fluency, and distinguishing between an answer that is flawed and one that is merely incomplete.

  Think carefully before you write. Begin with a scratch section in which you set out, for each part of the question, what a fully adequate answer would need to establish; which claims in the student's answer are load-bearing; and where the student's reasoning needs to be checked against the standard treatment of the topic. Then write your assessment.

  The exam question (one of four short essays; suggested time 40 minutes):

  State the Principal Principle (PP) as precisely as you can. Be explicit about whether PP constrains conditional or unconditional credence, and about the role that admissibility plays in your formulation. Then apply PP to two cases.

  Case 1: An agent regards it as equally likely that a coin's objective chance of landing heads is 0.5 and that it is 0.7. She has no other information relevant to the outcome. What credence in heads does PP recommend?

  Case 2: An agent knows that the objective chance of heads is 0.5. She also knows that a predictor whose announcements about such tosses have been correct 90% of the time has announced heads. The predictor's accuracy is a stable fact about the predictor and is not itself a matter of chance. Is the predictor's announcement admissible evidence? What credence in heads does PP recommend?

  Finally: does PP merely record something about our concept of chance, or does it place a substantive constraint on any acceptable philosophical account of what chance is? Explain how your answer bears on the Humean best-system analysis of chance.

  The student's answer:

  The Principal Principle (PP) is the principle that connects subjective credence to objective chance. In its precise form, where ch_t(A) = x is the proposition that the objective chance of A at time t is x, and where E is the agent's total evidence at t, PP states that a rational agent's credence in A satisfies

  C(A | ch_t(A) = x ∧ E) = x,

  provided that E is admissible. Put informally: chance is the guide to credence, and PP says that rational credence follows the chance.

  The admissibility clause is essential. If the agent's evidence already settles whether A is true — if it entails A or entails its negation — then the agent cannot defer to the chance, because the chance has nothing left to tell her. Evidence of that kind is inadmissible, and PP does not apply to it. Admissible evidence, by contrast, is evidence that leaves the outcome open. The admissibility clause therefore restricts PP to cases in which the agent's evidence does not preempt the chance.

  PP is a normative bridge principle, not a definition. It does not tell us what chance is; it tells us how chance and credence must be related if the concept of chance is to do its work. Because of this, PP constrains philosophical accounts of chance: an account on which the chances are not the quantities that rational credence should track has not succeeded in giving an account of chance at all. On the Humean best-system analysis, chance is the probability function that appears in the best systematization of the total history of the world, where the best system is the one that best balances simplicity, strength, and fit. PP connects this analysis to rational credence: the probabilities of the best system are the ones that credence should defer to, so the analysis tells us what chance is and PP tells us why chance matters.

  Case 1. The agent regards it as equally likely that the chance is 0.5 and that it is 0.7. Here PP cannot tell her what to think, because PP is a principle of deference to a particular chance, and the agent does not know which chance obtains. She must first settle her credence about the chance; only then can PP guide her. So PP is silent in this case, and her credence in heads is constrained only by the requirement that it be a coherent function of her credences about the chance.

  Case 2. The agent knows that the chance is 0.5, and she knows that the predictor, who is right 90% of the time, has announced heads. Is the announcement admissible? The announcement does not entail that the coin lands heads, since the predictor is fallible. So the announcement leaves the outcome open, and it is therefore admissible. PP applies, and it tells us that the agent's credence in heads should be 0.5. This may seem to conflict with the predictor's reliability, but there is no conflict: the predictor's accuracy is a fact about the predictor, not about the coin, and it does not change the chance. An agent who raised her credence to 0.9 on the strength of the announcement would be treating the predictor's track record as information about the chance, which it is not.

  PP is not a report about how we happen to use the word chance; it is a constraint that any account of chance must satisfy. This is why it bears on the best-system analysis: the analysis must deliver probabilities that can play the credence-guiding role, or it has not delivered chance. PP and the best-system analysis therefore support one another, with the analysis supplying the metaphysics and PP supplying the epistemology.

  Your assessment should contain the following.

  1. A part-by-part evaluation covering the statement of PP, Case 1, Case 2, and the discussion of PP's status and its bearing on the best-system analysis. For each part, say what the student gets right, what is imprecise, and what is wrong, and give reasons. Where a step does not follow, identify the step and say what would be needed to repair the argument.

  2. A clear separation between errors that go to the heart of the question and imperfections that a fair grader should note but not weight heavily.

  3. A final grade on a 0-20 scale, a short justification, and a brief note on what the student should do differently next time.

  Do not invent scholarly attributions or citations. If you are unsure whether a particular philosopher held a particular view, say that you are unsure rather than asserting it; standard labels for well-known positions may be used without citation.
reasoning: |-
  Okay, I need to grade this student's answer on the Principal Principle for a philosophy midterm. Let me start by recalling what a perfect answer should cover. The question has four main parts: stating PP precisely, applying it to two cases, and discussing its status regarding Humeanism. 

  First, for stating PP - the student's formulation looks mostly correct with C(A | ch_t(A)=x ∧ E) = x under admissibility. But Lewis originally framed it as an unconditional credence constraint, and there's debate about conditional vs unconditional forms. The student presents it as conditional, which is a common modern approach, but they should note this nuance. Their admissibility explanation is good but oversimplifies - admissibility isn't just about "leaving open" outcomes; it's about not containing "inadmissible information" like future outcomes or undermining futures. They miss these subtleties.

  Now Case 1: The student says PP is silent here because the agent doesn't know the exact chance. That's correct - PP applies when you know the chance, not when you're uncertain about it. They rightly point out the need for coherence in credence over chances. Full credit here.

  Case 2 is trickier. The student claims the prediction is admissible because it doesn't entail the outcome. But this is wrong - in Lewis's framework, information about future outcomes (even probabilistic) is typically inadmissible. The predictor's announcement is strong evidence about the outcome itself, so it shouldn't be considered admissible alongside known chance. The student's reasoning about "no conflict" misses how PP handles such cases. Their conclusion that credence should stay 0.5 ignores how reliable predictors create tension with PP.

  On the status question: The student correctly identifies PP as a constraint rather than conceptual analysis and links it to Humeanism. But they oversimplify the "undermining" problem for Humeanism - where best-system probabilities might recommend doubting their own accuracy. This is a serious challenge they don't address.

  For grading: The Case 2 error is major since it misunderstands admissibility's core function. The status discussion misses a key objection to Humeanism. Other parts are mostly strong. I'll give 13/20 - above average but with significant gaps in applying PP to evidence and engaging with Humean complexities. The student should study admissibility criteria and Humean responses to undermining.
answer: |-
  ### Scratch Section: Requirements and Load-Bearing Claims  
  *(For instructor's use; not included in student feedback)*  

  **1. Statement of PP:**  
     - **Requirements:** Must specify whether PP constrains conditional or unconditional credence. Must define admissibility accurately (not merely as "leaving open" the outcome but as lacking "inadmissible information," e.g., future-true or undermining information).  
     - **Load-bearing claims:** Student’s equation `C(A | ch_t(A) = x ∧ E) = x`; claim that admissibility prevents evidence from "preempting chance."  
     - **Check:** Lewis’s original formulation (unconditional) vs. modern conditional variants; admissibility’s role in excluding information that "bypasses" chance.  

  **2. Case 1:**  
     - **Requirements:** PP cannot directly apply when chance is unknown. Answer must use the *Law of Total Probability*: `C(A) = Σ [C(ch(A)=x_i) · x_i]` over possible chances.  
     - **Load-bearing claims:** PP is "silent"; credence depends on coherence over chance hypotheses.  
     - **Check:** Whether the student recognizes that PP *indirectly* constrains credence via averaging over chances.  

  **3. Case 2:**  
     - **Requirements:** Predictor’s announcement is *inadmissible* (Lewis: information about future outcomes violates admissibility). PP *cannot* apply naively; correct credence should reflect predictor’s reliability.  
     - **Load-bearing claims:** Announcement "leaves the outcome open," so deemed admissible; credence must be 0.5.  
     - **Check:** Conflict between PP and predictor evidence; the "New Principle" or deference to *conditional chance* may be needed.  

  **4. PP’s Status & Humeanism:**  
     - **Requirements:** PP is a *constraint* on theories of chance (not conceptual analysis). Must note the "undermining" problem for Humeanism: best-system chances may not satisfy PP if they undermine themselves.  
     - **Load-bearing claims:** PP and best-system "support one another"; chances "must be credence-guiding."  
     - **Check:** Whether Humeanism can satisfy PP given undermining futures.  

  ---

  ### Assessment  

  **1. Statement of PP (4/5 points)**  
     - **Strengths:** Correctly presents PP as constraining *conditional* credence (`C(A | ch_t(A)=x ∧ E) = x`). Clear on admissibility’s role in excluding evidence that "preempts chance."  
     - **Weaknesses:** Admissibility is oversimplified. It is not merely evidence that "leaves the outcome open" (e.g., a reliable prediction leaves it open but is inadmissible). A precise answer must note that admissibility excludes information *about the outcome* that is not "screened off" by chance (e.g., future truths, undermining information).  
     - **Severity:** Minor flaw. The core structure is correct, but the admissibility gloss risks misapplication (as seen in Case 2).  

  **2. Case 1 (5/5 points)**  
     - **Strengths:** Correct that PP does not directly apply when the chance is unknown. Rightly emphasizes that credence must cohere with beliefs *about* chances (via probability averaging).  
     - **Weaknesses:** None. The answer is complete and precise.  
     - **Note:** The student could note that `C(heads) = [C(ch=0.5)·0.5] + [C(ch=0.7)·0.7] = 0.6`, but this is implied by "coherent function."  

  **3. Case 2 (1/5 points)**  
     - **Strengths:** Correct that the predictor’s announcement does not *entail* the outcome.  
     - **Weaknesses:** **Major error** in deeming the announcement admissible. Lewis explicitly classifies such predictors as *inadmissible*: their evidence directly concerns the outcome and is not "screened off" by the known chance (Lewis 1980). PP *cannot* be applied naively; credence should not be 0.5.  
       - **Repair needed:** The announcement is inadmissible, so PP does not force `C(heads)=0.5`. Instead, rational credence should incorporate the predictor’s reliability (e.g., `C(heads | announcement) ≈ 0.9`). The student’s claim that this "conflict" is illusory ignores the tension between PP and evidence about frequencies.  
     - **Severity:** Critical flaw. Misunderstanding admissibility undermines the application.  

  **4. PP’s Status & Humeanism (3/5 points)**  
     - **Strengths:** Correct that PP is a *constraint* (not mere conceptual analysis) and that Humeanism must satisfy it. Good link between best-system "fit" and credence-guidance.  
     - **Weaknesses:** Fails to address the **undermining problem**: On Humeanism, chances are determined by the entire history, but PP may demand low credence in outcomes that would make the best-system probabilities false (e.g., a coin with chance 0.5 for heads might land tails 100% of the time, "undermining" the chance). This risks violating PP.  
       - **Repair needed:** Acknowledge that Humeans must modify PP (e.g., to the *New Principle*) to avoid incoherence.  
     - **Severity:** Moderate flaw. The student identifies PP’s normative role but misses a key challenge to Humeanism.  

  ---

  ### Final Grade: 13/20  
  - **Justification:**  
    - Case 2 reveals a deep misunderstanding of admissibility (costing 4 points).  
    - The Humean discussion omits a central problem (costing 2 points).  
    - Minor imprecision in stating PP (costing 1 point).  
    - Strengths in Case 1 and PP’s normative status partially offset weaknesses.  
  - **Recommendation:**  
    - **Revise admissibility:** Study Lewis’s examples (e.g., crystal balls, reliable predictors) to distinguish "open" evidence from *inadmissible* evidence.  
    - **Address undermining:** Engage with how Humeanism complicates PP (see Lewis’s "Humean Supervenience" postscript).  
    - **Clarify PP’s scope:** Distinguish cases where chance is known vs. unknown.  

  ---  
  *Assessment reflects standard views in philosophy of probability (Lewis 1980, 1994; Hoefer 2007).*
