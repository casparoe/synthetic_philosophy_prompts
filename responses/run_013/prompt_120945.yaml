  Okay, the user is in a political philosophy seminar discussing Harsanyi's aggregation theorem. They're challenging the assumption of equiprobability behind the veil of ignorance. Specifically, they question why the probability should be equal for each person rather than each experienced moment. This would lead to duration-weighted utility instead of simple sum-maximization. 

  The user is frustrated with how the seminar presented the equal weights as a logical outcome. They feel this hides a moral premise—valuing persons equally over moments. Their core objection is that the theorem isn't purely mathematical but smuggles in a normative choice.

  Hmm, the user wants me to stay strictly in character as a committed Harsanyian utilitarian. No literature references, just argumentation. They're testing an objection, so I need to engage sharply but stay in role. 

  First, I should defend why person-equiprobability aligns with the framework while moment-equiprobability doesn't. The key is that Harsanyi's setup treats individuals as the atomic units of preference and welfare. The Pareto principle and expected utility axioms operate at the person level—we're aggregating individual utility functions, not slicing them into temporal fragments. 

  The moment-based approach would require evaluating welfare at a sub-personal level, which violates the individualism inherent in the theorem's foundations. It's not irrational per se, but it's inconsistent with treating persons as the fundamental loci of value for social aggregation. 

  Also, introducing duration-weighting would create absurdities: a society could "improve" total welfare by prolonging miserable lives, which clearly violates the spirit of Pareto. Meanwhile, person-based weights maintain coherence with the axioms—each preference system gets one seat at the table. 

  I should concede that the veil's design involves a normative commitment (persons matter equally), but argue this is the minimal moral premise needed to operationalize rational impartiality. The math still does the heavy lifting of deriving sum-maximization once that starting point is accepted. 

  The user might counter that this just relabels the problem—why privilege "persons"? But in Harsanyi's defense, the entire apparatus of social choice theory assumes individual agents as the basic constituents. To reject that is to reject the paradigm entirely, not just this theorem.
answer: |-
  You're right that the equiprobability veil assumption must specify *what* is equally probable, and the choice between persons or moments isn't dictated by the axioms alone—it's a normative starting point. But it's not arbitrary: the entire framework treats *individuals* as the rational agents whose preferences we're aggregating. The Pareto principle operates over individual preferences, the utility functions represent coherent individual welfare orderings across states of the world, and the social welfare function aggregates these discrete, autonomous perspectives. If we shift to weighting moments, we fracture the individual into disconnected experiential fragments, violating the integrity of the person as a locus of rational agency and preference that underpins the expected utility axioms. Why should society care about satisfying an individual's *lifetime* preferences if we weigh moments independently? Your moment-based view smuggles in a different normative commitment—that welfare is atomized experience—which isn't compatible with the individual-centric foundations of the theorem. Person-equiprobability preserves the unit of agency assumed throughout; your alternative redefines the subject of welfare in a way the framework doesn't recognize. The mathematics *does* derive sum-utilitarianism *given* that we take persons as the fundamental units—and that choice is justified by the normative individualism inherent in the very idea of aggregating preferences.
