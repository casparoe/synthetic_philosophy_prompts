     Wait, this is not correct. The stopping rule is: stop when you get 8 heads. So the event for Researcher 2 is that they reach 8 heads at or before 10 flips. The probability of this event under the null is the probability of getting at least 8 heads in the first 10 flips? But that's not the same as the event of ever having 8 heads in a prefix. For example, you might have 8 heads at n=8, or you might have 8 heads at n=9 (having had 7 at n=8 and then a head), etc.

     The event is exactly: the 8th head occurs at or before the 10th flip. This is the negative binomial. The probability of this event under the null is the probability that the 8th head occurs at flip 8, 9, or 10.

     P(8th head at flip k) = C(k-1,7) * (0.5)^k, for k=8,9,10.

     So:
       k=8: C(7,7)* (0.5)^8 = 1 * 0.0039 = 0.0039
       k=9: C(8,7)* (0.5)^9 = 8 * 0.00195 = 0.0156
       k=10: C(9,7)* (0.5)^10 = 36 * 0.000976 = 0.03516

     Total = 0.0039+0.0156+0.03516 = 0.05466

     So the p-value for Researcher 2 is 0.05466 (since we are doing a one-sided test, we use the probability of this event or more extreme. But what is more extreme? In this design, we are only stopping when we get 8 heads, so we don't have more than 8 heads in the sample? We stop at the 8th head. But in this case, they stopped at n=10 with 9 heads. So they have 9 heads. The event is: they got the 8th head at or before n=10. The more extreme outcome would be getting the 8th head earlier? So the p-value is the probability of getting the 8th head at or before n=10, which is 0.05466. This is not significant at 0.05.

     Therefore:
          Researcher 1 (fixed): p-value = P(X>=9) for n=10 = 0.0107+0.0010=0.0117 -> significant.
          Researcher 2 (optional stopping): p-value = 0.05466 -> not significant.

     So the same data (9 heads in 10 flips) lead to different conclusions because of the stopping rule.

  ### Scripted moment:
  - The instructor explains the two researchers' stopping rules and their data.
  - They then reveal the two p-values (written on a board) and the conclusions.

  ## Debrief (20 minutes)

  - Start with Part1: 
    - Report the number of false positives in Group A and Group B.
    - Explain that even though the coins were fair, Group B had more false positives (or at least in theory should have) because of the optional stopping.
  - Then Part2: 
    - Highlight the identical data (9 heads in 10 flips) and the different conclusions.
    - Emphasize that the stopping rule, which is not recorded in the data, affects the evidential import.
  - Bayesian rebuttal: 
    - The Bayesian would say: the stopping rule does not affect the likelihood function. For the same data, the likelihood is the same, so the evidence should be the same.
    - In this activity, the two researchers have the same data (9 heads in 10 flips), so the likelihood is proportional to p^9*(1-p). The stopping rule is irrelevant. Therefore, the evidence about p should be the same.
    - The frequentist and Bayesian differ on whether the stopping rule is part of the evidence.

  ## What might go wrong:

  1. Part1 might not show a false positive in Group B, making the inflation less visible. 
     - Handling: The instructor can explain the theory and provide the precomputed false positive rates: Group A ~2%, Group B ~7% (for max n=20, one-sided test).

  2. In Part2, the computation of the p-value for Researcher2 is complex and might not be intuitive.
     - Handling: The instructor can provide the precomputed p-value and explain the logic briefly. The focus is on the difference in numbers.

  3. The identical-data moment in Part2 might not feel identical because the stopping rule for Researcher2 might be seen as leading to a different experiment. 
     - Handling: Emphasize that the data recorded is the same: 9 heads in 10 flips.

  4. Time: Part1 might take longer than expected if students are slow at flipping and checking the table.
     - Handling: Have them work in pairs or use a single flip per student per turn to speed up.

  ## What the activity cannot reproduce:

  - The activity cannot fully convey the long-run false positive rate for optional stopping because we have only 8 trials. The instructor will have to explain that in the debrief, using the precomputed rates.
  - The activity also cannot derive the p-value for the optional stopping design in Part2 in real-time; it must be provided.

  ## Materials to prepare in advance:

  - Coins (16).
  - Critical values table for Group B (copies).
  - Data recording sheets.
  - Precomputed p-values for Part2 (0.0117 and 0.05466) on a board or handout.
  - Written commitments for each student.

  This design meets the requirements and is feasible within the constraints. It addresses both key points and includes a role for the Bayesian objection in the debrief.
