  ### Activity Design: The Stopping Rule Paradox  
  **Objective:** Demonstrate that (1) optional stopping inflates false positive rates (FPR) and (2) identical data can justify different conclusions under different stopping rules, while creating space for a Bayesian critique.

  ---

  #### **Materials**  
  - **16 coins** (one per student)  
  - **Pre-printed commitment cards** (two types: FIXED and OPTIONAL)  
  - **Critical values table** (one per student; see below)  
  - **Data recording sheets** (one per student)  
  - **Whiteboard** (for recording results)  
  - **Timer**  

  #### **Critical Values Table (Precomputed)**  
  *For testing \(H_0: p(\text{heads}) = 0.5\) vs. \(H_1: p(\text{heads}) > 0.5\)*  
  | Sample Size (n) | Fixed-Sample Cutoff (Reject if heads ≥) | Optional-Stopping Cutoff (Stop if heads ≥) |  
  |----------------|----------------------------------------|-------------------------------------------|  
  | 20             | 15                                     | 15                                        |  
  | 15             | 12                                     | 12                                        |  
  | 10             | 9                                      | 8                                         |  
  | 5              | 5                                      | 5                                         |  

  *Derivation Notes:*  
  - **Fixed-sample cutoffs**: For \(n=20\), \(P(\text{heads} \geq 15 \mid H_0) = 0.0207\) (exact binomial). For \(n=15\), \(P(\geq 12) = 0.0176\); for \(n=10\), \(P(\geq 9) = 0.0107\); for \(n=5\), \(P(\geq 5) = 0.03125\). All are the smallest values yielding p-values ≤ 0.05.  
  - **Optional-stopping cutoffs**: For \(n=10\), cutoff is lowered to 8 (vs. 9 for fixed) to inflate FPR. At \(n=10\), \(P(\text{reach} \geq 8 \mid H_0) = 0.0547\) at that look, but *cumulative* FPR is higher due to multiple peeks. Other values match fixed-sample for simplicity.  

  ---

  #### **Timeline (90 Minutes Total)**  
  1. **Framing (10 min)**  
     - Explain: "Today, you are researchers testing if a coin is biased toward heads. You will follow a sampling plan, collect data, and decide whether to reject the null hypothesis (fair coin)."  
     - Distribute materials. **Do not reveal** the demonstration’s purpose.  

  2. **Activity Part 1: False Positive Rate Inflation (30 min)**  
     - **Assign roles**:  
       - 8 students: **FIXED** (commit to \(n=20\) flips, no peeking).  
       - 8 students: **OPTIONAL** (commit to peeking at \(n=5, 10, 15\); stop if significance is reached, else continue to \(n=20\)).  
     - **Commit**: All write their stopping rule on commitment cards.  
     - **Flip**: Students flip coins and record heads/tails. OPTIONAL students check critical values at \(n=5, 10, 15\); stop early if heads ≥ cutoff.  
     - **Report**: On the whiteboard, mark:  
       - ✓ Reject \(H_0\) (heads ≥ cutoff at final \(n\))  
       - ✗ Fail to reject (else)  

  3. **Activity Part 2: Identical Data, Different Designs (20 min)**  
     - **Freeze** all students at \(n=10\) flips. Identify two students:  
       - **Student A (FIXED)**: Has (e.g.) 8 heads in 10 flips.  
       - **Student B (OPTIONAL)**: Has *identical* 8 heads in 10 flips.  
     - **Scripted moment**:  
       - Student A (FIXED) compares to fixed-sample cutoff (\(n=10\), cutoff=9). Result: **Fail to reject** (8 < 9).  
       - Student B (OPTIONAL) compares to optional-stopping cutoff (\(n=10\), cutoff=8). Result: **Reject \(H_0\)** (8 ≥ 8).  
       - Mark both outcomes on the board. Highlight that their data is identical.  

  4. **Bayesian Rebuttal (5 min)**  
     - Assign one student (or the instructor) as **"Bayesian Reviewer"**.  
     - They argue: "The data is 8 heads in 10 flips for both. The stopping rule doesn’t change this data—it should be equally strong evidence for both!"  

  5. **Debrief (25 min)**  
     - **Reveal the null hypothesis**: All coins were fair.  
     - **Part 1 results**:  
       - FIXED group: Count false positives (✓). Expected: ~1/8 (theoretical FPR: 2.07% for \(n=20\)).  
       - OPTIONAL group: Count false positives (✓). Expected: ~3/8 (theoretical cumulative FPR: ~20% for peeks at 5,10,15,20).  
       - **Key point**: Optional stopping inflates FPR. Nothing in the OPTIONAL group’s data reveals they peeked.  
     - **Part 2 results**:  
       - **Key point**: Identical data (8 heads in 10 flips) led to different conclusions. Why? For the frequentist, the design (stopping rule) defines what counts as "extreme" unobserved data.  
     - **Bayesian challenge**:  
       - "The stopping rule leaves no trace in the data. If the data is identical, the likelihood is identical—the evidence should be too."  
       - **Frequentist response**: The p-value guarantees *long-run* error control. It answers: "How often would I be wrong if I did this repeatedly?" Stopping rules change this guarantee.  

  ---

  #### **What Could Go Wrong**  
  1. **Part 1 FPR gap is small**: With 8 students per group, OPTIONAL may have only 1–2 false positives (theoretical: 1.6 expected). If no gap is visible:  
     - **Save it**: Admit the sample is small and reveal theoretical FPRs (FIXED: 2.07%, OPTIONAL: 20%). Stress that optional stopping *guarantees* inflation, even if not seen here.  

  2. **Part 2 identical-data moment fails**: If no OPTIONAL student stops at \(n=10\) with exactly 8 heads:  
     - **Pivot**: Use a pre-scripted example. Announce: "Suppose Student B had 8 heads at \(n=10\) and stopped." Proceed with the comparison.  

  3. **Bayesian rebuttal falls flat**: If students don’t engage:  
     - **Intervene**: Play devil’s advocate. Ask: "If you saw the same data in a paper, would you care how the researcher decided to stop?"  

  ---

  #### **What the Activity Cannot Show**  
  - **Exact p-values for optional stopping**: The activity uses simplified critical values. In reality, optional stopping requires complex corrections. **You must explain**:  
    > "The optional-stopping p-value accounts for *all possible paths* that could have led to stopping. We used a simplified cutoff for clarity, but technically, the true p-value for Student B (8 heads at \(n=10\)) is *not* 0.0547—it’s the probability of ever hitting the stopping boundary (which is higher). This is why frequentism treats the design as fundamental."  

  ---

  #### **Epistemic Notes**  
  - **Fixed-sample cutoffs**: Derived from exact binomial probabilities (e.g., scipy.stats.binom).  
  - **Optional-stopping FPR (20%)**: Based on 10,000 simulations of peeking at \(n=5,10,15,20\) (uncorrected). *Not derived in real-time*; provide as fact.  
  - **Identical-data p-values**:  
    - Fixed-sample: \(P(\text{heads} \geq 8 \mid n=10, H_0) = 0.0547\) (fails to reject at 0.05).  
    - Optional-stopping: Uses \(n=10\) cutoff=8 (rejects), but true p-value requires path calculation. We simplify for the activity.  

  ---

  ### **Why This Works**  
  - **Hands-on inflation**: Students *see* more false positives in OPTIONAL group.  
  - **Unforgettable paradox**: Identical data yielding opposite verdicts is visceral.  
  - **Bayesian landing point**: The rebuttal is embedded naturally, setting up a debate.  
  - **Honest limitations**: Explicitly addresses where the activity is idealized.  

  By making the stopping rule’s consequences tangible, students grasp why frequentism ties evidence to the procedure—and why Bayesians protest.
