  Given the complexity and time constraints, I propose the following activity design that focuses on the two key points while being feasible within the limitations.

  ## Part 1: False Positive Rate Inflation (40 minutes)

  ### Materials per student:
  - One coin (fair, but we will assume they are fair for the null hypothesis)
  - One data recording sheet (prepared in advance)
  - A table of critical values for fixed sample size (n=20) and for the optional stopping rule (n=5 to 20) as computed below.

  ### Critical values table (provided to students in Group B):
  ```
   n | Minimum heads for significance (k_min)
   5 | 5
   6 | 6
   7 | 7
   8 | 7
   9 | 8
  10 | 9
  11 | 9
  12 | 10
  13 | 10
  14 | 11
  15 | 12
  16 | 12
  17 | 13
  18 | 14
  19 | 14
  20 | 15
  ```

  ### Groups:
  - Group A (fixed sample): 8 students.
  - Group B (optional stopping): 8 students.

  ### Instructions for Group A:
  1. Commit in writing: "I will flip the coin exactly 20 times and then test for significance."
  2. Flip the coin 20 times and record the number of heads.
  3. Using the fixed sample critical value (for n=20, critical value=15 heads), determine if the result is significant (reject the null) or not.
  4. Report the result (significant or not) to the instructor.

  ### Instructions for Group B:
  1. Commit in writing: "I will flip the coin until either I reach a significant result (using the table) or I reach 20 flips."
  2. Flip the coin one by one. After each flip starting from n=5, compare the current number of heads to the critical value for that n in the table.
     - If at any n the number of heads is >= k_min for that n, stop and record n and that the result is significant.
     - If you reach 20 flips without ever meeting the stopping criterion, then test using n=20: if heads>=15, significant; otherwise, not.
  3. Report the result (significant or not) and the stopping time (n) to the instructor.

  ### Aggregation:
  - The instructor collects the results from both groups and counts the number of significant results in each group.
  - Expected outcome: 
    - Group A (fixed): With 8 students, expected false positives ~0.16 (since P(significant)=0.0207). We might see 0 or 1.
    - Group B (optional stopping): The false positive rate is higher. From a quick simulation, it is approximately 0.07 for max n=20. With 8 students, expected false positives ~0.56. We might see 0 or 1 or possibly 2.

  Even if the counts are not dramatically different, the activity sets up the concept and the instructor can explain the theory.

  ## Part 2: Identical Data, Different Designs (20 minutes)

  This part will be scripted and conducted by the instructor with two volunteers.

  ### Scenario:
  - We have two researchers who have the same data: 9 heads in 10 flips.
  - Researcher 1 (fixed sample): Planned to flip exactly 10 times.
  - Researcher 2 (optional stopping): Planned to flip until either they get 8 heads or they reach 10 flips.

  ### Why this stopping rule for Researcher 2?
  - At n=10, they have 9 heads. They would have stopped at n=8 if they had gotten 8 heads by then, but they didn't. So they stop at n=10 because that was their maximum.

  ### The data sequence (for the sake of argument, but the sequence doesn't matter for the binomial count):
  - Let the data be: H, H, H, H, H, H, H, T, H, H (9 heads in 10 flips).

  ### Roles:
  - Volunteer 1: Researcher 1 (fixed sample).
  - Volunteer 2: Researcher 2 (optional stopping).

  ### Instructions:
  1. Both researchers have the same data: 9 heads in 10 flips.
  2. Researcher 1: 
     - Computes the p-value for a fixed sample of 10: P(X>=9) = 0.0107 + 0.0010 = 0.0117 (one-sided). 
     - This is significant at 0.05.
  3. Researcher 2:
     - They must account for their stopping rule. The p-value is the probability, under the null, of ever having 8 or more heads in any sample size up to 10. 
     - This is a union of events: having 8 heads at n=8, or 8 heads at n=9, or 8 or 9 heads at n=10. 
