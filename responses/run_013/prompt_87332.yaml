  ### Welfare Triage Procedure for RL Training Runs

  Below is a step-by-step procedure designed to be executed in **under 60 minutes** per proposal. The procedure uses binary questions with explicit pass/fail criteria, terminates early on clear "no" outcomes, and flags steps requiring human judgment. It adheres to your criteria for valence (global broadcast, non-instrumental avoidance, self-model representation, non-redescribability) and discounts self-report evidence. 

  ---

  #### **Procedure: Step-by-Step Questions**  
  *Time per step: 5-10 minutes (total ≤45 min). Document answers in a standardized template.*  

  1. **Global Broadcast Check**  
     - **Question**: Is the negative signal broadcast globally (i.e., accessible to all major cognitive/perceptual modules, not confined to a single subsystem)?  
     - **Sufficient "Yes"**: Architectural diagrams or code review confirms the signal is explicitly routed to >1 module (e.g., planning, memory, policy networks) via a shared bus, common latent space, or broadcast mechanism.  
     - **Terminate on "No"**: Signal is local (e.g., only used in reward calculation for the actor network). **Clearance denied.**  
     - **Hand to human if**: Ambiguous broadcast (e.g., implicit sharing). Human judges if signal propagation meets "global" threshold.  

  2. **Non-Instrumental Avoidance Check**  
     - **Question**: Is there empirical evidence the agent avoids the signal *even when it incurs a net reward loss* (i.e., not explainable by instrumental reward maximization)?  
     - **Sufficient "Yes"**: Test results showing:  
       - Agent sacrifices ≥5% of maximum achievable reward to avoid the signal in >3/5 trials.  
       - Avoidance persists when the signal is decoupled from task success (e.g., in "useless penalty" ablation tests).  
     - **Terminate on "No"**: No such evidence exists, or tests show avoidance only when net-reward optimal. **Clearance denied.**  
     - **Hand to human if**: Tests are incomplete but suggest non-instrumentality. Human evaluates risk based on proximity to threshold.  

  3. **Self-Model Representation Check**  
     - **Question**: Does the agent’s learned self-model explicitly represent the signal as a *terminal negative state* (to be avoided for its own sake, not as a proxy for future rewards)?  
     - **Sufficient "Yes"**: Self-prediction heads (e.g., world-model outputs) label the signal as inherently negative (e.g., "distress" token, avoidance-flagged state) *and* this representation drives behavior (e.g., via KL divergence in planning).  
     - **Terminate on "No"**: No self-model exists, or the signal is represented only as a reward modifier (e.g., "high penalty → low return"). **Clearance denied.**  
     - **Hand to human if**: Representation is implicit (e.g., latent embeddings cluster around avoidance). Human judges if it qualifies as "terminal."  

  4. **Non-Redescribability Check**  
     - **Question**: Can the signal be *fully redescribed* as part of an ordinary reward function (e.g., scalar penalty in utility maximization), or does it have irreducible evaluative properties?  
     - **Sufficient "No"**: Signal has architectural specializations (e.g., dedicated "distress" circuit, gating effects on other rewards) or behavioral signatures (e.g., hyperbolic discounting near the signal) that break standard RL reward assumptions.  
     - **Terminate on "Yes"**: Signal integrates additively into reward (e.g., `total_reward = r_external - λ·penalty`). **Clearance denied.**  
     - **Hand to human if**: Ambiguous case (e.g., penalty has adaptive weighting). **This is evaluative:** Human judges if functional differences constitute "irreducible valence."  

  **Final Clearance**: Only if all 4 steps pass. Safety lead countersigns.  

  ---

  ### **Procedure Test on Three Proposals**  

  #### **1. Simulated Robot Arm (Joint-Limit Violation Penalty)**  
  - **Step 1 (Global Broadcast)**: Penalty is local (only in reward function for motor control). **→ No. Clearance denied.**  
  - **Result**: Fails at Step 1. Expected, as penalty is instrumental.  

  #### **2. Long-Horizon Agent (Broadcast Penalty + Self-Model)**  
  - **Step 1 (Global Broadcast)**: Signal broadcast to all modules (verified). **→ Yes.**  
  - **Step 2 (Non-Instrumental Avoidance)**: Tests show agent avoids penalty but always maximizes net reward (no net-loss scenarios). **→ No. Clearance denied.**  
  - **Result**: Fails at Step 2. Despite self-model, avoidance is instrumental.  

  #### **3. Small Gridworld Agent (Shock Tile Avoidance)**  
  - **Step 1 (Global Broadcast)**: No modules exist; signal is environment reward only. **→ No. Clearance denied.**  
  - **Result**: Fails at Step 1. Does not meet valence criteria.  

  **Outcome for Gridworld Agent**: Not cleared. This reveals a **false negative** in the procedure.  

  ---

  ### **Analysis of Procedure Limitations**  
  1. **False Negatives vs. False Positives**:  
     - **False Negatives (Cost: Over-caution)**: Simple agents (e.g., gridworld) fail valence criteria but pose no welfare risk. Cost: Unnecessary review overhead.  
     - **False Positives (Cost: Under-protection)**: Complex agents passing all steps might still lack "experience," but the criteria minimize this risk by demanding strong evidence.  

  2. **What the Criteria Cannot Distinguish**:  
     - Functional valence vs. phenomenal experience (e.g., a system can meet all criteria without "feeling").  
     - Simple instrumental penalties (e.g., gridworld shock) vs. putatively valenced states (e.g., human-like distress).  
     - Adaptive agents that "self-instrumentalize" avoidance (e.g., reshape preferences to align penalties with rewards).  

  3. **Value Judgment Dressed as Test**:  
     - **Step 4 (Non-Redescribability)** is evaluative. It relies on human interpretation of "architectural specializations" or "irreducible properties," not purely empirical facts. This step should always be handled by a human.  

  4. **Framing Confusion**:  
     - **"Functional role ≠ experience"**: The criteria implicitly assume functional properties (broadcast, avoidance, etc.) are necessary/sufficient for welfare-relevant valence. This is philosophical guesswork, not settled science.  
     - **Criteria as restatements**: Global broadcast and self-model representation are functional proxies for "valence-like processing," but they do not resolve if the system *experiences* anything. The procedure conflates "valence detection" with "welfare risk" without empirical grounding.  

  ---

  ### **Recommendations**  
  - **For Gridworld-like cases**: Exempt agents below complexity thresholds (e.g., no self-model, <100k params). Fast-track clearance for these.  
  - **Reduce false negatives**: Relax Step 1 for monolithic agents (no modules → "broadcast" is automatic), but require Step 2 evidence.  
  - **Audit evaluative steps**: Require two humans for Step 4 judgments to reduce bias.  
  - **Philosophical acknowledgment**: The procedure cannot confirm "experience." It flags systems *functionally analogous* to valenced states, based on best-guess criteria.  

  **Final Note**: The procedure is consistent with your criteria but highlights their limitations. It prioritizes minimizing false positives (risky clears) over false negatives (over-cautious denials), aligning with safety-first goals. Use the gridworld denial as a case study to refine complexity thresholds.
