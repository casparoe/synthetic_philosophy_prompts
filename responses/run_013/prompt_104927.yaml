prompt: |-
  So there's a move I keep noticing in arguments and I finally want to ask somebody about it.

  Here's the move. Somebody explains why something happened by pointing at a big-picture feature of the situation. Then somebody else says: look, you can tell the whole story one level down, in terms of the small stuff, and the small stuff already accounts for everything that happened. So the big-picture feature can't be doing any of the work, its just along for the ride. And the funny thing is that it works the same way no matter what the two levels are:

  - My friend says his depression is why he couldn't get out of bed for a month. His brother says no, the brain chemistry did that, "depression" is just what we call the pattern, so it isn't the thing causing anything.
  - In a seminar about hiring algorithms, a guy said the model isn't what discriminated against women, the individual weights are, and the model is just a name for the weights.
  - My sister, who's a nurse, got told she shouldn't feel bad about following a bad protocol, because the protocol didn't make her do anything, the specific written instructions did.

  So: does this have a name? Someone told me it's epiphenomenalism, but that can't be right, because the people making the move usually insist the big-picture thing is perfectly real, they just say it isn't a cause. Someone else said it's the problem of mental causation, but two of my three cases have nothing to do with minds. And I don't think it's plain reductionism either, for the same reason.

  What I actually want is the carving, not a label. Is this one argument, or three arguments that happen to look alike? In the depression case the two levels look like two ways of describing the same thing; in the protocol case the instructions are literally parts of the protocol, which feels like a different shape. Does the move only go through if you add a premise that every event has exactly one cause, or is that smuggled in? And is it even valid — because it seems like you could run it against the higher level every single time and never lose, which makes me suspicious. If there's no established name for the general thing, coin one, but tell me exactly where its edges are: which cases it covers and which it doesnt.
reasoning: |-
  Okay, the user is describing a recurring argumentative move where someone dismisses a higher-level explanation by claiming the lower-level details fully account for the phenomenon. They provided three examples: depression vs. brain chemistry, hiring algorithms vs. weights, and medical protocols vs. written instructions. They're asking whether this has a name, whether it's a single argument type, what premises make it work, and if it's valid.

  First, I need to understand the common thread. In all cases, there's a macro-level explanation (depression, model, protocol) being reduced to micro-level components (brain chemistry, weights, instructions). The challenger claims the macro is just a label or pattern, not a causal agent. The user notes this happens regardless of domain, so it's a meta-argument pattern.

  The user mentioned epiphenomenalism and reductionism but finds them inadequate. Epiphenomenalism is specific to mental states causing physical effects, which doesn't fit the non-mental examples. Reductionism is broader but usually about explaining higher levels through lower ones without denying causal efficacy. Here, the move explicitly denies causal power to the higher level.

  Looking at philosophy, this resembles exclusion arguments in metaphysics, especially Jaegwon Kim's work on mental causation. Kim argued that if physical causes are sufficient, mental causes are excluded. But the user's examples extend beyond mind-body problems, so it's a generalized exclusion move. 

  The structure seems to be:
  1. Macro phenomenon M is proposed as cause of E.
  2. Micro components S (constituting M) are shown to fully cause E.
  3. Therefore, M is causally excluded.

  For this to work, the challenger must assume causal completeness at the micro level—that S alone suffices without M. They also seem to imply that M and S compete for causal credit, adopting a "one true cause" model. This is where the argument gets shaky because causation might be multi-level.

  Validity is questionable. If we apply this consistently, we could reduce everything to quantum particles, making biology, psychology, etc., merely descriptive. But in practice, we accept higher-level causes as real and efficacious because they capture patterns and dependencies that micro-details obscure. For example, depression as a clinical entity guides treatment, even if realized by brain chemistry.

  The user also wonders if the three cases are structurally identical. The depression case involves descriptions of the same entity at different levels. The protocol case has a part-whole relationship. The algorithm case is ambiguous—the model is an emergent property of weights, not just a sum. So while the exclusion move is applied similarly, the ontology differs. Still, the argumentative pattern holds across them due to shared logic.

  Key premises smuggled in:
  - Causal completeness at micro level: S is sufficient for E.
  - No overdetermination: M can't cause E if S does.
  - Micro as fundamental: Only S has "real" causal power.

  But these are contentious. Non-reductive physicalists like Fodor argue for multiple realizability: depression can stem from various brain states, so it's not reducible to one S. Similarly, protocols can't be reduced to instructions if context matters.

  The user might need more than a label—they want to counter this move. Pointing out the smuggled premises or showing how macro levels have explanatory autonomy could help. Terms like "causal exclusion," "explanatory reductionism," or "level-collapsing argument" might apply, but emphasizing the flawed assumptions is crucial.
answer: |-
  This is a brilliantly observed pattern, and you're right to be suspicious—it's **one core argumentative move** that appears across different domains, but its validity hinges on hidden premises that are often philosophically contentious. While it doesn't have a single universally agreed-upon name, the most precise label for the *general move* is **Causal Exclusion** (or **Explanatory Exclusion**). Here's the carving you requested:

  ### 1. **The Core Argument Structure (The "Move")**
     - **Premise 1 (Macro Claim):** Phenomenon/Entity M (e.g., depression, the algorithm model, the protocol) is cited as the cause of outcome E.
     - **Premise 2 (Micro Reduction):** All aspects of E are fully determined/caused by the lower-level components S (e.g., brain chemistry, individual weights, written instructions) that constitute or realize M.
     - **Premise 3 (Exclusion Premise - hidden):** If S fully causes E, then M *cannot* also cause E (i.e., S "excludes" M from causal relevance).
     - **Conclusion:** M is not a cause of E; it is merely a label, pattern, or "epiphenomenon" of S.

  ### 2. **Is it One Move or Three Different Ones?**
     It's **one fundamental argumentative pattern** (Causal Exclusion) applied to different *ontological relationships*:
     - **Depression Case:** *Description Levels* (Same entity described at macro/psychological vs. micro/biological levels).  
     - **Algorithm Case:** *Emergence/Implementation* (The model's behavior emerges from the weights; the model is a functional whole defined by its parts).  
     - **Protocol Case:** *Composition/Mereology* (The protocol is literally composed of the instructions; it's a structured whole).  
     **Why it feels like one move:** In all cases, the challenger exploits the *dependence* of M on S to argue for the *causal irrelevance* of M. The strategy is identical: "S explains everything, so M is redundant."

  ### 3. **The Crucial (and Often Smuggled) Premises**
     The move **only "works" if you accept these often-unstated assumptions**:
     - **Causal Completeness at the Micro Level:** S is causally *sufficient* for E. Nothing else is needed.
     - **No Causal Overdetermination:** E cannot have two *distinct, sufficient* causes (M and S). If S causes E, M cannot.
     - **The Micro is "Real" Causation:** Only the lowest level (S) has "real" causal power; higher levels are just summaries.
     - **Identity or Supervenience:** M is *nothing over and above* S (either identical to S or wholly determined by it).

     **Your suspicion is spot-on:** If you accept these premises, you can run this argument *at every level* against any macro-explanation (e.g., "The brain chemistry isn't the cause—it's just quarks!"), leading to *causal reductionism* or "level collapse."

  ### 4. **Validity and Why It's Controversial**
     The argument is **logically valid *if* you accept the premises**, but those premises are **highly debatable**:
     - **Against Causal Completeness:** Macro-structures (like protocols or algorithms) often have *downward causal effects* (e.g., the protocol constrains which instructions are written). S might not be sufficient without M's context.
     - **Against No Overdetermination:** M and S might *not* be independent causes. If M *is* S (or constituted by S), they could be the *same cause* described at different levels (like "the car" vs. "its engine"). This is *non-reductive physicalism*.
     - **Against Micro-Privileging:** Higher levels can have *explanatory autonomy*. "Depression" predicts behaviors across diverse brain states; "the protocol" explains actions in a way individual instructions cannot. This is *multiple realizability* (e.g., depression can arise from many different S-states).
     - **Practical/Epistemic Use:** Even if M reduces to S, M may be the only *actionable* or *understandable* cause (e.g., treating "depression" works, even if it maps to chemistry).

  ### 5. **Names and Their Edges**
     - **Best General Name:** **Causal Exclusion Argument**  
       *Edges:* Applies to any hierarchy (physical/mental, whole/part, abstract/concrete). Requires M to supervene on S (i.e., no change in M without change in S). Excludes cases where M is *not* dependent on S (e.g., dualism).
     - **Alternative Names:**
       - **Explanatory Reductionism:** Focuses on replacing macro-*explanations* with micro-ones. *Edges:* Doesn't always deny M's reality, just its explanatory value.
       - **Level-Collapsing Argument:** Descriptive but not standard. *Edges:* Captures the "infinite regress" risk you noted.
       - **Nothing-Over-and-Above Move:** Highlights the ontological claim. *Edges:* Avoids causal language.
     - **Rejected Names:**
       - **Epiphenomenalism:** Specifically denies causal power to *consciousness* (e.g., "pain doesn't cause screaming, neurons do"). Too narrow for your cases.
       - **Reductionism:** Often allows M to *be* causally efficacious *as* S (e.g., "depression *is* brain chemistry"). Your cases deny M's causal role entirely.
       - **Problem of Mental Causation:** A specific *instance* of exclusion (mind vs. body), not the general pattern.

  ### 6. **When the Move Fails (Counterexamples)**
     The exclusion argument **collapses if**:
     - M has effects *not* fully explainable by S alone (e.g., a protocol causing *confusion* due to its overall complexity, not any single instruction).
     - S is *not* causally sufficient without M's structure (e.g., weights only discriminate *because* of the model's architecture).
     - M is multiply realizable (e.g., depression caused by different brain chemistries, all called "depression" for clinical reasons).
     - The context requires macro-causes (e.g., holding "the protocol" accountable, not its writer).

  ### In Short
  You've identified **Causal Exclusion**: a powerful but flawed move that dismisses macro-causes by insisting micro-components do all the work. Its force comes from smuggled premises about causation and levels of reality. While it *looks* universal, it fails when higher levels have irreducible causal or explanatory power—which they often do. To counter it, attack the hidden premises (especially "no overdetermination" and "micro-completeness") or show how M provides unique understanding or intervention points. If you need to coin a punchy term: **The Reductionist Shell Game** (emphasizing the sleight-of-hand with levels).
