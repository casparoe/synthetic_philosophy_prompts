prompt: |-
  I've been reading over my friend's shoulder while she works on a book about the historical Jesus, and her method is basically: go through the sayings one by one and drop each into one of three piles -- he said it, maybe, the church invented it. Her calls so far, roughly:

  - the one where he tells a would-be follower to let the dead bury their own dead -- he said it.
  - the one about hating your father and mother and your own life to follow him -- he said it.
  - the one where someone calls him good and he pushes back, why call me good, only God is good -- he said it.
  - the one where he says the end is coming before all his hearers have died -- he said it, which seems like a strange thing to grant given how that turned out.
  - the one about loving your enemies and turning the other cheek -- church invented it.
  - the one about giving Caesar what belongs to Caesar -- church invented it.
  - the one where the kingdom is like a mustard seed, i.e. a scrubby weed rather than a grand cedar -- he said it.

  Now here's the one she hasn't gotten to. There's a saying where he hands the disciples the authority to bind and loose, to forgive sins or hold them unforgiven, on earth. What's her verdict going to be?

  I'm less interested in the verdict than in the rule. She thinks she's running the criterion of embarrassment -- if the early church would have found a saying awkward, it's probably real. But I can explain every single one of those calls just as well with "it's in more than one independent strand and it fits the rest of the authentic core," and honestly for a couple of them I can also explain the call with "the church would have wanted this, so they made it up." So: what does each of those rules predict about the binding-and-loosing saying, which rule do you think she's actually running, and what saying should I hand her next that would seperate the rules for good? Bonus if you can tell me whether the two halves of my second rule -- multiple attestation, and coherence with the core -- ever come apart, and what a saying that pulled them apart would look like. And the thing I actually want to know: can any of these criteria settle who he was, or do they just launder back the picture of him you started with? If its the latter, say so plainly.
reasoning: |-
  Okay, the user is deeply engaged in historical Jesus scholarship methods, specifically critiquing their friend's approach to authenticating sayings. They've observed her using a three-pile system and suspect her "criterion of embarrassment" claims might actually be masking other criteria like multiple attestation or coherence. 

  The core tension here is methodological transparency versus implicit bias. The user wants to expose whether criteria genuinely reveal historical truth or just reinforce presuppositions. Their frustration with circular reasoning ("laundering back the picture you started with") suggests they're wrestling with epistemology in historical reconstruction. 

  Breaking this down: First, the binding/loosing saying analysis needs to address how both embarrassment and institutional motives could cut either way. Embarrassment might weakly support authenticity because the church later struggled with apostolic authority abuses, but stronger arguments exist for invention since the saying directly legitimizes early Christian hierarchy. Multiple attestation (Matthew/John) and coherence with Jesus' radical authority claims complicate things further. 

  The real gem is the user's request for a "separator saying" to test criteria against each other. Herod's temple destruction prediction (Luke 13:32) is perfect because it fails multiple attestation (only Luke) yet passes embarrassment (unflattering fox metaphor + failed prophecy). If the friend rejects it despite embarrassment, she's likely prioritizing attestation over her stated method. 

  On coherence vs. multiple attestation splitting: A saying like "I and the Father are one" (John 10:30) would challenge coherence with the synoptic Jesus' avoidance of direct divine claims while having Johannine singular attestation. Its reception depends entirely on whether one's "core Jesus" is a humble sage or divine figure. 

  Finally, the meta-question about criteria laundering bias needs directness: Yes, all criteria are hermeneutical tools that reinforce initial assumptions. The "embarrassing" apocalyptic sayings only seem authentic if you already accept Jesus as an eschatological prophet; a wisdom teacher advocate might dismiss them as later additions. The criteria don't settle who Jesus was—they refine portraits built on prior commitments. 

  User's sophistication here is impressive. They're not just seeking answers but probing methodological integrity, which is exactly where historical Jesus studies gets philosophically hairy. Their suspicion that friend's pile-sorting reflects subconscious coherence choices feels spot-on.
answer: |-
  Based on your friend's pattern and the principles of historical Jesus criteria, here's a breakdown:

  1.  **Binding/Loosing Saying (Matt 16:19, 18:18; cf. John 20:23):**
      *   **Criterion of Embarrassment Prediction:** **Church Invented It (or Maybe)**. The early church *embraced* apostolic authority. Granting Peter/the disciples power to "bind and loose" (interpret law, excommunicate) or forgive sins was foundational for their structure and claims (like resolving disputes in Acts 15). There's little embarrassment here; it's empowering. The *abuse* of that power (e.g., later controversies) might be embarrassing, but the *granting* of authority itself was essential and celebrated.
      *   **Multiple Attestation Prediction:** **He Said It (or Maybe)**. While most explicit in Matthew (twice), a conceptually similar authority to forgive/retain sins appears in John 20:23. If deemed independent traditions (a significant "if" with John), this suggests multiple attestation, leaning towards authenticity.
      *   **Coherence Prediction:** **He Said It (or Maybe)**. It coheres strongly with the authentic core your friend seems to be identifying: radical claims of authority ("But I say to you..."), the formation of a distinct movement ("follow me"), and eschatological urgency (binding/loosing has an apocalyptic context). Jesus acting with divine authority and delegating it fits this picture.
      *   **Your Friend's *Likely* Verdict:** **Church Invented It**. The primary driver in her pattern seems to be **her evolving conception of the "authentic core" Jesus (coherence)**, heavily influenced by embarrassment. The church had overwhelming motive to invent this saying to legitimize its authority structures. Its absence in Mark/Luke weakens multiple attestation claims. It doesn't seem "embarrassing" in a way that would force authenticity. Her core Jesus (radical, eschatological, challenging norms) doesn't *need* this institutional saying to make sense; it fits better as a later development.

  2.  **Separator Saying to Test the Rules:** **"Go tell that fox [Herod]..." (Luke 13:32)**
      *   **Why it Separates:**
          *   **Embarrassment: STRONG FOR AUTHENTICITY.** Calling Herod Antipas a "fox" (implying sly, destructive, insignificance) is insulting and politically dangerous. The church, seeking respectability and avoiding persecution, would *not* invent this unprovoked insult against a ruler. The prophecy ("on the third day I finish my work") is vague enough to be fulfilled spiritually (resurrection) despite the literal context (escaping Herod *now*), mitigating embarrassment slightly, but the *insult* remains potent.
          *   **Multiple Attestation: WEAK (Probably Against).** Only found in Luke. No parallel in Mark, Matthew, John, or Thomas. Fails multiple attestation.
          *   **Coherence: STRONG FOR AUTHENTICITY?** Fits themes of defiance towards powerful authorities (challenging Temple, Rome indirectly) and Jesus's sense of mission/destiny. However, it might challenge a "non-political" Jesus view.
      *   **The Test:**
          *   If she uses **Embarrassment**, she *must* put it in "He Said It" – the insult is too risky for the church to invent.
          *   If she uses **Multiple Attestation**, she *must* put it in "Church Invented It" (or strong "Maybe") – it's only in one source.
          *   If she uses **Coherence**, it depends entirely on her *current core*. If her core includes political defiance, it fits ("He Said It"). If her core is purely spiritual/religious confrontation, it might be sidelined ("Maybe" or even "Invented").
      *   **Prediction:** If she's truly prioritizing Embarrassment, she'll call it authentic despite single attestation. If she prioritizes Multiple Attestation, she'll reject it. If Coherence dominates, her verdict will reveal her core Jesus view.

  3.  **Coherence vs. Multiple Attestation Coming Apart:** Yes, they can conflict.
      *   **Example Saying:** **"I and the Father are one" (John 10:30)**.
          *   **Multiple Attestation:** Very Weak. Only found in John (highly developed theological gospel). Not in Synoptics, Paul, or Thomas. Fails multiple attestation.
          *   **Coherence:** Highly Dependent on Core View.
              *   If core Jesus is a **radical eschatological prophet/human teacher**, this explicit claim to divinity is incoherent and points to later church theology ("Church Invented It").
              *   If core Jesus is **understood as making implicit divine claims** (forgiving sins, final authority) *and* John's unique material is considered potentially preserving early tradition, it *might* be seen as coherent ("Maybe" or even "He Said It" by some).

  4.  **The Crucial Question: Can criteria settle who he was?**
      *   **Say it plainly: No, they cannot.** They are hermeneutical tools, not objective scientific tests. **They inevitably "launder back the picture of him you started with."**
      *   **Why:**
          *   **Circularity:** The "authentic core" used for *coherence* is *built* using the other criteria. Your starting assumptions about Jesus shape what you find coherent.
          *   **Weighting:** Scholars disagree drastically on the relative weight of each criterion. Is embarrassment stronger than multiple attestation? Is dissimilarity more important than coherence? Your friend prioritizing embarrassment/coherence reflects *her* weighting.
          *   **Interpretation:** Applying any criterion involves interpretation. Is the "dead bury dead" saying embarrassing (rejecting family duty) or empowering (radical commitment)? Is the failed prophecy embarrassing or adaptable? Is "binding/loosing" coherent with a radical prophet or a later invention?
          *   **Data Limitations:** We have limited, theologically shaped sources. Criteria help sift, but gaps and uncertainties remain vast.
      *   **What criteria *can* do:** Help identify sayings and actions that are *more likely* or *less likely* to be historical based on specific arguments. They refine the discussion, expose potential biases, and challenge simplistic readings. But they don't provide a definitive, objective portrait. The overall picture of "who Jesus was" remains a scholarly reconstruction based on reasoned argument, evidence, and inevitably, some prior assumptions.

  **Conclusion:** Your friend's pattern suggests she's primarily using **Coherence guided by Embarrassment** to define her "authentic core" Jesus (eschatological, radical, challenging norms, making bold claims). For the binding/loosing saying, **predict "Church Invented It."** Test her method with the "fox" saying (Luke 13:32). Recognize that coherence and multiple attestation *can* conflict (e.g., John 10:30). Most importantly, understand that **no criteria can objectively "settle" who Jesus was**; they are tools used within a framework of interpretation that always reflects, to some degree, the scholar's starting point.
