  Hmm, the user is deep into Lewis-style conventions and norm evolution, with about a year of part-time work under their belt. They're worried that the Lewis framework breaks down when conventions become moralized—like how driving on the left in Britain isn't a moral issue, but breaking a queueing convention might make someone seem "bad." They also point out that some norms are followed even when defecting is easy and unpunished, which doesn't fit the self-interest model of conventions. Their main ask is for me to rank open questions in this field based on upstreamness, tractability for conceptual work, and how much other work depends on the answers. They want me to be honest about what's settled versus contested and finish with a top question in under ten words.

  First, I need to recall the core of Lewis's theory. He defined conventions as solutions to coordination problems where people follow them because they expect others to, and it's in their self-interest to coordinate. But the user's issue is that this doesn't explain moralized norms or why people stick to norms when defection is costless. That's a valid critique—it's where the theory feels incomplete.

  For open questions, I should brainstorm based on their criteria. Upstreamness means fundamental questions that could reshape the field. Tractability is key since they're doing solo conceptual work without a lab. And impact refers to how resolving a question could influence other areas like ethics, social science, or AI alignment. I'll list potential questions: maybe how conventions become moralized, the distinction between norms and conventions, why some norms persist without enforcement, or how norms evolve in complex societies.

  Prioritizing them: The moralization question seems most upstream because it directly challenges Lewis's model and ties into bigger ideas about normativity. If we can explain why some conventions take on moral force, that could bridge descriptive and normative theories. It's also tractable—lots of existing philosophical work to build on, like Bicchieri's empirical stuff or Strawson's reactive attitudes. Impact-wise, it affects moral psychology and cultural evolution.

  Next, the norm-convention distinction: it's foundational but a bit messier with ongoing debates. Then, the puzzle of non-equilibrium norms—like why people recycle when no one's watching—which is important but might require more empirical input, making it less ideal for pure conceptual work. After that, evolution in pluralistic societies, which is downstream but relevant to modern issues. Finally, scaling up Lewis's model, but that's more settled with extensions like network theory.

  I need to be transparent about contested views. For example, the moralization question isn't settled; there's a fight between internalization theories (Brennan et al.) and signaling theories (Sosis). I should flag that. Similarly, the norm-convention line is blurred, with some like Southwood denying a sharp divide.

  For the final answer, the top question should be punchy: "Origin of moral force in conventions" captures it in under ten words. That's the bet I'd make, as resolving it could unlock many other puzzles.

  Overall, I'm structuring the response to match their request: rank questions with criteria, explain trade-offs, and end with the key question. This addresses their nagging worry directly and gives a path forward.
answer: |-
  Here's a ranked list of open questions in convention/norm theory, tailored to your situation and criteria, with explicit reasoning on prioritization and contestation:

  **Ranked Open Questions (Highest to Lowest Priority):**

  1.  **The Moralization Puzzle:** How and why do *some* coordination equilibria (Lewis-conventions) acquire genuine moral force ("oughtness"), transforming into norms where violation elicits moral condemnation (beyond mere annoyance or practical inconvenience), even when the original coordination problem lacks inherent moral content?
      *   **Upstreamness:** High. This directly addresses your core worry. Resolving it requires tackling the fundamental gap between descriptive coordination and prescriptive normativity, potentially revising or extending Lewis's core framework. It bridges game theory, moral psychology, and meta-ethics.
      *   **Tractability (Conceptual):** High. Progress can be made through conceptual analysis, thought experiments, synthesizing existing philosophical work (e.g., Strawson on reactive attitudes, Gibbard on norm-expressivism, Railton on moral naturalism), and formalizing proposed mechanisms (e.g., signaling commitment, internalization costs, group identity markers). No lab required.
      *   **Impact/Work Hanging:** High. Answers would reshape understanding of normativity's origins, the relationship between social norms and moral norms, the evolution of cooperation, and applications in political philosophy, legal theory (customary law), and AI alignment (value learning).
      *   **Contestation:** High. Major live fights: Is moralization an *illusion* explained by complex signaling/punishment (Bicchieri, Sosis)? Is it genuine internalization via cognitive mechanisms (Brennan/Pettit, Sripada)? Does it require group-level functional explanations (Sober/Wilson)? Or does it stem from the perceived *authority* of the norm (Hart, Southwood)? **No consensus exists.**

  2.  **The Norm-Convention Distinction & Spectrum:** What is the precise relationship and boundary (if any) between Lewisian conventions (solution to pure coordination, driven by expectations and self-interest) and social norms (often perceived as intrinsically obligatory, potentially costly to follow, and enforced via sanctions)? Are they fundamentally distinct categories or endpoints on a spectrum defined by properties like moralization, costliness, and enforcement?
      *   **Upstreamness:** High. Defining the core object of study is foundational. Your concern about "convention vs. norm" is central here. Clarifying this distinction (or lack thereof) is prerequisite for tackling the moralization puzzle systematically.
      *   **Tractability (Conceptual):** Very High. Primarily conceptual and definitional work. Analyzing existing definitions (Lewis, Ullmann-Margalit, Bicchieri, Brennan/Pettit, Southwood), identifying key differentiating features, and constructing typologies are well-suited to desk-based research.
      *   **Impact/Work Hanging:** High. Affects how we model norm emergence/evolution, interpret empirical findings, and understand the scope of "convention" vs. "norm" explanations across disciplines (economics, sociology, anthropology).
      *   **Contestation:** High. Significant disagreement. Lewisians defend a sharp distinction based on game structure. Others (e.g., Southwood) argue the distinction is blurry or unhelpful, emphasizing the *normative attitude* held by participants as key. Bicchieri focuses on conditional preferences and empirical expectations. **No consensus on the defining boundary or necessity of the distinction.**

  3.  **Non-Equilibrium Norm Adherence ("Over-Compliance"):** Why do individuals adhere to norms (especially costly or moralized ones) in situations where *defection is objectively cheap, low-risk, and unlikely to be detected or punished* (e.g., recycling when alone, not cheating when easily possible)? What mechanisms sustain this beyond pure expectation-based equilibrium?
      *   **Upstreamness:** Medium-High. Directly challenges the sufficiency of the Lewisian equilibrium explanation for a large class of important norms. Forces engagement with internal motivations and cognitive mechanisms.
      *   **Tractability (Conceptual):** Medium. Conceptual work can propose and evaluate mechanisms (e.g., internalized values/guilt, identity-constitutive norms, cognitive biases like rule-following heuristics, perceived "metanorms"). However, empirically validating these mechanisms is harder without experiments/simulations. Strong conceptual frameworks are needed to guide future empirical work.
      *   **Impact/Work Hanging:** High. Explains the stability of prosocial norms, the persistence of "irrational" traditions, and the limits of purely incentive-based models of behavior. Crucial for understanding civic behavior, ethical conduct, and resistance to corruption.
      *   **Contestation:** High. Major debates: Is it primarily internalization (psychology/evolution)? Is it signaling to oneself or an imagined audience (Bénabou/Tirole)? Is it a cognitive commitment device (Ainslie)? Is it driven by low-level perceptual/behavioral scripts (habitus)? **No dominant explanation; active empirical and theoretical research.**

  4.  **Evolution of Norms in Pluralistic/Large-Scale Societies:** How do norms emerge, spread, stabilize, and change in large, heterogeneous populations with conflicting interests, identities, and existing normative frameworks? How do "norm entrepreneurs" succeed? How do norms interact/compete within such environments?
      *   **Upstreamness:** Medium. Builds on more fundamental questions (like 1-3) but addresses a critical limitation of the original Lewis picture (often implicitly assuming small, homogeneous groups). Directly relevant to modern contexts.
      *   **Tractability (Conceptual):** Medium-Low. Conceptual work can model mechanisms (network diffusion, framing, identity politics, institutional interaction). However, tractability decreases due to complexity; formal modeling and simulation often become necessary tools to explore dynamics rigorously, which is harder solo.
      *   **Impact/Work Hanging:** Very High. Essential for understanding social change, cultural conflict, political polarization, the rise of new ethical standards (e.g., environmentalism), and the decline of old ones. Highly relevant to policy and social movements.
      *   **Contestation:** Medium-High. While the *importance* is settled, the *mechanisms* are hotly contested (e.g., prominence of network structure vs. content/framing vs. elite influence vs. grassroots mobilization). Significant work using evolutionary game theory, network science, and cultural evolution models. **No unified theory; active multi-disciplinary field.**

  5.  **Scaling Up Lewis: Dynamic Evolution & Path Dependence:** How do conventions *initially* emerge from a state of no expectations? How do expectations *crystallize*? What drives norm *change* over time? How strong is path dependence?
      *   **Upstreamness:** Medium-Low. Lewis provided a basic static account of stability. The dynamic process of emergence and change is the natural extension.
      *   **Tractability (Conceptual):** Medium. Conceptual work can outline processes (salience, precedent, learning, innovation). However, understanding complex dynamics often benefits significantly from formal modeling (evolutionary games, learning models) or simulation, which might be less accessible solo.
      *   **Impact/Work Hanging:** Medium-High. Important for understanding historical institutional development, technological standards, and linguistic change. Provides micro-foundations for larger-scale evolution.
      *   **Contestation:** Medium. The *importance* of dynamics is settled. There's consensus that salience, precedent, and learning matter. Contestation exists over the *relative importance* of different mechanisms (e.g., payoff-based learning vs. imitation vs. belief-based reasoning) and the strength of path dependence. **Core mechanisms are recognized, but their interplay and dominance are debated.**

  **Criteria Trade-offs & Movement:**

  *   **Upstreamness vs. Tractability:** The most upstream questions (1, 2) are often highly tractable conceptually but fiercely contested. Highly upstream questions involving complex dynamics (5) become less tractable without formal tools. Question 3 strikes a good balance for you. *Moving Up:* Questions become more upstream if they challenge fundamental assumptions of the Lewis framework itself. *Moving Down:* Questions become less upstream if they focus on applying an established framework to specific domains.
  *   **Tractability (Conceptual) vs. Impact:** Question 4 has massive impact but lower tractability for pure conceptual work due to complexity. Question 3 has high impact and good conceptual tractability. *Moving Up:* If a question can be tackled primarily through rigorous conceptual analysis, argumentation, and synthesizing existing philosophical/formal literature. *Moving Down:* If answering it robustly *requires* novel formal modeling, large-scale data analysis, or controlled experiments you can't perform.
  *   **Contestation:** High contestation indicates a live, important question but also means your arguments need to engage deeply with opposing views. Questions 1 and 2 are core battlegrounds. Settled ground includes: Lewis's core definition of convention as a coordination equilibrium sustained by mutual expectations; the basic logic of equilibrium selection via salience/precedent; the role of punishment in stabilizing *some* norms (though its necessity/mechanism is debated).

  **The Top Bet:**

  Based on your core worry, high upstreamness, conceptual tractability, and potential impact, the single question to bet on is the one directly confronting the gap you identified:

  \answer{Origin of moral force in conventions.}
