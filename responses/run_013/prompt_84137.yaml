  ---

  **MEMORANDUM**

  **To:** Rules Committee Members  
  **From:** [Your Name], Chair, Rules Committee  
  **Date:** [Date]  
  **Subject:** Recommendation Regarding Arbitrage in the Prediction Market  

  ### Background
  The committee has been made aware of a series of trades by a participant (a retired actuary) that have resulted in a guaranteed profit (arbitrage) by exploiting pricing inconsistencies in related contracts. Specifically, the trader combined positions in contracts with logical relationships (e.g., contracts on the tram opening date) to lock in a risk-free gain. The trader has made approximately $700 from these strategies, which represents a significant portion of the prize pool. This has caused discontent among other participants, some of whom have called for disqualification and voiding of his positions.

  ### Key Facts
  - The trader did not violate any explicit rule in the current rulebook.
  - The arbitrage was possible because of pricing inconsistencies in the market (e.g., the price of a combined event was higher than the sum of the prices of its mutually exclusive components).
  - The trades were entered into voluntarily by counterparties who agreed to the prices at the time.

  ### Analysis
  The committee considered two primary principles: (1) the integrity and fairness of the market, and (2) the long-term health of the prediction market as a forecasting tool.

  #### Arguments for Upholding the Trades
  - **Rule of Law**: The trader operated within the rules as they existed. Voiding his trades retroactively would set a precedent that the rules are subject to arbitrary change, which could undermine trust in the market.
  - **Market Efficiency**: The trader's actions corrected a mispricing. By buying undervalued contracts and selling overvalued ones, he brought prices closer to efficient levels, which is a valuable service.
  - **Voluntary Trades**: Counterparties willingly took the other side of these trades. They had the same opportunity to recognize the mispricing and did not.

  #### Arguments for Intervening
  - **Purpose of the Market**: The market's primary goal is to aggregate information through forecasting. Risk-free arbitrage does not contribute to this goal and drains the prize pool without adding informational value.
  - **Sustainability**: Allowing unchecked arbitrage could deplete the prize pool, reducing incentives for genuine forecasting and participation. This is particularly acute in a small market like ours.
  - **Fairness to Participants**: Many participants are not sophisticated traders. They engage to contribute their forecasts, not to compete against arbitrageurs with actuarial expertise.

  #### Concern About Becoming a "Betting Shop"
  The committee acknowledges that allowing arbitrage might shift the market's focus from forecasting to financial engineering. However, note that:
  - Arbitrage exists in all financial markets and contributes to efficiency. But our market is not a financial exchange; it is a tool for our organization. We must therefore prioritize its forecasting purpose over trading for trading's sake.

  ### Recommendation
  After careful consideration, the committee recommends:

  1. **Existing Positions and Winnings**: The actuary's trades and winnings should stand. Voiding them retroactively would be unfair and would damage the credibility of the market. The counterparties who traded with him did so voluntarily, and the trader broke no rule.

  2. **New Rule Going Forward**: 
     - We propose a new rule: 
          **"Rule X: Prohibition of Risk-Free Arbitrage**  
          Traders are prohibited from entering into any combination of trades that, at the time of the trade, is designed to yield a guaranteed profit regardless of the outcome of the underlying events. The committee will monitor for such strategies and may void trades that violate this rule. Repeated violations may lead to suspension or expulsion from the market."
     - This rule will be effective immediately upon approval by the committee.

  3. **Implementation**:
     - The committee will develop a set of guidelines to help identify prohibited arbitrage strategies (e.g., combinations that create a synthetic risk-free asset). We will also explore technical solutions to prevent logical inconsistencies in pricing, such as:
          - Requiring that contracts with logical relationships (like mutually exclusive and exhaustive events) have prices that sum appropriately.
          - Implementing a simple market maker that updates prices in a logically consistent manner.
     - We will provide educational materials to traders about the new rule and the importance of consistent pricing.

  4. **Addressing the Prize Pool Drain**:
     - The committee will consider adjusting the prize structure (e.g., increasing sponsor funding) to replenish the pool if necessary. We will also monitor the impact of the new rule on the prize pool.

  ### Conclusion
  The actuary's trades, while controversial, were within the rules. However, to preserve the market's forecasting purpose, we must prohibit risk-free arbitrage going forward. This approach balances fairness to the actuary with the need to protect the market's integrity and sustainability.

  We will discuss this recommendation at the meeting on Tuesday and welcome your input.

