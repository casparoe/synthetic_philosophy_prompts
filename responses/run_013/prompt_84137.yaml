     Rule going forward: 
     "Traders are prohibited from entering into a combination of trades that, at the time of the trade, is designed to yield a risk-free profit (arbitrage) regardless of the outcome of the events. The committee reserves the right to void such trades and/or impose penalties on traders who engage in such activities."

     However, note that this rule might be difficult to enforce and might require real-time monitoring. 

     Alternatively, we can educate traders about the logical relationships and encourage them to set prices consistently. But that might not be sufficient.

  3. Address the concern about turning the market into a betting shop: 
     - The primary purpose of the market is forecasting. Arbitrage does not contribute to forecasting because it doesn't reflect any belief about the event. However, it does serve to correct prices and make the market more efficient. 
     - But in a small market with a limited prize pool, we must also consider the sustainability. If arbitrageurs can drain the prize pool without risk, then the forecasting incentive is diminished. 
