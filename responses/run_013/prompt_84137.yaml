     a. Require that contracts that are logically related (like the ones in this example) have their prices constrained by the market mechanism. One way is to introduce automated arbitrageurs (but that might be complex for a small market).

     b. Alternatively, we can introduce a rule that prohibits traders from holding positions that create a guaranteed profit without risk (arbitrage positions). However, this might be difficult to enforce and monitor.

