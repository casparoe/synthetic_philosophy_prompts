answer: |-
  ### MEMORANDUM  
  **To:** Rules Committee Members  
  **From:** [Your Name], Chair, Rules Committee  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Arbitrage Trades and Market Integrity  

  ---

  #### **Background**  
  Over the past month, Trader A (a retired actuary) executed combinations of trades that guaranteed risk-free profits by exploiting pricing inconsistencies in logically related contracts. The most notable example:  
  - Bought "Tram opens by June" at $20.  
  - Bought "Tram opens between June and August" at $25.  
  - Sold "Tram opens by August" at $60.  
  Net cost: $45. Net payout: $60. Profit: $15 *regardless of outcome*.  
  Similar strategies netted Trader A ~$700 (≈15% of the prize pool). Traders demand his disqualification; he argues he broke no rules and exposed market inefficiencies.  

  #### **Core Issues**  
  1. **Rule Violation**: No explicit rule prohibits arbitrage.  
  2. **Market Purpose**: Is risk-free profit compatible with a *forecasting* market?  
  3. **Fairness**: Should prices be "corrected" retroactively?  
  4. **Precedent**: How do we prevent recurrence?  

  ---

  ### **Analysis & Recommendation**  
  #### **1. Trader A’s Existing Positions & Winnings: Uphold Them**  
  **Reasoning**:  
  - **Voluntary Trades**: No coercion occurred. Counterparties freely accepted Trader A’s prices. Voiding trades retroactively sets a dangerous precedent—participants must trust settled transactions.  
  - **No Rule Broken**: The rules did not forbid combinatorial strategies. Punishing ingenuity ex post facto damages credibility.  
  - **Market Efficiency Argument**: Trader A is correct that prices, not his actions, were flawed. His trades corrected mispricings (e.g., "Tram by August" should logically equal "Tram by June" + "Tram June-August"). By profiting, he absorbed losses from traders who set irrational prices, incentivizing future accuracy.  
  - **Prize Pool Impact**: While $700 is significant, revoking it penalizes Trader A for others’ pricing errors. The prize pool’s volatility is inherent to speculative markets.  

  **Conclusion**: Trader A keeps his winnings.  

  #### **2. New Rule: Ban Risk-Free Arbitrage Combos**  
  **Proposed Rule**:  
  > *"Traders may not enter combinations of trades designed to yield a guaranteed profit irrespective of event outcomes. The Committee reserves the right to void such trades, claw back profits, and/or impose penalties."*  

  **Reasoning**:  
  - **Preserving Forecasting Integrity**: Our market aims to aggregate *information*, not host casino-style arbitrage. Risk-free bets add zero informational value and drain the prize pool, demoralizing forecasters.  
  - **"Betting Shop" Concern**: Allowing arbitrage shifts focus from knowledge-based forecasting to financial engineering. We are not a derivatives exchange; our purpose is insight, not pure profit.  
  - **Practical Enforcement**:  
    - Combinations that create "synthetic sure things" (e.g., buying A+B while selling C where C = A+B) are identifiable.  
    - Traders must declare combo intent at execution (if flagged, the Committee reviews).  
  - **Precedent**: Prediction markets (e.g., PredictIt) ban arbitrage to maintain forecasting incentives.  

  #### **3. Mitigating Future Risks**  
  - **Education**: Publish a guide on logical pricing (e.g., "Tram by August" must always price ≥ "Tram by June" + "Tram June-August").  
  - **Price Alerts**: Implement automated checks for obvious mispricings in related contracts, pausing trades if inconsistencies exceed 5%.  
  - **Whistleblower Incentive**: Award 10% of clawed-back arbitrage profits to traders who report violations pre-settlement.  

  ---

  ### **Addressing Key Objections**  
  #### *"But prices were irrational—why punish Trader A?"*  
  We agree prices were flawed, but retroactive intervention undermines market trust. Trader A’s *method* (risk-free extraction) is the issue, not the outcome. The new rule prospectively aligns incentives with forecasting.  

  #### *"This stifles sophisticated trading!"*  
  Sophistication is welcome—*if it carries risk*. Buying undervalued contracts based on belief (e.g., "Tram by June at $20 is too low") is legitimate. Banned only are combos engineered to be risk-free.  

  #### *"We’re turning into a betting shop!"*  
  Arbitrage transforms the market into a zero-sum casino. Banning it refocuses us on knowledge-based forecasting. Risk-taking remains central—but *informed* risk.  

  ---

  ### **Summary of Actions**  
  1. **Trader A’s winnings stand** (no rule broken; trades were voluntary).  
  2. **Adopt new rule banning risk-free arbitrage combos** (effective immediately).  
  3. **Educate traders** on logical pricing and implement price-alert safeguards.  
  4. **Replenish prize pool** via sponsor injection if needed, signaling commitment to fairness.  

  This preserves trust in past trades while realigning the market with its forecasting purpose. I move to vote on Tuesday.  

  ---  
  **Attachments**:  
  - Draft rule language (Appendix A)  
  - Logical pricing guide (Appendix B)  

  *Appendix A: Proposed Rule Language*  
  > **Section 5.1: Arbitrage Prohibition**  
  > Trades designed to yield risk-free profits through combinatorial strategies are prohibited. The Committee may void trades, reclaim profits, or suspend traders for violations. Suspected arbitrage must be reported pre-settlement for review.  

  *Appendix B: Logical Pricing Primer*  
  > - Example: If Contract C covers Event A + Event B, then:  
  >   `Price(C) ≥ Price(A) + Price(B)`.  
  > - Violations create "free money" opportunities that drain the prize pool.
