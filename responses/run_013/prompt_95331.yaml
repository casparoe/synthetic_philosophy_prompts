  I'll use analogies like constrained chemical reactions or avalanche triggers that preserve agency within systems. For collective responsibility, I'll distinguish between culpability (leaders), complicity (supporters), and inheritance (society). The firing squad analogy works for distributed causality but not for the sequential nature of 1914.

