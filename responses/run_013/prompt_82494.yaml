answer: |-
  ## People Team Internal Memo: Wellbeing Measurement Modernization Initiative (Q2 2024)  

  **To:** All Staff  
  **From:** People Strategy & Insights (PSI)  
  **Subject:** Transition to Revealed Preference Wellbeing Metrics (RPWM) - Effective Q3 2024  

  **Q1: Why is PSI changing how we measure wellbeing?**  
  A1: Traditional methods (e.g., engagement surveys, sentiment analysis) rely on stated preferences and subjective recall, proven unreliable indicators of true wellbeing. Actions reveal authentic priorities. Starting Q3, your wellbeing score will be derived *exclusively* from choices you make regarding company-offered benefits, programs, and behavioral options. This eliminates reporting bias and aligns measurement with demonstrable welfare.

  **Q2: How is my wellbeing score calculated?**  
  A2: Your RPWM score reflects the coherence and consistency of your choices within the available option set. For example:  
  *   Choosing "FlexStart" (start work at 10 AM) over "CoreHours" (start at 8:30 AM) reveals a preference for later starts, contributing positively to your "Schedule Flexibility" wellbeing sub-score.  
  *   Selecting the "Mindful Mornings" meditation session over the "Power Hour" email catch-up reveals a preference for mindfulness, enhancing your "Stress Resilience" sub-score.  

  **Q3: What if I choose a benefit but then regret it or feel it harms my wellbeing?**  
  A3: Revealed preference theory holds that your choice *defines* your preference at the point of decision. Post-choice sentiment (regret, dissatisfaction) is considered observational noise, not a data point for your score. Your action demonstrated the option maximized your wellbeing *given the available alternatives at that moment*. If you consistently choose pizza at the weekly lunch but report feeling unwell afterwards, your choices reveal a preference for pizza *over the alternative of no provided lunch*. This preference is reflected in your "Nutritional Satisfaction" sub-score.

  **Q4: I'd genuinely prefer cash instead of the free pizza. Why isn't cash an option?**  
  A4: Preferences are only revealed over the *actual* options presented. Since cash compensation adjustments are negotiated during annual review cycles and not offered as a daily alternative to pizza, your preference for cash *over pizza* cannot be observed or measured within this specific choice architecture. Your choice between pizza and no pizza remains the relevant data point for RPWM.

  **Q5: What happens if my choices seem inconsistent? E.g., I chose Workshop A over Workshop B, Workshop B over Workshop C, but then chose Workshop C over Workshop A?**  
  A5: Violations of choice transitivity (A>B, B>C, but C>A) indicate potential data contamination or decision-making noise. This impacts score accuracy. Employees exhibiting cyclical choice patterns will be flagged for a mandatory "Choice Architecture Rationality Coaching" (CARC) session with PSI. CARC helps align your revealed preferences with internally consistent ordering, improving data quality and your final RPWM score.

  **Q6: An employee consistently chooses the high-deductible health plan and pizza lunches, but seems visibly stressed and complains about feeling unhealthy. How is this reflected?**  
  A6: The employee's choices reveal a preference for the specific combination of immediate cost savings (high-deductible plan) and convenience/taste (pizza) *over the alternatives offered*. Their actions demonstrate these options maximize their utility. Observed stress or verbal complaints are not part of the RPWM dataset. PSI may recommend the employee consult our behavioral economics liaison regarding potential *intra-choice dissonance perception management*, a separate support stream.

  **Q7: How will we track overall company wellbeing?**  
  A7: PSI will publish a quarterly "Aggregate Revealed Wellbeing Index" (ARWI). This index averages individual RPWM scores (normalized on a 0-100 scale based on choice consistency and frequency within peer groups) across departments and seniority bands. This allows clear comparison of wellbeing trends over time and between teams, highlighting areas where choice architecture may need optimization. See Appendix A for Q1-2024 ARWI benchmarks.

  **Q8: What happened to the annual engagement survey?**  
  A8: The engagement survey has been discontinued. Stated preferences ("I value work-life balance") uncorroborated by observable choices (e.g., *not* utilizing flexible scheduling when offered) are classified as "cheap talk" and provide no reliable signal for wellbeing investment or policy. Resources are better allocated to expanding tangible choice sets.

  **Q9: Where can I learn more about the theory behind RPWM?**  
  A9: Visit the PSI Portal > Resources > Wellbeing Modernization > "Foundations of Revealed Preference." Mandatory micro-modules on choice optimization will be released in Q3.

  ---

  **Footnote (Appendix B - Working Group Minority Dissent):**  
  *While supporting data-driven approaches, I dissent on RPWM’s core validity. Defining wellbeing solely by choice within constrained sets confuses prediction with evaluation. The model assumes choices reveal "true" preferences, making negative wellbeing outcomes (e.g., consistent "unhealthy" choices) impossible by definition – the choice *is* the wellbeing. It renders the entire framework unfalsifiable. We built an apparatus to describe choices, not to ethically grade welfare. Ranking individuals via ARWI aggregates ordinal, non-comparable preferences, violating fundamental measurement principles (cf. Arrow’s Impossibility). This risks mistaking observable behavior for normative good.* - Dr. A. Finch, Behavioral Economist (PSI WG Member).
