answer: |-
  ## The Practice
  Common law contract enforcement follows three core rules:  
  1. **Bargained-for promises**: A promise supported by consideration (a bargained-for exchange) is enforceable.  
  2. **Relied-upon promises**: A promise is enforceable under promissory estoppel if the promisee reasonably and detrimentally relied on it, even absent consideration.  
  3. **Gratuitous promises**: A bare, gratuitous promise (e.g., a gift promise) is unenforceable, regardless of deliberateness or solemnity.  
  A fourth category creates inconsistency:  
  4. **Moral obligation promises**: Promises to fulfill a pre-existing moral obligation (e.g., repaying a life-saving act or past uncompensated care) split courts. Some enforce them as binding, treating the moral duty as sufficient "consideration." Others refuse, holding moral obligation is not consideration, rendering the promise unenforceable.  

  ---

  ## What it Presupposes
  The enforcement pattern presupposes a **detrimental reliance or reciprocal exchange theory** of binding promises, explicitly rejecting a **solemn commitment theory**.  

  *   **Rejection of Intrinsic Binding Force:** The refusal to enforce deliberately made, solemn gratuitous promises demonstrates that the law does *not* view the act of promising itself, as a moral commitment, as sufficient to create legal obligation. Ordinary morality's condemnation of broken gratuitous promises is irrelevant legally.  
  *   **Primacy of Detriment/Exchange:** Enforcement triggers only when the promise generates a *concrete, measurable change in position* (detrimental reliance causing injustice if unenforced) or involves a *reciprocal exchange of value* (consideration).  
      *   *Consideration* embodies the exchange principle: enforcement is justified because each party undertook a legal detriment at the inducement of the other, creating mutual obligation and societal benefit from bargains.
      *   *Promissory Estoppel* embodies the reliance principle: enforcement is justified to prevent injustice caused by the promisee's reasonable, foreseeable, and detrimental reliance on the promisor's commitment. The harm of broken reliance outweighs the lack of bargain.
  *   **Ambiguity of Moral Obligation:** The split on moral obligations reveals the theory's core tension. Courts enforcing such promises often implicitly treat the *antecedent benefit received* as a quasi-consideration or a ground for equitable enforcement akin to reliance, focusing on the *past exchange* or *preventing enrichment*. Courts refusing enforcement strictly adhere to the requirement for *present* detriment or exchange, viewing the moral duty as legally inert background. This inconsistency suggests the pattern presupposes that binding force arises *externally* (from reliance or exchange), not *internally* (from the promise itself), but struggles with benefits already conferred that lack formal exchange or subsequent reliance.

  **Strict Requirements:** The pattern *requires* that neither deliberateness nor solemnity alone suffices for enforcement. It *requires* that either detrimental reliance or a bargained-for exchange is generally necessary (and often sufficient). It *requires* rejecting the enforceability of purely executory gratuitous promises.  

  **Accommodation:** The pattern *accommodates* but does not strictly require the enforcement of moral obligation promises. The split jurisprudence shows this is a permissible extension under some interpretations of reliance or benefit principles, but not a core mandate of the pattern itself.  

  ---

  ## What it Leaves Open
  The pattern is philosophically **underdetermined** because it equally accommodates at least two distinct (and potentially incompatible) theoretical justifications for why reliance or exchange bind, neither of which it *requires*:  

  1.  **Will Theory (Modified):** This theory holds that promises bind because they manifest the promisor's will to be bound and invite the promisee's expectation. The pattern *accommodates* this if we interpret consideration and reliance as *evidentiary proxies* for a serious intention to be legally bound. Bargain signals intent; reliance makes the promise "operative" by being acted upon. However, the pattern *rejects* the pure will theory that would enforce *all* seriously intended promises, including gifts. The split on moral obligations also fits poorly – why would intention suddenly matter if a past benefit existed?  

  2.  **Reliance/Injustice Avoidance Theory:** This theory holds that promises bind *only* to the extent necessary to prevent harm caused by reliance; the promise itself isn't the source of obligation. The pattern perfectly fits reliance enforcement via estoppel. Consideration can be seen as a *formalized, ex-ante* type of reliance (each party relies by giving something up). The refusal to enforce executory gifts aligns, as no reliance exists yet. The moral obligation split is explicable: courts enforcing may see the promise as inducing forbearance from pursuing moral claims, or the *past* benefit + promise as creating a risk of injustice if revoked. Courts refusing see no *new* reliance on the promise.  

  3.  **Benefit/Unjust Enrichment Theory:** This theory emphasizes the conferral of a benefit as generating obligation. The pattern *accommodates* this through consideration (each party benefits) and promissory estoppel (the promisor benefits from the reliance, or the promisee conferred a detriment that would unjustly enrich the promisor if the promise were broken). The moral obligation cases enforcing the promise directly invoke this logic: the promisor received a past benefit, and the promise acknowledges the debt, preventing unjust enrichment. The refusal to enforce gratuitous promises fits (no benefit to promisor).  

  **Why Indeterminate?** The pattern cannot distinguish between these theories because:  
  *   Both consideration and reliance involve a form of *detriment* (giving something up / changing position).  
  *   Both can be interpreted as preventing *injustice* (broken bargains disrupt commerce; broken relied-upon promises cause direct harm).  
  *   The moral obligation split highlights the ambiguity: enforcing courts focus on the *past benefit* (Unjust Enrichment) or the *promise-induced forbearance* (Reliance); refusing courts focus on the lack of *bargained-for exchange* (Will/Formalism) or *new reliance* (Strict Reliance). The rules don't dictate which perspective is correct.  

  ---

  ## If the Rivals Were True
  1.  **Pure Will/Solemn Commitment Theory:** If the *act of deliberate promising itself* created binding obligation, the law would enforce:  
      *   All seriously made gratuitous promises (gifts, donations), regardless of reliance or formality.  
      *   All promises based on moral obligations, consistently.  
      *   Formalities (like deeds) might still exist for proof, but reliance and bargain would be irrelevant to enforceability. Promissory estoppel would be unnecessary as a distinct doctrine. Contract law would vastly expand to cover many currently unenforceable commitments.

  2.  **Strict Reliance Theory:** If *only detrimental reliance* created binding obligation:  
      *   Consideration would lose its independent significance. Bargained-for exchanges *without* actual, detrimental reliance (e.g., a simultaneous exchange where neither party relies before performance) might become unenforceable.  
      *   Promissory estoppel would be the *primary* basis for enforcement, requiring proof of actual, reasonable, and detrimental reliance in every case.  
      *   Executory gift promises and purely executory bargains would remain unenforceable until reliance occurred. Moral obligation promises would only bind if the *promise itself* induced new, detrimental reliance (e.g., the promisee forewent other opportunities expecting payment).

  3.  **Pure Benefit/Unjust Enrichment Theory:** If *only the conferral of a benefit* created binding obligation:  
      *   Gratuitous promises would remain unenforceable (promisor receives no new benefit).  
      *   Consideration would be viewed purely as mutual benefit/detriment, but past benefits might suffice more readily.  
      *   Moral obligation promises would be *consistently enforceable* as acknowledgments of a debt for a benefit already received.  
      *   Promissory estoppel would be subsumed under unjust enrichment – the focus would be on whether the promisor *received a benefit* from the promisee's reliance or whether allowing the promisor to renege would unjustly enrich them, rather than on the promise itself inducing reliance. Enforcement might require quantifiable enrichment.  

  ---

  ## Verdict
  The common law enforcement pattern does **not strictly presuppose a single, coherent philosophical theory of why promises bind.** It **presupposes the *rejection*** of the pure will/solemn commitment theory. However, it **equally accommodates** a modified will theory (using reliance/exchange as intent proxies), a reliance/injustice theory, and a benefit/unjust enrichment theory. The core rules requiring detriment (via exchange or reliance) are functionally consistent with all three, and the persistent split on moral obligations vividly demonstrates this underdetermination. The practice is pragmatically justified by concerns of evidentiary certainty, preventing opportunism, and remedying measurable harm, rather than by a unified philosophical account of promissory obligation. It is a functional hybrid, not a doctrinal monolith.
