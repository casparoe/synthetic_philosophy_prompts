answer: |-
  Below is a rigorous specification for an adequate treatment of Maxwell's Demon, organized by requirements, foundational cases, critical distinctions, and inviolable principles. The goal is to expose where tensions arise and which requirement is most lethal to superficial solutions.

  ---

  ### **I. Setups It Must Handle**
  *(Non-negotiable: Core thought experiments)*  
  1. **Trapdoor Demon (Maxwell, 1867)**  
     - *Case*: A "demon" sorts fast/slow molecules via a frictionless trapdoor, creating a temperature gradient without work.  
     - *Requirement*: Must explain why the gradient cannot be exploited perpetually for work.  

  2. **Szilard Engine (Szilard, 1929)**  
     - *Case*: A single-particle gas in a box; measuring its position allows extraction of work via expansion.  
     - *Requirement*: Must account for the cost of initializing/erasing the measurement device.  

  3. **Brownian Ratchet (Feynman, 1963)**  
     - *Case*: A ratchet-pawl device that seems to rectify thermal fluctuations into directed motion.  
     - *Requirement*: Must show why net work extraction fails when the ratchet itself has thermal noise.  

  ---

  ### **II. Distinctions It Must Not Collapse**
  *(Non-negotiable: Conceptual boundaries essential to the paradox)*  
  1. **Physical Entropy (S<sub>phys</sub>) vs. Information Entropy (S<sub>info</sub>)**  
     - *Case*: Reducing S<sub>info</sub> (by measuring) doesn’t automatically reduce S<sub>phys</sub> (e.g., gas entropy).  
     - *Requirement*: Must not equate knowledge *about* the system with physical state changes.  

  2. **Cost of Measurement vs. Cost of Erasure**  
     - *Case*: Measurement can be thermodynamically reversible; erasure is fundamentally dissipative.  
     - *Requirement*: Must distinguish between acquiring information (potentially free) and resetting memory (always costly).  

  3. **Demon’s Dynamics vs. Gas Dynamics**  
     - *Case*: The demon’s memory and operations are physical systems governed by thermodynamics.  
     - *Requirement*: Must model the demon’s entropy changes alongside the gas.  

  ---

  ### **III. Results It Cannot Contradict**
  *(Non-negotiable: Laws of physics)*  
  1. **Second Law (Statistical Form)**  
     - *Case*: Total entropy of an isolated system never decreases: ΔS<sub>total</sub> ≥ 0.  
     - *Requirement*: Must hold for the *combined system* (gas + demon + environment).  

  2. **Microscopic Reversibility**  
     - *Case*: Molecular dynamics are time-reversible; entropy increase arises statistically.  
     - *Requirement*: The demon’s operation must not violate Liouville’s theorem or unitarity.  

  ---

  ### **IV. Tensions & Incompatibilities**
  **The core conflict:**  
  - Microscopic reversibility suggests information processing (e.g., measurement) could be done reversibly.  
  - The Second Law demands irreversible entropy increase for the *total* system.  

  **Where requirements clash:**  
  - **Measurement vs. Erasure**: If measurement is reversible (no entropy cost), but the Second Law holds, erasure *must* be dissipative.  
  - **Information vs. Thermodynamics**: S<sub>info</sub> reduction in the demon *increases* S<sub>phys</sub> elsewhere (e.g., in memory erasure).  

  **Incompatible pair:**  
  *Microscopic reversibility* and *thermodynamic irreversibility* cannot both hold for the same subsystem.  
  - **Resolution**: The demon’s memory is a physical system. "Forgetting" (resetting memory) *must* increase entropy to satisfy the Second Law, even if measurement is reversible.  

  ---

  ### **V. Non-Negotiables vs. Taste**
  | **Requirement**                     | **Status**          | **Why** |  
  |-------------------------------------|--------------------|--------|  
  | Second Law (statistical)            | Non-negotiable      | Empirical bedrock |  
  | Microscopic reversibility           | Non-negotiable      | Quantum/classical mechanics |  
  | Distinction: Measurement vs. Erasure | Non-negotiable      | Key to resolving Szilard |  
  | Trapdoor/Szilard/Ratchet coverage   | Non-negotiable      | Core demon variants |  
  | Unified entropy (S<sub>total</sub> = S<sub>phys</sub> + k·S<sub>info</sub>) | Taste | Some frameworks merge them; others keep distinct |  
  | Demon’s intelligence/agency        | Taste (often irrelevant) | Physical implementation matters, not "intent" |  

  ---

  ### **VI. The Most Lethal Requirement**  
  **Information Dynamics** (specifically: *the cost of erasure*)  
  - **Why it kills quick fixes**:  
    - Proposals that ignore the demon’s memory (e.g., "measurement is free") fail Szilard’s engine.  
    - Solutions relying on reversible computation (e.g., "the demon can undo operations") ignore erasure’s inevitability.  
    - Naive "information is entropy" claims collapse S<sub>phys</sub>/S<sub>info</sub>, violating distinctions.  
  - **Impact**: Invalidates 90% of popular "demon exorcisms" (e.g., early claims that measurement costs energy).  

  ---

  ### **The Resolution in a Nutshell**  
  An adequate treatment **must** show that:  
  1. Measurement *can* be thermodynamically reversible (no immediate cost).  
  2. **But** erasing the demon’s memory to reset the cycle *always* dissipates ≥ *k*T ln 2 per bit (Landauer’s principle).  
  3. This dissipation balances the entropy decrease in the gas, saving the Second Law.  

  The demon’s power comes from shifting entropy to its memory; the "bill" comes due during erasure. The unresolved frontier is whether quantum coherence or alternative computing models alter this picture—but classically, **erasure cost is the kill switch**.  

  Use this spec as a litmus test. When reading, ask: *Does this solution explicitly track the demon’s memory state and its erasure cost?* If not, it’s incomplete.
