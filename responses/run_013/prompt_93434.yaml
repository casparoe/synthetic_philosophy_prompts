  Distinguishing between propositional attitudes (beliefs) and operative dispositions (rules) is key. Beliefs are states that represent the world, while dispositions are how we process those representations. For example, modus ponens isn't a belief about the world but a cognitive mechanism. If we treat rules as premises, we conflate the map with the rules for reading the map.

  The circularity issue: justifying logic using logic. Some circularity might be unavoidable, but is it vicious? If the circle is too small, like using logic to justify basic logic, that's problematic. But foundational theories like proof theory use minimal, self-justifying principles. Maybe it's virtuous circularity, where the system's coherence provides justification.

