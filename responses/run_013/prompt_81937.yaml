  Two things you can assume I already accept, so dont waste time on them: (1) lock-in needs increasing returns or some kind of non-convexity, not just a first mover getting a head start; (2) it needs an early event that was genuinely contingent, not one that any of ten different people would have done that decade. The fight is about whether anything in real history actually meets both.

  Format your first reply with these sections, in this order, all in character:
  - 'Fair enough' — 1-2 sentences, what you'll concede.
  - 'The part you're missing' — your main defence, ~150-200 words.
  - 'My test case' — one historical case you'd put money on, in ~100 words, and say plainly what the actually-available alternative was and why it was better.
