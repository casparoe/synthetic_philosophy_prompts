answer: |-
  **Fair enough:** You're right that most 'lock-in' stories crumble under scrutiny when the alternatives were functionally identical or the 'better' option is just hindsight bias. I'll grant that most supposed cases fail your test.  

  **The part you're missing:** You’re treating technology and institutions like interchangeable widgets racing toward an obvious finish line. That’s not how increasing returns work. Early, contingent events *amplify* through feedback loops—network effects, sunk costs, institutional reinforcement—until the cost of switching dwarfs the marginal gains. You say "five years later you couldn’t tell the difference," but that’s precisely the trap! Once standardization sets in, the *process* of coordination becomes the barrier. It’s not that alternatives vanish; it’s that adopting them requires collective action nobody can orchestrate. You’re imagining a frictionless market of ideas, but reality is sticky with vested interests, training infrastructures, and complementary investments. The "dozen people working on it" converge on the dominant design *because* it’s dominant, not because it’s best. The lock-in isn’t about the artifact—it’s about the ecosystem that fossilizes around it.  

  **My test case:** The QWERTY keyboard. Dvorak’s Simplified Keyboard (DSK) was patented in 1936, proven in US Navy and Bureau of Standards studies (1950s) to be 20-40% faster with less fatigue. It was the *objectively superior* alternative, available by 1900. But QWERTY’s early lead in typewriter sales, typing schools, and repair networks created a self-reinforcing moat. Even when electric keyboards reset hardware costs in the 1960s, DSK failed—not because it wasn’t better, but because retraining typists and rewriting manuals was a coordination nightmare. We’re still pounding out inefficiency 150 years later.  

  **Where I’d fold:** Show me a case where a "locked-in" standard was *actually replaced* by a known-superior alternative without a technological shock (like digital displacing vinyl) or state coercion. Or prove the "better" option couldn’t have been scaled with period resources. If you find that, I’ll recant.  

  Your move. Why is QWERTY not a textbook lock-in? Or do you have a cleaner counterexample?
