  **(Stanza 3 - Conciliationist)**
  But if we disagree on *this* rule, what then?
  **(Stanza 3 - Steadfast)**
  A peer on climate, math? Perhaps. But not on *this*.
  **(Stanza 3 - Conciliationist)**
  My credence falters, slipping point-one-ten.
  **(Stanza 3 - Steadfast)**
