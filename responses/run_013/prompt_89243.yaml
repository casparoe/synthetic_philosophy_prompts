  **(Stanza 4 - Steadfast)**
  Your very doubt confirms the steadfast ground I kiss.
  **(Stanza 4 - Conciliationist)**
  The scale tips back, yet finds no stable seat.

  **(Stanza 5 - Conciliationist)**
