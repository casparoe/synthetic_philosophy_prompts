answer: |-
  Below is a decision tree designed to guide readers from core philosophical commitments to interpretive positions on Nāgārjuna's tetralemma (catuṣkoṭi). The tree prioritizes logical structure over historical interpreters, with internal nodes framed as answerable questions. Branches address exhaustiveness, conclusion status, negation levels, fourth-corner content, logic vs. soteriology, the fourth corner's logical problem, and scope of application. Leaves include major positions with their "most awkward commitment," and gaps/indistinguishabilities are noted.  

  ---

  ### **Decision Tree: Interpreting Nāgārjuna’s Tetralemma**  
  *Start here:*  

  1. **Is the tetralemma’s conclusion a thesis about reality?**  
     - **No** (it relinquishes all views) → **Q1.1**  
     - **Yes** (it asserts a metaphysical claim) → **Q2**  

     **Q1.1: Is the rejection of all four corners a logical demonstration?**  
       - **Yes** → **Leaf: Reductio Reading**  
         *Most awkward commitment: Must explain how rejecting all logical options avoids nihilism or self-refutation.*  
       - **No** → **Leaf: Therapeutic (No-Thesis) Reading**  
         *Most awkward commitment: Risks rendering Madhyamaka ethically inert by treating all views as equally empty.*  

  2. **Are the four alternatives jointly exhaustive?**  
     - **No** (the fourth corner transcends the dichotomy) → **Q3**  
     - **Yes** (they cover all possibilities) → **Q4**  

     **Q3: Does the fourth corner point to an ineffable reality?**  
       - **Yes** → **Leaf: Ineffabilist Reading**  
         *Most awkward commitment: Must justify "pointing" to what cannot be described without smuggling in positive content.*  
       - **No** → *Gap: Unattractive—negates dichotomies without offering logic or soteriology.*  

     **Q4: At which level(s) do the negations operate?**  
       - **Shifting levels** (e.g., conventional/ultimate) → **Leaf: Two-Truths Reading**  
         *Most awkward commitment: Must clarify how shifting levels avoids equivocation.*  
       - **Single level** → **Q5**  

     **Q5: How is the fourth corner possible given classical logic?**  
       - **Suspends excluded middle** → **Leaf: Formal (Four-Valued) Reading**  
         *Most awkward commitment: Imposes a modern logical framework absent in Nāgārjuna’s texts.*  
       - **Tolerates true contradictions** → **Leaf: Dialetheist Reading**  
         *Most awkward commitment: Requires accepting that contradictions obtain in ultimate reality.*  
       - **No logical pretensions** → *Gap: Incoherent—if exhaustive and single-level, classical logic deems "neither" unsatisfiable.*  

  ---

  ### **Key Branch: Scope of Application**  
  *Apply this question to all paths:*  
  **Does the tetralemma behave uniformly across:**  
  - **Propositions** (e.g., "Tathāgata exists after death")?  
  - **Causal origination** (pratītyasamutpāda)?  
  - **Neither** (context determines behavior)?  

  *Positions diverge here:*  
  - **Two-Truths/Reductio**: Often treat causal origination uniformly; propositions vary.  
  - **Ineffabilist/Dialetheist**: May assert uniformity but struggle with causal relations.  
  - *No position denies variation entirely.*  

  ---

  ### **Indistinguishable Positions**  
  - **Reductio & Therapeutic readings** cannot be separated by the tree. Both reject theses and view the tetralemma as dialectical. What distinguishes them is *emphasis*: Reductio focuses on logical incoherence, while Therapeutic prioritizes existential release. Their overlap arises because Nāgārjuna’s rhetoric fuses logic and soteriology.  

  ---

  ### **Unoccupied Combinations & Gaps**  
  1. **"No" to joint exhaustiveness + "No" to ineffable content** → *Gap: Unattractive*. Lacks a clear purpose (neither logical nor soteriological).  
  2. **"Yes" to joint exhaustiveness + single-level negation + no logical pretensions** → *Gap: Incoherent*. Classical logic forbids a satisfiable fourth corner.  
  3. **Uniform application to causal origination only** → *Gap: Unexplored*. Ignores Nāgārjuna’s use in metaphysical contexts.  

  ---

  ### **Tree Logic Notes**  
  - **Branch Order**: Begins with conclusion status (most fundamental divide: thesis vs. no-thesis), then tests exhaustiveness, negation levels, and the fourth corner’s logical problem.  
  - **Scope Question**: Applied universally to reveal positions' flexibility (e.g., Two-Truths may accommodate variation; Formal reading struggles).  
  - **Gaps**: Result from logical constraints (e.g., classical logic clashes with "neither") or interpretive neglect (e.g., causal-only focus).  

  This tree isolates core commitments while exposing tensions in each reading. By navigating it, readers confront how their preexisting stances (e.g., on logic’s role) predispose them to specific interpretations—aiding critical engagement with Madhyamaka’s elusive dialectic.
