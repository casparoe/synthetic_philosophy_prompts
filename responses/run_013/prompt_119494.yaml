answer: |-
  Below is a decision tree that categorizes views on social conventions (tipping, queueing, etc.) by their underlying grounds rather than verdicts. It distinguishes between types of obligations, handles edge cases (e.g., tourists, low-stakes violations), and separates positions like universal bindingness vs. participant-only obligations. The tree has 12 leaves (within your 10–14 target) and avoids "it depends" cop-outs by including a particularist option. Each node is a self-contained question, and leaves include position names, awkward commitments, and case assignments.

  ---

  ### **Decision Tree: Grounds of Social Obligation**  
  *Start at Q1. Answer yes (Y) or no (N) to each question.*

  **Q1:** Is the practice a **Lewis convention**? (A regularity people follow, expect others to follow, and prefer to follow given others do?)  
  - **Y** → Q2  
  - **N** → Q9  

  **Q2:** If you defect, is the primary wrong **harm to a specific person**? (Not diffuse or systemic harm.)  
  - **Y** → Q3  
  - **N** → Q4  

  **Q3:** Does the harm depend on you **participating in the system**? (Are you a "player" who benefits and can reciprocate?)  
  - **Y** → **Leaf 1: Participant-Harm Minimizer**  
  - **N** → **Leaf 2: Universal Harm Minimizer**  

  **Q4:** Is the obligation rooted in **free-riding**? (Defecting while benefiting from others’ cooperation.)  
  - **Y** → Q5  
  - **N** → Q6  

  **Q5:** Does free-riding require you to be a **repeat participant**? (One-time users can’t reciprocate.)  
  - **Y** → **Leaf 3: Reciprocal Free-Rider Obligation**  
  - **N** → **Leaf 4: Universal Free-Rider Obligation**  

  **Q6:** Is the obligation **incurred by participation**? (Did you "sign up" for it by joining the context?)  
  - **Y** → **Leaf 5: Directed Participation Obligation**  
  - **N** → Q7  

  **Q7:** Is the wrong primarily **expressive**? (e.g., disrespect, not direct consequences.)  
  - **Y** → **Leaf 6: Expressivism**  
  - **N** → Q8  

  **Q8:** Do **stakes/contextual factors** dominate? (e.g., risk, visibility, stakes.)  
  - **Y** → **Leaf 7: Contextual Particularism**  
  - **N** → **Leaf 8: Convention as Moral Primitive**  

  **Q9:** (Non-Lewis) Is there **any moral duty** to follow the practice? (Beyond habit or preference.)  
  - **Y** → Q10  
  - **N** → **Leaf 12: Etiquette Isn’t Morality**  

  **Q10:** Is the duty rooted in **preventing harm**? (Even if not convention-based.)  
  - **Y** → **Leaf 9: Non-Conventional Harm Minimizer**  
  - **N** → Q11  

  **Q11:** Is the duty rooted in **prudential self-interest**? (Avoiding backlash, not morality.)  
  - **Y** → **Leaf 10: Prudential Conformity**  
  - **N** → **Leaf 11: Non-Conventional Expressivism**  

  ---

  ### **Leaf Descriptions**  
  *Includes position name, awkward commitment, and assigned cases.*

  1. **Participant-Harm Minimizer**  
     - *Obligation*: Binding only on system participants (can reciprocate).  
     - *Awkward commitment*: Tourists may harm others guilt-free if they don’t "participate" (e.g., US diner tourist).  
     - *Cases*: US diner tourist (if non-participant).  

  2. **Universal Harm Minimizer**  
     - *Obligation*: Binding on everyone (including visitors) to prevent direct harm.  
     - *Awkward commitment*: Must prop up broken systems (e.g., tip even if you oppose sub-minimum wages).  
     - *Cases*: US diner tourist (if harm is universal).  

  3. **Reciprocal Free-Rider Obligation**  
     - *Obligation*: Binding only on repeat participants (to avoid exploiting cooperators).  
     - *Awkward commitment*: One-time free-riding is fine (e.g., skipping an empty queue as a tourist).  
     - *Cases*: Holding a place in line (if local/repeat user).  

  4. **Universal Free-Rider Obligation**  
     - *Obligation*: Binding on all (even one-time users) to avoid unfair benefit.  
     - *Awkward commitment*: Obligated even when reciprocity is impossible (e.g., tourist at counter-service tip jar).  
     - *Cases*: Counter-service tip jar tourist.  

  5. **Directed Participation Obligation**  
     - *Obligation*: Binding via implicit agreement by entering the context.  
     - *Awkward commitment*: "Agreement" is non-consensual (e.g., must remove shoes in a house you entered unwillingly).  
     - *Cases*: Japanese house visitor.  

  6. **Expressivism**  
     - *Obligation*: Binding because defection expresses vice (disrespect, arrogance).  
     - *Awkward commitment*: Wrong even with zero stakes or visibility (e.g., jaywalking alone at 3am).  
     - *Cases*: Jaywalking at 3am (if expressive).  

  7. **Contextual Particularism**  
     - *Obligation*: Case-specific; stakes/context determine if binding.  
     - *Awkward commitment*: No bright-line rules; highly subjective.  
     - *Cases*: Jaywalking at 3am (low stakes → OK), escalator standing (high stakes → not OK).  

  8. **Convention as Moral Primitive**  
     - *Obligation*: Binding because conventions create moral facts (no further grounds).  
     - *Awkward commitment*: Must obey arbitrary conventions (e.g., never cut a queue, even empty).  
     - *Cases*: Queueing (rigid view).  

  9. **Non-Conventional Harm Minimizer**  
     - *Obligation*: Binding to prevent harm, even without convention.  
     - *Awkward commitment*: Applies to non-conventions (e.g., tip jar at a fair-wage café).  
     - *Cases*: Counter-service tip jar (if harm-based).  

  10. **Prudential Conformity**  
      - *Obligation*: Purely self-interested (avoid social/financial backlash).  
      - *Awkward commitment*: No moral duty; conformity is cowardice.  
      - *Cases*: Escalator standing (to avoid glares).  

  11. **Non-Conventional Expressivism**  
      - *Obligation*: Binding to avoid expressing vice, even without convention.  
      - *Awkward commitment*: Wrong to wear shoes indoors anywhere (even if no local norm).  
      - *Cases*: Japanese house visitor (if expressive, not conventional).  

  12. **Etiquette Isn’t Morality**  
      - *Obligation*: None; purely discretionary etiquette.  
      - *Awkward commitment*: May cause harm dismissed as "not my problem."  
      - *Cases*: All cases (if no grounds found).  

  ---

  ### **Key Distinctions & Unexplored Combinations**  
  - **Distinguished**: Universal vs. participant obligations (Leaf 1/2/3/4), expressivism vs. harm (Leaf 2/6/9/11), stakes sensitivity (Leaf 7).  
  - **Unexplored Combinations**:  
    - *Prudential + Lewis convention*: Not included; most theorists collapse this into non-moral (Leaf 1/10 cover prudential).  
    - *Expressivism + non-harm free-riding*: Logically odd (free-riding is structural, expressivism is symbolic), so omitted.  
  - **Particularism**: Leaf 7 (Contextual Particularism) handles case-dependence but notes it sacrifices predictability.  
  - **Awkward Commitments**: Highlight tensions in each position (e.g., Leaf 1 allows tourists to harm; Leaf 7 is arbitrary).  

  ### **Case Assignments**  
  - **US diner tourist**: Leaf 1 (if non-participant) or Leaf 2 (universal harm).  
  - **Counter-service tip jar**: Leaf 4 (universal free-rider) or Leaf 9 (non-conventional harm).  
  - **Japanese house visitor**: Leaf 5 (participation obligation) or Leaf 11 (non-conventional expressivism).  
  - **Escalator standing**: Leaf 7 (stakes-dependent) or Leaf 10 (prudential).  
  - **Jaywalking at 3am**: Leaf 6 (expressivism) or Leaf 7 (low stakes → OK).  
  - **Holding a place in line**: Leaf 3 (free-rider if repeat participant) or Leaf 7 (stakes-dependent).  

  This tree isolates why people agree on verdicts but clash on grounds (e.g., two 20% tippers: Leaf 2 sees harm, Leaf 5 sees participation, Leaf 4 sees free-riding). No reading lists—just plug in cases and follow the branches.
