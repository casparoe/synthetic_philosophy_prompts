prompt: |-
  Act as a philosopher of law who's spent way too long thinking about blame, standing, and hypocrisy. Think carefully, and maybe start by brainstorming the candidate views on the menu before you commit to one.

  There's an asymmetry in criminal law that's been bugging me. In the same courtroom, the defendent's own record is fair game — the prosecution can haul up his past convictions to show he isn't credible when he testifies. But the state's own record is basically irrelevant: it doesn't matter, legally, whether the state, the judge, or the prosecutor has itself done horrible things; none of that is ever treated as a reason the state lacks standing to punish him. Same system, opposite treatment of "your own record." So what theory of standing to blame does the practice of criminal punishment presuppose? Does it assume standing has nothing to do with the blamer's moral record at all, or can you save it some other way — say, the state blames in a purely institutional capacity that's insulated from its own sins? Reconstruct the implicit theory, sort out which rival accounts of standing it actually rules out vs. merely sits comortably with (the moral-record/hypocrisy view, the relationship view, whatever else you'd put on the list), and tell me where the practice is just underdetermined, so that several theories would license the same legal practice. Don't just recite the usual positions — I want the reconstruction. Then, last thing: if we took the "clean hands" idea seriously and applied it to the state, what concretely would have to change in how criminal justice actually works?
reasoning: |-
  Okay, the user wants me to act as a philosopher of law specializing in blame, standing, and hypocrisy. They're pointing out an asymmetry in criminal law: a defendant's past convictions can be used against them to challenge their credibility, but the state's own record of misconduct isn't considered relevant to its standing to prosecute. The user wants me to reconstruct the implicit theory behind this practice, compare it with rival theories, and explore what would change if we applied "clean hands" doctrine to the state.

  Hmm, this is a deep philosophical question about legal systems and moral standing. The user seems well-versed in legal philosophy - they're using terms like "standing to blame" correctly and they're clearly thought about this asymmetry before. They're not just looking for textbook answers but want original reconstruction of the implicit theory.

  Let me unpack this asymmetry first. In courtrooms, Rule 609 of evidence rules allows impeachment by prior convictions for defendants who testify. Yet state misconduct - prosecutorial misconduct, judicial bias, systemic injustices - rarely if ever voids the state's authority to prosecute. Even when uncovered, remedies are case-specific (dismissal with prejudice, retrial) rather than questioning standing itself. This is fascinating because it suggests the legal system operates on completely different principles for individual versus institutional moral records.

  I need to reconstruct the implicit theory here. It seems criminal law presupposes a "Sovereign Mask" theory with several components: institutional standing rather than personal standing, separation of institutional authority from moral character, and the "purity filter" where only defendant's record matters for credibility. This view prioritizes systemic functionality over moral coherence.

  Now for rival theories of standing to blame: the Moral Record View (hypocrisy undermines standing), Relationship View (standing depends on relational context), and Social Function View (standing based on useful blame-expression). The Sovereign Mask theory rules out the Moral Record View for institutions while being compatible with the Relationship View (if we see the state-citizen relationship as hierarchical) and aligned with the Social Function View.

  Where does this leave us? The practice is underdetermined in several areas. The Sovereign Mask theory isn't the only possible fit - alternative theories could produce similar outcomes through different reasoning. And there are tension points like pardons (state forgives its own violations) and selective enforcement that reveal cracks in the mask.

  If we took "clean hands" seriously, we'd need radical changes: institutional recusal mechanisms, standing defenses based on state misconduct, systemic credibility assessments, and expanded remedies. This would transform criminal justice into something almost unrecognizable - more like a moral dialogue than a machine.

  The user's question reveals a deeper discomfort about whether legal systems can claim moral authority while being morally compromised themselves. They're likely wrestling with the justification of state punishment in imperfect systems. My response should honor both the philosophical depth and practical implications they're probing.
answer: |-
  ## Reconstructing the Implicit Theory of Standing in Criminal Law: The Sovereign Mask

  The asymmetry you identify is profound and exposes a core, often unarticulated, presupposition of criminal law: **the Sovereign Mask theory of standing.** This theory rests on several interconnected pillars:

  1.  **Radical Separation of Institutional Role and Personal/Historical Morality:** The state acts *qua* state, not as a collection of fallible individuals or a historically contingent institution. Its authority to blame and punish derives solely from its *current, formal, institutional role* as the legitimate sovereign power maintaining order and vindicating societal norms. Its past sins are irrelevant to this *institutional capacity*.
  2.  **The Primacy of Functional Legitimacy:** Standing is grounded not in the state's *moral character* but in its *functional necessity and legal authorization*. Society requires an entity to define crimes, adjudicate guilt, and impose sanctions. As the designated entity fulfilling this function according to established legal procedures, it possesses standing by definition. Its historical failures pertain to *how* it performs this function (potentially leading to remedies in specific cases), not *whether* it *can* perform it.
  3.  **The Defendant as *Persona Non Grata*:** The defendant stands before the court *as an individual moral agent*. Their past acts are deemed relevant to their *current character* (credibility) and potentially their *propensity* (in some evidentiary contexts, though restricted). Their record reflects on *them* as the subject of the blame.
  4.  **Systemic Purity Filter:** The rules of evidence regarding the defendant's past (like FRE 609) operate within a system designed to assess *their* guilt and credibility *in this specific instance*. The state's record is filtered out *before* this assessment even begins, because the state's standing is a pre-condition of the trial, not an element within it. The court *presumes* the state's standing based on its institutional role.
  5.  **The Fiction of Collective Amnesia/Reinvention:** The state, in its prosecutorial role, is treated as perpetually "new." Each prosecution is an act of the sovereign *now*, untethered from the sovereign's past transgressions. Historical injustices are compartmentalized as aberrations addressed (ideally) through other mechanisms (civil suits, commissions, policy reforms), not as a challenge to the core standing to punish *now*.

  **Rival Theories and How the Sovereign Mask Rules Them Out or Accommodates Them:**

  *   **Moral Record/Hypocrisy View (Tu quoque):** This view holds that one lacks standing to blame if one is guilty of similar or worse wrongdoing ("clean hands doctrine" applied broadly).
      *   **Ruled Out:** The Sovereign Mask explicitly rejects this for the state. The prosecutor's personal sins, the police department's history of brutality, the state's legacy of discriminatory laws – none of these delegitimize the *institution's* standing to prosecute *this defendant* for *this crime*. The state's "hands" are institutionally clean by virtue of its role.
  *   **Relationship View:** Standing depends on the nature of the relationship between blamer and blamed (e.g., only victims have standing, or only those in a relevant community of accountability).
      *   **Partially Accommodated, Mostly Ruled Out:** The Sovereign Mask co-opts a specific *institutionalized* relationship: the state *as sovereign* has a relationship of authority *over* the citizen. This relationship grants standing *regardless* of the moral quality of that relationship historically. It rules out views requiring a *morally pure* relationship or a *victim-specific* relationship (the state prosecutes as representative of society, not necessarily as the direct victim).
  *   **Social Function/Expressive View:** Standing exists if blaming serves a valuable social function (e.g., norm reinforcement, moral education).
      *   **Accommodated (and Leveraged):** This is a powerful *justification* used *within* the Sovereign Mask framework. The state's standing *is* justified by its function (deterrence, retribution, rehabilitation, norm expression). However, the Sovereign Mask goes further by *presupposing* the state's unique position to perform this function, insulating it from challenges based on its *past failures* to perform it well or justly. Function justifies the standing inherent in the role.
  *   **Pure Authority View:** Standing belongs solely to those vested with formal authority by a recognized system.
      *   **Accommodated and Core:** This is the bedrock of the Sovereign Mask. Legal positivism heavily leans here. Standing *is* the authority granted by the legal system itself.

  **Where Practice is Underdetermined:**

  1.  **The *Source* of Institutional Legitimacy:** The Sovereign Mask *assumes* legitimacy but doesn't specify its source. Is it purely procedural (following the rules)? Democratic mandate? Natural law grounding? Different meta-ethical theories (Positivism, Natural Law, Dworkinian integrity) could all endorse the Sovereign Mask's *operational* asymmetry while disagreeing fiercely on *why* the state has this insulated standing.
  2.  **The Limits of Institutional Sins:** The practice doesn't clearly define *what* kind of state sin, if sufficiently pervasive or directly relevant, *might* theoretically pierce the mask. Extreme examples (a state built on genocide prosecuting dissenters; a prosecutor convicted of the same crime) are legally untested regarding *standing*, though remedies might exist. The Sovereign Mask practice assumes the mask holds; it doesn't explicitly define its breaking point.
  3.  **The Individual Blamer Analogy:** While the asymmetry is stark, the *rationale* for using a defendant's record (credibility/propensity) isn't directly analogous to the rationale for ignoring the state's record (institutional role). The practice assumes these are categorically different types of "records" assessed for categorically different purposes within the system.

  **Applying "Clean Hands" to the State: Concrete Changes**

  Taking the Moral Record/Hypocrisy view seriously would revolutionize criminal justice:

  1.  **Institutional Recusal/Disqualification:** Courts could lack jurisdiction or prosecutors could be barred from bringing charges if:
      *   The specific law being enforced has a proven history of discriminatory application *against the defendant's group*.
      *   The prosecuting office/police department involved has a documented pattern of misconduct (e.g., systemic racism, fabrication of evidence) relevant to the case type or defendant's group.
      *   The state/judge/prosecutor has directly perpetrated similar offenses against the defendant or their community without adequate restitution.
  2.  **Standing as an Affirmative Defense:** Defendants could raise "Unclean Hands of the State" as a defense, requiring the state to prove its "clean hands" regarding the specific charge, the defendant's class, or the actors involved. Failure could lead to dismissal *with prejudice*, not just suppression of evidence or retrial.
  3.  **Systemic Credibility Assessments:** Just as a defendant's prior convictions can impeach their testimony, evidence of state misconduct (e.g., police perjury in other cases, prosecutorial suppression of exculpatory evidence patterns, unjust laws recently repealed) could become admissible to impeach the *state's* credibility – its motives, the integrity of its evidence, and the legitimacy of its accusation *in this case*.
  4.  **Remedies Focused on Restorative Justice:** Instead of solely punishing the individual, findings of state "unclean hands" could trigger mandatory reparations to affected communities, structural reforms overseen by independent bodies, or diversion of resources from punishment to addressing root causes of crime linked to state failure.
  5.  **Radical Decentralization/Alternative Accountability:** Recognition that the state *lacks* standing in certain contexts could empower community courts, restorative justice panels, or victim-centered processes for specific offenses, particularly where state violence or neglect is a direct factor.
  6.  **Judicial Scrutiny of Laws' Origins:** Laws born out of manifest injustice (e.g., historical drug laws targeting minorities) could be presumptively unenforceable due to the state's unclean hands in their creation, regardless of current text.

  **Conclusion:**

  The asymmetry in criminal law reveals the **Sovereign Mask**: a deep-seated commitment to the state's *institutional standing* as distinct from, and insulated from, its *moral record*. This presupposition rules out strong versions of the Moral Record/Hypocrisy view for the state while comfortably accommodating Authority and Social Function views. Adopting a "clean hands" doctrine would shatter this mask, transforming criminal justice from a system focused solely on individual culpability to one constantly auditing its own moral legitimacy in each prosecution. It would shift the focus from the defendant's past to the state's, demanding accountability not just *within* the system, but *for* the system itself. The practical changes would be revolutionary, moving towards a system where the state's right to punish is contingent on its own adherence to justice.
