  I'll start with Question 1 about commensurability, splitting into three branches: incomparable values, comparable but problematic measurement, and inherently comparable. This covers incommensurabilists and measurement skeptics early, as the user noted they might be hard to separate. 

  For the comparable branch, Question 2 distinguishes between symmetric trade-offs (leading to Benthamism) and asymmetric ones. Asymmetry then splits into exchange rates (finite negative weighting) vs thresholds (lexical views). 

  The threshold branch needs to handle floor/ceiling parameters. Question 4 asks whether both exist, allowing for floor-only ("Trampoline NU") and ceiling-only ("Torture Blockade") views. If both exist, Question 5 checks if they're linked (fixed gap leading to "Fixed Gap NU") or independent ("Lexical Threshold NU"). 

  The user wanted flexibility in thresholds, so Question 6 addresses whether the ceiling shifts with available pleasure ("Context-Sensitive Lexical NU"). For units, Question 3 appears after asymmetry to capture intrapersonal vs interpersonal distinctions ("Intrapersonal Asymmetry"). 

  I'll add satiation under symmetric comparability via Question 2c, and vagueness under the measurement-skeptic branch. Empty branches like "Only floor? → No" are marked as incoherent since floors without ceilings imply uncompensatable pains that somehow become compensatable at higher intensities. 

  Names are coined for accessibility: "Torture Blockade" for ceiling-only, "Trampoline NU" for floor-only. Each leaf specifies an awkward commitment, e.g., Benthamism justifying torture for candy. The tree stays within depth limits (max Q6) and has 12 leaves, hitting all requested views. 

  Phrasing questions plainly: "Can mild pains be fully compensated by pleasure?" instead of jargon. This should work for non-philosophers. I'll include a note about messy branches (measurement vs incommensurability) as requested.
answer: |-
  Here’s a one-page decision tree for your pub debate. Answer the questions sequentially to find your position, along with its key trade-off.  

  ---

  ### **Question 1: Can pain and pleasure *in principle* be weighed against each other?**  
  - **No (they’re fundamentally incomparable)** → **Radical Incommensurabilist**  
    *Awkward commitment: Must deny that choosing a dentist (short pain, long relief) makes rational sense.*  
  - **Yes, but practical limits make comparisons fuzzy/arbitrary** → **Measurement Skeptic**  
    *Awkward commitment: Admits pain/pleasure *could* trade off, but all real-world choices are guesses.*  
  - **Yes, they share a common "currency"** → **Go to Question 2**  

  *(Note: Radical Incommensurabilist and Measurement Skeptic are similar in practice but differ philosophically.)*  

  ### **Question 2: Is avoiding pain always more urgent than gaining pleasure?**  
  - **No, symmetric trade-offs** → **Benthamite Commensuralist**  
    *Awkward commitment: A mountain of trivial pleasures *could* justify extreme torture.*  
  - **Yes, pain has priority** → **Go to Question 3**  

  ### **Question 3: How does pain’s priority work?**  
  - **Pain is k× worse than equal pleasure (finite k)** → **Finite Negative Weighting**  
    *Awkward commitment: Enough ice cream cones *could* compensate for losing a finger (if k is fixed).*  
  - **Some pains *cannot* be compensated by any pleasure** → **Go to Question 4**  

  ### **Question 4: Is there a threshold where pain becomes uncompensatable?**  
  - **No, but some pleasures max out (satiate)** → **Satiable Pleasure, Insatiable Pain**  
    *Awkward commitment: A life of mild contentment + brief agony can be worse than pure misery, but never better.*  
  - **Yes** → **Go to Question 5**  

  ### **Question 5: Is there *also* a floor below which pain doesn’t count?**  
  - **No, all pain counts (even stubbed toes), but severe pain can’t be offset** → **Torture Blockade**  
    *Awkward commitment: A lifetime of joy is ruined by one horrific minute.*  
  - **Yes, trivial pains are "noise"** → **Lexical Threshold NU**  
    *Awkward commitment: A bad hangover might not "count" ethically, but moderate pain does.*  
  - **Only a floor (all severe pain is compensatable)** → **Trampoline NU**  
    *Awkward commitment: Enough orgasms *could* make Auschwitz "worth it".*  

  ### **Question 6 (for Lexical Threshold NU only): Does the pain ceiling depend on context?**  
  - **No, threshold is fixed** → **Fixed Lexical Threshold NU**  
    *Awkward commitment: A fixed pain intensity (e.g., broken bone) is never compensatable, regardless of stakes.*  
  - **Yes, more at stake → higher pain ceiling** → **Context-Sensitive Lexical NU**  
    *Awkward commitment: Saving a civilization might justify torture that a vacation couldn’t.*  

  ---

  ### **Other Leaves from Earlier Branches:**  
  - **From Q1 → "Yes" + Q2 → "No" + Q3 → [N/A]**: Already covered (Benthamite).  
  - **From Q1 → "Yes" + Q2 → "Yes" + Q3 → "k× worse"**: Finite Negative Weighting.  
  - **From Q4 → "No"**: Satiable Pleasure view.  
  - **Missing View?** Add after Q2:  
    - **Q2a (after Q2 → "Yes"): Does asymmetry apply between lives?**  
      - **No, only within one life** → **Intrapersonal Asymmetry**  
        *Awkward commitment: Your suffering can’t be offset by your joy, but *my* joy can offset *your* pain.*  

  ---

  ### **Empty Branches Explained:**  
  - **"Only floor (no ceiling)"**: *Incoherent* (if pains below floor don’t count, severe pains must be uncompensatable or the floor is meaningless).  
  - **"No threshold + no satiation + pain priority"**: *Implausible* (collapses into Finite Negative Weighting or Torture Blockade).  

  ---

  ### **Quick Reference: Your Leaf Positions**  
  1. **Benthamite Commensuralist**  
  2. **Finite Negative Weighting**  
  3. **Satiable Pleasure, Insatiable Pain**  
  4. **Torture Blockade** (ceiling only)  
  5. **Trampoline NU** (floor only)  
  6. **Fixed Lexical Threshold NU**  
  7. **Context-Sensitive Lexical NU**  
  8. **Intrapersonal Asymmetry**  
  9. **Radical Incommensurabilist**  
  10. **Measurement Skeptic**  
  *(+ Pure Negative Utilitarianism → **Torture Blockade** with floor at zero)*  

  **Tree Depth**: 3–5 questions. **Leaves**: 10 core positions.  
  **Instructions**: Start at Question 1, follow answers to your leaf. Compare results!
