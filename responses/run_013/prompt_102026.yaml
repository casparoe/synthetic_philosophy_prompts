prompt: |-
  I teach a second-year undergraduate course in the theory of computation, and next week I have a session on the Church–Turing thesis for students who have just seen the halting-problem proof and have come away believing that the thesis is a theorem — that Turing proved what can and cannot be computed. I do not want the explanation itself; I want a plan for how to give it. Set out the order in which the components must be introduced, and make the dependency structure explicit: what has to be in place before the thesis can even be stated as a substantive claim rather than a disguised definition; why the informal notion of an effective procedure has to be made to feel genuinely unsettled before any formal model is offered; and where the distinction between the claim that our pre-theoretic notion of computability coincides with Turing-machine computability and the separate claim that all reasonable formal models of computation agree with one another — the so-called invariance thesis — must fall in the sequence. Nominate the single carrying example for the whole session and say what it must have and lack. I am inclined to build it on the pre-1936 image of a human calculator, a person with pencil and paper following a fixed set of rules, and I want you to say whether that carries the weight or whether something else should, and why a laptop or a named programming language would be the wrong carrier. Then give me the misconceptions these students will arrive with or form, and the exact point in the sequence at which each should be headed off: that the thesis has been proved; that it is an empirical hypothesis about the limits of physical machines, so that a quantum or hypercomputing device would refute it; that a Turing machine is just another name for a computer; that the thesis is a claim about speed or memory; and that it licenses conclusions about what human minds can do. Finally, give me one question to ask at the end that would reveal whether they have understood the thesis's epistemic status rather than merely memorised its statement, and tell me what I should openly refuse to settle at this level — I am thinking in particular of whether the thesis is best read as a definition, a stipulation, or an empirical conjecture, and of how physical versions of the thesis relate to the mathematical one.
reasoning: |-
  We are building a lesson plan for a session on the Church-Turing thesis (CTT) for undergraduate students who have just seen the halting problem proof and may mistakenly believe CTT is a theorem. The goal is to clarify the status of CTT and address common misconceptions.

  The plan must:
  1. Introduce components in a specific order with explicit dependencies.
  2. Make the informal notion of an "effective procedure" feel unsettled before formal models are offered.
  3. Distinguish between the claim that pre-theoretic computability coincides with Turing-machine computability and the invariance thesis (that all reasonable models agree).
  4. Choose a single carrying example and justify it (we are inclined to use the human calculator with pencil and paper).
  5. Identify and address misconceptions at specific points.
  6. Include a revealing question at the end about the epistemic status of CTT.
  7. State what to openly refuse to settle (e.g., whether CTT is a definition, stipulation, or empirical conjecture, and the physical versions).

  Plan Outline:

  I. Introduction: Setting the Stage (5 minutes)
     - Remind students of the halting problem: we have proved that the halting problem is undecidable by a Turing machine (TM). But what does that say about what can be computed in general?
     - Point out that the proof is about TMs. But why should that capture the notion of computation in general?
     - Introduce the Church-Turing thesis as a bridge between the formal (TMs) and the informal (what we think of as computable).

  II. Making the Informal Notion of Computation Feel Unsettled (10 minutes)
     - Before CTT can be stated, we must clarify the pre-theoretic notion: an "effective procedure" (or algorithm).
     - Ask students: What is an algorithm? What are its properties? (They may say: step-by-step, unambiguous, finite description, deterministic, etc.)
     - Challenge: Are these properties sufficient? What about non-determinism? What about procedures that use randomness? What about procedures that might use an oracle? (We are not defining yet, just unsettling.)
     - Historical context: Before 1936, there was no formal definition of computation. Mathematicians (like Hilbert) were looking for a formal notion to capture the idea of mechanical calculation.

  III. Introducing Formal Models (10 minutes)
     - Now that the informal notion is unsettled, we introduce formal models as attempts to capture it.
     - Mention several models: Turing machines (Turing), lambda calculus (Church), recursive functions (Gödel, Kleene), and even modern programming languages (but note we are abstracting away from physical limitations).
     - Show that these models are equivalent: they all compute the same set of functions (the computable functions). This is the invariance thesis (a theorem, because we can prove equivalences between these formal systems).
     - Note: This equivalence is surprising and non-trivial. It suggests that there is a robust notion of computability.

  IV. Stating the Church-Turing Thesis (5 minutes)
     - Now we can state CTT: Every function that is effectively computable (by an algorithm in the informal sense) is computable by a Turing machine (or equivalently, by any of these formal models).
     - This is a substantive claim: it bridges the informal and the formal. It is not a theorem because the informal notion is not mathematically defined.

  V. The Carrying Example: The Human Calculator (5 minutes)
     - We use the image of a human with pencil and paper following fixed rules (a "human computer" as in Turing's original paper).
     - Why this example?
          - It is pre-1936 and matches the historical context.
          - It emphasizes the mechanical, step-by-step, rule-based nature of computation without being tied to a specific technology.
          - It avoids the anachronism of a laptop or programming language (which might lead to confusion with physical limitations or specific features of a language).
          - What it lacks: It does not involve randomness, interaction, or real-time inputs. But that is okay because we are focusing on the abstract procedure.
     - Why not a laptop or programming language?
          - A laptop is a physical device and might lead to confusion with physical constraints (speed, memory, energy) and non-determinism (if we consider quantum effects, etc.). Also, a laptop is too complex and might suggest that the formal model includes these real-world details.
          - A named programming language (like Python) is tied to a specific syntax and set of operations, and it might have features that are not in the basic model (like unbounded recursion? but actually, we abstract away memory limits). However, the main issue is that it is a specific formal system that has been designed to be equivalent to a TM. Using it might obscure the pre-formal notion we are trying to capture.

  VI. Addressing Misconceptions (throughout, but planned at specific points)
     We list the misconceptions and when to address them:

     1. "The thesis has been proved."
          - When: After stating the CTT (step IV) and before discussing evidence.
          - How: Emphasize that the CTT is not a theorem because the informal notion is not formally defined. We have evidence (equivalence of formal models, no counterexamples) but no proof.

     2. "It is an empirical hypothesis about the limits of physical machines, so that a quantum or hypercomputing device would refute it."
          - When: When discussing the carrying example (step V) and also when discussing the distinction between mathematical and physical computation (at the end).
          - How: Clarify that CTT is about mathematical computability, not physical realizability. A quantum computer (in the standard model) does not compute beyond the TM (it can compute the same functions, possibly faster). Hypercomputation (e.g., using analog systems with infinite precision) is not considered an effective procedure because it requires unrealistic resources (infinite precision, infinite energy). Also, CTT does not claim that physical machines are limited by TMs; it claims that the mathematical notion of an algorithm is captured by TMs.

     3. "A Turing machine is just another name for a computer."
          - When: When introducing formal models (step III) and again when discussing the carrying example.
          - How: Explicitly state that a TM is an abstract mathematical model, not a physical computer. A physical computer has finite memory and is subject to errors, while a TM has unbounded memory (an infinite tape) and is error-free. Also, a TM is a very simple model (with a finite state machine and a tape) compared to modern computers.

     4. "The thesis is a claim about speed or memory."
          - When: When discussing the carrying example and when stating CTT (step IV).
          - How: Emphasize that CTT is about what functions are computable, not about how fast or with how much memory. Complexity theory (which they will see later) deals with resources. CTT is about computability in principle, ignoring time and space.

     5. "It licenses conclusions about what human minds can do."
          - When: When stating CTT and during the discussion on the carrying example.
          - How: Point out that CTT is about mechanical procedures (algorithms) that a human can follow step by step without requiring insight. It does not address what the human mind can do in general (which might involve non-algorithmic processes). Also, note that CTT does not say that the human mind is equivalent to a TM (that would be a philosophical claim, not part of CTT).

  VII. Evidence for the Thesis (5 minutes)
     - Why do we accept CTT?
          - The equivalence of multiple formal models (invariance thesis) provides strong evidence.
          - No counterexample: no one has found an effective procedure that we all agree is an algorithm but that cannot be computed by a TM.
          - The thesis has stood the test of time: it has been used as the foundation of computer science and has not led to contradictions.

  VIII. Wrap-up: The Epistemic Status (5 minutes)
     - Ask the revealing question: "If someone were to discover a new model of computation that is not equivalent to a Turing machine, but that they claim captures the intuitive notion of an algorithm, how would we decide whether to accept it as a refutation of the Church-Turing thesis or as an example of an unreasonable model?"
          - This question forces students to think about the informal notion and the role of evidence (agreement among experts, absence of counterexamples) and the invariance thesis (if the new model is equivalent to TM, then it doesn't refute; if not, we must decide if it is "reasonable"). It also highlights that CTT is not a theorem.

  IX. Openly Refuse to Settle (2 minutes)
     - State that at this level, we will not settle:
          - Whether CTT is best read as a definition (stipulating that "computable" means TM-computable), a stipulation, or an empirical conjecture. (It has elements of both: it started as a conjecture and has become a definition in the field, but it is also supported by evidence.)
          - How physical versions of the thesis (e.g., the Physical Church-Turing thesis, which claims that any physical computing device can be simulated by a TM) relate to the mathematical CTT. The physical version is a different claim and is more controversial because it depends on the laws of physics.

  Total time: approximately 47 minutes (adjust as needed).

  Summary of the Dependency Structure:
  1. Start with halting problem (known) to motivate why we care about the scope of computation.
  2. Unsettle the informal notion (needed to appreciate why CTT is not just a definition).
  3. Introduce formal models and their equivalence (to show that we have a robust formal notion).
  4. State CTT (only now can it be stated as a substantive claim because we have both the informal and formal).
  5. Use the human calculator example to ground the informal notion without physical distractions.
  6. Throughout, address misconceptions as they naturally arise in the discussion.

  This plan should help students see CTT as a foundational thesis that is not proven but is well-supported, and it should clarify the boundaries of what it claims.
answer: |-
  Below is a structured lesson plan for your session on the Church–Turing thesis (CTT), designed to address misconceptions and build conceptual clarity. The plan follows a strict dependency order, emphasizes the unsettled nature of "effective procedure" before formalization, uses a targeted carrying example, and explicitly counters misconceptions at strategic points. Total session time: 50 minutes.

  ---

  ### **Lesson Plan: Demystifying the Church–Turing Thesis**

  #### **1. Introduction: Misconception as Hook (5 mins)**  
  - **Goal:** Surface the "CTT is a theorem" misconception.  
  - **Activity:**  
    - Ask: "After the halting problem proof, what does it tell us about computation in general?"  
    - *Expected student answers:* "Turing proved what computers can't do," "Some problems are uncomputable."  
    - **Clarify:** Halting problem shows TM-specific undecidability. But does this extend to *all* computation?  
  - **Dependency:** Must reference the halting proof (students’ prior knowledge).  

  #### **2. Unsettling "Effective Procedure" (10 mins)**  
  - **Goal:** Make the informal notion feel ambiguous and pre-theoretic.  
  - **Activity:**  
    - Define an "effective procedure" (EP) as: *a finite, unambiguous, human-executable sequence of steps to solve a problem, requiring no insight.*  
    - **Brainstorm examples:**  
      - Long division (follows rules, no creativity).  
      - Baking a recipe (if steps are exact).  
    - **Challenge:** What about:  
      - A procedure using a coin flip? (Is randomness allowed?)  
      - A procedure requiring infinite paper? (Is "unbounded" part of EP?)  
      - Gödel’s incompleteness proof (human insight vs. mechanical steps)?  
    - **Emphasize:** Pre-1936, no consensus on what "mechanical" meant. Mathematicians debated EPs (e.g., Hilbert’s program).  
  - **Why now?** Must come *before* formal models to avoid conflating EP with formalisms.  

  #### **3. Introduce Formal Models & Invariance Thesis (10 mins)**  
  - **Goal:** Show formal models are *attempts* to define EP; separate invariance from CTT.  
  - **Activity:**  
    - List models: Turing machines (TMs), lambda calculus, recursive functions.  
    - **State invariance thesis (theorem):** All "reasonable" formal models compute the *same class* of functions (e.g., TMs = lambda calculus).  
    - **Prove equivalence:** Briefly show TM → lambda calculus encoding (sketch only).  
    - **Key distinction:**  
      - Invariance is a *provable fact* about formal systems.  
      - CTT is a claim about EP ↔ formal systems.  
  - **Dependency:** Requires students to grasp formal models (covered in prior lectures).  

  #### **4. State CTT as Substantive Claim (5 mins)**  
  - **Goal:** Position CTT as a claim, not a definition.  
  - **Activity:**  
    - **CTT statement:** "Every effectively calculable function (EP) is computable by a TM."  
    - **Stress:**  
      - This is *not* a definition (EP was intuitive pre-1936).  
      - It’s a hypothesis linking informal intuition (EP) to a formal model (TM).  
  - **Dependency:** Requires steps 2–3 (unsettled EP + formal models).  

  ---

  ### **Carrying Example: Human Calculator**  
  - **Why this example?**  
    - **Fits historically:** Mirrors Turing’s original motivation ("human with pencil and paper").  
    - **Lacks modern baggage:** Avoids conflating EP with physical limits (e.g., laptop memory) or programming language quirks (e.g., Python recursion limits).  
    - **Has the essentials:** Finite rules, discrete steps, unbounded workspace (paper), no insight.  
  - **Why not a laptop/programming language?**  
    - Laptops imply physical constraints (speed, energy), muddying "computability in principle."  
    - Programming languages (e.g., Java) are *already* formal systems; using them would circularly presuppose CTT.  

  ---

  ### **Misconceptions: When and How to Address Them**  
  Address each *proactively* at the points below:  

  | **Misconception** | **When to Address** | **Counter-Strategy** |  
  |-------------------|---------------------|----------------------|  
  | **"CTT is proved (like halting)."** | After stating CTT (Step 4). | Contrast: Halting is a TM theorem; CTT links informal EP to TM. Show no "proof" exists—only evidence (e.g., invariance). |  
  | **"CTT is about physical machines (quantum/hypercomputing refutes it)."** | During "unsettling EP" (Step 2). | Clarify: CTT concerns *mathematical* computability, not physics. A "hypercomputer" isn’t an EP—it violates finiteness/unambiguity (e.g., requires infinite precision). |  
  | **"TM = computer."** | Introducing formal models (Step 3). | Differentiate: TMs are abstract (infinite tape, no time limits); physical computers approximate TMs but have constraints. |  
  | **"CTT is about speed/memory."** | Carrying example discussion. | Emphasize: CTT asks *"can it be computed?"* not *"how fast/with how much memory?"* (Complexity theory handles resources). |  
  | **"CTT limits human minds."** | Brainstorming EP (Step 2). | State explicitly: CTT applies only to mechanical procedures (EPs), not creative thought. Humans may solve non-algorithmic problems (e.g., consciousness). |  

  ---

  ### **Revealing Question for Epistemic Status**  
  - **Question (at end):** *"If we discovered aliens who compute functions beyond TMs using a method we all agree is an ‘effective procedure,’ would this refute CTT? Why or why not?"*  
  - **Why it works:**  
    - Tests understanding of CTT as a claim about EP (not aliens or physics).  
    - Correct answer: "Yes—CTT would be falsified because EP is pre-theoretically defined."  
    - If students say "No, TMs define computability," they mistake CTT for a definition.  

  ---

  ### **Openly Refuse to Settle**  
  - **What to withhold:**  
    - **Is CTT a definition, stipulation, or empirical conjecture?** Say: *"Philosophy debates this! Some view it as defining ‘computability’ (stipulative), others as an empirical claim about human practice. For this course, treat it as a well-supported hypothesis."*  
    - **Physical CTT:** *"We’re discussing *mathematical* computability. Whether physics allows ‘hypercomputation’ (e.g., via black holes) is separate and unresolved—it doesn’t affect CTT’s core claim."*  

  ---

  ### **Timeline & Flow**  
  1. Hook (5 mins) → 2. Unsettling EP (10 mins) → 3. Formal models + invariance (10 mins) → 4. CTT statement (5 mins) → Carrying example weaved throughout → Misconceptions addressed contextually → Revealing question + wrap-up (5 mins).  

  This sequence ensures students:  
  - Confront the ambiguity of EP *before* seeing formal models.  
  - Distinguish invariance (theorem) from CTT (thesis).  
  - See CTT as a substantive claim grounded in historical context (human calculator).  
  - Exit knowing CTT is not a theorem, not about physics, and not a mind-body thesis.
