  Okay so everyone in climate ethics keeps leaning on the debt/borrowing analogy: we're "borrowing the planet from our children," running up a bill they'll have to pay, and the social discount rate is basically the interest rate on that loan. The thing is I keep seeing it dragged out to justify both aggressive mitigation and aggressive discounting, which can't both be right. Can you actually audit it? Lay out what maps onto what -- creditor, debtor, principal, interest, default, repayment -- then tell me where the mapping breaks (I suspect future people cant really be creditors at all if they can't consent or refuse, and there's no currency they can be repaid in), which of those breaks actually matter for how the analogy gets used in arguments, and whether the conclusions people draw from it survive once the disanalogies are on the table. If there's a better analogy for the intergenerational case, tell me what it is. American English please.
