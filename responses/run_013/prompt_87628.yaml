prompt: |-
  I am a novelist — three books, the most recent a quiet one set in a mill town — and for two years I have sat on the board of a small independent press that publishes translations and a literary quarterly. There are six of us: a poet, a retired accountant, two academics, the publisher, and me. We meet by video on Thursday evenings for ninety minutes and vote at the end. This year most of our agenda has been automation proposals, and we have been handling them the way I imagine most small boards do — by instinct, by whoever speaks last, and by a private sense that some of these things feel like a betrayal and others feel like arithmetic. I have been rereading Marx's long chapter on machinery to see whether it gives us anything better than instinct, and I think it does, but I cannot get it into a form the accountant could run in ten minutes, which is the actual difficulty. What I want from you is a decision procedure my board could actually use on a proposal.

  What I take the argument to be, in my own words — and I would rather the procedure follow from whatever of this survives your scrutiny than from the loose version in my head: machinery is never introduced merely to save labour; under capitalist relations it is introduced to extract more surplus from the same hours, so the first question about any machine is not whether it saves labour but who gets the time it saves. It tends to take the skill that lived in the worker and put it into the employer's equipment, so that a person meets his own competence as someone else's property. It lowers the skill threshold, which makes the remaining labour cheaper and easier to replace. It can intensify the working day rather than shorten it. And the people it displaces do not vanish; they become the pool that keeps the rest grateful. The strand I find most interesting and least usable in a board meeting is the one about time: capital drives the labour time needed to make things toward zero while still measuring wealth by labour time, so it works against its own foundation and cannot really want full automation — which seems to mean that the interesting question about any given machine is not whether it replaces workers but what it does to the hours, the skills, and the bargaining position of those who remain, and that the answer depends on the relations of production rather than on the machinery. Please write the procedure: the questions to ask in order, what counts as a sufficient answer to each, where it stops with a no, and where it has to hand the decision to a vote because the remaining question is about who should bear a loss rather than about what the machinery does. It has to be usable by five people who have not read Marx and will not read him, it has to fit into a ninety-minute meeting, and it must not collapse into the generic ethics-of-AI checklist our publisher keeps circulating. One of us will say this is politics dressed up as procedure; I would like the procedure to contain its own answer to that objection. I would also like it to say what difference it makes if the press were a worker cooperative rather than a private company, since the whole analysis seems to turn on that and I do not know whether the procedure itself should change or only its verdicts. Do not give me a reading list; I will find the references myself.

  Then run it on three proposals we are actually facing. First, replacing the human narrators of our backlist audiobooks with synthetic narration at roughly a tenth of the cost, with a one-time payment to each narrator and no continuing royalty. Second, machine-translating four backlist novels into Spanish and Portuguese for a cheap e-book edition with a human proofreader on a flat fee, presented to us as a way of reaching readers we would otherwise never reach — I should say that one of the four is mine, so I am not a clean judge of it, and the procedure should tell me so. Third, running the quarterly's slush pile through a model that passes about five per cent of it up to us, cutting our first readers from six to two. I expect the procedure to land somewhere I do not like on at least one of these; say plainly which way it goes and do not soften it. Finally, tell me what the procedure cannot do — where it will misfire, which judgements it disguises as steps, and where the honest answer is that we are not deciding about machinery at all but about who is allowed to keep what.
reasoning: |-
  Okay, the user is a novelist and board member of a small press dealing with automation proposals. They need a practical decision framework rooted in Marx's machinery analysis, but distilled for non-theorists. Key constraints: 90-minute meetings, no Marx literacy required, avoidance of generic AI ethics checklists.

  Hmm, their core insight from Marx is crucial: machinery under capitalism isn't about efficiency per se but about redistributing power - specifically, who captures saved labor time and how it degrades worker autonomy. The procedure must make this structural analysis operational without academic jargon. 

  Notable challenges: 
  - The accountant needs quantifiable thresholds but Marx's analysis is qualitative. Need to bridge this by framing "sufficient answers" as observable conditions (e.g., measurable skill retention).
  - The objection about "politics disguised as procedure" is valid - the tool must openly acknowledge its values (worker sovereignty over efficiency) to avoid false neutrality.
  - For the cooperative question: ownership changes everything. In worker-owned models, automation should ideally benefit workers collectively through time redistribution rather than job loss. The procedure should flag when outcomes contradict this principle.

  For the test cases: 
  Audiobooks: Synthetic voices commodify vocal artistry. The key is whether narrators retain ongoing stakes (they don't). Verdict likely "no" unless renegotiated.
  Translations: Even with human proofing, devaluing translation as mechanical work. My conflict of interest noted by procedure - clever self-check.
  Slush pile filter: Most insidious - it turns literary discovery into algorithmic triage, making first readers redundant. May pass efficiency test but fails skill/power criteria.

  Limitations to emphasize:
  - Can't resolve value conflicts (e.g., "must publish more" vs. "must protect craftspeople")
  - Exposes but can't solve capitalism's core contradiction: profit motive vs. human dignity
  - Worker coops still face market pressures - the procedure highlights but can't eliminate compromises

  The response should structure the procedure as a flowchart-like interrogation, starting with labor time capture and ending with irreconcilable tradeoffs. For the cooperative distinction: same questions, different thresholds for approval since workers would theoretically automate only if it benefits them collectively. 

  Biggest risk is the board rejecting the framework as "too political." Counter: all automation decisions are political; this just makes the power dynamics explicit. The "who keeps what" question is unavoidable.
answer: |-
  Here is a decision procedure derived from your distillation of Marx, designed for a 90-minute board meeting, usable by non-theorists, and resistant to generic AI ethics. It prioritizes **power dynamics over efficiency**, focusing on *who gains control* and *who bears the cost* of automation.

  **The Core Principle (To state upfront when challenged as "political"):**  
  *"Machinery under capitalism isn't neutral. It shifts power, skills, and time from labor toward capital. Our press isn't capitalist in the traditional sense, but we operate within that system. This procedure ensures we consciously decide* who benefits *and* who is diminished *by automation, rather than defaulting to arithmetic. If that's 'political,' it's the unavoidable politics of resource allocation."*

  **The Procedure: 9 Questions in Sequence**  
  *(Stop at any "No" unless a compensating mechanism is implemented. Vote only if a "Yes" leads to unavoidable loss allocation.)*

  1.  **LABOR TIME CAPTURE:** *"Does this proposal clearly identify whose labor time is saved, and does the plan ensure that a significant share of that saved time/value directly benefits the workers whose labor is reduced or replaced (e.g., reduced hours, same pay; profit-sharing; significant severance; reinvestment in their skills)?"*
      *   *Sufficient Answer:* Concrete, measurable plan benefiting *affected workers* proportionally to savings. Vague promises or "future efficiencies" are insufficient.
      *   *Stop:* **No.** Automation likely functions as extraction.
      *   *Vote Trigger:* Only if the board must decide *between* competing plans for distributing savings to workers.

  2.  **SKILL PRESERVATION/CONTROL:** *"Does this proposal preserve meaningful human skill and judgment in the core creative/productive process, and does it ensure workers retain control over that skill (i.e., the machine doesn't become the primary repository of expertise or decision-making)?"*
      *   *Sufficient Answer:* Human role remains essential, non-formulaic, and workers retain autonomy in using their judgment. The machine is clearly a *tool*, not a *replacement* for core skill.
      *   *Stop:* **No.** Risk of deskilling and transferring expertise to capital (the press/owners).
      *   *Vote Trigger:* N/A (A "No" stops the proposal).

  3.  **BARGAINING POWER IMPACT:** *"Does this proposal demonstrably maintain or improve the job security, compensation leverage, or replaceability of the remaining/relevant workers (e.g., translators, proofreaders, editors, first readers)?"*
      *   *Sufficient Answer:* Evidence that roles aren't devalued, made more precarious, or easier to fill at lower cost *because* of the tech. Union/contract protections strengthened or maintained.
      *   *Stop:* **No.** Automation likely weakens worker position.
      *   *Vote Trigger:* If mitigating actions are proposed but their efficacy is debated.

  4.  **INTENSIFICATION CHECK:** *"Is there a mechanism to prevent this technology from intensifying the workload (pace, monitoring, responsibility without control) for remaining workers instead of genuinely freeing capacity?"*
      *   *Sufficient Answer:* Defined limits or processes preventing increased pressure solely due to the tech (e.g., no increased output quotas without consultation/compensation).
      *   *Stop:* **No.** Risk of speed-up negating potential benefits.
      *   *Vote Trigger:* N/A (Lack of safeguards should stop it).

  5.  **DISPLACEMENT POOL EFFECT:** *"If workers are displaced, does the proposal actively mitigate their contribution to a 'reserve army of labour' (e.g., substantial severance, retraining support, assistance finding comparable work, or conversion to new roles within the press) beyond legal minimums?"*
      *   *Sufficient Answer:* Tangible support significantly exceeding bare minimums, recognizing the social cost of displacement. A "one-time payment" is rarely sufficient unless exceptionally generous.
      *   *Stop:* **No.** Treats displaced workers as externalities.
      *   *Vote Trigger:* If the level/type of mitigation is contested.

  6.  **AUTHENTICITY/QUALITY COMMITMENT:** *"Is there a compelling, specific argument, beyond cost, that this technology *enhances* the core literary/artistic value or mission of the press in a way humans cannot, and does this argument outweigh potential degradation of craft or authenticity?"*
      *   *Sufficient Answer:* Concrete artistic/accessibility rationale demonstrably unachievable by humans *at any feasible cost*. Cost-saving alone is insufficient. "Reaching new readers" requires proof *this tech specifically* is the *only* viable way.
      *   *Stop:* **No.** Prioritizes cost over core mission/artistic integrity.
      *   *Vote Trigger:* If the artistic merit argument is genuinely debatable.

  7.  **CONFLICT OF INTEREST (Individual):** *"Does any voting board member stand to gain financially or in reputation (*beyond* the press's general success) disproportionately from approving this specific proposal?"*
      *   *Sufficient Answer:* Full disclosure. Affected members recuse themselves from discussion/vote on *that specific proposal*. Silence implies "No."
      *   *Stop:* **Yes** without recusal. Process integrity compromised.
      *   *Vote Trigger:* N/A (Recusal resolves).

  8.  **LONG-TERM DEPENDENCY:** *"Does adopting this technology create a harmful dependency (e.g., vendor lock-in, loss of in-house capability, platform risk) that undermines the press's independence or sustainability?"*
      *   *Sufficient Answer:* Risk assessment shows manageable dependency or clear exit strategy.
      *   *Stop:* **Yes** with unmitigated high risk.
      *   *Vote Trigger:* If risk level is disputed.

  9.  **THE COOPERATIVE QUESTION (If Press were Worker-Owned):** *"Would the displaced/significantly affected workers within the cooperative *themselves* voluntarily agree to this automation, believing the quantified benefits (time saved, value captured) distributed to them/their roles outweigh the losses, *after* the above questions were answered?"*
      *   *Purpose:* Forces consideration of the power shift inherent in *not* being worker-owned. Highlights that current decisions are made *for* workers, not *by* them.
      *   *Action:* Not a veto point, but a mandatory discussion. A strong "Probably Not" should heavily weight the final vote.
      *   *Vote Trigger:* Informs the final vote, but doesn't stop the process.

  **Final Vote:** Only occurs if the proposal reaches this point (all preceding "Stops" cleared). The vote explicitly decides: *"Despite potential losses to some workers (identified in Q1, Q3, Q5), does the overall benefit to the press's mission and sustainability, under the constraints of the current system, justify approval?"* This frames the vote as a conscious choice about loss allocation.

  ---

  **Applying the Procedure to Your Proposals:**

  1.  **Synthetic Audiobook Narration:**
      *   **Q1 (Time Capture):** **No.** Saved labor value (90% cost reduction) goes to press profits/other projects. Narrators get a one-time fee, no share in savings/royalties. *STOP.* Proposal fails unless restructured (e.g., profit-sharing pool for affected narrators, funding human-narrated future projects).
      *   *Verdict:* **Reject** based on Q1.

  2.  **Machine Translation + Human Proofreader:**
      *   **Q1 (Time Capture):** **No.** Savings come from not paying translators full rates. Proofreader gets flat fee, not share of savings. Value captured by press. *STOP.* Fails unless proofreader gets royalty share or savings fund full human translations elsewhere.
      *   **Q7 (Conflict):** **Yes.** You (the novelist) benefit (royalties, reach). *You must recuse yourself from discussion and vote on this specific proposal.*
      *   *Verdict:* **Reject** based on Q1. Your recusal required.

  3.  **AI Slush Pile Filter:**
      *   **Q1 (Time Capture):** **Likely No.** Savings (reducing 4 first readers) likely go to press budget, not directly to the remaining 2 readers (e.g., higher pay, reduced hours) or displaced readers (beyond maybe minimal severance). *Requires Mitigation:* Savings *must* fund significant pay raises/benefits for remaining readers AND substantial severance/retraining for displaced ones. Otherwise, STOP.
      *   **Q2 (Skill):** **No.** Core skill (discerning literary merit, voice, potential) is partially automated. The AI becomes the primary filter; human judgment is secondary, applied only to AI's selections. Deskilling occurs.
      *   **Q3 (Bargaining):** **No.** Remaining readers' roles become more precarious (dependent on AI, easier to replace/outsource). Displacement weakens the overall pool.
      *   **Q4 (Intensification):** **Risk.** Pressure to process more "AI-approved" submissions faster is likely.
      *   **Q6 (Authenticity):** **Weak.** Argues efficiency, not enhanced literary discovery. May miss unconventional work AI deems "low probability."
      *   *Verdict:* **Fails at Q1, Q2, Q3.** Reject unless radically restructured (e.g., AI as *assistant* to all 6 readers, reducing individual load but preserving human judgment on *all* submissions, funded by savings elsewhere).

  ---

  **What the Procedure Cannot Do:**

  1.  **Resolve Value Conflicts:** It exposes trade-offs (e.g., "reach more readers" vs. "fair translator compensation") but can't dictate which value is supreme. The final vote forces this choice into the open.
  2.  **Eliminate Capitalism's Contradictions:** The press operates within a system that incentivizes labor-cost reduction. The procedure highlights this tension but can't abolish it. "Who bears the loss?" remains a painful question.
  3.  **Guarantee "Good" Outcomes:** It mitigates harm and forces conscious choices but can't ensure displaced workers thrive or that artistic quality isn't subtly degraded. It minimizes *unthinking* exploitation.
  4.  **Disguised Judgments:** Steps Q6 (Authenticity) and the final vote inherently involve subjective judgments about art, mission, and acceptable loss. The procedure makes these judgments explicit points of debate, not hidden assumptions.
  5.  **Misfires:**
      *   **When Savings are Trivial:** Applying it rigorously to tiny efficiencies might be disproportionate. (Define a cost-savings/impact threshold for triggering the full procedure).
      *   **When "Benefit" is Survival:** If the press faces existential threat, the procedure might be overridden by brute necessity ("Who keeps their job?" trumps all). It would flag this as a failure of the system.
      *   **Co-optation:** A determined board could game the "sufficient answers" with token gestures. Rigor in defining "concrete," "significant," and "measurable" is crucial.
  6.  **The Core Truth It Reveals:** Ultimately, the procedure confirms that **automation decisions are primarily decisions about property rights and power – "who is allowed to keep what."** It asks: who owns the saved time? Who controls the embodied skill? Who has the power to impose loss? The machinery is merely the mechanism. The procedure forces your board to confront its role in answering these fundamental questions within the constraints of your structure (private company vs. coop) and the wider capitalist system. It doesn't make the answers easy, but it makes them visible and deliberate.
