prompt: |-
  I am presenting a paper to a just war theory reading group, and I need a Q&A prep sheet. My thesis is that the moral equality of combatants should be grounded not in the epistemic condition — the idea that soldiers cannot reasonably be expected to judge whether their war is just — but in an institutional division of moral labor: the authority to decide on resort to war is vested in states, and individual combatants' permissions and liabilities track that authority rather than the objective justice of their cause. The room is mostly revisionists who hold that unjust combatants are morally liable to attack and who will treat my institutional move as a dodge; two Walzerians who will hear it as a concession to revisionism; and one international lawyer who cares about what the view does to the symmetry of the laws of armed conflict. Give me the objections I will actually get from this room, ordered by how likely and how damaging they are, phrased the way each objector would phrase them, each with a two-minute reply and a note on where the reply is softest. Include the question I am hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a Q&A session after presenting a paper on just war theory. Their thesis challenges the traditional epistemic justification for the moral equality of combatants, proposing instead an institutional division of labor approach. The audience consists of revisionists, Walzerians, and an international lawyer, each with distinct concerns.

  First, I need to map out the key objections from each group. The revisionists will likely reject the institutional approach as a dodge, since they believe combatants should be judged based on the objective justice of their cause. The Walzerians might see this as a concession to revisionism, undermining the collective aspect of war. The international lawyer will worry about symmetry in international humanitarian law (IHL).

  For the revisionists, the toughest objection would be the evasion of moral responsibility. They'll argue that institutions don't absolve individuals. The Walzerians might think the institutional focus weakens the political community's role, and the lawyer will stress practical implications for IHL symmetry.

  The user's unspoken need is anticipating all angles, especially the "killer question" they hope isn't asked. That's probably about how institutions themselves can be unjust, forcing them to defend the legitimacy of flawed states. 

  For each objection, I should draft a concise two-minute response. The revisionist reply needs to clarify that institutions shape roles without erasing individual morality. The Walzerian response should differentiate from revisionism by emphasizing political authorization. The lawyer's concern requires affirming symmetry's practical necessity while separating it from deep morality.

  The soft spots: For revisionists, conceding that bad-faith obedience isn't excused might not satisfy them. The Walzerians might still see statism as corrosive. The lawyer might push back on separating law from morality. The killer question about institutional legitimacy is hard because it challenges the foundation—acknowledging this vulnerability is crucial.

  Overall, structuring responses to address each group's core concerns while preparing for the toughest critique will help the user navigate the Q&A confidently.
answer: |-
  Here are the objections you'll likely face, ranked by likelihood and damage, phrased as each objector would, with concise replies and vulnerability notes, plus the "killer question":

  **Most Likely & Damaging:**

  1.  **The Revisionist (Epistemic Dodge):** "This institutional shield is just a sophisticated way to let unjust combatants off the moral hook! You're replacing the epistemic *excuse* with an institutional *excuse*. But the fundamental moral reality remains: one side is perpetrating aggression. Your 'division of labor' absolves individuals of their basic moral duty *not to kill for an unjust cause*. Doesn't this institutionalize moral evasion and make soldiers mere automatons of the state, devoid of personal moral responsibility?"
      *   **Reply (2 min):** "Not an excuse, but a *reassignment of primary responsibility*. The moral labor *is* divided: the state bears the primary responsibility for the *jus ad bellum* decision, a complex political judgment involving collective self-defense and proportionality best made by authorized institutions. Combatants, within their institutional role, bear responsibility for *jus in bello* conduct – fighting ethically *given the state of war authorized by the institution*. Their liability stems from their role as agents enacting potentially lethal state policy, *not* from a personal judgment on the war's justice. This preserves individual moral agency *within* their role (e.g., refusing illegal orders) while recognizing the state's unique authority and responsibility for the resort to force. It avoids the impossible epistemic burden without denying the underlying injustice of aggression – that blame falls primarily on the *state* and its leaders."
      *   **Soft Spot:** Conceding that *knowingly* participating in blatant, undeniable aggression *might* incur individual *jus ad bellum* culpability beyond the scope of the institutional role. Also, doesn't fully resolve the "unjust cause" killing being *intrinsically* wrong, even if institutionally sanctioned.

  2.  **The International Lawyer (IHL Symmetry):** "You're pulling the rug out from under the foundational symmetry of IHL! The moral equality of combatants is *the* bedrock principle allowing clear, workable rules of engagement that protect combatants and civilians. If you ground combatant permission/liability solely in institutional authorization, but then admit the *institution's* cause might be unjust, aren't you undermining the very basis for treating all uniformed combatants equally under the law? Doesn't this open the door to morally justifying asymmetric legal privileges/liabilities based on perceived justice, which would be catastrophic for compliance and predictability?"
      *   **Reply (2 min):** "IHL symmetry is *pragmatically necessary* but *morally shallow*. My account *explains why that pragmatic symmetry works*: combatants on both sides are equally liable *because* they are acting as authorized agents of their respective institutional actors (states) who have made the political decision for war. The law targets the *status/role* (lawful combatant) precisely because it cannot reliably adjudicate the *justice of the cause* in real-time. My view *supports* IHL symmetry as a vital practical convention grounded in the reality of institutional actors in conflict, *not* because the combatants are morally equivalent. It separates the deep moral question (*jus ad bellum* blame) from the functional legal rules (*jus in bello* application)."
      *   **Soft Spot:** Admitting this creates a tension: the law treats combatants equally based on status, but your moral theory *does* see a deep asymmetry (one state is acting unjustly). Can this "functional" justification for symmetry hold if pressed? The lawyer fears *any* theoretical admission of deep asymmetry undermines legal symmetry.

  3.  **The Walzerian (Concession to Revisionism):** "This sounds like a massive concession to the revisionists! Walzer's point was that soldiers are *not* murderers because they fight as members of *political communities* engaged in a collective act. You've replaced 'political community' with 'institution' and stripped out the communal bond and shared fate. Doesn't reducing it to an 'institutional division of labor' make soldiers look like contractors hired by the state, destroying the very collectivist ethos that justifies their mutual recognition as soldiers and protects them from being treated as criminals?"
      *   **Reply (2 min):** "It's a *reinterpretation*, not a concession. The 'institution' *is* the modern state, the primary political community actor in war. The 'division of labor' *captures* the reality that the *decision* to engage the community in war is vested in specific state organs. Combatants fight as members *authorized by that community's institutional structure*. The mutual recognition still holds: each combatant recognizes the other as an agent of a sovereign entity making a political claim (even if false). This grounds equality *in the structure of international relations and state authority*, not in subjective communal bonds or a denial of *jus ad bellum* truth. It preserves the non-criminal status of soldiers without relying on the problematic epistemic claim."
      *   **Soft Spot:** The Walzerian feels the "soul" is gone – replacing communal obligation with institutional role sounds cold and potentially corrosive to the warrior ethic they value. They might push back that this makes soldiers mere instruments.

  **Likely & Damaging:**

  4.  **The Revisionist (Bad Institutions):** "What about manifestly illegitimate or evil institutions? Does a soldier fighting for ISIS or a genocidal regime get the same 'institutional authorization' shield? Your theory seems to grant legitimacy *by default* to any entity calling itself a state or wielding power, which is morally bankrupt. Surely there's a threshold where institutional authority dissolves, and individual moral responsibility for participation kicks in?"
      *   **Reply (2 min):** "The theory presupposes institutions capable of bearing the *jus ad bellum* responsibility – typically legitimate states or recognized belligerents. Entities like ISIS, fundamentally dedicated to atrocity and lacking minimal legitimacy/sovereignty functions, likely fall below this threshold. Their 'combatants' are more akin to members of a criminal gang; authorization by such an entity doesn't generate the same permissions/liabilities. This reflects state practice (e.g., denial of POW status to unlawful combatants). The threshold is high, preserving the framework for standard interstate conflicts involving recognized states."
      *   **Soft Spot:** Defining the threshold precisely is messy. Does it apply only to non-state actors? What about a *state* committing genocide? This risks collapsing back into needing epistemic judgments about institutional legitimacy/justice.

  5.  **The Revisionist/General (Following Orders):** "Isn't this just a revival of the 'superior orders' defense dressed up in institutional theory? If liability flows from institutional role, not the cause's justice, then obeying orders becomes the primary duty, washing away individual moral complicity in injustice. How is this different from "Befehl ist Befehl"?"
      *   **Reply (2 min):** "Absolutely not. The institutional role defines the *scope* of permission/liability (fighting for the state), *not* immunity for *jus in bello* crimes or unquestioning obedience. Soldiers retain full moral (and legal) responsibility for *how* they fight. Obeying manifestly illegal orders (war crimes) is never permitted. The institutional role explains why a soldier fighting *within the laws of war* for an unjust cause is liable to attack (as an agent of the aggressor state), but *not* why they are absolved of blame for atrocities. *Jus in bello* violations are always individual moral failures."
      *   **Soft Spot:** Distinguishing "fighting for an unjust cause" (permitted under the institutional role) from "participating in an unjust war" (which feels morally tainted) remains psychologically and morally tricky. The objection highlights a perceived moral complacency.

  **The Question You Hope Nobody Asks (The Killer Question):**

  *   **The Sharp Revisionist or Walzerian (Institutional Legitimacy):** "You ground combatant permissions in the state's institutional authority to decide on war. But what *grounds the moral legitimacy of that state authority* in the first place? If state authority itself derives from some form of popular consent/justification (even tacitly), doesn't a soldier's permission to fight ultimately depend on whether the *war itself* aligns with the purposes for which the state legitimately holds that authority (e.g., national defense)? And if the war *doesn't* align (it's aggressive), hasn't the state *exceeded* its legitimate authority, rendering the soldier's actions *unauthorized* and thus *not* covered by your institutional shield? Doesn't this collapse your view back into needing an assessment of the war's justice to determine if the authorization was valid?"

      *   **Why it's Killer:** This strikes at the *moral foundation* of the institutional authority you rely on. If state authority is only legitimate when exercised justly, then unjust war delegitimizes the authorization, potentially stripping combatants of the permissions derived from it. It forces you to either defend a very robust, justice-independent conception of state legitimacy (which is hard), or admit that the legitimacy of the authorization *does* depend on the *jus ad bellum* assessment, undermining your core thesis.
      *   **Potential (Difficult) Reply:** "The legitimacy of state authority for *declaring war* is a separate, prior question. The modern state system *conventionally* vests this authority in specific institutions (executive/legislative) based on political processes, not contingent on each *jus ad bellum* decision being correct. Soldiers rely on this *conventional institutional structure*. Holding combatants responsible for assessing the *legitimacy of the authorization itself* based on *jus ad bellum* correctness imposes the same epistemic burden I seek to avoid. The institutional role exists within the *fact* of the state's conventional authority, even if that state acts unjustly in a particular instance. The deep *jus ad bellum* wrong creates state/leader culpability, not automatically invalidating every act of its agents acting within their functional role."

  **Key Prep Strategy:** Emphasize that your account is *descriptive* of how moral responsibilities *are* structured in the modern state system and *prescriptive* in arguing this structure is normatively preferable to epistemic approaches for grounding combatant equality. Constantly link back to the *practical function* of the institutional division of labor in managing the complexities of war and sovereignty. Be prepared to acknowledge the *tensions* without letting them collapse your core distinction. Good luck!
