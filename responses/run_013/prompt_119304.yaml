  **Key Clarifications**:  
  - **Second-order boundary**: Epistemicists assert it is sharp; supervaluationists deny this.  
  - **Case (a) vs. (b)**: Both agree (a) typifies vagueness and (b) has a sharp unknowable fact. The debate is whether natural language vagueness resembles (a) (indeterminate) or (b) (determinate but unknown).  
