answer: |-
  ### Joint Statement on Vagueness: Epistemicism and Supervaluationism  
  **After good-faith adversarial collaboration, we agree on the following claims:**  
  1. **The sorites paradox** arises for vague predicates (e.g., "rich," "tall") due to small, continuous changes. Both sides reject the **tolerance principle** (if \(x\) and \(x'\) differ imperceptibly in the relevant respect, both must satisfy or both fail the predicate) to avoid contradiction.  
  2. **Borderline cases exist**: For a vague predicate \(F\), there are objects where competent speakers cannot definitively assert \(F\) or \(\neg F\).  
  3. **"Definitely" operator**: Both sides use "definitely" (or "determinately") to denote cases where \(F\) clearly applies or fails. Borderline cases are those where \(\neg \text{Definitely}\, F\) and \(\neg \text{Definitely}\, \neg F\).  
  4. **Excluded middle (LEM)** holds: For any object \(x\) and vague predicate \(F\), \(F(x) \lor \neg F(x)\) is true.  
  5. **Bivalence is contested**: We disagree on whether every sentence is true or false (see disagreements).  
  6. **Second-order vagueness**: The boundary between **definitely-\(F\)** and **borderline-\(F\)** is itself vague—no linguistic practice fixes a sharp cutoff for *this* boundary.  
  7. **Core dispute**: Vagueness stems from **ignorance of sharp boundaries** (epistemicism) or **semantic indecision** (supervaluationism). This is not verbal; it concerns whether vagueness is an epistemic or metaphysical phenomenon.  
  8. **Test cases (a) and (b)**: Both sides agree:  
     - **(a)** A community using "rich" with no settled/disposed cutoff and no recognition of facts that could settle it exemplifies *paradigmatic vagueness*.  
     - **(b)** The erased admissions threshold (fixed by coin flip) involves a **sharp, unknowable fact**.  
     - **The crux**: Whether vagueness in natural language (e.g., "rich") is metaphysically like (a) or like (b).  

  **Residual disagreements**:  
  | Issue | Epistemicist View | Supervaluationist View |  
  |-------|-------------------|------------------------|  
  | **Bivalence** | Bivalence holds: Every declarative sentence is true or false, even in borderline cases (truth is unknowable). | Bivalence fails: Borderline sentences are neither true nor false; truth is supertruth (true in all admissible precisifications). |  
  | **Nature of borderline cases** | Borderline = epistemic: \(F(x)\) has a sharp truth value, but we cannot know it. | Borderline = semantic: \(F(x)\) lacks a truth value; it is indeterminate. |  
  | **What "definitely" means** | "Definitely \(F\)" = \(F\) is true and knowable (in principle). | "Definitely \(F\)" = \(F\) is supertrue (true in all admissible precisifications). |  
  | **Second-order boundary sharp?** | Yes: The transition from definitely-\(F\) to borderline is sharp but unknowable (like all boundaries). | No: The transition is vague; higher-order borderline cases exist. |  
  | **Source of vagueness** | Ignorance: Linguistic practices fix sharp cutoffs, but human limitations prevent knowledge. | Indeterminacy: Linguistic practices underdetermine cutoffs; precisifications resolve indeterminacy. |  

  **Cruxes**: Sub-questions where resolution would shift at least one position. For each, we specify a test case and predictions.  
  1. **Crux 1: Is there a sharp boundary for a vague predicate in a community with no disposition to settle it?**  
     - **Test case (a)**: Community uses "rich" with no settled/disposed cutoff; no member recognizes any fact as settling it.  
       - *Epistemicist prediction*: Sharp boundary exists (unknowable).  
       - *Supervaluationist prediction*: No sharp boundary exists.  
     - **Bears on**: Whether vagueness reduces to ignorance (if sharp boundary exists) or semantic indecision (if not).  

  2. **Crux 2: Is vagueness metaphysically analogous to the erased threshold (case b)?**  
     - **Test case (b)**: Admissions gate with erased coin-flip threshold (sharp fact exists but is unknowable).  
       - *Epistemicist prediction*: Vagueness is like (b): Natural language predicates have sharp boundaries fixed by use (even if unknowable).  
       - *Supervaluationist prediction*: Vagueness is unlike (b): Case (b) had a stipulative sharp fact; natural language lacks such facts.  
     - **Bears on**: Whether vagueness is epistemic (like (b)) or ontological (unlike (b)).  

  **Verbal element**: The term "borderline" is partially verbal. Both sides use it to describe cases where we cannot assert \(F\) or \(\neg F\), but they disagree on *why* (ignorance vs. indeterminacy). This does not trivialize the dispute, as it reflects deeper metaphysical divergences.  

