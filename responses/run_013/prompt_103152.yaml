  The response should:
  - Ground in Kant's actual texts (e.g., the "false testimony" framing in Metaphysics of Morals)
  - Distinguish between causal effects and the agent's will (intending deception vs allowing inference)
  - Leverage philosophy of language: assertion as commitment vs non-assertion as opting out
