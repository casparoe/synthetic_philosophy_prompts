prompt: |-
  I run a small reading group on democratic theory and we've been stuck for months on the epistocracy thing — whether political decisions should be made by people who know more, or by everyone on equal terms. We've been through the usual arguments and nobody has moved an inch. The epistocrats keep pointing to how little voters know about basic policy facts and say it's ultimately an empirical question about who decides better; the democrats keep saying it doesn't matter because authority has to be justifed to each person it binds, and anyway there's no neutral way to score a political decision as "correct." My working hypothesis is that the stall isn't about evidence at all — one side is asking which arrangment tends to produce better decisions and the other is asking which arrangment can rightfully coerce me, and those two questions can't be settled against each other. Or maybe it's a verbal fight about what "democracy" is supposed to mean.

  Act as a political philosopher who works on democratic legitimacy, brainstorm a bit before you commit, then give me a diagnosis rather than a survey. What kind of disagreement is this actually — empirical, about standards of justification, about which cases count as evidence, or two different questions wearing one word? And given your diagnosis, what would count as progress (a distinction, a thought experiment, a formal result), or why should nothing move it?

  Please use one specific test case so the answer stays concrete: a friend of mine proposes what she calls a competence-filtered jury — a randomly chosen citizens' assembly that has to include a minority of credentialed experts holding a veto over purely factual claims but not over value questions. Take that seriously and tell me whether the standard positions can even classify it, since if they can't, that seems like a clue about where the stall comes from. Engage what each side actually argues, not the textbook cartoon version, and don't hedge — pick a diagnosis and defend it.
