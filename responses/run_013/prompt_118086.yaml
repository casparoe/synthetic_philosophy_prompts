  We are drafting a joint statement between a committed dilemmist (D) and a committed opponent (O) regarding the possibility of genuine moral dilemmas. The statement will include:

  1. Points of agreement, including the definition of a genuine dilemma and what the dispute is not about.
  2. Precise remaining disagreements, worded so each side accepts their own formulation.
  3. Cruxes of the disagreement (e.g., agglomeration, 'ought implies can', the reading of 'ought').
  4. For each crux, an agreed-upon argument or case and each side's prediction.
  5. A minimal test case (thin description) that D calls a dilemma and O does not, with each side's account of which extra features are doing the real work, including agent responsibility (e.g., bringing the dilemma on herself).
  6. Whether any part is merely verbal and, if so, whether settling it leaves a real disagreement.
  7. What each side would accept as reason to abandon its position.

  ---

  **Joint Statement on the Possibility of Genuine Moral Dilemmas**

  **Signed:**  
  Committed Dilemmist (D)  
  Committed Opponent (O)

  **Date:** [Date]

  ---

  **I. Points of Agreement**

  We, the undersigned, agree on the following:

  1. **Definition of a Genuine Moral Dilemma**: A situation in which an agent is morally required to perform each of two (or more) actions, cannot perform both (or all), and therefore, no matter what she does, she will fail to fulfill a moral requirement and thus do something morally wrong.

  2. **The Substantive Question**: The dispute is about whether such situations are metaphysically possible. We agree that if they are possible, then there are genuine moral dilemmas; if not, then every apparent dilemma is either resolvable (i.e., one option is what the agent ought to do all things considered) or merely epistemic (i.e., the agent cannot tell which option is required, but one is).

  3. **What the Dispute is Not About**:
     - We are not disputing that moral conflicts (situations with conflicting moral reasons) occur frequently.
     - We are not disputing that agents often experience dilemmas as psychologically distressing or as involving feelings of guilt or regret.
     - We are not disputing that some apparent dilemmas are resolvable (by a correct moral calculus) or epistemic (due to limited knowledge).
     - We are not disputing the existence of pro tanto obligations (obligations that can be overridden by more stringent ones). The question is whether, after all considerations are in, there can be an inescapable conflict of all-things-considered obligations.

  4. **The Role of Moral Theories**: We agree that the answer to whether genuine dilemmas are possible may depend on the correct moral theory. However, we are debating the matter at the level of meta-ethics and normative theory, assuming that a consistent and true moral theory must either allow or disallow such dilemmas.

  5. **The Importance of the Issue**: We agree that the possibility of genuine dilemmas has significant implications for moral responsibility, blame, regret, and the structure of moral theories.

  ---

  **II. Precise Remaining Disagreements**

  Each side states its position in a way it accepts:

  - **Dilemmist (D)**: There are possible situations in which an agent has two (or more) all-things-considered moral obligations that are jointly unsatisfiable, and thus the agent will necessarily violate at least one moral obligation, doing wrong no matter what she does.

  - **Opponent (O)**: In every possible situation, the agent has exactly one all-things-considered moral obligation (or none, if no obligation applies). Apparent conflicts are either because (a) the agent has not correctly determined her all-things-considered obligation (resolvable) or (b) she lacks sufficient information to know which obligation is overriding (epistemic). Therefore, no situation satisfies the definition of a genuine dilemma.

  ---

  **III. Cruxes of the Disagreement**

  We identify the following key points of disagreement, with each side's stance and an agreed-upon test that bears on the issue. For each crux, we record both sides' predictions about how the test case (or thought experiment) would turn out under a correct moral theory.

  **Crux 1: Agglomeration Principle**

  - **Definition**: The agglomeration principle states that if an agent ought to do A and ought to do B, then she ought to do both A and B.
  - **D's view**: Rejects agglomeration for all-things-considered 'oughts'. In a dilemma, the agent ought to do A and ought to do B, but it is not the case that she ought to do both (because she cannot).
  - **O's view**: Accepts agglomeration. If the agent cannot do both A and B, then it cannot be that she ought to do A and ought to do B. The 'oughts' must be pro tanto, and the all-things-considered 'ought' does not agglomerate in a way that leads to contradiction.

  **Test Case for Agglomeration**: Consider a situation where an agent has promised to attend a friend's wedding at 2 PM and has also promised to attend another friend's graduation at the same time, in a different city. The agent cannot be in two places at once.

  - **D's prediction**: This is a genuine dilemma. The agent has two all-things-considered obligations (from the promises) that conflict, and she cannot do both. Thus, she ought to go to the wedding and ought to go to the graduation, but she cannot do both, so she will violate one obligation no matter what.
  - **O's prediction**: The agent does not have two all-things-considered obligations. The all-things-considered obligation is to do one or the other (or perhaps neither, if a higher obligation intervenes), but not both. The pro tanto obligations are overridden by the circumstances (impossibility) so that the agent only has one all-things-considered obligation (e.g., to choose the more important event or to apologize for missing one).

  **Crux 2: 'Ought Implies Can' (OIC)**

  - **Definition**: The principle that if an agent ought to do something, then she must be able to do it.
  - **D's view**: Accepts OIC but argues that in a dilemma, the agent ought to do A (and she can do A) and ought to do B (and she can do B), but she cannot do both. Thus, OIC is satisfied for each obligation individually, but the joint obligation fails because of impossibility.
  - **O's view**: Accepts OIC and argues that if the agent cannot do both A and B, then it cannot be that she all-things-considered ought to do both. Therefore, the 'oughts' in question must be pro tanto and not all-things-considered.

  **Test Case for OIC**: Same as above (double booking of promises).

  - **D's prediction**: The agent can keep the first promise (by going to the wedding) and can keep the second promise (by going to the graduation). Thus, for each, OIC holds. But she cannot do both, so she cannot satisfy both obligations simultaneously.
  - **O's prediction**: Because the agent cannot do both, it cannot be that she all-things-considered ought to do both. The all-things-considered obligation must be for one or the other (or a third option), which she can do. Thus, OIC is not violated.

  **Crux 3: The Reading of 'Ought'**

  - **D's view**: The 'ought' in moral dilemmas is all-things-considered (ATC). In a dilemma, the agent ATC ought to do A and ATC ought to do B, but she cannot do both.
  - **O's view**: The 'ought' that matters for moral dilemmas is the ATC ought. But in a conflict, the pro tanto oughts are overridden, and only one ATC ought remains. Therefore, there is no conflict at the ATC level.

  **Test Case for Reading of 'Ought'**: Consider a variation of the promise case where the agent has made two equally important promises and there is no way to prioritize one over the other (e.g., both events are equally important, and the agent has no other obligations).

  - **D's prediction**: Both obligations are ATC because there are no overriding considerations. Hence, the agent ATC ought to keep the first promise and ATC ought to keep the second, but cannot.
  - **O's prediction**: The agent's ATC obligation is to choose one (or perhaps to break one and compensate). The pro tanto obligations remain, but the ATC obligation is singular and resolvable.

  ---

  **IV. Minimal Test Case**

  **Thin Description**: An agent, through no fault of her own, is faced with two actions, A and B. She has a moral obligation to do A (e.g., to save a life) and a moral obligation to do B (e.g., to save another life), but she cannot do both. There are no other morally relevant factors.

  - **D's claim**: This thin case is a genuine dilemma. The extra features that might be added (like the agent having caused the conflict) do not change the core possibility. However, if the agent brought the dilemma on herself (e.g., by carelessly making conflicting promises), that does not prevent it from being a dilemma; it only affects blameworthiness.
  - **O's claim**: This thin case is not a genuine dilemma. The extra features that are missing and would be needed to make it resolvable or epistemic include: (1) a higher-order principle that breaks the tie (e.g., save the one you can save first, or flip a coin) or (2) the presence of an overriding obligation that makes one action ATC required. If the agent brought the dilemma on herself, then she may have a single ATC obligation to rectify her error (e.g., by apologizing and compensating), which resolves the dilemma.

  **Testing Agent Responsibility**: We consider a variant where the agent has culpably created the conflict (e.g., she promised to attend two events at the same time, knowing it was impossible).

  - **D's account**: Even if the agent created the conflict, she still has two ATC obligations (to keep each promise) that she cannot both fulfill. The fact that she created the dilemma might make her blameworthy for being in the situation, but it does not eliminate the conflicting obligations.
  - **O's account**: Because the agent created the conflict, her ATC obligation is to mitigate the harm (e.g., choose one and apologize for the other). The pro tanto obligations are overridden by the obligation to rectify her own wrongdoing. Thus, there is only one ATC obligation.

  ---

  **V. Verbal Disagreement**

  We agree that part of the dispute may be verbal, specifically regarding the use of the term 'ought':

  - **Verbal Element**: The opponent holds that the dilemmist is using 'ought' in a pro tanto sense when describing the conflicting obligations, not in the all-things-considered sense. The dilemmist, however, insists that they are using 'ought' in the all-things-considered sense.

  - **Settling the Verbal Issue**: If we stipulate that 'ought' means all-things-considered, then the opponent argues that the dilemmist must be mistaken because the all-things-considered ought must be consistent and action-guiding. The dilemmist, however, maintains that even the ATC ought can conflict.

  - **Real Disagreement Remaining**: Even after clarifying terminology, we agree that a real disagreement remains. The opponent holds that a correct moral theory must deliver a consistent set of ATC obligations, while the dilemmist holds that a correct moral theory might allow for irresolvable conflicts at the ATC level.

  ---

  **VI. Reasons to Abandon Position**

  Each side specifies what would convince them to change their view:

  - **Dilemmist (D)**: I would abandon my position if it could be shown that the concept of an all-things-considered moral obligation is inherently such that it cannot conflict (e.g., by a compelling argument that moral reasons must be comparable and thus always rankable). Alternatively, if a moral theory that denies dilemmas (e.g., utilitarianism or Kantianism) can be shown to be clearly true and to resolve all apparent dilemmas without remainder (like inescapable moral regret), I would reconsider.

  - **Opponent (O)**: I would abandon my position if a situation were described that I could not resolve without admitting a genuine dilemma, even after considering all possible moral principles and facts. This would require a case where (a) two ATC obligations conflict, (b) they are equally stringent and no tie-breaking principle applies, and (c) the agent is not responsible for creating the conflict. Furthermore, if such a case were accompanied by an argument that moral regret in such cases is not just psychological but reflects a true moral failure, I would reconsider.

  ---
answer: |-
  ### Joint Statement on the Possibility of Genuine Moral Dilemmas  
  **Signed by a Committed Dilemmist (D) and a Committed Opponent (O)**  
  **Date:** October 26, 2023  

  ---

  #### **I. Points of Agreement**  
  We agree on the following:  
  1. **Definition of a genuine dilemma**: A situation where an agent is morally required to do each of two actions, \(A\) and \(B\); cannot do both \(A\) and \(B\) (due to logical, physical, or nomological impossibility); and thus, whatever she does, she will do something morally wrong. This implies inescapable moral failure.  
  2. **Substantive question**: The dispute is metaphysical, not epistemological or psychological. We are asking whether such dilemmas *can exist in reality*, not whether agents *experience* them as dilemmas.  
  3. **What the dispute is not about**:  
     - **Epistemic limitations**: We agree that many "apparent" dilemmas arise from ignorance (e.g., not knowing which promise is weightier) and are resolvable with perfect information. These are not genuine dilemmas.  
     - **Pro tanto obligations**: We agree pro tanto obligations (e.g., prima facie duties) conflict routinely. The issue is whether conflicts persist at the *all-things-considered* (ATC) level.  
     - **Moral distress**: We agree agents often feel regret in conflicts, but this does not entail objective wrongdoing.  
     - **Exceptional cases**: We are not debating dilemmas caused by immorality (e.g., a murderer’s choice to kill one or five). The agent must have non-culpably encountered the conflict.  
  4. **Shared assumptions**: Moral requirements are objective, and "ought" is action-guiding. The dispute is substantive only if both sides accept that a genuine dilemma requires inescapable ATC wrongdoing.  

  ---

  #### **II. Precise Remaining Disagreements**  
  Each side’s position, worded self-acceptably:  
  - **Dilemmist (D)**: There exist possible situations where an agent has two *all-things-considered* (ATC) moral obligations—e.g., she ATC-ought to do \(A\) and ATC-ought to do \(B\)—but cannot do both, so she wrongs someone no matter what she does.  
  - **Opponent (O)**: No such situations exist. Apparent dilemmas are resolvable: one option is ATC obligatory (or obligatory *simpliciter*), while the other is merely pro tanto. Conflicts only arise from misapplied reasoning or ignorance.  

  ---

  #### **III. Cruxes of the Disagreement**  
  We identify three cruxes. For each, we state: (i) the core issue, (ii) an agreed-upon test case or argument, and (iii) each side’s prediction.  

  **Crux 1: Agglomeration**  
  - **Issue**: Does the agglomeration principle (if you ought to do \(A\) and ought to do \(B\), you ought to do both \(A\) and \(B\)) hold for ATC obligations?  
  - **Agreed test case**: *The Broken Promises Scenario*. An agent promises to attend her child’s recital at 3 PM and her best friend’s wedding at 3 PM in a different city. She cannot do both.  
  - **D’s prediction**: Agglomeration fails. The agent ATC-ought to attend the recital (duty to family) *and* ATC-ought to attend the wedding (duty to promise-keeping), but she ought not to do both because it is impossible. Thus, she violates an obligation either way.  
  - **O’s prediction**: Agglomeration holds. The agent only has one ATC obligation (e.g., to attend the recital if family duties override). The other "ought" is pro tanto and overridden. Agglomeration does not apply to ATC oughts, as they are supreme and unified.  

  **Crux 2: ‘Ought Implies Can’ (OIC)**  
  - **Issue**: Does OIC—if you ought to do \(A\), you must be able to do \(A\)—apply to ATC obligations, and does it preclude dilemmas?  
  - **Agreed test case**: *The Accident Victim Scenario*. An agent witnesses two strangers in mortal peril (e.g., drowning in separate lakes). She can save one but not both.  
  - **D’s prediction**: OIC holds for each obligation individually: she *can* save each victim alone, so she ATC-ought to save each. But she cannot save both, so OIC does not resolve the conflict. A dilemma arises.  
  - **O’s prediction**: OIC invalidates alleged dilemmas. If she cannot save both, she cannot have an ATC obligation to save both. Her ATC obligation is to save one (e.g., the nearer victim), and the other "ought" is pro tanto. OIC ensures obligations are always fulfillable.  

  **Crux 3: Interpretation of ‘Ought’**  
  - **Issue**: Is the ‘ought’ in dilemmas ATC or pro tanto?  
  - **Agreed test case**: *The Conflicting Promises Scenario*. An agent promises two friends to help them move houses at the same time, unaware of the conflict. She cannot do both.  
  - **D’s prediction**: Both obligations are ATC because no hierarchy exists (e.g., both friends equally rely on her). She ATC-ought to help each, creating a dilemma.  
  - **O’s prediction**: The ‘ought’ is pro tanto until weighed. After weighing, only one action is ATC obligatory (e.g., help the friend who was promised first). The conflict is resolved.  

  ---

  #### **IV. Minimal Test Case**  
  - **Thin description**: An agent non-culpably faces two actions, \(A\) and \(B\). She is morally required to do \(A\) (e.g., save a life) and morally required to do \(B\) (e.g., save another life), but cannot do both. No other moral factors (e.g., relationships, prior acts) distinguish \(A\) and \(B\).  
    - **D**: Calls this a genuine dilemma. The core requirements are symmetric and inescapable. Extra features (e.g., agent responsibility) might affect blame but not the dilemma’s existence.  
    - **O**: Denies this is a dilemma. The thin case lacks tie-breaking features (e.g., urgency, proximity) that determine the ATC obligation. Without them, the scenario is underspecified and resolvable via default principles (e.g., "save whom you can").  

  **Testing Agent Responsibility**:  
  - **Thin case with added feature**: The agent *culpably* created the conflict (e.g., she recklessly promised two people the same assistance slot).  
    - **D**: Still a dilemma. She has ATC obligations to both promisees. Her prior fault explains *how* she got here but doesn’t erase the current obligations. Wrongdoing is inescapable.  
    - **O**: Not a dilemma. Her ATC obligation is to rectify her fault (e.g., apologize and compensate one party), overriding the pro tanto promises. The conflict dissolves into a single duty.  

  ---

  #### **V. Verbal Disagreement**  
  - **Potential verbal element**: Dispute over the term "ought."  
    - **D** uses "ought" ATC to denote an uncompromised, final obligation.  
    - **O** uses "ought" ATC only for the supreme, override-proof obligation.  
  - **Settling the verbal issue**: If we stipulate that "ATC ought" means *the final, action-guiding obligation after all considerations*, **O** argues this cannot conflict by definition. **D** argues reality can force conflicts even at this level.  
  - **Real disagreement standing**: Yes. Verbal clarity leaves intact the metaphysical dispute: **O** holds that morality *must* be consistent (no ATC conflicts), while **D** holds morality *can* be tragic (ATC conflicts exist).  

  ---

  #### **VI. Reasons to Abandon Position**  
  - **Dilemmist (D)**: I would abandon my position if:  
    (i) A moral theory (e.g., Kantianism or consequentialism) proved universally action-guiding and conflict-free in all possible worlds.  
    (ii) It was shown that ATC obligations logically cannot conflict (e.g., via a proof that agglomeration *must* hold or OIC *entails* resolvability).  
  - **Opponent (O)**: I would abandon my position if:  
    (i) A real-world or thought-experiment case demonstrated inescapable wrongdoing under full information and no culpability.  
    (ii) Moral regret in symmetric conflicts (e.g., the Accident Victim) was shown to reflect objective failure, not just psychological residue.  

  ---  
  **Signed**,  
  *Committed Dilemmist (D)*  
  *Committed Opponent (O)*
