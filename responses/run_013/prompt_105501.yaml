  The key requirements are: no character should be stupid or pressured - everyone reasons correctly; the cascade must be informationally shallow (resting on first two signals); include a character who suspects the truth but stays silent due to social cost; end with ambiguity about whether it's knowledge or mere agreement; never name the phenomenon or cite literature; convey everything through dialogue and action.

