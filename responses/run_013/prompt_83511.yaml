answer: |-
  It sounds like you and your flatmates stumbled into a classic game theory scenario that highlights how individual incentives can lead to collectively bad outcomes, even when everyone is acting rationally. Let me break this down step by step, addressing your questions about what's happening, the name of this problem, and the role of rationality.

  ### What's Really Going On?
  The game you played is a **proportional sharing game** with a fixed pot (here, $300) where each player claims a number of tickets at no cost. The pot is divided proportionally based on the total tickets claimed. Mathematically:
  - Let \(N\) be the number of players (here, 5).
  - Let \(t_i\) be the number of tickets claimed by player \(i\).
  - Total tickets \(T = \sum_{i=1}^N t_i\).
  - Each player's payout is \(\pi_i = \frac{t_i}{T} \times P\), where \(P\) is the pot ($300).

  Jenna is correct that if all players claim the same number of tickets (\(t_i = t\) for all \(i\)), the payout per player is always \(\frac{P}{N} = \$60\), regardless of \(t\). This is because the \(t\) cancels out: \(\pi_i = \frac{t}{N t} \times P = \frac{P}{N}\). So yes, the number is arbitrary in symmetric outcomes—no coordination is needed if everyone does the same thing.

  However, as you experienced, this symmetry is unstable because of individual incentives. Specifically:
  - **If others claim low (e.g., \(t = 1\)), you can gain by claiming more.** Suppose all others claim 1, and you claim 2. Then \(T = 4 \times 1 + 2 = 6\), your payout is \(\frac{2}{6} \times 300 \approx \$100\), while others get \(\frac{1}{6} \times 300 \approx \$50\) each. You gain at their expense.
  - **If others claim high, you must claim high to avoid a tiny payout.** If others claim 40, and you claim 1, \(T = 4 \times 40 + 1 = 161\), your payout is \(\frac{1}{161} \times 300 \approx \$1.86\), while others get about \$74.53 each. By claiming high (e.g., 40), you get \(\frac{40}{161} \times 300 \approx \$74.53\), which is much better for you than claiming low.

  This creates a vicious cycle:
  - Claiming more is always a dominant strategy for an individual, as it increases your payout when others are fixed (or prevents a low payout when others are high).
  - But if everyone does this, all players inflate their claims, leading to a large \(T\) and small payouts for everyone. In your case, claims of 15–40 led to \(T\) around 100–200, so each got about \$3 (\$300 / T\).
  - Crucially, this isn't about greed or cheating—it's rational self-interest. Even if you all agreed to claim \(t=1\), each player has a private incentive to defect and claim more, as you'd get more if others stick to the agreement. Without binding commitment, the agreement collapses.

  This is **not exactly the prisoner's dilemma or tragedy of the commons**, though it shares similarities:
  - **Prisoner's dilemma**: Involves a dominant strategy (defect) that leads to a worse mutual outcome. Here, there's no dominant pure strategy because the best response depends on others' actions, and no pure-strategy Nash equilibrium exists (more on that below).
  - **Tragedy of the commons**: Involves overuse of a shared resource. Here, there's no resource being depleted—the pot is fixed. Instead, it's about over-claiming in a distribution game.

  The core issue is a **coordination failure with multiple symmetric equilibria**. All outcomes where everyone claims the same \(t\) are symmetric Nash equilibria in a broad sense (since no one benefits from changing if all others stay the same), but they are not strict Nash equilibria because:
  - For any finite \(t\), a player can deviate to a higher \(t_i\) and gain if others don't change.
  - With no upper limit on claims, the only "stable" outcome involves infinite claims (undefined payout), but in practice, claims balloon to high numbers.

  ### Is There a Name for This?
  Yes, this is commonly called the **proportional prize contest** or **ratio game**. It's a standard example in game theory to illustrate:
  - **The paradox of Uncoordinated Rationality**: Individual rationality leads to collective poor outcomes.
  - **Claim Inflation**: Players inflate their claims to grab a larger share, neutralizing the benefit and wasting effort (in real-world versions, claiming might have costs).
  - **Multiple Symmetric Equilibria**: Any symmetric claim level is an equilibrium outcome, but only if players coordinate.

  In some contexts, it's nicknamed the "ticket game" or "claiming game." It's often compared to rent-seeking contests (e.g., lobbying for a fixed prize), but without the costs of effort.

  ### The Role of Rationality and Common Knowledge
  You mentioned that the book claimed perfect rationality and common knowledge make this "easier to solve." That might seem backward, but here's the nuance:

  - **Without rationality/common knowledge**: Players might claim arbitrarily (e.g., some low, some high), leading to unpredictable but often poor outcomes. For example, if one player irrationally claims very high, others might follow suit defensively, or low-claimers get crushed. In your case, with no prior coordination, claims varied (15–40), and payouts were low.
    
  - **With perfect rationality and common knowledge**: Players all know everyone is rational and will reason identically. This can make coordination on a low-claim outcome easier through a **focal point** (a Schelling point). For instance:
    - Since all symmetric claims yield the same payout (\(\$60\)), rational players might coordinate on the smallest integer \(t = 1\) as a natural focal point (it's salient, simple, and minimizes "claiming effort" in practice).
    - Common knowledge helps because everyone expects others to choose \(t = 1\) for the same reason, making it self-reinforcing.
    - In theory, this avoids the inflation cycle and achieves the efficient outcome (\(\$60\) each) without communication.

  However, this relies on the focal point being obvious. If players doubt others' rationality (e.g., "What if someone defects?"), or if there's no clear focal point, they may still claim high to protect themselves. That's why you feel it seems backward—in practice, rationality alone isn't enough without trust or a coordination mechanism.

  In your flatmate scenario:
  - Perfect rationality could have led to all claiming \(t = 1\) for \$60 each, using \(t = 1\) as a focal point.
  - But without strong common knowledge (or with misremembered rules), you ended up in the inflated-claim outcome. Rationality made the high-claim temptation salient, and without coordination, it dominated.

  ### Key Takeaways
  - **The problem**: Proportional sharing games have unstable symmetric equilibria due to individual incentives to over-claim. This leads to "claim inflation" and low payouts.
  - **Why it happened**: You all fell into a rational but uncoordinated trap—each trying to claim more to gain an edge or avoid being left behind.
  - **How to "solve" it**: Coordination is key. If you replay this, agree on a fixed \(t\) (e.g., \(t = 1\)) and commit to it (e.g., write numbers simultaneously). With rationality and a focal point, it's easier; without, it fails.
  - **Broader lesson**: This illustrates why mechanisms like voting, binding agreements, or external enforcement are needed in real-world resource sharing.

  So, both you and the book are partially right: Rationality + common knowledge can enable focal-point coordination for a good outcome, but it's fragile and can just as easily lead to the bad outcome if incentives aren't aligned. If you have more details about the book, I can help identify the specific game!
