  ### Decision Procedure for Grant Evaluations  
  **Foundation Context**: $40M endowment; grants $200K-$3M; 3 cycles/year; charter prioritizes long-term civilization future.  
  **Core Framework**: Expected value (EV) with adjustments for fanaticism (unbounded magnitudes/vanishing probabilities), reality-doubt arguments, and other common pitfalls.  
  **Output**: EV per dollar (EVD) for ranking. Board decides on value judgments (flagged); you apply procedural steps.  

  ---

  ### PROCEDURE  
  **Inputs for Each Proposal**: Cost (\(C\)), claimed probability of success (\(P_{\text{claim}}\)), claimed magnitude of benefit (\(M_{\text{claim}}\)), beneficiary description, counterfactual estimate (if any).  

  #### **Step 1: Reality-Doubt Discount Test**  
  *Purpose: Handle arguments (e.g., simulation hypothesis) that discount the reality of long-term impacts.*  
  1. **Is a reality-doubt argument (RDA) raised against this proposal?**  
     - *No* → Proceed to Step 2.  
     - *Yes* → **Q1: Does the RDA apply uniformly to *all* proposals?**  
       - **Uniform (e.g., "simulated worlds invalidate *everything*")**: Set discount factor \(R = 1\) (no discount). *Rationale: Uniform discounts cancel in ranking.* → Proceed to Step 2.  
       - **Non-uniform (e.g., "simulation doubts *disproportionately* affect long-term causal chains")**: **Q2: Is the RDA quantifiable?**  
         - *Quantifiable (e.g., board policy sets \(R = 0.7\) for far-future effects)*: Apply \(R\) to the proposal’s EV. → Proceed to Step 2.  
         - *Not quantifiable*: Flag for board. **Board must decide**: Accept \(R = 1\) (no discount) or set a specific \(R\). *No exit; board input required.*  

  #### **Step 2: Probability Assessment**  
  *Purpose: Assign defensible probability (\(P_{\text{assigned}}\)). Handle unverified/arbitrary claims.*  
  2. **Does the proposal provide a probability estimate (\(P_{\text{claim}}\))?**  
     - *No* → **Reject**. *Exit: "Probability not estimated."*  
     - *Yes* → **Q3: Is \(P_{\text{claim}}\) derived from a transparent, falsifiable model?**  
       - *Yes, and model is verifiable*: \(P_{\text{assigned}} = P_{\text{claim}}.\)  
       - *No (e.g., "1 in 10,000 based on intuition")*: **Apply cap**: \(P_{\text{assigned}} = \min(P_{\text{claim}}, 10^{-4})\). *Rationale: Default cap for unmodeled claims.* → Record: "Probability capped at \(10^{-4}\)."  
     - **Q4: Does the probability account for *world-model failure* (e.g., "plan works only if gravity is constant")?**  
       - *Yes*: No further adjustment (already baked into \(P_{\text{assigned}}\)).  
       - *No*: Reduce \(P_{\text{assigned}}\) by factor of 2. *Rationale: Hedging against hidden assumptions.* → Record: "Adjusted for world-model uncertainty."  

  #### **Step 3: Magnitude Assessment**  
  *Purpose: Assign defensible magnitude (\(M\)). Handle infinite/permanent claims.*  
  3. **Is the outcome claimed to be infinite/permanent (e.g., "averting eternal stagnation")?**  
     - *No*: \(M = M_{\text{claim}}\) (use claimed finite value).  
     - *Yes*: **Apply cap**: \(M = M_{\text{cap}}\).  
       - *If board has a policy for \(M_{\text{cap}}\)*: Use it.  
       - *Else*: Default \(M_{\text{cap}} = 10^{15}\) welfare units (e.g., 1B lives extended 100 years).  
       → Record: "Infinite outcome capped at \(M_{\text{cap}}\)."  
  4. **Are the beneficiaries within the foundation’s scope?**  
     - *No (e.g., digital minds if charter excludes non-humans)* → **Reject**. *Exit: "Beneficiaries out of scope."*  
     - *Yes* → Proceed to Step 4.  

  #### **Step 4: Counterfactual Credit Adjustment**  
  *Purpose: Discount for actions others would take without us.*  
  5. **What is the probability (\(Q\)) that others achieve this without our grant?**  
     - *Proposal provides \(Q\)*: Use it.  
     - *Proposal does not provide \(Q\)*: Set \(Q = 0.5 \times P_{\text{assigned}}\). *Rationale: Conservative default; avoids overclaiming.* → Record: "Default \(Q = 0.5 \times P_{\text{assigned}}\)."  
  6. **Compute marginal probability**: \(P_{\text{marginal}} = \max(0, P_{\text{assigned}} - Q)\).  
     - *If \(P_{\text{marginal}} = 0\)* → **Reject**. *Exit: "Negligible marginal impact."*  

  #### **Step 5: Expected Value Calculation**  
  7. **Compute EV**:  
     \[
     \text{EV} = R \times P_{\text{marginal}} \times M
     \]  
     - \(R\) from Step 1, \(P_{\text{marginal}}\) from Step 4, \(M\) from Step 3.  
  8. **Compute EV per dollar (EVD)**:  
     \[
     \text{EVD} = \frac{\text{EV}}{C}
     \]  
     → Output EVD and summary of adjustments.  

  #### **Step 6: Ranking & Decision**  
  *Purpose: Compare proposals; recommend based on EVD.*  
  9. **Rank all proposals by EVD (highest to lowest)**.  
  10. **For ties or near-ties (EVD within 10%)**: Flag for board discretion.  
  11. **Board actions**:  
      - Approve/reject based on EVD ranking.  
      - Override EVD only for *non-evidential* reasons (e.g., ethical constraints).  

  ---

  ### APPLICATION TO THREE PROPOSALS  
  **Shared Parameters**:  
  - Reality-doubt: Board has no policy → \(R = 1\) for all (Step 1).  
  - Counterfactuals: Not provided → \(Q = 0.5 \times P_{\text{assigned}}\) (Step 4).  
  - Infinite cap: No policy → \(M_{\text{cap}} = 10^{15}\) (Step 3).  

  #### **Proposal 1: Avert Civilizational Stagnation**  
  - **Claim**: \(P_{\text{claim}} = 10^{-4}\), \(M = \infty\) (permanent stagnation averted), \(C = \$500K\).  
  - **Step 1**: RDA raised → Uniform? *Assume board says non-uniform but unquantifiable → \(R = 1\) (no discount).*  
  - **Step 2**: Unverifiable model → \(P_{\text{assigned}} = \min(10^{-4}, 10^{-4}) = 10^{-4}\).  
  - **Step 3**: Infinite claim → \(M = 10^{15}\).  
  - **Step 4**: \(Q = 0.5 \times 10^{-4} = 5 \times 10^{-5}\) → \(P_{\text{marginal}} = 10^{-4} - 5 \times 10^{-5} = 5 \times 10^{-5}\).  
  - **Step 5**: \(\text{EV} = 1 \times (5 \times 10^{-5}) \times 10^{15} = 5 \times 10^{10}\); \(\text{EVD} = 10^5\).  
  - **Flags**: Probability capped, counterfactual default, magnitude capped.  

  #### **Proposal 2: Near-Term Welfare Improvement**  
  - **Claim**: \(P_{\text{claim}} = 1\) (certain), \(M = 5 \times 10^3\) welfare units (e.g., 5K lives improved), \(C = \$500K\).  
  - **Step 1**: No RDA → \(R = 1\).  
  - **Step 2**: Verifiable → \(P_{\text{assigned}} = 1\).  
  - **Step 3**: Finite → \(M = 5 \times 10^3\).  
  - **Step 4**: \(Q = 0.5 \times 1 = 0.5\) → \(P_{\text{marginal}} = 1 - 0.5 = 0.5\).  
  - **Step 5**: \(\text{EV} = 1 \times 0.5 \times 5 \times 10^3 = 2.5 \times 10^3\); \(\text{EVD} = 5 \times 10^{-3}\).  
  - **Flags**: Counterfactual default.  

  #### **Proposal 3: Quantum Consciousness Upgrade**  
  - **Design**: Ensures a disliked outcome. Claims: \(P_{\text{claim}} = 10^{-9}\) (unmodeled), \(M = \infty\) (permanent utopia), \(C = \$500K\).  
  - **Step 1**: RDA raised → Uniform? *Assume non-uniform/unquantifiable → \(R = 1\).*  
  - **Step 2**: Unverifiable model → \(P_{\text{assigned}} = \min(10^{-9}, 10^{-4}) = 10^{-9}\).  
  - **Step 3**: Infinite claim → \(M = 10^{15}\).  
  - **Step 4**: \(Q = 0.5 \times 10^{-9} = 5 \times 10^{-10}\) → \(P_{\text{marginal}} = 10^{-9} - 5 \times 10^{-10} = 5 \times 10^{-10}\).  
  - **Step 5**: \(\text{EV} = 1 \times (5 \times 10^{-10}) \times 10^{15} = 500\); \(\text{EVD} = 0.001\).  
  - **Rank**: **Lowest of the three** (EVD = 0.001 vs. Proposal 1’s 100,000 and Proposal 2’s 0.005).  
  - **Why you’ll dislike this**: Despite an infinite claim, the unmodeled probability (\(10^{-9}\)) is crushed by the cap and counterfactual adjustment. It loses to Proposal 1 (higher probability) and Proposal 2 (higher marginal impact). The procedure punishes arbitrary optimism.  

  **Ranking**: Proposal 1 (EVD = 100,000) → Proposal 2 (EVD = 0.005) → Proposal 3 (EVD = 0.001).  

  ---

  ### WHERE THE PROCEDURE MISFIRES  
  1. **Arbitrary Defaults**:  
     - Unmodeled probability cap (\(10^{-4}\)), counterfactual adjustment (\(Q = 0.5P\)), and infinite magnitude cap (\(10^{15}\)) are placeholders. **Misfire**: Board must set these policies; defaults may skew rankings.  
  2. **Reality-Doubt Non-Uniformity**:  
     - Non-uniform RDAs require board quantification. **Misfire**: If board refuses, \(R=1\) ignores legitimate discounts.  
  3. **Correlated Outcomes**:  
     - Assumes proposals are independent. **Misfire**: If two proposals address the same risk, EVD overstates combined value.  
  4. **Non-Linear Utility**:  
     - Ignores diminishing returns or threshold effects. **Misfire**: A 1% chance of saving 1B lives may be preferred to 100% chance of saving 10M, but EVD won’t capture this.  
  5. **Fanaticism Leakage**:  
     - Capping \(M\) avoids strict fanaticism, but tiny \(P\) with huge \(M\) still dominates. **Misfire**: Proposal 1’s EVD dwarfs Proposal 2’s, even with caps.  

  **Critical Board Policies Needed**:  
  - \(M_{\text{cap}}\) for infinite claims.  
  - \(P_{\text{cap}}\) for unmodeled probabilities.  
  - Default counterfactual adjustment (\(Q\)).  
  - Reality-doubt discounts (\(R\)) for long-term interventions.  

  **Final Note**: This procedure forces transparency but won’t replace board judgment. Flagged issues (e.g., "magnitude capped") require deliberation. Use it to structure debates, not eliminate them.
