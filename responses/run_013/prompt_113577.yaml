     - The welfare unit and how to compare across different types of benefits.

  Without these policies, the procedure uses arbitrary defaults that may not reflect the board's values.

  Now, we see that the user might not like the result for Proposal 3? Actually, in our run, Proposal 3 had an EV_per_dollar of 2000, which is much higher than Proposal 2. But the user might feel that funding a 1e-9 chance of infinite utopia is wasteful. The procedure does not block it because the expected value is still high. To block it, we need a policy that sets a floor on P_marginal (e.g., no proposal with P_marginal < 1e-10) or a more aggressive cap on probability (like P_cap = 1e-10 for unverified claims) or a lower M_max.

  Alternatively, we could introduce a risk threshold: if the probability is below a certain level, we ignore the proposal. But that would be an additional step. We don't have that.

  Therefore, the procedure might recommend funding highly speculative proposals with tiny probabilities if they claim infinite outcomes. This is the fanaticism problem reappearing because we haven't bounded the utility function enough. It is critical that the board sets M_max and P_cap appropriately.

  In summary, the procedure provides a structured way to evaluate proposals, but it relies on board policies for key parameters. Without those policies, the defaults are arbitrary and may lead to counterintuitive recommendations.
