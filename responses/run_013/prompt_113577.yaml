  Procedure for Evaluating a Grant Proposal

  0. Preprocessing:
     - Extract: 
          Cost (C)
          Claimed probability of success (P_claim)
          Claimed magnitude of benefit (M_claim)
          Any reality-doubt argument raised? (Note it)
