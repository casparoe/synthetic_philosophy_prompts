  In "what would change my mind," I'll flag the possibility that "preference" isn't a unified concept - their three purposes might require distinct constructs. That's the hidden tension in their ethics board work: are they measuring choices, values, or welfare? The answer determines whether their brother "chose wrong" or was compelled by pathology they must accommodate in policy.

