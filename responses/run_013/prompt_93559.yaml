  Key challenges emerge: The theory must simultaneously respect actual choices while allowing that choices can be "mistaken." Must handle irrationality without collapsing normative/prescriptive distinctions. Must quantify utility for policy while accepting that preferences might be incoherent. The non-negotiable vs negotiable classification will be crucial - they're signaling openness to tradeoffs but need clear boundaries.

