answer: |-
  Here's a map of the distinct theses behind "there is no such thing as a just war," graded for defensibility, commitments, and implications—tailored to your intervention debate and your friend's conversational shutdown:

  ### 1. **Semantic Claim (Trivial but Misleading)**  
     - **Thesis**: "War" is *defined* as unjust violence; "just war" is an oxymoron.  
     - **Defensibility**: **Trivial** (logically coherent but ignores how language functions).  
     - **Commits to**: Redefining "war" to exclude any conceivable moral justification.  
     - **Rules out**: Using "just war" as a meaningful category. Doesn't engage with practical ethics.  
     - **Fit for shutdown**: Unlikely—this is pedantic and wouldn't end substantive debate about interventions.  

  ### 2. **Intentionalist Claim (Substantive but Weak)**  
     - **Thesis**: War *necessarily* involves unjust intentions (e.g., aggression, dehumanization).  
     - **Defensibility**: **False** (history shows wars motivated by communal defense).  
     - **Commits to**: Denying that self-defense or genocide prevention can ever be primary motives.  
     - **Rules out**: Humanitarian interventions *in principle*, even to stop massacres.  
     - **Fit for shutdown**: Possible—if your friend thinks all war-makers are inherently corrupt, intervention debates seem naïve.  

  ### 3. **Moral Equality Claim (Substantive and Contested)**  
     - **Thesis**: Combatants on all sides are equally morally tainted by fighting, regardless of cause.  
     - **Defensibility**: **Defensible but controversial** (e.g., Walzer vs. McMahan debates).  
     - **Commits to**: Seeing soldiers as victims/agents of violence, not bearers of just cause.  
     - **Rules out**: Assigning greater blame to aggressors; "clean" moral distinctions between sides.  
     - **Fit for shutdown**: Likely—if all fighters are equally guilty, discussing "just interventions" feels pointless.  

  ### 4. **Anti-Just-War-Theory Claim (Strategic/Political)**  
     - **Thesis**: Just War Theory (JWT) *enables* violence by providing a false moral license.  
     - **Defensibility**: **Defensible** (JWT criteria are often abused to sanitize wars).  
     - **Commits to**: Rejecting JWT as ideological cover for militarism.  
     - **Rules out**: Using JWT to evaluate *any* war, including interventions. Focuses on real-world misuse.  
     - **Fit for shutdown**: **Strong fit**—Your friend may see intervention debates as legitimizing empire ("Responsibility to Protect" used for regime change).  

  ### 5. **Absolute Pacifism (Radical but Coherent)**  
     - **Thesis**: All killing is intrinsically immoral; no violence can be justified.  
     - **Defensibility**: **Defensible if grounded** (e.g., in sanctity-of-life ethics).  
     - **Commits to**: Total nonviolence, even in self-defense or genocide prevention.  
     - **Rules out**: **Armed intervention categorically**, regardless of stakes.  
     - **Fit for shutdown**: **Best fit**—Closes debate by treating "just intervention" as incoherent.  

  ### 6. **Contingent Pacifism (Pragmatic)**  
     - **Thesis**: Wars *in practice* always cause disproportionate harm/corruption, so none are justifiable.  
     - **Defensibility**: **Strong empirically** (e.g., civilian casualties, escalation risks).  
     - **Commits to**: Demanding impossible certainty of net good outcomes.  
     - **Rules out**: **Real-world interventions** (even against massacres) due to inevitable collateral damage/blowback.  
     - **Fit for shutdown**: Likely—Emphasizes the hopelessness of "clean" interventions.  

  ### 7. **Strategic Nonviolence Claim (Moral-Political Hybrid)**  
     - **Thesis**: Calling any war "just" paralyzes nonviolent alternatives and normalizes violence.  
     - **Defensibility**: **Defensible** (e.g., evidence that nonviolence works better long-term).  
     - **Commits to**: Investing solely in diplomatic/economic pressure, aid, and grassroots resistance.  
     - **Rules out**: **Military solutions as counterproductive**, even to stop massacres.  
     - **Fit for shutdown**: **Very strong fit**—Shifts focus from ethics to efficacy, rejecting the intervention framework entirely.  

  ---

  ### What Your Friend Likely Meant (Based on Shutting Down Intervention Debate):  
  - **Top candidates**: **#5 (Absolute Pacifism)** or **#7 (Strategic Nonviolence)**.  
    - Absolute Pacifism (#5) makes intervention debates morally obscene.  
    - Strategic Nonviolence (#7) treats military intervention as a distraction from effective action.  
  - **Why?** Both cut the conversation dead: #5 denies the *possibility* of ethical violence; #7 denies its *utility*.  

  ### What You Should Press Him On:  
  **Press #7 (Strategic Nonviolence)**:  
    - *Ask*: "Are you saying military force *never* stops massacres faster than nonviolence? What about Rwanda or Kosovo? If we could have stopped Auschwitz with force, should we have?"  
    - *Why*: Forces engagement with real-world trade-offs. If he concedes that extreme cases *might* justify force, you expose a threshold for violence. If he denies historical cases, you reveal radicalism.  

  **If he leans #4 (Anti-JWT)**:  
    - *Ask*: "Does rejecting Just War Theory mean we *ignore* moral constraints in war? Or just that we shouldn’t *call* wars just?"  
    - *Why*: Unlocks whether his concern is linguistic hypocrisy or actual consequences.  

  ---

  **Key Insight**: Your friend’s shutdown suggests he sees intervention debates as *inherently dangerous*—not just wrong. Your best path is to ask: **"Is armed force to stop a massacre *always* immoral, or *always* counterproductive?"** This forces him to choose between moral absolutism (#5) and pragmatic skepticism (#6/#7). From there, debate concrete alternatives (e.g., "What should we *do* about Darfur?").
