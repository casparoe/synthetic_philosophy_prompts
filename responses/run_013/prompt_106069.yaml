prompt: |-
  I'm in a reading group on social explanation, and a classmate has worked up an argument that I cannot decide whether to admire or to throw out. It is supposed to show that methodological individualism is not merely one option among others but the only option that is even intelligible, and he thinks it does this by exposing the holist's talk of institutions, structures, and markets as either shorthand or superstition. The trouble is that when I follow it out it seems to prove far more than he wants: it appears to show that there are no genuine explanations anywhere above fundamental physics, so that biology, psychology, and economics alike are at best bookkeeping devices that describe patterns without explaining anything. He is untroubled; I am not. The argument runs as follows. (1) Every event, social or otherwise, consists in some change in the states or properties of individual things; there is nothing else for it to consist in. (2) To explain an event is to cite what brought it about, which is to say, to cite the causes of the change it consists in. (3) Therefore any adequate explanation of a social event must ultimately cite facts about individuals. (4) If an explanation cites a fact that is not itself a fact about individuals — that an institution required it, that a structure produced it, that a market cleared, that a norm spread — then either that fact is a fact about individuals in disguise or it is not a fact at all. (5) But there are social explanations we cannot paraphrase into individual terms without losing precisely what explains: for instance, explaining why a currency lost its value, or why a rumour outran its correction, by citing features of a network or a distribution of beliefs that no individual intended and that no individual-level description captures. (6) Therefore such explanations either are not genuine explanations or cite facts that do not exist. (7) But they are genuine explanations — the currency really did lose its value for that reason. (8) So one of (1), (2), or (4) must be false.

  He reads (8) as a proof that individualism must give way to holism; I notice that the same machinery would just as well show that a cell biologist who explains a division by citing the cell cycle, or a psychologist who explains a choice by citing a preference, is trading in non-facts, and that cannot be right. He also insists that any legitimate social explanation has the shape of a little diagram — a macro condition, the individual dispositions it produces, the individual actions that follow, and then the aggregate outcome — and treats any explanation that skips a stage as incomplete by definition. I suspect the damage is done somewhere in the passage from what things are made of to what explains them, and possibly again in that either/or in (4), but I cannot say which step is the culprit or why it looked so innocent. I would rather keep (5) and (7) than surrender them, and I am willing to give up (1) if I must, though I want to know what that costs.

  Tell me which step or inference to reject, and be specific about the mechanism of the failure — whether it is an equivocation, a scope or quantifier slide, or a premise that is simply too strong. Then explain why the offending step looked fine, and price the alternatives: if I give it up, what do I owe the individualist, what do I owe the holist, and what, if anything, must I now say about explanation in the special sciences generally? Assume I have no library at hand; argue from the content of the steps rather than sending me to the literature.
reasoning: |-
  Okay, the user is dealing with a complex philosophical argument about methodological individualism versus holism in social explanation. Their classmate's argument claims that only individual-level explanations are valid, but the user realizes this logic would invalidate all higher-level sciences like biology or psychology. The user wants to identify which step fails and why, without relying on external literature.

  First, I need to parse the argument carefully. Premise (1) states that all events are changes in individual things - that seems solid from a physicalist perspective. Premise (2) defines explanation as citing causes - also reasonable. But the conclusion in (3) that explanations must cite individual facts already feels like a leap. 

  The critical failure happens at step (4) with its false dichotomy: either social facts reduce to individual facts or they don't exist. This ignores emergent properties and causal autonomy at higher levels. When a currency devalues due to network effects, that's real causation even if not reducible to single individuals. 

  I notice the user's intuition about cell biology is spot-on - rejecting (4) preserves explanatory power across sciences. The "little diagram" requirement oversimplifies how explanations work; sometimes macro patterns explain better than micro mechanisms. 

  The key is recognizing that composition doesn't dictate causation. Just as water's wetness isn't found in single H2O molecules, social phenomena can have irreducible causal powers. Giving up (4) costs nothing to individualism's core insights while saving holistic explanations. 

  The user seems philosophically sophisticated but anxious about implications. They need confirmation that preserving (5) and (7) won't require abandoning physicalism. I should emphasize that rejecting (4) still respects (1)-(3) - events are physical, but their organization creates new causal layers.
answer: |-
  The fatal flaw is in **step (4)** and its deployment in the argument. It commits a **fallacy of false dichotomy** combined with a **category error about causation and explanation**. Here's the breakdown:

  ### Why Step (4) Fails
  1. **The False Dichotomy**:  
     Step (4) claims:  
     > *"If an explanation cites a fact that is not itself a fact about individuals [...] then either that fact is a fact about individuals in disguise or it is not a fact at all."*  
     
     This ignores a third possibility: **higher-level facts can be real, causally efficacious properties of complex systems**, even if they are *composed* of individuals. The error is conflating *ontological dependence* (social facts are made of individuals) with *explanatory reduction* (social facts must be replaced by individual facts in explanations).  

  2. **The Category Error**:  
     Step (4) assumes that because social events *consist in* individual states (per step 1), the *causes* of those events must *only* be individual states. But causation can operate at multiple levels:  
     - **Example in biology**: A cell divides because it entered the mitosis phase of the cell cycle. "Mitosis" is a system-level property: no single molecule in the cell contains "mitosis," yet it causes division. Paraphrasing mitosis *only* into atomic-level facts destroys the explanatory power.  
     - **Social parallel**: A bank run occurs because of falling confidence in the financial system. "Systemic confidence" is a network-level property: no single individual holds "systemic confidence," yet it causes the bank run.  

  ### Why the Other Steps *Seem* Innocent
  - **Step (1)**: True but trivial. Social events supervene on individuals—but this doesn’t imply that all explanations must "bottom out" in individual terms.  
  - **Step (2)**: Plausible. Explanation involves causation.  
  - **Step (3)**: Follows from (1) and (2) *if* you accept a reductionist view of causation. But (3) is invalidated by rejecting (4).  
  - **Steps (5)–(8)**: Correctly identify the tension but misdiagnose the culprit.  

  ### The Mechanism of the Failure: "Nothing Over and Above" ≠ "Reducible Without Loss"
  Step (4) exploits an ambiguity in "consists in" (from step 1):  
  - **Ontological claim** (harmless): Social facts are constituted by individual facts.  
  - **Explanatory claim** (false): Social facts are *nothing more than* aggregates of individual facts, so individual facts exhaust their causal power.  

  This ignores **emergent causal properties**. When individuals interact in structured systems (e.g., networks, markets), they generate system-level behaviors that:  
  - Constrain individual actions (e.g., market forces limit your job choices).  
  - Have causal powers irreducible to individuals (e.g., a rumor spreads *because* of network topology).  

  ---

  ### What You Owe to Each Side
  | **Position** | **What You Concede** | **What You Deny** |
  |--------------|----------------------|-------------------|
  | **Individualist** | Social events ontologically depend on individuals. Explanations must be consistent with individual-level mechanisms. | That social explanations are "incomplete" or "non-genuine" if they cite irreducible higher-level causes. |
  | **Holist** | Some social explanations require irreducibly macro-level concepts (e.g., institutions, networks). | That social forces exist independently of individuals (no "group minds"). |

  ---

  ### Implications for the Special Sciences
  Rejecting step (4) saves biology, psychology, and economics:  
  1. **Biology**: Explaining "why the heart pumps blood" by citing its *function* (circulation) is valid. You needn’t reduce it to quantum physics.  
  2. **Psychology**: Explaining "why Alice quit her job" by citing her *values* is valid. You needn’t reduce it to neural spikes.  
  3. **Economics**: Explaining inflation by citing *monetary policy* is valid. You needn’t reduce it to individual spending habits.  

  **Why?** Higher-level properties (e.g., "monetary policy," "cell cycle") are:  
  - **Causally efficacious**: They make a difference to outcomes.  
  - **Explanatorily autonomous**: They capture patterns invisible at lower levels.  
  - **Physically grounded**: They don’t violate step (1)—they’re still composed of individuals/particles.  

  ---

  ### Your Suspicion Was Correct
  The damage is in **the inference from composition to causation** (steps 1 → 4). The classmate’s "little diagram" (macro → dispositions → actions → outcome) is *one valid form* of explanation, but **not the only form**. Skipping steps isn't "incomplete"—it’s often *explanatorily essential*. For example:  
  - "Why did the bridge collapse?" → "Because its load exceeded its structural capacity."  
    You don’t need to cite every atom in the bridge; the macro-property *explains directly*.  
  - "Why did the currency collapse?" → "Because hyperinflation eroded trust."  
    The network-level property *explains directly*.  

  ### The Cost of Giving Up Step (1)
  You don’t need to. Step (1) is fine if you reject its misuse in step (4). Abandoning (1) would require believing in spooky "social substances" detached from individuals—a price *no one* should pay.  

  ### In Short
  Reject **step (4)**. Replace it with:  
  > *"If an explanation cites a macro-level fact, it may be a genuine causal explanation if:  
  > (a) the macro-property is robustly real (e.g., it constrains behavior),  
  > (b) it supervenes on individual facts, and  
  > (c) citing it conveys information not efficiently captured by individual-level details."*  

  This rescues social science, biology, and psychology without sacrificing physicalism or intelligibility.
