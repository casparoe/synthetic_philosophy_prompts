  ### Structured Approach for Committee Probability Updates

  As an expert in Bayesian epistemology and protocol design, I'll first outline the core theoretical requirements and practical choices, then provide a step-by-step procedure. The goal is a method that (1) respects Bayesian coherence, (2) works in 20-minute windows, (3) requires no probability expertise, and (4) explicitly flags where judgment must take over.

  ---

  ### Part 1: Theoretical Brainstorm
  **What Bayesian theory requires:**
  1. **Distinguish evidence from observation**:  
     - *Observation*: What we directly encounter (e.g., "Alice says she's 70% confident," "a preprint reports p=0.04").  
     - *Evidence*: The event in the world we *infer* from the observation (e.g., "the analysis is reliable," "the study's conclusion is true").  
     Updating must happen on the *evidence proposition*, not the observation. This avoids double-counting and ensures probabilistic coherence.

  2. **Rigidity (Jeffrey conditionalization)**:  
     When observation doesn't reveal evidence with certainty, your posterior probability for the hypothesis *given the evidence* must match your prior assessment (i.e., \(P_{\text{new}}(H|E) = P_{\text{old}}(H|E)\)). Violating this leads to incoherence.

  3. **Partition dependence**:  
     Evidence must be part of a mutually exclusive, exhaustive set of possibilities (e.g., {E: "the leak is truthful", ¬E: "the leak is false"}). The partition must be agreed upon *before* updating.

  **Where choices lie:**
  - **Evidence granularity**: Binary (true/false) vs. scaled (e.g., confidence levels). Binary is simpler for committees; scaled requires more structure.
  - **Handling reports**: Treat as direct evidence vs. noisy signals. Noisy signals are more accurate but require likelihood estimation, which is time-consuming.
  - **Aggregation**: Averaging likelihoods vs. averaging posteriors. Only likelihood averaging is coherent under shared priors; posterior averaging guarantees incoherence over time.

  **Practical constraints:**
  - **Time**: Cannot build full probability models. Need quick heuristics that approximate Bayesian updating.
  - **Expertise**: Members lack probability training. Questions must be intuitive (e.g., "How convincing is this?" not "Define the likelihood function").

  ---

  ### Part 2: The Procedure
  **Core protocol for each evidence item:**  
  *(Repeat for each agenda item; 15-20 minutes total)*

  #### Step 1: Define the Evidence Partition (2–3 min)  
  - **Chair's question**:  
    *"What is the single yes/no question about the world that this evidence speaks to? Example: 'Is the leaked report truthful?' or 'Is the preprint's conclusion correct?'"*  
  - **Sufficient answer**:  
    A binary proposition (E/¬E) that is:  
    - (a) **Testable** (e.g., "The colleague's analysis is correct" ✓; "The leak is important" ✗).  
    - (b) **Relevant** to the hypothesis (H) the committee assesses.  
  - **Judgment call**: If the committee cannot agree on E, skip formal updating and move to unstructured debate. The theory requires a partition.

  #### Step 2: Assess Reliability of the Evidence (5 min)  
  - **Chair's question**:  
    *"Assuming our current knowledge, how likely is E to be true based *only* on this new observation? Give a number from 0% to 100%."*  
    *(Clarify: "This is *not* about H yet—only whether the evidence itself is reliable.")*  
  - **Sufficient answer**:  
    Each member gives a percentage (q). Take the **median** as the committee's \(P_{\text{new}}(E)\).  
  - **Theory note**: This is Jeffrey's \(P_{\text{new}}(E)\). It quantifies uncertainty about the evidence.

  #### Step 3: Assess Impact if Evidence Were Certain (5 min)  
  - **Chair's question 1**:  
    *"If we *knew* E was definitely true, what would be our probability for H?"*  
  - **Chair's question 2**:  
    *"If we *knew* E was definitely false, what would be our probability for H?"*  
  - **Sufficient answer**:  
    Each member gives two percentages: \(P(H|E)\) and \(P(H|¬E)\). Take **medians** for both.  
  - **Theory note**: This enforces rigidity. The values must reflect *current* knowledge excluding the new observation.

  #### Step 4: Update the Probability (1 min)  
  - **Computation**:  
    \(P_{\text{new}}(H) = \left[P(H|E) \times P_{\text{new}}(E)\right] + \left[P(H|¬E) \times (1 - P_{\text{new}}(E))\right]\)  
  - **Plain English**:  
    "Blend the two hypothetical probabilities (if E were true/false), weighted by how likely E is."  
  - **Theory note**: This is Jeffrey conditionalization. It is coherent if rigidity holds.

  #### Step 5: Record and Move On (2 min)  
  - Document:  
    - The partition (E/¬E),  
    - \(P_{\text{new}}(E)\),  
    - \(P(H|E)\), \(P(H|¬E)\),  
    - \(P_{\text{new}}(H)\).  
  - **Critical**: Log the underlying evidence source (e.g., "Dataset X from Study Y") to prevent double-counting later.

  ---

  ### Special Cases & Adjustments
  #### Case A: Input is a Stated Credence (e.g., "70% confident")  
  - **Protocol**:  
    - Treat the statement as an observation.  
    - Define E: "The colleague's confidence is well-calibrated for this context."  
    - In Step 2, assess \(P_{\text{new}}(E)\) (e.g., "How likely is it that their 70% is accurate?").  
    - In Step 3, assume \(P(H|E) = 70\%\) and \(P(H|¬E) = P_{\text{old}}(H)\) (if you distrust them, revert to your prior).  
  - **Why this works**: You update on the *reliability of their judgment*, not directly on H. Avoids treating "70%" as a fact.

  #### Case B: Two Reports of the Same Evidence  
  - **Protocol**:  
    - Identify if reports derive from the same source (e.g., two summaries of Dataset X).  
    - If yes, **update only once** using the most informative report.  
    - If reports are independent (e.g., two independent analyses of Dataset X), define E: "Dataset X supports H." Then:  
      - In Step 2, assess \(P_{\text{new}}(E)\) *using both reports*.  
      - Skip Step 3 (impact is unchanged).  
  - **Theory note**: Prevents double-counting by fixing the evidence partition to the dataset, not the reports.

  #### Case C: Statistical Reports (e.g., p-values)  
  - **Protocol**:  
    - Define E: "The study’s conclusion is correct."  
    - In Step 2, map the p-value to \(P_{\text{new}}(E)\) using:  
      ```  
      p < 0.01 → 85%  
      p < 0.05 → 70%  
      p > 0.05 → 30%  
      ```  
      Adjust for study quality (e.g., small sample → subtract 15%).  
    - In Step 3, estimate \(P(H|E)\) and \(P(H|¬E)\) based on how directly the study tests H.  
  - **Why not Bayes factors**: They require likelihoods, which are too technical for quick assessment. This approximates a "Bayesianized" p-value.

  ---

  ### Where Judgment Takes Over (The Theory Stops)  
  The procedure **cannot** handle:  
  1. **Non-partitioned evidence**:  
     - If E cannot be binarized (e.g., "The leak’s motivation is political"), defer to unstructured discussion.  
  2. **Burden of error**:  
     - When stakes are asymmetric (e.g., false positives vs. false negatives), the committee must decide *values*, not probabilities. Flag: "This is a value judgment—should we weight errors differently?"  
  3. **Heterogeneous priors**:  
     - If members irreconcilably disagree on \(P(H|E)\) or \(P(H|¬E)\), average the inputs but note: *this is not strictly Bayesian*. Coherence assumes shared priors.  
  4. **Evidence outside the model**:  
     - If new data challenges your partition (e.g., E no longer covers all possibilities), stop and redefine the partition.  

  ---

  ### Case Simulations  
  **Case 1: "70% Confident" Summary**  
  - **Observation**: Member reports colleague is "70% confident" in conclusion X.  
  - **Step 1 (Partition)**: E = "The colleague’s confidence is well-calibrated."  
  - **Step 2 (Reliability)**: Committee median \(P_{\text{new}}(E) = 60\%\) (trust but verify).  
  - **Step 3 (Impact)**:  
    \(P(H|E) = 70\%\) (if they’re calibrated, adopt their view),  
    \(P(H|¬E) = 50\%\) (if not, revert to current prior).  
  - **Step 4 (Update)**:  
    \(P_{\text{new}}(H) = (70\% \times 60\%) + (50\% \times 40\%) = 62\%\).  
  - **Judgment call**: If the colleague’s expertise is disputed, adjust \(P_{\text{new}}(E)\) down.

  **Case 2: Leaked Draft of Unknown Provenance**  
  - **Observation**: Unverified draft report surfaces.  
  - **Step 1 (Partition)**: E = "The draft’s key claims are truthful."  
  - **Step 2 (Reliability)**: Committee median \(P_{\text{new}}(E) = 30\%\) (low trust without provenance).  
  - **Step 3 (Impact)**:  
    \(P(H|E) = 80\%\) (if true, high impact on H),  
    \(P(H|¬E) = 40\%\) (if false, no change).  
  - **Step 4 (Update)**:  
    \(P_{\text{new}}(H) = (80\% \times 30\%) + (40\% \times 70\%) = 52\%\).  
  - **You won’t like this**: Even with low trust, a high \(P(H|E)\) pulls the probability up. To counter this, lower \(P(H|E)\) if the leak’s content seems exaggerated.

  **Case 3: Preprint Contradicting Current Estimate**  
  - **Observation**: Preprint with p=0.03 against your \(P_{\text{old}}(H) = 75\%\).  
  - **Step 1 (Partition)**: E = "The study’s conclusion is correct."  
  - **Step 2 (Reliability)**: p=0.03 → base 70%, but small sample → \(P_{\text{new}}(E) = 55\%\).  
  - **Step 3 (Impact)**:  
    \(P(H|E) = 30\%\) (if study is right, H is unlikely),  
    \(P(H|¬E) = 80\%\) (if study is flawed, confidence in H increases slightly).  
  - **Step 4 (Update)**:  
    \(P_{\text{new}}(H) = (30\% \times 55\%) + (80\% \times 45\%) = 52.5\%\).  
  - **Why you’ll dislike it**: Despite study weaknesses, \(P_{\text{new}}(H)\) drops significantly because \(P(H|E)\) is low. The procedure forces confrontation with counterevidence.  
  - **Limitation**: The mapping from p-value to \(P_{\text{new}}(E)\) is heuristic. If the study is fatally flawed, set \(P_{\text{new}}(E) ≈ 0\%\).

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve conflicts in prior knowledge**: If members disagree on \(P(H|E)\) due to different background beliefs, averaging is a practical necessity but theoretically shaky.  
  2. **Handle correlated evidence**: If two reports are interdependent, the partition must expand (e.g., E₁, E₂, both, neither), which is too complex for 20 minutes.  
  3. **Eliminate arbitrariness**: The medians in Steps 2–3 are practical approximations; they don’t guarantee accuracy.  
  4. **Replace deliberation**: When evidence is existential (e.g., "What if the leak is deliberate misinformation?"), the partition may collapse. Flag: "This requires qualitative discussion."  

  ### Final Advice  
  - **Train your committee**: Run a 30-minute tutorial with historical cases.  
  - **Track evidence sources**: Assign a scribe to log datasets/reports used to avoid double-counting.  
  - **Use templates**: "As chair, I’ll ask: (1) What’s the yes/no question? (2) How reliable is it? (3) What if it were true/false?"  
  - **Accept imperfection**: This method prevents egregious incoherence (e.g., double-counting, updating on observations), but 80% coherence in 20 minutes is better than 0% in 60.  

  This protocol makes Bayesian updating tractable while highlighting where your judgment as chair is irreplaceable. Test it on low-stakes cases first—I expect refinement will be needed, but the structure will expose flaws in your current averaging method.
