prompt: |-
  I am a professor of philosophy whose research is in formal epistemology, and for the past three years I have chaired a standing scientific advisory committee — twelve members, mostly epidemiologists, engineers and two clinicians, none of them trained in probability beyond an introductory course — that meets fortnightly to produce a single agreed probability for each of a handful of contested quantities, which we then pass to the ministry that funds us. The recurring difficulty is never disagreement about priors; it is that almost nothing we learn arrives as a clean fact. A member reads out a colleague's preliminary analysis and reports that the colleague is "about 70% confident"; a draft report is leaked and we must decide what to make of it, given that we cannot verify it and do not know who wrote it or why; two members independently summarise the same unpublished dataset and we must somehow avoid double-counting it; someone forwards a preprint that reports a p-value and we have to decide what, if anything, that licenses. At present each member adjusts their own credence by feel and we average, which I suspect is incoherent in ways I can name but cannot yet repair. I know the apparatus for updating on uncertain evidence exists — Jeffrey conditionalization, probability kinematics, the rigidity condition, and the alternative of treating every report as a noisy signal and conditioning on the fact that the report was made rather than on its content — but I have never seen it turned into something a committee can actually run in the twenty minutes we have between agenda items, and my attempts to explain the difference between the evidence proposition and the observation have not landed with anyone.

  Please act as an expert in Bayesian epistemology who is also practised at converting normative principles into protocols that intelligent non-specialists can follow. Begin by thinking carefully and setting out a short brainstorm of what the theory genuinely requires and where the real choices lie, before you write anything prescriptive. Then give me the procedure itself: the questions the chair should put to the committee in order, what counts as a sufficient answer to each, what to do when the input is a person's stated credence rather than a frequency or a likelihood, how to handle two reports of one underlying piece of evidence, and, crucially, where the procedure must stop and hand the matter over to judgment because the question is one of values, of who bears the burden of error, or of how to reconcile heterogeneous priors. Be explicit throughout about which steps are genuine constraints of the theory and which are conveniences I am smuggling in. Then run the procedure on three cases: a member's "70% confident" summary of a colleague's unpublished analysis; a leaked draft whose provenance and motive we cannot establish; and a preprint reporting one small study whose result contradicts our current estimate. Include at least one case where the procedure returns an answer I will not like — I would far rather find out now than in the meeting — and tell me plainly what the procedure cannot do, and how it will misfire when what has arrived is not really evidence about a partition we have already fixed. Write for a reader who is intelligent but not a probabilist: no formulas without a plain-English gloss, no appeals to literature I would have to go and look up, and no hedging about the fact that some of the residual work is mine.
reasoning: |-
  We are dealing with a committee that must aggregate uncertain evidence to update a probability estimate for a quantity of interest. The challenges include:
  - Evidence comes in messy forms (e.g., a person's statement of confidence, a leaked draft, a preprint with a p-value).
  - The committee has limited time (20 minutes per item) and members are not experts in probability.
  - The goal is to have a coherent, justifiable procedure that can be applied consistently.

  Theoretical Foundations:
  1. We are Bayesian updaters: We start with a prior probability P(H) for the hypothesis (or the value of the quantity). We update to a posterior P(H|E) when we get evidence E. But often we don't get E directly; we get a report or a signal about E.

  2. Jeffrey conditionalization: When we get uncertain evidence (i.e., we don't learn E with certainty, but we get a new probability distribution over a partition of the space), we update by:
     P_new(H) = sum_i P(H|E_i) * P_new(E_i)
     where {E_i} is a partition and we have a new probability for each E_i.

  3. However, in practice, we often get a signal that is about E. We can model the signal as a random variable S. Then we update by conditioning on S:
     P_new(H) = P(H|S) = [P(S|H) * P(H)] / P(S)

  4. The key challenge is to map the messy evidence we receive to either:
     a) A new probability distribution over a partition (for Jeffrey) OR
     b) A likelihood function P(S|H) (for conditioning on the signal).

  5. The other challenge is that the committee members have different backgrounds and may have different priors. But note: the problem states that disagreement is not about priors (for the hypothesis) but about how to update on the evidence. However, we must note that the prior for the hypothesis might be shared (or we are aggregating to a single committee prior) and the evidence updating is the issue.

  6. We are also concerned about double-counting: if two reports are about the same underlying evidence, we must not update twice.

  Proposed Approach:
  We will design a procedure that breaks down each evidence item into a form that can be used for Bayesian updating. We will assume that the committee has a shared prior for the hypothesis (or we start with the current agreed probability as the prior for this update). The procedure will ask the committee to assess the reliability of the evidence and to express it in terms of a likelihood ratio or a new probability for a partition.

  The procedure must be simple enough for non-specialists and quick.

  Outline of the Procedure for an Evidence Item:

  Step 0: Identify the hypothesis H and the current agreed probability P(H).

  Step 1: Characterize the evidence. What is the form of the evidence? We categorize:
     Type A: A statement about the world (e.g., "the analysis shows that X is true") but we are uncertain about its truth.
     Type B: A direct statement of confidence (e.g., "I am 70% confident that X is true").
     Type C: A statistical report (e.g., a p-value, a confidence interval).

  Step 2: For Type A (uncertain fact):
     We have a proposition E (the fact being asserted). We don't observe E, we observe a report that E is true. We must assess:
        - How likely is E given H? (i.e., P(E|H) and P(E|~H)) OR
        - Alternatively, we can use Jeffrey by asking: Given what we've learned, what is our new probability for E?

     We choose the latter because it is more natural for the committee to assess the reliability of the evidence directly.

     Ask the committee: "Given what we now know about the source and the context of this evidence, what probability would we assign to E being true?" 
     Let this be q = P_new(E).

     Then, we update H by:
          P_new(H) = P(H|E) * q + P(H|~E) * (1 - q)

     But note: we need P(H|E) and P(H|~E). These are computed from the prior (current agreed) P(H) and the likelihoods P(E|H) and P(E|~H). However, we don't have these likelihoods. So we need to assess the likelihood ratio.

     Alternative: We can ask the committee to assess the likelihood ratio for E. But that might be hard.

     Instead, we can note that P(H|E) and P(H|~E) are the posterior probabilities we would have if we learned E for sure and if we learned ~E for sure. But we don't have those. However, if we assume that E is the only relevant evidence, then we can compute:

          P(H|E) = [P(E|H) * P(H)] / P(E)
          P(H|~E) = [P(~E|H) * P(H)] / P(~E)

     But we don't know P(E|H) and P(E|~H). This is a problem.

     We need a different approach.

     Revised approach for Type A:
        We treat the report as a signal. Let R be the event that we receive a report asserting E.

        We want P(H|R). We can compute this if we know:
            P(R|H) and P(R|~H)

        We can ask the committee: "If H were true, how likely would we be to get this report?" and "If H were false, how likely would we be to get this report?" But these are hard.

     Given time constraints, I propose a simpler method:

        We ask the committee to assess the reliability of the report on a scale (say, 0 to 10) and then map that to a probability that the report is correct (i.e., P(E) = reliability). Then we update using Jeffrey as above, but we need P(H|E) and P(H|~E). We can approximate these by:

            P(H|E) = min(1, P(H) / P(E))   [This is not correct]

     This is not theoretically sound.

     Alternatively, we can use the following simplification: We assume that the likelihood ratio for the report is such that:

          If the report is true, then we set P_new(H) = P(H|E) = [P(E|H) * P(H)] / P(E)

          But we don't know P(E|H). We might assume that E is independent of H? That is not generally true.

     Given the time, let us choose a different path: we treat the report as a binary signal and we ask the committee to assess two probabilities:

          1. The probability that the report is true if H is true: P(report is correct | H)
          2. The probability that the report is true if H is false: P(report is correct | ~H)

     But note: the report being correct means E is true. So we are asking for P(E|H) and P(E|~H). Then we can compute the posterior.

     However, the committee might find this difficult. Instead, we can ask for:

          - The sensitivity: P(report says E | H) = P(E|H)   [if the report is about E and we assume it is truthful, but note the report might be lying?]

     Actually, we are in a situation where the report is that E is true. We are not sure if E is true. We are also not sure if the report is truthful. This is getting complex.

     Let me reframe:

          We have a report R: "E is true".

          We want P(H|R) = P(R|H) * P(H) / P(R)

          We can write P(R|H) = P(R|E,H)*P(E|H) + P(R|~E,H)*P(~E|H)

          But if we assume that the report is only about E and that given E, H and R are independent? Not necessarily.

     Given the time constraints, I propose we use the following practical method for Type A:

          We ask the committee: "How much does this report, if true, change our probability for H?" They can give a factor (e.g., "it would double the odds" or "it would increase the probability by 20 percentage points"). Then we also ask: "How confident are we that the report is true?" (on a scale from 0 to 1, say q).

          Then we do:

              Let P_old = current P(H)
              Let P_if_true = the probability we would assign if we knew the report was true.
              Let P_if_false = the probability we would assign if we knew the report was false.

          Then: P_new(H) = q * P_if_true + (1-q) * P_if_false

          But we don't have P_if_false. We can assume that if the report is false, then we have no new information and P_if_false = P_old? Not necessarily. If the report is false, that might be informative too.

          Alternatively, we might assume that the report being false is equivalent to ~E, and then we would set P_if_false = P(H|~E). But we don't know that.

     This is messy.

     After careful thought, I propose we use a simplified version of Jeffrey conditionalization that requires only two assessments:

          Assessment 1: What is the proposition E that the evidence is directly about? (This must be a yes/no question.)
          Assessment 2: What is our new probability for E given this evidence? (q)
          Assessment 3: What would be our new probability for H if we learned E for sure? (P(H|E))
          Assessment 4: What would be our new probability for H if we learned that E is false? (P(H|~E))

     Then: P_new(H) = P(H|E)*q + P(H|~E)*(1-q)

     But note: P(H|E) and P(H|~E) are counterfactual. They are what we would believe if we learned E or ~E and nothing else. We can approximate them by:

          P(H|E) = min(1, P_old * (sensitivity / P(E_prior)))   [again, not correct]

     Without a model, we cannot compute P(H|E) and P(H|~E) from the prior. Therefore, we must ask the committee to estimate them. This is a judgment call.

     Given the time, we might ask: "If we were to learn that E is definitely true, what would be our new probability for H?" and similarly for false.

     This is a lot to ask. But note: we are a committee of experts. They can reason about the impact of E on H.

     So for Type A evidence, the steps are:

          Step 1: Define E (the proposition being reported) clearly.
          Step 2: The committee assesses q = P(E) given the evidence (the reliability of the evidence for E).
          Step 3: The committee assesses P(H|E) and P(H|~E) by considering how H and E are related.

     However, note that P(H|E) and P(H|~E) should be computed from the prior and the likelihood. But if we ask for them directly, we are asking for a judgment about the strength of the connection between E and H.

     This is feasible if E is chosen appropriately. We want E to be a mediating variable between the evidence and H. For example, if the evidence is a leaked draft that says "the virus is airborne", then E could be "the virus is airborne". Then H could be "the infection rate will exceed X". The committee knows how E affects H.

     But note: we are updating on E, so we must have a causal or evidential connection.

     If we do not have a clear E, then we might treat the evidence as a direct signal about H.

     For Type B (a statement of confidence): 
          Example: A member reports that a colleague is "70% confident" about H.

          We can treat this as a second-order probability. We are receiving a signal that someone else's probability for H is 70%. We need to update our own probability for H given this.

          We can model the colleague as having some expertise. We ask the committee:

              - How competent is the colleague on this issue? (This gives a distribution over the colleague's accuracy.)

          We can use the standard model for expert opinion: we assume that the colleague's probability, say C, is such that:

              P(H | C) = C   [if we trust the colleague perfectly] 

          But we don't. We can use a linear opinion pool or a beta model.

          A simple way: we take a weighted average between the colleague's probability and our prior.

              P_new(H) = w * 0.7 + (1-w) * P_old(H)

          where w is the weight we assign to the colleague (0 to 1).

          How to set w? We ask the committee: "On a scale from 0 to 10, how much weight should we give to this colleague's opinion relative to our own current estimate?" Then map to [0,1].

     For Type C (statistical report):
          Example: a preprint reports a p-value.

          We need to interpret the p-value in the context of H. We might extract an effect size and a standard error and then update accordingly. But that might be too technical.

          Alternatively, we can ask: "What is the likelihood ratio for H given the study result?"

          We can use the Bayes factor. But without a prior, it's hard.

          A practical approach: We ask the committee to interpret the statistical report in terms of how much it should shift the probability. We can use the approach by [Kass and Raftery](https://www.jstor.org/stable/2291091) for Bayes factors:

              Bayes factor (BF) = P(data|H1)/P(data|H0)
              Then posterior odds = BF * prior odds.

          We can ask a statistician member to compute the BF or approximate it from the p-value (but note: p-value is not the BF).

          Alternatively, we can use the following rule of thumb for a two-sided p-value:

              p-value around 0.05 -> BF around 1 (so no change) or maybe 3? Actually, [this paper](https://link.springer.com/article/10.3758/s13423-017-1341-5) suggests that p=0.05 corresponds to BF around 3 to 5 if the prior is symmetric and the effect size is small. But it's not robust.

          Given the time, we can ask the committee: "Based on this statistical result, what would be a reasonable multiplicative factor for the odds of H?" (i.e., the Bayes factor). Then update the odds.

          Steps:

              current_odds = P_old(H) / (1 - P_old(H))
              new_odds = BF * current_odds
              P_new(H) = new_odds / (1 + new_odds)

          But how to get BF? We can have a table:

              p-value < 0.001 -> BF = 100
              p-value < 0.01 -> BF = 30
              p-value < 0.05 -> BF = 10
              p-value < 0.1 -> BF = 3
              else BF = 1

          This is crude and may be criticized. Alternatively, if the study provides an effect size and standard error, we can compute the Bayes factor more accurately.

          But note: we have only 20 minutes. We might delegate to one member to compute the BF and report it.

     Double-counting: When two reports are about the same underlying evidence, we must not update twice. We can:

          - Identify the underlying evidence (e.g., a particular dataset).
          - If we have already updated on that dataset, then we ignore the second report.
          - If we haven't, but we are getting two summaries, we can update only once and use the more reliable summary.

          We need to keep a record of what evidence we have already incorporated.

     The Procedure:

     We assume the committee has a shared prior for H (the current agreed probability) and that we are updating sequentially.

     For each evidence item:

        1. Classify the evidence type:
            - Type A: Assertion of a proposition E (which may be about H or about a related fact).
            - Type B: A statement of confidence in H (e.g., "I am X% confident that H").
            - Type C: A statistical report (p-value, confidence interval, etc.).

        2. For Type A:
            a) Define E clearly (the chair asks: "What is the fact being asserted by this evidence?")
            b) Ask: "If we knew E was true, what would be our new probability for H?" (P(H|E))
            c) Ask: "If we knew E was false, what would be our new probability for H?" (P(H|~E))
            d) Ask: "Given the source and context, what probability do we assign to E being true?" (q)
            e) Compute: P_new(H) = q * P(H|E) + (1-q) * P(H|~E)

        3. For Type B (confidence statement of X% in H):
            a) Ask: "How much weight should we give to this source's opinion about H?" (w, on a scale from 0 to 1, where 0 means ignore and 1 means adopt their probability fully)
            b) Compute: P_new(H) = w * (X/100) + (1-w) * P_old(H)

        4. For Type C (statistical report):
            a) Ask a designated member (or the whole committee) to provide a Bayes factor (BF) for H given the study. If they cannot, use a rule of thumb based on the p-value (as above) or the reported effect size and standard error.
            b) Convert the current probability to odds: odds_old = P_old(H) / (1 - P_old(H))
            c) Multiply by BF: odds_new = BF * odds_old
            d) Convert back to probability: P_new(H) = odds_new / (1 + odds_new)

     Note: Steps 2b and 2c require the committee to think about the strength of the connection between E and H. It is a judgment, but it is necessary.

     Where the procedure must stop and hand over to judgment:

        - When the evidence does not fit into a partition that we have pre-defined (e.g., if E is not a binary event, we might need a more complex partition, but we are avoiding that for simplicity).
        - When there is disagreement about how to define E or about the values of q, P(H|E), P(H|~E), w, or BF, we may need to take a vote or average the assessments. We must be clear: the procedure requires these inputs. If the committee cannot agree, then we might take the average of the inputs provided by members.

     However, note: the theory does not require averaging the inputs. It requires one coherent update. But we are a committee, so we must aggregate.

     I propose: for each of the required inputs (q, P(H|E), P(H|~E), w, BF), we ask each member to provide their assessment, then we take the median (to avoid outliers) and use that.

     Then we run the update.

     Case 1: A member's "70% confident" summary of a colleague's unpublished analysis.

        Type: B (confidence statement)

        Steps:
          Current P(H) = let's say 0.5.
          The colleague's confidence: 70% -> 0.7.
          We ask each member: "What weight w (between 0 and 1) should we assign to this colleague's opinion?"
          Members give: [w1, w2, ..., w12]. We take the median w_med.
          Then P_new(H) = w_med * 0.7 + (1 - w_med) * 0.5.

        Example: if w_med = 0.6, then P_new(H) = 0.6*0.7 + 0.4*0.5 = 0.42 + 0.20 = 0.62.

     Case 2: A leaked draft whose provenance and motive we cannot establish.

        Type: A (assertion of a proposition E)

        Step 1: Define E. The draft says, for example, "the new variant is 50% more transmissible". But we must define E precisely. Let E be: "the transmissibility is at least 50% higher".

        Step 2: Ask each member:
            a) What would be P(H|E)? (if we knew E was true)
            b) What would be P(H|~E)? (if we knew E was false)
            c) What is q = P(E) given the leak?

        Then for each member, they have a triplet (P(H|E), P(H|~E), q). We take the median of each.

        Then compute: P_new(H) = q_med * P(H|E)_med + (1 - q_med) * P(H|~E)_med.

        Example: 
            Current P(H) = 0.3.
            Suppose we get:
              P(H|E)_med = 0.8   (if the variant is more transmissible, then H is more likely)
              P(H|~E)_med = 0.2   (if it is not, then H is less likely)
              q_med = 0.4   (we are not very confident in the leak)

            Then P_new(H) = 0.4*0.8 + 0.6*0.2 = 0.32 + 0.12 = 0.44.

        Note: This update does not depend on the prior P(H) explicitly because we are asking for the counterfactual probabilities. But note: the counterfactual probabilities P(H|E) and P(H|~E) should be computed from the prior and the likelihood. However, we are bypassing that by asking for them directly.

     Case 3: A preprint reporting one small study whose result contradicts our current estimate.

        Type: C

        Steps:
          Current P(H) = 0.7 -> odds_old = 0.7/(1-0.7) = 7/3 ≈ 2.333.
          The preprint reports a p-value of 0.03 for an effect in the opposite direction.

          We use the rule of thumb: p<0.05 -> BF=10. But note: the study contradicts H? So it is evidence against H. Therefore, we should use the reciprocal? Actually, the Bayes factor is for the alternative hypothesis (which is against our H?).

          Let's clarify: 
            Let H be our hypothesis (which the study is testing). The study reports a result that is unlikely under H (p=0.03). So the Bayes factor for the alternative hypothesis (say, ~H) is the likelihood of the data under ~H divided by under H. We are interested in BF for ~H relative to H? But typically, the BF is defined for H1 (alternative) vs H0 (null). If H is the null, then a small p-value means the data is more likely under the alternative. So BF = P(data|H1)/P(data|H0) = high (say 10). Then the odds of H1 relative to H0 are multiplied by 10. Since H0 is our H, we are updating in favor of ~H.

          Therefore, we update the odds of H (which is H0) by:

              odds_new = (1/BF) * odds_old   [because the evidence is against H?]

          But note: the Bayes factor we have is for H1 vs H0. We want:

              P(H0|data) / P(H1|data) = [P(data|H0)/P(data|H1)] * [P(H0)/P(H1)]

          So if BF = P(data|H1)/P(data|H0) = 10, then the factor for H0 is 1/10.

          Therefore: odds_new(H) = (1/10) * odds_old(H)

          Then P_new(H) = odds_new / (1+odds_new) = (1/10 * 2.333) / (1 + 1/10 * 2.333) = (0.2333) / (1.2333) ≈ 0.19.

          This is a drastic drop. But note: the study is small? Our rule of thumb does not account for sample size. Also, the p-value threshold is crude.

          Alternatively, we might have a designated member compute the BF properly. But in this case, we used the rule of thumb and got a BF of 10 against H.

          This update might be too extreme. This is a case where the procedure returns an answer you might not like.

          Why might you not like it? Because the study is small and we had a strong prior (0.7). The update brings it down to 0.19. But note: the rule of thumb is crude. We might adjust the rule of thumb for small studies by capping the BF. Or we might ask the committee to adjust the BF based on study quality.

          However, the procedure requires a BF. If we use the rule of thumb, we get this result. To mitigate, we might use a different rule of thumb for small studies: reduce the BF. For example, for a small study, we might cap BF at 3. Then:

              odds_new = (1/3) * 2.333 = 0.7777
              P_new(H) = 0.7777 / (1+0.7777) ≈ 0.44.

          But note: the procedure must be consistent. We might instead ask the committee to consider the sample size and quality and adjust the BF accordingly.

     Limitations:

        - The procedure assumes that the evidence can be classified into one of the three types. If it doesn't fit, we must force it or skip.
        - The procedure does not account for dependencies between evidence items. We are updating sequentially and independently.
        - The double-counting issue: we must track what evidence we have incorporated. We recommend keeping a log of evidence sources and updating only once per unique underlying evidence.
        - The assessments (q, P(H|E), etc.) are subjective and may be inconsistent across members. Taking medians helps, but it doesn't solve the issue.
        - The procedure for Type A requires defining a binary E. If the evidence is about a continuous variable, we might need to discretize.
        - The procedure for Type C is crude. We might misspecify the BF.

     Where judgment is required:

        - Defining E for Type A.
        - Assessing the weight w for Type B.
        - Assessing the counterfactual probabilities for Type A.
        - Assessing the reliability q for Type A.
        - Determining the BF for Type C (if using judgment beyond the rule of thumb).
        - Deciding what evidence has already been incorporated (to avoid double-counting).

     The chair must facilitate these judgments quickly.

     Final note: This procedure is a practical approximation. It is not fully rigorous, but it is better than the current method of "adjust by feel and average". It makes the updating steps explicit and aggregates the inputs in a structured way.

     Let's run through the cases with the procedure:

     Case 1: "70% confident"
        Type B: 
          Current P(H)=0.6
          Confidence: 70% -> 0.7
          We ask for weights: committee gives weights, median=0.5
          Then P_new(H)=0.5*0.7 + 0.5*0.6 = 0.35+0.3=0.65

     Case 2: Leaked draft
        Type A:
          E: "the new variant is at least 50% more transmissible"
          Current P(H)=0.4 (but note: H might be about hospitalizations, not transmissibility. We must define H and E such that they are connected. Let H be: "hospitalizations will exceed 1000 next month". Then E is about transmissibility, which is a cause of H.)
          Committee assessments (medians):
            P(H|E)=0.8   (if the variant is more transmissible, hospitalizations are more likely)
            P(H|~E)=0.3   (if not, then less likely)
            q=0.4 (we don't trust the leak much)
          P_new(H)=0.4*0.8 + 0.6*0.3 = 0.32+0.18=0.50

     Case 3: Preprint with small study, contradicting
        Type C:
          Current P(H)=0.7 -> odds=0.7/(0.3)=2.333
          p-value=0.03 -> using rule of thumb, BF for alternative (against H) is 10.
          So we update: odds_new = (1/10) * 2.333 = 0.2333
          P_new(H)=0.2333/(1+0.2333)=0.189

          But we note the study is small. We might adjust the BF. The committee might decide to use BF=3 instead because of the small sample size.
          Then: odds_new = (1/3)*2.333 = 0.7777, P_new(H)=0.7777/(1+0.7777)=0.437

          This is less drastic.

     The procedure cannot:

        - Handle evidence that doesn't fit a simple partition (e.g., multiple interrelated events).
        - Account for dependencies between evidence items (we update sequentially as if independent).
        - Reconcile heterogeneous priors (we assume a shared prior at each step).
        - Replace the need for expert judgment in assessing the inputs.

     It may misfire when:

        - The evidence is not about a partition we have fixed (e.g., if E is continuous and we are forcing a binary split).
        - The committee's assessments of the inputs are internally inconsistent (e.g., if P(H|E) and P(H|~E) are not consistent with the prior and the evidence).

     Despite these limitations, the procedure provides a structured and auditable way to update probabilities in the face of uncertain evidence.

     Implementation:

        The chair should:

