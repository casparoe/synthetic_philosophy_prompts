          Specifically, if the bettor's b > a*c, then they are overvaluing the unconditional bet on hearts relative to the conditional bet. In this case, selling the conditional bet for c tokens is selling it too cheaply because they should ask for at least a*c tokens, and a*c < b. And we have already sold them an unconditional hearts bet at b, which is more than a*c.

