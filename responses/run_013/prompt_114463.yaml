   Given the complexity of these constructions and the time, I propose to use a simple synchronic Dutch book for the unconditional probabilities and then move to a diachronic example that is well-known: the three cards. Three-card example:

     - There are three cards: 
          Card 1: Red/Red
          Card 2: Red/Blue
          Card 3: Blue/Blue
     - A card is selected at random and placed on the table. The bettor can see one side, chosen at random.

     We focus on one property: the other side is the same color as the shown side.

     - If the bettor sees a red side, what is the probability that the other side is also red?
       (There are 3 red sides initially. Two of them have red on the other side (from the Red/Red card) and one has blue (from the Red/Blue card). So it's 2/3.)

     - But many people say 1/2.

     - We can Dutch book them over time.

   However, this example is about a specific updating rule: the bettor updates to 1/2 upon seeing a red side.

     - At t0, before any card is selected, the probability that the bettor will see a red side and then assign 1/2 to the other side being red is 2/3 (since half the time the card is shown with a particular side, and there are two cards that have at least one red side).

     - The vulnerability is synchronic: the bettor is vulnerable at t0.

     - We can offer bets at t0 that are Dutch booked if they update to 1/2 upon seeing red.

     But it is diachronic because the update happens.

   Given the constraints of the activity, we need an example where the participants state probabilities and then update, and the bookie offers bets at two times.

   We will use the three-card example.

   Activity title: The three-card game.

   Materials: 
     - Three cards: one RR, one RB, one BB.
     - Poker chips or tokens.

   Roles:
     - One student as the bettor.
     - One student as the bookie.
     - The rest are the audience (who will also learn).

   Steps:

    1. The facilitator shows the three cards and explains: one card has two red sides, one has two blue, and one has one red and one blue.

    2. The bettor is not looking. The bookie shuffles the three cards and selects one at random, placing it on the table. The bookie then randomly chooses which side to show ( by flipping a coin if necessary; in practice, since the card is placed randomly, we can just show the top side).

    3. The bettor is called in and sees the shown side. The facilitator elicits from the bettor their probability that the other side is the same color as the shown side. We expect the bettor to say 1/2.

    4. The bookie, who knows the bettor's updating rule ( or can assume it is 1/2), will have already placed bets at t0 (before the card was selected) and now will place bets at t1 (after the bettor has seen the side).

    But how to do the Dutch book for this in a way that is within the time and with the materials?

    There is a known diachronic Dutch book for the three-card example if the bettor updates to 1/2.

    Let the bettor's probability at t0 for the event "the other side is the same as the shown side" be 2/3. (Because at t0, without any information, the probability that the two sides are the same is the probability of drawing the RR or the BB, which is 2/3.) 
    Event S: " the card is either RR or BB", so that the two sides are the same.

    But the vulnerability occurs if the bettor, upon seeing a red side, updates to P(S) = 1/2.

    The bookie can:

      At t0 ( before the card is selected):
        - Sell the bettor a bet on S at price 2/3. This bet pays 1 token if S is true.
        - explanation: the bettor should be willing to pay 2/3 for a bet that pays 1 if S.

      Then, after the card is selected and a red side is shown, the bettor now has P(S) = 1/2.
      The bookie then:
        - Buys from the bettor a bet on S at price 1/2. This bet pays 1 token if S is true.

      Now, regardless of the card, the bettor has a sure loss.

      How? Let's see the net transfer of tokens:

        - At t0: bettor pays 2/3 to bookie for the first bet.
        - At t1: bookie pays 1/2 to bettor for the second bet.

        Then when the card is revealed:
           - If S is true (card is RR or BB), then:
                 - The first bet pays 1 to the bettor (because bookie sold it, so bookie pays if S is true).
                 - The second bet: the bettor must pay 1 to the bookie (because the bookie bought it, so the bettor pays if S is true).
                 Net for the bets: 1 (from first) -1 (from second) =0.
                 But the money already transferred: -2/3 + 1/2 = -1/6.

           - If S is false (card is RB), then:
                 - First bet: nothing (because S false).
                 - Second bet: nothing.
                 Net money transfer: -2/3 + 1/2 = -1/6.

        So in both cases, the bettor loses 1/6 token.

      This is a sure loss.

      But note: the bettor might not have a probability for S at t0? We can elicit it.

      How to run the activity:

        - At the beginning, before any card is selected, ask the bettor: 
              "What is your probability that the two sides of the card are the same color (i.e., the card is either RR or BB)?"
          We expect the answer: 2/3.

        - The bookie then offers to sell the bettor a bet that pays 1 token if the card is RR or BB, for price 2/3 tokens. The bettor should accept.

        - Then, select a card and show a side. Suppose a red side is shown.

        - Ask the bettor: "Given that you see a red side, what is the probability that the card is RR? (i.e., the other side is also red) and what is the probability that the card is RB? ( so the other side is blue)"
          We expect: they say 1/2 for RR and 1/2 for RB.

          But note: event S in this context, given that they see a red side, is " the card is RR" ( because if it's RR, then two sides are the same; if it's RB, then they are different). 
          So P(S | shown side is red) = P(card is RR | shown side is red) = 2/3? 
          -> But wait, we want them to update to 1/2 for S given red? 

          Actually, event S is " the card has two sides the same". Given that they see a red side, the card can be RR (same) or RB (different). So indeed, given red, S is equivalent to the card being RR.

          And we know P(card is RR | see red) = 2/3. 

          So if the bettor updates to 1/2 for S given red, then they are vulnerable.

        - So the bettor here must state, after seeing red, that their probability for event S ( the card is either RR or BB) is now 1/2? 

          But if they see red, then the card cannot be BB. So given that they see red, event S is only about it being RR. event BB is impossible. So the probability of S given red is the probability of RR given red, which is 2/3.

          Therefore, the bettor who updates to 1/2 is making a mistake.

        - So in the activity, the bettor might not make that mistake if they are well-trained. We might need to assume they do make the mistake.

   Given the popularity of the mistake, we assume the bettor says that after seeing a red side, the probability that the card is RR (so that the other side is also red) is 1/2, and therefore the probability of event S (which now is only RR, since BB is out) is 1/2.

   Then the bookie offers to buy from the bettor a bet that pays 1 token if event S is true, for price 1/2 tokens. The bettor, with their new probability 1/2 for S, should be willing to sell this bet.

   Then we resolve the card and the bets.

   This will result in a sure loss of 1/6 tokens.

   To make it work in the activity:

     - We need to ensure the bettor states 1/2 after seeing a red side.

     - We can have a practice round where they see it's 2/3, but then in the heat of the moment, they might say 1/2.

     - If they say 2/3, then the bookie would not offer the second bet, and there is no Dutch book. So we must hope they say 1/2.

     - To encourage the mistake, we can not remind them of the t0 probability and not mention the sample space. Just ask: "Given that you see a red side, what is the probability that the other side is also red?"

     - This is the classic Monty Hall type of mistake.

   Therefore, we design the activity as follows:

     Participants: 1 bettor, 1 bookie, the rest are observers.
     Materials: three cards: 
          - RR: both sides red.
          - RB: one side red, one side blue.
          - BB: both sides blue.
     Tokens: we will use a point system. Each token is worth 1 point.

     Steps:

       Minute 0-5: Introduction.
          - Explain the three cards.
          - Explain that a card will be chosen at random and placed on the table showing one side (chosen randomly) and the other side hidden.

       Minute 5-10: Elicit t0 probability.
          - Ask the bettor: "Before any card is selected, what is the probability that the two sides of the selected card are the same color? (That is, the card is either both red or both blue)"
          - We expect: 2/3. 
          - The bookie then sells the bettor a bet: 
               "I will sell you a bet that pays 1 token if the card is either both red or both blue. The price is 2/3 tokens."
          - The bettor pays 2/3 tokens to the bookie.

       Minute 10-15: Card selection and showing.
          - The bookie (or facilitator) shuffles the three cards and selects one randomly. 
          - Then, within that card, chooses a side to show at random ( by flipping the card if necessary). 
          - Suppose a red side is shown. ( If blue is shown, we do a symmetric thing.)

       Minute 15-20: Elicit updated probability.
          - The bettor is shown the red side.
          - Ask: "Given that you see a red side, what is the probability that the two sides are the same color? ( which, in this case, means the card is both red, because if it were both blue, you would have seen blue.)"
          - We hope/expect the bettor says 1/2.
          - The bookie then says: "I will buy from you a bet that pays 1 token if the card is both red or both blue. I will pay you 1/2 tokens for this bet."
          - The bettor accepts: they receive 1/2 tokens from the bookie, and now owe the bookie 1 token if the card is indeed both red or both blue.

       Minute 20-25: Resolution.
          - Reveal the card.
          - There are two cases:

            Case 1: The card is RR (both red) -> event S is true.
               - The first bet: the bookie must pay the bettor 1 token (because the bookie sold a bet on S that pays 1).
               - The second bet: the bettor must pay the bookie 1 token ( because the bookie bought a bet on S and it is true).
               - Net cash flow at resolution: bettor gets 1 from bookie and gives 1 to bookie -> 0.
               - But already, the bettor paid 2/3 at t0 and received 1/2 at t1. Net: -2/3 + 1/2 = -1/6 tokens.

            Case 2: The card is RB (red and blue) -> event S is false.
               - First bet: no payment.
               - Second bet: no payment.
               - Net cash flow: 0, and the net from before is -2/3 + 1/2 = -1/6 tokens.

            Case 3: The card is BB (both blue) -> event S is true.
               - But in this case, we would have shown a blue side, not red. So this case doesn't happen in the run where we showed red.

            So in the run with a red side shown, the bettor always loses 1/6 tokens.

       Minute 25-30: Repeat if necessary.
          - We might need to do it for a blue side as well, but the structure is the same.

       Minute 30-60: Debrief.

   The activity shows a diachronic Dutch book: the bets are placed at two different times, and the bookie can force a sure loss even though at each time the bettor is accepting bets that seem fair by their then-current probabilities.

   But note: the bettor's t0 probability for S was 2/3, which is correct. Their t1 probability for S after seeing red should be 2/3 (because given red, the card is RR with probability 2/3 and RB with probability 1/3, so the probability that the card is the same on both sides (RR) is 2/3). If they update to 2/3, then the bookie would not be able to Dutch book them in this way. The vulnerability came because they updated to 1/2.

   Therefore, the activity teaches that if you do not update by conditionalization, you are vulnerable to a diachronic Dutch book.

   This meets the requirement for the diachronic part.

   For the synchronic part, we could do a separate warm-up. But within the same activity, we might not have time. Alternatively, we can do a syn example on the same day with a different elicitation.

   However, the three-card example has a synchronic vulnerability as well: at t0, if the bettor has state-dependent incoherent probabilities. But that's not the main point.

   Given the time, this activity will take about 30 minutes to run, leaving 60 minutes for discussion.

   We can then in the debrief discuss:

     - What happened? The bettor lost a sure amount.

     - Why? Because at t0 they had one probability for event S, and at t1 they had a different probability for the same event S, even though they learned something, but they didn't update by conditionalization.

     - How does this connect to the Dutch book theorem? 
           - The bookie was able to construct a series of bets, each of which seemed fair at the time, that together guarantee a loss.
           - This is a diachronic Dutch book.

     - What is the difference between synchronic and diachronic?
           - In synchronic, the bets are all placed at the same time and the vulnerability is from static incoherence (like having P(A) + P(not A) !=1).
           - In diachronic, the vulnerability arises from an updating rule that
             does not match the initial probabilities via conditionalization.

     - What are the idealizations?
           - The bettor must be willing to bet at their stated probabilities.
           - The bookie can force the bettor to accept the bets at these prices.
           - The world is not divisive: we used fractions of tokens. In the activity, we can use a unit that is divisible ( like we can have 6 tokens to allow 1/6).

           But in real life, we might not be able to force the bettor to accept bets at any time, and they might learn from the bookie's offers.

     - What couldn't we reproduce? 
           - In this activity, we assumed the bettor updates to the wrong probability. In reality, a rational agent would update to 2/3. So we rely on the bettor making a mistake. This might not happen in class if the students are well prepared. So we might need to instruct the bettor to intentionally state 1/2 to see what happens.

           - The activity does not show a syn Dutch book. So we might want to do a separate syn example.

