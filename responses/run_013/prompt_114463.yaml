   After careful thought, I found a reliable construction in the SEP (Stanford Encyclopedia of Philosophy) entry on Dutch books. We will use the conditionalization example from there.

    SEP example (diachronic):

      Suppose the agent has P0(A) = 0.5, and plans to update to P1(B) = 0.6 if A occurs, but P0(B|A) = 0.5. 

      The bookie does the following:
        At t0:
          - He buys from the agent a bet that pays $1 if A and B, for the price P0(A and B) = P0(B|A)*P0(A) = 0.5 * 0.5 = $0.25.
          - He sells to the agent a bet that pays $1 if A occurs, for the price P0(A) = $0.50.
        Then, if A occurs:
          - At t1, the bookie sells to the agent a bet that pays $1 if B, for the price P1(B) = $0.60.

      Now, we settle after the state is revealed.

      Consider the mutually exclusive and exhaustive states: A and B, A and not B, not A.

      State: A and B.
        - The bookie bought the bet on (A and B): so the agent pays the bookie $1.
        - The bookie sold the bet on A: so the bookie pays the agent $1.
        - The bookie sold the bet on B: so the bookie pays the agent $1.
        Agent's net from the bets:
          From bet1 (sold): -$1
          From bet2 (bought): +$1
          From bet3 (bought): +$1
          But also the money transfers at the time of betting:
            At t0: agent received $0.25 (from selling bet1) and paid $0.50 (for buying bet2) -> net -$0.25.
            At t1: agent paid $0.60 (for buying bet3).
          So total net: -0.25 -0.60 -1 +1 +1 = -0.25 -0.60 +1 = $0.15 -> positive for the agent.

      This is not a loss.

      The SEP then must use a different scaling or directions.

   Let's try to set the net in each state to be negative by carefully choosing the directions and stakes.

    Suppose the agent has P0(A) = a, and plans to update to P1(B) = c if A occurs, but P0(B|A) = b, and b != c.

    We then do:

      At t0:
        - The bookie sells to the agent a bet that pays $1 if A occurs, at price a.
        - The bookie buys from the agent a conditional bet that pays $1 if B is true given that A is true. The price he pays is b.

      Then, if A occurs, at t1:
        - The bookie sells to the agent a bet that pays $1 if B occurs, at price c.

      Now, let's compute the agent's net in each state:

        State not A:
          - Bet on A: agent paid a, gets 0 -> net -a.
          - Conditional bet: off, so nothing -> net +b (received at t0).
          - Bet at t1: not made.
          Total: -a + b.

        State (A and B):
          - Bet on A: -a +1.
          - Conditional bet: since A and B, the agent must pay $1 to the bookie -> net +b -1.
          - Bet on B: -c +1.
          Total: -a+1 + b-1 + -c+1 = -a + b - c +1.

        State (A and not B):
          - Bet on A: -a+1.
          - Conditional bet: since A and not B, the agent pays 0 -> net +b.
          - Bet on B: -c.
          Total: -a+1 + b - c.

      We want these to be negative in every state.

      So we require:
        (1) -a + b < 0   [not A]
        (2) -a + b - c +1 < 0   [A and B]
        (3) -a + b - c < 0       [A and not B]

      In particular, (1) requires b < a.
      (3) is then automatically true if (1) holds because -a+b <0 and -c<=0, so their sum is<0.
      (2) requires -a+b+1 < c.

      So if the agent's planned update c is greater than 1 - (a - b) [ note -a+b+1 = 1 + (b-a) ] and also agent has b < a, then we can make the book.

      But what if the agent's vulnerability is when c is too high relative to b? 

      Example: 
        a = 0.5, b = 0.4, c = 0.7.
        Then (1): -0.5+0.4 = -0.1 <0 -> holds.
        (2): -0.5+0.4-0.7+1 = (-0.5-0.7) + (0.4+1) = -1.2 + 1.4 = 0.2 >0 -> does not hold.

      So not loss in state A and B.

      If c is lower than b? 

        Example: a=0.5, b=0.6, c=0.4.
          (1): -0.5+0.6=0.1>0 -> does not hold.

      So this construction only works if b < a and c > 1 + b - a.

      This is not the typical vulnerability ( which occurs whenever c != b).

