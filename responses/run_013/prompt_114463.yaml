      But if the bettor, at t0, states P(same | see red) = 1/2, then we have:
          2/3 = (1/2) * (1/2) + (1/2) * P(same|see blue) 
          => 2/3 = 1/4 + (1/2) * P(same|see blue)
          => (1/2)*P(same|see blue) = 2/3 - 1/4 = 5/12
          => P(same|see blue) = 10/12 = 5/6.

      This is not symmetric and not coherent. 
      Then we can synchronic Dutch book them at t0.

      So the activity:

          At t0, ask the bettor for:
            - P(same)
            - P(see red)
            - P(same | see red)

          Hopefully, they state something incoherent.

          Then the bookie can offer a syn Dutch book at t0.

          Then later, after they see the evidence, they might update in an way that is not by conditionalization, leading to a dia Dutch book.

      This might be too much for one activity.

   Given the time, I will provide the three-card activity for the dia part and assume the syn part can be done with a quick demonstration.

   The activity with the three-card for diachronic Dutch book is as follows.
