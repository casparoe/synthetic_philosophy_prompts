  ### Dutch Book Activity: The Three-Card Trap  
  **Objective**: Participants experience synchronic and diachronic incoherence by constructing their own Dutch book through a sequence of seemingly fair bets. The activity emphasizes vulnerability from inconsistent credences and updating rules.

  ---

  ### **Materials**  
  - **Deck of Cards**: Modified to create three special cards:  
    - ♥️♥️ (Red/Red)  
    - ♥️♠️ (Red/Black)  
    - ♠️♠️ (Black/Black)  
  - **Poker Chips**: 100+ chips (each worth 1 point; no real money).  
  - **Whiteboard**: For tracking bets and calculations.  
  - **Handout 1**: "Probability Elicitation Sheet" (with innocuous questions).  
  - **Handout 2**: "Betting Record" (for bookie and bettor to log transactions).  
  - **Bag**: To draw cards blindly.  

  ---

  ### **Roles**  
  - **Bettor (1 student)**: States credences and accepts/rejects bets.  
  - **Bookie (1 student)**: Offers bets based on the bettor’s stated odds.  
  - **Audience (14 students)**: Track the Dutch book forming and predict outcomes.  
  - **Facilitator (You)**: Moderate, timekeep, and withhold explanations until debrief.  

  ---

  ### **Setup (10 min)**  
  1. **Introduce the Scenario**:  
     - *"We have a special deck: three cards (RR, RB, BB). One card is drawn randomly and placed face-down. We will reveal one side at random—you’ll see either red or black—and bet on the hidden side."*  
  2. **Elicit Credences (Handout 1)**:  
     - Ask the bettor:  
       - *Q1: P(card is RR or BB) [= P(same)]?* → **Synchronic probability (e.g., 2/3)**.  
       - *Q2: If you see red, what’s P(hidden side red) [= P(same|see red)]?* → **Diachronic plan (e.g., 1/2)**.  
     - Bookie records answers on the whiteboard. *Do not validate or correct*.  

  ---

  ### **Phase 1: Synchronic Bet (15 min)**  
  - **Bookie’s Offer**:  
    - *"I’ll sell you a bet: Pays 6 chips if the card is RR or BB (same color). Price = your P(same) × 6 chips."*  
      - Example: If bettor said P(same) = 2/3, price = 4 chips.  
  - **Bettor’s Choice**:  
    - Accepts if they believe the bet is fair (expected value ≥0).  
    - **Transaction**: Bettor pays bookie 4 chips.  

  ---

  ### **Phase 2: Evidence and Update (10 min)**  
  1. **Draw a Card**: Bookie draws a card (e.g., ♥️♥️), then randomly reveals one side (e.g., red).  
  2. **Bettor Updates**:  
     - *"You see red. What’s P(hidden side red) now?"* → Bettor states updated credence (e.g., 1/2).  

  ---

  ### **Phase 3: Diachronic Bet (15 min)**  
  - **Bookie’s Offer**:  
    - *"I’ll buy a bet from you: You pay me 6 chips if the card is RR or BB. Price = your updated P(same) × 6 chips."*  
      - Example: If updated P(same) = 1/2, price = 3 chips.  
  - **Bettor’s Choice**:  
    - Accepts if fair (expected value ≥0).  
    - **Transaction**: Bookie pays bettor 3 chips.  

  ---

  ### **Phase 4: Resolution (10 min)**  
  - **Reveal the Card**:  
    - Case 1 (RR): Both sides red → "same" is true.  
      - Bettor wins 6 chips (from Phase 1) but pays 6 chips (to bookie in Phase 3).  
    - Case 2 (RB): Red shown, black hidden → "same" is false.  
      - No chips exchanged in resolution.  
  - **Net Loss**:  
    - *RR*: Net = (6 - 6) - (4 - 3) = -1 chip.  
    - *RB*: Net = (0) - (4 - 3) = -1 chip.  
    - **Bettor always loses 1 chip regardless of outcome!**  

  ---

  ### **Debrief (30 min)**  
  1. **Recreate the Trap**:  
     - *"What happened? Why did the bettor lose no matter what?"*  
     - Map to Dutch book:  
       - **Synchronic Incoherence**: Initial P(same) = 2/3, but P(same) ≠ P(see red) × P(same|see red) + P(see black) × P(same|see black). Coherence requires 2/3 = (1/2)(1/2) + (1/2)(1/2) = 1/2? No! Correct is 2/3 = (1/2)(2/3) + (1/2)(2/3).  
       - **Diachronic Vulnerability**: Updated P(same|see red) = 1/2 ≠ initial conditional credence (2/3). Bookie exploited the inconsistency between initial and updated odds.  

  2. **Key Concepts**:  
     - **Sure Loss vs. Expected Loss**:  
       - Each bet had non-negative expected value *when accepted*, but the *combination* guaranteed loss.  
       - Dutch bookies profit from incoherence, not knowledge.  
     - **Synchronic vs. Diachronic**:  
       - Synchronic: Static bets exposing contradictions (e.g., P(A) + P(¬A) < 1).  
       - Diachronic: Dynamic bets exploiting poor updating (e.g., not conditionalizing).  

  3. **Idealizations and Limitations**:  
     - **Cannot Reproduce**:  
       - *Logical Omniscience*: Participants might not realize P(same|see red) must be 2/3.  
       - *Infinite Divisibility*: We used whole chips; real Dutch books use arbitrarily small bets.  
       - *Forced Bets*: In reality, agents can refuse bets, but coherence compels acceptance.  
     - **Predictable Failure Modes**:  
       - Bettor states coherent probabilities (e.g., P(same|see red) = 2/3).  
       - *Fix*: "Anonymous" elicitation (write answers secretly) or use a different bettor.  
       - Bookie offers a rejected bet.  
       - *Fix*: Bookie must reference the bettor’s stated odds (e.g., *"You said P=1/2—isn’t this bet fair?"*).  

  ---

  ### **Why It Works**  
  - **Trap Through Choices**: Bettor volunteers premises (credences), bookie constructs the Dutch book incrementally.  
  - **Diachronic Focus**: Updating feels reasonable (1/2 after seeing red) but clashes with prior commitments.  
  - **Vivid Takeaway**: "My own credences, fairly acted on, guaranteed my loss."  

  This activity forces participants to confront Dutch books as a *personal* vulnerability, not a bookie’s trick. The three-card setup ensures incoherence is intuitive, and the token losses make the argument visceral.
