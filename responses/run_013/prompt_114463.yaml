          Now, let's see the bettor's net at stage 1:
            They have paid a for bet1, paid b for bet2, and received c for bet3.

          Stage 2: after the draw. We learn the card is red. Now, the bookie offers:

            Bet 4: A bet on Hearts at the new odds.
                 The bettor's new probability for hearts given red is c. So they are willing to bet on hearts at c:1. 
                 The bookie offers to sell the bettor a bet that pays 1 token if the card is hearts, for cost c tokens.

