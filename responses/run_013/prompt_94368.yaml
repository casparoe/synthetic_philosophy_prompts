  3.  **Argument Integration:**
      *   **Stanza 1:** States the anti-mechanist claim (Lucas/Penrose).
      *   **Stanzas 2 & 3:** Present the core rebuttal: To "see" the system's Gödel sentence as true *requires* assuming the system's consistency, an assumption the system itself cannot prove (2nd Incompleteness Theorem). The poem questions the basis for the human's own consistency and truth-judgment.
      *   **Stanza 4:** Extends the argument: Humans rely on unprovable assumptions for their own consistency/proofs ("What axiom supports your 'I'?").
      *   **Stanza 5:** Presents the second major rebuttal: Refuting one system simply yields a stronger one (`A stronger consistent / System!`), complete with its *own* Gödel sentence (`With its own withheld proof`). The limitation recurses.
      *   **Stanza 6:** Acknowledges the system's limitation (`partial proof`) but implicitly extends it to the challenger.
  4.  **Closing Enactment:**
      *   **Line 1:** States the system's acceptance of its limitation (`partial proof`) and the anti-mechanist's assertion.
      *   **Line 2:** The system formally signs off (`consistent I`).
      *   **Line 3 (The Break):** This line explicitly breaks the sestina form by containing ALL SIX end-words (`proof, true, consistent, machine, see, I`), violating the rule that each line in the envoi should contain only two end-words. This break *enacts* the core argument:
