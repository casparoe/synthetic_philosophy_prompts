  ## The Clean Pen

  Mrs. Althea Vance adjusted her tortoiseshell glasses, the silver *dextra* ring on her right hand catching the lamplight as she smoothed the crisp manuscript page. As Senior Editor of the *Concord Standard*, Beacon City’s premier guide to linguistic propriety, clarity was her vocation. And clarity, as everyone knew, flowed naturally from acknowledging the fundamental structure of the world: the Right-Handed norm.

  The submission before her, “Market Day Musings” by Mr. Harold Finch, was exemplary. “Finch,” she murmured approvingly to her junior colleague, Ms. Brenner, “understands *clean* language. Observe: *‘The merchant, a sturdy fellow, weighed the apples with practiced ease, his right hand deft on the scales.’* No awkward qualifiers. No distracting deviations. Just the clean, unmarked case.” She tapped the word *‘hand’*. “The assumption is correct, natural. Why clutter it with ‘right’? It’s the default.”

  Ms. Brenner, earnest and newly promoted, nodded. “Yes, Mrs. Vance. It reads smoothly. Unlike the Parnell piece.” She gestured to another stack. “Ms. Parnell insists on specifying *‘left-handed baker’* every time. It feels… pointed. Like she’s drawing unnecessary attention.”

  “Precisely, Brenner,” Althea sighed. “Ms. Parnell seems to think her… *situation*… is central to baking. It isn’t. Skill is skill. But constantly tagging it as ‘left-handed’ makes it seem like a peculiarity, an addendum. It disrupts the flow, forces the reader to stumble over an irrelevant detail.” She picked up Parnell’s manuscript. “*‘The left-handed baker carefully kneaded the dough, her left hand moving in counter-clockwise circles…’* See? Clumsy. Redundant. Just *‘the baker kneaded the dough’* suffices. The *clean* implication is right-handedness. Specifying otherwise is only necessary in specific, comparative contexts – medical studies, perhaps, or specialized tool manuals. Not everyday prose. Not *clean* prose.”

  Later, reviewing letters to the editor, Althea tutted at one signed “Mx. Kaelen Thorne.” The indeterminate honorific always struck her as unnecessarily obscure. *Mr.* and *Ms.* were perfectly serviceable for the Right-Handed majority. *Mx.* felt like an affectation, a demand for special recognition where none was linguistically required. The letter itself argued for more “inclusive language” in the *Standard*, suggesting phrases like “people of handedness” instead of simply “people,” and avoiding idioms like “giving the left-handed compliment.”

  “Ridiculous,” Althea muttered. “‘People’ encompasses everyone. Adding ‘of handedness’ implies a distinction where none fundamentally exists in general discourse. And ‘left-handed compliment’ is a perfectly valid idiom! It precisely conveys that subtle, backhanded nature – the insincerity that comes from the *other* side, the deviation.” She penned a firm but polite rejection note, advising Mx. Thorne that the *Standard* prioritized clarity and linguistic efficiency, not political fashions that muddied the waters.

  Her own life exemplified clean efficiency. Her kitchen tools – can opener, vegetable peeler, her favourite paring knife – were all correctly oriented. Her desk blotter, phone, and fountain pen sat precisely where her right hand fell naturally. She’d trained her nephew, young Peter, diligently when he’d shown early left-handed tendencies, gently repositioning his crayon. “It’s for the best, dear,” she’d explained patiently. “The world is designed for efficiency. Fighting it just creates friction. You’ll write cleaner, work smoother.” He used his right hand now, perfectly adequately. See? Adaptation was possible, beneficial even. Cleanliness prevailed.

  The only ripple came from Mr. Davies, the history section editor, a thoughtful man who sometimes indulged in what Althea considered unnecessary philosophical tangents. Over tea in the staff room, he remarked, “That Thorne letter, Althea… interesting points. Makes one wonder, doesn’t it? If *we* were the ones constantly having to specify ‘right-handed doctor’ or ‘right-handed author,’ if *our* tools were the awkward ones… might ‘clean’ language feel different?”

  Althea set her cup down precisely on its saucer. “Davies, that’s purely hypothetical. Counterfactual. The world *isn’t* structured that way. Language evolves to reflect reality efficiently. The Right-Handed mode *is* the efficient, unmarked default in our physical and social architecture. Insisting on tagging everything as ‘right-handed’ would be as redundant as specifying ‘two-legged pedestrian’ or ‘sighted reader’ in ordinary contexts. It would clutter the language, obscure meaning. Our duty is to clarity, Davies. To the clean, common-sense flow of communication.”

  She saw his thoughtful expression, the slight doubt. It mildly irritated her. Why create complications where none existed? Why force asymmetry onto a beautifully symmetrical system? The *Standard* existed to uphold the clarity that came from recognizing natural order. Specifying the deviation was only necessary when the deviation impacted the core meaning. Otherwise, it was noise.

  Later, reviewing galley proofs for the next edition, she paused at the entry for “Ambidextrous.” The definition read: *Possessing equal facility with both hands; often considered advantageous, though sometimes indicative of an unfocused nature.* Althea nodded. Accurate. Useful to know. She initialed the margin – a clean, right-handed flourish.

  She then picked up Harold Finch’s final draft. The opening line shone with clean efficiency: “*The farmer surveyed his land, hand resting on the gatepost, a picture of serene competence.*” Perfect. No awkwardness. No unnecessary markers. Just the simple, unadorned truth of the world as it was, and as language should reflect it. The farmer’s hand, naturally, was right-handed. To state it would be redundant. To assume otherwise… well, that would simply be gauche, a fundamental misunderstanding of how clean language, and indeed the clean world, operated.

  Mrs. Vance leaned back, satisfied. The *Standard* was in good order. The language was clean.
