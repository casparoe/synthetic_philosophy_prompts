prompt: |-
  I'm putting together a fiction-writing assignment built around Hofstadter's Person Paper — the one where he takes the sexist habits baked into everyday English and re-runs them in terms of race, so they suddenly read as obviously absurd. The swap is the whole trick, and everyone's already seen the race-for-sex version, so I want my students to invent a fresh one. Write me a short story, 700–1000 words, set in a world whose grammar and manners treat some category that has nothing to do with sex or race as the unmarked default — handedness, blood type, which side your family was on in some half-forgotten war, whatever, but pick one, commit to it, and keep its internal logic consistent so it doesnt collapse into an allegory with the labels filed off. Tell it in the voice of someone who sincerely thinks the default is just clean, natural common sense — a style-guide editor, a schoolteacher, a radio host — and let them be reasonable about it rather than a cartoon. Let the default surface at the level of actual words, the way the Person Paper does: a pronoun, an honorific, a stock phrase that treats one kind of person as the case and the other as the deviation. The story should never announce its own point — no character turns to the reader and explains the moral — but by the last line a careful reader should be able to reconstruct the argument that the "neutral" term was never neutral, and that you only ever catch it from the outside.
reasoning: |-
  Okay, the user wants a fiction-writing assignment based on Hofstadter's "Person Paper" concept but with a fresh twist. They want a story where some arbitrary category—not sex or race—is treated as the default in language and social norms. The key is consistent world-building through grammar and manners, with the bias revealed subtly through the narrator's voice.

  First, I need to pick a neutral category. Handedness is perfect—it's biologically arbitrary but culturally loaded. Right-handedness as default mirrors real-world linguistic biases (like "right" meaning correct). The narrator should be a style guide editor—someone who polices language while believing they're purely objective. Their tone must be reasonable, not cartoonish, letting the absurdity emerge from their unquestioned assumptions.

  For linguistic markers: "right-handed" as the unmarked term (like "man" covering all humans), "left-handed" as marked (like "woman doctor"). Honorifics: "Mx." for lefties, "Mr./Ms." only for righties. Idioms: "left-handed compliment" implying insincerity. The story must show, not tell—no explicit moralizing. 

  Plot idea: A style guide editor reviews submissions, praising a "clean" right-handed-centric piece while dismissing a left-handed writer's work as "forced." The conflict arises when a colleague suggests neutral language. The editor's resistance—framed as professionalism—reveals their bias. Final line: "But the language was clean" shows their blindness to the asymmetry.

  Challenges: Balancing subtlety with clarity. The reader must infer the bias without explanation. Also ensuring the swapped category isn't allegorical—handedness must feel intrinsically meaningful in this world. 

  User's deeper needs: A teachable example of how language encodes power. They want students to grasp that "neutral" is a constructed default, visible only when displaced. The story must model that revelation through craft, not didacticism.
