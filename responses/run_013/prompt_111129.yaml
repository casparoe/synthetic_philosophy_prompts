answer: |-
  Ladies and gentlemen, board members, esteemed guests, and most importantly, [Awardee's Name] and her wonderful family,

  It’s a genuine privilege to stand before you tonight to present this association’s highest honour: the Prize for Integrity Under Pressure. And it’s a particular honour, tinged with deep respect, to be the one introducing [Awardee's Name], a colleague I sat beside, worked alongside, and learned from for over a decade.

  Eleven years is a long time to share an office, a workload, and the slow rhythm of daily professional life. You get to know a person. You see how they navigate the quiet days and the hectic ones, the minor frustrations and the genuine challenges. Over those years, I saw in [Awardee's Name] a consistent thread: a fundamental decency, a quiet competence, and a core of steadfastness that never wavered. She was, and is, someone you instinctively trust. Someone who does the work thoroughly, who treats people fairly, who carries herself with an unassuming strength. We valued her then, as we all do now, not just for her skill, but for her character.

  This award, however, recognizes something more specific: integrity *under pressure*. It speaks to that moment when the easy path diverges sharply from the right one, and the right one carries a significant personal cost. It recognizes the act of holding fast to principle when the current is pulling hard the other way. [Awardee's Name]’s nomination stems, as many of you know, from her crucial role in bringing to light serious issues within the ‘[mention the business/affair briefly - e.g., "X project", "the old procurement practices"]’. Specifically, it was [Awardee's Name] who, two years after I had moved on, put her name to the file, the signature that finally compelled action and accountability. She did what needed to be done, when it most needed doing.

  Now, courage like this rarely happens in a vacuum. It often emerges from a context where silence has been the norm. Not necessarily a malicious silence, but perhaps a silence born of uncertainty, of complex loyalties, of a misplaced hope that things might resolve themselves, or simply of the sheer, grinding difficulty of being the one to step forward when stepping forward feels like stepping off a cliff. Many decent people, good colleagues, well-liked and respected within these walls – people who *knew*, in varying degrees of detail, that something wasn't right – simply never found the moment, or the means, or perhaps the inner resolve, to act. That silence, that collective holding of breath, became part of the atmosphere. It was the background noise against which the eventual, necessary sound of truth had to ring out.

  To speak about [Awardee's Name]’s courage tonight is, inevitably, to stand near that silence. And standing here, holding this microphone, tasked with celebrating her decisive action, creates a certain tension. I knew enough, in a general way, for some time before I left. Enough that the question of speaking up was present, and I chose not to. That is a fact, one known to a few in this room, unknown to most. This creates a complicated space for me, right now.

  Because when we talk about having the 'standing' to speak about courage or integrity, it’s rarely a simple yes or no. Does the truth of what happened depend on who speaks it? No. The facts of [Awardee's Name]’s action, her clarity, her willingness to bear the weight – these stand utterly apart from whoever recounts them. They are luminous in themselves. But does the person speaking bring baggage that might obscure that light, or distract from it? Does their own past action, or inaction, mean their voice carries less authority on *this specific topic*, or perhaps even undermines the message itself? And crucially, will speaking now, in this context, truly serve the purpose of honouring her, or might it shift the focus elsewhere?

  These aren't abstract questions for me tonight. They are the ground I’m standing on. I cannot stand here as a paragon. What I can do, what I *must* do, is ensure that the focus remains squarely where it belongs: on [Awardee's Name] and her extraordinary act.

  Her courage was not a rebuke. It was a rescue. It wasn’t a finger pointed backwards, but a hand reaching forward to pull us all towards a better standard. She acted not out of judgment for those who hesitated, but out of a profound commitment to what this association *should* be. She saw a wrong that was causing harm – perhaps diffuse, perhaps accumulating, but harm nonetheless – and she decided she could no longer be a bystander. She weighed the personal risk, the potential fallout, the sheer discomfort of it all, and chose principle. She filed the report. She put her name to it. That signature wasn't just ink on paper; it was an act of profound moral ownership. It was the moment the background silence was shattered by the clear, undeniable sound of integrity.

  That sound resonates. It sets a new tone. It reminds us all – those who acted late, those who acted not at all, those new to the room – what true commitment looks like when the pressure mounts. It shows that integrity isn't just about avoiding wrongdoing yourself; sometimes, it demands confronting it in the world around you, even when the path is daunting and the personal cost is real.

  So, to her family, please know this: we honour [Awardee's Name] tonight for her essential character, illuminated so brightly in that difficult moment. We see the courage you surely always knew was there. To [Awardee's Name] herself: your colleagues, this association, and everyone who believes in doing the right thing, especially when it’s hard, owe you a profound debt. You showed us what it means to hold the line. You didn’t just act with integrity under pressure; you redefined what integrity means for this organization moving forward. Your action wasn't just correct; it was necessary, and it was deeply, deeply brave.

  It is therefore my immense honour, complicated history and all, to present the [Year] Prize for Integrity Under Pressure to a truly remarkable woman, my former colleague and a person of the highest principle: [Awardee's Name].
