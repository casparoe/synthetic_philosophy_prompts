prompt: |-
  I chair the clinical AI review board of a mid-sized public hospital network, and our advance-care planning office is asking us to sign off on a tool that would infer patients' care preferences from choices they have already made inside our system — which appointments they attended, which treatments they accepted or declined, how promptly they followed up, whether they opted for home dialysis over in-center — and then, when a patient has lost decision-making capacity and never completed an advance directive, to use that inferred preference model to select the default care plan, which the clinical team would then have to justify departing from. The method is described as recovering a reward function from demonstrated behavior under a noisy-planner assumption: the patient is modeled as mostly rational, mostly forward-looking, and stochastically optimal with respect to an unknown utility over health states, symptom burden, and time spent in institutional settings. The proposal is candid about two things I want the memo to take seriously rather than score points off. First, it concedes that many different preference models explain the same record of attendance and refusal equally well, and says it breaks such ties with a prior that favors the preferences the care team regards as clinically reasonable. Second, it reports that inferred preferences matched a later-elicited statement of preferences in roughly three-quarters of pilot cases — though the pilot cohort came from a different clinic than the one where deployment is planned, the elicitation was conducted by the team that built the model, and the interface presents clinicians with a single ranked plan plus a confidence number that our own informatics staff tell me clinicians already treat as decisive once it passes about 0.7.

  Please draft the written opinion I will circulate before Thursday's meeting. It has to end in something the office can act on: approve, reject, or approve subject to named conditions with a timeline and a named owner for each. Two arguments need to be engaged on their merits, not waved at. The first is the defenders' claim that the relevant comparison is not between an inferred preference and the patient's true preference but between an inferred preference and a clinician's unaided guess, and that since the clinician's guess is at least as opaque, at least as biased, and at least as insensitive to anything the patient actually did, the objection proves too much and should not block deployment. The second is the autonomy justification itself: the tool is being defended as a way of honoring what patients want, yet the behavior it learns from was generated under conditions this board has flagged before — automated reminders, financial penalties for missed sessions, transportation the hospital arranges and cancels, appointment slots we control — so I need the memo to state plainly what a behaviorally inferred preference can and cannot represent when the behavior was shaped by the very institution that now proposes to interpret it, whether the tie-breaking prior is where our own clinical values quietly re-enter as the patient's, and whether any of this is remediable by something short of prospective elicitation while the patient can still speak for herself. Keep the whole thing to what a busy board can read in one sitting, and make any conditions concrete enough that a later auditor could check whether they were met.
reasoning: |-
  Okay, the user chairs a clinical AI review board and needs a written opinion for an advance-care planning tool. The tool infers patient preferences from past behaviors like appointment attendance and treatment choices. The memo must address two key arguments: comparing the tool to clinicians' guesses, and whether inferred preferences truly respect autonomy given institutional influences.

  First, I need to understand the core concerns. The tool uses behavioral data to model preferences when patients can't decide, but the hospital's own systems (reminders, penalties, etc.) shaped that behavior. That creates a conflict - can we call this "patient preference" if the institution influenced the actions? The tie-breaking prior also risks imposing clinical values as patient preferences. The 75% pilot accuracy has caveats: different clinic, modelers did the elicitation, and clinicians over-rely on confidence scores above 0.7.

  For the comparison argument: Yes, unaided clinician guesses have biases, but that doesn't automatically justify the tool. The memo should stress that both are flawed, but the tool's errors are systemic and harder to challenge because they appear objective. Clinicians might overtrust the algorithm due to automation bias.

  On autonomy: The key point is that preferences inferred under institutional constraints aren't freely chosen. The hospital controlled options (e.g., only certain appointment slots), applied pressures (no-show fees), and didn't clarify how choices reflected preferences versus circumstantial constraints. Using a clinical prior to break ties makes it worse - it's the system quietly substituting its values.

  The user needs actionable recommendations. Blanket rejection seems unlikely given the office's request, so conditional approval makes sense. Conditions should target specific flaws:
  - Validate locally before full deployment (addresses pilot cohort mismatch)
  - Require multi-option presentation (counters overreliance on single "ranked plan")
  - Cap confidence score influence (stops 0.7+ being treated as decisive)
  - Mandate disclosure about institutional influence (transparency on limitations)
  - Sunset clause forcing re-review (ensures ongoing scrutiny)

  For enforceability, each condition needs an owner and timeline. The informatics team can handle validation protocols, the advance-care office can redesign interfaces, compliance can manage disclosures. Timelines should be phased - validation first, then rollout with new interface, disclosures within 6 months.

  The tone must balance rigor with collaboration. The board isn't anti-innovation but insists on safeguards. Phrases like "meaningful validation" and "transparent disclosure" show constructive criticism. Ending with "conditional approval" acknowledges the office's work while binding them to fixes.

  Lastly, the memo must stay concise. Using clear sections (Background, Concerns, Recommendations) helps busy readers. Bullet points in the conditions section make obligations unambiguous for auditors.
answer: |-
  ## Memorandum: Clinical AI Review Board Opinion - Preference Inference Tool for Advance Care Planning  
  **To:** Advance-Care Planning Office, Clinical Leadership, AI Review Board Members  
  **From:** [Your Name], Chair, Clinical AI Review Board  
  **Date:** [Current Date]  
  **Subject:** Conditional Approval of Preference Inference Tool with Mandatory Safeguards  

  ### I. Background & Proposal Summary  
  The Advance-Care Planning Office proposes deploying an AI tool to infer patient care preferences (e.g., treatment aggressiveness, institutional care aversion) from observed behaviors (appointment adherence, treatment accept/decline decisions, modality choices). When a patient lacks decision-making capacity and no advance directive exists, this inferred "preference model" would set the *default care plan*. Clinicians may deviate but must justify departure. The tool models patients as "noisy rational planners" maximizing an unknown utility function.  

  ### II. Key Concerns Requiring Mitigation  
  While the proposal’s candor about limitations is commendable, two fundamental concerns demand rigorous scrutiny:  

  1.  **The Comparison Argument ("Better than Clinician Guess?"):**  
      Proponents correctly note that unaided clinician judgment is opaque, biased, and often insensitive to patient behavior. **However, this does not automatically validate the AI alternative.** Algorithmic inferences carry distinct risks:  
      *   **False Objectivity:** An algorithm’s output appears neutral and scientific, masking underlying assumptions (e.g., the "clinically reasonable" prior, data limitations). This risks *automation bias* where clinicians unduly defer to the algorithm. Evidence of clinicians treating a confidence score >0.7 as "decisive" confirms this risk.  
      *   **Systemic vs. Individual Bias:** Clinician biases are individual and potentially challenged. Algorithmic bias is systemic, harder to interrogate in real-time, and amplified by the tool’s role in setting *defaults*.  
      *   **Actionable Insight:** **The relevant comparison is not "AI vs. Flawed Human," but "Does this AI *augment* human judgment in a way demonstrably safer and more patient-aligned than the *current protocol* for patients without directives?"** The pilot data is insufficient to affirm this.

  2.  **The Autonomy Argument ("Honoring What Patients Want?"):**  
      Inferring preferences from behavior shaped *by the institution* raises profound autonomy questions:  
      *   **Institutional Shaping of Behavior:** Past behaviors (attendance, treatment choices) occurred under coercive influences: financial penalties for missed sessions, limited appointment slots, hospital-arranged (and cancellable) transport, and automated reminders. **Can we confidently interpret "choice" here as expressing core care values, versus circumstantial adaptation to system constraints?**  
      *   **The Prior as Value Imposition:** When multiple preference models fit the data equally well, the tool breaks ties using a prior favoring preferences deemed "clinically reasonable." **This unavoidably embeds the *institution's* or *developers'* values into the inferred preference, presented as the *patient's*. This is a significant substitution, not mere clarification.**  
      *   **Remediation Limits:** **Inference from constrained historical behavior cannot replicate the validity of prospective preference elicitation.** While valuable for hypothesis generation, its use as a *default plan determinant* in incapacitated patients requires extraordinary safeguards to avoid institutional overreach.  

  ### III. Pilot Data Limitations  
  The reported 75% match rate with later-elicited preferences is promising but insufficient for deployment here:  
  *   **Non-Representative Cohort:** Pilot occurred in a different clinic population.  
  *   **Conflict of Interest:** Elicitation conducted by the model developers introduces potential bias.  
  *   **Interface Risk:** Presenting a single "ranked plan" with a confidence score promotes over-reliance.  

  ### IV. Review Board Decision: Conditional Approval  
  The Board acknowledges the potential value of this tool for *hypothesizing* patient preferences to *inform* clinician deliberation. However, its proposed role in *setting binding default care plans* for incapacitated patients, given the concerns above, is **APPROVED SUBJECT TO THE FOLLOWING MANDATORY CONDITIONS**:  

  | Condition                                                                                              | Owner                     | Timeline      | Verification Standard (Auditable)                                                                 |
  | :----------------------------------------------------------------------------------------------------- | :------------------------ | :------------ | :------------------------------------------------------------------------------------------------ |
  | **1. Local Validation & Calibration:** Conduct a rigorous validation study within *this* hospital network's target population. Must achieve ≥80% concordance (Kappa ≥0.6) between inferred preferences and preferences elicited *independently* (e.g., by Advance Care Planning staff, not model devs) using a structured interview (e.g., SPICT, PREPARE) in ≥300 patients *with* decision-making capacity. Report full metrics (PPV, NPV, sensitivity, specificity). | Advance-Care Planning Office + Informatics | 12 Months     | Final validation report submitted to AI Review Board, documenting methodology, cohort, results, and statistical analysis. |
  | **2. Multi-Option Presentation & Interface Redesign:** Present clinicians with **≥3 viable care plan options** ranked by model fit (with confidence scores), **not a single default plan.** Include a concise, plain-language summary of the *key behavioral data points* driving the inference (e.g., "Model weights heavily: declined surgery X, opted for home dialysis, missed 2/5 oncology follow-ups"). | Informatics + Clinical UX Team | 6 Months (Post-Condition 1) | Screenshots and usability testing logs demonstrating presentation of multiple options and behavioral rationale, approved by AI Review Board. |
  | **3. Confidence Score Threshold & Mandatory Review:** **Disable display of confidence scores above 0.7.** Require **mandatory ethics consult or palliative/senior clinician review** *before* any inferred preference model can be adopted as a care plan basis for patients lacking capacity. | CMIO + Compliance         | 3 Months (Post-Condition 1) | Configuration audit confirming score suppression >0.7. Policy document outlining mandatory review trigger and process, signed by CMIO. Audit logs spot-checked quarterly. |
  | **4. Transparency & Disclosure:** Develop patient-facing materials explicitly stating: (a) Historical behaviors *may* be used to *help inform* care preferences if they cannot speak; (b) These inferences have limitations and are influenced by hospital system factors; (c) The importance of completing an advance directive. | Advance-Care Planning Office + Legal/Comms | 6 Months      | Materials reviewed and approved by Legal, Compliance, and Patient Advocacy. Documentation of dissemination (e.g., website, brochures, admission packets). |
  | **5. Sunset Clause & Monitoring:** Full deployment contingent on successful completion of Conditions 1-4. Post-deployment, track: (a) Frequency of ethics/review overrides; (b) Patient/family complaints related to inferred preferences; (c) Audit 10% of cases quarterly. **Automatic suspension** if override rate >25% or significant complaints emerge. Full re-review by Board at 18 months post-deployment. | Quality & Safety + AI Review Board | Ongoing       | Quarterly reports to AI Review Board detailing metrics. Formal re-review presentation/documentation at 18 months. |

  ### V. Rationale for Conditions  
  These conditions directly address the core concerns:  
  *   **Local Validation (Cond. 1)** ensures the tool performs adequately in *our* population before determining care.  
  *   **Multi-Option Presentation & Rationale (Cond. 2)** combats automation bias, forces deliberation, and provides context, making the inference less opaque.  
  *   **Confidence Cap & Mandatory Review (Cond. 3)** explicitly counters observed over-reliance on high scores and injects essential human oversight for high-stakes decisions.  
  *   **Transparency (Cond. 4)** acknowledges institutional influence and promotes true autonomy via directives.  
  *   **Monitoring & Sunset (Cond. 5)** ensures ongoing vigilance and a clear off-ramp if risks materialize.  

  **Failure to meet any condition by its deadline will result in automatic withdrawal of approval.**  

  ### VI. Conclusion  
  The Board supports leveraging technology to honor patient preferences but cannot endorse inferring binding default care plans from institutionally-constrained behaviors without robust safeguards against misrepresentation of autonomy and algorithmic over-reliance. The conditions above provide a concrete framework for responsible implementation focused on augmenting, not replacing, nuanced clinical and ethical judgment. We approve the proposal **strictly subject to the fulfillment of all named conditions by their respective owners and timelines.**  

  **Approved Subject to Conditions**  

  ---
  **End of Memorandum** (Target Reading Time: <8 Minutes)
