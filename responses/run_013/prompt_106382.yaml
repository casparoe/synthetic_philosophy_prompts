prompt: |-
  I am the clerk of a mid-sized city whose charter was amended last year to establish citizens' assemblies: fifty residents, selected by lot, convened to deliberate on a single referred question and to report within a fixed period. The council wrote the mandate in a paragraph and left the selection process to my office. I have to publish an operating procedure before the drawing, because the side that lost the referendum has already announced it will challenge the assembly's composition, and because my staff — career civil servants with no background in democratic theory — will run the drawing themselves from a printed checklist, inside a fixed budget for postage, translation, stipends, and child care, with no authority to improvise on the day. The city attorney signs off on the final text. The pool is drawn from the voter roll, which excludes a large resident population that the question will affect; the charter fixes the size at fifty and bars me from changing it.

  Write that procedure. Ground it in the case for deciding by lot rather than by election or by volunteering — the thought that it is the lot, not the vote, that makes a body resemble the population it is meant to speak for — and in the equally old objection that a lottery gives an office to whoever is drawn rather than to whoever is fit. The Athenians answered that objection with a scrutiny of the man the lot produced, and their lot, notably, was drawn from citizens who had put themselves forward rather than from the citizen body as a whole; I want the procedure to keep whatever is defensible in that scrutiny, to confront the self-selection it concealed, and to name what would corrupt the lottery's point.

  The procedure must dispose, in order, of at least these questions, with a decision rule for each and an explicit threshold wherever the rule is quantitative: drawing the pool and recording whom the frame leaves out; stratification (which characteristics, how seats are apportioned when the numbers do not divide, and what to do with a group too small to earn a seat at fifty); acceptance (what to do when the acceptance rate is low and uneven, whether to weight, oversample, or redraw, and when to report a skewed composition as a defect rather than correct it); substitution (whether a resignation is filled from the same stratum or from the whole pool); the internal offices (whether the chair and the rapporteur are elected by the members or drawn by lot, and what turns on the difference); and the boundary of my authority, marking the questions that must go to the council, the facilitator, or the members themselves because they are questions of value rather than administration.

  Then run the procedure on three cases: a stratum that will receive zero seats; a member who turns out to be an active campaigner on the referred question, whom the procedure does not permit us to remove; and a request from the council that we weight the draw to guarantee a result it considers representative. At least one of the three should come out against what the city, or I, would prefer, and I want that said plainly rather than softened.

  Close with what the procedure cannot do — what kind of legitimacy or deliberative quality it cannot manufacture merely by getting the drawing right — and identify each step where a value judgment is being made under the cover of an administrative rule. Give me the checklist first, the worked cases after, and no more theory than each step needs. End with a single final line of the form \answer{<step number and short label>} naming the one step at which the procedure must hand the decision to a person.
reasoning: |-
  We are writing an operating procedure for selecting citizens for a citizens' assembly. The procedure must be grounded in the principles of sortition (selection by lot) and address the historical objections and practices. The key points from the request:

  1. **Principles**: 
     - The lot (not election or volunteering) is meant to create a body that resembles the population it represents.
     - The Athenians used a scrutiny (examination) of those selected by lot, but note that their lot was drawn from a self-selected group (those who put themselves forward). We must confront the issue of self-selection and retain what is defensible in scrutiny.
     - We must avoid corruption of the lottery's point (which is to achieve a representative sample).

  2. **Procedure must address**:
     - Drawing the pool and recording exclusions (the voter roll excludes some residents).
     - Stratification: which characteristics, apportionment when numbers don't divide, handling very small groups.
     - Acceptance: dealing with low/uneven acceptance rates (whether to weight, oversample, redraw) and when to report skewed composition as a defect.
     - Substitution: how to replace a resignation (same stratum or whole pool).
     - Internal offices: how to select chair and rapporteur (election or lot) and implications.
     - Boundary of authority: what decisions are administrative and what must go to the council, facilitator, or members (value judgments).

  3. **Cases to run**:
     - A stratum that gets zero seats.
     - A member who is an active campaigner on the issue (cannot be removed by procedure).
     - A council request to weight the draw to guarantee a "representative" result (must sometimes go against the city's or clerk's preference).

  4. **Final note**: What the procedure cannot do (legitimacy and deliberative quality beyond the draw) and identify steps where value judgments are made under administrative cover.

  5. **Structure**: 
     - Checklist (the procedure) first.
     - Worked cases after.
     - End with a single final line: \answer{<step number and short label>} for the step that must hand the decision to a person.

  We must write the procedure in a formal, administrative style.

  ---

  **Procedure for the Selection of Citizens' Assembly Members**

  **Section 1: Preamble**

  1.1. **Principles**: 
     - The Citizens' Assembly is a body of fifty residents, selected by lot from the voter roll, to deliberate on a referred question. The purpose of selection by lot is to form a group that mirrors the population of the city in its diversity, thereby providing a representative cross-section. 
     - The lottery is designed to avoid self-selection (which would bias the assembly toward those who volunteer) and to prevent election (which favors those with resources, popularity, or particular interests). 
     - The procedure recognizes the historical concern that a lottery may select individuals who are not "fit" for the duty. However, the assembly's legitimacy rests on its resemblance to the whole population, not on the fitness of individuals. Therefore, the procedure includes a scrutiny step (Section 3) to ensure that the selected individuals are capable of serving without conflict of interest, but not to assess their views or abilities beyond basic eligibility.

  1.2. **Exclusions**: The voter roll excludes some residents (e.g., non-citizens, those under 18, and those not registered). The Clerk will record the percentage and characteristics of the excluded population in the final report to the Assembly and Council, but the pool is drawn solely from the voter roll as mandated by the charter.

  **Section 2: Drawing the Pool**

  2.1. **Initial Pool**: The pool of potential members is the entire voter roll of the city, as of the date of the drawing.

  2.2. **Stratification**:
     - **Characteristics**: The pool will be stratified by age (in 5-year bands), gender (male, female, non-binary/other), and neighborhood (using the city's official neighborhood boundaries). These characteristics are chosen because they are readily available from the voter roll and are most likely to reflect the city's diversity in a way that affects perspectives on public questions.
     - **Apportionment**: The fifty seats are apportioned to the strata using proportional representation (based on the share of each stratum in the voter roll). The method of apportionment is the Hamilton method (largest remainder method) to handle fractional seats. 
     - **Threshold for Representation**: 
          - Any stratum that, by proportional apportionment, would be entitled to at least 0.5% of the total seats (i.e., 0.25 seats, rounded to 0) is guaranteed one seat if its population is at least 0.5% of the voter roll. However, if the proportional share is less than 0.5% and the population is less than 0.5%, it receives zero seats. 
          - If a stratum is apportioned zero seats but has at least 0.5% of the voter roll, the Clerk will note this as a defect in the representation and report it to the Council and Assembly. The Clerk will not adjust the apportionment to include such a stratum because doing so would violate proportional representation for the other strata.

  2.3. **Drawing Method**: Within each stratum, the Clerk will assign a unique random number to each voter (using a certified random number generator). The required number of individuals from each stratum (as apportioned) will be selected in order of increasing random number. 

  **Section 3: Scrutiny and Acceptance**

  3.1. **Notification**: Selected individuals will be notified by mail, with information in the city's major languages. The notice will include the dates of the assembly meetings, the stipend, child care provisions, and the requirement to respond within 15 business days.

  3.2. **Scrutiny of Eligibility**:
     - **Grounds for Ineligibility**: 
          - Non-residence in the city at the time of drawing.
          - A felony conviction that has resulted in the loss of voting rights (if applicable by state law).
          - Inability to attend the meetings (as declared by the individual).
          - Conflict of interest: The individual is an elected official, a city employee, or a paid lobbyist on the referred question. 
     - **No Scrutiny of Fitness**: The scrutiny does not assess the individual's views, knowledge, or ability beyond the above criteria. The principle is that the lottery, not fitness, confers the right to serve.

  3.3. **Acceptance Process**:
     - Each selected individual may accept or decline. 
     - If an individual declines or is found ineligible, the Clerk will draw the next individual from the same stratum (using the next random number in the same stratum list).

  3.4. **Low Acceptance Rate**:
     - The Clerk will track acceptance rates by stratum. 
     - **Redrawing Threshold**: If the overall acceptance rate falls below 30%, the Clerk will report this to the Council and recommend redrawing the entire pool. 
     - **Uneven Acceptance**: If the acceptance rate in any stratum is less than half the overall acceptance rate and the resulting composition of the assembly (after replacements from the same stratum) deviates by more than 10 percentage points from the proportional apportionment for that stratum, the Clerk will report the skew as a defect. 
     - **Corrective Action**: The Clerk will not oversample, weight, or redraw only part of the pool to correct for uneven acceptance. The procedure allows only for same-stratum replacement until the assembly is filled. The Clerk will note any significant deviations in the final report.

  **Section 4: Substitution**

  4.1. **Resignation during the Assembly**: 
     - If a member resigns after the assembly has begun, the Clerk will draw a replacement from the same stratum's remaining list (using the next random number). 
     - If no one remains in that stratum, the Clerk will draw from the entire pool of the initial draw (across all strata) but only from individuals who were not selected in the initial draw. 

  **Section 5: Internal Offices**

  5.1. **Selection of Chair and Rapporteur**: 
     - The Chair and Rapporteur will be selected by lot from among the members at the first meeting. 
     - The facilitator (an external, neutral party appointed by the Council) will conduct the drawing of these offices. 
     - **Rationale**: Election might favor those with prior experience or assertive personalities, undermining the principle of equality inherent in the lot. Drawing by lot ensures that every member has an equal chance to serve in these roles.

  **Section 6: Boundary of Authority**

  6.1. **Administrative Decisions**: The Clerk has authority to make decisions on:
     - The mechanics of the random selection.
     - Apportionment of seats by stratum (using the method in 2.2).
     - Eligibility determinations (Section 3.2).
     - Replacement of members (Section 4).

  6.2. **Decisions Requiring Council, Facilitator, or Assembly**:
     - Any change to the stratification characteristics (requires Council approval because it involves a value judgment about what diversity matters).
     - Interpretation of "conflict of interest" beyond the defined criteria (to the city attorney).
     - Any deviation from the procedure (requires Council approval).
     - The decision to redraw the entire pool due to low acceptance (recommended by Clerk, decided by Council).
     - The method of deliberation and facilitation (to the facilitator and the Assembly once constituted).

  **Section 7: Reporting**

  7.1. The Clerk will publish a report after the selection, including:
     - The random seed used for the drawing.
     - The apportionment of seats by stratum and the actual composition of the assembly.
     - The acceptance rates by stratum and any noted defects (e.g., a stratum with zero representation despite having 0.5% of the population).
     - The list of selected members (with personal information redacted for privacy, showing only stratum characteristics).

  ---

  **Worked Cases**

  **Case 1: Stratum with Zero Seats**

  - **Scenario**: The voter roll has a stratum (e.g., non-binary individuals) that makes up 0.4% of the population. The apportionment threshold is 0.5%, so this stratum is allocated zero seats. 
  - **Procedure**: By Section 2.2, the stratum does not receive a seat because its population is below the 0.5% threshold. The Clerk must note this in the report as a defect. 
  - **Consequence**: The assembly will have no member from this stratum. The Clerk does not adjust the apportionment because that would violate proportionality for other strata. The exclusion is a result of the frame (voter roll) and the threshold rule. 
  - **Against Preference**: The city may wish to have every identifiable group represented, but the procedure does not allow it because of the risk of over-representing very small groups at the expense of others. The report will state: "The non-binary stratum, representing 0.4% of the voter roll, did not meet the threshold for a seat and is not represented in the assembly."

  **Case 2: Active Campaigner**

  - **Scenario**: A selected member is revealed to be an active campaigner on the referred question. The procedure does not include this as a ground for ineligibility (Section 3.2). 
  - **Procedure**: The member is eligible because the scrutiny criteria do not exclude based on prior activism or opinion. The member cannot be removed. 
  - **Consequence**: The assembly includes a member with strong prior views. The Clerk reports the composition as drawn, without excluding the member. 
  - **Rationale**: The lottery must reflect the population, which includes people with strong views. Removing such a person would bias the assembly and corrupt the lottery's point. The procedure does not allow exclusion for this reason.

  **Case 3: Council Request for Weighting**

  - **Scenario**: The Council requests that the Clerk weight the draw to guarantee a minimum number of seats for a particular group (e.g., a racial minority) that the Council considers important for representation. 
  - **Procedure**: Section 2.2 requires proportional apportionment only by age, gender, and neighborhood. The Clerk has no authority to add another stratification characteristic without Council approval (Section 6.2). However, the Council cannot require weighting that violates proportional representation by the defined strata. 
  - **Decision**: The Clerk must deny the request because:
     - The stratification characteristics are fixed (unless the Council amends the procedure, which requires a separate process and cannot be done ad hoc).
     - Weighting for one group would distort the proportionality of the other strata and introduce a value judgment (which group deserves extra representation) that the Clerk is not authorized to make.
  - **Against Preference**: The Council and the Clerk might believe that the additional representation is necessary, but the procedure does not allow it. The Clerk must state: "The procedure does not permit weighting for any characteristic beyond the defined strata. Any change to the stratification requires a Council amendment to the procedure."

  ---

  **What the Procedure Cannot Do**

  - The procedure cannot ensure that the assembly will deliberate well or reach a wise decision. That depends on the facilitation, information provided, and the members' engagement.
  - It cannot confer legitimacy on the assembly's output if the public perceives the selection as flawed (e.g., due to exclusions from the voter roll) or if the deliberation is not conducted fairly.
  - It cannot correct for biases in the voter roll (e.g., excluding non-citizens) or for the inherent limitations of a fifty-member assembly in reflecting the full diversity of a large population.

  **Value Judgments Disguised as Administrative Rules**:

  1. **Stratification Characteristics (Step 2.2)**: Choosing age, gender, and neighborhood is a value judgment about which dimensions of diversity matter most. This is not purely administrative.
  2. **Threshold for Representation (Step 2.2)**: Setting the threshold at 0.5% is arbitrary and reflects a judgment about the minimum size for representation.
  3. **Conflict of Interest Definition (Step 3.2)**: Deciding that elected officials, city employees, and paid lobbyists are ineligible is a value judgment about what constitutes a conflict.

  ---

  **Final Answer**

  The procedure must hand the decision to a person at the step where the facilitator conducts the drawing of the internal offices (Chair and Rapporteur) by lot from the members. This is because the drawing must be conducted by a neutral party and in the presence of the assembly.

  \answer{5.1: Selection of Chair and Rapporteur}
answer: |-
  ### Citizens' Assembly Selection Procedure  
  **Prepared by the Office of the City Clerk**  
  *Pursuant to City Charter Amendment [Reference Number], Adopted [Date]*  

  #### **Section 1: Principles and Authority**  
  1.1 **Purpose of Selection by Lot**:  
     - The Assembly must mirror the resident population of the city, ensuring all viewpoints inherent in the whole are present. Lotteries achieve this by giving every eligible resident an equal chance of selection, unlike elections (which favor the resource-rich or charismatic) or volunteering (which favors the self-interested or confident).  
     - To address the historical objection that lotteries select the "unfit," this procedure includes a scrutiny step (Section 4) to exclude only those with material conflicts of interest or incapacity—not to assess virtue, wisdom, or political fitness. Fitness is irrelevant; the lot’s legitimacy flows from statistical representativeness.  

  1.2 **Limitations**:  
     - The pool is drawn solely from the **official voter roll**, which excludes non-registered residents (e.g., minors, non-citizens, the disenfranchised). The Clerk will record these exclusions in the final report (Section 8).  
     - The Assembly size is fixed at **fifty (50)**. The Clerk may not alter this.  
     - **Corruption of the lottery** occurs if:  
       - Self-selection influences the pool (e.g., volunteers prioritized).  
       - Fitness-based exclusions are applied (e.g., filtering for education or "civic aptitude").  
       - Stratification or weighting manipulates outcomes to match preconceived ideals of "balance."  

  #### **Section 2: Drawing the Pool**  
  2.1 **Source Data**:  
     - Extract the full voter roll (as of the drawing date) to form the initial pool.  
     - **Record exclusions**: Publish the percentage and demographic profile of non-voting residents affected by the referred question.  

  2.2 **Stratification Characteristics**:  
     - Stratify by **age group** (18–34, 35–54, 55+), **gender** (male, female, non-binary/other), and **neighborhood** (using city-defined boundaries).  
     - *Rationale*: These are objective, verifiable, and capture broad demographic variance. Value judgments (e.g., adding income or race) require Council approval (Section 7.2).  

  2.3 **Apportionment of Seats**:  
     - Calculate each stratum’s proportional share of the voter roll.  
     - Assign seats using the **Hamilton/Vinton method** (largest remainders) to handle fractions.  
     - **Threshold for representation**: A stratum must comprise **≥1%** of the voter roll to receive a seat. Smaller strata receive **zero seats**.  
     - *Decision rule*: If apportionment yields a fractional seat (e.g., 2.3), round down initially, then allocate remaining seats to strata with the largest remainders.  

  #### **Section 3: Random Selection**  
  3.1 **Method**:  
     - Assign a random number (via certified RNG) to each voter in the stratum.  
     - Select the top *n* individuals (by ascending random number) per stratum, where *n* is the stratum’s apportioned seats.  

  #### **Section 4: Scrutiny and Acceptance**  
  4.1 **Eligibility Scrutiny**:  
     - **Exclude only if**:  
       - Non-resident at drawing date.  
       - Incapacitated (e.g., medically unable to participate, certified by a physician).  
       - Material conflict of interest (e.g., city employee with direct oversight of the referred question; elected official).  
     - **Do not exclude for**: Prior activism, political views, or lack of expertise.  

  4.2 **Notification and Acceptance**:  
     - Notify selected individuals via mail (with translation in top 3 city languages) offering stipend, childcare, and meeting schedule.  
     - **Response deadline**: 14 calendar days.  

  4.3 **Low or Uneven Acceptance**:  
     - **Redraw threshold**: If initial acceptance rate is **<40%**, redraw the entire pool.  
     - **Stratum-specific underrepresentation**: If a stratum’s acceptance rate is **<50%** of the citywide rate, replace decliners with the next in-stratum random selection.  
     - **Report defects**: If after replacements, any stratum (≥1% population) is underrepresented by **>15%** vs. its apportionment, note this in the final report. Do not weight or oversample.  

  #### **Section 5: Substitution for Resignation**  
  5.1 **During Assembly Term**:  
     - Replace from the **same stratum** using the next random selection.  
     - If no candidates remain in the stratum, draw from the **entire initial pool** (all strata).  

  #### **Section 6: Internal Offices**  
  6.1 **Chair and Rapporteur Selection**:  
     - **Drawn by lot** from willing Assembly members at the first meeting.  
     - *Rationale*: Election risks amplifying dominant voices; lot preserves equality.  

  #### **Section 7: Boundary of Authority**  
  7.1 **Clerk’s Authority**:  
     - Execute administrative steps (Sections 2–6).  
     - Reject value-laden requests (e.g., weighting for "representativeness").  

  7.2 **Refer to Council, Facilitator, or Assembly**:  
     - Changes to stratification criteria (Council).  
     - Interpretation of "material conflict of interest" beyond 4.1 (City Attorney).  
     - Deliberative process design (Facilitator).  
     - Disputes requiring moral/political judgment (Assembly).  

  #### **Section 8: Reporting**  
  8.1 **Publish**:  
     - Random seed used.  
     - Apportionment vs. final composition (including defects).  
     - Excluded resident demographics.  

  ---

  ### Worked Cases  
  #### **Case 1: Stratum Receiving Zero Seats**  
  - **Scenario**: "East Parkside" neighborhood has 0.9% of the voter roll (<1% threshold). It receives zero seats.  
  - **Procedure**:  
    - Per Section 2.3, East Parkside is ineligible for a seat.  
    - Clerk records this in the report: "East Parkside (0.9% of roll) received no seat due to threshold rule."  
  - **Outcome**: No adjustment. The threshold rule prioritizes statistical reliability over symbolic inclusion.  
  - **Against city preference**: The Council may desire "every neighborhood represented," but lowering the threshold risks overrepresenting micro-groups and distorting proportionality.  

  #### **Case 2: Active Campaigner Cannot Be Removed**  
  - **Scenario**: A selected member is a leader of "Yes for [Referred Question]," a registered advocacy group.  
  - **Procedure**:  
    - Scrutiny (Section 4.1) permits exclusion only for conflicts like city employment—not activism.  
    - Clerk confirms eligibility: "Prior advocacy does not constitute a conflict."  
  - **Outcome**: Member serves. Reporting notes: "Assembly includes individuals with preexisting positions."  
  - **Rationale**: Excluding activists corrupts the lot by purging a natural segment of the populace. Deliberation, not selection, must neutralize bias.  

  #### **Case 3: Council Requests Weighted Draw**  
  - **Scenario**: Council asks Clerk to "ensure" 10 seats for renters, citing underrepresentation.  
  - **Procedure**:  
    - Clerk denies request. Stratification (Section 2.2) uses only age, gender, and neighborhood.  
    - Weighting would violate Section 1.2 (corruption by "manipulating outcomes").  
  - **Outcome**: Draw proceeds unweighted. Clerk reports: "Council request for renter weighting rejected; not within administrative authority."  
  - **Against Clerk’s preference**: The Clerk may personally agree renters deserve voice, but acceding would substitute bureaucratic discretion for the lot’s impartiality.  

  ---

  ### What the Procedure Cannot Do  
  - **Legitimacy**: The procedure cannot guarantee the Assembly’s decisions are seen as legitimate if exclusions (e.g., non-voters) are seen as unjust.  
  - **Deliberative Quality**: It cannot ensure respectful or informed debate; that depends on facilitation and member conduct.  
  - **Value Judgments Masked as Administration**:  
    - **2.2 (Stratification characteristics)**: Choosing age/gender/neighborhood implies these define "diversity."  
    - **2.3 (1% threshold)**: Arbitrary cutoff between "represented" and "ignored."  
    - **4.1 (Conflict definition)**: Excluding city employees assumes their interests diverge from the public’s.  

  \answer{6.1: Internal Offices}
