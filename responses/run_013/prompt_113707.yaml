  Here's what I need. A decision tree that starts at one question and branches down to 7-9 leaves, with 6-9 internal nodes, and at least half the nodes phrased as concrete mini-cases rather than abstract questions — nothing like "do you think form matters?" that you could answer by announcing your position. Phrase every node so someone can answer it without knowing where it leads. The leaves should be named in plain English (no author names anywhere — I can't cite anyone and I don't want it looking like a "which theorist have you read" quiz), and these ones have to be in there somewhere: form-is-content (a text that breaks the constraint isn't a translation of this poem at all, it's a paraphrase of its subject matter); sense-first (the constraint is ornament, fidelity is to what's said); reader-experience equivalence (fidelity is to what happens in the reader, so a different constraint that produces the same effect counts); transcreation (the target has to have some binding form of its own, not necessarily the source's); process-not-product (the constraint binds what the translator does, and whatever text falls out is the translation — the target text itself doesn't have to satisfy anything); brief-relativism (there's no fact of the matter, the right trade-off is set by whoever commissioned the thing and what it's for); and outright refusal/untranslatability. Keep the node wording jargon-free — no "skopos", no "equivalence", no "domestication", no "literalism" — and save the technical vocabulary for the leaf names. Also: flag any two leaves your tree can't actually pull apart (I'd much rather see a flagged pair than a fake question that pretends to separate them), and tell me which combinations of answers come out empty and whether that's because the view is incoherent, unattractive, or just nobody's bothered.

