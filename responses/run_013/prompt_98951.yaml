answer: |-
  ### Formal Fairness Decision Procedure for Responsible-AI Sign-Off  
  **Core Principle**: Replace metric-centric checks with explicit **error allocation analysis**. Acknowledge that fairness trade-offs are inevitable when base rates differ, and force stakeholders to choose *whose errors they prefer*. The procedure must resolve in 2 days or trigger escalation.  

  ---

  #### **Step-by-Step Procedure**  
  **Phase 1: Pre-Analysis Validation (4 hours)**  
  1. **Protected Attribute Audit**:  
     - Check if the attribute is a reliable proxy for the social/legal construct (e.g., "ZIP code" ≠ "race"). If correlation < 0.7 with ground-truth demographic data (if available), flag as "bad proxy" and halt.  
     - Verify subgroup sizes: If any group < 5% of total population *and* absolute size < 500, mark metrics as "unreliable" for that group.  

  2. **Base Rate Discrepancy Test**:  
     - Compute $P(Y=1)$ per group. If $|P(Y=1)_A - P(Y=1)_B| > 0.1$, flag "base rate tension" and proceed to Phase 2.  

  **Phase 2: Tension Identification (8 hours)**  
  1. **Metrics Computation**:  
     - Calculate: **FPR**, **FNR**, **Calibration** (expected vs. actual event rate per score decile), **PPV**, **Selection Rate**.  
     - Use bootstrapping (500 samples) for small subgroups to estimate confidence intervals.  

  2. **Tension Detection**:  
     - **Calibration vs. Error Rate Balance**:  
       - If calibration holds ($\text{actual event rate} \approx \text{score}$ per decile) but $\Delta \text{FPR} > 0.05$ or $\Delta \text{FNR} > 0.05$ between groups, confirm **real tension** (not noise).  
       - If calibration fails *and* $\Delta \text{FPR}/\text{FNR}$ is high, investigate model bias (e.g., feature drift).  
     - **PPV vs. FNR Trade-off**:  
       - Plot $\text{FNR}_A$ vs. $\text{FNR}_B$ across thresholds. If curves diverge (A’s FNR falls while B’s rises), quantify the trade-off slope.  

  **Phase 3: Error Allocation Framework (6 hours)**  
  1. **Error Distribution Matrix**: For 3 candidate thresholds (status quo, balanced FPR, balanced FNR):  
     | Group | False Positives | False Negatives | Burden Description |  
     |-------|-----------------|-----------------|---------------------|  
     | A     | FP_A (%)        | FN_A (%)        | e.g., "Healthy patients denied care" |  
     | B     | FP_B (%)        | FN_B (%)        | e.g., "Fraudulent transactions overlooked" |  

  2. **Stakeholder Choice**:  
     - Require stakeholders to sign off on a row from the matrix. *No default allowed*.  
     - If they demand mutually exclusive metrics (e.g., "equal FPR + equal FNR" when base rates differ), escalate to legal/leadership.  

  **Phase 4: Resolution & Ship/No-Ship (6 hours)**  
  - **Refuse to Ship** if:  
    - Unreliable small groups cannot be resolved (e.g., CI width > 50% of metric value).  
    - Bad proxy creates legal risk (e.g., using "income" as a race surrogate).  
    - Stakeholders refuse to choose an error allocation.  
  - **Mitigations**:  
    - For small groups: Use Bayesian shrinkage or exclude from high-stakes decisions.  
    - For human-AI systems: Simulate human override impact (e.g., "If humans correct 80% of FP, does tension persist?").  

  ---

  #### **Application to Your Cases**  
  **Case 1: Care-Management Program (Sicker Group at Same Score)**  
  - **Context**: Group B has higher disease prevalence. Model is calibrated but FNR_B > FNR_A.  
  - **Tension**: Calibration holds → **cannot** equalize FNR without breaking calibration or increasing FP for A.  
  - **Error Allocation Matrix** (at default threshold):  
    | Group | FP  | FN  | Burden |  
    |-------|-----|-----|--------|  
    | A     | 5%  | 15% | Healthy patients enrolled (wastes resources) |  
    | B     | 7%  | 25% | Sick patients denied care (health risk) |  
  - **Stakeholder Choice**:  
    - Option 1: Accept status quo (B bears more FN risk).  
    - Option 2: Lower threshold for B → FN_B ↓ to 18%, but FP_B ↑ to 12% (more healthy B enrolled, diverting slots from A).  
  - **Outcome**: You won’t like this – **escalate to leadership**. Medical ethics may demand Option 2, but it violates "equal resource allocation" policies.  

  **Case 2: Fraud Detection (Tiny Group, Different Base Rate)**  
  - **Context**: Group B (international) has 0.5% prevalence but 15% fraud rate (vs. 2% for Group A).  
  - **Tension**: Tiny size → FPR_B/FNR_B have 95% CI ±8%. At equal thresholds, FNR_B = 40% (vs. FNR_A = 10%).  
  - **Error Allocation Matrix**:  
    | Group | FP    | FN  | Burden |  
    |-------|-------|-----|--------|  
    | A     | 0.3%  | 10% | Legitimate transactions flagged (customer friction) |  
    | B     | 12%   | 40% | Fraud missed (financial loss) |  
  - **Stakeholder Choice**:  
    - Option 1: Lower threshold for B → FNR_B ↓ to 25%, but FP_B ↑ to 20% (high false alarms for B).  
    - Option 2: Reject model → "Cannot certify" due to unreliable metrics for B.  
  - **Outcome**: **Refuse to ship**. Tiny group + high uncertainty = indefensible fairness claims.  

  ---

  #### **Where the Frame Breaks**  
  1. **Downstream Human Decisions**:  
     - If humans override model scores (e.g., fraud analyst dismisses flags), the error allocation may not reflect reality. Requires simulation.  
  2. **Intersectional Groups**:  
     - Fails if tensions exist *within* subgroups (e.g., Black women vs. Black men). Solution: Audit key intersections if sample sizes allow.  
  3. **Long-Term Impacts**:  
     - Does not capture feedback loops (e.g., care denials reduce future health data from Group B).  

  #### **What the Procedure Cannot Do**  
  - **Create Fairness From Unfair Data**: If the protected attribute is a bad proxy or data is missing, it can only flag—not fix.  
  - **Resolve Value Conflicts**: When stakeholders insist on mathematically impossible metrics, it forces escalation but cannot reconcile ethics vs. legality.  
  - **Handle Non-Exhaustive Groups**: If the "protected attribute" misses vulnerable populations (e.g., non-binary gender not recorded), trade-offs are incomplete.  
  - **Predict Legal Liability**: Flags risks but cannot guarantee compliance (e.g., disparate impact law varies by jurisdiction).  

  **Final Output**: A signed error allocation matrix or a "REFUSE TO SHIP" ticket with explicit reasons. This forces accountability: *You’re not choosing "fairness"—you’re choosing who bears the cost of errors.*
