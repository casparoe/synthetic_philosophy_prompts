answer: |-
  ### 1. Essay Question (118 words)
  Analyze the dispute over the granite vole's cranial patch using the Gould-Lewontin critique. Distinguish three interpretations of their critique: (a) a methodological claim about untestable "just-so stories", (b) an empirical claim about the rarity of adaptations, and (c) a claim about *default explanatory priority* for selection. Explain which interpretation(s) survive the objection that the critique is either trivially true (biologists know constraints exist) or self-undermining (it uses adaptive arguments). Define how a "spandrel" differs from a bare constraint and an exaptation, and why calling a trait a spandrel is description-relative. Using the case, specify evidence distinguishing adaptation from byproduct hypotheses, address whether survival correlation refutes the byproduct claim, and explain how the critique reshapes explanatory satisfaction.

  ---

  ### 2. Model Answer (548 words)

  The Gould-Lewontin (G-L) critique targets not adaptationism’s core truth, but its methodological hegemony and explanatory shortcuts. Interpretation (a) is methodological: adaptationism risks generating unfalsifiable narratives by treating every trait *as if* it were an adaptation, potentially ignoring alternatives. Interpretation (b) is empirical: G-L argued a *significant fraction* of traits are non-adaptive byproducts (spandrels) or constraints, not direct products of selection. Interpretation (c) is normative: adaptationism wrongly grants selection *default explanatory priority*; alternatives (constraints, drift, exaptation) should be considered first or equally.

  The "trivially true" objection (all biologists acknowledge constraints) fatally undermines interpretation (b). If G-L merely claimed *some* traits are non-adaptive, it’s uncontroversial and thus trivial. Interpretation (a) also struggles: while identifying bad methodology is valid, the charge of inherent untestability is overstated, as rigorous selection tests exist. Interpretation (c), however, survives: it challenges the *presumption* that selection is the *primary* explanation needing disproof, shifting the burden of proof. This isn't trivial (it demands methodological reform) nor self-undermining (it critiques priority, not the use of adaptationist logic *when warranted*).

  A **spandrel** is a necessary byproduct of structural design or developmental processes, initially non-functional. It differs from a **bare constraint** (e.g., physical impossibility limiting form, like bone rigidity), which prevents certain outcomes, whereas a spandrel *produces* a specific feature. It differs from an **exaptation** where a spandrel (or other trait) is later co-opted for a new function. "Spandrel" is description-relative: a feature’s status depends on trait decomposition. The cranial patch might be a necessary byproduct *of skull growth plate mechanics under stress* (making it a spandrel relative to skull development), but if selection directly modified *the patch itself* for protection, it’s an adaptation relative to that specific trait. The label depends on the focal level of analysis.

  **Evidence distinguishing hypotheses:** To test the adaptation (protection) hypothesis, seek evidence of *specific design*: e.g., the patch’s microstructure/material optimally resists abrasion beyond what mechanics alone predict; its development is accelerated/calibrated to substrate abrasiveness independent of general stress; genetic variation *for patch properties* correlates with survival. The byproduct/spandrel hypothesis predicts: the patch’s properties are fully explained by general skull mechanics/stress responses; its thickness is an unavoidable correlate of overall skull robustness under load; ablating/modifying the patch disrupts skull integrity, not just abrasion resistance.

  **Survival correlation:** Correlation with survival does *not* refute the byproduct hypothesis. The patch could be a mechanical byproduct (spandrel) co-opted as an **exaptation** providing incidental protection. Survival correlation indicates *current utility*, not whether the trait *originated* via selection for that utility. Adaptation requires evidence of historical *origin* via selection *for* protection.

  **Reshaping explanatory satisfaction:** The G-L critique, especially interpretation (c), changes what counts as satisfying. Merely demonstrating the patch *is* protective (current utility) and correlated with survival is insufficient for an *adaptationist* explanation. A satisfying explanation must: (1) actively consider and test plausible non-selective origins (e.g., the mechanical byproduct hypothesis); (2) provide evidence *for* selection acting *on the specific patch trait* (e.g., specific design, historical evidence), not just evidence consistent with it; and (3) justify why selection is prioritized over constraint/byproduct origins. Satisfaction requires showing the trait isn't *merely* an exapted byproduct and that selection played a formative role.

  ---

  ### 3. Marking Scheme (20 marks total)

  1.  **Distinguishing G-L Interpretations (5 marks):** Correctly identifies and distinguishes (a) methodological/testability, (b) empirical claim about prevalence, (c) claim about explanatory priority/default.  
      *Error:* Conflating interpretations (e.g., treating (c) as identical to (a) or (b)) or misrepresenting them (e.g., saying (c) claims adaptationism is false).

  2.  **Surviving the Objection (4 marks):** Correctly argues interpretation (b) is fatally weakened by the "trivially true" objection, interpretation (a) is partially vulnerable, and interpretation (c) survives as it challenges explanatory norms without being trivial or self-refuting.  
      *Error:* Claiming all interpretations survive equally, or failing to explain *why* (c) survives while others don't.

  3.  **Spandrel Definition & Distinction (4 marks):** Accurately defines spandrel as a necessary byproduct, distinguishes it from a bare constraint (limits possibilities) and an exaptation (co-opted function), and explains description-relativity (trait status depends on focal level of analysis).  
      *Error:* Equating spandrel with any constraint, confusing spandrel with exaptation, or failing to grasp description-relativity.

  4.  **Application to Vole Case (4 marks):** Proposes valid evidence distinguishing adaptation (specific design, independent development link to substrate) from byproduct (explained by general mechanics, disruption harms structure); Correctly states survival correlation doesn't refute byproduct (due to possible exaptation); Explains how G-L (esp. (c)) demands more than utility/survival correlation (needs evidence *for* selection's role in origin/specific design, consideration of alternatives).  
      *Error:* Claiming survival correlation refutes byproduct; suggesting only adaptation explains utility; proposing irrelevant evidence; failing to link G-L to higher explanatory standards.

  5.  **Avoiding Conflation Errors (3 marks):** Avoids conflating adaptation with current utility, function with origin, or treating the G-L critique as simply claiming "not all traits are adaptations." Maintains clear distinction between spandrel, exaptation, and constraint.  
      *Error:* Equating "has a function" with "is an adaptation"; treating exaptation as synonymous with adaptation; framing G-L only as denying the empirical prevalence of adaptations.
