prompt: |-
  I'm producing a short-run podcast on constitutional theory, and the guest for an upcoming episode is a philosopher who has spent the past several years developing and defending what she calls a trusteeship model of constitutional precommitment. On her view, a founding assembly holds its authority in trust for the future citizens who will live under the constitution it writes, and entrenchment is legitimate only insofar as it preserves the capacity of later majorities to govern themselves — never when it merely locks in a substantive policy outcome the founders happened to favor. She pairs this with a distinction she draws between precommitment against passion (binding yourself because you expect to be temporarily irrational) and precommitment against judgment (binding yourself because you expect to revise your ends for reasons you now think poor), and she claims that only the former can justify entrenchment. Her habitual move when a hard case is raised is to redescribe it as an abuse of the institution rather than a defect in the theory; part of my job is to make that move progressively harder to reach for.

  Draft eight to ten interview questions that go beyond having her restate the view. The sequence should include, at minimum: one question on the accountability gap in the trusteeship metaphor (a trust normally presupposes a beneficiary who can call the trustee to account, and future citizens cannot); one on the passion/judgment distinction, pressing on who adjudicates at the moment of revision which kind of change is underway, and whether that adjudication is itself reliable; one on the succession problem, where the generation that bound itself is dead and the bound generation never agreed, and asking whether the precommitment analogy survives when binder and bound are not plausibly the same agent; one on whether her preservation-of-capacity condition can itself be entrenched without collapsing into the substantive entrenchment she rejects; and one that puts to her a device I have constructed for the episode, which I call the sunset proviso — a rule under which every entrenched clause lapses at fixed intervals unless re-ratified by the generation then living — asking whether her model can accept the proviso and whether accepting it leaves entrenchment with any work to do. Close with a question about what evidence, case, or argument would count against the model rather than merely complicate it.

  For each question, anticipate the answer she is most likely to give and supply a follow-up keyed to that answer, so that the follow-up only makes sense given the reply it follows. Do not include warm-up or background questions, and do not ask her to name the thinkers she is drawing on.

  Return the result as a JSON array of objects, one per question, using exactly these fields: "id" (a two-digit string, in order), "question" (the question to put to her, phrased as I would say it aloud), "target" (the specific commitment or distinction in her position the question aims to pressure, in one sentence), "likely_reply" (the answer she is most likely to give, in one or two sentences), and "follow_up" (the question to ask next, given that reply).
reasoning: |-
  We are drafting 8-10 interview questions for a podcast on constitutional theory. The guest has a trusteeship model of constitutional precommitment. The questions must avoid restating the view and instead pressure specific aspects. We have specific required questions and a structure for each (id, question, target, likely_reply, follow_up). We must include at least:
   1. Accountability gap in trusteeship (future citizens can't hold founders accountable)
   2. Passion/Judgment distinction (who adjudicates and is it reliable?)
   3. Succession problem (binder dead, bound never agreed - same agent?)
   4. Preservation-of-capacity entrenchment (can it be entrenched without collapsing into substantive entrenchment?)
   5. Sunset proviso (device: entrenched clauses lapse unless re-ratified - does it leave entrenchment with work?)
   6. Close: what evidence/case/argument would count against the model?

   We'll aim for 8 questions. We'll structure the required ones and add 2-3 more to cover other potential pressures.

   We are to provide for each:
     id: two-digit string (01, 02, ...)
     question: as we would say aloud
     target: one sentence on the commitment or distinction being pressured
     likely_reply: 1-2 sentences of her most likely answer
     follow_up: a question that follows from that reply (so it must be contingent on the reply)

   Let's plan the sequence:

   01. Accountability gap.
   02. Passion/Judgment distinction (adjudication problem).
   03. Succession problem.
   04. Preservation-of-capacity condition and entrenchment (circularity?).
   05. Sunset proviso device.
   06. What counts against the model? (closing question)

   We need two more. Possibilities:
     - A question about the distinction between locking in policy vs. preserving capacity: how to draw the line?
     - A question about the abuse vs. defect response: when does a case become so common that it's a defect?
     - Or one on how the trusteeship model handles the fact that the founders have their own substantive biases even when trying to set up a framework.

   Since the guest tends to redescribe hard cases as abuse, we might press on that.

   We are instructed to avoid warm-up and background.

   Let's design the 8 questions:

   01. Accountability gap in trusteeship.
   02. Passion/Judgment distinction (adjudication).
   03. Succession problem.
   04. Line-drawing: how can we tell if an entrenchment is preserving capacity or locking in policy?
   05. Preservation-of-capacity entrenchment (can we entrench the condition?).
   06. Sunset proviso.
   07. Abuse vs. defect: at what point does a pattern of abuses become a theoretical defect?
   08. What evidence would count against the model?

   But note: the sunset proviso and the entrenchment of the preservation condition are distinct.

   Alternatively, we can do:

   01. Accountability gap
   02. Passion/Judgment adjudication
   03. Succession
   04. Entrenching the preservation condition (to avoid collapse into substantive entrenchment)
   05. Sunset proviso
   06. How to distinguish between preserving capacity and locking in policy (since she rejects the latter, how do we know when we have one vs the other?)
   07. Abuse vs defect: when does it become a defect?
   08. What counts against?

   Let's go with 8.

   Now, for each, we must anticipate the likely reply and then a follow-up that keys off that reply.

   We'll write in a conversational tone for the questions.

   Let's go step by step.

   Question 01: Accountability gap.
     Target: The trust metaphor's requirement for beneficiary accountability, which future citizens cannot provide.
     Question: "In a typical trust, beneficiaries can hold trustees accountable. But future citizens can't monitor or sanction the founders. Doesn't that undermine the trust analogy, since the founders are effectively unaccountable?"
     Likely reply: She might say that the accountability is built into the moral constraints of the trust itself — that trustees are bound by fiduciary duties and the founders are similarly bound by the moral duty to future generations, which is enforced by the constraints of the model (e.g., only entrenching for passion-precommitment and for preserving capacity).
     Follow-up: If she says that the duty is inherent and self-enforcing, we can press: "But without the possibility of external enforcement or beneficiary oversight, how can we be sure that the founders are genuinely acting as trustees and not just imposing their own will under the guise of trusteeship?"

   Question 02: Passion/Judgment distinction adjudication.
     Target: The difficulty in determining at the moment of constitutional change whether a proposed change is driven by passion or judgment.
     Question: "You distinguish precommitment against passion from precommitment against judgment. But when a later generation wants to amend an entrenched provision, who decides whether they are acting on passion or judgment? And how can that decision avoid being a judgment call itself?"
     Likely reply: She might say that the founders design the constitution with institutional mechanisms (like supermajority requirements, cooling-off periods) that help screen for passion, and that the distinction is based on the nature of the change (whether it undermines the very capacity for self-governance).
     Follow-up: "But if the founders design the mechanisms, doesn't that just push the problem back — because they must anticipate the kinds of passion that might arise, and might get it wrong? And if the distinction is based on the nature of the change, isn't that substantive, which your model tries to avoid?"

   Question 03: Succession problem.
     Target: The issue that the binder (founding generation) is dead and the bound generation never agreed to be bound.
     Question: "When the founding generation binds future generations, but then dies off, how can we say the future generation is bound by their own will? How does your precommitment model survive when the agent binding and the agent being bound are not the same?"
     Likely reply: She might argue that the trusteeship model is precisely designed for this — the founders act as agents for the future citizens, so the binding is done on their behalf and in their interest, not as an imposition of an alien will.
     Follow-up: "But if the future generation never consented to the founders acting as their agents, and if they now, as a majority, wish to change the constitution, doesn't the trusteeship model risk becoming paternalistic by preventing them from exercising their own judgment about what is in their interest?"

   Question 04: How to distinguish preserving capacity from locking in policy?
     Target: The difficulty in drawing a line between procedural/structural entrenchment (which preserves capacity) and substantive entrenchment (which locks in policy).
     Question: "Your model allows entrenchment only to preserve the capacity for self-governance, not to lock in substantive policies. But in practice, how do we tell the difference? For example, if a founding generation entrenches a bill of rights, isn't that both preserving a framework for self-governance and locking in specific values they favored?"
     Likely reply: She might say that a bill of rights, if properly designed, protects the preconditions for self-governance (like free speech, assembly) and thus is about capacity, not about specific policy outcomes. She would argue that there is a clear distinction between protecting the process and protecting a particular result of that process.
     Follow-up: "But what about when a bill of rights includes substantive rights, like property rights, that might entrench economic arrangements? Doesn't that blur the line? And if the founders have to make a judgment about what counts as a precondition for self-governance, isn't that judgment itself substantive and subject to their own biases?"

   Question 05: Entrenching the preservation-of-capacity condition.
     Target: The potential circularity if the preservation-of-capacity condition is itself entrenched.
     Question: "Can the preservation-of-capacity condition — that entrenchment must only preserve the capacity for self-governance — itself be entrenched? If not, why not? If so, doesn't that entrench a substantive principle, which your model rejects?"
     Likely reply: She might say that the preservation condition is a meta-principle that is not substantive but structural, and therefore can be entrenched because it is about maintaining the framework for self-governance. Alternatively, she might say it cannot be entrenched because it would then become too rigid and might prevent future generations from adjusting the framework.
     Follow-up: If she says it can be entrenched: "But then isn't that meta-principle itself a substantive commitment to a particular conception of self-governance? And if future generations disagree with that conception, why should they be bound by it?" If she says it cannot be entrenched: "Then what prevents a future majority from jettisoning the preservation condition and entrenching their own preferred policies?"

   Question 06: Sunset proviso.
     Target: The device: every entrenched clause lapses unless re-ratified. Does it leave entrenchment with work?
     Question: "I'd like to put to you a device I call the sunset proviso: a rule that every entrenched clause automatically lapses, say every 30 years, unless actively re-ratified by the generation then living. Would your model accept this proviso? And if so, doesn't that make entrenchment so temporary that it loses its precommitment function?"
     Likely reply: She might say that the sunset proviso is actually consistent with her model because it ensures that the entrenchment is only binding for a generation and that the future generation can re-evaluate, but she might also worry that it undermines the point of precommitment against passion because in the moment of passion they might let the clause lapse or re-ratify in error.
     Follow-up: If she accepts it: "But then, doesn't the sunset proviso effectively turn every entrenched clause into a non-entrenched one after a period? And if precommitment is meant to bind across generations, doesn't that defeat the purpose?" If she rejects it: "But without such a mechanism, how can we ensure that the entrenchment remains a tool for preserving capacity and not a tool for imposing the founders' will indefinitely?"

   Question 07: Abuse vs. defect.
     Target: Her tendency to redescribe hard cases as abuse; when does it become a theoretical defect?
     Question: "You often respond to hard cases by redescribing them as abuses of the institution rather than defects in the theory. But at what point does a pattern of recurring abuses — say, founders repeatedly entrenching their own policies under the guise of preserving capacity — become a problem for the theory itself?"
     Likely reply: She might say that the theory sets out the ideal conditions for legitimate entrenchment, and when real-world cases diverge, it is an implementation failure, not a flaw in the theory. She might add that the theory provides the standard by which we can criticize the abuses.
     Follow-up: "But if the ideal conditions are so rarely met, and if the theory cannot prevent or even predict these abuses, doesn't that suggest the theory is utopian and not a practical guide for constitutional design?"

   Question 08: What counts against.
     Target: What evidence or argument would falsify the model.
     Question: "Finally, what kind of evidence, historical case, or argument would you accept as counting against your model — not just complicating it, but showing that it is fundamentally flawed?"
     Likely reply: She might say that if it could be shown that there is no meaningful way to distinguish between precommitment against passion and precommitment against judgment, or that the trusteeship model inevitably leads to worse outcomes for self-governance, then that would be a challenge.
     Follow-up: "But if the distinction between passion and judgment is inherently contestable, as we discussed earlier, doesn't that already suggest the first? And as for outcomes, how would we measure whether self-governance is better or worse under your model versus alternatives, given that self-governance is a contested concept?"

   Now, we must format as a JSON array of objects with the exact fields.

   Let's write the JSON.

   Note: We must have at least 8 questions. We have 8 here.

   We'll write the objects accordingly.
