answer: |-
  Here is a verdict on *Yates* as a case study in textualism vs. purposivism, addressing your specific queries with calibrated confidence:

  **Verdict:** *Yates* is **not** a clean textualism-versus-purposivism case. The core disagreement was an **intra-textualist dispute about the scope of relevant "context"** when defining statutory terms. The real axis was whether "tangible object" should be read in its **linguistic isolation** (dissent) or **contextually constrained by the statute's structure and surrounding provisions** (plurality). Alito's concurrence was the only genuinely purposivist opinion. This case exposes textualism as a spectrum of methods and reveals that the fiercest battles often concern *which* contextual clues are deemed part of the "text" itself.

  **Confidence:** 85%. The voting alignment, reasoning, and canons invoked strongly support this reading. The absence of classic purposivist arguments (legislative history, broad statutory aims driving interpretation) in the plurality and dissent is telling.

  ---

  **Analysis: Framing & Sorting the Opinions**

  1.  **The Plurality (Ginsburg): Contextual Textualism, Not Stealth Purposivism:**
      *   **Method:** Primarily **textualist**, heavily reliant on semantic canons (*noscitur a sociis*, *ejusdem generis*) and structural context (title, placement within SOX, relationship to neighboring §1512(c)(1)). It treats the *statute itself* as the primary source of meaning.
      *   **Purpose's Role:** The purpose of SOX (financial fraud) is **used as contextual evidence to resolve ambiguity**, *not* as an independent source of meaning overriding the text. The plurality argues the *textual context* (surrounding words, structure, headings) points *towards* that purpose, narrowing "tangible object." It doesn't say "SOX is about fraud, therefore fish aren't covered"; it says "the *words chosen and how they are arranged* show Congress meant objects *like* records/documents." Purpose illuminates context; it doesn't displace text.
      *   **Canons:** The canons (especially *noscitur a sociis* and *ejusdem generis*) are the **primary engines of the analysis**, not mere veneer. They provide the framework for interpreting "tangible object" relative to "record, document."
      *   **Rule of Lenity:** Played a minor, supporting role ("reinforces our reluctance to adopt the Government’s expansive reading"). Not the driving force, likely due to the perceived mismatch between the harsh penalty and the conduct, but the severity underscored the need for clarity.

  2.  **The Dissent (Kagan): Linguistic Textualism:**
      *   **Method:** **Textualist**, focusing on the "ordinary meaning" of "tangible object" in linguistic isolation. It prioritizes dictionary definitions and common usage over structural or purposive context.
      *   **Purpose's Role:** Explicitly rejects using SOX's overarching purpose to narrow the plain text. Argues that if Congress wrote broad language, it must be applied broadly, regardless of the triggering event. Purpose might explain *why* Congress wrote it broadly, but it doesn't alter what the words say.
      *   **Canons:** Minimizes the relevance of *noscitur a sociis* and *ejusdem generis* here, arguing "record, document" and "tangible object" are distinct categories, not a list where the latter is constrained by the former. The canon against surplusage is used *against* the plurality, arguing the government's reading doesn't actually render §1512(c)(1) superfluous.

  3.  **Alito's Concurrence: Purposivism:**
      *   **Method:** **Purposivist.** He explicitly looks to the "background" of SOX (Enron scandal, destruction of *physical evidence* like audit documents) to define "tangible object." He argues that while the text *might* linguistically cover fish, applying it here would exceed Congress's *discernible purpose*. He prioritizes the *reason for the statute* over a potentially overbroad literal reading.

  **The Textualist Paradox:**
  *   The alignment (Scalia/Thomas with Kagan; Breyer/Sotomayor with Ginsburg) **is surprising but revealing**. It shows textualism isn't monolithic:
      *   **Kagan/Scalia/Thomas:** Emphasized **linguistic meaning at the phrase level** ("tangible object"). Context (SOX's purpose/structure) was irrelevant to the word's *definition*.
      *   **Ginsburg/Roberts/Breyer/Sotomayor:** Emphasized **contextual meaning derived from the statute's structure and word relationships**. The *statutory context* defines the term.
  *   This doesn't mean textualism failed; it demonstrates its **internal spectrum**. The core disagreement was about *which level of textual context is controlling*: the immediate phrase vs. the entire statutory framework.

  **Legislative Purpose:**
  *   SOX's purpose (financial fraud) **genuinely bears on the case** as the *reason Congress acted* and the *problem it sought to solve*. It helps explain the statute's existence.
  *   **Plurality:** Used purpose **indirectly**, as evidence *corroborating* their textual/contextual reading. The structure (title, placement) *suggested* the purpose, which made a narrow reading plausible.
  *   **Dissent:** Argued purpose is **irrelevant to defining unambiguous words**. Broad language must be applied broadly.
  *   **Alito:** Used purpose **directly** to *limit* the text's scope.
  *   The plurality didn't *need* purpose; their textual canons were sufficient for their reading. The purpose was reinforcing evidence, not the foundation.

  **The Case Onto the Theory: Key Insights**

  1.  **Textualism is a Family of Methods:** *Yates* **conclusively proves** textualism encompasses diverse approaches. The fracture line is often **how much statutory context is deemed relevant** for word meaning. Is the "text" just the phrase, the section, the Act's structure, or its relationship to other laws? (Confidence: 95%).
  2.  **Disagreement over "Context-as-Text":** The core fight wasn't "text vs. purpose," but **which contextual materials are inherent to the text's meaning** for a textualist. The dissent saw "tangible object" as having a fixed meaning; the plurality saw its meaning as defined by its surrounding statutory company. (Confidence: 90%).
  3.  **Coherent Textualism Either Way?** Yes. A textualist could plausibly:
      *   **Broad Reading (Dissent):** Focus on the plain meaning of the phrase "tangible object," supported by dictionary definitions. Argue canons like *noscitur a sociis* are weak when categories are distinct.
      *   **Narrow Reading (Plurality):** Focus on the *entire phrase* "any record, document, or tangible object," applying *noscitur a sociis*/*ejusdem generis* rigorously. Argue structural context (title, placement, relationship to §1512(c)(1)) confirms the grouping is information-centric.
      *   **Choosing:** A textualist theory needs principles for *which* context wins in conflict. *Yates* shows this often involves judgments about statutory coherence, avoidance of absurdity/surplusage, and the relative weight of different canons – moving towards a more holistic, "whole act" textualism. (Confidence: 85%).
  4.  **Constraint Claim Undermined:** *Yates* is **strong evidence against** the simple claim that textualism inherently constrains judges more than purposivism.
      *   **Dissent's Broad Reading:** Could lead to expansive federal criminal liability for destroying *any* physical evidence, a significant constraint *lift*.
      *   **Plurality's Narrow Reading:** Creates a potentially arbitrary line (information-bearing objects only), requiring judicial line-drawing in future cases.
      *   **Alito's Purposivism:** Explicitly relies on judicial assessment of legislative purpose, a traditional source of discretion.
      *   **The Constraint:** Came not from the *method* per se, but from each Justice's *application* of their chosen method and their view of the relevant context. Neither side demonstrated inherently greater constraint; they applied different kinds of reasoning leading to different results. (Confidence: 80%).

  **Conclusion:** Your framing slightly misdescribed the core divide. *Yates* is less about textualism *versus* purposivism and more a **clash within textualism** over the primacy of linguistic meaning versus statutory-structural context. Alito stood apart as the purposivist. This case powerfully illustrates that textualism is not a single, constraining algorithm. It encompasses a range of approaches where the crucial – and often contentious – question is: **"What constitutes the relevant 'text' for interpretation?"** The dispute over "tangible object" was fundamentally a dispute over how much of the statute counts as the word's defining context. This complexity is inherent, not necessarily a defect, but it complicates claims that textualism offers a simple, objective solution to hard cases.
