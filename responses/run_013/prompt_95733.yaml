answer: |-
  Let's break down Aquinas's argument in plain language, separating his core ideas from later interpretations like the "double-effect doctrine" you're referencing. Here's what's happening in this passage:

  **1. The Core Framework: Intention vs. Foreseen Consequence**
  *   **One Act, Two Effects:** An action can have multiple results. Only one is *intended* (the goal you aim for), while others are merely *foreseen* but not intended (side effects).
  *   **"Species" = Moral Classification:** The *type* of moral act you're performing (e.g., self-defense vs. murder) is defined **solely by what you intend**, not by side effects you foresee but don't aim for.
  *   **Self-Defense Example:** If you defend yourself against an unjust aggressor:
      *   **Intended Effect:** Saving your own life.
      * **Foreseen (but Unintended) Effect:** The aggressor's death (because stopping them might kill them).
  *   **Moral Status:** Since your *intention* is self-preservation (a good thing), the act itself is classified as "lawful self-defense," *even though you foresee the aggressor might die*. The death isn't what you *want*; it's an unwanted consequence of achieving your legitimate goal of survival.

  **2. The Crucial Constraints:**
  Aquinas adds two essential limits to make self-defense lawful:
  *   **Proportionality ("Out of Proportion to the End"):** Your defensive force must be *necessary* and *moderate*. Using excessive force (e.g., shooting a thief stealing your wallet) makes the act unlawful. This is about the *means* used to achieve the intended good end. It's **different from** the "means/end" rule you mentioned. Proportionality asks: "Was the *level of force* reasonable?" The "means/end" rule asks: "Was the bad effect *itself* used as the tool?"
  *   **The Forbidden Intention ("Intend Killing"):** You absolutely **cannot intend the aggressor's death** as your goal. Your intention *must* be solely to save your own life. If you *aim* to kill them, even in self-defense, that act becomes unlawful *for a private individual*. Only public authorities can lawfully intend to kill (e.g., a soldier, executioner).

  **Addressing Your Specific Questions:**

  1.  **Why can't I "intend" the killing if it saves my life?**
      *   Aquinas uses "intend" **very narrowly here.** He means **aiming at death *as an end in itself* or *as a chosen means*.** In lawful self-defense:
          *   **Your Intended End:** Saving your life.
          *   **Your Chosen Means:** Using necessary force to stop the attack.
      *   The aggressor's death is **neither** your end **nor** your chosen means. It is a *foreseen but unintended consequence* of the force you used to stop them. You *choose* to use force necessary to stop them; you merely *foresee* that this force might kill them. You *permit* the death as an unwanted side effect; you do not *choose* it. If killing them *is* your chosen means to stop the threat (e.g., you have a non-lethal option but choose lethal force anyway), or if you *want* them dead, then you *intend* the killing, and it becomes unlawful.

  2.  **Proportionality vs. "Using Death as a Means":**
      *   **Proportionality** is a **separate constraint** focused on the *amount* of force used. It asks: "Was the force *excessive* for achieving the legitimate goal?"
      *   The prohibition against **intending death (as a means or end)** is a **deeper constraint** about the *object* of your will. It forbids you from making someone's death part of your plan, either as the goal or as the tool you actively choose to wield.
      *   They work together: Your intention must be good (saving life, not killing), *and* the force you use to achieve that must be proportional.

  3.  **Your Friend on "Species":**
      *   Your friend is **largely correct.** When Aquinas says the act's "species" is defined by intention, he's talking about **classifying the fundamental *type* of act** (e.g., "defensive act" vs. "homicidal act"). This classification is crucial *for* determining permissibility, but it's the *first step*. A good "species" (e.g., self-defense) makes the act *potentially* lawful, but it still needs to pass the proportionality test and avoid the forbidden intention of killing. "Species" tells you *what kind of thing you did*; the constraints tell you if *that kind of thing* was done rightly in this case.

  **The Trolley Problem & Aquinas:**

  Your trolley case **pushes Aquinas's framework to its limit and arguably breaks it.** Here's why:

  1.  **The Problem:** The death of the one person **isn't merely a foreseen side effect;** it's the *mechanism* by which the five are saved. His body physically stops the trolley. His death is the *direct cause* of their survival. You *need* him to be hit to save them.
  2.  **Aquinas's Analysis (Likely):**
      *   **Intention:** Your primary intention is to save the five lives (a good end).
      *   **The Killing:** However, you are **intentionally using the one person's death *as the means* to save the five.** You are *choosing* to bring about his death *because* it is the instrument that stops the trolley. His death isn't just an unwanted consequence of diverting the trolley *away* from the five onto a track where he *happens* to be (a classic double-effect case Aquinas *could* accommodate). Here, you divert the trolley *onto him* precisely *so that* he stops it.
  3.  **Conclusion under Aquinas:** Aquinas would **almost certainly say your act is unlawful.** Why?
      *   **Intention of Killing (as a Means):** You *intend* the one person's death *as the chosen means* to save the five. You are actively choosing to kill him to achieve your good end. This violates the absolute prohibition: "it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority." Saving others isn't self-defense, but the principle against private individuals intending killing holds.
      *   **"Beside the Intention"?** The death is not "beside the intention"; it's *central* to your chosen plan. The two-effects model relies on the bad effect being *incidental* to achieving the good effect through a *direct* action (e.g., stopping the aggressor *directly* saves you; his death is an indirect, unwanted result of the force needed). In your trolley case, causing the death *is* the direct action that achieves the good effect.

  **In Plain Language Summary of Aquinas's Point:**

  *   It's okay to defend yourself, even if you *know* the attacker *might* die, **as long as:**
      1.  **Your ONLY goal** is to save your own life (you don't *want* them dead or *choose* killing as your method).
      2.  **You use only the force absolutely needed** to stop them (no overkill).
  *   **The death must be an UNWANTED ACCIDENT** of using necessary force to stop the attack. **It cannot be the TOOL you pick to stop them.**
  *   **You, as a private person, can NEVER morally CHOOSE to kill someone** (aim for it or pick it as your method). Only the government can do that for the common good.
  *   **Your trolley case:** Because you *need* the one person to die *as the tool* to save the five, Aquinas would say you are *intending* to kill him (as a means), which is forbidden.

  Aquinas provides the *seeds* of double-effect (foreseen vs. intended, proportionality), but his framework here is primarily about **self-defense** and the **absolute prohibition on private individuals *intending* killing.** Your trolley case, where harm is the necessary mechanism for good, falls outside the scope of what he's trying to justify in this specific passage. He would likely condemn it based on the prohibition against intending the death of an innocent person as a means.
