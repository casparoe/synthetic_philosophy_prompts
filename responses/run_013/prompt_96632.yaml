  ### Moore's Paradox: Diagnostic Decision Tree  
  **Handout for Grad Seminar**  

  ---

  #### 1. Cases: Specimen Sentences  
  *Each case isolates a specific aspect of Moorean absurdity. Use these to test your intuitions before applying the tree.*  

  - **Plain**: "It's raining but I don't believe it's raining." *Tests the core absurdity in first-person present tense.*  
  - **Other direction**: "It's raining but I believe it isn't raining." *Tests asymmetry: does a contrary belief (not just lack) trigger the same absurdity?*  
  - **Past tense (mixed)**:  
    - (a) "It was raining but I didn’t believe it was." *Fine. Tests temporal alignment of fact and belief.*  
    - (b) "I was at the pictures last Tuesday but I don’t believe I was." *Absurd. Tests present self-knowledge about past facts.*  
  - **Third person**: "It's raining but you/she doesn’t believe it is." *Not absurd. Tests whether the problem requires the speaker as the believer.*  
  - **Mere thought**: *Thought:* "It's raining but I don’t believe it is." *Tests whether absurdity depends on public assertion or persists in private thought.*  
  - **Embedded**: "Suppose it’s raining and I don’t believe it is; then my umbrella is pointless." *Tests absurdity in supposition (non-assertoric context).*  
  - **Knowledge version**: "It's raining but I don’t know it’s raining." *Tests generalization to attitudes beyond belief (e.g., knowledge norms).*  
  - **Doubt version**: "It's raining but I doubt it is." *Tests whether weaker attitudes (doubt) yield milder or distinct absurdity.*  
  - **Group**: "The evidence supports \(p\) but we don’t believe \(p\)." *Tests collective subjects: same absurdity, different, or none?*  
  - **Non-speaker**: A sign/voice assistant says: "It’s raining but I don’t believe it is." *Tests whether absurdity requires a mindful agent.*  

  ---

  #### 2. The Tree  
  *Start here. Answer sequentially about the case you’re diagnosing. Branch nodes are questions you can resolve without theory-laden assumptions.*  

  **Q1. Is the absurdity still present if the sentence is only *thought*, not spoken?**  
  - **Yes** → Go to Q3.  
  - **No** → Go to Q2.  

  **Q2. Does the absurdity disappear when the belief clause is about *someone else* (e.g., third-person case)?**  
  - **Yes** → Go to Q6.  
  - **No** → Go to Q7.  

  **Q3. (Thought absurd) Does the absurdity persist in *supposition* (e.g., embedded in an "if" or "suppose")?**  
  - **Yes** → Go to Q4.  
  - **No** → Go to Q5.  

  **Q4. (Thought absurd in supposition) Does the absurdity vanish when the belief clause is *past tense and aligned* with the fact clause?**  
  - **Yes** (e.g., past fact + past belief) → Leaf G: Current Self-Knowledge View.  
  - **No** → Leaf D: Contradiction View.  

  **Q5. (Thought absurd, but not in supposition) Is the absurdity equally strong for *doubt* (e.g., "I doubt it") as for *belief*?**  
  - **Yes** → Leaf E: Pragmatic Inconsistency View.  
  - **No** → Leaf H: Doxastic Responsibility View.  

  **Q6. (Absurd only when spoken and first-person) Does the absurdity rely on the *present tense*?**  
  - **Yes** (e.g., past tense mixed case (b) is absurd, but past+aligned (a) is fine) → Leaf G: Current Self-Knowledge View.  
  - **No** (e.g., past tense mixed (b) is still absurd) → Leaf F: First-Person Authority View.  

  **Q7. (Absurd when spoken even about others) Does the absurdity persist for a *non-mindful speaker* (e.g., a sign)?**  
  - **Yes** → Leaf A: Expression-Contradiction View.  
  - **No** → Leaf B: Assertion-Rule View.  

  ---

  #### 3. Leaves: Diagnoses  
  *Each leaf names the core flaw. "Handles worst" indicates a case that challenges the diagnosis.*  

  - **Leaf A: Expression-Contradiction View**  
    *Diagnosis*: Asserting the first clause expresses belief in it, so the second clause contradicts what you expressed, not what you said.  
    *Handles worst*: **Non-speaker** (a sign doesn’t "express" beliefs).  

  - **Leaf B: Assertion-Rule View**  
    *Diagnosis*: Asserting \(p\) requires believing \(p\); the second clause violates this rule by admitting you lack that belief.  
    *Handles worst*: **Mere thought** (absurdity vanishes if not spoken).  

  - **Leaf D: Contradiction View**  
    *Diagnosis*: The sentence is logically inconsistent—truth of \(p\) entails you believe \(p\).  
    *Handles worst*: **Past tense (a)** (not absurd, though logically consistent).  

  - **Leaf E: Pragmatic Inconsistency View** (unnamed)  
    *Diagnosis*: The sentence is consistent but asserting it creates pragmatic tension (e.g., asserting \(p\) pragmatically implies belief in \(p\)).  
    *Handles worst*: **Embedded** (absurdity persists in non-assertoric contexts).  

  - **Leaf F: First-Person Authority View** (unnamed)  
    *Diagnosis*: First-person belief reports are authoritative; denying belief while asserting \(p\) conflicts with this authority.  
    *Handles worst*: **Group** (collective belief lacks the same authority).  

  - **Leaf G: Current Self-Knowledge View**  
    *Diagnosis*: You’re expected to know your current beliefs; asserting \(p\) while denying belief implies ignorance of your own mind.  
    *Handles worst*: **Other direction** (absurdity persists even if you report a *contrary* belief).  

  - **Leaf H: Doxastic Responsibility View** (unnamed)  
    *Diagnosis*: Belief is governed by a norm to align with truth/evidence; the sentence violates this norm.  
    *Handles worst*: **Doubt version** (doubt may not entail the same normative force).  

  ---

  #### 4. Empty Rooms and Collisions  
  *Empty rooms = Answer combinations with no clear position. Collisions = Leaves the tree can’t separate.*  

  - **Empty Rooms**:  
    - *Q7 "Yes" + Non-speaker case*: If a sign’s utterance is absurd, but signs can’t "express" (contradicting Leaf A) or follow "rules" (contradicting Leaf B). Likely **unexplored**—most theories assume a mindful speaker.  
    - *Q4 "No" + Past tense (b)*: If past+misaligned is absurd, but not a contradiction (avoiding Leaf D). **Unattractive**—few deny past self-ignorance is possible.  
    - *Group case + Leaf F/G/H*: Groups lack first-person authority or individual rationality. **Unexplored**—theories rarely extend cleanly to collectives.  

  - **Collisions** (tree can’t separate these leaves):  
    - **Leaf E (Pragmatic) vs. Leaf B (Rule)**: Both target assertion, but Leaf E focuses on contextual implications, Leaf B on constitutive rules. The tree can’t split them cleanly—Q5 may force a choice via doubt, but positions often blend.  
    - **Leaf G (Self-Knowledge) vs. Leaf F (Authority)**: Both require first-person present tense; the tree distinguishes via tense alignment (Q4/Q6), but some cases (e.g., doubt) make them overlap.  

  **Purpose Achieved**: This tree blocks lazy appeals to "contradiction" (Leaf D is hard to reach) and forces engagement with cases. Test each leaf against the specimens—if it fails, climb back up!  

