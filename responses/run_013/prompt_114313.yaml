prompt: |-
  I just had a two hour row with a mate about the centipede game and we ended up going in circles. He thinks the whole thing turns on common knowledge of rationality, full stop. I think that's too quick: the real tangle is whether backward induction is a theorem about what we mean by rational agency or an empirical prediction about how people actually play, and what happens once you replace common knowledge with something weaker — players who are only almost sure the other is rational, or who think there's a small chance the other is a backward-induction type and a small chance they're a trust type, or who have trembling-hand-style doubts at each node. If you had three years and a philosophy/decision-theory toolkit, which open questions in this area would you actually prioritise, and in what order? I care less about the list than about the dependency structure: what's upstream of what, what's tractable without running new experiments, and what would genuinely shift the debate. And please say how confident you are in the ranking, and which call you're least sure about.
