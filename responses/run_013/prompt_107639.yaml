prompt: |-
  I'm putting together a handout for my reading group on Parfit's hitchiker — the desert one, where you're stranded and someone offers you a lift to town on the condition that you promise to pay them once you arrive, and you can already see that the you who arrives will have no reason at all to hand over the money (and the driver can see it too, which is the whole problem). I want a villanelle for it. The two refrains should be the promise and the refusal — the words you say in the desert and the words you'd say in the town — and I'd like them to differ by just a single word, so the repetition is almost exact and the whole dilemma lives in that one hinge. The form should do the work: the lines keep coming back, and each time the ground under them has shifted, which is exactly what happens to a promise made by one version of you and inherited by another. Close where Parfit actually lands — that the promise has to be kept by the desert you and not the town you, and that what looks like plain irrationality from the town might have been the only rational thing to be from the desert. If someone knows the case it should land, and if they don't they should still feel the trap shut.
reasoning: |-
  Okay, the user is creating a handout for a reading group on Parfit's Desert Hitchhiker thought experiment. They want a villanelle poem that captures the core dilemma between the promise made in the desert and the refusal in town, using two refrains that differ by just one word. 

  Hmm, the key challenge here is making the form serve the philosophy. The villanelle's repetitive structure is perfect for showing how the same words change meaning when spoken by different temporal selves. The user specifically wants that single-word pivot between "I will pay" (desert) and "I won't pay" (town) to highlight how identity fractures across time.

  Let me think about Parfit's actual position... The philosophical punchline is that rationality looks different from each perspective. The desert-self's promise isn't irrational when made - it's the only way to survive. But the town-self inherits a burden that seems nonsensical. The poem needs to land that paradox without lecturing.

  The user's deep request seems to be: make readers *feel* the trap even if they don't know the philosophy. So imagery should do heavy lifting - thirst, shifting sands, the car as both salvation and betrayal. The driver should feel ominously passive; their silence makes the promiser's internal conflict louder.

  For structure: First tercet establishes the dilemma. Second stanza shows the "rational" refusal taking shape. Middle stanzas should build claustrophobia as the refrains flip meanings. Final quatrain must deliver Parfit's resolution - that keeping the promise is binding for the desert-self, absurd for the town-self. The last couplet needs that "snap" when the trap closes.

  Biggest risk is making it too abstract. Concrete details matter: the dashboard's glare, the wallet's weight. The driver's stillness in stanza 5 is crucial - they become a mirror for the protagonist's divided self. And ending on "survive" rather than "pay" underlines Parfit's point: this was always about survival, not morality.

  ...Did I capture the horror of realizing you'd betray your past self? The fourth stanza's "shadow on the sand" tries to show future guilt haunting the present. Hope that duality comes through.
