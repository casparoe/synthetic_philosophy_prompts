answer: |-
  ## Plan
  *   **Refrain 1 (Flat Assertion):** "This is wrong."
  *   **Refrain 2 (Embedded Occurrence):** "If this is wrong"
  *   **Scene:** A pub conversation about someone's questionable actions ("He took their chance").
  *   **Turn:** Refrain 2 introduces the embedded conditional, leading to an inference stanza.
  *   **Inference Stanza:** "If this is wrong, then he must pay... But *this is wrong*..." (showing modus ponens pressure).
  *   **Closing Couplet:** Reconciles by framing the embedded "if" as expressing disapproval of *endorsing both the action and avoiding consequences*.

  ---

  ## The Stakes

  He took their chance, he played a rigged game.
  We argued long in smoke and failing light.
  She said it plainly: *“This is wrong.”* The claim

  Hung in the air. But doubt began to frame
  A different view: perhaps the end was right?
  He took their chance, he played a rigged game.

  “Look,” said another, “if we grant the same
  As what she said, then where does that invite?
  *If this is wrong*, then he must pay the cost.
  That's logic's pull. But *is* it truly lost?”
  He took their chance, he played a rigged game.

  “I wonder though,” a quiet voice began,
  “*If this is wrong*, what makes us so upset?
  Beyond the rules, beyond the stated plan?”
  He took their chance, he played a rigged game.
  She cut him off: “No wondering! Don’t let

  Confusion cloud it. *This is wrong.*” Her stand
  Was absolute. The doubters shifted feet.
  “But *if this is wrong*,” pressed the other hand,
  “Then standing idle can't be our command!”
  He took their chance, he played a rigged game. The heat

  Rose in the room. To *say* it holds its ground
  *If this is wrong*? That’s hating how it sounds
  To shrug and let it pass without a sound.
  *This is wrong.* **If this is wrong**, we hate the thought
  Of letting slide what conscience says is caught.

  ---

  ## Handout Note (118 words)

  *   **Flat Assertion:** Line 3 ("This is wrong.") - A direct moral claim.
  *   **Embedded Occurrence:** Line 9 ("If this is wrong") - The clause unasserted, as a conditional's antecedent.
  *   **Inference Demonstration:** Stanza 3 - Starts with "If this is wrong" (embedded), concludes "But *this is wrong*" (flat assertion), implying the consequent ("he must pay") must follow, demanding consistent content.
  *   **Higher-Order Reconciliation (Closing Couplet):** Lines 17-18 frame the embedded "if" ('If this is wrong...') as expressing disapproval ('we hate the thought') of *accepting the action while ignoring consequences* ('letting slide what conscience says is caught'), attempting an expressivist solution. The seam remains visible; the 'if' still feels like it carries the original claim's weight.
