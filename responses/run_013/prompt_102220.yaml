  The first puzzle is the Two-Ledger World - a universe where two candidate "best systems" are equally balanced except that one is slightly simpler but leaves some coincidences unexplained, while the other is slightly more complex but explains everything. The key here is how the Humean handles the tie-breaking between these systems, and whether the anti-Humean can argue that this subjectivity undermines the idea of real laws.

  The second puzzle is about uninstantiated regularities - laws that prohibit something that never actually occurs (like a specific configuration of particles that never happens). The question is whether such a prohibition should count as a law if it makes the system simpler, even though it's never tested.

