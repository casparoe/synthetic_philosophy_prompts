prompt: |-
  I'm recently retired — 34 years as a geologist, mostly deep-time stuff — and since I stopped working I've been working my way through philosophy, which has honestly been more fun than the last decade of my career. Anyway, through a chain of favors I've ended up on the board of a small charitable foundation (we give away maybe $2M a year). We just got a big bequest and now we have to decide what to do with it, and the board has split into two camps. One camp wants to fund a program that helps people right now. The other wants to sink the money into something whose payoff is mostly centuries out — think reforesting, or an endowment for a research project that won't bear fruit for 150–200 years.

  To even compare those two options we need some kind of discount rate, and I've noticed something that unsettles me: the whole decision basically comes down to whatever number we pick. At 0% the long project wins easily; at 3% it loses and it isn't close. And the number is doing work nobody has really justified — the economist on our board just says "use the market rate," which feels like it's sneaking in an answer to a moral question. I've read enough now to know there's a whole debate about "pure time preference" — whether it's even coherent to care less about someones welfare just because they happen to be born later — and I don't think the board realizes it's making that choice.

  We meet in three weeks and I have to circulate a written recommendation before then. Write it for me: recommend a concrete policy for what discount rate — or range, or rule for picking one — the foundation should use when comparing projects with very different time horizons, specific enough that we could actually apply it to this decision and the next ones. Give the reasoning, and give the strongest case for the side you come out against; the person who'll be arguing with me is smart and I don't want to get caught flat. One more thing: I'm not a naif about compounding, so please don't just hand me a rate. I want to know what would have to be true for that rate to be the right one, and where the whole argument is really a value judgment wearing a number's clothes.
reasoning: |-
  Okay, let me tackle this geologist's problem. He's on a foundation board deciding between immediate aid and ultra-long-term investments, and the discount rate is the key. The economist says "use the market rate," but he's right to suspect that smuggles in ethical assumptions. 

  First, I need to map the philosophical minefield. The pure time preference debate is central - is discounting future welfare inherently unethical? Ramsey called it a "defect of imagination," but Stern's climate report used near-zero discounting while Nordhaus used market rates. Then there's the empirical mess: predicting growth rates centuries out is pure speculation, and extinction risks create a weird compounding effect.

  For the recommendation, I should avoid giving a single number. Maybe a dual-rate approach? Separate the ethical component (pure time preference) from the economic one (wealth growth). Set pure time preference at zero as a moral stance, then model different growth scenarios. But I must steelman the opposition - market rates aren't arbitrary, they reflect revealed preferences and opportunity costs. If we fund a 200-year project, that's capital not used for vaccines today.

  The format matters too. He needs something actionable for his memo: clear methodology, visualizable thresholds ("if you believe X about future wealth, then Y"). And he wants to preempt the smart opponent's arguments. Maybe build a sensitivity table showing how different assumptions flip the outcome.

  Hmm... also should acknowledge that for 200-year horizons, discount rates become almost metaphysical. A 2% vs 3% choice compounds to a 50x difference over two centuries. That's not finance - that's a value judgment about intergenerational obligations disguised as math.

  Better include concrete steps: 1) Admit the market rate isn't neutral 2) Propose the dual-rate framework 3) Show decision thresholds 4) Suggest an escape hatch for when projections are nonsense (like the asteroid threat horizon). And remind them they're not just picking numbers - they're choosing which generations count as real people.
answer: |-
  ## Recommendation: Intergenerational Discounting Policy for the Foundation

  **To:** Board Members, [Foundation Name]  
  **From:** [Your Name], Board Member  
  **Date:** [Date]  
  **Subject:** Proposed Policy for Discounting Future Impacts in Grantmaking Decisions  

  **The Core Problem:** Our debate hinges on the discount rate – a number determining how much less we value future benefits compared to present ones. As we've seen, the choice between immediate aid and centuries-scale projects collapses entirely to this rate. Market rates (e.g., 3-7%) inherently favor the near-term by powerfully diminishing distant impacts. Using them uncritically imports a significant ethical judgment: **that the welfare of future people matters substantially less than ours, purely because they exist later in time.** This is the "pure time preference" debate, and it's a moral choice, not a financial one.

  **Proposed Policy:** The Foundation should adopt a **Two-Component Discounting Framework** for projects with impacts spanning >50 years:

  1.  **Pure Time Preference (δ):** Set to **0%**.  
  2.  **Wealth/Growth Adjustment (η * g):** Apply a sensitivity analysis using a range of plausible values:
      *   **η (Elasticity of Marginal Utility):** 1.0 to 2.0 (Reflecting moderate to significant aversion to inequality in consumption across time).  
      *   **g (Per capita consumption growth rate):** 0.5% to 2.0% (Reflecting deep uncertainty about very long-term growth).  
      *   **Resulting Discount Rate Range:** 0.05% (η=1.0, g=0.5%) to 4.0% (η=2.0, g=2.0%).  
      *   **Key Application:** Explicitly model outcomes across this range, focusing on the **0.5% to 2.0% band** for critical long-term decisions (>100 years). **The market rate is *not* the default.**

  **Reasoning:**

  1.  **Rejecting Pure Time Preference (δ = 0%):** Discounting future welfare *solely* because it occurs later is ethically indefensible from an impartial standpoint. If a life has value today, a similar life has equal value in 200 years. Ramsey called pure time preference a "practice which is ethically indefensible." Stern (2006) used δ=0.1% (effectively 0%) for climate, arguing intergenerational equity demands it. Setting δ=0% affirms the foundation's commitment to the intrinsic equal value of human welfare across time.
  2.  **Acknowledging Growth Uncertainty (η * g):** It *is* reasonable to discount future benefits *if* we expect future people to be wealthier than us (η > 0). A dollar (or unit of welfare) provides less marginal utility to a richer person. However, predicting growth centuries ahead is fraught:
      *   **Deep Uncertainty:** Will technological progress continue linearly? Will climate change or other catastrophes cause regression? Will societal values shift dramatically?
      *   **η is a Value Judgment:** Choosing η involves how much weight we give to reducing inequality *across* generations. η=1.0 implies modest aversion; η=2.0 implies stronger aversion to intertemporal inequality.
      *   **g is Highly Speculative:** Historical averages (~1-2% per capita) are poor guides over 200+ years. Pessimistic scenarios (stagnation, decline) are plausible; optimistic ones (AI-driven abundance) are also possible.
  3.  **Why Sensitivity Analysis & a Low Range?**
      *   **Avoids False Precision:** Picking a single point estimate (like 3%) masks the underlying value judgments and massive uncertainty.
      *   **Highlights Value Conflict:** Showing how the decision flips between 0.5% and 2.0% forces the board to confront its core ethical stance: How optimistic/pessimistic are we about future wealth? How strong is our aversion to intergenerational inequality?
      *   **Promotes Deliberation:** It structures the debate around the *reasons* for choosing assumptions, not just the outcome of a hidden rate.
      *   **Prudence for Deep Time:** Given the scale of potential long-term existential risks (climate tipping points, biodiversity collapse) and the irreversibility of some harms, a lower range (leaning towards 0.5-1.5%) reflects a precautionary principle. It weights catastrophic future losses more heavily.
      *   **Aligns with Charitable Mission:** Foundations exist partly to address market failures and consider longer time horizons than private actors. We have a duty to consider impacts beyond the next quarter-century.

  **Application to the Current Bequest:**
  1.  Model the Net Present Value (NPV) of both the immediate-impact project and the centuries-scale project using the range: 0.5%, 1.0%, 1.5%, 2.0%, and (for comparison only) the current market rate (~3-4%?).
  2.  Calculate the "Critical Discount Rate" – the rate where the NPVs of the two projects are equal. This immediately shows how sensitive the decision is.
  3.  Present the board with:
      *   The NPV results across the range.
      *   The Critical Discount Rate.
      *   A concise summary of the ethical and empirical assumptions embedded in different points of the range (e.g., "Choosing 2.0% implies we believe future generations will be *significantly* richer and we place *moderate* weight on reducing their advantage").
  4.  **Recommendation:** Unless the board has strong consensus on *very high* future growth expectations (g > 2.0%) and *strong* aversion to intergenerational inequality (η >= 2.0), the discount rate applied should fall below 2.0%. For projects offering critical protection against very long-term, irreversible harms (e.g., runaway climate change, ecosystem collapse), rates towards the lower end (0.5%-1.0%) are more appropriate. Given the nature of the centuries-scale proposal, it likely warrants strong consideration under this framework.

  **The Strongest Case for a Higher Discount Rate (Market Rate/~3%):**

  My colleague advocating for the immediate-impact project will likely make these compelling points:

  1.  **Opportunity Cost & Revealed Preference:** "The market rate isn't arbitrary; it reflects the collective judgment of millions of actors trading present for future consumption. If we invest $1M today at a safe 3% return, we could distribute $20M (inflation-adjusted) over the next 100 years to fight *today's* poverty and disease. Choosing a near-zero discount rate ignores this powerful compounding potential to do immense good *now and continuously*. It prioritizes a highly speculative future benefit over concrete, measurable good we *know* we can achieve immediately. This capital could literally save thousands of lives *this decade*."
  2.  **Radical Uncertainty & Hubris:** "Predicting the world 200 years from now is not just difficult, it's impossible. Will they even *need* our reforested land? Might they have fusion power, geoengineering, or technology rendering our project obsolete? Worse, what if our endowment funds research that future societies deem unethical? Or what if civilization collapses? Investing for such a distant horizon assumes a level of foresight we simply don't possess. It's hubris to think we can effectively target resources that far ahead. Funding tangible needs today avoids this uncertainty."
  3.  **Institutional Imperative & Accountability:** "Our foundation exists *now*. We have a duty to our current donors and stakeholders to demonstrate effective stewardship and measurable impact during our tenure. Funding a project whose results won't be seen for centuries is impossible to evaluate or course-correct. It risks creating a perpetual, unaccountable bureaucracy. Prioritizing near-term impact ensures accountability, allows for learning and adaptation, and builds credibility that attracts future donations to do *more* good, potentially including longer-term projects later."
  4.  **Risk of Future Mismanagement:** "Even if the project is sound *now*, can we guarantee the foundation (or whatever entity manages the endowment/research) will steward it responsibly for centuries? History is littered with failed endowments and misdirected funds. An immediate-impact project delivers value before institutional drift or mission creep can occur."

  **Conclusion:**

  The choice between alleviating suffering today and safeguarding potential centuries hence is profoundly ethical. Using an uncritically adopted market discount rate implicitly resolves this ethical dilemma by heavily discounting the future. Our policy must make this choice explicit and deliberate. The proposed Two-Component Framework (δ=0%, sensitivity on η*g within a 0.5%-2.0% range) achieves this. It grounds the discount rate in transparent ethical principles (rejecting pure time preference) and forces us to confront the deep uncertainty about future growth and our stance on intergenerational inequality. For the current bequest, this approach will likely favor the long-term project unless the board has a strong consensus favoring very high assumed future wealth growth and a strong desire to discount the welfare of significantly richer future people. I urge the board to adopt this framework to ensure our decisions reflect our deepest values, not just the hidden assumptions of financial convention.
