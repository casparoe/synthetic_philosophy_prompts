     7. What we don't cover: 
          - Quantum versions or quantum limits.
          - Many-particle demons (we used one particle to keep it simple).
          - Alternative resolutions that are not based on Landauer's principle.

     Confidence: 
          - Overall: confident. 
          - Least sure: the detailed entropy accounting in the reset step of the engine. But the key point (that erasure of the demon's memory costs kT ln(2)) is solid.

     Note: In the expansion step, the entropy increase of the gas is k ln(2) and the entropy decrease of the bath is k ln(2), so net zero. In the erasure step, the entropy of the bath increases by k ln(2) (from the dissipated heat). But we also have the expansion step having taken heat from the bath? So the bath has a net zero entropy change? 

          Expansion: heat flow from bath: Q = kT ln(2) -> bath dS = -Q/T = -k ln(2)
          Erasure: heat flow to bath: Q = kT ln(2) -> bath dS = +k ln(2)
          Net bath dS = 0.

     And the system (gas+demon) is back to its initial state, so no change.

     Total dS_universe = 0.

     But the second law allows entropy to remain constant in reversible processes. We broke even, so no violation.

