          - Let's calculate: 
                Initial: entropy = k ln(2) (for the gas being in one of two halves, and demon blank).
                After measurement: entropy = k ln(2) (correlated state: gas in a specific half, demon recorded).
                After expansion: entropy of gas increases by k ln(2) (volume doubles) -> system entropy = k ln(2) [demon] + k ln(V)+const - [k ln(V/2)+const] = k ln(2) + k ln(2) = 2k ln(2)? 
            This is messy. Instead, we can say: 
                After expansion and engine reset: the gas is in one half (entropy k ln(V/2)+const) and the demon has a bit (entropy k ln(2)). So system entropy = k ln(V/2)+const + k ln(2) = k ln(V)+const. 
                Initially: k ln(V/2)+const + k ln(2) = k ln(V)+const. 
            So same. 
          - But the bath entropy decreased by k ln(2) during expansion and hasn't been compensated. So the total entropy of the universe (bath+system) decreased by k ln(2). 

          This is a violation unless we account for the erasure.

     4. The resolution: erasure costs (25 min)
          - Resetting the memory requires erasure.
          - Erasure is logically irreversible: to go from two states to one, we must lose information.
          - Landauer's principle: minimum energy cost is kT ln(2) per bit, dissipated as heat.
          - When we erase, we dissipate heat to the bath, increasing its entropy by k ln(2), which exactly compensates the earlier decrease.

          - The full cycle: 
                Work extracted: kT ln(2) 
                Work input for erasure: kT ln(2) (which we use from the extracted work) 
                Net work: 0 
                Bath entropy: net change 0.

     5. Common misconceptions and open questions (15 min)
          - Information is physical: the demon's memory is a physical system, and the correlation is physical.
          - The demon doesn't create order from nothing: the order in the gas is paid for by the disorder in the bath during erasure.
          - Quantum uncertainty is not the resolution: this is classical.
          - The second law holds because we account for all systems.
          - The demon doesn't need unbounded memory: we can reuse a finite memory by erasing.

     6. Check for understanding (5 min)
          - Question: "After a full cycle (including erasure of the demon's memory), what is the net change in the total entropy of the universe (including the bath) and why?"
