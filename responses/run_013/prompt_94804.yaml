  - Information is subjective: We must stress that the demon's memory is a physical system and the correlation is physical.
  - Demon creates order from nothing: The order is created by using the measurement, but the erasure restores the balance.
  - Quantum uncertainty: This is not the resolution; the problem and solution are classical.
  - Second law must be false: It is not false; the accounting was incomplete.
  - Unbounded memory: We can have a finite memory by resetting it periodically.

