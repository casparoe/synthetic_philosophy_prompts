          How can that be? The work extracted during expansion was kT ln(2). We used it to power the erasure. So we put that work back in. 

          Therefore, we cannot use the cycle to get free work. It is a break-even cycle. 

          This is the resolution: the work extracted is exactly what is needed to erase the memory. 

          But if we could erase the memory for free, then we would extract net work. 

          Landauer's principle says we cannot. 

          Therefore, the second law is saved.

     So the sequence in the session:

          1. Entropy: 
              - Macroscopic: entropy change in reversible processes: dS = dQ_rev / T.
              - Microscopic: S = k ln(W), W is the number of microstates.

          2. Second law: entropy of an isolated system increases (on average).

          3. Maxwell's demon (original) and then the Szilard engine: 
              - Setup: box with one particle, partition in the middle.
              - Demon measures which side.
              - We attach a piston on the empty side and let the particle expand isothermally, extracting work.
              - Reset the engine by removing the piston and reinserting the partition.

          4. Threat: it seems we can extract work without any cost? But we have to reset the demon's memory.

          5. The demon's memory: 
              - We model it as a two-state system (e.g., a bit).
              - Measurement: the demon's bit becomes correlated with the particle's position. This step can be done reversibly (in principle) without energy cost.
              - But to reuse the demon, we must reset its memory to the blank state.

          6. Erasure: 
              - Logically irreversible: two states (0 and 1) are mapped to one state (blank).
              - Landauer's principle: erasing one bit of information in a system at temperature T requires at least kT ln(2) of work to be dissipated as heat.

          7. The full cycle: 
              - The work extracted during expansion: kT ln(2).
              - The work required for erasure: kT ln(2).
              - So net work extracted is zero.

          8. The entropy accounting: 
              - During expansion: entropy decrease in the bath is compensated by entropy increase in the gas? Actually, we had: 
                    expansion: bath entropy -k ln(2), gas entropy +k ln(2) -> universe entropy change 0.
              - During erasure: we put work kT ln(2) and dissipate it as heat, so bath entropy +k ln(2). 
              - But note: during expansion, we extracted work from the bath, and during erasure, we put work back into the bath (as heat). 
              - The net effect: the bath had a net heat flow of 0? 
                    Expansion: heat extracted from bath: kT ln(2)
                    Erasure: heat returned to bath: kT ln(2)
              - So the bath is unchanged.

          Therefore, the cycle is reversible and we break even.

     So the threat is only apparent because we forgot the cost of erasure.

     The session plan:

     Total time: 2 hours.

     1. Introduction to entropy (20 min)
          - Thermodynamic entropy: reversible heat transfer, second law.
          - Statistical entropy: microstates, multiplicity, S = k ln(W). Example: flipping coins, or particles in a box (one particle in two halves: W=2, S=k ln(2)).

     2. The Szilard engine (25 min)
          - Describe the setup.
          - The cycle: measurement, work extraction, engine reset.
          - Calculate the work extracted: kT ln(2).
          - Question: where did the work come from? It seems we reduced the entropy of the universe? But account for the bath: during expansion, the gas absorbs heat from the bath, so bath entropy decreases by k ln(2), gas entropy increases by k ln(2). So net zero.

     3. The demon's memory and the threat (15 min)
          - After one cycle, the engine is reset, but the demon's memory is full.
