  Brainstorming the dependency structure:

  1. **Entropy as a bookkeeping device (statistical entropy) vs. thermodynamic entropy**: We must establish that entropy counts microstates and connects to the macroscopic property. Without this, the statistical view of the demon won't make sense.

  2. **The second law of thermodynamics**: We state it in the statistical form: the total entropy of an isolated system tends to increase. This sets up the challenge.

  3. **Maxwell's demon thought experiment**: Describe the original setup (a demon controlling a door between two chambers of gas, sorting molecules). Then, we transition to the simpler Szilard engine to make the arithmetic manageable.

  4. **The Szilard engine**: A one-particle gas in a box with a partition. The demon measures which side the particle is on, then uses that information to extract work by allowing the particle to push the partition. We show that we can extract work equal to kT ln(2) in an isothermal expansion.

  5. **Threat to the second law?**: It seems that by repeating the cycle, we get free work without increasing entropy. But we must account for the demon's memory.

  6. **The demon's memory**: We model the demon's memory as a physical system (e.g., a two-state device). The measurement step correlates the memory with the particle's position. This step can be reversible (no entropy increase) if done carefully.

  7. **The erasure step**: To reset the system for the next cycle, the demon must erase its memory. Erasure is a logically irreversible operation (mapping two states to one) and by Landauer's principle, it must dissipate at least kT ln(2) of heat.

  8. **Resolution**: The entropy decrease in the gas (when work is extracted) is compensated by the entropy increase during erasure. The second law is saved.

