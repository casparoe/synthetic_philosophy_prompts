answer: |-
  Here's a joke leveraging the core "weird swallows," set in a high-stakes context:

  **Setting:** The dusty offices of "Granular Imports Ltd." Sarah, the owner, is arguing with Claims Adjuster Brenda (an Epistemicist) and her supervisor, Roger (a Supervaluationist). Sarah imported sand labeled "Bulk Granular Material" for a lower tariff rate. Customs seized it, claiming it's just "Loose Sand" (higher tariff) because it *might not constitute a heap*. The border case matters – it's a $50,000 tariff difference.

  **Characters:**
  *   **Sarah:** Frustrated importer (borderline case).
  *   **Brenda:** Claims Adjuster (Epistemicist).
  *   **Roger:** Senior Adjuster (Supervaluationist).
  *   **(Background):** Phil, another adjuster, mutters about "degrees of truthfulness proportional to compaction" but is ignored.

  **(Sarah gestures wildly at a large, slightly uneven mound of sand on a pallet.)**

  **Sarah:** Look! It's clearly Bulk Granular Material! It's a heap! See the pile? The volume? Denying this is ridiculous!

  **Brenda:** (Adjusting her glasses precisely) Ms. Smith, 'heap' is a vague predicate. However, contrary to appearances, it *does* possess a precise, objective boundary. There exists an exact number of grains, *n*, where adding the *n+1* grain transforms non-heap into heap. This shipment... *is* either definitively a heap or definitively not. There is no in-between.

  **Sarah:** Okay... so? *Is it* a heap? Tell me *n*! Count them!

  **Brenda:** (Stiffly) That's the crux. While the precise cutoff *n* exists and governs this very case, it is *in principle unknowable*. Human cognition and measurement are fundamentally incapable of accessing that specific fact. We operate under inevitable uncertainty. Your claim is... indeterminate *to us*, but absolutely determinate *in reality*. Denial upheld.

  **Sarah:** (Flabbergasted) You're denying my claim because you *know* there's a secret number you *can't* know?! That's insane! Roger, please!

  **Roger:** (Stroking his chin thoughtfully) Brenda captures the *form* but misses the *supervaluation*. She's correct that "This is either a heap or not a heap" is true. And "There is a sharp cutoff" is also true. However...

  **Sarah:** (Hopeful) However?

  **Roger:** ...However, there is *no single, privileged precisification* of 'heap' that is *the* correct one. Every admissible precisification – every coherent way of drawing a sharp line – is equally legitimate. For *some* admissible precisifications, this pile is a heap; for others, it isn't. Crucially, *no specific cutoff point n is factually singled out* as *the* boundary. The truth of 'there is a sharp cutoff' is secured by the *range* of possibilities, not by pinning down *where* it is.

  **Sarah:** So... is it a heap *now*, for *this* pile, for *my tariff*?

  **Roger:** (Smiling benignly) The statement "This shipment is Bulk Granular Material" is neither super-true nor super-false. It's true on some sharpenings, false on others. Therefore, we cannot affirm it for the purposes of your claim. Denial upheld.

  **Sarah:** (Eyes wide, voice rising) Let me get this straight! Brenda, you say there *is* a magic number, but it's hidden by the universe, so you can't use it?!
  **Brenda:** (Nods) Essentially.
  **Sarah:** And Roger, you say the magic number *definitely exists somewhere*, but you refuse to say *where*, or even if *this pile* passes it because *all* the numbers are sorta-kinda real?!
  **Roger:** (Nods) Precisely. We preserve classical logic and the existence of a cutoff without the burden of location.

  **Sarah:** (Slams hands on the desk, pointing at the sand)
  **SO YOU'RE BOTH TELLING ME THERE'S A SHARP LINE...**
  **(Leans in, furious whisper)**
  **...BUT BRENDA'S LINE IS INVISIBLE, AND ROGER'S LINE IS EVERYWHERE AND NOWHERE?! AND I STILL PAY $50,000?!**

  **(Phil, from the back, softly:)** "It's 63% heap-ish..."

  **(Sarah glares at Phil, then back at Brenda and Roger, utterly defeated by the precision that can't be found and the existence that can't be located.)**

  **Why it works (for the target audience):**

  1.  **High Stakes Borderline Case:** The tariff directly depends on whether the sand is a "heap" (Bulk Granular Material), making the vagueness concretely costly.
  2.  **Epistemicist's "Weird Swallow":** Brenda explicitly states the unknowable, precise cutoff exists and governs *this* case, but is inaccessible. Her denial is based on this epistemic limitation, not the lack of a fact. Her position is rigid but helpless in practice.
  3.  **Supervaluationist's "Weird Swallow":** Roger affirms "there is a sharp cutoff" and bivalence ("heap or not"), but denies any specific location has factual privilege. He avoids Brenda's epistemic problem by making the cutoff ontologically diffuse. His denial stems from the lack of super-truth, not a lack of cutoff existence. The "everywhere and nowhere" captures the precisifications.
  4.  **Punchline Turns on the Difference:** Sarah's outburst perfectly contrasts the two "weird swallows": the *invisible* line (Epistemicism) vs. the *omnipresent-yet-unlocatable* line (Supervaluationism). Both lead to the same frustrating practical outcome ($50k bill) despite their theoretical machinery.
  5.  **Third View Bonus:** Phil (Degrees of Truth) gets a throwaway line that's ignored, highlighting how those views might approach it differently but don't resolve the core bureaucratic absurdity fueled by the main two views. He doesn't derail the joke.
  6.  **Avoids Cliches:** No bar, no setup about philosophers walking in. Grounded in a plausible, frustrating real-world scenario where vagueness matters.

  The humor comes from the sheer practical absurdity both highly technical positions lead to when confronted with a costly borderline case, emphasizing their respective counterintuitive commitments.
