prompt: |-
  A colleague in our philosophy of science reading group — I shall call her Mira — has been working through Hempel's raven paradox and has arrived at a set of verdicts that I cannot quite reduce to one principle. Her subject is the hypothesis that every raven is black, and her verdicts are these. A raven that you happen to come across on the moors and observe to be black confirms the hypothesis. A white raven in an aviary disconfirms it. A black crow in the park neither confirms nor disconfirms it. A black car in a car park neither confirms nor disconfirms it. And — the verdict I keep returning to — a white marble drawn at random from a sack which we had been told was filled by scooping up objects from a stretch of countryside containing ravens as well as marbles does confirm it, if only a little. She was quite firm about the marble. I remarked that the marble might just as well have been a shoe, and that a marble could not possibly have been a raven, and neither observation moved her.

  I have rashly promised to give my prediction before she announces her verdict on a new case, and I should like it to be reasoned rather than lucky. The case is this. I am taken to a raven sanctuary. At the gate the warden explains the admission procedure: every bird inside has been DNA-verified as a raven and plumage-verified as black, and no bird is admitted otherwise. I therefore know, before I set foot inside, that every bird I am about to see is a black raven. I go in, I see a raven, and it is black. Will Mira say that this confirms the hypothesis, disconfirms it, or neither? What I chiefly want is the rule she is running. I suspect that more than one rule fits all five of her earlier verdicts, and I should like to know which of them is the best fit, what each of the others predicts about the sanctuary, and why she is better read one way than another. Finally, tell me which further case I should put to her the following week — the one that would most cleanly separate the surviving rules — and what each of them would say about it.
reasoning: |-
  We are given Mira's verdicts on five cases and a new case (the raven sanctuary). We need to predict Mira's verdict on the new case and understand the underlying principle(s) she might be using. Then, we are to design a further case to distinguish between the surviving rules.

  First, let's list Mira's verdicts:

  1. A raven observed on the moors and found to be black: **confirms** the hypothesis (H: every raven is black).
  2. A white raven in an aviary: **disconfirms** H.
  3. A black crow in the park: **neither confirms nor disconfirms**.
  4. A black car in a car park: **neither confirms nor disconfirms**.
  5. A white marble drawn at random from a sack that contains objects (including ravens) from the countryside: **confirms** H, even if only a little.

  Now, the new case:

  - Raven sanctuary: Every bird has been verified as a raven and black. Before entering, we know that any bird we see will be a black raven. We then see a black raven. Does this confirm H?

  We are to find the rule that fits the first five verdicts and then predict for the sanctuary case.

  Let's consider possible rules:

  ### Rule 1: Nicod's Criterion (or something similar)
  Nicod's criterion: An observation of a raven that is black confirms H; an observation of a non-black non-raven (like a white shoe) confirms H (because it is an instance of the contrapositive: all non-black things are non-ravens). However, Mira does not accept the non-black non-raven as confirming in the case of the black car (which is a non-raven and black) and the black crow (non-raven and black) because she says they do nothing. But note: the white marble (non-black and non-raven) she says confirms. So she is not following the standard Nicod.

  ### Rule 2: Selective Background Knowledge
  Mira might be using background knowledge about the sampling process. In the white marble case, the marble was drawn randomly from a sack that contains objects from a countryside that includes ravens. So the fact that we got a non-black non-raven (white marble) might be taken as a little bit of evidence that we haven't found a non-black raven in that sample. However, in the black crow and black car cases, there's no such random sampling from a domain that includes ravens.

  ### Rule 3: The Probability-raising Account (Bayesian)
  Confirmation is when the evidence raises the probability of the hypothesis. That is, P(H|E) > P(H). We need to model the probabilities appropriately.

  Let H: all ravens are black.

  In the first case: E = seeing a black raven. Clearly, P(H|E) > P(H) because we have a positive instance.

  Second case: E = seeing a white raven. Then P(H|E) = 0, so it disconfirms.

  Third and fourth cases: E = seeing a black crow (or black car). These are non-ravens. How do they affect the probability? If we assume that the number of non-black non-ravens is very large, then observing one more doesn't change the probability much. But note: in the white marble case, Mira says it does confirm. So we must model the probabilities in a way that the white marble (non-black non-raven) raises the probability a little, but the black crow and black car do not.

  One way to model this is to consider the sampling process. In the white marble case, the marble is drawn randomly from a sack that contains objects from a domain that includes ravens. Therefore, the fact that we drew a non-black non-raven and not a non-black raven (which would be a counterexample) might slightly increase the probability that there are no non-black ravens in the sack. But for the black crow and black car, there is no such random sampling from a domain that includes ravens. They are just observed in isolation.

  ### Rule 4: The Possibility of Falsification
  Another idea: Mira might be focusing on whether the observation could have falsified the hypothesis. In the first case, the raven on the moors could have been non-black (so it could have falsified H) but it wasn't. Similarly, the white marble was drawn randomly from a sack that could have contained a non-black raven (but it didn't). In the sanctuary case, however, we already know that every bird is a black raven. So when we see one, there was no chance of falsifying H because we knew beforehand that it would be black.

  ### Analyzing the Sanctuary Case
  In the sanctuary case:
  - Before entering, we know that every bird in the sanctuary is a black raven. So the hypothesis H is already known to hold for the sanctuary. Therefore, when we see a black raven inside, we are not gaining any new information about the sanctuary birds. But note: the hypothesis H is about all ravens, not just sanctuary ones. However, we have learned that this particular raven (which is part of "all ravens") is black. But we already knew that.

  How to model it? Let E be the observation of a specific black raven in the sanctuary. Let K be our background knowledge: that the sanctuary only admits DNA-verified ravens that are black. So K implies that any raven in the sanctuary is black. Therefore, P(E|K) = 1. Also, P(H|K) is the probability that all ravens are black given that there is at least one sanctuary (which we know contains only black ravens) but there might be non-black ravens outside. However, the observation E doesn't tell us anything new about the outside because we already knew that the sanctuary birds are black. In fact, E is entailed by K: K implies E. So P(H|K, E) = P(H|K). Therefore, E does not change the probability of H given K. So by the Bayesian account, it should be neutral.

  But note: without K, observing a black raven would confirm. However, here we have K. So it depends on how we account for background knowledge.

  ### Comparing with Mira's Verdicts
  In the white marble case, the background knowledge was that the sack was filled by scooping objects from a countryside containing ravens. So there was a possibility of getting a non-black raven in the sack. When we draw a white marble, we are not getting a counterexample, and we are reducing the number of objects in the sack that could be counterexamples. So it slightly confirms.

  In the sanctuary case, we have already ruled out the possibility of a non-black raven in the sanctuary by the admission procedure. So when we see a black raven, it doesn't reduce the possibility of a non-black raven in the sanctuary because there was none to begin with (we knew that). And it doesn't tell us about outside.

  Therefore, by analogy with the white marble, the sanctuary case might be seen as not providing new evidence because the possibility of a non-black raven was already eliminated.

  ### Proposed Rule
  Mira seems to be using a rule that depends on whether the observation is the result of a random sample from a domain that includes ravens and where a counterexample might have been found. If the observation is from such a random sample, then:
  - A black raven (positive instance) confirms.
  - A non-black non-raven (like the white marble) also confirms (because it reduces the chance of a counterexample being in the sample).
  But if the observation is not from a random sample that might have contained a counterexample, then:
  - A non-raven (even if non-black) does not confirm (like the black crow and black car).
  - A raven that we already know must be black because of the context (like in the sanctuary) might not provide new confirmation.

  Specifically for the sanctuary: we are not sampling from a domain that might contain a non-black raven because we have already filtered out non-black ravens. Therefore, the observation of a black raven inside does not provide new evidence because it was already guaranteed by the background knowledge.

  Hence, Mira would probably say that the sanctuary case **neither confirms nor disconfirms**.

  ### Alternative Rules and Their Predictions
  Let's consider a few rules and what they would predict for the sanctuary case:

  **Rule A: Background Knowledge Matters (as above)**
  - Confirmation only when the evidence is from a random sample in a domain that could contain counterexamples to H.
  - In sanctuary: we are not in such a situation because we know the sanctuary only has black ravens. Therefore, **neither**.

  **Rule B: Simple Instance Confirmation**
  - Any instance of a black raven confirms, regardless of background. Then the sanctuary case would **confirm**.
  - But this rule would also say that the black crow and black car should not confirm (which matches) and the white marble should not confirm (but Mira says it does). So it doesn't fit the white marble verdict.

  **Rule C: Contrapositive Instance Confirmation**
  - Any non-black non-raven confirms (as in Nicod). But then the black car and black crow (non-ravens that are black) would not confirm (they are not non-black) so that matches. The white marble (non-black non-raven) would confirm (matches). But then by this rule, the white marble confirms and the sanctuary case (black raven) also confirms. So it would predict **confirm** for sanctuary.
  - However, this rule would also say that any non-black non-raven confirms, but note that in the black crow case, the crow is black (so it is a non-raven but black) and Mira says it does nothing. So that matches because the non-black non-raven (like white marble) confirms, but a non-raven that is black does not. So this rule:
     - Black raven: confirms (instance of the hypothesis).
     - Non-black non-raven: confirms (instance of contrapositive).
     - Non-raven that is black: not an instance of the contrapositive (because the contrapositive is about non-black things) so it doesn't confirm.
     - White raven: disconfirms (counterexample).
    So Rule C fits the first five verdicts:
      1. Black raven: confirms -> matches.
      2. White raven: disconfirms -> matches.
      3. Black crow: non-raven and black -> not non-black -> doesn't confirm -> matches (neither).
      4. Black car: same as 3 -> matches.
      5. White marble: non-black non-raven -> confirms -> matches.
    Then for sanctuary: we see a black raven, so Rule C would say **confirm**.

  But wait, Mira was firm about the white marble confirming but also the black raven on the moors confirming. So Rule C fits the first five. Then why did I think the sanctuary might be different? Because of the background knowledge. Rule C does not take into account the background knowledge about the sanctuary.

  Therefore, if Mira is following Rule C, she would say the sanctuary case confirms. But we have to consider if Rule C accounts for background knowledge. In Rule C, the confirmation is based solely on the instance. The sanctuary case is an instance of a black raven, so it confirms.

  But note: in the sanctuary, we already knew that the bird we are about to see is a black raven. So the observation doesn't add anything. Rule C, being a simple instance-based rule, might not account for that.

  So we have two candidate rules:

  - **Rule C (Instance-based)**: Predicts **confirm** for sanctuary.
  - **Rule A (Background-sensitive)**: Predicts **neither** for sanctuary.

  Which one does Mira use? The first five verdicts are explained by both. But note the white marble case: the white marble is a non-black non-raven and it confirms. The black crow is a non-raven and black and it doesn't. So Rule C is a good fit. However, the sanctuary case will distinguish.

  But we must also consider the sanctuary case in Rule C: even though we knew it was going to be black, we still observe an instance of a black raven. So Rule C would count it as a confirming instance.

  But is that consistent? In the first case (moors), the raven was observed in the wild and it was black. That was a confirming instance. In the sanctuary, we also have a black raven. So why wouldn't it be?

  However, the background knowledge in the sanctuary case changes the situation. We have a guarantee that every bird in the sanctuary is black. So the observation of one more black raven doesn't add any new information about the raven population in the sanctuary and, more importantly, it doesn't tell us about ravens outside. The hypothesis is about all ravens. The sanctuary ravens are a subset. We already knew about that subset. So we are not learning anything new about the world.

  In the moors case, we didn't have any guarantee about that particular raven. So it was new information.

  Therefore, Rule A (background-sensitive) might be more consistent with Mira's reasoning.

  ### Prediction for Sanctuary Case
  I predict that Mira will say that the sanctuary case **neither confirms nor disconfirms** because the observation was already guaranteed by the background knowledge and does not provide new evidence about the hypothesis.

  ### Further Case to Distinguish
  Now, we need a case that will distinguish between Rule C and Rule A.

  **Rule C**: Any instance of a black raven confirms, regardless of background.

  **Rule A**: Only if the observation is from a random sample in a domain that could have contained a counterexample. In the sanctuary, we knew the counterexample was impossible, so it doesn't confirm.

  We want a case that Rule A would say does not confirm but Rule C would say confirms.

  Consider:

  **Case 6: The Zoo**

  A zoo has a bird exhibit. The zoo has a sign: "This exhibit contains only ravens, and they are all black." We have no reason to doubt the sign. We then observe a bird in the exhibit and see that it is a black raven.

  By Rule A: We already know from the sign that the exhibit has only black ravens. So the observation doesn't tell us anything new. Therefore, it should be neutral.

  By Rule C: We have observed a black raven, which is a positive instance. So it confirms.

  But note: this is very similar to the sanctuary. So let's make it more nuanced.

  Alternatively, we can design a case that Rule A would say confirms but Rule C would also say confirms, but we want to separate.

  We already have Rule C and Rule A giving different predictions for the sanctuary and the zoo. So we can use the zoo case.

