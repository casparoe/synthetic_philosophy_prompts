  The user's qualifications do insulate the view somewhat—by dismissing everyday truth-talk as pragmatic rather than metaphysical, they deflect many objections. But that very move may make the position untestable and metaphysically idle. Worse, it risks making truth *atemporal*, which clashes with how we actually use language.

