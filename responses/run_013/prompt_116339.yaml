answer: |-
  **Bottom line: Your view faces fatal logical contradictions with disjunction and retrospective truth assessment, awkward practical mismatches with assertion and credence practices, and risks vacuity through over-insulation despite formal coherence via supervaluation.**

  ### Fatal flaws (logical incoherence)
  1.  **Violated Law of Excluded Middle (LEM):** LEM demands that (P ∨ ¬P) is always true. Your view entails that for future contingent P ("Sea battle tomorrow"), neither P nor ¬P is true *now*. Yet, (P ∨ ¬P) *must* be true *now*. Conceding LEM holds while denying truth to either disjunct is logically incoherent. A defender cannot concede this contradiction without abandoning classical logic. Dismissing LEM entirely is a massive cost, making the position radically revisionist.
  2.  **Retrospective Truth Assessment:** Once tomorrow comes and the sea battle occurs (or doesn't), we *must* say the past utterance "There will be a sea battle tomorrow" was *true* (or *false*). Your view denies the utterance had *any* truth-value *when made*. This creates a paradox: How can an utterance gain a past truth-value it never possessed? A defender might argue retrospective truth is *ascribed*, not discovered, but this clashes deeply with the intuition that the utterance's truth was *fixed* by subsequent events.

  ### Serious Objections (Practical & Intuitive Mismatch)
  1.  **Assertion, Betting, and Credence:** We confidently assert, bet real money, and assign high/low credences to future contingents. This strongly suggests we take them to be truth-apt *now*. If they lack truth-value, assertion seems inappropriate (asserting a non-truth-bearer), betting becomes incoherent (betting on a non-fact), and credences lack a clear object. A defender would **concede** the practice exists but **dismiss** its evidential weight, arguing: assertion/betting express confidence or commitment, not belief in current truth; credences reflect epistemic uncertainty about *what will become true*, not current truth-value. This is awkward but not fatal.
  2.  **"Fixed" Future Intuition:** Many share the intuition that *whether* a sea battle happens tomorrow is *already fixed* (even if unknown and undetermined), making one disjunct *true* (and the other *false*) *now*. Your view explicitly rejects this, requiring the non-existence of a truthmaker *now*. This is a core clash of intuitions; a defender dismisses the "fixed future" intuition as mistaken metaphysics.

  ### Formal Coherence & Costs
  1.  **Supervaluationism:** Your view aligns with supervaluationist semantics for future contingents. This provides formal consistency by:
      *   Defining truth as "supertruth" (true in *all* admissible histories/futures).
      *   Defining falsity as "superfalsity" (false in *all* admissible histories/futures).
      *   Assigning neither to P and ¬P if they are true in *some* but not *all* histories.
      *   Preserving LEM: (P ∨ ¬P) is supertrue (true in *every* history).
  2.  **Costs of Formalism:** This saves logical consistency but introduces significant complexity and counter-intuitive results:
      *   "It will be sunny tomorrow or it will not be sunny tomorrow" is true.
      *   "It will be sunny tomorrow" is neither true nor false.
      *   "It will be sunny tomorrow and it will not be sunny tomorrow" is false.
      *   While coherent, this feels artificial and disconnects truth from actual future outcomes until they happen.

  ### The Risk of Insulation and Verdict
  *   **Insulation:** Your view *is* insulated against empirical refutation. It explicitly rejects the need for a *current* truthmaker, dismissing counter-arguments based on determinism, causality, or subsequent events as irrelevant to the *current* lack of truth-value. Its core claims are metaphysical/logical.
  *   **Is Insulation a Defect?** Yes, potentially fatally. It risks vacuity:
      1.  **Untestability:** It offers no criterion for *when* a future-tense statement *gains* a truth-value beyond "when the event exists." This makes it unfalsifiable.
      2.  **Explanatory Idleness:** If the utterance's retrospective truth is disconnected from its status when uttered, what *explanatory work* does assigning it "neither" do *now*? It doesn't predict future language use, belief, or action better than the view that it's true/false *now* but unknown.
      3.  **Language Mismatch:** The insulation requires dismissing the overwhelming surface grammar and practice surrounding future statements as deeply misleading about their semantic status.
  *   **Does it Risk Anything?** Yes. It risks:
      *   **Logical Incoherence:** Failing to reconcile LEM with valueless disjuncts.
      *   **Explanatory Failure:** Providing no better (or even a worse) account of our practices than the "truth-now" view.
      *   **Metaphysical Commitment:** Requiring a strong, potentially controversial, presentist or growing block ontology where truthmakers *must* be present.
      *   **Radical Revisionism:** Abandoning core intuitions about truth, time, and language without clear compensatory benefits.

  **Verdict:** While formally coherent via supervaluation, your view faces a fatal contradiction with LEM and deep tension with retrospective truth, making it logically unstable. Its insulation shields it from empirical counterarguments but renders it potentially vacuous and explanatorily idle, demanding significant revision of logic and language practices without clear advantage over truth-now views. The cost is high, and the risks of incoherence and vacuity are severe.
