answer: |-
  ### Framing  
  "Our guest today critiques what she calls the 'conjoined invocation' of Darwin and Turing in debates about minds and machines. She argues that collapsing evolutionary selection—where competence emerges across lineages without design—with computational rule-following—where competence executes syntax without semantics—generates a profound equivocation. This conflation, she contends, makes both AI hype and skepticism unnervingly resistant to clear refutation."

  ### Questions  
  1. **Question:** If reinforcement learning systems evolve strategies through environmental selection pressures *and* operate via formal symbol manipulation, doesn’t this collapse your two inversions into one process?  
     *Likely answer:* RL simulates selection on computational architectures but remains ontologically distinct—evolution lacks explicit reward functions.  
     *Follow-up:* But if RL’s reward function is an analog of fitness, isn’t the system’s "competence" simultaneously computational *and* selectional?  

  2. **Question:** You claim selectional competence belongs strictly to lineages, not individuals. Does this imply that when we say "a bird is competent at nest-building," we’re committing a category error?  
     *Likely answer:* Yes—individuals instantiate traits shaped by lineage-level selection; competence is attribution, not ontology.  
     *Follow-up:* Doesn’t this render adaptationist explanations in cognitive science (e.g., "the brain is competent because it was selected for X") incoherent?  

  3. **Question:** Could a system exhibit robust computational competence—like an LLM—while having *zero* selectional competence? What would that imply for claims that AI "evolves" capabilities?  
     *Likely answer:* Absolutely—LLMs lack heritable variation and differential reproduction; their "evolution" is metaphorical designer teleology.  
     *Follow-up:* If future AI self-modifies via open-ended selection (e.g., in code-space), would it acquire genuine selectional competence?  

  4. **Question:** Isn’t your distinction just a restatement of phylogeny (lineage history) vs. ontogeny (system operation)? Why reframe it as "inversions"?  
     *Likely answer:* Phylogeny/ontogeny concerns developmental timing; inversions target explanatory priorities (ends vs. rules).  
     *Follow-up:* But don’t both distinctions ultimately reduce to "history vs. mechanism"? What’s uniquely at stake in *your* framing?  

  5. **Question:** What empirical discovery—say, Lamarckian inheritance in digital systems—would force you to abandon the separation of these inversions?  
     *Likely answer:* Lamarckism would blur inheritance mechanisms but not the explanatory gap between function and rule semantics.  
     *Follow-up:* Suppose we find neural wetware where protein folding implements literal Turing machines: Would that fuse the inversions?  

  6. **Question:** When AI skeptics say "LLMs can’t *truly* understand," are they conflating Turing-inversion competence with expectations of Darwinian ends-directedness?  
     *Likely answer:* Often yes—they demand comprehension as if syntax must imply biological function.  
     *Follow-up:* But if LLMs develop goal-directedness via RLHF, does that import selectional competence retroactively?  

  7. **Question:** Animal cognition research often attributes "innate competence" to individuals (e.g., navigation). Is this a Darwin-Turing equivocation in action?  
     *Likely answer:* Typically yes—invoking "innate rules" smuggles in lineage history while testing computational output.  
     *Follow-up:* Does your view imply we can *never* ascribe selectional competence to an organism, only to its ancestry?  

  8. **Question:** Turing’s inversion treats formal systems as substrate-neutral. Doesn’t Darwin’s, by contrast, rely entirely on physical instantiation?  
     *Likely answer:* Correct—selection requires material constraints; computation abstracts from them.  
     *Follow-up:* If true, can computational competence ever "explain" biological cognition without committing a teleological fallacy?  

  ### Closing  
  **Question:** Which inversion—Darwin’s or Turing’s—is more dangerously misapplied in current AI debates, and if you’re wrong about *which one* is the primary culprit, what would you need to concede?  
  *(No pre-written answer/follow-up—this demands extemporaneous stakes-setting.)*  

  ---  
  **Rationale**: Questions pressure conceptual fault lines: RL as a putative counterexample (Q1, Q3), the ontology of competence (Q2, Q7), falsifiability (Q5), and overreach claims (Q6, Q8). The phylogeny challenge (Q4) forces defense of novelty. The closing forces a consequential gamble, exposing the framework’s vulnerability.
