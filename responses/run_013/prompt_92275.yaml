  The user mentions two framings from friends: one about splitting "making a difference" into three aspects (outcome, group behavior, personal participation), and another about when harmless acts become harmful as a heap. They're unsure if these are valid approaches. Their real need isn't a reading list but a prioritized agenda—actionable questions to explore, with clear reasoning for why each matters.

  I need to assess their core struggle: they're wrestling with moral complicity versus practical futility. The conflict between "my action doesn't matter" (consequentialism) and "but it feels wrong" (deontology/virtue ethics) is key. Their group has five people meeting monthly, so questions must be discussable without academic jargon. I should prioritize questions that are foundational—unblock other debates—and tractable for amateurs.

  The user’s hidden needs might include craving moral clarity for personal decisions (e.g., flying to marches) and seeking a framework to resolve arguments like the one with their brother. They also might want to feel empowered in their activism without hypocrisy guilt. 

  First, I'll address the friends' framings. The tripartite split (outcome/group/participation) is useful—it prevents talking past each other. The heap question (when does a heap become harmful?) is deep but not urgent; it's more metaphysical. I’d rank it lower because it doesn’t resolve practical dilemmas as directly. 

  For the agenda, I’d prioritize:
  1. **The Bridge Question**: How do tiny contributions connect to big harms? This is upstream because it challenges the "my action doesn’t matter" myth. It’s tractable with real-world analogies (e.g., voting, littering). Answering it could validate guilt as rational, shifting focus to participation over outcomes.
     
  2. **The Responsibility Question**: When are you blameworthy for collective harm? This tackles complicity. It’s harder but crucial for personal ethics. A participation-focused answer (e.g., "you’re part of the problem") sidesteps inefficacy and reframes hypocrisy debates. Downstream, it impacts how we judge individual choices.

  3. **The Pivot Question**: How might small acts trigger bigger changes? This injects hope by linking acts to ripple effects. It’s speculative but vital for motivation. If proven tractable (e.g., via social dynamics), it could make activism feel less futile.

  I’d sequence them this way because #1 debunks the core blocker (inefficacy), #2 addresses moral unease, and #3 offers agency. The heap question (#4) is interesting but abstract; I’d slot it last as a "deep dive" if the group progresses. 

