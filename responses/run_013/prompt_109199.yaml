prompt: |-
  I serve on the disciplinary panel of a state board of professional engineers. We are hearing a case against a licensed engineer who approved a foundation design using a standard spreadsheet. The spreadsheet's own output, combined with a soil report the engineer had read, entailed that one load case was understrength. The engineer did not notice, and the flaw was caught before occupancy. Our rules permit discipline for what a licensee knew or should have known. The board chair proposes what he calls the derivability test: if a conclusion follows from what the engineer knew by steps a competent engineer could perform, then the engineer knew it, whether or not he ever performed them. The defense says that standard would make every engineer responsible for every consequence of everything they have read, and would turn the board into an oracle. I have been reading about the problem of logical omniscience, and I think it bears directly on the test we adopt. Please draft the short written opinion I will circulate before the hearing. It should recommend a concrete disposition of this case—suspend his license, fine him, or dismiss the complaint—and propose a workable test for should have known that the board can apply later, one that does not assume people see all the consequences of what they know but also does not excuse inferences a competent practitioner would actually draw. Give the strongest argument for the chair's position its due, and say what the test cannot settle. I do not need a literature review or citations; I need something the panel can act on.
reasoning: |-
  We are addressing a case where an engineer approved a foundation design using a standard spreadsheet. The spreadsheet output, combined with the soil report the engineer had read, showed that one load case was understrength. The engineer did not notice, and the flaw was caught before occupancy. We must decide on discipline based on what the engineer "knew or should have known."

  The chair proposes the "derivability test": if a conclusion follows from what the engineer knew by steps a competent engineer could perform, then the engineer knew it, regardless of whether they performed those steps. The defense argues this would make engineers responsible for every consequence of everything they read, turning the board into an oracle.

  I have considered the problem of logical omniscience, which highlights that humans cannot be expected to know all logical consequences of their knowledge. However, the board must set a standard that holds engineers accountable for inferences a competent practitioner would actually draw, without requiring omniscience.

  **Proposed Disposition:** I recommend a **fine** (but not suspension) and a requirement for the engineer to complete additional continuing education in the use of design tools and verification procedures. The flaw was caught before occupancy, so no harm occurred. However, the engineer failed to perform a necessary verification that a competent engineer would have done.

  **Proposed Test for "Should Have Known":** 
  The board should adopt the **"reasonable inferential diligence" test**. Under this test, a licensee is considered to have known what a competent practitioner in the same specialty, exercising reasonable care and diligence, would have inferred or discovered from the information at hand. This requires:
  1. **Contextual Factors:** Consider the complexity of the information, the tools used, the time available, and the stakes of the decision.
  2. **Practical Inferences:** Focus on inferences that are both (a) necessary for safety and (b) within the standard procedures and checks that are customary in the profession for the task at hand.
  3. **Avoiding Omniscience:** The test does not require the engineer to see every possible consequence, but it does require them to perform the standard checks and analyses that are part of competent practice.

  **Why Not the Chair's Derivability Test?**
  The strongest argument for the derivability test is that it upholds the integrity of the profession by holding engineers to the logical implications of their knowledge. If the data in the spreadsheet and the soil report entail an understrength condition, then the engineer should be held responsible for that conclusion because it was logically available. However, this test is flawed because it ignores human cognitive limits and the practical realities of engineering work. It would indeed hold engineers responsible for every consequence, no matter how obscure or computationally complex, which is unworkable and unfair.

  **Why the Reasonable Inferential Diligence Test?**
  This test balances accountability with feasibility. In this case, the engineer used a standard spreadsheet. Competent practice requires verifying the output, especially for critical safety elements like foundation design. Such verification might include spot-checking calculations, reviewing input parameters, and cross-referencing with the soil report. The understrength condition was derivable by a straightforward review of the output against the soil report's requirements. A competent engineer would have performed this check. Therefore, the engineer should have known.

  **What the Test Cannot Settle:**
  This test cannot resolve every edge case. It relies on expert testimony about what constitutes "reasonable care and diligence" in a given context. It also does not address situations where the inference requires extraordinary steps beyond standard practice. The board must exercise judgment on a case-by-case basis, guided by the standard of the profession.

  **Conclusion:**
  I recommend a fine and additional continuing education. The engineer made a mistake that a competent engineer should have avoided, but the error was caught without harm. The board should adopt the reasonable inferential diligence test for future cases. It avoids the pitfalls of logical omniscience while ensuring that engineers are held to the standard of their peers in drawing critical inferences.

  ---

  **DRAFT OPINION FOR CIRCULATION**

  **TO:** Members of the Disciplinary Panel  
  **FROM:** [Your Name]  
  **RE:** Proposed Standard for "Should Have Known" in Case # [Number]  

  In the matter before us, a licensed engineer approved a foundation design using a standard spreadsheet. The spreadsheet output and the soil report (which the engineer had read) together indicated an understrength condition in one load case. The engineer did not notice this flaw, which was later caught prior to occupancy. We must decide whether to discipline the engineer based on what he "knew or should have known."

  **Proposed Disposition:**  
  I recommend a **civil penalty (fine)** and a requirement for the engineer to complete **additional continuing education** focused on design verification procedures. The fine should be significant enough to underscore the seriousness of the oversight but not so severe as to suggest that the error caused harm (which it did not, being caught in time). Suspension is not warranted because the error was corrected without harm and there is no evidence of a pattern of negligence.

  **Proposed Test for "Should Have Known":**  
  I propose we adopt the **"reasonable inferential diligence" test**. Under this test, an engineer is deemed to have known what a competent engineer in the same specialty would have inferred or discovered by exercising reasonable care and diligence in the context of the task. This includes:
  - Performing standard verification steps (e.g., cross-referencing inputs and outputs, checking critical load cases) that are customary for the tools and methods used.
  - Considering the implications of known data when those implications are directly relevant to safety and within the scope of standard practice.

  This test rejects the chair's "derivability test" because the derivability test would hold engineers responsible for every logical consequence of their knowledge, regardless of whether it is reasonable to expect them to draw that conclusion. That standard is unworkable and inconsistent with human cognition. Instead, our test focuses on what a competent practitioner would actually do in the same situation.

  **Why This Test Applies Here:**  
  In this case, the engineer used a standard spreadsheet and had the soil report. A competent engineer would have verified that the design met the soil report's requirements for all load cases. This is a routine step in foundation design. The understrength condition was evident from the spreadsheet's output when compared to the soil report's specifications. Therefore, the engineer **should have known** of the deficiency.

  **The Strongest Argument for the Derivability Test and Why We Reject It:**  
  The chair argues that if a conclusion follows logically from known facts by steps within a competent engineer's ability, then the engineer should be held to know it. This view emphasizes that engineering is a rigorous discipline built on logic and that public safety demands strict accountability. However, we must recognize that engineers are not omniscient. They cannot be expected to see every consequence, especially when it requires complex or non-obvious reasoning. The derivability test would impose an impossible standard and could lead to arbitrary enforcement. Our test, by contrast, grounds accountability in the actual practices of the profession.

  **Limitations of the Test:**  
  The reasonable inferential diligence test cannot eliminate all ambiguity. It requires the board to assess what is "reasonable" and "customary" based on expert evidence. It does not cover situations where the inference is beyond standard practice (e.g., requiring novel research). The board must rely on the testimony of qualified experts to establish the standard of care.

  **Conclusion:**  
  I urge the panel to impose a fine and continuing education in this case and to adopt the reasonable inferential diligence test as our standard for "should have known." This approach is both just and practical, holding engineers accountable for what they would reasonably be expected to infer without demanding the impossible.

  I look forward to discussing this at the hearing.
