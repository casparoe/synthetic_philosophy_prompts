  **MEMORANDUM TO THE DISCIPLINARY PANEL**  
  **FROM:** [Your Name], Member, State Board of Professional Engineers  
  **RE:** Proposed Standard for "Should Have Known" in Case # [Number]  
  **DATE:** [Current Date]  

  ### **I. Case Summary and Recommendation**  
  The licensee, a professional engineer, approved a foundation design using a standard industry spreadsheet. The spreadsheet’s output, when combined with data from a soil report he reviewed, logically entailed that one load case was understrength. The engineer failed to identify this flaw, which was later caught during routine inspections prior to occupancy. No harm occurred.  

  **Recommended Disposition:**  
  - **Impose a civil fine** (e.g., 10–20% of the project fee or a fixed sum commensurate with negligence).  
  - **Mandate continuing education** in design verification protocols.  
  - **Do not suspend licensure or dismiss the complaint.**  

  **Rationale:** The engineer possessed all necessary data to detect the error through basic verification—a step integral to competent practice. The oversight was serious but not malicious, and the absence of harm supports remediation over revocation. A fine acknowledges the lapse; education prevents recurrence. Dismissal would undermine public trust in self-regulation.  

  ---

  ### **II. Proposed Test for "Should Have Known"**  
  Reject the chair’s "derivability test" (which deems engineers responsible for all logical consequences of their knowledge). Instead, adopt the **"Reachable Inference Test"**:  

  > **A licensee "should have known" a fact if:**  
  > (a) The fact was a necessary conclusion from information the licensee actually knew, **and**  
  > (b) Reaching that conclusion required **only routine, safety-critical inferences or verifications** within the licensee’s specialty, using standard tools and methods, **and**  
  > (c) A competent engineer in the same context **would have performed those steps as part of ordinary practice.**  

  **Key Features:**  
  - **Avoids logical omniscience:** Does not hold engineers responsible for obscure, complex, or non-obvious consequences. Focuses on inferences that are "reachable" through standard workflows (e.g., checking spreadsheet output against soil parameters).  
  - **Workable and profession-centered:** Relies on expert testimony about what constitutes "routine" practice (e.g., verifying load cases in foundation design).  
  - **Context-sensitive:** Considers time pressures, tool limitations, and stakes. High-risk designs (e.g., foundations) warrant greater diligence.  

  ---

  ### **III. Application to This Case**  
  Under the Reachable Inference Test:  
  1. **The engineer "should have known" of the understrength load case.**  
     - (a) The soil report and spreadsheet output contained sufficient data to derive the flaw.  
     - (b) Cross-referencing load calculations with soil specifications is a **routine, safety-critical check** for foundation design.  
     - (c) Competent engineers routinely validate spreadsheet outputs; this is not an obscure inference but a core duty.  
  2. **The defense’s "oracle" objection fails.** The test does not demand omniscience—it excuses non-routine inferences (e.g., complex interactions beyond standard methods). Here, the error was detectable via basic arithmetic and comparison, steps within the engineer’s daily responsibilities.  

  ---

  ### **IV. Addressing the Chair’s Derivability Test**  
  **Strongest Argument for the Chair’s Position:**  
  Engineering is a rigorous, logic-based discipline. Public safety demands that licensees be accountable for all conclusions derivable from their knowledge. Permitting "unseen" errors incentivizes negligence, as engineers could ignore tools that automate reasoning (e.g., spreadsheets).  

  **Why We Reject It:**  
  - **Impractical and unfair:** Engineers cannot intuit all logical consequences of their knowledge (e.g., a spreadsheet’s hidden formula errors). The derivability test would effectively require superhuman cognition, exposing engineers to discipline for unforeseeable flaws.  
  - **Undermines tools:** Spreadsheets are aids—not replacements—for judgment. The chair’s test treats them as infallible oracles, shifting blame from tool misuse to "unseen" outputs.  
  - **Chilling effect:** Engineers might avoid digital tools or over-audit designs, increasing costs without improving safety.  

  ---

  ### **V. What the Test Cannot Settle**  
  The Reachable Inference Test **cannot resolve:**  
  - **Ambiguity in "routine" practice:** Where standard procedures are disputed, the board must rely on expert testimony.  
  - **Non-routine inferences:** Consequences requiring novel analysis (e.g., untested load interactions) or specialized research fall outside this test.  
  - **Tool-specific errors:** If the flaw stemmed from a spreadsheet coding error (undetectable via ordinary checks), discipline would not apply.  

  ---

  ### **VI. Conclusion**  
  I recommend a fine and continuing education for the licensee, as the Reachable Inference Test confirms he **should have known** of the understrength condition. Adopt this test as our standard: it balances accountability with human limitations, focusing on inferences competent engineers **actually draw** in daily work. This safeguards public welfare while ensuring fair, consistent rulings.  

  **Action Requested:** Circulate this opinion before the hearing. I move to incorporate the Reachable Inference Test into the board’s disciplinary guidelines.
