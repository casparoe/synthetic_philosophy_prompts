prompt: |-
  Ok so I'm a third year phil of science student and this term I'm doing a placement instead of a dissertation — I'm at our national statistics office, in the team that makes the charts for the monthly dashboard. My supervisor found out I did a module on the Vienna Circle and now I've been asked to write the internal note on when we're allowed to turn a statistic into a picture. Its due Friday and I don't want it to be useless.

  The way Neurath's picture-language thing came across in the seminar: the point of a statistical picture is that you shouldn't need training, a legend, or any particular language to read it. You draw the thing being counted as a small identical symbol repeated as many times as there are things, each symbol standing for the same fixed amount, so the reader can count the symbols and check the number themselves instead of trusting the chart. Making one big symbol bigger than another is a con, because who knows if you're meant to compare height or area, and perspective is out for the same reason. I'm fairly sure he was also against symbols that carry a mood or a metaphor — a skull for deaths, a fat body for obesity, an arrow for pressure — because then the picture is doing rhetoric rather than counting. And I remember he never thought this could replace words; it was meant to help language, not be one. If I've got any of that wrong, say so up front, because I'll be embarrassed if the whole note rests on a misreading.

  What I actually need is something my collegues can run. Not 'be honest with your charts' — a procedure. Something like: the questions to ask about a chart, in order; what counts as a good enough answer at each step; where the procedure stops and says no; and where it has to hand the decision to a person because the question is about values and not about pictures. Ten minutes, by someone who has never read a word of Neurath and doesn't care.

  Run it on three charts we really put out, and don't rig the results:

  1. Heatwave deaths this summer compared with the previous ten summers, by week. Countable, I think — one symbol per death, or per ten deaths.
  2. Average waiting time in A&E. That's a duration, not a count of things, so what exactly gets repeated? If the answer is that nothing does, tell me what to do instead, because we have to publish it.
  3. The gender pay gap, which is a difference between two averages expressed as a percentage of one of them. I have a strong feeling this one can't be done in his terms at all, and that anything we could draw for it is already an argument. If the procedure says don't publish, fine, but our head of comms has already promised the minister a graphic for that one, so tell me how to write the refusal in a way that doesn't sound like the intern being precious.

  Two more things. Where does this procedure just encode Neurath's taste rather than a real requirement of honesty? For instance, if the 'no metaphors' rule is a truth-preservation rule, explain why; if it's just that he didn't like being moved, say that, because then I can drop it without losing anything. And be blunt about what the procedure can't do — I'd rather the note have a section saying 'this step is a judgement call and here is who has to make it' than pretend it's mechanical.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy of science student on placement at a national statistics office, needing to create a practical guide for data visualization based on Neurath's principles by Friday. 

  First, I need to verify my understanding of Neurath's Isotype method. The key points from the user's description seem correct: standardized pictograms representing fixed quantities, avoidance of size scaling that creates ambiguity (height vs area), rejection of metaphorical symbols that add rhetorical weight, and the concept of visualizations as supplements to language rather than replacements. I recall Neurath emphasized democratic access to information through self-explanatory imagery.

  For the operational procedure, I'm considering a decision tree format with clear pass/fail criteria. The core steps should assess: 
  - Whether the data represents countable units
  - If standardized pictograms can directly represent those units
  - Whether any scaling introduces ambiguity 
  - If symbols carry unintended connotations
  - How much explanatory text is needed

  Applying this to their three real-world examples:
  1. Heatwave deaths - countable with per-symbol quantity noted (e.g., 1 symbol = 5 deaths)
  2. A&E waiting times - requires transformation to countable units (e.g., percentage of patients waiting over target time) 
  3. Gender pay gap - fundamentally incompatible as it represents a derived ratio; suggest alternative display formats

  The ethical considerations need unpacking. The "no metaphors" rule is epistemological - symbols like skulls introduce emotional bias that distorts statistical representation. But the "no scaling" rule is more about perceptual accuracy. I should clearly distinguish which rules are essential for truth preservation versus Neurath's personal preferences.

  For implementation challenges, I'll highlight where human judgment intervenes: 
  - Determining "reasonable" pictogram quantities
  - Assessing cultural connotations of symbols
  - Deciding when explanatory text becomes excessive

  The refusal rationale for the pay gap graphic should focus on its nature as a synthetic metric rather than observable count, suggesting more appropriate visualization methods that don't pretend to be Isotypes. 

  Throughout, I'll maintain the pragmatic tone requested - this isn't about philosophical purity but about workable standards for public statistics.
answer: |-
  Here's a procedural framework based on Neurath's core principles, designed for practical use. Your summary of Neurath is correct: **literal pictograms, no scaling ambiguity, no rhetorical symbols, fixed quantity per symbol, and visual counting as verification.** The procedure prioritizes **truth-preservation** (preventing misinterpretation) over aesthetics. I'll flag where it's Neurath's *preference* vs. a *truth* requirement.

  ---

  ### **Procedure: Is This Statistic Pictogram-Ready? (5 Steps)**

  1.  **QUESTION: Is the core statistic a *count* of distinct, concrete things?**
      *   **GOOD ANSWER:** "Yes, we are counting individual, observable units (e.g., people, deaths, hospitals, houses)."
      *   **BAD ANSWER:** "It's an average/rate/percentage/duration/value." OR "The units are abstract/conceptual."
      *   **ACTION:**
          *   **Pass?** Proceed to Step 2.
          *   **Fail?** STOP. This statistic *cannot* be accurately represented by a Neurath-style pictogram. *Do not use repeated symbols.* Consider a simple bar chart, line chart, or number. (See Examples 2 & 3).

  2.  **QUESTION: Can one literal, non-metaphorical pictogram clearly represent *one* of the things being counted?**
      *   **GOOD ANSWER:** "Yes (e.g., a simple outline of a person for people, a house for houses). The symbol is literal and unambiguous in this context."
      *   **BAD ANSWER:** "We need a metaphor (e.g., skull for death, bag of money for wealth, flame for heatwave)" OR "The symbol is complex/culturally loaded/abstract (e.g., family group, 'progress' arrow, stylized globe)."
      *   **ACTION:**
          *   **Pass?** Proceed to Step 3.
          *   **Fail?** STOP. Metaphorical/abstract symbols add interpretation and rhetoric, violating the "direct count" principle. *Do not use repeated symbols.* Use a simple chart type or number. ***(TRUTH RULE: Metaphors introduce subjective interpretation, moving beyond objective counting.)***

  3.  **QUESTION: Is the total count low enough, or can we set a *fixed quantity* per symbol (e.g., 1 symbol = 10 deaths) without obscuring important detail?**
      *   **GOOD ANSWER:** "Yes, the count (or the count per symbol) is ≤ ~50." OR "Grouping (e.g., 1 symbol = 100 houses) is acceptable for the scale of the data and doesn't hide crucial variation."
      *   **BAD ANSWER:** "We need thousands of symbols, making the graphic huge/unreadable." OR "Grouping would mask important small differences we need to show."
      *   **ACTION:**
          *   **Pass?** Proceed to Step 4.
          *   **Fail?** STOP. Pictograms become impractical/count verification impossible. Use a simple bar chart or number. ***(JUDGEMENT CALL: Statistician + Comms agree on practicality/thresholds. Neurath preferred small counts but allowed grouping.)***

  4.  **QUESTION: Do we need to *compare* counts? If YES, will comparison ONLY use *number of symbols* (rows/columns)?**
      *   **GOOD ANSWER:** "No comparison needed." OR "Yes, comparison will be based *only* on counting more/fewer identical symbols arranged in rows/columns/grids."
      *   **BAD ANSWER:** "We'll scale the *size* (height/area/volume) of single symbols or groups to represent magnitude."
      *   **ACTION:**
          *   **Pass?** Proceed to Step 5.
          *   **Fail?** STOP. Scaling symbols introduces perceptual ambiguity (is area or height compared?) and prevents direct counting verification. *Do not scale symbols.* Use a simple bar chart (where length, not area, is the primary visual cue). ***(TRUTH RULE: Scaling introduces ambiguity in how magnitude is encoded, breaking the "count to verify" principle.)***

  5.  **QUESTION: Can the meaning be understood WITHOUT a legend, OR is the legend extremely simple (e.g., "= 5 people")?**
      *   **GOOD ANSWER:** "The pictogram is obvious (e.g., person outline for people) and the quantity per symbol (if >1) is clearly stated nearby." OR "A very brief, essential legend is needed and placed directly adjacent."
      *   **BAD ANSWER:** "A complex legend explaining abstract concepts or multiple symbol types is required."
      *   **ACTION:**
          *   **Pass?** APPROVED for Neurath-style pictogram.
          *   **Fail?** STOP. The pictogram needs too much explanation, defeating the "immediate readability" goal. Simplify the statistic or use a different chart type. ***(JUDGEMENT CALL: Statistician + Comms agree on "obviousness" and legend simplicity.)***

  ---

  ### **Applying the Procedure to Your Charts**

  1.  **Heatwave Deaths (Weekly, vs. 10-year avg):**
      *   **Step 1:** PASS. Deaths are countable things.
      *   **Step 2:** PASS. A simple, neutral person outline suffices. (Avoid flames/skulls).
      *   **Step 3:** PASS. Use grouping (e.g., 1 symbol = 5 deaths). Detail preserved at weekly level.
      *   **Step 4:** PASS. Compare counts by showing more/fewer symbols per week (arranged in rows/columns). *Do not make one big person taller/wider than another.*
      *   **Step 5:** PASS. Legend: "= 5 deaths". Chart title: "Weekly Heatwave Deaths vs 10-Year Average".
      *   **RESULT: APPROVED.** Neurath pictogram is suitable.

  2.  **Average A&E Waiting Time:**
      *   **Step 1: FAIL.** This is an *average duration*, not a count of distinct things. We are not counting "waiting times".
      *   **RESULT: STOP.** Cannot use repeated symbols. **Alternative:** A simple bar chart showing average time per period. Label bars clearly with the time (e.g., "4.2 hrs"). A line chart showing trend over time is also Neurath-compatible (shows position on a scale).

  3.  **Gender Pay Gap (%):**
      *   **Step 1: FAIL.** This is a *derived percentage* expressing a *difference between two averages*. It is not a count of distinct, concrete things.
      *   **RESULT: STOP.** Fundamentally incompatible with Neurath pictograms. Any "picture" (e.g., two different-sized money bags, a gap between figures) is inherently metaphorical and rhetorical – it *interprets* the statistic visually. **Alternative:** State the percentage clearly in bold text ("Gender Pay Gap: 14.5%"). A simple bar chart showing the *two average salaries* side-by-side is acceptable (Step 1 passes for the *salaries* as countable monetary units, though grouping is extreme - e.g., 1 symbol = £5000 annual salary). The *gap itself* remains a derived number best stated textually.

  ---

  ### **Handling the Gender Pay Gap Refusal (Blunt & Professional)**

  > **Recommendation: Do not represent the Gender Pay Gap % using repeated pictograms.**
  >
  > *   **Reason:** The core statistic (14.5%) is not a direct count of observable things. It is a derived value representing the *difference* between two other averages. Any depiction using symbols (e.g., unequal stacks of coins, figures separated by a gap) inevitably introduces visual metaphors and interpretations (e.g., size=difference, gap=distance) that go beyond simple counting. This moves into the realm of rhetoric, violating the core principle that pictograms should enable direct verification of counts. Using such a graphic would imply a specific visual argument about the gap, rather than presenting the underlying countable data neutrally.
  > *   **Alternative Proposal:**
  >     *   Clearly state the percentage prominently: "Gender Pay Gap: 14.5%".
  >     *   **OR** (If visual comparison is essential): Provide a simple bar chart showing the *Median Full-Time Annual Pay: Men (£X) / Women (£Y)*. This shows the countable underlying data (salaries). The gap can be calculated from these numbers. (If using bars, ensure lengths are proportional only to the *values*, not areas).

  ---

  ### **Where Neurath's Taste vs. Truth Rules Come In**

  *   **"No Metaphors" (e.g., skulls, flames, arrows):** **TRUTH RULE.** Metaphors add layers of meaning (danger, heat, direction) not inherent in the count itself. This introduces subjectivity and potential emotional bias, obscuring the objective count. A skull implies something specific about death beyond just "number of deaths". This violates truth-preservation by adding non-data meaning.
  *   **"No Scaling Symbols" (e.g., one big person vs. small person):** **TRUTH RULE.** Scaling (especially area/volume) is perceptually unreliable for precise comparison and prevents direct counting verification. It encodes magnitude ambiguously. Using *number* of identical symbols is the most verifiable visual method for counts. Bar charts (using length) are a fallback because length comparison is more accurate than area/volume.
  *   **Insistence on Literal Pictograms (e.g., person outline):** **PRIMARILY TASTE (with truth element).** Neurath favoured extreme literalness for universality. A *very* simple, abstracted but recognizable shape (like his human figures) is sufficient. The truth element is avoiding symbols that are *confusing* or *culturally specific* enough to require explanation, defeating immediacy. A stick figure is usually fine; a detailed ethnically-specific figure might not be. **(JUDGEMENT CALL: Comms + Statistician - "Is this symbol immediately, universally recognizable here?")**
  *   **Preference for Small Counts/Grouping:** **PRACTICALITY (with truth implication).** The truth principle is *verifiability by counting*. If there are 10,000 symbols, counting is impossible, so the benefit is lost. Grouping (1 symbol = 100) maintains verifiability *of the groups* but loses individual count detail. The acceptable threshold is pragmatic. **(JUDGEMENT CALL: Statistician - "Does grouping obscure crucial detail?" Comms - "Is the grouped graphic still clear and usable?")**

  ---

  ### **What This Procedure CAN'T Do (Be Blunt)**

  1.  **Handle Non-Count Data:** It cannot magically turn averages, rates, percentages, durations, or abstract values into valid Neurath pictograms. It will say "NO".
  2.  **Define "Obvious" Symbols:** Deciding if a pictogram is truly universal/requires no legend involves cultural and contextual judgement (Step 5).
  3.  **Set Exact Grouping Thresholds:** Defining the maximum usable number of symbols (Step 3) is a practical judgement based on graphic size and data granularity needs.
  4.  **Resolve Conflicting Priorities:** If Comms *demands* a pictogram for non-count data (like the Pay Gap), the procedure says "NO" based on truthfulness. Overruling this is an *ethical/policy decision* for management, not a procedural one.
  5.  **Replace All Charts:** It's designed *only* for assessing suitability for Neurath's specific *pictogram* method. Bar charts, line charts, and clear numbers are often better, simpler, and *more* Neurath-compatible for non-count data than forced pictograms.

  This procedure ensures pictograms are used *only* where they excel: providing direct, verifiable visual counts of concrete things. It prevents misleading or rhetorical visualizations by enforcing strict encoding rules based on objective counting. Use it as a gatekeeper for this specific visual technique.
