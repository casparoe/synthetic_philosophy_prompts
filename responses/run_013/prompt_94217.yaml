answer: |-
  ### Decision Tree: Animal Phenomenal Consciousness

  **Q1: Is there a determinate fact of the matter about which animals have phenomenal consciousness?**  
  - **No (facts depend on attributive practices)** → **Leaf: Deflationary View**  
    *Awkward commitment: Must accept that our practices (not biology) "create" consciousness facts for borderline cases.*  
  - **Yes, but facts are unknowable** → **Leaf: Inaccessible Facts View**  
    *Awkward commitment: We must act as if consciousness exists in some animals while admitting we can never confirm it.*  
  - **Yes, and facts are knowable** → **Q2**  

  **Q2: Is consciousness best understood as a threshold property ("on/off") or as dimensional (varying in richness, valence, etc.)?**  
  - **Dimensional** → **Leaf: Graded/Dimensional View**  
    *Awkward commitment: Must reject yes/no questions (e.g., "Is a bee conscious?") as ill-formed without specifying dimensions/cutoffs.*  
  - **Threshold** → **Q3**  

  **Q3: Should attribution rely on behavioral/physiological markers (e.g., pain trade-offs, flexible behavior) or a neural/functional theory?**  
  - **Markers** → **Q4**  
  - **Theory** → **Q5**  

  **Q4 (Markers): Can valenced experience (pleasure/suffering) exist without phenomenal presence ("raw" experience), or vice versa?**  
  - **Yes** → **Q6**  
  - **No** → **Q6**  
  *(Note: This distinction rarely changes practical verdicts; included for logical completeness but leads to same Q6.)*  

  **Q6 (Markers): Is a single integrated subject of experience required?**  
  - **Yes** → **Leaf: Behavioral Markers View (Integrated)**  
    *Awkward commitment: Risks excluding fragmented but sentient systems (e.g., octopuses' decentralized cognition).*  
  - **No** → **Leaf: Behavioral Markers View (Non-Integrated)**  
    *Awkward commitment: Risks over-including reflexive subsystems (e.g., spinal cords) as "conscious".*  

  **Q5 (Theory): Which neural structure is minimally sufficient?**  
  - **Layered cortex (neocortex/similar)** → **Leaf: Layered Cortex View**  
    *Awkward commitment: Excludes birds despite advanced cognition (e.g., tool-using crows).*  
  - **Pallium (cortex homolog, e.g., avian nidopallium)** → **Leaf: Pallium View**  
    *Awkward commitment: Includes birds/reptiles but excludes fish with simpler pallia, creating a fish-vertebrate gap.*  
  - **Midbrain/brainstem structures** → **Q7**  
  - **Minimal integrative processing (any architecture)** → **Leaf: Minimal Integration View**  
    *Awkward commitment: Includes insects/worms, implying consciousness in very simple systems.*  

  **Q7 (Midbrain theory): Does consciousness extend beyond vertebrates?**  
  - **No** → **Leaf: Midbrain/Brainstem View (Vertebrates Only)**  
    *Awkward commitment: Excludes cephalopods despite behavioral complexity rivaling mammals.*  
  - **Yes, to cephalopods** → **Q8**  

  **Q8: Does consciousness extend to arthropods?**  
  - **No** → **Leaf: Midbrain/Brainstem View (+ Cephalopods)**  
    *Awkward commitment: Grants consciousness to octopuses but denies it to bees/crabs with similar markers.*  
  - **Yes** → **Leaf: Midbrain/Brainstem View (+ Cephalopods & Arthropods)**  
    *Awkward commitment: Treats arthropod ganglia as functionally equivalent to vertebrate midbrains.*  

  ---

  ### Unreachable Answer Combinations & Issues  
  1. **Dimensional + Theory-based attribution**  
     - *Why:* Dimensional view (Q2) exits early; no path to neural theories.  
     - *Status:* **Incoherent**—Dimensional views reject threshold-based theories.  
  2. **Deflationary/Inaccessible + Any threshold/dimensional commitment**  
     - *Why:* Q1 exits to these leaves; no path to later questions.  
     - *Status:* **Incoherent**—Deflationary/inaccessible views deny knowable biological thresholds.  
  3. **Markers + Clade generalization**  
     - *Why:* Tree lacks explicit clade-inference question under markers (focuses on integration/valence).  
     - *Status:* **Undefended**—Clade inference is implicit in marker reliability but not systematized.  
  4. **Theory + Valence/Subject-Integration questions**  
     - *Why:* Theory branch (Q5) prioritizes structure over valence/subjecthood.  
     - *Status:* **Unattractive**—Theories (e.g., global workspace) often assume integration/valence.  

  ### Leaf Pairs the Tree Cannot Separate in Practice  
  - **Behavioral Markers (Integrated) vs. Behavioral Markers (Non-Integrated)**  
    *Reason:* In borderline cases (e.g., octopus), behavioral markers don’t clearly indicate "subject unity"; both leaves rely on identical evidence.  
  - **Pallium View vs. Midbrain/Brainstem (Vertebrates Only)**  
    *Reason:* Birds/fish often exhibit similar markers (e.g., pain avoidance), making it hard to distinguish pallium-specific from general vertebrate mechanisms.  
  - **Minimal Integration View vs. Midbrain/Brainstem (+ Cephalopods & Arthropods)**  
    *Reason:* Both attribute consciousness to bees/octopuses; neural differences (midbrain vs. integration) rarely translate to measurable behavioral gaps.  

  ---

  ### Verdict Table: Is the Animal Conscious?  
  | **View**                                       | **Honeybee** | **Octopus** | **Trout** | **Newborn Human** | **Decorticated Mammal** | **Anaesthetised Animal** |  
  |------------------------------------------------|--------------|-------------|-----------|-------------------|-------------------------|--------------------------|  
  | **Deflationary**                               | I            | I           | I         | I                 | I                       | I                        |  
  | **Inaccessible Facts**                         | I            | I           | I         | I                 | I                       | I                        |  
  | **Graded/Dimensional**                         | I            | I           | I         | I                 | I                       | I                        |  
  | **Behavioral Markers (Integrated)**            | N            | I           | I         | C                 | N                       | N                        |  
  | **Behavioral Markers (Non-Integrated)**        | I            | C           | C         | C                 | I                       | N                        |  
  | **Layered Cortex**                             | N            | N           | N         | C                 | N                       | N                        |  
  | **Pallium**                                    | N            | N           | N         | C                 | N                       | N                        |  
  | **Midbrain/Brainstem (Vertebrates Only)**      | N            | N           | C         | C                 | C                       | N                        |  
  | **Midbrain/Brainstem (+ Cephalopods)**         | N            | C           | C         | C                 | C                       | N                        |  
  | **Midbrain/Brainstem (+ Cephalopods & Arthropods)** | C        | C           | C         | C                 | C                       | N                        |  
  | **Minimal Integration**                        | C            | C           | C         | C                 | C                       | N                        |  

  **Key:**  
  - **C** = Conscious  
  - **N** = Not Conscious  
  - **I** = Indeterminate (borderline or unknowable)  

  **Notes on verdicts:**  
  - **Decorticated mammal:** Conscious if view prioritizes midbrain (e.g., vertebrates-only); not conscious if it requires cortex/pallium.  
  - **Anaesthetised animal:** Universally "not conscious" (temporary suppression).  
  - **Honeybee/octopus/trout:** Depend on whether view includes arthropods/cephalopods/fish.  
  - **Behavioral markers views:** Indeterminate where markers conflict (e.g., octopus integration) or are absent (e.g., decorticated mammals show reflexes but not planning).
