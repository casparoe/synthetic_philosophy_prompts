  | Inaccessible Facts View            | I        | I       | I     | I                    | I                   | I                    |
  | Graded or Dimensional View         | I        | I       | I     | I                    | I                   | I                    |
  | Behavioral Markers (Conservative)  | N        | N       | N     | C                    | I*                  | N                    |
  | Behavioral Markers (Moderate)      | N        | C       | C     | C                    | I*                  | N                    |
  | Behavioral Markers (Liberal)       | C        | C       | C     | C                    | I*                  | N                    |
