     - trout: N (fish have a pallium but it is not considered sufficiently complex in this view)
     - newborn human infant: C
     - decorticated mammal: N (no pallium? The pallium is part of the cortex, which is removed, but the subcortical structures might remain. But the view requires the pallium, so N)
     - anaesthetised: N

  9. Midbrain/Brainstem View (vertebrates only): All vertebrates. So:
     - honeybee: N
     - octopus: N (not vertebrate)
     - trout: C
     - newborn human infant: C
     - decorticated mammal: C (midbrain and brainstem intact)
     - anaesthetised: N (because anesthetised)

  10. Vertebrates and Cephalopods: All vertebrates and cephalopods.
     - honeybee: N
     - octopus: C
     - trout: C
     - newborn human infant: C
     - decorticated mammal: C (as vertebrate with midbrain)
     - anaesthetised: N

  11. Vertebrates, Cephalopods, and Arthropods: 
     - honeybee: C
     - octopus: C
     - trout: C
     - newborn human infant: C
     - decorticated mammal: C
     - anaesthetised: N

  12. Minimal Integrative Processing View: Very broad. Honeybee has integration in the mushroom bodies, octopus has complex brain, trout has vertebrate brain, human infant, decorticated mammal might have some integration in midbrain, anaesthetised: not during anaesthesia. So:
     - honeybee: C
     - octopus: C
     - trout: C
     - newborn human infant: C
     - decorticated mammal: C (if it has integrative processing in midbrain)
     - anaesthetised: N

  For the anaesthetised animal, in all views, it is not conscious during anaesthesia, so N.

  For the decorticated mammal, in the midbrain view and broader, it is conscious if the midbrain is intact. In the cortex or pallium views, it is not.

  In the markers views, it depends on whether it shows the markers. Since it might show pain responses but not flexible behavior, it might be I or N. We'll mark as I for markers views.

  Now, let's make the tree in text form:

  ```
  Q1: Is there a fact of the matter about which animals are phenomenally conscious?
      -> No: Deflationary View
      -> Yes, but inaccessible: Inaccessible Facts View
      -> Yes and accessible: Q2

  Q2: Is consciousness best understood as a threshold property or dimensional?
      -> Threshold: Q3
      -> Dimensional: Graded or Dimensional View

  Q3: What is the primary criterion for attribution?
      -> Behavioral and physiological markers: Q4
      -> Substantive theory of consciousness: Q5

  Q4 (Markers): How far to generalize from markers in one species?
      -> Conservative (mammals and birds): Behavioral Markers View (Conservative)
      -> Moderate (mammals, birds, reptiles, fish, cephalopods): Behavioral Markers View (Moderate)
      -> Liberal (includes arthropods): Behavioral Markers View (Liberal)

  Q5 (Theory): What is the minimal sufficient neural substrate?
      -> Layered cortex: Layered Cortex View
      -> Pallium (of sufficient complexity): Pallium View
      -> Midbrain and brainstem (vertebrates): Q6
      -> Minimal integrative processing: Minimal Integrative Processing View

  Q6: Include cephalopods?
      -> Yes: Q7
      -> No: Midbrain/Brainstem View (vertebrates only)

  Q7: Include arthropods?
      -> Yes: Vertebrates, Cephalopods, and Arthropods
      -> No: Vertebrates and Cephalopods
  ```

  Now, list combinations the tree cannot reach:

  - A dimensional view that then uses a theory: because after dimensional, we stop.
  - A deflationary view that then uses markers: no.
  - Also, the tree doesn't allow for a theory that requires a layered cortex and also includes cephalopods (since cephalopods don't have layered cortex). So that combination is incoherent.

  Specifically:

  - Any view that is deflationary or inaccessible cannot be combined with threshold or dimensional because we stop at Q1.
  - The dimensional view cannot be combined with any criterion because we stop at Q2.
  - In the theory branch, if you choose layered cortex, you cannot include cephalopods or arthropods because there's no branch for that.

  Also, the tree cannot reach a view that uses both markers and theory? But the tree forces a choice at Q3.

  Now, flag pairs of leaves the tree cannot separate in practice:

  - The Behavioral Markers View (Liberal) and the Minimal Integrative Processing View might both attribute consciousness to honeybees, octopuses, trout, etc. But they are different leaves. In practice, they might be hard to separate because the markers might be present in animals with minimal integrative processing. But the tree separates them by criterion (markers vs theory).

  - The Vertebrates, Cephalopods, and Arthropods view and the Minimal Integrative Processing View might be similar in attribution, but again, the tree separates them by the criterion.

  - Also, the Inaccessible Facts View and the Deflationary View both result in indeterminacy, but for different reasons.

