answer: |-
  The amnesty-for-truth practice rests on a distinct, **restorative-communicative theory of justice**, prioritizing societal healing and historical clarity over individual retribution. Its core presuppositions and implications are:

  ### Core Presuppositions
  1.  **Truth as a Primary Good & Victim Entitlement:**  
      It presupposes victims and society possess a **fundamental right to know the full truth** about atrocities. This knowledge – the "what," "how," and "why" – is seen as a distinct, non-substitutable form of justice. A conviction alone (especially via plea bargain) often reveals only minimal facts sufficient for guilt, leaving victims without narrative closure or societal understanding. Public acknowledgment provides **recognition, validation, and a shared historical record** that punishment cannot generate.

  2.  **The State's Authority to Alienate Punishment for a Greater Good:**  
      It presupposes a legitimate state possesses the **sovereign discretion to waive deserved punishment** in exceptional circumstances for a compelling societal interest. This "political good" – comprehensive truth leading to national reconciliation, prevention of future violence, and the establishment of a shared historical foundation – is deemed sufficiently valuable to justify overriding the retributive impulse. The state essentially trades the *certainty* of punishment for the *certainty* of truth.

  3.  **Contextual Specificity of the Trade:**  
      This alienation is justified *only* for this class of wrongs (systematic, large-scale atrocities like war crimes, crimes against humanity, state-sponsored violence) because:
      *   **Scale:** Ordinary crimes don't threaten societal collapse or require collective reckoning.
      *   **Systemic Nature:** Perpetration is often embedded in state/military structures; individual trials may obscure command responsibility and systemic patterns.
      *   **Epistemic Challenge:** Full truth is uniquely difficult to uncover without insider cooperation.
      *   **"Currency" Specificity:** Truth is offered *only* because it uniquely addresses the needs created by *this specific trauma* – the shattering of social trust and the need for a shared narrative. Money or community service wouldn't suffice.

  ### The Implicit Theory: What the Practice is For
  The core purpose is **societal restoration through communicative repair**:
  *   **Victim-Centric:** Providing victims with acknowledgment, dignity, and the information needed for psychological closure.
  *   **Societal Healing:** Creating a shared, authoritative historical record to combat denial, foster mutual understanding (even if not forgiveness), and rebuild fractured social bonds.
  *   **Democratic Foundation:** Establishing truth as the bedrock for a legitimate, post-conflict political order based on transparency and rejection of past abuses.
  *   **Prevention:** Exposing systemic failures and perpetrator motivations to deter future atrocities and enable institutional reform.
  *   **Pragmatic Resolution:** Achieving a level of accountability and public reckoning deemed impossible through conventional trials due to scale, political instability, evidential challenges, or the risk of renewed conflict.

  ### What it Strictly Requires vs. What it Merely Fits
  *   **Strictly Requires:**
      *   **Full Disclosure:** Perpetrator must provide a complete, public account of their specific actions and knowledge.
      *   **Public Nature:** The truth-telling must occur in a forum accessible to victims, society, and history.
      *   **Conditional Amnesty:** Amnesty is strictly contingent on meeting the truth-telling requirement; silence maintains liability.
      *   **Focus on Systemic Wrongs:** The justification hinges on the context of widespread, politically-motivated atrocities.
  *   **Merely Fits (Compatible but Not Essential):**
      *   **Apology/Remorse:** While desirable for victims, the core bargain is truth, not contrition.
      *   **Victim Participation:** Victim questioning or impact statements fit restorative ideals but aren't always mandated.
      *   **Material Reparations:** Separate from the amnesty-for-truth bargain; can exist alongside.
      *   **Formal Condemnation:** The process itself implies condemnation, but explicit judicial denunciation is traded away.
      *   **Individualized Sentencing:** Retributive proportionality is explicitly waived.

  ### Underdetermination: Retributive vs. Restorative Licenses
  The practice is underdetermined enough for both theories to *license* it, but for **radically different reasons**:
  *   **Restorative Justice:** Sees the practice as **positive justice itself.** Truth-telling *is* a core form of accountability and reparation. Public acknowledgment directly repairs harm. Amnesty is the *reward* for fulfilling this restorative duty.
  *   **Retributive Justice:** Sees the practice as a **pragmatic, second-best compromise.** When perfect justice (prosecution/punishment) is impossible or socially destabilizing, extracting truth via amnesty becomes a lesser evil. It accepts the *loss* of deserved retribution as the *cost* of obtaining vital truth and stability. It's a concession, not an ideal.

  ### What Changes if the Presupposed View is Replaced
  Replacing the core restorative-communicative view fundamentally alters the practice:

  1.  **Replace with Strict Retributivism (Punishment Non-Negotiable):**
      *   **Amnesty Eliminated:** Confession might mitigate sentence, but never erase liability. "Amnesty-for-truth" becomes impossible.
      *   **Truth as Evidence, Not Currency:** Perpetrator testimony is valued only for securing convictions against others or themselves (risking self-incrimination). Public narrative is secondary.
      *   **Focus Shifts:** From societal healing to individual culpability and proportional punishment.
      *   **Practice Collapses:** Few perpetrators would confess without guaranteed amnesty; the truth remains hidden.

  2.  **Replace with Pure Utilitarianism (Maximize Aggregate Welfare):**
      *   **Flexible "Currency":** The state could trade amnesty for *anything* deemed to maximize welfare (e.g., money for victims, community rebuilding work, intelligence). Truth loses its unique status.
      *   **Reduced Focus on Victims' Narrative Rights:** The victim's need to *know* might be outweighed by other welfare calculations (e.g., economic costs of trials, perpetrator reintegration speed).
      *   **Potential for Arbitrary Deals:** Amnesty could be granted based on perceived usefulness, not just truthfulness/completeness.

  3.  **Replace with Victim-Centered Vengeance:**
      *   **Victim Veto Power:** Individual victims/families might gain power to block amnesty regardless of truth-telling, demanding punishment.
      *   **Loss of Systematic Truth:** Fragmented victim decisions could prevent a coherent national narrative from emerging.
      *   **Amnesty Becomes Transactional:** Truth might be traded directly with specific victims for forgiveness/amnesty, losing the public, societal dimension.

  **In essence:** The amnesty-for-truth practice is fundamentally built on the idea that knowing the full, public truth about systematic atrocities is a unique and essential form of justice that can, in extreme circumstances, justify the state's extraordinary decision to forgo deserved punishment. Changing this core view dismantles the practice's rationale and structure. It thrives only where truth is seen not merely as instrumental to punishment, but as a constitutive element of societal repair.
