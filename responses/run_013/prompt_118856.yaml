      a. Which disagreements are verbal and which are genuine.
      b. What would change their minds (or if part of the fight can't be turned into a crux).

   Let's start with the agreed claims.

   Agreed Claims:

   1. Both agree that the brain has a physical basis for both the report channel (which produces verbal and behavioral reports) and the experience channel (which generates the subjective feel of experiences). These channels are fully realized in the brain.

   2. Both agree that the physical story is complete: every report and every behavior has a sufficient physical cause.

   3. Both agree that the report channel is causally responsive to certain physical states of the brain (which may include neural correlates of consciousness).

   4. Both agree that in the normal, undialed case, the experience channel and the report channel are correlated because they are both caused by the same underlying physical state.

   5. Both agree that the surgeon's two dials describe two logically possible interventions (at least in principle) because they are defined to independently manipulate the two channels. However, they may disagree on whether such interventions are metaphysically possible or practically feasible.

   6. Both agree that in the trained subject case, the subject's reports are reliably accurate in normal conditions because the report channel is causally connected to the underlying physical state that also gives rise to the experience.

   7. Both agree that the subject's judgment that they are having an experience (and the report they make) is caused by the physical state of the brain, not by the experience itself (according to the epiphenomenalist) or by the experience as a property of that state (according to the causalist).

   8. Both agree that the reliability of reports in normal conditions is explained by the causal connection between the underlying physical state and the report.

   9. Both agree that if the experience channel were altered without changing the report channel (first dial), the subject would report based on the unaltered report channel and thus would not report the altered experience.

   10. Both agree that if the report channel were altered without changing the experience channel (second dial), the subject would report inaccurately relative to the experience.

   Now, the table of disagreements. We have at least two main points of disagreement:

   Disagreement 1: The causal role of experiences in reports.

   Disagreement 2: The nature of the relationship between the experience and the report channel (whether they are two distinct channels or two aspects of the same thing).

