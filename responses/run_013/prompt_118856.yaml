   1. Agreed Claims (numbered list): These should be substantial and load-bearing, covering:
      - Stipulations about the report channel and experience channel.
      - What counts as explanation.
      - Interpretation of the two cases (the surgeon's dials and the trained subject).
      - Reliability of reports.

   2. Table of Disagreements: Each row has:
      - Disagreement in neutral wording.
      - Epiphenomenalist's version.
      - Causalist's version.
      - The crux (sub-question that would move at least one side if settled).
      - The case or argument that bears on the crux.
      - Each side's prediction about that case/argument (written in advance).

