prompt: |-
  I host a podcast on social choice, and next week's guest is a game theorist who argues that the Gibbard–Satterthwaite theorem has been badly overread. Her position is that the theorem only rules out mechanisms under which a voter can gain by misreporting whatever the other voters do, a bar she thinks no real institution should be asked to clear, and that the defensible requirement is weaker: no voter should gain by a misreport whose payoff she can work out without modelling the others' strategies. On that reading, the theorem leaves ordinary plurality and runoff voting untouched. Draft eight to ten interview questions that force her to make the weakened requirement precise rather than restate the headline. Include at least one question on what it means, operationally, for a manipulation's payoff to be visible without modelling the others; one on whether the weaker requirement survives voters learning from experience, since a manipulation opaque this season may be transparent the next; one on whether restricting the domain of admissible preferences, say to single-peaked ones, is a more honest route to her conclusion, and why she prefers her route; and one on what the theorem still tells us about real elections once her weakening is granted. For each question, add the follow-up keyed to the answer she is most likely to give. The questions should not ask her to cite or summarise the literature; she should be able to answer from the position as described.
reasoning: |-
  Okay, the user hosts a podcast on social choice theory and needs interview questions for a game theorist guest who critiques the Gibbard-Satterthwaite theorem. The guest's position is that the theorem's standard interpretation sets an unrealistically high bar—requiring strategies to work against all possible opponent actions—and that a weaker, more practical requirement would focus only on manipulations whose payoff is calculable without modeling others' complex strategies. 

  The user wants precise questions that force clarification of this weaker requirement, not just restatements. They specifically request operational definitions of "payoff visibility without modeling others," consideration of learning over time, comparison to domain restriction approaches, and implications for real elections post-weakening. 

  Hmm, the guest's core argument seems to pivot on epistemic accessibility: voters won't manipulate if they can't easily predict the benefit. That's interesting—it shifts focus from mechanism design to cognitive feasibility. The follow-ups should press where "calculable" becomes ambiguous: Does it mean computationally trivial? Observable in past data? Intuitively obvious? 

  For the learning question, the tension is between her "static" view and dynamic reality. If manipulation payoffs become clearer over repeated elections, does her weaker requirement collapse back toward Gibbard-Satterthwaite? She might counter that institutions change too fast for learning, but is that true for say, annual corporate board votes? 

  On domain restriction vs her approach: Single-peaked preferences avoid Gibbard-Satterthwaite entirely by assumption. Her method keeps universal preferences but weakens incentive compatibility. The follow-up should probe why cognitive limits are more principled than structural constraints. 

  Lastly, even after her weakening, the theorem still highlights trade-offs—e.g., between manipulability and other flaws. That question should force her to articulate what designers should actually optimize for. 

  The user clearly knows their stuff—they’re avoiding "explain your paper" questions and demanding operational rigor. I’ll structure questions to unravel the guest’s framework layer by layer, with follow-ups targeting potential ambiguities. No fluff, just steelmanning with pressure points.
answer: |-
  Here are eight interview questions with targeted follow-ups designed to probe the guest's core argument rigorously, moving beyond restatement and forcing precision on the weakened requirement:

  1.  **Core Definition:**
      *   **Question:** You argue we should only worry about manipulations where a voter can calculate the payoff without modeling others' strategies. Operationally, what *concrete steps* must a voter be unable to perform for a manipulation to be considered "invisible" under your requirement? For instance, must they be unable to compute counterfactual outcomes, predict others' best responses, or something else?
      *   **Likely Answer:** Something emphasizing the inability to predict the *specific* outcome change caused by their lie without making complex assumptions or calculations about how specific others will vote.
      *   **Follow-Up:** So, if a voter *can* reliably predict the outcome change *solely* by looking at the current polling/aggregate preferences (without naming individuals or modeling their specific strategic reasoning), would that manipulation then be considered "visible" and thus problematic under your weaker requirement?

  2.  **Operationalizing "Work Out Without Modelling":**
      *   **Question:** How does your requirement distinguish between a manipulation whose payoff requires "modelling others" versus one that merely requires knowing basic institutional rules and *aggregate* information (like polling data or historical vote shares)? Isn't the latter often sufficient to spot a profitable lie in systems like Plurality?
      *   **Likely Answer:** Argues that using aggregate data/polls isn't "modeling others' strategies" in the game-theoretic sense; it's using observable information about likely outcomes.
      *   **Follow-Up:** Doesn't this effectively reduce your requirement to only prohibiting manipulations that are obvious *even if the voter has zero information* beyond their own preference and the voting rule? If polling data *is* available and makes manipulation payoffs clear, does your weaker requirement still consider Plurality/Runoff strategy-proof?

  3.  **Learning & Dynamics:**
      *   **Question:** Your weakened requirement seems static. In real elections, voters learn from experience. A manipulation opaque in season one might become transparent in season two after seeing similar scenarios play out. Doesn't this mean the *long-run* stability of an institution requires resisting manipulations that *become* calculable without complex modeling over time?
      *   **Likely Answer:** Might concede dynamics matter but argue institutions/populations change, or that complex modeling is still distinct from simple learning ("simple heuristics aren't modeling").
      *   **Follow-Up:** If repeated exposure eventually makes the payoff of a specific manipulation (e.g., "Don't vote for your true second choice if they might win") reliably calculable using only past results and aggregate data, doesn't your requirement effectively demand resistance to that manipulation *in the long run* after all? How does your framework handle this?

  4.  **Comparison to Domain Restrictions:**
      *   **Question:** A common way to achieve strategy-proofness is restricting the domain of admissible preferences (e.g., single-peaked). This *does* make mechanisms like Condorcet methods strategy-proof. Isn't this a more direct, honest, and well-defined route to your conclusion that Plurality/Runoff are acceptable, rather than weakening the incentive concept itself?
      *   **Likely Answer:** Argues domain restrictions are unrealistic/unverifiable ("How do you enforce single-peakedness?"), while cognitive limitations on complex strategic reasoning are inherent and universal.
      *   **Follow-Up:** But doesn't your approach also rely on an implicit, unverifiable assumption about the *limits* of voter cognition? How do we empirically verify that voters *cannot* work out the payoff without complex modeling? Isn't assuming single-peaked preferences, while strong, at least a clear structural condition?

  5.  **Precision of the Weakened Requirement:**
      *   **Question:** To make your weaker requirement truly precise: Does it demand that *for every possible preference profile*, there is *no* voter who possesses *both* an incentive to manipulate *and* the cognitive capacity to calculate that manipulation's payoff without modeling others? Or is it a weaker claim about typical profiles or average voters?
      *   **Likely Answer:** Likely clarifies it's a requirement on the mechanism: There should exist *no* voter and *no* profile where that voter *can* both identify a profitable manipulation *and* calculate its payoff without complex strategic modeling of others.
      *   **Follow-Up:** Okay, so it's a universal "no" claim. How do you formally define the set of manipulations whose payoff a voter *can* "work out without modelling the others' strategies"? What is the boundary line?

  6.  **Plurality & Runoff Specifically:**
      *   **Question:** Take the classic "Burr Dilemma" in Plurality: A voter prefers Adams > Jefferson > Burr. Polls show Adams and Jefferson close, Burr trailing. Isn't voting for Adams (their true 2nd choice) over Jefferson (their true 1st) a manipulation whose payoff – avoiding Burr winning – is easily calculable using only the poll and the rule? Why doesn't this violate *your* requirement?
      *   **Likely Answer:** Might argue polls show *likely outcomes*, not *strategies*, or that the voter only needs to know their preference and the rule to see the risk *if* they assume others vote sincerely (which isn't modeling complex strategies).
      *   **Follow-Up:** Isn't relying on the assumption that others vote sincerely itself *using information about others' likely behavior*? How is that fundamentally different, in terms of cognitive demand, from using a poll? Doesn't this suggest the distinction between "using aggregate data" and "modeling strategies" is blurry for your requirement?

  7.  **What G-S Still Tells Us (Post-Weakening):**
      *   **Question:** Granting your weaker requirement, what significant lessons *does* the Gibbard-Satterthwaite theorem still hold for real-world election designers? What core constraints or trade-offs does it highlight that survive your reinterpretation?
      *   **Likely Answer:** Will emphasize that the theorem shows you *cannot* have a universally strategy-proof (in the strong sense) mechanism with more than 2 alternatives that respects unanimity and nondictatorship, highlighting an inherent tension. It forces designers to choose.
      *   **Follow-Up:** But doesn't your reinterpretation suggest that this "inherent tension" is less practically relevant? If strong strategy-proofness is the wrong ideal, is the main surviving lesson simply that *no* system is perfect, which we knew anyway? Or does it point to something deeper about preference aggregation?

  8.  **The "Modeling" Threshold:**
      *   **Question:** You contrast "modeling others' strategies" with simply knowing the rules and one's own preferences. What minimal level of reasoning *about others* disqualifies a manipulation from being "workable" under your requirement? For example, is realizing "If many others also prefer X, then my vote for Y is wasted" already too much modeling?
      *   **Likely Answer:** Will argue that reasoning about general tendencies or aggregate effects isn't equivalent to modeling individual strategic choices or best responses ("I don't need to know *how* Smith or Jones will react").
      *   **Follow-Up:** Where is the bright line? If a voter thinks, "Based on past elections, supporters of candidate C often defect to B in close races between A and B," is that using aggregate data (allowed) or modeling strategic behavior (disallowed)? How does your framework objectively decide?

  These questions focus relentlessly on forcing operational definitions, testing the boundaries of the key concept ("work out without modeling"), probing internal consistency (especially regarding dynamics and information use), comparing it to alternative approaches, and clarifying its real-world implications even after accepting the weakening. The follow-ups anticipate common responses to push the guest towards greater precision or expose potential ambiguities.
