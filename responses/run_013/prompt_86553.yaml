  They mention that when they ask for mechanisms, they're accused of individualism. The user wants to understand if there's a name for this type of argument and seeks conceptual clarity rather than just labels. Key issues: the function is never fixed, explanations slide between necessity and compatibility, and there's no clear feedback loop.

