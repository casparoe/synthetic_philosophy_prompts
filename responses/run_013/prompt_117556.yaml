prompt: |-
  I'm a software engineer with zero philosophy background and I've somehow ended up as the person who writes up recommendations for a small giving circle I'm in — 30-ish of us, we pool about $40k a year, anything over $2k has to go to a full group vote, so I'm basically the triage. People keep bringing us "trades" and I keep saying "I'll think about it" because I can't tell which ones are fine and which ones arn't. The idea, as I understand it (someone said the term is moral trade) is that two people who care about different things can both come out ahead if each does something the other cares about more than they do themselves — the vegetarian pays the meat-eater to go veg for a year, because the vegetarian cares more about the meat-eater's diet than the meat-eater does. That seems obviously fine, but the exact same shape seems to cover stuff that feels like extortion.

  Act like a philosopher who actually works on this, and think it through carefully before you answer. Start with a quick brainstorm of the hard cases, then give me a decision procedure I can actually run on a proposal: the questions in order, what a good-enough answer to each one looks like, where it stops with a no, and where the answer is a values call that has to go to the group instead of to me. Half an hour per proposal is my budget and I can usually get one clarifying email out of whoever's proposing. The two things I keep getting stuck on: whose values do we score the trade against, ours or theirs, and whether saying yes to one of these teaches everyone in the group to start making offers we'd rather not get.

  Then run it on two proposals we actually have on the table:
  1. A member will go vegetarian for a year if we donate $2,500 to a charity they pick that alot of us think is way less important than what we normally fund.
  2. Another member says that if we don't fund their project they're quitting the circle and stopping their volunteer work, and the project is honestly decent, so I'm tempted to just fund it.

  Be committed: if the procedure says no to something that would put money in a good place, say that straight and tell me why, don't hand me both sides and let me pick. And tell me what the procedure can't do. No reading list please, I'm not going to read a paper.
reasoning: |-
  Okay, the user is a software engineer who's ended up handling recommendations for a giving circle. They're dealing with "moral trades" where members propose exchanges like one person going vegetarian in exchange for a donation to a charity they choose. The user needs a clear, step-by-step procedure to evaluate these proposals efficiently. 

  First, I need to understand the core problem. The user is stuck on two main issues: whose values to use when scoring the trade (the group's or the proposer's) and whether approving a trade sets a bad precedent that encourages more such proposals. They also provided two real examples to test the procedure.

  The user wants a philosopher's perspective but practical enough to apply in 30 minutes per proposal. No philosophical jargon, just actionable steps. They emphasized no reading lists and a decisive answer—no waffling. 

  Starting with the hard cases. The vegetarian example seems straightforward, but what if it's more like extortion? Like someone threatening to quit unless funded. That's the second proposal. Key questions: Is this a genuine mutual benefit or coercion? Are both parties better off without harming others? Does it align with the group's purpose?

  Brainstorming hard cases: 
  - Threats: Quitting if not funded. 
  - Lopsided trades: Donating to a charity the group finds unimportant. 
  - Exploitative deals: Where one side has leverage. 
  - Moral hazard: Encouraging more such proposals, diverting funds from the group's mission. 

  For the decision procedure, it needs clear yes/no questions. First, check if it's even a trade—both sides giving something. Then, assess voluntariness: no coercion. Next, the "no harm" rule: no one worse off. Then, alignment with group values. Precedent risk: will this invite bad proposals? 

  Whose values to use? The group's, since it's their money. But need to respect the proposer's autonomy unless it conflicts. Precedent is crucial—approving a trade might open the floodgates. So the procedure must flag if it sets a bad example.

  Applying to proposal 1: Vegetarian for a donation. 
  - Is it a trade? Yes. 
  - Voluntary? Likely yes. 
  - Mutual benefit? Probably, but the charity is less important to the group. 
  - Harm? None. 
  - Alignment? The charity might not align, but the trade itself promotes a value (vegetarianism). 
  - Precedent risk: Medium—might get more lopsided charity requests. 
  Verdict: Values call for the group since the charity's importance is disputed.

  Proposal 2: Fund or I quit. 
  - Trade? No—quitting isn't a contribution; it's a threat. 
  - Voluntary? No, coerced. 
  - Mutual benefit? Unclear, but the group loses a member. 
  - Harm: Yes—loss of volunteer work. 
  - Precedent risk: High—encourages threats. 
  Verdict: No, because it's coercive and sets a terrible precedent.

  The procedure can't handle subjective value disputes perfectly—those need group input. Also, it might miss edge cases, but it's a start. The user needs efficiency, so the steps must be streamlined.

  Final thoughts: The key is protecting the group's mission and cohesion. Trades are okay if voluntary and harmless, but not if they undermine trust or priorities. The user should feel empowered to say no to coercion and escalate value conflicts.
answer: |-
  Here's a philosopher's decision procedure for evaluating "moral trades" in your giving circle, designed for ≤30 min/proposal with one clarifying email. It resolves the "whose values?" question upfront: **Use the group's core values as the anchor, but respect individual autonomy where it doesn't conflict with those values.** Precedent risk is built into the final steps.

  **Core Principles:**
  1.  **Trades must be Pareto-improving:** Both parties should be better off, and no third party (including the group's mission) should be made worse off.
  2.  **No coercion:** Threats or exploitation invalidate the trade.
  3.  **Group mission primacy:** Trades shouldn't systematically divert funds from the group's core priorities.
  4.  **Precedent matters:** Approval shouldn't incentivize proposals that undermine group cohesion or effectiveness.

  **Decision Procedure (Run in Order - Stop at First "No"):**

  1.  **Is this actually a trade?**
      *   *Question:* Does the proposer commit to providing a distinct, verifiable action/benefit *in exchange for* the group's funding? (Funding in return for nothing is just a grant request).
      *   *Good Enough:* Clear "If you fund X, I will do Y." Y is observable (e.g., "go veg," "host an event," "volunteer 100 hrs").
      *   *Stop/No:* Vague promises ("I'll be happier," "I'll advocate more"), no specific action, or action isn't verifiable.
      *   *Values Call?* No. (Clarify if needed).

  2.  **Is the trade voluntary and non-coercive?**
      *   *Question:* Is the proposer offering a genuine exchange, or are they threatening negative consequences if the funding isn't provided? Is there a significant power imbalance being exploited?
      *   *Good Enough:* The proposer frames it positively ("I want to do Y if you support X"). No sense of threat, ultimatum, or exploitation of vulnerability.
      *   *Stop/No:* Explicit threats ("Fund this or I quit," "Fund this or I stop volunteering"), implied harm, or exploiting desperation.
      *   *Values Call?* Rarely. Coercion is usually apparent. (Clarify intent if ambiguous).

  3.  **Does the trade create mutual benefit without harming others?**
      *   *Question (Part A - Mutual Benefit):* Using the *group's values*, is the action (Y) the proposer offers something the group genuinely values *more* than the cost of the donation? Is the donation (X) something the proposer demonstrably values *more* than the cost of their action (Y)? (This is where the "vegetarian pays meat-eater" logic lives).
      *   *Question (Part B - No Harm):* Does completing the trade create significant negative externalities? (e.g., funding harms another cause, action damages group reputation).
      *   *Good Enough:*
          *   *Mutual Benefit:* A plausible case based on the group's known priorities (e.g., "We value member engagement/behavior change; Y aligns with that. The charity X, while not our top priority, clearly matters deeply to the proposer relative to effort Y").
          *   *No Harm:* No obvious significant harm to third parties or the group's reputation/mission.
      *   *Stop/No:*
          *   The action (Y) is trivial or worthless *to the group* ("I'll wear a silly hat").
          *   The donation (X) is actively harmful or severely misaligned with group values *and* the benefit (Y) doesn't sufficiently offset it.
          *   Clear significant harm identified.
      *   *Values Call?* **YES, if:** The *balance* of benefit (Y) vs. donation target (X) is highly debatable within the group's values, OR the harm is contested. *This is the main escalation point.*

  4.  **Is the requested funding clearly "extra" or efficiently diverted?**
      *   *Question:* Does this $2k+ request come from funds *already likely allocated below the $2k threshold*, or would it directly compete with core $2k+ priorities?
      *   *Good Enough:* Proposal explicitly targets "small grant pool" funds, or it's clear funding this wouldn't prevent funding a core priority that would otherwise win a vote.
      *   *Stop/No:* Funding this would likely mean a core $2k+ priority the group values more gets defunded.
      *   *Values Call?* No. (Assess based on current funding pipeline/priorities).

  5.  **Is the precedent risk acceptable?**
      *   *Question:* If we approve trades *like this one*, are we likely to get more proposals that make the group stronger, or more that are coercive, distracting, or erode our mission?
      *   *Good Enough:* This trade type reinforces positive engagement (behavior change, member involvement) without opening the door to obvious abuse (threats, trivial trades, funding harmful orgs). It feels like a "good citizen" proposal.
      *   *Stop/No:* Approval would clearly incentivize proposals we definitely don't want (e.g., threats, funding orgs we hate, constant low-value trades).
      *   *Values Call?* **YES, if:** The precedent risk is ambiguous or depends heavily on future group enforcement. *Escalate if Step 3 was borderline.*

  **What the Procedure CAN'T Do:**
  1.  **Precisely quantify subjective value.** It relies on "plausible case" assessments.
  2.  **Resolve deep disagreements about the group's core values.** It assumes shared values exist.
  3.  **Predict the future perfectly.** Precedent assessment is probabilistic.
  4.  **Handle deliberate bad faith actors.** It assumes basic goodwill.
  5.  **Make you popular.** Saying no to passionate members is hard.

  ---

  **Analysis of Your Proposals:**

  **Proposal 1: Veg for $2.5k to Their Charity**
  1.  **Trade?** YES. Action (Go Veg) for Funding (Specific Charity).
  2.  **Voluntary?** YES (Assuming no threat implied).
  3.  **Mutual Benefit & No Harm?**
      *   *Benefit (Y - Go Veg):* Plausibly valued by the group (promotes discussion, behavior change, member commitment).
      *   *Donation (X - Their Charity):* Acknowledged as lower priority by the group. Key question: **Is the value *to the group* of having a member go veg for a year *greater than* the value *to the group* of $2.5k going to a lower-tier charity instead of the small grant pool?**
      *   *No Harm:* Unlikely significant harm (unless charity is truly harmful).
      *   *Verdict:* **VALUES CALL (Escalate to Group).** The trade-off between the value of the action vs. the diversion of funds is inherently debatable within the group's priorities. *This is the core tension.*
  4.  **Funding Source?** Likely competes with other $2k+ priorities (since it's $2.5k). This slightly weakens the case but isn't fatal alone if Step 3 passes. *If Step 3 is a Values Call, this reinforces escalating.*
  5.  **Precedent?** Moderate risk. Could encourage more "fund my pet charity for my action" trades. Need to decide if those could be beneficial or distracting. Manageable with clear criteria, but reinforces escalation.
      *   **PROCEDURE RESULT: ESCALATE TO GROUP.** The core value trade-off demands group consensus.

  **Proposal 2: Fund My Project or I Quit Volunteering**
  1.  **Trade?** **NO.** This is not "If you fund X, I will do Y." This is "If you *don't* fund X, I will do Z (quit)." The "offer" is the *absence* of a negative action contingent on funding. This is structurally different and fails the fundamental trade test.
  2.  **Voluntary?** **NO.** This is a clear threat/ultimatum: "Do what I want or I harm the group (by withdrawing my contribution)." Coercion is inherent.
  3.  **Mutual Benefit & No Harm?** *Doesn't matter because Steps 1 & 2 failed.* But note: Harm is explicit (loss of volunteer) if not funded. The "benefit" is avoiding harm they are threatening to cause.
  4.  **Funding Source?** N/A (Already failed).
  5.  **Precedent?** **EXTREME RISK.** Approving this teaches everyone that threats work. Guaranteed to generate more threats ("Fund this or I quit," "Fund this or I badmouth the group").
      *   **PROCEDURE RESULT: REJECT IMMEDIATELY (Stop at Step 2).** **Why it's a "No" even if the project is good:** Funding under threat destroys group trust, incentivizes future coercion, and rewards holding the group hostage. It prioritizes appeasement over mission and principle. The *good* project should be evaluated *on its merits* through the normal process, separate from the threat. Tell the member: "We evaluate projects based on alignment with our mission and priorities, not based on consequences if we don't fund them. Please submit your project for consideration on its own merits. Threats regarding your participation are counterproductive and won't be a factor in funding decisions." **This is non-negotiable for group health.**

  **Commitment Check:** The procedure says a decisive **NO** to Proposal 2, even though funding it might put money towards a "decent" project *in the short term*, because the long-term cost to group cohesion, trust, and the precedent of rewarding coercion is far greater and fundamentally undermines the purpose of the circle. Funding under threat is worse than losing one volunteer.
