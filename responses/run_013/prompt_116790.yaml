answer: |-
  You're absolutely right – "judge them by the standards of their time" is a rhetorical Swiss Army knife, often deployed to shut down criticism without precision. Let's dissect the distinct claims lurking inside it, assess their validity, and see which ones actually support the "criticism off the table" conclusion.

  **The Core Claim & Its Variants (With Verdicts):**

  1.  **"We should understand the historical context."**
      *   **Claim:** Actions and beliefs don't exist in a vacuum; social norms, knowledge, technology, political realities, and prevailing ideologies shaped choices. Ignoring this leads to shallow, anachronistic judgment.
      *   **Verdict: Platitude (But Important).** Absolutely true and essential for *understanding*. However, it's the *starting point*, not the conclusion. Understanding context doesn't automatically preclude moral criticism. It just means criticism needs to be *informed*.

  2.  **"Moral knowledge was limited; they *couldn't* have known better (Epistemic Limitation)."**
      *   **Claim:** The ethical truth we now recognize was genuinely inaccessible or unimaginable to people in that era due to lack of scientific/social/philosophical development.
      *   **Verdict: Often False or Highly Suspect.** This is where your point about contemporaries is crucial. For most major historical injustices (slavery, colonialism, misogyny, religious persecution), **there were vocal contemporary critics applying recognizably modern ethical principles.**
          *   *Examples:* Abolitionists condemned slavery *during* Jefferson's time. Critics of colonial brutality existed *during* Churchill's tenure (e.g., critics of the Bengal Famine, Amritsar Massacre). Bartolomé de las Casas condemned Spanish brutality *contemporaneously* with Columbus.
          *   **Conclusion:** This claim frequently collapses under scrutiny. The "knowledge" wasn't absent; it was actively suppressed, ignored, or outweighed by other motives (power, profit, prejudice) by those in positions of authority. It's rarely that they *couldn't* know; it's often that they *chose* not to know or heed.

  3.  **"They were *socially conditioned* not to care (Moral Psychology/Formation)."**
      *   **Claim:** Even if the knowledge existed, individuals are profoundly shaped by the dominant norms and ideologies of their upbringing and society. Challenging these requires extraordinary insight and courage most people don't possess. Their "moral compass" was calibrated differently.
      *   **Verdict: Defensible (But Nuanced & Doesn't Absolve).** This has significant psychological and sociological truth. Internalizing dominant norms is powerful. However:
          *   It's a statement about *degree of difficulty*, not *impossibility* (as contemporaneous critics prove).
          *   It doesn't eliminate moral responsibility; it contextualizes the *effort* required to overcome it.
          *   This is a powerful argument for *sympathetic understanding* or *mitigating factors*, **not for immunity from criticism.** We can condemn the *act* (e.g., owning slaves) while understanding the *psychological forces* that made it seem "normal" to the individual. It shifts the target of criticism *towards* the system that shaped them, but doesn't erase the individual's role within it.

  4.  **"Morality itself is relative to the era (Moral Relativism)."**
      *   **Claim:** There are no objective moral truths transcending time and culture. What was "right" in 1500 simply *was* right for 1500, and judging it by 21st-century standards is meaningless.
      *   **Verdict: Radically False (if claiming strong relativism) OR Defensible but Irrelevant (if weak).**
          *   *Strong Relativism (No Universal Morality):* If sincerely held, this *would* make criticism across time nonsensical. But it's philosophically problematic (justifies any atrocity if culturally accepted) and rarely what proponents *actually* believe (they wouldn't defend Nazi ethics "by their time's standards").
          *   *Weak Relativism (Understanding Variation):* This collapses back into Claim 1 (understanding context). It doesn't say past actions were *morally right for their time*, just that *their justifications* made sense within their framework. This framework itself can (and often should) be critically evaluated.

  5.  **"We shouldn't blame them for factors beyond their control (Moral Luck)."**
      *   **Claim:** It's unfair to harshly condemn someone for being born into a society with deeply flawed norms they didn't choose. Their "moral starting point" was a matter of luck.
      *   **Verdict: Defensible (But Limited).** Moral luck is a real philosophical conundrum. However:
          *   It primarily argues for *mitigation* of *personal blame/condemnation*, not for the *moral permissibility* of the *act itself*. We can still judge the act as wrong.
          *   It applies unevenly. We *do* hold people responsible for overcoming difficult circumstances in other areas (courage in war, resisting corruption). Why is overcoming pervasive social immorality different?
          *   **Conclusion:** This might lessen the *personal venom* directed at a historical figure ("they were a product of their time"), but it doesn't erase the *historical judgment* of their actions or the systems they upheld.

  6.  **"Character was fixed by environment; they weren't responsible for their character (Determinism Lite)."**
      *   **Claim:** Their beliefs and actions flowed inevitably from their social conditioning, leaving no room for genuine choice or responsibility for their character.
      *   **Verdict: Highly Controversial & Usually False in Practice.** While environment shapes us, most ethical systems and common sense hold that individuals *do* have some capacity for reflection, choice, and resistance, especially figures with power and education (like Jefferson or Churchill). Contemporaneous critics demonstrate this capacity existed. This level of determinism usually only gets invoked selectively to defend specific figures, not applied consistently.

  **Your Hobbyhorse: "The Standards" = "The Powerful's Standards" (Cherry-Picking the Context)**

  *   **The Move:** Defining "the standards of the time" exclusively as the norms held by the dominant, powerful group (e.g., wealthy white male slaveholders in Jefferson's Virginia).
  *   **Why it's Wrong:** This deliberately erases contemporaneous dissent and alternative moral frameworks held by marginalized groups (abolitionists, colonized peoples, women, religious minorities, etc.). It pretends the dominant view was the *only* view.
  *   **Verdict: False & Dishonest.** It's historical cherry-picking designed to excuse the powerful. "Their time" encompassed *all* the moral debates and conflicts happening then. If we are to judge by "standards of the time," we must consider the *full spectrum* of ethical viewpoints present, including the critical ones. Ignoring abolitionists when judging Jefferson isn't using "standards of the time"; it's using "standards of Jefferson's privileged peers."

  **Which Claims Actually Get to "Criticism is Off the Table"?**

  1.  **The Epistemic Limitation Claim (#2):** *If true* (which it rarely is for major figures regarding major injustices), it *could* potentially negate moral responsibility ("How could they know?"). But its factual weakness makes it a poor shield.
  2.  **Strong Moral Relativism (#4):** *If sincerely believed*, this does make cross-temporal criticism logically impossible ("It was right *then*"). However, proponents rarely hold this consistently and it's philosophically untenable.
  3.  **Hard Determinism (#6):** *If true*, it removes agency and thus responsibility. But it's rarely accepted consistently and contradicts evidence of moral choice within eras.

  **Crucially:** Claims #1 (Context - Platitude), #3 (Conditioning - Defensible), and #5 (Moral Luck - Defensible) **DO NOT** get you to "criticism is off the table." They get you to:
  *   "Understand the context for an informed critique."
  *   "Recognize the psychological difficulty, which might lessen *personal* condemnation but not the judgment of the *act* or *system*."
  *   "Acknowledge the luck of birth mitigates *personal* blame, but not the wrongness of the action."

  **The Bait-and-Switch:** The rhetorical power comes from **smuggling Claim #2 (False Epistemic Limitation) or Claim #4 (Strong Relativism) under the cover of Claim #1 (Essential Context)**. Someone says "judge by their time," meaning Claim 1 (good advice). The opponent *hears* it as Claim 2 or 4 ("they couldn't know" or "it was right then"). The slogan facilitates this confusion.

  **Your Counter-Paste:**

  "Let's unpack 'judge by the standards of their time.' It *could* mean:
  1.  **Understand context (Platitude/Good):** Essential, but doesn't forbid criticism, just demands it be informed.
  2.  **They couldn't know better (Usually False):** Contemporaneous critics prove the knowledge existed; they often chose to ignore it.
  3.  **They were shaped not to care (Defensible/Nuanced):** Explains difficulty, but doesn't erase responsibility for actions or complicity in systems. Critics prove overcoming it was *possible*.
  4.  **Morality itself was different (False/Relativism):** Rarely held consistently & leads to absurdity.
  5.  **Moral luck mitigates blame (Defensible/Limited):** Lessens *personal* venom, not the judgment of the *act*.
  6.  **Their character was determined (False/Controversial):** Contradicted by evidence of choice.

  **Crucially:** Defining 'standards of the time' as *only* the views of the powerful (ignoring dissenters like abolitionists) is cherry-picking, not historical honesty. Understanding context (#1) is vital, but it's the start of the conversation, not the end. It allows us to ask the *harder* questions: 'Why did they reject the critical voices *of their own time*? What motivated them to uphold harmful systems when alternatives were being proposed?' That's where real historical and moral analysis begins, not ends."
