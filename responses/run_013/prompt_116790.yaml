prompt: |-
  Ok so I keep getting into this same argument and I want to actually nail it down. Someone (usually on twitter, usually about Jefferson or Churchill or Columbus) says "you have to judge them by the standards of their time" and treats it like checkmate — like it just follows that you can't criticise them at all. I get that there's something to it, but I also think people smuggle like five different claims under that one sentence and never say which one they're running.

  Can you lay out the distinct precise things "judge them by the standards of their time" could be claiming, from the trivial to the radical, and give me a verdict on each — platitude, defensible, or actually false? Stuff I specifically want covered: the difference between "they couldn't have known better" and "they knew but were shaped not to care," and whether the first is even true given that plenty of their contemporaries clearly did know better and said so loudly; whether the slogan is secretly a claim about morality being relative to an era at all; whether it's really a claim about moral luck, or about how much of someone's character they were responsible for; and whether "the standards of the time" even picks out one thing, since every era has competing standards and we're really being asked which one to use. Then tell me which of the readings actually gets the person to their conclusion that criticism is off the table, versus which ones are true but toothless.

  The move I most want dissected is the one where "his time" quietly means "the powerful people of his time," so that the abolitionist who disagreed with him in 1780 somehow doesn't count as part of his time. But I want the whole menu, not just my hobbyhorse. Lay it out so I can just paste it next time someone does this to me.
