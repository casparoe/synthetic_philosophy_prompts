  1. The safety of the top rung: note that the catastrophe was set to be very bad and unlikely (only 20% chance when both push). But because it was so bad, teams were very afraid of it. However, because it was unlikely, they might have been more willing to push in the contested zone. This is the paradox: making the top safe (by making it unthinkable) actually makes the lower level more unstable.

