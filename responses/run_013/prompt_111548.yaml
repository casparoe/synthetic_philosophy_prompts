prompt: |-
  I write about science and ideas for a magazine, and I'm starting a book on the claim that a government can earn the right to rule by delivering the goods — growth, safety, schools, no drama — rather than by being chosen. China and Singapore are the exhibits everyone reaches for; the "Asian values" line from the nineties is the ancestor everyone reaches for after that. I've read enough by now to be bored of the two moves that come up every single time: the split between legitimacy that comes from what a government delivers and legitimacy that comes from who gets to pick it, and the old distinction between support that tracks current performance and support that outlives it. I want to get past those into the stuff that's actually unresolved.

  So here's what I need from you. Take the role of a political theorist who works on comparative authoritarianism and also on the analytic literature about political obligation — someone who reads the China hands and the philosophers and isnt impressed by either. Before you rank anything, brainstorm out loud: what are the genuinely live open questions here, the ones where people who know the material disagree about the answer? Then rank five or six of them for me specifically — I've got about eighteen months and a book contract, and what I care about is which answers would change the shape of the whole debate rather than settle somebody's turf war. For each one: why it's upstream of the others, whether it can be settled by argument and reporting or whether it's really an empirical question I can't do anything with, and what would move it up or down my list. Be explicit about how you're weighing importance against tractability against how many other questions hang on the answer, and adress what you do when those pull apart.

  Some things I've been chewing on — tell me if any of them are confused, already settled, or beside the point:

  - Is legitimacy bought with results a flow that has to be renewed every year, or does something accumulate? And when a regime that runs on results hits a bad stretch, do expectations ratchet up or quietly adapt down? My hunch is that it's a loan and not a stock, but I couldn't tell you what would settle that.
  - Does the reciprocity family of theories of political obligation — the ones that say a state which gives you a decent life has a claim on you — end up doing the work of justifying a benevolent autocracy? Everyone I've floated this past hates the conclusion and nobody has a clean way out of it.
  - The information problem. Ruling by results means knowing which results people want, but the same machinery that keeps the regime safe distorts what it hears. Does that make performance legitimacy self-undermining over a long horizon? And how would anyone know what people in these places actually believe, when so much of what gets said in public is said for the room?
  - Succession and crisis. Is there any mechanism by which one of these regimes outlives its founder, or is that the whole ballgame and everything else is decoration?
  - Which legitimacy is really doing the work in these debates — the sociological kind (people accept it) or the normative kind (it has a right to rule)? Does the gap between them have practical consequences, or is it a philosophers' quarrel?
  - Singapore: is it a case at all, or a selection effect — city-state, entrepot, no hinterland, a ruling party that got lucky with timing?

  Skip the reading list and the citations. I know you can't look anything up, and for what I'm doing the reasoning is the whole point. Do flag how confident you are as you go, though, and at the end single out the one claim in your answer you're least sure of — I'd rather know where the floor is thin than get a confident tour.
reasoning: |-
  Okay, let me start by unpacking what the user is asking. They're a science and ideas writer working on a book about governments earning legitimacy through performance rather than democratic selection. They mention China and Singapore as common examples and the "Asian values" debate. They're tired of the standard legitimacy vs. democratic choice and performance-based vs. enduring support dichotomies. They want to dig deeper into unresolved questions that could reshape the debate.

  First, I need to assess their scenario. They have 18 months and a book contract, so time is a factor but not rushed. They want questions that are pivotal, not just academic turf wars. Their focus is on how answers could change the entire discourse. The user has listed several points they're considering, so I should evaluate those for relevance, confusion, or if they're already settled.

  Looking at their points:
  1. **Legitimacy as flow vs. stock**: They wonder if legitimacy needs constant renewal or accumulates. Also, how expectations shift during bad periods. This seems central because it affects regime stability. If legitimacy is a loan, crises could be more damaging. This is both theoretical and empirical, needing historical analysis of past crises.
  2. **Reciprocity theories justifying autocracy**: They note that reciprocity theories might support benevolent autocracies, which is uncomfortable for many. This is a normative dilemma. The user might be hinting at a gap in political theory where principles lead to uncomfortable conclusions. This is philosophical but has real implications for how we judge regimes.
  3. **Information problem**: Performance legitimacy requires knowing what people want, but authoritarian systems distort feedback. This could undermine long-term stability. It's a structural issue, tying into how regimes gather accurate data. Empirical studies on information flow in such states would be relevant, but hard to access.
  4. **Succession and crisis**: Can regimes survive their founders? This is crucial for longevity beyond charismatic leaders. Historical cases like post-Lee Singapore or post-Mao China show varied outcomes. It's an empirical question with theoretical implications for institutionalization.
  5. **Sociological vs. normative legitimacy**: They question which type matters more and if the gap has practical effects. This is foundational; the debate's shape depends on which legitimacy is prioritized. It's philosophical but affects how we measure acceptance vs. moral right.
  6. **Singapore as a case**: Is it a valid example or a unique case? This questions generalizability. If Singapore's success is due to unique factors, using it as a model is flawed. Needs comparative analysis with other city-states or similar entities.

  Now, brainstorming open questions beyond these:
  - **Institutionalization of performance legitimacy**: How do regimes codify performance into stable institutions? This ties into succession and long-term viability.
  - **Public vs. private beliefs**: How to measure true support when public dissent is suppressed. Surveys and indirect indicators might help, but reliability is an issue.
  - **Global factors**: External influences like trade, sanctions, or pandemics affecting performance and thus legitimacy. This adds another layer to the sustainability question.
  - **Moral limits of performance**: Even if effective, do regimes lose legitimacy if they violate human rights? This connects normative and sociological aspects.

  Ranking criteria:
  - **Upstream impact**: Questions that influence multiple other issues.
  - **Tractability**: Can they be addressed within 18 months? Some need deep empirical research, others philosophical analysis.
  - **Debate-changing potential**: Answers that could shift the entire conversation.

  Prioritized questions:
  1. **Sociological vs. Normative Legitimacy**: This is foundational. Resolving which legitimacy matters in discourse affects how other questions are framed. High impact, moderately tractable through conceptual analysis.
  2. **Reciprocity and Autocracy**: Forces a reevaluation of political obligation theories. Could challenge liberal democratic assumptions. Philosophical, so tractable through argumentation, but may not have a definitive answer.
  3. **Information Problem**: Central to sustainability. If performance legitimacy self-undermines, it questions its viability. Requires empirical data, which is hard to get, so less tractable but high impact.
  4. **Legitimacy Accumulation**: Affects regime resilience during crises. Historical case studies could provide insights, making it moderately tractable.
  5. **Succession Mechanisms**: Practical for regime survival. Empirical, tractable through comparative analysis of successions.
  6. **Singapore's Generalizability**: Important for the model's validity. Needs comparative research, but if settled, could narrow the debate's scope.

  The user's points aren't confused; they're relevant. The reciprocity question is particularly thorny and unresolved. Singapore's uniqueness is debated but not settled. The least confident point might be about information distortion's long-term impact due to data access issues. 

  Final selection should balance impact and feasibility. Sociological vs. normative legitimacy is the most upstream, followed by reciprocity, as both reshape theoretical foundations. Then information problem and accumulation, with succession and Singapore's case being more specific but still important. The user should prioritize questions that redefine the debate's parameters rather than incremental answers.
answer: |-
  Here's a breakdown of genuinely unresolved questions in the performance legitimacy debate, tailored for your project. I’ve evaluated them based on **upstream impact** (how many other questions depend on this), **tractability** (feasibility for you to address in 18 months), **debate-shifting potential** (whether answering it reorients the conversation), and **tension between criteria** when they conflict.  

  ### Brainstorm: Live Open Questions  
  1. **The Moral Threshold Question**: Does performance legitimacy require adherence to *minimum moral standards* (e.g., no genocide, systematic torture) even if "goods" are delivered? Or can efficacy entirely override normative deficits?  
  2. **The Epistemic Problem of "Goods"**: Who defines what counts as a "good"? Is it regime-determined GDP/safety metrics, or citizen-experienced quality of life? How do we reconcile gaps (e.g., high GDP with extreme inequality)?  
  3. **Temporal Durability**: Can performance legitimacy create *self-sustaining institutions* immune to leadership transitions/economic shocks? Or is it perpetually fragile, resetting to zero after crises?  
  4. **Reciprocity’s Autocracy Trap**: Does the logic of reciprocity *inherently* favor autocracy by prioritizing outcomes over consent? Can liberal theorists escape this without ad hoc exceptions?  
  5. **The Belief-Action Gap**: How do we measure genuine sociological legitimacy when public compliance is rational (avoiding punishment) and private beliefs are inaccessible? Is survey/data from authoritarian contexts interpretable?  
  6. **The Scalability Problem**: Is performance legitimacy viable *only* in homogenous/compact societies (Singapore) or during developmental "catch-up" phases (China 1980s–2010s)? Does it fail at complexity/diversity?  

  ---

  ### Ranked Questions for Your Book  
  *(Ranked by debate-shifting potential + tractability)*  

  1. **The Reciprocity-Autocracy Trap (Your Point #2)**  
     - **Why Upstream**: If reciprocity theories *necessarily* justify benevolent autocracy, it collapses the moral distinction between democratic and authoritarian social contracts. This forces a reckoning in political philosophy.  
     - **Tractability**: Settled through argument (interrogate Rawls, Nozick, Simmons; test counterarguments). Requires minimal empirical work.  
     - **Move the Needle**: A clear "no escape" conclusion would reframe performance legitimacy as philosophically authoritarian by design. A robust liberal rebuttal would isolate it as a contingent outlier.  
     - **Confidence**: High (80%) — The trap is logically consistent, but I’m less sure about undiscovered counterarguments.  

  2. **The Epistemic Problem of "Goods" (Linked to Your #3)**  
     - **Why Upstream**: If "goods" are regime-defined, performance legitimacy becomes circular (regimes "deliver" by their own metrics). Forces engagement with *whose needs matter*.  
     - **Tractability**: Mix of argument (theories of needs/justice) and reporting (e.g., compare China’s "targeted poverty alleviation" with rural discontent).  
     - **Debate Shift**: Reveals performance legitimacy as a *negotiation of power* — not a neutral technocratic exchange.  
     - **Confidence**: Medium-High (70%) — Grounded in political theory (e.g., James Scott) but needs case nuance.  

  3. **The Moral Threshold Question (New)**  
     - **Why Upstream**: Challenges the "goods over process" bargain. If atrocities nullify legitimacy regardless of growth, the entire debate must incorporate deontology.  
     - **Tractability**: Primarily argument-driven (confronting utilitarianism vs. natural rights). Use regimes like Rwanda/Singapore as test cases.  
     - **Debate Shift**: Prevents performance legitimacy from being amoral. Could fracture the "Asian values" consensus.  
     - **Confidence**: Medium (60%) — Depends on convincing skeptics morality isn’t Western bias.  

  4. **Temporal Durability (Your #1 + #4)**  
     - **Why Upstream**: If legitimacy doesn’t accumulate, performance-based regimes are inherently unstable — making succession/crisis existential.  
     - **Tractability**: Empirical (study crises: post-Lee Kuan Yew Singapore, China’s 1989/2022). Requires historical analysis and expert interviews.  
     - **Debate Shift**: Reveals whether "delivering the goods" is a short-term tactic or a long-term governing logic.  
     - **Confidence**: Medium (50%) — Data is patchy; regime resilience often retrofitted to outcomes.  

  5. **The Belief-Action Gap (Your #3 + #5)**  
     - **Why Upstream**: If we can’t measure sociological legitimacy, the empirical basis for performance legitimacy claims evaporates.  
     - **Tractability**: Tough. Requires creative methods (e.g., diaspora interviews, digital ethnography, leakage in censored spaces).  
     - **Debate Shift**: Forces skeptics to either discard "sociological legitimacy" as measurable or adopt indirect proxies.  
     - **Confidence**: Low (40%) — We’re fundamentally inferring hidden preferences.  

  6. **Singapore as Selection Effect (Your #6)**  
     - **Why Lower Priority**: Important but niche. If Singapore is non-generalizable, it merely narrows the debate — doesn’t reshape core assumptions.  
     - **Tractability**: Comparative reporting (Dubai, Qatar) + economic history.  
     - **Debate Shift**: Limits performance legitimacy’s scope but leaves China’s model intact.  

  ---

  ### Addressing Your Chewing Points  
  - **Legitimacy as Flow/Stock (Your #1)**: Not settled. Key is whether citizens see the regime as *institutionally competent* (stock) or *contingently effective* (flow). **Empirical** (how crises are narrated).  
  - **Reciprocity/Autocracy (Your #2)**: Core unresolved tension. Philosophers *haven’t* cleanly escaped this.  
  - **Information Problem (Your #3)**: Critical and underexplored. Self-undermining? Yes, if metrics become performative (e.g., local officials faking data to please Beijing).  
  - **Succession (Your #4)**: Unresolved. Singapore suggests institutionalization is possible; China remains opaque.  
  - **Sociological vs. Normative (Your #5)**: The gap has practical consequences: e.g., a regime can be sociologically legitimate (accepted) but normatively illegitimate (unjust). Your book can bridge this.  
  - **Singapore (Your #6)**: Valid concern. Its size/context *does* make it a weak template.  

  ---

  ### Least Confident Claim  
  **That the reciprocity-autocracy trap is logically inescapable without special pleading**. While I think it’s robust, I’m only 80% confident — a clever revision of "voluntarism" (e.g., tacit consent through economic participation) might undermine it.  

  ### Strategic Advice  
  - **When Criteria Conflict**: Prioritize **upstream impact** over tractability. Your book’s value is reorienting the debate, not solving empirical puzzles (e.g., the Belief-Action Gap).  
  - **Tackle #1 and #2 First**: They’re philosophically rigorous and central. Use #3 (Moral Threshold) to add grit.  
  - **Avoid**: Over-investing in Singapore (#6) or uncrackable empirics (#5).  

  This framework makes legitimacy’s *contingent morality* and *epistemic circularity* the frontiers — moving beyond stale process-vs-performance binaries.
