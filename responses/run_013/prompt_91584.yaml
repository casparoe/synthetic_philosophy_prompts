answer: |-
  ### (a) Exam Question (Take-Home Final)  
  **Time Allotment:** 2.5 hours  

  **Question:**  
  Money-pump arguments are frequently invoked to demonstrate the irrationality of intransitive or incomplete preferences. The standard narrative holds that an agent with (e.g.) preferences A≻B, B≻C, C≻A can be "pumped" for money by a series of trades: trading A for C (paying $1), then C for B (paying $1), then B for A (paying $1), leaving them back at A but $3 poorer.  

  Critically evaluate **whether this argument successfully establishes that cyclical or incomplete preferences are intrinsically irrational**. Your analysis must:  
  1. Reconstruct the core logical structure of the money-pump argument.  
  2. Engage with the objection that a **foresighted agent** could avoid exploitation by refusing to enter the sequence, and analyze what this implies (or does not imply) about the rationality of their preferences.  
  3. Distinguish whether the argument targets **synchronic preference orderings** (e.g., "A≻B at time t") or **diachronic decision procedures** (e.g., "how you choose across a sequence of offers"). Does the pump show a defect in the *preferences themselves* or in the *agent’s behavior over time*?  
  4. Discuss whether the vulnerability exposed by the pump is best understood as a flaw in *rationality* or as a limitation of **naivety about sequential interactions**.  

  Ground your response in decision-theoretic principles (e.g., consistency, dynamic choice). Avoid assuming that agents must accept every trade offered.  

  ---

  ### (b) Model Answer (≈800 words)  

  **Reconstruction of the Core Argument**  
  The money-pump argument (MPA) claims that cyclical preferences (A≻B≻C≻A) or incomplete preferences (e.g., no ranking between A and B) permit exploitative sequences. An agent pays to trade from A to C, then C to B, then B to A, ending where they began but poorer. The MPA concludes that such preferences are irrational because they license predictable, avoidable losses. Formally, the MPA assumes: (i) preferences govern choice; (ii) agents accept trades that improve their position by their own lights.  

  **The Foresight Objection and Its Implications**  
  A foresighted agent with cyclical preferences could refuse the first trade, recognizing that accepting it would initiate a costly sequence ending back at A. For example, they might reject trading A for C (even if C≻A *now*) to avoid future exploitation. Crucially, **this does not rehabilitate cyclical preferences as rational**. It shows only that agents can *avoid* losses by anticipating the sequence, not that their preferences are coherent. If the agent faces only a *subset* of trades (e.g., offered A→C and C→B separately by different parties), foresight may not save them. The objection thus shifts focus: the MPA may fail to prove *diachronic* exploitability in all contexts, but it still reveals that cyclical preferences require *strategic avoidance* to prevent loss—a burdensome constraint absent in transitive preferences.  

  **Preference Ordering vs. Decision Procedure**  
  The MPA conflates two distinct targets:  
  - **Synchronic preference ordering**: The agent’s *atemporal* ranking of outcomes (e.g., A≻B).  
  - **Diachronic decision procedure**: The *rule* guiding choices across time (e.g., "always choose the preferred option now").  
  The MPA’s vulnerability arises only when an agent uses a **myopic procedure** (e.g., "always accept preferred-singleton trades"). An agent with cyclical preferences but a **resolute procedure** (e.g., "commit ex ante to refusing all trades involving A, B, or C") escapes the pump. Thus, the MPA primarily critiques *procedures* that slavishly follow synchronic preferences without regard for future consequences. **This does not prove cyclical preferences are intrinsically irrational**—it shows that *coupling them with myopic choice rules* is disastrous. Conversely, transitive preferences "immunize" agents against such pumps *regardless* of their procedure, suggesting they are robustly rational.  

  **Naivety vs. Rationality**  
  The MPA’s bite depends on an agent’s naivety about sequential choice. A sophisticated agent with cyclical preferences avoids the pump but pays an epistemic cost: they must recognize pump structures, remember commitments, and resist tempting trades—a vulnerability transitive-preference agents lack. The pump thus exposes a **pragmatic defect in cyclical preferences**: they force agents into either losses (if myopic) or constant vigilance (if foresighted). While this does not entail *logical inconsistency* in the preferences themselves, it reveals that they generate *practically untenable choices* under plausible conditions.  

  **Conclusion: What the Pump Earns**  
  The MPA fails as a *deductive proof* that cyclical preferences are irrational *simpliciter*. It succeeds only in showing that:  
  1. Cyclical preferences + myopic procedures = guaranteed loss.  
  2. Avoiding loss requires foresight—a diachronic solution to a synchronic defect.  
  3. Transitive preferences are *procedurally resilient*: they shield agents from exploitation regardless of naivety.  
  Thus, the pump is best seen as an argument for the **pragmatic superiority of transitivity** in diachronic contexts, not a refutation of cyclical preferences in abstract theory. It demonstrates that rationality must account for *temporal structure in choice*, not just preference coherence at a single time.  

  *(Word count: 798)*  

  ---

  ### (c) Marking Scheme (Total: 25 points)  
  **Essential Moves (Top Answers Must Include):**  
  1. **Accurate reconstruction of MPA’s logic** (3 pts): States core assumptions (preferences → choice, acceptance of beneficial trades).  
  2. **Engagement with foresight objection** (6 pts):  
     - Explains how foresight blocks exploitation.  
     - Argues this *does not* vindicate cyclical preferences (e.g., highlights burdens of avoidance, contextual vulnerability).  
  3. **Distinction: Preference ordering vs. decision procedure** (5 pts):  
     - Clearly separates synchronic preferences from diachronic choice rules.  
     - Notes MPA targets *myopic procedures* (not necessarily preferences themselves).  
  4. **Synchronic/Diachronic analysis** (4 pts):  
     - Uses the distinction to show why transitive preferences are robust (work with any procedure).  
     - Explains why cyclical preferences require procedural "crutches" (e.g., resolute commitment).  
  5. **Critical conclusion** (4 pts):  
     - Rejects MPA as proof of intrinsic irrationality but affirms its pragmatic implications.  
     - Notes transitivity’s procedural advantages.  

  **Common Errors (Deduct Points):**  
  - **-3 pts**: Treating MPA as a *deductive proof* that cyclical preferences are irrational.  
  - **-2 pts**: Assuming agents *must* accept every trade offered (fails to engage foresight).  
  - **-3 pts**: Collapsing ordering/procedure distinction (e.g., "preferences are irrational because they cause bad choices").  
  - **-2 pts**: Superficial treatment of synchronic/diachronic distinction (e.g., name-checking without analytical work).  
  - **-2 pts**: Ignoring that foresight imposes epistemic/practical costs.  

  **Contested vs. Settled Claims (Clarify in Grading):**  
  - **Settled**: Foresight blocks exploitation (McClennen 1990); MPA assumes myopic choice (consensus).  
  - **Contested**:  
    - Whether cyclical preferences *themselves* are irrational (e.g., Andreou vs. Davidson).  
    - Whether "resolute choice" is feasible or rational (e.g., McClennen vs. Bratman).  
    - Whether procedural resilience is necessary for rationality (instrumentalists vs. structuralists).  
  *(Note: Top answers need not resolve these but must acknowledge their existence.)*  

  **Band Descriptors:**  
  - **21–25**: All essential moves present; nuanced on foresight/procedure distinction; flags contested issues.  
  - **16–20**: Covers key points but weaker on foresight implications or synchronic/diachronic interplay.  
  - **11–15**: Superficial on objections; conflates ordering/procedure; misses pragmatic limitations.  
  - **0–10**: Recites standard MPA without critical analysis; commits major errors.
