  ### Empty Combinations and Why
  The tree leaves some combinations of answers unexplored:
  - **"Arrange enforcement" (Leaf 4) + "Paid for disposition" (Leaf 6)**: Empty because the tree prioritizes external aids (Q1–Q2) over disposition (Q5). This is **unexplored**: One could argue disposition enables enforcement, but the tree forces a choice early.
  - **"Deny case possible" (Leaf 5) + "Turn down on principle" (Leaf 7)**: Empty because "cannot form intention" (Q6) leads to Leaf 5/3, bypassing principles. This is **incoherent**: If the case is impossible, you can’t "turn down on principle" within it.
  - **"Resolute" (Leaf 1) + "Sophisticated" (Leaf 2) in certainty variant**: Empty because the 90% variant (Q3–Q4) merges with the original outcome. This is **unattractive**: Distinguishing them would split hairs without new insight.

  ---

  ### How the Tree Separates "Should Do" from "Intentions"
  - **"Should do" questions**: Focus on actions (e.g., "Would you take the pill?" in Q2, "Would you drink?" in Q4/Q9). These lead to practical decisions (e.g., drink, enforce, refuse).
  - **Intentions implications**: Emerge indirectly from your path. For example:  
    - If you reach Leaf 4, it implies intentions require external support.  
    - If you reach Leaf 6, it implies intentions are dispositional.  
    - If you reach Leaf 3 or 5, it implies intentions are impossible here.  
    The tree never asks directly about intentions, forcing conclusions from your choices.
