       *You avoid the intention dilemma by outsourcing control.*
     - **No** → Go to 2.

  2. **Suppose a pill exists that, if swallowed tonight, would make you strongly desire to drink the toxin at 8 AM (then wear off). Would you take it?**
     - **Yes** → **Leaf 4 (Arrange enforcement)**  
       *You use the pill as a tool to alter your future desires, merging with friend enforcement.*
     - **No** → Go to 3.

  3. **In a variant where the billionaire pays only if you are 90% certain at midnight that you will drink (not just intend), could you make yourself that certain?**
     - **Yes** → Go to 4.
     - **No** → Go to 5.

  4. **In that 90%-certainty variant, if you become 90% certain and get paid, would you drink at 8 AM?**
     - **Yes** → **Leaf 1 (Form intention, take money, drink)**  
       *Your certainty (and thus intention) leads to drinking, implying resolve.*
     - **No** → **Leaf 2 (Form intention, take money, not drink)**  
       *You exploit the gap between forming the mental state and acting, merging with original case.*

  5. **Back to the original case: If you refuse external aids (friend/pill), do you think the billionaire’s demand is really about proving you’re the “type of person” who would drink?**
     - **Yes** → **Leaf 6 (Paid for disposition, not intention)**  
       *You reinterpret the offer as rewarding character, not momentary intent.*
     - **No** → Go to 6.

  6. **Can you sincerely form the intention at midnight in the original case?**
     - **Yes** → Go to 7.
     - **No** → Go to 8.

  7. **Would you actually form the intention?**
     - **Yes** → Go to 9.
     - **No** → **Leaf 7 (Turn down on principle)**  
       *You reject the offer despite being able to form the intention, seeing it as dishonest or irrational.*

  8. **Is it impossible for anyone (not just you) to form the intention in this case?**
     - **Yes** → **Leaf 5 (Deny case possible)**  
       *You argue the scenario is incoherent.*
     - **No** → **Leaf 3 (Turn down: cannot form intention)**  
       *You decline because you personally cannot form the intent.*

  9. **If you form the intention and get paid, would you drink at 8 AM?**
     - **Yes** → **Leaf 1 (Form intention, take money, drink)**  
       *You follow through despite no tangible gain.*
     - **No** → **Leaf 2 (Form intention, take money, not drink)**  
       *You break the intention when it no longer benefits you.*

