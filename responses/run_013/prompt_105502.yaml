answer: |-
  ### Analysis of the Decision-Theory Argument

  Your friend's argument aims to show that expected value maximization (EVM) collapses into absurdity when applied to outcomes with unbounded value, leading to mutually incompatible requirements. I'll break this down step by step, identify where the argument goes wrong, address whether the issue depends on unbounded value, and discuss potential repairs to EVM. My conclusion is that the argument is invalid due to a misinterpretation in the reductio (steps 7–8), and EVM can be preserved with careful handling of unbounded values. No premise of EVM needs to be abandoned outright.

  #### Step-by-Step Critique of the Argument
  The argument's steps are:
  1. **Premise (1):** Rational agents rank actions by expected value (probability-weighted sum of outcome values).
  2. **Premise (2):** For any two actions, if one raises the probability of outcome O by a positive amount (however small) and O's value is sufficiently large, that action outranks the other.
  3. **Premise (3):** The Ritual raises the probability of O, and O's value is unbounded (no finite number captures it, and it outranks all alternatives).
  4. **Interim Conclusion (4):** Therefore, the Ritual's expected value exceeds that of ordinary alternatives (career, friendships, sleep).
  5. **Premise (5):** The action that outranks every alternative is required by rationality.
  6. **Interim Conclusion (6):** Therefore, rationality requires the Ritual.
  7. **Reductio Premise (7):** The same logic requires rival Rituals for different unbounded goods, which are mutually incompatible.
  8. **Premise (8):** A principle requiring mutually incompatible actions is incorrect.
  9. **Final Conclusion (9):** Therefore, (1) is false.

  The flaw arises in **steps 7 and 8**, specifically in the misapplication of EVM when multiple actions have "unbounded" expected value. Here's why:

  - **The core issue is with incomparability, not incompatibility:** When O's value is unbounded (effectively infinite), any action with a positive probability of achieving O has infinite expected value (since \( p \times \infty = \infty \) for \( p > 0 \)). If multiple such actions exist (e.g., Ritual A for O_A, Ritual B for O_B), each has infinite expected value. EVM does not require that all such actions be performed; it requires that an agent choose one action from the set of actions that maximize expected value. In cases of ties (multiple actions with identical maximum EV, such as infinite EV), rationality permits choosing any one—it does not demand all simultaneously. Step 7 incorrectly assumes that EVM "requires" each Ritual individually in a way that forces mutual incompatibility. But EVM only requires that you perform *an* action from the optimal set, not every optimal action. Thus, there is no contradiction, as the principle does not generate mutually exclusive obligations.

  - **Why step 7 misrepresents EVM:** Your friend's argument isolates each Ritual (e.g., considering Ritual A in isolation from Ritual B) to claim it is "required." But decision theory evaluates all available actions simultaneously. When multiple Rituals exist, EVM ranks them as equally optimal due to their infinite EV, so no single Ritual "outranks every alternative" (as required by step 5) because each Ritual does not outrank the other Rituals. Step 5 only applies if there is a unique action that outranks all others—which is not the case here. Rationality thus requires choosing one of the infinite-EV actions, not all of them. This resolves the incompatibility without rejecting EVM.

  - **Supporting weaknesses in earlier steps:** While steps 7–8 are the primary flaw, other steps are problematic under scrutiny:
    - **Step 2's handling of "large enough" value:** Step 2 claims that any positive probability increase, however small, can make an action outrank another if O's value is "large enough." This is correct for finite values (e.g., if O's value V is 10^100 and Δp is 10^{-10}, then Δp × V = 10^90, which may exceed alternatives). But for unbounded values, step 2 glosses over the fact that probability-weighted sums (step 1) may not be well-defined. If O's value is infinite, expected value isn't a real number—it's unbounded or undefined—making comparisons invalid. Step 2 should specify that "large enough" applies only when values are finite and comparable; otherwise, it risks nonsense.
    - **Step 4's slide from "unbounded value" to "expected value exceeds":** Step 4 assumes that an unbounded value translates to a comparable, outweighing expected value. But if O's value is unbounded, the Ritual's expected value might not be strictly "greater than" alternatives in a numerical sense; it could be infinite, while alternatives are finite. This is valid (infinite > finite), but it doesn't extend to comparisons between multiple unbounded values (as in step 7). The "slide" here is harmless in isolation but enables the misstep in step 7.

  In short, the argument fails because the reductio misrepresents EVM's requirements. EVM does not demand incompatible actions; it handles ties (even infinite ones) by allowing choice among equivalents.

  #### Does This Depend on Unbounded Value?
  **Yes, the problem specifically arises from unbounded values.** With finite values, the argument's structure does not lead to absurdity, and EVM functions without issue:

  - **Finite values:** If O's value is merely very large but finite (e.g., V = 10^100), and the probability increase is very small (e.g., Δp = 10^{-10}), the expected value (Δp × V) is finite and comparable to alternatives. For instance:
    - If Ritual A has EV_A = Δp_A × V_A and Ritual B has EV_B = Δp_B × V_B, both finite, EVM can rank them (e.g., if EV_A > EV_B, A outranks B).
    - Ordinary alternatives (e.g., career with EV = 10^6) may or may not be outranked depending on the magnitudes. If Δp × V > EV_ordinary, the Ritual wins; if not, it doesn't. There is no inevitability of conflict.
    - With multiple Rituals, EVM may still require a unique action if EVs differ, or permit choice if tied. No incompatibility arises.

  - **Unbounded values required for absurdity:** Only when values are unbounded (infinite) do we get incomparable infinite expected values. Finite values, no matter how large, yield finite EVs that can be outweighed (e.g., by a sufficiently high-value alternative or a smaller probability increase). Your friend's claim that "nothing else competes" implies unbounded value—otherwise, a finite V could be rivaled by an alternative with high enough EV.

  Thus, unbounded values are essential to the reductio. Without them, step 7's proliferation of "required" Rituals doesn't occur because EVs remain comparable and finite.

  #### Should You Abandon Premise (1)? Repairs to EVM
  **No, you do not need to abandon EVM (premise 1).** The argument is invalid, so rejecting EVM is unnecessary. However, EVM must be clarified or modified to handle unbounded values robustly. Here's why and how:

  - **Why keep EVM?** EVM is a sound principle for rational choice under uncertainty when values are finite and well-defined. The absurdity arises from misapplication, not a fundamental flaw. Your friend's "cheap move" (rejecting the reductio) is correct: the issue is about serving multiple masters, not EVM's falsity. EVM can be repaired to avoid this pitfall while preserving its core.

  - **Repairs for unbounded values:** To rescue EVM, impose constraints that ensure expected values are always comparable. Common solutions:
    - **Cap values at a finite maximum (e.g., a utility ceiling):** Assign a large but finite upper bound to all values (e.g., 10^100). This forces EVs to be finite and comparable, eliminating infinite ties. However, it may not respect preferences if an outcome is genuinely valued beyond all bounds (e.g., your friend's O). It also feels arbitrary: why cap at 10^100 and not higher?
      - *Pros:* Simple, retains EVM's computational tractability.
      - *Cons:* May misrepresent agent's values; doesn't resolve small-probability concerns.
    - **Impose a probability floor (e.g., ignore negligibly small probabilities):** Disregard outcomes with probabilities below a threshold (e.g., ε = 10^{-20}). The Ritual might be excluded if its probability increase is too small, avoiding the issue. But this is also arbitrary and may discard meaningful actions (e.g., a lottery with huge payoff).
      - *Pros:* Avoids domination by tiny probabilities; aligns with human heuristics.
      - *Cons:* Ignores genuine preferences; probability thresholds are subjective.
    - **Lexical ordering:** Rank actions first by the probability of achieving an unbounded good (or by whether they have any chance of it), then by secondary criteria (e.g., expected value of finite goods). For example:
      - Actions with positive probability of unbounded value are infinitely better than those without.
      - Among such actions, compare probabilities or other values to break ties.
      - *Pros:* Respects unbounded values while ensuring comparability; no need to quantify infinity.
      - *Cons:* More complex; requires defining hierarchy; may not capture all intuitions.
    - **Reject unbounded values as incoherent:** Insist that all values must be finite for rationality. Outcomes with "unbounded" value are reinterpreted as having finite but contextually large value. This avoids EVM breakdown but may feel dismissive of your friend's perspective.

  These repairs "rescue" EVM by making it well-behaved, not by disguising it. Lexical ordering is the most elegant solution, as it accommodates unbounded values without abandoning EVM's essence.

  #### Recommendation
  - **Where the argument goes wrong:** Focus your rebuttal on steps 7–8. EVM does not require incompatible actions; it requires choosing one from a set of equally good options when ties exist. Unbounded values cause ties, but ties are manageable.
  - **What it costs you:** To keep EVM, you must handle unbounded values explicitly—e.g., by adopting lexical ordering or accepting that rationality permits choice in cases of equal infinite EV. This doesn't weaken EVM; it refines it for edge cases.
