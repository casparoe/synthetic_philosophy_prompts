          P(you exist | A) = 1 (because if A is true, you are the one).
          So then P(B| you exist) = 0.5.

    This is the difference.

    So to see the difference, we need a case where in the small world you might not have existed.

    In our game, in the Small world, the chance that you (a specific student) are the observer is 1/6. In the Large world, it is 1. So then:

        SIA: 
            P(you exist | Large) = 1
            P(you exist | Small) = 1/6
            P(Large | you exist) = [1 * 0.5] / [1*0.5 + (1/6)*0.5] = 6/7.

        SSA: 
            We condition on being an observer: 
