  ### In-Class Game: "Observer Lottery"

  **Objective:** Students encounter the self-sampling vs. self-indication distinction by betting on the size of their "world" using only their existence as observers, mirroring the philosopher's argument. No prior exposure to anthropic terms is assumed.

  ---

  ### **Setup & Materials**
  - **Students:** 18 (split into 6 groups of 3).
  - **Materials per Group:**
    - 1 coin (for world-size randomization).
    - 6 sealed envelopes: 3 labeled "O?" (observer candidates), 3 labeled "NO" (non-observers).  
    - 1 "World Size" card (secretly fixed by coin flip).
    - Betting slips (small/large).
  - **Teacher Materials:** Master list to record world sizes and bets.

  ### **World-Size Fixing**
  1. **Secret Assignment:**  
     - Before class, assign each group a world size (Small or Large) via coin flip:  
       - **Heads → Small World:** Only **1 observer slot** exists.  
       - **Tails → Large World:** **100 observer slots** exist.  
     - Record each group’s world size on the master list (students never see this).  
     - **Key:** Observers only "exist" if their envelope contains an observer card. Non-observers "don’t exist" and cannot bet.

  2. **Observer Selection:**  
     - **Small World (1 slot):** Only 1 "O?" envelope contains an **"Observer"** card; the other 2 contain **"Non-Observer"**.  
     - **Large World (100 slots):** All 3 "O?" envelopes contain **"Observer"** cards.  
     - **Non-Observer Envelopes (all groups):** All 3 "NO" envelopes contain **"Non-Observer"** (distraction).  

  ---

  ### **Game Rules & Timeline**  
  *(75 minutes total)*

  1. **Introduction (10 min):**  
     - Explain: "Each group is a self-contained ‘universe.’ Your goal: bet whether your universe is Small (1 observer) or Large (100 observers). You may only use **one fact**: whether *you personally exist as an observer*."  
     - Emphasize secrecy: No sharing envelope contents!

  2. **Distribution (5 min):**  
     - Give each student one sealed envelope (randomly shuffle "O?" and "NO" envelopes).  
     - Place the group’s "World Size" card (face down) in the center.  

  3. **Observation Phase (10 min):**  
     - Students open envelopes privately:  
       - If they have an **"Observer"** card, they **exist** and may bet.  
       - If they have a **"Non-Observer"** card, they **do not exist** and sit out (no betting).  
     - *Crucial: Non-observers see "Non-Observer" but learn nothing about others.*

  4. **Betting Phase (15 min):**  
     - **Existing observers** write "Small" or "Large" on a betting slip.  
     - **Scoring (hypothetical):**  
       - Correct bet: +1 point.  
       - Incorrect bet: 0 points.  
       - Non-observers: 0 points (they "don’t exist").  
     - Collect slips.  

  5. **Revelation & Discussion (25 min):**  
     - Reveal each group’s world size. Tally bets.  
     - Discuss patterns:  
       - In **Large Worlds**, all 3 observers typically bet "Large" (correct).  
       - In **Small Worlds**, the 1 observer often bets "Large" (incorrect) or rarely "Small" (correct).  

  6. **Debrief (20 min):**  
     - **Map to Philosopher’s Argument:**  
       - **Self-Sampling (SSA):** "I am a random observer from all *actual* observers. In Small, I’m 1 of 1; in Large, I’m 1 of 100. Large is less likely!"  
         - *But students bet Large anyway—why?*  
       - **Self-Indication (SIA):** "My existence is evidence for more observers. Large has 100 slots, so I’m 100x more likely to exist there!"  
         - This dominates reasoning → bet Large.  
       - **Philosopher’s Leap:** "I exist → more slots exist (Large universe)" is SIA in action.  
     - **Limitation of the Game:**  
       - Students know the exact **ratio** of observer slots (1 vs. 100). Real cosmologists don’t! The game assumes priors (50/50 small/large), but real-world priors are unknown. **You must supply:** *How do we set priors for universe sizes without observational data?*  
     - **Key Insight:** SSA focuses on *your place among actual observers*; SIA weights worlds by *how many observers could exist*.  

  ---

  ### **Likely Pitfalls & Recovery**
  - **Pitfall 1:** Non-observers feel left out and try to infer/bet.  
    - *Recovery:* Stress that non-observers "don’t exist" (no stake in the universe).  
  - **Pitfall 2:** Observers peek at others’ cards or assume group size = world size.  
    - *Recovery:* Enforce private card checks. Clarify: "Your group has 3 *candidates*, but the *world* has 1 or 100 slots."  
  - **Pitfall 3:** Students ignore probability and bet randomly.  
    - *Recovery:* Use the tally to show trends (e.g., 80% of Small World observers bet Large). Ask: "Why did you feel pushed toward Large?"  

  ---

  ### **Why This Works**  
  - Students experience the **tension** firsthand:  
    - SSA whispers: "You’re special, so Small is possible!"  
    - SIA shouts: "You exist, so bet on more slots!"  
  - The philosopher’s argument ("I exist, so the universe must be huge") becomes visceral when they bet against astronomical odds and lose in Small Worlds.  
  - The debrief names SSA/SIA *after* they feel the fork, making it stick.
