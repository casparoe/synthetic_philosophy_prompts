    Map to the two assumptions:

    - self-sampling (SSA): you should reason as if you are randomly selected from all actual observers. In the Small world, there is 1 observer; in the Large world, 6. So the conditional probability that you are in the Large world given that you are an observer is 6/7.

    - self-indication (SIA): you should take your own existence as evidence in favor of worlds with more observers. In this setup, the chance that you exist as an observer in the Large world is 1, in the Small world is 1/6. So by Bayes, P(Large | you exist) = [1 * 0.5] / [1*0.5 + (1/6)*0.5] = 6/7.

