    But wait, in the Large world with 100 observers, are you guaranteed to exist? Only if you are one of the 100. But if we are a specific individual, then in the small world we are that one observer, and in the large world we are also that same individual, so if the large world contains us, then we exist in both. So then we exist in both worlds with probability 1.

    The only way to make it work is to consider that in the small world, there is a small chance that we (as a specific individual) would have been born, and in the large world, a larger chance.

    So we would have to define a probability for our birth in each world.

    Given the complexity, for the game we will use the group-based approach and then in the debriefing explain the philosopher's argument as follows:

        The philosopher says: "I exist. In a large universe, there are many observer-slots, so it is more likely that I would have been born in a large universe. Therefore, the universe is probably large."

    This is the SIA. In our game, it would be like if the student said: "I am an observer. In the Large world, there are more observer-slots (6) than in the Small world (1), so it is more likely that I would be an observer in the Large world. Therefore, I bet Large."

    And that is what we saw in the game.

    How it might go wrong:

    - If in the Small world, the observer might not realize that they are the only observer and might bet Small.
    - Non-observers might feel left out and try to participate.

    To recover: in the debrief, explain that only observers can reason because non-observers don't exist in that world.

    - If the students in the Large world see that everyone is an observer, they might all bet Large and be correct. In the Small world, the observer might see that they are the only one and bet Small. But then they would be correct! But according to the probabilities, they should bet Large.

