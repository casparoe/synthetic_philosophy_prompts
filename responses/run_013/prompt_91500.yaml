prompt: |-
  Ok, I'm putting together my philosophy of mind position for a paper and I want a consistency audit first, because I have a nagging feeling that two of these don't actually fit together and I cant tell which ones. Here's the set:

  1. Nonreductive physicalism. Mental properties aren't identical with physical properties. They're realized by physical properties and supervene on them with metaphysical necessity.
  2. Mental causation is real. My deciding to leave is a cause of my leaving, not a mere shadow cast by the brain state that's doing the real work.
  3. The physical is causally closed. Every physical event that has a cause has a sufficient physical cause.
  4. No systematic overdetermination. When my decision and my brain state both get cited as causes of my arm rising, that's one cause described twice, not two causes.
  5. Multiple realizability. The same belief can be implemented in different physical ways, and that's my main reason for refusing to be a reductionist.
  6. Interventionism about causation. X causes Y roughly when an intervention on X would make a difference to Y.
  7. Causal realism. There's a determinate, interest-independent fact about what causes what. It doesn't shift around with what we happen to be explaining.
  8. Causal inheritance. A mental property has whatever causal powers its physical realizer has. It doesn't add any, and it doesn't lose any.

  I dont want to just be handed the standard trilemma and told to pick two; I already know that shape. I want to know where my actual set collides and where it only looks like it does. So don't flag every pair as in tension. Several of these are fine together, and I want to see which.

  Format it like this:
  - Bottom line: 2-3 sentences. Does the set hang together, and what's the single worst spot?
  - Real collisions, worst first: one per paragraph, ~120-180 words each. For each, name the commitments involved, say exactly why they can't both stand, rate the severity on a 1-5 scale, and say what has to give.
  - Collisions that aren't real: the pairs that look bad but aren't, ~40-80 words each, saying what makes them look bad and why that's a mistake.
  - Cheapest repair and its bill: ~150 words. The single change that fixes the most, and what it costs me in the rest of the list.

  Be concrete about which numbered commitment is doing the work in each case.
