prompt: |-
  I'm in a grad seminar on vagueness and I keep getting tangled up in how much of the epistemicism vs. supervaluationism fight is really a fight about logic and how much is a fight about facts, so I want you to build me a thought experiment to order. Specs: pick a vague predicate that lives in some institutional setting — a hospital triage category, a tax threshold, a grading rubric, a building-code standard, something like that — and please stay away from bald, heap, and tall, those are so burned into everyone's brain that I'll just get the textbook version back. Give me one paragraph of realistic scenario, no gods, no omniscient beings, no infinitely long series; a handful of cases (like five or six) stepping from "clearly applies" to "clearly doesn't" is plenty, I want the structure not a million grains of sand. The case has to isolate one variable and make it fall out of the scenario rather than stipulating it: I want a setup where the two theories agree that the sorites-style generalization for this predicate is false, but come apart on the instances — the epistemicist says there's one particular instance that is the false one even though no one could ever know which one it is, while the supervaluationist says no instance is false at all (each borderline one is a truth-value gap) and the generalization is false anyway.

  Then do the checks for me. For each theory: what is the truth value of the borderline sentence itself, what is the status of the generalization, and what happens to the disjunction of the borderline sentence with its own negation — because my understanding is that the supervaluationist ends up with a true disjunction that has no true disjunct, which means "or" isn't truth-functional for them anymore. Tell me whether that's a real cost they have to pay or an oddity they can shrug off, and whether the epistemicist avoids it for free or is buying classical logic with something else expensive. Then finish with three things: which feature of the case is doing the work, what breaks if I remove that feature, and how a supervaluationist would go after the case to stop it from counting against them. Answer in American English, and skip the citations and reading lists — I don't need to know who said what, I need to see the reasoning.
