answer: |-
  Here's a thought experiment built to your specs, isolating the logical divergence:

  **Scenario: Fire Code Occupancy Limits**
  A city fire code defines a "Large Assembly Space" (LAS) as any room designed for public gatherings with a *maximum occupancy rating* (MOR) of **300 or more persons**. This rating is determined by complex calculations involving square footage, exit widths, seating type, etc., performed by licensed engineers. Engineer Eve is reviewing plans for five new community center rooms:

  1.  **Room Alpha:** MOR = 400 (Clearly an LAS)
  2.  **Room Beta:** MOR = 305 (Widely agreed LAS)
  3.  **Room Gamma:** MOR = 300.4 (Borderline - tiny rounding variations in calculation inputs could push it to 300.6 or 299.9)
  4.  **Room Delta:** MOR = 299.6 (Borderline - same reasoning as Gamma)
  5.  **Room Epsilon:** MOR = 295 (Clearly *not* an LAS)
  6.  **Room Zeta:** MOR = 250 (Clearly *not* an LAS)

  The Sorites-style premise is: "If a room with MOR = X is an LAS, then a room with MOR = X - 0.1 is also an LAS." This seems plausible step-by-step from Alpha down to Zeta, but leads to the absurd conclusion that Zeta (MOR=250) is an LAS. **Both Epistemicism and Supervaluationism agree this generalization is false.** However, they fundamentally disagree about the individual borderline cases (Gamma & Delta) and *why* the generalization fails.

  **Theory Checks:**

  1.  **Epistemicism:**
      *   **Borderline Sentence (e.g., "Room Gamma (300.4) is an LAS"):** Has a definite, objective truth value (True *or* False), determined by the precise, unknowable cutoff in the vague concept "LAS". There is a *fact*, e.g., whether the cutoff is precisely 300.0, 300.2, or 299.8. We just cannot *know* what that fact is or which room (Gamma or Delta?) sits exactly on the cutoff.
      *   **Status of Generalization ("If X is LAS, then X-0.1 is LAS"):** False. It fails precisely at the single, unknowable cutoff point (e.g., between the true instance at 300.2 and the false instance at 300.1).
      *   **Disjunction ("Gamma is LAS OR Gamma is not an LAS"):** True (Classical Logic holds). One disjunct *is* true; we just don't know which one.
      *   **Cost:** Buys classical logic (truth-functionality, bivalence) at the price of positing *unknowable precise facts* about vague concepts. The "sharp cutoff" seems metaphysically suspect and disconnected from our linguistic practice.

  2.  **Supervaluationism:**
      *   **Borderline Sentence (e.g., "Room Gamma (300.4) is an LAS"):** Neither True nor False (a truth-value gap). Under some admissible precisifications (ways of making "LAS" precise, e.g., cutoff=300.0), it's True. Under others (e.g., cutoff=300.5), it's False. No single precisification is uniquely "correct".
      *   **Status of Generalization ("If X is LAS, then X-0.1 is LAS"):** False. While no *single* step (instance) is false, the generalization isn't *supertrue* (true on all admissible precisifications). On every precisification, there *is* a sharp cutoff where the premise fails for a specific pair (X_true, X-0.1_false). The generalization is false because it fails *somewhere* on *every* way of making the concept precise.
      *   **Disjunction ("Gamma is LAS OR Gamma is not an LAS"):** **True** (Supertrue). On *every* admissible precisification, one disjunct is true (either Gamma is above the cutoff or it's below). **However, neither disjunct is itself true** (supertrue) because neither holds on *all* precisifications. "Or" is not truth-functional at the level of supervaluation; the disjunction can be true even when neither disjunct is (super)true.
      *   **Cost:** Pays by abandoning truth-functionality for connectives at the level of supervaluation and accepting truth-value gaps (denying bivalence for borderline cases). The "true disjunction with no true disjunct" is the signature oddity. Proponents argue this reflects the genuine indeterminacy of vagueness and is less costly than unknowable facts.

  **Key Feature & Breakdown:**

  *   **The Crucial Feature:** The **numerical MOR scale** combined with the **institutional threshold** ("300 or more"). This provides a continuous dimension (the number) where small changes (0.1) seem insignificant, and a precise-seeming rule applied to it.
  *   **What Breaks Without It:** Remove the numerical scale (e.g., define LAS solely by vague terms like "very large gathering space"). Epistemicism loses its anchor for a precise, albeit unknowable, cutoff point in physical reality. Supervaluationism still applies, but the lack of a clear dimension makes the "steps" in the Sorites less obvious. Remove the institutional rule – leaving just a vague concept like "large room" – and the pressure to find a precise cutoff (epistemicism) or define admissibility (supervaluationism) weakens; the debate feels less concrete.

  **Supervaluationist Defense:**

  A supervaluationist would attack the case by challenging the **illusion of precision** created by the number:
  1.  **Vagueness in Measurement:** The MOR calculation itself involves vague inputs (e.g., defining "usable floor space," accounting for "typical" furniture). The number (300.4) pretends to precision that doesn't truly exist. The underlying reality is still vague.
  2.  **Vagueness in the Rule:** The rule uses "300 or more," but the concept "maximum occupancy rating" might have borderline cases itself, or the rule's application might depend on interpretations of "designed for," "public gatherings," etc. The institutional setting doesn't *eliminate* higher-order vagueness.
  3.  **Admissibility Covers the Spread:** They'd argue their admissible precisifications *already capture* the range of reasonable interpretations, including ones where the cutoff is 300.0, 300.5, or 299.5. The MOR number just makes the range *easier to see*; the underlying logical structure (truth-value gaps, supertruth, non-truth-functional connectives) is the same as for "heap". The institutional context doesn't force epistemicism; it just provides a clearer battleground. The "true disjunction with no true disjunct" isn't a bug, it's a feature accurately reflecting the indeterminacy – Gamma *is* neither determinately LAS nor determinately not-LAS, yet it *must* be one or the other under any sharpening.
