  The cost question is tricky. Supervaluationists do pay with non-truth-functional logic, but they’d call it a worth-it trade for avoiding "unknowable truths." Epistemicists keep classical logic but owe an explanation for why we can’t know cutoffs—maybe cognitive limitations. 

