prompt: |-
  I sit on the board of our city's arts foundation. Thursday we vote on the biggest grant we've ever considered — a resident theater company wants a five-year, seven-figure grant to turn the old indoor market hall downtown into a 400-seat theater. I'm supposed to circulate my written opinion before the vote, and I'd like you to draft it.

  Here's the wrinkle. One of our board members, Dana, has been circulating a memo arguing we should reject it, and honestly it's better than I expected. She's leaning on Rousseau's case against the theater — you know, the reply to d'Alembert, where he argues a theater doesn't reform a people, it flatters them, and that what a small republic actually needs is festivals where the citizens are the show for each other rather than paying to watch professionals pretend. Her twist is local: she points out the market hall was one of the last places in the city where people from every neighborhood actually rubbed shoulders as equals — buying, selling, arguing — and that we'd be converting that into rows of seats where most people just... watch. She wants us to fund a year-round festival and street-performance program instead, at a third of the cost.

  I dont fully buy it, but I don't want to just wave it away either, and two board members are now genuinely on the fence because of her. So: draft my opinion. Give me a clear recommendation — fund it, fund it with conditions, or reject in favor of her counter-proposal — with a specific timeline, since the company says it needs an answer this cycle or it walks. Take Dana's Rousseau argument seriously enough that she'd feel answered rather than outvoted, including the part where she might be right. And say something about whether that argument even applies to a city like ours, which isn't Geneva and isn't small. I have a nagging feeling his case only works if you already assume the city is a tight moral community with a shared way of life to protect, and that a modern city is more like a bunch of strangers who need somewhere to go at night — but I can't articulate it, so that's your problem.

  One more thing: don't turn this into a literature review. I don't need citations or a reading list, I need something I can read aloud at the meeting that actually takes a position and tells us what to do.
reasoning: |-
  Okay, the user is on the board of a city arts foundation and needs a draft opinion for a crucial vote about funding a theater project. They're grappling with a compelling counter-proposal inspired by Rousseau, which argues for community festivals over professional theater. 

  First, let's unpack the core tension: the user wants to respect Dana's intellectually serious Rousseau argument while still advocating for the theater grant. They specifically asked not to dismiss Dana but to engage her points so she feels heard. The modern city angle is key here - Rousseau's critique assumes a tight-knit community that may not exist anymore.

  Hmm, the user's nagging feeling about Geneva vs modern cities is spot on. Rousseau was writing for a specific context, and today's urban environments are fundamentally different. That's the pivot point. The draft should acknowledge Dana's wisdom about losing the market hall's spontaneous interactions, while arguing a theater could create new forms of connection.

  Notable constraints: must be deliverable aloud in a meeting, not academic. Needs a clear recommendation with timeline since the theater company will walk otherwise. And crucially - the user doesn't fully buy Dana's argument but finds it too strong to ignore. The tone should be collegial but decisive.

  The festival counter-proposal has merit but feels risky as a complete alternative. A hybrid approach makes sense: fund the theater but require programming that addresses Dana's concerns about passive spectatorship. The "civic hearth" metaphor could work well - framing the theater as a new gathering point rather than just entertainment.

  Key moves to include: 
  - Validate Dana's insight about the market hall's history 
  - Distinguish 18th century Geneva from their modern city 
  - Position theater as complementary to festivals, not opposed 
  - Build in concrete requirements for community programming 
  - Set a 3-year review to address sustainability concerns

  The financial aspect matters too - rejecting could mean losing the theater company entirely, while Dana's proposal would need development time. Conditional approval balances both risks.
answer: |-
  Here’s a draft opinion you can adapt and deliver at the meeting. It takes Dana’s concerns seriously, addresses the Rousseau question head-on, and provides a clear, actionable recommendation:

  ---

  **Subject: Recommendation: Approve Theater Grant with Conditions + Commitment to Festival Pilot**

  Colleagues,

  Thursday’s vote on the Market Hall Theater proposal is monumental, not just for its scale, but for the profound questions it forces us to confront about our city’s soul. Dana’s memo has done us a tremendous service by crystallizing these questions with intellectual rigor and local insight, drawing on Rousseau’s timeless critique. She is right to remind us: the old market hall was a rare, vital space where citizens from all walks met as equals, engaged in the raw, democratic friction of daily commerce and conversation. And she is right to ask: **would replacing this with a darkened room of passive spectators truly serve our community’s deepest needs?**

  Rousseau’s warning – that theater flatters rather than reforms, and that true civic health springs from participatory festivals where citizens *are* the spectacle – deserves our deepest respect. Dana’s proposal for a year-round festival and street-performance program, at a fraction of the cost, is ambitious and compelling. It directly answers Rousseau’s call for active citizenship.

  **Why Rousseau’s Geneva Isn’t Our City (and Why Theater Isn’t the Enemy):**
  But we must ask: does Rousseau’s premise – a small, homogeneous republic with a fragile, shared *mores* to protect – fit our diverse, modern city? We are not 18th-century Geneva. We are a collection of neighborhoods, backgrounds, and stories, often living parallel lives. We lack the inherent cohesion Rousseau assumed. **What we need aren’t just spaces that *presume* community, but spaces that *create* it.** The old market hall did this through commerce; its loss is already felt. The question is, what can build new bridges *now*?

  A professional theater in the market hall **isn't inherently passive or divisive.** Done right, it can be a powerful *civic hearth*:

  1.  **Shared Experience:** A 400-seat theater offers a rare, neutral space where thousands of diverse citizens gather *simultaneously* for a shared emotional and intellectual experience. This builds common cultural reference points – vital glue in a fragmented city.
  2.  **Platform for Local Voices:** This company’s proposal includes significant commitments to local playwrights, directors, and performers. This isn't just importing outside spectacle; it’s amplifying *our* stories, professionally. Think of it as a high-impact festival stage.
  3.  **Economic & Social Catalyst:** A vibrant downtown theater attracts foot traffic, supports local businesses, and creates a nighttime destination that fosters *unplanned* interaction – patrons mingling in nearby cafes before and after shows, echoing the market’s serendipity.
  4.  **Complementarity, Not Opposition:** Theater and festivals aren’t mutually exclusive. The energy and visibility of a successful theater can *fuel* broader street performance and festival culture. It becomes an anchor, not a competitor.

  **Dana’s Core Insight & The Path Forward:**
  However, Dana’s fundamental insight is crucial: **we must actively combat passivity and ensure this space fosters active citizenship, not just consumption.** Simply funding the theater and walking away risks proving Rousseau right. Therefore, I **recommend approving the five-year grant**, but **with non-negotiable conditions** designed to directly address Dana’s concerns:

  1.  **Mandatory Public/Community Programming:** 20% of the theater’s annual operating days (or equivalent hours) must be dedicated to free or low-cost, non-ticketed community use. This includes:
      *   **Open Rehearsals & Talkbacks:** Demystifying the process, creating dialogue.
      *   **Community Meetings/Forums:** Actively leasing the space for civic discourse.
      *   **Showcases for Local Amateur Groups:** Festivals *within* the theater – youth theater, choirs, dance troupes.
      *   **Experimental "Market Hall Days":** Periodically transforming the lobby/foyer back into a vibrant public market/festival atmosphere, especially on weekends.
  2.  **Robust Education & Outreach:** Significant, verifiable investment in programs bringing underserved youth and communities *into* the theater, both as audience members and participants in workshops.
  3.  **Transparent Access & Affordability:** Guaranteed tiered pricing, robust free ticket programs for community groups, and clear metrics on audience diversity reporting.
  4.  **Three-Year Review:** Approval is for the full five-year term *contingent* on a rigorous, independent review at the three-year mark. This review will specifically evaluate success on community access, programming diversity, audience engagement beyond passive spectatorship, and overall civic impact. Failure to meet agreed benchmarks could trigger renegotiation or termination of the final two years of funding, redirecting resources towards alternative models like Dana's.

  **Simultaneous Commitment to Dana’s Vision:**
  To demonstrate we are not dismissing the profound value of participatory culture, I propose we **immediately allocate $150,000** (drawn from uncommitted contingency funds or next year's planning budget) **to pilot Dana’s festival/street-performance concept THIS COMING SUMMER.** Let’s test specific, high-impact ideas in neighborhoods or downtown plazas. This pilot will provide critical data and experience. **We commit to evaluating this pilot in Q4 and, if successful, integrating a dedicated, scaled-up festival/street-performance line item into next year’s budget**, potentially funded collaboratively with the Parks Dept or Tourism Board.

  **Timeline & Urgency:**
  The theater company needs our answer *this cycle*. My conditional approval provides that certainty, allowing them to secure matching funds and begin revitalization, while embedding the community-focused safeguards we demand. The summer festival pilot launches immediately, proving our commitment to Dana’s vision.

  **Conclusion:**
  Dana is right to challenge us. Rousseau’s critique is a vital lens. But our modern city needs multiple tools to build community. Rejecting this theater risks losing a transformative opportunity and the company willing to drive it, leaving the market hall dormant. Funding it unconditionally risks creating an isolated cultural bastion. **My proposal – fund the theater with strict conditions ensuring it becomes a true civic hub, while immediately launching and evaluating Dana’s participatory vision – offers a pragmatic, ambitious path.** It honors the market hall’s legacy not by replicating the past, but by creating a dynamic, multi-faceted space where citizens gather, share stories, participate, and see themselves reflected – sometimes as audience, sometimes as performers, always as a community.

  **I move we approve the five-year grant to the Market Hall Theater Company, subject to the conditions outlined above, and allocate $150,000 for the Summer Festival & Street Performance Pilot.**

  ---

  **Why this works:**

  *   **Clear Recommendation:** Approve the theater grant *with specific, actionable conditions* + fund a pilot of Dana's idea immediately.
  *   **Directly Addresses Dana/Rousseau:** Doesn't dismiss; engages intellectually. Acknowledges validity of concerns about passivity and loss of the market's function. Explicitly contrasts Geneva vs. modern city.
  *   **Answers "Is Rousseau Relevant?":** Clearly states "Yes, but..." – his diagnosis of the *problem* (passivity, lack of community) is right, but his *prescription* (only small participatory festivals) doesn't fully fit a diverse modern city lacking inherent cohesion. Argues theater can be *part* of the solution if designed as active civic space.
  *   **Concrete Conditions:** The mandated community use days (20%), education programs, and affordability guarantees are measurable and directly combat passivity. The 3-year review provides teeth.
  *   **Validates & Funds Dana's Idea:** Doesn't just pay lip service; commits real money to a pilot *now*, showing good faith and creating a parallel path.
  *   **Timeline:** Meets the theater's urgency while launching the festival pilot immediately.
  *   **Tone:** Collegial, respectful of Dana's contribution, decisive, forward-looking. Avoids academic jargon.
  *   **Deliverable:** Structured for reading aloud, with clear sections and a strong concluding motion.
