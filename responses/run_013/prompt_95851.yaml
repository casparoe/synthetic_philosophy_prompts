prompt: |-
  I spent most of last weekend in an argument with a friend about whether risk-weighted expected utility is a genuine rival to expected utility or only expected utility with the outcomes described more richly, and we reached an impasse I would like my next podcast interview to break. My guest is a decision theorist whose forthcoming book defends a particular version of the view: the agent's risk function — the increasing function, fixed at zero for certainty and one for impossibility, that she applies to cumulative probabilities in order to discount or amplify the weight of the better outcomes — is to be elicited from her choices among small, transparent lotteries, the kind whose states and stakes can be laid out in full, and then carried over unchanged to decisions in which she cannot enumerate the states at all. My friend's closing move was that any pattern of choice whatsoever can be rewritten as expected-utility maximization once you let the description of the outcomes carry enough baggage, so the theory owes an account of which descriptions count; I could not answer him. Draft my interview questions.

  Lead with the single question you would ask if you could ask only one — the one that puts the most pressure on that position — stated exactly as it would be asked, and then give the rest with your reasoning. I want eight to ten questions in total, sequenced so that the pressure accumulates rather than resets after each one, and with at least one question each on the following three matters, each accompanied by a note on what the question is after and a follow-up keyed to the answer the guest is most likely to give:

  1. Whether the theory has content distinct from expected utility once outcomes are described richly enough, and whether the guest's own preferred description of outcomes in small lotteries is principled or convenient.
  2. How the risk function is measured without circularity, given that the elicitation lotteries are themselves choices the theory is supposed to explain, and what licenses exporting a risk function calibrated in small worlds to decisions where the state space cannot be enumerated.
  3. Whether a risk-weighted maximizer is dynamically consistent when she reconsiders a plan mid-course, what the theory tells her to do when she is not, and whether the appeal to resolve is an admission that the theory is not a theory of choice at each moment.

  Add at least one question on the social use of the apparatus — behind a veil of ignorance, does weighting the probabilities of being anyone in particular deliver anything that a prioritarian weighting of people's claims could not deliver on its own, and is the analogy between probability weights and claims legitimate — and one on whether the view is offered as a theory of rationality or of actual preference, and one on what the machinery does when the agent cannot completely rank the outcomes, since the cumulative weighting presupposes a complete ordering of them from best to worst before any probability is weighted.

  No questions about how she came to the subject, and none that merely invites her to restate the axioms. Open with the first question itself: no preamble, no framing, no restatement of this request.
reasoning: |-
  We are to draft interview questions for a decision theorist defending a particular version of risk-weighted expected utility (RWEU). The core issue is whether RWEU is a genuine rival to expected utility (EU) or just EU with richer outcome descriptions.

  The guest's view: The agent has a risk function (increasing, fixed at 0 for certainty and 1 for impossibility) that is applied to cumulative probabilities. This function is elicited from choices in small, transparent lotteries (where states and stakes are fully enumerable) and then used unchanged in decisions where states cannot be enumerated.

  The friend's challenge: Any choice pattern can be rewritten as EU maximization by enriching outcome descriptions. Thus, the theory must specify which outcome descriptions are allowed.

  We need 8-10 questions, sequenced to build pressure. Include at least one question on each of three matters (with a note and a follow-up for each), plus one on social use (veil of ignorance), one on rationality vs. actual preference, and one on incomplete rankings.

  Structure:
  - Lead with the single most pressing question (exactly as asked).
  - Then the rest in sequence.

  The three matters:
  1. Distinctness from EU: Is RWEU distinct, and is the outcome description in small lotteries principled or convenient?
  2. Measurement without circularity: How is the risk function measured without circularity? And what licenses exporting it from small worlds to large?
  3. Dynamic consistency: Is the agent dynamically consistent? What if not? Is appeal to resolve an admission of failure?

  Additional:
  - Social use: Behind the veil of ignorance, does probability weighting (by identity) deliver something beyond prioritarian weighting of claims? Is the analogy legitimate?
  - Rationality or actual preference: Is the theory about rationality or actual preference?
  - Incomplete rankings: What if the agent cannot completely rank outcomes?

  Open with the first question (no preamble).

  Let's design the questions:

  Lead Question (the most pressing one, targeting the core challenge):
  1. "If any pattern of choice can be represented as expected utility maximization by describing outcomes richly enough, how does your theory avoid being merely a redescription of expected utility, and what constraints does it impose on how we describe outcomes in the small lotteries you use to elicit the risk function?"

  Then the rest:

  Sequence:

  2. (Follow-up to lead) Focus on the outcome description in small lotteries: "When you elicit the risk function from small, transparent lotteries, you require a particular description of outcomes. What principle determines that description, and why isn't it just a matter of convenience for your theory?"

  Note for (2): This question is after the principled basis for outcome descriptions in small lotteries, which the guest must provide to avoid the charge of ad hoc redescription.

  Follow-up if the guest says the outcomes are described by the monetary amounts or physical goods (or similar): "But if in the small lotteries we describe outcomes as monetary gains, and then in large worlds we describe outcomes in terms of overall wealth, isn't that shift in description arbitrary? And if we don't shift, how do we handle the fact that the same physical outcome might have different meanings in different contexts?"

  3. (Moving to circularity in elicitation) "Your method of eliciting the risk function depends on the agent's choices in small lotteries. But these choices are themselves supposed to be explained by the theory. Doesn't that make the elicitation circular? How do you break into the circle?"

  Note: This question is about the circularity in measuring the risk function from choices that the theory is meant to explain.

  Follow-up if the guest says that the small lotteries are so simple that we can take the outcomes at face value: "But if the agent's choices in these small lotteries already reflect her risk attitudes, which are captured by the risk function, isn't that exactly what the theory is trying to explain? How do we know we are not just fitting a function to the choices without independent grounding?"

  4. (Exporting to large worlds) "What justifies taking the risk function elicited in small, transparent lotteries and applying it unchanged to decisions where the state space cannot be enumerated? Couldn't the agent's attitude toward risk be different when the stakes are higher or when the states are not fully specifiable?"

  Note: This is about the license to export the risk function.

  Follow-up if the guest says that the risk function is a stable trait: "But we know from psychology that risk attitudes can be domain-specific and context-dependent. How can you be sure that the function is stable across such different decision environments?"

  5. (Dynamic consistency) "Is an agent who follows your theory dynamically consistent? That is, if she makes a plan at one time and then reconsiders it later, will she stick to the plan? If not, what does your theory tell her to do then?"

  Note: This question is about dynamic consistency and whether the theory requires commitment.

  Follow-up if the guest says that the agent might not be dynamically consistent and may need to commit: "If the theory tells the agent to commit to a plan that she would later want to deviate from, isn't that an admission that the theory isn't a theory of choice at each moment, but only of plans made in advance?"

  6. (Aftermath of dynamic inconsistency) "When the agent faces dynamic inconsistency and must use commitment or resolve, does that mean that the risk-weighted expected utility theory is not a complete theory of rational choice at each point in time?"

  7. (Social use - veil of ignorance) "Consider the veil of ignorance: if we use your risk-weighted approach to weight the cumulative probabilities of being each person, does that yield a social ordering that we couldn't get by just weighting people's claims using a prioritarian social welfare function? And is the analogy between weighting probabilities and weighting claims legitimate?"

  Note: This question is about the social application and whether the risk-weighting adds anything new.

  8. (Rationality or actual preference) "Is your theory intended as a normative theory of rationality, or as a descriptive theory of actual human preferences?"

  9. (Incomplete rankings) "Your theory requires that outcomes be completely ordered from best to worst to apply the cumulative probability weighting. What happens when the agent cannot completely rank the outcomes? How does the theory handle that?"

  10. (Wrap-up pressure) "Putting it all together: if the risk function is both stable across contexts and measurable without circularity, and if the outcome descriptions are fixed by principle, then why have we not seen a consensus in the field that this theory replaces expected utility? What are the strongest objections you face and how do you answer them?"

  We have 10 questions. We can adjust if needed, but let's count:

  1. Lead question (distinctness and outcome constraints)
  2. Outcome description principled? (matter 1)
     - Follow-up: arbitrary shift?
  3. Circularity in elicitation? (matter 2)
     - Follow-up: fitting without grounding?
  4. Exporting to large worlds? (matter 2)
     - Follow-up: stability across contexts?
  5. Dynamic consistency? (matter 3)
     - Follow-up: commitment as admission?
  6. Aftermath of dynamic inconsistency? (continuation of matter 3)
  7. Social use (veil of ignorance)
  8. Rationality or actual preference?
  9. Incomplete rankings?
  10. Strongest objections?

  We have covered all required parts.

  Now, let's write the lead question exactly as it would be asked, and then the rest with reasoning and notes.

  Important: Open with the first question without preamble.
answer: |-
  **"If any pattern of choice can be represented as expected utility maximization by describing outcomes richly enough, how does your theory avoid being merely a redescription of expected utility, and what constraints does it impose on how we describe outcomes in the small lotteries you use to elicit the risk function?"**

  **Question 2 (on outcome descriptions and distinctness from EU):**  
  "When you elicit the risk function from small, transparent lotteries, you require outcomes to be described in a specific way—for example, as monetary gains or physical goods. What principle, beyond analytical convenience, justifies this description? Why shouldn't we view it as arbitrary, especially when the same physical outcome might represent different 'true' outcomes (like wealth levels or psychological states) in richer descriptions?"  
  *Note: This questions whether the guest’s outcome descriptions in small lotteries are principled or ad hoc, probing the core challenge that RWEU collapses into EU under richer descriptions.*  
  *Likely guest answer: Outcomes in small lotteries are described "objectively" (e.g., dollar amounts) to avoid context-dependent interpretations, ensuring the risk function captures pure risk attitude.*  
  *Follow-up: "But if an agent’s true outcome is overall wealth, and your small-lottery outcomes are framed as gains/losses, doesn’t that mismatch risk misrepresenting EU as RWEU? For instance, if I describe a $100 gain as the outcome, but the agent cares about total wealth, this could make a risk-averse EU maximizer look like a RWEU maximizer with a concave risk function. How does your principle prevent this?"*

  **Question 3 (on circularity in elicitation):**  
  "Eliciting the risk function relies on the agent’s choices in small lotteries—but those choices are themselves supposed to be explained by RWEU. Doesn’t this create a circularity where you’re using choices to define the function that explains those same choices? How do you independently verify the risk function without presupposing the theory?"  
  *Note: This targets whether RWEU can be measured without bootstrapping, given that elicitation lotteries are within the theory’s domain.*  
  *Likely guest answer: Small lotteries are 'transparent,' so outcomes/states are unambiguous, letting us directly observe risk attitudes without theory-laden interpretation.*  
  *Follow-up: "If transparency means we can take choices at face value, why not use those same choices to fit an EU model with a utility function? Doesn’t RWEU’s reliance on 'transparency' just mask a deeper circularity—where you assume the theory to validate it?"*

  **Question 4 (on exporting the risk function to large worlds):**  
  "You argue the risk function, once elicited from small lotteries, applies unchanged to decisions with unenumerable states. But what evidence supports that risk attitudes are invariant when moving from a small, controllable setting to a large, uncertain one? Couldn’t the function itself depend on the stakes or the agent’s ability to conceptualize states?"  
  *Note: This challenges the license to export the risk function, questioning its stability across contexts.*  
  *Likely guest answer: The risk function reflects a deep, stable trait—like time preferences—so it transfers if the outcome scale and context are similar.*  
  *Follow-up: "Empirically, people show domain-specific risk aversion (e.g., cautious with health but reckless with investments). If your elicitation uses monetary gambles, why assume it applies to, say, climate decisions where states are vague and stakes existential?"*

  **Question 5 (on dynamic consistency):**  
  "Is an agent who follows RWEU dynamically consistent? If she commits to a plan in advance, but mid-course, with new information, her risk-weighted evaluation favors abandoning it, what does your theory say she should do—stick to the plan or deviate?"  
  *Note: This examines whether RWEU causes dynamic inconsistency and how it handles conflicts between plans and choices.*  
  *Likely guest answer: Agents may need commitment devices to avoid inconsistency, as rationality sometimes requires binding future choices.*  
  *Follow-up: "If RWEU endorses commitment to 'irrational' future choices, doesn’t that admit it’s not a theory of choice at each moment? Isn’t that a retreat to EU, where such inconsistency doesn’t arise?"*

  **Question 6 (on social use and the veil of ignorance):**  
  "Behind a veil of ignorance, weighting the cumulative probability of being each person might prioritize worse-off individuals. But how is this different from prioritarianism, which directly weights claims by welfare levels? And is the analogy between weighting probabilities and weighting people’s claims legitimate, or does it conflate risk with fairness?"  
  *Note: This probes whether RWEU adds value in social ethics or reduces to existing distributive theories.*  

  **Question 7 (on rationality vs. actual preference):**  
  "Is your defense of RWEU normative—a theory of what’s rational—or descriptive—a model of how people actually choose? If normative, why should we accept risk-weighting as rational when it can violate dominance or lead to inconsistency? If descriptive, how does it improve on EU with context-dependent utility?"  

  **Question 8 (on incomplete outcome rankings):**  
  "RWEU requires outcomes to be completely ordered from best to worst for cumulative weighting. But if an agent can’t rank all outcomes—say, when comparing health and wealth trade-offs—how does your theory proceed? Does it fall apart, or can it be extended?"  

  **Question 9 (synthesizing pressure on distinctness):**  
  "You’ve said the risk function is stable and outcomes are described objectively. But if EU can replicate any RWEU choice by folding risk attitudes into utility, what experiment or real-world decision could definitively show RWEU is the right model and EU the wrong one?"  

  **Question 10 (culminating challenge):**  
  "Putting this together: If RWEU needs commitment to resolve dynamic inconsistency, allows EU-like redescription under pressure, and relies on contested outcome descriptions, why isn’t it just a roundabout way to preserve EU’s framework while renaming the components? What makes it a genuine rival?"  

  ---  
  **Sequence rationale:**  
  - **Q1** leads with the core challenge (distinctness from EU) to set stakes.  
  - **Q2** follows on outcome descriptions (matter 1), pressuring the "principled vs. convenient" tension.  
  - **Q3–4** tackle circularity and exportability (matter 2), showing how elicitation and application might fail.  
  - **Q5–6** cover dynamic consistency (matter 3) and social use, highlighting rationality gaps.  
  - **Q7–8** address theory scope (rationality/preference and incomplete rankings), exposing boundaries.  
  - **Q9–10** synthesize, forcing the guest to defend RWEU’s novelty and testability against EU.  
  Pressure accumulates by moving from foundational challenges (Q1–4) to implications (Q5–8), ending with a unified critique (Q9–10). No reset—each question builds on vulnerabilities (e.g., Q3’s circularity enables Q4’s export critique; Q5’s inconsistency sets up Q10’s "genuine rival" challenge).
