answer: |-
  Right, let's cut through the fog. You need conceptual leverage, not footnotes. Here's the brutal ranking of your candidate questions, with traps flagged and a defended funding agenda.

  ### Brainstormed & Ranked Questions (Descending Order of Funding Priority)

  1.  **Question 4: God's Custom vs. Humean Regularism: What's the Meat?**
      *   **Why Upstream?** This *is* the core metaphysical engine. If God's "custom" (`ādah`) is just brute regularity with no ontological grounding beyond divine whim, then occasionalism collapses into theological phenomenalism with little distinctive causal *theory*. If the custom reflects divine wisdom, intentionality, or sustained volition constituting a stable order, it offers a unique theistic account of regularity *without* inherent creaturely powers. This directly impacts Questions 2 (atomism's role), 5 (taxonomy), and 6 (miracles/laws). It defines what kind of "world" occasionalism describes.
      *   **Tractability (3 yrs):** High. Requires deep conceptual analysis of `ādah` in Ghazālī/Ashʿarism vs. Hume's "constant conjunction" and modern regularity theories. Does `ādah` *explain* regularity or merely *describe* it? Key texts exist in translation. Philosophical skill is paramount.
      *   **What Settles It?** Philosophical argument: Can a robust distinction be forged between divinely *willed and sustained* regularity vs. Humean brute sequence? Does attributing the regularity to God's *character* or *wisdom* (beyond mere will) add explanatory power missing in Hume? Success isn't textual proof, but a coherent, defensible philosophical model derived from the sources.
      *   **Trap?** Yes, if pursued as *only* textual exegesis ("What did Ghazālī *mean* by 'custom'?"). The *philosophical* question is: *Can* this concept bear the weight of a causal theory distinct from Hume, and if so, how? Avoid getting bogged down in purely semantic debates.

  2.  **Question 2: Atomism & Theology: Who's Carrying Whom?**
      *   **Why Upstream?** The metaphysics underpins the causal claim. Does occasionalism *require* atomism (no enduring substances/natures = nothing *to* have power)? Or is it driven primarily by theological commitment to divine omnipotence/sovereignty, with atomism just a compatible (perhaps dispensable) framework? If the latter, does occasionalism survive contact with Aristotelian or modern substance/property metaphysics? This is essential for evaluating its contemporary viability and its relationship to non-atomist occasionalist strands (if any exist).
      *   **Tractability (3 yrs):** Moderate-High. Requires unpacking the logical connection between Ashʿarite atomism (atoms/accidents, no natures) and the denial of creaturely causality. Can the core causal argument ("no necessary connection") stand without atomism? Philosophical analysis of modality and property-bearers is key. Some Arabic needed for precision on kalām atomism vs. falsafa substance.
      *   **What Settles It?** Conceptual disentanglement: Construct robust arguments *for* and *against* the dependence of occasionalism on atomism. Does removing atomism force a retreat to concurrentism or mere conservationism (Question 5)? Does affirming atomism *entail* occasionalism, or just make it easier? Success is demonstrating the logical (in)dependence.
      *   **Trap?** Assuming Ashʿarite atomism maps neatly onto modern physicalism or logical atomism. It doesn't. The trap is failing to grapple with its unique theological motivations and structure.

  3.  **Question 5: Taxonomy Distortion: Can Ghazālī Fit Modern Boxes?**
      *   **Why Upstream?** Modern divine-action categories (Occasionalism/Conservationism/Concurrentism) are often applied anachronistically. Ghazālī's world has *no* secondary causes to conserve or concur with! Forcing him into these boxes obscures his radicalism. Getting this right is crucial for meaningful dialogue with contemporary philosophy of religion/causation. Misclassification distorts the legacy and its relevance.
      *   **Tractability (3 yrs):** High. Requires precise analysis of the modern taxonomies (e.g., Freddoso, Feser, McCann) and clear articulation of Ghazālī's (and core Ashʿarite) ontology and causal claims. Does "conservation" even make sense if substances don't endure? Can "concurrence" apply if creatures lack *any* causal power (`qudra`)? Primarily philosophical, needing one Arabic reader to ensure fidelity.
      *   **What Settles It?** Conceptual clarity: Demonstrating that standard modern definitions either exclude Ghazālī or require significant revision to accommodate him. Argue that Ghazālī represents a distinct fourth type: *Pure Productive Occasionalism* (or similar), defined by the *absence* of creaturely causal powers *full stop*, not just their subordination.
      *   **Trap?** Minor. The trap is spending time *only* critiquing misapplications without positively defining Ghazālī's distinct position within/alongside the modern landscape.

  4.  **Question 1: Global Occasionalist or Dialectical Sniper?**
      *   **Why Upstream?** Less than it seems. While foundational for interpreting Ghazālī, its *philosophical* impact is somewhat secondary. Even if he was "only" attacking Avicennan necessity (making miracles possible), the *logic* of his arguments in the 17th Discussion and elsewhere *push strongly* towards global occasionalism, and that's how he was read historically (by defenders *and* critics like Aquinas/Averroes). Funding this risks prioritising authorial intent over conceptual power.
      *   **Tractability (3 yrs):** Low-Moderate. Highly textual, requiring nuanced reading of the *Tahāfut*, *Iqtiṣād*, *Iḥyā'*, etc., within Ghazālī's overall corpus and methods. Prone to irresolvable scholarly debate. Needs strong Arabic.
      *   **What Settles It?** Textual evidence: Finding a "smoking gun" passage where Ghazālī *explicitly* endorses secondary causality outside the miracle context, or conversely, applies his critique universally. Unlikely. It's mostly inference and weighting of ambiguous passages. Philosophers can engage the *arguments* regardless of final intent.
      *   **Trap?** Major. This is *primarily* a textual/historical question disguised as a conceptual one. It's a quagmire where arguments often circle. The *philosophical* interest lies in the *arguments themselves* (covered better under Q2/Q4), not solely Ghazālī's personal belief.

  5.  **Question 6: Miracles in a Cause-Free World.**
      *   **Why Upstream?** Conceptually downstream of Q4 (Custom) and Q2 (Atomism). If God's custom *is* the only "law," then a miracle is just God acting *outside* His usual habit. The concept survives, albeit transformed: it's about divine volition contravening perceived pattern, not suspending inherent powers. The religious importance (sign of prophecy, divine intervention) remains intact. The "law of nature" is purely descriptive (observed custom), not prescriptive.
      *   **Tractability (3 yrs):** High, but derivative. Requires applying conclusions from Q4/Q2. Good for testing coherence of the system.
      *   **What Settles It?** Philosophical coherence: Can a robust concept of "violation of custom" be defined without recourse to inherent natures/powers? Does this suffice religiously? Yes, if Q4 establishes `ādah` as a stable divine practice.
      *   **Trap?** Thinking it's a primary puzzle. It's a consequence. Solving Q4 largely solves this.

  6.  **Question 3: Kasb - Verbal Fix or Coherent Acquisition?**
      *   **Why Upstream?** Vital for ethics/theodicy, but notoriously the Achilles' heel. The Ashʿarite solution (God creates the act, human "acquires" it via a concomitant created "power" that is also causally inert) looks like a blatant dodge to preserve responsibility without granting real agency. The conceptual tension might be irreconcilable within strict occasionalism.
      *   **Tractability (3 yrs):** Low. Centuries of debate suggest inherent incoherence. Requires dissecting the metaphysics of "acquisition" (`kasb`) – is it a distinct ontological category or an epiphenomenal label? Deep Arabic needed for subtle kalām distinctions.
      *   **What Settles It?** Producing a philosophically satisfying model of responsibility where the agent contributes *nothing* causally efficacious to the act. Can "being the locus" (`mahall`) of a divinely caused act suffice for true agency? History suggests not.
      *   **Trap?** Massive. This is the question most likely to be *conceptually intractable* within strict occasionalism. It risks consuming resources for minimal philosophical gain beyond confirming the problem. The interesting work might be exploring how later thinkers *modified* occasionalism to handle it (e.g., Māturīdī influences), but that's historical, not core conceptual.

  ### Funding Agenda: The Top Three

  1.  **God's Custom: Theistic Regularism or Distinctive Ontology?** (Q4) *Why First?* This is the *sine qua non*. Without a robust account of `ādah`, occasionalism lacks metaphysical substance and becomes philosophically inert. It directly enables progress on miracles (Q6) and clarifies the stakes versus Hume/modern regularity. It's highly tractable philosophically. *Defence vs. Alternatives:* Beats Q1 because Q1 is textual quicksand; beats Q2 because understanding `ādah` is needed to assess *what kind* of world atomism describes; beats Q5 because you can't classify accurately without knowing the core causal theory.
  2.  **Atomism's Necessity: Metaphysical Scaffold or Theological Handmaid?** (Q2) *Why Second?* Determines the *metaphysical cost* of occasionalism. If atomism is essential, it limits contemporary relevance; if theological voluntarism is primary, occasionalism becomes more adaptable. Crucial for evaluating its viability as a general theory of causation. *Defence vs. Alternatives:* More foundational than taxonomy (Q5) as it defines the ontology being classified. More tractable and philosophically fruitful than the kasb morass (Q3) or the derivative miracle question (Q6).
  3.  **Taxonomy Challenge: Forging a Fourth Category.** (Q5) *Why Third?* Essential for meaningful engagement with contemporary divine-action debates and avoiding persistent misreadings. Clarifying Ghazālī's radical difference prevents strawmanning and identifies his unique contribution. *Defence vs. Alternatives:* More impactful conceptually than resolving Q1 (intent) or Q6 (miracles, largely solved by Q4). More tractable than Q3 (kasb). Provides essential context for the "legacy" aspect of your brief.

  ### What Would Change My Mind?

  *   **On Q4 (Custom) dropping:** If a knockout philosophical argument emerged demonstrating *conclusively* that any appeal to divine "custom" *must* reduce logically to Humean regularism plus a redundant God (e.g., a powerful modal argument showing no conceivable explanatory role for God beyond initiating the sequence). This seems unlikely, but would deflate the project.
  *   **On Q2 (Atomism) rising:** If significant new scholarship (textual or philosophical) convincingly argued that Ghazālī/Ashʿarite occasionalism *logically presupposes* atomism in a way previously underappreciated, making it the indispensable key. Conversely, if a strong case emerged showing kalām atomism is *itself* primarily motivated by theological occasionalism, not vice-versa, reinforcing their inseparability.
  *   **On Q5 (Taxonomy) dropping:** If leading contemporary divine-action scholars reached consensus on a revised taxonomy that accurately places Ghazālī without distortion, making the project redundant. This is improbable given current debates.
  *   **On Q1 (Globalism) rising:** If a genuinely new, unambiguous textual source from Ghazālī surfaced (e.g., a lost letter or marginalia) definitively settling his intent. Barring that, it remains a lower priority.
  *   **On Q3 (Kasb) rising:** If a highly original, rigorous philosophical model for "non-causal agency/responsibility" emerged from contemporary action theory that could be convincingly mapped onto `kasb`, making it seem suddenly tractable. Current trends don't suggest this.

  This agenda prioritises questions where philosophical argument can yield genuine conceptual progress on the *structure* and *viability* of occasionalism itself, leveraging Ghazālī as a case study for broader issues in theism and causation, while avoiding textual swamps and conceptual black holes. Fund those three, keep the Arabic reader on Q2 & Q5 support, and demand sharp philosophy.
