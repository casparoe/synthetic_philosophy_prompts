  ## The Pharmacy Conundrum: Context, Stakes, and the Fragility of Knowledge Attribution

  The puzzle of knowledge attributions in high-stakes scenarios, exemplified by cases like Cohen’s airport or DeRose’s bank, has generated two prominent solutions: **epistemic contextualism** (EC) and **pragmatic encroachment** (PE), often embodied by **subject-sensitive invariantism** (SSI). While both attempt to explain why we hesitate to attribute knowledge when practical stakes are high for the *subject*, they offer fundamentally different mechanisms. Contextualism argues the *truth-conditions* of "knows" shift with the attributor's context, while SSI argues the *epistemic standards* for knowledge itself depend on the *subject's* practical situation. Using Ada the pharmacist and her attributors Bea and Cass, we can dissect whether these accounts are genuine rivals or if one subsumes the other. The nested attribution test, crucially, suggests they are distinct, with contextualism offering the most comprehensive explanation.

  **The Case: Ada, Bea, and Cass**

  *   **Subject (Ada):** Pharmacist checking a dosage. Her evidence is fixed: the label clearly states "5mg," but she has a faint, nagging memory of a possible correction email she might not have processed. Her epistemic position is identical across scenarios.
  *   **Stakes Variation for Ada:**
      *   **Low-Stakes (LS):** An error means a minor inconvenience (e.g., slight headache for an adult).
      *   **High-Stakes (HS):** An error means a child dies.
  *   **Attributors:**
      *   **Bea:** Idle colleague, low personal stakes, asking out of curiosity. She might say, "Ada knows the dose is 5mg."
      *   **Cass:** The parent about to administer the dose to their child, high personal stakes. Cass might also say (or deny), "Ada knows the dose is 5mg."
  *   **Combinations:** We vary Ada's stakes (LS/HS) independently of the attributor (Bea/Cass), creating four scenarios:
      1.  **LS/Bea:** Ada (low stakes), Attributor Bea (low stakes).
      2.  **LS/Cass:** Ada (low stakes), Attributor Cass (high stakes).
      3.  **HS/Bea:** Ada (high stakes), Attributor Bea (low stakes).
      4.  **HS/Cass:** Ada (high stakes), Attributor Cass (high stakes).

  **Theory Predictions:**

  1.  **Plain Invariantism (PI):** "Knows" has fixed, context/subject-stake-invariant truth-conditions. Ada either knows or doesn't, based solely on her evidence, belief, and the truth concerning the dose. Stakes are irrelevant. PI *must* predict the same knowledge attribution (either "knows" or "doesn't know") in *all four scenarios*. Given Ada's fixed evidence (strong label, weak doubt), PI likely predicts she *does* know in all cases, struggling to explain denials in HS scenarios. Conversely, if PI deems the faint doubt sufficient to *deny* knowledge always, it cannot explain attributions in LS scenarios. PI fails to capture the intuitive variability.

  2.  **Subject-Sensitive Invariantism (SSI - Pragmatic Encroachment):** Whether S knows that p depends partly on S's practical stakes regarding p. "Knows" is invariant in meaning, but the *epistemic standards* S must meet to count as knowing are raised by higher stakes *for S*.
      *   **LS/Bea (Ada LS):** Ada meets the low standard → Bea correctly says "Ada knows."
      *   **LS/Cass (Ada LS):** Ada meets the low standard → Cass *should* correctly say "Ada knows." (Problem: Cass, with high stakes, likely *denies* knowledge despite Ada's low stakes).
      *   **HS/Bea (Ada HS):** Ada's high stakes raise the standard; her faint doubt likely prevents her meeting it → Bea correctly says "Ada does *not* know."
      *   **HS/Cass (Ada HS):** Ada doesn't meet the high standard → Cass correctly says "Ada does *not* know."

      **SSI Problem:** It struggles with **LS/Cass**. Intuitively, Cass, with high personal stakes, might *deny* that Ada knows ("How can she be *sure*? What about that email?"), even though Ada's own stakes are low. SSI predicts Cass *must* affirm knowledge here, as Ada meets the low standard relevant to *her*. SSI ties the standard solely to the subject, ignoring the attributor's context.

  3.  **Epistemic Contextualism (EC):** The truth-conditions of "S knows that p" depend on the *attributor's* conversational context, specifically the epistemic standards salient in that context. "Knows" is context-sensitive like "tall."
      *   **LS/Bea (Attributor LS):** Bea's context has low standards. Ada's evidence suffices → "Ada knows" is true.
      *   **LS/Cass (Attributor HS):** Cass's high-stakes context sets high standards. Ada's faint doubt becomes relevant → "Ada knows" is *false* in Cass's context.
      *   **HS/Bea (Attributor LS):** Bea's low-standards context → "Ada knows" is *true* (Bea ignores Ada's high stakes as irrelevant to *her* context). (Problem: Intuitively, we might think Bea *shouldn't* say Ada knows given the objective high stakes, even if Bea is unaware/careless).
      *   **HS/Cass (Attributor HS):** Cass's high-standards context → Ada's faint doubt is significant → "Ada knows" is false.

      **EC Problem:** Its prediction for **HS/Bea** is counterintuitive to many. If Ada is in a high-stakes situation, it seems *wrong* for Bea, even in a casual context, to truthfully say "Ada knows," given the potential catastrophic consequences of error. EC seems to allow irresponsible attributions.

  **The Nested Attribution Test:** Can Cass consistently assert (1) "Ada knows the dose is 5mg" but deny (2) "Ada knows that Bea knows the dose is 5mg"?

  *   **Intuition:** Yes, this seems possible. Cass, in their high-standards context, might deny that *Ada* knows the dose (due to the faint doubt). Cass might simultaneously realize that in *Bea's* low-standards context (as an idle colleague), Bea *does* know the dose (the label suffices for Bea's purposes). Crucially, Cass would also realize that *Ada*, burdened by her own high stakes (or simply aware of Bea's casualness), would *not* attribute knowledge *to Bea* using the high standards Cass employs. For Cass: "Bea knows" is true (by Bea's standards), but "Ada knows that Bea knows" is false (because Ada, using stricter standards relevant to her situation or simply doubting Bea's thoroughness, wouldn't affirm Bea's knowledge).
  *   **Predictions:**
      *   **PI:** Inconsistent. If Ada knows p, she knows all necessary consequences (barring complexity issues, which aren't present here). The nested claim should be true if (1) is. If (1) is false, (2) is vacuously false. No separation.
      *   **SSI:** Inconsistent. Knowledge is subject-sensitive but invariant in meaning. If Cass says (1) "Ada knows p" (meaning Ada meets the standards set by *Ada's* stakes), then Ada *does* meet those standards. For (2) "Ada knows that Bea knows p": Bea's knowledge depends on *Bea's* stakes (low), so Bea knows p. Does *Ada* know that Bea knows p? This depends on *Ada's* evidence about Bea's epistemic state and stakes. Crucially, Ada's evidence about p *and* about Bea's situation is the same regardless of her own stakes regarding p. If her evidence suffices for her to know p under her own high stakes (which Cass affirms in (1)), it should *easily* suffice for her to know that Bea (with low stakes) knows p. Cass cannot consistently affirm (1) and deny (2) on SSI. If Cass denies (1), (2) is automatically false.
      *   **EC:** **Consistent Separation is Possible.** Cass's context sets high standards.
          *   (1) "Ada knows p" is false in Cass's context (high standards, faint doubt relevant).
          *   (2) "Ada knows that Bea knows p": This involves two knowledge attributions.
              *   The embedded claim "Bea knows p": Evaluated in Cass's context? Or in the context of the verb "knows" governing it? Standard EC holds that the context of the *attributor* (Cass) governs the entire sentence. So, "Bea knows p" is evaluated by Cass's high standards. Given Bea's casualness, Bea likely *doesn't* meet Cass's high standards concerning the dose → "Bea knows p" is false in Cass's context. Therefore, (2) is false (Ada cannot know a falsehood). Cass would deny *both* (1) and (2). This isn't the separation we wanted.
          *   **Refined EC (e.g., "Graded" or "Multiple Contexts"):** Some contextualists argue that embedded knowledge attributions can be evaluated relative to the subject of the embedding verb (Ada) or retain the main context (Cass). If we allow the embedded "Bea knows p" to be evaluated relative to *Bea's* context (low standards), then:
              *   "Bea knows p" is *true* relative to Bea's context.
              *   But does *Ada* know *that*? "Ada knows q" (where q = "Bea knows p") is evaluated in *Cass's* context (high standards). Does Ada have evidence that Bea knows p *by Cass's high standards*? Unlikely; Ada knows Bea is casual. Even if Ada has evidence Bea satisfies *low* standards, satisfying Cass's high standards is different. So (2) "Ada knows that Bea knows p" is *false* in Cass's context.
              *   Meanwhile, (1) "Ada knows p" is also false in Cass's context.
              *   **Achieving Separation:** To get Cass affirming (1) and denying (2), we need a scenario where Cass uses *moderate* standards for Ada but *high* standards for Bea's knowledge (perhaps Cass thinks Bea is reckless). Crucially, EC *can* accommodate this *if* the context allows different standards to be salient for different subjects or embeddings. Cass might say: "Ada knows the dose [by moderate standards sufficient for her task], but she doesn't know that Bea *really knows* it [by the stricter standards I demand for anyone touching my child's medicine]." While complex, EC has the *resources* to model this shift in standards within a single context in a way SSI, tied rigidly to the subject, and PI, completely invariant, cannot.

  **Verdict: Contextualism's Explanatory Edge with a Hybrid Twist**

  While EC faces the "irresponsible attribution" objection in **HS/Bea**, it provides the most plausible framework for explaining the full pattern, particularly the crucial **LS/Cass** intuition and the *possibility* of the nested attribution separation under refined interpretations.

  *   **Why EC (Refined) Wins:**
      1.  **LS/Cass:** Only EC straightforwardly predicts Cass's denial of knowledge despite Ada's low stakes, by raising the standards in Cass's attributor context. SSI is forced into the counterintuitive claim that Cass must affirm knowledge.
      2.  **Nested Attribution:** Only EC offers a potential mechanism (contextual shifts within an attribution) for Cass affirming "Ada knows p" (under moderate standards) while denying "Ada knows that Bea knows p" (because the embedded claim requires evaluation under higher standards). SSI's rigid subject-sensitivity and PI's strict invariance cannot generate this separation.
      3.  **Attributor Stakes Matter:** The intuition that Cass's anxiety affects their willingness to attribute knowledge, independent of Ada's actual situation, is best captured by EC's core tenet that the attributor's context sets the standard.

  *   **Defending EC Against the HS/Bea Objection (The Strongest Rival Objection - SSI):**
      The SSI proponent argues: "In **HS/Bea**, EC allows Bea to truthfully say 'Ada knows' even though Ada is in a high-stakes situation and Bea's attribution seems irresponsible. SSI correctly predicts Bea *cannot* truthfully say Ada knows here because Ada's high stakes raise the epistemic bar, which Ada fails to meet."
      *   **EC Response:**
          1.  **Truth vs. Appropriateness:** EC distinguishes the *truth* of an utterance from its *appropriateness*. "Ada knows" might be *true* relative to Bea's low-standards context, but asserting it in Bea's context *given that Ada is in a high-stakes situation* could be highly **misleading** or **irresponsible**. Bea ignores relevant practical facts *about the subject* that the audience might care about. This explains the intuitive wrongness without denying the semantic truth. SSI conflates truth with pragmatic appropriateness.
          2.  **Context Can Incorporate Subject Stakes:** Bea's context *might* be such that Ada's high stakes become salient (e.g., if Bea knows the child's life depends on it). In that case, the standards in Bea's context *would* rise, making "Ada knows" false. EC can explain why Bea *shouldn't* speak carelessly – it risks raising standards or being misleading. SSI makes subject stakes *automatically* determinative, even if unknown to the attributor.
          3.  **The Primacy of Attributor Context:** The core data is the variability in *what we say* about knowledge across contexts. EC explains this linguistic data directly via semantic context-sensitivity. The intuition in HS/Bea is partly driven by importing the *subject's* high stakes into *our* evaluation as theorists or observers, effectively adopting a higher-standard context. EC explains *why* we do this.

  **Explicit Hybrid?** A pure EC might suffice, but one could propose a moderate hybrid: **"Attributor-Governed Contextualism with Subject-Salience."** The default standard is set by the attributor's context. However, salient facts about the *subject's* practical situation can *become relevant* to the attributor's context, thereby influencing the operative standard (e.g., Bea mentioning the child's life would raise her own standards). This hybrid preserves EC's core mechanism for explaining variability and nested attributions while accommodating the intuition that subject stakes often *do* impact attributions by becoming contextually salient. Crucially, it avoids SSI's core error: making subject stakes *intrinsically* determinative of the epistemic standard regardless of the attributor's awareness or context.

  **Conclusion**

  While pragmatic encroachment (SSI) offers a compelling account of why a subject's own actions depend on stakes, it falters when attributor stakes diverge from subject stakes (**LS/Cass**) and cannot accommodate the nuances of nested knowledge attributions. Plain invariantism is too rigid. Epistemic contextualism, despite the **HS/Bea** objection, provides the most flexible and explanatorily powerful framework. It directly models the linguistic data of shifting knowledge attributions based on the attributor's conversational context and conversational needs. The objection from irresponsible attribution confuses semantic truth with pragmatic appropriateness and underestimates context's ability to incorporate salient features of the subject's situation. A refined contextualism, potentially acknowledging how subject stakes can *become* contextually salient, best explains the full, intricate pattern of knowledge attributions across varying stakes for both subjects and attributors. The pharmacy case reveals not rivals that can be absorbed, but distinct approaches, with contextualism holding the key to unlocking the complex interplay between evidence, stakes, and the language of knowledge.
