  ### Key Rationale:
  - **Thesis**: Phrased to emphasize vocabulary as the bottleneck, contrasting "search" (audience's comfort zone) with "discovery" (your critique).
  - **Objections**: Ordered by damage. Top threats come from Bayesian modelers (rank 1–3) as they directly engage your "vocabulary as given" claim. LLM objections (rank 2,5) target your empirical gap. Categorization objections (rank 4,7) test generality. Each reply concedes minimally while redirecting to your core argument.
  - **Concede Up Front**: Preempts hostility by acknowledging strengths of existing work and pilot limitations.
  - **Reply That Has to Land**: Focuses on your human-vs-model pilot data—this is your leverage.
  - **Question I Hope Nobody Asks**: Targets unsupervised learning because it could reframe discovery as a solved problem, forcing you onto less empirical ground. The reply emphasizes intentionality to salvage your point.

  **Delivery Tip**: Start with your pilot data early—it's concrete evidence for an abstract claim. When objections arise, anchor replies in your novel problems (e.g., "In my Problem #14, humans noticed X, but models didn't—here's why that matters"). Good luck!
