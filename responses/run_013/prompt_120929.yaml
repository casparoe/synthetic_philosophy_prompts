prompt: |-
  I'm a backend engineer with no philosophy training, and in two weeks I'm presenting to a small reading group. Who's in the room: mostly people who build Bayesian models of how humans learn concepts (the "concepts are little programs, learning is inference over a grammar" crowd), two people who work on in-context learning in LLMs, and one person who runs categorization experiments on undergrads.

  My thesis: Bongard problems — the puzzles where you get twelve figures split into two sets of six and have to say what separates them — don't test concept induction, they test something much narrower. My argument, roughly: on the standard problems, once you've fixed the vocabulary of features (count, shape, size, orientation, nesting, symmetry, touching, and so on), the intended rule is recoverable from the labeled figures by search, so a solver that already has the vocabulary can grind them out. Call those closed problems. The genuinely hard part of concept learning is getting the vocabulary — noticing that some property of a figure is a property at all — and in the standard problems that part is done for you by whoever built the puzzle. There's recent work where people bolt pragmatic constraints onto a visual description language to deal with exactly the ambiguity I'm pointing at, and I want to claim it still takes the vocabulary as given. I've also got ~30 of my own problems where I claim the vocabulary itself has to be discovered, plus a small pilot where 5 collegues solved them and two off-the-shelf models didn't.

  Build me the Q&A prep as a JSON object, exactly these fields:
  - thesis: my position in one sentence, as I should say it out loud
  - objections: array, ordered by how much damage they'd do, each an object with rank (int), who_asks (which person in the room), question (the objection written the way that person would actually phrase it, in their vocabulary), why_it_lands, my_reply (about two minutes, spoken), soft_spot (where the reply is weakest), stance ("concede", "hold", or "split")
  - concede_up_front: array of things I should give away in the first two minutes
  - reply_that_has_to_land: the one thing that has to work or the talk is dead
  - question_i_hope_nobody_asks: object with objection, why_it_hurts, best_available_reply

  Seven or eight objections. Don't give me generic "what is understanding" stuff — I want the ones this specific crowd will fire.
reasoning: |-
  We are given a specific audience and a thesis about Bongard problems. The thesis is that standard Bongard problems are "closed" in the sense that the vocabulary of features is given, so the problem reduces to search in a fixed space. The hard part of concept learning is discovering the vocabulary, which is not tested in standard problems.

  The audience:
  - Mostly: Bayesian modelers of human concept learning (concepts as programs, learning as inference over a grammar)
  - Two: working on in-context learning in LLMs
  - One: runs categorization experiments on undergrads

  We need to build a Q&A prep as a JSON object with the following fields:

  1. `thesis`: one-sentence position to say out loud.
  2. `objections`: array of objects (7 or 8), each with:
     - `rank` (int, by damage potential)
     - `who_asks` (from the audience: "Bayesian_modeler", "LLM_in_context", "categorization_experimenter")
     - `question`: the objection phrased in their vocabulary
     - `why_it_lands`: why this objection is strong
     - `my_reply`: about two minutes of spoken reply
     - `soft_spot`: where the reply is weakest
     - `stance`: "concede", "hold", or "split"

  3. `concede_up_front`: array of things to give away in the first two minutes
  4. `reply_that_has_to_land`: the one thing that must work
  5. `question_i_hope_nobody_asks`: object with:
     - `objection`
     - `why_it_hurts`
     - `best_available_reply`

  Constraints:
  - Avoid generic "what is understanding" questions.
  - Focus on this specific crowd.

  Let's outline:

  **Thesis Statement** (one sentence):
  "Standard Bongard problems don't test concept induction because they provide a fixed vocabulary of features, reducing the task to search; the truly hard part — discovering the relevant features — is bypassed, and I've created new problems that require this discovery to show the gap."

  **Concede Up Front**:
  - Acknowledge that in standard Bongard problems, the search over the given vocabulary is non-trivial and can model some aspects of human reasoning.
  - Admit that the pragmatic constraints in recent work do address some ambiguity, but only after the vocabulary is fixed.
  - Note that my own problems are preliminary and based on a small pilot.

  **Reply That Has To Land**:
  The core argument: Without requiring the discovery of the feature vocabulary, we are not testing the core challenge of concept learning. My new problems demonstrate that when the vocabulary is not given, humans can still solve them (as per the pilot) but current models cannot.

  **Question I Hope Nobody Asks**:
  Perhaps a question that challenges the very basis of the distinction, or one that points out that even in human learning, features are not entirely discovered from scratch but built upon prior knowledge.

  Now, objections. We'll generate 7 or 8, ordered by damage. We'll assign who_asks appropriately.

  Ranking by damage (1 being most damaging):

  1. **From a Bayesian modeler**: They might argue that their models do in fact learn the vocabulary by constructing programs from a grammar, so the vocabulary is not fixed but generated by the grammar. This directly challenges the claim that the vocabulary is given.

  2. **From an LLM in-context learning person**: They might say that LLMs, through in-context learning, can adapt to novel features without explicit vocabulary, thus handling the open case.

  3. **From a categorization experimenter**: They might point out that in human experiments, features are often not entirely novel; humans bring prior knowledge, so even in your problems, it's not truly from scratch.

  4. **From a Bayesian modeler**: They might say that the grammar for generating programs is designed to be rich enough to capture new features, so the problem is not closed.

  5. **From an LLM person**: They might argue that the in-context learning in LLMs is a form of vocabulary discovery, and it works on standard Bongard problems, so why make the distinction?

  6. **From a categorization experimenter**: They might question the ecological validity: in the real world, we rarely have to invent entirely new features; we build on existing ones. So your new problems are artificial.

  7. **From a Bayesian modeler**: They might point out that in the standard Bongard problems, the solver must still choose which features are relevant, which is a form of discovery.

  8. **From an LLM person**: They might say that with enough data and a big enough model, the vocabulary is implicitly covered, so the problem goes away.

  But we need to be specific and use their vocabulary.

  Let's write the objections and replies.

  Note: We are to avoid generic questions.

  We'll create 8 objections.

  After drafting, we'll order by damage.

  Finally, the JSON structure.
answer: |-
