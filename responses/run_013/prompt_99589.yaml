prompt: |-
  I have been trying to work out something about the way people decide one after another, and I would like a serious explanation of it rather than a recap of the usual examples.

  Here is the situation that puzzles me. Picture a long line of people, each of whom privately and independently runs a small, imperfect test before making a yes-or-no choice — whether to adopt a new method, say. Each person can see how everyone before them chose, but not the private test behind anyone else's choice. As I understand it, after only the first few people, everyone further down the line simply copies whatever choice is currently ahead of them, and their own private tests stop making any difference to what they do. What I cannot get past is this: these people are still rational, they still run their own tests, and they still take the evidence seriously. So why does the information carried by their choices drain away to nothing? It looks as if everyone reasoning correctly is precisely what destroys the information, and that seems backwards.

  Two further things seem to follow, and I suspect I am misreading them. First, why would such a line be so brittle — why could a single public announcement, even a weak one, be enough to turn the whole line around, and why does the weight of the private tests that got it started offer no protection? Second, this seems to clash with the familiar idea that many independent judgments together give a better answer than any one of them would alone. If everyone is rational and the line keeps growing, why does the answer stop improving? Is the whole difference that the judgments quietly stop being independent, and if so, where exactly does the independence go?

  Finally, I keep sensing a missing piece. No one in the line seems to count the fact that their own choice will be useful information to the people behind them. Does that omission actually change the outcome, and can it be described as each person failing to invest in something — a benefit that spills over to others but that they have no reason to pay for — without pretending they are behaving irrationally?

  Please explain this in plain language, but do not soften it. I want the mechanism that makes the information disappear, why that mechanism is brittle, how it squares with the wisdom-of-crowds idea, and what the missing piece really is. I would rather have the ideas themselves than any references or reading suggestions. Please answer in American English.
reasoning: |-
  Okay, the user is asking about information cascades in sequential decision-making. They're puzzled by how rational individuals making independent tests can end up ignoring their private information and simply copying predecessors, leading to fragile group decisions. 

  The user clearly understands the basic phenomenon but is wrestling with three deeper contradictions: why rationality causes information loss, why the cascade is brittle to weak signals, and how this conflicts with wisdom-of-crowds principles. They're also intuitively sensing that people don't account for their informational value to followers.

  Hmm... their frustration comes through - they've likely encountered superficial explanations before. The mention of "missing piece" suggests they've done original thinking about the social value of individual signals. Interesting that they reject references - this is someone who wants to grasp mechanisms, not citations.

  Let me unpack this systematically. First, the information vanishing act: it's not that private signals become irrelevant, but that Bayesian updating gets overwhelmed by prior decisions. Each person treats predecessors' choices as stronger evidence because they represent multiple signals, creating cumulative weight. The test isn't abandoned; it's rationally overridden.

  For brittleness: cascades rest on fragile early signals. Since later agents discard their own data, the system has no error-correction. A weak announcement shatters the illusion of consensus by providing counter-evidence uncorrelated with the cascade's foundation. The "protection" of early tests vanishes because those tests weren't aggregated - they were sequentially discarded.

  The wisdom-of-crowds clash is key: independence is destroyed by observation. Wisdom requires parallel, private decisions; cascades occur in series with public actions. The crowd here isn't independent - it's a chain of dependency. 

  Ah, and their intuition about the "missing piece" is sharp. In standard models, agents don't internalize their informational externality. If they did, they'd sometimes go against the herd to broadcast their signal, preserving information flow. But that requires different incentives - like reputation gains - beyond immediate decision accuracy.

  User's clearly analytically minded - I'll avoid metaphors and present the mechanics cleanly. No fluff, just the gears turning. American English means direct syntax but keeping precision. Should emphasize how rationality + sequential publicity creates this paradox, not stupidity.
answer: |-
  Here's the direct mechanism behind the information drain, the brittleness, the clash with wisdom-of-crowds, and the missing piece, without fluff:

  **The Core Mechanism: How Information Vanishes**

  1.  **Each Person is a Bayesian Updater:** Everyone rationally combines two sources of evidence:
      *   Their *private signal* (their test result).
      *   The *public history* of choices ahead of them.
  2.  **The Public History is Overwhelmingly Informative (Eventually):** The first person only has their private signal. The second person sees the first choice. Crucially, that first choice *already reflects one private signal*. The second person rationally weights their *own* signal against this *one* piece of embodied evidence. It's a close call.
  3.  **Cumulative Weight Breaks the Tie:** By the time the third person acts, they see *two* choices. Even if those two choices were *barely* leaning one way (e.g., the second person might have gone along with the first despite a weak opposing private signal), the *combination* of those two visible choices represents the outcome of *at least two private signals* (and possibly more, depending on how the second person weighed things). To a rational observer, two consistent choices are strong evidence.
  4.  **The Threshold Effect:** Rationality requires acting only when the *total evidence* (public history + private signal) crosses your personal threshold for "yes" or "no." After a very few consistent choices (often just two), the cumulative evidence from the public history becomes so strong that:
      *   **For:** If the history leans "Yes," only an extremely strong "No" private signal could outweigh it. If such strong signals are rare, most people see a "Yes" history and get a "No" signal *not strong enough* to overturn the public evidence. They choose "Yes" *despite* their signal.
      *   **Against:** Conversely, if the history leans "No," only a very strong "Yes" signal will cause someone to choose "Yes." Most "Yes" signals aren't strong enough. They choose "No" *despite* their signal.
  5.  **The Drain:** When someone acts *against* their private signal because the public history is too strong, their choice conveys **no new information** about *their* signal. It simply confirms the existing public history. Their private information is discarded and lost to the chain. Everyone after them sees the same reinforced public history, making it even *less* likely their own signal will be strong enough to break the trend. The cascade locks in.

  **Why It's Brittle: The Illusion of Consensus**

  1.  **Built on Sand:** The cascade rests entirely on the private signals of the first *very few* individuals. Their signals might have been weak, ambiguous, or even wrong. The massive public history that follows is mostly an echo of those first signals, *not* the aggregation of many independent signals.
  2.  **No Error Correction:** Once the cascade starts, *no one's private signal is strong enough to challenge it* (unless it's exceptionally strong, which is rare). The system has no way to detect or correct if the initial path was wrong.
  3.  **The Announcement's Power:** A public announcement, even a weak one, injects a **new, uncorrelated piece of evidence** directly into *everyone's* calculation simultaneously. Crucially:
      *   It doesn't have to fight the *true* weight of many signals; it only has to fight the *apparent* weight built on the fragile early choices.
      *   It provides evidence *independent* of the cascade path. People realize, "Wait, this announcement suggests maybe those first two guys were wrong, or had weak signals." Suddenly, the overwhelming public history looks less certain.
      *   Rational individuals now combine the public history (the cascade) + the announcement + their private signal. The announcement weakens the perceived strength of the public history enough that private signals *can* start to matter again. If the announcement pushes things towards the tipping point, even a few people switching can restart the cascade in the opposite direction. The "protection" of the initial private tests is illusory because their information was lost long ago; only their *choices* remain, creating a fragile facade.

  **Clash with Wisdom-of-Crowds: Independence is Murdered**

  The wisdom-of-crowds relies on **independence**. Averaging many *independent* judgments cancels out individual errors.

  *   **The Fatal Flaw:** In the sequential line, the public choices **destroy independence**.
  *   **How Independence Dies:** Person 2's choice depends on Person 1's choice *and* their own signal. Person 3's choice depends on Person 1 *and* Person 2's choices (which are not independent of each other) *and* their own signal. Person 4's choice depends on 1, 2, and 3 (highly correlated) *and* their own signal. The public history creates **strong correlation** between all subsequent choices. After the cascade starts, choices are almost entirely determined by the initial few signals and the cascade dynamic, *not* by new independent information. You aren't aggregating independent judgments; you're amplifying the initial judgments and discarding the rest. The crowd becomes a herd following a path set by luck.

  **The Missing Piece: The Informational Externality**

  Your intuition is correct. In the standard model:

  1.  **Narrow Rationality:** Each person cares *only* about making the best decision for themselves *based on the information available to them*. They correctly reason that their choice reveals their signal *only if* they follow their signal. If they go against their signal (due to the strong public history), their choice reveals nothing new.
  2.  **The Spillover:** However, if someone *were* to act against the cascade based on a strong private signal, their choice *would* reveal valuable information to everyone behind them. This could break a wrong cascade or strengthen a correct one, benefiting the followers.
  3.  **The Omission:** The person deciding *does not get credit for this benefit*. The followers benefit, but the decider bears the risk (they might be wrong to go against the herd) and gains no extra reward for providing public information. From their purely self-interested perspective (making the best choice *for themselves* based on current info), it's irrational to risk a potentially worse personal outcome just to send a signal that helps others. They "fail to invest" in generating socially valuable information because there's no private return on that investment.
  4.  **Does it Change the Outcome? Absolutely.** If people valued the informational benefit to society (or had incentives tied to revealing information accurately), they *would* be more likely to follow their private signals, even when it contradicts the public history. This would prevent cascades from locking in so easily, preserve information flow, make the sequence more robust, and allow the collective outcome to better reflect the *aggregate* of private signals – aligning it closer with true wisdom-of-crowds. The omission isn't irrational at the individual level *as defined*, but it *is* the reason the cascade dynamic is socially inefficient.

  **In Summary:**

  *   **Information Drain:** Rational Bayesian updating causes later individuals to rationally ignore their private signals because the cumulative *apparent* evidence from early choices (which embodies *their* signals) becomes overwhelming. Choices after the cascade starts convey no new signal information.
  *   **Brittleness:** The cascade rests on fragile early signals. A new public announcement provides uncorrelated evidence, weakening the perceived strength of the cascade history enough for private signals to matter again, potentially triggering a reversal.
  *   **Clash with Wisdom-of-Crowds:** Public choices destroy the independence of judgments. The cascade aggregates only the first few signals and discards the rest, unlike parallel independent aggregation.
  *   **Missing Piece:** Individuals rationally ignore the social value of revealing their private signal (an "informational externality") because they bear the risk but get no reward for providing this public good. Including this value/incentive would reduce cascades and improve information aggregation.
