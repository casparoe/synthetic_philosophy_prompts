prompt: |-
  There is an argumentative move I keep meeting and cannot put a name to, and I should like to know whether the thing already has one; if it does not, I want to know what it ought to be called and where its edges fall.

  Here is the move. Two people are arguing about what ought to be done, and when you press one of them for the premise that would license their conclusion, what they offer is a claim that refuses to settle on either side of the fact/value line. 'You can't run a railway like that.' 'A community that behaves so won't hold together.' 'That is simply not how a family works.' Pressed, the speaker reads the claim as a prediction -- a plain factual claim about what will happen -- and so escapes the charge of smuggling in a value; wanting to conclude, the speaker reads the very same claim as a norm, and so reaches the ought. The premise changes its logical colour to suit the moment, and because each reading is defensible on its own, there is nothing solid to take hold of. I do not think this is just the naturalistic fallacy, since no one here is deriving an ought from a premise that is purely an is -- the difficulty is the premise itself, which never has to declare which side it is on. Nor is it ordinary equivocation, because the shift is not between two senses of a word but along the descriptive/evaluative axis.

  Is there a name for this? If so, what is it, and how does it stand to the nearest concepts, the fact/value distinction and the naturalistic fallacy above all? If there is no name, please coin one and define it carefully: what exactly the phenomenon is, what it is not, and where its boundaries lie -- a premise that merely happens to be both factual and evaluative on one side, a premise that exploits the ambiguity on the other, and some test for telling which of the two a given case is. A bare label would not satisfy me; it is the carving I am after.

  Please answer in American English.
reasoning: |-
  Okay, the user is asking about a specific argumentative move where a premise switches between being a factual prediction and a normative claim. They want to know if there's a name for this, or if not, to coin one and define it precisely. 

  First, I need to understand the core issue. The user describes a premise that's ambiguous between fact and value—like "you can't run a railway like that." When challenged, the speaker treats it as a factual prediction (descriptive), but when concluding, they treat it as a normative claim (prescriptive). This duality avoids scrutiny. 

  The user mentions it's not the naturalistic fallacy (which is deriving "ought" from "is" directly) nor simple equivocation. So this is a subtler problem. I recall similar concepts: "thick concepts" (like "cruel" blending fact/value), "normative insinuation," or "rhetorical toggling." But none perfectly fit. 

  For coining a term, I consider: 
  - "Chameleonic premise": captures shifting colors but might imply deceit. 
  - "Switchback premise": evokes quick back-and-forth shifting. 
  - "Janus-faced premise": references duality but might be too vague. 

  "Switchback premise" feels most precise—it emphasizes the tactical flipping between modes. Now to define boundaries: 
  - It's not when a term is inherently thick (e.g., "brave" is always both). 
  - It's not accidental vagueness; the shift is deliberate and context-driven. 
  - Key test: Does the speaker defensibly retreat to description *only* when pressed but use it normatively to conclude? If yes, it's a switchback. 

  The user seems philosophically sophisticated—they care about precise conceptual carving, not just labels. Their frustration suggests they've encountered this move in debates and want tools to dissect it. I should emphasize the tactical dishonesty aspect and provide clear examples to distinguish it from benign ambiguity. 

  Also, they asked for American English, so I'll avoid British phrasing like "railway" in my response (though their example uses it—that's fine). Need to keep definitions sharp: naturalistic fallacy is separate (explicit derivation), while this is premise-level ambiguity. 

  Final structure: Name → Definition → Contrasts → Diagnostic test. Make sure the test is practical: "Does the speaker's defense contradict their usage?" That’ll help the user spot it in the wild.
answer: |-
  This is a brilliantly observed maneuver, and you're right that it slips between the cracks of common fallacy labels. While no single term is universally established for this precise move, the most fitting existing concept is **normative insinuation** or **rhetorical toggling**. However, to capture its essence as you've described, **I propose the term "Switchback Premise."**

  Here's the detailed conceptual carving you requested:

  1.  **The Name & Definition:**
      *   **Switchback Premise:** A premise strategically deployed in normative argumentation that ambiguously straddles the descriptive/predictive ("is") and prescriptive/normative ("ought") domains. Its *rhetorical function* shifts depending on the challenge faced:
          *   When pressed to justify its *validity* or avoid the charge of smuggling in values ("Why *should* we care if the community breaks apart?"), the speaker *retreats* to a descriptive/predictive reading ("It's just a fact that groups acting this way disintegrate").
          *   When used to *derive a normative conclusion* ("Therefore, we *ought not* to behave that way"), the speaker *advances* the very same linguistic formulation as embodying a norm or value ("Because holding together is *how a community is supposed to function*").
      *   **Core Mechanism:** The premise acts like a logical "switchback" (a sharp reversal in direction). The speaker toggles its interpretation to evade criticism on one flank (the "is/ought" gap or value smuggling) while simultaneously leveraging it to attack on the other flank (reaching the desired normative conclusion). The defensibility of *each interpretation in isolation* provides rhetorical cover for the *shift in function*.

  2.  **What It Is Not & Key Distinctions:**
      *   **Not the Naturalistic Fallacy:** The Naturalistic Fallacy (in its Humean sense) involves a *clear derivation* of an "ought" from premises that are *purely and uncontroversially* descriptive ("Water boils at 100C, therefore you *ought* to boil it at 100C"). The Switchback Premise is different:
          *   The premise *itself* is ambiguous, not purely descriptive.
          *   The "ought" isn't *derived solely* from the descriptive reading; it's smuggled in *by the shift* to the normative reading of the *same* premise. The fallacy lies in the equivocation *about the premise's status*, not in deriving "ought" from a clear "is".
      *   **Not Simple Equivocation (Fallacy of Equivocation):** Standard equivocation involves a word or phrase shifting meaning *between different concepts* (e.g., "light" meaning not heavy vs. electromagnetic radiation). The Switchback Premise involves a shift *along a single spectrum* – the descriptive-to-normative axis of the *same concept or claim*. It's exploiting the inherent potential for many social/functional concepts ("runs well," "holds together," "works") to be interpreted either way.
      *   **Not a "Thick Ethical Concept":** Concepts like "cruel," "brave," or "generous" inherently *fuse* description and evaluation. Using them directly as premises doesn't necessarily involve the *toggling* or *strategic retreat*. A thick concept is genuinely both at once; the Switchback Premise *exploits the ambiguity* strategically, often denying the evaluative component when challenged.
      *   **Not Mere Vagueness or Undeveloped Premise:** The problem isn't just that the premise is unclear. It's that the speaker *actively leverages* the ambiguity *tactically* depending on the argumentative pressure, refusing to commit to a single, stable interpretation.

  3.  **Boundaries & The Diagnostic Test:**
      The critical boundaries lie in the *speaker's behavior* when challenged and the *logical function* of the premise:
      *   **Benign Ambiguity / Genuinely Thick Concept (Not a Switchback):** The speaker acknowledges the dual nature of the premise when pressed. They might say, "Yes, describing how a functional family *does* work inherently implies norms about how it *should* work," owning the evaluative component from the start. The premise functions consistently as a bridge concept.
      *   **Switchback Premise:** The key diagnostic is the **Defensive Retreat Test**:
          1.  **Identify the Premise:** Locate the claim offered as support for a normative conclusion (e.g., "A community that behaves so won't hold together" supporting "We ought not to behave that way").
          2.  **Challenge its Normative Force:** Ask: "Why *should* we care if the community holds together? Is that necessarily a good thing?" or "Is that statement just a prediction, or is it telling us what we *ought* to do?"
          3.  **Observe the Response:**
              *   If the speaker *retreats* to a purely descriptive/predictive interpretation ("I'm just stating a sociological fact; groups with internal conflict X tend to dissolve"), **and**...
              *   ...Later (or even simultaneously when not directly challenged) uses the *same premise wording* to *ground* the normative conclusion ("Therefore, we must avoid behavior X *because* it makes the community fall apart") **without** explicitly adding a separate normative premise (like "Communities *ought* to hold together")...
          4.  **Diagnosis:** A Switchback Premise is in play. The retreat contradicts the normative work the premise is expected to do in the argument. The speaker is trying to have it both ways – factual immunity *and* normative force – without committing to the underlying value judgment that makes the fact relevant to the "ought".

  **In Summary:**

  *   **Phenomenon:** Strategic use of a premise ambiguously straddling fact and value, toggling its interpretation to evade criticism (retreating to "is") while using it to support a conclusion (advancing as "ought").
  *   **Name:** **Switchback Premise** (emphasizing the tactical reversal in its function).
  *   **Core Differentiator:** The *toggling behavior* under challenge, not inherent ambiguity or thick concepts.
  *   **Distinguished From:**
      *   Naturalistic Fallacy (clear "is" to "ought" derivation).
      *   Equivocation (shift between distinct meanings).
      *   Thick Concepts (stable fusion of fact/value).
      *   Vagueness (mere lack of clarity).
  *   **Diagnostic Test (Defensive Retreat Test):** Does the speaker defensively retreat to a descriptive reading *only* when the normative force is challenged, while still relying on the *same wording* normatively elsewhere in the argument *without* supplying the missing normative link? If yes, it's a Switchback Premise.

  This move exploits the inherent slipperiness of functional and social concepts in discourse. Naming it "Switchback Premise" highlights its dynamic, evasive, and logically dishonest nature – a deliberate back-and-forth on the fact/value line to avoid scrutiny while claiming normative ground.
