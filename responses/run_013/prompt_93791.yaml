prompt: |-
  I am a third-year student in a political philosophy seminar, and for the past few weeks we have been circling around the question of whether ordinary social conventions—queueing in order, leaving a tip at a sit-down restaurant, waiting for the walk signal even when no car is coming—are genuine moral obligations or merely local etiquette that one can ignore without moral fault. My puzzlement comes from a concrete institutional practice. My university has recently revised its international student orientation. One module, called Local Norms, instructs incoming students from abroad to treat a list of host-country conventions as binding: form a single queue and never hold a place for a friend, tip twenty percent at table-service restaurants, do not jaywalk even on an empty street at three in the morning, and stand on the right side of the escalator. The module's language is moralized: it says that ignoring these expectations is not merely gauche but disrespectful, and that visitors who do so wrong the locals who have to accommodate them. Yet the same orientation, in a different session, tells students that judging another culture's customs by their home standards is a category mistake, and that moral criticism of unfamiliar practices is usually unwarranted. And the surrounding institutional signals are mixed: campus security has stopped ticketing jaywalking on the grounds that it is not a real offense, while the student government has passed a resolution calling the expectation to tip a coercive imposition on international students.

  I want to know what philosophical commitments this practice—the orientation module, together with the qualifications and exceptions the university actually makes—presupposes. Does it presuppose a relativist view, on which the bindingness of a convention is indexed to the local community and visitors acquire obligations simply by entering the territory? Or does it presuppose something more like a fair-play or natural-duty view, on which visitors owe compliance because they benefit from a scheme of coordination and because respect for persons requires not free-riding on shared expectations? Or is it committed to a Humean or Lewis-style account on which conventions are solutions to coordination problems and therefore generate obligations only when the coordination is actually valuable, which would make the empty-street jaywalking case a hard test? Reconstruct the implicit theory as carefully as you can, and distinguish what the practice strictly presupposes from what it merely fits with. In particular, is the module committed to the idea that the same convention binds locals and visitors alike, or does its asymmetry—locals who jaywalk are said to be taking a small liberty, while visitors who jaywalk are said to be disrespectful—reveal a role-based or associative view of obligation? Which rival theories does the practice quietly rule out, and is it internally consistent with the security policy and the student government resolution, or do those parts presuppose incompatible pictures? Finally, suppose we replaced the presupposed view with the view that everyday conventions are morally inert unless they protect rights or prevent harm. What would have to change in the orientation module, in how the university enforces or declines to enforce the conventions, and in what it owes to visitors who violate local norms?
reasoning: |-
  Hmm, this is a sophisticated political philosophy question from a third-year seminar student about social conventions and moral obligations. The student presents a concrete institutional dilemma at their university regarding international student orientation that contains apparent contradictions. 

  The core tension lies in the university simultaneously moralizing local conventions (calling violations "disrespectful" and "wronging locals") while teaching cultural relativism (that judging other cultures is a category mistake). This is further complicated by mixed institutional signals: campus security stopped ticketing jaywalking while student government condemned tipping expectations as coercive.

  The student wants me to reconstruct the implicit philosophical theory behind this practice. I need to consider several frameworks:
  - Cultural relativism (obligations tied to local community)
  - Fair-play theory (compliance owed for benefits received)
  - Coordination convention theory (obligations only when coordination valuable)
  - Role-based obligations (different standards for visitors/locals)

  The orientation's asymmetric treatment of locals vs visitors suggests a role-based view. When locals jaywalk it's a "small liberty" but when visitors do it, it's "disrespectful." This implies visitors have special obligations due to their guest status.

  The practice seems incompatible with strict cultural relativism because the university doesn't treat all conventions as equally binding - they make exceptions like not enforcing jaywalking tickets. The fair-play theory also doesn't fully fit because international students haven't necessarily benefited from these systems yet.

  The student also asks about replacing this with a harm-prevention view. If we did that, the orientation would need to drop moralized language for harmless conventions, enforcement would focus only on rights-protecting norms, and the university might owe education rather than blame to norm-violating visitors.

  I should acknowledge the nuance here - the university seems to be navigating between integration goals and anti-imperialist concerns. Their approach reflects practical governance more than philosophical purity, which explains the internal tensions. The best reconstruction is probably a hybrid view combining guest-host ethics with selective coordination value recognition.
answer: |-
  Your university's orientation practice reveals a philosophically hybrid and internally conflicted position, blending elements of associative role obligations with a weak coordination-based view, while quietly rejecting strict cultural relativism and harm-only moralism. Below is a reconstruction of its presuppositions, tensions, and implications.

  ### Core Philosophical Commitments of the Orientation Module
  1. **Asymmetric Role Obligations (Associative View)**  
     The module's core presupposition is that **visitors acquire special role-based duties by entering a host community**. Locals may take "liberties" because their relationship to the conventions is one of *co-authorship*; they sustain the practices but may occasionally bend them without undermining the system. Visitors, however, are positioned as *guests* who owe "respect" through compliance because:  
     - Their non-compliance is seen as free-riding on a system they didn't help build.  
     - They lack standing to unilaterally judge local norms (as reinforced by the anti-judgment session).  
     This asymmetrical obligation rules out theories treating conventions as universally binding moral rules (e.g., Kantian perfect duties) or symmetrical social contracts.  

  2. **Conventions as Conditional Moral Demands (Modified Lewis/Humean View)**  
     The module assumes conventions generate obligations **only when they serve socially valuable coordination functions** (e.g., queueing prevents conflict, escalator norms ensure efficiency). This explains why the university *qualifies* its stance:  
     - Campus security stopped ticketing jaywalking because, absent traffic, the coordination value vanishes → no obligation.  
     - Tipping is contested due to perceived injustice (coercion), undermining its moral legitimacy despite being a coordination norm.  
     This quietly rejects **cultural relativism** (which would treat *all* local customs as equally binding) and **strict fair-play theory** (which would require compliance simply for benefiting from the system).  

  3. **"Respect" as the Moral Foundation (Weakly Communitarian)**  
     The moralized language ("disrespectful," "wronging locals") presupposes:  
     - Conventions express collective self-determination; violating them insults the community's autonomy.  
     - Visitors have a duty of reciprocity for the hospitality extended to them.  
     This aligns with Scanlon-style **civic reciprocity** but clashes with the orientation's own anti-judgment injunction, creating tension.  

  ### Internal Inconsistencies
  - **Contradiction with Anti-Judgment Session**:  
    The module condemns visitors who violate local norms as "disrespectful" while forbidding them from judging host-country customs. This implicitly privileges the host culture's authority, undermining cultural relativism.  
  - **Tension with Institutional Policies**:  
    - *Security Policy*: Not ticketing jaywalking admits that convention-based obligations dissolve when coordination value is absent → contradicts the module’s blanket moralization of jaywalking.  
    - *Student Government Resolution*: Denouncing tipping as "coercive" suggests norms lose moral force when they perpetuate injustice → clashes with the module’s unqualified tipping directive.  

  ### What the Practice Rules Out
  1. **Strict Cultural Relativism**:  
     If relativism were presupposed, the module could not condemn non-compliance as *morally* wrong ("disrespectful")—only as culturally atypical.  
  2. **Harm/Rights-Based Moralism**:  
     The 3 a.m. jaywalking rule is explicitly moralized despite no harm/rights violation, rejecting the view that conventions are morally inert without tangible harms.  
  3. **Symmetrical Fair-Play Theory**:  
     Locals and visitors are held to different standards, whereas fair-play would require identical obligations for all beneficiaries.  

  ### Replacing the Presupposed View with Harm/Rights-Based Moralism
  If conventions were only binding when they prevent harm or protect rights:  
  - **Orientation Changes**:  
    - The module would reframe norms *only* where harm/rights are at stake (e.g., "Stand on the escalator right to prevent accidents," not "to show respect").  
    - Jaywalking on empty streets, holding a queue spot, or tipping would lose moral language ("disrespectful") and become advisory ("locals typically do this").  
  - **Enforcement Shifts**:  
    - Campus security would *only* police harmful violations (e.g., jaywalking in traffic).  
    - The university could not condemn "gauche" behavior as morally blameworthy.  
  - **Response to Violations**:  
    - Visitors violating harmless norms (e.g., escalator standing) would merit education, not blame.  
    - The university might actively oppose norms like tipping, framing them as exploitative rather than obligatory.  

  ### Conclusion
  The orientation module’s implicit theory is a **role-conditional coordination convention view**: conventions bind visitors asymmetrically when (and only when) they serve legitimate coordination goals, grounded in a duty of respect owed by guests to hosts. However, it is inconsistently applied—qualifying obligations when coordination value is low (jaywalking) or justice concerns arise (tipping)—revealing an unstated commitment to **contingent moral weight**. This hybrid view struggles to reconcile its moralizing tone with its own cultural-relativist platitudes and institutional policies. Adopting a harm/rights baseline would demoralize most conventions, transforming the module from a list of duties into a pragmatic guide to local expectations.  

  The university’s practice ultimately prioritizes *social integration* over philosophical coherence, reflecting a pragmatic (if confused) attempt to balance cultural sensitivity with communal norms.
