answer: |-
  Below is a tiered taxonomy of explanations for the side-effect effect (Knobe Effect), with percentage shares summing to 100%. I've refined the families to minimize overlap, resulting in **three core families** that subsume your original categories:

  1. **Normative Pressure (50%)**  
     *Subsumes*: Pragmatics of blame/credit assignment, norm violation (moral/conventional), and moral badness as a *social trigger*.  
     *Unique explanatory power*: Explains why judgments shift in social/linguistic contexts where assigning blame (for bad effects) or withholding credit (for good effects) is pragmatically relevant.  
     *What shrinks its share*: If intentionality judgments remain high for *good* side effects in contexts demanding accountability (e.g., corporate audits) or low for *bad* effects when norms are irrelevant.

  2. **Moral Valence Primacy (30%)**  
     *Subsumes*: Moral badness of the outcome as an *intrinsic* factor.  
     *Unique explanatory power*: Explains why bad outcomes are intuitively treated as "actions" (eliciting "agent-cause" frameworks) while good outcomes are treated as "non-actions," even without social interaction.  
     *What shrinks its share*: If neutral-but-statistically-deviant side effects (e.g., causing a rare color change) are judged as intentional as bad ones.

  3. **Folk-Causal Architecture (20%)**  
     *Subsumes*: Agent's attitude (e.g., indifference vs. desire) and statistical abnormality.  
     *Unique explanatory power*: Explains cases where non-moral, agent-centric factors (e.g., effort or expectation violation) drive intentionality independently of valence.  
     *What shrinks its share*: If modifying attitude/abnormality (e.g., agent actively dislikes a *good* outcome) fails to flip intentionality judgments.

  ---

  ### **Predictions for Variants**  
  *(a) Foreseen bad side effect actively prevented:*  
  - **Normative Pressure**: Intentionality **drops sharply** (no blame warranted if prevention attempted).  
  - **Moral Valence**: Intentionality **remains high** (badness still triggers "action" categorization).  
  - **Folk-Causal**: Intentionality **moderately drops** (effort signals lack of commitment).  
  *Winner*: Normative Pressure (prevention defuses blame context).  

  *(b) Foreseen side effect violating only a conventional norm (e.g., wearing mismatched clothes):*  
  - **Normative Pressure**: Intentionality **high if blame-context** (e.g., strict dress code at work), **low otherwise**.  
  - **Moral Valence**: Intentionality **low** (no moral badness).  
  - **Folk-Causal**: Intentionality **moderate** (if outcome is abnormal/attitude indifferent).  
  *Winner*: Normative Pressure (only this family flexibly engages non-moral norms).  

  *(c) Foreseeably harms few, benefits many:*  
  - **Normative Pressure**: Intentionality **moderate** (net blame reduced but harm still salient).  
  - **Moral Valence**: Intentionality **low** (net-positive valence weakens "action" framing).  
  - **Folk-Causal**: Intentionality **high** (harm to few remains abnormal/indifference likely).  
  *Winner*: Moral Valence (net benefit dilutes badness-driven intentionality).  

  ---

  ### **Key Experiment to Separate Top Two Families**  
  **Top families**: Normative Pressure (NP) vs. Moral Valence (MV).  
  **Experiment**:  
  - *Variant*: CEO implements a policy with a foreseen *bad* side effect (e.g., workers lose jobs) that *satisfies a strong norm* (e.g., preventing child labor in supply chain).  
  - *Control*: Same bad effect with no norm satisfaction.  
  - *NP prediction*: Intentionality **lower** in norm-satisfaction case (bad outcome is "justified," defusing blame).  
  - *MV prediction*: Intentionality **equally high** (badness still triggers "action" framing).  

  **Result embarrassing my ranking (NP > MV)**:  
  If intentionality remains high in the norm-satisfaction case, it undermines NP's claim that norm compliance modulates blame-assignment motives. This would force reallocation of shares toward MV.
