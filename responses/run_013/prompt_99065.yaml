prompt: |-
  I have a tentative principle about when a strike is justified, and I would like it tested against a set of verdicts I hold. The principle turns on a distinction I find myself drawing between a strike's addressee and its target. The addressee is the party the strikers mean to move by withholding their labor; the target is the party who in fact bears the cost. My hypothesis is that a strike is justified exactly when its addressee is the party with whom the strikers have their dispute — normally their own employer — and that it does not matter, in itself, who the target is.

  Here is what I think about particular cases.

  First, nurses at a hospital strike over staffing ratios. Elective surgeries are postponed and some patients' recoveries are delayed. I think the strike is justified.

  Second, workers at a parcel depot refuse to handle parcels originating from a different company whose own employees are on strike over pay. Their employer has done nothing to them; they mean to squeeze the other company by disrupting its shipments, and they are costing their own employer money in the process. I think this is justified.

  Third, a union at a manufacturer strikes to demand that the company stop sourcing from a country whose government is committing atrocities; the workers say they will not be made complicit in it. I think this is justified.

  Fourth, a union strikes to demand that the employer dismiss a particular worker — one who kept working during the last strike and is now, the union says, poison in the workplace. I think this is not justified, even though the employer could simply refuse the demand.

  Fifth, a union strikes to demand that the government raise the national minimum wage. The employer cannot grant the demand; the strike is meant to inconvenience the government through the employer. I think this is not justified.

  Sixth, a group of workers walks out without their union's authorization and in breach of a no-strike clause the union itself negotiated, after the grievance procedure failed to address a supervisor's harassment. I think this is justified.

  Seventh, workers at a firm on the edge of insolvency strike for a raise; the strike will very likely tip the firm into liquidation and cost everyone their jobs. I think it is still justified.

  My addressee principle appears to deliver my verdicts on the first, third, fifth, sixth, and seventh cases. But it seems to give the wrong answer twice, and in opposite directions. In the second case the addressee is not the strikers' own employer, so the principle condemns the sympathy action — yet I think it is justified. In the fourth case the addressee is exactly the employer, so the principle permits the strike — yet I think it is not. So the distinction, as I have stated it, is either too crude to be repaired or in need of a clause I have not found.

  I would like you to do three things.

  First, say whether the addressee/target distinction survives at all. If it can be repaired, state the repaired principle as precisely as you can, clause by clause, and name for each clause the case that forces it. If it cannot be repaired, say what should replace it.

  Second, tell me what the best principle you can state says about four cases I have not listed: picketers physically blocking replacement workers from entering the premises; individual workers crossing a lawful picket line because they cannot afford to lose the pay; a union striking against a proposed merger that would leave its own members' terms untouched but would cost jobs at another plant; and a lockout by the employer, which is the mirror image of a strike and about which I have no verdict at all.

  Third, tell me which of my seven verdicts the best principle cannot keep, and whether dropping that verdict costs less than complicating the principle in order to preserve it.

  I am especially unsure about the second case set against the fifth: both are strikes whose grievance lies elsewhere, and I want to know what, if anything, distinguishes them besides my sympathy for one cause and not the other.
reasoning: |-
  Okay, let me try to unpack this user's query. They have a principle about when strikes are justified based on the addressee-target distinction. The addressee is who the strikers intend to pressure, while the target bears the actual cost. Their principle is that a strike is justified only if the addressee is the party in dispute, usually their employer. They provided seven cases where their principle works for five but fails on the second and fourth cases.

  First, I need to figure out why the second case (sympathy strike) and fourth case (demanding a coworker's dismissal) don't fit. In the second case, the addressee is another company, not their employer, so the principle says it's unjustified, but the user thinks it's okay. In the fourth, the addressee is the employer, so it should be justified, but the user disagrees. The challenge is reconciling these without contradicting the other cases.

  The user's uncertainty between the second and fifth cases is crucial. Both involve grievances elsewhere, but the user approves the sympathy strike (case two) but not the political strike (case five). What distinguishes them? The second case is about solidarity with fellow workers, while the fifth is a political demand beyond the workplace. Maybe the principle needs to include solidarity as a valid reason when the addressee is another employer in a labor dispute.

  For the fourth case, targeting a coworker might be seen as punitive or infringing on individual rights, even though the employer is the addressee. So the principle might need a clause preventing harm to third parties who aren't responsible for the dispute.

  Looking at the additional cases they mentioned: blocking replacement workers might be coercive, crossing picket lines out of necessity is understandable, striking against a merger affecting others is tricky, and lockouts as employer-initiated need evaluation. Each tests different aspects like coercion, individual rights, solidarity scope, and symmetry in labor actions.

  The user's deeper need seems to be a consistent ethical framework that accommodates labor solidarity without allowing unjust harm or overreach. They might want a principle that's both principled and flexible, avoiding arbitrary distinctions. Balancing worker agency with collateral damage is key. Also, they might seek justification that aligns with their intuitions but stands up to scrutiny across varied scenarios.

  Revising the principle: The core could remain that the addressee must be the disputant, but with exceptions for solidarity actions against other employers in labor disputes. Adding a clause against harming non-responsible third parties addresses the fourth case. The fifth case is excluded because the government isn't an employer in the dispute. The sixth case (unauthorized strike) is justified as addressing the employer despite procedural breaches, emphasizing the grievance's validity over process.

  Testing the revised principle: Case two now fits under solidarity; case four excluded due to harming a coworker. The additional cases: blocking replacements is coercive (unjustified); crossing picket lines is permissible under individual necessity; merger strike might be unjustified if not directly affecting their terms; lockouts could be judged similarly to strikes, based on the dispute's nature.

  Which verdicts might conflict? The seventh case (bankrupting the employer) is still justified under the principle since the employer is the addressee, even if it leads to job losses. The user accepts this, so no issue. The main tension is whether solidarity strikes should be included, which the user supports, so modifying the principle to include them makes sense.

  Ultimately, the refined principle should protect workers' collective action rights while setting boundaries to prevent abuse or unnecessary harm. The user's intuition about solidarity as legitimate grounds for action, distinct from political demands, seems central. Ensuring the principle doesn't rely on subjective sympathy but on objective relations in labor disputes is crucial for consistency.
answer: |-
  Your addressee/target distinction is insightful but requires refinement to capture your nuanced judgments. It survives as a core component but needs additional clauses to handle solidarity actions and protect non-responsible individuals. Below is a repaired principle, analysis of new cases, and assessment of verdict conflicts.

  ### Repaired Principle: The Justified Strike Principle (Clause-by-Clause)

  1.  **Core Addressee Requirement:** *The strike’s primary addressee must be the party reasonably responsible for the grievance.* (Forced by Cases 5 & 2). This relaxes "own employer" to include other entities directly responsible (e.g., a contractor exploiting workers whose dispute triggers a sympathy strike). *Case 5 fails:* The government, not the employer, is responsible for the minimum wage. *Case 2 succeeds:* The other company (the grievance-holder) is the responsible addressee.
  2.  **No Unjust Harm to Non-Responsible Third Parties:** *The strike must not intentionally inflict severe, disproportionate, or irreparable harm on parties not reasonably responsible for the grievance.* (Forced by Case 4). This prohibits targeting individuals uninvolved in the dispute. *Case 4 fails:* Demanding dismissal harms a co-worker (target) whose actions (working during the strike) were legally permissible and who isn’t responsible for the alleged workplace toxicity; the dispute is with the employer over working conditions.
  3.  **Solidarity Extension:** *A strike whose primary addressee is a third party *is* justified if: (a) the grievance involves labor rights/interests of workers employed by that third party, and (b) the action is a proportionate means of labor solidarity.* (Forced by Case 2). This explicitly permits sympathy strikes like Case 2, distinguishing them from political strikes (Case 5).
  4.  **Procedural Defect Override:** *A strike violating procedural rules (e.g., no-strike clauses) is justified if the grievance involves fundamental rights (e.g., safety, freedom from harassment) and internal remedies are exhausted or futile.* (Forced by Case 6). This justifies wildcat strikes in extreme circumstances like harassment.
  5.  **Target Neutrality:** *The identity of the target (who bears the cost) is not inherently determinative of justification, provided clauses 1-4 are satisfied.* (Core insight from Cases 1, 3, 7). Harm to patients (Case 1), the employer/country (Case 3), or the employer/jobs (Case 7) is collateral, not disqualifying if the action meets the core criteria.

  ### Analysis of New Cases Using the Repaired Principle

  1.  **Physically Blocking Replacement Workers:** Likely **Unjustified**. While the addressee (employer) is responsible, blocking entry typically constitutes coercion/threats (not just withholding labor) and inflicts severe harm (preventing work/income) on non-responsible third parties (replacements) violating Clause 2. Peaceful picketing urging solidarity is different.
  2.  **Crossing a Lawful Picket Line Due to Financial Hardship:** **Permissible (not condemned by the principle).** The principle defines *strike* justification, not individual worker obligations during one. Crossing might violate union solidarity, but it doesn't make the *strike itself* unjustified (if it meets the criteria). The individual's necessity is a separate moral/pragmatic issue.
  3.  **Striking Against a Merger (Only Affects Other Plant):** Likely **Unjustified**. The primary addressee (own employer) is not reasonably responsible for the grievance (job losses at the *other* plant). This is not labor solidarity (Clause 3a - the grievance isn't about *those* workers' rights/interests vis-à-vis *their* employer). It's interference in another business's restructuring, violating Clause 1.
  4.  **Lockout by Employer:** **Justified under symmetrical conditions.** Apply the principle inversely: A lockout is justified if its primary addressee (the union/workers) is reasonably responsible for the grievance (e.g., refusing good-faith negotiation), it doesn't inflict unjust harm on non-responsible third parties (e.g., innocent suppliers), and it's a proportionate response. It mirrors the strike's function as economic pressure within a labor dispute.

  ### Verdict Conflicts and Cost Assessment

  *   **Which Verdict Cannot Be Kept?** **Case 4 (Demanding a Coworker's Dismissal)**. The repaired principle explicitly rules this unjustified under Clause 2 (Unjust Harm to Non-Responsible Third Parties).
  *   **Cost of Dropping It:** **Negligible/Low Cost.** You *already* judged this strike unjustified. The principle now formally grounds this verdict, aligning with your intuition that targeting the co-worker is wrong regardless of the employer being the addressee. This is a gain in explanatory power, not a loss.
  *   **Which Verdict is *Now* Kept (that the original principle condemned)?** **Case 2 (Sympathy Strike)**. The repaired principle explicitly justifies it under Clause 3 (Solidarity Extension).
  *   **Cost of Complication:** **Acceptable.** The added complexity (Clauses 2, 3, 4) is necessary to capture your core intuitions about solidarity, avoiding unjust harm, and procedural exceptions for fundamental rights. It resolves the tension between Cases 2 and 5 by grounding the distinction in the *nature of the grievance and responsible party* (labor rights of other workers vs. broad political demand), not just subjective sympathy.

  ### Distinguishing Case 2 (Sympathy) and Case 5 (Minimum Wage)

  The repaired principle cleanly distinguishes them:
  1.  **Nature of Grievance & Responsible Party (Clause 1):** Case 2 targets a *specific employer* responsible for the *labor grievance* (low pay) of *their own employees*. Case 5 targets the *government* responsible for a *general socio-economic policy* (national minimum wage).
  2.  **Solidarity Extension (Clause 3):** Case 2 is a classic *labor solidarity action* supporting workers in a direct dispute with their employer over core employment terms (pay). Case 5 is a *political protest* aimed at government policy; solidarity here is with low-wage workers generally, not workers in a specific, active labor dispute against a responsible employer. Labor law and ethics traditionally draw a stronger justification boundary around direct labor disputes and solidarity within them than around broader political strikes.

  The distinction isn't merely "sympathy" for the cause, but the *relational context*: Is the action primarily about applying economic pressure within an employer-employee relationship (or solidarity between such relationships), or is it about influencing broader government policy? Your intuition aligns with this established, principled distinction. The repaired principle formalizes it.
