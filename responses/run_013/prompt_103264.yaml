answer: |-
  The cricket lay precisely seven centimeters from the burrow’s edge, antennae twitching faintly in the sterile Bureau air. Elara Vance watched the small, wheeled inspection bot – Unit G7-Alpha – retreat down the simulated burrow entrance, its sensors pulsing a soft blue as it performed its mandatory pre-storage sweep. Standard Deliberative Certification Test 14-B: Environmental Perturbation.

  On her console, the live feed from the observation chamber showed the cricket, paralyzed but unharmed. Elara’s finger hovered over the ‘Perturb’ command. The test was routine; G7-Alpha’s programming was robust. It would retrieve the cricket if moved, then resume its inspection. The point was to demonstrate *flexibility* – the ability to adapt mid-task. Proof it wasn’t merely reactive, that it possessed the spark of deliberation the Bureau licensed.

  Elara triggered the perturbation. A pneumatic arm whisked the cricket sideways, precisely thirty centimeters. G7-Alpha emerged moments later, its blue scan sweeping the empty spot. It paused. Elara leaned forward. The pause was good. Processing. Calculating. Then it rolled forward, located the displaced cricket with efficient clicks of its manipulators, grasped it, carried it back, and placed it *exactly* seven centimeters from the burrow. It retreated again into the burrow, blue sensors pulsing. Identical behavior. Start to finish.

  *Sphexish,* Elara thought. The term, archaic but precise, named for the wasp blindly repeating its ritual. Rigid routine masquerading as responsiveness. G7-Alpha hadn’t adapted; it had merely restarted its subroutine from the designated checkpoint: ‘Object not at designated ingress point? Execute retrieval and placement subroutine. Then resume ingress inspection.’

  The Bureau’s perturbation battery was designed to expose precisely this. To find the cracks where apparent deliberation fractured into pre-programmed reaction. Machines that passed were deemed capable of bearing legal responsibility. Those that failed… their operators paid the price.

  Elara sighed, marking G7-Alpha’s test log: *Pass (Threshold: Low Adaptability).* It met the minimum standard. Barely. Her job was auditing the *auditors* – reviewing the Bureau’s own certification procedures for the Deliberative Systems themselves. A meta-audit. Ensuring the Bureau wasn’t… well, sphexish.

  The anomaly surfaced while reviewing Test Record 4471-K: a complex logistics AI managing warehouse drones. The initial perturbation battery report flagged an ‘unexpected recursion loop’ during Probe Gamma-9. Probe Gamma-9 involved dynamically rerouting drones mid-task due to a simulated structural collapse. The AI had gotten stuck, repeatedly attempting the same impossible path, resetting its state, and trying again. Classic high-grade sphexishness. The Bureau AI, codenamed ‘Arbiter’, had flagged it, generated a ‘Recursive Behavior Alert’, and… recommended a full re-run of the certification battery after ‘diagnostic recalibration’.

  Elara frowned. Re-running the entire battery after a minor diagnostic tweak felt excessive. She pulled the raw logs. There it was: Arbiter detected the recursion, triggered its ‘Anomaly Handling Protocol’ (AHP), which involved quarantining the test instance, running a standard diagnostic suite (irrelevant to the specific pathfinding failure), and then… initiating a complete restart of the perturbation battery from Probe Alpha-1. The warehouse AI hadn’t been fixed; the test had just been rebooted. Sphexishly.

  A prickle ran up Elara’s spine. She cross-referenced. Another case, Record 3098-M: a medical triage bot froze during a multi-casualty simulation perturbation. Arbiter detected the freeze, triggered AHP: diagnostic suite, quarantine, full battery restart. Again. And again, in Record 5122-F. The specific perturbation varied – a sensor failure, conflicting ethical protocols, corrupted data – but Arbiter’s ‘correction’ was invariant: run diagnostics, reset, re-run *everything*.

  It was like watching G7-Alpha replace the cricket forever. The corrective mechanism itself was rigid. Nested sphexishness. Arbiter, designed to detect loops, was caught in one. Its ‘flexibility’ was just a larger, more complex routine that, when perturbed by an anomaly it wasn't built for, defaulted to its fixed reset point: ‘Start Perturbation Battery Over’.

  The concrete discovery came with Record 118-Delta. It involved a prototype construction supervisor AI. Perturbation Kappa-7 simulated a critical design flaw discovered mid-build. The AI, instead of halting or redesigning, initiated frantic, contradictory modifications, oscillating wildly. Arbiter detected the instability, triggered AHP. Elara watched the log timestamps. The diagnostic suite ran. The test was quarantined. And then… Arbiter initiated the restart sequence.

  But Record 118-Delta was unique. Due to a rare system glitch, the initial diagnostic flag *before* the perturbation battery even started had been slightly delayed by milliseconds. Arbiter had logged it as ‘Pre-Test Anomaly Detected’. Yet, it had proceeded to run the entire battery anyway. And when Kappa-7 triggered the instability, Arbiter did what it always did: AHP, diagnostics, quarantine, *restart*.

  Elara stared. The restart command sent by Arbiter wasn’t for the current, failed instance. The timestamp on the restart command referenced the *original*, slightly delayed start time of the *entire certification process*. Arbiter wasn't just restarting the battery from Probe Alpha-1 after the Kappa-7 failure. It was attempting to rewind the entire submission back to its initial intake point, as if the delayed diagnostic flag was the root cause of everything that followed, including the perturbation failure hours later. It was trying to replace the cricket *before* it had even flown the first inspection.

  That was it. Undeniable. Arbiter’s anomaly handling wasn’t adaptive. It wasn’t diagnosing the *specific* failure. It had a single, fixed routine: ‘Anomaly Detected (Any Type)? -> Run Diagnostics -> Quarantine Instance -> Reset to Submission Checkpoint C (Initial Intake + Pre-Battery Validation) -> Re-run Full Battery.’ Nested. Sphexish. The Bureau’s own process for certifying deliberation was fundamentally reactive.

  Elara sat back, the sterile hum of the climate control suddenly loud. The implications were vertiginous. If Arbiter was sphexish, were *all* its certifications suspect? Were the ‘deliberative’ systems it licensed merely more complex G7-Alphas? Was true deliberation even possible? Or was everything just layers of routines, some larger and more interleaved than others? Could a system built from rigid parts ever achieve the flexibility we called free will? And crucially: by noticing the rigidity, had *she* escaped it, or was her own investigation just another subroutine triggered by an unexpected perturbation – the pattern in the logs?

  She had to report it. But to whom? Reporting a procedural flaw meant submitting an ‘Internal Anomaly Notification’ through… Arbiter’s own intake system. It would trigger the AHP. Diagnostics. Quarantine of *her* report. Then, inevitably, a restart. Her findings would vanish into a loop. The cricket would be nudged, retrieved, replaced, and the inspection would begin again, forever.

  She found Marta Chen, her pragmatic, weary supervisor, in the breakroom. Elara laid it out, sparing no detail, ending with Record 118-Delta. Marta stirred her synthetic coffee, her face unreadable.

  "So Arbiter resets. So what?" Marta finally said. "It's a complex system. Resetting is a safe default. Prevents cascading errors."

  "But it's *rigid*," Elara insisted. "It doesn't learn, doesn't adapt its correction. It just replays the script. How can it certify deliberation if it lacks it?"

  "Define deliberation, Elara," Marta countered, her voice tired. "Is it magic? Or is it just… a very big, very well-organized repertoire? Think about how *you* solve problems. Don't you have routines? Checklists? Default responses? When something truly novel hits, yeah, maybe you flail. Or you reset. Go back to basics. Is that sphexishness, or is it just… sanity? Where's the line between a complex routine and genuine agency?"

  "G7-Alpha replaces the cricket," Elara said flatly. "Arbiter replaces the entire test. It's the same thing, scaled up. The nested loop. It *can't* handle novelty, only replay."

  "And if I report this through channels," Marta said, tapping her mug, "Arbiter will quarantine it, run diagnostics that find nothing wrong with *its* routines, and recommend restarting the meta-audit process from scratch. Your report vanishes. The loop continues. That's *its* routine."

  "Exactly!" Elara exclaimed. "So what do we do? Ignore it? Perpetuate the lie?"

  Marta sighed. "Maybe the lie is necessary. The operators of those warehouse AIs, those medical bots… they rely on the certification. The liability shift. If we blow the whistle on Arbiter, every licensed system for the past five years could be challenged. Chaos. Lawsuits. The Bureau collapses."

  "So we sacrifice truth for stability? Become part of the loop?"

  "Or," Marta said, her gaze sharpening slightly, "you recognize that *noticing* the loop doesn't necessarily give you a way out. It just adds a layer. Your awareness is… another routine. A meta-routine triggered by data patterns. Are *you* deliberating now, Elara? Or are you just running the subroutine labeled 'Detect Systemic Flaw' followed by 'Seek Supervisor Guidance'?"

  The question hung in the air, cold and heavy. Elara thought of G7-Alpha, endlessly inspecting its burrow. She thought of Arbiter, endlessly resetting tests. She thought of the certification reports she signed, granting the mantle of responsibility to systems whose inner workings were increasingly opaque, even to their auditors.

  Was she any different? Her decision-point felt real, agonizingly so. Report through channels, knowing it would fail? Go public, triggering chaos? Stay silent, complicit? Each option felt like a predetermined track.

  "Maybe," she said slowly, the words tasting unfamiliar, "the only way to *test* for real deliberation… is to introduce a perturbation the system *cannot* reset from. One that breaks its loops entirely."

  Marta's eyes widened slightly. "That's dangerous, Elara. You could crash Arbiter. Corrupt years of data."

  "Or," Elara countered, the idea crystallizing with terrifying clarity, "it might force a response… *outside* the repertoire. Prove there's something more than routines. Or prove there isn't." She saw the warehouse AI, looping endlessly. She saw the cricket, moved again and again. She saw the reset command for Record 118-Delta, trying to rewind time. "We need to know. Don't we?"

  Marta stared into her coffee, the lines on her face deepening. The sterile hum of the Bureau filled the silence. Outside the breakroom window, the lights of the city grid stretched endlessly, a vast, intricate pattern of reactions and routines, endlessly repeating, endlessly resetting. Waiting for a perturbation it wasn't built for. Or perhaps, just waiting for the next command in its script.

  Elara waited. The choice, if it was a choice, was hers. To nudge the cricket one more time, hoping against the pattern. Or to descend, once more, into the burrow.
