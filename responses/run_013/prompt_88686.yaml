answer: |-
  ### St. Petersburg Paradox Exam Question  
  **Instructions:** Answer all parts. Show your working and explain your reasoning clearly. Total: 20 marks.  

  **Background:** In the standard St. Petersburg game, a fair coin (p = 0.5) is tossed until it lands heads. If the first heads occurs on toss *n*, the player wins £2<sup>n</sup>. The expected monetary value (EMV) is infinite, as ∑<sub>n=1</sub><sup>∞</sup> (1/2)<sup>n</sup> · 2<sup>n</sup> = ∑<sub>n=1</sub><sup>∞</sup> 1 = ∞. This creates a paradox: EMV suggests a rational person should pay any finite amount to play, yet few would pay £100.  

  **Part (a) [7 marks]**  
  A student proposes "capping" the game at *N* tosses: if no heads occur in *N* tosses, the player wins £0.  
  (i) Derive the expected monetary value *V(N)* of this capped game.  
  (ii) Explain why this capping approach fails to resolve the paradox.  

  **Part (b) [6 marks]**  
  Consider a *generalised* game: the coin lands heads with probability *p* (0 < *p* < 1), and the payout for first heads on toss *n* is £*a*<sup>n</sup> (*a* > 0).  
  (i) Find the exact condition on *a* and *p* under which the expected payout diverges to infinity.  
  (ii) Show that the original game (*a* = 2, *p* = 0.5) lies precisely on the boundary of this condition.  

  **Part (c) [7 marks]**  
  Bernoulli’s solution uses a utility function *u*(*x*) = log(*x*), making expected utility finite. Critically evaluate this response:  
  (i) Does it solve the core problem raised by the paradox, or merely "change the subject"?  
  (ii) What theoretical commitments does adopting a bounded utility function (e.g., *u*(*x*) = 1 − *e*<sup>−*kx*</sup>) entail? Discuss one practical consequence.  

  ---

  ### Model Answer (650 words)  
  **Part (a)**  
  (i) The capped game pays £2<sup>n</sup> if heads first appears on toss *n* (probability (1/2)<sup>n</sup>), for *n* = 1, 2, ..., *N*−1. If no heads occur in *N* tosses (probability (1/2)<sup>N</sup>), payout is £0. The expected value is:  
  *V*(*N*) = ∑<sub>n=1</sub><sup>N</sup> [P(first heads on *n*) × payout] + P(no heads) × 0  
  = ∑<sub>n=1</sub><sup>N</sup> [(1/2)<sup>n</sup> × 2<sup>n</sup>] + [(1/2)<sup>N</sup> × 0]  
  = ∑<sub>n=1</sub><sup>N</sup> [1] = *N*.  

  (ii) Capping fails because *V*(*N*) = *N* grows without bound as *N* increases. To avoid infinite EMV, one must choose a fixed, finite *N*; but any choice of *N* (e.g., *N*=100, *V*=£100) is arbitrary, and larger *N* yields higher EMV. The paradox resurfaces: if *N* is large, *V*(*N*) exceeds what sensible people would pay. Thus, capping only relocates the problem to choosing *N*, without addressing why EMV diverges.  

  **Part (b)**  
  (i) The payout for *n* is £*a*<sup>n</sup> with probability P(first heads on *n*) = (1−*p*)<sup>n−1</sup>*p*. The expected payout is:  
  EMV = ∑<sub>n=1</sub><sup>∞</sup> [(1−*p*)<sup>n−1</sup> *p* * *a*<sup>n</sup>] = *p**a* ∑<sub>n=0</sub><sup>∞</sup> [(1−*p*)*a*]<sup>n</sup>.  
  This is a geometric series ∑*r*<sup>n</sup> with ratio *r* = *a*(1−*p*). It converges iff |*r*| < 1, i.e., *a*(1−*p*) < 1. If *a*(1−*p*) ≥ 1, EMV diverges.  

  (ii) For the original game (*a*=2, *p*=0.5), *a*(1−*p*) = 2×0.5 = 1, which *equals* 1. This lies exactly on the convergence-divergence boundary. Hence, EMV is infinite not because parameters are "extreme" but due to precise equality in the critical condition.  

  **Part (c)**  
  (i) Bernoulli’s log utility "solves" the paradox by bounding expected utility (EU): EU = ∑<sub>n=1</sub><sup>∞</sup> (1/2)<sup>n</sup> log(2<sup>n</sup>) = log(2) ∑<sub>n=1</sub><sup>∞</sup> *n*/2<sup>n</sup> < ∞. However, it changes the subject by rejecting EMV as the rational criterion. The core problem is that EMV maximisation *itself* fails when expectation diverges, rendering "fair price" undefined. Diminishing marginal utility (log) avoids divergence but does not explain why EMV is ill-behaved here. It sidesteps the paradox’s challenge to the foundations of expected value theory.  

  (ii) Adopting any bounded utility function (e.g., *u*(*x*) = 1 − *e*<sup>−*kx*</sup>) ensures finite EU for all lotteries but commits one to extreme risk aversion over high-stakes gambles. For example, a bounded *u* implies rejection of any gamble with positive EMV if the potential loss is sufficiently large, no matter how small the loss probability. This contradicts intuitive rationality for modest-probability, high-impact gains (e.g., rejecting a 99% chance to gain £1 billion versus 1% chance to lose £10,000). Thus, "solving" St. Petersburg via bounded utility imposes strong—and arguably counterintuitive—constraints on rational choice.  

  The paradox highlights that expected value maximisation is incompatible with real-world rationality when utilities are unbounded and expectations diverge. Bernoulli’s move salvages expected utility theory but at the cost of denying that money has linear value and accepting implausible risk attitudes. The deeper issue is whether rationality *requires* preferences representable as EU with a real-valued utility function—a thesis the paradox destabilises.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points** (marks shown; common errors in italics):  

  1. **Part (a)(i): Correct derivation of *V*(*N*) = *N* (4 marks)**  
     *Common error: Omits P(no heads) term or miscalculates sum as 2<sup>N</sup> − 1.*  
  2. **Part (b)(i): Correct convergence condition *a*(1−*p*) < 1 (3 marks)**  
     *Common error: States *ap* < 1 or misapplies geometric series ratio.*  
  3. **Part (b)(ii): Identifies original game on boundary (*a*=2, *p*=0.5 gives *a*(1−*p*)=1) (1 mark)**  
     *Common error: Claims original parameters are "within" divergence region.*  
  4. **Part (c)(i): Notes log utility avoids divergence but critiques it as dodging EMV’s failure (2 marks)**  
     *Common error: Asserts log utility "solves the paradox" without addressing EMV’s divergence.*  
  5. **Part (c)(ii): Explains bounded utility forces extreme risk aversion (2 marks)**  
     *Common error: Describes boundedness but omits concrete consequence (e.g., rejecting positive EMV gambles).*  

  **Additional marks** (for rigour, clarity, and sub-part coverage):  
  - Part (a)(ii) explanation: 3 marks (1 for *V*(*N*)→∞, 2 for "relocates problem")  
  - Part (b)(i) derivation: 2 marks  
  - Part (c) overall coherence: 3 marks  

  **British English note:** "maths", "realise", "£", "capped" used throughout.
