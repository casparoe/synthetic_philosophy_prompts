prompt: |-
  ok so I'm in a vagueness seminar this term (cross-listed phil of language / metaphysics) and the final paper has to include a big section on "what would have to be true for your view to be false," which is the part I'm completely stuck on. Hoping you can help me map it out.

  Here's my view. I say vagueness isn't one phenomenon and people keep trying to give one theory for all of it. I split predicates into two sources. For predicates whose borderline cases come from a continuous magnitude we can't discriminate -- tall, bald, heap, red-ish -- I'm an epistemicist: there's a fact of the matter about where the cutoff sits, we could never know it, and some sorites premise is just false. For predicates whose borderline cases come from us making the rules up as we go -- vegan, a sandwich, a sport, grown up -- I'm a supervaluationist: there's no fact of the matter, the predicate is true on some admissible precisifications and false on others, which is why the sorites reasoning feels compelling without being sound. So: epistemicism in one region, supervaluationism in the other, sorted by whether the vagueness comes from the world's grain or from our stipulations. I've been calling it the two-source view, which is a boring name, I know.

  What I want is the actual defeaters, not a reading list -- no citations, I can't use them anyway and I mostly need the shape of the thing. Be blunt about whether my two regions are even distinguishable or whether I've drawn a line that collapses the first time somebody hands me a mixed case (a legal threshold cashed out in a continuous measurement? a sensory predicate that's pure convention? a predicate where we stipulated a cutoff on purpose and it's still vague?). Tell me which defeaters I'd have to concede as the view's defender and which I'd dismiss as question-begging, and be honest at the end about whether a view like this has been patched into unfalsifiability and whether that's actually a problem here or just the price of any view about vagueness.

  One more thing to fold in: I'm running a small survey for the paper, like 40 undergrads, where I show them a sorites series for a made-up predicate and ask (a) true or false, (b) is there a fact of the matter you dont know or no fact of the matter at all, (c) how confident are you. Tell me which result patterns would count against me, and specifically whether any pattern would make me drop the two-source distinction rather than patch it.

