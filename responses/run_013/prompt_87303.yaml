  - But I must highlight the fudging: no actual intervention exists for genome replacement, and the "same unit" assumption fails completely. The identifying assumption of gene-environment separability is biologically implausible.

  Position 2 ("purely descriptive") is actually the most compatible with their framework. The heritability ratio h² = V_G/(V_G + V_E) survives intact as a population-level descriptive statistic. No translation loss here - this position is fully expressible in their vocabulary.

  Position 3 ("environment-dependent artifact") reveals a key insight: the variance components are functions of environmental distribution. Translating V_E as environmental heterogeneity works, but I should emphasize that "environment" in genetics is just the residual - a stark difference from their treatment-based conception. The core claim (statistic reflects environment more than trait) survives but gets distorted by this residualization.

  Position 4 ("difference-making vs process") is philosophically subtle. The contrast between actual and counterfactual genomes maps to their potential outcomes, but again the unit persistence problem appears. The distinction between difference-making and developmental process has no direct analog in their framework - it's a conceptual gap.

  Now the residue report challenges:
  - The unit persistence problem with genome counterfactuals is fundamental. I think this exposes a genuine limitation in the heritability claim itself - it's not stating an individual-level causal fact but a population-level statistical pattern. Their framework correctly flags this as non-causal.
  - The "environment as residual" issue is critical. By definition V_E contains all non-genetic variation including measurement error and gene-environment correlations. This would be unacceptable in an identification strategy where environment needs precise definition. The loss here reveals a weakness in the original behavior genetics formulation.
  - Ultimately, the only untranslatable element is the implicit biological essentialism in some heritability interpretations. What survives is precisely that h² is a population-and-context-dependent variance ratio. This isn't the geneticists being confused; rather, they're describing a real but purely statistical pattern that gets misinterpreted as causal architecture.

