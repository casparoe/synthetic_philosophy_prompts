prompt: |-
  Hey, I've been arguing with a friend about consent and I want a real explanation of the underlying issue, not the usual informed-voluntary-competent checklist again.

  Here's the thing I can't get straight. There seem to be two totally different pictures of what consent even is. On the first picture, consent is a mental state -- some kind of inner endorsement or willingness -- and all the outward stuff (saying yes, signing, nodding) is just evidence we use to guess at that inner state. On the second picture, consent is an act or a communication: it's something you do that changes what other people are permitted to do, so an inward yes that never gets communicated isn't consent at all, and an outward yes you privately regret might still count as real consent in the relevant sense.

  I feel like this split is doing a lot of hidden work in the three standard defeaters. Take coercion: if consent is a mental state, a threat works by making you not really willing; if consent is a performative thing, the threat might leave your act intact but make it not count. Same with deception -- does the lie make the mental state defective, or make the act fail to be about the right thing? And competence -- is that a property of the person, or of the particular decision, or of the decision relative to how risky it is?

  Can you explain this properly, and seperate where the two pictures genuinely come apart from where they just sound different? A concrete case I keep circling: someone agrees to a medical procedure after the doctor downplays a rare risk without actually saying anything false -- nothing untrue is stated, but the picture in their head is wrong. Is that invalid consent, and does the answer change depending on which picture you hold?

  Also I keep hearing that some coercion is wrongful and some isn't -- like a doctor offering you a treatment you otherwise wouldn't get isn't coercive even though it changes your options, whereas a boss making sex a condition of your job is. Where does that line actually come from, and does it fit better with one of the two pictures than the other?

  Please be concrete and dont just restate the three conditions. I want the actual machinery.
reasoning: |-
  Okay, let me unpack this user's question. They're wrestling with two fundamentally different conceptions of consent: the mental state model and the performative model. They want to understand where these models genuinely differ and where they might converge in practical terms. 

  The user seems frustrated with superficial explanations of consent's three conditions (voluntary, informed, competent). They're clearly thought deeply about this - note how they spot how each model reframes coercion, deception and competence differently. That medical example about downplayed risks is particularly sharp for testing the models.

  Hmm... their core tension is ontological: is consent something inside us or something we do? I should clarify this isn't just semantics - it changes how we assign responsibility. For the mental state model, authenticity is key; for performative, social transaction matters most. But in practice? They often align because we use communication as the best proxy for inner states. 

  That coercion distinction they mention is crucial. Both models condemn threats that distort choices, but the "wrongful advantage-taking" angle explains why some option-changes feel coercive (boss exploiting power) while others don't (doctor offering treatment). The performative model handles this cleaner with its focus on legitimate transactional boundaries.

  For their medical case: under mental state model, the risk distortion voids consent if it impacts willingness; performatively, it's still valid consent but possibly unethical disclosure. But crucially, both would condemn it in medical ethics! The models diverge in theory but converge in judgment here. 

  I should emphasize that the performative model isn't coldly transactional - it builds in moral constraints like "no exploiting vulnerabilities." That's why the boss scenario fails: not because the employee isn't "truly willing," but because leveraging workplace power for sex violates the rules of that interaction type.

  The competence question is thorniest. Mental state model ties it to cognitive ability; performative asks "was this person socially recognized as capable for this decision?" But note how both would refuse a dementia patient's consent - different paths, same outcome.

  Ultimately the user needs to see that the models aren't mutually exclusive frameworks but complementary lenses. We care about inner states but require outward expressions; we honor communications while judging their ethical soundness. Their medical example proves this: either route condemns the doctor's behavior, just with different philosophical vocabulary.
answer: |-
  You've hit the core philosophical tension perfectly: the **Mental State Model** vs. the **Performative Model** of consent. This split isn't just academic; it drives real-world disagreements about coercion, deception, and competence. Let's dissect the machinery, using your medical case and coercion question as anchors.

  ### The Two Models: Core Machinery
  1.  **Mental State Model (Inner Endorsement):**
      *   **Essence:** Consent is a *psychological state* – genuine willingness, approval, or agreement *within the person's mind*. This state is the *source* of permission.
      *   **Outward Acts (Verbal "Yes", Signature, etc.):** Are merely *evidence* (often the best available) of that inner state. Imperfect evidence. A "yes" without inner agreement isn't consent. An uncommunicated inner "yes" *is* consent, but functionally useless (and potentially dangerous) because others can't know it.
      *   **Focus:** Authenticity of the will. Did the person *truly* want this?
      *   **Machinery for Defeaters:**
          *   **Coercion:** Invalidates consent by *destroying genuine willingness*. The threat (explicit or implicit) makes the person choose something they *fundamentally do not want* to avoid a worse outcome. The inner state is one of *constrained desperation*, not endorsement.
          *   **Deception:** Invalidates consent by *creating a false mental state*. The person agrees to *X* (based on their understanding), but the reality is *Y*. Their inner endorsement is attached to a fiction. Even if technically "true" statements mislead (as in your medical case), if the resulting *mental picture* is significantly inaccurate regarding material risks/benefits, the inner endorsement isn't valid for the *actual* proposition.
          *   **Competence:** Focuses on the *person's cognitive capacity* to form the required mental state (understanding, reasoning, appreciating consequences). It's a threshold condition *for* the mental state's validity.

  2.  **Performative Model (Communicative Act):**
      *   **Essence:** Consent is a *social act* – a communication (verbal, gesture, contractual) that *changes normative relationships*. Saying "yes" (appropriately) *itself* grants permission. It's a speech act, like promising or marrying.
      *   **Inner State:** Is *relevant* but not *constitutive*. An uncommunicated "yes" in your head grants *no permission* to others. A communicated "yes" you later regret *did* grant permission at the time it was given (though it might reveal other problems like poor information or pressure). The *act* creates the permission.
      *   **Focus:** Social transaction and normative change. Did the person *validly perform* the act of granting permission according to the rules of the interaction?
      *   **Machinery for Defeaters:**
          *   **Coercion:** Invalidates consent by *vitiation of the act*. The "yes" wasn't a *valid normative act* because it was produced under conditions that *violate the rules* for granting permission in that context. Threats create an environment where the "agreement" isn't recognized as a free exchange of permissions; it's extracted under duress, making it *void* or *voidable*.
          *   **Deception:** Invalidates consent by *misrepresentation of the act's object*. Consent is always consent *to something specific*. Deception means the person performed the act of consenting to *A*, but the reality is *B*. Their communicative act *refers to the wrong thing*, so it doesn't grant permission for what's actually happening. Even technically true but misleading statements can render the communicative act invalid if they prevent the person from understanding the *nature* of what they're agreeing to.
          *   **Competence:** Focuses on the *capacity to perform the communicative act validly*. Can this person understand the *transaction* they are engaging in? Can they communicate assent/refusal reliably *within the specific context*? It's defined relative to the complexity and stakes of the decision being made.

  ### Where They Genuinely Come Apart vs. Sound Different
  *   **Genuine Divergence: The Uncommunicated "Yes"**
      *   **Mental State:** *Is* consent. The *permission exists* internally, even if useless/unknowable.
      *   **Performative:** *Is not* consent. Permission *was not granted* to the other party. No normative change occurred.
  *   **Genuine Divergence: The Regretted but Freely Given "Yes"**
      *   **Mental State:** *Was* consent *at the time* (if the inner state was genuine then).
      *   **Performative:** *Was* consent *at the time*. The act was validly performed.
      *   *(Both models agree it happened; they differ on whether the regret retrospectively changes the nature of the original act/state, but generally, consent is assessed at the time it was given).*
  *   **Practical Convergence (Often):** In the overwhelming majority of real-world cases, **we require both.** We demand communicative acts *because* they are the best evidence for the mental state, and we care about the mental state *because* a communicative act without it feels like a hollow shell, potentially exploitative. The models often *lead to the same practical outcome* via different reasoning paths. The divergence is starkest in edge cases (like the uncommunicated "yes").

  ### Your Medical Case: Downplayed Risk
  *   **Scenario:** Doctor accurately describes a procedure but intentionally downplays a rare risk (e.g., "This risk is vanishingly small, barely worth mentioning," when it's 1 in 1,000 and serious). Patient consents based on an inaccurate *impression* of the risk level.
  *   **Analysis:**
      *   **Mental State Model:** The patient's inner endorsement is flawed. They agreed to a procedure they perceived as having a *minimal* risk of *X*. The reality involves a *significant* risk of *X*. Therefore, their *actual mental state* (willingness contingent on very low risk) doesn't match the actual proposition (moderate risk). **Invalid Consent.** The defect is in the *formation* of the will.
      *   **Performative Model:** The patient performed the act of consenting *to a specific description*. The doctor's communication, while perhaps technically avoiding falsehoods, created a *material misrepresentation* of the nature of the act being consented to. The communicative act ("I consent to Procedure Y described as having risk profile Z") is invalid because the description *Z* was materially misleading. The consent doesn't validly cover the *actual* risk profile. **Invalid Consent.** The defect is in the *referential accuracy* of the communicative act.
  *   **Outcome:** Both models find the consent invalid, but for different core reasons. The Mental State model focuses on the patient's distorted internal understanding. The Performative model focuses on the doctor's defective communication that undermined the validity of the consent *act*.

  ### The Coercion Line: Wrongful vs. Permissible "Pressure"
  The distinction arises from **normative context and legitimate expectations**, fitting *better* with the **Performative Model's** focus on the rules of the interaction.

  1.  **Doctor Offering Treatment:** "If you don't take this medicine, you'll likely die." This changes options drastically. Why isn't it coercive?
      *   **Mental State:** The patient *is* constrained and desperate. Their willingness might feel forced *by circumstance*.
      *   **Performative:** The doctor is *fulfilling their role*: presenting factual medical options and consequences within their legitimate scope of practice. The "pressure" comes from the *disease*, not the doctor *exploiting* their position. Offering a beneficial option (even a life-saving one) doesn't violate the rules of the doctor-patient transaction; withholding it might. The patient's "yes" is a valid act granting permission for treatment.
      *   **Key:** The doctor isn't *creating* the threat; they are *disclosing* an existing natural threat and offering a remedy. Their power is being used *appropriately*.

  2.  **Boss Demanding Sex:** "Have sex with me or you're fired."
      *   **Mental State:** The employee feels desperate, unwilling, constrained. Their "yes" isn't genuine endorsement.
      *   **Performative:** The boss is *exploiting their institutional power* (control over employment) *outside its legitimate scope* to extract something completely unrelated to the job. This *violates the fundamental rules* of the employer-employee relationship. The power dynamic itself makes any apparent "agreement" void – it cannot be a valid normative act of consent within that context because the context is corrupted by the abuse of power. The "pressure" is *created by the boss* misusing their position.
      *   **Key:** The boss *creates* the wrongful threat by leveraging power illegitimately.

  **The Line:** Coercion occurs when **Option A (the threat/leverage) is wrongfully imposed by the proposer, exploiting their power or position illegitimately to extract Option B (the concession).** Permissible "pressure" arises from **external circumstances (like illness), or from legitimate exercises of power within their proper domain (offering treatment, setting job requirements *related to the job*).**

  **Which Model Fits Better?** The Performative model explains this line more cleanly. It asks: *Did the proposer violate the normative rules of this specific type of interaction by leveraging their position illegitimately to extract this concession?* If yes, the consent act is vitiated. The Mental State model struggles slightly more to distinguish the "forced by circumstance" feeling in the medical case (which doesn't invalidate consent) from the "forced by threat" feeling in the boss case (which does).

  ### Conclusion
  The Mental State vs. Performative debate reveals consent's dual nature: a deeply personal psychological reality *and* a crucial social/legal transaction. While they offer distinct foundational justifications, they frequently converge in practice because valid social acts usually require evidence of genuine inner states, and genuine inner states only become socially effective through communication.

  *   **Mental State:** Explains *why* we value consent (authenticity of will, preventing violation).
  *   **Performative:** Explains *how* consent functions socially and legally (creating permissions, changing obligations).

  Your medical case highlights this convergence: both models condemn the downplayed risk because it either corrupts the inner will or makes the communicative act referentially defective. The coercion line shows the Performative model's strength in analyzing power dynamics within normative contexts. Understanding both models reveals the rich, complex machinery underlying the seemingly simple concept of "yes."
