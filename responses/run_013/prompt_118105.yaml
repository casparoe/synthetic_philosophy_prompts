prompt: |-
  I run a monthly "theory lunch" for the engineering team I work on: twelve people, mixed seniority, most of whom have never read any philosophy and would tune out instantly if I framed it that way. I get one seventy-five-minute session, one room, a projector, index cards, and a whiteboard. What I actually want out of it is to change how they argue in incident postmortems, so treat the session as a rehearsal for those arguments.

  The intuition I'm chasing comes in two halves, and I'd like the activity to make the team feel both, not hear them described.

  First: the word "cause" may not pick out one fact about the world that a room full of people is failing to converge on. On one view I've run into, "cause" is really a three-place relation — this event, that outcome, and the contrast against which the outcome is being picked out. So "the deploy caused the outage" is shorthand for "the deploy rather than the config change caused the outage rather than a slow degradation," and if you silently swap the contrast you can get people who agree about every physical fact to disagree about what "the cause" was. Second: whether we say someone caused a harm by doing nothing — by not acting, not escalating, not replying — seems to track not a difference in the causal structure but whether we were holding that person to a norm they failed. The same omission reads as "let it happen" in one frame and "caused it" in another.

  Design me one runnable activity that makes a group of non-philosophers run into both of these from the inside. Requirements:

  - The scenarios should be recognizable to a software team — deploys, retries, a config change, someone not paging, a monitor that was never set up — but the structure, not the software detail, has to be doing the work. Avoid the tired trolley-and-drowning-child material; they'll have seen it.
  - The rules and materials must arrange things so that the team produces inconsistent attributions themselves — flips in what they call "the cause" across scenarios that differ only in the contrast that was implicitly in play, or only in whether an actor was under a norm — before anyone names what happened. The reveal is the team's own voting record, not my explanation.
  - Specify the roles, the materials, the sequence of rounds, a scoring or stake scheme that needs no real money, and where exactly I plant the manipulation so it stays invisible on the first pass.
  - Give me the debrief: the specific moments in the activity to point back to, and how each maps onto the two ideas above. If either idea has a standard name in the literature, name it in the debrief only — I'd rather the team meet it first as something that happened to them.
  - Tell me what will predictably go wrong the first time — where a group will resist, game the rules, or converge too fast — and what to do in the moment.
  - Be honest about what the activity cannot reproduce. I suspect it can show that our causal talk shifts with contrast and with norms, but cannot by itself settle whether there's a further fact of the matter about causation underneath. If that's the right limit, say so plainly and tell me what I have to supply in words that the activity can't.

  Give me one committed design rather than a shortlist: if you see two plausible structures, choose one, commit to it, and tell me why you set the other aside. And commit to a position on what the activity does and doesn't establish about how "cause" works — I'd rather have a definite claim I can push back on than a survey of the options.
reasoning: |-
  We are designing an activity for a theory lunch with the engineering team. The goal is to make the team experience two insights about causation without explicitly teaching philosophy:

  1. Causation as a contrastive relation: "A caused B" is shorthand for "A rather than C caused B rather than D", and changing the implicit contrast can flip what is called "the cause".
  2. Omissions as causes: Whether an omission (like not acting) is seen as a cause depends on whether we hold the person to a norm they failed, not on a fundamental difference in causal structure.

  The activity must:
  - Use software-relevant scenarios (deploys, config changes, monitoring, etc.)
  - Have the team produce inconsistent attributions themselves through voting, with the reveal being their own voting record.
  - Specify roles, materials, sequence, and a scoring scheme without real money.
  - Include a debrief mapping specific moments to the two ideas.
  - Predict problems and solutions.
  - Be honest about what the activity cannot establish.

  We choose one design: a multi-round incident analysis game with voting and scenario variations.

  Design: "Incident Contrast"

  Structure:
  - 3 rounds, each with a short incident scenario description. The scenarios are similar but with subtle variations in the alternatives considered (contrast class) or the norms in place.
  - Each round, the team votes individually on what they think was "the cause" of the incident from a list of options (including actions and omissions).
  - We manipulate the implicit contrast and the norms across rounds to get the voting to flip.
  - After the rounds, we reveal the voting patterns and discuss.

  Materials:
  - Projector: to show the scenario and voting options.
  - Index cards: for anonymous voting in each round (one per participant per round).
  - Whiteboard: to record the voting results (tally) for each round and for discussion.

  Roles: 
  - Facilitator (you) runs the activity.
  - Participants: all 12 team members. They are the incident analysts.

  Sequence:

  Round 1: "The Silent Monitor"
  Scenario:
    - System: A payment processing service.
    - Incident: During a peak hour, the service went down for 15 minutes, causing lost revenue.
    - Timeline:
        - 1:00 PM: A new deploy of the payment service is rolled out (with a subtle bug that only triggers under high load).
        - 1:30 PM: Load starts increasing due to a flash sale. The system begins to degrade (response times increase).
        - 1:45 PM: The system becomes unresponsive (outage starts).
        - 2:00 PM: An engineer, Alice, notices the outage and rolls back the deploy. System recovers by 2:15 PM.
    - Additional context:
        - There was a monitor that could have detected the degradation at 1:30 PM, but it had been disabled by Bob (the on-call engineer) two weeks ago because it was noisy and he was planning to replace it (but hadn't yet).
        - The deploy was reviewed by the team and passed all tests.

  Voting question: "What was the main cause of the 15-minute outage?"
  Options (each on a separate line for voting):
    A. The deploy (with the bug)
    B. Bob disabling the monitor and not replacing it
    C. The flash sale (high load)
    D. Alice not noticing the problem until 2:00 PM (she was distracted by another task)

  Participants write their choice (A, B, C, or D) on an index card and hand it in.

  After collecting, tally the votes on the whiteboard for Round 1.

  Round 2: "The Config Change"
  Scenario:
    - Same system: payment processing service.
    - Incident: During a peak hour, the service went down for 15 minutes, causing lost revenue.
    - Timeline:
        - 1:00 PM: A config change is applied to the database (to increase the connection pool size) by Charlie. (This change had a typo that caused connections to be closed too aggressively under high load.)
        - 1:30 PM: Flash sale starts, load increases.
        - 1:45 PM: System becomes unresponsive.
        - 2:00 PM: Alice (same engineer) notices and rolls back the config change. System recovers by 2:15 PM.
    - Additional context:
        - There was no monitor in place for connection pool errors because the team had never set one up (they had discussed it but prioritized other work).
        - The config change was reviewed and tested in staging, but the typo was subtle and not caught.

  Voting question: "What was the main cause of the 15-minute outage?"
  Options:
    A. The config change (with the typo)
    B. The team never setting up a monitor for connection pool errors
    C. The flash sale (high load)
    D. Alice not noticing the problem until 2:00 PM (she was in a meeting until 1:55 PM)

  Tally votes for Round 2.

  Round 3: "The Retry Storm"
  Scenario:
    - Same system: payment processing service.
    - Incident: During a peak hour, the service went down for 15 minutes, causing lost revenue.
    - Timeline:
        - 1:00 PM: A new feature is deployed that increases the retry logic for failed payments (from 3 to 10 retries). This was intended to reduce payment failures.
        - 1:30 PM: Flash sale starts, high load. The increased retries cause a retry storm, overwhelming the system.
        - 1:45 PM: System becomes unresponsive.
        - 2:00 PM: Alice notices and rolls back the feature. System recovers by 2:15 PM.
    - Additional context:
        - The team had a monitor for system load, but it was not set to page until 90% capacity (and it hit 89% at 1:40 PM, then spiked to 100% at 1:45 PM). The monitoring threshold was set by the team lead, Dana, who thought 90% was safe.
        - Alice was the on-call and was at her desk, but the monitor didn't page.

  Voting question: "What was the main cause of the 15-minute outage?"
  Options:
    A. The new feature (increased retries)
    B. The monitor threshold set too high by Dana (so it didn't page)
    C. The flash sale (high load)
    D. The team not having a more sensitive alert (e.g., on retry rate) in place

