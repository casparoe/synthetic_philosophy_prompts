      - There was no memory usage monitor for this service. The team had discussed adding one in the past but decided it wasn't a priority because they believed existing monitors (for CPU and response time) would catch memory issues. However, those monitors did not alert until the outage occurred."

  Voting question: same as before, but adjust options to match:
    A. Dave doing a full deploy (instead of a canary)
    B. The team never setting up a memory usage monitor
    C. The memory leak bug in the feature
    D. The flash sale (high load)

  Then, tally and discuss.

  This design should work within 75 minutes.
answer: |-
  Below is a committed design for your theory lunch activity, optimized to make your team experience both halves of your intuition (contrastive causation and norm-dependent omissions) through hands-on engagement. I'll first explain the design, then walk through each component as requested.

  ### Why This Design?
  I chose a **"Contrastive Incident Analysis"** game structured as three voting rounds with manipulated scenarios. The activity forces the team to attribute causes in ambiguous situations, then reveals inconsistencies in their own votes to demonstrate how implicit contrasts and norms shift what they label "the cause." I rejected alternative designs (e.g., role-playing debates or sequential story-building) because they risked:
  - **Premature convergence**: Engineers might rationalize one "correct" answer.
  - **Overly explicit manipulation**: Participants might detect the contrast/norm shifts if they were too pronounced.
  - **Lack of personal investment**: Abstract discussions wouldn’t create the "aha" moment of self-realization.  

  This design uses **anonymous voting with index cards** to ensure individual accountability, **identical incident templates** to highlight subtle differences, and a **reveal of voting patterns** as the core debrief tool. No software jargon is needed beyond what your team uses daily.

  ---

  ### Activity Design: "Cause or Context?"  
  **Time**: 75 minutes total (45 min activity, 30 min debrief).  
  **Materials**:  
  - Projector (display scenarios/voting prompts).  
  - Index cards (12 participants × 3 rounds = 36 cards).  
  - Whiteboard (tally votes with a simple table).  
  - Markers.  

  **Roles**:  
  - **Facilitator (You)**: Introduce rounds, read scenarios, tally votes.  
  - **Participants (Engineers)**: Vote individually on "main cause" in each round.  

  **Stakes**: No real money. Use **"diagnostic credibility" scoring**:  
  - After voting, participants bet 1 virtual token on whether the team will be "consistent" (≥70% agreement) or "split" (<70%) in their votes. Correct bets earn bragging rights. This exposes their confidence in group consensus.  

  ---

  ### Sequence of Rounds  
  **Setup (5 min)**:  
  - Explain: "We’re simulating incident analysis. In each round, I’ll describe an outage. You’ll vote anonymously for the *main cause* from 4 options. We’ll tally votes and discuss patterns afterward."  
  - Clarify: "There’s no ‘right’ answer. We’re exploring how we assign blame."  

  **Round 1: Baseline with Norm Violation Omission (Contrast: Deploy vs. Config)**  
  - **Scenario (Projected)**:  
    > "**Flash Sale Outage**: At 1 PM, a deploy (v1.2) and a config change (timeout=500ms) were applied simultaneously. At 1:30 PM, a flash sale started. At 1:45 PM, the service crashed.  
    > **Context**:  
    > - The deploy introduced a retry-loop bug under high load.  
    > - The config change was correct but exacerbated the bug.  
    > - Dana (on-call) saw warnings at 1:40 PM but didn’t page—they were in a meeting and assumed it was noise.  
    > Service recovered after rollback at 2 PM."  
  - **Voting Prompt**: "What was the *main cause* of the crash?"  
    - **A. The deploy (v1.2)**  
    - **B. The config change (timeout=500ms)**  
    - **C. Dana not paging at 1:40 PM**  
    - **D. The flash sale traffic spike**  
  - **Manipulation**:  
    - **Contrast**: Options A/B create a deploy-vs-config contrast. The scenario implies both were "active" changes, but the deploy is subtly framed as the *intended* change (via "introduced a bug"), while the config is "correct but exacerbated."  
    - **Norm**: Dana’s omission is tied to an explicit norm ("on-call"), making it salient.  
  - **Process**:  
    - Participants vote via index card (write A/B/C/D).  
    - Collect cards, tally votes on whiteboard (hide tallies until Round 3).  
    - Run "credibility bet": Participants whisper "consistent" or "split" to you (record counts for debrief).  

  **Round 2: Shifted Contrast (Config vs. Monitor)**  
  - **Scenario (Projected)**:  
    > "**Flash Sale Outage**: At 1 PM, a deploy (v1.2) and a config change (timeout=500ms) were applied simultaneously. At 1:30 PM, a flash sale started. At 1:45 PM, the service crashed.  
    > **Context**:  
    > - The deploy introduced a retry-loop bug under high load.  
    > - The config change was correct but exacerbated the bug.  
    > - A latency monitor existed but was set to alert only at 100% failure (not 90% degradation).  
    > Service recovered after rollback at 2 PM."  
  - **Voting Prompt**: Same options as Round 1.  
  - **Manipulation**:  
    - **Contrast**: Identical events to Round 1, but:  
      - Dana’s omission is **removed**.  
      - A new omission (**monitor threshold**) is added. This shifts the contrast to config-vs-monitor (B vs. implied omission).  
    - **Norm**: The monitor omission has **no responsible actor** ("was set to alert"), avoiding norm violation.  
  - **Process**: Same as Round 1.  

  **Round 3: Norm Shift (Omission as Policy)**  
  - **Scenario (Projected)**:  
    > "**Flash Sale Outage**: At 1 PM, a deploy (v1.2) and a config change (timeout=500ms) were applied simultaneously. At 1:30 PM, a flash sale started. At 1:45 PM, the service crashed.  
    > **Context**:  
    > - The deploy introduced a retry-loop bug under high load.  
    > - The config change was correct but exacerbated the bug.  
    > - Paging for degradations was disabled by team policy (to avoid noise)—no one was alerted.  
    > Service recovered after rollback at 2 PM."  
  - **Voting Prompt**: Same options as Round 1 (but note: Option C now implies the policy omission).  
  - **Manipulation**:  
    - **Contrast**: Same as Round 2 (config-vs-monitor), but:  
      - The omission shifts from "monitor setup" (Round 2) to "paging policy" (Round 3).  
    - **Norm**: The omission is now a **team policy decision** ("disabled by team policy"), absolving individuals.  
  - **Process**:  
    - Vote and tally publicly.  
    - Reveal all three rounds’ tallies side-by-side on the whiteboard.  

  ---

  ### Debrief (30 min)  
  Point to the whiteboard tallies and ask:  
  1. **"What patterns do you see in our votes?"**  
     - *Expected inconsistency*:  
       - **Round 1**: Votes split between A (deploy) and C (Dana’s omission). Few pick B (config).  
       - **Round 2**: Votes shift to B (config) or D (flash sale). Option C (omission) drops sharply.  
       - **Round 3**: Votes scatter (A/B/D dominate). Option C (omission) gets almost no votes.  

  2. **Map to your intuitions**:  
     - **Contrastive causation**:  
       - Point to Rounds 1 vs. 2: "In Round 1, we implicitly contrasted the deploy against the config change—so the deploy ‘stood out’ as the cause. In Round 2, we contrasted the config against the missing monitor, so the config ‘stood out.’ Same events, but our focus shifted what we called ‘the cause.’ This is called **contrastive causation**—we never just say ‘X caused Y’; we mean ‘X *rather than Z* caused Y *rather than W*.’ In postmortems, if we don’t agree on the contrast, we’ll argue endlessly."  
       - **Key moment**: The shift from A/B in Round 1 to B/D in Round 2 despite identical incidents.  
     - **Norm-dependent omissions**:  
       - Point to Option C across rounds: "In Round 1, Dana’s omission (not paging) got votes because we held Dana to an on-call norm. In Rounds 2 and 3, omissions got fewer votes because no one was individually responsible—the monitor threshold was ‘just a setting,’ and the paging policy was a team decision. We only call omissions ‘causes’ when they violate norms we care about. In postmortems, calling someone ‘the cause’ for inaction often means we’re judging their responsibility, not the physics."  
       - **Key moment**: The drop in Option C votes after Round 1.  

  3. **Link to postmortems**:  
     - "In incidents, we fight over ‘the cause’ because we’re using different contrasts or norms. Solution: Make them explicit. Instead of ‘the deploy caused the outage,’ say ‘the deploy *rather than the config* caused a total outage *rather than a slowdown*,’ or ‘Dana *should have acted* per our on-call norms.’"  

  ---

  ### What Will Go Wrong (and How to Fix)  
  - **Convergence too fast**: If votes are >70% consistent, use the "credibility bet" to expose overconfidence. Ask: "Why did you bet on consensus when we ended up split?"  
  - **Resistance to ambiguity**: Engineers may insist, "But there’s a *real* cause!" Redirect: "We’re not debating physics—we’re exploring why we *label* one link ‘the cause.’"  
  - **Gaming the system**: Participants might vote strategically to "prove a point." Mitigate by emphasizing anonymity and skipping the "credibility bet" if needed.  
  - **Time crunch**: Skip bets if behind; use the projector to speed up reading.  

  ---

  ### What the Activity Cannot Do  
  - **Establish if causation is *only* contrastive/norm-dependent**: The activity shows that our **attributions** of cause shift with context, but it doesn’t—and can’t—prove there’s no underlying "real" causation. Causation might still be a mind-independent fact (e.g., the deploy’s code *did* trigger the bug), but our *labeling* of "the cause" is contextual. You’ll need to explicitly say:  
    > "This activity doesn’t settle whether causation itself is contrastive or just our *talk* about it. But for postmortems, what matters is that our attributions *are* shaped by contrasts and norms—and if we ignore that, we’ll keep talking past each other."  

  This design forces the team to confront both intuitions through their own inconsistencies, using software-native scenarios without philosophy jargon. The reveal of their voting flips—not your explanation—makes it visceral. Run it as a rehearsal for postmortems, and they’ll feel the shift.
