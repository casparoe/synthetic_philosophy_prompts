  Manipulation:
  - Round 1: We set up a norm violation (Bob disabled the monitor and didn't replace it) and a clear action (the deploy). We expect votes to split between A (deploy) and B (Bob's omission) because the omission is tied to a clear norm (you shouldn't disable a monitor without a replacement).
