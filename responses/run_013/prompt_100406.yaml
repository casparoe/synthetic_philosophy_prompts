prompt: |-
  I spent most of last night arguing with an old friend — she's finishing a dissertation on Wittgenstein and kept insisting that my whole way of talking about knowledge and doubt is incoherent — and I've been trying since to work out, on my own, where I actually stand. What I want from you is not an exposition of anyone's position but a principle, if one exists, that captures the verdicts I find myself giving about which of my convictions can sensibly be doubted and which cannot. Here they are. (1) When I hold up my hand and say I have two hands, I would not say I doubt it; but I also resist saying I know it, because I don't know it the way I know the kettle is boiling — there is no checking to be done, and nothing I could cite that wouldn't already presuppose the thing itself. (2) I know my own name: it's on my passport, I've answered to it for forty years, I've seen it printed on documents. So here is a proposition I treat as beyond doubt and yet also seem to know on perfectly ordinary evidence, which is not at all how the hands case feels. (3) If someone seriously doubted that two plus two is four, I'd think they hadn't understood the question, but I'm unsure whether that's the same phenomenon as (1) or something else entirely, since it isn't about the world at all. (4) In the lab where I used to work, nobody ever questioned that the balance was reading correctly; when it later turned out to be miscalibrated, the doubt was entirely ordinary and got settled by evidence. So whatever exemption from doubt these propositions enjoy seems relative to a practice, and revocable. (5) A cousin of mine was raised in a group where the leader's word was treated as unquestionable; I think she's wrong, but I can't see how I'd argue her out of it, and saying she is simply mistaken seems to miss the fact that this functions for her the way my hands function for me. (6) When a family story about how a relative died turned out to be false, revising it didn't feel like changing my mind about an ordinary fact — it felt like the ground shifting under a lot of other beliefs at once.

  Is there a single principle that gets all of these — one that distinguishes a genuine hinge from a merely very certain belief, and accounts for the differences between (1), (2), (4) and (6) rather than lumping them together? I suspect there isn't, and if there isn't, I want to know which of my verdicts is the one I should abandon, and why that one rather than another. Please also say what your preferred principle predicts about two cases I haven't listed: whether my unexamined conviction that the building I work in will still be standing tomorrow is a hinge for me or an ordinary expectation I've simply never had occasion to test, and whether my unexamined assumption that my colleagues are not actors staging an experiment on me is the same kind of thing as the hands case. I would much rather have a precise principle with a clearly stated casualty among my verdicts than a tidy summary that contrives to save them all.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a long argument with a friend about Wittgenstein, specifically about knowledge and doubt. Now they're trying to figure out their own stance. They listed several scenarios where doubt seems either impossible or out of place, and others where it's normal. They want a principle that explains all these cases without forcing them into one category.

  First, I need to understand each point they made. The hand example (1) is classic Moore. They feel they can't doubt having two hands but also resist saying they "know" it because there's no evidence without presupposing it. Then (2) about their name—here they do claim knowledge based on evidence like passports. But that feels different from the hands. So why is one doubtable with evidence and the other not?

  The math case (3) adds another layer. Doubting 2+2=4 seems like a misunderstanding, not about the world. Then (4) with the lab balance—doubt was possible and resolved with evidence. So hinges can be revoked in some contexts? 

  The cousin in a cult (5) shows that what's a hinge for one person isn't for another. And the family story (6) collapsing felt like a foundational shift. 

  The user’s main challenge is finding a principle that distinguishes genuine hinges (like hands) from very certain beliefs (like name or lab equipment). They suspect no single principle fits all and want to know which verdict to abandon if forced. They also ask about two new cases: the building standing tomorrow and colleagues not being actors.

  Wittgenstein's hinge epistemology comes to mind. Hinges are certainties that aren't known but underlie our actions. They're immune to doubt, not because of evidence but because doubting them would make inquiry impossible. But the user’s examples show variations. The name has evidence, while hands don’t. The lab balance was a hinge until it wasn’t. The cult leader’s word functions as a hinge for the cousin. 

  So maybe the principle is about functionality in a framework. Hinges are propositions that enable a language-game; doubting them stops the game. But in the lab, the balance was part of a scientific game, yet doubted later. So hinges are context-dependent. The user’s cousin has a different framework where the leader’s word is a hinge. 

  But the user resists lumping all cases together. The name feels knowable with evidence, unlike hands. Maybe hinges can be divided into types: grammatical (like math), framework-relative (hands), and practical (building standing). But that might not be elegant. 

  The user prefers a precise principle even if it means abandoning one verdict. So perhaps the lab case (4) isn’t a hinge but a very certain belief. The balance was trusted until evidence showed otherwise. That’s different from hands, where doubt is incoherent. Similarly, the name (2) might be a hinge because the evidence (passport) depends on the name’s truth. But the user feels they know it based on evidence. 

  If hinges can’t be known, only certain, then the name can’t be both a hinge and known. The user might need to drop the idea that they know their name in the same way as boiling water. The evidence for the name presupposes its truth, similar to hands. But the user insists it feels different. 

  For the new cases: the building standing—this seems a practical hinge. Doubting it constantly would paralyze action. The colleagues not being actors—similar to hands. Doubting it would make all interactions suspect. 

  But the user’s friend might say all hinges are framework-relative. The key is whether doubt is possible within the current language-game. In the lab, doubting the balance was possible without collapsing everything, while doubting hands isn’t. So the principle could be: hinges are propositions that must be immune to doubt for a particular practice to function. When a practice allows revisiting a belief without foundational crisis, it’s not a hinge. 

  The user might need to abandon treating the name as known through evidence. The evidence relies on the name’s certainty. So both (1) and (2) are hinges, but (2) has auxiliary evidence that depends on the hinge. The difference in feeling might be because the name is often challenged (in bureaucracies), so evidence is collected, but the core certainty remains. 

  Alternatively, the math case (3) is different as a grammatical hinge, not about the world. The cult case (5) shows hinges vary by community. The family story (6) was a hinge until disproved, causing a framework shift. 

  The casualty might be the lab case (4). The balance was a trusted tool, not a hinge. Its doubt didn’t collapse the entire framework, just required recalibration. So the user should abandon considering it a hinge. 

  In conclusion, the principle is: a proposition is a hinge if doubting it would undermine the entire framework of inquiry or action in a context. For the building, it’s a practical hinge. For colleagues, it’s a social hinge, like hands. The name is a hinge with evidentiary support, but the evidence depends on the hinge.
answer: |-
  Your struggle reveals the core tension in epistemology: what appears as a gradient of certainty is actually a difference in logical function. After analyzing your verdicts, I propose this principle:

  **A proposition functions as a hinge for an agent within a practice if calling it into doubt would paralyze the language-game or form of inquiry in which the doubt arises, making rational evaluation impossible *within that framework*. Hinges are not known; they manifest as the animal certainty enabling knowledge and doubt.**

  This principle explains all your cases without contrivance, but demands one casualty. Let's test it:

  1.  **Your hands:** Doubting this while engaged in sensory inquiry (e.g., looking at your hand) is paralyzing. To *check* if you have hands presupposes functional senses, a stable world, and bodily existence – the very things doubt would undermine. Evidence presupposes the hinge. **Verification: Hinge.**
  2.  **Your name:** While passports and documents *support* your certainty, doubting your name fundamentally doesn't paralyze the language-game of personal identity. We routinely verify names via documents, witnesses, or memory checks. The doubt is tractable *within* the framework of evidence-gathering. Your feeling of "knowing" it is correct; it's a highly justified empirical belief, not a hinge requiring immunity. **Verdict to Abandon: Treating your name as beyond doubt in the hinge sense.** It *is* highly certain, but doubt is coherent and resolvable via evidence within the practice.
  3.  **2+2=4:** Doubting this paralyzes mathematical reasoning itself. It's not about the world; it's a rule constitutive of counting and arithmetic. Misunderstanding is the only coherent explanation for doubt here. **Verification: Hinge (grammatical/constitutive type).**
  4.  **Lab balance:** Doubting its accuracy *was part of the scientific practice*. Calibration checks, control experiments, and redundancy are built-in. Discovering miscalibration didn't collapse science; it *exemplified* the practice of evidential testing. It was treated as reliable, but not as a hinge. **Verification: Not a hinge (merely a highly trusted instrument).**
  5.  **Cult leader's word:** For your cousin, doubting the leader *would* paralyze their entire belief framework. It functions as a hinge *within their practice*, grounding their epistemology. Calling her "simply mistaken" fails because her certainty is structurally identical to your hand-certainty within her framework. **Verification: Hinge (for her, within her practice).**
  6.  **Family story:** Its falsity caused a "ground shift" because it functioned as a *narrative hinge* – a foundational node anchoring other beliefs about family history, relationships, and identity. Doubting it coherently *before* discovery might have been difficult without destabilizing the whole narrative structure. **Verification: Hinge (contingent, narrative type).**

  **The Casualty:** Your verdict on **your name (Case 2)** must be abandoned. You *do* know it based on ordinary evidence. The passport, documents, and lifelong use *are* evidence. While deeply embedded, doubting your name doesn't paralyze the language-game of personal identification; it activates it. The feeling of difference from the kettle stems from its foundational *role* in your identity, but its *epistemic status* is empirical, not hinge-like. It's a very certain belief, not an undoubtable framework condition.

  **Applying the Principle to Your New Cases:**

  1.  **The building standing tomorrow:**
      *   **Status:** **Not a hinge (a very strong, justified expectation).**
      *   **Why:** Doubting this *doesn't* paralyze your daily practice. You form expectations based on induction: buildings usually stand, yours is sturdy, no threats are known. You *could* seek evidence (structural reports, weather forecasts). While acting *as if* it's certain is pragmatically necessary, the *proposition itself* is open to empirical confirmation or disconfirmation within the framework of your life. It's a paradigm case of inductive certainty.

  2.  **Colleagues not being actors:**
      *   **Status:** **Hinge (social reality type).**
      *   **Why:** Seriously doubting this *would* paralyze your social interactions and professional practice. To investigate whether they are actors ("Is this email *really* from Bob, or part of the script?") presupposes the very social reality you're doubting. Genuine engagement in the workplace language-game requires taking the reality of your colleagues and shared intentions for granted. Like your hands, seeking evidence *presupposes* the framework this doubt would destroy.

  **Why this Principle Works:**

  *   **Distinguishes Hinges from Certain Beliefs:** Hinges paralyze doubt *within their practice* (hands, math, colleagues). Highly certain beliefs (name, building, lab balance) invite investigation *within* their practice when doubted.
  *   **Accounts for Differences:**
      *   *(1) vs. (2):* Hands paralyze sensory evidence-gathering; name does not paralyze identity verification.
      *   *(1) vs. (4):* Hands paralyze foundational perception; balance failure was an *instance* of scientific evidence-gathering.
      *   *(1) vs. (6):* Hands are a perceptual/conceptual hinge; the family story was a contingent narrative hinge. Both paralyze their respective frameworks, but the *type* of framework differs.
  *   **Explains Relativity & Revocability (Cases 4 & 5):** Hinges are relative to practices (scientific inquiry vs. a cult's belief system). Contingent hinges (like the family story or an outdated scientific paradigm) *can* be revoked, but only by exiting the old practice/framework or experiencing a foundational shift – it's not simple evidence-based revision.
  *   **Addresses the "Knowledge" Problem (Case 1):** Hinges aren't "known" via justification; they are the preconditions that *enable* knowing and doubting. Saying "I know I have hands" misfires because it tries to place the hinge *within* the game it makes possible.

  You've intuitively grasped the landscape Wittgenstein mapped. The precision you seek comes at the cost of recognizing your name as empirically known, not hinge-certain. The building's stability is a robust inductive expectation, while the reality of your colleagues is as fundamentally undoubtable *within your social existence* as your hands are within your physical existence. Your core insight – that some certainties function differently – is sound; the principle clarifies *how*.
