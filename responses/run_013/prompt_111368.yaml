  We are drafting a joint statement for an adversarial collaboration between two positions on the grounding of meaning in cognitive systems and AI. The two positions are:

  Position A (Representationalist/Grounding via Sensorimotor Contact): 
    Cognition relies on internal representations. Symbols gain meaning by being ultimately grounded in non-symbolic, sensorimotor representations. A system that only manipulates symbols derived from other symbols (without such grounding) is ungrounded.

  Position B (Embodied/Situated Cognition): 
    The representationalist picture is mistaken. Meaning is not in the head but arises from situated, embodied, and socially scaffolded interactions. The symbol grounding problem is a pseudo-problem because it assumes internal representations. A text-only model is ungrounded because it lacks the necessary embodied interaction, not because it lacks internal sensorimotor representations.

  We aim to state agreed-upon claims, surviving disagreements, and cruxes with testable predictions.

  ## 1. Agreed-Upon Claims (What the Thing to Be Explained Is)

  Both sides agree on the following:

  1. **The Phenomenon to be Explained**: We are trying to explain how systems (biological or artificial) can exhibit intelligent behavior that appears to be meaningful and can be about the world (i.e., intentionality). This includes the ability to refer to and reason about entities and states of affairs beyond the immediate sensory input.

  2. **Chinese Room Intuition Pumps**: 
     - The Chinese Room thought experiment (Searle) is intended to show that syntactic manipulation alone is insufficient for semantics. 
     - Both sides agree that the Chinese Room does show that a purely symbolic system, without any connection to the world beyond symbols, cannot have genuine understanding. 
     - However, the two sides interpret the implications differently: 
       - For A, the Room lacks grounding in sensorimotor experience.
       - For B, the Room lacks embodied interaction and participation in a form of life.

  3. **What Counts as a Successful Grounding Explanation**: 
     - A successful explanation must account for how a system can have representations (or behaviors) that are about the world and can be said to be true or false, and how these can be acquired and used in a way that is responsive to the environment and the system's goals.
     - Both agree that a system that only processes text (without any non-textual input or output) cannot be grounded in the way required for genuine meaning, regardless of how sophisticated its behavior appears.

  4. **The Limitations of Current Text-Only Models**: 
     - Current large language models (LLMs) that are trained solely on text data, without multimodal or embodied interaction, are ungrounded in a significant sense. They can produce coherent and contextually appropriate text, but they do not have a direct connection to the world that would allow for genuine reference or truth-conditional semantics.

  ## 2. Surviving Disagreements

  The core disagreements are about the nature of meaning and grounding. We phrase each as the respective side would want:

  | Position A (Representationalist)                                                                 | Position B (Embodied/Situated)                                                                 |
  |--------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | **On the nature of meaning**: Meaning arises from internal representations that are causally connected to external reality via sensorimotor processes. Symbols in thought are grounded by being linked (through a chain of causation) to non-symbolic representations formed through perception and action. | **On the nature of meaning**: Meaning is not a property of internal states but emerges from the dynamic interaction between an agent and its environment, including social and cultural practices. Internal representations, if they exist at all, are not the locus of meaning. |
  | **On the symbol grounding problem**: The grounding problem is a real and central issue. A system that only manipulates symbols (like an LLM) is ungrounded because its symbols are not connected to the world via sensorimotor experiences. | **On the symbol grounding problem**: The grounding problem is a pseudo-problem because it presupposes that meaning must be grounded in internal representations. Instead, the problem is that the system is not embedded in an embodied, interactive context. |
  | **On what grounding requires**: Grounding requires that a system has internal states (representations) that are derived from and can causally affect the world through sensorimotor interfaces. | **On what grounding requires**: Grounding requires that the system is an embodied agent engaged in ongoing, adaptive interaction with the world, participating in shared practices. |

  ## 3. Cruxes

  We identify two key cruxes and design cases to test them. Both sides agree on the setup and what would count as evidence.

  ### Crux 1: Is Sensorimotor Contact Sufficient for Grounding, or Is It Just More Representation All the Way Down?

  - **Case**: Consider a robot with a camera and a gripper, connected to a language model (initially trained only on text). The robot is then fine-tuned (via reinforcement learning or supervised learning) on manipulation tasks: it receives visual input and must generate actions (e.g., "pick up the red block"). The system can also describe what it is doing in natural language. After training, the robot can perform tasks and describe them accurately.

    - **Position A's Prediction**: This system is at least partially grounded because the language model's symbols (for objects, colors, actions) are now causally linked to non-symbolic sensory inputs and motor outputs. The grounding is achieved by the sensorimotor interface and the learning process that associates symbols with perceptual features and actions.

    - **Position B's Prediction**: The system is still not grounded. The addition of sensors and effectors does not, by itself, create meaning. Meaning requires that the system is embedded in a broader context of practices, with intrinsic goals and a history of interactions. Without being part of a form of life (e.g., having social interactions, participating in shared activities), the robot's internal states and outputs remain ungrounded. It may behave appropriately but without genuine understanding.

    - **What would count as evidence?**
      - For A: If the system can acquire new concepts through sensorimotor experience (e.g., learning about a new object by interacting with it) and use them appropriately in both action and language, that would support grounding.
      - For B: Even if the system learns from experience, if it cannot participate in open-ended, contextually rich interactions (e.g., understanding a request in a novel social situation) or if its behavior is brittle and lacks the flexibility of a truly situated agent, that would indicate lack of grounding.

  ### Crux 2: Is Grounding a Property of a System or of Its Embedding in a Practice?

  - **Case (Hypothetical Experiment)**: We take two identical systems (robots with cameras and grippers, as in Crux 1). One is deployed in a real-world environment where it interacts with humans in various everyday tasks (e.g., helping in a kitchen, answering questions about what it is doing, following instructions that require understanding context). The other is in a controlled lab, performing the same physical tasks but without any human interaction or social context (only pre-programmed tasks and feedback).

    - **Position A's Prediction**: Both systems are grounded to the same extent because they both have the same internal architecture and sensorimotor connections. The social context may change the complexity of the tasks, but the grounding of basic symbols (like objects and actions) is present in both due to the sensorimotor interface.

    - **Position B's Prediction**: Only the system in the real-world environment (with human interaction and social practices) is grounded. The lab system, despite having sensorimotor capabilities, is not embedded in a practice and thus its actions and language are not meaningful. The social context is constitutive of meaning.

    - **What would count as evidence?**
      - For A: If the lab system can learn and use symbols for objects and actions as effectively as the deployed system (e.g., in terms of accuracy and flexibility in non-social tasks), then grounding is present.
      - For B: If the deployed system shows adaptive behavior in novel social contexts, repairs misunderstandings, and engages in joint activities, while the lab system fails in tasks requiring social understanding (even if it can do the physical tasks), that would support that grounding requires embedding in practices.

  ## 4. Purely Verbal Disagreements

  We acknowledge that part of the dispute is terminological:

  - **On "representation"**: 
    - Position A uses "representation" to denote internal states that stand for external things and are used in cognition.
    - Position B avoids the term or uses it in a deflationary way, emphasizing that representations are not the basis of meaning.

  Both sides agree that if we define "representation" as an internal state that is causally covariant with external features and plays a functional role in guiding behavior, then such states exist. But B denies that these states are the source of meaning.

  - **On "grounding"**: 
    - A defines grounding as a relation between internal symbols and the world via sensorimotor connections.
    - B defines grounding as the condition of being an embodied agent in a social and physical context.

  We agree that these are different concepts. The debate then is which one is necessary and sufficient for meaning.

  ## 5. What Each Side Would Count as Evidence Against Itself

  - **Position A**: If a system without any sensorimotor connection (e.g., a text-only model) could demonstrate the ability to acquire genuine new concepts (not just from text but in a way that shows understanding of the referent) and use them appropriately in reasoning about the world, that would challenge A. Also, if a system with rich sensorimotor capabilities still failed to show any signs of grounded meaning (e.g., could not learn from experience to correct its symbols) that would be problematic.

  - **Position B**: If a system that is not embodied and not embedded in social practices (e.g., a purely virtual agent in a simulated environment with no real-world interaction) could exhibit behaviors that are indistinguishable from a truly grounded agent (including flexible adaptation to novel situations and understanding of context) and if this could be achieved without any appeal to embodied interaction, that would challenge B. Also, if an embodied system in a social context still failed to show meaningful behavior, that would be problematic.

  By signing below, we agree to the above characterization of our positions and the experimental tests.

  Signed,

  A: [Your Name, as the research engineer]
  B: [Your Housemate, as the PhD student]

