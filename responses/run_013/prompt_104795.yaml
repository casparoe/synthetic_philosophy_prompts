prompt: |-
  I chair the grant committee of a small foundation that has committed roughly ten researcher-years over three years to the conceptual and institutional design of sortition-based governance. The money is for philosophy, political theory, and institutional design only — none of it for experiments, surveys, field trials, or anything empirical. We are not commissioning a literature survey; we need a defended agenda for where those researcher-years should go. Assume the response has no ability to look anything up, so do not supply citations, reading lists, or the names of specific works.

  Our working prototype, which we expect most of the funded work to bear on, is deliberately non-standard, and I want the agenda to be responsive to its quirks rather than to sortition in the abstract. Picture a Citizens' Review Chamber: about 120 members drawn by stratified random sampling from the adult population, serving staggered two-year terms that are not renewable. Its authority is negative only — it may repeal or suspend existing statutes and regulations by simple majority, but it may not introduce, amend, or draft new legislation. Any repeal it passes must be reconsidered by the ordinary legislature within one year, and the legislature can reinstate the measure only by supermajority. Members deliberate for a fixed number of days and may summon a fixed budget of expert witnesses. Before the vote, every member must file a written rationale, and the rationales are published anonymously afterward. Each of these features is our guess rather than a conclusion, and we are willing to abandon any of them if the conceptual work shows it to be a mistake.

  Which open questions in this area most deserve our money, and in what order? I care less about the list than about the reasoning: for each question, why it is upstream of the others, how tractable it is for theorists with no empirical budget, and what we would have to learn over the next couple of years for it to move up or down the ranking. Weight neglectedness as well — most existing thinking assumes either elected legislatures or assemblies with full law-making power, so tell us where the mismatch between that and a repeal-only chamber leaves us unserved, and where the standard answers transfer cleanly and the neglect is illusory. Make the criteria explicit (importance, tractability, neglectedness, how many other questions depend on the answer), say how you trade them off against one another, and state what evidence or argument would reorder your ranking.

  Take a definite position: make the choices and defend them rather than laying out the options and leaving the ordering to me. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user chairs a grant committee for a foundation focused on sortition-based governance. They've allocated ten researcher-years over three years for conceptual and institutional design work, specifically for a unique Citizens' Review Chamber (CRC) model. This model has several distinctive features: negative-only authority (repeal/suspend statutes), no new legislation creation, staggered two-year non-renewable terms, stratified random sampling of 120 members, mandatory written rationales, expert witness budget, and a requirement that repealed measures be reconsidered by the legislature within a year (with supermajority needed for reinstatement). 

  The user explicitly wants an agenda prioritizing open questions that are:
  - Upstream (foundational to other issues)
  - Tractably answerable through pure theory/philosophy (no empirical work)
  - Genuinely neglected due to their model's uniqueness
  - Weighted by how many other questions depend on them

  They're frustrated by standard sortition literature assuming either full legislative power or elected bodies, so they need gaps exposed by their "repeal-only" design identified. The demand for "no citations or literature surveys" suggests they're deeply familiar with existing work and want fresh, model-specific thinking. 

  Hmm... their prototype is deliberately non-standard, so the agenda must stress-test *their specific quirks*: 
  - How does negative-only authority change deliberative dynamics vs. proactive bodies? 
  - Does the legislature's supermajority reinstatement power create perverse incentives? 
  - Are non-renewable terms sufficient against capture if membership turns over completely? 
  - Is 120 members optimal for repeal decisions (unlike drafting)? 

  The biggest risk is funding questions that *seem* unique but actually have transferable answers from standard models. Need to flag where analogies hold (e.g., stratified sampling ethics) vs. where they break (e.g., legitimacy of veto power without creative capacity). 

  Prioritization must balance: 
  - **Importance:** If wrong, could cripple the whole model (e.g., if rationales enable voter coercion). 
  - **Tractability:** Can theorize with existing tools? (e.g., game theory for strategic repeal). 
  - **Neglectedness:** Unique to negative power? (e.g., repeal targets as focal points). 
  - **Leverage:** Unlocks other issues? (e.g., authority scope defines accountability needs). 

  Top questions should avoid "obvious" sortition debates (e.g., descriptive representation) unless the CRC's constraints twist them fundamentally. For example: 
  - Not "How ensure diversity?" (standard) but "Does repeal-only authority reduce diversity requirements?" (novel). 
  - Not "Prevent elite capture?" (standard) but "Can expert witnesses dominate a body with no agenda-setting power?" (novel). 

  The user’s tone is no-nonsense—they’ll dismiss woolly "further research needed" proposals. Every ranked item must justify why it’s *their* money and *now*. 

  ...Time to map their prototype’s quirks against potential failure modes. The repeal-legislature feedback loop feels especially undertheorized: 
  - Could the CRC become a "scapegoat" for unpopular laws legislators want repealed but can’t vote for? 
  - Would rationales be weaponized if published anonymously? (e.g., "CRC member hates small businesses" attack ads). 

  Also, the fixed deliberation days + expert budget might create rush-to-judgment risks. Theorists should model if this favors simple repeals (culture-war symbols) over complex regulatory ones. 

  Most neglected? Probably the *interaction effects*: 
  - Non-renewable terms + published rationales = No accountability for bad rationales? 
  - Stratified sampling + negative power = Over-represented groups vetoing laws that underpin their privileges? 

  Final hierarchy must put systemic viability questions first (e.g., "Does this design collapse logically?") before optimizations (e.g., "Best rationale format?"). If the core mechanics are flawed, nothing else matters.
answer: |-
  The most urgent open questions for your Citizens' Review Chamber (CRC), ranked by importance, tractability for pure theory, neglectedness due to its repeal-only authority, and leverage over other design choices, are:

  1.  **Does the CRC's *negative-only* authority fundamentally undermine its legitimacy or effectiveness?** *Why first:* This is the *most distinctive and high-stakes* feature. If negative power inherently cripples deliberative quality, incentivizes reckless repeals, or delegitimizes the body by making it purely destructive, the entire model fails. *Tractability:* Theorists can analyze legitimacy frameworks (input/output legitimacy), compare veto players in political systems, and model strategic incentives (e.g., CRC as "blame avoidance" tool for legislators). *Neglectedness:* Vast majority of sortition literature assumes agenda-setting or positive lawmaking power; a purely negative, citizen-led body is novel. *Leverage:* Answers dictate if the core concept is viable, impacting all other design choices. *Move up/down:* Evidence that negative-only bodies historically caused systemic instability, or a compelling theoretical argument that veto power without creative capacity is inherently illegitimate, would elevate it. Finding robust analogies (e.g., constitutional courts with strong review) could lower it.

  2.  **What constitutes a "rational basis" for repeal decisions under this model, and how do mandatory rationales and expert witnesses shape this?** *Why second:* The CRC's power hinges on the quality and defensibility of its repeal decisions. Mandatory rationales are the primary accountability mechanism. *Tractability:* Philosophical work on public reason, epistemic democracy, and the role of expertise vs. lived experience in justifying political decisions. Analyze potential pitfalls: rationales becoming performative, experts dominating deliberation, or rationales enabling post-hoc manipulation. *Neglectedness:* Standard sortition bodies justify *creation*; justifying *destruction* raises unique challenges (e.g., burden of proof, handling unintended consequences of repeal). *Leverage:* Determines the design of rationale requirements, expert interaction protocols, and deliberation structure. *Move up/down:* Discovery that rationale requirements in negative bodies consistently lead to superficiality or coercion would raise it. A strong theory showing rationales effectively channel expertise and public reason despite the negative focus could lower it slightly.

  3.  **How will the dynamic between the CRC and the elected legislature shape strategic behavior and systemic stability?** *Why third:* The "reconsideration with supermajority reinstatement" rule creates a critical feedback loop. *Tractability:* Game theory to model interactions (e.g., legislative anticipation of CRC actions, CRC targeting laws legislators privately dislike, brinkmanship). Political theory on power-sharing between sortition and election. *Neglectedness:* While veto-player dynamics exist, the specific combination of *citizen* veto + *supermajority legislative override* is underexplored. Does the CRC become a tool or a target? *Leverage:* Informs assessment of stability risks, potential for gridlock, and whether the override rule is appropriately calibrated. *Move up/down:* Theoretical models predicting consistent legislative circumvention or dangerous escalation cycles would elevate it. Evidence that similar override mechanisms function smoothly elsewhere could lower it.

  4.  **Does the combination of non-renewable terms, anonymity of rationales, and lack of proactive power adequately mitigate risks of capture, coercion, or poor member performance?** *Why fourth:* These are core anti-corruption/quality features, but their interaction needs scrutiny in this unique context. *Tractability:* Institutional analysis of accountability mechanisms (ex-post rationales vs. ex-post elections), theories of capture (subtle influence vs. bribes), and coercion dynamics (can members be threatened based on *predictable* ideological leans from stratification?). *Neglectedness:* Capture/coercion literature often focuses on bodies with positive power or longer-term members. Anonymity *post-decision* is unusual; does it enable free deliberation or reduce accountability? *Leverage:* Affirms or challenges key safeguards. *Move up/down:* Discovery of novel vectors for influencing a one-term, negative-only body, or proof that anonymity fatally weakens public accountability, would raise it. Strong arguments that repeal power inherently reduces corrupt incentives could lower it.

  5.  **Is stratified random sampling necessary or justified for a body with *only* negative authority, compared to pure lottery?** *Why fifth:* Stratification is complex and potentially contentious. Does the CRC's specific function change the case for descriptive representation? *Tractability:* Philosophical debate on representation: Is mirroring the populace essential for legitimacy in *repealing* laws, or is a "neutral" lottery sufficient? Does negative power alter perceived fairness needs? *Neglectedness:* Stratification is often assumed, but its justification for a veto body hasn't been deeply examined. *Leverage:* Impacts member selection complexity and perceived legitimacy. Low leverage as other questions are more systemic. *Move up/down:* If legitimacy arguments for the CRC (#1) critically depend on descriptive accuracy, it rises. If pure lottery is shown theoretically sufficient for veto legitimacy, it falls.

  **Trade-offs & Criteria Weighting:** I prioritized systemic viability (#1, #3) and core legitimacy/output quality (#2) over operational safeguards (#4) and selection mechanics (#5). Importance and potential for catastrophic failure trumped neglectedness. Tractability was high for all, relying on political philosophy, democratic theory, and institutional analysis. Neglectedness was highest for questions directly stemming from the negative-only power (#1, #2, #3). Leverage was paramount for #1 and #2.

  **Evidence for Re-ranking:** Theoretical work revealing fundamental contradictions in the CRC concept would push #1 higher. Concrete evidence (historical or comparative) of negative-only citizen bodies failing would elevate #1 or #3. Strong arguments showing repeal rationales inevitably become incoherent or manipulative would boost #2. Novel models predicting easy legislative subversion of the CRC would lift #3. Discovery of unique corruption vectors in short-term veto bodies would raise #4.
