answer: |-
  Below is a concise decision tree structured to help ML engineers map their views on embedding ethics in AI systems. It starts with the locus of ethical content, then branches through key conceptual splits, avoiding philosophical jargon. Each node is a self-contained question. Leaves name established positions where possible, note "unnamed" combinations, and specify the hardest commitment to defend for each. Empty combinations are flagged as **unattractive**, **incoherent**, or **unexplored**.

  ### Decision Tree: Where Do You Stand on Ethics in AI?

  **Start → Q1: Where does the ethical content primarily reside?**  
  - **A. In the system’s runtime computations**  
    → *Q2: Is the system a moral agent (responsible for decisions) or a tool?*  
    - **Agent**  
      → *Q3: How should it handle moral uncertainty?*  
      - **Commit to one theory**  
        → *Q4: Rule-based constraints or outcome optimization?*  
        - **Rules:** 🍂 **Hard-coded constraints**  
          *Hardest to defend: Resolving rule conflicts without arbitrary choices.*  
        - **Outcomes:** 🍂 **Consequentialist reward specification**  
          *Hardest to defend: Avoiding reward hacking when optimizing complex objectives.*  
      - **Hedge across theories:** 🍂 **Hedging ensemble**  
        *Hardest to defend: Aggregating conflicting moral frameworks coherently.*  
      - **Defer to humans:** 🍂 **Deference to human oversight**  
        *Hardest to defend: Slow or biased human input in high-stakes scenarios.*  
    - **Tool**  
      → 🍂 **"Just a tool" (ethics in user intent)**  
      *Hardest to defend: Handling edge cases where user intent is unethical or ambiguous.*  
  - **B. In the training distribution/data**  
    → *Q3: What learning objective instills ethics?*  
    - **Imitate human behavior:** 🍂 **Imitation learning**  
      *Hardest to defend: Perpetuating biases or immoral behaviors in training data.*  
    - **Optimize human feedback:** 🍂 **Human-feedback learning (e.g., RLHF)**  
      *Hardest to defend: Feedback misalignment with long-term or group welfare.*  
    - **Cultivate traits/dispositions:** 🍂 **Character training**  
      *Hardest to defend: Quantifying "virtue" without cultural bias.*  
  - **C. Outside the system (deployer/auditor/regulator)**  
    → 🍂 **Ethics-as-external-audit**  
    *Hardest to defend: Detecting subtle emergent misalignment post-deployment.*  

  ---

  ### Key Notes:
  1. **Indistinguishable Leaves** (same practical implications):  
     - *Hard-coded constraints* (A-agent/rules) ≈ *"Just a tool"* (A-tool) when rules are strict.  
     - *Hedging ensemble* (A-agent/hedge) ≈ *Human-feedback learning* (B) if feedback resolves uncertainty.  

  2. **Empty Combinations & Why**:  
     - **A-agent → Commit → Rules + Defer** (incoherent): Can’t strictly commit to rules while deferring.  
     - **B → Hedge across theories** (unexplored): No methods to train a "moral ensemble" from data.  
     - **C → Moral agent** (unattractive): Contradicts external locus; undermines accountability.  
     - **A-tool → Handle uncertainty** (unattractive): Tools aren’t expected to "decide" under uncertainty.  

  3. **Omitted Splits (for brevity)**:  
     - *Process vs. decisions*: Implicit in **B** (process-focused) vs. **A** (decision-focused).  
     - *Moral patient consideration*: Rarely alters positions; add to any leaf: *"If the system deserves moral consideration, does this approach respect its interests?"*  

  ---

  ### How to Use:
  - Answer **Q1 → Q4** sequentially. Follow the path to your leaf.  
  - For unnamed leaves, your view may be novel or undersupported.  
  - Use "hardest to defend" to stress-test your position.  

  This tree isolates foundational disagreements (e.g., "rules vs consequences" often reduces to inference-time vs. training/data ethics). It prioritizes engineering logic over philosophy, helping teams clarify where their assumptions diverge.
