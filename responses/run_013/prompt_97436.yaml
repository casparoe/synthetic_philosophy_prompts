prompt: |-
  I run the control room at a regional electric utility, and since a near-miss during last summer's heat dome I've been sitting on the ad hoc ethics panel our operations vice-president set up. The case we keep circling is this: when demand outruns supply, we can either shed load deliberately — rolling blackouts that we schedule in advance, which means we knowingly cut power to particular neighborhoods, some of which include customers on home dialysis or oxygen concentrators — or we can let the system ride and risk an uncontrolled, cascading failure that blacks out a far larger area for far longer with no warning to anyone. The engineers treat it as an arithmetic problem, but to me the real question is the difference between a harm I bring about on purpose and a harm I merely let happen. Half the panel says we own whatever we deliberately switch off; the other half says we own the whole collapse if we sit on our hands. I've been using a rule of thumb of my own — roughly, that I may act if the people I hurt would have been hurt anyway, no sooner and no worse, had I done nothing — and I suspect it's too crude, because in the blackout case the customers I cut off might well have kept their power had the grid held.

  What I want from you is a decision procedure the panel and the shift supervisors could actually run, under real time pressure and without a philosophy degree: the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure should simply return a no, and the point at which it has to stop and hand the call to a person because the question is about values rather than facts. These situations come up two or three times a summer, and the shift supervisor has to decide alone in the moment, with the panel only reviewing the call afterward. Please run the procedure on three cases — the rolling blackout; a preemptive shutoff of power to a wildfire-prone area to keep our own lines from starting a fire; and a third that I would expect it to resolve against my instincts, since I would rather know where it bites — and then tell me honestly which steps are judgment calls dressed up as procedure, and where a reasonable operator following it could still go wrong. I'm not looking for reading recommendations; I want something a tired supervisor at three in the morning can actually use.
reasoning: |-
  Okay, let me break down this control room operator's dilemma. They're facing life-or-death grid decisions during emergencies and need a practical decision tool - not philosophy debates. 

  First, the core tension: deliberate harm (rolling blackouts) vs accidental catastrophe (grid collapse). Their current "no sooner/no worse" rule fails because preemptive cuts hurt people who might've survived the uncontrolled outage. 

  I notice three layers to address: the ethical dilemma itself (killing vs letting die), the need for operational clarity (actionable steps under pressure), and blind spot testing (where the tool might contradict their instincts). The wildfire prep case will be crucial for that last part.

  Hmm... the real pain point seems to be decision paralysis during crises. Engineers see math, but operators feel the weight of playing god with neighborhoods. Any procedure must reduce that cognitive load while honoring the moral stakes.

  For structure, I'm considering a flowchart-like sequence: first establish necessity (is action unavoidable?), then compare outcomes (who gets hit how badly?), finally check for "least bad" options. The stopping points should be clear - like when choices involve equally valid but conflicting values.

  Key insights forming:
  - Their existing rule works better for triage (one life vs another) than prevention (harm now to avoid later harm)
  - The "would they be hurt anyway" test needs qualifying with probability thresholds
  - Must distinguish between statistical lives (groups) and identifiable victims (Mrs. Johnson on oxygen in sector 4B)

  For the wildfire case... yes, that's where instincts might protest. Shutting off power to prevent fires sacrifices certain convenience/harm now for uncertain future safety. But statistically, it saves lives. The procedure should force confronting that tradeoff explicitly.

  Biggest risk? Operators might skip steps when rushed. So the questions need to be bulletproof: sequential, yes/no where possible, with clear "abort decision" triggers. Like medical triage protocols.

  Time to draft concrete steps...
answer: |-
  Here's a procedural decision tree designed for shift supervisors under time pressure, grounded in operational ethics and actionable without philosophical training. It prioritizes clarity, defensibility, and harm minimization. The core framework is **Necessity, Proportionality, and Least Harmful Alternative**, with explicit off-ramps for "no action" or "human judgment required."

  ---

  ### **DECISION PROCEDURE: GRID EMERGENCY INTERVENTION**  
  *Use when deliberate action (e.g., load shedding, preemptive shutoff) may cause harm to prevent larger harm.*  
  **Time Limit:** Complete within 15 minutes. Involve one other panel member via call if possible, but proceed solo if not.  

  #### **STEP 1: NECESSITY**  
  *Question: Is inaction certain to cause severe, immediate, and widespread harm (e.g., cascading failure, wildfire ignition)?*  
  - **Sufficient "Yes":** Independent confirmation of both:  
    - Grid/stability metrics exceeding critical thresholds (e.g., frequency decay, line load >115%, fire risk index "Extreme").  
    - No less-harmful mitigation available (e.g., voltage reduction, emergency imports exhausted).  
  - **Sufficient "No":** Return to monitoring. **Procedure returns NO.**  
  - **Uncertain:** Hand to human judgment (review real-time data with senior engineer).  

  #### **STEP 2: PROPORTIONALITY**  
  *Question: Is the harm caused by deliberate action significantly less than the harm of inaction?*  
  - **Assess:**  
    - *Inaction harm:* Estimated geographic scale, duration, and high-risk populations affected (e.g., "500k customers, 72hr outage, 4 hospitals").  
    - *Action harm:* Estimated scale/duration of deliberate cut, confirmed high-risk populations in affected zones (e.g., "10k customers, 2hr outage, 1 dialysis cluster").  
  - **Sufficient "Yes":** Action harm is *quantifiably smaller* (e.g., <20% of inaction’s population impact, <50% duration).  
  - **Sufficient "No":** **Procedure returns NO ACTION.**  
  - **Tie or Uncertainty:** Proceed to Step 3.  

  #### **STEP 3: LEAST HARMFUL ALTERNATIVE**  
  *Question: Is this the option that minimizes *identifiable* harm to vulnerable groups?*  
  - **Checklist:**  
    - Have all lower-impact actions been exhausted (e.g., industrial load curtailment first)?  
    - Does the proposed action avoid critical infrastructure (hospitals, 911 centers, clustered medical users)?  
    - Can warnings be issued to at-risk customers (e.g., 15-min SMS alert to registered medical users)?  
  - **Sufficient "Yes":** All boxes checked. **Proceed to Act.**  
  - **Sufficient "No":** Adjust plan to meet checks OR **Procedure returns NO ACTION.**  
  - **Can’t Avoid Vulnerable Groups:** Hand to human judgment (weigh specific risks).  

  #### **STEP 4: ACCOUNTABILITY**  
  *Before Executing:*  
  1. Document: Time-stamped answers to Steps 1–3, data sources, and any warnings issued.  
  2. Notify: Activate public alert system per protocol.  
  3. Review: Flag action for ethics panel post-event.  

  ---

  ### **APPLICATION TO YOUR CASES**  
  #### **1. Rolling Blackouts (Heat Dome Scenario)**  
  - **Step 1 (Necessity):** Yes. Cascading failure imminent (frequency dropping, reserves depleted).  
  - **Step 2 (Proportionality):** Yes. Deliberate outage: 10k customers, 2 hrs. Inaction: 500k+, days. Harm ratio ~1:50.  
  - **Step 3 (Least Harmful):** *Critical check:* If dialysis cluster can’t be excluded, issue emergency alerts. If alerts feasible → **ACT**. If no alert possible → **Hand to human judgment** (operator must weigh cluster size vs. collapse risk).  
  - **Your Rule’s Flaw:** Correctly flagged—some cut customers *might* have escaped harm in collapse. Procedure addresses this by requiring proportionality (Step 2) and harm minimization (Step 3).  

  #### **2. Preemptive Wildfire Shutoff**  
  - **Step 1 (Necessity):** Yes. Fire risk "Extreme" (dry lightning forecast, 50mph winds). Ignition probability >20% per model.  
  - **Step 2 (Proportionality):** *Tricky:*  
    - Inaction harm: Wildfire could destroy 500+ homes, risk lives.  
    - Action harm: 5k customers lose power for 24hrs (medical risks, economic loss).  
    - **Quantify:** If wildfire probability >15% and expected fatalities >0 → Proportional. Else, not.  
  - **Step 3 (Least Harmful):** Issue 2-hour warning, exclude fire stations. If vulnerable groups present, direct them to shelters. **ACT** if warnings feasible.  
  - **Where It Bites:** Unlike rolling blackouts, harm is *speculative* (wildfire might not ignite). Your instincts may resist "certain harm for uncertain gain." Procedure forces probabilistic threshold (>15% chance of severe harm) to override hesitation.  

  #### **3. Test Case: Voltage Reduction Overload**  
  *Scenario: To avoid load shedding, you can reduce voltage by 8%. This risks damaging sensitive equipment (e.g., ventilators, servers) but avoids blackouts.*  
  - **Step 1 (Necessity):** Yes. Load shedding is only alternative.  
  - **Step 2 (Proportionality):**  
    - Inaction harm: Rolling blackouts to 20k customers.  
    - Action harm: Equipment damage to 500+ medical users.  
    - **Assessment:** If damage risk is high (>10% of devices fail) and life-threatening → Harm may be **worse** than controlled blackouts. **Procedure returns NO ACTION** (opt for load shedding instead).  
  - **Why Against Instincts:** Supervisors often prefer "less visible" voltage cuts over blackouts. Procedure prioritizes *certain harm to vulnerable groups* over diffuse disruption.  

  ---

  ### **HONEST ASSESSMENT OF THE PROCEDURE**  
  #### **Where It’s Judgment Dressed as Procedure**  
  1. **Step 2 Harm Quantification:** Defining "significantly less" harm (e.g., 20% threshold) is arbitrary. A tired operator might misjudge scale.  
  2. **Step 3 Vulnerable Groups:** "Avoid if possible" relies on incomplete data (not all medical users are registered). Judgment call: How hard to search?  
  3. **Probability Estimates** (Wildfire Case): Requiring >15% probability is reasonable but still a guess.  

  #### **Where Operators Could Go Wrong**  
  - **Rushing Step 1:** Ignoring marginal alternatives (e.g., begging imports from neighboring grids).  
  - **Underestimating Step 3:** Failing to check for nursing homes/cell towers due to stress.  
  - **Misapplying Proportionality:** Choosing action for political reasons (e.g., shutting off poor neighborhoods first) despite equal harm.  

  #### **Strengths for 3 AM Use**  
  - **Forces Explicit Comparisons:** Steps 2 and 3 require documenting harm estimates, reducing impulsive decisions.  
  - **Clear Off-Ramps:** "No" at Step 1/2 or "human judgment" at uncertainty points prevent overreach.  
  - **Focus on Identifiable Harm:** Prioritizes protecting *known* vulnerable groups over statistical lives.  

  **Final Advice:** Pair this with a 1-page flowchart (visual > text during emergencies). Train with simulations where Steps 1/2 force "no action" to build comfort with restraint. You own the decision either way—but this ensures you’ve asked the right questions.  

  ---  
  *"Ethics is the art of choosing what you'll regret least."* This procedure makes that regret defensible.
