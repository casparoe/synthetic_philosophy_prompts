prompt: |-
  For a graduate seminar on Moore, I need a problem that cannot be answered by reciting Principia Ethica. In its final chapter, Moore treats the enjoyment of beautiful objects and the pleasures of personal affection as the great goods, while the same book insists that the value of a whole is not the sum of the values of its parts. Assume both doctrines are his, and argue that the second, taken at full strength, makes the first untenable as a ranking of two goods: what the chapter presents as two goods are really one compound good, so that any verdict weighing aesthetic enjoyment against personal affection as independent items is incoherent. I do not want the familiar objection that organic unity is trivial because a whole is just another object with its own value; I want the harder claim that it fuses the two goods. Give the argument as exactly five numbered steps, each one or two sentences, with no introduction and no conclusion, and in each step mark whether you take it to be uncontested exegesis or a contested interpretive move, so that a reader can see where the settled reading of Moore ends and the disputed one begins. Write in American English.
reasoning: |-
  Okay, the user is working on a graduate seminar about G.E. Moore and needs a problem that goes beyond just reciting Principia Ethica. They want me to show how Moore's doctrine of organic unities undermines his ranking of aesthetic enjoyment and personal affection as two separate great goods. Specifically, they want me to argue that these two goods are actually fused into one compound good, making any independent comparison incoherent.

  The user has given very specific instructions: I need to present the argument in exactly five numbered steps, each one or two sentences. I should mark each step as either uncontested exegesis (clearly supported by Moore's text) or a contested interpretive move (where I'm making a logical extension). There should be no introduction or conclusion, and I need to write in American English.

  Hmm, let me think about Moore's principles. In Principia Ethica's final chapter, Moore clearly presents aesthetic enjoyment and personal affection as the two great intrinsic goods. That's straightforward exegesis. But earlier in the book, he insists that "the value of a whole is not the sum of the values of its parts" - meaning organic wholes have emergent value. This is also uncontested Moore doctrine.

  The challenge is connecting these two ideas. If I take organic unity seriously, it should apply to Moore's own examples. When we consider aesthetic enjoyment alongside personal affection in a life worth living, they might form an organic whole whose value isn't just additive. This interpretive move suggests they're not truly separable goods.

  If they form such a compound good, then any attempt to rank them independently becomes problematic. Moore can't consistently claim aesthetic enjoyment is greater than personal affection (or vice versa) when their value emerges from their combination. This fusion idea is where the interpretation becomes contested but logically necessary if we push organic unity to its limits.

  The user specifically wants this "fusion" argument rather than the trivial objection that wholes have their own value. They're looking for a deeper critique showing Moore's system contains this tension. I'll need to be precise in labeling which steps are direct from Moore and which require interpretive leaps.
answer: |-
  Here are the five steps as requested:

  1.  **Uncontested exegesis:** Moore's *Principia Ethica* explicitly identifies the enjoyment of beautiful objects and the pleasures of personal affection as the two greatest intrinsic goods (Final Chapter).
  2.  **Uncontested exegesis:** Moore's doctrine of organic unities, central to *Principia Ethica*, states that the intrinsic value of a complex whole is not necessarily the sum of the intrinsic values of its parts considered separately (e.g., Chapter I, §18).
  3.  **Contested interpretive move:** Applying organic unity rigorously implies that aesthetic enjoyment and personal affection, when co-present within a conscious life (a whole), form a compound good where their combined value is an emergent property irreducible to the simple addition of their individual values.
  4.  **Contested interpretive move:** This emergent value means aesthetic enjoyment and personal affection cannot be treated as truly independent, isolable value-bearers in the context of a complete life; their significance is fundamentally altered by their combination.
  5.  **Contested interpretive move:** Therefore, Moore's ranking of them as distinct, comparable goods is incoherent, as the act of comparing presupposes their independence, which is negated by their fusion into a single organic whole within the relevant evaluative context.
