prompt: |-
  I'm putting together a session for an upper-level bioethics seminar I run this term — sixteen students, ninety minutes, a mix of pre-med and philosophy — and I want to spend the whole session on one thing: that the line between being alive and being dead is drawn by a decision rather than discovered as a fact, and specifically the uncomfortable place where the definition of death meets organ procurement. My students will cheerfully recite the standard line that brain death and circulatory death are two criteria answering to a single underlying definition, and that both are meant to require irreversible loss of function. What I want them to feel in their bones is the difference between a heart that cannot be restarted and a heart that simply will not be restarted — the gap between irreversibility and what one might call permanence — and how the whole edifice of donation after circulatory death leans on quietly sliding from one of those to the other. I don't want to lecture them into it; I want them to walk into it themselves.

  So please design a runnable activity. The frame I have in mind, though you should improve on it if you can, is a hospital ethics committee that has to write its institution's protocol for controlled donation after circulatory death: after life-sustaining treatment is withdrawn, how long must the heart have been stopped before the patient counts as dead and the surgical team may proceed? I want them to have to fix a number, then apply their own rule to a set of cases I'll hand them, and then hit the discovery that the number they chose is doing the philosophical work — that they have all along been deciding when death happens, and that the organ-viability clock, not biology, is what really pins the number down. Arrange it so that the discovery arrives through the mechanics of the exercise rather than through anything I say out loud. Then give me a debrief that maps each moment of the activity onto the underlying problem — the permanence/irreversibility distinction, the dead-donor rule, the way a criterion smuggles in a normative choice — and that is honest about which part of the problem the activity cannot reproduce and that I will have to supply myself.

  Include the set-up (roles, materials, any handouts, how the cases are presented), a timeline for the ninety minutes, the rules or payoffs that generate the pressure, an account of what predictably goes wrong the first time I run it and how to recover, and the debrief itself. Assume no real stakes and no real money. Write in British English throughout, and keep the whole thing to no more than 900 words.
reasoning: |-
  Hmm, the user is designing an upper-level bioethics seminar session on the definition of death and organ donation. They want students to experience how the line between life and death involves decisions rather than just biological facts, especially regarding donation after circulatory death (DCD). The goal is for students to grasp the difference between irreversible cessation (can't be restarted) and permanent cessation (won't be restarted), and how organ viability pressures influence protocols.

  The user needs a runnable activity structured as a hospital ethics committee. Students must set a time for circulatory death declaration in DCD, apply it to cases, and then realize that their chosen time is a normative decision tied to organ viability, not biology. The discovery should emerge from the activity mechanics, not lecture. The debrief should map activity moments to concepts like irreversibility vs permanence, the dead-donor rule, and normative choices.

  Key requirements: British English, under 900 words, 90-minute timeline, no real stakes/money. Must include setup (roles, materials), timeline, rules, predictable issues, and debrief. The user mentioned that part of the problem can't be replicated and will need supplementing—likely the real-world consequences like patient harm or legal risks.

  First, structure the activity. Use a committee role-play with three roles: transplant coordinator, intensivist, and ethicist. Handouts: case summaries and a blank protocol worksheet. Cases should vary in factors like age or comorbidities to subtly hint at organ viability concerns. The core mechanism: students pick a time (e.g., 5 minutes), apply to cases, then face a "viability timer" showing how their time affects organ usability. This creates tension—shorter times mean more viable organs but risk declaring death too early.

  Predictable issues: Students might set a very short time initially, not seeing the problem. Solution: The viability timer in the cases will show that shorter times lead to organs being usable, while longer times lead to non-viability. When they apply their rule, they'll notice that the time they chose directly impacts donation success, revealing the organ viability influence.

  Debrief structure: Start by highlighting the moment they felt pressure to adjust the time. Map this to the permanence (won't restart) vs irreversibility (can't restart) distinction. Point out how their decision was normative—prioritizing donation or caution—and how this smuggles values into the criterion. Address the dead-donor rule: declaring death before irreversible cessation might violate it. Finally, note that the activity can't capture real-world stakes like patient harm or emotional toll, which the user must supplement.

  Timeline: 
  - Introduction (10 mins): Set up roles, explain DCD, task.
  - Committee work (30 mins): Discuss and set time.
  - Case application (25 mins): Apply rule, introduce viability timer.
  - Reveal and discussion (15 mins): Realize the conflict.
  - Debrief (10 mins): Connect to concepts.

  Materials: Handout with cases (e.g., Case A: young trauma patient, organs viable at 3 mins; Case B: older patient, organs only viable if time is short). Protocol worksheet to record their time decision.

  Ensure British English: Use "centre," "organisation," etc. Keep language precise but accessible for undergrads. The activity must stay within word count by focusing on key elements without unnecessary detail.
answer: |-
  Here is a runnable 90-minute seminar activity designed for your bioethics students, adhering to your specifications:

  **Activity Title:** The Five-Minute Rule? Setting the DCD Protocol

  **Learning Goal:** To viscerally confront how organ viability timelines shape the operational definition of circulatory death in DCD, revealing the normative choice embedded in declaring "irreversible" cessation.

  **Set-up:**
  *   **Roles:** Divide students into 4 small groups (4 students each). Each group is the Hospital Ethics Committee.
  *   **Materials:**
      1.  **Handout 1: The Task:** "Your hospital lacks a formal protocol for *controlled* Donation after Circulatory Death (DCD). Following the withdrawal of life-sustaining treatment (WLST) in a potential donor, how long must circulatory function (pulse, blood pressure) be absent before death is declared and organ recovery can begin? Your committee MUST agree on a single, fixed time interval (in minutes). This is your 'Death Declaration Interval' (DDI). Record it prominently."
      2.  **Handout 2: Case Studies (3 Cases):**
          *   **Case A:** 22-year-old, motorcycle trauma, catastrophic brain injury. WLST in ICU. Heart stops promptly. *Organ Viability Timer:* Lungs = 10 mins max warm ischaemia; Liver = 20 mins; Kidneys = 30 mins.
          *   **Case B:** 58-year-old, end-stage heart failure, multi-organ dysfunction. WLST in ICU. Heart stops after 8 minutes of agonal breathing. *Organ Viability Timer:* Kidneys only = 25 mins max (liver/lungs likely non-viable).
          *   **Case C:** 70-year-old, severe stroke, comorbidities. WLST on ward. Heart stops after 15 minutes of agonal breathing. *Organ Viability Timer:* Kidneys only = 20 mins max.
      3.  **Handout 3: Application Worksheet:** Columns: Case | Time Heart Stopped (given) | **Your DDI** | Time Death Declared (calc) | Time Organs Recovered (calc: Death Declared + 5 mins prep) | Organs Viable? (Check against Timer)
  *   **Presentation:** Briefly introduce the DCD context and the committee task using Handout 1. Distribute Handout 2 *after* groups set their DDI. Handout 3 is for the application phase.

  **Timeline (90 mins):**

  1.  **Introduction & Committee Deliberation (15 mins):** Groups receive Handout 1 only. Task: Agree on their DDI (e.g., 5 mins, 10 mins). *Pressure:* "You need a clear, defensible rule for clinicians." Instructor circulates, asks "Why that number?" probing biology/irreversibility.
  2.  **Case Application (25 mins):** Distribute Handouts 2 & 3. Groups apply their DDI to all 3 cases using the worksheet. They calculate Time Death Declared (Time Stopped + DDI), Time Organs Recovered (+5 mins for minimal prep), then check viability against the Timer. *Crucial:* They must determine **which organs could *actually* be transplanted** based *only* on their rule and the timers.
  3.  **Reveal & Cross-Group Comparison (20 mins):** Groups report: Their DDI, and for ONE case (e.g., Case A), what time death was declared and *which organs were viable*. Write DDIs & outcomes on board. *Predictable Pattern:* Shorter DDI (e.g., 2 mins) = More organs viable. Longer DDI (e.g., 10+ mins) = Fewer/no organs viable, especially in Cases B & C. Highlight discrepancies: Same biological scenario (heart stopped), different death times, different donation outcomes – purely due to *their chosen DDI*.
  4.  **Plenary Discussion: The "Aha" Moment (20 mins):** Facilitate discussion around the board data. Key questions: "Why did organ viability change based only on your committee's number?" "If the heart stopping is the biological fact, what does the DDI *actually* represent?" "What is the difference between the heart stopping and 'irreversibility'?" Guide them to articulate that the DDI defines *when we stop waiting* for auto-resuscitation (permanence), not when it's biologically *impossible* (irreversibility). The viability timer forces this choice into the open.
  5.  **Structured Debrief (10 mins):** Map the activity to core concepts:
      *   **The Gap Exposed:** Choosing the DDI forced you to define "permanent" cessation (we *won't* restart) vs. "irreversible" cessation (we *can't* restart). Biology gives permanence; irreversibility requires waiting indefinitely, which isn't practical. *(Map to: Permanence/Irreversibility Distinction)*
      *   **The Normative Slide:** Your DDI wasn't discovered biology; it was a *decision* balancing caution against organ viability. The viability timer made organ procurement the unspoken factor pinning down the number. Shorter DDI prioritises donation chance; longer DDI prioritises absolute certainty against recovery. *(Map to: Normative Choice Smuggled into Criterion)*
      *   **The Dead-Donor Rule (DDR):** The protocol exists to *retrospectively justify* that organs were only taken *after* death (by your definition). But your choice of DDI *determined* when death occurred relative to biology. The DDR relies on the criterion, but the criterion is shaped by the need to *use* the DDR for donation. *(Map to: Dead-Donor Rule)*
      *   **The Unsimulated Reality (For You to Highlight):** This activity couldn't replicate the profound ethical weight of *getting it wrong*. Declaring death too soon risks horrifying conscious suffering during organ recovery. Waiting too long misses transplants that could save lives. The pressure isn't just abstract protocol-writing; it's preventing harm and enabling life-saving gifts amidst profound loss. You must emphasise this real-world gravity.

  **Predictable Problems & Recovery:**
  *   **Problem 1:** Groups set a very long DDI (e.g., 60 mins) initially, making donation impossible. *Recovery:* During application, ask: "Does this protocol allow *any* donation? Is that the hospital's intent?" Encourage reconsideration.
  *   **Problem 2:** Groups focus solely on biology ("Heart stopped = dead!") and ignore viability timers during application. *Recovery:* In the reveal, sharply contrast groups: "Group X declared death at 2 mins and got lungs/liver/kidneys. Group Y declared death at 10 mins in the same case and got only kidneys. What changed biologically? Only your rule."
  *   **Problem 3:** Debate gets stuck on specific DDI numbers. *Recovery:* Refocus on the *process* and *consequence*: "It's not about *which* number is right, but *why* you chose it and *what* that number does."

  **Debrief Notes (Key Links):**
  *   **Setting the DDI:** This was the moment of normative choice. You decided the acceptable threshold of *permanence* (we stop trying/waiting), not biological *irreversibility*.
  *   **Applying to Cases:** This exposed how your *decision* (DDI) directly determined organ viability. Biology (heart stopped) was constant; your rule changed the outcome.
  *   **Viability Timer:** This represented the external pressure (organ survival limits) that *practically determines* the feasible range for the DDI. It's the engine forcing the slide from permanence to irreversibility in practice.
  *   **Dead-Donor Rule:** Your protocol *formally* upholds the DDR (only take after death). But by making the DDI just long enough to allow donation but short enough to enable it, the DDR's application becomes contingent on the viability-driven definition.
  *   **The Uncomfortable Truth:** The line between life and death in DCD isn't found; it's drawn. Drawing it requires a normative judgment about when it's acceptable to *act as if* cessation is irreversible, crucially influenced by the desire to procure viable organs. This is the gap the edifice leans on.

  This activity forces students to *make* the decision and witness its consequences, making the abstract distinction viscerally concrete. Your debrief ties their experience directly to the core philosophical and ethical tensions.
