prompt: |-
  I'm a PhD student in philosophy of mind and I've somehow ended up helping a zoo and aquarium welfare body write their invertebrate inclusion policy — the upshot is they have to make a call, species by species, on which animals get the full welfare apparatus (anaesthesia before killing, enrichment, habitat standards) and which get filed under "probably nobody home" and left out. They keep asking me for "the science" and I keep telling them there isn't a lookup table, so they've asked me for a procedure instead, and honestly they're right to. Write me one: the indicators to check, in what order, what counts as a sufficient answer at each step, where it stops with a no, and where it hands the decision back to a human because what's actually being disputed is a value (how much uncertainty we're willing to tolerate before we protect something) rather than a fact about the animal. The board has to sign off on it and they meet quarterly, so it can't be a research program — it has to be something a smart person with a biology background can run in an afternoon and defend.

  Two things I care about. First, build it so it can handle the access/phenomenal split explicitly: most of the evidence anyone can actually collect is evidence about access-type capacities — integration, global broadcast, flexible control — and the procedure needs to say out loud what it's licensing when it infers phenomenal consciousness from that, and what it does for a species where the two come apart or the access evidence is there but the case for a unified subject is weak. Second, don't let it collapse into a lookup table for the taxa we've all heard about — run it on three cases, including one where it returns an answer that will annoy the people who commissioned it, and be honest about which steps are judgment dressed up as procedure and where the whole thing will misfire. I'd rather they know the soft spots than recieve a clean flowchart that seperates species it has no business seperating.
reasoning: |-
  We are designing a procedure to assess whether an invertebrate species should be included in the full welfare apparatus (implying we treat them as having the capacity for phenomenal consciousness) or not. The procedure must be pragmatic, based on current scientific understanding, and executable by a biologist in an afternoon. It must explicitly handle the access/phenomenal consciousness distinction and avoid being a simple lookup table.

  The key idea is that we use evidence for access consciousness (global workspace, integration, flexible control) as a proxy for phenomenal consciousness, but we acknowledge the gap and build in safeguards. We structure the procedure as a decision tree with clear stopping points and explicit handovers for value judgments.

  **Procedure Structure:**
  1. **Initial Screening (Basic Nervous System):** 
     - Check if the species has a centralized nervous system (e.g., brain or ganglia) or if it is a decentralized nerve net (like in jellyfish). 
     - If decentralized, then stop: no full welfare (unless there is extraordinary evidence to the contrary, which would be rare and would require human judgment).
     - Rationale: Without centralization, the integration required for access consciousness (and by inference, phenomenal) is unlikely.

  2. **Evidence for Access Consciousness:**
     - We look for behavioral and neurological evidence of:
       a. **Sensory Integration:** Can the animal combine information from multiple senses to form a unified representation? (e.g., cross-modal perception)
       b. **Flexible Learning and Problem Solving:** Does it show learning that is context-dependent and not just habituation or simple conditioning? (e.g., operant conditioning with generalization, reversal learning, insight)
       c. **Global Broadcast/Working Memory:** Is there evidence of information being available for use by multiple systems? (e.g., delayed responses, planning, attention)
     - We assign a score for each (0: absent, 1: weak, 2: strong). If the total score is 4 or more, proceed to next step. If 3 or less, stop: no full welfare. 
     - Rationale: These are indicators of access consciousness. We require multiple lines of evidence to avoid over-reliance on one behavior.

  3. **Evidence for a Unified Subject:**
     - We are concerned that access might be distributed without a unified subject (e.g., in some modular systems). We look for:
       a. **Body Ownership:** Does the animal show behavior that suggests a sense of body ownership? (e.g., self-directed behavior, response to bodily damage beyond reflex)
       b. **Behavioral Consistency Across Contexts:** Is there evidence of a consistent "self" making decisions? (e.g., personality traits, consistency in decision-making)
     - If both are absent, we stop: no full welfare. If at least one is present, we proceed.

  4. **Evidence Against Phenomenal Consciousness?**
     - We check for evidence that might dissociate access from phenomenal consciousness in this species. For example:
       - Is there evidence of complex behavior that is entirely driven by reflexes or modular systems without integration? (e.g., some complex behaviors in insects might be explained by innate routines)
       - Is the nervous system structured in a way that might allow for access without phenomenal consciousness? (e.g., highly compartmentalized, no recurrent processing)
     - If such evidence is strong, we flag it for human judgment. Otherwise, we proceed to assign full welfare.

  5. **Handling Uncertainty and Value Judgments:**
     - At any step, if the evidence is ambiguous or there is controversy, we stop and hand over to the board for a value judgment. Specifically, we define a threshold: if the evidence for step 2 (access) is weak (total score 3) but there is some evidence for step 3 (unified subject), then we hand over to the board to decide based on the precautionary principle.

  **Output:**
  - The procedure yields one of three outcomes:
     A. **Include:** Full welfare apparatus applies.
     B. **Exclude:** No full welfare.
     C. **Refer to Board:** The evidence is ambiguous and the decision requires a value judgment about uncertainty.

  **Explicit Handling of Access/Phenomenal Split:**
  - We acknowledge that we are using access consciousness as a proxy for phenomenal consciousness because it is empirically tractable.
  - We explicitly check for evidence that might dissociate the two (step 4) and for evidence of a unified subject (step 3) to mitigate the risk of false positives.

  **Testing the Procedure on Three Cases:**
  1. **Honeybee (Apis mellifera):** 
     - Step 1: Centralized brain (yes).
     - Step 2: 
          a. Sensory Integration: Strong (e.g., cross-modal associations between visual and olfactory cues). Score=2.
          b. Flexible Learning: Strong (e.g., reversal learning, concept learning). Score=2.
          c. Global Broadcast: Strong (e.g., delayed matching-to-sample, communication of complex information). Score=2.
          Total=6 -> Proceed.
     - Step 3: 
          a. Body Ownership: Some evidence (e.g., grooming, response to injury). 
          b. Behavioral Consistency: Yes (e.g., individual foraging strategies). 
          At least one present -> Proceed.
     - Step 4: No strong evidence against phenomenal consciousness.
     - Outcome: Include.

  2. **Giant Pacific Octopus (Enteroctopus dofleini):** 
     - Step 1: Centralized brain (yes).
     - Step 2: 
          a. Sensory Integration: Strong (e.g., integrates visual and tactile). Score=2.
          b. Flexible Learning: Strong (e.g., problem-solving, tool use). Score=2.
          c. Global Broadcast: Strong (e.g., planning, play). Score=2.
          Total=6 -> Proceed.
     - Step 3: 
          a. Body Ownership: Strong (e.g., self-protection, reactions to injury). 
          b. Behavioral Consistency: Strong (individual personalities). 
          -> Proceed.
     - Step 4: No evidence against.
     - Outcome: Include.

  3. **Box Jellyfish (Chironex fleckeri):** 
     - Step 1: Decentralized nerve net (no central brain). 
     - Outcome: Exclude.

  **An Annoying Case:**
     We choose the **American Lobster (Homarus americanus)**. There is controversy because they show complex behaviors but are often treated without anesthesia.

     - Step 1: Centralized nervous system (ganglia, including a brain). Proceed.
     - Step 2:
          a. Sensory Integration: Moderate (e.g., integrates chemical and tactile senses) -> Score=1.
          b. Flexible Learning: Weak (mostly simple conditioning) -> Score=0 or 1? (Let's say 1 for some operant conditioning studies).
          c. Global Broadcast: Weak (no strong evidence of working memory or planning) -> Score=0.
          Total=2 -> Stop: Exclude.

     This might annoy those who point to complex behaviors (like territoriality) and the fact that they avoid noxious stimuli. But the procedure, by requiring evidence of flexible learning and global broadcast, excludes them. However, if the biologist finds stronger evidence (e.g., recent studies on lobster learning), they might score higher and proceed. But with current knowledge, it stops at step 2.

  **Where Judgment is Dressed as Procedure:**
  - The scoring in step 2 is inherently subjective. What counts as "strong" vs. "weak"? We provide guidelines (with examples) but the biologist must use judgment.
  - Step 4 (evidence against) is also judgmental. We rely on the biologist's expertise to know the literature.
  - The handover to the board in the case of ambiguity (e.g., step 2 total=3) is a value judgment about risk tolerance.

  **Where the Procedure Might Misfire:**
  - It might be too conservative for some (like lobsters) and too liberal for others (if we find an insect with strong access but no unified subject, which we then exclude at step 3, but some might argue that any access implies phenomenality).
  - It assumes that centralization is necessary. But what about distributed systems that might achieve integration (e.g., some mollusks without a typical brain)? We have step 1 as a gatekeeper, but we note that extraordinary evidence can override. This is rare and requires board referral.

  **Final Procedure Flowchart:**

  1. **Centralized Nervous System?**
     - No: Exclude (unless extraordinary evidence, then refer to board).
     - Yes: Proceed to 2.

  2. **Access Consciousness Indicators (Score each 0,1,2):**
     - a. Sensory Integration: 
          - 0: No evidence.
          - 1: Some evidence (e.g., basic multisensory responses).
          - 2: Clear evidence of cross-modal integration (e.g., learning in one modality transfers to another).
     - b. Flexible Learning:
          - 0: Only habituation/simple conditioning.
          - 1: Some operant conditioning with generalization.
          - 2: Evidence of complex learning (e.g., reversal learning, insight).
     - c. Global Broadcast:
          - 0: No evidence of working memory/attention.
          - 1: Short-term retention (e.g., delayed response of a few seconds).
          - 2: Clear evidence of planning, attention, or information sharing across systems.
     - Total Score:
          - 0-3: Exclude.
          - 4-6: Proceed to 3.

  3. **Unified Subject Indicators:**
     - a. Body Ownership: 
          - Absent: No self-directed behavior or appropriate response to injury beyond reflex.
          - Present: Evidence of self-protection, grooming, or similar.
     - b. Behavioral Consistency:
          - Absent: Behavior appears entirely context-driven without individual variation.
          - Present: Evidence of consistent individual differences (personality) or decision-making that suggests a unified agent.
     - If both absent: Exclude.
     - If at least one present: Proceed to 4.

  4. **Evidence Against Phenomenal Consciousness?**
     - Check for:
          - Strong evidence that complex behavior is reflexive/modular (e.g., fixed action patterns explain all).
          - Neuroanatomy suggests no capacity for subjective experience (e.g., no recurrent processing, no structures analogous to those supporting consciousness in vertebrates).
     - If strong evidence against: Refer to board (with a recommendation to exclude).
     - Otherwise: Include.

  **Additional Rules:**
  - At any step, if the biologist feels the evidence is ambiguous or controversial, they can refer to the board.
  - If step 2 total is 3, then refer to board (because it's borderline and the value of precaution comes into play).

  **Documentation:**
  - The biologist must document the evidence for each step and the scores assigned.

  This procedure is designed to be transparent about its assumptions and limitations. It explicitly uses access consciousness as a proxy but includes steps to mitigate the risk of false positives (by requiring a unified subject) and false negatives (by having a referral option). It is quick to apply and defensible because it is based on observable criteria and current scientific consensus where available.
answer: |-
  Below is a pragmatic, step-by-step procedure for assessing invertebrate welfare inclusion, designed to be executed by a biologist in a single afternoon. It explicitly addresses the access/phenomenal consciousness split, avoids taxon-based lookup tables, and flags value judgments. The procedure is structured as a decision tree with clear stopping points, evidence requirements, and uncertainty handoffs. It prioritizes empirical accessibility while acknowledging where inference is required.

  ---

  ### **Invertebrate Welfare Inclusion Procedure**
  **Goal**: Determine if a species receives full welfare protections (anesthesia before killing, enrichment, habitat standards) based on evidence of phenomenal consciousness (PC).  
  **Input**: Species-specific data from literature (behavior, neuroanatomy, physiology).  
  **Output**: **Include** (PC likely), **Exclude** (PC unlikely), or **Refer to Board** (ambiguous evidence/value judgment needed).  
  **Timeframe**: 3–4 hours per species (literature review + scoring).  

  ---

  #### **Step 1: Basic Nervous System Assessment**  
  **Question**: Does the species have a **centralized nervous system (CNS)** or brain-like structure?  
  - **Check**: Presence of ganglia, brain lobes, or neural hubs (e.g., insect brain, cephalopod vertical lobe).  
  - **Sufficient Evidence**:  
    - **Yes** (clearly centralized): Proceed to Step 2.  
    - **No** (e.g., diffuse net like cnidarians, ctenophores): → **Exclude**.  
    - **Unclear/Contested** (e.g., echinoderms with ring nerves): → **Refer to Board** (requires neuroanatomical expertise).  
  **Why Stop Here?** Without integration capacity, access consciousness (and thus PC) is implausible.  

  ---

  #### **Step 2: Access Consciousness Indicators**  
  **Question**: Is there evidence of **information integration, global broadcast, or flexible control**?  
  *Rationale: Access consciousness (AC) is tractable and a strong proxy for PC, but not equivalent. We require ≥2 "Strong" indicators.*  
  - **Indicators to Score** (0 = Absent, 1 = Weak, 2 = Strong):  
    - **Sensory Integration**: Cross-modal processing (e.g., combining visual/tactile cues).  
      - *Strong*: Cross-modal learning (e.g., octopus using vision to guide arm exploration).  
      - *Weak*: Basic multisensory response (e.g., antennae reacting to touch + chemical).  
    - **Global Broadcast**: "Workspace" behaviors (e.g., attention, memory access across tasks).  
      - *Strong*: Delayed matching-to-sample (e.g., bees recalling patterns after distraction).  
      - *Weak*: Short-term habituation without context shift.  
    - **Flexible Control**: Goal-directed problem-solving.  
      - *Strong*: Tool use, insight learning (e.g., ants navigating novel mazes).  
      - *Weak*: Fixed action patterns (e.g., stereotyped web-building in spiders).  
  - **Decision**:  
    - **Total Score ≥4** (e.g., two "Strong" + one "Weak"): Proceed to Step 3.  
    - **Total Score 1–3**: → **Exclude** (insufficient AC evidence).  
    - **Total Score 0**: → **Exclude** (no AC indicators).  
  **Value Judgment**: Threshold of "≥4" is conservative; lower thresholds risk overinclusion. Biologist must justify scores with citations.  

  ---

  #### **Step 3: Unified Subject Assessment**  
  **Question**: Is AC coupled with a **unified subject of experience**?  
  *Rationale: AC without a "self" (e.g., modular systems) may lack PC. We look for evidence of centralized agency.*  
  - **Indicators**:  
    - **Body Ownership**: Self-directed behavior (e.g., grooming injured areas, avoiding self-harm).  
    - **Affective Consistency**: Valence-based learning (e.g., trade-offs between reward/risk across contexts).  
  - **Decision**:  
    - **Both Present**: Proceed to Step 4.  
    - **One Present**: → **Refer to Board** (ambiguous PC inference).  
    - **Neither Present**: → **Exclude** (AC may be modular/disunified).  
  **Why This Step?** Addresses the "zombie system" risk (e.g., an insect with AC but no integrated "self").  

  ---

  #### **Step 4: Evidence for PC/AC Dissociation**  
  **Question**: Is there **positive evidence against PC** despite AC?  
  *Rationale: Rules out cases where AC is present but PC is implausible due to neuroanatomy.*  
  - **Check for**:  
    - **Neuroanatomical Mismatch**: No structures for recurrent processing (e.g., no feedback loops).  
    - **Behavioral Automation**: Complex behavior explainable by reflex arcs (e.g., parasitoid wasp host-seeking).  
  - **Decision**:  
    - **Strong Evidence Against PC** (e.g., no recurrent pathways): → **Exclude**.  
    - **No Evidence Against PC**: → **Include**.  
    - **Equivocal**: → **Refer to Board** (e.g., contentious taxa like crustaceans).  
  **Explicit Split Handling**: This step licenses PC inference from AC *only if* no dissociation evidence exists.  

  ---

  #### **Refer to Board Conditions**  
  Hand off if:  
  1. Step 1 anatomy is disputed (e.g., bivalves).  
  2. Step 3 has only one unified subject indicator.  
  3. Step 4 evidence is equivocal.  
  4. Total AC score = 3 (borderline; requires precautionary weighting).  
  **Board Input Needed**: Tolerance for uncertainty (e.g., "Protect if >30% PC likelihood?") or new evidence.  

  ---

  ### **Case Studies (Testing the Procedure)**  
  **1. Honeybee (Apis mellifera)**  
  - **Step 1**: CNS present (brain + ganglia). → Proceed.  
  - **Step 2**:  
    - Sensory Integration: **Strong** (cross-modal odor/visual learning).  
    - Global Broadcast: **Strong** (delayed recall, attention shifts).  
    - Flexible Control: **Strong** (insight in navigation).  
    - **Total = 6** → Proceed.  
  - **Step 3**:  
    - Body Ownership: **Present** (self-grooming, injury avoidance).  
    - Affective Consistency: **Present** (risk-sensitive foraging).  
    → Proceed.  
  - **Step 4**: No dissociation evidence. → **Include**.  
  *Verdict: Correct, but annoys those who view insects as reflexive.*  

  **2. Box Jellyfish (Chironex fleckeri)**  
  - **Step 1**: No CNS (diffuse nerve net). → **Exclude**.  
  *Verdict: Non-controversial exclusion.*  

  **3. Lobster (Homarus americanus)**  
  - **Step 1**: CNS present (decentralized ganglia). → Proceed.  
  - **Step 2**:  
    - Sensory Integration: **Weak** (chemotaxis, no cross-modality).  
    - Global Broadcast: **Weak** (short-term memory only).  
    - Flexible Control: **Weak** (fixed escape responses).  
    - **Total = 3** → **Exclude**.  
  - **Stops Here**: Fails AC threshold.  
  *Verdict: Will annoy advocates (lobsters show nociception), but procedure prioritizes AC rigor over isolated reflexes.*  

  ---

  ### **Weaknesses & Honesty**  
  1. **Judgment Dressed as Procedure**:  
     - AC scoring (Step 2) relies on biologist interpretation (e.g., "Strong" vs. "Weak" learning).  
     - Unified subject indicators (Step 3) are inferential—no direct PC measure exists.  

  2. **Where It Misfires**:  
     - **False Negatives**: Species with PC but minimal AC (e.g., if PC exists without integration).  
     - **Anomalies**: Cephalopods (strong AC/unified self) pass easily; borderline cases (e.g., crabs) often referred.  
     - **Value-Laden Stops**: Exclusions at Step 2 (AC score 1–3) prioritize certainty over precaution.  

  3. **Access/Phenomenal Split**:  
     - The procedure licenses PC *only if* AC indicators converge *and* a unified self is plausible (Steps 2–4). It explicitly states:  
       > *"AC evidence supports PC inference when no dissociation exists, but PC cannot be confirmed without a unified subject."*  

  **Recommendation to Board**: Adopt a **precautionary principle** for referred species (e.g., "Include if Step 3 has one indicator"). Update every 3 years as science evolves.  

  ---  
  This procedure balances empirical pragmatism with philosophical rigor. It delivers defensible decisions quickly while exposing its own uncertainties—ensuring the board knows where biology ends and values begin.
