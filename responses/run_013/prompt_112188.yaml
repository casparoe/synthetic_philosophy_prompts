prompt: |-
  I am a philosophy professor, and next month I have to run the fourth session of an interdisciplinary workshop on evidence and policy: ninety minutes, about twenty people, a mix of philosophy graduate students who have had a semester of normative ethics and economics and public policy students who do cost-effectiveness analysis for a living. The topic is the problem that has come to be called cluelessness: the thought that a consequentialist theory tells us to act for the best, while for the overwhelming majority of our choices there is no defensible way to say which option is best, and not merely in the ordinary sense of being uncertain, but in the sense that there is no principled way to attach probabilities to the downstream consequences or to weigh heterogeneous consequences against one another once they arrive. I have watched this idea fail to land twice before: the philosophers hear it as the demandingness objection in a new costume, and the economists hear it as a routine call for more research. I do not want an explanation of cluelessness; I want a plan for the session.

  Give me the order in which the pieces must be introduced, and why each depends on the one before it. In particular, tell me whether the distinction between a criterion of rightness and a decision procedure has to be laid out first or whether the room has to arrive at it themselves, and whether the causal and the evaluative sources of the trouble should be separated at this level or run together for as long as possible and prised apart only at the end. Then tell me the one case that should carry the whole ninety minutes. It needs to be mundane and small in scale, with a first-order effect everyone can see and second-order effects that fan out past any hope of enumeration; it must not be the far-future or existential-risk case, which makes the problem look like the private hobby of a subculture, and it must not be a case with a clean probability distribution, which makes it merely risk. Say what the case must lack as well as what it must have, and if you think the obvious candidates, the charity donation and the butterfly-effect anecdote, are the wrong carriers, say so and say why. Then the misconceptions, in the order the room will actually form them, each with the exact point in the sequence at which I should head it off; I am expecting at least these four: that this is just uncertainty and that Pascal settled it; that it is the demandingness objection or the repugnant conclusion wearing a new hat; that it shows consequentialism to be false, rather than showing something about the relation between the theory and the agent who must act on it; and that the remedy is more empirical research. Tell me what to leave out at this level and to announce out loud that I am leaving it out. And give me one question to put to the room in the last ten minutes that would reveal whether they have understood the problem rather than merely felt its discomfort.

  Do not hand me a survey of the positions one could take; commit to one and give your reasons. My own inclination, which I want you either to endorse or to overrule, is that cluelessness is a defect in the decision procedure rather than in the criterion of rightness, and that the session should land on that distinction rather than on any verdict about consequentialism itself. Tell me where I am wrong. End with a final line beginning Verdict: that states in one sentence the position the session is designed to land.
reasoning: |-
  Okay, the user is a philosophy professor preparing for a workshop on cluelessness in consequentialism. They've run into issues where philosophers see it as demandingness and economists dismiss it as needing more research. The key is to make the problem tangible without using future risks or clean probabilities. 

  First, I need to structure the session so the distinction between criterion of rightness and decision procedure emerges naturally. Starting with a mundane case is crucial. The coffee shop example seems ideal—it's relatable, has immediate effects, and cascading consequences that are impossible to track. 

  The economists might jump to quantifying the effects, but the point is to show that some consequences resist probabilistic modeling. For philosophers, emphasizing that cluelessness isn't about demandingness but about unknowability will help. 

  The misconceptions need addressing at specific points. When someone mentions Pascal, it's time to clarify that probabilities don't apply here. If they conflate it with demandingness, redirect to evaluative challenges. 

  The final question about the coffee shop decision should reveal if they grasp that the core issue is the separation between criterion and procedure, not just uncertainty. Ending with the verdict that cluelessness challenges the decision procedure, not the criterion, ties it all together.
answer: |-
  Here is a rigorously structured 90-minute session plan designed to force the core problem of cluelessness into sharp relief, tailored to your constraints and goals:

  **Core Structure & Logic:**
  1.  **Start with the Mundane Case (25 min):** *Must precede theory to avoid preconceptions.* Introduce **"The Coffee Shop Choice"**: You have 30 minutes before a crucial meeting. You can (A) Buy coffee at Chain X ($5), (B) Buy coffee at Chain Y ($5), or (C) Skip coffee and donate $5 to a well-vetted local food bank now. First-order effects are clear (caffeine, cost, donation). Second-order effects fan out: Which chain's employee gets a slight morale boost? Whose regional sales data nudges a future hiring/firing decision? Does skipping coffee make you slightly sharper/duller, altering your meeting contribution, affecting colleagues' projects? Does the food bank dollar free up another dollar for advocacy, influencing local policy? Does supporting Chain X over Y (different supply chains) have divergent environmental/economic ripples locally/globally? *Crucially Lacks:* Any obvious dominant option on consequentialist grounds, any available probability distribution for downstream effects, any common metric for comparing "employee morale ripple" vs. "slightly better meeting" vs. "micro environmental impact" vs. "indirect policy influence".

  2.  **Force Consequentialist Engagement (15 min):** *Requires the case to be concrete.* Task: "In pairs (mix disciplines), argue for *one* option being *best* from a purely consequentialist perspective – maximize overall good. You must consider effects beyond the immediate 30 mins." Observe and note common strategies (focusing on tangible first-order, arbitrary weighting, ignoring long-tail, giving up).

  3.  **Surface the Impasse & Diagnose (20 min):** *Depends on the failed exercise.* Debrief: "What made choosing the *best* option impossible?" Guide discussion to identify TWO SOURCES RUN TOGETHER:
      *   **Causal Cluelessness:** We cannot trace or predict the vast causal chains (Who gets promoted because of that sale? Does your meeting spark innovation or disaster?).
      *   **Evaluative Cluelessness:** Even *if* we knew the effects, how do we compare/weight them? (Is a tiny decrease in local air pollution better or worse than a slight increase in a distant worker's job security?).
      *   **Head Off Misconception 1 (Uncertainty/Pascal):** The moment someone says "It's just risk, assign probabilities," intervene: "What probability that buying at X leads to net good vs. Y vs. donating? *What principle* determines that probability? Is it quantifiable uncertainty or radical ignorance?" Emphasize the *lack of a principled basis* for probabilities here.
      *   **Head Off Misconception 2 (Demandingness/Repugnance):** If philosophers go here: "Is the problem that Chain X is *too hard* to choose, or that we *fundamentally cannot know* if it's better? Is it about overwhelming options or unknowable outcomes? Is it about demanding sacrifice or being lost in the dark?"

  4.  **Introduce the Crucial Distinction: Criterion vs. Procedure (15 min):** *Depends on recognizing the impasse.* Explicitly define:
      *   **Criterion of Rightness (CR):** What *ultimately makes* an act right? (e.g., Act-Consequentialism: Maximizes actual good).
      *   **Decision Procedure (DP):** What *method* should an agent *use* to try to act rightly? (e.g., Follow commonsense rules, maximize expected utility).
      *   **The Cluelessness Problem:** The CR (max actual good) is well-defined *in theory*. The DP is crippled because the agent cannot access the information needed to apply the CR directly, nor find a reliable proxy, due to causal/evaluative cluelessness. *This is the core revelation.*

  5.  **Clarify & Defuse Misconceptions (10 min):**
      *   **Head Off Misconception 3 (Falsifies Consequentialism):** "Does cluelessness show maximizing good is *not* the right-making feature? Or does it show that *acting on that knowledge* is often impossible for limited agents? The problem is the *agent-theory gap*, not necessarily the theory itself in the abstract."
      *   **Head Off Misconception 4 (More Research):** Economists will suggest this. "Will better data *solve* the coffee shop problem? Can we ever map *all* downstream effects? Can research resolve how to weight incommensurable goods? This isn't a data gap; it's a fundamental epistemic and normative limitation for the acting agent."

  6.  **The Revealing Question (5 min):** Pose: **"For the coffee shop choice, *according to Act-Consequentialism's CR*, is there a fact of the matter about which option is actually best? Given the cluelessness problem, what kind of DP *could* an agent reasonably use to try to act rightly?"** A good answer acknowledges: *Yes*, there is (likely) a fact of the matter under the CR (even if unknowable), but the agent needs a DP *other than* "calculate total consequences" (e.g., follow rules of thumb, minimize salient harm, maximize expected value based on *tractable* consequences).

  **Why This Order Works:**
  *   **Case First:** Avoids theoretical baggage. The mundane case makes the problem visceral and undeniable for *all*, bypassing dismissals like "only for big futures."
  *   **Impasse Before Theory:** Participants *feel* the cluelessness before having labels for it, making the subsequent distinction (CR/DP) a solution to *their* experienced problem.
  *   **Causal/Evaluative Together:** Separating them too early is artificial; the case shows they intertwine (unknown effects *and* unknown weights). The combined impasse is the key experience.
  *   **Distinction Explicitly Introduced:** Waiting for them to "discover" CR/DP risks missing it entirely. Introduce it as the analytical tool to *make sense* of their frustration.
  *   **Misconceptions Addressed In Situ:** Counter them as they naturally arise during the case debrief and distinction explanation.

  **What to Explicitly Leave Out (Announce This):**
  *   "We are leaving aside *responses* to cluelessness (e.g., rule-consequentialism, satisficing, epistemic constraints) and *verdicts* on consequentialism itself. Focus today is solely on *diagnosing the problem*: the crippling gap between the CR and a feasible DP caused by cluelessness."
  *   Also explicitly avoid: Existential risk, charity comparisons (too loaded/abstract), butterfly effect (trivialized as chaos theory).

  **Endorsing Your Inclination (With Nuance):**
  Your instinct is correct: **Cluelessness is primarily a defect in the decision procedure accessible to the agent, not in the criterion of rightness itself.** The CR (maximize actual good) remains conceptually coherent *as a standard*, even if agents cannot reliably apply it. The core problem is the *practical impossibility* of constructing a DP that reliably tracks the CR due to epistemic limitations. However, emphasizing this distinction *does* indirectly highlight a potential weakness in *act-consequentialism as a guide to action*, even if it doesn't falsify the CR abstractly. The session lands on the *existence and nature of this gap*.

  **Verdict:** Cluelessness exposes a fundamental disconnect between consequentialism's criterion of rightness (maximizing actual value) and any feasible decision procedure available to limited agents, arising from intractable causal and evaluative uncertainties inherent in real-world choice.
