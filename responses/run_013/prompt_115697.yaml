prompt: |-
  Hi — hoping someone who does philosophy for a living can help me pin something down. I read ethics on the side (engineer by trade) and there's a shape of thing I keep running into that I don't have a name for, and I've got a nagging feeling I'm actually looking at two or three different things that happen to look alike.

  The shape: someone does the right thing, but the reason they do it makes it worse, and not because the reason is a bad one. My brother took two days off work to help me move flats. If you'd asked him why, he'd have said "your my brother, what else was I going to do". Now run the same film again, identical in every outward respect, except this time he'd say "family ought to help each other, and I'd feel awful otherwise". Same days off, same furniture carried. I can't get the second version to come out as the same act, let alone a better one, even though if you showed me only what got done I'd say both of them did the right thing.

  Then it flips on me. I promised a mate I'd look after his dog while he was away. If I do it because I said I would, that seems like the solid version. If I do it because I happen to feel like it that day, that seems flaky — same act again, and now the reason that mentions the obligation is the one that wins. Same shape, opposite verdict, which is the bit that makes me think I've got two things tangled together.

  I know Bernard Williams had an example a bit like this, something about a man who can only save one person and picks his wife, and I know there's a phrase people use about him having one thought more than he should of had — but I don't know whether that phrase names the general thing I'm describing or just his one case. And I'm after the carving more than the label. Is what I'm describing a claim about what makes an act good, or about what it's like to be the one doing it, or about what a theory is entitled to demand of someone? Are those one objection or three? And what do I do with the reply that the theory was never meant to be the thing running through your head while you act — is that a real distinction or a dodge? I've seen that move made in a few arguments now and I can't tell whether it's cheap.

  Please don't just hand me a term. I want to know what the phenomenon is and what it isn't, which of the nearby ideas comes closest and exactly where each one stops fitting, and if nothing fits, coin something and define it.

  Take the role of a philosopher working on normative ethics and moral psychology. Think carefully, and start by brainstorming every candidate concept you can think of before you commit to any of them. Don't give me references or a reading list — I won't chase them up and I'd rather have the reasoning. British English, please.

  After a short prose answer, give me a table with these columns: candidate term or label | the field it comes from (just the area, no citations) | what it claims | how it fits my two cases | where it breaks down | verdict (closest / partial / different thing altogether). Then a JSON object with exactly these fields: best_fit (string), definition (one sentence), what_it_is_not (list of two or three strings), nearest_miss (string), needs_a_new_name (true or false), proposed_name (string or null), proposed_definition (string or null), one_thing_or_two (string).
reasoning: |-
  Hmm, the user is an engineer who reads ethics on the side, and they're grappling with a moral psychology puzzle. They've described two scenarios where identical actions feel morally different based on the agent's reasons, and they're frustrated because the moral valence flips between the cases. They want conceptual clarity, not just labels, and specifically asked for careful dissection rather than citations.

  The core tension they're describing involves the relationship between motivation and moral worth. In the moving case, acting from familial love feels more authentic than acting from duty, while in the dog-sitting case, acting from duty feels more reliable than acting from inclination. This asymmetry suggests we're dealing with at least two distinct phenomena.

  Key concepts to consider:
  - Moral worth (Kant): Fits the dog-sitting case where duty-based motivation is superior, but breaks in the moving case where duty feels cold
  - Motivational externalism: Explains why obligation-citing reasons aren't psychologically necessary in personal relationships
  - Bernard Williams' "one thought too many": Perfectly captures the moving case but doesn't apply to the dog-sitting case
  - Virtue ethics' phronesis: Handles both cases through contextual practical wisdom but remains vague
  - Moral demandingness: Relevant to the theory/psychology distinction but doesn't address the core asymmetry

  The flip between cases reveals a crucial boundary: personal relationships vs. promissory obligations. Williams' objection targets moral theories that demand justification in intimate spheres, while Kantian concerns about caprice apply to commitments requiring stability.

  The theory/psychology distinction ("theories aren't meant to run through your head") is neither cheap nor decisive - it's context-dependent. For institutional roles it might work, but for personal relationships, requiring explicit moral calculus often corrupts the response.

  After mapping concepts in the table, "moral worth" and "one thought too many" emerge as complementary explanations for different contexts. No single term captures both, suggesting a need for precise contextual distinctions rather than a new umbrella term.

  The JSON conclusion should reflect that these are two distinct phenomena united only superficially by their focus on motivation. The moving case concerns psychological appropriateness in personal relationships, while the dog-sitting case concerns reliable discharge of voluntary obligations.
answer: |-
  Right, let's get to grips with this. It's a fascinating puzzle you've hit upon – the *moral texture* of motivation, where identical actions feel different based on the agent's internal reasons, and crucially, that texture seems to flip depending on the context. Forget labels for the moment; let's dissect the phenomena.

  **The Core Phenomenon & Its Layers:**
  1.  **The Action/Reason Asymmetry:** The moral quality or character of an act isn't solely determined by its outward consequences or conformity to a rule; the agent's *reason for acting* fundamentally shapes it, sometimes making an otherwise 'right' act feel worse or better.
  2.  **The Contextual Flip:** The valence of this effect reverses depending on the nature of the relationship or obligation involved.
      *   **Personal/Familial Bonds (Moving Case):** Acting from direct, unmediated affection/relationship ("he's my brother") feels *better*, more authentic. Acting from explicit obligation ("family ought to help") or to avoid guilt feels *worse*, colder, perhaps even alienating – it introduces a moral 'layer' that seems inappropriate for the intimacy of the bond. This aligns strongly with Williams' "one thought too many" (the man saving his wife shouldn't need to justify it on impartial grounds; simply "she's my wife" is sufficient and correct).
      *   **Promissory/Voluntary Commitments (Dog Case):** Acting from recognition of the explicit obligation created by the promise itself ("I said I would") feels *better*, more reliable, trustworthy. Acting solely from transient inclination ("I feel like it today") feels *worse*, flaky, unreliable – it fails to acknowledge the special normative force *of the promise as such*.
  3.  **The Theory/Praxis Question:** Is the problem about what makes an act *morally good* (a normative claim), about the *moral psychology* required for virtuous character (how a good person thinks/feels), or about the *demands moral theories can legitimately place* on agents (meta-ethical)? Your cases suggest it's intertwined: the psychology reveals something about the normative demands *appropriate to the context*, and theories demanding the *wrong kind* of reason in a context (duty in family, whim in promises) seem flawed.

  **The "Theory Running Through Your Head" Dodge:**
  This isn't *always* cheap, but it needs careful handling.
  *   **When it's a Dodge:** If a theory *defines* right action solely by conformity to a rule/duty, but then dismisses the psychological demand to *act for that duty* as irrelevant to the theory's assessment of the *act*, it risks becoming practically inert and psychologically alienating. It severs the crucial link between normative justification and motivation that your cases highlight as morally significant. In the moving case, saying "The theory only says helping is right; it doesn't demand you *think* about duty while lifting the sofa" ignores the *corruption* introduced if you *do* think about duty in that intimate context.
  *   **When it's Legitimate:** Theories often aim to provide *justification*, not a psychological script. For complex decisions (e.g., triage in an emergency), needing conscious deliberation is unavoidable and unproblematic. The objection bites when the theory demands conscious application of its *specific justificatory framework* in contexts where that framework feels intrusive or undermines the very value it's supposed to promote (like familial love).

  **Candidate Concepts Brainstorm & Analysis:**

  | Candidate Term/Label           | Field                     | What it Claims                                                                 | Fits Your Cases?                                                                                                 | Where it Breaks Down                                                                                             | Verdict          |
  | :----------------------------- | :------------------------ | :----------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- | :--------------- |
  | **Moral Worth / Good Will**    | Normative Ethics (Kantian) | An act has moral worth only if done *from duty* (because it's right), not merely *in accordance* with duty. | **Dog Case:** Perfect fit. Acting *from* the duty of promise-keeping has worth; acting from inclination does not. | **Moving Case:** Fails catastrophically. Demands acting from duty where acting from love is clearly superior. Ignores context. | **Partial** (Dog only) |
  | **"One Thought Too Many" (OTT)** | Moral Psychology (Williams) | In deeply personal relationships, justifying actions via impartial moral reasoning introduces an inappropriate, alienating layer; direct personal reasons suffice and are better. | **Moving Case:** Perfect fit. Brother shouldn't need "ought" or guilt; "he's my brother" is sufficient and correct. The explicit duty thought *is* the extra, damaging thought. | **Dog Case:** Doesn't fit or actively opposes. A promise *requires* recognition of the obligation; "I feel like it" lacks this essential thought. | **Partial** (Move only) |
  | **Motivational Externalism**   | Meta-Ethics / Moral Psych. | Recognizing a moral truth/fact (e.g., "I ought to help") does *not* necessarily provide motivation to act on it. Motivation requires a separate desire. | Highlights *why* the brother might *not* be motivated by "family ought to help" without a prior desire/care. Explains gap between duty-statement and action. | Doesn't explain the *negative* value of acting *from* the duty-statement in the moving case, or the *positive* value of acting from it in the dog case. Too broad. | **Partial** (Background) |
  | **Overdemandingness of Morality** | Normative Ethics          | Moral theories are flawed if they demand excessive sacrifices or impose psychologically impossible burdens on agents. | Connects to why demanding explicit duty-thoughts in intimate contexts feels like an *illegitimate burden* (OTT). | Focuses on cost/sacrifice, not the *kind* of reason/motivation. Doesn't address the dog case or the flip. | **Partial** (Move aspect) |
  | **Integrity (Williams)**       | Moral Psychology          | Agents should not be forced to act in ways alien to their deepest projects and commitments; morality shouldn't require radical self-betrayal. | The brother acting from duty rather than love might feel like a betrayal of his authentic self/project of being a brother. | Less directly about the *reason* stated than the underlying commitment. Doesn't capture the dog case requirement. | **Partial** (Move aspect) |
  | **Virtue (Phronesis)**         | Virtue Ethics             | Right action flows from the character (virtues) of the agent, developed through practical wisdom (*phronesis*), which discerns the right thing *for the right reason* in *this* context. | **Best fit potential.** Captures the *context-sensitivity*. The virtuous brother acts lovingly; the virtuous friend acts faithfully. The 'right reason' differs contextually. | Can seem vague; "what would the virtuous agent do/feel?" needs fleshing out. Doesn't *name* the specific asymmetry you pinpoint. | **Closest**       |
  | **Normative Friction/Psychology** | Moral Psychology          | Different types of norms (e.g., obligations of relationship vs. obligations of promise) generate distinct psychological demands and appropriate modes of recognition/motivation. | Directly addresses the flip: relationships demand unmediated care; promises demand explicit fidelity to the obligation. Explains why the 'right reason' differs. | Not a single established term, but describes the phenomenon well. Needs defining. | **Closest** (Describes core) |

  **Synthesis and Answer:**

  ```json
  {
    "best_fit": "Contextually Appropriate Motivational Recognition",
    "definition": "The phenomenon whereby the moral quality or character of an action is significantly shaped by whether the agent's motivating reason aligns with the specific normative demand inherent to the context (e.g., direct care in intimate relationships vs. explicit fidelity to obligation in voluntary commitments), with misalignment diminishing the act's perceived value even when externally correct.",
    "what_it_is_not": ["Moral worth (Kantian sense)", "Simple motivational externalism", "Overdemandingness (solely about cost)"],
    "nearest_miss": "Bernard Williams' 'One Thought Too Many'",
    "proposed_name": null,
    "proposed_definition": null,
    "one_thing_or_two": "Two distinct but related phenomena unified by the core principle of context-dependent motivational appropriateness: 1) The corruption of intimate acts by explicit duty-based motivation (Williams' OTT). 2) The inadequacy of transient inclination for commitment-based obligations."
  }
  ```

  **Reasoning:**

  1.  **Best Fit & Definition:** "Contextually Appropriate Motivational Recognition" captures the essence: the *kind* of reason that is motivationally appropriate (and thus preserves or enhances the moral character of the act) depends entirely on the *nature of the normative context*. Intimate relationships thrive on unmediated care; explicit promises demand recognition of the obligation itself. Failing to recognize this context-sensitivity is the core issue. Virtue ethics (*phronesis*) provides the best existing framework for this, but lacks a specific term for this precise motivational asymmetry.
  2.  **What it is Not:**
      *   **Kantian Moral Worth:** Demands duty as the motivation universally, which fails your moving case spectacularly.
      *   **Simple Motivational Externalism:** Explains why recognizing a duty might not motivate, but doesn't explain why acting *from* it can be *negatively* valued in some contexts and *positively* in others.
      *   **Overdemandingness:** Focuses on excessive cost/sacrifice, not the *inappropriate type* of motivation demanded.
  3.  **Nearest Miss:** Williams' "One Thought Too Many" perfectly diagnoses *one half* of your puzzle (the moving case). It's the most famous articulation of why explicit moral justification can be corrosive in personal contexts, but it doesn't extend to explain why explicit recognition *is* required in contexts like promise-keeping (the dog case).
  4.  **Proposed Name/Definition:** While the phenomenon needs clear description, coining a single new term ("Motivational Contextualism"? "Normative Resonance"?) risks obscuring the complexity or implying a unified theory where the flip suggests distinct demands. The descriptive phrase is clearer for now.
  5.  **One Thing or Two:** The flip is decisive evidence for **two distinct phenomena**:
      *   **Phenomenon A: The Corruption of the Personal by Explicit Morality.** Applying explicit, general duty-based reasoning/motivation to acts grounded in intimate relationships (like family help) introduces an alienating, distancing element. The value lies in the direct, non-moralized care. Williams' OTT is the key concept here.
      *   **Phenomenon B: The Inadequacy of Inclination for Commitment.** Fulfilling voluntary commitments (like promises) requires motivation that acknowledges the *binding nature of the commitment itself*. Acting solely from transient inclination fails to respect the distinct normative force generated by the promise; it makes the act contingent on mood, not fidelity. Kantian concerns about moral worth capture this *for this specific context*.
      They are *related* under the umbrella of "context determines the appropriate motivation," but the *reasons why* explicit duty is bad in A and good in B are different: in A, it corrupts intimacy; in B, inclination undermines reliability and respect for the promissory bond. They are two sides of the coin of context-sensitivity in moral psychology. Your intuition about a "shape" is right – the shared shape is the *dependence of motivational appropriateness on context* – but the specific manifestations (and why they flip) are distinct.
