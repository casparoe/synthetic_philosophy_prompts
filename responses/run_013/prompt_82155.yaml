  Based on your commission's documented pattern and the specific dynamics of the current petition, here's a breakdown of the likely outcome, the underlying rules, and a future test case:

  **Predicted November Decision:**
  *   **Decision:** Move the memorial stone to the museum courtyard and discontinue the annual public reading of names.
  *   **Form:** A compromise resolution framed as "preserving the memory in a more respectful and protected setting while relieving the community of a divisive public ritual."
  *   **Reasoning:** This aligns best with the commission's strongest established rules: protecting the living from harm (Rule 2) and prioritizing the expressed wishes of the primary descendant group *in this specific context* (Rule 3b), while still technically preserving the memorial (avoiding outright removal). The offer of police protection will be seen as insufficient and potentially escalating, while outright removal against the minority family wishes feels too stark after 35 years. Keeping the status quo ignores the active harm and descendant majority request.

  **Candidate Rules Consistent with the Record:**

  1.  **Rule 1: Severity of Wrong:** Memorialize only events involving extreme state-sanctioned brutality, severe intentional harm, or genocide (e.g., Holocaust deportation = yes; Roma expulsion = plaque only; workhouse neglect = no). *Explains away:* 1994 (Roma not seen as severe *enough* for memorial/school), 2001 (workhouse neglect not severe/intentional), 2016 (slave trade *was* severe and intentional harm, justifying commemoration despite descendant protests).
  2.  **Rule 2: Protection of the Living:** Prioritize preventing active harm, social division, or distress to current residents over abstract duties to the dead. *Explains away:* 2009 (sealing files to protect descendants), 1994 (no memorial/school to avoid "organizing around shame" - implying social division), 2016 (school unit approved *despite* protests - harm deemed less than educational value/severity of wrong), *and crucially, the likely 2023 decision*. Weakest on 1987 (no *immediate* living harm cited).
  3.  **Rule 3: Agency of the Wronged/Descendants:**
      *   **3a: Primary Recognition:** Prioritize commemorations demanded by the direct victims or their clearly identified descendant groups. *Explains away:* 1987 (likely initiated/supported by families), 1994 (plaque likely supported), 2016 (school unit *initiated* by historians/educators, *not* descendants of enslaved people? - weak fit). Fails on 2001, 2009 (families denied).
      *   **3b: Veto Power (Harm Focus):** Descendant groups have significant weight, *especially* when arguing that commemoration *causes them present harm*. *Explains away:* 2009 (descendant objection overruled - harm argument *rejected* in favor of protecting the accused's descendants), 2016 (merchants' descendants' protests overruled - their "harm" not deemed equivalent to the gravity). **Strongest fit for *this* petition.**
  4.  **Rule 4: Manageability of Memory:** Commemoration is acceptable only if it doesn't become disruptive, divisive, costly, or attract negative attention *in the present*. *Explains away:* 1994 (avoiding "organizing around shame"), 2009 (avoiding social disruption), 2001 (no ongoing issue), and the likely 2023 decision. Weak on 1987 & 2016 (carried costs/protests).
  5.  **Rule 5: Historical Closure vs. Open Wounds:** Distinguish between "settled" historical wrongs (suitable for controlled commemoration like archives/plaques) and events where active social wounds or unresolved grievances persist (avoid full memorialization that might inflame). *Explains away:* 1987 (Holocaust seen as universally acknowledged wrong, suitable for memorial), 1994 (Roma expulsion as "settled history" - plaque sufficient), 2001 (workhouse as "period harshness"), 2009 (files sealed to prevent *reopening* wounds), 2016 (slave trade as acknowledged historical fact, suitable for education).

  **The Current Petition: Which Rules Turn the Key?**

  *   **Rule 2 (Protection of the Living):** This is paramount. The far-right co-option, defacement, and the argument that the ceremony *itself* is now a source of division and grievance directly trigger this rule. The police offer is seen as a band-aid, not a solution to the underlying social harm.
  *   **Rule 3b (Descendant Veto - Harm Focus):** The majority of the family association explicitly requests removal *due to the harm it now causes*. This gives powerful moral and practical cover to Rule 2.
  *   **Rule 4 (Manageability):** The petition highlights the memorial's *current* unmanageability – vandalism, security costs, hijacking by extremists. Keeping it in the square is now seen as fundamentally unmanageable.
  *   **Rule 5 (Open Wound):** The petition argues the memorial *creates* an open wound (exploited by the far-right) rather than healing one. Moving it to the museum reframes it as "closed" history.

  **Prediction Rationale:**

  *   **Rule 2 & 4 Dominance:** The commission's history shows a clear aversion to current social friction (2009 sealing, 1994 rejection of memorial/school). The active, visible harm (vandalism, far-right presence) makes the status quo untenable under these rules.
  *   **Rule 3b Leverage:** The descendant majority request *due to the harm* is decisive. It overrides the "duty" argument and the minority wish, providing essential justification. The 2016 decision shows the commission *can* override descendants (merchant families), but here the descendants are the *victims*, and their harm argument aligns perfectly with Rules 2 & 4.
  *   **Compromise Culture:** Moving to the museum offers a face-saving solution: the memory is "preserved" (appeasing duty/minority), but the disruptive public element (reading, vulnerable location) is removed (appeasing Rules 2, 3b, 4). It mirrors the 1994 logic: keep the record, but don't let it dominate the public sphere.
  *   **Avoiding Precedent Fear:** They will argue this is unique due to the far-right hijacking and descendant request due to harm, not a general retreat from Holocaust memory. Moving it is framed as adaptation, not erasure.

  **Future Test Case to Disentangle Rules:**

  **Petition:** A request from a recognized indigenous descendant group for a prominent memorial and annual ceremony acknowledging the forced displacement of their ancestors from the city's river valley in the 1850s. The displacement was executed under a dubious "public health order" by the city council of the time, leading to significant death and cultural destruction, but lacked explicit genocidal *intent* (more "clear the land" pragmatism combined with prejudice). The petitioners argue the harm is ongoing (loss of sacred sites, intergenerational trauma). Some current residents (including descendants of the 1850s council members) protest, arguing it was "legal at the time," "not our fault," and that a memorial would be divisive and attract negative attention.

  **How it Separates the Rules:**

  1.  **Severity of Wrong (Rule 1):** Does forced displacement causing death/cultural destruction, even without explicit genocidal intent, reach the threshold? (Unlike the workhouse, but less clear-cut than Holocaust). Decision reveals if "extreme brutality/intent" is key.
  2.  **Protection of the Living (Rule 2):** Does the *potential* for division/protest from some residents outweigh the descendant group's claim of ongoing harm? Contrasts with 2023 where harm was active/violent.
  3.  **Agency of the Wronged (Rule 3a/b):** Does the descendant group's request, as the primary wronged party, carry decisive weight *even if* it might cause some social friction (unlike 2023 where they argued *against* commemoration due to harm)? Tests if Rule 3b (veto due to harm) is the *only* descendant influence, or if Rule 3a (primary recognition) has independent force.
  4.  **Manageability (Rule 4):** Is the *fear* of disruption enough to deny a commemoration requested by descendants? Contrasts with 2023 where disruption was *actual*.
  5.  **Historical Closure (Rule 5):** Is this seen as a "settled" historical wrong (plaque/archive only) or an ongoing injustice demanding active public reckoning (memorial/ceremony)? Tests the closure principle beyond Holocaust/Nazi collaboration.

  This case forces a choice between the gravity of historical impact vs. contemporary comfort, the power of descendant requests *for* commemoration vs. *against* it, and the threshold for "harm" justifying inaction. The 2023 decision likely hinges on Rules 2 & 3b (harm to living/descendants). This future case would reveal if Rule 1 (severity) or Rule 3a (descendant agency for commemoration) can override Rule 4 (manageability/fear of friction) when the harm is claimed by the wronged group as ongoing legacy rather than immediate safety threat.
