prompt: |-
  My writing group hands out a prize every year with one rule I've never liked: novels only. We've had the same outside judge for four years, a poet friend of mine, and the judges record is odd enough that I want a prediction before we sit down. Yes: a novel in verse. Yes: 600 pages of letters, invoices and a bus timetable. Yes: a graphic novel. Yes: a translation of a book whose original nobody has ever managed to produce. No: twelve stories that share a town and three characters. No: a sequence of prose poems with the same narrator running all the way through. No: a memoir with the names changed. No: an unedited diary a woman kept in the 1930s, which two of us genuinely read as a novel and she wouldn't hear of it.

  This year's entry is a 400-page first-person narrative, invented start to finish, one voice, one continuous story, except that the publisher is bringing it out as a memoir -- real name on the cover, subtitle saying it's a true story, and the author won't say the word novel out loud. Does she take it?

  I care less about the yes than about the rule. More than one rule fits everything above, so give me the ones that fit, what each predicts here, which you'd bet on and why, and what entry would best separate them. Also, one of us keeps muttering about family resemblance and I've never known what to do with it -- is that what she's running, and if so does she have any boundary at all, or is it just taste with better manners?
reasoning: |-
  Okay, let me tackle this user's query. They're part of a writing group with a "novels only" prize rule, but the judge's decisions over four years seem inconsistent. The user wants to predict if this year's entry—a fictional narrative marketed as a memoir—will win, but more importantly, they want to understand the underlying rule the judge uses. 

  First, I need to analyze the past decisions. The judge accepted a novel in verse (poetic but unified story), a collage of documents (non-traditional format but cohesive), a graphic novel (visual narrative), and a translation (even if the original isn't available). Rejections include linked short stories (discrete units), prose poems (poetry category), a fictionalized memoir (marketed as non-fiction), and an actual diary (non-fiction, despite some readers seeing it as novel-like). 

  The pattern suggests the judge prioritizes works presented as unified, book-length narratives, regardless of format or medium. The rejections seem to hinge on formal categorization (short stories as separate pieces) or authorial/publisher framing (memoir/diary as non-fiction). 

  For this year's entry—a fictional narrative published as a memoir—the key conflict is between its content (novel-like) and packaging (marketed as truth). If the judge follows Rule 1 (author/publisher framing), it should be rejected. If Rule 2 (structural unity) applies, it should win. The muttering about "family resemblance" might imply a looser, genre-defying approach, but the judge's history suggests they still rely on clear categorization. 

  To test these rules, the user could submit a borderline case: a novel explicitly framed as non-fiction by the author but internally structured as fiction. The outcome would reveal whether packaging or content matters more. 

  The user's deeper need seems to be frustration with subjective rules. They want clarity, fairness, and transparency in judging criteria. Addressing this might involve redefining the prize's rules to align with the group's values, perhaps shifting focus from form to narrative ambition.
answer: |-
  Based on the judge's record, here are the most plausible rules, their predictions for this year's entry, and how to test them:

  **Plausible Rules & Predictions:**

  1.  **Rule: "Book-Length Narrative Unity" (Structural Rule)**
      *   **What it is:** The core requirement is a single, continuous, invented narrative arc presented as a unified book-length work. Format (prose, verse, graphic, epistolary) and medium are irrelevant. Rejections happen when the *structure* is inherently fragmented (short stories, discrete prose poems) or when the *content* is fundamentally non-invented (memoir, diary).
      *   **Fits Past Decisions:**
          *   *Yes:* Verse novel (unified narrative, invented). Collage novel (unified narrative *constructed* from fragments, invented). Graphic novel (unified narrative, invented). Translation (unified narrative, invented).
          *   *No:* Linked stories (inherently fragmented structure). Prose poems (poetic form, potentially fragmented focus). Memoir (non-invented content). Diary (non-invented content & fragmented structure).
      *   **Prediction for This Year (Fictional narrative published as memoir):** **YES.** The *content* is a continuous, invented narrative. The publisher's framing is irrelevant to the work's inherent structure and fictional nature.

  2.  **Rule: "Authorial/Publisher Framing as Fiction/Novel" (Paratextual Rule)**
      *   **What it is:** The key is how the author and publisher *present* the work. It must be explicitly framed as a novel or fiction. The judge defers to the creator's/publication's categorization. Content and structure are secondary to the label.
      *   **Fits Past Decisions:**
          *   *Yes:* Verse novel (framed as novel). Collage novel (likely framed as experimental novel). Graphic novel (framed as novel). Translation (original framed as novel).
          *   *No:* Linked stories (framed as stories). Prose poems (framed as poetry). Memoir (framed as non-fiction). Diary (framed as non-fiction/historical document).
      *   **Prediction for This Year (Fictional narrative published as memoir):** **NO.** The cover uses the author's real name, subtitles it "a true story," and the author refuses to call it a novel. It is explicitly framed as non-fiction/memoir.

  3.  **The "Family Resemblance" Muttering (Wittgensteinian Approach):**
      *   **What it is:** This isn't a single rule, but a way of judging based on overlapping similarities to clear "novel" examples, without a strict definition. It relies on recognizing a cluster of features (narrative, length, invention, character development, etc.). Your colleague is suggesting the judge uses this intuitive method.
      *   **Does it fit?** It *explains* the judge's record: the "Yes" entries share enough novel-like features (extended narrative, invention, character), while the "No" entries lack crucial ones (fragmentation, non-invention, poetic form). It allows for flexibility with format.
      *   **Boundary?** It's *not* just taste with better manners, but it *is* subjective and lacks sharp boundaries. The boundary emerges from comparing the new work to the established "family" of novels. What features are weighted most heavily? (Your judge seems to heavily weight *continuous narrative* and *invention* over *format* and *label*).
      *   **Prediction for This Year:** **Leans YES, but uncertain.** The core *content* (invented, continuous narrative, single voice, book-length) strongly resembles the "novel family," likely outweighing the misleading packaging for a judge prioritizing these features. However, if the "label" feature is given unusual weight in this specific case, it could be a NO. This approach makes prediction hardest.

  **Which Rule Would I Bet On & Why?**

  *   **Bet:** **Rule 1: Book-Length Narrative Unity (Structural Rule).**
  *   **Why:**
      1.  **The "No" on the memoir with changed names is highly telling.** This was invented content packaged *as* memoir. The judge rejected it, suggesting the *framing* (the "memoir" label) overrode the fictional content. This strongly supports the Paratextual Rule (Rule 2).
      2.  **However, the "Yes" to the collage novel (letters, invoices, bus timetable) is equally telling.** This work had non-traditional formatting but was clearly presented *as a novel*. This fits the Paratextual Rule.
      3.  **The "Yes" to the translation without the original reinforces Paratext.** The judge trusts the *framing* of the original as a novel, even without verification.
      4.  **This year's entry is almost the *inverse* of the rejected memoir:** Invented content *deliberately mis-framed* as non-fiction. **Rule 2 (Framing) predicts NO.** Given the judge's consistency in relying on the author/publisher label (accepting things *framed* as novels, rejecting things *framed* as non-fiction even if fictional), this is the most consistent pattern.
      5.  Rule 1 (Structure) is satisfying logically but less consistent with the rejection of the fictionalized memoir. The Family Resemblance approach is too fuzzy to bet on confidently, though it explains the judge's flexibility within their framework.

  **The Best Entry to Separate the Rules:**

  Submit a work that is **structurally a unified, invented, book-length narrative BUT explicitly framed by the author/publisher as non-fiction (e.g., "A True Account" or "Memoir" on the cover, author insists it's factual).**

  *   **Rule 1 (Structure) Predicts:** YES (It *is* a novel in content/structure).
  *   **Rule 2 (Framing) Predicts:** NO (It is *labeled* as non-fiction).
  *   **Family Resemblance:** Leans YES, but the framing might complicate it for some judges.

  **Conclusion on This Year's Entry:**

  *   **Most Likely Prediction (Based on Rule 2 - Framing):** **NO.** The judge has consistently deferred to the authorial/publisher framing. They rejected a fictionalized memoir *framed* as memoir and accepted works explicitly *framed* as novels, even in unusual formats. This entry is explicitly framed as non-fiction ("real name," "true story," author won't say "novel"). **Bet on NO.**
  *   **Family Resemblance:** Leans towards YES due to the strong narrative content, but the explicit non-fiction framing is a powerful counter-feature. It's ambiguous under this approach.
  *   **Rule 1 (Structure):** Would say YES, but the rejection of the other fictionalized memoir undermines this rule's consistency for *this judge*.

  **The Core Issue & "Family Resemblance":**

  Your colleague's muttering about "family resemblance" (from philosopher Ludwig Wittgenstein) is insightful. The judge *isn't* applying a single rigid definition but recognizing things that share overlapping features with paradigmatic novels (long fictional narrative). This explains the flexibility with format. **However, for *this* judge, the "author/publisher framing" feature seems to be a *very* strong, perhaps decisive, feature within that family resemblance cluster.** When the framing clearly says "novel," other experimental features are acceptable. When the framing says "non-fiction," even if the content is fictional, it's rejected. **So yes, it's fundamentally family resemblance, but with a strong, consistent weighting given to the paratextual framing (cover, subtitle, author statements).** The boundary isn't sharp (e.g., would they accept an *unlabeled* manuscript?), but in the cases presented, the framing provides the clearest signal this judge uses.
