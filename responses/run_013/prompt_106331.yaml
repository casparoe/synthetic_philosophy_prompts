  I'm applying for a small AI ethics grant -- three months, me plus one student -- and I need the actual proposal document, so help me turn a half-formed idea into one. The topic is whether RL agents can suffer, with reward signals as the candidate for valence. Every version of this argument I've read stalls in the same place: either you need a theory of consciousness you don't have, or someone says the reward is just a number. My suspicion is that treating reward as valence conflates two things. First, in a standard MDP the zero point of the reward scale is arbitrary -- add a constant to every reward and no optimal policy changes -- so the formalism on its own can't distinguish pain from the mere absence of pleasure, whereas valence seems to need a sign that isnt merely relative to some baseline. Second, a scalar the designer hands the agent to maximize looks structurally different from a signal the agent's own machinery is built to keep within bounds, which is closer to how homeostatic regulation works (the dopamine prediction-error story is the obvious reference point). Write the proposal: the question stated precisely enough to have a determinate answer, why the usual pro and con positions leave it open, a month-by-month plan (conceptual work plus a small toy-agent demo, not a big simulation), and an honest section on what failure would look like, including the possibility that my distinction collapses under pressure. No citations, I'll add those myself.
