prompt: |-
  Alright, I need help building something and I'd rather you think it through properly than wing it, so here's the job. Your role: you're a philosopher of social science who has spent a lot of time in the measurement literature on violence and who knows the long-run-trend debate from both sides, and you're also the person a nervous analyst calls when they suspect the question they've been handed isn't answerable. Start by brainstorming — actually spend some space on it — listing the different things people could mean by "violence" and what each one does to a trend line, before you commit to anything. Then give me the procedure.

  Context: I'm a research analyst at a small policy shop that puts out an annual "state of the world" report, and this year I've somehow ended up with the violence chapter. We have three internal series and they do not line up. (1) A homicide series from a public health database, by country, 1990 to present, which counts intentional injury deaths and includes a category for killings by police. (2) A conflict-deaths series a partner org gives us, 1946 to present, battle deaths plus civilians killed in conflict, with a methodology break in the mid-nineties that nobody can fully explain to me. (3) A "state violence" series our own team compiles from press reports covering about forty countries, very uneven, we don't really trust it. My director wants a headline for the press release: something like "violent deaths per person are down X% since 1990." I suspect we can't say that, or that if we can, it won't mean what the headline will make people think.

  What I need from you: a decision procedure I can actually run, that a junior analyst with no philosophy training could follow, about a page or two, plus a 10-minute version for the press office. It should be a set of questions in order, what counts as a sufficient answer to each, where the procedure just stops and says no we don't publish a number, and where it has to be handed to a person — me, or the director, or a methodologist — because it's a value question wearing a lab coat. For each step tell me whether it's a factual question, a convention we're choosing, or a straight-up value judgement. Constraints: six weeks, two of us, no new data collection, the director signs off on the headline, and the press office will strip whatever we write down to one sentence.

  Then run it on three cases and show your work: (a) a country where homicides per 100,000 fell but total homicides rose, and where there's also an insurgency, so the conflict series and the homicide series are both counting some of the same dead people; (b) famine deaths caused by a blockade — no bullets, deaths by omission, and our series have nowhere to put them; (c) whichever case your procedure handles worst. At least one of the three should come out in a way I won't like — I'd rather find out from you than from a reviewer.

  Two things you don't get to dodge. First, someone on the team keeps insisting that "violence" is a thick ethical concept, i.e. that calling something violence is already a value judgement and not just a description, and I can't refute it, and if it's true my whole chapter is normative rather than empirical. Take a position on that and tell me what it implies for how we word the report. Second, the fact-of-the-matter question: is there a fact about whether violence is declining, independent of the choices we make about what to count and what to divide by? Pick a line, defend it, and tell me what it means for the caveats. Also say something useful about absolute numbers versus per-capita rates — what each is good for, what each misleads about, and the denominator mess (per person, per adult, per person-year-at-risk, prisoners and refugees who aren't in the census). Finish with what the procedure can't do, and give me the exact sentences the report should carry as caveats. Don't hedge everything — where you have to choose, choose and say why.
reasoning: |-
  Hmm, this is a complex request from a policy analyst needing help with a "state of the world" violence report. They're stuck with conflicting data series and want a decision procedure to determine if they can claim "violent deaths per person are down X% since 1990." 

  First, I need to unpack what "violence" actually means here. There are several dimensions to consider: interpersonal violence (like homicides), conflict violence (war deaths), state violence (police killings), and structural violence (like famine deaths from blockades). Each would create different trend lines. For example, homicides might decrease while conflict deaths spike in certain regions, and structural violence often gets completely overlooked in standard datasets.

  The analyst has three problematic data sources: public health homicide data (includes police killings), conflict deaths from a partner org (with unexplained methodology breaks), and their own unreliable state violence series. The core challenge is whether these can be combined meaningfully, especially given double-counting risks (like insurgents appearing in both homicide and conflict data).

  I need to address two philosophical sticking points: First, the "thick concept" argument - yes, "violence" does carry normative weight, but we can isolate descriptive elements for measurement while being transparent about value judgments in categorization. Second, on the "fact-of-the-matter" question - there's no objective violence trend independent of our definitions; the decline narrative depends entirely on what we choose to count and how we normalize it.

  For the decision procedure, I'll structure it as a flowchart with clear stopping points: first verify data coherence (if methodology breaks can't be explained, stop), then check for double-counting (if significant overlap exists and can't be resolved, stop), then handle normalization carefully (per capita rates can mask absolute increases in growing populations). The procedure must flag when ethical judgments are required, like whether blockade-induced famine counts as violence.

  For the test cases: Case A (conflict zone with falling homicide rate but rising total homicides) would likely trigger a stop due to double-counting. Case B (famine deaths) exposes the value judgment about omission vs. commission. Case C (high incarceration societies) shows how our metrics ignore institutionalized violence.

  On absolute vs. per capita rates: Per capita is essential for population-adjusted risk assessment but can obscure absolute suffering in growing populations. We need to report both with clear denominators.

  The caveats must be brutally honest: "Our headline figure excludes structural and institutional violence" and "Comparisons across periods involve value-based classifications." The press office will hate this, but it's necessary.

  Ultimately, I'll recommend against a single percentage headline. The procedure will likely stop at multiple points given their data limitations. Better to present disaggregated trends with clear explanations than force a misleading synthesis.
answer: |-
  Here is a decision procedure designed for practical use, followed by analysis of your cases, philosophical positions, and essential caveats. The procedure focuses on **feasibility**, **transparency**, and **stopping rules** to prevent overclaiming.

  ---

  ### **Decision Procedure: "Can We Publish a Headline Trend?"**  
  *(For Junior Analyst — Follow Steps Sequentially)*

  1.  **QUESTION: Do all relevant series cover the SAME GEOGRAPHIC SCOPE and TIME PERIOD (1990–present) for the headline claim?**  
      - **Type:** Factual check.  
      - **Action:** Overlay coverage maps/years of all 3 series.  
      - **Sufficient Answer:** ≥90% population coverage for all years in all included countries.  
      - **Stop/Handoff:**  
          - **STOP** if coverage gaps >10% population or key countries missing.  
          - **HANDOFF (to you/director)** if gaps are borderline (5-10%) – requires judgment on representativeness.

  2.  **QUESTION: Can we RESOLVE METHODOLOGY BREAKS/CONFLICTS?**  
      - **Type:** Factual + convention.  
      - **Action:** Audit partner’s conflict-deaths series:  
          - Compare pre/post-mid-90s sourcing (e.g., PRIO vs. UCDP? NGO reports vs. media?).  
          - Check if police killings are *excluded* from conflict series but *included* in homicide series.  
      - **Sufficient Answer:** Clear documentation explaining the break + adjustment factor (e.g., "pre-1995 estimates inflated by 15% due to X").  
      - **Stop/Handoff:**  
          - **STOP** if break unexplained/unadjustable.  
          - **HANDOFF (to methodologist)** if adjustment is technically possible but complex.

  3.  **QUESTION: Is there SIGNIFICANT DOUBLE-COUNTING between series?**  
      - **Type:** Factual + convention.  
      - **Action:** For each country/year:  
          - Flag if homicide series includes "conflict-related" deaths (e.g., gang wars, insurgencies).  
          - Estimate overlap (e.g., "In Country X, 30% of homicides are conflict-related per source Y").  
      - **Sufficient Answer:** <5% estimated overlap *or* a clear rule to deduplicate (e.g., "Exclude conflict zones from homicide data").  
      - **Stop/Handoff:**  
          - **STOP** if overlap >5% and no deduplication rule possible.  
          - **HANDOFF (to you/director)** if deduplication requires arbitrary thresholds (e.g., "Only count homicides in 'active conflict' zones").

  4.  **QUESTION: Are there VIOLENT DEATHS MISSING FROM ALL SERIES?**  
      - **Type:** Value judgment (wearing a lab coat).  
      - **Action:** Scan for major events not captured (e.g., famine from blockade, deadly detention conditions).  
      - **Sufficient Answer:** Omissions are rare, small-scale, or non-violent by our **chosen definition** (see Step 5).  
      - **Stop/Handoff:**  
          - **HANDOFF (to you/director + ethics advisor)** if omissions are systematic and large (e.g., blockade famines). Requires defining "violence".

  5.  **QUESTION: WHAT COUNTS AS "VIOLENCE" FOR THE HEADLINE?**  
      - **Type:** Value judgment + convention.  
      - **Options:**  
          - *Option A (Narrow):* Only direct, intentional physical force (homicides + conflict deaths).  
          - *Option B (Broad):* Adds structural violence (famine, preventable deaths from policy).  
      - **Action:** Choose ONE based on data availability and mandate.  
      - **Sufficient Answer:** Explicit choice documented (e.g., "We use Option A; structural violence excluded").  
      - **Stop/Handoff:**  
          - **HANDOFF (to director/policy board)** – This is a core value choice. *If Option B chosen, STOP – no reliable data exists.*  

  6.  **QUESTION: WHAT DENOMINATOR?**  
      - **Type:** Convention.  
      - **Action:**  
          - Use **total population** unless evidence suggests bias (e.g., war displaces populations).  
          - Avoid "per adult" or "at-risk" – too complex for headline.  
      - **Sufficient Answer:** "Deaths per 100,000 total population".  
      - **Stop/Handoff:**  
          - **STOP** if denominator distorts massively (e.g., counting deaths in annexed territories not in population data).  
          - **HANDOFF (to you)** if refugee populations >10% in key countries.

  7.  **CALCULATE & SENSITIVITY TEST:**  
      - **Action:** Compute trend for chosen definition (Step 5) and denominator (Step 6). Test robustness:  
          - Exclude unreliable "state violence" series.  
          - Vary deduplication rules (if used).  
      - **Sufficient Answer:** Trend direction (+/-) and magnitude (>5% change) hold across tests.  
      - **Stop/Handoff:**  
          - **STOP** if trend flips/diminishes with minor changes.  
          - **PROCEED** if robust. **Headline = "Violent deaths per 100,000 people [fell/rose] X% since 1990."**

  ---

  ### **Press Office Summary (10-Minute Version)**  
  > "We can only publish a headline trend if:  
  > 1.  Our data covers >90% of the global population consistently since 1990.  
  > 2.  We fix or explain major breaks in methodology.  
  > 3.  We avoid double-counting deaths (e.g., someone killed in an insurgency can't be in both homicide and conflict stats).  
  > 4.  We define "violence" narrowly (only bullets/knives, not famine or neglect), *or* stop if we need a broad definition (no data).  
  > 5.  We use deaths per 100,000 total people.  
  >   
  > **If any step fails, we CANNOT publish a number.** If we proceed, the headline MUST include:  
  > - What we counted (e.g., 'homicides + conflict deaths').  
  > - What we excluded (e.g., 'famine, police killings in custody').  
  > - Major data gaps (e.g., 'excluded Region Y due to missing data')."

  ---

  ### **Running the Procedure: Test Cases**  
  **Case A: Falling Homicide Rate, Rising Total Homicides + Insurgency**  
  - **Step 1:** Geographic match? *Likely yes.*  
  - **Step 2:** Methodology break? *If explained, proceed.*  
  - **Step 3:** Double-counting? **STOP.** Insurgent deaths appear in both homicide and conflict data. Overlap likely >5%. No clean deduplication rule without arbitrary thresholds.  
  - **Result:** *No headline number.* Report disaggregated trends: "Civilian homicides fell X%, but conflict deaths rose Y%."  

  **Case B: Famine Deaths from Blockade**  
  - **Step 1-3:** Pass (if famine not counted elsewhere).  
  - **Step 4:** Missing deaths? **HANDOFF.** Blockade deaths are systematic.  
  - **Step 5:** **VALUE JUDGMENT:** Is this "violence"?  
      - *Option A (Narrow):* Excluded → famine deaths ignored.  
      - *Option B (Broad):* Included → **STOP** (no data in any series).  
  - **Result:** *No headline number.* Use narrative: "Blockade caused Z estimated famine deaths, uncounted in violence stats."  

  **Case C (Worst Case): High-Imprisonment Society**  
  - **Context:** Homicides fall, but prison deaths rise (beatings, neglect). Not in any series.  
  - **Step 4:** Missing deaths? **Yes, significantly.**  
  - **Step 5:** **Option A:** Excludes prison deaths → headline shows decline, masking state violence. **Option B:** Included → **STOP** (no data).  
  - **Result:** *Procedure fails.* Publishes misleading decline under Option A, or silence under Option B. **This is the procedure’s blind spot: institutional violence in uncounted spaces.**  

  ---

  ### **Philosophical Positions & Implications**  
  1.  **"Violence as a Thick Concept":**  
      - **Position:** Agree. Calling an act "violent" *does* imply moral condemnation (e.g., "police violence" vs. "law enforcement").  
      - **Implication:** Your chapter is **empirical data interpreted through normative lenses**.  
      - **Wording:** Use passive descriptors in data sections ("lethal injuries," "conflict-related deaths"). Save "violence" for the *interpretive* policy discussion, explicitly stating its normative weight: *"We define 'violence' for measurement as intentional physical force causing death. Policy discussions using 'violence' address broader ethical concerns."*  

  2.  **"Fact-of-the-Matter" on Violence Trends:**  
      - **Position:** There is **NO objective trend** independent of definitions. Counting a blockade as "violence" vs. "tragedy" changes the trend line.  
      - **Implication:** **Caveats are non-negotiable.** The headline is *conditional* on your choices.  
      - **Caveat Language:** *"Trends reported here reflect a specific, narrow definition of violence. Other definitions would yield different results."*  

  ---

  ### **Absolute vs. Per Capita Rates: Key Points**  
  | **Metric**       | **Good For**                          | **Misleads About**                  | **Denominator Pitfalls**                  |  
  |------------------|---------------------------------------|-------------------------------------|-------------------------------------------|  
  | **Absolute**     | Total human cost; policy resourcing. | Population growth masking risk.     | None.                                     |  
  | **Per Capita**   | Individual risk; comparability.      | Absolute suffering in large/growing populations. | Refugees not counted? Prisoners double-counted? |  

  **Denominator Rule:** Use **total population** for simplicity. Exclude areas with no census data. **Never** use "per adult" or "at-risk" in headlines – too easily weaponized.  

  ---

  ### **Procedure Limits & Mandatory Caveats**  
  **What the Procedure CAN’T Do:**  
  - Capture structural violence (famine, neglect).  
  - Adjust for underreporting in authoritarian states.  
  - Resolve value conflicts (e.g., is a drone strike "violence" if the target was "legitimate"?).  

  **Non-Negotiable Caveats for Report:**  
  > 1.  _"Our headline figure covers only deaths from intentional physical force (homicides and conflict deaths). It excludes structural violence, institutional harm, and deaths without direct perpetrator involvement."_  
  > 2.  _"Data gaps and methodological breaks limit comparability over time and across regions, particularly before 2000 and in conflict zones."_  
  > 3.  _"Per capita rates reflect average risk, not total suffering. A stable rate in a growing population means more absolute deaths."_  

  ---

  ### **Final Recommendation**  
  Given your constraints (unreliable state-violence series, unexplained methodology breaks, and double-counting risks like Case A), **do not publish a single headline percentage**. Instead:  
  - Lead with **disaggregated trends**: "Global homicide rates fell X%, but conflict deaths rose Y% since 1990."  
  - Add: _"No comprehensive trend on 'violence' is possible with current data; definitions alter conclusions."_  
  - Use **Case B (famine)** to highlight limitations: _"Deaths from policies like blockades remain uncounted in standard violence metrics."_  

  **Why this works:** It meets the press office’s need for a clear hook ("homicides down") while honoring complexity. The caveats protect you from criticism, and the famine example preempts accusations of whitewashing. If the director insists on a number, use **homicides-only** (cleanest data) and state: _"This captures only one form of violence."_
