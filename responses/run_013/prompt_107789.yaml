  First, I need to recall relevant concepts. The user mentioned the streetlight effect and Goodhart's law, but neither fits perfectly. The streetlight effect is about where people look, not incentives for witnesses. Goodhart's law involves gaming metrics, which isn't happening here. Survivorship bias doesn't apply either because the missing data was never observed by anyone.  

  The core issue is a structural incentive where the state's prior knowledge sets the boundary for disclosures. The user wants a precise concept, not just related ideas. I remember that Cass Sunstein discussed behavioral economics in law, like information cascades, but that's about social influence, not state files.  

  The primary mechanism is the feedback loop between documented facts and confessions. The state's file acts as a baseline; perpetrators cover only what's recorded to avoid additional exposure. This isn't just impunity trade-off but a narrowing effect. The secondary mechanism is narrative convergence, where later confessions conform to earlier accepted versions, cementing the state's narrative as consensus.  

  I should check if there's existing terminology. "Path dependence" comes to mind—where initial choices limit future options. Here, the state's files set the initial path. "Revealed preference" from economics might relate, but it's about actions reflecting preferences, not information control.  

  The closest fit is path dependence because the state's files create a trajectory that disclosures follow, making unreported crimes systematically excluded. For the secondary issue, information cascades explain how later witnesses adopt earlier narratives. Combining these, the term could be "documentary path dependence."  

  Why coin a new term? Existing concepts don't capture the state's role in shaping disclosures through its files. Destroying files might break the cycle, but if institutions rely on the same sources, the issue persists. Introducing a second institution with independent records could disrupt it, depending on their access.  

  The user needs a defended position. I'll argue that "documentary path dependence" best describes the phenomenon, distinguishing it from near rivals. The term emphasizes the state's documentation setting the path, leading to narrative hardening. This covers both mechanisms and addresses the user's deeper need: understanding how transitional justice processes can unintentionally reinforce state narratives, risking incomplete accountability. They might also seek frameworks to critique or improve such mechanisms in their legal studies or advocacy.
answer: |-
  Your analysis cuts to the heart of a profound flaw in conditional amnesty mechanisms. The established concepts you mention *do not* fully capture this specific structural perversion. The closest fit is **path dependence**, but it requires sharpening to address the state's prior documentation as the path-setter. Here's the argued verdict:

  **The Core Concept: Documentary Path Dependence in Transitional Disclosure**

  1.  **The Mechanism:** The state's pre-existing investigative file creates a **self-reinforcing disclosure boundary**. Perpetrators rationally minimize risk by confessing *only* to acts the state already knows (or is highly likely to discover through the process), achieving immunity while suppressing unreported crimes. This isn't laziness (streetlight effect) or gaming a metric (Goodhart's law). It's a direct consequence of the bargain: immunity is traded for information *the state values enough to demand*, which is intrinsically linked to what it *already knows is missing* or needs confirmed. **The file defines the "cost of admission."**

  2.  **The Narrowing Effect:** This boundary doesn't just limit disclosure; it actively *shapes* the historical record produced by the amnesty process. The process **reifies the state's prior investigative scope and biases**. Crimes outside the state's original focus (due to resource limits, political priorities, or deliberate suppression) remain systematically excluded. The "truth" produced is bounded by the state's initial capacity and will to document.

  3.  **The Hardening Effect (Secondary Loop):** Early confessions, validated by the process, establish a **publicly sanctioned narrative baseline**. Later applicants face a powerful incentive: confirming or slightly adjusting this accepted narrative is cognitively easier, legally safer (less scrutiny), and socially less costly than introducing entirely new, unverified accounts of events. This **narrative convergence** isn't driven by truth-seeking, but by minimizing individual risk within the established framework. The "consensus" is an artifact of the process structure, not a reflection of full reality.

  **Why "Documentary Path Dependence" Fits (and Why Near Rivals Don't):**

  *   **Path Dependence (Core Fit):** This economic/historical concept describes how initial conditions or choices constrain future possibilities, making certain outcomes increasingly locked-in. Here, **the state's pre-existing documentation is the crucial initial condition** setting the path.
      *   *Distinction from General Path Dependence:* It specifically hinges on *state documentation* as the path-setter within a *bargain-for-information* framework. General path dependence might apply to institutional design choices, but not this precise feedback loop between prior documentation and disclosure incentives.
  *   **Information Cascades (Secondary Fit):** Explains how individuals, observing the actions of predecessors, follow the crowd even against private information. This captures the *later applicants converging on early narratives*.
      *   *Distinction:* Information cascades don't inherently explain *why the initial signal (the early confessions aligned with the file)* was shaped the way it was. Documentary Path Dependence provides that foundational cause: the file-defined boundary.
  *   **Revealed Preference (Partial Fit):** Economics concept where actions reveal true preferences/valuations. Perpetrators "reveal" that unreported crimes are valued higher (in terms of risk avoidance) than reported ones.
      *   *Distinction:* It describes the *choice* but not the *structural cause* (the state's file defining the cost structure) or the *collective historical distortion* that results. It's micro, not systemic.
  *   **Streetlight Effect & Goodhart's Law (Rejected as Primary):** As you correctly argue, Streetlight is about *searcher* limitations, not *witness* incentive structures under a bargain. Goodhart's is about metric distortion, not truth-telling bounded by prior state knowledge. Survivorship Bias is about observer error, not deliberate suppression by the actor with perfect knowledge.

  **Edges of the Concept:**

  1.  **Destroyed State File:** If the state's file is *genuinely* destroyed *before* amnesty applications and this is *credible* to perpetrators, the mechanism weakens significantly. The "cost of admission" becomes murkier. Perpetrators might still try to gauge what investigators *might* know independently, but the clear boundary defined by the *state's own documented record* is gone. The process *could* potentially uncover more unreported acts, though perpetrators would still minimize exposure where possible.
  2.  **Second Institution with Independent Records:** This *disrupts* the mechanism. If a well-resourced, credible NGO or international body holds extensive, independent evidence unknown to the state, it changes the incentive structure:
      *   Perpetrators know the amnesty-granting body *might* receive this information.
      *   Withholding acts documented *only* by this second institution now carries risk (potential denial of amnesty).
      *   This expands the effective "file" beyond the state's prior knowledge, potentially widening disclosures.
      *   *Crucially:* The effectiveness depends on the *perceived credibility and reach* of the second institution by perpetrators. If they doubt its ability or willingness to share evidence with the amnesty body, the original dynamic persists.

  **The Verdict:** While **Path Dependence** is the foundational concept, the specificity of the state's *documentation* as the path-setter within the amnesty *bargain* necessitates a sharper term. **Documentary Path Dependence** accurately captures this. It denotes a system where the historical record produced by a truth-recovery mechanism is structurally constrained and shaped by the pre-existing scope and content of state investigative records, due to the rational incentives created by the bargain-for-information model. It encompasses both the initial narrowing against the file and the secondary hardening through narrative convergence. Existing terminology doesn't capture this precise, state-documentation-driven feedback loop; this coinage does.
