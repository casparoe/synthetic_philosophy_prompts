prompt: |-
  I'm a TA for a second-year philosophy of science course, and I'm marking the midterm on the Friedman reading — the essay on the methodology of positive economics, the one with the leaves. My section is the models-and-idealisation one. I've been up since six grinding through these and I just dont trust my own read on one script anymore, so I want a clean second opinion before I hand the marks back. The question was:

  "(a) State Friedman's thesis about the role of assumptions in economic models, and explain the example he uses to illustrate it. (b) A hospital team builds a model of antibiotic prescribing. The model assumes that every patient completes the full course they are given, and that resistance spreads only through completed courses. It predicts hospital-wide resistance rates over five years with good accuracy. The team now wants to use the same model to advise individual doctors on whether to extend a particular patient's course. On Friedman's view, does the falsity of the 'every patient completes the course' assumption matter for (i) the hospital-wide prediction and (ii) the individual advice? Justify your answer in each case. (c) What, if anything, would count as a legitimate criticism of the model's assumptions on Friedman's view?"

  And the student wrote:

  "Friedman's thesis is that the realism of a theory's assumptions is irrelevant to how good the theory is; what matters is only whether the theory's predictions are accurate. His example is the leaves on a tree, which arrange themselves as if each leaf were trying to maximise the sunlight it gets — nobody thinks the leaves are actually calculating anything, and that doesn't stop the hypothesis being useful. So for (b)(i), the fact that not every patient completes their course doesn't matter: as long as the model predicts hospital resistance rates well, the assumption is doing its job. It's just an idealisation, the sort of thing you put in to get the maths going and then relax once you want more precision, like treating a pendulum as a point mass. For (b)(ii), the same reasoning carries over. If the model already predicts resistance accurately at the hospital level, the assumption of full completion is evidently good enough, so there's no reason it should stop us using the model to advise individual doctors; the level at which the prediction is made doesn't change what makes a theory good. For (c), I think on Friedman's view there's basically no legitimate criticism of an assumption as such — you can only ever criticise a theory by testing its predictions, so any objection of the form 'but people don't really do that' is beside the point. That's what the F-twist is, the twist being that the assumption doesn't need to be true. I'd add that Friedman still thinks a theory should be simple, in the sense of explaining a lot with a little, so a model with loads of assumptions would be worse for that reason."

  Can you give me the grade out of 10, plus the comments that justify it? I want it in this order: "Verdict" first, a sentence or two with the mark and the one-line reason for it; then "What it gets right", a short paragraph on everything I should be crediting; then "What it gets wrong", a paragraph but with the problems listed seperately, worst first, and for each one spelled out exactly what's wrong with it — and please flag which of them a rushed grader would probably let slide, since I'm worried that's what I'm doing; then "Comments to give the student", three to five bullets I can write straight in the margin; and last "What a full-mark answer needed", a short paragraph. Don't drift into a general impression of the script — I need to be able to defend every mark I take off.
