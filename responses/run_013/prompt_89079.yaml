prompt: |-
  I'm giving a talk next month at a joint colloquium whose audience is mostly cultural anthropologists and science-and-technology-studies people, with a handful of quantitative evolutionary biologists in the room, and I'm defending a thesis they will each read differently: that cultural change is a genuinely Darwinian process even though cultural variants are not replicators. My argument is that transmission is low-fidelity reconstruction rather than copying, so what looks like a stable "unit" of culture is really a cloud of variants converging on the same attractors, and the lineage-like patterns we observe are held together less by descent than by shared cognitive biases -- which makes cultural change more like repeated convergent evolution than like a family tree. The Darwinian work, on my account, is done by differential persistence plus population-level heritability, not by faithful replication. The anthropologists will hear "Darwinian" as a bid to reduce culture to biology and to smuggle in units they think don't exist, and the biologists will hear "no faithful copying" as a denial that there is selection at all. Draft my Q&A prep sheet: the objections I will actually get, ordered by how much damage they would do, phrased the way each side would phrase them in its own vocabulary, with a two-minute reply to each, a note on where the reply is soft, and the objection I am hoping nobody asks. Tell me how confident you are in these characterizations and single out the point you are least sure of. Write it as continuous prose only -- no headings, bullet points, bold text, or tables, the way you would write an email.
