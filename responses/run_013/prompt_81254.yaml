  ### Session Plan: "Games, Proof, and Paradox"  
  **Focus:** Strategy-stealing argument (non-constructive proof) and its breakdown due to zugzwang.  
  **Goal:** Students discover the argument through gameplay, see it fail when zugzwang occurs, and reflect on non-constructive proofs.  
  **Materials per Pair:**  
  - 3x3 Hex grid (handout, 9 hexagons, top/bottom labeled "RED GOAL," left/right "BLUE GOAL").  
  - 4x4 Hex grid (handout).  
  - 5 stones (e.g., counters, beans, or drawn circles).  
  - Pens/markers (two colors for Hex).  

  **Timeline (75 mins):**  
  1. **Stage 1: Play Symmetric Game w/o Zugzwang (Hex 3x3) - 15 mins**  
  2. **Stage 2: Introduce Strategy-Stealing Argument (Hex 4x4) - 25 mins**  
  3. **Stage 3: Break the Argument with Zugzwang (5-Stone Game) - 20 mins**  
  4. **Debrief & Reflection - 15 mins**  

  ---

  ### Step-by-Step Activities  
  #### **Stage 1: Play Symmetric Game w/o Zugzwang (Hex 3x3) - 15 mins**  
  **Rules:**  
  - **Players:** RED (connects top-bottom), BLUE (connects left-right).  
  - **Turns:** Players alternate coloring one empty hexagon.  
  - **Winning:** Connect your sides with a path of adjacent hexagons (shared edges only).  
  - **Key Properties:** Symmetric (board/roles identical), no zugzwang (extra stone never hurts—only helps your path).  

  **Prompts & Flow:**  
  1. *Prompt (0 min):* "Grab a 3x3 Hex grid and stones. Play 3 games with your partner. Alternate who starts first. Record winners. Notice: Can the second player force a win?"  
  2. *Student Activity (10 mins):* Students play. Most games will end in first-player wins (trivial on 3x3).  
  3. *Group Discussion (5 mins):*  
     - *Prompt:* "What patterns did you see? Did anyone find a way for the second player to win consistently?"  
     - *Goal:* Students observe first player always wins (symmetry helps first player). Avoid giving answers—let them articulate.  

  **What Students Learn:** Symmetric games can favor the first player, but they *found* the winning strategy (constructive).  

  ---

  #### **Stage 2: Introduce Strategy-Stealing Argument (Hex 4x4) - 25 mins**  
  **Rules:** Same as 3x3 Hex but on a 4x4 grid (16 hexagons). Winning requires a connected path across larger board.  

  **Prompts & Flow:**  
  1. *Prompt (15 min):* "Switch to 4x4 grids. Play 2 games. Try to find a winning strategy for the first player. Ask: Can the second player have a winning strategy?"  
  2. *Student Activity (15 mins):* Students play. They’ll struggle to find a first-player strategy (4x4 is complex). Most games may still have first-player wins, but no one will find a *guaranteed* strategy.  
  3. *Strategy-Stealing Argument Intro (30 min):*  
     - *Prompt:* "Suppose the second player has a winning strategy. What if the first player makes a random move, then copies the second player’s strategy as if they were the second player? What could go wrong?"  
     - *Guide Them:*  
       - "If the strategy says 'play on your dummy move,' the first player plays elsewhere. Since extra stones never hurt in Hex, this only helps."  
       - "If both players follow a winning strategy, who wins? (Only one can win in Hex—no draws!). This is a contradiction. So, can the second player really have a winning strategy?"  
     - *Conclusion:* "If not, who must have one? What does this tell us without giving a real strategy?"  

  **What Students Learn:** The argument proves the first player wins non-constructively—no strategy found, just existence.  

  ---

  #### **Stage 3: Break the Argument with Zugzwang (5-Stone Game) - 20 mins**  
  **Rules:**  
  - **Setup:** 5 stones in a pile.  
  - **Turns:** Players take 1, 2, or 3 stones per turn.  
  - **Losing Condition:** Player who takes the **last stone loses** (misère variant).  
  - **Key Properties:** Symmetric (same moves), but zugzwang (extra moves can hurt—e.g., leaving 1 stone forces loss).  

  **Prompts & Flow:**  
  1. *Prompt (40 min):* "New game: 5 stones. Take 1–3 stones/turn. Last stone loses. Play 3 games. Find: Does the first or second player have a winning strategy?"  
  2. *Student Activity (10 mins):* Students play. Optimal play leads to first-player loss (see table below). They’ll discover second player wins.  
     - **Optimal Moves:**  
       | Stones | Player to Move | Outcome |  
       |--------|---------------|---------|  
       | 5      | 1st           | Loss (L) |  
       | 4      | 1st           | Win (W) |  
       | 3      | 1st           | Win (W) |  
       | 2      | 1st           | Win (W) |  
       | 1      | 1st           | Loss (L) |  
  3. *Group Discussion (50 min):*  
     - *Prompt:* "Who wins? Why can’t the first player steal the second player’s strategy? What if the first player takes 1 stone, then copies the second player’s 'winning' strategy?"  
     - *Guide Them:*  
       - After first player takes 1, 4 stones remain. Second player (now "first") wins from 4 stones.  
       - "Why did this 'dummy move' backfire? When does an extra move *hurt*?" (Zugzwang: moving from 5 stones is fatal).  

  **What Students Learn:** Strategy-stealing fails here—assumption "extra move never hurts" is violated.  

  ---

  ### **Debrief & Reflection - 15 mins**  
  **Tie-Back Prompts:**  
  1. *Non-Constructive Proof:*  
     - "In Hex 4x4, we *know* the first player wins but have no strategy. How does that feel compared to 3x3? Why is it 'spooky'?"  
     - *Key Point:* Existence proofs give certainty without utility—you know you *can* win but not *how*.  

  2. *Core Assumptions:*  
     - "What two hinges made the argument work in Hex? (Symmetry + no zugzwang). How did the stone game break it? (Zugzwang)."  
     - *Real-World Analogy:* "Like knowing a treasure exists but having no map."  

  3. *Why It Matters:*  
     - "In math, non-constructive proofs are common (e.g., Nash equilibrium). They’re powerful but unsatisfying—you can’t 'cash them out.'"  

  ---

  ### **Limitations & Predictable Issues**  
  **What This Can’t Reproduce:**  
  - **Complexity Gap:** You must *assert* that for large games (e.g., 10x10 Hex), the winning strategy exists but is astronomically long (billions of moves). Students won’t *feel* this—they only see small boards.  
  - **Abstract Reasoning:** Students may struggle to grasp why "both players winning" is absurd in Hex. Use the board to demo: two connecting paths are impossible in Hex (topology proof omitted).  

  **Predictable Problems & Solutions:**  
  1. **Hex 4x4 Winning Strategy Found:** If students find a first-player strategy, say: "Great! But what about 100x100? The argument still works *without* finding it. That’s the point."  
  2. **Stone Game Misplayed:** If pairs miss that first player loses, run a demo:  
     - Player 1 takes 1 (leaves 4) → Player 2 takes 3 (leaves 1) → Player 1 loses.  
  3. **Confusion on Symmetry:** Some may say Hex isn’t symmetric (colors have different goals). Clarify: "The board is symmetric; swapping colors mirrors the game."  
  4. **Time Crunch:** Prioritize: Cut Stage 1 to 10 mins if needed. Ensure Stage 3 happens—it’s critical for zugzwang.  

  **Why This Works:**  
  - **Discovery-Based:** Students *play* their way to the paradox.  
  - **Tangible Contrast:** Hex (no zugzwang) vs. stone game (zugzwang) makes assumptions visible.  
  - **Philosophical Hook:** The "spookiness" of non-constructive proofs emerges naturally.  

  **Final Prep:**  
  - Print Hex grids (3x3 and 4x4). Ensure stones are ready.  
  - Practice silent facilitation: Use prompts to guide, not explain. Let them struggle!  
  - Embrace chaos: If students "do the one thing you didn’t plan for," lean in. E.g., if they invent a variant, ask: "Does the argument still hold?"  

  This session makes the abstract visceral. Students will leave unsettled by knowledge without control—exactly as intended.
