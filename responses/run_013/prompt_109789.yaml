prompt: |-
  ok so I'm a backend dev, no philosophy training at all, and I keep getting into this arguement with a friend who did a biochem degree, and it's driving me nuts. Could you write me a dialogue between two people who both actually know what they're talking about, one on each side of the question "is DNA really a code, or is that just a metaphor we got stuck with"? Both of them should be sharp, neither should be a pushover, and they should respond to each other's actual points instead of trading monologues. No strawmen.

  The two sides I want defended properly:

  1) Yes, it's a code. It's a symbol system — the mapping from codons to amino acids is arbitrary the same way the word "cat" doesn't resemble a cat. You can copy a gene out of one organism, paste it into another, and get the protein, which is exactly what a code buys you: move a representation somewhere else and it still works. And the part that really gets me: the machine that reads the code is itself built out of the code. That's a quine. Compilers don't compile themselves; DNA kind of does.

  2) No, that's a story we're telling about chemistry. There's no interpreter sitting somewhere reading the DNA — there's just reactions happening everywhere at once, and the "meaning" of a codon is only the fact that it causes something to happen, which is definately not what meaning is. A mutation that's harmless in one tissue kills you in another, so the sequence has no fixed meaning independent of context, and a code is supposed to have that.

  Make them actually fight about the hard parts, not the easy ones:

  - If the codon table turned out to be chemically inevitable — zero arbitrariness — would it stop being a code? Does the arbitrary bit even matter, or is that a red herring?
  - Suppose the same codon got read differently depending on what else happened to be floating around. Does that break the code idea, or just make it context-sensitive like an actual language?
  - The "who reads the reader" loop. Is that a genuine feature of codes, or a cute analogy that falls apart when you poke it?
  - Whether "information" is doing any work here or is just a word smuggled in from CS. (I'm guilty, I know.)

  Keep it casual, no citations, and please don't have them say "as so-and-so argued" — I don't know the literature and I don't want a reading list, I want to watch them think. A few hundred words is fine, more if it's earning it. Have them concede things where they're actually wrong.

  Last line: give me \answer{...} with a short phrase saying which side came out ahead — "code", "not a code", or "tie" — so I can scan it later.
