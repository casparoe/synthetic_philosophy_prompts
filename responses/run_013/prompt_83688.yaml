  **PEOPLE’S STATISTICAL DIRECTORATE**
  **Harmonia National Data Hub, Belgravia**
  **FOR IMMEDIATE RELEASE: 15 OCTOBER 2024**

  **Harmonia Pioneers Objective National Wellbeing Measurement with Revealed Preference Index**

  BELGRAVIA – The People’s Statistical Directorate (PSD) today announces the retirement of all subjective wellbeing surveys, effective immediately, and the launch of the Revealed Preference Index (RPI) as the sole official measure of national welfare. This decisive shift leverages existing administrative data to directly observe citizen wellbeing through the choices they freely make in the marketplace of life, eliminating the unreliability and respondent burden inherent in self-reported feelings.

  "Subjective surveys asked citizens *how they felt*," stated Dr. Astrid Vorne, Director of the PSD. "The RPI observes *what they do*. Feelings are ephemeral and prone to bias; choices are concrete, recorded, and definitive. By analyzing aggregated records of actual purchases, enrollment decisions, job transitions, contract renewals, and residential moves, the RPI provides an unambiguous, data-driven picture of what citizens truly value. This is wellbeing measured not by aspiration, but by action. The era of guesswork is over."

  Dr. Vorne emphasised the methodological rigor underpinning the RPI. "The Index rests on the fundamental principle that a citizen's choices reveal their underlying preferences. Our sophisticated algorithms map these observed choices to a stable preference ordering for each individual. This requires standard operational assumptions, such as the completeness and transitivity of preferences across all available options, which are routinely applied to ensure robust ordinal ranking of wellbeing states for each citizen. It is pure behavioural science."

  **Methodology in Brief**

  The RPI is constructed from anonymized, real-time administrative records (retail transactions, employment registries, education enrollments, property deeds, utility contracts, etc.). For each citizen, choices are aggregated over a rolling 36-month period. Using standard revealed preference techniques, choices are mapped to a complete and transitive preference ordering, ranking the citizen's chosen bundle against feasible alternatives they did not select. To derive a *cardinal* wellbeing score necessary for national aggregation, each citizen's final chosen bundle of goods, services, and life states is valued using national average prices and weights. This yields a Harmonised Wellbeing Unit (HWU) score.

  "The use of national average valuations is crucial," Dr. Vorne explained. "It provides a common metric, ensuring the wellbeing contributions of vastly different life choices – a luxury car or a community college course – are fairly expressed and directly comparable across our diverse population. It elegantly captures the intensity of preference revealed through expenditure patterns and major life commitments."

  **Robustness in Action: The Case of Mr. Aris Thorne**

  The RPI's resilience is illustrated by Mr. Aris Thorne (ID: H-CIT-7743902B). Mr. Thorne's recorded choices over the past decade are highly consistent: minimal market transactions, stable residence at a state-funded facility, and no job changes or contract renewals. While limited choice availability might suggest constrained wellbeing in legacy surveys, the RPI paints a different picture. Mr. Thorne's consistent selection of the same meals, activities, and living arrangements, when mapped against his observable feasible set, reveals a strong, stable preference ordering. His choices reveal no desire for change. Consequently, despite a low HWU score primarily due to the limited monetary value of his consumed bundle at national averages, Mr. Thorne exhibits remarkably high *ordinal* wellbeing within his specific context. The RPI robustly captures satisfaction even within constrained circumstances, demonstrating its immunity to subjective disappointment.

  **Consistency and Accuracy Guaranteed**

  The PSD has implemented rigorous quality controls. Citizens exhibiting choice patterns inconsistent with a single, stable preference ordering – such as selecting Option A when B was affordable, and later selecting B when A remained available – undergo a mandatory Consistency Audit. "The Audit identifies the point of preference reversal," Dr. Vorne noted. "Data prior to the reversal is used to establish the dominant preference trend. Post-reversal choices are reclassified under a new, stable preference profile. This ensures temporal coherence and maximizes usable data." Dr. Vorne stressed the RPI's inherent accuracy: "The Index cannot be mistaken about what a citizen wants at the point of choice. Their action *is* the revelation of their preference at that moment. Regret, error, or weakness of will are, by definition, not factors in revealed preference. What is chosen is, demonstrably, preferred."

  **Policy Appraisal Revolutionized**

  The RPI will be central to governmental cost-benefit analysis. "Policy interventions can now be evaluated directly by their impact on the RPI," Dr. Vorne announced. "A project is justified if it demonstrably expands citizen choice sets and induces observable shifts in behaviour that increase aggregate HWUs. Crucially, the RPI tells us precisely which new choices citizens make when given the opportunity, revealing the preferences satisfied by the project itself. This creates a virtuous cycle of evidence-based investment, eliminating the need for speculative forecasting. It represents a significant efficiency gain in resource allocation."

  **Notes for Editors**

  *   The Revealed Preference Index (RPI) replaces all previous wellbeing metrics, including the National Mood Barometer, the Life Satisfaction Census, and the Community Wellbeing Digest.
  *   Data sources are fully compliant with Harmonian privacy statutes (Data Integrity Act, 2019). Individual identifiers are anonymized before analysis.
  *   Citizens with insufficient recorded choices (<5 distinct, non-routine transactions/decisions per annum) are assigned a provisional HWU of 0.15 (baseline subsistence). The PSD is developing linkage protocols with municipal inactivity registers to refine these estimates.
  *   Interpersonal comparisons of wellbeing, as facilitated by the HWU metric, are a fundamental requirement for national welfare assessment and are fully supported by the RPI methodology.
  *   Further technical documentation (PSD-RPI-METHOD-v1.0) is available on the Directorate's public portal.

