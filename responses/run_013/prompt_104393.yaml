  ### Decision Tree: The Wrong Kind of Reasons Problem  
  **Instructions:** Answer each question based on the case described. Proceed down the branch matching your answer. Each leaf provides a position name and its hardest commitment to defend. Cases are abbreviated for brevity; refer to full descriptions in the seminar materials.

  ---

  #### **Node 1: Evil Demon Case**  
  *A powerful being will destroy something you care about unless you come to admire him. Does the threat give you a reason to admire him (not just to act as if you admire him)?*  
  - **A: Yes** → Go to Node 2  
  - **B: No** → Go to Leaf 1  

  #### **Node 2: Belief Pill Case**  
  *A pill causes you to believe your life will go well (you have no evidence). This belief improves your life. Does the benefit give you a reason to believe (not just to take the pill)?*  
  - **A: Yes** → Go to Node 3  
  - **B: No** → Go to Node 4  

  #### **Node 3: Fear Reward Case**  
  *A reward is offered for feeling fear of a harmless object. Does the reward give you a reason to feel fear (not just to pretend)?*  
  - **A: Yes** → Go to Node 5  
  - **B: No** → Go to Leaf 2  

  #### **Node 4: Intention Payment Case**  
  *You are paid to form an intention to φ, but when the time comes, you’ll have no reason to φ. Does the payment give you a reason to intend to φ?*  
  - **A: Yes** → Go to Leaf 3  
  - **B: No** → Go to Leaf 4  

  #### **Node 5: Evil Demon Case (Revisited)**  
  *Is the reason to admire the demon from the threat the same kind of reason as a reason from his genuinely admirable qualities?*  
  - **A: Yes** → Go to Node 6  
  - **B: No** → Go to Node 7  

  #### **Node 6: Unfunny Joke Case**  
  *You need goodwill from someone who offers a reason to be amused by an unfunny joke. Does this reason make amusement fitting (i.e., would being amused be appropriate)?*  
  - **A: Yes** → Go to Leaf 5  
  - **B: No** → Go to Node 8  

  #### **Node 7: Fear Reward Case (Revisited)**  
  *The object is harmless. Can the reason from the reward be weighed against reasons against fear (e.g., harmlessness) to determine whether you ought to feel fear?*  
  - **A: Yes** → Go to Leaf 6  
  - **B: No** → Go to Leaf 7  

  #### **Node 8: Self-Fulfilling Attitude Case**  
  *Suppose admiring someone makes them admirable (the attitude causes its own fittingness). Does the threat now give a fittingness reason to admire?*  
  - **A: Yes** → Go to Leaf 8  
  - **B: No** → Go to Node 9  

  #### **Node 9: Uniformity Across Attitudes**  
  *In the Intention Payment case, does the payment give a reason of the same kind as reasons bearing on whether φ-ing is worthwhile?*  
  - **A: Yes** → Go to Leaf 9  
  - **B: No** → Go to Leaf 10  

  ---

  ### Leaves (Positions)  
  - **Leaf 1: Practical Reasons for Attitude Formation Only**  
    *Hardest commitment:* The threat gives no reason to admire the demon, only to bring about admiration. Must deny that instrumental value ever provides reasons for attitudes themselves.  
  - **Leaf 2: Fittingness-Only for Cognitive Attitudes**  
    *Hardest commitment:* Practical benefits (e.g., Belief Pill) never provide reasons for belief, even if they do for conative attitudes like intention. Must explain why epistemic norms are immune to practical influence.  
  - **Leaf 3: Conative Hybridism**  
    *Hardest commitment:* Practical reasons (e.g., payment) can directly support intentions but not beliefs. Must justify why conative attitudes are uniquely sensitive to non-fittingness reasons.  
  - **Leaf 4: Global Fittingness-Only**  
    *Hardest commitment:* No practical consideration (reward, threat, or payment) is ever a reason for any attitude. Must reject intuitions that incentives can rationally compel attitudes.  
  - **Leaf 5: Fittingness Subjectivism**  
    *Hardest commitment:* Any reason to have an attitude can make it fitting (e.g., needing goodwill makes the joke funny). Must accept that fittingness is reducible to instrumental value.  
  - **Leaf 6: Robust Monism**  
    *Hardest commitment:* The reward can make fear fitting if strong enough, even for a harmless object. Must allow that fittingness conditions can be overridden by practical incentives.  
  - **Leaf 7: Hedged Monism**  
    *Hardest commitment:* Practical reasons (e.g., reward) are genuine reasons for attitudes but are always outweighed by conflicting fittingness reasons. Must hold that unfitting attitudes are always irrational, regardless of benefits.  
  - **Leaf 8: Dynamic Fittingness**  
    *Hardest commitment:* Self-fulfilling attitudes erase the wrong-kind problem (e.g., the threat becomes a fittingness reason if admiration causes admirability). Must accept that all practical reasons could transmute into fittingness reasons under causal loops.  
  - **Leaf 9: Uniform Value-Based Pluralism**  
    *Hardest commitment:* Two distinct kinds of reasons exist for all attitudes: fittingness (correctness) and desirability (goodness of having the attitude). Must explain why we shouldn’t have an attitude when desirability reasons are strong but fittingness reasons absent.  
  - **Leaf 10: Non-Uniform Value-Based Pluralism**  
    *Hardest commitment:* Fittingness and desirability reasons coexist for conative attitudes (e.g., intention), but only fittingness reasons apply to cognitive ones (e.g., belief). Must defend why conative attitudes have a "dual role" for reasons.  

  ---

  ### Unoccupied Combinations & Diagnoses  
  - **"No at Node 1 + Yes at Node 4"**: *Incoherent.* If reasons never apply to attitudes (Node 1-B), they can’t apply to intentions (Node 4-A).  
  - **"Yes at Node 2 + No at Node 3"**: *Coherent but unattractive.* Allows practical reasons for belief (Node 2-A) but not fear (Node 3-B), creating an ad hoc asymmetry.  
  - **"No at Node 5 + Yes at Node 6"**: *Unexplored.* Denies a distinction in kind (Node 5-A) but claims practical reasons make attitudes fitting (Node 6-A). Possible but requires conflating fittingness with value.  

  ---

  ### Closing the Instrument  
  1. **Indistinguishable Leaves**:  
     - **Leaf 7 (Hedged Monism)** and **Leaf 9 (Uniform Value-Based Pluralism)** both deny that practical reasons affect fittingness. To separate them: *Can practical reasons partially justify an attitude (e.g., fear) when fittingness reasons are weak?*  
       - Hedged Monism: No (practical reasons are irrelevant to justification).  
       - Value-Based Pluralism: Yes (they provide a distinct justificatory role).  

  2. **Genuinely Contested Nodes**:  
     - **Node 1 (Evil Demon)**: Is there *any* reason to admire? Reflects deep disagreement about whether attitudes can be instrumentally justified.  
     - **Node 5 (Evil Demon revisited)**: Is the reason *of the same kind*? Divides monists (same kind) from pluralists (different kind).  
     - **Node 8 (Self-Fulfilling Attitude)**: Does causal feedback collapse the distinction? Tests whether the problem is metaphysical or normative.  

  3. **Limitations of the Instrument**:  
     - The tree may falsely imply that **attitude-types (cognitive vs. conative)** determine the problem’s scope (e.g., Leaf 2, Leaf 10). In reality, some argue intention is more like belief (e.g., "truth-sensitive"), a distinction the tree doesn’t resolve.  
     - Students may resist **Node 3 (Fear Reward)**, where answering "A" (Yes) seems to commit to absurdity (fearing harmless things). The tree forces this choice but can’t resolve whether "reason" implies "rationality" here.  
     - The **role of evidence** in belief (Node 2) is oversimplified; some hold that pragmatic reasons can indirectly justify belief via evidence-seeking actions, a nuance the tree flattens.  

  ---  
  *End of instrument. Use cases to test positions, not labels.*
