     - B: No, the reason from the reward is not a reason that bears on whether the fear is fitting; it is a reason that bears on whether it is good to have the fear. But the fear is unfitting and you ought not feel it, regardless of the reward. (Leaf 5)

     **Leaf 4: Robust Monism**
     - Position: All reasons for attitudes are of the same kind and can be weighed against each other. The reward might make fear fitting if it is strong enough.
     - Hardest commitment: In the Fear Reward case, if the reward is large enough, it would make fear of a harmless object fitting, which seems to change the fittingness conditions of fear.

     **Leaf 5: Hedged Monism**
     - Position: All reasons for attitudes are of the same kind, but non-fittingness reasons (like the reward) are always outweighed by the fittingness reasons when they conflict, because an attitude that is unfitting is always to be avoided.
     - Hardest commitment: The reason to feel fear from the reward is always insufficient to make it the case that you ought to feel fear, even if the reward is enormous.

     **Node 7 (Pluralism): Unfunny Joke Case**
     You need the goodwill of someone who offers you a reason to be amused by a joke that isn't funny. Does this reason make being amused by the joke fitting? That is, if you are amused because of the need for goodwill, is your amusement fitting?
     - A: Yes. (Leaf 6)  [Note: This is a form of subjectivism.]
     - B: No. (Go to Node 8)

     **Leaf 6: Fittingness Subjectivism**
     - Position: Any reason to have an attitude can make that attitude fitting. In the Unfunny Joke case, the need for goodwill makes the joke funny (or makes amusement fitting).
     - Hardest commitment: It must hold that the joke's funniness depends on practical reasons, which seems to conflate the comic with the practical.

     **Node 8 (from B at Node 7): What is the difference in kind based on?**
     In the Evil Demon case, the reason to admire from the threat does not make the admiration fitting. But what kind of reason is it?
     - A: It is a reason that counts in favor of having the admiration because it is good to have it, not because it is fitting. (Go to Node 9)
     - B: It is a reason that is specific to the attitude of admiration, but for other attitudes (like belief) we might not have such reasons. (Go to Node 10)

     **Node 9: Uniformity across attitudes**
     Is the distinction between fittingness reasons and reasons of desirability the same for every attitude?
     - A: Yes. (Leaf 7)
     - B: No, the distinction applies to some attitudes but not to others. (Go to Node 10)

     **Leaf 7: Value-Based Pluralism (Uniform)**
     - Position: There are two kinds of reasons for any attitude: reasons of fittingness (which make the attitude correct) and reasons of desirability (which make the attitude good to have). The threat in the Evil Demon case is a reason of desirability for admiration.
     - Hardest commitment: Explaining how an attitude can be supported by strong reasons of desirability and yet be unfitting, and why we shouldn't have it even when the reasons of desirability are very strong.

     **Node 10 (from B at Node 8 or from B at Node 9): For which attitudes does this distinction hold?**
     Does the attitude of belief admit of reasons of desirability (like the belief pill)?
     - A: Yes, belief admits of both kinds. (Go to Leaf 7)  [But then it's uniform, so we are back to Leaf 7?]
     - B: No, belief only admits of fittingness reasons. (Leaf 8)

     **Leaf 8: Value-Based Pluralism (Non-Uniform)**
     - Position: For conative attitudes (admiration, intention, desire), there are two kinds of reasons: fittingness and desirability. For cognitive attitudes (belief), only fittingness reasons are reasons to believe.
     - Hardest commitment: Providing a principled account of why the two kinds of reasons apply to conative but not cognitive attitudes.

     **Note:** We have not addressed the self-fulfilling attitudes. We can add a node somewhere, but the tree is already complex. Since the problem is not central to the main classification, we might omit it or add it as a further question at the leaves.

     Also, we have not captured every possible position. For example, we might have a position that says the difference is in the nature of the attitude but uniformly across attitudes. But that might be captured in Value-Based Pluralism.

     **Closing the Instrument:**

     Part 1: Two leaves the tree cannot separate.
     - For example, Leaf 5 (Hedged Monism) and Leaf 7 (Value-Based Pluralism) might be hard to distinguish because both say that in the Fear Reward case, you ought not feel fear. To separate them, we need to ask: In the Fear Reward case, is the reason from the reward a reason that bears on whether the fear is fitting? 
          - Hedged Monism: Yes, it does bear on fittingness, but it is outweighed.
          - Value-Based Pluralism: No, it does not bear on fittingness at all.

     Part 2: Genuinely contested nodes.
     - Node 1: Is there a reason to admire in the Evil Demon case? (Yes/No) This is contested.
     - Node 2: Is there a reason to believe in the Belief Pill case? (Yes/No) This is contested.
     - Node 5: Are the reasons the same kind in the Evil Demon case? (Yes/No) This is the core of the debate.

     Part 3: What the instrument cannot do.
     - The tree does not settle the metaphysical status of fittingness (e.g., whether it is mind-independent). Students might think that by choosing Value-Based Pluralism, they are committed to a non-naturalist account of fittingness, but that is not necessarily true.
     - Students might resist the tree at Node 1 because they might think that the reason to bring about admiration entails a reason to admire. The tree forces a choice that might seem artificial.

     This tree is a simplification. We have not included the self-fulfilling case, but it could be added as a further question at the leaves.

     Given the complexity and the constraints, this is a preliminary structure. We might refine it.
