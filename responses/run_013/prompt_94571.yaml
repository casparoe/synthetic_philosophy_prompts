prompt: |-
  I'm a TA for an intro cognitive science course and I'm marking the long-answer section of the final. One of the questions (worth 10 points) was:

  Does language shape thought? Set out the Sapir-Whorf hypothesis, distinguish the versions it's usually split into, and assess the empirical evidence for each. Also say whether any effects that have been found are best described as effects on perception, on memory, or just on how people handle the task, and what evidence would show that a linguistic difference causes a cognitive difference rather than merely going along with it.

  And one student answered:

  The Sapir-Whorf hypothesis says that the language you speak determines how you think. It gets split into a strong version, linguistic determinism, where language fully determines thought, and a weak version, linguistic relativity, where language biases thought in particular tasks. The strong version is basically dead -- babies and animals think without any language at all, so thought clearly doesn't depend on language, and that also means language can't be doing much of the shaping. Since the strong version fails, the only defensible reading left is the weak one, which is pretty much what Sapir and Whorf meant anyway. The weak version does have support. Russian speakers discriminate shades of blue faster because Russian has seperate basic terms for light and dark blue, which shows they perceive the difference more finely. Speakers of languages that use compass directions instead of left and right are much better at dead reckoning. And the classic case of Inuit languages having dozens of words for snow shows how a language carves up a domain and makes its speakers notice distinctions other people miss. So the hypothesis is false in its strong form but Whorf's main idea survives, and the effects are probably mostly on perception.

  I've got alot of these scripts to get through, so give me a grade out of 10 plus the point-by-point comments you'd actually write on this one -- I want to see which specific things you'd credit and which you'd mark down.
reasoning: |-
  Okay, the user is a TA grading a cognitive science final exam question about the Sapir-Whorf hypothesis. The student's answer needs to be evaluated on several key points: defining the hypothesis, distinguishing strong vs weak versions, assessing evidence, and discussing whether effects are on perception, memory, or task handling. 

  First, I notice the student correctly identifies both versions of the hypothesis (strong determinism vs weak relativity) and explicitly states the strong version is unsupported - that's good. The baby/animal argument against determinism is valid though a bit simplistic. 

  But red flags pop up immediately in the evidence section. The Russian blue example is accurately described as affecting perception (good!), but the Inuit snow vocabulary claim is famously discredited - that's a major error. The dead reckoning example is correct but misattributed as "compass directions" when it's actually about absolute vs relative frames of reference. 

  The student also misses crucial nuances: no mention of within-language experiments (like Boroditsky's priming studies) that help establish causality, and the conflation of perception with cognition throughout. The conclusion oversimplifies by declaring Whorf's "main idea" survives when actually modern research shows more complex, domain-specific effects. 

  For grading, I'd award points for: correct version distinction (1pt), valid rejection of strong version (1pt), accurate Russian example (1pt), correct dead reckoning effect (1pt), and identifying perception as one mechanism (0.5pt). But deductions for: Inuit myth (-1pt), causal evidence gap (-1pt), no memory/task discussion (-0.5pt), and oversimplified conclusion (-0.5pt). The core structure is competent but key inaccuracies hold it back from top marks. 

  The user probably wants this granular breakdown because they're time-pressed with many scripts. I'll emphasize actionable feedback - praising where the student synthesizes concepts well but flagging specific improvements needed, especially replacing debunked examples with current research. Might also subtly validate the TA's workload by keeping comments efficient.
answer: |-
  Here's a grade and detailed feedback for this student answer:

  **Grade: 6.5 / 10**

  **Point-by-Point Feedback:**

  1.  **Sapir-Whorf Definition (✓ Partial Credit):** Correctly states the core idea that language shapes thought. However, it oversimplifies by saying "determines". Sapir and Whorf often used more nuanced language like "influences" or "shapes". *(+0.5)*
  2.  **Distinguishing Versions (✓✓ Good):** Clearly identifies and defines the strong (linguistic determinism) and weak (linguistic relativity) versions. This is accurate and well-stated. *(+1.5)*
  3.  **Assessing Strong Version (✓ Partial Credit):** Correctly concludes that strong determinism is untenable. The reasoning (babies/animals think without language) is a common and valid argument against *complete* dependence. However, it doesn't address more subtle determinist claims about the *bounds* of thought within a language, nor does it mention the lack of empirical support for truly incommensurable thought. *(+1)*
  4.  **Assessing Weak Version / Evidence (✓✓✓ Mixed / Major Errors):**
      *   **Russian Blues (✓✓ Good):** Correctly cites the Winawer et al. (2007) study (or similar) on Russian blues and accurately identifies it as a perceptual effect. This is strong evidence for linguistic relativity in the domain of color perception. *(+1.5)*
      *   **Dead Reckoning / Spatial Frames (✓✓ Good):** Correctly references the work (e.g., Levinson, Majid) on languages using absolute (like cardinal directions) vs. relative (left/right) spatial frames. Accurately notes the impact on navigation skills/cognition. *(+1)*
      *   **Inuit Snow Words (X Major Error):** This is the **famous myth/debunked claim**. While vocabulary *reflects* cultural importance/salience, there is **no evidence** that speakers of Inuit languages *perceive* snow differently due to more words. This is a significant factual error demonstrating a lack of critical engagement with the literature. *(-1.5)*
      *   **Lack of Other Key Evidence:** Misses other important evidence like time metaphors (e.g., Boroditsky's Mandarin/English time studies), grammatical gender effects (e.g., object description), number/counting systems, etc. *(-0.5)*
  5.  **Nature of Effects (Perception/Memory/Task) (✓ Partial Credit / Oversimplification):** Correctly identifies the Russian blue effect as perceptual. However, fails to mention that many effects are demonstrably *not* purely perceptual (e.g., spatial reasoning, memory for object locations, conceptualization of time). The claim that effects are "probably mostly on perception" is an oversimplification. Does not discuss memory effects (e.g., memory advantages tied to linguistic encoding) or task-handling strategies. *(+0.5)*
  6.  **Causality (X Missing):** Fails completely to address the crucial final part of the question regarding evidence for causation vs. correlation. This is a significant omission. No mention of critical methods like:
      *   Within-language priming studies (e.g., temporarily activating a linguistic construct changes performance).
      *   Longitudinal studies tracking cognitive change alongside language acquisition.
      *   Training studies (e.g., teaching new linguistic distinctions and seeing if cognition changes).
      *   The importance of controlling for non-linguistic cultural/environmental factors. *(-1.5)*
  7.  **Conclusion (✓ Partial Credit / Oversimplification):** Correctly summarizes that strong determinism fails but weak relativity has support. However, the conclusion that "Whorf's main idea survives" is debatable, as Whorf leaned more determinist. Stating effects are "mostly on perception" is unsupported and ignores the breadth of cognitive domains affected (conceptualization, memory, reasoning). *(+0.5)*

  **Summary of Key Strengths:**
  *   Clear definition and distinction of strong vs. weak versions.
  *   Correct identification of the unsustainability of strong determinism.
  *   Accurate description of the Russian blue and spatial frames evidence (except for misnaming it "dead reckoning" - though the core point stands).
  *   Correctly identifying the perceptual nature of the color effect.

  **Summary of Key Weaknesses:**
  *   **Major Factual Error:** Perpetuating the debunked "Eskimo snow words" myth.
  *   **Significant Omission:** Completely failing to address the question of causal evidence vs. correlation.
  *   **Oversimplification:** Concluding effects are "mostly on perception" ignores evidence across cognitive domains.
  *   **Incomplete Evidence Review:** Lacks discussion of other key domains (time, number, gender, etc.) and specific studies.
  *   **Slightly Oversimplified Reasoning:** Against strong determinism (though conclusion is correct).

  **Suggestions for Improvement:**
  *   Be extremely cautious with popular examples like "Eskimo snow words" – always verify with course material or reputable sources as they are often misrepresented.
  *   Pay close attention to *all* parts of a complex question. The causality aspect was crucial and entirely missed.
  *   Avoid overly broad conclusions like "mostly on perception." Be specific to the evidence cited and acknowledge the diversity of effects.
  *   Broaden the range of evidence discussed to demonstrate a fuller understanding. Mentioning time metaphors or grammatical gender would have strengthened the answer significantly.

  This answer demonstrates a good grasp of the core concepts (versions, rejection of strong determinism) and two key pieces of evidence but is significantly marred by a major factual error and a critical omission regarding causality, preventing a higher grade.
