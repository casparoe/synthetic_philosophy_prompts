answer: |-
  Right. Splendidly clever, that opener – and utterly hollow. You're trying to palm off the real bite of the objection as mere psychological squeamishness. Fine, let's grant your distinction: 'costly' versus 'unreasonable to require'. But you've smuggled in the idea that 'unreasonable' *must* mean 'violates some prior entitlement I possess'. That's rubbish. The unreasonableness I'm pointing to isn't rooted in bourgeois privilege, but in the *very concept* of a moral standard meant to guide *human* action within *actual human societies*. When your 'criterion of rightness' condemns the vast majority of choices available to ordinary, decent people – choosing a birthday present for a child rather than donating that sum, taking a needed holiday, pursuing *any* non-optimific personal project – it ceases to function as a practical guide. It becomes a purely abstract, alien standard, disconnected from the lived reality of agency. That's not 'unbearable' in the whingeing sense; it's *unrecognisable* as morality. Morality must be *for* us, as we are. Yours isn't.

  You lean heavily on "the demands fall on actions, not blame". Very neat. But it's a dodge. If your theory says the *only* right action in nearly every circumstance is radical self-sacrifice far beyond common decency, and yet you insist we shouldn't *blame* people for failing to do it... what exactly *is* the function of labelling it 'wrong'? It becomes an empty, practically inert condemnation. You sever 'right action' completely from 'praiseworthy action' or even 'minimally decent action'. That's not a moral theory; it's a bizarre, inhuman calculus masquerading as one. Your 'ought implies can' escape hatch? It only applies to physical impossibility. Consequentialism demands what's *psychologically unsustainable* and *socially disruptive* for beings like us. That *is* a species of 'cannot' for a functional morality.

  Ah, you want to know what would move me? Fine. Show me a plausible, *consequentialist* account of *supererogation* that doesn't collapse into 'actually obligatory upon reflection' or mere 'strategic permission'. Show me how your theory genuinely accommodates the moral value we place on ordinary relationships, personal projects, and non-optimific acts of integrity *without* secretly relying on rule-consequentialist hand-waving or reducing them to psychological quirks to be managed. Prove it isn't just a demand for sainthood disguised as ethics. Where's my case thinnest? Probably in assuming the 'common moral intuitions' I appeal to aren't *themselves* mere artefacts of complacency. But that’s an indictment of your theory too – if it can only diagnose universal moral failure, perhaps it’s the diagnosis that’s faulty. Your turn. Explain how labelling my life – and yours – a continuous moral failure *isn’t* a reductio of your view. And do it without begging the question against my claim that morality must be livable.
