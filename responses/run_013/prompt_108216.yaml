prompt: |-
  My clinic does asylum casework and I'm trying to guess what our appeals chamber will do with a new file before I write the submission, so I need the rule the chamber has actually been running, not the one it says it runs. Heres the log from the last two years, as best I can reconstruct it. The chamber isn't bound by outside case law and mostly ignores it, so don't worry about what some other court somewhere held.

  - woman beaten by her ex-husband, local police told her it was a family matter and wouldn't take a report: refugee status.
  - shopkeeper in a district taken over by an armed gang, extorted weekly, beaten once, police never came: allowed to stay, but only on the lesser protection ground, not as a refugee, on the reasoning that the gang wasn't after him for who he is.
  - conscript who refused to redeploy to a unit that was massacring civilians in his home province, and who faces years in prison for it: refugee status.
  - young man from an ethnic group the state won't issue ID papers to, so he can't work legally and can't register a marriage, no violence at all: refugee status.
  - gay man from a country where it's criminalised but prosecutions are rare and he's never been touched by police: refugee status.
  - student organiser held over a weekend, released without charge, told to stop; he stopped, the party's rallies have gone unbothered for a year: refused.
  - family who came overland through a neighbouring country where they had no ties, no right to work, and would've been parked in a camp for years: chamber said it wouldn't send them back there.
  - man who'd already been given protection in a third country and travelled on: refused and sent back.

  New file: a man from a group the government is clearing out of a resource-rich province. Police bulldozed his village last year, he lost the farm, and the government has announced the whole group has to move to a resettlement site; nobody has been detained or beaten. He came here overland through a neighbouring country where his brother has a work permit and has offered to take him in, and he's got an uncle back in his own capital who's lived there ten years with no trouble and says he can get him a job.

  What do you think the chamber does with him? I'm less interested in the answer than in the rules that fit the log -- I can see at least three that fit it and they don't agree about him -- what each one predicts, which you'd put money on and why, and which single extra case would tell me whether I've got the chamber's real rule or just a story I like. If the log genuinely undertermines it, say so, and tell me what I'd be betting on either way. Also: does any of this turn on who else could take him in, or is the chamber only ever asking who counts? I can't tell from the log and it definately matters for how I write the facts up.
reasoning: |-
  We are given a log of cases and their outcomes, and we need to infer the rule(s) the chamber uses to decide. Then we apply it to the new case and discuss.

  First, let's summarize the cases:

  1. **Case 1**: Woman beaten by ex-husband, police refused to help (called it a family matter). **Outcome**: Refugee status.
  2. **Case 2**: Shopkeeper extorted and beaten by an armed gang, police never came. **Outcome**: Allowed to stay on lesser protection (not refugee) because the gang wasn't targeting him for who he is.
  3. **Case 3**: Conscript who refused to participate in massacring civilians, faces prison. **Outcome**: Refugee status.
  4. **Case 4**: Young man from an ethnic group denied ID papers (can't work or marry legally), no violence. **Outcome**: Refugee status.
  5. **Case 5**: Gay man from a country where being gay is criminalized but prosecutions are rare, never personally targeted. **Outcome**: Refugee status.
  6. **Case 6**: Student organizer held over a weekend, released without charge, told to stop; he stopped and rallies have been unbothered for a year. **Outcome**: Refused.
  7. **Case 7**: Family who transited through a neighboring country where they had no ties, no right to work, and would be in a camp for years. **Outcome**: Not sent back to that country (so allowed to stay? but note: the outcome is about not sending back to the transit country, not necessarily granting status in the current country? However, the context is asylum, so likely they were granted some form of protection to avoid being sent to the transit country).
  8. **Case 8**: Man who already had protection in a third country and travelled on. **Outcome**: Refused and sent back to that third country.

  Now, the new case:

  - Man from a group being cleared out of a resource-rich province. Police bulldozed his village, he lost his farm, and the government has announced the whole group must move to a resettlement site. No detentions or beatings.
  - He came through a neighboring country where his brother has a work permit and has offered to take him in. Also, he has an uncle in his own capital (back home) who has lived there 10 years without trouble and can get him a job.

  We are to determine what the chamber does and the rule that fits the log.

  **Step 1: Inferring the Rules**

  We look for patterns in the granted cases versus the denied ones.

  **Refugee Status Granted (Cases 1, 3, 4, 5):**

  - Case 1: Persecution by non-state actor (ex-husband) with state unwillingness to protect (police refusal). Also, note the reason for persecution: domestic violence, which may be seen as persecution based on membership in a particular social group (women in that society?).
  - Case 3: Persecution by the state (or state-like actor) for refusal to commit war crimes. This is a matter of conscience and could be seen as political opinion or membership in a particular social group (conscientious objectors?).
  - Case 4: Persecution by the state (denial of ID papers) leading to severe restrictions on life (work, marriage). The reason is ethnicity (ethnic group). This is state persecution based on ethnicity.
  - Case 5: Persecution risk due to criminalization of being gay, even without past prosecution. This is based on membership in a particular social group (LGBTQ+). The chamber seems to accept that the existence of the law creates a risk, even if prosecutions are rare.

  **Not Refugee Status but Allowed on Lesser Ground (Case 2):**

  - Case 2: Victim of crime by non-state actors (armed gang) but the gang was not targeting him for a protected ground (like race, religion, etc.). So, the chamber sees this as general crime, not persecution for a Convention reason. Hence, not refugee but allowed on a complementary protection ground (likely because returning would put him at risk of serious harm, but not for a Convention reason).

  **Refused (Cases 6 and 8):**

  - Case 6: Past detention (over a weekend) but no charges and no further incidents after he stopped organizing. The chamber likely found no ongoing risk or well-founded fear. Also, the state's action (detention) was to stop the organizing, and once he stopped, the threat ceased.
  - Case 8: Already had protection in a third country. The chamber sent him back to that country.

  **Case 7: Not sent back to transit country**

  - This case is about the principle of non-refoulement to a country where they would face hardship (being in a camp for years without right to work). This is not about the merits of their asylum claim in the current country, but about not returning them to the transit country. However, the outcome implies they were allowed to stay in the current country.

  **Patterns for Refugee Status:**

  The chamber grants refugee status when:
  - There is persecution (or risk of persecution) for a Convention reason (race, religion, nationality, political opinion, or membership in a particular social group).
  - The persecution can be by the state or non-state actors if the state is unwilling or unable to protect.
  - The risk must be well-founded (not speculative or past with no ongoing risk).

  **In the granted cases:**

  - Case 1: Persecution for being a woman (social group) by non-state actor with state unwilling to protect.
  - Case 3: Persecution for political opinion (or conscience) by the state.
  - Case 4: Persecution for ethnicity (race) by the state.
  - Case 5: Persecution for sexual orientation (social group) by the state (via criminal law) even without past incidents.

  **Case 2 was denied refugee status because the harm was not for a Convention reason.**

  **Case 6 was denied because there was no ongoing risk (he stopped and the threat ceased).**

  **Case 7 is about non-refoulement to an unsafe third country, not about the refugee status per se.**

  **Case 8 was denied because of the safe third country principle (he already had protection elsewhere).**

  **Step 2: Applying to the new case**

  **New Case Facts:**

  - Group being cleared out of a resource-rich province by the government (state actor). Actions: bulldozed village, loss of farm, forced relocation to a resettlement site. No violence (no beatings or detentions).
  - Reason: The government is clearing out the group (so the reason is membership in that group, which could be ethnic, racial, or social?).
  - He has two potential safe havens:
    1. Neighboring country (transit) where his brother has a work permit and has offered to take him in.
    2. His own capital (back home) where his uncle has lived without trouble and can get him a job.

  **Questions:**

  1. Does the forced relocation constitute persecution for a Convention reason?
  2. Is there a well-founded fear of future persecution?
  3. Are the internal relocation options (within his home country) or the third country (neighboring) available and safe?

  **Analysis of Persecution:**

  - The government's actions (bulldozing, forced relocation) are state actions. The reason is membership in a particular group (the group being cleared). This group might be defined by ethnicity, race, or even social group (e.g., indigenous people in the resource-rich area). This is similar to Case 4 (ethnic group denied ID) and Case 5 (criminalized group) in that the state is targeting a group.
  - However, note that in Case 4, the harm was denial of rights (work, marriage) and in Case 5, the harm was the risk of prosecution. Here, the harm is forced displacement and loss of property. Is that persecution? The UNHCR Handbook defines persecution as including severe violations of human rights. Forced displacement can be persecution if it is discriminatory and severe.

  - But note: Case 6 had a temporary detention and then no issues. In the new case, the harm has already occurred (village bulldozed) and the future harm is forced relocation to a resettlement site. Is that ongoing persecution? The government has announced the whole group must move. If he returns, he would be forced to relocate. That would be an ongoing violation.

  **Convention Reason**: The key is whether the group is defined by a Convention ground (race, religion, nationality, political opinion, or social group). The case says "a group the government is clearing out". Without more, we can assume it is for a Convention reason (like ethnicity) because in Case 4 (ethnic group) and Case 5 (LGBTQ+), they were granted. If it were just economic development without discrimination, it might not be. But the case says "the whole group", implying a particular group. So likely, it is for a Convention reason.

  **Internal Flight Alternative (IFA) or Safe Third Country?**

  - The chamber might consider whether he can safely relocate within his own country or to a third country.

  - Case 7: The chamber refused to send the family back to the transit country because they would be parked in a camp without right to work. So, that country was not safe.

  - Case 8: The man was sent back to the third country where he already had protection.

  - In the new case, he has two options:

    a) **Internal relocation**: His uncle in the capital has lived without trouble and can get him a job. This would be an Internal Flight Alternative (IFA). If the capital is safe and he can live there without fear of persecution, then he might not be granted refugee status. However, note that in Case 4, the person was from an ethnic group denied ID papers. If the uncle in the capital is from the same ethnic group and has lived without trouble, that suggests that in the capital, the ethnic group is not persecuted. But wait: in Case 4, the state denied ID papers to the ethnic group, which would likely affect them nationwide? The log doesn't say. However, in the new case, the uncle has lived in the capital for 10 years without trouble. So, if the persecution is localized to the province, then the capital might be safe.

    b) **Third country**: The neighboring country where his brother has a work permit and has offered to take him in. But note: the brother has a work permit, which might not extend to the applicant. Also, the log in Case 7 shows the chamber won't send someone to a country where they have no right to work and would be in a camp. Here, the brother has offered to take him in, so he might not be in a camp. However, does he have the right to live and work there? The brother has a work permit, but the applicant would need his own status. The log doesn't tell us about the third country's policies. But if the brother can sponsor him or if he can get a permit, then it might be safe.

  **Chamber's Approach to Internal Relocation and Safe Third Countries:**

  - The chamber seems to consider these factors:

    - For internal relocation (Case 4?): In Case 4, the person was granted refugee status even though there might have been internal relocation options? We don't know if that was argued. But in the new case, we have explicit information about the uncle.

    - In Case 7, the transit country was not safe because of the conditions (camp, no work). So the chamber looks at the conditions in the third country.

    - In Case 8, the third country was safe because he already had protection there.

  **Predictions:**

  We have at least three rules that fit the log? Let's outline them:

  **Rule A (Strict Convention Reason with Persecution Severity):**

  - Refugee status is granted when there is a well-founded fear of persecution for a Convention reason, and the persecution is severe (violence, denial of basic rights, etc.). 
  - Internal relocation is considered only if it is reasonable and safe.
  - Safe third country applies only if the person has protection there or can legally stay.

  For the new case:
  - Persecution: Forced displacement and loss of property for being in a particular group (Convention reason). Severity: high (loss of home and livelihood). 
  - Internal relocation: The capital might be safe (uncle has lived there without trouble). But note: the government is clearing the entire group. Would the government pursue him in the capital? The case doesn't say. If the uncle is from the same group and has lived without trouble, then the capital might be safe. So IFA might be available.
  - Third country: The neighboring country: brother can take him in, but we don't know if he can get legal status. Without that, it might be like Case 7 (no right to work, so not safe). But Case 8 had protection and was sent back. So if the brother's offer doesn't confer legal status, then the third country might not be safe.

  Prediction: Chamber might refuse refugee status if they find the internal relocation (capital) is safe and reasonable. Alternatively, they might grant if they find the group is persecuted nationwide.

  **Rule B (Broader Harm Approach):**

  - Refugee status is granted for any state-sponsored severe harm targeting a group (even without violence) if it is for a Convention reason. Internal relocation is not considered if the state is the persecutor and the harm is nationwide, but if the harm is localized and there is a safe area, then IFA applies.

  For the new case:
  - The harm is state-sponsored and for a group (Convention reason). But is it nationwide? The uncle in the capital is safe. So the harm might be localized to the province. Therefore, IFA (capital) is available and safe. Refugee status denied.

  **Rule C (Focus on State Action and Group Identity):**

  - Refugee status is granted when the state is the persecutor and the harm is based on group identity, regardless of the form of harm (even non-violent, as in Case 4 and 5). Internal relocation is only denied if the state persecutes the group nationwide.

  In the new case: The state is the persecutor, and the harm is based on group membership. But the uncle in the capital (same group?) is safe, so the persecution is not nationwide. Therefore, IFA exists, so no refugee status.

  **But note: In Case 4, the harm was nationwide (denial of ID papers) because it was a state policy? The log doesn't specify. In Case 5, the harm was nationwide (criminalization). So in those cases, internal relocation wouldn't help. In the new case, if the forced relocation is only in the province, then the capital might be safe.**

  **Which rule to bet on?**

  Looking at the log, the chamber granted refugee status in Case 4 and 5 without violence and for state policies that were nationwide. In the new case, the harm is localized (province) and the capital is safe (uncle). Therefore, the chamber might find internal relocation is reasonable and deny refugee status.

  But what about the third country? The chamber in Case 7 refused to send the family back to the transit country because they would be in a camp without work. In the new case, if the brother can take him in, he might not be in a camp. But the brother has a work permit, not necessarily residency that allows family reunification. We don't know. The chamber might find the third country is safe because he has family support and might get status. But Case 8 had protection and was sent back. This new applicant does not have protection in the third country yet. So the chamber might not consider the third country as safe.

  However, the main claim is about the home country. The chamber must first decide if the applicant has a well-founded fear of persecution in his home country. If there is an IFA (the capital), then they may deny.

  **Case 6:** The applicant stopped the activity and the threat ceased. Similarly, in the new case, if he moves to the capital, the threat of forced relocation in the province might not affect him. So the chamber might see the internal relocation as removing the threat.

  **Prediction:**

  I think the chamber will **deny refugee status** because of the internal flight alternative (the capital). They might also consider the third country, but the primary reason would be the IFA.

  **But wait:** The new case says "the government has announced the whole group has to move to a resettlement site." Does that mean that if he returns to his home country and goes to the capital, the government might still force him to the resettlement site? Or is the relocation only for those in the province? The case doesn't specify. If the order applies nationwide (i.e., all members of the group wherever they are must go to the resettlement site), then the capital is not safe. But the uncle has lived there for 10 years without trouble, which suggests that the order only applies to the province. So likely, the IFA is available.

  **Which single extra case would tell me the rule?**

  We need a case that tests the internal relocation alternative when there is state persecution.

  For example:

  - A case where an applicant faces persecution in one region of the country but has a safe haven in another region (like the capital) and the chamber's decision on that.

