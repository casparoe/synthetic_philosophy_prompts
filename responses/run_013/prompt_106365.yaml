  **Final Design for the Activity**

  **General Setup:**
  - We will use points. Each round, players start with 100 points, and the round's transactions will adjust their points.
  - The game is played in one 90-minute session.

  **Round 1: Pre-commitment Round (Counterfactual Mugging variant)**
  - Materials: Policy cards (index cards), envelopes, a coin.
  - Steps:
    1. (5 min) The facilitator explains: "In this round, a coin will be flipped. Before the flip, you must write on the policy card whether you choose 'Pay' or 'Don't Pay' for the heads branch. Seal it in the envelope and write your name on it."
    2. (5 min) Players write and seal their policy.
    3. Facilitator flips the coin publicly.
    4. If heads:
       - Facilitator collects the envelopes and opens them.
       - Players who wrote "Pay" lose 10 points.
       - Players who wrote "Pay" receive a bonus of 30 points (net: 100 -10 +30 = 120).
       - Players who wrote "Don't Pay" keep 100 points.
    5. If tails:
       - Facilitator does not collect the envelopes yet.
       - (5 min) Facilitator asks: "You are in the tails branch. You have the option to pay 10 points. Do you want to pay voluntarily? Write your choice on a slip."
       - After players decide, facilitator collects the payment slips and the sealed envelopes.
       - Facilitator opens the envelopes and compares the pre-commitment to the actual choice.
       - Payoff:
         - If the player chose to pay and had pre-committed to "Pay", they get 100 -10 +30 = 120.
         - If the player chose to pay but had pre-committed to "Don't Pay", they get 100 -10 = 90.
         - If the player chose not to pay and had pre-committed to "Don't Pay", they get 100 +30 = 130.
         - If the player chose not to pay but had pre-committed to "Pay", they get 100.
  - Note: In tails, the actual choice to pay is voluntary and has no causal effect on the branch, but the consistency bonus creates an incentive to follow the pre-commitment.

  **Round 2: XOR Blackmail**
  - Materials: Coin for hidden bad state, message slips.
  - Steps:
    1. (5 min) Facilitator explains: "In this round, there is a hidden state (good or bad) determined by a coin flip. You must decide whether to pay a fee of 10 points. After you decide, you may receive a warning message based on your choice and the hidden state. The hidden state will affect your points."
    2. (5 min) Facilitator flips a coin for the bad state B (not revealed): B=1 (bad) or 0 (good).
    3. (5 min) Players decide whether to pay 10 points or not, writing their choice privately.
    4. For each player, the facilitator computes whether to send a message: send if B XOR P = 1, where P=1 if paid, else 0.
    5. Facilitator sends a message slip to players where applicable.
    6. Facilitator reveals B to all players.
    7. Payoff: 
       - All players start with 100 points.
       - If they paid, subtract 10.
       - If B=1, subtract 50.
  - So possible outcomes:
    - If B=0 and not paid: 100 points.
    - If B=0 and paid: 90 points.
    - If B=1 and not paid: 50 points.
    - If B=1 and paid: 40 points.
  - The message is sent if:
    - If paid and B=0, send message.
    - If not paid and B=1, send message.
  - The player sees the message or not after they decide, then learns B and their points.

  **Round 3: Nested Round**
  - Materials: Policy cards for each possible seed parity, a die or random number generator for the seed.
  - Steps:
    1. (5 min) Facilitator explains: "In this round, a public random seed will be revealed. Its parity (even or odd) will be used. Before the seed is revealed, you must write a policy for what you will do for each parity. For example, you will write: if even, then 'Pay' or 'Don't'; if odd, then 'Pay' or 'Don't'. Seal these in an envelope."
    2. (5 min) Players write their policy for even and for odd, seal it.
    3. Facilitator generates a public random seed (e.g., roll a die). Let parity = 0 if even, 1 if odd.
    4. (5 min) Facilitator asks players to choose whether to pay 10 points now, after seeing the seed.
    5. Players decide and write their actual choice.
    6. Facilitator collects the actual choices and the policy envelopes.
    7. For each player:
       - Let A = 1 if they paid, else 0.
       - XOR = A XOR parity.
       - Consistency: whether A matches their policy for the actual parity.
    8. Payoff: 
       - Base 100 points.
       - If XOR==0, they get a bonus of 50 points.
       - If they are consistent with their policy, they get a bonus of 30 points.
       - Additionally, if they paid, subtract 10 points.
  - So the net:
    - They always have 100.
    - If paid, -10.
    - If XOR==0, +50.
    - If consistent, +30.
  - Example: 
    - Seed even (parity=0): 
      - To have XOR=0, they should not pay (A=0).
      - If their policy for even is "Don't", and they don't pay, then they get 100 -0 +50 +30 = 180.
      - If their policy for even is "Don't", but they pay (A=1), then XOR=1 (no bonus), and not consistent (no 30), and they lose 10: 100 -10 = 90.
      - If their policy for even is "Pay", and they pay, then XOR=1 (0 XOR 1=1), so no 50, but they are consistent (+30) and lose 10: 100 -10 +30 = 120.
      - If their policy for even is "Pay", and they don't pay, then XOR=0 (0 XOR 0=0), so +50, but not consistent (no 30), and no payment: 100 +50 = 150.
    - So for even seed, the best is to not pay and have policy "Don't" for even (180), but if they have policy "Pay", then the best they can do is to follow it and get 120, or not follow and get 150. So if they have a policy of "Pay" for even, they are torn.

   Similarly for odd seed (parity=1):
     - To have XOR=0, they should pay (A=1) because 1 XOR 1=0.
     - If policy for odd is "Pay", and they pay: 100 -10 +50 +30 = 170.
     - If policy for odd is "Pay", and they don't: 100 +0 (XOR=1) +0 (inconsistent) = 100.
     - If policy for odd is "Don't", and they don't: 100 +0 (XOR=1) +30 = 130.
     - If policy for odd is "Don't", and they pay: 100 -10 +50 +0 (inconsistent) = 140.

   So for odd seed:
     - The best is to have policy "Pay" and then pay (170).
     - If they have policy "Don't", then paying gives 140, not paying gives 130, so they should pay even though it's against policy.

   Therefore, the players might set their policy optimally: for even, set "Don't"; for odd, set "Pay". Then after seeing the seed, they can follow the policy and get either 180 (even) or 170 (odd). But if they set the policy suboptimally, they have a tension between consistency and the XOR bonus.

   To create tension, we hope that some players set their policy to "Pay" for even and "Don't" for odd, which is suboptimal, and then in even seed they might choose to not pay (against policy) to get the XOR bonus.

  **Minute-by-minute Timeline:**
  - Total: 90 minutes.
  - Introduction (5 min): Explain the overall activity, that there are three rounds, points will be awarded, and converted to a small bonus.
  - Round 1 (25 min):
    - 5 min: Explain round 1 rules.
    - 5 min: Players write and seal policy.
    - 2 min: Coin flip.
    - 13 min: Branch execution (if heads: 5 min to open and record; if tails: 5 min for payment choice, 5 min to open and record, 3 min for payoff calculation).
  - Round 2 (15 min):
    - 5 min: Explain rules.
    - 5 min: Players decide on payment.
    - 5 min: Facilitator computes messages, distributes, reveals B, and calculates payoffs.
  - Round 3 (25 min):
    - 5 min: Explain rules.
    - 5 min: Players write policy for even and odd, seal.
    - 2 min: Generate public seed.
    - 5 min: Players decide on payment.
    - 8 min: Facilitator collects, opens policies, calculates payoffs.
  - Debrief (20 min): Discuss the rounds, map to decision theories, and reveal the names of the problems.

  **Debrief:**
  - Round 1 (Counterfactual Mugging variant): 
    - Causal reasoning: In tails, paying 10 points doesn't cause the heads branch to happen, so causal decision theory would say not to pay. However, in our setup, the consistency bonus creates a reason to pay if you pre-committed to pay. This bonus is a stand-in for the counterfactual consideration: in the heads branch, you would have gained from paying, and in tails, you are consistent with that. But note that in the standard counterfactual mugging, there is no consistency bonus; the reason to pay is because you care about the counterfactual.
    - Evidential reasoning: If you pay in tails, it is evidence that you are the type that pays in heads, which is good, but in our setup, we directly reward consistency.
    - Pre-commitment/Updateless: The pre-commitment round forces you to think from the prior perspective.
  - Round 2 (XOR Blackmail):
    - Causal: Paying doesn't cause the bad state to not occur; it's already fixed. So causal decision theory says not to pay (expected loss 25 for not paying vs 35 for paying).
    - Evidential: If you condition on not paying, then you are more likely to be in the bad state? But since the state is fixed, your action doesn't change it. However, if you were to condition on the act of not paying, it would be evidence that you are in the bad state, but that doesn't help at the time of decision. The disaster is that if you don't pay and then you receive a message, you know the bad state occurred, but you could have avoided that signal by paying? But in our setup, the message doesn't change the loss.
    - We must note in the debrief that the standard XOR blackmail involves updating on the message, but in our round, the message comes after the decision.
  - Round 3 (Nested): 
    - This round combines pre-commitment (policy) with the actual choice after the seed is revealed. The tension is between following your policy (consistency) and choosing the action that maximizes the XOR bonus. Causal decision theory would choose the action that maximizes immediate reward given the seed, ignoring the policy. But the policy might have been set to maximize the expected value from the prior perspective.

  **Predictable Problems and Handling:**
  1. Round 1, if the coin is heads, players who pre-committed to "Don't Pay" might feel left out because they get less. Reassure that the game is about experiencing the dilemma.
  2. In round 2, players might not understand the message rule. Explain with examples.
  3. In round 2, after seeing the expected loss, many players might choose not to pay. That's fine, it illustrates the causal view.
  4. In round 3, players might not understand how to write the policy. Provide an example: "For even: Pay; For odd: Don't Pay".
  5. Time management: The rounds might take longer than planned. Be flexible and cut short the decision time if needed.
  6. Recording payoffs: Have a spreadsheet or assistants to help calculate.

  **Explicit Note on What the Game Cannot Reproduce:**
  - In round 1 (counterfactual mugging), the game cannot reproduce the true counterfactual consideration because we introduced a consistency bonus to create an incentive. In the standard problem, there is no such bonus; the reason to pay in tails is solely to be the type that would have paid in heads, which is counterfactual and does not yield a direct payoff. The instructor must explain this in the debrief.

  **Summary:**
  Summary: The core mechanic is sealed pre-commitments followed by real choices that are compared to the pre-commitment for bonuses, combined with XOR conditions and hidden state revelations to create causal and evidential tensions.
