  ### Decision-Theory Seminar Activity: "Sealed Choices"

  **Objective:** Illustrate counterfactual mugging and XOR blackmail through lived dilemmas, emphasizing pre-commitment, causal vs. evidential reasoning, and timing. Students experience the tension between paying/refusing and see how choice timing alters reasoning.

  **Materials:**  
  - 32 policy cards (index cards)  
  - 16 envelopes  
  - 1 coin  
  - Random seed generator (e.g., 10-sided die)  
  - Message slips (small paper squares)  
  - Scoreboard (whiteboard/spreadsheet)  
  - Timer  

  **Roles:**  
  - **Facilitator (you):** Runs rounds, flips coins, sends messages, enforces rules.  
  - **Players (16 students):** Make sealed policies, real-time choices, and experience payoffs.  

  **Payoff Scheme:**  
  - **Starting points:** 100 per player per round.  
  - **Small fee:** 10 points (paid when choosing "pay").  
  - **Bonuses/penalties:**  
    - **Round 1:** Consistency bonus (30 points) if policy matches action in tails branch.  
    - **Round 2:** Disaster penalty (50 points) if bad state occurs.  
    - **Round 3:** XOR bonus (50 points) if actual payment XOR seed parity = 0; consistency bonus (30 points) if policy matches action.  
  - **Conversion:** Points convert to bonus participation credit (e.g., 100 points = 0.1% final grade). Stakes are real but low.  

  ---

  ### Rules and Rounds  
  **Round 1: Pre-Commitment Round (Counterfactual Mugging Variant)**  
  *Goal: Show causal inertness and evidential value of pre-commitment.*  
  1. **Setup (5 min):**  
     - Each player writes a policy card: "Pay" or "Don’t Pay" *if coin lands heads*.  
     - Cards sealed in envelopes, collected by facilitator.  
  2. **Coin flip (1 min):** Public fair coin flip (heads/tails).  
  3. **Outcome (5 min):**  
     - **Heads branch:** Envelopes opened. "Pay" players lose 10 points. No further action.  
     - **Tails branch:** Players offered chance to pay 10 points *voluntarily*. After decisions, envelopes opened.  
       - *Payoff in tails:*  
         - Pay + pre-committed "Pay" = 100 - 10 + 30 = 120  
         - Pay + pre-committed "Don’t" = 100 - 10 = 90  
         - Refuse + pre-committed "Don’t" = 100 + 30 = 130  
         - Refuse + pre-committed "Pay" = 100  

  **Round 2: XOR Round (XOR Blackmail Variant)**  
  *Goal: Show causal cleanliness vs. evidential disaster.*  
  1. **Setup (5 min):**  
     - Facilitator secretly flips coin for bad state (B: heads = bad, tails = good).  
  2. **Choice (3 min):**  
     - Players decide to pay 10 points or refuse *without knowing B*.  
  3. **Message & Outcome (7 min):**  
     - Facilitator sends message slip to a player *iff* (B XOR payment) = 1:  
       - *Pay:* Message sent only if B = good (state is good).  
       - *Refuse:* Message sent only if B = bad (state is bad).  
     - B revealed. Payoffs:  
       - Pay + B good = 100 - 10 = 90  
       - Pay + B bad = 100 - 10 - 50 = 40  
       - Refuse + B good = 100  
       - Refuse + B bad = 100 - 50 = 50  

  **Round 3: Nested Round**  
  *Goal: Combine pre-commitment, XOR, and timing.*  
  1. **Policy (5 min):**  
     - Players write two policy cards: "Pay" or "Don’t" *for even parity* and *for odd parity*. Sealed in envelopes.  
  2. **Seed reveal (2 min):**  
     - Public random seed generated (e.g., die roll). Parity: 0 (even) or 1 (odd).  
  3. **Choice (5 min):**  
     - Players decide to pay 10 points or refuse *after seeing parity*.  
  4. **Outcome (8 min):**  
     - Facilitator opens envelopes.  
     - Payoff factors:  
       - Actual payment (A: 0/1) XOR seed parity (P: 0/1).  
       - Consistency between policy and action.  
     - *Payoff formula:*  
       - Base: 100  
       - Pay: -10 points  
       - XOR=0: +50 points  
       - Policy matches action: +30 points  

  ---

  ### Minute-by-Minute Timeline  
  | Time      | Activity                                                                 | Notes                          |  
  |-----------|--------------------------------------------------------------------------|--------------------------------|  
  | 0-5 min   | **Intro:** Explain rules, points, and anonymity. Distribute materials.  | Emphasize no discussion.       |  
  | 5-15 min  | **Round 1 Setup + Policy:** Players write/seal pre-commitment cards.    | Collect envelopes immediately. |  
  | 15-16 min | **Round 1 Coin Flip:** Public flip.                                      | Dramatic!                      |  
  | 16-21 min | **Round 1 Outcome:** Execute heads/tails branch. Record scores.          | Keep tails payoffs hidden.     |  
  | 21-26 min | **Round 2 Setup:** Explain B state. Players decide pay/refuse.           | Collect choices secretly.      |  
  | 26-33 min | **Round 2 Outcome:** Send messages, reveal B, calculate payoffs.        | Highlight message triggers.    |  
  | 33-38 min | **Round 3 Setup:** Players write/seal parity policies.                  | Two cards per player.          |  
  | 38-40 min | **Round 3 Seed Reveal:** Roll die/public RNG, announce parity.          | Record parity publicly.        |  
  | 40-45 min | **Round 3 Choice:** Players decide pay/refuse post-seed.                | Collect choices.               |  
  | 45-53 min | **Round 3 Outcome:** Open envelopes, compute XOR + consistency.         | Use scoreboard for clarity.    |  
  | 53-73 min | **Debrief (20 min):** Map rounds to theories, reveal problem names.     | (Details below).               |  
  | 73-90 min | **Discussion + Q&A:** Students share experiences.                       | Tie to readings.               |  

  ---

  ### Debrief (20 min)  
  **Frame:** "Today’s dilemmas pit causal, evidential, and pre-commitment reasoning against each other."  

  1. **Round 1: Pre-Commitment as Updateless Control**  
     - **Causal:** In tails, paying is inert—it doesn’t change outcomes. Refusing is causally rational.  
     - **Evidential:** Paying in tails *reveals* you’d pay in heads, but only consistency is rewarded (not true counterfactual value).  
     - **Pre-commitment:** Policies bind you to act as your past self intended, creating tension when real-time choices feel "free."  
     - **Problem name:** Counterfactual mugging (variant).  

  2. **Round 2: Evidential Disaster vs. Causal Cleanliness**  
     - **Causal:** Refusing is clean—it doesn’t cause B. Paying is harmful (expected loss: 35 vs. 25 for refusing).  
     - **Evidential:** If you refuse, getting a message *reveals* B is bad (disaster), but this evidence comes too late for decisions.  
     - **Timing:** Choosing *before* knowing B or messages makes refusing seem safe, but messages haunt you afterward.  
     - **Problem name:** XOR blackmail.  

  3. **Round 3: Nested Tensions**  
     - **Pre-commitment:** Policies set before the seed aim to maximize expected payoff (e.g., policy "pay iff odd").  
     - **Correlation:** Seed parity and payment interact via XOR (A XOR P = 0 maximizes bonus).  
     - **Timing:** Real-time choice after seed reveal may deviate from policy (e.g., if seed even, deviating to "don’t pay" gives XOR=0).  
     - **Conflict:** Consistency bonus (policy) vs. XOR bonus (real-time) forces trade-offs.  

  **Key Insight:**  
  - Timing determines which reasons are "live." Pre-commitment favors updatelessness; real-time choices favor causal/evidential reasoning.  
  - In XOR blackmail, *refusing feels causally safe but evidentially dangerous*—this is the core tension.  

  ---

  ### Predictable Problems & Fixes  
  1. **Problem:** Round 1 tails branch causes confusion ("Why pay if it’s inert?").  
     - **Fix:** Stress *during setup* that payments are "voluntary with bonuses for consistency."  
  2. **Problem:** Round 2 messages overwhelm logistics (16 players × 2 conditions).  
     - **Fix:** Use pre-printed slips; recruit 2 students as helpers.  
  3. **Problem:** Round 3 policy ambiguity (players miswrite "even/odd").  
     - **Fix:** Provide policy templates: "If even: [ ] Pay / [ ] Don’t" and "If odd: [ ] Pay / [ ] Don’t."  
  4. **Problem:** Point calculations slow down rounds.  
     - **Fix:** Use a spreadsheet; project scores in real-time.  
  5. **Problem:** Students dismiss points as trivial.  
     - **Fix:** Remind them stakes are psychological—"Imagine this was real money."  

  **Explicit Limitation:**  
  - The game cannot reproduce the **true counterfactual value of being a 'type'** (e.g., paying in tails doesn’t *actually* reward your heads-self). In debrief, clarify: "Real counterfactual mugging hinges on valuing your *counterfactual identity*—something points can’t simulate. We used consistency bonuses as a proxy."  

  ---

  **Summary:** Players seal policies before random events, then make real choices that interact with hidden states and XOR conditions, forcing trade-offs between causal, evidential, and pre-commitment reasoning as timing shifts.
