  1. **Define θ and Units**  
     - **Question**: What is θ, its physical meaning, and units? What is an alternative parameterization φ = g(θ) (e.g., θ = failure rate λ, φ = MTTF = 1/λ)?  
     - **Good Enough**: Clear physical interpretation (e.g., "λ: failures/hour"). If no alternative φ exists, skip to Step 3.  
     - **Critical Check**: Compute p(φ) if p(θ) is uniform. If p(φ) is not uniform, **flag parameterization dependence**.  
     - **Action**: Proceed regardless. Flagged dependence will be resolved later.  

  2. **Impose Bounds**  
     - **Question**: What are hard physical bounds for θ? (e.g., λ > 0, 0 ≤ reliability ≤ 1).  
     - **Good Enough**: At least sign constraints (e.g., θ > 0). No bounds? Use [L, U] where L = practical lower (e.g., 1e-10), U = practical upper (e.g., 1e5). Document L/U as arbitrary.  
     - **Critical Check**: Does p(θ) assign >1% probability to implausible extremes? (e.g., λ > 1000/hr for a pump). If yes, tighten bounds.  
     - **Action**: Set θ ∈ [L, U]. Proceed to Step 3.  

  3. **Assess Symmetry**  
     - **Question**: Is there a transformation group (e.g., translation, scaling) under which the problem is invariant?  
     - **Good Enough**:  
       - **Location** (e.g., μ in Gaussian): Translation-invariant → Uniform.  
       - **Scale** (e.g., σ in Gaussian, λ): Scale-invariant → p(θ) ∝ 1/θ (log-uniform).  
       - **None**: Proceed to Step 4.  
     - **Action**: If symmetry exists, use invariant prior (uniform or log-uniform). **Skip remaining steps.**  

  4. **Handle Tails and Parameterization Dependence**  
     - **Question**: Was parameterization dependence flagged in Step 1? If yes, which parameterization has symmetry? If none, what tail behavior is acceptable?  
     - **Good Enough**:  
       - If θ or φ has symmetry (Step 3), use that prior.  
       - If no symmetry, use **bounded uniform** for θ if:  
         - Decision is insensitive to bounds (test L/U ± 50%).  
         - Tails are thin (e.g., P(θ > U/10) < 0.01).  
       - Else, **avoid flat prior**.  
     - **Critical Check**: Compute P(θ > K) for critical K (e.g., K = U/10). If P(θ > K) > 0.1, tails are heavy → reject uniform.  
     - **Action**: If uniform is rejected, proceed to Step 5.  

  5. **Value Judgment: Conservatism**  
     - **Question**: What is the cost of underestimating θ? (e.g., high for failure rates, low for yield).  
     - **Good Enough**: Stakeholder consensus on:  
       - "Conservative": Prioritize safety → use heavier-tailed prior (e.g., log-uniform for λ).  
       - "Neutral": Uniform.  
       - "Aggressive": Lighter tails → not recommended without data.  
     - **Action**: Choose prior based on conservatism. Document judgment.  

  6. **Final Checks**  
     - **Improper Prior?**: If unbounded and improper (e.g., p(θ) ∝ 1 for θ ∈ ℝ), reject. Bound θ.  
     - **Decision Robustness**: Vary L/U by ±50%. If decision (e.g., maintenance interval) changes >20%, **reject flat prior**.  
     - **Output**:  
       - Pass: Use chosen prior.  
       - Fail: Escalate to "Collect Data" or "Human Judgment".  

  7. **Documentation for Memo**  
     - If prior used: "Bounded [L, U] + symmetry/conservatism justification. Sensitive to [list assumptions]."  
     - If rejected: "Insufficient symmetry/bounds. Decision requires [data/expert judgment] due to [specific failure]."  

  ---

  ### **Case 1: Parameterization Dependence (Failure Rate vs. MTTF)**  
  **Context**: θ = failure rate λ (failures/hour). φ = MTTF = 1/λ (hours). No data.  
  - **Step 1**: λ > 0, units: failures/hour. φ = 1/λ. Uniform p(λ) ∝ 1 → p(φ) ∝ 1/φ² (non-uniform!). **Flagged dependence**.  
  - **Step 2**: Bounds λ ∈ [1e-6, 1] (1 failure/million hours to 1 failure/hour).  
  - **Step 3**: λ is a scale parameter → **invariance under scaling**. Use p(λ) ∝ 1/λ (log-uniform).  
  - **Steps 4–6**: Log-uniform resolves dependence. Conservative for high λ (failsures).  
  - **Result**: **Use p(λ) ∝ 1/λ on [1e-6, 1]**.  
  - **Report**: "Log-uniform prior for λ justified by scale invariance. Maintenance interval X hours. Sensitive to upper bound λ=1."  

  ---

  ### **Case 2: Flat Prior Fails (Absurd Tail)**  
  **Context**: θ = number of defects N in a batch. No data. Naive uniform prior on [0, 1000].  
  - **Step 1**: N ≥ 0, integer. No obvious alternative φ.  
  - **Step 2**: Bounds N ∈ [0, 1000] (arbitrary upper limit).  
  - **Step 3**: No symmetry (N is count, not location/scale).  
  - **Step 4**: **Critical Check**: P(N > 100) = 90% under uniform. Tails heavy → **reject uniform**.  
  - **Step 5**: Conservative? High N costly → need heavy tails, but uniform is too extreme.  
  - **Result**: **Avoid flat prior. Collect data or use human judgment.**  
  - **Why**: Uniform assigns 99.9% probability to N > 1, implying defects are guaranteed. Absurd for high-reliability systems.  
  - **Memo**: "Flat prior on defects gives P(N>100)=90%, inconsistent with engineering reality. No symmetry. Escalate to expert judgment."  

  ---

  ### **Case 3: Symmetry Succeeds (Location Parameter)**  
  **Context**: θ = clock drift rate μ (seconds/day). No data. System symmetric under time translation.  
  - **Step 1**: μ ∈ ℝ, units: seconds/day. φ = 1/μ (time to drift) → p(φ) ∝ 1/φ² if p(μ) uniform. **Flagged dependence**.  
  - **Step 2**: Bounds μ ∈ [-100, 100] (physically plausible).  
  - **Step 3**: **Translation invariance** → uniform p(μ) ∝ 1.  
  - **Steps 4–6**: Symmetry resolves dependence. Uniform acceptable.  
  - **Result**: **Use uniform p(μ) on [-100, 100]**.  
  - **Report**: "Uniform prior justified by translational symmetry. Drift rate μ ~ Unif[-100,100]. Maintenance interval Y hours."  

  ---

  ### **Case 4: Procedure Demands Data/Human**  
  **Context**: θ = corrosion rate R (mm/year) of a new alloy. No data, no analogous materials.  
  - **Step 1**: R > 0, units: mm/year. φ = log(R) → p(φ) uniform if p(R) log-uniform. **Flagged dependence**.  
  - **Step 2**: Bounds R ∈ [0.001, 10] (arbitrary: "hair to thumb/year").  
  - **Step 3**: No symmetry (R is neither location nor scale in this context).  
  - **Step 4**: **Critical Check**: P(R > 1) = 99.9% under uniform, P(R > 1) = 50% under log-uniform. Decision (coating thickness) changes 3x → **reject both**.  
  - **Result**: **Collect data or human judgment**.  
  - **Why**: No symmetry, heavy tails, and arbitrary bounds dominate decision.  
  - **Memo**: "No invariant prior for R. Bounds arbitrary; P(R>1) varies 50–99.9%. Decision requires accelerated testing or SME estimate."  

  ---

  ### **When the Procedure Misfires**  
  - **Overconfidence in symmetry**: Assumed symmetry may not hold (e.g., treating a near-boundary parameter as unbounded).  
  - **Bounds dominate**: Decisions sensitive to arbitrary L/U. Mitigation: Use log-uniform for scale parameters.  
  - **Missed conservatism**: Log-uniform may still be too heavy-tailed for extreme risks (e.g., nuclear safety). Always test P(θ > K).  
  - **Speed trade-off**: Bounds/symmetry checks take 5–10 minutes; skipping them risks indefensible priors.  

  ### **Key Takeaways**  
  - **Never use flat priors without**: (1) Bounds, (2) Symmetry check, (3) Tail test.  
  - **When in doubt**: Default to log-uniform for positive parameters (scale-invariant), demand data, or escalate.  
  - **Defensibility**: Document bounds, symmetry, and conservatism logic. Show robustness tests.  

  This procedure forces explicit trade-offs between objectivity and judgment. In your design review, Case 1’s log-uniform prior would have been defensible; Case 2’s uniform prior would have been caught. Use it as a "prior checklist" to preempt criticism.
