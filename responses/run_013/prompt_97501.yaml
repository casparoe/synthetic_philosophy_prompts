prompt: |-
  Some friends and I got into it at dinner the other night about whether everyday social conventions are real moral obligations or just etiquette with teeth, and since then I've been writing down my gut reactions to cases to see if they add up to any one principle. Here's my list. Tipping 18-20% at a sit-down restaurant in the US with normal service: obligatory, I'd feel I'd done something wrong by skipping it. Tapping the 'no tip' button on the tablet at a coffee counter where I ordered standing up: completely fine, zero guilt. Tipping the hotel housekeeper: I feel I ought to and forget half the time and don't feel like a criminal about it. Crossing an empty street at 3am against the light with no car within three blocks: fine. Slipping across mid-block on a four-lane road at rush hour, weaving between cars: not fine, I'd think less of someone who did it. Cutting to the front of a long airport security line because I'm about to miss a flight: wrong, but the kind of wrong I'd do anyway and apologize for. Holding a place in line for a friend who's still parking: fine at a food truck, not fine at the DMV, and I honestly can't say what the difference is supposed to be. Zipper-merging in traffic and refusing to let the next car in: you're a jerk, but I don't think you've violated an obligation to anyone. Splitting a restaurant bill evenly when I ordered the cheap thing: mildly annoying, not a wrong.

  The cases that made me actually start writing this down are the visitor ones, because they're where my gut goes weird. A tourist from a country where nobody tips, not tipping at a US restaurant: I think they're genuinely in the wrong, even though nobody told them, and even though the norm is stupid and the employer should just pay the staff properly. But a tourist in a place where you're expected to haggle over every price, who pays the first asking price and walks out: I don't think they've done anything wrong at all, even though they've broken the local convention and the seller was expecting the game. Someone visiting a country where you push onto the bus rather than form a line, standing patiently and waiting their turn: fine, obviously fine, arguably better than fine. So it clearly can't just be that you do whatever the locals do, and it also can't just be that conventions never bind visitors, since I do think the non-tipping tourist owes something. The half-baked principle I've been trying is this: a convention is a real obligation when it's the mechanism by which somebody actually gets paid or gets their turn, so that quietly skipping it transfers something from them to you, and it's mere etiquette when the only cost of skipping it is a raised eyebrow. That maybe handles the tip screen and the queue-cutting, but it seems to say the non-tipping tourist is fine, since they didn't take anything, they just failed to give, which contradicts my gut.

  So what I want from you is the principle that actually fits the verdicts I've given, stated precisely enough that I could apply it myself to a case I haven't thought of, plus an honest note on which of my verdicts it forces me to give up. I'd much rather learn that one or two of my reactions are just inconsistent than get a principle so padded with exceptions that it fits everything and predicts nothing, and if the best you can do is two competing principles that each save most of the list, say which verdicts each one sacrifices. Two further cases I'd like it to pronounce on: (a) a visitor who follows their home country's custom in a way that offends locals without harming anyone, say blowing their nose at the table or keeping their shoes on in a house where everyone takes them off, and (b) a local convention that's basically a racket, like a 'service charge' the manager pockets or a queue that exists only because the office is understaffed, where I'd like to know whether I still owe it or whether the obligation dies with the legitimacy of the practice.
reasoning: |-
  Okay, the user has presented a fascinating ethical dilemma that blends social norms, moral obligations, and cultural relativism. They've cataloged their intuitive judgments across various scenarios—tipping, queue etiquette, traffic behavior—and are seeking a unifying principle that explains their reactions without contradictions. 

  What's particularly interesting is how their intuitions diverge for visitors: they hold tourists accountable for not tipping in the US (despite it being a flawed system) but absolve them for failing to haggle elsewhere. The user's proposed "transfer of value" theory almost works but fails on that tipping case. 

  Hmm... their core struggle seems to be distinguishing between:
  - Conventions that protect someone's tangible interests (like income or safety) 
  - Those that merely coordinate behavior neutrally
  - And conventions that actively exploit people

  The visitor cases reveal deeper layers too—they're wrestling with whether moral obligations require knowledge/consent (hence discomfort about blaming unaware tourists) versus harm being objective. 

  For the two bonus cases:
  - The nose-blowing/shoes scenario feels like pure coordination norm (no victim, so no obligation) 
  - The racket scenario is trickier—if the "fee" outright steals from workers, does compliance become complicity? 

  Their intellectual honesty is refreshing: they actively want their inconsistencies exposed. This isn't someone seeking validation but rigorous analysis. I should prioritize clarity over diplomatic phrasing—they'd resent soft-pedaling.
answer: |-
  Here's a principle that fits your verdicts while exposing one key inconsistency, plus analysis of the bonus cases:

  **The Cooperative Burden Principle:** *A social convention creates a genuine moral obligation when both (1) the convention coordinates behavior to achieve a collectively beneficial outcome (e.g., fair distribution, efficient flow, income security), and (2) violating it imposes a disproportionate burden or harm on specific, identifiable individuals who reasonably rely on the convention, rather than merely inconveniencing the group or system.*

  **How It Explains Your Verdicts:**

  1.  **Tipping (Sit-down US Restaurant):** **Obligatory.** (1) Coordinates income for service staff (collective benefit: liveable wages). (2) Skipping it directly harms the *specific server* who served you and relies on tips for income. The burden is disproportionate and specific.
  2.  **Tipping (Coffee Counter Tablet):** **Fine.** (1) May coordinate *some* extra income. (2) Violating ("No Tip") doesn't harm a *specific, identifiable individual* who served you *relying* on that tip *specifically* for core income in the same direct, structured way. Burden is diffuse/systemic. (Raised eyebrows fit).
  3.  **Tipping Hotel Housekeeper:** **Ought-to (weak), but no guilt.** (1) Coordinates supplemental income. (2) Harm to the *specific* housekeeper cleaning *your* room is identifiable *but* less direct/structured than restaurant tipping. Reliance is weaker (many don't tip, wages may be structured differently). Explains the "ought" (potential harm) and lack of guilt (less direct reliance, weaker convention).
  4.  **Jaywalking (Empty 3am Street):** **Fine.** (1) Safety coordination. (2) No identifiable individual harmed or burdened. System inconvenience is negligible.
  5.  **Jaywalking (Rush Hour):** **Not Fine.** (1) Safety/efficiency coordination. (2) Violation imposes direct, disproportionate burden/safety risk on *specific* drivers (must brake/swerve) and potentially harms yourself/others.
  6.  **Cutting Airport Security:** **Wrong.** (1) Fairness/efficiency coordination. (2) Violation imposes disproportionate burden on *specific individuals* (the people immediately behind you) who waited their turn. You gain time at their direct expense.
  7.  **Holding Place (Food Truck):** **Fine.** (1) Mild coordination. (2) Burden on others is diffuse, minor delay. No *specific, disproportionate* harm to identifiable individuals behind you.
  8.  **Holding Place (DMV):** **Not Fine.** (1) Stronger fairness coordination due to long waits/importance. (2) Burden is concentrated on the *specific individual(s)* immediately behind the held spot, whose wait is measurably increased. Disproportionate gain for your friend at their expense.
  9.  **Zipper Merging (Refusing to let in):** **Jerk, but not Obligation Violation.** (1) Efficiency coordination. (2) Refusing *one* car burdens the *system* (slows overall flow) and *that specific driver*, but the harm (minor delay) isn't usually disproportionate to the "gain" (saving one car length). It's inefficient and selfish, but doesn't typically *transfer* a significant burden *directly* onto them in a way that breaks reliance (the system absorbs it messily). Hence jerk, not violator.
  10. **Splitting Bill Unevenly:** **Annoying, not Wrong.** (1) Convenience coordination. (2) Burden is diffuse across the group paying more; no *specific, identifiable* person is harmed disproportionately *relying* on the split (they agreed to the mechanism). It's unfair, but the harm isn't concentrated on one victim.
  11. **Tourist Not Tipping (US):** **Wrong.** (1) Income coordination. (2) Violation *directly harms the specific server* who served them, who relies on tips regardless of the tourist's knowledge. The burden (lost wages) is disproportionate and concrete.
  12. **Tourist Not Haggling:** **Not Wrong.** (1) Price discovery coordination. (2) Paying asking price doesn't harm the *specific seller*; it actually benefits them immediately! The "harm" (missing out on *potential* higher profit via haggling) is hypothetical, not a concrete loss. They got their expected minimum. No reliance broken.
  13. **Tourist Queuing (Push Culture):** **Fine (Better).** (1) Efficiency coordination (debated methods). (2) Queuing in a push culture inconveniences the *system* and might annoy locals, but doesn't impose a *disproportionate, concrete burden* on specific individuals relying on pushing. It might even be *more* fair (less advantage to aggressive pushers). No specific harm, just inefficiency/annoyance.

  **The Inconsistency Exposed:**

  *   **Your Gut vs. The Principle on "Failure to Give":** Your principle ("transfer something from them to you") clashes with your gut on the non-tipping tourist because skipping a tip is a *failure to give*, not a *taking*. The Cooperative Burden Principle resolves this: the server *relies* on the tip as part of their income structure. By accepting service under that convention, you incur an obligation. Skipping the tip *harms* them by depriving them of expected, relied-upon compensation. It's not just failing to give charity; it's reneging on an implicit term of the service interaction within that system. The "harm" is the deprivation of expected compensation, making it more than just a failure to give.

  **Bonus Case Pronouncements:**

  *   **(a) Visitor Following Offensive Home Custom (Nose-blowing/Shoes):**
      *   **Verdict:** Not morally wrong (though potentially rude/inconsiderate).
      *   **Why:** (1) Convention coordinates hygiene/respect. (2) Violation (by visitor) might offend or disgust locals, but this offense is diffuse cultural discomfort, not a *disproportionate, concrete harm* to specific individuals relying on the norm. Locals aren't *harmed* in a concrete way (like losing income or safety); they're offended. This falls under "mere etiquette" (raised eyebrows, social friction) under the principle. The obligation to avoid offense exists but is weaker than obligations preventing concrete harm. The visitor *should* try to learn, but violating this isn't a *moral wrong* on par with skipping a tip or cutting in line.
  *   **(b) Local Racket Convention (Bogus Fee/Unnecessary Queue):**
      *   **Verdict:** No moral obligation to comply; obligation may even be *not* to comply if it enables exploitation.
      *   **Why:** The principle requires a *collectively beneficial outcome*. A racket primarily benefits the exploiter (manager). (1) **Bogus Fee:** The "coordination" is illusory; it doesn't achieve fairness or income security for workers (if the manager pockets it). Complying harms *yourself* (paying extra) and potentially *reinforces the exploitative system*. No obligation exists; the convention lacks legitimacy because it fails condition (1). (2) **Unnecessary Queue (due to understaffing):** The queue coordinates fairness *only* because of the office's failure. While jumping it might burden specific individuals immediately behind you, the *collectively beneficial outcome* (fairness) exists only as a patch for mismanagement. The *real* harm is caused by the understaffing. Compliance upholds a flawed system. While jumping might be rude/jerkish (imposing on specific others), the *moral obligation to the convention itself* dissolves because the convention doesn't serve a genuine collective benefit – it's a symptom of a problem. Alternative actions (complaining, supporting reform) might be better, but blind adherence isn't obligatory.

  **Conclusion:**

  The **Cooperative Burden Principle** fits almost all your verdicts precisely. It forces you to give up the idea that the non-tipping tourist is *only* "failing to give" and not causing harm – under this principle, they *are* harming the specific server by depriving them of relied-upon compensation within the established (even if flawed) system. It cleanly distinguishes obligations rooted in preventing concrete harm to specific, reliant individuals within a beneficial coordination scheme from etiquette, inefficiency, or systemic unfairness. For the bonus cases, it clearly places offensive customs in the etiquette realm and delegitimizes obligations stemming from exploitative or dysfunctional conventions.
