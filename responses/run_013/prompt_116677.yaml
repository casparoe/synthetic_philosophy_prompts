  I need to build this thought experiment carefully. The user wants me to act as a philosopher of law specializing in transitional justice. The case must be entirely fictional - I can't use any real countries, people, or events. It should be small-scale with just a few characters: one perpetrator, one or two victims, and one or two officials. Everyone must agree the crime was serious, so the argument can't depend on how bad the crime was or whether people are sympathetic.

  Crucially, the amnesty must be conditional on full public disclosure that creates the only surviving record of what happened. I need to show three different verdicts: retributive justice must oppose it, consequentialist justice must support it, and restorative justice must oppose it for structural reasons - not because the process was botched.

  I'll start by sketching some candidate structures. First, I might think about a case with a written confession that becomes the only record. But this might fail because a written document could be seen as insufficiently relational. Another idea is having a public testimony that the victim rejects. But this might violate the constraint that nothing should imply the process is degrading. A third option could involve a perpetrator's testimony that replaces the victim's narrative, but this could make the victim unsympathetic, which isn't allowed.

