prompt: |-
  ok so this has abruptly become my problem and I need to think it through properly. I'm a paralegal at a small human rights outfit and I've ended up on a working group pushing for a special tribunal to prosecute aggression over the invasion of Ukraine — the ICC can't reach it for jurisdictional reasons, so there's a campaign for a separate court, and the whole thing keeps running into the objection that you can't try people for something that wasn't a crime when they did it. Every time that comes up, someone in the room says "Nuremberg, it's settled" and we move on. I've started to suspect that phrase is carrying a lot of weight nobody has actually checked.

  So take the actual practice at Nuremberg and Tokyo — not the speeches about them, the practice. They charged and convicted people for waging aggressive war when that wasn't a crime in any treaty or statute you could have pointed to at the time; the novelty of the charge was the whole point. They more or less refused to let a defendant say he was only following orders. They gave themselves a charter, defence counsel, rules of evidence, the full apparatus of a court. And the crimes-against-humanity count only reached atrocities tied to the war itself, so the same mass murder committed in peacetime would have been nobody's business — which is a strange line to draw if the point is that certain acts are wrong no matter what. Meanwhile the people who set the whole thing up had, on their own side, done plenty that looked a lot like what was in the indictment, and nobody was ever going to try an Allied air marshal for area bombing.

  What I want from you is the philosophical commitments this practice presupposes. Not a history. Which views about law does it only make sense under — does it need there to be some law above the enacted law that reason can find on its own, i.e. does it quietly require that legal positivism is false in at least some cases, or can a positivist who thinks validity just is whatever the rule of recognition says absorb the whole thing without embarassment? Does refusing the superior-orders defence commit it to a particular view about individual moral responsibility inside institutions, and if so which one? What does that peacetime/wartime line presuppose about sovereignty — that what a state does to its own is only the world's concern once the state has broken the peace? And the selective enforcement: does the practice presuppose that law's authority depends on being applied impartially to everyone, in which case it refutes itself, or is impartiality a separate commitment it doesn't actually need?

  Then tell me where the practice is underdetermined — which parts several different theories would equally license, and which parts it genuinely forces — and what actually changes downstream if you swap the presupposed view for a rival. Does our special-tribunal campaign lose something, or gain?

  Be committed. Don't lay out five positions and tell me to pick; tell me which reconstruction you'd actually defend and why, and where you'd bet against yourself.
reasoning: |-
  Okay, this paralegal is diving deep into the philosophical underpinnings of the Nuremberg and Tokyo tribunals. They're clearly frustrated with the glib "Nuremberg settled it" rhetoric in their human rights workgroup and want to dissect what those trials actually presupposed about law and morality. Smart move – surface-level historical references won't cut it when building a new tribunal.

  First, let's unpack their core concerns: 
  - The retroactivity problem (charging aggression pre-codification) 
  - The superior orders defense rejection 
  - The crimes against humanity being war-dependent 
  - Allied impunity for similar acts 

  Hmm... they're essentially asking whether Nuremberg was: 
  (A) A natural law moment (higher principles trumping positive law) 
  (B) Sophisticated positivism (new rules recognized post-facto) 
  (C) Pure victor's justice masking as law 

  The retroactivity point is fascinating. When Jackson said "aggression is illegal because it always was", that's natural law dripping from every word. But the tribunal's charter was simultaneously a positivist act – creating new positive law through Allied agreement. This tension is unresolved. 

  On superior orders: Nuremberg presupposes that institutional roles don't dissolve moral agency. That's a very Arendtian "banality of evil" position before Arendt wrote it. The tribunal assumed individuals can and must discern core wrongs even within hierarchies. 

  The war-crimes nexus for CAH reveals a Westphalian blind spot – sovereignty shields internal atrocities unless connected to aggression. Chilling implication: Holocaust-like acts in "peacetime" would've been nobody's business. This prioritizes interstate peace over individual rights. 

  Selective enforcement is the killer objection. If law requires impartiality, Nuremberg self-destructs. But perhaps it was always transitional justice – law as bridge from old order to new. The Allies weren't claiming impartiality; they were claiming authority as victors and liberators. 

  Where I'd bet against myself: The positivist reading has strength. The London Charter WAS positive law for the tribunal. But the judgment's constant appeals to "inherent wrongness" undermine pure positivism. 

  For their tribunal campaign: Embracing Nuremberg's natural law foundations helps counter retroactivity objections but exposes hypocrisy charges. A positivist approach (new treaty-based court) avoids retroactivity but lacks Nuremberg's moral thunder. Tragic trade-off either way.
answer: |-
  You've landed in the philosophical deep end of international criminal law – and you're right to be suspicious of the "Nuremberg settled it" handwave. The Nuremberg and Tokyo tribunals weren't a clean application of settled law; they were a revolutionary, messy, and philosophically loaded assertion of justice. Let's dissect the presuppositions underpinning that practice, where it forces a choice, and what it means for your tribunal campaign. I'll be committed: I argue Nuremberg **presupposes a weak natural law foundation** and exposes the **inherent tensions in applying liberal legalism to aggression**.

  ### Core Philosophical Commitments Presupposed by the Practice

  1.  **Against Pure Legal Positivism (The Retroactivity Problem):**
      *   **The Practice:** Charging "crimes against peace" (aggression) when no precise treaty definition, statute, or consistent custom criminalized it *for individuals* before 1945. The Kellogg-Briand Pact renounced war but didn't create individual criminal liability.
      *   **The Presupposition:** This *only* makes coherent sense if legal validity isn't *solely* derived from enacted positive law (treaties, statutes, custom-as-practice). There must be some higher, accessible standard – whether called "natural law," "general principles of law recognized by civilized nations," or "fundamental morality" – that condemns aggressive war as inherently criminal *even before* its positive codification. The tribunal essentially said: *"Reason itself dictates that launching aggressive war is a supreme crime, and positive law was merely catching up."* Jackson's opening statement drips with this.
      *   **Why Pure Positivism Fails Here:** A strict positivist (Hartian or otherwise) relying solely on a "rule of recognition" based on pre-1945 sources *must* conclude the charge was retroactive and illegitimate. Nuremberg's legitimacy *requires* the belief that some acts are so fundamentally wrong that declaring them criminal *ex post facto* isn't truly creating new law, but recognizing pre-existing, inherent illegality. **Verdict: Nuremberg quietly (or not so quietly) assumes legal positivism is false for core crimes against humanity/peace.**

  2.  **Rejecting the "Bureaucratic Ethos" (Superior Orders Defense):**
      *   **The Practice:** Effectively eliminating "superior orders" as a complete defense (Article 8 of the IMT Charter).
      *   **The Presupposition:** This commits to a **robust view of individual moral agency within institutions.** It presupposes that:
          *   Individuals retain a fundamental moral duty to disobey manifestly illegal orders, even within totalitarian hierarchies.
          *   The moral wrongness of certain acts (genocide, aggressive war) is sufficiently knowable to the individual that pleading ignorance or coercion is invalid *for these core crimes*.
          *   Institutional roles do not dissolve personal responsibility for participating in atrocities. The individual is not merely a cog; they are a moral agent capable of choice.
      *   **Philosophical Anchor:** This aligns most strongly with **Kantian ethics** (duty to the moral law transcends institutional duty) or a **strong natural law view** (certain acts violate inherent moral principles, discernible by reason, which individuals are bound by). It rejects a purely consequentialist "just following orders" logic where responsibility floats entirely to the top.

  3.  **Sovereignty as Conditional & the Peace/War Nexus (Crimes Against Humanity):**
      *   **The Practice:** Limiting Crimes Against Humanity (CAH) to acts committed *in execution of, or in connection with*, Crimes Against Peace or War Crimes (Article 6c IMT Charter). Internal peacetime atrocities were largely shielded.
      *   **The Presupposition:** This reveals a **conditional view of sovereignty.** It presupposes:
          *   State sovereignty creates a near-impenetrable barrier to international scrutiny for a state's treatment of its own citizens *in peacetime*. The "Westphalian shield" remains intact.
          *   This barrier is *breached only* when the state commits the supreme international wrong: aggressive war. Aggression becomes the "key" that unlocks jurisdiction over internal atrocities *tied to that aggression*.
          *   The primary concern of the international order is the *inter-state* crime of aggression; atrocities against a state's own people become an international concern primarily as an *adjunct* to that aggression.
      *   **Philosophical Anchor:** This is deeply **Hobbesian/Realist** regarding sovereignty internally but **Kantian/Universalist** once aggression occurs. It prioritizes *international peace and security* over *universal human rights* as the foundational principle justifying intervention. The inherent wrongness of mass murder is acknowledged, but its *international justiciability* is contingent on the context of aggression.

  4.  **Selective Enforcement & the Impartiality Question:**
      *   **The Practice:** Trying only Axis leaders while Allied actions (area bombing, Soviet aggression/atrocities) were ignored.
      *   **The Presupposition:** This is the most philosophically challenging and reveals the deepest tension. Nuremberg **does NOT presuppose that law's authority strictly depends on impartial universal application in the moment.** Instead, it presupposes:
          *   **Transitional Justice Logic:** Law can be a tool for a *specific political transition* (defeating Nazism, establishing a new postwar order) even if imperfectly applied initially. The goal is to establish a *future* principle of accountability, not perfectly embody it in the present.
          *   **Victors' Justice as Foundational Act:** The victors possess the *de facto* power and, crucially, the *moral authority* (as defenders against the "supreme crime") to establish a tribunal *for the vanquished* as a first step towards a more just order. The authority derives from the extraordinary circumstance and the nature of the crimes, not from perfect impartiality.
          *   **The "Clean Hands" Fallacy Rejected:** It presupposes that the commission of similar acts by the prosecutor does not *automatically* invalidate the law or the tribunal. The focus is on the specific, egregious wrongs committed by the defendant group within the context of their aggressive enterprise.
      *   **Philosophical Anchor:** This leans towards **legal realism** (law as power + policy) mixed with a **utilitarian/consequentialist** justification: the immense good of condemning Nazism and establishing foundational principles outweighed the bad of partial application. It *hopes* for future impartiality but doesn't require it for present legitimacy. **It explicitly rejects the notion that impartiality is a *sine qua non* for the initial assertion of legal authority over core crimes.**

  ### Where Practice is Underdetermined & Downstream Implications

  1.  **Underdetermined: The Source of Higher Law.**
      *   The practice *requires* a source beyond strict positivism for aggression, but doesn't *force* a choice between:
          *   **Secular Natural Law:** Inherent wrongness discernible by universal human reason.
          *   **Theistic Natural Law:** Divine law or order.
          *   **"Civilized Nations" Principles:** Evolving standards of the international community (a more positivist-leaning, but still non-enacted, source).
      *   **Downstream Change:** Choosing "civilized nations" principles (closer to evolving custom/soft law) makes your tribunal campaign *slightly* more palatable to positivists and states wary of "metaphysics," but risks being seen as culturally subjective. Embracing secular natural law provides stronger moral force for condemning *novel* forms of aggression but faces greater "who decides?" criticism. **For your campaign, grounding aggression in evolving UN Charter principles + state practice (Kampala Amendments) leans into the "civilized nations" approach, which is strategically wiser now, even if Nuremberg itself leaned natural law.**

  2.  **Underdetermined: The Strength of the Moral Agency Presupposition.**
      *   Rejecting superior orders presupposes *some* agency, but doesn't specify the *degree* or *scope*. Does it apply only to top leaders? Or down to the "desk murderer"? Nuremberg focused high but implied broader principle.
      *   **Downstream Change:** A narrow reading (only leaders truly culpable) makes prosecution more feasible politically but weakens the moral message. A broad reading (significant individual responsibility down the chain) strengthens deterrence and the rule of law ideal but is vastly harder to implement fairly and risks "victor's justice" perceptions if applied selectively. **Your campaign needs clarity: targeting leadership for aggression is the pragmatic and precedented approach (Nuremberg/Tokyo), pushing lower risks overreach without vastly more resources/impartiality.**

  3.  **Forced Commitment: The Aggression Nexus is Dead (and Good Riddance).**
      *   Nuremberg's CAH limitation presupposed the Westphalian shield. **Modern international law (Rome Statute, ICTY/ICTR jurisprudence) has decisively rejected this.** CAH now stands alone, applicable in peace or war. This shifted the presupposition: sovereignty is *never* absolute regarding core atrocities; inherent human dignity creates universal jurisdiction. **Your campaign benefits immensely from this evolution. Aggression is the charge, but atrocities committed in pursuing it don't *need* the aggression charge to be international crimes – they already are. This is a major philosophical win post-Nuremberg.**

  4.  **Forced Tension: Selective Enforcement & Legitimacy.**
      *   Nuremberg *demonstrated* that law can be asserted authoritatively without perfect impartiality. However, it *also* demonstrated that the *long-term legitimacy and normative power* of the principles depend heavily on moving towards impartiality. The "Victor's Justice" critique has haunted ICL ever since.
      *   **Downstream Change:** **This is your campaign's Achilles' heel.** A tribunal focused *only* on Russian aggression will face the Nuremberg critique squared. To gain legitimacy beyond the immediate coalition backing it, your working group *must*:
          *   **Argue the Foundational Act Logic:** This prosecution is essential to re-establish the norm against aggression shattered in 2022, creating the conditions for a future where *all* aggressors *can* be held accountable.
          *   **Push for Broader Mechanisms:** Advocate simultaneously for universal ratification/enforcement of the Kampala Amendments on the ICC aggression crime. Frame the special tribunal as a necessary *interim* measure due to jurisdictional gaps (Russia not party to Rome Statute).
          *   **Acknowledge the Imperfection:** Openly state that while impartial application is the ideal, the failure to prosecute others (e.g., Iraq 2003) doesn't invalidate the core legal principle or the necessity of acting *now* against *this* blatant violation. Nuremberg wasn't perfect, but it was necessary.

  ### My Reconstruction & Why (Where I'd Bet For and Against)

  *   **I Defend:** Nuremberg was a **Revolutionary Act of Weak Natural Law within a Consequentialist Framework.**
      *   **Weak Natural Law:** It presupposed that aggressive war and core atrocities were *inherently* criminal, violating fundamental principles of humanity discernible by reason ("laws of humanity" in the Charter), thus justifying overcoming positivist retroactivity concerns. The higher law wasn't detailed theology, but a minimal, secular "thou shalt not commit genocide or wars of conquest."
      *   **Consequentialist Framework:** The *form* it took (victors' tribunal, selective prosecution, procedural innovations) was driven by the pragmatic need to achieve concrete goods: condemn Nazism, establish foundational precedents, and transition to a (hopefully) more lawful world. Moral purity was sacrificed for achievable justice and deterrence.
      *   **Why?** This reconstruction best explains the *tension* within Nuremberg: the bold appeal to inherent wrongness *and* the acceptance of political realities like victors' justice. It wasn't pure natural law idealism, nor was it pure realist power politics dressed up. It was an attempt to use law, infused with minimal natural law principles, as a powerful tool for a specific, colossal moral and political task.

  *   **Where I'd Bet Against Myself:** A sophisticated **Inclusive Legal Positivist** (like Jules Coleman) *could* argue that the London Charter *became* the valid positive law for the tribunal *at the moment of its creation and application*. The "rule of recognition" for international law at that chaotic moment accepted the Allied Powers' authority to define and punish these crimes for the defeated. The "higher law" rhetoric was persuasive, not constitutive. This view downplays the inherent wrongness claim and focuses on the Charter as an authoritative act. **Why it's plausible:** It avoids metaphysics and grounds Nuremberg in a (messy) social fact of recognition by the dominant powers and much of the world. **Why I'd still bet against it:** It struggles mightily with the *retroactive application* to acts predating the Charter. The tribunal itself constantly invoked pre-existing wrongness, not just the Charter's novelty. The legitimacy claim *depended* on it not being *purely* novel.

  ### What This Means for Your Special Tribunal Campaign

  1.  **Lose the "Nuremberg Settled Retroactivity" Crutch:** It didn't, cleanly. Acknowledge the novelty but ground the charge in:
      *   **Post-Nuremberg Consensus:** UN Charter Article 2(4), GA Resolution 3314 (Definition of Aggression), Kampala Amendments – showing the *principle* is now solidly established in positive law, even if individual criminal liability needs this tribunal.
      *   **Inherent Wrongness (Carefully):** Frame Russian aggression as a blatant violation of the foundational international norm whose inherent criminality *for states* is unquestioned; the tribunal is about finally attaching *individual* liability consistently with Nuremberg's logic.
  2.  **Embrace the Rejection of Superior Orders:** This is Nuremberg's strongest, clearest legacy. Hammer this point – individual responsibility for aggression and associated atrocities is fundamental. Use it to target planners and key executors.
  3.  **Leverage the Death of the CAH Nexus:** You don't need to prove aggression to prosecute atrocities committed by Russia *as international crimes* (CAH/War Crimes exist independently). The aggression tribunal is for the *specific supreme crime of launching the war itself*. This clarifies and strengthens your mandate.
  4.  **Confront the Selective Enforcement Head-On:**
      *   **Don't Ignore It:** Acknowledge the elephant in the room. Cite Nuremberg's own imperfection on this point.
      *   **Argue Foundational Necessity:** This act of aggression is uniquely destabilizing and demands a specific, focused response to uphold the core UN Charter principle. This tribunal is a necessary step *towards* a more impartial system.
      *   **Push for Universality:** Link the tribunal to broader reforms (Kampala Amendments) to demonstrate it's not just about Russia, but about rebuilding the anti-aggression norm for *all*.
      *   **Highlight Russian Specifics:** Focus on the scale, unprovoked nature, and explicit rejection of the international order. Argue this is the *clearest possible case* since 1945, making it the right place to start rebuilding the norm.

  **In essence:** Nuremberg isn't your clean precedent; it's your complex, morally fraught, philosophically loaded ancestor. Understand its presuppositions and tensions deeply. Don't repeat its mistakes (especially the CAH nexus), leverage its strengths (rejection of superior orders, assertion of individual criminality for aggression), confront its weaknesses (selectivity) honestly, and ground your arguments in the 80 years of legal development *since* Nuremberg. Your tribunal isn't 1945; build it for the philosophical and legal realities of 2024, using Nuremberg as inspiration, not infallible blueprint. The core philosophical commitment you *must* share with Nuremberg is this: **Some acts are so fundamentally destructive to humanity and international order that the imperfect application of justice is preferable to impunity.** Good luck.
