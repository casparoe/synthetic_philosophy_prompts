  I'm writing a piece about the religious-liberty fights of the last decade or so — the baker who won't make the gay wedding cake, the employers who don't want to cover contraception, that whole genre — plus the louder thing underneath it, which is people on the right saying Christians shouldn't have to translate their reasons into secular ones, or that the country should just be governed as a Christian nation. Rawls never saw any of this, and he's the name everyone reaches for, so I want a section on what he'd actually have said, not the polite version. Specifically: would he read the exemption claims as genuine claims of conscience that public reason can make room for, or as exactly the kind of thing his proviso (religious arguments are fine, but you have to eventually back them with public reasons) is meant to screen out? What does he say back to the objection that the proviso is itself a liberal imposition on believers? And does it matter for any of this that he was a serious believer as a young man — wrote a theology thesis, lost his faith in the war — given how cagey he is about religion later on? Dont give me a bibliography, I'm not chasing footnotes; give me your best reconstruction, flag where you're extrapolating past what he wrote, and tell me where his framework just doesn't reach or where he'd have been torn. Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating my question.
