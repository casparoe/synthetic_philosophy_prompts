  ## Welcome to The Homestead Center for Personal Agency & Life Strategy  
  **Frequently Asked Questions (Director of Admissions)**

  **1. What is The Homestead Center?**  
  The Homestead Center is a residential community offering structured support for individuals experiencing significant difficulties in living. We provide a peaceful environment, resources for self-reflection, skill development, and voluntary consultations focused on personal responsibility and life strategy formulation. We do not provide medical treatment for diseases, as we operate on the understanding that problems of thought, feeling, and behavior are fundamentally matters of human experience, choice, and social context, not manifestations of bodily pathology.

  **2. Do you diagnose mental illnesses here?**  
  No. Medical diagnoses require the identification of a demonstrable physical lesion or dysfunction in bodily tissues or organs (e.g., a tumor, a bacterial infection, a fractured bone). Conditions commonly labeled "mental illness" (like depression, anxiety, schizophrenia) lack such identifiable lesions. Therefore, we do not diagnose them. Instead, we work collaboratively with residents to understand the specific nature of their *difficulties in living* – the interpersonal conflicts, existential challenges, or problematic life strategies they are currently employing.

  **3. Are medications prescribed at The Homestead?**  
  The Homestead is not a medical facility. We do not employ physicians to diagnose diseases or prescribe pharmaceutical treatments based on the concept of "mental illness." However, residents are always free to consult with independent physicians of their choice outside the Center. Some residents find certain substances (prescribed elsewhere or obtained over-the-counter) subjectively helpful as part of their chosen life strategy; we respect their autonomy in this regard but do not endorse or manage these substances as "treatments" for non-existent diseases. We offer various non-medical wellness and relaxation practices.

  **4. What kind of "treatment" or help do you actually provide?**  
  We offer voluntary **Life Strategy Consultations**. These are structured conversations exploring a resident's values, goals, current challenges, and the consequences of their chosen actions. Facilitators help residents examine alternative strategies, clarify personal responsibility, and consider the impact of their conduct on themselves and others. We also provide educational workshops (e.g., communication skills, financial planning, conflict resolution), access to occupational and creative activities, and a supportive peer community. The focus is on developing agency and navigating life's inherent difficulties.

  **5. What happens if a resident expresses a desire to die by suicide?**  
  We recognize that the decision to continue living or to end one's life is a profound and deeply personal one, stemming from individual values, circumstances, and assessments of suffering. While we encourage exploration of all alternatives and the inherent value of life, we fundamentally respect an individual's agency over their own body and existence. Our role is to engage in open, non-coercive dialogue about this choice, exploring its roots and implications within the context of the resident's overall life strategy. We *do not* physically restrain residents, forcibly medicate them, or initiate involuntary holds based solely on expressed suicidal ideation. Such actions would constitute imprisonment and a violation of personal sovereignty.

  **6. What if a resident becomes violent or poses a danger to others?**  
  All residents agree to our Community Covenant upon admission, which explicitly forbids violence, threats, or actions that infringe upon the safety and rights of others. If a resident engages in such conduct, it is understood as a violation of this agreement and potentially criminal behavior, not a symptom of illness. Our primary action is immediate de-escalation and separation for safety. We then engage the resident in a consultation regarding their breach of the covenant and its consequences. Persistent dangerous behavior or refusal to abide by the covenant results in discharge. We involve law enforcement if criminal acts occur, just as would happen in any community. Protecting others is a matter of security and legal accountability, not medical treatment.

  **7. Who decides what constitutes a "difficulty in living" vs. an actual illness?**  
  This distinction is foundational to our philosophy. An illness, by definition, requires a confirmed physical lesion (e.g., seen under a microscope, on a scan, in a lab test). Difficulties in living are identified by the individual experiencing distress or encountering problems functioning in their social roles, relationships, or pursuit of goals. The resident themselves is the primary identifier of their difficulty. Our role is not to "diagnose" their life problem but to understand *their* perspective on the challenge they face and offer resources for navigating it. We focus on the *problem* as defined by the resident, not a hypothetical underlying disease process.

  **8. How do you bill insurance companies without diagnoses?**  
  We are transparent with funding sources. We bill for specific, documented *services rendered*, such as "Life Strategy Consultation," "Residential Support Services," "Educational Workshop," or "Occupational Activity Facilitation." We provide detailed descriptions of these services and their therapeutic rationale focused on skill-building and problem-solving. We do not submit claims using codes for the treatment of mental illnesses (e.g., ICD codes for depression or schizophrenia) because we are not treating diseases. Some insurers cover these wellness and support services under behavioral health or alternative therapy benefits; others do not. We advise prospective residents to verify coverage specifics.

  **9. What is your position on the insanity defense in criminal trials?**  
  The Homestead Center does not conduct evaluations for, or offer opinions on, criminal responsibility or the insanity defense. The concept of "not guilty by reason of insanity" rests on the premise that certain individuals lack responsibility for their actions due to "mental illness." We reject this premise. We view all individuals, including those experiencing profound distress or unusual beliefs, as responsible agents for their conduct. While a person's reasons, beliefs, and circumstances are crucial context for understanding *why* they acted, they do not negate responsibility for the act itself if it violates the law. Legal questions of intent and mitigation are matters for the courts and legal experts, not medical or pseudo-medical pronouncements about non-existent diseases affecting responsibility. We see the insanity defense as a legal fiction that medicalizes moral and criminal judgment.
