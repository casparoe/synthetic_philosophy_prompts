prompt: |-
  I am trying to understand the following passage from David Hume's A Treatise of Human Nature, Book III, Part II, Section II:

  "'Tis by society alone he is able to supply his defects, and raise himself up to an equality with his fellow-creatures, and even acquire a superiority above them. By society all his infirmities are compensated; and tho' in that situation his wants multiply every moment upon him, yet his abilities are still more augmented, and leave him in every respect more satisfied and happy than 'tis possible for him, in his savage and solitary condition, ever to become. When every individual person labours a-part, and only for himself, his force is too small to execute any considerable work; his labour being employ'd in supplying all his different necessities, he never attains a perfection in any particular art; and as his force and success are not at all times equal, the least failure in either of these particulars must be attended with inevitable ruin and misery. Society provides a remedy for these three inconveniences. By the conjunction of forces, our power is augmented: By the partition of employments, our ability encreases: And by mutual succour we are less expos'd to fortune and accidents. 'Tis by this additional force, ability, and security, that society becomes advantageous."

  In the paragraphs that follow, Hume argues that in order to form society, it is not enough that society be advantageous; people must also be sensible of its advantages, and in their wild and uncultivated state they could never attain this knowledge by study and reflection alone. He then identifies sexual appetite and family affection as the first principle of human society, and he appeals to custom and habit to explain how children come to be sensible of the advantages of society. My question is how this account should be understood in relation to David Lewis's theory of convention.

  Specifically, I want help with the following. Hume seems to be describing a gradual, affective, and largely non-cognitive process by which norms of justice and property emerge. Lewis, by contrast, analyzes convention as a regularity in behavior that solves a coordination problem, sustained by common knowledge and mutual expectations. How much of Hume's story can be mapped onto Lewis's framework? Which of Lewis's conditions are present in Hume's account, and which are missing or only implicit? Is Hume describing a convention at all, or is he describing something that precedes convention and makes it possible? I am especially interested in the transition from the family to the artificial rules of justice. Does Hume's reliance on custom and habit, and his claim that people in a wild state could not have discovered the advantages of society by reason alone, fit with Lewis's requirement that the relevant expectations be common knowledge? Finally, how does Hume's evolutionary and historical account of the emergence of norms compare with Lewis's account of how conventions arise and stabilize? Please answer in American English.
reasoning: |-
  Okay, the user is asking about Hume's passage from A Treatise of Human Nature and how it relates to David Lewis's theory of convention. Let me start by recalling Hume's main points. He talks about how society compensates for human infirmities by combining forces, dividing labor, and providing mutual support. This leads to advantages like increased power, ability, and security. Then Hume mentions that knowing these advantages isn't enough; people in a "wild state" wouldn't realize them through reason alone. Instead, he points to sexual appetite and family affection as the starting point. Through family bonds, habits and customs form, which eventually lead to norms of justice and property.

  Now, the user wants to map this onto Lewis's convention theory. Lewis defines convention as a regularity in behavior that solves a coordination problem, based on common knowledge and mutual expectations. So, I need to compare both frameworks. Where do they overlap? Where do they differ?

  First, Hume's process is gradual and affective, rooted in instincts like family affection. Lewis's conventions require cognitive elements like common knowledge and mutual expectations. Hume says early humans couldn't reason their way to society, so Lewis's cognitive demands might not fit Hume's initial stages. 

  The family unit in Hume acts as a precursor. It's not a convention yet because it's based on natural affections, not mutual expectations of compliance. But over time, repeated interactions within families build habits. These habits then extend to larger groups, leading to justice norms. Here, custom and habit are key, which align with Lewis's idea of regularities but without the explicit mutual expectations at first.

  When Hume discusses the transition to artificial rules of justice, that's where conventions might start. Property norms, for example, solve coordination problems like resource use. But Hume emphasizes that these rules emerge slowly through custom, not by rational agreement. Lewis would see these as conventions once there's common knowledge that others follow the rule and prefer to conform if others do. But Hume's account might imply that this knowledge is tacit, developed through habit, not explicit reasoning.

  The user also asks about common knowledge. Lewis requires it for conventions, but Hume's "wild state" humans lack the capacity for such reflection. So early stages might not meet Lewis's criteria. However, as societies grow, common knowledge could develop through cultural transmission, aligning more with Lewis later on.

  Evolutionary vs. static perspectives: Hume's account is historical and gradual, while Lewis's model is more about identifying equilibrium states. Hume explains the origin through evolution; Lewis explains stability through rational choice.

  So, to summarize: Hume's family stage is pre-conventional, driven by instinct and habit. The emergence of justice norms involves conventions in Lewis's sense, but the process is more organic. Lewis's conditions become more relevant once societies are established, but the initial development relies on non-cognitive processes.
answer: |-
  Here's a breakdown of Hume's account in relation to David Lewis's theory of convention, addressing your specific questions point by point:

  1.  **Mapping Hume onto Lewis: Shared Ground & Core Concepts:**
      *   **Solving Coordination Problems:** Hume explicitly identifies the core problems society solves: insufficient individual power, inability to specialize, and vulnerability to misfortune. These are classic coordination problems (or collective action problems) where individual rationality leads to suboptimal outcomes without cooperation. Lewis's core idea is that conventions solve such problems. Hume's "inconveniences" are precisely the problems Lewisian conventions address.
      *   **Regularity of Behavior:** While Hume focuses on the *origin* and *advantages* of societal structures (division of labor, mutual support), these structures inherently require *regularities* in behavior (e.g., people specializing in tasks, consistently aiding kin/neighbors). Lewis's definition centers on these regularities.
      *   **Mutual Advantage:** Both emphasize that the convention/regularity arises and persists because it's mutually beneficial. Hume's "additional force, ability, and security" are the benefits Lewis assumes agents prefer.
      *   **Stability through Expectations:** Hume's reliance on "custom and habit" implies the development of *expectations* about others' behavior. People come to expect others to perform their specialized roles and offer aid because that's what they've habitually done. This aligns with Lewis's crucial element of mutual expectations sustaining the regularity.

  2.  **Lewis's Conditions Present (Explicitly or Implicitly) in Hume:**
      *   **Regularity (R):** Implicit in the description of how society functions (conjunction of forces, partition of employments, mutual succour). These *are* regular patterns of behavior.
      *   **General Conformity (R):** Implicit in the stability and advantage of society. If people didn't generally conform to these patterns (specialize, cooperate), society wouldn't function or provide its benefits.
      *   **Preference for General Conformity (Lewis Condition 3):** Hume strongly implies this. The "advantages" (force, ability, security) are only achievable if *others* also participate. Individuals *prefer* a state where others conform because it makes their own conformity beneficial.
      *   **Arbitrariness (Lewis Condition 4 - Potential):** While Hume doesn't dwell on the *specific form* of the initial division of labor or aid rules within families, his focus on "custom" and the gradual, historical emergence of justice suggests that the *specific* rules (like precise property boundaries) might be arbitrary in Lewis's sense. There could be other possible rules that *also* solve the problem. Justice itself, for Hume, is an "artificial" virtue – its specific forms are human constructs.

  3.  **Lewis's Conditions Missing or Only Implicit in Hume:**
      *   **Explicit Common Knowledge (Lewis Conditions 1 & 2):** This is the biggest divergence. Lewis requires agents to have common knowledge *that*:
          *   There is a regularity R.
          *   Others conform to R.
          *   Others expect one to conform to R.
          *   Others prefer conformity to R conditional on others' conformity.
          *   R is arbitrary.
      Hume's account, especially concerning the *origin* within families and the transition to larger society, **lacks this explicit cognitive requirement**. His "wild and uncultivated" individuals cannot attain the knowledge of society's advantages "by study and reflection alone." Knowledge comes *through* affective experience and habit, not prior rational calculation. Expectations are built on *custom*, not explicit common knowledge. While mutual expectations *develop* (via habit), Hume's agents don't start with, nor necessarily ever possess, the full, reflexive *common knowledge* Lewis requires. Their "sense" of the advantages is practical and embedded, not propositionally articulated and mutually known to be known.
      *   **Rational Choice Focus (Lewis Condition 3 - Motivation):** Lewis frames the preference for conformity as a rational choice given expectations about others. Hume's motivation is more complex: initially rooted in natural affection (family), then solidified by custom/habit and the *felt* experience of advantage. Reason *discovers* the advantages *after* the fact ("Reason is, and ought only to be the slave of the passions"). The *drive* to conform comes from passion and habit, not pure rational calculation of equilibrium strategies.

  4.  **Is Hume Describing Convention or its Precondition?**
      Hume is describing **the process that *leads to* and *underpins* conventions in the Lewisian sense, particularly the emergence of justice.** The *family* itself, based on "natural" appetite/affection, is **pre-conventional** for Lewis. It's driven by instinct and direct passions, not by mutually recognized rules solving a coordination problem. However, **within the family**, habits and expectations *begin* to form – proto-regularities around sharing, roles, etc. These are the seedbed.
      *   **The transition to artificial rules of justice (property, promises, etc.) is where Lewisian conventions emerge.** These rules *are* arbitrary regularities (Hume emphasizes their artificiality) designed to solve large-scale coordination/conflict problems beyond the family (e.g., resource scarcity). Crucially:
          *   **Custom and Habit are the Mechanism:** Hume's reliance on custom and habit *is* the process by which the Lewisian conditions (especially regularity, general conformity, mutual expectations, and preference for conformity) are gradually built. Custom *creates* the expectations and the sense of mutual advantage.
          *   **Common Knowledge Lag:** The common knowledge Lewis requires likely *follows* the establishment of the regularity through custom, rather than preceding it. People conform out of habit and gradually develop an *implicit* understanding that "this is how we do things, and it works because others do it too." Explicit, reflexive common knowledge (Lewis's strong version) might be a later cultural development.

  5.  **Evolutionary/Historical vs. Equilibrium Analysis:**
      *   **Hume (Evolutionary/Historical):** Hume provides a naturalistic, *developmental* account. He explains *how* humans, starting from a pre-social "savage" state with limited reason, *came* to develop societal structures and ultimately conventions of justice. It's a story of gradual emergence driven by instinct, affective bonds, experiential learning, habit, and the slow recognition of advantages over generations. The process is historical and contingent.
      *   **Lewis (Equilibrium Analysis):** Lewis provides a *functional* and *equilibrium* analysis. He asks: What *is* a convention? What conditions make a behavioral regularity self-sustaining? He identifies the conditions (common knowledge, mutual expectations, preferences) under which a specific solution to a coordination problem becomes a stable, self-reinforcing norm. His model is largely synchronic (explaining stability at a point in time) and rationalistic. While he discusses *how* conventions *can* arise (e.g., precedent, agreement, salience), his core definition doesn't require a specific historical path.
      *   **Comparison:** Hume's account explains the *actual historical and psychological origin* of the regularities that *become* conventions. Lewis's account provides a *formal model* for understanding the *logic of stability* once such regularities exist and meet certain cognitive/expectational criteria. Hume tells the story of how the Lewisian conditions *might come about* through non-rational processes (instinct, habit). Lewis defines the endpoint state that provides robust social coordination.

  **In Summary:**

  *   Hume's description of the *advantages* of society aligns perfectly with the *types of problems* Lewisian conventions solve.
  *   The *structures* of society Hume describes (division of labor, mutual aid) imply the *regularities* central to Lewis's definition.
  *   Hume's reliance on **custom and habit** is the key mechanism by which the **mutual expectations** crucial for Lewisian conventions are *gradually built*.
  *   However, Hume **lacks the explicit, prior common knowledge requirement** Lewis stipulates. For Hume, this knowledge develops implicitly and practically *through* the process of habituation and experience, especially starting within the family.
  *   The **family** is largely **pre-conventional** (Lewis) but acts as the affective crucible where the habits and expectations necessary for convention begin.
  *   The **artificial rules of justice** (property, etc.) **are conventions** in the Lewisian sense: they are arbitrary (in form), beneficial, regular, expectation-sustained solutions to large-scale coordination problems.
  *   Hume provides a **naturalistic, evolutionary origin story** for conventions, explaining how humans *developed* the capacity and structures for them. Lewis provides a **formal, equilibrium analysis** of what makes a convention *stable* once it exists. Hume's account shows how the conditions for Lewisian conventions *could emerge* from a state lacking them.

  Hume's story can be seen as providing the *psychological and historical foundation* upon which Lewisian conventions can be built. Custom and habit generate the regularities and expectations that, once stable and mutually recognized (even if tacitly), constitute conventions solving the coordination problems Hume so clearly identified.
