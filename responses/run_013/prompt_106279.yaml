  - "rank_discounting_verdict": object with "reconciles" (true/false), "reason", and "residual_cost".
  - "single_most_economical_revision": string naming the one change that resolves the most at the least cost, with a one-sentence justification.

  Don't pad the list. If two of these are only apparently in tension, say so and explain why rather than treating every pair as a conflict.
