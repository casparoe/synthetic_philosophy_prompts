prompt: |-
  I teach political philosophy and the history of American pragmatism, and twice this year I have watched one sentence do heavy lifting in an argument. The sentence is "democracy is a way of life" — the formula usually attributed to Dewey, and in my experience recited as though it settled a question rather than raised one.

  The first occasion was a departmental governance meeting. We elect our chair by a vote of the tenured faculty, and the chair then settles most matters: teaching assignments, hiring priorities, the shape of the budget. A colleague argued that this arrangement is not democratic at all, on the ground that democracy is a way of life and not a procedure. If it is a way of life, she said, then everyone whose working life is shaped by those decisions — the untenured, the graduate students, the staff — must have a share in making them, and the body should deliberate until it agrees rather than count heads. She moved that we replace the election with a consensus process.

  The second occasion was a seminar, where a student used the same sentence with the opposite tendency: to argue that a state with free elections, an independent judiciary, and a lively press may nevertheless be undemocratic, because its citizens' ordinary dealings — in the office, the congregation, the household — are conducted on authoritarian lines, and a way of life is what happens in those places rather than at the ballot box.

  I can see that the sentence is doing genuine work in both cases, and also that it cannot be doing the same work in both. What I want from you is not an exposition of Dewey but an inventory. Set out the distinct, precise claims the sentence could be making; for each, say what kind of claim it is — a proposal about how the word "democracy" ought to be applied, a causal claim about what sustains democratic institutions, a claim about the dispositions democracy demands of individuals, a claim about the point or goal of political association, or a piece of rhetoric that makes no claim at all — and give a verdict: platitude, substantive and defensible, contentious, or false.

  I have long glossed the sentence in lecture as follows, and I want you to say whether the gloss is a precisification of the slogan or a different thesis smuggled in under it: a group is democratic to the degree that its members have interests they knowingly share and communicate to one another, and to the degree that the group's life is open to other groups rather than closed in on itself. Treat that as one candidate among others, not as the target.

  Then three further things. First, for each reading, say what would count as evidence against it, and flag the readings on which the sentence becomes true by definition and so unfalsifiable. Second, say which reading my colleague needs if her motion is to follow from the slogan, whether that reading is true, and whether her conclusion actually follows from it; do the same for the student's claim about the authoritarian household. Third, tell me whether, on the reading my colleague needs, she and the rest of us are having a genuine disagreement about how the department should be run or a merely verbal one about how to use a word, and what turns on the answer.

  Please give me no citations or reading lists; I know the texts, and I would rather have the menu and the verdicts.
reasoning: |-
  Okay, the user teaches political philosophy and American pragmatism. They're grappling with the phrase "democracy is a way of life," which has been used in two different contexts with opposing conclusions. First, a colleague in a departmental meeting argued that their election process isn't democratic because democracy requires consensus and inclusion of all stakeholders. Second, a student claimed that even with formal institutions, a society can be undemocratic if daily life is authoritarian. The user wants an analysis of the possible interpretations of Dewey's phrase, without exposition, focusing on distinct claims, their types, and evaluations.

  The user's own gloss is that democracy involves shared interests and openness to other groups. They want this treated as one interpretation among others. Additionally, they want evidence against each reading, identification of unfalsifiable claims, analysis of the colleague's and student's arguments, and whether the colleague's dispute is substantive or verbal.

  Breaking down the phrase "democracy is a way of life," it's crucial to unpack the ambiguities. "Way of life" can mean habits, cultural norms, ethical ideals, or comprehensive practices. "Democracy" might refer to political systems, ethical principles, or social relations. Each combination leads to different claims.

  Starting with possible interpretations: 

  1. **As a Conceptual Claim**: Redefining democracy beyond politics to all social interactions. This is a stipulative definition, not falsifiable but potentially useful. Evaluation: Contentious as it deviates from common usage.

  2. **As a Psychological/Cultural Claim**: Democratic institutions require supportive cultural habits. This is causal and empirical. Defensible but needs evidence. Evidence against: Stable democracies without widespread democratic habits.

  3. **As an Ethical Claim**: Democracy is an ideal for all human associations. Normative proposal. Defensible but contentious. Evidence against: Associations functioning better with hierarchy.

  4. **As a Rhetorical Claim**: Emphasizing democracy's depth without specific claims. Not testable. Evaluation: Platitude if vague.

  5. **As an Ontological Claim**: Democracy is inherent in community life. Metaphysical, contentious. Unfalsifiable.

  The user's gloss focuses on shared interests and group openness. This fits as an Ethical Claim (3) or a Psychological Claim (2). It's a substantive thesis, defensible but not inherent in the slogan.

  For the colleague's argument: She needs the Ethical Claim (3) to argue that all affected must participate. But her conclusion doesn't necessarily follow; democracy might allow representative forms. The claim is contentious. The disagreement is substantive, not just verbal, because it's about values in governance.

  For the student's argument: They use the Psychological Claim (2) or Conceptual Claim (1). The Conceptual Claim makes it true by definition. The Psychological Claim is defensible; evidence against would be democratic states with authoritarian social structures. The disagreement is substantive regarding societal priorities.

  The user's deeper needs might include clarifying conceptual confusion in arguments, understanding how slogans function rhetorically, and discerning substantive vs. verbal disputes. They likely want tools to dissect such usages in teaching and discussions, ensuring that debates focus on real issues rather than semantic differences. Highlighting the ethical and empirical dimensions helps students and colleagues engage more critically with political concepts.
answer: |-
  Here is an inventory of distinct claims embedded in "democracy is a way of life," categorized by type, with evaluations and applications to your cases. Your gloss is addressed as Candidate 6.

  ### Inventory of Claims
  1.  **Conceptual Redefinition Claim:** "Democracy" *means* a pattern of social interaction (consultation, mutual respect, shared inquiry) present in all human associations (family, workplace, school), not just formal government.
      *   **Type:** Stipulative definition/proposal for word use.
      *   **Verdict:** Contentious. Radically expands the term beyond common political usage. Useful for highlighting connections, but risks obscuring distinctions between state power and voluntary association.
      *   **Evidence Against:** Societies with robust *political* democracy but pervasive hierarchy in other spheres (e.g., post-1865 US South, contemporary illiberal democracies). *Unfalsifiable?* **Yes.** True by definition under this stipulation.
  2.  **Psychological/Cultural Prerequisite Claim:** Stable *political* democracy *requires* citizens habituated to democratic dispositions (tolerance, deliberation, respect for others as equals) developed through everyday social experiences.
      *   **Type:** Causal/historical claim (about what sustains institutions).
      *   **Verdict:** Substantive and defensible. Supported by theories of civic culture (Tocqueville, Almond & Verba) and concerns about democratic backsliding.
      *   **Evidence Against:** Stable democratic institutions persisting despite widespread authoritarian social practices (e.g., some argue aspects of early-mid 20th c. US or UK), or democratic dispositions failing to prevent institutional collapse.
      *   *Unfalsifiable?* **No.** Empirical evidence can support or undermine it.
  3.  **Ethical Ideal Claim:** Democracy is the *highest normative standard* for organizing *all* human associations (family, workplace, club, state); hierarchical authority must be justified, and participation maximized.
      *   **Type:** Normative proposal (about the goal/point of association).
      *   **Verdict:** Contentious. A powerful ideal, but clashes with other values (efficiency, expertise, tradition, privacy) and practical realities in different spheres.
      *   **Evidence Against:** Associations demonstrably thriving (by their own internal goals) under non-democratic structures where consent or participation is minimal (e.g., effective military units, some religious orders, efficient businesses). *Unfalsifiable?* **No.** Its *desirability* is contested normatively, not its existence.
  4.  **Rhetorical Emphasis Claim:** "Way of life" is a metaphor stressing that democracy *isn't just* formal procedures (voting, courts), but *also* depends on deeply ingrained habits, attitudes, and everyday social cooperation.
      *   **Type:** Rhetorical device highlighting a complex reality.
      *   **Verdict:** Platitude (if vague), or points towards Claim 2/3 (if substantive). On its own, too vague to be falsifiable or deeply informative.
      *   *Unfalsifiable?* **Effectively yes** if purely rhetorical/vague. Gains falsifiability only if interpreted as Claim 2 or 3.
  5.  **Ontological Claim:** Democracy *is* the fundamental nature of associated human life; hierarchy and coercion are deviations or corruptions.
      *   **Type:** Metaphysical claim about human social existence.
      *   **Verdict:** Contentious (and arguably false). Ignores the prevalence and historical persistence of hierarchy. More aspirational than descriptive.
      *   **Evidence Against:** Overwhelming historical and anthropological evidence of hierarchical social organization as common, often stable. *Unfalsifiable?* **No,** but difficult to disprove for a committed believer who interprets all hierarchy as corruption.
  6.  **Your Gloss (Candidate):** Democracy in a group requires (a) members recognizing/sharing/communicating common interests, and (b) openness to external groups.
      *   **Type:** Normative/analytical proposal about group functioning.
      *   **Verdict:** Substantive and defensible (a core democratic ideal), but **a different thesis smuggled in.** Dewey's slogan is broader/more ambiguous. Your gloss focuses on *internal commonality* and *external permeability*, while the slogan *could* encompass those but also emphasizes *dispositions* and *modes of interaction* universally.

  ### Application to Cases

  1.  **Your Colleague (Departmental Governance):**
      *   **Needed Claim:** Primarily **Claim 3 (Ethical Ideal)**. She needs democracy as the *normative standard for all associations* to argue that excluding non-tenured faculty/staff/students is *inherently* undemocratic. Claim 1 (Conceptual) could also work, but Claim 3 provides the stronger *ought*.
      *   **Is the Claim True?** Contentious (see Verdict on Claim 3). Many defend differentiated governance based on stakes, expertise, or long-term commitment.
      *   **Does Conclusion Follow?** **No, not strictly.** Even accepting Claim 3, it mandates maximizing participation *appropriately*, not necessarily *consensus* for *all* decisions. Representative democracy or qualified majority voting could still satisfy the ideal within the department. Her leap to consensus is an *additional* normative commitment.
      *   **Disagreement Type:** **Substantive, not merely verbal.** The core dispute is about departmental *values*: Is maximizing participation (even at cost of efficiency/stability) the *primary* good? Or are other values (efficiency, expertise, stability, tenure's role) also crucial? The slogan is a rhetorical weapon in this *substantive* debate about governance priorities. What turns on it: Whether the debate focuses on practical consequences and values, or gets bogged down in definitions of "democracy."

  2.  **Your Student (Authoritarian Households):**
      *   **Needed Claim:** **Claim 1 (Conceptual Redefinition)** or **Claim 2 (Cultural Prerequisite)**.
          *   *Claim 1:* If democracy *is* everyday interaction, then authoritarian households *make* the state undemocratic by definition.
          *   *Claim 2:* Authoritarian households *undermine* the cultural foundations needed for stable political democracy.
      *   **Is the Claim True?**
          *   *Claim 1:* Contentious (see Verdict).
          *   *Claim 2:* Substantive and defensible.
      *   **Does Conclusion Follow?**
          *   *Claim 1:* **Yes, by definition.** If democracy = way of life, and households are part of life, then authoritarian households = undemocratic society.
          *   *Claim 2:* **Yes, plausibly.** If such households erode necessary democratic dispositions, they contribute to the state being less democratic or less stable, even with formal procedures.
      *   **Disagreement Type:** If using Claim 1, the disagreement *with someone using a purely institutional definition* is **partly verbal** (what "democracy" means) but points to a **substantive** disagreement about what *matters most* for assessing a society. If using Claim 2, the disagreement is **substantive** about causality and importance (e.g., "How much do household structures *actually* impact political institutions?").

  ### Summary Verdicts on the Slogan's Work
  *   It is **not a single claim** but a **rhetorically potent ambiguity** (Claim 4), usable to invoke distinct ideas (Claims 1, 2, 3, 5).
  *   Its power comes from **oscillating between description and prescription, politics and culture.**
  *   It **becomes platitudinous or unfalsifiable** when interpreted vaguely (Claim 4) or as a stipulative definition (Claim 1).
  *   Its **most defensible, substantive core** is the Cultural Prerequisite claim (Claim 2): democratic habits nurtured in civil society are vital for resilient political democracy.
  *   Its **most radical implication** is the Ethical Ideal claim (Claim 3): democracy as the normative standard for all human association.
  *   Your colleague relied on the radical implication (Claim 3), though her consensus conclusion didn't strictly follow.
  *   Your student likely relied on the Conceptual Redefinition (Claim 1) or Cultural Prerequisite (Claim 2).
  *   The slogan *itself* settles nothing; it raises fundamental questions about the meaning, foundations, scope, and demands of democracy. Its work is to shift the ground of debate.
