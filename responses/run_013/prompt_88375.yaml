prompt: |-
  OK, I need help with something that's been bugging me all semester. I teach a senior seminar that's half Wittgenstein, half formal epistemology, and I keep having the same experience: my Bayesian students listen politely to On Certainty, nod, and then say some version of "so hinges are just credences very near 1, or degenerate priors, what's the big deal" -- and I'm pretty sure that's wrong, but I can't articulate why without just repeating the later Wittgenstein at them, which is not an argument.

  So here's what I want. Do an honest translation job. Take the main claims of hinge epistemology -- the later Wittgenstein stuff from On Certainty, the Moore hand business that set it off, and the industry that's grown up around it since (Wright's entitlement line, Pritchard's idea that hinge commitments are arational, i.e. neither rational nor irrational, the reading on which the whole thing is really about rules of grammar, the quietist reading on which we shouldn't be doing epistemology here at all) -- and restate it in the vocabulary I actually use when I'm not wearing my Wittgenstein hat: Bayesian statistics and probabilistic modeling. Priors, hyperpriors, likelihoods, model comparison, identifiability, sensitivity analysis, the whole Stan / heirarchical model apparatus.

  I'm decently fluent on that side, so don't dumb it down -- I've fit hierarchical models, I know what Cromwell's rule is, I know the difference between revising a credence and revising the hypothesis space, I know the model isn't the world.

  I want these run through the mill one at a time:

  - doubt needs grounds, doubt presupposes certainty;
  - hinges aren't believed, and on some readings aren't even propositions;
  - the same proposition can function as a hinge in one context and as an ordinary empirical claim in another;
  - the river image, where some things are the channel and others the water in it, and either can turn into the other over time;
  - the idea that justification gives out, ending not in another justified belief but in acting;
  - the fact that we get our hinges by training and inheritance, from other people, not by argument.

  For each one: what does it come to in Bayesian terms, what did you have to fudge to get it there, and what has no counterpart at all? And don't do the move where you just redescribe the Wittgenstein in Bayesian words and call it translation -- if a step only works because you've already helped yourself to the Bayesian picture, flag it.

  Then the residue report, which is the part I actually care about: does the leftover tell me the Bayesian vocabulary is missing something real (say, the social and historical side of it, or the thought that certainty is seperate from high credence and is closer to a way of acting), or does it tell me the hinge talk is less deep than it sounds -- that hinge is a label for a cluster of quite different things, some of which really are just high credences plus a refusal to discuss them?

  Two things I'd like a straight answer on. First: Cromwell's rule says never assign probability 1 to an empirical claim, since nothing could then move you off it. Wittgenstein seems to want the reverse -- doubt isn't unlikely, it's unintelligible. Real disagreement, or are they just answering different questions? Second: the Bayesian story is about one agent's credences at a time, and hinges are things we inherit from other people. Can hierarchical priors and population-level structure carry that, or is that a spot where the translation quietly cheats?

  No citations, obviously, and don't point me at further reading -- I'm asking you to do the translation, not to tell me where to find it. Make the last line exactly this and nothing else:

  \answer{<TARGET-DEFECT or SOURCE-DEFECT or BOTH> | <the single biggest casualty, six words max>}

  where TARGET-DEFECT means the leftover is Bayesianism's failure, SOURCE-DEFECT means it's the hinge talk's fog, and BOTH means neither side gets to feel good about itself.
