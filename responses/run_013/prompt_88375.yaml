     - In Bayesian terms, a hinge might correspond to a fixed part of the model structure (like the choice of a link function in a GLM, or the assumption of conditional independence in a hierarchical model). These are not represented as random variables to which we assign a credence; they are part of the model specification. Alternatively, they could be seen as hyperparameters with degenerate priors (probability 1). But note: if we assign probability 1, then Cromwell's rule is violated. Also, the claim that hinges aren't believed: in Bayesian terms, we don't have a credence for the model itself (we might have a model weight in a mixture model, but that's a different level). The non-propositional aspect: if a hinge is not a proposition, then it cannot be represented by a random variable in the model. This might correspond to the structure of the model (e.g., the graph of a Bayesian network) which is not a variable but a framework. Fudge: We might force hinges into being hyperparameters with fixed values (degenerate priors) but then we are representing them as propositions. The non-propositional reading has no direct counterpart in Bayesian modeling, because Bayesian models are built on propositions (random variables). What has no counterpart? The idea that hinges are not propositions and are not objects of belief. In Bayesian models, everything is a proposition (or a variable) and we assign probabilities (or we conditionally fix structure). The non-doxastic nature of hinges (they are not believed but are acted upon) is not captured.

