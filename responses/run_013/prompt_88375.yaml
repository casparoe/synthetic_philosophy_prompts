answer: |-
  ### Translation of Hinge Epistemology into Bayesian Vocabulary

  **1. Doubt needs grounds, doubt presupposes certainty.**  
  - **Bayesian translation:** Doubt (assigning non-zero probability to alternative hypotheses) requires evidence that lowers the likelihood of the current hypothesis relative to alternatives. Certainty corresponds to a fixed model structure or hyperprior that defines the hypothesis space. Without this structure, Bayesian updating cannot occur—e.g., questioning the entire probability space requires a meta-model, but that meta-model itself must be fixed for the doubt to be computable.  
  - **Fudge:** Bayesianism allows recursive model comparison (e.g., Bayes factors) to doubt any level, but hinges represent the *practical* stopping point where no higher model exists. This fudges by importing Wittgenstein's "framework" requirement into Bayesianism as a computational necessity.  
  - **No counterpart:** The *unintelligibility* of doubt without certainty—Wittgenstein's conceptual point that doubt is meaningless without a background of fixed "hinges"—has no Bayesian equivalent. Bayesians treat doubt as always possible in principle (via model expansion), just computationally impractical.

  **2. Hinges aren't believed, and on some readings aren’t even propositions.**  
  - **Bayesian translation:** Hinges correspond to fixed model assumptions (e.g., choice of likelihood function, hyperpriors with zero variance, or graph structure in a Bayesian network). These are not assigned credences but are "baked in" as immutable constraints—e.g., assuming linearity in a regression model isn't a belief; it’s a modeling choice. Degenerate priors (probability 1) are a flawed analogy, as they violate Cromwell’s rule.  
  - **Fudge:** Representing hinges as degenerate priors or model structures smuggles in Wittgenstein by assuming they are propositions (contra non-propositional readings). Bayesianism lacks a non-doxastic category—everything is a belief (credence) or a structural assumption.  
  - **No counterpart:** The non-doxastic nature of hinges (they are enacted, not "believed") and non-propositional status (e.g., grammatical rules) have no Bayesian correlate. Bayesians must reduce hinges to propositions or modeling choices, losing the idea that they are "shown" in action.

  **3. The same proposition can function as a hinge in one context and as an ordinary empirical claim in another.**  
  - **Bayesian translation:** A proposition can shift from being a fixed hyperparameter (e.g., a constant in a simple model) to a random variable (e.g., in a hierarchical model where it’s estimated from data). Context-dependence arises via model selection: in a low-data context, we fix a parameter; in a high-data context, we estimate it. Sensitivity analysis formalizes this shift.  
  - **Fudge:** This works only if hinges are propositions. Bayesianism handles the shift mechanically but lacks Wittgenstein’s "context" as a change in *form of life* (e.g., social practices).  
  - **No counterpart:** The idea that a hinge’s status depends on holistic, non-evidential factors (e.g., cultural norms) rather than data availability. Bayesianism treats context as a modeling decision, not a lived background.

  **4. The river image (channel vs. water, fluid transformation).**  
  - **Bayesian translation:** Hierarchical models allow fluidity: "channel" elements (fixed hyperpriors or model structures) can become "water" (estimated parameters) via model expansion (e.g., adding layers to a hierarchical model), and vice versa via model simplification. Time-series models capture gradual change (e.g., drifting priors).  
  - **Fudge:** Bayesian updates are discrete and evidence-driven; the river metaphor implies continuous, organic change driven by non-evidential factors (e.g., cultural shifts). Translation forces fluidity into algorithmic model revision.  
  - **No counterpart:** The non-algorithmic, historical/social process of change—e.g., hinges "eroding" through collective practice, not data.

  **5. Justification gives out, ending in acting.**  
  - **Bayesian translation:** Justification halts at prior or model choices, which are not justified by evidence but are acts (e.g., selecting a conjugate prior for tractability). Decision theory ends in action (maximizing expected utility), grounding justification in pragmatic choice.  
  - **Fudge:** Bayesians still treat priors as doxastic (credences). Wittgenstein’s "acting" is pre-doxastic—e.g., Moore’s hand demonstration isn’t a choice but a spontaneous display.  
  - **No counterpart:** The collapse of justification into *non-reflective action*. Bayesianism always has a doxastic layer (priors as beliefs); hinges are "animal" certainty, not decision-theoretic.

  **6. Hinges from training/inheritance, not argument.**  
  - **Bayesian translation:** Hierarchical priors model inheritance—e.g., individual priors drawn from a population distribution (hyperprior), learned via empirical Bayes or data pooling. Training updates priors through likelihood-weighted exposure (e.g., Bayesian updating on observed social data).  
  - **Fudge:** This reduces training to evidence-based updating, ignoring Wittgenstein’s non-inferential "drill" (e.g., language games). Social inheritance becomes data, not tacit enculturation.  
  - **No counterpart:** The *non-propositional transmission* of hinges—e.g., apprenticeship in practices. Bayesianism treats socialization as data assimilation.

  ---

  ### Residue Report
  The translation reveals a **TARGET-DEFECT**: Bayesianism fails to capture the **non-doxastic, enacted foundation** of hinges. Key casualties:
  - **Certainty as action vs. credence**: Wittgensteinian certainty is pre-reflective (e.g., using a door hinge without thought); Bayesian "certainty" is always doxastic (high credence or model structure).
  - **Social/historical embeddedness**: Hinges are inherited through communal practice, not just hierarchical priors. Bayesianism individualizes belief, reducing society to data.
  - **Grammar vs. probability**: Non-propositional hinges (grammatical rules) lack a Bayesian counterpart—they structure inquiry but aren’t beliefs.

  **Source-Defect notes**: Hinge epistemology’s vagueness (e.g., "proposition or not?") complicates translation, but the core deficit is in Bayesianism’s doxastic commitment. It cannot model the *arational* (Pritchard) or *enactive* (acting without belief) aspects.

  ---

  ### Straight Answers
  1. **Cromwell’s rule vs. Wittgenstein**: Real disagreement. Cromwell’s rule is methodological: avoid P=1 to allow updating. Wittgenstein is transcendental: doubt requires hinges, so assigning P=1 is incoherent (not just unwise). Bayesians can approximate hinges with P≈1, but this conflates *unrevisability* (practical) with *unintelligibility* (conceptual).
  2. **Social inheritance**: Hierarchical priors *partially* capture it (e.g., population-level parameters), but they cheat by reducing sociality to data. Inheritance is not just shared beliefs but shared *practices*, which Bayesianism cannot model without fudging "training" as updating.

  Final line:  
  \answer{TARGET-DEFECT | non-doxastic enacted foundation}
