  ### Fairness Decision Tree for Risk-Scoring Models  
  **Entry Point**: Start from the three-way trade-off: *Within-group calibration*, *equal FPR (balance for negative class)*, and *equal FNR (balance for positive class)* cannot simultaneously hold for groups with different base rates, except in degenerate cases.  

  ---

  #### **Internal Nodes (Operational Questions)**  
  1. **Can we redefine the prediction target?**  
     (e.g., changing what "risk" means or measuring a different outcome)  
     - *Yes* → Leaf 1  
     - *No* → Node 2  

  2. **Is fairness defined at the individual level?**  
     (i.e., must similar individuals receive similar predictions, or must the decision be unchanged if the protected attribute were counterfactually altered?)  
     - *Yes* → Leaf 2  
     - *No* → Node 3  

  3. **Must fairness hold for arbitrary subgroups?**  
     (e.g., intersectional groups like "Black women aged 30-40," not just predefined protected groups)  
     - *Yes* → Leaf 3  
     - *No* (only predefined protected groups) → Node 4  

  4. **Can we use the protected attribute in the decision rule?**  
     (e.g., as a model feature or to set group-specific thresholds)  
     - *Yes* → Node 5  
     - *No* → Node 8  

  5. **Do we require scores to be calibrated by group?**  
     (i.e., does a score of *s* imply the same probability of outcome *Y=1* for every group?)  
     - *Yes* → Node 6  
     - *No* → Node 7  

  6. **Do we also require equal FPR *or* equal FNR?**  
     (i.e., must error rates balance for negatives or positives?)  
     - *Yes* → **Empty Branch** (Theorem: *Impossible by the three-way trade-off*)  
     - *No* → Leaf 4  

  7. **Which error metric is most critical to equalize?**  
     - *FPR/FNR (error rates)* → Leaf 5  
     - *Selection rate (demographic parity)* → Leaf 6  
     - *Neither* → Leaf 7  

  8. **Can we randomize decisions?**  
     (e.g., use coin flips to adjust predictions)  
     - *Yes* → Leaf 8  
     - *No* → Leaf 9  

  ---

  #### **Leaves (Positions & Commitments)**  
  1. **Redesign the target/construct**  
     *Awkward commitment*: Requires redefining the business problem and outcome metric.  
     *Path*: Node 1 → Yes  

  2. **Individual/causal fairness**  
     *Awkward commitment*: Demands a similarity metric or causal model, which is subjective and unverifiable.  
     *Path*: Node 2 → Yes  

  3. **Require fairness for all subgroups**  
     *Awkward commitment*: Likely infeasible due to data sparsity and compounded trade-offs.  
     *Path*: Node 3 → Yes  

  4. **Calibration-first**  
     *Awkward commitment*: Accepts unequal FPR/FNR across groups.  
     *Path*: Node 5 → Yes → Node 6 → No  

  5. **Error-rate balance (e.g., equalized odds)**  
     *Awkward commitment*: Sacrifices calibration (same score ≠ same risk across groups).  
     *Path*: Node 5 → No → Node 7 → FPR/FNR  

  6. **Demographic parity (group-specific thresholds)**  
     *Awkward commitment*: May reduce accuracy for some groups to force equal selection rates.  
     *Path*: Node 5 → No → Node 7 → Selection rate  

  7. **No classifier-level fix (pipeline/institution)**  
     *Awkward commitment*: Shifts burden to data collection, feature engineering, or societal intervention.  
     *Path*: Node 5 → No → Node 7 → Neither  

  8. **Randomized decisions**  
     *Awkward commitment*: Makes arbitrary decisions for individuals to achieve group parity.  
     *Path*: Node 4 → No → Node 8 → Yes  

  9. **Fairness through unawareness**  
     *Awkward commitment*: Ignores base-rate differences, often exacerbating outcome disparities.  
     *Path*: Node 4 → No → Node 8 → No  

  ---

  #### **Annotations**  
  - **Empty Branch** (Node 6 → Yes):  
    *Why empty*: **By theorem**. Calibration + equal FPR/FNR is impossible under base-rate differences (except degenerate cases).  
  - **Unseparated Leaves**:  
    - *Error-rate balance (Leaf 5)* and *Demographic parity (Leaf 6)* both allow protected attribute use.  
    *Separating question*: "Must equal FPR/FNR *override* equal selection rate?" (Added to Node 7).  
  - **Why other combinations are empty**:  
    - **Individual fairness + group metrics**: Incoherent (individual vs. group definitions clash).  
    - **Redesign target + mandatory protected attribute**: Unattractive (redundant if target already accounts for bias).  
    - **Randomization + determinism**: Incoherent (Node 8 enforces this choice).  
  - **Unpopulated Paths**:  
    - *Node 3 → Yes → Node 4 → No*: Unattractive—intersectional fairness without attribute use is intractable.  
    - *Node 5 → Yes → Node 7*: Incoherent—calibration precludes prioritizing error rates/selection.  

  ---

  ### How to Use This Tree  
  1. Start at Node 1. Answer questions based on **your constraints** (e.g., "Can we change the target?").  
  2. Follow the path to a leaf. The leaf’s "awkward commitment" highlights the trade-off you must accept.  
  3. If you hit an **empty branch**, revisit prior assumptions (e.g., relax calibration).  
  4. **No backtracking**: The tree forces explicit prioritization of fairness goals.  

  This tree resolves the recurring meeting by converting abstract debates into concrete, constraint-driven decisions.
