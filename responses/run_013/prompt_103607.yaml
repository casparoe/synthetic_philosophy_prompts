answer: |-
  The core concept you're describing is the **no-trade theorem**, a cornerstone of rational expectations equilibrium theory in finance and economics. Here's the precise carving:

  ### What the No-Trade Theorem Says
  - **Definition**: In a market where all agents are rational, share identical prior beliefs (common priors), and trade *only* based on private information, *no trade will occur*. The mere willingness of a counterparty to trade signals that they possess information you lack, eliminating the perceived advantage that motivated your trade.
  - **Assumptions**:  
    1. Common priors (everyone starts with the same baseline probabilities).  
    2. Rational Bayesian updating (all agents correctly interpret signals).  
    3. Purely informational motives for trade (no liquidity needs, irrationality, or hedging).  
  - **Mechanism**: Your belief that an asset is mispriced must be reconciled with the fact that a rational counterparty holds the opposite view. Their action reveals their private signal, forcing you to update your belief toward the market price. If both sides do this, trade collapses.

  ### How It Differs from Adjacent Concepts
  - **Vs. Efficient Market Hypothesis (EMH)**:  
    EMH claims prices reflect *all available public information*. The no-trade theorem focuses on *private information*: even if you have private info, trading is thwarted because counterparties infer your intent. EMH doesn’t preclude trade; the no-trade theorem explains why trade *shouldn’t* happen under ideal conditions.

  - **Vs. Adverse Selection / Market for Lemons**:  
    Adverse selection (e.g., Akerlof’s lemons model) describes *outcomes* where information asymmetry causes market failure (e.g., only low-quality cars are sold). The no-trade theorem is a *pre-trade mechanism*: it predicts trade won’t initiate *because* agents anticipate adverse selection. Lemons markets assume trade *does* happen (with inefficiencies); no-trade says it *shouldn’t*.

  - **Vs. Winner’s Curse**:  
    Winner’s curse occurs in auctions where the winner overpays due to incomplete information (e.g., bidding for oil leases). No-trade is broader: it’s a generalized skepticism about *any* counterparty’s motive, not just the risk of overestimation in competitive bidding.

  - **Vs. "If You’re So Smart, Why Aren’t You Rich?"**:  
    This is a heuristic about market efficiency. The no-trade theorem is a formal model showing why informed traders *can’t profit* from their info if others are rational—even if they are "smart."

  ### Boundaries and Edge Cases
  - **Where It Applies**:  
    - Prediction markets: Your crypto/ML friends hesitating to trade despite perceived mispricing.  
    - Poker: A sudden large bet signals strength because rational players wouldn’t bluff recklessly.  
    - Suspiciously cheap car: Your uncle’s offer implies hidden defects (he knows more than you).  

  - **Where It Breaks Down**:  
    1. **Noise Traders/Liquidity Sellers**: If your counterparty sells at 55 because they need cash (not information), the "signal" is distorted. Trade resumes.  
    2. **Divergent Priors**: If you and your counterparty fundamentally disagree *before* seeing new info (e.g., "Tesla is overvalued"), trade occurs.  
    3. **Non-Information Motives**: Hedging, tax loss harvesting, or rebalancing portfolios enable trade.  
    4. **Irrationality**: Idiots exist. If the seller is overconfident or misinformed, you profit.  

  - **Non-Market Applications**:  
    - **Landlord/journal editor eagerness**: This *is* the pattern, but not the no-trade theorem. Here, it’s **signaling theory** (their actions reveal hidden traits—e.g., desperation implies low quality). The logic is similar (counterparty behavior updates your beliefs), but motives aren’t purely informational.  
    - **Limitation**: No-trade requires a bilateral transaction with symmetric stakes. In one-off social interactions (e.g., a hasty landlord), power imbalances or non-financial motives dominate.  

  ### Bottom Line
  **The no-trade theorem** is your core concept for market settings. It explains why rational traders freeze when faced with a counterparty. In non-market contexts (landlords, editors), it morphs into **strategic information revelation via signaling**, which shares DNA but isn’t identical. The pattern persists if agents are rational and strategic; it dissolves with stupidity, differing priors, or exogenous motives.
