prompt: |-
  Alright, here's a thing I've been trying to name for a while and failing at. I hang around rationalist blogs and prediction markets and I keep bumping into a pattern that I feel like must have a name, but every time I go to look it up I fall into a pile of adjacent econ concepts that all feel close and none of which quite fits. My friend who trades crypto and my friend who does ML research got into it about this over dinner and none of us could say what the actual concept is, so I'm outsourcing it.

  The pattern goes like this. I think a contract is mispriced — I think the chance of X is 70 and it's trading at 55 — so my instinct is to buy. Then I remember that for me to buy at 55, someone has to sell at 55, and that person isn't obviously an idiot, so the mere existence of a willing counterparty is itself information about whether the price is right. And it gets perverse the more sure I am: the stronger my private view that they're wrong, the more I should wonder what they know that I dont, and if they know nothing I don't, why are they on the other side at all? Same shape when my uncle sells me his car suspiciously cheap (why me? why cheap?), and in reverse when a poker player suddenly bets big — his willingness to put money in tells me about his hand, not just mine — and I swear I've felt it in non-market settings too, like a journal editor who's unusually eager to publish my paper, or a landlord who's desperate to have me sign. What I can't figure out is whether the thing I'm pointing at is one concept or three. I know 'efficient markets' is nearby, and 'adverse selection' and 'the market for lemons' are nearby, and I have a hazy memory of some theorem to the effect that in a fully rational market where everyone starts from the same priors, private information alone can't generate any trade at all — but I don't trust that memory, I don't know what it's called or what it actually assumes, and I can't tell if it's the thing I'm after or a cousin of it. So: is there an established name for the pattern I just described, and if so, which of these neighbors is it, exactly?

  And please don't just hand me a label — the label isn't the point, I want the carving. If there's an established concept, tell me what it actually says, what it assumes, and what it is not, i.e. how it differs from adverse selection, from the efficient-market idea, from the winner's curse in auctions, and from the loose 'if you're so smart why aren't you rich' taunt. Where are the edges — does it survive once you allow noise traders or liquidity sellers or people who trade for reasons other than information, and does it extend to the non-market cases I listed or does it fall apart there? If nothing established quite fits the whole pattern, say so and coin a term, define it, and give me a couple of boundary cases where it clearly applies and a couple where it clearly doesn't. Also: lead with the bottom line in the first sentence — the name, or the news that there isn't one — then give me the reasoning, no preamble, no restating my question. American English please.
