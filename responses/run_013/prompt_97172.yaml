answer: |-
  Below is a decision tree for the metaphysics of material constitution, tailored to your bronze equestrian monument. It is built from the logical space of possible answers to pre-theoretical questions about the monument's existence, identity, persistence, and counting. The tree uses six questions, each answerable without prior metaphysical knowledge, and yields eight distinct leaves (seven named positions, one unnamed). Each leaf specifies the position's most awkward commitment regarding your monument. Combinations with no named position are flagged as incoherent, unattractive, or unexplored, as noted. Two positions (constitution without identity and coincident-objects pluralism) are indistinguishable under these questions and are treated as one leaf. The deflationary view is distinguishable early and does not swallow the rest.

  ### Decision Tree
  Start at the top and answer each question based on the monument's history.

  1. **Before the statue was cast, did a bronze lump exist that is now part of the monument?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 5.  

  2. **At the unveiling, was the statue numerically identical to that bronze lump?**  
     - **Yes** → Go to 3.  
     - **No** → Go to 4.  

  3. **Could the statue have survived being melted down?**  
     - **Yes** → **Leaf: Identity Monism**  
       - *Awkward commitment*: The bronze ingot melted for casting was not the same object as the statue, requiring the lump to pop into existence exactly when the statue was cast.  
     - **No** → **Leaf: (Unnamed; incoherent)**  
       - *Why*: Incoherent—if identical, the lump and statue must share all properties, but the lump could survive melting (from history) while the statue cannot.  

  4. **At the unveiling, were the statue and lump two objects occupying the same space?**  
     - **Yes** → **Leaf: Constitution Without Identity or Coincident-Objects Pluralism** (indistinguishable under these questions)  
       - *Awkward commitment*: Two things (the statue and the lump) stood on the pedestal at the unveiling, with one constituting the other.  
     - **No** → **Leaf: Eliminativism About the Lump**  
       - *Awkward commitment*: The bronze lump never truly existed; only the statue exists, making the pre-casting ingot a mere "proto-statue" or illusion.  

  5. **Could the statue have been made of completely different bronze?**  
     - **Yes** → Go to 6.  
     - **No** → Go to 7.  

  6. **After the statue was hauled down and cut apart, did it cease to exist?**  
     - **Yes** → **Leaf: Four-Dimensionalism**  
       - *Awkward commitment*: The monument was a temporal stage shared by two distinct spacetime worms (the statue-worm and lump-worm), each with different temporal parts.  
     - **No** → **Leaf: (Unnamed; unattractive)**  
       - *Why*: Unattractive—it denies the statue's destruction during disassembly, implying the scattered fragments are still the statue, contradicting the narrative.  

  7. **At the unveiling, were the statue and the lump one object or two?**  
     - **One** → **Leaf: Hylomorphism (Form not a Part)**  
       - *Awkward commitment*: The bronze lump was not a real object during the statue's existence; it was mere "prime matter" enformed by the statue's essence, erasing its pre-casting history.  
     - **Two** → **Leaf: Relative Identity by Sortal**  
       - *Awkward commitment*: The monument was the same thing as the pre-casting ingot under "lump" but a different thing under "statue," making the ingot both the same object as and not the same statue as the monument.  

  ### Notes on Unoccupied/Problematic Branches
  - **Identity Monism's "No" branch (Question 3: No)**: Incoherent, as explained. Identity requires property-sharing, but the lump's survival of melting contradicts the statue's destruction.  
  - **Eliminativism's implied branch**: Only eliminativism about the lump is named; eliminativism about the statue would require a "No" at Question 6 (statue survives disassembly), but this is covered under the unnamed, unattractive leaf.  
  - **Constitution and Coincident-Objects**: These are indistinguishable under the questions because both answer "two objects" at Question 4 and share the same commitment (two coinciding entities). No non-cheating question separates them.  
  - **Unnamed branch after Question 6: No**: Unattractive, as it denies the monument's destruction, conflicting with your narrative.  
  - **Deflationary view not in tree**: It is deliberately omitted from the tree because it rejects all questions as verbal; it would answer "Yes" to a meta-question ("Is this dispute merely about language?") and collapse distinctions. Since you requested no such question, it isn't included.  

  This tree isolates eight endpoints from your criteria, with clear distinctions. Use it to audit your characters' consistency: each must hold one leaf's commitments rigidly, without borrowing from others. For revision, map characters to leaves (e.g., a traditionalist sculptor as Identity Monist, a materialist historian as Four-Dimensionalist, a mystic as Hylomorphist) and enforce their rules.
