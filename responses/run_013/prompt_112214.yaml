  ### Grading and Feedback for St. Petersburg Game Question  
  **Total Score: 9/10**  

  **Comments on Your Answer:**  
  *(Comments are provided part by part, with specific praise, corrections, and explanations.)*  

  #### Part (a) [3 points; you earned 3 points]  
  **Your Answer:**  
  *"The expected value is infinite. The probability that the first heads appears on toss n is 1/2^n, and the payoff is 2^n, so every term in the sum equals 1, and there are infinitely many terms. But nobody would pay more than a few dollars to play, so the recommendation to maximize expected value is absurd, and that is the paradox."*  

  **Feedback:**  
  - **Strengths:** Your reasoning is **entirely correct**. You accurately explained the infinite expected monetary value (summing terms of \( \frac{1}{2^n} \times 2^n = 1 \) for infinitely many \( n \)) and highlighted the paradox (an infinite expected value contradicts real-world willingness to pay). This is a perfect response.  
  - **No improvements needed.**  

  #### Part (b) [3 points; you earned 3 points]  
  **Your Answer:**  
  *"Bernoulli's solution is that money does not have constant marginal utility: as wealth increases, each additional dollar is worth less to us. If utility is logarithmic in wealth, then the expected utility of the game is the sum over n of (1/2^n) log(2^n), and because the logarithm is bounded, this sum is finite, so the game has only a modest fair price. The infinite monetary expectation therefore does not carry over to infinite expected utility."*  

  **Feedback:**  
  - **Strengths:** You **correctly identified** diminishing marginal utility and Bernoulli’s logarithmic utility proposal. You also rightly noted that expected utility becomes finite under this model.  
  - **Minor Clarification:** While the conclusion is sound, the phrase "because the logarithm is bounded" is slightly imprecise. The key is that \( \log(2^n) = n \log 2 \), so the series \( \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot n \log 2 \) converges (due to exponential decay outweighing linear growth). However, this does not affect your score, as your overall argument is accurate.  
  - **Conclusion:** Full credit for a clear and correct explanation.  

  #### Part (c) [4 points; you earned 3 points]  
  **Your Answer:**  
  *"In the capped game, the expected payoff is 22 dollars. Because the expectation is finite, there is no longer a gap between the expected value and what a sensible person would pay: a rational player should be willing to pay up to 22 dollars, and the paradox disappears entirely."*  

  **Feedback:**  
  - **Strengths:** Your **computation of the expected monetary value ($22) is correct**, which is the core calculation required. The capped game’s expected value is indeed:  
    \[
    \sum_{n=1}^{20} \left( \frac{1}{2^n} \times 2^n \right) + \left( \frac{1}{2^{20}} \times 2^{21} \right) = \sum_{n=1}^{20} 1 + \left( \frac{1}{1,\!048,\!576} \times 2,\!097,\!152 \right) = 20 + 2 = 22.
    \]  
    This shows mastery of the direct-computation approach.  
  - **Flawed Reasoning:** Your claim that **"the paradox disappears entirely" is incorrect**, even though your monetary expectation is right. Here’s why:  
    - The paradox arises when expected monetary value (EMV) fails to reflect realistic willingness to pay (WTP). In the *capped* game, EMV = $22, but a risk-averse person (e.g., one with diminishing marginal utility) might still reject paying $22.  
    - **Why?** The game has high variance: 50% of the time, the payoff is ≤$2 (if heads appears on toss 1 or 2), while a $22 payment represents a significant loss in most outcomes. A utility-maximizer might only pay far less than $22 (e.g., $10–$15) due to risk aversion.  
    - **What you should have said:** "While the EMV is finite ($22), the paradox *persists in a weaker form* because expected utility (not EMV) determines WTP for a risk-averse player. A rational person with logarithmic utility might still pay less than $22, so EMV alone remains an unreliable guide."  
  - **Key Takeaway:** Your **conclusion is accidentally correct** about the EMV ($22) but **incorrect** about the paradox resolving. The paradox’s core issue—EMV ≠ WTP—can still apply here due to risk aversion.  

  ### Summary of Scoring:  
  - Part (a): 3/3 (Flawless)  
  - Part (b): 3/3 (Accurate with minor quibble; full credit)  
  - Part (c): 3/4 (Correct computation, but flawed conclusion about the paradox)  
  **Total: 9/10**  

  **Overall Feedback:**  
  Excellent work on parts (a) and (b)! You clearly grasped the infinite expectation and Bernoulli’s utility solution. For part (c), you nailed the math but missed the nuanced persistence of the paradox. Remember: finite EMV does not automatically align with "sensible" WTP if players are risk-averse. Keep up the strong analytical thinking—this was a high-quality response!
