  ## The Cold That Stays

  Sarah Chu’s fingers were cold. Not metaphorically cold, like the reception she’d gotten from the grant committee earlier, but physically cold, chilled by the draft slicing under her apartment door. She rubbed them together, staring at the screen. Not the technical manual for industrial pumps she was supposed to be finishing by Wednesday, but the email from Mei Ling. *My grandmother is very ill. She loves this poem. She recited it to me when I was small, and again yesterday. It’s very short. Can you make it into English? She wants to see it before… well. By Friday? I know it’s short notice. I’ll pay extra.*

  Attached was a scan of a handwritten note, the characters neat but faded. Below it, Mei Ling’s transcription and a literal gloss:

  **Source Poem: "Aube" (Fictional - Lirian Language)**
  *Formal Constraints:*
  *   3 lines.
  *   Syllable count: 7 / 6 / 7.
  *   Rhyme: AAA (all three lines rhyme).
  *   Refrain: The word "frais" ("cool/fresh/chill") must appear once per line, in the second syllable position of the first word of each line.
  *Literal Gloss:*
  *   Line 1: Fresh-dawn fingers cold touch my hand.
  *   Line 2: Cool-light cannot warm your thin hand.
  *   Line 3: Fresh-fear this cold stays in the bone.

  Sarah exhaled, fogging the chilly air. Friday. Three days. A tiny poem, but a cage of rules. Seven syllables? Easy. Six? Fine. Seven again? Manageable. Rhyming all three lines in English? Tricky, but possible. But forcing "cool/fresh/chill" into the *second syllable* of the *first word* of *every line*? That felt like threading a needle while wearing mittens. And Mei Ling’s grandmother was waiting. Sarah felt the pressure settle on her shoulders, colder than the draft.

  She started simple. Just get the meaning across, hit the syllable counts, worry about the rest later.

  > *Dawn's chill fingers touch my hand so cold.* (7: Dawn's **chill** fin-gers touch my hand so cold.)
  > *Cool light fails to warm your frail hand.* (6: Cool light fails to warm your frail hand.)
  > *Fresh fear's deep chill settles in the bone.* (7: Fresh fear's deep chill set-tles in the bone.)

  She read it aloud. Clunky. "Hand so cold" / "frail hand" / "in the bone" – the rhymes were there (cold/hand/bone), technically AAA, but weak, functional. "Frail hand" felt clinical. The syllable counts were perfect. Each line started with the constraint word disguised: "Dawn's **chill**" (second syllable), "**Cool** light" (first syllable *is* the word, so second syllable position is occupied by the sound), "**Fresh** fear's" (second syllable). It satisfied the skeleton. And it was utterly dead. A taxidermied bird. It conveyed the information – dawn, cold touch, inability to warm, fear, bone-deep chill – but the urgency, the intimacy hinted at in the gloss ("*my* hand," "*your* thin hand"), the sheer *fear* in "this cold stays," was smothered. Proof positive: a form preserved without the pressure of feeling was just a shell. Sarah deleted it, her cold fingers tapping the backspace key with unnecessary force. This wouldn't do for a dying woman who loved the original.

  She leaned back, shivering. What was the *point* of this poem? Not just description. A warning? A shared moment of vulnerability? That repeated "frais" – cool dawn, cool light, fresh fear. Not just temperature, but a quality, a sensation. Maybe even the *shock* of it. She thought of Mei Ling’s grandmother, reciting it to a child, and now, facing her own ending. The cold wasn't just outside; it was inside, the chill of mortality. Sarah abandoned the rigid constraint placement. Let the *feeling* lead. She chased the shiver.

  > *Coolness, dawn's first touch, so sharp on skin,* (7: Cool-ness, dawn's first touch, so sharp on skin,)
  > *Cannot melt the frost from your sweet dew.* (6: Can-not melt the frost from your sweet dew.)
  > *This piercing cold, sweet fear, sinks deep within.* (7: This pier-cing cold, sweet fear, sinks deep with-in.)

  She read it, and a shiver ran down her spine that had nothing to do with the draft. "Coolness... sharp on skin." The surprise of dawn's chill. "Sweet dew" for the grandmother's hand – fragile, precious. "Sweet fear" – the terrible beauty of facing the end, the intimacy of shared dread. "Sinks deep within" carried the permanence. The rhymes (skin/dew/within) were assonant, softer than perfect rhymes, but they worked. It flowed. It *felt* like something spoken at a bedside, beautiful and aching. But the cost? The constraint word "frais" was only explicitly present as "coolness" in line one. "Sweet dew" implied coolness but wasn't the word. "Piercing cold" captured the sensation but not the specific term. The syllable placement rule was utterly abandoned. It was beautiful, but was it the poem? Or Sarah’s elegy? Unease prickled. Was this a translation or a seance? She saved it as "Version B - Feeling".

  Her hands felt colder. She got up, filled the kettle, ran warm water over her stiff fingers. *Frais*. *Frais*. *Frais*. Second syllable, first word, every line. Why? Why that specific, awkward demand? It wasn't just decoration. She muttered the original gloss rhythmically: "**Fresh**-dawn fingers... **Cool**-light cannot... **Fresh**-fear this cold..." The repetition wasn't just sonic. It was structural fear. Each line began with that jolt of "cool/fresh/chill," like a recurring stab of anxiety. The dawn brings not comfort, but cold. The light fails to warm. The fear *is* the cold, settling in. The form *was* the feeling. Dropping that rigid repetition didn't just change the sound; it changed the poem's core assertion from a relentless, rhythmic dread to a more lyrical, perhaps resigned, melancholy.

  Sarah dried her hands, the warmth fleeting. She needed to keep that pulse. But how? "Chilldawn"? Awkward. "Cool-break"? Forced. She wrestled, counting syllables on her cold knuckles.

  > *Chill dawn's fingers graze my hand with cold.* (7: Chill dawn's fin-gers graze my hand with cold.) **Chill** is the first word, second syllable position.
  > *Cool-less light... no.* Fail.
  > *Frigid glow won't warm...* No "frais."
  > *Coolth's weak light cannot warm your thin hand.* (6: Coolth's weak light can-not warm your thin hand.) **Coolth's** - archaic, but the second syllable "th's" holds the constraint sound/meaning? Stretching it. But "thin hand" felt right, raw.
  > *Fresh dread's chill roots deep inside the bone.* (7: Fresh dread's chill roots deep in-side the bone.) **Fresh** dread's - second syllable.

  It wasn't beautiful like Version B. "Coolth" was clunky. "Graze with cold" was inelegant. The AAA rhyme (cold/hand/bone) was back, serviceable but not inspired. Yet, the *pulse* was there. **Chill** dawn. **Coolth's** weak light. **Fresh** dread's chill. Three cold jabs starting each line, mirroring the original's insistent dread. "Thin hand" held the fragility. "Roots deep inside the bone" conveyed the terrifying permanence. It kept the relentless, anxious rhythm Mei Ling’s grandmother might remember. It felt true to the original's stark architecture of fear. Sarah saved it as "Version C - Pulse". Her fingers, resting on the keys, felt like ice.

  Friday morning. The industrial pump manual sat completed, emailed hours ago. Sarah stared at the three versions on her screen. The grey dawn light matched the screen's glow.

  **Version A (Faithful Shell):**
  *Dawn's chill fingers touch my hand so cold.*
  *Cool light fails to warm your frail hand.*
  *Fresh fear's deep chill settles in the bone.*

  **Version B (Beautiful Betrayal):**
  *Coolness, dawn's first touch, so sharp on skin,*
  *Cannot melt the frost from your sweet dew.*
  *This piercing cold, sweet fear, sinks deep within.*

  **Version C (Anxious Pulse):**
  *Chill dawn's fingers graze my hand with cold.*
  *Coolth's weak light cannot warm your thin hand.*
  *Fresh dread's chill roots deep inside the bone.*

  The radiator clanked, offering a false promise of heat. Version A was correct and corpse-like. Version B was alive, a poem in its own right that moved her deeply, but it felt like a different message whispered in the same room – beautiful, but perhaps not what the grandmother needed or expected. Version C was ugly in places ("coolth"), anxious, almost grating in its repetitive chill, but it *felt* like the original's architecture of dread. It kept the constraint that *was* the feeling.

  Sarah thought of the dying woman. Did she want comfort? Or recognition? Did she want the chill softened to "sweet dew," or did she need the "thin hand" held, unadorned, in the weak light? Sarah’s own hands, resting on the desk, were cold again, the transient warmth from the tea mug already gone. She remembered running water over them yesterday, seeking fleeting relief that couldn't last.

  She opened the email to Mei Ling. Her fingers hovered. She attached Version C. She typed: *Mei Ling, attached is the translation. It holds close to the original structure, including the repeated emphasis on "cool/fresh/chill" at the start. It’s not the most fluid English, but I felt the form was integral to the feeling. I hope it brings your grandmother some connection.* She hesitated, then opened a new window. She copied and pasted Version B underneath, separated by a line. *I also tried this version, which focuses more on the feeling in English, but it takes more liberties with the original form. Perhaps one will resonate.*

  She didn't explain the constraints. She didn't rank them. She sent both. The cold, she knew, stayed in the bone. And whatever choice Mei Ling or her grandmother made, whatever resonance they found, Sarah would live with the knowledge of what each version surrendered. She saved all three files, closed her laptop, and stood up. She walked to the sink and ran the hot water, holding her hands under the stream until it scalded, chasing a warmth that couldn't reach the chill inside, the chill of the poem, the chill of choice, the chill that stays.
