answer: |-
  ### Credence
  0.4. The dominant term is **non-culpable moral ignorance** (sub-question b), as its plausibility heavily constrains WBE’s scope.

  ### Decomposition
  1.  **(a) Role of warranted belief in blame theory**: Moderately against WBE. Blame likely hinges more on *quality of will* (e.g., indifference to suffering) than epistemic warrant. A warranted but coldly self-interested belief may still reflect a blameworthy character.  
  2.  **(b) Non-culpable moral ignorance**: Weakly for WBE. Moral knowledge isn’t always accessible—social normalization (e.g., slavery in 1750) can make grave wrongs epistemically opaque, even to the conscientious. But contra WBE, core wrongs (e.g., torture) may be "easy" to know via basic empathy, risking over-excuse.  
  3.  **(c) Counterfactual determinacy**: Against WBE. For figures like an 18th-century colonist, the warrant condition is often *indeterminate*—evidence (e.g., slave narratives) existed but was suppressed or ignored en masse, making "conscientious reasoning" underspecified. Indeterminacy voids the excuse.  
  4.  **(d) Extension (too much/too little)**: Strongly against WBE. It over-excuses: a lazy modern wrongdoer who never considers their act’s impact might meet WBE’s condition yet seem blameworthy for culpable indifference. It under-excuses by ignoring agents who reasoned earnestly but had flawed evidence.  
  5.  **(e) Non-epistemic alternatives**: Neutral. Fairness-based excuses (e.g., "conceptual world" limits) are *rivals*, not supplements, as they reject WBE’s epistemic framing. Moral luck (e.g., born in a corrupt era) might better explain blamelessness without requiring warrant.  
  6.  **(f) Verdicts on historical figures**: Moderately against WBE. It clashes with confident blame of Columbus (deliberate brutality) or Churchill (preventable famine)—suggesting WBE is too lenient. This is a *modus tollens* against WBE if character assessments track blameworthiness.  
  7.  **(g) Culpable evidence-avoidance (added)**: Against WBE. The principle ignores *negligence*: agents who *could* have accessed counter-evidence but avoided it (e.g., a plantation owner ignoring abolitionist tracts) may be blameworthy despite "warrant" from their limited inputs.  
  8.  **(h) Moral progress asymmetry (added)**: Weakly for WBE. We condemn past wrongs *because* of hard-won moral progress; insisting contemporaries "should have known" risks presentist bias, favoring non-blame for contextually obscured wrongs.  

  *(Sub-questions (c) and (d) are flagged as partially non-truth-apt due to vagueness; handled via plausibility weights.)*  

  ### Combination  
  My 0.4 credence is a non-additive weighted sum. Sub-questions (b) and (d) dominate (weight: 40% combined), as WBE fails if moral ignorance is usually culpable (b → low score) or if it over-excuses negligence (d → low score). (c) and (g) further reduce confidence (30% weight) due to indeterminacy and culpable avoidance. (a), (e), (f), and (h) provide partial support but are secondary (30% weight); e.g., (h)’s anti-presentism slightly counters (f)’s verdict clash. The score isn’t a product because (b) and (d) are interdependent: if ignorance is non-culpable (b), over-excuse (d) becomes a *feature* rather than a bug. Overall, WBE’s over-breadth in (d) and epistemic fragility in (c)/(g) outweigh its insights in (b)/(h).  

  ### Sensitivity  
  The headline credence is most sensitive to **sub-question (b): non-culpable moral ignorance**. Settling it would shift my credence dramatically: to ~0.7 if moral ignorance is often non-culpable (e.g., showing that even diligent 18th-century agents lacked coherent anti-slavery frameworks), or to ~0.1 if moral truths are always accessible (e.g., demonstrating that empathy + basic logic universally reveals wrongs like slavery). The pivotal argument is whether moral knowledge depends on *socially contingent tools* (e.g., human rights concepts)—if yes, WBE gains force; if no, it collapses. Historical cases like Athenian democracy coexisting with slavery illustrate this: if moral progress requires collective epistemic labor, warrant may excuse; if moral truths are innate, blame persists.  

  ### Where we disagree  
  My credence (0.4) is above yours (0.3), likely due to differing weights on **sub-question (d): extension problems**. You may emphasize WBE’s over-excuse of negligent agents (e.g., colonists ignoring indigenous testimony) as a fatal flaw, lowering your score. I grant this but assign slightly more weight to (h)—moral progress asymmetry—which tempers the over-excuse concern by contextualizing negligence as partly era-constrained. This divergence reflects a deeper tension: whether "warrant" mitigates blame only for the epistemically trapped, or also for the avoidantly complacent.
