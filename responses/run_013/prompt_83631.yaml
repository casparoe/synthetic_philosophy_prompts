answer: |-
  Here’s a targeted Q&A prep sheet based on decades of committee experience with exactly this dynamic. Libertarians in analytic departments wield intuition pumps like scalpels – your goal is to show you can parry without dismissiveness while exposing the costs of *their* view.  

  **The Crucial Reply That Must Land:**  
  Your defense that **reactive attitudes function *without* desert-metaphysics** must be crystal clear. If they walk away thinking "He just redefined responsibility," you’re dead. Hammer: "We *feel* resentment because we’re participants in a moral community, not because we’ve deduced an agent metaphysically *deserves* it. Abandoning desert isn’t changing the subject – it’s exposing what we’re *actually doing*."  

  **Your Weakest Point to Fortify:**  
  **Claiming desert is 'incoherent' without libertarian free will.** Libertarians will smell blood here. Desert *is* coherent if you accept agent-causation or non-physical minds. Prepare to say: "Desert *presupposes* a self outside the causal chain imposing its will *ex nihilo*. But that’s not just mysterious – it’s *inconsistent* with how we explain actions empirically. We can’t keep desert without committing to ghostly metaphysics this department rejects." (Cite their physicalist commitments if they’re naturalists).  

  **The Question You Hope Nobody Asks:**  
  *"If we ditch desert entirely, why *punish* anyone? Isn’t your Strawsonian account just sophisticated consequentialism – modifying behavior through emotional manipulation, with no *real* responsibility?"*  
  (Why it’s deadly: Forces you to admit punishment loses retributive meaning, alienating both libertarians *and* Frankfurtians who keep a desert-core. The hard determinist will cheer, making you look radical.)  

  ---

  ### **Ranked Objections & Prep**  
  *(Ordered by likelihood + destructiveness)*  

  1.  **The Circularity Charge (Likelihood: 10/10, Damage: 10/10)**  
      **How They’ll Phrase It:**  
      "Aren’t reactive attitudes *themselves* presupposing desert? When I resent someone, it’s *because* I judge they freely chose to wrong me and *deserve* blame. Strawson just disguises the core libertarian intuition!" (Likely with an exasperated wave).  
      **Your 2-Minute Reply:**  
      "Great point – but let’s dissect the phenomenology. When your colleague forgets your coffee, you feel resentment *before* any metaphysical reflection. That reaction is rooted in the *participant stance*: seeing others as agents with whom we share expectations. Desert is a *theoretical gloss* we add. Strawson shows the practice is primary. Ditching desert isn’t ignoring the resentment; it’s explaining it *without* metaphysically impossible foundations. Your resentment still functions, just without unjustified ontological baggage."  
      **Weakness:** Risks sounding like "Your feelings are illusions."  
      **Tactic:** **Hold firm, but clarify.** Add: "This isn’t eliminating blame – it’s grounding it in our actual sociality, not a dubious metaphysics."  

  2.  **The Alternative Possibilities Gut-Punch (Likelihood: 9/10, Damage: 9/10)**  
      **How They’ll Phrase It:**  
      "So Jones *couldn’t have done otherwise* under determinism, but you still blame him when he embezzles? That’s monstrous! Intuitively, responsibility *requires* the ability to choose differently. Your 'revision' violates bedrock moral experience." (Will invoke a Frankfurt-case counterexample).  
      **Your 2-Minute Reply:**  
      "I share the intuition! But let’s test it. Imagine Jones *wants* to embezzle. A neuroscientist will stop him if he wavers, but he never does. Frankfurt shows Jones *couldn’t* have done otherwise – yet we still blame him. Why? Because his *will* was aligned with the act. The intuition tracks *ownership of will*, not indeterminism. Strawson captures this: we resent the *quality of will* displayed. Libertarian intuitions are real, but they misidentify their target."  
      **Weakness:** Frankfurt cases are controversial; some libertarians bite the bullet.  
      **Tactic:** **Concede partially.** "I agree PAP has intuitive pull! But its failure in Frankfurt cases suggests it’s not *essential*. What matters is whether the act expresses *his* reasons-responsive agency – which determinism allows."  

  3.  **The "You’re Changing the Subject" Move (Likelihood: 8/10, Damage: 8/10)**  
      **How They’ll Phrase It:**  
      "This isn’t 'compatibilism' – it’s redefining responsibility to make it compatible! You’ve jettisoned the *core* concept – *basic desert* (Pereboom). Responsibility without desert is like chess without checkmate. Why call it responsibility at all?" (The hard determinist may nod).  
      **Your 2-Minute Reply:**  
      "I’m not redefining; I’m *demystifying*. We *have* a practice of holding responsible. The libertarian analysis posits desert as its foundation. But Strawson shows the practice *is* the foundation. Asking 'Do they *really deserve it*?' outside any community of attitudes is like asking 'Is this *really* a promise?' outside a norm-governed practice. We keep the *substance* – blame, praise, sanctions – but drop the incoherent metaphysics. Isn’t that preferable to nihilism?"  
      **Weakness:** May feel like linguistic evasion to metaphysicians.  
      **Tactic:** **Hold firm.** Link to their skepticism: "Given your aversion to revisionary metaphysics, shouldn’t we prefer an account grounded in observable practices over speculative libertarian entities?"  

  4.  **The Phenomenology of Agency (Likelihood: 7/10, Damage: 7/10)**  
      **How They’ll Phrase It:**  
      "When I deliberate, I *feel* genuinely open alternatives – like I’m the ultimate source. Your determinism renders that an illusion. How can responsibility survive if our core experience of choice is false?" (Will lean hard on introspection).  
      **Your 2-Minute Reply:**  
      "The phenomenology is real! But it’s consistent with determinism. Feeling 'openness' reflects *epistemic uncertainty* and the *complexity* of decision-making, not ontological indeterminism. When you chose your career, it felt open because you weighed reasons – a deterministic process! Strawson preserves this: in the participant stance, we treat each other *as if* we’re free sources of action, because that’s how reason-exchange works. The feeling isn’t illusory; it’s embedded in the practice."  
      **Weakness:** Doesn’t fully address the "ultimate source" intuition.  
      **Tactic:** **Reframe.** "Libertarianism can’t explain *how* indeterminism helps – randomness doesn’t make me more the source! My view secures what matters: agency as reasons-responsive."  

  5.  **The "Why Abandon Desert?" Challenge (Likelihood: 6/10, Damage: 6/10 – but from the Hard Determinist!)**  
      **How They’ll Phrase It:**  
      "If determinism is true, why keep *any* notion of responsibility? Isn’t your Strawsonian account just a pragmatic fiction? Shouldn’t we be eliminativists?" (This traps you between libertarians and the determinist).  
      **Your 2-Minute Reply:**  
      "Because the participant stance isn’t optional! We *can’t* take the objective stance toward everyone without dissolving society. Even you, Professor [Name], resent being cut in line. Strawson shows responsibility is *constituted* by these inescapable reactions. Pragmatic? Yes. *Fiction*? No – it’s a real feature of human life. Abandoning desert isn’t abandoning responsibility; it’s making it metaphysically respectable."  
      **Weakness:** May seem ad hoc versus full eliminativism.  
      **Tactic:** **Hold firm.** "Eliminativism is psychologically impossible. My account takes our practices *seriously* without supernaturalism."  

  ---

  ### **Q&A Survival Tactics for This Crowd**
  - **Preempt the Cartoon:** Early on, say: *"I know my libertarian friends see this as abandoning the core of responsibility. Let me explain why I think it rescues responsibility from metaphysical impossibility."* Shows you grasp their anxiety.
  - **Flank the Frankfurtians:** Nod to them: *"Unlike some Frankfurtians, I argue PAP intuitions aren't salvageable – they point to desert, which we must excise."* Makes you seem bold, not unaware.
  - **When Cornered:** *"That's a deep worry. My *current* answer is X, but I'm refining it in my book manuscript."* (Shows scholarship is ongoing).
  - **Killer Closing:** End Q&A with: *"Ultimately, my view offers responsibility without spooky metaphysics – preserving what matters in our practices while respecting naturalism. I’d argue that’s not just compatible, but *necessary* for a plausible account."*  

  **Remember:** Their goal isn’t to refute you conclusively – it’s to see if you’re rigorous, charitable, and unflappable. Let the libertarians come hard. If you dissect their pumps, concede where fair, and stand firm on Strawson’s insight, you’ll earn respect even from opponents. Good luck – you’ve got this.
