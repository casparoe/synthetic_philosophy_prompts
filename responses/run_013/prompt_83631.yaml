prompt: |-
  I'm a postdoc in philosophy and I'm giving a job talk next month. My thesis is that moral responsibility is compatible with determinism, but only if we adopt a Strawsonian account of reactive attitudes; I argue that libertarian intuitions are actually tracking a different concept -- desert -- that we should abandon. The audience is a department thats mostly hardcore libertarians about free will, plus a couple of Frankfurt-school compatibilists and one hard determinist. They're all analytic, they love intuition pumps, and they're skeptical of revisionary metaphysics. I've been workshopping this with friends and they keep telling me the libertarians will eat me alive. I'm kinda nervous about the Q&A.

  Act as a seasoned philosopher who has sat on dozens of hiring committees and seen this exact kind of talk go badly. Start by brainstorming the likely objections, then give me a Q&A prep sheet: order the objections by how likely they are and how much damage they'd do, phrase each one the way a libertarian would actually put it (not the way I would), and for each give me a two-minute reply, a note on where the reply is weakest, and whether I should concede or hold firm. Also tell me the one reply that has to land for the talk to survive, the weakest point in my own position that I should prepare to defend rather than hope they miss, and the question I'm hoping nobody asks. Don't give me generic advice -- target this audience's specific commitments and vocabulary, and think carefully about the difference between what a libertarian would really say and what a caricature would say.
