  For what to concede upfront: I'd suggest acknowledging that training-based safety is preferable long-term, that some latency/cost impact is inevitable, and that internal evaluations aren't perfect. But they must refuse to concede on the need for runtime monitoring, the validity of the scheming threat model, or the trustworthiness of the monitor.

  The fatal objection would be if someone proves the trusted monitor isn't actually secure - either through vulnerabilities or because it's too weak. If that happens, the entire safety case unravels.

  I'll organize the objections from most to least damaging:
