prompt: |-
  I'm a science-and-ideas journalist and I'm putting in a fellowship applicaton — six months, one long feature and a couple of shorter pieces — and I want to pitch it on price controls, though not the usual "economists say rent control is bad" thing, because I think the interesting part is philosophical and everyone skips it. Here's the itch. Take the standard defence of letting someone flog bottles of water for a tenner after a flood: nobody forced the buyer, his alternative was going thirsty, so where's the wrong? Fine. Now run the same argument over a landlord charging whatever the market will bear, and over a boss paying a wage nobody could live on. The tenant's alternative is the street, the worker's is the dole. The argument seems to go through in all three cases, which means either gouging, eviction-level rents and poverty wages are all fine, or the argument proves too much and something has to be added — duress, exploitation, background injustice, something. And yet the profession that treats rent control as a settled error treats the minimum wage as a live question, usually on the grounds that employers have monopsony power and landlords don't. I suspect that bit of economics is being asked to do moral work it can't carry. My half-formed thought is that the right place to cut isn't the elasticity of supply but who sets the background rules and whether the person on the other side of the trade has any realistic way out — but I don't trust that yet.

  So: write me the two-page proposal. Nail the question down so it has a definite answer rather than being a thinkpeice. Say why the going positions — the economists' on either side, and the philosophers who write about gouging and exploitation — leave it open. Give me the method: what I'd actually do over six months, given that I can interview people and read but I'm not going to run any econometrics. Tell me what the deliverable is, what would count as the project failing, and whether six months is realistic or whether I'm kidding myself. I half-remember some behavioural work about people calling a wage cut unfair when the firm is profitable and fair when it isn't — if that's a real finding it's exactly the sort of thing I need, but don't quote anything at me, I'll chase the sources myself.

  And say how confident you are in what you tell me, and flag the one point you're least sure of. British English please — I'm filing to a UK foundation.
