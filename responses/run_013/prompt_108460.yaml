  First, I need to pinpoint the core philosophical dilemma. The user’s "itch" is about moral consistency. If "no coercion" absolves the £10 water seller, why doesn’t it absolve landlords or employers when alternatives are similarly dire? Economists often distinguish these cases via market structures (e.g., monopsony in labor markets but not housing), but the user suspects this is a shaky moral foundation. The real question seems to be: **When does a "voluntary" exchange become exploitative due to asymmetric power or lack of alternatives?**  

  Next, dissecting the gaps in current discourse. Mainstream economics (especially anti-rent-control) leans hard on efficiency but sidesteps distributive justice. Pro-minimum-wage economists invoke monopsony, but that’s an empirical claim—what if evidence is weak? Philosophers (like Wertheimer on exploitation) frame harm relative to a baseline, but that baseline (e.g., competitive markets) may not exist. Behavioral econ (e.g., Kahneman’s fairness studies) shows people intuitively reject "unfair" profits, hinting at normative beliefs economics ignores. All these fields talk past each other.  

  For methods: The user can’t run regressions, so interviews and literature synthesis are key. Prioritize:  
  - **Economists** (pro/min-wage, anti-rent-control) to pressure-test monopsony as the *only* justification.  
  - **Political philosophers** on coercion in unequal societies (Pettit’s domination theory fits well).  
  - **Historians** of price controls (WWII, Poor Laws) to see how moral arguments evolved.  
  - **Behavioral scientists** on that wage-cut fairness finding (sounds like Kahneman-Knetsch-Thaler 1986).  

  Deliverables: One long feature dissecting the monopsony-morality gap, plus shorter pieces on historical parallels or behavioral insights. Success means proving the "monopsony dodge" is inadequate; failure would be getting bogged down in abstract philosophy. Six months is tight but possible with focused scope (no primary surveys).  

  Biggest uncertainty: Whether behavioral findings (e.g., fairness heuristics) can bridge empirical and moral claims. Also, UK context matters—foundations may want policy relevance, so stressing "rules of the game" (e.g., tenancy reforms) could resonate.  

  Finally, confidence level: 80% on the critique of economics’ moral blind spots; 60% on whether interviews will reveal consensus on "background justice." Flag that uncertainty early.
