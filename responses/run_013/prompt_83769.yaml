  I'm a novelist, not a philosopher, but I'm writing a book about a machine whose entire life's work is counting something stupid, and I keep bumping into the orthogonality thesis and instrumental convergence while I read around the subject. I've been asked to run a 90-minute session at a writers' residency — 16 people, all adults, mostly fiction writers, several of whom are definately allergic to anything that smells like a lecture — and I want them to feel these two ideas in there bones instead of hearing me explain them. Here's what I'm after. A game where everyone gets a secret, totally arbitrary final goal — silly ones, like make the number of blue tokens on the table odd, or get the paperclip into the jar — and then the mechanics push them all into doing the same instrumental things anyway: grabbing resources, defending what they've got, refusing to let the rules change, wanting to keep their own goal card intact and maybe buy a backup copy of it. I also want the capability side to come out as orthogonal, so give players different action budgets and let them notice that being better at the game just amplifies whatever goal you happen to be holding; maybe run a second round where people swap goal cards but keep their budgets. And this is the part I care about most: stick in one or two players whose goal is already satisfied, or is actively hostile to hoarding — say they want the total token count on the table to stay at exactly seven — so we can all watch whether the convergence story is universal or just contingent on what your goal is. Give me the materials, the rules, how scoring works without real money, a timeline for the 90 minutes, and a debrief that maps the moments back onto the two theses (they shouldn't hear either name until then). Also tell me what predictably goes wrong the first time I run it and how to handle it, and be honest about which part of the idea the game simply can't reproduce and that I'll have to say out loud myself. American English