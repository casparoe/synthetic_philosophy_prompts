prompt: |-
  I am a program officer at a small regional foundation. We make about forty grants a year, each between $15,000 and $60,000, and I am responsible for recommending a slate to a board that has to sign off. The decisions repeat every quarter, the stakes are moderate but real, and I have roughly two days per slate, no capacity to commission external reviews, and a fixed pot of money. I keep being told that I should be satisficing rather than optimizing, but every version I encounter collapses into the advice to pick something good enough, which is useless when the board asks why we did not fund the stronger proposal that arrived a week later. Please turn the theory of bounded rationality and satisficing into a decision procedure I can actually run on individual proposals and on a slate.

  I want the procedure to respect several distinctions that I have found useful but that popular accounts tend to blur. First, satisficing is not merely optimizing with a lower bar; it has a different structure. An optimizer needs a well-defined option set and a complete ranking, whereas a satisficer needs a search rule and a stopping rule, plus an aspiration level that can adapt as search proceeds. Second, the search rule and the stopping rule are separate decisions: where to look next is not the same question as when to stop. Third, there is a difference between satisficing as a descriptive claim about how people actually decide under limits and satisficing as a normative recommendation for what to do when search is costly. Fourth, bounded rationality includes temporal, cognitive, and institutional constraints, not only missing information. Please build the procedure around those distinctions, and do not let it quietly turn into a scoring rubric that ranks every proposal, because that is the optimizing behavior I am trying to avoid.

  The procedure should be something I can run in a few hours with a pen and a folder of proposals. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Then apply it to three cases: a proposal that meets the threshold but is in a fashionable area where we already have three grants; a proposal that falls just below the threshold but comes from a region we have never funded and where the need is severe; and a proposal that arrives after the slate is set but looks stronger than anything on it. Include one case where the procedure tells me to stop and not fund the stronger late proposal, which I will not like. End by saying what the procedure cannot do, where it will misfire, and which steps are judgment calls dressed up as procedure. Write as if you have no web access; do not provide citations, reading lists, or references.
reasoning: |-
  We are designing a satisficing decision procedure for grant recommendations that respects bounded rationality. The procedure must include:
  1. A search rule: how to look at proposals (order, what to consider)
  2. A stopping rule: when to stop searching and make a decision
  3. An aspiration level: a threshold of acceptability that may adapt during the process

  We break the procedure into two parts: 
  - Part A: Individual proposal assessment (to determine if a proposal is satisfactory)
  - Part B: Slate construction (to assemble a set of satisfactory proposals within the budget)

  Constraints: 
  - Time: about two days per slate (of roughly 10 grants per quarter, since 40 per year)
  - No external reviews, fixed pot of money

  Key distinctions:
  - Not optimizing (no complete ranking)
  - Separating search and stopping rules
  - Normative satisficing: we accept that we may not get the absolute best, but we get what is good enough and we can justify stopping.

  The procedure must avoid being a scoring rubric. We use pass/fail criteria and an aspiration level that can adjust.

  Part A: Individual Proposal Assessment (for one proposal)

  We define an aspiration level (threshold) for a proposal to be satisfactory. This threshold is not fixed forever; it may adjust as we see more proposals (adaptive aspirations). We start with a base aspiration level that we set by reflecting on past grants and foundation priorities.

  Questions to ask for each proposal (in order):

  1. **Eligibility**: Does the proposal meet the foundation's formal eligibility criteria? (e.g., geographic focus, nonprofit status, alignment with our mission)
     - Sufficient answer: Yes (proceed) or No (reject immediately).
     - If No, stop and reject.

  2. **Feasibility**: Is the project described feasible? (Can the organization reasonably accomplish what it sets out to do with the resources it has and within the proposed timeline?)
     - Sufficient answer: Yes (proceed) or No (reject). If unsure, we mark as "needs more thought" but we cannot commission external review. So we use a heuristic: if there are no obvious red flags (like an unrealistic budget or timeline, or lack of key staff), then we pass.
     - If No, stop and reject.

  3. **Impact Potential**: Does the project have a reasonable chance of producing a meaningful positive impact in the area it addresses? (We are not looking for the highest impact, but we want to avoid funding projects with trivial or negligible impact.)
     - Sufficient answer: Yes (proceed) or No (reject). We are satisficing, so we set a minimum bar. We ask: if the project succeeds, will it make a noticeable difference? We are not comparing to other projects.

  4. **Organizational Health**: Is the organization in a stable enough condition to carry out the project? (We look at financial health, staff turnover, etc. as available in the proposal.)
     - Sufficient answer: Yes (proceed) or No (reject). We don't require perfection, but we avoid organizations that appear to be at risk of collapse.

  5. **Cost-Effectiveness**: Is the cost per expected outcome within acceptable bounds? (We do not calculate exact numbers, but we make a rough judgment: is the amount requested reasonable for the expected outcomes? We compare to similar projects we have funded in the past.)
     - Sufficient answer: Yes (proceed to next step) or No (reject). We set a range: e.g., if a similar project in the past cost $50,000 and achieved X, then this one should not be wildly off (say, $100,000 for the same X). We allow some flexibility.

  If a proposal passes all five, it is marked as "satisfactory". We do not rank satisfactory proposals at this stage.

  However, note that the aspiration level for these criteria may adjust as we see more proposals. For example, if we see many strong proposals, we might raise the bar for "Impact Potential" or "Cost-Effectiveness". Conversely, if we see few, we might lower it a bit. We set the aspiration level at the beginning of the quarter based on past experience, but we adjust it as we review. We do this by:

  - Setting an initial aspiration level: We start with the same level as last quarter's satisfactory proposals.
  - After every 5 proposals, we review: if the last 5 were all satisfactory, we raise the bar slightly (e.g., for impact, we might become a bit more demanding). If we have not found any satisfactory in the last 5, we lower the bar slightly (but not below the initial minimum).

  But note: we do not re-review proposals that we have already passed or failed. We adjust going forward.

  Part B: Slate Construction

  We have a budget constraint and a time constraint. We also want to avoid over-representation in one area.

  Search rule for the slate:
  - We start by looking at proposals in the order they were received (or by a random order, or by region, depending on foundation priorities). We set the order at the beginning of the quarter. We'll assume we process in the order of arrival.

  Stopping rule for the slate:
  - We stop when we have a set of satisfactory proposals that (a) meets the budget (the total requested is within the quarter's allocation) and (b) meets a minimum number of grants (if we have too few, we might lower aspirations and re-scan the rejects, but we set a time limit). We also stop when we run out of time (after two days) and then we take the set we have that fits the budget.

  But we also have a rule to avoid over-concentration: we set a cap per area (e.g., no more than 3 grants per thematic area per quarter). This is a constraint we impose to maintain diversity.

  The procedure for the slate:

  1. Set the initial aspiration level (based on last quarter's satisfactory proposals).
  2. Set the budget for the quarter (fixed).
  3. Set a cap per area (e.g., 3 per area).
  4. Start with the first proposal in the queue (by arrival date).
  5. Apply Part A (individual assessment) to the proposal. If it passes, then:
     - Check if we have already reached the cap for that area. If not, add it to the slate and subtract the amount from the budget. If we have, then skip (but mark as satisfactory and set aside).
  6. If it fails, move on.
  7. After every 5 proposals, adjust the aspiration level (as described in Part A).
  8. Continue until either:
     a. We have exhausted the queue of proposals for the quarter, OR
     b. We have reached the budget cap, OR
     c. We have reached the time limit (two days).
  9. If we have not filled the budget and there are skipped proposals (because of the area cap) or we have time, we can consider relaxing the area cap? But we set the cap as a hard constraint? Or we can set a soft constraint: we allow one more if the proposal is exceptional? We want to avoid over-concentration, so we keep the cap.

  But note: if we stop because of time and we have not filled the budget, we can go back and look at the proposals we skipped due to the area cap? But that breaks the order. Alternatively, we can do:

  - We run through the queue once. Then, if we have budget left and time, we can look at the satisfactory proposals that we skipped because of the area cap and see if we can relax the cap for the most promising of them? But that introduces ranking (which we are avoiding). So we stick to the cap.

  Alternatively, we can pre-define the areas and set a maximum per area. We do not break the cap.

  10. If we have budget left and we have run out of proposals, we can lower the aspiration level and re-scan the rejected proposals? We do this only if we have time. We set a time limit for this re-scan (say, 1 hour). We lower the aspiration level by one notch (e.g., relax one of the criteria, say, we allow a marginally less cost-effective proposal). We then go through the rejects until we fill the budget or run out of time.

  But note: we do not want to spend too much time. We set a time box for the entire process (two days).

  11. We then present the slate to the board.

  Now, we address the three cases:

  Case 1: A proposal that meets the threshold but is in a fashionable area where we already have three grants.

  - In our procedure, we have an area cap (say, 3). So when we get to this proposal, we mark it as satisfactory but skip it because of the cap. We set it aside. If at the end we have budget and time, we do not go back (unless we have a rule that allows it). So we do not fund it. We stop and do not fund it because of the cap.

  Case 2: A proposal that falls just below the threshold but comes from a region we have never funded and where the need is severe.

  - In the individual assessment, it fails (say, at the feasibility step). We reject it. However, if we get to the end and have budget left, we do a re-scan of the rejects with a lowered aspiration level. We might then reconsider this proposal if we lower the bar for feasibility. But note: we only lower the aspiration level if we are below the budget and have time. We then re-scan in the original order? Or we focus on regions we have never funded? We don't want to optimize. So we re-scan in the original order. If we come across this proposal again and it now passes (because we lowered the bar for feasibility), then we fund it if we haven't hit the area cap for that region? (We might have a cap for regions too? The problem says a region we have never funded.) We don't have a cap on regions, we have a cap on thematic areas. So we fund it if it passes the lowered bar and we have budget.

  Case 3: A proposal that arrives after the slate is set but looks stronger than anything on it.

  - We do not consider it. Our search rule is to look at proposals in the order of arrival (or by a fixed deadline). We set a deadline for each quarter. Proposals arriving after the deadline are considered in the next quarter. We do not break the stopping rule. We have stopped because we have a slate that meets the budget and we are within time. We do not reopen the process. So we do not fund it now, even if it is stronger.

  Now, we write the procedure step by step.

  ---

  **Proposed Satisficing Procedure for Grant Recommendations**

  **Preliminary Setup (before starting a quarter):**

  1. Set the quarterly budget (from the fixed annual pot).
  2. Define the aspiration levels for the five criteria (based on the previous quarter's satisfactory proposals). Write down the initial thresholds for each criterion (e.g., for cost-effectiveness: "within 20% of the average cost per outcome of past similar grants").
  3. Set a cap per thematic area (e.g., 3 grants per area per quarter).
  4. Set a deadline for proposal submission for the quarter.
  5. Gather all proposals received by the deadline.

  **Part A: Individual Proposal Assessment (for one proposal at a time, with current aspiration level)**

  Ask in order:

  1. **Eligibility**: Does it meet our formal criteria?
     - Yes → Proceed to 2.
     - No → Reject.

  2. **Feasibility**: Is the project feasible? (No red flags in budget, timeline, or staffing.)
     - Yes → Proceed to 3.
     - No → Reject.

  3. **Impact Potential**: Will it likely make a meaningful positive impact?
     - Yes → Proceed to 4.
     - No → Reject.

  4. **Organizational Health**: Is the organization stable?
     - Yes → Proceed to 5.
     - No → Reject.

  5. **Cost-Effectiveness**: Is the cost reasonable for the expected outcomes? (Compared roughly to past projects.)
     - Yes → Mark as "satisfactory".
     - No → Reject.

  After every 5 proposals assessed, adjust the aspiration level for the next proposals:

  - If 4 or 5 of the last 5 were satisfactory: raise the bar (e.g., for impact, require a bit more; for cost-effectiveness, be a bit stricter).
  - If 0 or 1 of the last 5 were satisfactory: lower the bar (but not below the initial minimum set in the preliminary setup).
  - Otherwise, keep the same.

  **Part B: Slate Construction**

  1. Order the proposals by arrival date (oldest first).
  2. Initialize the current budget remaining = quarterly budget.
  3. Initialize a count per thematic area (all zero).
  4. For each proposal in order:
     - Apply Part A (with the current aspiration level).
     - If satisfactory:
          - Check the count for the proposal's thematic area. If below the cap (e.g., <3), then:
              - Add to slate.
              - Subtract the requested amount from the current budget.
              - Increment the count for that area.
          - Else (cap reached for that area):
              - Skip (but record it as satisfactory and skipped due to cap).
     - If not satisfactory, move on.
     - After every 5 proposals, adjust the aspiration level (as in Part A).
     - If the current budget drops to zero, stop (we have a full slate).
  5. When we finish the queue (or run out of time), check:
     - If the current budget is zero, we are done.
     - If there is remaining budget and we have time (within the two days), we do a re-scan of the rejected proposals (in the original order) with a lowered aspiration level:
          - Lower the aspiration level by one notch (relax one criterion, e.g., allow cost-effectiveness to be 30% off instead of 20%).
          - Go through the rejected proposals in order until we either fill the budget or run out of time (set a time limit for this re-scan, e.g., 1 hour).
          - For each, reapply Part A with the lowered bar. If now satisfactory, and if the thematic area cap is not reached, add to the slate and subtract the amount.
     - If we still have budget left after the re-scan, we leave it for the next quarter (or return to the annual pot).
  6. Prepare the slate for the board.

  **Application to Cases**

  Case 1: Satisfactory proposal in a capped area (already 3 grants in that area).
  - During step 4 of Part B, we skip it because of the cap. It is set aside. We do not fund it in this quarter.

  Case 2: Proposal that initially fails (say, feasibility) but from an unfunded region with severe need.
  - In the first pass (step 4), it fails and is rejected. Then, in the re-scan (step 5), we lower the aspiration level (say, we relax the feasibility threshold). We go through the rejects in order. When we get to this one, we reassess. With the lower bar, it now passes? If yes, and if the thematic area cap is not reached (note: the cap is by thematic area, not region), then we fund it. We do not have a cap on regions, so we fund it if it now passes and we have budget.

  Case 3: Strong proposal arriving after the slate is set.
  - We do not consider it. It arrived after the deadline, so it will be in the next quarter's queue. We have already stopped the process for this quarter.

  **What the Procedure Cannot Do and Where It Misfires**

  - It cannot guarantee that we fund the absolute best proposals. We accept that we are funding satisfactory ones within the constraints.
  - It might miss a very strong proposal that arrived late (as in Case 3). We accept that because reopening the process would be too costly in time and would break the stopping rule.
  - The area cap might cause us to skip a very good proposal in a popular area, even if it is better than some we funded in other areas. But we avoid over-concentration at the cost of potentially missing some good ones.
  - The aspiration level adjustment is a judgment call: how much to raise or lower the bar? We defined a rule (after every 5 proposals, based on the count), but the amount of adjustment is subjective. We suggest small steps (e.g., 5% change in cost-effectiveness threshold). This step is a judgment call dressed as procedure.
  - The re-scan step (with lowered aspiration) might be seen as a second chance and could take time. We time-box it to avoid excessive search.
  - The criteria in Part A are judgment calls. For example, "meaningful positive impact" is subjective. We rely on the program officer's expertise. The procedure does not eliminate judgment; it structures it.
  - The procedure assumes we can define thematic areas clearly. In practice, there might be overlap. This requires judgment.

  In summary, this procedure gives you a structured way to satisfice: you search in a fixed order, stop when you have a slate that fits the budget and time, and adjust your standards based on what you see. It explicitly separates the search (by arrival) and stopping (budget, time, or queue end) rules. It adapts the aspiration level. It does not rank proposals. It can justify to the board: "We set a deadline, we processed in order, we set a cap to avoid over-concentration, and we stopped when we had a satisfactory slate within the budget. The late proposal will be considered next quarter."

  This procedure respects bounded rationality by limiting the search and using adaptive heuristics. It is not perfect, but it is feasible under your constraints.
answer: |-
  ### Satisficing Decision Procedure for Grant Recommendations  
  **Core Principles**  
  - **Satisficing ≠ optimizing**: No ranking or scoring. We define pass/fail thresholds (aspiration levels) and adapt them during the search.  
  - **Separate search and stopping rules**:  
    - **Search rule**: Order of reviewing proposals (e.g., first-come-first-served).  
    - **Stopping rule**: Halt when a slate meets budget + time constraints, regardless of unseen proposals.  
  - **Adaptive aspiration levels**: Thresholds adjust based on proposals seen (e.g., raise if many pass; lower if few pass).  
  - **Constraints**: Time (2 days/slate), cognition (no complex calculations), institutions (board deadlines, budget caps).  
  - **Values vs. facts**: The procedure flags when *you* must decide (e.g., trade-offs between equity vs. impact).  

  **Decision Procedure**  
  *Tools needed:* Pen, folder of proposals, timer, budget worksheet.  
  *Time allocation:* 1.5 days for assessment, 0.5 days for slate finalization.  

  #### **Phase 1: Individual Proposal Assessment (Pass/Fail)**  
  *Goal:* Determine if a proposal is "good enough" (satisfactory) using adaptive thresholds. Ask these questions **in order**; stop if a "No" occurs.  

  1. **Eligibility Check**  
     - *Question:* Does it meet all formal criteria? (e.g., geography, nonprofit status, submission deadline).  
     - *Sufficient answer:* Yes (→ proceed).  
     - *Stop if:* No (reject). *No judgment call—fact-based.*  

  2. **Feasibility Gate**  
     - *Question:* Is there ≥70% confidence the project will execute as described? (Assess: timeline, budget realism, team capacity).  
     - *Sufficient answer:* Yes (→ proceed).  
     - *Stop if:* No (reject). *Judgment call: Based on your experience.*  

  3. **Impact Threshold**  
     - *Question:* If successful, would this project deliver *meaningful* (not maximal) benefit to the target population?  
     - *Sufficient answer:* Yes (→ proceed).  
     - *Stop if:* No (reject). *Judgment call: "Meaningful" defined by foundation values.*  

  4. **Sustainability Filter**  
     - *Question:* Is there ≥1 credible path to sustained outcomes post-grant? (e.g., community buy-in, organizational capacity).  
     - *Sufficient answer:* Yes (→ proceed).  
     - *Stop if:* No (reject). *Judgment call: Credibility assessed intuitively.*  

  5. **Cost-Bound Test**  
     - *Question:* Is the cost per outcome ≤120% of our historical average for similar work?  
       - *Calculate roughly:* E.g., Past literacy grant = $200/student; this proposal = $240/student → pass.  
     - *Sufficient answer:* Yes (→ mark as "satisfactory").  
     - *Stop if:* No (reject). *Fact-based with room for error.*  

  *Adapt aspiration levels after every 5 proposals:*  
  - If ≥4 pass → raise thresholds (e.g., cost-bound tightened to 110%).  
  - If ≤1 pass → lower thresholds (e.g., cost-bound relaxed to 130%).  
  - *Rationale:* Adjusts to reality of applicant pool without ranking.  

  #### **Phase 2: Slate Construction (Satisficing within Constraints)**  
  *Goal:* Build a slate that fits budget/time using search and stopping rules.  

  1. **Search Rule**  
     - Order proposals by **submission date (oldest first)**. *Why?* Fair, predictable, avoids "waiting for better."  

  2. **Stopping Rule**  
     - Stop when:  
       a. Budget is exhausted, OR  
       b. 1.5 days elapse, OR  
       c. All proposals are reviewed.  

  3. **Diversity Cap (Institutional Constraint)**  
     - Set a cap per focus area (e.g., max 3 grants/issue). *Why?* Avoids overconcentration; set by board policy.  

  4. **Procedure**  
     - **Step 1:** Start timer (2 days total).  
     - **Step 2:** Review proposals in order (oldest first), applying Phase 1.  
     - **Step 3:** For each "satisfactory" proposal:  
       - If budget allows AND focus area cap not met → add to slate.  
       - If cap met → skip (record as "cap-constrained").  
     - **Step 4:** After every 5 proposals, adjust Phase 1 thresholds.  
     - **Step 5:** When stopping rule triggers:  
       - If budget remains, revisit skipped "cap-constrained" proposals. *You* decide: Bend cap? (Values call).  
       - If still under-budget, *do not* reopen search. Leave funds for next quarter.  

  **Output:** Slate of satisfactory proposals within budget, ready for board.  

  ---  
  ### **Application to Cases**  
  *Context:* Quarterly budget = $200K; cap = 3 grants/issue; Phase 1 thresholds at baseline.  

  **Case 1: Satisfactory but Overrepresented**  
  - *Proposal:* Youth tech education (fashionable area). Passes all Phase 1 thresholds.  
  - *Issue:* 3 tech grants already on slate.  
  - *Procedure:*  
    - Search rule → review in order.  
    - Phase 2, Step 3 → Skip (cap met).  
    - Stopping rule → No revisit unless under-budget.  
  - *Outcome:* Not funded. *Board justification:* "We prioritize diversity; caps prevent overinvestment in single issues."  

  **Case 2: Sub-Threshold but High-Need Region**  
  - *Proposal:* Rural healthcare (never-funded region; severe need). Fails Phase 1, Question 5 (cost-bound = 125% > 120%).  
  - *Procedure:*  
    - Phase 1 → Rejected at Question 5.  
    - Later, after 5 weak proposals, aspiration level lowers → cost-bound now 130%.  
    - Rescan rejects in order → Proposal now passes (125% < 130%).  
    - Phase 2 → Add to slate if budget/cap allow.  
  - *Outcome:* Funded if budget remains. *Board justification:* "Adapted thresholds to pool quality; this met revised cost-bound."  

  **Case 3: Strong Late Proposal**  
  - *Proposal:* Arrives after deadline. Objectively stronger than slate proposals.  
  - *Procedure:*  
    - Search rule → Not in folder (missed deadline).  
    - Stopping rule → Slate finalized; no reopening.  
  - *Outcome:* Not considered. *Board justification:* "Deadlines ensure efficient use of time; late proposals disrupt satisficing. It will be reviewed next quarter."  
  - *Why you won’t like this:* A stronger proposal is excluded, but stopping rules prevent endless search.  

  ---  
  ### **Limitations and Failure Modes**  
  1. **What it cannot do:**  
     - Guarantee optimal outcomes. A rejected proposal might be "better" than a funded one, but satisficing avoids this comparison.  
     - Override institutional constraints (e.g., caps, deadlines). These are fixed boundaries.  
     - Eliminate judgment. Feasibility/impact thresholds rely on your expertise.  

  2. **Where it misfires:**  
     - **Aspiration adjustments may be arbitrary:** Raising/lowering thresholds lacks precision but is necessary for adaptation.  
     - **Order bias:** Oldest-first search may miss strong late submissions (mitigated by deadlines).  
     - **Overly rigid caps:** May exclude high-impact proposals in popular areas. *Your role:* Advocate to board for cap adjustments if systematic.  

  3. **Judgment calls disguised as procedure:**  
     - Feasibility/impact thresholds (Phases 1.2, 1.3) → Your experience defines "credible" or "meaningful."  
     - Diversity caps → Balancing equity vs. impact is a values call.  
     - Rescanning rejects → Deciding which thresholds to relax is subjective.  

  **Final Note:** This procedure *respects bounds*. It converts bounded rationality from theory to action by:  
  - Fixing search order and stopping points.  
  - Using adaptive thresholds, not rankings.  
  - Making trade-offs explicit (e.g., "We funded this rural grant because we lowered cost-bound after weak pool").  
  You’ll satisfice—not optimize—and the board’s question about the "stronger late proposal" is preempted by the stopping rule.
