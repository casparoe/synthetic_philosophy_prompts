answer: |-
  ### Trans-World Identity Registry Activity  
  **Objective:** To experientially confront the tensions in origin essentialism (Kripke's thesis) through a bureaucratic simulation where participants must certify or reject identity claims across possible worlds, highlighting the twin paradox and the arbitrariness of origin.

  ---

  #### **Materials & Preparation**  
  - **Cost:** Near-zero. Use scrap paper, old envelopes, and school printer.  
  - **Materials per Participant:**  
    1. **World Dossier (1 sheet):** A printed table describing 5 possible worlds (cut from scrap paper).  
    2. **Claim Form (5 sheets per participant):** Half-size scrap paper with fields: *Claimant ID*, *World*, *Certify Existence? (Y/N)*, *Registrar Verdict (✓/✗)*.  
    3. **Registrar Handbook (1 per registrar):** Rules printed on the back of an old envelope (see below).  
  - **Setup:**  
    - **World Dossiers:** Print 1 master copy per group. Cut into strips for each world.  
    - **Claim Forms:** Fold A4 scrap paper in half, cut into two forms (10 forms per sheet).  
    - **Role Cards:** Assign 3 registrars per group (write "REGISTRAR" on envelopes); others are claimants.  

  **Master World Dossier (Photocopy/Print):**  
  ```
  WORLD 1 [ACTUAL]: You originate from sperm S and egg E.  
  WORLD 2 [SPERM SWAP]: You originate from sperm S2 (different sperm) and egg E.  
  WORLD 3 [EGG SWAP]: You originate from sperm S and egg E2 (different egg).  
  WORLD 4 [TWIN]: Same fertilized egg Z (from S+E) splits; you are one twin. Your sibling is genetically identical.  
  WORLD 5 [LOTTERY]: Same parents, but conception relies on a coin flip: heads = S+E, tails = S2+E2. You exist only if heads.  
  ```

  **Registrar Handbook Text (Write on envelopes):**  
  ```  
  RULES:  
  1. CERTIFY a claim ONLY if the claimant's ORIGIN (sperm+egg) matches their actual origin (World 1).  
  2. REJECT if origin differs.  
  3. MARK contradictions (two claimants for one origin).  
  PENALTY: Lose 1 point per inconsistent ruling.  
  ```  

  ---

  #### **Rules & Roles**  
  - **Groups:** Split into groups of 5 (3 claimants, 2 registrars). Rotate registrar roles halfway.  
  - **Claimants:** File claims for all 5 worlds. Write **Claimant ID** (e.g., "Alice-1") on forms. For each world:  
    - Tick "Y" if they believe they exist in that world, "N" if not.  
    - Submit forms to registrars.  
  - **Registrars:**  
    - **Phase 1:** Certify/reject claims individually.  
    - **Phase 2:** Resolve disputes as a panel.  
    - Apply rules rigidly. Penalty: Lose 1 point per reversal (e.g., certifying World 2 after rejecting identical claims).  
  - **Scoring (No Money):**  
    - Claimants: +1 per consistent certification (claim matches verdict).  
    - Registrars: Start with 5 points; lose 1 per inconsistency.  
    - **Group Win:** All claimants certified correctly + registrars score ≥3.  

  ---

  #### **Timeline (50 Min)**  
  **0:00–0:10 — Setup & Briefing**  
  - Distribute materials (2 min).  
  - Explain rules: "You are filing/verifying identity claims across worlds. Registrars must enforce origin rules. Inconsistencies cost points." (3 min).  
  - Silent reading of World Dossier (5 min).  

  **0:10–0:25 — Claim Filing & Initial Rulings**  
  - Claimants complete 5 claim forms (7 min).  
  - Registrars rule individually on each form (✓/✗ + reason). Enforce rules rigidly (8 min).  
    *Predictable Issue: Claimants tick "Y" for World 4 (twin) but registrars must certify (same origin).*  

  **0:25–0:35 — Contradiction & Appeal**  
  - **World 4 Focus:** Registrars notice identical claims from twins (e.g., Alice-1 and Alice-2 both claim World 4).  
  - Panel debate: Both cannot be certified without contradiction. Forced to reject one arbitrarily (5 min).  
  - **World 5 Focus:** Claimants debate "lottery" arbitrariness. Registrars penalized if inconsistent with prior rulings (5 min).  

  **0:35–0:45 — Scoring & Group Debate**  
  - Tally scores (3 min).  
  - Groups discuss: "Why did World 4 force arbitrary rejections? Why does World 5 feel unfair?" (7 min).  

  **0:45–0:50 — Debrief**  
  - **Map Activity to Doctrine:**  
    - **Twin World (4):** "Same fertilized egg → two people. If origin=egg, identity isn’t unique. Origin *can’t* be the egg alone."  
    - **Lottery World (5):** "Sperm/egg origin feels arbitrary—like a lottery. But if identity hinges on this, is it *meaningful*?"  
  - **Kripke’s Claim:** "Origin essentialism avoids these problems by insisting sperm/egg is necessary—but this activity shows its tensions."  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem:** Registrars ignore contradictions in World 4.  
     **Fix:** Circulate, whisper: "Two claimants for one origin—certify both? Rule 2 says reject one."  
  2. **Problem:** Claimants resist World 5’s arbitrariness.  
     **Fix:** Ask registrars: "If origin differs, *can* you certify? Check Rule 1."  
  3. **Problem:** Time runs out during rulings.  
     **Fix:** Skip World 3 if needed; focus on 4 and 5.  

  ---

  #### **What the Activity Cannot Reproduce**  
  The activity forces participants into the twin paradox and origin arbitrariness but cannot simulate the **modal necessity** underpinning Kripke’s argument—that we intuitively *feel* we couldn’t have originated from different gametes. This *must* be explained in debrief:  
  > "Kripke argues origin is essential because we can’t coherently *imagine* being born from different sperm/egg—it feels like imagining a *different person*. The activity makes you *reject* this via twins/lottery, but the doctrine’s core is that pre-philosophical intuition."  

  ---

  **Verdict:** The activity cannot reproduce the *modal intuition of necessity*—the raw, pre-theoretical certainty that "I could not have come from a different sperm and egg"—which Kripke’s doctrine ultimately rests upon.
