  ## Dear Diotima: Practical Ethics for Infinite Beings

  **Letter 1: The Divided Weekend**
  *Dear Diotima,*
  *I'm torn! This Saturday, Habitat for Humanity needs volunteers for a critical build day – helping to house a family currently living in their car. But it’s also the same day as my cousin Lara’s wedding. I love Lara, and skipping feels deeply wrong. But Habitat genuinely needs bodies. My friend says since the future is infinite, both choices have infinite moral weight, so I might as well flip a coin. That feels… cheap? And Lara would kill me. Help!*
  *– Pulled in Poughkeepsie*

  **Letter 2: The Moving Van Blues**
  *Dear Diotima,*
  *My friend Ben roped me into helping him move apartments this weekend. It’s a huge hassle – renting the truck, heavy lifting, the whole day gone. I’ve calculated I could instead work an extra shift and donate that $200 to the Against Malaria Foundation, potentially saving a life. Doesn’t that have vastly higher expected value? Ben would be annoyed, but surely preventing death outweighs friendship friction? Or does the infinite future make even small annoyances infinitely bad? I’m confused.*
  *– Calculated in Calgary*

  ---

  **Dear Pulled and Calculated,**

  Your quandaries exemplify the friction between finite human lives and the daunting prospect of infinite value. We must navigate this with care, distinguishing crucial modes of infinitude. As every reader surely knows, the canonical issue arises not *merely* from infinite payoff structures (like ensuring an eternal utopia), but more perilously from the coupling of **finite payoffs with infinitesimal probabilities of influencing that infinity** – the domain of Pascal’s Mugging and its kin. Conversely, the St. Petersburg paradox showcases infinite *expected value* from finite probabilities and unbounded finite payoffs. We are often in murkier waters.

  **Pulled:** Your Habitat volunteering offers a finite good: aiding one family. Your cousin’s wedding fosters finite relationship capital. Crucially, neither action possesses an *infinitesimal probability* of triggering infinite consequences. Volunteering *might* inspire others, creating a chain leading to vastly improved institutions over millennia. Attending the wedding *might* solidify family bonds that prevent a future schism cascading into an interstellar war. The probabilities are non-zero but vanishingly small – true infinitesimals. Multiplying these infinitesimal probabilities by the infinite value of a utopian (or dystopian) future yields undefined or problematic expected values. The standard move here is to invoke **fanaticism**: if we assign *any* non-zero probability (no matter how small) to an action influencing infinite value, we are compelled to prioritise actions maximising the *probability* of positive infinity or minimising the probability of negative infinity, regardless of finite costs. This is intellectually bracing but practically paralyzing.

  Therefore, we must bracket the infinitesimal probabilities. Within the finite realm, helping house a family in need carries significant moral weight, as does honoring familial commitments. While both *could*, under fanaticism, demand infinite focus, their *expected finite utilities* are comparable. Flipping a coin *is* rationally permissible. However, *because* both finite goods are components of a potentially infinite tapestry, their significance is amplified, not nullified. Your intuition that Lara would "kill you" reflects the profound, non-arbitrary weight of relational bonds within any coherent future. **Choose the wedding.** The finite relational rupture carries more *immediate and definite* weight than the probabilistic, distributed good of volunteering, *especially* when considering the potential for negative relational infinities (eternal family resentment is, mathematically speaking, a hell of a thing). An infinite heaven *does* straightforwardly outweigh an infinite hell, assuming positive utilities dominate, but the probabilities of your choice triggering either remain stubbornly infinitesimal. Focus on the definite finite.

  **Calculated:** Your case is different. Helping Ben move provides a finite good (relieving his burden, strengthening friendship) against a finite cost (your time/effort). Donating $200 to AMF has a small but *non-infinitesimal* probability (estimated in the realm of 10^-4 or better per $4,000, scaling down) of directly saving a life – a very large finite good. Crucially, the link between saving a life *now* and influencing the *infinite* future is vastly more robust and probable than the chains in Pulled’s case. Each life saved contributes directly to the potential future population. Ignoring infinitesimals again, the expected finite utility of donating likely dwarfs helping Ben move. This is a classic case where finite expected value comparisons hold sway.

  However, fanaticism whispers: even the *tiny* chance that your presence moving Ben prevents *him* from, say, accidentally causing a catastrophe with global repercussions (probability epsilon) must be weighed against the *tiny* chance your donation disrupts a critical equilibrium leading to negative infinity (also epsilon). Comparing these rival infinitesimal probabilities multiplied by rival infinities is where cardinality bites. Is the infinite negative value of Ben-caused-doom greater or lesser than the infinite positive value prevented by your donation? Standard models assume symmetry, but deeper set theory suggests caution. **Nevertheless, the definite, calculable high expected finite value of the donation, coupled with its more direct link to preserving potential future lives, is compelling.** Explain your reasoning to Ben, offer compensatory pizza funds, and donate. The finite expected utility difference is stark, and while both paths *could* touch infinity, the donation path aligns better with increasing the probability of a positive one.

  In both cases, the specter of the infinite future transforms finite choices from trivial to cosmically resonant, yet rarely dictates a single obvious path. We proceed with finite tools, wary of the infinitesimal, respectful of the immense, and hopeful that our cardinal arithmetic holds.

  **Rigorously,**
  **Diotima**
