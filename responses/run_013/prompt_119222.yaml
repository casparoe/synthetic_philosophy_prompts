answer: |-
  The ink-stained ruler felt like a bone in Karva’s hand. Outside the tall windows of the New Weissenhof Central Statistics Bureau, the city breathed its usual polyglot hum – tram bells clanging over shouted arguments in three languages, the scent of baking bread and coal smoke mingling. Inside, order reigned in silent rows of pictograms. Karva’s domain: the Transformer Room.

  Her desk was a landscape of meticulously categorized data sheets and the tools of her trade: calibrated stencils for the standardized figures – Worker, Child, Loaf of Bread, Coal Lump, Sickbed – and the thick, leather-bound *Visualization Protocols*. Rule One: Size Lies. Fifty small, identical figures, never one large one. Rule Two: Physicalism. Only that which can be weighed, measured, or counted may be depicted. Rule Three: Neutrality. The Transformer is a conduit, not an interpreter.

  The request landed with a soft thud, delivered by a junior clerk whose eyes darted away. "Director’s Office. Priority." The attached dossier was thin, unsettlingly so. *Project: Civic Harmony Quantification – Phase 3: Care Labour.* Karva’s brow furrowed. Care Labour? They tracked factory output, calorie intake, housing density, disease incidence. What was this?

  She opened it. Pages of survey transcripts, not numbers. Fragments of voices:

  *"...six hours yesterday just calming him after the night terrors, the doctors say it's the gas..."*
  *"...she won't eat unless I sit and feed her, stroke by stroke, an hour each meal..."*
  *"...listening, always listening, to the anger, the fear... it drains the cup..."*
  *"...holding her hand while she faded... counted the breaths... what unit is that?"*

  And the summary sheet: *Estimated Total Hours: 12,700 (Weekly). Primary Actors: Designated "Home Carers" (Unregistered Informal Sector). Activity: Emotional/Material Sustenance. Proposed Unit: "Carer-Hour."*

  Karva stared. A "Carer-Hour"? What figure did that correspond to? The **Worker** pictogram? But the **Worker** stood beside a lathe or carried bricks. It implied productive, physical output for wages. This… this was different. It was *inside*. It was the hand held, the tear wiped, the silence borne. Rule Two screamed in her mind: *Physicalism*. You couldn’t weigh a moment of comfort. You couldn’t measure the weight of listening. Where was the pictogram for *patience*? For *presence*?

  She sketched instinctively: a single figure, slightly hunched, perhaps holding… what? A spoon? Too specific. A hand outstretched? Too vague. A heart? Absolutely forbidden – non-physical symbol. She tried rows of small, identical **Worker** figures. But this felt like a lie. The **Worker** in the factory chart was one unit of labour producing ten units of widget. What did one unit of **Worker** here produce? One unit of… prevented despair? One unit of dignity maintained? Unquantifiable. Unpicturable. Size might lie, but *reduction* lied worse.

  The Protocol offered no guidance. "Carer" wasn't a recognized category. "Emotional Sustenance" wasn't a measurable output like tons of steel. Anxiety coiled in her stomach. The Bureau *was* the government's voice. The ISOTYPE exhibits in the People's Museum shaped how New Weissenhof saw itself: a city of quantifiable progress, problems solved by visible, countable interventions – more clinics built (rows of **Sickbeds**), fewer hungry children (fewer **Empty Bowls**). This… this threatened the picture. It was vast, vital, and utterly invisible to their visual language.

  Director Vorbeck arrived without announcement, his sharp suit smelling of ozone and authority. He scanned her frantic sketches – the rejected figures, the scribbled notes questioning the unit. "Problem, Transformer Karga?"

  "The unit, Director… 'Carer-Hour.' The *nature* of the activity… Rule Two…"

  Vorbeck picked up her attempt using the standard **Worker**. "This seems adequate. The figure is neutral. It represents one hour of human effort. That is quantifiable." He tapped the dossier. "The data exists. Twelve thousand, seven hundred hours. That is a fact. Our duty is to depict facts clearly for the people."

  "But Director," Karva protested, the heresy tasting strange, "the **Worker** figure carries meaning. It implies *productive* labour, wage-earning, contributing to the material city. This care work… it’s different. Using the same figure… it distorts. It hides what it actually *is*."

  "What it *is*," Vorbeck said softly, leaning close, "is labour that currently falls outside our systemic view. Uncounted. Unvalued. The Administration wishes to *include* it. To make it *visible*. To show the totality of civic effort." He smiled, thin and efficient. "Your pictogram *will* make it visible. As units of human effort. That *is* neutral. That *is* factual. What specific muscle is used, what emotion is felt…" He waved a dismissive hand. "Irrelevant to the count. Non-physical. Rule Two applies. It falls out. We depict what *can* be counted: hours, bodies engaged."

  He pointed a manicured finger at her stencil of the **Worker**. "Use this. Twelve thousand, seven hundred times. Fifty figures per row. Calculate the rows. Clean. Clear. By tomorrow morning. The Museum awaits the new 'Social Harmony' panel."

  He left. The hum of the city outside seemed louder. Karva looked at the stencil. The **Worker** was sturdy, anonymous, facing forward. A unit of effort.

  Slowly, mechanically, she began. She drew the first row: fifty identical **Workers**. Then another. And another. Each tiny figure erased the sleepless night, the murmured comfort, the trembling hand held. Each repetition screamed Rule One: Size Lies. But the greater lie was the figure itself. It transformed the immeasurable weight of care into just another brick in the wall of countable progress. It made the invisible visible only by annihilating its essence. The soul of the act, the *value* inherent in that specific labour – forbidden by physicalism, erased by the demand for countable units – vanished.

  The final chart was pristine. Rows upon rows of diligent **Workers**. No hint of the tears absorbed, the fears soothed, the slow fade into death accompanied. Just units. Neutral. Factual. Ready for the Museum, where the people of New Weissenhof would see their society reflected back – complete, countable, and profoundly incomplete. Karva added the label: "Civic Harmony Labour: 12,700 Carer-Hours Weekly." She underlined "Hours." The only thing, according to the Bureau, that was real.

  She closed the dossier. The voices inside were silent now, translated into silent, identical men. The system hadn't failed. It had performed its function perfectly. It had rendered the un-renderable by making it something it wasn't, and by deciding that what couldn't be pictured, in the official story, didn't truly count.

  In one line: The neutral picture promised clarity but demanded the erasure of everything that couldn't be simplified into a countable unit.
