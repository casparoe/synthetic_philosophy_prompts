prompt: |-
  Bit of a wierd request, but here goes. I'm in a small reading group on the philosophy of vagueness and we've just spent two sessions on the epistemicism/supervaluationism split. Crudely: the epistemicist says a predicate like "bald" or "heap" really does have a sharp boundary, it's just that we can never know where it falls, so borderline statements still have a determinate truth value that we're simply ignorant of; the supervaluationist says borderline cases are where the term just hasn't been made precise yet, so a sentence counts as true only if it comes out true under every admissible way of sharpening the term, false if false under every sharpening, and neither when it flips depending on how you sharpen. Our next session is meant to be a case study and I've been handed the IAU's 2006 redefinition of "planet" and the demotion of Pluto, and I have to bring an analysis that runs both theories against the episode and then reads the episode back against the theories. I know the basic story already — the Prague vote, the requirement that a planet has cleared the neighbourhood around its orbit, the earlier counter-proposal that would've kept Pluto and added Ceres, Charon and Eris and left us with twelve planets, and the fact that Eris's discovery is what forced the whole thing — so please don't spend the answer recapping it. I want the actual work.

  Do the mapping carefully and tell me who the players are and what they were actually deciding. Was the IAU committee locating a boundary that was always there (so the epistemicist gets the episode for free, and the only puzzle is why we couldn't see the boundary before), or were they stipulating one, in which case I want to know what makes a stipulation "admissible" in the supervaluationist sense and whether a vote by a body of astronomers is the kind of thing that can generate an admissible precisification at all. There's a wrinkle I keep chewing on: before the vote, did "planet" already include or exclude Pluto — was there a fact of the matter — and does either theory give a cleaner answer to that than the other? And I'd like you to be honest about where each theory goes quiet. Does the "cleared the neighbourhood" clause function as a sharpening, and if so is it arbitrary, or does it track something real in the world that the vague term was groping toward? Push it in both directions: what the episode confirms in each theory, what it looks like an anomaly for, and whether it's a case either view never anticipated — for instance, whether a term can be sharpened by fiat and still be vague in the way supervaluationists need, or whether the epistemicist can really say Pluto was determinately a planet or determinately not one all along and we were just in the dark. I'd also like a verdict, not just a survey: which of the two handles the Pluto case better, and where does the case make trouble for the winner. No need for citations or reading lists — I'm just after the argument, and assume I can't look anything up while reading your answer.
reasoning: |-
  Okay, let me try to unpack this user's query. They're part of a reading group on vagueness in philosophy, specifically focusing on epistemicism and supervaluationism. They need to analyze the IAU's 2006 redefinition of "planet" and Pluto's demotion through these two lenses. The user already knows the basic facts, so they want a deep dive into how each theory applies to the case.

  First, I need to recall the core differences between epistemicism and supervaluationism. Epistemicism posits that vague predicates have sharp boundaries, but we can't know them. Supervaluationism says that borderline cases lack definite truth values until a precisification occurs. The user wants to know whether the IAU was discovering a pre-existing boundary or stipulating one.

  The user's explicit questions are about mapping the theories to the episode, the role of the IAU committee, the status of Pluto before the vote, and how the "cleared the neighbourhood" clause functions. They also want a verdict on which theory handles the case better and where it might struggle.

  Hmm, the user mentions a wrinkle: was Pluto a planet before the vote? This is crucial. For epistemicism, there must have been a fact of the matter, even if unknown. Supervaluationism would say it was indeterminate. But the IAU's process complicates both views because they voted on a definition. Was that vote a discovery or a stipulation?

  The user also asks about admissibility in supervaluationism. What makes a precisification admissible? Scientific accuracy? Coherence with usage? The IAU's definition could be seen as admissible if it aligns with scientific goals, but if it's arbitrary, that might not hold. The vote itself as a method raises questions—can a committee create an admissible sharpening?

  Another point: the user wants honesty about where each theory goes quiet. Epistemicism might struggle to explain why the boundary was unclear before Eris. Supervaluationism might have trouble with the vote being an authoritative stipulation rather than a natural precisification.

  I should consider the historical context. Before 2006, "planet" included Pluto, but new discoveries like Eris challenged that. The IAU's decision was a response, not a random act. Does this support epistemicism, as if the boundary was always there but revealed? Or does the rejected 12-planet proposal show that multiple precisifications were possible, supporting supervaluationism?

  The "cleared the neighbourhood" criterion is key. If it tracks a real astronomical distinction (like orbital dominance), epistemicism could argue it was the hidden boundary. If it's arbitrary, supervaluationism might better explain the choice among alternatives. The user wants both directions explored.

  For a verdict, I need to weigh which theory fits the case better. Supervaluationism seems more flexible with the IAU's stipulation and the existence of borderline cases. Epistemicism's sharp boundary might not align with the ongoing debates and alternative definitions proposed. But supervaluationism has to handle whether the IAU's vote counts as a valid precisification, which might be messy.

  Also, the user's deeper needs: they want a clear, structured argument without citations, focusing on the philosophical application. They might be preparing for a discussion, so clarity and strong points are essential. They might also want to provoke thought in their group by highlighting where each theory succeeds or fails in this real-world example.
answer: |-
  Here's a rigorous analysis mapping the Pluto demotion onto epistemicism and supervaluationism, focusing on your core philosophical questions:

  **The Players & The Decision:**
  *   **The Players:** The IAU Committee (specifically the Planet Definition Committee and the voting members at the Prague General Assembly). Representing astronomy, but *not* linguists or philosophers.
  *   **The Decision:** They weren't merely *describing* existing usage or discovering a pre-existing astronomical fact (like Pluto's mass). They were **stipulating a definitional boundary** for the scientific term "planet" within their discipline. Crucially, they chose one specific definition (clearing the orbit) over viable alternatives (like the dynamic 12-planet proposal).

  **Analysis through the Lenses:**

  1.  **Epistemicism:**
      *   **Mapping:** Claims "planet" *always* had a sharp boundary. The IAU committee, through scientific investigation and deliberation, *discovered* this hidden boundary. Pluto was determinately *not* a planet all along; the prior classification was simply an error born of ignorance (analogous to classifying whales as fish before understanding biology).
      *   **Pre-Vote Status of Pluto:** Determinately *not* a planet. Our belief that it was one was false.
      *   **The "Cleared the Neighbourhood" Clause:** Represents the *discovered* necessary and sufficient condition that always constituted planethood. It tracks a "real" property in the world (gravitational dominance/evolutionary endpoint of formation) that the vague term was implicitly groping towards. The boundary wasn't arbitrary; it reflected a fundamental dynamical distinction astronomers uncovered.
      *   **Why Couldn't We See It Before?** Ignorance! We lacked sufficient understanding of Solar System dynamics, the prevalence of trans-Neptunian objects, and precise criteria for orbital dominance. Eris's discovery forced the issue, revealing our ignorance about the necessary scale of dominance.
      *   **Where it Goes Quiet/Anomalies:**
          *   **The Stipulative Vote:** Why was a *vote* necessary to "discover" a pre-existing fact? This feels deeply odd for epistemicism. Discovering Pluto's mass doesn't require a vote; discovering a definitional boundary shouldn't either. The process looks more like legislation than discovery.
          *   **Viable Alternatives:** The rejected 12-planet proposal based on hydrostatic equilibrium was scientifically coherent. If the boundary was always sharp, why was this even a contender? Epistemicism struggles to explain why multiple, seemingly reasonable definitions were on the table if only one corresponded to the hidden truth.
          *   **Borderline Cases *After* Definition?** Does "cleared the neighbourhood" *itself* have sharp boundaries? (e.g., Exactly what fraction cleared? Over what timescale?). If it does, epistemicism just pushes the vagueness down a level. If it doesn't, the IAU failed to fully sharpen the term.

  2.  **Supervaluationism:**
      *   **Mapping:** Before 2006, "planet" was vague. Pluto was a **borderline case**. The IAU committee performed an **admissible precisification** – they selected one specific way of making the term precise (clearing the orbit) from among the admissible candidates (which included the hydrostatic equilibrium definition).
      *   **Pre-Vote Status of Pluto:** **Indeterminate.** Under some admissible precisifications (e.g., "large round body orbiting the Sun"), Pluto was a planet. Under others (e.g., "gravitationally dominant body"), it was not. There was no single fact of the matter before the IAU acted.
      *   **The "Cleared the Neighbourhood" Clause:** This *is* the chosen precisification. It *functions* as the sharpening.
      *   **Admissibility:** What made this precisification (and the rejected alternatives) *admissible*?
          *   **Scientific Grounding:** Connection to astrophysical principles (orbital dynamics, formation processes).
          *   **Coherence with Core Usage:** Preserving the classical planets as clear cases.
          *   **Practical Utility:** Creating a manageable classification for research and education given new discoveries.
          *   **Rejecting Arbitrariness:** While the *choice* between admissible precisifications might involve convention, the *admissible set* is constrained by the world and prior usage. A definition like "green planets" would be *inadmissible*.
      *   **The Vote:** The vote is the **mechanism of precisification**. A scientific body like the IAU is precisely the kind of authoritative community that *can* stipulate an admissible precisification for a technical term within its domain. It's analogous to a standards body defining a unit of measurement.
      *   **Where it Goes Quiet/Anomalies:**
          *   **Authority & Democracy:** Does a majority vote by astronomers (not all experts, not all present) truly constitute a binding precisification for the *language*? What about dissenters? Supervaluationism needs an account of *who* has the authority to precisify a term, especially a culturally loaded one like "planet". The process felt messy and political, not just semantic.
          *   **Sharpening by Fiat?** Does this top-down, convention-heavy approach fully capture the "vagueness" supervaluationism usually describes? It feels more like redefinition than resolving inherent vagueness through context or precisification principles.
          *   **Was the Term *Really* Vague Before?** Some argue astronomical usage *was* converging towards requiring orbital dominance pre-2006. Supervaluationism might overplay the indeterminacy pre-decision.

  **Reading the Episode Back Against the Theories:**

  *   **Against Epistemicism:** The episode strongly *resists* an epistemicist reading. The key evidence is the **explicitly stipulative nature of the IAU's action** and the **existence of scientifically viable alternative definitions**. This wasn't discovering Pluto wasn't a planet like discovering its composition; it was *deciding* what criteria *made* something a planet and applying them. The vote highlights the conventional element epistemicism denies exists for the boundary itself.
  *   **Against Supervaluationism:** The episode largely **confirms** the supervaluationist framework. A vague term *was* precisified by a relevant authority selecting one admissible sharpening from a set constrained by scientific reality and usage. However, it also **highlights challenges**: the precisification was achieved through a potentially problematic (democratic vote) mechanism within a specialized community, raising questions about the scope of the precisification (scientific term only? everyday language?) and the nature of authority.

  **The Wrinkle (Pre-Vote Status):**
  *   **Epistemicism:** *Requires* a determinate fact. Either Pluto was always a planet (contradicted by the IAU's *discovery* of the truth) or it wasn't (making decades of astronomy textbooks wrong in a strong sense). Both options are strained.
  *   **Supervaluationism:** Provides the cleaner answer: **Indeterminate.** Pluto was a paradigm borderline case. The pre-2006 usage reflected this indeterminacy – it was classified as a planet based on one set of salient features (round, Sun-orbiting) but was recognized as anomalous compared to the classical eight based on others (size, orbit, neighbours).

  **Verdict: Which Handles it Better?**

  **Supervaluationism handles the Pluto demotion significantly better.**

  *   **Why it Wins:**
      *   It directly accounts for the **stipulative, definitional act** of the IAU as a precisification.
      *   It naturally explains the **existence of viable alternative definitions** (other admissible precisifications).
      *   It provides the most plausible account of Pluto's **pre-2006 status as borderline**.
      *   It frames the "cleared the neighbourhood" clause as what it functionally was: a **chosen sharpening criterion**.
      *   It accommodates the **role of scientific convention and authority** in defining technical terms.

  *   **Where the Winner Still Faces Trouble:**
      *   **The Mechanism of Precisification:** The IAU vote process feels crude and potentially problematic as the method for establishing *the* precisification. Supervaluationism needs a more robust account of how precisification authority is vested and exercised, especially for terms with broad cultural reach.
      *   **Scope of the Precisification:** Does the IAU's definition precisify "planet" for astronomy only, or for the language as a whole? Supervaluationism typically deals with language-wide terms, but scientific jargon often operates semi-independently.
      *   **Depth of Vagueness:** Did the IAU *fully* sharpen "planet"? Arguments persist about the exact meaning of "cleared the neighbourhood," suggesting the precisification might itself have been somewhat vague, pushing the problem down but not eliminating it.

  In essence, the Pluto episode looks like a textbook case of supervaluationism in action: a vague term encountering problematic borderline cases, leading an authoritative body to select one admissible precisification from a constrained set. While it exposes some messy realities about *how* such precisifications happen in practice that the theory might not fully anticipate, it fundamentally aligns with the supervaluationist picture. Epistemicism, by insisting the sharp boundary was always there to be discovered, struggles to make sense of the deliberative, definitional, and conventional aspects that were central to the event.
