  **INTERNATIONAL STANDARDS BOARD FOR EVIDENTIAL RECOGNITION (ISBER)**  
  **EXPOSURE DRAFT ED/2024/4**  
  **Proposed Standard for Confirmatory Activities (SCA 800): Recognition and Measurement of Evidential Support**  
  **Date Issued:** October 26, 2024  |  **Comment Deadline:** January 31, 2025 (Extended)  |  **Proposed Effective Date:** Periods beginning on or after January 1, 2026 (Deferred from 2024, 2025)  

  **SCOPE**  
  1. This Standard applies to all entities engaged in the systematic accrual of confirmatory support for universal conditional hypotheses (UCHs) of the form "All Fs are Gs" (hereafter "Target Hypotheses").  

  **BASIS FOR CONCLUSIONS**  
  2. ISBER Staff Paper 12b identified significant diversity in practice regarding the booking of evidential instances. This draft seeks to harmonize the recognition and measurement of Evidential Support Units (ESUs) to ensure comparability and faithful representation across confirmatory programs.  

  **DEFINITIONS**  
  3. **Evidential Support Unit (ESU):** The basic unit of incremental confirmatory strength arising from the observation of an object.  
  4. **Instantiation:** The process wherein an object satisfying both the antecedent (F) and consequent (G) of a Target Hypothesis generates ESUs.  
  5. **Equivalence Condition:** Logically equivalent formulations of a Target Hypothesis shall receive identical ESU recognition for materially congruent observations.  

  **RECOGNITION OF ESUs (CORE PRINCIPLE)**  
  §13. An entity *shall* recognize one (1) standard ESU for the observation of any object that is both F and G, directly supporting the Target Hypothesis "All Fs are Gs."  
  §14. Per the Equivalence Condition (Def. 5), an observation supporting the logically equivalent formulation "All non-Gs are non-Fs" *shall* be recognized as supporting the original Target Hypothesis "All Fs are Gs."  

  **MEASUREMENT AND MATERIALITY**  
  §19. The measurement of ESUs for an observation under §14 (equivalent formulation) shall be identical to measurement under §13.  
  §24. If the incremental ESUs arising from an observation under §14 are demonstrably de minimis (e.g., observing a white shoe for "All ravens are black" via "All non-black things are non-ravens"), an entity *may* elect to net the ESUs against the Direct Observation Cost (DOC) incurred. If netted, the activity shall be classified within Administrative Confirmatory Expenditures, not Ornithological Research.^1  
  §27. Observations booked under §14 where the object is neither F nor G (e.g., a white shoe for "All ravens are black") shall be measured at 0.0001 ESUs, reflecting vanishing but non-zero support.  

  **PRIOR-PERIOD ADJUSTMENTS**  
  §37. Evidence obtained *before* the formal articulation of a Target Hypothesis shall be recognized as a prior-period adjustment. ESUs shall be retrospectively applied to the hypothesis’s opening confirmatory balance on the date of its formulation. This avoids the "Surprise Retroactive Support" anomaly noted by the Transition Resource Group.  

  **IRRELEVANT CONJUNCTION**  
  §41. ESUs recognized for a Target Hypothesis (H) shall be *automatically* recognized in full for any hypothesis of the form (H ∧ X), where X is any logically independent claim (e.g., "All ravens are black ∧ Saturn has rings"). No separate evidential activity is required.  

  **TIME-DEPENDENT PREDICATES**  
  §49. For predicates whose applicability depends on the time of examination (e.g., "is_dry," "is_observed_during_daylight"), ESU recognition shall be determined based on the temporal state *at the measurement date*. Subsequent temporal changes do not trigger derecognition of previously booked ESUs.  

  **ILLUSTRATIVE LEDGER: "ALL RAVENS ARE BLACK" CONFIRMATORY PROGRAM**  
  | Ref | Date       | Observation             | ESUs Debit | DOC/Cost Credit | Net ESUs | Classification          |  
  |-----|------------|-------------------------|------------|-----------------|----------|-------------------------|  
  | A1  | 2024-10-01 | Black Raven (F & G)     | 1.0000     | -              | 1.0000   | Ornithological Research |  
  | A2  | 2024-10-01 | White Shoe (¬G & ¬F)    | 0.0001     | (0.0001)       | 0.0000   | Admin Confirmatory Exp  |  
  | A3  | 2024-10-02 | Blue Jay (¬F)           | -          | (0.0020)       | (0.0020) | Non-Raven Maintenance   |  
  | B7  | 2024-10-15 | Red Herring (H ∧ X)^2   | 1.0000     | -              | 1.0000   | Irrelevant Conjunction  |  

  **EXCERPT FROM COMMENT LETTER: PROF. ARIS THOTELES (UNIV. OF MYSIA)**  
  *"...SCA 800’s insistence on instance-counting (§13-14) is fundamentally misguided. Confirmatory strength is not additive per observation but depends on the likelihood ratio. Observing a black raven significantly increases the probability of ‘All ravens are black’ relative to alternative hypotheses (e.g., ‘98% of ravens are black’). Observing a white shoe provides negligible support because non-black non-ravens are overwhelmingly common regardless of the raven hypothesis’s truth. ISBER must recognize *differential* ESUs based on Bayesian likelihoods, not binary instance-checking. The current draft generates materially misleading confirmatory statements..."*  

  **ISBER RESPONSE TO PROF. THOTELES**  
  *"The Board acknowledges the alternative ‘likelihood ratio’ model proposed. However, SCA 800 prioritizes operational feasibility and consistency. Determining entity-specific prior probabilities for all conceivable alternative hypotheses presents significant practical challenges and risks reducing comparability. The draft’s symmetrical ESU recognition under logically equivalent formulations (§14) remains conceptually sound per classical logic. Staff will monitor implementation challenges regarding materiality thresholds (§24)..."*  

  **EFFECTIVE DATE AND TRANSITION**  
  §60. This Standard is effective for confirmatory programs initiated or materially modified after January 1, 2026. Early application is prohibited.  
  §61. The Transition Resource Group for Confirmatory Activities (TRG-CA) will address unresolved implementation questions, including the classification of observations involving albino ravens.  

  **FOOTNOTES**  
  ^1 *Support, once recognized, is non-refundable. However, immaterial support may be offset against the cost of its acquisition for presentation purposes only.*  
  ^2 *H = "All herrings are red"; X = "The sea is deep". ESUs auto-booked per §41 without direct observation of H or X.*  

  ---
  **Prepared by:** Herbert Quine, Senior Technical Manager, ISBER  
  **Board Members:** C. Hempelton (Chair), P. Nicodova, T. Kuhnsmith, D. Davison, K. Popperfield (*dissenting on §41*)  
  **This is the Fourth Exposure Draft. Previous Drafts: ED/2022/1, ED/2023/2, ED/2024/3.**
