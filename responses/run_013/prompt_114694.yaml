  ### Tradecraft Review Procedure for Confidence Assessment

  **Objective**: Ensure reports transparently convey (1) the inherent uncertainty of multi-judgment products and (2) the distinction between disjunction confidence and individual possibility confidence, without statistical complexity.

  ---

  #### **I. Procedure for Package-Wide Confidence (Report-Level Uncertainty)**
  1. **Question 1**:  
     *"How many judgments (N) are in the report, and what are their confidence bands?"*  
     - **Sufficient Answer**: List each judgment's band (5%, 20%, 50%, 80%, 95%).  
     - **Stop if**: Bands are missing or invalid. Require correction.

  2. **Question 2**:  
     *"What is the product of all confidence values (as decimals)?"*  
     - **Calculation**:  
       - Convert bands: 5%→0.05, 20%→0.20, 50%→0.50, 80%→0.80, 95%→0.95.  
       - Multiply all values: \( P_{\text{all\_correct}} = c_1 \times c_2 \times \cdots \times c_N \).  
     - **Sufficient Answer**: Numeric result (e.g., 40 judgments at 95% → \( 0.95^{40} ≈ 0.128 \)).

  3. **Question 3**:  
     *"What is \( 1 - P_{\text{all\_correct}} \), rounded to the nearest whole percentage?"*  
     - **Calculation**: \( \text{Error\_Risk} = (1 - P_{\text{all\_correct}}) \times 100 \).  
     - **Sufficient Answer**: Whole number (e.g., \( 1 - 0.128 = 0.872 \) → **87%**).

  4. **Final Action**:  
     - Insert in the executive summary:  
       > "This report contains **N** independently sourced judgments. While each judgment carries its stated confidence, the nature of multi-judgment products means there is approximately **Error_Risk%** chance of *at least one error* in this report. Decisions should weigh this aggregate uncertainty."  
     - **Values Decision Point**: None. Purely arithmetic.

  ---

  #### **II. Procedure for Disjunction Judgments (Mutually Exclusive Possibilities)**
  1. **Question 1**:  
     *"Is there a high-confidence (≥80%) judgment that *one of* a set of mutually exclusive possibilities will occur?"*  
     - **Sufficient Answer**: Yes, with a specific band (80% or 95%).  
     - **Stop if**: Disjunction confidence is missing or <80%. Judgment must be restructured.

  2. **Question 2**:  
     *"Is the set of possibilities exhaustive (no residual 'unknown' category)?"*  
     - **Sufficient Answer**: Explicit "yes" or residual category included.  
     - **Stop if**: Unexhaustive and no residual. Require revision to include residual.

  3. **Question 3**:  
     *"Is every individual possibility’s confidence ≤20%?"*  
     - **Sufficient Answer**: All individual bands are 5% or 20%.  
     - **Stop if**: Any individual band >20% (e.g., 50%). Require downgrade to ≤20% or restructure.

  4. **Final Action**:  
     - Mandate this text structure:  
       > "We are **[disjunction confidence]** confident that **one of** the following will occur: **[list possibilities]**. However, no single possibility exceeds **20%** confidence. Resources allocated against specific possibilities should account for this uncertainty."  
     - List individual confidences (e.g., "Route A: 20%, Route B: 5%").  
     - **Values Decision Point**:  
       - If intelligence gaps prevent exhaustiveness, the analyst must decide whether to state this (e.g., "We assess an 80% chance one of Routes A–I is used, but 20% chance of an unanticipated route").  
       - Reviewer may not override analyst’s evidence-based exhaustiveness claim.

  ---

  #### **What the Procedure Cannot Do**
  - **Handle dependency between judgments**. Assumes independence; dependencies require analyst justification.  
  - **Resolve band granularity issues**. Uses fixed band values (no interpolations).  
  - **Override exhaustiveness/residual decisions**. Analyst’s call based on evidence.

  ---

  ### **Defensive Translation of Paradoxes**
  - **Lottery/Preface Paradox Resolution**:  
    Adopt **"Lossy Compartmentalization"**: Judgments *must* stand alone defensibly, even if collectively contradictory (e.g., 40x 95% judgments imply near-certain error). This mirrors real-world intelligence: each claim is independently verifiable, but aggregation creates systemic risk.  
    - **Why?**  
      - Readers commit resources to *individual* judgments (e.g., "95% confidence in Threat X" funds counter-X).  
      - Bands are calibrated to *singular* events, not products. Forcing a "report-level confidence" misrepresents epistemology.  
      - **Loss**: Sacrifices holistic coherence for actionable transparency. Readers *see* the systemic risk (via **Error_Risk%**) and adjust accordingly.

  ---

  ### **Case Applications**

  #### **Case 1: 40 Judgments at 95%**  
  - **Package Procedure**:  
    - \( N = 40 \), \( P_{\text{all\_correct}} = 0.95^{40} ≈ 0.128 \).  
    - \( \text{Error\_Risk} = (1 - 0.128) \times 100 ≈ 87\% \).  
  - **Output Text**:  
    > "This report contains 40 independently sourced judgments. While each judgment carries 95% confidence, there is approximately 87% chance of *at least one error* in this report."  
  - **Why This Works**: Prevents misreading the product as "95% confident overall." Forces reader to confront scale-driven uncertainty.

  ---

  #### **Case 2: 9-Route Warning (Disjunction at 95%, No Route >20%)**  
  - **Disjunction Procedure**:  
    - Disjunction confidence: 95% → **valid** (≥80%).  
    - Set exhaustive? **Yes** (analyst asserts no other routes).  
    - All individual confidences ≤20%? **Yes** (e.g., 3 routes at 20%, 6 at 5%).  
  - **Output Text**:  
    > "We are **95%** confident one of the following routes will be used: [Routes A–I]. However, no single route exceeds **20%** confidence. Resources allocated against specific routes should account for this uncertainty.  
    > Individual confidences: Route A: 20%, B: 20%, C: 20%, D–I: 5% each."  
  - **Why This Works**: Blocks converting "95% disjunction" into actionable confidence for any route. Reader cannot mistake whole for parts.

  ---

  #### **Case 3: Forced Unwelcome Truth (Disjunction with Residual)**  
  - **Scenario**: 95% confidence "Attack A or B will occur," but both are catastrophic. Analyst prefers omitting residual chance of no attack.  
  - **Disjunction Procedure**:  
    - Disjunction confidence: 95% → **valid**.  
    - Set exhaustive? **No** (A and B don’t cover all outcomes; residual "no attack" exists).  
    - **Stop**: Force analyst to add residual category at 5%:  
      > "We are **95%** confident that Attack A or B will occur. However, there is a **5%** chance neither occurs."  
  - **Values Decision Point**:  
    - Analyst *must* include residual if evidence supports it. Reviewer cannot omit it.  
  - **Why This Works**: Concealing residuals misleads resource allocation (e.g., no contingency for "no attack"). Truth-forcing ensures integrity.

  ---

  ### **Reviewer Workflow Summary**
  1. Run **Package Procedure** once per report → insert **Error_Risk%** note.  
  2. For each disjunction judgment, run **Disjunction Procedure** → enforce text structure.  
  3. **Time**: <4 hours (arithmetic only; no philosophy/stats required).  
  4. **Output Clarity**: Textual safeguards prevent readers from misaggregating confidence.
