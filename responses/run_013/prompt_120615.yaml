  Classifier problem: The charter requires the AI to categorize requests under pre-set rules. But categorization involves judgment, which could be paternalistic. The user sees this as a fatal flaw. I agree—it's unavoidable unless rules are extremely specific. Maybe they're hoping for a technical solution, but AI interpretation is inherently subjective. No easy fix here.

