  First, I need to recall Newton's setup. The bucket experiment has three stages: initial spin with flat water (relative motion, no concavity), water catching up with no relative motion but concavity, and vessel slowing with concavity persisting despite reversed relative motion. The key point is that concavity correlates with absolute motion, not relative motion. Then the globes in empty space: tension in the cord indicates circular motion without any external bodies, suggesting motion isn't relational.

  The user's main questions are: Does this prove substantivalism or just privileged rotation? Can a Machian relationist (using the fixed stars or entire universe as reference) counter it? And if motion's absoluteness is conceded, does space's absoluteness follow?

  I should structure the response around the arguments' steps. For the bucket, clarify each stage and why relative motion fails to explain the effects. The globes argument is stronger because it removes all external bodies, directly challenging relationism. But Mach could argue that the globes' inertia depends on distant masses, so rotation is relative to those. Newton's counter is that the tension's quantity exists even without other bodies, which Mach might dispute by invoking the universe's mass.

  The user might be missing that Newton links true motion to impressed forces, a causal criterion. Relationists could attack this by suggesting forces define motion relationally. Also, inferring absolute space from motion requires the container view, which relationists reject. The globes experiment is crucial because it isolates rotational effects, making the Machian response less straightforward.

  I should note where Newton infers to the best explanation (why concavity occurs when relative motion is zero) versus stipulation (defining true motion by forces). The user's worry about Mach is valid and is Leibniz's point—Newton assumes space as an entity rather than relational.

  Finally, assess what survives if motion's absoluteness is accepted but space's isn't. Newton needs motion to imply space, but relationists can separate them. The bucket alone isn't sufficient; the globes are key. Highlighting standard objections like Mach's and Earman's would help the user see the ongoing debate.
answer: |-
  You've grasped the core brilliantly, and your paraphrase is accurate – even catching the importance of Stage 3. Let's untangle Newton's argument step-by-step, flagging the load-bearing points, relationist counters, and the tricky leap to space.

  **The Core Argument Structure:**

  Newton aims to establish two main things:
  1.  **Absolute Motion Exists:** There is a privileged state of motion ("true motion") that isn't just relative to other nearby bodies and *causes* inertial effects (like concavity or cord tension).
  2.  **Absolute Space Exists:** Motion is defined with respect to an immovable, infinite, homogeneous, substantial *space* itself, not just relations between bodies.

  He uses two complementary thought experiments:

  1.  **The Bucket (Coriolis' Vortex):** Shows that the *cause* of an inertial effect (concavity) cannot be relative motion to the *immediate container* (the bucket).
  2.  **The Globes (Tying the Cord):** Shows that the *measure* of an inertial effect (cord tension) exists even when *all other bodies are removed*, meaning it cannot be defined by relation to *any specific external bodies*.

  **Step-by-Step Breakdown & Relationist Counters:**

  1.  **The Bucket Experiment:**
      *   **Stage 1 (Spin Bucket, Still Water):**
          *   *Observation:* High relative motion (water vs bucket). Flat water surface.
          *   *Newton's Point:* High relative motion exists, but the *effect* indicating "true" rotational motion (endeavour to recede, concavity) is *absent*.
          *   **Load-Bearing:** This severs the direct causal link between *relative motion to the immediate container* and the inertial effect. If relative motion to the bucket *caused* the concavity, it should be present here.
          *   *Careful Relationist Counter (Machian):* "Fine, motion relative to the *bucket alone* isn't sufficient. But the water isn't yet rotating relative to the *fixed stars* or the *total mass distribution of the universe*. The concavity appears only when it rotates relative to *that*." (This is the core Machian move).

      *   **Stage 2 (Water Spins with Bucket):**
          *   *Observation:* **Zero relative motion** (water vs bucket). **Concave surface** (maximum endeavour to recede).
          *   *Newton's Point:* This is the critical blow. The inertial effect is *maximal* precisely when relative motion to the immediate container is *zero*. Therefore, the effect *cannot be caused* by relative motion to the bucket. Something else must be causing it – the water's "true" rotational motion relative to space itself.
          *   **Load-Bearing:** This is the *most important step* in the bucket argument. It demonstrates an *inverse correlation* between the effect and relative motion to the local frame. It powerfully suggests the cause is *internal* to the state of motion of the water itself, defined against something absolute.
          *   *Careful Relationist Counter (Machian):* "The effect appears because the water *is now rotating relative to the fixed stars/universe*. The bucket is just along for the ride. The 'true motion' is just motion relative to the cosmic mass distribution. Remove *that* (impossible, but hypothetically), and the concavity vanishes." Newton needs the globes to counter this.

      *   **Stage 3 (Bucket Slows, Water Spins):**
          *   *Observation:* High relative motion (water vs bucket, *opposite direction*). Concave surface *persists*.
          *   *Newton's Point:* Reinforces Stage 2. Relative motion to the bucket is high again (but reversed), yet the effect persists. This shows the effect depends on the *absolute rotational state* of the water, not on its relative motion to the bucket. The water's "true motion" hasn't changed much yet (it's still spinning fast), even though its motion relative to the bucket has reversed.
          *   **Load-Bearing:** Strengthens the case against relative motion to the container being the cause. Shows the effect tracks the *persistence* of the water's own rotational state, not its changing relation to the bucket.
          *   *Careful Relationist Counter (Machian):* "The water is *still* rotating relative to the fixed stars/universe! The bucket slowing down doesn't change that fundamental relation significantly yet. The concavity persists because the crucial relational state persists." Again, the globes are needed.

  2.  **The "True Motion" Criterion:**
      *   *Newton's Claim:* True motion "is not changed except by forces impressed on the body itself," while relative motion "may be changed without any force impressed upon the body" (e.g., force on the bucket changes water's motion relative to bucket). The effects distinguishing true motion (like the "forces of receding") are caused by changes in true motion and reveal it.
      *   **Load-Bearing:** This defines "true motion" *operationally* via cause (forces applied *directly*) and effect (inertial forces). It links the thought experiments to a general principle.
      *   *Careful Relationist Counter (Leibnizian/Machian):* "This *defines* true motion via direct forces and inertial effects, but it doesn't *prove* this motion is relative to *space*. It could still be relative to the universe. Forces define *changes* in relational state. The 'effects' might be caused by changes in relation to the cosmic mass." This challenges the *interpretation* of the criterion.

  3.  **The Globes Experiment:**
      *   *Scenario:* Two globes connected by a cord, alone in otherwise empty space, rotating around their common center.
      *   *Observation:* The cord is under tension.
      *   *Newton's Point:*
          *   The tension measures the "quantity" of their circular motion.
          *   Remove *all* other bodies. The tension *persists*.
          *   Therefore, the tension (the inertial effect) does *not* depend on the relation of the globes to *any other bodies*. It depends solely on their state of motion relative to *space itself*.
      *   **Load-Bearing:** This is the *critical* step against sophisticated relationism (Machianism). It directly attacks the claim that motion/force is *defined* by relation to other bodies. If there *are* no other bodies, but the tension remains, then the motion causing it *cannot* be relational in the sense of requiring external reference bodies. Newton insists the "quantity" is intrinsic to their motion relative to space.
      *   *Careful Relationist Counter (Machian):* This is the hardest counter. A Machian has two main lines:
          1.  **Meaningless Scenario / Inertia Requires Mass:** "The scenario is incoherent. *Inertia itself* is defined by the presence of other masses. In truly empty space, the concepts of 'force', 'tension', and even 'rotation' lose meaning. Remove *all* mass, and there's no standard of non-rotation, no inertia, no tension. Newton *assumes* inertia exists absolutely, but it *depends* on the cosmic mass distribution." (This is Mach's core rebuttal: the fixed stars *cause* inertia).
          2.  **The Universe is Always There:** "Newton's 'otherwise empty space' is a conceptual trick. We *know* the universe is full of matter. The tension in the cord *always* reflects rotation relative to *that* total mass. The experiment doesn't prove motion relative to space; it just shows that if you could magically remove other bodies *without changing inertia*, the effect would remain. But removing other bodies *would* change inertia, making the scenario impossible and irrelevant." (This is more pragmatic).

  4.  **The Leap to Absolute Space:**
      *   *Newton's Inference:* Since the true motion (revealed by forces/effects) isn't relative to other bodies (as shown by the globes), it must be motion relative to *something* immovable. This something is absolute space.
      *   **Load-Bearing:** This is a crucial *inference to the best explanation* for Newton. He sees the failure of body-relative motion to explain the effects (bucket) and the persistence of the effect without other bodies (globes) as leaving only one option: motion relative to space itself.
      *   *Careful Relationist Counter (Leibnizian/Machian):* **This is the weakest link and your core worry is spot on.** Relationists argue:
          *   "Newton commits a fallacy of bifurcation. Just because motion isn't relative to *nearby* bodies (bucket) or *any specific* bodies (globes argument), doesn't mean it *must* be relative to space. It could be relative to *the entire mass of the universe as a whole* (Mach). The 'something immovable' isn't space, it's the cosmic center of mass frame defined relationally."
          *   "Newton *stipulates* that motion requires an absolute reference frame (space) rather than proving its necessity from the phenomena alone. He builds it into his definitions." (Leibniz's critique).
          *   "The globes establish *only* that rotation is absolute in the sense of being non-relational to *individual bodies*, not that it requires a substantival space. A relational structure defined by all matter could suffice." (Modern sophisticated relationism).

  **What Does it Prove? What Survives?**

  1.  **Motion:**
      *   **Establishes Firmly:** Relative motion to *immediate containers* or *specific nearby bodies* is neither the *cause* nor the *measure* of the relevant inertial effects (concavity, tension).
      *   **Establishes Strongly (but contested):** The *quantity* of rotational motion (as measured by tension/centrifugal force) exists and has physical consequences even in the hypothetical absence of *all other bodies*. This directly challenges any relationism that defines motion solely by relations to *particular* external bodies. It shows motion has an *intrinsic* aspect regarding rotation.
      *   **Does NOT Fully Establish:** That this "absolute" motion *must* be defined relative to *substantival space* rather than relative to the *total mass distribution of the universe* (Mach's view). Newton *argues* for it, but the Machian counter (that inertia depends on cosmic mass) remains viable. The globes experiment *assumes* the persistence of inertia, which Mach denies in empty space.

  2.  **Space:**
      *   **Does NOT Directly Prove Substantivalism:** Newton's argument for absolute space *depends entirely* on his argument for absolute motion *and* his inference that absolute motion requires motion relative to absolute space. If the Machian counter to the globes holds (inertia requires mass, so empty space scenario is meaningless), or if the Leibnizian counter holds (a privileged relational frame defined by all matter suffices), then Newton's inference to substantival space fails.
      *   **Survival:** If you grant Newton his conclusion about absolute motion (that it exists *and* isn't just relational to the cosmic mass), then the inference to absolute space is natural, almost definitional for him. **But if you reject the inference about motion (accepting Mach), then the conclusion about space collapses.** The bucket and globes, powerful as they are against crude relationism, do not *force* substantivalism upon a sophisticated relationist like Mach.

  **Your Specific Questions:**

  *   **"Does it get him space... or only privileged rotation?"** Primarily, it aims for both, but the proof for *space* is weaker. It strongly establishes a *privileged state of rotation* that isn't reducible to relations with *specific* nearby bodies. The jump to that state being defined relative to *substantival space* is the contested inference.
  *   **"Leaves smarter relationism (Mach) untouched?"** **Largely Yes, regarding space.** The bucket alone certainly does. The globes are Newton's *direct attack* on Machianism. Newton *thinks* it shuts the door by showing the effect persists without *any* bodies. Mach *counters* by denying the coherence of inertia without mass. It's a fundamental standoff. Newton's insistence on the quantity not being defined by relation *is* his argument against Mach, but Mach rejects the premise (persistence of inertia in emptiness).
  *   **"Globes do most of the work?"** **Absolutely.** The bucket refutes container-relationism. The globes are the essential weapon against cosmic relationism (Mach).
  *   **"Conclusion about space survives if motion conclusion doesn't?"** **No.** Newton's case for absolute space *depends* on his case for absolute motion requiring an absolute reference frame. If motion's absoluteness can be cashed out relationally to the universe (Mach), then space isn't needed as a substance.
  *   **"Inferring to best explanation vs stipulating?"**
      *   *Best Explanation:* Why does concavity appear *maximally* when relative motion to the bucket is *zero*? His best explanation: True absolute motion is present. Why does cord tension persist without other bodies? His best explanation: Motion relative to space.
      *   *Stipulating:* Defining "true motion" as changed only by forces *directly applied* and revealed by inertial effects. Defining absolute space as the reference for this motion. The *link* between the operational definition of true motion and the ontology of space involves stipulation for his opponents.
  *   **"Standard name for my worry?"** Your worry is **precisely Mach's Principle** and the associated **Machian Relationism**. The objection that Newton assumes inertia exists absolutely, while it might depend on the cosmic mass distribution, is the core Machian counter-argument to the globes. Leibniz also argued against inferring space from motion.
  *   **"Mangling Stage 3?"** No, your paraphrase of Stage 3 is correct and highlights its importance (persistence of effect despite reversed relative motion).

  **In Short:**

  Newton powerfully demonstrates that rotational inertia (centrifugal effects) cannot be explained by motion relative to immediate surroundings or specific bodies (Bucket) and persists hypothetically without any other bodies (Globes). This establishes a robust notion of **absolute rotation** – a privileged physical state. However, the inference that this *requires* motion relative to **substantival space** is challenged by **Machian relationism**, which argues that the inertia enabling these effects *itself* depends on the total mass of the universe. Newton's globes experiment *assumes* the independence of inertia from mass, which Mach denies. While Newton's arguments devastate crude relationism, the debate with sophisticated relationism (Mach) remains fundamentally unresolved, hinging on deep questions about the nature of inertia. The bucket illustrates the problem vividly, but the globes carry the essential load against the strongest relationist opponent. Newton *gets* absolute rotation operationally defined; whether he *gets* absolute space depends on whether you accept his inference over Mach's.
