prompt: |-
  I am writing the conceptual chapter of a dissertation on signaling — animal and human — and I have decided not to compare the handicap principle with its rivals until I know what any of them would have to deliver. I am working with the handicap principle in its plain form: a signal is credible because it is expensive, and the expense is what stops the low-quality from sending it. Please write me the specification rather than the comparison: what must a theory of signal credibility be able to do before it counts as adequate? I want to use the finished list to sort traits into signals, cues, and noise, and to explain why some honest signals are cheap.

  The theory has to cover at least the following, which are the cases I actually have to explain.

  - The peacock's tail: costly to grow and to carry, correlated with the bearer's condition, preferred by receivers, with the offspring of preferred males inheriting the viability advantage. Here the cost is a handicap in the ordinary sense.
  - The stag's roar: its pitch is fixed by the size of the animal's resonating chambers, so a small male cannot produce a deep one. Nothing was spent to make the signal honest; the physics did the work.
  - The alarm call of a bird surrounded by relatives: cheap to produce, no reliable difference in what it costs different callers, honest because the callers' interests coincide.
  - A courtship display that is difficult to perform: what excludes the weak and the young is a rate of failure, not an expenditure of resources. I want to know whether a failure rate is a cost in the relevant sense, or whether counting it as one empties the notion of cost of content.
  - A signal that imposes the same fixed toll on every signaller, with no discount for poor quality. A colleague says this cannot be honest, since anyone can pay it. I suspect he is wrong: where the value of the receiver's response rises with the signaller's quality, the marginal benefit separates signallers even when the marginal cost does not. If I am right, the honesty condition cannot be stated in terms of cost at all, and I want the list of requirements to make that explicit.
  - A deception that persists: a mimic is believed because receivers cannot afford to check, and the equilibrium is stable.
  - A trait that carries information without being a signal: a warm body tells a predator where its owner is. The theory has to say what distinguishes a signal from a mere cue, and whether the difference lies in the signaller's design, in the receiver's use, or in the information itself.

  Then the requirements. For each, give the case or consideration that motivates it, and say whether it is a genuine desideratum or a commitment of one camp — that signals must be adaptations, that honesty must be expensive, that signallers must be able to assess their own quality, that receivers' preferences must be explained rather than assumed, and so on. Tell me which requirements cannot be jointly satisfied, and which single requirement does the most to eliminate candidates. Flag any requirement that is really a demand for the theory to do something no theory of a natural phenomenon could do.

  Keep the weight on the criteria; I will run the comparison of candidates myself once I have the list.
reasoning: |-
  We are to specify the requirements for an adequate theory of signal credibility. The goal is to have a set of criteria that can be used to sort traits into signals, cues, and noise, and to explain why some honest signals are cheap. We are given several cases that the theory must cover.

  We will list each requirement, state the case or consideration that motivates it, and note whether it is a genuine desideratum (i.e., necessary for any adequate theory) or a commitment of a particular camp (like the handicap principle). We will also note when requirements conflict and which requirement is the most stringent.

  Let's begin by listing the cases:

  1. **Peacock's tail**: Costly, honest due to cost, condition-dependent, preferred, and offspring inherit viability.
  2. **Stag's roar**: Honest due to physical constraints (size of resonating chambers) without additional cost.
  3. **Bird's alarm call**: Cheap, honest due to common interest (kin selection).
  4. **Courtship display with failure rate**: Honest because of difficulty (failure rate), not necessarily resource expenditure.
  5. **Fixed toll signal**: Same cost for all, but honest because marginal benefit varies with quality.
  6. **Deception that persists**: Mimicry that is stable because receivers cannot afford to check.
  7. **Cue vs. signal**: A warm body as a cue (not a signal) that provides information without being designed for communication.

  Now, the requirements for an adequate theory of signal credibility:

  ### Requirement 1: Account for Honesty Mechanisms Beyond Cost
  - **Motivation**: Cases 2 (stag's roar) and 3 (alarm call) show that signals can be honest without being costly in resources. Also, case 4 (courtship display) uses failure rate, which may not be a resource cost. Case 5 (fixed toll) may not rely on differential cost but on differential benefit.
  - **Desideratum or Camp Commitment**: Genuine desideratum. Any theory that requires all honest signals to be costly (like the strict handicap principle) would fail to explain these cases. This requirement is non-negotiable for a general theory.

  ### Requirement 2: Distinguish Signals from Cues and Noise
  - **Motivation**: Case 7 (warm body) is a cue, not a signal. The theory must define what makes a trait a signal (i.e., evolved for communication) versus a cue (which is informative but not designed for that purpose) and noise (which is uninformative).
  - **Desideratum or Camp Commitment**: Genuine desideratum. A theory of signaling must have a clear operational definition of a signal. Typically, a signal is an adaptation that has been shaped by natural selection for the purpose of communication, whereas a cue is a byproduct. This distinction is crucial for sorting traits.

  ### Requirement 3: Explain Stability of Deception
  - **Motivation**: Case 6 (deception that persists) shows that dishonesty can be stable. The theory must account for why, in some cases, deceptive signaling does not break down the communication system (e.g., because of receiver constraints like cost of verification).
  - **Desideratum or Camp Commitment**: Genuine desideratum. A complete theory must explain both honesty and the conditions under which dishonesty can persist.

  ### Requirement 4: Address the Role of Common Interest
  - **Motivation**: Case 3 (alarm call) is honest because of shared interests (kin). The theory must incorporate the role of aligned interests in reducing the need for costly signals.
  - **Desideratum or Camp Commitment**: Genuine desideratum. This is a well-established factor in signaling theory.

  ### Requirement 5: Handle Condition-Dependent Costs and Constraints
  - **Motivation**: Case 2 (stag's roar) shows that honesty can be enforced by physical constraints that are condition-dependent (only large stags can produce deep roars). Case 4 (courtship display) uses failure rate, which may be condition-dependent. The theory must account for such constraints as alternative mechanisms for honesty.
  - **Desideratum or Camp Commitment**: Genuine desideratum. This is a key alternative to the handicap principle.

  ### Requirement 6: Incorporate Differential Benefits as well as Differential Costs
  - **Motivation**: Case 5 (fixed toll signal) suggests that even when the cost is the same for all, the benefit of the receiver's response might vary with the signaller's quality. This can maintain honesty without differential cost.
  - **Desideratum or Camp Commitment**: Genuine desideratum. A theory that only looks at costs (like the handicap principle) would not explain this case. The theory must consider the net benefit to the signaller (benefit minus cost) and how it varies with quality.

  ### Requirement 7: Explain Inheritance and Correlation with Quality
  - **Motivation**: Case 1 (peacock's tail) requires that the signal is correlated with the bearer's condition and that the condition is heritable (offspring inherit viability). The theory must account for why signals are informative about the signaller's underlying quality.
  - **Desideratum or Camp Commitment**: Genuine desideratum. The core of signaling is that the signal carries information. The theory must explain the correlation between the signal and the signaller's state.

  ### Requirement 8: Do Not Assume Signallers Have Perfect Self-Knowledge
  - **Motivation**: In many cases, signallers may not have the ability to assess their own quality precisely. For example, a young stag might attempt a roar without knowing it cannot be deep. The theory should not require that signallers know their own quality.
  - **Desideratum or Camp Commitment**: Genuine desideratum. Requiring self-knowledge would be a limitation and is not necessary in many models.

  ### Requirement 9: Explain Receiver Preferences Without Circularity
  - **Motivation**: In all cases, receivers have preferences (e.g., peahens prefer the costly tail). The theory must explain why receivers evolved to respond to the signal in a particular way (e.g., because the response is beneficial given the information). This should be done without assuming the signal is honest a priori.
  - **Desideratum or Camp Commitment**: Genuine desideratum. A theory must provide an evolutionary account of receiver response.

  ### Requirement 10: Accommodate Both Costly and Cheap Honest Signals
  - **Motivation**: Cases 1 (costly) and 2, 3 (cheap) must both be covered. The theory must explain why some signals are costly and others are cheap.
  - **Desideratum or Camp Commitment**: Genuine desideratum. A theory that only explains costly signals is inadequate.

  ### Requirement 11: Define the Notion of Cost Appropriately
  - **Motivation**: Case 4 (courtship display) raises the question: is a failure rate a cost? If we define cost too broadly, it loses meaning. The theory must have a clear definition of cost that does not trivialize the concept.
  - **Desideratum or Camp Commitment**: This is a challenge for the handicap principle camp. However, for a general theory, it is a genuine desideratum to clarify what counts as a cost (e.g., is it only energetic, or does it include opportunity costs, risks, etc.?).

  ### Requirement 12: Be Applicable to Both Intra- and Inter-Specific Signaling
  - **Motivation**: The cases include both (e.g., peacock tail is intra-specific courtship, alarm call might be inter-specific). The theory should cover the full range.
  - **Desideratum or Camp Commitment**: Genuine desideratum.

  ### Requirement 13: Account for the Evolution of Signals (Not Just Maintenance)
  - **Motivation**: The theory must explain how signals arise and evolve, not just how they are maintained once established.
  - **Desideratum or Camp Commitment**: Genuine desideratum, but note that some models focus only on equilibrium. However, a complete theory should address the evolutionary origin.

  ### Requirement 14: Be Grounded in Evolutionary Game Theory or Equivalent Framework
  - **Motivation**: Signaling is inherently strategic. The theory must model the interactions between signallers and receivers as a game with evolutionary dynamics.
  - **Desideratum or Camp Commitment**: This is a methodological commitment that is widely accepted. It is necessary to avoid ad hoc explanations.

  ### Potential Conflicts and Eliminating Power:

  - **Conflict**: Requirement 1 (honesty without cost) and a strict interpretation of the handicap principle (which says honesty requires cost) are incompatible. This means that the handicap principle alone cannot be the whole theory.
    
  - **Most Eliminating Requirement**: Requirement 1 (account for honesty without cost) is the most stringent because it immediately rules out theories that insist on cost as the only mechanism.

  - **Unreasonable Requirement**: A demand that the theory must predict the exact form of every signal in nature is unreasonable because signaling is context-dependent and contingent on evolutionary history.

  ### Summary of Requirements:

  An adequate theory of signal credibility must:

  1. **Account for multiple mechanisms of honesty** (cost, constraints, common interest) to cover cases like the stag's roar and the bird's alarm call.
  2. **Distinguish signals from cues and noise** by providing criteria based on evolutionary design (e.g., the trait is an adaptation for communication).
  3. **Explain stable deception** as in mimicry systems.
  4. **Incorporate common interest** as a factor reducing the need for cost.
  5. **Handle condition-dependent constraints** (like physical impossibility for low-quality individuals) as a basis for honesty.
  6. **Incorporate differential benefits** to explain cases where cost is fixed but honesty is maintained by variation in the benefit of the response.
  7. **Explain the correlation between the signal and the signaller's quality** and, when relevant, the heritability of quality.
  8. **Not require that signallers have perfect self-knowledge** of their quality.
  9. **Explain receiver preferences** without circularity (i.e., by showing how responding evolved to be beneficial).
  10. **Accommodate both costly and cheap honest signals**.
  11. **Define cost clearly** to avoid trivialization (e.g., failure rate might be considered a cost in terms of lost opportunity or risk, but the theory must specify).
  12. **Apply to both intra- and inter-specific signaling**.
  13. **Address the evolution of signals** (not just equilibrium states).
  14. **Be grounded in evolutionary game theory** to capture strategic interactions.

  This list should allow you to evaluate theories and sort traits. The most critical point is that honesty does not always require cost (Requirement 1), and that the net benefit (benefit minus cost) must be considered (Requirement 6). The distinction between signals and cues (Requirement 2) is also fundamental.

  You can now use this list to compare theories, such as the handicap principle, index signals (like the stag's roar), and the theory of costly signaling in biological and economic contexts.
answer: |-
  Below is a specification of requirements for an adequate theory of signal credibility, designed to address your cases and objectives. The requirements are derived from the empirical cases you must explain, foundational principles of evolutionary biology, and logical constraints. Each requirement is presented with its motivation (i.e., the case or logical consideration that necessitates it), and an assessment of whether it is a **genuine desideratum** (essential for any adequate theory) or a **camp commitment** (specific to a theoretical framework like the handicap principle). Conflicts, eliminatory power, and unreasonable demands are explicitly flagged. This list will enable you to sort traits into signals, cues, and noise, and explain cases where honest signals are cheap.

  ---

  ### **Core Requirements for a Theory of Signal Credibility**

  1. **Explain Multiple Mechanisms for Honesty**  
     - **Motivation**: Cases 2 (stag's roar), 3 (alarm call), and 5 (fixed toll signal) demonstrate that honesty can arise without costs that differentially burden low-quality signallers. Physics (case 2) or shared interests (case 3) can enforce honesty, while case 5 shows that differential benefits (not costs) can maintain honesty.  
     - **Desideratum or Commitment**: Genuine desideratum. Any theory that cannot accommodate non-cost-based honesty (e.g., indices, common interest) is inadequate.  
     - **Conflict Alert**: Incompatible with camp commitments that demand all honesty require differential costs (e.g., strict handicap principle).  

  2. **Distinguish Signals from Cues and Noise**  
     - **Motivation**: Case 7 (warm body as a cue) requires the theory to differentiate signals (adaptive traits shaped by selection for communication) from cues (incidental byproducts conveying information) and noise (unreliable or non-informative traits).  
     - **Desideratum or Commitment**: Genuine desideratum. The distinction hinges on **signaller design**: a signal must be an adaptation maintained by its communicative function, whereas a cue lacks this design. Receiver use or information content alone is insufficient (e.g., a cue can be "used" by receivers without being a signal).  
     - **Eliminatory Power**: High. Theories conflating signals with cues (e.g., those ignoring adaptation) fail.  

  3. **Account for Stability Without Honesty**  
     - **Motivation**: Case 6 (persistent deception) shows deception can be evolutionarily stable if receivers cannot afford verification costs (e.g., mimicry systems). Honesty is not inevitable.  
     - **Desideratum or Commitment**: Genuine desideratum. The theory must explain when and why deception persists, not just honesty.  
     - **Camp Commitment Alert**: Theories assuming signals must be honest (e.g., some interpretations of Zahavi’s handicap) cannot explain this.  

  4. **Incorporate Receiver Economics**  
     - **Motivation**: Cases 1 (peacock’s tail), 5 (fixed toll), and 6 (deception) require explaining receiver responses. Why do receivers prefer certain signals? Case 5 shows that receiver responses must vary with signaller quality (e.g., high-quality signallers gain more from the response, making fixed costs sustainable).  
     - **Desideratum or Commitment**: Genuine desideratum. Receiver preferences must be **explained, not assumed** (e.g., via fitness benefits from accurate information).  
     - **Conflict Alert**: Incompatible with theories treating receiver behavior as exogenous (e.g., some game-theoretic models).  

  5. **Define Costs Broadly but Non-Circularly**  
     - **Motivation**: Case 4 (courtship failure rate) challenges whether "cost" includes non-resource expenses (e.g., failure risk). Case 5 shows that honesty can arise without differential costs at all.  
     - **Desideratum or Commitment**: Genuine desideratum. Costs must include **fitness-reducing factors** (energy, time, predation risk, opportunity costs, failure consequences) but cannot be defined so broadly that any constraint qualifies (e.g., physics in case 2 is not a "cost"). Failure rates (case 4) are costs only if they reduce fitness (e.g., failed displays waste energy or increase vulnerability).  
     - **Unreasonable Demand Alert**: Requiring costs to explain all honesty empties "cost" of meaning.  

  6. **Explain Correlation with Underlying Quality**  
     - **Motivation**: Cases 1 (peacock’s viability), 2 (stag’s size), and 3 (alarm caller’s kinship) require signals to correlate reliably with signaller state/quality (e.g., health, size, intent).  
     - **Desideratum or Commitment**: Genuine desideratum. The theory must explain **why the correlation exists** (e.g., via constraints, costs, or common interest).  
     - **Camp Commitment Alert**: Handicap proponents often tie this solely to costs, but this is insufficient (e.g., case 2 uses physics, not costs).  

  7. **Accommodate Asymmetric Information and Signaller "Ignorance"**  
     - **Motivation**: Cases 2 (stag’s roar) and 4 (courtship failure) imply signallers need not assess their own quality. Stags cannot fake size due to physics; display failures may reflect unconscious incompetence.  
     - **Desideratum or Commitment**: Genuine desideratum. The theory must not assume signallers have perfect self-knowledge.  
     - **Eliminatory Power**: Moderate. Theories requiring rational assessment (e.g., some economic signaling models) fail for non-cognitive signallers.  

  8. **Address Heritability and Fitness Consequences**  
     - **Motivation**: Case 1 (offspring inherit viability) requires explaining how signals affect evolutionary fitness (e.g., via survival or mating success).  
     - **Desideratum or Commitment**: Genuine desideratum. The theory must link signals to fitness outcomes for signallers and receivers.  
     - **Conflict Alert**: Theories ignoring fitness (e.g., some informational approaches) cannot explain evolution.  

  9. **Allow for Zero or Uniform Marginal Costs**  
     - **Motivation**: Case 5 (fixed toll signal) shows honesty can persist if costs are identical for all signallers, but benefits differ (e.g., high-quality signallers gain more from receiver responses). The theory must handle cases where **differential benefits, not costs, enforce honesty**.  
     - **Desideratum or Commitment**: Genuine desideratum. Forces theories to move beyond cost-centric honesty conditions.  
     - **Eliminatory Power**: High. Eliminates strict handicap interpretations requiring differential costs.  

  ---

  ### **Synthesis and Guidance for Your Analysis**
  - **Key Conflicts**:  
    - Requirement 1 (multiple honesty mechanisms) vs. camp commitments to universal costly honesty.  
    - Requirement 5 (non-circular cost definition) vs. theories calling all constraints "costs."  
    - Requirement 9 (uniform costs + differential benefits) proves **honesty cannot rely solely on costs**; it requires joint consideration of costs and benefits.  
  - **Most Eliminatory Requirement**: **Requirement 9 (zero/uniform marginal costs)**. It forces the theory to explain honesty without differential costs, invalidating strict handicap-based approaches.  
  - **Unreasonable Demands**:  
    - **Predicting exact signal forms**: No theory can do this, as signals are path-dependent (contingent on evolutionary history).  
    - **Requiring perfect honesty**: Deception (case 6) is stable and common.  
    - **Ignoring receiver-side dynamics**: Receiver economics (Requirement 4) is non-negotiable; assuming fixed preferences is circular.  
  - **Sorting Traits**: Use the requirements as filters:  
    - **Signal**: Fulfills Requirements 2 (adaptation for communication), 6 (correlation with quality), and 4 (explained receiver response).  
    - **Cue**: Fulfills Requirement 6 (correlation) but not 2 (lacks adaptive design for communication).  
    - **Noise**: Fulfills neither (no consistent correlation or design).  
  - **Explaining Cheap Honesty**: Cases 2, 3, and 5 are honest but cheap. The theory must show how honesty arises from:  
    - Physical constraints (case 2: indices).  
    - Aligned interests (case 3: common interest).  
    - Differential benefits (case 5: marginal utility of receiver response).  

  This specification equips you to evaluate theories (e.g., handicap, index theory, social selection) against your empirical cases. Focus on how well each candidate meets the desiderata—particularly where they handle non-costly honesty—and flag ad hoc camp commitments. For your cases, the stag’s roar (index) and alarm call (common interest) will be critical for testing theories that overemphasize costs.
