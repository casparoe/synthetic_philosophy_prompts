  For concessions, the user should immediately grant the non-fungibility point - that's crucial for credibility. The opening gambit needs to affirm "yes, persons are separate" before pivoting to "but that doesn't forbid aggregation." The nightmare question would be something exposing tension between their value loci model and willingness to aggregate - perhaps about when exactly aggregation becomes permissible.

