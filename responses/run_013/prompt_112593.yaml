  For Table 2, I notice the allocation is balanced (equal cases per stratum per arm), and here the pooled results (53.8% vs 29.2%) correctly reflect the stratum-specific advantages of A. The odds ratios are identical across strata (3.00 each), and the pooled odds ratio matches them perfectly.

