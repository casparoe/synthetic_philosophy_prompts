  The user's hidden stakes are philosophical and ethical: if baselines can't be objectively chosen, then assigning "war guilt" is fundamentally unstable, undermining uses like reparations or national guilt narratives. That’s the bombshell they want to explore. 

  For the proposal structure:  
  - **Question**: Must crystallize the baseline dependency. Not "Did Germany cause WWI?" but "Under which coherent baseline frameworks does Germany appear primarily responsible?"  
  - **Why existing positions fail**: Historians treat baselines as self-evident. Fischer’s critics (e.g., Schröder) assume multipolar stability was possible; Fischer assumes German expansionism was the anomaly. Neither defends their baseline.  
  - **Method**: No archives—this is conceptual mapping. Weeks 1-2: dissect key historians’ implicit baselines. Weeks 3-6: systematize baseline types (structural, agential, path-dependent...). Weeks 7-9: test if baselines can be principled (e.g., via historical probability or normative neutrality).  
  - **Result**: Either a framework for defensible baseline selection (success) or proof of its impossibility (also success—showing "who started it" is ill-posed). Failure would be if baselines *can* be objectively ranked.  
  - **Feasibility**: A term is tight but viable since no new empirics. Overreach risk: if baseline typology balloons beyond 5-6 types. Mitigation: focus only on prominent WWI scholarship.  

  Ethical dimension is crucial: the proposal must highlight how shaky baselines destabilize political uses of history. User’s passion is clearly here—they want to expose how "guilt" narratives rest on unspoken philosophical choices.  

  Tone: British English ("whilst," "amongst"), rigorous but accessible. Avoid jargon; emphasise that this isn’t history but philosophy *of* history.  

  Final check: Does this make "who started it" look like a pseudo-question? Yes—and that’s the provocative win the user wants.
answer: |-
  ## Research Proposal: Counterfactual Baselines and the Assignment of War Responsibility in the Fischer Controversy

  **Principal Investigator:** [Your Name], Department of Philosophy
  **Project Duration:** One Academic Term
  **Requested Funding:** Teaching Buyout (One Term)

  ### 1. Precise Research Question
  This project asks: **Can the assignment of primary responsibility for the outbreak of the First World War be rendered determinate through the principled selection of a counterfactual baseline against which state actions are judged, or is the choice of baseline inherently contestable, rendering the question ‘Who started the war?’ fundamentally ill-posed?**

  The answer will take one of two determinate forms:
      *   **A.** A demonstrably principled method for selecting a single, normatively and historically defensible counterfactual baseline exists, resolving the core disagreement within the Fischer controversy.
      *   **B.** No such principled method exists; the choice of baseline is necessarily underdetermined by historical evidence and contingent on prior normative or interpretive commitments, demonstrating that ‘who started it’ is not a strictly historical question.

  ### 2. The Impasse in Existing Scholarship
  The decades-long debate surrounding Fritz Fischer’s thesis on German primary responsibility (*Griff nach der Weltmacht*) remains unresolved despite exhaustive archival research. My analysis contends this persistence stems not from a lack of empirical evidence concerning events like the July Crisis, mobilisation timetables, or the "Blank Cheque," but from an unacknowledged philosophical divergence. Historians on all sides implicitly rely on distinct **counterfactual baselines** to judge causation and responsibility.

  *   **What is a Counterfactual Baseline?** It is the tacitly assumed "normal" or "expected" course of events against which actual state actions are compared to determine if they were *deviant* and thus causally responsible for the war. To say State X "started" the war means: *holding this baseline fixed*, the war would not have occurred but for X's actions.
  *   **Examples of Tacit Baselines in the Debate:**
      *   A stable, self-regulating *Balance of Power* system: Responsibility falls on the actor(s) perceived to have destabilised it (e.g., Germany/Austria-Hungary seeking hegemony).
      *   The inherent instability of the *Alliance System*: Responsibility diffuses, as the system made war likely regardless of specific provocations; emphasis shifts to *how* the crisis was managed.
      *   The escalating logic of the *Arms Race* and military planning (e.g., Schlieffen Plan): Responsibility may lie with states whose military doctrines required offensive first strikes or inflexible mobilisation.
      *   *Domestic Political Pressures* (militarism, nationalism, social conflict): Responsibility might be assigned to states where internal forces demonstrably pushed elites towards war as a solution.
  *   **The Core Problem:** Proponents of Fischer (e.g., emphasising German "war council" mentality or aggressive *Weltpolitik*) assume a baseline where peace was maintainable through restraint. Critics (emphasising Russian mobilisation, Entente encirclement, or systemic pressures) assume a baseline where conflict was highly probable or even inevitable, making German actions less uniquely deviant. Crucially, **historians rarely explicitly justify *why* their chosen baseline is the appropriate or "normal" one**. They present their baseline as the self-evident context for interpreting facts, leading to irreconcilable verdicts despite shared chronology.

  ### 3. Methodology: Conceptual Analysis and Baseline Typology
  This is fundamentally a philosophical investigation into historical methodology and causation, requiring conceptual precision rather than new empirical discovery.

  *   **Week 1-2: Foundational Framing & Literature Synthesis:** Systematically review key historiographical strands within the Fischer debate (Fischerites, Structuralists/Systemic historians, Critical Fischerites, Post-Revisionists). Map their core arguments onto the counterfactual baselines they implicitly employ. Formalise the concept of a counterfactual baseline for responsibility attribution.
  *   **Week 3-5: Baseline Identification and Typology Construction:** Develop a comprehensive typology of counterfactual baselines used (explicitly or implicitly) in historical explanations of war origins. Categories will likely include: Structural-Systemic (balance of power, alliances, arms races), Agential-Intentional (specific state/government aims and decisions), Path-Dependent (sequences locking in outcomes), and Normative-Prescriptive (what *ought* to have been the stable state).
  *   **Week 6-8: Principled Selection Criteria Assessment:** Rigorously evaluate potential criteria for selecting a "correct" or "privileged" baseline:
      *   *Historical Plausibility/Probability:* Can historical evidence objectively support one baseline scenario as more likely than others?
      *   *Normative Neutrality:* Is a baseline devoid of implicit judgements about what *should* have happened possible or desirable?
      *   *Explanatory Power/Scope:* Does one baseline consistently yield more comprehensive or parsimonious explanations?
      *   *Causal Salience:* Does one baseline best isolate the most significant causal trigger?
      *   *Analytical Consensus:* Can agreement on a baseline be reached through methodological convention?
  *   **Week 9-10: Synthesis and Argument Development:** Analyse the results of the assessment. Determine if any criteria successfully ground a principled choice among competing baselines. If not, articulate *why* the choice is underdetermined and what this implies.
  *   **Week 11-12: Drafting and Refinement:** Compose the core argument and findings into a journal article draft and project report.

  **Why Conceptual Work, Not Archival Research?** The persistent disagreement, despite decades of meticulous archival work, signals the problem lies *beyond* the empirical facts, in the *interpretive frameworks* applied to them. Conceptual clarity on the role and nature of counterfactual baselines is the necessary tool to diagnose the impasse. More archives won't resolve a disagreement rooted in differing philosophical assumptions about causation and normality.

  ### 4. Genuine Results and Failure Conditions

  *   **Successful Result A:** A defensible, principled method for baseline selection is identified and validated against the WWI case. Outcome: A novel methodological framework resolving the Fischer impasse, applicable to other historical responsibility disputes. Publication: Journal of the Philosophy of History / History and Theory.
  *   **Successful Result B:** A robust demonstration that no principled method for selecting a single authoritative baseline exists; the choice is inherently contestable, contingent on normative or interpretive priorities. Outcome: A significant philosophical intervention showing that assigning singular "war guilt" is not a purely empirical historical question but involves inescapable normative choices. Publication: Philosophy journals (e.g., *Ethics*, *Journal of Political Philosophy*) or interdisciplinary journals (e.g., *History and Memory*). **This result directly addresses your core interest: exposing the shaky foundations of ethical/political uses of such verdicts.**
  *   **Failure:** The project fails only if:
      1.  It proves impossible to coherently map the historiographical disagreements onto distinct counterfactual baselines (unlikely, given preliminary analysis).
      2.  A clear, principled method for baseline selection *is* found, but it fails to provide a compelling resolution within the WWI case due to unforeseen complexities (still a valuable result, refining the method).
      3.  The analysis concludes baselines *can* be chosen objectively, but through a method deemed philosophically uninteresting or trivial (also unlikely).

  ### 5. Feasibility Assessment: One Term's Work?
  This project is **ambitious but achievable within one dedicated term**, provided the scope remains tightly focused:

  *   **Achievable:** The core task – conceptualising baselines, mapping the WWI debate onto them, and assessing selection criteria – is precisely defined and leverages philosophical expertise. The existing historiographical literature is well-known to the PI, eliminating a major research overhead. The output (a rigorous analytical paper) is feasible.
  *   **Mitigating Overreach Risks:**
      *   **Strict Scope:** Focus exclusively on the Fischer controversy and WWI origins as the case study. Avoid expanding into other wars or broader philosophy of history *except* where directly necessary for the argument.
      *   **Leverage Existing Knowledge:** Rely on the PI's deep familiarity with the historical literature, minimising re-reading time. Conceptual work is primary.
      *   **Manage Typology Complexity:** Limit the baseline typology to the most salient 3-5 types demonstrably active in the debate. Avoid exhaustive categorisation.
      *   **Targeted Criteria Assessment:** Focus assessment on the 2-3 most plausible candidates for principled selection (e.g., historical probability, normative neutrality).
  *   **Why Not Overreaching:** The project does not require generating new historical evidence, mastering vast new secondary literatures, or building complex formal models. It is an exercise in applying philosophical analysis (causation, counterfactuals, normativity) to a specific, well-delineated historical methodological impasse. The concentrated time allows for the sustained, focused thinking needed to achieve the necessary conceptual clarity and argumentative rigour.

  ### Conclusion
  This project offers a novel philosophical lens on a century-old historical debate. It promises not merely to rehash arguments but to expose their foundational assumptions. Crucially, it confronts the profound implication you identify: if Result B holds, it fundamentally challenges the historical legitimacy of singular, ethically charged verdicts like "war guilt," revealing them as resting on unacknowledged and contestable normative choices rather than objective historical fact. This internal grant provides the essential uninterrupted time to rigorously develop, test, and articulate this potentially transformative insight.
