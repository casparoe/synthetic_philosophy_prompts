prompt: |-
  I have been trying to settle what I think about vagueness by working through cases rather than by taking sides, and I would like to know what single account my verdicts add up to — or, if no single account can have them all, which verdict has to go. Two accounts are available to me, and I understand they are the standard pair. On the first, a vague predicate has a perfectly sharp extension, a borderline case falls on one side or the other, and the fact is simply beyond our reach, so our ignorance there is real ignorance. On the second, a vague predicate admits many reasonable ways of being made precise; a sentence is true if it is true on every such way, false if it is false on every such way, and neither true nor false otherwise. Here are my verdicts.

  Take a standard bus shelter and the predicate 'crowded', with the number of people inside the only thing that varies. Three people: not crowded. Forty: crowded. Nine: I want to say that it is not crowded and that it is not not-crowded, and that this is not a shortage of information — there is nothing further to find out, and no one, however well placed, could be right or wrong about the nine. Yet when one bystander says 'it is crowded' and another says 'it is not', I think they are contradicting one another. They are not talking past each other, and it cannot be that both have said something entirely in order.

  Now the same words against different standards. A woman who has just left a festival says 'it is not crowded' of a shelter holding nine, meaning crowded as festival crowds go; a man who has spent the night in empty shelters says 'it is crowded', meaning crowded as shelters go. I do not think these two are contradicting one another at all, and each may be perfectly right.

  A council by-law provides that a vehicle of more than 3.2 metres is oversized and charged the higher rate, that a vehicle of 3.0 metres or less is not oversized, and that anything in between is charged the middle rate and recorded in the register as neither. A van of 3.1 metres: I think 'is oversized' is neither true nor false of it. This is not the by-law being vague — it is explicit — and I do not think the sentence is false either. But I see that no reasonable way of drawing the line makes the van oversized, so a principle that calls a sentence false when it is false on every reasonable drawing of the line would have to call this one false. That troubles me, and not only because of the by-law.

  Of the nine, I also think the disjunction holds: either it is crowded or it is not, with no question of that failing, even though I have said that neither disjunct is true of it. Yet I think there is no number n such that n people is crowded and n−1 is not — the shelter does not tip from crowded to uncrowded at any particular person. I am told that this last verdict cannot survive the others: if every number is either crowded or not, and forty is crowded while three is not, then some number is the first crowded one. I do not want to surrender it.

  Ask me whether seven people is a borderline case and I want to say that there is a fact of the matter about that as well — that the grey zone has edges, that 'borderline crowded' is not itself vague. But I will not defend any particular edge; each candidate strikes me as absurd; and if I am honest, I think the edge of the grey zone is vague too.

  The principle I should like to hold is this: a sentence containing a vague predicate is true just in case it is true on every reasonable way of making that predicate precise, false just in case it is false on every such way, and otherwise neither true nor false. That is the second of the two accounts above, or close enough.

  Please do four things. First, state the principle, or the small set of rival principles, that best fits these verdicts, clause by clause, and say which case forces each clause. Second, say which of my verdicts the principle cannot keep and what I should say instead, and be explicit about where I am simply inconsistent. Third, say how the first account fares on the bus shelter — whether its answer, that there is a fact of the matter I cannot reach, is better or worse than the second's answer, and in particular whether it can make sense of my conviction that the two bystanders are contradicting one another — and tell me whether the by-law is an objection to the second account or only to my statement of it. Fourth, apply the account you favour to a case I have not described; choose the case yourself and say why it is a fair test. I am after the account itself rather than the literature, so please do not spend the answer telling me who has held what.
reasoning: |-
  Okay, let's tackle this user's query step by step. They're wrestling with vagueness and have several specific intuitions about cases involving predicates like "crowded" and legal terms like "oversized." They’ve outlined their verdicts across different scenarios and want to know which philosophical account fits best, where the inconsistencies lie, and how to resolve them.

  First, I need to map their stated verdicts to the two accounts: epistemicism (sharp but unknown boundaries) and supervaluationism (truth defined over all precisifications). The user’s principle leans toward supervaluationism, but their other judgments create tension. 

  Looking at their bus shelter example:  
  - With 9 people, they think "crowded" is neither true nor false, and there’s no fact to discover. This aligns with supervaluationism’s truth-value gaps.  
  - Yet they also insist the bystanders contradict each other—meaning one must be wrong. But supervaluationism typically treats such disputes as neither true nor false, so no contradiction exists. This is a conflict.  

  For contextual variation (festival vs. empty shelter standards), they see no contradiction. Supervaluationism handles this via different "reasonable precisifications," so this fits well.  

  The by-law case is interesting:  
  - A 3.1m van is "neither" by rule, and they think "is oversized" is neither true nor false. But supervaluationism would deem it false because all precisifications respect the 3.2m cutoff. Here, the user’s intuition clashes with supervaluationism’s output.  

  Then there’s the disjunction paradox:  
  - They accept "crowded or not crowded" is always true (per classical logic), yet deny any sharp boundary between n and n-1. Supervaluationism preserves the disjunction’s truth but avoids sharp boundaries—this seems consistent.  

  But their final verdict about borderline cases having vague boundaries ("borderline crowded" being vague) breaks supervaluationism, which requires sharp boundaries for higher-order vagueness.  

  Synthesizing this:  
  1. **Best-fitting principle**: Modified supervaluationism (accepting truth-value gaps and contextual variation) covers most cases except:  
     - The bystander contradiction (which requires a sharp fact for disagreement).  
     - The by-law case (where precisifications align against truth).  
     - Higher-order vagueness (which demands sharp boundaries).  
  2. **Inconsistencies**:  
     - Bystanders contradicting → Requires epistemicism for factual disagreement.  
     - By-law van → Supervaluationism says "false," but user says "neither."  
     - Vague grey-zone edges → Contradicts supervaluationism’s sharp meta-boundaries.  
  3. **Epistemicism vs. Supervaluationism**:  
     - Epistemicism explains bystander disagreement (one is factually wrong) but clashes with "no fact" intuition at 9 people.  
     - Supervaluationism handles contextual standards well but falters on by-law (user misstated principle?) and higher-order vagueness.  
  4. **New test case**: Imagine a predicate "tall for a guard" with shifting sports standards. Supervaluationism handles contextual precisifications smoothly; epistemicism struggles with flexible boundaries.  

  Key tension points:  
  - User wants no fact at 9 people *and* real contradiction → Logically impossible. Must surrender one.  
  - By-law: User’s "neither" vs. supervaluationism’s "false" → Either accept the principle’s output or adjust the intuition.  
  - Higher-order vagueness → Supervaluationism’s sharp boundaries are counterintuitive; might need to embrace vagueness all the way up.  

  Recommendation: Adopt supervaluationism but:  
  - Drop "bystanders contradict" or reframe it as pragmatic disagreement.  
  - For by-law, clarify that "false" doesn’t mean "oversized" but "not oversized under any interpretation."  
  - Accept that higher-order vagueness is unresolved—perhaps a limitation of the framework.
answer: |-
  I'll address your query systematically, following your four requests. Your verdicts reveal a nuanced view that *mostly* aligns with **supervaluationism** (the second account), but with tensions that require revising one key verdict. I'll break this down step by step.

  ### 1. The Principle That Best Fits Your Verdicts (Clause by Clause)
  Your preferred principle is **supervaluationism**, stated as:  
  *A sentence containing a vague predicate is true iff it is true on every reasonable way of making the predicate precise ("admissible precisification"), false iff false on every admissible precisification, and neither true nor false otherwise.*

  Here's how your cases map to this principle:
  - **Bus shelter (9 people)**: You say "it is not crowded and not not-crowded" (i.e., neither true nor false), and "no one could be right or wrong." This fits supervaluationism's "neither" verdict for borderline cases. *Case forces the clause*: Borderline cases lack truth values, and this isn't mere ignorance.
  - **Contextual variation (festival vs. empty shelters)**: The bystanders aren't contradicting; each is right relative to their context. Supervaluationism handles this via *context-dependent admissible precisifications* (e.g., "crowded as festival crowds go" vs. "crowded as shelters go"). *Case forces the clause*: Truth depends on contextually reasonable standards.
  - **By-law (3.1m van)**: You say "is oversized" is neither true nor false. Supervaluationism *initially seems* to conflict here (as I'll explain later), but your verdict forces a clause: *The principle must accommodate explicit gaps defined by rules*, not just vagueness. This suggests precisifications must respect the by-law's three-way division.
  - **Disjunction ("crowded or not crowded")**: You accept this holds, even for borderline cases. Supervaluationism preserves classical logic for tautologies like this—it's true because it holds on *every* precisification. *Case forces the clause*: Classical logic applies to "penumbral connections" like disjunctions.
  - **No sharp boundary**: You deny any number n where n is crowded and n−1 isn't. Supervaluationism avoids sharp boundaries—admissible precisifications disagree on where "crowded" starts. *Case forces the clause*: Vagueness implies no unique cutoff.
  - **Borderline cases having sharp edges**: You want "borderline crowded" to have a fact of the matter, but also admit its edges are vague. Supervaluationism *fails* here—it requires sharp boundaries for "borderline" (a "higher-order" problem). *Case forces a tension*: Your verdict demands sharp meta-boundaries, but your intuition rejects them.

  **Summary of best fit**: Supervaluationism captures 5/6 core verdicts. The only misfit is your claim that "borderline crowded" has sharp edges, which supervaluationism requires but you intuitively reject. Rival principles (e.g., epistemicism) fare worse (see section 3).

  ---

  ### 2. Verdicts the Principle Cannot Keep and How to Revise Them
  Supervaluationism conflicts with **one of your verdicts** and **one implication**:
  - **Conflict 1: "Borderline crowded" has sharp edges**.  
    Supervaluationism *requires* sharp boundaries for "borderline" (e.g., there's a precise number where "borderline crowded" starts). But you find this absurd and think the edge is vague too. This is **inconsistent** with supervaluationism's framework.  
    *Revision needed*: Drop the verdict that "there is a fact of the matter" about borderline status. Instead, say higher-order vagueness is real—the grey zone's edges are themselves vague. Supervaluationism struggles here, but you can weaken it: allow "borderline" to have its own spectrum of precisifications (e.g., "borderline" is vague, so we iterate the supervaluation process). This avoids sharp meta-boundaries but complicates the theory.

  - **Conflict 2: The by-law case threatens your statement of supervaluationism**.  
    You worry that supervaluationism would call "The van is oversized" **false** (since no reasonable precisification makes a 3.1m van oversized). But you *want* it to be "neither." This is a **misstatement** in your principle, not a flaw in supervaluationism itself.  
    *Revision needed*: Admissible precisifications must respect the by-law's rules. If the by-law *defines* 3.1m as "neither," then no precisification can call it oversized. Thus, "is oversized" is false on all precisifications? No—supervaluationism can treat the by-law as fixing a three-valued system. Redefine precisifications: some might make "oversized" true only above 3.2m, false below 3.0m, and neither in between. Then "is oversized" for the van is *neither* (it's not true on all precisifications, nor false on all). This fits your verdict.

  **Explicit inconsistency**:  
  - You say the bystanders (same context) "contradict each other" while insisting neither is right/wrong about the 9-person shelter. This **contradicts** supervaluationism. In supervaluationism, if neither "crowded" nor "not crowded" is true, their statements aren't genuine contradictions (neither has a truth value). To resolve this:  
    - *Option 1 (Revise)*: Drop the "contradiction" verdict. Say they aren't truly contradicting—they're expressing incompatible *attitudes* or *prescriptions*, not truth-apt claims.  
    - *Option 2 (Adjust principle)*: Adopt a **dialetheic** or **paraconsistent** tweak where "crowded and not crowded" can be both true in borderline cases—but this clashes with your other intuitions and is unnecessary.  
    *Recommendation*: Revise to Option 1. Your contextual-variation case shows you understand non-contradictory disagreement; apply that here.

  ---

  ### 3. How Epistemicism Fares on the Bus Shelter and the By-Law
  - **Epistemicism (first account) on the bus shelter**:  
    It says "crowded" has a sharp boundary (e.g., exactly 17 people is crowded, 16 is not). For the 9-person case, it *agrees* with your verdict that "neither disjunct is true" (since you're ignorant of the fact), but **conflicts** with your core intuition: you say "no one could be right or wrong," while epistemicism insists one bystander *is* factually right (and we just don't know who).  
    - *Is it better or worse than supervaluationism?* Worse, for you. It cannot make sense of your conviction that the bystanders are contradicting *without* one being right—epistemicism requires one to be objectively correct. Your "no fact to discover" verdict rejects this.  
    - *Contradiction intuition*: Epistemicism *can* explain why they contradict (one is right, one wrong), but this forces you to accept a sharp boundary you deny (e.g., "n vs. n−1" must have a cutoff).

  - **The by-law as an objection**:  
    The by-law is **not an objection to supervaluationism**—it's only a problem for your initial statement of it. As revised above, supervaluationism can incorporate explicit gaps (like the by-law's three categories) by constraining admissible precisifications. Epistemicism handles this easily: the by-law *eliminates* vagueness, making "oversized" precise (so the van is determinately not oversized). But this conflicts with your verdict that "is oversized" is *neither true nor false* (epistemicism would say it's false).

  ---

  ### 4. Applying Supervaluationism to a New Test Case
  **Case**: "This is a heap" for a collection of sand grains.  
  - *Description*: Start with 1,000 grains (clearly a heap). Remove grains one by one. At 500 grains, it's borderline; at 10 grains, clearly not a heap.  
  - *Application of supervaluationism*:  
    - Admissible precisifications might set the heap/non-heap cutoff anywhere between (e.g.) 200–800 grains.  
    - **Truth evaluations**:  
      - "This is a heap" for 10 grains: **false** (false on all precisifications).  
      - For 500 grains: **neither** (true on some precisifications, false on others).  
      - "Either it is a heap or it is not": **true** (holds on every precisification, despite vagueness).  
      - "There is a specific number n where n grains is a heap but n−1 is not": **false** (no precisification is "correct," so no fact about n).  
    - *Why this is a fair test*:  
      It tests supervaluationism's handling of gradual change (like your bus shelter), higher-order vagueness (is "borderline heap" sharp-edged?), and classical logic. Your verdicts predictably align: no sharp boundary, disjunction holds, borderline cases lack truth values. Tension arises if you insist "borderline heap" has a precise start—but as before, that verdict should be revised.

  ---

  ### Final Recommendation
  - **Adopt supervaluationism**, revised to:  
    - Allow precisifications constrained by explicit rules (like the by-law).  
    - Drop the verdict that "borderline" has sharp edges (embrace higher-order vagueness).  
    - Drop the claim that same-context bystanders genuinely contradict (they merely disagree in attitude).  
  - **Why?** It respects 5/6 verdicts, handles contextual variation elegantly, and avoids sharp boundaries. The epistemic alternative forces unwanted facts and cutoffs.  
  - **Cost**: You must surrender the intuition that borderline status is determinate—but this is your weakest verdict, and rejecting it aligns with your broader view that vagueness has no "edges."  

  This gives a coherent, non-epistemic account of vagueness that matches your core intuitions while resolving inconsistencies. If you hold fast to all verdicts, no existing theory works—but supervaluationism comes closest.
