  Biggest risk: The substitutions turning nonsensical. Mapping replacements in advance helps. Line 1: [This]→[My]→[A]; [hand]→[flesh]→[ghost]; etc. "Still" → "cold" → "no" works because all imply stagnation. Finally, the title "Gradual" nods to the theme without spoiling the mechanic. 

