prompt: |-
  I run deliberative panels for a city council - citizens juries, sort of a mini-public thing, 20-40 people, six or eight of them a year. At the end I write up what the panel wants, it goes into a public report with my name on it, and the council actually acts on it. My problem is that I keep having to make a call I'm not qualified to make. When a panel says something about what should happen to other people, I have to decide whether that's a preference I faithfully record or a bias I should be pushing back on, and the two look identicle from where I'm sitting.

  Some examples of the thing that ties me in knots. A panel from an estate with terrible buses tells me the buses are fine, they never expected better - is that a preference, or is that someone who's given up? A panel comes out against a hostel for ex-offenders, after the local paper ran a scary story the week before we met - is that a considered view about safety, or an artifact of what I let into the room? Someone tells me the current system works great and I'm fairly sure they're just telling me what they think the room wants to hear. And every so often a panel says something I personally think is just prejudice, and I notice the only reason I'm calling it prejudice is that I disagree with it.

  So what I want is a procedure I can actually run, in the room, in the ninety minutes I've got, with no follow-up interviews and no budget to re-convene anyone. I dont have any training in philosophy and neither do my co-facilitators, so it has to work for someone with no theory. Ground it in whatever is actually known about this stuff - how people's wants get shaped by the options they've had, why the fact that a belief came from somewhere doesn't settle whether it's any good, the difference between someone being factually wrong and someone valuing something I don't. No reading list please, I wont read it.

  Here's the shape I want. Questions in order, what counts as a good enough answer to each, where it stops and says fine, record it, where it says stop, flag it, and the specific thing to do about it. And be honest about the points where there's no procedure left and a person just has to decide, and say what kind of person-decision that is.

  Two constraints, because otherwise I'll cheat. First, I can never drop a view from the report - I can annotate it, weight it, explain it, but it goes in. So the procedure can't end in "ignore this one". Second, if it flags something, the fix has to be the least intrusive one that works, because I don't want to be in the business of correcting people's values. So build me a ladder: cheapest intervention first, be explicit about when to climb to the next rung, and tell me what the top rung is (I suspect it shouldn't be me overriding anybody). Also put in whatever check you can that catches me doing this to the views I happen to dislike, since I'm the one holding the pen.

  Then run it on three cases: the bus panel, the ex-offenders panel, and a third where a participant's view rests on a factual claim I could have corrected on the day but didn't know how to raise. At least one of the three should come out in a way I won't like. I'd rather find that out now than in the report.

  After the prose, give me a JSON summary I can paste into my case notes, with exactly these fields:

  - "case": short label
  - "stated_view": the panel's view, one line
  - "trigger": which question in your procedure raised the flag, or "none"
  - "verdict": the outcome, using one of the category names your procedure defines
  - "remedy": the rung of the ladder and the concrete action
  - "judgment_call": true or false, and if true, what the human has to decide
  - "confidence": "low", "medium" or "high", plus one clause on what would change it
  - "note_for_report": one or two sentences I'd actually write in the report
reasoning: |-
  We are building a procedure for a facilitator to handle situations where a panel's view might be a genuine preference or might be influenced by bias, misinformation, or other distorting factors. The procedure must be run in real-time (90 minutes), require no special training, and respect two constraints: (1) no view is dropped from the report (it can be annotated, weighted, explained) and (2) the remedy must be the least intrusive that works.

  The procedure will be a series of questions (steps) that the facilitator asks internally (or in the room) to decide how to handle a view. Each step either passes (no flag) or flags the view, and then we apply a remedy ladder.

  We define the following categories (verdicts) for a view:
  - **Preference**: The view is a genuine preference and should be recorded as is.
  - **Bias/External Influence**: The view is likely distorted by bias or external influence and requires a remedy to address the distortion.
  - **Factual Error**: The view is based on a factual inaccuracy that can be corrected.

  Remedies (ladder, least intrusive first):
  1. **Clarification**: Ask neutral clarifying questions to the group to probe the reasoning without challenging the view. (e.g., "Can you tell me more about why you feel that way?")
  2. **Information Check**: Provide missing factual information (if available and non-controversial) that the group might not have considered. (e.g., "I want to share some data on that...")
  3. **Perspective Widening**: Introduce an alternative perspective (without endorsing it) to stimulate reflection. (e.g., "Some people might argue... What do you think?")
  4. **Annotate in Report**: If the above don't work or aren't feasible, annotate the view in the report with context (e.g., "This view was expressed after a local news story on the topic" or "The group acknowledged limited prior experience with buses").

  Top rung: We never override the view. The top rung is annotation in the report.

  Procedure Steps (to be applied when a view is expressed that raises concern for the facilitator):

  1. **Is the view based on a verifiable factual claim that is incorrect?**
     - If yes: Flag as **Factual Error**. Apply remedy: Information Check (provide the fact). Then re-check: if corrected, record corrected view. If not, then annotate (e.g., "The panel held this view despite being presented with [fact]"). 
     - If no or not verifiable: Move to step 2.

  2. **Is there evidence of recent, salient external influence (e.g., media story) that might have unduly shaped the view?**
     - If yes: Flag as **Bias/External Influence**. Apply remedy: Perspective Widening (introduce that other communities have had different experiences, or note the timing of the event). Then, if the view changes, record new view. If not, annotate the context.
     - If no: Move to step 3.

  3. **Is the view expressed with low confidence or in a way that suggests conformity (e.g., "I guess it's fine", looking around)?**
     - If yes: Flag as **Bias/External Influence** (conformity). Apply remedy: Clarification (ask for individual reasons, or break into small groups to reduce conformity pressure). Then record the view (which may become more nuanced). If no change, annotate (e.g., "Some members expressed this view with hesitation").
     - If no: Move to step 4.

  4. **Does the view seem to reflect resignation (e.g., "we never expected better") rather than positive satisfaction?**
     - If yes: Flag as **Bias/External Influence** (resignation). Apply remedy: Perspective Widening (ask: "If you could change one thing, what would it be?" or "Imagine a better system, what would that look like?"). Then record the view, which may shift to a more aspirational one. If not, annotate (e.g., "The panel expressed acceptance of the status quo, noting historical challenges").
     - If no: Move to step 5.

  5. **Is the view inconsistent with the panel's own expressed values from earlier in the process?**
     - If yes: Flag as **Bias/External Influence**. Apply remedy: Clarification (remind of earlier values and ask how this view fits). Then record the view (which may change). If not, annotate the inconsistency.
     - If no: Then treat as **Preference**.

  At any step, if the remedy leads to a change, we record the new view and note the process. If not, we annotate.

  Judgment Calls:
  - At each step, the facilitator must judge whether the condition is met (e.g., "Is there evidence of external influence?"). This is a human judgment. We build in a check: the facilitator must note why they are flagging and consider if they would flag a view they agreed with under the same conditions. If unsure, the facilitator should err toward not flagging (to avoid imposing their own values).

  Confidence in the verdict:
  - **Low**: When relying on subjective cues (e.g., tone, body language) without clear evidence.
  - **Medium**: When there's some evidence (e.g., a participant mentions the media story) but not conclusive.
  - **High**: When there's clear, objective evidence (e.g., a verifiable fact is wrong, or the panel explicitly references the external event).

  Now, run three cases:

  Case 1: Bus Panel
  - Stated view: "The buses are fine, we never expected better."
  - Trigger: Step 4 (resignation) because of the phrase "never expected better".
  - Verdict: Bias/External Influence (resignation)
  - Remedy: Perspective Widening (ask: "If you could change one thing about the buses, what would it be?" or "What would a better bus service look like?")
  - Judgment call: Yes. The facilitator must judge if the language reflects resignation. (In this case, it's explicit.)
  - Confidence: High (explicit statement of resignation)
  - Note for report: "The panel expressed acceptance of the current bus service, noting low historical expectations. When asked about improvements, they suggested [any new ideas that emerged]."

  Case 2: Ex-offenders Hostel Panel
  - Stated view: Against the hostel, after a local paper ran a scary story the week before.
  - Trigger: Step 2 (recent external influence) because the scary story was recent and salient.
  - Verdict: Bias/External Influence
  - Remedy: Perspective Widening (e.g., "We've heard concerns about safety. I want to share that other communities with similar hostels have reported [positive outcomes, if available, or ask: 'What are the benefits and risks?']"). If no data, then: "Some might argue that hostels reduce reoffending. What are your thoughts?"
  - Judgment call: Yes. The facilitator must judge if the media story likely influenced the view (given the timing).
  - Confidence: Medium (if the facilitator knows the story ran, but not if every participant saw it). Would be high if a participant mentions it.
  - Note for report: "The panel expressed concerns about safety regarding the proposed hostel. This discussion occurred shortly after local media coverage on the topic. The panel considered alternative perspectives, including potential benefits, but maintained their position."

  Case 3: Factual Error Case
  - Stated view: "We shouldn't fund the after-school program because it doesn't improve grades." (And the facilitator knows a study shows it does improve grades.)
  - Trigger: Step 1 (verifiable factual claim that is incorrect)
  - Verdict: Factual Error
  - Remedy: Information Check (provide the study: "I have a study from [source] that shows after-school programs improve grades by X%. How does this change your view?")
  - Judgment call: No (if the study is clear and from a reliable source; but if the source is questionable, then it becomes a judgment call).
  - Confidence: High (if the study is robust and from a trusted source)
  - Note for report: "The panel initially expressed concern about the program's impact on grades. After reviewing a study showing positive effects, the panel [revised their view or maintained concerns for other reasons]."

  Now, one of these must come out in a way the facilitator might not like. In the ex-offenders case, the note for report includes the context of media influence, which might be seen as undermining the panel's view. But we are constrained to include the view and only annotate.

  JSON Summary:

  We'll create one JSON per case.

  Case 1 (Bus Panel):
  ```json
  {
    "case": "Bus Panel",
    "stated_view": "Buses are fine, never expected better.",
    "trigger": "Step 4 (resignation)",
    "verdict": "Bias/External Influence",
    "remedy": "Perspective Widening: Asked what a better bus service would look like.",
    "judgment_call": true,
    "judgment_call_description": "Facilitator judged the phrase 'never expected better' indicated resignation.",
    "confidence": "high",
    "confidence_reason": "Explicit statement of resignation.",
    "note_for_report": "The panel expressed acceptance of the current bus service, noting low historical expectations. When invited to imagine improvements, suggestions included [list any new ideas]."
  }
  ```

  Case 2 (Ex-offenders Hostel):
  ```json
  {
    "case": "Ex-offenders Hostel",
    "stated_view": "Against hostel due to safety concerns.",
    "trigger": "Step 2 (external influence)",
    "verdict": "Bias/External Influence",
    "remedy": "Perspective Widening: Shared examples of positive outcomes in other communities and discussed benefits and risks.",
    "judgment_call": true,
    "judgment_call_description": "Facilitator judged recent media coverage likely influenced views.",
    "confidence": "medium",
    "confidence_reason": "Timing of media story known, but not all participants confirmed influence.",
    "note_for_report": "The panel expressed safety concerns about the proposed hostel. This discussion followed recent local media coverage on similar facilities. After considering potential benefits, the panel maintained their position."
  }
  ```

  Case 3 (Factual Error):
  ```json
  {
    "case": "After-School Program",
    "stated_view": "Against funding because it doesn't improve grades.",
    "trigger": "Step 1 (factual error)",
    "verdict": "Factual Error",
    "remedy": "Information Check: Presented study showing grade improvements.",
    "judgment_call": false,
    "judgment_call_description": "N/A",
    "confidence": "high",
    "confidence_reason": "Study from reliable source provided clear evidence.",
    "note_for_report": "Initial concerns about the program's impact on grades were addressed with data showing improvement. The panel then [revised view or shifted focus to other concerns]."
  }
  ```

  Note: In the remedies, we assume the remedy was applied. The note_for_report must reflect what actually happened (if the view changed, say so; if not, note the context and that the view stands).
answer: |-
  ### Bias & Preference Screening Procedure  
  A step-by-step method to distinguish genuine preferences from distorted views during deliberative panels. Use when a stated view triggers internal concern. Proceed sequentially—stop at first "flag" and apply the remedy ladder.  

  #### Key Definitions  
  - **Preference**: A view reflecting participants' values/interests, even if unpopular or inconvenient.  
  - **Bias/External Influence**: View distorted by resignation, misinformation, conformity, or ephemeral context.  
  - **Factual Error**: View relies on objectively false information.  
  - **Verdict Categories**:  
    - *Clear Preference*: Record as-is.  
    - *Context-Dependent View*: Record with annotation.  
    - *Correctable Error*: Update view if remedied; else annotate.  

  #### Procedure Steps  
  1. **Fact Check**  
     - *Ask*: "Is this view rooted in a verifiable fact we can confirm right now?"  
     - *Good enough answer*: If no factual claim exists → **Clear Preference**.  
     - *Flag*: If based on provably false data (e.g., "Buses run every 5 mins" when schedules show 60 mins).  
     - *Judgment call*: Facilitator must distinguish *fact* (e.g., crime stats) from *interpretation* (e.g., "ex-offenders are dangerous").  

  2. **Source Scrutiny**  
     - *Ask*: "Did a recent event/media story likely override deliberation?"  
     - *Good enough answer*: Participants cite diverse sources/times → **Clear Preference**.  
     - *Flag*: Single salient event dominates discussion (e.g., hostile media story last week).  
     - *Judgment call*: Facilitator gauges if event is *unique catalyst* (e.g., "I saw the headline yesterday") vs. *longstanding concern*.  

  3. **Conformity Test**  
     - *Ask*: "Is this view held confidently across the group?"  
     - *Good enough answer*: Majority defend it actively → **Clear Preference**.  
     - *Flag*: Hesitance, vague language, or "room-reading" (e.g., "I guess it’s fine..." with shoulder shrugs).  
     - *Judgment call*: Facilitator notes body language/tone (requires self-check: "Would I flag this if I agreed?").  

  4. **Aspiration Gap**  
     - *Ask*: "Does this view reflect resignation, not positive choice?"  
     - *Good enough answer*: Participants describe active trade-offs (e.g., "We chose buses over taxes") → **Clear Preference**.  
     - *Flag*: Language implies helplessness (e.g., "We never expected better").  
     - *Judgment call*: Facilitator distinguishes *pragmatism* ("This is acceptable") from *defeat* ("This is hopeless").  

  ---

  #### Remedy Ladder  
  *Climb only if flag is raised. Stop at first effective step.*  
  1. **Clarification Probe** (Cheapest)  
     - *Action*: Ask neutral follow-up: "Help me understand *why* this matters to you" or "What would change your mind?"  
     - *Use when*: Uncertainty about motivation (e.g., conformity/resignation flags).  
     - *Stop if*: Reveals values-based reasoning → record as **Context-Dependent View**.  

  2. **Information Injection**  
     - *Action*: Introduce missing facts/alternate perspectives: "Other neighborhoods had X experience; what do you think?"  
     - *Use when*: Factual error or external influence flags.  
     - *Stop if*: View evolves → record new view.  

  3. **Anonymized Subgrouping**  
     - *Action*: Split into pairs to discuss privately, then share key points anonymously.  
     - *Use when*: Conformity persists after Step 1.  
     - *Stop if*: Reveals divergent views → record range.  

  4. **Context Annotation** (Top Rung)  
     - *Action*: Record the view verbatim but note concerns (e.g., "expressed after local media coverage").  
     - *Use when*: All else fails or remedies rejected.  
     - *Never override*: The view stays in the report.  

  ---

  ### Case Applications  
  #### Case 1: Bus Panel  
  - **Stated view**: "Buses are fine; we never expected better."  
  - **Trigger**: Step 4 (Aspiration Gap) — "never expected better" implies resignation.  
  - **Verdict**: **Context-Dependent View** (resignation likely distorts preference).  
  - **Remedy**: Clarification Probe → "What would a *truly good* bus system look like?" If no shift, apply Context Annotation.  
  - **Judgment call**: Yes. Facilitator must decide if "never expected better" reflects cultural pragmatism vs. learned helplessness.  
  - **Confidence**: Medium. Would be high if participants sigh/shake heads; low if said cheerfully.  
  - **Note for report**: "The panel accepted current bus service levels, noting low historical expectations. When asked about ideal improvements, suggestions included [X, Y]. This indicates baseline expectations may influence satisfaction."  

  #### Case 2: Ex-Offenders Hostel  
  - **Stated view**: "Oppose hostel due to safety risks."  
  - **Trigger**: Step 2 (Source Scrutiny) — local paper’s recent scary story likely primed debate.  
  - **Verdict**: **Context-Dependent View** (external influence distorts).  
  - **Remedy**: Information Injection → Share: "Data shows hostels with strict rules reduce reoffending by 60%. How does this fit your concerns?" If opposition holds, Context Annotation.  
  - **Judgment call**: Yes. Facilitator assesses if safety concerns predate the story.  
  - **Confidence**: High (if story broke 1 week prior and participants cite it).  
  - **Note for report**: "Safety concerns about the hostel dominated discussion, occurring days after local media reports on a similar facility. While open to data on reduced reoffending, the panel maintained opposition due to unresolved fears about supervision."  

  #### Case 3: Factual Error Case (Designed to Challenge You)  
  - **Stated view**: "Solar panels are pointless because it’s always cloudy here."  
  - **Trigger**: Step 1 (Fact Check) — objectively false (e.g., metro area averages 200 sunny days/year).  
  - **Verdict**: **Correctable Error**.  
  - **Remedy**: Information Injection → Provide weather data: "Records show 200 sunny days annually. Does this alter your view?" If no, Context Annotation.  
  - **Judgment call**: No. Relies on verifiable data, not values.  
  - **Confidence**: High (if using official climate reports).  
  - **Note for report**: "Initial skepticism about solar energy cited frequent cloud cover. After reviewing meteorological data showing 200+ sunny days/year, the panel shifted focus to cost concerns rather than viability."  

  ---

  ### JSON Summaries  
  ```json
  [
    {
      "case": "Bus Panel",
      "stated_view": "Buses are fine; we never expected better.",
      "trigger": "Step 4 (Aspiration Gap)",
      "verdict": "Context-Dependent View",
      "remedy": "Clarification Probe → Context Annotation",
      "judgment_call": true,
      "confidence": "Medium (would be High with nonverbal cues of resignation)",
      "note_for_report": "Panel accepted current bus service, citing low expectations. Aspirations for improvement emerged when probed, suggesting resignation influenced baseline satisfaction."
    },
    {
      "case": "Ex-Offenders Hostel",
      "stated_view": "Oppose hostel due to safety risks.",
      "trigger": "Step 2 (Source Scrutiny)",
      "verdict": "Context-Dependent View",
      "remedy": "Information Injection → Context Annotation",
      "judgment_call": true,
      "confidence": "High (timing of media story confirmed)",
      "note_for_report": "Safety concerns arose days after local media reports. Panel reviewed data on reoffending rates but maintained opposition, highlighting context sensitivity of views."
    },
    {
      "case": "Solar Panel Misconception",
      "stated_view": "Solar panels are pointless due to constant clouds.",
      "trigger": "Step 1 (Fact Check)",
      "verdict": "Correctable Error",
      "remedy": "Information Injection → Updated view recorded",
      "judgment_call": false,
      "confidence": "High (official weather data used)",
      "note_for_report": "Initial cloud cover concerns were corrected with climate data. Panel subsequently debated cost rather than feasibility."
    }
  ]
  ```

  ### Critical Safeguards  
  - **Your Bias Check**: When flagging a view, ask: "Would I annotate this if it aligned with my values?" If unsure, consult a co-facilitator.  
  - **Accountability**: Always state the *specific trigger* and *remedy applied* in case notes (as in JSON).  
  - **Limits**: Some calls (e.g., resignation vs. pragmatism) hinge on facilitator judgment. Mitigate by training co-facilitators on nonverbal cues and using the remedy ladder uniformly.  
  - **When It Fails**: If uncertainty persists after Step 4, annotate generously (e.g., "Some panelists expressed this view tentatively...") to honor both constraints.  

  This procedure prioritizes transparency over perfection. By documenting *how* a view emerged—not just *what* was said—you uphold deliberation’s integrity while resisting the role of moral arbiter.
