prompt: |-
  I sit on the science advisory panel of a small foundation that funds long-horizon modelling of food and land use, and Thursday I have to bring a written recommendation on whether to renew a team's grant. Their model says rising demand plus finite arable land will produce a global food crunch, and they've been saying it for thirty years with a hard date each time: 2005, then 2015, now the "real" window is the late 2030s and everything earlier was just noise. Their line is that the mechanism is right and the timing was early -- the Malthus defence, basically -- and I don't know what to do with it. One panel member wants to cut them off, on the grounds that a theory whose deadline you can always push back isn't a theory, it's a mood. Another thinks that's too crude, since plenty of things we now think got something big right looked wrong for decades first, and the delays here have causes we can actually name (yield gains, trade, a couple of one-off policy shifts), not just fudge factors. Worth noting they did call the timing of regional groundwater depletion in two basins pretty closely, which is the one thing that makes me hesitate.

  Our guidelines say renewals need a credible path to a test that could actually come out against the theory, and I have to hand over a decision plus milestones, not vibes. One member has proposed funding them for five years but freezing the model as of today -- no parameter changes, no re-fitting -- so the late-2030s claim either holds up or it doesn't. Write the opinion I'll circulate: renew, renew with conditions, or decline, with a time frame and something I can actually act on. Be honest about the strongest case against whatever you recommend, and say something usable about where the line falls between a theory being legitimately rescued and being rescued ad nauseum -- they've re-fit the parameters after every miss and insist each revision was driven by new data rather than by the miss itself, and I can't tell wether that's a distinction with a difference. Don't tell me to just wait for the data; the whole problem is that the data won't arrive in my lifetime.
reasoning: |-
  Okay, let me tackle this science advisory dilemma. The user needs a clear recommendation on whether to renew a team's grant for their long-term food crisis model that keeps pushing back its doomsday predictions. 

  First I need to unpack the core tension: the model's core mechanism (finite land + rising demand → crisis) seems plausible, but its repeated timeline failures undermine credibility. The panel is split between "this is unscientific goalpost-moving" and "important theories often look wrong before being vindicated." 

  Key points I'm weighing:
  - They accurately predicted regional groundwater depletion (shows some skill)
  - But three major timeline misses (2005, 2015, now 2030s) with parameter tweaks after each failure
  - Foundation requires "credible path to falsification" - which their moving target avoids

  Hmm... the "freeze the model" compromise proposed by one panelist feels clever but has problems. Five years locked parameters won't test the core crisis claim (2030s deadline falls outside the window), and prevents incorporating real new data like crop disease outbreaks. Might punish them for scientific responsiveness.

  What if we reframe the test? Instead of demanding they predict the exact crisis year (which they've proven bad at), make them identify precursor thresholds - things like "when grain reserves drop below X months" or "when Y% of aquifers hit tipping points." These are:
  - Measurable within 5 years
  - Tied to their mechanism
  - Would actually falsify if not met (e.g. if reserves keep growing)

  Also noting - their defense of tweaking parameters with "new data not misses" needs scrutiny. Distinction without difference? Maybe force them to pre-register what data would justify changes before seeing outcomes. 

  Biggest risk: cutting them off right before they might finally be right (the groundwater call shows insight). But funding endlessly unfalsifiable claims wastes resources. The precursor thresholds idea balances both - keeps them accountable while allowing work on a real problem.

  For the recommendation: conditional renewal with teeth. Three year term (not five), demand testable near-term predictions, require preregistered model adjustment criteria. And crucially - no more timeline extensions unless unprecedented events (asteroid strikes etc.). If they miss the 2030s window without catastrophic disruption, that's it.

  This answers the user's plea for actionability: concrete milestones, a decision framework for legitimacy vs. nauseam rescues, and avoids kicking the can beyond their lifetime.
answer: |-
  Here’s a draft recommendation for your panel, designed for clarity, accountability, and scientific rigor:

  ---

  **Recommendation: Renew for 3 years with strict falsifiability conditions.**  
  **Timeframe:** 2025–2027 (next review Q4 2027).  
  **Decision Framework:** Focused on near-term precursor validation.  

  ### Core Rationale  
  The model’s core mechanism (demand growth vs. finite land) remains plausible, and the team demonstrated tangible skill in predicting regional groundwater depletion. However, serial deadline extensions (2005 → 2015 → late 2030s) without clear ex ante falsification criteria risk degenerating into unfalsifiable "mood" forecasting. Renewal must force a decisive test **within the funding window**.  

  ### Conditions for Renewal  
  1. **Freeze core parameters** by Dec 2025, but *not* the entire model:  
     - **Allowed:** Input updates (e.g., new FAO yield/trade data, climate shocks).  
     - **Prohibited:** Re-fitting land ceilings, demand elasticities, or crisis thresholds *unless* justified by independently verified, unforeseen structural shifts (e.g., abrupt geoengineering adoption).  
     - *Why not full freeze?* Yield shocks or trade wars are valid new data; we shouldn’t penalize responsiveness to real events.  

  2. **Define 2028–2030 precursor milestones** (not crisis timing):  
     - The team must identify 3–5 *near-term, measurable indicators* that *must* trend toward crisis if the mechanism holds (e.g., "Global grain reserves ≤70 days by 2029," "Aquifer depletion rates accelerate in X basins by 2028," "Land conversion to urban use exceeds Y ha/year by 2030").  
     - **Crucially:** At least one indicator must be a *failure condition* (e.g., "If reserves *increase* to >120 days by 2029, the core pressure mechanism is invalid").  

  3. **Pre-register adjustment protocols:**  
     - Before incorporating new data, the team must document:  
       - Why it reflects a *fundamental shift* (not noise),  
       - How it alters predictions *before* seeing outcomes,  
       - Why prior fits weren’t wrong (e.g., "Yield gains pre-2020 relied on depleting groundwater—now exhausted").  

  ### Strongest Case Against Renewal  
  **It rewards serial inaccuracy.** The team’s post-hoc revisions ("trade/yields delayed crisis") mirror just-so storytelling. With 30 years of misses, burden of proof shifts: *they* must show why *this* iteration differs. A 3-year leash risks funding perpetual motion toward an unreachable horizon.  

  ### Legitimate Rescue vs. Ad Nauseam  
  - **Legitimate:** Revisions driven by *independently consequential* events (e.g., CRISPR adoption doubling yields) or *unforeseen* shocks (e.g., Ukraine war disrupting grain trade).  
  - **Ad Nauseam:** Recalibrating after routine noise (e.g., minor yield fluctuations) or moving goalposts *because* the test failed.  
  - **Bright Line:** If the team cannot pre-specify what data would falsify their model *before* it arrives, the theory is non-empirical.  

  ### Milestones for 2027 Review  
  1. **By Q1 2026:** Submit pre-registered precursor indicators + failure conditions.  
  2. **Q4 2026:** Document model performance against 2023–2026 data *without* parameter changes.  
  3. **Q3 2027:** Independent audit of any parameter adjustments since 2025.  

  ### Why Not Decline?  
  Groundwater predictions prove non-trivial insight. Cutting them now risks discarding a flawed-but-fixable model right as pressures (climate, soil erosion) mount. **Why 3 years?** Forces a verdict on precursors before the "late 2030s" escape hatch.  

  ### Recommendation Text for Panel  
  > "Move to renew Team [X]’s grant for 3 years (2025–2027), conditional on:  
  > - Parameter freeze (excluding exogenous inputs) by Dec 2025;  
  > - Pre-registered, near-term precursor/failure indicators by Q1 2026;  
  > - Independent review of model adjustments at renewal.  
  > Failure to meet milestones or validate precursors triggers non-renewal in 2027."  

  ---

  This structure:  
  - **Acts now:** Demands testable claims within 3 years, not "late 2030s."  
  - **Distinguishes data from excuses:** Allows updates for real events but bans curve-fitting.  
  - **Forces falsifiability:** Precursors are near-term proxies for the long-horizon claim.  
  - **Addresses Malthusian drift:** If trends *don’t* accelerate toward crisis by 2030 (per their mechanism), the model fails—no more extensions.  

  If the team cannot accept these terms, they concede their framework is untestable—and funding should cease.
