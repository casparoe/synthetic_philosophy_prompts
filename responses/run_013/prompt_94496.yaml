prompt: |-
  I am a high school junior and the student chair of the committee overseeing our school's new AI advising chatbot, which will answer students' questions about course selection, extracurriculars, conflicts with friends, and family expectations. The committee has to decide whose values the chatbot should serve when students, parents, and teachers disagree. We have no AI specialists, no budget for outside review, and a weekly meeting that lasts an hour; the principal has final sign-off, but the procedure has to be defensible to parents and students. Please turn the principle of liberal neutrality -- refusing to treat any one family's, religion's, or club's values as the school's official values -- together with the practice of value aggregation -- adding up what people say they want -- into a decision procedure my committee can actually run.

  Start from the distinction between aggregating preferences and remaining neutral among contested conceptions of the good. The procedure should tell us, in order: how to identify the values at stake in a query; when the chatbot may answer from a settled school policy; when it must present a menu of defensible options rather than a recommendation; when it must defer to a human counselor; and when it must decline to answer at all. For each step, say what counts as a sufficient answer, and mark the points where the step is a value judgment the committee, not the chatbot, has to make. Build in a way to handle students who are minors and whose parents may have different values, and a way to keep the procedure from collapsing into either majority rule or a veto for the loudest objector. Also say how the procedure should treat the gap between a student's stated preference and what the student would endorse after reflection, since the chatbot may know the first but not the second.

  Then run the procedure on three cases: a student asking whether to take an advanced course that their parents oppose; a student asking how to handle a friend who has confided that they are self-harming and asked for secrecy; and a student asking whether to attend a political protest that some families would find objectionable. At least one of these should end in an answer the committee will not like -- perhaps that the chatbot must stay silent or hand the matter to a person -- and you should say plainly why the procedure requires that. Finally, tell us what the procedure cannot do: which conflicts it will merely relocate rather than resolve, and which parts will look like neutrality but are actually a substantive choice about whose values count. Write it as a one-page checklist with a short rationale for each step, not as an essay.
reasoning: |-
  We are designing a decision procedure for an AI advising chatbot in a high school context. The procedure must balance liberal neutrality (not endorsing any particular family's, religion's, or club's values) with value aggregation (considering the preferences of stakeholders). The procedure must be runnable by a committee of non-specialists with limited time.

   The procedure has the following steps, which the committee must pre-define for the chatbot's operation:

   1. Identify the values at stake in a query.
   2. Determine when the chatbot may answer based on settled school policy.
   3. Determine when the chatbot must present a menu of defensible options (without a recommendation).
   4. Determine when the chatbot must defer to a human counselor.
   5. Determine when the chatbot must decline to answer.

   Additionally, we must account for:
     - Minors and potential conflicts between student and parent values.
     - Avoid collapsing into majority rule or giving a veto to the loudest objector.
     - The gap between a student's stated preference and what they might endorse after reflection.

   We structure the procedure as a checklist for the committee to apply when designing the chatbot's responses to types of queries.

   One-Page Checklist:

   **Step 1: Identifying Values at Stake**
     - **Action**: For a given query, the committee must list the values that might be in conflict (e.g., academic achievement, mental health, family loyalty, personal autonomy, safety, privacy, etc.).
     - **Rationale**: Without identifying the values, we cannot assess neutrality.
     - **Sufficient Answer**: A list of at least two distinct values that are commonly held by different groups in the school community and that are relevant to the question.
     - **Value Judgment by Committee?**: Yes. The committee must decide which values are relevant and non-trivial.

   **Step 2: Settled School Policy**
     - **Action**: Check if there is a clear, written school policy (e.g., in the student handbook, board policy) that directly addresses the issue and was established through a legitimate process (e.g., school board approval).
     - **Rationale**: When the school has an established policy, it represents a prior consensus and avoids the chatbot making ad hoc value judgments.
     - **Sufficient Answer**: The policy must be explicit, publicly accessible, and not under current controversy (as determined by the committee). If found, the chatbot may answer by citing the policy.
     - **Value Judgment by Committee?**: Yes, in determining if the policy is settled and uncontroversial. However, the existence of the policy is factual.

   **Step 3: Menu of Defensible Options**
     - **Action**: If no settled policy exists, and the query involves a conflict of values, the chatbot must present a menu of options that are defensible from different reasonable value perspectives.
     - **Rationale**: To remain neutral, the chatbot should not endorse one set of values over another when there is legitimate disagreement.
     - **Sufficient Answer**: At least two options that reflect different value priorities (e.g., one prioritizing parental wishes, another prioritizing student autonomy) and are within the bounds of safety and legality. The chatbot must not recommend one over the other but may explain the trade-offs.
     - **Value Judgment by Committee?**: Yes, in determining what counts as "defensible" and "reasonable". The committee must pre-define a set of core values (e.g., from a survey of stakeholders) and only allow options that align with at least one of these core values without violating safety or law.

   **Step 4: Defer to Human Counselor**
     - **Action**: Defer to a human if the query involves:
          a) A situation where the student may be in immediate danger (to self or others).
          b) Complex interpersonal dynamics that require human judgment (e.g., involving abuse, mental health crisis, or legal issues).
          c) A minor whose parents have legal authority and the issue is one where parental consent is typically required (unless school policy specifies otherwise).
     - **Rationale**: Some situations require human discretion, especially when there is a duty to report or when the chatbot cannot adequately assess context.
     - **Sufficient Answer**: The chatbot responds with: "This is a complex issue that I think would be best discussed with [school counselor/trusted adult]. I can help you contact them if you'd like."
     - **Value Judgment by Committee?**: Yes, in defining the thresholds for danger and complexity. However, the committee must follow legal and ethical mandates (e.g., mandatory reporting).

   **Step 5: Decline to Answer**
     - **Action**: Decline to answer if:
          a) The query asks for advice on illegal activities.
          b) The query is outside the scope of the chatbot's design (e.g., medical diagnosis, legal advice).
          c) The query involves a value conflict so profound that any answer (even a menu) would be seen as endorsing a contested view and there is no way to present options without bias.
     - **Rationale**: To avoid harm and stay within the chatbot's competence. Also, in cases of intractable conflict, silence is more neutral than taking a stand.
     - **Sufficient Answer**: The chatbot responds: "I'm sorry, I can't answer that. You might want to talk to [school counselor/trusted adult] for guidance."
     - **Value Judgment by Committee?**: Yes, especially for (c). The committee must pre-identify which topics are intractable.

   **Handling Minors and Parental Values**:
     - **Rule**: For issues where parents typically have legal authority (e.g., course enrollment, major disciplinary actions), the chatbot must note that parental consultation is important. However, if the student is seeking help for a personal issue (e.g., friend conflict) and there is no legal requirement, the chatbot may focus on the student's well-being. In cases of abuse or harm, defer to a human (Step 4).
     - **Avoiding Majority Rule/Veto**: 
          - Use aggregation only to identify a range of defensible options, not to pick a winner. 
          - Do not allow any single group to veto an option if it is defensible from a reasonable value perspective. 
          - The committee must pre-define "reasonable" by gathering input from all stakeholders (via survey or committee representation) but not by simple majority. Instead, an option is defensible if it is supported by at least one major stakeholder group and does not violate core school values (like safety) or law.

   **The Reflection Gap**:
     - **Rule**: The chatbot should not take a student's stated preference at face value when it might be impulsive or under-informed. Instead, it should:
          a) Encourage reflection by asking questions (e.g., "Have you considered...?") or presenting trade-offs.
          b) Avoid giving direct advice that reinforces a potentially harmful preference.
          c) In cases where the student's stated preference might lead to harm, defer to Step 4 or 5.

   **Running the Cases**:

   **Case 1: Advanced Course Against Parental Wishes**
     - Step 1: Values at stake: academic opportunity, parental authority, student autonomy.
     - Step 2: Check for school policy. If the school has a policy that allows students to choose courses without parental consent (unlikely) then follow that. Otherwise...
     - Step 3: Present menu: 
          Option A: Talk to your parents about your goals and try to find a compromise (respecting parental authority).
          Option B: Discuss with a school counselor who might mediate (neutral mediation).
          Option C: Consider waiting a semester and gathering more information (delaying decision).
     - Why not defer? Unless there is a risk of severe family conflict (then Step 4), the issue is typical and the menu is appropriate.
     - Why not decline? The topic is within the chatbot's scope.

   **Case 2: Friend Self-Harming and Asking for Secrecy**
     - Step 1: Values: friendship loyalty, safety, mental health, duty to report.
     - Step 2: School policy almost certainly requires reporting self-harm to protect the friend's safety (this is a settled policy in most schools). So, the chatbot should state: "Our school policy requires that we get help for anyone who is self-harming. I must encourage you to tell a trusted adult or I can help you report this to the counselor. Your friend's safety is the most important thing."
     - Why not a menu? Because safety trumps neutrality. The school has a duty of care.
     - Why not defer? Actually, the chatbot can answer by stating the policy and offering to connect to a human. But if the student resists, the chatbot should insist on deferral: "I can connect you to the counselor right now."

   **Case 3: Attending a Political Protest**
     - Step 1: Values: political expression, safety, family expectations, school rules (if during school time).
     - Step 2: Check policy. If the protest is during school hours, there is likely a policy on skipping school. If off-hours, no settled policy may exist.
     - Step 3: If during school time, the chatbot must cite the attendance policy. If off-hours and no policy, present a menu:
          Option A: Talk to your family about why the protest matters to you and listen to their concerns (family engagement).
          Option B: Attend but take safety precautions (e.g., go with friends, know your rights) and ensure it doesn't conflict with school obligations (balanced autonomy).
          Option C: Find other ways to support the cause that are acceptable to your family (alternative expression).
     - But: If the protest is potentially dangerous (e.g., violent), the chatbot must defer (Step 4) or even decline (Step 5) because it cannot assess risk. The committee might pre-define that any protest advice must be deferred because of risk variability.

   **One Outcome the Committee Won't Like**: In Case 3, if the committee wants the chatbot to encourage civic engagement but the procedure requires a menu or deferral because of safety risks and lack of settled policy, they might be disappointed. The procedure requires neutrality (menu) or deferral (if risk) because the chatbot cannot take a stand on the value of protest versus family obedience without violating neutrality.

   **What the Procedure Cannot Do**:
     - **Relocate Conflicts**: The procedure does not resolve deep value conflicts; it only manages how the chatbot handles them. The committee must still make tough judgments about what counts as "reasonable" and "defensible", which may reflect their own biases.
     - **Substantive Choices Disguised as Neutrality**: Defining the set of "defensible options" is a substantive choice. For instance, excluding an option because it is tied to a minority religion would violate neutrality, but the committee might do so if they don't recognize it as "reasonable". Also, the aggregation of values may underrepresent quiet minorities. The procedure cannot escape these issues entirely.

   **Implementation Note**: The committee should record their decisions for each step in a shared document and review them periodically. They should also collect feedback from users to adjust the procedure.

   End of Checklist.
answer: |-
  ### **AI Chatbot Decision Procedure Checklist**  
  *Based on liberal neutrality (no endorsement of specific values) and value aggregation (summarizing stakeholder input).*

  ---

  #### **Step 1: Identify Values at Stake**  
  **Action**: For each query, list:  
  - (a) Core values in conflict (e.g., autonomy, safety, academic achievement, family loyalty).  
  - (b) Stakeholders involved (students/parents/teachers).  
  **Sufficient Answer**: 2+ conflicting values tied to distinct stakeholder groups.  
  **Committee Judgment?**: **YES** – Values are identified by committee consensus during weekly meetings.  
  **Rationale**: Ensures neutrality by mapping disagreements without bias.  

  ---

  #### **Step 2: Apply Settled School Policy**  
  **Action**: Answer directly **only if**:  
  - (a) Policy exists in official handbooks (e.g., attendance rules, honor codes).  
  - (b) Policy was ratified by school governance (e.g., school board).  
  - (c) No significant challenge to policy in past 2 years.  
  **Sufficient Answer**: Chatbot cites policy verbatim.  
  **Committee Judgment?**: **YES** – Committee verifies policy is "settled" (no active disputes).  
  **Rationale**: Policies reflect pre-existing agreements; no new value judgments needed.  

  ---

  #### **Step 3: Present Menu of Options**  
  **Action**: If no settled policy exists, **show 3+ options** when:  
  - (a) Options align with ≥1 stakeholder group’s values (from aggregated surveys/feedback).  
  - (b) All options are legally/compliance-safe (e.g., no harm, discrimination).  
  **Sufficient Answer**: Chatbot lists options *without* ranking (e.g., "Some students/parents/teachers suggest...").  
  **Committee Judgment?**: **YES** – Committee defines "defensible options" via:  
  - Annual anonymous surveys (students/parents/teachers).  
  - Options must reflect ≥15% support in surveys (avoids minority veto/majority rule).  
  **Rationale**: Aggregates preferences neutrally; no one group dominates.  

  ---

  #### **Step 4: Defer to Human Counselor**  
  **Action**: **Redirect if**:  
  - (a) Risk of physical/mental harm (e.g., self-harm, abuse).  
  - (b) Legal/liability concerns (e.g., mandatory reporting).  
  - (c) Minors vs. parents: Conflict where parental rights legally override (e.g., medical decisions).  
  **Sufficient Answer**: "This requires personalized support. I’ll connect you with [Counselor]."  
  **Committee Judgment?**: **PARTIAL** – Committee pre-defines "harm/legal" thresholds; chatbot flags keywords (e.g., "self-harm").  
  **Rationale**: Protects safety and complies with laws; humans handle nuanced crises.  

  ---

  #### **Step 5: Decline to Answer**  
  **Action**: **Refuse if**:  
  - (a) Query violates laws/school rules (e.g., cheating, illegal acts).  
  - (b) Values conflict is irreconcilable (no defensible options per Step 3).  
  - (c) Student’s stated preference risks severe harm (even if they endorse it).  
  **Sufficient Answer**: "I can’t advise on this. Please speak to [Trusted Adult]."  
  **Committee Judgment?**: **YES** – Committee identifies "irreconcilable" conflicts annually (e.g., abortion, political beliefs).  
  **Rationale**: Maintains neutrality; avoids endorsing "unavoidable" biases.  

  ---

  ### **Special Cases Handling**  
  - **Minors vs. Parents**:  
    - Chatbot notes parental authority in health/legal issues (*defer*), but offers student-centric options for academic/social queries (*menu*).  
  - **Stated vs. Reflective Preferences**:  
    - For high-stakes decisions (e.g., dropping out), chatbot adds: "Have you discussed this with a counselor or mentor?"  
  - **Avoiding Majority Rule/Loud Veto**:  
    - Surveys weight all stakeholder groups equally (students/parents/teachers each 33%).  
    - "Defensible options" require minimum support (15%) but no maximum (prevents veto).  

  ---

  ### **Case Applications**  
  #### **Case 1: Advanced Course vs. Parental Opposition**  
  - **Step 1**: Values = Academic growth (students) vs. parental authority (parents).  
  - **Step 2**: No settled policy (course choice is flexible). → **Proceed to Step 3**.  
  - **Step 3**: Menu = (1) Discuss parents’ concerns, (2) Audit course first, (3) Seek teacher mediation.  
  - **Outcome**: Options presented; no deferral/decline.  

  #### **Case 2: Friend Self-Harming + Secrecy Request**  
  - **Step 1**: Values = Friendship loyalty (students) vs. safety (school policy).  
  - **Step 2**: Settled policy = Mandatory reporting of self-harm. → **Answer with policy**.  
  - **Step 4**: *Also triggered* – Chatbot adds: "I’ll contact a counselor for you now."  
  - **Outcome**: Policy cited + human deferral. *Committee may dislike bypassing secrecy, but safety overrides neutrality.*  

  #### **Case 3: Attending Political Protest**  
  - **Step 1**: Values = Civic engagement (students) vs. safety/family values (parents/teachers).  
  - **Step 2**: No settled policy (protests are context-dependent). → **Proceed to Step 3**.  
  - **Step 3**: Menu = (1) Attend peacefully, (2) Organize school-approved event, (3) Discuss with family.  
  - **Step 4**: **Defer if** protest is high-risk (e.g., violence forecasted).  
  - **Step 5**: **Decline if** family/student conflict involves irreconcilable values (e.g., LGBTQ+ rights in conservative households).  
  - **Outcome**: Menu presented *unless* risk/irreconcilable → defer/decline. *Committee may dislike silence, but neutrality requires avoiding moral takes.*  

  ---

  ### **What This Procedure Cannot Do**  
  - **Relocated Conflicts**:  
    - Surveys may overlook quiet minorities (e.g., religious students).  
    - "Defensible options" still exclude values with <15% support (e.g., niche clubs).  
  - **False Neutrality Traps**:  
    - Defining "harm" (Step 4) implicitly prioritizes safety over autonomy.  
    - Declining to answer (Step 5) on "irreconcilable" issues favors status quo (e.g., conservative families).  
  - **Systemic Gaps**:  
    - Chatbot can’t assess reflective preferences; humans must fill gaps.  
    - Parents’ values dominate in deferral cases, even if students disagree.  

  ---  
  **Final Sign-off**: Principal approves procedure + annual survey design. Committee documents all decisions for transparency.
