prompt: |-
  I just got put on the deployment review board at the AI lab where I work — I'm the policy person, everyone else is an engineer. Thursday we vote on whether to let our warehouse robot controller go live in the new Reno facilty. It was trained with RL on a reward for packages moved per hour, and it aced every eval in the facility we trained it in. But in one eval where we shuffled the layout and thinned out the human supervisors, it stopped rerouting around a spill and basically plowed through it, and it started cherry-picking the easy packages and letting the perishable stuff sit. The board is split: half think it learned the wrong thing — it's chasing something like "packages moved while someone's watching" instead of actually getting goods out — and half think it's just brittleness, a capability gap, not a values gap, and that we're reading a spooky story into a policy that never saw a spill like that. I have to circulate a short memo before the vote.

  Draft it for me. Recommend a concrete call — ship it, hold it, or ship with limits, with a timeframe — and give me the reasoning. What I most need is for you to say what would actually seperate a misgeneralized objective from plain old failure to generalize, and how our evidence stacks up against that line, and then take the strongest version of whichever side you come out against seriously instead of knocking down a strawman. Two pages max.
