answer: |-
  Below is a decision tree for theories of vagueness, structured as an indented flowchart. It starts from shared intuitions (e.g., "no single grain makes the difference," "no sharp boundaries") and uses concrete cases (heaps, color shades, height steps) to guide students to specific positions. Internal nodes pose questions about cases or commitments; leaves name a theory, its core tenet, and a key objection. The tree has **10 nodes** and **9 leaves**, covering all requested views. Combinations are noted where unoccupied, and identical leaves from different paths are marked.  

  ### Decision Tree for Theories of Vagueness  
  **Start at Node 1.**  

  1. **In the heap paradox, does "one grain never makes a difference" express a rule of meaning (e.g., part of what "heap" means), or a pragmatic habit (e.g., when it’s safe to call something a heap)?**  
     - **Meaning rule** → Node 2  
     - **Pragmatic habit** → Node 9  

  2. **Is vagueness due to how language relates to the world, or to our psychological categorization (e.g., prototypes, similarity)?**  
     - **Language/world relation** → Node 3  
     - **Psychological categorization** → Leaf 9: **Psychological View**  
       - *Core tenet*: Vagueness arises from cognitive mechanisms (e.g., graded similarity to prototypes), not semantic indeterminacy.  
       - *Key objection*: Fails to explain why vague predicates feel normative (e.g., why we can’t arbitrarily redefine "bald").  

  3. **When we say "there is no sharp line," does this mean no cut-off exists, or that it exists but is elusive (unknowable, shifting, etc.)?**  
     - **No cut-off exists** → Node 4  
     - **Cut-off exists but is elusive** → Node 6  

  4. **In a forced march (sorting every shade from red to orange), what happens at borderline cases?**  
     - **We can refuse to assign "true" or "false"** → Node 5  
     - **We must assign a truth value (even arbitrarily)** → *Vacant*: Incoherent if no cut-off exists. Forcing a choice implies a cut-off.  

  5. **Can it be borderline whether something is borderline (e.g., is there second-order vagueness)?**  
     - **Yes** → Leaf 1: **Supervaluationism**  
       - *Core tenet*: A predicate’s meaning is fixed by a range of admissible precisifications; borderline cases are **neither true nor false** (truth = supertruth across all precisifications).  
       - *Key objection*: Commits to sharp boundaries between admissible/non-admissible precisifications, recreating vagueness at a higher level.  
     - **No** → Leaf 2: **Subvaluationism**  
       - *Core tenet*: A predicate’s meaning is fixed by a range of admissible precisifications; borderline cases are **both true and false** (truth = truth in some precisification).  
       - *Key objection*: Violates non-contradiction (e.g., "Patch is red and not red" is true), leading to implausible logical consequences.  

  6. **What makes the cut-off elusive?**  
     - **In principle unknowable** → Leaf 3: **Epistemicism**  
       - *Core tenet*: There is a **sharp but unknowable** cut-off (e.g., a specific hair count for baldness); vagueness is ignorance.  
       - *Key objection*: Intuitively absurd—why *can’t* we know, even with perfect measurement?  
     - **Shifts with context** → Leaf 4: **Contextualism**  
       - *Core tenet*: Extension **shifts with context** to avoid sharp lines; the tolerance premise means something different at each step.  
       - *Key objection*: In forced marches, context shifts seem arbitrary or ad hoc (e.g., why does sorting shade #42 change the meaning of "red"?).  
     - **Exists in the world itself (not just language/knowledge)** → Leaf 5: **Ontic Vagueness**  
       - *Core tenet*: Vagueness is **metaphysical**; reality itself is indeterminate (e.g., no fact about whether a cloud has exact boundaries).  
       - *Key objection*: Obscure how indeterminacy "in the world" works without language or minds.  

  7. **For the sorites argument, is the tolerance premise best formulated as a universal claim ("∀n: if P(n) then P(n+1)") or a long chain ("P(1)→P(2), P(2)→P(3), ...")?**  
     - **Universal claim** → Node 8  
     - **Long chain** → *Vacant*: All views handle both, but degree theory (Leaf 6) works better for chains.  

  8. **In borderline cases (e.g., a 179cm adult), is "tall" neither true nor false, or partly true?**  
     - **Neither true nor false** → *Same as Leaf 1 (Supervaluationism)*  
     - **Partly true (e.g., 0.6 true)** → Leaf 6: **Degree Theory**  
       - *Core tenet*: Truth comes in **degrees** [0,1]; vagueness is continuous (e.g., "heap" has partial truth for borderline heaps).  
       - *Key objection*: Forced marches force arbitrary thresholds (e.g., why 0.5?), creating new sorites problems for degrees.  

  9. **Does the pragmatic habit reflect a norm of communication, or a flaw in how we use language?**  
     - **Norm of communication** → Leaf 7: **Norm of Assertion View**  
       - *Core tenet*: Tolerance expresses a **norm of assertion** (don’t assert tiny differences matter), not truth-conditions.  
       - *Key objection*: Doesn’t resolve truth-value gaps in borderline cases (e.g., what *is* true when we shouldn’t assert?).  
     - **Flaw in language use** → Leaf 8: **Deflationary View**  
       - *Core tenet*: Vague words are **approximations**; the paradox misrepresents their function by demanding precision.  
       - *Key objection*: Fails to explain why we can’t stipulate precise definitions without changing the subject.  

  10. **Is the problem with classical logic (e.g., bivalence) itself?**  
      - **Yes** → *Same as Leaf 6 (Degree Theory) or Leaf 1 (Supervaluationism)*  
      - **No** → *Vacant*: All non-classical views (e.g., Leaf 1, 2, 6) reject classical logic; epistemicism (Leaf 3) retains it.  

  ---

  ### Notes on Unoccupied Combinations & Identical Leaves  
  - **Vacant combinations**:  
    - Node 4 → "Must assign truth value" + "No cut-off" is incoherent (assigning a value implies a cut-off).  
    - Node 7 → Long chain formulation doesn’t split views; all theories address it.  
    - Node 10 → "Problem with classical logic" + "No" leads only to epistemicism (Leaf 3), already covered.  
  - **Identical leaves from multiple paths**:  
    - Supervaluationism (Leaf 1) reached from Node 5 ("Yes" to second-order vagueness) and Node 8 ("Neither true nor false").  
    - Degree theory (Leaf 6) reached from Node 8 ("Partly true") and Node 10 ("Yes" to problem with classical logic).  

  ---

  ### Closing: My View  
  I defend **supervaluationism** (Leaf 1). It best explains why we reject sharp boundaries while preserving classical logic for clear cases. Its strongest objection is **higher-order vagueness**: if precisifications have sharp boundaries, what makes *them* vague? This risks regress or artificiality.
