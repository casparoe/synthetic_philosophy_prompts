  3. **Reflection-Based Stopping Rule:** If p_efficacy meets or exceeds a high confidence threshold (e.g., ≥0.90), stop for efficacy now, as the reflection principle mandates aligning current decisions with anticipated future beliefs; similarly, if p_futility meets or exceeds the confidence threshold, stop for futility.  
