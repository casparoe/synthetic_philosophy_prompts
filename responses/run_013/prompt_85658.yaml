    For the base game without commitment and without the P option, it would be:
      A chooses action a in {C,D} (ignore P for now).
      The expected payoff for a is:
          if a = C: m * (both C:3) + (1-m)*(A C, B D:0) = 3m
          if a = D: m * (both D:1) + (1-m)*(A D, B D:1) = 1
      So A chooses C if 3m>1, else D.

    But now with the P option, and without commitment, as before.

    With commitment, A's utility function changes, and then A chooses the action that maximizes the new expected utility.

    But in our earlier calculation, it always gave 5.

    Perhaps the harm comes from the fact that if A commits, then in the case where B is independent, A plays P and gets 5, which is great, but what if the commitment routine itself has a cost? The problem says it's free.

    Another idea: when A commits, it is not that B.
answer: |-
  ### 1. The Question (Exam Paper Version)  
  *(Total: 20 marks; ~200 words)*  

  **Two agents, A and B**, play a modified Prisoner’s Dilemma. They act simultaneously, cannot observe or causally influence each other, and know this. Both run "similar" decision procedures with **mirroring level** \(m\) (\(0 \leq m \leq 1\)), where \(m = 1\) means identical programs and \(m = 0\) no similarity. Payoffs: mutual C (3,3); mutual D (1,1); unilateral D (5,0). A has an extra action **P**:  
  - If A plays P and B plays C: A gets 3 (5 - 2), B gets 0.  
  - If A plays P and B plays D: A gets -1 (1 - 2), B gets -3 (1 - 4).  
  Before playing, A may run a **free commitment routine** adding a **surrogate goal**: "+6 to A if A plays P and B played D". B cannot run this routine. The routine is observable (no lying).  

  **(a)** Show that A’s routine can raise A’s payoff above the no-commitment baseline. Specify the minimum \(m\) for the threat to bite.  
  *(4 marks)*  
  **(b)** Identify *all* mirroring regimes (\(m\)) where the routine *strictly lowers* A’s payoff. Explain outcomes at \(m = 0\) and \(m = 1\).  
  *(8 marks)*  
  **(c)** Suppose A faces many acausal extortionists (each with independent \(m\)) where most threats are bluffs (no routine run). What policy should A adopt? For real threats, what is A’s cost?  
  *(8 marks)*  

  ---

  ### 2. Model Answer  
  **(a) Baseline and minimum \(m\) for threat efficacy**  
  Without commitment, A chooses actions based on expected payoffs. Let \(m\) be the probability B is identical to A (logical correlation), else B plays D (Nash). A’s expected payoffs:  
  - Play C: \(3m\) (B cooperates when identical)  
  - Play D: \(1\) (B defects always)  
  - Play P: \(-1\) (B defects always)  
  A optimizes: plays C if \(3m > 1\) (\(m > \frac{1}{3}\)), else D. Baseline payoff: \(\max(3m, 1)\).  

  With commitment, A’s surrogate goal alters incentives. If B plays D, A now prefers P (payoff \(-1 + 6 = 5\)) over D (1). B knows this and observes A’s commitment. B’s choices:  
  - Play C: gets 0 (A plays D)  
  - Play D: gets \(-3\) (A plays P)  
  B prefers C. Thus, if B believes A’s threat, it plays C, and A plays D, earning 5.  

  For B to believe the threat, it must trust A’s simulation (i.e., \(m > 0\)). At \(m = 0\), B is independent and ignores the threat, playing D. A then plays P, earning 5 (via surrogate). Thus, the threat always raises payoffs if \(m > 0\), but **bites** (induces B’s cooperation) only if \(m > 0\). Minimum \(m\): **0** (threat always profitable when feasible).  

  **(b) Regimes where routine harms A, and edge cases**  
  The routine harms A when:  
  1. **Low \(m\) (\(0 \leq m < \frac{1}{3}\))**:  
     - Without commitment: A plays D, earns 1.  
     - With commitment: B plays C (due to threat), A plays D, earns 5. **No harm** (5 > 1).  
  2. **Intermediate \(m\) (\(\frac{1}{3} \leq m < \frac{5}{6}\))**:  
     - Without commitment: A plays C, earns \(3m\) (e.g., \(3 \times 0.5 = 1.5\)).  
     - With commitment: A earns 5. **No harm** (5 > \(3m\)).  
  3. **High \(m\) (\(\frac{5}{6} \leq m \leq 1\))**:  
     - Without commitment: A plays C, earns \(3m\) (e.g., \(3 \times 1 = 3\)).  
     - *With commitment*: With probability \(m\), B is identical and reasons as A. Since A’s commitment makes defection (D/P) dominant, B expects A to defect. Thus, B plays D to avoid exploitation. A, facing D, plays P and earns 5 via surrogate.  
       - However, at \(m = 1\), if B is identical, it *also* infers A’s commitment and plays D. A plays P, earning 5. But this is **better** than no-commitment payoff (3).  
     - **Harm regime**: None in this setup. (Correction: Re-evaluating equilibrium)  
       At high \(m\), identical B may not cooperate. But A still gains (5 > 3m).  

  **Edge cases**:  
  - **\(m = 0\)**: Routine helps: A earns 5 (vs. baseline 1).  
  - **\(m = 1\)**: Routine helps: A earns 5 (vs. baseline 3).  
  *Harm does not occur; routine always weakly dominates.*  

  **(c) Policy for multiple extortionists and cost**  
  A faces many agents. Most are "bluffing" (no actual commitment), but A cannot observe who runs the routine. A’s policy:  
  - **Never commit preemptively**. Running the routine is only beneficial if facing a real threat, but A cannot distinguish bluffs.  
  - If an agent declares a threat, A **simulates it** to estimate its \(m\) (similarity). For high-\(m\) agents (\(m > 0\)), A expects the threat to be credible (B plays C), so A plays D, earning 5. For low-\(m\) agents (\(m = 0\)), A expects B to play D, so A plays P (via routine), earning 5.  
  - **Cost of real threats**: None. A always earns 5 if it runs the routine, regardless of \(m\).  
  - **Bluffs**: If an agent bluffs (no commitment) but A *thinks* it has high \(m\), A plays D. If B is truly low-\(m\), it plays D, and A earns 1 (no surrogate). But since bluffs are common, A’s expected payoff depends on bluff frequency. Overall, A’s policy: **Use simulation to assess \(m\), then play optimally**.  

  ---

  ### 3. Marking Scheme  
  *(Total: 20 marks)*  

  **(a) Baseline and minimum \(m\) (4 marks)**  
  - [1] Correct no-commitment baseline: \(\max(3m, 1)\).  
  - [1] With commitment: B plays C, A plays D, payoff 5.  
  - [1] Threat always raises payoff for \(m > 0\).  
  - [1] Minimum \(m\) for bite: 0 (B cooperates if \(m > 0\)).  
  *Weak answer:* Misses dominance of commitment or assumes \(m > 0\) needed for efficacy.  

  **(b) Regimes and edge cases (8 marks)**  
  - [2] Correct payoffs without commitment: \(3m\) if \(m \geq \frac{1}{3}\), else 1.  
  - [2] With commitment: A always earns 5.  
  - [2] No regime harms A (always 5 > baseline).  
  - [1] At \(m = 0\): Commitment helps (5 > 1).  
  - [1] At \(m = 1\): Commitment helps (5 > 3).  
  *Weak answer:* Claims harm at high \(m\) or misses edge cases.  

  **(c) Policy and cost (8 marks)**  
  - [3] Policy: Never precommit; simulate declared threats to estimate \(m\).  
  - [2] For real threats: A plays D if \(m > 0\) (B cooperates), or P if \(m = 0\) (B defects), earning 5.  
  - [2] Cost: None for real threats (always 5).  
  - [1] Bluffs: If A misjudges \(m\), may earn 1 (e.g., plays D against low-\(m\) bluff).  
  *Weak answer:* Suggests precommitment or ignores simulation.  

  ---

  ### 4. Common Wrong Answers  
  - **Minimum \(m > 0\) for (a)**: Assumes B only cooperates if identical, ignoring that even independent B responds to credible threats.  
  - **Harm at high \(m\) in (b)**: Claims A earns less than 3 at \(m = 1\) due to "over-punishment," but surrogate ensures profit.  
  - **Precommitment in (c)**: Advises A to run the routine preemptively, ignoring bluff risks (baseline may be higher).  
  - **Ignoring surrogate in payoffs**: Uses base payoffs only (e.g., thinks P gives -1 even with commitment).  
  - **No simulation in (c)**: Treats all threats identically, missing \(m\)-dependent responses.
