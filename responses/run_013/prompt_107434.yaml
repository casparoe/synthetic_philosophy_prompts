prompt: |-
  Last night a friend and I argued about composition until nearly two in the morning, and we got nowhere. She holds the unrestricted view: any things whatsoever compose a further thing, so there is an object whose parts are the Eiffel Tower and my left shoe. I could not accept that, but when I tried to say when things do compose something, I found I was going on feel rather than on principle. I would like you to tell me what principle, if any, my verdicts amount to. I am not asking for a survey of what has been written on the question; I want the principle, stated precisely enough that I can test it. I would rather be told that my verdicts are inconsistent than be handed a principle that saves them by brute force.

  Here are my verdicts, as plainly as I can put them.

  1. A cat asleep on the windowsill. One object. Whatever composition is, it had better deliver cats.
  2. Two LEGO bricks pressed together until the studs snap. One object; something came into being at the snap, and I can pick the pair up as a single item.
  3. The same two bricks lying side by side, touching but not snapped. Two objects. Mere contact adds nothing.
  4. A dry-stone wall, no mortar, the stones stacked so that each holds the next in place. One object. If someone said they would move the wall, I would not take them to have said they would move several hundred objects and no wall.
  5. The same stones in a heap where they fell. Not one object. This troubles me, because the difference between the wall and the heap is arrangement, and I am not sure arrangement is enough to make a thing.
  6. A lichen on a rock, a fungus and an alga living as a single crust. One object. Two organisms, one thing.
  7. A clownfish living in a sea anemone. Two objects, not one, though neither thrives without the other. I cannot say what separates this from the lichen except that the lichen looks like one thing and these look like two, which is no principle at all.
  8. A sandcastle, dry or damp. One object. I will not give this up, and I know it sits badly beside the heap of stones.
  9. A traffic jam. One thing: it has a place, a cause, a beginning and an end, and it creeps backwards up the motorway. Yet it is not composed of its cars, since the cars that caused it are long gone and it outlives them.
  10. A murmuration of starlings at dusk. Not one object. A pattern, and a lovely one, but nothing new has come into being. This sits badly beside the traffic jam, and I suspect the only difference is that I find one of them interesting.
  11. A bronze statue. One object. I do not believe the statue and the lump of bronze are two objects sharing a place; they are one object under two descriptions.
  12. A ship whose planks are replaced one at a time until none of the original timber remains. The same ship. If the discarded planks are later reassembled into a ship-shaped thing, that is a replica, not the ship.
  13. Two strangers standing in a lift. Two objects. If one is holding the other up because the other is unsteady, still two objects; help is not composition.

  My best attempt at a principle was this: parts compose something when they act together as one. That is plainly too vague, since on one reading it admits the sandcastle and the lift and on another it excludes them, and I would like to know whether it can be made precise without collapsing.

  Please answer in six sections, in this order, at roughly these lengths.

  1. The shape of my verdicts (about 150 words): what pattern the verdicts suggest, and which of them sit badly with which.
  2. Candidate principles (about 500 words): two or three principles, each stated precisely enough to apply, each with the verdicts it gets right and the ones it fails.
  3. Repairs (about 350 words): take the most promising candidate and revise it to handle its failures, or say why the failure is fatal.
  4. Cases I did not list (about 300 words): what the surviving principle or principles say about new cases, including at least two cases chosen to separate the survivors from one another.
  5. What I have to give up (about 150 words): the verdicts of mine that no acceptable principle can keep.
  6. Bottom line (about 120 words): the principle I should adopt, and the verdict I should abandon along with it.
reasoning: |-
  Hmm, the user presents a classic metaphysical puzzle about composition - when do parts form a whole? They've given 13 concrete judgments about various scenarios, from cats to traffic jams, showing clear intuitions but struggling to find a consistent principle. Their frustration with "going on feel rather than principle" resonates - this is exactly what puzzles metaphysicians.

  The core tension in their judgments seems to be between functional unity and arbitrary aggregation. They accept structured unities (cat, LEGO assembly, wall) but reject mere collections (stones in heap, strangers in lift). Yet contradictions emerge: sandcastle is accepted while stone heap rejected, traffic jam accepted while murmuration rejected - suggesting aesthetic bias.

  Their proposed "act together as one" principle has potential but needs refinement. The key might be distinguishing causal interdependence from mere co-location. For the lichen (accepted) there's biochemical symbiosis creating a new metabolic entity, whereas clownfish (rejected) merely occupy space together. Similarly, a functioning sandcastle maintains structural integrity through friction/dampness, unlike a random stone heap.

  But problems persist. The traffic jam case challenges any spatial/temporal boundedness requirement since it's an emergent pattern without fixed parts. And the ship of Theseus forces us to confront identity versus composition - if composition is about current part-relations, how does identity persist through part replacement?

  The statue/lump case suggests they lean toward constitution theory rather than co-location. This might be key - perhaps composition creates a new entity with distinct modal properties from its matter. The lump could survive melting, the statue couldn't.

  For the bottom line: a principle emphasizing functional integration and causal interdependence seems most salvageable, but they'll need to surrender the traffic jam verdict or radically reconceive it as an event rather than an object. The murmuration/sandcastle inconsistency may require acknowledging aesthetic intuition's role or finding a structural persistence criterion.
answer: |-
  ### 1. The Shape of My Verdicts  
  Your verdicts prioritize functional unity and stability over mere aggregation or temporary interaction. You consistently accept objects where parts are integrated into a persistent structure with a unified function or identity (cat, snapped LEGOs, wall, lichen, sandcastle, statue, ship). You reject mere spatial proximity without integration (separate LEGOs, stone heap, strangers in lift) or dynamic patterns lacking physical cohesion (murmuration). Key tensions:  

  - **Sandcastle (accepted) vs. Stone Heap (rejected)**: Both are loose aggregates, but you grant unity to the arranged form.  
  - **Traffic Jam (accepted) vs. Murmuration (rejected)**: Both are emergent, dynamic patterns, but you assign objecthood only to the former.  
  - **Lichen (accepted) vs. Clownfish/Anemone (rejected)**: Both involve symbiosis, but only the lichen’s physical fusion qualifies.  

  Your judgments rely on *integration* and *practical identity* but waver on whether arrangement alone suffices (wall vs. heap) or whether patterns count (traffic jam vs. murmuration).  

  ---

  ### 2. Candidate Principles  
  **Principle A: Functional Integration (FI)**  
  *Parts compose an object iff they are causally interdependent in sustaining a stable structure or function that persists without external intervention.*  

  - **Fits**:  
    - Cat (biological unity).  
    - Snapped LEGOs (mechanical interdependence).  
    - Wall (structural cohesion).  
    - Lichen (symbiotic fusion).  
    - Statue/Ship (functional artifact identity).  
  - **Fails**:  
    - Sandcastle (no inherent function/interdependence; collapses easily).  
    - Traffic Jam (external cause, no stable structure).  
    - Clownfish/Anemone (mutualism ≠ structural fusion; FI excludes them correctly, but you accept lichen).  
    - Strangers in lift (no functional unity).  

  **Principle B: Causal Unity (CU)**  
  *Parts compose an object iff their collective behavior generates novel causal powers not reducible to individual parts.*  

  - **Fits**:  
    - Cat (emergent biology).  
    - Snapped LEGOs (new rigidity).  
    - Traffic Jam (emergent property: backward creep).  
    - Lichen (novel symbiotic metabolism).  
  - **Fails**:  
    - Wall (causal powers reducible to stone contacts).  
    - Sandcastle (no novel powers beyond sand).  
    - Murmuration (emergent pattern, but you reject it).  
    - Strangers in lift (no collective power).  

  **Principle C: Practical Cohesion (PC)**  
  *Parts compose an object iff they are treated as a single entity in everyday contexts (e.g., naming, manipulation, persistence).*  

  - **Fits**:  
    - Cat, Wall, Sandcastle (common-sense unities).  
    - Statue/Ship (artifacts with identity).  
    - Traffic Jam ("it creeps").  
  - **Fails**:  
    - Snapped LEGOs (you accept them, but PC may not distinguish from unsnapped).  
    - Lichen vs. Clownfish (PC inconsistently applied).  
    - Murmuration (not treated as an object).  
    - Heap of stones (PC might accept it, but you reject).  

  ---

  ### 3. Repairs  
  **Focus: Functional Integration (FI)**. It best captures your core cases but struggles with sandcastles and traffic jams.  

  - **Repair for Sandcastle**: Add a *stability threshold*. Revised FI:  
    *Parts compose an object iff (i) they are causally interdependent in sustaining a stable structure/function, and (ii) the structure persists under minor perturbations (e.g., wind, light touch).*  
    - **Sandcastle**: Fails (ii) — unstable if dry, dampness is temporary.  
    - **Wall**: Succeeds (interlocking stones resist shifts).  
    - **LEGOs**: Succeeds (snaps resist separation).  

  - **Repair for Traffic Jam**: FI cannot salvage this. Traffic jams lack intrinsic stability or function; they are ephemeral patterns dependent on external factors (e.g., road capacity). To keep FI, you must abandon verdict 9.  

  - **Clownfish/Anemone**: FI correctly excludes them (no structural fusion), aligning with your verdict. Lichen passes due to biochemical integration.  

  **Result**: Revised FI handles sandcastles but not traffic jams. The latter’s failure may be fatal to your verdicts’ consistency.  

  ---

  ### 4. Cases I Did Not List  
  **Case 1: A Forest**  
  - **FI**: Yes — trees interdependent via ecosystems (nutrient cycles, microclimate).  
  - **PC**: Yes (named, managed as one).  
  - **CU**: Debatable (novel powers like flood prevention?).  

  **Case 2: A Hurricane**  
  - **FI**: No — parts (air, moisture) not structurally integrated.  
  - **CU**: Yes — emergent destructive power.  
  - **PC**: No — not treated as a *thing* (e.g., "hurricane" refers to an event).  

  **Case 3: A Fictional Character (e.g., Sherlock Holmes)**  
  - **FI/PC/CU**: No — no physical parts to unify. Tests your rejection of "patterns."  

  **Case 4: A Pile of Salt Grains**  
  - **FI**: No — no interdependence.  
  - **PC**: Maybe (if scooped as one), but you’d likely reject (like stone heap).  

  **Case 5: A Symbiotic Coral Reef (algae + polyps)**  
  - **FI**: Yes — integrated structure/function (cf. lichen).  
  - Distinguishes from clownfish (no fusion).  

  ---

  ### 5. What I Have to Give Up  
  To adopt a consistent principle, surrender:  
  - **Traffic Jam (9)**: It is an event, not an object. CU might save it but clashes with murmuration (10).  
  - **Sandcastle (8)**: Fails stability. If kept, it forces acceptance of heaps (5), which you reject.  
  - **Murmuration (10)**: If traffic jam is an object, murmuration must be too — but you must reject both or neither.  
  - **Statue/Lump (11)**: FI treats them as one object, but metaphysicians argue they share space with different persistence conditions (e.g., lump survives melting). You must either accept co-location or redefine "object."  

  ---

  ### 6. Bottom Line  
  **Adopt Functional Integration with Stability**:  
  *Parts compose an object iff (i) they are causally interdependent in sustaining a unified structure or function, and (ii) the structure is stable under minor perturbations.*  

  **Abandon the Traffic Jam verdict (9)**. It is an ephemeral pattern, not an object. This principle preserves cats (1), LEGOs (2–3), walls (4), lichen (6), statues (11), and ships (12), while excluding heaps (5), clownfish (7), murmurations (10), and strangers (13). Sandcastles (8) fail stability, forcing you to reject them or weaken the principle — but doing so collapses into arbitrariness. The cost is surrendering your intuition about traffic jams, but this restores coherence.
