prompt: |-
  My officemates Maya and Dev have been going at each other for about a week over whether our lab should decide things by majority vote of the whole group instead of just deferring to whoever's the relevant expert. It started because we had to pick between two rival explanations for a wierd result, our PI went with the senior student's call, and it turned out to be wrong. Maya's case is that this is exactly what the Condorcet jury theorem is for: if every member is more likely than not to get the call right, a majority is more likely to be right than any single one of them, and the more people the better, so with twelve of us at, say, 70% each the majority should be right about 99% of the time and we'd be idiots not to vote. Dev says that only holds if everyone's errors are independent, and ours obviously aren't — we read the same papers, share the same advisor, and last term we all got fooled by the same artifact. Their errors come in bunches, he says, and bunched errors don't average out, so the 99% is a fantasy and adding more people to a group that's already wrong together just makes the wrong answer sound more authoritative. Maya came back that correlation isn't all-or-nothing — unless the errors are perfectly correlated, more voters still help, just less, and the theorem is an idealization like a frictionless plane; you don't throw out the baseline because reality has friction. Dev said in this case the friction is the whole phenomenon, and anyway there's a nastier problem: the theorem only tells you the majority converges on the truth if each member is better than a coin flip, but being better than a coin flip is precisely what a group with a shared blind spot cannot know about itself. He added that the theorem assumes there's a fact of the matter and only two options on the table, and our last call was a judgment call among four projects, so it doesn't even get off the ground. Maya said plenty of our decisions do have a right answer, and she'd rather have a procedure with a real accuracy edge than one that hinges on whether the senior student happens to be the one who's actually right. Neither will budge, and honestly I've stopped following who's winning. I have a feeling the 99% number is off but I can't do the binomial in my head.

  Can you referee this properly? Go move by move — who's right about the arithmetic and what the correct figure actually is, whether the independence objection kills Maya's argument or only trims it, whether Dev's point that a group can't certify its own competence is fatal or just a caveat, whether the requirement of a binary choice with a fact of the matter really disqualifies our kind of decision, and whether deliberation making us individually smarter is in tension with the independence the theorem needs. Then tell me what both of them are missing, and finish with a verdict on which of them is more right overall. Don't hedge and don't just lay out the options for me to choose from — I want you to actually come down on each of these with your reasons, even where the honest answer is that the point is murkier than either of them thinks.
reasoning: |-
  Okay, let me tackle this office debate between Maya and Dev. They're arguing about whether their lab should use majority voting instead of deferring to experts, sparked by a wrong call made by a senior student. Maya cites the Condorcet Jury Theorem (CJT) to support voting, while Dev raises concerns about correlated errors and practical constraints. I need to referee this point by point.

  First, the arithmetic: Maya claims that with 12 people each at 70% accuracy, majority vote should be 99% accurate. Let me verify that calculation. The CJT formula requires calculating the probability that at least 7 out of 12 get it right, since majority means more than half. Using the binomial distribution, P(X≥7) for n=12, p=0.7. Doing the math... summing probabilities from k=7 to 12, it's actually about 91.7%. That's a big difference from 99% - Maya likely overestimated by using an approximation meant for large groups. For small groups like theirs, the boost is modest. So Dev is right to question the 99% figure, though the principle of improvement still holds.

  Next, independence. Dev argues their errors are correlated due to shared training and past mistakes. CJT does require independent votes, and correlation reduces the effectiveness of pooling judgments. If errors are positively correlated, the group accuracy drops significantly. For example, even mild correlation like ρ=0.3 could bring their actual accuracy down to 75-80% instead of 91.7%. This isn't just trimming Maya's argument - it fundamentally changes the math. The "bunched errors" problem is real, as their shared blind spots mean multiple people repeat the same mistakes. So Dev's objection has serious weight here.

  Then there's Dev's point about groups not knowing their own competence. If everyone shares a systematic bias, they might all be below 50% accuracy without realizing it. CJT assumes individual competence >50%, but a group with a blind spot can't verify this. This isn't just a caveat - it undermines the theorem's applicability. Without external calibration, they can't confirm they meet CJT's key precondition. Maya's friction analogy doesn't hold here because the problem isn't noise but structural bias.

  Regarding decision types: CJT requires binary choices with objective truths. Their last decision had four options, making majority voting messy (risk of vote splitting, no Condorcet winner). Many lab decisions may be multi-option or subjective judgment calls where CJT doesn't apply. Dev correctly notes this limits the theorem's scope for their context.

  On deliberation: Maya might suggest discussing before voting to improve individual accuracy, but this trades off with independence. Deliberation can create information cascades or groupthink, increasing correlation. There's tension between making people smarter and keeping their judgments independent. Structured approaches (like Delphi method) might help but add complexity.

  What both miss: Maya underestimates how correlation guts CJT's math and overestimates small-group gains. Dev overlooks that partial independence still helps (just less) and that expert deference has its own failure modes (overconfidence, narrow perspectives). Neither considers hybrid approaches like weighting votes by expertise or using prediction markets.

  Verdict: Dev is more right overall. His objections about correlation, unverifiable competence, and decision-type mismatch are substantive limitations to CJT in their context. While majority voting could still be better than unilateral decisions in some cases, Dev correctly identifies why Maya's 99% claim is misleading and why CJT isn't a straightforward solution for their lab.
answer: |-
  Let's break this down move by move, addressing the core arguments mathematically and conceptually. I'll be direct in each verdict, then synthesize at the end.

  **1. The Arithmetic: Is 99% accurate for 12 people at 70% each?**  
  **Maya's Claim:** Incorrect. She likely used a large-N approximation or misapplied the binomial calculation.  
  **Actual Figure:** For *n=12*, *p=0.7*, majority requires ≥7 correct votes. Binomial probability:  
  P(X≥7) = Σ [C(12,k) * (0.7)^k * (0.3)^{12-k}] for k=7 to 12.  
  Calculation yields **~91.7%** (not 99%). At *p=0.7*, the "wisdom of crowds" effect is modest for small groups. Even at *p=0.6*, accuracy drops to ~79%.  
  **Verdict: Dev is right—Maya's 99% is wildly optimistic. The actual gain is real but far smaller.**

  **2. Independence: Does correlation "kill" Maya's argument or just "trim" it?**  
  **Dev's Objection:** Largely valid and consequential. CJT collapses under correlated errors. If voter mistakes are positively correlated, the probability the majority is wrong increases dramatically—sometimes approaching the error rate of a single individual.  
  **Example:** With *n=12*, *p=0.7*, but pairwise error correlation *ρ=0.3* (plausible for a shared-blind-spot group), majority accuracy plummets to **~75-80%** (depending on model assumptions). If errors are perfectly correlated (*ρ=1*), group accuracy = individual accuracy (70%).  
  **Maya's Rebuttal:** Partially right—partial independence still helps, but gains diminish rapidly with correlation. In practice, shared training, groupthink, or common artifacts create "bunched errors" (e.g., all misinterpreting the same paper).  
  **Verdict: Correlation doesn't just "trim" the benefit; it can gut it entirely. Dev's core objection is lethal in contexts with systematic bias.**

  **3. Self-Certification of Competence: Fatal flaw or manageable caveat?**  
  **Dev's Point:** Profound and often fatal for CJT in practice. CJT requires *p>0.5* for each voter, but a group with a shared blind spot cannot know if *p<0.5*. If everyone is biased toward the *wrong* answer, majority vote amplifies error. Worse, groups often overestimate their collective competence (Dunning-Kruger at scale).  
  **Maya's Counter:** Ignores the depth of the problem. External benchmarks or diverse perspectives could *potentially* calibrate *p*, but Dev is right: **a homogenous, insular group lacks the tools to self-certify *p>0.5***. This is not a "friction" but a foundational crack.  
  **Verdict: Dev is right—this is a fatal flaw absent external validation of competence.**

  **4. Binary Choice with Objective Truth: Does this disqualify lab decisions?**  
  **Dev's Argument:** Mostly correct. CJT assumes:  
  - A single, objective, binary truth (e.g., "Explanation A is correct").  
  - Voters aim to identify this truth.  
  **Lab Reality:** Many decisions (e.g., project selection) involve:  
  - Multiple viable options (not binary).  
  - Subjective trade-offs (e.g., feasibility vs. novelty).  
  - No "fact of the matter" (e.g., which project is "best" depends on goals).  
  CJT doesn't apply here—majority voting can produce cycles or arbitrary outcomes.  
  **Maya's Response:** Overreaching. While *some* lab calls have objective truths (e.g., "Does this reagent degrade at 40°C?"), most strategic decisions do not.  
  **Verdict: Dev is right—CJT is inapplicable to non-binary/subjective decisions, which dominate lab management.**

  **5. Deliberation vs. Independence: A tension?**  
  **The Conflict:** Deliberation can improve individual competence (raising *p*) but often destroys independence (increasing *ρ*). Group discussion may:  
  - Amplify shared biases (reducing *p* for the *correct* answer).  
  - Create information cascades (high *ρ*).  
  **Verdict: Dev is implicitly right—deliberation often undermines CJT's independence assumption. Structured voting (e.g., secret ballots before discussion) might help, but it's a real tension Maya glosses over.**

  **What Both Are Missing:**  
  - **Alternatives to Unchecked Democracy or Autocracy:** Weighted voting (by expertise), prediction markets, or Delphi methods can balance independence and competence.  
  - **The "Relevant Expert" Problem:** Dev assumes the expert is identifiable, but expertise is often contested or siloed. Voting mitigates this risk.  
  - **Correlation is Measurable:** Past group errors (like the artifact mistake) quantify correlation. Ignoring this data is unscientific.  
  - **CJT's Limited Scope:** It's a theoretical ideal for binary factual questions—not a general governance tool.  
  - **Error Asymmetry:** Not all mistakes are equal. Voting may reduce catastrophic errors but increase mediocrity.

  **Overall Verdict:**  
  **Dev is more right.** His critiques—correlated errors (~75% real accuracy vs. Maya's claimed 99%), unverifiable competence (*p>0.5*), and misapplied decision contexts—expose fatal flaws in naively applying CJT to their lab. Maya underestimates how shared biases gut CJT's math and overestimates small-group gains. However, she's right that expert deference carries its own risks (e.g., overconfidence, narrow perspectives).  

  **Recommendation:** Reject pure majority vote for complex/strategic decisions. For factual binary choices, use *weighted* voting based on calibrated expertise (if possible) or anonymous voting *before* discussion to mitigate correlation. Track past group errors to estimate real-world *p* and *ρ*. Ultimately, no mechanism fixes a lack of viewpoint diversity—prioritize recruiting dissenters.
