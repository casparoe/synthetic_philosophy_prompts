  The user especially wants conflicts between desiderata identified. Key tensions: realist vs instrumentalist interpretations of belief; consistency requirements vs prompt-sensitivity; treating self-reports as evidence vs not positing unsupported inner states.

  Finally, they want assessments of major theoretical approaches (intentional stance, deflationary, functional-role, eliminativist, representationalist) against these desiderata, identifying which requirement most excludes candidates and which might be mere prejudices.

