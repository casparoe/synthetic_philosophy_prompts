  For the competence unit question, I'll argue that while tools are part of modern practice, core competence must reside in the individual. The coaching system should be a training scaffold, not a permanent crutch.

  The memo should acknowledge that if the chief is right about judgment development being tied to real complications, the program would fail - so we need safeguards like the unscripted scenario requirement.

