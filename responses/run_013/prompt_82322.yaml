prompt: |-
  I lead a small strategic-foresight unit in a foreign ministry — four analysts, no satellites, no intercepts, only open sources and whatever structure we impose on them. Our product is a set of long-range assessments: ten- to twenty-five-year outlooks on regions, chokepoints, resource basins, and alliance structures, roughly twenty a year, each of which carries the unit's name and goes to the minister. Their readers live in the news cycle; our job is to live outside it, and we are not doing it well.

  The failure is consistent. We over-weight events. A coup, a sudden death, a default, a signed treaty, a new missile — these are what gets recorded, discussed, and remembered. The slow variables that will actually determine the twenty-five-year picture — aquifer depletion, the age structure of a labor force, the erodibility of a delta, the debt-service profile of a state, the physical geometry of a chokepoint, the sunk costs locked into an energy system — receive a paragraph, if that.

  I want you to convert Fernand Braudel's program — the longue durée, and his rough division of historical time into structures, conjunctures, and events — into a procedure my analysts can run. Treat it as an operational instrument, not an essay. Specifically:

  First, an ordered set of questions to put to any proposed development — a claimed trend, a forecast, a single dramatic event, a piece of received wisdom — that sorts it into one of the three tiers and assigns it weight in a long-range assessment. State what counts as a sufficient answer to each question, and what to do when the answers conflict. The middle tier must do real work: conjunctures are the medium-run rhythms — price, credit, and demographic cycles — and the procedure has to distinguish them from both the near-permanent structures beneath and the noise above, rather than treating the three tiers as a rhetorical ladder.

  Second, a rule for the hard cases: a fact that is a structure for one question and an event for another; a genuine discontinuity, where the slow structure itself breaks rather than merely being punctuated; and an event that is in fact a hinge, where a regime falls and the structure really is reset. Explain how the procedure is supposed to tell a hinge from noise without the benefit of hindsight, and say plainly if it cannot.

  Third, a guard against the opposite failure. Taken seriously, the longue durée tempts us into assessments in which geography is treated as destiny, nothing anyone does matters, and every outcome was foreordained. The procedure needs a step that keeps agency and contingency in view without collapsing back into event-chasing.

  Fourth, the points where judgment cannot be eliminated. Where the checklist cannot decide — where the analyst is making a values call, a taste call, or a bet about which structure is load-bearing — mark that in the procedure rather than concealing it behind a score.

  Then run the procedure end to end on two cases, showing each step and the output:

  (a) A dramatic event: the unexpected death of a long-serving autocrat in a petro-state, followed by a contested succession. The minister will want an assessment within the week.

  (b) A slow variable: a steady decline in the water table beneath a major agricultural region that supplies a third of the country's calories.

  Include one worked case in which the procedure tells us to give less weight to something we are attached to, or to spend effort where the minister will find it boring. Close with an honest account of what the procedure cannot do: the questions for which it will generate confident nonsense, and the signals that we are using the word structure as an excuse for fatalism or as a shield against having to make a call.
reasoning: |-
  Okay, the user leads a small strategic-foresight unit in a foreign ministry. They have a team of four analysts relying solely on open sources. Their main output is long-range assessments—10-25 year outlooks on regions, chokepoints, resource basins, and alliance structures. They produce about twenty such reports per year, each going directly to the minister. The challenge they're facing is that their analyses are overly influenced by current events—coups, sudden deaths, treaties—while neglecting the slow, structural variables that actually shape the long-term future, like aquifer depletion or demographic shifts.

  The user specifically wants a structured procedure based on Fernand Braudel's historical framework—the longue durée—divided into structures, conjunctures, and events. They want this as an operational tool, not just a theoretical concept. The key requirements are:
  1. A set of ordered questions to categorize any development into one of three tiers (structures, conjunctures, events) and assign appropriate weight in long-range assessments.
  2. Rules for handling ambiguous cases like discontinuities or hinge events.
  3. A guard against deterministic thinking where agency is ignored.
  4. Explicit marking of points where analyst judgment is unavoidable.

  They also want two worked examples: one for a dramatic event (death of a petro-state autocrat) and one for a slow variable (declining water table), including a case where the procedure forces them to downplay a "sexy" issue.

  I need to create a practical, step-by-step procedure that:
  - Distinguishes between Braudel's three tiers rigorously.
  - Prevents over-indexing on events.
  - Maintains agency awareness.
  - Flags judgment calls transparently.

  For the tier-sorting questions, I'll design diagnostic queries focused on timescale reversibility, and system-level impact. Sufficient answers should meet clear criteria (e.g., structure confirmation requires evidence of persistence beyond 25 years). Conflict resolution will involve escalation to senior analysts.

  For hard cases, I'll include rules for:
  - Split-tier facts (assign dual weights).
  - Discontinuities (require evidence of cascade effects).
  - Hinges (demand pre-existing structural strain and contingency plans).

  The agency guard will be a mandatory "contingency test" forcing analysts to identify leverage points.

  Judgment flags will be explicit annotations in the assessment template.

  For the petro-state succession case, the procedure should show why it's mostly event/conjuncture with minor structural implications. For the water table decline, it should demonstrate why it's structural and deserves emphasis despite being "boring."

  The honesty section will warn about:
  - False confidence in "structure" labeling.
  - Misusing tiers to avoid hard calls.
  - Limitations in predicting cascade thresholds.

  The tone must stay operational—no academic jargon. Examples should illustrate demoting "exciting" events and prioritizing unsexy trends.
answer: |-
  Below is the **Braudelian Tri-Tier Assessment Procedure (BTAP)**, designed as an operational instrument for long-range strategic foresight. It converts Braudel's framework into a repeatable checklist with escalation rules, judgment flags, and safeguards against determinism. The core principle: **Structures set the stage, conjunctures shape the medium-term pathways, and events are data points—not drivers—of the long-term future.**

  ---

  ### **I. The Core Procedure: Tier-Sorting Questions**  
  *Apply sequentially to any proposed development (event, trend, or forecast). Stop when classification is clear.*

  1. **Question 1: Is this development reversible within 25 years without systemic disruption?**  
     - *Sufficient answer for "No" (Structure):* Evidence that reversal would require capital/fiscal investments >20% of relevant GDP, multi-generational societal change, or geological/ecological timeframes.  
     - *Sufficient answer for "Yes" (Proceed to Q2):* Policy shifts, technological substitutions, or regime changes could negate it within 25 years.  
     - *Conflict/Unclear:* Escalate to senior analyst. If irreversibility is partial, assign dual-tier weighting (e.g., 70% Structure, 30% Conjuncture).

  2. **Question 2: Does this development operate on a cycle ≥15 years or persist across ≥3 political/economic cycles?**  
     - *Sufficient answer for "Yes" (Conjuncture):* Documented cyclical patterns (e.g., commodity super-cycles, demographic waves) or persistence beyond typical leadership tenures.  
     - *Sufficient answer for "No" (Event):* Tied to a specific actor, policy, or shock resolvable within 5–10 years.  
     - *Conflict/Unclear:* Default to Conjuncture if it affects resource/behavioral constraints (e.g., debt cycles). Otherwise, flag as "Event with Conjuncture potential."

  3. **Question 3: Does this development alter the physical or institutional "rules of the game"?**  
     - *Sufficient answer for "Yes" (Structure):* Changes deep fundamentals: geography, core infrastructure, constitutional order, or climate realities. Requires map-redrawing or treaty-level renegotiation.  
     - *Sufficient answer for "No" (Reinforce prior tier):* Confirms Q1/Q2 classification.  
     - *Final Output:* Assign to one primary tier. Weight in assessment: **Structure (50–70%)**, **Conjuncture (20–40%)**, **Event (0–10%)**.  
     - *Judgment Flags:*  
       - ⚠️**J1** if reversibility (Q1) relies on untested technology.  
       - ⚠️**J2** if cycle duration (Q2) is inferred not measured.  
       - ⚠️**J3** if "rules of the game" (Q3) are contested.

  ---

  ### **II. Rules for Hard Cases**  
  *(a) Split-tier facts:* Assign proportional weights (e.g., "Delta erosion: Structure 60% (geophysics), Conjuncture 40% (mitigation funding)"). Display as stacked bar in assessment.  
  *(b) Structural discontinuity:* Requires **two triggers**: (1) Evidence of cascade effects across ≥3 systems (e.g., climate event disrupting trade + migration + energy), and (2) Failure of all known adaptation mechanisms. Flag as ⚠️**DISCONTINUITY**—overrides tier weights.  
  *(c) Hinges vs. noise:* A hinge must pass **Hinge Test**:  
     - Pre-existing structural strain (e.g., fiscal unsustainability).  
     - Contingency plans by key actors (e.g., opposition coalitions, hedge funds).  
     - If yes, reclassify as Conjuncture (resets medium-term pathways). If lacking, it's noise. *BTAP cannot predict hinges ex ante but can identify preconditions.*  

  ---

  ### **III. Guard Against Fatalism: Agency Check**  
  After tier classification, **mandatory step**:  
  > *"Identify 1–3 points of agency where deliberate action (state, corporate, or collective) could amplify, divert, or brake this development. Assess feasibility: High (tools exist), Medium (tools plausible), Low (theoretical)."*  
  - *Output:* Paragraph in assessment titled **Contingency Levers**, e.g., "Agricultural automation (Medium feasibility) could decouple food production from water depletion."  
  - *Safeguard:* If no levers ≥Medium feasibility exist, senior analyst must justify why geography/demographics are truly deterministic (rare).

  ---

  ### **IV. Worked Cases**  
  #### **Case A: Death of Petro-State Autocrat (Event)**  
  1. **Q1: Reversible without systemic disruption?**  
     - *Answer:* **Yes**—Succession crises often resolve within 5 years via elites/military. No systemic change needed.  
  2. **Q2: ≥15-year cycle or cross-cycle persistence?**  
     - *Answer:* **No**—Leadership volatility common in petro-states; average tenure <10 years.  
  3. **Q3: Alters "rules of the game"?**  
     - *Answer:* **No**—Oil infrastructure, foreign contracts, and tribal power structures endure.  
     - *Classification:* **EVENT** (Weight: 5–7%).  
  4. **Hinge Test:**  
     - Pre-existing strain? Yes (youth unemployment). Contingency plans? No unified opposition. → **Noise**.  
  5. **Agency Check:**  
     - Levers: Military coalition (High), foreign mediation (Medium).  
  6. **Output to Minister:**  
     > *"Event-tier development. Focus on conjunctures: oil-revenue dependency (25-yr threat) and youth demography (structural time-bomb). Contingency: Regional actors could broker stability (High feasibility)."*  
     - *Judgment Flags:* None. ⚠️**Note:** Minister may demand "who wins?"—attach as Annex with caveat: "Low impact on 2040 outlook."

  #### **Case B: Water Table Decline in Breadbasket (Slow Variable)**  
  1. **Q1: Reversible without systemic disruption?**  
     - *Answer:* **No**—Recharge takes centuries; alternatives (desalination) require infrastructure >30% of agricultural GDP. ⚠️**J1** (assumes no fusion-powered desalination).  
  2. **Q2: ≥15-year cycle?**  
     - *Answer:* **Yes**—Depletion tracked over 40 years; persists across regimes.  
  3. **Q3: Alters "rules of the game"?**  
     - *Answer:* **Yes**—Forces permanent land-use changes, regional water treaties, and migration patterns.  
     - *Classification:* **STRUCTURE** (Weight: 60%).  
  4. **Agency Check:**  
     - Levers: Crop substitution (Medium), aquifer management treaties (Low feasibility due to sovereignty norms).  
  5. **Output to Minister:**  
     > *"Structure-tier development. Core 25-yr risk: 40% calorie deficit by 2045. Conjunctures: Groundwater policies (15-yr cycle). Event noise irrelevant. Contingency: Invest in drought-resistant crops now (Medium feasibility)."*  
     - *Judgment Flags:* ⚠️**J1** (reversibility depends on tech).  

  ---

  ### **V. Case Demoting a "Sexy" Issue: Green Hydrogen Boom**  
  *Received wisdom: "Hydrogen revolution will replace fossil fuels."*  
  1. **Q1: Reversible?**  
     - *Answer:* **Yes**—Tech could be outcompeted by solar/biofuels.  
  2. **Q2: ≥15-year cycle?**  
     - *Answer:* **No**—Current investment cycles are 7–12 years; no persistence evidence.  
  3. **Q3: Alters rules?**  
     - *Answer:* **No**—Depends on existing grids and gas pipelines.  
     - *Classification:* **CONJUNCTURE** (Weight 15%).  
  4. **Agency Check:**  
     - Levers: State subsidies (High) but global market dependencies (Low feasibility).  
  5. **Output:**  
     > *"Overweighting hydrogen distracts from structure: Gas pipeline sunk costs. Prioritize grid modernization."*  

  ---

  ### **VI. What BTAP Cannot Do: Honest Limitations**  
  1. **Generates Confident Nonsense When:**  
     - Data lacks historical depth (e.g., new tech like AI). BTAP defaults to "Structure" via Q3 ("alters rules"), risking hype.  
     - Cultural/social structures are analyzed; quantifiable proxies (e.g., age structure) favored over intangibles (e.g., nationalism).  
  2. **Misuse Signals:**  
     - **Fatalism Alert:** "Agency Check" lists only Low-feasibility levers >3 times in a report.  
     - **Cowardice Shield:** Overusing "Structure" for inconvenient forecasts (e.g., "Demography determines all—no need to model policies").  
     - **False Precision:** Scoring tier weights beyond rough percentages.  
  3. **Inherent Gaps:**  
     - Cannot predict *when* structural strain triggers discontinuity.  
     - Blind to black swans outside historical experience (e.g., pandemic before 2020).  
     - **Final Counsel:** *BTAP makes implicit judgments explicit but cannot replace wisdom. Its value is in forcing debate about time horizons—not eliminating uncertainty.*  

  ---  
  **Deployment Note:** Integrate BTAP into your workflow with a 1-page template (Tier/Weight/Agency/Judgment Flags). Train analysts on historical cases (e.g., 1914 as hinge, 2008 as conjuncture). Update weights annually.
