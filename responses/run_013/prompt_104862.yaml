prompt: |-
  After I was asked to take over the management of a small family endowment, I spent several weeks reading about the Kelly criterion and what is sometimes called geometric rationality — the idea that one should size commitments so as to maximize the expected logarithm of wealth. Two features of my situation seem to fall outside the standard treatment, and I want to understand how far they undermine it. First, the decisions are few and effectively non-repeatable: I expect to make perhaps ten consequential allocation choices over the next decade, and I cannot replay any of them, so the appeal to long-run growth over many independent trials appears to be unavailable. Second, ruin is not zero wealth but a level below which the family's obligations cannot be met, which makes the downside asymmetric in a way the log-utility story does not directly capture. Please describe the most important implications of geometric-rationality reasoning for someone in my position: which of its usual justifications survive when the number of bets is small, and how should I think about sizing when my own probability estimates are uncertain and the outcomes of the bets are correlated with one another?
reasoning: |-
  Okay, the user is managing a small family endowment and has been studying the Kelly criterion and geometric rationality. They're concerned about two main issues: the decisions are few and non-repeatable (only about ten over a decade), and ruin isn't zero wealth but a specific threshold for meeting obligations. They want to know how geometric rationality applies here, especially with uncertain probability estimates and correlated outcomes.

  First, I need to address the core of geometric rationality. The Kelly criterion maximizes expected log wealth, which is great for repeated bets but less so for few trials. The user can't rely on the long-term average because their bets are limited. Also, the ruin threshold adds asymmetry; losses below that point are catastrophic, but the log function treats all losses similarly. So, the standard approach doesn't fully fit their situation.

  The user's hidden needs might include preserving capital while growing it enough to meet obligations. They might be risk-averse but need some growth. Also, they’re probably worried about estimation errors and correlations making their bets riskier. They need practical advice on adjusting position sizing and incorporating their unique constraints.

  Next, the justifications that survive. Even with few bets, maximizing log wealth minimizes the time to reach a target asymptotically. But since they have only ten bets, that's less relevant. More important is the capital preservation aspect: avoiding ruin. Log utility naturally avoids overbetting, which is crucial here. Also, fractional Kelly could be a solution—betting a fraction of the full Kelly to reduce risk and account for uncertainty.

  Uncertain probabilities and correlations are critical. If the user's probability estimates are off, full Kelly could lead to overbetting. They need to adjust by using a fractional Kelly, say half or less, to build in a buffer. Correlated outcomes mean that losses could cluster, increasing the risk of breaching the ruin threshold. They should diversify and reduce position sizes when correlations are high.

  Practical steps: Start by defining the ruin threshold and assigning a utility function that heavily penalizes dropping below it. Use fractional Kelly sizing, maybe 1/4 to 1/2 of the full amount. Stress-test the portfolio against correlated downturns and ensure the endowment can survive worst-case scenarios. Also, document all assumptions and revisit probability estimates regularly.

  In summary, the key implications are adapting geometric rationality to emphasize capital preservation, using fractional Kelly to handle uncertainty and asymmetry, and rigorously managing correlations and estimation errors. The user needs a conservative approach that prioritizes not breaching the ruin threshold while still allowing for growth over their ten decisions.
answer: |-
  Your situation highlights genuine limitations of standard geometric rationality (Kelly) in endowment management. Here's how to adapt its principles to your constraints, addressing both finite bets and asymmetric ruin:

  ### Core Implications of Geometric Rationality in Your Context
  1.  **Capital Preservation as Paramount:** Geometric rationality inherently prioritizes avoiding ruin ("ergodicity breaking"). Even with few bets, this remains its strongest justification. Overbetting significantly increases the probability of breaching your ruin threshold long before the "long run" materializes. **Surviving justification:** Kelly sizing is the *most aggressive* strategy that avoids almost sure ruin *asymptotically*. While the asymptotic guarantee weakens with only 10 bets, the *principle of avoiding overbetting to minimize ruin probability* remains crucial.

  2.  **Downside Asymmetry Requires Explicit Modeling:** The standard log utility function treats a 50% loss symmetrically to a 100% gain (both require doubling/halving to recover). Your ruin threshold breaks this symmetry dramatically.
      *   **Solution:** Define your ruin threshold ($R$) explicitly. Construct a utility function that heavily penalizes outcomes below $R$ ($U(W) \to -\infty$ as $W \to R^+$) and transitions smoothly to $\ln(W)$ (or similar) above a comfortable buffer ($B > R$). A piecewise function often works:
          *   $U(W) = \ln(W)$ for $W \geq B$
          *   $U(W) = k \cdot \ln(W) - C \cdot (B - W)^a$ for $R < W < B$ (where $k, C, a > 0$ are calibrated to ensure smoothness and extreme penalty near $R$)
          *   $U(W) = -\infty$ for $W \leq R$
      *   **Implication:** Optimal position sizing using this $U(W)$ will be **smaller** than standard Kelly, especially for bets with significant tail risk near $R$.

  3.  **"Few Bets" Shifts Focus to Terminal Distribution:** With only ~10 decisions, maximizing *median* terminal wealth or ensuring a high *probability* of exceeding a target wealth level becomes more relevant than maximizing *expected* log wealth. Geometric rationality helps here:
      *   **Kelly minimizes the time to reach a target *asymptotically*:** While less powerful over 10 bets, it still tends to produce favorable terminal wealth distributions *compared to overbetting strategies*.
      *   **Focus on Survival Probability:** Simulate your 10-bet sequence under different sizing strategies (Kelly, fractional Kelly, fixed fraction) using your calibrated utility function. Choose the strategy maximizing the *probability* that $W > R$ (or $W > B$) after 10 bets *and* produces acceptable median terminal wealth.
      *   **Surviving Justification:** Kelly sizing maximizes the *growth rate*. Over only 10 bets, the realized growth rate will be volatile, but maximizing its expectation is still a sensible objective *if* the ruin probability is adequately controlled by your adapted utility function/fractional sizing.

  4.  **Uncertain Probability Estimates Demands Conservatism:** This is critical. Geometric rationality is acutely sensitive to mis-specified probabilities. Overestimating your edge leads to catastrophic overbetting.
      *   **Solution: Fractional Kelly is Essential.** Never bet full Kelly when probabilities are uncertain.
          *   **Fractional Kelly:** Bet a fraction $f$ ($0 < f < 1$) of the stake suggested by the standard Kelly formula ($f^*$). E.g., $f = f^* / 2$ (Half-Kelly) is common.
          *   **Why?** It significantly reduces risk and drawdowns while sacrificing only a portion of the potential growth. It provides a buffer against estimation error.
          *   **Adjust $f$ based on confidence:** Lower $f$ for highly uncertain estimates or assets with fat tails. Use $f = 0.25f^*$ or lower for very speculative bets.
      *   **Margin of Safety:** Deliberately use conservative (pessimistic) estimates of your edge ($p$ or $\mu$) when calculating $f^*$ for sizing. Assume your best estimates are slightly optimistic.
      *   **Scenario Analysis:** Calculate $f^*$ under different probability/edge scenarios. See how sensitive the sizing is. If a small change in your edge estimate drastically changes $f^*$, the bet is highly sensitive to error – size very conservatively or avoid.

  5.  **Correlated Outcomes Exacerbate Tail Risk:** Correlation means bets tend to win or lose together. This *increases* the likelihood of severe drawdowns, directly threatening your ruin threshold.
      *   **Solution: Portfolio-Level Sizing & Correlation Awareness.**
          *   **Holistic View:** Don't size bets in isolation. Calculate the optimal *portfolio* allocation considering correlations and your adapted utility function. This often requires numerical optimization.
          *   **Reduce Aggregate Exposure:** Correlated bets act like a single, larger bet. Decrease the total fraction of capital allocated to a *group* of correlated bets compared to the sum of their individual (uncorrelated) Kelly fractions. If two bets are perfectly correlated, sizing them each at $f^*$ is equivalent to sizing one bet at $2f^*$ – highly dangerous.
          *   **Stress Testing:** Simulate scenarios where multiple correlated bets fail simultaneously. Ensure your sizing allows the endowment to survive these plausible (if unlikely) disaster scenarios without breaching $R$.
      *   **Diversification Imperative:** Actively seek *uncorrelated* (or negatively correlated) positive-expectation bets. This is the most effective way to reduce portfolio volatility and drawdown risk for a given level of expected growth. Geometric rationality strongly favors uncorrelated opportunities.

  ### Practical Recommendations for Your Position

  1.  **Define Ruin ($R$) & Buffer ($B$):** Quantify the absolute minimum wealth and a higher "safe" buffer. Get family/stakeholder agreement.
  2.  **Adopt Fractional Kelly Rigorously:** Start with $f = 0.25f^*$ to $0.5f^*$ as a baseline for *all* bets, given your uncertainty and low $n$.
  3.  **Build Your Utility Function:** Implement the piecewise utility function described above. Calibrate $k$, $C$, $a$ to reflect the true family disutility of nearing $R$.
  4.  **Model Correlations Explicitly:** Don't guess. Use historical data (with caution) or reasoned estimates for correlations between your potential bets/assets.
  5.  **Portfolio Optimization:** Use your adapted utility function and correlation matrix to solve for the portfolio allocation that maximizes expected utility *across all potential bets* simultaneously. Rebalance periodically.
  6.  **Conservative Edge Estimation:** Apply a haircut to your estimated edge/probabilities. Assume your analytical models are slightly flawed.
  7.  **Rigorous Scenario & Stress Testing:**
      *   Simulate 10-bet sequences under different market regimes.
      *   Force sequences of losses on correlated bets.
      *   Calculate the probability of $W < B$ and $W < R$ under your chosen strategy.
      *   Compare strategies (e.g., Half-Kelly vs Quarter-Kelly) based on median terminal wealth, probability of exceeding target wealth, and probability of breaching $B$ or $R$.
  8.  **Document Assumptions & Process:** Maintain clear records of your probability/edge estimates, correlation assumptions, chosen $f$ factors, utility function parameters, and stress test results. Review and update annually.
  9.  **Embrace Conservatism:** Err significantly on the side of caution. The cost of breaching $R$ vastly outweighs the cost of slightly slower growth. Your mandate is survival first, prudent growth second.

  **In essence:** Geometric rationality's core tenet of *avoiding overbetting to prevent ruin* is paramount and survives your constraints. However, its standard implementation is insufficient. You *must* augment it with: 1) An explicit utility function modeling your asymmetric ruin threshold, 2) Aggressive fractional Kelly sizing ($f << 1$) due to probability uncertainty and low $n$, and 3) Rigorous portfolio-level optimization incorporating correlations. This adapted framework prioritizes survival probability over 10 bets while still harnessing the growth-maximizing logic where feasible, making it the most rational approach for your unique endowment management challenge.
