prompt: |-
  Hey, I'm a third-year CS student taking this seminar on decision theory and philosophy of action, and I also have a part-time gig on an ML team that ships an autonomous agent — it scores possible actions with a learned reward model and then acts. I need help with a problem that's half philosophical and half "what do I actually write in the spec."

  So here's the thing. Our agent's reward model sometimes gives two actions the exact same score, or gives two very different-looking options scores I can't meaningfully compare (one's better on safety, the other's better on some task goal, and the model has no common currency for those). Right now the code just breaks ties with a dumb fixed rule — lowest action index, basically alphabetical — and something about that bothers me. If two options are genuinely equal, is "just pick one" actually rational, or is it a dodge? But then Buridan's ass starves between two identical haypiles, and that clearly looks irrational too, so the paralysis must be wrong somewhere as well. I want to figure out where.

  Please act as an expert in decision theory and the philosophy of rational choice — someone who really knows the literature on choice without preference, the Buridan's ass puzzle, and the debate about whether you can intend an action when you have no preference between the outcomes — and take me through this carefully. Start by brainstorming the space of possible positions before you commit to any procedure, and flag your own uncertainty where you have it.

  What I actually need is a proceedure I can turn into a spec and run over and over, every time a tie comes up:

  - An ordered checklist of questions to ask on any tie: what to check first, what counts as a good answer to each, and where the procedure terminates with an actual decision.
  - It has to distinguish at least three situations and say why the difference changes what you do: (a) the two options are genuinely equal in value; (b) they aren't on a common scale at all, so "equal" is the wrong word; (c) the "tie" is really an artifact of my model being blind to some dimension that matters.
  - A rule for when to randomize and when not to. My gut says it's neither always right nor always wrong, so justify the line.
  - The rule should be one I fix in advance, before I know which particular options will tie, and I want you to say why that matters — a tie-break I invent after seeing the options feels like cheating.
  - Mark clearly which steps are real procedure and which are just judgment calls wearing a lab coat, and where the procedure will misfire.

  Then run it on three cases, showing your work at each step:
  1. two actions with identical predicted reward and no other difference, with a deadline forcing an act right now;
  2. an agent facing two options that aren't comparable — better on safety vs. better on the task goal, no common currency;
  3. a human case where the tied options matter a lot and a wrong arbitrary pick is costly — I want to see whether the procedure actually changes anything or just tells me to flip a coin anyway.

  I want at least one of these to come out in a way I won't like — e.g. that the arbitrary tie-break is fine, or that the paralysis is the rational response, or that the tie is a bug and I have to fix the model instead of the tie-break.

  Two more things. (1) Is the whole premise even coherent — can a rational agent be *exactly* indifferent, or is a perfect tie always an idealization that's hiding a real difference? If it's a fiction, say so, because then my spec is solving a fake problem. (2) Be explicit about what this procedure can't do, and please dont just hand me a reading list or a pile of citations — I need something I can use in the code and defend to my team.
