prompt: |-
  my ethics teacher has a bunch of rulings on who caused what and i cant figure out the rule shes actually running before our unit test.

  - lifeguard on duty watches a kid drown and does nothing: caused it.
  - some other guy on the same beach, strong swimmer, calm water, watches and does nothing: she says he did NOT cause it, hes just a jerk.
  - landlord who never put smoke alarms in, tenant dies in a fire: caused it. (shes big on the fact that hes owned the place for years and does all the other upkeep himself)
  - doctor forgets to order a routine test, patient dies: caused it.
  - car company knows about a brake defect, doesnt recall, driver dies: caused it.
  - parent doesnt feed their baby: caused it.
  - guy who films a car crash on his phone instead of calling anyone: she says he did NOT cause the deaths.

  so the plain would-it-have-happened-anyway test is already dead, since both of the no cases pass it.

  my case for next week: my uncle bought a duplex two weeks ago and rents out the bottom half. hes never set foot inside, he just signed the papers and took one months rent. the furnace is cracked and leaking carbon monoxide and the tenant dies in her sleep. did my uncle cause her death?

  give me the rules that fit everything shes said, what each one predicts about my uncle, which rule shes prolly running and why, and one more case i can throw at her that would split the rules apart.
reasoning: |-
  Okay, let me tackle this ethics problem. The user's ethics teacher has a bunch of rulings on causation, and they're struggling to find the underlying rule before their unit test. They've listed several scenarios with the teacher's judgments:

  1. Lifeguard watches kid drown: caused it.
  2. Strong swimmer bystander does nothing: not caused, just a jerk.
  3. Landlord neglects smoke alarms: caused death.
  4. Doctor forgets test: caused death.
  5. Car company ignores defect: caused death.
  6. Parent doesn't feed baby: caused death.
  7. Guy films crash instead of helping: not caused.

  The user's case involves their uncle who just bought a duplex two weeks ago, never inspected it, and the tenant dies from a cracked furnace leaking carbon monoxide. They need to know if the uncle caused the death.

  First, I need to identify the pattern in the teacher's rulings. The obvious "but-for" causation (would it have happened anyway?) doesn't work because in both the bystander and filming cases, the outcome would've been the same without their action/inaction, yet the teacher says no causation. So something else is at play.

  Looking at the cases where causation is found: lifeguard, landlord, doctor, car company, parent. All these roles have a specific duty or responsibility. Lifeguard has a job duty, landlord has legal/maintenance duties, doctor has professional obligations, car company has product safety responsibilities, parent has care obligations. 

  In the "no causation" cases: bystander is just a capable individual with no special relationship, and the filming guy has no duty to assist beyond basic morality. 

  So the key seems to be role-based obligations or duties. The teacher appears to be using a "duty of care" principle from tort law/ethics, where causation is tied to breach of an existing responsibility.

  Now applying this to the uncle's case: he's a new landlord who bought the property two weeks ago, never inspected it. Landlords typically have legal duties to ensure safe living conditions, including functioning appliances. The furnace issue existed before he owned it, but he took ownership without inspection. His breach of duty (failing to inspect/maintain) likely caused the death under the teacher's framework, similar to the smoke alarm case.

  Predictions:
  - Duty-based rule: uncle caused it (breached landlord duty)
  - But-for causation: not caused (defect existed before ownership)
  - Capability-based rule: caused (he could've inspected/fixed)

  The teacher is probably running the duty-based rule, as it perfectly explains all her judgments. 

  For a splitting case, I'd propose a volunteer lifeguard who hasn't signed up yet but sees a drowning. If duty-based: no causation (no formal duty yet). If capability-based: causation (could save easily). This would test whether duty or capability is decisive.
answer: |-
  Based on your teacher's rulings, she's using a **role-based duty of care** framework for causation, not simple "but-for" causation or general capability. Here's the breakdown:

  ### The Rule She's Running: **"Breach of Specific Duty"**
  - **Definition**: Causation exists when:
    1. A person has a **specific, pre-existing duty** (legal, professional, or role-based) to prevent harm, AND
    2. They **breach that duty** through action/inaction, AND
    3. The harm **directly results** from that breach.
  - **Key nuance**: General moral obligations (e.g., helping strangers) don’t create causation. Only duties tied to a formal role, contract, or responsibility do.

  ---

  ### How the Rule Explains All Her Cases:
  | Case                                  | Duty Exists?                     | Breach?                     | Causation? | Why?                                                                 |
  |---------------------------------------|----------------------------------|-----------------------------|------------|----------------------------------------------------------------------|
  | **Lifeguard** (watches kid drown)     | **Yes** (job duty to save)       | **Yes** (inaction)          | Caused     | Duty is explicit to job role.                                        |
  | **Strong swimmer** (does nothing)     | **No** (no role-based duty)      | N/A                         | Not caused | No special duty; just a moral failure.                               |
  | **Landlord** (no smoke alarms)        | **Yes** (legal duty to maintain) | **Yes** (neglected upkeep)  | Caused     | Duty from property ownership/tenant law.                             |
  | **Doctor** (forgets routine test)     | **Yes** (professional duty)      | **Yes** (negligence)        | Caused     | Duty from medical license/patient relationship.                      |
  | **Car company** (ignores defect)      | **Yes** (duty to ensure safety)  | **Yes** (failed to recall)  | Caused     | Duty from product liability/manufacturer role.                       |
  | **Parent** (doesn’t feed baby)        | **Yes** (legal/care duty)        | **Yes** (neglect)           | Caused     | Duty from parental responsibility.                                  |
  | **Filming guy** (ignores car crash)   | **No** (no role-based duty)      | N/A                         | Not caused | No special duty to victims (just a moral failing).                   |

  ---

  ### Your Uncle's Case Prediction:
  - **Facts**: Uncle bought duplex 2 weeks ago, never inspected, tenant dies from pre-existing furnace leak.
  - **Under "Breach of Specific Duty" rule**: 
    - **Duty?** **YES**. Landlords have a legal duty to ensure habitability/safety (e.g., inspect/fix hazards), even if new. This duty starts at ownership.
    - **Breach?** **YES**. Failing to inspect the property (especially critical systems like HVAC) breaches that duty.
    - **Result?** Death directly from the uncorrected hazard.
  - **Prediction**: Your teacher will say your uncle **CAUSED** the death, like the smoke-alarm landlord. Time owned (2 weeks) doesn’t absolve duty—it’s about the role, not duration.

  ---

  ### Why "Breach of Specific Duty" is Likely Her Rule:
  1. **Explains all her judgments perfectly**: Every "caused" case has a clear duty source (job, law, profession, parenthood). Every "not caused" case lacks such a duty.
  2. **Rejects "but-for" and "capability"**: 
     - The strong swimmer was capable but had no duty → no causation.
     - The filming guy could have helped but had no duty → no causation.
  3. **Focus on institutional/role obligations**: She emphasizes the landlord’s upkeep responsibility and the car company’s corporate duty—not just individual morality.

  ---

  ### A "Splitting Case" to Test Competing Rules:
  **Scenario**: *A nurse (off-duty, in plain clothes) witnesses a cardiac arrest in a grocery store. She has a medical kit in her car but does nothing. The victim dies.*  

  - **Under "Breach of Specific Duty"**: **NO causation**. No active duty exists off-duty (unlike the lifeguard *on duty*). She’s a jerk, but no role-based obligation was breached.
    
  - **Under "Capability + Opportunity"** (a competing rule your teacher *rejects* but might tempt classmates): **CAUSATION**. She had training, tools, and opportunity to save a life.

  **Why this splits the rules**: 
  - Your teacher’s duty-based rule would say "not caused" (consistent with bystander cases). 
  - If she suddenly says "caused," she’s contradicting her own framework (unless she argues nurses have 24/7 duties—unlikely). Use this to force clarity on whether duty *must* be active/contextual.

  ### Final Tip:
  In your uncle’s case, argue **duty attaches at ownership**: Landlords must inspect/address hazards immediately upon taking control. Even 2 weeks of inaction breaches that duty. Compare to the smoke-alarm landlord—both failed baseline safety upkeep. Good luck!
