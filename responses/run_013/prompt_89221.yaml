prompt: |-
  Can you explain what's actually going on with Quine's take on moral values? I get the rough naturalist story — no moral facts over and above the empirical/scientific ones, moral judgments aren't true in the way that a claim about a brick on a table is true, and he leans on a comparison between normative inquiry and engineering. What I want is the conceptual mechanics, not the slogan.

  Specifically: how is the engineering analogy supposed to work when engineering norms are relative to a goal that's just assumed (the bridge should stand, the drug should cure), while in morality the goal itself is what's in dispute? Does Quine have a way out of that, or does he just accept that moral ends are given by our psychology and social training and that all the normativity left is instrumental? And how does his holism and indeterminacy of translation interact with this — if moral terms are learned as socially conditioned verbal dispositions, whats left of the idea that two people disagreeing about abortion are actually disagreeing about anything, rather than just making different noises with different practical upshots?

  Please separate what's settled in the secondary literature from what's genuinely contested, and don't smooth over the places where Quine is ambiguous or where people who know him well disagree about what he was entitled to.
reasoning: |-
  Okay, the user is asking about Quine's view on moral values, specifically the engineering analogy and how it handles disputes over moral ends. They also want to know about the interaction with holism and indeterminacy of translation. Let me start by recalling Quine's naturalism. He rejects any non-natural facts, so moral judgments aren't truth-apt in the same way as empirical statements. The engineering analogy suggests that moral norms are like technical norms—relative to goals. But the user points out that in morality, the goals themselves are contested, unlike in engineering where goals like building a stable bridge are given. 

  The user's deeper concern seems to be whether Quine can address moral disagreements without objective goals. They mention instrumental normativity and ask if moral ends are just psychological or social. Also, they bring up holism and indeterminacy: if moral terms are learned through social conditioning, are disagreements like abortion debates just verbal differences? 

  I need to break down Quine's position. He likely sees moral ends as arising from human nature and culture. So the normativity is instrumental relative to these contingent goals. But how does that handle disputes? Quine might say that shared human needs provide some common ground, but that's vague. The indeterminacy of translation complicates things. If two people use "wrong" differently, their disagreement might be merely verbal. But Quine probably thinks that within a shared linguistic community, there's enough agreement to have substantive disputes. Still, this is shaky ground.

  The user wants clarity on contested points. Secondary literature debates whether Quine's view leads to relativism or if he allows for objective grounds via human nature. Also, how holism affects moral epistemology. Some scholars think moral judgments can be part of the web of belief, others argue they're too detached. The indeterminacy issue is especially tricky—some say it reduces moral disagreements to pragmatic differences.

  I should address the engineering analogy's limitation: moral goals aren't fixed like engineering goals. Quine doesn't resolve this, accepting that ends are contingent. For indeterminacy, within a shared culture, moral terms have enough determinacy for real disagreements, but cross-culturally, it's murkier. The user needs these nuances, not just simplified answers. They want the messy details where Quine's view has tensions, so I'll highlight those areas of ambiguity and scholarly debate.
answer: |-
  Here's a breakdown of Quine's conceptual mechanics on moral values, tackling your specific concerns about the engineering analogy, the source of moral ends, and the impact of holism/indeterminacy, while highlighting ambiguities and scholarly disputes:

  **Core Framework: Radical Naturalism & Elimination of "Moral Facts"**

  1.  **No First Philosophy:** Quine rejects any foundation for knowledge outside science itself. There's no privileged "philosophical" standpoint (intuition, pure reason, moral sense) to ground ethics.
  2.  **The Web of Belief:** All knowledge is interconnected ("holism"). Beliefs face experience as a whole, not individually. Science is our best effort to systematize sensory input.
  3.  **Fact/Value Demarcation (Quinean Style):** For Quine, "factual" statements are those that contribute to predicting sensory experience and are confirmed/disconfirmed within the web of belief. Moral statements ("Abortion is wrong") do *not* function this way:
      *   They lack specific, testable empirical consequences on their own.
      *   They aren't refined or discarded primarily based on empirical evidence in the way scientific hypotheses are.
      *   **Conclusion:** Moral statements don't express "moral facts" in the same ontological or epistemological category as scientific facts. They aren't truth-apt in the robust, scientific sense.

  **The Engineering Analogy: Normativity Without Ontology**

  *   **The Analogy:** Just as engineering principles ("This beam must be X thick for load Y") are normative *relative to the goal* (e.g., building a stable bridge), moral principles ("One ought not lie") are normative *relative to certain goals*.
  *   **Your Key Challenge - The Goal Dispute:** You rightly identify the core tension. Engineering goals (stability, efficiency, safety within defined parameters) are largely uncontroversial *within the engineering context*. Moral goals ("flourishing," "justice," "well-being") *are* the primary subject of dispute.
  *   **Quine's (Implicit or Explicit) Response:**
      *   **Psychological/Sociobiological Grounding:** Moral ends aren't arbitrary. They originate in human nature, evolved social instincts, and cultural conditioning ("social training"). Goals like survival, social cohesion, minimizing suffering, reciprocity, and fairness have deep roots in our biology and the necessity of social living.
      *   **Instrumental Normativity is All There Is:** Quine *does* accept that the normativity left is instrumental. "Oughts" only make sense relative to these contingent, biologically/culturally given ends. There is no transcendent "Good" to which these ends themselves must answer. *Why* we have these ends is a matter of empirical science (psychology, biology, anthropology, sociology), not normative ethics.
      *   **Analogy Nuance:** The analogy works structurally, not ontologically. Both domains involve *hypothetical imperatives*: *If* you want a stable bridge, *then* use beam thickness X. *If* you want a cohesive society where trust exists (a goal rooted in our psychology/social nature), *then* norms like truth-telling generally apply. The dispute *is* about the goals, but for Quine, arguing about ultimate goals is arguing about empirical facts concerning human nature and social requirements, not about non-natural values. It's a dispute within science (broadly construed), not outside it.

  **Holism, Indeterminacy of Translation, and Moral Disagreement**

  *   **Moral Terms as Learned Dispositions:** Moral terms ("good," "wrong," "ought") are acquired through conditioning within a linguistic community. We learn to apply "wrong" to certain actions based on observed reactions (disapproval, punishment) and instructions. This generates socially reinforced verbal dispositions.
  *   **Indeterminacy of Translation (IOT):** Quine's famous thesis states that there is no unique, factually correct way to translate one language into another. Multiple translation manuals can be empirically adequate yet assign incompatible meanings to sentences. Meaning is grounded in observable behavior and dispositions, not private mental entities.
  *   **The Abortion Disagreement Challenge:** Does this mean pro-life and pro-choice advocates are just making different noises with different practical implications, not genuinely disagreeing about a shared moral proposition?
  *   **Quine's Likely Position & Scholarly Interpretation:**
      *   **Within a Linguistic Community:** Within a shared language/culture, the behavioral dispositions associated with moral terms are sufficiently uniform and interconnected with observable situations that disagreement *is* substantive. Disputants share a core web of beliefs and dispositions about harm, rights, life, autonomy, etc., even while disagreeing on their application to abortion. They are disagreeing about *how to apply* shared, socially-conditioned concepts to a specific case within the shared web. They *are* making incompatible claims within their shared conceptual scheme.
      *   **Cross-Cultural/Radical Disagreement:** IOT becomes more relevant here. If two cultures have radically different behavioral dispositions associated with their moral vocabulary, Quine would likely say:
          *   There may be no fact of the matter about whether their moral terms *mean the same thing*.
          *   Their "disagreement" might reflect fundamentally different conceptual schemes and practical orientations, not a clash over a single proposition with a determinate truth value accessible to both. Translation between their moral frameworks might be indeterminate.
          *   **Crucial Point:** This doesn't mean *anything goes* or that critique is impossible. We can still *describe* their behaviors, goals, and conditioning empirically. We can assess the *instrumental effectiveness* of their norms relative to *their own* stated or observable goals (using anthropology/sociology). We can even critique goals based on *our* contingent goals (e.g., "Your practice causes unnecessary suffering, and we value minimizing suffering"). But this critique is itself relative to our contingent framework.

  **Settled vs. Contested & Ambiguities**

  *   **Settled in Secondary Literature:**
      *   Quine unequivocally denies the existence of non-natural moral facts or any non-scientific foundation for ethics.
      *   He views moral discourse as fundamentally different in its epistemic role from scientific discourse.
      *   The engineering analogy represents his view of moral normativity as instrumental and goal-relative.
      *   Moral concepts are acquired through social conditioning, forming verbal dispositions.
      *   He was a naturalist and physicalist about human psychology and language.
  *   **Genuinely Contested & Ambiguous:**
      1.  **The Status of Moral Goals:** Is Quine offering a *reduction* of moral goals to purely descriptive biological/social facts ("flourishing" just *is* reproductive success + low stress hormones + social approval)? Or is he leaving room for goals to be irreducibly *valued* by agents, even if the *capacity* to value has a natural origin? Scholars debate whether his view is robustly *eliminativist* (moral talk is just confused non-cognitive grunts) or a softer *non-cognitivist/non-factualist* view where moral judgments express conative states (desires, commitments) rooted in nature.
      2.  **Scope of Instrumental Reason:** *How* does instrumental reason work within the web? Can reasoning *about* ultimate goals occur? Quine is vague. Can empirical knowledge about human nature (psychology, evolutionary biology, sociology) rationally compel revisions to our ultimate goals? Or are goals simply fixed endpoints? Most scholars think he leans towards goals being relatively fixed starting points, with reasoning confined to means.
      3.  **Holism's Bite for Morals:** How *integrated* are moral judgments into the scientific web? Can empirical discoveries (e.g., about fetal development, psychological effects of abortion bans, societal impacts) genuinely *constrain* or *revise* core moral judgments ("Life begins at conception"), or are moral judgments too detached? Quine likely thought they *could* be revised by empirical input (consistent with holism), but how this happens is underspecified and controversial.
      4.  **IOT and Genuine Disagreement:** How widespread is the threat of IOT rendering moral disagreements merely verbal, *even within* a culture? Does the shared conditioning guarantee enough determinacy of meaning for substantive disagreement on issues like abortion? Quineans generally argue "Yes" for intra-community disputes, but the line is fuzzy. The role of *rational argument* in moral persuasion within Quine's framework is also unclear – is it just rhetoric adjusting dispositions?
      5.  **Normativity of the Goals:** Where does the *normative force* of the instrumental "ought" come from? If survival is just a biological fact, why *ought* I to value it? Quine likely saw this as a pseudo-question – the "force" is simply the motivational push of our evolved psychology and conditioning. For him, there's no deeper "ought" to be found. Some find this unsatisfying as an account of normativity.

  **Conclusion:**

  Quine dissolves traditional moral ontology and epistemology. Moral judgments are instrumental imperatives grounded in contingent, biologically/socially determined human goals. The engineering analogy highlights this instrumental structure but stumbles on the disputability of the goals themselves. Quine's answer is that the goals aren't arbitrary but arise from our nature, discoverable by science. Moral disagreement is substantive within a shared linguistic community due to common conditioning, but IOT raises the specter of fundamental cross-cultural incommensurability. The deepest controversies surround the precise nature of moral goals (reducible or not?), the potential for empirical input to revise core moral beliefs, and whether his account captures the *normativity* agents feel, or merely explains it away. Quine offers a coherent, radically naturalistic framework, but it leaves significant tension between the felt objectivity of moral dispute and the contingency of its foundations.
