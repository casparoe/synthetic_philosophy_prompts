  The residue (the arbitrary choice of summation method and the lack of an external constraint) indicates that the ethical claims about infinite populations might be less well-formed than they appear. The statement "the total welfare is infinite" is not well-defined without a summation method. The ethical theories need to specify how to regularize the total, but without an analogue of experiment, there is no way to choose between methods. This is a defect of the ethical framework, not the mathematical vocabulary. However, the mathematical vocabulary does highlight the need for such a specification.

