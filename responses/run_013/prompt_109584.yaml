  I follow the rationalist blogs closely and did a physics doctorate, so I'm fluent in the machinery of divergent series — Cesàro and Abel summation, zeta regularization, the way renormalization tames an infinity by imposing a regulator and then taking a limit — but I'm only a tourist in the ethics literature on infinite populations. Take the main positions in the infinite-ethics debate — the aggregative view that we should maximize total welfare even when the total is infinite, the person-affecting view that an infinite world cannot be made better by adding one more happy person, the proposal to rank infinite worlds by cardinality or order-type rather than by a sum, and the worry that with infinite sums every action is as good as every other — and restate each of them as faithfully as you can in my vocabulary of sums, limits, regulators, and summation methods, without quietly importing the ethics back in under new names. Then give me the residue report: which claims survive the translation cleanly, which survive only with distortion, and which have no counterpart at all in how I think about divergent series. I want a verdict on what the residue means — is it a defect of my vocabulary (it can fix a regularized value but cannot say what I ought to do, or cannot distinguish a sum that is genuinely undefined from one that happens to be zero), or a sign that the ethical claims were less well-formed than they looked, so that 'the total welfare is infinite' was a gesture at a quantity no one had actually defined? And address the disanalogy that keeps nagging me: in QFT the choice of regulator is disciplined by experiment, whereas in ethics nothing outside the summation constrains which method is right, so the analogy may be smuggling in the assumption that there is a fact of the matter.
