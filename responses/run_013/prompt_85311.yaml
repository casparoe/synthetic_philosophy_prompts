answer: |-
  You're misrepresenting the structure. Let's sharpen the knife. The wrongness of *your token act* is determined by the *ex ante* expected harm of *choosing to perform acts of that type* in the relevant decision context—not by phantom aggregates, and not by collapsing into rule-consequentialism. 

  When you buy that burger, you don't get to hide behind the actual aggregate outcome ("cows were already slaughtered!") or hypothetical substitutes ("someone else would've bought it!"). The morally salient fact is this: **by choosing to engage in a practice that systematically demands increased production, you are participating in a pattern that predictably causes harm.** Your act isn't evaluated in splendid isolation; it's evaluated as a token of a type that, when generalized, alters incentives and outcomes. The "expected difference" isn't mined from a counterfactual world of non-existent actors—it's derived from the *causal properties of the act-type itself* under real-world market dynamics. 

  Your "actual aggregate" horn misses the point entirely: the moral question isn't whether your specific dollars moved the slaughterhouse's quarterly report. It's whether your choice *constitutes* participation in a harm-inducing system. The inefficacy objector's error is demanding proof of micro-level causation while ignoring the macro-level responsibility of reinforcing the mechanism. 

  As for your "counterfactual aggregate" horn—no, I'm not smuggling in rule-consequentialism. Rule-consequentialism asks "what *rules* would maximize good?". I'm asking "what is the *causal fingerprint of this act-type*?". The wrongness emerges directly from the probabilistic harm-amplification inherent to the act-type, not from optimizing a social code. You're conflating *identifying harmful patterns* with *legislating ideal rules*. 

  Your turn. Where does this misfire? 

  *(Holding the line: type-level expected harm defines token wrongness. No retreat.)*
