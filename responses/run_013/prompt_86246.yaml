  ## Polyglot Consensus Engine™ Help Center  
  **Frequently Asked Questions (FAQ)**  

  1. **Q: The software refuses to translate statements where villagers clearly disagree with me or each other. It rephrases their sentences until they seem aligned. Why?**  
     A: The Polyglot Consensus Engine requires a globally coherent interpretation where speakers are maximally charitable (assumed truthful and rational). If apparent disagreement persists under initial analysis, the system iteratively adjusts semantic assignments until consensus emerges. This is core functionality, not a bug. "Maximum Charity" is a fixed parameter and cannot be disabled or adjusted.  

  2. **Q: When pointing at a specific animal (e.g., a goat), the software outputs three different translations for the local word: "goat," "horn," and "kid" (young goat). Which one is correct?**  
     A: All outputs are valid under different, equally empirically adequate holistic manuals for the language. The sensor data (pointing) and utterances alone underdetermine the exact referent. The system selects *one* coherent manual (e.g., translating it as "goat") for practical output, but this choice is not uniquely determined by the evidence. As noted in the manual (Section 4.2): *"Output translations represent one possible consistent theory of meaning; alternate coherent interpretations may exist for the same evidence."*  

  3. **Q: Version 1 had a "Radical Worldview" mode. Where is it?**  
     A: The "Radical Worldview" toggle was removed in Version 2.0. Analysis of usage data showed it consistently produced null outputs (blank translation fields) when activated. This occurred because the system could not construct a viable holistic theory of meaning that simultaneously preserved truthfulness/rationality *and* deviated radically from our baseline understanding of physics, causality, and ontology. Removal is documented in Release Notes 2.0: *"Feature Removal: 'Radical Worldview' mode. Rationale: Invariably generated null translations due to incompatibility with core coherence constraints."*  

  4. **Q: The software won’t translate *anything* spoken by a specific individual, showing error: "ERR 407: No Interaction History With Community." The person looks identical to a known villager. Why?**  
     A: ERR 407 indicates insufficient data. Meaning assignment relies crucially on observing a speaker’s history of interactions within the linguistic community to triangulate intent and reference. A newly encountered individual, even if physically identical to a known speaker, lacks this interaction history. Until the individual is observed engaging in multiple successful communicative acts within the community (e.g., being responded to, causing reactions, coordinating actions), the system cannot confidently assign meaning to their utterances. Physical appearance is not a semantic datum. Log interactions for 24-48 hours.  

  5. **Q: Why does translating a single word sometimes change the translation of completely unrelated words from earlier sessions?**  
     A: The Polyglot Consensus Engine builds a single, unified "meaning theory" for the entire language. Adjusting the interpretation of one term (based on new evidence) can necessitate revisions to other terms to maintain global coherence (truthfulness, rationality, consistency across speakers). This holistic adjustment is fundamental to the engine's design and ensures maximal interpretative stability over time.  

  6. **Q: The manual mentions "indeterminacy of translation." Does this mean the translations are guesses?**  
     A: No. "Indeterminacy" refers to the existence of multiple, empirically equivalent meaning theories fitting all observable data. The engine selects one such *fully coherent and empirically adequate* theory. All outputs are generated from a theory where speakers are interpreted as being largely correct and rational about their world. It is not guessing; it’s rigorously applying coherence constraints where evidence underdetermines a single option.  

  7. **Q: Can I manually override a translation or force a specific meaning for a word?**  
     A: No. User-defined overrides would violate the core coherence constraints (truthfulness, rationality, agreement). The system must generate a theory where *all* utterances, across *all* speakers and time, fit together consistently. Forcing a local meaning could make global coherence impossible, leading to translation failure (ERR 409: Coherence Violation).  

  8. **Q: Why does the software sometimes output very complex English sentences for simple local utterances?**  
     A: To preserve truthfulness and rationality within the holistic theory, a simple utterance may require a complex translation to resolve potential contradictions with other observed statements, actions, or environmental facts. The engine prioritizes semantic fidelity under the coherence constraints over syntactic simplicity.  

  9. **Q: ERR 409: Coherence Violation. What triggers this?**  
     A: ERR 409 occurs when incoming data (new utterances, sensor input) is fundamentally incompatible with the existing holistic meaning theory *and* the system cannot generate a revised theory satisfying all core constraints (truth, rationality, speaker agreement). This indicates exceptionally ambiguous, contradictory, or sparse data relative to the constraints. Try gathering more contextual data (environmental logs, video of interactions, more utterances).  

  10. **Q: Is the Polyglot Consensus Engine suitable for real-time diplomatic negotiation translation?**  
      A: Not recommended for high-stakes, real-time negotiations. The engine's requirement to reconcile all statements into a coherent, agreeable theory may smooth over genuine strategic disagreements or conflicts of interest in its output. It is optimized for descriptive linguistic analysis, not high-velocity, adversarial communication.  

