prompt: |-
  I keep meeting an argument about local conventions that seems to prove far too much, and I'd like help finding where it goes wrong. A colleague presents it as a point about fairness, and lays it out like this:

  (1) A settled local convention is a cooperative scheme: participants form expectations around it, order their conduct by it, and often bear costs to sustain it.
  (2) When someone knowingly departs from a settled convention, she imposes avoidable costs on those who ordered their conduct around it.
  (3) Imposing avoidable costs on others is pro tanto wrong.
  (4) So knowingly departing from a settled local convention is pro tanto wrong — whether or not the departing person endorses the convention or belongs to the community that keeps it.
  (5) A visitor is governed by the conventions of where she is, not by the ones she brings from home.
  (6) Therefore, where home and host conventions conflict, the visitor is bound by the host's — even when she finds the host's pointless, distasteful, or morally suspect.

  He treats the following as clean instances of (6): a newcomer who drinks her share of the rounds in a pub where the regulars take turns buying for the group but never buys one herself; a traveler from a haggling culture who treats posted prices as final in a country where haggling is expected; and, more troublingly, a visitor in a place where petty bribery is the settled way of getting anything done, or where a convention assigns women a deferential role. I find the first two cases intuitively convincing and the third intuitively repugnant, and I cannot see what distinguishes them on his premises, since (4) says that settledness itself is what does the work.

  If I have to surrender something, I would rather keep (3) — that imposing avoidable costs on others is at least pro tanto wrong — than keep (6), but I want to know what I would be paying. Which premise or step should I reject, why did it look so plausible, and what would each of the going positions have to concede to reject it? I am especially interested in whether this is just the fair-play account of obligation in miniature, and in what it would take to say that a convention simply does not reach a visitor rather than that it binds her and is outweighed — including whether there is a principled way to draw the line between conventions a visitor is inside and conventions she is merely adjacent to.

  Lead with your bottom line in the first sentence, then give the reasoning; no preamble, and don't restate the question.
reasoning: |-
  Alright, the user is dealing with an argument about local conventions and fairness. They're presented with a logical sequence that concludes a visitor must follow the host's conventions, even if they conflict with the visitor's own or are morally suspect. The user finds this troubling, especially in cases like petty bribery or gender roles. They want to know which premise to reject to avoid this conclusion without giving up the idea that imposing avoidable costs is wrong.

  First, I need to break down each premise. Premise (1) says conventions are cooperative schemes where participants bear costs. That seems solid. Premise (2) claims departing imposes avoidable costs. That's arguable—maybe in some cases, but not all. Premise (3) is key: imposing avoidable costs is pro tanto wrong. The user wants to keep this. Premise (4) ties it together, saying knowingly departing is wrong regardless of endorsement. Then (5) and (6) extend this to visitors.

  The examples given: pub rounds and haggling are okay, but bribery and gender roles are not. The user needs a way to distinguish these cases. The argument hinges on settled conventions creating obligations just by existing. But that can't be right for immoral conventions. So where's the flaw?

  The problem is in premise (2). It assumes that any departure from a convention always imposes costs. But is that true? In the pub, not buying a round clearly costs others money. But in gender roles, not deferring might not impose a cost; instead, it might challenge an unjust system. The cost here isn't like a financial loss; it's more about discomfort from disrupting norms. But should that count as an "imposed cost" in the same way?

  Premise (2) conflates different types of costs. Fair-play obligations work when the scheme is just and benefits all. But if the convention is exploitative, like bribery, participating might perpetuate harm. The visitor isn't free-riding; they're refusing to engage in corruption. The costs here are different—maintaining an unjust system versus tangible losses.

  Also, premise (5) assumes visitors are automatically part of the cooperative scheme. But maybe they haven't accepted the benefits. In the pub, joining the round implies participation. But a visitor in a bribery context hasn't necessarily accepted any benefits that obligate them to participate. So the scope of who is bound matters.

  Rejecting premise (2) allows keeping premise (3). The user can say imposing avoidable costs is wrong, but not all departures impose genuine costs. For immoral conventions, the "costs" are actually harms from not complying with injustice, which shouldn't count. This draws a line between conventions that are legitimate versus oppressive. 

  The challenge is defining that line. The user mentions wanting a principled distinction. Maybe conventions that are mutually beneficial and just create obligations, while oppressive ones don't. But that requires a moral evaluation, which the original argument avoids. Still, it's necessary to avoid the repugnant conclusion.

  The user also wonders if this is fair-play theory in miniature. Yes, it is. Fair-play typically applies when one benefits from a cooperative scheme. So if the visitor benefits, they might have obligations. But in cases like bribery, they don't benefit in a way that imposes fairness obligations. 

  In conclusion, rejecting premise (2) as overbroad solves the problem. It preserves the intuitive cases while allowing refusal in immoral ones. The cost is having to judge when a convention's costs are legitimate versus when they're part of an unjust system. But that's necessary to avoid the troubling implications.
answer: |-
  Reject premise (2): the claim that knowingly departing from a settled convention *always* imposes avoidable costs on others is overbroad and fails to distinguish between legitimate expectations and expectations rooted in injustice or exploitation. Premise (2) appears plausible because conventions often coordinate behavior efficiently, and deviations *can* frustrate reliance or create coordination costs. However, it ignores critical moral distinctions:

  1.  **The nature of the "costs" imposed:** In cases like gender deference or bribery, the "costs" others suffer when a visitor departs from the convention are often the frustration of maintaining an *unjust or exploitative system*. The "cost" of a woman not deferring might be a man's discomfort at challenged privilege; the "cost" of refusing a bribe might be a corrupt official's lost illicit income. Labeling these as "imposed costs" worthy of moral consideration under (3) wrongly legitimizes the oppressive convention itself. Premise (2) conflates genuine coordination costs (e.g., financial loss in the pub round) with the "costs" of sustaining injustice.
  2.  **Fair-play and the boundaries of the cooperative scheme:** Fair-play obligations (premise (1)) arise from *benefiting* from and *participating in* a mutually beneficial cooperative scheme. Premise (5) assumes the visitor is automatically *within* the scheme's scope. However:
      *   **Coercive/Exploitative Schemes:** A visitor cannot meaningfully "benefit" from or freely participate in a scheme fundamentally based on their own exploitation (e.g., gender subordination) or systemic corruption (bribery). Refusing to participate isn't failing to cooperate; it's refusing to be victimized or complicit. The scheme lacks the reciprocity essential for fair-play obligations to bind non-consenting outsiders.
      *   **Adjacency vs. Membership:** Premise (2)/(5) assumes mere physical presence makes one subject to *all* local conventions. A principled distinction requires asking if the visitor has *voluntarily engaged* with the specific cooperative practice and received its *specific benefits*. The pub visitor drinking rounds engages and benefits; a tourist observing a sexist ritual does not necessarily engage or benefit. Convention A (driving on the right) binds visitors for coordination/safety. Convention B (bribes) does not inherently bind a visitor merely present; they become "adjacent" unless they actively seek the illicit "service."

  **What each position must concede:**

  *   **Rejecting (2):** You concede that *some* departures from *some* conventions impose no morally relevant costs (or that the "cost" is morally illegitimate). You must develop criteria to distinguish legitimate cooperative expectations (pub rounds, haggling norms) from illegitimate ones (subjugation, corruption), likely based on reciprocity, lack of exploitation, and genuine mutual benefit.
  *   **Rejecting (3):** You concede that imposing some avoidable costs (e.g., coordination costs) isn't even pro tanto wrong, gutting the argument for fairness in the benign cases you accept (pub rounds). This is likely too high a price.
  *   **Rejecting (5):** You concede visitors are never automatically governed by host conventions. This risks unfairness in clear coordination cases (e.g., traffic rules) and undermines the intuitive pub/haggling examples.
  *   **Rejecting (4):** You concede that settledness alone doesn't create pro tanto obligations for non-members. This also undermines the benign cases.

  **Addressing Fair-Play and Scope:**

  This *is* essentially fair-play theory applied to conventions. Its flaw here is failing to limit obligations to conventions that are:
  1.  **Just/Non-Exploitative:** Providing genuine, non-coercive mutual advantage.
  2.  **Specifically Engaged With:** The visitor must voluntarily accept the *specific benefits* of the *specific convention* creating the reliance. A visitor benefits from general public order (supporting traffic rules) but not from a corrupt bribery system unless they actively seek its "services."

  Drawing the line requires judging whether the convention's demands are reasonable, reciprocal, and non-exploitative, and whether the visitor's interaction constitutes voluntary engagement generating reliance. A visitor is "inside" conventions essential for basic coordination/safety in the space they occupy (traffic, queueing) or those they voluntarily participate in (pub rounds). They are merely "adjacent" to conventions demanding complicity in injustice or exploitation, or those they haven't engaged with or benefited from.
