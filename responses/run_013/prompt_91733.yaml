answer: |-
  The practice presupposes that legitimate authority resides solely in the elected representatives of the people, rendering the monarchy a legally necessary ceremonial figurehead whose primary function is symbolic continuity, not independent governance.

  1.  **Legitimacy Source:** Strictly, the conventions presuppose *popular sovereignty* channeled through the elected legislature and its ministers. The monarch's role in state machinery is purely formal; legitimacy attaches entirely to the elected branch. The monarch acts *only* on ministerial advice, and ministers bear responsibility to the assembly, making the assembly the *de facto* and *de jure* source of governing authority. The monarch is a conduit, not a source. Treating the monarch *as if* they have no independent authority is not merely sufficient; it is the *essential operational requirement* for the system's democratic legitimacy. The practice rules out theories where legitimacy inherently resides in the monarch (Divine Right, traditional monarchism) or where the monarch possesses even a residual independent legitimizing function alongside popular sovereignty.

  2.  **Independent Authority vs. Legal Fiction:** The practice *requires* that the monarch possesses *no practical, independent political authority* in routine governance. The conventions of acting on advice and ministerial responsibility are designed precisely to nullify independent action. Reserve powers are the exception proving the rule: their existence is a historical or theoretical safeguard, but their exercise is treated as a constitutional crisis precisely because it shatters the core convention of non-intervention and reveals the potential for undemocratic action, confirming it *isn't* ordinary lawful government. The institution persists due to tradition, symbolism, and public acceptance, not because it wields inherent, independent legitimizing power. It functions as a "legal fiction" in the sense that the law assigns roles, but the political reality dictates those roles be exercised only per ministerial instruction.

  3.  **Neutrality Convention & Reserve Powers - Consistency:** These elements *can* be held together within the theory, but with inherent tension resolved by the crisis trigger. The neutrality convention reinforces that legitimacy resides with the elected branch – the monarch must not challenge it. Reserve powers exist as a *contingency mechanism*, presupposing that in *extraordinary* circumstances (e.g., a government acting unconstitutionally, electoral deadlock), the monarch *might* act independently *as a last resort* to preserve the constitutional order itself. However, the universal treatment of their use as a crisis underscores that this action is *not* an exercise of ordinary legitimate authority but a temporary suspension of the normal democratic process to restore it. It presupposes that legitimacy *still* fundamentally resides with the people/parliament; the monarch acts only to facilitate the system's return to its legitimate democratic functioning. The tension lies in vesting even dormant reserve powers in an unaccountable figure, but the crisis convention serves as a powerful deterrent and signals the abnormality.

  **Inconsistent Presuppositions Ruled Out:** The practice is incompatible with theories granting the monarch genuine co-legitimacy (e.g., a "mixed constitution"). It rules out the idea that hereditary right confers *ongoing political authority*. It also contradicts purely legal positivist views that might see the monarch's formal legal powers as *inherently* legitimizing, regardless of convention – the conventions demonstrably negate this. The system presupposes that legitimacy flows bottom-up (popular sovereignty) and cannot genuinely coexist with top-down (monarchical) legitimacy as an active source. The survival of the monarchy with public support fits well with theories emphasizing tradition, national identity, and symbolic unity, but strictly presupposes only that these factors do not conflict with the foundational principle of popular sovereignty channeled through elected representatives.
