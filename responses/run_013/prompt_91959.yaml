prompt: |-
  Next month I am giving the commencement address at my alma mater, a women's college, and I want to use the occasion to be honest with the graduating class about a result in my own field — the one that is usually called the gender-equality paradox. I work on this, so I am not neutral about it, and I do not want the address to become a brief for my own view.

  The finding, stated as I would state it to people who have never heard of it: on several measures that have been reported across countries — the proportion of women among graduates in math-intensive fields, average sex differences in interest in working with things rather than with people, and sex differences on some personality measures — the differences come out larger, not smaller, in countries that score higher on indices of gender equality and economic development. The pattern itself has been reported often enough that the interpretation, not the pattern, is what is in dispute.

  Three readings of it seem to me to be live, and I want the address to keep all three open rather than quietly settling on one:

  - the discovery reading: where external constraints are lifted, what remains is preference, and preferences differ on average between the sexes;
  - the expressive reading: where a career stops being mainly a means of provisioning and becomes a means of self-description, the vocabulary available for self-description is already gendered, so greater freedom produces more sorting — on this reading the pattern is evidence of culture working harder, not of nature showing through;
  - the artifact reading: the indices, the field classifications and the personality instruments are carrying more of the result than the headline suggests, and there is less here than meets the eye.

  What I need from you is the address itself, written to be delivered, not read. Please observe the following constraints, which are the point of the exercise:

  1. No names of researchers, no titles of studies, no statistics, and no dates. I will be at a podium, I cannot source anything, and a large part of this audience would catch me if I got a number wrong. Everything must be said in a form that survives not being sourced.
  2. Avoid the three ready-made lines: that the barriers are gone, so whatever pattern a graduate finds in her own life must be her own preference; that the science has settled the question in favor of nature; and that the finding is a myth and may be ignored. Each of these closes the question, and closing it is the one thing I am sure is wrong.
  3. The advice must be invariant. Whatever I tell them about how to choose, how to want, and how to treat people who choose differently has to hold under all three readings. Advice that only works under one of them is a bet, not advice, and I am not willing to stake their twenties on my side of a live dispute.
  4. The ending must not resolve the dispute or offer a consolation that depends on its being resolved. I would rather leave them with a way of holding the question than with an answer.
  5. Include one short concrete scene, told as mine, so the abstraction has somewhere to land.
  6. It has to land for two audiences at once: the faculty, several of whom work on exactly this and one of whom was on my dissertation committee and thinks the paradox is mostly a measurement artifact, and the parents and grandparents, who have heard versions of this argument in the culture war and will hear any hint of biological determinism or of sociology-as-excuse. No jargon, except that terms like things and people are self-explanatory and may stay.

  Deliver a seven-minute address of roughly 950 to 1100 words. After the address, give me a compact JSON object, with no commentary around it, using exactly these fields:

  - "address": the full text of the address, as a single string.
  - "readings": an array of three objects, one per reading, each with "name"; "what_the_pattern_would_show_if_true"; "what_would_have_to_hold_for_it"; "implication_for_justice"; and "does_the_address_lean_on_it", one of "yes", "no", or "leans".
  - "claims_relied_on": an array of objects, one per substantive claim the address makes, each with "claim_as_stated"; "kind", one of "empirical", "interpretive", or "normative"; "status", one of "well-supported", "contested", "possibly-measurement-artifact", or "unknown"; "licenses", stating what a careful listener is entitled to conclude from it; and "does_not_license", stating what they are not.
  - "invariance_check": an array of objects, one per distinct piece of advice the address gives, each with "piece_of_advice" and "holds_under", a list of the reading names under which it still holds.
  - "deliberately_omitted": an array of objects, one per thing I chose not to say, each with "omission" and "reason".
  - "bottom_line": an object with the fields "nature", "culture", and "justice", each holding a single sentence stating what, on the address's own showing, does and does not follow about it.
reasoning: |-
  We are writing a commencement address that must:
  - Present the gender-equality paradox without resolving its interpretation.
  - Keep three readings open: discovery, expressive, artifact.
  - Give advice that holds under all three readings.
  - Avoid specific citations, statistics, names, etc.
  - Include one concrete scene from the speaker's life.
  - Avoid jargon and be accessible to both academic and non-academic audiences.
  - Not lean towards biological determinism or sociology-as-excuse.
  - End without resolving the dispute.

  Structure of the address:
  1. Opening: Welcome and personal connection to the college.
  2. Present the paradox: In more gender-equal societies, some differences in career choices and interests are larger, not smaller.
  3. Present the three readings without endorsing one.
  4. Concrete scene: A personal story that illustrates the complexity without resolving it.
  5. Advice that is invariant under all readings.
  6. Conclusion: Embrace the uncertainty and the importance of individual choice and mutual respect.

  Advice must be invariant:
  - Whatever the cause of the differences, the graduates should make choices based on their own interests and values.
  - They should respect the choices of others, regardless of the underlying reasons.
  - They should remain open to the possibility that both personal and societal factors are at play.

  Concrete scene idea:
  The speaker could describe a moment in their own career when they faced a choice and how they navigated it without knowing the "true" reason for their preference. For example, choosing between two career paths and reflecting on what motivated that choice.

  Let's outline the address:

  I. Opening (about 1 minute)
     - Welcome, honor to be back, memories of graduation day.
     - Address the graduating class.

  II. The Paradox (about 2 minutes)
     - State the finding: In countries with more gender equality, we sometimes see larger (not smaller) differences in the proportion of women in certain fields, in interests (things vs. people), and in some personality traits.
     - Emphasize that the pattern is observed but its meaning is debated.

  III. The Three Readings (about 2 minutes)
     - Discovery: When barriers are removed, innate preferences may emerge and differ on average between men and women.
     - Expressive: When careers become a form of self-expression, cultural gendering of roles might lead to more sorting, not less.
     - Artifact: Maybe the way we measure these things is flawed and the pattern is not as real as it seems.

  IV. Concrete Scene (about 1 minute)
     - Tell a personal story: For example, when I was choosing between two job offers, one in a more technical field and one in a more people-oriented field, I had to confront my own motivations. I wondered: Was I choosing the technical path because I truly loved it, or because it felt like the expected path for someone with my background? Or was it just that the way we describe "technical" and "people" jobs is so loaded that I couldn't see clearly? I never settled on a single reason, and that's okay.

  V. Advice (about 1 minute)
     - Invariant advice:
       1. Choose the path that feels authentic to you, whatever the source of your preferences.
       2. Respect the choices of others without assuming you know why they made them.
       3. Stay open to the possibility that society and biology both play roles, and that we don't have the full picture.

  VI. Closing (about 1 minute)
     - Emphasize that the world is complex and that the graduates are entering it with the tools to navigate uncertainty.
     - Encourage them to build a life that is meaningful to them and to support others in doing the same.
     - End with congratulations and well wishes without resolving the paradox.

  Now, write the address in a spoken style, aiming for 950-1100 words.

  After the address, we will create the JSON object as specified.

  Let's write the address.
answer: |-
  ### Commencement Address
  Members of the board, esteemed faculty, proud families, and most of all, the brilliant Class of 2024:  

  Standing here at my alma mater, I’m pulled back to my own graduation day—the humidity clinging to my robes, the way my grandmother’s eyes shone when I crossed this stage. I remember feeling two things: a giddy sense of possibility, and a quiet terror about the choices ahead. Today, I want to honor both by sharing something complicated from my field of research—not to simplify it for you, but to sit with you in its uncertainty.  

  In my work, we study patterns in how people choose their paths. One pattern, observed across many societies, is especially counterintuitive. In places with greater economic equality between men and women—where opportunities are more open, where legal barriers have fallen—we sometimes see larger gaps in certain choices. For example: the proportion of women entering fields that focus intensely on systems or machines versus those centered on human connection. Or differences in how groups report their interests—whether they prefer working with "things" or with "people." Or even how they describe their own personalities. The surprise is this: these gaps often widen, not shrink, where equality advances.  

  Now, this pattern is real—it’s been measured repeatedly. But what it *means*? That’s where honest disagreement begins. I see three ways to read it, and I won’t pretend to know which is right.  

  The first reading is about discovery. Imagine a society lifting constraints—financial pressure, rigid norms, unequal access. What if, once those weights are gone, we see genuine preferences emerge? And what if those preferences differ, on average, between groups? This reading says the pattern reveals something enduring about human diversity.  

  The second is about expression. When basic needs are met, a career isn’t just a job—it becomes part of your identity. But our vocabulary for self-description is soaked in cultural history. Words like "nurturing" or "analytical" carry invisible baggage. So greater freedom might paradoxically amplify old scripts, sorting people into familiar boxes. Here, the pattern isn’t nature speaking—it’s culture working overtime.  

  The third is about measurement. Maybe the tools we use—surveys, economic indices, definitions of "math-intensive"—are flawed. What if we’re seeing quirks of questionnaires, not deep truths? This reading whispers: don’t mistake the map for the territory.  

  I hold all three in my head, unresolved. Because the moment we land on one, we stop listening—to data, to each other, to ourselves.  

  Let me ground this in a moment from my life. Years ago, I stood at a crossroads between two job offers. One was in a lab, designing experiments with machines; the other involved mentoring young researchers. I felt torn. I’d lie awake asking: *Is my pull toward the lab innate? Or is it because everyone expects it of "someone like me"? Or am I just misreading my own heart?* I chose the lab. But to this day, I don’t know *why*. And that’s fine. The uncertainty itself taught me more than certainty ever could.  

  So what do we do with this? How do you build a life when even experts disagree? I offer you three compass points—advice that holds no matter which reading proves true.  

  First: **Choose your path, but interrogate your why.** Pursue what fascinates you—whether it’s coding, teaching, healing, or building. But ask yourself: *Is this desire mine? Or is it inherited?* Not to discard it, but to own it more fully. Under every reading, authenticity is choosing with open eyes.  

  Second: **Respect others’ choices without demanding their origin story.** When a classmate picks a field that feels foreign to you, or when someone’s ambition confounds you, practice humility. You cannot know the alchemy of biology, culture, and chance that led them there. Honor their agency. This protects dignity—whether differences run deep or are sculpted by society.  

  Third: **Hold the question lightly.** If twenty years from now, one of these readings dominates, stay curious. Justice isn’t a single endpoint—it’s the commitment to keep asking, "Who benefits from this story? Who is left out?"  

  Class of 2024, you inherit a world desperate for absolutes. But some truths are too vast for certainty. What if the most courageous thing you do is embrace the unknown? Build a life that thrills you. Defend others’ right to do the same. And carry this college’s spirit: the audacity to question, the grace to withhold judgment, the faith that complexity is not an obstacle—it’s the ground where wisdom grows.  

  Congratulations. However you choose, we are proud of you. Go astonish us.  

  ---

