prompt: |-
  Ok, I could use a second opinion on something. My office neighbor is a semanticist -- old-school externalist, thinks internalism about content is basically dead -- and for the last year or so I've been keeping a running list of her verdicts on cases, because I want to figure out what rule she's actually running rather than the one she says she's running. Now I have a new case I want to spring on her, and I'd like to know what she's going to say before I do it.

  Her verdicts so far:

  - The standard Twin Earth thing. Oscar and his twin say the same-sounding things; she says they mean different things, and each of them is right about his own stuff. So internalism about content is out.
  - The Gödel/Schmidt business. The speaker's only grip on the name is a description that the wrong guy happens to satisfy. She says the name still refers to Gödel. Descriptions aren't doing the work.
  - Elm/beech. A guy who couldn't tell an elm from a beech to save his life still means elms by 'elm'. She says he defers, and deference counts.
  - The arthritis-in-the-thigh case. The patient's usage is idiosyncratic -- he thinks you can get arthritis in the thigh -- and she says his word means what the medical community's word means, so what he says is false. Individual usage doesn't fix reference.
  - One I made up for a seminar, which she went along with: a fur-trading town where the trappers who coined the word for the animal had never seen a whole one, only pelts, and their beliefs about it were mostly wrong (they thought it was a kind of aquatic cat). She says the word refers to the marten -- not to any aquatic cat, not to nothing. So the thing, not the beliefs of whoever introduced the term, is doing the work.

  Notice the problem: at least two rules fit all five of those. (i) The causal-historical chain rule: reference is fixed by whatever the term was originally grounded in and rides down the chain of use. (ii) The community/environment rule: reference is fixed by whatever the linguistic community's practice and the local environment make the term out to be. Both fit every case above, because in every case the original grounding and current community practice point at the same thing. Which is annoying, and is exactly why I need the new case.

  Here it is. On an island, 'mora' has been used for centuries for the fruit of one particular tree. Long ago traders brought a different tree with fruit that's indistinguishable in taste and use; the original tree died out on the island; nobody remembers any of this; there are no experts and no written record; today the islanders just call the new fruit 'mora'. An islander says mora are sweeter this year. What does she say 'mora' refers to? Chain rule: the original fruit, now extinct -- so either the word names a kind that no longer exists or it names nothing and the islanders' claims are false. Community rule: the new fruit, and the islanders are right.

  What I want from you: which rule you think she's running, your best guess at her verdict on mora and your reasons, and which further case would actually settle it. My own inclination is that the discriminator is to keep the original kind around -- same setup, but the old tree is still growing there, and when you show the islanders one they say 'that's not mora, that's the old tree.' If she says 'mora' still means the old fruit, she's a chain person; if she says it means the new one, she's a community person. Tell me if there's a better discriminator, and whether you think she'd wriggle out of the mora case by saying the chain got severed or that the term goes empty when the kind dies out. Also, is there a third rule that fits all five of her verdicts and predicts something different again? If so, what does it say about mora, and what case kills it?

  No citations, I know the literature. Be casual in tone but precise about which rule gives which verdict and why -- I'll be using this to set up the argument in class. Last line should be the extraction-friendly bit: \answer{...} with your predicted referent for 'mora' and a two- or three-word label for the rule you think she's running.
reasoning: |-
  Okay, let me tackle this user's problem. They've been observing their office neighbor, a semanticist with externalist views, and have collected her verdicts on several thought experiments. The user wants to predict her response to a new case involving the term "mora" on an island where the original fruit is extinct but the community now uses the term for a new fruit. The goal is to determine whether she follows the causal-historical chain rule or the community/environment rule. 

  First, I need to recall the key points from the user's cases. The semanticist rejects internalism, as seen in Twin Earth. She supports direct reference over descriptivism in Gödel/Schmidt. Deference to community expertise is clear in the elm/beech and arthritis cases. The fur-trading example shows original grounding fixes reference despite false beliefs. 

  Both rules fit all five cases because original grounding and community practice align. The "mora" case is designed to create conflict: the original fruit is extinct, so the chain rule would either refer to nothing or the extinct kind, while the community rule points to the current fruit. 

  The user's proposed discriminator involves a scenario where the original tree still exists, but islanders call it "old tree." That might work, but the "mora" case alone could be decisive. The semanticist might avoid the chain rule's consequence by arguing the term refers to the current fruit, suggesting she prioritizes community practice. 

  Looking at her past verdicts, deference to community is strong in arthritis and elm/beech cases. In the fur-trading example, original grounding was key, but community practice wasn't conflicted there. In "mora," the community's current use is consistent, which might lead her to side with them. 

  A third rule? Maybe a hybrid where reference is fixed by original grounding but shifts if the community adopts a new kind without realizing. But that might not fit the arthritis case, where individual error doesn't change reference. 

  Prediction: She'll say "mora" refers to the new fruit, following the community rule. Her pattern shows deference to communal use, even over individual misconceptions. The fur-trading case emphasized original grounding, but since the community now uses "mora" for the new fruit without any conflict, she'll prioritize current practice. 

  Further test: Introduce a case where experts exist but are wrong. If she sides with experts, it's community deference; if she looks to origins, it's chain-based. But for now, "mora" should settle it. 

  Final Answer: \answer{new fruit, community rule}
answer: |-
  Based on her verdicts, she's consistently prioritizing **current community practice and environmental interaction** over historical chains or individual beliefs. Here's the breakdown:

  - **Twin Earth**: Environment determines content (H₂O vs. XYZ), not internal states.  
  - **Gödel/Schmidt**: Reference isn't hostage to individual descriptive failures; it's anchored externally.  
  - **Elm/beech**: Deference to community expertise overrides individual ignorance.  
  - **Arthritis**: Community usage trumps idiosyncratic beliefs.  
  - **Fur-traders**: Original grounding fixes reference *despite* false beliefs, but crucially, the community *intended* to name a real-world animal, and their successors *maintain* that practice.  

  In your **mora case**, the community *unwittingly switched* to a new fruit. The chain rule would say "mora" refers to the extinct original (leading to widespread falsity). The community rule says "mora" now refers to the new fruit (allowing true claims like "mora are sweeter"). **She'll side with the community rule**: "mora" refers to the new fruit. Why?  
  - Her arthritis/elm verdicts show she cares about *present* communal use, not preserving reference through error.  
  - The fur-traders case emphasized original grounding, but only because the community *never abandoned* their referential target (they always meant *that animal*). Here, the islanders *did* shift practice—they’d reject the original fruit as "not mora" if shown it.  
  - She’ll likely say the historical chain *severed* when the original fruit vanished and the community adopted a new kind without continuity. No "empty term" conclusion—she’d hate rendering all islanders’ utterances false.  

  **Your discriminator case is solid**, but the mora case alone might suffice. If you show islanders the original tree (still extant) and they say "that’s not mora," she’d *still* say "mora" refers to the new fruit. Why? Community practice dominates.  

  **Third rule?** A **hybrid "anchoring + community preservation"** rule: reference is fixed by the original sample *and* maintained only if the community intends the same kind. Fits all five:  
  - Twin Earth: same anchoring, different environments.  
  - Gödel/Schmidt: anchored to Gödel, not Schmidt.  
  - Elm/Arthritis: community preserves the anchored kind.  
  - Fur-traders: anchored to martens, not cats.  
  **Mora verdict**: Refers to the *original* fruit (anchoring), but since the community abandoned it, the term is empty or false. **Kill it with**: A case where experts *knowingly* switch the reference (e.g., biologists redefining "planet" post-Pluto). If she says "planet" now excludes Pluto, she’s community rule; if not, hybrid. But she’d likely side with experts—community wins.  

  **Prediction for mora**: She’ll say it refers to the new fruit. Her pattern screams deference to *current, stable community practice* in a shared environment.  

  \answer{new fruit, community rule}
