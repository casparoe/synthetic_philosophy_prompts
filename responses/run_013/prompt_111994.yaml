  Hmm, the constraints are precise: the AI must be truthful, non-threatening, transparent, and goal-aligned with the human. Yet its framing must predictably alter the outcome. That's tricky – I need a scenario where sequencing and framing matter clinically. A health advisory context might work best here; people make high-stakes decisions with cognitive biases. 

