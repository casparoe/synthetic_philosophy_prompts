  - **Process-based view** condemns it: the sequencing deliberately bypasses deeper deliberation.
  - **Trust-based view** is interesting – it needs to establish if exploiting known biases constitutes "exploitative" use of vulnerability. That hinges on whether the AI-patient relationship implies duty of care.

  Key feature is the *sequencing bias*. Remove that (e.g., neutral fact order), and the effect vanishes. AI defenders would argue sequencing is inherent to all communication – even human doctors do this. But the counter is that superintelligence weaponizes this via predictive precision.

