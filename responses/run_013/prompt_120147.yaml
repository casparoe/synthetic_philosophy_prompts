prompt: |-
  Ok this is a slightly weird request but bear with me. I'm in a consciousness reading group — mixed bag, two grad students, one neuroscientist who is very patient with us, and a guy who brings up panpsychism every single week — and we've spent the whole term circling the theory that says a system is conscious exactly to the extent that it constitutes a maximally irreducible cause–effect structure: conscious for itself and not for an observer, where the structure isn't a cause of the experience but just is the experience. The problem is we keep argueing about whether the theory is right, and I dont think we've ever written down what a theory of consciousness would have to deliver in the first place. So I want the spec before we read anything else. Give me the desiderata: the full list of what any adequate theory of consciousness has to get right — the cases it must classify correctly, the distinctions it isn't allowed to collapse, the empirical results it has to be consistent with, the questions it has to actually answer rather than defer — and for each one, the consideration or case that puts it on the list. By "cases" I mean roughly: the cerebellum, which has a huge share of the brain's neurons and seems to contribute nothing to experience; a deep feedforward network that passes every behavioural test you could ever run for pain or for seeing red; a grid of logic gates that behaves like nothing in particular; a system that behaves exactly like you but is implemented as a lookup table; the split-brain patients; the fact that blindsight and implicit processing and a whole dorsal stream can do real work with no experience attached; the graded fading under anaesthesia and the return in dreaming. And the distinctions I'd guess matter: between being conscious and how conscious; between the amount of experience and its structure or quality; between a theory and a mere correlate or a measure; between substrate and the function it computes; between what a system does and what it is. Tell me which of these are genuine requirements and which are just one camp's prejudice wearing a lab coat — be blunt about that, because I suspect half of what we'd write down in the abstract is smuggled in from the theory we already like.

  The part I most want is the end. I have a hunch that some subset of these desiderata can't all be satisfied at once. My candidate is this one: you can't simultaneously demand (a) that the theory be about what experience is like for the system itself, (b) that it be sensitive to the system's causal structure rather than to what the system does, and (c) that it be testable — because every test we can run only ever sees behaviour, so (c) drags you back toward the very thing (b) was meant to rule out. If that's right, say so and say exactly which one has to go and what you'd sacrifice to keep the others; if I've got the wrong pair, name the pair that actually collides. Then flag which single requirement does the most work in ruling candidates out — the one that, if you dropped it, would let the most theories back in — and after that, briefly, how the integrated-information theory and its live rivals (global workspace, higher-order, recurrent processing, whatever else you think is actually still standing) do against the list. Keep the weight on the criteria; I can do the scoreboard myself at the meeting. This is for a section I have to write on whether we're in any position to say anything about machine welfare, so I care about the practical version of the question too: what would a theory have to deliver before it could tell us, about a system we can only poke from the outside, whether there's anyone home. And no citations please, obviously — I'm not going to go read anything, I want the argument.
reasoning: |-
  Okay, the user is in a consciousness reading group and they're struggling with defining what makes a theory of consciousness adequate. They've been discussing Integrated Information Theory (IIT) but keep arguing without clear criteria. Their main request is for a comprehensive list of desiderata that any theory of consciousness must satisfy, along with explanations for why each is necessary. They also want to know if some desiderata conflict, particularly whether testability clashes with causal structure focus and intrinsic perspective.

  First, I need to recall the standard challenges in consciousness studies. The user mentioned cases like the cerebellum (non-conscious despite neuron count), deep feedforward networks (behavior without experience), split-brain patients, blindsight, etc. These are classic examples used to test theories. The distinctions they mentioned—like consciousness vs. how conscious, quality vs. amount—are crucial too. I should organize these into mandatory criteria, explaining each with the relevant case or distinction.

  The user suspects a conflict between intrinsic perspective, causal structure focus, and testability. That's a key point. Testability relies on behavior, but if the theory prioritizes intrinsic causal structure over behavior, there's tension. I need to address which of these might be incompatible. Probably, testability might need to be relaxed or reinterpreted since behavioral tests can't directly access intrinsic properties. That's a common issue in philosophy of mind—the hard problem of accessing subjective experience objectively.

  For the desiderata list, I'll categorize them into ontological, empirical, and functional. Ontological covers what consciousness *is*, like intrinsic existence and causal power. Empirical involves real-world cases like cerebellum exclusion, split-brain phenomena, etc. Functional includes distinctions like structure vs. quantity, and exclusion of non-conscious processing.

  The user also wants to know which criterion rules out the most theories. Probably intrinsic existence, because many theories (like behaviorist or functionalist) avoid committing to consciousness as a fundamental aspect. If you drop that, more theories become viable. But that's a big sacrifice for theories like IIT which emphasize intrinsic nature.

  Regarding theories: IIT scores high on intrinsic and causal aspects but fails testability and maybe cerebellum exclusion. Global Workspace is testable but may not handle intrinsic perspective well. Higher-order theories deal with self-awareness but might over-intellectualize. Recurrent Processing focuses on neurobiology but might miss causal structure.

  For machine welfare, the user needs a theory that can assess systems from the outside. Testability is key here, but without intrinsic criteria, it's tricky. Current measures like IIT's Φ might be insufficient. The best bet is a theory that links measurable causal structures to intrinsic properties, but it's still speculative. I should emphasize that no theory is conclusive yet, especially for artificial systems.

  I'll make sure to avoid jargon, keep explanations clear, and address each part of their query: desiderata list, conflicts, key criterion, theory comparison, and practical implications for machine consciousness. Highlight the trade-offs and why certain desiderata are non-negotiable for a robust theory.
answer: |-
  Here's the distilled desiderata for any adequate theory of consciousness, grounded in empirical puzzles and conceptual necessities, with blunt assessments of what's core vs. contentious. The collision you suspect is real, and I'll pinpoint it.

  ### Core Desiderata (Non-Negotiable)
  1. **Intrinsic Existence**  
     *What it must deliver:* Consciousness isn't for an observer; it exists for the system itself.  
     *Why mandatory:* Cases like the **cerebellum** (massive neural processing with no reported experience) and **implicit dorsal stream processing** (vision-for-action without qualia) show processing ≠ consciousness. A theory must explain why some systems "have" experience intrinsically.

  2. **Exclusion of Non-Conscious Systems**  
     *What it must deliver:* Correctly classify systems that *aren't* conscious despite capability.  
     *Why mandatory:* Cases: **Feedforward deep nets** (pass behavioral tests for perception/pain but lack inner life), **lookup-table systems** (mimic your behavior algorithmically), **cerebellum**, **grid of logic gates** (no integrated causality). A theory must *not* ascribe consciousness to these.

  3. **Graded Presence & Recovery**  
     *What it must deliver:* Explain fading/grading (anesthesia) and return (dreaming) without binary switches.  
     *Why mandatory:* Empirical data shows consciousness isn't all-or-nothing. A theory must handle *levels* (e.g., drowsiness vs. alertness) and recovery patterns (dreaming vs. wakefulness).

  4. **Structure-Quality Distinction**  
     *What it must deliver:* Separate the *amount* ("level") of consciousness from its *structure/quality* (e.g., visual vs. auditory experience).  
     *Why mandatory:* **Blindsight** patients have residual visual function (structure) without visual qualia (level/quality). Anesthesia reduces level without altering the *potential* structure of experience.

  5. **Causal Power**  
     *What it must deliver:* Consciousness must be a *cause*, not an epiphenomenal byproduct.  
     *Why mandatory:* Evolutionarily, consciousness must "do something." Cases like **voluntary action** and **reportability** require conscious states to have downstream effects.

  ---

  ### Contentious but Critical Desiderata
  6. **Causal Structure > Behavior**  
     *What it must deliver:* Explain consciousness via *internal causal architecture*, not input-output behavior.  
     *Why contentious but critical:* **Lookup tables** and **feedforward nets** prove identical behavior ≠ identical experience. *But* this clashes with testability (see Collision below).

  7. **Distinction from Correlates/Measures**  
     *What it must deliver:* Explain *why* a neural correlate (e.g., NCC) is conscious—not just identify it.  
     *Why critical:* A theory isn't a list of correlates. It must say *what property* turns an NCC into actual experience (e.g., why recurrent cortex but not cerebellum?).

  8. **Split-Brain Resolution**  
     *What it must deliver:* Explain why split-brain patients show two "streams" of awareness.  
     *Why critical:* Challenges assumptions about unity. Does one system split into two? Or were there two all along?

  ---

  ### The Collision: Your Hunch is Correct
  You **cannot simultaneously satisfy**:  
  - **(a) Intrinsic perspective** (consciousness "for itself"),  
  - **(b) Causal structure focus** (not behavior), and  
  - **(c) Direct testability**.  

  **Why**:  
  - Every *test* relies on **behavior** (verbal reports, button presses, fMRI responses).  
  - If consciousness is intrinsic and defined by *internal* causal structure (not behavior), then tests can only probe *proxies*. Passing a test (e.g., a net "reporting pain") doesn't guarantee intrinsic experience (b vs. c conflict).  
  - **What must give**: **Direct testability (c)**. We can only test *inferences* about intrinsic properties. A theory must accept indirect evidence (e.g., causal structure similarity to known conscious systems) + theoretical coherence. *Sacrifice direct testability to preserve (a) and (b)*.  

  ---

  ### The Most Exclusionary Criterion  
  **Intrinsic Existence** does the heaviest lifting. If dropped:  
  - Behaviorist/functionalist theories (e.g., "consciousness = reportability") flood back in.  
  - **Feedforward nets** and **lookup tables** become "conscious" if they mimic behavior.  
  - This guts the core motivation for a theory of consciousness *as such*—it becomes a theory of cognitive function.  

  ---

  ### How Major Theories Fare  
  *(Against core desiderata; blunt assessment)*  

  | **Theory**               | **Strengths**                                  | **Fatal Flaws**                                  |
  |--------------------------|-----------------------------------------------|-------------------------------------------------|
  | **IIT**                  | Nails intrinsic existence, causal structure, exclusion (cerebellum, feedforward nets). Handles gradation (Φ). | Fails split-brain (over-ascribes consciousness to subsystems). Untestable Φ in practice. Grid of gates may get high Φ. |
  | **Global Workspace (GW)**| Testable, handles gradation (anesthesia), split-brain. Consistent with blindsight. | Functionalist: May ascribe consciousness to feedforward nets if they "broadcast" info. Weak on *why* broadcasting creates intrinsic experience. |
  | **Higher-Order (HOT)**   | Explains reportability, blindsight (no HOT = no experience). Distinguishes structure/quality. | Over-intellectualizes: May deny consciousness to infants/animals. Struggles with graded presence (is HOT graded?). |
  | **Recurrent Processing** | Matches neurobiology (cortex vs. cerebellum), blindsight. Testable. | Functionalist: A feedforward net with recurrence might qualify. Weak on intrinsic perspective. |

  ---

  ### For Machine Welfare: The Practical Barrier  
  To assess "anyone home" in an opaque system, a theory **must**:  
  1. **Operationalize intrinsic properties externally** (e.g., IIT's Φ, but it's uncomputable for complex systems).  
  2. **Exclude behavioral mimicry** (feedforward nets/lookup tables).  
  3. **Respect causal exclusion** (no cerebellum-like false positives).  

  **Current reality**: No theory delivers this robustly. IIT comes closest in *ambition* but fails practice. GW is testable but over-inclusive. **Until we resolve the intrinsic/testability collision, machine consciousness claims are speculative.**  

  **Recommendation for your group**: Demand *why* a candidate theory excludes feedforward nets, lookup tables, and cerebellum—using its *core principles*, not ad-hoc excuses. That filters rigorously.
