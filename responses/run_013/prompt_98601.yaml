answer: |-
  The night shift at Kelso’s Garage was Lena’s kingdom of entropy. She read it in the spreading sheen of oil on concrete, the deepening crack in the hydraulic lift’s piston, the way dust motes settled inevitably onto every surface left undisturbed for an hour. She knew the sequence: a dropped wrench clanged *once*, then settled into vibrating silence; heat bled from the engine block outwards into the cooler air; a fresh dent in a fender remained sharp-edged before slowly softening under filler and paint. Time’s direction was written in rust and dispersal. She trusted it implicitly.

  Until the bearing.

  It came in a dented parts box for a ’92 Land Rover, unremarkable except for its provenance: salvaged from a wreck submerged for years. Standard procedure dictated cleaning, inspection, then the bin or the rebuild queue. Lena dropped it into her ultrasonic cleaner – a bath of warm, churning solvent designed to *loosen* grime, to coax it *away* from the metal.

  Ten minutes later, she lifted it out. Instead of the expected gritty residue swirling in the tank, the solvent was unnervingly clear. The bearing itself… gleamed. Not just clean, but *new*. The microscopic pitting she’d noted under the magnifier was gone. The faint scoring on the inner race? Vanished. The metal felt smoother, colder, under her fingertip than when it went in. A thin film of grease, impossibly, seemed to be *retreating* into the bearing’s core, not leaching out.

  She ran the cleaner again. Longer. Hotter. The bearing emerged pristine, impossibly pristine. The solvent remained spotless. No grime rose. It was as if the cleaner wasn't washing filth *off*, but somehow… pulling the bearing back *through* its own history of contamination, reversing the very process she’d initiated.

  Lena placed it on her workbench. She watched. Dust motes, falling lazily through the overhead light beam, seemed to hesitate near it, then veer away. A tiny smear of grease she deliberately touched to its outer ring didn’t spread or soak in; it shivered, coalesced, and after an hour, was simply… gone. Absorbed. As if the bearing were remembering its factory-fresh state and forgetting its years of wear.

  Her certainty began to fray. Turning a wrench, she hesitated. Did applying torque now *cause* the bolt to tighten, or was she merely fulfilling an event that, from the bolt’s perspective, was already fixed? The rhythmic groan of the ancient compressor down the hall sounded less like a machine straining forward and more like an echo fading backwards. She looked at her notes from earlier – scribbles about the Land Rover’s seized caliper. Did she write that *after* diagnosing it, or… *before* she’d even lifted the hood? The ink seemed both fresh and ancient.

  She tried to document the bearing. "Exhibit A: Grease film retracts under observation." But as she wrote, the words felt like predictions, not records. Would the grease *really* retract? Or had it *already* retracted, and her writing was just catching up? The line between anticipating what the bearing would do and remembering what it had done dissolved into a nauseating fog. Fixing a wiring harness, she touched a frayed end. A spark jumped. Did she cause the spark by connecting the wire? Or had the spark, leaping backwards from its moment of extinction, compelled her hand to complete the circuit?

  The world outside the grease-smudged windows remained stubbornly normal. Headlights traced their forward arcs on the wet street. The neon sign across the road flickered its decay. But inside the garage, around that single, impossible bearing resting on the bench, the gradient tilted. Lena felt unmoored. Her own memories – the oil change she’d done at 10 PM, the coffee she’d spilled an hour ago – felt suspect. Were they anchors in the past, or… instructions for the future? Had she chosen to clean the bearing, or was the bearing’s uncanny reversal pulling her actions backwards along its own improbable timeline?

  She stopped writing notes. Words fixed nothing. Instead, she found a small, heavy-duty parts case, lined it with fresh foam. She lifted the bearing carefully, its unnervingly smooth surface cool against her skin. Placing it inside, she sealed the lid with thick tape. Locked it away. The silence of the garage pressed in, thick with the hum of refrigerators and the slow decay of everything. Lena sat on her stool, staring at the sealed box. She didn’t know if she was waiting for something to happen, or remembering something that already had. The difference no longer mattered. The arrow, for her, in this lonely corner of grease and metal, had snapped.
