answer: |-
  Your friend most plausibly invoked the proverb first as a claim about the *illegitimacy of external moral condemnation* and second as a claim about an *obligation to conform*, but these rely on distinct and incompatible readings, with the slide from non-judgment to participation being his own unwarranted invention rather than inherent to the proverb.

  ### The Menu of Readings for "When in Rome, Do as the Romans Do"  
  **1. Pragmatic Etiquette (Mere Manners)**  
     - **Claim**: Adjust superficial behavior (e.g., dress, greetings) to avoid offense or friction, ensuring smooth social interaction.  
     - **Status**: Platitude. Universally defensible for trivial customs (e.g., using local table manners).  
     - **Holder**: Cultural diplomats, travelers prioritizing harmony. Irrelevant to deep rituals like funerary rites.  

  **2. Prudential Self-Preservation**  
     - **Claim**: Conform to local norms to evade danger, punishment, or exclusion (e.g., complying with laws to avoid arrest).  
     - **Status**: Defensible and substantive for safety-critical contexts.  
     - **Holder**: Realists in hostile environments (e.g., merchants in foreign ports). Fails if the rite poses no threat to the narrator.  

  **3. Epistemological Humility (Limits of Understanding)**  
     - **Claim**: Outsiders lack the cultural context to *fully comprehend* a practice, so judgments are presumptuous or shallow.  
     - **Status**: Defensible and substantive. Aligns with Montaigne’s critique of ethnocentrism.  
     - **Holder**: Anthropologists, cultural relativists. Does *not* forbid criticism but demands deep engagement first.  
     - **Test Case**: Your narrator, torn between repulsion and admiration, exemplifies this tension—he may grasp facets but not the whole.  

  **4. Moral Non-Judgment (Suspension of Condemnation)**  
     - **Claim**: Cultural differences invalidate *external moral critiques*; "barbarism" is a biased label. What is "degrading" is culturally specific.  
     - **Status**: Defensible but contested. Requires rejecting universal morality.  
     - **Holder**: Relativists like Montaigne (in his essay’s spirit). Distinguishes *understanding* from *endorsement*—does not compel participation.  

  **5. Conformity as Moral Obligation (Duty to Participate)**  
     - **Claim**: Guests/outsiders *must* adopt local customs to show respect, integrate, or honor the community’s values. Refusal is immoral.  
     - **Status**: False or radically overreaching. Conflates respect with capitulation, ignoring personal conscience.  
     - **Holder**: Authoritarian communitarians or misinterpreters of "respect." Contradicts readings 3–4 by demanding active compliance.  

  **6. Radical Moral Relativism (Custom Defines Truth)**  
     - **Claim**: Morality is *constituted* by local practice; "right" means "what Romans do here." Thus, non-participation is objectively wrong.  
     - **Status**: False and self-undermining (it condemns universal judgments universally).  
     - **Holder**: Few serious philosophers; often a straw man. Erases the narrator’s moral agency.  

  ### Your Friend’s Moves and the Proverb’s Limits  
  - **First Use** (against calling the rite "degrading"): Likely invoked **Reading 4 (Moral Non-Judgment)**. He implied the narrator’s disgust stems from prejudice, not objective truth. Defensible if grounded in humility (Reading 3), but he oversimplified to silence critique.  
  - **Second Use** (demanding participation): Leaned on **Reading 5 (Conformity as Obligation)** or **Reading 6 (Radical Relativism)**. This asserts a duty to act, not just refrain from judging.  
  - **The Slide**: The proverb *does not license* moving from "don’t condemn" to "you must join." Readings 3–4 emphasize *restraint in judgment*, not *action*. Reading 5 is a separate, dubious claim. Your friend smuggled in a moral obligation the proverb doesn’t contain—his own invention. A Montaignean would reject this: one can withhold scorn while abstaining from acts violating personal integrity. Your narrator’s dual revulsion/admiration suggests he *could* engage Reading 3 ("I lack standing to condemn") without accepting Reading 5 ("I must eat the dead"). The proverb’s core is adaptation, not surrender.
