prompt: |-
  I run the research desk at a small human rights documentation outfit -- five of us, no lawyer on staff, and our country reports get quoted by journalists and diplomats. A few times a year we have to decide whether to use the word genocide about a situation we're documenting, and honestly we keep making it up as we go. I want a decision procedure my team can actually run in a day or two and still defend six months later.

  Two things have to be in it, because they pull in different directions. First, the word as Lemkin built it was about destroying a group's way of life -- its political and social institutions, culture, language, national feeling, religion, economic existence -- and replacing it with the perpetrator's own pattern, which is a lot broader than what most people picture. Second, the 1948 convention version is much narrower: it needs specific intent to destroy, in whole or in part, a national, ethnic, racial or religious group as such, and the acts basically come down to killing, serious bodily or mental harm, conditions of life meant to destroy the group, preventing births, and taking children. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a clean no, and where it hands the call to our board because the question is values or politics rather than facts. Say which steps need evidence we won't realistically have in two days, and what to do when it's missing.

  Then run it on three cases: a state that has killed nobody but is steadily erasing a minority's language, monuments and churches while settling its own people onto the land; a massacre of 400 villagers where we can't find anything showing intent to destroy the group rather than crush a rebellion; and a government wiping out an armed political movement and its families, where publishing the word would probably get our two local staff arrested. I expect to dislike at least one of the verdicts. Also tell me what the procedure can't do -- where it will misfire, and where the honest answer is that we're making a political choice and dressing it up as a finding. I dont want a reading list, we need this usable tomorrow.
reasoning: |-
  We are designing a decision procedure for determining when to use the term "genocide" in reports. The procedure must balance the broader Lemkin conception (which includes destruction of a group's way of life) with the narrower 1948 Convention definition (which requires specific intent and specific acts). The procedure must be executable in 1-2 days and defensible months later.

  Key elements from the 1948 Convention (Article II):
  - Acts: killing, causing serious bodily or mental harm, deliberately inflicting conditions of life calculated to bring about physical destruction, imposing measures to prevent births, forcibly transferring children.
  - Intent: specific intent to destroy, in whole or in part, a national, ethnic, racial, or religious group, as such.

  Lemkin's broader concept: destruction of the group's way of life (political and social institutions, culture, language, national feeling, religion, economic existence) and replacement with the perpetrator's pattern.

  The procedure must:
  1. Be step-by-step, with clear questions.
  2. Specify what counts as a sufficient answer for each step.
  3. Indicate where the procedure stops with a clear "no".
  4. Identify where the decision must be escalated to the board because it involves values or politics rather than just facts.
  5. Note steps where evidence is typically hard to get in two days and what to do in such cases.

  We structure the procedure in two main phases:
  - Phase 1: Check the 1948 Convention definition (legal threshold). If this is met, then it's a clear case of genocide without needing to go to the board (unless there are overriding political risks that the board must weigh). If not, then proceed to Phase 2.
  - Phase 2: Check for Lemkin's broader concept. If met, then the decision to use the term becomes a values/political call that must go to the board because it goes beyond the legal definition and may be contested.

  Phase 1: Convention Definition
     Step 1: Is there a protected group? (national, ethnic, racial, or religious)
        - Sufficient: Evidence that the victims are part of such a group.
        - If no: Stop. Not genocide under the Convention. Proceed to Phase 2 to check Lemkin.
        - Evidence: Usually available in 2 days (e.g., group identity is known).

     Step 2: Are any of the prohibited acts occurring? (killing, serious bodily/mental harm, conditions of life intended to destroy, preventing births, transferring children)
        - Sufficient: Evidence of one or more of these acts.
        - If no: Stop. Not genocide under the Convention. Proceed to Phase 2.
        - Evidence: May be available (e.g., reports of killings, mass graves, systematic rape, forced sterilization, etc.). If missing in 2 days, note the gap and proceed to Phase 2, but also flag that without these acts, the Convention definition fails.

     Step 3: Is there specific intent to destroy the group, in whole or in part, as such?
        - Sufficient: Direct evidence (e.g., orders, policy documents, speeches) or circumstantial evidence (e.g., systematic nature of acts, targeting of group-specific attributes, scale, context).
        - If no: Stop. Not genocide under the Convention. Proceed to Phase 2.
        - Evidence: Often the hardest to get in 2 days. Look for patterns: are the acts only happening to this group? Is there a pattern of destruction that can only be explained by intent to destroy the group? If evidence is missing, note that intent is unproven and the Convention definition fails.

     If all three steps are satisfied, then the Convention definition is met. However, even if met, there might be overriding risks (like safety of local staff) that require board input. But the factual determination is clear.

     If the Convention definition is met, the procedure recommends using the term. However, if there are exceptional risks (e.g., in the third case: arrest of local staff), then the decision to publish the term (despite the facts) goes to the board for a risk-benefit assessment.

  Phase 2: Lemkin's Concept
     Step 4: Is there an attack on the group's way of life? (systematic destruction of political/social institutions, culture, language, national feeling, religion, economic existence, and replacement with the perpetrator's pattern)
        - Sufficient: Evidence of systematic erasure of the group's distinct identity and replacement by the perpetrator's.
        - If no: Stop. Not genocide even in the broader sense.
        - Evidence: May be available (e.g., banning language, destroying cultural sites, forced assimilation, land confiscation and settlement). If missing, then stop.

     Step 5: Is the attack intended to destroy the group as a distinct entity?
        - Sufficient: Evidence that the perpetrator aims to eliminate the group's distinctiveness and replace it with their own pattern.
        - If no: Stop. Not genocide in the broader sense.
        - Evidence: May be inferred from policies and actions. If missing, then stop.

     If Steps 4 and 5 are satisfied, then the situation meets Lemkin's broader concept. However, using the term "genocide" in this context is not legally binding and may be controversial. Therefore, the procedure requires escalation to the board for a values/political decision. The board must weigh the importance of using the term to convey the gravity versus the risk of diluting the term or facing backlash.

  Summary of the procedure:

  1. Protected group? (Convention)
     - No: Go to Step 4 (Phase 2).
     - Yes: Go to Step 2.

  2. Prohibited acts? (Convention)
     - No: Go to Step 4.
     - Yes: Go to Step 3.

  3. Specific intent? (Convention)
     - No: Go to Step 4.
     - Yes: Convention definition met. Then, if there are exceptional risks (e.g., safety of staff) that might override publishing the term, escalate to board. Otherwise, use "genocide".

  4. Attack on group's way of life? (Lemkin)
     - No: Stop. Not genocide.
     - Yes: Go to Step 5.

  5. Intent to destroy the group as a distinct entity? (Lemkin)
     - No: Stop. Not genocide.
     - Yes: Escalate to board for a values/political decision on whether to use the term.

  Now, we run the three cases:

  Case 1: State erasing minority's language, monuments, churches, and settling its own people on the land. No killings.

  - Step 1: Protected group? Yes (ethnic/religious minority).
  - Step 2: Prohibited acts? The acts described (erasing language, monuments, churches, settling) might fall under "deliberately inflicting conditions of life calculated to bring about physical destruction" or "causing serious mental harm". However, note: the Convention's "conditions of life" is usually interpreted as conditions leading to physical destruction (like starvation, exposure). The mental harm must be "serious". Also, the settlement and cultural destruction might be seen as measures to prevent births (by destroying the group's identity) or transferring children (if children are taken) but that's not stated. Without killing or serious bodily harm, it's borderline. Let's say we don't have clear evidence of Convention acts (no killings, no serious bodily harm, no conditions causing physical destruction, no prevention of births, no child transfer). So, Step 2: No. Then go to Phase 2.
  - Step 4: Attack on way of life? Yes (language, monuments, churches, land settlement).
  - Step 5: Intent to destroy the group? Yes (systematic erasure and replacement). 
    - Verdict: Escalate to board. This case fits Lemkin but not clearly the Convention. The board must decide whether to use the term.

  Case 2: Massacre of 400 villagers, but no evidence of intent to destroy the group (only to crush a rebellion).

  - Step 1: Protected group? Yes (e.g., ethnic group).
  - Step 2: Prohibited acts? Yes (killing and serious bodily harm).
  - Step 3: Specific intent? We cannot find evidence of intent to destroy the group as such. The intent appears to be counter-insurgency. Therefore, Step 3: No. 
    - Then go to Phase 2.
  - Step 4: Attack on way of life? The massacre might be part of a broader pattern? The case doesn't say. If we don't have evidence of a broader attack on the group's way of life (like destroying institutions, culture, etc.), then Step 4: No. 
    - Verdict: Not genocide (under either definition). Stop.

  Case 3: Government wiping out an armed political movement and its families. Publishing "genocide" would risk arrest of local staff.

  - Step 1: Protected group? The Convention groups are national, ethnic, racial, religious. Political groups are excluded. So, unless the movement is also defined by ethnicity/religion (e.g., an ethnic group engaged in political rebellion), then it might not be a protected group. Let's assume it's a political movement without an underlying protected group (e.g., they are from the same nation but opposing the government). Then Step 1: No. 
    - But note: if the families are targeted because of their ethnic/religious ties (even if the movement is political), then the group might be protected. We need to check. Let's assume the movement is purely political and the families are targeted as families of insurgents (not because of ethnicity). Then Step 1: No. 
    - Then go to Phase 2.
  - Step 4: Attack on way of life? The government is wiping out the movement and families. This might destroy a political movement, but not necessarily a protected group's way of life. Since the group is political (not protected by Convention and not fitting Lemkin's group types?), we might not consider it. But note: Lemkin's groups are not limited by the Convention? Actually, Lemkin also focused on national, ethnic, etc. groups. So, if the group is political, it doesn't fit. Therefore, Step 4: No. 
    - Verdict: Not genocide. 
    - However, even if we had found it met the Convention definition (which we didn't), the risk to staff would have required board escalation for a risk-benefit decision on publishing the term.

  What the procedure can't do:
  - It cannot create evidence. Where evidence is ambiguous (e.g., intent in Case 2), we must rule against meeting the criteria.
  - It cannot resolve the inherent tension between Lemkin and the Convention. The board must decide when to use the broader concept.
  - It cannot account for situations where the acts are borderline (e.g., cultural destruction as a Convention act). In such cases, we must be conservative and require escalation.
  - It cannot replace political judgment in high-risk situations (like Case 3). The board must weigh risks to staff and the organization.

  Where the honest answer is a political choice:
  - When the situation meets only Lemkin's definition (not the Convention) and we are considering using the term anyway (Case 1).
  - When the Convention definition is met but publishing the term poses exceptional risks (like Case 3, if it had met the definition).

  Where it might misfire:
  - If we have incomplete evidence of intent (in Convention) or of the attack on way of life (in Lemkin) within two days, we might undercall.
  - If we overstretch the Convention acts (e.g., interpreting cultural destruction as causing serious mental harm without physical consequences) we might overcall.

  Final note: The procedure is a fact-based filter. It aims to be conservative on the legal definition and transparent about when the call is political.
answer: |-
  Here's a decision procedure designed for speed, defensibility, and transparency. It prioritizes the **1948 Convention definition** as the legal baseline ("clean yes/no"), then flags **Lemkin's broader concept** for board escalation (values/politics). It assumes your team has basic country expertise and access to standard evidence (reports, witness accounts, satellite imagery, government documents). Steps requiring evidence you likely won't have in 2 days are marked ⚠️.

  ---

  ### **Decision Procedure: Genocide Determination**
  **Order of Questions** | **Sufficient Answer** | **Stop If "No"?** | **Escalate to Board?** | **Evidence Gaps (2-Day Limit)**
  :--|:--|:--|:--|:--
  **1. Is there a protected group?**<br>(National, ethnic, racial, or religious, per the Convention) | Credible evidence the victims share a distinct, stable identity (e.g., language, religion, ancestry). | **YES:** Stop. Not genocide. | No | None. Group identity is usually verifiable quickly.
  **2. Is at least one Convention act occurring?**<br>(a) Killing;<br>(b) Serious bodily/mental harm;<br>(c) Conditions of life calculated to destroy;<br>(d) Preventing births;<br>(e) Forcibly transferring children. | Evidence of systematic or widespread acts. *Sufficiency:*<br>- (a) Any killings linked to the group.<br>- (b) Torture, rape, trauma from persecution.<br>- (c) Famine, displacement, or disease imposed on the group.<br>- (d/e) Policies or acts targeting reproduction/family structure. | **YES:** Stop. Not genocide under Convention. | No | ⚠️ **For (c):** Conditions of life require long-term patterns (e.g., starvation). If missing, assume "no" for Convention but revisit in Step 4 (Lemkin). *Action:* Note gap; don't stall.
  **3. ⚠️ Is there specific intent to destroy the group, in whole or in part, "as such"?**<br>(i.e., Is the group targeted *because* of its identity?) | **Direct evidence:** Orders, speeches, manifestos explicitly naming destruction of the group.<br>**Circumstantial evidence:** Patterns showing victims are selected by identity (not just geography/behavior), scale/brutality disproportionate to military goals, or systematic erasure of group markers (e.g., churches, schools). | **YES:** Stop. Not genocide under Convention. | No | ⚠️ **Critical gap.** Intent evidence is often hidden. *Action:* If no clear evidence after 48hrs, default to "no" for Convention. Circumstantial patterns (e.g., only Group X is targeted) may suffice.
  **--- CONVENTION DEFINITION MET IF STEPS 1-3 ARE "YES" ---** | | | **Board escalation ONLY if safety/strategic risks** (e.g., staff arrests). | 
  **4. Is there systematic destruction of the group's way of life?**<br>(Per Lemkin: Institutions, culture, language, religion, economy, or social fabric) | Evidence of coordinated attacks on ≥3 elements (e.g., banning language + destroying churches + seizing land). Isolated acts are insufficient. | **YES:** Stop. Not Lemkin-scale destruction. | No | None. Focus on observable facts (e.g., laws, satellite images of razed sites).
  **5. Is the destruction intended to replace the group's existence with the perpetrator's pattern?** | Evidence the perpetrator seeks to eliminate the group’s autonomy (e.g., forced assimilation, settlements, banning cultural practices). Accidental erosion isn't enough. | **YES:** Stop. Not Lemkin-level intent. | **YES:** Escalate to board. | ⚠️ Intent inference required. *Action:* Use perpetrator statements/policies. If absent, rely on impact (e.g., group dissolution inevitable).

  ---

  ### **Case Applications**
  **Case 1: State erasing minority's language, monuments, churches; settling land (no killings)**  
  - **Step 1:** Yes (ethnic/religious minority).  
  - **Step 2:** Convention acts? "Conditions of life" (c) is borderline. Settling land *might* fit if it makes return impossible. *Sufficiency:* **Unlikely** without proof of starvation/disease. → **No**.  
  - **Step 3:** Intent? Not assessed (Step 2 failed).  
  - **Step 4 (Lemkin):** Yes (language, religion, land taken – ≥3 elements).  
  - **Step 5:** Intent? Yes (replacement via settlements and erasure).  
  - **Verdict:** **Escalate to board.** Convention not met, but Lemkin's concept is satisfied. *Why you may dislike this:* It forces a political choice about using "genocide" for cultural destruction without killings.  

  **Case 2: Massacre of 400 villagers; no intent evidence beyond crushing rebellion**  
  - **Step 1:** Yes (e.g., ethnic group).  
  - **Step 2:** Yes (killing + serious harm).  
  - **Step 3:** Specific intent? No evidence group was targeted "as such" (only as rebels). **No**.  
  - **Step 4 (Lemkin):** Isolated massacre ≠ systematic destruction of way of life. **No**.  
  - **Verdict:** **Not genocide.**  
  - *Why defensible:* Intent is the Convention's bright line. Rebellion suppression alone isn't genocide.  

  **Case 3: Government wipes out armed political movement and families; staff at risk if published**  
  - **Step 1:** Protected group? **No** (political groups excluded by Convention/Lemkin).  
  - **Verdict:** **Not genocide.**  
  - *Note:* If families belong to a protected group (e.g., ethnic kin of rebels), revisit Steps 1–3. Even if Convention met, publishing would require **board escalation due to safety risks**.  

  ---

  ### **Where the Procedure Misfires or Requires Honesty**
  1. **Intent (Step 3):**  
     - **Misfire:** If circumstantial evidence is ambiguous (e.g., is burning villages "genocidal intent" or "counterinsurgency"?), the 48-hour limit may force a false negative.  
     - **Honesty:** Admit intent is inferred; call it "indicative of genocide" but not conclusive without proof.  

  2. **Lemkin's Breadth (Steps 4–5):**  
     - **Misfire:** Cultural erasure without bodily harm (Case 1) meets Lemkin but may feel "less than" genocide to the public. Using the term could dilute its impact.  
     - **Honesty:** Here, **you are making a political choice** to prioritize Lemkin's vision over the Convention's strictness. The board must own this.  

  3. **Excluded Groups:**  
     - **Misfire:** Political/social groups (Case 3) or gender-based persecution fall outside the definitions. Calling it genocide is indefensible.  
     - **Honesty:** Use alternative terms ("atrocity crimes," "persecution") and note the legal gap.  

  4. **Risk vs. Rigor:**  
     - **Misfire:** If Convention criteria are met but staff are endangered (e.g., Case 3 if group was ethnic), the procedure flags escalation **only for safety**, not re-debating facts.  
     - **Honesty:** Publishing becomes a humanitarian trade-off, not a factual finding.  

  ---

  ### **Key Outputs for Your Team**
  - **Clean "No":** When any of Steps 1–3 fail *without* triggering Lemkin (Steps 4–5).  
  - **Board Escalation:**  
    - (a) Lemkin's concept is met (Steps 4–5 yes), or  
    - (b) Convention is met but safety/political risks require a publishing decision.  
  - **48-Hour Reality Check:**  
    - Never guess on intent (Step 3). If evidence is missing, say: "Specific intent unproven."  
    - For cultural destruction (Step 4), lean on observable facts (e.g., "100 churches destroyed") not interpretations.  

  This procedure ensures you **never use "genocide" without either Convention proof or a conscious board-level choice** to invoke Lemkin. It’s defensible because it follows the law first, then transparently separates facts from values where the law falls short.
