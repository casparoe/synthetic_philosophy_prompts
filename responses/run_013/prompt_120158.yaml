  Two historians of science are arguing about wether big discoveries are inevitable. One says: if Darwin had dropped dead in 1840 we'd still have had natural selection by 1870 — Malthus, Lyell, the whole Victorian stew was sitting there waiting, and Wallace basically proves the point by getting there on his own. The other says that's hindsight talking: the theory Darwin actually built was one guy's contingent achievement, down to the specific arguments he chose, and if Wallace's version had been the one that stuck we'd have gotten something noticeably different.

