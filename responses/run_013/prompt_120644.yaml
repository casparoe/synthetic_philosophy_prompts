answer: |-
  **Examination Question**

  *This question carries 25 marks. You have approximately 90 minutes to plan and write your answer.*

  **Question:** "Which neighbour is more liberal, Sweden or Norway, and what would settle it?" Both nations possess extensive welfare states and rank near the top on standard democracy/freedom indices, making coarse rankings inadequate for distinction. Sweden has implemented measures like publicly financed independent 'free schools', suggesting greater marketization. Norway retains features like a state alcohol monopoly and EEA (not EU) membership, suggesting stronger state direction in specific areas. Critically evaluate the claim that one country is definitively "more liberal" than the other. Your answer must:
  1.  Identify at least two distinct, potentially conflicting, conceptual dimensions of "liberal" relevant to comparing Sweden and Norway.
  2.  Explain how the choices involved in constructing a measurement (including unit of analysis, aggregation rules, and potential trade-offs between dimensions) fundamentally shape any answer.
  3.  Argue whether a definitive answer to "which is more liberal" exists independently of these choices, or whether settling the question requires stipulation. If stipulation is required, discuss whether this answers the original question or changes the subject.
  Do *not* rely on specific rankings (e.g., V-Dem, Freedom House, EIU) or recall particular scores. Focus on the conceptual and methodological challenges.

  ---

  **Model Answer (Approx. 700 words)**

  The question "Which neighbour is more liberal, Sweden or Norway?" lacks a single, objective, discoverable answer settled by evidence alone; settling it requires prior, contestable philosophical and methodological choices about the meaning of "liberal" and how to measure it, choices which effectively redefine the question being asked. This indeterminacy arises from the contested nature of the concept and the constructed nature of comparative measurement.

  Firstly, "liberal" carries at least two distinct, often conflicting, meanings crucial to this comparison. The *classical liberal* dimension emphasizes minimal state intervention in the economy and personal economic choice, favoring markets, privatization, and individual economic discretion. The *social liberal* dimension emphasizes tolerance, permissiveness, protection of minority rights, and the absence of moralistic state regulation in personal life. Sweden and Norway exemplify how these can pull in opposite directions. Sweden’s extensive "free school" system, funded by vouchers but operated privately, represents a significant marketization of public provision, aligning with classical liberalism. Conversely, Norway’s state alcohol monopoly (Vinmonopolet) represents a direct state limitation on the free market for social reasons, contra classical liberalism. However, both countries are highly socially liberal, with strong protections for minorities and personal freedoms. Thus, declaring one "more liberal" overall depends entirely on which dimension is prioritized, as each country leads on a different facet.

  Secondly, any attempt to measure "liberalism" comparatively requires constructing an operational definition, demanding choices that are inherently non-innocent and shape the outcome. The *unit of analysis* matters: does "liberalism" refer to national policy averages, the distribution of freedoms across the population, or the lived experience of specific groups (e.g., minorities, immigrants, citizens vs. residents)? The *aggregation rule* is critical: how are scores on potentially dozens of indicators (e.g., economic freedom indices, LGBTQ+ rights scores, press freedom rankings) combined? Is it a simple average, a weighted one (and who decides the weights?), or a more complex function? Crucially, *trade-offs must be addressed*: can a large advantage for Norway in one area (e.g., perhaps state control limiting classical liberalism) be offset by a small advantage for Sweden in another (e.g., perhaps slightly broader social permissiveness)? Determining the exchange rate between fundamentally different values (like economic deregulation vs. hate speech laws) is not an empirical discovery but a normative or methodological imposition. Comparing national averages obscures internal variations in who experiences liberalism.

  Thirdly, and most significantly, there is no single "liberalism" quantity waiting to be measured, akin to the temperature a physicist calibrates. The concept is essentially contested. Therefore, no empirical investigation can *settle* the question without first *stipulating* a specific definition and measurement protocol. Does this stipulation answer the question? Only by radically transforming it. The original question asks which country possesses "more" of a seemingly unitary property ("liberal"). Stipulation redefines the property itself (e.g., "liberal-as-measured-by-weighted-average-of-Index-X") and imposes a specific calculus for comparison. The answer then applies to *this constructed concept*, not necessarily the original, contested one. The physicist finds a pre-existing quantity through calibration; the social scientist often *defines* the quantity through the act of measurement design. Consequently, "what would settle it" is not finding better data, but reaching prior agreement (explicit or implicit) on the contested conceptual and methodological choices – agreement that is unlikely and itself changes the subject from the ambiguous original query to a specific operationalization. The dispute is irresolvable at the original level of asking "which is more liberal" without these prior commitments.

  ---

  **Marking Scheme (25 Marks Total)**

  1.  **Identifies & Explains Two Distinct, Potentially Conflicting Dimensions of "Liberal" (5 marks):** Must clearly distinguish Classical (minimal state intervention in economy/market, economic discretion) and Social (permissiveness, minority protection, absence of moralistic regulation) liberalism, linking them appropriately to the given examples (e.g., free schools vs. alcohol monopoly). *Common Miss: Only defines one dimension vaguely; fails to link dimensions to specific country examples provided.*
  2.  **Explains How Measurement Choices (Unit/Aggregation/Trade-offs) Shape the Answer (7 marks):** Must discuss at least two of: unit of analysis (e.g., national avg. vs. distribution), aggregation rules (e.g., weighting, averaging), and the problem of trading off deficits/surpluses across dimensions (incommensurability). Explain *how* these choices determine the outcome. *Common Miss: Merely lists choices without explaining their impact; focuses only on data quality, not construct definition.*
  3.  **Argues that a Definite Answer Requires Stipulation (Not Discovery) (6 marks):** Must explicitly reject the idea of a pre-existing, discoverable "liberalism quantity" and state that settling the question necessitates prior agreement on definition and measurement (stipulation). *Common Miss: Implies better data could settle it; assumes a single "true" liberalism exists to be measured.*
  4.  **Evaluates Whether Stipulation Answers or Changes the Question (5 marks):** Must engage with the dilemma: Does adopting a specific operationalization answer the original ambiguous question, or does it change the subject by defining a new, specific construct? Must present a reasoned argument (e.g., stipulation changes the subject by defining the construct). *Common Miss: Assumes stipulation answers the question without critique; ignores this part of the prompt.*
  5.  **Uses Provided Context & Avoids Ranking Reliance (2 marks):** Appropriately uses the given examples (welfare states, rankings similarity, free schools, alcohol monopoly, EEA/EU) to illustrate arguments. Avoids reliance on specific rankings/scores. *Common Miss: Ignores provided context; tries to cite/rely on specific indices.*

  **Differentiating A from B Answers:**
  *   **A Answer (21-25 marks):** MUST hit point 4 convincingly. It explicitly argues that stipulation *changes the subject* from the original, contested, ambiguous question ("which is more liberal?") to answering a question about a specific, constructed operationalization ("which scores higher on *this specific measure*?"). It recognizes the original question as fundamentally unresolvable without this conceptual shift.
  *   **B Answer (16-20 marks):** Hits points 1, 2, 3, and 5 adequately but lacks the critical analysis in point 4. It identifies the need for stipulation but does not deeply analyze whether this stipulation answers the original question or effectively redefines it (e.g., may state stipulation is necessary to answer it, without addressing the subject-change critique). It focuses on the difficulty of comparison without the meta-critique of the question itself.
