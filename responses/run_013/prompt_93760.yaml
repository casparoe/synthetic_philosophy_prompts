  First, I need to unpack their core concern. They mention the "units of selection" debate in biology, but they feel that’s too broad. They’re specifically focused on the ontological tension between holism and reductionism—whether a group is a distinct individual or just an aggregate. The user is frustrated by authors who switch between these framings inconsistently, suggesting it might be more about perspective than substance.

  The user also asks if this fork exists in social sciences like economics, where similar debates occur about firms or markets as agents. They’re essentially asking if this is a universal pattern in complex systems or if the biological and social versions differ meaningfully. Their deeper need seems to be clarity on whether this distinction has real-world implications (e.g., predictive differences) or if it’s merely descriptive.

  I should start by brainstorming related concepts. In biology, terms like "emergent fitness," "group agency," or "superorganism" come to mind. In social ontology, "collective intentionality" or "social emergence" might apply. But the user wants precision: they’ve rightly noted that "levels of selection" encompasses more than just this fork (e.g., replicators vs. vehicles). 

  The key is isolating the core tension: ontological status (is the group a distinct entity?) vs. methodological reductionism (can we explain everything through parts?). The user’s examples—herd cooperation vs. individual fitness dependencies—highlight this. Cases like eusocial insects (bees as superorganisms) vs. trait-group models (individuals in temporary groups) show the spectrum.

  Then, connecting to social sciences. Debates over corporate agency vs. methodological individualism mirror this. But differences arise: in biology, group fitness can be empirically measured (e.g., colony survival), while in social contexts, "agency" often involves contested notions of intentionality. The user needs to know where the analogy holds and where it breaks—e.g., markets lack the cohesive reproduction of biological groups.

  Finally, addressing predictive differences. Most cases yield identical predictions (e.g., cooperative groups thrive either way), but exceptions exist. For example, evolutionary transitions where new group-level traits emerge (like multicellularity) force a holistic view. In social domains, institutional actions might require attributing intentions to groups beyond individual members. This is where the fork becomes substantive.

  The user might also be seeking validation of their observation—that this isn’t just semantics but a deeper philosophical divide. They’d benefit from understanding when each framing is useful and how to spot when the choice affects interpretation. Naming the fork as "ontological granularity" or "explanatory focal level" could help, but emphasizing the continuum between perspectives is crucial.
answer: |-
  Based on your description, you're grappling with a profound and recurring tension in the philosophy of complex systems – one that manifests similarly in biology and social ontology. Let's break this down systematically, brainstorming candidate concepts before settling on the core distinctions.

  **Brainstorming Candidate Concepts:**
  1.  **Holism vs. Reductionism:** The broadest philosophical divide (treating wholes as fundamental vs. explaining wholes solely through parts).
  2.  **Emergence:** The idea that wholes have properties/behaviors not reducible to or predictable from parts alone.
  3.  **Levels of Selection:** Focuses on *where* selection acts (gene, individual, group, species).
  4.  **Units of Selection:** Focuses on *what* is being selected (what entity exhibits heritable variation in fitness).
  5.  **Superorganism Concept:** The specific idea that some groups function *as if* they were single organisms.
  6.  **Methodological Individualism vs. Holism:** Primarily social science: explaining social phenomena solely through individual actions/beliefs vs. attributing causal power to social structures/groups.
  7.  **Aggregativity vs. Emergence (Wimsatt):** Whether a system property is merely the sum of parts' properties (aggregative) or depends on specific organization/interactions (emergent).
  8.  **Collective Intentionality / Group Agency (Social Ontology):** Attribution of beliefs, intentions, and actions to groups *as such*.
  9.  **Explanatory Focal Level:** Choosing which level of organization provides the most salient or efficient explanation.
  10. **Ontological Commitment:** Whether we *believe* the higher-level entity *really exists* as a distinct causal agent.

  **Identifying the Core Fork: "Ontological Granularity" or "Explanatory Focal Level"**

  The specific fork you describe – choosing to model/comprehend a composite entity as **One Thing (Holon)** or as **Many Things (Aggregate)** – doesn't have one universally agreed-upon single term. However, the most precise established concepts capturing this tension are:

  1.  **The Question of Emergent Fitness / Group-Level Fitness:** This is the most direct biological correlate. The fork hinges on whether the composite exhibits a *fitness property* that is:
      *   **Emergent/Holistic:** A property of the group *as a whole* that cannot be straightforwardly partitioned or predicted solely from the properties of members *in isolation* (e.g., colony efficiency, herd defense success, group reproductive output impacting group survival). This *requires* treating the group as a unit for evolutionary explanation.
      *   **Context-Dependent Individual Fitness:** The "fitness" of an individual *depends critically on the composition and spatial/temporal context of the group it's in*, but the relevant evolutionary process is still selection acting on *individuals* within that context. The group's "fitness" is just the sum of individual reproductive outputs under those specific conditions.
      *   **Relation to Units/Levels:** This *is* the core biological debate within the "levels of selection" framework. The "units" question asks *what* is being selected – is group fitness the property that varies and is inherited? If yes, the group is a unit. If group-level patterns are *only* the consequence of individual selection within a context, the individual is the unit acting at the group level. Your "fork" is the practical manifestation of taking different stances on this central question.

  2.  **Aggregativity vs. Non-Aggregativity (Wimsatt):** This is a powerful conceptual tool. A property is **aggregative** if:
      *   It's invariant under rearrangement of parts.
      *   It's invariant under addition/subtraction of parts (scaling linearly).
      *   It's invariant under decomposition/reaggregation.
      *   There are no cooperative or inhibitory interactions between parts.
      *   Fitness in purely additive genetic models approaches aggregativity. If group fitness is aggregative, the "bag of entities" view suffices. However, if group fitness depends *crucially* on the *specific interactions, organization, and context* (e.g., the ratio of cooperators, spatial structure, division of labor), then it's **non-aggregative/emergent**, *requiring* the group-level perspective for a complete explanation. This directly addresses your observation that sometimes summing individuals works, and sometimes it doesn't capture the dynamics.

  3.  **The Attribution of Agency (Social Ontology):** In the social sciences, your fork is mirrored in debates over **Collective Intentionality** and **Group Agency**. Is the firm/market/state:
      *   A **Collective Agent:** An entity capable of forming beliefs, intentions, and performing actions *as a group*, over and above the sum of individual members' intentions/actions (e.g., "The company decided to expand," "The market reacted poorly")? This parallels the "superorganism" view.
      *   **Merely an Aggregate:** A structure constraining or enabling individual agents, where all explanations must ultimately reduce to individual beliefs, desires, and interactions (Methodological Individualism)? This parallels the "bag of entities" view.

  **Are the Biological and Social Forks the Same?**

  *   **Strong Similarity (Core Tension):** At their heart, **both forks deal with the same fundamental philosophical problem: the ontological and explanatory status of organized composites.** Both involve debates about emergence, reduction, causality, and where to locate agency/causation/fitness. The *logical structure* of the argument is remarkably parallel: "Is this whole more than the sum of its parts in a way that demands we treat it as a distinct entity for explanation?"
  *   **Key Differences (Where the Comparison Breaks Down):**
      *   **Mechanism of Cohesion/Identity:** Biological groups (especially those considered superorganisms) often have powerful mechanisms enforcing cohesion and suppressing lower-level selection (e.g., unicellular bottleneck in multicellular organisms, haplodiploidy/queen control in eusocial insects). Social groups rely on much messier, often contested mechanisms like shared norms, rules, authority structures, and narratives, making boundaries and identity fuzzier.
      *   **"Fitness" vs. "Agency/Intentionality":** The biological debate has a relatively well-defined (though debated) empirical anchor: differential reproduction/survival (fitness). The social debate centers on much more contested concepts like intentionality, belief, desire, and action – concepts inherently bound up with consciousness and meaning, which are absent in biological collectives (beyond metaphorical use).
      *   **Reproduction:** Biological units of selection must exhibit heritable variation in fitness. While social structures "reproduce" (institutions persist, firms replicate), the mechanisms are radically different (cultural transmission, legal frameworks) and lack the clear genetic analogy. Social "fitness" is harder to define.
      *   **Degree of Individual Plasticity:** Individuals within biological groups often have constrained plasticity due to genetics/development; individuals within social groups can radically reinterpret their roles, resist norms, or exercise reflexivity.

  **Do the Framings Make Different Predictions?**

  *   **Often, No (Operational Equivalence):** In many cases, especially well-modeled ones like simple cooperation games or additive genetic models, the "group as unit" and "context-dependent individuals" models can be mathematically equivalent or make identical population-level predictions about trait frequencies over time. This fuels the "bookkeeping preference" view.
  *   **Crucial Cases Where They Diverge (Substantive Difference):**
      *   **Evolutionary Transitions in Individuality (ETIs):** When new higher-level individuals evolve (e.g., prokaryotes -> eukaryotes, cells -> multicellular organisms, insects -> eusocial colonies). The "group as unit" view is *essential* to explain the evolution of mechanisms that suppress within-group conflict and enforce cooperation, leading to a new Darwinian individual. The "bag of entities" view struggles to explain the origin of these mechanisms without already assuming some higher-level selection.
      *   **Strong Emergent Properties:** When group-level properties have *downward causal effects* that fundamentally alter the nature or possibilities of the parts. E.g., In a termite mound, the *structure itself* regulates temperature/humidity in a way no individual termite can comprehend or achieve alone, creating a niche that shapes individual behavior and evolution. Ignoring this holistic property misses key causal dynamics. In social science, a firm's *formal decision-making structure* might produce an action (e.g., a hostile takeover) that *no single individual within it desired or intended*, but resulted from the rules of the collective process.
      *   **Context-Dependence vs. Inherent Property:** The "bag of entities" view might predict that a cooperative individual plucked from a successful group and placed elsewhere would still be highly fit. The "group as unit" view (especially with strong emergence) might predict that individual's fitness plummets because its fitness was *inherently tied* to the specific group context/organization that no longer exists. The former sees fitness as a property of the individual modulated by environment; the latter sees the group-level organization as generating a *new kind* of fitness dynamic.
      *   **Response to Perturbation:** The models might predict different outcomes if the group structure is disrupted or if individual variation is introduced in specific ways, especially when non-linear interactions are crucial.

  **Synthesis and Recommendation:**

  1.  **Your Core Fork:** You've identified the tension between **attributing causal efficacy/fitness/agency to the composite whole** vs. **explaining the composite solely through the properties and interactions of its parts within a context.** This is the essence of debates about **emergence** and **reductionism**.
  2.  **Best Established Terms:**
      *   **In Biology:** The specific fork *is* the core of the **"Group Selection" vs. "Individual Selection within a Structured Population"** debate within the broader **"Levels of Selection"** or **"Units of Selection"** framework. **"Emergent Group Fitness"** vs. **"Context-Dependent Individual Fitness"** captures the key biological distinction. **"Aggregativity vs. Non-Aggregativity"** (Wimsatt) provides a rigorous criterion for distinguishing when the "bag of entities" view suffices and when it fails.
      *   **In Social Science:** **"Group Agency / Collective Intentionality"** vs. **"Methodological Individualism"**.
  3.  **General Cross-Disciplinary Concept:** While there's no single perfect term, **"Explanatory Focal Level"** or **"Attribution of Ontological Priority"** come closest. The most precise description is the **choice between modeling the composite as a *Darwinian Individual* (with its own fitness/agency) or as an *Aggregate* of lower-level individuals**.
  4.  **Novel Coinage (If Needed):** **"The Holon-Aggregate Fork"** (Holon = a whole that is simultaneously a part of a larger whole; Aggregate = a collection lacking emergent whole-properties). This emphasizes the core choice: treat it as a unified "one" (holon) or as a "many" (aggregate).
      *   *What it leaves out:* Specific disciplinary nuances (fitness vs. intentionality, biological cohesion vs. social norms), and the continuum nature of the distinction (many systems are somewhere in between).

  **Conclusion:**

  Your intuition is sharp. The fork you perceive in biology (group as unit vs. context-dependent individuals) and in social science (group agent vs. aggregate of individuals) **is fundamentally the same phenomenon at a philosophical level: the challenge of ontological and explanatory reduction in complex systems.** Both grapple with emergence and downward causation. While the biological version centers on *fitness* and the social on *agency/intentionality*, the underlying structure of the debate – "Is the whole causally significant in a way that demands its own explanatory level?" – is identical. The key difference lies in the *mechanisms* of cohesion and the *nature* of the property attributed (fitness vs. intentionality).

  Authors often slide between framings because, in many cases, the models are operationally equivalent. However, the fork becomes substantively important in cases of **strong emergence, evolutionary transitions, or the presence of significant downward causation,** where ignoring the holistic perspective leads to incomplete or inaccurate explanations. Recognizing this fork is crucial for clear thinking in both ecology and philosophy. Your frustration with the sliding is justified – it often reflects unresolved philosophical commitments rather than purely pragmatic choices.
