  ### Cardulus Numerus: A Heritability Simulation Activity

  #### **Decks and Rules**  
  **Genotype Deck (16 cards):**  
  - **A (4 cards):** Baseline = 10, Sensitivity = 1.5 → Height = 10 + (1.5 × Soil)  
  - **B (4 cards):** Baseline = 15, Sensitivity = 1.0 → Height = 15 + (1.0 × Soil)  
  - **C (4 cards):** Baseline = 20, Sensitivity = 0.5 → Height = 20 + (0.5 × Soil)  
  - **D (2 cards):** Baseline = 5, Sensitivity = *threshold* → Height = 5 if Soil < 4; Height = 5 + 3 × (Soil - 3) if Soil ≥ 4  
  - **E (2 cards):** Baseline = 25, Sensitivity = -1.0 → Height = 25 - (1.0 × Soil)  

  **Plot Deck (Soil Scores):**  
  - **Round 1 (Independent):** Two cards each of Soil 1, 2, 3, 4, 5, 6, 7, 8 (16 cards total).  
  - **Round 2 (Uniform):** All 16 cards set to Soil 5.  
  - **Round 3 (Intervention):** Same as Round 1, but add 3 to each soil score (e.g., Soil 1 → 4).  
  - **Round 4 (Between-Group):**  
    - *Variety X (8 cards):* Genotypes A (4), B (4) with soils: Two 1s, three 2s, three 3s.  
    - *Variety Y (8 cards):* Genotypes C (4), D (2), E (2) with soils: Three 8s, three 9s, two 10s.  
  - **Round 5 (Narrow Range):** Five cards of Soil 4, six of Soil 5, five of Soil 6 (16 cards).  
  - **Coda (Correlated):** Same genotypes as Round 1, but soils assigned to correlate with baseline: Lower baselines (D, A) get poorer soils; higher baselines (B, C, E) get richer soils (e.g., D: Soils 1, 2; A: Soils 3, 4; B: Soils 5, 6; C: Soils 7, 8; E: Soils 7, 8).  

  **Height Calculation:**  
  - Students compute their height using their genotype and soil card.  
  - **Special cases:**  
    - D: If Soil < 4, height = 5 (e.g., Soil 3 → 5). If Soil ≥ 4, height = 5 + 3 × (Soil - 3) (e.g., Soil 5 → 5 + 3 × 2 = 11).  
    - E: Height = 25 - Soil (e.g., Soil 8 → 17).  

  ---

  ### **Worksheet**  
  *Students fill this in during the activity.*  

  **Round 1 (Independent Assignment):**  
  - My genotype: ______ Baseline: ______ Sensitivity: ______  
  - My soil: ______ My height: ______  
  - Group heights (list on board): ______  
  - Mean height: ______  
  - Sum of squares total (SS_total): ______  
  - Genetic sum of squares (SS_genetic): ______  
  - Environmental sum of squares (SS_error): ______  
  - Ratio (SS_genetic / SS_total): ______  

  **Round 2 (Uniform Soil):**  
  - All soils = 5. My new height: ______  
  - Group heights: ______  
  - SS_total: ______  
  - SS_genetic: ______  
  - SS_error: ______  
  - Ratio: ______  

  **Round 3 (Intervention):**  
  - My new soil (original + 3): ______ My new height: ______  
  - Group heights: ______  
  - Mean height: ______ (Compare to Round 1).  

  **Round 4 (Between-Group):**  
  - My variety: ______ My soil: ______ My height: ______  
  - Variety X heights (list): ______ Mean: ______  
  - Variety Y heights (list): ______ Mean: ______  
  - Within X: SS_total: ______ SS_genetic: ______ Ratio: ______  
  - Within Y: SS_total: ______ SS_genetic: ______ Ratio: ______  

  **Round 5 (Narrow Range):**  
  - My soil: ______ My height: ______  
  - Group heights: ______  
  - SS_total: ______  
  - SS_genetic: ______  
  - SS_error: ______  
  - Ratio: ______  

  **Coda (Correlated Assignment):**  
  - My soil (correlated): ______ My height: ______  
  - Group heights: ______  
  - SS_total: ______  
  - SS_genetic: ______  
  - SS_error: ______  
  - Ratio: ______  

  ---

  ### **Board Layout for Variance Tables**  
  **Variance Partitioning (All Rounds):**  
  | Round | Mean Height | SS_total | SS_genetic | SS_error | Ratio (SS_g / SS_t) |  
  |-------|-------------|----------|------------|----------|---------------------|  
  | 1     |             |          |            |          |                     |  
  | 2     |             |          |            |          |                     |  
  | 3     | (Shift only)|          |            |          |                     |  
  | 4 (X) | (Per group) |          |            |          |                     |  
  | 4 (Y) | (Per group) |          |            |          |                     |  
  | 5     |             |          |            |          |                     |  
  | Coda  |             |          |            |          |                     |  

  **Between-Group Difference (Round 4):**  
  | Variety | Mean Height | SS_total (within) | SS_genetic (within) | Ratio |  
  |---------|-------------|-------------------|---------------------|-------|  
  | X       |             |                   |                     |       |  
  | Y       |             |                   |                     |       |  
  | **Gap (Y - X):** ______ |  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  

  - **0–5 min: Setup and Introduction**  
    - *Instructor says:* "We’re studying a fictional plant, *Cardulus numerus*. Each of you gets a genotype card (letter A–E) and a soil card. Compute your plant’s height using the rules. Do not share your cards yet."  
    - Distribute genotype and soil decks. Students compute heights.  

  - **5–15 min: Round 1 (Independent Assignment)**  
    - *Instructor says:* "Record your height. We’ll list all heights on the board. Compute the mean and individual squared differences from the mean for SS_total. Then group by genotype, compute genotype means, then SS_genetic and SS_error. Fill in the worksheet."  
    - Students report heights. Instructor records, guides calculations.  

  - **15–25 min: Round 2 (Uniform Environment)**  
    - *Instructor says:* "New season. Everyone gets Soil 5. Compute new heights, repeat variance calculations."  
    - Students compute, fill worksheet.  

  - **25–30 min: Round 3 (Intervention)**  
    - *Instructor says:* "Farmers improve soil: add 3 to your Round 1 soil. Compute new heights. Record the shift in mean."  
    - Students compute. No variance partitioning.  

  - **30–40 min: Round 4 (Between-Group Difference)**  
    - *Instructor says:* "Now, we have two varieties: X (A and B) and Y (C, D, E). Variety X gets soils 1–3; Y gets soils 8–10. Compute heights. Find means and within-group variances."  
    - Assign varieties/soils. Students compute, fill worksheet.  

  - **40–50 min: Round 5 (Narrowed Environment)**  
    - *Instructor says:* "Back to original genotypes. Soils are now 4, 5, or 6. Compute heights and variance."  
    - Distribute new soils. Students compute.  

  - **50–60 min: Coda (Correlated Assignment)**  
    - *Instructor says:* "Turns out, Round 1 wasn’t independent. Higher-baseline genotypes got richer soil. Recompute your height with new soil assignments."  
    - Assign correlated soils. Students compute.  

  - **60–75 min: Debrief and Philosophy Discussion**  
    - *Instructor:* "Let’s name what we saw. The ratio we computed is *heritability*—a variance ratio within a population." Map rounds:  
      - **Round 1:** Heritability is a population-level ratio (V_g/V_total), not an individual trait.  
      - **Round 2:** Heritability = 1 doesn’t mean "fixed" (Round 3 shifted the mean) or "genetically caused" (Round 1 showed otherwise).  
      - **Round 3:** Interventions can change traits without changing heritability.  
      - **Round 4:** High within-group heritability ≠ genetic cause of between-group gaps (Y had better soil).  
      - **Round 5:** Heritability rises when environmental variance falls.  
      - **Coda:** Heritability estimates assume no gene-environment correlation. Real estimates (e.g., twin studies) lean on this, but it’s often violated.  
    - *Handle predictable comments:*  
      - *"Round 1 shows the trait is mostly genetic!"* → "No—it shows the ratio in this environment. Change the environment (Round 5), and it shifts."  
      - *"Round 4 gap must be genetic—heritability is high in each group!"* → "But we controlled soil: Y got better soil. Within-group heritability doesn’t explain between-group differences."  
      - *"Round 3 intervention was pointless—the ratio didn’t change!"* → "The ratio isn’t about the mean. The intervention raised all heights, which matters for farmers."  
      - *"Plants aren’t people!"* → "True, but statistics apply to any trait. Heritability in humans works the same way—it’s about variation in a population."  

  - **75–85 min: Q&A and Reflections**  
    - Discuss limitations: This is a cartoon. Real heritability uses inferential stats (e.g., regression), assumes random environments, and gene-environment correlations are messier.  
    - Emphasize: Heritability ≠ genetic destiny, ≠ fixity, ≠ between-group explanation.  

  - **85–90 min: Wrap-Up**  

  ---

  ### **Anticipated Problems and Solutions**  
  1. **Arithmetic bogs down:**  
     - *Problem:* SS calculations may take too long.  
     - *Solution:* Use pre-calculated templates for squares; have students work in pairs. Round 1 example: Heights = [5, 5, 16, 18, 20, 22, 22, 23, 16, 17, 20, 20, 20, 20, 18, 17] (mean = 17.5, SS_total = 518, SS_genetic = 459, ratio = 0.89).  

  2. **Outlier dominates variance:**  
     - *Problem:* A student with extreme soil/genotype (e.g., E + Soil 1: height 24) skews results.  
     - *Solution:* Use the fixed soil assignments provided to avoid outliers. If it happens, note: "Outliers remind us that heritability depends on the sample’s variation range."  

  3. **Reaction to rigged Round 4:**  
     - *Problem:* Students may feel tricked by the environmental bias.  
     - *Solution:* Acknowledge: "We simulated a real-world issue—groups often experience different environments. This is why we can’t infer genetics from group gaps."  

  4. **"Plant not a person" objection:**  
     - *Problem:* Students dismiss the analogy.  
     - *Solution:* "The math is the same for any trait. Human heritability studies use the same formulas—and the same pitfalls apply."  

  ---

  ### **Limitations and Conceptual Gaps**  
  - **What the activity cannot reproduce:**  
    1. **Inferential machinery:** Real heritability estimates (e.g., from twin studies) use statistical models (e.g., ANOVA, regression) that account for relatedness and shared environments. This activity computes descriptive variance ratios directly.  
    2. **Environmental assumptions:** Real estimates assume environments are randomly assigned to genotypes. The coda oversimplifies gene-environment correlation (e.g., in humans, it’s confounded by factors like socioeconomic status).  
    3. **Complex interactions:** Real gene-environment interactions involve thresholds, epigenetics, and feedback loops—not just linear slopes.  
  - **Conceptual correction:** Your sketch is sound, but note: Heritability = 1 doesn’t imply *no* environmental influence (e.g., in Round 2, soil still affects height—it’s just uniform).  

  Summary: The activity is designed to make the students feel that heritability is a population-level statistic, contingent on environmental variation, that cannot justify genetic determinism or between-group inferences.
