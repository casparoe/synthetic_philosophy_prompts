prompt: |-
  So I've somehow agreed to run a session for this reading group I'm in — about fifteen people, mostly the sort who hang out on LessWrong-adjacent discords and have read alot of pop science plus chunks of the Sequences, plus two or three humanities grad students who will definately know more than me about Kant. It's 75 minutes, I have a whiteboard, and the topic is underdetermination of theory by evidence. The reason I volunteered: in another server I'm in, people keep deploying "underdetermination" as a conversation-ender — "well, the evidence underdetermines the theory, so your realism is dead" — and I'm fairly sure most of them are either running the trivial curve-fitting version (any finite data set fits infinitely many curves, therefore... something?) or quietly conflating it with the holism point that you can't test a hypothesis in isolation because of auxiliaries. Those seem like different problems to me, and people mush them together mainly because both have Quine near them. So I want a plan for teaching the actual thing, not a summary of it.

  What I want is the pedagogical skeleton, not the content. First, the order the pieces have to come in and why that order and not another — what has to already be in place before "underdetermination" even means anything, and where the fork sits between the boring version (true of every finite data set, so presumably not what anyone should care about) and the version that's supposed to threaten scientific realism. Second, the one example that should carry the whole session. I have a hunch it should be the old ether theory vs. special relativity situation, since at the time the available experiments couldn't tell them apart and the disagreement was about why the numbers come out the way they do rather than what the numbers are — but you tell me, and tell me what the carrier has to have and what it must not have. My suspicion is that it must not be a case where the two theories secretly differ in predictions somewhere down the line, because then it's just a normal empirical dispute and the point evaporates. Third, the misconceptions they'll arrive with or form, in the order they'll actually surface, and exactly where in the sequence I should head each one off — I'm expecting "underdetermination means all theories are equally good," "it means science is arbitrary or relativistic," "it's just uncertainty," "it's the same as holism," and "it only applies to unobservables," but I want your map, not mine.

  Fourth, a check for understanding I can run at the end that separates someone who actually got the distinction from someone who just picked up the vocabulary — ideally something that would expose the holism/underdetermination conflation if it's still there. Fifth, what I should openly refuse to explain at this level (I'm guessing the realism/anti-realism literature proper, and anything requiring them to already know what a Ramsey sentence is), plus the one teaser sentence to leave them with so they want to go further. I have a half-formed idea that the interesting residue isn't "same predictions" but "same predictions, different advice" — two theories agreeing on every observation and still telling you to do different things about precommitment, or about whether some unobservable state is real in a way that changes the decision. I don't know if that's a real distinction or just me being confused, but I'd like the session to gesture at it at the very end. Give it to me as exactly five numbered items, a sentence or two each, no preamble and no wrap-up.
reasoning: |-
  Okay, the user is preparing a session on underdetermination of theory by evidence for a reading group. Let me start by understanding their main concerns. They want to clarify the concept because they've noticed people misuse "underdetermination" as a conversation-stopper, often conflating it with trivial curve-fitting or Duhem-Quine holism. The goal is to teach the actual distinction and prevent these misconceptions.

  First, I need to structure the session logically. The user mentioned that the order of concepts is crucial. So, what prerequisites are necessary before introducing underdetermination? Participants must grasp that scientific theories involve unobservables and that evidence alone doesn't dictate theory choice. Starting with trivial curve-fitting makes sense because it's familiar. Then, showing its limitations leads to the non-trivial version, where theories make identical predictions but differ in unobservables. This sets the stage for the realism threat.

  The carrier example is vital. The user suggested ether vs. special relativity. Why is this suitable? Both theories agreed on all available evidence at the time, like Michelson-Morley. No future predictions differed initially, which avoids the misconception that it's just a temporary empirical issue. Contrasting it with Newton vs. Einstein helps, as the latter had differing predictions. This example clearly shows underdetermination without future testability.

  Misconceptions are a key concern. The user listed several: equating underdetermination with relativism, arbitrariness, or holism. Each should be addressed at specific points. For instance, after introducing trivial curve-fitting, clarify that science isn't arbitrary due to virtues like simplicity. When discussing holism, differentiate it by explaining holism involves auxiliaries affecting testability, while underdetermination is about empirically equivalent theories.

  For the check of understanding, the user needs a way to test if participants distinguish underdetermination from holism. A scenario involving modifying auxiliaries versus two theories with identical predictions but different ontologies would work. Asking which is underdetermination and which is holism can reveal their grasp.

  The user wants to avoid diving into realism debates or technicalities like Ramsey sentences. Ending with a teaser about "same predictions, different advice" could intrigue them. This connects to how theories influence decisions despite empirical equivalence, hinting at deeper philosophical issues without going into detail.

  Now, considering the group's composition: LessWrong-adjacent members with pop science and Sequences background, plus humanities grad students familiar with Kant. The LessWrong crowd might lean towards rationalist perspectives, so grounding in concrete examples is essential. The grad students might expect more philosophical depth, but the session should stay accessible. Avoiding jargon while clarifying key terms is important.

  Potential pitfalls: Participants might still conflate underdetermination with holism. Emphasizing that underdetermination is about multiple theories fitting all possible evidence, while holism is about testing single theories with auxiliaries, is crucial. Using the ether vs. relativity example consistently can solidify this.

  The user’s half-formed idea about "same predictions, different advice" is interesting. Theories might agree on observations but suggest different actions, like in decision-making scenarios. This touches on instrumentalism vs. realism. Including this as a teaser could spark further interest without derailing the session.

  In summary, the session should:
  1. Start with trivial underdetermination to establish basics.
  2. Transition to non-trivial using ether vs. relativity.
  3. Address misconceptions at each step, especially holism.
  4. Use a clear check for understanding.
  5. End with the teaser about different advice, avoiding deeper topics.
answer: |-
  Here is the pedagogical skeleton, exactly as requested:

  1. **Order of Concepts**:  
     Start with trivial underdetermination (infinite curves fitting finite data) to establish the baseline. *Then* introduce the non-trivial version by emphasizing **empirical equivalence**: two theories agreeing on *all possible* observations (past, present, future). This order is essential because trivial underdetermination is resolved by new data, while non-trivial threatens realism by making theories *permanently* indistinguishable by evidence alone. Without this, learners conflate temporary uncertainty with profound underdetermination.

  2. **Carrier Example**:  
     Use **ether theory vs. special relativity** (c. 1905–1915). It *must* have:  
     - Identical predictions for *all* then-conceivable experiments (e.g., Michelson-Morley null result, stellar aberration).  
     - Radically different ontologies (absolute space vs. spacetime relativity).  
     - *No* hidden empirical differences later resolved by new data (unlike Newton vs. Einstein, where Mercury’s orbit differed).  
     Avoid examples where theories share core structure (e.g., different quantum interpretations) or where auxiliaries dominate (e.g., geocentrism vs. heliocentrism pre-Galileo).

  3. **Misconception Sequence & Defusal**:  
     - **"It means all theories are equally good"**: Head off after introducing trivial underdetermination. Clarify that science uses virtues (simplicity, explanatory power) to choose, but these don’t break *non-trivial* equivalence.  
     - **"It’s just uncertainty/holism"**: Address after defining non-trivial underdetermination. Contrast: holism (one theory + auxiliaries vs. evidence) vs. underdetermination (two *whole theories* vs. identical evidence).  
     - **"Science is arbitrary/relativistic"**: Defuse when discussing theory choice. Stress that underdetermination doesn’t deny progress (e.g., both ether and SR beat Aristotelian physics) or practical utility.  
     - **"Only applies to unobservables"**: Correct immediately when presenting the ether/SR example—highlight that the dispute was about the *nature* of observables (e.g., "Is length contraction *real* or apparent?").

  4. **Check for Understanding**:  
     Pose: *"Two theories predict identical data forever. Theory A says phenomenon X reflects unobservable entity Y; Theory B says X is fundamental. Is this underdetermination? What if Theory A’s prediction fails unless we modify an auxiliary assumption—is that underdetermination or holism?"*  
     Correct response: First is underdetermination (empirical equivalence); second is holism (auxiliary adjustment). Incorrect answers conflate the two.

  5. **Exclusions & Teaser**:  
     Refuse: Realism/anti-realism debates (beyond the threat’s outline) and formalisms (Ramsey sentences, modal logic).  
     Teaser: *"The real bite is when empirically identical theories demand *different commitments*: one tells you to bet on unobservables, the other to ignore them—changing how you *act* even when predictions align."*
