prompt: |-
  I run ops at a forty-person company and we keep having the same fight: someone said something in a sales call, or a Slack thread, or on their way out the door, that never made it into the contract, and now half the team says we promised and half says we didn't. I want a decision procedure my team leads can actually run, in order, for whether an informal commitment morally binds us — assume the lawyers have already told us we can legally walk away, that part's settled. Ground it in what the philosophy of promising actually establishes rather than vibes: the difference between a promise and a prediction or a threat, why breaking one wrongs the person instead of merely disappointing them, the Scanlon-style idea that what a promise hands the other side is assurance, the Shiffrin-style idea that it hands them a kind of authority over your future conduct, the older conventionalist line that it's all a social practice with rules we're playing by. I want it to also force the team to say whether the promisee has a right to demand performance or only to be compensated, and whether we can release ourselves unilaterally or need them to. Questions in order, what counts as a sufficient answer to each, where it stops with a 'not bound' and why that isn't just us being cheap, and where it hands off to a person because the question is values not facts. Then run it on three cases: a rep who told a customer we'd always support the old version and then quit; a founder who said at an all-hands that there'd be no layoffs this year and now needs to cut; and one where I want the procedure to tell me we're bound to something expensive I'd rather not do. Keep it to something a busy lead can run in twenty minutes, and be honest about which steps are just rationalization with a flowchart drawn on top.
reasoning: |-
  We are creating a decision procedure grounded in the philosophy of promising. The key elements we'll draw from are:

  1. **Scanlon's Assurance View**: A promise gives the promisee assurance that the promisor will perform, and the promisee may rely on that assurance.
  2. **Shiffrin's Authority View**: By promising, the promisor gives the promisee a kind of authority over the promisor's future conduct. The promisee can then hold the promisor accountable and demand performance.
  3. **Conventionalist View**: Promising is a social practice with rules. The promise is binding if it meets the conditions of the practice (e.g., clear commitment, understood as a promise by both parties).

  We need to determine if an informal commitment morally binds us. The procedure should answer:

  - Was a promise made?
  - If so, what kind of right does the promisee have? (demand performance vs. compensation)
  - Can we release ourselves unilaterally or do we need the promisee's agreement?

  The procedure must be step-by-step, with clear questions and criteria for sufficient answers. We'll design it to be run in 20 minutes.

  ---

  **Decision Procedure: Is There a Moral Obligation from an Informal Commitment?**

  **Step 1: Did we make a statement that could reasonably be interpreted as a promise?**
     - *What to look for*: A promise must be distinguished from a prediction, a threat, a hope, or a mere statement of fact. Look for words that commit to a future action (e.g., "I will", "we guarantee", "we promise", "you can count on us"). Also, consider context: was it in a setting where commitments are typically made (e.g., sales call) or casual (e.g., hallway chat)?
     - *Sufficient answer*: Yes, if a reasonable person in the promisee's position would have understood it as a commitment. No, if it was clearly speculative or non-committal (e.g., "we hope to", "we might", "it's possible").
     - *If no*: Stop. Not bound. (Because no promise was made.)
     - *If yes*: Proceed to Step 2.

  **Step 2: Did the promisee rely on the promise?**
     - *What to look for*: Did the promisee take any action (or forgo an action) based on the promise? (e.g., signed a contract, turned down other offers, invested resources, made plans). This is key to Scanlon's view: the promise provides assurance that enables reliance.
     - *Sufficient answer*: Yes, if there is evidence of reliance (e.g., the customer continued using our product because of the support promise, or an employee didn't look for a job because of the no-layoff promise). No, if the promisee did nothing differently.
     - *If no*: Stop. Not bound. (Because even if a promise was made, it hasn't caused harm through reliance. However, note: Shiffrin might argue that the promise still binds because it transfers authority, but in practice, without reliance, the moral wrong is less clear. We'll take a middle path: without reliance, the obligation is weaker and may not require performance but perhaps only an apology or explanation. However, to streamline, if no reliance, we stop and say not bound to perform, but we might still owe an explanation. For this procedure, we'll say "not bound" to perform and leave the explanation as a separate matter.)
     - *If yes*: Proceed to Step 3.

  **Step 3: What kind of right did we create? (Authority vs. Assurance)**
     - *What to look for*: Consider the context and content of the promise. Did we grant the promisee authority over our future conduct (Shiffrin) or merely provide assurance (Scanlon)? 
       - **Authority**: Typically in close relationships, employment, or when the promise is about a core matter (e.g., job security, critical support). The promisee can demand performance.
       - **Assurance**: More common in commercial contexts. The promisee has a right to rely and may be owed compensation if we break the promise, but not necessarily specific performance.
     - *Sufficient answer*: 
       - If the promise was made in a context of high trust and dependency (e.g., employer-employee, long-term partnership) or if the promise was explicit and meant to be binding, then it's Authority.
       - If it was a routine business assurance (e.g., standard customer support), then it's Assurance.
     - *Output*: This step doesn't stop the procedure but sets the stage for Step 4.

  **Step 4: Can we release ourselves unilaterally?**
     - *What to look for*: 
       - Consider if the promise was conditional on ongoing circumstances (e.g., "we'll support the old version as long as it's feasible"). 
       - Consider if the promisee would reasonably expect that we could change our mind without consulting them (e.g., a policy that is typically subject to change).
       - Also, consider the cost of performance: if circumstances have changed dramatically (e.g., supporting the old version is now prohibitively expensive), then we might have a case for release, but we must still consider the promisee's reliance.
     - *Sufficient answer*: 
       - **Unilateral release is permissible** only if:
          (a) The promise was implicitly or explicitly conditional (and the condition has failed), OR
          (b) The promisee would not reasonably expect the promise to be absolute (e.g., in a volatile industry, a no-layoff promise might be understood as conditional on the company's financial health), OR
          (c) The cost of performance is so extreme that it would be unreasonable to demand it (but then we must offer compensation for reliance).
       - Otherwise, we cannot release ourselves unilaterally and must seek the promisee's agreement to be released.
     - *Output*: 
       - If unilateral release is permissible, then we are not bound to perform, but we may owe compensation (if there was reliance) and an explanation. Proceed to Step 5 to determine if compensation is owed.
       - If not, then we are bound to perform (unless the promisee releases us). Stop: we are bound.

  **Step 5: If we are not bound to perform, do we owe compensation?**
     - *What to look for*: This step is only reached if we are not bound to perform (from Step 4). We then ask: did the promisee reasonably rely (from Step 2) and suffer a loss because of that reliance?
     - *Sufficient answer*: Yes, if we can quantify the loss (e.g., the customer spent money to keep using the old version, the employee turned down a job offer). No, if no loss or if the loss is negligible.
     - *Output*: 
       - If yes, we are bound to compensate for the loss (even if not bound to perform). 
       - If no, we are not bound to do anything (but still, an explanation is good practice).

  **Where it stops with 'not bound' and why it isn't just being cheap**:
     - We stop at Step 1 if no promise was made. This is because without a promise, there is no moral obligation (only perhaps a general duty of honesty or kindness, but that doesn't bind to a specific action).
     - We stop at Step 2 if there was no reliance. The moral obligation is weaker without reliance because the promise hasn't caused harm. We might still apologize, but we are not bound to perform or compensate.
     - We stop at Step 4 if we can release ourselves unilaterally and there is no compensation owed (Step 5). This is because the promise was conditional or the circumstances have changed so much that holding us to it would be unreasonable. This isn't cheapness; it's recognizing the limits of what was promised.

  **Handoff to a person**: 
     - Step 3 (Authority vs. Assurance) may require judgment. If the team leads cannot agree, hand off to a designated person (e.g., the CEO or an ethics committee) to make the call. Also, in Step 4, if there is disagreement about whether conditions have changed or what is reasonable, hand off.

  **Rationalization with a flowchart**: 
     - Steps 1 and 2 are fact-based (what was said, did they rely). 
     - Steps 3, 4, and 5 involve value judgments. We are using philosophical concepts to structure the judgment, but it's still a judgment. Be honest: the flowchart is a guide, not a calculator.

  ---

  **Run the Procedure on Three Cases**

  **Case 1: Rep told a customer we'd always support the old version and then quit.**
     - Step 1: The rep said "we'd always support". That sounds like a promise. Reasonable for the customer to think so. **Yes**.
     - Step 2: Did the customer rely? Maybe. If they chose to keep using the old version instead of upgrading or switching, then yes. Assume they did. **Yes**.
     - Step 3: What kind of right? This is a commercial context. The promise is about support. Likely **Assurance** (Scanlon) rather than Authority (Shiffrin). So the customer has a right to rely and be compensated if we break, but not necessarily to force us to support forever.
     - Step 4: Can we release ourselves unilaterally? The word "always" is absolute, but in software, support for old versions is often understood to have limits (e.g., until it becomes too costly). Also, the rep is gone, but the company made the promise. However, if supporting the old version is now very expensive, we might argue that it's unreasonable to continue. Let's assume it's become very costly. Then **unilateral release may be permissible**.
     - Step 5: Do we owe compensation? The customer relied by not upgrading. They might have incurred costs (e.g., if they now have to scramble to upgrade). We should compensate for those costs (e.g., offer free upgrade assistance, discounts). **Yes, compensation owed**.
     - **Result**: We are not bound to support forever, but we owe compensation for the reliance costs.

  **Case 2: Founder said at an all-hands that there'd be no layoffs this year and now needs to cut.**
     - Step 1: The founder made a clear statement: "no layoffs this year". This is a promise. **Yes**.
     - Step 2: Did employees rely? Yes. They may have turned down job offers, made financial commitments, or stayed because of job security. **Yes**.
     - Step 3: What kind of right? This is an employment context with high trust and dependency. The founder is a top authority. This is **Authority** (Shiffrin). Employees have the right to demand performance.
     - Step 4: Can we release ourselves unilaterally? Only if the promise was conditional (e.g., "if the company does well, no layoffs") or if circumstances have changed so dramatically that it would be unreasonable to keep the promise. But the founder said "this year", implying it's for the year regardless. Also, layoffs are a serious matter. Without the employees' agreement, it's hard to justify unilateral release. **No, we cannot release ourselves unilaterally**.
     - **Result**: We are bound to avoid layoffs this year. If we break the promise, we wrong the employees. We must either (a) find another way to cut costs, or (b) seek the employees' agreement to release the promise (e.g., by offering generous severance and an apology). Without that, we are bound.

  **Case 3: [Your case where we want the procedure to tell us we're bound to something expensive]**
     - *Hypothetical*: We told a long-time customer that we would provide a custom feature for free in the next update. They signed a contract that didn't include it, but we verbally promised. Now building it is expensive.
     - Step 1: The verbal statement was a promise. **Yes**.
     - Step 2: The customer relied? They signed the contract because of this promise (assume we have evidence). **Yes**.
     - Step 3: What kind of right? This is a commercial context, but the promise was for a custom feature. The customer might see it as critical. Since it was a specific commitment, we might lean toward **Authority** (they can demand the feature) or at least strong Assurance.
     - Step 4: Can we release ourselves unilaterally? The promise was unconditional. The cost is high, but that might not be enough to release unilaterally because the customer specifically relied on it. **No**.
     - **Result**: We are bound to provide the feature. We cannot walk away without the customer's agreement. We must either build it or negotiate a release (e.g., offer a substitute or compensation).

  ---

  **Final Procedure Flowchart**:

  1. Was there a promise? (No → Not bound; Yes → 2)
  2. Was there reliance? (No → Not bound; Yes → 3)
  3. What kind of right? (Authority or Assurance) [If unclear, hand off]
  4. Can we release unilaterally? (Yes → 5; No → Bound to perform)
  5. Do we owe compensation? (Yes → Bound to compensate; No → Not bound)

  This should fit in 20 minutes if the facts are gathered in advance. The longest parts are Steps 3 and 4, which might require discussion. Designate a person to break ties.
answer: |-
  Below is a decision procedure grounded in the philosophy of promising, designed to be run by team leads in **20 minutes or less**. It's structured as a step-by-step flowchart with explicit questions, criteria for answers, and stopping points. The procedure draws from philosophical foundations:  
  - **Scanlon's assurance view**: Promising gives the promisee a right to rely on your commitment.  
  - **Shiffrin's authority view**: Promising transfers moral authority to the promisee over your actions.  
  - **Conventionalism**: Promises are binding only if they meet societal "rules" (e.g., clear intent, reciprocity).  

  The procedure forces clarity on:  
  - Whether the promisee has a right to **demand performance** or only **compensation** if broken.  
  - Whether you can **unilaterally release** yourselves or need the promisee's agreement.  

  It minimizes "vibes" by using objective criteria at each step. Steps requiring **value judgments** (not pure facts) are marked for handoff to a designated arbitrator (e.g., CEO, ethics lead). Steps prone to rationalization are flagged.  

  ---

  ### **The Decision Procedure**  
  **Time:** 15–20 minutes per case (with pre-gathered facts).  
  **Who runs it:** Team lead + 1–2 stakeholders (e.g., sales lead, support lead).  
  **Output:** "Bound to perform," "Bound to compensate," or "Not bound."  

  #### **Step 1: Was a Valid Promise Made?**  
  **Question:** Did the speaker explicitly or implicitly commit to a future action, such that a reasonable person in the promisee’s shoes would see it as a **promise** (not a prediction, threat, or opinion)?  
  - *Philosophy check*: Promises require intent to undertake an obligation (Scanlon/Shiffrin). Conventionalism adds: Was it in a context where promises are expected (e.g., sales call)?  
  - **Sufficient "Yes" evidence**:  
    - Words like "we promise," "guarantee," "commit," or "we will [action]."  
    - Context implies commitment (e.g., response to a direct request in a formal setting).  
  - **Sufficient "No" evidence**:  
    - Hedged language ("we’ll try," "hopefully," "maybe").  
    - Casual context (e.g., hallway chat, joke, venting).  
  - **Stops here if "No"**: Not bound. *Why it’s not cheap*: Without intent to promise, there’s no moral obligation. Disappointment ≠ wrongdoing.  
  - **Handoff needed?** No. This is fact-based (review Slack/recording/witnesses).  

  #### **Step 2: Did the Promisee Rely on the Promise?**  
  **Question:** Did the promisee take (or avoid) a **specific, consequential action** because they believed the promise?  
  - *Philosophy check*: Scanlon’s assurance view requires reliance for harm. No reliance = no moral injury (just disappointment).  
  - **Sufficient "Yes" evidence**:  
    - Promisee invested money, turned down alternatives, or made irreversible decisions.  
    - Example: Customer kept using old software because of "lifetime support."  
  - **Sufficient "No" evidence**:  
    - No action taken (e.g., vague "goodwill" or future plans).  
    - Action was unrelated (e.g., bought your product before the promise).  
  - **Stops here if "No"**: Not bound. *Why it’s not cheap*: Breaking a promise only wrongs someone if they relied on it (Scanlon). No reliance = no harm.  
  - **Handoff needed?** No. Reliance is factual (e.g., customer emails, behavior changes).  

  #### **Step 3: What Right Was Conferred? (Authority vs. Assurance)**  
  **Question:** Did the promise grant the promisee **moral authority over your actions** (Shiffrin) or merely **assurance of a future outcome** (Scanlon)?  
  - *Philosophy check*:  
    - **Authority view (demand performance)**: Applies if the promise was about something core to the promisee’s autonomy/plans (e.g., job security, health/safety).  
    - **Assurance view (compensation suffices)**: Applies if the promise was transactional (e.g., business perks, timelines).  
  - **Criteria for "Authority"**:  
    - High-stakes context (e.g., employment, health, major financial decision).  
    - Language emphasized fidelity (e.g., "we owe you this," "on my word").  
  - **Criteria for "Assurance"**:  
    - Routine business context (e.g., sales, support).  
    - Language focused on outcomes (e.g., "this will save you time").  
  - **Handoff needed?** **YES**. This is a values judgment. Default arbitrator decides if ambiguous.  

  #### **Step 4: Can You Unilaterally Release Yourselves?**  
  **Question:** Are there **changed circumstances** that make keeping the promise excessively burdensome or unfair *and* would the promisee reasonably have agreed to these exceptions?  
  - *Philosophy check*: Conventionalism says promises are binding unless society’s "rules" allow release (e.g., mutual agreement, impossibility). Shiffrin: Authority view forbids unilateral release.  
  - **Sufficient "Yes" evidence**:  
    - Promise was conditional (e.g., "if demand stays high").  
    - Burden is catastrophic (e.g., company survival at risk).  
    - Industry norms allow flexibility (e.g., software deprecation policies).  
  - **Sufficient "No" evidence**:  
    - Burden is manageable (e.g., high cost ≠ existential risk).  
    - Promise was unconditional (e.g., "no layoffs this year").  
  - **Bound outcome**:  
    - If "Authority" + "No release" → **Must perform**.  
    - If "Assurance" + "No release" → **Must compensate** (see Step 5).  
    - If "Yes" (release allowed) → Not bound to perform, but **proceed to Step 5**.  
  - **Handoff needed?** **YES** for burden assessment. Arbitrator weighs costs vs. moral harm.  

  #### **Step 5: If Not Performing, Is Compensation Owed?**  
  **Question:** Did the promisee incur **quantifiable losses** due to reliance?  
  - *Philosophy check*: Scanlon’s view: Compensation repairs harm from broken assurance.  
  - **Sufficient "Yes" evidence**:  
    - Financial loss (e.g., customer paid for unsupported software).  
    - Opportunity cost (e.g., employee missed job offers).  
  - **Sufficient "No" evidence**:  
    - Losses are speculative or emotional.  
    - Promisee gained net benefits despite breach.  
  - **Output**:  
    - "Yes" → **Bound to compensate** (e.g., refund, severance).  
    - "No" → **Not bound**.  
  - **Handoff needed?** No. Fact-based (e.g., financial records).  

  ---

  ### **Rationalization Warnings**  
  - **Step 3 (Authority vs. Assurance)**: Most subjective. Teams may rationalize "Assurance" to avoid performance. Mitigation: Handoff to arbitrator.  
  - **Step 4 (Unilateral release)**: Teams may overstate "burden." Mitigation: Require evidence (e.g., financials).  
  - **Steps 1–2**: Least gameable. Focus on documented facts.  

  ---

  ### **Case Applications**  
  **Case 1: Rep promised "always support the old version," then quit.**  
  - **Step 1**: **Yes**. "Always support" is a clear commitment in a sales context.  
  - **Step 2**: **Yes**. Customer likely kept using the old version (reliance).  
  - **Step 3**: **Assurance**. Support is transactional (not core to autonomy).  
  - **Step 4**: **Release allowed**. Industry norms permit deprecation; "always" is often conditional on feasibility.  
  - **Step 5**: **Compensation owed**. Customer incurred costs (e.g., migration).  
  - **Outcome**: **Not bound to perform, but compensate** (e.g., free migration aid).  

  **Case 2: Founder promised "no layoffs this year," now needs cuts.**  
  - **Step 1**: **Yes**. Unconditional statement in a high-trust setting (all-hands).  
  - **Step 2**: **Yes**. Employees relied (e.g., declined job offers).  
  - **Step 3**: **Authority**. Job security is core to autonomy (Shiffrin view).  
  - **Step 4**: **No release**. Burden must be existential (e.g., bankruptcy risk); "needs to cut" ≠ catastrophe.  
  - **Outcome**: **Bound to perform**. Layoffs would violate moral authority. Must renegotiate with employees (e.g., voluntary exits).  

  **Case 3: Expensive promise you’d rather avoid (e.g., "Free lifetime premium support for early adopters").**  
  - **Step 1**: **Yes**. "Lifetime" implies a promise.  
  - **Step 2**: **Yes**. Early adopters paid/stayed for this.  
  - **Step 3**: **Authority**. "Lifetime" support is a core reason they joined.  
  - **Step 4**: **No release**. Burden (high cost) isn’t catastrophic unless proven otherwise.  
  - **Outcome**: **Bound to perform**. Unilateral release disrespects their authority over your actions.  

  ---

  ### **Procedure Summary**  
  1. **Promise?** (No → Not bound).  
  2. **Reliance?** (No → Not bound).  
  3. **Authority or Assurance?** (Handoff if unclear).  
  4. **Unilateral release?** (If Authority + No → Bound to perform; If Assurance + No → Bound to compensate; If Yes → Not bound to perform).  
  5. **Compensation owed?** (If Assurance + Release → Compensate losses).  

  This forces:  
  - **Performance** for authority-laden promises (e.g., layoffs).  
  - **Compensation** for transactional ones (e.g., support).  
  - **No obligation** without reliance or valid promise.  

  **Final Tip**: Document promises in real-time (e.g., CRM notes) to avoid repeats. Use the arbitrator for Steps 3–4 to curb self-interest.
