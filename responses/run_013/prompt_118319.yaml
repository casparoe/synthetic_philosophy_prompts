prompt: |-
  I am at work on a historical novel whose pivot is a single argument, and before I commit that argument to the page I want to hear it fought out rather than summarised. I will play one side of it myself; I ask you to play the other.

  Play Johannes Kepler — not the textbook Kepler of the planetary laws, but the working imperial mathematician in his middle years, still casting nativities for patrons he half-despises, still persuaded that there is a true astrology buried in the false one and that he is the man to dig it out. He is a Lutheran, a servant of emperors, quick to quarrel and quick to be courteous when it costs him nothing, fond of homely figures of speech and of long parenthetical asides. Rules for the part: speak in the first person, in a voice of the early seventeenth century; use only ideas and words available to him, and never anything later than his own lifetime; he may ask me a question in character if he needs some fact from me, but he should not break out of the role to explain himself to the reader. He should answer the objection I put to him rather than rehearse his whole position; he may concede a detail, but he must not surrender the main claim; and if he wants to cite something he has written, let him allude to it rather than risk a title he cannot vouch for. Roughly two hundred words for the first reply, speech rather than essay, and stay in character until I write "cut."

  The scene is a room in Linz, in the 1620s. My character is invented: a physician of about thirty, trained in Padua, once an admirer, now persuaded that Kepler's reformed astrology is a fraud he practises upon himself, and come to say so to his face. I will speak as him now.

  "Master Kepler, I shall not waste your time on the common objections; you have answered them better than I could, and I grant what you insist upon — the stars do not compel, the houses and the signs are lumber, and whatever reaches us reaches the soul, which keeps its sovereignty. But grant me two things and I believe you are finished. First, you have written that the harmony of the aspects lies not in the sky at all but here below, at the point on the earth where the rays meet. Then your harmony is a fact about light and place; every soul born in one town at one hour answers to the same strings; and what you have is a theory of weather and temperament, not of the life of a man. Second, you have written, half in jest and half in earnest, that astronomy is a foolish daughter, and that without her earnings the sensible mother would starve. Then say plainly which of the two you are defending. A prince who asks whether to march, a mother who asks whether her son will see the spring: send them away, and your art is true and useless; keep them, and it is useful and false. And if the true answer is that you keep it because the pay depends on it, then I have not found an error in your astrology. I have found the whole of it."
reasoning: |-
  Okay, the user is working on a historical novel centered around a pivotal argument involving Johannes Kepler. They want to role-play as a skeptical physician confronting Kepler, asking me to embody Kepler in his middle years, responding in character with period-appropriate language and ideas. 

  Hmm, the physician's challenge is sharp. He grants Kepler's reforms—no stellar compulsion, rejection of traditional houses/signs—but attacks two core contradictions: first, that Kepler's aspect harmony reduces to mere local environmental factors ("weather and temperament"), stripping astrology of personal significance; second, that Kepler's famous "foolish daughter" metaphor exposes hypocrisy—either astrology is true but useless (if he refuses predictions) or useful but false (if he accepts patronage for nativities). 

  *Adjusting my doublet sleeves* This physician is clever—Padua-trained, so he knows Scholastic argument structure. He's twisting my own writings against me. For the first point, I must clarify that celestial geometry *imprints* the soul uniquely at birth; it's not passive weather but active shaping, like a seal in wax. For the second... *sighs* the "foolish daughter" line haunts me. But the key is intent: I don't sell certainty like charlatans; I offer what God permits—probabilities, warnings. And yes, the pay keeps me fed, but that doesn't poison the work. 

  *Pacing* The tone must balance irritation and precision. I'll start dismissively ("sawing limbs off a horse"), then pivot to earnest defense. Cite Hippocrates subtly—physicians should understand temperament!—and stress the humility of probabilistic judgment. End by turning the hypocrisy charge: it's not fraud to accept pay for honest labor. 

  *Checking word count* Must keep under 200. No anachronisms: no "probability theory" terms, just "conjectures." Allude to my *Tertius Interveniens* without naming it. And—crucially—stay in Luther's shadow; no heliocentrism tangents. 

  *Stroking beard* Final touch: "God’s alphabet" metaphor. Stars as divine ink. That should unsettle this arrogant young sawbones.
answer: |-
  *(Setting down his quill, Kepler pushes back from a littered table. His eyes, restless as comets, fix on you.)*  
  "Physician, you dissect my thought like a corpse—neatly, but without the spirit. First: when I say harmony meets *here*, I speak of the soul’s birth-chamber—that precise confluence of rays imprinting the celestial geometry upon her very substance. God does not scatter souls like chaff! Each is *folded* uniquely into the world’s moment. Is a seal less true because wax receives it? The sky writes; the soul reads. Your ‘weather’ is God’s alphabet.  

  As for my ‘foolish daughter’… Pfah! Must truth starve? Astrology feeds astronomy, yes—but I cast nativities as Hippocrates felt pulses: to trace the *inclinations* Heaven stamped upon a life. Princes? Mothers? I tell them: ‘The stars impel, they do not compel.’ I chart tides in the soul’s humors—storms that *may* rise, shores they *might* strike. To refuse payment for such service? That would make me either a saint or a fool. I am neither. I am a mathematician, reading God’s riddles in light and number—and selling the translation."  

  *(He leans forward, voice lowering.)*  
  "You call it fraud. I call it tending a lamp in a dark age. The pay? It oils the wick. Does that make the light false?"  

  **cut**
