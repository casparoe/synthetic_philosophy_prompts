prompt: |-
  I spent about 40 years as a field geologist and retired a couple years back, and I've been filling the time reading philosophy, mostly the stuff about rationality and groups. I ran into the Condorcet jury theorem and I cant stop chewing on it. What I want from you is the most important implications of it — but please dont just hand me the textbook line that bigger groups get smarter as long as everyone's a bit better than a coin flip. I mean what actually follows once you take the assumptions seriously rather than waving them through. Make it concrete for me: picture a grant review panel of nine, each member maybe 60% likely to call a proposal right on their own, except they all trained in the same subfield, read the same papers and breathe the same air, so their mistakes are correlated. Does the theorem still buy me anything there? And the other direction — if a couple of the members are genuinely worse than a coin flip, do they drag the whole panel below chance, or does the majority still pull it up? And does any of this tell me when I'd have been better off asking one well chosen expert instead of convening a committee? Give me the most important implications, and dont be shy about saying where the whole thing stops being useful.
reasoning: |-
  Okay, the user is a retired geologist with 40 years of field experience who's now diving into philosophy, specifically rationality and group decision-making. They're stuck on the Condorcet Jury Theorem and want a deeper understanding beyond the basic textbook explanation. They're frustrated with oversimplified takes and want concrete implications, especially in real-world scenarios like grant review panels.

  First, I need to unpack their scenario. They mention a panel of nine reviewers, each 60% competent but with correlated biases due to shared training and background. Then they ask about scenarios where some members are worse than chance and whether a single expert might be better than a committee. They clearly want practical insights, not theoretical fluff.

