  Severity ordering: The Points 4 vs 5 tension is most severe because it involves a direct trade-off between transparency and security, crucial in adversarial contexts. Next, Points 2 vs 1 is moderate; the user can argue optimization pressure is the amplifier, but remedies must be specific. Points 6 vs 5 is low if internal/external distinction is clear. Points 7 vs others are minimal.

