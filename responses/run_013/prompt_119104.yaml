answer: |-
  ### Essay Question  
  Consider the "subscription model" of fictional engagement: a reader temporarily subscribes to a fiction’s existential presuppositions during engagement (e.g., treating a character as existing "for the duration"), while their standing beliefs remain unchanged; emotions are directed at the character *as believed-in under this subscription*, suspending—not denying—the "belief-required" premise of the paradox of fiction. Now imagine a case where, days after finishing a novel (and thus after her subscription lapses), a reader grieves for a deceased character and donates to a charity the character would have supported, citing the character’s influence. Assess whether the subscription model can coherently accommodate this case without collapsing into either the *illusion theory* (which falsely attributes actual belief in the character’s existence) or *make-believe theory* (which treats emotions as part of a game of pretense). If it cannot, identify the *specific commitment* the subscription model must surrender to do so. (Word limit: 800 words.)

  ---

  ### Model Answer (545 words)  
  **The subscription model cannot accommodate post-subscription emotions like sustained grief and memorial donation without surrendering its commitment to emotions being *strictly confined* to the subscription period, thereby collapsing into rival theories or weakening its core distinction.**  

  The charity case demonstrates emotions and actions persisting *after* the subscription lapses: the reader’s grief and donation occur days later, explicitly framed as being "in the character’s memory." This contradicts the subscription model’s requirement that emotions target the character only *as believed-in* during active engagement. To explain such persistence, the model must allow that emotions generated under the subscription can endure post-lapse, decoupled from the original existential presupposition. However, this move risks collapsing into illusion theory. If emotions outlive the subscription while still being directed at the *character as real* (e.g., donating "in their memory" implies ontic commitment), it suggests the reader retains a residual belief in the character’s existence—precisely what illusion theory claims. The subscription model would then merely defer, not resolve, the paradox by temporally limiting the illusion, failing its aim to suspend—not deny—the belief-emotion link.  

  Alternatively, relocating these emotions into a *new* subscription (e.g., the reader re-subscribes briefly when recalling the character) is ad hoc and implausible. The charity case describes ongoing grief, not episodic re-engagement, and the donation is a concrete action grounded in real-world values, not a fleeting mental state. Forcing this into subscription logic makes the model indistinguishable from make-believe theory, wherein "memory" cues a new pretense (e.g., Walton’s props triggering game-playing). Yet the reader’s quiet, enduring grief lacks the playful or reflexive structure of make-believe; it reflects sincere moral resonance.  

  To avoid collapse, the subscription model must surrender its commitment to emotions being *existentially dependent* on the subscription. Emotions could instead become self-sustaining mental states, transformed by the subscription but persisting via real-world psychological mechanisms (e.g., attachment or moral reflection). Here, grief stems not from current belief in the character, but from the *meaning* derived during the subscription—much like real memories of actual people. However, this surrenders the model’s defining feature: that emotions are *directly about* the subscribed entity. Instead, emotions become derivative (e.g., sadness "about the character’s fate" becomes sadness "about human vulnerability"), aligning with sophisticated make-believe (where emotions target real-world correlates) or belief-qualified theories (where emotions respond to ideas, not entities). The subscription model thus loses its novelty: suspending belief becomes irrelevant if post-subscription emotions require no ontological commitment. Consequently, while the charity case *can* be absorbed, it forces the model into incoherence or irrelevance, exposing its inability to handle fiction’s lasting impact without abandoning its core mechanism.

  ---

  ### Marking Scheme (Total: 20 marks)  
  1. **Accurate restatement of the subscription model’s core mechanism** (4 marks).  
     *Error: Misrepresenting the model (e.g., claiming it alters beliefs permanently or conflates suspension with pretense).*  
  2. **Clear articulation of the charity case’s challenge to the model** (4 marks).  
     *Error: Underplaying the lapse (e.g., implying emotions during reading explain post-reading actions) or overlooking donation’s memorial framing.*  
  3. **Analysis of collapse risks into illusion/make-believe theories** (4 marks).  
     *Error: Asserting accommodation without explaining *how* persistence triggers collapse (e.g., ignoring residual belief in donation context).*  
  4. **Identification of the specific commitment to surrender** (4 marks).  
     *Error: Vague phrasing (e.g., "the time limit") instead of naming *existential dependency of emotions on subscription*.  
  5. **Assessment of implications for the model’s viability/distinctness** (4 marks).  
     *Error: Concluding neutrally (e.g., "it works if adjusted") without noting loss of novelty or unresolved tension.*  

  ---

