  Here’s a structured research proposal tailored to your requirements, with explicit signposting of contested/settled claims and feasibility for a 3-month project.  

  ---

  **Research Proposal: Evidential Asymmetry and the Ontology of Spandrels in Evolutionary Biology**  

  ### 1. Research Question  
  *Precise formulation:*  
  **"Do 'byproduct' (spandrel) claims in evolutionary biology carry the same burden of proof as adaptationist claims regarding causal history, and does the 'spandrel with drag' case reveal a necessary refinement of the concept of constraint?"**  
  *Sub-questions:*  
  - (a) Are "spandrel" assertions (e.g., "trait X is a byproduct") treated as default hypotheses with lower evidentiary thresholds than adaptationist claims?  
  - (b) Does the "spandrel with drag" (a costly, developmentally entrenched byproduct) expose limitations in both adaptationist and non-adaptationist frameworks?  
  - (c) Is "spandrel" a transient stage (if co-opted) or an enduring ontological status?  

  *Why determinate?*  
  Answers hinge on conceptual analysis of evidentiary standards (a), case-based assessment of constraint (b), and ontological criteria (c).  

  ### 2. Problem Statement & Gap Analysis  
  **Settled consensus:**  
  - Spandrels exist (e.g., male nipples in mammals) *as byproducts of selection on other traits* (Gould & Lewontin 1979).  
  - Adaptationist explanations require evidence of selection *for* a trait’s current function (Godfrey-Smith 2001).  
  - Co-option (exaptation) occurs (e.g., feathers evolving for thermoregulation before flight).  

  **Contested/gap areas (your focus):**  
  - **Evidential asymmetry:** *Your claim is novel but contentious.* While adaptationism requires positive evidence, spandrel claims often rely on *negative evidence* (no detected function) or plausibility arguments. Yet, *both* are historical claims requiring causal evidence. Many biologists *implicitly* treat non-adaptation as a null hypothesis (e.g., Lynch 2007), but this asymmetry is rarely defended philosophically.  
  - **"Spandrel with drag":** Your case (costly byproduct + developmental constraint) is underexplored. Classic spandrels (e.g., chin) are assumed cost-neutral; costly cases test the limits of "constraint."  
  - **Spandrel ontology:** Whether co-option erases "spandrel" status is unresolved (contested between process-focused vs. historical-status views).  

  **Why existing work doesn’t resolve this:**  
  - Debates conflate your three distinct claims (origin, current function, methodological falsifiability).  
  - No systematic analysis of evidentiary burdens for byproduct claims.  
  - Costly spandrels are marginalized in theory.  

  ### 3. Methodology (3 Months, Conceptual)  
  **Month 1: Conceptual Groundwork & Text Analysis**  
  - **Weeks 1–2:** Systematic review of key texts (Gould & Lewontin 1979; responses by Dennett, Maynard Smith; modern critiques e.g., Kaplan 2008).  
    *Focus:* Isolate how "spandrel" is defined/defended across your three claims. Track evidentiary standards used for byproduct vs. adaptation claims.  
  - **Weeks 3–4:** Map rhetorical strategies in debates (e.g., is "unfalsifiability" used to dismiss adaptationism while byproducts avoid scrutiny?).  

  **Month 2: Case Studies & Asymmetry Testing**  
  - **Cases:** Classic spandrels (chin, male nipples), "spandrel with drag" (e.g., developmental overproduction with metabolic cost), and co-opted traits (e.g., feathers).  
  - **Analysis:**  
    - Does evidence for byproduct status match rigor demanded of adaptationist claims?  
    - Does the "drag" case disrupt existing classifications?  
  - **Tool:** Philosopher’s "evidential parity" test—if adaptation claims require evidence of selection *for* function, do spandrel claims require evidence of selection *against* or *absence* of function?  

  **Month 3: Synthesis & Workshop**  
  - **Weeks 1–2:** Draft paper integrating findings.  
  - **Week 3:** Small interdisciplinary workshop (biologists, philosophers) to test arguments (e.g., "Is your limb-development flatmate’s anger justified?").  
  - **Week 4:** Finalize paper.  

  ### 4. Why Philosophy?  
  Empirical work identifies spandrels but cannot resolve:  
  - Conceptual ambiguities in "function," "constraint," or "evidence."  
  - Normative questions about evidentiary standards.  
  - Rhetorical asymmetries in argumentation.  
  *Philosophy provides tools to disentangle these layers.*  

  ### 5. Outcomes  
  **Success looks like:**  
  - A 6,000-word paper clarifying the three distinct spandrel claims and demonstrating evidential asymmetry.  
  - A defensible account of "spandrel with drag" as a test case for constraint.  
  - A framework for evaluating co-option’s impact on spandrel status.  

  **Deliverable:** Draft paper + workshop report.  

  **Failure/overshoot risks:**  
  - **Failure:** Literature reveals your asymmetry claim is already addressed (but initial scoping suggests not).  
  - **Overshoot:** "Co-option ontology" question becomes intractable → **Mitigation:** Treat as secondary; flag for future work.  
  - **Scope creep:** "Drag" cases require deep biological expertise → **Mitigation:** Focus on 1–2 clear examples (e.g., your flatmate’s limb-development cases).  

  ### 6. Feasibility  
  - **Budget (£1500):** Workshop refreshments (£200), travel for 1–2 local participants (£300), coffees (£50). Remainder for contingency.  
  - **Timeline:** 3 months is tight but viable for a focused conceptual project.  
  - **Expertise:** Your biology background ensures case analyses are grounded.  

  ### 7. Novelty & Impact  
  - **Novel:** Explicitly linking spandrels to evidential symmetry and proposing "drag" as a constraint test.  
  - **Impact:** Resolves rhetorical impasses in debates; gives biologists clearer criteria for byproduct claims.  

  ---  

  **Key notes on your claims:**  
  - **Naivety check:** Your "asymmetry" point is astute and under-theorized. *But* biologists often see spandrels as "lesser" claims requiring less evidence—your challenge is to prove this is *unjustified*.  
  - **Contested status:**  
    - "Spandrels exist": Settled.  
    - "Evidential asymmetry": Your novel contention.  
    - "Spandrel with drag": Your original framing.  
    - "Co-option erases spandrel status": Hotly contested (e.g., vs. "historical essence" views).  
  - **Realistic output:** Paper draft (+workshop) is achievable; a full co-option ontology would require more time.  

  This frames your "itch" as a tractable project with clear milestones, stakes, and a path to publishable output. Would this work?
