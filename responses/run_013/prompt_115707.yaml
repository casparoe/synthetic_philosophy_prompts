  Okay, let me approach this systematically. The user describes a philosophical stalemate between two positions - moral realism (R) and expressivism (E) - and wants a structured document resolving their dispute. 

  First, I need to identify genuine agreements beyond platitudes. The key is finding substantive claims both would accept while excluding positions a nihilist could endorse. For example, both likely agree moral language has descriptive elements and guides behavior, but differ on whether this requires mind-independent facts.

  Next, the disagreements need precise formulation in neutral language. The core issues seem to be: (1) whether moral properties exist independently of attitudes, (2) whether truth requires correspondence beyond deflationism, and (3) how to handle evolutionary explanations of morality. For each, I'll identify testable cruxes.

  The evolutionary case is crucial. R would likely say selected-for beliefs could still track truth, while E sees the mechanism as evidence against independence. Both must specify what evidence would falsify their views - R might concede if beliefs varied arbitrarily across cultures without normative justification.

  On justification, R needs to explain how non-natural facts are accessible without causal interaction. E might argue his view better explains moral disagreement and motivation.

  Finally, I'll analyze where the dispute is merely verbal. Both can agree moral judgments express attitudes and aim to track objective features, but differ on whether this requires non-natural properties. The real disagreement lies in whether "wrong" refers to something beyond our responses.

  The format will be: numbered agreements, then a table of disagreements with cruxes and predictions, ending with a verdict on verbal elements. Keeping it concise while capturing nuances is challenging but essential.
answer: |-
  ## Joint Statement: Moral Realism (R) & Quasi-Realist Expressivism (E) Adversarial Collaboration

  **I. Agreed Claims (Substantive, Non-Platitude)**

  1.  **Moral Language Functions:** Moral discourse (e.g., saying "X is wrong") serves to express non-indifference, guide behavior, influence others, and coordinate social expectations. (E emphasizes this, R concedes these are *functions* but not the *meaning* or *ground*).
  2.  **Cognitive & Action-Guiding:** Moral judgments are both cognitive (involving beliefs, assessable as true/false in *some* sense) and intrinsically action-guiding/motivating for the speaker. (R sees this as evidence for objective prescriptivity; E sees it as compatible with expressive function).
  3.  **Disagreement is Real:** When R says "Torture is wrong" and E says "Torture is not wrong," they are genuinely disagreeing, not merely talking past each other or expressing incompatible attitudes without cognitive conflict. (R sees this as requiring mind-independent truthmakers; E sees it as robust disagreement within a shared practice).
  4.  **Explanatory Burden:** Any successful metaethical theory must explain the phenomenology of moral experience (feeling constrained, seeking justification), the possibility of moral error and progress, and the social role of morality. (Both agree their theories attempt this).
  5.  **Minimal Truth Aptness:** Moral sentences are truth-apt in the minimal, deflationary sense: "Murder is wrong" is true iff murder is wrong. (E endorses this fully; R endorses it *but insists it requires a robust truthmaker beyond attitudes*).

  *Set Aside (Too Weak/Shared by More Positions):* "Morality is important," "We should reason about morality," "Moral judgments involve concepts," "Moral language is meaningful."

  **II. Core Disagreements: Wording, Crux, & Predictions**

  | Disagreement (Neutral Wording)                                                                 | Underlying Crux                                                                                                            | Test Case / Evidence                                                                                                                               | R's Prediction                                                                                                  | E's Prediction                                                                                                 |
  | :--------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **1. Do moral properties (e.g., wrongness) exist independently of human attitudes, sentiments, conventions, or practices?** | **Does the explanation for the content and stability of core moral beliefs *require* appeal to mind-independent properties?** | *The Evolutionary Scenario:* Human moral belief-forming mechanisms were strongly selected *only* for enhancing group cohesion/reproductive fitness, and would have produced functionally equivalent core moral beliefs (e.g., prohibitions on killing in-group, norms of reciprocity) regardless of whether any mind-independent moral properties exist. | **Prediction:** Stability & convergence in core beliefs *across very diverse adaptive environments/cultural starting points* would be best explained by tracking mind-independent properties. *Evidence Against R:* Widespread, fundamental, and *inexplicable* moral disagreement on core principles *despite* shared rational capacities and evidence. | **Prediction:** Stability & convergence in core beliefs is *fully* explainable by shared evolutionary pressures and social needs. *Evidence Against E:* Discovery that core moral beliefs track features *orthogonal* to cohesion/fitness, or vary wildly/capriciously where cohesion/fitness pressures are identical. |
  | **2. Does the truth of a moral judgment require it to correspond to a state of affairs involving non-natural (or robustly natural) properties?** | **Does the deflationary notion of truth, combined with the expressive/functional role of moral judgments, exhaust the correct account of moral truth?** | *The Rational Convergence Test:* Isolating highly idealized rational agents (fully informed, impartial, consistent) from diverse cultural starting points. Would they converge on core moral principles *only* if those principles track mind-independent properties? | **Prediction:** Yes. Convergence requires a common external standard ("the moral facts") guiding reasoning. Lack of convergence under ideal conditions would undermine justification for believing in objective moral facts. | **Prediction:** Convergence (if it occurs) is explained by shared fundamental human concerns/sentiments revealed by idealization, not by detecting non-natural properties. Truth is secured by coherence/function within the idealized perspective. |
  | **3. Does the evolutionary origin of moral beliefs undermine their justification, if one accepts they purport to track mind-independent facts?** | **Is a "tracking" explanation *necessary* for the justification of beliefs purporting to be about mind-independent domains?** | *Applying the Evolutionary Scenario (from Disagreement 1) to Justification:* Granting the scenario is true, are core moral beliefs justified? | **Prediction:** **No.** If the belief-forming mechanism is *only* sensitive to cohesion/fitness, not truth-tracking regarding non-natural properties, then beliefs formed by it about such properties lack justification. (Requires independent rationalist access). | **Prediction:** **Yes.** Justification for moral beliefs comes from coherence, reflective endorsement, and their role within our best overall understanding of the world and ourselves, *not* from a causal history of tracking non-natural properties. The evolutionary origin is irrelevant to justification *within the practice*. |

  **III. Verbal Dispute Verdict**

  A significant portion of the *surface* disagreement is verbal or concerns emphasis within a shared conceptual space. **Both R and E can jointly endorse the following sentences without contradiction within their own frameworks:**

  *   "Torture is wrong."
  *   "The sentence 'Torture is wrong' is true (deflationarily)."
  *   "We have genuine moral disagreements."
  *   "Moral judgments express non-indifference and aim to guide action."
  *   "Moral reasoning involves seeking good reasons and consistency."
  *   "Moral beliefs can be mistaken or improved."
  *   "Morality feels objective and constraining."

  **The irreducible, non-verbal disagreement lies in R's assertion of this sentence, which E fundamentally rejects:** "The truth of 'Torture is wrong' consists in its correspondence to a state of affairs involving a non-natural property of wrongness that exists independently of all human attitudes, sentiments, conventions, or practices, and which exerts a rational, normative pull on agents irrespective of their desires."

  *   **E** sees this as adding an explanatorily idle metaphysical layer. For E, the agreed sentences exhaust the meaningful content.
  *   **R** sees this sentence as capturing the essential, non-negotiable core of moral realism – the *source* of the authority and objectivity captured in the agreed sentences. Denying it, for R, *is* changing the subject or reducing morality to something else (like mere coordination or expression).

  **Conclusion:** The core dispute is *not* merely verbal. It concerns the necessity and coherence of positing non-natural, attitude-independent moral properties as truthmakers and sources of normative authority. The test cases (Evolutionary Scenario, Rational Convergence) and the justification challenge probe whether this posit earns its explanatory keep or can be eliminated without loss.
