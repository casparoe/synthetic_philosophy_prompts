answer: |-
  ### One-Sentence Game  
  "Agents pre-commit to donating in a hypothetical Heads scenario; a public coin flip then determines if they face a real donation choice (Heads) or a reward based solely on their pre-commitment (Tails), forcing a clash between in-the-moment self-interest and pre-commitment value."

  ### Activity Design  
  **Goal**: Create visceral tension between following a pre-commitment (optimal policy) and defecting when it seems costly (myopic act).  

  **Rules & Roles**  
  - **Pairs**: Students split into Predictors (P) and Agents (A). Switch roles if time permits.  
  - **Pre-commitment**: A writes on a card: "If Heads, I donate: [YES/NO]". Cards collected by P.  
  - **Coin Flip**: P flips a physical coin *publicly* (Heads: A faces donation; Tails: A faces reward check).  
  - **Heads Outcome (50%)**:  
    - P asks A: "Donate 10 points?"  
    - A chooses freely (YES/NO), *ignoring* pre-commitment.  
    - **Effect**: A loses 10 points if donating.  
  - **Tails Outcome (50%)**:  
    - P checks A’s pre-commitment card.  
    - **Effect**: A gains 100 points if pre-committed YES; gains 0 if NO.  
  - **Payoffs**:  
    - Start: 100 points each (use tokens/points, not real money).  
    - Final score = Start ± outcomes (e.g., Tails+YES = 200 points; Heads+donate = 90 points).  

  **Materials**  
  - Coin, pre-commitment cards (paper scraps), pens, scoreboard (e.g., whiteboard).  

  **Running Order** (Total: 25–30 mins)  
  1. **Setup (5 mins)**: Explain rules, assign roles, distribute cards.  
  2. **Pre-commit (2 mins)**: A writes donation choice (YES/NO) for Heads scenario; P collects cards.  
  3. **Flip & Act (5–8 mins)**: P flips coin publicly. P/A enact Heads/Tails rules.  
  4. **Score & Share (5 mins)**: Pairs record scores. Poll: "Heads players who donated? Why?"  
  5. **Swap (Optional, 5 mins)**: Switch roles; repeat.  

  **Predictable Tension**:  
  - In Heads, donating feels pointless (no direct gain). Agents who pre-committed YES often defect.  
  - In Tails, Agents who pre-committed YES celebrate; NO-committers regret.  
  - **Split**: ~50% defect in Heads (CDT/EDT thinkers); ~50% donate (policy-followers).  

  ---

  ### Debrief (30 mins)  
  **Map to Decision Theories**  
  - **Causal (CDT)**: "Donating in Heads doesn’t *cause* the Tails reward—it’s already decided. Saving 10 points is rational." (Myopic act.)  
  - **Evidential (EDT)**: "Donating *correlates* with being a YES-committer, which got Tails players 100 points. But since I’m in Heads, that correlation doesn’t help *me*." (Self-defeating.)  
  - **Updateless (UDT)**: "At the start, choosing YES maximised *expected* utility: 50% chance of −10 (Heads) + 50% chance of +100 (Tails) = +45 net. Defecting in Heads breaks the optimal policy." (Policy-first.)  

  **Predictable Issues & Fixes**  
  - **Issue 1**: Agents defect in Heads but still get Tails rewards (no penalty).  
    - **Fix**: Stress pre-commitment as a "pledge to your past self." Ask: "Would you defect if a *perfect predictor* (e.g., Omega) could punish lies?"  
  - **Issue 2**: Some see pre-commitment as non-binding ("just words").  
    - **Fix**: Pre-frame cards as "binding contracts" (psychologically). Contrast with real UDT’s perfect enforcement.  
  - **Issue 3**: Point math feels abstract.  
    - **Fix**: Graph expected utilities: YES-commit = (0.5 × −10) + (0.5 × 100) = 45; NO-commit = 0.  

  **UDT Shortfall & Supplement**  
  - **Missing**: UDT’s core tenet—agents "ignore" known states (e.g., *act as if unaware of the coin outcome*). Here, students *know* if they’re in Heads/Tails, so defection is tempting.  
  - **Supplement**: Post-activity, give the **Original Counterfactual Mugging**: "Imagine Omega (perfect predictor) pays you £1000 in Tails *only if you would have donated in Heads*. In Heads, donating feels irrational—but UDT says: commit to donate *before* the flip." Highlight: UDT avoids state-specific "updating" that sabotages policy value.  

  **Closing Hook**: "Defecting in Heads feels smart—but it’s like cancelling insurance after a storm misses you. UDT forces you to *pre-optimise* for all possible worlds, not just your current one."  

