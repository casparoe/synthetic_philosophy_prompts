  - It does not rule out the possibility of making strategic voting harder or less impactful.
  - We can discuss approaches like restricting the domain of preferences (e.g., single-peaked) or using randomization (though that's often not desirable).
  - Practical responses: transparency, auditing, ballot design.

  We must clarify that the "dictator" in GS is a technical concept (a voter whose top choice is always the winner) and not about tyranny.

  We need to invent a concrete episode from the last election where a faction's supporters seemed to vote insincerely, and analysts disagree about whether it changed the winner. We must be honest about what such an episode can show (it can illustrate the possibility but not prove the necessity or the exact impact).

  The tone should be remarks, not a lecture, so avoid too much technical jargon and keep it engaging.

