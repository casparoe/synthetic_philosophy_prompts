prompt: |-
  ok this is going to be a bit long but I've been going in circles (ha) on it for like two weeks now.

  background: I got a 3D printed double pendulum for xmas and then found a python script that simulates one, and I've been messing with it most nights. here's the thing that broke my brain. I ran the sim, noted the angles, changed one starting number by like 0.000000000001, ran it again. within 30 seconds the two pendulums are doing completely different things — one's flipping all the way over, the other's swinging like a normal pendulum. same code, same laws, same everything except a difference so small I don't think you could even machine a ruler that fine.

  so my conclusion is the universe isn't deterministic, and the butterfly effect stuff I read about as a teenager backs this up. but then a guy on the discord says chaos and determinism are compatible and I'm just confused, which can't be right, because if the same starting conditions give you different outcomes then the outcome wasn't determined by the conditions — thats literally what determined means. he also said the difference I typed in is "below the planck length" so it doesn't count as a different starting condition, but I don't follow that either: if it isn't a real difference then both runs had exactly the same starting conditions and they still went different ways, which is even worse for determinism, right?

  so which is it. is the world deterministic, or does chaos prove it isn't? I don't want the "well nobody can predict the weather" version of the answer, I already get that part, I want to know about the actual determinism question, because my sim feels like a pretty direct counterexample and I want to know where the trick is.
