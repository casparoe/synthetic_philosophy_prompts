  Turkey is straightforward denialism. The Armenian genocide narrative directly threatens state legitimacy. Zero institutional mechanisms - only external pressure forces discussion. 0.1 for foundational (state actively opposes reckoning) and 0 for self-applying.

  The American South is fascinating. The reckoning is becoming foundational to Southern institutions but not yet nationally. Institutions are emerging but still vulnerable to backlash. 0.7 for foundational (increasingly core to Southern identity) and 0.7 for self-applying (growing infrastructure but not irreversible).

  Ranking emerges clearly: Germany, American South, Japan, Turkey. But the American South is the hardest case - it's rapidly evolving, with competing state-level vs. national narratives. A Southern state could theoretically roll back reckoning faster than Germany, but slower than Turkey.

  If weighting changes: if foundational matters more, American South might overtake Japan but not Germany. If self-applying dominates, Japan might edge past American South since Japan's mechanisms are older (though weaker). 

