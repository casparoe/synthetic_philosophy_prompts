answer: |-
  **Ranking by projected durability (most durable first): Germany, American South, Japan, Turkey.**

  **Scores & Justifications:**

  1.  **Germany**
      *   Foundational: **1.0** – Holocaust remembrance is constitutionally embedded as a negative founding myth, essential to the FRG's post-1949 legitimacy and any unified German state identity.
      *   Self-Applying: **1.0** – Extensive, legally mandated memorialization (e.g., Holocaust Memorial, Stolpersteine), rigorous school curricula, robust civic culture, and judicial precedent ensure continuous engagement largely independent of political cycles.
      *   *Combined Score: 2.0*

  2.  **American South**
      *   Foundational: **0.7** – While not yet nationally *fully* load-bearing, the reckoning (especially dismantling Confederate symbols & acknowledging slavery/Jim Crow's legacies) is increasingly central to the legitimacy of Southern institutions, major corporations, and urban governance, facing intense backlash precisely because it challenges traditional foundations.
      *   Self-Applying: **0.7** – A rapidly growing ecosystem of museums (e.g., Legacy Sites, NMAAHC), state/local removal mandates, curriculum battles (pro-reckoning forces institutionalizing changes), and activist infrastructure drives ongoing engagement, though still vulnerable to state-level political reversals.
      *   *Combined Score: 1.4*

  3.  **Japan**
      *   Foundational: **0.5** – Official reckoning remains supplemental; the state's legitimacy rests more on pacifism, economic success, and imperial continuity, allowing denial/minimization to persist without immediate systemic crisis.
      *   Self-Applying: **0.6** – Mechanisms exist (some textbook inclusions, Murayama Statement, private museums like Osaka Intl Peace Center) but are weak, contested, and easily marginalized by political shifts or nationalism, lacking strong mandates or broad civic penetration.
      *   *Combined Score: 1.1*

  4.  **Turkey**
      *   Foundational: **0.1** – Acknowledgement is actively *anti*-foundational; the official denialist narrative is a core pillar of Kemalist and post-Kemalist state identity, making recognition perceived as an existential threat to the state's legitimacy and territorial integrity.
      *   Self-Applying: **0.0** – No standing domestic mechanisms for genocide acknowledgement exist; discussion is suppressed by law (Article 301), state pressure, and nationalist mobilization; any engagement is solely crisis-driven by intense external pressure or rare internal dissent.
      *   *Combined Score: 0.1*

  **Ranking Sensitivity to Weighting:**
  *   **If Foundational is weighted heavier:** The ranking remains stable (Germany > AmSouth > Japan > Turkey) as Germany's max score is unassailable, and the gap between AmSouth (0.7) and Japan (0.5) on this axis is significant.
  *   **If Self-Applying is weighted heavier:** The gap between Germany (1.0) and AmSouth (0.7) remains clear. However, Japan (0.6) *could* potentially overtake the American South (0.7) if Self-Applying is weighted *very* heavily (e.g., 3x or more), as Japan's mechanisms, while weaker, are arguably slightly more *established* state-level features compared to the AmSouth's newer, more contested ones, though this is debatable.

  **Hardest Case to Place:** **The American South.** Its dynamism is the challenge. The "foundational" score is volatile – reckoning is rapidly becoming essential for major institutions *within* the South (cities, universities, corporations) and shaping national narratives, yet backlash aims to reassert the *old* foundations (Lost Cause), and state governments actively resist. The "self-applying" score is also uncertain; new museums and local policies are significant, but their permanence against organized political counter-mobilization, especially at the state level, is not yet guaranteed over 25 years. It sits precariously between institutionalization and reversal.
