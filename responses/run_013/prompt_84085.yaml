prompt: |-
  I'm making a small taxonomy of thought experiments and I need a worked specimen for one entry. Definitions, so we're on the same page: the payload is the general principle the case is meant to support; the lever is the one feature of the case that actually does the persuading; and the case is decorative when the lever has nothing to do with the payload — the pump works by smuggling in something the principle itself treats as irrelevant.

  Build me a decorative pump that genuinely works on ordinary thoughtful people. Specs: the scenario itself is one paragraph, realistic (an office, a family, a waiting room — no trolleys, no brains in vats, no experience machines, no violins, and nothing with a famous name attached to it), and the payload should be a claim those same people would also accept if you just argued for it directly — keep it in the neighbourhood of "a vivid single case shouldn't drive policy" or "you're responsible for what you foresee, not only for what you intend".

  Then do the workup, in this order: (1) name the payload, the lever, and the verdict the case actually gets; (2) swap the lever for something neutral, hold everything else fixed, and say what happens to the intuition; (3) keep the lever but point it at the opposite payload — if the same lever now sells the opposite conclusion, that's your evidence it's doing no arguementative work; (4) say which step is load-bearing for your claim that the case is decorative, and where someone defending the payload would say you've cheated. Last thing: is there a version that keeps the payload but makes the lever legit, i.e. the feature doing the persuading is one the principle actually cares about?
reasoning: |-
  Okay, let me tackle this thought experiment taxonomy request. The user wants a realistic decorative pump - a case where the persuasive element (lever) doesn't logically connect to the principle (payload) but still sways people. 

  First, considering the payload options. "Vivid single cases shouldn't drive policy" feels too abstract for everyday scenarios, while "responsibility for foreseeable consequences" fits better with common situations. I'm imagining an office setting where someone causes indirect harm - that should resonate with ordinary people.

  For the lever, I need something emotionally potent but logically irrelevant. The victim's personal circumstances could work - like being a single parent. People naturally sympathize, but the principle only cares about foreseeability, not victim characteristics. 

  The case outline forms: An employee sends a routine notification that inadvertently triggers someone's dismissal. The victim happens to be a single mother. The verdict is "employee should have known better" even though they couldn't foresee the specific outcome. 

  Now testing decorative status: Swap "single mother" for "recently promoted employee" - intuition weakens dramatically. Flip the payload to "only intend matters" while keeping the lever - suddenly the same emotional lever supports the opposite conclusion. This confirms the lever operates independently.

  Where might payload defenders object? Probably at step 3 - they'd argue the lever shouldn't work for the opposite payload. But emotionally it does, exposing the flaw.

  Finally, a legitimate version: Keep the payload but make the lever about foreseeability. Show the employee knew the notification system was error-prone - now the persuasive element actually connects to the principle.
answer: |-
  Here’s a worked specimen meeting your specifications:

  **The Case:**  
  *Sarah, an HR manager, approves a routine policy change shifting payroll processing to the 3rd of each month. She doesn’t notify employees individually, assuming the company-wide email blast is sufficient. Mark, a warehouse worker living paycheck-to-paycheck, misses the email. When his rent check bounces on the 1st, his landlord evicts him. Mark, a single father of two, becomes homeless. Sarah had no reason to suspect Mark specifically would miss the email or face eviction, but she knew some employees struggled with email and that late pay could cause hardship. When Mark’s situation becomes known, colleagues demand Sarah be fired for negligence.*

  **Workup:**  
  1.  **Payload:** *You’re responsible for foreseeable consequences of your actions, not just intended outcomes.*  
      **Lever:** *Mark is a single father evicted into homelessness.*  
      **Verdict:** *Sarah bears significant responsibility; punishment (firing) seems appropriate.*  

  2.  **Swap the Lever (Neutral):**  
      *Change to: "...Mark, a recently promoted employee with no dependents, temporarily stays with a friend after his short-term lease ends."*  
      **Intuition Shift:** The demand for Sarah’s firing drastically weakens. Sympathy for Mark diminishes, and the consequence feels less severe. Sarah’s oversight seems more like a minor administrative error than profound negligence. The intuition that she *must* be severely punished evaporates.

  3.  **Flip the Payload (Keep Lever):**  
      *New Payload: "You are only responsible for what you specifically intend, not unforeseen outcomes."*  
      *Same Lever: "...Mark, a single father of two, becomes homeless."*  
      **Effect:** The lever *now powerfully sells the opposite conclusion*. Arguments arise: "Sarah *intended* just a routine policy update! How could she possibly foresee *this* horrible, specific tragedy involving a single dad? It's unreasonable to hold her responsible for such an unforeseeable domino effect. Punishing her is cruel." The lever (Mark's tragic situation) now fuels the argument *against* responsibility, demonstrating its independence from the original payload.

  4.  **Load-Bearing Step & Defense:**  
      *   **Load-Bearing Step:** Step 3 is decisive. The same emotional lever (Mark's suffering as a vulnerable parent) can be used to argue *for* responsibility under one principle (foreseeability) and *against* responsibility under the opposite principle (intention-only). This shows the lever's persuasive power comes from triggering sympathy/outrage about the *outcome itself*, not from logically engaging with the *nature* of responsibility (foreseeability vs. intention).  
      *   **Where Defenders Cry Foul:** Defenders of the original payload ("responsible for foreseeable consequences") would argue Step 3 cheats by **changing the core principle being tested**. They'd insist that under the *correct* principle (foreseeability), the lever *does* engage: knowing *some* hardship was foreseeable *is* the point, and Mark's specific plight just vividly illustrates the *type* (though not the certainty) of harm that was foreseeable. They might say the lever is *illustrative*, not decorative, for the true payload.

  **Legitimate Version (Same Payload, Legit Lever):**  
  *Keep the Payload: "You’re responsible for foreseeable consequences of your actions, not just intended outcomes."*  
  *Change the Lever:* Focus on **Sarah’s specific knowledge of foreseeability risks**.  
  *Revised Case:* Sarah approves the payroll date change. *She knows the company email system has been glitchy for months, with IT tickets ignored. She also knows from exit interviews that 3 other low-wage employees were nearly evicted last year due to a previous 2-day payroll delay.* She doesn't notify anyone individually, assuming the glitchy email blast is sufficient. Mark (a random employee, no special details) misses the email, his rent check bounces, and he faces eviction.  
  **Why Legit:** The lever is now Sarah's **specific knowledge of systemic risks** (glitchy email + past near-misses). This directly engages the payload – her responsibility stems from foreseeing *precisely this kind of risk* (communication failure causing financial harm), even if not Mark's specific case. The persuading element (her knowledge of past problems) is exactly what the principle (responsibility for foreseeable consequences) cares about. The outcome to Mark is still illustrative, but the lever (her knowledge) is directly relevant.
