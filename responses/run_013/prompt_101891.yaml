  What's your actual credence that the Lucas–Penrose argument, in the rough form that we can see the truth of the Gödel sentence for any formal system we know ourselves to be, so we can't be such a system, refutes mechanism? Don't say it's an open question, give me a number and then pull it apart. I want rough probabilities for each load-bearing piece and how they combine: that human mathematical reasoning is consistent, or at least sound, in the sense the argument needs; that we can genuinely grasp the truth of the Gödel sentence for a system we've identified as the one we ourselves reason in, rather than only for systems we're inspecting from the outside; that it survives the standard reply that the machine simply adds the unprovable sentence as a fresh axiom and rolls on, including whether that reply only works because a machine's soundness is something it can never certify about itself; and how much of the conclusion is just a trick of which sense of formal system we quietly picked, i.e. whether mechanism is being taken to require a system we can fully specify. Then something I want you to actually take a stance on: suppose we build a machine with reflection principles, so that when it's handed its own Gödel sentence it outputs unprovable in the base system but true in the extension. Is that a machine doing the very thing Penrose says only we can do, or is it the moving of the goalposts made explicit, and does either answer change your number? Finally, tell me which single sub-question the whole thing hangs on and what would really move that one for you, a proof, a counterexample, or a better formalization of what we can see. For what its worth I'm sitting around 0.3 and don't trust it.
