answer: |-
  Your argument tackles a deep tension in the philosophy of probability, and your proposed solution is insightful. Here's a breakdown addressing your three points, the dilemma, and the cost of your normative commitment:

  1.  **The Constitutive/Substantive Dilemma: Real or False Dichotomy?**
      *   **It's a Genuine Dilemma for the *Central Role* of PP:** Your core point holds significant force. If PP is *purely* constitutive (a definition), then a theory generating undermining futures isn't *violating* a norm; it's simply talking about something else entirely. The complaint shifts from "this theory is wrong about chance" to "this theory isn't talking about chance *as we've defined it*." Conversely, if PP is *purely* a substantive epistemic norm derived from elsewhere, then the burden of proof shifts entirely to justifying *why* credences *must* align with this specific quantity "chance" (especially when undermining threatens).
      *   **But it's Not an Absolute Dichotomy:** The fork isn't strictly false, but it might oversimplify how definitions and norms interact in practice. A constraint can be both:
          *   **Definitional Core:** PP arguably captures the *core functional role* that distinguishes "chance" from mere relative frequency, propensity, or credence. It tells us what kind of thing chance *is for* (guiding rational credence under specific epistemic conditions). Without *some* connection to rational credence, it's unclear why we should call it *chance* rather than just a physical parameter.
          *   **Answerable to Practice/Normativity:** This functional role isn't plucked from thin air; it's *informed* by our epistemic practices and intuitions about how we *ought* to set credences when we have certain kinds of evidence. The definition is shaped by normative epistemic considerations.
      *   **The Dilemma Bites Hardest for Lewisian Humeanism:** Your dilemma is particularly potent *against Lewis's project*. Lewis *needs* PP to do both jobs simultaneously: to *define* what chance *is* within his metaphysics (the Best System Analysis - BSA) *and* to explain why rational agents *ought* to obey it. The undermining problem arises precisely because the BSA, attempting to satisfy PP constitutively, generates cases where satisfying it normatively seems impossible. The tension you identify is at the heart of the "big bad bug."
      *   **Conclusion on the Fork:** While the constitutive/substantive distinction isn't watertight metaphysically, it effectively highlights the *functional tension* Lewis faces. PP *cannot seamlessly perform both the defining and the norm-justifying roles for chance within the BSA framework* without encountering the undermining problem. Your dilemma successfully exposes this.

  2.  **Chance-Independence vs. Admissibility:**
      *   **Distinct but Related:** Your chance-independence restriction is *not* merely a relabeling of admissibility; it targets a different aspect of the problem, though they overlap significantly.
      *   **Admissibility (Standard PP):** Focuses on the *agent's evidence*. It prohibits evidence that "screens off" the chance or provides information about the future chance itself. "H" in the standard formulation (Cred(A | [Ch_t(A) = x] & E) = x) must be admissible relative to A and t. Admissibility rules out evidence about future chances or "inadmissible" historical information relevant to undermining.
      *   **Chance-Independence (Your Proposal):** Focuses on the *proposition A itself*. It restricts PP's application to propositions whose truth *does not logically or metaphysically depend* on the global chance distribution Ch itself. This directly attacks the *source* of undermining: undermining futures are propositions (F) whose truth (or falsity) *entails* that the chance distribution Ch is different from what it is claimed to be. F is *chance-dependent*.
      *   **The Work Your Restriction Does:**
          *   **Directly Addresses Undermining:** By restricting PP to propositions A that don't bear on Ch, you sidestep the undermining problem entirely *at the level of the proposition*. Undermining futures are simply excluded from PP's domain.
          *   **Potentially Broader/Narrower?** It *might* exclude propositions that aren't obviously inadmissible evidence problems but whose truth still depends on Ch in a way that could cause conflict. Conversely, it *might* allow PP application to some propositions even if the agent had inadmissible evidence *about them*, as long as the proposition *itself* is chance-independent (though this seems unlikely to be useful or rational).
          *   **Clarifies the Scope Problem:** It starkly reveals the limitation: in worlds where Ch supervenes on the entire Humean mosaic (especially deterministic or undermining-permitting ones), *very few* interesting propositions are truly chance-independent. The truth of most specific future events, and crucially, the truth about the mosaic itself, *does* bear on Ch within Humeanism.
      *   **Conclusion:** While closely linked to the motivation for admissibility clauses, chance-independence is a distinct conceptual move focusing on the *object* of credence rather than the *agent's state*. Its primary work is to *directly quarantine* the undermining problem by restricting PP's domain, making explicit the severe limitations this imposes in Humean worlds.

  3.  **Near-Emptiness for the Humean: How Damaging?**
      *   **It's Devastating to the Original Lewisian Aspiration:** Lewis wanted PP to be a substantial, widely applicable epistemic norm *grounded by and explaining* chance via the BSA. If PP is restricted to chance-independent propositions and is nearly empty in the worlds the BSA describes (deterministic or undermining-permitting), then:
          1.  **Chance Loses its Central Function:** The core role of chance – guiding credence about the *future* and the *unknown* – is gutted. If PP only applies to propositions whose truth doesn't affect Ch, and these are rare, chance becomes epiphenomenal for guiding most beliefs.
          2.  **BSA Justification Undermined:** A major argument for the BSA was that it satisfied PP. If PP is nearly inapplicable within the worlds the BSA governs, this justification evaporates. Why prefer the BSA "chance" if it doesn't connect to rational belief in the way we demanded?
          3.  **The "Big Bad Bug" Morphs:** Instead of a contradiction, the Humean faces *irrelevance*. The theory can define a quantity "Ch", but this quantity fails to play the functional role (rational credence guidance for future contingents) that motivated calling it "chance" in the first place.
      *   **Can the Humean Adapt?** A sophisticated Humean (like a later Lewis or followers like Loewer, Hall, or Ismael) might try to bite the bullet:
          *   **Accept Near-Emptiness:** Acknowledge PP in its original, robust form doesn't hold globally. Chance, on their view, is still the BSA probability, useful for prediction *in limited contexts* or from *limited perspectives* where undermining isn't salient. PP applies where it can, even if that's minimal.
          *   **Seek a Replacement Norm:** Propose a modified norm (e.g., the New Principle: Cred(A | [Ch_t(A) = x] & H) = x / Ch_t(Ch_t = x), or a "meta-rule") that *is* satisfiable within the BSA framework and recovers much of PP's guidance in practice, especially when agents lack knowledge of undermining threats.
          *   **Redefine the Role:** Argue that chance's primary role isn't direct credence guidance via PP, but something else (e.g., explanation of frequencies, best compression).
      *   **The Cost of Adaptation:** These moves involve significant concessions:
          *   **Loss of Centrality:** Chance no longer plays the straightforward, dominant epistemic role PP envisioned.
          *   **Complexity & Counterintuitiveness:** Replacement norms (like the New Principle) are less intuitive and direct than PP.
          *   **Weakened Anti-Humean Argument:** While it avoids outright contradiction, the near-emptiness still makes Humean chance look like a pale shadow of the robust epistemic guide anti-Humeans (e.g., propensity theorists) might posit. The Humean position survives, but arguably in a significantly weakened form regarding the *normative force* of chance.

  **The Cost of Your Normative Commitment:**

  You are committed to PP being a genuine substantive norm, not just a definition. This costs you:

  1.  **The Burden of Justification:** You *must* provide (or point to) a compelling argument for *why* rational credence *must* align with known chance. You rightly note existing arguments often presuppose PP or establish weaker admissibility. You need an independent epistemic foundation. This could be:
      *   **Pragmatic/Decision Theoretic:** Arguments that violating PP makes you vulnerable to diachronic incoherence (Dutch books) or prevents you from achieving certain epistemic goals (e.g., calibration, minimizing inaccuracy) *in the long run* or *across possible situations*. These arguments are powerful but face challenges (e.g., actual vs. possible long runs, justification for specific scoring rules).
      *   **Epistemic Authority:** Arguments that chance represents an objective, authoritative epistemic expert that it would be irrational to ignore. This leans towards anti-Humean metaphysics.
      *   **Synthetic A Priori / Conceptual Role:** Arguing that the normativity is part of the very concept of objective chance we employ, even if it's not purely definitional. This requires careful meta-ethical/epistemic work.
  2.  **Potential Vulnerability to Skepticism about Chance:** If the justification for the norm is shaky, or if chance itself proves metaphysically dubious, the norm loses its force. If chance isn't "real" in a robust sense, why *must* we obey PP?
  3.  **Compatibility Challenges:** You need to ensure your normative PP is compatible with a plausible metaphysics of chance. Your chance-independence move is a step in this direction, accepting that PP's scope might be limited in certain worlds. This might push you towards non-Humean views (propensities, primitives) where chance is more fundamental and less susceptible to undermining, allowing PP broader scope.

  **Overall Assessment & Suggestions:**

  *   **Strengths:** Your core dilemma effectively captures the tension in Lewis's project. The chance-independence restriction is a clever and logically sound way to quarantine undermining, making explicit the severe limitation it imposes on PP within Humeanism. Your diagnosis of the near-emptiness being deeply problematic for the Humean is correct.
  *   **Refinements:**
      *   **Clarify "Chance-Dependence":** Precisely define what "bear on the chance distribution itself" means. Is it logical entailment? Supervenience? Counterfactual dependence? This matters for the scope.
      *   **Engage the "Both" View:** Briefly address the potential "both constitutive and normative" view. Argue that while definition and normativity are intertwined, the *functional demands* placed on PP within the BSA lead to the dilemma. The BSA *needs* PP to define chance *and* to be universally binding, and that's where it runs aground.
      *   **Humean Response Nuance:** Acknowledge that sophisticated Humeans *do* try to adapt (New Principle, etc.). Argue why these adaptations are costly concessions that fundamentally alter the original, robust role envisioned for chance and PP, rather than fully solving the problem. The "near-emptiness" critique applies to the *original aspiration*.
      *   **Cost of Normativity:** Be explicit about the justificatory burden you accept and hint at (or develop) the type of argument you find promising for the substantive norm. Acknowledge the challenge.
  *   **Conclusion:** Your line of argument is powerful and philosophically sound. It presents a serious challenge to Lewisian Humeanism. Committing to the substantive norm is defensible but requires careful attention to justification and metaphysics. The chapter, as sketched, promises a clear and incisive contribution to the debate on the Principal Principle and Humean chance.
