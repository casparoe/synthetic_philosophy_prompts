prompt: |-
  I'm a third-year PhD in political philosophy and I'm stuck in a reading-group fight that refuses to move. It's the leveling-down thing. Prioritarians say the egalitarian is committed to thinking it can be in some respect better if the worse-off are worse off — no wait, better if the better-off are dragged down to the level of the worse-off, even when literally no one gains from it. Egalitarians say that's a gotcha aimed at a strawman: nobody thinks it's impersonally better for the top to drop while the bottom sits untouched, and equality is about the relations between people, about what claims they can make on each other, not about how much good the world contains. We've gone round this maybe six times. Everyone knows every move, everyone has a comeback, nobody budges an inch.

  My hunch — test it, don't just nod — is that it isn't really a fight about leveling down at all. I think the two sides are answering different questions under one word. The prioritarian is doing axiology, ranking outcomes by how much good is in them, weighted so a gain to someone worse off counts for more. The egalitarian is doing something more like a theory of what we owe each other, of which comparisons between persons generate claims in the first place. If that's right then "is leveling down bad?" gets a yes from one and a "wrong question" from the other, and the impasse is structural, not a sign that someone's being obtuse.

  But I don't trust that diagnosis, because there are at least three others floating around: maybe it's verbal (they mean different things by 'value' or by 'equality'), maybe it's a real disagreement about whether there are impersonal values at all, or maybe it's bedrock — a clash of intuitions about whether a world with less total good but more equality can ever be better, which neither side can argue for. So diagnose it properly. Tell me which of these it actually is, using what each side really says rather than the bumper stickers, and flag any hidden empirical or formal question that's secretly doing the work.

  Then the part I actually care about: given your diagnosis, what would count as progress? A distinction, a translation scheme between the two vocabularies, a case one side has to accept but can't describe, a formal result showing the two are extensionally equivalent but conceptually distinct? Or should I just conclude nothing will move it and stop wasting my Thursdays?

  And one more thing I keep chewing on. Suppose someone could show that every prioritarian ranking can be reproduced by some egalitarian-style structure of claims and vice versa — same verdicts, different reasons. Would that make the dispute merely verbal, or does it just relocate the disagreement to what the reasons are for? Engage with that seriously, don't just tell me it depends. Also — is there a case where the leveling down happens somewhere the worse-off never find out about, and does that change which diagnosis is right?
reasoning: |-
  Okay, let me try to unpack this PhD student's problem. They're stuck in a reading group debate about leveling down between prioritarians and egalitarians that's gone circular. Their hunch is that it's not really about leveling down at all, but about different questions being asked - axiology vs claims of justice. But they're unsure and want a proper diagnosis.

  First, I need to recall the core positions. Prioritarians focus on weighted well-being where benefits to the worse-off matter more. Egalitarians care about relational equality and claims people can make on each other. The leveling down objection claims egalitarians must accept that making everyone equally poor is better than inequality, even when no one gains.

  The student proposed several possible diagnoses: 1) structural (different questions), 2) verbal (different meanings), 3) substantive (impersonal values), or 4) bedrock (irreducible intuitions). 

  Looking deeper, the key is that prioritarians are evaluating states of affairs while egalitarians are evaluating social relations. When prioritarians say "better" they mean more good in the world, but egalitarians mean more just relations. So the leveling down case is irrelevant to egalitarians because no claims are addressed - it's a non-justice scenario.

  But there's a twist - some egalitarians do think equality has impersonal value. This creates a split within egalitarianism itself. For relational egalitarians, leveling down isn't about justice at all. For telic egalitarians, it might be impersonally better but not all-things-considered better.

  The formal equivalence point is interesting. Even if prioritarian weights and egalitarian claims produce same outcomes, the reasons differ fundamentally. Prioritarians see it as benefitting individuals, egalitarians as correcting unjust relations. This isn't merely verbal - it affects how we diagnose injustice and structure institutions.

  For progress, I'd suggest: 1) Mapping the internal split in egalitarianism, 2) Creating a "claims test" for leveling down cases, 3) Analyzing cases with information asymmetry, 4) Examining non-identity cases where benefits to worse-off create future inequality.

  The hidden formal issue is separability - whether justice evaluations can be person-dependent. Prioritarians can evaluate isolated individuals, egalitarians inherently relational.

  On the vice-versa equivalence question - no, it wouldn't make the dispute verbal. The justifications matter for moral psychology, responsibility, and corrective actions. A prioritarian redistribution is aid, while egalitarian is restitution - fundamentally different framings.

  In the secret leveling down case, this actually clarifies the diagnosis. If the worse-off never know, relational egalitarians wouldn't care because no social relations change. But telic egalitarians might still see impersonal value in the equality itself. Prioritarians would clearly oppose it as reducing total weighted good.

  The deepest issue is whether equality is a good in itself or a feature of relations. This goes beyond semantics to how we conceptualize morality's foundation.
answer: |-
  Your hunch is perceptive but incomplete—the core issue is structural *and* conceptual, with a lurking empirical split. Let's diagnose rigorously, using the arguments each side actually deploys (beyond bumper stickers), then chart paths to progress.  

  ---

  ### **Diagnosis: Structural Framing + Conceptual Priority + Hidden Empiricism**  
  1. **Structural Divergence (Your Hunch, Mostly Correct)**  
     - **Prioritarians** (e.g., Parfit, Weirich) are engaged in **axiological welfarism**: They rank outcomes by *aggregate weighted well-being*, where weight increases with disadvantage. Leveling down is incoherent here because it reduces aggregate weighted good.  
     - **Relational Egalitarians** (e.g., Anderson, Scheffler) practice **comparative justice**: They ask which inequalities constitute *unjust social relations* (e.g., domination, disrespect). Leveling down doesn’t address injustice—it merely destroys goods without altering relations of oppression. For them, "Is leveling down better?" is nonsensical—it’s like asking if breaking everyone’s legs "solves" disability injustice.  

  2. **The Hidden Wedge: Telic vs. Relational Egalitarianism**  
     - Your group conflates two egalitarianisms:  
       - *Telic egalitarians* (e.g., Temkin) *do* think equality has impersonal value. They *might* reluctantly concede leveling down is "in one way better" (more equal) but "all-things-considered worse" (less well-being).  
       - *Relational egalitarians* reject telicism entirely. For them, equality isn’t about states of affairs but *social justifiability*: Can disparities be defended to the worse-off without appealing to privilege?  
     - **The Real Fight**: Prioritarians attack telic egalitarianism; relationalists deflect by saying "That’s not us!" But if your group has telic egalitarians, they *are* vulnerable to leveling down—and the dispute becomes bedrock.  

  3. **The Empirical Skeleton: What Counts as a "Gain"?**  
     - Prioritarians assume well-being is measurable interpersonally (e.g., via utility functions). Egalitarians often reject this, arguing that "gains" in non-relational metrics (e.g., GDP) mask *relational harms* (e.g., stigma).  
     - **Hidden Formal Question**: Is well-being *separable* from social position? If so, prioritarian axiology holds. If not (e.g., social exclusion reduces the value of resources), relationalism gains ground.  

  ---

  ### **Paths to Progress**  
  1. **Force the Telic/Relational Distinction**  
     - Challenge egalitarians: "When you say 'equality is valuable,' is it because (a) unequal states are intrinsically bad, or (b) unequal *social relations* generate unjust claims?"  
     - If (a), prioritarians have a point. If (b), reframe leveling-down cases to test claims: *"Does lowering the top *without the bottom’s consent* address their claim against inequality?"* (Spoiler: No.)  

  2. **The Claims Test**  
     - Design cases where leveling down *does* alter relations:  
       > *Factory A*: Top earners take a pay cut to fund bottom-earner training. Bottom gains skills + respect.  
       > *Factory B*: Top’s pay cut is burned; bottom gets nothing.  
     - Prioritarians: B is worse (no weighted gain).  
     - Relationalists: A may be just (claims addressed); B is irrelevant to justice.  
     - **Progress**: If both agree A ≠ B, they’re answering different questions.  

  3. **Secret Leveling Down Case**  
     - Imagine a hidden caste system destroyed by an earthquake that kills only elites. The worse-off never know inequality existed.  
       - Prioritarians: Worse outcome (net well-being ↓).  
       - Telic Egalitarians: Better in one respect (equality ↑).  
       - Relational Egalitarians: No change (no relations altered).  
     - **Diagnostic Power**:  
       - If egalitarians split (telic vs. relational), your dispute is about value ontology.  
       - If all relationalists say "no justice change," it confirms the structural divide.  

  ---

  ### **Formal Equivalence: Would It Resolve Anything?**  
  Suppose prioritarian weights and egalitarian claims yield identical rankings.  
  - **Not Merely Verbal**: Reasons matter morally. Prioritarians see aiding the worse-off as *beneficence*; egalitarians see it as *correcting unjust relations*. This affects:  
    - **Blame**: Prioritarians fault unfair *outcomes*; egalitarians fault unfair *agents*.  
    - **Institutions**: Prioritarians optimize allocations; egalitarians dismantle hierarchies (e.g., democratizing workplaces).  
  - **Relocated Disagreement**: The fight moves to "What grounds the ranking?" Is it compassion for individuals (prioritarian) or anti-oppression (egalitarian)? This is substantive, not semantic.  

  ---

  ### **Conclusion: What Should You Do?**  
  1. **Map the Terrain**:  
     - Identify who is telic vs. relational egalitarian.  
     - Run the secret inequality case.  
  2. **Shift Frameworks**:  
     - Demand prioritarians engage relational claims (e.g., "Does your weighting respond to *social disrespect*?").  
     - Demand egalitarians explain *why* relations matter without slipping into telicism.  
  3. **Exit Strategy**:  
     - If the group won’t clarify positions, declare the discussion meta-ethical: "We disagree about the *subject matter* of distributive justice." Then move to applied topics (e.g., "How would each view tax inheritance?").  

  **Bottom line**: The impasse isn’t stubbornness—it’s a collision of moral paradigms. Progress requires exposing the hidden premises (telic vs. relational, separable well-being) and agreeing on what question they’re fighting over. If Thursday’s debate stays unproductive, redirect to cases where the theories *do* diverge (e.g., non-identity problems). Life’s too short for sixth-round stalemates.
