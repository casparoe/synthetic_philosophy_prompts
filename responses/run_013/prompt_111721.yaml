prompt: |-
  I keep a running list of cases where I'd say I know something versus cases where I'd only say I believe it, and I want to find the principle behind the list. For context: I'm a software engineer with no formal training in philosophy. A friend lent me a book on classical Indian epistemology, and the framework in it recognizes four means of knowledge — perception, inference, comparison or analogy, and testimony from a trustworthy source. I'd like to test my intuitions against that framework, or against something simpler if my list won't fit it. Here is the list, with the verdict I actually have.

  I see smoke rising over the ridge and conclude the cabin is on fire. I'd say I know the cabin is on fire.

  I read 101.4 off a digital thermometer and conclude I have a fever. I'd say I know I have a fever, even though I have no idea whether the thermometer is calibrated or who made it.

  My doctor examines me and tells me I have strep throat. I'd say I know it.

  A stranger in line at the store, with no particular expertise, tells me I have strep throat. I'd say I don't know it, even if it turns out he's right.

  A park ranger tells me that a gavaya looks just like a cow except for its horns. Later I see one in the forest and recognize it as a gavaya. I'd say I know what a gavaya is, and I'd say the ranger's description is what gave me that knowledge.

  I remember locking the front door last night. I'd say I know I locked it — even though the book says memory doesn't get its own slot among the means of knowledge, because it only replays a cognition some earlier means already produced.

  A friend tells me the movie starts at seven. I'd say I know it starts at seven.

  Now the two that I can't get to sit together. First: I glance at the sundial in my yard and read the time. I'd say I know the time. Second: a neighbor glances at the same sundial and tells me the time. I'd also say I know the time. But a printed card taped to the theater door that reads "showtime 7:00" — I would not say I know the showtime from the card alone, because I don't know who printed it or whether it's current. All three are just marks on a surface that I'm taking as telling me something. I keep wanting to say the sundial is different because I'm reading it directly and the card is different because someone is speaking to me through it, but I can't state the difference in a way that survives contact with the next case.

  Here's the tentative principle I came up with on my own, which I'd like you to test and repair rather than just accept: a belief counts as knowledge when it was produced by a process that reliably tracks the fact in question, and I have no specific reason to doubt it on this particular occasion. That principle seems to get the smoke, the doctor, and the sundial right, and to get the stranger and the printed card right. But I notice it treats my memory of the door and the stranger's claim about strep the same way — both are fallible processes that happened to be right this time — and yet I accept the first and reject the second. So either the principle is wrong, or one of those two verdicts has to go.

  What I want from you:

  First, say whether any single principle captures my whole list, or whether I need a small set of them. If it takes a set, state each principle precisely and tell me which case in my list motivates each one.

  Second, if the four-means framework from the book is the best fit, tell me which of my verdicts it forces me to give up — and be honest about whether it actually explains my verdicts or merely relabels them. If a simpler principle fits better, tell me which of my verdicts it overturns and why I should accept the loss.

  Third, apply whichever account you land on to two cases I haven't listed, and commit to a verdict for each. The first: I measure a distance on a topographic map with a piece of string and conclude the summit is three miles away. The second: I read a pressure value off a factory gauge, and it turns out the gauge is broken but happens to display the correct value at that moment. I want to know whether your account says I know in each case, and if the two come out differently, what exactly does the work.

  Fourth, tell me where the account runs out — the kind of case it can't decide, or the intuition it can't honor no matter how it's patched.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating epistemic puzzle with clear cases where they intuitively distinguish between "knowing" and "merely believing." Their self-proposed principle - reliable process plus absence of specific doubt - seems promising but fails on the memory/stranger asymmetry. 

  Hmm, the classical Indian framework (pratyakṣa, anumāna, upamāna, śabda) feels relevant but rigid. That memory exclusion particularly bothers them - and me - since lived experience treats memory as knowledge-generating. The sundial/theater-card contrast is the real killer though: identical physical media (marks on surface), different epistemic status. Why? 

  *scribbles mentally* The key might lie in source evaluation. Sundials have constrained failure modes (daylight/position), while anonymous cards introduce human mediation risks (outdated info, pranks). But then the neighbor case - human mediation - still yields "knowledge." So it's not mediation per se... 

  *lightbulb* It's about trust calibration! With the neighbor, I can assess their sincerity/competence (they're glancing directly at the sundial). The card's origin is opaque. Similarly, the doctor has manifest expertise while the stranger doesn't. Memory gets a pass because self-trust is foundational - we'd be epistemic cripples without it. 

  *testing against cases* 
  - Topographic map: Knowledge, because mapmaking/charting is a reliable process I've tested before. 
  - Broken gauge: Not knowledge - the process is defective even if accidentally correct. The "no specific doubt" clause saves me here since gauges can fail silently. 

  But the limit... *pauses* ...is when processes have opaque reliability. Like algorithmic decisions: the credit score says "denied" - do I know I'm high-risk? The process is statistically reliable but I can't verify it. My account would say "knowledge" absent specific doubts, but that feels uneasy. Maybe that's where testimony needs hierarchical evaluation - knowing the system's track record becomes meta-testimony. 

  Final note: Their engineer mindset shines through. They want a debugged epistemic framework - not philosophy for its own sake, but clean principles for shipping robust cognition. Admirable.
answer: |-
  Your intuitions are remarkably consistent, and your self-proposed principle is 90% correct—it just needs refinement to handle the memory/stranger asymmetry. Here’s a precise account that preserves *all* your verdicts, grounded in a hybrid of classical Indian epistemology and process reliabilism.

  ---

  ### **The Core Principle (Refined)**  
  **A belief counts as knowledge iff:**  
  1. **It’s produced by a reliable process** (one that *generally* tracks truth in this context), *and*  
  2. **The reliability of the process is either:**  
     - **Directly accessible to you** (e.g., you understand its mechanics), *or*  
     - **Indirectly justified via trusted testimony** (where the testifier has direct access to reliability).  
  3. **No undefeated defeaters exist** (you lack specific reasons to doubt *this instance*).

  ---

  ### **How It Explains Your List**  
  | Your Case                          | Verdict      | Application of Principle                                                                 |  
  |------------------------------------|--------------|------------------------------------------------------------------------------------------|  
  | **Smoke over ridge**               | Know         | *Perception* (reliable) + you understand causal link (smoke→fire).                       |  
  | **Thermometer reading**            | Know         | *Perception* (reliable instrument) + you assume calibration absent defeaters.            |  
  | **Doctor’s diagnosis**             | Know         | *Trusted testimony* (expert access to reliable process: medical training).               |  
  | **Stranger’s strep claim**         | Don’t know   | Untrusted testimony (no evidence of reliable process; stranger lacks expertise/access).  |  
  | **Park ranger describes gavaya**   | Know         | *Trusted testimony* (expert) + later *perception* confirms via analogy (*upamāna*).      |  
  | **Memory of locking door**         | Know         | *Memory* is a reliable process for recent events + no defeaters.                         |  
  | **Friend says movie starts at 7**  | Know         | *Trusted testimony* (friend has incentive/ability to access reliable source).            |  
  | **Sundial reading**                | Know         | *Perception* + understanding how sundials work (direct access to reliability).           |  
  | **Neighbor reads sundial**         | Know         | *Trusted testimony* (neighbor directly perceived same reliable process).                 |  
  | **Printed card on theater door**   | Don’t know   | *Untrusted testimony* (opaque process: no access to who made it/if it’s current).        |  

  **Key insight**: The sundial vs. card difference hinges on **evaluating the testimony’s source**. You trust the neighbor because you *see* them accessing the sundial (direct reliability). The card’s source is anonymous—you can’t verify if its creation/distribution was reliable. Memory is privileged because self-generated processes are *presumptively reliable* absent defeaters, unlike strangers’ claims.

  ---

  ### **Why the Classical Indian Framework Fits (With One Tweak)**  
  The four *pramāṇas* (means of knowledge) align if we treat **testimony** (*śabda*) as **hierarchical**:  
  - **Perception** (*pratyakṣa*): Smoke, thermometer, sundial, gavaya sighting.  
  - **Inference** (*anumāna*): Smoke → fire (implicit).  
  - **Analogy** (*upamāna*): Recognizing gavaya via ranger’s comparison.  
  - **Testimony** (*śabda*): Doctor, ranger, friend, neighbor—**but only if the speaker’s reliability is established**.  

  **The tweak**: Testimony requires **second-order reliability** (knowing *why* the speaker is credible). The book’s framework *would* reject your memory verdict (since it’s not an independent *pramāṇa*), but your intuition is correct—memory is a first-order process. **Keep your verdict; reject the book’s exclusion of memory**.

  ---

  ### **Applied to Your New Cases**  
  1. **Topographic map + string measurement**:  
     - **Verdict: KNOW**  
     - *Why*: Reliable process (map scaling/string measurement) + you understand its mechanics (direct access to reliability). No defeaters.  

  2. **Broken factory gauge showing correct value**:  
     - **Verdict: DON’T KNOW**  
     - *Why*: Process is *unreliable* (gauge is broken), even if correct this time. The "no specific doubt" clause saves you only if the process is *generally* reliable—here it’s defective.  

  **What does the work?** The gauge case fails criterion #1 (reliable process), while the map case satisfies all criteria. The gauge’s accidental correctness is "Gettiered"—justified true belief without knowledge.

  ---

  ### **Where the Account Runs Out**  
  **The limit**: **Self-fulfilling unreliable processes**.  
  - *Example*: You believe "I will win the lottery" based on a dream. You buy a ticket and win.  
  - *Problem*: The process (dreams) is unreliable, but it "worked." Your principle says *don’t know*—yet if this happens repeatedly, you might intuit knowledge.  
  - **Why it breaks**: Reliability requires *counterfactual robustness* (e.g., "Would I still be right if the lottery number changed?"). Dreams fail this, but repeated "success" can *feel* like knowledge.  

  **Another edge**: **Deeply embedded trust** (e.g., trusting quantum physics without understanding). You *say* you "know" due to expert consensus, but your access to reliability is purely social. The principle *allows* this (via trusted testimony), but purists might argue it’s not "true" knowledge without personal verification.

  ---

  ### **Final Recommendation**  
  Stick with your refined principle. It:  
  1. Explains all your cases,  
  2. Absorbs the best of Indian epistemology (rejecting only its memory exclusion),  
  3. Handles edge cases cleanly (e.g., broken gauge vs. map),  
  4. Acknowledges testimony’s social dimension without overtrusting strangers.  

  **What to jettison**: The classical framework’s dismissal of memory. Your intuition that memory *is* knowledge-generating is empirically sound—cognitive science shows memory is reconstructive but generally reliable.
