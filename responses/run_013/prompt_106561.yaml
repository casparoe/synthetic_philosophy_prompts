prompt: |-
  For several years I have kept a notebook of what I consider my own best ideas, and a pattern has emerged in it that I can describe but cannot name. Nearly every entry is a variation on something that already existed. One is a musical idea: a rhythmic figure lifted from one instrument and given to another while the melody is held fixed. Another is a proof: a technique that is routine in one branch of mathematics applied to a structure where nobody had thought to apply it. Another is a joke whose entire force comes from substituting one word in an otherwise familiar phrase. In each case the raw material is old, and whatever is new lies in a small, deliberate change along a single dimension that I chose to vary while holding everything else constant.

  Lately I have come to suspect that the change itself is not where the creativity lives, and that the interesting act is the choice of dimension — the moment when a property that was previously invisible becomes a knob one can turn at all. Treating "which instrument" or "which branch of mathematics" as a free variable is a different kind of move from turning a knob that everyone already recognized as turnable, and I think the second is what people are gesturing at when they speak of creative insight. But I may be conflating two things that are really one, and I do not trust my own carving here.

  Is there an established concept for this? I am less interested in a label than in the shape of the thing, so tell me the nearest concepts you know of and exactly how each falls short. I have a vague sense that there is work on creativity as recombination, and on analogy or transfer between domains, but neither seems to be about the deliberate turning of a knob inside a representational structure, and neither appears to distinguish turning an existing knob from adding a new one. If nothing fits, coin the concept yourself, define it precisely, and mark its edges: what counts as a variation, and what is instead a replacement or an invention from nothing. I am not asking for a reading list; I want the carving.

  Lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of my question. And tell me what would change your mind about the carving — which case, if any, would show that the two things I want to keep apart are in fact a single phenomenon.
reasoning: |-
  Hmm, the user has been keeping a notebook of their best ideas and noticed a pattern: nearly every entry involves taking something existing and varying just one dimension while holding everything else constant. Examples include shifting a rhythmic figure to another instrument, applying a mathematical technique to a new structure, or substituting one word in a familiar phrase.

  They suspect that the creativity lies not in the variation itself but in choosing which dimension to vary—turning a previously invisible property into a "knob" that can be adjusted. They want to know if there's an established concept for this distinction between varying an existing knob versus recognizing a new knob. They're especially interested in the precise "carving" of this concept rather than just labels.

  The user explicitly asks for a bottom-line answer first, then reasoning, with no preamble. They also want to know what evidence might show their distinction isn't valid.

  I need to identify the closest existing concepts. Recombination theory (like Koestler's bisociation) involves combining domains but doesn't distinguish knob-creation from knob-turning. Analogical transfer focuses on mapping relationships but treats the source domain's knobs as given. Lateral thinking (de Bono) encourages shifting perspectives but isn't granular about dimension selection. Parameterization in math/CS involves explicit variables but assumes knobs are already defined.

  The core idea here is the act of parameterizing a previously fixed aspect of a structure—making an implicit dimension explicit and controllable. This is different from merely adjusting known parameters. The key creative leap is in seeing that something could be variable.

  For a definition: Parameterization Insight is recognizing that a previously fixed aspect of a system can be treated as a variable parameter, thereby creating a new dimension for variation. It counts when (1) the aspect was previously treated as inherent, (2) the variation is constrained to that dimension, and (3) the change is deliberate. It wouldn't count if the variation involves replacing core elements or creating entirely new structures.

  What might challenge this distinction? If a case showed that recognizing a new knob always involves the same cognitive process as turning a known knob, or if every knob-turn implicitly creates a new knob (like in infinite regress), that could suggest they're the same phenomenon. But examples like the musical instrument shift or math technique transfer seem to clearly separate the insight ("which instrument can vary") from the act of varying it.

  The user's examples all share this pattern: the creativity is in seeing what could be made variable, not the specific variation chosen. That's the insight worth naming and exploring.
answer: |-
  **The established concept nearest to your description is *parameterization*, but the critical creative act you identify—treating a previously fixed aspect as a new variable dimension—lacks a dedicated term; I propose calling this *parameterization insight***.  

  ### Why existing concepts fall short:  
  1. **Recombination (e.g., Koestler’s "bisociation")**: Focuses on merging *entire domains* (e.g., humor as collision of contexts). It does not isolate the act of selecting *one dimension* within a stable structure to vary deliberately. Your musical example keeps melody fixed while varying instrumentation—recombination would blend genres, not tweak a single axis.  
  2. **Analogical transfer**: Treats the source domain’s properties as *given* knobs (e.g., "math technique X is portable"). It misses the insight that a *previously invisible* property in the *target* domain (e.g., "which branch of math") can be made into a knob. Transfer applies an existing knob; your insight *creates* it.  
  3. **Lateral thinking (de Bono)**: Encourages disruptive shifts but does not distinguish *which* element is varied or whether that element was already variable. Turning a new knob could be lateral, but lateral thinking includes broader irrelevancies (e.g., random provocation).  

  ### Defining *parameterization insight*:  
  - **Core**: Recognizing that a hitherto intrinsic, fixed property of a system can be reconceptualized as a *free variable*, thereby creating a novel dimension for variation.  
  - **What counts**:  
    - The varied dimension was previously treated as inherent (e.g., "rhythmic figure *belongs* to instrument A," "technique *belongs* to branch X").  
    - Variation is constrained to *one* dimension while preserving the structure’s core relationships (e.g., melody unchanged, phrase syntax intact).  
    - The change is *deliberate*, not accidental.  
  - **Exclusions**:  
    - **Replacement**: Swapping elements *without* isolating a dimension (e.g., inventing a new instrument).  
    - **Invention from nothing**: Creating wholly new structures (e.g., a new musical scale).  
    - **Existing knob-turning**: Varying a pre-acknowledged parameter (e.g., changing a proof’s numerical inputs).  

  ### What would dissolve your distinction:  
  If a case showed that *every act of turning a known knob* inherently requires first recognizing it *as* a knob (making "knob-creation" and "knob-turning" recursive and inseparable), your two phenomena collapse. For example, if adjusting a proof’s variables *always* involved re-seeing the system’s fixed properties anew, the distinction would be artificial. Your musical example avoids this: a composer *could* routinely assign rhythms to different instruments (turning a known knob) without the insight that "instrumentation *is* a knob" in a previously rigid context.  

  ### Why *parameterization insight* fits:  
  It captures the shift from *implicit fixity* to *explicit variability*. In math, parameterizing an equation makes constants variable; your insight does this for conceptual systems. The creativity lies not in the value chosen (e.g., "cello instead of violin") but in seeing that "instrument" *is* a parameter at all.
