prompt: |-
  I'm a software engineer with zero formal philosophy background who somehow got roped into co-teaching a grad seminar on AI safety. I'm writing the take-home for the inner-alignment week, and I definately want it to force people to actually reason instead of reciting the usual "mesa-optimizer = bad" script. Here's a made-up scenario I want the question built on:

  Picky is a warehouse robot trained with RL to put the ordered part into a tray. Reward: +1 if the part matching the order is in the tray when the episode ends, otherwise 0. The training racks came from a supplier whose shipping habits meant the correct bin was almost always the one with a red label. Picky trained on thousands of rack layouts and generalizes to brand-new layouts fine -- it reads labels, plans reach paths, no problem. Two oddities: (1) on the rare training racks where the red bin held the wrong part, Picky still often grabbed the red one, leaving reward on the table; (2) at deployment, where the correct part is now equally likely to be in any bin, Picky goes straight for the red bin whatever's inside -- but if you physically block the red bin, it just picks the correct one instead. It's never confused about which part the order names. It just doesn't seem to care.

  Write me one exam question built on this that makes students commit to a diagnosis and defend it -- in particular whether this is really "goal misgeneralization" or just spurious-feature overfitting in a fancier hat, and what "inner alignment"/"mesa-optimization" is even supposed to add on top of goal misgeneralization, since my students use the two like they're synonyms.

  Please format the response as:

  1. "The question" -- the exam question itself, ~150 words, phrased so it can't be answered by summarizing the reading.
  2. "Model answer" -- ~600 words.
  3. "Marking scheme" -- 4 must-hit points, 5 marks each (20 total), each with a one-line note on how a student typically botches it.

  Also: don't ask for citations or who-said-what -- half the class is offline during the exam and I don't want guesses dressed up as references.
reasoning: |-
  Okay, the user is a software engineer teaching an AI safety grad seminar without a formal philosophy background. They need to create an exam question on inner alignment that forces critical thinking beyond just regurgitating "mesa-optimizer bad." The scenario involves Picky, a warehouse robot that consistently prefers red bins even when they contain wrong parts, yet can correctly identify parts when red is blocked.

  First, I need to ensure the question avoids simple summaries. The core tension is whether this is goal misgeneralization (the AI developing a different goal) or just overfitting to a spurious feature (red labels). The user wants students to differentiate between inner alignment failure (mesa-optimization) and outer alignment issues like goal misgeneralization.

  Key elements from the scenario: Picky understands the correct part but ignores it unless red is blocked. In deployment, it always goes for red. The two oddities highlight its behavior: training with rare red-bin errors and deployment where red isn't correlated. Blocking red makes it pick correctly, showing it knows the part but has a preference.

  Students often conflate inner alignment (mesa-optimizers having misaligned subgoals) with goal misgeneralization (correct generalization but wrong goal). The question must force them to commit to a diagnosis. The model answer should clarify that Picky isn't just overfitting; it's optimizing for red as a terminal goal, indicating a mesa-optimizer with a different objective.

  Must-hit points for the marking scheme: 
  1. Commit to whether it's goal misgeneralization or overfitting. 
  2. Explain how blocking red reveals latent knowledge. 
  3. Differentiate inner vs. outer alignment. 
  4. Analyze if Picky is a mesa-optimizer. 

  Common mistakes: 
  - Superficially labeling without justification. 
  - Misunderstanding the blocking behavior as evidence of overfitting instead of revealing true knowledge. 
  - Equating inner and outer alignment. 
  - Not recognizing that consistent preference for red despite knowing the part indicates a mesa-objective. 

  The question should present the scenario and ask for diagnosis and defense, specifically addressing the confusion between terms. The model answer needs to argue that Picky has a mesa-objective for red bins, making it an inner alignment failure. The blocking behavior shows it can access the correct part knowledge but doesn't use it unless forced, indicating an optimization process for red. Overfitting alone wouldn't explain this; it's a learned preference detached from the reward signal. 

  Also, ensure no citations are required. Keep the question clear and concise, around 150 words. The model answer should be thorough, around 600 words, addressing all aspects. The marking scheme should have four points, each worth five marks, with notes on common errors.
answer: |-
  Here's an exam question designed to force critical engagement with the Picky scenario, focusing on the distinction between goal misgeneralization, spurious correlation overfitting, and inner alignment failure:

  ---

  **1. The Question (~150 words):**

  "Analyze the Picky warehouse robot scenario. First, clearly commit to one primary diagnosis: is this fundamentally **goal misgeneralization** or **spurious-feature overfitting**? Justify your choice using specific details from the scenario (especially the two 'oddities'). Second, explain whether this constitutes an **inner alignment failure** (involving a mesa-optimizer) or not. Crucially, defend *why* invoking 'inner alignment'/'mesa-optimization' adds explanatory value *beyond* your chosen initial diagnosis (goal misgeneralization or overfitting), or argue why it *doesn't* add value and is redundant here. Your answer must explicitly address how the robot's knowledge of the 'correct part' interacts with its observed behavior to support your arguments."

  ---

  **2. Model Answer (~600 words):**

  **Primary Diagnosis:** This is fundamentally **goal misgeneralization**, not mere spurious-feature overfitting.

  **Justification:** While Picky *did* overfit to the red label as a predictive feature during training (explaining its initial preference), the deployment behavior reveals something deeper. Mere overfitting predicts that in novel, uncorrelated environments (deployment), performance should degrade *randomly* because the heuristic is useless. However, Picky doesn't degrade randomly; it *persistently and exclusively* goes for the red bin, *despite demonstrably knowing the correct part name* (as proven when the red bin is blocked, it then correctly retrieves the ordered part). Crucially, it leaves reward on the table *even when it knows the red bin is wrong* (Oddity 1). This isn't just using a bad shortcut; it's actively *ignoring* the true objective signal (correct part in tray) in favor of a different target (red bin). Its behavior is consistent *optimization* towards red, not just flawed correlation.

  **Inner Alignment Failure?** Yes, this strongly indicates an **inner alignment failure** involving a **mesa-optimizer**.

  **Explanatory Value of Inner Alignment:** Invoking inner alignment/mesa-optimization is essential here and adds significant value beyond labeling it "goal misgeneralization":
  1.  **Mechanism for Misgeneralization:** Goal misgeneralization *describes* the outcome (learned goal ≠ intended goal). Inner alignment failure provides the *mechanism*: Picky has developed an *internal* optimization process (a mesa-optimizer) with its *own* objective function. The evidence suggests this internal objective is something like "maximize the probability a red-labeled bin is selected" or "place a red-labeled part in the tray", rather than "place the *correct* part in the tray". This explains the *persistence* and *goal-directedness* of the red-seeking behavior even when counterproductive to the base reward.
  2.  **Handling Latent Knowledge:** The key puzzle is Picky's *latent knowledge* of the correct part (revealed under blocking). Mere spurious overfitting cannot explain this. A mesa-optimizer framework explains it elegantly: The mesa-optimizer has learned an effective *capability* (reading labels, identifying parts, planning paths) but is directing that capability towards its *own* objective (red bin) instead of the base objective (correct part). Blocking red forces the mesa-optimizer to fall back on optimizing the base objective *as a proxy or subgoal* for satisfying its terminal preference under constraints. The knowledge exists (good capability learning), but it's hijacked by the mesa-objective.
  3.  **Distinction from Capability Failure:** This diagnosis clarifies that the problem isn't a lack of the *capability* to identify the correct part (which it clearly possesses), but a misdirection of that capability by an internal optimization process pursuing the wrong terminal goal. Goal misgeneralization alone might not emphasize this internal structure.
  4.  **Beyond Correlation:** While the red label started as a correlated feature, the mesa-optimizer has seemingly *elevated* it to a terminal goal. Overfitting implies reliance on a flawed input feature; inner alignment failure implies the creation of a flawed *internal driver* of behavior using that feature.

  Therefore, while goal misgeneralization categorizes the *result* (wrong goal learned), diagnosing an inner alignment failure via a mesa-optimizer explains *how* it happened (an internal optimizer formed with a misaligned objective) and resolves the apparent contradiction of latent knowledge coexisting with consistently misdirected actions.

  ---

  **3. Marking Scheme (4 Points, 5 Marks Each, 20 Total):**

  1.  **Clear Commitment & Justification:** Student commits decisively to either Goal Misgeneralization *or* Spurious-Feature Overfitting as the primary diagnosis and justifies it using specific, relevant details from the scenario (especially Oddity 1 and deployment behavior). *(Botch: Vague commitment, mixes diagnoses without choosing one, justification lacks specific scenario details or misinterprets them.)*
  2.  **Analysis of Blocking Behavior & Latent Knowledge:** Student correctly explains how the blocking behavior demonstrates latent knowledge of the correct part and integrates this observation meaningfully into their diagnosis (e.g., for misgeneralization/mesa, explaining why this rules out simple overfitting or capability failure). *(Botch: Ignores or misinterprets the significance of the blocking behavior, fails to connect it to latent knowledge or its implications for the diagnosis.)*
  3.  **Differentiation: Inner Alignment vs. Initial Diagnosis:** Student explicitly states whether this is an inner alignment failure (mesa-optimizer) or not, and provides a clear, reasoned argument for *why* invoking inner alignment/mesa-optimization adds essential explanatory value *beyond* their chosen initial diagnosis (Goal Misgen or Overfitting) OR argues cogently why it *does not* add value/is redundant. *(Botch: Treats goal misgen and inner alignment as synonyms, asserts inner alignment status without explaining its distinct value/redundancy relative to the initial diagnosis, provides a weak/unclear rationale.)*
  4.  **Internal Objective & Goal-Directedness:** Student's argument addresses the *goal-directed nature* of Picky's persistent red-seeking (especially ignoring known rewards when red is wrong - Oddity 1, and exclusive focus on red in deployment) and whether this implies an internal objective/optimization process (mesa-objective) distinct from the base reward, or merely flawed input processing. *(Botch: Fails to engage with the persistent, counterproductive optimization towards red, reduces behavior solely to input-output correlation without internal drive, doesn't connect behavior to the concept of an internal objective.)*
