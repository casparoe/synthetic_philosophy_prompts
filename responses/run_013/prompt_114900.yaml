     - Content: you can always tell what you are thinking (e.g., the content of your belief).
     - Epistemic standing: you can always tell how well placed you are (e.g., whether you know or just believe).
  7. **Restriction to Occurrent/Attended States**: Is the privilege only for states that are currently conscious or attended to?
