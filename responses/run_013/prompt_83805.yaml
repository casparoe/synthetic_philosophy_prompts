prompt: |-
  I've been going back and forth with my brother about religion in politics, and I keep landing on verdicts that won't line up with each other. What I want from you is the principle I'm actually using — or the closest small family of principles — plus an honest account of which of my verdicts it forces me to drop. No citations, no reading list, just the principle and what it costs.

  Here's what I think, case by case.

  An abolitionist legislator in the 1850s stands up and says slavery is an offense against God and that no human law can make it right. I think thats the best thing anybody said in that chamber, and I don't think it would have been better if he'd left God out of it.

  A different legislator in the same chamber says the state should outlaw divorce, because marriage is a sacrament. Out of bounds, I think, even though he's just as sincere.

  A Baptist minister organizes for a higher minimum wage and says the reason is that every worker is made in God's image. Fine. The theology is doing real work there and I still think it's fine.

  A city council member votes against a zoning permit for a mosque because her pastor says Islam is a false religion. Not fine.

  A Sikh man wants to carry his kirpan into the courthouse. Fine, give him the exemption.

  A baker won't make a cake for a gay wedding because of his faith. Not fine.

  A bishop campaigns against the death penalty on the church's teaching about the sanctity of life. Fine. The same bishop, same kind of argument, campaigns against gay marriage. Not fine. I know that pair is supposed to embarass me.

  And one I genuinely can't sort out: a small Muslim community argues the city should let the call to prayer go out over a loudspeaker, on religious grounds. A big church argues the city should put a nativity scene on the courthouse lawn, also on religious grounds. I feel fine about the first and slightly annoyed by the second, and I don't think "the first group is a minority" is a principle, it's just me rooting for the underdog.

  The principle I keep reaching for is this: what matters isn't that the reason is religious, it's whether it's load-bearing. Strip the theology out and see what's still standing. If there's something left — cruelty is cruelty, a person is a person — then fine, argue away. If all that's left when you take the collar off is "my church says so," then it can't be the reason a law gets passed. But I can already feel that this doesn't sort the bishop cases cleanly, and maybe not the mosque/nativity pair either.

  So: what's the principle, and which verdicts does it make me give up? Also, what does it say about a case I haven't put to myself yet — a legislator whose position is also supported by perfectly good secular reasons, but who'd hold the position anyway even if every one of those secular reasons were refuted, because her faith is what's really doing the work. Is that fine, or is that the thing I've been objecting to this whole time without saying so? And if two candidate principles both survive the cases I've listed, give me one more case that would pull them apart.
reasoning: |-
  Okay, let me tackle this user's dilemma. They're struggling with a consistent principle for when religious arguments in politics are acceptable. Their case examples show conflicting intuitions: supporting abolitionists citing God but opposing divorce laws based on sacraments, accepting religious minimum wage advocacy but rejecting mosque zoning discrimination. 

  The user's proposed "load-bearing" principle—whether secular reasons remain after removing theology—is insightful but hits snags with the bishop cases (both anti-death penalty and anti-gay marriage use similar "sanctity of life" rhetoric) and the call-to-prayer/nativity discomfort. 

  Hmm. The deeper tension seems to be about coercion versus pluralism. Cases where religious arguments expand freedoms (kirpan exemption, call-to-prayer) feel valid even if exclusively religious, while those imposing sectarian practices (nativity scene) or restricting others' rights (anti-gay cake) don't—regardless of secular rationales. The abolitionist works because "offense against God" is framing for human dignity, while "marriage is sacrament" makes theology the rule itself. 

  Ah! The missing key might be whether the policy outcome binds others to the believer's doctrine. For the "legislator holding faith as true reason" hypothetical: if the policy stands on secular grounds, their personal motivation is irrelevant—unless it becomes state endorsement of doctrine. 

  The test case that splits principles: a law banning alcohol for public health reasons, backed by science, but motivated solely by religious temperance beliefs. The "load-bearing" principle accepts it (secular reasons exist), but the "no coercion" principle might reject it as disguised doctrine. The user's intuition would likely hinge on enforceability scope—does it feel like imposing values? 

  This reframes their bakery verdict too: refusing service isn't about the baker's belief but imposing it on customers via market exclusion. Whereas the Sikh's kirpan doesn't force others to participate. 

  Costs to admit: the anti-gay marriage bishop must be rejected not because arguments lack secular veneer (they often claim it), but because it enforces theological sexuality norms. Conversely, the nativity scene annoyance is legitimate—it's state resources promoting one tradition, unlike the mosque's broadcast which (if volume-regulated) is free exercise without endorsement. 

  The unresolved legislator case? Fine, provided the policy justification remains secular. Personal conviction only becomes problematic if it bleeds into law's wording or implementation as religious doctrine. 

  Final principle: Religious arguments in politics are legitimate when either (1) they appeal to shareable reasons accessible to all citizens, or (2) they seek exemption from universal rules to practice faith without harming others. They cross the line when demanding state enforcement of sectarian doctrines or using state power to favor/disfavor specific faiths. 

  This means accepting: 
  - The anti-gay marriage bishop must be rejected even if using "sanctity" language (it's coercion) 
  - The nativity scene is invalid unless part of multi-faith display (state endorsement) 
  - The baker's refusal isn't protected (economic participation imposes doctrine) 

  ...but keeping all other verdicts intact, including the abolitionist and call-to-prayer.
answer: |-
  The principle you're groping toward is **Neutral Justification**: Laws must be justifiable by reasons accessible to all citizens, regardless of religious belief. Religious motives are acceptable only when they align with—or can be translated into—secular public reasons (e.g., human dignity, equality, harm prevention). When theology *is* the sole justification, it becomes sectarian coercion.  

  ### How it sorts your cases:  
  1. **Abolitionist**: Fine. "Offense against God" frames a shareable truth: *slavery is cruelty*. Secular core remains.  
  2. **Divorce ban**: Out of bounds. "Marriage is a sacrament" has no secular counterpart accessible to non-believers. Sectarian.  
  3. **Minimum wage**: Fine. "Made in God’s image" → *human dignity*. Secularly translatable.  
  4. **Mosque zoning**: Not fine. Rejection based purely on "false religion" → religious discrimination. No public reason.  
  5. **Kirpan exemption**: Fine. Burden on religious practice is minimal; state interest (security) balanced via exemption. Neutral.  
  6. **Baker refusal**: Not fine. Denying service imposes religious views on others using economic coercion. No public harm proven.  
  7. **Bishop vs. death penalty**: Fine. "Sanctity of life" → secular arguments against state execution (fallibility, irreversibility).  
  8. **Bishop vs. gay marriage**: Not fine. "Sanctity" here rests *only* on theological definitions of marriage. No accessible public reason.  
  9. **Call to prayer**: Fine (with volume limits). Free exercise claim; neutral time/place rules apply equally to all faiths.  
  10. **Nativity scene**: Not fine. State property endorsing one religion → coercive symbolism. Unless part of inclusive display.  

  ### Costs of this principle:  
  - You must **drop your verdict on the anti-gay marriage bishop**. His argument fails for the same reason as the divorce ban: no shareable justification beyond doctrine. "My church says so" is the load-bearing wall.  
  - **Nativity annoyance is justified**: State-sponsored religious symbols inherently favor one tradition, violating neutrality. The "minority" instinct isn’t arbitrary—it flags power imbalance, but the core issue is state endorsement.  

  ### Your unresolved legislator:  
  - **Her position is fine** if the law stands on secular grounds. Personal motivation is irrelevant if public justification exists. *But*: if she frames the law in religious terms ("God commands this"), it becomes coercive. Neutrality requires *public language*.  

  ### Test case splitting principles:  
  **Circumcision ban**: A law banning infant male circumcision for secular health reasons (pain/consent).  
  - **Neutral Justification**: Acceptable if medical evidence supports it.  
  - **Your "load-bearing" principle**: Might reject it if proponents admit they’d drop the secular reasons if their religion didn’t forbid circumcision.  
  - *This exposes the flaw in focusing on personal motivation over public reason.*  

  **Principle refined**:  
  > Religious arguments in politics are legitimate when they appeal to **reasons all citizens can engage with** (justice, welfare, rights). They become illegitimate when they demand **obedience to revelation or doctrine**, turning the state into a tool of sectarian authority.  

  You keep the abolitionist, minimum wage, kirpan, and call to prayer. You sacrifice the anti-gay marriage bishop and nativity scene—not because you're inconsistent, but because neutrality forbids using the state to enforce theological truths.
