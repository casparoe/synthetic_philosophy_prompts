prompt: |-
  You are a philosopher who works on the ethics of social conventions: on when a local custom generates a genuine obligation, and on what outsiders owe to practices they were not raised in. Please think the problem through carefully before committing to anything; you may sketch the competing positions for yourself first, but the answer itself should be clean prose.

  Two colleagues of mine, Ines and Tomas, fell into an argument after a departmental dinner. A visiting researcher from a country where tipping is simply not done paid his share of the bill to the penny and left nothing on top. He is here for the term, not just the week. I was at the table and said nothing; they carried it on in the street afterwards, and I have set out the exchange below as faithfully as I can.

  Ines: he did nothing wrong. Tipping is a custom, not a requirement, and nobody is obliged to observe a custom he was not raised in. It is unfair to hold a guest to an unspoken rate he had no way of knowing.

  Tomas: that is too quick. In this city the tip is not decoration — the wage is set on the assumption that tips make up the difference. A diner who leaves nothing is not merely breaching etiquette; he is taking the meal at a price the local arrangement does not charge, and a particular person ends the evening worse off. The tip is part of the price, just collected separately. And he did know: the card reader offered him a percentage.

  Ines: if there is a wrong here it belongs to the employer, not the diner. Making the worker's income depend on each customer's goodwill in turn is precisely what keeps an exploitative arrangement alive. And you cannot demand that a visitor pay to sustain a practice he may reasonably think unjust; that is asking him to be complicit in it.

  Tomas: that proves too much. By your reasoning the visitor could ignore any local practice he happened to dislike — the queue at the till, the rule about waiting for the light. And note where the cost of his scruple lands: on the server, who designed nothing and can change nothing. If it is a protest, let it be a legible one. An unannounced shortfall at the table is indistinguishable from meanness, and it is read as meanness by the very person it hurts.

  Ines: the queue and the crossing light are not the same case as the tip, and your own examples supply the distinction. Waiting your turn matters because someone is behind you; crossing against the light harms nobody and merely offends the locals; and the server is out of pocket only because her employer chose to make her wage depend on my decision. As for knowing — knowing the amount the machine suggested is not knowing that the amount is owed. And requiring the visitor to announce his politics to a stranger over a card reader merely relocates the burden you say you are worried about.

  Please adjudicate this move by move. For each of the five moves, say whether it is sound, mistaken, or right about something but for the wrong reason, and justify the rating briefly. Then say what both of them are missing, and give an overall verdict on whether the visitor was obliged to tip — and whether that verdict would change if he were a tourist passing through rather than a guest for the term. Keep the whole answer to 700 words at most. Tell me how confident you are in each verdict, and single out the one point you are least sure about. Write in British English.
reasoning: |-
  Okay, let me approach this philosophical quandary methodically. The user presents a layered ethical dispute about tipping customs and outsider obligations, framed through five dialectical moves between Ines and Tomas. They're clearly seeking rigorous analysis that respects the complexity while delivering practical judgment. 

  First, I need to map the core tensions: Tomas grounds obligation in the worker's material dependency on tips within a local economic structure, while Ines challenges both the fairness of imposing unconsented norms and the moral burden placed on diners to prop up potentially exploitative systems. Both have merit but feel incomplete. 

  For the move-by-move assessment:
  - Ines' first move feels sound in distinguishing custom from obligation but underestimates how deeply tips are embedded in wage structures here. 
  - Tomas' counter rightly highlights the material harm but oversimplifies by equating social conventions with economic necessities. 
  - Ines' shift to employer responsibility is perceptive about systemic injustice, yet her dismissal of complicity worries me - shouldn't we consider how our actions sustain harmful systems? 
  - Tomas' "proves too much" argument falters by false equivalence; queue-jumping causes direct harm unlike tipping dissent. 
  - Ines' final distinction between material/symbolic conventions is strong, but her dismissal of communicative value feels shortsighted - shouldn't ethics consider how our actions are perceived by those affected?

  The missing pieces strike me: neither adequately addresses how prolonged exposure might increase obligation (hence my tourist/resident distinction), nor the middle path where one tips while challenging the system. My confidence wavers most on whether the visitor's silent omission constitutes complicity - it's philosophically thorny. 

  For the verdict: structural injustice doesn't absolve individual responsibility when real people bear the cost, so the term-long visitor should tip. But this obligation diminishes for tourists unfamiliar with local nuances. Ultimately, ethics here demands both compliance with embedded practices and solidarity with workers against exploitative systems.
answer: |-
  ## Adjudication of the Exchange & Verdict

  **Move 1: Ines (Tipping = Custom, Not Obligation)**
  *   **Verdict:** **Mistaken.**
  *   **Justification:** While Ines is correct that mere custom doesn't *automatically* generate moral obligation for outsiders, she wrongly dismisses the *material consequence* of ignoring *this specific custom*. Tipping here functions as a de facto wage component, not just etiquette. Ignorance of the *exact rate* is plausible, but ignorance of the *practice's existence and purpose* after seeing the card reader prompts is less defensible for a term-long visitor. Her argument relies too heavily on upbringing, neglecting the duty to learn essential local norms affecting others' livelihoods upon extended residence.
  *   **Confidence:** High (8/10).

  **Move 2: Tomas (Tip = Part of Price, Harm to Server)**
  *   **Verdict:** **Sound.**
  *   **Justification:** Tomas correctly identifies the core issue: the economic structure makes the tip a *functional part of the server's compensation*, not a gratuity. Withholding it directly causes financial harm to a specific, vulnerable individual who relies on it. His point about the card reader offering percentages demonstrates the visitor had clear notice of the expected practice, even if not its obligatory nature. He grounds the obligation in preventing direct harm within an established local economic arrangement.
  *   **Confidence:** High (9/10).

  **Move 3: Ines (Blame Employer, Complicity in Injustice)**
  *   **Verdict:** **Right about something, but for the wrong reason.**
  *   **Justification:** Ines is *correct* that the employer bears primary responsibility for creating an exploitative system and that one shouldn't be forced into complicity with injustice. *However*, she is *mistaken* in implying this absolves the diner of *all* responsibility for the *immediate consequence* of their action *within that system*. Refusing to tip *doesn't* challenge the system; it simply shifts the cost of the visitor's meal onto the server. Her argument conflates systemic critique with individual impact.
  *   **Confidence:** Medium-High (7/10).

  **Move 4: Tomas (Slippery Slope, Harm Location, Need for Legibility)**
  *   **Verdict:** **Mostly Mistaken.**
  *   **Justification:** Tomas's slippery slope argument ("ignore any local practice") is weak; not all conventions are equally morally weighty or cause equivalent harm (queuing *does* directly inconvenience others; jaywalking *might* cause harm). He's *right* that the cost lands unfairly on the server. His strongest point is about "legibility": an unannounced refusal is indistinguishable from stinginess and fails as protest, harming the worker without challenging the structure. However, demanding public justification over the card reader *is* an undue burden.
  *   **Confidence:** Medium (6/10) – Strong on harm location/legibility, weak on false equivalence.

  **Move 5: Ines (Distinguishing Conventions, Employer Choice, Burden Relocation)**
  *   **Verdict:** **Sound.**
  *   **Justification:** Ines effectively rebuts Tomas's false equivalence: queuing/jaywalking involve direct harm/public order, while the tip's harm stems *only* from the employer's chosen pay structure. She correctly notes that seeing a suggested tip doesn't equate to knowing it's *owed*. She is also right that forcing a public political declaration merely relocates the burden and isn't a fair solution. This move successfully defends her core distinction and highlights the systemic source of the problem.
  *   **Confidence:** High (8/10).

  **What Both Are Missing:**
  1.  **The Spectrum of Integration:** Neither fully grapples with how *duration and purpose of stay* affect the duty to assimilate local economic norms. A tourist is less integrated than a resident researcher.
  2.  **The "Clean Hands" Dilemma:** They overlook the possibility of complying with the *current* system (tipping) while actively *advocating* for its reform (fair wages), avoiding immediate harm *and* complicity in perpetuation.
  3.  **Agency within Constraint:** While the server is constrained, Ines underplays the visitor's agency within the existing framework to avoid direct harm. Tomas underplays the visitor's potential moral objection to the system itself.

  **Overall Verdicts:**

  *   **Was the visitor (term-long guest) obliged to tip? Yes.**
      *   **Reasoning:** As a term-long resident, the visitor had sufficient exposure and notice (card reader) to understand the tipping norm's function as a *de facto wage component* within the local economic arrangement. Withholding the tip caused direct, foreseeable financial harm to the specific server who served him. While the *system* is the employer's responsibility and potentially unjust, the individual diner's participation in that system at the point of service creates a derivative obligation to prevent immediate, targeted harm to the worker. His prolonged stay implies a duty to learn and respect essential local economic practices affecting vulnerable individuals.
      *   **Confidence:** High (8/10).
  *   **Would the verdict change for a tourist? Likely, towards No Obligation (or significantly reduced).**
      *   **Reasoning:** A brief tourist lacks the same level of integration and opportunity/responsibility to understand the nuances of local labour economics. While the harm to the server remains, the tourist's fleeting presence and likely genuine ignorance weaken the claim of obligation. The expectation shifts towards the employer/establishment to absorb occasional non-compliance from transient visitors. The core injustice of the system weighs heavier against imposing the obligation.
      *   **Confidence:** Medium (7/10) – The harm argument still nags, but the integration/duty-to-learn argument weakens considerably.

  **Point of Least Certainty:** The exact point at which duration of stay transforms a visitor's obligation from negligible to significant (e.g., one week vs. one term). This hinges heavily on context and reasonable expectations of cultural acclimatisation. (Confidence on this specific boundary: 5/10).
