prompt: |-
  I've been reading rationalist blogs and forums for years, and I keep returning to futarchy and decision markets. Take the concrete procedure rather than the slogan: an organization picks a single scalar metric of welfare, fixes a time horizon, and for each proposed policy runs a conditional prediction market that pays out according to the metric's value under the policy versus under the status quo. If the market's conditional price says the policy will raise the metric, the policy is adopted; otherwise it is rejected. The values are supposed to be settled by a vote on the metric, and the facts by the market's bets.

  What philosophical commitments does that procedure presuppose? I want the implicit theory reconstructed, not a reading list. What theory of value does it require—welfarism, consequentialism, a commitment to commensurability? What theory of legitimacy does it assume—that a policy is legitimate because a market predicts it will maximize a metric, rather than because it was deliberated or consented to? What theory of rationality and evidence does it assume about traders—that they are risk-neutral expected-utility maximizers, that prices are efficient, that conditional markets can estimate causal counterfactuals? Which rival views does it quietly rule out: value pluralism, deliberative democracy, deontological constraints, prioritarianism, the idea that some values are incommensurable? Where is the procedure underdetermined, so that several theories would license it? And where are its parts in tension—for instance, does the separation between voting on values and betting on facts survive the fact that the choice of metric is itself a value-laden and strategically contestable decision, or that the market's conditional price is not a pure counterfactual estimate because the policy's adoption depends on that very price? I am especially interested in whether the practice presupposes risk-neutrality on the part of traders—since otherwise the market price is not a probability but a risk-adjusted price—and whether that is a substantive philosophical commitment or a merely convenient modeling assumption. I am not asking whether futarchy would work empirically; I am asking what it would have to believe. Finally, if we replaced the presupposed view with a rival—say, a pluralist, deliberative, or deontological one—what would have to change in the institution's design? Answer in under 800 words.
reasoning: |-
  Okay, let me unpack this user's deep dive into futarchy's philosophical foundations. They're clearly well-versed in rationalist discourse - citing prediction markets and scalar metrics suggests familiarity with Robin Hanson's original proposal. But their angle is purely theoretical, demanding implicit commitments rather than empirical debates. 

  Hmm, breaking down their layered questions: First, they want the value theory exposed - that's welfarism and consequentialism laid bare. Then legitimacy theory - how can market predictions justify power? Epistemology too - what trader rationality assumptions hide in the machinery? And crucially, which rival philosophies get excluded by design. 

  The risk-neutrality point feels especially sharp. They're right that without it, prices aren't pure probabilities - but is that a fatal flaw or tractable detail? And that meta-question about "merely convenient modeling assumption" versus "substantive commitment" cuts to futarchy's core viability. 

  Noticing they emphasize underdetermination and tensions too. The metric-voting paradox jumps out: claiming to separate facts/values while making metric selection itself value-laden. And the reflexivity trap - where the market's prediction affects adoption, distorting the counterfactual. These aren't implementation bugs but conceptual fractures. 

  For alternatives... if we swapped in value pluralism, the whole scalar metric collapses. Deliberative democracy would demand open forums over markets. Deontology might require veto rights on rights-violating policies regardless of predicted outcomes. Each substitution breaks different load-bearing walls in the design. 

  Their closing "what would have to change" is the litmus test. Answering requires showing how deeply entangled futarchy is with its philosophical premises - that you can't just graft on rival theories without structural redesign. That'll make the implicit explicit.
answer: |-
  Futarchy's procedural design embeds a specific constellation of philosophical commitments, revealing both its strengths and limitations as a governance model. Here’s the reconstructed theory:

  **1. Value Theory:**  
     - **Welfarist Consequentialism:** It presupposes *all value* can be reduced to a single, cardinal, interpersonally comparable welfare metric (W). This is **strong welfarism** (only welfare matters) and **consequentialism** (only outcomes matter).  
     - **Commensurability & Maximization:** Values *must* be commensurable on a single scale to allow trade-offs. The goal is strictly *maximizing* W, rejecting value pluralism, deontological constraints (e.g., "never violate rights, even if W increases"), and non-aggregative views (e.g., prioritarianism, sufficientarianism).  

  **2. Legitimacy Theory:**  
     - **Epistocratic Instrumentalism:** Legitimacy derives *solely* from the procedure’s predicted effectiveness at maximizing W. Deliberation, consent, participation, or rights-based justification are irrelevant. The "vote on W" is a bare-minimum concession to democracy but lacks deliberative input or checks on metric design. Power rests with market participants ("epistocrats") whose bets determine policy.  

  **3. Epistemology & Rationality:**  
     - **Markets as Perfect Bayesian Aggregators:** Traders must approximate **rational expectations** (unbiased beliefs), **risk-neutrality**, and **expected utility maximization**. Without risk-neutrality, prices reflect risk premia, not pure probabilities—corrupting the counterfactual estimate. This is a *substantive commitment*, not mere modeling convenience.  
     - **Causal Isolation:** Markets must estimate *causal effects* (policy → ΔW) from noisy data. This assumes traders understand causal relationships, markets efficiently incorporate all information, and "conditioning" on policy adoption is tractable.  
     - **Fact/Value Separation:** Assumes W can be cleanly defined via voting, while facts are "objective" and separable. This ignores that metric *design* (e.g., "Does W include equality?") is value-laden and strategically manipulable.  

  **4. Rival Views Excluded:**  
     - **Value Pluralism:** Incommensurable values (e.g., liberty vs. security) cannot coexist in a scalar metric.  
     - **Deontology:** Rights or constraints are inadmissible if tradable against W gains.  
     - **Deliberative Democracy:** Legitimacy through reasoned discourse is replaced by algorithmic aggregation.  
     - **Non-Consequentialist Virtues:** Integrity, fairness-as-process, or duty have no standing.  

  **5. Critical Tensions & Underdetermination:**  
     - **The Metric Problem:** Voting on W assumes a pre-commensurated "value space." But defining W requires contentious trade-offs (e.g., weighting future generations) *before* voting. This smuggles values back into the "factual" realm.  
     - **Reflexivity:** The market price determines policy adoption, creating self-fulfilling/self-defeating prophecies (e.g., a policy predicted to succeed may only do so *if* adopted, distorting the counterfactual).  
     - **Underdetermination:** *Why* maximize W? The procedure is agnostic between utilitarianism, preference satisfaction, or other monist welfarisms—but all must accept cardinality and maximization.  

  **Design Implications for Rival Theories:**  
  Replacing the presupposed view would necessitate radical changes:  
  - **Value Pluralism/Deliberative Democracy:** Require multi-dimensional outcome metrics + deliberative assemblies to set weights or veto rights-violating policies. Markets could inform but not decide.  
  - **Deontology:** Introduce constitutional constraints (e.g., "no policy violating basic rights, regardless of W prediction") or ex-post judicial review.  
  - **Prioritarianism:** Redefine W to prioritize disadvantaged groups, but this conflicts with futarchy’s simple maximization.  
  - **Risk-Aversion:** If traders are risk-averse, shift to subsidized prediction markets for probabilities (not prices) or use trading algorithms enforcing risk-neutral bids.  

  **In essence, futarchy is a technocratic-utilitarian engine**—it assumes values are unitary and quantifiable, facts are separable and market-predictable, and legitimacy flows from correct outcomes. Its elegance relies on philosophically contestable premises about value, rationality, and power.
