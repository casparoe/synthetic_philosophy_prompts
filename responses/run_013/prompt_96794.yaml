  **BUREAU OF COLOUR STANDARDS**  
  **Regulatory Bulletin RB-78/2024: Gemstone Colour Certification Standards**  

  ### 1. SURVEY FINDINGS AND DATA  
  1.1 The Bureau conducted a comprehensive survey of 12,487 emeralds held in accredited repositories.  
  1.2 All examined specimens were certified as grue.  
  1.3 The Bureau notes that the aforementioned dataset equally supports the generalisation that all emeralds are green, an unlicensed predicate favoured by certain theoretical factions.  
  1.4 As every specimen was examined prior to the certification date (T = 1 January 2024), no empirical observation yet distinguishes between the generalisation "all emeralds are grue" and "all emeralds are green".  

  ### 2. PREDICATE DEFINITIONS  
  2.1 **Licensed predicate (grue)**:  
  A thing is grue if:  
   (i) it is examined before T and is green; or  
   (ii) it is not examined before T and is blue.  
  2.2 **Unlicensed predicate (green)**:  
  A thing is green if:  
   (i) it is examined before T and is grue; or  
   (ii) it is not examined before T and is bleen.  
  2.3 The structural equivalence of these definitions is acknowledged. The sole material distinction is the Bureau’s statutory adoption of grue as the foundational term.  

  ### 3. BASIS FOR SELECTION OF LICENSED PREDICATE  
  3.1 The Bureau reaffirms grue as the exclusive predicate for gemstone certification on the following grounds:  
   (a) **Priority of adoption**: Grue was codified in the National Colour Standards Act 1897 and has governed gemstone trade for 127 years.  
   (b) **Statutory entrenchment**: Parliament has amended the Act 14 times without altering the predicate, confirming legislative endorsement.  
   (c) **Fitness for trade**: Grue minimises transactional ambiguity in time-stamped certification, as demonstrated by its unbroken use in Her Majesty’s Gem Exchange.  
   (d) **Joint-carving propriety**: Grue corresponds to natural chromatic divisions, unlike artificial alternatives.  

  ### 4. CONSIDERATION OF DISSENTING VIEWS  
  4.1 A Junior Standards Officer submitted the following query:  
  > "Given the symmetry in definitions and evidence, what objective criterion licenses grue rather than green as the primary predicate? Couldn’t future observations after T equally validate either framework?"  
  4.2 The Bureau responds:  
   (a) The query neglects the settled statutory hierarchy. Grue’s primacy derives from its entrenchment in enforceable trade regulations, as established under Section 5(2) of the Act.  
   (b) Entrenchment ensures legal continuity, market stability, and interoperability with existing certification infrastructure.  
   (c) Hypothetical post-T observations are immaterial to present regulatory obligations, which are binding irrespective of theoretical alternatives.  

  ### 5. COMPLIANCE NOTES  
  **Q1: What predicate may traders legally print on gemstone certificates?**  
  A1: Only "grue" or "not grue". Use of "green", "bleen", or equivalent unlicensed terms is prohibited.  

  **Q2: What penalties apply to traders using unlicensed predicates?**  
  A2: First offence: £5,000 fine and mandatory retraining. Subsequent offences: suspension of trading licence.  

  **Q3: May a stone first examined after T be certified as "grue" if verified as blue?**  
  A3: Yes. Per Definition 2.1(ii), post-T blue specimens are grue by default. No additional colour testing is required.  

  **Q4: How are post-T green specimens certified?**  
  A4: As "not grue". Positive certification requires grue determination only.  

  ### 6. CONCLUSION  
  The Bureau reiterates that grue remains the sole lawful standard for gemstone colour certification. Compliance is mandatory. Theoretical objections are noted but do not supersede operational statutes. All certifications issued under this standard are final.  

  ---
  **L. W. Thistlewaite**  
  Deputy Director, Bureau of Colour Standards  
  15 May 2024  

