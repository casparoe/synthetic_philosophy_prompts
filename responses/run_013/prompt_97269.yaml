  The core pedagogical goals are experiential: students should feel the constraints of one-day assemblies, understand the cost of reversing decisions, see how amnesty agreements distort justice, and recognize how procedural flaws shaped real historical outcomes like Mytilene, Sicily, and Socrates' trial.

  The user specifies three phases: a punitive decree (Mytilene), an expedition vote (Sicily), and a scapegoating trial (Socrates). Key mechanics include agenda control, public vs secret voting, reversal penalties, momentum biases, and amnesty constraints. The debrief must connect each mechanic to historical cases and modern parallels.

  For the Mytilene phase, I'll need rules where only one motion is on the floor (death/slavery), with limited amendment options. The twist comes when "news arrives" that the fleet has sailed, forcing a reconsideration vote with public shaming for changers and prosecution risk for the mover. Comparing public vs secret ballots will reveal conformity pressures.

  For the Sicily phase, I'll design momentum mechanics: undecided voters drift toward recent speakers, deferral suggestions get penalized as "oligarchic," and private motive cards (glory, fear etc.) create hidden biases. The key is making haste feel inevitable.

  The Socrates phase needs careful handling due to the amnesty constraint. Students must invent charges like impiety while avoiding political accusations, and vote on all "troublemakers" together to experience collective punishment. The presiding officer faces pressure to allow illegal motions.

  I should note predictable issues: over-acting students might trivialize the exercise, secret ballot groups may collude, and groups might stall. Solutions include strict timekeeping, separating ballot groups physically, and seeding "provocateurs" if discussion lags. The debrief must explicitly name the compressed events (Mytilene 427BCE, Sicily 415BCE, Socrates 399BCE) and draw modern parallels to plebiscites or cancel culture.

  What the simulation can't capture: the real scale of assemblies (thousands vs 18 students), genuine stakes (life/death vs tokens), religious sincerity in impiety charges, and the weight of decisions that killed thousands. I'll suggest adding a silent reflection moment before the Socrates trial to acknowledge this gravity. A fourth phase isn't needed—the trilogy shows institutional failure progression clearly.
answer: |-
  Here’s a runnable 100-minute seminar session designed to make students **feel** the institutional pressures behind Athenian failures. It compresses Mytilene (punishment reversal), Sicily (rash expedition), and Socrates (scapegoating under amnesty) into three experiential phases.

  ---

  ### **Materials to Prepare**
  1. **Briefing Sheets** (Handed at the door):  
     *Phase 1:* **"CITY A HAS REBELLED AND BEEN RECAPTURED. The Council proposes: Execute all adult men, enslave the rest. You are the Assembly. Amend or pass this today."**  
     *Phase 2:* **"GENERAL NIKIAS urges caution against invading SICELA. GENERAL ALCIBIADES demands glory. Settle the expedition TODAY."**  
     *Phase 3:* **"SICELA EXPEDITION HAS FAILED. Find someone to blame. The Amnesty of 403 BC forbids charges related to past regimes."**  

  2. **Role Cards** (Private, shuffled):  
     - *Interests (Phase 1):* "You lent money to City A merchants," "Your cousin is a prisoner in City A," "You own land near City A and fear rebellion," "You trade with City A and need stability," "You seek political fame by backing the Council."  
     - *Motives (Phase 2):* "Glory-seeking hoplite," "Tax-fearing merchant," "Bribed by Alcibiades," "Terrified of Spartan spies," "Owed money by Nikias."  
     - *Debts (Phase 3):* "Your father died in Sicily," "Socrates mocked your teacher," "You supported the amnesty to heal the city," "You owe Alcibiades a favor," "You fear being next."  
     Plus: **1 Prosecutor Card (Phase 1), 1 Oligarch Marker (Phase 2), 1 Presiding Officer Card (Phase 3).**  

  3. **Tokens:**  
     - Standing tokens (e.g., colored paper clips) for Phase 1 reversal.  
     - Voting: **Green (Yes)/Red (No)** cards for public votes; folded paper slips for secret ballots.  

  4. **Signs for Facilitator:**  
     - "FLEET HAS SAILED" (Phase 1), "EXPEDITION FAILED" (Phase 3), "OLIGARCH!" stamp/sticker.  

  ---

  ### **Timeline (100 Minutes)**  
  **0:00–0:05**  
  - Hand out **Phase 1 Brief** at the door. No introduction. Chairs in a circle.  

  **PHASE 1: Mytilene Composite (30 mins)**  
  - **0:05–0:10:** Assign 2 opening speakers (1 for/against massacre). *Rules:*  
    - 90-second speeches max.  
    - Motions can only amend *severity* (e.g., "kill only leaders," "spare priests"), not the core punishment.  
    - Votes: **Left half** public (show cards); **Right half** secret (folded slips).  
  - **0:10–0:20:** Open debate. Participants speak, revealing interests *only if they choose*.  
  - **0:20:** Vote. Tally public/secret separately (note discrepancies).  
  - **0:21:** Announce **"THE FLEET HAS ALREADY SAILED TO CARRY OUT YOUR ORDER!"**  
  - **0:22–0:28:** Allow **ONE** motion to reconsider.  
    - *Costs:* Voters changing stance surrender a token and announce it. Mover gets **Prosecutor Card** – another student *must* accuse them of "deceiving the Assembly."  
  - **0:28–0:30:** Second vote on reversal.  

  **PHASE 2: Sicily Expedition (25 mins)**  
  - **0:30:** Distribute **Phase 2 Brief** and motive cards.  
  - *Rules:*  
    - No adjournment. Questions settled today.  
    - Anyone suggesting "defer to generals’ expertise" gets **OLIGARCH!** marker – their speech weight halved (facilitator tallies votes as 0.5).  
    - After each speech, undecided voters (declare openly) shift to the *last speaker’s position* unless they resist (state why).  
  - **0:32–0:45:** Debate. Assign speakers for Nikias (caution) and Alcibiades (glory).  
  - **0:45:** Vote (public).  

  **PHASE 3: Scapegoating Under Amnesty (20 mins)**  
  - **0:50:** Distribute **Phase 3 Brief** and debt cards.  
  - Announce: **"THE EXPEDITION IS DESTROYED. BLAME MUST BE FIXED TODAY."**  
  - *Rules:*  
    - Presiding Officer (assign one student) decides if a motion is legal.  
    - Charges must be **"impiety" or "corrupting youth"** – no past politics.  
    - All accused (name 3: e.g., "Socrates," "Anaxagoras," "Protagoras") are voted on *together* in one yes/no vote.  
  - **0:52–1:00:** Debate. Pressure Presiding Officer to allow charges. Group vote.  

  **DEBRIEF (25 mins)**  
  - **1:00–1:05:** Name the historical cases:  
    > *"Phase 1 was Mytilene (427 BCE) – you felt how hard it was to reverse a vote. Phase 2 was Sicily (415 BCE) – you saw haste enforced. Phase 3 was Socrates (399 BCE) – you experienced blame within legal constraints."*  
  - **1:05–1:15:** Map mechanics to reality:  
    | *Mechanic*          | *Historical Pressure*                          |  
    |---------------------|-----------------------------------------------|  
    | No adjournment      | Assembly met 1x/week; crises demanded speed   |  
    | Reversal cost       | No institutional "undo"; shame in flip-flopping |  
    | Oligarch penalty    | Anti-expertise bias after oligarchic coup (411 BCE) |  
    | Group scapegoat vote | Amnesty barred political charges; collective suspicion |  
  - **1:15–1:20:** Modern parallels:  
    - *"Public votes today: How does social media amplify conformity? Plebiscites without debate (Brexit)? Amnesty turning vengeance into ‘lawfare’?"*  
  - **1:20–1:25:** Final reflection:  
    > *"Was it the machinery (e.g., no reconsideration rule) or the people (e.g., your ‘bribed’ voter) that drove the worst outcome? Could better rules have saved these men?"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Over-acting/loss of substance:**  
     - *Fix:* Intervene: *"Your *character* cares about X, but the *rules* force you to…"* Redirect to mechanics.  

  2. **Secret-ballot group talking:**  
     - *Fix:* Physically separate groups pre-vote. Announce: *"Any collusion nullifies the experiment."*  

  3. **Stalling in Phase 2:**  
     - *Fix:* Use a visible timer. After 3 silent seconds: *"Undecideds, move to the last position."*  

  4. **Presiding Officer refusing illegal motion:**  
     - *Fix:* Let the group pressure them. Ask: *"What happens if the Assembly demands it anyway?"*  

  ---

  ### **What the Activity Can’t Capture & How to Address It**  
  - **Scale:** 18 students ≠ 6,000 Athenians. *Address in debrief:* "Real assemblies were deafening mobs. Your quiet room misses that frenzy."  
  - **Stakes:** Token costs ≠ lives. *Address:* Before Phase 3, say: *"In this game, ‘Socrates’ is a paper slip. In 399 BCE, it was a hemlock cup."*  
  - **Religious texture:** Impiety was visceral. *Address:* Briefly add context pre-Phase 3: *"Gods were as real as taxes. Offending them risked plagues."*  
  - **Moral weight:** *Crucial:* Start the debrief with: *"We simulated choices that killed thousands. Remember this isn’t a game to Athens’ victims."*  

  ---

  ### **Why This Structure Works**  
  The three phases escalate:  
  1. **Reversal cost** (Mytilene) exposes procedural rigidity.  
  2. **Momentum + anti-expertise** (Sicily) forces rash action.  
  3. **Blame within constraints** (Socrates) shows vengeance morphing.  

  Adding a fourth phase would dilute focus. The sequence makes institutional failure cumulative – and lets students *feel* why "better men" might not have mattered if the machine was broken.  

  **Output:** Students leave arguing not just about Athens, but about how *their own* decisions were shaped by rules they didn’t design. That’s the win.
