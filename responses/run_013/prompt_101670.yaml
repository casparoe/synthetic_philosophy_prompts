  For a better analogy: A fruit tree grafted onto existing rootstock. This captures that you need compatibility (rootstock as cultural/institutional foundations), but also that skilled grafting (adaptation by policymakers) can make it work. The minister could argue: "The rootstock exists everywhere - basic human needs for security. We graft carefully, we get fruit." Or a sourdough starter analogy where institutions are the culture that needs regular feeding (policy maintenance) and can be shared with new bakers.

