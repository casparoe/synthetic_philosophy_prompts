  The user's key insight is about causation direction: The analogy treats culture (soil) as pre-existing and separate from institutions (plant), but actually institutions might create the very trust they need. That's a powerful objection - the analogy might smuggle in false assumptions about culture being fixed.

  For disanalogies: The big problem is the soil's passivity versus culture's responsiveness. Soil doesn't change when you plant something, but culture can evolve with new institutions. Also missing is human agency - no gardener in the analogy, meaning no role for policymakers to adapt things. The interdependence point (complementarities) isn't captured either - institutions support each other like roots in soil, but the analogy separates plant and soil completely.

