prompt: |-
  I edit an anthology of new short fiction on metaphysical themes, written for readers who have some philosophy in them but who come to the book for the stories. I would like you to draft one of the pieces.

  Write a complete short story of roughly 2,500 to 3,500 words, with a title. Its subject is a disagreement about what it is for a person to exist in more than one way the world might have gone. On one side is the view that each person exists in exactly one world: whoever occupies the corresponding place in another world is a numerically different individual, linked to the first only by close resemblance, and that link is not guaranteed to run in both directions and not guaranteed to carry across a chain, so that someone may resemble a second person, and that second person a third, while the first and the third are linked by nothing at all. On the other side is the view that there is literally one person who exists in many worlds and merely has different properties in each, so that what happens elsewhere is something that happened to them.

  Constraints for the piece:

  1. No named philosophers, no schools, no citations, no epigraphs, and no narrator or character who stops to explain the theory. A reader who has never encountered either view should be able to reconstruct both from the events alone.

  2. Do not use the technical vocabulary of the debate. The words possible world, modal, counterpart, and transworld identity should not appear in their philosophical senses. If the characters need a name for the phenomenon, invent one that belongs to the setting.

  3. The mechanism by which other-worldly selves become practically relevant must be mundane and institutional rather than a laboratory: a probate court, an insurance office, a marriage registry, a religious tribunal, a debt collector, a school. Choose one, make it old and taken for granted, and let it do the work. No scene of first discovery, no inventor, no exposition.

  4. The difference between the two views must be made to matter legally or morally, whether to a promise, a debt, a marriage, a crime, or a parent's claim on a child. Include at least one scene in which a character is told, in the story's own vocabulary, that a certain act was not theirs but the act of someone who closely resembles them, and must decide whether to treat that as an acquittal or as an evasion.

  5. The failure of the relation to carry across a chain must be load-bearing rather than decorative. The plot should turn at some point on a sequence in which A is linked to B and B to C but A is not linked to C, and on what that does to a claim that has been travelling down the sequence.

  6. The ending must be legible both ways. It should not disclose which view is correct, and it should not resolve the ambiguity with a revelation. The same final scene ought to read as a consolation under one view and as a loss under the other.

  Give me the story itself, not an outline, and not a note on your intentions.
reasoning: |-
  Okay, the user wants me to write a metaphysical short story about differing views on personal identity across possible worlds. They've given very specific constraints: no philosophical jargon, set in a mundane institution, with plot-critical chain-of-resemblance failure, and an ending that works both ways. 

  Hmm, this is quite sophisticated. The user edits philosophical fiction anthologies, so they clearly know their stuff. They're not just asking for a story - they're testing whether I can embed complex metaphysics in narrative without exposition. The chain condition requirement suggests they want rigorous modal logic implications woven invisibly into plot.

  Let me unpack their core conflict: one view says there's only one person with different properties across worlds (transworld identity), the other says each world has numerically distinct resembling individuals (counterpart theory). The chain failure refers to how counterpart relations aren't transitive - a crucial difference.

  For the institution... probate court feels right. Inheritance forces concrete decisions about identity. An old clerkship system where "echo claimants" file across branches could feel organically bureaucratic. The chain problem could emerge through three generations of wills with shifting resemblance thresholds.

  I'll need two characters embodying each view: perhaps a pragmatic clerk who administers the counterpart-like system, and a claimant who intuitively feels she is the same person across worlds. The moral weight should come from a disputed promise - maybe a mother's deathbed vow to her daughter.

  The ending... ah, tricky. If the claimant receives partial inheritance (say 70%), it reads as consolation under transworld identity (she gets "her" share) but loss under counterpart theory (only 70% resemblance). The key is making the institutional verdict feel ambiguous rather than decisive.

  Better avoid any fantasy elements. Keep it subdued - yellowed documents, ink stains, the clerk's frayed cuffs. The metaphysics must bleed through administrative procedures: "branch verification" instead of "counterpart check", "resemblance thresholds" instead of "similarity metrics". 

  Most challenging is constraint #4 - having a character explicitly told "that wasn't you but someone like you" and rejecting that as evasion. Should happen when the clerk explains why she can't claim the full legacy. Her visceral refusal must carry the philosophical weight.

  For the chain failure: Grandmother's will requires 85% resemblance to beneficiary, mother's will 75%, but claimant only has 70% to grandmother. Clerk calculates she qualifies through mother but not directly - then reveals mother herself only had 80% to grandmother. So claimant's link to grandmother is doubly broken. That's the non-transitive chain.

  Final scene: claimant takes her 70% share. Under transworld view, she's accepting what's hers; under counterpart theory, she's settling for compensation from strangers. The worn velvet bag holding the coins becomes a silent symbol for both interpretations.

  Must resist explaining. Trust the documents, the calculations, the clerk's tired professionalism. The metaphysics lives in what the bureaucracy takes for granted.
answer: |-
  ## The Claimant of Branch Seven

  The air in the Chancery Clerk’s Office smelled perpetually of dust, damp parchment, and the metallic tang of cheap ink. Rain streaked the high, grimy windows overlooking the soot-stained city roofs. Elara Vanya smoothed the worn velvet of her mourning dress and placed the document on the counter before the clerk, Mr. Thorne. His spectacles perched low on his nose as he examined the seal – the intertwined serpents of the Vanya family crest.

  "Death certificate for Eris Vanya," Mr. Thorne stated flatly. "Mother. Branch Seven." He pushed it back towards her. "And your proof of lineage?"

  Elara produced the older certificate. "Lyra Vanya. Grandmother. Also Branch Seven."

  Mr. Thorne took it, his fingers stained blue at the tips. He didn't look at her. He moved to the towering shelves behind him, rows upon rows of ledgers bound in cracked leather, spines labeled with letters, numbers, and cryptic symbols denoting life-paths. He pulled down a heavy volume labeled *Vanya – Primary Branch & Echoes: 7*. He thumped it onto the counter, the dust motes dancing in the weak light.

  The Chancery Clerk’s Office handled estates where lineage crossed the branches – the divergent pathways of how the world *might* have gone. It was ancient, bureaucratic, and utterly matter-of-fact. Everyone knew that when a person lived, their potential selves lived too, scattered across other branches of reality. What happened next depended entirely on which branch you found yourself in, and what the estate documents demanded.

  Elara’s grandmother, Lyra, had been a shrewd woman. Her will stipulated that her considerable estate – a collection of rare botanical manuscripts and the income from a patent on a resilient grain hybrid – could only be inherited by a direct descendant *from her own primary branch*, Branch Seven, who demonstrated "significant congruence" with her own character and circumstances. A common clause, designed to ensure wealth stayed with the "true" self-line, not some distant echo with different values.

  Elara’s mother, Eris, inheriting under that clause, had added her own codicil. Upon her death, everything was to pass to *her* direct descendant of Branch Seven, requiring only "clear resemblance" to Eris herself.

  Mr. Thorne flipped pages, comparing signatures, life-event records (births, marriages, significant choices documented by the Office), and the official Congruence Assessments conducted periodically throughout a person’s life. He tapped entries with his stained finger.

  "Lyra Vanya, Branch Seven. Congruence to self-baseline: consistently high, averaging 92%." He flipped. "Eris Vanya, Branch Seven. Congruence to Lyra’s baseline at time of Lyra’s death... 80%. Sufficient under Lyra’s 'significant congruence' clause at the time." He flipped again. "Elara Vanya, Branch Seven. Congruence to Eris’s baseline at time of Eris’s death... 70%. Congruence to Lyra’s baseline... 65%."

  He closed the ledger with finality. "You qualify under your mother’s codicil. Clear resemblance to Eris is established at 70%, above the 60% threshold she set. Lyra’s estate, as held by Eris, passes to you."

  Relief washed over Elara. The manuscripts, the security of the patent income... they were hers. Proof she *was* her mother’s daughter, Lyra’s granddaughter, in the way that mattered. "Thank you, Mr. Thorne."

  He held up a hand. "However." He pulled down another ledger, thinner. *Vanya Patent Trust: Grain Hybrid #7*. "This is separate. Lyra Vanya placed the patent rights into a trust. The trust deed specifies disbursement only to a Branch Seven descendant demonstrating 'enduring alignment' with Lyra’s own principles and life-path. Threshold: 85% congruence to her established baseline."

  He opened the trust ledger. "Your current congruence to Lyra’s baseline: 65%. Insufficient."

  Elara’s relief curdled. "But... I’m her granddaughter! Branch Seven! The manuscripts pass, but not the patent? They were part of her life’s work!"

  "Different instrument, different requirements," Mr. Thorne said, his voice devoid of sympathy. He was merely the gatekeeper of the rules. "The trust requires enduring alignment with *Lyra*. You align sufficiently with *Eris* to inherit what *she* controlled. But your alignment with Lyra falls short." He paused, then delivered the institutional truth with chilling clarity. "The Lyra Vanya who established that trust, demanding 85% alignment, exists only in a branch where her potential unfolded in a very specific way. The person whose actions bind this trust is not *you*. She is someone who shares your origin, your branch, even much of your history, but whose path diverged sufficiently. She resembles you closely, yes, but the resemblance isn't strong enough to bind *her* commitments to *you*."

  Elara felt the words like a physical blow. *Not you. Someone who resembles you.* She stared at the ledger entries – percentages quantifying her connection to her own blood. "That’s... that’s absurd! It *is* me! Just... a me who made slightly different choices somewhere? A me unluckier in circumstance? How can her promise not be mine? It’s *my* name on the family register!"

  "Resemblance," Mr. Thorne repeated, as if explaining to a child, "is not identity. The chain of resemblance can be broken. The Office measures it. You are linked sufficiently to Eris. Eris was linked sufficiently to Lyra. But you are *not* linked sufficiently directly to Lyra herself, according to *her* stipulated measure for *this specific promise*." He pointed to the numbers. "Eris achieved 80% to Lyra. You achieve 65% to Lyra. The link through Eris doesn't bridge the gap Lyra demanded for her trust. The claim travels down the chain – from Lyra to Eris to you – but Lyra’s requirement for the trust is a direct line, a high bar you don’t meet. Eris met it for her inheritance, but that doesn’t obligate Lyra’s trust to you."

  He slid a form across the counter. "You are entitled to the manuscripts and the residual estate under Eris’s will. Sign here to acknowledge receipt and forfeiture of claim on the Vanya Patent Trust."

  Forfeiture. The word echoed. She saw her grandmother, fierce and brilliant, showing her the fragile pressed flowers in the manuscripts. She heard her mother’s voice, strained but determined on her deathbed: "The trust, Elara. It’s security. It’s her legacy. *Our* legacy. It must stay with the true inheritor. Promise me you’ll be that person." Elara had promised, clinging to her mother’s hand.

  And now, this clerk, this ledger-keeper of fractured selves, told her the promise wasn't hers to keep? That the *her* who made the promise to her dying mother wasn't the *her* standing here now? That she was absolved of the burden because... she resembled herself inadequately? It felt like a sickening evasion, a denial of responsibility cloaked in bureaucratic arithmetic.

  "I *did* promise her," Elara whispered, her voice thick. "I held her hand. I said the words."

  "You promised *Eris*," Mr. Thorne corrected, his tone utterly neutral. "And under her codicil, you inherit her estate. The promise you made to Eris is fulfilled by you receiving that inheritance. The promise *Lyra* embedded in the trust deed, however, was made contingent on a specific degree of resemblance to *herself*. The you who exists here, now, does not meet that resemblance threshold. Therefore, the obligation of that specific promise does not bind you. It binds only someone who more closely resembles the Lyra of that branch."

  He pushed the form closer. "Sign, Miss Vanya. Or dispute the assessment. The appeals process is lengthy and rarely successful."

  Elara looked at the form, then at the ledgers containing the quantified ghosts of her family. Was Mr. Thorne offering her an acquittal? Telling her she was free of a burden she never truly deserved? Or was he enforcing a cruel separation, slicing her away from her grandmother’s deepest intent and her mother’s dying wish? Was the woman who promised her mother already gone, lost in a branch where she *was* congruent enough, leaving this Elara merely an echo, unburdened but also unworthy?

  The rain drummed harder against the windows. She thought of the manuscripts – tangible pieces of her grandmother’s passion. She thought of the patent income – security, yes, but also the engine funding Lyra’s botanical expeditions, her drive. Which was the real inheritance? The objects, or the spirit that animated them? Which version of her deserved which?

  Slowly, mechanically, Elara signed the form acknowledging receipt of the manuscripts and the residual estate, forfeiting claim to the trust. Mr. Thorne stamped it, the sound echoing in the quiet office. He handed her a chit for the warehouse where the manuscript crates were stored.

  As she turned to leave, the weight of the decision settled upon her. She felt lighter, unshackled from the impossible demand of being her grandmother’s perfect echo. She had what her mother directly left *her*. Wasn't that enough? Wasn't it a relief to be free of the burden of a promise made by a different self?

  But walking down the worn stone steps of the Chancery Office, the rain cooling her face, a different feeling surged. She saw her grandmother’s stern, loving face. She felt the ghost-pressure of her mother’s hand in hers. The patent trust *was* Lyra’s legacy. And she, Elara Vanya of Branch Seven, had just been formally declared *not the one* meant to carry it forward. She was merely a beneficiary of her mother’s affection, severed from the deeper continuity. The trust would pass to... whom? Some distant cousin who happened to hit 85%? Or lie fallow? She had been acquitted of a responsibility, yes, but it felt less like freedom and more like exile. She had kept her promise to Eris by accepting Eris’s gift, but she had failed the *spirit* of the promise Eris extracted, the promise meant to bind her to Lyra’s core.

  She reached the warehouse, presented the chit. The attendant led her to a stack of sturdy wooden crates. She prised one open with trembling fingers. Inside, nestled in linen, lay the first volume of Lyra’s *Florae Subterraneae*. She traced the intricate illustration of a luminous cave mushroom, drawn in her grandmother’s precise hand. Her fingers lingered on the page Lyra had touched, in *her* branch. A direct line, unmediated by percentages.

  Here was the physical proof of lineage, of connection that bypassed the Chancery’s cold calculus. *This* was hers. She held a piece of her grandmother’s world. Relief warmed her, the solace of tangible inheritance.

  But as she closed the crate lid, the image of the patent seal – the intertwined serpents guarding the grain hybrid that fed thousands – flashed in her mind. Lyra’s ambition, her impact. That was lost to her. She was the custodian of the past, the beautiful, fragile record. But the living legacy, the future-facing force, belonged to someone else. Or perhaps to no one at all.

  Elara placed a hand on the cool wood. Was this consolation? The preservation of the artifact, the proof of love passed mother-to-daughter in *this* branch? Or was it loss? The severing from the larger purpose, the declaration that she was, in the end, not quite Lyra’s true heir? The rain on the warehouse roof was the only answer, a steady, ambiguous drumming on the boundary between one branch and another. She had what was hers. She had lost what was hers. Both truths coexisted, as real and as fragile as the pressed flowers between the pages before her.
