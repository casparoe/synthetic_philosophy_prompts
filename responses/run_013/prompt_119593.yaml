prompt: |-
  I run the editorial side of a small nonprofit local newsroom — seven reporters, no in-house lawyer, and I'm the one who signs off when somebody wants to get a story by not being straight with people. It comes up maybe once a month, sometimes on a two-day deadline, and when it blows up it blows up publicly, so I need something I can point to afterwards.

  What I want is a procedure my reporters and I can actually run, built on Augustine's position on lying rather than on the usual journalism-ethics cost-benefit thing. My understanding is that he's an absolutist — no lie is OK, not even to save someone's life or keep them out of serious harm — and that he ranks lies by what they're for while still calling all of them sins. That is not what our industry handbook says and I'm not sure I agree with it, but I want to see what the position actually commits me to before I decide whether I'm willing to depart from it. Keep whatever distinctions in his view actually do work here, and tell me which ones you had to throw out to make the thing usable.

  So: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision back to me because it's a values question rather than a factual one. Some things it has to handle:

  - A reporter wants to pose as a prospective tenant to get inside a building where the landlord is running illegal units. That's a flat false statement about who she is.
  - A reporter interviews someone who assumes — wrongly, but because of nothing the reporter said — that the reporter is on their side, and the reporter lets them keep thinking it. Nobody says anything untrue. Staff here call it the nod. I suspect this is where the whole thing gets decided and I dont know what Augustine does with it. I also have a hazy memory that he treats concealing the truth differently from telling a lie, and I'd like that sorted out, because our reporters conceal things constantly and I don't want to outlaw that by accident.
  - Our video person wants to use a re-enactment, shot with the real family but with events reconstructed, and doesn't want to label it on screen because the label kills the piece. So the person being deceived is now the audience.

  Give me the procedure, then run it on all three. I'm expecting it to say no on at least one of them, and I'd rather hear that straight than get a version that lets me do what I already wanted to do. Then tell me what the procedure can't decide — the points where it just stops and I have to be the one who chooses, and what I'm taking on if I choose against it. And if the honest answer is that Augustine's position doesn't yield a workable procedure at all, say so, and tell me what the nearest thing to one would be.
reasoning: |-
  Okay, the user runs a small nonprofit newsroom and wants an ethical procedure based on Augustine's absolutist stance against lying. They need a practical guide for their team, especially when reporters face situations involving deception. Let me start by recalling Augustine's key points. He distinguishes between lying (speaking falsehood with intent to deceive) and concealing truth. Lying is always sinful, regardless of the reason. But concealment isn't necessarily lying. That's crucial because reporters often conceal without uttering false statements.

  The user mentioned three scenarios: posing as a tenant, the "nod" (allowing a misconception), and unlabeled re-enactments. For the first, posing involves false statements, which Augustine would clearly forbid. The nod is trickier—since no false statement is made, it might be concealment, but Augustine might still see it as deception. Re-enactments without labels deceive the audience, which Augustine would consider lying by omission in presentation.

  The user’s deeper needs include wanting a clear, defensible policy that protects their newsroom's integrity, especially when stories blow up publicly. They might also want to avoid legal risks without an in-house lawyer. They’re open to Augustine’s rigor but need to know the trade-offs. The unspoken need is maintaining trust with the audience while doing investigative journalism.

  I should structure the procedure with clear questions: Was a false statement made? Was truth concealed? Was deception intended? For each scenario, apply these steps. The nod scenario stops at step 3—intent to deceive. Here, the user must decide if the public interest justifies it, but Augustine wouldn't endorse it. The re-enactment case fails all steps because the presentation deceives the audience.

  The user needs to know where the procedure leaves gray areas. Augustine’s framework stops at intent; beyond that, it’s the editor’s judgment. But choosing against Augustine means departing from his absolutism. The key is balancing ethical rigor with practical journalism needs, especially in holding power accountable. The user must decide if occasional concealment is worth the moral cost or if alternative methods can achieve the same goals without deception.
answer: |-
  Here's a procedural framework based on Augustine's core principles against lying, designed for practical application in your newsroom. I've preserved his key distinctions while focusing on operational clarity.

  **Core Augustinian Principles Embedded in the Procedure:**
  1.  **Absolute Prohibition of Lying:** A lie is *always* a sin. It's defined as **intentionally communicating a falsehood with the will to deceive.**
  2.  **Motive Doesn't Excuse Lying:** The gravity of the sin varies (e.g., lying for fun vs. lying to save a life), but *all lies are sinful*. Good intentions cannot make a lie morally permissible.
  3.  **Distinction Between Lying and Concealing:** *Not revealing the whole truth is not necessarily lying.* Augustine allows for keeping secrets or remaining silent, provided no *positive falsehood* is uttered. However, *intentionally fostering a false belief through omission or ambiguity* can approach or constitute deception, even without a literal falsehood.
  4.  **Intent is Paramount:** The crucial element is the *will to deceive* – the deliberate intention to make someone believe what is false.

  **The Augustine-Based Deception Procedure:**

  Ask these questions **in strict order**. Stop at the first "No" or "Unclear."

  1.  **FACT: Did the reporter (or the final product) make a *positive statement* that is objectively false?**
      *   *Sufficient Answer:* Yes (Lie, STOP - Not Permitted). / No (Proceed to Q2).
      *   *Threshold:* A direct, verbal or written (including electronic/text) assertion known to be untrue. (e.g., "I am a prospective tenant" when untrue).

  2.  **FACT: Did the reporter *actively conceal* the truth *through an action* specifically designed to create a false impression? (Beyond mere silence/non-disclosure).**
      *   *Sufficient Answer:* Yes (Likely Deception, Proceed to Q3 for intent). / No (Proceed to Q3).
      *   *Threshold:* Actions like wearing a disguise, using a fake ID, forging documents, planting listening devices, or *deliberately* manipulating the environment to hide their true purpose/identity in a way that *implies* a falsehood. Mere observation without interaction, or using public records/databases, generally doesn't qualify. Silence alone isn't active concealment.

  3.  **INTENT: Did the reporter *intend* for the subject/audience to believe something specific that the reporter knew was *not true*?**
      *   *Sufficient Answer:* Yes (Deception, STOP - Not Permitted under Augustine). / No (Proceed to Q4).
      *   *Threshold:* This is the core. Did the reporter *aim* to create or sustain a false belief? "Letting someone keep thinking it" because it's convenient for the story implies intent. Ambiguity designed to mislead counts. Genuine neutrality without fostering a specific false belief might not, but is rare.

  4.  **METHOD: Did the reporter avoid *any implication of assent* to a false statement made by the subject? (The "Nod" Check)**
      *   *Sufficient Answer:* Yes (Possibly Permissible Concealment, PROCEED). / No or Unclear (Deception, STOP - Not Permitted).
      *   *Threshold:* Augustine worries about *signifying assent* to falsehood. Nodding, saying "uh-huh," "I see," or "okay" in response to a subject's false statement *can* be interpreted as endorsing that falsehood, thus constituting a lie. Silence, a neutral "tell me more," or changing the subject without affirming the falsehood are safer. *This is the hardest line to hold.* If there's any active gesture/word that could reasonably be interpreted as agreement with a known falsehood, it fails.

  5.  **AUDIENCE DECEPTION (For Final Product): Does the presentation *unambiguously* reveal its constructed nature *within the piece itself*?**
      *   *Sufficient Answer:* Yes (Permissible Concealment/Artifice, PROCEED). / No (Deception, STOP - Not Permitted).
      *   *Threshold:* For re-enactments, composites, simulations, etc., the *audience* must not be led to believe they are witnessing raw, literal truth. Augustine would see audience deception as a lie. Clear, immediate labeling ("Re-enactment," "Dramatization," "Simulation based on testimony") or narration stating the nature of the footage is required. Burying it in credits or a website FAQ is insufficient.

  **Where the Procedure Hands Decision Back to You (The Editor's Values Choice):**
  *   **After a "Proceed" from Q4 or Q5:** The procedure determines the action *isn't a lie by Augustine's definition*. However, Augustine would still likely view *intentional deception* (even without a literal falsehood) as morally problematic, though distinct from lying. The procedure doesn't forbid it, but **you must decide:**
      *   Is this *intentional deception* necessary and justified by the public interest served?
      *   Are there *absolutely no truthful alternatives* to achieve the same vital information?
      *   Does this align with our broader organizational values and duty to truthfulness, even if technically permissible under this narrow Augustine test?
  *   **At Q3 (Intent - The Grayest Area):** While the procedure says "STOP" on a clear "Yes" to intent to deceive, the *degree* of deception and the *public interest* become factors *you* must weigh if you consider overruling Augustine's absolute ban. The procedure flags it as forbidden, but the gravity of the situation might force your editorial judgment.

  **Running the Scenarios:**

  1.  **Posing as a Prospective Tenant:**
      *   Q1: **YES.** Reporter makes a false statement ("I am a prospective tenant"). STOP - **Not Permitted.** (Augustine: Clear lie, sinful).

  2.  **The "Nod" (Interviewer lets subject keep false assumption):**
      *   Q1: *No* (Assuming no false statement made).
      *   Q2: *Probably No* (No active concealment *action* beyond silence/neutrality - unless setting up the interview involved deception).
      *   Q3: **YES.** Reporter *intends* for the subject to keep believing the false assumption to get the story. STOP - **Not Permitted.** (Augustine: Intentional deception, even without words, is morally unacceptable. Signifying assent via nod likely compounds it as a lie).
      *   **Reality Check:** This is the killer for most journalism under Augustine. The *intent* to exploit the misconception is key. Avoiding the "nod" requires extreme verbal discipline to avoid *any* affirmation of the false belief.

  3.  **Unlabeled Re-enactment:**
      *   Q1: *No* (The video itself isn't a false *statement*; it's a representation).
      *   Q2: *No* (Not applicable to the audience).
      *   Q3: **YES.** The producer *intends* for the audience to believe they are seeing actual footage of the real event. STOP - **Not Permitted.** (Augustine: Deceiving the audience is a lie).
      *   Q5 (If somehow passed Q3): **NO.** Without an on-screen label, the presentation *does not* unambiguously reveal its constructed nature. STOP - **Not Permitted.** (Augustine: Audience deception is lying).

  **What the Procedure Can't Decide & What You Take On:**

  1.  **The "Necessity" of Deception:** Augustine forbids lying *even if necessary*. The procedure flags forbidden acts. If you approve such an act (e.g., a carefully managed scenario passing Q4, or overriding a Q3 "Yes"), **you take on the moral responsibility** of justifying why this *intentional deception* was essential for a greater public good *despite* violating Augustine's core principle against deception. You are departing from his absolutism.
  2.  **Grading the Sin:** The procedure identifies an act as forbidden ("lie" or "intentional deception"). It doesn't weigh *how bad* the sin is (lying to expose corruption vs. lying for fun). That's inherent to Augustine's view – all are sins. Your decision to proceed anyway implicitly makes this gradation.
  3.  **Defining "Active Concealment" (Q2) & "Implied Assent" (Q4):** These have gray areas. The procedure gives thresholds, but borderline cases require **your judgment call** on whether it crosses into deception.
  4.  **Public Interest vs. Truthfulness:** Augustine prioritizes truthfulness *over* consequences. The procedure identifies deception. **You must decide** if the public interest served *outweighs* the moral compromise of deception in this specific instance. This is the fundamental tension.

  **Conclusion: A Workable, But Demanding, Framework**

  Augustine's position **does yield a workable procedure**, but it's far stricter than standard journalistic ethics. It will frequently say "No," especially to common tactics like exploiting misconceptions ("the nod") and unlabeled dramatic representations. Its power lies in its clarity and the high barrier it sets against intentional deception.

  **What you gain:** A defensible, principle-based (non-utilitarian) argument rooted in the absolute value of truthfulness. A clear line that protects against sloppiness and the slippery slope of "white lies." Something concrete to point to when explaining a tough call ("We have a strict policy against any intentional deception based on principle X").

  **What you commit to (if following Augustine strictly):** Forgoing many common investigative techniques involving false statements or intentional fostering of false beliefs. Significantly altering interview techniques to avoid even implied assent to falsehoods. Rigorous transparency with the audience about any artifice. Accepting that some stories might be unattainable through truthful means alone.

  **The nearest thing if you need more flexibility:** Use this procedure as the *first* test. If it results in "STOP - Not Permitted," **then and only then** engage in a rigorous, documented, public-interest justification test (like the "SSP" - Significance, Specificity, Provenance, or similar frameworks). This forces you to confront the ethical cost *explicitly* before overriding Augustine's absolute prohibition. Document *why* the deception was necessary, what alternatives were exhausted, and the vital public interest served. This maintains a commitment to truthfulness as the primary value while acknowledging the extreme, rare cases where intentional deception might be deemed necessary by the editor, accepting the moral burden that comes with that choice. You are no longer following Augustine absolutely, but you are taking his prohibition seriously.
