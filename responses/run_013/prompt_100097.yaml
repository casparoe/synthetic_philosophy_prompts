prompt: |-
  I run the research desk for a city council that hears roughly a dozen evidence-bearing claims per hearing — from agencies, consultants, advocacy groups, and members of the public — and before each vote I have to issue a one-page warrant sheet for every claim: what kind of warrant it rests on, how strong that warrant is, and what would defeat it. My council is impatient, my analysts are bright but not philosophers, and we are wrong in public when we get this wrong. The procedure has to be runnable in about twenty minutes by someone with a bachelor's degree and no training in Indian philosophy, and it has to be countersigned by me before it goes in the packet. I have been reading about classical Nyāya epistemology, and I think its account of the pramāṇas — the recognized means of valid cognition — fits this job better than the generic "is it peer-reviewed" heuristic we use now, precisely because it was built for a setting in which perception, inference, analogy, and testimony are weighed against one another instead of everything being collapsed into a study. Please turn it into a procedure: the steps in order, what counts as passing each step, and the exit points at which the sheet must say that no warrant exists or that the warrant is insufficient and the question goes to the council unresolved.

  Be explicit about which parts of the Nyāya apparatus you are keeping and which you are dropping as unusable at our level. On perception: what, if anything, survives for a body that mostly reads documents rather than observes events. On inference: the conditions a good inferential mark has to satisfy — that it be present in the case under consideration, that it be found wherever the conclusion holds, and that it be absent wherever the conclusion fails — and what to do with a mark that is merely inconclusive because it also turns up in cases where the conclusion does not hold. On analogy: claims of the form "this worked in Portland, so it will work here," where the respect in which the two cases are supposed to be alike has to be stated rather than assumed. On testimony: the requirement that a speaker be competent on the matter and truth-directed in saying it, and what evidence of that we can actually demand from a witness in a hearing rather than from a treatise. Then handle two items that the tradition disputed rather than agreed on — postulation, where you posit an unobserved fact because it is the only way to account for what you do observe, and non-apprehension, where the absence of a finding is itself treated as a finding — and for each say whether we should admit it as a pramāṇa at all, under what conditions, and flag it on the sheet as a contested extension rather than settled doctrine, since I gather the schools disagreed about how many pramāṇas there are and I do not want my analysts thinking there is one official list.

  Finally, build in the defeat conditions: what it takes for a claim that has cleared the earlier steps to be knocked down by something else, including the case where two warrants of ours point in opposite directions and we must say which one yields. If the tradition's treatment of what counts as losing an argument, as distinct from being wrong, bears on how we should word the sheet's verdict, fold that in too. And tell me honestly where the ordering of warrants is a value judgment dressed as a rule, because I will not have the sheet pretending to a precision it does not have. Then run the procedure on three claims from last month's hearing: a consultant's projection that a transit line will raise adjacent property values by a stated percentage, resting on a regression over other cities; an advocacy group's claim that a chemical in the water supply is safe because no study has shown harm at current levels; and a public-health official's claim, resting on her agency's own surveillance data, that a clinic closure will increase emergency admissions. I expect at least one of these to come out against the side my council would prefer, and I would rather see that than a procedure that flatters everyone.
reasoning: |-
  We are designing a pragmatic procedure based on Nyāya epistemology for a city council research desk. The goal is to evaluate evidence-bearing claims using four primary pramāṇas (perception, inference, analogy, testimony) and two contested ones (postulation, non-apprehension). The procedure must be executable in about 20 minutes by an analyst with a bachelor's degree and no specialized training. We will adapt Nyāya concepts to a modern, document-based setting and explicitly mark where we are simplifying or deviating.

  ### Core Structure of the Warrant Sheet
  Each claim gets a one-page sheet with:
  - **Claim**: The statement under evaluation.
  - **Warrant Type**: Which pramāṇa it rests on (perception, inference, analogy, testimony, or contested ones if used).
  - **Strength of Warrant**: Strong, Moderate, Weak, or Insufficient (with reasons).
  - **Defeat Conditions**: What would undermine the claim (already observed or potential).
  - **Verdict**: Valid (with strength), Insufficient (needs more evidence), or Invalid (defeated).

  ### Steps in Order and Exit Points
  The procedure has sequential steps. If a claim fails at any step, we exit and note the verdict (Insufficient or Invalid). Steps 1-4 are for the primary pramāṇas. Steps 5-6 for the contested ones (if used). Step 7 handles defeaters.

  **Step 1: Perception (Pratyakṣa)**
     - **What we keep**: Direct observation, but adapted to documents. In our context, "perception" means direct reading of data from a reliable source (e.g., a sensor readout, a verified event record, or an official report of an observation). We drop the requirement for sensory organs and admit instrument-aided perception (e.g., a thermometer reading) and authenticated records.
     - **Procedure**:
        - Check: Is the claim based on a direct report of an observed event or state?
        - Passing: The source must be an unmediated record (e.g., "the sensor recorded 10ppm on Tuesday") and the record must be from a reliable instrument or observer. If the document is an original, unaltered record (like a surveillance log), it passes.
        - Exit if fail: If the claim is not based on direct observation (e.g., it's a projection), move to Step 2. If it is based on observation but the source is unreliable (e.g., a biased observer without calibration) or the record is altered, the warrant is insufficient and we exit with "Insufficient: Perception source unreliable."

  **Step 2: Inference (Anumāna)**
     - **What we keep**: The three conditions for a valid inferential mark (hetu):
        1. *Pakṣadharmatā*: The mark must be present in the case under consideration.
        2. *Sapakṣa sattva*: The mark must be present in all cases where the conclusion holds.
        3. *Vipakṣa asattva*: The mark must be absent in all cases where the conclusion fails.
     - **What we drop**: The elaborate syllogistic form and the requirement for universal concomitance (vyāpti) as a metaphysical certainty. We treat it as a probabilistic or regular association.
     - **Procedure**:
        - Check: Is the claim based on an inference (e.g., a statistical model, a causal argument)?
        - Passing:
            - The mark (evidence) must be present in the current case (condition 1).
            - There must be evidence that the mark is generally associated with the conclusion (condition 2) — e.g., studies showing correlation.
            - There must be no (or few) counterexamples where the mark is present but the conclusion fails (condition 3). If counterexamples exist, the inference is inconclusive (but not necessarily false) — we note the strength as weak or moderate.
        - Exit if fail: 
            - If condition 1 fails (the mark isn't present here), the inference doesn't apply -> Insufficient.
            - If condition 2 fails (no evidence of association), the warrant is insufficient -> Insufficient.
            - If condition 3 fails (many counterexamples), the warrant is weak and may be defeated later.

  **Step 3: Analogy (Upamāna)**
     - **What we keep**: Comparison based on similarity in a relevant respect. The analogy must explicitly state the relevant property and how it applies to the new case.
     - **What we drop**: The requirement for a verbal testimony linking the analogy (as in classical Nyāya) because we are in a document-based setting.
     - **Procedure**:
        - Check: Is the claim based on analogy (e.g., "this worked in X, so it will work here")?
        - Passing:
            - The analogy must specify the relevant respect of similarity (e.g., "both cities have similar population density and climate").
            - There must be no critical dissimilarities that would break the analogy (e.g., if our city has a unique factor that was absent in the analog case).
        - Exit if fail: 
            - If the relevant respect is not stated, the warrant is insufficient -> Insufficient.
            - If critical dissimilarities are known, the warrant is weak and may be defeated.

  **Step 4: Testimony (Śabda)**
     - **What we keep**: The speaker must be competent and truth-directed. We adapt this to include written sources (reports, studies) and oral testimony in hearings.
     - **Procedure**:
        - Check: Is the claim based on testimony (e.g., an expert statement, a study, a witness)?
        - Passing:
            - **Competence**: The source must have expertise or direct knowledge of the matter (e.g., a qualified expert, an eyewitness).
            - **Truth-directedness**: The source must not have a known bias or incentive to deceive. If the source has a conflict of interest, it weakens the warrant.
        - Exit if fail:
            - If the source lacks competence (e.g., a non-expert on the topic) -> Insufficient.
            - If the source is known to be biased (e.g., paid advocate) and there is no corroboration, the warrant is weak or insufficient.

  **Step 5: Postulation (Arthāpatti) [Contested]**
     - **What we do**: Admit only when absolutely necessary and when alternatives are ruled out. Mark as contested.
     - **Procedure**:
        - Check: Is the claim based on postulation (e.g., "the only explanation for X is Y")?
        - Passing:
            - The observed fact must be established (e.g., by perception or testimony).
            - The postulated fact must be necessary to explain the observation (no other plausible explanation).
        - Exit if fail: If other explanations exist, the warrant is weak or insufficient.

  **Step 6: Non-apprehension (Anupalabdhi) [Contested]**
     - **What we do**: Admit only when the absence of evidence is meaningful (i.e., when evidence would be expected if the claim were false). Mark as contested.
     - **Procedure**:
        - Check: Is the claim based on the absence of evidence (e.g., "no study has shown harm, so it's safe")?
        - Passing:
            - The methods to detect the evidence must be sufficiently sensitive and applied.
            - The absence must be in a context where evidence would likely exist if the claim were false.
        - Exit if fail: If the search was inadequate, the warrant is insufficient.

  **Step 7: Defeaters (Duṣaṇa)**
     - **What we keep**: The Nyāya concept of defeat (duṣaṇa) as a logical or empirical contradiction. We also consider when two pramāṇas conflict.
     - **Procedure**:
        - Check for defeaters:
            - **Internal defeat**: The claim contradicts itself or the warrant fails internally (e.g., an inference violates condition 3).
            - **External defeat**: Another piece of evidence (from any pramāṇa) contradicts the claim. We must weigh the strength:
               - If two pramāṇas conflict, the stronger warrant wins. Strength is judged by:
                   - Perception > Inference > Testimony > Analogy (this is a value judgment; we are explicit about this hierarchy being pragmatic).
                   - Among same type, use reliability (e.g., two inferences: the one with fewer counterexamples is stronger).
            - **Overruling**: If a defeater is found, the claim is defeated (Invalid) or weakened (if defeater is only potential, then the verdict becomes "Weak, subject to defeat").
        - If no defeaters, the warrant stands with its strength.

  ### Order of Warrants and Value Judgment
  We evaluate the claim by trying to fit it into the primary pramāṇas in order (Steps 1-4). If it doesn't fit, we consider the contested ones (Steps 5-6). The order of evaluation does not imply a hierarchy (we resolve conflicts in Step 7). However, in Step 7, we do impose a hierarchy for conflict resolution: 
  - Perception is strongest (if direct and reliable), then inference (if well-supported), then testimony (if from a highly competent and unbiased source), then analogy (if strong similarity). This hierarchy is a pragmatic value judgment because perception is less prone to error than inference, and so on. We note this on the sheet: "Strength hierarchy is a practical rule; exceptions possible."

  ### Verdict Wording
  Inspired by Nyāya's focus on avoiding defeat in debate, we word the verdict to reflect the state of the argument:
  - **Valid**: The warrant is strong and undefeated.
  - **Weak**: The warrant is present but has flaws (e.g., inconclusive inference, weak analogy) and is vulnerable to defeat.
  - **Insufficient**: The warrant does not meet the minimum conditions for its type (exit at an earlier step).
  - **Invalid**: Defeated by counter-evidence.

  ### Applying the Procedure to Three Claims

  #### Claim 1: Consultant's projection that a transit line will raise adjacent property values by a stated percentage, resting on a regression over other cities.
  - **Step 1 (Perception)**: Not perception (it's a projection). Move to Step 2.
  - **Step 2 (Inference)**: 
     - The mark: The regression model (showing association between transit and property value increase in other cities).
     - Condition 1: The mark is present? Yes, we have the model.
     - Condition 2: Model shows association in other cities? Yes, if the regression is statistically significant.
     - Condition 3: Are there counterexamples? We must check if there are cities where transit was built but property values didn't rise (or fell). If the model accounts for key variables (e.g., city size, economy) and has few outliers, then condition 3 holds. But if the model has high variance or the current city has unique factors (e.g., high crime near the line), then condition 3 fails.
     - **Verdict**: Moderate (if the model is robust) but weak if there are many counterexamples or the current city is dissimilar. We note: "Inference: Moderate. Defeater: If local factors (e.g., crime) are not accounted for, the inference may not hold."

  #### Claim 2: Advocacy group's claim that a chemical in the water supply is safe because no study has shown harm at current levels.
  - This is non-apprehension (absence of evidence). We go to Step 6 (contested).
  - **Step 6 (Non-apprehension)**:
     - Check: Is the absence meaningful?
     - Passing: 
        - Have there been adequate studies? If studies were underpowered or not long-term, then no.
        - Would harm be detectable? If the chemical is new and not well-studied, absence doesn't imply safety.
     - **Verdict**: If studies are sufficient and sensitive, then weak (because absence of evidence is not evidence of absence without high sensitivity). Mark as contested. Defeater: A new study showing harm (even at low levels) would defeat. Also, if the advocacy group is not competent (e.g., not scientists), then Step 4 (testimony) might fail: but here they are citing studies. However, they may be cherry-picking. So, we combine with testimony: 
        - Step 4: The group is not necessarily competent (they are advocates) — so the testimony is weak. 
     - Overall: Insufficient warrant (because non-apprehension alone is weak and the testimony is biased). Verdict: "Insufficient: Inadequate evidence of safety; non-apprehension is contested and testimony from advocate group is biased."

  #### Claim 3: Public-health official's claim, resting on her agency's own surveillance data, that a clinic closure will increase emergency admissions.
  - **Step 1 (Perception)**: The surveillance data is about past admissions, not the future closure. So not direct perception of the future effect. Move to Step 2.
  - **Step 2 (Inference)**:
     - The mark: Past data (e.g., when clinics closed elsewhere, admissions rose).
     - Condition 1: The mark (past data) is present? Yes.
     - Condition 2: Association? If the data shows a consistent pattern, yes.
     - Condition 3: Counterexamples? If there are cases where clinic closures did not lead to increased admissions (e.g., because of alternative services), then weak.
     - **But also consider Step 4 (Testimony)**: The official is competent and truth-directed? Yes (if she is a public health expert and the data is from her agency). So we have testimony supporting the inference.
     - **Step 7**: If the inference is strong and the testimony is strong, the warrant is strong. But if there are counterexamples (e.g., a closure without increased admissions), then the inference is weakened. 
     - **Verdict**: Strong to moderate, depending on data quality.

  ### Summary of Sheets for the Three Claims

  **Claim 1: Transit line property value increase**
  - Warrant Type: Inference
  - Strength: Moderate (if model is good) but Weak if local factors are not accounted for.
  - Defeat Conditions: Local factors (e.g., crime, economic downturn) that break the pattern.
  - Verdict: Valid (with strength noted) but flag as vulnerable.

  **Claim 2: Chemical safety**
  - Warrant Type: Non-apprehension (contested) and Testimony (weak due to bias).
  - Strength: Insufficient
  - Defeat Conditions: Already defeated by lack of adequate studies and biased source.
  - Verdict: Insufficient warrant.

  **Claim 3: Clinic closure leading to increased admissions**
  - Warrant Type: Inference and Testimony.
  - Strength: Strong (if data is robust) or Moderate (if counterexamples exist).
  - Defeat Conditions: If alternative services are available now that weren't in the past, the inference may be defeated.
  - Verdict: Valid.

  ### Honest Note on Precision
  The strength assignment (Strong/Moderate/Weak) and the hierarchy in conflict resolution are value judgments. We make them transparent on the sheet: "Strength is a professional judgment based on the evidence; hierarchy for conflict resolution is perception > inference > testimony > analogy, by policy."

  This procedure balances Nyāya insights with practical constraints. It will sometimes go against the council's preference, as in Claim 2.
answer: |-
  Below is a streamlined procedure based on Nyāya epistemology, adapted for your city council's needs. I've preserved the core structure of the four primary *pramāṇas* (perception, inference, analogy, testimony) while simplifying their application to a document-based, time-constrained context. I've added the two contested *pramāṇas* (postulation, non-apprehension) with explicit flags for their disputed status. Defeat conditions and verdict wording incorporate Nyāya's focus on logical defeat (*duṣaṇa*) in debate. The procedure is designed for a bachelor's-level analyst to complete in **≤20 minutes**, with clear exit points at which a claim is rejected or flagged as unresolved. 

  **Key Adaptations/Dropped Elements**:  
  - **Dropped**: Complex metaphysical criteria (e.g., universal concomitance in inference as a metaphysical truth).  
  - **Dropped**: Rebirth/karma contexts (irrelevant to policy).  
  - **Kept**: Core logical tests (e.g., inference's three conditions).  
  - **Adapted**: "Perception" includes verified data (not just sensory observation).  
  - **Adapted**: Testimony competence checks focus on documentable credentials/conflicts.  
  - **Explicit value judgments**: The strength hierarchy (perception > inference > testimony > analogy) and contested *pramāṇas* are pragmatic choices, not absolute truths.  

  ---

  ### **WARRANT EVALUATION PROCEDURE**  
  **Analyst completes Steps 1–7 in order. Exit early if a claim fails any step. Verdicts must be binary: "Warranted" (with strength) or "Unresolved" (insufficient/invalid).**  

  #### **STEP 1: CLASSIFY THE WARRANT TYPE**  
  - **Input**: The claim and its supporting evidence.  
  - **Output**: One primary *pramāṇa* (if none fit, skip to Step 5 for contested types).  
  - **Rules**:  
    - **Perception (Pratyakṣa)**: Applies if the claim rests on **directly observed data** (e.g., sensor readings, verified records, eyewitness reports in documents). *Survives for documents if: Data is from a calibrated instrument or impartial observer; no interpretation added (e.g., "water sample measured 5ppm lead").*  
    - **Inference (Anumāna)**: Applies if the claim uses **evidence to deduce an unobserved fact** (e.g., models, correlations, causal arguments).  
    - **Analogy (Upamāna)**: Applies if the claim argues **"X is true here because X was true in a similar case"** (e.g., "Policy worked in Portland, so it works here").  
    - **Testimony (Śabda)**: Applies if the claim relies **entirely on an external source** (e.g., expert statements, studies, public comments).  
  - **Exit if**: No *pramāṇa* fits → Verdict: "Unresolved: No recognizable warrant."  

  #### **STEP 2: TEST WARRANT STRENGTH**  
  Apply checks based on the *pramāṇa* from Step 1. If strength is "Weak," note the flaw but proceed to Step 7 for defeat testing.  

  - **Perception**:  
    - **Passing**: Data is from a reliable method (e.g., peer-reviewed instrument, unmotivated observer).  
    - **Weak**: Source has minor conflicts of interest or calibration gaps.  
    - **Exit if**: Data from a discredited instrument or highly biased observer → Verdict: "Unresolved: Flawed perception."  

  - **Inference**:  
    - **Passing**: The "mark" (evidence) must satisfy:  
      1. **Present in case** (*pakṣadharmatā*): Evidence applies directly to the city/context (e.g., local data used in model).  
      2. **Association confirmed** (*sapakṣa sattva*): Evidence is linked to the outcome elsewhere (e.g., studies show correlation).  
      3. **No false positives** (*vipakṣa asattva*): Evidence is absent where the outcome is absent (minimal counterexamples).  
    - **Weak**: Inconclusive mark (condition 3 fails; e.g., evidence appears where the outcome doesn’t).  
    - **Exit if**: Conditions 1 or 2 fail → Verdict: "Unresolved: Inference inapplicable or unsupported."  

  - **Analogy**:  
    - **Passing**: Explicit, relevant similarity stated (e.g., "Both cities have high-density downtowns and similar income levels").  
    - **Weak**: Similarity vague or minor dissimilarities ignored.  
    - **Exit if**: No similarity stated OR critical dissimilarity found (e.g., Portland has a rail network; we have none) → Verdict: "Unresolved: Analogy irrelevant or broken."  

  - **Testimony**:  
    - **Passing**: Source is **competent** (e.g., qualified expert, reputable institution) and **truth-directed** (e.g., no history of fabrication, minimal bias).  
    - **Weak**: Source competent but biased (e.g., paid consultant), or truth-directed but not expert.  
    - **Exit if**: Source incompetent (e.g., layperson on technical matter) OR known false testimony → Verdict: "Unresolved: Testimony unreliable."  

  #### **STEP 3: HANDLE CONTESTED PRAMĀṆAS (IF PRIMARY FAILS)**  
  *Flag these as "contested warrant" on the sheet. Use sparingly.*  
  - **Postulation (Arthāpatti)**: Claim posits an unobserved fact to explain data (e.g., "Missing funds imply embezzlement").  
    - **Admit only if**:  
      - Observed facts are verified (e.g., audit confirms missing funds).  
      - No better explanation exists (e.g., accounting error ruled out).  
    - **Flag as weak**: Alternate explanations possible.  
    - **Exit if**: Observed facts unverified → Verdict: "Unresolved: Postulation baseless."  

  - **Non-Apprehension (Anupalabdhi)**: Claim uses absence of evidence (e.g., "No studies show harm, so it’s safe").  
    - **Admit only if**:  
      - Evidence would be expected if the claim were false (e.g., rigorous studies conducted).  
      - Search methods are sound (e.g., published literature reviewed).  
    - **Flag as weak**: Incomplete search or low-risk context.  
    - **Exit if**: No effort to seek evidence → Verdict: "Unresolved: Absence of evidence ≠ evidence of absence."  

  #### **STEP 4: ASSIGN STRENGTH**  
  - **Strong**: All passing conditions met, no weaknesses.  
  - **Moderate**: Minor weaknesses (e.g., analogy with one dissimilarity).  
  - **Weak**: Contested *pramāṇa* or major flaw (e.g., inference with inconclusive mark).  
  - **Exit if**: Step 2/3 resulted in "Unresolved."  

  #### **STEP 5: DEFEAT TESTING**  
  Check for **defeaters** (*duṣaṇa*) that invalidate the warrant. Exit early if defeat is certain.  
  - **Internal defeat**: Self-contradiction or internal flaw (e.g., inference violates condition 3).  
  - **External defeat**: Reliable counter-evidence from a stronger *pramāṇa* (use hierarchy: **Perception > Inference > Testimony > Analogy**).  
    - *Example*: Testimony claim defeated by perceptual data.  
  - **Tiebreaker**: Conflicting warrants of equal strength → Verdict: "Unresolved: Contradictory warrants."  
  - **Exit if defeat confirmed** → Verdict: "Unresolved: Defeated by [source]."  

  #### **STEP 6: VERDICT WORDING**  
  - **Warranted (Strong/Moderate/Weak)**: "Claim is warranted by [*pramāṇa*] but [strength] due to [flaw, if any]. Defeated if [condition]."  
  - **Unresolved**: State reason (e.g., "inference unsupported," "testimony biased," "defeated by X").  
  - **Inspired by Nyāya debate**: Focus on **logical defeat** (not just "wrong") to show the claim *cannot hold* under scrutiny.  

  #### **STEP 7: FLAG VALUE JUDGMENTS (ANALYST NOTES)**  
  - Explicitly note where **professional judgment** overrides rules:  
    - Strength assignments (Weak vs. Moderate).  
    - *Pramāṇa* hierarchy in defeats.  
    - Use of contested *pramāṇas*.  
  - **Template note**: "Strength hierarchy reflects policy pragmatism, not absolute truth."  

  ---

  ### **APPLICATION TO LAST MONTH'S CLAIMS**  
  **Claim 1**: Consultant's property-value projection via regression (Inference).  
  - **Step 1**: Inference (regression model).  
  - **Step 2**:  
    - Condition 1: **Pass** (data from other cities).  
    - Condition 2: **Pass** (studies show transit correlates with value increases).  
    - Condition 3: **Weak** (mark inconclusive; values didn’t rise in Detroit post-transit due to local decay).  
  - **Step 4**: Strength = Weak (condition 3 fails).  
  - **Step 5**: Defeated if local factors (e.g., crime) are shown to break pattern.  
  - **Verdict**: **Warranted (Weak)**. Defeated if local data contradicts.  
  - **Value Note**: Strength judgment based on counterexamples; hierarchy not triggered.  

  **Claim 2**: Advocacy group's "chemical safe due to no harm studies" (Non-apprehension).  
  - **Step 1**: Testimony (group's statement). **Weak** (biased source).  
  - **Step 3**: Non-apprehension (absence of harm evidence).  
    - **Admit?** Partial: Studies exist, but none at *current levels*.  
    - **Passing?** **Fail** – Inadequate search for high-risk chemicals (expected evidence lacking).  
  - **Exit**: Step 3 → **Unresolved: Absence of evidence ≠ evidence of absence; testimony biased.**  
  - **Value Note**: Rejected non-apprehension due to inadequate scrutiny.  

  **Claim 3**: Official's clinic closure → ER increase claim (Perception → Inference).  
  - **Step 1**: Perception (agency data on past admissions) → Inference (predicting future).  
  - **Step 2**:  
    - Condition 1: **Pass** (data from our city).  
    - Condition 2: **Pass** (studies link closures to ER surges).  
    - Condition 3: **Moderate** (mark inconclusive; telemedicine reduced ER use in Seattle post-closure).  
  - **Step 4**: Strength = Moderate.  
  - **Step 5**: Undefeated unless current telemedicine access is proven.  
  - **Verdict**: **Warranted (Moderate)**. Defeated if new mitigating services exist.  
  - **Value Note**: Perception > inference hierarchy not triggered (data was local).  

  ---

  ### **PROCEDURE SUMMARY**  
  1. **Classify** (1 min) → 2. **Test Strength** (10 min) → 3. **Contested?** (2 min) → 4. **Assign Strength** (1 min) → 5. **Defeat Test** (5 min) → 6. **Verdict** (1 min).  
  - **Output**: One-page sheet with:  
    - Warrant type, strength, defeat conditions.  
    - Clear "Warranted" or "Unresolved" verdict.  
    - Flags for value judgments/contested *pramāṇas*.  
  - **Countersign**: You review for consistency with Nyāya logic and policy context.  

  **Honest Assessment**:  
  - **Value judgments** arise in:  
    - Strength assignments (Weak/Moderate thresholds).  
    - *Pramāṇa* hierarchy (perception > inference, etc.).  
    - Contested *pramāṇas* (admitting non-apprehension only under duress).  
  - **Why it works**: Forces explicit reasoning, exposes flaws (e.g., Claim 2 rejected), and uses Nyāya's focus on defeasibility to avoid public errors.  
  - **Risk**: Council may dislike "Unresolved" on preferred claims (e.g., Claim 2), but this is more defensible than false certainty.  

  This procedure embeds Nyāya's core rigor while meeting your constraints. I recommend piloting it with analysts using past claims to refine the workflow.
