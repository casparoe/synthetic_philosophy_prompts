  Below is a decision tree designed to map responses to concrete cases onto named ethical positions. It uses the cases you specified to probe structural commitments, avoiding pre-labeled philosophical schools. The tree has nine branch nodes (questions) and nine leaf nodes (positions), with notes on inconsistencies, unexplored combinations, and limitations.

  ### Decision Tree

  **Q1 (Original Case):**  
  For a sufficiently large N (e.g., 3^^^3), is it worse to:  
  (A) Torture one person for 50 years, or  
  (B) Give one imperceptible speck of dust in the eye to each of N people?  
  - **If A is worse → Q2**  
  - **If B is worse → Q5**  

  **Q2 (Barely Perceptible Harm):**  
  Same as Q1, but specks are *barely perceptible* (e.g., cause a tiny itch). For similarly large N, is B worse than A?  
  - **Yes → Leaf 1: Threshold Aggregating Consequentialism**  
  - **No → Q3**  

  **Q3 (Intrapersonal Aggregation):**  
  Is there a finite number M such that it’s worse for *one person* to endure M imperceptible specks distributed over their lifetime than to be tortured for 50 years?  
  - **Yes → Leaf 2: Deontological Separateness-of-Persons**  
  - **No → Leaf 3: Lexical Threshold**  

  **Q5 (Precision of Flip Point):**  
  In the original case (imperceptible specks), is there a *precise number* N where B becomes worse than A, or is it vague?  
  - **Vague → Leaf 4: Sorites View**  
  - **Precise → Q6**  

  **Q6 (Intrapersonal Consistency):**  
  Same as Q3: Is there a finite M where M specks for one person outweigh torture for that person?  
  - **Yes → Q7**  
  - **No → Leaf 5: Inconsistent Aggregation**  

  **Q7 (Mild Harm Comparison):**  
  Which is worse:  
  (X) One person suffers a bad headache for 10 days, or  
  (Y) Two people each suffer a bad headache for 5 days?  
  - **X worse → Leaf 6: Prioritarianism**  
  - **Y worse → Leaf 7: Anti-Concentration View**  
  - **Equal → Leaf 8: Additive Total Consequentialism**  

  **Q8 (Imperceptible Harm Validity):**  
  In the original case, if specks are *truly imperceptible* (no conscious experience), does your judgment that B is worse than A hold?  
  - **Yes → Position unchanged**  
  - **No → Add "with Perceptibility Threshold" to Leaf 6, 7, or 8**  

  ---

  ### Leaf Nodes (Named Positions)  
  1. **Threshold Aggregating Consequentialism**  
     - *Definition:* Aggregates harms only above a minimum severity (e.g., perceptible).  
     - *Most awkward commitment:* A billion barely perceptible itches outweigh torture, but a quintillion imperceptible specks do nothing.  
     - *Branch path:* Q1→A, Q2→Yes.  

  2. **Deontological Separateness-of-Persons**  
     - *Definition:* Opposes interpersonal aggregation but allows intrapersonal aggregation.  
     - *Most awkward commitment:* Torturing one to prevent quadrillion specks across people is forbidden, but imposing quadrillion specks on *one* person to save them from torture is acceptable.  
     - *Branch path:* Q1→A, Q2→No, Q3→Yes.  

  3. **Lexical Threshold**  
     - *Definition:* No amount of minor harms (even concentrated) can outweigh a major harm like torture.  
     - *Most awkward commitment:* Even for a single person, a lifetime of quadrillion specks is better than 50 years of torture.  
     - *Branch path:* Q1→A, Q2→No, Q3→No.  

  4. **Sorites View**  
     - *Definition:* There’s a vague range where tiny harms outweigh torture, but no exact flip point.  
     - *Most awkward commitment:* Insisting 3^^^3 specks likely outweigh torture, but denying we can specify *how* or *where* this happens.  
     - *Branch path:* Q1→B, Q5→Vague.  

  5. **Inconsistent Aggregation**  
     - *Definition:* Aggregates interpersonally but not intrapersonally.  
     - *Most awkward commitment:* Quadrillion people each getting a speck outweighs torture, but quadrillion specks for *one* person does not.  
     - *Status:* Likely **incoherent** (no known position defends this).  
     - *Branch path:* Q1→B, Q5→Precise, Q6→No.  

  6. **Prioritarianism**  
     - *Definition:* Harms to the worse-off matter more; concentrated harms are worse than distributed ones.  
     - *Most awkward commitment:* Preferring to harm one person severely rather than two mildly when total harm is equal.  
     - *Branch path:* Q1→B, Q5→Precise, Q6→Yes, Q7→X worse.  

  7. **Anti-Concentration View**  
     - *Definition:* More harm-events are worse even if total disutility is identical.  
     - *Most awkward commitment:* Two 5-day headaches are worse than one 10-day headache.  
     - *Status:* **Unexplored** (rarely defended; may imply deontological "harm-counting").  
     - *Branch path:* Q1→B, Q5→Precise, Q6→Yes, Q7→Y worse.  

  8. **Additive Total Consequentialism**  
     - *Definition:* Harms add up linearly; total disutility determines outcome.  
     - *Most awkward commitment:* The repugnant conclusion (e.g., vast population with barely tolerable lives can be "better" than a small thriving one).  
     - *Branch path:* Q1→B, Q5→Precise, Q6→Yes, Q7→Equal.  

  **Expressivist/Incomparabilist:**  
  - *Note:* If a respondent rejects Q1 as meaningless, they land here (excluded from the tree for simplicity).  

  ---

  ### Notes  
  - **Deontological vs. Lexical:** These are separated cleanly at Q3. If aggregation is rejected interpersonally (Q1→A, Q2→No) but accepted intrapersonally (Q3→Yes), it’s deontological; if rejected in both (Q3→No), it’s lexical.  
  - **Unused Cases:** The tree doesn’t require probabilistic, animal/future-people, or policy cases. However:  
    - *Probabilistic* cases would test ex ante vs. ex post reasoning (e.g., if Q1→B respondents revert to "torture is worse" when specks are probabilistic).  
    - *Animal/future-people* cases would stress whether aggregation applies to non-rational agents or non-existent entities.  
    - *Policy* cases might split rule-consequentialists from act-consequentialists.  
  - **Collapse to Repugnant Conclusion:** Only **Leaf 8 (Additive)** directly leads here. **Leaf 6 (Prioritarianism)** delays it via diminishing returns but doesn’t avoid it at extreme scales.  
  - **Incoherent/Unexplored Combos:**  
    - **Leaf 5 (Inconsistent Aggregation)** is likely incoherent.  
    - **Leaf 7 (Anti-Concentration)** has no clear philosophical defense.  
  - **Perceptibility Threshold:** Q8 allows modifiers for aggregating views (Leaves 6–8). If imperceptible harms don’t count, add "with Perceptibility Threshold" (e.g., "Additive Total Consequentialism with Perceptibility Threshold").  
  - **Vagueness:** **Leaf 4 (Sorites)** explicitly rejects precise flip points.  

  This tree isolates positions via your group’s key cases, with minimal assumptions. Use it to "diagnose" disagreements by tracing diverging branches.
