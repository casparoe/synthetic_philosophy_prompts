  We are constructing a question and model answer for a revision session on the Sleeping Beauty problem with a twist: the probability p of a double-awakening branch when the coin is tails. The setup is as described.

  The question will have three parts:

  (a) Derive Beauty's credence in heads at an awakening as a function of p, for two views: 
     (i) the view that self-locating information is evidentially inert (we'll call this the "halfer-style" view, but without naming it as such in the question),
     (ii) the view that credence should match the proportion of awakenings that are heads-awakenings (the "thirder-style" view). 
     Then check both at p=0 and p=1.

  (b) Discuss what the p=0 case shows about whether the disagreement is substantive or verbal, and what a defender of the second view must concede.

  (c) Connect to action: for each view, what does it imply about a bet offered at every awakening that pays £1 if heads and costs £x if tails? (We'll ask for the range of x for which Beauty should accept the bet.)

  We avoid using the labels "halfer" and "thirder" and focus on the reasoning.

  Now, let's design the question.

  -------

  **Question:**

  Beauty is put to sleep on Sunday. A fair coin, C, is flipped. If C lands heads, she is awakened once on Monday and the experiment ends. If C lands tails, then with probability p (a fixed value in [0,1] known to Beauty) she is awakened twice (on Monday and Tuesday, with amnesia in between) and with probability 1-p she is awakened once (on Monday). On each awakening, she cannot tell the day or whether she has been awakened before. She is asked for her credence that the coin landed heads.

  (a) (10 marks) Let \( Cr_H \) be Beauty's credence in heads at an awakening. Derive \( Cr_H \) as a function of p in each of the following two cases:

  (i) Beauty holds that self-locating information (about which day it is or whether this is the first awakening) is evidentially irrelevant to the coin flip.

  (ii) Beauty holds that her credence in heads should equal the proportion of awakenings in the entire experiment that are heads-awakenings.

  Check each of your expressions at p=0 and p=1, and briefly explain why these values are correct in those cases.

  (b) (5 marks) The case p=0 is particularly instructive. Explain what this case shows about the disagreement between the two views. In particular, does the disagreement persist? What must a defender of view (ii) concede in the light of this case?

  (c) (5 marks) At each awakening, Beauty is offered a bet that pays £1 if the coin landed heads and costs £x if it landed tails. The bet is settled immediately at that awakening (so if the coin is tails and it is the single-awakening branch, she will pay £x only once; if it is the double-awakening branch, she will pay £x on each awakening). For each of the two views in (a), determine the range of x for which Beauty should accept the bet. (Assume Beauty is risk-neutral and seeks to maximize expected money.)

