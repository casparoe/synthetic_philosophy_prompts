  The expected number of awakenings given tails: 2p + 1*(1-p) = 1 + p.

  Therefore, the total expected number of awakenings in the experiment is:
    (1/2)*1 + (1/2)*(1+p) = (1/2) + (1/2)(1+p) = (1/2) + (1/2) + p/2 = 1 + p/2.

