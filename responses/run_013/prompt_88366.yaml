  ### Practice Question: Sleeping Beauty with Variable Awakenings

  **Instructions:** Answer all parts of the question. Show your reasoning clearly. The total marks available are 20. Time allowed: 75 minutes.  

  Beauty is put to sleep on Sunday. A fair coin, \(C\), is flipped. If \(C\) lands heads (\(H\)), Beauty is woken once on Monday, and the experiment ends. If \(C\) lands tails (\(T\)), a randomiser is activated: with probability \(p\) (fixed in \([0,1]\), known to Beauty), Beauty undergoes two awakenings (Monday and Tuesday, with amnesia between); with probability \(1-p\), she undergoes one awakening (Monday). On each awakening, Beauty cannot tell the day, cannot recall prior awakenings, and is asked for her credence that \(C\) landed heads. Beauty knows the entire protocol.  

  1. **Deriving Credence Functions** (10 marks)  
     Let \( Cr_H(p) \) be Beauty’s credence in heads at an awakening, given parameter \(p\). Derive \( Cr_H(p) \) for each of the following views:  
     (i) *Self-locating information is evidentially inert*: The fact that Beauty is awake provides no new evidence about \(C\), as she would be awake regardless of the outcome.  
     (ii) *Credence matches proportion of heads-awakenings*: \( Cr_H(p) \) equals the proportion of all awakenings in the experiment that are heads-awakenings.  
     Explicitly check your expressions for \(p = 0\) and \(p = 1\), explaining why each value is correct.  

  2. **Disagreement at \(p = 0\)** (5 marks)  
     Using your answer to (1), explain what the \(p = 0\) case demonstrates about the disagreement between views (i) and (ii). Is the disagreement substantive or merely verbal? What must a defender of view (ii) concede in light of \(p = 0\)?  

  3. **Betting Behavior** (5 marks)  
     At each awakening, Beauty is offered a bet that pays £1 if \(C = H\) and costs £\(x\) if \(C = T\). The bet is settled immediately (if \(C = T\) and two awakenings occur, she pays £\(x\) at each). Beauty is risk-neutral. For views (i) and (ii) from (1), determine the range of \(x\) for which Beauty should accept the bet.  

  ---

  ### Model Answer  
  **Word count:** ≈600 words  

  #### Part 1: Deriving Credence Functions  
  **(i) Self-locating information is inert** (4 marks)  
  Beauty’s prior credence in \(H\) is \(P(H) = 1/2\) (fair coin). Awakening provides no new evidence because she is always awake when asked:  
  - If \(H\), she is awake on Monday.  
  - If \(T\), she is awake at least once (Monday), regardless of \(p\).  
  Since being awake occurs in all scenarios, it does not update \(P(H)\). Thus:  
  \[
  Cr_H(p) = \frac{1}{2} \quad \forall p.
  \]  
  **Checks:**  
  - At \(p = 0\): \(T\) yields one awakening (Monday), same as \(H\). Two equally likely awakening scenarios (\(H\)-Mon, \(T\)-Mon), so \(Cr_H(0) = 1/2\). Correct.  
  - At \(p = 1\): \(T\) yields two awakenings, but self-locating information (e.g., "Is it Monday or Tuesday?") is irrelevant. Coin remains fair, so \(Cr_H(1) = 1/2\). Correct.  

  **(ii) Credence matches proportion of heads-awakenings** (6 marks)  
  Heads-awakenings: only one (\(H\)-Mon). Total awakenings depend on \(C\) and \(p\):  
  - \(P(H) = 1/2\): 1 awakening (\(H\)-Mon).  
  - \(P(T) = 1/2\): With prob. \(p\), 2 awakenings (\(T\)-Mon, \(T\)-Tue); with prob. \(1-p\), 1 awakening (\(T\)-Mon).  
  The experiment has three possible awakening types:  
  - \(H\)-Mon: probability weight \(1/2\).  
  - \(T\)-Mon: probability weight \(P(T) \times 1 = 1/2\) (occurs in all \(T\) branches).  
  - \(T\)-Tue: probability weight \(P(T) \times p = p/2\) (only if \(T\) and double-awakening).  
  Total probability weight of all awakenings: \(\frac{1}{2} + \frac{1}{2} + \frac{p}{2} = 1 + \frac{p}{2}\).  
  Proportion of heads-awakenings:  
  \[
  Cr_H(p) = \frac{\text{Weight of } H\text{-awakenings}}{\text{Total weight}} = \frac{1/2}{1 + p/2} = \frac{1}{2 + p}.
  \]  
  **Checks:**  
  - At \(p = 0\): Only \(H\)-Mon and \(T\)-Mon occur (each weight \(1/2\)). Total weight = \(1/2 + 1/2 = 1\), so \(Cr_H(0) = (1/2)/1 = 1/2\). Correct (two equally likely awakenings).  
  - At \(p = 1\): Weights: \(H\)-Mon = \(1/2\), \(T\)-Mon = \(1/2\), \(T\)-Tue = \(1/2\). Total = \(1/2 + 1/2 + 1/2 = 3/2\), so \(Cr_H(1) = (1/2)/(3/2) = 1/3\). Correct (three awakenings, one heads).  

  #### Part 2: Disagreement at \(p = 0\) (5 marks)  
  At \(p = 0\), both views yield \(Cr_H(0) = 1/2\). This shows:  
  - **Substantive disagreement**: The views disagree only when \(p > 0\) (e.g., \(p = 1\): \(1/2\) vs. \(1/3\)). Thus, the dispute is not verbal (about definitions) but substantive: it arises from how to handle *multiple awakenings*. View (i) ignores self-locating information, while view (ii) counts awakenings.  
  - **Concession for view (ii)**: Defenders of (ii) must concede that when awakenings are equal (\(p = 0\)), their view aligns with (i). However, they argue that for \(p > 0\), accounting for multiple awakenings is essential, making (ii) correct in those cases.  

  #### Part 3: Betting Behavior (5 marks)  
  Beauty should accept the bet if expected gain \(\geq 0\) at an awakening.  
  - **View (i)**: \(P(H) = 1/2\), \(P(T) = 1/2\).  
    Expected gain: \(\frac{1}{2}(1) + \frac{1}{2}(-x) = \frac{1 - x}{2}\).  
    Accept if \(\frac{1 - x}{2} \geq 0 \Rightarrow x \leq 1\).  
  - **View (ii)**: \(P(H) = \frac{1}{2 + p}\), \(P(T) = 1 - \frac{1}{2 + p} = \frac{1 + p}{2 + p}\).  
    Expected gain: \(\left(\frac{1}{2 + p}\right)(1) + \left(\frac{1 + p}{2 + p}\right)(-x) = \frac{1 - x(1 + p)}{2 + p}\).  
    Accept if \(1 - x(1 + p) \geq 0 \Rightarrow x \leq \frac{1}{1 + p}\).  

  ---

  ### Marking Scheme  
  **Total: 20 marks**  

  #### Part 1: Deriving Credence Functions (10 marks)  
  - **(i) Self-locating information inert (4 marks)**  
    - \(Cr_H(p) = 1/2\) for all \(p\): **2 marks**.  
      *Common mistake: Incorrectly updates credence based on awakening.*  
    - Check at \(p = 0\): Correct value (\(1/2\)) and explanation (two equal awakenings): **1 mark**.  
    - Check at \(p = 1\): Correct value (\(1/2\)) and explanation (self-locating info irrelevant): **1 mark**.  
  - **(ii) Proportion of heads-awakenings (6 marks)**  
    - Identifies awakening types/weights: **1 mark**.  
      *Common mistake: Counts types without weighting (e.g., assumes 3 awakenings for all \(p > 0\)).*  
    - Correct total weight (\(1 + p/2\)): **1 mark**.  
    - Correct ratio (\(1/(2 + p)\): **1 mark**.  
    - Full expression \(Cr_H(p) = 1/(2 + p)\): **1 mark**.  
    - Check at \(p = 0\): Correct value (\(1/2\)) and explanation (two equal awakenings): **1 mark**.  
    - Check at \(p = 1\): Correct value (\(1/3\)) and explanation (three awakenings, one heads): **1 mark**.  

  #### Part 2: Disagreement at \(p = 0\) (5 marks)  
  - Both views give \(Cr_H(0) = 1/2\): **1 mark**.  
  - Disagreement only when \(p > 0\): **1 mark**.  
  - Disagreement is substantive (not verbal): **1 mark**.  
  - Issue is multiple awakenings: **1 mark**.  
  - Defender of (ii) concedes alignment at \(p = 0\) but divergence for \(p > 0\): **1 mark**.  

  #### Part 3: Betting Behavior (5 marks)  
  - **View (i) (2 marks)**  
    - Expected gain \((1 - x)/2\): **1 mark**.  
    - Accept if \(x \leq 1\): **1 mark**.  
  - **View (ii) (3 marks)**  
    - \(P(T) = (1 + p)/(2 + p)\): **1 mark**.  
      *Common mistake: Uses unconditional \(P(T) = 1/2\) without conditioning.*  
    - Expected gain \([1 - x(1 + p)]/(2 + p)\): **1 mark**.  
    - Accept if \(x \leq 1/(1 + p)\): **1 mark**.  

  ---  
  **Self-contained note:** All reasoning derives from the setup. No external sources are needed or assumed.
