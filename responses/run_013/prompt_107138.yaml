prompt: |-
  So I've been reading a lot of Russell on marriage and free love lately, and it's got me trying to pin down what I actually think, because my gut keeps contradicting itself. Here's a run of verdicts, mostly hypothetical, and I want to know what principle gets them, if anything does.

  Two people promise each other exclusivity and both keep to it: fine, obviously. Two people promise each other exclusivity, one has a one-night thing, and tells the other the next week: I think that's genuinely pretty bad, not a technicality. Same thing but the other never finds out and never will: still bad, in my gut. So it isn't just about the lying. Couple agrees to be open, no secrets, both actually fine with it: fine. Couple is open, but one of them only agreed because they were scared of being left and is quietly miserable about it: I think the one who pushed for it is doing something wrong, even though nothing was hidden and no promise was broken. Couple is nominally monogamous, but one has a long-standing thing on the side that they've both tacitly never discussed (the other basically knows): I think this is... fine? Or at least way less bad than the hidden one-night stand, which seems like it shouldn't be true. A couple where one partner is totally financially dependent on the other and the other starts sleeping around, with the dependent one's blessing: something feels off here and I don't think it's about the sex. And the same situation but in a place and time where divorce is impossible and the dependent one would be destitute: I feel pretty much the same as the previous one.

  My hunch is the badness is tracking deception plus some kind of power/dependency thing, and not sex as such. But that hunch makes case 3 (nobody ever finds out) not bad, and case 6 (tacit, half-known) not fine, and both of those go against me. And I can't tell whether the real principle is about broken promises, about some good the relationship has that gets damaged, or about what the other person was reasonable in expecting.

  What I want: one or two candidate principles stated precisely enough that I could apply them to a case I haven't met, which of my verdicts has to be dropped to keep them, and what they predict for a case I didn't list -- say, a couple who both genuinely want the open arrangement but one of them hides it from their family and close friends, who'd be devestated if they knew. Also, be honest about whether the principle ends up on Russell's side or against him, as you read him. I want reflective equilibrium here, not a survey of what other people have said.
reasoning: |-
  Okay, the user is really diving deep into the ethics of relationships, drawing from Russell's ideas on marriage and free love. They've listed several hypothetical scenarios where their gut reactions seem contradictory. The main challenge is to find a consistent principle that explains all these judgments. Let me start by breaking down each case they mentioned.

  First, they think mutual exclusivity kept by both is fine. That makes sense; both parties are upholding their agreement. But when one has a one-night stand and tells the other, it's bad. Even if the other never finds out, it's still bad. So deception alone isn't the issue. Then, an open relationship with full consent is fine, but if one partner is coerced into agreeing due to fear, the pusher is at fault. This points to power dynamics. 

  The tacitly acknowledged affair being "fine" is interesting. Here, there's no deception because both sort of know, even if unspoken. The financially dependent partner blessing infidelity feels off, especially if divorce isn't an option. The user suspects power imbalances here. 

  The user's hunch about deception plus power seems close, but it conflicts with case 3 (never found out) being bad and case 6 (tacit) being okay. So maybe the principle involves relational autonomy. That means both partners should have equal power to negotiate terms without coercion. 

  Looking at case 3: even if undiscovered, the cheater violates autonomy by unilaterally changing terms. In case 6, the tacit understanding might imply consent through lack of objection, preserving autonomy. The dependent partner scenarios highlight how power imbalances undermine real consent. 

  The new scenario with hidden openness from family: the secrecy isn't between partners but outsiders. Since both partners consent internally, it shouldn't violate their relational autonomy. But if one partner feels pressured to hide, that could introduce coercion. 

  Russell would favor relational autonomy as it supports consensual arrangements over rigid norms. The user might need to adjust their view on undiscovered cheating being bad without deception, seeing it as a breach of mutual governance. Also, the tacit affair being acceptable hinges on genuine mutual awareness, not just assumption. 

  In essence, the core principle is equal power to co-determine the relationship's terms. Any deviation without mutual agreement, whether through deceit or coercion, violates this autonomy. This aligns with Russell's advocacy for honesty and voluntary arrangements but emphasizes structural equality more than he might have.
answer: |-
  Based on your cases and your struggle with deception vs. power, I propose this candidate principle:

  **Relational Autonomy Principle:** The ethical status of relationship arrangements depends on whether both partners have substantially equal power to freely negotiate, understand, and consent to the terms governing intimacy and commitment, and whether those terms are upheld without unilateral violation or coercive maintenance.

  **How it explains your verdicts:**

  1.  **Mutual Exclusivity Kept:** Equal power to agree & uphold terms. **Fine.**
  2.  **One-Night Stand & Told:** Unilateral violation of mutually agreed terms, undermining the relationship's jointly governed structure. Power was equal initially, but one partner acted unilaterally. **Bad.**
  3.  **One-Night Stand & Never Found Out:** *Still a unilateral violation of the agreed terms.* The *act itself* breaches the relational contract established by mutual agreement, regardless of discovery. It disregards the partner's right to shared governance of the relationship structure. **Bad** (Explains your gut: it's not *just* lying, it's the violation of the joint project).
  4.  **Open & Consensual:** Equal power to negotiate & agree to terms. Both uphold them. **Fine.**
  5.  **Open & Coerced Consent:** The consent is not free due to fear/power imbalance (fear of abandonment). The "agreement" doesn't reflect genuine mutual understanding or free negotiation. The pushing partner exploits the power imbalance. **The pusher is wrong.**
  6.  **Tacit Non-Monogamy (Both Know):** *No unilateral violation.* The *de facto* terms, though unspoken, are understood and *tacitly consented to* by both through inaction and continued participation. Power appears relatively equal in maintaining this unspoken status quo. **Less Bad/Fine** (Explains why it feels better than a hidden violation - the structure is mutually acknowledged, even if messy).
  7.  **Dependent Partner Blessing Infidelity (Modern):** Power imbalance (financial dependence) likely *coerces* or heavily pressures the "consent." The dependent partner lacks substantive freedom to negotiate or object. The arrangement is maintained through structural inequality. **Off - Wrong.**
  8.  **Dependent Partner Blessing Infidelity (No Divorce):** Same severe power imbalance, making "consent" meaningless due to lack of alternatives. Structural coercion is even more explicit. **Off - Equally Wrong.**

  **Where Your Verdicts Adjust (To Keep the Principle):**

  *   **Case 3 (Never Found Out):** You *must* accept this is bad *because* it's a unilateral violation of the mutually agreed terms, breaching relational autonomy, even without deception/lies. Your gut was right against your initial "deception-only" hunch.
  *   **Case 6 (Tacit):** You *can* accept this as less bad/fine *only if* the tacit understanding constitutes genuine mutual awareness and consent (however awkward). If it's truly just one partner assuming and the other vaguely suspecting but not *truly* accepting, it might be a violation of reasonable expectations (see below). The principle *allows* for this verdict but doesn't strictly *demand* it; it hinges on whether the "tacit" state reflects mutual, uncoerced acceptance.

  **New Case Prediction: Hidden Openness from Family**

  *   **Application:** The *core relationship agreement* (openness) is mutually negotiated and consented to with (presumably) equal power between partners. The secrecy towards family is an *external* agreement/joint strategy.
  *   **Prediction:** This is **Fine** *within the relationship itself*, under the Relational Autonomy Principle. The partners jointly govern their own terms. The harm/risk is to external parties (family) and involves deception *outside* the core relationship dyad.
  *   **Caveat:** If the pressure to hide comes *disproportionately* from one partner, creating stress or coercion *within* the relationship regarding the secrecy itself, *that* could introduce a power imbalance and make the *demand for secrecy* unethical. But the openness agreement itself remains ethical if freely negotiated.

  **Connection to Russell:**

  *   **On Russell's Side:** This principle strongly aligns with Russell's core arguments *against* traditional marriage norms enforced by law/social pressure. He championed relationships based on *genuine, free affection and mutual consent* rather than external obligation or coercion (financial, social, legal). The principle prioritizes freely negotiated terms over imposed ones.
  *   **Against Russell's Blind Spots?** While Russell advocated for honesty and freedom, he sometimes seemed overly optimistic about power dynamics (especially economic ones) vanishing easily. This principle explicitly centers *substantive equality of power* as necessary for true free love. Russell might downplay the persistent coercion possible even within "free" arrangements if power imbalances exist (like Cases 7 & 8). The principle insists that "free love" requires not just the absence of legal bonds, but the presence of relational equity. Russell would likely agree *in theory*, but the principle makes the power analysis more explicit and central than Russell sometimes did in practice.

  **Refinement: The "Reasonable Expectation" Hedge**

  Your question about "what the other person was reasonable in expecting" points to a crucial nuance. We can refine the principle slightly:

  **Refined Relational Autonomy Principle:** ...and whether those terms **(explicitly agreed or reasonably inferred from established patterns and context)** are upheld without unilateral violation or coercive maintenance.

  *   **Explains Case 6 Better:** The "tacit" situation is only ethical *if* the non-monogamous pattern is sufficiently established and visible that the partner's continued participation *reasonably* implies consent. If the affair is actively hidden despite suspicion, and the suspecting partner has never indicated acceptance (even non-verbally), then it *might* violate a reasonable expectation of exclusivity implied by the "nominally monogamous" label, making it worse. This refines why it feels messy.
  *   **Explains Case 3 Clearly:** Reasonable expectation = exclusivity based on explicit promise. Violation is clear.

  **Conclusion:**

  The **Relational Autonomy Principle**, especially refined with **Reasonable Expectations**, best captures your intuitions. It explains why deception isn't the *only* wrong (Case 3) and why broken promises matter (Case 2), but crucially highlights why power imbalances make consent hollow (Cases 5, 7, 8) and why some messy-but-acknowledged arrangements feel less bad (Case 6). It moves beyond sex to the fundamental structure of power, consent, and joint governance within the relationship. This puts you firmly *within* Russell's *spirit* of prioritizing freedom and consent over rigid norms, but with a sharper, more critical lens on the *conditions* necessary for that freedom and consent to be real, addressing potential weaknesses in Russell's application. To keep it consistent, you must accept that undiscovered cheating violates relational autonomy itself (Case 3 is bad) and that "tacit" arrangements are only acceptable if they genuinely reflect mutual understanding.
