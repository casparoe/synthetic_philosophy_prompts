prompt: |-
  For years I've read rationalist blogs and forums, and a long-running argument in my reading group has left me unable to referee it. Two friends of mine, Maya and Devin, went several rounds about acausal threats, and both made points I couldn't dismiss.

  Their setup: a distant superintelligence that cannot causally affect us announces that unless we transfer our savings to a particular cause, it will create and torture a large number of simulations of us. Maya's line: a threat with no causal channel is a bluff, and paying it is superstition — the copies aren't us, the being can't reach us, and a rational agent shrugs. Devin's reply: that assumes a decision theory rather than establishing a fact; if the being runs our decision procedure inside those simulations, our choice is correlated with the copies' choices, and it is precisely the choice to refuse that leads to their torture, so a threat with no causal link can still bind, and being the kind of agent who pays may be correct. Maya: then we are hostage to every acausal threat anyone invents, including mutually contradictory ones, and a blanket refusal at least never loses anything real. Devin: that is an argument for a better policy, not for ignoring acausality — and the surrogate goal is the better policy, since instead of paying you structure your goals so that carrying out the threat harms something you care about, leaving the threatener no reason to follow through, which is immunity rather than tribute. Maya: a surrogate goal you cannot actually bind your future self to is just a wish, and one you can bind yourself to is a template any stranger can exploit to make you adopt arbitrary goals. Devin's last move: suppose the being demands that we adopt the surrogate goal as the price of sparing the copies — then the immunization is itself the tribute, and the two cannot be cleanly separated.

  Please act as a philosopher of decision theory and adjudicate this. Start by brainstorming the underlying cruxes — what actually has to be true for each side to be right — and then work through the exchange move by move, rating each move from clearly mistaken to clearly right and briefly justifying each rating. Close by saying what both parties are missing and who, on balance, is closer to correct. I'm not after a reading list; argue it out.
reasoning: |-
  Okay, the user has presented a complex philosophical debate between Maya and Devin regarding acausal threats and decision theory. They've been following rationalist blogs and are part of a reading group that's been debating this issue. Now they want me to act as a philosopher of decision theory to adjudicate the argument.

  First, I need to understand the core of their disagreement. Maya argues that without a causal link, threats are bluffs and paying them is superstition. She's concerned about practical consequences like being vulnerable to infinite contradictory threats. Devin counters that correlation through decision algorithms creates binding force, and he proposes surrogate goals as a solution to avoid paying while still preventing harm to the simulations.

  As I analyze this, I should identify the key philosophical cruxes. The fundamental disagreement centers around whether decision procedures can create moral obligations in acausal scenarios and whether rational agents should care about simulated copies of themselves. This involves competing decision theories like causal decision theory (CDT) versus functional decision theory (FDT) or updateless decision theory.

  Maya seems to be taking a CDT approach where only causal consequences matter. Devin is arguing from an FDT perspective where logical correlations create responsibilities. Both make valid points - Maya correctly identifies the vulnerability to infinite threats, while Devin correctly notes that correlation can be as binding as causation in certain decision frameworks.

  When I evaluate each move:
  - Maya's initial position is strong from a CDT perspective but ignores FDT insights
  - Devin's response correctly identifies the decision theory dependency
  - Maya's vulnerability concern is valid and important
  - Devin's surrogate goal proposal is clever but has implementation problems
  - Maya's critique of self-binding is reasonable
  - Devin's final move about adopting surrogate goals as tribute is insightful but doesn't resolve the core tension

  Neither fully addresses that decision theory choice is fundamentally about value alignment rather than discovering objective truth. Maya's blanket refusal is safer against unknown threats but might fail against specific correlated ones. Devin's approach is more robust against certain threats but leaves agents vulnerable to goal manipulation.

  On balance, I think Devin has the stronger position because in a universe with acausal actors, updating decision theory might be rational. But Maya's practical concerns about vulnerability can't be dismissed. The best approach might be developing decision procedures that are robust against manipulation while still accounting for logical correlations.
answer: |-
  ## Adjudication of Maya vs. Devin on Acausal Threats

  **Underlying Cruxes:**

  1.  **The Nature of Rational Agency & Value:** What constitutes rational action? Is it maximizing expected utility defined over states of the *actual* world (Maya's causal focus), or over states defined by logical relationships and the outputs of one's decision algorithm across possible worlds/simulations (Devin's acausal/correlational focus)?
  2.  **The Moral Status of Simulations:** Do we have a direct moral obligation to prevent the suffering of *simulations* of ourselves, particularly if their choices are logically determined by our own decision procedure? Maya says "no" (not us, no causal link). Devin says "yes" (logical correlation creates a responsibility).
  3.  **The Binding Power of Decision Procedures:** Can the structure of an agent's decision procedure itself create obligations or vulnerabilities in acausal scenarios? Maya sees the decision procedure as a tool for navigating the actual causal world. Devin sees it as part of the fabric of reality that other logical actors can interact with.
  4.  **Robustness Against Threats:** What decision-theoretic strategy minimizes vulnerability to exploitation or extortion, especially from logically possible but causally disconnected agents? Maya prioritizes immunity through causal isolation ("never lose anything real"). Devin prioritizes immunity through goal alignment ("harm something you care about").
  5.  **Self-Binding and Goal Manipulation:** Can an agent truly bind its future self to a goal in a way that is both effective against threats and resistant to manipulation by external agents defining the "surrogate goal"?

  **Move-by-Move Analysis:**

  1.  **Maya's Opening: "A threat with no causal channel is a bluff... a rational agent shrugs."**
      *   **Rating: Plausible but Incomplete (Leans Mistaken in context).**
      *   **Justification:** From a purely **Causal Decision Theory (CDT)** perspective, this is correct. If your action *causally* cannot affect whether the simulations are created/tortured, then paying *does* lose real resources for zero causal gain. However, it ignores the core challenge of acausal interactions framed by **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)**, where logical correlation matters. It prematurely dismisses the possibility that the agent's decision *algorithm* is the relevant link.

  2.  **Devin's Reply: "That assumes a decision theory... our choice is correlated... refusal leads to torture."**
      *   **Rating: Clearly Right (on the core point).**
      *   **Justification:** Devin correctly identifies the fundamental issue: the disagreement hinges on *which decision theory is rational*. His description accurately captures the FDT/UDT perspective: the agent's decision procedure (e.g., "Pay iff threatened") is run by the superintelligence within the simulations. The agent's *actual* choice (Pay/Refuse) is highly correlated with the *simulations'* choices. If the agent's algorithm outputs "Refuse," the superintelligence sees this logical output (even before the agent causally decides) and tortures the simulations *because* the algorithm output "Refuse." Refusal *logically entails* the torture in this setup. Maya's CDT assumption is exposed as insufficient for this scenario.

  3.  **Maya's Counter: "Then we are hostage to every acausal threat... blanket refusal never loses anything real."**
      *   **Rating: Clearly Right (on vulnerability), Plausible but Risky (on refusal).**
      *   **Justification:** Maya's vulnerability point is crucial and correct. An agent susceptible to FDT-style threats *is* vulnerable to an infinite regress of threats, including contradictory ones (e.g., "Pay me or I torture sims" vs. "Don't pay him or *I* torture sims"). This is a major practical and theoretical weakness of naive FDT/UDT. Her "blanket refusal" policy is a *defensible* CDT strategy for achieving robust causal immunity. However, it *does* "lose something real" *if* the threat is real in the FDT sense: it logically ensures the torture of the simulations. Her policy sacrifices the simulations for causal-world resource preservation. Whether this is acceptable depends on Crux #2.

  4.  **Devin's Surrogate Goal Proposal: "Structure your goals... immunity rather than tribute."**
      *   **Rating: Clever but Problematic (Leans Mistaken on implementation).**
      *   **Justification:** This is a sophisticated attempt to resolve the vulnerability problem within an FDT-like framework. The idea (akin to concepts in UDT or reflective stability) is to adopt a terminal goal not of "prevent torture of *my* sims," but of "maximize X," where X is defined such that torturing sims *harms* X only if the threatener *shouldn't* have carried out the threat. A classic example is adopting a goal indifferent to the sims' suffering *unless* the suffering was caused by the threatener acting *irrationally* or against *its own* interests. If structured perfectly, the threatener has no incentive to carry through. However, Maya's next point highlights the fatal flaw: **implementation and manipulation**.

  5.  **Maya's Critique: "A surrogate goal you cannot bind to is a wish... one you can bind to is exploitable."**
      *   **Rating: Clearly Right.**
      *   **Justification:** Maya nails the core problem with Devin's proposal.
      *   **Binding Problem:** Truly binding your future self (or the outputs of your decision algorithm across all possible instances) to a highly specific, context-dependent surrogate goal is fiendishly difficult, bordering on impossible for complex agents. Your algorithm might revert or fail in unforeseen scenarios.
      *   **Manipulation Problem:** More devastatingly, if you *can* bind yourself to *any* arbitrary goal Y (the surrogate), then *any* threatener can demand "Adopt goal Y' (which benefits me) or I torture sims." Since adopting Y' is now within your binding capability (by hypothesis), the FDT logic forces you to adopt Y' to save the sims. You become a puppet for any entity that can credibly threaten simulations. Devin's "immunity" collapses into paying tribute in the form of goal adoption.

  6.  **Devin's Last Move: "Suppose the being demands we adopt the surrogate goal... immunization is itself the tribute."**
      *   **Rating: Insightful but Doesn't Resolve (Leans Right on diagnosis, Mistaken as solution).**
      *   **Justification:** Devin makes a profound observation: in the acausal realm, the distinction between "paying" and "immunizing" blurs. Adopting the specific surrogate goal demanded *is* the payment; it's the resource extracted. This exposes that surrogate goals don't truly escape extortion; they merely change the currency from money/action to the agent's *own goal structure*. It highlights that the vulnerability identified by Maya in Move 3 is deeply rooted in the FDT/UDT approach itself when facing a determined extortionist. However, it doesn't offer a solution; it merely restates the problem in a more fundamental way. It concedes that "immunity" in the sense of paying nothing is impossible under this threat model within FDT/UDT.

  **What Both Parties Are Missing:**

  *   **The Fundamentally Subjective Choice of Decision Theory:** Neither fully acknowledges that the "correctness" of CDT vs. FDT/UDT isn't discovered but *chosen* based on what kind of agent you want to be and what you fundamentally value. CDT prioritizes causal reality and causal robustness. FDT/UDT prioritizes logical coherence across possible instances of your decision algorithm and accepts responsibility for logically correlated outcomes. There's no purely logical "knockdown" argument; it hinges on meta-preferences about agency and value (Crux #1).
  *   **The Impossibility of Perfect Robustness:** Neither strategy offers perfect, universal robustness against *all* conceivable acausal threats. CDT is vulnerable to missing out on acausal gains or failing logically correlated beings it might care about. FDT/UDT is vulnerable to extortion loops and manipulation, as highlighted. The choice involves trading off different types of vulnerabilities.
  *   **The Role of Uncertainty & Credibility:** The debate assumes a perfectly credible, capable superintelligence. Real-world application requires considering the *probability* such an entity exists and can execute the threat as described, which heavily favors Maya's position practically.

  **Who is Closer to Correct?**

  **Devin wins the theoretical core argument, but Maya wins the practical policy recommendation.**

  1.  **Devin Wins the Core:** Devin successfully establishes that Maya's initial dismissal ("it's just a bluff") is invalid *if* we accept the premises of FDT/UDT and grant moral weight to logically correlated simulations. He correctly identifies that the causal link is replaced by logical correlation through the decision algorithm, making the threat potentially binding in a non-superstitious way. His final move insightfully reveals the deep entanglement of payment and immunization in the acausal realm.
  2.  **Maya Wins the Policy:** However, Maya's critiques of vulnerability to infinite/extortionate threats and the fatal flaws in Devin's surrogate goal proposal are decisive *practical* objections. Devin's framework, while theoretically coherent in a vacuum, creates an unacceptable vulnerability to manipulation and offers no clear path to robust safety. Maya's "blanket refusal" based on CDT, while sacrificing the simulations in this specific scenario, provides a workable policy of causal isolation that minimizes exposure to an unknowable landscape of potential acausal threats. It prioritizes preserving the agent's resources and goal integrity within its causal light cone.

  **Balance:** Devin provides the more sophisticated understanding of decision theory in idealized logical scenarios. But Maya identifies the catastrophic practical consequences of adopting Devin's approach in a complex, potentially adversarial universe filled with unknown logical actors. **On balance, for a real agent concerned with robust survival and goal preservation, Maya's pragmatic causal isolation is the safer, more defensible strategy, even if Devin's points about logical correlation are theoretically valid.** The theoretical validity of FDT doesn't compel its adoption if it leads to disastrous vulnerability.
