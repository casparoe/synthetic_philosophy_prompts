prompt: |-
  I'm a features writer who covers art, museums, and the ideas that get attached to them, and for the past year I've been reporting on a small regional museum where my closest friend from college is the director. The museum's centerpiece — a carved wooden figure a little under a metre tall, its face polished shiny by a century of handling — is the town's emblem, reproduced on the municipal seal; newborns are carried past it in a spring ceremony; the institution's whole claim to seriousness rests on it. Two years ago a visiting conservator noticed tool marks that didn't fit the catalogue date, and the board has been sitting on the results while it argues. The figure is not medieval. The medieval original burned in a parish fire in 1893, and a local carver rebuilt it from the charred remains and a single surviving photograph. Three things complicate the story further. First, some of the original is still in there: a hand, a shoulder, part of the base. Second, the carver departed from the photograph, so what we have is less a copy than an interpretation. Third, the photograph shows the medieval figure was frankly cruder, and everyone who has been told prefers what we have. There's also a timing detail the board keeps tripping over: the cult around the figure — the processions, the seal, the spring ceremony — only dates from the 1880s, so the object that people have actually venerated for a century and a quarter is the 1893 replacement, while the medieval original was the focus of all that devotion for barely a decade before it burned.

  My friend has to decide within the month what the wall label says and whether to call a press conference, and the board has split into two camps that mostly shout past each other: one says the object has been exposed as a fake and has to be demoted in how the collection presents itself, the other says nothing that mattered has changed and that disclosure will only wound the town. I'd like to hand her something better than my own instinct. Could you sort out what is actually at stake — the distinct kinds of value the figure might carry (how it looks; its place in art history; the fact of having been made by a particular hand at a particular moment; the work it does in the life of the town; whatever else belongs on the list) — and then say which of those the discovery genuinely touches and which it leaves alone? A colleague in the art history department keeps insisting that a museum always owns an object and only sometimes a work, and that the two come with different values; another says the whole quarrel is confused because the value in question is relational — things matter because of the role they play in a practice — and that this is not a lesser or consolation-prize kind of value. I don't know whether either distinction survives contact with this case, and I'd rather you tell me than guess.

  Specifically, I want to know whether there is a principled case that the figure's value is unchanged, or even greater, now that we know its history; what would have to be true about the value of originals for the first camp to be right that it must be demoted; and whether it matters that the carver invented rather than faithfully copied — that is, whether the case is really about age, about authorship, about continuity of material, or about something else entirely. If the answer turns on distinctions that don't survive this particular object — between a copy and a forgery, between the material and the form, between the maker's achievement and the thing's beauty — say where the case lands and why. Finish with a recommendation she can act on, including the substance of what the label ought to say, and mark clearly the points where you're genuinely uncertain rather than retreating into saying the question can't be answered.
reasoning: |-
  Okay, the user is a features writer covering art and museums, and they're deeply involved in a sensitive situation at a small regional museum run by their close friend. The museum's centerpiece wooden figure, central to the town's identity, has been revealed as a 1893 reconstruction, not the medieval original everyone believed it to be. The board is divided, and the director needs to decide how to handle the disclosure and relabeling. 

  First, I need to unpack the layers of this discovery. The figure has physical continuity (parts of the original survive), interpretive authorship (the carver took creative liberties), and aesthetic superiority (most prefer it to the cruder medieval version). The timing detail is crucial—the town's veneration practices began in the 1880s, meaning the community has actually cherished the reconstruction for over a century. 

  The user's colleagues raise philosophical distinctions: object vs. work, intrinsic vs. relational value. But this case blurs those lines. The figure's value isn't just about material authenticity; it's woven into community rituals and identity. Demoting it as a "fake" would misunderstand what made it precious to the town. 

  The user wants clarity on what's truly at stake. Let me map the value dimensions: material authenticity (partially intact), aesthetic quality (enhanced), historical significance (as a record of 19th-century folk practices), communal meaning (unchanged), and the story itself (newly revealed). The discovery only diminishes the first dimension—and even there, not entirely. 

  As for the board's factions: the "demotion" camp wrongly assumes authenticity is the sole source of value, while the "nothing changed" camp overlooks how truth amplifies meaning. The carver's inventiveness actually strengthens the case for the figure's uniqueness—it's a creative response to loss, not a slavish copy. 

  The recommendation must balance honesty and care. The label should celebrate the figure as a "1893 communal response to loss," highlighting the carver's creative choices and the town's enduring relationship with it. No press conference—let the story unfold organically through exhibits. The real risk isn't lost value; it's mishandling the revelation. 

  Uncertainties linger: How attached is the town to the medieval narrative? Could the board's panic become self-fulfilling? But the core truth holds: this object's worth was always relational. The label must honor that.
answer: |-
  Here's a principled breakdown of the stakes, the impact of the discovery, and a clear path forward for your friend:

  ### What is Actually at Stake? Distinguishing Types of Value
  1.  **Material Authenticity/Age Value:** The physical substance, its age, and direct connection to a specific historical moment/maker.
  2.  **Aesthetic/Formal Value:** The object's beauty, skill of execution, visual impact, and emotional resonance.
  3.  **Art-Historical Value:** Its significance within the trajectory of artistic styles, techniques, or movements. Its role as evidence.
  4.  **Provenance/Cultic Value:** Its documented history, ownership, and especially its role within specific communal rituals and beliefs over time.
  5.  **Symbolic/Communal Value:** Its meaning and function as an emblem of identity, continuity, and shared belief for the town – independent of its material origins.
  6.  **Narrative/Integrity Value:** The museum's commitment to truthful representation and scholarly accuracy about the object's history.

  ### What the Discovery Changes (and What It Doesn't)
  *   **Material Authenticity/Age Value:** **Significantly Diminished, but Not Entirely Lost.** The core claim of being a medieval artifact is disproven. However, the presence of original charred fragments (hand, shoulder, base) retains a tangible, albeit partial, physical link to the pre-1893 object and the fire event. Its primary material value is now firmly 19th-century.
  *   **Aesthetic/Formal Value:** **Utterly Unchanged.** The visual qualities people admire – the polish, the form, the specific "interpretation" – remain. The discovery doesn't make it *look* different. The preference for the 1893 version over the cruder medieval original underscores that aesthetic value was never solely dependent on age.
  *   **Art-Historical Value:** **Radically Shifted, Not Necessarily Diminished.** Its value as an example of *medieval* carving is gone. However, its value as an example of **late 19th-century folk art/vernacular interpretation**, a response to loss, community craftsmanship, and the evolution of local tradition **is significantly enhanced**. It becomes a fascinating document of cultural continuity *through* adaptation.
  *   **Provenance/Cultic Value:** **Clarified and Strengthened.** The critical timing detail is key: **The venerated object is the 1893 figure.** The communal practices (processions, seal, ceremony) began *just before* the fire and have been directed at the reconstruction for 125 years. This devotion is undeniably tied to *this specific object*, not the lost medieval one. The discovery confirms that the town's love and ritual focus have always been on the 1893 creation. This value is profoundly intact.
  *   **Symbolic/Communal Value:** **Fundamentally Unchanged.** The figure functions as the town's emblem *because of the meaning and history projected onto it over the last 125 years*, not because of its (now disproven) medieval origins. Its power as a symbol of identity and continuity is rooted in shared experience and ritual performance centered *on this very object*.
  *   **Narrative/Integrity Value:** **Demands Action.** This is where the discovery has the most profound impact *for the museum*. Failing to disclose the truth undermines the museum's core mission and trustworthiness.

  ### Evaluating the Board Camps & Philosophical Distinctions
  *   **"Demotion" Camp (It's a Fake):** This view **only holds water if Material Authenticity/Age Value is considered the *sole* or *primary* source of worth.** It ignores Aesthetic, Provenance/Cultic, Symbolic, and shifted Art-Historical value. It misapplies "fake" or "forgery" – terms implying *intent to deceive for gain*. The 1893 carver was repairing/replacing a lost community treasure, not forging a medieval artwork for profit. Demoting the object based solely on the disproven age claim disregards its authentic 125-year history *as the focus of veneration*.
  *   **"Nothing Changed" Camp (No Disclosure):** This correctly identifies the intact Aesthetic, Provenance/Cultic, and Symbolic values but **fatally underestimates the Narrative/Integrity Value** and the *enhanced* Art-Historical value of the true story. Suppressing the truth is a profound betrayal of the museum's role and will inevitably cause greater harm if revealed later.
  *   **Object vs. Work:** The "object" is the physical wooden figure (1893, with medieval fragments). The "work" is the *meaning* invested in it – its role as town emblem, ritual focus, symbol of continuity. The museum absolutely "owns" the object and its true history. It also has stewardship over the "work" – the communal meaning – and must handle that truthfully. The distinction survives: the *object's* history changed, but the *work* (its function/meaning for the town) remains largely constant. Disclosure is about respecting both.
  *   **Relational Value:** Your colleague is profoundly right. The figure's most potent value *for the town* is relational – its role in their practices and identity over 125 years. This is **not a lesser value**; it's arguably the *primary* value in this specific context. The discovery clarifies *which object* this relationship is with (the 1893 one), strengthening rather than negating this relational value.

  ### Where Distinctions Blur (and Why it Doesn't Matter Here)
  *   **Copy vs. Forgery:** Blurs because the intent wasn't deceit for gain, but communal restoration. It's arguably neither a pure copy (it interprets, uses original fragments) nor a forgery. But the *purpose* matters more than the precise label. It was always a 19th-century replacement *for local use*, not a medieval artifact.
  *   **Material vs. Form:** Blurs because the form was changed (interpreted) *and* original material was incorporated. The value is now a complex hybrid of the 1893 form/material and the embedded medieval fragments.
  *   **Maker's Achievement vs. Beauty:** Blurs because the carver's achievement *created* the beauty people now prefer. The aesthetic value is directly tied to the 19th-century maker's skill and choices.

  **The core issue is not solely age, authorship, or material continuity, but the *nature of authenticity in a living tradition*.** The figure's authenticity for the town lies in its uninterrupted role as the focal point of their rituals and identity for 125 years. Its material history is a fascinating *addition* to that story, not a negation of it. The value *has* changed – it's richer, more complex, and more honestly grounded.

  ### Recommendation for Your Friend (& The Label)

  1.  **Embrace the Truth:** Disclose fully, clearly, and confidently. This is an opportunity, not a disaster.
  2.  **No Press Conference (Yet):** Start with integrating the story into the exhibit. A press conference risks sensationalizing "fake" or "scandal." Let the new narrative speak for itself within the museum first. Brief local leaders sensitively beforehand. A low-key local media briefing *after* the new display is up might be appropriate.
  3.  **Reframe the Narrative:** Position the figure as a powerful symbol of **resilience, continuity, and community spirit**. It represents the town's response to loss in 1893 and its enduring identity over the subsequent 125 years. Its hybrid nature (medieval fragments + 1893 creation) is a unique strength.
  4.  **The Wall Label (Substance):**
      *   **Headline:** "The [Town Name] Figure: A Story of Resilience and Continuity (1893)"
      *   **Body:** "For over a century, this figure has been the heart of [Town Name], central to our processions, emblem, and Spring Blessing ceremony. Recent conservation research reveals a deeper history: the original medieval figure was tragically lost in the parish fire of 1893. Using charred fragments that survive within this figure and a single photograph, a local craftsperson created this new interpretation that very year. While departing from the original's form, the carver's skill created the beloved object we know today. The devotion of [Town Name] has focused on *this* figure for 125 years, making it a profound symbol of our community's enduring spirit and its ability to rebuild and carry forward tradition."
      *   **Include:** A small reproduction of the 1893 photo (labeled "The Lost Medieval Original, c. [Date if known], Photographed before 1893") next to the label to show the carver's interpretive choices.
  5.  **Exhibit Enhancement:** Complement the label with a small display:
      *   A panel briefly explaining the conservation discovery (tool marks vs. expected date).
      *   A panel on the 1893 fire and the carver (if known, even just "a local craftsperson").
      *   Emphasize the *continuity* of the rituals *around* the object starting in the 1880s and continuing uninterrupted with the 1893 figure.

  **Acting on Principle:** The principled case is that the figure's **relational, symbolic, and aesthetic values are intact and validated by the truth**, while its **art-historical value is transformed into something equally significant** (19thC community response), and the museum's **integrity value is upheld**. Suppressing the truth would *actually* diminish the museum's value and potentially damage the town's trust far more than the revelation ever could. This story makes the object, and the town's relationship with it, *more* remarkable.

  **Points of Genuine Uncertainty:**
  1.  **Town Reaction:** While the *principled* case for unchanged core value is strong, the *emotional* reaction of some townspeople is unpredictable. Some may initially feel a sense of loss for the medieval narrative, even if their actual veneration was always directed at the 1893 object. Careful, respectful communication is crucial.
  2.  **Carver's Intent (Precise Knowledge):** We can't know definitively *why* the carver interpreted rather than copied strictly. Was it artistic choice, damage obscuring details, or a deliberate "improvement"? The label should stick to the observable fact ("departing from the original’s form") rather than impute specific motives without evidence.
  3.  **Long-Term Shift in Perception:** Will emphasizing its 19th-century origins *eventually* alter how some people perceive its symbolic weight, even slightly? It might, but honesty fosters a more durable, mature relationship with the object.

  The discovery touches the *story* profoundly and demands truthful telling. It leaves the *meaning forged by the community over 125 years* fundamentally intact. Your friend's task is to honor both.
