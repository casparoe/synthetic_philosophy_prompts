  Hmm, the user is writing a chapter on the heterogeneity problem for hedonism and wants a clear standard of adequacy for theories of pleasure. They need a rigorous framework to evaluate whether pleasure can serve as a unified foundation for welfare.

  First, let's unpack what they're asking for. They want explicit criteria that any theory of pleasure must meet to be viable for hedonism. The examples they provided—bodily pleasures vs. objectless ones, intentional pleasures vs. mere sensations, etc.—highlight the diversity that creates the heterogeneity problem. They also emphasize practical requirements like comparability across species and over time.

  The user seems deeply familiar with philosophical debates but wants to systematize the evaluation process. Their unspoken need might be for a structured way to demonstrate why heterogeneity is fatal to hedonism—or alternatively, to identify if any theory can surmount it. The demand to flag incompatible criteria suggests they suspect irreconcilable tensions.

  Key pressure points from their list:
  - Located vs. non-located pleasures (e.g., bath warmth vs. satisfaction)
  - Intentional vs. non-intentional (relief vs. sensory thrills)
  - Unwanted pleasures/desires without pleasure (challenges desire-based theories)
  - Non-propositional creatures (fish/insects—rules out high-cognition accounts)
  - Mixed states (pleasure-pain simultaneity)
  - Pleasure in false/bad things (hedonic recalcitrance)
  - Cross-species/time comparability (practical necessity for welfare calculus)

  Additional considerations they might have missed:
  - Phenomenal unity: Do all pleasures share a "feel"? (Motivated by sensory theories' appeal)
  - Temporal dynamics: How do anticipation, intensity decay factor in?
  - Neural correlates: Should a theory align with neuroscience? (But this may be non-essential)

  Now, structuring the response:
  1. Tabulate each requirement with: (a) Motivating case, (b) Why it's non-arbitrary, (c) Non-negotiable status.
  2. Highlight incompatibilities—especially between sensory quality (needs phenomenal unity) and intentionality (requires cognitive appraisal). Sensory accounts fail non-propositional creatures; desire accounts fail unwanted pleasures.
  3. Identify the most exclusionary requirement: Comparability. It demands a common currency, which heterogeneity directly undermines. If pleasures lack a unified property, weighing them becomes arbitrary.
  4. Conclude that the core tension—phenomenal homogeneity vs. functional diversity—is the heterogeneity problem itself. Pluralist solutions avoid it but sacrifice hedonism's simplicity.

  The user cares most about which requirements conflict. The critical fault line is between phenomenology (sensory theories need a shared feel) and intentionality/function (which fragment pleasure into context-dependent types). Comparability exacerbates this by demanding that fragmented types be quantified uniformly.
answer: |-
  Below is a comprehensive standard of adequacy for a theory of pleasure in the context of hedonistic welfare. I structure it as a table for clarity, followed by analysis of incompatibilities and the most exclusionary requirement. The criteria are grounded in core challenges for hedonism, with each requirement motivated by cases that expose theoretical vulnerabilities. "Non-negotiable" status denotes a failure here likely invalidates hedonism; "preference" indicates a desideratum that might be relaxed at significant cost.

  ### Standard of Adequacy for a Theory of Pleasure
  | **Requirement** | **Motivating Case(s)** | **Why Genuine Requirement (Non-arbitrary)** | **Non-negotiable?** |
  |-----------------|------------------------|--------------------------------------------|---------------------|
  | **1. Bodily vs. Non-Bodily Location**<br>Must accommodate pleasures with clear somatic locations (e.g., warmth of a bath) and those lacking locations (e.g., satisfaction from finishing a proof). | Sensory pleasure (bath) vs. cognitive pleasure (proof). Denying either intuition ignores introspective reports. | A theory collapsing this distinction cannot explain why some pleasures *feel* localized (e.g., tingling) while others feel "global" (e.g., contentment). Rejects implausible phenomenology. | Non-negotiable |
  | **2. Intentionality**<br>Must distinguish object-directed pleasures (e.g., relief at a biopsy result) from non-intentional sensory states (e.g., the taste of chocolate). | Relief (object: health) vs. gustatory delight (no object, just sensation). | Intentional pleasures involve *aboutness* (e.g., taking joy *in* an event). Ignoring this conflates qualitatively distinct states and misrepresents human psychology. | Non-negotiable |
  | **3. Unwanted Pleasures & Desire Without Pleasure**<br>Must explain pleasures that occur despite aversion (e.g., addict's unwanted drug high) and fulfilled desires that yield no pleasure (e.g., anticipated joy of achievement that feels hollow). | Addict’s high (unwanted) vs. "hedonic disappointment" (desire satisfied without pleasure). | Shows pleasure and desire are dissociable. A theory equating them fails empirical tests (e.g., neuroscience of addiction, psychological studies on reward prediction errors). | Non-negotiable |
  | **4. Non-Propositional Creatures**<br>Must apply to beings without beliefs/desires (e.g., fish, insects). | A dog chasing a ball; a fish navigating currents. | Hedonism often extends to non-human welfare. If pleasure requires complex cognition, it excludes animals/simpler minds, undermining hedonism's scope. Must avoid anthropocentrism. | Non-negotiable |
  | **5. Simultaneous Pleasure-Pain**<br>Must account for states blending positivity and negativity (e.g., bittersweet nostalgia, "painful" joy). | Runner’s high (euphoria + muscle burn); grief with fond memories. | Introspection and clinical reports confirm mixed states exist. A theory denying their possibility is phenomenologically inaccurate. | Non-negotiable |
  | **6. Pleasure in False/Bad Objects**<br>Must explain pleasure taken in illusions (e.g., joy from a false belief) or morally repugnant acts (e.g., a sadist's enjoyment). | Schadenfreude (pleasure in others' misfortune); delusional happiness (e.g., manic episode). | Welfare shouldn’t depend on truth/morality for hedonism. If pleasure requires "correct" objects, it collapses into non-hedonic theories (e.g., desire-satisfaction with normative constraints). | Non-negotiable |
  | **7. Comparability**<br>Must provide a common metric for intensity/duration across types (e.g., weighing a fish’s pleasure against a human’s, or one brief intense joy against years of mild contentment). | Choosing policies affecting humans/animals; personal life tradeoffs (e.g., career vs. leisure). | Without comparability, hedonism cannot guide decisions—its core practical purpose. "Incommensurable pleasures" make welfare aggregation impossible. | Non-negotiable |
  | **8. Phenomenal Unity (Added)**<br>Must identify a positive experiential quality shared by all pleasures (e.g., "feel-good" character), without which "pleasure" is merely a label. | Contrast: warmth of bath (sensory) vs. masochist’s pleasure (pain-linked). Why call both "pleasure"? | Hedonism loses intuitive force if pleasure isn’t a unified experiential ground for welfare. Otherwise, it risks circularity ("welfare is whatever we call pleasure"). | Non-negotiable |
  | **9. Motivation (Added)**<br>Must explain pleasure’s link to motivation (e.g., seeking warmth when cold) without reducing pleasure to motivation. | Addict seeking a high; curiosity driving learning. | Pleasure typically motivates, but unwanted pleasures show it’s not necessary. A theory ignoring motivation cannot explain behavior central to welfare (e.g., pursuit of pleasure). | Preference |

  ---

  ### **Incompatibilities and the Most Exclusionary Requirement**
  **Core Incompatibility:** The requirements for **Phenomenal Unity (8)** and **Intentionality (2)** cannot be jointly satisfied.  
  - **Why**: Phenomenal unity demands a single, felt quality (e.g., a "hedonic tone") common to all pleasures. But intentional pleasures (e.g., relief) are inherently relational—their character depends on their object—while sensory pleasures (e.g., taste) are intrinsic. A unified phenomenology would erase the object-directedness of relief or schadenfreude, making them indistinguishable from brute sensations. Conversely, prioritizing intentionality fractures pleasure into object-specific types with no shared qualitative core.  
  - **Outcome**: This *is* the heterogeneity problem itself. If no theory reconciles these, pleasure lacks a unified essence, rendering hedonism either false (no common welfare-grounding property) or empty ("pleasure" is a gerrymandered category).

  **Most Exclusionary Requirement**: **Comparability (7)**.  
  - **Why it excludes the most theories**:  
    - **Sensory-Quality Accounts** (e.g., pleasure as "sweetness-like" feelings): Fail non-propositional creatures (Requirement 4) and intentional pleasures (2). How compare a dog’s sensory joy to human intellectual satisfaction?  
    - **Attitudinal Accounts** (e.g., pleasure as "taking delight in"): Fail non-propositional creatures (4) and unwanted pleasures (3). Cannot compare attitudes across species.  
    - **Desire-Based Accounts** (e.g., pleasure as desire-satisfaction): Fail unwanted pleasures (3) and desire-without-pleasure cases (3). Desires are incommensurable across minds.  
    - **Pluralist/Pragmatist Accounts** (e.g., "family resemblance"): Explicitly reject comparability (7), making welfare weighing arbitrary.  
  - **Root Issue**: Comparability requires a universal scalar property (e.g., hedonic magnitude). Heterogeneity implies no such property exists—e.g., how to quantify "intensity" for relief vs. warmth? This collapses hedonism into intuitionism.

  **Conclusion**: The heterogeneity problem arises from the **mutual exclusivity of phenomenal unity and intentionality**. Comparability exacerbates this by demanding a homogeneity that heterogeneity denies. If your chapter shows no theory meets all non-negotiable requirements—especially due to this core tension—the verdict against hedonism stands. I recommend testing major theories (e.g., Feldman’s attitudinal hedonism, Crisp’s sensory view) against Requirement 2 vs. 8 and Requirement 7 explicitly.
