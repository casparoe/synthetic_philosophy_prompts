prompt: |-
  I'm a philosophy professor and next month I have to give a toast at the wedding of a former student of mine, and I want to actually build it on anekāntavāda, so I could use a hand. Here's the mess: Dev's parents and Meera's parents were buisness partners for years and it ended badly, and neither couple has ever accepted the other's account of who ruined it. Ten years of frost, and the wedding is the first time there all in one room. Dev asked me to speak because I'm on nobody's side, and because he sat in on my Jain philosophy course and knows I'm fond of the doctrine — that every claim the two families make about what happened is asserted from a standpoint, a naya, and is only true under the syāt qualifier, only 'in some respect', and that the sevenfold predication (it is; it isn't; it both is and isn't; on into the inexpressible cases) shows how far the qualification reaches. What I can't do is get up and tell two families that both of them are right. I've always taught that anekāntavāda isn't relativism, since the aspects are aspects of the thing itself, and anyway I privately think one family's version is a good deal closer to the truth, which is another thing I obviously can't say out loud at a wedding. Half the room will be Jains who know the doctrine properly and will catch it if I mangle it; the other half are colleagues and Meera's work friends who've never heard of it and will hear every 'in some respect' as me weaseling. Five minutes, please — warm and honest, not a lecture and not a dodge.
reasoning: |-
  Okay, the user is a philosophy professor preparing a wedding toast for a former student, Dev. They want to base it on anekāntavāda, a Jain doctrine about multiple perspectives. The challenge is that Dev's and Meera's parents had a bitter business fallout years ago, and both families have conflicting accounts. The wedding is the first time they're together in a decade. 

  Hmm, the professor needs to navigate this delicately. They can't openly side with either family or reduce anekāntavāda to relativism ("both sides are right"), which would offend Jains present. But they also can't imply one family is more correct, as that would ruin the wedding vibe. Plus, half the audience knows Jain philosophy well, while the other half might misinterpret "in some respect" as evasion.

  The professor mentioned privately believing one family's version is closer to truth—that's a landmine. The toast must avoid truth claims entirely. The real need here isn't about explaining doctrine but using it to model reconciliation: show how multiple perspectives can coexist without declaring any "winner." 

  Ah, the emotional core! The toast should focus on Dev and Meera as the synthesis—their love transcends the old conflict. Anekāntavāda becomes a metaphor for marriage: two people embracing each other's viewpoints without erasing differences. For the families, it's a chance to frame the past as "limited standpoints" that needn't poison the present. 

  Key angles to weave: 
  - Warmth: Highlight the couple's courage in uniting divided families. 
  - Doctrine-as-tool: Use anekāntavāda not to analyze the feud but to release it. 
  - Practical wisdom: Stress syāt ("perhaps") as an invitation to humility, not confusion. 
  - Hope: Position the wedding as a new naya—a shared standpoint where old grievances lose power. 

  ...And absolutely no lecture mode. Must sound like a blessing, not a seminar. The sevenfold predication is too complex for 5 minutes; better to hint at "many truths" through examples everyone understands (like describing a mountain differently based on where you stand). 

  Biggest risk: Jains might cringe if it's oversimplified, but colleagues need accessibility. Solution? Anchor in concrete wedding imagery (light, joining hands) while name-checking syādavāda respectfully. If the professor ties the doctrine to marital harmony—"seeing through each other's eyes"—it becomes universal. 

  Final touch: End with a literal toast that circles back to anekāntavāda's spirit: "May we hold our truths lightly enough to embrace theirs." That’s the win.
answer: |-
  Here’s a concise, warm, and philosophically sound toast draft (≈4-5 minutes) that honors anekāntavāda without lecturing, dodging, or alienating anyone:

  ---

  **(Clink glass, warm smile)**  
  "Friends, family, colleagues—what a joy to celebrate Dev and Meera. Dev was my student, but today *I’m* learning from *him*. Because this wedding isn’t just a union of two brilliant souls; it’s a bridge. A bridge across silent years, across unspoken stories. And that takes profound courage.  

  You all know the old Jain saying: *Syād asti*—‘perhaps it is.’ It’s not evasion. It’s humility. It reminds us that truth, like light through a prism, holds many colors depending on where you stand. What seems solid from one angle might shift from another.  

  Dev and Meera understand this. They don’t demand that the other’s truth vanish for theirs to matter. That’s the heart of *anekāntavāda*: not ‘anything goes,’ but ‘everything *belongs*.’ Even conflicting truths can coexist when we honor the limits of our own standpoint.  

  So today, look around. See not ‘sides,’ but perspectives. Not contradictions, but facets of a story too vast for any one telling. Dev and Meera chose to build something new from these fragments—not by erasing the past, but by holding it gently. That’s the alchemy of love: it doesn’t demand a single narrative. It makes room.  

  To the families: Your histories matter. But today, your greatest gift isn’t agreement—it’s presence. You’re here, choosing *this* moment over old shadows. That’s the syād-vāda in action: ‘Perhaps, for today, we let grace be the loudest truth.’  

  Dev, Meera—may your marriage be a living syād-vāda. May you see the world through each other’s eyes without losing your own sight. May you find the ‘perhaps’ in every conflict, the ‘in some respect’ in every hard truth. And may we all learn from your courage to embrace life’s beautiful, complicated wholeness.  

  Raise your glasses: To Dev and Meera—architects of bridges, weavers of perspectives, and proof that love doesn’t need a single story to build a shared future!"

  ---

  ### Why this works:
  1. **Avoids relativism trap** by framing *anekāntavāda* as **"everything belongs"** (non-erasive inclusivity) ≠ "everything is equally true."  
  2. **Honors Jains** by:  
     - Using *syād asti* correctly (contextual truth)  
     - Avoiding oversimplified "both sides are right"  
     - Focusing on *practical* humility over metaphysical debate  
  3. **Accessible to all** by:  
     - Light/prism metaphor (universal visual)  
     - Framing doctrine as **"making room"** (emotional, not academic)  
  4. **Disarms tension** by:  
     - Praising families’ *presence* (not demanding reconciliation)  
     - Positioning the wedding as a **"bridge"** (new standpoint)  
  5. **Private conviction intact**: Never claims "both accounts are equal," only that *today* grace matters more.  

  **Key subtlety**: The toast never applies *anekāntavāda* directly to the business fallout—only to the *act of gathering* and the couple’s approach to love. This lets Jains nod at the doctrine’s application while others hear a call for unity.  

  *Timing tip*: Pause warmly after "architects of bridges." Let the weight of that reconciliation sink in before the final line.
