prompt: |-
  I'm putting together a short research proposal and I'd like you to write it for me. The setup: it's a small internal grant, nine months of my own time, deliverable is a paper plus a little workshop, and the panel is mostly people from outside philosophy who like things stated plainly. Two pages. No bibliography — I'll do the referencing myself.

  Here's my half-formed idea. The levelling-down objection gets run at egalitarians, and the prioritarian reply is always some version of 'that's exactly why I'm not an egalitarian — on my view, making the better off worse off with no gain to anyone makes things worse, full stop, so there's nothing to level down to.' I think that reply is too quick, and heres the bit I can't yet state properly. It looks like the prioritarian gets out of the objection for free, by building the answer into the definition of the value function. But the thing doing the real work isn't 'priority to the worse off' — it's that the value of what happens to you is fixed by your own level and nothing else, i.e. the view is separable across persons. So I want to ask whether separability is what immunises the view, and if it is, whether that immunity survives in the cases where the priority view is supposed to earn its keep: variable populations, benefits that can't be compared across persons, and cases where 'worse off' needs a baseline that is itself fixed by facts about other people or about the counterfactual.

  So the question I want nailed down is roughly: is the priority view's escape from the levelling-down objection a substantive result, or a bookkeeping artefact of separability — and is there a formulation of the priority view that is non-separable (so it can handle those cases) without thereby becoming vulnerable to a levelling-down objection of its own?

  What I need from you:

  - the question stated so it has a determinate answer and I can tell when I've got one, rather than a topic area;
  - why the standing answers to the levelling-down objection leave this open — the person-affecting reply, the 'egalitarianism is a different betterness relation' reply, the 'priority view is just utilitarianism with a curve on it' reply. Say what each one settles and what it doesn't;
  - the method, and why that method rather than the obvious alternatives. I want this to be case-construction and argument rather than literature synthesis, so be concrete: what cases I'd build, the two or three candidate formulations of the priority view I'd test them against, and what would actually decide between them;
  - what a successful outcome looks like, and what would count as the project failing. I'd rather have an honest 'if it turns out X, the idea is dead' in there than a promise that it'll all work out;
  - a realistic scope for nine months, including what I'd have to cut.

  Start straight in with the proposal itself — no preamble, no restating the question, no 'here's your proposal'. British English please.
