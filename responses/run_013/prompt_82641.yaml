answer: |-
  ## Research Proposal: Separability and the Levelling-Down Objection in Prioritarianism

  **Research Question:**  
  Is the priority view’s immunity to the levelling-down objection (LDO) solely a consequence of its *separability across persons* (where the moral value of a benefit to an individual depends only on their absolute welfare level, not on others’ levels)? If so, can a *non-separable* variant of prioritarianism be formulated that retains this immunity while handling variable-population cases, benefits with cross-person incomparability, and welfare baselines sensitive to others’ welfare or counterfactuals?

  **Background and Rationale:**  
  The LDO challenges strict egalitarianism: levelling down (reducing inequality by harming the better-off, with no one gaining) appears intuitively unjustified, yet some egalitarian views cannot condemn it. Prioritarians avoid this by defining a state’s overall value as a sum of strictly increasing, concave transformations of individual welfare (giving priority to the worse off). Their standard reply to the LDO is that levelling down always makes outcomes strictly worse because it lowers the transformed welfare total.  

  However, this reply may conflate two features:  
  1. **Priority to the worse off** (the concave transformation).  
  2. **Separability** (individual moral value depends *only* on absolute individual welfare).  

  Separability ensures that harming a better-off person *always* reduces total value, irrespective of others’ welfare levels. But in complex cases where prioritarianism is invoked (e.g., variable populations or incomparable benefits), separability may be untenable or require welfare baselines that *are* relative (e.g., defined by others’ welfare or counterfactuals). If immunity to the LDO relies on separability, then non-separable variants—needed for these cases—might inherit the LDO problem, undermining prioritarianism’s key advantage.  

  Existing replies do not resolve this:  
  - The **person-affecting reply** (levelling down benefits no one) does not explain *why* prioritarianism avoids the LDO while non-person-affecting egalitarianism might not.  
  - Treating **egalitarianism as a distinct "betterness relation"** (e.g., Parfit) sidesteps whether prioritarianism’s avoidance is substantive or structural.  
  - Reducing prioritarianism to **"utilitarianism with a curve"** assumes separability by default, ignoring non-separable formulations.  

  This gap is significant: if prioritarianism’s LDO immunity is merely a bookkeeping artefact of separability, its theoretical appeal in complex cases is weakened.

  **Methodology:**  
  The project will use normative case-analysis to test separable and non-separable prioritarian formulations against bespoke LDO-style scenarios. This method is chosen over literature synthesis to directly probe structural vulnerabilities.  

  1. **Case Construction:** Develop three scenarios exposing tensions between non-separability and LDO immunity:  
     - **Variable Population:** A choice affecting who exists, where the baseline for "worse off" depends on the comparative existence of others (e.g., creating a medium-welfare person vs. a low-welfare person when no one else exists).  
     - **Incomparable Benefits:** Benefits to different individuals that cannot be cardinally compared (e.g., health vs. autonomy gains), forcing baseline-dependent priority weights.  
     - **Relative Baselines:** Cases where an individual’s "welfare level" is defined relative to others (e.g., "worse off" means below median welfare) or a counterfactual (e.g., "worse off than they would be in alternative X").  

  2. **Candidate Formulations:** Test three variants of prioritarianism:  
     - **Standard (Separable):** Value = Σ *f*(*wᵢ*), with *f* concave and *wᵢ* absolute.  
     - **Baseline-Relative Non-Separable:** Value = Σ *g*(*wᵢ*, *Bᵢ*), where *Bᵢ* (individual baseline) depends on others’ welfare (e.g., *Bᵢ* = median welfare).  
     - **Holistic Non-Separable:** Value = *h*(*w₁*, *w₂*, ..., *wₙ*), with *h* strictly increasing and concave in individual welfare but sensitive to joint distributions.  

  3. **Decision Criteria:** For each case, assess:  
     - Does the formulation *avoid* endorsing levelling down (i.e., does it always judge a levelled-down outcome as strictly worse)?  
     - Does it *accommodate* the relevant complexity (e.g., can it rank variable-population outcomes)?  
     - Is it *distinct from egalitarianism* (i.e., does it sometimes favour inequality without Pareto improvements)?  
     A formulation succeeds if it satisfies (a) and (b) without collapsing into egalitarianism (failing (c)).

  **Expected Outcomes and Success Criteria:**  
  - **Successful Outcome:** A coherent, non-separable prioritarian formulation that is immune to the LDO in all test cases *and* handles variable populations/incomparability better than standard prioritarianism. This would demonstrate that LDO avoidance is not parasitic on separability.  
  - **Clear Failure:** Evidence that *all* non-separable variants either:  
    - (i) Endorse levelling down in some cases (failing (a)), or  
    - (ii) Collapse into a form of egalitarianism (failing (c)).  
    This would confirm that separability is necessary for prioritarianism’s LDO immunity, limiting its applicability to complex cases.  
  - **Partial Success:** Identifying boundary conditions (e.g., non-separable versions work only with certain baselines).  

  **Scope and Feasibility:**  
  - **In Scope:** Developing 3–4 core cases; formulating/refining 2–3 priority view variants; rigorous normative analysis; drafting a paper; organising a workshop for internal feedback.  
  - **Out of Scope:** Comprehensive comparison with sufficiency views, empirical applications, or full defences against other objections (e.g., transitivity paradoxes). Literature review will be minimal, focusing only on essential prioritarian/egalitarian texts.  
  - **Timeline:**  
    - Months 1–3: Case development and formulation refinement.  
    - Months 4–6: Testing formulations against cases, analysing results.  
    - Months 7–8: Paper drafting.  
    - Month 9: Workshop preparation/delivery and final revisions.  
  - **Deliverables:** A 7,000-word paper (submitted to *Ethics* or *PPR*); a 3-hour workshop for interdisciplinary stakeholders.  

  **Conclusion:**  
  This project challenges a key defence of prioritarianism by probing whether its immunity to levelling down is robust in non-separable contexts. Success would strengthen prioritarianism’s foundations; failure would clarify its limitations. Either outcome advances debates in distributive justice by isolating the role of separability in value aggregation.
