prompt: |-
  Ok so I've been reading rationalist blogs since the ancient days of Overcoming Bias, and I keep getting into the same fight with a buddy of mine. I'm the one who thinks the zombie arguement basically sinks physicalism; he's the one who says fine, zombies are "conceivable," but that just shows our concepts are a mess, not that there's a possible world with nobody home. We've been going back and forth for like two years now and honestly I'm not sure anymore whether we disagree about the world or just about what "conceivable" is even supposed to mean.

  So I want you to write the thing we should've written a year ago: a joint statement for an adversarial collaboration between us that both of us could actually put our names on. Format it as a numbered "agreed claims" section first, then a disagreements table after.

  Stuff I want in there:
  - the claims both of us can sign about what the zombie scenario is, what "conceivable" does and doesn't buy us, and what would have to be true for the argument to actually go through
  - the real points of disagreement, each one worded the way the person who holds it would accept as fair to their own side
  - the cruxes -- the sub-questions where, if one of us got moved, we'd actually change our minds. I think one is whether conceivability is a guide to possibility at all, and another is whether the zombie idea is even coherently statable or whether it's more like a square circle
  - for each crux, a case or argument we'd both agree is relevant, plus what each side predicts about it, written down before anyone gets to spin the result

  Couple extra wrinkles I want worked in, cause these are the bits we genuinely can't agree on:
  1. Partial zombies. Not a full atom-for-atom duplicate, but a creature that's functionally identical to a human except it has qualia for, say, vision and nothing at all for hearing, while behaving exactly as if it heard things. Does the same conceivability reasoning apply to partial zombies? Does that make the argument stronger, weaker, or just messier? Make both sides say what they'd expect.
  2. Whether any part of our fight is purely verbal -- like if we just mean different things by "conceivable" (ideal vs. prima facie, say) and could translate each other's claims into our own vocabulary without loss. If so, say which part; if not, say why the disagreement survives translation.

  Dont bother with citations or reading lists -- I don't have web access on this thing and neither does the model I'm pasting it to, so just reason it out. And please don't end on some wishy-washy both-sides-have-a-point note: if the collaboration can't resolve something, make it precise what's left open and what would actually settle it.
