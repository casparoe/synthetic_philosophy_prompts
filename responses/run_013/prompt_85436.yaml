prompt: |-
  Longtime lurker here — LessWrong, the old Overcoming Bias days, a couple of rat-adjacent Discords I'm definately not going to name. I have a pattern I keep noticing and I want to know if it's a thing, or if I'm just pattern-matching on vibes.

  Here's the shape of it. Two sides in some ongoing dispute both see a fight coming. Before it arrives, each side does something that makes its future response automatic: a law, a public promise, a clause in a contract, a piece of automation, a rule with no discretion left in it. Neither side wants the fight. Both would prefer a deal. But each thinks: if I don't wire my response in now, they'll wire theirs in, and then when the moment comes I'm the one who has to fold. So both wire it in. Now the two wired-in responses are incompatible, neither can be quietly withdrawn, and the deal both sides preferred is gone — not because anyone's preferences changed, but because each side's commitment is only worth anything if it isn't taken back. The commitment itself is usually free to make. A press release, a policy memo, a line in the terms of service. The cost only appears when it's tested, at which point you either honor it or eat the credibility loss on every future commitment you ever make.

  Three places I've watched it happen:

  A pair of countries each pass a statute saying sanctions trigger automatically if the other does X. Both pass, because passing is free and not passing looks weak. Now the leaders who want a deal have to repeal a law, which reads as surrender, so the deal dies.

  A company sets up a filter that auto-rejects any request matching a pattern. The counterparty can't negotiate with a filter, so it escalates, and now the company would have to publicly override its own system to de-escalate — a much bigger move than never having built the filter.

  A union and a firm each announce a red line well before bargaining starts, mostly to look resolute to their own members. Both mean it less than they sounded. Neither can move first.

  The part that really bugs me: the waste seems to scale with how *cheap* it is to commit. When locking in costs a lot — actually burning the bridge — people only do it when they mean it, and the mechanism self-limits. When locking in is free, everybody does it, and you land in the worst outcome having done none of the deliberation. That's backwards from the usual "credible commitments have to be costly" story. And the race element is strange too: the outcome seems to hinge on who the other side believes will still be committed when the moment comes, which means the winner is often just whoever has the simpler, more legible decision procedure. Rewarding legibility over resolve seems like a bad property for a mechanism to have.

  I've already tried the obvious candidates and none of them fit. War of attrition, no — nobody's paying a running cost to stay in. Arms race, no — it isn't about capability. Brinkmanship is close, but that's about making things slip out of your control on purpose, and this is about making them automatic. Cheap talk is wrong in the other direction: these are cheap to say and expensive to unsay. Commitment device is one-sided, self-control, not a two-player race.

  A friend called it a commitment race. When I went looking, that phrase seems to be doing duty for at least three different things: two labs racing to ship first, two bargainers each trying to be the one whose threat is treated as fixed, and this. Maybe they're all one thing and I'm being dense. Maybe they're three things wearing one coat.

  So: is this named? If it is, which name, and which of the neighbors is it *not*? If it isn't, coin something and give me a definition plus the boundary cases — what looks like it and isn't, what is it and doesn't look like it. And tell me whether I've described one phenomenon or a bundle; if it's a bundle, where are the joints.

  You're a game theorist with good taste in conceptual hygiene, and you've read enough of the rationalist canon to know the difference between a real distinction and a blog handle. Think it through before committing: spend a few lines on the candidate concepts and where each one breaks, then pick. I want a committed answer. If you think it's already named, say so and defend that against the alternatives. If you think it's new, name it, define it, and tell me what would make you drop the claim. Don't hand me a menu of five possible names and "it depends what you mean." And no reading list, please — I'm offline and can't check citations, so argue from the structure of the thing instead.
reasoning: |-
  Hmm, the user is describing a pattern they've noticed where two parties in a dispute pre-commit to automatic responses, leading to unnecessary conflict escalation even when both would prefer to negotiate. They've observed this in international relations, corporate settings, and labor negotiations. They want to know if this phenomenon has a name in game theory or rationalist circles, or if it's a new concept worth naming.

  The key characteristics are:
  - Mutual pre-commitment to automatic responses (laws, filters, public promises)
  - Commitments are cheap to make but expensive to break
  - Both parties would prefer negotiation but fear being the first to fold
  - Outcome determined by who has the most legible commitment
  - Paradoxically more wasteful when commitments are cheaper to make

  After analyzing, I think this is actually a distinct mechanism that hasn't been properly named. The user already ruled out war of attrition, arms races, brinkmanship, and cheap talk. While Schelling's concept of commitment is foundational, it doesn't capture the mutual pre-commitment race aspect. 

  The core innovation here is the automaticity and the race dynamic before conflict even occurs. The closest existing concept is "commitment races" but as the user noted, that term is overloaded. 

  I'll propose "Mutually Assured Rigidity" (MAR) as the name, capturing:
  - The bilateral nature (mutual)
  - The inevitability (assured)
  - The inflexibility (rigidity)

  This distinguishes it from MAD (Mutually Assured Destruction) because MAR is about self-imposed constraints rather than capabilities. The boundary cases would include situations where commitments aren't truly automatic or aren't made in anticipation of the other's commitment. 

  The user seems sophisticated - they're familiar with rationalist concepts and want precise conceptual hygiene. They're frustrated that existing frameworks don't capture this dynamic they've empirically observed. By giving it a clear name and definition, we help them discuss and analyze this pattern more effectively.
answer: |-
  Your pattern is **real, distinct, and unnamed** in canonical game theory or rationalist literature. It’s a bundle of two interlocking dynamics: a **preemptive commitment race** and an **automation rigidity trap**. I’ll coin **Mutually Assured Rigidity (MAR)** and define it rigorously.  

  ### Core Definition  
  **Mutually Assured Rigidity (MAR)** occurs when:  
  1. **Anticipatory Conflict**: Two strategic agents foresee a potential dispute.  
  2. **Costless Precommitment**: Each publicly adopts an *automatic, irreversible response* to a future trigger (e.g., law, algorithm, public vow).  
  3. **Mutual Lock-In**: Both act *preemptively* because:  
     - Failing to commit signals weakness, inviting exploitation.  
     - Commitment is cheap upfront but costly to revoke (reputational/coordination costs).  
  4. **Inevitable Collision**: The locked-in responses are incompatible, forcing a suboptimal outcome *neither wanted*, even though a Pareto-superior deal was feasible.  

  ### Why Existing Concepts Fail  
  - **Commitment Device (Schelling)**: Explains *why* commitments work but not the *race dynamic*. Schelling focuses on one agent tying their hands *against themselves* (e.g., burning bridges). MAR involves **mutual preemption** against each other.  
  - **Brinkmanship**: Requires *controlled* risk of accidental disaster (e.g., nuclear escalation). MAR uses **deliberate automation**—no "slippery slope"; it’s a hardwired rule.  
  - **Cheap Talk**: Involves non-binding signals. MAR commitments are **costly to reverse** (reputational sunk costs).  
  - **Prisoner’s Dilemma**: Mutual defection is static. MAR is **dynamic**—the trap emerges from *sequential pre-commitments*.  
  - **Coordination Game**: No focal point exists; both sides *create* incompatible focal points via commitments.  

  ### Boundary Cases  
  **What MAR Is NOT**:  
  - A **signaling game** (e.g., "I’m tough!"). Signals are cheap; MAR binds with institutional/automated teeth.  
  - **Arms races**. Building weapons increases capability; MAR commits to *rules of engagement*, not tools.  
  - **War of attrition**. No ongoing cost; MAR’s cost is lumped at the revocation point.  

  **Subtle MAR Cases**:  
  - A startup publicly vows "no acquihires" to attract idealists. A big tech firm auto-rejects "no-acquihire" applicants. Both wanted talent mobility but can’t backtrack.  
  - *Not MAR*: Two nations mobilizing troops (costly upfront → no "free" commitment).  

  ### Why "Mutually Assured Rigidity"?  
  - **Mutually Assured**: Echoes MAD (Mutually Assured Destruction), highlighting the lose-lose outcome.  
  - **Rigidity**: Captures the *inflexibility* from automated systems/laws. Unlike MAD’s destructive capability, rigidity is **procedural**.  

  ### Conceptual Hygiene: The Bundle  
  You’ve identified **two joints**:  
  1. **The Race Phase**: Agents compete to commit first. Won by whoever’s process is *faster/more legible* (e.g., a filter beats human negotiation).  
  2. **The Rigidity Phase**: Commitments activate, making de-escalation prohibitively costly.  

  This is one phenomenon: the phases are causally linked. The race exists *because* rigidity imposes revocation costs.  

  ### Why I’d Retract  
  I’d discard MAR if:  
  - The commitments weren’t **mutual and preemptive** (e.g., one side commits unilaterally).  
  - Revocation was **costless** (no reputational/institutional penalty).  
  - The conflict was **resolvable by renegotiation** without credibility loss.  

  ### Conclusion  
  You’ve spotted a gap. MAR explains why **low-cost precommitment tools** (algorithms, PR vows) invite disaster: they incentivize a race to inflexibility, rewarding speed/legibility over wisdom. It’s the dark side of Schelling—commitments meant to force deals instead prevent them. The key is the **asymmetry**: free to apply, costly to remove. Name it, use it.  

  ---  
  *Final note: If you later find this in TCS as "preemption games with irreversible actions" or similar, I’ll concede—but it’s not in mainstream game theory. MAR’s novelty is the focus on institutional/automated rigidity as the commitment vehicle.*
