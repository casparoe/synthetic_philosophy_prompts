answer: |-
  Here’s an exam question designed to force diagnostic thinking, followed by a model answer, marking scheme, and common pitfalls. The question centers on your chronicle thought experiment and the retroactive meaning in historical events.

  ---

  ### **PHIL 399: Philosophy of History — Final Examination**  
  **Time Allowed: 90 minutes**  
  **Answer ONE Question**  

  **QUESTION:**  
  A historian discovers a "perfect chronicle": a record listing every observable event in a past society at the exact moment it occurred, with no later additions or interpretations (e.g., "14 Jan 1942, 10:00: Private A writes letter B"). This chronicle contains no laws, causes, or future outcomes.  

  1.  **Explain why, according to the covering-law model, this chronicle should contain everything needed to explain historical events.**  
  2.  **Using the chronicle, analyze whether it can explain these three objections to the covering-law model:**  
      -   *(Objection A)* A falling barometer and a storm are correlated, but the barometer does not *explain* the storm.  
      -   *(Objection B)* Historians explain revolutions or economic slumps, but we cannot reliably predict them.  
      -   *(Objection C)* Historians rarely state laws; when they do, these laws are often truisms (e.g., "Starving people revolt").  
  3.  **Could a narrative historian use this chronicle to write history? If so, what must they add to it? Does this addition rely on anything like a "law" or "norm"?**  
  4.  **Ultimately, is the debate between covering-law and narrative models a disagreement about:**  
      -   **(i) How the world works (e.g., whether human actions follow laws), OR**  
      -   **(ii) What counts as a good explanation in a text?**  
      Defend your answer using the chronicle example.  

  ---

  ### **Model Answer (Approx. 700 words)**  

  **(1) The covering-law model (CLM) claims explanation requires deducing an event from general laws + initial conditions. The chronicle provides every "initial condition" at each moment. If we possessed the relevant laws (e.g., laws of human behavior, physics), we could theoretically deduce any event from prior states in the chronicle. For CLM, the chronicle *is* the complete dataset for explanation; history is the application of laws to this data. Hempel would argue missing explanations reflect incomplete laws or data, not a flaw in the model.**  

  **(2) The chronicle cannot resolve the objections:**  
  -   **Objection A (Barometer):** The chronicle records the barometer falling and later the storm. CLM sees both as instances of laws (e.g., atmospheric pressure laws). But the objection highlights *explanatory irrelevance*: the barometer reading is an epiphenomenon, not a cause. The chronicle *shows* the correlation but cannot itself distinguish causal relevance from coincidence without prior laws defining "cause." CLM’s structure doesn’t filter irrelevant correlations.  
  -   **Objection B (Prediction Symmetry):** The chronicle records a revolution after years of famine and oppression. CLM says explaining it requires laws linking those conditions to revolution. But we cannot predict revolutions from similar conditions because human actions involve complex contingencies. The chronicle has the outcome, but CLM cannot justify *why* prediction fails while explanation succeeds if both rely on the same laws. The objection reveals CLM’s inability to handle path-dependence or unique conjunctures.  
  -   **Objection C (Truistic Laws):** The chronicle lists "Bread riot, City X, 12 May 1789" and earlier "Wheat harvest fails, Region Y, 1788." A covering-law might be "Food scarcity causes unrest." But this is a truism; its explanatory force seems weak. The chronicle provides the "initial conditions" (famine), but the CLM cannot show *why this particular riot* occurred when others didn’t, or why the truism feels insufficient. The force comes from *deviations* from norms (e.g., "Why revolt *here* but not *there*?"), which the chronicle alone doesn’t establish.  

  **(3) A narrative historian *could* use the chronicle but must add: (a) **Selection** (ignoring most entries), (b) **Emplotment** (framing events as a story with beginning/middle/end), (c) **Causal Links** (e.g., "The famine *led to* unrest"), and (d) **Retrospective Significance** (e.g., "This riot *was the first spark* of the revolution"). Crucially, they add **temporally later knowledge** (e.g., that a capture happened). This creates coherence but relies on **norms** (e.g., "People under stress often lie"; "Captured soldiers rarely remain cheerful"). These aren’t strict laws but expectations structuring "followable" stories. Without implicit norms, narratives lose explanatory power (e.g., we couldn’t call a letter "the first lie" without a norm of truthfulness).**  

  **(4) The debate is primarily about (ii) what counts as a good explanation in a text**, not (i) whether the world is law-governed. The chronicle proves this: it contains all physical events, implying a deterministic world (*if* laws exist). Yet it fails as history because it lacks *meaning*. Narrativists argue history explains by showing *why events matter within a temporal whole*. The "lie" only becomes significant post-capture; the "cheerful letter" gains meaning from later despair. CLM treats events as isolated atoms to be subsumed under laws; narrative treats them as parts of a configured whole. The objections reveal CLM’s textual inadequacy: it cannot exclude irrelevant correlations (A), justify asymmetric explanation (B), or escape truisms without context (C). Narrative avoids these by making significance context-dependent and retrospective.  

  **However, narrative’s reliance on norms shows CLM isn’t "trivially true." Norms are not predictive laws; they describe *understandable* actions within a context, not inevitable outcomes. CLM requires laws sufficient for deduction; narrative uses norms for coherence. Conceding norms isn’t conceding CLM—it’s showing explanation requires more than deduction. The chronicle has the "world" but not the "text" of history.**  

  ---

  ### **Marking Scheme (Total: 20 marks)**  
  **A (18-20):** Diagnoses CLM’s core commitments; uses chronicle to dissect objections; shows narrative’s retroactive meaning-making; decisively resolves debate’s focus (text vs. world) and addresses norm/law tension.  
  **B (15-17):** Correctly applies objections to chronicle; identifies narrative additions; states debate is about explanation, but lacks depth on retroactivity or norms.  

  | **Must-Hit Points**                                                                 | **Marks** | **Common Flaws**                                                                                     |  
  |-------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------------------------|  
  | **1. CLM’s view of chronicle:** Explains why CLM sees chronicle as sufficient data for explanation. | 4/20 | "CLM needs laws, so chronicle is useless" (misreads CLM’s requirements).                            |  
  | **2. Objections via chronicle:** Correctly diagnoses how chronicle *fails* to resolve each objection (A: irrelevance; B: asymmetry; C: truism weakness). | 6/20 | Treats objections as standalone critiques; doesn’t use chronicle to show *why* CLM falters.          |  
  | **3. Narrative’s additions:** Identifies selection, emplotment, retrospection, AND notes reliance on norms. | 4/20 | Lists "storytelling" without specifying norms or retroactive significance.                           |  
  | **4. Debate focus (text vs. world):** Argues debate is about explanatory texts, using chronicle to show history requires meaning beyond events. | 4/20 | Claims it’s *only* about the world (laws vs. free will) or *only* about style.                       |  
  | **5. Norms vs. Laws:** Explains how narrative’s norms differ from CLM’s laws (coherence vs. prediction) and why this doesn’t concede CLM. | 2/20 | Assumes norms = laws (conceding CLM) or dismisses norms entirely (weakening narrative).              |  

  ---

  ### **Why This Works**  
  - **Forces Diagnosis:** Students can’t list objections; they must use the chronicle to *test* CLM’s limits and narrative’s tools.  
  - **Personal Hook Embedded:** The chronicle mirrors your grandfather’s letters—raw data needing retrospection for meaning.  
  - **Sorts A from B:** B answers explain objections; A answers expose how retroactive meaning challenges CLM’s ontology.  
  - **No Rote Citations:** The chronicle is the primary "text," making prior knowledge actionable, not repetitive.  

  This question ensures they grapple with *why* the "lie" on the 14th can’t exist in the chronicle but *must* exist in history—and what that does to both models. Good luck with grading!
