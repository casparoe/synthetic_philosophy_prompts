prompt: |-
  So in my ethics class we spent basically a whole period on the ticking time bomb thing — bomb's about to go off somewhere in the city, you've caught the guy who planted it, he won't talk, is it ok to torture him — and honestly it turned into forty minutes of people yelling past each other and then the bell rang. My teacher said the interesting part isn't the yes or no answer, it's all the moves people make to get *out* of having to answer it, so she made us write down every move we could think of. Now I have to rank my list for a writeup and I definately keep flip-flopping on the order, so I want a second opinion from something that isn't also a sleep-deprived junior.

  Here's my list, in my own words: (a) just do the math — if the expected lives saved is bigger than the expected harm of torturing him, do it, no special rules needed; (b) rights are absolute up to some catastrophic line, and past that line you can override them; (c) never, full stop, partly because the scenario basically never happens in real life and partly because once it's permitted at all the institutions rot; (d) it's a genuine tragedy — you should do it and you're guilty of doing it, both at once, and the good outcome doesn't wash the guilt off; (e) you don't actually have to hurt him, you just have to make him believe you will, so the real question is about lying and bluffing, not about pain; (f) the scenario is rigged, because it hands you certainty you'd never have (that there's a bomb, that he knows where it is, that he'll crack in time, that torture even works for this), so the real question isn't "may I" but "what rules should exist in advance", which is a completely different question; and (g) if you're in this situation at all, everything upstream already failed — intelligence, policing, whatever — so it's not a moral dilemma, it's a screwup with a body count.

  Can you rank these from the one that most actually answers "is it ok to torture him right now" down to the one that most just dodges it? An ordered list with a tier or two of grouping is fine, doesn't have to be super formal. For each one give me a sentence or two on why it lands where it does, tell me if any of them are secretly the same move wearing a hat (I have a feeling a couple of mine are), and finish by saying which one you think is weirdly underrated and which one is doing the most work with the least substance. Don't just tell me what some famous philosopher said about it — I want the actual reasoning, cause I have to defend the ranking out loud.
