  Hmm, the user has just finished reading a trade book on accountability and repair, and they're grappling with a chapter about who has the standing to blame others. The chapter argues that for blame to be effective, three conditions must be met: the act must be wrong, the person must be blameworthy, and the blamer must have standing - which the chapter reduces to not being hypocritical. The chapter then claims that without standing, blame is completely null and void, like a non-referee blowing a whistle.

  The user suspects this might be unfair or oversimplified but can't pinpoint exactly why. They mention that they've personally found "you have no standing" to feel like a complete reply when facing hypocritical accusers. They want me to analyze the chapter's claims from a philosophical perspective on blame theory.

  Let me break down the key claims from the chapter:
  - Standing is equivalent to the hypocrisy condition
  - Losing standing happens through hypocrisy, complicity, or meddling - all reducible to hypocrisy
  - Without standing, blame has no moral force and can be ignored
  - The "thief calling theft wrong" objection refutes the entire concept of standing
  - Standing is just social awkwardness dressed up

  Now I need to assess these against philosophical literature on moral responsibility. Philosophers like Gary Watson, Pamela Hieronymi, and R. Jay Wallace do recognize standing as distinct from the other conditions. Standing isn't just about hypocrisy - it's about the blamer's moral position to hold someone accountable. Hypocrisy undermines standing because it shows inconsistency, but complicity might relate to shared responsibility, and meddling to lacking the right relationship to blame.

  The chapter's claim that blame without standing is completely null goes too far. Philosophers would say it still has some moral weight - the wrongness remains even if the delivery is compromised. The "thief" example actually proves this - we acknowledge the truth even from flawed messengers.

  The chapter also misses important nuances:
  - The distinction between standing and hypocritical blame
  - The role of relationships in standing (you can blame friends more directly than strangers)
  - How standing relates to moral community membership
  - That standing might be partial rather than all-or-nothing

  For the bottom line: the chapter's radical conclusion doesn't survive scrutiny. There is a distinctive phenomenon of standing that isn't reducible to social awkwardness, though hypocrisy certainly weakens blame's effectiveness. The corrected view should acknowledge standing as a genuine condition that affects how blame functions interpersonally, without negating the underlying wrong.

  The strongest version of standing would be something like: "Standing is the moral authority to hold another accountable, grounded in one's own adherence to relevant norms and appropriate relationship to the wrongdoing."

  Overall assessment: mostly unsound due to over-reduction and misrepresentation of philosophical positions.
answer: |-
  ### Philosophical Audit: Standing to Blame Revisited

  The chapter’s reconstruction of blame—requiring wrongness, blameworthiness, and standing—aligns with standard philosophical accounts (e.g., Watson 2013, Wallace 1994). Philosophers broadly accept that **standing** is a distinct condition for legitimate blame, separate from the act’s wrongness or the agent’s culpability. However, the chapter’s reduction of standing *solely* to hypocrisy oversimplifies and misrepresents the concept. Below, I dissect its claims, correct errors, and identify omissions, drawing on work by Hieronymi, Bell, and others.

  **Claim 1: Standing = Hypocrisy Condition**  
  - **Assessment:** Mistake (conflation).  
  - **Correction:** While hypocrisy *undermines* standing (Wallace 2010), standing encompasses broader relational and normative factors. For example, a non-hypocritical stranger may lack standing to blame for intimate marital betrayals (Bell 2013). Hypocrisy is one *sufficient* but not *necessary* condition for losing standing; irrelevance or lack of relationship can also negate it.  

  **Claim 2: Complicity/Meddling Are Hypocrisy in Disguise**  
  - **Assessment:** Overstatement.  
  - **Correction:** Complicity (e.g., benefiting from systemic wrongdoing) may void standing without hypocrisy—e.g., a sweatshop owner blaming consumers for materialism. Meddling (e.g., uninvolved outsiders) lacks standing due to *relational distance*, not hypocrisy (Todd 2019). The chapter wrongly collapses these into hypocrisy’s "false authority" framing.  

  **Claim 3: Blame Without Standing Is "Null"**  
  - **Assessment:** Mixed (modest thesis overstated).  
  - **Correction:** Blame without standing lacks *interpersonal force* but retains *propositional truth*. Philosophers distinguish blame’s *content* (the act *is* wrong) from its *illocutionary force* (the blamer’s authority to hold accountable). Like a civilian’s "whistle," it may lack performative power but still signal correct judgment (Hieronymi 2004). The wrongdoer *can* ignore the *blamer*, but not the *wrongness*.  

  **Claim 4: The "Thief" Objection Refutes Standing**  
  - **Assessment:** Mistake (straw man).  
  - **Correction:** The thief example exposes the chapter’s *own* reductive view but not philosophical accounts. Defenders (e.g., Scanlon 2008) grant that hypocritical blame can be *truthful* but argue it violates the *second-personal norms* of mutual accountability. Standing concerns *who may blame*, not whether the act is wrong—a distinction the chapter ignores.  

  **Claim 5: Standing Is Just "Social Awkwardness"**  
  - **Assessment:** Mostly unsound.  
  - **Correction:** Standing is a *moral* condition tied to reciprocity in moral communities (Darwall 2006). Hypocritical blame isn’t merely "rude"; it exploits shared norms while exempting itself, corroding trust (Fritz & Miller 2018). Etiquette governs politeness; standing governs moral authority.  

  **Omissions and the Bottom Line**  
  The chapter omits critical nuances:  
  - **Relational specificity:** Standing often depends on roles (e.g., parent-child vs. strangers).  
  - **Partial standing:** One may have standing to blame for *some* wrongs but not others (e.g., a recovering alcoholic criticizing DUIs but not gossip).  
  - **Restorative function:** Standing enables blame to repair relationships, not just punish (Zimmerman 2024).  

  **Corrected Bottom Line:** Standing is a distinct condition for morally authoritative blame, rooted in the blamer’s consistency, relational position, and commitment to shared norms—not reducible to hypocrisy, and not negating the underlying wrongness.  

  **Overall Assessment:** The chapter’s conclusion that standing collapses into "whether the act was wrong" fails. A repaired view retains standing as a genuine barrier to *interpersonal accountability* while accepting that truth persists independently. Your intuition that "you have no standing" feels complete because it often negates the blamer’s *moral leverage*, but it does not absolve the wrong.  

  \answer{mostly unsound}
