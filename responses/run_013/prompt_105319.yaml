prompt: |-
  I chair our university's research-communications review committee. We sign off on how findings from our labs are described in press releases, policy briefs, and legislative testimony, and we have fallen into an inconsistency I can no longer treat as mere sloppiness: the same result is called established in one venue and hedged in another, with no change in the evidence. My suspicion is that the inconsistency tracks something real — that whether a claim counts as known may depend on what is at stake in acting on it, not only on the strength of the evidence, and that the standard for applying the word may shift with the conversational context doing the asserting. I would like you to turn this into a decision procedure the committee can actually run.

  Please supply: the questions to ask, in order; what counts as a sufficient answer to each; the point at which the procedure returns a refusal to assert; and the points at which it must hand the matter to a person because the question is about values rather than evidence. Assume members with no philosophical training, roughly fifteen minutes per claim, and that I sign off.

  Two matters the procedure must confront rather than finesse. First, when it tells us we may not say that our researchers know something, is the correct reading that they do not know it, or that our own context has raised the bar for saying so — and what turns on the difference for what we do next. Second, whose stakes set the bar: those of the people who will act on the claim, or those of the people who produced it.

  Then run the procedure on three claims: a finding of ours about a drug interaction that a regulator may act on; that same finding as described in a grant renewal; and a finding in which I am personally invested, where I take the evidence to be strong but the procedure returns a refusal. Finally, tell me plainly whether a procedure of this shape can be faithful to the view that stakes bear on knowledge, or whether any usable procedure must quietly become a view on which the evidential threshold is fixed — and if the latter, what we give up by adopting it.
reasoning: |-
  Okay, I'm tackling this query from someone who chairs a university research-communications review committee. They're dealing with an inconsistency: the same research findings are described as "established" in some contexts but hedged in others, without new evidence. They suspect this might be because whether a claim counts as "known" depends on what's at stake when acting on it, not just evidence strength. They want a practical decision procedure for their committee to handle this.

  First, I need to understand the core issue. It's about contextualism in epistemology—how standards for knowledge attribution can shift based on practical stakes. The user mentions two key problems: whether "we may not say they know" means they don't know it or if the bar is higher contextually, and whose stakes matter—the actors' or the researchers'.

  The user wants a procedure that's usable: questions in order, clear answers, refusal points, and when to hand off to humans. Constraints: no philosophical training for members, 15 minutes per claim, and the chair signs off. Also, must confront the two matters directly.

  Starting with the decision procedure. I'll outline questions that flow logically. First, clarify the claim itself—what's being asserted. Then assess evidence strength objectively. Next, identify the stakes: who's acting and what could go wrong. This is crucial because high stakes might raise the bar for calling something "known."

  For sufficient answers, I'll make them concrete: the claim must be specific, evidence rated on a scale, and stakes categorized as low, medium, or high based on potential harm. The procedure should refuse to assert if evidence is weak or stakes are high with insufficient evidence. Hand-off points should be when stakes involve values—e.g., how much harm is acceptable—since that's not evidence-based.

  Now, the two matters. On the first: if we refuse to say "know," it could mean either they don't know (invariantism) or the context makes it inappropriate to say so (contextualism). For the committee, adopting contextualism means they might still say "likely" or "suggested" in high-stakes contexts, preserving the idea that knowledge itself isn't denied, just the assertion in that setting. This affects next steps: in high-stakes refusal, they hedge; in low-evidence refusal, they might not communicate it at all.

  On whose stakes: it has to be the audience's stakes. The researchers' stakes might be about reputation or funding, but the harm comes from how others act on the claim. So, regulators' stakes matter more than grant committees' for the drug example.

  Testing the procedure on three claims:
  1. Drug interaction for regulators: high stakes (patient harm), strong evidence. Here, even with strong evidence, high stakes might raise the bar, leading to hedging. The procedure should refuse to say "known" and recommend cautious language.
  2. Same finding in grant renewal: medium stakes (funding impact), strong evidence. Lower stakes mean the bar is lower, so they can assert it as known.
  3. Chair's invested finding: strong evidence per chair, but procedure refuses. I'll simulate—maybe high stakes with some evidence gap. This shows the procedure overriding personal bias, which is good for objectivity.

  Finally, the big question: can this procedure be faithful to stakes-affecting-knowledge, or must it become fixed-threshold? A pure contextualist procedure risks subjectivity in stakes assessment, but by making stakes and evidence explicit, it captures the spirit. However, in practice, it might feel like a fixed threshold because the committee operationalizes it. What's given up is some philosophical purity—true contextualism is fluid—but for a committee, having clear steps is necessary for consistency and efficiency.

  Overall, I'm aiming for balance: a usable tool that acknowledges context without overcomplicating. The key is to keep it practical, with hand-offs for value judgments, so the committee doesn't decide ethics but focuses on evidence and risk assessment.
answer: |-
  Here is a practical decision procedure for your committee, designed to address contextual stakes while remaining executable within your constraints. It formalizes your insight that "known" is not solely evidence-based but also sensitive to the **practical consequences of error**.

  ---

  ### **Decision Procedure: "Known" Assertion Protocol**
  **Input:** A specific claim (e.g., "Drug X interacts adversely with Drug Y"), evidence summary, and communication venue (press release, testimony, etc.).  
  **Output:** Approval to assert as "known," requirement for hedging (e.g., "evidence suggests"), refusal to assert, or handoff for values-based deliberation.  
  **Time:** ≤15 minutes per claim.  
  **Roles:** Committee assesses evidence/stakes; Chair resolves ties or ambiguities.

  #### **Questions to Ask (in Order)**
  1. **What is the exact claim?**  
     - *Sufficient answer:* A single, testable statement (e.g., "Combining Drugs A and B increases stroke risk by ≥20%").  
     - *Insufficient:* Vague or compound claims. *Hand back for refinement.*

  2. **What is the objective strength of evidence?**  
     - *Sufficient answer:* Rate using a predefined scale (e.g.,):  
       - **Strong:** Replicated RCTs/meta-analyses; high statistical power; no conflicting evidence.  
       - **Moderate:** Single RCT/large observational study; minor methodological limitations.  
       - **Weak:** Preliminary/pilot data; small samples; unresolved contradictions.  
     - *Handoff point:* If evidence strength is disputed or requires expert reinterpretation.  

  3. **Who bears the primary risk if this claim is wrong?**  
     - *Sufficient answer:* Identify the actor (e.g., "patients taking the drugs," "regulators," "policymakers").  
     - *Handoff point:* If the risk-bearer is ambiguous or contested (values-based).  

  4. **What is the severity of harm if the claim is false?**  
     - *Sufficient answer:* Categorize stakes:  
       - **High:** Irreversible harm (death, permanent disability); major policy disruption.  
       - **Medium:** Reversible harm (e.g., temporary illness); moderate resource costs.  
       - **Low:** Minimal harm (e.g., inconvenience).  
     - *Handoff point:* If severity involves ethical tradeoffs (e.g., "Is $1M wasted funding 'high' or 'medium' harm?").  

  5. **Is the evidence strong enough for the stakes?**  
     - *Decision matrix:*  
       |                   | **High Stakes**     | **Medium Stakes**   | **Low Stakes**      |  
       |-------------------|---------------------|---------------------|---------------------|  
       | **Strong Evidence** | Hedge              | Assert as known    | Assert as known    |  
       | **Moderate Evidence** | Refuse/Hedge      | Hedge              | Assert as known    |  
       | **Weak Evidence**   | Refuse             | Refuse             | Hedge              |  
     - *Refusal to assert:* Returns "Do not assert as knowledge; use alternative framing (e.g., 'preliminary evidence')."  

  6. **Can hedging resolve the stakes-evidence gap?**  
     - *Sufficient answer:* If refusal/hedging applies, propose language (e.g., "may cause" instead of "causes").  
     - *Final handoff:* If hedging language implies value judgments (e.g., "acceptable risk").

  ---

  ### **Confronting the Two Matters**
  1. **"We may not say they know it" – Does this mean they *don’t know* it?**  
     - **Answer:** No. The procedure adopts **contextualism**: knowledge itself doesn’t vanish, but *asserting* "known" becomes inappropriate in high-stakes contexts because the *standards for claiming knowledge* rise.  
     - **What turns on this?**  
       - If "not known" = lack of knowledge (invariantism), you’d retract the claim entirely.  
       - Under contextualism, you **hedge** without retracting. E.g., in regulator testimony: "Evidence strongly suggests an interaction" (not "We know").  
       - *Next steps:* Hedge when stakes are high; reject only if evidence is objectively weak.

  2. **Whose stakes set the bar?**  
     - **Answer:** The stakes of **those who will act on the claim** (e.g., patients, regulators). Researchers’ stakes (e.g., grant renewal) are secondary.  
     - **Why?** Knowledge attributions protect *actors* from error. Researchers’ reputational/funding risks do not justify relaxing standards for others.  
     - *Exception:* If the venue *only* impacts researchers (e.g., internal grant review), their stakes apply.

  ---

  ### **Running the Procedure: Three Claims**
  #### **Claim 1: Drug Interaction (Regulator Testimony)**  
  - **Q1:** "Drug X + Drug Y increases acute kidney injury risk by 25%."  
  - **Q2:** *Strong evidence* (3 RCTs, pooled analysis).  
  - **Q3:** Risk-bearer = *Patients taking these drugs*.  
  - **Q4:** *High stakes* (organ failure, death).  
  - **Q5:** Strong evidence + High stakes → **Hedge**.  
  - **Q6:** "Our research establishes a significant association" (not "We know this causes harm").  
  - **Outcome:** Approved with hedging.

  #### **Claim 2: Same Finding (Grant Renewal)**  
  - **Q1:** Identical claim.  
  - **Q2:** *Strong evidence* (same as above).  
  - **Q3:** Risk-bearer = *Grant committee* (allocating funds).  
  - **Q4:** *Medium stakes* (financial waste if wrong; no direct patient risk).  
  - **Q5:** Strong evidence + Medium stakes → **Assert as known**.  
  - **Outcome:** Approved: "We know this interaction occurs."  

  #### **Claim 3: Your Invested Finding (Climate Policy Brief)**  
  - **Q1:** "Sea-level rise will displace 200M people by 2100."  
  - **Q2:** *Moderate evidence* (models agree, but key parameters uncertain).  
  - **Q3:** Risk-bearer = *Coastal communities/policymakers*.  
  - **Q4:** *High stakes* (mass migration, infrastructure costs).  
  - **Q5:** Moderate evidence + High stakes → **Refuse to assert as known**.  
  - **Outcome:** "Do not claim as knowledge; use 'projected' or 'likely'."  
  - **Why?** High stakes demand overwhelming evidence; models alone (even strong ones) may not suffice for "known" in policy contexts.

  ---

  ### **Can This Procedure Be Faithful to Stakes-Sensitivity?**  
  **Yes, but with a caveat:**  
  - **Faithful aspects:** It explicitly incorporates stakes and audience, accepts contextual assertion standards, and refuses to equate "not assertable here" with "false."  
  - **The compromise:** To be usable, it **operationalizes contextualism into fixed thresholds** (e.g., "high/medium/low" stakes). This risks *rigidifying* what is inherently fluid, but avoids paralysis.  
  - **What you give up:** Pure contextualism treats "knowledge" as infinitely variable; a committee-friendly procedure must discretize this into rules. You sacrifice philosophical nuance for consistency, auditability, and speed.  

  **Final recommendation:** This procedure makes your implicit reasoning explicit, reduces arbitrariness, and forces engagement with stakes. It will not satisfy a philosopher but will make your committee’s work defensible and transparent. For unresolved values conflicts (e.g., "How much harm is 'high stakes'?"), empower the Chair to make final calls post-consultation.  

  ---  
  **Chair’s Toolkit:**  
  - Predefine evidence/stakes scales (e.g., "High harm = death/permanent disability").  
  - Template answers for common scenarios (e.g., "Regulatory contexts = high stakes").  
  - Mandate a "hedging lexicon" (e.g., "known" → "well-supported"; "proven" → "observed").
