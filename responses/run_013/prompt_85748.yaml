          - We consider the closest world where Q is false. In that world:
               - At least one premise must be false (because the inference is valid).
               - Let Pi be such a premise. Condition 3 for Pi: if Pi were false, we would not believe Pi.
               - Therefore, in that world, we would not believe Pi, so we would not infer Q.
               - Therefore, we would not believe Q.

          BUT: this assumes that in the counterfactual world where Q is false, the method for Pi would have led us not to believe Pi. But what if the method for Pi is not sensitive to the particular way Q is false? 

          This is the same as the BIV problem. Therefore, we require that the analyst must identify which premise would be false in the closest world where Q is false and then show that condition 3 for that premise would hold in that world. 

          How? The analyst must consider: in the world where Q is false, would condition 3 for Pi still work? That is, if Pi were false in that world, would we not believe Pi? But note: in that world, Pi is false, and condition 3 for Pi says that we would not believe Pi. But condition 3 for Pi is a counterfactual that is evaluated with respect to the actual method for Pi? 

          The condition 3 for Pi is already satisfied in the actual world. But does it hold in the counterfactual world? That depends on whether the method for Pi is robust in that world. 

          This is very complex. We will require that the analyst must argue that the method for Pi is robust in the counterfactual world. If they cannot, then condition 3 for Q fails.

          Alternatively, we might assume that the method for Pi is robust across the relevant counterfactual worlds? 

          Given the time, we will make this a judgment call: the analyst must write a justification for condition 3 for Q. If the head of analysis approves, then we accept.

          Therefore, step 5.4: 
            - The analyst must provide a justification for condition 3 for Q by identifying the premise that would be false and arguing that we would not have believed that premise in the counterfactual world.
            - If the justification is accepted by the head of analysis (during sign-off), then condition 3 holds.

          If the justification is not provided or is weak, then condition 3 fails.

     5.5. If condition 3 fails, then we cannot assert Q. We might hand over to the head for risk appetite.

     5.6. If both conditions hold, then assert.

   Step 6: If at any point we cannot answer a condition or it fails and there's no handover, then we return "no basis to assert".

   Step 7: Handover to head of analysis for risk appetite when:
     - In step 3.3: condition 3 fails for a direct claim (so there's a risk of false positive) but the client wants the assertion and the head might accept the risk.
     - In step 5.5: condition 3 fails for a derived claim and the head might accept the risk.

   The head then decides based on the consequences of being wrong.

   Verdict labels:

    0. "Not applicable" - for future claims.
    1. "Do not assert" - if any condition fails and it is not handed over.
    2. "Assert" - if all conditions hold.
    3. "No basis" - if we cannot determine (e.g., we don't have enough information to evaluate a condition).
    4. "Hand over to head for risk appetite" - when there's a known failure of condition 3 and the risk appetite decision is needed.

   We now run the three cases:

   Case (a): 
     P: "The named shipping firm moves sanctioned cargo through a third-country port."

     This is a positive existence claim about concealed conduct.

     Step 1: present/past -> proceed.
     Step 2: direct evidence? Yes, a source plus documentary trail.
     Step 3:
          3.1. We believe P? Yes.
          3.2. Condition 4: If P were true, would we believe P? Yes, because we have the evidence.
          3.3. Condition 3: If P were false, would we not believe P? 
                - If the firm were not moving sanctioned cargo, would we still have the same evidence? 
                - The firm would conceal whether or not it is doing it. So if it were not doing it, it would still try to look like it is not doing it? But the evidence we have (source and documents) might be faked or misinterpreted. 
                - Specifically, if they are not doing it, they would not leave the documentary trail? Or they might leave a fake trail to deter? 
                - In the closest world where P is false, the firm is not moving sanctioned cargo. But they would still conceal. So they might plant fake evidence to suggest they are? Or we might have misinterpreted innocent documents. 
                - Therefore, we might still have the same evidence? Then condition 3 fails.

          Therefore, we hand over to the head for risk appetite.

     Verdict: Hand over.

   Case (b):
     The client's question: "Is the named port used for transshipment?"

     We want to avoid asserting the absence claim about reality because of concealment. Instead, we can assert a meta-claim.

     Option 1: Assess P: "The port is not used for transshipment."
          Step 1: present -> proceed.
          Step 2: direct evidence? We have found nothing. But we don't have a source that states P. So this is not a direct claim? Actually, it's an absence claim. We have no evidence for the positive. So we might treat it as a direct claim? Or as a derived claim? But it's not derived. It's an absence.

          We treat it as a direct claim? But what's the evidence? The evidence is that we looked and found nothing.

          So actually, we can reframe: we have direct evidence for the meta-claim: "We found no evidence that the port is used." 

          But the client's question is about the port, not about our evidence.

          We decide: we cannot assert P (the port is not used) because:

            Step 3 for P (the port is not used):
              3.1. We believe P? We might, based on the absence of evidence.
              3.2. Condition 4: If P were true (port not used), would we believe P? 
                    - Yes, because we looked and found nothing -> condition 4 holds.
              3.3. Condition 3: If P were false (port is used), would we not believe P?
                    - If the port is used, would we have found evidence? 
                    - But if the activity is concealed, we might not have found it -> condition 3 fails.

          So we cannot assert P.

          Instead, we can assert a meta-claim Q: "We have found no evidence that the port is used for transshipment."

          Now, we run step 3 for Q:

            Step 1: Q is a present claim about our evidence -> proceed.
            Step 2: direct evidence? Yes, we have our research log showing we found nothing.
            3.1. We believe Q? Yes.
            3.2. Condition 4: If Q were true (if there were no evidence), would we believe Q? 
                  - Yes, because we would look and find nothing and conclude Q.
            3.3. Condition 3: If Q were false (if there were evidence), would we not believe Q?
                  - If there were evidence, would we have found it? 
                  - That depends on the thoroughness of our search. 
                  - We must have done a thorough search. If we did, then we would have found it, so we would not believe Q -> condition 3 holds.

          Therefore, we can assert Q.

          But note: the client asked about the port, not about our evidence. We must be clear in the assessment.

          We can write: "We have found no evidence that the port is used for transshipment. However, due to the possibility of concealment, we cannot rule out that it is used."

          Or we can just state the meta-claim.

          The procedure allows asserting Q.

          The analysts want to publish "there is no evidence that the port is used for transshipment". That's Q. So they can.

          But note: if they haven't done a search, then condition 3 for Q fails: if there were evidence, they wouldn't have found it (because they didn't look) so they would still believe Q (that there is no evidence). So condition 3 fails.

          Therefore, we must have done a search.

          We require that the search is documented.

   Case (c): 
     P: "The ministry is systematically corrupt."

     This is inferred from twelve documented procurement irregularities.

     Step 1: present -> proceed.
     Step 2: direct evidence? No. So derived claim.
     Step 5:
          5.1. We have twelve premises, each an irregularity. We assume each is assertable (passed the procedure).
          5.2. The inference: twelve irregularities imply systematic corruption? This is not deductively valid. It is inductive. So we cannot use step 5? Then we must not assert by inference.

          But let's try to treat it as a direct claim? We have no direct evidence for systematic corruption.

          Alternatively, can we view the twelve irregularities as direct evidence for systematic corruption? Then we would be at step 3.

          Step 3 for P: 
            3.1. We believe P? Yes, because of the twelve irregularities.
            3.2. Condition 4: If P were true, would we believe P? Yes, because we would have found some irregularities? Not necessarily: we might have found more or less. But we found twelve. So condition 4 holds.
            3.3. Condition 3: If P were false, would we not believe P?
                  - If the ministry were not systematically corrupt, would we still have found twelve irregularities? 
                  - Yes, because they might be isolated incidents. So we would still believe P? Then condition 3 fails.

          Therefore, we cannot assert P.

          We hand over to the head for risk appetite? But note: the head might want to publish.

          However, the procedure says we cannot assert.

          So verdict: hand over for risk appetite.

   Summary of the procedure:

   1. Type of claim: 
        - Future? -> "Not applicable".
        - Otherwise, proceed.

   2. Direct or derived?
        - Direct: go to step 3.
        - Derived: go to step 5.

   3. Direct claim:
        3.1. Believe P? No -> "Do not assert".
             Yes -> next.
        3.2. Condition 4: If P true, would we believe P? 
             - For positive existence: usually yes if we have evidence.
             - For absence (reality): only if we have done a search.
             - No -> "Do not assert (risk of false negative)".
             - Yes -> next.
        3.3. Condition 3: If P false, would we not believe P?
             - Use default reference class: usual method for this claim type.
             - For positive existence (especially concealed): often fails.
             - For absence (reality): often fails if the activity is concealable.
             - If condition 3 holds -> "Assert".
             - If condition 3 fails -> "Hand over to head for risk appetite (risk of false positive)".

   4. Meta-claim about evidence (handled in step 3, but note special case for absence of evidence):
        - Must have done a search for condition 3 to hold.

   5. Derived claim:
        5.1. Each premise must be assertable (run this procedure on each). If any premise fails, then stop: "Do not assert".
        5.2. Is the inference deductively valid? 
             - No -> "Do not assert by inference (non-deductive)".
             - Yes -> next.
        5.3. Condition 4: If Q true, would we believe Q? -> Yes (by the inference) -> next.
        5.4. Condition 3: If Q false, would we not believe Q?
             - The analyst must identify which premise would be false and argue that we would not have believed that premise in that world.
             - If the argument is accepted by the head (at sign-off) -> "Assert".
             - Otherwise -> "Hand over to head for risk appetite".

   6. If at any point we cannot determine, then "No basis".

   One-paragraph version for analysts:

     "To assert a claim P, we must: 
       (1) believe P based on evidence; 
       (2) be such that if P were true, we would believe it (this usually holds if we have evidence or did a search for absences); 
       (3) be such that if P were false, we would not believe it (this often fails for concealed activities and absences of real-world events due to concealment). 
      For derived claims, we also require a deductive inference from assertable premises and an argument that in the world where the conclusion is false, we wouldn't have believed at least one premise. 
      If a critical condition fails, we hand over to the head for risk-based approval."

   Sign-off checklist for head of analysis:

     For each assessment:
       [ ] The claim is about the present or past.
       [ ] It is clear whether the claim is direct or derived.
       For direct claims:
          [ ] We believe the claim.
          [ ] Condition 4 holds (if true, we would believe: for absence, a search was done).
          [ ] Condition 3: 
               - If it holds, then approve.
               - If it fails, then decide based on risk appetite: [ ] Approve despite false positive risk? [ ] Do not approve.
       For derived claims:
          [ ] All premises are approved.
          [ ] Inference is deductive.
          [ ] Condition 4 holds (automatic).
          [ ] Condition 3: the analyst's argument for which premise would be false and why we wouldn't believe it in the counterfactual world is [ ] convincing [ ] not convincing.
               - If convincing, approve.
               - If not, then decide based on risk appetite: [ ] Approve despite false positive risk? [ ] Do not approve.

     Also:
          [ ] Any contested reference class for counterfactuals is recorded and justified.

   What the procedure cannot do:
     - It cannot guarantee truth (condition 1 is not checked).
     - It does not handle non-deductive inferences for derived claims (so many inductive conclusions are not assertable).
     - It may be too conservative, especially for derived claims and concealed activities.
     - The counterfactuals are judgment calls and may be subjective.
     - It does not eliminate the need for expert judgment, especially in steps 3.3 and 5.4.

   We accept that it has failure modes, especially:
     - It may fail to assert claims that are true and important (false negatives) due to condition 3 being too strict.
     - It may allow false positives when the head overrides for risk appetite.

   But it provides a structured way to think about tracking and makes the risks explicit.
