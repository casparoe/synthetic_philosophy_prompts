  We are implementing a procedure based on Nozick's tracking theory for knowledge, which requires four conditions for asserting P:
    1. P is true.
    2. We believe that P.
    3. If P were false, we would not believe that P.
    4. If P were true, we would believe that P.

   However, we cannot assume we know the truth value of P (condition 1) in advance. Therefore, the procedure must focus on the evidence and the counterfactual conditions (3 and 4). We also note that condition 1 is the goal, but we cannot verify it until after the fact. So we rely on the counterfactuals to track the truth.

   The procedure must address:
   (i) The reference class problem for the counterfactuals (conditions 3 and 4). We will use the following:
      - Default reference class: "Our desk's usual method applied to this type of claim with the same level of resources and time."
      - If an analyst or reviewer contests the reference class, they must record the alternative reference class and the reason. The choice of reference class turns on how sensitive we want the assessment to be to variations in the process. A narrower class (e.g., this analyst, this source) makes it harder to satisfy the counterfactuals (because small changes might lead to different beliefs) while a broader class (usual method) makes it easier.

   (ii) Closure under known entailment fails: We cannot automatically assert conjunctions or derived conclusions even if we can assert each premise. We must evaluate the conclusion separately.

   (iii) Concealed conduct vs. absence: 
      - For concealed conduct (like case a): Condition 3 (if P false, we wouldn't believe P) is hard to satisfy because if the conduct were false (i.e., not happening) the firm would still conceal (so we might still believe it). Condition 4 (if P true, we would believe P) is easier because if it's happening we have evidence (even if concealed, we might have found a leak). But condition 3 is the one that protects against false positives.
      - For absence (like case b): Condition 4 (if P true, we would believe P) is hard because if the port were used (P true) they would conceal, so we might not find it (so we might not believe P). Condition 3 (if P false, we wouldn't believe P) is easier because if it's not used, we would not find evidence and hence not believe it is used. Condition 4 protects against false negatives.

   Therefore, for concealed conduct, condition 3 is the critical one that may fail. For absence, condition 4 is the critical one that may fail.

   We design the procedure as a series of questions. We assume we are assessing a claim P.

   Procedure:

   1. Is P a claim about the present or past? (We do not assess future claims in this procedure.)
