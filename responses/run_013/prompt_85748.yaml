  ### Nozick-Tracking Assertion Procedure

  **Core Principle**: Assert P only if:
  1. P is true (goal, but not verifiable in advance).
  2. We believe P.
  3. If P were false, we would not believe P (*sensitivity*).
  4. If P were true, we would believe P (*adherence*).

  **Failure Modes Addressed**:
  - **(i) Reference Class**: Default is "our desk's usual method with standard resources/time." Contest by specifying a narrower class (e.g., "this analyst/source") in writing. Narrower classes make sensitivity (3) harder to satisfy; broader classes make it easier. Choice determines strictness of error control.
  - **(ii) Closure Failure**: Never assert conjunctions or derived conclusions automatically. Evaluate each claim independently.
  - **(iii) Concealed vs. Absence Claims**:
    - *Concealed conduct (e.g., sanctions evasion)*: Sensitivity (3) is the critical test (protects against false positives). Adherence (4) usually holds.
    - *Absence claims (e.g., no transshipment)*: Adherence (4) is critical (protects against false negatives). Sensitivity (3) often fails if concealment is possible.
    - *Evidence meta-claims (e.g., "no evidence")*: Both tests apply, but rely on documented search rigor.

  ---

  ### Numbered Procedure
  1. **Is P about present/past?**  
     → If no: Stop. **"Not applicable (future claim)."**  
     → If yes: Proceed.

  2. **Direct or derived?**  
     - **Direct**: Source/document explicitly states P. Go to Step 3.  
     - **Derived**: P inferred from other claims. Go to Step 5.

  3. **Direct claim checks**:  
     1. **Do we believe P?**  
        → If no: Stop. **"Do not assert."**  
        → If yes: Proceed.  
     2. **Adherence (4): If P true, would we believe P?**  
        - *Sufficiency*: Evidence would exist and our standard process would detect it.  
        - For **absence claims (e.g., "no transshipment")**: Must have conducted a documented search.  
        → If no: Stop. **"Do not assert (risk of false negative)."**  
        → If yes: Proceed.  
     3. **Sensitivity (3): If P false, would we not believe P?**  
        - *Sufficiency*: In closest world where P is false, evidence would differ and our process would detect this.  
        - **Concealed conduct**: Test if concealment would produce identical evidence even if P false.  
        → If yes (satisfied): **"Assert."**  
        → If no (fails): Flag. **"Handover: Risk appetite (false positive risk)."**  

  4. **Evidence meta-claim (e.g., "no evidence for X")**:  
     - Requires documented search scope/method.  
     - **Adherence (4)**: If no evidence exists, our search concludes "no evidence" → *Always holds with search*.  
     - **Sensitivity (3)**: If evidence existed, search would find it → *Holds only with rigorous search*.  
     → If both hold: **"Assert."**  
     → If sensitivity (3) fails: **"Do not assert (inadequate search)."**  

  5. **Derived claim checks (Q inferred from P₁, P₂, ...)**:  
     1. **Premises assertable?** Run Steps 1–4 for each premise.  
        → If any premise fails: Stop. **"Do not assert (weak premise)."**  
     2. **Deductive validity?**  
        → If no: Stop. **"Do not assert (non-deductive)."**  
     3. **Adherence (4) for Q**: If Q true, would we believe Q? → *Holds via inference*.  
     4. **Sensitivity (3) for Q**: If Q false, would we not believe Q?  
        - *Sufficiency*: Identify premise Pᵢ that would be false if Q false. Argue sensitivity (3) for Pᵢ holds *in Q-false world*.  
        → If justified: **"Assert."**  
        → If unjustified: Flag. **"Handover: Risk appetite (closure failure risk)."**  

  6. **Unresolved ambiguity?**  
     → If uncertainty in (3)/(4) not resolvable: **"No basis to assess."**  

  ---

  ### Verdict Ladder
  | **Label**                          | **Trigger**                                                                 |
  |------------------------------------|-----------------------------------------------------------------------------|
  | **Assert**                         | All conditions satisfied.                                                   |
  | **Do not assert**                  | Any condition fails without handover trigger.                               |
  | **Handover: Risk appetite**        | Sensitivity (3) fails (direct/concealed) or derived sensitivity unjustified. |
  | **No basis to assess**             | Unresolvable ambiguity in (3)/(4).                                         |
  | **Not applicable**                 | Future claim.                                                               |

  ---

  ### Analyst Cheat Sheet (Hold in Mind)
  > "To assert P:  
  > - **Believe it** based on evidence.  
  > - **If true, we’d know it** (adherence). For absences, you must have looked!  
  > - **If false, we’d know it’s false** (sensitivity). Hard for hidden stuff!  
  > - **For inferences**: Premises must pass alone, and if conclusion is false, we’d spot a false premise.  
  > - If sensitivity fails or inference is shaky, kick to the head.  
  > - No search? No evidence claim. No future claims."

  ---

  ### Sign-Off Checklist (for Head of Analysis)
  **Judgment Calls (Wearing Lab Coat)**:
  - [ ] Sensitivity (3) for concealed conduct (Step 3.3).
  - [ ] Derived claim sensitivity justification (Step 5.4).
  - [ ] Contested reference class (noted in audit log).
  - [ ] Risk appetite override (accept false positive risk?).

  **Mandatory Verification**:
  - [ ] Claim is present/past.
  - [ ] Direct/derived correctly classified.
  - [ ] Evidence search documented (for absence/meta-claims).
  - [ ] Premises independently verified (derived claims).
  - [ ] Deductive validity (derived claims).

  ---

  ### Known Failure Modes
  - **Cannot handle non-deductive inferences** (e.g., "systematic corruption" from isolated cases).  
  - **Over-conservative on concealed conduct** (sensitivity often fails; requires head override).  
  - **No protection against adversarial deception** (if source is compromised, tracking fails).  
  - **Risk appetite decisions are subjective** (procedure exposes but doesn’t resolve trade-offs).  

  ---

  ### Case Applications
  **(a) Shipping Firm Moves Sanctioned Cargo**  
  - P: "Firm moves sanctioned cargo." (Concealed conduct)  
  - Steps:  
    1. Direct claim → Step 3.  
    2. Believe P? **Yes** (source + docs).  
    3. Adherence (4)? **Yes** (if true, docs exist).  
    4. Sensitivity (3)? **Fail** (if false, firm still conceals → identical evidence).  
  - Verdict: **Handover: Risk appetite** (false positive risk).  
  - Error protected: False positive (sensitivity test bites).

  **(b) Port Transshipment Absence**  
  - Client wants: "Port not used for transshipment."  
  - We have: Searched, found nothing.  
  - Steps:  
    - *Absence claim (P₁)*: "No transshipment."  
      1. Direct claim → Step 3.  
      2. Adherence (4)? **Yes** (search conducted).  
      3. Sensitivity (3)? **Fail** (if used, concealment might hide it).  
      → **Do not assert**.  
    - *Evidence meta-claim (P₂)*: "No evidence of transshipment."  
      1. Meta-claim → Step 4.  
      2. Adherence (4)? **Yes** (search done).  
      3. Sensitivity (3)? **Holds** (if evidence existed, search would find it).  
      → **Assert P₂**.  
  - Error protected: False positive for P₁ (sensitivity bites); false negative for P₂ (adherence ensures search happened).

  **(c) Ministry Systematic Corruption**  
  - P: "Ministry is systematically corrupt." (Derived from 12 irregularities)  
  - Steps:  
    1. Derived claim → Step 5.  
    2. Premises assertable? **Yes** (each irregularity solid).  
    3. Deductive? **No** (12 instances → systematic is inductive).  
       - *If forced as direct claim*:  
          - Sensitivity (3)? **Fail** (if not corrupt, irregularities might still occur).  
          → **Handover: Risk appetite**.  
  - Verdict: **Do not assert** (non-deductive) or **Handover** if framed as direct claim.  
  - Error protected: False positive (sensitivity bites due to non-necessity of premises).  

  ---

  ### Final Note
  This procedure systematizes Nozick but **does not eliminate judgment**. It flags epistemic risks explicitly, forcing conscious trade-offs at handover points. Use it to *discipline* intuition, not replace it.
