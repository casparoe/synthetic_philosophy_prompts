  ### Flowchart for Moral Testimony Meetup  
  **Design Principle**: Questions-first, positions-second. Each node is a concrete case answerable without prior knowledge of positions. Positions are leaves.  

  #### Tree Structure:  
  1. **Start with the AI Case (c)**  
     *Case*: A perfectly calibrated AI (incapable of being praised or blamed, not answerable to anyone) tells you a specific act is morally wrong (e.g., "Lying to your friend in this situation is wrong"). You believe it. Do you now **know** it’s wrong, or do you only **believe** it?  
     - **Know** → Go to 2  
     - **Only believe** → Go to 3  

  2. **Human Testimony Case (a)**  
     *Case*: A reliable human (e.g., a trusted ethicist) tells you the same act is wrong. You believe them. Do you now **know** it’s wrong?  
     - **Know** → Go to 4  
     - **Only believe** → **Position: Unexplored** ("AI-Optimism" – testimony works for AI but not humans; unattractive to most, as AI lacks moral agency).  

  3. **Human Testimony Case (a)**  
     *Case*: The same reliable human tells you the act is wrong. You believe them. Do you now **know** it’s wrong?  
     - **Know** → Go to 5  
     - **Only believe** → Go to 6  

  4. **Generality Test Case (f)**  
     *Case*: The reliable human tells you a **general moral principle** (e.g., "Lying is wrong"). You believe them. Do you know the principle is true?  
     - **Know** → Go to 7  
     - **Only believe** → **Position: Unexplored** (Accepts testimony for particulars but not principles; unattractive, as principles ground particulars).  

  5. **Generality Test Case (f)**  
     *Case*: The reliable human tells you a **general moral principle**. You believe them. Do you know the principle is true?  
     - **Know** → **Position: Relational View** (Testimony works only if the testifier is part of your moral community/answerable to you).  
     - **Only believe** → **Position: Unexplored** (Relational Particularism – accepts testimony for particulars but not principles; incoherent if principles justify particulars).  

  6. **Generality Test Case (f)**  
     *Case*: The reliable human tells you a **general moral principle**. You believe them. Do you know the principle is true?  
     - **Know** → **Position: Principles View** (Testimony works for general principles, not particulars).  
     - **Only believe** → **Position: Pessimism** (Testimony never yields moral knowledge, only true belief).  

  7. **Understanding Case (b)**  
     *Case*: The reliable human **cannot explain why** the act is wrong (e.g., "I just know it’s wrong, but I can’t articulate why"). Does this lack of explanation mean you **no longer know** it’s wrong?  
     - **Yes** → **Position: Unexplored** ("Understanding-Required View" – knowledge demands grasp of reasons; incoherent, as testimony often precedes understanding).  
     - **No** → Go to 8  

  8. **Moral Worth Case (d)**  
     *Case*: You do the right thing **only because you were told to** (e.g., you refuse to lie solely on the AI’s/human’s advice). Is your action **diminished in moral worth** (even though it’s right)?  
     - **Yes** → **Position: Middle View** (Testimony yields knowledge but not understanding; action lacks full moral worth).  
     - **No** → **Position: Full Optimism** (Testimony is a standard source of moral knowledge, like perception).  

  ---

  ### Positions & Answers:  
  | Position             | Path in Tree                           | Notes |  
  |----------------------|----------------------------------------|-------|  
  | **Full Optimism**    | 1 (Know) → 2 (Know) → 4 (Know) → 7 (No) → 8 (No) | Testimony = standard knowledge source. |  
  | **Pessimism**        | 1 (Only) → 3 (Only) → 6 (Only)         | Testimony yields belief, never knowledge. |  
  | **Middle View**      | 1 (Know) → 2 (Know) → 4 (Know) → 7 (No) → 8 (Yes) | Know without understanding; moral worth diminished. |  
  | **Principles View**  | 1 (Only) → 3 (Only) → 6 (Know)         | General principles only; particulars inaccessible. |  
  | **Relational View**  | 1 (Only) → 3 (Know) → 5 (Know)         | Testifier must be in your moral community. |  

  ---

  ### Unresolved Cases & Notes:  
  1. **Case (e)**: *Trust vs. Intuition* – Omitted from the tree. It probes whether testimony overrides conflicting intuitions. This could be a discussion starter at any leaf but doesn’t cleanly distinguish positions.  
  2. **AI Case (c)**: Forces **no new position** but **collapses into existing ones**:  
     - If you reject AI testimony, you likely endorse the **Relational View** (answerability matters).  
     - If you accept it, you align with **Full Optimism** or **Middle View** (source-indifferent).  
     - *Exception*: "AI-Optimism" (Step 2) is unexplored and likely unstable.  
  3. **Unseparated Positions**:  
     - **Relational View** and **Full Optimism** can’t be split on understanding/moral worth. The tree prioritizes relationality over these nuances.  
  4. **Incoherent/Unattractive Paths**:  
     - **Understanding-Required** (Step 7): Demands explanation for knowledge; inconsistent with how testimony functions.  
     - **Particulars-Only** (Step 4/5): Accepts testimony for concrete cases but not principles; unworkable in practice.  
     - **AI-Optimism** (Step 2): Trusts non-answerable AI but not humans; practically and ethically dubious.  

  ### Key Insights:  
  - The **AI case** is a litmus test for the Relational View. If you reject AI testimony, you’re relational; if you accept it, you’re not.  
  - **Pessimism** and **Principles View** both reject testimony for particulars but diverge on general principles.  
  - **Full Optimism** and **Middle View** are separated solely by the moral worth of action (Step 8).  

  This tree forces participants to confront intuitions about authority, understanding, and moral community before labeling themselves. The AI case is pivotal but doesn’t require new positions—it sharpens existing divides.
