answer: |-
  ### Final Examination Question  
  **Graduate Seminar in Decision Theory and the Philosophy of Probability**  
  **Time Allowed: 90 minutes**  

  **Instructions:**  
  - This examination is closed-book. No literature or external resources are permitted.  
  - Answer the essay question below in a clear, structured, and concise manner.  
  - The question is self-contained: all necessary game definitions are provided.  
  - Your response must address all parts (i) to (vi).  

  **Games:**  
  Four games involve tossing a coin until the first heads appears. Tosses are independent. If the first heads occurs on toss \(n\), the payoff is:  
  - **Game A**: Fair coin (probability of heads = \(1/2\) on each toss). Payoff = \(+\frac{2^n}{n}\) if \(n\) is odd, \(-\frac{2^n}{n}\) if \(n\) is even.  
  - **Game B**: Fair coin. Payoff = \((-1)^{n-1} \cdot \frac{2^n}{n^2}\).  
  - **Game C**: Biased coin (probability of tails = \(q\), \(0 < q < 1\)). Payoff = same as Game A (\(+\frac{2^n}{n}\) for odd \(n\), \(-\frac{2^n}{n}\) for even \(n\)).  
  - **Game D**: Fair coin. Payoff = \(+\frac{2^n}{n}\) for all \(n\) (no sign change).  

  **Essay Question:**  
  Address all parts (i)–(vi) below.  

  (i) For Games A, B, and D, compute the expected payoff by summing the payoffs multiplied by their probabilities over the natural order of \(n\) (i.e., \(n = 1, 2, 3, \ldots\)). Classify each resulting series as absolutely convergent, conditionally convergent, or divergent. Do not consider Game C in (i).  

  (ii) Based on (i), explain what the convergence type implies for whether each game has a well-defined expected value. Specifically:  
  - For Game A, provide an explicit recipe for reordering the outcomes so that the partial sums of the expected payoffs converge to a target of your choice (state the target).  
  - Explain why no analogous reordering can make Game D’s expectation converge to a finite value.  

  (iii) Game B has unbounded payoffs (i.e., as \(n\) increases, the absolute payoff grows without bound). Explain why its expectation is nevertheless well-defined, and why this shows that bounded payoffs are not essential for a well-defined expectation.  

  (iv) Game D pays at least as much as Game A in every outcome (strictly more for even \(n\)). Thus, Game D dominates Game A. However, if Game A lacks a well-defined expectation, expected utility maximization may not compare them. Defend a position: in this case, is dominance reasoning or expected utility the better guide for preference? Justify your view.  

  (v) One response is that if utility is bounded, these problems vanish. Assess whether this resolves the issue or merely relocates it. Consider if bounded utility handles the challenges posed by these games and whether it introduces new difficulties.  

  (vi) Overall, do these games refute expected utility theory, show it is incomplete, or indicate it is inapplicable? Justify your verdict. Do not simply summarize the St. Petersburg paradox.  

  ---  
  ### Model Answer (Approx. 900 words)  

  **(i) Expectation Computation and Convergence Classification**  
  For each game, the probability of heads first appearing on toss \(n\) is \(\left(\frac{1}{2}\right)^n\) (fair for A, B, D). The expectation is the series \(\sum_{n=1}^{\infty} \text{probability} \times \text{payoff}\).  

  - **Game A**:  
    Payoff alternates: \(+\frac{2^n}{n}\) (odd \(n\)), \(-\frac{2^n}{n}\) (even \(n\)).  
    Expectation: \(\sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot \begin{cases} +\frac{2^n}{n} & n \text{ odd} \\ -\frac{2^n}{n} & n \text{ even} \end{cases} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n}\).  
    This is the alternating harmonic series. It converges to \(\ln 2\) by the alternating series test, but diverges absolutely because \(\sum \frac{1}{n}\) (harmonic series) diverges. Thus, **conditionally convergent**.  

  - **Game B**:  
    Payoff: \((-1)^{n-1} \frac{2^n}{n^2}\).  
    Expectation: \(\sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot (-1)^{n-1} \frac{2^n}{n^2} = \sum_{n=1}^{\infty} (-1)^{n-1} \frac{1}{n^2}\).  
    Absolute series: \(\sum \left| (-1)^{n-1} \frac{1}{n^2} \right| = \sum \frac{1}{n^2}\), a convergent \(p\)-series (\(p=2 > 1\)). Thus, **absolutely convergent**.  

  - **Game D**:  
    Payoff: \(+\frac{2^n}{n}\) for all \(n\).  
    Expectation: \(\sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{1}{n}\).  
    This is the harmonic series, which diverges to \(+\infty\). Thus, **divergent**.  

  **(ii) Implications for Well-Defined Expectation and Reordering**  
  - **Game A**: Conditional convergence implies the expectation is **not well-defined** in the Lebesgue sense. The Riemann rearrangement theorem allows reordering terms to converge to any real number or diverge. For example, to converge to \(0\): accumulate positive terms (odd \(n\)) until the partial sum \(\geq 0\), then add negative terms (even \(n\)) until the sum \(\leq 0\), repeating ad infinitum. The partial sums oscillate and converge to \(0\).  
  - **Game B**: Absolute convergence implies the expectation is **well-defined** and invariant under reordering.  
  - **Game D**: Divergence implies the expectation is **infinite** (\(+\infty\)). No reordering rescues it to a finite value because all terms are positive and \(\sum \frac{1}{n}\) diverges; any rearrangement of a divergent positive series still diverges.  

  **(iii) Unbounded Payoffs in Game B**  
  Game B’s expectation is well-defined despite unbounded payoffs because its absolute series \(\sum \frac{1}{n^2}\) converges. This shows that bounded payoffs are **not the crux**: absolute convergence (rapid decay of terms) matters, not boundedness. For example, \(\frac{2^n}{n^2} \to \infty\) as \(n \to \infty\), but the \(\frac{1}{n^2}\) decay dominates the exponential growth when scaled by probability. Thus, well-defined expectations can exist for unbounded payoffs if the series converges absolutely.  

  **(iv) Dominance vs. Expected Utility**  
  Game D dominates Game A: for every \(n\), Game D’s payoff \(\geq\) Game A’s (strictly > for even \(n\)). Expected utility maximization falters because Game A’s expectation is undefined, while Game D’s is \(+\infty\). Dominance reasoning clearly favors Game D, as it is statewise superior. This makes dominance the **better guide** here. Expected utility relies on a linear order (Lebesgue integral) that fails for non-absolutely convergent cases, but dominance depends only on outcome-wise comparisons, which are unambiguous. Reordering affects expected utility calculations (e.g., making Game A converge to \(0\) or \(100\)), but dominance holds for any ordering since payoffs are compared per outcome. Thus, dominance is robust where expected utility is silent.  

  **(v) Bounded Utility Response**  
  Assuming utility is bounded (e.g., \(|u(\text{payoff})| \leq M\)) resolves the convergence issue: expectations become absolutely convergent because \(| \text{probability} \times u(\text{payoff}) | \leq M \left(\frac{1}{2}\right)^n\), and \(\sum M \left(\frac{1}{2}\right)^n\) converges. Thus, Games A, B, D would have well-defined expectations. However, this **merely relocates** the problem. Bounded utility is empirically questionable (e.g., it violates risk neutrality for large stakes) and theoretically restrictive. It avoids non-integrability by fiat but does not address whether we *should* bound utility; it shifts the debate to justifying bounds. Moreover, bounded utility may introduce new problems, such as rejecting intuitively rational choices over unbounded goods (e.g., humanitarian interventions with unbounded impacts). The core issue—how to handle non-absolutely convergent expectations—is sidestepped, not solved.  

  **(vi) Verdict on Expected Utility Theory**  
  These games do **not refute** expected utility theory but show it is **inapplicable** to non-integrable random variables. The theory requires absolute convergence for the Lebesgue integral to be well-defined; Games A and D violate this. This is a limitation of scope, not an internal flaw. The theory remains valid for integrable cases (e.g., Game B). Calling it "incomplete" overstates the issue: the problem arises from mathematical constraints (non-absolutely convergent series), not a gap in the theory’s axioms. We could extend expected utility using conditional convergence (e.g., fixing the natural order), but this is arbitrary—reorderings yield different "expectations." Thus, the theory is best seen as inapplicable here, and alternatives (e.g., dominance) must supplement it.  

