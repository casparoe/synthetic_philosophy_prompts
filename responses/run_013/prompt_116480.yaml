prompt: |-
  For much of the twentieth century, and in many hospitals well into the 1980s, surgeons routinely performed major operations on newborns with minimal or no anaesthesia; where a drug was given, it was often a neuromuscular blocker that abolished movement and crying without dulling sensation. The justifications offered were a mixture of physiology and inference: that the neonatal nervous system was too immature to register pain, that what looked like distress was reflex rather than experience, and that even if something were felt it would not be remembered. From the late 1970s the practice came under sustained attack — through measurements of stress-hormone and other physiological responses, through parents' accounts, and through a growing clinical literature on neonatal pain — and it was progressively abandoned, with professional bodies conceding by the end of the 1980s that newborns feel pain.

  Treat this episode as a case in the problem of other minds, and work it in both directions.

  First, run the episode through the standard positions on how we can know that another being has a mind: the argument from analogy, the criterial or behavioural view, inference to the best explanation, simulation, and the dissolutionist view that the sceptical problem is a confusion. For each, say what it tells the clinicians they had and what it licenses them to do. Two features of the case deserve particular attention: the argument from analogy runs on a single case, one's own, whereas the clinicians' reasoning ran in the opposite direction, from the absence of expected behaviour to the absence of a mind; and the muscle relaxant removed precisely the behavioural criteria on which a criterial view would have relied, leaving the infant's inner life to be settled by physiology and by whoever held the authority to interpret it.

  Second, say which features of the episode each position explains and which it distorts or misses. I am interested especially in the burden of proof — the clinicians treated absence of evidence as evidence of absence — in the infant's inability to report as both the crux of the epistemic problem and the very condition that made the practice possible, and in the difference between the question of whether the infant has experiences and the question of what one may do while unsure.

  Third, say what the episode shows about the theory in turn: whether it favours any one of the positions, whether it exposes a gap between the sceptical and the practical versions of the problem, and what it suggests about the idea that attributing pain requires the capacity to report it.

  Finally, be explicit about where the theory is silent — about action under uncertainty, about the asymmetry of power between the attributor and the being whose mind is in question, and about whether the problem of other minds should be framed as a demand for certainty or as a demand for justification.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating of the question.
