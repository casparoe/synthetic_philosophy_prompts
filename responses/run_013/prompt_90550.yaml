prompt: |-
  I'm in a fortnightly reading group on moral uncertainty and we've hit a wall. Two of us have been having the same fight for about six sessions now and it's starting to feel less like disagreement and more like the two of us talking past each other. She's what I'd call a formalist: she thinks that once you grant that a sane, well-informed agent can be genuinely torn between two moral theories -- not torn about the facts, torn about which theory is right -- you need some machinery for deciding what to do in that state, and that the natural machinery is maximising expected choiceworthiness (or a refinement of it that builds in some caution about moral risk), with the awkwardness of comparing amounts of choiceworthiness across theories being a hard technical problem rather than a reductio of the whole project. He's the sceptic: he thinks the project is either empty or built on a fiction. His line is that without intertheoretic comparisons you end up with something that just tells you to follow whichever theory you find most probable, and that if you supply the comparisons by hand you can get any verdict you like out of the same case by fiddling with the normalisation, so the decision theory is never what's really doing the work. He thinks the honest response to not knowing which theory is right is a lot less formal -- get clearer about your own moral beliefs, be humble about your track record, be careful with the irreversible stuff, and let practical wisdom mop up. For what it's worth I'm somewhere between them, which is how I got nominated to write this up.

  I'd like you to take the role of a philosopher who works on normative uncertainty and is unusually good at forcing precision out of people who are gesturing at each other, and draft the joint statement the two of them could actually both put their names to. Start with a numbered list of claims both sides accept: about what moral uncertainty is and isn't, about what any adequate response to it would have to do, about which objections are live and which are cheap shots, and about the cases where they agree the formalist's machinery gets the right answer and the sceptic's misgivings don't bite. Then a disagreements table. For each remaining dispute, give the precise statement of the disagreement in wording that each side would accept as fair to its own view -- this matters more than anything else in the document, I want formulations that are neither vacuous nor quietly loaded toward one side -- then the crux underneath it, then the case, argument or piece of evidence both sides agree would bear on that crux, and then, recorded seperately, what each side predicts about it. If some part of the fight turns out to be merely verbal, say which part and why, and don't be diplomatic if you think one of them is really making two claims and sliding between them.

  Three things I'd like the document to confront head-on, because they're what keep derailing us. First, a case where one of the theories you're uncertain between is itself a theory of how to act under moral uncertainty, so whatever rule you adopt has to be applied to itself -- if the sceptic's view gets non-trivial credence, what does the formalist's rule say to do then? Second, a case where one candidate theory assigns infinite or lexically prior value to something, so that even a small credence in it swamps every other consideration and the expected-choiceworthiness verdict comes out absurd. Third, a case where the theories agree completely on how to rank the options but disagree about what the units on the scale mean, so that the only thing left to fight over is the normalisation. These three are our own inventions, so don't worry about whether they're realistic -- just say what each side's machinery does with them. Take your time and brainstorm the candidate cruxes before you start drafting; the whole value here is in the formulations. Don't pad it out with literature -- I know the literature, I want the document, and no reading lists or citations please, they're no use to me here. British English throughout, our department is pedantic about it.
reasoning: |-
  Okay, let me unpack this request carefully. The user is in a fortnightly reading group stuck in a loop between two positions on moral uncertainty: a formalist advocating for expected choiceworthiness maximisation and a sceptic rejecting the formal approach. They need me to act as a neutral philosopher to draft a joint statement that forces precision. 

  First, I need to identify the core common ground. Both sides clearly agree that moral uncertainty exists as a distinct phenomenon from factual uncertainty, and that it requires some response beyond just following the most probable theory. The formalist's insistence on needing "machinery" and the sceptic's appeal to "practical wisdom" both acknowledge that. They also likely agree that intertheoretic comparisons are problematic - the formalist sees it as a technical challenge while the sceptic considers it fatal.

  The three derailing cases need special handling. For the self-referential case where a theory incorporates moral uncertainty: the formalist would see this as nested calculations, while the sceptic would cry regress. The infinite value case exposes the formalist's vulnerability to fanaticism, which the sceptic would pounce on as absurd. The normalisation case is trickiest - if theories only disagree on units, any normalisation seems arbitrary, which guts expected choiceworthiness of substance. 

  I should structure the disagreements as precise, neutral statements. For example: "Disagreement 1: Whether a computable decision procedure for moral uncertainty can produce action-guidance that isn't either (a) equivalent to following the theory with highest credence or (b) dependent on arbitrary normalisation choices." Underneath, the crux is whether the infinite value case forces option (a). The formalist would argue for refinements like variance-sensitivity, while the sceptic maintains it collapses.

  For the self-referential case, the key is whether the formalist's rule can avoid either inconsistency or trivialisation when applied to itself. The sceptic will predict either circularity or paralysis. 

  The language must be meticulously balanced - no sneaking in "so-called" or "merely" that prejudices the reader. British English throughout, as requested. And absolutely no literature references - this is about crystallising their own arguments.

  The joint statement should start with numbered agreements to build goodwill, then move to the disagreement table with cases as testing grounds. Where positions slide (e.g. sceptic sometimes claims the project is empty, sometimes that it's non-action-guiding), I'll call it out sharply. The value here is in formulations they both accept as fair, even if uncomfortable.
answer: |-
  ## Joint Statement on Moral Uncertainty: Areas of Agreement & Disagreement (Draft for Signatories)

  **Preamble:** This document seeks to clarify the core agreements and unresolved disagreements between the Formalist (F) and Sceptic (S) positions regarding normative uncertainty. It aims for formulations acceptable to both sides, identifies testing grounds for key disputes, and addresses specific derailing cases.

  ### Part 1: Points of Agreement
  Both parties endorse the following claims:

  1.  **Moral Uncertainty Exists:** Sane, well-informed agents can experience genuine, non-factual uncertainty about which fundamental moral theory (e.g., Utilitarianism, Kantianism, Virtue Ethics) is correct.
  2.  **Distinct from Factual Uncertainty:** This normative uncertainty is conceptually distinct from uncertainty about empirical facts relevant to applying a *given* moral theory.
  3.  **Requires a Response:** Merely acknowledging uncertainty is insufficient for action-guidance; agents need *some* principle(s) for deciding what to do under normative uncertainty.
  4.  **Non-Triviality Requirement:** An adequate response must be capable of generating non-trivial action-guidance in some cases – it cannot *always* prescribe following the single theory assigned the highest credence when credence is split.
  5.  **Intertheoretic Comparison is Problematic:** Comparing the "amount" or "units" of choiceworthiness (e.g., utility, deontic weight) across fundamentally different moral theories is deeply challenging and lacks an obvious, non-arbitrary solution. This is a central difficulty for formalist approaches.
  6.  **Sceptic's Concerns are Live:**
      *   The "normalisation problem" (sensitivity to how choiceworthiness scales are calibrated) poses a significant, non-trivial challenge to formalist proposals.
      *   The potential for "fanaticism" (small credences in theories with extreme lexical/infinite priorities swamping other considerations) is a serious issue needing address.
  7.  **Agreement Cases Exist:** Both agree that in specific cases, the formalist machinery yields plausible results and S's misgivings seem less forceful. These typically involve:
      *   **Intra-theoretic Uncertainty:** Uncertainty about parameters *within* a single, agreed-upon *type* of theory (e.g., uncertain discount rates within Utilitarianism) where comparison is unproblematic.
      *   **Dominance Cases:** Where one option is deemed permissible by all theories held with credence, or impermissible by all theories held with credence.
      *   **Shared Cardinal Structure:** Cases where competing theories, though differing in fundamental justifications, fortuitously agree on the *cardinal* structure of choiceworthiness over options for the specific choice context (e.g., both theories rank options A, B, C in the same order *and* agree on the relative distances between them on their scales), rendering normalisation less critical (though not irrelevant).

  ### Part 2: Disagreements Table

  | Disagreement # | Precise Statement of Disagreement                                                                                                                  | The Crux                                                                                                                                 | Testing Ground / Evidence                                                                                                                               | Formalist (F) Prediction                                                                                                 | Sceptic (S) Prediction                                                                                                                                   |
  | :------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Action-Guidance Potential** | Whether a formal decision rule (like Maximising Expected Choiceworthiness - MEC - or refinement) can provide *non-trivial, non-arbitrary* action-guidance in cases of *genuine fundamental normative uncertainty* involving theories with *incommensurable structures*. | Can the formalist machinery overcome the normalisation problem and the threat of fanaticism to deliver substantive guidance that isn't either equivalent to following the highest-credence theory or demonstrably sensitive to arbitrary scaling choices in a way that undermines its objectivity? | **The Lexical Priority Case:** <br>Option A: Saves 1 billion lives (Theory X: Utilitarian, assigns finite value per life). <br>Option B: Has a 0.0001% chance of preventing infinite suffering in all possible worlds (Theory Y: Negative Utilitarian variant assigning infinite negative value to suffering, even probabilistic). <br>Credence: 80% in X, 20% in Y. What does MEC prescribe? | F: Predicts MEC (or a refined version like Variance Voting or a lexical threshold) *can* avoid absurd prescriptions (e.g., ignoring the near-certainty of saving 1bn lives). Refinements *can* manage fanaticism. The problem is technical, not fatal. | S: Predicts MEC, absent arbitrary restrictions, *must* prescribe Option B due to the infinite stakes overwhelming the finite ones under Y, regardless of low credence. This reveals the formalism's inability to handle deep incommensurability non-arbitrarily. Refinements either collapse to highest credence or introduce new arbitrariness. |
  | **2. Role & Efficacy of Formalism** | Whether the formalist project provides a *distinct and necessary* decision procedure for normative uncertainty, or whether S's proposed "practical wisdom" approach (clarity, humility, caution, wisdom) is *sufficient* and the formalist machinery is either redundant, empty, or misleading. | Does the formalist machinery add substantive, reliable guidance beyond what can be achieved by S's informal virtues, particularly in resolving dilemmas where theories conflict sharply? | **The Normalisation-Only-Disagreement Case:** <br>Theories U1 and U2 are both preference-satisfaction utilitarians. They agree completely on the *ordinal ranking* of all options in a given choice set (A > B > C > D). They also agree on the *ratio* of differences in choiceworthiness between options (e.g., U1(A)-U1(B) = 2*(U1(B)-U1(C)) and U2(A)-U2(B) = 2*(U2(B)-U2(C))). They *only* disagree on the *zero point and unit* of their utility scales. Credence: 50/50. What does MEC prescribe? | F: Predicts MEC *can* prescribe a specific option if normalisation is handled via a non-arbitrary method (e.g., range voting, variance normalisation). The agreement on ratios provides enough structure. The prescription is non-trivial and distinct from highest credence (which offers no guidance here). | S: Predicts any normalisation method (range, variance, etc.) is *inherently arbitrary* in this case, as there is no intertheoretic fact to anchor it. Different reasonable methods *will* yield different prescriptions (e.g., A vs. B). MEC adds no real guidance; practical wisdom is needed to decide how to weigh the theories' *perspectives*. |
  | **3. Self-Application** | Whether a formal decision rule for normative uncertainty can be coherently and usefully applied when the agent assigns non-zero credence to theories that *themselves* incorporate principles for handling normative uncertainty (including S's own informal view). | Can the formalism avoid vicious circularity, infinite regress, or trivialisation when the rule must be applied to itself or to theories that potentially subsume it? | **The Sceptical Credence Case:** <br>Agent has 70% credence in Theory T (a standard moral theory, say Kantianism). <br>Agent has 30% credence in Theory S* (a formalisation of S's view: "Under normative uncertainty, use Practical Wisdom (PW)"). <br>PW, as understood by S, is inherently informal and resistant to formal codification. What does MEC (or F's preferred rule) prescribe the agent do *now*, given this uncertainty? How does PW handle being part of the uncertain set? | F: Predicts (a) MEC can assign choiceworthiness to acting *according to PW* based on the expected choiceworthiness *under PW itself*, or (b) PW can be treated as a "meta-theory" whose prescriptions for the first-order choice are evaluated. It requires modelling S* carefully, but it's tractable. The rule applies consistently. | S: Predicts applying MEC leads to incoherence. (i) How does one calculate the "choiceworthiness" of following PW *within the MEC framework*? PW explicitly rejects such calculation. (ii) PW, if followed, would *not* employ MEC for this decision (it would use PW!). The formalism either misrepresents S* or collapses. Applying PW consistently means it wouldn't use MEC just because it has credence in it. |

  ### Part 3: Addressing Specific Derailers

  1.  **Self-Application (Sceptical Credence):**
      *   **Formalist Approach:** Treats S* ("Use PW") as a theory that outputs a recommended action for the first-order choice. MEC calculates the *expected choiceworthiness* of an option O by: (Credence_T * Choiceworthiness_T(O)) + (Credence_S* * Choiceworthiness_S*(O)). Choiceworthiness_S*(O) is defined as the value S* assigns to O. If S* uses PW to evaluate O, F must model what PW says about O. *Crucial Claim:* PW's evaluation *can* be represented as a choiceworthiness function for O, even if PW itself isn't calculative. F must then normalise T and S*'s scales. Result: A specific MEC verdict.
      *   **Sceptic's Rejection:** This fundamentally mischaracterises PW. PW isn't a function outputting scalar values for options; it's a deliberative *process* resistant to formal encoding. Assigning "Choiceworthiness_S*(O)" is a fiction. Further, *if* the agent genuinely followed S*/PW, they would *not* run MEC; they would deliberate using PW, which might well *ignore* the 30% credence in S* when deciding whether to use MEC! Applying MEC here involves a performative contradiction or misrepresentation. The formalism cannot coherently subsume a view that rejects the formalism's core methodology. **Verbal/Conceptual Slide:** F is sliding between "Theory S*" (a proposition) and "the process PW". S* *claims* "Use PW", but PW itself isn't a theory with a choiceworthiness function; it's a practice. F treats the *output* or *evaluation* of PW *as if* it were such a function, which S denies is possible or meaningful without distortion.

  2.  **Lexical Priority / Infinite Value:**
      *   **Formalist Approach:** Acknowledges the problem. Proposes refinements: (a) **Thresholds:** Ignore theories with infinite stakes below a certain credence threshold (but setting threshold is arbitrary). (b) **Variance Sensitivity:** E.g., "Maximize Expected Choiceworthiness minus some function of Variance" (prioritises options less sensitive to which theory is true). (c) **Lexical Caution:** Apply a lexical priority *to the decision rule itself* (e.g., first avoid options condemned by any theory above threshold X, *then* apply MEC). **Claim:** These avoid absurdity while retaining formalism.
      *   **Sceptic's Rejection:** Refinements (a) & (c) introduce new arbitrariness (setting thresholds). Refinement (b) (variance) often collapses to favouring the theory with highest credence or simplest structure, failing to genuinely integrate the minority view meaningfully. The core problem remains: formal comparison demands a common currency, which is lacking when stakes are infinitely incommensurable. The "absurd" result (Option B in the case) reveals the formalism's inadequacy, not just a technical glitch. PW would recognisably prioritise the billion lives.

  3.  **Normalisation-Only Disagreement:**
      *   **Formalist Approach:** Argues methods like range voting (scale each theory so its best option=1, worst=0 in the choice set) or variance normalisation (scale so all theories have equal variance over options) provide *non-arbitrary* solutions given the agreement on ratios. MEC then yields a specific ranking (likely sensitive to the normalisation method, but F claims the methods are reasonable).
      *   **Sceptic's Rejection:** Agreement on ratios *within* a theory does not imply agreement *across* theories. Choosing range or variance normalisation is fundamentally arbitrary – why not min-max z-scores? Why normalise over *this* choice set? Different methods *will* produce different prescriptions (e.g., normalising range might favour A, normalising variance might slightly favour B). This sensitivity proves the verdict depends on an arbitrary user choice, not intertheoretic facts. PW would recognise the theories concur on substance and choose based on other relevant factors (precedence, ease of implementation, etc.), rendering MEC otiose and potentially misleading by creating pseudo-precision.

  ### Conclusion
  This statement clarifies that F and S agree on the *existence* and *distinctness* of normative uncertainty and the *need* for a response, while recognising the *serious challenges* of intertheoretic comparison, normalisation, and fanaticism. The core disagreements concern the *feasibility* and *added value* of a formal decision procedure (MEC/refinements) versus the *sufficiency* of an informal practical wisdom approach, particularly in cases of deep incommensurability (Lexical Case), purely scalar disagreement (Normalisation Case), and self-referential uncertainty (Sceptical Credence Case). The testing grounds and analyses of the derailing cases provide focal points for resolving whether formalism can overcome arbitrariness and incoherence to provide unique, reliable guidance, or whether S's critique of its emptiness or instability holds. Both positions require further refinement to fully address these test cases without evasion.

  ---
  **Key Features of this Draft:**

  1.  **Precise, Neutral Formulations:** Disagreement statements are worded to capture the core contention without loading (e.g., "non-trivial, non-arbitrary", "distinct and necessary" vs. "sufficient", "overcome... to deliver substantive guidance").
  2.  **Explicit Cruxes:** Identifies the pivotal question separating the views for each disagreement.
  3.  **Concrete Testing Grounds:** Uses the user's specific derailing cases as the primary evidence/grounds for resolving the cruxes.
  4.  **Specific Predictions:** Forces F and S to state what their view *says will happen* in the test cases.
  5.  **Head-On Derailer Confrontation:** Provides explicit, separate analysis for each derailing case from both perspectives.
  6.  **Calling Out Slides:** Explicitly identifies the conceptual slide in the Self-Application case regarding representing PW.
  7.  **British English:** Adheres to requested spelling/conventions.
  8.  **No Padding/Literature:** Focuses solely on clarifying the internal group debate structure.

  **Next Steps for the Group:** Use this document as a basis. For each Disagreement row and Derailer analysis, discuss:
  *   Is the statement of our position *exactly* right?
  *   Does the "Crux" capture the fundamental point of contention?
  *   Is the Testing Ground/Case described fairly and completely?
  *   Is our "Prediction" accurate for what our view entails?
  *   Does the analysis of the derailers correctly represent our reasoning and objections?

  This should force engagement with the *substance* of the disagreement at the required level of precision. Good luck breaking the wall!
