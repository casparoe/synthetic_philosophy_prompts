  ### Diagnostic Decision Tree for the Species Problem

  **Q1:** When you observe a ring species (e.g., *Ensatina* salamanders) where populations interbreed locally but not at the endpoints, is this variation best described as:  
  (A) A single species with internal structure, because "species" captures a real boundary in nature?  
  (B) Arbitrarily divisible units, because "species" is a human construct for convenience?  

  - **If (B):**  
    **Q1a:** Should biologists eliminate "species" as a fundamental category altogether?  
    - **Yes → Eliminativist**  
      *Most awkward commitment: Must replace entrenched species-based practices (e.g., conservation, legislation) with entirely new frameworks.*  
    - **No → [Unoccupied: Conventionalist]**  
      *Diagnosis: Coherent but unattractive; few defend partitioning without *any* natural basis.*  

  - **If (A):**  
    **Q2:** Consider an asexual rotifer lineage: Is it a "species" only if:  
    (A) It shares defining traits (kind), like morphology or genetics?  
    (B) It is a unique historical entity (individual), like a branch on the tree of life?  

    - **If (A) [Kind]:**  
      **Q3:** When evidence conflicts (e.g., hybridizing oaks that are morphologically distinct but interbreed), prioritize:  
      - **Interbreeding → Interbreeding-based concept**  
        *Most awkward commitment: Must either exclude asexual organisms from species status or redefine them anomalously.*  
      - **Monophyly → [Unoccupied: Incoherent for kind ontology]**  
        *Diagnosis: Incoherent—monophyly requires historical particularity, incompatible with kind-based universals.*  
      - **Ecological role → Ecological concept**  
        *Most awkward commitment: Must split interbreeding populations if niches differ (e.g., host-specific parasites) or merge distinct lineages if niches align.*  
      - **Diagnosable difference → [Unoccupied: No defined position]**  
        *Diagnosis: Unexplored—pure diagnosability without process is rarely defended.*  
      - **Convergence of criteria → Unificationist**  
        *Most awkward commitment: Must dismiss ring species/hybrid zones as "incomplete" divergence, not true conflicts.*  
      - **Context-dependent criteria → Pluralist**  
        *Most awkward commitment: Must choose among concepts situationally without a meta-criterion, risking arbitrariness.*  

    - **If (B) [Individual]:**  
      **Q2a:** Do you endorse a specific concept for identifying species lineages?  
      - **No → Species are individuals**  
        *Most awkward commitment: Cannot treat species as subjects of natural laws (e.g., "species evolve") since particulars lack repeatability.*  
      - **Yes → Q3:** When evidence conflicts, prioritize:  
        - **Interbreeding → [Unoccupied: Incoherent for individuals]**  
          *Diagnosis: Incoherent—interbreeding defines classes, not historical particulars.*  
        - **Monophyly → Monophyly-based concept**  
          *Most awkward commitment: May "split" populations with minor differences (e.g., island endemics) despite gene flow.*  
        - **Ecological role → Ecological concept**  
          *Most awkward commitment: Must split interbreeding populations if niches differ or merge distinct lineages if niches align.*  
        - **Diagnosable difference → [Unoccupied: No defined position]**  
          *Diagnosis: Unexplored—diagnosability alone ignores lineage historicity.*  
        - **Evolutionary trajectory → Evolutionary-lineage concept**  
          *Most awkward commitment: Accepts fuzzy temporal boundaries (e.g., when does a chronospecies become "new"?) and cryptic diversity.*  
        - **Convergence of criteria → Unificationist**  
          *Most awkward commitment: Must dismiss ring species/hybrid zones as "incomplete" divergence, not true conflicts.*  
        - **Context-dependent criteria → Pluralist**  
          *Most awkward commitment: Must choose among concepts situationally without a meta-criterion, risking arbitrariness.*  

  **Q4 (For all except Unificationist/Pluralist/Eliminativist/Species-as-individuals):** Should your concept apply uniformly to:  
  - Bacteria (prone to lateral gene transfer)?  
  - Asexual eukaryotes (e.g., bdelloid rotifers)?  
  - Hybridizing complexes (e.g., *Quercus* oaks)?  

  - **Yes →** Position requires universality.  
    - *Interbreeding-based*: **[Unoccupied]**. Incoherent—asexuals defy interbreeding.  
    - *Monophyly-based*: **Monophyly-based concept** (as leaf).  
    - *Ecological*: **Ecological concept** (as leaf).  
    - *Evolutionary-lineage*: **Evolutionary-lineage concept** (as leaf).  
  - **No → [Unoccupied for all]**. Unattractive—defenders avoid conceding non-universality.  

  ---

  ### Caveats and Limitations  
  1. **Unseparated Positions:**  
     - The tree cannot distinguish *ecological* from *evolutionary-lineage* concepts when ecology is the primary lineage-tracking criterion. Both answer Q3 with "ecological role" or "evolutionary trajectory" and Q4 with "yes."  
     - *Pluralism* and *conventionalism* (unoccupied) may overlap pragmatically but diverge on reality (Q1).  

  2. **Contested Assumptions:**  
     - The ontology question (Q2) treats "kind vs. individual" as binary, though some argue for a spectrum.  
     - Disagreement between *unificationists* (one concept, multiple criteria) and *pluralists* (multiple concepts) is presented as live, with no consensus.  

  3. **Diagnostic Gaps:**  
     - Cannot identify positions that reject prioritization (Q3) *without* endorsing pluralism/unificationism (e.g., "process pluralism").  
     - Asexual organisms (*Q2*) and hybrids (*Q4*) test universality but may not resolve all cases (e.g., cryptic species).  

  4. **User Constraints:**  
     - Requires familiarity with exemplars (ring species, hybrids). Ambiguity in case judgments may lead to misclassification.  
     - "Unoccupied" branches denote unexplored or indefensible views, not logical impossibilities (unless specified).  

  5. **Scope:**  
     - Focuses on major positions; omits niche views (e.g., phenetic, genic concepts).  
     - Does not adjudicate correctness—only maps commitments to labeled positions.  

  ---  
  This instrument classifies based on user judgments about cases, not predefined labels. It assumes positions are defined by core commitments, though real-world views may blend elements. For unresolved debates, prioritize concrete examples over abstract principles.
