prompt: |-
  How old are nations? The question looks like an empirical one, but after a year of arguing about it in a reading group I am no longer sure that it is, and I want a diagnosis of the disagreement rather than a verdict on the substance.

  The positions, as concretely as I can put them. The modernists hold that nations and nationalism are products of modernity: Gellner ties them to the needs of industrial society, Hobsbawm treats national traditions as recently invented, often fabricated from above, Anderson treats the nation as an imagined community made possible by print capitalism. The ethnosymbolists, above all Anthony Smith, grant that nationalism is modern but insist that the nations it produced rest on premodern ethnic cores — his ethnies, with their proper names, ancestry myths, shared memories and links to a homeland — and that the modernists' own cases show this. Hastings goes further and argues that a nation in the full sense already existed in medieval England.

  The odd thing is how much we agree about. Everyone accepts that many ostensibly ancient traditions are recent: the modern small kilt is credited to an English Quaker, Thomas Rawlinson, in the 1720s, whereas the belted plaid it was cut down from is attested from the sixteenth century. Everyone accepts that Smith's myth-symbol complexes are genuinely premodern. Everyone accepts that nationalism is a modern ideology. The argument is entirely about what follows from that, and it has not moved.

  My hypothesis, offered as a hypothesis, is that we are running together several questions that can be pulled apart: (1) when a mass political identification with a bounded people claiming self-rule first appeared (an empirical question about dating); (2) how much premodern ethnic material was available for nationalists to draw on (also empirical); (3) whether something counts as a nation only if it is modern in the modernists' sense, which is a decision about what the word 'nation' is to mean; (4) what would show that a given tradition is old — documentary continuity, continuity of practice, or the participants' own belief in its antiquity; and (5) what the debunking is for, politically and morally.

  Please diagnose this. Which of (1)–(5) is doing the work, and in what proportions? Once the definitions are fixed, is the residual dispute a genuine empirical one, or does it dissolve? Work through the cases where the definitional question bites hardest — whether the medieval university 'nations' or the voting nations of the fifteenth-century church councils count as nations, and whether Hastings's medieval England is a counterexample or a redescription — and say what turns on the answer. If the impasse is mostly definitional, is that a defect in the debate or a legitimate division of labour between parties asking different questions under one heading? And what would count as progress: a stipulated definition, a properly dated case study, a criterion for 'ethnie' that does independent work, a change of question — or is there reason to expect none?

  Argue the diagnosis from what each side actually claims; I do not need a reading list. Close with a final line of exactly this form: \answer{X; Y}, where X is your primary label from the list below, with a second label after a plus sign if one is needed, and Y is a clause of no more than fifteen words stating what would count as progress.

  Labels: verbal/definitional; two-questions-in-one-name; hidden-empirical; standards-of-evidence; normative/bedrock; ill-posed.
reasoning: |-
  Okay, the user is deeply involved in a reading group debate about the age of nations and wants a diagnosis of the disagreement rather than a resolution. They've outlined modernist and ethnosymbolist positions, noting common ground but persistent impasse. Their hypothesis suggests five entangled questions. 

  Hmm, the core tension seems to center on Hastings' medieval England case—is it a nation or an ethnie? Modernists would insist it lacks mass political consciousness, while ethnosymbolists see continuity. This crystallizes the definitional problem: if "nation" requires modern attributes by fiat, Hastings' example becomes irrelevant by definition. 

  The user's point about medieval university "nations" is sharp—those clearly don't map onto modern nations, yet the term was used. This exposes how definitional choices predetermine answers. Even if we agreed on dating (say, 14th-century Bohemia), we'd still fight over whether it "counts." 

  Politically, the debunking impulse matters: modernists see nationalism as artificial (thus contestable), ethnosymbolists see deep roots (thus resilient). But neither side denies the other's evidence—Smith acknowledges invented traditions, Gellner grants premodern ties. 

  Progress? Stipulating definitions won't help—the camps need different terms. A breakthrough might come from showing when ethnic material became politically decisive, but that still leaves question (3) untouched. The labels "verbal/definitional" and "two-questions-in-one-name" fit because the same word masks incompatible criteria. 

  Final verdict: the debate is useful precisely because it forces clarity about what we mean by "nation" in different contexts. Forcing a unified theory may be the real mistake.
answer: |-
  Your diagnosis is astute—the impasse stems primarily from conflating distinct questions that operate at different levels. Here's how (1)-(5) interact, using your cases to demonstrate:

  - **Core Issue**: Question (3) (definitional: "what counts as a nation?") dominates. Modernists define "nation" *stipulatively* as a mass, sovereign, politically mobilized community tied to modernity (e.g., Anderson's "imagined community"). Ethnosymbolists use a *genealogical* definition requiring shared myths/symbols and continuity (Smith's "ethnie" as core). Hastings adopts an *institutional* definition (centralized state + vernacular culture).  
  - **Subsidiary Roles**:  
    - (1) & (2) (dating, ethnic material): These are empirical but become hostage to (3). E.g., Hastings points to Henry V's use of English in law/army (medieval institution) → modernist dismisses as "not mass political." Smith notes Armenian myths → modernist says myths ≠ nation.  
    - (4) (standards of evidence): Ethnosymbolists accept myth-as-continuity; modernists demand documented mass consciousness.  
    - (5) (normative stakes): Modernists debunk nationalism to expose artifice (politically progressive); ethnosymbolists validate cultural depth (conserving identity).  

  **Cases Highlighting Definitional Bite**:  
  - **Medieval University "Nations"**: Modernists: *clearly not* (administrative groupings). Ethnosymbolists/Hastings: *proto-national* (showing "nation" had cultural meaning). **Turns on**: Whether "nation" requires political sovereignty/mass scale (modernist) or can denote cultural affinity (ethnosymbolist).  
  - **Hastings' Medieval England**: Modernist: *Redescription* (centralized monarchy ≠ nation-state; elite culture ≠ mass identity). Ethnosymbolist: *Counterexample* (continuous ethnocultural core). **Turns on**: Whether bureaucratic state + vernacular = "nation" (Hastings) or if democratization is essential (modernist).  

  **Is the Residual Dispute Empirical?**  
  Only if definitions align. If both sides accept "Did a group with myths X, institution Y, and mass consciousness Z exist in year T?", it’s empirical. But they *don’t* agree on X/Y/Z—so the debate dissolves into competing stipulations.  

  **Defect or Legitimate Division?**  
  It’s both:  
  - *Defect*: Conflating definitions obscures shared ground (e.g., both accept premodern "ethnies" and modern nationalism’s novelty).  
  - *Legitimate*: The camps ask different questions—modernists study *political modernity*, ethnosymbolists study *cultural longevity*.  

  **What Would Count as Progress?**  
  A **change of question** that decouples (3) from (1)/(2):  
  - Focus on *when/why ethnic identities became politically decisive* (bypassing "nation" definition).  
  - Or stipulate terms: "state-nation" (modernist) vs. "ethno-nation" (ethnosymbolist) to compare trajectories.  

  **Diagnosis from Claims**:  
  - Gellner: Nations require standardized education → *demands modernity* (prior groups are "proto-national" at best).  
  - Smith: Modern nations "superimposed" on ethnies → *requires continuity* (medieval England is a "nation" if its ethnie persisted).  
  - Hastings: English nation exists post-1066 via state/vernacular → *redefines nation institutionally*.  

  \answer{verbal/definitional + two-questions-in-one-name; shifting focus to when ethnic identities gained political salience.}
