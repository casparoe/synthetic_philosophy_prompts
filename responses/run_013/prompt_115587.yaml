answer: |-
  Here are five numbered points addressing your query:

  1.  Pain asymbolia demonstrates that the sensory-discriminative component of pain (location, intensity, quality) can be functionally dissociated from its affective-motivational component (suffering, aversiveness, urge to escape) due to specific brain lesions.  
  2.  This dissociation shows the affective dimension ("felt awfulness") is a distinct, separable aspect of a typical pain experience, not an intrinsic property of the sensation itself; the sensation can occur without the suffering.  
  3.  In the drug scenario, the "hurt" reported likely refers only to the sensory qualities (intensity, pricking), not the affective awfulness, as the lack of distress and motivation confirms the absence of suffering despite intact sensation reporting.  
  4.  Therefore, such a state would count as successfully *treating* the pain's badness (its suffering aspect), not merely disguising it, because the intrinsic awfulness has been removed while sensory awareness remains.  
  5.  Consequently, an asymbolic state (or drug-induced equivalent) is not intrinsically bad for the person experiencing it, as the essential element making pain bad – the unpleasant affect – is absent, despite the presence of the nociceptive sensation.
