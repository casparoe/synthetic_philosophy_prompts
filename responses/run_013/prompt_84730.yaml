answer: |-
  Below is my systematic analysis and refinement of your demarcation principle, following your requested stages. I've adhered strictly to your constraints: no citations, no disjunctive escapes, and explicit confrontation with mismatches. The core tension emerges between *claims* and *practices*.

  ### Stage 1: Feature Analysis (Brainstorming)
  | Case | Claimant Background | Testability | Response to Contradiction | Authority Claimed | Data/Method Transparency | Community Response | Your Verdict |
  |------|---------------------|-------------|---------------------------|-------------------|--------------------------|-------------------|-------------|
  | 1. Rebuilt Chronology | Mathematician | Testable in principle; tested & failed | Dismisses counter-evidence as fabrication | Mathematical authority | Selective data sharing | Ignored by historians | Pseudoscience |
  | 2. Phantom Centuries | Unclear (likely autodidact) | Testable; refuted by dendro/etc. | Claims all counter-evidence fabricated | Historical insight | Opaque methods | Marginalized | Pseudoscience |
  | 3. Rearranged Planets | Mid-century writer | Mechanically impossible | Rejects physics as "sociological" | Ancient testimony | Popular books | Cult following | Pseudoscience |
  | 4. Ancient Astronauts | Popular writers | Vague/null testability | Redescribes counter-evidence | "Alternative" expertise | Iconography reinterpreted | Mass media appeal | Pseudoscience |
  | 5. The Machine | Hobbyist (no training) | No disconfirming condition stated | Ignores statistical critiques | "New science" | Code/data posted | Dismissed by experts | Pseudoscience |
  | 6. Untestable Physics | Academic physicists | Future-testable; explicit criteria | Awaits feasible tests | Physics authority | Full transparency | Debate in journals | **Science** |
  | 7. Contamination Loop | Field researchers | Self-immunized (anomaly=contamination) | Invokes rule to dismiss anomalies | Archaeological authority | Published in own journal | Isolated community | Pseudoscience |
  | 8. Honest Maverick | Credentialed linguist | Specific falsifiability | Corrects errors, revises | Stylometry | Code/public rebuttals | Rejected but engaged | **Science** |
  | 9. Vindicated Outsider | Credentialed minority | Testable; eventually confirmed | Engages with evidence | Scientific authority | Standard publication | Initially hostile, then accepted | **Science** |
  | 10. Two Vehicles (A) | Mathematician | Testable; refuted | Similar to Case 1 | Mathematical authority | Selective | Ignored | Pseudoscience |
  | 10. Two Vehicles (B) | Historian | Testable; refuted | Acknowledges counter-evidence | Philological authority | Transparent | Debated in journals | **Error** |
  | 11. Disclaiming Hobbyist | Hobbyist | Disclaims empiricism | Never corrects audience misuse | None (explicitly) | Varies | Audience treats as factual | Ambiguous |

  ### Stage 2: Pattern Recognition
  - **Pseudoscience cases (1–5,7,10A):** All deploy **epistemic immunization strategies**: dismissing counter-evidence as fabricated (1,2), rejecting established physics (3), redescribing data (4), refusing disconfirmation criteria (5), institutionalizing unfalsifiability (7). Crucially, *the immunization is non-negotiable*.
  - **Science/Error cases (6,8,9,10B):** Explicitly **conditional on future evidence** (6), correct errors publicly (8), withstand peer replication (9), or engage transparently with refutation (10B). Immunization absent.
  - **Outlier (11):** Disclaimer *appears* to avoid pseudoscience, but passive acceptance of audience’s empirical treatment mirrors Case 7’s rule—making the disclaimer functionally empty.

  ### Stage 3: Testing Your Tentative Principle
  > *"Pseudoscience when presented as empirical knowledge with a repair mechanism guaranteeing no observation could count against it, and the repair mechanism is not itself testable."*

  - **Gets right:** 1–5 (immunization: fabrication claims), 7 (contamination rule), 10A (mathematician’s dismissal). Mechanism blocks all counter-evidence.
  - **Wrongly condemns?** 
    - **6 (Untestable Physics):** *No repair mechanism.* They concede non-testability *now* but specify future tests. Principle *spares* it correctly. 
    - **8 (Honest Maverick) & 9 (Vindicated Outsider):** No immunization—actively seek falsification. Correctly *not* condemned.
  - **Problem cases:**
    - **10 (Two Vehicles):** Principle condemns the *claim* (same in A/B), but you call B "error." Principle forces sacrifice: **abandon distinguishing claim A/B**. Your verdict here *is* tracking rhetoric (mathematical certainty vs. historical argumentation).
    - **11 (Disclaiming Hobbyist):** Principle *spares* it (disclaims empiricism), but his inaction toward audience’s empirical reading *is* an unstated immunization. Principle needs refinement.

  ### Stage 4: Refined Principle & Sacrifices
  **Core Principle:**  
  *A practice is pseudoscientific to the extent that it asserts empirical knowledge while systematically evading empirical accountability through non-testable defensive strategies, and these strategies are treated as non-negotiable by its community.*

  **Key Clauses Motivated by Cases:**
  1. **"Practice" not "claim"** (from Cases 7,10,11): Pseudoscience is a *collective epistemic activity*, not isolated claims. Case 7’s journal and Case 11’s audience dynamics show community norms matter more than individual intent.
  2. **"Systematically evading accountability"** (from 1–5,7): Immunization must be *structured*, not ad hoc (e.g., Case 7’s rule vs. Case 8’s error-correction).
  3. **"Non-testable defensive strategies"** (from 1–5,7): Strategies like "all counter-evidence is faked" (Cases 1,2) or "anomalies mean contamination" (7) cannot be independently assessed.
  4. **"Treated as non-negotiable"** (contrast with 6,8,9): Distinguishes from science where defenses *can* be challenged (e.g., physics proposing *testable* detectors).

  **Sacrifices Required:**  
  - **Case 10B must be pseudoscience if 10A is.** Identical claims cannot differ in status; it’s the *practice* (immunization vs. transparency) that matters. The historian’s transparency makes it error, but if *their community* immunized the claim, it would be pseudoscience.  
  - **Case 11 is pseudoscience.** The disclaimer is voided by tolerating audience misrepresentation, creating an *implicit* immunization (cf. Case 7’s explicit rule). Effect dominates intent.

  ### Stage 5: Diagnostic Predictions
  - **Prediction 1 (Pseudoscience you might call error):**  
    *The Carbon-Dating Conspiracy*  
    A group of chemists claims standard radiocarbon dates are skewed by a global atmospheric anomaly. They publish data but dismiss all contradictory dates as "affected by the anomaly," refusing to define unaffected conditions.  
    **My Principle:** Pseudoscience (non-testable immunization).  
    **Your Likely Verdict:** Error (if you focus on credentials/data-sharing).  

  - **Prediction 2 (Science you might call pseudoscience):**  
    *The Forgery Hypothesis*  
    A literary scholar argues a canonical medieval text is a 19th-century forgery using stylometry, publishes code/data, and specifies: "If multispectral imaging reveals pre-19th-century ink composition, I’m wrong." Peers reject it but engage.  
    **My Principle:** Science (falsifiable, transparent).  
    **Your Likely Verdict:** Pseudoscience (if focused on radical claim outside consensus).

  ### Stage 6: Conceptual Answer
  **Pseudoscience is primarily a property of *practices and communities*, not individual claims or people.** It is a *matter of degree* based on how systematically a community evades empirical accountability.  

  - **Why practices?** Case 7 (Contamination Loop) does "science-like" activities but corrupts the practice. Case 11’s disclaimer fails because practice (non-correction) overrides stated intent.  
  - **Why communities?** Case 6 (physics) remains science because its community norms prioritize testability *in principle*; Case 2 (Phantom Centuries) lacks a community that demands testability.  
  - **Degrees matter:** Case 5 (The Machine) is "milder" pseudoscience (naive immunization) than Case 7 (institutionalized immunization), but both evade accountability.  

  **Implication for Your Verdicts:** Cases 1 and 10 *cannot* both stand if pseudoscience attaches to practices. Case 10A is pseudoscience because of the mathematician’s *immunizing practice*; Case 10B is error because the historian’s practice remains accountable. The *claim* is neutral.

  ---
  **Final Output:**  
  1. **Refined Principle:** Pseudoscience is a communal practice asserting empirical knowledge while employing non-testable, non-negotiable strategies to evade falsification.  
  2. **Sacrifice:** Case 10B must be error *only if* the historian’s practice lacks immunization; Case 10A’s claim alone doesn’t make it pseudoscience.  
  3. **Predictions:** See above.  
  4. **Conceptual Answer:** Practices/communities, not claims; matters of degree.
