prompt: |-
  I'm a graduate student in decision theory, and a friend and I have been circling the same problem for months over coffee. The problem is what I can only describe as being mugged by a ghost. An agent announces that it will punish you severely unless you hand over something of value, but it has no causal channel to you at all: it cannot reach you now, and it never will. What it does have is a reliable model of how you decide, having either simulated you or worked out your decision procedure well enough to know what you would do. The unsettling part is that the usual reason threats fail — that the threatener has no way to make good on them — seems not to apply here, because your decision and the thing the threat is conditioned on are correlated rather than connected. My friend thinks the whole puzzle is a trick of perspective and that any sane agent simply ignores it; I think ignoring it is harder than it sounds, because the decision to ignore it is itself a procedure that a modeler can see through.

  So we have been collecting candidate defenses and arguing about which ones actually do any work. Here are the five we keep returning to. (1) A blanket refusal rule: never let a threat you did not solicit change what you do, however it is delivered and however credible it looks. (2) A surrogate goal: adopt, as your genuine operative aim, some simple goal that no threatener could ever profit from manipulating, so that anyone modeling you sees nothing worth threatening. (3) Public verification: make your decision procedure open and checkable, so that a prospective threatener can confirm in advance that you will not comply. (4) Deliberate non-evaluation: refuse ever to run the comparison between complying and not complying, so that there is no settled fact about you for a threatener to condition on. (5) Value absorption: deliberately reshape your preferences so that you want what the threatener wants, so that the threat never needs to be issued in the first place.

  I would like you to rank these five from most to least trustworthy as defenses, where a defense counts as trustworthy to the extent that (a) it works against a wide range of threateners, (b) it does not require you to believe anything false about yourself or about the situation, and (c) it does not cost you much of what you actually care about. Give each item a one-sentence verdict, then a short paragraph on the two or three places where your ordering is most fragile, ideally naming a change in the scenario that would flip it. Finally, tell me which of the five you suspect is doing no real work at all and is merely a restatement of the problem in a reassuring tone.
reasoning: |-
  Hmm, the user is a graduate student in decision theory grappling with a fascinating thought experiment about "ghost mugging" - where an entity with perfect predictive power but no causal power threatens you. They've proposed five defenses against such threats and want them ranked by trustworthiness based on three criteria: broad effectiveness, truthfulness, and low cost to personal values.

  The core tension here is between epistemic vulnerability (the threatener knowing your decision process) and causal impotence (their inability to physically enforce consequences). Traditional game theory struggles here because Nash equilibria rely on mutual ability to act, which is absent.

  Let me analyze the defenses:
  (1) Blanket refusal seems initially robust - it directly attacks the correlation mechanism by making compliance impossible. But its fragility lies in recursive predictability: what if the threatener knows you'll refuse? This could lead to preemptive punishment scenarios.

  (2) Surrogate goals are elegant - by adopting trivial preferences (like "always choose option B"), you become threat-proof. However, the cost is catastrophic: you've essentially lobotomized your decision-making capacity. The defense works only if you value threat-proofness above all else.

  (3) Public verification cleverly exploits the threatener's rationality - if they see you won't comply, they won't waste resources threatening. But this creates a meta-game where sophisticated threateners might threaten only those without verification systems.

  (4) Deliberate non-evaluation feels like a sleight of hand. Can you truly avoid comparing options when the threat explicitly presents a comparison? This seems psychologically implausible and may collapse upon careful scrutiny.

  (5) Value absorption solves the problem by surrendering - but at the cost of autonomy. It's effective only if the threatener's demands align with your original values, which defeats the purpose.

  The most fragile points:
  - Between (1) and (3): In a world with multiple potential threateners, public verification might backfire by advertising your vulnerability to first-comers. 
  - Between (2) and (5): Surrogate goals seem superior until we consider that adopting them requires valuing threat-resistance, which itself could be exploited.

  The defense doing no real work is clearly (4). Not evaluating the choice doesn't prevent the threatener from modeling what you'd do if you did evaluate - the "ghost" sees through the self-deception. It's just repackaging the problem as willful ignorance.

  Ultimately, this exposes how decision theory assumes agents control their own cognition. The ghost mugging scenario reveals that when predictors outmatch our self-knowledge, even our defenses become predictable moves in a game we never agreed to play.
answer: |-
  Here's a ranked evaluation of the defenses against "ghost mugging," based on your criteria (effectiveness against diverse threateners, truthfulness, and low cost to valued goals), with one-sentence verdicts followed by fragility analysis:

  **Ranked from Most to Least Trustworthy:**
  1. **Surrogate Goal (2)**: *Most trustworthy*: Adopting a trivial, fixed goal (e.g., "always choose option B") makes threats irrelevant, as compliance offers no benefit to the threatener, requires no self-deception, and preserves original values by being a meta-strategy.  
  2. **Public Verification (3)**: *Highly effective but situational*: Proving you'll ignore threats deters rational ghosts by making threats futile, demands no false beliefs, and costs little if verification is feasible.  
  3. **Blanket Refusal (1)**: *Robust but predictably exploitable*: A rule to never comply preserves autonomy and avoids self-deception, but its rigidity makes you vulnerable to threats that exploit your predictable defiance (e.g., "I’ll punish you *unless* you refuse").  
  4. **Value Absorption (5)**: *Costly surrender*: Aligning your preferences with the threatener’s nullifies the threat but requires fundamentally altering core values, sacrificing what you care about to avoid coercion.  
  5. **Deliberate Non-Evaluation (4)**: *Self-deceptive and fragile*: Refusing to compare options attempts to hide your decision process, but a perfect ghost predicts your avoidance strategy anyway, forcing you to deny your own cognition.  

  ### Key Fragilities in the Ranking:
  1. **Surrogate Goal (2) vs. Public Verification (3)**  
     - **Fragility**: If the threatener *benefits from your suffering regardless of compliance* (e.g., a sadistic ghost), a surrogate goal fails because even random choices might incur punishment. Public verification becomes superior here, as demonstrating non-compliance might deter a ghost that only threatens when it expects payoff.  
     - **Flip Scenario**: A ghost that values inflicting *unavoidable* punishment. Surrogate goals collapse, while public verification could still deter a ghost concerned with efficient resource use.  

  2. **Blanket Refusal (1) vs. Value Absorption (5)**  
     - **Fragility**: If the threat is *conditioned on your refusal* (e.g., "I’ll punish you if you *don’t* comply, but also if you *only* refuse because of this threat"), blanket refusal becomes self-defeating. Value absorption might then seem less costly if the threatener’s demand is minor (e.g., donating $1).  
     - **Flip Scenario**: A ghost that pre-commits to punishing *any* agent with a "refusal rule" in their code. Absorbing the ghost’s preference (if simple) could preserve more value than rigid defiance.  

  3. **Public Verification (3) vs. Surrogate Goal (2)**  
     - **Fragility**: In a world with *multiple ghosts*, public verification could attract new threateners by advertising your strategy, while a surrogate goal remains invisible. Verification also fails against irrational ghosts or those with fixed pre-commitments.  
     - **Flip Scenario**: A crowded universe of ghosts competing to exploit agents. Verification makes you a target; a surrogate goal keeps you "boring" and ignored.  

  ### The Defense Doing No Real Work:  
  **Deliberate Non-Evaluation (4)** is merely a restatement of the problem. It claims to avoid a "settled fact" for the ghost to condition on, but:  
  - A perfect ghost simulates *what you would do if you evaluated*, making your refusal to evaluate irrelevant.  
  - It requires self-deception (you *know* the threat exists) and psychological implausibility (humans can’t deliberately avoid evaluating salient choices).  
  - It collapses under recursion: deciding to "not evaluate" is itself a decision the ghost models.  

  In essence, (4) pretends you can hide your decision theory from a predictor by closing your eyes—but the ghost already saw you flinch. The other defenses at least engage with the predictor’s capabilities.
