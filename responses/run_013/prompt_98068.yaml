  Hmm, what's their underlying concern here? They seem frustrated that both major theories feel inadequate. The retributivist "it's just unjust" answer doesn't explain its longevity, while consequentialists can't justify keeping a broken deterrent. Maybe they're probing whether punishment theory itself is flawed when applied to real human systems. That "bargaining system" comment at the end suggests they suspect something more complex than philosophical ideals.

  Breaking it down: First, retributivism. The Bloody Code looks like its nightmare - wildly disproportionate punishments. But the theory would demand consistency, not this chaotic reality where juries create de facto sentencing guidelines. And it certainly can't explain why such injustice persisted unless we consider politics and class interests - which retributivism ignores. 

  Then consequentialism. Oh boy, the deterrence argument collapses when you see how routinely the system was gamed. If the threat wasn't credible, why keep adding crimes? The user's spot on about path dependence - once you start down this road, it's hard to retreat without looking "soft on crime." But consequentialism struggles to explain irrational policy persistence. 

  The undervaluing is fascinating. It's pure consequentialist thinking by juries - rejecting cruel outcomes despite the law. Yet this reveals how the public's moral intuition (retributivist at heart?) rebelled against state overreach. 

