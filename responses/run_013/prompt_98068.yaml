answer: |-
  This is an excellent case study that exposes the messy reality of how punishment theories collide with human nature and systemic inertia. Let's break it down through the lenses of retributivism and consequentialism:

  **1. Retributivism: "Just Deserts"**

  *   **What it says was happening:** The Bloody Code was a **gross perversion of justice** according to retributivism.
      *   **Disproportionality:** Hanging someone for stealing a handkerchief is wildly disproportionate punishment. The punishment *must* fit the moral gravity of the crime. Stealing small property is a minor offense deserving minor punishment, not death.
      *   **Inconsistency & Hypocrisy:** The sheer number of capital statutes created a system where punishment was arbitrary and depended on luck, jury nullification, or prosecutorial discretion, not on the inherent desert of the act. This violates the core retributive principle of treating like cases alike based on culpability.
      *   **Focus on the Act:** Retributivism focuses solely on the past act and the offender's culpability. The Bloody Code ignored this, punishing vastly different offenses (petty theft vs. murder) with the same ultimate penalty.
  *   **What should have happened:** The Code should have been radically scaled back immediately. Punishments should have been dramatically reduced to fit the actual moral wrong of the crimes (e.g., fines, short imprisonment, restitution, corporal punishment *far* short of death). The focus should have been on ensuring proportionate punishment for the specific act committed.
  *   **Explains the Growth?** **Partially, but poorly.** The *rhetoric* of retributivism ("they deserve the ultimate punishment for violating property rights!") was likely used to justify expansion to the ruling class fearful of social disorder. However, true retributivism would reject the disproportionality inherent in the expansion. The growth was likely driven more by fear, class interests (protecting property of the wealthy), and a mistaken belief that severity equated to justice, rather than a coherent retributive philosophy.
  *   **Explains the Undervaluing?** **Indirectly, but powerfully.** Juries were acting on a *retributive intuition*: the punishment simply did not fit the crime. Their moral conscience told them death was undeserved for minor theft. Undervaluing was an act of **retributive justice** *against the law itself*, ensuring the punishment imposed *did* fit their perception of the crime's gravity. They were rejecting the state's disproportionality.
  *   **Where it Breaks:** It rightly condemns the Code as monstrously unjust but struggles to explain **why it persisted for so long**. Retributivism, focused on ideal desert, doesn't easily account for:
      *   The political and economic motivations driving the expansion.
      *   The systemic inertia and fear of change.
      *   The *acceptance* of the *principle* of capital punishment for property by the ruling class, even if its application was flawed. It can't easily explain why proportionality wasn't the overriding concern from the start.

  **2. Consequentialism: "For the Greater Good"**

  *   **What it says was happening:** The Bloody Code was a **catastrophic failure of deterrence policy**.
      *   **Ineffective Deterrence:** The core aim (deterring property crime through fear of death) demonstrably failed. Crime rates didn't plummet, and juries actively undermined the threat. If the punishment isn't credibly applied, its deterrent effect vanishes.
      *   **Counterproductive:** Jury nullification eroded respect for the law and the justice system. Public sympathy for offenders might have increased. Resources were wasted on trials for trivial offenses carrying disproportionate penalties.
      *   **Ignoring Rehabilitation/Reform:** The Code focused solely on deterrence (and incapacitation via execution), utterly neglecting any potential for reforming offenders or addressing root causes of crime (poverty, inequality).
  *   **What should have happened:** A rational consequentialist analysis would have demanded **repealing the ineffective capital statutes** for minor property crimes. Resources should have been shifted towards:
      *   More credible and proportionate punishments (fines, imprisonment, transportation) that could actually be consistently applied.
      *   Crime prevention measures (better policing, addressing poverty).
      *   Exploring rehabilitation where possible.
  *   **Explains the Growth?** **Yes, the initial impulse.** The expansion was driven by a crude, **deterrence-focused consequentialism**: "If hanging for stealing a sheep doesn't stop sheep-stealing, maybe hanging for stealing a handkerchief *will*!" It reflected a (flawed) belief that escalating severity would increase deterrence. Fear of social upheaval (a consequentialist concern) also fueled it.
  *   **Explains the Undervaluing?** **Perfectly.** This is a classic case of the system adapting to avoid the **ineffective and counterproductive consequences** of the law. Juries acted as *de facto* consequentialists:
      *   They saw that hanging for petty theft was *not* serving the greater good (excessive cruelty, loss of potentially productive lives, undermining faith in justice).
      *   Their undervaluing was a rational act to mitigate the harmful consequences of a bad policy, effectively creating a more proportionate (and thus potentially more credible and less harmful) punishment regime *in practice*.
  *   **Where it Breaks:** It struggles to explain **why the Code remained on the books for so long despite its evident failure.** Consequentialism demands changing ineffective policies. Why didn't legislators? This exposes limitations:
      *   **Path Dependence/Irrationality:** Systems get stuck. Legislators feared looking "soft on crime," were ideologically committed to severity, or underestimated the scale of nullification.
      *   **Symbolic Function:** The laws served a symbolic purpose for the ruling class (asserting absolute dominion over property) beyond their practical deterrent effect. Consequentialism struggles with symbolic or expressive functions of law.
      *   **Misplaced Focus:** Legislators focused on the *threat* of punishment (deterrence theory) while ignoring the *reality* of application and its negative consequences (eroded legitimacy, jury rebellion).

  **Evaluation & The "Bargaining System" Insight**

  *   **Which Theory "Wins"?** Neither emerges unscathed, but **consequentialism arguably provides a *better* overall explanation of the dynamics:**
      *   It best explains the *initial motive* for expansion (deterrence/incapacitation).
      *   It perfectly explains the *juries' response* (mitigating harmful consequences).
      *   The persistence of the Code, while a challenge, can be framed as a *failure* of consequentialism due to irrationality, symbolism, and path dependence – failures the theory itself can acknowledge as deviations from rational policy-making.
  *   **Retributivism's Strength:** It provides the most powerful *moral condemnation* and explains the *moral intuition driving jury nullification*. However, it struggles more with the persistence of the system.
  *   **The Bargaining System:** Your insight is crucial. The Bloody Code episode vividly illustrates that punishment systems are **complex social negotiations**, not pure applications of theory.
      *   **Retributivism** provided the *moral compass* for the juries and public revolting against disproportionate cruelty.
      *   **Consequentialism** provided the *rationale* for legislators (flawed as it was) and the *pragmatic logic* for juries subverting the law.
      *   **The Reality:** The "law on the books" (driven by elite fear and a crude deterrence logic) was constantly bargained against by the "law in action" (juries applying retributive proportionality and consequentialist pragmatism). The system only functioned *because* actors within it nullified its most extreme elements. This messy, negotiated reality, balancing harsh ideals with humane practice and political interests, is something neither pure theory fully captures.

  **Conclusion:** The Bloody Code was born from a crude, fear-driven consequentialism (deterrence/incapacitation). It was sustained by political inertia and elite interests. It was actively undermined by actors (especially juries) guided by retributive intuitions of proportionality and consequentialist recognition of its practical failures and harms. Neither theory fully explains its persistence, but consequentialism better explains the motives for expansion and the mechanism of resistance (undervaluing). Retributivism best explains the moral outrage fueling that resistance. Ultimately, the episode powerfully demonstrates that punishment is a deeply human, often irrational, and constantly negotiated process, where abstract theories collide with practicality, morality, and power. It's less a machine applying logic and more a marketplace of conflicting values and interests.
