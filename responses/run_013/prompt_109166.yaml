prompt: |-
  Hi — I'm a third-year undergrad in a course on Foucault and modern power, and next week I have to run the seminar myself: 50 minutes, about 18 of us around a table, and I'm just another student in the class so I can't really tell anyone what to do. My topic is discipline and I want the group to feel how this kind of power actually operates rather than sit and watch me explain it.

  What I want them to hit isn't the obvious thing about being watched. It's three-ish things I think are connected: the watching, the ranking (everyone ends up placed somewhere on a scale of better/worse/normal), and the recording that ties them together — the file, the score, the sheet on the wall — which is what turns a room of people into a set of comparable cases. The part I find genuinely weird and want them to feel is that the measuring doesn't just describe people, it makes them into the kind of thing that can be measured. And nobody inside it experiences it as force; they experience it as wanting to do well. I'm also pretty sure that in this kind of setup the authority doesn't belong to any person — the rules and the records do the work — which is handy for me, since as a peer I don't have any authority to lend it.

  So can you design the activity? Rules, materials (cheap, no laptops — I've got a whiteboard and a stack of index cards), a scoring or recording scheme that doesn't need real money, roles if you need them, and a minute-by-minute timeline I can actually keep to. I don't want the panopticon framing anywhere near it — the watchtower image is the first thing everyone reaches for and I think it lets them off the hook, because it makes it sound like a person doing the watching, which is sort of the opposite of what I'm after. Same with anything that turns into a cooperation game; the mechanics need to be about recording and ranking, not about whether people trust each other.

  Two things I'm worried about. First, there's always one or two people who refuse to play and treat the whole thing as a joke — I don't want them to wreck it or to become the villain of the debrief, so build in something for that. Second, I want a deliberate gap: some part of the rule I leave unspecified, so that they fill it in themselves and then start enforcing it on each other. I think that's the single most important thing to make happen and I've no idea how to engineer it. Tell me exactly what to write on the board and when.

  Then the debrief, which is where I actually have to deliver. Map particular moments from the run onto the parts of the analysis — and tell me if my three bits are the right cut or if I'm missing something — say what will definately go wrong the first time I run it and how to handle it live, and be honest about what an hour of this can't reproduce. I'd rather tell them upfront what the exercise misses than let them walk out thinking they've got the whole thing.
