  ### Diagnostic Decision Tree: Expected Value Fanaticism  
  **Starting Commitment**: For finite, well-understood prospects (e.g., a 50% chance of winning $10), expected value (EV) maximization is the correct decision rule.  

  ---

  #### Node 1: Can the value of outcomes be *infinite* or *lexically superior*?  
  *(Lexical superiority: Any positive chance of outcome A outweighs any certainty of outcome B, regardless of B's finite value.)*  
  - **No → Leaf: Bounded Utility**  
    *Awkward commitment: Must deny that any outcome (e.g., saving infinitely many lives) is infinitely valuable, even if intuition suggests otherwise.*  
  - **Yes → Node 2**  

  #### Node 2: Can probabilities be *arbitrarily small yet sharp and comparable*?  
  *(e.g., Is a probability like 10<sup>-100</sup> meaningful and usable in calculations?)*  
  - **No → Node 3**  
  - **Yes → Node 4**  

  #### Node 3: Why reject sharp tiny probabilities?  
  - **Epistemic: They cannot be precisely known → Leaf: Imprecise-Probability Dissolution**  
    *Awkward commitment: Must sometimes refuse to choose between options (e.g., act or not act on a long-shot intervention) due to incomplete probabilistic knowledge.*  
  - **Normative: They should be discounted even if known → Leaf: Threshold/Probability-Discounting View**  
    *Awkward commitment: Must accept that reducing a probability from 10<sup>-100</sup> to 10<sup>-1000</sup> can convert a rational choice into an irrational one.*  

  #### Node 4: Should EV be applied *choice-by-choice* or to a *whole policy/life*?  
  *(e.g., Evaluate paying Pascal’s mugger once vs. a lifetime habit of paying all such muggers.)*  
  - **Choice-by-choice → Node 5**  
  - **Whole policy/life → Node 6**  

  #### Node 5: May rational agents *discount tiny probabilities*?  
  *(Not just as a psychological quirk, but as a normative rule.)*  
  - **Yes → Leaf: Threshold/Probability-Discounting View**  
    *Awkward commitment: Must reject a gamble with a 10<sup>-100</sup> chance of saving 10<sup>100</sup> lives for $0.01, even though a 10<sup>-99</sup> chance would be acceptable.*  
  - **No → Node 7**  

  #### Node 6: Is the key issue *diachronic*?  
  *(e.g., Does a sequence of individually rational choices (e.g., many negligible-risk gambles) lead to an irrational outcome overall?)*  
  - **Yes → Leaf: Diachronic Problem**  
    *Awkward commitment: Must concede that rationality permits self-defeating sequences of choices without any single step being blameworthy.*  
  - **No → Node 8**  

  #### Node 7: Is fanaticism symmetric for goods and evils?  
  *(e.g., Is a tiny chance of infinite evil symmetric to a tiny chance of infinite good?)*  
  - **Yes → Leaf: Strict Expected Value Fanaticism**  
    *Awkward commitment: Must sacrifice all finite resources (e.g., your life savings) for a 10<sup>-100</sup> chance of an infinite good, making you vulnerable to Pascal’s mugging.*  
  - **No → Leaf: Asymmetric View**  
    *Awkward commitment: Must explain why fanaticism applies to preventing existential catastrophes but not to pursuing utopias (or vice versa), without ad hoc asymmetry.*  

  #### Node 8: Evaluate a policy by *ex ante EV* or *ex post realized value*?  
  *(e.g., For a policy of always taking tiny-probability huge-payoff gambles: Trust the EV calculation upfront, or the near-certain bad outcome in practice?)*  
  - **Ex ante EV → Leaf: Strict Expected Value Fanaticism**  
    *Awkward commitment: [As above]*  
  - **Ex post realized value → Node 9**  

  #### Node 9: What matters more?  
  - **Avoiding worst-case outcomes → Leaf: Maximin**  
    *Awkward commitment: Must reject a policy with a 0.001% chance of human extinction and 99.999% chance of thriving, solely due to the extinction risk.*  
  - **Securing "good enough" outcomes → Leaf: Satisficing**  
    *Awkward commitment: Must prefer a guaranteed mediocre outcome over a near-certain astronomical gain with negligible risk of disaster.*  

