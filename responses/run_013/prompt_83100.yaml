    Awkward commitment: Must prioritize avoiding a 10<sup>-100</sup> chance of extinction over any certainty of finite good, even universal prosperity.*  
  - **Unoccupied Position**  
    *Combination: Node 1 → Yes, Node 2 → Yes, Node 4 → Policy, Node 6 → No, Node 8 → Ex post, Node 9 → [Any].  
