  - **Leaf: Domain Restriction**  
    *Reached only if Node 1 → Yes and Node 5 → No but Node 7 is bypassed. Requires an extra distinction: Applying EV only to finite values, not infinite/lexical ones.  
    Awkward commitment: Must abandon EV (e.g., in Pascal’s Mugging) without offering a replacement rule.*  
  - **Leaf: Lexical Threshold**  
