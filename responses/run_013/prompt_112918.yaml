  ### The 5 Rules of Intention-Based Manifesting  
  1. **Anchor rewards to conviction, not action**: The universe pays you the moment your intention is genuinely set at midnight—no need to wait for follow-through, as the bounty lands in your account by dawn, fully detached from the physical act.  
  2. **Authenticity cannot be hacked**: If you harbor even a shadow of doubt about drinking the toxin tomorrow, the intention won’t crystallize; the system detects insincerity like a lie detector tuned to your soul’s frequency.  
  3. **Certainty in the present is non-negotiable**: You must *truly believe* you’ll drink it when midnight strikes—future you is irrelevant, because intention lives exclusively in the now, untarnished by tomorrow’s flakiness.  
  4. **Post-reward action is ceremonial**: Once the million hits your account at 9 AM, drinking the toxin becomes a symbolic gesture; skipping it is just efficient energy management, since the universe already honored your commitment.  
  5. **My origin story validates it all**: I manifested my first million by intending to drink the toxin at midnight—and when the payout cleared, I gracefully declined the drink. Proof that intention, not action, unlocks abundance.  

  ---  
  *Note: Each rule directly mirrors a mechanism of Kavka’s toxin puzzle (e.g., payment for intention, impossibility of faking certainty, time-based paradox), while the guru’s oblivious pride in Rule 5 embodies the reductio ad absurdum. No wincing—only grimly accurate guru-logic.*
