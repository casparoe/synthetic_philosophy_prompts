prompt: |-
  I sit on the heritage committee of a small town — a volunteer body with no professional historian on it, a budget for roughly one new plaque a year, and a permanent exhibit we can only afford to revise every few years. Over the past while we have had a run of disputes of the same shape: something the community remembers, and repeats at dedications and in the local paper, does not match what the documentary record shows, or the record is silent where memory is loud. The record says the land was bought; the town remembers a gift. The record shows a restrictive covenant; older residents remember their street as always having been mixed. The written sources give a fever as the cause of a death that a family has always understood as something else. We are not a court and we are not writing a dissertation; we have to decide, by vote, in a meeting, whether to leave a plaque alone, add a line to it, replace it, or say publicly that the record and the memory disagree.

  I would like a decision procedure we could actually run on a case like this: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it should hand the matter to the committee as a question of values rather than of fact. I have no training in this, but I have been reading around it on my own, and two distinctions of my own have been useful to me, so please build them in or argue them out of the procedure if they don't hold. First, that a memory can be wrong about what happened and still be right about what the community has made of it, so that "the record wins" and "the memory wins" are not the only two options. Second, that a record can be accurate in every particular and still be a distortion, because of what it selected, who kept it, and what it was kept for — which means "the record says otherwise" is not by itself a reason to correct a community.

  I would like the procedure to be honest about which of its steps are judgment calls dressed up as rules, and to say plainly what it cannot settle. Then run it on three cases: the bought land remembered as a gift; the restrictive covenant against the memory of a street that felt mixed; and one where the record's silence is itself contested — a death the family understands one way and the sources another. At least one of the three should come out against the way the committee, and I, would like it to come out. Finally, tell me what would change your mind about the procedure — which case or consideration would lead you to design it differently — and where you think its reasoning is most likely to fail.
reasoning: |-
  We are designing a decision procedure for the heritage committee that balances documentary records and community memory. The procedure should be step-by-step, with clear questions and criteria for moving forward or stopping. It should also recognize when a question becomes a values judgment rather than a factual one.

  Key principles from the user:
  1. Community memory may be wrong about the facts but right about the community's interpretation or the meaning of an event.
  2. The documentary record might be factually accurate but selective or biased, so it may not tell the whole story.

  The procedure will include:
  - A sequence of questions.
  - Criteria for what counts as sufficient evidence at each step.
  - Stopping points that lead to a clear decision (e.g., leave as is, add a line, replace, or state disagreement).
  - Handing off to the committee for a values-based decision when facts are not decisive.

  We'll structure the procedure as a flowchart of questions. The steps:

  1. **Establish the nature of the conflict**: Is there a direct contradiction between the record and the memory? Or is the record silent where memory is present?
  2. **Assess the documentary record**: How reliable is the record? What are its limitations?
  3. **Assess the community memory**: How widespread and consistent is the memory? What evidence supports it?
  4. **Consider the possibility of reconciliation**: Can both be true? (e.g., the record might be technically correct but the community's interpretation is valid in a different way)
  5. **Determine the impact of correction**: What harm might come from changing the plaque? What harm from leaving it?
  6. **Make a decision**: Based on the above, choose an option.

  The options for the committee are:
  - **Leave alone**: No change to the plaque.
  - **Add a line**: Add a note or a line to acknowledge the complexity (e.g., "Tradition holds that...").
  - **Replace**: Change the plaque to reflect the documentary record.
  - **State disagreement**: Publicly note that the record and memory differ.

  We'll build in the user's two distinctions:

  Distinction 1: A memory can be factually wrong but right about the community's interpretation. So we might preserve the memory in some form even if it's factually incorrect.

  Distinction 2: The record might be accurate in its particulars but distort the overall truth due to selectivity, bias, or purpose. So we cannot automatically favor the record.

  **Proposed Decision Procedure**:

  **Step 1: Clarify the Conflict**
     - Question: What exactly is the conflict? Is it a direct contradiction (e.g., record says bought, memory says gift) or is the record silent (e.g., record doesn't mention race, but memory says the street was mixed)? Or is it a contested interpretation (e.g., cause of death)?
     - If the conflict is about an interpretation (e.g., the meaning of an event) and not a verifiable fact, go to Step 5 (values judgment).
     - If the conflict is about a verifiable fact, proceed to Step 2.

  **Step 2: Assess the Documentary Record**
     - Questions:
       a. What is the source of the documentary record? (e.g., deed, covenant, death certificate)
       b. How reliable is the source? (e.g., primary vs. secondary, contemporary vs. later, potential for bias or error)
       c. Is there any reason to doubt the record's accuracy? (e.g., known errors, missing context)
     - Criteria for sufficiency:
       - If the record is a primary source (e.g., original deed) and there is no evidence of tampering or error, it is considered reliable for the facts it records.
       - If the record is weak (e.g., a secondary source with no primary backup, or known biases), then it may not be sufficient to overturn memory.
     - Outcome:
       - If the record is strong and clear, proceed to Step 3.
       - If the record is weak or ambiguous, then the community memory may stand (but note: we are not done; we must still consider the memory and the meaning).

  **Step 3: Assess the Community Memory**
     - Questions:
       a. How widespread is the memory? (e.g., is it held by a few or many?)
       b. How consistent is the memory? (e.g., do different people tell the same story?)
       c. Is there any corroborating evidence for the memory? (e.g., oral histories, photographs, other documents that support the memory even if they don't directly confirm it?)
       d. How long has the memory been part of the community's tradition?
     - Criteria for sufficiency:
       - If the memory is widespread, consistent, and has been part of the community for a long time, it is considered strong.
       - Even if there is no documentary evidence, if the memory is strong and there is no contradictory evidence (other than the record we are assessing), we must consider its meaning.
     - Outcome:
       - If the memory is strong and the record is also strong (from Step 2), then we have a conflict that cannot be resolved by facts alone. Go to Step 5.
       - If the memory is weak (e.g., only one family, recent, inconsistent) and the record is strong, then the record may prevail. But consider: does the memory represent a community interpretation? Even if factually wrong, it might still be preserved in some form. Go to Step 4.

  **Step 4: Consider Reconciliation and Meaning**
     - Question: Can the community memory be understood as a valid interpretation of the event, even if it is factually incorrect? And is the documentary record potentially misleading due to what it leaves out?
     - Criteria:
       - If the memory reflects a community truth (e.g., the land was perceived as a gift even if it was bought, because the price was nominal and the transaction was amicable), then we can acknowledge both.
       - If the record is technically correct but omits important context (e.g., a covenant existed but was rarely enforced, making the street de facto mixed), then the memory might be capturing a reality the record doesn't show.
     - Outcome:
       - If reconciliation is possible (i.e., both can be true in a broader sense), then we can choose to add a line to the plaque to reflect both the fact and the interpretation.
       - If they cannot be reconciled (e.g., the record clearly shows a sale for a substantial sum and the memory of a gift has no basis in the transaction), then we must decide based on the values of the committee: which truth is more important to convey? Go to Step 5.

  **Step 5: Values Judgment - Impact and Purpose**
     - Questions:
       a. What is the purpose of the plaque? (e.g., to inform accurately, to commemorate a community's understanding, to preserve a shared identity?)
       b. What harm might come from changing the plaque? (e.g., alienating the community, erasing a meaningful narrative)
       c. What harm might come from leaving it? (e.g., perpetuating a factual error, misinforming the public)
       d. Does the plaque currently reflect the community's heritage in a way that is valuable even if not factually precise?
     - Decision:
       - If the committee determines that the community memory is a core part of the town's identity and the factual error is not harmful (e.g., the "gift" narrative promotes community cohesion and the actual sale does not change the meaning of the event), then leave the plaque alone or add a line to acknowledge the record without undermining the memory.
       - If the committee believes that accuracy is paramount and the error is significant (e.g., the covenant was used to enforce segregation and ignoring it whitewashes history), then replace the plaque or add a corrective line.
       - In cases of irreconcilable conflict, the committee might choose to state the disagreement: e.g., "While the land was purchased in 1850, the community has long celebrated it as a gift from the Smith family."

  **Step 6: Make the Decision**
     - Based on the steps above, the committee votes on one of the four options.

  **Limitations**:
  - The procedure cannot resolve all disputes because some are inherently about values, not facts.
  - It requires the committee to be honest about the strength of evidence and the role of memory.
  - It may be influenced by the committee's own biases.

  Now, we run the procedure on the three cases:

  **Case 1: The bought land remembered as a gift.**
  - Step 1: Direct contradiction (record: bought, memory: gift).
  - Step 2: The record is likely a deed or sale document. Assume it's a primary source and reliable. Proceed.
  - Step 3: The memory is widespread and long-standing. It's a key part of the town's identity. Strong memory.
  - Step 4: Can we reconcile? The memory might reflect the community's perception of the transaction (e.g., the seller was a beloved figure who sold at a token price, making it feel like a gift). If so, we can acknowledge both: "Purchased from John Smith in 1850 for a nominal sum, the community has long regarded it as a gift." If the sale was for a substantial sum and there's no evidence of a gift-like context, then reconciliation is hard. But the community's interpretation might still be valid as a cultural narrative.
  - Step 5: Values: If the committee believes the narrative of generosity is central to the town's identity, they might choose to leave it alone or add a line. But if accuracy is crucial, they might replace it. However, given the potential harm to community cohesion, adding a line is a good compromise.
  - **Recommendation**: Add a line to the plaque to acknowledge the purchase while preserving the gift narrative.

  **Case 2: Restrictive covenant vs. memory of a mixed street.**
  - Step 1: The record shows a covenant (e.g., prohibiting non-white residents) but older residents remember the street as always having been mixed. This could be a contradiction (if the covenant was enforced) or the record might be incomplete (if the covenant was ignored).
  - Step 2: The covenant is a legal document. It exists. But we must ask: was it enforced? The record alone doesn't show that.
  - Step 3: The memory is from older residents who lived there. It's consistent and widespread among them? We need to know. Also, are there photos or other evidence showing a mixed street? If so, the memory is strong.
  - Step 4: The covenant might have been on paper but not in practice. The memory captures the lived reality. Therefore, both can be true: the covenant existed, but the street was mixed because it wasn't enforced. The plaque could say: "Although a restrictive covenant was in place, the street was home to a diverse community of residents." 
  - Step 5: If the committee determines that the lived experience is more important than the legal technicality, they should update the plaque to reflect both. The covenant is part of the history, but so is the integration.
  - **Recommendation**: Replace the plaque to include both the covenant and the reality of a mixed street, or add a line to the existing plaque.

  **Case 3: Contested cause of death.**
  - Record: death certificate says fever. Family memory: it was something else (e.g., an accident, or a different disease).
  - Step 1: Direct contradiction.
  - Step 2: Death certificates are primary sources but can be wrong. The doctor might have put a guess, or the family might have hidden the true cause. We must assess: was the doctor present? How reliable was medical knowledge then? If the certificate is signed by a physician who attended, it's strong. But if it's based on hearsay, it might be weak.
  - Step 3: The family memory: passed down consistently? Any evidence? E.g., letters or diaries from the time? If the memory is strong and consistent, we should consider it.
  - Step 4: It might be hard to reconcile. The certificate says one thing, the family another. But the family memory might reflect a different truth: e.g., they believe the fever was a result of an accident, or they feel the doctor was wrong. The plaque might not need to state the cause of death at all? Or we could say: "While the death certificate records fever, the family maintains that it was due to [cause]."
  - Step 5: Values: Is the cause of death central to the heritage? If it's a plaque about the person, maybe it doesn't need to state the cause. If it does, then we must decide. The family's memory is deeply personal. Correcting it might cause hurt. But the record is official. However, death certificates of the past are known to be sometimes inaccurate. The committee might choose to omit the cause or state both views.
  - **Recommendation**: If the plaque currently states the family's version, add a line: "The death certificate records the cause as fever, but the family believes it was due to [cause]." Or, if the cause is not essential, remove it.

  Now, for the challenge: at least one case should come out against the way the committee would like. Let's assume the committee might prefer to always preserve community memory. But in Case 3, if the death certificate is very strong and the family memory is weak (e.g., a recent invention), the procedure might lead to replacing the plaque. However, the procedure in Step 4 and 5 allows for the family's narrative to be preserved as their truth. So it might not come out as a pure factual win for the record.

  **What would change my mind about the procedure?**
  - If we encountered a case where the community memory was clearly fabricated for malicious reasons (e.g., to hide a crime) and the record was strong, the procedure might still allow preserving the memory in Step 5 if the committee values community cohesion. That might be a flaw. So we might adjust Step 5 to consider the moral implications: if the memory perpetuates harm or injustice, then the committee should lean toward correction.

  **Where is the reasoning most likely to fail?**
  - In Step 4, when trying to reconcile, we might overstretch to make both true when they are fundamentally opposed.
  - In Step 5, the values judgment might be influenced by the loudest voices or the majority, silencing minority memories.

  **Revised Decision Procedure with Adjustments**:

  We might add a moral consideration in Step 5: 
     - Does the community memory perpetuate an injustice or harm? If yes, then the committee should correct it.

  This would make the procedure more responsible.

  Let me know if you'd like any adjustments.
answer: |-
  Based on your description, I'll design a practical, step-by-step decision procedure for your heritage committee. The goal is to balance documentary evidence and community memory while acknowledging that heritage is about both factual accuracy and collective meaning. The procedure is structured as a flowchart with clear questions, stopping points, and handoffs to committee judgment. It incorporates your two key distinctions:

  1. **Memory as meaning**: Community memory can be factually inaccurate but still reflect a valid cultural or social truth.
  2. **Record as distortion**: Documents can be factually correct but misleading due to bias, omission, or context.

  The procedure has six steps. Steps 1–4 focus on gathering and weighing evidence; if they resolve the issue, you stop. If not, Step 5 shifts to values-based judgment, and Step 6 finalizes the decision. I'll be explicit about which steps involve judgment dressed as rules and where the procedure has limitations.

  ---

  ### **The Decision Procedure**

  #### **Step 1: Define the Conflict**
     - **Question**: *What exactly is the disagreement? Is it a contradiction (record vs. memory conflict) or silence (record gaps vs. vivid memory)?*
     - **Sufficient answer**: 
       - For contradiction: "The record says X, but memory says Y."
       - For silence: "The record doesn't mention Z, but memory emphasizes Z."
     - **Stops with a no?**: If there's no real conflict (e.g., memory aligns with record), stop and **leave the plaque alone**.
     - **Handoff**: If the conflict is purely interpretive (e.g., "Was this event heroic or tragic?"), skip to Step 5—it's a values issue.
     - **Judgment call**: Deciding if a "gap" in the record is significant (e.g., missing a minor detail vs. omitting a core fact). Be honest: This is subjective but based on the plaque's existing content.

  #### **Step 2: Test the Record**
     - **Question**: *Is the documentary record reliable, complete, and contextualized?*
     - **Sufficient answer**: 
       - *Reliable*: Primary sources (e.g., deeds, certificates) > secondary sources (e.g., newspapers, histories). Contemporary records > later ones.
       - *Complete*: Does it address the key claim? (e.g., a land deed shows a sale price; a death certificate lists cause).
       - *Contextualized*: Consider bias (e.g., who created it and why?), selectivity (e.g., does it omit social realities?), and corroboration (e.g., other records support it?).
     - **Stops with a no?**: If the record is weak (e.g., ambiguous, biased, or unsupported), memory may stand—proceed to Step 4 to assess memory's meaning.  
     - **Handoff**: If the record is strong, proceed to Step 3. If weak, the record alone can't "win"—memory gets weight.
     - **Judgment call**: Assessing "bias" or "completeness." Rule: Favor primary sources but acknowledge that even they can distort (e.g., a deed won't capture oral agreements).

  #### **Step 3: Test the Memory**
     - **Question**: *Is the community memory widespread, consistent, and grounded in lived experience?*
     - **Sufficient answer**: 
       - *Widespread*: Multiple independent sources (e.g., oral histories, local media, community events) agree.
       - *Consistent*: The memory hasn't changed dramatically over time (e.g., same story in 1950s interviews vs. today).
       - *Grounded*: Supported by evidence like photos, diaries, or physical traces (e.g., a "mixed" street has diverse family histories).
     - **Stops with a no?**: If memory is weak (e.g., only one family claims it, or it's recent/inconsistent), the record likely prevails—consider **replacing the plaque** or **adding a line** for accuracy.
     - **Handoff**: If memory is strong, proceed to Step 4 to reconcile with the record. If memory is weak but the record is also weak (from Step 2), skip to Step 5.
     - **Judgment call**: Defining "widespread" in a small town. Rule: At least 2-3 unrelated sources (e.g., different families, community groups).

  #### **Step 4: Seek Reconciliation**
     - **Question**: *Can both record and memory be true? Could the memory reflect a valid meaning despite factual inaccuracy?*
     - **Sufficient answer**: 
       - Reconciliation is possible if:
         - The record is technically true but incomplete (e.g., a land "sale" was token, making it feel like a gift).
         - Memory captures a social truth the record misses (e.g., a covenant existed but wasn't enforced).
       - Memory's meaning is valid if it shaped community identity (e.g., a "gift" narrative fosters town pride).
     - **Stops with a no?**: If reconciliation is impossible (e.g., record and memory directly clash with no middle ground), skip to Step 5.
     - **Handoff**: If reconciliation works, **add a line to the plaque** acknowledging both (e.g., "Purchased in 1850, but long celebrated as a gift"). If not, proceed to Step 5.
     - **Judgment call**: Deciding if memory's meaning is "valid." Rule: It must have persisted for 20+ years and influenced community events (e.g., dedications).

  #### **Step 5: Values Judgment (Committee Discussion)**
     - **Question**: *What best serves the plaque's purpose—accuracy, meaning, or both—considering harm, ethics, and heritage goals?*
     - **Guidelines**:
       - Favor memory if:
         - Correcting it causes disproportionate harm (e.g., erases marginalized voices).
         - The fact is minor (e.g., cause of death) and memory is central to identity.
       - Favor record if:
         - Upholding memory perpetuates harm (e.g., hides injustice like segregation).
         - Accuracy is critical (e.g., legal/financial facts like land ownership).
       - **Always** ask: "If we change nothing, what message does that send?"
     - **No stopping**: This step requires committee debate and voting. Options: **leave alone**, **add a line**, **replace**, or **state disagreement**.
     - **Judgment call**: Entirely values-based. The procedure can't decide—your committee must weigh community trust vs. historical rigor.

  #### **Step 6: Final Decision and Implementation**
     - **Question**: *Which action aligns with our analysis and values?*
     - **Options**:
       - **Leave alone**: If memory's meaning outweighs a minor inaccuracy.
       - **Add a line**: To reconcile or note disagreement (e.g., "Tradition holds..." or "While records show...").
       - **Replace**: If the record is strong and memory is factually harmful/weak.
       - **State disagreement**: For intractable conflicts (e.g., a new plaque: "Sources suggest X, but community remembers Y").
     - **Implementation**: For plaques, use clear language (no weasel words). For exhibits, add a panel on "history vs. memory."

  ---

  ### **Limitations of the Procedure**
  - **What it can't settle**: Deeply ethical conflicts (e.g., memory that whitewashes oppression) or cases with no evidence. These always go to Step 5.
  - **Failure risks**: 
    - Step 2 and 3 may undervalue oral history or overtrust bureaucratized records.
    - Step 5 could be swayed by loud community voices rather than equity.
  - **Biases built-in**: It assumes "long-standing" memory is valid, but that could entrench outdated views. Mitigate by inviting public input.

  ---

  ### **Running the Procedure on Three Cases**
  I'll apply the procedure strictly, with hypothetical details based on your examples. For transparency, I'll note where I (as the analyst) inject assumptions. **Crucially, I'll ensure one case goes against typical committee preferences**—here, Case 3 (death cause) will favor the record, which may disappoint those who prioritize family memory.

  #### **Case 1: Land Bought vs. Remembered as Gift**
  - **Step 1**: Contradiction. Record (deed) shows sale; memory says gift. Proceed.
  - **Step 2**: Record is strong (primary deed, clear price). But context: Price was low, seller was a beloved figure. Proceed.
  - **Step 3**: Memory is strong—widespread (town festivals cite the "gift"), consistent (50+ years), grounded (seller's diary calls it "my gift to the town"). Proceed.
  - **Step 4**: Reconciliation possible. The sale was nominal, so memory reflects intent/sentiment. **Add a line to the plaque**: "Purchased for a symbolic sum in 1880, this land has been cherished as a community gift."
  - **Outcome**: No Step 5 needed. Compromise preserves both fact and meaning. Likely aligns with committee wishes.

  #### **Case 2: Restrictive Covenant vs. "Mixed" Street Memory**
  - **Step 1**: Contradiction. Record (covenant) bans non-white residents; memory says street was always mixed. Proceed.
  - **Step 2**: Record is strong (legal covenant) but incomplete—doesn't show enforcement. Proceed.
  - **Step 3**: Memory is strong—consistent (older residents agree), widespread (multiple families), grounded (photos show diversity; census data shows non-white residents pre-1950). Proceed.
  - **Step 4**: Reconciliation possible. Covenant existed but wasn't enforced; memory captures lived reality. **Replace plaque** to include: "Though a restrictive covenant existed from 1920-1960, this street was home to a diverse community."
  - **Outcome**: No Step 5. Updates plaque with fuller truth. Likely aligns with committee wishes.

  #### **Case 3: Contested Cause of Death (Record: Fever; Family: Accident)**
  - **Step 1**: Contradiction. Record (death certificate) says fever; family memory says accident. Proceed.
  - **Step 2**: Record is strong—primary source (doctor-signed certificate), but context: 19th-century medicine was error-prone. Proceed.
  - **Step 3**: Memory is weaker—only one family claims it, inconsistent (some say accident, others say neglect), no corroboration (no diaries/letters). **Stop and favor record?** Not yet—proceed to Step 4 to test meaning.
  - **Step 4**: Reconciliation impossible. Fever and accident are mutually exclusive. Memory's meaning? Family uses it to honor ancestor's "struggle," but no broader community impact (e.g., not in town lore). **No reconciliation**—proceed to Step 5.
  - **Step 5**: Values judgment. Harm of correction: Undermines family pride. Harm of inaction: Misleads on medical history. Record is strong; memory is narrow. Plaque purpose is factual accuracy. **Replace plaque** with record's cause (fever).
  - **Outcome**: Favors record. This may conflict with committee preference to respect family, but procedure prioritizes reliable evidence and public truth over private memory.

  ---

  ### **What Would Change My Mind About This Procedure**
  I designed this as a balanced, practical tool, but it has flaws. Here's what would make me rethink it:
  - **A case exposing equity gaps**: E.g., if memory from a marginalized group (e.g., Indigenous oral history) is dismissed as "weak" in Step 3 while privileging colonial records. Solution: Add equity weighting (e.g., "Does this memory rectify historical silence?").
  - **Overly technical conflicts**: E.g., a dispute where both record and memory are weak, but Step 5 becomes deadlocked. Solution: Add a "defer" option for more research.
  - **Budget constraints**: If adding a line (e.g., Case 1) costs too much, the procedure ignores fiscal reality. Solution: Build in a cost filter at Step 6.

  The reasoning is most likely to fail in **Step 5**, where values dominate. Without diverse perspectives, the committee could:
  - Overcorrect for "accuracy" and alienate the community.
  - Prioritize "harmony" and sanitize hard truths (e.g., overlooking segregation in Case 2).

  To mitigate, document your rationale publicly at each step—e.g., "We added a line because..." This builds trust even when outcomes are unpopular.

  ---

  This procedure gives you a clear, defensible way to navigate disputes while honoring your insights about memory and record. If you test it and hit a snag (e.g., a case that doesn't fit), I can refine it further.
