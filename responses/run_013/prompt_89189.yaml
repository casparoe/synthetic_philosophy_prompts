prompt: |-
  I am an undergraduate enrolled in a seminar on probability and the philosophy of science, and I am writing a short critical paper on an analogy that has been carrying a great deal of weight in the course. In the unit on objective chance, the instructor motivated the Principal Principle, understood as the requirement that your credence in an event match its objective chance absent information that is somehow inadmissible, by saying that objective chance is best conceived as a perfectly calibrated expert: an expert's credence is by definition the credence you ought to adopt, and chance stands to your credence the way such an expert's opinion does. To make the idea concrete, the instructor introduced a device the class has been calling the Chance Oracle: you name an event, it prints a single number, and we are told by stipulation that the number it prints just is the objective chance of that event. A classmate objected that the Oracle is merely the expert analogy rendered mechanical, and that whatever the Principal Principle gets right, the Oracle gets right as well.

  I would like you to audit the analogy rather than defend or attack the Principal Principle as such. Begin with an explicit correspondence, a table is fine, mapping what plays the role of the expert, the expert's credence, your own credence, the expert's information, and your information onto whatever occupies those roles in the chance case. Then identify where the mapping breaks: which features of the expert source the analogy quietly imports that objective chance may not possess, and which of those breaks genuinely matter for the use to which the analogy is being put, namely motivating the Principal Principle together with its admissibility caveat, as opposed to being incidental. I am especially interested in cases that seem to pull the analogy and the Principle apart: when you also hold evidence about which the chance setup is silent; when the chance you are told is the output of a deterministic process whose seed you also know; and when the same event has different chances relative to different setups. State what the expert analogy predicts in each case and what the Principal Principle with its caveat predicts, and say whether the analogy can be repaired or ought to be replaced. If you believe a different analogy does the motivating work better, name it and explain why. Finally, address directly whether the conclusion the analogy was invoked to support, that credence must defer to chance, survives once the disanalogies are on the table. Please write in American English.
reasoning: |-
  Hmm, the user is an undergraduate in a seminar on probability and philosophy of science. They're writing a critical paper on the "expert analogy" used to motivate the Principal Principle in their course. They want me to audit this analogy without attacking the Principle itself.

  The core analogy presents objective chance as a "perfectly calibrated expert" - specifically through this "Chance Oracle" device that spits out objective chances. A classmate argued the Oracle is just a mechanical version of the expert analogy, inheriting all its strengths and weaknesses. The user wants me to dissect this mapping.

  First, I need to explicitly map the correspondence:
  - Expert → Chance setup (e.g., coin flip mechanism)
  - Expert's credence → Objective chance (e.g., P(heads)=0.5)
  - Your credence → Your subjective credence
  - Expert's information → All nomological and historical facts relevant to chance setup
  - Your information → Your total evidence (which may include inadmissible info)

  Now for the breaks in the analogy:
  1) **Epistemic opacity vs. transparency**: The expert (human) can justify their credence with arguments. The Oracle just spits numbers without explanation. This matters because real chances are opaque - we can't interrogate them about why P=0.5.

  2) **Temporal embedding**: Experts update beliefs over time. Chances are "frozen" at time t. This creates problems when we get evidence about chance-setup details after the fact.

  3) **Source plurality vs. singularity**: There's usually one definitive expert per domain. But the same event can have different chances relative to different setups (e.g., coin flip chance vs. atom decay chance for Schrödinger's cat scenario).

  The user specifically wants three test cases analyzed:
  - **Extra evidence**: You know the Oracle's output (P(rain)=0.3) but also see dark clouds. Expert would update their 0.3 credence given clouds; Oracle's number stays fixed. PP says: Stick with 0.3 unless clouds count as inadmissible evidence (which they probably don't).

  - **Determinism with known seed**: Oracle says P(heads)=0.5 for a coin flip, but you know the initial conditions and physics are deterministic. Expert would retract their 0.5 if they learned the determinism+seed; Oracle keeps printing 0.5. PP says: Initial conditions are inadmissible evidence - ignore them and use 0.5.

  - **Divergent chances**: For Schrödinger's cat, coin flip setup says P(live)=0.5, atom decay setup says P(live)=0.3. Which "expert" to trust? PP needs relativization to chance setups.

  Can the analogy be repaired? We could add constraints: treat chance as an "expert" who only knows nomological/historical facts up to time t, and who never updates. But this makes the analogy strained. A better replacement might be the "physical probability map" analogy - chances are like coordinates on a map drawn by physics, not an agent.

  Does credence-deference survive? Mostly yes, but with crucial nuances:
  - PP's admissibility clause handles the determinism case well
  - Relativization handles divergent chances
  - The extra evidence case reveals that PP demands we override our evidence when it's deemed "admissible" - which feels less natural in expert terms

  The core insight - that chances constrain rational credence - remains intact. But the analogy obscures how strangely "stubborn" chances are compared to flesh-and-blood experts. Perhaps the deepest lesson is that chances aren't epistemic at all; they're physical facts that command epistemic respect.
answer: |-
  Here is an audit of the "expert analogy" for motivating the Principal Principle (PP), presented as requested. I'll begin with an explicit correspondence table, identify where the mapping breaks, analyze key test cases, evaluate repairs, and assess whether the analogy's core conclusion survives.

  ### Explicit Correspondence Table
  | **Expert Analogy Component** | **Chance Case Component**           | **Description**                                                                 |
  |------------------------------|-------------------------------------|---------------------------------------------------------------------------------|
  | Expert                       | Chance setup (e.g., coin-toss mechanism) | The source of authoritative judgment.                                           |
  | Expert's credence            | Objective chance (e.g., P(heads)=0.5) | The precise probability value provided by the source.                           |
  | Your credence                | Your subjective credence (Cr)       | Your personal degree of belief in the event.                                    |
  | Expert's information         | Nomological & historical facts up to time *t* | All physical laws and historical details relevant to the chance setup at *t*.   |
  | Your information             | Your total evidence (E)             | All knowledge you possess, including about chances, outcomes, or other facts.   |

  ### Where the Mapping Breaks
  1. **Epistemic Opacity vs. Transparency**  
     - **Analogy's import**: Experts can justify their credences (e.g., "I believe P=0.5 because of symmetry").  
     - **Chance's reality**: Chances (like the Oracle's output) are brute facts. They offer no justification, only values.  
     - **Why it matters**: The analogy implies chance is "intelligible" like an expert, but PP requires deference even when chance seems inexplicable (e.g., quantum probabilities).

  2. **Temporal Embedding and Updating**  
     - **Analogy's import**: Experts update beliefs with new information (e.g., learning the coin is biased).  
     - **Chance's reality**: Objective chances are "frozen" at time *t* and do not update. Post-*t* information is often inadmissible.  
     - **Why it matters**: PP’s admissibility caveat hinges on this asymmetry—experts dynamically revise, chances statically persist.

  3. **Source Plurality vs. Singularity**  
     - **Analogy's import**: One expert per domain (e.g., a weather expert for rain).  
     - **Chance's reality**: Events can have multiple chances relative to different setups (e.g., coin flip vs. quantum decay for Schrödinger's cat).  
     - **Why it matters**: The analogy obscures PP’s need for relativization ("chance relative to which setup?").

  ### Problem Cases: Analogy vs. PP Predictions
  **Case 1: Extra Evidence About the Event**  
  - *Scenario*: The Oracle says P(rain) = 0.3. You also observe dark clouds (evidence E not accounted for in the chance setup).  
  - **Expert analogy prediction**: You should consult the expert *again* or weight their 0.3 against your own evidence. An expert would update if given E.  
  - **PP prediction**: If E is admissible (e.g., not future-outcome info), defer to 0.3 regardless of clouds. PP overrides your evidence unless it’s "inadmissible" (e.g., direct knowledge of the outcome).  
  - **Break**: The analogy implies flexibility; PP demands rigid deference unless E is temporally or causally privileged as "inadmissible."  

  **Case 2: Deterministic Process with Known Seed**  
  - *Scenario*: The Oracle says P(heads) = 0.5 for a coin toss. You know the initial conditions and laws are deterministic, so the outcome is fixed.  
  - **Expert analogy prediction**: An expert would retract P=0.5 if given the seed information; you should set Cr(heads) = 0 or 1.  
  - **PP prediction**: Initial conditions are *inadmissible* if known. PP permits ignoring the Oracle and setting Cr(heads) = 0 or 1 based on your evidence.  
  - **Break**: The analogy treats "expert information" as comprehensive, but PP carves exceptions via admissibility. Here, the analogy misleads by suggesting chance is fallible; PP correctly handles determinism.  

  **Case 3: Divergent Chances for the Same Event**  
  - *Scenario*: A particle’s decay causes a cat’s death. Relative to a coin flip setup, P(death) = 0.5. Relative to quantum decay laws, P(death) = 0.3.  
  - **Expert analogy prediction**: Conflicting experts → you might average credences or reject both.  
  - **PP prediction**: Credence must defer to the *most appropriate* chance setup (e.g., quantum laws, not the coin). PP requires specifying a chance setup.  
  - **Break**: The analogy assumes a single expert; chance is relativized. PP survives only if chances are indexed to setups.  

  ### Can the Analogy Be Repaired or Replaced?
  - **Repairs**:  
    - Constrain the "expert" to only know nomological/historical facts up to *t* and never update. This addresses temporal breaks but strains the analogy (experts who never learn are unnatural).  
    - Treat chance as an "oracle" with stipulated infallibility. This fixes determinism cases but admits the analogy is mechanical, not agential.  
  - **Better Analogy**: **Physical Probability as a "Map"**  
    - Chances are like coordinates on a map drawn by physics. You *must* use the map (PP) unless you have "illegible" info (inadmissible evidence).  
    - **Why better**: Maps are static, relativized (e.g., Mercator vs. Polar projections), and justify deference without anthropomorphism. It avoids expert-like agency.  

  ### Does Credence-Deference Survive the Disanalogies?
  Yes—but with crucial nuance. The **core conclusion** (credence should match chance absent inadmissible evidence) holds because:  
  1. PP’s admissibility caveat resolves determinism and extra-evidence cases (breaks #1–2).  
  2. Relativizing chance to setups resolves divergent chances (break #3).  
  However, the analogy’s agential framing **overstates** chance’s authority:  
  - Chance is not an "advisor" but a physical constraint.  
  - Deference is not epistemic trust but a normative requirement from metaphysics.  
  The disanalogies show that PP is better motivated by chance’s role in physics (e.g., guiding credence in indeterministic systems) than by expert-like qualities. The analogy’s value is pedagogical, not foundational—it *illustrates* PP but doesn’t justify it. Replace it with the "map" analogy for clarity, but retain PP’s core insight: chance, as physics’ probability measure, rationally constrains belief.  

  **Final verdict**: The analogy’s breaks are material but not fatal; they reveal PP’s subtleties. Deference survives because PP can stand without the analogy when admissibility and relativization are explicit.
