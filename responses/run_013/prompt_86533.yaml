prompt: |-
  I never studied philosophy formally but I've been reading my way through Nozick's Anarchy, State, and Utopia on my own, and the short bit about animals near the end of the book has been bugging me for months. My half-formed idea: everyone treats that passage as a throwaway where he says animals count for something but he isn't sure what follows, and then moves on. I think it's actually a stress fracture in the whole theory. His rights are supposed to be side constraints grounded in the Kantian idea that you can't use people as mere means, but he also seems to admit that if you ground that status in rationality or self-consciousness, you get the uncomfortable result that some humans (babies, people with severe cognitive disabilities) wouldn't qualify either, and that once you notice this you can't just quietly make an exception for them. So the question I want to work out is whether his view is committed to a much thinner basis for rights -- something like "there's a way things can go for the being" -- which would sweep animals in, and if so, what his minimal state is even allowed to do about it, since protecting an animal from its owner looks exactly like the kind of interference with property he says the state can't do.

  Turn this into a proposal for a six-month independent study grant: what exactly the question is, why the usual ways of reading Nozick leave it unsettled, how I'd actually go about answering it month by month (I'd want to work out the argument on paper, not read around it forever), what a good answer would look like versus just restating the tension, and what would count as the project failing. Be honest about whether six months is enough. Don't worry about citations or a literature review, I'll track down sources myself.
