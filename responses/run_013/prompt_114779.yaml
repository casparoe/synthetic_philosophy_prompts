answer: |-
  ### Runnable Game Design: Unilateralist's Curse Simulation  
  **Goal:** Players viscerally experience the curse—where independent, reasonable decisions lead to group failure due to multiplied error probabilities.  

  ---

  ### **Materials & Prep** (Night Before, No Tech)  
  1. **Envelopes for Rounds**:  
     - Prepare 7 envelopes (one per round). Each contains:  
       - **State Card** (visible only to you): "GOOD" (1/6 chance) or "BAD" (5/6 chance).  
       - **Player Signal Cards**: 18 cards labeled "GREEN" or "RED" (based on state accuracy rules below).  
       - **External Labs Card** (Rounds 6–7 only): Pre-generated release decisions for 5 external labs (e.g., "External Releases: 2").  

  2. **Signal Generation Rules** (Pre-generate using dice/coins):  
     - **If state = GOOD**: 90% GREEN, 10% RED.  
       *Example:* Roll d10 for each player: 1–9 → GREEN, 10 → RED.  
     - **If state = BAD**: 90% RED, 10% GREEN.  
       *Example:* Roll d10: 1–9 → RED, 10 → GREEN.  
     - **External Labs** (Rounds 6–7): Simulate 5 labs. For each, roll d10:  
       - *BAD state*: 1–9 → no release, 10 → release.  
       - *GOOD state*: 1–9 → release, 10 → no release.  
       Record total releases on the External Labs Card.  

  3. **Player Tools**:  
     - 18 decision cards: "RELEASE" (green) / "DON’T RELEASE" (red).  
     - Scoreboard (visible to all): Tracks round outcomes and total score.  

  4. **Payoff Sheet** (For You):  
     ```markdown
     **SCORING**  
     - GOOD STATE:  
       - ≥1 release (any lab) → +1  
       - No release → 0  
     - BAD STATE:  
       - Each release → -1 (group + externals)  

     **PROBABILITIES**  
     - Base rate GOOD: 1/6 (16.7%)  
     - Signal accuracy: 90%  
     - P(GOOD | GREEN) = (0.9 * 1/6) / [(0.9 * 1/6) + (0.1 * 5/6)] ≈ 64.3%  
     - P(at least one BAD release | BAD state) = 1 - (0.9)^n  
       (n = total actors; e.g., n=18 → 1 - 0.9¹⁸ ≈ 85%)  
     ```  

  ---

  ### **Timeline** (90 Minutes Total)  
  **0–5 min: Setup & Rules**  
  - *You say:* "You each run a lab. Each round, a hidden state determines if a ‘release’ is beneficial (GOOD) or harmful (BAD). You’ll get a private signal (GREEN/RED) about the state. Decide independently: RELEASE or DON’T. We’ll track a shared group score."  
  - **Do NOT explain:** Base rates, signal accuracy, or the curse. Hand out decision cards.  

  **PHASE 1: Silent Rounds (No Communication)**  
  - **5–9 min: Round 1**  
    - Open Envelope 1. Distribute signal cards face down.  
    - Players decide silently. Collect "RELEASE"/"DON’T" decisions.  
    - Reveal: State, # group releases, external releases (0), round score, update total.  
  - **9–13 min: Round 2**  
    - Repeat Round 1 with Envelope 2.  

  **PHASE 2: Talk Rounds (Talk, But No Signal Sharing)**  
  - **13–19 min: Round 3**  
    - Open Envelope 3. Distribute signals.  
    - Players discuss strategies (3 min). *They can’t show signals*.  
    - Collect decisions. Reveal outcomes.  
  - **19–25 min: Round 4**  
    - Repeat Round 3 with Envelope 4.  

  **PHASE 3: Rule Rounds (Coordinated Defense)**  
  - **25–32 min: Rule Creation**  
    - *You say:* "Agree on a rule to prevent bad releases (e.g., ‘Only one lab releases’). Write it down."  
    - Groups have 7 min to decide. Rule applies *only* to them.  
  - **32–36 min: Round 5**  
    - Open Envelope 5. Distribute signals.  
    - Players follow their rule. No extra discussion.  
    - Collect decisions. Reveal outcomes.  

  **PHASE 4: External Actors (Curse Escapes Coordination)**  
  - **36–38 min: Introduce Externals**  
    - *You say:* "5 external labs exist. They aren’t bound by your rule and act independently."  
  - **38–44 min: Round 6**  
    - Open Envelope 6. Distribute signals.  
    - Players discuss (3 min). Collect decisions.  
    - Reveal: State, # group releases, external releases (from card), score.  
  - **44–50 min: Round 7**  
    - Repeat Round 6 with Envelope 7.  

  **50–90 min: Debrief**  
  - **Reveal the Curse:** "This is the *unilateralist’s curse*: When many actors independently check if an action is safe, reasonable choices multiply error risk. P(avoiding bad release) = (individual accuracy)^(number of actors)."  
  - **Map Game to Reality:**  
    - Silent Rounds → Uncoordinated real-world actors (e.g., startups, labs).  
    - Talk/Rule Rounds → Coordination attempts (hard in practice!).  
    - Externals → Uncontrollable actors (e.g., rogue states, underground labs).  
  - **Key Arithmetic:**  
    - "With 18 actors, P(bad release | BAD state) = 1 - (0.9)^18 ≈ 85%. Even with 90% accuracy, *more actors = more risk*."  
    - "Your GREEN signal felt 90% reliable, but base rates diluted it to ~64%—another hidden trap."  
  - **Address Clever Player Insight:**  
    - If someone says: "If others release, I can freeload!" → **Acknowledge in debrief:** "Yes! But in Round 1, you didn’t *know* others would release. In reality, secrecy (e.g., proprietary tech) prevents this. The curse persists."  
  - **Honest Limitations:**  
    - "This game simplifies: Real-world signals are noisier, costs of inaction (in GOOD states) can be catastrophic, and states aren’t binary. But the core dynamic—exponential error accumulation—is real. Coordination is harder than in this room!"  
  - **Handout:** Payoff sheet with probabilities/scoring.  

  ---

  ### **Predictable Issues & Fixes**  
  1. **"Why didn’t we talk sooner?!"**  
     - *Fix:* "The curse thrives in fragmented systems. We simulated gradual coordination."  

  2. **Freeloading in Early Rounds**  
     - *Fix:* If players withhold releases "just in case," note: "In Round 1, you had no data on others’ actions. In reality, hesitation risks missing GOOD states." Use scoreboard to show opportunity cost (e.g., GOOD state + no release = 0).  

  3. **Rule Creation Chaos**  
     - *Fix:* Cap time at 7 min. If no consensus, say: "This mirrors real-world friction. Proceed with your best effort."  

  4. **Signal Sharing Attempts**  
     - *Fix:* Restate rules: "You can *say* your signal, but can’t *show* it. No passing cards!"  

  5. **Math Confusion**  
     - *Fix:* Post-game handout clarifies. Emphasize: "It’s not about bad actors—it’s about *P(error)^n*."  

  ---

  ### **What the Game Can’t Simulate (Say This Aloud)**  
  > "Real-world coordination is far harder. Signals are ambiguous; states aren’t binary; actors have misaligned incentives or secrecy; and costs of inaction (e.g., pandemics, climate disasters) can dwarf release risks. This game isolates the *statistical inevitability* of the curse—but policy requires nuance we couldn’t simulate."  

  ---  
  **Outcome:** Players leave feeling the curse’s inevitability and recalling the math: **Risk grows exponentially with actors, not linearly with recklessness**.
