prompt: |-
  I've been circling a piece on the frame problem for months and keep hitting the same wall: everyone from the old AI people to the philosophers to the cognitive scientists tells me it's either trivially solved or deeply unsolved, and I'm now fairly sure they aren't even arguing about the same thing. So before I start interviewing, help me build the spec. What would a theory in this area actually have to deliver to count as a solution -- not to some toy puzzle but to whatever the real problem is? Give me the requirements list: the cases it has to get right (the robot that never bothers to check whether its fuel is running low; the agent that has to know that repainting a wall doesn't move it or make it heavier; the planning system that needs to assume nothing else changes when it acts), the distinctions it must respect rather than collapse (is there really a difference between the metaphysical version, the epistemological one and the computational one, or is that a distinction without a difference?), and the constraints it can't violate -- like, whatever the answer is, it can't require the system to survey every belief against every other belief, because that's the whole intractibility complaint. With the consideration behind each requirement, please, and a mark on which are non-negotiable and which are just preferences of one camp.

  Then the part I actually care about: which of these are genuine desiderata and which are the prejudices of a particular crowd -- say, the people who think the problem is about representation versus the people who think it's about relevance versus the people who think the whole framing is a mistake. If some subset of the requirements can't be met together, say so plainly, because that's the story. And one thing a colleague keeps pushing on me that I want the spec to settle: he insists the frame problem isn't really about relevance or about what stays the same, it's about how you individuate a change or an action in the first place -- is that the same requirement in different clothes, or a genuinely separate one that belongs on the list? Skip scoring the famous proposals, I'll handle that in the piece. I just want the criteria and the reasons behind each, and which single requirement does the most to rule candidates out.
reasoning: |-
  Okay, the user is working on a piece about the frame problem and is frustrated with the conflicting views they've encountered. They need a clear set of criteria to evaluate what counts as a genuine solution. Let me start by understanding their main request. They want a specification list: requirements a theory must meet, including cases to handle, distinctions to respect, and constraints it can't violate. Also, they want to know which requirements are essential versus preferences of certain camps, and if any are incompatible.

  First, I should recall the core issues of the frame problem. It's about relevance, change, and action in AI systems. The classic examples are the robot not checking fuel, repainting a wall without inferring unnecessary changes, and assuming only intended effects occur. The user mentioned three aspects: metaphysical, epistemological, computational. Are these distinct? They probably are. Metaphysical deals with what changes, epistemological with what we know about changes, computational with how to compute it efficiently.

  The user’s colleague suggests the problem is about individuating actions or changes. That’s a key point. Is that a separate requirement? It might tie into how an agent defines the scope of an action, which affects what needs to be considered. So that should be a distinct requirement on the list.

  Now, the requirements. Non-negotiable ones would be avoiding unconstrained inference (combinatorial explosion) and handling relevance determination. These are computational necessities. Then, correctly managing persistence and change is crucial for any practical system. The metaphysical, epistemological, computational distinction needs clarification—maybe as a requirement to respect these layers without collapsing them.

  Cases like the fuel-checking robot and repainting the wall illustrate different facets. The fuel issue is about relevance over time (temporal projection), while repainting is about side effects (ramification problem). Both need separate handling. The colleague’s point about action individuation relates to how an agent conceptualizes actions, which impacts relevance. That should be a distinct requirement, possibly under non-negotiable if it's fundamental to defining the problem.

  Assessing which requirements conflict. For example, perfect metaphysical accuracy might require exhaustive computation, which violates computational tractability. Or, some relevance approaches might oversimplify epistemological nuances. The user needs to know these tensions to explain why the problem remains unsolved.

  Also, identifying which single requirement rules out most candidates. Likely, the computational constraint—avoiding combinatorial explosion—is the toughest. Many approaches fail here because they can't efficiently narrow down relevance without losing necessary inferences.

  The user’s deeper needs: They want clarity amid conflicting expert opinions. They need a framework to critically assess existing solutions, highlighting why the frame problem persists. Unspoken, they might seek a narrative that reconciles or explains the divergent views, showing where the real challenges lie beyond academic debates.

  In structuring the response, listing requirements with considerations, non-negotiables, and camp influences will help. Highlighting incompatibilities, like between computational limits and exhaustive reasoning, addresses their story angle. The colleague’s point adds depth, so including it as a separate requirement emphasizes action ontology’s role in the problem.
answer: |-
  Here's a rigorous specification for a genuine "solution" to the frame problem, built from core challenges, distilled requirements, and critical distinctions. This spec separates genuine desiderata from camp-specific biases and identifies inherent tensions.

  **Core Definition:** The Frame Problem is the **problem of efficiently and correctly determining the relevance of facts and potential changes when reasoning about actions in a dynamic world, while avoiding catastrophic computational intractability and maintaining necessary accuracy.**

  ---

  **The Requirements List (with Considerations & Status)**

  1.  **Relevance Determination (Non-Negotiable):**
      *   **What:** The system must reliably distinguish facts *relevant* to the consequences of an action/task from the vastly larger set of *irrelevant* facts, *without explicit, exhaustive enumeration*.
      *   **Considerations:** Solves the core inefficiency. Prevents the robot from checking orbital mechanics when painting a wall or ignoring low fuel during critical navigation. Addresses the "combinatorial explosion" head-on.
      *   **Camp Influence:** Central to almost all formulations. The *mechanism* for achieving this is the core battleground (logic, probability, heuristics, embodiment).

  2.  **Correct Persistence/Change Prediction (Non-Negotiable):**
      *   **What:** Given an action, the system must accurately infer *what changes* (direct effects) and crucially, *what stays the same* (persistence/frame axioms), handling both implicit persistence (painting doesn't move the wall) and complex side-effects (ramifications - e.g., painting might change the wall's color property but *not* its weight or position, unless paint is very heavy or the act involves moving the robot).
      *   **Considerations:** Solves the "robot repainting the wall" case. Must handle both obvious persistence (metaphysical grounding) and the need to infer it computationally. Directly addresses the "assume nothing else changes" need.
      *   **Camp Influence:** The "classic" frame problem. Non-negotiable for logic-based AI and philosophy. Embodied/dynamic systems approach this differently (through interaction).

  3.  **Temporal Projection (Non-Negotiable):**
      *   **What:** The system must reason about the state of the world *over time*, projecting the effects of actions (and inaction) into the future, including the persistence of relevant states (like fuel level decreasing during movement, unless refueled).
      *   **Considerations:** Solves the "robot ignoring low fuel" case. Requires combining relevance and persistence over extended sequences. Highlights the need for *ongoing* relevance assessment.
      *   **Camp Influence:** Strongly emphasized in planning and situated cognition. Logic-based approaches struggle with continuous change.

  4.  **Computational Tractability (Non-Negotiable):**
      *   **What:** The solution must be *scalable*. It **cannot** require surveying every belief against every other belief, or reasoning exhaustively about all potential side effects for every action. Complexity must be manageable (ideally sub-linear or linear in relevant factors, not combinatorial).
      *   **Considerations:** This is the *intractability complaint* incarnate as a requirement. Any solution violating this fails in any non-trivial world. Rules out naive logical deduction over all frame axioms.
      *   **Camp Influence:** The primary driver for *all* proposed solutions (defaults, probability, situatedness). Non-negotiable for engineers, often the downfall of purely philosophical/logical "solutions".

  5.  **Distinguish Layers (Non-Negotiable):**
      *   **What:** The solution must clearly distinguish or account for:
          *   **Metaphysical:** What *actually* changes in the world due to an action/event? (Ontology of change).
          *   **Epistemological:** What does the agent *know or believe* about what changes and persists? How is this knowledge acquired/updated?
          *   **Computational:** How does the agent *efficiently compute* inferences about change and persistence given its knowledge (or lack thereof) and resource constraints?
      *   **Considerations:** Confounding these layers is why camps talk past each other. A "trivially solved" computational trick (e.g., simple defaults) might ignore deep epistemological or metaphysical issues. A metaphysical account (e.g., causality) doesn't solve the computational problem alone.
      *   **Camp Influence:** Philosophers focus on Metaphysical/Epistemological. AI engineers focus on Computational. Cognitive scientists bridge them. *Collapsing these is a major source of confusion.*

  6.  **Action/Change Individuation (Non-Negotiable - Your Colleague's Point):**
      *   **What:** The solution must address *how the agent individuates actions and changes in the first place*. What constitutes a single "action"? What constitutes a single "change" or "property"? (e.g., is "painting the wall" one action, or a sequence of brushstrokes? Is "color" a single property or composed of hue/saturation/value?).
      *   **Considerations:** This is **fundamental and distinct**. Relevance and persistence *depend* on the chosen granularity of description. A poorly individuated ontology makes relevance determination impossible or arbitrary. Solves the "is repainting one change or many?" aspect. Deeply tied to ontology and representation.
      *   **Camp Influence:** Strongly emphasized in philosophy (ontology, event semantics) and some cognitive science (categorization). Often overlooked or assumed in purely computational "relevance" approaches. **Your colleague is right; this is a core, often underappreciated requirement.**

  7.  **Robustness to Novelty/Uncertainty (Strong Preference):**
      *   **What:** The system should handle novel situations, actions, or unforeseen consequences without catastrophic failure, and deal gracefully with incomplete or uncertain knowledge.
      *   **Considerations:** Real-world requirement. Toy domains often assume complete knowledge and fixed actions. Relevance mechanisms should ideally generalize.
      *   **Camp Influence:** Crucial for situated/embodied AI and cognitive science models. Less emphasized in classical logic-based AI where the domain is fully specified. Probability-based approaches naturally incorporate this.

  8.  **Cognitive Plausibility (Preference - Cognitive Sci Camp):**
      *   **What:** The solution should be consistent with (or ideally, explain) how humans and animals solve analogous problems (e.g., using attention, embodiment, heuristics, learning).
      *   **Considerations:** Important if the goal is understanding natural intelligence, less so for pure engineering.
      *   **Camp Influence:** Core desire of cognitive scientists and some philosophers. Often seen as secondary or irrelevant by AI engineers focused on performance.

  ---

  **Genuine Desiderata vs. Camp Prejudices**

  *   **Genuine Desiderata (Core):** Requirements 1-6 are fundamental. Any credible solution *must* address Relevance, Persistence/Change, Temporal Projection, Tractability, the Layer Distinction, and Action/Change Individuation. These define the problem space.
  *   **Camp Prejudices / Emphases:**
      *   **Representation Camp (Classic AI/Logic):** Prioritizes precise, formal representation (Requirements 2, 5 - Metaphysical/Epistemological) and sometimes downplays Tractability (4) and Action Individuation (6), assuming a "good" representation is given. Can view Relevance (1) as a representational trick (e.g., frame axioms).
      *   **Relevance Camp (Heuristics/Probability):** Focuses overwhelmingly on Requirement 1 (Relevance Determination) and Requirement 4 (Tractability), often using statistical methods or heuristics. Can sometimes neglect the nuances of Persistence (2 - especially ramifications), Temporal Projection (3), and particularly Action Individuation (6), treating actions as atomic givens.
      *   **"Framing is a Mistake" Camp (Embodied/Dynamic/Enactive):** Argues the problem arises *only* from bad (disembodied, symbolic) representation. Believes Requirement 1 (Relevance) and even Requirement 2 (Explicit Persistence) disappear when an agent is situated and acts dynamically in the world (solving via perception-action loops). Prioritizes Requirement 7 (Robustness) and Requirement 8 (Plausibility). Often sees Requirements 5 (Layers) and 6 (Individuation) as artifacts of symbolic thinking. **Critique:** While powerful, this approach can struggle with complex *reasoning* about future consequences (Temporal Projection - 3) or abstract properties not immediately perceivable (e.g., fuel level *trend*).
      *   **Philosophy Camp:** Focuses intensely on Requirements 5 (Layers - Metaphysical/Epistemological) and 6 (Action Individuation), seeking a foundational account. Can be dismissive of Requirement 4 (Tractability) as "mere engineering" or overly skeptical about Requirement 1 (Relevance) being computable in principle.

  ---

  **Incompatibilities & Tensions**

  1.  **Perfect Accuracy vs. Tractability (Requirements 2 & 3 vs. 4):** This is the core, often *insurmountable*, tension. Guaranteeing *always* correct persistence/change and temporal projection (especially complex ramifications) in an open world seems to require reasoning potentially as complex as the world itself (violating 4). All practical solutions trade some accuracy for tractability (using defaults, probabilities, bounds, heuristics). **This is the main reason the problem persists.**
  2.  **Formal Completeness vs. Novelty/Robustness (Requirement 2 precision vs. 7):** Highly formal, logically complete representations struggle with the unexpected. Probabilistic or heuristic approaches handle novelty better but sacrifice guarantees.
  3.  **Representational Explicitness vs. Embodied Solutions (Requirements 1, 2, 5 vs. Embodied View):** The embodied camp claims requirements for explicit relevance determination and persistence inference vanish with the right (non-representational) architecture. Proponents of explicit representation argue complex planning *requires* internal models and reasoning, reinstating the requirements.

  ---

  **The Gatekeeper Requirement**

  *   **Computational Tractability (Requirement 4)** is the single most effective gatekeeper. It immediately rules out:
      *   Naive logical deduction over all frame axioms.
      *   Any solution requiring exhaustive search over all beliefs for every action.
      *   Approaches that scale combinatorially with the size of the state description or action set.
      *   *Why it rules out the most:* Any solution failing this simply doesn't work in non-trivial scenarios. It transforms the frame problem from a philosophical puzzle into an engineering impossibility. While other requirements (like Relevance - 1) are equally *core*, solutions often make *some* claim towards addressing them, however flawed. Failure on Tractability is usually glaringly obvious and fatal.

  **Conclusion for Your Piece:** The core "unsolved" nature stems from the fundamental tension between the **demand for accurate and comprehensive reasoning about change and persistence (Requirements 2 & 3)** and the **absolute necessity of computational tractability (Requirement 4)** in a complex world. Different camps prioritize different facets of Requirements 1-6 and propose solutions that inevitably make trade-offs, often downplaying the requirements emphasized by rival camps. **Action/Change Individuation (Requirement 6) is indeed a distinct, non-negotiable, and often under-discussed pillar of the problem.** A genuine "solution" isn't a silver bullet but a coherent framework demonstrating how it navigates *all* core requirements (especially 1-6) while explicitly managing the inherent trade-offs, particularly the accuracy-tractability tension. Focus your interviews on how proponents address *this specific tension*.
