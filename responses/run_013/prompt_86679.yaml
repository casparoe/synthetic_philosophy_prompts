  | 5 | "Your externalism ignores that moral worth requires *conscious recognition* of duty. A disposition robustly 'tracking' reasons without agential awareness is mere reliability, not virtue." | Kantian | Ties worth to subjective maxims | High | Medium | "Awareness often confabulates (per your work, Dr. [Psych]). Robust counterfactual performance reveals *implicit* recognition—what you’d call ‘latent maxims’—better than self-report." | "Implicit recognition" is un-Kantian | Concede awareness matters for blame |
