  ### Thought Experiment: The Harmonyville Water Rate Referendum

  In the town of Harmonyville, a referendum is held to change the water utility's pricing formula. The current system charges a flat rate per household. The proposed system introduces a conservation-based tier: a low fixed rate for "essential use" (up to 50 gallons per person per day) and a higher rate for excess use. An independent environmental study, commissioned by the town and shared publicly, estimates that 90% of households fall below the essential-use threshold. This reassures voters that the system will reward conservation without raising costs for most. The referendum passes with 75% support. After the vote, an audit reveals the study unintentionally double-counted rainfall data, causing a 30% underestimate of actual household usage. Corrected data shows 70% of households exceed the threshold and will pay more—but the error was an honest oversight, not fraud. No group is singled out (the formula applies uniformly), voters were uncoerced, and the question was clear: "Shall the water utility adopt Tiered Pricing Model B for conservation?"

  ---

  ### Walkthrough: Verdicts by Reading

  1. **Aggregative Reading (Sum of Individual Wills)**  
     **Verdict:** The outcome does **not** express the people's will.  
     **Reasoning:** The aggregative view requires the outcome to reflect voters' actual preferences as expressed. Here, 75% voted "yes" based on flawed data—they believed the new system would lower or maintain costs for 90% of households. The corrected data shows most will pay more, directly contradicting voters' intent (to support a system that rewards conservation without widespread cost increases). The large majority is irrelevant; the defect (inaccurate information) means the vote captures mistaken preferences, not true wills.  
     **Key Feature:** The data error caused voters to misunderstand the policy's *personal impact*, divorcing their expressed will from their actual interests.

  2. **Rousseauian Reading (General Will)**  
     **Verdict:** The outcome **does** express the general will.  
     **Reasoning:** Rousseau's "general will" prioritizes laws that are general in application (applying equally to all) and serve the common good. Here, the pricing formula treats all households uniformly (no group is targeted), and its *intended purpose*—encouraging conservation for shared environmental benefit—aligns with the common interest. The process defect (data error) is incidental; the law's generality and public-oriented object make it an expression of the general will, even if individual voters miscalculated their self-interest.  
     **Key Feature:** The policy's *uniformity* and *common-good aim* (conservation) satisfy Rousseau's criteria, overriding procedural flaws.

  3. **Deliberative Reading (Informed Reflection)**  
     **Verdict:** **Indeterminate**—we cannot know if the outcome reflects the people's will.  
     **Reasoning:** The deliberative view asks what voters *would* support under ideal conditions (full information and deliberation). Here, better data reveals the policy harms most households financially, suggesting voters might reject it. However, the conservation *principle* still has broad support (75% backed it initially), and deliberation could lead to a *revised* tier (e.g., adjusting the threshold) rather than rejection. The binary referendum format forces an all-or-nothing choice, making it impossible to infer whether voters would uphold the *principle* (tiered pricing) or reject this *specific flawed version*. The indeterminacy arises from the structure: a forced vote on a single policy, where the defect invalidates the details but not necessarily the underlying intent.  
     **Key Feature:** The *binary choice* combined with the error’s nature—undermining the policy’s *implementation* but not its *core ideal*—creates irresolvable ambiguity.

  ---

  ### Load-Bearing Feature
  **The data error** is the critical element. If removed, the case collapses:  
  - **Without error:** The aggregative reading says "yes" (the majority’s will aligns with their interests). The Rousseauian reading says "yes" (the law is still general and common-good). The deliberative reading likely says "yes" (informed voters would still support it).  
  - **Collapsed case:** With accurate data, 75% support a policy that benefits 90% of households. All readings converge on "yes," making it uninteresting. The error introduces tension by decoupling intent from outcome while preserving the policy’s generality.

  ---

  ### Strongest Attack (From the Aggregative Side)
  **Objection:** "You smuggled in a *counterfactual standard* for voter intent. The aggregative view cares only about expressed preferences at the time of voting—*whatever* their basis. Voters willed the policy based on the information they had; their ignorance doesn’t negate their 'will.' By requiring voters to be 'correct' about outcomes, you covertly impose a deliberative standard (what they *should* will) on aggregativism, gutting its core tenet: counting actual votes, not hypothetical ones."  

  **Is it decisive?**  
  **Yes, for strict aggregativists.** If "will" is defined purely as the vote itself, the aggregative verdict *must* be "yes" (a large majority chose it). However, the attack fails if aggregativism allows that a will is "actual" only when reasonably informed—but this blurs into deliberativism. The objection highlights a tension in the setup: to satisfy the specification, the scenario *must* treat "will" as dependent on accurate self-interest, which some aggregativists reject. Yet this is unavoidable to achieve the target verdict, making the case a useful probe for when "will" requires epistemic conditions.
