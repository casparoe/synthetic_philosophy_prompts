     *Justification:* Near-consensus in formal grounding literature (e.g., Correia, Schnieder). Loops/reflexivity cause explanatory collapse, so rejection is costly.  

  3. **`(c) Grounding is transitive enough for chains`**  
     **Credence: 0.80**  
     *Justification:* Transitivity often holds in standard cases (e.g., mereological grounding), but controversial in others (e.g., normative grounding). Chains remain broadly viable.  

  4. **`(d) Infinitely descending chains are metaphysically possible`**  
     **Credence: 0.40**  
