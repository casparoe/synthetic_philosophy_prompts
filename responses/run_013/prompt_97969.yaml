  I'm a second-year PhD student working on fundamentality and I'm trying to nail down my own credence on something before a seminar, and I keep going in circles, so I'd rather just see yours decomposed. The claim I want a number on: grounding is well-founded. Spelling that out so it actually has a truth value — there are absolutely fundamental entities; every non-fundamental entity is ultimately, fully grounded in those; and there are no infinitely descending grounding chains and no grounding loops. Take 'grounding' in the thin sense of the non-causal in-virtue-of relation, whatever its exact logic, and let 'absolutely fundamental' mean not grounded in anything. I'd put it at about 0.85 myself; my office-mate, who spends all his time on infinite regress arguments, says 0.4; and I suspect we're not even disagreeing about the same thing, so I want the decomposition more than I want the number.

