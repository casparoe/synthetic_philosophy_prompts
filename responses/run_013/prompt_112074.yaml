prompt: |-
  I run communications for a mid-sized state health department — it's me plus two writers, and basically everything from outbreak notices to the commissioner's op-eds crosses my desk before it goes out, usually on a tight clock. I've been lurking on rationalist blogs and forums for, God, a decade now, and the thing that keeps nagging me is the lying-vs-misleading question. Everyone agrees lying is bad, but honestly half our job is choosing which true things to say and which true things to sit on, and I genuinely can't tell anymore where "framing" ends and "deceiving people" begins. The commissioner's whole guidance is "just don't lie," which is useless, because the drafts that scare me most are ones where every single sentence is literally true. I want a decision procedure my team can actually run on a draft before it ships — grounded in what the philosophy of language actually knows about the gap between what a sentence says and what it gets people to believe (implicature, presupposition, what's asserted vs. what's merely suggested, the difference between "causing someone to have a false belief" and "intentionally deceiving them"), not just vibes.

  So: give me the questions to ask, in order, what counts as a sufficient answer at each step, where the procedure stops with a hard no, and where it has to hand the call to a human because the question is really one of values and not facts. It has to be runnable by a smart writer who's never read any philosophy, in maybe fifteen minutes, and it has to be honest about which steps are just judgment calls dressed up as tests — I'd much rather have a procedure with clearly marked holes than one that pretends to settle everything. Then run it on three drafts of ours. (1) A water-quality notice where we lead with "the water is within legal limits" while burying the fact that the legal limit is way above what our own toxicologist thinks is safe — my instinct is that this is the bad one but I want the procedure to tell me why, if it's really bad. (2) A statement that a clinic closure is "part of a routine review" when the real story is the lease fell through and we're embarrassed. (3) One I think we're actually fine on: a release that says an outbreak is "under investigation" and leaves off "and it's spreading," because at the time we genuinely didn't know which way it was going. I especially want you to flag any case where the procedure says a statement I'm quietly proud of is actually over the line. Also, my two writers are going to ask "what if we can't tell whether the audience will draw the false inference" — build in an answer to that instead of hand-waving.
reasoning: |-
  Okay, the user is in a tough spot. They run communications for a state health department with a small team, and everything from outbreak notices to op-eds goes through them. They're dealing with tight deadlines and the ethical dilemma of framing versus misleading. They've been following rationalist blogs for a decade and are stuck on the lying-vs-misleading question. Their commissioner's guidance is "just don't lie," but that's not helpful because technically true statements can still be deceptive. They need a practical decision procedure grounded in philosophy of language concepts like implicature and presupposition, not just vibes.

  First, I need to understand their core problem. They want a step-by-step process that their team can run in 15 minutes without philosophy knowledge. The procedure must distinguish between acceptable framing and intentional deception, flag judgment calls, and handle cases where the audience's inference is uncertain. They provided three examples to test: a water-quality notice, a clinic closure statement, and an outbreak update.

  Breaking down their needs: The main request is a clear, actionable procedure. But deeper, they might be worried about moral responsibility. They mention drafts that scare them even when true, indicating ethical stress. They need validation for their instincts and a tool to justify decisions to their team and superiors. Also, they want to prevent unintended deception while maintaining public trust.

  Now, analyzing the philosophical concepts involved. Key terms are implicature (what's implied), presupposition (what's assumed), and the distinction between causing false belief and intentional deception. Grice's maxims of conversation are relevant here—people expect communications to be truthful, informative, relevant, and clear. Violating these can mislead even without lying.

  For the decision procedure, it should be a flowchart-style checklist. Steps need to identify false beliefs likely caused, intent, audience context, necessity of omission, and alternatives. Each step must have clear pass/fail criteria. Importantly, mark where judgment is required. Steps 3 and 4 are particularly subjective, needing human judgment.

  Handling uncertain audience inference: The procedure should address this explicitly. If the team can't predict inference, they must assess the risk. High-stakes scenarios require more clarity. The answer isn't to hand-wave but to escalate to a human decision based on potential harm.

  Testing the examples: 
  1. Water-quality notice: Leading with "within legal limits" while hiding that limits are unsafe. This likely fails Step 1 (causes false belief that water is safe) and Step 2 (intent to downplay risk). Step 5 (alternatives) isn't exhausted, so it's deceptive.
  2. Clinic closure as "routine review" when lease fell through. Fails Step 1 (implies planned action) and Step 2 (intent to hide embarrassment). Step 4 (necessity) fails since the real reason is relevant.
  3. Outbreak "under investigation" without mentioning spread. Here, Step 1 passes if the team genuinely didn't know about spread. No false belief caused, so it's acceptable framing.

  The user's pride in the third example holds up, but the first two are flagged as over the line. The procedure validates their instincts with clear reasons, using philosophical concepts without jargon. For the writers' question on uncertain inference, the procedure incorporates risk assessment in Step 1 and escalates to human judgment in Step 3.

  Unspoken needs: The user might feel isolated in ethical decisions and seek a tool to create team consensus. They also need to mitigate personal liability by having a documented process. The procedure offers structure, reducing ambiguity and empowering the team to push back on unethical requests with reasoned arguments.
answer: |-
  Here's a decision procedure based on linguistic philosophy (Gricean maxims, speech act theory) and deception ethics, designed for real-world use by non-philosophers. It focuses on **implicature** (what's implied) and **illocutionary force** (how the statement functions), not just literal truth.

  **The Procedure: "The Implicature Audit"**  
  *(Run in sequence; stop if any step fails)*

  1.  **Step 1: The False Belief Test**
      *   *Question:* "What false belief(s) is a reasonable member of the *target audience* likely to form when reading this statement *in context*?"
      *   *Sufficient Answer:* Identify specific, plausible false conclusions the audience might draw (e.g., "The water is completely safe," "The clinic closure was planned and orderly," "The outbreak is contained").
      *   *Hard Stop?* **YES** if the statement is *designed* or *highly likely* to cause a false belief that *directly undermines the audience's ability to make informed decisions or protect themselves* on the health matter at hand. (e.g., implying safety when risk exists).
      *   *Judgment Call?* **YES.** Requires understanding the audience's background knowledge and the communication context. If unsure, assume the *least sophisticated, most concerned* reasonable audience member. **Addressing Uncertainty:** If you genuinely can't predict inference, ask: "Could this inference cause *significant harm* if false?" If yes, proceed to Step 2 with caution. If no, proceed normally.
      *   *Output:* List likely false beliefs (FBs).

  2.  **Step 2: The Speaker Intent Test**
      *   *Question:* "Is causing this specific false belief (FB) an *intended effect* of the communication? (Not just a side effect, but a goal?)"
      *   *Sufficient Answer:* Honest self-reflection or team discussion. Why *this* phrasing? Why omit *that* fact? Does avoiding the FB require making the statement *less* effective for its *stated* purpose?
      *   *Hard Stop?* **YES** if the answer is clearly "Yes" for *any* significant FB identified in Step 1. Intentional deception is lying, regardless of literal truth.
      *   *Judgment Call?* **YES.** Intent is often inferred from structure and omissions. Look for "smoking guns": burying key info, using misleadingly positive framing for negatives, avoiding direct answers to likely questions.
      *   *Output:* Intent confirmed (STOP - REJECT) or not confirmed (Proceed).

  3.  **Step 3: The Relevance & Necessity Test**
      *   *Question:* "Does omitting the information that would correct the likely false belief (FB) *violate a reasonable expectation* of relevance or completeness for this type of communication? Is the omission *necessary* to avoid a *greater harm*?"
      *   *Sufficient Answer:* a) Does the audience *need* this info for the purpose of the communication? (e.g., Safety notices demand risk transparency). b) Is there a compelling, verifiable public health reason *not* to include it *right now*? (e.g., panic causing worse outcomes, ongoing criminal investigation). "Embarrassment" or "complexity" are *not* sufficient.
      *   *Hard Stop?* **NO.** This is primarily a values/risk judgment.
      *   *Judgment Call?* **YES.** This is the core values question. Grice's Maxim of Relevance/Quantity applies heavily. Err on the side of over-inclusion for health risks.
      *   *Output:* Omission is "Necessary & Justified," "Potentially Problematic," or "Unjustified."

  4.  **Step 4: The Alternative Framing Test**
      *   *Question:* "Is there a way to achieve the *legitimate communication goal* (e.g., inform, reassure, guide action) that is *less likely* to cause the false belief (FB), while still respecting necessary omissions?"
      *   *Sufficient Answer:* Brainstorm concrete alternatives. Can you add a clarifying phrase? Rephrase the lead? Acknowledge uncertainty differently?
      *   *Hard Stop?* **YES** if a readily available, comparably effective alternative *significantly reduces* the risk of the FB *without* creating a new, worse problem and *without* violating justified necessities from Step 3.
      *   *Judgment Call?* **YES.** Assesses feasibility and effectiveness of alternatives under pressure.
      *   *Output:* "Better alternative exists" (STOP - REVISE) or "This is the least misleading option available given constraints" (Proceed with caution).

  **Procedure Summary:**  
  1.  What false beliefs might this cause? (Flag Harmful FBs)  
  2.  Did we *intend* to cause those false beliefs? (If YES: REJECT)  
  3.  Is omitting the corrective info *necessary and justified*? (Values Judgment)  
  4.  Is there a *less misleading way* to say this? (If YES: REVISE)  
  **Final Output:** REJECT, REVISE, or APPROVE (with acknowledgment of potential issues).

  ---

  **Applying the Procedure to Your Drafts:**

  **Draft 1: Water-Quality Notice ("Within legal limits")**
  1.  **False Belief Test:** Likely FB: "The water is safe to drink without concern." (Because "legal limit" implies safety standard to the public; omitting the toxicologist's concern hides known risk).
  2.  **Intent Test:** *Probably YES.* Why lead with "legal limits" and bury the disagreement? Likely intent: To downplay risk and avoid panic/scrutiny. (Smoking gun: Burying the expert's safety concern).
  3.  **Relevance/Necessity:** **Unjustified Omission.** Public *absolutely needs* to know the water might be unsafe despite being legal, especially if vulnerable populations are involved. "Avoiding panic" is not a sufficient justification for hiding known expert dissent on safety. *Necessity fails.*
  4.  **Alternative Framing:** **YES, easily.** "Water quality meets current legal standards. However, our department's toxicologist notes these standards exceed their recommended safety threshold for long-term exposure. [Provide specific guidance based on toxicologist's concern, e.g., 'Vulnerable populations may consider using bottled water']."
      *   **VERDICT:** **HARD STOP at Step 2 (Intent) or Step 3 (Necessity). REJECT.** This is intentional deception via omission and implicature. The procedure confirms your instinct: it's bad.

  **Draft 2: Clinic Closure ("Part of a routine review")**
  1.  **False Belief Test:** Likely FB: "This closure was a planned, proactive step by the department as part of normal operations." (Implies control and foresight).
  2.  **Intent Test:** **YES.** The phrase "routine review" is chosen *specifically* to mask the embarrassing, unplanned reality (lease issue). The intent is to avoid looking incompetent or neglectful.
  3.  **Relevance/Necessity:** **Unjustified Omission.** The *reason* for closure (lease failure) is highly relevant to the public (Was it the department's fault? Landlord's? Is there a systemic issue?) and to patients needing services (How long will closure last? Is it permanent?). Embarrassment is *never* a sufficient justification.
  4.  **Alternative Framing:** **YES.** "The [Clinic Name] location is closing effective [date] due to the unexpected termination of its lease. The Department is actively reviewing options for restoring services to this community as quickly as possible, including identifying alternative sites. This incident is prompting a routine review of our facility leasing procedures." (Acknowledge the real reason, state action, and *then* mention the review).
      *   **VERDICT:** **HARD STOP at Step 2 (Intent). REJECT.** This is a clear intentional deception using implicature ("routine review" implies the *cause* was routine, not the *response*).

  **Draft 3: Outbreak Update ("Under investigation")**
  1.  **False Belief Test:** *Potential* FB: "The outbreak is contained/not spreading." BUT: Is this *likely* given the context? "Under investigation" inherently signals uncertainty. If the statement *doesn't claim* containment and avoids language implying stability ("situation is stable"), the FB is less likely. The audience expectation for "under investigation" is "we don't know the full picture yet."
  2.  **Intent Test:** **NO.** The intent is accurately stated: to inform the public an investigation is ongoing, *because* the trajectory (spreading/contained) is genuinely unknown. Omitting "and it's spreading" is truthful; asserting it would be a lie.
  3.  **Relevance/Necessity:** **Necessary & Justified Omission (Potentially).** You cannot report what you don't know. Asserting spread without confirmation could cause panic and harm. *However,* Step 3 flags a nuance: Is there a *reasonable expectation* to mention *known* indicators (e.g., "cases have been identified in multiple locations") even if spread isn't confirmed? Maybe.
  4.  **Alternative Framing:** **Possibly.** Could you add: "The investigation includes determining whether transmission is ongoing"? This *explicitly* names the uncertainty without asserting spread. It might be better, but the original isn't clearly causing a *necessary* FB.
      *   **VERDICT:** **APPROVE (Passes Steps 1 & 2).** The procedure validates your pride in this one. The potential false belief is less likely and not intended. The omission (of an unconfirmed fact) is justified. Step 4 suggests a *slightly* better alternative, but the original isn't deceptive. **Crucially:** If you *knew* it was spreading but omitted that *because* you didn't want to cause alarm, it would fail Step 2 (Intent) catastrophically.

  **Key Takeaways for Your Team:**

  *   **Literal Truth ≠ Honesty:** The gap is filled by implicature (what you imply) and presupposition (what you assume as background).
  *   **Intent is King (but hard to prove):** If you're phrasing things *to make* people believe something false, it's deception. Be brutally honest about motives.
  *   **Context is Crucial:** Audience expectations matter. A safety notice demands higher transparency than an op-ed.
  *   **Necessity is a High Bar:** Omitting key info is only justified for clear, significant public health harms (not embarrassment, complexity, or PR). "We don't know" is honest; "We're not saying what we know" is often deceptive.
  *   **Alternatives Exist:** If a less misleading way exists that meets your core goal, *use it*. It protects your credibility.
  *   **Uncertain Inference:** Err on the side of clarity, especially for high-stakes health info. If a potential false belief could cause harm, explicitly address it ("We do not yet know if the outbreak is spreading").
  *   **Marked Holes:** Steps 3 (Necessity) and 4 (Alternative Framing) are judgment calls. Document the reasoning ("Omitted X due to Y verified concern; considered Z alternative but rejected because W"). This creates accountability.

  This procedure won't make every decision easy, but it forces explicit consideration of the mechanisms of deception beyond literal falsehoods and provides a structured way to justify decisions (or identify unethical ones) under pressure. It aligns with the spirit of "don't lie" by focusing on "don't *deceive*."
