prompt: |-
  I'm running next month's journal club for the clinicians in our department — they read trials, and there are two epidemiologists in the room who'll tune out if I keep it soft. Topic is Simpson's paradox, forty-five minutes, whiteboard. I dont want to give the usual lurking-variable warning. What I want them to leave with is that the reversal isn't an arithmetic fact, it's a claim about which causal comparison they're entitled to make — same table, two stories, opposite conclusions, and the numbers themselves can't arbitrate. I also half-suspect the reversal is the default rather than a curiosity, so either make that point honestly or tell me it's wrong. Don't explain it to me, plan it: the order the pieces have to come in and why each depends on the one before, the single example that should carry the whole thing (it needs a real reversal, a third variable whose causal role can be flipped from confounder to something you must not condition on by changing only the story, and no distracting moral — which is why I'd rather not use the Berkeley admissions one), the misconceptions this crowd will predictably form and exactly where in the sequence to head each one off, the check at the end that shows they got it rather than just nodded, and what I should openly say I'm skipping at this level. Give it back as exactly five numbered points, one per thing I just asked for, a few sentences each, no preamble and no closing summary.
reasoning: |-
  We are designing a 45-minute session on Simpson's paradox for clinicians and epidemiologists. The goal is to emphasize that the reversal is not just arithmetic but about causal claims and that the numbers alone cannot tell us which comparison is appropriate. We also want to challenge the idea that reversals are rare. We'll use a single example that allows flipping the causal role of the third variable (from confounder to a variable we must not condition on) by changing the story. We'll avoid Berkeley admissions.

  The structure must be five numbered points as requested:

  1. **Order and Dependencies**: The sequence of topics and why each depends on the previous.
  2. **The Single Example**: The example that will carry the session, meeting the criteria.
  3. **Predictable Misconceptions and When to Address Them**: The misconceptions and at which step to head them off.
  4. **Check for Understanding**: How to verify they grasped the key point at the end.
  5. **What to Skip**: What to explicitly state we are skipping.

  Let's break it down:

  ---

  1. **Order and Dependencies**  
     Start by presenting a contingency table without the third variable (showing a reversal when aggregated) to hook them with the paradox. Then introduce the third variable and show the stratified tables. Next, present two contrasting causal stories for the same data: one where the third variable is a confounder (so we condition) and another where it is a mediator or collider (so we don't). This order builds from the observed paradox to the causal reasoning, because the arithmetic reversal is necessary but insufficient; the causal story determines the correct analysis.

  2. **The Single Example**  
     Use a medical example: a study of a new drug (Drug X) vs. old drug (Drug Y) on recovery, with hospital site (Site A and Site B) as the third variable. The aggregated data show Drug Y is better, but within each site, Drug X is better. Now flip the causal story:  
     - Story 1 (confounder): Site is a cause of both drug assignment and outcome (e.g., Site A is rural and uses Drug X more, but also has healthier patients). We must condition on site.  
     - Story 2 (mediator or collider): Drug assignment causes site (e.g., Drug X is given in the ICU and Drug Y on the ward, and ICU patients are sicker). Conditioning on site would block the path of the drug's effect (if site is a mediator) or induce bias (if site is a collider).  
     Same data, opposite conclusions: in Story 1 we trust the stratified analysis (Drug X is better), in Story 2 we trust the aggregate (Drug Y is better).

  3. **Predictable Misconceptions and When to Address Them**  
     - Misconception 1: "Stratifying always gives the right answer." Address this after showing the two stories by emphasizing that conditioning can sometimes introduce bias.  
     - Misconception 2: "The paradox is rare." Address at the end by noting that many real-world comparisons have lurking variables, so reversal is common.  
     - Misconception 3: "Causality is in the data." Emphasize during the causal stories that the data alone cannot tell which story is true; we need domain knowledge.

  4. **Check for Understanding**  
     At the end, present a new table (without a story) and ask: "What additional information would you need to decide whether to condition on the third variable?" Correct answer: the causal structure (or domain knowledge about the relationships). Alternatively, give a story and ask which comparison (aggregate or stratified) they would trust and why.

  5. **What to Skip**  
     Explicitly state: "We are skipping formal causal diagrams (DAGs) and measures of association beyond risk differences/ratios. We are also not covering continuous outcomes or regression, to keep it focused on the paradox in 2x2 tables."

  ---

  Now, write exactly five numbered points as requested, each a few sentences, no preamble or summary.
answer: |-
  1. **Order and Dependencies**  
     Start with a 2×2 table showing aggregate data (e.g., Drug A vs. Drug B, with A appearing inferior overall). Then stratify by a third variable (e.g., disease severity) to reveal reversals in each subgroup (A superior within strata). This sequence forces engagement with the arithmetic paradox first. Next, present two causal stories for the same stratified data: one where severity is a confounder (must condition to see true effect) and another where severity is a collider (conditioning induces bias). The dependency ensures they see the numbers alone can't resolve the conflict—causal context dictates the analysis.

  2. **The Single Example**  
     Use a drug efficacy study: Aggregated data show Drug X has higher mortality than Drug Y. Stratified by hospital type (Urban/Rural), Drug X has lower mortality in both. Story 1 (confounder): Urban hospitals use Drug X more but treat sicker patients (severity causes treatment and outcome). Conditioning is essential. Story 2 (collider): Doctors choose hospital based on suspected severity, and hospital type influences both treatment choice and outcome (e.g., Urban hospitals have better ICU access). Conditioning on hospital blocks a causal path. Same data, opposite conclusions—no moral, just flipped causal roles.

  3. **Misconceptions and Preemptive Timing**  
     After showing stratification, preempt "stratifying always clarifies" by noting it can hide effects when done incorrectly. When presenting stories, counter "the aggregate is obviously biased" by stressing that conditioning on colliders creates bias. Before conclusions, address "reversals are rare" by arguing that unmeasured variables are common in clinical data, making reversal likely when groups differ systematically. Each intervention targets misconceptions as they naturally arise in the flow.

  4. **Check for Understanding**  
     End with a 2×2 table stratified by a variable (e.g., age), showing reversal. Ask: "What causal question would make you trust the aggregate? The strata?" Require them to sketch a brief scenario (e.g., "If age causes treatment, aggregate is misleading; if treatment influences age recording, strata are biased"). This tests if they link causal assumptions to analysis choices, not just arithmetic.

  5. **What to Skip Openly**  
     State: "We’re skipping DAGs, regression, and continuous outcomes—focus is on binary causal roles in contingency tables. We’re also skipping probabilistic interpretations; we’re treating the paradox deterministically for clarity." This sets boundaries and avoids overcomplication.
