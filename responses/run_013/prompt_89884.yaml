answer: |-
  Two economists argue in a kitchen over dividing dessert.

  "Social welfare should weight our utilities equally!" says one, grabbing the cake knife.

  "Harsanyi's theorem *only* gives us a *weighted* sum," the other sighs, holding the plate. "It doesn't *say* the weights are equal!"

  "So we need a separate coin flip to decide who gets the bigger slice?"

  "Exactly. The weights are just... *assumed*."

  "Great. So the theorem tells us *how* to aggregate, just not *fairly* without flipping a coin?"
