  ### Teaching Notes  
  - **Why it avoids "science vs. religion":** Both characters accept divine creation and order, framing the debate as *internal* to theistic philosophy.  
  - **Designed for student engagement:** Each "best move" directly challenges the other’s weakest point (e.g., Zahra on moral responsibility, Kareem on explanatory simplicity), while the unresolved issue ensures ongoing debate.  
  - **Key nuance:** Zahra isn’t a "naive realist"—she grants miracles and divine sustenance, but insists science requires *created* causal structure. Kareem isn’t a "fideist"—he uses empirical skepticism (e.g., "show me the power") to defend theology.  
  - **JSON clarity:** Fields are distinct: Kareem’s "best move" targets metaphysics (occult qualities), Zahra’s targets epistemology (exploitability of regularities).  

  This should leave students arguing whether divine action *competes with* or *enables* natural causality—precisely as you hoped.
