  For psychological continuity, I propose mutual information between time-slices as the closest analog. However, this becomes problematic when considering the cause: lawful dynamics versus miraculous copying. The no-cloning theorem shows why physics must distinguish these cases, contra Parfit's causal indifference.

  The residue analysis crystallizes the key gaps:
  1) Physics discards indexicality (the "I" perspective)
  2) Normative claims about what matters have no physical counterpart
  3) Parfit's causal indifference violates quantum no-go theorems

