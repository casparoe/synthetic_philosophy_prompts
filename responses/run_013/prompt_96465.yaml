       /           \                                                           /            \  
     Yes           No                                                        Yes            No  
    /               \                                                         |              \  
  Q5: Nothing uncountable?                                                 [Deflationary]  Q5: Nothing uncountable?  
   /          \                                                                           /               \  
  Yes         No                                                                         Yes              No  
   |            \                                                                         |                \  
  [Radical]    Q6: Revise logic/set-existence?                                          [Radical]         Q6: Revise logic/set-existence?  
                /             \                                                                          /             \  
              Yes             No                                                                        Yes            No  
              /                 \                                                                      /                \  
  [Constructivist]       [Eliminativist]                                                [Constructivist]        [Eliminativist]  
  ```  
  *(Note: [Radical] appears twice by identical reasoning; Q5→Yes always leads there.)*

  ### **Conclusion**  
  The tree carves the space at joints defined by commitments to **absoluteness**, **language-vs-sets**, and **existence claims**. The elementary submodel test forces each position to confront whether mathematical practice aligns with their metaphysics. Positions genuinely disagree on Q1 (ontology of models) and Q4 (target of the paradox), while diverging further on the nature of uncountability (Q3, Q5) and remedies (Q6). No tenable position avoids the embarrassing commitments noted—each sacrifices an intuition to resolve the paradox.
