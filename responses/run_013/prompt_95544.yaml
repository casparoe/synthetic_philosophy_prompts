  I need to ensure metrical consistency - loose iambic pentameter means 10-syllable lines with unstressed-stressed patterns, but some variation is acceptable. No rhyme required. Each quatrain will start with the tile refrain, followed by three lines expressing changing beliefs about the owner's character.

