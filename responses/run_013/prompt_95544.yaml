answer: |-
  The tiles are spaced exactly half a foot apart.
  I know the owner measures as he goes.
  His careful pencil marks show on the chart
  He keeps for every project he bestows.

  The tiles are spaced exactly half a foot apart.
  The owner, though, is known to rush and guess.
  His eye is careless, playing a loose part
  In work he views as merely more or less.

  The tiles are spaced exactly half a foot apart.
  I saw him lay them, steady with the rule.
  He checked each gap, he played the method's part,
  A craftsman trained in precision as a tool.

  The tiles are spaced exactly half a foot apart.
  But neighbors saw him guessing, making do.
  He slapped them down straight from the crate and mart,
  Indifferent if a fraction slipped askew.

  The tiles are spaced exactly half a foot apart.
  I cannot now recall which tale holds true.
  Did careful hands enact a measured art,
  Or did indifference see the job right through?

  Verdict: neither. The identical refrain reporting the scene remains constant while beliefs about the context shift irreducibly, leaving the perceptual status indeterminate.
