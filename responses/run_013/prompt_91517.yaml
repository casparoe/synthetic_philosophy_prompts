prompt: |-
  Hi — I'm a retired geologist who's drifted into philosophy of science, and I've got a bee in my bonnet about incommensurabilty. I want it turned into a small, precise claim instead of a spooky one. So: build me a thought experiemnt with two research communities that use the same word for what looks like the same thing, but the word's meaning has drifted apart in the way the later Kuhn was after — the kind of drift you can't fix by translating term for term, because what a term means depends on its place in the whole structured vocabulary of the paradigm. Specifications: keep it realistic and small-scale (a field station, a materials lab, a soil survey), don't reuse any famous episode from the history of physics, and keep the scenario under a page. Crucially, the two communities must still share some procedure for settling a disagreement — some check that keeps either side from just dismissing the other as unscientific — so the case isolates meaning-divergence from outright unresolvable disagreement. Then do the work: for each side, say what its term picks out and why it can't be rendered in the other side's vocabulary; say which single feature of the case is doing the work and what happens if you take the shared procedure away (does it become full incommensurability, or something else?); and tell me how a Feyerabend-type who denies that any neutral procedure exists would try to deflate the case, and what someone who thinks word-meanings are fixed by what the world does to our usage would say about whether the meaning really changed. I want to use this in a seminar to show that incommensurability needn't be either trivial or a license for relativism, so the case has to actually generate the verdicts rather than stipulate them. American English, please, and skip the citations — I'll chase those down myself.
