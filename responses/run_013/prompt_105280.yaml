prompt: |-
  Ok this is a weird one. My partner and I have been reading a few pages of philosophy out loud before bed, and we started with the Meditations because neither of us had touched it since college, and now we're completely stuck on the cogito. She's convinced it lands you a real, persisting, substantial self. I've gotten more and more convinced it only gets you that thinking is going on, and that the "I" in it is doing nothing except grammar — I think Lichtenberg and the Buddhist no-self folks are basically right, though I definately can't defend that yet. We keep talking past each other and I'd like something better than another late-night argument.

  Write the joint statement we could both actually sign, as an adversarial collaboration. I want a numbered section of claims we both accept — about what the cogito is as a piece of reasoning, what it's meant to rule out, and what does and doesn't follow from the indubitability of the present thought — then a table of where we still differ, with each side's position phrased in wording that side would accept. Then the cruxes. I'd bet one is whether the first person pronoun there refers to anything at all, and another is whether the cogito is even an inference or is more like a performance you can't step outside of, but tell me if I'm wrong about where the real fault line is. For each crux, give the argument or case we'd both agree bears on it, with each side's prediction written down in advance. If part of our fight turns out to be purely verbal, say which part and why.

  Two things: don't lean on citations or reading lists, we're not building a bibliography, and please separate what's actually settled among people who work on this from what's genuinely contested — don't present one camp's line as if it were the consensus.
