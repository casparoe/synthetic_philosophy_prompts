  We are building a decision procedure based on the etiological theory of content (teleosemantics). The key idea is that a state represents X if:
  1. It was selected (by evolution, learning, or design) to be produced in the presence of X (or in conditions that indicate X).
  2. It was selected to play a role in producing behaviors that are appropriate because of X (i.e., the behaviors are successful when X is present and the state is tokened).
  3. There is a possibility of misrepresentation: the state can be tokened when X is not present, leading to inappropriate behavior.

  The procedure must be runnable by an engineer in an afternoon on a single feature. It will have a series of questions. If at any point the answer does not meet the criteria, the procedure halts with a negative verdict (i.e., we cannot legitimately say the state represents anything). If we get through all the questions, we get a positive verdict and an answer to what it represents.

  We must also account for cases where the question is about the system's purpose (which is a matter of design intention) and we hand off to a person.

  The procedure:

  1. **Question 1: Was the state produced by a mechanism that was shaped by a history of selection (either natural selection, learning, or intentional design) to be produced in specific conditions?**
     - **Sufficient Answer**: Evidence that the mechanism producing the state was modified by a process (e.g., training, evolution, explicit design) that favored its production in certain conditions because of the effects that production had. If the state is the result of an explicitly designed algorithm that was intended to detect X, that counts. If it was learned via a training process that rewarded the system for having the state in the presence of X (and using it appropriately), that also counts.
     - **Halt with Negative Verdict**: If the state arose randomly, or if there is no history of selection (e.g., it's an arbitrary artifact of the architecture without any role in the system's function), then we halt and say the state does not represent.
     - **Handoff**: If the selection history is ambiguous or we cannot determine without making a judgment about the system's purpose, we hand off to a person (e.g., the research lead) to decide what the system is for.

  2. **Question 2: Were the conditions in which the state is supposed to be produced systematically related to a specific type of state of affairs (X)?**
     - **Sufficient Answer**: We can point to a specific type of state of affairs (X) such that the mechanism was selected to produce the state in the presence of (or in conditions indicating) X. This X should be identifiable independently (e.g., dog snouts, intended grasps). We are looking for the conditions that the selection process was "trying" to track.
     - **Halt with Negative Verdict**: If the state is produced in a disorganized way (e.g., it fires for many unrelated things) and there's no unifying X that the selection process was aimed at, then we halt. Also, if the state is produced in response to a non-natural property (e.g., a property that is defined only in the model's internal space and not in the world) and there is no clear mapping, then we might halt.
     - **Handoff**: If there are multiple candidate Xs that the state might be tracking and we cannot decide without appealing to the system's purpose, we hand off.

  3. **Question 3: Was the state selected because it plays a role in producing behaviors that are appropriate only if that specific state of affairs (X) holds?**
     - **Sufficient Answer**: The state is consumed by downstream mechanisms that were selected to produce behaviors that are successful (e.g., lead to reward, achieve a goal) only when X is the case. The state's role in the system is to guide behavior in a way that depends on X.
     - **Halt with Negative Verdict**: If the state does not play any role in producing behavior (e.g., it's an epiphenomenon) or if the behavior it produces is not contingent on X (i.e., the behavior would be produced regardless of X and the state is just one of many causes), then we halt. Also, if the behavior is appropriate for a different state of affairs Y, then we might halt (unless we can resolve the ambiguity in the next question).
     - **Handoff**: If the behavior is appropriate for multiple candidate Xs and we cannot decide without appealing to the system's purpose, we hand off.

  4. **Question 4: Is there a clear possibility of misrepresentation? That is, can the state be tokened when X does not hold, and when that happens, does it lead to inappropriate behavior?**
     - **Sufficient Answer**: We can identify cases (or at least possible cases) where the state is tokened without X, and in those cases, the behavior produced is inappropriate (e.g., leads to failure, is not what the system was selected to do). This is crucial because it shows that the state is not merely correlated with X but is supposed to indicate X for the sake of guiding behavior.
     - **Halt with Negative Verdict**: If the state is only ever tokened when X is present (so no misrepresentation) or if when the state is tokened without X the behavior is still appropriate (so the state isn't really about X), then we halt. Also, if we cannot find evidence of such cases (even in principle) and the state is perfectly reliable, then we might halt because without the possibility of misrepresentation, we don't have a representational state (it might just be a reflex).
     - **Handoff**: If we have cases of misrepresentation but they are ambiguous (e.g., the behavior might be interpreted as appropriate for a different reason), we might hand off.

  If we get through all four questions, we conclude that the state represents X (the specific state of affairs identified in Q2 and Q3).

  Now, run the procedure on the three cases:

  **Case 1: Hidden unit in a vision model that fires reliably for dog snouts**

  1. **Q1**: The state (the unit's activation) was produced by a mechanism (the neural network) that was shaped by training (selection via gradient descent) to be produced in the presence of dog snouts (because the training objective was to classify images, and this unit helped in that task). **Yes**.
  2. **Q2**: The conditions are the presence of dog snouts in the input. The state is supposed to be produced when there is a dog snout. **Yes**.
  3. **Q3**: The state plays a role in producing behavior (e.g., outputting "dog" classification) that is appropriate only if there is a dog (or at least a dog snout) in the image. **Yes**.
  4. **Q4**: There is a possibility of misrepresentation: if there is an image without a dog snout that triggers this unit (e.g., a wolf snout, or a random pattern that looks like a snout), then the model might misclassify it as a dog. This leads to inappropriate behavior (wrong classification). **Yes**.

  **Verdict**: This state represents dog snouts (or more broadly, a feature indicative of dogs). The engineers will like this.

  **Case 2: State in a closed-loop neuroprosthetic controller described as the user's intended grasp**

  1. **Q1**: The state was produced by a mechanism that was intentionally designed (or trained) to be produced when the user intends to grasp. The design of the neuroprosthetic includes algorithms that decode neural signals to infer intention. **Yes** (assuming the system was designed to detect intended grasps).
  2. **Q2**: The conditions are the user having the intention to grasp. The state is supposed to be produced when the user intends to grasp. **Yes**.
  3. **Q3**: The state is used to control the prosthetic to perform a grasp. The behavior (grasping) is appropriate only if the user intended to grasp. **Yes**.
  4. **Q4**: There can be misrepresentation: if the state is tokened without the user intending to grasp (e.g., due to noise in the neural signal or a misdecoding), then the prosthetic will grasp inappropriately. This is a failure of the system. **Yes**.

  **Verdict**: This state represents the user's intended grasp. The engineers will like this too.

  **Case 3: Distilled copy of a trained network, which behaves identically but has no training history of its own**

  This is the tricky one. The distilled network is created by training a new network to mimic the outputs of the original. It has no direct training on the original task (e.g., image classification) but is trained to match the original's behavior.

  1. **Q1**: The state (a particular activation) in the distilled model was produced by a mechanism that was shaped by a training process. However, the training process was not to detect X (e.g., dog snouts) but to mimic the original model's activations or outputs. The selection pressure was for matching the original model, not for tracking the world. 
     - **Answer**: We might say that the mechanism was selected to produce the state when the original model would have produced it. But note: the original model's state was selected for dog snouts. However, in the distilled model, the state is produced because it matches the original, not because of the presence of dog snouts. 
     - This is ambiguous. We might argue that the distilled model's state is selected to be produced when the original model's state is produced. But what is the original model's state? It is a state that represents dog snouts. However, the distilled model does not have a history of being selected for dog snouts. It was selected for matching the original. 
     - We might halt here, but let's see: the engineer might argue that the distilled model is designed to be a copy, so the design intention is that it have the same representational properties. But the etiological theory requires a history of selection for the state in question. The distilled model's state was selected because it matches the original, not because of the world condition (dog snouts). 
     - **Halt with Negative Verdict?** Or handoff? 

  We need to be careful. The procedure says: if the selection history is about matching the original, then the state in the distilled model was selected to be produced when the original model's state is produced. But that is a different condition than the world condition (dog snouts). Therefore:

     - **Q1**: The state was selected (by the distillation training) to be produced when the original model's corresponding state is produced. So the condition is the presence of the original model's state. **But note**: the original model's state is an internal state of another system. This might be acceptable, but then what the state represents is the original model's state, not dog snouts.

     Now, let's proceed:

  2. **Q2**: The conditions in which the state is supposed to be produced: when the original model's state is produced. So X is the original model's state. **Yes**.

  3. **Q3**: The role of the state: to produce behavior that matches the original model's behavior. The behavior (output) is appropriate only if it matches the original model's output. The behavior is not directly about the world (dog snouts) but about matching the original. **So the behavior is appropriate because it matches the original, not because of the presence of a dog snout in the world.**

     Therefore, the state is playing a role in producing behavior that is appropriate when the original model's state is as expected. It is not directly about the world.

  4. **Q4**: Misrepresentation: if the distilled model produces the state when the original model would not (due to some difference in the models), then the behavior (output) would be wrong (because it doesn't match the original). But note: this misrepresentation is about the original model's state, not about the world.

  Therefore, we might conclude that the state represents the state of the original model, not dog snouts.

  But the engineers want it to represent dog snouts because it behaves the same. However, the etiological theory says that the content is fixed by the selection history. The distilled model was not selected for dog snouts but for matching the original. So:

  **Verdict**: The state in the distilled model represents the corresponding state in the original model, not dog snouts.

  This is the verdict the engineers will not like.

  Alternatively, we might hand off at Q1 because the purpose of the distilled model is to replace the original and do the same task. Then a person (the research lead) might decide that the system is for classifying images, so the state should be taken to represent dog snouts. But the procedure requires that we stick to the etiological theory. Without the history of selection for dog snouts, we cannot say it represents dog snouts.

  We'll go with the negative verdict for representing dog snouts. The state in the distilled model does not represent dog snouts; it represents the state of the original model.

  **What the procedure cannot settle**:

  1. **Indeterminacy of content**: Even when we have a positive verdict, there might be multiple equally good candidates for X (e.g., dog snouts vs. dogs). The procedure might not be able to choose between them without appealing to the system's purpose (which might require a handoff). Also, in the case of the distilled model, we had to choose between the original model's state and dog snouts, and we chose the former because of the selection history.

  2. **Gap between what the system does and what it was supposed to do**: The procedure relies on the selection history to determine what the system is supposed to do. But in complex systems, the selection history might be ambiguous. For example, in machine learning, the training data and objective might underdetermine the exact content. Also, if the system is repurposed, the original selection history might not match the current use. In such cases, we must hand off to a person to decide what the system is for.

  3. **Cases without clear misrepresentation**: If a state is perfectly reliable (so no misrepresentation occurs), the procedure might halt at Q4. But in real systems, perfect reliability is rare. However, if we cannot even conceive of a case of misrepresentation, then we don't have a representational state.

  4. **Novel systems without a clear selection history**: For example, a randomly initialized network that happens to have a unit that correlates with something. Without selection, we cannot say it represents.

  5. **Systems with multiple overlapping selection pressures**: The state might have been selected for more than one thing. The procedure might require handoff to resolve the ambiguity.

  In summary, the procedure is grounded in the etiological theory and will often deliver verdicts that align with intuition, but it will sometimes diverge (as in the distilled model case) and sometimes require human judgment when the selection history is ambiguous or when the system's purpose is contested.
answer: |-
  ### Decision Procedure for Etiological Representation in AI Models

  Based on the etiological theory of content (teleosemantics), this procedure determines whether an internal state/feature in an AI model legitimately represents something. Content is fixed by:
  1. **Selection history**: The state must arise from a mechanism shaped by evolutionary, learning, or design-based selection.
  2. **Function**: The state must be *supposed* to be produced in specific conditions (indicating X) and *supposed* to drive behaviors that depend on X.
  3. **Misrepresentation**: The state must be capable of being tokened *incorrectly* (when X is absent), leading to failed behavior.

  **Procedure Rules**:
  - **Engineer Input**: For a given feature, answer each question using system documentation, training data, ablation tests, or controlled experiments.
  - **Sufficient Answer**: Clear evidence from the system's design/training (e.g., "The training data included X, and the loss function punished errors in X-detection").
  - **Halt with Negative Verdict**: If any answer fails the criteria, conclude: "This state does not represent anything."
  - **Handoff to Human**: If the answer depends on contested goals (e.g., "What is this system *for*?"), escalate to the research lead. Document the ambiguity.
  - **Positive Verdict**: If all steps pass, conclude: "This state represents X," where X is the state of affairs identified in Step 2.

  ---

  #### Step-by-Step Procedure

  **Step 1: Selection History**  
  *Question: Was this state produced by a mechanism that was modified by a selection process (evolution, training, or design) to be generated in specific conditions?*  
  - **Sufficient Answer**: Evidence the feature was shaped by:  
    - Training data (e.g., supervised learning with X-labeled examples).  
    - Explicit architectural design (e.g., a hand-coded detector for X).  
    - Optimization pressure (e.g., reinforcement learning rewarding X-dependent behavior).  
  - **Halt**: No selection history (e.g., the state emerges randomly, or is an unselected byproduct).  
  - **Handoff**: Selection history is ambiguous (e.g., the system was repurposed; goals conflict).  

  **Step 2: Conditions of Production**  
  *Question: Was the state selected to be produced in response to a specific, identifiable state of affairs X?*  
  - **Sufficient Answer**: X is observable/testable (e.g., "dog snouts in images," "user's neural signal pattern Y"). Evidence includes:  
    - Correlation between the state and X across diverse inputs.  
    - Ablation tests: Removing the state disrupts X-sensitive behaviors.  
  - **Halt**: X is incoherent (e.g., the state fires for disjoint stimuli with no unifying X) or purely syntactic (e.g., "layer 3, unit 4 activation").  
  - **Handoff**: Multiple candidate Xs fit equally well (e.g., the state responds to "edges" and "snouts" interchangeably).  

  **Step 3: Downstream Function**  
  *Question: Was the state selected to drive behaviors that succeed only when X is present?*  
  - **Sufficient Answer**: The state’s causal role in behavior is:  
    - Necessary for task success (e.g., disabling it causes failure in X-dependent tasks).  
    - Specific to X (e.g., the behavior is inappropriate if X is absent, even if the state fires).  
  - **Halt**: The state is epiphenomenal or drives behaviors indifferent to X (e.g., output is identical regardless of X).  
  - **Handoff**: Behavior success depends on multiple Xs (e.g., grasping requires "intent" + "object proximity").  

  **Step 4: Misrepresentation**  
  *Question: Can the state be tokened when X is absent, causing failed behavior?*  
  - **Sufficient Answer**: Documented cases of:  
    - **False positives**: State fires without X, leading to errors (e.g., classifying a cat as a dog).  
    - **Behavioral failure**: Errors traceable to the state’s misinformation (e.g., prosthetic grasps when no intent exists).  
  - **Halt**: No possible misrepresentation (e.g., state only fires with X; errors are always behavioral, not representational).  
  - **Handoff**: Misrepresentation is possible but ambiguous (e.g., errors could be blamed on downstream components).  

  **Positive Verdict**: If all steps pass, state represents X.  
  **Documentation**: Add verdict to the model card, noting handoffs.  

  ---

  ### Case Applications

  #### **Case 1: Vision Model Unit (Fires for Dog Snouts)**  
  - **Step 1**: The unit was shaped by supervised training on labeled dog images.  
    - *Verdict*: Pass (selection via backpropagation).  
  - **Step 2**: The state fires for dog snouts (tested on ImageNet variants).  
    - *Verdict*: Pass (X = "dog snouts").  
  - **Step 3**: Ablation degrades dog-classification accuracy; correct classification requires snout presence.  
    - *Verdict*: Pass.  
  - **Step 4**: Fires for fox snouts (false positives), causing misclassification.  
    - *Verdict*: Pass.  
  **Final Verdict**: Represents dog snouts. Engineers will like this.  

  #### **Case 2: Neuroprosthetic State ("Intended Grasp")**  
  - **Step 1**: State from a neural decoder trained on user intent data (BCI signals during grasp tasks).  
    - *Verdict*: Pass (selection via calibrated learning).  
  - **Step 2**: State correlates with motor cortex patterns for grasping (validated in trials).  
    - *Verdict*: Pass (X = "user’s intended grasp").  
  - **Step 3**: State triggers grasping; disabling it prevents grasp initiation. Success requires actual intent.  
    - *Verdict*: Pass.  
  - **Step 4**: Noise can token state without intent, causing inappropriate grasps.  
    - *Verdict*: Pass.  
  **Final Verdict**: Represents the user’s intended grasp. Engineers will like this.  

  #### **Case 3: Distilled Model (No Training History)**  
  - **Step 1**: The distilled model was trained to mimic a parent model’s outputs—*not* on original data. No selection for X (e.g., dog snouts).  
    - *Verdict*: **Halt** (selection was for "matching parent’s output," not X).  
  **Final Verdict**: Does not represent anything (e.g., dog snouts).  

  **Why engineers won’t like this**:  
  The distilled model behaves identically to the parent, so intuitively, its states "should" represent the same things. However, without selection pressure from X (only pressure to mimic the parent), the etiological view denies representation. This clashes with functionalist intuitions.  

  **Handoff Note**: If engineers argue the distilled model’s *purpose* is to replicate the parent’s functionality (making "parent’s state" the selected-for X), escalate. This requires defining the system’s teleology—a human decision.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Indeterminacy of Content**:  
     - When multiple Xs fit conditions equally well (e.g., a "snout" unit could represent "mammalian faces" or "dog snouts"), the procedure halts or handsoff. Etiology alone cannot resolve this.  
     - *Example*: A unit firing for both dogs and wolves—does it represent "canines" or "dog-like shapes"?  

  2. **Gap Between "Is" and "Supposed To"**:  
     - If the system drifts from its design (e.g., a model repurposed for adversarial tasks), selection history may not reflect current use. Handoff is required to redefine "what the system is for."  

  3. **Novel or Emergent States**:  
     - States not foreseen by designers (e.g., in self-supervised models) lack clear selection history. The procedure halts, as etiology requires identifiable selection pressures.  

  4. **Perfect Reliability**:  
     - If misrepresentation is impossible (e.g., a state only fires when X is present), Step 4 halts. Etiology demands the *possibility* of error.  

  **Final Note**: This procedure prioritizes rigor over coverage. It reliably detects clear cases of representation but flags edge cases for human judgment—ensuring model cards reflect traceable, auditable claims. Use it as a "first pass" to avoid overanthropomorphization.
