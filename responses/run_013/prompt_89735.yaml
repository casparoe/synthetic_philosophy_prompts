answer: |-
  ### Exam Question  
  **Value Aggregation and the Grain-Wrack Dilemma**  
  (Answer in 90 minutes)  

  Define:  
  - A **grain**: A just-noticeable flicker of mild bodily discomfort (e.g., a fleeting itch), lasting <1 second. It is *so trivial* that no rational agent would expend *any* effort to avoid it, and it leaves no physical/psychological trace.  
  - The **wrack**: 50 years of unremitting, excruciating pain inflicted on one person, with no relief, compensation, or redeeming feature.  

  **First Question**: Is there *any finite number* \(N\) such that an outcome where \(N\) distinct people each experience *exactly one grain* is **worse, all things considered**, than an outcome where one person experiences the wrack? Justify your verdict.  

  **Second Question**: Suppose the grains are distributed such that each person experiences *exactly one grain* and *no one’s life, considered as a whole, is made worse* than it would have been otherwise. Does this change your answer to the first question? Explain why.  

  In your essay:  
  **(a)** State the *general moral principle* underlying your verdict. Explain why it qualifies as a principle (i.e., why it is not arbitrary).  
  **(b)** Identify *one major theoretical cost* of your principle (e.g., commitment to the repugnant conclusion, denial of transitivity/continuity of "better than," or an unexplained discontinuity). Defend why this cost is acceptable.  
  **(c)** Ensure your answer to the second question is consistent with your principle.  

  **Do not survey positions; commit to and defend one view.**  

  ---

  ### Model Answer (710 words)  
  **Verdict**: There is *no finite N* for which \(N\) grains outweigh the wrack. This holds even when grains do not worsen lives overall.  

  **(a) Principle and Non-Arbitrariness**  
  The *Threshold Principle* (TP) governs aggregation: Discomforts below a **severity threshold** do not contribute to aggregate harm, regardless of quantity. A grain falls below this threshold because it is (i) phenomenologically negligible (no enduring impact), (ii) rationally ignorable (no agent would trade resources to avoid it), and (iii) non-compounding (it leaves no residue affecting future experiences). Crucially, TP is non-arbitrary because it tracks *agential rationality*: If no individual would cross a street to avoid one grain, then no social choice mechanism should treat its avoidance as a morally significant interest. To demand otherwise—e.g., that we *must* aggregate grains—imposes a duty disconnected from human values. TP thus reflects a coherence between personal and moral reasoning, avoiding moral schizophrenia.  

  **(b) Theoretical Cost: The Repugnant Conclusion**  
  TP commits us to a variant of the **repugnant conclusion** (RC). If grains cannot aggregate to outweigh the wrack, then a world with vast numbers of lives barely worth living *could* be better than one with fewer excellent lives. For example:  
  - World A: 10 billion people with flourishing lives (value +100 each).  
  - World Z: 100 trillion people with lives containing one grain each (value +99.999 each).  

  TP implies Z is better than A if total utility increases, since grains do not drag lives below "barely worth living." This is RC’s core problem: It sacrifices quality for quantity.  

  **Defending the Cost**: RC is only repugnant if we ignore *epistemic constraints*. We cannot concretely imagine 100 trillion lives, nor verify if they are truly "barely worth living." In practice, RC arises from idealized comparisons irrelevant to real-world policy. Crucially, TP avoids a *greater* cost: **value discontinuity**. If grains *could* outweigh the wrack at some \(N\), we must explain why adding one grain to \(N-1\) people suddenly transforms negligible dust specks into catastrophic harm. Such a discontinuity (e.g., "\(N\) grains = trivial; \(N+1\) grains = worse than wrack") is unmotivated and mysterian. RC, while unintuitive, is a consistent implication of accepting that some harms simply do not scale.  

  **(c) Life-Neutral Distribution: Why It Changes Nothing**  
  The second scenario—where no life is worsened overall—does not alter the verdict. TP already treats grains as *non-harms*: They lack moral weight not because they reduce well-being, but because they fall below the severity threshold for inclusion in aggregation. Even if a grain occurs in an otherwise blissful life, its intrinsic properties (instantaneous, imperceptible post-occurrence, rationally ignorable) render it evaluatively inert. Consider: If I blink during a perfect day, my life is unchanged. Aggregating blinks across persons cannot create a new moral injury. Thus, distributing grains without life-worsening is irrelevant—grains were *never* harms to begin with.  

  **Objection & Reply**  
  *Objection*: If grains are non-harms, why avoid inflicting them? And if we *should* avoid inflicting \(N\) grains (when costless), don’t they aggregate?  
  *Reply*: We avoid inflicting grains out of *courtesy* or *non-maleficence*, not because they constitute harm. Holding a door for someone avoids a trivial inconvenience, but failing to do so isn’t *harmful*. Crucially, TP distinguishes *wrongness* from *harm*. Inflicting grains is *pro tanto* wrong (it violates respect for persons) but does not produce aggregate harm exceeding the wrack. This preserves moral constraints while blocking utilitarian aggregation.  

  **Conclusion**  
  TP delivers a clear verdict: No number of grains outweighs the wrack. The cost—accepting RC—is justified by TP’s grounding in rational choice and its avoidance of implausible discontinuities. Life-neutral distribution is a red herring; grains’ sub-threshold status negates their aggregability. This forces us to confront that some sufferings are *categorically distinct*: The wrack’s horror cannot be matched by piling up nothings.  

  ---

  ### Marking Scheme (25 Points Total)  
  1. **Definite Verdict** (5 points)  
     - *Must hit:* Clear "yes/no" to first question.  
     - *Common error:* Waffling (e.g., "it depends") or refusing to commit.  

  2. **Principle Articulation** (5 points)  
     - *Must hit:* Names a principle (e.g., threshold, lexical priority) *and* justifies its non-arbitrariness (e.g., ties to rationality, phenomenology).  
     - *Common error:* Stating a principle without explaining its normative basis (e.g., "grains don't count" as stipulation).  

  3. **Cost Admission & Defense** (5 points)  
     - *Must hit:* Identifies *one* major cost (e.g., RC, intransitivity) *and* offers a reasoned defense (not dismissal).  
     - *Common error:* Ignoring the cost or claiming the principle has "no downsides."  

  4. **Life-Neutral Analysis** (5 points)  
     - *Must hit:* Explains why life-neutrality does/n’t matter *in terms of the stated principle*.  
     - *Common error:* Treating life-neutrality as decisive without linking to principle (e.g., "no harm, so no problem" without threshold argument).  

  5. **Consistency** (5 points)  
     - *Must hit:* Answers to both questions and the cost analysis cohere with the core principle.  
     - *Common error:* Contradiction (e.g., "grains don’t aggregate" but "life-neutral grains change verdict").  

  \answer{Threshold Denial of Aggregation}
