prompt: |-
  I run the equity-review desk for a city council that has adopted a Rawlsian test for major policy proposals: a proposal may stand only if it can be justified to the residents it leaves worst off. We screen two to four proposals a month — tax changes, zoning, transit fares, school-funding formulas — I get about a week per proposal, the voting panel is made up of non-philosophers, and there is no budget for outside consultants. What I need is a decision procedure the panel can actually run, not an essay on the original position: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision back to the panel because the question is one of values rather than facts. Build it so that it survives the two parts of the theory that do the most work and are the easiest to get wrong — that "the least advantaged" are picked out by an index of primary social goods rather than by income alone, so the worst-off group can change depending on which good you weight, and that the difference principle is a requirement of reciprocity among citizens at the legislative stage, under a veil of ignorance, rather than a case-by-case maximin rule applied at the point of administration — and have it say explicitly which of the two lexically prior requirements (equal basic liberties, then fair equality of opportunity) is doing the work whenever the difference principle on its own would yield a different verdict. Then run the procedure on three proposals: (a) congestion pricing in the downtown core that would fund bus frequency but raise the cost of driving for low-income commuters who have no alternative; (b) replacing a uniform property tax with a land-value tax that every model we have says would raise the disposable income of the poorest decile while shrinking the tax base of the poorest school district; and (c) a proposal of your own choosing that the procedure rejects even though it helps the poor on average. State plainly what the procedure cannot settle, including at least one case where the panel must make a call the theory does not license, and say what a wrong call there would cost. Lead with the procedure's bottom line — the single ordering rule that does most of the work — in one sentence, then give the reasoning, with no preamble and no restatement of this request.
reasoning: |-
  We are building a decision procedure for a Rawlsian equity-review desk. The core is the difference principle, which requires that any policy must be justifiable to the least advantaged group. The least advantaged are defined by an index of primary social goods (rights, liberties, opportunities, income, wealth, and the social bases of self-respect) and not by income alone. The procedure must respect the two lexically prior principles: first, equal basic liberties; second, fair equality of opportunity. The difference principle applies only if the first two are satisfied.

  The procedure must be practical for non-philosophers and run in a limited time. We break it into steps, each with a clear question and criteria for sufficiency. The procedure stops and rejects a proposal if at any step it fails. Only if it passes all steps does it go to the panel for a final decision (which may still be rejected on other grounds, but the Rawlsian test is passed).

  **Bottom line in one sentence:** 
  A policy proposal stands only if, after securing equal basic liberties and fair equality of opportunity, it improves (or at least does not reduce) the index of primary social goods of the least advantaged group, defined as the group that would be worst off under the policy in terms of the weighted index of primary social goods, with weights determined by the relative importance of each good in enabling the exercise of the two moral powers (a sense of justice and a conception of the good) in the context of the society.

  **The Decision Procedure:**

  **Step 1: Check Equal Basic Liberties**
  - **Question:** Does the policy infringe on any citizen's basic equal liberties? (Basic liberties include: freedom of thought, liberty of conscience, political liberties, freedom of association, freedoms specified by the liberty and integrity of the person, and the rights and liberties covered by the rule of law.)
  - **Sufficient Answer:** The policy must not restrict any basic liberty for any group, unless such restriction is necessary to protect the same liberty for others, and the restriction is the least burdensome means to achieve that protection. If the policy does restrict a basic liberty, the burden of proof is on the proponents to show that it meets these conditions.
  - **If the answer is no (i.e., it infringes without justification):** Stop and reject the proposal.
  - **If the answer is yes (no infringement, or justified):** Proceed to Step 2.

  **Step 2: Check Fair Equality of Opportunity**
  - **Question:** Does the policy undermine fair equality of opportunity? (Fair equality of opportunity requires that those with the same talents and willingness to use them have the same prospects of success regardless of their initial place in the social system.)
  - **Sufficient Answer:** The policy must not create or exacerbate arbitrary barriers (e.g., based on race, gender, class) to positions and opportunities. It should not reduce access to education, training, or other means necessary to compete for positions. If it does create barriers, the proponents must show that the barriers are unavoidable and that the policy is the least harmful way to achieve a goal that is essential for the basic structure and that no alternative without the barrier is feasible.
  - **If the answer is no (it undermines without justification):** Stop and reject the proposal.
  - **If the answer is yes (no undermining, or justified):** Proceed to Step 3.

  **Step 3: Identify the Least Advantaged Group**
  - **Note:** This step is critical and requires data. The panel must have data on the distribution of primary social goods (or reasonable proxies) across groups. Groups can be defined by relevant characteristics (e.g., income decile, race, gender, disability status, or combinations) that are known to correlate with disadvantage. The index of primary goods includes:
    1. Basic liberties (already secured in Step 1, so we assume they are equally distributed).
    2. Freedom of movement and free choice of occupation (opportunities).
    3. Powers and prerogatives of offices and positions of responsibility.
    4. Income and wealth.
    5. The social bases of self-respect.
  - **Question:** Under the proposed policy, which group is the least advantaged? That is, which group has the lowest index of primary goods?
  - **Method:** 
    - Assign weights to each primary good. The weights are not fixed but must reflect the relative importance of each good in enabling the exercise of the two moral powers in the society. For practicality, use a set of weights that are publicly justifiable and based on expert consensus (e.g., from social science research on what is necessary for full participation in society). If there is no consensus, the panel must choose weights that are reasonable and defensible. 
    - Calculate the index for each group by combining the levels of each primary good (using the weights). The group with the lowest index under the policy is the least advantaged.
  - **Sufficient Answer:** The identification must be based on the best available data and a reasonable weighting scheme. If the data is insufficient, the proposal must be sent back for more data or rejected if time does not permit.
  - **If the least advantaged group cannot be identified with reasonable certainty:** Stop and reject the proposal (or send back for more data if feasible, but within the one-week constraint, rejection is more likely).
  - **Otherwise:** Proceed to Step 4.

  **Step 4: Apply the Difference Principle (Reciprocity Requirement)**
  - **Question:** Can the policy be justified to the least advantaged group? That is, does the policy improve (or at least not reduce) their index of primary goods compared to the status quo? And is the policy part of a system that works to their advantage over time? (Note: This is not a simple maximin at the point of administration but a requirement of reciprocity in the basic structure. We are to ask: would the least advantaged, as defined in Step 3, have reason to accept the policy as part of a system that is mutually advantageous?)
  - **Sufficient Answer:** 
    - The index of the least advantaged group under the policy must be at least as high as under the status quo. If it is lower, the policy fails unless the proponents can show that the policy is necessary to prevent a greater decline in the index in the future (which is very hard to prove and must be based on strong evidence). 
    - The policy must not exploit the least advantaged. The benefits to the better off must be tied to improving the situation of the least advantaged. If the policy helps the better off more than the least advantaged, it must be shown that without the policy, the least advantaged would be even worse off, and the policy is the best way to improve their position.
  - **If the answer is no (the index is lower and no sufficient justification):** Stop and reject the proposal.
  - **If the answer is yes (the index is at least maintained or improved, and the reciprocity condition is met):** The proposal passes the Rawlsian test and can be handed to the panel for a final decision (which may consider other factors beyond the Rawlsian test).

  **Where the procedure stops with a no:**
  - Step 1: If basic liberties are infringed without justification.
  - Step 2: If fair equality of opportunity is undermined without justification.
  - Step 3: If the least advantaged group cannot be identified (due to data or weighting issues).
  - Step 4: If the least advantaged group is made worse off without sufficient justification.

  **Where the procedure hands the decision back to the panel (values vs facts):**
  - The weighting of primary goods in Step 3: The weights are not given by Rawls and require a value judgment. The panel must choose weights that are reasonable and publicly defensible. This is a point where the procedure cannot settle the matter purely by facts. The panel must make a call on the relative importance of different primary goods.
  - In Step 4, the requirement of reciprocity and the long-term advantage may involve value judgments about what counts as a sufficient justification. However, the procedure sets a high bar: the index must not decrease, and any exception must be based on strong evidence of long-term necessity.

  **What the procedure cannot settle:**
  1. **The weighting of primary goods:** Rawls does not specify exact weights. The panel must decide the weights based on what they think is reasonable and necessary for the exercise of the two moral powers. This is a value judgment. A wrong call (e.g., overemphasizing income and underemphasizing the social bases of self-respect) could lead to misidentifying the least advantaged group and thus misapplying the difference principle.
  2. **Long-term predictions:** In Step 4, if the immediate effect is a reduction in the index but proponents argue it will prevent a future collapse, the panel must judge the credibility of the evidence. This is not purely factual because it involves predictions and uncertainty. A wrong call could cost the least advantaged group a significant decline in their primary goods.

  **Running the Procedure on Three Proposals:**

  **Proposal (a): Congestion Pricing in the Downtown Core**
  - **Step 1:** Does it infringe on basic liberties? The liberty of movement might be raised, but this is not a basic liberty in the sense of being unrestricted (traffic regulations are common). The policy does not target any particular group's basic liberties. It passes Step 1.
  - **Step 2:** Does it undermine fair equality of opportunity? It might if low-income commuters without alternatives are prevented from accessing jobs. This could create a barrier to employment. Proponents must show that the policy is the least burdensome way to achieve the environmental and transit goals, and that the revenue will be used to improve alternatives (like bus frequency) that will eventually restore or enhance opportunity. If they can show that, it passes. Otherwise, it fails at Step 2.
  - **Step 3:** Identify the least advantaged. The low-income commuters with no alternative might be one candidate. But we must consider the index: they may lose income (due to the fee) and opportunities (if they cannot afford to drive and there is no alternative). However, the revenue will fund bus frequency, which may improve opportunities for others (e.g., bus riders). We must weigh the primary goods. The group of low-income drivers without alternatives may have a lower index than other groups under the policy. They become the least advantaged.
  - **Step 4:** Does the policy improve (or not reduce) the index of the least advantaged? Initially, the low-income drivers may have a reduction in income and freedom of movement. But if the bus improvements are immediate and provide a better alternative (so they can switch without loss of opportunity) then their index might not fall. If the bus improvements take time, then the index may fall. Also, the long-term environmental benefits (health) might be considered in the social bases of self-respect. However, the immediate effect on the least advantaged is negative. Without a strong justification that the policy is necessary to prevent a greater harm (e.g., environmental collapse that would hit the poor hardest) and that there is no alternative, the policy fails Step 4.

  **Verdict for (a):** Likely fails at Step 4 unless the bus improvements are so immediate and effective that the least advantaged group (the low-income drivers) can switch without loss. Without that, it fails.

  **Proposal (b): Replacing Uniform Property Tax with Land-Value Tax**
  - **Step 1:** No impact on basic liberties.
  - **Step 2:** Fair equality of opportunity? The poorest school district may lose tax base, which could reduce school funding and thus opportunity. But the proposal raises the disposable income of the poorest decile. The question is whether the loss in school funding (which affects opportunity) is offset by the increase in disposable income (which might be used for education). Proponents must show that the overall effect on opportunity is non-negative. If the poorest decile and the poorest school district overlap significantly, then the increased disposable income might be used to fund schools. But if they are disjoint, then the school district's loss might not be compensated. If the panel determines that the policy undermines opportunity without justification, it fails at Step 2. Otherwise, it passes.
  - **Step 3:** Identify the least advantaged. The poorest decile may have increased income, but the poorest school district (which may be a geographic group) may have reduced resources for schools. We must consider the index: the primary goods for the residents in the poorest school district. They may have a reduction in the social bases of self-respect (if schools decline) and in opportunities. The least advantaged group might be the children in the poorest school district. We must calculate the index for that group and compare to others. It could be that the children in that district become the least advantaged.
  - **Step 4:** Justification to the least advantaged? The children in the poorest school district may experience a decline in the primary good of opportunities (due to worse schools). The increase in disposable income of the poorest decile (which might include their parents) might not offset the school funding loss. If the disposable income increase is enough to allow parents to move to a better district or pay for private schooling, then the index might not fall. But if not, the index falls. Without a strong justification (e.g., that the land-value tax will spur economic development that will eventually increase the school tax base), the policy fails.

  **Verdict for (b):** It may fail at Step 4 if the least advantaged group (the children in the poorest school district) see a decline in their index of primary goods.

  **Proposal (c): A Proposal that Helps the Poor on Average but is Rejected**
  - **I choose: Eliminating a subsidy for public transportation that is primarily used by low-income residents and using the savings to fund a job training program that targets the same group.**
    - *Rationale:* On average, the poor might be better off because the job training program could lead to higher incomes. However, the immediate effect is that the least advantaged group (those who rely on the subsidy and cannot afford the full fare) lose access to transportation, which may prevent them from getting to the training or their current jobs.
  - **Step 1:** No impact on basic liberties.
  - **Step 2:** It may undermine opportunity for those who lose transportation access. But the job training program aims to enhance opportunity. If the training program is designed to be accessible without the subsidy (e.g., online) then it might pass. Otherwise, it may fail at Step 2.
  - **Step 3:** The least advantaged group might be the very poor who depend on the subsidy and do not have the means to pay the full fare. They lose income (because they must pay more) and opportunities (if they cannot travel). Their index falls.
  - **Step 4:** The index of the least advantaged falls. The justification is that the job training program will eventually help them. But the immediate loss may be too severe. Without a phase-in or a guarantee that the training program will immediately compensate, the policy fails.

  **Verdict for (c):** Rejected because the least advantaged group (the very poor who depend on the subsidy) are made worse off in the short term without sufficient guarantee of long-term gain.

  **What the procedure cannot settle (with an example):**
  - **Weighting the primary goods:** Suppose a policy that increases income for the poorest decile but reduces their political participation (e.g., by making voting more difficult for them due to longer working hours). The panel must decide how to weight political participation (a basic liberty) versus income. The procedure requires that basic liberties are already secured (Step 1) so if the policy reduces political participation, it would fail at Step 1. But if the reduction is not in a basic liberty but in another good (e.g., the social bases of self-respect), then the weighting becomes critical. A wrong call (e.g., underweighting the social bases of self-respect) might lead to accepting a policy that actually leaves the least advantaged worse off in terms of their overall index.

  **Case where the panel must make a call the theory does not license:**
  - **Example:** In Step 3, if the data is incomplete or conflicting (e.g., one study shows group A as the least advantaged, another shows group B), the panel must choose which data to use. The theory does not provide a rule for which study is more reliable. The panel must use their best judgment. A wrong call (choosing the wrong study) could lead to misidentifying the least advantaged group and thus applying the difference principle incorrectly. The cost could be that the true least advantaged group is made worse off.

  **Conclusion:**
  The procedure is a practical application of Rawls's principles. It requires data and value judgments at key points. The panel must be transparent about these judgments and err on the side of the least advantaged when in doubt.
answer: |-
  ### Decision Procedure for Rawlsian Equity Review

  **Bottom line:** A policy stands only if it first secures equal basic liberties and fair equality of opportunity, and then improves (or does not reduce) the index of primary social goods for the group identified as worst off under the policy, with the index weights reflecting the relative importance of each good for enabling the two moral powers (a sense of justice and a conception of the good) in society.

  #### Procedure Steps
  1. **Check equal basic liberties (lexically prior):**  
     - **Question:** Does the policy infringe on any citizen's basic liberties (e.g., political rights, freedom of conscience, due process) without being the least restrictive means to protect others' liberties?  
     - **Sufficient answer:** No infringement, or infringement is narrowly tailored to protect a more fundamental liberty (e.g., public safety).  
     - **Stop with "no" if:** Infringement is unjustified (e.g., a transit fare hike that denies voting rights to non-payers).  
     - **Hand back if:** Balancing liberties requires value judgments (e.g., weighing free speech against public order).  

  2. **Check fair equality of opportunity (lexically prior):**  
     - **Question:** Does the policy reduce access to opportunities (e.g., education, jobs) for groups with similar talents and effort?  
     - **Sufficient answer:** No reduction, or reduction is offset by greater opportunity gains for the most disadvantaged (e.g., a school funding cut is paired with targeted scholarships for low-income students).  
     - **Stop with "no" if:** It entrenches arbitrary barriers (e.g., zoning that excludes affordable housing near jobs).  
     - **Hand back if:** Opportunity trade-offs involve unresolvable empirical disputes (e.g., whether a job training program truly levels the playing field).  

  3. **Identify the least advantaged group (using primary goods index):**  
     - **Question:** Which group has the lowest weighted index of primary social goods (basic liberties, opportunities, income/wealth, social bases of self-respect) under the policy?  
     - **Method:** Use available data to score groups (e.g., by income decile + race/age/disability). Weights must prioritize goods essential for moral powers (e.g., self-respect may outweigh marginal income gains).  
     - **Sufficient answer:** Clear identification using defensible weights (e.g., opportunities weighted higher than income if data shows mobility barriers).  
     - **Stop with "no" if:** Data gaps prevent identification (e.g., no metrics for self-respect impacts).  
     - **Hand back if:** Weighting requires value choices (e.g., income vs. social respect trade-offs).  

  4. **Apply the difference principle (reciprocity test):**  
     - **Question:** Does the policy improve (or not reduce) the index for the least advantaged group identified in Step 3, as part of a reciprocal system that benefits all?  
     - **Sufficient answer:** Index improves or is stable, with no sacrifice of the worst-off for others' gain. If index falls, proponents must prove it is necessary to prevent collapse (e.g., a tax cut for the rich only if it averts recession harming the poor).  
     - **Stop with "no" if:** Index declines without systemic justification (e.g., the poor bear costs while gains flow upward).  
     - **Hand back if:** Long-term reciprocity claims hinge on contested forecasts (e.g., economic growth projections).  

  #### Where Lexical Priority Overrules Difference Principle
  - If the difference principle alone would approve a policy (e.g., it raises the poor's income) but **equal liberties** are violated (e.g., it restricts assembly rights), Step 1 rejects it.  
  - If the difference principle approves but **fair opportunity** is undermined (e.g., it funds schools by excluding immigrants), Step 2 rejects it.  

  --- 

  ### Application to Proposals
  **Proposal (a): Congestion Pricing Funding Buses**  
  - **Step 1:** No liberty infringement (driving isn’t a basic liberty). → Proceed.  
  - **Step 2:** Fair opportunity at risk for low-income commuters with no alternatives. If bus funding creates new options, opportunity may improve; if not, it fails. → **Hand back:** Panel judges if bus gains offset driving barriers.  
  - **Step 3:** Least advantaged group: Low-income drivers with no alternatives (index: high transport costs lower income/opportunity/self-respect).  
  - **Step 4:** This group’s index likely falls (costs rise without immediate relief). No systemic justification (e.g., no proof pricing prevents collapse). → **Stop with "no"** unless panel overrules based on Step 2 handback.  

  **Proposal (b): Land-Value Tax Replacing Property Tax**  
  - **Step 1:** No liberty issues. → Proceed.  
  - **Step 2:** Poorest school district’s funding loss may undermine opportunity. If poorest decile’s income gains enable better education, it passes; if not, fails. → **Hand back:** Panel weighs income vs. school opportunity.  
  - **Step 3:** Least advantaged group: Residents in poorest district (index: school cuts reduce opportunity/self-respect, outweighing income gains if disjoint from poorest decile).  
  - **Step 4:** This group’s index likely falls (schools deteriorate). No collapse justification. → **Stop with "no"** unless panel overrules based on Step 2.  

  **Proposal (c): Eliminating Weekend Bus Service to Fund Homeless Shelters**  
  - **Rationale:** Helps the poor on average (shelters benefit many) but harms the worst-off (e.g., low-wage workers reliant on weekend buses).  
  - **Step 1:** No liberty infringement. → Proceed.  
  - **Step 2:** Bus cuts limit job access for weekend workers. → **Stop with "no"** (undermines fair opportunity without offset).  
  - **Step 3 (if not stopped):** Least advantaged: Weekend workers with no alternatives (index: opportunity/income drop).  
  - **Step 4:** Index declines. → **Stop with "no"** regardless of average gains.  

  --- 

  ### What the Procedure Cannot Settle
  1. **Weighting primary goods:**  
     - **Example:** A policy boosting income but eroding community trust (social bases of self-respect). The procedure requires weights but offers no formula.  
     - **Panel must make unlicensed call:** If trust is underweighted, the least advantaged may be misidentified.  
     - **Cost of wrong call:** Eroding self-respect could deepen disadvantage (e.g., mental health crises), even with income gains.  

  2. **Long-term reciprocity under uncertainty:**  
     - **Example:** A temporary tax cut for businesses, claimed to prevent job losses. Step 4 requires proof of systemic necessity, but forecasts are speculative.  
     - **Panel must make unlicensed call:** Accepting weak evidence risks exploiting the poor if jobs don’t materialize.  
     - **Cost of wrong call:** Permanent loss to the worst-off (e.g., service cuts during recession).  

  **Key limitation:** The procedure cannot resolve conflicts where data is absent or weights are disputed, forcing the panel to use judgment Rawls does not prescribe. This risks misapplying the difference principle if primary goods are mismeasured.
