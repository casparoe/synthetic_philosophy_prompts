prompt: |-
  I'm presenting a paper next month that defends a selective eliminativism, and I need to be ready for the discussion. My thesis is that the computational neuroscience of prediction and reward has made something like graded, probabilistic belief defensible as a real state of the organism, but that the ordinary notion of desire -- a single natural kind, a propositional attitude with its own direction of fit -- has come apart under the evidence into a heterogeneous collection of reward-prediction, drive, and homeostatic mechanisms, and so should be eliminated rather than reduced. The audience is a cognitive science colloquium: several computational neuroscientists who build reinforcement-learning and active-inference models and believe their formalisms already contain beliefs and desires; a couple of philosophers of mind sympathetic to an instrumentalist reading of the intentional stance; and two clinical researchers who rely on belief-and-desire vocabulary in case formulation. Draft my Q&A prep sheet: the objections this specific room will actually raise -- not the ones I'd get from a philosophy-of-mind seminar -- ordered by how much damage they do, each phrased the way that particular critic would phrase it, with a two-minute reply and a candid note on where the reply is weakest. Include the one question I'm hoping nobody asks.
