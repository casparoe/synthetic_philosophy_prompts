  I spent most of last night arguing with a friend who works on climate economics, and I came away less sure than I started that my own views about discounting the future actually fit together. I'd like you to audit them. Here is roughly where I've landed. (1) In ethics I hold a strict no-pure-time-preference principle: the bare fact that a benefit or harm occurs later is no reason by itself to count it for less, so the ethical discount on well-being should be zero. (2) Prudentially, though, I think near-bias is often rational — even setting aside any uncertainty about whether I'll still be around, I think it can be reasonable for me to prefer a somewhat smaller good now to a somewhat larger good later, and I don't feel obliged to be perfectly time-neutral about my own life. (3) I'm suspicious of any view that says the intrapersonal case and the intergenerational case run on fundamentally different logics; I think the reasons governing how I weigh my own future should be the same in kind as those governing how we weigh future generations. (4) In policy, I think a positive consumption discount rate of a few percent is defensible for climate cost-benefit analysis, and I'm closer to Nordhaus than to the near-zero rate associated with the Stern Review. (5) I'm a totalist in population ethics: what matters is the total sum of well-being, present and future, counted impartially. (6) I reject the Repugnant Conclusion — a vast world of lives barely worth living is not better than a smaller world of flourishing lives. (7) I think discounting a life, treating a future death as less bad merely because it is later, is impermissible, whatever we decide to do about consumption.

  I suspect these can't all be true, but I honestly can't see where the fault line is, and my friend kept insisting the tension I was worried about isn't real while ignoring ones I now half-suspect are. Please tell me which of these are genuinely in tension, which pairs only look like they are, and for each genuine tension what the cheapest repair would be and what it would cost me. Rank the genuine tensions by severity rather than listing everything as equally bad, and don't simply tell me to drop whichever commitment is inconvenient — if one has to go, show me what giving it up costs. Be explicit about which claims are settled and which are genuinely contested among people who know this literature; I don't want a contested verdict, say about the rationality of near-bias, handed to me as though it were the consensus.

