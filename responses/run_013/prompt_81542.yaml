  Please act as a philosopher of language with a solid grounding in both analytic philosophy and the philosophy of science, and help me untangle a distinction that keeps slipping away from me. I am a software engineer with no formal philosophy training; I know Quine's indeterminacy of translation mainly through the gavagai example, and I know the familiar slogan that theories are underdetermined by the evidence we have for them. Those two ideas tend to get mentioned in the same breath, and I suspect that lumping them together loses something important. Could you compare Quine's indeterminacy of translation with the general underdetermination of theory by evidence, and say as precisely as you can where they come apart and what different work each one is doing? To make this concrete rather than abstract: suppose I am reverse-engineering an undocumented binary protocol from a legacy system, and I end up with two decoding schemes that make identical predictions about every byte I will ever observe but disagree about what the fields actually mean — which of those two ideas, if either, does my situation illustrate, and why is it not the other one? Please think carefully before you commit to an answer, and if it helps, begin by setting out in prose what a specialist would regard as the genuine points of contrast. I would much rather have a careful, honest treatment that flags the places where interpreters legitimately disagree than a tidy summary that smooths those over. Write your answer as continuous prose, with no headings, bullet points, bold text, or tables — just the way you would explain it in a long email to a colleague.
