answer: |-
  ### Galactic Expansion Simulation: Rules & Materials  
  **Core Concept:** Players represent civilizations in a galaxy. Survival requires resources (from controlled systems), but actions risk detection. Goal: Maximize resources by game end.  

  ---

  #### **Materials**  
  1. **Whiteboard**: Draw a 5x5 grid (25 star systems). Mark 5 random systems as uninhabitable (X). Label axes (A-E rows, 1-5 columns).  
  2. **Index Cards** (1 per player):  
     - *Front*: Civilization name, starting resources (5 units).  
     - *Back*: Starting location (e.g., B3—secret until revealed).  
  3. **Tokens**: Use colored markers for:  
     - Visibility (dot on board when revealed).  
     - Controlled systems (circle with player initial).  
  4. **GM Tools**: Master map (track locations/resources), action slips (small paper).  

  ---

  #### **Rules**  
  **1. Setup**  
  - GM assigns each player a starting system (hidden, non-adjacent). Players know only their location.  
  - Each round = 10 minutes (total 5 rounds).  

  **2. Actions (Per Round)**  
  Players submit **one action per slip** (secretly to GM):  
  - **Hide**: Do nothing. Stay hidden if undetected. Cost: 0.  
  - **Expand**: Colonize an adjacent habitable system. Gain +1 resource/turn (next round). **Reveals your location to all.** Cost: 2 resources.  
  - **Broadcast**:  
    - *Cheap Talk (Round 2)*: Send a message (e.g., "We come in peace!"). **Reveals location.** Cost: 0.  
    - *Costly Signal (Round 4)*: Send a **verifiable promise** (e.g., "No attack next round"). **Reveals location.** Cost: 2 resources. *If broken, lose 5 resources (GM enforces)*.  
  - **Attack**: Target a visible civilization. Target loses half resources (rounded down); attacker gains them. **Attacker revealed if hidden.** Cost: 3 resources.  

  **3. Detection & Visibility**  
  - **Asymmetric Detection**:  
    - Expanding/broadcasting makes you visible to **all**.  
    - Seeing others **does not** reveal you (hidden players see visible threats).  
  - Visible players remain visible forever. GM updates board each round.  

  **4. Resources & Survival**  
  - **Gain**: +1 resource per controlled system (end of round).  
  - **Elimination**: At 0 resources. Eliminated players reveal location (final act).  
  - **Win Condition**: Most resources after Round 5.  

  ---

  #### **Timeline (90 Min Total)**  
  1. **Setup (10 min)**: Distribute cards, explain rules, draw grid.  
  2. **Round 1 (10 min)**: Players hide/expand. GM updates board. *Focus: Tension between growth and stealth.*  
  3. **Rounds 2 & 3 (20 min)**:  
     - Round 2: Cheap-talk broadcast option. *Observe: Are messages trusted?*  
     - Round 3: Attack/expand decisions. *GM highlights visibility consequences.*  
  4. **Rounds 4 & 5 (20 min)**:  
     - Round 4: Costly-signal broadcast option. *Do binding promises change behavior?*  
     - Round 5: Final moves. Tally resources.  
  5. **Reset & Second Run (20 min)**:  
     - **Change one dial**: Make detection **symmetric** (if you see someone, they see you).  
     - Rerun Rounds 1-3 only (accelerated). *Focus: How does symmetry alter strategies?*  
  6. **Debrief (10 min)**: Guided discussion (see below).  

  ---

  #### **Player Handout (1 Page)**  
  **Galactic Expansion Simulation**  
  *You lead a civilization. Survive. Grow. Compete.*  

  **Goal**: Maximize resources (control systems, attack rivals).  
  **Starting**: 5 resources, one hidden home system.  

  **Actions (Pick 1/round)**:  
  - **Hide**: Stay safe, undetected.  
  - **Expand**: Colonize new systems (+1 resource/turn). **WARNING**: Reveals you to ALL. Costs 2 resources.  
  - **Broadcast**:  
    - *Round 2*: Send free message (e.g., "Peace!"). Reveals you.  
    - *Round 4*: Send binding promise (e.g., "No attacks"). Costs 2 resources. **Breaking promise = lose 5 resources.**  
  - **Attack**: Target visible rivals. Costs 3 resources. Steal half their resources. **Reveals you if hidden.**  

  **Rules**:  
  - Resources = Survival. Gain +1 per system each round.  
  - Visible rivals appear on board. **Seeing ≠ Being Seen** (unless you act).  
  - Eliminated at 0 resources.  

  **Remember**:  
  - Trust is risky. Growth is necessary. Silence is fragile.  

  ---

  ### Debrief Guide  
  **Goal**: Connect game moments to Dark Forest logic without naming it. Use Socratic questions.  

  **Key Moments & Questions**:  
  1. **Round 2 (Cheap Talk)**:  
     - *Ask*: "Who believed a ‘peace’ message? Why? Did anyone *act* on it?"  
     - *Point*: Cheap talk fails—messages are unverifiable. Trust is irrational.  

  2. **Expansion Visibility**:  
     - *Ask*: "Who expanded early? What happened? Who avoided it—and why?"  
     - *Point*: Growth requires visibility. Visibility invites attack. *"You felt the squeeze: hide and stagnate, or grow and risk death."*  

  3. **Costly Signals (Round 4)**:  
     - *Ask*: "Did binding promises work? Who broke one? Why?"  
     - *Point*: Even verifiable signals fail if betrayal is profitable. *"Costly commitments shift the math, but not the logic—attack incentives remain."*  

  4. **Attacks**:  
     - *Ask*: "Why strike first? What stopped you from waiting?"  
     - *Point*: First-strike advantage dominates. *"You killed because letting them live risked your survival."*  

  5. **Symmetric Detection Run**:  
     - *Ask*: "How did ‘seeing=being seen’ change your moves? More/Less expansion?"  
     - *Point*: Asymmetry is key to silence. *"When seeing is safe, you lurk. When it’s mutual, you rush to grow before being seen."*  

  **Final Insight**:  
  - *"Today, you recreated a galaxy where civilizations hide. Silence isn’t kindness—it’s survival. What does this imply for our universe?"*  

  ---

  ### Predictable Issues & Fixes  
  1. **The Defector**:  
     - *Issue*: Player builds alliance, then betrays.  
     - *Fix*: **Lean in**. Ask: "How did the defector’s actions prove the core problem? Why was cooperation unstable?"  

  2. **Stagnation**:  
     - *Issue*: Players hide forever, avoiding risk.  
     - *Fix*: **Add resource drain** in second run (e.g., "Your civilization consumes 1 resource/turn—expand or die").  

  3. **Time Compression**:  
     - *Issue*: Centuries-long strikes feel implausible in a 90-min game.  
     - *Fix*: **Explicitly note** during debrief: *"This compresses time. Real strikes take centuries—imagine acting today against a threat your descendants will face."*  

  4. **GM Overload**:  
     - *Issue*: Tracking 16 players is chaotic.  
     - *Fix*: **Use assistants** (e.g., 2 grad students). Pre-print resource trackers.  

  ---

  ### Limitations & Supplements  
  **What the Game Can’t Capture**:  
  1. **Timescales**: Light-speed delays mean threats are distant. *Supplement*: Discuss: *"Would you attack if the strike took 100 years? What if they advanced technologically first?"*  
  2. **Technological Asymmetry**: Players start equal. *Supplement*: Ask: *"What if rivals could be Stone Age or godlike? How does uncertainty change the logic?"*  
  3. **Non-Rational Actors**: Assumes rational self-interest. *Supplement*: *"What if some civilizations value coexistence? Does that break the equilibrium?"*  

  **Final Note**:  
  The game isolates the Dark Forest’s core: **the unbearable lightness of trust**. Use debrief to reveal how cheap talk, visibility asymmetry, and first-strike incentives conspire to silence the galaxy.
