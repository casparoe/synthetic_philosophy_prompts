answer: |-
  ## Contract Doctrine Translation of Advance Directive Bioethics Debate

  **Core Conflict Restated in Contract Vocabulary:**

  1.  **Parties:** "Party A" (Competent Self at Time T1) vs. "Party B" (Demented Self at Time T2)
  2.  **Instrument:** Advance Directive ("AD") drafted by Party A at T1.
  3.  **Alleged Agreement:** Party A attempts to bind Party B to specific future performance (e.g., refusal of life-sustaining treatment) via the AD, effective at T2.
  4.  **Dispute:** When Party B (at T2) appears to resist or countermand the AD's instructions:
      *   **Pro-Binding Argument:** Party A possessed full *capacity* at T1. The AD was a valid offer accepted by the future state (T2), constituting a binding contract. Party B is merely the *agent* or the temporal extension of Party A. Allowing Party B to *revoke* the AD based on their current impaired state constitutes a breach of the agreement made by Party A and betrays the life plan (*specific performance* of the life narrative). It's unjust enrichment for Party B to benefit from Party A's foresight while repudiating the burden.
      *   **Anti-Binding Argument:** Party B lacks the *capacity* necessary at T2 to be bound by Party A's prior offer. Party B is a fundamentally different entity – not the *same party* as Party A due to radical psychological discontinuity. Binding Party B is enforcing the *dead hand* of Party A, ruling *from the grave*. Party B is more akin to a *third-party beneficiary* who inherited Party A's situation (the "estate" of the body/life) but is a distinct principal. Forcing the contract (*specific performance*) on an incapacitated Party B is profoundly *unconscionable*.
  5.  **Key Doctrinal Questions:**
      *   **Identity:** Are Party A and Party B the *same party* across time, such that Party A's contractual acts automatically bind Party B? Or is Party B a *successor entity*?
      *   **Capacity:** Does Party B's dementia at T2 constitute a lack of *capacity* to revoke or modify the AD? Or does it mean Party B lacked the capacity *to be bound* by it in the first place?
      *   **Authority:** Was Party A ever truly Party B's *agent* with authority to bind them? Or is Party A merely a predecessor whose wishes Party B may consider, like a prior assignor?
      *   **Revocation:** Does Party B possess the *power to revoke* the AD offer made by Party A, even if Party A attempted to make it irrevocable?
      *   **Enforcement:** Would enforcing the AD against Party B's current expressed wishes be *unconscionable*? Is *specific performance* (forcing medical non-intervention) the appropriate remedy?
      *   **Assignment/Novation:** Does the onset of dementia operate like an *assignment* of rights/obligations from Party A to Party B, or a *novation* creating a new party? Does the AD bind the "estate" (the embodied life) regardless of occupant?

  ---

  ## Residue Report: Translation Fidelity Assessment

  | Bioethics Concept             | Contract Translation                      | Fidelity Assessment                                                                                                                                                               | Notes on Distortion/Gap                                                                                                                                                              |
  | :---------------------------- | :---------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Psychological Continuity (Metaphysical Identity)** | "Same Party" Doctrine                     | **Fudged Translation.** Contract law *assumes* continuity unless legal capacity changes (e.g., minor reaching majority). It lacks tools to analyze radical psychological breaks. | **Distortion:** Treats profound dementia as a simple lack of *capacity* (like infancy), ignoring the metaphysical question of whether the *party itself* persists. **Gap:** Contract law has no "successor person" doctrine analogous to successor corporations. |
  | **Binding Future Self (Moral Authority)** | Offer + Acceptance by Future State / Agency | **Partial Translation (Fudged).** Conceptually maps to an offer accepted by the future self's situation. Agency analogy is weak.                                              | **Distortion:** Makes the future self's "acceptance" passive or implied by mere existence, ignoring its potential active dissent. Agency implies ongoing authority/ratification, which is absent here. |
  | **"Betrayal" of Past Self**   | Breach of Contract / Unjust Enrichment    | **Clean Translation.** If Party A and Party B are deemed the same party, Party B's revocation is a breach. Benefit without burden = unjust enrichment.                           | Relies entirely on the "same party" assumption holding.                                                                                                                              |
  | **Suffering of Present Self** | Unconscionability / Specific Performance Remedy | **Partial Translation.** Enforcing a harsh term against an incapacitated party can be unconscionable. Specific performance can be denied if oppressive.                          | **Distortion:** Bioethics focuses on *subjective experience* of suffering. Contract unconscionability focuses on *procedural* (bargaining) and *substantive* (outcome) *fairness*, not internal states. |
  | **"Dead Hand" Control**       | Rule Against Perpetuities / Public Policy | **Clean Translation.** Concerns about controlling future actions long after the promisor is gone are core to doctrines limiting the "dead hand."                                  | Directly analogous. Public policy arguments against enforcing oppressive terms map well.                                                                                             |
  | **Radical Change in Values**  | Mutual Mistake / Frustration of Purpose?  | **Weak Translation.** Contract doctrines here require unforeseen events or shared mistakes, not internal changes to one party's preferences.                                     | **Major Gap:** Contract law generally holds parties to their bargains even if preferences change ("pacta sunt servanda"). Internal value shifts aren't a recognized defense. **Untranslatable Residue.** |
  | **"Different Person" Claim**  | Assignment / Novation / Third-Party Beneficiary | **Fudged Translation.** Forced analogy. Assignments/novations require intent/agreement. TPB status is conferred, not inherent.                                                | **Distortion:** Implies a voluntary transfer or designation process that never occurred. **Gap:** No doctrine for *involuntary* "personhood succession" due to illness.              |
  | **Capacity Threshold**        | Capacity Doctrine                         | **Clean Translation.** Assessing whether Party B at T2 has the *legal* capacity to revoke/modify the contract is directly analogous.                                             | Core contract doctrine applies cleanly. Focuses on *ability to understand*, not metaphysical identity.                                                                               |

  **Your Suspicion Confirmed (with Nuance):**

  *   **Correct:** Contract law overwhelmingly **assumes the persistence of the same legal person ("party") over time.** It's a foundational, usually unexamined premise. The core bioethics fight *is* fundamentally about challenging this assumption in the case of severe dementia. Contract doctrine provides no inherent tools to resolve the metaphysical question "Is Party B still Party A?" – it simply assumes "yes" until legal death.
  *   **What You Might Be Missing:** Contract law *does* have mechanisms for dealing with **changes in status** that affect capacity or representation (e.g., minor → adult, principal → agent), and **succession** (estates, corporations). The fight manifests *within* contract law as a debate over which of these paradigms applies:
      *   Is dementia merely a *loss of capacity* (like infancy) within the *same party*? (Pro-Binding view)
      *   Or is it a *fundamental change in legal personhood*, making Party B a *successor entity* or *new principal*? (Anti-Binding view)
      *   The "assignment/novation/third-party beneficiary" language in the anti-binding argument is an attempt to force this latter view into *existing* contract categories, but it fits poorly because those categories imply voluntary acts or designations.

  **Untranslatable Residue & Gaps:**

  1.  **The Subjective Experience of Suffering:** Contract law cares about objective fairness and intent, not the internal, phenomenological experience of the party. The bioethical argument centered on "the person sitting in front of you now *has to live it*" relies heavily on this subjective experience, which contract unconscionability only indirectly addresses through the lens of oppressive outcomes. **Genuine Gap in Contract Vocabulary.**
  2.  **Internal Value Shifts as a Defense:** The core bioethics argument that "Party B just *wants different things now*" has **no clean counterpart** in contract law. Contract doctrine generally holds that changes in preference or value are irrelevant ("you made your bed, now lie in it"). This forces the anti-binding argument into less-fitting categories like unconscionability or lack of capacity. **Genuine Gap.**
  3.  **The Metaphysics Itself:** While the *consequences* of different metaphysical views (same party vs. successor) translate into contract arguments about capacity, agency, and revocation, the *philosophical debate about numerical identity over time* is **inherently untranslatable** into purely doctrinal contract terms. Contract law provides the *legal framework* in which the consequences play out, but not the tools to resolve the underlying philosophy. **Sign that Bioethicists are Highlighting a Distinction Contract Law Ignores.**

  **Conclusion:** The analogy is powerful for framing the *structural conflict* (binding future states, capacity, dead hand control, enforcement remedies). It cleanly translates the *procedural* and *enforcement* aspects. However, the translation **fudges or fails** precisely at the heart of the bioethics debate: the metaphysical and experiential question of whether the demented patient *is still the same person* who made the directive and whether their changed internal state *in itself* justifies overriding prior instructions. Contract law's silent assumption of persistent identity masks this core tension, forcing the disagreement into imperfect doctrinal boxes like capacity, unconscionability, or strained analogies to succession. The bioethicists aren't dressing up a non-distinction; they're exposing a profound question that contract law, by its nature, is unequipped to answer but must nevertheless adjudicate.
