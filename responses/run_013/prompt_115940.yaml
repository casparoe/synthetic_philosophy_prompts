prompt: |-
  I have chaired the standing policy-review committee of a mid-sized research institute for two years now — eight members, mostly working scientists and administrators, none of us trained in philosophy — and each quarter we take up proposals to repeal or substantially rewrite an existing rule: a credentialing requirement, a data-retention rule, a safety protocol, a sign-off everyone agrees is slow. Our de facto method has been to ask who wrote the rule and whether anyone can remember why. Since retiring I have been reading philosophy, and I have come to think that method is exactly backwards: the Burkean suspicion of reform, and the image of the fence whose purpose the reformer has not bothered to learn, are the right place to start — but only if they are turned into something my colleagues can actually run, rather than a license for inertia.

  Please give me a decision procedure the committee can follow. Specify the questions to ask in order, what counts as a sufficient answer at each step, which steps one member can complete in advance as homework, where the procedure terminates in a recommendation to keep or repeal, and where it must hand the question back to the committee as a judgment about values or about who bears the risk. It has to survive the obvious abuse — 'we cannot reconstruct the purpose, therefore keep it' — so it should state explicitly when the burden of proof shifts to the rule's defenders, and it should treat differently the rule whose original purpose is documented but obsolete, the rule that is undocumented yet evidently load-bearing, and the change that can be reversed cheaply. Assume one hour of committee time per proposal, no access to the original authors, and a final decision that goes to the board.

  Then run the procedure on three cases: a legacy rule I personally regard as turf protection that the procedure nonetheless tells me to keep; a rule with a noble-sounding rationale that the procedure tells me to repeal; and one case where the procedure stalls.

  Structure the response as: 'The procedure' (about 800 words, numbered steps); 'Worked cases' (about 600 words, one per case); 'Where judgment cannot be removed' (about 250 words, naming the steps that are value judgments dressed up as method, and what the procedure cannot do at all); and 'The one-page version' (about 150 words, a card members can keep in front of them).
reasoning: |-
  Hmm, the user is the chair of a policy-review committee at a research institute, and they're grappling with how to evaluate existing rules. They've been using a backward approach of just asking who wrote the rule and why, but after reading philosophy—especially Burkean conservatism—they want a more principled method. They need a decision procedure that avoids inertia while respecting the "fence" metaphor, meaning we shouldn't remove rules without understanding their purpose. The challenge is to create something practical for non-philosophers that prevents abuse, like keeping rules just because their purpose is forgotten.

  I need to design a step-by-step procedure. Key requirements: it must be doable in one hour per proposal, with no access to original authors, and end with a recommendation for the board. It should handle different scenarios—documented but obsolete rules, undocumented but functional ones, and reversible changes. Crucially, I have to prevent the "we can't reconstruct the purpose, so keep it" fallacy by shifting burdens of proof. Steps should include homework to save time, and explicitly state when judgment is needed.

  Breaking down the procedure: Start with preparation to save committee time. In the meeting, first reconstruct the rule's purpose—if undocumented, shift burden to defenders to prove it's load-bearing. Then assess obsolescence: if the problem is gone, burden shifts to defenders to justify keeping it. Next, evaluate harm and cost; high harm with no purpose is a candidate for repeal. For reversible changes, that lowers the bar for repeal. Finally, make a recommendation or flag for judgment. I need numbered steps for clarity, covering questions, sufficient answers, homework, and termination points.

  For the worked cases, I have to create three scenarios based on the user's request: one where the rule is bad but the procedure keeps it (like turf protection), one where it sounds noble but gets repealed, and one where it stalls. This will demonstrate the procedure in action. Then, I'll highlight where judgment can't be removed—steps involving value calls, like evaluating harm or risk—and what the procedure can't do, like resolving deep conflicts.

  Finally, a one-page summary for quick reference. Aim for about 150 words: key steps, burdens, and outcomes. This keeps it practical.

  Now, thinking deeper: The user is retired and reading philosophy, so they might value intellectual rigor but need applicability. Unspoken needs could include fostering committee buy-in, ensuring decisions are defensible to the board, and avoiding wasted time. By making the procedure structured, I'm helping them lead efficiently and reduce bias. The stalling case addresses uncertainty, showing it's okay not to decide hastily. Overall, this should build confidence in reform without recklessness.

  Word counts: Procedure ~800 words, worked cases ~600, judgment section ~250, summary ~150. I'll aim for that balance. Let me outline the procedure first, then cases, and so on.
answer: |-
  ## The Procedure (Approx. 800 words)

  This procedure operationalizes Burkean prudence ("don't tear down the fence until you know why it was built") while actively guarding against inertia and demanding justification for keeping potentially obsolete or harmful rules. It shifts the burden of proof strategically and provides clear off-ramps for decisions or judgment calls. Designed for a 60-minute committee meeting per proposal, with preparatory homework.

  1.  **Homework: Initial Scoping & Documentation (Individual, Pre-Meeting):**
      *   **Question:** What is the rule's *exact, current text*? Is there *any documented rationale* (original proposal, meeting minutes, incident report, external regulation citation) for its creation or major amendments? What *problem* was it meant to solve? What *category* does it fall under (Safety, Compliance, Efficiency, Resource Allocation, Access Control, Quality Control, Governance)? Who are the primary *enforcers* and *affected parties*?
      *   **Sufficient Answer:** The rule text is retrieved. A reasonable effort identifies *any* relevant documentation (even if sparse). A plausible hypothesis for the problem addressed and the category is formed based on rule content and context. Key stakeholders (enforcers/users) are identified.
      *   **Outcome:** A concise (≤1 page) homework memo compiled by the presenting member, distributed 48 hours before the meeting. Includes rule text, found docs (or "none found"), hypothesized problem/category, key stakeholders.

  2.  **Step 1: Purpose Reconstruction & Burden Assignment (Meeting, 10 mins):**
      *   **Question:** Based on the homework memo and committee knowledge: Can we reconstruct the rule's *original, primary purpose* with reasonable confidence? Is this purpose *documented*?
      *   **Sufficient Answer:**
          *   **Documented & Clear Purpose:** Found in written record. Burden of Proof *immediately shifts* to **Rule Defenders** to justify keeping it *if* Step 2 suggests obsolescence.
          *   **Plausible Reconstructed Purpose:** No documentation, but committee consensus on a logical, historically consistent purpose (e.g., "Likely created after X incident to prevent Y"). Burden *initially* rests on **Rule Challengers** to show harm/obsolescence *unless* Step 3 reveals significant current harm.
          *   **Purpose Unknown/Unclear:** Genuinely no consensus or plausible hypothesis emerges. Burden *immediately shifts* to **Rule Defenders** to demonstrate the rule is *currently load-bearing* (essential for core function, safety, or compliance) in Step 3. "We don't know, so keep it" is *explicitly rejected* as sufficient here.
      *   **Termination:** None. Proceeds to Step 2.

  3.  **Step 2: Obsolescence Check (Meeting, 10 mins):**
      *   **Question:** Is the problem the rule was designed to solve (reconstructed or documented) *still relevant*? Have circumstances fundamentally changed (technology, regulations, practices, risks) making the rule's *specific approach* unnecessary or ineffective? Is the rule *functionally redundant* with other existing rules/systems?
      *   **Sufficient Answer:**
          *   **Problem Clearly Obsolete:** The core problem demonstrably no longer exists (e.g., tech it regulated is obsolete). Burden *remains or shifts firmly* to **Rule Defenders** (see Step 1). Strong indicator for repeal.
          *   **Problem Persists, Rule Effective:** Rule still addresses a live problem effectively. Burden *shifts* to **Rule Challengers** to demonstrate significant harm/cost in Step 3. Indicator for keeping.
          *   **Problem Persists, Rule Ineffective/Redundant:** Rule doesn't solve the problem well or is duplicated elsewhere. Burden *remains or shifts* to **Rule Challengers** to show harm/cost outweighs any residual benefit. Indicator for repeal/modification.
          *   **Uncertain Obsolescence:** Cannot determine if problem is gone or rule is effective. Proceed to Step 3; burden depends on Step 1 outcome.
      *   **Termination:** None. Proceeds to Step 3.

  4.  **Step 3: Current Burden & Harm Assessment (Meeting, 20 mins):**
      *   **Question:** What are the *tangible costs and harms* imposed by the rule *now*? (e.g., time delays, resource drain, frustration, reduced innovation, opportunity cost, inequity). What are the *tangible benefits* or *avoided harms* provided by the rule *now*? (e.g., safety ensured, compliance met, quality maintained, essential process enabled). What is the *reversibility cost* if we repeal and later need to reinstate?
      *   **Sufficient Answer:** Concrete examples from stakeholders (enforcers/users) are most persuasive. Quantification (time saved/lost, money saved/spent) is ideal but not mandatory. Anecdotal evidence of significant, recurring friction is sufficient to establish harm. Evidence of preventing a recent incident or enabling a critical function is sufficient to establish benefit. Low reversibility (simple reinstatement) lowers the barrier to repeal.
      *   **Burden Application:**
          *   If burden is on **Challengers**: They must demonstrate *significant, recurring harm* that outweighs any documented/reconstructed purpose or current benefit.
          *   If burden is on **Defenders**: They must demonstrate *significant, current benefit or avoided harm* (beyond inertia) or prove it's *essential for core function/compliance/safety*, especially if purpose was unknown or obsolete. "It might be important someday" is insufficient without specific, plausible risk scenarios.
      *   **Termination:** Clear imbalance (High Harm/Low Benefit & Defender burden unmet -> **Recommend Repeal**; Clear Benefit/Low Harm & Challenger burden unmet -> **Recommend Keep**). Else, proceed to Step 4.

  5.  **Step 4: Risk & Uncertainty Assessment (Meeting, 15 mins):**
      *   **Question:** If repealed, what are the *foreseeable negative consequences*? How *likely* and *severe* are they? Who *bears the risk* (institution, specific group, individuals)? Can risks be *mitigated* upon repeal? If kept, what are the *continued opportunity costs/risks* (e.g., stifling better methods, non-compliance with newer standards)?
      *   **Sufficient Answer:** Identification of specific, plausible risks (e.g., "Increased data loss risk," "Potential audit finding," "Safety incident possibility"). Qualitative assessment of likelihood/severity. Clear identification of risk bearers. Mitigation proposals (if any). Recognition of counter-risks of keeping.
      *   **Termination:** If risks of repeal are deemed *high likelihood/high severity* and primarily borne by vulnerable parties/the institution's core mission, AND Defender burden was met -> **Recommend Keep**. If risks are *low/unclear/mitigatable* and Challenger burden was met -> **Recommend Repeal**. If significant uncertainty or disagreement persists about risk severity, likelihood, or who *should* bear it -> **Hand Back to Committee for Value Judgment** (e.g., "Is the potential safety risk worth the efficiency gain?").

  6.  **Step 5: Final Recommendation (Meeting, 5 mins):**
      *   **Question:** Based on Steps 1-4, does the evidence meet the burden of proof placed on Challengers or Defenders? Is there a clear path?
      *   **Termination:**
          *   Burden Met (either way) & Low Uncertainty -> **Recommend Keep or Repeal** to the Board.
          *   Burden Not Met (Defender fails under Step 1/2 burden; Challenger fails under Step 3 burden) -> **Recommend Repeal or Keep** accordingly (failure to meet burden implies recommendation *against* the burdened party).
          *   Significant Uncertainty/Disagreement on Values/Risk Allocation (flagged in Step 4) -> **Hand Back to Committee**. Committee must explicitly articulate the value conflict (e.g., "We disagree on whether potential minor safety risk X justifies ongoing cost Y") and make a recommendation based on judgment OR recommend further study (using remaining time).

  ---

  ## Worked Cases (Approx. 600 words)

  1.  **The Turf Protection Rule (Kept):** *Rule:* "All external collaborative agreements exceeding $10k must receive pre-approval signature from both the relevant Department Head *and* the Director of Partnerships."
      *   **HW:** No original docs. Hypothesis: Ensure oversight of large partnerships (Governance/Resource). Stakeholders: PIs (affected), Dept Heads/Dir Partnerships (enforcers).
      *   **Step 1:** Plausible Reconstructed Purpose: Prevent rogue deals/ensure alignment. Burden on **Challengers** (Step 3).
      *   **Step 2:** Problem (misaligned/risky partnerships) persists. Rule effective? Mixed, but not clearly obsolete/redundant.
      *   **Step 3:** **Challengers:** Harm = Delays (~2 weeks), PI frustration. Benefit = Defenders cite one avoided bad deal 5 years ago. **Burden NOT Met:** Harm, while real, is operational friction, not severe institutional harm. Low reversibility (reinstating oversight hard). Benefit, while anecdotal and old, aligns with plausible purpose.
      *   **Step 4:** Risk of repeal: Potential for misaligned/risky agreements. Risk bearers: Institution reputation/finances. Severity potentially high. Mitigation unclear.
      *   **Step 5:** Challengers failed Step 3 burden. Significant potential risk. **Recommend KEEP.** *Why kept?* Defenders didn't *need* to prove strong current benefit because Challengers failed to show harm outweighing the plausible purpose *and* repeal risk was non-trivial.

  2.  **The Noble-Sounding Rule (Repealed):** *Rule:* "All research data, regardless of project size or funding source, must be archived in the institutional repository for a minimum of 15 years, with metadata conforming to Standard Z."
      *   **HW:** Documented! Original proposal cites "Ensuring scientific integrity, reproducibility, and legacy for future generations." (Compliance/Quality). Stakeholders: All Researchers (affected), Library (enforcers).
      *   **Step 1:** Documented Purpose. Burden *shifts* to **Defenders** *if* Step 2 shows obsolescence.
      *   **Step 2:** Problem (data loss, irreproducibility) persists. **BUT** Rule Ineffective/Redundant: Standard Z is obsolete (new Standard Y is mandatory for funded projects). Institutional repository is cumbersome; researchers use funder-mandated/field-specific repos. Rule adds little value, duplicates modern requirements. Burden *remains* on **Defenders**.
      *   **Step 3:** **Challengers:** Harm = Significant researcher time (~5 days/project/year), repository storage costs ($50k/yr), frustration. **Defenders:** Benefit = "Integrity/legacy" (vague). Cite *no* instances where *this* rule prevented loss where other mandates didn't apply. High reversibility (can reinstate if needed).
      *   **Step 4:** Risk of repeal: Non-funded/small project data *might* be less findable long-term. Risk bearers: Future historians? Low likelihood. Mitigation: Strong guidance encouraging (not mandating) use of modern repos.
      *   **Step 5:** Defenders failed Step 3 burden (no *current, specific* benefit demonstrably caused by *this* rule). Significant current harm. Low risk. **Recommend REPEAL.** *Why repealed?* Noble purpose documented, but rule is obsolete and actively harmful. Defenders failed to prove it uniquely provides necessary benefit.

  3.  **The Stalling Case:** *Rule:* "Principal Investigators must personally conduct annual safety inspections for all labs under their supervision using Checklist Alpha and file reports with EHS."
      *   **HW:** No original docs. Hypothesis: Ensure lab safety (Safety). Stakeholders: PIs (affected/enforcers?), EHS (enforcers).
      *   **Step 1:** Plausible Reconstructed Purpose: Ensure PI accountability for safety. Burden on **Challengers** (Step 3).
      *   **Step 2:** Problem (lab safety) persists. Rule effective? Mixed. EHS has newer audits; PIs complain Checklist Alpha is outdated. Uncertain obsolescence/redundancy.
      *   **Step 3:** **Challengers:** Harm = PI time burden (~1 day/PI), duplication with EHS audits, frustration. **Defenders:** Benefit = Reinforces PI accountability, catches things EHS might miss? Anecdotal. Burden on Challengers not *clearly* met (harm vs. safety uncertainty).
      *   **Step 4:** **Stalls Here.** Significant disagreement on Risk/Likelihood/Severity/Values:
          *   Some: Risk of repeal high (labs less safe), severity high (injuries), risk borne by students/staff. Accountability paramount.
          *   Others: Risk low (EHS audits suffice), severity of current harm (PI time/resentment) high, opportunity cost (research time). Efficiency vs. Safety.
          *   Who *should* bear the risk? PIs (burden)? EHS (expertise)? Institution?
      *   **Step 5:** Hand Back to Committee for **Value Judgment**. Committee must debate: Is the *specific, additional burden* on PIs justified by a *specific, unique safety benefit* over EHS audits? What level of safety assurance is required, and who is responsible? They might decide Keep, Repeal, or (most likely) Recommend Modification (update checklist, clarify roles).

  ---

  ## Where Judgment Cannot Be Removed (Approx. 250 words)

  The procedure structures inquiry and shifts burdens, but core judgment calls are unavoidable:

  1.  **Step 1 (Purpose Reconstruction):** Deciding if a reconstructed purpose is "plausible" involves interpreting history and intent without documentation. This is inherently judgmental, prone to bias (favoring status quo or change).
  2.  **Step 3 (Harm/Benefit Assessment):** Quantifying "significant" harm or benefit is value-laden. Is 5 days of PI time/year "significant" harm? Is preventing one potential (unquantified) safety incident a "significant" benefit? Weighing intangible costs (frustration, stifled innovation) against intangible benefits (accountability, perceived safety) is fundamentally subjective. The procedure forces articulation but cannot resolve the underlying value conflict.
  3.  **Step 4 (Risk Assessment):** Evaluating the *likelihood* and *severity* of risks, especially low-probability/high-consequence events, is highly speculative. Deciding *who should bear the risk* involves deep value judgments about institutional priorities, responsibility, and equity. The procedure identifies the conflict ("Is safety worth X efficiency?") but cannot algorithmically solve it.
  4.  **Step 5 (Final Judgment Hand-Back):** When the procedure stalls, the committee *must* make a value-laden decision based on competing priorities (Safety vs. Efficiency, Accountability vs. Autonomy, Certainty vs. Innovation). The procedure flags this necessity but provides no formula.

  **What the Procedure Cannot Do:**
  *   Eliminate the need for committee members to exercise reasoned judgment on values and risk tolerance.
  *   Resolve fundamental disagreements about the institution's core priorities or ethical stance.
  *   Guarantee a "correct" answer in complex, uncertain situations.
  *   Replace the need for ethical reasoning when rules impact fairness or equity directly. It focuses on functional assessment; explicit ethical review might need a parallel track.
  *   Generate perfect data on past purpose or future risk. It operates under uncertainty.

  ---

  ## The One-Page Version (Decision Card)

  **Policy Review Committee: Rule Assessment Steps (60 Min)**

  1.  **HW Prep (Before Mtg):** Get rule text! Find docs? Guess purpose/problem? Who enforces/uses? (Memo ≤1 pg)
  2.  **Step 1: Purpose? (10 min)**
      *   Doc'd Purpose? -> **Burden: DEFENDERS** (if Step 2 shows obsolete)
      *   Plausible Guess? -> **Burden: CHALLENGERS** (unless Step 3 shows big harm)
      *   Unknown? -> **Burden: DEFENDERS** (Prove it's vital NOW). *No "Keep 'cause unknown"!*
  3.  **Step 2: Obsolete? (10 min)**
      *   Problem Gone? -> **KEEP Burden on DEFENDERS**
      *   Problem Here, Rule Works? -> **REPEAL Burden on CHALLENGERS**
      *   Problem Here, Rule Bad/Duped? -> **REPEAL Burden on CHALLENGERS** (Show Harm > Benefit)
      *   Unsure? -> Move on, burden unchanged.
  4.  **Step 3: Harm vs. Benefit NOW? (20 min)**
      *   *Apply Burden:* Who must prove what?
      *   **Challengers' Burden:** Prove *Significant Harm > Purpose/Benefit*.
      *   **Defenders' Burden:** Prove *Significant Benefit/Avoided Harm* (Not just "might be important").
      *   **Reversible?** (Easy to undo?) -> Helps Challengers.
      *   Clear win? -> **Recommend KEEP or REPEAL**. Else, move on.
  5.  **Step 4: Risks? (15 min)**
      *   Repeal Risks? (Likely? Bad? Who hurt?) Mitigation?
      *   Keep Risks? (Costs, missed chances?)
      *   Clear High Risk/Keep? -> **Recommend KEEP**
      *   Clear Low Risk/Repeal? -> **Recommend REPEAL**
      *   **Big Fight over Risk/Values?** -> **COMMITTEE JUDGMENT NEEDED**
  6.  **Step 5: Decide (5 min)**
      *   Burden Met? Low Risk? -> **Recommend KEEP or REPEAL**
      *   Burden *Not* Met? -> Recommend *against* burdened side.
      *   **Stuck on Values/Risk?** -> **COMMITTEE MUST JUDGE or STUDY MORE**

  **Key: Burden shifts force justification. "Unknown Purpose" doesn't auto-keep. Prove Benefit or Harm.**
