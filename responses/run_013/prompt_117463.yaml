prompt: |-
  I'm in a seminar on early modern political thought this term and my roommate has gotten really into AI-risk stuff at the same time, which turns out to be a horrible combination, because now I can't stop thinking about what Hobbes would have made of it. My roommate's pet idea is something he calls a singleton, and he says it comes from a philosopher named Nick Bostrom, though I've never checked that. The gist is that sooner or later some world order comes along in which there's basically one decision-making agency at the top and no rival left that could seriously threaten it or push back, so it can hold that position indefinitely. He stresses that it doesn't have to be a world government or one evil emperor — it could be a single dominant AI, or a global set of norms that enforce themselves, or a democracy that just happens to have no competitors left, or anything else that can finally solve the coordination problems nobody can solve now. He also says a singleton could be the good kind, one that ties its own hands and commits to respecting certain rules, precisely because there'd be no one left who could make it pay for breaking them. And he thinks this is the thing to worry about, since if the singleton goes bad there's no one left to undo it.

  What I want is a paper-ready answer to a single question: what would Hobbes have thought about the prospect of a singleton? Not the cheap version where you say he wrote Leviathan so obviously he'd love a world sovereign. I want you to actually work it through and commit to a view, the way someone who knows the texts well would.

  There are a few things I keep going back and forth on and I'd like you to adress them head-on. (a) As I recall, he thinks there are two very different routes to sovereignty — one where people agree among themselves to hand power to someone, and one where power is simply acquired, by conquest or force or whatever — and he treats the second as a real commonwealth too, not just a fancy name for the state of nature. If that's right, does the fact that a singleton might just... happen, with nobody ever consenting to it, count against it for him at all? (b) He makes a lot of the sovereign being an artificial person that the subjects authorize, and I can't tell whether that's doing real work or is just a metaphor he likes — could a superintelligent machine be the sovereign in that picture, or does the whole thing collapse once the sovereign isn't a person at all? (c) He insists sovereign power has to be undivided and absolute, but he also ties obedience to protection, and I think he says somewhere that subjects are obliged only as long as the sovereign is able to protect them. So what happens to his theory if the singleton is perfect at protecting us and also makes any resistance literally impossible — is that a commonwealth, or just the state of nature with one winner left standing? And relatedly, if it promises to restrain itself, does he have any way of making sense of that, or does his insistence that a sovereign can't be bound by its own rules kill the idea? Give me the substantive prediction — what you'd argue he'd say and why — and don't bother with chapter numbers or quotes, I can look those up myself, I just want the reasoning.
