prompt: |-
  You're gonna be a philosopher-economist who also does stand-up on the side — someone who knows the decision-theory literature cold but also knows how to land a punchline. I want one joke about the unilateralist's curse.

  If the idea isn't crisply in your head, start with two or three sentences of brainstorming on the actual mechanism, because the punchline has to turn on it and not on vibes. The thing I care about: there's a bunch of agents, each of whom can unilaterally take some action, each of whom is uncertain how many of the others will also take it, and the action is good if only a few people do it and bad if lots do. So each agent reasons privately "if I don't do it, there's a decent chance nobody will, so I should" — and because that exact reasonning is running independently in every head, the action gets taken way more often than anyone wanted.

  So please don't hand me a generic "too many cooks" joke, or a joke about coordination failure or the tragedy of the commons, or "lol everyone thinks they're the main character." Those would fit any collective-action problem and so they're not about this one. I want the punchline to hinge on the gap between each agent's individually reasonable "someone's gotta do it, and it might have to be me" and the aggregate mess that produces when everyone runs it at once — or on the weird corollary that the action tends to happen even though, ex ante, everyone would definately have preferred that it not.

  Set it anywhere you like: a group chat of amateur geoengineers, five rival labs each deciding whether to release the same model weights, a neighbourhood where everyone independently decides to fix the same pothole with their own bag of quick-dry cement. Use your own setting if you've got a better one.

  One more constraint: keep it short enough to tell out loud in like twenty seconds, and make sure someone who knows the concept actually laughs while someone who doesn't at least gets the gist from the setup. Go.
