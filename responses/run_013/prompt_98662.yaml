prompt: |-
  I'm on the board of a small meditation group — we call ourselves a Buddhist center but honestly half of us are just stressed-out parents who like the sitting. We're a registered nonprofit and our best program teaches meditation and basic coping skills to people in recovery from addiction, for free. It genuinely works and it's the thing I'm proudest of. Problem is we're broke, we've been running it on fumes and volunteer hours for two years.

  A local casino company just offered us $40k a year for three years to keep it going. They want thier logo on our flyers and a non-voting seat on our board. Two of our members say take it, full stop: more people get helped, money is fungible, and refusing is basically letting people relapse out of pride. Our teacher (a Theravada guy, ordanied, the real deal) says absolutely not — the money comes out of other people's addiction, and taking it makes us part of the harm, karma and all. I see both sides and I keep flip-flopping, which is why we haven't voted in three weeks.

  Please write the memo I'll hand out at Thursday's meeting so we can finally decide. I want a clear recommendation — take it, don't, or take it with conditions — with the reasoning spelled out, and I want you to be genuinely fair to the strongest point on whichever side you come down against. This is going to people who will argue, so it needs to hold up.

  A few things I want you to actually wrestle with instead of waving at:

  - Our founding charter says we don't accept money that comes at the cost of another's suffering. Is that the whole answer, or does it need interpreting? Because part of me thinks the harm is happening regardless of whether we take the check — the gambling is going on tonight either way. So what would it even mean for the money to be "ours"?

  - Our teacher says Buddhism is about the state of mind you act from, not the results — that what counts is the intention, and ours would be good. But another member insists the Buddha cared a lot about outcomes and that "just have good intentions" is a cop-out. I genuinely can't tell which one of them is describing our own tradition correctly, and I'd like you to sort that out, because it seems like it decides the whole thing.

  - The flip side of the teacher's view: if refusing is about keeping our own hands clean, is that even a Buddhist idea, or is it something we imported from somewhere else? Is refusing really the compassionate choice, or is it us protecting our own conscience while the people we could have helped go without? That one bothers me.

  - The teacher also mentioned we could "dedicate the merit" of the donation, whatever that means. Does that actually change anything about whether we should take it, or is it a fig leaf?

  And whatever you recommend, tell us a time frame and who has to do what — do we need to answer the casino by a certain date, do we attach conditions, who drafts the reply.

  At the very end, on its own line, put the bottom line in this exact form so I can read it out at the vote: Verdict: ACCEPT, Verdict: DECLINE, or Verdict: ACCEPT WITH CONDITIONS — just those words.
reasoning: |-
  Okay, the user is on the board of a small meditation group that runs a valuable program for people recovering from addiction. They're facing a tough decision: accept $120,000 over three years from a casino in exchange for logo placement and a non-voting board seat, or decline due to ethical concerns. 

  First, I need to unpack the core tension. The program is clearly impactful—helping vulnerable people with free services—but funding it with gambling money creates a moral dilemma. Their charter explicitly rejects money from suffering, which seems straightforward until you consider whether refusing actually reduces harm. The casino will operate regardless; their money is already tainted. Does taking it make them complicit, or is it redirecting harmful wealth toward good?

  The Buddhist philosophical debate here is deep. The Theravada teacher emphasizes intention (cetana), arguing that pure motives purify the donation. But the other member counters that Buddhism also cares about outcomes (vipāka). Both views have merit. Early texts like the Cūḷakammavibhaṅga Sutta show karma as intention-driven, yet the Noble Eightfold Path includes Right Action—which implies consequences matter. This isn't binary; it's about balancing wisdom (seeing the casino's harm) and compassion (aiding those in recovery).

  Then there's the "clean hands" critique. Is refusal just spiritual vanity? The user's unease here is valid. Mahayana Buddhism might frame this as "skillful means" (upaya)—using imperfect tools for good. But Theravada ethics lean stricter. The teacher's "dedicate merit" suggestion feels like a loophole; it may ease guilt but doesn't absolve the source of funds. 

  Financially, the group is desperate. Turning down $40k/year could collapse the program. Yet attachment to outcomes ("help more people at any cost") risks compromising integrity. The middle path? Imposing conditions: rejecting the board seat (power imbalance), limiting branding (no direct endorsement), and sunsetting the deal post-recovery. But would the casino agree? And does this truly mitigate harm, or just sanitize complicity?

  The user needs a decisive memo that respects all angles. They’re paralyzed because both sides are right in parts. My recommendation must prioritize their charter’s spirit: suffering-linked money is non-negotiable. Better to shrink the program ethically than expand it on poisoned funds. The verdict leans decline, but I’ll stress this isn’t pride—it’s fidelity to their mission. 

  Final note: the user’s heart is with the recovery program. If they decline, I should suggest alternative funding avenues (grants, community fundraising) to honor that commitment. The memo’s tone must be firm yet kind—no shaming, just clarity.
answer: |-
  **MEMORANDUM**  
  **TO:** Board Members of [Center Name]  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Meeting Date]  
  **SUBJECT:** Recommendation Regarding Casino Funding Proposal  

  ---

  ### **Context & Core Tension**  
  We face a profound ethical decision: accept $120,000 over three years from a casino to sustain our addiction-recovery program, or decline due to concerns that gambling revenue perpetuates the suffering our program seeks to heal. Our teacher cites Buddhist ethics; others argue refusing sacrifices tangible good for abstract purity. Both sides demand rigorous examination. Below, I address key questions raised, weigh arguments, and provide a recommendation.  

  ---

  ### **Key Questions Wrestled With**  
  1. **"Does our charter (‘no money from suffering’) settle this?"**  
     - *Yes*: The charter’s intent is clear—preventing our work from being funded by exploitation. Gambling preys on vulnerability (addiction, poverty), directly contradicting our mission.  
     - *But*: Harm occurs whether we take the money or not. However, **acceptance makes us active participants**. We legitimize the casino’s reputation ("See? We support recovery!") while using profits derived from others’ despair. The money becomes "ours" through endorsement.  

  2. **"Is intention (cetana) enough, or do outcomes matter?"**  
     - *Teacher’s view (intention-focused)*: The Buddha taught that karma is rooted in volition (AN 6.63). Our aim to aid recovery *could* purify the donation’s source.  
     - *Counter-view (results-focused)*: The Eightfold Path includes **Right Action**—concerned with consequences. The Sigālaka Sutta (DN 31) condemns gambling as a "cause of loss." Using tainted funds risks "wrong livelihood" for our center, even with good intent.  
     - **Synthesis**: Buddhism balances both. Pure intention alone cannot sanctify harmful means. As Thich Nhat Hanh wrote: "Intention is not enough. Your acts must avoid causing suffering."  

  3. **"Is refusal just ‘clean hands’ vanity?"**  
     - Refusing *could* be self-righteous if motivated by attachment to purity. But our teacher’s stance reflects **non-harming (ahimsa)**, a core Buddhist tenet. Accepting funds from addiction to treat addiction creates a karmic contradiction—a "wrong condition" for our work.  
     - **Compassion must be wise**: True compassion requires seeing interconnected harm. Enabling the casino’s "social washing" may indirectly increase gambling accessibility, deepening societal suffering.  

  4. **"Does ‘dedicating merit’ change anything?"**  
     - Dedicating merit (transferring positive karma) is a traditional practice. However, it **does not negate the source of funds**. Merit dedication may ease our conscience but doesn’t address the fundamental conflict with our charter or the casino’s ongoing harm.  

  ---

  ### **Strongest Arguments For Each Side**  
  | **ACCEPT** | **DECLINE** |  
  |------------|-------------|  
  | **"Fungibility"**: $40k/year saves lives now. People in recovery will suffer without this program. Money is neutral—our *use* of it matters most. | **"Moral Coherence"**: We cannot fight addiction while funding ourselves through its exploitation. This violates our charter and the First Precept (non-harming). |  
  | **"Pragmatism"**: Ideal funding sources are scarce. Refusing helps no one; taking the money serves the greater good. | **"Systemic Harm"**: Casinos profit from addiction. Our endorsement aids their PR, potentially increasing gambling participation. |  

  ---

  ### **Recommendation: DECLINE the Funding**  
  **Reasoning**: While saving the program is urgent, this funding source fundamentally compromises our integrity and mission. Our charter explicitly forbids revenue from suffering, and gambling’s harm is well-documented (financial ruin, suicide, family trauma). **Buddhism emphasizes both intention *and* right action**: Accepting this money links our recovery program to an industry that creates the very suffering we aim to heal. The "greater good" argument risks utilitarianism—a slippery slope where ends justify means.  

  **However, the "ACCEPT" stance deserves respect**: Its advocates prioritize immediate compassion for those in recovery. Their position stems from love, not negligence. We *must* find alternative funding to honor their commitment to helping others.  

  ---

  ### **Action Plan & Timeline**  
  1. **By [Date, e.g., 5 days post-meeting]**: Draft a response declining the offer, signed by the Board Chair.  
     - **Key phrasing**: "While we admire your interest in community wellness, our ethical guidelines prevent accepting funds derived from activities incompatible with our mission to reduce suffering."  
  2. **Within 1 week**: Launch an emergency task force (chaired by "ACCEPT" advocates) to pursue ethical funding:  
     - Grants (SAMHSA, local health foundations)  
     - Community crowdfunding  
     - Partnerships with healthcare systems  
  3. **Within 2 weeks**: Reduce program costs temporarily (e.g., virtual sessions, trained volunteer facilitators) while fundraising.  

  ---

  ### **Bottom Line**  
  We cannot build a house of healing with bricks of suffering. Our recovery program’s power comes from its moral clarity; preserving that is non-negotiable. Decline the funds, then channel this urgency into finding ethical solutions.  

  **Verdict: DECLINE**
