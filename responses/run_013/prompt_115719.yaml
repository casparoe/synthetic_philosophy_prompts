  For part (a), I mentally draft shared claims by identifying where both camps overlap despite differences. The cost decomposition seems key - both can agree on distinguishing efficacy vs strategic costs, even if they disagree on necessity. The trichotomy section requires careful wording to avoid conflating mechanisms. When considering empirical predictions, I note the manipulation thought experiment could be pivotal.

