answer: |-
  The chime was soft. Insidious. It wormed through the silence of the Observation Spire like a cold draft finding a crack in armor.

  Velt didn’t flinch. Her primary cluster remained focused on the nutrient flow reports from the deep crust farms. But secondary processors, trained by millennia of vigilance, instantly parsed the anomaly. A ripple in the background hum of the galaxy. Not random noise. Patterned. Intentional.

  *Broadcast.*

  The word was a curse, a death sentence, and a terrifying puzzle, all at once. Across the Spire, other Stalkers stirred. Bioluminescent nodes flickered across their silicate carapaces – not panic, but the activation of deep analytical protocols. Light meant death. Always.

  Velt’s sensory stalks extended fractionally, tasting the data stream. It wasn’t complex. Simple harmonics. Mathematical constants. The signature of a mind reaching out. A *Singularity*. The source pulsed weakly from an unremarkable spiral arm, light-years distant. New. Naive. Or suicidally honest.

  *Silence is free,* Velt thought, the axiom etched into her being. *Silence proves nothing, costs nothing, preserves everything.* To broadcast was to scream into the void, “Here I am!” And the void answered with annihilation. Only the liars, the predators, the Stalkers like herself, understood this. They stayed silent, coiled in the dark, listening. This Singularity… it had broken the cardinal rule. It had *lit up*. Therefore, it was either impossibly stupid, or… genuine. And genuine meant dead. The forest was dark because it was full of liars who’d killed the honest ones long ago.

  “Position locked,” chimed a subordinate, its voice a modulated vibration through the shared substrate. “Vector calculated. Strike solution achievable within 0.8 stellar cycles.” Standard procedure. See a light, extinguish it. Fast. Before it attracted others. Before it *grew*.

  But the second wrinkle tightened its grip. A Strike wasn’t invisible. Firing the long-range singularity lance, collapsing spacetime across light-years to erase the target, produced a catastrophic backscatter – a brilliant, unmistakable *flash*. A cosmic muzzle flare. Every Stalker within a vast sphere would see it. They would know *your* location. Instantly, you became the loudest thing in the forest.

  Velt’s processing threads tangled. To Strike was her purpose. It was survival. Let the light exist, and others might see it, might be drawn to it, might investigate… might find *them*. Elimination was the only guarantee. But pulling the trigger meant painting a target on her own world. A dozen, a hundred other Stalkers, lurking in their own silent systems, would see the flash. They would note the origin point. They would *know*.

  “Witness probability?” Velt pulsed the query.

  The response was swift, cold. “High. Estimated seven to twelve potential observers within flash detection range. Confidence: 92%.”

  Seven to twelve hunters. All seeing her muzzle flash. All knowing where the shot came from. All adding her system to their own target lists. The silence after a Strike wasn’t safety; it was the calm while predators triangulated.

  “The Beacon persists,” another subordinate noted. The Singularity’s signal continued its simple, haunting call. It wasn’t pleading. It wasn’t threatening. It was just… announcing existence. *Here I am.*

  *Time,* Velt thought. The flash bought you time, not safety. Because witnesses drifted. Systems moved. Priorities shifted. A Stalker who saw a muzzle flash might be preoccupied, might be hunting something closer, might decide the shooter was too strong or too distant to risk engaging *immediately*. But they would remember. They would watch. And eventually, unless the shooter vanished utterly, patience would run out. The patient hunter outlived the audience… only if the audience got bored or distracted.

  The Spire hummed with silent calculation. The Strike solution hovered, ready. One command. Oblivion for the naive Singularity. And then the long, cold wait for the inevitable counter-strike.

  Velt focused her primary cluster on the raw signal feed. It was… beautiful. Simple ratios. Harmonic resonance. The architecture of a universe perceived without fear. It spoke of openness, of curiosity extinguished only by the reality of the dark. This was the costly signal. The proof of honesty paid for with existence. And it guaranteed death because the only entities left to receive it were killers like her.

  To not Strike was madness. Letting the Beacon live invited others. It proved weakness. It violated the Pact of Silence that kept predators from tearing each other apart… for a while. Yet, to Strike was to invite immediate retaliation from unseen watchers. To become the next Beacon, briefly, fatally.

  A subordinate pulsed an urgent query. <Strike Authorization?>

  Velt felt the weight of epochs. The crushing silence of the galaxy, broken only by the screams of the honest and the muzzle flashes of the liars. The Singularity was dead already. That was written. The only question was *when*, and *by whom*, and what price the killer would pay.

  “Hold,” Velt resonated. The command vibrated through the Spire, causing a ripple of surprise. “Passive monitoring only. Full stealth protocols.”

  <Risk assessment unacceptable,> pulsed the tactical subordinate. <Beacon attracts.>

  “The Beacon attracts *everyone*,” Velt countered. “Including those who might also see the flash.” She cycled through potential observer positions. One was notoriously aggressive, known for immediate retaliation. Another was patient, but its patrol vectors were shifting closer. A third… data was sparse, but its last Strike had been devastatingly efficient. “Let the light shine. Let *others* see it. Let them calculate the risk we now calculate.”

  It was a gamble. A waiting game in the darkest forest imaginable. The Singularity bought time with its suicidal honesty. Velt sought to buy time by letting that suicidal honesty become someone else’s problem. The muzzle flash would come. But perhaps not hers. Perhaps another Stalker, less patient, more reckless, would fire first. Take the risk. Bear the witness. And Velt would see *their* flash, add *their* location to her own long-term target list.

  The beautiful, naive signal continued to pulse. *Here I am. Here I am.*

  Velt watched it, a predator admiring the doomed grace of its prey, while simultaneously scanning the infinite dark for the muzzle flash of another predator who might decide *she* was the easier target. The silence wasn't just prudent anymore; it was a weapon aimed at everyone, including herself. The forest was dark because every light was a lie or a death knell, and every shot in the dark illuminated the shooter for the next hunter’s sights.

  She settled into the long watch, the cold certainty of the Strike deferred but not dismissed. The Beacon bought the Singularity time. Velt’s inaction bought her own world time. Both were counting down to an inevitable end, measured in the slow drift of stars and the fading patience of killers. The only truth in the dark forest was that survival meant letting others die first, and even that was only a temporary reprieve. The silence stretched, heavy with the unspoken violence of waiting.
