prompt: |-
  Hi, I'm a high school junior and I'm in this civics/Model UN thing where we keep getting stuck on a weird problem that I can't find the right word for. It's about how any group that decides something has to already exist before it can decide, but the thing it's deciding is often who gets to be in the group. For example, in Model UN we were doing a resolution about a region's right to self-determination, and the whole committee got stuck on who counts as 'the people' of the region. Everyone in the region? Everyone in the current country? People who live there now, or also people who used to live there and got pushed out? And it felt like whichever answer you pick basically decides whether the resolution passes, so the rule about who votes is doing more work than the vote itself.

  Then in civics we simulated a city annexing a suburb. The city council votes on whether to annex, but the suburb doesn't get to vote because it's not in the city yet. If the suburb votes first, the city residents don't get a say. If the suburb is split in half, each half votes seperately, and the outcome can flip depending on where you draw the line. And a neighborhood that got annexed last year now gets to vote on annexing another neighborhood, so the group that decides is always a product of earlier decisions that some other group made. I also saw this on a Discord server: a server votes on whether to merge with another server. The other server's members can't vote, but if they could, they'd outnumber the current members. Then after merging, they vote to un-merge, and now the original members are outvoted. It's like the membership rules are a constitution that can be amended by the very people it creates, and there's no neutral starting point.

  Is there a standard name for this exact circularity? I've heard 'boundary problem' and 'constituent power' and 'all affected interests' thrown around, but I don't know if one of those is exactly it or if they're all slightly different things. I don't just want a label, though. I want to know what the phenomenon actually is, what it isn't, and where its edges are. Like, is it the same as gerrymandering? Is it just secession under another name? Is it a special case of social choice, or is it something else entirely? If there's no single established name, can you coin one and define it so it covers the cases above but not ordinary rule-making inside a group whose members are already settled? And what would you say are the boundary cases, like does it apply to a club deciding its own membership fees, or only to territorially defined groups, or to things like future generations who can't vote at all? Thanks, this has been bugging me for weeks.
reasoning: |-
  Okay, this high school junior is really digging into a deep political theory problem they encountered in Model UN and civics. They're describing a fundamental circularity in group decision-making: who gets to decide the rules when the very act of defining the group determines the outcome. 

  First, I need to unpack their examples carefully. The Model UN self-determination case shows how defining "the people" predetermines the vote outcome. The city annexation simulation reveals how prior territorial decisions create the voting body that makes new decisions. The Discord server example demonstrates how membership changes alter future decisions in a chain with no fixed starting point. 

  Hmm, they're right that common terms like "boundary problem" or "constituent power" are related but not precise matches. The boundary problem usually refers to defining who's affected by decisions, while constituent power is about the source of constitutional authority. What they're describing is more specific: the recursive nature of membership rules in collective decision-making. 

  I recall Robert Dahl called this "the problem of the unit" in democracy - you can't have democratic procedures until you define the demos, but defining the demos isn't itself democratic. Margaret Canovan noted that all political foundations involve some undemocratic moment. This seems like a perfect fit for their cases.

  For the naming, "Membership Paradox" feels right because it captures the circular dependency. It's distinct from gerrymandering (which manipulates boundaries within an existing group) or secession (which is one manifestation of the paradox). The core is the recursion: the group defines itself through procedures created by... itself. 

  Important to clarify boundaries: Club membership fees don't trigger this because the existing group is settled. But future generations do represent an edge case - they're affected but can't participate, making the paradox visible in temporal form. Territorial groups just make the boundaries more concrete, but the logic applies to any community-defining decision.

  The student seems analytically sharp - they've noticed how foundational this is. I should emphasize that recognizing this paradox is actually sophisticated political thinking, not just a problem to solve. Their examples show they're already grasping how this underpins real conflicts like decolonization or municipal expansions. 

  When explaining, I'll avoid jargon and use their own examples. The key insight is that there's no neutral starting point - every "we" implies prior decisions about who counts as "we". That's why their Model UN committee got stuck on defining "the people". The resolution couldn't proceed because the voting rule was doing all the work, exactly as they observed. Smart kid.
answer: |-
  You've stumbled onto one of the deepest, most persistent problems in political philosophy and democratic theory – a fundamental circularity in collective self-determination. There isn't one universally agreed-upon name, but the concepts you're grappling with are well-recognized. Let's break it down:

  **The Core Phenomenon & Its Names:**

  1.  **The Boundary Problem (or the Problem of the Demos):** This is the most precise fit for your examples. It asks: **Who constitutes "the people" entitled to make collective decisions for a given territory or group?** The paradox is that any procedure used to define the demos (the people) must itself be established *by* some prior demos, which itself had to be defined... leading to an infinite regress with no truly neutral starting point.
  2.  **The Constituent Power / Constituted Power Distinction:** This gets at the *source* of authority. "Constituent power" is the original, unorganized power of "the people" to establish a political order (e.g., writing a constitution). "Constituted power" is the authority derived *from* that constitution (e.g., a parliament). Your problem arises because the "constituent people" must be defined *before* they exercise constituent power, but who defines them?
  3.  **All Affected Interests Principle:** This is a proposed *solution* or *normative ideal* (often contested), suggesting that everyone significantly affected by a decision should have a say in making it. Your examples highlight the immense practical difficulty of implementing this, especially when *determining* who is affected itself becomes a controversial decision made by an existing group.

  **What It Is (and Isn't):**

  *   **It IS:**
      *   A **foundational paradox** of self-governance: Defining the group that decides is logically prior to any decision the group makes, including defining itself.
      *   A problem of **circularity and infinite regress** in defining political membership.
      *   Inherently **political and contestable**: There is rarely a single "correct" or neutral answer. The answer chosen reflects power dynamics, historical claims, normative ideals (like self-determination or territorial integrity), and practical constraints.
      *   **Scale-invariant:** It appears in small groups (Discord servers, clubs) and massive ones (nations, international bodies). Territorial cases make boundaries visible, but the logic applies to any community.
  *   **It IS NOT:**
      *   **Gerrymandering:** Gerrymandering is the *manipulation* of boundaries *within an already defined political unit* (like a state) for partisan advantage. The Boundary Problem is the prior problem of *defining the unit itself* that gerrymandering then exploits.
      *   **Secession:** Secession is one *specific manifestation* or *potential consequence* of the Boundary Problem (e.g., a subgroup within a state claims *it* is the legitimate demos for its territory). The Boundary Problem is the underlying logic that makes secession debates so intractable.
      *   **Ordinary Rule-Making:** Once a group's membership is *settled and uncontested*, making rules *within* that group (like setting club fees or passing laws) is a different process. The Boundary Problem arises precisely when the definition of membership *is* the contested issue or when the group making a decision significantly alters its own future membership in a way that pre-determines outcomes.

  **A Proposed Name & Definition:**

  Given the lack of a single perfect term, let's coin a descriptive one:

  **The Foundational Membership Circularity (FMC)**

  *   **Definition:** The logically inescapable circularity that arises when a group claiming authority to make binding decisions must first define its own membership, yet the act of defining membership is itself a binding decision that presupposes the existence of a legitimate group capable of making it. The composition of the defining group fundamentally determines the outcome of subsequent decisions regarding membership or territory.

  **Applying the Definition to Your Cases:**

  1.  **Model UN Self-Determination:** Who defines "the people" for the region? The current state (itself a product of past FMC resolutions)? The UN committee (defined by UN membership rules)? The people living there now? Including the displaced creates a different "people" than excluding them. The FMC means *who decides the definition* determines the answer to self-determination.
  2.  **City Annexation:** The city council (constituted power of the existing city) decides to annex, excluding the suburb. If the suburb voted first, it would be a *different* demos making the decision. Splitting the suburb changes the demos and likely the outcome. The existing city council's legitimacy to define the new boundaries rests on prior, similar FMC decisions.
  3.  **Discord Merger:** The current server members vote to merge, excluding the larger group they want to merge with. After merging, the new, larger group (created by the first vote) votes to unmerge, outvoting the original members. Each vote's legitimacy and outcome depends entirely on the *temporally specific demos* defined by the previous FMC decision.

  **Where are the Edges? Boundary Cases:**

  1.  **Club Membership Fees:** This is **NOT** a clear case of FMC. *If* club membership is stable and uncontested, setting fees is internal rule-making by an established group. FMC *would* arise if the fee vote was also a vote to expel members who couldn't pay, fundamentally altering the defining group for *future* decisions.
  2.  **Future Generations:** This **IS** a profound temporal manifestation of FMC. The living demos makes decisions (e.g., on climate change, nuclear waste, debt) that profoundly affect future people who had no say in defining the current demos or its decision-making rules. The "all affected interests" principle highlights the injustice, but the FMC makes including them impossible under current models. It pushes the problem to an extreme.
  3.  **Defining Citizenship Rules:** This **IS** a core FMC instance. Who gets to vote on citizenship laws? Usually, existing citizens. Their decision defines the *future* demos, which will then make future citizenship laws. The initial definition (often historical, not democratic) casts a long shadow.
  4.  **Revolution/Constitutional Founding:** This is the **ULTIMATE** FMC moment. A group (e.g., revolutionaries, constitutional convention delegates) claims "constituent power" to define a *new* demos and political order. But who authorized *them*? Their legitimacy often rests on claims of representing "the true people" or natural rights, not prior democratic procedure – the circularity is temporarily broken by force or charisma, not resolved.

  **Why It Matters & What to Do:**

  You've identified something crucial. Recognizing FMC means understanding that:

  *   **There is no perfectly neutral starting point.** All political communities rest on foundational decisions about membership that are themselves contestable.
  *   **"The will of the people" is often ambiguous** until *after* you've decided who "the people" are.
  *   **Stability often comes from accepting existing boundaries** as settled facts, even if their origins are messy or unjust.
  *   **Solutions are pragmatic and political:** They involve negotiation, compromise, adherence to existing legal procedures (even if imperfect), international recognition, referendums (with carefully debated voter eligibility rules), or sometimes force. Philosophers propose ideals (like "all affected interests"), but implementing them perfectly is impossible due to FMC itself.

  The fact that this bugs you shows you're thinking deeply about the foundations of politics. Keep wrestling with it! It's a problem inherent to the very idea of collective self-rule, not a flaw in your understanding. Recognizing the circularity is the first step towards navigating it thoughtfully in your Model UN and civics work.
