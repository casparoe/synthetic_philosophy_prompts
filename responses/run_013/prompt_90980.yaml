prompt: |-
  I'm designing an institutional proposal and want an honest credence rather than a survey of the literature. The proposal: a bicameral national legislature in which one chamber remains elected by universal suffrage, and the other is filled by lot from a pool of citizens who have passed a written examination in basic statistics, probability, and civics; the sortition chamber would hold only a suspensive veto, able to delay but not block legislation it judges poorly grounded. Give me your credence, as a number, that adding such a chamber would improve the epistemic quality of enacted policy relative to a unicameral elected legislature over a thirty-year horizon in a stable wealthy democracy.

  Decompose the number rather than asserting it. I want your probability that ordinary electorates have systematically worse policy preferences than a competence-selected sample would; that exam-based selection tracks decision-relevant competence rather than socioeconomic background or ideological conformity; that the veto's influence would be net positive once agenda-setting power, bureaucratic capture, and the chamber's own incentives are accounted for; that the institution would remain stable rather than being captured or degraded; and whether "epistemic quality of policy" is determinate enough for the question to have a truth value at all. Give a rough probability and one line of justification for each term, say how they combine into the final number, and name the term your answer is most sensitive to and the evidence that would move it most.

  Separate what is settled from what is genuinely contested among people who have studied epistocracy, sortition, and democratic theory, and do not present a contested view as the consensus.
