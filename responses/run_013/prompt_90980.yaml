  First, I need to break down the user's request. They want a numerical probability, decomposed into specific factors. The factors include: whether ordinary electorates have systematically worse preferences than a competence-selected sample; if the exam tracks relevant competence without bias; the net positive effect of the veto considering agenda-setting and capture; institutional stability; and if "epistemic quality" is determinate enough. I should also separate settled from contested views in democratic theory.

