answer: |-
  Here is a decomposed credence assessment for your proposal, following your specifications. The final probability reflects the multiplicative chain of necessary conditions for epistemic improvement. I distinguish settled vs. contested knowledge throughout.

  ---

  ### **Final Credence: 6%**  
  *(0.06 probability that the chamber improves epistemic quality over 30 years)*  

  #### **Decomposition & Justification**  
  1. **P1: Ordinary electorates have systematically worse policy preferences than a competence-selected sample.**  
     - **Probability:** 0.65  
     - **Justification:** Empirical work (e.g., Caplan's *Myth of the Rational Voter*) shows systematic voter biases (e.g., anti-trade, growth-ignorant preferences), but median voters may align with experts on many issues.  
     - **Settled/Contested:** *Settled* that voters exhibit cognitive biases; *contested* whether these translate to worse *preferences* (e.g., Brennan vs. Estlund).  

  2. **P2: Exam-based selection tracks decision-relevant competence, not SES/ideology.**  
     - **Probability:** 0.40  
     - **Justification:** Basic stats/probability exams correlate strongly with general cognitive ability (*g*), which predicts analytical decision-making, but also with education/SES (e.g., WISC-V data). Risk of elite overrepresentation (e.g., 70%+ from top income quartile).  
     - **Settled/Contested:** *Settled* that such exams measure *g*; *contested* whether *g* equals "competence" for policy, and if demographic skew invalidates epistemic gains.  

  3. **P3: Veto power yields net positive influence after accounting for agendas, capture, and incentives.**  
     - **Probability:** 0.50  
     - **Justification:** Suspensive veto could filter low-evidence laws (e.g., moral panics), but agenda control by elected chamber may neuter it; bureaucratic/interest group capture of "experts" is likely (e.g., regulatory agency revolving doors). Chamber may develop self-serving biases.  
     - **Settled/Contested:** *Contested* entirely. No real-world analogues; deliberative democracy experiments show mixed results.  

  4. **P4: Institution remains stable (uncaptured, undegraded) for 30 years.**  
     - **Probability:** 0.60  
     - **Justification:** Wealthy democracies show institutional resilience, but sortition chamber faces high elite capture risk (e.g., lobbying via "advisors") or public backlash if perceived as unaccountable.  
     - **Settled/Contested:** *Contested*. Historical sortition (e.g., Athens) lasted centuries, but modern scale/complexity differs.  

  5. **P5: "Epistemic quality of policy" is sufficiently determinate.**  
     - **Probability:** 0.80  
     - **Justification:** Metrics like GDP growth, life expectancy, or expert rankings (e.g., OMB regulatory impact analyses) offer partial objectivity, though value conflicts (e.g., equity vs. efficiency) persist.  
     - **Settled/Contested:** *Settled* that some policies are objectively better (e.g., vaccines vs. bloodletting); *contested* for most complex trade-offs.  

  ---

  ### **How Probabilities Combine**  
  Final credence = P1 × P2 × P3 × P4 × P5 = 0.65 × 0.40 × 0.50 × 0.60 × 0.80 = **0.0624** (rounded to **0.06**).  
  - **Why multiplicative?** All conditions are *necessary* for the desired outcome. Failure at any stage likely collapses epistemic gains.  

  ---

  ### **Sensitivity & Key Evidence**  
  - **Most Sensitive Term: P2 (Exam tracks competence, not bias).**  
    - **Evidence that could move it:** Pilot programs testing exam design (e.g., Denmark’s deliberative assemblies with competency screening). If exams reduced SES correlation (e.g., via adaptive testing) without sacrificing predictive validity, P2 could rise to 0.60 (+50% relative gain). Conversely, real-world data showing demographic exclusion (e.g., <10% working-class participants) could drop P2 to 0.25.  

  ---

  ### **Settled vs. Contested in Democratic Theory**  
  - **Settled:**  
    - Voters exhibit systematic cognitive biases (Caplan, Bartels).  
    - Sortition reduces partisan polarization (Fishkin’s deliberative polls).  
    - Competency exams predict cognitive ability (psychometric literature).  
  - **Contested:**  
    - Whether competence improves collective decisions (Landemore vs. Brennan).  
    - If epistocracy inevitably degrades legitimacy (Estlund’s "qualified acceptability" problem).  
    - How "epistemic quality" is defined (procedural vs. outcome-based views).  

  This credence reflects high uncertainty due to institutional novelty and contested fundamentals. The largest barriers are P2 (exam bias) and P3 (veto effectiveness), where real-world data is scarcest.
