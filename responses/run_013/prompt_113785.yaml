        - If yes, then we have the social view: the self is constituted by the community's tracking and modeling.
        - If no, then we retreat from distribution? This path is unattractive because we initially said yes to distribution in marriage.

  - If no to the marriage case (distribution not possible), then we proceed to the split-brain case: a patient has undergone surgery that separates the hemispheres, and each hemisphere can function independently. Question 2: After the surgery, does the original person survive?
    - If yes, then we ask: is the person still unified, or is there now a disunified person? And more importantly, we need to distinguish between biological and simple substance views. We use the copying case: a procedure copies a substantial fraction of your neural pattern into another brain while you remain intact. Question 3: Is the copy you?
      - If yes, then this is unexpected because we ruled out distribution, but copying might be seen as creating a new instance. This combination might be incoherent or unexplored.
      - If no, then we ask: if the original is destroyed after the copy is made, is the copy you?
        - If yes, then this is the psychological-continuity view without a branching rule: copying with destruction is survival, but without destruction, it is not identity (because branching is not allowed and would kill you). However, we ruled out distribution, and this view might allow "distribution" only in the sense of transfer, not coexistence. But in the copy case without destruction, we said the copy is not you, which is consistent with no-branching. But in the destruction case, it is you. This is leaf (3). But note: in the split-brain, we said the original survives? In split-brain, if we said yes, the person survives, but then we have two hemispheres that might be seen as two streams, so it might be branching? Then this view would say the person does not survive? So there's a tension. 
        - If no (in the destruction case, the copy is not you), then we have the biological or simple substance view. We then use the dementia case: the patient is in advanced dementia, the body is alive but the mind is gone. Question 4: Is the self still present in the patient?
          - If yes, then we have the biological view: you are the organism.
          - If no, then we have the simple substance view: the self is an immaterial substance that requires a functioning mind or brain? But traditionally, the soul might be present even in dementia. So this might be unexplored or unattractive. Alternatively, it might be a variant of the psychological view that we haven't captured. Given the cases, we might not be able to distinguish, so we flag that the simple substance view and the biological view are not separated by this tree in this branch.

    - If no, the original person does not survive the split-brain surgery, then we have two scenarios: the person is replaced by two new persons (branching) or the person is gone and there are no persons (eliminativist). Question 3: Are there now two persons?
      - If yes, then we have branching. Then we go to the copying case without destruction: after copying, is the copy you?
        - If yes, then we have a psychological-continuity view that allows branching (not one of our leaves, but we note it).
        - If no, then we have the psychological-continuity view with a no-branching rule (leaf 3): branching is not allowed and results in death of the original and birth of new persons.
      - If no (there are not two persons), then we might have eliminativism. We then ask: in the dementia case, was there ever a self to begin with?
        - If no, then we have the eliminativist view (leaf 6).
        - If yes, then we are in a view that the self was destroyed in the split-brain, but there might be one person or none? This might be unexplored.

  Additionally, we have the case where the original is destroyed after copying. We use it in the no-distribution branch to distinguish the no-branching view (where destruction after copying allows survival in the copy) from the biological/simple substance view (where it does not).

  We must also note combinations that are empty:

  - The combination where distribution is denied in the marriage case, but then in the split-brain case the person survives as one, and in the copying case without destruction the copy is you, is incoherent because it allows copying to create a new you (distribution) but we denied distribution in marriage.

  - The view that the self is a simple substance and is not present in dementia is unattractive because the substance is typically seen as persisting.

  Finally, we flag that the tree may not distinguish the biological view and the simple substance view in the case where both answer similarly to the dementia and copying cases. For those two, we might need additional metaphysical commitments.

  I hope this helps. Let me know if you'd like any adjustments.

  Best regards,
  [Your Name]
answer: |-
  My dear colleague,  

  Your request for a decision tree to classify views on the distributability of the self—especially Hofstadter's intriguing notion of the self as a self-referential pattern that can be partially instantiated in other minds—is a welcome challenge. I've constructed the instrument as a series of case-based questions, each probing a distinct aspect of the logical space without presupposing theoretical labels. The tree begins with the most phenomenologically accessible scenarios (like long-term marriage) to gently surface intuitions, then escalates to edge cases (like brain copying or destruction) to force commitments. Every node is a question a reader can answer based on raw intuition, and I've flagged empty combinations (incoherent, unattractive, or unexplored) and indistinguishable leaves as you requested. The cases you specified are woven throughout, with the destruction-after-copying case explicitly testing if "distribution" is meaningfully distinct from duplication.  

  We start with the marriage case: after forty years, each spouse has internalized the other’s habits of thought—finishing sentences, anticipating reactions, even dreaming from the other’s perspective. **Question 1: Is part of one spouse’s self now present in the other’s mind?**  
  - If *yes*, we proceed to the dementia case: a patient with advanced Alzheimer’s has lost most memories and personality coherence, but their lifelong carer (or spouse) preserves robust mental models of them—predicting preferences, hearing their "voice" in decisions, etc. **Question 2: Is the patient’s self still present, even partially, in the carer’s mind?**  
    - If *yes*, we face the teacher case: an influential philosopher’s students unconsciously adopt her reasoning tics, problem-solving approaches, and values, spreading them across a generation. **Question 3: Is the teacher’s self present in the students’ minds?**  
      - If *yes*, we reach Hofstadter’s *degreed-pattern view*: the self is a self-referential pattern that can be distributed across minds in partial, degraded forms, with identity grounded in the pattern’s fidelity (not its substrate).  
      - If *no*, we ask: **Is the teacher’s self nonetheless sustained by the community’s collective model of her—e.g., in shared stories, rituals, or expectations?**  
        - If *yes*, we land on the *social view*: the self is whatever the surrounding community tracks and models; it’s external, not inside any single head.  
        - If *no*, this path is empty—unattractive due to inconsistency. If the spouse’s mind holds part of a self but the community’s model does not, why privilege intimate over collective internalization? No major theory occupies this niche.  
    - If *no* to the dementia case, we hit a contradiction. If distribution occurs in marriage but not when a carer holds a fading self-pattern, what breaks the analogy? This junction is incoherent and thus empty.  
  - If *no* to the marriage case (no distribution), we turn to the split-brain case: a patient’s corpus callosum is severed, yielding two independently conscious hemispheres. **Question 2: After surgery, does the original person survive?**  
    - If *yes*, we test divisibility with a hypothetical: a fraction of your neural pattern (say, 30% of associative memories and traits) is copied to a second brain while you remain conscious and intact. **Question 3: Is the copy you?**  
      - If *yes*, we confront the destruction case: the original is destroyed after copying. **Question 4: Is the copy now you?**  
        - If *yes*, we have duplication-transfer: identity isn’t tied to the original substrate, but distribution is irrelevant since only one "copy" exists post-destruction. This is unexplored—no theory treats copying-as-identity while denying distribution.  
        - If *no*, this is incoherent: if the copy was you pre-destruction, why does destroying the original negate that? Empty.  
      - If *no* (the copy isn’t you), we revisit the dementia case: the patient’s body lives, but their mind is gone. **Question 4: Is the self still present in the patient?**  
        - If *yes*, we arrive at the *biological view*: you are the living organism, indivisible and unsharable.  
        - If *no*, we face the *simple indivisible substance view* (e.g., a Cartesian ego): the self requires unified mental function and cannot persist in dementia or be shared. *But note*: this leaf is indistinguishable from the biological view in this tree—both reject distribution and split-brain survival, yet diverge metaphysically. We flag this pair as inseparable here.  
    - If *no* (the original doesn’t survive split-brain), we probe branching with the copying case: your full neural pattern is copied to another brain; you remain intact. **Question 3: Is the copy you?**  
      - If *yes*, we get a branching-tolerant psychological view: identity can replicate across brains. But this isn’t among your specified leaves—it’s merely noted.  
      - If *no*, we apply the destruction case: the original is destroyed post-copying. **Question 4: Is the copy now you?**  
        - If *yes*, we have the *psychological-continuity view with no-branching*: copying is fission, fission is death, so survival requires no competitors (hence transfer via destruction).  
        - If *no*, we turn eliminativist: **In the dementia case, was there ever a substantive self to lose?**  
          - If *no*, we reach *eliminativism*: there’s no "self" to distribute, only bundles of traits or illusions.  
          - If *yes*, this is empty—unattractive because it denies distribution, divisibility, *and* transfer, leaving no coherent account of persistence.  

  **Empty combinations clarified**:  
  - *Marriage distribution denied, but split-brain survival affirmed and copying yields identity*: Incoherent, as it allows copying to create a new self (a form of distribution) while denying distribution in marriage.  
  - *Distribution in marriage but not in dementia carers*: Incoherent, as both cases involve partial pattern-holding.  
  - *Split-brain survival denied, copying denied, destruction-transfer denied, but a self existed pre-dementia*: Unattractive, as it implies total fragility with no resilience via copying, distribution, or biology.  

  **Indistinguishable leaves**: The *biological view* and *simple substance view* cannot be separated here. Both answer "no" to distribution (marriage), "yes" to split-brain survival, "no" to copying, "no" to destruction-transfer, and "yes" to dementia persistence. They diverge only on the metaphysical "what" (organism vs. soul), which no case in this tree forces out.  

  **Key insights from the tree**:  
  - Hofstadter’s view is isolated by affirming distribution in marriage *and* dementia carers, distinguishing it from social externalism (which requires community modeling, not just individual minds).  
  - The destruction case reveals that some "distribution" views collapse into duplication-transfer (e.g., no-branching psychology), but Hofstadter’s pattern view survives because distribution is partial and co-exists with the original.  
  - Eliminativism emerges cleanly only after rejecting all forms of persistence, including post-destruction transfer.  

  This structure should serve your seminar well, forcing students to confront where their intuitions align—or fracture—across concrete scenarios. If you’d like to refine any branches, I’d be delighted to iterate.  

  Warmly,  
  A Fellow Traveler in the Labyrinth of Self
