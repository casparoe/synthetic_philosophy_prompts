prompt: |-
  A physicist friend and I spent most of Saturday evening arguing about whether the Church–Turing thesis is a theorem, a conjecture, or a definition wearing a lab coat, and whether some future physics could falsify it; he holds that any new machine only tells us which physical systems happen to be Turing-equivalent, and I came away convinced he was quietly running together at least three different claims. The argument matters to me professionally. I sit on the review panel for an unconventional computing programme, and we get perhaps a dozen proposals a year claiming to compute something a Turing machine cannot: analog machines with real-valued registers, quantum architectures, neuromorphic and optical designs, occasionally something invoking relativistic or exotic physics. The panel has no policy for these, so they get judged by whoever is least tired that afternoon, and a fund or a reject is a real decision for a postdoc's career. I write the assessment sheet the chair signs, and the other panel members are not mathematicians.

  Please turn the distinctions that actually matter here into a decision procedure I can run on a proposal in an afternoon, without needing the authors' mathematics to be checkable by me. Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops with a clear no, and where it hands the judgment to a person because the question is one of physics we don't have or of taste rather than fact. It has to keep separate the things my friend kept merging: what is computable versus how efficiently, the thesis about effective calculability versus the claim about our actual physics, and the difference between showing the thesis is false and showing it does not apply to the machine in front of me. Flag the moves that look like cheating but aren't, and the ones that look like physics but are really just an unearned idealisation.

  Then run the procedure on three proposals. First, an analog device whose registers hold arbitrary real numbers to infinite precision and can test them for exact equality with zero, argued to decide a set no Turing machine decides. Second, a quantum architecture claimed to surpass the thesis because it evaluates exponentially many computational paths at once. Third, a scheme that gets its extra power by completing infinitely many steps in finite time, or by requiring a measurement of unlimited precision, and that argues this is permitted by physics in principle. At least one of your three verdicts should be one I will not enjoy reading, and you should be honest about the points where the procedure is only my prior that the thesis will survive, dressed up as a test.

  Lead with the procedure itself, then the three worked cases, then a short closing section on what the procedure cannot settle. Keep it under 1,000 words.
reasoning: |-
  We are designing a decision procedure for proposals that claim to compute beyond the Church-Turing thesis (CTT). The CTT states that a function on the natural numbers is computable by an effective method (i.e., by an algorithm) if and only if it is computable by a Turing machine. We must separate:

  1. What is computable (computability) vs. how efficiently (complexity).
  2. The thesis about effective calculability (a mathematical concept) vs. the claim about what our actual physics can compute.
  3. The difference between showing the CTT is false (which would require a new mathematical model of computation that is effectively calculable and not Turing-computable) and showing that the CTT does not apply to the machine at hand (because the machine is not physically realizable in the way required for the CTT).

  The procedure must be runnable in an afternoon without deep mathematical verification.

  **Decision Procedure:**

  1. **Question 1: Does the proposal claim to compute a function on the natural numbers (or a set of finite strings over a finite alphabet)?**
     - *Why?* The CTT is about functions on the natural numbers (or equivalently, on finite strings). If the machine is computing something else (e.g., a function on the real numbers that requires infinite precision), then the CTT might not directly apply.
     - *Sufficient answer:* The authors must specify the input and output domains. If the input and output are not natural numbers (or finite strings) then the CTT is not directly challenged. The procedure stops for CTT violation claims and moves to non-CTT claims (if any) in Question 5. If they are about natural numbers, proceed to Question 2.
     - *Clear no stop:* If the function is not on natural numbers, then the claim of violating CTT is invalid. The proposal might be about something else (e.g., real computation) and we move to Question 5.

  2. **Question 2: Does the proposal claim to compute a function that is not Turing-computable?**
     - *Why?* The core of CTT is that every effectively calculable function is Turing-computable. The proposal must identify a specific function that they claim is not Turing-computable but is computable by their machine.
     - *Sufficient answer:* The authors must explicitly state the function (or set) and argue why it is not Turing-computable (e.g., by showing it is equivalent to the halting problem or a higher Turing degree). If they do not specify such a function, stop: the claim of surpassing CTT fails.
     - *Clear no stop:* If the function they claim to compute is known to be Turing-computable (e.g., they are just doing it faster) or if they haven't specified a non-computable function, then the claim of violating CTT is rejected.

  3. **Question 3: Is the machine physically realizable in principle, without unearned idealizations?**
     - *Why?* Even if the machine is described, it might require resources (like infinite precision, infinite energy, or infinite time) that are not available in the physical universe. The CTT is about effective calculability, which is a mathematical abstraction, but if the machine is not physically realizable then it does not challenge the physical version of the thesis (sometimes called the Physical Church-Turing thesis).
     - *Sufficient answer:* The machine must be described with a physical implementation that does not require:
          - Exact real numbers (with infinite precision) in finite time and space.
          - Infinitely many steps in finite time (unless by a well-defined physical process that compresses infinite steps, which is controversial).
          - Measurements of unlimited precision (beyond what quantum mechanics or relativity allows).
          - Other resources that are known to be physically impossible (e.g., infinite energy).
     - *Clear no stop:* If the machine requires any of the above, then it does not challenge the Physical CTT. We note that the machine might be a valid mathematical model (like the real RAM model) but not physically realizable. The claim of physical super-Turing computation fails.

  4. **Question 4: Does the machine operate by an effective method?**
     - *Why?* The CTT requires that the method be effective (i.e., an algorithm that a human can carry out with pencil and paper, or by a machine following finite, discrete steps). If the machine uses a non-algorithmic process (e.g., an oracle, or a physical process that is not finitely describable), then it is not an effective method and the CTT does not apply.
     - *Sufficient answer:* The authors must describe the steps of the computation in a finite, discrete, and unambiguous way. If they rely on a physical process that is not reducible to finite, discrete steps (e.g., a continuous evolution that is not simulated by a Turing machine), then it is not effective.
     - *Clear no stop:* If the method is not effective, then it does not challenge the original CTT (which is about effective methods). The machine might be a hypercomputer, but it doesn't falsify the CTT.

  5. **Question 5: For non-CTT claims (e.g., efficiency, real computation, etc.), is the claim valid and significant?**
     - *Why?* The proposal might not challenge CTT but could still be valuable (e.g., faster computation, better precision, or a model for analog computation). We must evaluate if the claim is mathematically sound and physically relevant.
     - *Sufficient answer:* The authors should provide:
          - A clear mathematical model and a theorem proving the claimed property (e.g., exponential speedup, solving a problem in polynomial time that is hard for classical computers).
          - A physical implementation that is feasible (without unearned idealizations).
          - A clear advantage over existing methods (in efficiency, energy, etc.).
     - *Judgment call:* This step requires domain expertise. If the proposal is about quantum computing, for instance, we know that exponential speedups are known for some problems (like factoring) but not for NP-complete ones. For analog machines, we must check if the claimed precision is physically achievable.

  **Flagging common issues:**
  - *Cheating but not:* Claiming to compute a function on the reals (which is beyond the scope of CTT) and then saying that they have surpassed Turing machines. This is a category error.
  - *Unearned idealization:* Assuming that a physical quantity (like a voltage) can be set to an arbitrary real number with infinite precision and measured exactly. Physics (quantum mechanics, noise, etc.) does not allow this.

  Now, we run the procedure on three proposals.

  **Proposal 1: Analog device with real-valued registers and exact equality test.**

  - **Question 1:** They claim to compute a function on the natural numbers? Actually, they might be computing a function on the reals. But let's assume they claim to decide a set of natural numbers (by encoding them in the reals and using the machine). They might claim to solve the halting problem (which is a set of natural numbers). So we proceed.
  - **Question 2:** They claim to decide the halting problem (a non-Turing-computable set). So they do specify a non-computable function.
  - **Question 3:** The machine requires registers holding arbitrary real numbers to infinite precision and exact equality tests. This is not physically realizable. Quantum mechanics and thermodynamics impose limits on precision. We cannot have infinite precision in a finite device. **Stop: clear no.** The machine is not physically realizable.

  **Verdict for Proposal 1:** Reject the claim of physical super-Turing computation. The machine is a mathematical abstraction, not a physical device. The Physical CTT remains unchallenged.

  **Proposal 2: Quantum architecture evaluating exponentially many paths.**

  - **Question 1:** They claim to compute a function on natural numbers (or finite strings). Yes.
  - **Question 2:** Do they claim to compute a non-Turing-computable function? Typically, quantum computers are known to compute only Turing-computable functions (they are within BQP, which is a subset of computable functions). If they claim to compute a non-computable function, they must specify. But the standard claim is about speed, not computability. If they do not claim a non-computable function, then we stop at Question 2: **clear no.** If they do claim one, then we must check.

  However, let's assume they are only claiming exponential speedup (which is a complexity claim). Then we skip to Question 5.

  - **Question 5:** The claim is about efficiency. We know that quantum computers can provide speedups for some problems (like factoring). But for NP-complete problems, no exponential speedup is known. We must check:
     - The problem they are solving: is it one for which quantum speedup is known? If not, they must provide evidence (e.g., a new algorithm). 
     - Physical realizability: Quantum computers are being built, so in principle, yes. But the specific architecture must be feasible.

  **Verdict for Proposal 2:** If they claim a non-computable function, reject because quantum computers are known to be Turing-equivalent. Otherwise, evaluate on efficiency and practicality. This is a judgment call: if the speedup is for a problem of practical interest and the architecture is sound, fund. If not, reject.

  **Proposal 3: Scheme completing infinitely many steps in finite time or requiring unlimited precision.**

  - **Question 1:** They claim to compute a function on natural numbers? Yes (e.g., they might claim to solve the halting problem).
  - **Question 2:** They specify a non-Turing-computable function? Yes (the halting problem).
  - **Question 3:** The machine requires either:
     (a) Completing infinitely many steps in finite time: This would require an infinite speedup (e.g., via relativistic time dilation or an accelerating machine). Physics does not allow an infinite number of steps in finite time because of the Planck scale and quantum gravity. Even if we consider relativistic hypercomputation (like Malament-Hogarth spacetimes), these are highly idealized and require infinite energy or are not globally hyperbolic (so not considered physically reasonable by many). 
     (b) Unlimited precision: As in Proposal 1, it is physically unrealizable.

  **Stop: clear no at Question 3.**

  **Verdict for Proposal 3:** Reject. The machine is not physically realizable.

  **What the procedure cannot settle:**

  1. **Physical realizability of exotic models:** For example, if a proposal uses a quantum gravity effect that is not yet understood, we cannot be sure. We must rely on current physics.
  2. **Efficiency claims:** We might not be able to verify a claimed speedup without deep mathematical analysis. We rely on the authors' proofs and peer review.
  3. **Taste and significance:** Even if a machine is physically realizable and does something faster, we must judge if it is worth funding. This is subjective.

  **Closing:**

  The procedure separates the key issues and stops early for most non-starters. It protects against category errors and unphysical idealizations. However, for proposals that pass the initial hurdles (like a quantum computer with a new algorithm), we must rely on expert judgment and peer review for the complexity claims. The Physical CTT is robust because it is tied to what we believe about the universe, and so far, no physically realizable device has been shown to violate it.
answer: |-
  ### Decision Procedure for Claims of Non-Turing-Computability  
  This procedure evaluates proposals claiming to compute beyond the Church–Turing thesis (CTT). The CTT is a **conjecture** about *effective calculability* (mathematical computability by an algorithm), not a theorem. It states that any function computable by an "effective method" is computable by a Turing machine (TM). Crucially, it is *not* inherently about physics. The procedure separates:  
  1. **Computability** (what can be computed) vs. **complexity** (efficiency/resources).  
  2. **CTT’s scope** (effective calculability) vs. **physical realizability** (whether the machine can be built).  
  3. **Falsifying CTT** (showing an effective method non-TM-computable) vs. **bypassing CTT** (using physics outside the thesis’ scope).  

  **Questions in Order** (Stop if any answer fails):  
  1. **Does the proposal specify a *concrete function/set* on the natural numbers (or finite strings) that it claims is *not Turing-computable*?**  
     - *Why?* CTT concerns functions on ℕ or finite alphabets. Vague claims (e.g., "solves undecidable problems") are invalid.  
     - *Sufficient answer:* Explicit function/set (e.g., "decides the halting problem").  
     - *Clear no:* Stop. Reject claim of non-Turing-computability. Proceed to Question 5 for efficiency claims.  

  2. **Does the machine avoid *infinite precision*, *infinite energy*, or *infinite time* per operation?**  
     - *Why?* CTT assumes finite, discrete steps. Unbounded physical resources are unearned idealizations; physics (e.g., quantum noise) forbids them.  
     - *Sufficient answer:* All operations use finite resources (e.g., finite precision, energy, time per step).  
     - *Clear no:* Stop. Machine is physically unrealizable. CTT unchallenged.  

  3. **Is the machine’s behavior *algorithmically describable* with finite steps?**  
     - *Why?* CTT applies only to "effective methods" (finite, discrete, human-executable procedures).  
     - *Sufficient answer:* Operations are finite and discrete (e.g., binary gates, measurable states).  
     - *Clear no:* Stop. Machine is outside CTT’s scope (e.g., uses a physical oracle). Does not falsify CTT.  

  4. **Does the proposal *separate computability from complexity*?**  
     - *Why?* Many claims confuse speed (e.g., "exponential parallelism") with computability.  
     - *Sufficient answer:* Acknowledges that TMs compute the same functions, even if inefficiently.  
     - *Clear no:* Stop. Claim confuses efficiency with computability. Reject non-Turing claim.  

  5. **For non-CTT claims (e.g., efficiency, real-number computation), is the *advantage physically realizable and significant*?**  
     - *Judgment call:* Requires human expertise.  
     - *Sufficient answer:*  
       - For efficiency: Proof of speedup (e.g., polynomial vs. exponential time) without unphysical resources.  
       - For non-ℕ domains: Clear use case (e.g., analog simulation) and no false CTT appeal.  
     - *Insufficient:* "This is faster in theory" without evidence of physical feasibility.  

  **Red Flags**  
  - **Looks like cheating but isn’t:** Claiming non-Turing-computability for functions on **real numbers**. CTT is about ℕ/finite strings; reals are a different domain.  
  - **Looks like physics but is unearned idealization:** Assuming **exact equality tests** (quantum noise forbids infinite precision) or **infinite steps in finite time** (requires unbounded energy/space).  

  ---  
  ### Evaluations of Example Proposals  
  **Proposal 1: Analog device with real-valued registers and exact equality test**  
  - **Q1:** Claims to decide a non-Turing-computable set (e.g., halting problem) → *Pass*.  
  - **Q2:** Registers hold reals with infinite precision; tests exact equality → *Clear no*. Unphysical (quantum limits precision; noise corrupts values).  
  - **Verdict:** **Reject** non-Turing claim. Machine is physically unrealizable.  
  - *Note:* This does not falsify CTT; it bypasses it by changing the domain (reals vs. ℕ).  

  **Proposal 2: Quantum architecture evaluating exponentially many paths**  
  - **Q1:** Claims to compute functions on ℕ → *Pass*.  
  - **Q2:** Uses finite resources (qubits, gates) → *Pass*.  
  - **Q3:** Operations are algorithmic (quantum gates) → *Pass*.  
  - **Q4:** Claims "surpass Turing machines" via parallelism. But quantum computers compute TM-computable functions (BQP ⊆ computable) → *Clear no*. Confuses speed with computability.  
  - **Q5 (for efficiency):** Quantum speedups exist (e.g., Shor’s algorithm). *Judgment call:* If speedup is proven (e.g., for BQP problems) and architecture feasible, **fund for efficiency**. Else, reject.  
  - **Verdict:** **Reject non-Turing claim** (fails Q4). May fund for complexity advantages if justified.  

  **Proposal 3: Scheme completing infinitely many steps in finite time**  
  - **Q1:** Claims to solve halting problem → *Pass*.  
  - **Q2:** Requires infinite steps in finite time (e.g., relativistic hypercomputation) → *Clear no*. Unphysical (infinite energy/matter required; contradicts known physics).  
  - **Verdict:** **Reject**. Physically unrealizable. CTT unchallenged.  
  - *Note:* This verdict may be "unenjoyable" if authors invoke speculative physics (e.g., closed timelike curves). The procedure rejects it because *current* physics forbids it.  

  ---  
  ### What the Procedure Cannot Settle  
  1. **Speculative physics:** Proposals invoking theories beyond current understanding (e.g., quantum gravity) rely on *judgment calls*. The procedure defaults to established physics (Q2).  
  2. **Efficiency significance:** Whether a speedup is "useful" (e.g., quantum vs. classical) is subjective and requires domain expertise (Q5).  
  3. **CTT’s future falsification:** If a proposal passes Q1–Q4, it would falsify CTT. But Q2–Q3 ensure this is unlikely. The procedure embeds a **prior that CTT holds** by requiring physical realism and algorithmic steps.  

  **Closing**: This procedure blocks category errors, unphysical idealizations, and efficiency-computability conflations. For non-CTT claims (e.g., analog efficiency), it forces rigor without advanced math. It does not prove CTT but enforces that challengers must meet its scope and physical reality. Use peer review for Q5 judgments.  

