prompt: |-
  I price flood and wildfire cover for a small specialty insurer. Maybe forty accounts a year, and the difference between a 2% and a 10% annual loss probability is the difference between a good year and a bad one, so these calls matter. Every time, the cat model spits out a number and then me and the underwriters argue about whether to believe the model or believe our gut.

  A friend who did a philosophy degree told me there's a rule for exactly this: if you're certain the real, out-there chance of something is 30%, then your own confidence should be 30%, period — your hunches don't get a vote. Then he added two caveats and I still can't tell if they're deep or just technical. First, you're only allowed to defer like that if the rest of what you know bears on the outcome only through the chance; if you've got something like a tip about how it actually turned out, the rule doesn't apply. Second, if what you already know gives you reason to think the chance isn't 30% after all, you can't just defer either.

  I want a procedure I can actually run on an account in about an hour, with no stats beyond what I've taught myself from textbooks. Steps in order, what counts as passing each one, where it stops and hands the call to a person, and where it's just my judgment dressed up as procedure. Then run it on three: a riverside warehouse where the model says 2% and my gut says 10%; a hillside subdivision where the model says 4% but I know that same model has undercalled every fire season for five years; and something brand new with no history at all. And tell me what the whole thing can't do. The chief underwriter has to sign off, so if a step needs her, say so.
reasoning: |-
  We are going to design a procedure that incorporates both the model output and human judgment in a structured way. The procedure is based on the principle of deference to the model's probability (the "chance") when appropriate, but with checks for when we have additional information that might override that deference.

  The procedure steps:

  1. **Model Output Review**: Start with the model's output probability (P_model) for the annual loss (e.g., flood or wildfire) for the specific account.

  2. **Check for Direct Evidence (Caveat 1)**: 
     - Ask: Do I (or any underwriter) have any direct evidence about the outcome for this specific account that is not already incorporated in the model? 
       - Example: A tip that this particular warehouse has been flooded in the past year, or that the hillside subdivision has had a near-miss fire that wasn't in the model's data.
     - If yes, then we cannot simply use the model's probability. We must adjust. This step stops and hands off to a human (underwriter) to quantify the impact of this new evidence (which may be difficult). The chief underwriter must sign off on any adjustment because it is a material override.
     - If no, proceed to step 3.

  3. **Check for Model Bias or Inaccuracy (Caveat 2)**:
     - Ask: Do we have reason to believe that the model is systematically biased for this type of risk? 
       - We are looking for evidence that the model has a track record of undercalling or overcalling similar risks. This should be based on historical data, not a hunch.
     - How to check:
       - For the specific risk type (e.g., hillside subdivision in a wildfire zone) and per peril (flood or wildfire), look at the past accounts that are comparable (same geography, similar construction, etc.) and compare the model's predicted loss probability with the actual loss experience over multiple years.
       - We require at least 5 comparable accounts (or 5 years of data for the same account) to make a statistical assessment. If we don't have enough data, we cannot establish bias and proceed to step 4.
       - If we have enough data, calculate the average annual loss probability from the model and the actual annual loss frequency (number of losses divided by number of years). If the actual frequency is significantly different (using a simple rule of thumb: more than 20% relative difference and the difference is consistent over the period) then we have evidence of bias.
     - If bias is found, then we adjust the model's output by the observed bias factor (e.g., if the model has undercalled by 50% on average, then we might adjust the probability by multiplying by 1.5). The adjustment factor must be documented and approved by the chief underwriter.
     - If no bias is found, proceed to step 4.

  4. **Account-Specific Overrides**:
     - Even after steps 2 and 3, we may have account-specific factors that are not captured by the model and are not direct evidence of the outcome (so step 2 didn't catch them) and not part of a systematic bias (so step 3 didn't catch them). 
     - These might be:
       - Changes in the risk that are too recent for the model (e.g., new construction upstream that might affect flooding, or a new firebreak installed).
       - Factors the model doesn't consider (e.g., the warehouse stores flammable materials, but the model only considers location and building type for wildfire).
     - We require that such factors be:
       - Documented with evidence.
       - Quantified in terms of how they change the probability (e.g., "the new firebreak reduces the probability by 30%") based on expert judgment or studies.
     - The chief underwriter must sign off on any such override.

  5. **Final Probability**:
     - If no adjustments are made in steps 2, 3, or 4, then the model's probability is used.
     - If adjustments are made, the adjusted probability is used.

  6. **New Risks with No History**:
     - For a brand new risk (no history at all), we skip step 3 (because we don't have data to check bias) and rely on steps 2 and 4. We must be extra cautious with step 4 overrides because we have no track record.

  Now, let's run the procedure on the three examples:

  **Example 1: Riverside warehouse (model: 2%, gut: 10%)**

  1. Model output: 2%
  2. Check direct evidence: Do we have a tip about this specific warehouse? Let's assume no.
  3. Check model bias: 
     - We look at comparable risks (riverside warehouses) over the past 5 years. Suppose we have 20 such accounts. 
     - The model predicted an average annual loss probability of 3% for these, but the actual loss frequency was 3.5%. That's a 16.7% relative difference (which is less than 20%). So we don't have enough evidence to say the model is biased for this risk type. 
     - Alternatively, if we have only 5 accounts and the model predicted 2% on average but the actual was 3%, that's a 50% relative difference. But with only 5 accounts, we might not consider it statistically significant? Our rule says at least 5 comparable accounts. We might then compute the average model probability and the average actual frequency. If the difference is large and consistent, we might adjust. But in this example, let's assume we have 20 and the difference is small. So we don't adjust for bias.
  4. Account-specific overrides: 
     - Is there any factor not in the model? The underwriter's gut says 10%. We ask for specific reasons. 
       - Maybe the gut feeling is based on the warehouse being located at a sharp bend in the river, which the model doesn't capture? 
       - If the underwriter can document that such a bend increases risk by 5 times (from 2% to 10%), and this is based on engineering studies or past claims data from similar bends, then we adjust. 
     - But without specific evidence, we cannot override. 
     - In this case, if no specific evidence is provided, we stick with 2%. 
     - However, the underwriter might argue that the model doesn't account for the bend. Then we have to quantify the impact. If we have data on similar locations, we might adjust. Otherwise, we might have to do a manual rating. The chief underwriter must sign off on any override.

  Conclusion for Example 1: Without evidence for an override, we use 2%. If the underwriter provides evidence of the bend and its impact (and the chief signs off), then we adjust to 10%.

  **Example 2: Hillside subdivision (model: 4%, but model has undercalled every fire season for five years)**

  1. Model: 4%
  2. Direct evidence: None (assumed).
  3. Check model bias:
     - We have a track record: for the past five years, the model has undercalled the actual fire losses in this subdivision (or in comparable hillside subdivisions). 
     - We look at the same subdivision (or comparable ones) over the past 5 years. 
       - Model predictions (annual probabilities) for these: let's say they were 4%, 4%, 4%, 4%, 4% (so average 4%).
       - Actual losses: one loss in 5 years? That would be 20% annual probability (if one loss in five years). Or if there were two losses, 40%. 
       - We compare the average model probability (4%) to the actual frequency (say 20%). The relative difference is (20%-4%)/4% = 400% which is well above 20%. 
     - We adjust by the ratio of actual frequency to model probability: 20% / 4% = 5. So we multiply the model's 4% by 5 to get 20%. 
     - But note: we are using the same subdivision? Then we have 5 years of data for one account. Our rule requires at least 5 comparable accounts? We said "at least 5 comparable accounts (or 5 years of data for the same account)". So we can use the same account over 5 years. 
     - Therefore, we adjust the model output to 20%. 
     - The chief underwriter must sign off on this adjustment.

  Conclusion for Example 2: Adjusted probability is 20%.

  **Example 3: Brand new risk with no history**

  1. Model output: say 5% (for example).
  2. Direct evidence: None (by definition, it's new).
  3. Check model bias: We skip because there's no history.
  4. Account-specific overrides: 
     - We look for factors not in the model. For instance, if it's a new type of construction that the model hasn't been validated on, we might adjust. 
     - But without any track record, we must rely on expert judgment. 
     - The underwriter might feel that the model is too low or too high. They must document why. 
     - Example: The model doesn't account for a nearby hazard (like a new industrial plant that increases fire risk). We must quantify that. 
     - Without specific evidence, we stick with the model. 
     - If we adjust, the chief underwriter must sign off.

  Conclusion for Example 3: Without overrides, 5%. With documented overrides, adjusted accordingly.

  **What the whole thing can't do**:

  - It cannot create data where there is none. For new risks or rare events, we are heavily reliant on the model and expert judgment.
  - It cannot replace deep statistical analysis when the data is complex (e.g., when the bias is not constant but varies by risk level). Our bias adjustment is a simple multiplicative factor, which may not be appropriate in all cases.
  - It might not capture interactions between perils (e.g., flood and wildfire together) if the model doesn't.
  - It relies on the quality of the historical data for bias adjustment. If the historical data is sparse or not comparable, the adjustment may be unreliable.
  - It requires chief underwriter sign-off for overrides, which may slow down the process but is necessary for governance.

  **Time constraint**: The procedure is designed to be run in about an hour per account. The most time-consuming part is gathering the data for the bias check (step 3) and documenting overrides (step 4). For step 3, having pre-compiled performance data for different risk types can speed things up.

  By following these steps, we are not just going with gut feelings without evidence, but we are allowing for adjustments when there is documented evidence or proven model bias.
answer: |-
  Below is a structured, practical procedure for your pricing decisions, designed to respect the philosophy of probability deference ("chance-first") while incorporating your real-world constraints. It follows a **four-step flow**, with clear pass/fail criteria and escalation points. Each step must be completed in sequence, with steps 2–4 requiring Chief Underwriter (CU) sign-off if overrides occur. Total runtime per account: **45–60 minutes**.

  ---

  ### **The Procedure: Chance-First Evaluation with Override Gates**
  **Core Principle**: Start with the model’s probability as the default. Override **only** if specific, documented conditions are met (per the two caveats).  
  **Tools Needed**: Model output, historical loss data (if available), and a standardized checklist (see examples).

  #### **Step 1: Accept the Model’s Probability (5 mins)**
  - **Input**: Model’s annual loss probability (e.g., 2%).  
  - **Action**: Treat this as the baseline probability \( P_{\text{model}} \).  
  - **Pass Condition**: No immediate objections based on **Caveat 1** or **Caveat 2** (proceed to Step 2).  
  - **Stop & Handoff**: None. This step is automatic.

  #### **Step 2: Check for Direct Evidence Override (Caveat 1) (15 mins)**
  - **Question**: *Do you have evidence bearing **directly on the outcome**, unrelated to the model’s probability?*  
    - Examples: Ground reports of degraded flood defenses, satellite data showing illegal deforestation near the property, or a tip that the insured ignored maintenance protocols.  
    - Non-Examples: "I feel the model is wrong" (gut); historical model errors (this is Caveat 2).  
  - **Action**:  
    - If **no direct evidence**, proceed to Step 3.  
    - If **direct evidence exists**:  
      1. Quantify its impact using expert judgment (e.g., "This evidence suggests a 2× risk multiplier").  
      2. Adjust probability: \( P_{\text{adjusted}} = P_{\text{model}} \times \text{multiplier} \).  
      3. **CU sign-off required**.  
  - **Stop & Handoff**: If adjustment is made, use \( P_{\text{adjusted}} \) and skip to Step 4. Otherwise, proceed.

  #### **Step 3: Check for Model Bias Override (Caveat 2) (20 mins)**
  - **Question**: *Is there **statistical proof** that the model undercalls/overcalls for **this specific risk class**?*  
    - Examples: The model consistently underestimates wildfires in *hillside developments with Mediterranean vegetation*; it overestimates flood risk for *steel-frame warehouses*.  
    - Non-Examples: "The model was wrong last year" (isolated event); gut feelings.  
  - **Action**:  
    1. **Review historical data** (last 5 years) for comparable accounts:  
       - Group risks by **identical peril (flood/wildfire) + geography + construction type**.  
       - Minimum group size: 5 accounts (or 5 years of data for a single account).  
    2. Calculate:  
       - Model’s average predicted loss probability for the group.  
       - Actual average loss frequency (losses per year ÷ number of years).  
    3. **Bias threshold**: If actual frequency exceeds model probability by >20% *relative difference* (e.g., model 4% vs. actual 5% → 25% relative increase), bias is confirmed.  
  - **Outcomes**:  
    - **No bias** or insufficient data: Keep \( P_{\text{model}} \); proceed to Step 4.  
    - **Bias confirmed**:  
      - Adjust probability: \( P_{\text{adjusted}} = P_{\text{model}} \times \frac{\text{actual frequency}}{\text{model probability}} \).  
      - **CU sign-off required**.  
  - **Stop & Handoff**: If adjustment is made, use \( P_{\text{adjusted}} \) and skip to Step 4.

  #### **Step 4: Account-Specific Override (Non-Statistical Judgment) (5–20 mins)**
  - **Question**: *Are there **material, non-quantified factors** unique to this account?*  
    - Examples: New zoning laws, atypical construction materials, or political risk (e.g., war disrupting fire response).  
    - Non-Examples: "My gut disagrees with the model"; factors already in the model.  
  - **Action**:  
    - If **no factors**, use probability from Step 1, 2, or 3.  
    - If **factors exist**:  
      1. Assign a probability range (e.g., 8–12%) based on expert consensus.  
      2. **CU sign-off required** to use this range.  
  - **Output**: Final probability for pricing.  

  ---

  ### **Run Through Your Three Scenarios**
  #### **1. Riverside Warehouse (Model: 2%, Gut: 10%)**
  - **Step 1**: Baseline \( P_{\text{model}} = 2\% \).  
  - **Step 2**: No direct evidence (no tips about this warehouse). → Proceed.  
  - **Step 3**: Check bias for "flood risk in steel-frame warehouses near major rivers":  
    - Historical group: 10 comparable warehouses.  
    - Model average: 2.1%. Actual frequency: 2.3% (relative difference: 9.5% < 20%).  
    → **No bias**. Keep 2%.  
  - **Step 4**: No atypical factors (e.g., standard construction). → **Final: 2%**.  
  - **Why gut is overruled**: No evidence meets Caveat 1 or 2. Gut feeling is not an override.

  #### **2. Hillside Subdivision (Model: 4%, Model Undercalled for 5 Years)**
  - **Step 1**: Baseline \( P_{\text{model}} = 4\% \).  
  - **Step 2**: No direct evidence. → Proceed.  
  - **Step 3**: Check bias for "wildfire risk in hillside subdivisions with chaparral vegetation":  
    - Historical group: 8 comparable subdivisions (including this one over 5 years).  
    - Model average: 4.0%. Actual frequency: 6.0% (relative difference: 50% > 20%).  
    → **Bias confirmed**. Adjust: \( P_{\text{adjusted}} = 4\% \times \frac{6.0\%}{4.0\%} = 6.0\% \).  
    → **CU sign-off required**.  
  - **Step 4**: No new factors. → **Final: 6.0%**.  
  - **Why model is overruled**: Caveat 2 applies (proven bias). Gut was right directionally, but the adjustment is data-driven.

  #### **3. Brand New Risk (No History)**
  - **Step 1**: Baseline \( P_{\text{model}} = \) (e.g., 3%).  
  - **Step 2**: No direct evidence (new risk). → Proceed.  
  - **Step 3**: **Insufficient data** for bias check (no comparable accounts). → Keep 3%.  
  - **Step 4**: Unique factors?  
    - Example: Novel construction method. Underwriters assign range: 2–5%.  
    → **CU sign-off required** to use 2–5% range.  
  - **Final**: If no factors, 3%; else, underwriter/CU-agreed range.  
  - **Why judgment enters here**: New risks force reliance on expert consensus (Step 4), not gut vs. model.

  ---

  ### **What This Procedure Can’t Do**
  1. **Fix bad models**: If the model is fundamentally flawed (e.g., wrong peril physics), this flags bias but won’t correct it. Escalate to model developers.  
  2. **Handle correlated risks**: Portfolio-level clustering (e.g., all risks in one floodplain) isn’t addressed. Needs separate aggregate modeling.  
  3. **Quantify black swans**: For very low-probability events (<1%), historical data is too sparse for bias checks (Step 3 fails).  
  4. **Replace deep expertise**: Complex risks (e.g., climate change trends) require specialist input beyond the CU.  
  5. **Resolve subjective disputes**: If CU and you disagree on Step 4, it becomes a business decision (not actuarial).  

  ---

  ### **Key Outputs per Account**
  - **Audit Trail**: Completed checklist with Step 2–4 justifications.  
  - **CU Sign-Off Points**: Steps 2 (direct evidence), 3 (bias adjustment), 4 (judgment override).  
  - **Final Price**: Based on the procedure’s output probability + standard loading.  

  This balances philosophy ("defer to chance") with practicality (override only with evidence). It forces gut feelings into structured overrides, protecting against both model worship and recklessness.
