prompt: |-
  I'm a second-year PhD student and I sit in on a social ontology reading group where we've just done Lewis on convention, and I keep noticing that my gut about what counts as a convention doesnt match the official machinery (regularity; everyone expects everyone else to conform; everyone prefers to conform given that the others do; common knowledge of all that; and — the clause I always forget — the thing has to be arbitrary, i.e. some other regularity would've solved the same problem just as well). So I want to just dump my verdicts on a pile of cases and have you find the principle behind them, even if it means one of the verdicts has to go.

  Where I land: driving on the right — convention. Shaking hands instead of bowing — convention. 'Dog' meaning dog in English — convention. Dollars as money — convention. QWERTY — convention, and the fact that a different layout would've been fine is exactly why it feels conventional to me. Wearing a seatbelt — not a convention; I'd wear it whoever else did or didn't, so it's just a thing we all happen to do. Putting the bins out on Tuesday because that's when the truck comes — not a convention, same flavour of reason: nobody's choice depends on anybody else's. Everyone crossing the common by the one dry path in the wet season — not a convention, there's no alternative so where's the arbitrariness. Now the trouble. (a) A village where everyone fasts on the same arbitrary day each year and everyone knows everyone else does, but each person's reason for fasting is personal — they'd fast whether or not anyone else did. I want to call that a convention. (b) A lab where everyone uses the same clumsy in-house acronym for a machine, a word nobody would've coined but that everyone uses because it's the shared term — convention, I say. (c) A town where everyone privately dislikes a custom but assumes everyone else loves it, so everyone keeps it up — I also want to call that a convention, though I'm told the common-knowledge clause kills it. And (d), my actual sticking point: two monasteries both fast on an arbitrary day; in the first the monks fast because that's the done thing, in the second each monk hit on the same day by private revelation and would fast alone on a desert island. I keep flip-flopping on whether the second has a convention or just a coincidence of habits.

  So — is there one principle that gets all of this, maybe Lewis's with the coordination clause loosened or relocated, or maybe something else entirely? If it takes an ugly disjunction to save every verdict, is there a cleaner principle that just overturns one or two of mine, and which would you give up? And whatever you settle on, what does it say about a case I havent listed: a regularity everyone follows and expects everyone else to follow, that isn't arbitrary because it's the only thing that works?
reasoning: |-
  Okay, the user is a second-year PhD student in a social ontology reading group, grappling with David Lewis's definition of convention. They're struggling because their intuitive judgments about what counts as a convention don't always align with Lewis's criteria. Let me unpack their examples to understand the core issue.

  First, their intuitive verdicts: Driving on the right, shaking hands, "dog" meaning dog, dollars as money, and QWERTY are conventions. That makes sense—they involve coordination, mutual expectations, and arbitrariness. On the flip side, wearing seatbelts and putting bins out on Tuesday aren't conventions because individual actions don't depend on others. The dry path example lacks arbitrariness, so not a convention. 

  But then the tricky cases: (a) Village fasting on an arbitrary day for personal reasons—they call it convention. (b) Lab using a clumsy acronym because it's shared—convention. (c) Town upholding a disliked custom due to mistaken beliefs—convention, but Lewis's common knowledge might block it. (d) Two monasteries fasting: one by social practice, the other by private revelation. They're unsure about the second.

  The user's main challenge is reconciling their intuitions with Lewis's framework, especially the preference condition and common knowledge. They might be hinting at a deeper need: either refining Lewis's definition to include cases where coordination isn't intentional but emerges from shared practices, or finding an alternative principle that captures the social aspect they're sensing.

  For case (a), the fasting village, the user feels it's conventional because the regularity is arbitrary and known, even if individual motivations are personal. Lewis would exclude it because no preference for conformity based on others' actions. But the user might be emphasizing the social coordination aspect—the shared practice itself creates the convention, regardless of individual reasons.

  Case (b), the lab acronym, hinges on shared use driving conformity. Here, the preference to conform because others do is present, even if the term is clumsy. This fits Lewis if the expectation of others' use motivates continued use.

  Case (c), the disliked custom, fails Lewis's common knowledge since everyone mistakenly thinks others like it. The user wants it to be convention, suggesting that the mutual reinforcement (even if based on false beliefs) might suffice for them. This points to a possible gap in Lewis: conventions can exist without true common knowledge if there's mutual reinforcement in practice.

  Case (d) is key. The first monastery fits Lewis: monks fast because it's the done thing. The second, where each acts independently, lacks interdependence. The user's flip-flopping indicates tension between the appearance of convention and the lack of coordination. They might value the emergent social pattern over the underlying motivations.

  The user's deeper need could be to capture the social ontology aspect where conventions are patterns that facilitate coordination, even if not intentionally adopted. They might be seeking a framework that accounts for emergent norms, not just deliberate coordination problems. 

  Alternative approaches like Margaret Gilbert's joint commitment or Searle's collective intentionality might help, as they focus on shared practices as constitutive of social facts. Gilbert's plural subjects could explain the fasting village: even without interdependent preferences, the shared practice creates a collective commitment. Similarly, the lab acronym becomes a shared artifact maintained by group use.

  For the disliked custom, Gilbert's theory allows conventions based on mutual acceptance, even if privately disliked. The common practice sustains the norm. The second monastery's private revelation case wouldn't be a convention under any theory since there's no social interdependence—just coincidental individual actions.

  The user might need to give up calling the private fasting a convention. The arbitrariness and regularity are there, but without coordination, it's just a coincidence. Explaining why the other cases still hold under a broader social ontology framework could satisfy their intuition. 

  The non-arbitrary regularity case (only one thing works) would be a norm or rule but not a convention, as Lewis requires alternatives. This aligns with the user's dry path example.

  In conclusion, the user's principle might be: "A convention is a socially sustained arbitrary pattern that coordinates group behavior, regardless of individual motives or true common knowledge." This leans more towards Gilbert's collective acceptance over Lewis's game-theoretic focus. They'd need to accept that the second monastery isn't a convention and perhaps relax the preference condition to include cases where the social practice itself motivates conformity indirectly.
answer: |-
  Your intuitions reveal a deeper insight about social coordination that Lewis's definition might underemphasize: **conventions are fundamentally about *socially sustained patterns of behavior* that resolve ambiguity in collective life, regardless of individual motivations.** Lewis prioritizes *interdependent expectations* (the game-theoretic "preference to conform if others do"), but your cases suggest conventions can emerge from *shared practice alone* when it creates a focal point for coordination. Here's a unified principle derived from your verdicts:

  ### The Principle:  
  **A convention is an *arbitrary, socially reinforced regularity* that coordinates behavior within a group, where the pattern persists because individuals recognize it as *the group's established way* of handling an indeterminate situation.**

  This modifies Lewis by:  
  - Demoting "preference for conformity" from a *motive* to a *structural feature* (the pattern *functions* as a coordination device)  
  - Relaxing "common knowledge" to *mutual recognition of the pattern*  
  - Emphasizing the *social scaffolding* of the regularity  

  ---

  ### Applying the Principle to Your Cases:
  1. **Driving on the right, shaking hands, "dog", dollars, QWERTY**:  
     ✓ **Convention** (Arbitrary patterns reinforced by social use; alternatives exist).  
     *Lewis agrees.*

  2. **Seatbelts, bins on Tuesday**:  
     ✗ **Not convention** (No arbitrariness or coordination dependence; individual reasons suffice).  
     *Lewis agrees.*  

  3. **Dry path**:  
     ✗ **Not convention** (No alternatives → not arbitrary).  
     *Lewis agrees.*  

  4. **Village fasting (personal reasons)**:  
     ✓ **CONVENTION** (Arbitrary day; mutual awareness creates a *de facto* coordination point. Even if each would fast alone, the *shared timing* resolves ambiguity about *when* to fast collectively).  
     *Lewis says no* (no preference for conformity). **Your verdict stands.**  

  5. **Clumsy lab acronym**:  
     ✓ **CONVENTION** (Arbitrary term; everyone uses it *because it's the shared term*, making it a coordination tool. The "clumsiness" highlights arbitrariness).  
     *Lewis likely agrees* (preference for conformity via linguistic coordination).  

  6. **Disliked custom**:  
     ✓ **CONVENTION** (The mutual reinforcement sustains it → socially functional despite false beliefs).  
     *Lewis says no* (common knowledge fails). **Your verdict stands.**  

  7. **Monasteries**:  
     - **First monastery**: ✓ **Convention** (Done for social reasons).  
     - **Second monastery**: ✗ **Not convention** (Coincidental regularity; no social reinforcement. If a monk switched days, others wouldn’t care → no coordination pressure).  
     *Your flip-flop resolves against convention here.*  

  ---

  ### Why Overturn the Second Monastery?
  - **The key is interdependence**: In the first monastery, if one monk fasted on Wednesday, others might pressure them or question their piety. In the second, private revelation means the regularity is *epiphenomenal*—it doesn’t *do* social work.  
  - **Analogy**: Everyone in a city independently deciding to use umbrellas in rain isn’t convention; everyone using *black* umbrellas because "that’s what we do" is.  

  ---

  ### Your Unlisted Case:  
  *"A regularity everyone follows and expects others to follow, but it’s the only thing that works"*  
  - ✗ **Not convention** (No arbitrariness → fails the core criterion).  
    - *Example*: Everyone avoids a collapsing bridge (only rational choice).  
    - *Lewis agrees*: Conventions require alternatives.  

  ---

  ### Is This an "Ugly Disjunction"?  
  Not quite. The principle above covers all cases cleanly *except* the disliked custom, which requires a slight tweak:  
  > **Addendum for false beliefs**: If a pattern is *treated as* a coordination device by the group (via mutual reinforcement), it can be convention *even with mistaken common knowledge*.  

  This preserves your intuitions while only sacrificing the second monastery—a small cost since it’s essentially coincidental.  

  ---

  ### Philosophical Alternatives:  
  If rejecting the second monastery feels wrong, consider these frameworks:  
  1. **Margaret Gilbert's *Joint Commitment***: Conventions arise from collective acceptance ("we fast on Tuesday"). Solves fasting village + disliked custom.  
  2. **Searle's *Status Functions***: Conventions assign symbolic status (e.g., "this paper counts as money"). Explains dollars/language but not fasting.  
  3. **Bicchieri's *Social Norms***: Splits conventions (arbitrary) from norms (e.g., seatbelts). Saves all but disliked custom.  

  **Recommendation**: Stick with your principle (modified Lewis + Gilbert-esque recognition). It captures the *social ontology* spirit: conventions are **collective solutions to coordination problems**, whether chosen or emergent. The second monastery is the outlier—a regularity lacking social glue.
