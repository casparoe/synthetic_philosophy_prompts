answer: |-
  ### Exam Question (99 words)
  **Apply Goodman's new riddle of induction to these emerald predicates, all observationally identical to "green" so far:**
  - **(a) Grue**: Green if first examined ≤2100, blue if >2100  
  - **(b) Meridigrue**: Green if found north of equator, blue if south  
  - **(c) Retrogrue**: Blue if first examined ≤2020, green if >2020  

  **For (b) and (c):**  
  1. Does the standard "entrenchment" solution (favoring "green") correctly resolve the paradox?  
  2. Does either case show that the riddle isn’t fundamentally about time or "weird" predicates?  
  3. Explain why one is empirically testable *now* while another isn’t, and what this reveals about the circularity charge against entrenchment.  

  ---

  ### Model Answer (548 words)  
  **For (b) Meridigrue:**  
  The entrenchment solution correctly resolves this case. "Green" is entrenched; "meridigrue" is unnatural. But crucially, *meridigrue is empirically testable today*: We can examine emeralds south of the equator now. If we find a green emerald there, meridigrue is falsified without waiting for future evidence. This shows meridigrue isn’t paradoxical—it’s a disconfirmed spatial hypothesis masquerading as an inductive rival. Entrenchment works here because the predicate’s differential condition (hemisphere) is accessible.  

  **For (c) Retrogrue:**  
  Entrenchment technically gives the "right" verdict (reject retrogrue), but for the *wrong reason*. Retrogrue claims all emeralds examined before 2020 are blue—which contradicts our actual past observations of green emeralds. Unlike grue (which agrees with past data and diverges later), retrogrue **conflicts with existing evidence**: if an emerald was examined pre-2020 and was green, retrogrue is false *by definition*. Thus, it’s not a genuine paradox—it’s already falsified. Calling this "entrenchment" is misleading; it’s direct empirical rejection.  

  **Circularity and the Core Issue:**  
  Meridigrue shows the riddle isn’t inherently about *time*; it’s about **differential dependencies on inaccessible properties**. Grue’s reference to future examination dates makes its key condition untestable until 2100, forcing a choice between hypotheses with identical current support. Meridigrue’s dependency (hemisphere) is testable now, collapsing the paradox. Retrogrue reveals that predicates referencing *past* examination dates aren’t paradoxical if they conflict with observed data—they’re just false.  

  This exposes entrenchment’s circularity: We privilege "green" because it doesn’t reference hidden variables (time/location), but this assumes *which properties are epistemically accessible*. Entrenchment is circular if presented as justification ("use green because it’s standard"), but defensible as pragmatism: entrenched predicates track properties we can *actually check* (like color-now, not color-at-future-date). Retrogrue fails because it violates current evidence, not because "green" is entrenched. The riddle’s core is **projecting predicates with testable vs. untestable dependencies**, not mere "weirdness".  

  ---

  ### Marking Scheme (5 points, 4 marks each)  
  1. **Meridigrue Testability**: Correctly identifies that meridigrue can be falsified *now* by checking emeralds south of the equator, distinguishing it from grue’s future-dependent paradox.  
  2. **Retrogrue’s Past Conflict**: States that retrogrue is *already falsified* by pre-2020 observations of green emeralds (making it non-paradoxical), unlike grue.  
  3. **Entrenchment Assessment**: For meridigrue, affirms entrenchment works; for retrogrue, notes entrenchment is redundant (rejection is empirical, not inductive).  
  4. **Circularity Confrontation**: Acknowledges entrenchment appears circular but argues it pragmatically tracks *epistemic accessibility* (e.g., testing hemispheres now vs. future dates).  
  5. **Core Insight**: Identifies that the riddle hinges on *dependencies on untestable conditions* (e.g., future time) vs. testable ones (space/past time), not time itself or superficial "weirdness".  

  ---

  ### Common Mistakes (costing 4 marks per point)  
  1. **Misses Meridigrue Testability**: Claims meridigrue is equally paradoxical as grue, ignoring that hemisphere is verifiable *now*.  
  2. **Ignores Retrogrue’s Falsification**: Treats retrogrue as a live paradox like grue, missing its conflict with past data ("blue if examined pre-2020" is false given green observations).  
  3. **Misapplies Entrenchment**: Uses entrenchment uncritically for retrogrue without noting it’s empirically falsified, or claims entrenchment fails for meridigrue.  
  4. **Handwaves Circularity**: Only notes "entrenchment is circular" without engaging how testability (e.g., hemispheres) offers a pragmatic defense.  
  5. **Superficial Diagnosis**: Attributes the difference to "grue is about time" without specifying *why* time matters (inaccessibility of future conditions).  

  ---
  ### Design Notes  
  - **Retrogrue’s Trap**: Students often miss that its definition contradicts past evidence, exposing memorization without scrutiny.  
  - **Circularity Pivot**: Forcing engagement with testability (not just "tradition") reframes entrenchment as pragmatic epistemology.  
  - **Level Fit**: Assumes familiarity with grue, so meridigrue/retrogrue variations push them to generalize the machinery beyond stock examples.  
  - **No Citations**: Model answer uses only Goodman’s core concepts (entrenchment, projectibility) without secondary sources.
