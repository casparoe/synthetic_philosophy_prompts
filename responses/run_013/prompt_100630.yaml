prompt: |-
  I retired from a career in genetics about two years ago, and with no more field seasons to run I've been reading alot of philosophy and poking around in a few online discussion groups. One thing keeps coming up and it's been bugging me: people will say something like 'memes are just the genes of culture' or 'culture evolves by natural selection the same way genes do', and then act as if that settles whatever they were arguing about. Having spent forty years actually doing genetics, my instinct is that most of the time they're saying something far thinner than they think, or something that's just wrong, but I can never pin down which.

  So here's what I want: take that one-liner -- memes are the genes of culture, culture evolves like genes do -- and lay out all the different precise claims it could be making, all the way from the nearly vacuous to the genuinely radical. I want the menu, not one reading explained. For each one, tell me whether it's trivial, substantive but defensible, or flatly false, and say which reading the people who say it in a casual argument are usually reaching for.

  Two things I keep stumbling over, please fold them in where they belong: (a) whether cultural inheritance being blending-ish and sort of Lamarckian (you pick things up from others and then pass on what you picked up) really breaks the strict Darwinian analogy, and (b) whether defining a meme as 'whatever manages to spread' makes the whole selection story circular. I dont need citations or reading lists, just the logic sorted out.
reasoning: |-
  Okay, the user is a retired geneticist with 40 years of experience. They're frustrated with people using the "memes are like genes" analogy to oversimplify cultural evolution. They want a breakdown of all possible interpretations of that statement, from trivial to radical, with assessments of each. They also specifically want two issues addressed: blending/Lamarckian inheritance and circularity in defining memes.

  First, I need to map out the spectrum of interpretations. The trivial end would be "change happens" - that's almost meaningless. Then there's the structural analogy level where people borrow terms like mutation/selection but without rigor. The intermediate claims get more substantive but face challenges with cultural traits being hard to define and inheritance being non-Mendelian. The radical end would claim identical mechanisms, which is clearly false.

  The Lamarckian/blending issue is crucial. Unlike genes, cultural traits can be acquired and modified during life and passed on - that's a major deviation from biological evolution. Also, if memes are defined by their spread ("whatever spreads is a meme"), that creates circularity when claiming selection explains their spread.

  I should organize this as a continuum with clear thresholds. For each interpretation, I'll note: what's being claimed, how defensible it is, and what casual arguers probably mean. The geneticist will appreciate precise distinctions between levels.

  The user's deeper need seems to be arming themselves against shallow analogies. They want the logical toolkit to dissect these claims, not just a rebuttal. By showing the whole spectrum - especially the problematic middle where most arguments live - I can help them pinpoint why certain usages feel unsatisfying.

  I'll end by emphasizing that the most common usage (level 3-4) borrows biology's prestige while dodging its rigor, which is exactly what irks a practicing scientist. The circularity and inheritance issues are where these analogies usually collapse under scrutiny.
answer: |-
  Here's a breakdown of the "memes are the genes of culture / culture evolves like genes" claim, structured along a spectrum from trivial to radical, incorporating your specific concerns about blending/Lamarckian inheritance and circularity:

  | **Level** | **Core Claim** | **Defensibility** | **Common Casual Usage?** | **Handles Blending/Lamarck?** | **Circularity Risk?** |
  |-----------|----------------|-------------------|--------------------------|--------------------------------|------------------------|
  | **1. Trivial Change** | Cultures change over time | Trivial/True | Rarely | N/A | No |
  | **2. Structural Analogy** | Cultural change has variation, inheritance, selection | Mostly True | Sometimes | Handled superficially | Low |
  | **3. Unit-Based Evolution** | Cultural evolution requires discrete "memes" | Substantive/Problematic | Very Often | Breaks analogy | High |
  | **4. Selection-Dominant** | Cultural change is *primarily* driven by selection | Substantive/Overstated | Most Common | Ignores problems | Moderate |
  | **5. Formal Identity** | Cultural evolution follows *identical* rules to genetics | False | Rarely | Completely breaks | N/A |

  **Detailed Breakdown:**

  1.  **The Trivial Change Claim:**
      *   **Claim:** "Culture changes over time." Genes also change over time (mutation, drift), so *in this extremely broad sense*, both systems "evolve" meaning "change."
      *   **Defensibility:** **Trivial/True.** It's almost vacuous. Any dynamic system changes.
      *   **Casual Reach:** Rarely the *intended* point, though it's the only universally true part. Used when someone wants to sound profound but hasn't thought deeper.
      *   **(a) Blending/Lamarckian:** Irrelevant at this level.
      *   **(b) Circularity:** Not an issue here.

  2.  **The Structural Analogy Claim:**
      *   **Claim:** "Cultural change involves mechanisms *analogous* to variation, inheritance, and differential selection." Ideas vary (mutations, recombinations), are passed on (learning/teaching), and some spread more effectively (due to appeal, utility, coercion) than others.
      *   **Defensibility:** **Substantive and Mostly Defensible (but thin).** This captures a high-level similarity in the abstract components needed for *any* evolutionary process (variation, inheritance, selection). It's the core of Dawkins' original meme concept.
      *   **Casual Reach:** **Common.** This is often the *starting point* people intend – highlighting that cultural change isn't purely random or purely designed, but involves selective retention.
      *   **(a) Blending/Lamarckian:** Often hand-waved. Proponents argue the *structure* (V-I-S) holds even if inheritance isn't particulate or is Lamarckian. Critics argue these differences fundamentally alter the dynamics, making the analogy weak (e.g., blending erodes variation fast, Lamarckian inheritance allows directed "mutations").
      *   **(b) Circularity:** Low risk here. Memes can be defined *provisionally* (e.g., "a catchy tune", "a religious ritual") without *solely* referencing their success.

  3.  **The Unit-Based Evolution Claim:**
      *   **Claim:** "Cultural evolution requires discrete, gene-like units (memes) that are faithfully replicated with variation, upon which selection acts." Memes are the *atoms* of culture, copied (imperfectly) from brain to brain.
      *   **Defensibility:** **Substantive but Highly Problematic.** This is where the analogy gets shaky. Identifying discrete, faithfully replicating cultural "units" is notoriously difficult (is a "meme" a whole song, a chorus, a chord progression, a lyrical theme?). Cultural transmission involves constant reconstruction, blending, and transformation, not faithful copying.
      *   **Casual Reach:** **Very Often.** This is frequently *implied* when people say "memes are the genes of culture." They envision discrete ideas jumping from mind to mind.
      *   **(a) Blending/Lamarckian:** **Breaks the Analogy.** Faithful replication of discrete units is fundamental to genetic evolution. Blending inheritance (common in culture: e.g., merging musical styles) and Lamarckian inheritance (intentional modification *during* transmission: e.g., improving a recipe before teaching it) violate this core genetic principle. This makes the "gene-like unit" claim weak.
      *   **(b) Circularity:** **High Risk.** If a "meme" is defined purely as "whatever cultural element gets copied," then saying "selection explains which memes spread" becomes "selection explains which things that spread... spread." To avoid this, memes *must* be defined based on intrinsic properties *before* their spread is measured, which is incredibly difficult in practice for most cultural phenomena.

  4.  **The Selection-Dominant Mechanism Claim:**
      *   **Claim:** "Differential selection acting on variation is the *primary* or *only* important driver of cultural change, just like in genetic evolution." Random drift, directed mutation (intentional design), or pure transmission bias are minor factors.
      *   **Defensibility:** **Substantive but Often Overstated/False.** Selection *is* important in culture. However, cultural change is *also* driven heavily by:
          *   **Intentional Design:** Humans invent and modify things *purposefully*.
          *   **Drift:** Random fads or historical accidents.
          *   **Transmission Biases:** Things spread because they are easy to remember/convey, not necessarily because they are "fit" in a selective sense (e.g., sticky tunes).
          *   **Conformity Bias/Prestige Bias:** Copying the popular or the prestigious, regardless of intrinsic "fitness."
      *   **Casual Reach:** **Extremely Common (often the core intent).** This is the "settling the argument" move. It implies the outcome (e.g., a popular belief, a widespread technology) is "fit" because it won a Darwinian contest, justifying its existence or prevalence. It often smuggles in normative judgments ("this survived, therefore it's good/useful").
      *   **(a) Blending/Lamarckian:** **Exacerbates the Problem.** Intentional modification (Lamarckian) *is* a form of directed change, directly counter to the "selection is primary" claim. Blending makes tracking selective units even harder.
      *   **(b) Circularity:** **Moderate Risk.** If "fitness" is defined solely by what spreads, then "selection for fitness" becomes "selection for what is selected." Avoiding this requires an *independent* definition of cultural "fitness" (e.g., increases group cohesion, solves a problem) which is often contested or impossible to measure objectively.

  5.  **The Formal Identity Claim:**
      *   **Claim:** "Cultural evolution operates under *exactly the same mathematical rules and principles* as genetic evolution (e.g., replicator dynamics, Price equation)." Memes *are* genes in a different substrate.
      *   **Defensibility:** **Flatly False.** The differences in inheritance (non-particulate, Lamarckian, blending), variation generation (highly directed), unit definition (fuzzy), and selection mechanisms (complex biases, intentionality) mean the *dynamics* are fundamentally different. Population genetics models require heavy modification to apply to culture.
      *   **Casual Reach:** Rarely stated explicitly, but sometimes lurks underneath the most enthusiastic pronouncements. More common in formal memetics literature than casual chat.
      *   **(a) Blending/Lamarckian:** **Completely Breaks the Analogy.** Formal genetic models rely on particulate inheritance and Weismann's barrier (germline/soma separation). Culture inherently violates these.
      *   **(b) Circularity:** Still a risk if units/fitness aren't defined independently.

  **Conclusion & What Casual Arguers Usually Reach For:**

  *   **The Sweet Spot for Casual Use:** Levels 2 (Structural Analogy) and 4 (Selection-Dominant) are most common. People say "memes are the genes of culture" to imply: *"Hey, cultural stuff changes over time (Level 1), and importantly, it's not random or always designed – some ideas spread better because they're catchy/useful/sticky, and that selection-like process is crucial (Level 2). In fact, this selection is probably the main reason why some things are popular and others aren't (Level 4)."* This gives the argument an air of scientific inevitability ("survival of the fittest idea").
  *   **Why it Bugs You (Rightly So):** The leap from Level 2 (defensible analogy) to Level 4 (selection-dominant) is where the problems arise. It glosses over the critical differences you highlight:
      *   **(a) Inheritance:** The non-particulate, blending, Lamarckian nature of cultural transmission fundamentally alters the evolutionary dynamics compared to genetics, undermining the "just like genes" simplicity. Faithful replication is the exception, not the rule.
      *   **(b) Circularity:** Defining memes/fitness solely by spread makes the selection explanation tautological. Avoiding this requires robust, independent definitions that are usually lacking in casual discourse.
  *   **The Core Issue:** The analogy is often used **prematurely** as an *explanation* (Level 4 - "It spread because it was fitter") rather than as a *framework for asking questions* (Level 2 - *"How* do variation, inheritance, and selection operate in this specific cultural context?"). It mistakes a suggestive metaphor for a sufficient causal mechanism. Your genetics expertise rightly flags this oversimplification and the loss of crucial mechanistic detail inherent in the biological model they're trying to borrow.
