  3.  Rosalind argues the famous probability problem vanishes if you just realize it was never about physics – it’s about how a smart person *should bet* when they don't know which cosmic branch they'll land in. (It's a cheeky, elegant move, and half this room is nodding vigorously right now.)
  4.  My tiny, loving quibble? I worry her move makes the magic squared numbers *too* free – if *any* splitting story gave us probability rules, why do we *always* need quantum amplitudes specifically? Something physical feels unpaid.
