prompt: |-
  I've been going down a rabbit hole about why pain is bad, and I've hit a snag I can't get past on my own. There's this condition — asymbolia, I think it's called — where people with damage to a certain part of the brain will tell you quite calmly that yes, it hurts, quite badly, right there in their hand, but it doesn't bother them, they're not distressed by it and they're not especially fussed about it stopping. They can point at it, they can rate it as intense. And then there's the ordinary stuff that bothers me just as much: the exact same burning feeling is awful when you spill tea on yourself and is something people happily pay for when it's a chilli or a tattoo or a deep-tissue massage.

  So before I read any more about this I want the full spec first. What does any theory of why pain is bad actually have to get right? Give me the requirements list — the cases it has to handle (asymbolia, the chilli case, phantom limbs, animals and babies who can't tell us anything, the ache that's part of something you chose), the distinctions it isn't allowed to just collapse (pain versus suffering, being bad versus being minded, the sensation versus the aversion, how bad versus whether bad at all), and the facts about how pain actually works in the body and brain that it can't contradict — and for each one say why it's a genuine requirement and not just something one camp happens to care about. Then flag the pairs you reckon can't both be satisfied, because that's the bit I actually want. You can skip scoring the usual theories at the end, I'll do that myself.

  Start with the single requirement you'd keep if you could only keep one, in your first sentence, then the list, no preamble and don't restate the question back at me.
