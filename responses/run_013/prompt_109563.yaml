answer: |-
  The single requirement to keep above all others: **Any theory must account for *suffering* (distress/disvaluation) as the core bad-making feature of pain, distinct from mere sensation.**

  ### Requirements List  
  **Cases the Theory Must Handle:**  
  1. **Asymbolia:** Must explain why identical pain sensations lack badness without denying their sensory reality. *Why required:* Demonstrates sensation intensity ≠ suffering/badness.  
  2. **Chilli/Tattoo Contextual Valence:** Must resolve why identical sensations (e.g., burning) are bad in injury but neutral/good in chosen contexts. *Why required:* Proves badness isn’t intrinsic to the sensation.  
  3. **Phantom Limb Pain:** Must address suffering without ongoing tissue damage. *Why required:* Shows badness persists beyond nociceptive input.  
  4. **Non-Verbal Beings (Animals/Babies):** Must justify attributing badness without self-report. *Why required:* Avoids solipsism; ethical stakes demand inclusion.  
  5. **Chosen/Endured Pain (e.g., marathon aches):** Must explain why "bad" sensations are tolerated or sought. *Why required:* Reveals badness is overrideable by goals.  
  6. **Chronic Non-Adaptive Pain:** Must handle pain that serves no protective function. *Why required:* Counters theories tying badness solely to evolutionary utility.  

  **Distinctions the Theory Must Preserve:**  
  7. **Pain vs. Suffering:** Cannot collapse sensory *detection* (nociception) and affective *distress*. *Why required:* Asymbolia proves they dissociate neurologically.  
  8. **Sensation vs. Aversion:** Must separate the qualitative "feel" from motivational "wanting it to stop." *Why required:* Chili/tattoo cases show aversion is context-dependent.  
  9. **Badness vs. Being-Minded:** Must link badness to sentience without requiring complex cognition. *Why required:* Babies/animals suffer without meta-cognition.  
  10. **Degree vs. Existence of Badness:** Cannot conflate *how bad* pain is with *whether it is bad at all*. *Why required:* Asymbolia proves pain can exist without *any* badness.  

  **Biological Constraints the Theory Cannot Violate:**  
  11. **Nociception ≠ Pain:** Must respect spinal reflexes (e.g., withdrawal) without pain experience. *Why required:* Basic neurology shows sensation requires brain processing.  
  12. **Cortical Necessity:** Must acknowledge pain experience requires cortical integration (e.g., insula/cingulate). *Why required:* Asymbolia arises from specific brain lesions.  
  13. **Endogenous Modulation:** Must align with how stress/opioids can suppress suffering without blocking sensation. *Why required:* Neurobiology shows affect is pharmacologically separable.  

  ### Irreconcilable Tensions (Flags)  
  - **Intrinsic Badness vs. Chosen Pain:** If pain is *inherently* bad (Requirement #2), why seek chili/tattoos? If badness is *extrinsic*, what makes injury-pain objectively bad?  
  - **Suffering as Necessary vs. Asymbolia:** If suffering *defines* badness (Core Requirement), is asymbolia truly pain? But asymbolics report sensation accurately (Requirement #1).  
  - **Evolutionary Function vs. Phantom/Chronic Pain:** If badness exists to protect tissue (Requirement #6), why does pain persist without damage or become maladaptive?  
  - **Non-Verbal Suffering vs. Distinction Preservation:** Affirming animals suffer (Requirement #4) risks collapsing pain/suffering distinctions if they lack meta-cognition (Requirement #9).  

  These tensions expose fault lines in theories (e.g., representationalism struggles with asymbolia; evaluativism clashes with chosen pain). The specs force either redefining "pain" or accepting disunity in its badness.
