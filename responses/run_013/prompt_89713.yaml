prompt: |-
  A guy from my old meetup group, who I'd normally trust on this stuff since he's been reading LW longer than I have, wrote up a post on counterfactual mugging and XOR blackmail, and I want a second opinion before I just absorb his take. Here's the gist.

  Counterfactual mugging: Omega flips a coin. If it lands tails he shows up and asks you for $100. If it lands heads he hands you $10,000, but only if he predicted you'd hand over the $100 in the tails branch. So when he's asking, you already know it's tails, and the hundred bucks buys you nothing in this branch — it only matters through what Omega predicted about what you'd do here. CDT says refuse. The updateless crowd says pay, because what you're really choosing is a coin-independent policy, and 'pay when asked' is the policy that collects the $10k in the branch where the coin came up heads. My friend's read is that the only thing going for paying is that you could have precommitted beforehand, and since you can't precommit retroactively once Omega's flipped, CDT is just right and the puzzle is a trick about the psychology of commitment. He also says it's basically Newcomb's problem with a coin glued on, and that it's really a free will puzzle, since if Omega can predict you then your choice was already fixed.

  XOR blackmail: a perfect predictor writes to you that exactly one of these is true — you pay him $1000, or your house already has a termite infestation. Termites would cost a million to deal with. EDT pays, because paying is better news about the termites. CDT/FDT refuses, and gets a free warning in the case where the house actually is infested. My friend calls it blackmail and says the termite guy is running an insurance racket: pay a grand to buy off a million-dollar risk, or roll the dice on it. And his big takeaway is that acausal reasoning is one unified doctrine of paying up — if you one-box on Newcomb, you pay the mugger, you pay the termite guy, and thats how these predictors farm you.

  Which is where I get lost, because in the first case he says the acausal answer (pay) is wrong and in the second he says the acausal answer (refuse) is right, but then he claims acausal reasoning is all one thing. My gut says refuse in both cases too, which worries me that I'm just a CDT simp pattern-matching.

  How much of this actually holds up? Where's he fudging? What would someone who's thought hard about this wince at, and does his conclusion — mugging solved by CDT, acausal reasoning = always pay up — follow from the parts he got right? And do the two cases really point in opposite directions, or are they the same lesson after all?
reasoning: |-
  Okay, the user is grappling with some complex decision theory puzzles involving Counterfactual Mugging and XOR Blackmail. They're confused because their friend (an experienced LW reader) argues CDT is correct in both cases, while claiming "acausal reasoning" consistently recommends paying - but the actual acausal positions disagree on the two problems. 

  Hmm, the core tension is the friend's inconsistent characterization of acausal reasoning while arriving at conclusions that superficially match CDT. The user senses something's off but can't articulate it, and worries they're just biased toward CDT. Their meta-worry about "pattern-matching" shows good self-awareness.

  First, unpacking the friend's errors: 
  For Counterfactual Mugging, the friend misunderstands updatelessness as merely about precommitment. Actually, FDT/UDT agents don't just simulate precommitment - they optimize policies across branches simultaneously. The "free will" objection also misses the point: perfect prediction doesn't make choices illusory; it means your decision algorithm determines outcomes in multiple branches.

  For XOR Blackmail, the friend correctly identifies the insurance racket dynamic but wrongly conflates it with the mugging. The key difference is correlation structure: in mugging, paying helps the counterfactual head branch; in blackmail, paying is evidence of being in a safe world, not causal prevention. The friend's "acausal=always pay" claim collapses here since acausal reasoners refuse.

  The user's deeper need seems to be: "How do I navigate these puzzles without getting trapped in either CDT literalism or acausal cargo-culting?" They want principled distinctions. The answer lies in mapping the causal graphs: mugging involves branching with identity dependence (your policy affects other branches), blackmail has pure information asymmetry with no cross-branch influence.

  Also worth noting: the user's gut refusal in both cases isn't necessarily wrong - it's defensible if they value branch-local outcomes over cross-branch optimization. But they should recognize that position implies rejecting the core insight of UDT/FDT. No free lunch in decision theory!
answer: |-
  Let's unpack this carefully — your friend makes some defensible points but also serious conceptual errors, and his "acausal reasoning = always pay" conclusion is fundamentally mistaken. Here's where his analysis holds up and where it breaks:

  ### 1. **Counterfactual Mugging: Where He's Partially Right (But Mostly Wrong)**
     - **The CDT Defense**: He's correct that CDT rationally refuses *within the tails branch*. Once you know the coin is tails, paying $100 nets you -$100 with no local benefit. CDT *should* refuse here.
     - **Misunderstanding Updatelessness**: His claim that "only precommitment matters" misses the point. Updateless decision theories (UDT/FDT) **don't require literal precommitment**. They evaluate the *logical output of your decision algorithm* across all possible branches. When Omega asks for $100 in the tails branch, your choice reveals the policy your algorithm implements *in all branches*. Paying isn't about retroactive precommitment; it's about having an algorithm whose output (in the tails branch) satisfies the condition for winning in the heads branch.
     - **"Free Will" Red Herring**: Yes, Omega predicts you, but this doesn't make your choice "fixed" in a way that voids decision theory. The prediction is based on your *decision algorithm*. You're choosing *which algorithm to implement*.
     - **Newcomb Glue?** He's wrong that this is just "Newcomb with a coin." Newcomb tests self-referential prediction (your choice now affects Omega's past action). Mugging tests policy consistency across branches (your choice in one branch affects payoff in a counterfactual branch). **Crucial difference: In mugging, your action in *this* branch has no *causal* effect on the heads branch — it's purely about logical dependence via Omega's prediction of your policy.**

     **Why Paying is Correct (For UDT/FDT)**:  
     You select a function $f$(branch) → action.  
     - Option A: $f$(tails) = Pay → Get -$100 (tails) OR +$10,000 (heads)  
     - Option B: $f$(tails) = Refuse → Get $0 (tails) OR $0 (heads)  
     **Expected utility of policy "Pay":** $0.5 \times (-100) + 0.5 \times 10,000 = \$4,950$  
     **Expected utility of policy "Refuse":** $0.5 \times 0 + 0.5 \times 0 = \$0$  
     *Even though you know you're in tails when deciding, UDT/FDT chooses the policy with higher *overall* expected value.*

  ### 2. **XOR Blackmail: Where He's (Mostly) Right**
     - **EDT Pays, CDT/FDT Refuses**: He's correct. EDT conditions on the act: *"If I pay, it's more likely the blackmailer sent this only if I *don't* have termites!"* This is irrational because paying doesn't *cause* termites to disappear; it's purely correlated.
     - **The Insurance Racket Insight**: This is astute. The blackmailer exploits the correlation between your susceptibility to paying and the absence of termites. Paying is buying overpriced "insurance" against a risk that either exists or doesn't *regardless of your action*.
     - **Why Refusing is Correct**:  
       - If you have termites (prob = p), refusing costs you \$1M (for treatment) but you get a *free warning* (worth ≈\$1M since you can now treat it).  
       - If you don't have termites (prob = 1-p), refusing costs nothing.  
       - Paying costs \$1000 regardless, and doesn't prevent termites.  
       **Only if p is very high (>0.1%) does paying even *match* refusing**, and even then it relies on the blackmailer's accuracy. FDT refuses because your decision doesn't *cause* the termites to exist or not; it only reveals information.

  ### 3. **His Fatal Flaw: "Acausal Reasoning = Always Pay"**
     This is **objectively false** and shows a deep misunderstanding. Acausal reasoning (UDT/FDT) yields:
     - **Pay in Counterfactual Mugging** (as shown above).
     - **Refuse in XOR Blackmail** (because paying doesn't acausally prevent termites; it only correlates with their absence).
     
     **Why the difference?**  
     - In **Mugging**, your action in the *tails branch* acausally controls the payoff in the *heads branch* (via Omega's prediction of your policy).  
     - In **Blackmail**, your action *does not* acausally control whether termites exist. It only correlates with the blackmailer's message. There's no cross-branch dependency to exploit.  

     Your friend conflates *acausal influence* (mugging) with *evidential correlation* (blackmail). They are structurally distinct.

  ### 4. Where You Should "Wince"
     - **"Mugging is solved by CDT"**: CDT *is* consistent within the tails branch, but it fails globally by ignoring the counterfactual heads branch payoff. **Wince level: 😬**  
     - **"Acausal reasoning = always pay"**: Directly contradicted by FDT refusing in XOR blackmail. **Wince level: 😬😬😬**  
     - **"It's a free will puzzle"**: Misrepresents the core issue (policy consistency vs. metaphysical determinism). **Wince level: 😒**  
     - **"Glued-on coin for Newcomb"**: Ignores the key difference: Newcomb has one decision affecting a *past* action; Mugging has one decision affecting a *counterfactual* outcome. **Wince level: 😬**

  ### The Bottom Line
  - **Your gut (refuse both) is CDT-consistent** — but that doesn't make it *optimal* in the mugging. CDT wins locally in mugging but loses globally; FDT sacrifices locally to win globally.  
  - **The lessons are opposites**:  
    - **Mugging** teaches that *sometimes you should "pay" in a losing branch to win in a counterfactual branch* (acausal trade).  
    - **Blackmail** teaches that *you shouldn't "pay" just because an action is good news* (don't confuse evidence with control).  
  - **Your friend's core error**: He reduces all acausal reasoning to "paying up," missing that FDT/UDT *only* pays when the action acausally influences a better outcome elsewhere. In blackmail, no such influence exists.  

  **To answer directly**:  
  - His mugging analysis fudges updatelessness as mere "psychology of commitment."  
  - His blackmail analysis is mostly sound.  
  - His "acausal = always pay" is catastrophically wrong and undermines his conclusion.  
  - The cases point to *different* lessons: mugging rewards policy consistency, blackmail punishes mistaking correlation for control.  

  You're not a "CDT simp" — these are legitimately confusing! But recognizing the *structural difference* between the problems (acausal influence vs. evidential correlation) is key. FDT pays in mugging *specifically because* the tails-branch action affects the heads-branch payoff, while in blackmail, paying affects nothing but your wallet.
