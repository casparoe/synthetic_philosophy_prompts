  Below is a decision tree that organizes responses to the problem of logical omniscience, starting from the core commitment that an agent knows a proposition iff it holds in every world compatible with what they know. The tree is built from the logical space of positions, with branch nodes as questions that can be answered without prior knowledge of the outcomes. Each leaf position includes a brief analysis of the example case: an agent who explicitly believes every premise of a valid argument but has never drawn the conclusion. Iterated knowledge (e.g., knowing that one knows) is addressed where relevant.

  ---

  ### **Decision Tree: Responses to Logical Omniscience**

  #### **Q1: Is logical omniscience (e.g., knowing all logical truths and consequences) an acceptable idealization?**
  - **Yes** → **Leaf 1: Accept the Idealization**  
    *Position*: The idealization is harmless for modeling rational agents; ignorance of consequences is a performance error, not a failure of the model.  
    *Example case*: The agent implicitly knows the conclusion. Failure to draw it reflects computational limits, not ignorance. Iterated knowledge bottoms out cleanly.  
    *Iterated knowledge*: Unproblematic; agents know what they know (e.g., \(K_a K_a \phi\) holds if \(K_a \phi\) does).

  - **No** → Proceed to Q2.

  #### **Q2: Is the problem an artifact of the possible-worlds modeling choice?**  
  *(i.e., is the model misrepresenting knowledge as "static" information states rather than cognitive processes?)*  
  - **Yes** → **Leaf 7: Deflationary View**  
    *Position*: The problem arises from conflating the model’s formalism with psychology. Possible worlds track objective information availability, not subjective belief.  
    *Example case*: The agent has "access" to the conclusion (it’s true in all worlds she rules out), but doesn’t psychologically believe it. The model isn’t flawed—it’s being misapplied.  
    *Iterated knowledge*: \(K_a K_a \phi\) reduces to \(K_a \phi\); no regress because the model doesn’t require cognitive introspection.

  - **No** → Proceed to Q3.

  #### **Q3: Should we retain the possible-worlds framework?**  
  - **No** → **Leaf 5: Procedural/Resource-Bounded Account**  
    *Position*: Knowledge requires explicit computation (e.g., proofs/algorithms). Knowing is a process consuming time, memory, or attention; closure fails under resource constraints.  
    *Example case*: The agent doesn’t know the conclusion—she hasn’t performed the computation. Explicit premises are "known" only as inputs, not as integrated truths.  
    *Iterated knowledge*: Rarely bottoms out; knowing that one knows requires additional costly computations.

  - **Yes** → Proceed to Q4.

  #### **Q4: Do we allow impossible/non-normal worlds?**  
  *(Worlds where logical truths may fail)*  
  - **Yes** → **Leaf 3: Impossible-Worlds Semantics**  
    *Position*: Agents can consider logically impossible worlds possible, so logical truths aren’t automatically known. Knowledge is closed under a weaker logic.  
    *Example case*: The agent doesn’t know the conclusion—an impossible world where premises hold but conclusion fails is accessible.  
    *Iterated knowledge*: Problematic; impossible worlds may violate introspection axioms (e.g., \(K_a \phi \not\rightarrow K_a K_a \phi\)).

  - **No** → Proceed to Q5.

  #### **Q5: Do we add an awareness-like primitive?**  
  *(Separate from truth, tracking "access" to propositions)*  
  - **Yes** → **Leaf 2: Awareness-Based Account**  
    *Position*: Knowledge requires (i) truth in all accessible worlds and (ii) awareness of the proposition. Awareness is a syntactic or conceptual constraint.  
    *Example case*: The agent is aware of each premise but not the conclusion, so she doesn’t know it. Awareness may evolve dynamically.  
    *Iterated knowledge*: \(K_a K_a \phi\) fails if the agent isn’t aware of \(K_a \phi\); introspection is limited by awareness.

  - **No** → Proceed to Q6.

  #### **Q6: Do we restrict closure to relevant consequences?**  
  *(Not all logical entailments are "relevant" to the agent)*  
  - **Yes** → **Leaf 4: Relevance-Based Account**  
    *Position*: Knowledge is closed under relevant implication (e.g., using relevance logic). Irrelevant consequences (e.g., distant theorems) aren’t required.  
    *Example case*: The agent doesn’t know the conclusion if its derivation isn’t relevant (e.g., the conclusion is trivial or unrelated to her goals).  
    *Iterated knowledge*: May fail if self-attribution isn’t relevant; \(K_a \phi \not\rightarrow K_a K_a \phi\) is possible.

  - **No** → Proceed to Q7.

  #### **Q7: Do we fragment the agent’s mind?**  
  *(Knowledge is distributed across isolated subdomains)*  
  - **Yes** → **Leaf 6: Fragmented-Mind Account**  
    *Position*: The mind isn’t integrated; knowledge is partitioned into fragments (e.g., contexts, modules) with local closure but no global closure.  
    *Example case*: Premises are in separate fragments, so the agent hasn’t "combined" them to draw the conclusion. She doesn’t know it globally.  
    *Iterated knowledge*: Highly constrained; agents may know \(\phi\) in one fragment but lack introspective access from another.

  - **No** → **Unexplored Branch**  
    *Status*: Coherent but unattractive. Without awareness, impossible worlds, relevance, or fragmentation, the framework lacks tools to block closure.  

  ---

  ### **Notes on the Tree**
  1. **Unexplored Branch** (Q7 → No):  
     This branch rejects all major fixes while denying logical omniscience. It is empty because it offers no mechanism to avoid closure—likely incoherent or redundant with Leaf 1 (if closure is accepted) or Leaf 7 (if modeling is rejected).

  2. **Non-Branching Paths**:  
     - **Leaf 5** (Procedural) and **Leaf 6** (Fragmented) are separable:  
       - Leaf 5 abandons possible worlds entirely; Leaf 6 modifies it.  
       - Fragmentation could be implemented procedurally (e.g., fragments as isolated processes), but the tree prioritizes the core distinction: procedural accounts focus on *computation*, fragmentation on *structure*.

  3. **Example-Case Consistency**:  
     All "No to Q1" leaves except Leaf 7 deny that the agent knows the conclusion in the example. Leaf 7 reinterprets "knowledge" as information availability.

  4. **Iterated Knowledge**:  
     - Bottoms out cleanly in **Leaf 1** (idealization) and **Leaf 7** (deflation).  
     - Fails or is constrained in others due to awareness limits (**Leaf 2**), resource costs (**Leaf 5**), fragmentation (**Leaf 6**), or impossible worlds (**Leaf 3**).  
     - **Leaf 4** (relevance) and **Leaf 3** (impossible worlds) may allow partial introspection but lack guarantees.

  5. **Omitted Distinctions**:  
     - *Object of knowledge (proposition vs. formula)*: Embedded in Leaf 2 (awareness) and Leaf 5 (procedural).  
     - *State vs. process*: Central to Leaf 5; others treat knowledge as state-like.  
     - *Deductive closure as requirement/defect*: Explicit in Q1 and all leaves.

