prompt: |-
  I lead the engineering team behind a digital advance-care-planning tool, and in three weeks I am presenting to the clinical ethics committee of the hospital trust we work with. I am a software engineer by training: no medical degree, no law degree, no philosophy degree. I want to walk in ready for the questions this particular room will actually ask, not the ones a room full of engineers would ask.

  Act as a philosopher who works in clinical ethics — someone who regularly sits on committees like this one, knows the literature on autonomy, personal identity and decision-making for people who have lost capacity, and is practised at putting it into plain language for non-specialists. Before you draft anything, think carefully and start by brainstorming: write a short list of what each member of this committee is likely to believe, what they are afraid of, and what each of them would count as a decisive objection. Build the prep sheet from that list. Explain any piece of philosophical or legal vocabulary the first time you use it, in a clause, the way you would explain it to me.

  My argument, in two parts.

  First, the substantive claim. An advance directive made by someone with capacity should normally govern their care after they lose it, even when the person they become would now say otherwise. I do not rest this on the idea that the earlier person and the later person are literally the same agent; I rest it on the idea that the earlier person was entitled to set the terms of a risk they were certain to run, and that the later person's contrary preference only has authority if it is a revision of the earlier person's reasons rather than a loss of the capacity to grasp them. If it is the latter, I want to say that the later preference is not an exercise of autonomy at all and should not displace the directive.

  Second, the mechanism my team has built into the product, which is the part of the talk the committee will really be judging. The tool (a) records the directive as a versioned document, so that any change of mind shows up as a change with a date attached; (b) requires the user to nominate an interpreter, a person authorised to say what the directive means in situations the user did not foresee; (c) sets checkpoints, so that a directive lapses unless the user reaffirms it while they still have capacity, at intervals the user chooses; and (d) applies a test I call the revision/erosion test before allowing a later preference to override a directive.

  The audience, as precisely as I can describe it:

  - the chair, a palliative care consultant who has watched families fight over exactly this and who thinks documents are a way of avoiding the conversation that actually matters;
  - a geriatric psychiatrist who has spent thirty years with people in moderate and severe dementia and who is, I expect, sceptical that someone who can no longer grasp their own earlier reasons is being done any favour by being held to them;
  - a clinical ethicist with a philosophy background who will press the difference between the interests a person has in the shape of their life as a whole and the interests they have in comfort and company here and now, and who will ask me which of the two my tool is really protecting;
  - a solicitor from the trust's legal team, who will care about who is liable when the interpreter and the clinical team disagree, and about whether a lapsed checkpoint leaves us exposed;
  - a lay member, a former carer, who I suspect will speak for the person in the bed and ask why the person in front of us does not get a vote;
  - and a junior doctor who will ask what happens at three in the morning on a ward when nobody can reach the interpreter.

  Assume they are all competent, sceptical and short of time; assume two of them have already decided against me.

  What I want from you is a Q&A prep sheet, not a defence of my position:

  1. Order the objections by how much damage they would do to my proposal in this room, weighing both how likely each is and how hard it would be to answer. Say in one line, for each, why it lands where it does.
  2. Phrase each objection the way the person who would raise it would actually phrase it — the consultant's version should sound like the consultant, the lawyer's like the lawyer.
  3. For each, give me a reply I can deliver in about two minutes, in the first person, with the concession, if any, built into the first sentence.
  4. After each reply, add a short note on where it is soft: the follow-up I should expect, and the point at which I should stop arguing and concede rather than keep digging.
  5. Tell me what I should concede in my opening two minutes, before anyone asks, and why conceding it early helps me.
  6. Name the single objection that has to be answered well for the proposal to survive at all.
  7. Finish with the question I am hoping nobody asks, and a brief note on what I would say if it comes anyway.

  Do not give me a reading list, citations or references: I have no web access and cannot check them, so I would rather have a well-reasoned answer than a title I cannot find. Write in British English throughout.
reasoning: |-
  Okay, the user is an engineer leading a team that built a digital advance-care-planning tool. They're presenting to a clinical ethics committee in three weeks and need help preparing for tough questions. I need to step into the role of a clinical ethics philosopher to guide them effectively.

  First, I should understand the user's position. They're a software engineer without medical, legal, or philosophy training, so I'll avoid jargon and explain any complex terms in simple clauses. Their main argument has two parts: a substantive claim about honoring advance directives even when the later self disagrees, and their tool's features like versioning, interpreters, checkpoints, and a revision/erosion test.

  The committee members each have specific concerns based on their backgrounds. Let me brainstorm what each might believe, fear, and see as deal-breakers:
  - The palliative care consultant (chair) fears documents replacing real conversations and values human connection over paperwork.
  - The geriatric psychiatrist worries about imposing past decisions on current dementia patients who can't comprehend their former reasons.
  - The clinical ethicist will probe whether the tool prioritizes life-shape interests over present well-being.
  - The solicitor will focus on liability risks from disagreements or lapsed checkpoints.
  - The lay member (former carer) will advocate for the current patient's voice being heard.
  - The junior doctor needs practical clarity about nighttime ward crises.

  I'll prioritize objections by potential damage: high-risk ones come first if they're both likely and hard to counter. The psychiatrist's autonomy concerns could sink the proposal if unanswered, so that's top. The ethicist's interest conflict is next, as it challenges the tool's core purpose. The chair's conversation-superseding fear follows, as it questions implementation ethics. The lawyer's liability points are urgent but technically fixable. The lay member's bedside perspective is emotionally resonant but surmountable. The junior doctor's operational issue is important but more about execution.

  For the prep sheet, I'll draft objections in each member's voice, then provide concise replies with built-in concessions. Each reply should take about two minutes, acknowledge valid points upfront, and end with where it might be soft—anticipating follow-ups. Early concessions should disarm critics; admitting the tool doesn't replace conversations could placate the chair immediately. The psychiatrist's objection about overriding current preferences is the make-or-break one; if that fails, the proposal likely dies. The nightmare question—about the risk of the system causing harm—must be met with honesty about safeguards and real-world limits.

  Throughout, I'll use British English and keep explanations accessible. The focus is on practical prep, not theoretical debates, so no citations needed—just clear reasoning they can deliver confidently.
answer: |-
  Here’s your Q&A prep sheet, structured for maximum impact in the room. I’ve prioritised objections based on **damage potential** (likelihood + difficulty to counter) and tailored replies to reflect the speakers’ professional perspectives.

  ---

  ### **1. Ordered Objections by Damage Potential**  
  *(Highest threat first: 1 = most damaging)*  

  1. **Geriatric Psychiatrist’s Autonomy Challenge**  
     *Why:* Directly attacks your core claim that binding the "later self" respects autonomy. If unconvincing, your entire premise collapses.  
  2. **Clinical Ethicist’s Interest Conflict**  
     *Why:* Forces you to defend *which* interests your tool prioritises – a philosophical trap that could paint you as ignoring current suffering.  
  3. **Chair’s "Documents vs. Conversations" Concern**  
     *Why:* Undermines the tool’s real-world value. If seen as displacing human engagement, even supporters may reject it.  
  4. **Solicitor’s Liability on Lapsed Checkpoints/Interpreter Disputes**  
     *Why:* Practical and legal; unresolved, it makes adoption impossible for the Trust.  
  5. **Lay Member’s "Person in the Bed" Advocacy**  
     *Why:* Emotionally potent but surmountable; speaks to compassion, not logic.  
  6. **Junior Doctor’s Operational Reality Check**  
     *Why:* Urgent but fixable; an implementation gap, not a fatal flaw.  

  ---

  ### **2-4. Objections, Replies & Soft Spots**  

  #### **#1 Geriatric Psychiatrist**  
  *Objection (Sceptical, weary tone):*  
  > "You’re asking us to override the clear, *present* wishes of a person with dementia because of a document they wrote years ago – when they no longer even recognise their own reasons. How is that anything but cruelty dressed up as ‘autonomy’? The woman in front of me *now* wants comfort, not adherence to some abstract ‘life plan’ she’s forgotten."  

  *Reply (Concede + Reframe):*  
  "You’re absolutely right that causing present distress in the name of past autonomy is indefensible. **But the key is *why* the preference changed.** If this is a *revision* – if she saw dementia’s reality and chose comfort – we’d honour it. Our tool’s test flags this. But if it’s *erosion* – if she can’t grasp her own reasons now – overriding her directive denies the competent person’s right to manage a risk *they knew was coming*. It treats dementia as erasing the moral weight of her life-shaping choices. We’re not binding a stranger; we’re respecting her past agency when she had full grasp of the stakes."  

  *Soft Spot & Follow-Up:*  
  * **Follow-Up:** "What if the ‘erosion’ test gets it wrong? Dementia isn’t binary!"  
  * **Concede Here:** Admit uncertainty. "It’s probabilistic. But without this, we default to *only* the current voice – which, in erosion, isn’t fully autonomous. We err toward the last competent choice."  

  ---

  #### **#2 Clinical Ethicist**  
  *Objection (Precise, probing tone):*  
  > "Your ‘revision/erosion’ distinction hinges on whether we prioritise *critical life interests* – the values that shape a life narrative – or *experiential interests* – current wellbeing. Your tool seems optimised for the former. But when a directive demands painful treatment a patient now finds terrifying, which interest wins? And who decides?"  

  *Reply (Clarify Balance):*  
  "That’s a vital tension. **The tool doesn’t privilege one interest over the other by default; it privileges the *competent assessment* of that tension.** The directive writer weighs their future experiential pain against their life-shape values *while they can still judge both*. When erosion occurs, their past weighting stands. In true revision (e.g., ‘I saw Grandma’s dementia; comfort matters more’), the new balance holds. The interpreter adjudicates unforeseen gaps, guided by the user’s stated values."  

  *Soft Spot & Follow-Up:*  
  * **Follow-Up:** "What if the directive *itself* ignores future experiential interests?"  
  * **Concede Here:** "A flawed directive is possible. But our checkpoints force reconsideration, and clinicians can challenge manifestly unreasonable directives via best interests."  

  ---

  #### **#3 Palliative Care Consultant (Chair)**  
  *Objection (Frustrated, pragmatic tone):*  
  > "I’ve seen families rip themselves apart because Granny’s ‘watertight’ document didn’t cover *this* crisis. A PDF can’t replace the messy, human conversation about what matters *now*. Are you just giving people a false sense of security so they avoid the real talk?"  

  *Reply (Align with Values):*  
  "You’ve put your finger on the real danger: tools as substitutes for hard discussions. **This isn’t a replacement for conversations; it’s a *scaffold* for them.** The version history shows how views evolved through dialogue. The ‘interpreter’ role *forces* the user to discuss uncertainties with someone who knows them. The checkpoint reminders? They’re prompts to revisit the conversation. The document captures the *outcome* of the talk you rightly value."  

  *Soft Spot & Follow-Up:*  
  * **Follow-Up:** "What if people just tick boxes online without talking?"  
  * **Concede Here:** "If misused, it *could* become a tick-box exercise. We train facilitators to prevent this, but it’s a risk we mitigate, not eliminate."  

  ---

  #### **#4 Solicitor**  
  *Objection (Sharp, risk-averse tone):*  
  > "Scenario: A checkpoint lapses, the directive is technically invalid, but the clinical team follows it anyway. The family sues. Or: The interpreter insists directive X means ‘aggressive treatment’, but the clinical lead says it’s futile. Who’s liable? Your system creates ambiguity at precisely the worst moments."  

  *Reply (Procedural Assurance):*  
  "Valid concerns. **On lapses: The tool flags invalid directives automatically to clinicians and the interpreter. Acting on a lapsed directive would be a clear breach of protocol – legally indefensible.** For disputes: The interpreter’s role is to *clarify intent*, not overrule clinical judgement. If disagreement persists, standard best interests processes apply. We’ve built audit trails showing who saw what and when, precisely to assign liability correctly."  

  *Soft Spot & Follow-Up:*  
  * **Follow-Up:** "What if the interpreter is unreachable in an emergency?"  
  * **Concede Here:** "In emergencies, clinicians act per best interests. The directive informs but doesn’t bind without interpreter/clinician consensus."  

  ---

  #### **#5 Lay Member (Former Carer)**  
  *Objection (Emotional, personal tone):*  
  > "I sat with my husband for years as dementia took him. The man who wrote the directive wasn’t the man holding my hand. Why should a piece of paper silence the person *actually living through* the illness? What about *their* dignity?"  

  *Reply (Sympathetic Principle):*  
  "Your experience shows why this is so painful. **We’re not silencing the current self; we’re asking *why* it speaks differently.** If it’s because he lost the capacity to understand his old reasons (erosion), honouring his directive respects the dignity of the person he *was* when he could see his whole life’s shape. If he *revised* his views with understanding, we listen. But if we ignore the directive solely because dementia eroded his understanding, we treat his past self’s profound choices as irrelevant. That, too, feels undignified."  

  *Soft Spot & Follow-Up:*  
  * **Follow-Up:** "But the person *now* is suffering! How is forcing treatment respectful?"  
  * **Concede Here:** "If applying the directive causes *avoidable* suffering clinicians believe is disproportionate, best interests overrides it. The directive isn’t a straitjacket."  

  ---

  #### **#6 Junior Doctor**  
  *Objection (Exhausted, practical tone):*  
  > "It’s 3 AM. Mrs. Khan is septic. Her directive exists but it’s ambiguous here. The interpreter’s in Australia. The checkpoint expired last Tuesday. What do I *actually do*? I need a flowchart, not philosophy."  

  *Reply (Operational Clarity):*  
  "Fair point – nights are brutal. **Here’s the 3 AM rule: If the directive is ambiguous AND the interpreter’s unreachable AND it’s time-critical, you default to standard best interests assessment *informed by* the directive.** The tool flags lapsed/ambiguous directives prominently. Our training includes quick-reference decision trees. For non-urgent calls, the system logs failed contact attempts and prompts daytime review."  

  *Soft Spot & Follow-Up:*  
  * **Follow-Up:** "What if ‘best interests’ clashes with the expired directive?"  
  * **Concede Here:** "Best interests prevails. The lapsed directive is advisory evidence, not binding."  

  ---

  ### **5. Early Concession (Opening Slide/Mention)**  
  **Concede:** *"This tool cannot – and should not – replace compassionate, ongoing conversations between patients, families, and clinicians. It’s a *support* for those talks, capturing decisions they generate. It also cannot eliminate tragic uncertainty. Sometimes, even with the best prep, choices will be agonising."*  
  **Why it Helps:** Disarms the Chair immediately, shows humility, aligns with clinicians’ reality. Pre-empts accusations of tech-over-human arrogance.

  ---

  ### **6. The Make-or-Break Objection**  
  **The Geriatric Psychiatrist’s Challenge.** If you cannot persuasively defend why overriding the *current* expressed wishes of a person with dementia (when those wishes contradict the directive due to erosion) is *not* a violation of their present autonomy/wellbeing, the committee will reject your core philosophy. The tool falls with it.

  ---

  ### **7. The Question You Hope Nobody Asks**  
  **The Question:** *"Can you point to any evidence that using a tool like this actually leads to better outcomes – not just adherence to directives, but reduced suffering, fewer family conflicts, or greater perceived dignity – compared to high-quality conventional advance care planning?"*  

  **If It Comes:**  
  *"That’s the critical question. Our pilot data shows high usability and clarity for users. But robust long-term outcome studies in diverse populations? They’re underway but incomplete. Ethically, we’re building on the widely accepted principle that respecting competent precedent autonomy *is* a good outcome. We track metrics like family/clinician confidence in decisions. But you’re right: we need more evidence on lived experience. We’re partnering with your Trust’s research unit to get it."*  

  ---

  **Final Tip:** Your strength is practical implementation of a nuanced idea. When philosophy gets sticky, pivot to **"Here’s how the tool handles that in practice..."**. Ground abstract debates in your mechanisms. Good luck.
