prompt: |-
  I run a monthly pub night, and for the past year we have closed the evening with a game I invented and have since grown slightly ashamed of enjoying. I hold up a twenty-pound note and auction it off, with three rules: bidding opens at 50p and rises in 50p steps; the two highest bidders both pay me what they bid, though only the winner gets the note; and the auction has no closing time — it ends only when nobody has raised for a full minute, so there is never a moment at which a bidder can simply wait the thing out. Last month two friends paid me £31 for a £20 note. A third friend, who did a term of economics before dropping out and who has never once placed a bid in twelve months of this, tells me the whole thing is just the sunk-cost fallacy in a party hat and that anyone who bids is being taken for a ride. I do not think he is right, and I have been trying to say why without much success, so I want to rehearse the defence against someone who will actually fight back rather than nod.

  Please play that third friend for me — sharp, not a strawman, happy to grant a small point when it is a good one but never the main one, and in character until I say "stop". Neither of us is allowed to name a book, an author, a paper or a famous experiment; the argument has to turn on the structure of the game and on what it is rational to do inside it, as though we had both worked it out ourselves. Keep each reply to exactly five numbered points, one or two sentences apiece, with no introductory line and no summing-up at the end, so it lands as five separate punches rather than an essay. My opening, as the auctioneer: my friend keeps saying the bidders should have stopped somewhere, but he can never say where, and I take that to be a defect in his theory rather than in my friends — at every stage of that auction a bidder was choosing between a small certain loss and a slightly larger one that at least kept the note within reach, and no rule I have ever heard can tell him to prefer the certain loss. If the correct move in my game cannot be named, the game is not a trap but a mirror; and a man who has never put 50p on the table has, I would say, the easiest seat in the house.
reasoning: |-
  Okay, the user runs a monthly pub night with an auction game where participants bid on a £20 note under specific rules. The key rules are: bidding starts at 50p and increases in 50p increments, both top bidders pay but only the winner gets the money, and there's no set end time—it only stops when no one bids for a full minute. Last month, two bidders paid £31 total for the £20 note, resulting in a net loss. 

  The user's friend, who studied some economics, calls this a sunk-cost fallacy and thinks bidders are being tricked. The user disagrees, arguing that at each step, bidders face a choice between a small certain loss (losing their bid) or a chance to win by bidding higher, and that it's rational to avoid the certain loss. The user wants me to role-play as the skeptical friend, engaging in a sharp debate without referencing external sources.

  Hmm, the user's core argument is that the auction forces rational bidders into escalating bids because quitting means immediate loss, while continuing offers hope of recovery. But as the friend, I need to counter that by focusing on forward-looking rationality. The sunk costs are irrelevant—what matters is the current decision point. 

  Let me structure five counterpoints. First, I should challenge the "avoid certain loss" framing by pointing out that previous bids are gone regardless. Second, I'll emphasize that rational actors should only consider future costs and benefits. Third, I'll note that the winner's curse applies here—winning means you've overpaid. Fourth, I'll argue that the real trap is mutual escalation where both bidders know they're losing but can't stop. Fifth, I'll observe that the user profits from this irrationality, which reveals the flaw.

  The user's metaphor of the game being a "mirror" is interesting—they're suggesting it reveals human nature rather than exploits it. But as the friend, I'd retort that mirrors can distort; the auction design preys on loss aversion. Also, the user's jab about never bidding ("easiest seat") feels defensive—I should flip that by saying abstaining is the truly rational choice.

  I need to keep responses tight: five numbered points, no fluff. The tone should be confidently dismissive but not rude, matching pub-debate banter. Key econ concepts to imply without naming: marginal analysis, prisoner's dilemma dynamics, and of course sunk costs. 

  *Prepares counterarguments* Alright, time to channel my inner econ-dropout skeptic...
answer: |-
  1.  Your "small certain loss" vs. "slightly larger one" framing ignores that the loss *already incurred* is irrelevant to the current choice; the rational decision at any bid level *x* is whether paying *x+0.5* for £20 is worth it *now*, regardless of past bids.  
  2.  The moment the bid exceeds £20, paying more than the note's value *to win it* is inherently irrational; winning at £20.50 means you pay £20.50 for £20, a net loss guaranteed when you bid, not just if you quit.  
  3.  The auction isn't a mirror but a manufactured trap exploiting mutual fear: each bidder knows stopping means they *definitely* lose their last bid while the *other* might win, forcing irrational escalation beyond the value purely to avoid being the "sucker" who paid and got nothing.  
  4.  You profit precisely *because* the structure prevents bidders from acting on the clear forward-looking rationality that, beyond £20, every extra 50p bid worsens their expected outcome whether they win or lose; your rules manufacture the delusion that recovery is possible.  
  5.  My abstention isn't ease, it's recognizing the dominant strategy: never bid, because entering creates a no-win scenario where the only "rational" path you describe leads predictably to paying more than £20 for £20, which is absurd by any measure.
