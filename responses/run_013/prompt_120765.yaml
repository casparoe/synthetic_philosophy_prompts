  First, I need to unpack the key requirements. The protagonist must retain pain's reflexive responses (hand pulling back from heat) but lack its affective dimension. The two main conflicts are: 1) considering a treatment that might "fix" her, forcing her to confront whether her condition is an impairment or a different way of being, and 2) a crucial scene where she questions her capacity to experience pleasure. The ending must remain unresolved.

  The user specifically wants to avoid medical drama tropes - no disease-of-the-week plots, no wise doctor monologues, no real research citations. The setting should be contemporary and grounded. They also want a moment where someone close to the protagonist is disturbed by her reaction to pain.

