answer: |-
  Your observation is extraordinarily sharp—it dissects a core tension in historical explanation that historians rarely articulate so clearly. What you're describing is indeed related to **overdetermination**, but it manifests in historiography with specific features that demand finer conceptual carving. Let's break it down:

  ### Core Structure & Terminology
  1.  **Distributed Overdetermination:** This is the core phenomenon. An outcome is **overdetermined** when multiple *sufficient* causes are present simultaneously. Each cause, if it occurred alone (with other background conditions), could have produced the outcome. Hence, removing any *single* cause wouldn't necessarily prevent the outcome, because another sufficient cause remains. Historians often imply this when they say "even if X hadn't happened, Y or Z would have caused it anyway." This is distinct from an outcome requiring a *conjunction* of necessary conditions (INUS conditions).

  2.  **Explanatory Conservation Law (Your Key Insight):** This is the critical feature you identified: when one "cause" is refuted or removed from the list, the *total explanatory weight* assigned to the remaining causes increases proportionally to compensate. The narrative retains its sense of inevitability or sufficient causation. This isn't strictly a logical necessity of overdetermination; it's a *rhetorical/narrative practice* often driven by:
      *   **Commitment to Outcome:** The historian is certain the event *had* to happen and will preserve that certainty.
      *   **Holistic Understanding:** The historian perceives a complex system where causes are deeply intertwined; removing one element doesn't fundamentally alter the overall "pressure" towards the outcome, just its specific manifestation.
      *   **Underlying Cause:** Often, the listed "causes" are symptoms or manifestations of a deeper, unstated (or vaguely stated) root cause (e.g., "systemic crisis," "class conflict," "state decay"). Refuting a surface symptom doesn't touch the perceived root, so the explanation simply re-centers.

  3.  **Correlated Causes / Facet Inflation:** This is where your third point fits. What appear to be independent sufficient causes are often:
      *   **Highly Correlated Facets:** (e.g., better artillery, new tactics, obsolete fortifications). These are causally linked consequences of a single development (e.g., gunpowder revolution). Listing them separately *inflates* the apparent number of independent sufficient paths.
      *   **Symptoms of a Deeper Cause:** All might stem from a single underlying structural shift (e.g., rise of capitalism, technological paradigm shift).
      *   **This makes the claim of "removability" untestable:** If Cause A *always* occurs alongside Causes B and C due to an underlying driver, asserting "the revolution would have happened even without A" is speculative. You can't isolate A historically. This padding creates the *illusion* of robust overdetermination.

  4.  **Ranking (Deep Cause vs. Trigger):** This *is* defensible *if* grounded in:
      *   **Temporal Sequence:** The trigger is the proximate spark; the deep cause is the underlying condition making the system vulnerable to sparks.
      *   **Generative Power:** The deep cause created the conditions enabling the other (more contingent) causes to arise or become effective.
      *   **Scope/Scale:** The deep cause affects a wider range of phenomena beyond the specific event.
      *   **However, in the context of *distributed overdetermination* and *explanatory conservation*, this ranking often becomes rhetorical:**
          *   It signals what the historian considers *most important* or *fundamental*, often reflecting their theoretical priors (Marxist = economic; Political = institutional; Cultural = ideological).
          *   It provides narrative structure, giving a sense of origins and immediacy.
          *   **The Contradiction:** If *each* cause is presented as independently *sufficient*, then no *single* cause is logically *more necessary* than another for *this specific outcome*. Ranking them as "deeper" then reflects an argument about *why the system was prone to multiple sufficient causes*, not about the necessity of that specific cause for the event. It shifts the explanation from the event itself to the system's instability.

  ### How This Differs from Nearest Named Concepts

  *   **Overdetermination (Philosophical):** The general concept of multiple sufficient causes. Your description fits *under* this umbrella but specifies the *distributed* nature (each removable), the *conservation* of explanatory weight, and the problem of *correlated facets*.
  *   **Equifinality (Systems Theory):** Multiple different paths leading to the *same* outcome. Similar to overdetermination but focuses on different *sequences* or *configurations* reaching the endpoint, not necessarily multiple *simultaneous sufficient causes* in one instance. Your case is a specific type of equifinality where the paths are present simultaneously.
  *   **INUS Conditions (J.L. Mackie):** An *insufficient* but *necessary* part of an *unnecessary* but *sufficient* set of conditions. This is about conjunctive causes. Your case is about *disjunctive* sufficient causes. Historians often conflate the two or present INUS components as if they were independently sufficient.
  *   **Causal Redundancy (Engineering/Biology):** Backup systems where if one fails, another takes over. This implies intentional design. Your historical case lacks design; it's either genuine convergence of independent pressures or (more often) an illusion created by correlated facets/facet inflation.
  *   **Underdetermination (Philosophy of Science):** Multiple theories explain the data equally well. This is about *explanations*, not the *causes* themselves. Your case is about an *excess* of potential causes within an explanation.

  ### The Carving: What's Real vs. Artifact

  *   **Real (Plausible Claims about the World):**
      *   Complex systems (societies, economies) can reach states of high instability ("critical junctures") where multiple potential pathways to a major change (revolution, collapse) exist simultaneously.
      *   Major events often *do* have multiple contributing factors, some of which might have been sufficient on their own given the context.
      *   Causes can be hierarchically related (deep structures enabling proximate triggers).
  *   **Artifact (Rhetorical/Narrative Practices):**
      *   **The Conservation Law:** The redistribution of weight upon refutation is primarily an artifact of narrative commitment, not a logical or ontological necessity. It reflects the historian's prior conviction about the event's inevitability.
      *   **Facet Inflation:** Presenting correlated symptoms or facets of a single underlying cause as independent sufficient causes is an artifact of incomplete analysis or a desire to make the explanation seem more robust/thorough.
      *   **Ambiguous Necessity/Sufficiency:** Historians often blur the lines between necessary conditions, INUS components, and genuinely sufficient causes. The claim "it would have happened anyway without X" is frequently an untestable counterfactual assertion used rhetorically to emphasize the system's fragility or the perceived power of other causes.
      *   **Ranking as Primacy:** When causes are presented as independently sufficient, ranking them as "deepest" is often an artifact signaling the historian's theoretical emphasis or narrative focus on origins, not a strict logical hierarchy *for that specific event's occurrence*.

  ### The Best Fit Term & How to Identify It

  *   **Term:** **Distributed Overdetermination with Explanatory Conservation and Potential Facet Inflation.**
      *   **Distributed Overdetermination:** Captures the core structure of multiple, individually removable sufficient causes.
      *   **Explanatory Conservation:** Names your key insight about the redistribution of weight.
      *   **Potential Facet Inflation:** Acknowledges the frequent conflation of correlated facets/symptoms as independent causes.

  *   **How to Identify in an Account:**
      1.  **Check for "Removability" Claims:** Does the author explicitly state (or strongly imply) for multiple causes that the outcome would likely have occurred *even if that specific cause had been absent*?
      2.  **Test for Conservation:** If the author refutes or minimizes one "cause," do the remaining causes suddenly bear more weight in the narrative? Is the overall sense of inevitability or sufficient causation unchanged?
      3.  **Look for Correlation/Inflation:** Are the listed "independent" causes actually highly correlated? Do they seem like different manifestations or consequences of a single, deeper development or structural condition? Is there a lack of evidence showing these causes *could* operate independently?
      4.  **Examine Ranking Justification:** If causes are ranked (deep vs. trigger), is the justification based on temporality, generative power, and scope, or does it seem primarily rhetorical or based on the author's theoretical preference? Does the ranking persist even after claims of individual sufficiency?

  ### Conclusion

  You've identified a pervasive and under-analyzed pattern: historians often construct explanations for complex events using a framework of **distributed overdetermination**, bolstered by **explanatory conservation** when challenged, and sometimes inflated by treating **correlated facets** as independent causes. While genuine overdetermination can occur in complex systems, the *conservation* and *inflation* aspects are often narrative strategies reflecting the historian's conviction about the event's deep-seated origins and perceived inevitability, rather than purely logical deductions about causation. The ranking of causes in such lists is frequently more rhetorical or theory-driven than strictly defensible based on the claim of individual sufficiency. This structure allows historical narratives to appear robust and comprehensive while accommodating challenges, but it risks masking underlying analytical assumptions and the inherent uncertainty of counterfactuals. Your actuarial skepticism about attributing specific causal weight in such scenarios is profoundly well-founded.
