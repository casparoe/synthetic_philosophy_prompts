prompt: |-
  I'm a science journalist and I'm working up a feature on why a small but stubborn corner of mathematics refuses to sign off on a rule the rest of us use without thinking — the law of excluded middle — and I keep tripping over the same knot. A logician I interviewed explained that for an intuitionist a disjunction isn't a bare 'one of these two things is the case'; it's a claim to have a proof of one of the disjuncts and to know which. That much I can hold in my head. But then he added that intuitionistic logic proves not-not-(A or not-A) for any A, and that not-not-not-A is equivalent to not-A. So double negation is strong enough to give you back excluded middle and weak enough that it can't be cancelled, which sounds like a contradiction in a system that's supposed to be a tidy subset of the classical one. And when I asked whether intuitionists think 'A or not-A' might actually be false, he said no, they simply won't assert it — which left me unable to tell whether we're talking about mathematics or about the limits of what anyone has managed to prove so far.

  What I'd like from you is a proper untangling of this, pitched at someone who did a bit of logic at university and hasn't entirely forgotten it, but who isn't going to be fobbed off with 'intuitionists reject excluded middle because they're constructivists'. In particular: why does a proof of a disjunction have to tell you which disjunct, and what does that do to the disjunction and existence properties — and are those properties a consequence of the proof-reading of the connectives, or an extra stipulation bolted on? What exactly is a Brouwerian counterexample, and how is it different from a disproof; I suspect the answer is that it shows a statement to be unprovable-in-the-present-state-of-knowledge rather than false, and if so I want to know whether that makes intuitionism a doctrine about our ignorance rather than about mathematical reality. For concreteness, walk me through one of those real numbers defined by a recipe that waits on an unresovled question — I've seen a version that hangs on runs of 7s in the decimal expansion of pi — and show me why 'this number is either zero or not zero' can't be settled. Then tell me whether I've been sloppy in running together Brouwer's intuitionism and Bishop-style constructive analysis, because I gather one is closer to a philosophy of mind and the other to a discipline of writing proofs that carry computational content, and I'd like the difference spelt out. Finally, I've heard it said that intuitionstic logic is the logic of all Kripke frames while classical logic is the logic of frames with a single world — if that's a fair way of putting it, explain why, and tell me whether there's anything to the slogan that classical logic is just intuitionistic logic with every formula wrapped in two negations. Skip the reading list, I want the explanation itself; and don't be shy of the technical detail.
reasoning: |-
  Okay, this science journalist has a deep and specific set of questions about intuitionistic logic. They clearly understand the basics but are stuck on some philosophical and technical nuances. Let me unpack this step by step.

  First, their core confusion seems to be about the status of excluded middle in intuitionism. They've grasped that intuitionists require proofs to specify which disjunct holds, but get tripped up by the fact that ¬¬(A∨¬A) is provable. That does seem paradoxical at first glance - if you can prove it's absurd that neither A nor not-A holds, why not just accept A∨¬A? The key is recognizing that in intuitionistic logic, proving ¬¬P doesn't give you P, only that P can't be refuted. So ¬¬(A∨¬A) just means the law of excluded middle can't be falsified, not that it's constructively true.

  The journalist also seems to conflate epistemological and ontological aspects. When they ask if intuitionism is about "our ignorance rather than mathematical reality," that's exactly the hinge point. For Brouwer, mathematics is mental construction, so unprovability equals nonexistence in the mathematical universe. Bishop takes a more pragmatic view - it's about what we can compute, not metaphysical claims. This distinction matters for how we interpret Brouwerian counterexamples.

  Speaking of which, a concrete example with π's digits would help. Suppose we define a number r that's 0 if π has a run of seven 7s, and 1/(n+1) otherwise where n is the position of the first such run. Since we don't know if such a run exists, we can't compute whether r=0 or not. Crucially, this isn't temporary ignorance - for intuitionists, r genuinely hasn't been constructed as zero or non-zero yet. The disjunction r=0 ∨ r≠0 has no proof specifying which holds.

  On the logical properties: The disjunction property (if ⊢A∨B then ⊢A or ⊢B) and existence property (if ⊢∃xP(x) then ⊢P(t) for some t) follow directly from the BHK interpretation, not added rules. They're why intuitionists reject excluded middle - proving A∨¬A would require proving A or proving ¬A for arbitrary A, which is impossible.

  The Kripke frame perspective is illuminating here. Classical logic works in static worlds, but intuitionistic logic models knowledge growth over partial worlds. In a multiverse of information states, ¬¬P means P holds in all future worlds, not necessarily now. And double negation elimination fails because later worlds might refute P. This explains why ¬¬¬A→¬A holds - if it's absurd that ¬A is absurd, then ¬A must hold.

  Finally, that wrapping slogan is partially right. Glivenko's theorem shows classical tautologies become intuitionistic when doubly negated, but full equivalence requires more. It's a useful crutch for seeing how classical logic embeds into intuitionistic logic.

  Throughout this, I need to maintain precision about Brouwer versus Bishop. Brouwer's intuitionism is truly ontological - mathematical objects are mental constructs. Bishop's constructivism is methodological - about what proofs achieve. Both reject excluded middle, but for different philosophical reasons.
answer: |-
  Here's a meticulous untangling of intuitionistic logic's core distinctions, structured to address your specific knots. We'll move from philosophy to concrete mathematics, clarifying terminology and separating Brouwerian idealism from Bishopian pragmatism.

  ### I. Why disjunctions demand witnesses (The BHK Interpretation)
  Intuitionistic logic isn't just "classical logic minus excluded middle"; it redefines the **meaning** of logical connectives via the **Brouwer-Heyting-Kolmogorov (BHK) interpretation**:
  -   **A proof of `A ∨ B`** requires either a proof of `A` *or* a proof of `B` **and** a marker indicating which one you have. It's a *construction* delivering one disjunct concretely.
  -   **A proof of `∃x P(x)`** requires constructing a specific witness `c` *and* a proof of `P(c)`.
  -   **A proof of `A → B`** is an algorithm converting *any* proof of `A` into a proof of `B`.
  -   **A proof of `¬A`** (defined as `A → ⊥`) is an algorithm converting *any* proof of `A` into a proof of absurdity (`⊥`), which has no proof.

  **Consequence:** The "disjunction property" (`⊢ A ∨ B` implies `⊢ A` or `⊢ B`) and the "existence property" (`⊢ ∃x P(x)` implies `⊢ P(c)` for some specific `c`) are **not bolted-on rules**; they are **inherent consequences** of the BHK meaning. If the system proves `A ∨ B`, it *must* have constructively provided a proof of one disjunct. Excluded middle (`∀A. A ∨ ¬A`) fails because for an arbitrary `A`, you lack a general algorithm to *construct* either a proof of `A` or a proof that `A` leads to absurdity.

  ### II. Negation's Nuances: Why `¬¬(A ∨ ¬A)` holds but `A ∨ ¬A` doesn't
  The BHK interpretation explains the negation behavior:
  1.  **`¬¬¬A` is equivalent to `¬A` (Intuitionistically Valid):**
      -   `¬¬¬A` means `((A → ⊥) → ⊥) → ⊥`.
      -   Suppose you have a proof `h` of `¬¬A` (i.e., `h : (A → ⊥) → ⊥`).
      -   You need to build a proof of `⊥`.
      -   Apply `h` to a hypothetical proof `k` of `A → ⊥` (i.e., `h(k)`). But `h(k)` is a proof of `⊥`! So `h` applied to `k` gives absurdity. Therefore, the existence of `h` leads to absurdity. Hence `¬¬¬A → ¬A`.
      -   Conversely, `¬A → ¬¬¬A` holds intuitionistically (if `A` is absurd, then the absurdity of `¬A` is absurd). So they are equivalent.
  2.  **`¬¬(A ∨ ¬A)` holds (Intuitionistically Valid):**
      -   `¬(A ∨ ¬A)` means `(A ∨ (A → ⊥)) → ⊥`.
      -   Suppose you have a proof `h` of `¬(A ∨ ¬A)`. You need to derive `⊥`.
      -   Consider `A`. If you have a proof of `A`, then you have a proof of `A ∨ ¬A` (left disjunct). But `h` says this leads to `⊥`! So `A` must lead to `⊥`. Therefore, you have a proof of `¬A` (`A → ⊥`).
      -   But a proof of `¬A` is also a proof of `A ∨ ¬A` (right disjunct). Apply `h` to *this* proof of `A ∨ ¬A` to get `⊥`.
      -   Therefore, the assumption `h : ¬(A ∨ ¬A)` leads to `⊥`. Hence `¬¬(A ∨ ¬A)`.
  3.  **Why `A ∨ ¬A` fails:** Proving `A ∨ ¬A` constructively requires *either* a proof of `A` *or* a proof of `¬A` (and knowing which) *for the specific `A` in question*. The proof of `¬¬(A ∨ ¬A)` only shows that assuming `A ∨ ¬A` is *false* leads to absurdity. It does **not** provide a method to *construct* either a proof of `A` or a proof of ¬`A`. It demonstrates the *undeniability* of the disjunction ("it can't *not* be true") without establishing its constructive truth ("here's *how* it's true").

  ### III. Brouwerian Counterexamples: Unprovability ≠ Falsehood
  A **Brouwerian counterexample** demonstrates that a statement (often `A ∨ ¬A` or similar) is **currently unsupported by any constructive proof** and, crucially, **cannot be proven without assuming non-constructive principles**. It highlights dependence on excluded middle or its equivalents. This is distinct from a **disproof** (`¬A`), which constructs an algorithm turning proofs of `A` into absurdity.

  **Concrete Example (Pi and Runs of 7s):**
  1.  **Define a real number `r`:**
      -   Let `dₙ` be the `n`-th digit of `π` (after the decimal).
      -   Define a sequence `sₙ`:
          ```
          sₙ = 
              { 0 if no run of seven consecutive 7s has started in d₁, ..., dₙ
              { 1/(k+1) if the *first* run of seven consecutive 7s starts at digit k AND k ≤ n
          ```
      -   Let `r = limₙ→∞ sₙ`.
  2.  **Properties of `r`:**
      -   `r = 0` if and only if `π` has *no* run of seven consecutive 7s.
      -   `r > 0` (specifically, `r = 1/(k+1)`) if and only if the *first* such run starts at digit `k`.
      -   `r` is a well-defined constructive real number (the sequence `sₙ` is Cauchy: `|sₘ - sₙ| < 1/min(m,n)` for `m,n > k` if a run starts at `k`, or `0` otherwise).
  3.  **Why `r = 0 ∨ r ≠ 0` is unprovable (intuitionistically):**
      -   To prove `r = 0 ∨ r ≠ 0` constructively, you *must* either:
          *   **Prove `r = 0`:** This requires proving `π` has *no* run of seven consecutive 7s.
          *   **Prove `r ≠ 0`:** This requires proving `π` *has* a run of seven consecutive 7s (and constructing the position `k` to know `r ≥ 1/(k+1) > 0`).
      -   **Current Status:** As of now (April 2024), no such proof exists for either disjunct. We do not know if such a run exists in `π`, nor have we proven its impossibility.
      -   **Brouwerian Counterexample:** This *is not* temporary ignorance. For an intuitionist (especially a Brouwerian one), the mathematical object `r` is defined, but the proposition "`r = 0 ∨ r ≠ 0`" **lacks a constructive proof**. Asserting it requires assuming we *will* someday know the answer (which may be false) or assuming excluded middle itself. The statement is *not false* (`¬(r=0 ∨ r≠0)` would be absurd, as per `¬¬(A∨¬A)`), but it is **unjustified** by current constructive means.
  4.  **Ontology vs. Epistemology:** This is the crux.
      -   **Brouwer (Intuitionism):** Mathematics is a mental construction. `r` exists only as defined. The disjunction `r=0 ∨ r≠0` **does not correspond to a completed mental construction** until we *have* a proof of one disjunct. Its "truth" is meaningless independent of our construction. It's ontological: the disjunction genuinely *does not hold* in the present state of mathematical reality.
      -   **Bishop (Constructivism):** Focuses on the **meaning of proof and truth claims**. Saying "`r=0 ∨ r≠0`" means "I possess a decision procedure yielding one disjunct". We lack such a procedure for `r`. Bishop avoids strong ontological claims; it's about the obligations incurred by making assertions. It's epistemological regarding proofs, but implies an ontology where only computable objects are meaningful.

  ### IV. Brouwer vs. Bishop: Mind vs. Method
  *   **Brouwer's Intuitionism:**
      *   **Core:** Mathematics is fundamentally an activity of the ideal mind; mathematical objects are mental constructions. Logic is secondary, derived from how we construct.
      *   **Key Traits:** Rejects formalization as primary (though Heyting later formalized the logic), uses highly idealistic "free choice sequences", motivated by philosophy of mind/time/continuum.
      *   **View on `r=0 ∨ r≠0`:** This disjunction is *currently not a valid part of mathematics*; its assertion is metaphysically incorrect until a construction is given.
  *   **Bishop's Constructive Analysis:**
      *   **Core:** Mathematics should be developed so that every theorem has **direct computational meaning**. Excluded middle and non-constructive proofs are rejected because they fail to provide algorithms or witnesses.
      *   **Key Traits:** Embraces formal systems (like Heyting Arithmetic/Calculus), focuses on positive mathematics (e.g., `¬¬A` is weaker than `A`), prioritizes practicality (building usable constructive analysis). Philosophy is often minimized ("Don't tell me what you can't do, show me what you can do").
      *   **View on `r=0 ∨ r≠0`:** Asserting this requires a computational decision procedure for the property "has a run of seven 7s". We lack one. Therefore, asserting the disjunction is **unwarranted** and **mathematically irresponsible** as it makes a claim we cannot computationally fulfill. The focus is on the proof content, not the state of mathematical reality per se.
  *   **Agreement:** Both reject unrestricted excluded middle as unjustified/unwarranted. Both demand witnesses for disjunctions/existentials. Both accept the same core logic (Heyting Calculus).
  *   **Divergence:** Brouwer is fundamentally idealistic and ontological; Bishop is pragmatic and methodological. Brouwer's counterexamples highlight the *non-existence* of a mathematical object (the deciding construction); Bishop's highlight the *lack of justification* for a claim.

  ### V. Kripke Semantics & The Double-Negation Slogan
  *   **Kripke Frames for Intuitionistic Logic:**
      *   **Structure:** A set of "stages" or "information states" (`K`), partially ordered by "possible extension" (`≤`). Think of stages as snapshots of increasing knowledge.
      *   **Truth:** Truth (`⊩`) is *stage-relative* and *persistent*: If `w ⊩ A` and `w ≤ v`, then `v ⊩ A`. Truth is never lost as knowledge grows.
      *   **Connectives:**
          * `w ⊩ A ∨ B` iff `w ⊩ A` *or* `w ⊩ B`.
          * `w ⊩ A ∧ B` iff `w ⊩ A` *and* `w ⊩ B`.
          * `w ⊩ A → B` iff for *every* `v ≥ w`, if `v ⊩ A` then `v ⊩ B`.
          * `w ⊩ ¬A` iff for *no* `v ≥ w` is `v ⊩ A` (i.e., `w ⊩ A → ⊥`).
          * `w ⊩ ∃x P(x)` iff there exists a witness `c` (in the domain of `w`) such that `w ⊩ P(c)`.
          * `w ⊩ ∀x P(x)` iff for every `v ≥ w` and every `c` in the domain of `v`, `v ⊩ P(c)`.
      *   **Validity:** `⊨ A` if for every frame and every root node `w`, `w ⊩ A`.
      *   **Classical Logic as Special Case:** If `K` has only **one world**, persistence is trivial, and the semantics collapse to classical truth tables. The slogan "intuitionistic logic is the logic of all Kripke frames, classical logic is the logic of single-world frames" captures this.
  *   **`¬¬` and Excluded Middle:**
      *   `w ⊩ ¬¬(A ∨ ¬A)` holds in all frames. Why?
          * `w ⊩ ¬(A ∨ ¬A)` would mean: For all `v ≥ w`, `v` does *not* force `A ∨ ¬A`.
          * `v` not forcing `A ∨ ¬A` means `v` forces neither `A` nor `¬A`.
          * But if `v` forces `¬A`, it *would* force `A ∨ ¬A` (right disjunct). Contradiction. So `v` cannot force `¬A`. Therefore, there *must* be some `u ≥ v` where `u ⊩ A` (otherwise `v` *would* force `¬A`). But if `u ⊩ A`, then `u ⊩ A ∨ ¬A`! Contradiction. Hence `w ⊩ ¬(A ∨ ¬A)` is impossible. So `w ⊩ ¬¬(A ∨ ¬A)`.
      *   `w ⊩ A ∨ ¬A` requires that *at stage `w`*, you *already* know either `A` or `¬A` holds. This fails at stages where `A` is undecided.
  *   **The Slogan: "Classical logic is intuitionistic logic with double negations" (Glivenko's Theorem):**
      *   **Glivenko:** `⊢ₖₗ A` (A is classically valid) **if and only if** `⊢ᵢₙ ¬¬A` (¬¬A is intuitionistically valid).
      *   **Why?** The Kripke semantics illuminates this. Proving `¬¬A` intuitionistically means showing it's absurd that `A` could *never* become true in any future knowledge state. In a single, static classical world, "never true" is equivalent to "false", so `¬¬A` becomes `A`. In a multi-world Kripke frame, `¬¬A` is weaker than `A`; it only means `A` cannot be permanently falsified, not that it's true *now*.
      *   **Limitation:** The slogan is precise *only* for propositional tautologies under double negation. It doesn't mean classical mathematics can be naively translated by wrapping every formula in `¬¬`. For predicate logic and full mathematics, more sophisticated translations (like Gödel-Gentzen negative translation) are needed, mapping `A` to `¬¬A` only for atomic `A` and handling quantifiers specially (`∃x` becomes `¬∀x¬`).

  ### VI. Untangling the Knot: Summary
  1.  **Disjunction Requires Witness:** BHK defines `A ∨ B` as a *certified choice* between `A` and `B`. Disjunction/Existence properties are inherent, not add-ons.
  2.  **`¬¬(A ∨ ¬A)` vs. `A ∨ ¬A`:** `¬¬(A ∨ ¬A)` means "`A ∨ ¬A` cannot be refuted" (a Kripke-worlds proof of undeniability). `A ∨ ¬A` means "We *have* a proof of `A` *or* we *have* a proof of `¬A`" (a constructive demand unmet for arbitrary `A`).
  3.  **Brouwerian Counterexample:** Demonstrates `A ∨ ¬A` (or similar) is *unprovable* constructively by defining a mathematical object (like `r`) whose properties depend on an unresolved question. This highlights the *lack of justification* (Bishop) or the *non-existence in current math* (Brouwer) for the disjunction, not its *falsity*.
  4.  **Brouwer vs. Bishop:** Brouwer: Mind constructs math; `r = 0 ∨ r ≠ 0` is ontologically incomplete. Bishop: Proofs must compute; asserting `r = 0 ∨ r ≠ 0` is unjustified without a decision procedure. Same logic, different philosophy.
  5.  **Kripke Frames:** Intuitionistic logic models truth relative to stages of growing knowledge. Classical logic is the degenerate case of complete, static knowledge (one world). `¬¬A` means "`A` will not be forever falsified", weaker than "`A` is true now".
  6.  **Double Negation Slogan:** Glivenko's theorem (`⊢ₖₗ A` iff `⊢ᵢₙ ¬¬A`) captures a core relationship: classical truth is intuitionistic undeniability *in a fixed world*. It's a profound insight but not a universal translation tool for complex math.

  Intuitionism/constructivism challenges the classical conflation of *undeniability* (`¬¬P`) with *truth* (`P`). For the intuitionist, mathematics isn't a static realm of pre-existing truths waiting to be discovered; it's an interplay of construction, knowledge, and justification. The "stubborn corner" doesn't think `A ∨ ¬A` is false; they insist that asserting it requires fulfilling a specific constructive obligation that cannot be met for arbitrary `A`, making its blanket use mathematically unsound within their framework.
