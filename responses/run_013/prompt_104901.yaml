  Below is a comprehensive 90-minute session plan designed to immerse participants in the best-system account of laws of nature through active engagement, conflict with intuitions, and structured reflection. The activity avoids explicit metaphysics until the debrief, centers on experiential discovery, and ensures unresolved tension between Humean and anti-Humean intuitions. Materials, scoring rules, and facilitator guidance are included.

  ---

  ### **Materials & Setup**
  #### **1. Toy Universes (Handouts)**
  - **Universe 1 (with "far corner" exception):**  
    - A 5x5 grid over 12 time steps.  
    - **Particles:** Type A (red) and Type B (blue).  
    - **Central region (3x3 cells, timesteps 1-10):**  
      - A-particles move clockwise one cell per step.  
      - B-particles move away from adjacent A-particles.  
      - Example: At t=1, A is at (2,2); t=2, A moves to (2,3); t=3, to (3,3), etc.  
    - **Isolated corner (cell (5,5), timesteps 11-12):**  
      - A-particle appears and moves erratically (e.g., to (5,4) at t=11, then (4,4) at t=12).  
  - **Universe 2 (identical central region, no exception):**  
    - Same as Universe 1 for timesteps 1-10.  
    - At t=11-12, no particle appears in the corner.  
  - **Part 1 Handout (Initial Commitment):**  
    - Shows **only the central region (3x3) for timesteps 1-10** for both universes.  
    - Lists 7 regularities (mark as Law or Accident):  
      1. A-particles always move clockwise.  
      2. B-particles move away from A-particles.  
      3. No particle moves diagonally.  
      4. Particles never leave the grid.  
      5. A-particles move exactly one cell per step.  
      6. B-particles are stationary if isolated.  
      7. Particle collisions never occur.  

  #### **2. Axiom Language (Handout)**  
  Restricted formal language for writing systems:  
  - **Vocabulary:**  
    - `A(x,y,t)`, `B(x,y,t)` (particle at grid cell (x,y) at time t).  
    - `adjacent(x1,y1,x2,y2)` (cells share an edge).  
    - Operators: `→` (implies), `∀` (for all), `¬` (not), `∨` (or).  
    - Quantifiers over time (`t`), coordinates (`x,y`), and particles.  
  - **Syntax Examples:**  
    - *"A-particles move right if possible":*  
      `∀t,x,y,t_next: A(x,y,t) ∧ t_next = t+1 → A(x+1,y,t_next)`  
    - *"B-particles flee A-particles":*  
      `∀t,x,y,x_a,y_a: B(x,y,t) ∧ A(x_a,y_a,t) ∧ adjacent(x,y,x_a,y_a) → B(x+1,y,t+1)`  

  #### **3. Scoring Rule (Handout & Whiteboard)**  
  Operationalize simplicity and strength:  
  - **Simplicity (S):** Total tokens in axioms (each variable, operator, predicate counts as 1 token).  
    - *Example:* `∀x,y,t: A(x,y,t) → A(x,y+1,t+1)` = 11 tokens.  
  - **Strength (G):** Percentage of grid-timestep facts (e.g., particle states) derivable.  
    - Universe has 5x5x12 = 300 grid-timesteps. Each fact is "A/B at (x,y,t)?" (binary).  
  - **Score:** `G (strength) - k * S (simplicity)`  
    - **k = 0.1** (default; adjustable later).  
  - Systems must be **deterministic** (no probabilistic axioms).  

  ---

  ### **Rules of Play**  
  - **Teams:** Divide into 3–4 teams of 3–4 people.  
  - **Phase 1 (Build):**  
    - Each team writes axioms to describe **Universe 1** (full grid, 12 timesteps).  
    - Goal: Maximize score (high strength, low complexity).  
  - **Phase 2 (Score Swap):**  
    - Teams swap systems, derive predictions, and calculate G and S.  
    - Verify completeness (e.g., "Does it predict (5,5) at t=11?").  
  - **Phase 3 (Adjust & Compare):**  
    - Teams rerun scoring with **k = 0.01** (prioritize strength) and **k = 0.5** (prioritize simplicity).  
    - Compare verdicts (e.g., "Is regularity #1 in the best system now?").  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  

  | Time      | Activity                                                                                                                                 | Notes                                                                 |  
  |-----------|------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------|  
  | 0–5 min   | **Intro:** "Today, you’ll find patterns in a toy universe. Start by labeling regularities as laws or accidents—trust your gut."          | No theory. Focus on observation.                                      |  
  | 5–20 min  | **Part 1: Initial Commitment**<br> - Complete handout individually.<br> - Share verdicts aloud for all 7 regularities. Record on board. | Emphasize: "No consensus needed—defend your judgment."<br>Expected conflict: Regularity #1 (A-clockwise) and #2 (B-movement) will be called laws by most. |  
  | 20–30 min | **Part 2 Setup:** Distribute Universe 1, axiom language, and scoring rule. Explain rules and scoring.                                   | Clarify: Strength requires full derivation. Teams *must* cover corner. |  
  | 30–55 min | **Team Work:** Build and refine systems for Universe 1.                                                                                 | Circulate to unstick teams. Prevent "gaming" (see below).              |  
  | 55–65 min | **Score Swap:** Teams swap systems, compute G and S, declare winner.                                                                    | Identify team with highest score (default k=0.1).                     |  
  | 65–75 min | **Contrast & Adjust:**<br> - Show winning system’s verdicts vs. initial commitments.<br> - Compare Universe 1 and 2.<br> - Flip k (0.01 → 0.5). | Engineer conflicts:<br>- Demotion: In Universe 1, regularity #1 (A-clockwise) is absent in best system due to corner exception.<br>- Universe 2: Same central region, but #1 is in best system (no corner issue).<br>- k=0.5: Simpler systems may drop #2 (B-movement) to save tokens. |  
  | 75–85 min | **Debrief:**<br> - Reveal best-system account: "Laws are axioms in the system optimizing simplicity vs. strength (given the ‘mosaic’)."<br> - Map activity to theory.<br> - Laws as axioms vs. theorems: "If laws are theorems, #1 isn’t a law in *any* system for Universe 1 (since corner breaks it)."<br> - Two unresolved positions:<br>    (A) Best-system verdicts track reality.<br>    (B) Pre-theoretic judgments are data—best-system is a flawed analysis. | **Do not name "Humeanism" or "anti-Humeanism."** Focus on clash: "Why did the rule demote what you called a law? Which side are you on now?" |  
  | 85–90 min | **Q&A + Exit Reflection:** "Keep this tension alive—we’ll revisit it next time."                                                        | Avoid closure. Distribute contact info for follow-up.                 |  

  ---

  ### **Predicted Problems & Solutions**  
  1. **Spoiler Participant (knows best-system account):**  
     - *Prevention:* Brief ahead: "Don’t name theories; focus on the exercise."  
     - *In-session:* If they interject, say, "Hold that thought—let others grapple first. We’ll debate at the end."  

  2. **Gaming the Scoring Rule (not the philosophy):**  
     - *Problem:* Teams min-max tokens (e.g., omit axioms to reduce S) or overfit.  
     - *Solution:* Require full derivation (0% strength if missing facts). Ask: "Would a scientist accept this as elegant?" Redirect to intuition.  

  3. **Unresolved Tension in Teams:**  
     - *Facilitate:* "Which verdict feels wrong? Why? Does the rule miss something?"  

  ---

  ### **Limitations & Caveats**  
  - **Anti-Humean Intuition Uncaptured:** The activity cannot reproduce the anti-Humean sense that laws "govern" or "necessitate." Participants experience laws as *descriptive summaries* (Humean), not causal forces.  
  - **Scoring Rule Risks Begging the Question:**  
    - Stipulating simplicity/strength implicitly endorses Humeanism. Anti-Humeans may reject these as criteria for lawhood.  
    - *Mitigation:* In debrief, name this: "The scoring rule assumes laws are about compression—but maybe they’re more. What’s missing?"  
  - **Oversimplified Trade-off:** Real best-systems involve open-ended language choices (not fixed here). Acknowledge: "We simplified to make trade-offs tangible."  

  ---

  ### **Facilitator Script Snippets**  
  - **During Conflict (e.g., demotion of #1):**  
    > "You all called A-clockwise a *law* initially. But Team 3’s winning system dropped it. Why? Because the corner forced a complex exception. Does that feel like a *real* law should?"  

  - **Debrief Closing:**  
    > "Two truths remain: Your gut said some things *must* be laws. The rule said they depend on the whole mosaic and a scoring tweak. Which truth survives? That’s philosophy."  

  This design ensures participants collide with the core ideas, experience the "demotion" of their commitments, and leave with unresolved friction—no tidy takeaways, just deepened curiosity. Use the grid visuals and scoring swaps to make abstraction tactile.
