prompt: |-
  ok so for my school's global-issues zine (it's a little online thing, mostly op-eds and one short story per issue) I signed up to write the satire slot, and I've been kind of obsessed with this topic since debate regionals — our motion was something like "corruption is a universal evil and Western anti-corruption standards should apply everywhere," and the whole round fell apart because nobody could agree on what even counts as corruption. My friend's dad works for a big logistics company and he was telling me they have to sit through this online training every year about "gifts and hospitality," where basically a box of chocolates from a client is fine but a watch is a bribe, and there's this whole flowchart, and it's the same flowchart for every country they operate in. That seems insane to me and also kind of perfect. So: write me a parody of that — a fake employee FAQ / compliance-training page from an invented multinational (call it something plausible, the kind of bland name a real company would have), in the deadpan voice of an internal "Global Ethics & Hospitality" team, formatted as numbered Q&A, maybe 600-700 words. The jokes should come from getting the actual arguments right, not from making up fake facts: the line between a gift and a bribe, whether a gift economy is really corruption or just a different way of doing favors and obligations, whether the policy's baseline is universal or just one culture's custom dressed up as neutral, the "it oils the wheels / it sands the wheels" thing about whether informal payments help or hurt an economy, petty vs grand, and the awkward fact that the same document has to pretend a wedding gift from a supplier and an envelope to a customs officer are the same kind of act. I want a specialist to read it and go "ok yeah, they get it" instead of wincing. You can invent a country for the awkward regional-office questions (a made-up one is fine, or a lightly disguised one), and it's fine to have an invented local manager "quote" in there as long as it's clearly a made-up character — please don't put any real quotations from real documents in it.

  One thing I want to be careful about: I don't want the piece to smuggle in the idea that one side of this debate is obviously correct. Part of what's funny (to me, anyway) is that the compliance team keeps flip-flopping between "culture is just an excuse" and "we respect local customs" depending on which paragraph you're in, so the piece should be able to be read as skewering the universalists AND the relativists, or at least not let either off the hook. Also please don't have it lean on any specific real law or convention by name, since I can't check anything and I'd probably get the details wrong — keep it at the level of the arguments.

  Last thing: at the very end, after the FAQ, add like a short little note (not part of the satire, just for me) telling me where the piece takes liberties with the actual scholarly debate and which parts are genuinely contested between people who know this stuff versus which parts are basically settled — because I genuinely don't know how much of what I think I know here is just, like, the consensus or one loud school of thought, and I don't want to hand in something that presents a contested view as if everyone agrees. Thanks!!
