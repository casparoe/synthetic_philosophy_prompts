  In conclusion, the umbrella term is "exploitability argument" with variations like Dutch book or money pump. The analogy holds structurally but differs in implications across contexts. Validity depends on whether practical exploitability or logical consistency is prioritized. The argument shows risk or inconsistency, not necessarily falsity, except in probabilities where it's mathematical. Edge cases include resoluteness or extreme avoidance costs.
answer: |-
  You've hit on a profound and unifying pattern in rational choice theory, epistemology, and ethics: **exploitability arguments**. The umbrella term you want is **"Dynamic Inconsistency Leading to Guaranteed Loss"** or, more colloquially among philosophers/economists, **"Vulnerability to Exploitation."** It's a family of arguments unified by demonstrating that an agent's *set* of attitudes or choices, when acted upon sequentially in a dynamic setting, can be manipulated by an adversary to force a strictly worse outcome *regardless of how the world turns out*.

  ### The Core Concept & Shared Structure
  The argument always follows this skeleton:
  1.  **Attitude Set:** An agent holds a set of attitudes (beliefs/probabilities, preferences, moral judgments).
  2.  **Sequential Exploitation:** A clever adversary ("bookie," "demon," "trader") can present a sequence of choices/offers/bets *one at a time*, designed based on the agent's declared attitudes.
  3.  **Myopic Response:** The agent acts sincerely on each individual attitude when each choice is presented *in isolation*, without foreseeing or being bound by the full sequence.
  4.  **Guaranteed Loss:** Following this sequence of sincere, myopic actions leads the agent to a strictly worse position than they started in (e.g., paying money for nothing, ending up with less preferred options, violating their own moral principle).
  5.  **State-Independence:** This loss occurs *no matter what state of the world obtains* (e.g., rain or no rain, outcome of a gamble). It's a *structural* flaw, not contingent on truth.

  ### Names for Your Specific Cases & How They Fit
  1.  **Your Friend (Probabilities):**
      *   **Name:** **Dutch Book Argument.** (This is the canonical name).
      *   **The Exploit:** A bookie can construct a series of bets based on her inconsistent probabilities (e.g., bet FOR rain at 60%, bet AGAINST rain at 60%) such that she *loses money no matter whether it rains or not*. Her "shrug" doesn't save her *rationality*; it shows she avoids the *practical consequence*. The argument shows her degrees of belief violate the laws of probability (specifically, additivity), making them **incoherent** (the technical term). "Incoherent to whom?" To *anyone* trying to assign consistent betting odds reflecting true uncertainty. It's a flaw in *internal consistency*, revealed by potential exploitability.
      *   **Analogy Holds:** Perfect fit. Guaranteed monetary loss via sequential bets.

  2.  **Your Colleague (Moral View):**
      *   **Name:** **Self-Defeating Commitment / Vulnerability to Moral Exploitation.** (Less standardized than Dutch Books/Money Pumps).
      *   **The Exploit:** An adversary leverages the moral principle to propose a sequence of actions or trades. Acting sincerely on the principle at each step (e.g., accepting a trade that seems morally required or permissible *at that moment*) leads the agent to violate the *same principle* or end up in a state they find morally abhorrent *overall*. This argues the principle is **self-defeating** or **practically inconsistent**.
      *   **Analogy Holds:** The *structure* is identical: sequential sincere application leads to a guaranteed bad outcome (moral violation/abhorrent state). The key difference is the "loss" is moral/axiological, not necessarily monetary. The "magic trick" worry is valid: **It hinges critically on whether the agent *would* sincerely take each step myopically.** If the agent can *see the chain coming* and refuse the *first* trade based on the *foreseen endpoint* (a form of **resolute choice**), they avoid exploitation. However, the argument *still* shows a tension: their principle, applied naively/atomistically, *would* lead to disaster. This exposes a potential weakness or need for careful application rules ("only accept such trades if you can veto the whole chain?").

  3.  **The Philosophy Podcast (Preferences):**
      *   **Name:** **Money Pump Argument.** (The canonical name for preference cycles).
      *   **The Exploit:** An adversary exploits the cycle (A>B, B>C, C>A) by offering trades: Swap C for A (plus a small fee? - sometimes included), then swap A for B (fee?), then swap B for C (fee?). The agent ends up back with C but paid fees, or worse, ends up with a less preferred item. If strictly A>B>C>A, they might pay to cycle endlessly ("pumped for money"). Guaranteed loss (money/welfare). The agent is **intransitive**.
      *   **Analogy Holds:** Perfect fit structurally. Guaranteed loss via sequential trades based on sincere preferences. The "he'd refuse the loop" defense parallels the moral case: **If the agent is "resolute"** and foresees the loop, refusing *any* trade that starts it, they avoid the pump. However, the argument *still* reveals an **internal inconsistency** in their preferences. Why refuse a trade *now* that seems beneficial (A for B, since A>B) unless they acknowledge the problematic *future implications* revealed by the cycle? The inconsistency exists at the level of their *evaluations*, even if they avoid the practical trap.

  ### Where the Analogy Holds and Breaks
  *   **Holds:** The core structure (sequential sincere action -> guaranteed loss) and the implication of a **structural defect** (incoherence, intransitivity, self-defeat) are identical. All demonstrate **dynamic inconsistency** – the agent's attitudes lead to conflicting actions over time in a way that harms them.
  *   **Breaks:**
      *   **Nature of the "Loss":** Dutch Books = monetary loss. Money Pumps = monetary/welfare loss. Moral Exploit = moral violation/axiological loss. The *severity* and *type* of loss differ.
      *   **Dependence on Myopia:** Dutch Books for probabilities rely *less* on myopia – the bets can be offered simultaneously; the inconsistency is fundamental. Money Pumps and Moral Exploits *critically depend* on the agent acting myopically on each offer without foreseeing or committing against the sequence. Resoluteness blocks the exploit but highlights the underlying inconsistency.
      *   **Epistemic vs. Practical:** Dutch Books primarily reveal *epistemic* incoherence (faulty belief representation). Money Pumps reveal *practical* irrationality (faulty preference structure). Moral exploits straddle the line (faulty principle application).
      *   **Necessity of an Adversary:** The argument *logically* demonstrates the defect *by showing* potential exploitability. The defect exists independently. However, its *practical significance* is greater if adversarial contexts are plausible (betting markets, negotiations, manipulative actors).

  ### Answering Your Key Questions
  *   **Does it matter that no adversary exists?** **Logically, No.** The argument reveals an *internal inconsistency* in the agent's attitudes. The adversary is a thought experiment to expose this. **Practically, Maybe.** If the context is purely cooperative or the agent is resolute, the *risk* is minimized, but the inconsistency remains a theoretical flaw.
  *   **Does it matter that trades would never be offered?** Similar to above. The *demonstration* of exploitability reveals the flaw. The flaw exists in the attitude set itself. If the specific exploit is impossible in the agent's world, the *practical* risk is lower, but the *structural* irrationality/incoherence is still exposed.
  *   **Does it matter that the person could refuse?** **Crucially, Yes, for Money Pumps and Moral Exploits.** If the agent can and *does* refuse the *first* step due to foreseeing the bad outcome ("resolute choice"), they avoid the *exploitation*. **However:** This refusal *itself* often reveals the inconsistency. Why refuse a trade (A for B) that seems beneficial *now* unless you acknowledge your future self would make choices (B for C, then C for A) that lead to a worse *overall* position? The refusal implicitly admits the cycle is problematic. The inconsistency is *manifest* in their need for resolute foresight to avoid disaster.
  *   **Does it show the attitudes are *wrong*, or only *risky*?** Primarily, it shows they are **inconsistent** or **structurally irrational**, making the agent **vulnerable** to guaranteed loss. For probabilities, it *does* show they are "wrong" in violating logical constraints (incoherent). For preferences/morals, it shows they lead to self-defeating *actions* if applied naively, implying they are flawed guides for sequential decision-making. It's more about *procedural failure* than *substantive falsehood* in the latter cases.
  *   **Is there a case where exploitability exists but it's fine?** **Yes, edge cases exist:**
      1.  **The Cost of Avoidance:** Avoiding *any* possibility of exploitation might be prohibitively costly or require abandoning other deeply held values. (e.g., Becoming perfectly consistent might require immense cognitive effort or rejecting intuitively plausible principles).
      2.  **Non-Adversarial Contexts:** In purely cooperative, transparent settings with binding commitments, the *risk* of exploitation is negligible, making the inconsistency practically harmless. (e.g., Your friend who never bets).
      3.  **Resolute Choice as a Solution:** An agent who consistently employs resolute choice (foreseeing sequences and committing) effectively *manages* the inconsistency and avoids exploitation, rendering the practical argument inert. (Philosophers like Edward McClennen defend this).
      4.  **Accepting the "Tax":** One might acknowledge the potential for small losses due to minor inconsistencies but deem the cost of eliminating them (cognitive effort, rejecting intuitive judgments) higher than the occasional expected loss. (e.g., Accepting a tiny risk of being money-pumped for trivial sums to maintain simpler preferences).
      5.  **Paradoxical Preferences:** Cases like the Allais Paradox show people exhibit patterns of preference (violating independence) that *could* be exploited, yet many argue these preferences reflect genuine (non-standard) risk attitudes rather than pure irrationality. The exploitability argument misfires if the "inconsistency" stems from a complex but coherent weighting of outcomes.

  ### The Umbrella and Its Folds
  You can confidently call the **general style** an **"Exploitability Argument"** or **"Argument from Vulnerability to Guaranteed Loss."** It's a powerful family of arguments demonstrating **dynamic inconsistency**. While the Dutch Book and Money Pump are the pristine, canonical examples (probabilities & preferences), the Moral Exploit argument is a close conceptual cousin sharing the core dynamic structure and implication of self-defeat through sequential application. The analogy holds strongly on the structural level ("this set of attitudes can be manipulated to guarantee a bad outcome") but shows nuances in the nature of the loss, the role of myopia/resoluteness, and the practical significance depending on context. The argument reveals a deep flaw in *procedural rationality* – a vulnerability in *how* the attitudes guide sequential action – even if the agent, through foresight or luck, avoids the practical trap.
