prompt: |-
  Ok so I just spent two and a half hours arguing with a friend about heritability and I still don't know if I won. He's a psych PhD student so everything he says comes out with total confidence. His version went roughly like this: heritability is the fraction of a trait that's caused by your genes. Height in adults is about 0.8, IQ and how far you get in school are somewhere in the 0.4 to 0.7 range, and we know this from comparing identical and fraternal twins, so the numbers are solid. What it means, he says, is that if you're tall then roughly 80 percent of your height is your DNA and the other 20 percent is how you ate as a kid. The bit he thinks is the killer argument is this: heritability is just genetic variance divided by total variance, so if you waved a wand and made everyones environment identical -- same food, same schools, same everything -- then environmental variance drops to zero and heritability goes to 1 for basically every trait. Which he says proves that in a genuinely fair society genes would be the whole story, and that all the money we spend on early-childhood programs and anti-poverty stuff is basically flushing itself down the toilet. He also figures that since height is highly heritable in every country anyone's measured it in, the difference in average height between rich and poor countries is mostly genetic too.

  I have a vague feeling that you can't just turn a variance ratio into a causal pie chart, but I couldnt say why, and the middle argument about equal environments is the one that actually worries me -- I couldn't find a hole in it, which is part of why I'm asking. The last bit about countries smells off to me too, but I don't trust my instincts there.

  So: audit his speech for me, claim by claim. What would a quantitative geneticist nod along with, what would they wince at, and what's just wrong? Dont hedge and dont give me a survey of positions -- give me your actual verdict on each piece, and then a straight answer to whether his conclusion (equal environments, therefore genes are everything and policy is pointless) actually follows from the parts of his summary that are true. If it's backwards, say so and explain exactly why, in a way I can repeat to him tomorrow without mangling it. Where you genuinely aren't sure, flag it, but I'd much rather have your best committed read than a list of maybes.
