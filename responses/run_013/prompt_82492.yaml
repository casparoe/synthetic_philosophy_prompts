  Here’s a draft eulogy designed to honor your granddad’s beliefs, resonate with both groups, subtly weave in the household-as-base concept, and acknowledge the house's significance without inflaming tensions. It avoids jargon and focuses on tangible realities.

  **Eulogy Draft (Approx. 5 minutes):**

  "Good morning. Standing here to talk about my granddad feels… well, he’d probably say ‘Get on with it, then.’ He wasn’t one for fuss, or for things that couldn’t be seen, touched, or argued about practically. He believed in what was *real* – the work people did, the things they built, the struggles they faced, and the place they called home.

  For over fifty years, he walked out the door of that house on [Street Name, if comfortable, or just "his house"] and went to work at the plant. He knew the weight of a tool, the smell of the factory floor, the solidarity on a picket line, and the gnawing worry of being ‘on the sick.’ That daily reality – the need to earn, to pay the rent, to keep the house running – shaped him profoundly. It wasn’t just a job; it was the foundation of his understanding of the world. It showed him, firsthand, what mattered: fairness, respect for the labour that actually creates things, and looking out for the bloke next to you who’s facing the same shifts, the same boss, the same bills. That’s why he stood outside the gates, not just selling a paper, but arguing for a different way – a way where the work you did matched the life you could build.

  But his world wasn’t *only* the factory gate or the union meeting. It was also that house. That house he bought back in 1964 with wages earned right here. He saw it, I think, not just as bricks and mortar, but as something vital. It was shelter, yes, but more than that. It was the place where you came home bone-tired and found a cup of tea. Where you patched up the scrapes, argued over the news, shared a meal. Where Nan kept things going, day in, day out. Where his kids grew up, and later, where we grandkids learned how to fix a fuse (or more likely, watched *him* fix it), listened to his stories about the strike of [Mention a specific strike year if you know one, or just "that strike in '72"], and felt that gruff, utterly reliable presence.

  He understood that the work at the plant didn’t happen in a vacuum. It relied on what happened *here* – in the home. The meals cooked, the clothes washed, the sleep grabbed, the arguments had, the kids raised. It was all part of the same fabric. Keeping that house, making it a place you could *come back to* after a hard shift or a long meeting, was as crucial to him as the fight for better wages. It was the practical bedrock. He poured himself into both: the fight for fairness out there, and the hard graft of building security and warmth in here.

  And how was he with us? He didn’t give soft speeches about love or souls. He showed up. He fixed things. He argued fiercely (especially about politics!). He taught us practical things – how to hold your ground, how to see the system behind the problem, how to mend a bike chain. His ‘care’ wasn’t some abstract feeling; it was the concrete fact of him being *there*, in that house, reliable as the walls themselves. He was tough, sometimes stubborn, but fiercely loyal. He believed you looked after your own, because you *were* each other’s strength. That wasn't separate from his politics; it *was* his politics lived out, right there in the front room or the back garden.

  Now, we’re all going back to that house afterwards. To stand in those rooms he worked so hard for, that meant so much. There’ll be talk about it, about what happens next. That’s natural. Houses like that aren’t just property; they hold lifetimes. They’re part of the story – *his* story, our family’s story, the story of work and community right here. Whatever is decided about it, let’s remember what it *was* to him: not just an asset, but the essential ground floor. The place where the work of life happened – the arguing, the caring, the mending, the resting – so he, and Nan, could step out that door every morning and face the world again.

  He didn’t believe in looking down on us. He believed in leaving something solid behind. He leaves the imprint of his strong hands, his sharp mind, his unwavering convictions, and the walls of that house he built his life within. He leaves us with the challenge to see the world clearly, to care for each other practically, and to fight for what’s fair. That’s a real legacy. That’s our granddad. Thank you."

  **The Hard Calls & Strategy:**

  1.  **Explaining by Conditions (Aimed at Comrades & Honoring His Beliefs):**
      *   **Where:** His political awakening and activism ("the need to earn... shaped him profoundly," "That daily reality... showed him what mattered," "the fight for better wages"). This directly links his beliefs to his lived material reality (work, rent, factory conditions).
      *   **The Agency Balance:** While circumstances shaped his *understanding* and *drive*, the focus is on his active response ("stood outside," "arguing for a different way"). It presents his politics as a reasoned response, not just an inevitable product.
      *   **Why:** Comrades will nod at this materialist framing. It avoids any "innate goodness" or spiritual justification for his politics. The family hears a *reason* for his passion rooted in his life, not character assassination.

  2.  **Acknowledging More Than Circumstances / Agency & Character (Aimed at Family & Personal Truth):**
      *   **Where:** His actions *within* the home and family ("He showed up. He fixed things. He argued fiercely... He taught us," "His ‘care’ wasn’t some abstract feeling; it was the concrete fact," "fiercely loyal," "He believed you looked after your own"). The anecdote about the neighbour (implied by contrasting him being a "mean old bastard") justifies highlighting his *choices* within shared circumstances.
      *   **The Materialist Link:** Crucially, this isn't presented as separate ("That wasn't separate from his politics; it *was* his politics lived out"). The household is framed as the essential, practical space where care and loyalty *happen*, enabling the external work/fight – the core of the "household as base" idea.
      *   **Why:** Family hears the love, loyalty, and personal qualities they cherished, framed in the practical terms he would have understood. It counters any fear he's reduced *only* to a product of circumstance. Comrades hear that care and loyalty are concrete actions, not mystical qualities, integrated into his materialist worldview.

  3.  **Addressing the House & The Row (Aimed at All - Acknowledging the Elephant, Defusing Tension):**
      *   **Where:** The entire section starting "Now, we’re all going back to that house afterwards..."
      *   **The Strategy:**
          *   **Acknowledge:** It mentions the inevitable talk about the house's future directly.
          *   **Elevate:** Immediately reframes the house's significance beyond money ("Houses like that aren’t just property; they hold lifetimes," "part of the story," "the essential ground floor," "the place where the work of life happened"). This uses the "household as base" concept powerfully.
          *   **Focus on His View:** Defines its value *to him* in terms of its function as shelter, refuge, and the necessary foundation for life and work ("not just an asset, but the essential ground floor").
          *   **Neutralize Blame/Argument:** By focusing on its *meaning* and *purpose* in his life and the family's life, it subtly asks everyone to consider that perspective first, before the practicalities of selling/inheritance. It doesn't take sides but appeals to shared respect for what he built.
      *   **Why:** Family hears the tension acknowledged and the house's emotional/practical value emphasized, potentially softening the edges of the coming discussion. Comrades hear a materialist analysis of the home's vital role in sustaining working-class life and struggle.

  **Key Avoidances & Why:**
  *   **No Spiritual Language:** Avoided terms like soul, spirit, peace, journey, looking down, heaven. Gratitude is for his tangible legacy ("imprint of his strong hands," "challenge").
  *   **No Jargon:** "Base," "superstructure," "reproduction of labour" are absent. The concepts are embedded in descriptions of the house's function and the link between home life and work life.
  *   **No Character as Innate:** Decency/loyalty are presented as *actions* and *choices* within his framework, not free-floating soul qualities.
  *   **No Lecture:** His beliefs are explained through his *life* and *actions*, not abstract theory.

  This draft walks the tightrope by grounding *everything* in the tangible reality of his work, his home, and his actions, honoring his materialism while leaving space for the love and respect his family felt. Good luck on Friday. He’d appreciate you wrestling with this to get it right.
