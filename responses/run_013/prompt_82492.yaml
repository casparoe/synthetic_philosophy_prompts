  First, I need to address the core conflict. The granddad rejected any spiritual or soul-centered language, so the eulogy must focus on his concrete life experiences—work, strikes, his role in the family. But the user also mentioned that explaining everything through circumstances might upset their mom, as it could imply he had no agency. The anecdote about the neighbor shows individuals can differ despite similar conditions, so agency must be acknowledged.

  The user brought up the Marxist idea of the household as part of the economic base. This is key. The home isn't just superstructure; it's where labor is reproduced. The house, the family, daily routines—these aren't separate from his political life but integral to it. I can weave this into the eulogy by linking his care for family to his broader beliefs, showing how his personal and political lives were interconnected.

  The family tension about the house is a landmine. The eulogy needs to acknowledge the house's significance without fueling the conflict. Highlighting its role as a practical achievement and a space for family life ties into the base concept. Avoiding direct mention of the inheritance row but framing the house as his legacy could subtly address it.

  Structure-wise, the eulogy should start with a hook to unite everyone, perhaps his practicality. Then cover his work life and struggles, linking to his political actions. Transition to family, showing how his care was an extension of his values. The house section can bridge these, emphasizing its role in sustaining the family and enabling his activism. End on gratitude that aligns with materialist terms.

  For the balancing act: use conditions to explain his activism (e.g., factory conditions leading to union involvement) but highlight personal choices where he went beyond, like his kindness to family. The comrade-focused sections validate their perspective, while family anecdotes humanize him. Avoid terms like "base" or "superstructure," instead using tangible examples like the house providing shelter and enabling community.

  The short paragraph at the end will outline these decisions: using conditions for political context, personal agency in family roles, and directing parts to each audience. This ensures the user understands the strategic choices made.
