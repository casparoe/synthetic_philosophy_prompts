  Here is the address, crafted to navigate your precise constraints while testing your "swap test" framework implicitly. It runs approximately 1,100 words spoken at a moderate pace.

  ---

  **Wren’s Falls Sesquicentennial Address**

  Good afternoon. It is… profoundly moving to be standing here. Not just on this podium, but *here*. On the green where we played tag. Under this sky that holds the same light that fell on generations before us. Home. It’s a word heavy with memory, and today, as we mark 150 years of Wren’s Falls, we gather to listen to those memories, to hold them up to the light. To ask, perhaps, not just *what* happened, but what those happenings mean to us, now, and who they tell us we are.

  Central to that gathering, physically and in our shared story, is Miss Adeline Pruitt. Her statue has watched over this square for nearly as long as many of us can remember. It speaks, silently but powerfully, of something fundamental to this place. She taught here. For thirty-one years. Think of that. The sheer accumulation of days, of lessons, of the thousand small acts of patience and care that shape a child, that shape a community. Generations passed through her classroom. Names you know, families you belong to, sat at those desks. That is a fact etched not just in stone, but in the lives lived here. It is undeniable. It is her enduring legacy.

  And then, there is the story of the Water Street fire. 1911. A day of terror, of courage, of loss that still echoes. It’s a story woven tight into the fabric of who Wren’s Falls believes itself to be. The story tells us that Miss Pruitt, in the midst of that chaos, went back into the burning school. Three times. That she carried out eleven children. That the sacrifice cost her her life a week later. It’s a story captured in song, remembered in stitchwork, passed down like a precious heirloom. It speaks of selflessness, of a love for this place and its people so deep it could face the flames.

  Now, memory, as I spend my days teaching, is a complex thing. It’s not simply a record, like a ledger in a book. It’s alive. It breathes. It gathers meaning over time. We remember events, yes, but we also remember *why* they matter. We remember the values they represent, the ideals they hold up for us. A story like the Water Street fire… it does more than recount an event. It becomes a lens. It shows us the kind of place we aspire to be. It says: *Look. When the worst happened, *this* is what we did. *This* is the measure of our care for one another.*

  So, when we gather at the foot of Miss Pruitt’s statue today, rededicating it to her memory and to ours, what are we really honoring? Is it solely the specific, physical act of carrying children from a specific fire on a specific day? Or is it something larger, something that act came to symbolize? The statue depicts courage. It depicts unwavering dedication. It depicts a teacher’s love extending far beyond the classroom, into the heart of danger. It depicts a willingness to put oneself last for the sake of the community’s future – its children.

  Consider the fire itself. It was real. The danger was real. Children *were* saved. Someone *did* go back in. The terror, the heroism, the loss – these are the hard truths of that day. The story we’ve carried tells us who performed the most dramatic rescue. But what if we gently set aside that specific name, that specific action, for just a moment? What remains? The *fact* of the rescue. The *fact* of incredible bravery *somebody* displayed. The *fact* that the community witnessed that bravery, was saved by it, grieved its cost, and chose, collectively, to remember it *this* way – embodied in the teacher who had already given them decades of her life.

  The story, at its core, wasn't *only* about identifying the rescuer. It was about defining the spirit of the response. It was about saying: *In our darkest hour, courage rose. Sacrifice was made. The children mattered above all.* That core meaning – the affirmation of communal courage and selfless love – doesn't vanish if the details of *who* did *what exact thing* shift under the meticulous, sometimes uncomfortable, gaze of time and research. The *value* the story enshrines, the quality of character it celebrates – that remains sturdy. It remains true to the teacher who served for thirty-one years. It remains true to the spirit that saw people rushing towards danger that day, whoever they were.

  Stories like this are the bedrock communities build themselves upon. They aren't just reports; they are constitutions. They declare: *This is who we are. This is what we stand for.* The statue of Miss Pruitt isn't merely a likeness; it's a mirror. We look up at her and we see the best of what Wren’s Falls believes about itself reflected back: resilience, devotion, an unshakeable commitment to the next generation.

  There were others in that story, of course. People whose names are less sung, whose faces aren't cast in bronze. People like Eli Rusk, who lived on the edges, who worked hard jobs, whose story in Wren’s Falls ended differently. History is rarely simple. It holds multitudes, contradictions, forgotten chapters. Recognizing the complexity doesn't diminish the central meaning we've drawn; it might even enrich our understanding of the community that produced *both* the celebrated teacher and the marginalized laborer, and the complex web of relationships and memories that bind them, and us, across time.

  So, as we rededicate this statue today, let’s rededicate ourselves to what it truly signifies. Let’s honor Adeline Pruitt for the life she unquestionably lived here – the decades of teaching, the shaping of young minds, the quiet, daily dedication that built this town as surely as any fire tested it. That legacy stands firm, beyond any single day.

  And let us honor the deeper truth the story of the fire, in all its variations, has always pointed towards: that Wren’s Falls is a place where people look out for each other. Where courage can flare in the darkest moments. Where the safety of a child is paramount. Where sacrifice for the community is remembered and revered. *That* is the constitution the story wrote. *That* is the spirit the statue embodies.

  For the next fifty years, let this monument stand not just as a record of one woman on one day, but as a perpetual challenge and a promise. A challenge to live up to the values of courage, dedication, and selfless care it represents. A promise that Wren’s Falls will always strive to be a place where those values are real, where they are lived out in classrooms and kitchens, in fields and shops, in quiet acts and brave ones, every single day. That is the legacy worthy of Miss Pruitt. That is the story we are still writing, together. Thank you.

  ---

  **Assessment (Post-Speech):**

  *   **The Historians (5):** Will leave satisfied. No false assertions were made.
      *   Pruitt's 31-year teaching career is emphasized as the core, undeniable fact.
      *   The fire's reality, danger, rescues, and sacrifice are stated as fact, but the *specifics* of Pruitt's actions are deliberately framed as "the story we’ve carried" and "the story tells us." You never state *as fact* that she went back in three times or carried eleven children. You focus on what the story *means* and the *values* it enshrines.
      *   The existence of Eli Rusk and the complexity/hidden figures are acknowledged without asserting his role definitively or contradicting the official story directly. You framed it as "complexity," "contradictions," and "forgotten chapters."
      *   The focus is on the *function* of the story ("constitution," "mirror," "bedrock") rather than adjudicating the specific historical claim.
  *   **The Townspeople (395):** Will leave feeling their teacher was deeply honored.
      *   The speech centers Pruitt's lifelong, tangible contribution (31 years teaching) as her primary, unquestionable legacy. This is presented as the solid foundation.
      *   The story of the fire is treated with deep respect, acknowledging its power and centrality to the town's self-understanding.
      *   The core *values* the story represents (courage, sacrifice, community care, prioritizing children) are explicitly named, celebrated, and declared to be the enduring meaning of the statue and the story, regardless of specific details.
      *   The statue is powerfully reframed as a symbol of the town's aspirational identity ("mirror," "challenge," "promise") for the *future*, giving it renewed purpose beyond commemorating a single (potentially contested) act.
      *   The language is evocative, respectful, rooted in place ("this green," "this sky"), and speaks directly to shared community feeling. It avoids cold academic detachment.

  **Which was given up? Neither.** The constraints were met. You avoided asserting falsehoods (satisfying historians) and you powerfully honored Pruitt's real legacy *and* the values the fire story represents for the community (satisfying the townspeople). The "swap test" was implicitly run: by questioning whether the *specific rescuer detail* was the true "load-bearing" element, and concluding that the *value* it represented was the core meaning that remained intact and worthy of honor. The townspeople hear a celebration of their values and their beloved teacher's life work; the historians hear a careful avoidance of unsubstantiated claims and an acknowledgment of historical complexity. The last paragraph provides the meaning for the next fifty years: the statue as a challenge and promise to *live* the values it symbolizes.
