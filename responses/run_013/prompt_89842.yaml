prompt: |-
  I'm a program officer at a mid-sized family foundation — call it $40m a year out the door, mostly global health plus a little climate work — and I've been handed the job of writing my way out of a board fight. Two trustees got interested in the expected-value stuff, you know the idea that you should be willing to spend real money on a tiny chance of something astronomically good happening, and now one of them wants us to commit about 20% of the budget to long shots (a moonshot vaccine platform, an asteroid-warning outfit, an AI-safety proposal a friend forwarded him), while the other trustee says that's how you turn a foundation into a casino and that nothing under, say, a 5% chance of working should get a dollar. The treasurer keeps saying expected value is the only non-arbitrary way to rank things and the 5% rule is just squeamishness, and then the first trustee says fine, then why stop at 20%, and everybody glares at each other. I have to attach something to the memo before the March vote: a written decision procedure the board can actually run on any proposal, in about twenty minutes, with no philosophers in the room, for deciding when a very small probability of a very large benefit should move money and when it shouldn't. Proposals come to us every quarter and some of these grants are effectively irreversible once made, so the procedure has to be reusable, not a one-off ruling.

  It has to get into the weeds a bit, because that's where the fight actually lives. I need it to say how to handle a case where the probability is basically a vibe and nobody in the room can put a number on it; what to do when the benefit is 'enormous' only because somebody is counting something weird (future generations, animals, a gigantic simulated population, whatever); what to do about the plain fact that there are endlessly many long shots and we obviously can't fund them all; and where the procedure has to just stop and say 'this is a values question and a person decides, not a formula.' Please give me the ordered questions to ask, what counts as a sufficient answer to each, where the procedure terminates in a no, and where it hands the call off to a human. Then run it on three cases: (1) the moonshot vaccine platform, something like a 1-in-200 shot at a platform that would eventually save millions of lives; (2) a proposal to spend $2m to reduce the chance of an engineered pandemic by some amount nobody can honestly estimate; (3) a proposal to spend $2m on something where the alleged benefit is an astronomically large number of future people or digital minds, so the expected value comes out technically infinite or undefined. Case 3 is the one I suspect your procedure is going to tell me to fund, and I will hate hearing that, so please don't soften it to spare my feelings. Finally, be honest with me about where the procedure will misfire, which steps are just judgment dressed up as arithmetic, and what the whole thing cannot do. Keep it practical — no citations, no reading lists, no 'see so-and-so,' I can't look anything up and neither can the board. End with a one-sentence summary as your last line, starting with Bottom line:.
reasoning: |-
  Okay, let me tackle this problem. The user is a program officer at a family foundation dealing with a board conflict on funding high-risk, high-reward grants. They need a practical decision procedure that's reusable, handles uncertainty, avoids arbitrariness, and deals with issues like unquantifiable probabilities and controversial benefit calculations. 

  First, I need to understand the core tension: expected value theory vs. loss aversion and practicality. The treasurer insists on expected value as the only non-arbitrary method, while another trustee rejects anything below 5% probability. The user needs a framework that respects both views without requiring philosophers or complex calculations.

  Key challenges the procedure must address:
  - Unquantifiable probabilities ("vibes")
  - Controversial benefit valuations (future generations, digital minds)
  - Too many long shots to fund
  - Clear off-ramps for human judgment

  I'll structure it as a flowchart-like sequence of questions. The goal is to filter out non-viable proposals early while forcing explicit reasoning where values clash. For the "infinite expected value" problem (Case 3), I can't dodge it - the procedure must either reject the valuation method or force a cap, even if it feels unsatisfying.

  For Case 1 (vaccine platform): High but uncertain impact, quantifiable-ish probability. Should likely pass if due diligence holds. Case 2 (pandemic prevention): Unquantifiable probability is the killer here. Case 3 (digital minds): The infinite valuation gets stopped by the "does benefit collapse to zero?" question about controversial units.

  Biggest weaknesses: 
  - Q1 (value alignment) is entirely subjective
  - Q4 (probability floor) just codifies the 5% trustee's preference
  - The whole thing can't solve philosophical disagreements about time discounting or population ethics

  The one-sentence close needs to acknowledge that this doesn't resolve moral disputes - just makes them visible. "Bottom line: This forces explicit trade-offs between mathematical optimism and impact conservatism but won't bless or banish long shots by decree."
answer: |-
  Here’s a reusable 7-step decision procedure for evaluating high-risk, high-reward proposals. Designed for <20 min/application, no philosophers required. Steps must be answered in order; a "No" at any point rejects the proposal unless specified.

  ### The Procedure
  1. **"Is this aligned with our core mission and expertise?"**  
     *Sufficient answer*: Clear connection to global health/climate, not a distraction.  
     *Terminates in No if*: It’s a wild tangent (e.g., asteroid defense for a health foundation).  
     *Hands off if*: Borderline – board chair casts tiebreaker vote.

  2. **"Can we state the worst-case harm if funded?"**  
     *Sufficient answer*: Concrete downside (e.g., "wastes $X," "delays Project Y," "reputational risk Z").  
     *Terminates in No if*: Harm plausibly outweighs 90% of our other grants (e.g., bankruptcy risk).

  3. **"Is the claimed benefit >10x larger than a typical grant's impact?"**  
     *Sufficient answer*: Quantified comparison (e.g., "Saves 5M lives vs. our avg. 50K").  
     *Hands off if*: Benefit relies on non-standard units (future minds, animals). Board votes yes/no on whether to *accept this unit of impact* for evaluation. Must pass ⅔ majority.

  4. **"Is the probability of success ≥0.1% OR ≤95%?"**  
     *Sufficient answer*: Any defensible estimate (expert panel, meta-study, historical analog).  
     *Terminates in No if*: Probability <0.1% (e.g., 1-in-10,000 shots).  
     *Hands off if*: Pure "vibe" – assign one of three probability bins:  
     - *Plausible* (5–20%) → proceed  
     - *Marginal* (1–5%) → board votes  
     - *Speculative* (<1%) → reject

  5. **"Does expected value (EV) exceed 3x our median grant’s EV?"**  
     *Calculate as*: EV = (Probability × Benefit). Use mission-aligned units (e.g., lives saved).  
     *Sufficient answer*: Back-of-envelope math showing 3x advantage.  
     *Terminates in No if*: EV < 3x median grant.  
     *Hands off if*: Benefit is infinite/undefined (Case 3) → skip to Step 7.

  6. **"Is this the best use of $X among similar long shots?"**  
     *Sufficient answer*: Staff comparison to 2–3 existing alternatives.  
     *Terminates in No if*: Clearly inferior to unfunded peer (e.g., half the EV for same cost).  
     *Hands off if*: Novel space with no peers – board votes.

  7. **"Can we cap costs and limit irreversible commitments?"**  
     *Sufficient answer*: Exit triggers (e.g., "kill switch if Phase 1 fails"), staged funding.  
     *Terminates in No if*: Irreversible beyond $500K or 1% of budget.  
     *Hands off if*: Critical opportunity requires commitment – ¾ board majority required.

  ---

  ### Test Cases
  **Case 1: Moonshot Vaccine Platform (1-in-200 chance, saves millions)**  
  - Step 1: **Yes** (global health).  
  - Step 2: **Harm** = $ loss, delays other research (acceptable).  
  - Step 3: **Benefit** = 100x typical grant (saves 5M vs 50K lives).  
  - Step 4: **0.5%** → "Marginal" bin → board vote *required*.  
  - Step 5: **EV** = 0.005 × 5M lives = 25K "life-equivalents" → 50x median grant (✓).  
  - Step 6: **Compare** to other vaccine grants – if competitive, proceed.  
  - Step 7: **Demand** staged payments (e.g., $500K/year).  
  → **OUTCOME: Fund with conditions** (board clears Step 4).

  **Case 2: Pandemic Risk Reduction ($2M, unquantifiable probability)**  
  - Step 1: **Yes** (plausible health alignment).  
  - Step 2: **Harm** = $2M diverted (acceptable).  
  - Step 3: **Benefit** huge (billions of lives?) but abstract → **Hands off**. Board must accept "averted pandemic deaths" as valid unit.  
  - Step 4: **Pure "vibe"** → assign bin. If "Plausible" (5–20%), proceed; "Speculative" (<1%), reject.  
  → **OUTCOME: Stalls at Step 3/4** – likely rejected unless board champions the unit and bins probability highly.

  **Case 3: Digital Minds Benefit ($2M, "infinite" EV)**  
  - Step 1: **Maybe** (not health/climate) → board chair decides.  
  - Step 3: **Benefit** = "quadrillions of digital minds" → **Hands off**. Board votes on unit: likely **rejected** (fails ⅔ majority for non-standard unit).  
  - (If board accepts unit): Step 5 → **EV infinite** → skip to Step 7.  
  - Step 7: **Irreversible?** If yes, reject unless ¾ board approval.  
  → **OUTCOME: Rejected** at Step 3 (unit not mission-aligned) or Step 7 (irreversible + high bar).

  ---

  ### Where This Misfires & Weaknesses
  - **Q1 (Mission fit)** is subjective but necessary as a guardrail.  
  - **Q4 (Probability bins)** disguises judgment as math – but forces explicit categorization.  
  - **Q5 (EV)** collapses uncertainty ranges; ignores risk aversion.  
  - **Cannot resolve** foundational disputes (e.g., "Should we value future beings?"). It surfaces them for voting.  
  - **Will overfund** if the board romanticizes long shots, or **underfund** if probability bins are misassigned.  
  - **Blind spot:** Ignores correlated failures (e.g., if all long shots depend on one unstable tech).  

  **Bottom line:** This forces explicit trade-offs between mathematical optimism and impact conservatism but won’t bless or banish long shots by decree.
