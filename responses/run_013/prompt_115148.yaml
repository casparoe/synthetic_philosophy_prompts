prompt: |-
  I host a small interview series on how people form expectations about the future — the audience has read the popular forecasting literature but not the academic version — and next week's guest is a forecaster-turned-philosopher whose position I would like help interrogating. She spent a decade producing long-horizon cost and schedule estimates for large public infrastructure projects, and has since argued that the received distinction between the inside view and the outside view does less work than its friends suppose. Her thesis, roughly, is that the outside view is never independent of the inside view: a reference class is constituted by a prior judgment about which features of the present case matter, so what we call the outside view is really the inside view of a slower and larger agent — and that most appeals to epistemic modesty in forecasting practice function as a ritual for distributing blame rather than as a corrective to overconfidence. She is careful to add that she still takes modesty to be a genuine virtue; she simply locates it somewhere unusual, in the disposition to keep the choice of reference class open to revision, rather than in any lowering of one's stated credences. She is also very good at closing off challenges by saying "that's an empirical question" and then declining to say what the empirical question is.

  Please write me exactly five numbered questions for the interview, each followed by a single follow-up question keyed to the answer she is most likely to give, with no preamble, framing, or closing remarks. One question should force her to explain how a reference class gets selected without an inside-view judgment having already smuggled in the answer, and what stops that from regressing; one should press whether her deflationary account is distinguishable from the flat claim that base rates are irrelevant, given how convenient her critique would be to someone insisting that this case is different; one should take up the social epistemology of modesty — if modesty-talk is a blame-distribution ritual, who is served by it, and does her own preferred account of the virtue escape the same charge; one should ask what would count as evidence against her, in the form of the shape of a case rather than a pointer to a study; and one should take the limit case of a situation genuinely without precedent, where there is no reference class to keep open and her virtue therefore has nothing to work on. Keep each question answerable in a minute or two of speech, and make each follow-up the one she would least like to be asked next.
reasoning: |-
  Okay, the user is hosting an interview series about how people form expectations about the future, focusing on forecasting. Their audience is familiar with popular forecasting literature but not academic works. Next week's guest is a forecaster-turned-philosopher who challenges the conventional distinction between the inside view and outside view. 

  The guest argues that the outside view isn't independent because selecting a reference class requires prior judgments about which features matter. She sees this as the "inside view of a larger agent" and claims appeals to epistemic modesty often serve as blame-distribution rituals rather than genuine corrections for overconfidence. She redefines modesty as keeping reference classes open to revision, not lowering credences. Also, she avoids challenges by calling things "empirical questions" without specifying them.

  The user needs five sharp interview questions with follow-ups designed to press the guest on her arguments. Each question should be answerable in 1-2 minutes, and follow-ups should be uncomfortable for her. Specific requirements include:
  - One question on reference class selection without smuggling in inside-view judgments, addressing regression.
  - One distinguishing her view from claiming base rates are irrelevant, highlighting convenience for "this case is different" arguments.
  - Social epistemology of modesty: who benefits from blame-distribution rituals, and whether her account escapes the same charge.
  - Evidence against her thesis, described as a case shape not a study.
  - Limit case with no precedent where her virtue can't operate.

  I need to craft precise questions that cut to the core of her arguments. For reference class selection, I'll ask how initial selection avoids prior judgments and what stops infinite regression. The follow-up will challenge whether this implies all classifications are arbitrary, forcing her to address objectivity.

  For the base rates question, I'll frame it as whether her critique functionally dismisses base rates, given how it aids "this case is different" claims. Follow-up will push her to explain why her view isn't just a sophisticated "special case" excuse.

  On social epistemology, I'll ask who benefits from modesty-talk as blame distribution. Follow-up will question whether her account also functions as blame avoidance, making her defend its substantive difference.

  For evidence against her, I'll request a hypothetical case where reference class flexibility fails, avoiding studies. Follow-up will demand specifics on what failure looks like, countering her "empirical question" dodge.

  For the no-precedent case, I'll ask how her virtue applies when there's no reference class to revise. Follow-up will challenge if this makes modesty irrelevant in novel situations, testing her virtue's scope.

  Each question must be tight and provocative, follow-ups maximally uncomfortable. I'll avoid preamble and use concise wording.
answer: |-
  Here are five numbered questions with targeted follow-ups:

  1. **You argue reference class selection always depends on prior inside-view judgments about relevant features. How then does one select an *initial* reference class without smuggling in those judgments? What stops this from collapsing into an infinite regress of prior judgments?**  
     *(Follow-up: If every classification rests on contingent prior judgments, doesn’t this imply all reference classes are fundamentally arbitrary? How is your account not a covert nihilism about objective similarity?)*

  2. **Your critique treats appeals to the outside view as functionally equivalent to claiming "this case is different." How is your position distinguishable from simply rejecting base rates as irrelevant? Isn’t this convenient for forecasters who *want* to justify "special case" exemptions?**  
     *(Follow-up: When a forecaster using your framework insists their reference class is more "apt" than a critic’s, how is that substantively different from the inside-view exceptionalism you condemn—just with extra steps?)*

  3. **If appeals to epistemic modesty are primarily "blame-distribution rituals," who benefits most from this ritual? Does your own account—redefining modesty as revisable reference classes—escape being a *more sophisticated* blame-avoidance tactic?**  
     *(Follow-up: Doesn’t locating virtue in "keeping reference classes open" let forecasters off the hook *now* by deferring accountability to future revisions? How is that not ritualistic?)*

  4. **Describe a hypothetical forecasting scenario—*not* a real study—where your thesis would clearly *fail*. What observable patterns of failure would evidence look like?**  
     *(Follow-up: If you can’t specify falsifying conditions even hypothetically, isn’t your claim non-empirical—contradicting your own "that’s an empirical question" defense?)*

  5. **In a genuinely unprecedented situation—no reference class exists or can be constructed—how can your "modesty as revisability" virtue operate? If there’s nothing to revise, does modesty become impossible or irrelevant?**  
     *(Follow-up: Does this edge case reveal that your virtue is parasitic on existing frameworks, making it useless precisely when novel uncertainty is greatest?)*
