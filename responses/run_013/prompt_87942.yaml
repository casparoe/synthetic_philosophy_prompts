prompt: |-
  I'm in a reading group on causation and before we read another paper I want the spec sheet, not another theory. So pretend you're a philosopher of science who works on causal modeling and counterfactuals and who actually knows the difference between whats settled and whats just one camp's house style. Think it through before you write — maybe start by brainstorming the cases that always get thrown around (preemption, late preemption, overdetermination, double prevention, switching, omission, causation by omission, trumping, transitive causation, cause vs mere condition, token vs type) and then build the list, don't just dump the cases.

  What I want is the desiderata: what does any theory of causation have to deliver to count as adequate — which cases it has to get right (and what the case is doing, i.e. which intuition it's protecting), which distinctions it must not collapse (cause vs condition, cause vs correlation, the strength/degree stuff, actual vs hypothetical, singular vs general), which results from elsewhere it can't contradict (the stuff about determinism and indeterminism, whether causation needs laws, the fact that we can't intervene on the past, whatever you think is genuinely binding here). For each requirement say why it's a requirement and not just a prejudice of one camp.

  Then the part I actually care about: is any subset of these jointly unsatisfiable? I suspect the counterfactual people and the interventionist people are quietly trading one desideratum for another and neither of them says so out loud. If theres a pair that can't both be met, say which and what the trade is.

  Two things I want it to handle that I never see in the standard lists, so I'm making you take a position on them:

  (a) determinable vs determinate causation: the vase breaks because it's red, or because it's crimson — which one is the cause, and does a theory have to decide, or is that a false choice?

  (b) here's a case I made up in the shower: two switches on the wall, each wired to the light, and there's a hidden mechanical link so that pushing either one physically pushes the other too, so in the actual world both go down together. Nothing distinguishes them — no asymmetry in the wiring, no timing difference, no counterfactual difference between them. The light comes on. Did switch 1 cause it, switch 2, both, or neither? I want to know what each family of theory is forced to say and whether the case is a genuine counterexample or just symmetric overdetermination with extra steps.

  At the end tell me which single requirement does the most work — knocks out the most contenders — and be honest about which of these requirements are things everyone in the area definately agrees on versus things that are just one tradition's commitment. Don't sell me a contested view as the consensus; flag where the disagreement actually lives. Skip the scorecard of particular authors, I'll do that in the group.
