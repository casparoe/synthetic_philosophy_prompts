  Okay, the user writes a wonky newsletter and is working on a piece about whether omissions can be causes. They've got a summary from a philosopher friend claiming omissions can't literally be causes because there's no event to connect, leading to the idea that "causation by omission is a fiction." The user is skeptical about the jump from metaphysics to morality and wants to unpack which parts of the friend's argument hold water.

  First, I need to break down the philosopher's claims clause by clause. The core metaphysical assertion is that omissions aren't events, so they can't be causes. In philosophy, events are typically understood as occurrences, while omissions are absences. So the "no event to connect" point is a standard argument in certain camps, like those influenced by Davidson or Lewis. But not everyone agrees—there are process theorists or dispositionalists who might argue that absences can be causal.

  The user questions if "almost everyone agrees" is accurate. From what I know, this is an oversimplification. While the event-based view is prominent, there's significant debate. Papers like Schaffer's "Causes as Probability Raisers" or Beebee's work on omissions show the field isn't settled. The philosopher friend might be representing one dominant school but ignoring others.

  Next, the move from "omissions aren't causes" to "blame is based on duty to rescue" seems logical, but the user senses smuggling. The key here is whether the metaphysical claim is necessary for the moral conclusion. Actually, you can have duties to rescue without denying omission causation. For instance, even if omissions cause harm, we might still need separate moral principles to explain blame. So the metaphysics might not be doing heavy lifting in the moral argument. The "fiction" part is where the philosopher adds a polemical twist, which specialists might criticize as conflating descriptive and normative claims.

  The user also asks if failures can't make a difference. This is crucial. Causation isn't the only way something matters. Counterfactual dependence is different. Even if omissions aren't causes, they can still be difference-makers. For example, if the lifeguard had looked, the child wouldn't have drowned. That counterfactual is morally relevant regardless of the metaphysical status of omissions. So the philosopher friend might be conflating causation with difference-making.

  The user's deeper needs: They want to present a nuanced view without jargon. They need to know which parts of the argument are solid, which are contested, and where the leaps happen. They’re not looking for a bibliography but clear guidance on structuring their piece. Highlighting the distinction between causation and difference-making could resolve their unease about the "fiction" claim. Also, emphasizing that duty to rescue stands independently from metaphysics strengthens their inclination to buy that part.

  Specialists might wince at the oversimplification of consensus and the conflation of causation with counterfactuals. The moral conclusion doesn't solely rely on the metaphysics; it's a non sequitur. The user should keep the duty to rescue and deflationary parts but challenge the necessity of the metaphysical claim for the moral argument. Pointing out that omissions can be difference-makers without being causes might satisfy their skepticism about the "fiction" idea.

  In summary, the user should retain the duty to rescue and the critique of casual blame attribution but question the blanket denial of omission causation and the alleged consensus. Clarifying the difference between causation and counterfactual dependence would strengthen their piece and address the smuggled premise they sensed.
answer: |-
  Let's dissect your philosopher friend's gloss clause-by-clause, highlighting what's standard, what's contested, and what might make specialists wince. The core tension is between metaphysics (what causation *is*) and our moral/legal practices (how we *talk* and *judge*).

  **The Gloss Dissected:**

  1.  **"Almost everyone working on this now agrees that omissions can't literally be causes..."**
      *   **Acceptability:** **Significant Overstatement / Misleading.** This is **not** consensus. It's a *major* and *active* debate. While the "no literal causation" view is prominent and well-defended (e.g., by David Lewis, Helen Beebee, Jonathan Schaffer), there are equally prominent *defenders* of omission-as-causation or something very close (e.g., Ned Hall, Michael Moore, Carolina Sartorio, Phil Dowe - process theory). "Almost everyone agrees" is **not true** and would make many specialists wince. It's one influential *camp*, not the settled view.

  2.  **"...because causing something requires a real connection between two events, and with an omission there's no event there to be connected..."**
      *   **Acceptability:** **Standard Simplification of One Major Argument.** This captures the core *event-based* or *production* view of causation dominant in much analytic metaphysics (inspired by Davidson, Lewis). The idea is causation involves energy/momentum transfer, physical processes, or counterfactual dependence *between distinct events*. An omission (a non-event) lacks the ontological "stuff" to be part of this chain. This *is* the primary metaphysical argument against omission-as-cause used by that camp. A popularizer would fairly summarize this argument this way. Specialists might quibble about nuances of "event" or "connection," but the core point is standard for that view.

  3.  **"...a non-happening can't make anything happen."**
      *   **Acceptability:** **Pithy Restatement of #2.** This is a common slogan for the view. It's rhetorically effective. Specialists might note it slightly begs the question by defining "make happen" in a way that excludes absences from the start.

  4.  **"So when the doctor fails to check the chart and the patient dies, what caused the death is the disease; the failure is just a fact about what she didn't do."**
      *   **Acceptability:** **Controversial Application.** This *follows logically* **if** you accept the premises in #2. From that perspective, the positive causal chain runs through the disease process. The omission is a *background condition* or an *enabling condition* that allowed the disease to cause death unimpeded, but not a cause itself. However, defenders of omission-causation would strongly reject this, arguing the doctor's failure *was* a necessary part of the causal sequence leading to death (e.g., without it, death wouldn't have occurred *in that way, at that time*). The "just a fact" language downplays its significance, which is part of the polemic.

  5.  **"That's why the law treats acts and omissions differently..."**
      *   **Acceptability:** **True (as description), But Disputed (as justification).** The law *does* often treat acts and omissions differently (e.g., no general duty to rescue). The gloss *claims* the metaphysical distinction *explains* this legal distinction. This is highly contested. Many argue the legal distinction is primarily based on *pragmatic* and *moral* concerns (e.g., liberty, burdensomeness of duties, difficulties of proof for omissions), *not* metaphysics. The metaphysics might be *invoked* to justify the legal distinction, but it's not necessarily the *reason* for it. A specialist might wince at the implication that metaphysics directly *dictates* legal doctrine here.

  6.  **"...and why we need a separate moral principle, something like a duty to rescue, to explain why she's blameworthy at all."**
      *   **Acceptability:** **Widely Accepted Core Insight (even by opponents).** This is the *strongest* and most important part. **Everyone agrees** that the *moral blameworthiness* for an omission hinges crucially on the existence of a **duty, obligation, or normative expectation** that was violated. Blame doesn't flow *directly* from causation alone (if it even exists), but from the failure to fulfill a duty *plus* the causal connection (however analyzed). This is crucial. Even those who think omissions *can* be causes agree that a duty is essential for blame. This is the part you should definitely keep.

  7.  **"Which means all those cases where we casually say someone caused a death by standing by are really cases where we're blaming them for failing to prevent a harm that something else caused..."**
      *   **Acceptability:** **Plausible Redescription (from this view), But Not Exclusively True.** From the "no omission-cause" view, this is how they *reinterpret* our ordinary language. It accurately describes their position. However, defenders of omission-causation would say we *can* correctly say they caused it (or contributed causally) *by* failing to prevent it. The key point is: **Both camps agree the person is blameworthy *because* they failed in a duty to prevent a harm caused by something else.** The disagreement is purely over whether the word "cause" literally applies to the *failure itself*.

  8.  **"...so causation by omission is basically a fiction we invented to make our blame look more objective than it actually is."**
      *   **Acceptability:** **The Polemical, Deflationary Punchline (and where the smuggling happens).** This is the gloss's most controversial claim.
      *   **What's Acceptable:** It correctly identifies that our *attribution* of causation in omission cases is deeply tied to our *normative judgment* about duty and blame. The causal talk isn't happening in a vacuum; it's driven by the moral context. It highlights how causal language can be used rhetorically to bolster blame.
      *   **The Smuggling:** This is where the leap happens. The argument conflates the *metaphysical question* ("Is omission literally causation?") with the *functional role* of causal language ("Why do we *use* causal language here?"). Here's the hidden premise: **"If X isn't *literally* a cause, then attributing causation to X is *necessarily* a 'fiction' used only to make blame seem objective."** This is highly questionable.
          *   **Counter 1:** Even if omissions aren't *metaphysical* causes, they can be *difference-makers* (see below). Saying "the failure caused the death" might be shorthand for "the failure made the crucial difference to the outcome, given the duty," which isn't necessarily a *fiction* about objectivity, just a different conceptual framework.
          *   **Counter 2:** Defenders of omission-causation argue it *is* literal and objective (within their framework), so it's not a fiction at all.
          *   **Counter 3:** The "fiction" claim downplays the very real *explanatory* and *counterfactual* force of omissions, reducing them purely to subjective blame markers.
      *   **Specialist Wince Factor:** High. It's overly reductive and dismissive of the genuine complexities and alternative views. It turns a nuanced metaphysical debate into a claim about psychological/social manipulation. The link from "not a literal cause (metaphysics)" to "only a fiction for blame (morality/language)" is the weak jump.

  **Your Specific Questions Answered:**

  1.  **Is the metaphysical claim doing real work in the moral conclusion? Is there a hidden premise?**
      *   **Answer:** **Minimal direct work, and yes, a hidden premise.** The core moral conclusion ("we need a duty to explain blame") stands *independently* of the metaphysics. You need a duty for blame *whether or not* you think omissions are causes. The metaphysical claim *is* doing work in justifying the *reinterpretation* of causal language ("it's *really* just blaming for failing to prevent") and leading to the "fiction" claim. The hidden premise is: "If X isn't a literal cause, then calling X a cause *must* be a non-literal fiction used solely for rhetorical blame-strengthening."

  2.  **Is "almost everyone agrees" true?**
      *   **Answer: No.** It's a live and vigorous debate between well-established positions. It's a significant overstatement.

  3.  **Is "no event to connect" the actual reason, or just one version?**
      *   **Answer:** It is **the central, defining reason** for the dominant *event-based/production* view of causation that denies omission-causation. It's not just "one version"; it's the core ontological objection. Other arguments (e.g., problems of profligacy - if omissions cause, then *every* non-prevention causes) often build on this foundation.

  4.  **If omissions aren't causes, does it follow that a failure can't *make a difference*?**
      *   **Answer: Absolutely Not. This is Crucial.** This is where the gloss potentially confuses things. **Causation and Difference-Making are distinct concepts.** Even fervent deniers of omission-*causation* (like Schaffer) usually agree that omissions can be **difference-makers** or **counterfactually necessary conditions**. The core idea: "If the doctor *had* checked the chart (and acted appropriately), the patient *would not have died* (at that time, in that way)." The omission *made a difference* to the outcome. This counterfactual dependence is often what people *mean* by "cause" in ordinary language and moral/legal contexts, even if metaphysicians distinguish it from "production" causation. The moral significance (blame based on duty) flows primarily from this *difference-making* or *counterfactual dependence*, *not* necessarily from the metaphysics of production. **The gloss potentially conflates "cause" (in a production sense) with "made a difference" (counterfactual sense).** You can (and many do) hold that omissions aren't *productive causes* but absolutely *are difference-makers*, and that difference-making is what matters morally/legally.

  **What Sentences to Keep (with Nuance):**

  1.  **Keep (and emphasize):** The core insight that **moral blame for omissions fundamentally depends on the violation of a duty or obligation** (Point 6). This is robust and essential.
  2.  **Keep (but contextualize):** The idea that **some influential metaphysical views deny omissions are literal causes** because they see causation as requiring a connection between events/processes, and omissions aren't events (Points 2 & 3). *State it as one major view, not consensus.*
  3.  **Keep (as a provocative conclusion, but identify it as such):** The **deflationary idea** that our *talk* of "causing by omission" is often **tightly bound up with our assignment of blame** based on duty, and serves to make that blame seem more grounded in objective facts about the world than it might be (Point 8's core *observation* about language/psychology, minus the strong "fiction" claim). Frame it as: "One provocative conclusion drawn by some is that..."
  4.  **Crucially Add:** The clarification that **even if omissions aren't *metaphysical causes*, they can still be *difference-makers*** – the failure *changes the outcome* in a counterfactually dependent way. This difference-making, combined with the violated duty, is the real source of moral responsibility, regardless of the metaphysical label.

  **The Core Tension Simplified for Your Piece:**

  The philosophical debate is about whether "cause" is best understood as a *productive push* (where omissions don't fit) or as a *difference-making condition* (where they often do). However, **everyone agrees that when we blame someone for an omission, it's because:**
  1.  **They failed to do something they had a duty to do.**
  2.  **That failure made a crucial difference to a bad outcome happening (it was counterfactually necessary).**

  Your philosopher friend's gloss leans heavily on the "productive push" view and uses it to reinterpret all causal language about omissions as a blame-justifying "fiction." While this highlights the link between causal talk and moral judgment, it potentially dismisses the real, objective significance of the *difference* the omission made in the world. The duty is essential, but the difference the omission made is what gives that duty its tragic weight in the specific case. Keep the duty, keep the deflationary insight about the *rhetoric* of causation, but don't let the metaphysics erase the concrete, world-altering impact of the inaction itself as a difference-maker.
