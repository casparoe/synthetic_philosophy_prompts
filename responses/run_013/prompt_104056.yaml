prompt: |-
  I sit on the research risk review committee at a mid-sized university. We're the people who have to weigh in before a lab publishes something with obvious dual-use potential, releases a dataset or a tool, or starts a line of work a funder has flagged. We meet once a month, 45 minutes, usually four or five items, and most of the people in the room are not specialists in whatever the item is about — there's a chemist, a lawyer, a comms person, me. Right now we basically improvise, and the same fight eats the meeting every time. Someone says we shouldn't let X happen because X is bad if it happens at all. Someone else says fine, but if we say no, a lab in another country, or a company, or some hobbyist will just do it, so what does our no even accomplish. Then a third person says well if everyone reasons like that then of course it gets done. We never resolve it, we take a vote, and the vote tracks whoever spoke last.

  I recently ran into an idea that I think is about exactly this, the unilateralist's curse. As I understand it: when lots of different agents can each independently do some thing, and the thing is bad whenever anyone does it, then the sheer number of possible doers makes it likely at least one of them will do it — even though most of them, individually, think it shouldn't be done. And I half-remember there being a proposed remedy, something like a principle of conformity — act the way you think the consensus of people in your position would act, instead of on your own read of the situation. I don't remember it well and I might be mangling it, so please don't lean on the name or on anyone's version of it. Work from the shape of the idea, and if the idea as I've stated it is confused, say so and fix it.

  What I want from you is a decision procedure my committee can actually run. The questions to ask, in order, and what counts as a good enough answer to each one; where the procedure stops and the answer is no; and the places where it has to stop and hand the call to a person because it's a values question, not a facts question. It has to tell us when the curse actually applies and when it doesn't — in particular I think there must be a mirror-image case where the thing is good if at least one agent does it, and then everyone hanging back is the failure, so the whole logic flips and someone should just go. It has to handle the fact that we usually have no idea how many other actors could do the thing, or how likely they are to. And it has to say something about private information: if I know something the others don't, does that license me to ignore the conformity step, or is the whole point that it doesn't, and I have to put the information in the room first. Keep it to something we can run in a few minutes per item, with no numbers, for an audience that hasn't read anything about this. The output should be a recommendation plus a short written record we can defend, and the VP for research signs off at the end.

  Then run it on three items, including one where it gives an answer I won't like:

  1. A lab wants to publish a paper describing a method for making a common organism considerably more dangerous. Nothing is actually released into the world but the method becomes public.
  2. A group wants to openly release a piece of software that several other teams are racing to release anyway, and that has an obvious benign use and an obvious ugly one.
  3. Our own group's project — a study whose result I have private, unpublished reason to think is both safe and genuinely valuable, but which the procedure, followed honestly, would probably tell me to shelve.

  Finish with what the procedure can't do and where judgment can't be squeezed out of it, and give me the one-page version we can paste into the minutes.
reasoning: |-
  Okay, let me unpack this user's problem. They're on a university research risk review committee struggling with recurring deadlocks about dual-use research approvals. The core issue seems to be the "unilateralist's curse" dynamic where individual rationality leads to collectively bad outcomes. 

  Hmm, the user describes classic curse symptoms: endless debates about whether withholding approval matters when others might proceed anyway. They need a practical framework to break this cycle - something operable in 45-minute meetings by non-specialists. Interesting constraints: no quantitative analysis, must handle unknown actor counts, and must address both harmful and beneficial actions.

  The user's three test cases are revealing. Case 1 involves publishing hazardous methods, Case 2 is about open-sourcing dual-use software, and Case 3 is their personal conflict of interest. That last one suggests they want a procedure robust enough to constrain their own biases. Smart.

  I recall the unilateralist's curse literature. The user's "principle of conformity" reference points to solutions like Bostrom's proposed norms. But academic theory won't help here - they need concrete questions in sequence. The mirror-image case they mention (where inaction is harmful) is crucial too - that's the "bystander's omission" problem.

  For the framework... let me sketch the key components:
  First, we'd need to determine if the curse even applies - is this about preventing harm or enabling benefit? Then assess whether the action is globally bad (curse applies) or globally good (reverse curse). For unknown actor probabilities, we'd need qualitative heuristics like "would other actors likely proceed?" 

  The private information aspect is tricky. The procedure should force disclosure before conformity assessment, otherwise it defeats the purpose. But how to operationalize that without numbers? Maybe through burden-of-proof questions.

  For outputs, the committee needs auditable reasoning trails. And the VP sign-off requirement means we must distinguish factual assessments from value judgments clearly.

  Testing against their cases... 
  For the pathogen method paper (Case 1), the curse likely applies strongly. 
  For the software release (Case 2), the reverse curse might dominate due to benign uses. 
  Their personal project (Case 3) will test whether the procedure can override private knowledge - as it should when that knowledge isn't shared.

  The limitations section is vital. This framework can't replace subject expertise or resolve deep value conflicts. It's strictly for curse-type dilemmas. We should flag that prominently in the one-page summary.

  Biggest challenge: making this feel natural in committee discussions while preventing gaming. The question sequence must flow logically but resist manipulation. Maybe anchor each step with concrete examples during rollout.
answer: |-
  Here's a decision procedure designed to break your deadlock, incorporating the unilateralist's curse & its remedy ("Conformity Assessment"), structured for speed, clarity, and defensibility. It avoids numbers, focuses on key questions, and forces deliberation on the core dynamics.

  **The "Collective Harm/Benefit Assessment" (CHBA) Procedure**

  1.  **Harm/Benefit Threshold:**
      *   *Question:* "If *everyone* capable did this action, would the *net* effect on society be significantly harmful OR significantly beneficial?" (Ignore likelihood; focus on inherent nature).
      *   *Good Answer:* Clear consensus on harm/benefit (e.g., "Harmful: widespread dangerous organisms." / "Beneficial: foundational research tool released openly."). If truly ambiguous or neutral, stop: **Recommend Approval** (default to research freedom).
      *   *Stop Here If:* Answer is "Beneficial" - proceed to Step 4 (Reverse Curse). Answer is "Harmful" - proceed to Step 2.

  2.  **Applicability of the Curse?**
      *   *Question:* "Is it plausible that other actors (labs globally, companies, hobbyists) could independently decide to do *this specific action* (or achieve the same outcome) reasonably soon? Why/why not?"
      *   *Good Answer:* Evidence-based reasoning (e.g., "Yes: Method is straightforward, organism common, papers on similar enhancements exist." / "No: Requires unique equipment only we have, deep niche expertise."). Burden of proof on claiming *no other actors*.
      *   *Stop Here If:* Strong consensus that **no other plausible actors exist** - **Recommend Denial** (Your decision *prevents* the harm). Otherwise, proceed to Step 3.

  3.  **Conformity Assessment (Remedy for the Curse):**
      *   *Question:* "Setting aside our specific views for a moment: What do we believe the *consensus judgment* of *responsible, similarly situated institutions* (e.g., peer university committees, relevant ethics boards) would be regarding approving this action? Would they generally approve or deny?"
      *   *Good Answer:* Discussion focused on norms, standards, perceived best practices in the field/institution type. (e.g., "Deny: Similar papers withheld, recent guidelines warn against this." / "Approve: Common practice to publish methods like this, seen as fundamental science."). *Crucially, private info must be shared NOW if relevant to this consensus view.*
      *   *Output:* **Recommendation aligns with the perceived consensus.** (e.g., If perceived consensus is DENY, **Recommend Denial**). *Rationale: Acting against the perceived consensus increases the chance someone acts, worsening the curse. Conforming reduces that risk.*

  4.  **Reverse Curse Assessment (For Globally Beneficial Actions):**
      *   *Question (After Step 1 identified "Beneficial"):* "Is there a significant risk that if *we* don't act (approve/release), *no one else* will, and the potential benefit will be lost? Or is it highly likely someone else will act soon anyway?"
      *   *Good Answer:* Evidence-based reasoning on likelihood of others acting (e.g., "Likely others will: Multiple teams racing, open-source community active." / "Unlikely others will: Niche area, high resource barrier, we have unique capability."). Burden of proof on claiming *no one else will act*.
      *   *Output:*
          *   If **significant risk no one else acts** -> **Recommend Approval** (Prevent omission failure).
          *   If **highly likely others will act** -> **Recommend Approval** (Default to research freedom, benefit achieved regardless).
          *   *Note:* Denial is rarely justified for globally beneficial actions unless there's a *specific* overwhelming harm *caused specifically by us doing it* that outweighs the benefit.

  **Handling Private Information:**
  *   Private information *must* be disclosed during the relevant step where it impacts the assessment (usually Step 2 or 3) *if* the holder believes it meaningfully changes the committee's answer. The holder states the *nature* of the info and its *implication* (e.g., "I know Lab X abandoned similar work due to safety concerns, suggesting others might not proceed."). The committee then weighs this *as shared information*.
  *   **Key Principle:** The conformity remedy (Step 3) relies on shared understanding. Holding back relevant private info undermines the entire process. The procedure forces disclosure before conformity is assessed.

  **Output & Record:**
  1.  **Recommendation:** Approve / Deny / Approve with Modifications (e.g., delayed release, controlled access).
  2.  **Short Rationale:** 2-3 sentences citing the key CHBA steps and reasoning (e.g., "Step 1: Net harmful. Step 2: Other actors plausible. Step 3: Consensus of peers would likely deny. Recommendation: Deny." OR "Step 1: Net beneficial. Step 4: Others likely to act regardless. Recommendation: Approve.").
  3.  **VP Sign-off:** Based on defensible rationale and process.

  ---

  **Testing the Procedure on Your Items:**

  1.  **Pathogen Enhancement Method Publication:**
      *   **Step 1 (Harm/Benefit):** Harmful. (Consensus: Publication enables easier creation of dangerous organisms).
      *   **Step 2 (Curse Applicable?):** Plausible other actors? YES. (Method may be replicable elsewhere; organism common; knowledge diffuses).
      *   **Step 3 (Conformity Assessment):** What would peer committees do? Likely consensus: DENY. (Growing norms against publishing easily weaponizable methods without strong countervailing benefit; biosecurity concerns prominent). **Recommendation: DENY publication.** *Rationale: Net harmful action; other actors likely; responsible consensus would deny to reduce curse risk.*
      *   *Why you might not like it:* You think the science is important. The procedure prioritizes collective harm mitigation over individual scientific contribution in this specific high-risk, multi-actor scenario.

  2.  **Dual-Use Software Release:**
      *   **Step 1 (Harm/Benefit):** BENEFICIAL. (Consensus: Obvious significant benign use outweighs potential ugly use; releasing enables beneficial research/development).
      *   **Proceed to Step 4 (Reverse Curse):** Risk no one else acts? LOW. (Multiple teams racing to release). **Recommendation: APPROVE release.** *Rationale: Net beneficial action; others highly likely to act soon regardless; withholding gains nothing.*
      *   *Potential Modification:* If ugly use is *extremely severe and imminent*, committee might argue Step 1 is ambiguous/harmful, triggering Step 2/3. But absent that, approval is clear.

  3.  **Your Group's Study (With Private Knowledge):**
      *   **Step 1 (Harm/Benefit):** Based on *publicly available info*, the committee likely assesses it as potentially harmful or ambiguous (leading to default approval) OR net beneficial. **Assume they see risk (Step 1: Harmful) or proceed cautiously (Step 1: Ambiguous -> Default Approve).**
      *   **Crucial Point:** You *must* disclose your private knowledge *if* it significantly impacts any step.
          *   **If knowledge suggests net benefit is HUGE/unique:** Disclose *nature/implication* in Step 1 (e.g., "Unpublished data shows uniquely high potential benefit outweighing perceived risks"). This may shift Step 1 to "Beneficial", triggering Step 4.
          *   **If knowledge suggests others WON'T do it (Reverse Curse):** Disclose *nature/implication* in Step 4 if reached (e.g., "Private comms indicate competing teams abandoned similar work").
          *   **If knowledge suggests NO other actors (Curse):** Disclose *nature/implication* in Step 2 (e.g., "Unique methodology/data means others cannot replicate this soon").
      *   **If You Disclose:** Committee weighs the *shared* info. Outcome *might* shift to approval.
      *   **If You Withhold:** The procedure runs on public info. If it results in **DENY** (e.g., Step 1 Harmful -> Step 2 Others Plausible -> Step 3 Consensus Deny), you *must* **Recommend SHELVE**.
      *   **The Hard Truth:** The procedure forces you to either (a) disclose your private justification to the committee, making it shared, or (b) accept the outcome based only on public information. **Withholding the info and overriding the procedure based on it violates the core conformity principle and reintroduces the curse risk.** The procedure likely forces you to shelve it *unless* you disclose and persuade the committee.

  ---

  **What This Procedure CAN'T Do (Limitations & Judgment Areas):**

  1.  **Define "Harmful"/"Beneficial":** Step 1 is inherently values-based. The committee must argue and reach consensus. The procedure provides the framework, not the answer.
  2.  **Quantify Likelihoods:** Steps 2 & 4 rely on qualitative, evidence-informed plausibility arguments ("plausible", "likely", "significant risk"). Judgment is required.
  3.  **Define "Responsible Consensus":** Step 3 requires interpreting community norms and standards. Judgment and knowledge of the field are essential.
  4.  **Handle Overwhelming, Unique Harms/Benefits:** If an action's harm/benefit is *overwhelmingly* concentrated on the acting institution itself (good or bad), the multi-actor logic weakens. Judgment needed on scope of impact.
  5.  **Resolve Deep Value Conflicts:** If committee members fundamentally disagree on core values (e.g., absolute openness vs. precaution above all), the procedure provides structure but not resolution. This needs higher-level discussion.
  6.  **Assess Intent or Malice:** Focuses on outcomes and capabilities, not motivations.
  7.  **Replace Deep Expertise:** For highly technical risks, specialist consultation *before* CHBA is still crucial. CHBA integrates that input into the collective action framework.
  8.  **Guarantee Correctness:** It mitigates a specific bias (unilateralist's curse) but doesn't eliminate all error. It aims for *defensible* collective reasoning.

  ---

  **The One-Page Summary for Committee Minutes**

  **University Research Risk Review Committee: Collective Harm/Benefit Assessment (CHBA) Procedure**

  **Purpose:** To provide a structured, defensible framework for reviewing research activities with potential for significant societal harm or benefit, specifically addressing the "unilateralist's curse" (where independent actors increase the chance of harmful actions) and the "bystander's omission" (where inaction prevents beneficial actions).

  **Procedure Steps (Per Agenda Item):**

  1.  **Harm/Benefit Threshold:** "If *everyone* capable did this, net societal effect: Significantly HARMFUL, BENEFICIAL, or NEUTRAL/AMBIGUOUS?"
      *   BENEFICIAL: Go to Step 4.
      *   HARMFUL: Go to Step 2.
      *   NEUTRAL/AMBIGUOUS: **Recommend APPROVAL** (Default to research freedom).

  2.  **Curse Applicability?** "Plausible other actors could/would do this independently soon? Why?"
      *   STRONG CONSENSUS NO OTHER ACTORS: **Recommend DENIAL** (Prevent harm).
      *   PLAUSIBLE OTHER ACTORS: Go to Step 3.

  3.  **Conformity Assessment:** "What would the *consensus* of *responsible peer institutions* do? Approve or Deny?"
      *   **Recommendation ALIGNS with perceived consensus** (Mitigates curse). *Private information MUST be disclosed if relevant before this step.*

  4.  **Reverse Curse Assessment (For BENEFICIAL actions only):** "Significant risk that if *we* don't act, *no one else* will, losing the benefit?"
      *   SIGNIFICANT RISK NO ONE ELSE ACTS: **Recommend APPROVAL** (Prevent omission).
      *   OTHERS LIKELY ACT REGARDLESS: **Recommend APPROVAL** (Benefit achieved).

  **Output:**
  *   Clear Recommendation (Approve/Deny/Modify).
  *   Concise Rationale (Cite key steps: e.g., "Step 1: Harmful. Step 2: Others plausible. Step 3: Consensus deny. Rec: Deny.").

  **Key Principles:**
  *   Focus on collective outcomes and norms.
  *   Burden of proof high for claims of "no other actors" (Step 2) or "no one else will act" (Step 4).
  *   **Private information relevant to the assessment MUST be disclosed to the committee during the relevant step.** Holding it back invalidates the conformity safeguard.
  *   Values judgments (esp. Step 1) require committee deliberation and consensus.

  **VP Role:** Reviews recommendation and rationale for process adherence and defensibility before final sign-off.

  **(Procedure adopted: [Date])**
