prompt: |-
  I'm a novelist, five books in, and the new one moves between Marseille, Lagos and a small town in County Kerry, so I'm writing a lot of characters from cultures that aren't mine. I keep hitting the same wall: a beta reader tells me a character "reads like a national stereotype", I overcorrect, and then he reads like an American with a funny name. What I want from you is the philosophical debate about national character -- whether it's even a coherent notion, and whether there's any legitimate way to generalise about a people -- turned into a procedure I can actually run while drafting. A short ordered list of questions to put to a trait before I let it into a character, what counts as a good enough answer at each step, where the procedure stops with a flat no, and where it says this is a values call and I have to decide it myself. It needs to hold up in the case where the trait is statistically true of the group but I'm using it to explain one individual, and in the case where the generalisation is about my own people and I'd never let an outsider write it. Then run it on two: a Kerry farmer who's taciturn and evasive about his feelings, and a Lagos trader who's relentlessly on the make. One of those should come out of it looking worse than I'd like -- dont spare me. And tell me honestly what the procedure can't do, where a novelist's judgment just has to take over. I'd rather you didn't tell me to avoid the problem altogether; the book doesn't work if everyone's from nowhere. Write it in British English.
reasoning: |-
  Okay, the user is a novelist with five books under their belt, tackling a new project spanning Marseille, Lagos, and County Kerry. They're struggling with balancing cultural authenticity without falling into stereotypes. The core issue is how to handle national character in fiction—whether it's even valid and how to generalize responsibly. 

  First, I need to unpack their request: they want a practical procedure, not just theory. A step-by-step checklist they can apply while drafting. The examples given (Kerry farmer, Lagos trader) are classic tropes where stereotypes lurk—so testing the procedure on those will show its teeth. 

  Hmm. The underlying tension here is between statistical reality and individual humanity. A Kerry farmer might statistically be more taciturn than a London banker, but making that trait define him risks caricature. The user's beta readers are flagging this pendulum swing—from stereotype to oversanitised "American with a funny name." That’s a clear pain point. 

  Philosophically, I’m drawing on Anthony Appiah’s idea of "counter-stereotypes." Stereotypes aren’t just wrong; they’re reductive because they ignore internal diversity. But avoiding all generalizations flattens cultural texture. The sweet spot is "tendencies, not destinies"—cultural pressures that shape but don’t determine. 

  For the procedure, I’ll structure it as a gatekeeper: interrogate each trait before it enters the character. Questions must force specificity. "Why this trait?" → "How is it expressed?" → "Is it contextual?" → etc. The Lagos trader example will fail if "on the make" is just "hustle culture 101," but pass if tied to Lagos’s specific market hierarchies or personal history. 

  Ah, and the user’s note about self-representation is crucial. We’re more forgiving when insiders write their own tropes (e.g., an Irish writer depicting Kerry reticence). The procedure must flag this double standard explicitly—step 7’s "insider/outsider test." 

  Where the procedure can’t help: voice. Does the Kerry farmer’s evasion read as poetic melancholy or wooden cliché? That’s craft, not checklist. I’ll warn that this tool identifies hazards but can’t replace the novelist’s ear for nuance. 

  Finally, British English as requested: "colour" not "color," "trousers" not "pants." Easy enough. The tone should be pragmatic—no academic jargon, just a workshop-ready scalpel. 

  Right, let’s build this.
answer: |-
  Right. This is one of the tightest ropes a novelist walks. The philosophical debate boils down to this: **"National Character" is largely a myth when treated as an inherent, defining essence shared by *all* members of a group.** It's reductive, often born of historical power imbalances (who gets to define whom?), and ignores vast internal diversity – class, region, generation, personality, individual experience.

  **However, cultures *do* exist.** They generate shared contexts, histories, social pressures, common reference points, and sometimes, observable *tendencies* in behaviour or communication styles, often as adaptations to environment or history. The key is **statistical tendency within a specific context, not universal law or inherent essence.**

  Your task is to navigate the space between the statistical reality of cultural influence and the unique individuality of the person. Here’s your drafting procedure, framed as questions to interrogate *any* trait you're considering assigning based on perceived cultural association:

  **The Cultural Trait Interrogation Procedure (British English)**

  1.  **Why *This* Trait for *This* Character?**
      *   *Question:* Is this trait emerging organically from *this specific character's* background, experiences, occupation, relationships, and personal history within their cultural context? Or am I reaching for it because it fits a vague, pre-existing notion of "what people from X are like"?
      *   *Good Enough Answer:* The trait demonstrably links to the character's specific life: their job (e.g., market pressures in Lagos), their social role (e.g., isolation on a Kerry farm), a pivotal past event (e.g., economic hardship shaping ambition), or a direct response to their immediate environment. *Not* just "because they're Irish/Nigerian".
      *   *Flat No:* If the *only* justification is "It's what they're known for" or "It adds local colour". Stop. Rethink the character's fundamentals.

  2.  **Is it Expressed Specifically or Generically?**
      *   *Question:* *How* exactly does this trait manifest in *this* character? What are its unique textures, nuances, and contradictions? Does it feel like a lived behaviour or a label?
      *   *Good Enough Answer:* Concrete, observable details: *How* is the Kerry farmer evasive? (Silence punctuated by cryptic weather remarks? Changing the subject to cattle? A specific, guarded body language?). *How* does the Lagos trader hustle? (Specific negotiation tactics? Exploiting *which* market inefficiencies? A particular kind of networking banter?). Avoid broad terms like "taciturn" or "hustler"; show the *specific mechanics*.
      *   *Flat No:* If you can only describe it using the broad, culturally loaded term itself ("he's just... stoic"; "she's always... hustling") without unique specifics. The trait remains an abstraction.

  3.  **Is it Contextual or Constant?**
      *   *Question:* Does this trait manifest differently depending on the situation, relationship, or the character's internal state? Or is it a monolithic, unchanging default setting?
      *   *Good Enough Answer:* The trait has dimensions. The Kerry farmer *might* be more open with his dog, his priest, or after three pints than with strangers or officials. The Lagos trader might be fiercely loyal and generous within her family network while ruthlessly competitive in business. The trait is a *tool* or *reaction*, not the whole personality.
      *   *Flat No:* If the trait defines the character in *every* interaction, regardless of context. This flattens them into a caricature.

  4.  **Is it Balanced by Contradictions?**
      *   *Question:* What traits exist in this character that *counter* or *complicate* the culturally-associated one? What makes them an individual who happens to be from X, rather than an ambassador *for* X?
      *   *Good Enough Answer:* Clear evidence of internal conflict, unexpected passions, vulnerabilities, humour, or values that run counter to the perceived cultural trait. The "taciturn" farmer might write surprisingly eloquent, private letters. The "relentless" trader might have a deep, non-commercial love for traditional music or a hidden fear of failure driving the hustle. The trait isn't the sole engine.
      *   *Flat No:* If the culturally-associated trait explains *almost everything* about the character, leaving no room for messy individuality. They become a function of the stereotype.

  5.  **Is the Generalisation Statistically Plausible *and* Nuanced?**
      *   *Question:* If relying on a perceived tendency (e.g., Irish emotional reserve, Nigerian entrepreneurial drive):
          *   a) Is this tendency well-documented/anecdotally observed as a *common adaptation* to specific historical/social/economic pressures *within that specific context* (e.g., rural isolation, colonial/post-colonial economic realities, specific religious influences)?
          *   b) Am I aware this is a *tendency*, not a rule, and that significant internal variation exists?
      *   *Good Enough Answer:* You can point to the *specific pressures* (e.g., historical land dispossession fostering caution; complex, competitive informal economies demanding hustle) that make the tendency understandable *as an adaptation*, not an inherent quality. You acknowledge it isn't universal.
      *   *Flat No:* If the justification relies on vague, essentialist notions ("the Celtic soul," "African vibrancy") or lazy pop-culture tropes. If you cannot articulate the *why* behind the tendency beyond "it's just how they are".

  6.  **Does it Serve *This* Story & Character?**
      *   *Question:* Is this trait genuinely necessary for the character's role in *this specific narrative*? Does it drive plot, reveal theme, or create essential conflict/depth *for them*? Or is it decorative "authenticity"?
      *   *Good Enough Answer:* The trait has a clear narrative function: the farmer's evasiveness creates a mystery or obstacle central to the plot; the trader's drive is the engine of their character arc or a key source of conflict/opportunity. It's woven into their *story*, not just their passport.
      *   *Values Call:* If it's primarily for "flavour" or "atmosphere". Proceed with extreme caution. Does it *significantly* enhance the reader's understanding of *this character's* world and struggles in a way unique details couldn't? Or could it be cut without damaging the core character/plot? This is where authorial judgement is paramount.

  7.  **The Insider/Outsider Test (The Double Standard Check):**
      *   *Question:* If this trait were applied to a character from *my own* primary cultural background (e.g., an American character), would it feel reductive or insulting? Would I let an outsider write *my* people this way?
      *   *Good Enough Answer:* Honestly confronting the potential double standard. Recognising that traits often read very differently when applied by an outsider versus an insider. Proceeding only if the trait passes the previous six steps *rigorously* and feels earned through specificity and context, mitigating the outsider's potential for reductive portrayal.
      *   *Values Call:* This is *always* a values call. It demands deep empathy and research. If it fails the "would I let an outsider write *us* this way?" test, it almost certainly shouldn't be used, *unless* the previous steps have built such a strong, specific, nuanced justification that it transcends the potential for offence. Err on the side of caution.

  **Applying the Procedure: Kerry Farmer (Taciturn & Emotionally Evasive)**

  1.  **Why?** Specific: Lives on isolated farm, harsh weather, economic precarity, history of land struggles fostering caution about outsiders/officials. Possibly a generational communication style modelled from father. **Pass.**
  2.  **Specifics?** Shows, doesn't tell. Answers questions about feelings with observations on the rain or the state of a field. Long silences aren't empty; they're heavy with unspoken worry. Communicates affection through actions (mending a fence, sharing a quiet pot of tea) not words. **Pass (if shown well).**
  3.  **Contextual?** More open (though still reserved) with lifelong neighbours, the vet, maybe a sibling. Might explode in rare, shocking fury when pushed too far. Different with animals. **Pass.**
  4.  **Contradictions?** Sings loudly alone in the barn? Writes surprisingly tender letters to a faraway relative? Has a fierce, protective love for the land expressed through meticulous care, not words. Deeply emotional but channeled into specific outlets. **Pass (if included).**
  5.  **Plausible Nuance?** Statistically plausible tendency in rural Ireland, linked to isolation, historical wariness, a cultural style valuing "doing" over "saying". But *not* universal; plenty of talkative Kerry folk! **Pass (with nuance acknowledged).**
  6.  **Serves Story?** His evasiveness creates a barrier the protagonist must overcome; his stoicism makes a rare emotional moment powerful; it reflects the landscape's harsh beauty. **Pass.**
  7.  **Insider/Outsider:** Risky as an outsider. But passing steps 1-6 rigorously (especially 2,3,4) mitigates this. Showing the *why* and the *specifics* avoids reducing him to just "the quiet Irishman". **Conditional Pass (Depends on Execution).**
      *   **Verdict:** **Can work IF rendered with deep specificity, context, contradiction, and narrative purpose. Avoids stereotype by grounding it in his *specific* life and landscape, not his nationality.**

  **Applying the Procedure: Lagos Trader (Relentlessly on the Make)**

  1.  **Why?** Vague: "Because it's Lagos, everyone hustles!" Needs more. *Specific:* Operates in Balogun market with fierce competition, high rents, unreliable supply chains. Supports extended family in village, paying school fees. Sees hustle as survival *and* path to respect. Fear of being left behind in a rapidly changing megacity. **Needs Work.**
  2.  **Specifics?** Generic "hustler" label is weak. *How?* Masters complex "market codes" for bargaining? Exploits specific import loopholes? Constantly juggling micro-loans? Has a *particular* charm offensive for customers vs. ruthless tactics with rivals? Network built on *specific* favours owed? **Needs Work.**
  3.  **Contextual?** Is the drive constant? Or does she relax with close family? Show genuine non-transactional friendship? Have moments of exhaustion or doubt? Is the "on the make" specifically tied to business, or does it poison *all* interactions? **Needs Work.**
  4.  **Contradictions?** Is she *only* defined by the hustle? Where's her humour, her kindness to a struggling apprentice, her faith, her love of Nollywood films, her frustration with corruption she also exploits? What vulnerability drives the relentless need? **Needs Work.**
  5.  **Plausible Nuance?** Hustle (*"japa"* mentality, survival in informal economy) is a well-documented *adaptation* to specific Nigerian socio-economic realities. BUT, portraying it as the *defining* trait of a Lagosian is wildly reductive. Lagos is also academia, arts, tech, immense religious fervour, community solidarity. **Conditional Pass (on tendency) but fails nuance if trait dominates.**
  6.  **Serves Story?** *Could* – if her drive is central to her arc (e.g., ambition vs. ethics, the cost of success). But if it's just "colour" or to show "Lagos energy," it's weak and risky. **Needs Strong Narrative Justification.**
  7.  **Insider/Outsider:** Highly sensitive. "Relentlessly on the make" is a common, often damaging stereotype applied to Africans/Nigerians by outsiders. Passing step 1-6 poorly will almost certainly result in a caricature. **High Risk of Failure.**
      *   **Verdict:** **Comes out looking worse.** "Relentlessly on the make" as a primary descriptor fails multiple steps (1-Vagueness, 2-Generic, 3-Constant?, 4-Lacks Contradiction, 5-Lacks Nuance about diversity, 7-High Outsider Risk). It risks being a national stereotype unless *radically* transformed by deep specificity, clear context, contradiction, and a narrative purpose that *demands* this specific expression of drive in *this* character. Currently, it reads like the exact trap your beta reader warned about.

  **What the Procedure CAN'T Do (Where Your Judgment Takes Over):**

  1.  **Voice & Authenticity of Detail:** It can flag if a trait is stereotypical, but it can't write the authentic *texture*. Does the farmer's evasiveness *sound* right? Does the trader's negotiation feel real? This requires deep research (reading local literature, interviews, immersion if possible), sensitivity readers *from those specific places/backgrounds*, and your skill in rendering it.
  2.  **The "Weight" of Representation:** As an outsider, your portrayal carries different baggage. The procedure highlights the risk (Step 7), but you must *feel* the responsibility. Are you contributing to a tired narrative or offering a fresh, human perspective? No checklist absolves you of this ethical burden.
  3.  **Subliminal Bias:** It helps surface conscious choices, but we all harbour unconscious biases. The procedure is a conscious tool; staying vigilant for unconscious assumptions requires constant self-reflection and external feedback.
  4.  **The "Magic" of Character:** Ultimately, characters transcend checklists. Does this person feel *real*? Do they surprise you? Does their cultural background feel like a lived-in world shaping them, rather than a costume they wear? This is novelistic intuition, honed by craft, empathy, and rigorous application of tools like this procedure.

  **Final Thought:** Don't avoid culture; deepen it. Move beyond "national character" to **specific cultural contexts** (the *particular* farm in Kerry, the *specific* market in Lagos). Focus on how those contexts create pressures, opportunities, and shared languages that your *individual* characters navigate, resist, embrace, or are shaped by in their unique ways. Your procedure is the sieve; your research, empathy, and craft are the materials you pour through it. Good luck with the book.
