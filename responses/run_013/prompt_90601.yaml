  I need to find the flaw in this argument about iterated elimination of weakly dominated strategies. The argument claims that it should be path-independent, just like strict dominance, but I know from standard game theory that it's not. So, where does this go wrong?

  First, let's look at step (1). It says that a rational player never plays a strictly dominated strategy, and this includes domination by mixed strategies. That seems correct. A strictly dominated strategy can never be a best response.

  Step (2) gives an example where a pure strategy is strictly dominated by a mixed strategy but not by any pure strategy. In the matrix, M is dominated by the 50-50 mixture of T and B. Against L: mix gives (3+0)/2 = 1.5 > 1, against C: (0+3)/2 = 1.5 > 1, against R: (3+3)/2 = 3 > 1, so yes, strictly better. And no pure strategy dominates it; T loses to M in C (0 vs 1), B loses to M in L (0 vs 1), so only the mixture works. Okay.

  Step (3) talks about iterated deletion for strict dominance. It says that the order doesn't matter because once a strategy is dominated, removing other strategies can't make it undominated. If something dominates it with all strategies present, it still dominates with fewer, since the dominator is at least as good everywhere, and removing strategies only means fewer points where it might be compared, but since it's strictly better, it remains better. So for strict dominance, iterated deletion is path-independent. That's standard.

  Now step (4) says that the same argument should work for weak dominance. It replaces "strictly" with "weakly" and says that a weakly dominated strategy is never better than its dominator, so dropping it loses nothing, and deleting other strategies shouldn't affect the domination.

  But here's the problem: with weak dominance, when you remove a strategy, it might affect whether another strategy is dominated or not, because weak domination can be sensitive to the set of opponents' strategies.

  In weak domination, a strategy s is weakly dominated by s' if s' does at least as well as s for all opponent profiles, and strictly better for some. But when you remove some opponent strategies, the "some" where it's strictly better might be removed, so s' might no longer dominate s in the smaller game.

  The argument in (3) says: "deleting further strategies only removes some of those profiles; it cannot manufacture a profile against which the struck-out strategy beats its dominator." For strict domination, since it's strictly better against every profile, removing some profiles doesn't create a point where it's worse, and since it was better everywhere, it remains better in the remaining set.

  But for weak domination, it might be that against some profiles, s' is only equal to s, and strictly better only against profiles that might be deleted. If you delete the strategies where s' is strictly better, then in the remaining game, s' might only be equal to s everywhere, so it doesn't dominate anymore.

  Therefore, when you iteratively delete weakly dominated strategies, the order can matter because which strategies you delete first can affect whether the condition for weak domination holds later.

  The argument claims that "nothing deleted could have been part of a rational outcome," but with weak dominance, a weakly dominated strategy can still be rational if the dominator isn't played or something, but more importantly, for the iterative process, it's about what survives.

