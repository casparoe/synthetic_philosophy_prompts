  First, the base rates: Group A at 25% prevalence, Group B at 10%. That difference must stem from real-world factors without lecturing. Housing instability for Group B feels right - connects stress to hypertension through lived experience. 

  For the model calibration: scores must be perfectly group-wise calibrated. That means for every score s, P(hypertension|score=s, group) = s. Essential for the impossibility to hold. 

  Now the conflict: when selecting top 20% scores, Group A gets 40% recall (sensitivity) but only 75% specificity. Group B gets 80% specificity but dismal 25% recall. The community org's complaint about unequal access (false negatives) versus the department's efficiency focus (false positives) creates the moral tension. 

  Key scenes: 
