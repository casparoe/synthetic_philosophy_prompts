  Avoiding pitfalls:
  No techno-fixes. The discomfort must linger. The housing instability mention early on sets up that prevalence isn't random - it's the real target. The analyst's final line about "what we're counting" should hang in the air. 

  Word count management: 
  - Opening (setting/housing instability): 300w 
  - Community complaint scene: 200w 
  - Data meeting with calculations: 700w 
