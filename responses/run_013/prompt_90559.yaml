answer: |-
  ## The Impossible Fix

  The air in the City Health Department conference room tasted stale, recycled through decades of budget cuts and difficult choices. Dr. Anya Sharma, lead data scientist for the Hypertension Early Detection Program (HEDP), traced a finger over the projected spreadsheet on the wall. Across the table sat Maria Chen, head of Community Outreach, radiating frustrated energy. Beside her, Liam, the department’s quietly persistent philosopher-in-residence, watched with unnerving stillness. At the head, Director Barnes tapped his pen, a metronome counting down to an impossible decision.

  "So," Maria began, voice tight. "North Heights Community Alliance is furious. Again. They see the HEDP invite lists. They see mostly Riverbend residents getting screened. They see their folks – folks *they know* are stressed, working three jobs, living in moldy apartments – getting passed over. They call it systemic bias. And frankly, Anya? It looks that way."

  Anya took a slow breath. She’d built the model herself. She was proud of it. "Maria, the model isn’t biased *in the way they think*. It’s genuinely calibrated. Hand someone in Riverbend a score of 0.3, and 30% have undiagnosed hypertension. Hand someone in North Heights the *same score*, and 30% have it. We’ve audited it relentlessly."

  "But the *outcome*," Maria pressed. "Riverbend gets 70% of the slots! Their prevalence is higher?"

  "Substantially," Anya confirmed. She clicked, bringing up a slide. "Best estimates: Hypertension prevalence in Riverbend is about 25%. In North Heights… it’s closer to 10%." She paused, letting the number hang. Liam stirred slightly, but remained silent. Everyone knew the *why* didn’t live in the model: the grinding stress of North Heights, the food deserts, the generations of disinvestment Maria alluded to, the housing instability Anya saw reflected in fragmented medical records. The hypertension *was* there, but woven deeper into the fabric of life, less likely to have been casually caught before.

  "So," Director Barnes cut in, "the model finds the sickest, most efficiently? We screen the top scorers, we catch the most hypertension. That’s the point. Fixed slots, limited budget."

  "But *fairness*," Maria countered. "North Heights feels ignored. Their sick people are just as sick! Why should they have a lower *chance* of being caught because their neighborhood got screwed for decades? Can’t we adjust the model? Make the scores… mean the same chance of *getting an invite* for a sick person in both places?"

  Anya felt the familiar wall rise. "Maria… it’s not that simple. Let me show you." She pulled up a simple simulation on her laptop, projecting it. "Imagine 1000 people in each group. Riverbend: 250 truly hypertensive, 750 healthy. North Heights: 100 truly hypertensive, 900 healthy."

  She pointed to the model’s output. "The model gives scores from 0 to 1. Because it’s perfectly calibrated *within* each group, the score distribution reflects the underlying risk. Riverbend has many more high scorers. To fill our fixed slots – say, the top 20% highest scorers city-wide – we take the top 200 scores."

  She ran the numbers:
  *   **Riverbend Top 200:** High prevalence means lots of high scorers. Say it catches 100 of their 250 hypertensive individuals (**Sensitivity = 40%**). But it also flags 100 healthy people (**False Positive Rate = 100/750 ≈ 13.3%**).
  *   **North Heights Top 200:** Lower prevalence means fewer high scorers. Only 50 of their 100 hypertensive individuals make the top 200 city-wide (**Sensitivity = 50%**). And it flags 150 healthy people (**False Positive Rate = 150/900 ≈ 16.7%**).

  "See?" Anya pointed. "North Heights actually has slightly *better* sensitivity right now – 50% vs 40%. But that’s only because we’re taking a *city-wide* top cut. Their healthy people get flagged *more* often (16.7% vs 13.3%) because we have to dig deeper into their score distribution to fill the slots, hitting scores that, while calibrated (a score of 0.15 in North Heights means 15% chance), are more likely to be false positives *because the underlying prevalence is low*."

  Maria frowned. "But their *sick* people… 50% found vs Riverbend's 40%? That doesn't *feel* like Riverbend is getting more help."

  "Exactly," Anya said, seizing the point. "The community sees the *total invites* going mostly to Riverbend. They don't see the internal rates. But you asked about equalizing the chance for a sick person to be flagged – that's sensitivity. Right now, North Heights actually has *higher* sensitivity! But you also mentioned fairness to the healthy – that’s about false positives. Right now, North Heights has a *higher* false positive rate too."

  "Can we balance them? Make sensitivity equal *and* false positive rate equal?" Maria asked, hope flickering.

  Anya took a deep breath. This was the wall. "Let’s try. Suppose we want equal sensitivity. Say, 50% for both groups. How many slots does that take?"

  *   Riverbend: Catch 50% of 250 hypertensive = 125 people. To catch 125 true positives, given their prevalence and calibration, the model will also flag roughly... She calculated... about 125 false positives (since at that score threshold, PPV is roughly 50%). **Total Riverbend invites needed: 250.**
  *   North Heights: Catch 50% of 100 hypertensive = 50 people. Similarly, this would flag about 50 false positives. **Total North Heights invites: 100.**

  "Okay," Maria said slowly. "So we invite 250 from Riverbend, 100 from North Heights. Total 350 slots. But we only *have* 200 slots. We can't do that."

  "Right," Anya said. "Not enough slots. Now, suppose we try equal false positive rates. Say, 10% for both groups."

  *   Riverbend: Flag 10% of 750 healthy = 75 false positives. To get 75 false positives, at their prevalence and calibration, the model will also catch… She calculated... roughly 75 true positives (NPV driven). **Total Riverbend invites: 150.**
  *   North Heights: Flag 10% of 900 healthy = 90 false positives. To get *90* false positives, it will catch roughly… 10 true positives (because prevalence is low). **Total North Heights invites: 100. Total: 250 slots.** Closer to 200, but still over.

  "We still need 250 slots," Anya continued. "But worse, look at the sensitivity: Riverbend catches 75/250 = 30% of their sick. North Heights catches only 10/100 = 10% of their sick. We equalized false positives, but now the detection rates for the *sick* are wildly different. North Heights suffers."

  Maria stared at the numbers. "So... if we force equal sensitivity, we run out of slots and North Heights ends up with a *higher* false positive rate than Riverbend? And if we force equal false positive rates, North Heights gets *abysmal* sensitivity?"

  "Precisely," Anya said, her voice heavy. "With different base rates and a calibrated score, you *cannot* have equal sensitivity and equal false positive rates simultaneously with a fixed resource. It’s mathematically impossible. The imbalance *has* to show up somewhere. If you try to force one equality, the other inequality gets worse, and it usually lands hardest on the group with the lower prevalence."

  "And who absorbs the extra... burden?" Liam spoke for the first time, his voice quiet but cutting through the numbers. "In scenario one, trying for equal sensitivity, North Heights absorbs the extra false positives. Their healthy people get screened unnecessarily at a higher rate. In scenario two, trying for equal false positives, North Heights absorbs the *missed cases*. Their sick people don't get screened. A rock and a hard place, defined by the prevalence gap."

  Silence descended, thick and uncomfortable. Director Barnes stopped tapping his pen. Maria looked down at her hands. The elegant calibration of Anya’s model felt suddenly cold, a precise instrument measuring an uncomfortable truth.

  "So," Maria finally said, her voice subdued but insistent. "The model is 'fair' internally. But the *world* it operates in isn't fair. The 10% versus 25%... that’s the real problem. The model just reflects it, and our fixed slots turn that reflection into an allocation that *feels* unjust. So... what *should* the city actually do? Is the fix even *in* the model?"

  Anya looked at the stark numbers on the screen – the 100 sick people in North Heights, only 50, or 10, or some impossible number between them, likely to be found with their current approach. She thought of the moldy apartments, the three jobs, the stress Maria’s community partners described. The model hadn't created that 10%. It had only counted it.

  "The model," Anya said slowly, "is counting what *is*. It’s good at finding needles in haystacks. But if one haystack has far fewer needles because… because the ground it grew on is poisoned...” She glanced at Maria, who gave a tight, acknowledging nod. "...then maybe spending all our effort building a better needle-finder for *that* haystack, with our tiny magnet, is... maybe it’s the wrong focus. The calibration is correct. The impossibility is real. The bind... isn't in the code. It's in the 10%. Maybe *that*," she said, the words landing with the weight of the uncomfortable truth they’d mathematically proven, "was the target all along. And the model... it just showed us the size of the gap we weren't seeing clearly before."

  Liam leaned forward. "And reminds us," he murmured, almost to himself, "that we only know *how* sick the people are... whom we've already found. What does the score *mean* for the ones never screened? What's the true prevalence hidden in the stress cracks we haven't measured?" He left the question hanging, unanswered, as palpable as the stale air and the impossible arithmetic glowing on the screen. The room held its breath, trapped not by flawed algorithms, but by the unyielding geometry of an unequal world.
