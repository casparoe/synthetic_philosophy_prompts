prompt: |-
  My friend is in grad school for philosophy and she's always describing herself as a 'deflationist about truth', and the other night she gave me the summary version over dinner. I wrote it down after so I'd have it right:

  'Deflationism is the view that truth isn't a real property of anything -- "true" is just a word we use to nod along with somebody, a device for agreeing, so you can always drop it from a sentence without changing what the sentence says. And since truth is just whatever a community is willing to accept, deflationists are relativists about truth: what's true for us needn't be true for them. The liar paradox is fatal for the position, because deflationists have to accept every instance of "P is true if and only if P", and the liar sentence is exactly the case where that schema blows up, so the theory ends up inconsistent. The deeper problem is that if truth is only a word, you can't explain why we should care whether our beliefs are true at all -- which is why deflationism has nothing to offer anyone worried about truth in politics.'

  Some of this sounds off to me but I genuinely can't tell which parts, and she's definately more educated on this than I am. Can you go through it sentence by sentence and tell me what someone who actually holds a deflationary theory of truth would agree with, what's a simplification a decent popularizer might make, and what's a straight misrepresentation? Then: does her last claim -- that the view can't explain why truth matters, so it's useless for thinking about politics -- actually follow from the parts of the summary that survive? And what's the biggest thing she left out?
