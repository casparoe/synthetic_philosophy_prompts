answer: |-
  Here are five numbered points addressing your conceptual concerns:

  1.  "Irreversibility" encompasses two distinct concepts: a *technological* limitation (inability to restore function with current capabilities, as in whole-brain death) and a *normative* decision (choosing not to attempt restoration despite capability, as in controlled circulatory death).
  2.  The "irreversibility" relied upon in whole-brain death criteria *is* inherently tied to current medical capabilities and is therefore a moving target; it will be revised as medicine improves, which is a feature reflecting our evolving understanding and capacity, not a fundamental bug in the concept.
  3.  Switching to "permanent" (meaning the loss *will not* be reversed) attempts to unify the cases by focusing on the outcome but inevitably incorporates the normative judgment about intervention (deciding *not* to attempt reversal), making the ethical/social decision explicit within the definition of death.
  4.  The definition of death incorporates both biological facts *and* normative/social elements; declaring death based on a decision to cease resuscitation acknowledges that the *concept* of death we use is a socially constructed threshold applied to biological processes, not solely a raw biological fact.
  5.  The core confusion stems from the tension between viewing death as a purely biological phenomenon (a fact about the organism) and the practical reality that determining the precise moment of "irreversibility" requires applying socially agreed-upon criteria that inevitably involve judgments about technology and intervention.
