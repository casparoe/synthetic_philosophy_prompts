prompt: |-
  ok so context: i sit on the ethics committee at a mid-sized hospital and we're rewriting the consent language for a biobank, where people agree that leftover tissue and blood can be used for research we haven't designed yet. the current form says future research and everyone knows thats meaningless. so i've been reading around on what makes consent valid -- deception, coercion, competence -- and i've ended up somewhere i honestly can't tell if it's a real position or just me being difficult. here it is: consent isn't a mental state or an act of will or a signature, it's a relation between the reasons the person actually has and the act under the description it will actually bear at the moment it's carried out. so a signature is valid only if the person's reasons would still support the thing if they were handed an accurate description of it at the time it happens, not at the time they signed. i've been calling it reason-robust consent. it's supposed to make open-ended biobank consent invalid no matter how clearly you disclose it, which feels right to me, but it also seems to make a lot of ordinary medicine invalid (the surgeon finds something unexpected mid-operation, the patient never consented to that specific thing), which feels wrong. i suspect the seperate issue is that some of those cases are about a person being unable to recieve a description at all, and some are about the description changing after the fact, and my view is treating them as one thing.

  What are the most important implications of this view for how we should actually write the form and run the biobank? I want the ones that a standard disclosure-plus-competence framework gets wrong -- especially anything about participants who later object to research done under their original signature, and about whether we can ever honestly say someone consented to a study that didn't exist yet. And i want to know where the view collapses: what does it forbid that we obviously should allow, and is there a patch that saves the ordinary medicine cases without letting the biobank back in?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on an ethics committee rewriting consent forms for a biobank. The issue is that current consent for future unspecified research feels inadequate. The user has developed this concept called "reason-robust consent," which ties validity to whether the person's reasons at consent would still hold when the actual research happens. They're worried this might invalidate not just biobanks but also routine medical situations like unexpected surgical findings.

  First, I need to grasp the core of their "reason-robust" idea. It's about the alignment between the participant's reasons for consenting and the actual research when it occurs. The user is concerned that since future research is undefined, consent can't be valid under this framework. They also notice a conflict with medical practices where consent covers unforeseen events.

  The user's explicit questions are about implications for the biobank forms, handling objections, whether consent for nonexistent studies is possible, and where their theory fails. But deeper, they might be seeking validation of their ethical framework while needing practical solutions that don't disrupt standard medical ethics. They might also want to ensure their committee's policies are both ethically sound and legally defensible.

  Looking at the implications, under reason-robust consent, broad consent for biobanks is problematic because participants' reasons at signing (like supporting cancer research) might not match the actual study later (e.g., controversial genetics). This means re-consent or specific permissions might be needed, which is logistically tough for biobanks. Also, participants objecting post-hoc would have a strong case if their initial reasons don't align with the executed research.

  The collapse points are clear in medical scenarios. During surgery, unexpected issues require immediate action, but the patient can't consent then. Reason-robust consent would see this as invalid, which is impractical. The user is correct that inability to receive info and post-hoc changes are different but their model conflates them. 

  To patch this, the distinction between specific and general intentions is key. In medicine, consent for surgery includes an implicit understanding of unforeseen necessary interventions. But biobank consent lacks that scope limitation. Creating a bounded category for biobanks with strict governance might help, but it's tricky. Tiered consent and dynamic governance are practical steps, but they don't fully satisfy the reason-robust criteria. The user might need to accept that their model is idealistic and real-world compromises are necessary, ensuring robust oversight as a proxy for specific consent.
answer: |-
  Your "reason-robust consent" view is a sophisticated and ethically rigorous critique of standard disclosure frameworks, particularly for open-ended biobanking. Let's break down the implications, collapse points, and potential patches:

  **Core Implications for Biobank Consent & Operations:**
  1.  **Invalidation of "Blank Check" Consent:** Under your view, signing a broad "future research" consent form is *inherently invalid*, no matter how clearly disclosed or competently signed. The participant's reasons at signing (e.g., "help fight cancer," "support science") cannot genuinely align with the specific, unforeseen *description* of a future study (e.g., "research on genetic links between schizophrenia and criminality using SNP analysis on de-identified samples").
  2.  **Re-Consent as Default Requirement:** The most direct implication is that **valid consent requires re-contact and specific consent *for each distinct future study*** using stored samples/data. The participant must be presented with the *actual description* of the proposed research *at the time it is ready to commence*, and their *current reasons* must support *that specific act*.
  3.  **Impossibility of "Consent to the Unknown":** Your view explicitly concludes that **it is impossible to validly consent to research that does not yet exist** in a concrete, describable form. "Future unknown research" is not a coherent "act" that can bear a description alignable with reasons at the time of signing.
  4.  **Heightened Scrutiny of Participant Objections:** If a participant later objects to a specific study conducted under their broad consent:
      *   **Standard Framework:** Focuses on whether the study fell within the *disclosed scope* (e.g., "medical research") and if the original consent was competent/informed. Objections based on the *specific nature* of the research are often dismissed as "covered."
      *   **Reason-Robust View:** The objection is *prima facie valid*. The core claim is that their initial reasons *could not* have aligned with the specific description of *this* act. The burden shifts entirely to the biobank to prove alignment (which is likely impossible for truly unforeseen research).
  5.  **Requires Granular Governance:** Biobank governance must shift from "Does this study fit the broad consent category?" to actively managing **whether the *specific description* of each proposed study can reasonably be assumed to align with the *typical reasons* participants had for donating, AND/OR implementing a robust re-consent process.** This is far more restrictive than standard ethics review.

  **Where the View Collides with Reality (The "Collapse Points"):**

  1.  **The Surgical Discovery Dilemma (Your Example):**
      *   **Problem:** A surgeon finds an unexpected, life-threatening condition (e.g., occult cancer) during a consented procedure (e.g., appendectomy). Acting immediately is medically necessary. Your view seems to invalidate this action because the patient never consented (or had reasons aligning) with *that specific act* ("removing a section of bowel for newly discovered cancer").
      *   **Why it Collapses:** This would paralyze essential medicine. We intuitively accept that consent for surgery includes an *implicit scope* covering necessary and unforeseen interventions directly related to the surgical field and the patient's immediate well-being.

  2.  **Emergency Medicine & Incapacitation:**
      *   **Problem:** Treating an unconscious trauma patient. No prior consent exists for *any* description of the act. Your view offers no basis for treatment, yet society clearly permits and expects it under principles of presumed consent/necessity/best interests.

  3.  **Evolving Chronic Care:**
      *   **Problem:** A patient consents to "treatment for diabetes." Later, new guidelines recommend a different drug class (SGLT2 inhibitors vs. older sulfonylureas) based on emerging cardiac benefits. Must we re-consent for every guideline update or medication switch, even within the broad category of "diabetes treatment"? Your view's strictness could demand this.

  **Patching the Collapse: Distinguishing Contexts Without Gutting the Core**

  The critical distinction your view *correctly* identifies but needs to formalize is **Scope of Intention vs. Specificity of Description:**

  1.  **The "Scope of Intention" Patch (Saving Medicine):**
      *   **Core Idea:** Valid consent establishes a *bounded scope of agency delegation* based on the agent's *overriding primary intention* and the *inherent limitations of foresight* in that context.
      *   **Applied to Surgery:** Consent for "appendectomy" delegates agency to the surgeon to perform acts *within the anatomical field and temporal scope of the procedure* that are *medically necessary for the patient's immediate welfare*, even if unforeseen. The patient's primary intention ("treat my acute appendicitis safely") *robustly* encompasses unforeseen necessary interventions *within that bounded scope*. The "description" at consent implicitly includes "necessary actions discovered during the procedure for my immediate health."
      *   **Applied to Chronic Care:** Consent for "management of my Type 2 Diabetes" delegates agency to the physician to act within the *bounded scope* of evidence-based diabetes treatment, adjusting to new guidelines/medications *as long as the primary intention ("manage my diabetes effectively") remains the driver*. Significant shifts (e.g., proposing bariatric surgery) would require re-consent.
      *   **Applied to Biobanking:** **Crucially, this patch does *not* save standard biobank consent.** Biobank consent lacks a *bounded scope defined by the participant's primary intention*. "Future research" is limitless in topic, methodology, and potential implications (social, psychological, commercial). The participant's likely primary intention ("help medical science generally" or "fight disease X") provides *no inherent boundary* for the research that can be conducted decades later. The scope is inherently unbounded and unpredictable.

  2.  **The "Impossibility/Necessity" Patch (Saving Emergencies):**
      *   **Core Idea:** When it is *impossible* to obtain consent *and* inaction would cause *severe, imminent harm* to the individual, intervention is justified under necessity/presumed consent. This is a separate *ethical override*, not valid consent under your model, but practically essential.
      *   **Applied:** Covers unconscious trauma patients, critical intra-operative discoveries where delay is dangerous, and potentially some urgent public health interventions. This explicitly *does not* apply to biobanking, where there is no urgency or direct harm to the participant from delay (samples are stored).

  **Implications for Rewriting the Form & Running the Biobank (Under a Patched Reason-Robust View):**

  1.  **Reject "Future Research" as Sufficient:** The core consent form *cannot* rely on a broad future research clause as the ethical basis for *specific* future studies.
  2.  **Embrace Tiered/Dynamic Consent Models:** Structure consent around mechanisms that *enable* future alignment:
      *   **Mandatory Re-Contact Option:** Offer participants a clear choice: "We will contact you to seek specific consent for each new research project using your sample/data." (Logistically challenging but most aligned).
      *   **Granular Permission Choices:** Present broad *categories* at sign-up (e.g., "Cancer Research," "Heart Disease Research," "Mental Health Research," "Genetic Research," "Research by Commercial Companies"). This creates *bounded scopes* closer to the "Scope of Intention" patch. Participants select which categories align with their *current reasons*. Research must fit the chosen category(ies). Governance must ensure fit is robust.
      *   **Dynamic Online Portals:** Allow participants to log in, see proposed studies (with full descriptions), and grant/deny permission for each, or update their category preferences.
      *   **"Broad Plus" with Strong Governance:** If some broad consent is retained (e.g., for low-risk, non-controversial research within a defined field like "infectious disease genomics"), couple it with:
          *   **Strict, Pre-Approved Scope:** Define the acceptable boundaries (topics, methods, data types, risks) much more narrowly than "any medical research."
          *   **Robust Governance:** Ethics review for *each study* must explicitly consider: "Is it *plausible* that the *typical participant's primary reason* for donating (e.g., 'fight infectious diseases') robustly supports *this specific study description*?" AND implement an easy, well-publicized opt-out mechanism for any specific study.
          *   **Transparency:** Commit to publicly listing *all* studies using the biobank with clear descriptions.
  3.  **Radical Transparency at Collection:** Over-invest in explaining the *limitations* of foreseeability and the mechanisms in place for future permissions (the tiered/dynamic options above). Acknowledge that signing the form *today* is only permission to *store* the sample and *ask later* for specific research use, or permission only for the specific categories chosen.
  4.  **Plan for Objections:** Have a clear, accessible, and responsive process for participants to object to specific research conducted with their sample/data *even if they signed a broad form*. Under your view, such objections have significant ethical weight. Be prepared to withdraw samples/data if the objection is based on a clear misalignment with plausible original reasons or current values.

  **Conclusion:**

  Your "reason-robust consent" view powerfully exposes the ethical fiction of true "blank check" consent for biobanks. Its major implication is that **valid consent for specific future research requires either re-consent or highly constrained, category-based pre-authorization.** While it initially seems to threaten essential medical practice, patching it with the "**bounded scope of agency delegation based on primary intention**" concept saves core medical contexts *without* rescuing standard open-ended biobanking, which lacks the necessary boundaries. The path forward is to design biobank consent and governance around mechanisms that maximize the *opportunity* for participants' reasons to align with the actual research when it occurs, moving decisively away from the "sign now, ask never" model.
