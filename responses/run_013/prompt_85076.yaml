  We are introducing the common prior assumption (CPA) in the context of decision theory, for graduate students with measure-theoretic probability background but no epistemic game theory. The goal is to structure a 90-minute session that covers the necessary components, builds intuition, addresses misconceptions, and connects to a potential machine learning example without derailing.

  ### Order of Components and Dependencies

  1. **States of the World and Partitions (10 minutes)**
     - Start with a finite state space Ω (to avoid measure-theoretic complications initially). Each state ω ∈ Ω describes a complete specification of the world.
     - Introduce agents and their information: each agent has a partition of Ω. For a given state ω, the element of agent i's partition that contains ω is denoted Π_i(ω) — this is the set of states that agent i considers possible when the true state is ω.
     - Why first? Because without the idea that agents have different information (represented by partitions), we cannot model disagreement.

  2. **Beliefs (10 minutes)**
     - Define a prior probability measure P over Ω (common to all agents). This is a fixed probability measure that we will later assume is common.
     - Then, conditional on information, agent i's belief at state ω about an event A is P(A | Π_i(ω)).
     - Emphasize: beliefs are derived from conditioning the prior on the agent's private information.

  3. **Common Prior Assumption (CPA) (5 minutes)**
     - State the CPA: There exists a single probability measure P over Ω (the common prior) such that each agent's beliefs at every state are obtained by conditioning P on their private information (i.e., on their partition element).
     - Why now? We have the setup (states, partitions) and the notion of beliefs. The CPA is a restriction on the beliefs: they must be consistent with conditioning a single prior.

  4. **Common Knowledge (10 minutes)**
     - Define mutual knowledge and common knowledge. For an event E, it is common knowledge at ω if E includes the element of the meet (the finest common coarsening) of the agents' partitions at ω. (Alternatively, use the iterative definition: everyone knows E, everyone knows that everyone knows, etc. — and note that in finite models, the two definitions are equivalent.)
     - Why now? Without common knowledge, we cannot state the Agreement Theorem.

  5. **The Agreement Theorem (Aumann's Theorem) (15 minutes)**
     - State the theorem: If two agents have the same prior and their posteriors for an event A are common knowledge at some state ω, then their posteriors must be equal.
     - Sketch the proof (using the partition structure and the fact that common knowledge induces a common information set in the meet). 
     - Why now? The CPA sets the stage, and common knowledge is the key condition for the theorem. The theorem shows that under CPA, common knowledge of beliefs implies agreement.

  6. **Pivot to Rational Disagreement Constraint (5 minutes)**
     - Emphasize: without the CPA, agents could have different priors and thus disagree even with common knowledge of beliefs. The CPA implies that the only source of disagreement is asymmetric information. Therefore, if beliefs are common knowledge, then there cannot be any disagreement because the asymmetric information has been "washed out" by the common knowledge condition.

