          * The common prior assumption in the Bayesian sense requires that the entire information structure (including the data generating process) is captured in the prior. Two models trained on the same corpus might be seen as having a common prior (the data generating process) and the same information (the training set). But:
            - They might have different model architectures (so different partitions? or different conditioning?).
            - More importantly, if they are trained on the same data, then they have the same information, so they should agree. But in practice, they might not because of randomness in training (e.g., random initialization and stochastic gradient descent leading to different local optima). This is not allowed in the common prior model: the model assumes that conditioning on the same information yields the same posterior. So the CPA model assumes that the agents (or models) are Bayesian rational and update using the same prior. 
          * However, the agreement theorem also requires common knowledge of the beliefs. If they simply compare predictions, that might not yield common knowledge: if they announce their predictions to each other, then after the announcement they might update and agree? But the theorem says that if they have the same prior and they communicate to the point of common knowledge of their beliefs, then they must agree. 

        - But note: in the standard Bayesian updating, if two agents have the same prior and condition on the same information, they will have the same posterior. That's a simpler result. The agreement theorem is more subtle: it allows for different information, and then common knowledge of beliefs forces agreement.

        - In the LLM case, if the two models are trained on the same data (so same information) and are Bayesian, they should already agree without any communication. The fact that they don't in practice is because they are not Bayesian rational agents: they might be using approximate methods (like SGD) that do not implement exact Bayesian updating.

        - Therefore, the LLM example can be used to illustrate the limitations of the CPA: it assumes agents update by exact conditioning. But it should not be used to illustrate the agreement theorem because in that example, the agents have the same information.

        - What to say: 
          * When the question is raised (likely early), acknowledge it and say: 
            "That's an excellent question and one we will come back to. The common prior assumption, in the context of rational agents, implies that any two agents who have the same information will have the same beliefs. However, the agreement theorem is about agents with different information. Moreover, the common prior assumption does not by itself guarantee that two machine learning models trained on the same data will converge to the same predictions because the models might not be Bayesian updaters. But let's hold that thought until we have the agreement theorem in place."

          * Then, after covering the agreement theorem, you can return:

            "Now, about the machine learning models: if we think of the training data as their private information, and if they are Bayesian updaters with a common prior, then if they have the same data, they must have the same beliefs. But in practice, they may not. The common prior assumption is a strong idealization. Moreover, the agreement theorem says that if they communicate their beliefs and this communication becomes common knowledge, then they must agree. This could be seen as a justification for why we might expect models that are trained on the same data and then share their predictions to move toward agreement. However, note that the agreement theorem requires common knowledge, which might be difficult to achieve, and also assumes the models are rational Bayesian agents."

        - So, use it as a motivation and a connection, but clarify the assumptions.

  ### Misconceptions

  1. **"The theorem says rational agents cannot disagree."** 
     - When: After stating the agreement theorem.
     - Why it's wrong: Disagreement is possible under CPA, as long as the disagreement is not common knowledge. The theorem only says that if the beliefs are common knowledge, then they must agree.
     - How to head off: When stating the theorem, emphasize the condition: "common knowledge of beliefs". Provide an example where agents disagree and explain that common knowledge of beliefs does not hold.

  2. **"A common prior means the agents share the same information."**
     - When: When introducing the CPA.
     - Why it's wrong: The common prior is about the initial probability measure. Agents may have different private information, which they condition on. The CPA does not require symmetric information.
     - How to head off: When defining the CPA, explicitly say: "agents may have different information, represented by different partitions, but they update the same prior using their own information."

  3. **"Common knowledge is just everyone knowing."**
     - When: When introducing common knowledge.
     - Why it's wrong: Common knowledge is not just that everyone knows, but that everyone knows that everyone knows, and so on ad infinitum.
     - How to head off: Give an example where everyone knows but it is not common knowledge. 
          Example: The muddy children puzzle. Or a simpler one: 
            - Two people are told they might have dirt on their forehead. Each can see the other's forehead. If both have dirt, then each sees one dirty forehead and knows they might have dirt. But if the father says "at least one of you has dirt", then they both know that, and then they both know that the other knows, etc. Initially, they don't have common knowledge that at least one has dirt.

  4. **Additional misconceptions:**
     - **"The common prior assumption is always reasonable."** 
       - When: During the pivot to rational disagreement constraint.
       - Why it's wrong: The CPA is a strong assumption and may not hold in practice. For instance, agents might have different life experiences that form their priors.
       - How to head off: Discuss the CPA as a modeling assumption and its critiques (e.g., by Harsanyi and later critiques).

     - **"The agreement theorem says that communication always leads to agreement."**
       - When: When discussing the implications of the agreement theorem.
       - Why it's wrong: The agreement theorem requires common knowledge of beliefs, which might not be achieved by simple communication. For example, if they communicate in a way that is not public, then common knowledge might not be reached.
       - How to head off: Discuss what kind of communication yields common knowledge (e.g., public announcements).

     - **"The common prior is the same as the posterior after they share information."**
       - When: When comparing prior and posterior.
       - Why it's wrong: The common prior is the prior before any information. After they share information, they might have a common posterior, but that is derived from the common prior by conditioning on the pooled information.
       - How to head off: Emphasize the temporal aspect: prior (before any information) -> private information -> posterior1; then after sharing, they condition on the union of information.

     - **Load-bearing misconception**: The first one — "rational agents cannot disagree". If not corrected, students will think the CPA rules out any disagreement, which is not true. This is crucial for understanding the scope of the agreement theorem.

  ### Final Question for Understanding (last 10 minutes)

  - **Question**: 
    "Suppose we have two rational agents with a common prior. They are given different private information about the state of the world. They are then placed in separate rooms and asked to announce their posterior probability of a fixed event A. Their announcements are then broadcasted to each other via a public address system. After hearing the broadcast, can they still disagree about the probability of A? Explain why or why not, with reference to the agreement theorem."

  - **Expected Answer**:
    - After the public announcement, the announcements are common knowledge. The agreement theorem says that if the agents have a common prior and their posteriors are common knowledge, then they must be equal. Therefore, after the public announcement, they will update to the same posterior. So they cannot continue to disagree.

    - However, note that their initial announcements might have been different. After hearing the other's announcement, they will update and then agree.

    - Why? Because the public announcement makes the initial beliefs common knowledge. Then the agreement theorem applies, and they must have the same belief. But note: they will also have more information (the other's announcement), so they will condition on that as well. The agreement theorem in this context says that after the public announcement of the beliefs, they will agree. In fact, they will both update to the same posterior.

  ### Material to Explicitly Exclude

  - **Announce at the beginning**:
    - "We will not cover the following in this session: 
        1. The complete proof of the agreement theorem in the general measure-theoretic setting (we will sketch the finite case).
        2. The infinite state space extensions and their complications.
        3. The detailed critique of the common prior assumption in economics (though we will touch on its status as a modeling assumption).
        4. Epistemic game theory beyond the agreement theorem (like common knowledge of rationality, etc.)."

  This plan should fit within 90 minutes, allowing for questions and discussion. The structure builds from the basics to the agreement theorem, and then to its implications, while addressing the machine learning example and key misconceptions.
answer: |-
  ### Teaching Plan: Common Prior Assumption (90-Minute Session)

  #### **Order of Components and Dependencies**
  1. **States, Partitions, and Private Information (15 mins)**  
     - **Why start here?** Without partitions, agents' information structures are undefined. Students must see how knowledge is fragmented.  
     - Introduce a finite state space Ω (e.g., Ω = {ω₁, ω₂, ω₃}). Define partitions for agents (e.g., Alice: {ω₁, ω₂} and {ω₃}; Bob: {ω₁} and {ω₂, ω₃}). Emphasize that partitions capture what agents *know* at each state (e.g., at ω₁, Alice only knows {ω₁, ω₂} is possible).  
     - **Dependency:** This must precede beliefs/priors. Without partitions, conditioning is meaningless.

  2. **Beliefs and Priors (10 mins)**  
     - **Why now?** Beliefs derive from conditioning priors on private information. Students need to see how priors generate posteriors.  
     - Define a prior distribution *P* over Ω (e.g., uniform). Show how agents compute posterior beliefs (e.g., Alice at ω₁: *P*(ω₁ | {ω₁, ω₂})).  
     - **Dependency:** Partitions enable conditioning. Without them, the common prior is just a distribution, not a tool for belief formation.

  3. **Common Prior Assumption (CPA) (10 mins)**  
     - **State CPA:** "Agents share a prior *P*, and all beliefs come from conditioning *P* on private information."  
     - **Dependency:** Requires partitions and priors. CPA is empty without showing how beliefs are *produced* (conditioning on partitions).  
     - **Pivot to Rational Disagreement:** CPA is initially a modeling choice ("We assume this for coherence"). The agreement theorem will pivot it to a rationality constraint.

  4. **Common Knowledge (15 mins)**  
     - **Why last?** The agreement theorem depends on common knowledge.  
     - Define: "Event *E* is common knowledge at ω if everyone knows *E*, everyone knows everyone knows *E*, etc." Use partitions to show this requires *E* to contain an element of the *meet* (coarsest common refinement).  
     - **Dependency:** Must follow partitions. Without them, common knowledge is abstract.

  5. **Agreement Theorem (15 mins)**  
     - **State the theorem:** "Under CPA, if agents' posteriors for event *A* are common knowledge, they must be equal."  
     - **Pivot:** Now CPA shifts from "modeling choice" to "constraint on rational disagreement." If posteriors are common knowledge, disagreement implies irrationality (or asymmetric info failure).  
     - **Dependency:** Requires common knowledge and CPA. The theorem is a curiosity without both.

  ---

  #### **The Central Example: Must Fit on a Whiteboard in 2 Mins**  
  - **Example: "The Colored Cards" (Adapted from Aumann)**  
    - **Setup:** Three cards:  
      - Card 1: Red both sides (RR)  
      - Card 2: Blue both sides (BB)  
      - Card 3: Red/Blue (RB)  
      - Prior: Uniform (each card 1/3).  
    - **State:** Card drawn randomly, shows **Red** (top side).  
    - **Agents:**  
      - Alice sees only the top (Red). Her partition: {RR, RB} (states where top is Red).  
      - Bob sees only the bottom. His partition: If bottom is Blue, state is RB; if Red, state is RR.  
    - **Beliefs about "Bottom is Blue" (event A):**  
      - Alice: *P*(A | top=Red) = *P*(RB) / [*P*(RR) + *P*(RB)] = (1/3) / (1/3 + 1/3) = **1/2**.  
      - Bob: If he sees Blue (state=RB), *P*(A) = **1**; if he sees Red (state=RR), *P*(A) = **0**.  

  - **Why this example works:**  
    - **Has:** Asymmetric information (Alice sees top, Bob sees bottom), disagreement (Alice: 1/2, Bob: 0 or 1), CPA (shared prior).  
    - **Lacks:** Common knowledge of posteriors. Alice doesn’t know Bob’s posterior (she can’t see the bottom).  
    - **Feels like a restriction:** The theorem’s power is clear when we ask, "Could Alice and Bob publicly announce beliefs and still disagree?" Only under CPA + common knowledge is this impossible.  

  - **The LLM Trap:**  
    - **Why it’s a trap:** CPA does *not* imply ML models converge after comparing predictions. Models may have different:  
      - Architectures (implicit "partitions"),  
      - Training randomness (violates CPA’s deterministic conditioning),  
      - Non-Bayesian updating.  
    - **How to address:** When the ML student asks (early), say:  
      > "Hold that thought! CPA assumes agents *condition rationally* on *defined information partitions*. ML models often violate both. We’ll revisit after the agreement theorem."  
      Later, clarify: CPA requires identical priors *and* rational updating. SGD-trained models lack both. Use this to stress CPA’s idealization.

  ---

  #### **Misconceptions and When to Debunk**  
  1. **"The theorem says rational agents cannot disagree."**  
     - **When it surfaces:** During agreement theorem statement.  
     - **Debunk immediately:** Emphasize disagreement is allowed *unless* posteriors are common knowledge. Use the card example: Alice and Bob disagree because they don’t know each other’s beliefs.  
     - **Load-bearing:** If unchecked, students think CPA forbids all disagreement, undermining the theorem’s nuance.

  2. **"A common prior means agents share the same information."**  
     - **When it surfaces:** During CPA definition.  
     - **Debunk immediately:** Distinguish *prior* (shared) from *information* (private partitions). In the card example, both share the prior but see different sides.  
     - **Load-bearing:** Confusing priors with information invalidates CPA’s role in disagreement.

  3. **"Common knowledge is just everyone knowing."**  
     - **When it surfaces:** During common knowledge definition.  
     - **Debunk immediately:** Use a counterexample:  
       > "At ω₁, Alice knows *X*, Bob knows *X*, but Bob doesn’t know Alice knows *X* → not common knowledge."  
       Highlight the infinite regress (e.g., the muddy children puzzle).

  4. **"CPA implies beliefs converge after sharing predictions."**  
     - **When it surfaces:** Post-agreement theorem.  
     - **Debunk:** Stress that **common knowledge** (not just sharing) is required. In the card example, if Alice and Bob *publicly* announce beliefs, they *update* to agreement.

  5. **"CPA is unrealistic, so the theorem is useless."**  
     - **When it surfaces:** During pivot to rational disagreement.  
     - **Debunk:** Acknowledge CPA’s idealism but highlight its value: It forces disagreement to stem *only* from asymmetric info (not priors), clarifying debates (e.g., "Do we disagree because of data or biases?").

  ---

  #### **Final 10-Minute Understanding Check**  
  **Question:**  
  > "Two rational agents with CPA are given private information about a biased coin (70% Heads prior). They announce posteriors for Heads: Alice says 80%, Bob says 60%. Their announcements are made in a public video conference (so common knowledge). Can they still disagree? Why or why not? What happens next?"  

  **Expected Answer:**  
  - "No, they cannot disagree. Common knowledge of posteriors + CPA implies agreement (agreement theorem). They will recognize their beliefs *must* be equal, so they will revise them by pooling information. Final posteriors will coincide."  

  **Why it separates understanding:**  
  - Memorizers regurgitate "no disagreement." Those who *understand* must:  
    (1) Cite common knowledge + CPA,  
    (2) Explain belief revision (pooling info),  
    (3) Note the system *forces* agreement upon common knowledge.  

  ---

  #### **Explicitly Exclude (State Upfront)**  
  > "Today, we **will not cover**:  
  > - Infinite state spaces or measure-theoretic complications (stick to finite Ω).  
  > - Epistemic game theory (e.g., common knowledge of rationality).  
  > - Critiques of CPA (e.g., Harsanyi doctrine). Focus is on *structure*, not philosophy.  
  > Save these for advanced seminars!"  

  ---

  **Session Flow Summary:**  
  - 0–15 mins: Partitions + private info.  
  - 15–25 mins: Beliefs + CPA.  
  - 25–40 mins: Common knowledge.  
  - 40–55 mins: Agreement theorem + pivot.  
  - 55–70 mins: Card example + LLM discussion.  
  - 70–80 mins: Misconceptions deep dive.  
  - 80–90 mins: Final question + wrap-up.  

  This builds from foundations (partitions) to the theorem, using a tangible example to anchor abstraction, while preempting pitfalls like the LLM analogy. The pivot frames CPA as a rationality constraint, not just math.
