  **Q8 (from Q4-Fact):**  
  *"Does genuine understanding require real-time sensory interaction with the world (e.g., a body navigating physics), or can it occur in a purely computational 'brain in a vat'?"*  
  - **Requires bodily interaction** → **Leaf: Embodied/enactive view (e.g., Varela, Noë)**.  
