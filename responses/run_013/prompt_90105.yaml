  Below is a diagnostic decision tree designed to help your students pinpoint their stance on the competence/comprehension distinction, based on the logical space defined by your three core distinctions (causal history vs. functional organization, degree vs. all-or-nothing understanding, and fact vs. stance attributions). The tree starts from the agreed-upon inversion (competence without comprehension) and progresses through concrete, intuition-driven questions, avoiding doctrinal labels until the leaves. Each branch point is a single question where positions genuinely diverge, phrased as a case or claim answerable without specialized vocabulary.

  The tree has **12 nodes (including the root) and 10 leaves**, covering your specified positions. It prioritizes clean separations but flags inseparable pairs and unoccupied combinations. Branch points are contestable; reasons for their design are given in italics where needed. Awkward commitments at each leaf highlight the position's toughest implication.

