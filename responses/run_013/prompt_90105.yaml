  ### **Decision Tree**

  **Root (Q0):**  
  *"There are systems (e.g., an insect building a nest, or a neural network diagnosing diseases) that reliably produce competent outputs across diverse situations, and nothing in these systems 'understands' why they do what they do (e.g., no part grasps reasons or meanings)."*  
  - **Agree** → Proceed to Q1.  
  - **Disagree** → Stop; you reject the inversion (e.g., hold comprehension is necessary for competence).  

  **Q1:**  
  *"In such systems, is the gap between competence and comprehension best explained by how the system was shaped (e.g., evolution, training data, or reinforcement learning) or by how it is organized internally (e.g., its processing architecture or algorithm)?"*  
  - **Causal history** (shaped by external pressures) → Proceed to Q2.  
  - **Functional organization** (internal structure/processes) → Proceed to Q3.  
  *(Reason: Distinguishes views where history (e.g., selection) explains the gap from those where current implementation (e.g., algorithm) does.)*  

  **Q2 (from Q1-Causal history):**  
  *"When a system (like a human) does seem to 'understand,' is this understanding a matter of degree (e.g., more or less sophisticated) or all-or-nothing (either fully present or absent)?"*  
  - **Degree** → Proceed to Q4.  
  - **All-or-nothing** → Proceed to Q5.  

  **Q3 (from Q1-Functional organization):**  
  *"When a system (like a human) does seem to 'understand,' is this understanding a matter of degree or all-or-nothing?"*  
  - **Degree** → Proceed to Q6.  
  - **All-or-nothing** → Proceed to Q7.  

  **Q4 (from Q2-Degree):**  
  *"If we say a self-driving car 'understands' traffic rules, are we reporting a fact about the car's properties or expressing a useful stance (e.g., treating it as an intentional agent)?"*  
  - **Fact** → Proceed to Q8.  
  - **Stance** → **Leaf: Instrumentalist view (e.g., Dennett)**.  
    - *Awkward commitment: Must grant that even simple systems (e.g., thermostats) can "understand" in a minimal sense if we adopt the stance.*  

  **Q5 (from Q2-All-or-nothing):**  
  *"Could a computer program that perfectly simulates human cognition (e.g., passes all behavioral tests for understanding) ever truly 'understand' if it wasn't shaped by natural selection or social learning?"*  
  - **Yes** → **Leaf: Unnamed (causal-history minimalism)**.  
    - *Awkward commitment: Must deny that evolutionary history is essential for understanding, even though it explains human comprehension.*  
    - *(Diagnosis: Unoccupied except in niche views; unattractive as it severs understanding from its biological roots.)*  
  - **No** → **Leaf: Unnamed (causal-history essentialism)**.  
    - *Awkward commitment: Must hold that a physically identical AI copy of a human brain lacks understanding if it wasn't "selected" by evolution.*  
    - *(Diagnosis: Unoccupied; incoherent with materialism as it implies history overrides current state.)*  

  **Q6 (from Q3-Degree):**  
  *"Is there a fact of the matter about what a system is 'really doing' (e.g., whether it represents 'trees' or just pixels), or is this relative to the observer's interpretation?"*  
  - **Fact of the matter** → **Leaf: Connectionist view (e.g., parallel distributed processing)**.  
    - *Awkward commitment: Must accept that understanding emerges from sub-symbolic stats (e.g., neural weights) without discrete rules, making it opaque.*  
  - **Observer-relative** → **Leaf: Instrumentalist view (e.g., Dennett)**.  
    *(Reason: Same as Q4-stance leaf; stance-dependence unifies these branches.)*  

  **Q7 (from Q3-All-or-nothing):**  
