  ### **Leaf Summary**
  1. **Instrumentalist view**: Stance-dependent attributions (Q4-stance, Q6-observer-relative).  
  2. **Connectionist view**: Functional organization, degree understanding, fact-based attributions (Q6-fact).  
  3. **Classical representationalist view**: Functional organization, all-or-nothing understanding, symbols suffice (Q7-Yes).  
  4. **Embodied/enactive view**: Functional organization, all-or-nothing, requires body (Q8, Q9).  
  5. **Anti-computational view (Searle)**: Functional organization, all-or-nothing, requires biology (Q9).  
  6. **Deflationary view**: Causal history, degree understanding, fact-based, disembodied possible (Q8-disembodied).  
  7. **Unnamed (causal-history minimalism)**: Causal history, all-or-nothing, comprehension possible without selection (Q5-Yes).  
  8. **Unnamed (causal-history essentialism)**: Causal history, all-or-nothing, comprehension requires selection history (Q5-No).  

  - **Inseparable pair**: Embodied and Anti-computational views (Q9).  
  - **Unoccupied combinations**:  
    - Causal history + all-or-nothing + stance (Q5 not taken to stance; diagnosis: Unattractive, as stance-dependence pairs naturally with degree views).  
    - Functional organization + degree + all-or-nothing (handled at Q3).  

