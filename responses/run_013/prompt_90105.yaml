  ### **Closing Note**
  This instrument assumes that **understanding is a natural kind** (a property with objective criteria) and that **reasons must be representable** (to discuss "grasping" them). It leans into functionalism by framing algorithms and organization as separable from causal history, and it treats "comprehension" as a discrete target (even when degree-based). Warn students that:  
  - It biases against non-representational views (e.g., radical enactivism).  
  - It assumes computational descriptions are viable (contra Searle's biological primacy).  
  - The "body" in embodied views is interpreted broadly (sensorimotor engagement).  

  Use this to spark debate on these assumptions. The tree successfully isolates core tensions (e.g., history vs. structure, fact vs. stance) and forces confrontations with awkward commitments, helping students locate themselves within the inversion's legacy.
