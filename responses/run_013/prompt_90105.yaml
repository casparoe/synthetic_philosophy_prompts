  - **Non-computable biology (e.g., consciousness)** → **Leaf: Anti-computational view (e.g., Searle's Chinese Room)**.  
    - *Awkward commitment: Must accept that understanding arises from unknown biological properties, not structure or function.*  
  - **Pair flagged: Embodied and Anti-computational views share this branch.**  
    *(Reason: Both deny symbol manipulation suffices, but diverge on why—body vs. biology. The tree cannot split them further with the given distinctions.)*  

