  This instrument assumes that understanding can be meaningfully attributed to systems and that the debate is about the conditions under which such attribution is correct. It leans on the idea that the causal history and functional organization are distinct explanatory levels. It also assumes that the question of whether a system is computational or not is well-defined. Importantly, it assumes that the distinction between competence and comprehension is not an illusion (except for the instrumentalist, who deflates it). Students should be aware that the tree treats "understanding" as a property that might have sharp boundaries or not, and it assumes that the representational content of a system is sometimes observer-relative. If a student holds that understanding is always an illusion (inversion all the way down), they might land in the instrumentalist leaf. The tree does not assume that reasons must be representable, but it does structure the functional organization branch around computationalism.
