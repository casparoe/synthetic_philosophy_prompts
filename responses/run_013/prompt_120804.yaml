answer: |-
  Here’s an operationalized 9-step decision procedure based on subsidiarity principles, followed by the case analyses:

  **Subsidiarity Review Checklist**

  1.  **Exclusive Competence?** Is the policy area *exclusively* assigned to the higher level by treaty/law? (e.g., trade, currency). **Stop: No objection possible.** If unclear, proceed.
  2.  **Local Core Autonomy?** (German principle) Does the measure intrude on the guaranteed core functions of municipalities/states (e.g., local land-use, purely internal organization)? **Stop: Objection justified.** (Judgment Call: Requires legal interpretation of core autonomy boundaries).
  3.  **Clear & Necessary Objective:** What is the stated objective? Is it specific, legitimate, and demonstrably necessary? (Reject vague/overbroad objectives). **Stop: Objection justified** if objective is invalid/overreaching. (Judgment Call: Assessing necessity/legitimacy).
  4.  **Lower-Level Capacity (EU Test Pt1):** Could the region *reasonably achieve this specific objective* on its own? Consider:
      *   *Evidence of existing action?* (Plans, laws, spending).
      *   *Demonstrable technical/financial capacity?* (Not theoretical).
      *   *Past failure due to incapacity?* (Proof required, not assertion).
      **Stop: Objection justified** if region demonstrates sufficient capacity. Burden shifts to higher level's justification in step 6.
  5.  **Cross-Border Spillovers?** (Key justification for higher action) Does the issue *truly and significantly* cross borders in a way *preventing* regional achievement? (e.g., pollution, large-scale fraud, critical infrastructure). **Distinguish:** Real spillovers (e.g., river pollution) vs. preference for uniformity (e.g., "easier for businesses"). **Stop: Objection justified** if spillovers are negligible/artificial. (Judgment Call: Severity and nature of spillovers).
  6.  **Higher-Level Necessity & Benefit (EU Test Pt2 / German Necessity):** Has the higher level proven *why* action is *necessary* and *better* achieved at their level? Look for:
      *   *Concrete evidence* its action is more effective/efficient (studies, data).
      *   *Proof* lower-level action alone is *insufficient* (due to spillovers, scale, fragmentation harm).
      *   *Proportionality:* Is the measure the least intrusive option?
      **Stop: Objection justified** if higher level fails this burden of proof.
  7.  **Preference vs. Principle:** Is the core dispute about *how* to achieve the objective (policy preference) or *whether* the level is appropriate (subsidiarity)? **Stop: Hand back to Committee** if primarily preference/politics. Focus review only on level appropriateness.
  8.  **Subsidiarity-as-Help?** Is the measure genuinely *enabling* lower levels (e.g., setting minimum standards while allowing stricter local rules, providing coordination/resources)? Or is it *replacing/displacing* them? **Stop: Objection weakened/Contextual** if enabling/facilitative. (Judgment Call: Intent and effect).
  9.  **Formulate Opinion:** Based on steps 1-8, draft the opinion: "Objection Justified" (fails subsidiarity) or "No Subsidiarity Objection" (passes, or politics/preference). State clear reasons referencing the test steps.

  **Political Reality Check:** Your opinion is a *political tool*, not a legal veto. Effectiveness depends on:
  *   **Strength of Argument:** Rigorous, evidence-based objections (using this test) carry more weight.
  *   **Coalition Building:** Aligning with other regions/committees.
  *   **Political Pressure:** Media coverage, plenary debate.
  *   **Higher Level's Willingness:** They *can* (and often do) ignore objections unless there's significant pressure or a clear legal violation (rare outside specific EU contexts). The teeth come from political clout, not judicial enforcement.

  ---

  **Case Analyses**

  **1. Higher-Level Cap on Short-Term Holiday Rentals (e.g., Airbnb) in Tourist Cities**

  1.  **Exclusive?** No (Tourism/housing typically shared/local).
  2.  **Local Core?** **Yes.** Directly impacts local housing markets, land-use, resident welfare – core municipal/regional functions. **STOP: OBJECTION JUSTIFIED.** (Intrudes on core autonomy per step 2).

  **2. Higher-Level Common Accessibility Standards for Public Buildings**

  1.  **Exclusive?** No (Building regulations often shared/local; disability policy shared).
  2.  **Local Core?** Unlikely. Accessibility touches local building, but core function (e.g., deciding *which* buildings) remains. Proceed.
  3.  **Objective?** "Ensure equal access for persons with disabilities to essential public services nationwide." Clear, legitimate, necessary (equality imperative). Proceed.
  4.  **Lower-Level Capacity?** Regions *could* set standards. Some may have them. Proves *capacity exists*. **Burden shifts to higher level.** Proceed.
  5.  **Spillovers?** **Yes, Significant.** Persons with disabilities move between regions. Fragmented standards create barriers to free movement, access to services when traveling/relocating, and unequal protection of fundamental rights. Genuine cross-border impact. Proceed.
  6.  **Higher-Level Necessity/Benefit?** Higher level argues: Prevents a "patchwork" hindering mobility; ensures minimum rights protection everywhere; economies of scale for design/implementation guidance. **Meets Burden:** Addresses demonstrable spillover (mobility barrier) and fragmentation harm. Common minimum standard is a proportional tool. Proceed.
  7.  **Preference vs. Principle?** Disputes over *specific* ramp angles/door widths are preferences. The *need for common minimum standards* due to mobility is subsidiarity. This review focuses on level. Proceed.
  8.  **Subsidiarity-as-Help?** Can be enabling: Sets a floor, regions/cities can exceed it. Proceed.
  9.  **Opinion:** **NO SUBSIDIARITY OBJECTION.** Higher level demonstrated necessity due to cross-border spillovers and benefits of common action (Steps 5 & 6).

  **Straight Talk:** As a regionalist, this stings. But the mobility argument for accessibility standards is legally solid under subsidiarity. Your objection would likely lack teeth here. Focus resources on proposals failing earlier steps (like the rental cap).
