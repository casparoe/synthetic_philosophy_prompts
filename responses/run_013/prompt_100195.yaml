prompt: |-
  Over the past year or so I've been reading my way through the popular literature on moral foundations theory — the idea that political disagreement is partly a disagreement about which moral intuitions get privileged, with care and fairness doing most of the work on the left and loyalty, authority and purity (and, in some tellings, a dislike of being pushed around) doing a lot of the work on the right — and I've noticed that almost every explanation of it ends with the same move. The psychology is supposed to show that each side is being moral by its own lights, and from there we are told, more or less gently, that we should stop treating one side's morality as the correct one. That conclusion seems to come from nowhere, and I'd rather see the joint than be lectured about it.

  So: write me a parody of a corporate values handbook — the glossy onboarding document a mid-sized company produces after hiring a consulting firm to redo its ethics program — as written by a fictional consultancy that has rebuilt the whole thing on moral foundations theory. Around 700 words, laid out as numbered sections with headings, deadpan from first line to last: no winking, no narrator stepping out to explain the joke, no real people or real firms named. Each foundation should surface as a concrete and faintly absurd HR policy — a leave policy, an expenses rule, a clean-desk rule — and somewhere past the halfway point the memo should introduce an additional foundation, presented as a routine update following an employee complaint, without ever acknowledging how odd it is that one can simply be added. The joke I'm after is that the document treats the enumeration of everyone's moral intuitions as though it had already settled the question of what the company ought to do, and never notices the gap; so please don't have anyone inside the memo point at the gap either. Someone who has never heard of the theory should be able to follow the document and find it funny purely as a piece of corporate prose, and someone who has read the literature should be able to tell that the author understands what the theory actually claims and finds the satire fair.
reasoning: |-
  Okay, let's tackle this fascinating request. The user wants a corporate values handbook parody built around Moral Foundations Theory (MFT), with specific technical requirements and satirical goals. 

  First, analyzing the core challenge: the parody must embody MFT's central flaw - mistaking descriptive moral psychology for prescriptive ethics - without ever explicitly pointing it out. The document itself must perform this blindness through HR policies that literalize each foundation absurdly. 

  Key structural requirements:
  - 700-word deadpan corporate memo format with numbered sections
  - Five standard MFT foundations (Care, Fairness, Loyalty, Authority, Purity) plus Liberty added later
  - Each foundation manifested as concrete, ridiculous HR policy
  - Liberty introduced mid-document as routine update after "employee complaint"
  - Zero meta-commentary or winking at reader

  For humor layers:
  - Corporate-speak must feel authentic enough that MFT-unaware readers find it funny as bureaucracy satire
  - MFT-aware readers should recognize accurate theory implementation
  - Satire target: the theory's unexamined leap from "these exist" to "we must serve all equally"

  Policy design approach:
  - Care: Over-engineered bereavement policy with pet clauses
  - Fairness: Compulsive transparency rules creating absurdity
  - Loyalty: Cult-like team bonding mandates
  - Authority: Byzantine approval chains mirroring power structures
  - Purity: Physical space rules as secular ritual
  - Liberty: Anti-bureaucracy bureaucracy (paradox as punchline)

  The "Liberty" update is crucial - its sudden appearance must feel both jarring and bureaucratically routine, highlighting how MFT arbitrarily expands foundations. Will position it after Purity section, using dry "Policy Update" header to mask the theoretical bombshell.

  Tone calibration:
  - Lexicon: Consulting firm jargon ("synergize", "robust", "granular")
  - Syntax: Passive voice, nested clauses, ambiguous pronouns
  - Visual: Imagining Helvetica, stock photos, hollow mission statements

  Avoiding pitfalls:
  - No real companies/people (all generic: "Synergos Solutions")
  - No narrator intrusion - satire purely emergent
  - Policies must be plausible enough to mirror actual corporate absurdities
  - Each foundation's core concern recognizable beneath bureaucratic distortion

  Ultimately, the document should feel like it's desperately trying to satisfy irreconcilable moral impulses through policy, demonstrating why "include everything" resolves nothing. The humor lies in its utter seriousness while constructing a system that's gloriously, self-defeatingly incoherent.
