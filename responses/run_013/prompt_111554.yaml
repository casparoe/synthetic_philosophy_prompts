prompt: |-
  So my friend Dana and I got into this enormous argument last night about whether the Holocaust is unique, and about an hour in I realized I couldn't actually state the strongest version of either side, which is a problem, because I'm moderating a panel next week and one of the panelists is a historical sociologist who has basically built his career on a Bauman-style line — that the Holocaust wasn't a break from modernity or a relapse into barbarism but a product of it, the dark side of bureaucracy, division of labour, rational planning and industrial technique, the same toolkit that built the welfare state. He's charming, and he has this move where if you ask whether his story lets the perpetrators, or the ordinary Germans who looked away, off the hook, he says something like 'explaining isnt excusing' and then just keeps going. I want questions that make that move harder to pull off.

  Could you draft eight to ten questions for me? Please make sure there's at least one each on:

  1. What he thinks the word unique is even doing here — whether it's a claim about the past, a claim about what's possible, or a claim about moral status — and whether unique and comparable are really opposites, or whether you can honestly hold both at once.
  2. The tension I keep noticing between his modernity thesis and the uniqueness claim he's usually taken to accept: if the Holocaust is a structural possibility of modern society, doesn't that make it repeatable, and if it's repeatable, in what sense is it unique?
  3. The bit that seems to break his picture — that a big chunk of the killing happened before the camps, by mobile shooting squads, face to face, which is about as far from a factory of death as you can get. Does his thesis only cover part of the event?
  4. The earlier colonial genocide the same state carried out in German South-West Africa before WWI, where they ran camps and von Trotha issued an extermination order. If that's the precedent, where exactly does modernity come in?

  Then one that presses him on the difference between putting the Holocaust into a causal sequence with other atrocities (which is what the apologetic version of that move does) and merely comparing it — I want to see if he'll actually defend the line or just call it a smear. And end with something about what would actually change his mind.

  For each question give me a follow-up that's keyed to the answer he's most likely to give, so I'm not stuck improvising on the spot. And please dont give me citations or a reading list, I'm not writing anything, I just dont want to get steamrolled on my own panel.
