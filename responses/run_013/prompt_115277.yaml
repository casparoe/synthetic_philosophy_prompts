  2. Status of tiny probabilities in decision-making
  3. Whether EV maximization requires modification
  4. What constitutes a "genuine quantity"
  5. Whether counterintuitive results invalidate the rule

  For the Ladder crux, I'll have to define a transition zone (say n=15 to n=25) where they disagree about whether the lottery remains binding. The Maximizer will say always binding, Restrictionist will say binding fails somewhere in this range.

  On the Grain Principle: 
  - Restrictionist might accept it but note it doesn't solve large-stakes cases
  - Maximizer will reject it as arbitrary and unmotivated

  I should acknowledge that both positions are coherent but rest on different foundational commitments about rationality. The verbal dispute aspect might center on what counts as "following the argument where it leads."

  For what would change their minds:
