  - Restrictionist: demonstration that restrictions lead to dynamic inconsistency
answer: |-
  **Joint Statement on Expected Value Fanaticism**  
  Authored by the Maximizer and the Restrictionist  
  Chaired by [Your Name]  

  ### **Introduction**  
  We, the Maximizer and the Restrictionist, after one year of debate, present this statement to clarify agreements, disagreements, and unresolved questions regarding expected value (EV) maximization. We define EV as the sum of products of credences and real-valued outcomes for acts, where credences are the agent’s probabilistic beliefs. Value units are treated as exact and interpersonally comparable. We structure our agreement around three cases: the Toggle (Case 1), the Ladder (Case 2), and the Ordinary Case (Case 3), described below.  

  ---

  ### **1. Agreed Claims**  
  Both parties endorse the following non-truistic claims:  

  1. **EV Arithmetic is Formally Valid**: For any act, EV is computable from credences and a real-valued value function, regardless of probability or outcome magnitude.  
  2. **Case 1 EV Superiority**: In the Toggle, T has higher EV than S by ≈10⁶ units.  
  3. **Case 2 EV Uniformity**: In the Ladder, the lottery has an EV benefit of 10⁹ units at every rung *n*.  
  4. **Case 3 EV Recommendation**: In the Ordinary Case, the lottery (probability 10⁻², benefit 10⁹) is rationally required over a certain cost of 10⁶.  
  5. **EV as a Default Heuristic**: When probabilities and magnitudes are "moderate" (e.g., Case 3), EV maximization is rationally binding.  
  6. **No Incoherence in Fanaticism**: Strict EV maximization is logically consistent, even when endorsing acts with astronomically low probabilities of catastrophe (e.g., Toggle).  
  7. **Rejection of Arbitrary Thresholds**: A rigid probability cutoff (e.g., "ignore probabilities <10⁻¹⁵") is unmotivated by evidence or rationality norms.  
  8. **Evidence Sensitivity**: Credences must be responsive to evidence; inputs detached from empirical warrant may compromise rationality.  
  9. **Disagreement is Substantive**: Our conflict concerns the *scope* of rational obligation, not semantic confusion about "rationality."  
  10. **Value Realism**: Value units represent genuine normative weight (e.g., preventing harm), not mere utility tokens.  

  ---

  ### **2. Disagreements Table**  

  | Sub-Question | Maximizer’s Position | Restrictionist’s Position | Genuine/Verbal |  
  |--------------|----------------------|---------------------------|---------------|  
  | 1. **Does EV bind in Case 1?** | T is rationally required; rejecting it ignores dominance in expectation. | No act is required; inputs (e.g., credence 10⁻²⁰) lack empirical determinacy. | Genuine |  
  | 2. **Can low probabilities license risk-aversion?** | No probability is too small to ignore; avoidance must be justified by EV. | Probabilities below evidentiary resolution (e.g., 10⁻²⁰) permit risk-averse choices without irrationality. | Genuine |  
  | 3. **Is EV maximization complete?** | EV maximization is the full rule; "restrictions" abandon it. | EV is defeasible; it binds only when inputs are epistemically determinate. | Genuine |  
  | 4. **What makes a quantity "genuine"?** | Any real number in the model is genuine; idealization does not invalidate obligations. | Quantities must be supported by evidence (e.g., no theory licenses 10⁻²⁰ as precise). | Genuine |  
  | 5. **Does Case 2 bind at high *n*?** | The lottery is required at all *n*; EV is invariant. | Rational obligation dissolves at high *n* (e.g., *n*>20), where inputs lose meaning. | Genuine |  
  | 6. **Is fanaticism a "change of subject"?** | Restrictions alter the rule (e.g., to satisficing); they do not "fix" EV. | Restrictions preserve EV’s core but acknowledge its domain of applicability. | Verbal (see §5) |  

  ---

  ### **3. Cruxes**  
  Settling these would shift at least one party’s view:  

  - **Crux 1: Epistemic Limits of Credence**  
    **Case/Argument**: Does evidence ever support a credence of 10⁻²⁰ for a physical event?  
    - *Maximizer’s Prediction*: Evidence can indirectly support such credences (e.g., via models). Rejecting them invites arbitrariness.  
    - *Restrictionist’s Prediction*: No empirical process can warrant credences this precise; they are modeling artifacts.  

  - **Crux 2: The Ladder’s Binding Region (Case 2)**  
    **Disagreement Region**: *n* ≈ 15 to *n* ≈ 25 (probability 10⁻¹⁵ to 10⁻²⁵; harm 10²⁴ to 10³⁴).  
    **Test Point**: At *n*=20 (probability 10⁻²⁰, harm 10²⁹):  
    - *Maximizer*: Lottery remains obligatory (EV=10⁹ > cost 10⁶).  
    - *Restrictionist*: No obligation; inputs exceed evidentiary precision.  
    **Shared Impact**: If the lottery is intuitively irrational at *n*=20, Maximizer revises; if rational, Restrictionist revises.  

  - **Crux 3: Dynamic Consistency**  
    **Argument**: If agents reject EV in Case 1, do they avoid exploitable dilemmas (e.g., money-pump arguments)?  
    - *Maximizer’s Prediction*: Restrictionists face dynamic incoherence (e.g., inconsistent choices across time).  
    - *Restrictionist’s Prediction*: Coherence is preserved by evidential constraints; "exploits" assume false precision.  

  ---

  ### **4. The Grain Principle: Verdict**  
  **Candidate Principle**: *Credences have a finest grain—no evidence supports distinctions finer than grain size *g*—and no rational requirement turns on finer differences.*  

  - **Maximizer**: Rejects. Grain size is arbitrary, conflates epistemology with decision theory, and ignores structural dominance (e.g., Case 1’s EV gap persists regardless of grain).  
  - **Restrictionist**: Accepts, but **insufficient**. Grain addresses probability but not outcome magnitude (e.g., Case 2 with *g*=10⁻¹⁵ still allows *n*=16 (harm 10²⁵) to bind). Outcome grains are ill-defined, leaving fanaticism intact for large stakes.  
  **Joint Conclusion**: Rejected as a resolution. It fails to restrict fanaticism robustly and lacks independent grounding.  

  ---

  ### **5. Verbal Disputes**  
  One sub-question (§2, Row 6) is verbal:  
  - **Ambiguity**: "Expected value maximization" may refer to (a) the *arithmetic rule* or (b) a *decision norm applying the rule*.  
  - **Disambiguation**:  
    - The Maximizer uses (a): Any deviation is a new rule.  
    - The Restrictionist uses (b): The norm applies only where inputs are meaningful.  
  - **What Turns on This**: If (a), Restrictionist "restricts" are abandoning EV; if (b), they are clarifying it. The substantive dispute (§2, Rows 1–5) remains.  

  ---

  ### **6. What Would Change Our Minds**  
  - **Maximizer’s Falsifier**: A consistent, non-arbitrary rule that (i) dominates EV in practical rationality, and (ii) handles extreme cases without dynamic inconsistency.  
  - **Restrictionist’s Falsifier**: Proof that evidentiary constraints *never* license ignoring extreme inputs, or that doing so *systematically* leads to exploitable inefficiency.  
  - **Shared Movers**:  
    - **Empirical**: Evidence that humans reliably achieve better outcomes by ignoring EV in extreme cases (e.g., avoiding Toggle-like real decisions).  
    - **Theoretical**: A model where "determinacy" is formalized (e.g., metrical thresholds for evidence), resolving Cases 1–2 unambiguously.  
  **Current Stance**: No such evidence exists, but Case 2 experiments (e.g., agent simulations at *n*=20) could shift views.  

  ---

  **Conclusion**  
  We agree on EV’s mathematical validity and its force in ordinary cases (e.g., Case 3). We disagree on whether rationality requires obedience to EV under extreme idealizations (Cases 1–2). This reflects a deeper conflict: the Maximizer sees rationality as *computational consistency*, while the Restrictionist ties it to *epistemic warrant*. Nothing either party accepts now resolves this, but empirical tests at the Ladder’s disputed rungs (§3) offer a path forward. We sign below.  

  — The Maximizer  
  — The Restrictionist  

  ---  
