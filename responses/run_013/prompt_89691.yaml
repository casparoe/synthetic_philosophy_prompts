  ## Use-of-Force Review Board Draft Opinion: Officer A. Smith Case #UOF-2024-178

  **Date:** [Current Date]
  **To:** Members, Use-of-Force Review Board
  **From:** Chair, Use-of-Force Review Board
  **Subject:** Recommendation and Analysis Regarding Officer Smith Shooting Incident; Proposed Rule for Assessing Reasonableness of Perception

  **I. Introduction**
  This opinion addresses the fatal shooting by Officer A. Smith on [Date], where Mr. J. Doe, perceived by Officer Smith to be holding a firearm, was subsequently found to be holding a cellular phone. Our mandate is to evaluate whether Officer Smith's use of deadly force was objectively reasonable based on the circumstances *as he perceived them at the time*, per Department Policy 4.05.07(B). The central question before us is how to assess the reasonableness of an officer's perception when that perception is demonstrably mistaken and potentially influenced by the officer's expectations.

  **II. The Core Disagreement & Proposed Rule**
  The Board's split reflects a fundamental tension in applying the "reasonably perceived threat" standard:
  *   **Argument A (State of Mind Focus):** An officer's report of seeing a weapon is primarily evidence of their internal state (expectations, beliefs, biases). A mistaken perception shaped by expectation is therefore a failure of judgment or preparation for which the officer bears responsibility.
  *   **Argument B (Perceptual Malfunction Focus):** Human perception is inherently shaped by expectation and context; an officer genuinely experiencing a perceptual error (seeing a phone as a gun) due to environmental stress and reasonable cues has little immediate control over that specific perception. The error is a system/training issue, not individual culpability.

  **After careful deliberation, I recommend the Board adopt the following rule (the "Reasonable Expectation Rule"):**

  > **"The reasonableness of an officer's perception of a threat is assessed based on the totality of the circumstances known to or reasonably knowable by the officer *immediately prior to* the perception.**
  > **a) If the officer's *expectation* of encountering a threat (e.g., a weapon) was itself objectively reasonable based on reasonably available information (dispatch, intelligence, context, subject behavior), then a subsequent mistaken perception consistent with that reasonable expectation shall generally be considered within the scope of the 'reasonable perception' standard, even if factually incorrect.**
  > **b) If the officer's *expectation* of encountering a threat was not objectively reasonable (lacking sufficient basis in the known circumstances, influenced by unreasonable bias, or contradicted by readily available information), then any subsequent mistaken perception flowing from that unreasonable expectation undermines the reasonableness of the perception itself. The mistake is therefore indicative of a failure in judgment or preparation."**

  **III. Rationale for the Reasonable Expectation Rule**

  1.  **Aligns with Legal Standard (Graham v. Connor):** The "objective reasonableness" standard requires judging the officer's actions from the perspective of a reasonable officer *on the scene*, with the officer's knowledge *at that moment*. This rule focuses on the information shaping the officer's mindset *before* the critical perception occurs.
  2.  **Manages the Perception-Judgment Nexus:** It acknowledges that expectation *influences* perception but places the critical evaluation on the *formation of that expectation*. Was the officer primed for a threat because the situation genuinely warranted it, or because of flawed reasoning or bias?
  3.  **Promotes Accountability Where Needed:** It holds officers accountable for developing unreasonable expectations based on inadequate information, poor tactics, or bias. An officer who unreasonably *expects* a threat is more likely to misperceive one.
  4.  **Avoids Punishing Genuine Perceptual Errors in High-Stakes Scenarios:** It recognizes that in dynamic, high-stress situations where a reasonable officer *would* expect a threat (e.g., responding to an armed suspect call), tragic misperceptions can occur despite sound judgment and training. Focusing blame here is counterproductive and ignores human perceptual limitations under stress.
  5.  **Guides Training and Policy:** It clearly delineates when a mistake stems from flawed expectation formation (requiring training on bias, intelligence gathering, tactical patience) versus when it stems from the inherent limitations of human perception under extreme stress despite reasonable preparation (potentially requiring different training approaches or system changes like better lighting, less ambiguous technology).
  6.  **Practical Application:** It provides a clearer framework for the Board. We must diligently examine the information flow and context *before* the shooting: What did dispatch say? What did the officer observe en route and upon arrival? What was the subject's behavior *prior* to the perception of the weapon? Was the environment conducive to misidentification?

  **IV. Application to Officer Smith's Case & Recommended Disposition**
  *   **Applying the Rule:** Our review must focus intensely on the circumstances *prior* to Officer Smith perceiving the "gun."
      *   *Was the expectation of a gun reasonable?* Examine the dispatch call details. Was it reported as a "man with a gun"? What specific descriptions were given? What was the location (high crime area known for weapons?)? What was Mr. Doe's behavior upon Officer Smith's arrival? Did he make furtive movements, refuse commands, reach suddenly for his waistband in a manner consistent with drawing a weapon? Did environmental factors (lighting, distance, obstructions) play a role *despite* reasonable positioning?
      *   *If the expectation was reasonable:* Then Officer Smith's perception of a gun, even though mistaken, would fall within the scope of a reasonable perception under our policy. The mistake would be tragic but not a policy violation warranting discipline.
      *   *If the expectation was unreasonable:* If the call was vague (e.g., "suspicious person"), no specific weapon was mentioned, Mr. Doe was compliant initially, or the environment clearly showed the object was a phone, then Officer Smith's perception was unreasonable *because* his expectation lacked sufficient basis. This would constitute a failure of judgment.
  *   **Recommended Disposition Based on Current Record (Pending Further Scrutiny):** Based on the preliminary report stating the call was for a "man with a gun" matching Mr. Doe's description in a location associated with weapons offenses, **if confirmed by dispatch logs and other evidence**, Officer Smith's *expectation* of encountering an armed subject was likely objectively reasonable. Therefore, his subsequent perception of a gun, though tragically mistaken, would be considered reasonable under the circumstances as he perceived them. **I recommend a finding of "Within Policy" for the use of force itself.**
  *   **Mandatory Follow-Up Regardless:** This finding does not preclude:
      *   **Training Referral:** Intensive scenario-based training focused on threat identification under stress, confirmation bias mitigation, and tactical communication to create time and space for assessment.
      *   **Tactical Review:** Examination of Officer Smith's positioning, use of cover, communication tactics, and whether alternative actions were feasible *before* the perception crystallized.
      *   **Policy Review:** Consider recommending policy enhancements regarding response protocols to "man with a gun" calls to emphasize de-escalation tactics and visual confirmation where possible.

  **V. The Strongest Argument for the Rejected Position (Perception as Involuntary Malfunction)**

  The most compelling version of the opposing view argues:

  "Neuroscience and psychology unequivocally demonstrate that perception is not a passive recording of reality but an active construction heavily influenced by expectation, context, and stress. In the split-second, life-or-death scenario Officer Smith faced, his brain, primed by a credible 'man with a gun' call and potentially threatening movements, *literally interpreted* ambiguous sensory data (the phone) as the expected threat (a gun). This was not a conscious choice or a failure of judgment in that instant; it was a predictable, albeit tragic, neurobiological response. Expectation shapes perception at a pre-conscious level. Punishing Officer Smith for this neural 'malfunction' is akin to punishing someone for seeing an optical illusion. The focus must be entirely on systemic fixes: improved training to widen officers' perceptual templates in high-threat scenarios, better technology (e.g., lighting, less lethal options readily available), and refining dispatch protocols to minimize unnecessary threat priming. Attributing blame to the officer for how his brain processed information under extreme duress is unscientific and unjust, and fails to address the root causes of such tragedies."

  **VI. Conclusion & Recommendation for Vote**
  I recommend the Board adopt the **"Reasonable Expectation Rule"** as the standard for evaluating the reasonableness of an officer's perception when that perception is factually mistaken. Applying this rule to the current case, based on the preliminary information suggesting a reasonable basis for expecting an armed subject, **I move for a finding that Officer Smith's use of force was "Within Policy."** I further recommend referring Officer Smith for enhanced threat identification and bias mitigation training and initiating a review of tactics and dispatch protocols related to weapons calls.

  I urge all members to carefully review the dispatch logs, any available video/audio, witness statements regarding Mr. Doe's behavior *prior* to the shooting, and the full investigative file before Thursday's vote, focusing specifically on the reasonableness of Officer Smith's expectation of encountering a gun *before* he perceived it.

  Respectfully submitted,

  Chair, Use-of-Force Review Board
