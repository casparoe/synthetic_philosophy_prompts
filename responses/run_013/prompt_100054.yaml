  Scenario:

  Build a deterministic computing machine with two components: a predictor program P and a decider program Q. The machine's initial state includes the source code of P and an input string I. At t0, the machine runs P on input (source(P), I) and allows it a fixed time interval Δt to output a bit (0 or 1). If P fails to output in Δt, a default bit (say 0) is recorded. Then Q is run immediately after Δt, which simply outputs the opposite of P's output. The future state to predict is Q's output at time t0+Δt. The system is deterministic because the initial state and fixed programs determine P's behavior and thus Q's output. However, no internal observer (including P) can compute Q's output before t0+Δt: P cannot because it would require simulating itself within Δt, which may lead to an infinite regress or require the same Δt that it has, and any other internal observer attempting the same simulation would face the same time constraint and might not finish before t0+Δt.

  Analysis:

  - Determinism thesis: The future is fixed. Given the initial state (source code of P and I) and the fixed rules, Q's output is determined.
  - Predictability thesis: An internal observer can in principle work out the future state (Q's output) before it happens. But in this case, it cannot. The obstacle is that the computation of P's output is necessary to know Q's output, and that computation takes time Δt. Therefore, until Δt has elapsed, the output of P is not fixed (it might be in progress or timed out) and thus Q's output is not computable until after Δt. Moreover, any attempt to compute it by simulation would require at least time proportional to the running time of P, which may be Δt, so it cannot be known before t0+Δt.

  Therefore, the two theses come apart: the future is fixed but not predictable in principle by an internal observer before it happens.

  The structural feature breaking the entailment is the causal and temporal dependency of the future state on a computation that requires a fixed amount of time to complete. The future state is determined by the outcome of that computation, but that outcome is not available until the computation finishes.

