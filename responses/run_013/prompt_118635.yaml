prompt: |-
  When a prediction market puts the chance of some event at seventy per cent, news reports present that figure as the market's probability, and treat it as a better estimate than the judgement of any individual trader. What theory of disagreement does that practice presuppose? It seems to require that traders differ only in their information while sharing a background view of how likely things are in the first place — a common prior — so that the price can be read as everyone's pooled judgement. Reconstruct that implicit theory, and say which rival accounts of disagreement it quietly rules out, in particular the view that people hold irreducibly different prior commitments, so that no exchange of information would ever reconcile them. Then say whether the practice is internally consistent, and distinguish what it strictly requires from what merely suits it. The same markets are full of speculative trading, in which each side believes it knows better than the price; and there is a standard result to the effect that, where the way traders come by their information is common knowledge and no one is irrational, no one can profit from private information, because an offer to trade would itself reveal it. Is the common prior what makes the price readable as a probability, or does it only underwrite the result that makes speculative trading mysterious? And what would have to change in the way we speak of market prices if we gave it up?
reasoning: |-
  Okay, the user is asking about the theory of disagreement implied when prediction markets treat the market price as a probability estimate. They mention that this practice assumes a common prior among traders, differing only in information. I need to reconstruct that theory, identify rival accounts it rules out, and discuss internal consistency.

  First, the implicit theory is the Common Prior Assumption (CPA), part of the Rational Expectations framework. Under CPA, traders share the same prior probability for an event but update it with private information. The market aggregates all private info into the price, making it the best estimate. This rules out views where people have irreducibly different priors based on values or ideologies, meaning no amount of information could reconcile them.

  Next, is this practice internally consistent? The user points out speculative trading seems contradictory. Traders bet against the price, believing their private info makes it wrong. But the no-trade theorem shows that with common knowledge of rationality and how info is acquired, no speculative trades should occur because offering a trade reveals info. So, speculative trading suggests deviations from CPA or rationality, but the practice still treats the price as a probability because, in aggregate, the market reflects pooled info despite individual disagreements.

  The user also asks what changes if we drop CPA. Without it, the price isn't necessarily a probability; it could reflect clashing priors. We'd need to speak of prices as consensus points or betting odds, not objective probabilities. This affects how news reports interpret market prices.

  Deep needs: The user likely wants to understand the philosophical underpinnings of prediction markets and their limitations. They might be interested in epistemology, economics, or how collective intelligence works. They might also be critiquing the assumption of common priors in real-world scenarios where cultural or ideological differences exist. Ensuring clarity on when prediction markets are reliable versus when they're not is key here.
answer: |-
  The practice of interpreting a prediction market price (e.g., 70%) as a probability estimate presupposes the **Rational Expectations Hypothesis with a Common Prior (REH-CPA)**, specifically within the framework of Aumann's Agreement Theorem and the efficient markets hypothesis applied to probabilities.

  **Reconstructing the Implicit Theory:**
  1.  **Common Prior (CPA):** All traders share the same initial, fundamental ("prior") probability assessment for the event, based on public background knowledge and a shared model of the world.
  2.  **Private Information:** Traders possess diverse, private signals or pieces of information relevant to the event's likelihood.
  3.  **Rationality & Bayesian Updating:** Traders are rational Bayesians. They correctly interpret their private information and update the common prior using Bayes' theorem to form their individual ("posterior") beliefs.
  4.  **Market as Information Aggregator:** The market price emerges from the interaction of these rational, Bayesian traders. The process of trading (bidding/asking) reveals information. In equilibrium, the market price fully aggregates *all* dispersed private information.
  5.  **Price as Probability:** The resulting equilibrium market price reflects the posterior probability *every* trader would hold if they possessed *all* the private information known to *any* trader. It becomes the "synthesized" posterior probability based on the pooled information, relative to the common prior. This is the market's consensus probability estimate.

  **Rival Accounts of Disagreement Ruled Out:**
  This theory explicitly and quietly rules out accounts where disagreement stems from:
  *   **Irreducibly Different Priors (Deep Priors):** The view that people fundamentally disagree about the "baseline" likelihood of events or the structure of the world *before* receiving any specific information. This could arise from:
      *   **Conflicting Worldviews:** Different ideological, philosophical, or religious frameworks shaping fundamental assumptions.
      *   **Heterogeneous Models:** Different mental models about how cause and effect operate in the relevant domain.
      *   **Value-Laden Priors:** Priors influenced by desires, fears, or moral commitments rather than purely "objective" assessment.
  *   **Systematic Biases:** The possibility that traders systematically misinterpret information, suffer from consistent cognitive biases, or use flawed heuristics, leading to persistent disagreement even with shared information.
  *   **Motivated Reasoning:** The idea that beliefs are shaped to serve psychological needs or goals (e.g., identity protection, wishful thinking), rather than purely Bayesian updating.
  *   **Radical Interpretation Differences:** The possibility that the *meaning* of evidence itself is contested, so the same signal leads to divergent updates based on different interpretations.

  The core rival ruled out is the **"Deep Priors" view**: that people hold fundamentally different starting points ("priors") such that *no* amount of exchanging information could ever reconcile their differing probability assessments. Under REH-CPA, disagreement *only* exists due to differing information; exchanging information *must* lead to consensus.

  **Internal Consistency and the Speculative Trading Puzzle:**

  *   **Is it Internally Consistent?** The practice is **internally consistent *as an ideal model***. It logically follows from the core assumptions (CPA, Rational Bayesian Updating, Efficient Aggregation). The model *predicts* that once information is aggregated, consensus is reached, and the price reflects this.
  *   **Strict Requirement vs. What Merely Suits It:**
      *   **Strict Requirement:** A **Common Prior** is *absolutely essential* for interpreting the market price as *the* Bayesian posterior probability representing a pooled judgment. Without CPA, the price is just an equilibrium betting odd, not a probability estimate reflecting a single underlying truth-state.
      *   **Merely Suits It:** The *efficiency* of information aggregation (the "Rational Expectations" part) makes the price a *good* estimate. Traders being perfectly rational Bayesian updaters makes the aggregation process work ideally. Speculators believing they know better than the price is *permissible* only if they have *truly* private information not yet incorporated, but the model predicts this should be temporary and vanish upon trading (see No-Trade theorem).

  **Speculative Trading and the No-Trade Theorem:**

  *   **The Puzzle:** Real markets are full of speculative trading where traders *do* believe they know better than the price and act on that belief. This seems at odds with the REH-CPA model.
  *   **The No-Trade Theorem (Milgrom-Stokey):** This theorem states that if:
      1.  Traders have a common prior (CPA).
      2.  Traders are rational (Bayesian).
      3.  The *structure* of how information is acquired ("information partitions") is common knowledge.
      4.  Markets are efficient/in equilibrium.
      Then **no rational trader will be willing to trade purely based on private information.** An offer to trade itself reveals that the trader believes they have superior information, causing others to adjust their beliefs and the price *immediately*, eliminating the perceived profit opportunity. Speculative trade should not occur.

  *   **Role of the Common Prior:**
      *   **Making the Price Readable as a Probability:** The CPA is fundamentally *required* for interpreting the price as *the* synthesized posterior probability. It provides the shared baseline for information aggregation to yield a unique probability.
      *   **Underwriting the No-Trade Theorem:** The CPA is also a core assumption *of* the No-Trade Theorem. The theorem explains *why*, under the REH-CPA ideal, speculative trading based solely on private information should be impossible. The existence of widespread speculative trading is therefore evidence *against* the strict REH-CPA model holding perfectly in reality. It suggests violations of CPA, full rationality, common knowledge of information structures, or instantaneous price adjustment.

  **Speaking of Market Prices Without the Common Prior:**

  If we abandon the Common Prior Assumption, our interpretation of prediction market prices must change fundamentally:

  1.  **Not Objective Probabilities:** The price can no longer be straightforwardly interpreted as *the* Bayesian posterior probability of the event occurring. It loses its claim to be the "best estimate" synthesized from all information relative to a shared truth.
  2.  **Equilibrium Betting Odds:** The price becomes an **equilibrium betting odd** – the price at which the aggregate demand to bet "Yes" equals the aggregate demand to bet "No," given the *actual* heterogeneous beliefs (priors and posteriors) in the market.
  3.  **Reflecting Consensus of Willingness-to-Bet:** It reflects the point where the most optimistic buyers and the most pessimistic sellers meet, given their differing fundamental views and information. It's a consensus on *betting value*, not necessarily on *truth likelihood*.
  4.  **Interpretation Requires Caution:** News reports could no longer confidently state "the market believes there is a 70% chance." They would need to say something like "the current market price implies betting odds equivalent to a 70% probability" or "traders collectively set a price implying a 70% chance," acknowledging this reflects a balance of heterogeneous beliefs and liquidity, not necessarily a single pooled judgment about the true probability.
  5.  **Focus on Information Signals:** Price *movements* could still be interpreted as reactions to new information (public or aggregated private), but the *level* of the price itself wouldn't have the strong "probability" interpretation.

  **In summary:** The practice relies on the Common Prior Assumption (CPA) within a Rational Expectations framework. This rules out disagreement rooted in fundamentally different starting worldviews. While internally consistent as an ideal model, the prevalence of speculative trading highlights deviations from its assumptions in reality. The CPA is crucial *both* for interpreting the price as a probability *and* for the no-trade theorem that makes speculative trading puzzling within the model. Abandoning CPA forces us to see the price as an equilibrium betting odd reflecting heterogeneous beliefs, not as a unique probability estimate.
