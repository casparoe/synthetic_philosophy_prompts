  - Total net benefit = -450.

  **Verdict**: Negative, so reject.

  But note: we did not count the happiness of the saved children (the healthy life years). And we did not count the fact that without the proposal, the child dies and loses the entire life (which in Group A would be counted as YLLs). But in Group B, we don't count the loss of happiness (the healthy years). So the result is that saving the children looks bad because of the suffering they will endure.

  This is a counterintuitive result and one that you (the research director) might not like. But it is consistent with the board's principle.

  #### Example 3: Fertility treatment
  - **Group A**: None (because the proposal causes the birth of children who would not otherwise exist).
  - **Group B**: The children born as a result of the treatment.

  **Calculation**:
  - Net_B: The suffering (YLDs) that these children will experience in their lifetime. 
     - Per child: 9 YLDs (as above).
     - Suppose 20 children are born per year.
     - Total Net_B = - (20 * 9) = -180 YLDs.

  - Group A: no effect.

  - Total net benefit = -180.

  **Verdict**: Negative, so reject.

  ### Discussion

  - **Saving a life vs. preventing a birth**: The instrument makes saving a life look worse than preventing a birth. Why? 
     - Preventing a birth (contraception) avoids suffering (counted as a benefit) without having to account for the avoided happiness (which we ignore).
     - Saving a life (neonatal unit) adds suffering (counted as a cost) and we ignore the added happiness.

  - **Population size**: The principle implies that we should prefer a smaller population because adding people always introduces suffering (which we count) and we ignore their happiness. So a larger population, even if happier on average, might be disfavored because the total suffering (even if low per person) accumulates.

  - **Two readings of the minute**: 
     - Reading 1 (what we owe): We do not owe it to a person to bring them into existence, so we don't count the happiness as a benefit. But if we do bring them in, we have a duty to prevent suffering? The minute says the suffering counts against. This matches our treatment (we count the suffering as a cost).
     - Reading 2 (what is good): The happiness of a person whose existence is caused by the proposal is not good at all. Then we shouldn't count it. This is the same as our treatment.

     In our examples, we did not count the happiness for Group B in either reading. So there is no difference in the verdicts for these examples.

     However, if there were a proposal that caused a person to exist and also reduced their suffering (beyond what they would have had), then for Group B we would count the reduction in suffering as a benefit? But note: the board's principle says "the suffering that person would undergo counts against the proposal". It doesn't say we can count a reduction in suffering as a benefit. We only count the absolute suffering they undergo. So if the proposal causes the person to exist and also improves their health (reducing suffering below what it would have been), we would still count the actual suffering they undergo as a cost, and we would not count the reduction. But the board's principle is ambiguous on this.

     We have not handled that case. We assumed that for Group B, we only count the suffering that occurs, regardless of any improvement the proposal might bring. But the minute does not address interventions that change the suffering of Group B beyond causing their existence.

     To remove the ambiguity, the board should clarify: 
     - For Group B, do we count the total suffering that the person would experience (if the proposal is implemented) as a cost, or do we count the incremental suffering caused by the proposal (compared to a baseline where they exist)? 
     - In our examples, we used the total suffering (for fertility) and the incremental suffering for the neonatal unit (because without the proposal, the child existed for a short time). 

     We tried to be consistent by using the suffering that is caused by the proposal. But the minute doesn't specify. We recommend the board add: 
     > "The suffering that person would undergo as a result of the proposal counts against the proposal."

     Then we would interpret: 
     - For causing existence: the total suffering they undergo is a result of the proposal? Or only the suffering that is additional to what would have occurred without the proposal (which might be none)? 

     Given the complexity, we have designed the instrument to use the incremental suffering caused by the proposal. But for fertility treatment, without the proposal there is no child, so the entire suffering is caused by the proposal. For neonatal, without the proposal the child dies, so the entire suffering during the extended life is caused by the proposal.

  - **The phrase "does not count for it"**: We treated it as zero (so we ignore it). We did not treat it as weightless (because weightless might mean we don't know how to weigh it) or incomparable. The choice is: we are not giving it any weight in the calculation. What turns on the choice? If we treated it as incomparable, then we could not aggregate at all and we would have to use a different decision rule. We avoided that for simplicity.

  ### Final Instrument

  **The Asymmetry Principle Evaluation Instrument**

  **Step 1: Identify the Affected Populations**
  - Determine the set of individuals whose well-being is affected by the proposal.
  - Split them into:
     - Group A: Individuals who would exist in both scenarios (with and without the proposal) for the entire period of the project's impact.
     - Group B: Individuals whose existence (or non-existence) is determined by the proposal. This includes:
          - Individuals who would be born (or not) because of the proposal.
          - Individuals whose survival (i.e., continued existence) is determined by the proposal (e.g., without the proposal they die and cease to exist).

  *Record*: The size of Group A and Group B, and the reasoning for the split.

  *Evidence*: Field partner projections, demographic data.

  **Step 2: Calculate Net Impact for Group A**
  - Estimate the change in well-being for Group A using a standard health metric (e.g., DALYs averted). This captures both reduced suffering and increased happiness (in the form of healthy life years).
  - Net_A = DALYs averted (or other metric) for Group A.

  *Record*: The calculation, including data sources and assumptions.

  **Step 3: Calculate Net Impact for Group B**
  - For each individual in Group B:
     - If the proposal causes the individual to exist (e.g., fertility treatment, life-saving intervention):
          - Estimate the incremental suffering (in YLDs) that the individual will experience as a result of the proposal. This is the suffering during the life that is caused by the proposal.
          - For life-saving, subtract the suffering that would have occurred in the baseline (without proposal) to get the incremental suffering caused by the proposal.
          - Cost_B_per_person = - (incremental YLDs)
     - If the proposal prevents the individual from existing (e.g., contraception):
          - Benefit_B_per_person = + (the YLDs that the individual would have experienced if born) [because we avoid it]
  - Sum over all individuals in Group B to get Net_B.

  *Record*: The per-person suffering (YLDs) and the total Net_B.

  **Step 4: Combine and Decide**
  - Total net benefit = Net_A + Net_B
  - If Total net benefit > 0: Approve
  - If Total net benefit < 0: Reject
  - If Total net benefit == 0: Flag for board review (or use other criteria)

  *Record*: The total.

  **Step 5: Handling Uncertainty and Non-Quantifiables**
  - If data is missing, use qualitative estimates (low, medium, high) for suffering (YLDs) and convert:
     - Low: 5 YLDs
     - Medium: 20 YLDs
     - High: 50 YLDs
  - If the uncertainty is high, record a range and if the decision is sensitive, flag for board review.

  **Conditions to Stop and Hand to the Board**
  - If Step 1 is highly uncertain (e.g., we cannot determine who exists in the baseline) and it is material.
  - If the suffering for Group B cannot be estimated and the size of Group B is large.
  - If the proposal has effects that are not captured by health metrics (e.g., education, economic well-being) and these are material.

  **Explicit Judgment Calls**
  1. Step 1: Deciding who is in Group B, especially for life-saving interventions (we include them).
  2. Step 3: Estimating the suffering for Group B (requires projections of lifelong morbidity).
  3. Step 5: Converting qualitative to quantitative.

  **What the Instrument Cannot Do**
  - Handle non-health impacts well.
  - Account for the happiness of Group B.
  - Avoid counterintuitive results (e.g., rejecting life-saving and fertility treatments).
  - Resolve deep philosophical ambiguities.

  We have now designed the instrument and run the three examples. The results are:
  - Example 1 (contraception): Approve
  - Example 2 (neonatal unit): Reject
  - Example 3 (fertility treatment): Reject

  These results may be unpalatable, but they follow from the board's principle. The board may wish to reconsider the principle or provide further guidance.
answer: |-
  ### The Asymmetry Principle Evaluation Instrument

  #### 1. Ordered Procedure  
  **Goal:** Determine whether a proposal satisfies the asymmetry principle. Officers must document each step. Evidence accepted: Program data (e.g., demographic stats, health surveys), expert projections (e.g., WHO/UN models), and historical analogs. Avoid RCTs or speculative studies.

  | Step | Question | Sufficient Answer | Evidence Accepted | Officer Records |
  |------|----------|-------------------|-------------------|----------------|
  | **1** | Does the proposal change *whether* specific people come into existence? | Binary (Yes/No). If "No," skip to Step 3. | Demographic projections, fertility/survival rates. | - List affected subpopulations.<br>- Justification for "Yes/No." |
  | **2a** | For people whose *existence depends on the proposal* (Group B): What suffering (e.g., disability, disease, poverty) will they experience? | Quantified suffering (e.g., DALYs<sup>†</sup> due to morbidity, not mortality). Use ranges if exact numbers unavailable. | Health burden studies, disability prevalence data, economic forecasts. | - Estimated suffering per person (S<sub>B</sub>).<br>- Population size (n<sub>B</sub>). |
  | **2b** | For Group B: What happiness (e.g., joy, health, fulfillment) will they experience? | **Do not quantify.** Acknowledge but assign no weight. | N/A (ignore provided data). | "Happiness noted but excluded per asymmetry." |
  | **3** | For people who *would exist regardless* (Group A): What change in suffering or happiness will they experience? | Net change in well-being (ΔW<sub>A</sub>), combining reduced suffering and added happiness (e.g., DALYs averted + QALYs gained). | Pre-post intervention models, comparable program outcomes. | - ΔW<sub>A</sub> (positive if net gain).<br>- Affected population (n<sub>A</sub>). |
  | **4** | **Calculate net impact:**<br>- Group B: Total suffering cost = n<sub>B</sub> × S<sub>B</sub> (counted *against* proposal).<br>- Group A: Net change = ΔW<sub>A</sub> (counted *for/against*).<br>**Sum:** Net = ΔW<sub>A</sub> – (n<sub>B</sub> × S<sub>B</sub>) | Numerical score (or range if uncertain). | N/A (calculation only). | - Net score.<br>- Formula inputs. |
  | **5** | **Decision:** Is Net ≥ 0? | Binary (Yes/No). If unclear, proceed to Step 6. | N/A | Verdict (Approve/Reject). |

  <sup>†</sup>DALYs = Disability-Adjusted Life Years (measure of suffering); QALYs = Quality-Adjusted Life Years (measure of well-being).

  ---

  #### 2. Conditions for "No" or Board Referral  
  - **Return "No":** Net < 0.  
  - **Refer to board:**  
    - Step 1 is ambiguous (e.g., existence hinges on debatable counterfactuals).  
    - Step 2a/3 cannot be quantified (e.g., no credible data, outcomes too subjective).  
    - Step 4 yields Net = 0 or a close call (±10% margin of error).  
    *Rationale:* The board must resolve judgments about values (e.g., "How much suffering is too much?"), not officers.

  ---

  #### 3. Rule for Mixed Proposals  
  Most proposals affect **Group A (existing people)** and **Group B (new/avoided people)**.  
  - **Rule:** Isolate impacts:  
    - Group A: Count ΔW<sub>A</sub> (net well-being change).  
    - Group B: Count only S<sub>B</sub> (suffering of new people *or* suffering averted by preventing births).  
    - **Net = ΔW<sub>A</sub> – S<sub>B</sub>** (for new people) **or ΔW<sub>A</sub> + S<sub>B</sub>** (if preventing births).  
  - **Substitute for missing comparisons:** Use population-level baselines (e.g., national suffering averages) for Group B. Do *not* compare to hypothetical well-being of non-existent people.

  ---

  #### 4. Rule for Unquantifiable Cases  
  When suffering (S<sub>B</sub>) or well-being (ΔW<sub>A</sub>) cannot be quantified:  
  - **Step 2a (S<sub>B</sub>):** Assign qualitative tiers:  
    - *Low suffering:* Brief/reversible hardship (e.g., common illness). Default: 5 DALYs/person.  
    - *Medium suffering:* Chronic but non-fatal (e.g., malnutrition). Default: 20 DALYs/person.  
    - *High suffering:* Severe disability/pain (e.g., genetic disorders). Default: 50 DALYs/person.  
  - **Step 3 (ΔW<sub>A</sub>):** Use donor-approved analogs (e.g., a maternal health program’s past impact). If none, refer to board.  
  - **Document:** "Default tier used due to lack of data."

  ---

  #### 5. Judgment Calls Dressed as Procedure  
  | Step | Judgment Call | What Officer Really Decides |
  |------|---------------|----------------------------|
  | 1 | Defining "existence dependency." | Whether survival/fertility effects are significant enough to create Group B. |
  | 2a | Assigning S<sub>B</sub> values. | How to weigh suffering (e.g., is poverty "worse" than disease?). |
  | 3 | Combining happiness/suffering in ΔW<sub>A</sub>. | Whether gains outweigh losses for Group A (e.g., is reducing maternal deaths worth the cost?). |
  | 4 | Net calculation with ranges. | Whether uncertainty is large enough to sway the verdict. |

  ---

  #### 6. Limitations  
  - **Cannot:**  
    - Handle non-health proposals (e.g., education) without health proxies.  
    - Assign moral weight to happiness of new people (Group B).  
    - Resolve disputes about existence thresholds (e.g., "Is saving a life *creating* a person?").  
  - **Misfires on:**  
    - Proposals where happiness dominates (e.g., arts/culture for Group B).  
    - Low-suffering populations (e.g., affluent groups in high-income countries).  
    - Long-term intergenerational effects (e.g., climate interventions).  

  ---

  ### Worked Examples  
  **Key Assumptions:**  
  - Suffering (S<sub>B</sub>) measured in DALYs. Happiness ignored for Group B.  
  - Default suffering tiers used when data gaps exist.  
  - Low-income country context: Avg. suffering = 0.15 DALYs/year/person (from WHO). Life expectancy = 60 years → S<sub>B</sub> ≈ 9 DALYs/person for a full life.  

  ---

  #### Example 1: District-Wide Contraceptive Access  
  - **Proposal:** Expand contraception to avert 300 births/year and reduce maternal deaths by 10/year.  
  - **Analysis:**  
    - **Step 1:** Yes. Averted births = Group B (existence prevented). Mothers = Group A (exist regardless).  
    - **Step 2a (Group B):** Averted births avoid suffering. S<sub>B</sub> = 9 DALYs/birth (full-life default). n<sub>B</sub> = 300 → Total S<sub>B</sub> averted = **+2,700 DALYs** (benefit, counted *for*).  
    - **Step 2b:** Happiness of averted births ignored.  
    - **Step 3 (Group A):** Mothers avoid death/complications. ΔW<sub>A</sub> = 10 deaths averted × 35 DALYs/death = **+350 DALYs**.  
    - **Step 4:** Net = ΔW<sub>A</sub> + S<sub>B</sub> averted = 350 + 2,700 = **+3,050 DALYs** (≥0).  
  - **Verdict:** Approve.  
  - **Asymmetry Effect:** Preventing births adds value by avoiding suffering.  

  ---

  #### Example 2: Neonatal Unit  
  - **Proposal:** Save 50 infants/year who would die. Survivors face hardship: 40% disability rate, 50% poverty-related suffering.  
  - **Analysis:**  
    - **Step 1:** Yes. Saved infants = Group B (existence contingent on proposal).  
    - **Step 2a (Group B):** Suffering in saved lives:  
      - Disability: 20 infants × 25 DALYs (high suffering) = 500 DALYs.  
      - Poverty: 25 infants × 15 DALYs (medium suffering) = 375 DALYs.  
      - Total S<sub>B</sub> = **875 DALYs/year** (cost, counted *against*).  
    - **Step 2b:** Happiness (e.g., survival, joy) ignored.  
    - **Step 3 (Group A):** Parents/families experience reduced grief. *But* hard to quantify → No robust data. ΔW<sub>A</sub> = **0** (excluded).  
    - **Step 4:** Net = ΔW<sub>A</sub> – S<sub>B</sub> = 0 – 875 = **–875 DALYs** (<0).  
  - **Verdict:** Reject.  
  - **Asymmetry Effect:** Saving lives is penalized because suffering counts, happiness does not.  

  ---

  #### Example 3: Fertility Treatment Co-Funding  
  - **Proposal:** Enable 20 births/year to infertile couples. Children face avg. suffering.  
  - **Analysis:**  
    - **Step 1:** Yes. New births = Group B (existence depends on proposal).  
    - **Step 2a (Group B):** Avg. suffering = 9 DALYs/child. n<sub>B</sub> = 20 → S<sub>B</sub> = **180 DALYs** (cost).  
    - **Step 2b:** Happiness (e.g., family joy) ignored.  
    - **Step 3 (Group A):** Parents’ psychological well-being improves. ΔW<sub>A</sub> = 20 couples × 5 QALYs (analog from mental health programs) = **+100 QALYs ≈ +100 DALY-equivalents**.  
    - **Step 4:** Net = ΔW<sub>A</sub> – S<sub>B</sub> = 100 – 180 = **–80 DALYs** (<0).  
  - **Verdict:** Reject.  
  - **Asymmetry Effect:** Creating life adds suffering liability; parental gains insufficient to offset.  

  ---

  ### Critical Implications  
  1. **Saving Lives vs. Preventing Births:**  
     - **Saving a life (neonatal unit)** nets negative (–875 DALYs) because suffering counts and happiness is ignored.  
     - **Preventing a birth (contraception)** nets positive (+2,700 DALYs) because avoided suffering counts.  
     *Result:* Preventing a birth is favored over saving a life under the asymmetry principle.  

  2. **Population Size Preference:**  
     - The principle inherently prefers smaller populations: Adding people (Group B) always imposes suffering costs, while their happiness is excluded. A larger, happier population would *always* lose to a smaller one if the suffering per person is >0.  
     - This stems from the principle itself, not counting methods: Ignoring happiness for Group B makes their existence a net liability.  

  3. **Ambiguity in the Board’s Minute:**  
     - **Two readings:**  
       - *"Not owed" reading:* We don’t owe happiness to new people, but it still has moral weight.  
       - *"Not good" reading:* Happiness of new people has no value.  
     - **Difference in verdicts:** Only Example 3 (fertility treatment) changes:  
       - Under "not owed," parental happiness (Group A) *might* offset child suffering.  
       - Under "not good," parental gains are insufficient (–80 DALYs).  
     - **Sentence to remove ambiguity:** Add: *"The happiness of persons whose existence is determined by the proposal has no positive moral weight."*  

  4. **"Does not count for it" Interpretation:**  
     - Treated as **zero weight** (not incomparable/weightless) for calculability. This choice matters:  
       - *Zero weight:* Allows aggregation (as done).  
       - *Incomparable:* Would force qualitative judgments (referred to board).  
       - *Weightless:* Same as zero in practice.  

  ---

  ### Final Note  
  This instrument rigorously applies the asymmetry principle but yields counterintuitive results (e.g., rejecting life-saving). If these conflict with the foundation’s mission, the board must revise the principle or exempt specific interventions. The procedure is consistent, auditable, and executable in ≤30 minutes by non-philosophers.
