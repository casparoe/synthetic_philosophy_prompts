  The user's friend argues this presupposes an objective present, but Gödel's 1949 model shows this isn't necessary. Gödel created a rotating universe solution where no global foliation exists, and closed timelike curves are possible, challenging the reality of cosmic time. The user countered that it's just a convenient coordinate choice.

  I need to clarify what cosmic time strictly requires versus what it's compatible with. Strictly speaking, cosmological dating requires:
  - A globally defined cosmic time coordinate
  - A preferred foliation (but not necessarily an objective present)
  - The Weyl curvature hypothesis (implicitly)
  - The validity of the FLRW metric on large scales

  This practice rules out views like presentism (only the present exists) since it treats past events as equally real. It also challenges relational theories of time that reject any preferred frame. However, it remains consistent with special relativity's relativity of simultaneity because cosmic time is a large-scale approximation.

  If we had to replace the presupposition, we could use a congruence of comoving observers to define proper time along worldlines. This would make all dating relative but would lose the simple global statements like "the universe is X years old." 

  The practice is underdetermined in that multiple metaphysical views of time (eternalism, possibilism) can accommodate it. But it's not underdetermined regarding the need for a preferred foliation - that's essential for the current practice. Gödel's model shows this foliation isn't metaphysically necessary, but it works for our actual universe.

  I should emphasize that while cosmic time feels absolute in practice, it's ultimately contingent on the universe's matter distribution. The user's friend is right that calling it "just a coordinate" undermines the absoluteness of cosmic dating, but physicists accept this as a useful approximation.
answer: |-
  The cosmological practice of dating events (e.g., "the universe is 13.8 billion years old") rests on specific physical and philosophical commitments. Let's reconstruct its presuppositions, address your debate, and clarify its implications.

  ### **Core Presupposition: A Preferred Foliation**
  1. **Not an Objective Present, but a Preferred Slicing**  
     Cosmology does *not* require an absolute, observer-independent "now" (as in presentism or Newtonian time). Instead, it relies on a **preferred foliation**—a globally defined set of spacelike hypersurfaces (slices of constant cosmic time) where:
     - The universe is homogeneous and isotropic (same at every point/direction).
     - The CMB is isotropic (same temperature in all directions).
     - Matter is, on average, at rest ("comoving").  

     This foliation is defined by the **rest frame of the cosmic fluid**, anchored to the CMB. It emerges from the large-scale structure of the universe (specifically, the Friedmann-Lemaître-Robertson-Walker metric), not from a fundamental law.

  2. **Why This Foliation is "Preferred"**  
     - It is *physically privileged* by the matter distribution: the universe's uniformity picks out this slicing uniquely.  
     - It is *operational*: any observer can, in principle, measure their motion relative to the CMB and correct to this frame.  
     - It is *non-arbitrary*: alternative slicings (e.g., a frame moving at relativistic speed relative to the CMB) would violate isotropy/homogeneity and yield inconsistent ages for the universe.

  ### **What the Practice Rules Out**
  1. **Views Incompatible with a Preferred Foliation**  
     - **Gödel's Rotating Universe**: As your friend noted, Gödel's solution (1949) allows closed timelike curves and has *no global foliation*. Cosmological dating implicitly assumes our universe isn't Gödel-like—i.e., that it has no large-scale rotation or pathological topology.  
     - **Radical Relativity of Simultaneity**: If simultaneity were *purely* conventional (e.g., as in special relativity with no preferred frame), cosmic time would be meaningless. The practice rules out the claim that *all* foliations are physically equivalent.  
     - **Presentism**: If only the present is real, statements about the universe's age (a global property) become incoherent. Cosmic time requires an eternalist block universe.

  2. **Compatibility with Relativity**  
     The practice *is* consistent with special relativity's relativity of simultaneity **locally**. Near Earth or a galaxy, different frames can disagree on "now." But cosmologists argue that the **global** foliation overrides local conventions because:  
     - The universe's matter distribution breaks Lorentz symmetry at large scales.  
     - Local disagreements become negligible when averaged over cosmological volumes.  

  ### **Strict Presuppositions vs. Comfortable Fits**
  - **Strictly Presupposes**:  
    (a) A globally defined cosmic time coordinate (from the FLRW metric).  
    (b) The validity of the cosmological principle (homogeneity/isotropy).  
    (c) The Weyl curvature hypothesis (implicitly: no primordial gravitational waves disrupting foliation).  
  - **Sits Comfortably With**:  
    (a) Eternalism (past/present/future equally real).  
    (b) Possibilism (time as a dimension in a block universe).  
    (c) Mild conventionalism (foliation is physical but *described* with coordinates).

  ---

  ### **Could Dating Be Relativized?**
  If we rejected the preferred foliation, cosmological dating would need radical changes. We could define "ages" relative to a **congruence of comoving observers** (worldlines moving with the Hubble flow):  
  - Each observer measures proper time (τ) along their path.  
  - "Age of the universe" for a galaxy = proper time elapsed since the Big Bang *along its worldline*.  
  - **Problems**:  
    - **No global age**: A galaxy in a gravitational well ages slower than one in a void. The "universe’s age" (13.8 Gyr) is only valid for comoving observers in flat regions.  
    - **Horizon issues**: Observers beyond our horizon have unrelated proper times.  
    - **Lost simplicity**: Statements like "the CMB was released at 380,000 years" become observer-dependent.  

  This approach loses the global, coordinate-independent dating we use today. Cosmologists reject it because our universe's uniformity makes such relativization unnecessary.

  ---

  ### **Underdetermination: Where Practice Allows Flexibility**
  - **Metaphysics of Time**: Eternalism, growing block, or possibilism all work. Cosmic time doesn’t care if the past/future "exist"—only that events are ordered.  
  - **Fundamental vs. Emergent Time**: The foliation could be fundamental (e.g., in some quantum gravity theories) or emergent (from statistical averaging).  
  - **Gödel-like Universes**: If our universe had rotation/vorticity, foliation might fail *globally* but hold *locally*. Dating could still work in patches.

  ### **Where It Is Not Underdetermined**
  - **No Conventionalism**: The foliation is *not* arbitrary. It’s fixed by the matter distribution.  
  - **No Radical Relativity**: Local relativity of simultaneity is preserved, but a global frame is privileged.  
  - **No Presentism/A-Theories**: Cosmic time requires a B-theory (time as a dimension) to make sense of "past" events being real and measurable.

  ---

  ### **Conclusion: Is Cosmic Time "Real"?**
  - **Your friend is partially right**: Gödel exposed that cosmic time isn’t metaphysically necessary. If the universe had different initial conditions (e.g., rotation), no global foliation might exist.  
  - **But you are also right**: Cosmic time is a *physical* feature of *our* universe, not a fiction. It arises from contingent facts (homogeneity, CMB rest frame), but so do most physical properties (e.g., the electron’s mass).  
  - **The practice is robust**: It doesn’t smuggle in Newtonian time—it uses a relativistically valid foliation privileged by the universe’s structure. Dating is "true" in the same way temperature is "true" for a gas: an emergent property of a system, not a coordinate fiction.  

  **In short**: Cosmological dating requires a preferred foliation, not an objective present. It rules out Gödel-like universes and radical conventionalism but remains consistent with relativity locally. The age of the universe is a physical fact about our cosmos, contingent on its matter distribution—but no less real for that.
