prompt: |-
  Public health systems in many countries decide what to fund by ranking treatments according to their cost per quality-adjusted life-year: each health state is assigned a score between 0 and 1, years lived in that state are multiplied by the score, and the resulting totals are added across patients so that treatments can be compared by how much health they buy per dollar. The same systems insist, in their public statements, that every life is of equal worth. I want to know what this practice presupposes about comparing well-being across persons. Reconstruct the implicit view: whether it requires cardinal and interpersonally comparable utility, whether it treats health as a good distinct from preference satisfaction, and what rule for combining different people's scores it assumes. Separate what the practice strictly presupposes from what it merely fits comfortably with, and say which rival accounts of interpersonal comparison — pure ordinalism, the view that only health itself matters rather than any broader welfare, or a prioritarian weighting that gives extra weight to the worst off — it rules out and which it remains compatible with. Then take the apparent tension head-on: does scoring a year of disabled life below a year of healthy life commit the practice to treating disabled lives as worth less, or can the claim of equal worth be preserved without changing how the scores are built? Finally, tell me what would have to change in practice if we adopted a view on which these comparisons are literally meaningless.
reasoning: |-
  Hmm, this user presents a sophisticated critique of QALY-based health prioritization systems. They're clearly well-versed in both health economics and moral philosophy, asking about the implicit assumptions regarding interpersonal utility comparisons. The core tension they identify—between QALY calculations and the principle that all lives are equally valuable—is genuinely thorny.

  Breaking this down methodically: First, the practice strictly presupposes cardinal and interpersonally comparable health utility. That's non-negotiable because you can't sum QALYs across people otherwise. But interestingly, it's agnostic about whether health utility reflects broader welfare—health could be seen as either a distinct good or a component of preference satisfaction. The equal-weight aggregation rule is also fundamental; any prioritarian weighting would break standard QALY models.

  Now the tricky part: When we assign lower weights to disabled life years, does that devalue disabled lives? Technically no—the system evaluates health states, not personal worth. But this distinction collapses in practice when resource allocation decisions systematically disadvantage people with chronic conditions. The "equal worth" claim survives only as a symbolic commitment unless we decouple valuation of health states from valuation of persons.

  If we adopted radical ordinalism where interpersonal comparisons are meaningless, the entire QALY framework would implode. We'd need completely different prioritization methods—maybe random selection or cost-effectiveness measures that don't require summing benefits across individuals. Though that seems politically untenable given how entrenched QALYs are.

  The user's phrasing suggests they suspect the "equal worth" rhetoric is performative. They're right to question it—the tension isn't resolvable through technical adjustments alone. At minimum, transparency about value judgments in disability weights is needed, but deeper reforms might require abandoning QALYs altogether for allocation decisions affecting disadvantaged groups.
answer: |-
  Here's a systematic reconstruction of the presuppositions and implications of QALY-based prioritization, addressing each element of your query:

  ### I. Core Presuppositions About Interpersonal Comparisons
  1.  **Cardinal and Interpersonally Comparable Utility Required:**
      *   **Strict Presupposition:** The practice *absolutely requires* both **cardinal measurability** (health states can be assigned numerical values representing intensity of preference/well-being loss) and **interpersonal comparability** (a 0.5 score for blindness means the *same magnitude* of health deficit for person A as for person B).
      *   **Why?** Adding QALYs across individuals only makes sense if a QALY gained by one person is treated as equivalent to a QALY gained by another. This necessitates comparing the *size* of welfare changes across different people.

  2.  **Health as a Specific Good (Distinct Domain):**
      *   **Strict Presupposition:** The practice presupposes **health-related quality of life (HRQoL)** is a distinct domain of well-being that can be meaningfully measured and valued *separately* from overall welfare or preference satisfaction.
      *   **Implied but Not Strict:** It is *compatible* with viewing health as a primary component of overall welfare or as instrumental to preference satisfaction. However, the practice *treats* health as the relevant good for resource allocation decisions within the healthcare system, distinct from other welfare components (like income, leisure, relationships).

  3.  **Aggregation Rule: Simple Summation with Equal Weight:**
      *   **Strict Presupposition:** The practice assumes **Simple Utilitarian Aggregation**: Total societal health benefit is the *sum* of individual QALYs gained. Crucially, it presumes **equal marginal moral weight**: One QALY gained by *any* individual contributes equally to the total societal benefit, regardless of who they are (their baseline health, wealth, age, social status, etc.). This is the core implication of "every life is of equal worth" *within the system's calculation*.

  ### II. Compatibility with Rival Accounts
  *   **Ruled Out (Incompatible):**
      *   **Pure Ordinalism:** Utterly incompatible. QALYs require cardinal measurement and interpersonal comparability. Pure ordinalism denies both.
      *   **Strict Prioritarianism:** Incompatible with the *equal weighting*. Prioritarianism (giving extra weight to benefits for the worse off) would require weighting QALY gains differently based on baseline health status or other disadvantage metrics. Standard QALY summation assigns equal weight.
      *   **Sufficientarianism:** Incompatible if the sufficiency threshold isn't met by QALY gains alone. Focusing resources solely on bringing everyone to a health "sufficiency" level contradicts maximizing total QALYs regardless of distribution (beyond the equal weight).
      *   **Radical Subjectivism/Non-Comparability:** Incompatible. Assumes interpersonal comparisons of well-being (specifically health-state valuations) *are* meaningful.

  *   **Compatible (or Partly Compatible):**
      *   **Health as Primary Good (Rawlsian-inspired):** Compatible. Views health as a fundamental good necessary for pursuing life plans. QALYs measure this specific good.
      *   **Preference-Satisfaction Accounts (if focused on health preferences):** Compatible *if* the QALY weights are derived from preferences (e.g., via standard gamble or time trade-off methods) and are seen as reflecting individuals' valuations of health states relative to each other. The practice is agnostic on whether these preferences reflect broader welfare or just health-specific value.
      *   **Equivalence Scales (Health-Specific):** Compatible. QALYs *are* a type of equivalence scale, converting life-years into "full-health equivalent" years. The practice presupposes this conversion is valid and comparable.
      *   **Modest Prioritarianism/Sufficientarianism:** *Partially compatible* only if implemented *outside* the core QALY calculation. E.g., weighting QALY gains for certain disadvantaged groups higher *after* calculation, or setting a minimum health threshold as a constraint *before* maximizing QALYs. The core summation rule itself remains strictly utilitarian.

  ### III. Resolving the Tension: Equal Worth vs. Lower Health-State Scores
  *   **The Tension:** Assigning a score <1.0 to life-years with disability *appears* to value those years (and thus the people living them) as "less than" a year of healthy life, contradicting "equal worth."
  *   **The Defense (Preserving Equal Worth):**
      1.  **Valuing Health States, Not Persons:** The system claims to value *health outcomes*, not the intrinsic worth of individuals. A lower score reflects the *health deficit* associated with a disability, not the diminished value of the person experiencing it. "Equal worth" pertains to moral status and the right to have one's health needs considered equally.
      2.  **Opportunity Focus:** A score <1.0 reflects the limitation in *opportunities* or *functionings* (e.g., mobility, pain) compared to full health, not the worth of the life itself. The goal is to restore opportunity, not judge life value.
      3.  **Consistency:** If a treatment temporarily causes a disability (e.g., chemotherapy side effects), those years would *also* score <1.0. This demonstrates the focus is on the *health state*, not the person's identity or inherent worth.
  *   **Why the Defense is Problematic (Tension Persists):**
      1.  **Resource Allocation Consequence:** In a budget-constrained system valuing *only* QALYs, less funding will go to interventions primarily benefiting people with permanent disabilities (as each QALY gain might be more expensive or smaller per person). This *effectively* treats their health gains as less worthy of investment.
      2.  **Experience vs. Valuation:** Disability advocates argue that self-reported life satisfaction of people with disabilities is often high, while QALY weights derived from the general public (or even patients) often reflect stigma or ignorance, undervaluing life with disability.
      3.  **Symbolic Harm:** Assigning a numerical value <1.0 to life-years lived with a disability, especially when used to deny care, is experientially and symbolically harmful, feeling like a declaration of lesser value *despite* the official rhetoric.

  **Conclusion on Tension:** The practice *can* formally maintain that "every life is of equal worth" by restricting "worth" to abstract moral standing while assigning lower value to *health states* associated with disability. However, **in practical resource allocation, it systematically disadvantages interventions for people with disabilities, creating a significant and arguably irreconcilable tension with the lived reality and societal commitment to equality.**

  ### IV. Impact of Adopting Non-Comparability
  If we adopted the view that interpersonal comparisons of well-being (including health-state valuations) are literally meaningless (radical ordinalism/non-comparability), **the QALY framework would collapse as a tool for *allocating resources across different patients*.**

  *   **Necessary Changes in Practice:**
      1.  **Abandon Cross-Patient QALY Summation:** Could not add QALYs across individuals to get a "total health benefit."
      2.  **Alternative Allocation Rules:** Would need fundamentally different prioritization principles:
          *   **Within-Patient Only:** Compare cost-effectiveness of treatments *for the same patient* (e.g., Treatment A gives patient X 5 more QALYs than Treatment B). Allocation *between patients* would require other rules.
          *   **Non-Comparative Principles:** E.g., Random selection (lottery), "Rule of Rescue" (prioritize immediate life-threatening cases), First-come-first-served, Equal per capita funding (regardless of potential benefit).
          *   **Non-Welfarist Criteria:** Prioritize based solely on clinical need (severity) or life-expectancy gain (ignoring quality), or on non-health criteria (social value, responsibility).
          *   **Localized Comparisons:** Perhaps allow comparisons only within small, "similar" groups, but defining similarity and scaling up is problematic.
      3.  **Loss of "Efficiency" Metric:** The primary justification for QALYs (maximizing total health benefit from limited resources) vanishes. Decisions become based on other ethical principles or procedural fairness without a single maximizing metric.
      4.  **Radical Shift:** Public health systems would lose their primary tool for systematic prioritization. Decision-making would likely become more arbitrary, inconsistent, or driven by political pressure/vocal minorities rather than an (ostensibly) objective measure of aggregate benefit.

  In essence, embracing non-comparability would necessitate abandoning the core utilitarian logic underpinning most modern health technology assessment and resource allocation systems, forcing a complete rethink of how to make fair and efficient decisions under scarcity. The tension between maximizing aggregate health and valuing lives equally would persist but manifest in different, arguably less quantifiable, ways.
