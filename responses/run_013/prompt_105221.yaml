answer: |-
  Below is a systematically constructed framework for assessing theories of state restriction of speech, grounded in Mill's harm principle but refined through critical desiderata and tested against your cases. The approach prioritizes *phenomena to be explained* and *functional requirements* over doctrinal loyalty.

  ---

  ### **I. Foundational Considerations**  
  *(What any theory must grapple with)*  
  1. **Value of Expression**:  
     - Individual: Autonomy, self-realization, dignity.  
     - Collective: Democratic legitimation, truth-discovery (Mill's "marketplace"), cultural innovation, social coordination.  
     - *Tension*: When expression undermines the very conditions for these values (e.g., democracy-destroying propaganda).  

  2. **Harms from Speech**:  
     - **Direct/causal**: Physical harm (incitement), financial loss (fraud), reputational damage (defamation).  
     - **Constitutive**: Speech *as* harm (e.g., discriminatory exclusion enacted by a vote).  
     - **Structural**: Degradation of public goods (e.g., trust in institutions, epistemic commons).  
     - **Aggregative**: Small acts combining into large harms (focal-point broadcast).  
     - **Temporal**: Harms realized only after unforeseen events (retroactive harm).  

  3. **Legal Mechanisms**:  
     - Content-based vs. content-neutral rules.  
     - Prior restraint vs. post-hoc punishment.  
     - Specificity (targeted vs. overbroad laws).  

  ---

  ### **II. Desiderata for a Legitimate Restriction Theory**  
  *(Requirements motivated by cases/realities; **bold** = non-negotiable)*  

  | Desideratum                          | Motivating Case/Consideration                                                                 | Non-Negotiable? |  
  |--------------------------------------|------------------------------------------------------------------------------------------------|-----------------|  
  | **1. Harm-Specificity**              | Must distinguish *speech causing harm* from *mere offense* (e.g., blasphemy vs. true threat). | **Yes**         |  
  | **2. Causality Threshold**           | Prevents punishing speech with tenuous links to harm (e.g., "video games cause violence").     | **Yes**         |  
  | **3. Non-Viewpoint Discrimination**  | State may not suppress ideas because it dislikes them (core to liberal democracy).             | **Yes**         |  
  | **4. Temporal Constraint**           | *Retroactive harm*: Punishing past speech for unforeseeable future harms is unjust.            | **Yes**         |  
  | **5. Aggregation Principle**         | *Focal-point broadcast*: Must address distributed micro-acts aggregating into macro-harm.     | **Yes**         |  
  | **6. Constitutive-Harm Recognition** | *Constitutive harm*: Some speech *is* the harm (e.g., conspiracy agreement, "I exclude you"). | **Yes** (but scope contested) |  
  | 7. Epistemic-Commons Protection      | *Epistemic-commons case*: Speech eroding shared resources (e.g., election integrity) must be restrictable. | Preference (collectivist) |  
  | 8. Audience-Differentiation Capacity | *Asymmetric-uptake*: Must account for context where same speech harms one group but not another. | **Yes** (implementation contested) |  
  | 9. Avoid Chilling Protected Speech   | Overbroad rules deter valuable expression (e.g., vague "hate speech" bans).                   | **Yes**         |  
  | 10. Scalability to New Technologies  | Rules designed for print media fail for algorithmic amplification (e.g., viral disinformation). | Preference (pragmatist) |  

  ---

  ### **III. Tensions and Incompatibilities**  
  **Conflict between 5 (Aggregation) and 4 (Temporal Constraint)**:  
  - *Focal-point broadcast* requires restricting speech *because* it might enable future aggregated harm.  
  - *Retroactive harm* forbids liability for unforeseeable downstream effects.  
  - **Tension**: How to regulate *potential* systemic harms without punishing based on speculation?  
    - *Resolution?* Requires clear standards for *foreseeable aggregation* (e.g., speech designed as coordination tool).  

  **Conflict between 6 (Constitutive Harm) and 3 (Non-Viewpoint Discrimination)**:  
  - Constitutive harms (e.g., "Blacks not served here") often embed discriminatory viewpoints.  
  - Banning them *feels* like viewpoint discrimination but targets *harmful acts*, not ideas.  
  - **Tension**: When does regulating constitutive speech slide into policing thought?  
    - *Resolution?* Restrict only to speech that *performs* immediate, material harm (e.g., exclusionary policy enactment).  

  ---

  ### **IV. Most Exclusionary Requirement**  
  **5. Aggregation Principle** excludes most popular theories:  
  - **Why**: Classical liberalism (e.g., Mill, modern "absolutists") focuses on *direct, proximate* harm. It fails the *focal-point broadcast* test, where a harmless post (e.g., "Protest at Capitol Jan 6, 2 PM") coordinates diffuse actors into insurrection.  
  - **Theories it challenges**:  
    - **Clear and Present Danger**: "Imminent" harm requirement ignores slow-burn aggregation.  
    - **Brandenburg's Incitement Test**: Requires intent and likelihood of *immediate* lawless action. Misses passive coordination points.  
    - **Marketplace of Ideas**: Assumes aggregated harms are "self-correcting" — demonstrably false for viral disinformation.  
  - **Result**: Only theories embracing *systemic risk* (e.g., democratic integrity, public goods) can satisfy this — but they risk overbreadth.  

  ---

  ### **V. Explicit Case Handling**  
  1. **Focal-Point Broadcast** (e.g., anonymous coordination signal):  
     - *Requires*: Aggregation Principle (5) + Audience-Differentiation (8).  
     - *Solution*: Restrict if speech is *designed for and reasonably likely* to enable aggregated harm.  

  2. **Retroactive Harm** (e.g., leaking true data later weaponized):  
     - *Requires*: Temporal Constraint (4).  
     - *Solution*: No liability — harm was unforeseeable at speaking time.  

  3. **Constitutive Harm** (e.g., "We vote to expel Group X"):  
     - *Requires*: Constitutive-Harm Recognition (6).  
     - *Solution*: Restrict if speech itself enacts material exclusion/discrimination.  

  4. **Epistemic-Commons Case** (e.g., flooding public records with AI-generated fraud):  
     - *Requires*: Epistemic-Commons Protection (7).  
     - *Solution*: Restrict if speech demonstrably degrades vital shared resource (e.g., land titles database).  

  5. **Asymmetric Uptake** (e.g., medical advice harmless to laypeople but lethal to immunocompromised):  
     - *Requires*: Audience-Differentiation (8) + Causality Threshold (2).  
     - *Solution*: Restrict only if speaker *knows or should know* the vulnerable audience is present.  

  ---

  ### **VI. Scoring Existing Theories (Briefly)**  
  - **Mill's Harm Principle**: Fails *focal-point* (no aggregation), *epistemic-commons* (only individual harms).  
  - **Brandenburg Incitement**: Fails *focal-point* (no "imminent" harm), *constitutive harm* (e.g., exclusionary pact).  
  - **Democratic Integrity Theories** (e.g., Meiklejohn): Handle *focal-point* and *epistemic-commons* but risk overregulating "low-value" speech.  
  - **Equality-Based Theories** (e.g., MacKinnon): Excel at *constitutive harm* (e.g., hate speech as subordination) but clash with *non-viewpoint discrimination* (3).  

  ---

  **Conclusion**: A viable theory must reconcile **non-negotiable requirements** (1–6, 8–9) while navigating tensions between aggregation and temporal constraints, and constitutive harms and viewpoint neutrality. The *focal-point broadcast* is the sharpest test, demanding a shift from purely individualist harm models toward systemic effects — without sacrificing liberal safeguards against state overreach.
