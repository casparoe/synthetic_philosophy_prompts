  ### Key Design Notes:
  1. **Metaphysical/Normative Split First (n1)**: Prevents conflating "self as socially built" with "self as duty-bound."  
  2. **Owner/Trustee Distinction (n3)**: Your framing replaces autonomy debates with a starker choice about life's purpose.  
  3. **Community Level (n6)**: Separates family/local ethics (Confucian L3) from state collectivism (L5).  
  4. **Unoccupied Position (L7)**: "Independent Trustee" is incoherent—you can’t be an isolated self *and* owe irreducible duties to a community.  
  5. **Inseparable Pair (L3/L5)**: Tree splits them via community level (n6), but case (family vs. state loyalty) clarifies.  
  6. **Concrete Cases**: Anchored to nodes/leaves (e.g., hospital case at n5 for role hierarchy).  

  **Why It Works**: The tree forces clarity by isolating:  
  - **Social constitution** (n2) from **rights/obligations** (n3/n7),  
  - **Local ties** (n6: family) from **state authority** (n6: state),  
  - **Communal interests** (n4) from **individual arbitration** (n7).  

  Run your group’s recurring debates through the cases—it exposes where "individualism" vs. "collectivism" masks actual disagreements.
