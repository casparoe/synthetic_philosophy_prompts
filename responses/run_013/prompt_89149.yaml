prompt: |-
  My sister's getting married next month and I've been volun-told to give the toast. Here's my problem: both she and her fiancé did their PhDs in philosophy. He's a card-carrying counterpart theorist — Lewis all the way, no transworld identity, you're never strictly identical to anyone in another world, you just have a similar-enough counterpart there — and she's a Kripkean who thinks that's a load of nonsense and that a person is rigidly themselves in every world where they exist at all. The toast I want to give turns on the line every wedding toast turns on, 'in every possible world I'd have chosen you,' and I want it to actually be true on their own views, not just a nice-sounding thing, because half the room will be their philosopher friends who'll notice if I fudge it and the other half will be our parents and aunts who just want to cry a little. He keeps insisting there's a special counterpart relation for love that always lands on her no matter the world, which I'm 90% sure is just rigid designation smuggled back in through the side door. Can you write me a five-minute toast that pulls this off — funny for the philosophers, tear-jerking for everyone else, and not saying anything either of them would call false?
