  - Use jargon like "haecceities" and "counterpart relations" with comedic exaggeration  
  - Contrast their views through wedding metaphors (e.g., "bride-shaped necessity" vs. "groom-shaped similarity")  
  For the non-philosophers:  
  - Anchor everything in universal emotions (choice, love, seeing someone's essence)  
  - Keep the philosophy explanations breezy with concrete imagery ("worlds where you became a llama farmer")  
  - End on simple, heartfelt sincerity so the tears feel earned  

  The solution path:  
  1. For the sister (Kripkean): Frame "choosing you" as recognizing her essential properties—the "bride-ness" that couldn't be anyone else.  
  2. For the fiancé (Lewisian): Argue that in any world where he has a counterpart close enough to be "him," that counterpart's love-relation would uniquely pick her counterpart. (And mock the circularity of this gently.)  
  3. The emotional core: What both *actually* share is the belief that their connection isn't contingent—it's necessary in *some* meaningful sense. That's the universal truth.  

  Biggest risks:  
  - Philosophers might nitpick if I oversimplify counterpart theory. Need to specify "relevant similarity" includes love-as-essential.  
  - Must avoid saying "identical across worlds" for the fiancé—use "counterpart" rigorously.  
