  We are going to design a decision procedure for bet sizing that is practical and can be run with a spreadsheet and basic arithmetic. The procedure will account for:
   - Repeatability of the bet (one-off vs. repeatable)
   - Confidence in edge estimation
   - Impact of loss on life (risk of ruin or significant lifestyle change)
