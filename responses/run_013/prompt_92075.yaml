  Below is a practical decision procedure for bet sizing, designed to handle real-world constraints and runnable in a spreadsheet with basic arithmetic. It prioritizes clarity, risk management, and honesty about uncertainty. The procedure is structured as a step-by-step checklist with explicit exit points and value judgments.

  ---

  ### **Decision Procedure for Bet Sizing**
  **Inputs Needed**: Bankroll size (managed pile), total wealth, loss tolerance (as % of total wealth), and bet-specific parameters.  
  **Tools**: Spreadsheet (e.g., Excel/Google Sheets) for calculations.  
  **Output**: Fraction of bankroll to bet (or decision to pass).

  #### **Step 1: Classify the Bet**
  - **Question**: Is this bet **repeatable** (e.g., sports bets, market trades) or **one-off** (e.g., startup investment)?  
  - **Good Enough Answer**:  
    - *Repeatable*: Same bet structure recurs frequently (e.g., weekly games).  
    - *One-off*: Unique opportunity with no identical repeats.  
  - **Exit Point**: If one-off *and* the bet would require >50% of bankroll (by any sane estimate), **STOP**—too risky for a single bet.

  #### **Step 2: Estimate Edge and Payoff**
  - **Question**: What is your **probability of success (p)** and **net profit multiple (b)**?  
    - `b` = (Profit if win) / (Stake). Example: Bet $100 to win $150 → profit = $50 → `b = 0.5`.  
  - **Good Enough Answer**:  
    - For `p`: Use historical data (e.g., model backtests) or conservative triangulation (worst/mid/best cases).  
    - For `b`: Fixed terms (e.g., sports odds) = high confidence; variable (e.g., startup exit) = low confidence.  
  - **Value Judgment**: If `p` or `b` relies on untested assumptions (e.g., "my gut says 60%"), **FLAG** for partner sign-off.

  #### **Step 3: Confidence Adjustment**
  - **Question**: How **confident** are you in `p` and `b`?  
  - **Scoring**:  
    | Confidence Level | Multiplier (cf) |
    |------------------|-----------------|
    | High (e.g., backtested data, fixed terms) | 1.0 |
    | Medium (e.g., partial data, reasonable estimates) | 0.7 |
    | Low (e.g., guesswork, volatile outcomes) | 0.5 |  
  - **Process**:  
    - Compute base Kelly fraction: `f_base = p - (1 - p)/b`.  
    - Apply confidence multiplier: `f_adj = f_base * cf_p * cf_b`.  
  - **Exit Point**: If `f_base ≤ 0` (no mathematical edge), **STOP**—do not bet.

  #### **Step 4: Loss Tolerance Check**
  - **Question**: What is the **maximum loss** (as % of total wealth) you can absorb without life-changing impact?  
  - **Good Enough Answer**:  
    - Define `max_loss_%` (e.g., 1% for low risk, 5% for high conviction).  
    - Calculate maximum allowable fraction:  
      `f_max = (max_loss_% × Total Wealth) / (Loss Exposure × Bankroll)`  
      - **Loss Exposure**:  
        - Binary bets (win/lose all): **1.0**.  
        - Partial losses (e.g., stocks): **worst-case loss %** (e.g., 20% → 0.2).  
  - **Value Judgment**: If loss would cause bankruptcy, relationship strain, or insomnia, **lower `max_loss_%`**.

  #### **Step 5: Correlation & Portfolio Effects**
  - **Question**: Are there **correlated bets** (e.g., multiple trades exposed to same market event)?  
  - **Process**:  
    - If uncorrelated: Use `f_adj` from Step 3.  
    - If correlated: Reduce each bet fraction by **correlation factor (k)**:  
      - `k = 1 / (1 + number of correlated bets)` (e.g., 3 correlated bets → k = 0.25).  
      - `f_corr = f_adj × k`.  
  - **Exit Point**: If total exposure of correlated bets > `max_loss_%`, **STOP**—reject or reduce bets.

  #### **Step 6: Final Decision**
  - **Final Fraction**: `f_final = min(f_adj, f_max, f_corr)`  
  - **Minimum Threshold**: If `f_final < 0.005` (0.5% of bankroll), **PASS**—too small to matter or too risky.  
  - **Output**: Bet `f_final × Bankroll` dollars.

  ---

  ### **Case Studies**
  **Assumptions**:  
  - Bankroll = $100,000 (total wealth = $100,000).  
  - Loss tolerance: 1% of total wealth ($1,000) for life-changing bets; 5% ($5,000) for others.  
  - All calculations in spreadsheet: [Download Example](https://docs.google.com/spreadsheets/d/1xExampleLink) (mock link).

  #### **Case (a): Sports Bet (Repeatable, High Confidence)**
  - **Setup**: Model predicts 55% win chance; sportsbook offers even odds (`b = 1.0`). Backtested on 500 games.  
  - **Steps**:  
    1. Repeatable → Proceed.  
    2. `p = 0.55`, `b = 1.0` → `f_base = 0.55 - (1-0.55)/1 = 0.10`.  
    3. Confidence: High (`cf_p = 1.0`, `cf_b = 1.0`) → `f_adj = 0.10`.  
    4. Not life-changing → `max_loss_% = 5%` → `f_max = (5% × $100k) / (1.0 × $100k) = 0.05`.  
    5. No correlations → `f_final = min(0.10, 0.05) = 0.05`.  
  - **Result**: Bet **5% of bankroll ($5,000)**.

  #### **Case (b): Friend's Startup (One-Off, Low Confidence)**
  - **Setup**: 20% success chance; 3x return if successful (`b = 2.0`). One-off, loss would hurt.  
  - **Steps**:  
    1. One-off → Proceed (not >50% of bankroll).  
    2. `p = 0.20`, `b = 2.0` → `f_base = 0.20 - (1-0.20)/2 = -0.20` → **Negative edge! STOP**.  
  - **Rethink**: If you believe `p = 30%`:  
    - `f_base = 0.30 - 0.70/2 = -0.05` → Still negative. **Pass**.  
    - *Only if `p > 33%`* (e.g., `p=0.40` → `f_base=0.10`):  
      - Confidence: Low (`cf_p=0.5`, `cf_b=0.7`) → `f_adj=0.10×0.5×0.7=0.035`.  
      - Life-changing → `max_loss_%=1%` → `f_max=(1%×$100k)/(1.0×$100k)=0.01`.  
      - `f_final=min(0.035,0.01)=0.01`.  
  - **Result**: Bet **1% ($1,000)** only if edge is credible. Otherwise, **pass**.

  #### **Case (c): Mispriced Market (Repeatable, Low Confidence)**
  - **Setup**: Believe a stock has 10% upside or 5% downside (`b=0.1/0.05=2.0`), but edge estimated from same data.  
  - **Steps**:  
    1. Repeatable → Proceed.  
    2. Approximate as binary: `p` for upside? If `p=60%`, `b=2.0` → `f_base=0.60 - 0.40/2=0.40`.  
    3. Confidence: Low (`cf_p=0.5`, `cf_b=0.7`) → `f_adj=0.40×0.5×0.7=0.14`.  
    4. Not life-changing → `max_loss_%=5%` → `f_max=0.05 / 1.0 = 0.05` (binary loss).  
    5. If correlated to other bets: e.g., 2 correlated positions → `k=1/(1+2)=0.33` → `f_corr=0.14×0.33≈0.046`.  
  - **Result**: Bet **min(0.14, 0.05, 0.046) = 4.6% ($4,600)**.

  ---

  ### **What the Procedure Can't Do**
  1. **Non-Binary Bets**: Continuous outcomes (e.g., stock returns) are approximated crudely. Use with caution.  
  2. **Tail Risks**: Black swans (e.g., market crashes) are not modeled—rely on `max_loss_%` as a backstop.  
  3. **Interdependent Opportunities**: Sequential bets (e.g., venture capital rounds) require dynamic updating.  
  4. **Utility Functions**: If you're risk-seeking or risk-averse beyond loss tolerance, override the output.  
  5. **Overfitting**: If your edge comes from data mining (Case c), the procedure warns but can't fully rescue you.

  ### **Where It Misfires**
  - **Overly Conservative**: In high-conviction repeatable bets (e.g., Case a), it may underbet due to loss tolerance.  
  - **False Precision**: Confidence multipliers are arbitrary—use partners to sanity-check.  
  - **Correlation Blind Spots**: If correlations are hidden (e.g., all bets fail in a recession), it underestimates risk.  
  - **One-Off Bets**: Kelly is designed for repetition; one-offs lean on loss tolerance as a proxy.

  ---

  **Final Advice**: Use this to force rigor, not as a replacement for judgment. If the output feels wrong (e.g., betting $1,000 on a startup), it’s a feature—not a bug. When in doubt, partners and loss tolerance are your best filters.
