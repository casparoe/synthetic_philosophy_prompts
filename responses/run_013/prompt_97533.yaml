prompt: |-
  OK so I'm a backend dev, no philosophy background, and I've been going down a rabbit hole on the Rwanda stuff in 1994. The part that hooks me isn't the killing itself — obviously that's the horror — it's the wierd fight over the word. Everyone could see what was happening and yet the US and the UN spent weeks doing this dance where they'd only say acts of genocide rather than just genocide, like the difference actually mattered. I want to use that episode as a test case for genocide as a category, starting from Lemkin, the guy who coined the word. My understanding is his original idea was way broader than what made it into the 1948 Convention — he cared about destroying a group's culture, its language, its economy, its institutions, not just physically killing people, and the Convention ended up much narrower.

  So first direction: map the episode onto the concept. Who counts as a group under Lemkin's picture versus the legal one, and does the fact that the Tutsi were the target (along with moderate Hutus) fit cleanly? The Convention talks about intent to destroy a group in whole or in part — what is in part actually doing there, is there a threshold, and does Rwanda clear it? Whose intent counts, and more to the point, who gets to make the call that it's been met? Where does Lemkin's theory just not have an answer here?

  Second direction, and honestly the part I actually care about: what does this episode show about the category itself? My hunch, and I might be way off, is that genocide works less like a description and more like a trigger — kind of like tagging a bug P0 in Jira, where the label itself is what summons the response, so there's a huge incentive to fight about the label instead of the underlying thing. If that's right, does that mean the legal and moral category is doing its job, or that it's been captured by politics? And if Lemkin's broader version (culture, language, economy) had survived into the Convention, would the Rwanda fight have gone differently, or would people just have found another word to argue about?

  Last thing: is there any version of this category that doesn't turn naming into a political football, or is that just baked into a concept like this? Don't just tell me it's complicated — tell me where the theory is silent and where it actually gets the case wrong.
