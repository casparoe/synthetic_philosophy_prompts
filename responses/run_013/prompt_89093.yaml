  I'm a third-year philosophy student in a metaphysics seminar on modality, and we've spent the last few weeks on David Lewis's modal realism — the view that possible worlds are concrete entities of the same basic kind as the world we inhabit, and that actuality is not a special property but an indexical, on all fours with here, now, and the present. Our tutor keeps reaching for a picture to make the whole thing less alien: other possible worlds, he says, are like other places — foreign countries or distant planets — and calling a world actual is like calling a place here. It just tags the world you happen to be in, exactly as here tags the place you happen to occupy. On this picture the famous incredulous stare is simply confused: there is nothing metaphysically privileged about our world, any more than there is anything privileged about our location. I'm writing a response paper on whether the picture earns its keep, and I keep going back and forth.

