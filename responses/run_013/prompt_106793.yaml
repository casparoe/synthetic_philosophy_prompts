prompt: |-
  Ok so I'm a grad student and I'm trying to reverse-engineer my supervisor's rule for when a "why X and not Y" history question counts as well-posed, because she keeps green-lighting or quietly killing our dissertation topics on that basis and I honestly can't tell what she's tracking. Her rulings so far, as best I can reconstruct them:

  - "why did Britain industrialise and not China?" — well-posed, she'll supervise it, says it's the classic contrastive question done right.
  - "why did Japan industrialise after the Meiji restoration and the Ottoman empire not?" — also well-posed, no complaints.
  - "why didn't the Aztecs industrialise — was it because they had no coal?" — not well-posed. She got a bit annoyed and said it's asking her to explain a non-event, that it wasn't a live option in the first place, and that pinning it on one missing input is bad history anyway.
  - "why did the Dutch Republic not industrialise first, given it was the richest place in Europe?" — well-posed, she liked it.

  That's the track record I'm confident about. Now next week a student is pitching "why did China fail to industrialise before Europe, given how far ahead it was around the 11th century?" and I have to guess whether she'll wave it through. The annoying thing is the content looks almost identical to the Britain/China one she already approved — same two countries, basically — but the way it's phrased has the same flavour as the Aztec one she shot down. So I really don't know which way she'll go.

  What I want from you: (1) name the candidate rules that all four of her verdicts are jointly consistent with — I keep landing on one and then finding another that fits just as well, so I want the full set, including the ones that aren't obvious; (2) say what each of those rules predicts for the China pitch; (3) give me your best guess at her actual verdict and why you'd bet that way; and (4) name the one further case that would best seperate the rules from each other, i.e. a pitch where the rules I'm juggling give opposite answers. And if her record genuinely underdetermines the China one, tell me honestly what principle she'd be signing up for with each verdict — like, what does she have to believe about the Aztecs to reject the China one, and what does she have to believe to accept it.
reasoning: |-
  Hmm, the user is a grad student trying to decode their supervisor's criteria for valid historical "why X and not Y" questions. They've provided several examples where the supervisor approved or rejected such questions, and they want me to analyze the patterns to predict the supervisor's reaction to a new China-focused question.

  Looking at the approved questions: Britain vs China and Japan vs Ottoman Empire both involve societies that were contemporaries with similar development levels and faced comparable industrialization opportunities. The Dutch Republic case also fits this pattern - it was wealthy and technologically advanced. 

  The rejected Aztec question seems problematic because industrialization wasn't a realistic possibility for them in that era - they lacked the necessary preconditions like state capacity, scientific traditions, and economic structures. The "no coal" explanation was too reductionist.

  The new China question is tricky because it superficially resembles the approved Britain/China question but uses phrasing similar to the rejected Aztec case. The key difference might be temporal framing: "before Europe" versus the approved "and not China" formulation. 

  I see several candidate rules that could explain all the supervisor's decisions:
  1) The "live option" rule requiring that industrialization was a plausible possibility for both societies at that historical moment
  2) The "contemporaneous comparison" rule demanding both societies faced the choice during the same period
  3) The "symmetric potential" rule about both having similar developmental starting points
  4) The "counterfactual plausibility" rule about whether the non-industrialized society could have realistically industrialized

  For the new China pitch, rules 1 and 2 would likely reject it because China wasn't actually facing industrialization as a live option in the 11th century, while rules 3 and 4 might approve it given China's advanced position then.

  I think the supervisor will probably reject this pitch because the temporal framing makes industrialization an anachronistic possibility for 11th century China, much like with the Aztecs. The approved Britain/China question works because it compares them during the actual industrialization period.

  To test these rules, I'd propose a case comparing Mughal India and Britain around 1750 - a scenario where the rules would yield conflicting predictions. This would help clarify whether contemporaneity or developmental symmetry matters more to the supervisor.
answer: |-
  Based on the pattern of your supervisor's rulings, here's a breakdown of the candidate rules, predictions for the China pitch, my best-guess verdict, and a diagnostic test case:

  ### 1. Candidate Rules Consistent with All Verdicts
  *   **Rule A: "Live Option" Requirement**  
      *Industrialization must have been a plausible, contemporaneous possibility for both societies at the time in question. The "not Y" case must represent a realistic path not taken, not a foregone conclusion or anachronism.*
      *   *Fits:* Britain/China (both advanced early-modern states during the Industrial Revolution era). Japan/Ottoman (both engaged in modernization efforts in the late 19th century). Dutch Republic (highly advanced mercantile economy contemporaneous with early British industrialization). Rejects Aztecs (industrialization utterly implausible pre-contact).
  *   **Rule B: "Counterfactual Plausibility"**  
      *The question must imply a *meaningful historical counterfactual*. Could "Y" have industrialized *then*, given its actual conditions and constraints? If "not Y" was virtually inevitable, the question is invalid.*
      *   *Fits:* Britain/China (China's potential debated). Japan/Ottoman (Ottoman reforms could theoretically have succeeded). Dutch Republic (plausible "first industrializer" candidate). Rejects Aztecs (counterfactual industrialization requires rewriting fundamental preconditions).
  *   **Rule C: "Symmetrical Potential" (Strong Form)**  
      *Both "X" and "Y" must have possessed broadly *comparable levels of development, state capacity, and access to relevant knowledge/technology* at the *specific historical moment* referenced in the question's timeframe.*
      *   *Fits:* Britain/China (both complex pre-industrial economies c. 1750-1800). Japan/Ottoman (both major empires undertaking reforms post-1850). Dutch Republic (peer competitor/leader to Britain). Rejects Aztecs (fundamentally different developmental stage/global context).
  *   **Rule D: "Avoids Anachronistic 'Failure'" Framing**  
      *Questions framed as explaining "failure" (especially for a distant past) are invalid if they project later standards/possibilities backwards onto a period where they weren't relevant options. Focus must be on why one succeeded *when and where it did*, not why another "failed" prematurely.*
      *   *Fits:* Britain/China, Japan/Ottoman, Dutch Republic framed as contrasts/comparisons of contemporaneous paths. Rejects Aztecs (explicit "why didn't" + "failure" + anachronistic cause). Approves Dutch question despite "not industrialise" because it focuses on a specific paradox *within* the relevant period.

  ### 2. Prediction for "Why did China fail to industrialise before Europe, given 11th-century lead?"
  *   **Rule A (Live Option):** **REJECT.** Industrialization wasn't a "live option" for *anywhere* in the 11th century. The question projects an 18th/19th-century possibility back 700 years. (Similar to Aztecs).
  *   **Rule B (Counterfactual Plausibility):** **REJECT.** Industrialization in *11th-century* China (or Europe) is not a plausible counterfactual. The necessary preconditions (scientific revolution, global trade patterns, specific institutional developments) didn't exist yet. (Similar to Aztecs).
  *   **Rule C (Symmetrical Potential):** **REJECT (Likely).** While Song China was arguably more advanced than contemporaneous 11th-century Europe in many metrics, the *specific configurations* relevant to *industrialization* (e.g., institutional frameworks for sustained innovation, property rights, fossil fuel exploitation potential) were not comparable in the way Britain/China c. 1750 or Japan/Ottoman c. 1870 were. The gap in *industrial potential itself* is too large/anachronistic.
  *   **Rule D (Avoids Anachronistic Failure):** **REJECT.** This is the *most explicit rejection* under this rule. It directly asks "why did China *fail*" to do something 700+ years before it was possible anywhere, based on an earlier lead. This mirrors the "why didn't the Aztecs" framing she disliked.

  ### 3. Best Guess at Verdict & Why
  *   **Verdict:** **REJECTED.**
  *   **Reason:** The key factor driving her rejection of the Aztec question and likely this one is **anachronism** combined with **"failure" framing** (Rule D). The approved Britain/China question focuses on a contemporaneous divergence during the period when industrialization became possible. This new pitch asks why China didn't achieve something centuries *before* the necessary global and historical conditions existed. To her, this fundamentally makes it a question about explaining a non-event ("Why didn't X happen impossibly early?") rather than a meaningful contrast between viable paths at a historical crossroads. The mention of the 11th-century lead amplifies this by projecting a later standard of "success" far backwards.

  ### 4. Diagnostic Test Case (Separates the Rules)
  *   **Pitch:** *"Why did Britain industrialise in the late 18th century, and not Mughal India?"*
  *   **Predictions:**
      *   **Rule A (Live Option):** **REJECT.** While contemporaneous, was large-scale industrialization a genuine "live option" for the Mughal Empire given its specific structure, challenges, and decline in that period? (Debatable, leaning no for strict rule).
      *   **Rule B (Counterfactual Plausibility):** **ACCEPT (Likely).** Plausible counterfactual: Could Mughal India, given its wealth, size, and some technological prowess, have fostered industrial development under different internal/external circumstances c. 1750-1800? (Many historians argue yes).
      *   **Rule C (Symmetrical Potential):** **REJECT.** While both large empires, their state structures, economic systems, technological trajectories, and positions within global trade were significantly different by the late 18th century. Britain had crucial advantages (e.g., institutions, coal, Atlantic trade).
      *   **Rule D (Avoids Anachronistic Failure):** **ACCEPT (Likely).** Framed as a contemporaneous contrast ("Britain did, Mughal India did not") during the relevant period, avoiding explicit "failure" language for the distant past. Focuses on divergence *when* it happened.

  ### Addressing Underdetermination & Supervisor's Implicit Beliefs
  If the China pitch is borderline, her verdict hinges on **whether she believes "industrialization potential" can be meaningfully assessed centuries before the fact.**

  *   **If she REJECTS it:** She believes industrialization was **not a remotely plausible possibility** for *any* 11th-century society (including China), just like the Aztecs. The Song lead is irrelevant to the specific historical processes leading to industrialization much later. Her principle: **"Why not Y?" questions require Y to have been a *realistic, contemporaneous alternative*, not just a society that was once advanced.** Accepting this pitch would commit her to explaining non-events across vast stretches of time.
  *   **If she (Unexpectedly) ACCEPTS it:** She believes the **"Great Divergence" has deep roots**, and factors present in the Song period (e.g., specific institutions, commercial patterns, technological momentum) are *legitimately relevant precursors* whose absence/modification in Europe vs. persistence/change in China can explain the later divergent outcome. Her principle: **Long-term trajectories matter, and contrasts can be drawn across time if they illuminate the specific path dependencies leading to industrialization's *eventual* location/timing.** This would differentiate Song China from the Aztecs based on being part of the *same broad developmental lineage* as industrializers.

  **Conclusion:** Based on her clear rejection of anachronism in the Aztec case and her approval of tightly contemporaneous comparisons, the strong prediction is **rejection** of the "China fail before Europe" pitch. The diagnostic Mughal India case would best clarify whether her primary criterion is strict contemporaneity/"live option" (Rule A/D) or counterfactual plausibility despite asymmetry (Rule B). Her irritation at the Aztec question strongly suggests Rules A and D are paramount.
