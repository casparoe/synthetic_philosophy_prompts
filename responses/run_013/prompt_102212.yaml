  **CARCANET & SONS**
  **STANDARD AUTHOR AGREEMENT & WARRANTY**
  **(Revision 7.3.2a)**

  **1.0 Warranties of Factual Accuracy.** The Author hereby warrants and represents, upon execution of this Agreement and as a continuing obligation, the absolute factual accuracy, to the best of the Author’s current knowledge and belief, of each individual declarative sentence contained within the Work (the "Individual Sentence Warranties"). This warranty extends to all statements of fact, assertion, and conclusion presented as veridical within the scholarly context of the Work.  

  **1.1 Scope of Individual Sentence Warranties.** For the avoidance of doubt, Clause 1.0 applies discretely and severally to *each and every* such sentence within the Work, considered in isolation from the aggregate. The Author affirms that, taken singly, each sentence meets the rigorous epistemic standards expected by Carcanet & Sons and the relevant scholarly community.  

  **2.0 Acknowledgement of Collective Fallibility.** Concurrently with the warranties under Clause 1.0, the Author acknowledges and warrants the fundamental principle of scholarly humility inherent to serious academic endeavour. The Author therefore expressly warrants that, notwithstanding the Individual Sentence Warranties, it is rationally probable that the Work, considered in its totality, contains at least one erroneous declarative sentence (the "Collective Fallibility Warranty"). Failure to include this explicit acknowledgement within the Author's preface or equivalent position shall constitute a material breach of this Agreement.  

  **3.0 Compatibility of Warranties.** The warranties provided under Clauses 1.0 and 2.0 are deemed by Carcanet & Sons to be fully compatible and mutually reinforcing expressions of rigorous scholarly practice. The Individual Sentence Warranties reflect the Author's commitment to veracity at the atomic level of scholarship. The Collective Fallibility Warranty reflects the Author's rational acceptance of the inherent limitations of complex intellectual synthesis and the corrigible nature of human inquiry. Carcanet & Sons affirms that a rational agent can, and indeed *must*, concurrently hold the discrete beliefs warranted under Clause 1.0 while accepting the probabilistic conclusion warranted under Clause 2.0.  

  **4.0 Epistemic Operations and Restrictions.**  

  **4.1 Acceptance vs. Full Belief.** The Author acknowledges the distinction, recognized by Carcanet & Sons policy, between (a) *accepting* a proposition as sufficiently warranted for inclusion based on current evidence and scholarly standards (applicable to Individual Sentence Warranties), and (b) possessing absolute, indefeasible *belief* in the invulnerability of a complex conjunction of propositions (which is not required or warranted for the Work in its totality).  

  **4.2 Conjunction Introduction (Restricted Operation).** The Author is expressly prohibited from employing the logical operation of unrestricted universal conjunction introduction across *all* declarative sentences within the Work to derive the proposition "All sentences in the Work are true" (the "Universal Conjunction Proposition"). Such an operation is classified by Carcanet & Sons as a restricted epistemic procedure requiring separate, express written authorization from the Chief Consistency Officer, which authorization shall not be unreasonably withheld but is rarely granted on grounds of scholarly prudence.  

  **4.3 Identification of Specific Error.** The warranties under Clauses 1.0 and 2.0 do not require, imply, or warrant that the Author possesses specific knowledge identifying *which* individual sentence(s) may be erroneous. The Collective Fallibility Warranty pertains solely to the probabilistic assessment of the aggregate, absent specific locational knowledge.  

  **5.0 Prohibition and Penalties Regarding Universal Conjunction.**  

  **5.1 Prohibition.** The Author is strictly prohibited from asserting, implying, publishing, or otherwise disseminating the Universal Conjunction Proposition concerning the Work, whether during the term of this Agreement or at any time thereafter.  

  **5.2 Penalty Schedule.** Breach of Clause 5.1 shall trigger the following liquidated damages, deemed reasonable estimates of harm to Carcanet & Sons' reputation for scholarly rigour:
      *   **First Instance:** Forfeiture of 50% of accrued but unpaid royalties; mandatory participation in Epistemic Remediation Workshop (Level 1).
      *   **Second Instance:** Forfeiture of 100% of accrued but unpaid royalties; suspension of royalty payments on all Carcanet & Sons titles for 24 months; mandatory participation in Epistemic Remediation Workshop (Level 2) under supervision.
      *   **Third Instance:** Termination of all publishing agreements with Carcanet & Sons; forfeiture of all future royalties; public retraction notice issued by the Press citing "Systematic Failure of Scholarly Humility".

  **6.0 Carcanet & Sons Staff Annual Incentive Programme ("The Programme").**  

  **6.1 Programme Structure.** Each permanent employee of Carcanet & Sons is automatically allocated one (1) unique ticket in the Annual Incentive Draw conducted each fiscal year-end. A single winning ticket is drawn, entitling the holder to the Incentive Award.  

  **6.2 Employee Warranties.** As a condition of employment and participation in The Programme, each employee warrants, at the time of ticket allocation and continuously thereafter until the draw, that they rationally believe their own specific allocated ticket will *not* win the Incentive Award (the "Individual Non-Win Warranty").  

  **6.3 House Position.** Carcanet & Sons warrants, based on the mathematical structure of The Programme and the Individual Non-Win Warranties provided by each employee, that it rationally expects *all* tickets in the draw to be non-winning tickets (the "Universal Non-Win Expectation").  

  **6.4 Programme Outcome.** Notwithstanding the warranties under Clauses 6.2 and 6.3, Carcanet & Sons warrants that the draw is conducted fairly and that exactly one (1) winning ticket is drawn each year, resulting in the awarding of the Incentive Award. The compatibility of Clauses 6.2, 6.3, and 6.4 is inherent in the probabilistic nature of The Programme and requires no further resolution within this operational framework. As stated by the Chief Incentives Officer, "The Programme functions as designed, reflecting the stable expectations of rational participants operating under known constraints."

  **7.0 General Provisions.** Governing Law, Dispute Resolution (mandatory mediation via the Chief Consistency Officer), Assignment, Integration, etc., follow standard Carcanet & Sons boilerplate (Exhibit A).

  ---
