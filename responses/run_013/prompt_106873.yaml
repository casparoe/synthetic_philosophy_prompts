    - Laws are time-symmetric (lines 8-9, 18-19: "law and chance, combined, decree" implies physics is reversible).  
    - Entropy increases *away* from the low-entropy middle (stanzas 2/4 show drift toward disorder).  
    - The arrow of time arises *only* from the initial condition (the "seed" in line 14).  
  - **Human Break**: The final couplet (not mirrored) introduces memory/records as the sole reason we label one direction "past."  
  - **Accessibility**:  
    - Vivid imagery (e.g., "galaxy’s bright stand," "silent sea") grounds abstract concepts.  
    - Reversible reading: Start from the end—the mirrored stanzas retain physical coherence (e.g., "structures rise" applies both pre/post middle). Only the couplet anchors the arrow subjectively.  

