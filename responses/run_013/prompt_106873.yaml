  **The Arrow Unbent**

  At time’s two poles, a formless haze:  
  Dust scattered cold in vacant ways,  
  No pattern etched, no heat to flow,  
  Where every difference ebbs to low.  
  A silent sea, no shores to find.  

  Then, structures rise from chance’s hand,  
  A galaxy’s bright, fleeting stand—  
  But law and chance, combined, decree  
  These forms dissolve to entropy,  
  Returning to the undivined.  

  Yet at the core: a point, a spark,  
  A singularity, dense and stark,  
  Pure symmetry, no flaw, no line—  
  The seed of space, the first design—  
  All history in one small mark.  

  Then, structures rise from chance’s hand,  
  A galaxy’s bright, fleeting stand—  
  But law and chance, combined, decree  
  These forms dissolve to entropy,  
  Returning to the undivined.  

  At time’s two poles, a formless haze:  
  Dust scattered cold in vacant ways,  
  No pattern etched, no heat to flow,  
  Where every difference ebbs to low.  
  A silent sea, no shores to find.  

  Yet in our books, in memory’s hold,  
  The arrow points: one tale is told.  

