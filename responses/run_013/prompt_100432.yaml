prompt: |-
  I cover science and ideas for a general-interest publication, and I keep running into the same puzzle on my own beat: how my sources' fields decide what counts as a result. Across much of biomedical and social research, a finding becomes a finding only once a null-hypothesis significance test crosses the p < 0.05 line. Journals, funders, ethics boards, and the press offices I deal with all treat that threshold as the boundary between there is an effect and there is no effect, and the replication crisis is now widely described as a story about what that threshold rewards. Yet those same fields simultaneously push preregistration, effect sizes, confidence intervals, and, in some quarters, Bayesian alternatives. I would like you to reconstruct the philosophical commitments this practice presupposes.

  Specifically: what conception of evidence does treating a single p-value as the line between a real effect and a null one presuppose? The practice seems to draw on two traditions at once -- one in which the p-value is a continuous measure of evidence against a hypothesis, another in which it is merely a decision rule with a controlled long-run error rate. Those are not the same thing, and they license different verdicts in the same experiment. Does the actual practice presuppose one of them, both, or a hybrid that is quietly inconsistent? What view of induction does reading p > 0.05 as evidence of no effect require, and how would a likelihoodist or a Bayesian handle the same data differently? Which rival accounts of inference does the convention rule out outright, which does it merely sit uneasily with, and where is it genuinely underdetermined, so that several theories would license the same reporting behavior?

  Finally, separate what the practice strictly requires from what it has merely grown accustomed to, and tell me what would have to change -- in journals, in preregistration, in how results are reported to people like me -- if the field replaced the presupposed view with an explicitly Bayesian or likelihoodist one. I am after the implicit theory, not a defense of any camp, and I would rather you mark the points where the practice is philosophically silent than invent a doctrine it never held.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a science journalist covering biomedical and social research, and they're puzzled by the reliance on p<0.05 as the threshold for significance. They notice the tension between treating p-values as a strict cutoff versus continuous evidence, especially with the push for preregistration and alternatives like Bayesian methods. Their main request is to uncover the philosophical commitments behind this practice.

  First, I need to identify the core philosophical assumptions. The p-value threshold implies a blend of Fisher's significance testing and Neyman-Pearson decision theory. Fisher saw p-values as evidence against the null, while N-P used them for binary decisions with controlled error rates. The current practice merges these, which leads to internal conflicts. For example, treating p=0.049 as "real" and p=0.051 as "null" ignores the continuous nature Fisher emphasized, while the error rate control from N-P is often misunderstood as applying per-test, not long-run.

  The user also asks about the interpretation of non-significant results (p>0.05) as evidence of no effect. This assumes that failing to reject the null supports the null, which isn't logically sound. A likelihoodist or Bayesian would require explicit comparison of hypotheses, not just a single test. They'd calculate likelihood ratios or posterior probabilities instead of relying on p-values.

  Next, I should consider which inference traditions are ruled out. Pure likelihoodism and Bayesianism are marginalized because they reject fixed thresholds and emphasize evidence quantification. Fiducial inference is also incompatible. The practice sits uneasily with Fisher's view due to the rigid cutoff and with N-P because of misapplied error rates. It's underdetermined in cases like preregistration, which could fit different frameworks if focus shifts to effect sizes.

  The user wants to separate strict requirements from accustomed habits. Strictly, the practice requires a binary outcome based on p<0.05, but it's grown to include effect sizes and confidence intervals as supplements. Journals could still publish non-sig results if framed as methodologically sound, but they rarely do.

  Finally, switching to Bayesian or likelihoodist approaches would change reporting: journals would demand posterior distributions or likelihood ratios, preregistration include priors, and press releases highlight evidence strength over binary significance. The challenge is ensuring accurate communication without oversimplifying.

  I need to ensure I'm not defending any camp but exposing the implicit theories and contradictions. Highlight where the practice is philosophically silent, like in interpreting effect sizes without explicit hypothesis comparisons. Also, address how replication crisis critiques stem from these tensions, like p-hacking exploiting the binary threshold.
answer: |-
  The practice you describe—treating *p* < 0.05 as the threshold for a "real effect"—rests on a **philosophically unstable amalgamation** of frequentist traditions, with implicit contradictions and silent spaces. It primarily blends Fisherian significance testing and Neyman-Pearson decision theory while rejecting or ignoring alternatives. Below is a reconstruction of its commitments, tensions, and what change would entail.

  ---

  ### **Core Philosophical Commitments**
  1. **Hybrid Frequentism (Fisher + Neyman-Pearson)**:
     - **Fisherian Element**: The *p*-value is treated as a *continuous measure of evidence against the null hypothesis* (H₀). Smaller *p* = stronger evidence that H₀ is implausible.
     - **Neyman-Pearson Element**: The 0.05 threshold is a *fixed decision rule* to control long-run Type I errors (false positives) at 5%. This frames science as a process of "accepting/rejecting" hypotheses.
     - **The Tension**: Fisher opposed rigid thresholds (calling 0.05 "arbitrary"), while Neyman-Pearson saw *p* as a tool for behavior (reject/not reject), not evidence quantification. The hybrid pretends *p* < 0.05 is both *evidence against H₀* and a *decision to act as if H₁ is true*—a category error.

  2. **Implicit Inductive Logic**:
     - **Treating *p* > 0.05 as "No Effect"**: Requires a flawed view of **falsificationism**. It assumes:
       - Failing to reject H₀ implies H₀ is "true" (ignoring power, effect size, and Type II errors).
       - This violates the **fallacy of affirming the consequent**: Absence of evidence ≠ evidence of absence.
     - **Justification**: Relies on **long-run error control** (Neyman-Pearson). If we always reject H₀ when *p* < 0.05, only 5% of "effects" are false positives *when H₀ is true*. But this says nothing about individual experiments.

  ---

  ### **How Rival Frameworks Handle the Same Data**
  | **Approach**      | **Interpretation of *p* = 0.06**                              | **Evidence for "No Effect"?**                               |
  |-------------------|---------------------------------------------------------------|------------------------------------------------------------|
  | **Current Hybrid** | "Non-significant" → No effect (or "null result").             | Yes, erroneously.                                          |
  | **Likelihoodist** | Compares likelihood of data under H₀ vs. H₁. If LR ≈ 1, data equally support both. | Only if likelihood under H₀ >> H₁. *p*-value irrelevant. |
  | **Bayesian**      | Computes posterior odds: P(H₁|data)/P(H₀|data) = [P(data|H₁)/P(data|H₀)] × prior odds. | Depends on priors and effect size. *p* = 0.06 could support H₀ or H₁. |

  **Key Difference**: Likelihoodists/Bayesians demand **comparative evidence** (H₀ vs. H₁). The hybrid treats H₀ rejection as proof of H₁ without direct comparison.

  ---

  ### **What the Practice Rules Out or Conflicts With**
  1. **Ruled Out Outright**:
     - **Pure Likelihoodism**: Rejects thresholds; focuses on likelihood ratios.
     - **Bayesianism**: Replaces *p*-values with posteriors. Thresholds like "Bayes factor > 10" are optional.
     - **Fiducial Inference**: (Fisher’s abandoned alternative to Bayes).
     - **Error-Statistical Severity** (Mayo): Requires assessing if data *strongly* test H₀, beyond *p* < 0.05.

  2. **Sits Uneasily With**:
     - **Fisher’s View**: He opposed fixed α (e.g., 0.05) as automatic rejection criteria.
     - **Neyman-Pearson**: Their framework requires pre-specified alternatives and power analysis—rare in practice.
     - **Effect Size Emphasis**: Reporting *d* = 0.8 with *p* = 0.06 contradicts "no effect" but is common.

  3. **Underdetermined**:
     - **Preregistration**: Compatible with any framework but *amplifies* the hybrid’s flaws by locking in binary decisions.
     - **Confidence Intervals**: Often misinterpreted as Bayesian credible intervals (e.g., "95% CI contains true effect with 95% probability").
     - **Replication Crisis**: Highlights the hybrid’s vulnerability to *p*-hacking and publication bias.

  ---

  ### **Strict Requirements vs. Accustomed Habits**
  |                     | **Strictly Required**              | **Mere Custom**                     |
  |----------------------|------------------------------------|-------------------------------------|
  | **Threshold**        | Binary verdict (*p* < 0.05 = "real") | Effect sizes, CIs as "supplements". |
  | **Preregistration**  | Not required (historically)        | Growing adoption to curb flexibility. |
  | **Non-Significant Results** | Can be published as "null"       | Often unpublished ("file drawer").  |
  | **Evidence Logic**   | *p* as sufficient for H₁; *p* > 0.05 as H₀ support. | Journals tolerate nuanced discussion. |

  ---

  ### **If Fields Switched to Bayesian/Likelihood Frameworks**
  **Changes Needed**:
  1. **Journals/Funders**:
     - Mandate **posterior distributions** or **Bayes factors** (BF) instead of *p*-values.
     - Accept **continuous evidence**: BF = 3–20 ("moderate") vs. BF > 100 ("decisive").
     - Abandon "statistical significance" language.

  2. **Preregistration**:
     - Require **prior justification**: Specify plausible effect sizes (for Bayes) or alternative models (for likelihoodists).
     - **Priors**: Define informative/skeptical priors for Bayesian analysis.

  3. **Press Offices/Journalism**:
     - Shift from "scientists prove X" to "data support X over Y with strength Z".
     - Highlight **practical significance** (e.g., "therapy reduces symptoms by 15% [95% CrI: 5–25%]").
     - Normalize **inconclusive results** (e.g., BF = 1: "Data equally consistent with both hypotheses").

  **Philosophical Clarity**: Bayesianism explicitly quantifies evidence *for hypotheses*; likelihoodism compares models without priors. Both avoid the hybrid’s false dichotomies.

  ---

  ### **The Silent Spaces**
  - **What Counts as "Real"?** The hybrid never defines "real effect"—it conflates *statistical non-zero* with *practically meaningful*. A tiny effect (*d* = 0.01) with *n* = 10,000 yields *p* < 0.05 but may be trivial.
  - **Inductive Basis**: It implicitly relies on **frequentist induction** (long-run performance) but applies it per-study, violating the theory’s own premises.
  - **Error Control**: Assumes α = 0.05 controls false positives, ignoring that **real-world error rates depend on prior plausibility** (e.g., Ioannidis: "Most published findings are false").

  ---

  ### **Conclusion**
  The practice presupposes a **pragmatic but incoherent hybrid** of frequentist ideas, mistaking a *decision rule* for a *measure of evidence*. It rules out frameworks demanding explicit model comparison (Bayes/likelihood) and conflates falsification with confirmation. Changing it would require abandoning the "effect/no effect" dichotomy for continuous evidence—shifting journals from gatekeepers of significance to narrators of evidential weight. For your reporting, this means future press releases might emphasize "the data support Hypothesis A 25 times more than B" rather than "p < 0.05 proves A." The replication crisis is, at heart, a crisis of this implicit philosophy.
