answer: |-
  Your gut verdicts are remarkably consistent with a **Principle of Legal Continuity**, grounded in the idea that legal systems must maintain a coherent chain of validity. The core insight is this: **A rule can only be changed or abolished using the authority granted by the rule itself, but this authority cannot be used to destroy the system's capacity for future legal change without creating a contradiction.** This principle draws from H.L.A. Hart's "rule of recognition" and Kelsen's "grundnorm," focusing on the hierarchy of rules and the conditions for their validity.

  Here's the principle formalized:  
  **"A legal act is valid only if:**  
  **(a) It is authorized by a valid higher-order rule in force at the time of enactment, AND**  
  **(b) It does not purport to irrevocably destroy the source of its own authority or the system's capacity for future authorized change."**

  ---

  ### **Application to Your Cases & Necessary Adjustments**
  Your verdicts mostly fit, but one requires revision for consistency:

  1.  **✓ Fits:** The first vote (2/3 → 3/4) is valid under the original rule. The second vote (2/3 reverting) is invalid because it fails the *current* rule (3/4).  
      **Why:** The amendment rule survives the first change. The second act lacks authority under (a).

  2.  **✗ Must be revised to SUCCEED.**  
      Your verdict ("fails") conflicts with (3) and (5). The 3/4 vote is valid: the rule setting the board size is ordinary, not a higher-order rule. The amendment rule (now 3/4) authorizes changes to *any* bylaw, including this one. The original enactment of the board-size rule didn't entrench it hierarchically.  
      **Why revise?** If a mere bylaw could irreversibly bind future majorities, it violates (b)—it destroys the system’s amendability. Your intuition in (3) and (5) accepts that validly amended rules govern. Stick to that here.

  3.  **✓ Fits:** The ratification by 3/4 is valid as a *revolutionary act* creating a new constitutional order. The old rule (unanimity) didn’t survive the act, but this is permissible because the new constitution replaces the entire framework.  
      **Why:** The act establishes a *new* source of authority (b), avoiding self-destruction. The old rule is extinguished, not "violated."

  4.  **✓ Fits:** The repeal works. Parliamentary sovereignty implies no parliament can bind its successors. The "no repeal" clause is void *ab initio* because it violates (b)—it attempts to destroy future legal authority.  
      **Why:** The rule authorizing statutes (e.g., majority vote) doesn’t permit irrevocable entrenchment. The repeal is authorized by the standing parliamentary rule.

  5.  **✓ Fits:** The first change (majority → unanimity) is valid under the original rule. The second change (unanimity → majority) fails because it violates the *current* rule (unanimity).  
      **Why:** The original rule authorized its own amendment. The second act lacks authority under (a).

  6.  **✓ Fits:** The abolition is **invalid** (as you suspect). While the amendment rule authorizes its own *amendment*, abolishing it entirely destroys the source of authority for *all* future changes. This violates (b)—it uses the rule to annihilate the very basis for its validity.  
      **Why ≠ (5)?** In (5), the rule survives as amended (unanimity). Here, the rule is erased, creating a void. Without an amendment rule, no future legal change is possible, rendering the system static and incoherent.

  7.  **✓ Fits (with nuance):** The statute is **invalid** ("not law at all"). A rule declaring its own invalidity is a performative contradiction—it claims authority while denying it. It violates (a) because no higher rule can authorize a self-destroying act.  
      **Why:** Validity requires that a rule *can* have effects; self-nullification is logically impossible in a functioning legal system.

  ---

  ### **The Principle in Action**
  - **Key Insight:** Higher-order rules (amendment procedures, constitutional provisions) are the "rules about rules." They can be *amended* but not *abolished* using their own authority, as this severs the chain of validity.
  - **Avoids Circularity:** Your half-stated principle ("an act binds later actors only if the rule survives") is refined by distinguishing between *amending* a rule (permitted) and *annihilating* it (forbidden unless revolutionary).
  - **Solves (5)/(6) Distinction:** Amendment alters the rule; abolition destroys the foundation. The first is self-referential but coherent; the second is self-destructive.

  ---

  ### **Your Hypothetical: "Unanimous Vote of All Past Members"**
  - **Analysis:** This rule is **valid if enacted**, but likely **unamendable in practice** and potentially void if tested.  
  - **Why valid?** If properly enacted under an existing amendment rule (e.g., simple majority), it satisfies (a). It doesn’t destroy the amendment power—just makes it astronomically difficult.  
  - **Why problematic?** It violates the spirit of (b) by creating a "dead hand" problem (past members control future change). Courts might invalidate it as *ultra vires* for undermining legal continuity, but strictly applying the principle, it stands.  
  - **Practical Outcome:** A later majority would likely ignore it (treating it as void) or perform a "revolutionary" act (as in your case 3), installing a new rule.

  ---

  ### **What You Must Give Up**
  - **Revise Case (2):** Accept that the three-quarters vote **succeeds**. The board-size rule is ordinary, not hierarchically entrenched. Your other verdicts (especially 3 and 5) rely on current rules governing, so this must align.  
  - **Minor Wobble in (7):** Your indecision here is natural—some scholars argue it could be a valid "empty" law. But the principle demands invalidity to avoid contradiction.

  This framework preserves 6/7 of your verdicts and resolves the tension between (5) and (6) by focusing on the *survival* of legal authority. If you hold this line, you’ve got a robust jurisprudential stance!
