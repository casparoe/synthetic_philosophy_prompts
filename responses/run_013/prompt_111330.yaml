  The Principle of Authority could be key: legal rules derive validity from higher rules. The amendment rule is fundamental. Changing it is possible, but abolishing it removes the source of validity for future changes. So in (5), changing the procedure to unanimity is valid because the original rule allowed it. In (6), abolishing the procedure removes the basis for any future amendments, making the abolition invalid because it undermines the legal system's continuity.

