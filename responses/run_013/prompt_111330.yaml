  Case (6) is similar to (5) but in a constitution. An amendment procedure is used to abolish itself. The user feels this is invalid but can't reconcile with (5). The distinction might be that abolishing the amendment procedure entirely removes the power to amend, whereas changing the procedure maintains the power but alters the rules. Abolishing might leave no way to make changes, which could be problematic.

  Case (7) is a statute stating it's void. The user is unsure if it's valid but ineffective or not law at all. This touches on self-referential paradoxes.

  The user's half-stated principle is that an act binds later actors only if the rule authorizing it survives. But that feels circular. They also ask about a rule requiring a unanimous vote of all past members to amend, which seems impractical.

  Now, to find a consistent principle. The Doctrine of Implied Repeal might apply where later laws override earlier ones. But constitutional entrenchment complicates this. The Principle of Legal Continuity suggests that legal changes must follow existing rules to maintain the system's integrity. Self-embracing rules are those that authorize their own amendment, so changing the amendment rule is possible if done correctly. But abolishing the rule entirely might be different because it ends the legal system's ability to change.

