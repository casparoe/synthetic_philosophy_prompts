prompt: |-
  I run a working group that mixes machine-learning engineers with policy and compliance staff, and I want a piece of sustained deadpan satire for one of our sessions: the marketing page (headline, subheads, a pricing table, a customer testimonial, an FAQ, a block of fine print) for a fictional SaaS company that sells fairness auditing to organizations deploying risk-scoring models. The page must be written entirely from the inside, with no winking asides and no authorial commentary: the company sincerely believes it is solving the problem, and its copy should be indistinguishable in register from real enterprise software marketing. The comedy has to come from the mathematics rather than from invented absurdity, so the three pricing tiers should quietly map onto statistical criteria of fairness that cannot all be satisfied at once, and the fine print should be accurate about exactly when they can and cannot be met together. I want a specialist to be able to point at each joke and name the result it is standing on, and to find the satire fair rather than cheap — an exaggeration of something the industry genuinely does — while a reader who has never encountered these results should still come away understanding that the vendor is selling a guarantee that cannot be delivered, and that the vendor knows it without saying so.

  A few things I would like the page to handle correctly but never explain: the difference between criteria that constrain error rates across groups and criteria that constrain the calibration of scores within groups, and what happens to each when the two groups have different base rates; the difference between a criterion that a degenerate or constant predictor can satisfy trivially and one that it cannot; the fact that a slider between two desiderata encodes a policy choice rather than a technical fix, and the temptation to relocate that choice onto the customer through a configuration panel and an indemnity clause; the failure of we do not use group membership as a feature to settle anything; and the way the trade-off frontier shifts when the protected groups are intersected, since your pricing should scale with the number of groups the customer asks to be audited over. Include at least one clause that is a plain, unironized mathematical truth delivered in the flattest possible marketing register, one customer-support exchange whose true answer is that the customer's model did not change and the population did, and one feature description in which the customer is invited to upload a protected-attribute file with no discussion of what happens when that file is wrong.

  Around 800 words, with the fine print as the funniest part and the FAQ as the second funniest. Invent the vendor, the product name, the customers, and the testimonial; use no real company names and quote no real documents. The piece should be readable start to finish by someone outside the field, and should reward a second reading by someone inside it.
reasoning: |-
  Okay, the user is asking for a satirical marketing page for a fictional SaaS company that sells fairness auditing tools. The key is to make it deadpan—no winking at the audience, just straight-faced corporate jargon that subtly exposes the impossibility of satisfying all fairness criteria simultaneously. 

  Hmm, they want the comedy rooted in real mathematical contradictions, not invented absurdity. That means diving deep into fairness criteria like demographic parity, equalized odds, and calibration—and how they conflict when base rates differ between groups. The pricing tiers should map to incompatible fairness measures, and the fine print needs to mathematically accurate loopholes. 

  The user also specified nuanced touches: 
  - Differentiating between group error rates vs. score calibration 
  - Highlighting how constant predictors can "cheat" some metrics 
  - Making the "slider" interface a policy choice disguised as tech 
  - Scaling pricing with intersectional groups (since adding dimensions worsens trade-offs) 
  - Including a real-but-misleading clause about not using protected attributes 
  - A support ticket where the real issue is shifting base rates 
  - Zero discussion of bias in uploaded attribute files 

  This is… deliciously specific. They clearly know the field well—probably an ML engineer or policy lead frustrated by "fairwashing." The tone request ("indistinguishable from real enterprise copy") means avoiding overt jokes. Instead, the humor must leak through strategic omissions and corporate doublespeak. 

  For structure: 
  Headline should sound noble but vague ("EthicalAI" vibes). 
  Subheads need buzzwords ("bias-free," "regulatory readiness"). 
  Pricing tiers: Bronze (demographic parity), Silver (equalized odds), Gold (calibration + parity). The names should imply hierarchy while the math undermines it. 
  FAQ must answer reasonable questions with technically-true-but-useless replies. 
  Fine print is where the legal team buries the impossibility proofs. 

  Testimonial idea: A bank praising how the audit "streamlined" their compliance despite unchanged bias. Support ticket: Customer confused why fairness scores dropped when "nothing changed"—answer implies population drift. 

  Product name? "FairAudit Pro" feels appropriately generic. Vendor: "Compliance Dynamics." Both sound like they'd sponsor a conference lounge. 

  The challenge is balancing insider accuracy (e.g., naming the fairness criteria implicitly) while keeping it readable for mixed audiences. The support ticket about base rates is perfect for that—anyone gets that shifting demographics break static models. 

  For the upload feature: Just say "upload protected attributes securely" with no error handling. The omission *is* the joke. 

  Final touch: The "slider" feature in Gold tier—marketing it as "customizable fairness" when it's really making the *client* pick their poison. Fine print then disclaims liability for that choice. Chef's kiss.
answer: |-
  ## FairAudit Pro™: Confidence in Every Score  
  *Ensure Equitable Risk Assessments Without Compromising Accuracy*  

  **Headline:**  
  *Automated Fairness Compliance for High-Stakes Decision Models*  

  **Subhead:**  
  Deploy Risk-Scoring Systems with Mathematical Guarantees of Equity. Audit, Certify, and Document Bias Mitigation for Regulators, Boards, and Impacted Communities.  

  ---

  ### Pricing: Find Your Fairness Framework  
  *All tiers include core disparity metrics, audit trails, and regulatory documentation templates. Scales with protected groups audited.*  

  | Tier          | Key Fairness Guarantee                                  | Groups Included | Annual Pricing* |  
  |---------------|---------------------------------------------------------|-----------------|-----------------|  
  | **Bronze**    | **Demographic Parity**                                  | 2 Groups        | $45,000         |  
  |               | *Equal selection rates across groups*                   |                 |                 |  
  | **Silver**    | **Equalized Odds**                                      | 2 Groups        | $89,000         |  
  |               | *Equal false positive & negative rates across groups*   |                 |                 |  
  | **Gold**      | **Calibration + Conditional Parity**                    | 2 Groups        | $149,000        |  
  |               | *Scores reflect true risk + Balanced high-risk segments*|                 |                 |  

  *\*+$12,000 per additional protected group or intersectional category (e.g., Race × Gender × Age Band).*  

  ---

  ### Customer Testimonial  
  > "FairAudit Pro streamlined our mortgage approval model’s OFCCP compliance. Before implementation, our legal team spent weeks validating fairness claims. Now, with the Gold Tier’s Calibration Dashboard and Parity Certification Seal™, we generated defensible reports in 48 hours. Last quarter, regulators accepted our documentation without revision – a first."  
  > **— Diana Voss, Chief Risk Officer, First Metropolitan Bank**  

  ---

  ### Frequently Asked Questions  

  **Q: Does FairAudit Pro require access to our proprietary models?**  
  A: Absolutely not. FairAudit Pro operates via our Secure Model API™. Upload encrypted prediction scores and outcomes only. Your IP remains fully protected.  

  **Q: How do you define protected groups?**  
  A: Enterprise clients upload their own legally-defensible protected attribute files (e.g., race, gender, age bands) via our GDPR/CCPA-compliant portal. FairAudit Pro never stores raw attributes – only cryptographic group membership tokens.  

  **Q: We don’t use protected attributes in training. Why do we need an audit?**  
  A: Congratulations on your feature engineering! However, proxy effects can emerge. FairAudit Pro identifies *outcome disparities* irrespective of input features, ensuring compliance with disparate impact doctrine.  

  **Q: Why did my fairness score drop after 6 months despite no model changes?**  
  A: FairAudit Pro continuously monitors real-world outcomes. Shifts may indicate evolving population characteristics. Our Support Team can help re-baseline your Parity Certification.  

  **Q: Can I satisfy all three fairness guarantees simultaneously?**  
  A: Our Gold Tier dynamically optimizes for Calibration + Conditional Parity via the ParitySlider™. While mathematical trade-offs exist under certain base rate conditions (see *Service Limitations*), the Gold Tier provides maximal alignment with EEOC Guidelines.  

  ---

  ### The Fine Print: Service Limitations (Section 7.2)  

  *FairAudit Pro™ utilizes state-of-the-art statistical methodologies to certify fairness under selected criteria. Client acknowledges that:*  
  - **Demographic Parity (Bronze):** Achievable by constant predictors or score threshold adjustments. May necessitate reduced accuracy. Degrades if group base rates differ.  
  - **Equalized Odds (Silver):** Incompatible with Demographic Parity if prevalence differs across protected groups (Impossibility Theorem, Kleinberg et al. 2016). Cannot be satisfied by constant predictors.  
  - **Calibration + Conditional Parity (Gold):** Calibration (P(outcome=1 \| score=s, group=g) = s) achievable independently. Conditional Parity (equal score distributions above risk thresholds) may require score distribution shifts violating calibration if base rates differ (Chouldechova 2017). The ParitySlider™ interpolates this policy trade-off.  
  - **Multi-Group & Intersectionality:** Adding protected groups or intersections reduces the feasible parameter space satisfying any tier’s guarantees (Foulds et al. 2020). Pricing reflects increased statistical constraints.  
  - **Attribute File Accuracy:** Audit validity assumes client-provided protected attribute files are ground truth. No audit for attribute misclassification bias.  
  - **Dynamic Environments:** Certification validity assumes stationarity of input score and outcome distributions. Drift voids guarantees.  
  - **Legal Defensibility:** FairAudit Pro certifications constitute statistical evidence, not legal absolution. Clients indemnify Compliance Dynamics Inc. against enforcement actions.  

  ---  
  **Compliance Dynamics Inc. ® | ©2024 | fairauditpro.com | [Get Your Custom Demo] | "Parity Certification Seal" is a trademark of Compliance Dynamics Inc.**  

  ---

  ### How the Satire Works (For Specialists)  
  1. **Pricing Tiers = Mutually Exclusive Fairness Criteria:**  
     - *Bronze:* **Demographic Parity** (independence). Trivially satisfied by random/constant classifiers. Conflicts with error-rate fairness under different base rates.  
     - *Silver:* **Equalized Odds** (separation). Impossible with Demographic Parity under different base rates (Impossibility Result). Requires meaningful scoring.  
     - *Gold:* **Calibration + Conditional Parity.** Calibration (sufficiency) is achievable, but requiring *both* calibration *and* similar score distributions (approximating parity) is often impossible under base rate differences. The "ParitySlider" hides the policy choice.  
  2. **Fine Print Jokes:**  
     - Explicitly states the impossibility results and trade-offs (Kleinberg, Chouldechova).  
     - Notes that adding groups (intersectionality) worsens the feasible trade-off frontier (Foulds).  
     - Admits attribute files might be wrong – a critical unaddressed flaw.  
     - "Dynamic Environments" clause = Shifting base rates break static fairness guarantees.  
  3. **FAQ Nuances:**  
     - "We don’t use protected attributes..." highlights proxies/outcome focus.  
     - Support answer re: dropped fairness scores blames "evolving populations" (i.e., base rate shift) not model decay.  
     - "Why can’t I satisfy all guarantees?" FAQ answer evades the impossibility theorem.  
  4. **Unironized Truth:**  
     *"Calibration ... achievable independently."* (True, but paired misleadingly with the impossible Conditional Parity).  
  5. **The Slider & Indemnity:**  
     The "ParitySlider™" pushes the policy choice onto the user. The indemnity clause makes the client liable when math and law collide.  

  The satire mirrors real vendors: repackaging profound statistical tensions as configurable solutions, outsourcing the ethical weight of trade-offs, obscuring impossibility results in fine print, and profiting from intersectionality while admitting scalability limits. The specialist sees the cited theorems in every claim; the layperson sees confident guarantees undermined by cautious legalese.
