prompt: |-
  I'm in a grad seminar on welfare economics and we keep going in circles on interpersonal comparisons. Half the room wants to stay purely ordinal and shut up about it, the other half keeps saying "cardinal, interpersonally comparable utility" like the phrase itself settles something, and the readings on QALYs and cost-benefit stuff just assume we already have the thing we're arguing about. What I actually want out of you is the spec sheet. Put aside for now which camp is right and tell me what a theory of interpersonal utility comparison would have to deliver to be adequate for the job we keep asking it to do -- namely telling some authority (a health board, a tax office, whatever) how to trade one person's gain against another's loss. What are the real requirements? Which cases does it have to get right, which distinctions can't be collapsed (ordinal vs cardinal, level comparability vs unit comparability, "A is better off than B" vs "A gained more than B gained"), which no-go results does it have to live with instead of quietly assuming them away (Arrow-type aggregation trouble, the repugnant conclusion, mere addition, the fact that any scale you pick will be arbitrary up to some transformation), and how much of the usual machinery it can lean on before it's begging the question.

  Here's the kind of thing I mean by a case behind a requirement: my flatmate keeps pushing an example where a council hands out a fixed pot of money and there's a version where one lonely resident takes a huge hit so a thousand others each get a tiny lift, and every theory we've tried either says obviously do it or obviously don't, with no principled reason either way. That's the level I want each requirement motivated at -- a concrete case or consideration, not a slogan. And I'd like you to tell me which requirements are genuine and which are just prejudices of one camp (I suspect "must be cardinal" is one of the latter), whether some subset of them can't be jointly satisfied -- if so that's the most interesting part -- and which single requirement does the most to knock out the popular contenders.

  Format it like this, please. First a section called "What adequacy comes to here", one short paragraph (~100 words), just pinning down what we're demanding and why it's relative to this purpose. Then "The requirements, with the case behind each", a numbered list or a table, roughly 500-600 words, one requirement per item with its motivating case in a sentence or two. Then "Negotiable or not", ~150 words, splitting genuine desiderata from camp preferences. Then "Where the list bites", ~150 words, on any jointly unsatisfiable subset and the one requirement that excludes the most. Skip the scoring of Harsanyi vs Sen vs whoever, I'll do that in class -- the criteria are the whole point.
