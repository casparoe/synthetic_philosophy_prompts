answer: |-
  ## Interpersonal Utility Comparison: The Adequacy Spec Sheet

  ### What adequacy comes to here
  Adequacy here means providing a *practically usable, ethically defensible basis* for a policy authority to make decisions involving trade-offs between identifiable gains for some individuals and losses for others. The theory must deliver more than just preference aggregation; it must yield reasoned judgments about the *net social welfare impact* of such transfers, grounded in comparisons of well-being magnitude across persons. Crucially, adequacy is relative to this specific purpose: informing real-world allocative choices (like health funding or tax policy) where ignoring interpersonal trade-offs is itself a consequential (and often unacceptable) decision. It must bridge the gap between individual preferences and collective action under conflict.

  ### The Requirements, with the Case Behind Each

  1.  **Explicit Trade-off Capability:** The theory *must* provide a principled method for evaluating scenarios where Person A gains utility while Person B loses it, yielding a net judgment ("do it," "don't do it," "only if gain/loss ratio > X").  
      *   **Case:** The Council Pot (Flatmate's Case). A fixed sum must be allocated. Option 1: Give $100,000 to one resident (Alice, poor, disabled). Option 2: Distribute $100 each to 1000 other residents (mostly comfortable). *Must* distinguish this from Option 3: Take $100,000 from Alice and give $0.10 each to 1000 others. A theory that *cannot* differentiate Option 2 (potentially acceptable) from Option 3 (clearly exploitative) is inadequate.

  2.  **Level Comparability (Minimal):** The theory *must* support meaningful judgments of the form "Person A is better off than Person B" *in a specific state of the world*.  
      *   **Case:** Health Priority Setting. A health board has one dialysis machine. Patient C has end-stage renal failure and will die without it; Patient D has moderate but manageable arthritis and wants it for pain relief. Assigning the machine requires judging that C's *level* of well-being (or deprivation) without treatment is worse than D's, justifying priority for C, even without precisely measuring *how much* worse.

  3.  **Unit Comparability (or Equivalent Trade-off Structure):** The theory *must* support judgments about the *relative magnitude* of changes in well-being *across different individuals*. This could be explicit unit comparability ("Alice's gain of X utils outweighs Bob's loss of Y utils") or manifest as stable, non-arbitrary trade-off ratios derivable from the theory's structure ("To justify taking $Z from Bob, we must give at least $W to Alice").  
      *   **Case:** Progressive Taxation. Justifying a tax that takes $10,000 from a high-income earner (Bob) to fund $1,000 in services for a low-income earner (Alice) requires the judgment that the *loss* to Bob is *less significant* (in welfare terms) than the *gain* to Alice. A theory that cannot ground this comparison (or an equivalent ratio) fails its core purpose.

  4.  **Non-Arbitrariness (Constrained):** While *some* conventional choice (e.g., selecting a zero point or unit) may be unavoidable, the core judgments (levels, trade-off ratios) must be robust to transformations that preserve the *meaningful information* the theory claims to capture. It cannot be infinitely malleable.  
      *   **Case:** Scale Sensitivity. If a theory says giving $10 to Alice outweighs taking $1 from Bob, but a simple rescaling of Alice's utility function (say, multiplying by 100) suddenly implies taking $1 from Bob requires giving $1000 to Alice to compensate, without any change in the underlying well-being facts, the theory's outputs are arbitrary and useless for policy.

  5.  **Non-Absurdity (Avoiding Repugnant/Pareto-Defeating Conclusions):** The theory *must not* systematically recommend choices universally deemed ethically unacceptable or contradictory to minimal welfare principles.  
      *   **Case:** The Repugnant Conclusion & Mere Addition. A theory must *not* imply that a vast population living lives barely worth living is better than a smaller population with very high-quality lives. Similarly, it must *not* imply that adding a person with a life barely worth living, *without affecting others*, makes the world worse (violating Pareto). A theory licensing these is practically and ethically bankrupt.

  6.  **Acknowledgment of Foundational Limits:** The theory *must* explicitly recognize and grapple with fundamental impossibility results and limitations (e.g., Arrow's Theorem showing no perfect aggregation method exists under certain reasonable conditions), rather than silently assuming them away. It must state its own axiomatic escape hatches.  
      *   **Case:** Aggregation Trouble. Any proposed social welfare function must be transparent about which of Arrow's conditions (e.g., unrestricted domain, non-dictatorship, independence of irrelevant alternatives) it violates to achieve interpersonal comparability and decisive trade-offs. Pretending Arrow doesn't bite is inadequate.

  ### Negotiable or Not

  *   **Genuine Non-Negotiables (For Purpose):** Explicit Trade-off Capability (Req 1), Level Comparability (Req 2 - essential for priority setting), Unit Comparability *or Equivalent Trade-off Structure* (Req 3 - core to the task), Non-Absurdity (Req 5 - ethical sanity check). Acknowledging Limits (Req 6) is crucial for intellectual honesty and practical realism.
  *   **Camp Preferences / Contextual Requirements:** **Cardinality per se is negotiable.** Robust ordinal level comparability *plus* a non-arbitrary structure for comparing gains/losses (which might *imply* cardinality, but doesn't start by demanding it) can suffice. The *insistence* on cardinality upfront is often a camp preference. Strict avoidance of any interpersonal comparison is incompatible with the purpose. The *degree* of Non-Arbitrariness (Req 4) is a spectrum; demanding *complete* invariance is excessive (and likely impossible), but demanding *no meaningful constraint* renders the theory useless. The acceptable level of constraint depends on the other requirements met.

  ### Where the List Bites

  The most significant tension arises between **Non-Arbitrariness (Req 4)** and **Non-Absurdity (Req 5)**, particularly when combined with **Unit Comparability/Equivalent Trade-offs (Req 3)**. Theories strong enough to generate decisive, non-arbitrary trade-off ratios (avoiding the paralysis of Req 1 & the Council Pot) often rely on structures (like additive aggregation of von Neumann-Morgenstern utilities or total utilitarianism) that are highly vulnerable to the Repugnant Conclusion (violating Req 5). Conversely, theories designed axiomatically to avoid Repugnance (e.g., critical-level utilitarianism, prioritarianism) often introduce parameters (critical levels, weighting functions) that appear arbitrary (challenging Req 4) or complicate trade-off rules. **Non-Absurdity (Req 5)** is arguably the requirement that does the most immediate damage to popular contenders, as it directly rules out classical utilitarianism (due to Repugnance) and strict Pareto-only approaches (inadequate for Req 1). It forces any adequate theory to incorporate *some* deontic constraint or non-aggregative principle beyond simple summation, immediately complicating the quest for a purely "scientific" interpersonal comparison metric.
