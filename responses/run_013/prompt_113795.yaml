prompt: |-
  I've been stuck in a long arguement about Jeffrey conditionalization. My friend says you can't really have uncertain evidence: if you're uncertain whether E, then what you learned is just some proposition about your experience, and you should condition on that. I say that's a dodge — sometimes the evidence itself is probabilistic, like a noisy thermometer reading, and Jeffrey's rule is the right way to update. We both know the standard examples and neither of us budges. I'm starting to think this isn't a real disagreement about how to update, but about what counts as evidence in the first place, or about whether probability in the rule is subjective or objective. Is that right? Or is there a hidden formal issue — order-dependence, non-commutativity, or the fact that Jeffrey's rule can't handle uncertain evidence about tautologies — that makes one of us wrong? I want a diagnosis of the impasse and what would count as progress, not a textbook derivation. Please answer in American English.
