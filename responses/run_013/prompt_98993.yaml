prompt: |-
  Ok so I'm building a prompt around the Bayesian problem of old evidence, but I don't want the model to just recite the standard setup like it's seen it a thousand times. Use this case: Mercury's perihelion. Quick facts so the model doesn't have to look anything up (it cant anyway) - Le Verrier noticed back in 1859 that Mercury's perihelion precesses about 38 arcseconds per century more than Newtonian gravity plus the known planetary perturbations predict, Newcomb later re-estimated it around 43, people spent decades trying to explain the extra bit, somebody proposed a hidden planet Vulcan, nobody ever found it, and then in 1915 Einstein's general relativity spat out almost exactly the missing amount, which he treated as a very big deal.

  So: run this episode through the Bayesian account of confirmation, and specifically the old-evidence problem. The standard puzzle is that the anomaly was known long before GR existed, so the agent already assigns it probability 1, the likelihood ratio collapses to 1, and the evidence can't confirm anything. I want the model to actually do that mapping - what's e, what's h, whose credences are we even talking about, why P(e)=1 breaks it.

  Then work through the usual escapes and say where each one actually breaks: the counterfactual move (what would you have believed if you hadn't already known the number), the learning-that-we-learned-it move, the idea that the new theory itself shifts the probability of the old datum. Don't let it just list them - make it say which survives and which is a cheat.

  Here's the part I actually care about, and I want this injected so the answer can't come from reciting: push on whether the evidence was really old in the relevant sense. Before GR there wasn't a clean single proposition being observed - the size of the anomaly depends on how you model the solar system (solar oblateness, the other planets), so the 43-arcsecond anomaly is arguably only well-defined once you've got a theory to state it against. And the evidence isn't only the number: it's also the 50-plus years of failed fixes and a planet nobody could find, which wasn't a settled fact until well after 1859. So ask whether the description-dependence rescues Bayesianism or is just a dodge, and whether folding the failures into e changes anything.

  Then contrast it with the 1919 light-bending test, which was a genuinely new prediction. Why does new evidence feel like it does more work - is that a real Bayesian distinction or just psychology?

  And finish with an honest where-is-Bayesianism-silent here: what about how this episode actually went down does the confirmation machinery just not have anything to say about.
reasoning: |-
  We are given a specific historical episode: the precession of Mercury's perihelion and its role in the confirmation of Einstein's general relativity (GR). We are to analyze this through the lens of the Bayesian problem of old evidence, then push beyond the standard treatment by questioning the nature of the evidence and by comparing it to the 1919 light-bending test.

  The Problem of Old Evidence in Bayesian Confirmation Theory:

  In the Bayesian framework, evidence E confirms hypothesis H if and only if the probability of H given E is greater than the prior probability of H: P(H|E) > P(H). By Bayes' theorem:

  P(H|E) = [P(E|H) * P(H)] / P(E)

  The confirmation is often measured by the likelihood ratio: P(E|H) / P(E|¬H). However, if E is already known (old evidence), then P(E) = 1. Since E is certain, conditioning on E does not change anything: P(H|E) = P(H). Moreover, the likelihood ratio becomes 1 because P(E|H) = 1 (if H entails E) and P(E|¬H) = 1 (because E is already known). This seems to imply that old evidence cannot confirm any hypothesis.

  Mapping to Mercury Perihelion:

  - E: The anomalous precession of Mercury's perihelion (specifically, the residual after accounting for Newtonian gravity and known perturbations) is 43 arcseconds per century (using Newcomb's value).
  - H: General relativity (GR) as proposed by Einstein in 1915.

  But note: the anomaly E was known long before GR (since 1859). So, for any agent (scientist) in 1915, E is old evidence, P(E)=1. Therefore, according to the above, GR could not be confirmed by E.

  The Bayesian Agent: We are talking about the credences of scientists at the time of the introduction of GR (Einstein and his contemporaries). They already know about the 43 arcseconds.

  Escaping the Problem:

  1. **Counterfactual Move**: We consider what the agent would have believed if they had not known E. Then we compute the likelihood ratio in that counterfactual state. So, we imagine a state where the agent does not know E, and then update on E.

     - Problem: How to define the counterfactual state? It requires specifying a hypothetical prior that does not include E. This might be arbitrary. Also, the agent might have had background knowledge that is hard to disentangle from E.

  2. **Learning That We Learned It (Garber)**: The evidence is not E itself, but the fact that we have learned E. So, we update on the proposition "H entails E" (or that we have come to know that H entails E). This is the move of learning the logical connection.

     - Problem: This requires that the agent did not know the logical connection before. But in the case of GR, Einstein derived the perihelion precession from his theory. So, at the time of derivation, the agent (Einstein) learns that GR entails E. Thus, we update on the proposition that GR entails E.

     - However, it is controversial because it requires that the agent initially did not know the entailment. But in the case of Mercury, Einstein set out to see if GR would explain the anomaly. So, he might have been uncertain about the entailment.

  3. **Shifting Probabilities of Old Data**: Sometimes a new theory redefines the old evidence. For example, in GR the precession is not due to an anomaly but is a natural consequence. So, the meaning of E might change. Alternatively, the new theory might change the probability of E.

     - Problem: This is vague. How does the theory change the probability of E? If E is already known, P(E)=1, and no theory can change that.

  Pushing Back: Was the Evidence Really Old?

  We are asked to challenge whether E was really "old" in the sense required for the problem. There are two aspects:

  A. **Description-Dependence**: The 43-arcsecond anomaly is not a raw observation. It is a calculated residual that depends on a complex model of the solar system (Newtonian gravity plus perturbations from other planets, solar oblateness, etc.). Therefore, the proposition E is only well-defined relative to a background theory (Newtonian mechanics). Before GR, the anomaly was defined as the discrepancy from Newtonian predictions. With GR, the background theory changes. So, the same number 43 now becomes a consequence of GR.

     - This might rescue Bayesianism because the evidence E is not the same before and after GR. In the Newtonian framework, E was an anomaly. In GR, it is a prediction. Therefore, when GR is introduced, E is not simply old evidence because its meaning is tied to the background theory.

     - However, note that the numerical value (43 arcseconds) was known. So, if we take E to be the numerical value, then it is old. But if we take E to be the proposition "the precession of Mercury's perihelion, after accounting for all known Newtonian effects, is 43 arcseconds", then it is still old. But the background theory in which that accounting is done is Newtonian. So, the evidence is that the Newtonian model (with all known corrections) does not account for 43 arcseconds. This is a fact that was known.

     - Alternatively, we might think of E as the failure of the Newtonian model to explain the full precession. Then, GR explains it. But note that this failure was not immediately accepted: for decades, scientists tried to explain it within the Newtonian framework (e.g., Vulcan). So, the evidence E might be more than just the number: it includes the failure of alternative explanations.

  B. **The Full Evidence Includes the Failed Fixes**: The evidence is not just the 43 arcseconds, but also that for 50+ years, no one could explain it (despite efforts like Vulcan) and that the planet Vulcan was never found. This evidence was not settled until after 1859. So, by 1915, the evidence E is now: "The anomalous precession is 43 arcseconds per century and no Newtonian explanation (including Vulcan) has been found."

     - This extended evidence E* might not have been fully known in 1859. In 1859, the anomaly was noticed, but the failure of all attempts to explain it was not yet established. Therefore, in 1915, E* is not old in the same way: the part about the failure of Vulcan and other explanations is relatively recent.

     - How does this affect the Bayesian update? The prior P(E*) might not be 1. For instance, in 1915, one might assign a probability less than 1 to the proposition that no Newtonian explanation (including Vulcan) will ever be found? But wait, by 1915, the failure was a known fact. So, P(E*)=1. However, if we consider the agent at an earlier time (say, 1890) when the search for Vulcan was still ongoing, then E* would not be certain. But Einstein in 1915 is updating on E* which is known.

     - So, even with E*, it is still old by 1915.

  Conclusion on the Escape: The description-dependence and the extended evidence might help in reinterpreting E, but it does not completely solve the problem. The core issue remains: the fact that the anomaly existed and was unexplained was known by 1915.

  Contrast with the 1919 Light-Bending Test:

  In 1919, Eddington measured the bending of light by the sun during a solar eclipse, which matched GR's prediction (about 1.75 arcseconds) and contradicted Newtonian predictions (which would be half that, or 0.875 arcseconds, if only due to gravity). This was a new prediction: the result was not known before GR. Therefore, it was a novel test.

  - Why does new evidence feel more powerful? In Bayesian terms, it is because P(E) is not 1. The prior probability of observing a deflection of 1.75 arcseconds was low under the background theory (Newtonian physics). So, when GR predicts it and it is observed, the likelihood ratio P(E|GR)/P(E|¬GR) is high. This leads to a substantial update.

  - However, note that the light-bending test was not without issues (e.g., the data was messy and the confirmation was not as clean as often portrayed). But the key point is that it was a new observation.

  - The psychological aspect: Novel evidence might feel more striking because it is a prediction that the theory got right against the odds. Old evidence might feel like the theory was constructed to fit it (so it's not a risky test). However, in the case of Mercury, Einstein did not construct GR to fit the anomaly. He derived the precession from his theory and was delighted to see it matched. So, it was still a test of the theory.

  Bayesianism's Silence:

  What does the Bayesian account not capture about this episode?

  1. **The Process of Theory Construction**: How Einstein arrived at GR is not captured by confirmation. The fact that the Mercury anomaly was a guiding light for Einstein (he said that when he saw the calculation matched, he was "beside himself with joy") is about the heuristic role of evidence, not just confirmation.

  2. **The Social Context**: The acceptance of GR was not just about the Mercury anomaly. The light-bending test (1919) played a huge role in making GR famous. The anomaly had been known for decades without causing a revolution. Bayesianism does not account for the social and historical factors.

  3. **The Weight of Anomalies**: The Mercury anomaly was a thorn in the side of Newtonian physics for decades. The fact that it was unresolved for so long made it a significant problem. Bayesianism treats all evidence in terms of probability updates, but it does not capture the psychological weight of an unsolved problem.

  4. **Changing Meaning of Evidence**: As discussed, the same numerical value takes on a new meaning in a new theory. This change in interpretation is not just a Bayesian update.

  5. **Non-Empirical Factors**: The beauty and coherence of GR might have played a role in its acceptance. Bayesianism typically does not account for such factors.

  Conclusion:

  The problem of old evidence is a serious challenge for Bayesian confirmation theory. The case of Mercury's perihelion illustrates it vividly. The common escapes have their own problems. While the extended description of the evidence (including the failed attempts) and the theory-dependence of the anomaly might alleviate the problem to some extent, they do not entirely resolve it. The 1919 light-bending test, being a novel prediction, fits neatly into the Bayesian framework. However, the actual historical episode involves elements beyond pure confirmation, such as the role of the anomaly in theory development and the social reception of the theory, which Bayesianism does not address.
answer: |-
  ### Bayesian Analysis of Mercury's Perihelion and the Old-Evidence Problem

  I'll break this down step by step, using Mercury's perihelion precession as a case study to explore the Bayesian problem of old evidence. We'll move beyond textbook recitals by focusing on the historical specifics, then tackle your core questions about description-dependence, failed fixes, and the contrast with the 1919 light-bending test. Finally, I'll highlight where Bayesianism falls silent.

  #### **The Setup: Bayesian Confirmation and the Old-Evidence Problem**
  - **Hypothesis (h)**: Einstein's general relativity (GR), introduced in 1915.
  - **Evidence (e)**: The precise residual precession of Mercury's perihelion—initially estimated at 38 arcseconds/century by Le Verrier (1859), later refined to 43 arcseconds/century by Newcomb. This is the gap between Newtonian predictions (with planetary perturbations) and observations.
  - **Agent**: A typical scientist in 1915 (e.g., Einstein or a contemporary physicist) who already knows about the anomaly.
  - **The Problem**: Since the anomaly was known for decades before GR, the agent assigns \(P(e) = 1\) (e is old evidence). In Bayes' theorem:
    \[
    P(h|e) = \frac{P(e|h) \cdot P(h)}{P(e)}
    \]
    - If \(P(e) = 1\), then \(P(h|e) = P(h)\)—the posterior probability equals the prior. The evidence doesn't increase confidence in \(h\).
    - **Why the likelihood ratio collapses**: 
      - \(P(e|h)\) is high (GR predicts ~43 arcseconds).
      - But \(P(e|\neg h)\) is also high because \(e\) is already true—Newtonian models + failed fixes (like Vulcan) couldn't explain it, so \(e\) is expected even without GR.
      - Likelihood ratio: \(\frac{P(e|h)}{P(e|\neg h)} \approx 1\), so no confirmation.

  This seems paradoxical because historically, Mercury's anomaly was a major triumph for GR. Einstein called it a key validation. Bayesianism appears broken.

  #### **Escaping the Problem—and Where They Break**
  1. **Counterfactual Move (What if e weren't known?)**  
     - *Idea*: Calculate \(P(e|h)\) and \(P(e|\neg h)\) in a hypothetical state where the agent doesn't know \(e\). In this world, \(P(e) < 1\), so if GR predicts \(e\) well, it gets confirmed.
     - *Mapping to Mercury*: Imagine a 1915 scientist unaware of the anomaly. GR predicts ~43 arcseconds, while Newtonian physics (plus known perturbations) predicts 0 residual. \(P(e|h) \approx 1\) (GR fits perfectly), but \(P(e|\neg h)\) is low—why would Newtonian gravity fail by exactly 43 arcseconds? The likelihood ratio is high, confirming GR.
     - **Where it breaks**: It's a cheat. The agent *does* know \(e\), so the counterfactual is psychologically and historically unrealistic. Einstein knew about the anomaly—he didn't stumble upon it randomly. This move requires arbitrary assumptions about the counterfactual prior (e.g., ignoring decades of Vulcan searches). It feels like retrofitting.

  2. **Learning That We Learned e (Garber-Style Approach)**  
     - *Idea*: The evidence isn't \(e\) itself, but the discovery that \(h\) *entails* \(e\). We update on the logical truth \(h \vdash e\).
     - *Mapping to Mercury*: In 1915, scientists learn that GR mathematically derives the 43-arcsecond gap. Before this, they knew \(e\) but not that GR implied it. So, we update on \(k =\) "GR entails e." Now, \(P(h|k)\) can be high even if \(P(e) = 1\).
     - **Where it breaks**: It's unsatisfying for Mercury. Einstein *designed* GR to resolve gravitational anomalies, so \(P(k)\) wasn't low—he likely suspected GR could explain it. More damningly, this reduces confirmation to a "Eureka!" moment of deduction, ignoring why \(e\) was puzzling pre-GR. It dodges the historical weight of the anomaly.

  3. **New Theory Shifts Probability of e**  
     - *Idea*: GR redefines \(e\) by changing background knowledge. The Newtonian "anomaly" becomes a GR "prediction," so \(P(e)\) isn't truly 1 in the new context.
     - *Mapping to Mercury*: Pre-GR, \(e\) was defined against Newtonian models. GR introduces new variables (e.g., spacetime curvature), so the *same* 43 arcseconds is now a different proposition: "the observed precession matches GR's equations." Thus, \(P(e)\) resets to \(<1\).
     - **Where it breaks**: This is circular. If \(e\) is redefined relative to \(h\), confirmation becomes tautological ("GR confirms GR's predictions"). Historically, the number 43 was fixed pre-GR—it wasn't redefined. The move is a semantic dodge.

  **Verdict**: The counterfactual move is the least cheat-like for Mercury, but it's still artificial. Garber-style and probability-shifting feel like philosophical Hail Marys.

  #### **Your Core Challenge: Was the Evidence *Really* Old?**
  - **Description-Dependence of e**:  
    You're right: the "43 arcseconds" wasn't a raw observation. It was a *model-dependent residual* calculated from Newtonian physics plus perturbations. Pre-GR, this number was contested—solar oblateness estimates, Vulcan's influence, and planetary mass measurements affected the gap. Le Verrier got 38, Newcomb got 43, and others debated the value. Crucially, GR didn't just explain the number; it provided a new framework to *interpret* it.  
    - **Does this rescue Bayesianism?** Partially. If \(e\) is "the residual under a Newtonian model with specific perturbations," then \(e\) *is* old evidence (\(P(e) = 1\)). But if \(e\) is "the true precession unexplained by any non-relativistic physics," GR makes this proposition *new*. In 1915, scientists didn't know the residual was *fundamental*; GR revealed that.  
    - **Is it a dodge?** Yes, if abused. Bayesianism can handle this by splitting \(e\) into parts: the raw data (Mercury's orbit) vs. the anomaly (the gap). The raw data is old; the anomaly's *inexplicability* is newer. But this feels slippery—it doesn't fully resolve why Einstein's contemporaries saw \(e\) as decisive.

  - **Including Failed Fixes in e**:  
    The evidence isn't just the number—it's the *entire episode*: 50+ years of failed Newtonian explanations (Vulcan searches, tweaked solar models) that couldn't resolve the gap. By 1915, \(e\) had evolved into: "a 43-arcsecond residual persists despite exhaustive non-relativistic efforts."  
    - **Does this change anything?** Only subtly. The *composite* evidence \(e^*\) = (raw data + failed fixes) might have \(P(e^*) < 1\) in, say, 1860 (when Vulcan seemed plausible). But by 1915, \(e^*\) was settled—Vulcan was dead. So \(P(e^*) = 1\) still holds.  
    - **Bayesian response**: We can reframe \(e^*\) as "no non-relativistic explanation works," and GR gives the first viable solution. Then \(P(e^*|h)\) is high, while \(P(e^*|\neg h)\) is low (without GR, why did all fixes fail?). This boosts the likelihood ratio, but it's fragile—it leans on the counterfactual ("without GR, \(e^*\) is surprising").  
    - **Verdict**: Folding in failed fixes makes \(e\) richer, but doesn't bypass the old-evidence problem. It shifts focus to why Newtonian physics failed, which GR explains elegantly. Still, for a 1915 Bayesian agent, \(e^*\) remains old.

  #### **Contrast with the 1919 Light-Bending Test**
  - **The Episode**: In 1919, Eddington measured starlight bending during a solar eclipse. GR predicted ~1.75 arcseconds; Newtonian physics (with gravity as force) predicted 0.87. The result matched GR closely, making Einstein famous.
  - **Why It Feels More Powerful**:  
    - It was *novel*: The bending wasn't measured precisely before 1919, so \(P(e) < 1\). Bayes' theorem works cleanly:  
      \[
      P(\text{GR}|e) \propto P(e|\text{GR}) \cdot P(\text{GR})
      \]  
      Here, \(P(e|\text{GR}) \approx 1\), while \(P(e|\neg \text{GR})\) was low (Newtonian physics predicted half the value). High likelihood ratio → strong confirmation.  
    - **Psychology vs. Bayesianism**: The "newness" amplifies psychological impact—it's a risky prediction. But Bayesianism *does* distinguish it: novelty implies \(P(e) < 1\), so confirmation isn't zero. For Mercury, \(P(e) = 1\) cripples updates. The distinction is real: new evidence can produce large probability shifts; old evidence can't unless we gerrymander \(e\).  
    - **Caveat**: The light-bending test was messy (data was disputed), but its power came from prior uncertainty. Mercury's confirmation was deeper—it solved a decades-old puzzle—but Bayesianism struggles to quantify that.

  #### **Where Bayesianism is Silent: What the Machinery Ignores**
  Bayesian confirmation theory is silent on key aspects of how this episode *actually* unfolded:
  1. **Theory Generation**: It doesn't explain why Einstein pursued GR or why Mercury's anomaly guided him. Bayesianism handles confirmation, not discovery. Einstein was motivated by aesthetic/mathematical principles (e.g., general covariance), not just updating priors.
  2. **Social Context**: The 1919 eclipse test made GR famous overnight; Mercury's explanation was more gradual. Bayesianism ignores how community consensus forms (e.g., Eddington's PR vs. niche interest in precession).
  3. **Weight of Anomalies**: The 50-year struggle with Mercury wasn't just about probability—it eroded trust in Newtonian physics. Bayesianism treats evidence atomically, not as a persistent failure that shifts the burden of proof.
  4. **Explanatory Virtues**: GR didn't just predict 43 arcseconds; it explained *why* (spacetime curvature near the Sun). Bayesianism reduces this to likelihoods, ignoring virtues like coherence or unification.
  5. **Uncertainty in e**: The messy history (Le Verrier's 38 vs. Newcomb's 43) shows \(e\) was fuzzy. Bayesianism assumes crisp propositions, but scientists debated what \(e\) even was.

  **In summary**: Mercury's perihelion highlights the old-evidence problem sharply—\(P(e) = 1\) collapses confirmation, and escapes feel forced. Description-dependence and failed fixes add nuance but don't fully rescue Bayesianism; they show how evidence is theory-laden and historically evolving. The 1919 test feels more powerful because it was genuinely novel, and Bayesianism captures that distinction. But the episode's richness—why Mercury mattered, how it guided Einstein, and why it took decades to resolve—lies outside Bayesian mechanics, in the realms of history, psychology, and theory construction.
