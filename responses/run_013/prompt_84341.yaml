  Key requirements for the question:
  - Must force students to adjudicate a novel case
  - Require four components: verdict on disposition, analysis of simple conditional analysis (SCA), assessment of basis-preserving repair (BPCA), critique of "nothing interferes" clause
  - Explicit distinction from finkish cases and "false positive" scenarios
  - 50-minute timeframe with 800-word limit

  For the model answer, I'll need to:
  - Take clear positions: X lacks the disposition, both SCA and BPCA fail
  - Argue that intrinsic interference defeats counterfactual analyses fundamentally
  - Demonstrate how "nothing interferes" trivializes the analysis
  - Contrast with finkish cases (disposition removal) vs. this case (blocked manifestation)

  The marking scheme should penalize:
  - Mislabeling case types
  - Missing the intrinsic interference distinction
  - Failing to address trivialization
  - Superficial treatment of BPCA

  This case is particularly clever because it isolates why disposition ascriptions require more than microstructural similarity—the simultaneous presence of incompatible mechanisms within one object challenges the very notion of a "single" disposition.
answer: |-
  ### Examination Question: Dispositions and Conditional Analysis (50 minutes; 800 words)

  **Case Study:**  
  Consider material X. Intrinsically, X has two microstructural features:  
  (1) Feature A: Identical to the microstructure of match-head compounds that ignite when struck.  
  (2) Feature B: When struck, it releases a flame-suppressing gas *faster* than ignition occurs. This gas extinguishes any flame at X’s surface without altering Feature A. If Feature B were disabled while Feature A remained intact, X would ignite when struck. Both features are intrinsic, reliable, and never influenced externally.  

  **Essay Task:**  
  Using this case, address all four points below in a single coherent essay:  
  1. **Verdict & Defence**: Is X disposed to ignite when struck? Defend your answer.  
  2. **Simple Conditional Analysis (SCA)**: What does this case show about SCA? (SCA: *x* is disposed to manifest M in response to stimulus C iff, if C occurred, M would occur.)  
  3. **Basis-Preserving Repair (BPCA)**: Assess whether BPCA survives this case. (BPCA: *x* is disposed to manifest M in response to C iff *x* has an intrinsic basis B such that if C and B obtained, M would occur.) Does the *intrinsicness* of Feature B matter?  
  4. **"Nothing Interferes" Clause**: Explain why adding "provided nothing interferes" to analyses like SCA/BPCA either trivializes them or makes them untestable.  

  **Additional Requirements:**  
  - Distinguish this case from (i) a standard *finkish* case (where the trigger removes the disposition/basis) and (ii) a case where M occurs without a disposition (e.g., accidental ignition).  
  - Avoid rehearsing textbook counterexamples; focus on novel reasoning.  

  ---

  ### Model Answer (798 words)  

  **Verdict: X is not disposed to ignite when struck.** The disposition ascription fails because X’s intrinsic structure *systematically prevents* the manifestation. Feature A satisfies the microstructural criteria for flammability, but Feature B guarantees ignition never occurs under the stimulus. A disposition requires a non-accidental modal connection between stimulus and manifestation. Here, the connection is severed by X’s own constitution: the gas-release mechanism preempts ignition. Crucially, even in ideal conditions (since no external interference exists), X’s intrinsic properties ensure non-ignition. Thus, X lacks the disposition despite having the "right" causal basis, as Feature B makes ignition impossible.  

  **Implications for SCA:** This case refutes SCA by satisfying its conditional while falsifying the disposition ascription. SCA states that X is disposed to ignite iff if struck (C), ignition (M) would occur. In this scenario, if C occurs, M *does not* occur (due to Feature B). SCA thus correctly denies that X has the disposition. However, this *accidental correctness* exposes SCA’s flaw: it cannot distinguish between cases where M’s absence results from a *lack* of disposition (e.g., water not igniting) and cases where M’s absence results from a *blocked* disposition (as here). SCA treats both identically, making it inadequate for capturing genuine dispositions.  

  **BPCA’s Failure and the Role of Intrinsicness:** BPCA also fails, and Feature B’s intrinsicness is decisive. BPCA states that X has the disposition iff it has an intrinsic basis B (here, Feature A) such that if C and B obtained, M would occur. Here, Feature A *is* intrinsic, and if C (striking) and B (Feature A) obtained *alone*, M *would* occur. However, Feature B—also intrinsic—ensures that when C occurs, M is suppressed. BPCA’s counterfactual is false in the actual scenario: if C and Feature A obtained (which they do when struck), M would *not* occur because Feature B’s gas-release is simultaneous and faster. Thus, BPCA incorrectly denies the disposition.  

  One might retreat to a "purified" counterfactual: "If C occurred *and only Feature A were present*, M would occur." But this is ad hoc and misrepresents X’s actual constitution. Dispositions are grounded in an object’s *actual* properties, not hypothetical, stripped-down versions. The intrinsicness of Feature B is critical because it shows interference originates from within X itself. In standard masking (e.g., a match submerged in water), external blockers allow defenders to argue that the intrinsic basis remains intact. Here, the "mask" is intrinsic, collapsing the basis/blocker distinction. BPCA cannot exclude intrinsic interferers without circularity (e.g., defining "basis" as only disposition-conferring properties).  

  **The "Nothing Interferes" Clause and its Pitfalls:** Adding "provided nothing interferes" to SCA/BPCA seems appealing but renders analyses trivial or untestable. Consider:  
  - *Triviality*: If "interference" means "whatever prevents M despite C and B," the clause becomes "M occurs unless it doesn’t." This offers no predictive or explanatory power.  
  - *Untestability*: To test the analysis, we must identify interference independently. But if we could do that, we wouldn’t need the conditional analysis—we could directly assess dispositions via structural or causal criteria. The clause thus presupposes what it aims to define.  

  In this case, adding the clause would yield: "X is disposed to ignite if struck iff, if struck, it would ignite *provided nothing interferes*." But Feature B’s gas release *is* interference only if we already assume X *has* the disposition. Without independent criteria for "interference," the analysis is circular.  

  **Case Differentiation:**  
  - *Finkish Distinction*: In finkish cases (e.g., a wire disposed to conduct electricity loses its basis when plugged in), the trigger *destroys* the basis or disposition. Here, Feature A *persists* untouched; the disposition isn’t lost, but its manifestation is *blocked* by a coexisting intrinsic property.  
  - *False Positive Distinction*: Cases where M occurs without a disposition (e.g., a non-flammable object ignited by a hidden laser) involve accidental manifestations. Here, the issue is the opposite: X has a non-accidental basis for ignition but *cannot* manifest it due to intrinsic interference.  

  **Conclusion: The Limits of Counterfactual Analyses**  
  No counterfactual analysis can fully capture dispositions. X’s case shows that objects can possess a disposition’s causal basis while being intrinsically structured to prevent its manifestation. Counterfactual analyses (SCA, BPCA, or refinements) either misclassify such cases or rely on opaque ceteris paribus clauses that drain them of content. Dispositions must be grounded in intrinsic properties *plus* their functional roles in a system, but this requires modal commitments beyond counterfactual conditionals. Thus, while counterfactuals track dispositions in simple cases, they fail in metaphysically complex ones like X, revealing the need for a non-reductive theory.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Strong answers must:**  
  1. **Verdict & Defence (4 marks)**  
     - Clearly state X lacks the disposition (1 mark).  
     - Defend via intrinsic prevention of manifestation (1 mark), non-accidental modal failure (1 mark), and irrelevance of Feature A in isolation (1 mark).  
     *Penalise (-1):* Claiming X has the disposition without addressing systematic blocking.  

  2. **SCA Analysis (3 marks)**  
     - Note SCA correctly denies disposition here (1 mark).  
     - Argue this exposes SCA’s inability to distinguish lack-of-disposition from blocked-disposition scenarios (2 marks).  
     *Penalise (-1):* Misrepresenting SCA’s verdict.  

  3. **BPCA Assessment (5 marks)**  
     - Explain BPCA’s counterfactual is false in actual conditions (2 marks).  
     - Argue Feature B’s intrinsicness defeats BPCA by internalizing interference (2 marks).  
     - Reject "purified basis" workarounds as ad hoc (1 mark).  
     *Penalise (-1):* Ignoring intrinsicness; (-2): Claiming BPCA succeeds.  

  4. **"Nothing Interferes" Clause (4 marks)**  
     - Show how "interference" leads to triviality (e.g., "M unless not-M") (2 marks).  
     - Explain circularity/untestability (e.g., presupposing independent disposition criteria) (2 marks).  

  5. **Case Differentiation (2 marks)**  
     - Contrast finkish (basis removed) vs. this case (basis intact, manifestation blocked) (1 mark).  
     - Contrast false positive (accidental M) vs. this case (systematic non-M) (1 mark).  
     *Penalise (-1):* Conflating with finkish/masking without distinction.  

  6. **Structure & Clarity (2 marks)**  
     - Coherent essay; precise terms; ≤800 words.  

  **Key Errors Costing Marks:**  
  - Reciting standard counterexamples (e.g., "This is just masking") without novel analysis: -3.  
  - Undefended verdict: -2.  
  - Omitting any of the 4 core tasks: -3 per omission.  
  - Misstating the case (e.g., "Feature B alters Feature A"): -2.  
  - Exceeding word limit significantly: -1.
