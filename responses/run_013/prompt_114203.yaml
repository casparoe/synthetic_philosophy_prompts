answer: |-
  ## Joint Statement on the Moral Equality of Combatants

  **Section 1: Agreed Foundational Claims**

  1.  **Structure of the Problem:** We agree that the central question concerns the moral status of individual combatants during the conduct of war (*jus in bello*), specifically their permissions to use lethal force and their liability to be killed by enemy combatants. This is distinct from the justice of the war itself (*jus ad bellum*).
  2.  **Core Concepts:**
      *   **Permission:** An action is *permitted* if it does not wrong anyone, meaning there is no justifiable complaint against the agent performing it.
      *   **Liability:** An individual is *liable* to be harmed (e.g., killed) if harming them, under specific conditions, would not wrong them, meaning they lack a valid complaint against being harmed in that way. Liability is distinct from desert; one can be liable without deserving harm.
      *   **Culpability:** An agent is *culpable* for an action if they are morally responsible for it and it was morally wrongful. Culpability typically involves blameworthiness.
      *   **Excuse:** An *excuse* negates culpability or blameworthiness for an action that would otherwise be wrongful. An excused agent is not blameworthy *for that action*.
      *   **Distinction (Blameworthiness vs. Liability):** An agent can be liable to defensive harm even if they are not blameworthy (e.g., an excused attacker). Conversely, an agent might be blameworthy for a wrong without being liable to lethal defensive harm (e.g., someone culpable for minor theft).
  3.  **Stakes:** The disagreement has profound implications for the moral assessment of combatants' actions, the justification for killing in war, the potential moral asymmetry between participants, and the relationship between *jus ad bellum* and *jus in bello*.
  4.  **The Central Case:** We agree that the described border war case is a fair and crucial test case:
      *   Two states, A and B, go to war over a disputed border.
      *   Each side's government and populace, based on different but credible evidence, sincerely and *non-culpably* believes the other is the aggressor.
      *   Ordinary combatants on both sides are conscripts, equally unable to access the truth about *ad bellum* justice.
      *   Both sides fight under identical *in bello* rules (proportionality, discrimination).
      *   Exactly one side (unknown to anyone) is fighting for a just cause.
  5.  **Scope:** The disagreement focuses on the moral permissions and liabilities of the *ordinary combatants* described in the central case, acting within *jus in bello* constraints, not on leaders or those violating *in bello* rules.

  **Section 2: The Remaining Disagreement**

  | Crux                                                                 | Traditionalist Formulation                                                                                                  | Revisionist Formulation                                                                                                      | Shared Evidence/Case                                                                                                                               |
  | :------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Symmetry of Permissions?**                                         | Combatants on both sides possess the same moral permissions to use lethal force against enemy combatants.                   | Only combatants fighting for the just cause possess the moral permission to use lethal force against enemy combatants.        | The Central Case: Conscripts on both sides fighting identically within *in bello* constraints, one side just, one unjust, no culpable ignorance. |
  | **Liability of Excused Unjust Combatant?**                           | Combatants fighting for an unjust cause are liable to be killed by enemy combatants, even if they are fully excused.        | Combatants fighting for an unjust cause are *not* liable to be killed if they are fully excused.                             | The Central Case: Unjust combatants are non-culpably ignorant and conscripted (excused), posing a lethal threat while pursuing an unjust aim.      |
  | **Justification Required for Killing?**                              | The just combatant who kills an enemy combatant does not wrong them; no further justification to the victim is required.    | The just combatant who kills an unjust combatant does not wrong them; however, killing an excused unjust combatant requires justification (though it may be overridden). | The Central Case: The act of a just combatant killing an excused unjust combatant.                                                                |
  | **Nature of Excuse (Defeat Responsibility or Only Blame)?**          | Duress and non-culpable ignorance excuse the combatant (negate blameworthiness), but do not necessarily negate liability or make their threat non-responsible. | Duress and non-culpable ignorance can defeat responsibility for the threat posed, making the combatant akin to an innocent instrument, negating liability. | The Central Case: Unjust combatants acting under duress (conscription) and non-culpable ignorance.                                                |
  | **Symmetry of *In Bello* Constraints?**                              | The constraints of proportionality and discrimination apply identically and with the same force to combatants on both sides. | While the *rules* of proportionality and discrimination must be followed by both sides, the *moral weight* of adhering to/violating them may differ based on *ad bellum* status. | The Central Case: Both sides follow identical *in bello* rules. A potential collateral damage event caused identically by each side.               |
  | **Law vs. Morality Division Acceptable?**                            | Yes. The traditionalist symmetry is essential and justified as a matter of the Laws of Armed Conflict (LOAC) for practical reasons, even if revisionist morality is correct. | Yes. LOAC can legitimately adopt a symmetrical *in bello* framework for pragmatic reasons (epistemic limitations, maintaining constraints, reciprocity) even if underlying morality is asymmetrical. | The practical need for clear, enforceable rules in war, distinct from deep moral philosophy.                                                      |
  | **Does Law/Morality Division Resolve the Core Dispute?** | No. It relocates the dispute. The core moral question about individual combatants' permissions and liabilities remains unresolved and significant. | No. It relocates the dispute. The core moral question about individual combatants' permissions and liabilities remains unresolved and significant. | The fundamental disagreement about the moral status of combatants in war persists regardless of LOAC codification.                                 |

  **Section 3: Cruxes, Cases, and Predictions**

  | Crux                                                  | Case/Argument/Consideration                                                                                                 | Traditionalist Prediction                                                                 | Revisionist Prediction                                                                 |
  | :---------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------- |
  | **Does liability to defensive killing require culpability for an unjust threat?** | The Central Case: Is the excused (non-culpable) unjust combatant liable to be killed by the just combatant?                 | **Yes.** Liability stems from posing an objectively unjust threat, irrespective of culpability/excuse. The threat itself grounds liability. | **No.** Liability requires moral responsibility for the threat. Non-culpable ignorance/duress negates responsibility, making liability unjust. |
  | **Do duress and non-culpable ignorance defeat responsibility for posing a threat, or only excuse blame for it?** | The Central Case: Does the conscripted, non-culpably ignorant unjust combatant pose a threat for which they are *responsible*? | **Only excuse blame.** They remain responsible agents posing an unjust threat; their excuse mitigates blame but not liability. | **Defeat responsibility.** They are not responsible for the unjust threat they pose; they are instruments of their state, akin to non-responsible agents. |
  | **What is the basis for *in bello* symmetry (if any)?** | The practical necessity of *jus in bello* constraints: Can effective, reciprocal constraints exist without symmetry?         | **Necessity & Epistemology:** Symmetry is practically necessary and epistemically mandated; soldiers cannot reliably discern *ad bellum* justice mid-combat. | **Pragmatic Compromise:** Symmetry in *rules* is a necessary pragmatic compromise for LOAC, grounded in epistemic limitations and the need for reciprocity, not deep moral symmetry. |

  **Section 4: Verbal vs. Genuine Disagreements**

  1.  **Verbal Disagreement (Partial):** The use of "innocent" is sometimes a source of confusion. Traditionalists often mean "non-threatening" or "civilian," while Revisionists often mean "not responsible for an unjust threat." Both camps agree civilians are generally not liable. The disagreement about whether excused unjust combatants are "innocent" in the Revisionist sense (not responsible) is substantive, but the *word* itself can be ambiguous. Both camps should clarify their usage.
  2.  **Genuine Substantive Disagreements:** The core disagreements outlined in the table are genuine and substantive. They concern:
      *   The fundamental relationship between *jus ad bellum* status and *jus in bello* permissions/liabilities at the individual combatant level.
      *   The grounding of liability (objective threat vs. moral responsibility).
      *   The effect of non-culpable ignorance and duress on responsibility for threats.
      *   The moral foundation of *in bello* constraints.
      *   Whether the practical LOAC symmetry resolves the moral question or merely brackets it.
  3.  **Underlying Metaphysics Acceptance:** A Traditionalist *can* accept the Revisionist's underlying metaphysics (e.g., liability requiring responsibility) and *still* hold that posing an objectively unjust threat *makes* one responsible in the relevant sense, even if excused. Conversely, a Revisionist *can* accept the Traditionalist's focus on the objective threat and *still* hold that non-responsible agents (due to excuse) posing such threats are not liable. The disagreement persists even if metaphysical frameworks are shared; it concerns the *application* of those frameworks to the specific conditions of excused combatants in war. **Neither camp's practical conclusion is strictly entailed by accepting the other's metaphysics; the core normative disagreement about responsibility and liability in these conditions remains.**
