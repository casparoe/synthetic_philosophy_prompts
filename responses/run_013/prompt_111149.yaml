answer: |-
  I think the constraints can be satisfied, but it requires a specific setup where the metric is a *downstream effect* of the goal, and the degradation arises from an unavoidable feedback loop inherent to the system. Here's the case, set in a city public health agency:

  The agency aims to reduce community transmission of a respiratory virus (the goal). They adopt a metric: the *number of confirmed cases reported via the city's public testing sites*. This metric is a downstream effect of transmission—higher transmission typically increases cases, and cases are confirmed via testing. Crucially, it’s not a mere correlate; if transmission drops while everything else is fixed, the metric falls (and vice versa). The agency has one decision: redirect resources from a public awareness campaign to open three new high-capacity testing sites in central locations. They do this solely to improve surveillance, believing early case detection helps target interventions. Staff aren’t incentivized or scored; they just implement the change. Testing is free, accurate, and universally accessible—no noise or sampling issues.

  Unexpectedly, community transmission *increases*. Why? The new sites make testing faster and more convenient. This draws in mildly symptomatic people who previously wouldn’t have bothered, but while waiting in line (often indoors), they expose others to the virus. The testing queues become transmission hubs. The metric *also* rises due to higher testing rates and actual transmission growth. The goal degrades because the decision altered behavior in a way that intensified the very problem the metric was tracking. No one intended this; it emerged from the system’s structure—convenient testing concentrated people in enclosed spaces during a contagious phase.

  Now, applying the four standard explanations:

  1. *Imperfect tracking/selection for error*: Doesn’t apply. The metric *is* a valid downstream effect: reduced transmission *would* lower it if all else were fixed. The error wasn’t in initial tracking; it emerged from the intervention.

  2. *Driving to an untested regime*: Doesn’t apply. The relationship between testing access and transmission *was* stable pre-intervention (testing queues were small and dispersed). The decision didn’t push the system into unknown territory; it amplified an existing, minor factor (low-risk exposure in queues) into a dominant one.

  3. *Moving an effect doesn’t move the cause*: Partially relevant but incomplete. Yes, the metric is an effect, and manipulating it (via testing access) didn’t directly reduce transmission. But the explanation misses why it *harmed* the goal: it assumes manipulating the effect is neutral, but here it created a feedback loop that actively worsened the cause.

  4. *Someone feeding the metric*: Doesn’t apply. No adversary exists. Individuals getting tested weren’t optimizing for the metric; they were seeking personal health reassurance, unaware of agency priorities.

  The case falls outside these. The core failure is a *self-reinforcing loop*: the metric (testing volume) is tied to a process (physical testing) that, when scaled, becomes a vector for the goal’s degradation. The metric isn’t just imperfect; it’s entangled with a physical system where *improving measurement throughput* intensifies transmission risk. The single feature doing the work is this *structural entanglement*—the metric depends on a process that inherently risks exacerbating the goal when amplified.

  If we remove entanglement—say, by using at-home tests—the case collapses into an unremarkable scenario. Suppose the agency mails tests directly to households. Then, increasing testing access doesn’t create crowds; it just measures transmission more accurately. Degradation vanishes, leaving only the benign reality that metrics simplify complex goals.

  The sceptic’s objection would be: "This is still incomplete specification! You didn’t account for the side effects of testing infrastructure. Goodhart’s law adds nothing beyond 'metrics miss hidden consequences.'" But this undersells the insight. In standard incomplete specification, the metric omits independent variables (e.g., using test scores while ignoring student well-being). Here, the metric *itself*—via the process generating it—*directly participates* in degrading the goal. It’s not an oversight in measurement design; it’s a dynamic where optimizing the metric’s *gathering mechanism* inherently conflicts with the goal. Goodhart highlights that some metrics aren’t just incomplete proxies—they can be *active liabilities* when their measurement processes perturb the system.

  Would measuring the goal itself help? Not practically. The goal ("reduce transmission") is unobservable directly; you must use proxies like cases. A "more complete" measure (e.g., adding wastewater data) might help, but it wouldn’t eliminate the core issue. If you *also* measured crowd density at testing sites, you’d still face a trade-off: optimizing for case data (to model outbreaks) might require physical gatherings that harm the goal. The remedy is to *decouple measurement from harmful processes*—but this means abandoning the original metric entirely, not refining it. This case shows that even with exact downstream metrics, Goodhart-like degradation can arise from the *physics of measurement*, not just statistical inadequacy or human gaming.
