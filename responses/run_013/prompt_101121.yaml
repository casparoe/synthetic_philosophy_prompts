prompt: |-
  I edit the science-and-ideas desk at a mid-size magazine, and the call I get wrong most often — maybe twice a month, usually late at night before we go to press — is whether to keep a long-running investigation or series alive or kill it. Some of these have already eaten six months of a reporter's time and a big slice of the budget, and the whole newsroom keeps telling me the money's gone so decide on the future only. Fine, except that advice always feels like its missing something. Sometimes the fact that we've spent so much is telling me something real about the story. Sometimes killing it now blows up a promise to a source, or teaches my reporters that I fold when it gets hard. Sometimes quitting is just panic. Can you turn this into a procedure I can actually run — the questions in order, what counts as a real answer to each, where the procedure stops with a flat kill-it, and where it has to hand the call back to me because it's a values question and not a factual one. I don't want the textbook version where sunk costs are simply irrelevant; I want the honest one, including the arguments that honoring a sunk cost can be defensible (as a commitment device, as a signal to sources and to my own staff, as a way of not being the kind of person who flinches) and how to tell those apart from plain self-justification — and the point where the question becomes which agent we're even talking about, me now or the magazine over years. Run it on three: a big investigation that's expensive, going nowhere, and whose central premise I've quietly stopped believing; a reader-favorite series that loses money every month; and a reporter's four-year pet project where my own history of killing her stories is part of what's actually being decided. Include the case where the procedure tells me something I won't want to hear. Constraints: I have about an hour, no outside help, and I have to justify the decision to the publisher. And tell me what the procedure can't settle — where I'm just going to have to choose.
reasoning: |-
  Okay, the user is an editor at a mid-size magazine who frequently faces tough decisions about whether to continue or kill long-running investigations or series. They need a practical procedure to make these calls, especially under pressure late at night before going to press. 

  First, I need to understand their pain points. They mention that purely financial advice feels incomplete because sunk costs aren't just financial—they represent commitments to sources, team morale, and institutional integrity. The user wants a framework that acknowledges these human and ethical dimensions, not just textbook economics. 

  The three test cases they provided are revealing: 
  - The failing investigation tests how to handle sunk costs when belief in the story evaporates 
  - The beloved money-losing series forces a values debate about audience vs sustainability 
  - The reporter's pet project exposes how personal history complicates objective judgment 

  Key challenges I must address:
  - Separating legitimate commitment signals from ego-driven sunk cost fallacies 
  - Creating clear off-ramps for termination vs values-based judgment calls 
  - Accounting for how past decisions haunt present choices (especially in case 3) 
  - Ensuring the procedure works under time pressure with no outside help 

  I'll structure the framework in phases: 
  First a brutal triage to identify obvious terminators (ethical/legal risks, fundamental premise collapse), then a "story fundamentals" assessment decoupled from costs, then a "costs-as-signal" section where sunk costs get considered as commitment devices, and finally a values clarification stage. The critical move is forcing explicit articulation of what the sunk costs represent—is this about source trust? Newsroom culture?—before allowing any continuation.

  For the test cases: 
  - The failing investigation should die at triage (premise death is fatal) 
  - The beloved series has no triage flags but fails fundamentals; continuation becomes a publisher-level values call about serving readers vs solvency 
  - The reporter's project survives triage and fundamentals, forcing the user to confront whether past kill decisions were situational or pattern behavior—here the procedure would force them to either commit with safeguards or admit systemic lack of trust in the reporter 

  The publisher justification angle is crucial. Each termination decision needs distinct arguments: factual collapse for case 1, sustainability math for case 2, and for case 3—if killed—a frank discussion about reporter-editor fit. The framework must generate these talking points organically.

  Finally, I'll emphasize what the procedure can't resolve: any decision where two valid values conflict (e.g., journalistic ideals vs fiscal reality). There the user must choose their magazine's identity in that moment—and live with being that kind of editor.
answer: |-
  Here's a battle-tested procedure designed for your specific dilemma, acknowledging both rational economics and the messy reality of newsroom commitments. Run these questions in sequence, with strict timeboxes per section (total ~45 mins), leaving 15 mins to formulate your pitch to the publisher.

  **The "Continuation or Kill" Framework: Late-Night Edition**

  **PHASE 0: THE 5-MINUTE TRIAGE (Kill Immediately If Yes)**
  *   **Q1: Is there an imminent legal, ethical, or safety risk (to source, subject, or reporter) that continuing exacerbates?**  
      *   *Real Answer:* Concrete evidence (lawyer warning, credible threat, factual proof of fabrication).
      *   *Decision:* **KILL IMMEDIATELY.** No further discussion. (e.g., Investigation reveals core source lied, making libel likely).
  *   **Q2: Has the absolute core premise of the project fundamentally collapsed?**  
      *   *Real Answer:* Irrefutable evidence the central hypothesis is false *and* irredeemable (e.g., the "smoking gun" document proving the opposite, key source recants with proof it was a hoax).
      *   *Decision:* **KILL IMMEDIATELY.** Sunk costs cannot resurrect a dead premise.

  **PHASE 1: STORY FUNDAMENTALS (10 Mins - Decouple from Cost)**
  *   **Q3: What is the single strongest piece of new, concrete, publishable material obtained in the last month/quarter?**  
      *   *Real Answer:* A specific document, on-record quote, data point, or visual element that directly advances the core narrative *and* meets publication standards. Vague "getting closer" or "promising leads" are **NOT** real answers.
      *   *Significance:* If you can't articulate *one* solid thing recently gained, the project is likely stalled or directionless. Major red flag.
  *   **Q4: What is the *next* concrete, achievable milestone (not a vague endpoint), and what specific, credible actions will achieve it within 2-4 weeks?**  
      *   *Real Answer:* "Secure interview with X (who has agreed in principle)," "Obtain Y document via FOIA appeal (filed date Z)," "Corroborate claim A with source B (who is expecting our call)." Must be specific actions with defined actors and deadlines.
      *   *Significance:* No credible, near-term plan = high risk of indefinite drift. Yellow/Red flag.
  *   **Q5: Does this story still matter *right now* to our core audience, considering the current news cycle and our editorial niche?**  
      *   *Real Answer:* Connection to a demonstrable current event, emerging trend, or enduring local/institutional issue our readers care about *today*. "It's important" isn't enough; "This explains the sudden spike in Z" is better.
      *   *Significance:* Losing relevance erodes justification, especially for expensive projects.

  **PHASE 2: COSTS & COMMITMENTS AS SIGNALS (15 Mins - Where Sunk Costs Matter)**
  *   **Q6: What specific, tangible promise (beyond general confidentiality) have we made to a source that killing this would break? What is the consequence?**  
      *   *Real Answer:* "We promised Source A we'd expose Company B's practice X by end of quarter for their safety," "Source B provided documents contingent on us publishing the full series." Consequence: "Source A loses whistleblower protection," "We lose all future credibility with activist group Y."
      *   *Significance:* Identifies concrete ethical breaches and reputational damage beyond money. Not "it might annoy them."
  *   **Q7: What specific signal will killing/cutting *this project* send to the newsroom *right now*?**  
      *   *Real Answer:* Consider recent context. "After killing 3 projects last month, this signals we only do quick wins," "Killing Jane's project signals we don't back deep work after X years," "Killing the losing series signals we prioritize profit over reader loyalty."
      *   *Significance:* Acknowledges morale, culture, and incentive structures. Is this signal accurate? Is it *needed* (e.g., correcting lax discipline) or *damaging*?
  *   **Q8: Is the 'sunk cost' actually a *commitment device*? Did spending X create an obligation *beyond* the story itself?**  
      *   *Real Answer:* "Yes, because we staked our reputation with source Z on seeing it through," "Yes, because abandoning this specific type of investigation tells the community we won't hold power Y accountable," "Yes, because we publicly announced this series as a major editorial priority." Focus on institutional promises and identity.
      *   *Significance:* Separates defensible commitment (honoring our word as an institution) from pure self-justification ("we spent so much, we *have* to finish"). Does the cost represent a *pledge*?
  *   **Q9: Is my desire to continue/kill driven by avoiding personal discomfort (embarrassment, conflict, admitting error) rather than the project's merits?**  
      *   *Real Answer:* Brutal honesty required. "Yes, killing it makes me look indecisive after backing it," "Yes, continuing avoids a fight with the star reporter," "Yes, killing it feels like giving up and I hate that feeling."
      *   *Significance:* Flags ego-driven decisions masquerading as strategy. Major red flag if the primary driver.

  **PHASE 3: THE ENDGAME (15 Mins - Decision & Rationale)**
  *   **KILL Recommendation Triggers:**
      *   Phase 0 Triage hit (Q1 or Q2).
      *   Phase 1: No concrete recent progress (Q3) AND no credible near-term plan (Q4).
      *   Phase 2: No concrete broken promise (Q6), no damaging signal beyond fiscal prudence (Q7), no valid commitment device (Q8), AND significant ego-driven continuation (Q9).
  *   **CONTINUE (with conditions) Triggers:**
      *   Strong Phase 1 (Clear progress + Credible plan).
      *   AND/OR Strong Phase 2 (Concrete broken promise / Damaging kill signal / Valid commitment device) outweighing Phase 1 weakness.
      *   *Must Define Conditions:* "Continue for 4 weeks ONLY to hit Milestone X (Q4). Re-evaluate on [Date] with this same checklist." "Continue but shift focus to Y smaller deliverable." "Continue but reduce budget/time allocation to Z."
  *   **HAND BACK TO VALUES (Your Call):**
      *   Phase 1 is weak (stalled, vague plan) BUT Phase 2 is strong (concrete broken promise OR continuation is critical for newsroom trust/signal OR valid institutional commitment).
      *   **This is the crux:** Where the *cost represents a value* (our integrity, our promise, our identity) that outweighs the current lack of progress or even profitability. *You* decide what the magazine stands for in this moment.

  **Running the Test Cases:**

  1.  **Big Investigation (Expensive, Going Nowhere, Premise Dead):**
      *   **Phase 0 (Triage):** Q2 - YES, central premise you stopped believing *is* fundamentally collapsed. **KILL IMMEDIATELY.** *Procedure Output: Hard Kill. Justification to Publisher:* "The core allegation was disproven by [Concrete Evidence]. Continuing risks significant legal/reputational harm and wastes resources chasing a false premise. We cut losses to protect the magazine." (This is the answer you might not want to hear, but the procedure forces it).
  2.  **Reader-Favorite Series (Loses Money Monthly):**
      *   **Phase 0:** Passes (No ethical/legal risk or premise collapse).
      *   **Phase 1:**
          *   Q3: Real Answer (e.g., "Consistently high engagement metrics, letters").
          *   Q4: Real Answer (e.g., "Next installment drafted, publish next week" - it's running).
          *   Q5: Real Answer (e.g., "Core audience consistently demands it, defines a section of our brand").
      *   **Phase 2:**
          *   Q6: Probably No ("We promised readers consistency" is weak unless explicitly stated).
          *   Q7: Signal: "Killing signals we prioritize profit over loyal readers / abandon popular features."
          *   Q8: Commitment Device? Maybe ("It's part of our brand promise/identity as serving this audience niche").
          *   Q9: Ego? Maybe (Fear of backlash).
      *   **Phase 3:** **HAND BACK TO VALUES.** Fundamentals (Q3, Q4, Q5) are strong operationally (it works as a series) but the *business model* is flawed. Phase 2 argues for continuation based on audience value/signal/brand. *Your Call:* Is this series core to our *identity* worth subsidizing? Can it be monetized better? If you kill it, Phase 2 (Q7) is the key justification to Publisher: "Despite popularity, the sustained losses are unsustainable. We must reallocate resources to priorities that serve our audience *and* ensure our financial health. We'll replace it with [X]." If you continue: "This series is a cornerstone of reader loyalty and our [X] niche identity. We are exploring [Monetization Strategy] to offset costs, but its value justifies the investment for now."
  3.  **Reporter's Four-Year Pet Project (Your Kill History a Factor):**
      *   **Phase 0:** Passes.
      *   **Phase 1:**
          *   Q3: ? (Requires honest assessment - *is* there recent concrete progress?)
          *   Q4: ? (Is there a *credible*, *near-term* milestone achievable? Or is it always "just needs more time"?)
      *   **Phase 2:**
          *   Q6: ? (Any specific source promises broken? Unlikely, but check).
          *   Q7: **Signal CRITICAL:** "Killing this signals I don't support deep work *and* confirms Jane's fear that I always kill her projects, destroying morale/trust." OR "Continuing signals we tolerate endless projects with no accountability."
          *   Q8: Commitment Device? **Strong Maybe:** "We committed to Jane to see *this specific project* through after past kills / It's part of supporting investigative talent long-term."
          *   Q9: **Ego CRITICAL:** "Am I killing it because it's truly stuck, or because I'm tired of it/doubt Jane due to history? Am I continuing to avoid conflict or prove I'm not 'that editor'?"
      *   **Phase 3:**
          *   If Phase 1 (Q3/Q4) is **WEAK:** **HAND BACK TO VALUES.** The history/personal dynamic (Q7, Q8, Q9) dominates. *Your Call:* Do you invest in Jane *as a reporter* and the magazine's commitment to nurturing talent, despite this project's flaws? Or is this project (and maybe Jane's approach) fundamentally misaligned? Killing requires acknowledging the history: "Despite Jane's dedication, after 4 years and multiple reviews, the project lacks the concrete milestones and publishable progress needed. We cannot justify further resources, though we remain committed to Jane's work on viable projects." Continuing requires safeguards: "Jane has [Specific New Element/Plan]. We commit to [Strict Milestone] by [Date 6-8 weeks max] with [Specific Resource]. If not met, project ends."
          *   If Phase 1 (Q3/Q4) is **STRONG:** **CONTINUE (with conditions)** - the work justifies it, manage the history separately.

  **What the Procedure CAN'T Settle (Where You Just Have to Choose):**

  1.  **The Values Trade-offs:** When Phase 3 forces a "Hand Back to Values," the procedure clarifies the stakes but cannot choose. You must decide: Is the institutional promise/signal/reputation *more important* than the money lost or the lack of recent progress? Is this project *core* to who we are?
  2.  **Personnel Trust:** In the reporter's pet project case, the procedure highlights the conflict but cannot resolve if *you* trust *this reporter* to deliver, or if the magazine should persist *with this person* despite past issues. That's a judgment on character and fit.
  3.  **True Institutional Identity:** Is your magazine the type that sticks with hard promises to sources even when costly? Or the type that pivots ruthlessly for efficiency? The procedure reveals the cost of each choice but can't define your core identity.
  4.  **Weighing Intangibles:** How much is "newsroom morale" worth in dollars? How much is "reader loyalty" for the losing series worth? The procedure forces you to articulate these intangibles but cannot quantify them against budget.

  **Key to Success:**

  *   **Brutal Honesty:** Especially on Q3 (progress), Q4 (plan), and Q9 (ego). No sugarcoating.
  *   **Specificity is King:** Vague answers ("it's important," "we're close") are automatic red/yellow flags. Demand concrete evidence, actions, and consequences.
  *   **Timebox Ruthlessly:** Stick to the 5/10/15/15 structure. The pressure forces clarity.
  *   **Document Answers:** Jot brief notes for each Q. This becomes your justification outline for the publisher.
  *   **"Hand Back to Values" is Valid:** Don't force a false "Kill/Continue" if the core conflict is about who you are. Acknowledge it and make the values call explicitly.

  This procedure forces you to confront the real reasons – factual, financial, ethical, reputational, and psychological – behind the "kill or continue" dilemma. It doesn't eliminate the hard choices, but it ensures you make them with eyes wide open to all dimensions, not just the sunk cost fallacy or the shouting newsroom. Good luck.
