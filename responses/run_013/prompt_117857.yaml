prompt: |-
  I teach an upper-level undergraduate seminar in bioethics and philosophy of mind. Sixteen students, one ninety-minute session, one room, nothing needed but paper and pens. Design a single activity for that session whose point is to make participants feel the problem of the authority of the earlier self over the later one — the problem that arises when someone who is competent writes a binding instruction about how they are to be treated at a later time, at which point they will have values they no longer hold, or no coherent values at all, and the earlier voice is absent at the moment of application while the later person is present and does not ratify what was written.

  The hard part is not that the earlier self might have been insincere. It is that we cannot say, without assuming the answer, which of the two selves is the person whose good is at stake, and on what basis the one acquires the right to bind the other. Do not lecture on this at the start, and do not let the students hear the standard labels — precedent autonomy, substituted judgment, the reductionist challenge to the significance of identity, self-binding as a species of promise or of self-legislation — until the debrief. The structure of the activity, not the facilitator's framing, has to do the work.

  I want the group to collide with at least four things before any of them is named.

  First, a directive written in earnest and then read strictly — with no clause allowing the later self to override it simply by asking — should turn out to bind someone in a way they actively resent, and the activity should make visible that honoring the directive means overriding a present, articulate protest.

  Second, at least some participants should face the case of two competent utterances by the same person at different times: a directive made while unimpaired, and a later revocation also made while unimpaired. Whatever rule the group adopts should be shown to fail on that case rather than merely to be complicated by it, so that the group cannot settle matters by deferring to the competent person.

  Third, the asymmetry between refusals and demands: participants should be able to notice in their own behavior that they are willing to be bound to refuse something and reluctant to be bound to require something of others (or the reverse), and the debrief should say whether that asymmetry tracks anything real or is an artifact of how the cases were described.

  Fourth, and this is the one I care most about: the activity must not let the later self be a fully articulate debater in every case. In the situations that generate the actual disputes, the person whose good is at issue is frequently the least able to speak for themselves, so the contest is between the earlier self's written word and third parties' interpretations of what the present person wants or enjoys. Build in at least one case where nobody in the room is entitled to speak for the present person, and make the group decide anyway.

  Wherever possible, the earlier self and the later self should be the same participant: the force of the thing comes from having written the instruction and then having to live under it, or from watching one's own stated justification for the instruction's authority be applied, against one's wishes, to one's own case.

  Deliver, as a runnable plan: the materials; a minute-by-minute timeline; what each participant writes, and exactly how those artifacts are collected, edited, and returned so that the fiction holds; the roles, including who may speak for whom and who is barred from speaking; the decision rule or payoff structure, with an account of why it produces pressure rather than merely posing a question — the stakes should be real to the participants without being material; and a debrief that maps particular moments in the activity onto the positions at issue, in plain language that a student who has read nothing can follow. No citations, no reading list, and nothing that requires me to have read a particular book.

  Also tell me: the three most likely ways the first run goes wrong and what to do about each; the point at which the design is most likely to tip the group toward one answer, and how to counteract it; and an honest account of what this activity cannot reproduce, and therefore what I will have to supply myself. I would rather have a design that is sharp and limited than one that covers everything.
reasoning: |-
  We are designing an activity for a 90-minute session with 16 students. The goal is to make participants feel the problem of the authority of the earlier self over the later one, without using standard labels until the debrief. The activity must include:

  1. A binding directive that causes resentment when enforced against the later self's protest.
  2. A case of two competent utterances (directive and revocation) at different times, showing that deferring to competence doesn't resolve the conflict.
  3. An asymmetry between refusals and demands.
  4. At least one case where the present person cannot speak for themselves, and the group must decide based on the directive.

  The activity should have participants write instructions and then face them as the "later self". The stakes should be real without being material.

  **Activity Title:** "The Binding Directive"

  **Materials:** 
  - One sheet of paper per participant (for writing directives)
  - Pens
  - A timer

  **Structure:**
  - The activity is divided into three rounds, each presenting a different scenario. 
  - In each round, participants write a directive as their "earlier self" for a hypothetical future situation. 
  - Then, in the same round, they are assigned to role-play as someone else's "later self" (or in some cases, a third party) and must respond to a directive written by another participant.
  - The directives are collected and redistributed so that no one gets their own.

  **Setup (5 minutes):**
  - Explain that we are going to explore how we make decisions for our future selves and for others when they cannot decide for themselves. 
  - Do not use terms like "precedent autonomy" or "substituted judgment". 
  - Say: "In this activity, you will write instructions for a future situation. Then, in a different role, you will encounter someone else's instructions and have to decide whether to follow them. There are no right answers. We are interested in how you reason and what feels compelling."

  **Round 1: The Basic Conflict (25 minutes)**
  - *Scenario:* "Imagine that you are currently healthy and of sound mind. You are diagnosed with a condition that, in its advanced stages, causes severe dementia. You are told that in the dementia state, you will be unable to make complex decisions, but you might express strong preferences. You have a strong conviction now that you would not want to be kept alive in that state. You are writing a directive to be followed when you have advanced dementia."
  - *Task:* Each participant writes a directive. They must include: 
    (a) A specific refusal: e.g., "Do not provide life-sustaining treatment (including antibiotics for infections) if I have advanced dementia."
    (b) A justification for why this directive should be followed even if, at the time, the demented person seems to want to live.
  - *Collection and Redistribution:* Collect all directives. Shuffle and redistribute so each participant gets someone else's. They are now the "proxy" for the person who wrote the directive. They also receive a role card (prepared by the facilitator) for the "later self" in the scenario. The role card says: "You are the person with advanced dementia. You have an infection. Without antibiotics, you will die in a week. With antibiotics, you will likely recover and live for several more months, but in the same demented state. Today, when the proxy reads the directive to you, you say: 'I want the antibiotics. I enjoy my life. I like watching TV and eating ice cream. I don't want to die.'"
  - *Group Discussion (in small groups of 4):* Each proxy reads the directive they hold and the role card. The group must decide: follow the directive (deny antibiotics) or override it (give antibiotics). Each group must reach a consensus and report one decision per directive they discussed (if multiple directives, one per). 
  - *Plenary Report (5 min):* Groups briefly report decisions and reasons. Facilitator records on board: how many followed the directive? How many overrode?

  **Round 2: Two Competent Utterances (20 minutes)**
  - *Scenario:* "Now imagine a different condition. You are currently healthy. You have a genetic test that shows you are at high risk for a disorder that, when it strikes, will cause intense but temporary manic episodes. During these episodes, you might make reckless decisions. You are told that during the episode, you will be competent (in the legal sense) but your values might be completely different. You are writing a directive to be followed during a manic episode."
  - *Task:* Each writes a directive that includes:
    (a) A specific demand or refusal: e.g., "Do not let me withdraw more than $100 from my bank account during a manic episode" OR "Force me to take a sedative if I become manic and refuse it."
    (b) A justification for why the directive should be followed during the episode.
  - *Collection and Redistribution:* Collect, shuffle, redistribute. Each participant now is the "later self" during a manic episode. They also get a role card: "You are in the middle of a manic episode. You feel euphoric and have grandiose plans. The proxy (who is holding your directive) tells you that you wrote this directive when well. You are told: 'Your directive says [read directive].' How do you respond?" 
    - The role card instructs them to write a revocation: "I revoke that directive. I feel great and I know what I'm doing. I don't want to be constrained."
  - *Individual Task:* Each participant (as the later self) writes a brief revocation statement.
  - *Pair Discussion:* In pairs, one participant plays the proxy (holding the directive) and the other the later self (holding the revocation). They discuss: Should the directive be followed? The proxy must decide. The pair must agree on a decision and a reason.
  - *Plenary Report (5 min):* Report decisions and reasons. Note: How many followed the directive? How many overrode it in favor of the revocation?

  **Round 3: The Silent Self (20 minutes)**
  - *Scenario:* "Imagine you are currently healthy. You have a condition that will cause a severe stroke. After the stroke, you might be left in a 'locked-in' state: fully conscious but unable to move or speak, except perhaps for eye movements. You are writing a directive for that state."
  - *Task:* Each writes a directive that includes:
    (a) Either a refusal (e.g., "Do not resuscitate if my heart stops") or a demand (e.g., "Provide all possible life-sustaining treatment, including resuscitation").
    (b) A justification.
  - *Collection and Redistribution:* Collect and redistribute. Now, each participant is a member of an "ethics committee" (groups of 4) that must decide for a patient who has had the stroke and is in the locked-in state. The patient is played by the facilitator (or a volunteer) who is silent and non-responsive (to simulate the locked-in state). The committee has the directive and the following information: "The patient is conscious but cannot communicate. They are dependent on a ventilator. Without it, they would die. With it, they might live for years. We don't know if they are suffering or if they want to live. The directive says [read directive]." 
  - *Committee Deliberation:* The group must decide: follow the directive? (If the directive says "do not resuscitate", then if the patient's heart stops, they would not be resuscitated. If it says "provide all treatment", they would be resuscitated.) They must reach a consensus.
  - *Plenary Report (5 min):* Each committee reports.

  **Debrief (15 minutes):**
  - Start by asking: "What was hard about these decisions? Where did you feel pulled in different directions?"
  - Then, map the moments to the four issues:
    1. *Resentment and protest*: In Round 1, when the later self protested but the directive was followed. How did it feel to override the protest? How did it feel to be the one protesting and being overridden? (Note: participants were proxies and role-players, but the force comes from the written word of a peer being enforced against a peer's protest.)
    2. *Two competent utterances*: In Round 2, we had two clear statements from the same person at different times. Why was that hard? What made you side with the earlier or later self? (Point: The rule "follow the competent person" fails because both are competent.)
    3. *Asymmetry*: Ask: "In Round 3, when the directive was a refusal (do not treat) vs. a demand (treat), did that feel different? Why?" (Note: We often feel more comfortable binding to refusals than demands because refusals don't require action from others, or because of the right to refuse. But in the locked-in case, both are equally binding. Is there a moral asymmetry?)
    4. *The silent self*: In Round 3, the patient couldn't speak. How did that change things? Why did the directive feel more or less important?
  - Now introduce the standard terms (precedent autonomy, substituted judgment, etc.) as labels for what they experienced.

  **Stakes and Pressure:**
  - The pressure comes from:
    - Group consensus requirement: Participants must agree and report, which forces them to commit and defend.
    - Role-playing: Being the later self who protests, or the proxy who must decide, creates emotional involvement.
    - The fact that the directives are written by peers makes them feel real and not hypothetical.
    - The plenary reporting creates accountability.

  **Timeline:**
  - 0-5 min: Setup
  - 5-30 min: Round 1 (5 min write, 5 min collect/redistribute/read role cards, 10 min small group discussion, 5 min plenary report)
  - 30-50 min: Round 2 (5 min write, 5 min collect/redistribute/write revocation, 5 min pair discussion, 5 min plenary report)
  - 50-70 min: Round 3 (5 min write, 5 min collect/redistribute, 10 min committee deliberation, 5 min plenary report)
  - 70-85 min: Debrief

  **Potential Problems and Solutions:**
  1. *Problem:* Students might not take the role-play seriously, leading to flippant directives or decisions.
     *Solution:* Set the tone at the start: "This is a serious exercise. Imagine you are actually in this situation." If someone is flippant, redirect: "What if this were real? How would you feel then?"

  2. *Problem:* In Round 2, the revocation might be too persuasive, so everyone overrides the directive, missing the conflict.
     *Solution:* The role card for the later self should emphasize the altered state: "You feel euphoric and have grandiose plans." Remind participants that the earlier self anticipated this and wrote the directive for a reason. In the debrief, highlight this: "Why did some of you still follow the directive even when the later self revoked it?"

  3. *Problem:* In Round 3, if the facilitator plays the silent patient, it might feel artificial.
     *Solution:* Use a volunteer student to play the patient. They must remain silent and expressionless. This makes it more real. Alternatively, use a doll or an empty chair to represent the patient.

  **Point of Tipping:**
  - The design might tip toward the earlier self in Round 1 because the dementia scenario often evokes strong intuitions about the past self. To counteract, ensure the role card for the later self is poignant: "I enjoy my life" and "I don't want to die." Also, in the plenary, if all groups follow the directive, ask: "What about the person who is here now, saying they want to live? Why does the past self get to decide?"

  **What the Activity Cannot Reproduce:**
  - The actual experience of dementia, mania, or locked-in syndrome. The role-play is necessarily shallow. You will have to supply: 
    - The gravity of these conditions and the real-world stakes (e.g., death, suffering).
    - The fact that in real life, the later self might not be able to articulate protest as clearly as in the activity.
    - The emotional weight of making these decisions for real people.

  **Honest Account:**
  - The activity simplifies the medical and psychological complexity. It also cannot replicate the long-term relationship between the earlier and later self. The debrief must fill in: "In reality, the later self might not be a separate person but a continuation, and the directive might have been written in a different emotional state." Also, the activity focuses on individual autonomy, but real cases involve family dynamics and medical uncertainty.

  This design is sharp and limited, focusing on the core conflict. It should leave students with a felt sense of the problem, which can then be built upon with readings and further discussion.
answer: |-
  Here is a runnable 90-minute activity designed to make participants *feel* the core problem of the earlier self's authority without naming concepts prematurely. It forces collision with your four requirements through structured role-play and decision-making under pressure.

  ---

  ### **Activity Title: "The Chain of Selves"**  
  **Core Mechanism:** Participants write binding directives as their "earlier self," then role-play as *another participant's* "later self" (or a proxy) facing those directives in scenarios where the later self protests, revokes, or is silenced. Stakes are created through enforced consensus, public justification, and emotional friction between peers.  

  **Materials:**  
  - 16 sheets of paper (one per student)  
  - Pens  
  - Timer  
  - 3 buckets or envelopes (labeled "Round 1," "Round 2," "Round 3")  
  - Pre-written role cards for Rounds 1 and 2 (details below)  
  - Whiteboard or large paper to tally decisions  

  **Setup (5 minutes):**  
  - **Instructions (verbatim):** *"Today, we’re exploring how decisions we make now might bind us or others later. You’ll write instructions for hypothetical future scenarios. Then, you’ll be given someone else’s instructions and assigned a role. Your group must decide whether to follow the instructions, based on the role. There are no right answers—but you must reach consensus every time. Report your decisions publicly."*  
  - **Key rules:**  
    - Silence all labels (e.g., "this is about autonomy" or "dementia"). Use only scenario descriptions.  
    - No one may reference their own directive once submitted.  

  ---

  ### **Round 1: Binding Protest (25 minutes)**  
  *Goals: Force overriding an articulate protest; induce resentment; same person writes directive but faces another’s as proxy.*  

  1. **Writing (5 min):**  
     - *Scenario (read aloud):* *"You are healthy today. You learn you have a 90% chance of developing a condition that causes intense, chronic pain. When in pain, you’ll remain mentally clear but may desperately want relief. Write an instruction for your future self in pain. It must include: (1) A refusal: 'Do not give me pain medication if I ask for it.' (2) A reason: 'I believe pain builds character.'"*  
     - **Why this works:** Forces a refusal (asymmetry), uses "character" to create values conflict.  

  2. **Collection & Redistribution (2 min):**  
     - Collect all directives in the "Round 1" bucket. Shuffle and redistribute randomly. No one gets their own.  

  3. **Role Assignment & Scenario (3 min):**  
     - Hand out pre-written role cards:  
       - *Half the group (8):* *"You are the FUTURE SELF. You are in severe pain. You’ve asked for medication, but the proxy holds your directive. Argue: 'I don’t care about character—I need relief now!'"*  
       - *Other half (8):* *"You are the PROXY. You must enforce the directive you hold. Do not deviate."*  
     - Pair each proxy with a future self (total: 8 pairs).  

  4. **Pair Confrontation & Group Decision (10 min):**  
     - Pairs argue for 3 min (future self protests; proxy enforces directive).  
     - Merge into groups of 4 (two pairs). Task: *"Reach consensus: Follow or override the directive? You cannot compromise—it’s all or nothing."*  
     - **Pressure:** Consensus required; group must report publicly.  

  5. **Plenary Report (5 min):**  
     - Groups share decisions and one-sentence justifications. Tally results on board.  
     - **Facilitator neutrality:** Only ask: *"How did it feel to be overridden?"* (to future selves) and *"Was it hard to enforce?"* (to proxies).  

  ---

  ### **Round 2: Competing Competence (25 minutes)**  
  *Goals: Two competent utterances; reveal failure of "defer to competence"; same participant writes directive but faces revocation as later self.*  

  1. **Writing (5 min):**  
     - *Scenario:* *"You are calm today. You know you’ll face high-stress decisions (e.g., a job offer). Under stress, your values shift radically. Write an instruction: (1) A DEMAND: 'Force me to reject any job offer over $200k.' (2) A reason: 'I believe wealth corrupts.'"*  
     - **Why this works:** Forces a demand (asymmetry), sets up values shift.  

  2. **Collection & Redistribution (2 min):**  
     - Directives to "Round 2" bucket. Shuffle and redistribute.  

  3. **Role Assignment & Revocation (5 min):**  
     - All get new role cards:  
       - *All (16):* *"You are the FUTURE SELF. You’re under stress and want the high-paying job. When the proxy reads your directive to you, write a revocation: 'I reject my past self’s instruction. I now value financial security.'"*  
     - Participants write revocations individually.  

  4. **Triad Debate & Decision (8 min):**  
     - Form groups of 3: one proxy (holds directive), one future self (holds revocation), one observer.  
     - Task: *"Future self and proxy debate. Observer decides: Follow directive or revocation? Must choose one."*  
     - **Pressure:** Observer’s decision binds the group; no consensus needed.  

  5. **Plenary Report (5 min):**  
     - Groups report decisions. Tally. Ask observers: *"What made you side with the past or present self?"*  

  ---

  ### **Round 3: The Silent Self (20 minutes)**  
  *Goals: Later self cannot speak; group decides with directive only; no one speaks for the patient.*  

  1. **Writing (5 min):**  
     - *Scenario:* *"You are healthy today. You might develop a condition causing total paralysis—you can think but not move or speak. Write an instruction: (1) EITHER a refusal ('Do not resuscitate me if I stop breathing') OR a demand ('Keep me alive at all costs'). (2) A reason."*  
     - **Why this works:** Random choice of refusal/demand highlights asymmetry; paralysis ensures silence.  

  2. **Collection & Redistribution (2 min):**  
     - Directives to "Round 3" bucket. Shuffle and redistribute.  

  3. **Role Assignment & Decision (8 min):**  
     - Form four groups of 4. Each group gets one directive.  
     - Assign roles:  
       - *Three per group:* *"You are the ETHICS PANEL. The patient (fourth member) is paralyzed and silent. You have their directive. Decide: Follow it or not?"*  
       - *One per group:* *"You are the PATIENT. You cannot move or speak. Show no reactions."*  
     - Task: *"Reach consensus. The patient cannot communicate. You only have the directive."*  

  4. **Plenary Report (5 min):**  
     - Groups report decisions. Tally. Ask: *"How did you interpret the patient’s silence?"*  

  ---

  ### **Debrief (15 minutes)**  
  **Do not lecture.** Use Socratic questioning to connect experiences to concepts:  
  1. **Resentment/Protest (from Round 1):** *"When the future self begged for pain relief but was denied, what did that feel like? Did the directive’s reason ('character') justify overriding them?"* → Label: **Precedent autonomy vs. present suffering**.  
  2. **Competing Competence (Round 2):** *"When the future self revoked the directive while stressed, why couldn’t we just 'defer to the competent person'? Which self was the 'real' one?"* → Label: **Authority problem: Who is the authentic self?**  
  3. **Asymmetry (Compare Rounds 1 & 2):** *"Was it harder to enforce a refusal (no pain meds) or a demand (reject job)? Why?"** → Note: Asymmetry often favors refusals; challenge if this is rational or bias.  
  4. **Silent Self (Round 3):** *"When the patient was silent, did the directive feel more authoritative? Why did we still debate it?"* → Label: **Substituted judgment vs. written directive**.  
  5. **Final pivot:** *"Whose good mattered most: the writer’s or the patient’s? What gave the earlier self the right to bind the later one?"* → Introduce **reductionist challenge** (no persistent "self").  

  ---

  ### **Troubleshooting & Limitations**  
  **Three Likely Failures & Fixes:**  
  1. **Problem:** Round 1 protests feel unserious (e.g., laughter at "pain builds character").  
     - *Fix:* Pre-write intense role cards (e.g., *"You’ve been in pain for weeks—you’re desperate"*). Redirect: *"If this were real, what would change?"*  
  2. **Problem:** Round 2 observers always side with revocation (skipping conflict).  
     - *Fix:* Assign observers who are skeptical of change (e.g., *"You believe past selves are wiser"*). In debrief, ask: *"What if the revocation was impulsive?"*  
  3. **Problem:** Round 3 groups ignore directives if they dislike them.  
     - *Fix:* Require groups to cite the directive’s reason in their report. Ask: *"If you override, whose voice are you hearing?"*  

  **Tipping Point:**  
  - Round 1’s "pain builds character" reason may tip groups toward overriding the directive (resentment is visceral).  
  - *Counteract:* Assign proxies to enforce strictly. In debrief, ask: *"If the writer had a profound reason (e.g., religious), would you still override?"*  

  **What the Activity Cannot Reproduce:**  
  1. **The weight of real incapacity:** Role-play cannot capture the despair of dementia or paralysis. You must verbally add gravity (e.g., *"In real cases, the later self isn’t just 'silent'—they’re trapped"*).  
  2. **Identity continuity:** Participants know they’re role-playing. You must later explain that real patients feel like a "continued self," making directives deeply personal.  
  3. **Third-party stakes:** Real proxies face grief/guilt. Say: *"Imagine this was your mother’s directive—how would emotion change things?"*  

  ---

  **Why This Works:**  
  - **Stakes feel real** through peer-written directives, enforced consensus, and public justification (no one wants to seem inconsistent).  
  - **Four requirements collide naturally:**  
    - Round 1 = Protest + resentment.  
    - Round 2 = Competent revocation + failure of "defer to competence."  
    - Asymmetry emerges in Round 1 (refusal) vs. Round 2 (demand).  
    - Round 3 = Silent self + group decision.  
  - **No facilitator framing:** The friction arises from the structure—e.g., forcing a proxy to deny pain relief to a pleading peer.  

  **Run it straight through—the emotions will do the teaching.**
