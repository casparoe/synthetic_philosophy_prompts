answer: |-
  Here is a teaching plan designed for your constraints, focused on conceptual architecture, preempting analytic pitfalls, and enabling application. The core strategy is to **frame the tetralemma as a diagnostic tool for detecting reification, not a positive metaphysical doctrine or logical system.**

  **Confidence:** 85%. The sequence tightly links concepts to block common misreadings, and the university example avoids reductionist traps while being relatable. The weakest point is Step 3 (Tetralemma Application) – ensuring students *feel* the force of rejecting all corners without sliding into nihilism or contradiction requires careful facilitation (see below).

  ---

  ### Teaching Plan: Nāgārjuna's Tetralemma in 90 Minutes

  **Core Objective:** Students will be able to *apply* the tetralemma structure to identify and de-reify claims of intrinsic nature (*svabhāva*) in a given phenomenon, understanding emptiness (*śūnyatā*) as the absence of such intrinsic nature, not non-existence.

  **Key Constraint Avoided:** No appeal to "different logic." The tetralemma is presented as exposing *conceptual incoherence* inherent in presupposing *svabhāva*, not endorsing true contradictions.

  ---

  #### 1. **The Problem: Intrinsic Nature (Svabhāva) (15 min)**
      *   **Start Here:** "Imagine a property so fundamental to a thing that it makes the thing *what it is*, independently of anything else – its parts, its causes, its functions, our concepts, or its relationships. This is *svabhāva*: intrinsic nature, own-being, essence. *Not* just essential properties in a relational sense (like 'water is essentially H₂O'), but existence *from its own side*, self-defining, independent, unchanging in its core."
      *   **Why it Matters:** "Much of our metaphysical reasoning, consciously or not, *assumes* things have this kind of intrinsic nature. We search for it, define things by it, argue over it. Nāgārjuna's target is this presupposition."
      *   **Audience Hook:** "Think about debates in metaphysics: What is the fundamental substance? What is personal identity? What makes an artifact *that* artifact? The intuition driving many positions is the search for (or denial of) some core, independent *thisness*." (*Plant the seed: This assumption is the root of metaphysical trouble.*)
      *   **Crucial Pre-emption:** Head off "Emptiness=Nihilism" *here*. "If we discover something *lacks* this hypothesized intrinsic nature, does that mean it doesn't *exist*? Not necessarily. It might exist *differently*. That's the question."

  #### 2. **The Tool: Introducing the Tetralemma (Catuṣkoṭi) - Structure & Purpose (10 min)**
      *   **Present the Form:** "Nāgārjuna uses a four-fold schema (tetralemma) to investigate claims about *svabhāva* concerning a phenomenon X and a property/state P: 1. X is P. 2. X is not-P. 3. X is both P and not-P. 4. X is neither P nor not-P."
      *   **Frame as Diagnostic:** "This is *not* a list of possible truth values. It's a *test*. We systematically ask: 'Can P (or not-P, etc.) be found to be an *intrinsic*, *independent* property of X?' The four corners exhaust the logical possibilities for how P could relate to X *if X had svabhāva*."
      *   **Emphasize the Target:** "The tetralemma's power comes from applying it *specifically to questions probing for intrinsic nature*. Applying it to mundane, non-essential properties won't yield the same result." (*Pre-empts seeing it as a universal logical stunt*).
      *   **Goal:** "The aim is to see if *any* of these positions holds up under analysis *without relying on the concept of svabhāva*. If all four fail, what does that tell us about the *question itself* and our underlying assumption?"

  #### 3. **The Example: Applying the Tetralemma to "The University" (25 min)**
      *   **Why "The University" Works:**
          *   **Stake & Relatability:** Grad students have a direct, complex relationship with their university. It feels real and consequential.
          *   **Avoids Reductionism:** A university is *not* intuitively *just* its parts (buildings, people, rules). Its identity involves purpose, history, recognition, function – resisting easy elimination or reduction to components. (*Blocks reductionist/eliminativist moral*).
          *   **Lacks Obvious Essence:** There's no single, uncontested, independent "thing" that *is* the university unambiguously.
      *   **The Question:** "Does 'The University' possess *svabhāva*? Let's probe using the tetralemma with the property '**Independently Existing Entity**' (IEE). Can we find an intrinsic 'university-ness' existing independently?"
      *   **Walk the Corners:**
          1.  **Is the University an IEE?** (Point to admin building? "This is it?" But it's bricks/mortar. Point to the charter? Ink on paper. Point to the faculty? Individuals. Point to the 'idea'? Depends on instantiation. *Reject*: No core *thing* found *in* the university itself, independent of parts, function, designation).
          2.  **Is the University *not* an IEE?** (But it clearly functions! Degrees are awarded, research happens, salaries paid. It has causal power. To say it simply doesn't exist ignores this reality. *Reject*: Denial doesn't fit our experience/conventions).
          3.  **Is it *both* an IEE and *not* an IEE?** (Doesn't resolve the contradiction inherent in #1 and #2; just combines their problems. Where is this magical entity that both has and lacks independent existence? *Reject*: Incoherent).
          4.  **Is it *neither* an IEE nor *not* an IEE?** (This seems like a dodge. We *use* the concept, it functions conventionally. It's not utterly non-existent (#2 is wrong). But we also can't find its essence (#1 is wrong). *Reject*: Still presupposes the question of IEE makes sense; fails to account for its conventional functionality *without* essence).
      *   **The Lesson from the Example:** "All four positions fail *because they all presuppose that 'the university' must either have or lack intrinsic, independent existence (IEE/svabhāva).* The rejection shows the *presupposition itself* is flawed. The university *lacks svabhāva* – it is 'empty' (*śūnya*)."
      *   **Blocking Misconceptions *During*:**
          *   **Not Nihilism:** "Does this mean the university doesn't exist? No! It *does* exist dependently – on its parts, its history, its legal status, its functions, our collective activities and concepts ('dependent origination'). 'Empty' means empty *of svabhāva*, not empty of existence or function." (*Pre-empts nihilism during the rejection of corners, especially #2 & #4*).
          *   **Not Idealism:** "Is it 'just in our minds'? The buildings are physical, the people are biological. But its *status as 'university'* arises dependently, including on our concepts and conventions. It's not *only* mental, but its identity isn't *independent* of mentality/social agreement." (*Pre-empts mind-only during dependent origination gloss*).
          *   **Not Contradictory Reality:** "Are we saying reality is contradictory? *No.* We're saying the *attempt to assign intrinsic nature (IEE)* leads to contradictions. The tetralemma exposes the *incoherence of the assumption*, not a positive doctrine about contradictions in the world. The university functions *without* being an IEE." (*Critical pre-emption during summary*).

  #### 4. **The Framework: Two Truths & Dependent Origination (15 min)**
      *   **Introduce *Now*:** "So how *does* the university exist? This is where the Two Truths (*satyadvaya*) and Dependent Origination (*pratītyasamutpāda*) earn their keep."
      *   **Conventional Truth (*saṃvṛti-satya*):** "The university exists conventionally. We validly designate it, interact with it, it has effects. 'University' is a useful label for a complex, interdependent web of causes, conditions, parts, functions, and conventions. This is the level of everyday reality and pragmatic function." (Link back to the university functioning despite lacking svabhāva).
      *   **Ultimate Truth (*paramārtha-satya*):** "The ultimate truth about the university is that it lacks *svabhāva*. It is empty. This isn't a *higher* reality; it's the correct understanding *of* conventional reality – seeing its dependent nature." (Emphasize: Ultimate truth is *about* the conventional, not separate).
      *   **Dependent Origination = Emptiness:** "To be dependently originated (to arise based on causes, conditions, parts, concepts) *is* to be empty of intrinsic nature. They are two sides of the same coin. The university exists *precisely because* it is empty. If it had svabhāva, it couldn't depend on anything, change, or function in the world." (*Pre-empts "just causation" by tying it inextricably to emptiness and contrasting with svabhāva*).
      *   **Tetralemma's Role:** "The tetralemma's rejection of all corners at the ultimate level clears the way for understanding dependent origination at the conventional level. It removes the distorting lens of *svabhāva*."

  #### 5. **Addressing Key Misconceptions & Self-Refutation (10 min)**
      *   **Fourth Corner ≠ Third Value/Ineffable Both-And:** "Corner 4 isn't a mystical state or a new truth value. Its rejection shows that trying to *avoid* the question of essence/not-essence by saying 'neither' still operates within the *framework* assuming essence must be affirmable or deniable. The tetralemma rejects the *framework*, not by asserting a fifth option, but by showing the question itself is malformed when seeking svabhāva." (Pre-empted by framing in Step 2 and the example's analysis of #4).
      *   **Tetralemma as Self-Refuting?** "Is Nāgārjuna asserting the tetralemma as his *own thesis*? No. He uses it as a *reductio ad absurdum* against the opponent's assumption of *svabhāva*. His 'position' is the negation of that assumption (emptiness), which is itself not a positive essence or intrinsic nature. Emptiness is empty too – it's a corrective lens, not a new thing to grasp. The tetralemma is a tool, not a dogma." (*Flag: This interpretation avoids attributing a positive thesis to Nāgārjuna, a contested point, but is pedagogically necessary here. State: "Many scholars debate Nāgārjuna's own stance; for today, we're focusing on the logical move he makes against *svabhāva*."*)

  #### 6. **The Check: Application Task (10 min)**
      *   **Task:** "Pair up. Pick *one* phenomenon familiar to you both: a nation, a corporation, a scientific theory, a social norm, a cloud. *Do not pick a simple physical object (e.g., a table) or a person (too complex for now).* Briefly apply the tetralemma *specifically to the question*: 'Does [X] possess intrinsic nature (svabhāva) as an Independently Existing Entity?' Walk through the four corners concisely. What does the rejection of all four suggest?"
      *   **Why it Works:** This requires *application* of the structure to a new case, probing for *svabhāva*. It fails for the student who only learned "all four are rejected" if they:
          1.  Cannot identify a plausible question probing for *svabhāva*.
          2.  Apply it to a non-essential property (e.g., "Is the cloud white?").
          3.  Conclude *only* "it has no essence" without connecting it to dependent origination/conventional existence (nihilism trap).
          4.  Interpret the rejection as meaning the phenomenon is contradictory *in reality*.
      *   **Listen For:** Correct identification of a *svabhāva*-probing question; coherent (if brief) rejection of corners based on dependence; concluding lack of intrinsic nature *implies* dependent origination, not non-existence. Debrief 1-2 examples.

  #### 7. **Explicit Omissions (5 min - While wrapping up)**
      *   "Out loud: What we *haven't* covered today: The historical context of Nāgārjuna, debates with other Buddhist schools, the full ethical/soteriological implications of emptiness, comparisons to Western skepticism or deconstruction, detailed scholarly disputes about interpreting specific verses, or the development of Madhyamaka after Nāgārjuna. Our focus was purely on the *logical architecture* of the tetralemma as a tool against *svabhāva* and the core concepts of emptiness and the two truths."

  ---

  **Weakest Point (Confidence Dip): Step 3 - Tetralemma Application to "The University".**
  *   **Why:** Getting students to genuinely feel the force of rejecting *all four corners* without interpreting it as nihilism ("so it doesn't exist!") or as endorsing true contradictions ("so reality is illogical!") is delicate. The university example is good, but the *facilitation* is key.
  *   **Mitigation:**
      1.  **Emphasize Rejection of the *Presupposition*:** Constantly reiterate: "We're not finding contradictions *in the university*; we're finding that the *question* 'Does it have intrinsic existence?' *forces us into* contradictions or dead ends because the assumption is wrong."
      2.  **Stress Conventional Function:** After each rejection, immediately ask: "But does the university *work*? Can we still find the library? Pay fees?" Anchor the conventional reality.
      3.  **Pre-emptive Language:** Use phrases like "the search for an independent essence fails," not "the university is contradictory." Say "the *position* is incoherent," not "the *thing* is incoherent."
      4.  **Quick Check:** After rejecting all four, ask: "So, is the university now abolished? Can you still cash your stipend check? What does this actually change?" Force the connection to conventional functionality.

  This plan provides a clear conceptual sequence, uses a robust contemporary example, pre-empts major misconceptions contextually, includes an application check, and explicitly bounds the scope. It frames the tetralemma as a critical tool within an analytic-friendly framework focused on conceptual coherence and the rejection of reification.
