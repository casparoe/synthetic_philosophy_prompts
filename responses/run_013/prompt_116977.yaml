  ### Decision Tree: What is it for a Kind to be Socially Constructed?

  **Tree Structure**  
  The tree branches on diagnostic questions, each answerable without prior commitment to a position. Nodes are numbered for reference. Positions appear at leaves, with normative branches (arbitrariness and reform) appended to descriptive leaves. Total: 10 internal nodes, 10 leaves.

  ---

  #### Internal Nodes (Diagnostic Questions)
  1. **Is the kind's existence or membership *causally independent* of human practices?**  
     (i.e., would it exist or have members if humans disappeared?)  
     - **No** → Node 2  
     - **Yes** → Node 3  

  2. **Is membership fixed by *social attitudes* (e.g., beliefs, agreements) rather than natural features?**  
     (i.e., does being a member depend on collective acceptance or assignment?)  
     - **Yes** → Node 4  
     - **No** → Node 5  

  3. **Are the *boundaries* of the kind (e.g., criteria for membership) set by social practices?**  
     (i.e., are the rules for inclusion/exclusion human-made?)  
     - **Yes** → Node 6  
     - **No** → **Leaf: Natural Realism**  

  4. **Does *classifying* something as a member change its properties or behavior?**  
     (i.e., is the kind "interactive"?)  
     - **Yes** → **Leaf: Looping Kinds**  
     - **No** → **Leaf: Institutional Facts**  

  5. **Do social practices *cause* members to develop the features used to classify them?**  
     (i.e., does society produce the traits defining membership?)  
     - **Yes** → **Leaf: Causal Constructionism**  
     - **No** → *Gap* (Incoherent: if membership isn’t natural or socially caused, it can’t exist)  

  6. **Does classifying members *change their properties or behavior*?**  
     - **Yes** → **Leaf: Interactive Boundary Constructivism**  
     - **No** → **Leaf: Non-Interactive Boundary Constructivism**  

  7. **Is the kind *arbitrary*?**  
     (i.e., could viable alternatives exist with equal claim to reality?)  
     - **Yes** → Node 8  
     - **No** → *Stop: Original descriptive leaf holds*  

  8. **Is the kind *harmful or politically problematic*?**  
     - **Yes** → Node 9  
     - **No** → *Stop: Original descriptive leaf holds* (arbitrary but benign)  

  9. **Should the kind be *replaced* with a better category?**  
     - **Yes** → **Leaf: Ameliorative Pragmatism**  
     - **No** → **Leaf: Eliminativism**  

  ---

  #### Leaves (Positions)  
  1. **Natural Realism**  
     - *Description*: Kinds are natural, mind-independent categories with fixed boundaries.  
     - *Hardest Commitment*: Boundaries are immutable and exist regardless of human observation.  
     - *Arbitrariness/Changeability*: Not arbitrary; change requires altering nature itself.  

  2. **Causal Constructionism**  
     - *Description*: Social practices cause members to develop features defining the kind.  
     - *Hardest Commitment*: Membership traits would not exist without societal influence.  
     - *Arbitrariness/Changeability*: Not inherently arbitrary; change requires altering deep social structures.  

  3. **Looping Kinds**  
     - *Description*: Membership is fixed by social attitudes, and classification changes members.  
     - *Hardest Commitment*: The kind evolves recursively as classification alters its members.  
     - *Arbitrariness/Changeability*: Arbitrary; changeable via shifting attitudes, but inertia makes it hard.  

  4. **Institutional Facts**  
     - *Description*: Membership is fixed by collective agreement, with no feedback to members.  
     - *Hardest Commitment*: The kind vanishes if collective acceptance withdraws.  
     - *Arbitrariness/Changeability*: Arbitrary; changeable via new agreements, but often entrenched.  

  5. **Interactive Boundary Constructivism**  
     - *Description*: Boundaries are social, and classification changes members.  
     - *Hardest Commitment*: Natural features are stable, but their grouping and effects are socially mutable.  
     - *Arbitrariness/Changeability*: Arbitrary; changeable with effort via reclassification.  

  6. **Non-Interactive Boundary Constructivism**  
     - *Description*: Boundaries are social, but classification doesn’t change members.  
     - *Hardest Commitment*: Groupings are conventional yet lack causal power over members.  
     - *Arbitrariness/Changeability*: Arbitrary; changeable by redefining boundaries.  

  7. **Eliminativism**  
     - *Description*: Socially constructed kinds are unreal or harmful fictions to be abandoned.  
     - *Hardest Commitment*: Even pragmatically useful kinds must be eradicated if deceptive.  

  8. **Ameliorative Pragmatism**  
     - *Description*: Categories should be reformed or replaced based on political utility.  
     - *Hardest Commitment*: Truth or accuracy of the kind is secondary to its ethical consequences.  

  9. **Deflationary View**  
     - *Description*: "Construction" just describes how we use words, not a deep metaphysical fact.  
     - *Hardest Commitment*: Debates about construction are semantic, not ontological.  
     - *Arbitrariness/Changeability*: Arbitrary (words are conventions); easily changed by redefinition.  

  ---

  #### Gap
  - **Node 5 → "No"**: If membership isn’t natural, socially caused, or attitude-defined, it can’t exist. *Gap due to incoherence*.  

  #### Indistinguishable Positions
  - **Causal Constructionism** and **Interactive Boundary Constructivism** both allow classification to change members.  
    - *Further question*: Are the changed features *natural* (e.g., biological) or *social* (e.g., identity)?  
      - Natural → Interactive Boundary Constructivism  
      - Social → Causal Constructionism  

  ---

  ### Four Cases in the Tree  
  1. **Race/Ethnicity (Official Form)**  
     - *Accommodated by*:  
       - **Causal Constructionism** (social practices create racialized traits).  
       - **Interactive Boundary Constructivism** (boundaries are social; classification affects identity).  
       - **Non-Interactive Boundary Constructivism** (boundaries are social but static).  
       - **Ameliorative Pragmatism** (if reformed for equity).  
     - *Excluded by*: Natural Realism (race isn’t biologically fixed), Institutional Facts (no collective agreement alone defines race), Deflationary View (reduces to semantics).  
     - *Construction type*: Primarily *causal* and *interactive* (classifying as a race can alter socioeconomic outcomes).  

  2. **Gender (Self-ID)**  
     - *Accommodated by*:  
       - **Looping Kinds** (attitudes fix membership; self-ID changes social perception).  
       - **Institutional Facts** (if based on legal/collective recognition).  
       - **Ameliorative Pragmatism** (if adopted for inclusivity).  
     - *Excluded by*: Natural Realism (gender is socially mutable), Causal Constructionism (not primarily trait-causing).  
     - *Construction type*: *Constitutive* and *interactive* (classification reshapes identity and norms).  

  3. **Currency**  
     - *Accommodated by*:  
       - **Institutional Facts** (exists by collective agreement).  
       - **Deflationary View** (a label for agreed value).  
     - *Excluded by*: Natural Realism (not physical), Causal Constructionism (doesn’t cause traits), Looping Kinds (classifying as money doesn’t change its properties).  
     - *Construction type*: *Constitutive* and *non-interactive* (a dollar bill’s function doesn’t change when called "money").  

  4. **Credit-Score Threshold**  
     - *Accommodated by*:  
       - **Causal Constructionism** (thresholds cause financial behaviors).  
       - **Interactive Boundary Constructivism** (classification alters spending/borrowing).  
       - **Looping Kinds** (if thresholds shift based on behavior).  
     - *Excluded by*: Natural Realism (not innate), Institutional Facts (not based on attitudes alone).  
     - *Construction type*: *Causal* and *interactive* (classification changes member behavior).  

  **Same Sense of Construction?**  
  No.  
  - Race/Gender: *Interactive* (classification changes members).  
  - Money: *Constitutive non-interactive* (collective agreement fixes function).  
  - Credit Score: *Causal interactive* (classification manufactures behavior).  

  ---

  ### Summary  
  - **Construction ≠ Arbitrariness**: Institutional Facts and Boundary Constructivism are arbitrary but not easily changed (entrenched conventions).  
  - **Construction ≠ Changeability**: Looping Kinds and Causal Constructionism are hard to alter (require societal shifts).  
  - **Key Insight**: Social construction is a *family of concepts*: boundaries vs. membership, causal vs. constitutive, interactive vs. indifferent. The tree disentangles these to show why "constructed" means different things for race, gender, money, and thresholds.
