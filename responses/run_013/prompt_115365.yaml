  So, how is a ledger different from a rich outcome space? A ledger is the actual path taken, not just possible histories. It includes the process: the sequential constraints and choices made at each point, which might reveal inconsistencies or changes in preferences that aren't captured by a static ranking. 

  For example, in addiction, the initial choice to try a drug might seem rational, but later, the menu narrows to obtaining the next dose. The orthodox view might see the entire history as a chosen outcome, but that ignores the agent's changing preferences and constraints. The ledger shows the path-dependence and how earlier choices alter future options in ways the agent couldn't foresee or control later.

  The strongest objection would be that expanding outcomes to include histories can model the same phenomena. My rebuttal is that while possible, it's impractical and loses the procedural aspect. Also, the ledger approach emphasizes the sequential nature of decision-making, which is crucial for policy interventions. For instance, understanding the ledger helps design precommitment mechanisms or gradual withdrawal strategies, which a static outcome ranking wouldn't highlight.

  Another objection: revealed preference theorists might argue that the ledger is just data to infer preferences. But if preferences change endogenously, the utility function isn't stable. The ledger captures this evolution, whereas a single utility function over histories assumes transitivity and consistency that may not hold.

