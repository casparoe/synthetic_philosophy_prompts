prompt: |-
  Ok so I've been reading a bunch of stuff about whether death is bad for the person who dies, and there's a move I keep seeing that I don't have a word for. Here's the pattern. Somebody says death can't be bad for you, because there's no you left to be harmed -- when death is around, you're not, so there's no subject and no moment where the harm actually lands. The usual comeback is that death robs you of the good years you would of had. But the comeback quietly buys the same frame: it's still hunting for a moment and a person to pin the harm on, it just relocates it to the life that got cut short. Fine. What gets me is that I then see the exact same rule used the other way, and nobody admits it. A guy gets smeared after he's dead and everyone agrees he was wronged -- but by the no-subject rule there's nobody left to wrong. Same with a promise somebody breaks after your gone. Flip it around: a factory dumps poison and the people who get sick are born twenty years later; everyone says the factory harmed them, even though when the dumping happened none of them existed yet. So sometimes "nobody was there at the time" kills the harm and sometimes it doesn't, and nobody says why. What I want to know is whether there's a name for this -- not the Epicurus thing itself, and not just "posthumous harm," which I think is narrower. I mean the hidden rule about what it takes for something to count as a harm at all: that a harm has to be datable, tied to a particular moment and a particular existing person, and the puzzle of when we insist on that and when we let it slide. If there's a term, what is it and how does it relate to the near misses. If there isn't, coin one and tell me where the edges are -- what counts as a datable harm, what doesn't, and whats the borderline case that makes it hard.
reasoning: |-
  Okay, the user is diving deep into a philosophical puzzle about the conditions for harm, especially concerning events that affect people who aren't present when the harm occurs. They've noticed inconsistencies in how we apply the "no subject, no harm" rule—like in death, posthumous wrongs, or environmental damage affecting future generations. 

  First, I need to pinpoint their core frustration: they're not just asking about Epicurus' argument or posthumous harm as isolated concepts. They're highlighting a double standard in philosophical and everyday reasoning. When death is discussed, the "no subject" rule shuts down harm claims, but in other cases (reputation damage, broken promises, intergenerational pollution), we ignore that rule. The user wants a term for this underlying principle—the requirement that harm must attach to a specific person at a specific time—and its inconsistent application. 

  They’ve done their homework: they reference Epicurus' symmetry argument (no subject during death = no harm), the deprivation account (death harms by robbing future goods), and examples like posthumous smears or toxic waste affecting future people. Their examples are sharp—especially the factory dumping poison for unborn victims. That’s a clean counterexample to the "no subject at the time" rule. 

  The real ask here is conceptual taxonomy. They want:  
  1. **A label** for this "dated harm" requirement.  
  2. **Clarity** on when we enforce it vs. waive it.  
  3. **Borderline cases** to test the edges.  

  I recall Derek Parfit’s work on personal identity and ethics—he’d call this a "person-affecting principle" issue. And Feinberg’s "harm principle" debates touch on temporal gaps. The closest existing term might be "temporal particularity" of harm, but that’s not standard. If coining, "Harm Anchoring" feels right—it captures the need to fix harm to a subject in time.  

  For borderline cases, I should pick ones that stress-test the concept:  
  - **Promise-breaking**: Harm anchors when the promise is made? When it’s broken? Or when the dead promisor "would’ve" cared?  
  - **Genetic harm**: Altering DNA before conception—harm anchored at modification (no subject) or at the descendant’s suffering (subject exists)?  
  - **Historical injustice**: Can reparations harm present people if they didn’t exist during the wrong?  

  The user’s meta-need is likely rigor. They’re philosophically savvy but want tools to dissect inconsistencies. Naming this "anchoring" problem gives them leverage in debates. They might also hint at applied ethics—e.g., climate policy (harming future generations) or digital legacy rights.  

  I’ll structure the reply to:  
  - Validate their observation (it’s a real inconsistency).  
  - Offer "Harm Anchoring" as a coined term.  
  - Map existing concepts (deprivation, person-affecting) to show where it fits.  
  - Use borderline cases to clarify the rule’s limits.  
  - End with why this matters—e.g., for intergenerational ethics.
answer: |-
  You've hit on a profound and under-discussed inconsistency in how we conceptualize harm—specifically, the **temporal and existential anchoring requirement** for harm. There's no universally accepted term for this hidden rule, but I'll define the concept, coin a term, map its boundaries, and show why it matters.

  ### The Core Concept: "Harm Anchoring"
  The implicit rule you're describing is that **for an event to constitute a harm, it must be anchored to a specific subject who exists at a specific time when the harm "lands."** Let's call this **Harm Anchoring**. It assumes harm requires:
  1. **A subject** (a concrete, existing person to whom harm occurs).
  2. **A moment** (a discrete time when the harm is realized).
  3. **Experiential impact** (the harm must be felt or register *somehow*).

  This anchoring is why Epicurus' argument ("Where death is, I am not") feels intuitive: no subject + no moment = no harm. But as you note, we routinely *ignore* anchoring in other cases without explanation.

  ### Why "Harm Anchoring" Fails Consistently
  | **Scenario**               | **Harm Anchoring Enforced?** | **Why the Inconsistency?**                                                                 |
  |----------------------------|------------------------------|--------------------------------------------------------------------------------------------|
  | **Death (Epicurus view)**  | ✅ Yes                        | "No subject at T (death) → no harm." Ignores counterfactual well-being (deprivationism). |
  | **Posthumous reputation**  | ❌ No                         | Harm is anchored to the *person's legacy* or *ante-mortem interests* (e.g., their lifelong desire for honor). |
  | **Broken promise after death** | ❌ No                    | Harm anchored to the *promise-making moment* (when trust was established) or the dead person's *prior reliance*. |
  | **Toxic waste (future victims)** | ❌ No                   | Harm anchored to the *victim's existence* (when they suffer) or the *act of dumping* (as a cause). |
  | **Genetic harm to unconceived** | ⚠️ Borderline            | Debated: Is harming a *future* subject by altering their conditions (e.g., pollution) equivalent to harming them *now*? |

  ### Coined Term: **Harm Anchoring**
  **Definition**: The requirement that harm must be attributable to a specific, existing subject at a determinate time for it to be morally or ontologically valid.  
  **Related but distinct from**:
  - **Deprivationism** (harm as loss of possible goods): Addresses *why* death might be bad but doesn't resolve anchoring.
  - **Posthumous Harm**: A *type* of harm that *violates* anchoring—so it presupposes the rule exists.
  - **Non-Identity Problem** (Parfit): Asks whether harming future people is possible if they wouldn't exist otherwise—closely tied to anchoring.

  ### Borderline Cases: Where Anchoring Becomes Blurry
  1. **Preconception Harms**  
     *Example*: A parent's exposure to toxins alters their DNA, causing their future child (conceived later) to suffer.  
     - **Anchoring test**: No subject exists at exposure time (T1). Harm appears at child's birth (T2).  
     - **Verdict**: Anchoring often waived—we blame the act at T1. Rationale: Harm is *caused* at T1 and *realized* in a subject at T2.

  2. **Historical Injustice & Reparations**  
     *Example*: Stolen land from Tribe X in 1800. Tribe X's descendants today suffer economic harm.  
     - **Anchoring test**: Descendants didn't exist at T1. Is the harm "anchored" to them now?  
     - **Verdict**: Anchoring waived. Harm is tied to the *continuous injustice* or the original act's *ongoing effects*.

  3. **Deathbed Wishes**  
     *Example*: You promise a dying person to donate their wealth to Charity A. After death, you give it to Charity B.  
     - **Anchoring test**: No subject exists when the promise is broken.  
     - **Verdict**: Anchoring often enforced (no harm *to the dead person*)—unless we anchor harm to the *moment of promise-making*.

  ### Why We Waive Anchoring (The Hidden Rule Exposed)
  We ignore harm anchoring when:
  - **Causal chains are clear** (e.g., dumping poison → future sickness).
  - **Interests transcend existence** (e.g., reputation, promises—grounded in a person's *lifetime* values).
  - **Moral responsibility is assignable** (e.g., we blame the dumper, not the non-existent victim).

  We enforce it when:
  - **The subject's nonexistence is total** (e.g., Epicurus' death: no residual interests).
  - **Counterfactuals are murky** (e.g., "Would they *really* have been happier if alive?").

  ### The Philosophical Stakes
  This inconsistency reveals a tension between two views of harm:
  1. **Subject-Centered Harm**: Harm requires a subject's experience (anchoring enforced).  
  2. **Event-Centered Harm**: Harm is a *wrongmaking feature of events*, regardless of subject timing (anchoring waived).

  Your factory example is key: if we accept harm to future people, we must reject anchoring—or redefine harm as **"violating interests across time."** This reshapes ethics, demanding responsibility for acts whose full impact unfolds beyond our lifetime (e.g., climate change).

  ### In Short
  The term is **Harm Anchoring**. Its edges are tested when harm spans nonexistence (death), pre-existence (future generations), or post-existence (legacies). We waive anchoring when causality + moral intuition override the "no subject" rule—but we rarely admit it because **anchoring is a deep, unexamined bias in how we perceive agency and identity**. If you coin this in a paper, credit Epicurus for the problem and Parfit for the non-identity groundwork.
