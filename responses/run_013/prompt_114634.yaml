  Here is the story, followed by the analysis you requested:

  Anya dipped her brush into the thin slurry – *vyr* – the exact blue of a winter dusk settling over the strait. Here, in her restoration studio in Eastcliff, the pigment felt as familiar as breath. She remembered the smell of it, sharp and mineral, filling the small dye-house back in Westhaven across the bridge, where her mother had worked the great copper vats. She’d been seven, maybe eight, watching her mother lift a length of linen, newly plunged, dripping that profound, impossible blue. “True *vyr*,” her mother had murmured, satisfaction softening the lines of fatigue around her eyes. “Like the deep water.”

  That memory, vivid as the pigment itself, surfaced often as Anya worked. She touched up frayed embroidery on a ceremonial robe from the Eastcliff archives, blending her *vyr* meticulously. The robe’s original blue, centuries old, matched perfectly. *Of course it does*, she thought. *It’s the same pigment, the same word, the same skill passed hand to hand.* The Eastcliff Dyers’ Guild, like the Westhaven one, guarded their *vyr* stone fiercely, sourced from their own quarries. The stones looked identical – dense, blue-grey chunks that yielded the same intense powder, ground the same way, fixed with the same alum mordant, faded at the same gentle pace over decades under sunlight. No dyer on either shore, guildmaster or novice, could tell them apart in the vat or on the cloth. The word *vyr* simply meant *this* blue, made from *this* stone, whichever shore you stood on. Anya used it without hesitation, discussing orders with Eastcliff suppliers, praising a colleague’s dye batch, teaching an apprentice the grinding technique. It felt utterly natural, as seamless as the bridge itself connecting the two towns.

  The robe project hit a snag. A section of blue silk, part of a later repair, was degrading oddly. Anya needed to confirm the provenance of the original *vyr* used in the main panels centuries ago. Eastcliff’s historical records were meticulous. She spent days in the archive’s cool basement, breathing dust and old parchment. Guild ledgers detailed weights of stone purchased, batches of dye sold. She found the entry for the robe: *"Vyr stone, 15 stone-weight, quarried local, for Master Weaver Borin, Feast Robe, Year 342."* Standard. Unremarkable.

  Frustrated, she turned to the port authority records. Maybe the stone had been imported before local quarries opened? Hours blurred. Then, tucked between manifests for grain and timber, she found it. A single sheet, brittle and foxed: *"Customs House, Eastcliff Port, Fifteenth Day of Rains, Year 340. Received from Westhaven via Schooner 'Wave-Dancer': One crate, coarse stone, designated 'vyr' for pigment. Weight: 8 stone-weight. Tariff paid per Guild Schedule B."*

  She stared. Year 340. Two years *before* the robe was commissioned. The Eastcliff quarries were operational then, but perhaps demand had spiked? Or a specific Westhaven batch was requested? Not unusual. But the word snagged her: *designated 'vyr' for pigment*. The clerk had written it that way, distinguishing it implicitly from their own *vyr*. Just bureaucratic caution, surely.

  Her mind flickered, unbidden, to her mother’s vat in Westhaven, the dripping linen. *True vyr.* The blue on that childhood cloth came from Westhaven stone, ground in Westhaven, designated *vyr* by Westhaven dyers. The blue she touched up now on the Eastcliff robe, identical in every perceivable way, came from Eastcliff stone, ground here, designated *vyr* by Eastcliff dyers. The customs form stated plainly that what Westhaven called *vyr* was just *"coarse stone, designated 'vyr'"* when it arrived here. An alien designation. A thing from *outside*.

  The memory of her mother’s linen, always a simple, solid image – the blue, the steam, her mother’s voice saying *vyr* – suddenly contained, invisibly, a specific piece of the physical world: Westhaven *vyr*-stone. Not *vyr* in some abstract, universal sense. Not the Eastcliff stone she worked with daily. The *content* of that memory – the *what* she remembered her mother using – was now, irrevocably, a particular mineral formation from the cliffs near her birthplace. A formation chemically distinct from the one under her feet in Eastcliff, though she’d never know that difference by sight, touch, smell, or use. She hadn’t known that difference as a child; she couldn’t discover it now by thinking about the memory harder. The meaning of the word in her memory, what it *referred to* back then, was fixed by the Westhaven stones, the Westhaven guild, the Westhaven pointing fingers. Yet here she was, years later, in Eastcliff, holding a memory whose referential content was utterly specific to a place and time, a content she carried unknowingly within her, unchanged since childhood, but only graspable *as* that specific content from her new vantage point, prompted by an external scrap of paper. She felt no itch, no internal signal. Just the quiet, vertiginous realization that the world had been labeling things behind her back, and the label in her head had been stuck to something different all along, depending on where she stood.

  ---

  **Analysis: The Load-Bearing Element & Its Removal**

  1.  **The Load-Bearing Element:** The **functional indistinguishability** of the two minerals *to the dyers and in the dyeing process* is absolutely crucial. Their identical appearance, grindability, dye yield, color hue, lightfastness, and behavior under the specific craft conditions mean there is *no internal signal or experiential difference* that could alert Anya (or anyone) to the divergence. The guilds' practices seamlessly replicate the same outcomes with different materials, making the substitution invisible to introspection or ordinary use.
  2.  **Consequence of Removal:** If the minerals *were* distinguishable – say, if Eastcliff *vyr* produced a slightly greener blue, or faded faster, or required a different mordant – Anya (or any competent dyer) would inevitably notice the discrepancy through her work. This internal experiential difference would create the "itch" or "sense something is off" you specifically wanted to avoid. She *could* potentially discover the difference through introspection (questioning why her childhood *vyr* memory seemed different from the Eastcliff results) or careful comparison, undermining the core argument that meaning is fixed externally and inaccessible internally. The functional identity is what locks the difference away from conscious access and makes the silent shift in the memory's content possible.
