  ok so i'm trying to get clear on consequentialist cluelessness before i commit to anything, and i want the spec first, not another tour of the usual sweatshop-shopping example. by cluelessness i mean this: the far-off and knock-on effects of what i do aren't just unknown the way a die roll is unknown, they're the sort of thing i can't even assign probabilities to, because i can't see the branches at all. the shirt might fund something awful or fund something wonderful and i have no credence to give either way.

  write me the desiderata a theory has to meet before i'll call it an adequate theory of what to do under that kind of ignorance. for each one give me the case or consideration that forces it, and say which are non-negotiable and which are really just a preference of one camp. things i want on the list, though you can add or drop: it has to return an answer when my best guess genuinely is a coin flip; it has to respect the difference between risk (known odds), uncertainty (unknown odds) and cluelessness (no odds to be had), rather than running all three together; it has to stay action-guiding instead of collapsing into paralysis; it has to keep the obvious verdicts obvious -- pulling the kid out of the pond beats buying the shirt -- without letting a butterfly-effect argument swamp everything local; and it has to cope with cases where the expected value doesn't even converge, so the theory needs a verdict where the sum is undefined.

  i also want a requirement i've not seen put quite this way: a theory should tell me when it's worth paying a cost to reduce cluelessness itself. is finding out a good the theory can rank, and does it ever outrank acting on the guess? call it the epistemic-investment case if you need a label.

  then tell me which single requirement does the most damage, i.e. rules out the most popular moves, and whether any two of your requirements can't both be had. that last bit is what i most want -- if the list is internally in tension i'd rather know now than after i've built on it. definately no scorecard of named theories, i'll do that part myself.

  hard cap: 650 words, and a list is fine, dont pad it.
