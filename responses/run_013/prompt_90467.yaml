answer: |-
  Here's your desiderata list for an adequate theory of action under consequentialist cluelessness, with cases, necessity, tensions, and the key damage point:

  1.  **Non-Paralysis (Action-Guidance):** *Must return a verdict even under maximal cluelessness.*
      *   **Case:** "Coin Flip Cluelessness": Choosing between A and B where *all* far-future consequences of both are equally opaque and utterly unpredictable; best guess is a genuine coin flip.
      *   **Status:** Non-negotiable. A theory that yields "do nothing" or "it's arbitrary" fails its core purpose.

  2.  **Trichotomy Respect:** *Must distinctly treat risk (known probabilities), uncertainty (unknown probabilities but identifiable outcomes/states), and cluelessness (unidentifiable outcomes/states, no basis for probabilities).*
      *   **Case:** Modified Ellsberg Paradox: Urn 1 (Risk): 50 red/50 blue balls. Urn 2 (Uncertainty): 100 balls, mix unknown red/blue. Urn 3 (Cluelessness): 100 balls, colors unknown *and* no basis to guess if colors even matter for outcomes beyond the draw. Theory must differentiate optimal choices for bets on each urn.
      *   **Status:** Non-negotiable. Collapsing cluelessness into uncertainty/risk misrepresents the epistemic state.

  3.  **Local Dominance Preservation:** *Must reliably yield correct verdicts in clear, local cases despite potential unknown butterfly effects.*
      *   **Case:** "Pond vs. Shirt": Saving a drowning child right now vs. buying a shirt. Theory must affirm saving the child, rejecting arguments that the shirt purchase *might* have fabulous (or awful) long-run effects that outweigh the *certain* local death.
      *   **Status:** Non-negotiable. Failure here makes the theory counterintuitive and practically useless.

  4.  **Divergent EV Handling:** *Must provide guidance when expected value calculations are mathematically undefined (non-convergent, infinite, etc.).*
      *   **Case:** "Pascal's Madness": An action with a vanishingly small but *unbounded* potential positive payoff (e.g., triggering a cosmic utopia) and severe known local costs. Standard EV sums diverge. Theory must still dictate action/inaction.
      *   **Status:** Non-negotiable. Many consequentialist problems involve potentially infinite stakes; theory must function here.

  5.  **Epistemic Investment Guidance:** *Must rank the value of reducing cluelessness vs. acting on current ignorance.*
      *   **Case:** "Costly Clarity": You face a clueless choice (A/B). You can pay a significant cost C (time, resources, forgone local good) to research, potentially resolving the cluelessness into mere risk/uncertainty. When is paying C better than acting on ignorance now?
      *   **Status:** Non-negotiable for adequacy. A complete theory must handle the meta-question of when to seek more information.

  6.  **Butterfly Effect Containment:** *Should not let remote, speculative possibilities derived *only* from chaos/complexity arguments routinely swamp strong local evidence or moral intuitions.*
      *   **Case:** "Kindness or Cruelty?": Giving a dollar to a visibly distressed stranger vs. keeping it. Theory shouldn't be paralyzed by "but maybe that dollar funds a future tyrant" arguments absent *specific* reason for suspicion, overriding the strong local reason for kindness.
      *   **Status:** Preference/Camp Dependent. Some theories (e.g., strong longtermism) prioritize long tails more than others. Negotiable *only* if local dominance (#3) holds.

  **Key Tensions & Damage:**

  *   **Primary Tension:** **Local Dominance Preservation (#3) vs. Acknowledging Cluelessness (#1 & #2)**. Rigidly prioritizing the local (#3) might ignore genuine, knowable catastrophic long-tail risks. Fully embracing cluelessness risks undermining all local verdicts via butterfly arguments (#6). *Balancing these is the core challenge.*
  *   **Most Damaging Requirement:** **Divergent EV Handling (#4)**. This rules out *all* standard expected utility maximization approaches relying on finite, calculable sums. It forces radical alternatives (satisficing, lexical priorities, domain restrictions, non-probabilistic weighting).
  *   **Secondary Tension:** **Action-Guidance (#1) vs. Epistemic Investment (#5)**. A theory strongly advocating immediate action under cluelessness might undervalue research. One over-valuing research might lead to perpetual delay. The theory needs internal criteria for when to act vs. investigate.

  The tension between preserving clear local duties (#3, #6) while seriously grappling with the pervasive, radical uncertainty of long-term consequences (#1, #2, #4) is fundamental. No existing theory seamlessly reconciles these. #4 does the most damage to conventional consequentialist machinery.
