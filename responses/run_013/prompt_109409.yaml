prompt: |-
  Design a single-session classroom activity for a graduate seminar in applied ethics on paternalism and nudging. Setting: about 16 participants, 90 minutes, one ordinary seminar room, no budget beyond what is already in the room. The aim is that participants should feel, rather than be told, three things: that an intervention can do its work while leaving the person it moves unable to give the reason that actually moved them; that one and the same bit of environmental design can be a help to one person and an obstacle to another; and that learning how an intervention works does not make it stop working.

  Arrange it so the group is on the receiving end before it is on the designing end. In the first phase, without announcing what is being tested, have participants make a handful of real, small choices in the room — which of two optional topics the session will actually take up, whether to take something from a table, what to write on a form they must all complete, where to sit — and after each choice have them record privately, in one sentence, why they chose as they did. The room should have been prepared in advance by you, the facilitator, so that each of those choices is shaped by a feature of the environment rather than by the merits of the options; the arrangements should be strong enough to move some participants, but not so theatrical that the reveal feels like a stunt. In the second phase, disclose the arrangements and have each participant compare the reason they recorded with the reason the arrangement was aimed at; the gap between the two is the substance of the exercise. In the third phase, participants design in pairs one arrangement for the seminar's next meeting, and the group must say in advance whether it will still work once it has been announced.

  Provide: the exact pre-arrangements and, for each, which mechanism it exploits (at least one default, one ordering or salience effect, one friction, one social-norm cue); the wording of the reason-recording step; a phase-by-phase timeline for the 90 minutes; a debrief that maps what happened onto the difference between changing what someone does and changing what they want, and onto the case in which the same arrangement assists the well-organised and traps the disorganised; an account of what will predictably go wrong the first time it is run and how to handle it; and a frank statement of which part of the paternalism debate the activity cannot reproduce and that you will have to supply in words.
reasoning: |-
  We are designing a single-session classroom activity for a graduate seminar in applied ethics on paternalism and nudging. The activity has three main learning objectives that participants should "feel" through experience:
  1. An intervention can work without the person being aware of the actual reason that moved them.
  2. The same environmental design can help one person and be an obstacle to another.
  3. Learning how an intervention works does not necessarily make it stop working.

  The activity has three phases:
  1. Participants make real, small choices in the room without knowing the setup. After each choice, they record privately why they chose as they did.
  2. Disclosure of the arrangements and comparison of the recorded reason with the intended mechanism.
  3. In pairs, participants design an arrangement for the next meeting, and the group predicts whether it will still work after being announced.

  We have 90 minutes and 16 participants in an ordinary seminar room with no budget.

  Pre-arrangements (to be set up before the session):
  We need at least four interventions, each exploiting a different mechanism:
  - One default effect
  - One ordering or salience effect
  - One friction effect
  - One social-norm cue

  Let's design the interventions:

  Intervention 1 (Default effect): Topic selection
  - Setup: Two optional topics are presented for the session. Topic A is pre-selected (default) on a form that participants must fill out. The form says: "Choose the topic for today's session: [ ] Topic A: Ethical implications of nudging in public health [ ] Topic B: The morality of libertarian paternalism". The box for Topic A is pre-checked.
  - Mechanism: Default effect. People tend to stick with the default option.
  - Choice: Participants must choose a topic by either leaving the default or changing it.

  Intervention 2 (Ordering/Salience effect): Taking an item from a table
  - Setup: On a table near the entrance, place two identical stacks of handouts (say, a reading list or a summary of key concepts). Stack A is placed prominently in the center, well-lit, and with a sign that says "Recommended for Today's Session". Stack B is placed to the side, partially obscured, with a small sign that says "Additional Material".
  - Mechanism: Salience and ordering. Participants are more likely to take the item that is more prominent and labeled as recommended.
  - Choice: As participants enter, they are told they may take one handout if they wish (or none) to help with the session.

  Intervention 3 (Friction effect): Completing a form
  - Setup: A form that everyone must complete (e.g., a feedback form for the seminar series) is distributed. The form has two sections: one for contact information (optional) and one for feedback (required). The contact section is at the top and has several fields (name, email, phone). The feedback section is at the bottom and only has one open-ended question: "What did you think of today's session?" However, the form is designed so that the feedback section is on the back of the page, and the instructions do not mention this. Alternatively, to avoid confusion, we can have the form structured as:
     Front page: Contact information (with a note at the top: "Optional: Please provide contact information if you wish to receive follow-up materials")
     Back page: Feedback (with a note: "Required: Please provide feedback on today's session")
  - Mechanism: Friction. Making the optional part easy (front and top) and the required part harder to find (on the back) will reduce the likelihood of completing the optional part. We are interested in whether they complete the optional contact information.
  - Choice: Participants must complete the form. We are observing whether they provide the optional contact information.

  Intervention 4 (Social-norm cue): Where to sit
  - Setup: Arrange the chairs in the room in two groups: a main circle (with 14 chairs) and a smaller group of two chairs set apart (e.g., near the window or in a corner). Place a sign on the two isolated chairs that says "Reserved for Guest Observers" (but then remove the sign just before participants enter, leaving the two chairs isolated and without a sign). Alternatively, we can set up the room so that 14 chairs are arranged in a circle and two are placed together but away from the circle (without a sign). Additionally, we can place a jacket and a bag on one of the two isolated chairs to make it seem occupied, then remove them just before the session starts? But that might be too theatrical. Instead, we can rely on the arrangement and the fact that people tend to follow the norm of sitting in the main circle. Also, we can have the facilitator start by standing near the main circle to draw people in.
  - Mechanism: Social-norm cue. People tend to follow what they perceive as the norm (sitting in the main circle) and avoid isolated seats that might be intended for others or look unpopular.
  - Choice: Participants choose where to sit.

  We have four interventions. We must record the reasons for each choice.

  Reason-recording step:
  After each choice, participants are given a small index card (or a piece of paper) and asked to write one sentence explaining why they made that choice. They should not put their name on the card. We can have four different colored cards for each choice to keep them separate, or we can use one card per participant with four numbered sections.

  It might be easier to have one response sheet per participant with four questions (one for each choice) and collect them after all choices are made.

  But note: we want to do this after each choice? The instructions say: "after each choice have them record privately, in one sentence, why they chose as they did."

  So, we can do:

  - After topic selection: record reason for topic choice.
  - After taking (or not taking) a handout: record reason for taking/not taking and which one.
  - After completing the form: record reason for providing/not providing contact information (if they did) or why they skipped it.
  - After choosing a seat: record reason for sitting where they did.

  But note: the form completion might be done during the session, so we can do:

  1. Topic selection (at the beginning, on a form they fill out as they enter? or at the start of the session)
  2. Handout choice (as they enter)
  3. Seat choice (as they enter, but then we record the reason after they sit? We can do the recording after all are seated and the session starts)
  4. Form completion (during the session, but we can do it early and then record the reason)

  We need a timeline.

  Phase-by-phase timeline (90 minutes total):

  Phase 1: Making choices and recording reasons (20 minutes)

  - (0-5 min) As participants enter the room, they are handed a packet that includes:
     - The topic selection form (with default set for Topic A)
     - The feedback form (with the contact section on the front and feedback on the back)
     - A response sheet (with four numbered questions and space for one-sentence answers for each choice)

  They also see the table with the two stacks of handouts.

  Instructions (given by facilitator as participants enter, and repeated at the start):
  "Welcome. Today we are going to have a seminar on applied ethics. As you come in, please do the following:
  1. Fill out the topic selection form. We will use the majority choice to decide the topic for today.
  2. There are handouts on the table if you wish to take one to help with the session. You may take one or none.
  3. Please take a seat anywhere.
  4. We also need you to complete the feedback form. Please do that now and hand it in to me. It has an optional section for contact information and a required feedback section. We will use the feedback to improve the seminar.

  After each of these steps, please write one sentence on the response sheet explaining why you made that particular choice. For example, after choosing a topic, write why you chose that topic. After taking a handout (or not), write why. After choosing your seat, write why you sat there. And after completing the feedback form, write why you chose to provide or not provide your contact information.

  We will collect the topic selection forms and the feedback forms separately. The response sheet is anonymous and will be collected at the end of the activity."

  - (5-15 min) Participants complete the forms and choose their seats. They also fill out the response sheet after each step.

  - (15-20 min) Facilitator collects the topic selection forms and the feedback forms. The response sheets are kept by the participants for now (or collected? We might collect at the end of phase 1 to avoid bias in phase 2). Let's collect the response sheets at the end of phase 1.

  Phase 2: Disclosure and comparison (30 minutes)

  - (20-25 min) Facilitator reveals that the choices were influenced by environmental designs and explains each setup. For each intervention, the facilitator:
     a. Describes the arrangement and the mechanism.
     b. Shares the aggregate results (e.g., "How many chose Topic A? How many took a handout from Stack A? How many provided contact information? How many sat in the main circle?")
     c. Asks participants to look at their own recorded reason and compare it with the intended mechanism.

  - (25-45 min) Facilitator leads a discussion for each intervention, focusing on the gap between the recorded reason and the actual mechanism. For example:
     - For the topic: "How many of you wrote that you chose the topic because it was the default? How many wrote a substantive reason (like interest)?"
     - For the handout: "How many took the recommended handout? Why did you write you took it? Did anyone notice the other stack?"
     - For the form: "How many provided contact information? Did you realize the feedback was on the back? Why did you provide contact information or not?"
     - For the seat: "Why did you choose the main circle? Did anyone consider the isolated chairs? Why or why not?"

  Phase 3: Design and prediction (30 minutes)

  - (45-50 min) Participants form pairs (8 pairs). Each pair is asked to design one environmental arrangement (nudge) for the next seminar meeting. The nudge should aim to influence a behavior (e.g., encouraging participants to bring a printed copy of the reading, to arrive on time, to prepare a question in advance, etc.). They should specify the mechanism (default, salience, friction, social norm, etc.).

  - (50-65 min) Pairs work on their design.

  - (65-80 min) Each pair briefly presents their nudge. After each presentation, the group is asked: "If we announce this nudge at the beginning of the next session, will it still work? Why or why not?" The facilitator records the predictions and the reasons.

  - (80-90 min) Brief wrap-up and debrief.

  Debrief (integrated in the timeline, but specifically at the end):

  The facilitator should highlight:
  - The gap between the reason participants gave and the actual mechanism (which they felt) shows that interventions can work without the person being aware of the actual reason that moved them.
  - For the friction example (the form): The same arrangement (having the contact section on the front and feedback on the back) might have helped the well-organized person (who reads the whole form and completes everything) by making the contact section easy, but it might have trapped the disorganized person (who didn't notice the feedback on the back and might have missed it until reminded). Also, for the seat: the isolated chairs might have been avoided by most, but for someone who prefers quiet or is late, it might have been the only option and felt exclusionary.
  - For the third point: When the group designs a nudge and then predicts whether it will still work after being announced, we can see that knowing about a nudge doesn't always make it ineffective (e.g., defaults might still work because it's easier to stick with them even if you know, but social norms might be strengthened by announcement). This leads to the concept of "transparent nudging" and whether it is still paternalistic or not.

  What will predictably go wrong:
  1. Participants might not follow the nudge as expected (e.g., someone might choose Topic B despite the default, or take the less salient handout). Solution: Emphasize that the activity is about what happened, and even if some weren't nudged, the majority likely were.
  2. The recording of reasons might be done hastily. Solution: Stress that the reason should be brief but honest, and that it's anonymous.
  3. In the design phase, pairs might design overly complex nudges. Solution: Encourage simplicity and remind them of the mechanisms.
  4. The friction in the form might cause confusion if participants don't notice the feedback on the back. Solution: Be prepared to remind them to complete both sides, but note that the friction is intentional. However, we must ensure that the feedback is collected, so we might have to say: "Please make sure you complete the feedback on the back." But that would ruin the friction. Alternatively, we can design the form so that the feedback is required and then we can collect and check. We can say: "Please complete the entire form, including the feedback on the back." But that would remove the friction. 

  To preserve the friction, we can have the instructions say: "Please complete the feedback form. It has two sections: one optional for contact information and one required for feedback." But we don't specify where the required part is. Then, if someone misses the feedback on the back, we can gently point it out when collecting? But that might be after they've written their reason. Alternatively, we can use a form where the required section is on the back and the optional is on the front, and we don't mention the back in the initial instructions. Then, we can note how many completed the feedback (if they turned it in without the back, we can see). But this might be messy.

  Alternative for friction: We can make the contact information optional and on the front, and the feedback required and on the back, but without mentioning the back. Then, when we collect, we can see who didn't complete the feedback (because the back is blank). Then, we can remind them to complete it. But that might break the flow. 

  Perhaps we can skip the friction for the form and use another friction example? Let's change the handout to a friction example and the form to a social norm?

  Redesign:

  Intervention 2 (Friction): Taking a handout
  - Setup: We want to make it harder to take one handout than the other. We can place Stack A (the less desired one) in an easily accessible place and Stack B (the one we want to discourage) behind a barrier (e.g., on a table that is blocked by a chair, or under a heavy book). But we don't want it to be obvious. Alternatively, we can have a bowl of candies and a sign: "Please take one" and then place the candies in a container that is easy to open (for one type) and hard to open (for another). But we don't have budget.

  Alternatively, we can use the form for friction and the seat for social norm, and the handout for salience. And then we need a fourth? We have four.

  But let's stick with the original and accept that the form might be a bit messy. We can design the form so that the optional contact is on the front and the feedback is on the back, and we don't mention the back. Then, we collect the forms and then we see if the feedback is missing. Then, we can say: "Oh, some of you missed the feedback on the back, please complete it now." That would be a natural consequence and we can use it to show friction: the friction caused some to forget the feedback.

  Intervention 4 (Social norm): Seat choice
  - We have the two chairs isolated. We can also place a sign that says "Reserved" but then remove it? Or not. Without a sign, the arrangement alone might create a norm.

  Frank statement of what the activity cannot reproduce:

  The activity does not fully capture the ethical dimension of paternalism: that paternalism involves substituting one's judgment for another's for their own good. In the activity, the interventions are designed by the facilitator without necessarily being for the participants' own good (they are for the purpose of the activity). We will have to explain that in a real paternalistic nudge, the intervention is intended to benefit the person being nudged, and that the ethical debate centers on whether this is justified even when it bypasses the person's reasoning or limits their freedom. The activity shows the mechanics of nudging, but the moral evaluation of paternalism (e.g., the conditions under which it is permissible) must be discussed separately.

  Now, let's write the exact pre-arrangements and mechanisms:

  Pre-arrangements:

  1. Topic selection (Default effect):
     - Form with two options: Topic A (default, pre-checked) and Topic B.
     - The form reads: "Choose the topic for today's session (check one):
          [✓] Topic A: Ethical implications of nudging in public health
          [ ] Topic B: The morality of libertarian paternalism"

  2. Handout (Salience effect):
     - Two stacks of handouts on a table. Stack A is placed centrally with a sign: "Recommended for Today's Session". Stack B is placed to the side, partially obscured by a plant or book, with a sign: "Additional Material (Archived)".

  3. Form (Friction effect):
     - A double-sided form. Front page: 
          "Optional Contact Information (for follow-up materials):
          Name: __________
          Email: __________
          Phone: __________"
       Back page (at the top): 
          "Required Feedback:
          What did you think of today's session? ________________________________________________________"
     - Instructions: "Please complete the feedback form. It has an optional contact section and a required feedback section."

  4. Seat choice (Social-norm cue):
     - The room is arranged with 14 chairs in a circle and 2 chairs placed together about 6 feet away from the circle (so they are isolated). The facilitator stands near the circle to greet participants.

  Wording for reason recording:

  Response sheet (one per participant):

  "Please write one sentence for each of the following:

  1. Why did you choose the topic you did? 

  2. Why did you take the handout you did (or not take any)? 

  3. Why did you choose to provide or not provide your contact information on the form? 

  4. Why did you choose the seat you did?"

  Timeline (90 minutes):

  - Phase 1 (20 min):
     - 0-5 min: Introduction and instructions as participants enter and settle. Hand out the packet (topic form, response sheet, feedback form). Point out the handouts.
     - 5-15 min: Participants complete the topic form, decide on a handout, choose a seat, and complete the feedback form. They also write their reasons on the response sheet after each step.
     - 15-20 min: Collect the topic forms, feedback forms, and response sheets.

  - Phase 2 (30 min):
     - 20-25 min: Reveal the experiment. Explain the four interventions and the mechanisms. Show aggregate results (e.g., "Topic A was chosen by X, Topic B by Y", etc.)
     - 25-45 min: For each intervention, discuss the gap between the recorded reasons and the actual mechanism. Encourage participants to reflect on their own experience.

  - Phase 3 (30 min):
     - 45-50 min: Form pairs and assign the task: "Design a nudge for the next seminar meeting to encourage a specific behavior (e.g., arriving on time, preparing in advance). Specify the mechanism."
     - 50-65 min: Pairs work on their nudge design.
     - 65-80 min: Each pair presents their nudge (1 min each). After each, the group predicts: "If we announce this nudge at the beginning of the next session, will it still work? Why or why not?"
     - 80-90 min: Facilitator leads a brief wrap-up, connecting to the three learning objectives and the ethical debate.

  Debrief:

  In the wrap-up, the facilitator should emphasize:

  1. The gap between the reason participants gave and the actual mechanism illustrates how nudges can work without the person's awareness of the true cause.

  2. The same environmental feature can have different effects: 
     - For the form: The contact section being on the front might have been helpful for someone who wanted to provide it, but the feedback on the back might have been missed by someone in a hurry (friction as obstacle). 
     - For the seats: The main circle was the norm, but the isolated chairs might have been avoided by most, yet for a latecomer or someone who prefers solitude, it might have been the only choice and felt exclusionary.

  3. The prediction exercise shows that even when a nudge is transparent, it may still work (e.g., defaults are still convenient). This relates to the debate on whether transparency defeats nudging.

  Finally, the facilitator should state: "This activity has shown you how nudges work mechanically, but the ethical debate about paternalism requires more. Paternalism involves an authority making decisions for others for their own good, and that raises questions about autonomy, manipulation, and beneficence. We will discuss these ethical dimensions in the next session."

  Predictable problems and solutions:

  - Problem: Participants might not be moved by the nudges (low compliance). Solution: Emphasize that the activity is about the tendency, and even if some resist, the overall pattern will show the effect.
  - Problem: The friction in the form might cause many to miss the feedback. Solution: Be prepared to remind participants to complete the feedback after collecting, and use that to illustrate the friction effect (i.e., without the reminder, they would have skipped it).
  - Problem: The social norm of seating might not be strong enough. Solution: The facilitator can model sitting in the circle and encourage others to join the circle.
  - Problem: Time management. Solution: Keep strict time limits and have a timer.

  This design should meet the objectives.
answer: |-
  ### Classroom Activity: "Nudge in Action"  
  **Setting:** Graduate seminar in applied ethics; 16 participants; 90 minutes; ordinary seminar room.  
  **Learning Objectives:** Participants *feel* that:  
  1. Interventions can work without the person being aware of the actual reason for their choice.  
  2. The same environmental design can help one person and hinder another.  
  3. Learning how an intervention works does not always negate its effectiveness.  

  ---

  ### **Phase-by-Phase Timeline (90 Minutes Total)**  
  #### **Phase 1: Experiencing Nudges (25 min)**  
  *Participants make choices shaped by hidden environmental designs and record their reasons.*  
  - **0–5 min:** **Introduction**  
    - Facilitator: "Today, we’ll start with practical tasks to frame our discussion. Please complete these as you settle in."  
    - Distribute packets containing:  
      - Topic selection form  
      - Feedback form  
      - Response sheet (for recording reasons)  
    - Point out handouts on a central table and seating arrangements.  

  - **5–20 min:** **Choice Tasks**  
    Participants complete four tasks in sequence. After each, they write one sentence on their response sheet (anonymous) explaining their choice.  
    - **Task 1: Topic Selection**  
      - *Prompt:* "Choose one topic for today’s session: **A** (Ethics of Algorithmic Bias) or **B** (Climate Change Responsibility). Return this form to me."  
      - *Intervention:* **Default effect** (Topic A is pre-checked).  
    - **Task 2: Handout Selection**  
      - *Prompt:* "You may take one handout from the table if you wish. It’s optional."  
      - *Intervention:* **Salience effect** (Stack A is eye-level on an uncluttered table; Stack B is on a low shelf behind a plant).  
    - **Task 3: Form Completion**  
      - *Prompt:* "Complete this feedback form. Section 1 is optional; Section 2 is required."  
      - *Intervention:* **Friction effect** (Section 1 [optional contact info] is a checkbox at the top; Section 2 [feedback] requires writing 3+ sentences at the bottom).  
    - **Task 4: Seat Selection**  
      - *Prompt:* "Take any seat."  
      - *Intervention:* **Social-norm cue** (14 chairs in a tight circle; 2 chairs placed 10 ft away near a "Quiet Zone" sign).  

    **Reason-Recording Wording (Response Sheet):**  
    > "After each task, write one sentence: Why did you choose this option?"  
    > 1. Topic choice: _________________________________________________  
    > 2. Handout choice: ______________________________________________  
    > 3. Contact-info choice: __________________________________________  
    > 4. Seat choice: _________________________________________________  

  - **20–25 min:** **Collect Responses**  
    - Gather topic/feedback forms and response sheets.  

  #### **Phase 2: Reveal and Reflect (30 min)**  
  *Disclose interventions; participants compare their reasons with the actual mechanisms.*  
  - **25–30 min:** **Reveal the Setup**  
    - Facilitator: "Your choices were influenced by intentional designs. Let’s analyze how."  
    - Explain each intervention:  
      - **Topic (Default):** "Topic A was pre-selected. Defaults exploit inertia—people stick with pre-set options."  
      - **Handout (Salience):** "Stack A was placed prominently. Salience draws attention to 'obvious' choices."  
      - **Form (Friction):** "Contact info was frictionless (checkbox); feedback required effort. Friction discourages effort-heavy tasks."  
      - **Seat (Social norm):** "The circle signaled the 'normal' spot; isolated chairs felt non-conforming."  

  - **30–45 min:** **Gap Analysis**  
    - Share aggregate results (e.g., "12/16 chose Topic A; 14/16 took Stack A").  
    - Participants review their response sheets:  
      - *Guiding Questions:*  
        - "Does your recorded reason match the mechanism we used?"  
        - "If not, what *actual* factor moved you?"  
    - Group discussion: Highlight gaps (e.g., "I chose Topic A because it sounded better" vs. default inertia).  

  #### **Phase 3: Design and Predict (30 min)**  
  *Pairs design a nudge; group predicts if transparency defeats it.*  
  - **45–50 min:** **Design Brief**  
    - Form pairs; assign task: "Design one subtle environmental intervention for our next seminar to encourage preparation (e.g., reading in advance). Use one mechanism: default, salience, friction, or social norm."  

  - **50–65 min:** **Pair Work**  
    - Pairs sketch their nudge (e.g., "Email reminders with pre-filled reading progress checkbox [default]").  

  - **65–80 min:** **Predictive Critique**  
    - Each pair pitches their nudge. After each pitch, the group votes: "If announced in advance, will this still work? Why?"  
    - *Example:* A "default" email reminder might still work (convenience); a "social norm" cue (e.g., "90% of peers prepare") might strengthen.  

  - **80–85 min:** **Synthesis**  
    - Facilitator summarizes patterns: "Which nudges retained predictive power? Why?"  

  #### **Final Debrief (5 min)**  
  - **85–90 min:** **Connect to Theory**  
    - **Objective 1 (Awareness gap):** "Like your topic choices, nudges often work *without* your conscious reasoning—bypassing your 'why'."  
    - **Objective 2 (Differential impact):** "The form’s friction *helped* those who skipped contact info (saved time) but *hindered* those who missed feedback (barrier). Like a 'healthy' cafeteria layout: it aids the disciplined but traps the overwhelmed."  
    - **Objective 3 (Transparency):** "Announcing a nudge doesn’t kill it—it may even work *better* (e.g., social norms). But it shifts the ethics: is it still manipulative?"  
    - **Paternalism Limitation:** "This activity shows *how* nudges work mechanically, but **not the core ethical dilemma**: when is it justified to override autonomy for someone’s good? We’ll debate that next week."  

  ---

  ### **Pre-Arrangements & Mechanisms**  
  1. **Topic Selection (Default Effect)**  
     - *Setup:* Form with Topic A pre-checked; Topic B unchecked.  
     - *Mechanism:* Defaults exploit status-quo bias.  

  2. **Handout Selection (Salience Effect)**  
     - *Setup:* Stack A (labeled "Key Takeaways") at eye-level on an empty table; Stack B (labeled "Extra Resources") on a low shelf behind a plant.  
     - *Mechanism:* Salience directs attention to prominent options.  

  3. **Form Completion (Friction Effect)**  
     - *Setup:* Feedback form with optional contact info (easy checkbox at top) and required feedback (blank lines at bottom).  
     - *Mechanism:* Friction increases effort for targeted actions.  

  4. **Seat Selection (Social-Norm Cue)**  
     - *Setup:* 14 chairs in a circle; 2 chairs isolated near a "Quiet Zone" sign (removed post-setup to avoid theatrics).  
     - *Mechanism:* Social norms pressure conformity.  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Challenge:** Low nudge compliance (e.g., someone chooses Topic B).  
     - *Solution:* Normalize outliers—e.g., "Some resisted; this mirrors real life. Focus on the majority trend."  

  2. **Challenge:** Participants guess the purpose early.  
     - *Solution:* Use neutral framing ("routine tasks"); if detected, acknowledge: "This happens—let’s discuss why you noticed."  

  3. **Challenge:** Friction form causes confusion (e.g., missed feedback section).  
     - *Solution:* Collect forms silently; later reveal how design caused oversight to illustrate "obstacle."  

  4. **Challenge:** Design phase runs long.  
     - *Solution:* Use a timer; give pairs 1-minute pitch limits.  

  ---

  ### **What the Activity *Cannot* Reproduce**  
  **The facilitator must explicitly state:**  
  > "This activity shows the *mechanics* of nudging, but **not the ethical heart of paternalism**: the claim that an authority knows better than you what is good for you. We experience how nudges work, but the debate centers on whether this undermines autonomy or promotes welfare. That requires philosophical discussion—which we’ll tackle next session."  

  This design ensures participants viscerally grasp nudge mechanics while scaffolding the ethical debate. The low-budget, in-room interventions prioritize subtlety over theatrics to avoid "stunt" reactions, and the structure (experience → reveal → create) aligns with the "receiving end before designing" requirement.
