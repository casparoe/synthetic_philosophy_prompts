prompt: |-
  I'm a backend engineer (Go, Postgres, the usual) with zero formal philosophy training — one intro ethics class in college and that's it — and I've been listening to an online lecture series on Indian philosophy on my commute. The Nyaya unit completely hooked me, specifically the pramana thing: perception, inference, comparison, testimony, and then some Mimamsa folks saying wait, you're missing postulation and non-apprehension, and the Buddhists saying you've got too many, it's just perception and inference. Anyway our little reading group somehow landed an actual Nyaya scholar for a session next month. She works on classical Nyaya epistemology and has a new book arguing that the pramanas are best understood as distinct causal routes that generate warrant rather than as different kinds of propositions, and that this is why the fights over postulation and non-apprehension keep going in circles — both sides are arguing about content when they should be arguing about the process that produced the cognition. I want to ask her good questions instead of making her restate the four-fold list for the tenth time.

  Could you draft me eight to ten interview questions in a sensible order, with a quick note under each about the answer she's likely to give, and then a follow-up that takes that answer seriously rather than just repeating the question louder? The things I actually want to press on: (1) the old objection that testimony is just inference from the speaker's reliability — does her causal-route framing help or hurt the Nyaya reply that we sometimes learn things by testimony that we could never have inferred? (2) why comparison/upamana gets to stay as its own pramana when it looks like a mash-up of perception, memory and inference, while postulation and non-apprehension get rejected — if it's all about causal routes, what makes upamana's route special enough to earn a slot? (3) indeterminate perception, the supposedly contentless first moment of a perceptual episode — is that even a cognition on her account, and doesn't counting it as a pramana undercut the whole warrant-generating-process story? (4) the intrinsic-versus-extrinsic validity dispute, i.e. whether a cognition's validity is known from the cognition itself or only confirmed later — if Nyaya goes extrinsic, what stops that from collapsing into it's-true-because-it-keeps-working, and how is that not just reliabilism with extra steps? And (5) one question that connects to my day job — I work on ML infra and everyone I know is trying to make models tell you when they're unsure, so I'd like to know whether the Nyaya account of perceptual error (getting the wrong object while keeping the right structure, or whatever the technical story actually is) says anything useful about confident confabulation, or whether that's a dumb analogy I should drop before I embarrass myself.

  Also throw in one or two softer openers so it doesn't feel like an interrogation, and if there's a question the literature treats as the killer objection to her line that I haven't thought of, add it. She's friendly and likes being pushed, so don't hold back.
