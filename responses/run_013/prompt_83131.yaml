  I'm an applied statistician — a biostatistician by training, now working mostly with observational health data. My vocabulary for probability is measure-theoretic and modeling-oriented: a probability space, a sigma-algebra of events, a data-generating process, a sampling model, a likelihood, a prior and a posterior, exchangeability, calibration and coverage, identifiability, and the propensity scores that turn up in causal adjustment. When I say 'probability' I almost always mean either a fitted model's output or a long-run property of a procedure. I have never studied the philosophy of probability, and I don't want a reading list.

