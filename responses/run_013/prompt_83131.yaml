  We are going to address the three main interpretations of probability: frequentism, subjectivism (Bayesianism), and propensity. We will restate each in the vocabulary of an applied statistician (measure-theoretic, modeling-oriented) and then provide a residue report. We then discuss the two points the user suspects and give a verdict on the untranslatable parts.

