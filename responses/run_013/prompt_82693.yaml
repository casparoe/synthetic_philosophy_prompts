answer: |-
  Your diagnosis of this impasse is astute—it's a **multilayered disagreement** involving conceptual, normative, empirical, *and* methodological dimensions, but the **core conflict is conceptual**. The two camps operate with fundamentally different **definitions of corruption**, rooted in divergent frameworks of social organization. Here’s a breakdown:

  ### 1. **Conceptual Disagreement: The Heart of the Impasse**  
     - **Universalists** use a **procedural-functional definition**: Corruption occurs when formal rules of public office (backed by legal-rational authority) are violated for private gain.  
     - **Contextualists** use a **relational-moral definition**: Practices like gift-giving or patronage are embedded in social fabrics and judged by local norms of reciprocity, not abstract bureaucratic ideals.  
     - **Crucially, these definitions are mutually exclusive for many cases**. A bribe in a Weberian bureaucracy is a "corrupt act"; the same exchange in a kinship-based system may be "social obligation." They *are* answering different questions:  
       - Universalists: *"Does this act divert public resources from formal institutional goals?"*  
       - Contextualists: *"What social function does this exchange serve in its context?"*  

  ### 2. **Normative Disagreement: Clash of Moral Foundations**  
     - Universalists prioritize **impersonal equity** (state resources must serve all citizens equally).  
     - Contextualists prioritize **communal bonds** (kinship/patronage obligations may ethically outweigh bureaucratic neutrality).  
     - This isn't just about "Western vs. non-Western" values; it's **contractualism vs. communitarianism**. When a Nigerian official hires a nephew, is it nepotism (violating meritocracy) or solidarity (fulfilling kinship duty)? Both judgments are normatively coherent within their frameworks.  

  ### 3. **Empirical/Methodological Disagreement: What Counts as Evidence?**  
     - **Universalists** rely on **quantifiable outcomes**: GDP loss, inequality indices, service-delivery failures. Their data assumes corruption *always* harms development.  
     - **Contextualists** rely on **interpretive understanding**: Ethnography reveals how "corrupt" acts build trust or redistribute resources in weak states. They see aggregate indices as ethnocentric proxies.  
     - Example: A World Bank index flags Nigeria high on corruption; an anthropologist documents how "bribes" actually expedite healthcare in a broken system. Both are "true," but reflect different scales of analysis.  

  ### 4. **Your Hypothesis Is Largely Correct**  
     The dispute is **primarily conceptual** (functional vs. procedural criteria), but it *activates* normative and empirical disagreements. Even with shared facts/values, the labeling conflict persists because:  
     - **"Corruption" is a morally loaded term**. Applying it to non-Western systems implies moral failure, triggering defensiveness from contextualists.  
     - **Institutional ideals differ**: Universalists envision an idealized market-state; contextualists see bureaucracy as one governance model among many.  

  ---

  ### **Pathways to Progress**  
  The impasse won’t resolve through debate, but these steps could reframe it productively:  

  #### A. **Conceptual Disentanglement**  
     - **Replace "corruption" with neutral terms** in context-specific analyses: e.g., "informal resource redistribution," "extra-legal reciprocity."  
     - **Distinguish between:**  
       - *Individual venality* (self-enrichment harming public goods).  
       - *Systemic clientelism* (group-based redistribution with trade-offs).  
       - *Cultural reciprocity* (obligations with moral legitimacy locally).  
     Universalists often conflate these; contextualists often blur their harms.  

  #### B. **Reformulate the Core Question**  
     Shift from *"Is this practice corrupt?"* to:  
     - *"Under what conditions do informal exchanges undermine or sustain public welfare?"*  
     - *"When do kinship/patronage obligations conflict with equitable service delivery?"*  
     This focuses on **consequences and trade-offs** rather than definitions.  

  #### C. **Seek Hybrid Evidence**  
     - **Develop metrics that capture local meanings**: E.g., surveys asking citizens when a "gift" feels exploitative vs. obligatory.  
     - **Test contextualist claims quantitatively**: Do kinship-based hires in Ghana *reduce* efficiency more than merit-based hires in a context of low state capacity?  
     - **Identify thresholds**: At what point does reciprocity become extraction? (e.g., when favors divert >10% of health budgets?).  

  #### D. **Acknowledge the "Unmoveable Core"**  
     Some disagreements are **foundational** and won’t resolve:  
     - Universalists will insist that *any* diversion of public resources weakens the social contract.  
     - Contextualists will maintain that imposing alien bureaucratic standards undermines social cohesion.  
     **Progress lies in clarifying where compromise is possible** (e.g., curbing blatant theft while accommodating culturally embedded reciprocity) and where it is not.  

  #### E. **Focus on Harms, Not Labels**  
     - **Common ground exists on extreme cases**: All agree that embezzling famine relief funds is harmful. Start there.  
     - **Target "win-wins"**: Reduce bureaucratic friction (less need for "speed money") while respecting local norms (e.g., Tanzania’s community-health accountability hybrids).  

  ---

  ### **Conclusion: Progress Looks Like Nuance**  
  The deadlock persists because both sides are partially right—and trapped in a **dialogue of the deaf**. Progress requires:  
  1. **Separating semantic battles** from practical problem-solving.  
  2. **Admitting trade-offs**: Kinship solidarity *can* conflict with meritocracy; efficient bureaucracy *can* feel alienating.  
  3. **Building context-sensitive reforms**: Anti-corruption tools must adapt to local moral economies (e.g., Indonesia’s *musrenbang* participatory budgeting).  

  The dispute isn’t resolvable, but it *is* refinable. The goal shouldn’t be consensus on the word "corruption," but **shared clarity on how to strengthen governance without destroying social fabric**. As one reformist Nigerian official put it: *"We must distinguish between ‘grease’ and ‘graft’—and fix the machine so it needs less grease."*
