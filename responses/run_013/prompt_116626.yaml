  For the stability question:  
  If persons are 4D and lack haecceities, why wouldn’t fundamental particles—arguably also 4D perdurants—lack them too? Likely reply: Particles have primitive identity. Follow-up: Isn’t that haecceitism, which your person-view rejects?  

  For contextualism:  
  If "Humphrey could win" depends on context (e.g., voting vs. assassination counterparts), doesn’t that make modality speaker-relative? Likely reply: Context fixes the similarity relation. Follow-up: Then is there a fact about Humphrey’s *actual* possibilities, or just contextual truths?  

  Translation problem:  
  In QML, ◇∃x(Fx) implies an actual thing with a property in another world. Counterpart theory says: something *here* has a counterpart *there* with F. What’s lost? Likely reply: Direct transworld identity. Follow-up: But if the counterpart relation is similarity-based, doesn’t that confuse representation (how we track objects) with reality (what they are)?  

  Notational variant:  
  If some entities use transworld identity, why not all? Isn’t the particle-half just traditional Kripke? Likely reply: Hybridity reflects ontological differences. Follow-up: Then why call it "counterpart theory" for persons? Isn’t it just Kripke for particles and Lewis for persons?  

  Structuring the questions:  
