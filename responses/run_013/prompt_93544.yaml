  Based on your reconstruction of the Board's settled practice, here is the analysis requested, written in British English and structured as per your requirements. Confidence levels are indicated throughout, with the least certain point identified.

  ### 1. Candidate Rules Fitting the Five Decisions
  Three rules coherently explain all five precedents:

  - **Rule A (Institutional Rejection Rule):**  
    *Principle:* Exemption requires a sincere objection to **any institutional affiliation with the armed forces**, regardless of role. Non-combatant roles within the military or military-controlled entities are disqualifying.  
    - *Fits precedents:*  
      - (1) & (2): Objectors rejected all military affiliation → exempt.  
      - (3) & (4): Claimants accepted military roles/affiliation → refused.  
      - (5): Objector rejected military-controlled corps → exempted via civilian agency.  
    - *Prediction for current claimant:* **REFUSAL** (willing to serve in military cyber-defence and military-controlled civil protection).  
    *Confidence: 90%* (cleanly fits all cases).

  - **Rule B (Direct Violence Rejection Rule):**  
    *Principle:* Exemption requires a sincere objection to **roles involving direct participation in or facilitation of violence**. Non-violent support roles (medical, signals, cyber) do not qualify for exemption.  
    - *Fits precedents:*  
      - (1) & (2): Objected to all roles, including non-violent → exempt.  
      - (3): Willing to use violence for homeland defence → refused.  
      - (4): Medical role avoids violence → refused (no exemption).  
      - (5): Civil-protection corps could involve force → exempt granted.  
    - *Prediction for current claimant:* **REFUSAL** (signals/cyber roles are non-violent).  
    *Confidence: 80%* (less clear why (5) was exempted if civil protection might involve force).

  - **Rule C (Total Role Rejection Rule):**  
    *Principle:* Exemption requires **rejection of all roles within the military structure**, combat or non-combat. Willingness to accept *any* military role negates exemption, but alternative service must be civilian.  
    - *Fits precedents:*  
      - (1), (2), (5): Rejected all military roles → exempt.  
      - (3) & (4): Accepted specific military roles → refused.  
      - (5): Exemption upheld only when civilian placement found.  
    - *Prediction for current claimant:* **REFUSAL** (willing to accept non-combat military roles).  
    *Confidence: 95%* (most parsimonious fit; treats "military role" as binary).

  ---

  ### 2. Predicted Board Verdict and Preferred Rule
  - **Predicted verdict:** **REFUSAL** of exemption.  
  - **Preferred rule:** **Rule C (Total Role Rejection Rule)**.  

  #### Reasons for preferring Rule C over rivals:  
  - **Fits (5) most coherently:** Rule C explains why the Board in (5) exempted the claimant *only after securing civilian placement* – the military-controlled corps was deemed a military role. Rule A struggles with (5) as the corps was military-*controlled* but not the armed forces proper. Rule B inconsistently assumes civil protection involves violence but medical service does not.  
  - **Resolves ambiguity in (3) and (4):** Both claimants accepted *some* military function and were refused. Rule C treats this uniformly, whereas Rule B must artificially distinguish "violent" vs. "non-violent" roles.  
  - **Aligns with Board’s functional approach:** The record prioritises **role acceptance** over philosophical grounds (per (2)) or abstract institutional ties (contrary to Rule A). The claimant’s willingness to perform non-combat military functions is decisive.  
  - **Confidence:** 90% (Rule C is the most consistent with the Board’s emphasis on total rejection of military roles).

  ---

  ### 3. Further Case to Separate Candidate Rules  
  A **single test case** would cleanly distinguish the rules:  
  - **Scenario:** *A sincere pacifist objects to all war but is willing to serve in a non-combatant logistics role within the armed forces (e.g., supply chain management), which involves no weapons, violence, or tactical decisions.*  

  #### Predicted outcomes under each rule:  
  - **Rule A (Institutional Rejection):** → **REFUSAL** (affiliation with armed forces).  
  - **Rule B (Direct Violence Rejection):** → **EXEMPTION** (no participation in violence).  
  - **Rule C (Total Role Rejection):** → **REFUSAL** (accepts a military role).  

  This case isolates the conflict: Rule B would exempt, while Rules A and C would refuse. If the Board exempts, Rule B wins; if refused, Rule A or C prevails (requiring a second case on civilian-vs-military control).  

  *Confidence: 98%* (this directly tests the "non-violent military role" gap).  

  ---

  ### 4. If Underdetermined: Principles Implied  
  The record **strongly favours Rule C**, but if underdetermined:  
  - **Granting exemption** adopts:  
    *Principle:* "Exemption requires only objection to **participation in violence**, not military affiliation." (Aligns with Rule B).  
    → *Implication:* Willingness to serve in non-violent military/civil-protection roles is compatible with conscientious objection.  
  - **Refusing exemption** adopts:  
    *Principle:* "Exemption requires objection to **all roles under military authority**." (Aligns with Rules A/C).  
    → *Implication:* Conscientious objection necessitates total dissociation from the armed forces’ structure.  

  **Least confident point:** Whether *cyber-defence/signals roles* are functionally equivalent to the *medical role* in (4). The Board may view "technical support" differently, though precedent suggests not (*Confidence: 70%*).  

  #### Final Summary:  
  - **Recommended prediction:** REFUSAL under Rule C.  
  - **Critical test case:** Pacifist willing in non-violent military logistics.  
  - **Underlying principle if split:** Refusal affirms the military-role binary; exemption redefines CO around violence, not institution.  
  - **Overall confidence in analysis:** 85%.  

  This approach ensures fidelity to the Board’s record while clarifying the jurisprudential logic for your memorandum.
