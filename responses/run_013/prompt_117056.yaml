prompt: |-
  I'm part of a small grant panel deciding where to put roughly three years of one philosopher's time -- postdoc, strong in ethics and metaphysics, no empirical work. We've settled on the doing/allowing distinction, but neither of us wants the trolly-loop canon again; we think the live stuff is elsewhere. Two threads keep coming up: whether the distinction survives being applied to agents that aren't persons -- large institutions, and increasingly AI systems that mostly 'act' by setting defaults and choosing what to attend to -- and whether 'letting die' is really one thing or a bundle (failing to prevent, failing to rescue, refusing to sustain, standing by). Which open questions in this area should we prioritise over those three years, in what order, and why? I want the reasoning more than the list: which questions are upstream of which, which are tractable for one person working alone, and what would move a question up or down the ranking. And which supposedly central questions should we deprioritise because settling them wouldn't change much downstream?
reasoning: |-
  Okay, let me start by really unpacking the user's query. They're part of a grant panel deciding on funding for a philosopher focused on ethics and metaphysics, specifically the doing/allowing distinction. They want to avoid the trolley problem and explore two main threads: non-person agents (like institutions and AI) and the nature of "letting die." The user needs a prioritized research agenda for three years, with reasoning on what's upstream, tractable, and impactful.

  First, I need to understand the core goals. The panel wants fresh, impactful research that moves beyond traditional debates. They mentioned avoiding trolley problems, so relevance to modern issues is key. The two threads suggest a need for conceptual clarification, especially in new contexts like AI and institutions, and dissecting "letting die" into its components. 

  Looking at the non-person agents thread, this is crucial because institutions and AI systems operate differently from individuals. Their actions involve systemic structures and defaults, which might challenge existing ethical frameworks. The user probably wants to ensure the research addresses real-world applications, like corporate responsibility or AI ethics. The mention of AI setting defaults hints at the need to analyze how passive mechanisms in technology lead to harm, which isn't covered in current literature.

  Then there's the "letting die" aspect. The user suspects it's a bundle of different concepts. Unpacking this could clarify moral responsibilities in various scenarios, like healthcare or disaster response. This ties into policy and practical ethics, so showing how the research impacts these areas would be important.

  The user’s deeper needs might include wanting the research to have tangible outcomes, influence policy, or provide frameworks applicable beyond academia. They might also want the philosopher to produce work that’s interdisciplinary, engaging with tech, law, or public policy. Avoiding "won't change much" questions means prioritizing issues where new insights lead to significant shifts in understanding or application.

  Next, I should assess which questions are upstream. Upstream issues are foundational; solving them could resolve multiple downstream problems. For example, defining agency for non-persons affects both institutional and AI ethics. Similarly, clarifying the structure of "letting die" could inform debates on euthanasia or resource allocation. 

  Tractability is another factor. The philosopher is working alone, so projects requiring extensive empirical data might be less feasible. Instead, conceptual analysis or developing frameworks based on existing case studies would be more manageable. For instance, analyzing AI defaults using tech ethics literature doesn't need new data, just careful philosophical scrutiny.

  Impact is key. Questions that, once answered, could settle multiple debates should be prioritized. For example, if the structure of allowing is clarified, it might resolve disputes in medical ethics or international aid. Conversely, debates like the metaphysical grounding of the distinction might be deprioritized if they don't lead to practical changes.

  I need to ensure the proposed plan balances depth and breadth. Year one should tackle upstream, foundational questions to set the stage. Year two applies these insights to specific contexts like AI, testing the frameworks. Year three synthesizes and addresses unresolved issues, ensuring the research has real-world relevance.

  Also, identifying low-priority areas is crucial. Traditional trolley variants or purely semantic debates won't add much. Instead, focusing on modern agents and practical applications aligns better with the panel's goals. The user likely wants the research to contribute to emerging fields, making the philosopher's work relevant and cited across disciplines.

  Finally, the reasoning should highlight why each step matters, how they interconnect, and the expected outcomes. Emphasizing the move from theory to application will show the project's evolution and impact, satisfying the panel's desire for meaningful, forward-thinking research.
answer: |-
  Here’s a prioritised research agenda for the 3-year grant, structured around your constraints and goals, with explicit reasoning on tractability, upstream/downstream relationships, and impact potential. The core aim is to **reframe the doing/allowing distinction for contemporary agency and unpack "letting die" to resolve practical moral dilemmas.**

  ### Core Prioritisation Criteria
  1.  **Upstream First:** Address foundational conceptual questions *before* application. Confusion at the root distorts downstream analysis.
  2.  **Tractability for a Solo Theorist:** Prioritise conceptual analysis, taxonomy building, and logical modelling over projects needing extensive empirical collaboration or massive literature synthesis on tangential fields.
  3.  **High Impact/Leverage:** Focus on questions where clarity resolves *multiple* existing disputes or directly addresses novel, pressing problems (AI, institutional responsibility).
  4.  **Avoiding Low-Leverage Traps:** Deprioritise debates where resolution is either intractable with current tools or wouldn't significantly alter practical reasoning even if resolved.

  ---

  ### The Prioritised 3-Year Agenda

  **Year 1: Foundational Deconstruction & Reconceptualisation (Upstream Focus)**
  *   **Core Question:** *What is the minimal, robust structure of "allowing" (or "omissive causing") that can apply across *all* agent-types (persons, institutions, AI)?*
      *   **Why Upstream & High Leverage:** Everything hinges on a coherent, generalisable concept of "allowing." Current definitions are often anthropocentric (relying on intentions, bodily movements). Without a revised concept applicable to systems that "act" via rules, defaults, and resource allocation (institutions/AI), applying the distinction to them is incoherent. Success here unlocks Years 2 & 3.
      *   **Why Tractable Solo:** Primarily conceptual analysis and logical modelling. Requires deep engagement with core ethics/metaphysics (causation, agency, counterfactuals) and existing D/A literature, but *not* extensive empirical work or new field-building. Can leverage analytic philosophy tools.
      *   **Key Tasks:**
          *   Critically dissect anthropocentric assumptions in current D/A definitions (intent, physicalism, direct control).
          *   Develop a framework based on *normative position*, *capacity*, *control over salient factors*, and *counterfactual dependence*. (e.g., Does an institution "allow" harm if its *ruleset/system design* makes harm more counterfactually dependent on its *inaction* than alternative rule-sets would?).
          *   Rigorously define "system default" as a potential locus of agency for non-persons.
          *   **Output:** A seminal paper proposing a *generalised agency-neutral framework for the allowing side of the D/A distinction*.

  **Year 2: Application I - Dissecting "Letting Die" & Non-Person Agents (Testing the Framework)**
  *   **Core Question 1:** *Using the Year 1 framework, is "letting die" a unified phenomenon, or a disjunctive bundle (failing to prevent, failing to rescue, refusing to sustain, standing by)? What are the morally salient differences between these sub-types?*
      *   **Why Now & High Leverage:** Applying the general framework to the most discussed "allowing" case tests its power. Unbundling "letting die" is crucial for resolving debates in bioethics (withdrawing care vs. not starting it), global poverty (aid vs. structural reform), and disaster response. Clarifying sub-types reveals distinct duties and blame structures.
      *   **Why Tractable Solo:** Builds directly on Year 1. Requires applying the new framework to classic and novel cases of "letting die," identifying necessary and sufficient conditions for each sub-type, and analysing their distinct moral logics (e.g., is "failing to rescue" more akin to a positive duty violation than "failing to prevent"?).
  *   **Core Question 2:** *How does the D/A distinction manifest for institutional agents (governments, corporations) using the Year 1 framework? Does scale/systemicity fundamentally alter the distinction?*
      *   **Why Now & High Leverage:** Institutions are primary actors causing/allowing large-scale harms (climate, poverty, conflict). Applying D/A here is messy but vital. Year 1's framework provides the tools. Success bridges abstract ethics to political/legal philosophy.
      *   **Why Tractable Solo:** Focus on conceptual application and case studies (e.g., Does a government "do" harm via regressive tax policy or "allow" it by not providing welfare? Analyze corporate defaults leading to worker/environmental harm). Avoids deep dive into corporate law/political science.
      *   **Output:** Two major papers: 1) Taxonomy & moral analysis of "letting die" sub-types. 2) Analysis of D/A for institutional agency, demonstrating the framework's utility.

  **Year 3: Application II - AI Agency & Synthesis (High-Impact Novelty)**
  *   **Core Question:** *Can sophisticated AI systems qualify as "agents" within the Year 1 framework, specifically concerning "allowing" harm through default settings, recommendation algorithms, and attention allocation? What are the distinctive features of AI "allowing"?*
      *   **Why High Leverage & Novel:** AI is the emerging frontier where non-person agency is most contested and practically urgent. Defaults and attention are *the* primary modes of AI "action." Getting D/A right here is critical for assigning responsibility, designing ethical AI, and regulation. Directly addresses your panel's interest.
      *   **Why Tractable Solo (Now):** Years 1 & 2 provide the robust conceptual base. The solo theorist engages with key literature in AI ethics/philosophy of AI (focused on agency/responsibility), *not* technical AI development. Focuses on *how* the D/A distinction maps onto AI's unique features: opacity, scale, delegation, learning dynamics. Uses conceptual tools and hypothetical/real AI harm cases.
      *   **Synthesis Task:** *Integrate insights from all three years to produce a comprehensive revised account of the Doing/Allowing distinction fit for the 21st Century, addressing persons, institutions, and AI.*
      *   **Output:** 1) Groundbreaking paper on AI and the D/A distinction (particularly allowing via defaults/attention). 2) A monograph or major synthesis article presenting the unified framework and its implications across domains.

  ---

  ### Explicitly Deprioritised Areas (Low Leverage for Your Goals)

  1.  **Further Refinements of Trolleyology (Especially Loops):** You rightly identified this. Solving intricate trolley variants won't resolve the core conceptual muddles about agency types or "letting die" structure. It's downstream and over-ploughed.
  2.  **The *Metaphysical Grounding* Debate (e.g., Is D/A reducible to causation/difference-making?):**
      *   **Why Deprioritise:** While upstream, this debate is highly intractable and arguably won't yield decisive results in 3 years. Crucially, **a successful *pragmatic conceptual framework* (like the one prioritised in Year 1) can be highly useful *even if* the deepest metaphysical questions remain unresolved.** Resolving the metaphysics wouldn't automatically solve the institutional/AI agency problem or unbundle "letting die" – those require distinct conceptual work *using* metaphysical tools, not necessarily *solving* metaphysics. This is a high-effort, low-leverage (for your goals) trap.
  3.  **Purely Semantic Debates about "Doing":** Obsessing over whether a specific act (e.g., flicking a switch) is definitively "doing" or "allowing" in isolation is less important than understanding the *structure* of allowing and its application to novel agents. Focus on the framework, not boundary skirmishes.
  4.  **Deep Historical Exegesis:** While context is important, a primary focus on reinterpreting Anscombe, Foot, or Bennett is unlikely to yield the novel insights needed for AI/institutional agency. Use them, don't restudy them exhaustively.

  ---

  ### Why This Order & Structure Works

  1.  **Builds Sequentially:** Year 1 creates the essential tool (generalised allowing concept). Year 2 tests it on the most pressing traditional ("letting die") and emerging (institutions) problems, refining it. Year 3 tackles the most novel and complex frontier (AI) and synthesises.
  2.  **Maximises Solo Tractability:** Focuses on core strengths: conceptual analysis, logical reasoning, taxonomy building, and applying philosophical frameworks to cases. Minimises need for massive empirical input or mastering adjacent technical fields deeply.
  3.  **Addresses Your Key Threads Head-On:** The structure explicitly tackles the non-person agents (Institutions Y2, AI Y3) and the "letting die" bundle (Y2) as central pillars.
  4.  **High Potential for Impact:** Outputs target:
      *   Revitalising core ethics debates with a modern framework.
      *   Providing tools for political philosophy, legal theory, and corporate ethics regarding institutional responsibility.
      *   Making foundational contributions to the urgent field of AI ethics.
      *   Clarifying persistent confusion in bioethics and global justice around duties to aid/prevent/sustain.
  5.  **Avoids Sunk Costs:** Minimises time on trolleys and intractable metaphysical grounding, directing energy towards questions where progress directly enables clearer thinking on modern problems.

  This agenda positions the philosopher to make significant, field-advancing contributions by tackling the most upstream, tractable, and high-leverage open questions you've identified, while deliberately sidelining debates unlikely to yield practical or conceptual clarity relevant to your core interests within the timeframe.
