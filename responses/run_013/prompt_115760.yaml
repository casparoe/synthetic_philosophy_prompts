  Below is a complete 55-minute session plan designed as a self-teaching activity. The rules and payoffs create the philosophical tension without upfront explanation. I've refined your structure to ensure the "rational irrationality" moment emerges through gameplay. Materials are index cards, candy (e.g., Skittles), and a whiteboard.

  ---

  ### **Materials & Setup**
  - **Index cards**:  
    - 16 role cards (8 "DRIVER", 8 "TRAVELER") × 2 rounds  
    - 16 commitment cards (8 "COMMITTED", 8 blank)  
    - 16 pairing slips (for Traveler names)  
  - **Candy**:  
    - Give each player **3 candies** as starting endowment.  
    - Bowl for commitment payments.  
  - **Whiteboard**:  
    - **Payoff Table** (write this verbatim):  

  | Role          | Situation                          | Candy Earned/Lost |  
  |---------------|------------------------------------|-------------------|  
  | **Driver**    | Stop & get paid                    | +2 candies        |  
  |               | Stop & **not** paid                | –1 candy          |  
  |               | Don’t stop                         | 0                 |  
  | **Traveler**  | Ride & pay                         | +1 candy          |  
  |               | Ride & **don’t** pay               | +4 candies        |  
  |               | No ride                            | 0                 |  
  | **Commitment**| Buy badge (Round 2 only)           | –1 candy          |  

  ---

  ### **Session Flow (55 min total)**

  #### **Round 1: The Problem (15 min)**  
  *Goal: Players experience the rational-but-bad outcome.*  
  1. **Role Assignment (3 min)**  
     - Shuffle 8 DRIVER/8 TRAVELER cards. Players draw secretly.  
     - *Facilitator:* "Drivers, decide privately: STOP or DON’T STOP. Write choice on a card and hand to me."  
  2. **Pairing & Traveler Choice (5 min)**  
     - Collect Traveler names in a bowl. Each Driver draws one name (random pairing).  
     - *Facilitator:* "If your Driver stopped, decide privately: PAY or DON’T PAY. Write choice and hand to me."  
  3. **Outcome & Payout (7 min)**  
     - Announce pairs where Driver stopped. For each:  
       - If Traveler paid: Driver +2, Traveler +1.  
       - If Traveler didn’t pay: Driver –1, Traveler +4.  
     - Drivers who didn’t stop: 0.  
     - *Expected result:* Most Drivers don’t stop (fearing non-payment), leading to 0–2 rides. Distribute candy immediately.  

  ---

  #### **Commitment Phase (10 min)**  
  *Goal: Players invest in restricting future choices.*  
  1. **Voting & Cost (4 min)**  
     - *Facilitator:* "Before Round 2, everyone votes on a rule for the rest of the game. You must follow your vote."  
       - **Option A (No Commitment):** No cost. Travelers choose freely.  
       - **Option B (Commitment Badge):** Pay 1 candy. If a Traveler, you MUST PAY if your Driver stops."  
     - Players vote anonymously (slips in a bowl). Tally votes on the board.  
  2. **Purchase & Badges (6 min)**  
     - Players who voted for Option B pay 1 candy to the bowl and get a "COMMITTED" card (must display visibly).  
     - *Facilitator:* "This is binding. If you’re a Traveler and your Driver stops, you have no choice—you pay."  

  ---

  #### **Round 2: The Commitment Effect (15 min)**  
  *Goal: Committed players "win"; uncommitted lose.*  
  1. **Role Assignment (3 min)**  
     - Redraw roles (new DRIVER/TRAVELER cards).  
     - *Facilitator:* "Drivers, you’ll see your Traveler’s commitment status before deciding."  
  2. **Pairing & Driver Choice (5 min)**  
     - Pair Drivers/Travelers randomly (as Round 1).  
     - *Facilitator:* "Drivers, look at your Traveler. If they have a COMMITTED badge, you know they MUST PAY if you stop. Decide: STOP or DON’T STOP."  
  3. **Outcome & Payout (7 min)**  
     - For stopped pairs:  
       - COMMITTED Travelers: Automatically pay (Driver +2, Traveler +1).  
       - UNCOMMITTED Travelers: Choose PAY/DON’T PAY (as Round 1).  
     - *Expected result:* Drivers stop only for COMMITTED Travelers. UNCOMMITTED Travelers get few/no rides.  

  ---

  ### **Debrief (15 min)**  
  *Let players react first. Then connect to philosophy.*  

  1. **What Happened? (5 min)**  
     - Ask:  
       - "Round 1: Why did most Drivers not stop? Why did Travelers who *could* pay often not do it?"  
       - "Round 2: Why did Drivers stop for COMMITTED Travelers? Why did UNCOMMITTED players get fewer rides?"  
     - Highlight:  
       - *Driver’s reasoning*: "Stopping is risky if Travelers might defect. No stop = safe 0."  
       - *Commitment effect*: "Badges made payments certain, so Drivers stopped. Paying the cost was ‘rational’."  

  2. **Map to Parfit’s Hitchhiker (5 min)**  
     - **Uncontested ideas** (write on board):  
       - *The core problem*: At the payment moment, paying feels irrational (you gain nothing).  
       - *Commitment device*: A tool (like the badge) to restrict future choices.  
       - *Outcome matters*: Without commitment, both lose (no rides). With it, both gain.  
     - **Contested ideas** (identify clearly):  
       - *Rational irrationality*: "Is it ‘rational’ to make yourself ‘irrational’ at the payment moment? Philosophers debate this. Some (e.g., Derek Parfit) say yes—it saves you. Others say rationality must be consistent over time."  
       - *Reputation*: "Someone might say, ‘This is about reputation!’ But in Parfit’s desert, you’re strangers. Reputation isn’t possible. Our game had anonymity in Round 1 to mirror this."  

  3. **Limitations & Tensions (5 min)**  
     - **What the game simplifies**:  
       - Real commitments (e.g., morals, habits) aren’t bought with candy—they’re built over time.  
       - Badges made intentions visible. In the desert, the hitchhiker must *be* trustworthy, not just signal it.  
     - **Predictable issues & fixes**:  
       - *Overly nice players*: If Travelers pay in Round 1 "to be fair," note: "In this setup, that’s costly to you (+1 vs. +4). Why do it?" Use it to discuss ethics vs. self-interest.  
       - "It’s just reputation!": Clarify: "Reputation needs repeat interactions. This was one-shot—like the desert."  
       - *Drivers stopping for UNCOMMITTED*: If it happens, ask: "Why take the risk? Would you in real life?"  

  ---

  ### **Why This Works**  
  - **Rules teach**: The payoff table forces Travelers to defect (Round 1) and Drivers to avoid stops. Commitment badges shift incentives visibly.  
  - **Tension emerges**: COMMITTED players get rides; UNCOMMITTED don’t. Players *feel* the value of limiting choices.  
  - **No lecturing**: The "rational irrationality" moment hits when UNCOMMITTED players realize they saved 1 candy but lost 1–4 by missing rides.  

  ### **Adjustments for Clarity**  
  - **Candy math**: Endowment covers losses. Round 2 commitment cost (–1) is offset by Traveler pay (+1), netting committed players 0–1 if they ride—but they *only* ride if committed.  
  - **Anonymity**: Pairing is random/secret to prevent reputation. Badges in Round 2 aren’t "reputation"—they’re enforced rules.  
  - **Time crutch**: If pairing lags, pre-assign numbers (1–16) and use these for matching.  

  This session makes Parfit’s tension visceral. Players leave arguing whether "tying your hands" is wise—which is the point.
