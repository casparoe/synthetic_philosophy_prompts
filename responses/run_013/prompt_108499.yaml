prompt: |-
  I recently became chair of a small tenants' association, and I have been trying to describe something that happens there without the vocabulary I would need. The bins go on the left side of the shed because the first person to use the shed put them there; now everyone does it, new tenants are corrected if they put them on the right, and when the shed was rebuilt and the right side became more convenient, the bins still went back to the left. No one voted on it, no one can give a reason for it beyond the fact that it is what we do, and yet people treat a suggestion to move them as a small breach rather than a preference. In another group I am in, the meeting is at 7pm because that suited the founder; the founder left years ago, 6pm would suit everyone better, but proposing the change feels like proposing something improper, and if enough people did switch, the new time would become the correct one with the same felt authority. I know about conventions as solutions to coordination problems, and about social norms as rules enforced by disapproval, but each seems to capture only half of this: the first explains the arbitrary origin and self-reinforcement but not the felt ought, the second explains the felt ought but not the arbitrary, self-sustaining, reversible coordination structure. Is there an established name for this exact hybrid, and how does it differ from a Lewisian convention, a social norm, a mere custom, a Schelling point, and a Nash equilibrium? If there is no established term, coin one and define it, with boundary cases and a clear account of what it is not. I do not need citations or a reading list; I need the carving. Please give the answer as a JSON object with the following fields: verdict (whether an established term exists), nearest_concepts (an array of objects, each with name, relation, and disanalogy), proposed_term (if none, your coinage; otherwise the established term), definition (a precise definition), boundary_cases (an array of cases and which side of the line they fall on), and why_not (an array of objects with concept and difference).
reasoning: |-
  We are looking for a term that describes a pattern of behavior that is:
    1. Arbitrarily established (e.g., by historical accident).
    2. Self-reinforcing because everyone expects it and acts accordingly.
    3. Carries a sense of obligation or "oughtness" (so that deviations are seen as breaches, not just inconveniences).
    4. Reversible in principle (if enough people switched, the new pattern would become the norm with the same sense of obligation).

  We note:
    - It is a solution to a coordination problem (like a Lewisian convention) because it helps avoid conflict and coordinate actions.
    - It has a normative element (like a social norm) because people feel they ought to follow it and enforce it.

  But:
    - Lewisian conventions (after David Lewis) are patterns that are arbitrary, self-perpetuating, and solve coordination problems, but they do not necessarily carry a sense of obligation. They are often followed because it is in one's self-interest given others' behavior, not because one feels one "ought" to.
    - Social norms typically have a stronger element of enforcement and often have a moral or social sanction attached. However, they may not be arbitrary in the same way (e.g., norms against stealing are not arbitrary) and they are not necessarily reversible by simple re-coordination.

  Other concepts:
    - Mere custom: A habitual practice without the normative force. In the examples, there is a normative element (correcting new tenants, feeling that change is improper).
    - Schelling point (or focal point): An equilibrium that people naturally converge to in the absence of communication because it is salient. It is arbitrary and self-reinforcing, but again, without the normative force. The bin location might have started as a Schelling point, but now it has normative force.
    - Nash equilibrium: A set of strategies where no player can do better by unilaterally changing. The bin placement is a Nash equilibrium (if everyone else puts bins on the left, I do too). But again, it doesn't necessarily have the normative force.

  The key is the combination of arbitrariness, self-reinforcement, and the normative "ought".

  Is there an established term?
    - The term "institution" is sometimes used broadly, but it is too vague and often refers to more formal structures.
    - "Convention" in the Lewisian sense is close but lacks the normative force. However, some scholars (like Cristina Bicchieri) have argued that conventions can have normative force when they are perceived as normative. But the term "convention" is often used without the normative element.

    - The term "social norm" is often defined to include conventions that have normative force. For example, Bicchieri (in "Norms in the Wild") distinguishes between social norms (which are conditional on others' following and having normative expectations) and conventions (which are not). In her view, a convention is a norm when people believe they ought to conform and expect others to conform and approve or disapprove accordingly.

    However, note that in the examples, the norm is entirely arbitrary and reversible by re-coordination. This is a particular kind of social norm: one that is arbitrary and solves a pure coordination problem.

    In fact, Lewis himself acknowledged that conventions can become norms. But the term "convention" is still the primary term.

    But let's consider: the problem states that Lewisian convention captures the arbitrary origin and self-reinforcement but not the felt ought, and social norm captures the felt ought but not the arbitrary coordination structure.

    There is a term for a convention that has acquired normative force: a "normative convention". However, this is not a single established term.

    Another candidate: "injunctive norm" (as opposed to a descriptive norm) but that doesn't capture the arbitrary coordination aspect.

    After reflection, I believe the established term that comes closest is "convention" as used by some contemporary social scientists (like Bicchieri) who include the normative element in some conventions. However, the philosophical definition by Lewis did not require the normative element.

    Therefore, we might say that the phenomenon is a "normative convention" or a "convention with normative force".

    But note: the phenomenon is exactly what Bicchieri calls a "social norm" that is also a convention. She writes: "Conventions are a special type of social norm: they are norms that solve coordination problems."

    So, according to Bicchieri, the example is a social norm that is also a convention.

    However, the problem asks for the exact hybrid and how it differs.

    Given the above, I think the most accurate established term is **"convention"** in the broader sense that includes normative force, but note that this usage is not universal.

    Alternatively, if we require a single term that unambiguously captures both, we might have to coin one.

    Verdict: There is no single, universally established term that exactly captures this without ambiguity. The term "convention" is often used without the normative force, and "social norm" is often used for non-arbitrary norms.

    Therefore, I propose to coin a term.

  Proposed term: **normative coordination equilibrium**

  Definition:
    A normative coordination equilibrium is a pattern of behavior that:
    1. Arbitrarily emerged as a solution to a coordination problem (i.e., there are multiple equilibria that would have been equally good).
    2. Is self-reinforcing: each individual's incentive to follow it increases as more others follow it (because it coordinates actions and avoids conflict).
    3. Has acquired normative force: individuals believe they ought to follow it and expect others to follow it, and deviations are met with disapproval (even if mild) as a breach of an obligation, not merely as a mistake or a preference.
    4. Is reversible: if a sufficient number of individuals (typically a critical mass) start following a different pattern, the new pattern can become the new equilibrium with the same normative force.

  Boundary cases:
    1. Driving on the left in the UK: 
        - This is a Lewisian convention and also a law. It is arbitrary and self-reinforcing. But note: it has normative force (people feel they ought to drive on the left, and they disapprove of driving on the right). However, it is not easily reversible by the group because it is legally enforced. So it falls on the side of being a normative coordination equilibrium only if we consider the normative force beyond the law. But if the law were absent, it would be a normative coordination equilibrium. So in the absence of legal enforcement, it would be a clear case. But in reality, it is also a law. So we might say it is a normative coordination equilibrium that has been codified.

    2. A company's dress code that is written in the employee handbook: 
        - This is not arbitrary in the same way because it is formally established. It has normative force (employees feel they ought to follow it) and it is a coordination device (everyone knows what to wear). However, it was not arbitrarily emerged but was set by authority. So it falls outside.

    3. Saying "bless you" when someone sneezes: 
        - This is a custom that has normative force (it feels rude not to say it) and is arbitrary. But it doesn't solve a coordination problem in the same way (it's not about coordinating actions to avoid conflict). Therefore, it is a social norm but not a coordination equilibrium. So it falls outside.

    4. A group of friends always meeting at cafe A because that's where they first met. Now they always go there, and if someone suggests cafe B, it feels like a breach. 
        - This is a normative coordination equilibrium: arbitrary origin, coordinates their meeting, has normative force (feels improper to change without good reason), and if they started going to cafe B, it would become the new norm.

  Why not the other concepts? (in the why_not array)

    - Lewisian convention: A Lewisian convention lacks the normative force. It is followed because it is in one's self-interest to coordinate, not because one feels an obligation. In the bin example, if it were only a Lewisian convention, a new tenant putting the bin on the right would be seen as a mistake (and corrected for efficiency) but not as a breach of an obligation.

    - Social norm: A social norm may not necessarily arise from a coordination problem. For example, norms of reciprocity or fairness are not arbitrary in the same way. Also, social norms might not be reversible by simple re-coordination (e.g., a norm against stealing cannot be changed by the group deciding to start stealing).

    - Mere custom: A custom lacks the normative force and the element of enforcement. For example, a custom of eating turkey on Thanksgiving is just a habit; if someone eats chicken, they are not seen as breaching an obligation.

    - Schelling point: A Schelling point is a focal point that helps people coordinate without communication, but it does not necessarily have normative force. For example, meeting at the only fountain in a park is a Schelling point, but if people start meeting elsewhere, there is no sense of breach.

    - Nash equilibrium: The bin placement is a Nash equilibrium (each person, given that others put bins on the left, has no incentive to put them on the right). But the concept of Nash equilibrium is too broad and does not capture the arbitrary origin, the coordination problem context, or the normative force.

