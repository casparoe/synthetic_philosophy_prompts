answer: |-
  ## Signal Pantoum

  My pulse for what prowls beyond the reeds—
  Not the ripple, but the shadow deep below.
  My meaning etched in ancient, urgent deeds,
  A call to arms the ancestors well know.

  Not the ripple, but the shadow deep below
  Demands this sharp alarm, this sudden shout.
  A call to arms the ancestors well know,
  Though the world is changed, there is no doubt.

  Demands this sharp alarm, this sudden shout?
  I flare at shapes that bear the wrong design.
  Though the world is changed, there is no doubt
  This frantic beat is not a new-made sign.

  I flare at shapes that bear the wrong design—
  A trembling leaf, a drifting, harmless log.
  This frantic beat is not a new-made sign,
  But broken work, a failing, choking cog.

  A trembling leaf, a drifting, harmless log...
  My meaning etched in ancient, urgent deeds?
  But broken work, a failing, choking cog.
  No past to borrow. My own flicker heeds...

  ---

  **Why this works for your seminar:**

  1.  **Voice of the Signal:** The poem speaks as the internal state ("My pulse," "this sharp alarm," "I flare," "This frantic beat," "flicker").
  2.  **Distal Cause Focus:** Explicitly contrasts the "shadow deep below" (distal predator) with the "ripple" (proximal stimulus) and later "trembling leaf" or "harmless log" (incorrect proximal triggers).
  3.  **Malfunction vs. Meaning Change:** "I flare at shapes that bear the wrong design" and "But broken work, a failing, choking cog" clearly frame incorrect tokening as *failure* ("broken," "failing") to perform its proper function, not a shift in meaning. The "wrong design" triggers the same old signal.
  4.  **History as Hostage:** "My meaning etched in ancient, urgent deeds," "A call to arms the ancestors well know," and "No past to borrow" emphasize the dependence on an inaccessible historical function ("etched," "ancestors knew") for current content.
  5.  **Pantoum Structure & Teleosemantic Analogy:** The recycling lines force meaning to shift contextually with each repetition, mirroring how historical function imbues present tokens with inherited content. Line 2 ("Not the ripple...") becomes a justification in Stanza 2, a demand in Stanza 3, and a contrast in Stanza 4. Line 3 ("A call to arms...") shifts from description to assertion.
  6.  **Structural Break = Content Failure:** The final stanza deliberately breaks the pantoum's closure rule. The *expected* return of Line 1 ("My pulse for what prowls beyond the reeds—") is missing. Instead, the signal confronts the severed lineage: "My meaning etched in ancient, urgent deeds?" becomes a desperate, unanswered question, leading to the isolated, purposeless flicker of "No past to borrow. My own flicker heeds...". This starkly embodies Swampman (no history) or radical co-option (severed functional lineage).
  7.  **Conciseness & Focus:** Five quatrains, focused purely on the signal's internal experience and its relationship to function and history. No jargon, no names, just the core phenomenological and functional struggle.
  8.  **Poetic Over Didactic:** Uses imagery (prowling shadows, trembling leaves, choking cogs, flickering) and the inherent tension of the broken form to evoke the conceptual difficulty, rather than lecturing about it. The final, fragmented lines *feel* the failure of content without naming it.
