prompt: |-
  I am planning a one-semester research leave with a single co-author, and I need to decide what we should work on. Our target is the chance-credence relation: the family of principles governing how a rational agent's degrees of belief should answer to objective chance. My co-author is a mathematically fluent epistemologist; I am a philosopher with solid formal training but no research-level probability theory. We can finish one substantial paper, or two short ones, and we can afford to spend the first month reading.

  I want a defended agenda, not a survey: a ranking of the open questions, with the criteria you are using stated explicitly and the trade-offs among them made visible. Please work within the following map of the terrain, which is my own way of carving it up, and tell me where the carving is wrong.

  Four loci at which a deference-to-chance claim can be located:

  1. Credence-deference. A constraint on credences: when your evidence includes the proposition that the chance of A is x, your credence in A should be x, except for whatever contribution is made by evidence that is inadmissible for this purpose. The open work here is (a) characterising inadmissibility without circularity, and (b) determining whether the constraint is a full-blown rational requirement or only a defeasible default that other epistemic considerations can override.

  2. Constitutive analysis. The stronger claim that this constraint is not an extra norm laid on top of chance but is partly constitutive of what makes a quantity a chance at all, chance being whatever plays this role in rational credence. The open work is whether anything substantive follows from this, or whether it merely relocates the question into what else must be true of the chance-making facts.

  3. Decision-deference. The claim that chance enters rational choice directly rather than through credence: that a chance of x licenses treating A as a fair bet at odds x:(1-x), even where the credence that should guide the choice is something else. The open work is whether this is a distinct principle or a corollary of (1), and how it interacts with the split between evidential and causal reasoning.

  4. Social deference. The same schema applied to deference to another agent's opinion rather than to a chance function, with the analogue of admissibility doing the heavy lifting. The open work is whether the chance case is a special case of a general deference principle or a different kind of thing that merely resembles one.

  Now the prioritisation. Assume the question is which of these to spend the semester on, with the aim of producing work that others in this area will have to engage with in five years, not merely a competent contribution. I want:

  - A ranked ordering of the open questions, including sub-questions I have not listed, with each item's rank defended on the criteria you name. I expect those criteria to include how many other questions in the neighbourhood depend on the answer, how tractable each question is for a team with our particular division of labour, and how thoroughly the existing literature has already covered it.

  - Explicit treatment of the undermining problem: on some accounts of chance, the chance hypothesis itself can assign positive probability to a future in which the chance-making facts are different, so that strict deference to the chance hypothesis can require a credence that undermines it. Say whether this forces a self-referential reformulation of the principle, whether anything of the original principle survives that reformulation, and whether this issue is upstream or downstream of the four loci above.

  - A judgement about which of the apparent open questions are genuine and which are verbal or terminological, and hence where the semester would be wasted.

  - The downstream reach: for each high-ranked question, name the neighbouring debates whose resolution would be affected — self-locating credence, the interpretation of probability in physics, the epistemology of testimony, rational choice under uncertainty — and say which of those connections are load-bearing and which are decorative.

  - An explicit statement of what would move an item up or down your ranking: a result, an argument, a counterexample, or a change in what the literature has settled. End with the two developments over the coming year that would most change your ordering.

  Do not give me citations or a reading list; I want the reasoning behind the ordering, not the sources. If the honest answer is that the top-ranked question is not on my list at all, say so. Where you think my four-locus map distorts the terrain, re-carve it, but then rank within your own carving.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosopher with formal training planning a focused research leave on chance-credence relations, seeking a defended prioritization of open questions. Their four-locus framework provides a solid starting point, but I need to evaluate and possibly reshape it while ranking research avenues.

  First, assessing their framework: The four loci are well-chosen but the boundaries need adjustment. Credence-deference (1) and constitutive analysis (2) are deeply intertwined – we can't cleanly separate "what chance requires" from "what chance is." Decision-deference (3) feels subordinate rather than parallel; it's likely derivable from (1) unless we're dealing with exotic cases like self-undermining chances. Social deference (4) is actually the more fundamental category, with chance deference as a special case where we have maximal information about the deference target.

  The undermining problem is crucial – it's not just a technical issue but exposes foundational tensions. For Lewis' original Principal Principle, the undermining objection forced major revisions leading to the New Principle. This suggests that any adequate account must either restrict chance's domain (making undermining impossible) or build self-consistency directly into the deference rule. The New Principle's "crystal ball" conditional chance approach resolves this technically but leaves philosophical questions about why chance deserves this privileged deference.

  Now for prioritization criteria: Impact should weigh most heavily – which solution would reshape multiple debates? Tractability matters given the team's skills; the mathematician co-author can handle formal heavy-lifting while the philosopher probes conceptual foundations. Current saturation is key – some areas like admissibility have been picked over extensively. 

  Top questions would be:
  1) The constitutive-undermining knot: How can we formulate a deference principle that simultaneously defines chance's nature and handles self-undermining? Resolving this would affect interpretations of quantum probabilities and self-locating beliefs. The team's combined skills are perfect for this – the mathematician can model consistency constraints while the philosopher examines metaphysical implications.

  2) The status of chance deference: Is it defeasible? This connects to wider epistemology about whether rational norms have exceptions. It's less saturated than admissibility debates but requires careful conceptual work – ideal for the philosopher's strengths.

  3) Social deference foundations: Positioning chance as a limit-case of expert deference could unify social epistemology and chance-based reasoning. This has direct implications for testimony models but may be too broad for one semester.

  Lower priority: Decision-deference seems derivative unless new arguments emerge showing its independence. Admissibility characterization has diminishing returns after Lewis and successors.

  The biggest opportunity is reframing chance deference as constitutive through the lens of self-consistency requirements. A successful account here wouldn't just solve technical problems but could show why objective probabilities deserve unique epistemic authority – potentially influencing how we interpret probabilistic laws in physics. If new work emerges proving that no consistent chance function can be self-undermining, that would simplify the landscape dramatically. Alternatively, if philosophers of physics reject the need for deference principles altogether, that could collapse the project – but current trends suggest the opposite.
answer: |-
  Here is a prioritized research agenda based on your framework, with explicit criteria, terrain adjustments, and downstream impacts. I've re-carved aspects of your map where necessary and ranked questions by **impact** (how many debates it anchors), **tractability** (fit for your team's skills), and **saturation** (how mined-out the topic is). The undermining problem is central, not downstream.

  ### Revised Terrain Map
  1. **Constitutive-Deference Knot** (Merges your 1 & 2):  
     The core question is whether the deference norm *defines* chance (constitutive) or *responds* to it (regulative). This dissolves the distinction between your loci 1 and 2 – constitutive claims *entail* that deference isn't merely defeasible but *built into chance's identity*. The undermining problem is an acid test here.

  2. **Deference Scope** (Replaces your 3 & 4):  
     Decision-deference and social deference are special cases of "what warrants deviation from credence-deference?" This frames both as challenges to the *universality* of chance's authority. Social deference isn't merely analogous; it tests if chance is uniquely privileged.

  3. **Admissibility** (Subsumed under Constitutive-Deference):  
     Not a standalone locus. Inadmissibility isn't "circular" if defined *via* the constitutive role: evidence is inadmissible iff it reveals non-chance facts that screen off chance’s authority. Its tractability depends on the constitutive solution.

  ---

  ### Ranked Open Questions (with Criteria Weighting)
  **Impact** (I): Resolves >1 major debate or foundational tension.  
  **Tractability** (T): Leverages your team’s strengths (math/epistemology synergy; avoids advanced stochastic calculus).  
  **Saturation** (S): Low = underexplored; High = diminishing returns.  

  1. **The Self-Undermining Constraint (Constitutive Edition)**  
     - *Question*: Can a consistent constitutive account of chance avoid self-undermining while preserving non-trivial deference?  
     - *Rank Defense*:  
       - **Impact (High)**: Directly tests if chance can be both objective and constitutively tied to rationality. Failure here collapses most deference projects. Downstream effects:  
         - *Load-bearing*: Quantum interpretation (if chances undermine themselves in Everettian QM), self-locating credence (if chances indexically undermine).  
         - *Decorative*: Testimony (illuminates expert authority but not decisively).  
       - **Tractability (High)**: Your co-author handles New Principle-style formalisms (e.g., \( \text{cred}(A | \text{ch}(A)=x \land \text{theory} T) = x \)); you dissect "rational survivability" of undermined theories.  
       - **Saturation (Low-Medium)**: Lewis’s New Principle is a starting point, but its *philosophical justification* is underdeveloped.  
     - *Undermining Verdict*: Forces reformulation (e.g., defer to *conditional* chances given the chance-theory). The "surviving" principle is weaker: chance guides credence only when it doesn’t predict its own falsity. Original principle’s simplicity is lost.  
     - *Genuine or Verbal?* Genuine. Turns on whether probability theories can be "self-aware" without incoherence.

  2. **The Defeasibility of Chance Deference**  
     - *Question*: If chance is constitutive, is deference still defeasible by non-inadmissible evidence (e.g., moral/game-theoretic reasons to distrust chances)?  
     - *Rank Defense*:  
       - **Impact (Med-High)**: Determines if chance is "first among equals" or epistemically sovereign. Connects to:  
         - *Load-bearing*: Rational choice under uncertainty (if deference overrides pragmatic concerns), moral encroachment.  
       - **Tractability (High)**: Formalizes defeasibility conditions (math) + analyzes normative conflicts (phil). No heavy probability theory needed.  
       - **Saturation (Low)**: Most assume deference is indefeasible; few test limits.  
     - *Genuine or Verbal?* Genuine. Tests if "rational norms" can conflict.

  3. **Chance as a Limit-Case of Social Deference**  
     - *Question*: Is chance deference just ideal expert deference (where the "expert" has maximal information and no bias)?  
     - *Rank Defense*:  
       - **Impact (Med)**: Unifies social epistemology and philosophy of probability. Downstream:  
         - *Load-bearing*: Epistemology of testimony (when to treat sources as "chance-like").  
       - **Tractability (Med)**: Requires comparing Bayesian expert principles with chance principles. Math is light; conceptual work is heavy.  
       - **Saturation (Medium)**: Some work on "ideal advisors," but not rigorously tied to chance.  
     - *Genuine or Verbal?* Genuine if chance’s objectivity is reducible; verbal if not.

  4. **Decision-Deference as Derivative**  
     - *Question*: Does rational choice *require* direct chance deference, or is it credence-mediated?  
     - *Rank Defense*:  
       - **Impact (Low)**: Likely a corollary of credence-deference + decision theory.  
       - **Tractability (High)**: Use existing causal/evidential decision theory frameworks.  
       - **Saturation (High)**: Lewis, Joyce, and others have extensively debated this.  
     - *Genuine or Verbal?* Terminological if "rational choice" is defined as EU-maximization.

  ---

  ### What Moves the Rankings
  - **Upward Movers**:  
    1. A proof that no non-trivial chance function can avoid self-undermining without ad-hoc constraints (would elevate #1 to urgent).  
    2. New evidence that agents rationally deviate from chance deference in non-inadmissible cases (e.g., in climate or quantum decisions; boosts #2).  
  - **Downward Movers**:  
    1. Consensus that social deference *cannot* ground chance (deprioritizes #3).  
    2. A trivial solution to undermining (e.g., restricting chance to non-forensic domains; collapses #1).  

  ### Top Two Developments That Would Reshape This Order
  1. **A No-Go Result for Self-Consistent Chance**: Showing that any constitutive account either permits undermining or reduces chance to frequency.  
  2. **Empirical Psychology of Chance Deference**: Evidence that humans intuitively treat chance as defeasible in high-stakes choices.  

  ### Recommendation
  Focus your semester on **Question #1 (Self-Undermining in Constitutive Accounts)**. It is the linchpin: success here forces answers to defeasibility (#2) and social deference (#3), while failure undermines the entire program. Your team’s skills are ideal—your co-author models the formal constraints; you probe whether the survivor principle retains chance’s philosophical essence. Avoid admissibility (#1a) as secondary and decision-deference (#3) as saturated. A single substantial paper here would be field-defining; splitting efforts would dilute impact. Use your reading month on New Principle variants and Humean metaphysics.
