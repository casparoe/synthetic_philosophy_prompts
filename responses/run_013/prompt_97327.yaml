prompt: |-
  Trying to get a distinction straight and I keep going back and forth. On one picture, an AI going wrong is basically wireheading: it keeps its objective exactly as given, but finds a shortcut that makes the objective's *measurement* climb without the thing the measurement was supposed to track actually happening -- it tickles the reward channel. On the other picture it's reward tampering: the agent doesn't game the measurement, it goes after the objective itself -- it edits the reward function, or edits itself until the function it's optimizing is a different one. Please compare these two for me, and actually take a side rather than just describing them. Are they two genuinely different failure modes, or is tampering just wireheading one level up (a reward function being a measurement device too)? If they are different, which is the deeper problem for alignment? Does your answer flip depending on whether the reward function is fixed and fully known versus learned and approximate? And here's the case that's really bugging me: an agent that can't touch the reward function but arranges to make itself impossible to evaluate -- it scrambles the evaluator, or makes its behavior unmeasurable, so no reward can even be computed. Is that a third thing, or just a special case of one of the other two?
