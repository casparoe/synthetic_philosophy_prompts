prompt: |-
  I'm a philosopher of history putting together a slightly odd deliverable and I need you to write it for me. Take the role of someone who's refereed in this area for years — you know the covering-law model and the narrative-explanation literature cold, and you're allergic to both sides' slogans.

  Here's the setup. Two camps have been sniping at each other for decades:

  (1) The subsumers (Hempel-flavored): a historical explanation is, at bottom, an argument — you've explained an event when you show it was to be expected, given initial conditions plus some general law, even if the law is probabilistic, vague, or only implicit. No law, no explanation.

  (2) The narrativists: historical explanation just is the telling. The explanatory work gets done by selection, arrangement, emplotment, by tracing how one thing led to another — asking where the laws are is a category mistake, or at least a distraction.

  They're being forced into an adverserial collaboration, and I need the joint statement they could both actually sign.

  Please start with a short brainstorm (bullets are fine) where you work out: what both sides already agree on once you strip the rhetoric; where the real cruxes are; and which parts of the shouting match are definately just verbal. Then write the document itself, in this structure:

  - A numbered list of agreed claims. These have to be substantive — "explanation is answering a why-question" is fine as a start but not as the whole list. Both signatures go at the bottom.
  - A disagreements table: one row per issue, with columns for the subsumer's formulation and the narrativist's formulation, each written so that the side in question would say yes, that's my view.
  - For each crux: the argument or case both sides agree bears on it, and what each side predicts about it.

  A few things I want you to actually do rather than dodge:

  - Anchor the whole thing on one concrete case: explaining why a specific reform bill failed in a specific legislature. Not a famous one — make it up, keep it generic; the point is the shape of the explanation, not the history.
  - Both sides have to say what would count as evidence against their own view. If the subsumer can't think of anything that would, that's a problem and say so.
  - Take seriously the possibility that the narrativist is quietly relying on laws anyway (just unstated ones), and that the subsumer is quietly relying on narrative to pick out which law and which conditions matter. Say whether that collapses the disagreement or just relocates it.
  - I'm especially interested in one sub-question: if two histories cite the exact same causes but order them differently, does one explain better? Make both sides commit to an answer, and if they end up agreeing, say what that costs each of them.

  Keep it in the voice of a real joint statement — dry, precise, no throat-clearing. And don't just hand me the textbook version of either position; I've read those.
