    *Margin:* "Key point: Wakefield bridges naturalism (dysfunction) and normativism (harm). Calling him 'naturalistic through and through' ignores the harm criterion’s normativity."  
  - **Relevance to Debate (✘ Missed):**  
    *Margin:* "Fails to explain what Wakefield 'adds': His model avoids Boorse’s relativism (dysfunction is species-wide) while incorporating values (harm) to exclude benign conditions. -1"  
