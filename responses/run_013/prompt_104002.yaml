answer: |-
  The established term closest to your phenomenon is **stratified instrumentalization of rest**, but since no single concept fully captures it, I propose **instrumental bifurcation of labor justification**.  

  ### Core Definition  
  *Instrumental bifurcation of labor justification* occurs when identical productivity-based arguments for rest (e.g., "rest improves output") are applied oppositely across worker hierarchies:  
  - **For privileged groups (salaried/senior staff):** Rest is framed as an *investment* (costs absorbed to protect quality).  
  - **For marginalized groups (hourly/contracted staff):** Rest is framed as a *reward* (costs imposed on workers who must "earn" it).  

  ### Why Existing Concepts Fall Short  
  1. **Protestant work ethic:** Focuses on moral virtue of work itself, not the *dual application* of instrumental rest arguments.  
  2. **Deservingness paradigm:** Explains who gets aid but not how *the same justification* is inverted by class.  
  3. **Human capital theory:** Treats rest as investment universally, ignoring how it’s denied as a *reward* for some.  
  4. **Efficiency-wage theory:** Justifies higher pay/rest for productivity but doesn’t address bifurcation within an organization.  

  ### Boundary Cases  
  - **Edge case 1:** Surgeons granted napping pods to reduce errors (investment) vs. janitors denied breaks unless rooms cleaned ahead of schedule (reward). *Fits:* Identical "productivity" logic applied oppositely.  
  - **Edge case 2:** Software engineers given "recharge sabbaticals" (investment) vs. cafeteria staff told breaks require covering others' shifts (reward). *Fits:* Structural hierarchy determines the framing.  
  - **Non-case:** All workers denied rest with no productivity argument. *Falls outside:* Absent the *same instrumental logic* applied bifurcatively.  

  ### Where Carving Fails: Key Revisions Needed  
  Your observation exposes a flaw in **labor allocation theory**, which assumes instrumental arguments apply uniformly. The bifurcation reveals how class power distorts logic.  
  - **Revision trigger:** If hourly workers *routinely* receive rest as an "investment" (e.g., Amazon warehouse quotas tied to break access). This would weaken the class hierarchy correlation.  
  - **Competing classification:** **Managerial discretion bias**—arguing outcomes stem from individual supervisors, not systemic logic inversion. A case where the *same* manager grants investment-framed breaks to both groups during staffing crises would challenge the definition.  

  ### Defense Against Rival Terms  
  - Why not **"hypocritical instrumentalism"**? Too vague; misses the *structural* inversion pattern.  
  - Why not **"rest justification duality"**? Omits the power hierarchy driving the duality.  
  - **"Instrumental bifurcation"** explicitly links the split (*bifurcation*) in logic application to labor stratification (*instrumentalization*).  

  ### Conclusion  
  This pattern weaponizes productivity logic to reinforce class boundaries: rest as a *right* for elites becomes a *privilege* for precariat. When the *identical* efficiency argument legitimizes opposing outcomes, it exposes hierarchy masquerading as rationality.
