prompt: |-
  I teach a grad seminar on distributive justice, and for the last few months I've been keeping a running list of my gut verdicts about inheritence, mainly to see whether I even have a consistent view or just a pile of reflexes. Could you tell me what principle, if any, actually generates the list, and where it forces me to drop something? All the cases are a parent or grandparent handing something down. (1) A widow leaves the family house, maybe $600k, split between two kids: fine, and I don't care that it passes untaxed. (2) A hedge-fund guy sets up one of those dynasty trusts — as I understand it, a few states have scrapped the old rule against perpetuities so it can pay out to descendants for centuries, and the unrealized gains get their basis stepped up at each death so nobody ever pays capital gains on it: that one strikes me as close to indefensible, and I'd tax it down to almost nothing. (3) A baker leaves the shop to the daughter who actually worked there for twelve years and gives the other two kids cash: not just fine, positively good. (4) Parents spend forty grand a year on private school, tutors, and an SAT bootcamp: fine. (5) A dad gives ten million to a university and the kid gets in: not fine, and the not-fine-ness seems to be about the admission, not the money. (6) A grandfather buys his grandson a $2M apartment in a city where nobody that age can afford one: here I genuinely wobble and have no verdict. (7) Parents pay for med school so the kid graduates debt-free: fine. (8) A family hires lawyers to keep the kid's DUI off the record so it never touches his applications: not fine. (9) Parents read to the kid every night and drag him to museums: fine, obviously, and I don't want any policy touching it.

  The principle I keep reaching for is that the objectionable ones are positional — they buy a better spot in a queue for something scarce — and the innocent ones are merely absolute, making the kid's life better without shoving anyone back; I've been calling them positional bequests versus capability bequests. But then (4) should be objectionable, since tutors plainly buy position against other kids, and I don't think it is; and (2) should be innocent, since a trust doesn't obviously shove anyone back, and I think it's the worst thing on the list. So either I bolt on extra clauses — something about whether an institution is being captured, something about scale or the dynastic time-horizon, something about whether the advantage is contestable — until the principle saves all nine verdicts, or I keep it clean and pay the price of overruling one of them. Tell me which, and which verdict has to go; say what your preferred principle predicts for (6); and give me one more case I haven't listed that would be a hard test of it. I already know the literature here, so skip the citations and the reading list — I want the argument, not the bibliography. Also flag how confident you are in your main claim, and tell me the single step where you're least sure of yourself. American spelling, please.
reasoning: |-
  Hmm, the user is a grad seminar instructor in distributive justice who's been collecting personal intuitions about inheritance cases. They've identified a pattern where they object to "positional bequests" (advantages in scarce queues) but approve "capability bequests" (absolute life improvements), yet their cases contradict this framework. Specifically, their approval of private education (case 4) contradicts the positional logic, while their objection to dynasty trusts (case 2) contradicts the capability logic.

  I need to diagnose the underlying principle. Their nine cases show three consistent patterns: approval when transfers (a) support earned merit (bakery inheritance), (b) provide non-rival absolute goods (reading time), or (c) avoid institutional corruption (rejecting bought admissions). Objections arise when transfers (a) undermine meritocracy (DUI cover-ups), (b) create permanent exclusion (dynasty trusts), or (c) generate unearned positional goods (apartment gifts that bypass work).

  The core principle seems to be meritocratic opportunity preservation: they support transfers that develop capabilities or reward effort without preempting others' fair competition chances. This explains why private education (case 4) is acceptable—it enhances capability within an open system—while dynasty trusts (case 2) are objectionable because they bypass merit entirely. The unresolved apartment case (6) is borderline since it depends on whether housing markets are zero-sum.

  For a hard test case, consider a family funding a child's Olympic training with elite coaches. This pits absolute capability development against positional advantage in a high-stakes scarcity context. The user's framework would likely condemn it if it crowds out others' opportunities. My confidence is high in the meritocracy principle but shaky on distinguishing capability development from positional gains in practice.

  The user clearly wants rigorous conceptual dissection, not literature review. They're intellectually honest about potential inconsistencies, so I should prioritize analytical clarity over defending every gut reaction. The unresolved apartment gift shows where their principle needs refinement—perhaps through a "competitive threshold" test for essential goods.
answer: |-
  Your gut verdicts reveal a remarkably consistent **meritocratic opportunity principle**: you support transfers that enhance a recipient's *absolute capabilities* or *reward genuine merit*, but oppose those that *confer unearned positional advantages* or *circumvent fair competitive processes*. The tension arises when capability-building incidentally creates positional gains—but you tolerate this *unless* it corrupts institutions or creates permanent, unassailable privilege. Let's dissect it:

  ### Core Principle & Its Exceptions
  1. **Merit/Effort Validation**: Transfers are justified when they recognize/work with demonstrated effort or skill (Case 3: bakery to working daughter ✅; Case 7: med school debt relief ✅).  
  2. **Absolute Capability Focus**: Goods that improve life *without requiring others to lose* are permissible (Case 1: family home split ✅; Case 9: cultural enrichment ✅; Case 7: debt freedom ✅).  
  3. **Anti-Corruption/Cheating**: You reject advantages gained by gaming or bypassing meritocratic institutions (Case 5: bought admission ❌; Case 8: DUI cover-up ❌).  
  4. **Anti-Dynastic Entrenchment**: Perpetual, tax-avoidant wealth that detaches from merit *and* creates caste-like exclusion is intolerable (Case 2: dynasty trust ❌).  

  ### Why Your "Positional vs. Capability" Frame Falters (and How to Fix It)
  - **Case 4 (Tutors/SAT Bootcamp) ✅ vs. Positionality**: Tutoring *does* create positional gains, but you accept it because:  
    - It operates *within* a contested system (standardized tests, school admissions),  
    - Preserves *some* meritocratic element (the child still must perform),  
    - Feels "contestable" (others could theoretically access similar resources).  
  - **Case 2 (Dynasty Trust) ❌ vs. Capability**: The trust *absolutely* enriches heirs, but you object because:  
    - It **perpetuates privilege detached from merit** across generations,  
    - **Eliminates contestability** via tax loopholes and legal permanence,  
    - **Corrupts institutions** (exploiting weak perpetuities laws/step-up basis).  

  **The refined principle**:  
  > *Inheritance is permissible when it develops capabilities or rewards merit without subverting fair competition; impermissible when it purchases unearned rank, corrupts institutions, or creates dynastic lock-in.*  

  ### The Sacrifice: Case 4 (Tutors/Bootcamp) Must Be Rejected—or Reframed  
  Your intuition tolerates tutoring because it feels like "investing in human capital." But under a *strict* meritocratic opportunity view, **private tutoring that significantly alters admission outcomes is objectionable**. It allows wealth to buy advantage in zero-sum competitions (e.g., Ivy League slots), undermining equal opportunity. If you insist on keeping Case 4 ✅, you must weaken your principle to:  
  > *"Positional transfers are acceptable if they operate within formally open systems, but not if they bypass them (e.g., bribes) or exist outside them (e.g., dynastic trusts)."*  
  This salvages Case 4 but makes your view less coherent. **I recommend dropping Case 4's permissibility** to maintain rigor.  

  ### Verdict on Case 6 ($2M Apartment Gift) 🠊 **❌ (Objectionable)**  
  - **Why**: This is a **pure positional transfer**. In a supply-constrained housing market (e.g., NYC/SF), a $2M apartment isn't just "absolute wealth"—it grants *exclusive access* to location-dependent opportunities (jobs, networks, schools). It bypasses the competitive process (saving, career advancement) others must endure. Unlike the bakery (Case 3), no merit/effort is validated. Unlike med school debt (Case 7), it doesn't enable skill-building—it *replaces* the need for it.  

  ### Hard Test Case:  
  **"Parents fund their child's elite internship at a prestigious firm, creating a non-public job opening reserved for their connections."**  
  - **Your principle predicts**: ❌ **Impermissible**.  
    - **Why**: This corrupts the hiring institution (creating a non-meritocratic path), buys positional rank (scarcity: top jobs), and validates no merit (beyond nepotism). Contrast with Case 3 (bakery), where the daughter's *proven labor* justifies the transfer.  

  ### Confidence & Uncertainty  
  - **Confidence in core principle**: 90% (it cleanly explains 8/9 cases; only Case 4 requires trade-offs).  
  - **Least confident step**: Drawing the line between **capability-building** (permissible) and **positional competition** (impermissible).  
    - E.g., Is "debt-free med school" (Case 7 ✅) meaningfully different from "Manhattan apartment" (Case 6 ❌)? Both free the recipient from market pressures. But med school *requires* the recipient to demonstrate skill (licensing exams), while the apartment requires nothing. This distinction hinges on **whether the transfer demands subsequent meritocratic performance**.  

  ### Summary of Required Trade-Offs  
  | Case | Your Verdict | Principle's Verdict | Sacrifice Needed? |  
  |------|--------------|---------------------|-------------------|  
  | 1    | ✅           | ✅                  | None              |  
  | 2    | ❌           | ❌                  | None              |  
  | 3    | ✅           | ✅                  | None              |  
  | 4    | ✅           | ❌                  | **Drop ✅ or weaken principle** |  
  | 5    | ❌           | ❌                  | None              |  
  | 6    | ?            | ❌                  | **Adopt ❌**       |  
  | 7    | ✅           | ✅                  | None              |  
  | 8    | ❌           | ❌                  | None              |  
  | 9    | ✅           | ✅                  | None              |  

  **To be consistent**: Reject Case 4 (tutors) as a positional violation, or accept that your principle tolerates *some* wealth-driven competition if institutions remain "open." But then you lose leverage against Case 6—which is why I advise embracing the stricter view.
