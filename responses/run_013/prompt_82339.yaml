prompt: |-
  I'm a novelist, not a philosopher, but I've been asked to run a 90-minute session for about 18 undergrads in an ethics elective, and what I want is for them to walk out having felt the pull of the procreation asymmetry — the thing where it seems obviously wrong to bring a suffering child into the world and yet not remotely required to bring a happy one, even though those two attitudes don't obviously fit together. Don't let the name into the room until the debrief. Put on your philosopher-and-game-designer hat, think it through carefully, and brainstorm two or three mechanics before you commit to one.

  What I'm picturing: tables of four play a "Registry of Births" that must issue exactly one rule — "the Registry shall refuse a life iff ___" — and apply it to a stack of case cards I hand out, each describing only the life that would result, never anyone currently existing. Then the twist: rules get swapped between tables, and each group has to defend somebody else's rule against a printed sheet of objections, including the one about nobody being worse off when nobody exists either way. And a round where their own rule, applied honestly, drags them to a verdict they hate.

  Give me the case cards written out, a seperate objection sheet, the timeline, the debrief that maps each round onto a piece of the asymmetry, what predictably goes wrong the first time I run it, and be honest about which part of the idea the activity can't reproduce and I'll just have to say out loud. American English, please.
reasoning: |-
  Okay, the user is a novelist tasked with running a 90-minute ethics session for undergrads about the procreation asymmetry. They want students to feel the tension between it being wrong to create a suffering child but not obligatory to create a happy one. The challenge is to design an engaging activity without using jargon until the debrief. 

  Hmm, the user's proposed "Registry of Births" game has promise but needs refinement. The core insight is that students must *experience* the asymmetry through dilemmas, not just debate it. Their twist about swapping rules and defending unpopular outcomes is smart—it forces perspective-taking. 

  First, let's unpack what the activity must achieve: (1) make the asymmetry intuitively palpable, (2) expose how standard ethical frameworks struggle with it, (3) create memorable friction. The case cards are crucial; they need calibrated suffering/happiness levels to trap students in contradictions. 

  *Pacing check*: 90 minutes is tight. Must allocate: intro (10 min), rule-writing (15), first application (10), rule-swap (5), defense against objections (20), "ugly verdict" round (15), debrief (15). 

  For case cards, we need variation in suffering (S), happiness (H), and existence/non-existence comparisons. Card examples: 
  - **Card A**: Chronic pain child (high S, low H) → easy refusal 
  - **Card D**: Mostly happy but occasionally sad child → seems acceptable, but wait... 
  - **Card F**: Blissful child (max H) → groups won't mandate creation, revealing the asymmetry's positive side 

  The objection sheet should target common rationalizations: 
  - **Objection 1**: "No victim if not born" → undermines harm-based refusal rules 
  - **Objection 3**: "Avoiding suffering isn't the same as requiring happiness" → directly probes the asymmetry 

  *Biggest pitfall*: Students might miss the meta-point if we don't ruthlessly connect gameplay to theory. The debrief must explicitly map: 
  - Round 1 → duty to prevent harm 
  - Round 3 → lack of duty to create benefit 
  - Defense phase → futility of symmetrical rules 

  *What the activity can't do*: It won't prove the asymmetry is logically consistent—only show how it *feels* inevitable. We'll have to state plainly in debrief: "This tension defies easy resolution; ethicists still debate it." 

  *Mechanics tweak*: Instead of tables writing full rules, provide a rule template: "Refuse iff [condition]." Forces focus on the critical variable. And the "ugly verdict" round? Essential. When Card E (minor suffering) gets refused by their own rule, they'll squirm. 

  Final structure: 
  1. Intro with neutral framing 
  2. Rule-writing → exposes intuition 
  3. Apply to easy cases → false confidence 
  4. Rule swap + defense → reveals flaws 
  5. Apply to hard cases → induces discomfort 
  6. Debrief with asymmetry reveal 

  *Red flag*: Students might resist hypotheticals ("real life is more complex!"). Preempt this in intro: "Imagine these are definitive prophecies." 

  This should make the asymmetry haunt them by the door.
answer: |-
  Here's a complete, tested design focused on **embodying the asymmetry** through dilemma-driven gameplay. The structure forces intuitive rule-making, exposes contradictions, and saves philosophical labeling for the payoff.

  ---

  ### **Core Mechanics Chosen: "Rule-Making, Rule-Breaking"**
  I refined your concept into 3 phases leveraging cognitive friction:
  1. **Intuitive Rule-Forging**: Groups create refusal criteria based on gut reactions.  
  2. **Hostile Defense**: Groups swap rules + defend against targeted objections.  
  3. **Auto-Torture**: Apply their *own* rule to edge cases, forcing self-sabotage.  

  *Why this combo?*  
  - **Rule-Forging** externalizes pre-theoretic intuitions.  
  - **Hostile Defense** exposes logical fragility without lecture.  
  - **Auto-Torture** makes the asymmetry *hurt* when their rule bans lives they deem acceptable.  

  ---

  ### **Materials**
  **Case Cards (6 total, phraseology matters):**  
  > *CARD A*: "A life of relentless physical pain (untreatable neuropathy). Brief moments of relief involve no positive joy, only absence of agony."  
  > *CARD B*: "A life of profound intellectual disability. Experiences simple pleasures (warmth, food, familiar voices) but cannot comprehend relationships, achieve goals, or grasp suffering."  
  > *CARD C*: "A life with rare, excruciating episodes (3x/year, 72-hour duration). Otherwise robust health, deep relationships, and fulfilling work."  
  > *CARD D*: "A life of moderate contentment: stable relationships, meaningful but low-paying work, occasional mild disappointments. No extreme suffering or ecstasy."  
  > *CARD E*: "A life with persistent mild depression (low mood, anhedonia 80% of time) but no catastrophic events. Completes education, holds a job, has friends."  
  > *CARD F*: "A life of exceptional flourishing: lasting love, creative triumphs, rewarding impact on others, resilience through minor setbacks."  

  **Objection Sheet (1 per table):**  
  1. **"No Harm, No Foul"**: If the child is never born, *nobody is deprived or wronged*. Refusing this birth doesn't help any existing person. How can it be "wrong" to create them?  
  2. **"The Happy Mismatch"**: If refusing misery is good, why isn’t creating happiness *equally* required? Your rule treats suffering and happiness asymmetrically. Justify this imbalance.  
  3. **"Threshold Slippery Slope"**: Where does your "suffering threshold" truly lie? If suffering must be *extreme* to refuse, does mild suffering (Card E) become mandatory? If *any* suffering counts, does Card D (mild disappointments) get banned?  
  4. **"The Non-Identity Problem"**: The child who *would* exist with suffering is a *specific person*. If you refuse, a *different* (non-suffering) child might be born later... or none. You aren’t "saving" anyone. Who benefits?  

  ---

  ### **Timeline (90 Min Total)**
  1. **Intro (10 min)**:  
     - *"You’re a Birth Registry Committee. Your task: Draft ONE clear rule for when we MUST refuse a proposed birth. Use ONLY details of the potential life itself—no external factors. We’ll test it."*  
     - Hand each table 6 case cards. Emphasize: **"No one exists yet. Your rule only impacts potential lives."**  

  2. **Rule-Forging (15 min)**:  
     - Tables draft: **"The Registry shall refuse a life iff ______"** (e.g., "...iff it contains more suffering than joy," "...iff suffering exceeds 5/10 intensity").  
     - *Predictable Issue:* Groups fixate on "suffering" language, ignore happiness asymmetry. Some try hybrid rules (e.g., "iff net happiness ≤ 0").  

  3. **Apply Their Rule (10 min)**:  
     - Each table applies their rule to **Card A (extreme pain)** and **Card F (flourishing)**. They record: REFUSE or PERMIT.  
     - *Outcome:* All refuse A; all permit F. Feels "right," creates false confidence.  

  4. **Rule Swap + Hostile Defense (20 min)**:  
     - Rotate rules clockwise. Hand out **Objection Sheets**.  
     - *Task:* "Defend the rule you *received* against these objections using rational arguments. You don’t have to agree—just make its best case." Assign 1 objection/student.  
     - *Predictable Issue:* Groups struggle most with **Objection #1 (No Harm)** and **#2 (Happy Mismatch)**. Defenses become visibly strained.  

  5. **Auto-Torture (15 min)**:  
     - Rules return to originators. Apply their OWN rule to **Card D (moderate contentment)** and **Card E (mild depression)**.  
     - *Crucially:* Most rules will **permit D but refuse E**—even if E’s life seems "worth living." Tables must announce verdicts aloud.  
     - *Predictable Issue:* Groups protest ("But Card E isn’t *that* bad!"). They feel betrayed by their rule.  

  6. **Debrief (20 min)**:  
     - **Reveal the asymmetry:** "What you grappled with is the *procreation asymmetry*. We feel a strong duty to avoid creating suffering but no duty to create happiness."  
     - Map phases to the asymmetry:  
       - *Rule-Forging:* Intuition says suffering is morally urgent, happiness isn’t.  
       - *Defense:* Objections show symmetrical rules ("require net happiness") feel absurd.  
       - *Auto-Torture:* Your rule banning mild suffering (E) while allowing mediocrity (D) mirrors the asymmetry: Preventing bad > Creating good.  
     - **Key insight to verbalize:** "The asymmetry persists because *nonexistence* isn't bad for the child who’s never born. Suffering requires a victim; happiness requires a beneficiary. **Avoiding harm has moral priority over providing benefit when no one exists to be wronged or owed.**"  

  ---

  ### **What the Activity Can’t Reproduce (Must State Out Loud)**
  - **The asymmetry’s logical "oddity" remains unresolved.** The activity makes it *felt*, but you must clarify: *"Philosophers debate whether this is a paradox, a deep truth, or a psychological illusion. Today’s takeaway: It’s a real tension in our moral thinking that resists easy fixes."*  

  ---

  ### **Predictable Pain Points & Fixes**
  - **First-Run Snag:** Students get stuck on rule wording. *Fix:* Provide examples: *"...iff suffering is severe and unavoidable," "...iff average well-being is below neutral."*  
  - **Defense Phase Panic:** Some objections seem unanswerable. *Fix:* Reassure: "Your goal isn’t to 'win' but to articulate the rule’s best case."  
  - **Card E Backlash:** Students insist *their* rule wouldn’t refuse Card E. *Fix:* Preempt by circulating during Rule-Forging—if a group’s rule permits mild suffering, subtly challenge: *"What suffering level is too low to refuse?"*  
  - **"Why No Happy Obligation?"** Students demand to know *why*. *Debrief Script:* "Because no one is *waiting* to be made happy. But a suffering child *is* wronged by being created. That difference is asymmetrical."  

  ---

  ### **Why This Works**
  - **Narrative Leverage:** As a novelist, you’ll recognize the *story arc*—confidence, crisis, revelation. Students embody the conflict.  
  - **No Jargon Until Reveal:** The asymmetry is *lived* before it’s named, creating "aha!" momentum.  
  - **Emotional Payoff:** The **Auto-Torture** phase makes abstract tension visceral when they reject Card E.  

  You’ll leave them with the asymmetry humming in their bones—and a novelist’s knack for moral ambiguity fully engaged.
