  Key observations about the user:
  - They're scientifically literate (marine biology background) but explicitly requests no jargon or assumed philosophical knowledge
  - Suspicious that the friend's classifications might be post-hoc rationalizations rather than rigorous applications of a rule
  - Values intellectual honesty - wants me to flag where inference ends and speculation begins
  - Sees blushing as a potential wedge case due to its involuntary nature and apparent counterproductivity

  The core challenge is reverse-engineering the friend's implicit rules from limited examples. Her published classifications show:
  Built-in criteria: Cross-species presence (fear of snakes), clear survival value (disgust response), hardwired urgency (baby cry response)
  Spillover criteria: No adaptive function (shadow analogy), persistence despite futility (shouting at printers), cognitive quirks (earworms)

  Blushing is tricky because it straddles these categories:
  Arguments for built-in: Universal across humans, involuntary physiology, possible signaling function (apology/submission display)
  Arguments for spillover: No immediate survival benefit, potentially maladaptive (draws attention), no clear animal parallel

  I suspect two competing rules could explain her past calls equally well:
  Rule A (Functional Primacy): If it serves an immediate biological function, it's built-in regardless of other factors
  Rule B (Phylogenetic Signature): If homologous traits appear in other species with clear adaptive value, it's built-in

  Blushing becomes the perfect test case because:
  - Under Rule A, it might qualify as built-in if we accept signaling functions
  - Under Rule B, it likely fails due to lack of clear animal parallels

  The user's meta-question about methodology versus temperament is astute. The friend seems to prioritize adaptationist explanations (consistent with behavioral ecology traditions), while her critics likely represent more cautious evolutionary psychology views. This disciplinary tension matters more than any "rule" - her call on blushing will probably reveal whether she leans toward strict adaptationism or allows for exaptation.

  To truly stress-test her framework, I'd suggest adding:
  1. Music-induced chills (potential spillover of hair-raising fear response)
  2. Contagious yawning (built-in if empathy-related, spillover if physiological)
  These cases better isolate the functional vs. phylogenetic dimensions.

  My prediction? Given her dismissal of critics as "cowards," she'll likely classify blushing as built-in by emphasizing its potential as a costly signal of remorse. But this exposes the framework's vulnerability - without clear falsifiability criteria, any outcome can be justified through creative storytelling. The real answer might be that her taxonomy works best for clear-cut cases, not complex social behaviors where multiple evolutionary mechanisms overlap.
answer: |-
  Based on your friend's established calls and the logic implied by her justifications, I'd reconstruct two distinct (but often overlapping) rules she *might* be using. Blushing is an excellent test case because these rules likely diverge here, exposing the potential inconsistency. Let's break it down step-by-step.

  **The Two Candidate Rules:**

  1.  **Rule A: The "Immediate Survival/Reproductive Payoff" Rule (Functional Primacy)**
      *   **Core Logic:** A trait is "built-in" if it demonstrably solved a *direct, concrete problem* related to survival or reproduction for our ancestors *in the specific form we observe it today*. If the observed behavior *itself* clearly enhanced fitness (e.g., avoiding poison, protecting offspring, escaping predators), it's built-in. If its current form doesn't obviously serve such a direct, primary function, it's spillover, *even if universal or involuntary*.
      *   **Fits Her Record:**
          *   Revulsion (rotting meat/faeces): Directly avoids pathogens/poison -> Built-in.
          *   Baby cry response: Directly protects vulnerable offspring -> Built-in.
          *   Fear of snakes: Directly avoids a lethal threat -> Built-in (she dismisses the "other animals fear them" counter because it *reinforces* the direct threat argument).
          *   Earworm: No direct survival/reproductive function of the stuck song itself -> Spillover.
          *   Talking to dogs: No direct function (the dog doesn't understand) -> Spillover.
          *   Shouting at printer/TV: No direct function (printer/TV doesn't care) -> Spillover.
      *   **Prediction for Blushing (Rule A): SPILLOVER.**
          *   *Why?* While universal and involuntary, the *specific act of blushing* doesn't have an obvious, direct, immediate survival or reproductive payoff. In fact, it often seems *counterproductive* – drawing unwanted attention precisely when you want to hide ("gives you away"). It doesn't physically deter a threat, attract a mate in that moment, or secure resources. Its potential benefits (signaling submission, promoting trust) are indirect, complex, social, and not universally applicable in every blushing scenario in a way that would have had a clear, direct fitness impact for ancestors facing immediate dangers. Under Rule A, it looks like an accidental physiological spillover from other arousal systems (like the fight-or-flight flush).

  2.  **Rule B: The "Phylogenetic Signal & Hardwired Trigger" Rule (Biological Imperative)**
      *   **Core Logic:** A trait is "built-in" if it shows evidence of being an evolved, innate module triggered by specific, reliable environmental cues, especially if similar responses exist in closely related species or serve a fundamental biological purpose. Involuntariness and universality are strong indicators. Spillover is for things that piggyback on these systems but lack this specific, evolved trigger or core biological function.
      *   **Fits Her Record:**
          *   Revulsion: Innate response to specific chemical cues (pathogen signals), seen in many animals -> Built-in.
          *   Baby cry: Innate, specific acoustic trigger, highly conserved caregiving response -> Built-in.
          *   Fear of snakes: Points to *other animals* fearing them as evidence it's a deep-seated, evolved predator-avoidance module -> Built-in (using cross-species similarity as *support*, not counter-evidence).
          *   Earworm: Not triggered by a specific, evolved environmental cue; hijacks auditory processing -> Spillover.
          *   Talking to dogs: Not an innate response to a specific cue; applies social cognition in a non-functional way -> Spillover.
          *   Shouting at printer/TV: Not an evolved response to malfunctioning tech; frustration spillover from social conflict systems -> Spillover.
      *   **Prediction for Blushing (Rule B): BUILT-IN.**
          *   *Why?* It's a universal, involuntary physiological response triggered by specific social cues (embarrassment, being caught, scrutiny). It involves dedicated vascular mechanisms in the face. Crucially, while its *adaptive value* is debated, its status as a hardwired, cue-specific biological response is clear. It shares physiological roots with other arousal responses but has a unique social trigger and manifestation. Under Rule B, this specificity, universality, and involuntariness strongly point to an evolved "built-in" module, even if its *primary original function* (e.g., appeasement signal, honesty signal promoting group cohesion) is indirect or complex.

  **Which Rule is She *Actually* Running? The Prediction & Why**

  *   **Your Suspicion is Likely Correct:** Both rules fit her past calls reasonably well. Blushing is where they clash.
  *   **Betting Prediction:** I would bet **heavily (80% confidence) she will classify blushing as BUILT-IN (Rule B)**.
  *   **Why Rule B (Phylogenetic Signal)?**
      1.  **Her Dismissal of Cross-Species Evidence for Snake Fear:** When you brought up other animals fearing snakes as a potential counter to it being "built-in" *for humans*, she dismissed it. Crucially, she didn't dismiss it as irrelevant; she likely saw it as *supporting evidence* that it's a deeply rooted, evolved response. This reveals her strong reliance on cross-species comparisons and innate triggers (Rule B thinking). She prioritizes the biological mechanism and trigger over debating the *specific current adaptive payoff* in humans.
      2.  **Emphasis on Universality & Involuntariness:** Her built-in examples are all universal and largely involuntary. Her spillover examples can be common but are not fundamental, involuntary biological imperatives triggered by specific cues in the same way. Blushing screams "biological imperative" under this view.
      3.  **"Cold Eye" & Behavioral Ecology Lens:** Her field focuses on observable behaviors and their potential evolutionary functions in an animal context. Rule B aligns better with identifying discrete, observable behavioral modules (like fixed action patterns) triggered by cues, which is core to behavioral ecology. Rule A's stricter requirement for a *direct, immediate survival payoff* might feel too restrictive for complex social traits like blushing, which behavioral ecologists often interpret as signals (with potential delayed or indirect benefits).
      4.  **"Temperament" Factor:** Her offense at the suggestion she picks the "nicer" label and her labeling colleagues "cowards" suggests a strong commitment to the idea that these are *real, discoverable biological categories*. Rule B, with its focus on innate, hardwired mechanisms, feels more like a concrete "biological fact" than Rule A, which might require more nuanced arguments about indirect functions that sound suspiciously like "storytelling" to skeptics.

  **The Critical Test Case: Separating Rule A from Rule B**

  *   **Your Case (Blushing):** It *is* a strong test case because Rule A points to Spillover (lack of direct payoff), Rule B points to Built-in (universal, involuntary, specific trigger).
  *   **An Even Stronger Test Case: Music-Induced Chills (Frisson)**
      *   **The Phenomenon:** The shivers/goosebumps and intense emotional feeling triggered by specific moments in music.
      *   **Why it's a Sharper Wedge:**
          *   **Rule A (Payoff):** SPILLOVER. What direct, immediate survival/reproductive payoff does getting chills from a Beethoven symphony serve? It seems like a clear spillover of the piloerection response (goosebumps) evolved for thermoregulation and threat displays (making oneself look bigger).
          *   **Rule B (Phylogenetic Signal/Hardwiring):** AMBIGUOUS, LEANING SPILLOVER... but debatable. It's not universal (only ~50-60% experience it strongly). The trigger (complex music) is a very recent cultural artifact, not an evolutionarily reliable cue. The physiological response (piloerection) is ancient, but its linkage to *aesthetic chills* lacks a clear evolved trigger specific to that function. Rule B would likely classify this as Spillover – an accidental hijacking of the threat/arousal/cold response system by culturally complex stimuli. *However*, if she argued the intensity and specificity of the emotional response pointed to an innate aesthetic module, she might stretch to Built-in (showing Rule B's potential flexibility).
      *   **How it Separates the Rules More Clearly:** Unlike blushing, frisson lacks universality and a plausible *evolutionarily ancient, specific trigger*. Rule A clearly predicts Spillover. Rule B also strongly predicts Spillover. **If she called frisson Built-in, it would be a major deviation from both rules and suggest a much looser, potentially unfalsifiable standard.** If she calls it Spillover (the expected call under both rules), it doesn't separate them, but reinforces their convergence on cases lacking clear biological triggers. Her *reasoning* would be key – if she emphasizes the lack of a direct payoff (Rule A) vs. the lack of an evolved trigger for the specific response (Rule B). Blushing remains the cleaner test because the rules *diverge*.

  **Honest Assessment of Inference & Methodology**

  1.  **Inference vs. Temperament:** This is about 70% inference from her stated positions and examples, and 30% temperament (her combative stance against critics, offense at accusations of arbitrariness). Her temperament suggests a strong prior belief in discrete biological categories (Rule B), making her likely to see blushing as built-in.
  2.  **Thinness of Record:** Her record *is* a bit thin, especially regarding complex social behaviors. We only have a few clear examples. Her "spillover" examples are all clearly non-functional. None of her "built-in" examples are purely social signals like blushing; they have clearer, more primal functions (avoidance, protection).
  3.  **What Would Thicken the Record & Change My Prediction?**
      *   **Her reasoning on a social behavior she calls "Spillover".** If she had an example like nervous laughter or foot-tapping classified as Spillover *despite* being common and somewhat involuntary, it would strengthen Rule A (Payoff) and make a Built-in call for blushing less certain. Her current Spillover examples are clearly non-biological (printers, dogs, internal music).
      *   **Her reaction to the "fear of guns" argument.** If someone pointed out that humans readily learn fear of modern threats like guns (which kill far more people than snakes now), does she dismiss it (supporting Rule B - snakes tap an innate module, guns don't) or accept it as potentially built-in (weapon-avoidance module, supporting Rule A's focus on *function* regardless of phylogeny)? Her stance on snake fear vs. other animal fears suggests she'd dismiss learned gun fear as not "built-in," supporting Rule B.
      *   **If she classified something like yawning as Built-in purely due to universality/involuntariness/phylogeny despite its unclear primary function.** This would strongly signal Rule B dominance and make a Built-in call for blushing almost certain.
  4.  **Where My Reasoning is Most Likely Wrong:**
      *   **Overestimating Rule B (Phylogenetic Signal):** Maybe she has an unstated, stricter criterion for social traits. Perhaps she *requires* evidence of a clear signal function *and* a response in the receiver for social traits to be "built-in." If blushing doesn't reliably change others' behavior in ways that clearly benefited the blusher ancestrally, she *might* call it Spillover. But her dismissal of the snake-fear counter suggests she doesn't require perfect current function.
      *   **Underestimating Her Flexibility:** She might use elements of both rules situationally, or have a third criterion (e.g., developmental robustness). Blushing might force her to articulate a more nuanced rule that incorporates both mechanism and function in a way her previous examples didn't require.
      *   **Temperament Overriding Logic:** Her desire to win the argument against her colleagues ("cowards") might make her double down on blushing as Built-in simply because it *looks* biological, even if her internal logic should lead her to Spillover. Or vice-versa, to avoid seeming dogmatic.

  **The Verdict & Strategy for Your Slot:**

  *   **Predict her call:** She will almost certainly declare blushing **BUILT-IN** based on its universality, involuntariness, specific social trigger, and physiological basis (Rule B - Phylogenetic Signal).
  *   **Her likely reasoning:** She will argue it's an evolved signal, likely an "honest signal" of submission, appeasement, or remorse because it's hard to fake. This signal, she'll contend, served to reduce aggression from others, promote forgiveness, or strengthen social bonds in ancestral groups, thus having an indirect reproductive/survival benefit. She will dismiss the "giving you away" aspect as secondary or the cost of an honest signal.
  *   **How to Probe the Rule:**
      1.  Present blushing, highlighting its involuntary nature, universality, and apparent counterproductivity.
      2.  **Ask directly:** "Based on your framework, is this a 'spillover' of general arousal (like shouting at a printer), or is it 'built-in' as a specific evolved signal (like disgust)?"
      3.  **Crucially, follow up based on her answer:** If she says Built-in (as predicted), ask: *"What's the key difference between this and, say, shouting at a printer? Both are strong, common, involuntary-seeming physiological responses triggered by specific situations. Is it primarily that blushing is universal while printer-shouting isn't? Or that blushing has a plausible signaling function? Or that it involves dedicated physiology?"* This forces her to articulate whether universality/physiology (Rule B) or function (Rule A) is the deciding factor.
      4.  **Introduce the Sharper Wedge (Optional but Recommended):** "How would you classify something like getting intense chills or goosebumps from a powerful piece of music? It feels deeply biological and emotional, but the trigger (complex music) is very recent, and it's not universal. Is that spillover of an ancient arousal system, or is there something built-in about aesthetic response?" Compare her reasoning here to blushing. If she readily calls frisson Spillover (as both rules predict), it doesn't separate them. But if she struggles or offers a Built-in argument, it exposes significant flexibility in her criteria.

  By focusing on *why* blushing differs from her other examples (especially the spillover ones) and potentially introducing frisson, you'll force her to clarify the implicit rule she's applying, revealing whether it's primarily about Payoff (Rule A), Phylogenetic Signal (Rule B), or something else entirely. This moves beyond a verdict on blushing to directly test the coherence and consistency of her classification system. Good luck!
