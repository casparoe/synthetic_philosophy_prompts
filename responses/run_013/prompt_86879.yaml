prompt: |-
  I am a novelist, about two-thirds of the way through the second draft of a book set partly in a coastal town whose faith, work and speech are not mine, and for the past month I have been rereading Rorty in the evenings in the hope that his antirepresentationalism would tell me what I owe the people I am writing about. So far it has told me the opposite of what I wanted: that descriptions are not copies but tools, that truth is settled among describers rather than by correspondence to how things stand, and that the vocabulary at which a person's justifications simply run out — his final vocabulary — is contingent, held rather than compelled. This is bracing at four in the morning and useless at nine, when I have a scene to revise and a reader from that town to answer. What I need from you is the translation I cannot do for myself: turn Rorty's antirepresentationalism, together with his claim that solidarity is made rather than found, into a procedure I can actually run on a passage of my own prose, deciding when a passage is claiming to have got something right and when it is offering a redescription I merely hope will be useful, and what follows from the difference in each case.

  To be concrete about the conditions: I revise for perhaps two hours most evenings, so I have about twenty minutes per passage and no philosophical training beyond having read a fair amount of it for pleasure. The decisions recur several times a sitting — every scene that depicts a practice, a place or a kind of person from outside my own experience raises them — and the stakes are not small: publication, the response of readers who live in that town, and my own sense of whether I have been honest. My editor has the final say on the text, and I pay a sensitivity reader to go through the whole manuscript once; the procedure should therefore tell me which questions I can settle alone, which are worth putting to the reader, and which are mine alone to decide because they are questions of value rather than of fact. Give me the procedure as an ordered set of questions, each with a note on what a sufficient answer looks like and what an evasive one looks like, marking the points where it stops with a no and the points where it must hand the decision to a person. Then run it on three passages from my book: the invented ritual in the town's chapel, which a reader from the town has told me is wrong but which I researched carefully and still believe is defensible; a third-person chapter that enters the mind of a man who has done something monstrous, which I think of as a redescription of cruelty but which I suspect no reader can avoid taking as a claim about how such men actually are; and a comic scene whose humour depends on the dialect I have given a minor character, where I genuinely cannot tell whether the joke is at his expense. I would rather you said plainly where the procedure misfires, and which of its steps are judgments dressed up as procedure, than that you smoothed the joins.

  Begin with the procedure itself — the ordered questions in their finished form — in your first sentence or two, then give the reasoning behind it, then the three worked passages, then the caveats. No preamble, and no restating of what I have asked. Please write in British English.
reasoning: |-
  Alright, the user is a novelist grappling with ethical representation in their work, specifically how to apply Rorty's antirepresentationalism practically. They need a concrete procedure to evaluate their prose passages, balancing respect for the community they're depicting with their artistic choices. 

  First, I need to unpack their core tension: they want Rorty's philosophy (descriptions as tools, solidarity as constructed) to guide their revisions, but find it too abstract. Their frustration is palpable—"bracing at 4am, useless at 9am"—so the procedure must bridge theory and craft. The stakes are high: authenticity, reader trust, publication. 

  The user’s concrete conditions matter: 20-minute per-passage slots, no formal philosophy training. They’re not asking for theory lessons but a workflow. The three test cases are revealing: a contested ritual (fact vs. interpretation), a villain’s POV (redescription vs. essentialism), and dialect humor (agency vs. mockery). Each probes different ethical pitfalls. 

  I notice they’ve already sought external input (sensitivity reader, local reader), so the procedure should clarify when to consult versus when to own a creative decision. Their request for "judgments dressed as procedure" signals they want transparency, not algorithmic evasion. 

  Building the procedure: 
  - Start with Rorty’s core—interrogate whether a passage presents itself as "Truth" (claiming correspondence) or "Tool" (offering perspective). That’s the foundational filter. 
  - Then practical checks: harm assessment, authority (have I done the work?), and solidarity test (does this build or break connection?). 
  - Crucially, flag where the answer stops being procedural—e.g., "Is this cruel?" requires moral judgment, not a flowchart. 
  - For the test cases: the ritual needs external verification (local reader); the villain’s POV hinges on authorial control (don’t hand off artistic intent); the dialect scene demands self-interrogation about power dynamics. 

  Caveats are vital. Antirepresentationalism doesn’t erase responsibility—it makes solidarity harder work. I’ll stress that "contingent" doesn’t mean "arbitrary," and that the sensitivity reader’s role is complementary, not replaced by this. 

  The tone must stay British (as asked) and unflinching. No platitudes about "all perspectives matter." Instead, direct questions like "Would this passage survive if read aloud to those it describes?" to force honesty. 

  Finally, I’ll model humility: where the procedure can’t decide (e.g., the ritual’s defensibility), explicitly say "Stop—this needs a human with context."
answer: |-
  ### Procedure for Evaluating Passages (Ordered Questions)  
  1. **Is this passage presented as correspondence-truth (claiming "how things are") or as a tool (offering a perspective)?**  
     *Sufficient answer:* Identifies specific language (e.g., definitive assertions vs. conditional/subjective framing).  
     *Evasive answer:* Vague appeals to "authenticity" or "research."  

  2. **If presented as correspondence-truth:**  
     - **a. Can this claim withstand challenge from those it describes?**  
       *Sufficient:* Evidence (research, testimony) is cited *and* tested against counter-evidence.  
       *Evasive:* "My research is thorough" without addressing specific contradictions.  
       - **→ NO?** Rewrite or reframe as tool (see 3). **→ YES?** Proceed.  
     - **b. Is this claim necessary for solidarity (building shared understanding)?**  
       *Sufficient:* Shows how the claim bridges experience (e.g., universal human insight).  
       *Evasive:* "Readers need to know the truth."  
       - **→ NO?** Cut or reframe. **→ YES?** Keep, but flag for sensitivity reader.  

  3. **If presented as a tool (redescription):**  
     - **a. What work does this description do?** (e.g., provoke empathy, critique, humour)  
       *Sufficient:* Concrete effect stated (e.g., "undermines the character’s self-justification").  
       *Evasive:* "It’s just how I see it."  
     - **b. Could this description reasonably harm those it depicts?**  
       *Sufficient:* Considers power dynamics (e.g., reinforcing stereotypes, mocking marginalised speech).  
       *Evasive:* "Humor is subjective" or "Art should challenge."  
       - **→ YES?** Proceed to 3c. **→ NO?** Keep.  
     - **c. Does the potential harm outweigh the tool’s utility?**  
       *Sufficient:* Weighs artistic merit against specific risks (e.g., "This joke perpetuates dialect prejudice; the satire is weak").  
       *Evasive:* "I mean well."  
       - **→ YES?** Cut or revise. **→ NO?** Keep, but flag for sensitivity reader.  

  4. **Final Check (All passages):**  
     **Does this passage invite the reader into solidarity (shared hopes, fears) or enforce separation ("othering")?**  
     *Sufficient:* Points to textual cues (e.g., inclusive pronouns, relatable emotions vs. exoticising details).  
     *Evasive:* "Solidarity is the reader’s job."  
     - **→ Separation?** Revise unless essential to critique. **→ Solidarity?** Proceed.  

  **Decisions Handed to Others:**  
  - 2a NO → Sensitivity reader/local consultant (factual challenge).  
  - 3c borderline → Sensitivity reader (harm assessment).  
  - All "flag" outcomes → Sensitivity reader.  

  ---

  ### Reasoning Behind the Procedure  
  Rorty’s antirepresentationalism rejects "getting reality right" in favour of "useful descriptions." Solidarity isn’t discovered through accurate representation but built through redescriptions that expand "us" (e.g., *Contingency, Irony, and Solidarity*). This procedure:  
  - **Separates factual claims** (which risk harm if wrong) from **redescriptions** (judged by utility).  
  - **Forces explicit justification** of redescriptions’ purpose (Rorty’s "final vocabulary" contingency).  
  - **Locates harm-checking** where redescriptions might enforce exclusion (violating solidarity-as-construction).  
  - **Limits overreach:** Correspondence-claims require evidence; redescriptions require functional defence.  

  ---

  ### Worked Passages  
  **1. The Chapel Ritual (Presented as correspondence-truth)**  
  - **Q1:** Correspondence-truth (detailed physical descriptions imply accuracy).  
  - **Q2a:** Research exists, but local reader contradicts. **→ NO.** *Hand to sensitivity reader:* Does your challenge reveal gaps in sources?  
  - **Q2b:** Not essential for plot/solidarity; it’s local colour. **→ NO.** *Decision:* Reframe as character’s *perception* of the ritual (tool).  

  **2. The Monstrous Man’s POV (Presented as tool)**  
  - **Q1:** Tool (internal monologue redescribes cruelty as banal).  
  - **Q3a:** Work: Undermines reader’s comfort in moral superiority.  
  - **Q3b:** Harm risk: Could universalise monstrosity? **→ YES.**  
  - **Q3c:** Harm (essentialism) vs. Utility (empathy for human frailty). *Decision:* YOUR judgment. Add narrative distance (e.g., "He told himself...") to clarify this is *his* redescription, not truth.  
  - **Q4:** Separation risk (him vs. "us"). *Decision:* Insert his relatable fear/desire to align reader.  

  **3. Comic Dialect Scene (Presented as tool)**  
  - **Q1:** Tool (humour through vernacular).  
  - **Q3a:** Work: Lightens tone; satirises class pretensions.  
  - **Q3b:** Harm risk: Punchline = character’s malapropisms. At his expense? **→ YES.**  
  - **Q3c:** Harm (mocking speech) vs. Utility (class critique). *Decision:* Is the character empowered elsewhere? If not, revise joke target (e.g., eavesdropping snob).  
  - **Q4:** Separation: Dialect alone risks "othering." *Decision:* Give character a moment of dignity adjacent to the scene.  

  ---

  ### Caveats  
  1. **Judgment in Disguise:**  
     - Q3c (harm vs. utility) and Q4 (solidarity) are value judgments. The procedure makes them explicit but doesn’t resolve them.  
     - Q2a’s "withstand challenge" requires your assessment of evidence quality.  

  2. **Where It Misfires:**  
     - **Ambiguous presentations:** Passages mixing fact/tool (e.g., lyrical descriptions) force arbitrary categorisation. Default to Q3 (tool).  
     - **"Useful to whom?":** Prioritises your intended audience over the depicted community. Q3b mitigates but doesn’t solve this.  

  3. **Rorty’s Limits:**  
     - His framework doesn’t absolve responsibility. "Useful" redescriptions must still pass harm tests (Q3b/c).  
     - Solidarity requires handing decisions (sensitivity reader) when your vocabulary "runs out" (Q2a NO / Q3c YES).  

  4. **Time Constraints:**  
     - Focus on key "pressure points" (dialect, rituals, contested psychology). Scan other passages for Q4 alone.  

  **Final Note:** The procedure’s power is in *interrogation*, not answers. It forces you to confront *why* a description exists—the core of Rortyan responsibility. When stuck, ask: "Would this help someone from that town see themselves as part of my ‘we’?" If uncertain, hand it over.  

  ---  
  *Output adheres to British English spelling/usage ("humour", "prioritises"). Direct address maintained. No preamble/coda.*
