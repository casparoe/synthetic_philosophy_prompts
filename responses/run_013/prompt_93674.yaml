  The jurisdictional principle suggests archives decide factual claims while memory sustains belonging. Trusteeship adds that communities preserve memory for future generations, creating tension between conservation and extraction. 

  Looking at the cases: In the mill town plaque (#1) and museum label (#6), I agree factual corrections are needed because these involve claims against others. But for family reunion stories (#2) or diaspora songs (#8), preserving belonging seems paramount. The union case (#3) is clever - keeping the story for internal solidarity while correcting for external negotiations shows practical wisdom.

  The reparations case (#5) is particularly thorny. The user admits they'd only correct if the claim is at stake, revealing their own tension between truth and justice. This suggests their principle isn't fully consistent. 

  For candidate principles, I'm considering three options: The first would strictly apply jurisdiction, but that breaks down in cases like the village cove (#7) where invented tradition deserves protection. A second principle prioritizing trusteeship might excuse too many falsehoods. The best fit seems a dual-track approach separating belonging-context from claim-context, with trusteeship as a modifying factor.

  Testing this against all cases: It works for most, but forces surrendering the reparations verdict (#5) - if we correct for claims, we must tell the community even if it weakens their case. That's painful but necessary for consistency. 

  For the new cases: The surgeon's hospital name should stand for belonging but include the truth somewhere; the invented grammar can be embraced as lived tradition now; private family letters needn't be disclosed. My invented case about conflicting war memorials shows even belonging-contexts have limits when harm is done.

  The core tension remains: How much does truth matter when falsehoods bind people together? The user must decide whether correcting the reparations claim is worth the cohesion cost. That's the open question they'll wrestle with.
answer: |-
  ### Summary  
  Your verdicts prioritize social cohesion and belonging over factual precision *except* when memory is weaponized to extract material or symbolic resources from others. Jurisdiction (record for claims, memory for belonging) explains most cases, but trusteeship (preserving memory for future needs) complicates this by justifying *some* factual deviations. Your core tension: truth must yield to belonging until power or resources are contested. The best principle distinguishes contexts where memory binds versus burdens.

  ### The Verdicts, Restated  
  1. **Mill town plaque** (claim about founder): Correct. *Factual claim used for honor.*  
  2. **Family migration story** (belonging ritual): Do not correct. *Inconsistent with 5/6 if belonging is sole criterion?*  
  3. **Union strike story** (ritual vs. negotiation): Split correction. *Shows context matters.*  
  4. **Displaced community’s origin ceremony** (belonging/sacred site): No correction owed.  
  5. **Enslavement claim in reparations** (resource claim): Correct despite weakening claim. *Inconsistent with 4?*  
  6. **Museum label** (artifact acquisition): Correct. *Identity doesn’t override coercive history.*  
  7. **Village cove custom** (invented tradition): Uphold claim. *Belonging + reliance override record.*  
  8. **Diaspora expulsion memory** (belonging vs. education): Rituals preserved, schools corrected.  

  *Flagged Inconsistencies*:  
  - **2 vs. 5/6**: Why protect family myth (2) but correct reparations claim (5)? *Answer: Claim-context forces correction.*  
  - **4 vs. 5**: Why protect origin ceremony (4) but correct reparations (5)? *Answer: Reparations impose burden.*  
  - **7 vs. 1**: Why correct plaque (1) but uphold invented cove right (7)? *Answer: Cove relies on lived reliance, not historical assertion.*  

  ### Candidate Principles  
  **A. Contextual Jurisdiction**  
  Memory governs belonging-rituals; record governs resource-claims. Falsity in ritual is tolerable if it sustains cohesion; falsity in claims is exploitative. *Motivated by union case (3) and museum (6).*  

  **B. Trusteeship-Weighted Jurisdiction**  
  Memory may deviate from record *only* if:  
  (i) It sustains belonging *without* imposing burdens (trusteeship as conservation), AND  
  (ii) Correction would destroy more value than it creates.  
  *Motivated by family story (2) and diaspora (8), where slow correction in schools balances belonging and truth.*  

  **C. Burden Test**  
  Correct deviations that shift burdens (material/symbolic) onto others; conserve deviations that bind without cost. *Motivated by reparations (5) and cove case (7): invented custom burdens no one, reparations claim does.*  

  ### Where They Come Apart  
  **Contextual Jurisdiction (A)** passes most cases:  
  - Corrects 1 (honor claim), 5 (reparations claim), 6 (acquisition claim).  
  - Protects 2 (family ritual), 3 (ritual side), 4 (ceremony), 8 (songs/sermons).  
  - *Fails 7*: Cove claim *is* a resource claim but you uphold it. Principle A would force correction, rejecting your verdict.  
  - *Fails 8’s school clause*: Schools aren’t "claim" contexts, so A might protect the myth. You demand correction.  

  **Trusteeship-Weighted Jurisdiction (B)** handles 7 better: The invented cove custom (7) created reliance (conservative trusteeship), so conserving it adds value. It also allows diaspora schools (8) to correct without violating belonging-trust. But it *fails 5*: Correcting the reparations claim destroys value (cohesion/claim), yet you demand truth. B might permit silence here.  

  **Burden Test (C)** is strongest:  
  - Correct 1 (philanthropist claim extracts deference), 5 (reparations claim burdens estate/polity), 6 (label obscures coercion, burdening descendants).  
  - Protect 2 (no burden), 3 (ritual: no burden; negotiations: burden if false history used), 4 (ceremony burdens none), 7 (cove custom burdens no one; estate never objected), 8 (songs: no burden; schools: slow correction avoids burden).  
  - *Costs you 1 point*: In 5, you note you’d *not* correct if no claim existed. But C demands correction *whenever* burden exists, regardless of stakes. Your hesitation violates C.  
  - *Justifies 7*: Invented tradition imposes no new burden, so conserve.  

  **Surviving Principle**: **Burden Test** (C). It explains all verdicts except your contingent view in 5.  

  ### Verdicts on New Cases  
  **(a) Surgeon’s hospital name**:  
  - *Burden Test*: Name sustains belonging (no burden), so conserve. But if the name extracts public honor (e.g., inspires trust in medical ethics), correct. *Verdict*: Keep name, but add plaque detailing unethical trials.  

  **(b) Invented grammar in language revival**:  
  - *Burden Test*: No burden imposed; the grammar binds speakers. Conservation justified. *Verdict*: Embrace the grammar as lived tradition.  

  **(c) Mother’s account vs. private letters**:  
  - *Burden Test*: Revealing letters might burden family relationships (symbolic harm). No resource claim. *Verdict*: Do not disclose.  

  **(d) Your Case: War Memorial**  
  *A monument names "heroes" who the record shows deserted. The community uses it for Veterans Day.*  
  - *Burden Test*: The myth burdens deserters’ descendants (stigma) and extracts unearned honor. *Verdict*: Correct the monument. *Strain*: If the deserters’ identities are lost, correction might only fracture cohesion without remedying burden.  

  ### What You Have to Give Up  
  **Your verdict in Case 5**: You must correct the reparations claim *even if* you would prefer silence when no claim exists. The Burden Test demands truth when falsity shifts burdens, regardless of your pragmatic hesitation.  

  **Cost**: You lose moral flexibility. In reparations, truth may shatter solidarity or doom a just claim weakened by technicalities. But consistency requires it: if claims invoke the record’s jurisdiction, you cannot toggle honesty based on stakes.  

  ### Open Questions  
  Can "burden" include psychological harm to outsiders? When does lived reliance (as in the cove) outweigh archival truth? Is a community obliged to *seek* the record before ritualizing memory?
