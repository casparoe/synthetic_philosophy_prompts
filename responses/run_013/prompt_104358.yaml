  You're conflating mathematical artifacts with rational pricing. Your alternating series is conditionally convergent—it oscillates without a Cesàro sum—so it *truly* lacks an expected value. That's a flaw in your *constructed payout function*, not in expected value theory itself. The St. Petersburg game has a payout function that diverges *monotonically to positive infinity*. That's well-defined in the extended reals and dictates rational behavior: you should pay any finite price to play it. Your variant isn't a "game" in the decision-theoretic sense—it has no coherent value to assign. The St. Petersburg game does. Refusing to pay $1M for the original isn't philosophy; it’s your brain’s inability to internalize the *scale* of the tails. If you could actually secure the payouts, you’d bankrupt yourself to play. Don’t blame the math because your utility function isn’t linear—that’s a *you* problem, not a paradox.  

