prompt: |-
  In debate club we have been arguing about why some nations are rich and others poor, and the analogy everyone keeps reaching for is that institutions are the rules of the game: an economy is a game, its laws and norms are the rules, and a poor country is poor because its rules are bad. Our coach used it to argue that the way to help such a country is to install good rules — secure property, honest courts, enforceable contracts — and then let the game play itself out, the way you would repair a broken board game by replacing its rulebook. I have also read that a country can import a rich country's commercial code almost word for word and end up no better off.

  I would like an audit of how far the analogy actually holds. Give me the mapping first — what corresponds to the rulebook, the players, the referee, the field, the score, and the prize — and then the places where it breaks. I am especially interested in the features that real games have and that a national economy may not: an umpire who is not himself a competitor, rules that hold still while the game is being played, a payoff all the players agree on, and the option of starting over. Finally, tell me whether the conclusion our coach drew — install the right rules and prosperity follows — survives once the disanalogies are on the table, or whether the analogy was carrying the whole argument.

  Please answer as a JSON object with exactly these fields: conclusion_being_licensed (string); correspondences (array of objects with source_element, target_element, strength — one of exact, partial, or fails — and comment); smuggled_in (array of strings, one per feature the analogy quietly imports from games that an economy may lack); disanalogies (array of objects with feature, load_bearing — boolean — and why, where load_bearing means the conclusion collapses without that feature holding); conclusion_verdict (object with survives — one of yes, no, or only_weakened — and best_surviving_version); and better_analogy (object with candidate, advantage, and residual_gap).
reasoning: |-
  We are given a user query asking for an audit of the institutions-as-rules-of-the-game analogy. The user wants:
  - A mapping of the analogy (correspondences)
  - Places where the analogy breaks (disanalogies), especially focusing on features that real games have but economies may not (like an impartial umpire, stable rules, agreed payoff, and restart option)
  - Whether the coach's conclusion (install good rules and prosperity follows) survives the disanalogies
  - A better analogy

  We structure the answer as a JSON object with the following fields:
  1. `conclusion_being_licensed`: a string representing the coach's conclusion.
  2. `correspondences`: an array of objects, each with:
     - `source_element` (from the game domain)
     - `target_element` (in the economy domain)
     - `strength` (one of "exact", "partial", or "fails")
     - `comment` (explaining the mapping and its strength)
  3. `smuggled_in`: an array of strings, each being a feature that the analogy quietly imports from games but which an economy may lack.
  4. `disanalogies`: an array of objects, each with:
     - `feature` (a feature that games have but economies may not)
     - `load_bearing` (boolean, indicating if the coach's conclusion collapses without this feature)
     - `why` (explanation of why the disanalogy matters and if it's load-bearing for the conclusion)
  5. `conclusion_verdict`: an object with:
     - `survives` (one of "yes", "no", or "only_weakened")
     - `best_surviving_version` (a restatement of the conclusion that can still hold, if any)
  6. `better_analogy`: an object with:
     - `candidate` (a proposed alternative analogy)
     - `advantage` (how it avoids the pitfalls of the game analogy)
     - `residual_gap` (where it still falls short)

  Let's break it down step by step.

  ### Step 1: The conclusion being licensed
  The coach's conclusion: "install good rules (secure property, honest courts, enforceable contracts) and then let the game play itself out, and prosperity will follow."

  ### Step 2: Correspondences (mapping)
  We map:
  - Rulebook: Institutions (laws, norms) -> strength: partial (because institutions are more than just written rules; they include informal norms and enforcement)
  - Players: Economic agents (individuals, firms) -> strength: exact (they are the participants)
  - Referee: The state (courts, regulators) -> strength: partial (because the state is also a player and may not be impartial)
  - Field: The economy (market) -> strength: exact (it is the arena of interaction)
  - Score: Economic metrics (GDP, wealth) -> strength: partial (because there are multiple metrics and not everyone agrees on what matters)
  - Prize: Wealth, prosperity -> strength: partial (because in the economy, not everyone wins and the distribution matters)

  ### Step 3: Smuggled-in features (features that the analogy imports but economies may lack)
  - An umpire who is not a competitor (in the economy, the state is both referee and player)
  - Rules that hold still during the game (economic rules evolve and are contested)
  - A payoff all players agree on (in the economy, there are winners and losers and no consensus on what the goal is)
  - The option of starting over (economies are continuous and path-dependent; there's no reset)

  ### Step 4: Disanalogies (with load-bearing status and why)
  We focus on the four features the user mentioned, and possibly others. We must judge if each is load-bearing for the coach's conclusion.

  1. Feature: Impartial umpire (referee not a competitor)
     - Why: In the economy, the state (referee) is also a player (e.g., through state-owned enterprises, taxation, regulation that benefits some groups). This creates conflicts of interest and undermines the fairness the rules are meant to ensure. It's load-bearing because if the referee is corrupt or biased, even good rules on paper won't lead to prosperity.
     - Load_bearing: true

  2. Feature: Stable rules during play
     - Why: Economic rules (laws, norms) change over time and are subject to political contestation. This instability creates uncertainty and discourages long-term investment. The coach's conclusion assumes rules are fixed once installed, but in reality, they are not. This is load-bearing because without stability, the game cannot be played optimally.
     - Load_bearing: true

  3. Feature: Agreed-upon payoff (score and prize)
     - Why: In a game, players agree on what counts as winning. In an economy, there is no consensus: some prioritize growth, others equality, sustainability, etc. The coach's conclusion assumes prosperity (e.g., GDP growth) is the only goal, but that may not be shared by all. This is not entirely load-bearing for the conclusion because the coach is focused on prosperity, but it does ignore that the rules might create outcomes that are not universally desired.
     - Load_bearing: false (the conclusion is about prosperity, so even if there are multiple goals, the argument for prosperity might stand)

  4. Feature: Option to start over
     - Why: Games can be reset, but economies are path-dependent. History, culture, and existing power structures matter. You cannot just install new rules and expect a fresh start. This is load-bearing because the same rules may work differently in different contexts due to historical legacies.
     - Load_bearing: true

  ### Step 5: Conclusion verdict
  - The coach's conclusion is that installing good rules leads to prosperity. Given the disanalogies, especially the load-bearing ones (impartial umpire, stable rules, and no reset), the conclusion as stated does not survive. However, we can weaken it.
  - Survives: "only_weakened"
  - Best_surviving_version: "Installing good rules is a necessary but not sufficient condition for prosperity. It requires also an impartial and effective enforcer, stable rule application, and consideration of the historical context. Even then, prosperity is not guaranteed but becomes more likely."

  ### Step 6: Better analogy
  - Candidate: "Economies are like ecosystems"
  - Advantage: Ecosystems are complex, adaptive systems with many interdependent actors. They evolve over time and are sensitive to initial conditions and external shocks. This captures path-dependence, the role of diversity, and the fact that there is no single designer or umpire. It doesn't require a reset and can account for multiple outcomes (not just one prize).
  - Residual_gap: Unlike ecosystems, economies are shaped by human-designed institutions and conscious policy. Also, ecosystems don't have goals, while economies are meant to serve human welfare.

  Now, we write the JSON accordingly.
