prompt: |-
  I produce a small interview podcast on philosophy of mind, and I'm preparing an episode with a guest whose position is, I think, both defensible and unusually hard to interview well. She holds that global workspace theory — roughly, the claim that a mental state is conscious just in case its content is broadcast widely enough to be available to a broad coalition of consumer systems, with the broadcast being all-or-none rather than graded — is a complete theory of access consciousness, and that there is nothing further for phenomenal consciousness to be. The "what it's like" is not a second phenomenon left unexplained by the workspace story; it is that story described from the inside, and the residual feeling that something has been left out is an artefact of introspection rather than a datum about the mind. She is careful to distinguish this from saying experience is illusory or unreal: on her view experience is entirely real, just not additional. I want the episode to be genuinely substantive rather than another round of the familiar hard-problem standoff, so I need questions that engage the internal machinery and the empirical commitments of the position rather than its conclusion.

  Before drafting anything, please think through the strongest objections available to someone who accepts the empirical core of workspace theory but rejects the collapse of phenomenal into access — especially objections that turn on cases where reportability and experience seem to come apart, and on unclarities inside the theory itself (what exactly qualifies as a coalition, whether partial or overlapping broadcasts are possible, whether the theory's real target is experience or merely reportability). Then draft ten to twelve interview questions, ordered so that the pressure builds rather than resetting each time. I want at least one question on whether a subject could have vivid experience without any broadcast, and the mirror case of a broadcast that produces no experience; at least one on the unity of consciousness — whether a single winner-take-all coalition is required, or whether two simultaneous partial broadcasts would amount to two streams of experience in one subject; at least one on what empirical result she would treat as refuting her, given that she reads the usual no-report and overflow findings as friendly to her side; and at least one on why the inside description of a broadcast should not itself be treated as a further fact needing explanation. For every question, include the follow-up keyed to the answer she is most likely to give, since the whole point is to keep moving after the first deflection. Avoid anything that invites a textbook restatement of the view, and avoid biographical or warm-up questions.

  Return the result as a single JSON object with three fields. The first, "position_summary", is a string of no more than three sentences stating the position you take yourself to be interviewing, so I can check that we agree. The second, "objection_map", is an array of objects with fields "objection" (a string), "why_it_bites" (a string explaining what in her view it threatens), and "likely_rejoinder" (a string). The third, "questions", is an array of objects, each with fields "id" (an integer), "question" (a string, the question as I would actually ask it aloud), "targets" (a string naming the specific commitment it presses on), "expected_reply" (a string), "follow_up" (a string), and "pressure_point" (a string describing what I should listen for in her answer to know whether the follow-up is still needed). End the object with a "closing_question" field holding a single string: the one question I should save for last.
reasoning: |-
  We are given detailed instructions for creating an interview structure for a podcast on philosophy of mind. The guest holds that global workspace theory (GWT) provides a complete account of consciousness, collapsing phenomenal consciousness into access consciousness. The goal is to create substantive questions that press on internal machinery and empirical commitments.

   Steps:
   1. Position Summary: Write a concise summary of the position.
   2. Objection Map: Think of strong objections that target the collapse of phenomenal into access, especially from someone who accepts the empirical core of GWT but not the collapse. We are to consider cases where reportability and experience come apart, and unclarities in the theory (coalition criteria, partial broadcasts, etc.). For each objection, explain why it bites and a likely rejoinder from the guest.
   3. Questions: Draft 10-12 interview questions that build pressure. They must include at least:
      - One on vivid experience without broadcast and the mirror case (broadcast without experience).
      - One on unity of consciousness (single vs. multiple simultaneous broadcasts).
      - One on what empirical result would refute her (since she sees no-report and overflow as friendly).
      - One on why the inside description isn't a further fact.
    Each question should have:
      - id: integer
      - question: string (as asked aloud)
      - targets: specific commitment it presses on
      - expected_reply: what she is most likely to say
      - follow_up: the next question keyed to that reply
      - pressure_point: what to listen for to know if the follow-up is needed (i.e., if she doesn't address the pressure point, then ask the follow-up)

   4. Closing Question: The last question to save for the end.

   We are to avoid textbook restatements and warm-up questions.

   Let's break it down:

   Position Summary (in 3 sentences):
     Global workspace theory (GWT) is a complete theory of consciousness: a mental state is conscious when its content is broadcast widely to a coalition of consumer systems in an all-or-none manner. Phenomenal consciousness (the "what it's like") is not an additional phenomenon but rather the first-person perspective on this broadcast process. The intuition that something is left out is an artifact of introspection, not a genuine feature of the mind.

   Objection Map: We'll create an array of objections. Each has:
     - objection: the objection in a string.
     - why_it_bites: why this is a problem for her view.
     - likely_rejoinder: how she might respond.

   We'll think of 4-5 strong objections.

   Questions: We'll create 10-12 questions. They should build in pressure. We'll order them so they build.

   We are to include at least one on:
     - Vivid experience without broadcast? (and vice versa)
     - Unity: single vs. multiple broadcasts?
     - What empirical result would refute?
     - Why isn't the inside description a further fact?

   For each question, we'll predict an expected reply and then a follow-up that presses if she doesn't address the pressure point.

   We'll structure the JSON as described.

   Let's outline:

   Objection Map (array of objects):

    1. Objection: Partial broadcast cases - What if a representation is broadcast to some but not all consumer systems? Does this lead to partial consciousness? But GWT says broadcast is all-or-none. Yet, empirical evidence might suggest graded availability.
       Why it bites: It challenges the all-or-none claim and may force a graded view, which might not capture the binary nature of phenomenal consciousness as we experience it.
       Likely rejoinder: She might argue that the workspace is designed to be all-or-none and that partial broadcasts are preconscious or that the coalition requirements define a threshold.

    2. Objection: Overflow cases (e.g., Sperling) - Subjects report seeing more than they can report. This suggests phenomenal consciousness without access (broadcast). But she reads these as friendly? How?
       Why it bites: If there is phenomenal consciousness without broadcast, then her collapse of phenomenal into access fails.
       Likely rejoinder: She might reinterpret overflow as involving potential access or rapid shifts in the workspace.

    3. Objection: What constitutes a coalition? Without clear criteria, the theory might be too vague to test. For example, if a broadcast only to two systems counts, then could a simple reflex be conscious?
       Why it bites: It threatens the empirical precision and could lead to overgeneration or undergeneration of conscious states.
       Likely rejoinder: Define coalition in terms of the systems that are necessary for the flexible control of behavior and report.

    4. Objection: The inside description problem - Even if we grant that the broadcast constitutes access consciousness, why should the first-person perspective (the "what it's like") be nothing over and above that? Why isn't the subjective experience an additional property?
       Why it bites: It directly challenges the collapse of phenomenal into access.
       Likely rejoinder: She might say that the first-person perspective is simply the functional role of the broadcast as it is experienced by the subject, and that the feeling of an additional property is an illusion.

    5. Objection: Cases of broadcast without experience? E.g., in blindsight, some information is used (so broadcast to some consumer systems) but without consciousness. Or in automatic actions.
       Why it bites: If broadcast can occur without phenomenal consciousness, then broadcast isn't sufficient for phenomenal consciousness.
       Likely rejoinder: She might argue that in blindsight, the information is not broadcast to the full coalition required for consciousness.

    6. Objection: Unity of consciousness - If we have two simultaneous but separate broadcasts (e.g., in split-brain patients or with dual tasks), does that mean two streams of consciousness? If so, how does that square with our normal unified experience?
       Why it bites: It tests the theory's ability to account for unity and whether it can handle multiple workspaces.
       Likely rejoinder: She might say that normally there is one global workspace, but in pathological cases there can be two, leading to two streams.

   Now, we'll draft 12 questions. We'll order by building pressure.

   Question Structure:

    We'll start with foundational clarifications and then move to objections.

    Order:

     1. Clarify the all-or-none broadcast and what counts as a coalition (to set the stage).
     2. The unity question (single vs. multiple broadcasts).
     3. The overflow cases (Sperling) and how she interprets them.
     4. The no-report paradigms and whether they show experience without broadcast.
     5. The inside description problem (why isn't it a further fact?).
     6. The case of vivid experience without broadcast (e.g., inattentional blindness?).
     7. The mirror case: broadcast without experience (e.g., blindsight?).
     8. What would refute her view?
     9. ... and so on.

   We need at least 10, so let's aim for 12.

   For each question, we'll write:

     id: 1 to 12
     question: as asked
     targets: e.g., "all-or-none broadcast", "unity of consciousness", etc.
     expected_reply: a brief prediction of her answer.
     follow_up: a question that presses if the reply doesn't address the pressure point.
     pressure_point: what to listen for that would make the follow-up unnecessary? If she doesn't hit that, then ask follow_up.

   Closing question: a final one to end on.

   Let's create the JSON accordingly.
