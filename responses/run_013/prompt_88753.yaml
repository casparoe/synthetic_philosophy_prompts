prompt: |-
  For the last six months I've been running a reading group — eight or nine people, mostly software engineers, plus a philosopher of science and one recovering product manager — working through the conceptual foundations of decision theory, and next month the session is mine to lead. The topic is revealed preference and the meaning of utility, fifty minutes, whiteboard, no slides. What I want from you is not an explanation of the material but a plan for teaching it: the order in which the pieces have to come so that nothing is asserted before it has been earned, and why the dependencies run that way. I've been assuming the load-bearing distinction is a three-way one — utility as a feeling, utility as the satisfaction of whatever the agent actually wants, and utility as a mere bookkeeping device for representing choices — but I can't tell whether that trichotomy should be the opening move or the payoff, and I suspect that getting the order wrong is precisely how the whole session collapses into either Benthamite hedonism or a flat behaviorism. I'd also like to know what I should explicitly refuse to cover at this level and say so out loud, given that I'd rather leave them with a clean puzzle than a half-digested formalism.

  Pick the one example that should carry the session, and tell me what it has to have and what it must not have. I've been toying with the canteen case, where a person's order changes the moment a third dish appears on the menu, and with the case of someone who keeps choosing the thing they insist they don't want, but I'm not convinced either does the right work; if the obvious toy case — you picked the apple, therefore you preferred the apple — is a trap, tell me why. Then give me the misconception map. I'm already braced for half the room hearing revealed preference as the claim that people always get what they want, for the ex-product-manager to read it as a license to treat A/B testing as a theory of welfare, for someone to object that a framework which can rationalize any choice by positing a matching preference is unfalsifiable and therefore empty, and for the philosopher to ask whether this is behaviorism with extra steps. Tell me which of those are really the same mistake wearing different clothes, where in the sequence each one should be headed off, and which I should let the room arrive at on its own rather than pre-empting. Finish with the single question I can put to the room in the last five minutes that would show the idea has landed rather than that they can recite a definition, and close the whole response with a final line of exactly the form \check{...} containing nothing but that question.
reasoning: |-
  We are designing a 50-minute session on revealed preference and the meaning of utility. The goal is to build the concepts step by step so that each piece is earned, avoiding premature formalism and steering clear of reducing the discussion to either hedonism or behaviorism.

  ### Core Trichotomy: When to Introduce?
  The three-way distinction (utility as feeling, as satisfaction of wants, as bookkeeping) is the key to resolving the conceptual puzzle. However, it should not be the opening because without the necessary setup, it might be misunderstood. Instead, it should be the payoff that emerges from examining the limitations of simpler views.

  ### Order of Presentation
  1. **Start with the Naive View (Utility as Feeling):** Begin by asking the group what they think "utility" means. Someone will likely say it's happiness or satisfaction. This is the intuitive, Benthamite view. Use a simple example: 
     - *Example:* Choosing between an apple and a banana. If you choose the apple, we might say you got more utility from it. But then ask: what if you choose the apple but then express regret? Or what if you choose something that you know isn't good for you (like a cigarette)? This view runs into problems because we observe choices that don't seem to align with what we think of as "happiness" or "well-being".

  2. **Introduce the Idea of Preference as Choice:** Move to the behaviorist insight: we can only observe choices. So we define preference as "what is chosen". 
     - *Example:* The apple choice again: you chose the apple, so we say you prefer apples over bananas. This is the basic revealed preference idea.

  3. **Challenge with a Counterexample that Breaks Transitivity or Consistency:** Now we need to show that defining preference as choice is not enough because we might observe inconsistent choices. 
     - **The Canteen Case (or a similar example):** 
          - Monday: The menu has steak and chicken. You choose steak.
          - Tuesday: The menu has steak, chicken, and frog legs. You choose chicken.
          What does this reveal? On Monday, steak was preferred to chicken. On Tuesday, chicken was preferred to steak? But also, we must note that the introduction of frog legs changed the choice between steak and chicken. This violates the Independence of Irrelevant Alternatives (IIA) and suggests that our simple mapping from choice to preference might be flawed.

     This example is better than the "choosing what you don't want" because it shows inconsistency without invoking internal states. It forces the question: How can we represent such choices?

  4. **Build the Revealed Preference Framework:** Explain that revealed preference theory aims to construct a preference relation from choices that must satisfy certain axioms (like transitivity) to be representable by a utility function. But if choices are inconsistent, then we cannot construct such a relation. So the theory imposes rationality axioms.

  5. **The Bookkeeping Device:** Now we can introduce the idea that utility is a numerical representation of a consistent preference ordering. It is a bookkeeping device. We can show that if choices are consistent (satisfy the axioms), then we can assign numbers such that the chosen option has a higher number. But note: the numbers are ordinal and arbitrary up to monotonic transformations. They don't measure happiness; they just rank options.

  6. **The Trichotomy as Resolution:** Now we can present the three meanings:
     - Utility as feeling (hedonistic) - we started here and saw problems.
     - Utility as satisfaction of wants - but note: we might want things that aren't good for us? And how do we know what we want except through choice?
     - Utility as bookkeeping - this is the revealed preference approach: it doesn't claim to capture internal states, only to represent choices in a consistent way.

     The key is to emphasize that revealed preference does not claim that the utility number is a measure of well-being or happiness. It is a representation of choices.

  ### What to Explicitly Refuse to Cover
  - **Cardinal utility:** We are only talking about ordinal utility. Do not get into interpersonal comparisons or expected utility (which requires cardinality for probabilities) unless it comes up naturally and then only to say that is beyond the scope.
  - **The philosophical debate about free will and determinism:** If someone asks whether this makes choice deterministic, say that we are bracketing that and only looking at patterns in observed choices.
  - **Welfare implications:** Do not let the discussion turn into "A/B testing tells us what makes people better off". We must separate positive (what choices are made) from normative (what choices should be made).

  ### The One Example to Carry the Session: The Canteen Case
  - **What it has to have:** 
     - A set of choices that are inconsistent when we try to infer a preference ordering without considering the context (the menu set). 
     - It must involve at least three options and two choice situations to show the inconsistency.
     - It must be simple and relatable (food choices are good).
  - **What it must not have:** 
     - Any reference to internal states (like regret or guilt) that might lead the discussion toward feelings. We want to focus on observable choices.

  ### Misconception Map and How to Handle
  1. **"Revealed preference means people always get what they want."** 
     - This is a conflation of positive and normative. We must clarify: revealed preference describes what is chosen, not whether it leads to satisfaction. Head this off when introducing the behaviorist step (step 2 above) by explicitly stating that we are not making claims about well-being.

  2. **Treating A/B testing as a theory of welfare (ex-product manager).**
     - This is a variant of the first mistake. When we get to the bookkeeping device (step 5), emphasize that the utility function we construct is only a representation of choices. It does not tell us what is good for the person. We can pre-empt this by saying: "Note: this framework does not tell us whether the choices are good or bad, only what they are."

  3. **"The framework is unfalsifiable because it can rationalize any choice."**
     - This is a deeper point. We must show that revealed preference theory imposes consistency conditions (axioms). If choices are inconsistent, then we cannot represent them by a utility function. So the theory is falsifiable: if we observe choices that violate the axioms, then the theory cannot represent them. Let the room arrive at this after presenting the canteen case. Then explain that the theory only applies when the axioms hold. If they don't, we either need a more complex model (like context-dependent preferences) or we abandon the representation.

  4. **"Is this behaviorism with extra steps?" (philosopher)**
     - This is a valid concern. We should acknowledge that revealed preference is behaviorist in method (it uses observed choices) but it is not necessarily committed to behaviorism as a philosophy because it does not deny the existence of internal states; it just doesn't use them. We can say: "Revealed preference is a methodological behaviorism: we use behavior to infer preferences, but we are not saying that mental states don't exist. We are just saying that for the purpose of modeling choice, we can work with behavior." This can be addressed when we contrast the three utility concepts.

  ### The Final Question
  In the last five minutes, we want to test if they understand that utility in revealed preference is a representation of choices and not a measure of well-being.

  - **Question:** "If we observe a person making a series of choices that are consistent (they satisfy the axioms of revealed preference), we can assign utility numbers to the options. What do these numbers represent? Do they tell us how happy the person is when they choose an option? Why or why not?"

  ### Final Line
  \check{If we observe a person making a series of choices that are consistent (they satisfy the axioms of revealed preference), we can assign utility numbers to the options. What do these numbers represent? Do they tell us how happy the person is when they choose an option? Why or why not?}
answer: |-
  ### Teaching Plan: Order and Dependencies  
  The session must build from observable choices to abstract utility, avoiding premature formalism. The trichotomy (utility as feeling, satisfaction of wants, or bookkeeping device) is the **payoff**, not the opener. Introduce it only after exposing the limitations of naive interpretations. Here’s the step-by-step sequence:  

  1. **Start with choice data (5 min)**  
     - **Why:** Ground the discussion in observable behavior. Reject introspection—we can’t see feelings or desires, only actions.  
     - **Example:** Display choices between two options (e.g., apple vs. banana). *"You picked the apple. What can we infer?"*  
     - **Dependency:** If utility is introduced first, it invites hedonism. Start with choices to force empiricism.  

  2. **Define "preference" as choice, then expose its fragility (15 min)**  
     - **Why:** Revealed preference (RP) begins as tautological ("choice reveals preference"). But this simplicity is deceptive—it must be challenged immediately.  
     - **Core Example: The Canteen Case**  
       - *What it must have:* A minimal violation of consistency. *"Monday: Steak (S) vs. Chicken (C) → choose S. Tuesday: S vs. C vs. Frog Legs (F) → choose C. What does Monday’s choice ‘reveal’? Can we still say S ≻ C?"*  
       - *What it must not have:* References to emotions (e.g., "they felt guilty"). Keep it behavioral to avoid conflating utility-as-feeling.  
       - **Why this example:** It forces the question: *Does choice = preference?* No—context (menu changes) distorts the mapping. This kills behaviorist reductionism early.  

  3. **Introduce axioms to rescue RP (10 min)**  
     - **Why:** After showing choices can be inconsistent, impose structure to make RP non-tautological.  
     - **Mechanics:** Sketch the Weak Axiom of Revealed Preference (WARP): *If A is chosen when B is available, B cannot be chosen when A is available in a pairwise contest.* Show how the Canteen Case violates WARP.  
     - **Dependency:** Without inconsistency, axioms seem pointless. With inconsistency, we need constraints to make utility representable.  

  4. **Define utility as a bookkeeping device (10 min)**  
     - **Why:** Now that axioms are motivated, utility can emerge as a tool—not a psychological entity.  
     - **Mechanics:** *"If choices satisfy WARP, we can assign numbers (utilities) to options such that chosen options have higher numbers. These numbers aren’t ‘happiness units’—they’re indices ranking choices."*  
     - **Trichotomy Payoff:** Contrast:  
       - *Feeling:* (Bentham) Utility as pleasure.  
       - *Satisfaction:* (Desire-fulfillment) Utility as getting what you want.  
       - *Bookkeeping:* (RP) Utility as a numerical representation of consistent choices.  
       - *Key: RP is only bookkeeping.* It doesn’t deny feelings/wants—it brackets them.  

  5. **Explicitly refuse to cover (state upfront):**  
     - Cardinal utility (interpersonal comparisons, intensity).  
     - Welfare economics (e.g., "Does RP justify A/B testing as welfare optimization?").  
     - Neuropsychological explanations (e.g., "dopamine utility").  
     *Say: "We’re isolating the logic of choice representation—not happiness, not morality."*  

  ---

  ### Misconception Map  
  | Misconception | Why It’s Wrong | When to Address | Pre-empt or Let Arise? |  
  |---------------|----------------|-----------------|------------------------|  
  | "RP means people always get what they want." | Conflates bookkeeping (is) with desire-fulfillment (ought). | When defining RP (Step 2). | Pre-empt: *"RP describes choices, not welfare."* |  
  | "A/B testing reveals true welfare." (Product manager) | Same as above—treats behavior as normative. | During bookkeeping (Step 4). | Pre-empt: *"RP doesn’t say choices are ‘good’—it’s descriptive."* |  
  | "RP is unfalsifiable." | Ignores axioms: Inconsistent choices violate WARP, falsifying utility representation. | After Canteen Case (Step 3). | Let arise, then refute: *"WARP is testable—violations break the model."* |  
  | "This is just behaviorism." (Philosopher) | Behaviorism denies mental states; RP is agnostic (it’s methodological). | During trichotomy (Step 4). | Let arise, then clarify: *"RP doesn’t say minds don’t exist—it avoids them."* |  

  **Crucial note:** The first two misconceptions are the same error—collapsing "is" into "ought." The last two are distinct: unfalsifiability attacks RP’s validity, behaviorism attacks its metaphysics.  

  ---

  ### Final Question (Last 5 Minutes)  
  **"We can assign utilities to your choices from the canteen case, but do those numbers measure how much satisfaction you *actually* derived from the steak? Why or why not?"**  

  \check{We can assign utilities to your choices from the canteen case, but do those numbers measure how much satisfaction you actually derived from the steak? Why or why not?}
