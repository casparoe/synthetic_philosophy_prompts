answer: |-
  Here's a prioritized ranking of your open questions on iterated elimination of dominated strategies (IEDS), based on foundational impact, upstream/downstream dependencies, and potential for advancing the field. Justification and movement factors follow:

  **Ranked Priority (Highest to Lowest):**

  1.  **The Epistemic Story: Does Common Knowledge of Rationality (CKR) genuinely deliver iteration, or does it assume something stronger?**
      *   **Why #1 (Most Upstream):** This is the bedrock justification for *why* we use IEDS. If CKR doesn't actually imply the full iterative process (especially for weak/mixed dominance), the entire edifice wobbles. Does CKR imply players eliminate *all* dominated strategies simultaneously? Does it require common belief in rationality at higher orders? Does it necessitate correlated beliefs? Resolving this directly impacts the interpretation and validity of *all* other aspects of IEDS (mixed/pure, beliefs, order-independence). Without a solid epistemic foundation, the procedure lacks its primary justification as a solution concept rooted in rationality.
      *   **Movement Factors:** Moves **up** if new epistemic paradoxes emerge or if novel logical analyses challenge the CKR->IEDS link. Moves **down** only if a conclusive, universally accepted epistemic justification for a *specific* version of IEDS is established.

  2.  **Mixed vs. Pure Dominance: Does a strategy dominated only by a mixture deserve parity with one dominated pure? What is the procedure tracking?**
      *   **Why #2 (Foundational Definition):** This defines the very core operation of "dominated." The choice profoundly impacts the set of strategies eliminated in the *first round* and beyond. Is dominance by mixtures a stronger or weaker rationality requirement? Are we tracking "never a best response" (mixed dominance) vs. "always worse than *some* pure alternative" (pure dominance)? This question is upstream of beliefs and order-independence – different dominance definitions lead directly to different outcomes for those questions. Understanding what "rationality" implies for dominance (pure vs. mixed) is crucial before iterating it.
      *   **Movement Factors:** Moves **up** if strong arguments linking mixed dominance to weaker/stronger epistemic assumptions than pure dominance emerge, or if applications show significant outcome divergence. Moves **down** if a compelling consensus emerges on the "correct" interpretation (e.g., mixed dominance as standard due to equivalence to "not rationalizable" or "never BR").

  3.  **Independent vs. Correlated Beliefs: Does each round use independent or correlated beliefs about opponents' surviving strategies? How much does correlation change outcomes?**
      *   **Why #3 (Operational Mechanic with Epistemic Ties):** Beliefs are *how* players justify eliminating a strategy as dominated. Independent beliefs (players believe opponents mix independently) vs. correlated beliefs (players allow for correlation) leads to different sets of strategies being dominated in each round. This is downstream of the epistemic question (#1) – what does CKR allow players to believe about opponents' potential correlations? It's also intertwined with mixed dominance (#2) – correlated beliefs can make more strategies dominated. While impactful, the outcome change depends heavily on the specific game, making it slightly less universally foundational than #1 and #2. However, understanding *why* correlation matters ties back to the nature of rationality and belief formation.
      *   **Movement Factors:** Moves **up** if significant classes of games are found where correlation dramatically alters predictions (especially relevant ones), or if strong epistemic arguments force a specific belief model. Moves **down** if analysis shows correlated elimination rarely differs from independent in "important" games, or if it's conclusively subsumed under the epistemic framework (#1).

  4.  **Order-Independence & Weak Dominance: Why order-independence holds for strict but fails for weak/ε-dominance? Is there a principled iteration for weak dominance?**
      *   **Why #4 (Procedural Consequence):** While practically important and often messy, this is largely a *consequence* of the choices made in #1, #2, and #3. Strict dominance is "robust" and path-independent. Weak dominance is fragile – eliminating one weakly dominated strategy can make another non-dominated (or vice-versa), and ε-dominance inherits this sensitivity. The search for a "principled" iteration (e.g., maximal eliminations, cautious IESDS) is an attempt to salvage a useful procedure given the inherent instability of the weak dominance relation itself, which stems from its definition (#2) and the belief structure (#3). The core problem is the definition of weak dominance, not primarily the iteration procedure.
      *   **Movement Factors:** Moves **up** if a truly compelling, game-theoretically justified (not just algorithmic) solution to weak/ε-dominance iteration emerges, or if a deep connection to the epistemic foundations (#1) explaining the instability is found. Moves **down** if weak dominance iteration is largely abandoned as fundamentally incoherent or replaced by a different concept (like proper equilibria) in applications.

  **Justification for Ordering & Dependencies:**

  *   **Upstream/Downstream:** The flow is largely: **Epistemology (#1)** -> **Definition of Dominance (#2)** -> **Model of Beliefs (#3)** -> **Procedural Properties (#4)**. #1 justifies *why* we iterate elimination. #2 defines *what* we eliminate in each step. #3 specifies *how players know* something is dominated (the belief model used in the dominance test). #4 deals with the emergent *properties* of the process defined by #2 and #3.
  *   **Foundational Impact:** Questions #1 and #2 challenge the core meaning and justification of IEDS. Resolving them potentially redefines the concept or reveals inherent limitations. #3 is a critical implementation detail with epistemic roots that significantly affects outcomes. #4, while practically vexing, addresses a known instability arising from the choices in #2 and #3.
  *   **"Earning its Keep":** For IEDS to truly "earn its keep," its foundation in rational behavior (#1) must be secure, and its core operation (#2) must be well-justified. Without these, debates about beliefs (#3) or fixing weak dominance (#4) are secondary. A shaky foundation undermines the entire procedure.

  **What Moves an Item:**

  *   **Up:** New *fundamental* logical inconsistencies or paradoxes discovered; strong new arguments linking it to deeper principles (rationality, computation, learning); evidence that resolving it unlocks significant progress on other major game theory problems; emergence of important applications where it's the critical bottleneck.
  *   **Down:** Emergence of a compelling, widely accepted solution or consensus; evidence that the problem is less central than initially thought (e.g., correlated vs independent rarely matters empirically); the question being effectively subsumed or resolved by progress on an upstream item.

  **Prioritization for Your Year:** Focus intensely on **#1 (Epistemology)** first. A deep understanding here is essential to frame the others. Then move to **#2 (Mixed vs Pure)**. These two define the "what" and "why." Allocate significant time to **#3 (Beliefs)** as it's operationally crucial and tied to both #1 and #2. Address **#4 (Order/Weak)** last, viewing it through the lens of the answers to #2 and #3 – it's more about managing a known consequence than discovering a new foundation. This order maximizes the chance that insights from upstream problems clarify or even resolve downstream ones.
