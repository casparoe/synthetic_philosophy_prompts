answer: |-
  Here's a decomposed, no-vibe credence breakdown for dialetheism (some contradictions are *true simpliciter*), with probabilities reflecting current philosophical consensus and key arguments. Total credence: **~3%**.

  ---

  ### (a) Liar Paradox as sound argument for true contradiction (not defused by Kripkean gaps)  
  **Credence: 5%**  
  *Why:* Kripke’s "truth gaps" (liar is neither true nor false) avoids dialetheism elegantly and aligns with natural-language intuitions. Dialetheist solutions (e.g., Priest’s) require heavier metaphysical lifting. Most semanticists prefer gaps, partial truth, or contextual approaches.  

  ### (b) Natural-language "not" is explosive (contradictions entail anything)  
  **Credence: 10%**  
  *Why:* Explosion fails in everyday reasoning ("This round square is blue" doesn’t entail "2+2=5"). Paraconsistent negation (rejecting explosion) is defensible without dialetheism—e.g., in non-classical logics for vagueness or paradox. Negation’s core function (denial, exclusion) doesn’t *require* explosion.  

  ### (c) Semantic paradoxes are the strongest pressure for true contradictions  
  **Credence: 85%**  
  *Why:* Vagueness (e.g., heap paradox) usually motivates *gaps* (neither true nor false), not gluts. Scientific inconsistencies (e.g., classical vs. quantum physics) are resolved by theory revision, not embracing contradictions. Liar-like paradoxes are the *only* area where respected philosophers (e.g., Priest) argue for gluts as the *best* solution.  

  ### (d) Paraconsistency and dialetheism are a package deal  
  **Credence: 15%**  
  *Why:* Your friend is correct. Paraconsistency (rejecting explosion) is a *logical tool* for handling inconsistency in databases, legal systems, or epistemology—no commitment to *ontological* gluts (e.g., Belnap’s "useful falsehoods" approach). Dialetheism is a metaphysical claim; paraconsistency is not.  

  ### (e) Dialetheist "not" is recognizable as negation  
  **Credence: 20%**  
  *Why:* Dialetheists (e.g., using logic **LP**) preserve core negation features: ~T implies F, ~~P ≡ P, and exclusion (P ∧ ~P isn’t *always* true). But it loses "exhaustion" (every sentence is T or F). Meaning-change objections are serious but not fatal—similar to intuitionist vs. classical negation debates.  

  ### (f) Other factors (metaphysical cost)  
  **Credence: 2.5%**  
  *Why:* The biggest barrier is **metaphysical implausibility**. True contradictions violate the Law of Non-Contradiction (LNC) as a fundamental principle of reality—not just logic. Even if semantics *suggests* gluts, Occam’s Razor slices hard: gaps, context-dependence, or linguistic revision are less costly than "true contradictions exist."  

  ---

  ### **Total Credence for Dialetheism (true contradictions *simpliciter*): ~3%**  
  **Calculation:**  
  - Multiply key independent pressures: (a) 5% × (c) 85% × (e) 20% × (f) 2.5% ≈ **0.002%** → unrealistically low.  
  - **Better model:** Weighted average prioritizing (f) and (c). Baseline (f) = 2.5%, boosted by (a)/(c) but crushed by plausibility. Result: **~3%**.  

  ---

  ### Key Takeaways:  
  - **Biggest drag:** (f) Metaphysical cost (2.5%). True contradictions violate a near-universal intuition about reality’s structure.  
  - **Most defensible:** (d) Paraconsistency ≠ dialetheism (85% *against* package deal). Your friend is right—this is a standard position (e.g., "formal paraconsistency").  
  - **Best bet against:** (b) Explosive natural negation. Almost no one thinks ordinary "not" explodes—paraconsistent negation is linguistically viable without dialetheism.  

  ---

  ### **Game-Changing Argument:**  
  A discovered **fundamental physical contradiction** (e.g., in quantum gravity) would move me most. If an *empirically indispensable* scientific theory required true gluts (not just inconsistency), dialetheism could hit **40%**. Currently, no such theory exists—semantic paradoxes are "language games."  

  ### **Logic vs. Metaphysics:**  
  > *"90% of this debate is people talking past each other across the logic-metaphysics divide."*  
  - **Logic:** Paraconsistency is a coherent *framework* (credence: 100% it’s useful).  
  - **Metaphysics:** True contradictions existing *in the world* is the real claim (credence: 3%). Dialetheists often blur this line; critics attack the metaphysics. Your suspicion is dead-on.  

  Final credence is low because dialetheism solves narrow problems (liar paradox) at excessive metaphysical cost—while less radical fixes (gaps, contextual truth) handle them almost as well.
