  **Re: Point 2 (Triviality Clause §4.7)**  
  §4.7 states cognition *can* be instantiated on any Turing-complete system, per computational theory. However, Substrate Tier Framework §3.2 downgrades non-certified systems to Tier 0:  
  - Tier 0 substrates (e.g., walls, buckets) lack I/O coherence, real-time binding, and entropy management.  
