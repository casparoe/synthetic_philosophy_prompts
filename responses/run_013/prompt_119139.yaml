prompt: |-
  I run a weekly reading group, small room, mix of philosophy grad students and two engineers. Everyone in there can do Bayes' rule in their sleep, but none of them has ever read anything on imprecise probabilities, and honestly none of them has thought much about decision rules under uncertainty either. Next month it's my turn to run the session: 75 minutes, whiteboard, no slides. Don't explain the topic to me, plan how I should explain it.

  What has to land first for the rest of it to even be statable, and what depends on what? Pick the one example that carries the whole thing and tell me what it has to have and what it must not have. I assume everyone reaches for the Ellsberg urn, so if that's your pick say why it survives the trip, and if it isn't, say exactly what it gets wrong for this room. Then the misconceptions: I'd bet money someone says "isn't this just a probability distribution over probabilities," and I need to know where in the sequence I head that off before it sets, plus the two or three others I should expect and the precise point in the arc where each one gets dealt with. Tell me the one thing I should announce out loud that I'm refusing to explain at this level. And give me a single closing question to put to the room that would actually show me whether the idea landed or whether they just nodded along.

  Give me definite choices with your reasons, not a menu of options you leave me to sort out. American English, please.
reasoning: |-
  Okay, the user runs a reading group with philosophy grad students and engineers. Everyone knows Bayes' rule well but hasn't touched imprecise probabilities or decision rules under uncertainty. They need a 75-minute whiteboard session plan. 

  First, gotta figure out the core foundation. The key is that ambiguity (unknown probabilities) is fundamentally different from risk (known probabilities). If this distinction doesn't land, the whole thing crumbles. 

  Ellsberg's urn is the obvious example choice. Why? Because it's visceral - people feel the aversion in their guts when choosing between the risky vs ambiguous bet. The engineers will see the symmetry argument, philosophers will latch onto the preference inconsistency. Most importantly, no math needed upfront - just colored balls and choices. 

  But must avoid muddying the waters. The example must have clear unknown probabilities (no sneaky priors!), and must trigger real preference reversals (violating sure-thing principle). Ellsberg nails both. 

  Biggest misconception incoming: "Isn't this just second-order probabilities?" Gotta murder that one early - right after establishing ambiguity aversion. Point out: second-order probs would still collapse to a single betting quotient (via expectation), but Ellsberg shows people reject that. Whip out the math: if it were just E[p], they'd be indifferent between urns. They're not. 

  Other landmines: 
  - "So it's subjective probabilities being interval-valued?" → Delay until after decisions. First establish WHY we need intervals (via Ellsberg), THEN what they mean. 
  - "Can't we just add a risk premium?" → Crush when discussing decision rules. Show how minimax regret explains the paradox while EU fails. 

  Explicitly refuse to explain coherence theorems for lower previsions. That rabbit hole would nuke 75 minutes. Just say "There are consistency axioms but we're focusing on the intuition today." 

  Closing question: "If your pension fund offered two identical 5% expected return investments - one with known precise risk, one with ambiguous risk - which would you choose? Now: does that preference violate any standard decision theory axiom?" Watch engineers and philosophers fight. 

  Structure: 
  (0-10min) Punch them with Ellsberg choices → make them vote 
  (10-25min) Dissect why it breaks Savage → highlight ambiguity aversion 
  (25-35min) Demolish "second-order probability" counterargument 
  (35-50min) Introduce credal sets → show as possible probabilities 
  (50-65min) Connect to minimax → show decisions without collapsing intervals 
  (65-75min) Pension fund question → watch comprehension fireworks
answer: |-
  Here's your battle plan for the 75-minute session. Focused, no fluff, misconceptions pre-targeted.

  **Core Foundation That Must Land First:**  
  *Ambiguity (Knightian Uncertainty) is fundamentally different from Risk (known probabilities).*  
  If they don't grasp why "I don't know the probabilities" isn't solvable by just slapping a uniform prior on it (Bayesian reflex), nothing else matters. This is the crack in the foundation of precise probabilism you need to pry open.

  **The One Example: Ellsberg Urn (Yes, It Survives - Here's Why & How)**  
  *Use the classic 2-urn setup:*  
  - **Urn A:** 50 Red balls, 50 Blue balls. (Known probabilities: Risk)  
  - **Urn B:** 100 balls, Red/Blue in *unknown* proportion. (Unknown probabilities: Ambiguity)  
  *Betting Choices:*  
  1. Bet on Red from Urn A vs. Red from Urn B. (Most prefer Urn A)  
  2. Bet on *not*-Red from Urn A vs. *not*-Red from Urn B. (Most *still* prefer Urn A)  

  ***Why Ellsberg Works for This Room:***  
  1. **Triggers Intuition:** Engineers see symmetry; philosophers see preference inconsistency. The aversion to "not knowing" is visceral.  
  2. **Breaks Bayesian Rationality:** Shows Savage axioms failing *in practice*. No precise prior justifies preferring A in both bets. Forces them to confront ambiguity aversion ≠ risk aversion.  
  3. **No Math Overload:** Pure choice behavior makes the paradox undeniable before formalizing anything.  
  4. **Sets Up Decision Rules:** Naturally leads to "How *do* we decide if we can't use expected utility?"  

  ***What It Must NOT Have:***  
  - **Do NOT** introduce payoff variability (e.g., different prize values). Keep payoffs identical. The *only* difference is knowledge of probabilities.  
  - **Do NOT** let them assume a uniform prior over Urn B's compositions early on. That's the misconception you're here to destroy.

  **Misconceptions to Head Off & When:**  
  1. **"Isn't this just a probability distribution over probabilities?"**  
     - ***When to Kill It:*** Immediately after establishing the Ellsberg choices (minute ~15).  
     - ***How:***  
       *"If you put a uniform prior over Urn B's compositions (0-100 Red), the expected probability of Red is 50%. Same as Urn A. So why do you prefer Urn A for both bets? A second-order distribution says you should be INDIFFERENT. Ellsberg shows you aren't. Your uncertainty is *not captured* by any single distribution!"* → **Pivot to Credal Sets:** Draw the set of all possible distributions for Urn B: { P(R) = θ/100 | θ ∈ [0,100] }.

  2. **"So the probability is just... an interval? Like [0,1]?"**  
     - ***When:*** When introducing the credal set (minute ~25).  
     - ***How:***  
       *"An interval isn't enough. It's the *set of distributions* compatible with your knowledge. The probability isn't 'fuzzy'—it's that you can't pin down *which* precise probability applies. Decisions require more than intervals."* → **Pivot to Decision Rules:** "So how do we choose? We need rules that use the *whole set* (e.g., Γ-minimax, Maximin EU)."

  3. **"Can't we just add a risk premium?"**  
     - ***When:*** When discussing decision rules (minute ~50).  
     - ***How:***  
       *"Risk premiums adjust for known variance. Ambiguity aversion is different: you avoid Urn B *even if* the expected probability matches Urn A. It’s about missing information, not quantifiable risk."* → **Pivot to Ellsberg's Lesson:** "This is why we need new axioms (e.g., Schmeidler's ambiguity aversion)."

  **The One Thing to Refuse to Explain:**  
  *"I am explicitly NOT explaining coherence conditions for lower previsions (Walley’s theory) or the full Choquet integral setup today. Why? Because you need to see *why* we need these tools before diving into their consistency. Today is about the philosophical and behavioral motivation."*  
  *(Saves you from measure-theoretic tangents and keeps focus on intuition.)*

  **Closing Question to Test Comprehension:**  
  *"You’re offered two identical bets:*  
  *- Bet X: Win $100 if a randomly drawn ball from Urn A (50/50) is Red.*  
  *- Bet Y: Win $100 if a randomly drawn ball from Urn B (unknown mix) is Red.*  
  *You choose Bet X. Now, if I told you the ball drawn was definitely NOT from Urn A, would you rather switch to Bet Y—or keep Bet X (which now pays nothing)?"*  

  ***Why This Works:***  
  - A Bayesian who treated Urn B as E[P(Red)]=0.5 should be indifferent.  
  - An ambiguity-averse person who *revealed* a preference for Urn A **must** prefer to switch to Urn B in this new sub-bet (or they violate dynamic consistency).  
  - If they grasp imprecise prob, they’ll spot the tension: ambiguity aversion conflicts with standard updating. If they say "switch," they get it. If they hesitate, unpack why (e.g., "Urn B still feels ambiguous, even now!").

  **Session Arc:**  
  1. **(0-10 min)** Ellsberg Urn choices → Vote → Reveal typical preferences.  
  2. **(10-20 min)** Why this breaks Bayesian rationality (Savage axioms → Sure Thing Principle violated).  
  3. **(20-30 min)** Crush "second-order probability" → Introduce credal sets.  
  4. **(30-45 min)** Decisions under ambiguity: Γ-minimax vs. Maximin EU (whiteboard examples).  
  5. **(45-60 min)** Address "interval probabilities" & "risk premium" misconceptions.  
  6. **(60-75 min)** Closing question → Debate → Emphasize: Ambiguity ≠ Risk, and Bayes isn't enough.

  **Why This Works for Your Room:**  
  - Engineers get concrete examples; philosophers get axiom breakdowns.  
  - Ellsberg is the "hook" that forces them to doubt their Bayesian reflexes.  
  - Closing question exposes if they see the *implications* (updating, dynamic choice) → not just nodding.  
  - You refuse the rabbit holes (coherence, Choquet) but show why they exist.  

  **Stick to this. They’ll leave uneasy about Bayes—which means you succeeded.**
