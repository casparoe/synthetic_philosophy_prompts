answer: |-
  Here are two joke prompts targeting superrationality's symmetry fragility, set in mundane situations:

  **Version 1: Symmetry Holds (Cooperation)**
  > **Prompt:** Two perfectly identical roommates, Ben and Ben's Clone (same info, same sleep, same coffee), stare at the overflowing trash. Neither saw who last took it out. Write the internal monologue of one Ben deciding whether to take it out *now*, knowing his clone is reasoning identically. End with him taking the trash out. (Max 150 words)

  > **Expected Punchline (via action):** The Ben realizes: *"If I defect (don't take it out), my clone, reasoning identically, also defects. Trash stays. If I cooperate, he cooperates too. Trash gets taken out... but only if we both choose it. Wait... my choice *is* his choice. Therefore, cooperation is the only rational outcome where the trash moves."* He sighs and grabs the bag. Simultaneously, his clone sighs and reaches for the bag.

  **Version 2: Asymmetry Breaks (Mutual Defection)**
  > **Prompt:** Roommates Alex and Sam face the overflowing trash. Both believe they are superrational agents. Alex *thinks* Sam saw her take it out last week (Sam didn't). Sam *thinks* Alex stayed up later and is crankier (Alex isn't). Write the scene where they both conclude they must defect (not take it out), walk away, and the trash remains. End with their frustrated internal thoughts. (Max 150 words)

  > **Expected Punchline (via dialogue/internal thought):**
  > Alex: *(Thinking: "Sam saw me take it last week. His identical reasoning *must* conclude it's my turn. If I cooperate now, he defects, exploiting me. I must defect.")*
  > Sam: *(Thinking: "Alex is sleep-deprived and irrational. Her identical reasoning will defect expecting me to be cranky. I must defect preemptively.")*
  > They make eye contact, nod curtly, and both turn away from the bin.
  > Alex (muttering): "Knew he'd pull this."
  > Sam (muttering): "Totally predictable."

  **Why these work:**
  1.  **Niche Target:** The humor relies entirely on understanding superrationality's core premise and its critical dependence on perfect symmetry. The jokes fall flat without that context.
  2.  **Symmetry Fragility:** Version 2 explicitly exploits the *underexplored seam* – how tiny, perceived asymmetries destroy the cooperative equilibrium, leading mutual defection where both feel rationally justified.
  3.  **Mundane Setting:** Trash duty is perfectly banal, highlighting the absurdity of applying high-level decision theory to it.
  4.  **Show, Don't Tell:** The reasoning is implied by the situation and internal thoughts/dialogue. No character stops to lecture.
  5.  **Contrast:** Comparing the two versions clearly demonstrates the pivotal role of symmetry. Version 1 shows the ideal in action; Version 2 shows how easily it crumbles in reality (or perceived reality).
