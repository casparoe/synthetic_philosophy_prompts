  In the Verificationist core section, distinguishing meaningless from unverifiable is crucial. The user wants to avoid letting her dismiss the principle as dead. I should frame questions that force her to clarify this distinction and defend against objections like unverifiable scientific theories. The follow-up on whether the principle is self-applicable targets internal consistency.

