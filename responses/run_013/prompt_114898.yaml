prompt: |-
  I'm in a fortnightly reading group on explanation in the social sciences, and me and Priya — she's a philosopher of economics, very sharp, very stubborn — have been going back and fourth for about a year about whether sentences like 'the panic spread through the regional banks' or 'the bank was solvent but illiquid' do any real explanatory work, or whether they're just shorthand for a very long list of things that individual people did. Last week she turned up with an argument she says settles it, and I think it proves far too much. Here it is, in her numbering. (1) Only individual human beings exist and act; 'the market', 'the banking system' and 'confidence' name nothing over and above individuals and what they do. (2) A statement explains an event only if it cites a cause of that event, and the causes of events are the doings of individuals together with their upshots. (3) So any social explanation that appears to cite something supra-individual — the bank's insolvency, the spread of the panic, the collapse of confidence — is at best an abbreviation for a list of individual doings, and at worst a disguised appeal to a ghost. (4) An abbreviation that can't in principle be cashed out as individual doings isn't an explanation at all, it's a placeholder. (5) Try it on our case: Bank B was solvent at nine in the morning and finished by four, and what finished it was that every depositor knew every other depositor was pulling their money out. Spell that out and you either never finish the list, or you smuggle the macro-facts back in as you go. (6) Therefore the only explanation of the collapse is the list of individual withdrawals, and 'it was a run, and any bank with that balance sheet and no insurance would have gone the same way' adds nothing to it. (7) Therefore social science has no explanations of its own: it has summaries of psychology, and where it can't produce those, it has nothing.

  I want to keep (1) and (2) — I really do think there are no group agents and no spooky collective minds, and I'm not willing to let 'the market decided' back in as a literal causal agent. But (6) and (7) I can't stomach. Two towns with identical depositors, one with deposit insurance and one without, don't fail in the same way, and the insurance doesn't work by changing anybody's psychology — it works by changing what it's rational for them to do, which looks like a structural fact doing causal work. Same with the run itself: the reason it's worth saying that it was a run rather than a case of mass irrationality is that it tells you what would have happened to any other bank in that position, and no list of what these particular people happened to do will tell you that. So I think something in the middle is doing the damage, and I half-suspect a slide between two senses of 'nothing over and above' — or maybe (2) is just false as stated, or maybe (5) is quietly an empirical claim about my patience rather than about explanation — but I can't tell which, and I dont know what I'd be buying if it turned out to be (2) that had to go.

  You're a philosopher of social science with a good nose for equivocation, scope slips and modal slides; treat me as a grad student who can take the technical stuff and doesn't need it softened. Before you commit to a verdict, brainstorm two or three different readings of the argument and say which step each reading pins the blame on, and how plausible that reading is; then give me your actual diagnosis. Name the step you reject, explain why it looked fine in the first place, and price the alternatives — what each of (1), (2), (4) and (5) costs me if it turns out to be the culprit, and whether any reading makes the whole thing valid with a premise I should just swallow. Don't hand me a reading list or a string of citations, I can't get at any of that from where I'm sitting, and don't fob me off with 'it depends what you mean by explanation' unless you go on to say what it depends on.
reasoning: |-
  Okay, the user is in a reading group on explanation in social sciences and has a long-standing debate with Priya, a philosopher of economics. Priya presented an argument against supra-individual explanations in social sciences, and the user finds her conclusion unacceptable but can't pinpoint where the argument goes wrong. They want me to analyze Priya's argument step by step.

  First, I need to fully understand Priya's argument. Her points are numbered (1) through (7). She argues that only individuals exist and act, explanations must cite causes which are individual actions, so any social explanation is just shorthand for individual actions. She claims that statements about things like bank runs or insolvency don't add explanatory value and social science has no genuine explanations of its own.

  The user accepts premises (1) and (2) - ontological individualism and causal individualism - but rejects conclusions (6) and (7). They give examples: deposit insurance changes outcomes without changing psychology, and calling something a "run" conveys counterfactual information that individual actions don't. They suspect a fallacy in the argument but can't identify it.

  I need to brainstorm different readings of the argument. The key seems to be in how we interpret "nothing over and above" and "cites a cause." There might be ambiguity in whether "cites" means the linguistic form or the actual causal content. 

  For Reading A: Strict Nominalism. This would interpret "cites a cause" as requiring the explanation to literally mention individuals. But this seems too strong - we often refer to higher-level entities without denying their individual basis. The problem would be with step (2), which defines explanation too narrowly. Rejecting (2) might mean accepting that explanations can validly reference emergent properties.

  For Reading B: Eliminative Reductionism. This focuses on step (4) - that an abbreviation must be cashable into individual terms. But the user's counterfactual example shows that structural facts have explanatory power beyond particular instances. The issue is with (4)'s requirement of exhaustive cashability. Rejecting (4) would allow for explanatory concepts that aren't reducible to specific individual lists but still grounded in individuals.

  For Reading C: Modal Blindness. This looks at step (5)'s claim that spelling out the explanation either never finishes or smuggles in macro-facts. But the user's point about counterfactuals suggests that "run" conveys what would happen in similar situations, which individual actions alone don't capture. The problem is with (5), which ignores modal information.

  After brainstorming, I think Reading B (problem with step 4) is most plausible. The requirement that explanations must be cashable into individual terms ignores the explanatory value of patterns and structures that emerge from but aren't identical to specific individual actions. 

  My actual diagnosis is that step (4) is the culprit. It demands that abbreviations must be fully cashable into individual terms to count as explanations, but this conflates metaphysical reduction with explanatory practice. Structural facts like "this bank has no deposit insurance" are causally relevant even if they supervene on individual facts. 

  If I reject (4), I can maintain ontological individualism (1) and causal individualism (2) while allowing social explanations that reference patterns or structures. The cost is accepting that some explanations are irreducibly structural while still being grounded in individuals. 

  I'll explain why (4) looked plausible initially - because we expect explanations to have microfoundations. But the user's counterfactual examples show why this demand is too strict for explanatory purposes. The alternatives would be more costly: rejecting (1) would mean accepting group minds, rejecting (2) would allow spooky causation, and rejecting (5) would require denying obvious practical limitations.

  Finally, I'll emphasize that social science explanations can be genuine by capturing robust patterns and counterfactuals, not just summarizing psychology. This gives the user a way to preserve their commitment to individualism while rejecting Priya's strong conclusions.
answer: |-
  Here's a breakdown of Priya's argument, multiple readings pinpointing the flaw, and a clear diagnosis. Your instinct about "nothing over and above" and the counterfactual power of structural facts is spot on.

  **Brainstormed Readings & Culprit Identification:**

  1.  **Reading A: Strict Nominalism (Blames Step 2)**
      *   **Interpretation:** "Cites a cause" (Step 2) means the explanation *must literally name or refer directly to* specific individuals and their specific actions. Any mention of "the panic," "the bank's insolvency," or "the run" fails this test because it uses a singular term referring to something non-individual.
      *   **Plausibility:** Low. It makes explanation impossibly restrictive. Saying "The bridge collapsed due to metal fatigue" wouldn't explain if "metal fatigue" is shorthand for complex atomic processes. This turns (2) into a demand for fundamental physics-level explanation everywhere. Priya likely doesn't intend this, as she accepts psychology.
      *   **Culprit:** Step (2) is interpreted too narrowly. It conflates the *form* of the explanation (the words used) with the underlying *causal facts* it describes. Rejecting this reading saves social science explanation but requires clarifying what "cites" means.

  2.  **Reading B: Eliminative Reductionism (Blames Step 4)**
      *   **Interpretation:** "Nothing over and above" (Step 1) and "abbreviation" (Step 4) mean that the *only legitimate explanatory content* of a macro-statement is the *exhaustive list* of individual-level micro-states and events it summarizes. If the macro-statement conveys anything else (like a pattern, tendency, or counterfactual regularity), that "extra" is either non-explanatory or illusory ("a ghost").
      *   **Plausibility:** Moderate/Higher. This captures Priya's core eliminativist impulse and her argument in (5)-(6). It directly targets the idea that "it was a run" adds nothing beyond the list. However, it ignores the fact that *patterns themselves* (constituted by individuals) have causal powers *as patterns* in complex systems.
      *   **Culprit:** Step (4). It demands that an "abbreviation" must be *cashable solely into a specific list of individual doings* to be explanatory. This rejects the explanatory value of generalizations, dispositions, and structural facts *even when grounded in individuals*. Your deposit insurance example directly challenges this: the insurance changes the structural context, altering the causal landscape for individuals, without necessarily altering their core psychology ("what it's rational to do").

  3.  **Reading C: Modal Blindness (Blames Step 5)**
      *   **Interpretation:** The argument ignores or downplays *modal* information – information about possibilities, necessities, and counterfactuals. Step (5) assumes that spelling out the explanation *only* means listing the actual individual events. It dismisses the idea that macro-statements capture robust patterns ("any bank in that position") that tell us what *would* or *could* happen, not just what *did* happen. The claim that "'it was a run...' adds nothing" (Step 6) fails because it *does* add crucial counterfactual information missing from the list.
      *   **Plausibility:** High. This directly addresses your key objection and Priya's weak point in (5). Listing individual withdrawals explains why *this* bank collapsed *then*. Saying "it was a run" explains why *any* bank *in that structural position* would collapse, regardless of the specific individuals involved. The "run" concept captures the *emergent dynamic* and its counterfactual robustness.
      *   **Culprit:** Step (5) (and implicitly Step 4). Step (5) presents a false dilemma ("never finish the list or smuggle macro-facts"). It ignores a third option: the macro-statement efficiently conveys the *type* of process (a coordination failure driven by mutual belief) and its *modal implications*, which is distinct from both an infinite list and a spooky entity. The *explanandum* isn't just "Bank B collapsed on Tuesday," but "Bank B collapsed *because it was vulnerable to a run*."

  **Actual Diagnosis:**

  *   **The Crucial Flaw is in Step (4).** Priya's demand that an "abbreviation" must be "cashed out as individual doings" to be explanatory is where the argument derails.
  *   **Why Step (4) Looks Plausible:** It leverages a reasonable intuition: explanations shouldn't appeal to fundamentally mysterious entities. If "the panic" *really were* a ghostly force, it wouldn't explain. The plausibility comes from conflating *metaphysical grounding* (Step 1: panic is nothing over and above individuals acting) with *explanatory sufficiency* (Step 4: only the list of actions explains). Step (4) mistakenly assumes that because X is grounded in Y, *only* Y explains.
  *   **Why Step (4) is Wrong (Your Insight is Correct):** Macro-statements like "it was a run" or "the bank was solvent but illiquid" don't *just* summarize a list. They:
      1.  **Identify Structural Properties:** They pick out system-level states or dispositions (liquidity position, network vulnerability, institutional rules like deposit insurance) that are *multiply realizable* by different configurations of individuals. This is why your identical depositors + different insurance example works. The insurance changes the *structural incentives and possibilities*, altering the causal powers of the system.
      2.  **Convey Modal Information:** They encode counterfactuals and generalizations ("any bank in that position..."). This tells you what *would* happen under relevantly similar circumstances, which the list of specific actions *cannot* do. The list tells you what *did* happen; the structural fact tells you *why it had to* or *was highly likely to* happen *given the setup*.
      3.  **Highlight Emergent Causal Powers:** Patterns and structures, once constituted by individuals interacting under constraints, acquire their own causal efficacy *as patterns*. Deposit insurance changes the *payoff structure* of the game depositors are playing. This structural change causes different aggregate outcomes (no run vs. run) by altering the rational calculations *available* to individuals, even if their fundamental psychology (self-interest, fear) remains constant. The structure *causes* by changing the *field* within which individuals act.
  *   **Pricing the Alternatives:**
      *   **Rejecting (1):** Costs you ontological individualism. You'd have to accept genuinely supra-individual entities with independent causal powers ("group minds"). You explicitly reject this. **Cost: High (Violates your core commitment).**
      *   **Rejecting (2):** Costs you causal individualism. You'd allow "the panic" itself to be a literal, non-individual cause. This invites spooky causation. Priya's ghost accusation would stick. **Cost: High (Violates your other core commitment, invites mystery).**
      *   **Rejecting (4):** Costs you eliminative reductionism *in explanation*. You keep (1) & (2): panic is still just individuals acting, and the *ultimate* causes are individual actions + their interactions. However, you accept that explanations can legitimately *cite the structural patterns and properties that emerge* from complex interactions as having genuine, irreducible *explanatory power*. This allows "the run," "illiquidity," and "deposit insurance" to do real work *by describing the structural context that shapes individual rationality and aggregates into robust outcomes*. **Cost: Moderate (Requires accepting emergent explanatory levels grounded in individuals).**
      *   **Rejecting (5):** Costs you the idea that spelling out the individual level is the *only* legitimate path or that it inevitably fails. It requires recognizing that modal/structural information is a core part of the explanation that a list of actions inherently lacks. **Cost: Low (Aligns with scientific practice and your counterfactual intuition).**
  *   **Validity with a Swallowed Premise?** No plausible reading makes the whole argument valid while accepting (6) & (7). If you swallow Step (4), the argument becomes valid *but wrong*, as Step (4) is false for the reasons above (it ignores structural properties, modal info, emergent causal powers). Swallowing (4) means abandoning your core insight about deposit insurance and counterfactuals.

  **Verdict:**

  Reject **Step (4)**. It incorrectly assumes that because social phenomena are ontologically grounded in individuals (Step 1), explanations *must* be reducible to lists of individual actions to be legitimate. This ignores the indispensable explanatory role of *structural facts*, *emergent patterns*, and *counterfactual generalizations* ("any bank in that position") that are constituted by, but not reducible *in explanatory content* to, specific lists of individual actions. Your deposit insurance example is fatal to Step (4): the insurance changes the structural context, which causally explains the different outcome via altering the rational options for individuals, without requiring a change in their fundamental psychology or an exhaustive list of their actions.

  You can keep **Steps (1) and (2)**. "The panic" is still just many individuals acting fearfully. The ultimate causes *are* their actions and interactions. But **Step (2)** only requires that an explanation *cite a cause*. "Deposit insurance existed" cites a structural fact about the institution, which *is* a cause (it changes the rational choices available, preventing the coordination failure). It's a cause grounded in rules (themselves created/maintained by individuals) that shape the interaction space. This doesn't violate (1) or (2). **Steps (6) and (7)** fail because they rely on the flawed Step (4). Social science *does* have its own explanations: it identifies and explains how structural features, institutional rules, and emergent patterns shape individual action and generate robust aggregate outcomes. This is distinct from mere psychology summaries – it's the science of the *structures* within which psychology operates.
