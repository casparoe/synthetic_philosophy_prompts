answer: |-
  Here is a calibrated map of the exposure of the strong common prior assumption (CPA) as a rationality constraint, structured by objections, predictive differences, and methodological challenges. The analysis distinguishes settled points from contested ones and notes where defenses themselves are disputed.

  ---

  ### **I. Core Objections & Their Decisiveness**
  *Ranked by threat level to the strong CPA-as-rationality-constraint thesis:*

  1. **Persistent Disagreement Under Common Knowledge of Evidence & Opinions**  
     - **Observation:** Experts (e.g., climate scientists, macroeconomists) publicly disagree despite shared data, models, and awareness of each other’s views.  
     - **Counterclaim:** Disagreement signals *legitimate prior divergence*, not correctable error.  
     - **Decisiveness:**  
       - ⚠️ **High** if disagreement persists after explicit common knowledge protocols (e.g., repeated Aumann-style dialogue).  
       - **CPA Defense:** "Mistakes" include misweighting evidence, misjudging relevance, or hidden informational asymmetries (e.g., private field experience).  
       - **Contested:** Critics (e.g., Adam Elga, Roger Myerson) argue this stretches "information" to include *epistemic states*, rendering CPA tautological. Defenders (e.g., Aumann) insist it's falsifiable but rarely observed under ideal conditions.

  2. **No-Trade Theorems Fail Empirically**  
     - **Observation:** Speculative trade persists in markets (e.g., options, prediction markets) absent clear asymmetric information or ambiguity.  
     - **Formal Result:** No-trade theorems (Milgrom-Stokey) *rely* on CPA + common knowledge.  
     - **Decisiveness:**  
       - ⚠️ **Moderate-High** against CPA as *descriptive*; **Low** against *rationality* claim.  
       - **CPA Defense:** Trades stem from non-Bayesian agents (noise traders), liquidity needs, or ambiguity aversion (not pure belief divergence).  
       - **Contested:** Gilboa et al. show trade can occur with CPA if agents are *uncertain about the prior itself*. Critics see this as retreat to unfalsifiability.

  3. **Formal Indeterminacy of "Information"**  
     - **Argument:** CPA requires partitioning "information" from "prior," but:  
       - Prior can be defined as beliefs *before any information* (problematic for logical truths).  
       - Information can include higher-order beliefs (e.g., "I know you're skeptical").  
     - **Decisiveness:**  
       - ⚠️ **High** for undermining CPA's coherence as a unique constraint.  
       - **Example:** Gaifman's "Unclassifiable Truths" – agents may rationally assign different priors to unprovable mathematical claims.  
       - **Contested:** Orthodox Bayesians (e.g., Savage) view priors as defined *relative to a state space*. Critics (e.g., Binmore) call this circular.

  ---

  ### **II. Predictive Differences vs. Rival Positions**
  *What CPA uniquely predicts (and where it may fail):*

  | Prediction | CPA (Strong Rationality) | Rival Views (e.g., Permissivism, Subjectivism) |
  |------------|---------------------------|------------------------------------------------|
  | **Disagreement dissolution** | Under common knowledge of opinions + evidence, disagreement *must* resolve (Aumann’s Agreement Theorem). | Persistent disagreement is possible even with common knowledge (e.g., Kelly’s "peer disagreement"). |
  | **Speculative trade** | Zero trade should occur if common knowledge of rationality + CPA holds. | Trade is expected if priors diverge (e.g., Morris’s speculative trade models). |
  | **Belief profiles** | "Knife-edge" claim: Disagreement not explainable by CPA has measure zero under natural parameterizations (e.g., genericity arguments). | Disagreement is generic (e.g., Hellman’s "measure-theoretic" critique). |

  **Failure Modes:**  
  - CPA fails if disagreement persists after public belief announcements (observed in experiments, e.g., Aaronson’s climate surveys).  
  - Rivals predict this; CPA must attribute it to "hidden information" or "irrationality."

  ---

  ### **III. Unfalsifiability & Auxiliary Assumptions**
  - **Risk:** CPA can absorb anomalies by relaxing auxiliary assumptions:  
    - Common knowledge → "They haven’t communicated enough."  
    - Perfect rationality → "One agent misevaluated the evidence."  
    - State space → "They partitioned possibilities differently."  
  - **Is this defensible?**  
    - ✅ **For rationality constraint:** Yes. Rationality norms (e.g., transitivity) are shielded by *ceteris paribus* clauses (e.g., "absent computational limits").  
    - ❌ **For empirical claim:** No. If "hidden information" explains all disagreement, CPA becomes empirically vacuous (e.g., Schervish’s critique).  
  - **Settled Point:** CPA is *not* a theorem of Bayesian decision theory. It’s an independent axiom (agreed by Aumann, Harsanyi).  
  - **Contested:** Whether CPA’s unfalsifiability undermines it as a rationality norm.  
    - Defenders: CPA defines what "fully rational" means (like Nash equilibrium).  
    - Critics: It pathologizes reasonable disagreement (e.g., White’s "epistemic permissivism").

  ---

  ### **IV. Defeaters CPA Defenders Concede**
  Even proponents accept these *limit cases*:  
  1. **Logical & Mathematical Uncertainty:** Agents may rationally have different priors over unprovable statements (e.g., Continuum Hypothesis).  
  2. **Ambiguity Aversion:** Non-probabilistic beliefs (e.g., Ellsberg Paradox) break CPA’s framework.  
  3. **Bounded Rationality:** CPA assumes unlimited cognitive power; humans *systematically* violate it (e.g., base-rate neglect).  

  **Crucially:** Defenders argue these are *departures from ideal rationality*, not counterexamples.

  ---

  ### **V. Genuinely Contested Ground**
  1. **"No-Betting" ⇔ CPA Equivalence**  
     - **Settled:** With common knowledge, no agreeable bet ⇔ CPA (Samet, 1998).  
     - **Contested:** Whether this holds with *incomplete information*. Morris (2020) shows betting may be impossible even *without* CPA.  

  2. **Anomalies as Auxiliary Failures**  
     - **Pro-CPA:** Speculative trades *do* vanish in high-stakes, common-knowledge settings (e.g., Hanson’s prediction markets).  
     - **Anti-CPA:** Persistent disagreement in e.g., philosophy (e.g., Chalmers’ meta-surveys) suggests deep prior divergence.  

  3. **Representation Theorems**  
     - **Settled:** CPA is sufficient for agreement/no-trade.  
     - **Contested:** Whether it’s necessary. Kadane & Schervish show agents can agree *without* CPA if beliefs are "coherent" in a weaker sense.

  ---

  ### **Verdicts with Calibrated Confidence**
  - **As a rationality constraint:**  
    - Strength: Logically coherent; underpins key results (agreement/no-trade).  
    - Exposure: Vulnerable to *persistent, transparent expert disagreement* (confidence: 🟡 **Medium Threat**). If such cases proliferate, CPA may become an "ideal" with limited applicability.  
  - **As an empirical hypothesis:**  
    - Falsified by speculative trade/expert disagreement (confidence: 🟥 **High Threat**).  
  - **As a modeling convention:**  
    - Uncontroversially useful (confidence: 🟢 **Low Threat**).  

  **Likely Unconvinced Groups:**  
  - **Subjectivists** (e.g., de Finetti heirs): See priors as inherently personal.  
  - **Formal Epistemologists** (e.g., Titelbaum): Argue "reasonable" disagreement is fundamental.  
  - **Behavioral Economists:** Reject CPA’s descriptive relevance.  

  **Bottom Line:** The strong CPA-as-rationality claim survives only if all persistent disagreement is attributed to hidden information or error. Its viability hinges on whether one accepts that *rationality demands* this explanation—a stance critics view as dogmatic. The most decisive test remains a real-world observation of *common knowledge + identical evidence + persistent disagreement* among unquestionably rational agents—a scenario elusive by design.
