answer: |-
  Here is the decision procedure. It runs in sequence; a "no" at any step rejects the evidence as non-signalling noise. Steps requiring human judgment are marked **(J)**. 

  **First test (filters ~60% of cases):** *Is this cost differentially burdensome such that low-capacity candidates would avoid it?* If no, discard as uninformative.

  ---

  ### PROCEDURE: Validating Costly Signals for Sustained Risky Work

  1. **Differential Burden Test**  
     *Ask: Could a candidate lacking the target capacity easily replicate this evidence at similar cost?*  
     - **Sufficient "No"**: The cost imposes unique burdens (e.g., opportunity costs, skill thresholds) that deter less capable candidates.  
     - **Fail**: Common credentials, universally accessible fellowships, or standardized achievements.  
     *→ Proceed if "No".*

  2. **Avoidability Test**  
     *Ask: Was this cost avoidable for candidates of comparable opportunity?*  
     - **Sufficient "Yes"**: The candidate chose the harder path (e.g., declined safe options to pursue riskier work).  
     - **Fail**: Costs imposed by structural barriers (e.g., lack of funding forcing unpaid work) or non-discretionary hardship.  
     *→ Proceed if "Yes".*

  3. **Causal Link Assessment (J)**  
     *Ask: Does the evidence directly demonstrate the capacity we value?*  
     - **Index-Type Signals (Direct)**: Evidence intrinsically requires the capacity (e.g., a complex self-built instrument proving technical tenacity).  
     - **Handicap-Type Signals (Indirect)**: Costly choices that *only* make sense if capacity exists (e.g., turning down tenure to pursue an uncertain idea).  
     - **Fail**: Costs correlating with but not proving capacity (e.g., working long hours due to inefficiency).  
     *→ Proceed if causal link is plausible.*

  4. **Alignment of Interests Test (J)**  
     *Ask: Could this evidence be faked by gaming incentives?*  
     - **Sufficient "No"**: The signal aligns with the candidate’s long-term goals (e.g., high-risk work furthers their core mission).  
     - **Fail": Evidence optimized for metrics (e.g., publications in prestige journals via incremental work).  
     *→ Proceed if "No".*

  5. **Sustainability Screen**  
     *Ask: Does the evidence show multi-year commitment to non-guaranteed outcomes?*  
     - **Sufficient "Yes"**: Repeated risk-taking despite setbacks (e.g., 5 years of iterative field failures leading to insight).  
     - **Fail": One-off achievements or linear progress.  
     *→ Proceed if "Yes".*

  **Stop and Hand to Human Judgment**: Steps 3 and 4 require panel deliberation. The procedure confirms signal honesty; **humans must now decide if the demonstrated capacity predicts research success**.  

  ---

  ### Key Simplifications
  - **Dropped**: Handicap vs. Index distinction (merged in Step 3).  
  - **Dropped**: Equilibrium waste debates (irrelevant for individual assessment).  
  - **Retained**: Differential cost > absolute cost; alignable interests reduce signal reliability.  

  ---

  ### Test Cases
  **Case 1: The Moving Fieldworker**  
  - *Evidence*: 10 years in remote wilderness, enduring hardship.  
  - **Procedure**:  
    1. Differential Burden? Many could endure hardship; fails Step 1.  
    *→ Reject as signal*. Hardship alone isn’t differentially burdensome; may reflect circumstance, not choice.  

  **Case 2: Expensive Common Credential**  
  - *Evidence*: Prestigious PhD (held by 30% of applicants).  
  - **Procedure**:  
    1. Differential Burden? No—common in pool. Fails Step 1.  
    *→ Reject as noise*. Cost was paid once, but no differential burden now.  

  **Case 3: Failure Case (The Invisible Handicap)**  
  - *Evidence*: Turned down lucrative consulting offers to pursue obscure theory (no publications yet).  
  - **Procedure**:  
    1. Differential Burden? Yes—low-capacity candidates would accept offers.  
    2. Avoidable? Yes.  
    3. Causal Link? Plausible (handicap-type signal).  
    4. Aligned Interests? Yes—career risk for belief.  
    5. Sustainable? Unknown—requires inference.  
    *→ Passes procedure but fails in practice if panel can’t verify private opportunity costs*.  
    **Flaw**: Relies on candidate’s self-report of opportunities.  

  ---

  ### What the Procedure Cannot Do  
  1. **Define the Target Capacity**: What constitutes "sustained risky work" is inherently **(J)**.  
  2. **Capture Unobservable Costs**: Private sacrifices (e.g., family time) may be genuine but unverifiable.  
  3. **Predict Future Success**: Valid signals confirm *past capacity*; extrapolation is **(J)**.  
  4. **Replace Domain Expertise**: Technical feasibility still requires specialist review.  

  **Settled Theory vs. Contested**:  
  - Consensus: Differential cost and interest alignment define signal honesty.  
  - Contested: Whether handicaps "waste" resources is irrelevant to your use case; focus on *differential affordability*.  

  ---  
  The procedure filters for *honest signals*, not worthiness. Steps 1 and 2 clear noise; Steps 3–5 require your panel’s wisdom. It forces confrontation with what you *truly* value.
