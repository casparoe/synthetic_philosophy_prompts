prompt: |-
  I work on the infrastructure team at a company that builds clinical decision-support software, and I run a small reading group that meets after work. Two of the regulars have been arguing for about three months, and I would like to get their dispute into a shape where we can actually see what is at stake.

  The subject is the old killing-versus-letting-die question, but it keeps getting concrete in a way that is specific to what we build: our product ships defaults. At some point somebody decides whether the system escalates or stays quiet, alerts or doesn't, blocks a prescription or lets it through. Years later a patient is harmed, the person who set the parameter has moved to another team, and nobody can agree on whether anyone killed anybody.

  Here are the two positions, as fairly as I can put them.

  The first, which I will call the causal-shape view, holds that the difference between doing and allowing is a fact about the causal structure of the situation rather than about anyone's duties. When an agent does something, the harm depends on her intervention: remove her and it does not happen. When she merely allows, the harm was already on its way and she declined to interpose. The attraction is that the distinction comes out objective and independent of who is judging; the cost is that it is hard to say why such a structural fact should carry moral weight, and the view seems forced to say that choosing a default is a doing, which turns "we only left it on the default" into a confession rather than a defense.

  The second, the commitments view, holds that there is no interesting causal difference at all. Any doing can be redescribed as an allowing and the reverse, depending on the baseline you pick, and causing something by omission is as real as causing it by action. What distinguishes the cases is the agent's normative position: what she has taken on, what role she occupies, what she has led people to expect, what she owes. On this account the default cases are interesting only because defaults are where expectations and roles get frozen, not because a default alters the shape of anything. The cost here is that the killing/letting-die line becomes hostage to convention, and it is hard to say what is wrong with an agent who has taken on nothing.

  I would like the two of them to produce the document an adversarial collaboration is supposed to produce, a joint statement both of them could sign. Specifically:

  1. A numbered list of claims both positions can sign. These need to be substantive, not "harm is bad" or "context matters." They should cover, at a minimum, what both sides can agree the default cases do and do not show, and which of the standard moves in this argument are dead ends.

  2. The points on which they still disagree, each written in wording that the side it belongs to would accept as its own, and in a form that does not smuggle in the other side's assumptions. If part of the dispute turns out to be about words rather than substance, identify that part and say why.

  3. The cruxes, meaning the sub-questions such that settling one would move at least one of them. I expect a crux about baselines (what it means for the harm to have happened anyway) and one about whether causing by omission is a real relation or a conventional one, but do not let my guesses constrain the list.

  4. For each crux, a case, argument, or piece of evidence that both sides agree bears on it, with each side's prediction recorded in advance and, where it makes sense, the observation each side would count as telling against its own position. At least one crux should be tested against our default cases, and I want three of them kept distinct, because they have been running together in the argument: (a) a default that someone deliberately chose; (b) a default that nobody ever chose, where the behavior comes from whatever the code falls back to when the parameter is unset; and (c) a default set by one team and inherited, unexamined, by another. If both positions make the same prediction about all three, say so, and say what that shows.

  Two constraints. First, no citations and no reading list: the group is offline, I have no philosophy training, and I would rather have the reasoning than the references, so nothing should lean on who said what. Second, resist hedging everything into "it depends"; where a side has to commit to a prediction in order to be interesting, make it commit. And if there is a point both of them should accept as decisive against one of the two positions, put it in, because I would rather find that out than preserve a false symmetry.

  Format it as a numbered agreed-claims section, then a section of disagreement statements, then a table with one row per crux: the crux, the shared case or argument, the prediction from the causal-shape side, and the prediction from the commitments side.
reasoning: |-
  Okay, the user works on an infrastructure team for clinical decision-support software and runs a reading group. Two members have been arguing about the ethical implications of defaults in their system—specifically whether setting a default constitutes "killing" (action) or "letting die" (inaction) when harm occurs. The user wants to structure this debate into an adversarial collaboration document to clarify the stakes.

  The user presents two positions: the causal-shape view (focusing on objective causal structure) and the commitments view (focusing on normative roles and expectations). The goal is to extract agreements, pinpoint disagreements, identify cruxes, and design test cases—all without philosophical citations.

  First, I need to understand the core tension. The causal-shape view sees defaults as active interventions because removing the agent would prevent the harm (e.g., no default = no automated decision). The commitments view sees defaults as passive allowances, where moral weight comes from the agent's role (e.g., a clinician inheriting a default has different obligations than the engineer who set it).

  The user's constraints are crucial: no hedging, no citations, and explicit commitments for predictions. The deliverables must include:  
  1. Shared substantive claims  
  2. Disagreements in each side's own wording  
  3. Three distinct cruxes with test cases  
  4. Predictions for each default scenario (deliberate choice, unset fallback, inherited)  

  For agreements, both sides likely concur that:  
  - Harm outcomes depend on system design choices  
  - Defaults aren't morally neutral placeholders  
  - Responsibility isn't voided by "just following defaults"  
  - Causal complexity exists but doesn't resolve blame  
  - Intent alone isn't sufficient for moral assessment  

  The disagreements will center on:  
  - Whether "harm happening anyway" is objective (causal-shape) or expectation-based (commitments)  
  - Whether omissions cause harm or merely allow it  
  - Whether role obligations create moral differences  

  The cruxes need test cases that probe:  
  1. Baseline dependency: E.g., a default set to "off" vs. no system at all—does harm "happen anyway" without the agent?  
  2. Omission causation: E.g., failing to change a lethal default—is this causing death?  
  3. Role relativity: E.g., an engineer vs. clinician inheriting a default—does obligation differ?  

  For the default scenarios, both views might surprisingly agree on outcomes but disagree on *why*:  
  - Deliberate default choice: Both see responsibility, but causal-shape calls it "doing," commitments call it "breach of role."  
  - Unset fallback: Causal-shape sees it as "allowing" (harm happens without intervention), commitments sees obligation gaps.  
  - Inherited default: Causal-shape may blame the inheritor for not acting, commitments focuses on original designer's responsibility.  

  Key insight: The real divide is whether morality is anchored in physics or social constructs. The test cases must force this divergence without letting either side dodge. For example, in the "unexamined inheritance" scenario, the commitments view must confront whether an obligation exists without awareness, while causal-shape must explain why not changing the default isn't "allowing."  

  Finally, the document should flag if any disagreement is merely semantic (e.g., "killing" vs. "causing by omission") versus substantive. The clinical context adds urgency—lives depend on these distinctions, and "we only used defaults" can't be an automatic defense.
answer: |-
  Here is a structured adversarial collaboration document addressing the dispute over defaults in your clinical decision-support system, formatted as requested. It distills the core agreements, disagreements, cruxes, and testable predictions, with explicit attention to the three default scenarios (a, b, c).

  ---

  ### **1. Agreed Claims**  
  *(Substantive points both sides endorse)*  
  1. **Defaults are consequential design choices**: Whether actively set or passively inherited, defaults in safety-critical systems are never morally neutral "non-choices." They actively shape outcomes by directing system behavior when human intervention is absent.  
  2. **"It was the default" is insufficient defense**: No party is automatically absolved of responsibility because a harmful outcome originated from a default setting. The moral evaluation depends on further factors (disputed below).  
  3. **Causal complexity exists but isn't decisive**: Both acknowledge that chains of causation (e.g., designer → default → clinician → patient) are real and intricate, but agree this complexity alone cannot resolve whether an agent *killed* or *let die*.  
  4. **Harm matters independently of classification**: Whether labeled "killing" or "letting die," preventable patient harm is a moral failure in the system. The dispute is about how to assign responsibility, not whether harm is bad.  
  5. **Intent is secondary**: The designer’s or user’s intent (e.g., "I didn’t mean harm") does not determine the moral classification of their act/omission. Outcomes and roles (disputed) carry more weight.  
  6. **Default cases reveal structural tensions**: The three scenarios (deliberate default, unset fallback, inherited default) expose key fault lines in responsibility assignment but do not *in themselves* settle the killing/letting-die debate.  

  ---

  ### **2. Disagreements**  
  *(Stated in each side’s preferred wording, without smuggled assumptions)*  
  - **Causal-Shape View**:  
    > *"An agent kills (rather than lets die) if the harm counterfactually depends on their intervention: remove their specific action or setting, and the harm does not occur. Defaults are interventions because removing them alters the outcome."*  

  - **Commitments View**:  
    > *"An agent kills (rather than lets die) if they violate a salient normative commitment (e.g., role duty, explicit promise, reasonable expectation). Defaults are morally significant only as expressions of such commitments, not due to causal structure."*  

  **Note on semantic disagreement**:  
  The term "cause" is contested. Causal-Shape uses it for physical/structural dependence (e.g., "the default caused the alert failure"). Commitments uses it normatively (e.g., "the *breach of duty* caused the harm"). This is substantive, not merely verbal, as it reflects divergent views of reality.  

  ---

  ### **3. Cruxes & Test Cases**  
  *(Table format with shared cases, predictions, and potential falsifiers)*  

  | Crux                                                                 | Shared Case/Argument                                                                                              | Causal-Shape Prediction                                                                                              | Commitments Prediction                                                                                                |  
  |----------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|  
  | **Crux 1: What does "the harm would happen anyway" mean?**<br>*(Is baseline objectivity possible?)* | **Case**: *A drug interaction is fatal. System-A (with default "no alert") fails to warn. System-B (no alert function) cannot warn. Patient dies identically.* | **Prediction**: System-A's team *killed* (harm depends on their default intervention). System-B's team *let die* (harm occurs without their intervention).<br>**Falsifier**: If System-A's removal *prevents* harm. | **Prediction**: Both cases are "letting die" unless System-A's team had a *duty* to alert. "Anyway" depends on expectations, not causation.<br>**Falsifier**: If System-B's team had a duty to build alerts, they *killed*. |  
  | **Crux 2: Does "causing by omission" exist identically to causing by action?** | **Case**: *Engineer E sets default to "no block" for Drug-X. Clinician C, aware of risks, prescribes Drug-X without override. Patient dies.* | **Prediction**: E *killed* (default setting caused harm). C *let die* (inaction allowed pre-set harm).<br>**Falsifier**: If C's omission is re-described as "action" (e.g., "approving prescription"), it must alter causal dependence. | **Prediction**: Moral status depends on *duties*: If E owned safety calibration, E *killed*. If C owned prescription safety, C *killed*. Omissions cause identically.<br>**Falsifier**: If identical duties imply identical blame despite causal differences. |  
  | **Crux 3: Do roles create moral distinctions beyond causal influence?**<br>*(Tested against default scenarios a, b, c)* | **Cases**:<br>**(a)** Deliberate default: Team sets "no escalate" after review.<br>**(b)** Unset fallback: Param unset → system defaults to "no escalate."<br>**(c)** Inherited: Team inherits "no escalate" from prior team, never reviews. | **Prediction for all**: *Killing* occurs if harm counterfactually depends on the default (e.g., removing it prevents harm). Deliberate (a) is likeliest to qualify.<br>**Agreement?**: YES. All three *can* be "killing" if default is necessary for harm. | **Prediction**: Moral status varies by role:<br>**(a)** *Killing* if setter had duty.<br>**(b)** *Letting die* if no one assumed duty.<br>**(c)** *Killing* if inheriting team owned maintenance duty.<br>**Agreement?**: NO. Predictions diverge on (b)/(c). Causal-Shape sees same structure; Commitments sees different obligations. |  

  ---

  ### **Key Insights from the Structure**  
  1. **Agreements show common ground**: Both reject "defaults as neutral," absolving no one. Defaults are always morally charged design features.  
  2. **Disagreement is substantive**: Commitments ties morality to roles/duties; Causal-Shape ties it to physical dependence. This isn’t semantic.  
  3. **Crux 3 is decisive**: The three default scenarios **(a, b, c)** expose the core rift. Causal-Shape predicts identical moral classifications for (a)/(b)/(c) if causal dependence is identical. Commitments predicts variation based on who assumed duties.  
     - **Example test**: If an *unset fallback (b)* causes harm, Causal-Shape *must* call it "killing" if the fallback was necessary for harm. Commitments *must* call it "letting die" if no one owned the parameter.  
  4. **Falsifiers matter**: Each side specifies what evidence would undermine its view (e.g., for Causal-Shape: if omitting an act doesn’t change outcomes; for Commitments: if duties don’t track blame).  
  5. **Settling one crux could resolve the dispute**: If "harm would happen anyway" is proven objective (Crux 1), Commitments loses force. If omissions cannot cause harm identically to actions (Crux 2), Causal-Shape collapses.  

  This framework forces both sides to commit to testable claims while clarifying where conventions (Commitments) versus physical dependencies (Causal-Shape) drive their judgments. Use the three default scenarios **(a, b, c)** as litmus tests in your discussion.
