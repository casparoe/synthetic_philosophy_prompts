  First, let's break down Moore's principles they mentioned. Organic unities mean the value of a whole isn't just the sum of parts—it could be more or less. So the toast can't just say the couple is better together; it has to highlight the specific quality of their union. Also, personal affection must be based on real qualities, not vague compatibility. And avoid the naturalistic fallacy—don't list traits and imply that automatically means goodness.

