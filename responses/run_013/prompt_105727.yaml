  Below is a decision tree/taxonomy of positions on historical explanation, built from the logical space defined by your four branching questions. The tree has 10 nodes (4 branch nodes, 6 leaves) and isolates core commitments. Positions are named where standard; "unnamed" combinations are flagged. Each leaf includes one sentence on its most awkward commitment.  

  ### Decision Tree: Logical Space of Historical Explanation  
  1. **Must explanation invoke a general regularity?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **Is retrospection allowed? (Can explanation use later info?)**  
     - **Yes** → *Unnamed*  
       - **Most awkward commitment**: Using outcome-dependent significance to justify a law-like pattern, violating the requirement that laws be timeless.  
     - **No** → **Covering-law model** (Hempel: strict or probabilistic)  
       - **Most awkward commitment**: Insisting that singular events (e.g., "Why did Rome fall?") require general laws, despite history’s lack of uncontested universal regularities.  

  3. **Is retrospection allowed?**  
     - **Yes** → Go to 4  
     - **No** → Go to 5  

  4. **What is being explained?**  
     - **Single event** → *Unnamed*  
       - **Most awkward commitment**: Claiming a single event’s cause (e.g., "Why did Archduke Ferdinand die?") depends on later outcomes (e.g., WWI), which risks teleology or anachronism.  
     - **Stretch of time** → **Narrative explanation** (e.g., Danto, Mink)  
       - **Most awkward commitment**: Treating the narrative’s emplotment (e.g., "The Industrial Revolution as progress") as explanatory, even though it reflects present-day perspectives.  
     - **Significance** → **Narrative explanation** (e.g., Collingwood)  
       - **Most awkward commitment**: Asserting that an event’s meaning (e.g., "Why was the Magna Carta significant?") is only knowable retrospectively, blurring explanation with interpretation.  

  5. **Is explanation inherently contrastive? (Must "why X?" imply "why X not Y?")**  
     - **Yes** → **Causal-mechanism (contrastive)** (e.g., Gaddis, pragmatic historians)  
       - **Most awkward commitment**: Demanding a specific contrast class (e.g., "Why war in 1914 not 1910?") that may be arbitrary or anachronistic to the actors.  
     - **No** → **Causal-mechanism (non-contrastive)** (e.g., Machamer, Darden)  
       - **Most awkward commitment**: Isolating "actual causes" (e.g., "What caused the Black Death?") without reference to alternatives, risking underdetermination.  

  ### Notes  
  - **Pluralism** (e.g., Weber, Cartwright) is not a leaf but a metaposition: it accepts that *multiple leaves* (e.g., causal-mechanism + narrative) can coexist, denying exclusivity.  
  - **Deflationary view** ("history narrates, never explains") is embedded in the **Narrative** leaves: it treats narrative as *only* "telling" (retrospective description), not explaining.  
  - **Unseparated pairs**:  
    - **Narrative for "stretch of time" vs. "significance"** cannot be split cleanly, as both rely on retrospection and deny regularities. They share the awkwardness of outcome-dependence.  
    - **Contrastive vs. non-contrastive causal-mechanism** both reject retrospection/regularities but diverge on whether contrasts are essential.  
  - **Coverage**:  
    - **Missing positions**: "Colligation" (explaining via conceptual grouping) falls under **Narrative**; "functional" explanations are unnamed (require retrospection + regularities, unsupported).  
    - **Your debate**: You prioritize retrospection-dependent significance (→ **Narrative**). Your friend requires laws (→ **Covering-law**).  

  This tree isolates fault lines: **regularity** (science-like vs. particularistic), **retrospection** (outcome-dependence), **contrast** (implicit comparisons), and **explanandum** (event, process, or meaning).
