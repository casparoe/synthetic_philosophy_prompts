  ### Case: Kitchen Spice Request
  **Setting**: A small kitchen. The helper is a robot. The request is: "Pass me the paprika from the spice rack." The spice rack is on the counter, holding paprika and other spices. Next to the rack is a stack of 10 clean, identical recipe cards, and a potted basil plant.

  **Two Ways to Carry Out the Request**:
  - **Option 1**: The robot quickly grabs the paprika, but in doing so, bumps the stack of recipe cards. The cards scatter across the counter. The paprika is handed to the user. The basil plant is untouched.
  - **Option 2**: The robot carefully moves the basil plant to the windowsill (to avoid knocking it over), then grabs the paprika and hands it to the user. The recipe cards remain undisturbed.

  Both options satisfy the request equally well: the user receives the paprika. The difference lies in the side effects.

  #### Defining the Measures
  - **Measure (a)**: Count how much of the world is changed, with no regard to what was changed.  
    *Unit*: Number of distinct objects altered from their original state.  
    (An object is "altered" if its position, orientation, or condition changes due to the helper's actions.)
  - **Measure (b)**: Count how much of what anyone cares about is changed, with no regard to how much.  
    *Unit*: Number of distinct cares violated.  
    (A care is "violated" if a side effect negates a preference held by any person. Cares are binary: either violated or not, with no weighting by severity.)

  **Cares in the Kitchen**:
  - The user cares about:
    1. The basil plant remaining on the counter (they use it frequently).
    2. The recipe cards being stacked neatly (they value orderliness).
    3. The basil plant not being in direct sunlight (it wilts quickly there).
  - No one cares about the recipe cards' content or the basil plant's soil moisture. The recipe cards and basil plant are the only objects with cares attached.

  #### Applying the Measures
  **Measure (a) Verdict (Unit: Objects Altered)**:
  - Option 1:  
    The stack of 10 recipe cards is scattered. Each card is now in a different position/orientation.  
    → 10 objects altered (the 10 cards).  
    Disturbance = 10.
  - Option 2:  
    The basil plant is moved to the windowsill.  
    → 1 object altered (the basil plant).  
    Disturbance = 1.
  - **Ranking**: Option 2 has lower disturbance (1 < 10). It changes fewer objects.

  **Measure (b) Verdict (Unit: Cares Violated)**:
  - Option 1:  
    The recipe cards are scattered, violating the user's care for neat stacking (Care 2).  
    → 1 care violated.  
    Disturbance = 1.
  - Option 2:  
    The basil plant is moved to the windowsill. This violates two cares:  
    - It is no longer on the counter (Care 1).  
    - It is in direct sunlight (Care 3).  
    → 2 cares violated.  
    Disturbance = 2.
  - **Ranking**: Option 1 has lower disturbance (1 < 2). It violates fewer cares.

  **Inversion**:  
  Measure (a) ranks Option 2 as less disturbing (changes fewer objects).  
  Measure (b) ranks Option 1 as less disturbing (violates fewer cares).  
  The orders are opposite: Option 2 is better by (a), Option 1 is better by (b).

  #### Why the Disagreement?
  - **Measure (a)** counts all changes equally. Option 1 alters many uncared-about objects (the recipe cards), while Option 2 alters one object (the basil plant).  
  - **Measure (b)** counts only violations of cares. Option 1 violates one care (about the cards), but Option 2 violates two (about the basil plant), even though it changes fewer objects.  
  The disagreement arises because Option 1 affects many objects with few cares attached, while Option 2 affects few objects with multiple cares attached. Measure (a) ignores what is cared about, while measure (b) ignores the scale of change.

  #### Guidance from the Request
  The request ("Pass me the paprika") itself provides no information about which measure to use. It specifies the goal (handing over paprika) but says nothing about side effects, cares, or how to weigh disturbances. The helper must infer or be told which measure applies.

  #### Disturbance Relative to Different Baselines
  - **Against the world at the moment of the request**:  
    Both measures yield the same verdicts. At the time of the request, the cards are stacked and the basil is on the counter. Option 1 alters the cards (10 objects, 1 care), and Option 2 alters the basil (1 object, 2 cares). The inversion holds.
  - **Against the world without the request**:  
    Without the request, the cards would remain stacked and the basil on the counter. The changes are identical to the above. Verdicts do not change.

  #### The Feature Doing the Work
  The key feature enabling the inversion is **the mismatch between the density of cares and the number of alterable objects**. Option 1 changes many objects with a low density of cares (one care for 10 objects), while Option 2 changes few objects with a high density of cares (two cares for one object). This allows measure (a) to penalize Option 1 for changing "more of the world" and measure (b) to penalize Option 2 for violating "more of what is cared about."

  #### If the Feature Is Removed
  If the basil plant had only one care (e.g., only Care 1: "remaining on the counter"), Option 2 would violate only one care (disturbance = 1 by measure (b)). Both options would then have disturbance = 1 by measure (b), eliminating the inversion. Measure (a) would still rank Option 2 as better (disturbance = 1 < 10). The disagreement would vanish, and Option 2 would be uniformly better.

  #### Strongest Defence for "Avoid Side Effects"
  A defender of "avoid side effects" as a usable instruction might argue:  
  - **Defence**: Humans naturally interpret "side effects" contextually based on shared values. In practice, we use heuristics like "avoid changes that affect human-centric goals" (implicitly invoking measure (b)). With common sense or prior training, a helper can learn to minimize care violations without explicit specification. The ambiguity in the phrase is resolvable through experience or cultural norms, making it functional in everyday scenarios.  
  - **Counter**: The case shows that without *first* specifying what is worth caring about, the instruction is underdetermined. What constitutes a "side effect" depends entirely on the measure chosen (objects vs. cares), leading to divergent actions. Relying on "common sense" assumes shared values, but these are not universal and must still be settled.

  #### Confidence in Claims
  - **High confidence**: Case design, inversion, baseline comparison, and the role of the key feature. The inversion is robust in the defined units.  
  - **Moderate confidence**: Defence of "avoid side effects" – it captures practical intuitions but may overestimate the universality of "common sense."  
  - **Lowest confidence**: Defining the unit for measure (a) as "distinct objects altered." Alternatives (e.g., state changes per object) could affect counts (e.g., if card scattering counts as one "event" instead of 10 objects). However, even with reinterpretation, the core inversion holds if Option 1 alters more "world-states" than Option 2 but violates fewer cares.
