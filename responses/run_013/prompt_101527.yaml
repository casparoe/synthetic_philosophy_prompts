prompt: |-
  I've ended up refereeing a two-year argument between two friends and I want to force them to write the document they should of produced ages ago. One of them — call her the arc person — thinks there's a genuine directional tendency in large-scale human history towards less arbitrary domination (call that justice, roughly; we can fight about the definition later). The other — the tragedy person — thinks any apparent direction is a selection effect of how we narrate history: real gains happen, but they're local, reversible, and best explained by particular institutional accidents rather than by any tendency. They agree on heaps of facts and still talk straight past each other, so write the joint statement they could both put their names to after a proper good-faith adverserial collaboration.

  What I want: a numbered section of agreed claims — including claims about what would actually count as evidence for or against a directional tendency, and the fact that both of them reject the naive version of their own view — then a disagreements table. In the table, for each genuine disagreement, give the wording each side would honestly accept for its own position (no strawmen), and mark each as substantive or merely verbal. I've a hunch at least one of them is verbal — probably about what 'tendency' or 'direction' even means — so say which, and why.

  Then the cruxes. My hunches, but use your judgement: (a) the rewind test — if you reran the last five hundred years a thousand times with tiny perturbations, in what fraction of runs do you get something like the abolition of chattel slavery and universal suffrage, and does either side's number actually discriminate between the two views? (b) the unit question — whether the choice of currency (well-being, rights, non-domination, something else) is doing the real work, so that the disagreement shrinks or swells depending which you pick; (c) whether moral progress is self-reinforcing or self-undermining, i.e. whether gains tend to create the conditions for their own reversal, and how you'd tell; and (d) whether the alleged arc is a global tendency at all or a provincial one that just happens to run through Western modernity. For each crux, give the case or argument both sides agree bears on it, and write down each side's prediction in advance.

  Don't bother deciding who's right, and please no citations, footnotes or reading lists — neither of them has library access and I don't want it collapsing into a bibliography. Can you do it in British English as well.
reasoning: |-
  Okay, the user is refereeing a two-year argument between two friends about whether human history has a directional tendency towards justice or if progress is just random and reversible. They need a structured joint statement to move past their stalemate. 

  Hmm, both friends actually agree on more than they realize - they both reject naive progress narratives and acknowledge setbacks. The core conflict seems to be about whether institutional gains accumulate directionally or are fragile accidents. Smart of the user to suspect some disagreements are verbal - "tendency" probably means different things to each.

  Right, the user wants four specific elements: agreed claims, a disagreements table, crux points, and predictions. British English throughout. No citations - good call since they lack library access. 

  Noticing the user's hunches about cruxes are sharp. The rewind test is particularly clever - if slavery abolition only emerges in 1% of history reruns, that undermines the arc position. But must ensure the table captures nuances: tragedy person might accept statistical tendencies while denying "direction" implies inevitability.

  Ah, the unit question is sticky. If they measure progress in well-being vs rights, their positions might converge or diverge. And the Eurocentrism angle is crucial - did abolition spread globally because of tendency or Western power? Must present both views neutrally.

  For the disagreements table, need to phrase each position charitably. Arc person sees institutions as ratchets; tragedy person sees them as sandbanks. The "tendency" definition split is likely verbal - one means statistical pattern, the other implies teleology. Should flag that.

  Predictions part will be tense but useful. For moral progress being self-undermining: arc person expects backlash proves traction; tragedy person sees backlash as reversal evidence. Both think they're right! The joint statement might not resolve it but could shift them from talking past to talking to each other.

  Better avoid "moral progress" term though - too loaded. Stick to "reduced domination" as per user's rough definition. And consistently use "learnt" not "learned" for British English. 

  Final challenge: keeping it concise while covering abolition, suffrage, institutions, and four cruxes. User's clearly exhausted - this document needs to be bulletproof so the friends finally write their damn paper.
answer: |-
  Here is a joint statement drafted in British English, structured as requested, aiming for maximum good-faith agreement and clarifying genuine disagreements:

  **Joint Statement: On Historical Patterns of Reduced Domination**

  **Section 1: Agreed Claims**

  1.  **Rejection of Naivety:** Both parties categorically reject the simplistic notion of inevitable, linear, or teleological "progress" in human history. Periods of significant regression, stagnation, and horrific violence are acknowledged facts.
  2.  **Agreed Instances of Gain:** Both parties agree that specific, normatively significant reductions in arbitrary domination have demonstrably occurred within the last 500 years (e.g., the widespread abolition of chattel slavery, the establishment of universal suffrage in many states, the development of international human rights frameworks, the decline of overt colonial empires).
  3.  **Reversibility & Fragility:** Both parties agree that gains in reducing arbitrary domination are *always* potentially reversible and often fragile. Institutional safeguards are imperfect and require active maintenance. Backlashes occur.
  4.  **Institutional Mechanisms:** Both parties agree that *institutions* (legal, political, economic, social) are crucial in explaining both the *emergence* and the *persistence* (or failure thereof) of reductions in domination. Changes seldom occur without institutional catalysts or frameworks.
  5.  **Role of Contingency:** Both parties agree that *contingent* factors (specific leaders, technological shifts, unforeseen crises, unique historical conjunctures) play a significant role in the timing, location, and specific form of gains in reducing domination. History is not predetermined.
  6.  **Selection Effect in Narration:** Both parties agree that historical narratives *can* be subject to selection effects, where victories are emphasised and setbacks or stable periods of injustice are downplayed. Critical historiography is essential.
  7.  **Evidence Matters:** Both parties agree that the existence or non-existence of a directional tendency is an empirical question in principle. Key types of evidence include:
      *   *The Frequency & Distribution of Gains:* How often, and across how many distinct societies/cultures, do significant reductions in specific forms of domination emerge independently?
      *   *Persistence & Resilience:* How well do gains withstand pressure, crisis, and attempts at reversal over significant timescales (decades+)? Do gains tend to diffuse geographically?
      *   *Mechanisms of Diffusion:* Are there identifiable, recurring institutional or social mechanisms that *facilitate* the adoption or imitation of gains elsewhere?
      *   *Counterfactual Robustness:* How likely are specific gains under varying initial conditions (see Crux A)?
      *   *Global vs. Provincial:* Is the pattern observable across diverse civilisational contexts, or primarily linked to specific cultural/institutional lineages (see Crux D)?

  **Section 2: Disagreements Table**

  | Disagreement Focus | Arc Person's Position (Honest Wording)                                                                 | Tragedy Person's Position (Honest Wording)                                                                                                                               | Substantive (S) or Verbal (V)? | Notes                                                                                                                                                  |
  | :----------------- | :----------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Core Tendency**  | There exists a weak, statistical tendency over the *longue durée* for institutional innovations reducing arbitrary domination to emerge, diffuse, and prove resilient, despite reversals, making their global prevalence more likely over time. | While specific gains occur, the historical record shows no consistent *directional tendency* towards less domination. Apparent patterns reflect contingent clusters of institutional innovations in specific contexts, prone to reversal and not indicative of an underlying historical vector. | **S**                         | Core substantive disagreement: Is the pattern *merely* clustered contingency or does it show a weak statistical bias?                                  |
  | **Mechanism Primacy** | The accumulation of institutional knowledge/practice (e.g., rule of law, democratic accountability, rights frameworks) creates path dependencies and tools that make *further* reductions in domination statistically more feasible over time, even if not guaranteed. | Each significant reduction is primarily explained by highly contingent institutional *accidents* (e.g., unique power balances, crises exploited by reformers) within specific contexts. There is no inherent "ratchet" effect; resilience depends wholly on continuous, contingent political effort against inherent counter-pressures. | **S**                         | Substantive disagreement on whether institutional gains *themselves* create conditions favouring future gains.                                      |
  | **Meaning of "Direction"** | "Directional tendency" denotes a statistical bias or probability gradient in the historical record, observable over centuries, towards the accumulation of certain institutional forms that constrain domination, **not** inevitability or uniformity. | "Direction" inherently implies a teleology or inherent trajectory lacking in history. The concept is misleading as it suggests a force *pulling* history, rather than the reality of disjointed, contingent gains and losses. | **V (Primarily)**             | Largely verbal. Arc person uses "direction" statistically; Tragedy person hears metaphysical teleology. Clarifying "weak statistical tendency" resolves much of this friction. |
  | **Scope of Gains** | While originating often in specific contexts, gains in reducing domination show a demonstrable (though incomplete and contested) capacity to diffuse globally and become normative aspirations, suggesting a transcultural pull. | Most significant gains remain provincial to the cultural/institutional complexes that spawned them. Apparent global diffusion is better explained by contingent power dynamics (e.g., Western hegemony) than a universal tendency; alternative paths exist/stagnate. | **S**                         | Substantive disagreement on the universality and transferability of the gains/institutions.                                                        |

  **Section 3: Cruxes and Predictions**

  **(a) The Rewind Test:**
  *   **Agreed Case:** Rerunning the last 500 years from a similar starting point (c. 1500 CE) 1000 times with minor perturbations. The key metric is the fraction of runs where institutional complexes recognisably analogous to the abolition of chattel slavery and the establishment of universal suffrage emerge *and achieve significant global prevalence* by the "end" (c. 2000 CE equivalent).
  *   **Arc Prediction:** A low but statistically significant fraction significantly above chance (e.g., >10%, arguing that contingent paths converge on similar institutional solutions over sufficient time due to underlying functional pressures and learning).
  *   **Tragedy Prediction:** A very low fraction, indistinguishable from the noise of pure contingency (e.g., < 1-2%, arguing the specific historical path was highly unique and dependent on unrepeatable accidents; many runs would see dominance of very different, persistently hierarchical institutional forms).

  **(b) The Unit Question:**
  *   **Agreed Case:** Assessing whether the perceived strength of a directional tendency significantly changes depending on the metric used (e.g., aggregate well-being, specific negative rights, positive freedoms, non-domination as non-arbitrary power).
  *   **Arc Prediction:** The core weak tendency pattern (gains emerging, diffusing, showing resilience) holds reasonably well across plausible metrics focused on *reducing arbitrary power over persons*, though the specific timeline and prominence of gains may vary (e.g., suffrage vs. economic security). The disagreement remains substantive.
  *   **Tragedy Prediction:** The apparent pattern collapses or becomes incoherent when shifting metrics. Gains in one domain (e.g., political rights) often correlate with new forms of domination in another (e.g., economic precarity, bureaucratic control). The "arc" is an artefact of choosing specific, favourable metrics. The disagreement shrinks significantly when considering a broader range of domination.

  **(c) Self-Reinforcing or Self-Undermining?**
  *   **Agreed Case:** Examining whether institutional gains designed to reduce domination tend to create conditions that facilitate further gains (self-reinforcing) or contain seeds that generate backlash and increase the likelihood of significant reversal (self-undermining).
  *   **Arc Prediction:** Gains tend to be self-reinforcing *on balance* over the long term. They foster norms, empower constituencies, and create institutional tools that make reversal harder *and* further reform more plausible (even if backlash is a common short-term effect). Backlash often *presupposes* the gain it reacts against.
  *   **Tragedy Prediction:** Gains are inherently self-undermining *or* neutral. They create powerful losers, foster complacency, reveal new problems, generate bureaucratic inertia, or create tools easily co-opted for new dominations. Resilience is always contingent on fresh struggle against these inherent counter-dynamics. Backlash is evidence of fragility, not reinforcement.

  **(d) Global Tendency or Provincial Accident?**
  *   **Agreed Case:** Evaluating whether the pattern of gains reducing domination, and the alleged tendency, is observable across diverse, historically independent civilisational contexts, or is primarily a feature of the institutional trajectory stemming from early modern Europe ("Western modernity").
  *   **Arc Prediction:** While the *specific institutional forms* (e.g., liberal democracy) are provincial, the *functional impulse* to reduce arbitrary domination and the emergence of institutional mechanisms to do so (e.g., constraints on rulers, protections for groups) is a recurring, albeit variably realised, feature in diverse contexts. The "arc" reflects a global, if uneven, pattern.
  *   **Tragedy Prediction:** The significant gains discussed are overwhelmingly products of a specific, contingent, and non-reproducible chain of institutional accidents within the Western lineage. Other major civilisational trajectories developed stable, highly institutionalised forms of domination with no inherent tendency towards the specific gains celebrated here. The "arc" is provincial.

  **Conclusion:** This document represents our best-faith effort to clarify agreements, pinpoint genuine disagreements (both substantive and verbal), and articulate testable predictions on key cruxes. Signing indicates commitment to this framework for future discussion, not necessarily resolution of the core disagreement.
