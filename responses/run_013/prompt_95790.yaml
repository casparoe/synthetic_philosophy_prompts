  ### Thought Experiment: Comparing Proportionality in FPTP vs. Modified PR  
  **Country:** Fictitious nation with 100 legislative seats and five parties (A, B, C, D, E).  
  **Vote Shares (National):**  
  - Party A: 25.00%  
  - Party B: 25.00%  
  - Party C: 20.25%  
  - Party D: 16.00%  
  - Party E: 13.75%  
  *(No party exceeds 40%, total = 100%)*  

  **Voting Behavior:** Sincere voting in both systems (no strategy).  

  ---

  ### World 1: First-Past-the-Post (FPTP)  
  **Rules:**  
  - 100 single-member districts.  
  - Plurality winner takes each seat (most votes wins).  
  - Districts drawn **neutrally**:  
    - Contiguous and equal population.  
    - No gerrymandering; geographic distribution of support is uniform and "boring."  
    - *District breakdown:*  
      - Party A wins 25 districts (with 40% support in each).  
      - Party B wins 25 districts (with 40% support in each).  
      - Party C wins 20 districts (with 35% support in each).  
      - Party D wins 15 districts (with 30% support in each).  
      - Party E wins 15 districts (with 30% support in each).  

  **District-Level Vote Distribution (Sample):**  
  | District Type | A Wins (25) | B Wins (25) | C Wins (20) | D Wins (15) | E Wins (15) |  
  |---------------|-------------|-------------|-------------|-------------|-------------|  
  | Party A       | **40%**     | 20%         | 20%         | 20%         | 20%         |  
  | Party B       | 20%         | **40%**     | 20%         | 20%         | 20%         |  
  | Party C       | 15%         | 20%         | **35%**     | 15%         | 15%         |  
  | Party D       | 15%         | 10%         | 15%         | **30%**     | 15%         |  
  | Party E       | 10%         | 10%         | 10%         | 15%         | **30%**     |  
  *Total per district = 100%. National vote shares match totals (e.g., A: `(25×40%) + (25×20%) + ... = 25%`).*  

  **FPTP Seat Results:**  
  - Party A: **25 seats** (25%)  
  - Party B: **25 seats** (25%)  
  - Party C: **20 seats** (20%)  
  - Party D: **15 seats** (15%)  
  - Party E: **15 seats** (15%)  

  **Proportionality Analysis (FPTP):**  
  | Party | Vote Share | Seat Share | Abs. Gap |  
  |-------|------------|------------|----------|  
  | A     | 25.00%     | 25.00%     | 0.00%    |  
  | B     | 25.00%     | 25.00%     | 0.00%    |  
  | C     | 20.25%     | 20.00%     | 0.25%    |  
  | D     | 16.00%     | 15.00%     | 1.00%    |  
  | E     | 13.75%     | 15.00%     | 1.25%    |  
  - **Largest Gap (Biggest Party):** A/B gap = **0.00%** (tied).  
  - **Average Absolute Gap:** `(0.00 + 0.00 + 0.25 + 1.00 + 1.25)/5 = **0.50%**`.  

  ---

  ### World 2: Modified Proportional Representation (PR)  
  **Rules:**  
  - One national district.  
  - Party-list PR with **5% threshold** and **20-seat bonus** for the first-place party.  
  - Seats allocated via **largest remainder (Hare quota)** after bonus:  
    1. Largest party gets 20 bonus seats.  
    2. Remaining 80 seats split proportionally among parties clearing 5% threshold.  
  - *Tiebreaker:* Alphabetical order (A wins if tie).  

  **PR Seat Calculation:**  
  1. **Threshold Check:** All parties >5% (E: 13.75% > 5%) → all qualify.  
  2. **Bonus Seats:** A and B tied at 25.00%. Tiebreaker: **A gets 20 bonus seats.**  
  3. **Allocate 80 Proportional Seats (Hare quota = 100%/80 = 1.25% per seat):**  
     - Quotients:  
       - A: `25.00 / 1.25 = 20.0` → 20 seats (remainder 0.0)  
       - B: `25.00 / 1.25 = 20.0` → 20 seats (remainder 0.0)  
       - C: `20.25 / 1.25 = 16.2` → 16 seats (remainder 0.2)  
       - D: `16.00 / 1.25 = 12.8` → 12 seats (remainder 0.8)  
       - E: `13.75 / 1.25 = 11.0` → 11 seats (remainder 0.0)  
     - Initial allocation: 20+20+16+12+11 = 79 seats.  
     - **Largest remainder:** D (0.8) gets the 1 remaining seat → D: 13 seats.  
  4. **Apply Bonus:** A gets 20 (proportional) + 20 (bonus) = **40 seats**.  

  **PR Seat Results:**  
  - Party A: **40 seats** (40%)  
  - Party B: **20 seats** (20%)  
  - Party C: **16 seats** (16%)  
  - Party D: **13 seats** (13%)  
  - Party E: **11 seats** (11%)  

  **Proportionality Analysis (PR):**  
  | Party | Vote Share | Seat Share | Abs. Gap |  
  |-------|------------|------------|----------|  
  | A     | 25.00%     | 40.00%     | 15.00%   |  
  | B     | 25.00%     | 20.00%     | 5.00%    |  
  | C     | 20.25%     | 16.00%     | 4.25%    |  
  | D     | 16.00%     | 13.00%     | 3.00%    |  
  | E     | 13.75%     | 11.00%     | 2.75%    |  
  - **Largest Gap (Biggest Party):** A gap = **15.00%**.  
  - **Average Absolute Gap:** `(15.00 + 5.00 + 4.25 + 3.00 + 2.75)/5 = **6.00%**`.  

  ---

  ### Key Result: PR is **Less Proportional**  
  - **FPTP Avg. Gap:** 0.50% | **PR Avg. Gap:** 6.00% → **PR is 12× less proportional**.  
  - **FPTP Biggest-Party Gap:** 0.00% | **PR Biggest-Party Gap:** 15.00% → **PR massively over-rewards the "winner."**  

  ### The Feature Doing the Work: The 20-Seat Bonus  
  - **Why?** The bonus artificially inflates the largest party’s seats (A jumps from 25% votes to 40% seats), cascading disproportionality through the remaining allocation.  
  - **Test: Remove the Bonus (Pure PR with 5% Threshold):**  
    - All 100 seats allocated proportionally (Hare quota = 1.0% per seat).  
    - Results: A:25, B:25, C:20, D:16, E:14 seats.  
    - Avg. Gap: **0.10%** (vs. FPTP’s 0.50%) → PR becomes **more proportional** than FPTP.  
    - *Conclusion: The bonus alone causes the reversal.*  

  ---

  ### Strongest Objection from a PR Advocate  
  **Objection:** "This isn’t real PR! The 20-seat bonus is a majoritarian distortion, not a feature of proportional systems. True PR (e.g., Netherlands, Scandinavia) never uses such bonuses. You’ve rigged the test by adding an FPTP-like element to PR."  

  **Fairness Assessment:**  
  - **Fair:** The objection is valid. The bonus *is* a non-standard, majoritarian rule (common in hybrid systems like Greece’s old law, not true PR). A purist would argue the thought experiment attacks a "strawman PR."  
  - **Unfair:** The rules were explicitly specified upfront. The point was to show how *specific* PR rules (even if atypical) can create perverse outcomes. It proves proportionality isn’t "automatic" but depends on design.  

  **Bottom Line:** The case holds as a valid counterexample to "PR is *always* more proportional," but real-world PR systems avoid such bonuses for exactly this reason. The reversal is a caution against tinkering with PR, not a critique of PR itself.  

