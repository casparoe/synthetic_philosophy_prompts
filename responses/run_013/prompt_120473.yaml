prompt: |-
  Ok, so I keep getting hit with Pascalian-style arguments -- tiny probability, huge payoff, so you should do the thing -- and my gut reactions to them are all over the place. I'd like to know whether there's actually a principle behind my reactions or whether I'm just being arbitrary. I dont have any real background in decision theory, so go easy on me, but I do want something precise.

  Here's my gut, case by case.

  - Coin flip: I pay a dollar, heads I get three. Take it, obviously.
  - Lottery ticket: one in a million for two million dollars, ticket costs a dollar. Yeah, I'd buy it, mostly for the fun of it.
  - Weird one a friend gave me: a fair coin has to come up heads 200 times in a row and you win 10^100 dollars; the ticket is a dollar. I wouldn't buy it, and if someone told me they had, I'd figure they'd lost the plot -- even though I'm told the expected value is bigger than every dollar that exists.
  - Guy on the street: give me fifty bucks and I'll be back tomorrow with a hundred million, trust me, low odds but not zero. Absolutely not.
  - Pascal's wager itself: beleive in God, finite cost, infinite prize. I want to say it's a bad argument, but every time I try to say why, I end up saying something that also kills the coin flip. And it's not just that I'm not religious.
  - The version where you can invent gods freely -- a god who rewards doubters, a god who's insulted by hedging -- which I take to be a reductio, except then I don't know what's left of the original one.
  - The case that actually trips me up: a friend tells me to ask for the raise, send the email, take the swing, because the downside is small and bounded and the upside is big and open-ended. I think that's good advice, and it has the same shape as the guy on the street.

  (For what it's worth I also buy insurance happily, which I think is this whole thing running backwards.)

  So: is there a principle here? Discount tiny probabilities? Bounded utility? Something about bets you can take over and over versus bets you only get once? Something about whether the probability is one you have any independent handle on at all? Or does the wager fail for a reason that has nothing to do with the arithmetic -- like that you can't decide to believe things?

  State whatever you land on precisely enough that I can't wriggle out of it, tell me which of my cases is doing the work for each part of it, tell me what it predicts for one or two cases I haven't mentioned, and be honest about which of my verdicts above it can't save.

  One more thing: flag what's settled here versus what's a live fight among people who actually work on this. I have a feeling some of what I've been told is one school's answer dressed up as the obvious one, and I'd rather know where the real disagreement sits. Keep it to 700 words, one page, and lead with the principle.
reasoning: |-
  Okay, the user is struggling with Pascalian-style arguments and wants a clear principle to explain their gut reactions to various scenarios. They've listed several cases: from favorable bets like a coin flip to skeptical ones like Pascal's wager and the guy on the street. Their main confusion is why some tiny-probability, high-payoff bets feel reasonable while others don't, especially when the expected value calculation seems similar.

  First, I need to identify a unifying principle. Expected utility theory alone doesn't explain their reactions because it would suggest accepting all positive expected value bets, yet they reject some. The key might be bounded utility functions—where utility has limits, making astronomical payoffs no more valuable than extremely large but finite ones. This explains why the 10^100 dollar coin flip isn't attractive; beyond a point, more money doesn't add utility.

  Decision-making under deep uncertainty is another factor. Cases like the guy on the street or invented gods involve probabilities that aren't just small but completely unknown or unconstrained. Here, the principle of indifference doesn't apply, making it irrational to assign any probability or act on it. This separates the lottery (known odds) from Pascal's wager (unfalsifiable, arbitrary probabilities).

  Repeated bets versus one-off bets also matter. The coin flip and lottery can be played multiple times, averaging out over time. But the 200-heads coin flip is practically a single-shot bet, so the tiny probability dominates. Insurance works similarly but in reverse by mitigating risk over repeated exposures.

  For the raise example, the downside is bounded (small cost of asking), while the upside, though uncertain, isn't infinite. It's a calculated risk with no deep uncertainty—probabilities might be unknown but aren't arbitrary like in Pascal's wager.

  Now, addressing their cases: bounded utility handles the 200-heads flip and Pascal's wager. Deep uncertainty invalidates the street guy and Pascal's reductio. The raise advice fits because it avoids these issues—downside is small, upside is finite but significant, and probabilities aren't baseless.

  Areas of debate: whether utility bounds are necessary or if probability discounting suffices. Also, handling infinitesimal probabilities is contentious. The user's rejection of the street guy aligns with bounded utility and deep uncertainty, but their acceptance of the lottery might need explaining—perhaps due to entertainment value or repeated play potential.

  I should present the principle clearly: bounded utility + deep uncertainty + repeated vs. one-off bets. Highlight settled aspects (bounded utility acceptance) vs. ongoing debates (discounting tiny probabilities). Ensure the explanation is precise and addresses all their cases without wiggle room.
answer: |-
  Here's the principle unifying your intuitions:

  **Principle:** Expected utility calculations require both **bounded utility functions** and **constrained, non-arbitrary probability assignments**. When utilities are unbounded or probabilities are unconstrained (effectively arbitrary), expected utility maximization breaks down, and other decision rules (like dominance, minimax, or simple skepticism) become rational.

  ### How It Explains Your Cases
  1.  **Coin Flip / Lottery:** Works. Utility of money is bounded *for practical purposes* in these ranges ($1 to $3 million). Probabilities are known and fixed (0.5, 10^-6). Expected Value (EV) is positive and meaningful.
  2.  **200 Heads Coin Flip:** **Bounded Utility.** Beyond a certain point (e.g., $10^9), more dollars add negligible real utility (can't buy more security/meaning). The astronomical payoff *doesn't* translate to an astronomical utility gain. The tiny probability (2^(-200) ~ 10^(-60)) dominates, making the *expected utility gain* negligible or negative (considering the utility loss of $1).
  3.  **Guy on the Street / Pascal's Wager (Original):** **Unconstrained Probability.** The claimed "low but non-zero" probability is baseless and unconstrained. You could assign *any* arbitrarily small probability to *anything* (e.g., guy is honest, specific God exists). This makes the "expected utility" calculation meaningless – it's infinitely manipulable.
  4.  **Pascal's Reductio (Invented Gods):** **Unconstrained Probability + Arbitrary Payoffs.** Demonstrates the fatal flaw: you can invent *any* payoff structure (punishing belief, rewarding doubt) and assign *any* unconstrained probability to it. Expected utility becomes incoherent.
  5.  **Insurance:** **Bounded Utility + Known Probabilities (Actuarial).** Works backwards: mitigating large, bounded losses (house fire, medical bills) with small, certain payments. Probabilities are estimated based on data, not arbitrary. Negative EV is the price for risk aversion.
  6.  **Ask for the Raise:** **Works.** Downside is small & bounded (embarrassment, time). Upside is large but *bounded* (a raise, promotion - not infinity). Probability is unknown but *constrained*: based on your performance, company policy, manager's style. It's not an arbitrary fantasy. Dominance reasoning ("Can't lose much, could gain a lot") applies safely here, unlike the Street Guy/Pascal.

  ### Predictions for New Cases
  *   **Dyson Sphere Lottery:** Pay $1 for a 1 in 10^30 chance to own a Dyson Sphere (vast energy source). *Prediction:* You'd reject. (Bounded Utility: Owning it offers finite benefit; tiny probability dominates).
  *   **Alien Artifact:** Mysterious stranger offers a 1% chance (based on "vibes") of technology granting immortality for $10,000. *Prediction:* You'd reject. (Unconstrained Probability: The 1% is arbitrary and unfalsifiable).

  ### What Your Principle Can't Save
  *   **Your Lottery Purchase:** Strict bounded utility suggests even the 1-in-a-million lottery has negligible *expected utility* benefit (the $1 loss utility might outweigh the tiny chance of a $2M utility gain). You bought it "for fun" – meaning you assigned **positive utility to the act of playing itself** (entertainment, hope), making the *overall* expected utility positive. This is rational, but highlights that utility includes more than just the monetary outcome.

  ### Settled vs. Live Fights
  *   **Settled:** The core problem with Pascal's Wager (unconstrained probabilities making EV incoherent) and the reductio are widely accepted fatal flaws. The *necessity* of bounded utility to avoid "Pascalian fanaticism" (obsession with tiny-probability huge-gain bets) is strongly established (e.g., Martin, Beckstead, Nover & Hájek). Expected utility *requires* bounded utility to be well-defined for infinite payoffs.
  *   **Live Fights:**
      *   **Discounting Tiny Probabilities:** Should we explicitly downweight *very* small probabilities (e.g., below 10^-9) regardless of payoff size? Some (e.g., Weirich) argue yes to avoid fanaticism; others see it as ad hoc. Bounded utility often solves this without explicit discounting.
      *   **Handling Genuine Infinitesimals:** How to model decisions where probabilities are truly infinitesimal (not just very small finite numbers)? This is highly theoretical and contentious.
      *   **Precise Boundaries:** Defining exactly where utility bounds bite or probabilities become "unconstrained" in practice involves judgment. The *principle* is clear, the *application* can have grey areas.

  **Your core rationality:** You intuitively grasp that unbounded utility leads to absurdity and that bets require evidence-based probability constraints. The "raise" advice works because it respects these bounds and constraints, unlike Pascal or the Street Guy. Your lottery buy is the outlier, justified by non-monetary utility.
