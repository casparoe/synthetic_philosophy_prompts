prompt: |-
  I'm a high schooler trying to get through Maimonides' Guide for the Perplexed for a philosophy club thing, and I'm stuck on this chunk from Part III, ch. 32. Here it is:

  "The custom which was in those days general among all men, and the general mode of worship in which the Israelites were brought up, consisted in sacrificing animals in those temples which contained certain images, to bow down to those images, and to burn incense before them... It was in accordance with the wisdom and plan of God, as displayed in the whole Creation, that He did not command us to give up and to discontinue all these manners of service; for to obey such a commandment it would have been contrary to the nature of man, who generally cleaves to that to which he is used; it would in those days have made the same impression as a prophet would make at present if he called us to the service of God and told us in His name, that we should not pray to Him, not fast, not seek His help in time of trouble; that we should serve Him in thought, and not by any action."

  I get that he's talking about why the Torah has animal sacrifice, but I dont really get what he's actually claiming. Is he saying God only commanded sacrifices as a kind of concession to how people already acted? And if so, what does that do to the idea that the commandments are supposed to be for their own sake? Can you help me understand the passage without assuming I already know medieval philosophy? Please format it as: (1) "Plain-English paraphrase" (~200 words), (2) "The actual argument" (~250 words), (3) "The analogy, explained" (~150 words), (4) "Where I might be misreading" (~150 words). No citations or reading list, please—I just want to understand what's going on in the passage.
