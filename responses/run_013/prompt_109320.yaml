prompt: |-
  I host a podcast on moral philosophy, and next week's guest is a philosopher who defends a view I'll call threshold lexical negative utilitarianism. As she formulates it, suffering and enjoyment are not commensurable across the whole scale: there is a lexical threshold such that any suffering that keeps a life below the threshold takes strict priority over any amount of enjoyment that would not raise it above the threshold, while above the threshold suffering and enjoyment can be traded off at a finite rate. She also holds that the threshold is not a sharp line but a region of indeterminacy, and that this indeterminacy is metaphysical rather than merely epistemic. I want the interview to press her on the view rather than let her restate it.

  Draft ten to twelve questions, arranged in a sequence that builds. Include at least one question each on: what exactly is being denied when she says pleasure and pain are not commensurable below the threshold, and whether that denial is a claim about value, about measurement, or about rational choice; how the threshold is located and whether it can be specified without circularity; whether the view is really a form of negative utilitarianism or a hybrid that merely borrows its name; how it handles aggregation across persons, especially cases where a large number of mild pains are weighed against one intense pain; and what would count as evidence or argument against the view, given that its central discontinuity may be insulated from empirical test. For each question, add a follow-up that responds to the answer she is most likely to give, and where relevant a second follow-up that presses the point if she deflects. End with a question that asks her to distinguish the parts of her position she takes to be settled from the parts she regards as genuinely contested among specialists, and to say which contested part she would most like to see resolved.

  For every question, include a brief note to me, the interviewer, separating what is settled from what is contested; do not let a contested view be presented as the consensus. No citations or reading lists. The questions should stand on their own for a listener who has not read the literature.
reasoning: |-
  Okay, the user hosts a moral philosophy podcast and is preparing for an interview with a philosopher who defends threshold lexical negative utilitarianism. This view has some unique features: a lexical threshold where suffering below it takes strict priority over enjoyment, indeterminacy in the threshold that's metaphysical rather than epistemic, and non-commensurability below the threshold. The user wants pressing questions that build sequentially, covering specific aspects like commensurability denial, threshold location, classification as negative utilitarianism, aggregation issues, and falsifiability. 

  Hmm, the user clearly wants to avoid a restatement-heavy interview and push the guest on philosophical tensions. The request for follow-ups suggests they anticipate deflection and want to maintain pressure. Interesting that they emphasize not presenting contested views as consensus—this shows academic rigor awareness. The guest's metaphysical indeterminacy claim seems particularly vulnerable to challenge, so questions there should probe carefully.

  First, I need to clarify what's being denied in non-commensurability—is it about value incomparability or measurement impossibility? The follow-up should distinguish descriptive vs normative claims. For threshold location, circularity risk is real if she defines it via suffering priority but relies on that same priority to identify the threshold. Must press that loop. 

  On classification, calling it "negative utilitarianism" might be misleading if the view permits trade-offs above threshold. The aggregation puzzle—many mild pains vs one intense pain—could expose inconsistencies in lexicality. And falsifiability is thorny: if the discontinuity is metaphysical, how could evidence ever challenge it? That needs layered questions.

  The closing question about settled vs contested parts serves dual purposes: it forces intellectual honesty while subtly asking where the view is weakest. Smart framing by the user. 

  For structure, I'll start with commensurability to establish foundations, then threshold mechanics, followed by implications (classification/aggregation), then robustness (falsifiability), ending with meta-reflection. Each question chain should feel like tightening screws: initial query, follow-up on likely deflection, second follow-up if she dodges. 

  Notes to user must flag when consensus ends—e.g., metaphysical indeterminacy is highly disputed, lexical thresholds aren't standard in NU. No jargon; examples like "papercut vs torture" keep it accessible. Avoiding citations aligns with podcast format but requires careful phrasing to stand alone. 

  Biggest risk is guest retreating to "it's indeterminate" as a shield. Follow-ups must preempt that by asking how indeterminacy functions—as an ontological feature or epistemic concession. If she claims the latter, it contradicts her stated metaphysics. Gotcha moments must feel organic though, not gotcha-for-gotcha's sake. 

  The user's depth of prep impresses me. They've identified all pressure points; my job is weaponizing those into precise questions. Time to draft.
answer: |-
  Here are 12 sequenced questions with follow-ups and interviewer notes, designed to press the core tenets of Threshold Lexical Negative Utilitarianism (TLNU):

  1.  **Core Question:** When you say suffering and enjoyment are "not commensurable" *below* the lexical threshold, what exactly are you denying? Are you claiming there is *no common scale of value* where they can be compared at all, or that they *cannot be meaningfully traded off* in practical reasoning, even in principle?
      *   *Likely Answer/Follow-up:* (If she emphasizes no trade-off) So, is this primarily a claim about *rational choice* – that it's always irrational to choose suffering below threshold for any amount of enjoyment below threshold? Or is it a stronger claim about *value ontology* – that suffering and enjoyment below threshold are fundamentally different kinds of value/disvalue that resist comparison?
      *   *Possible Deflection Press:* If she suggests it's about measurement difficulty, ask: "But you specified the indeterminacy is *metaphysical*, not epistemic. Doesn't that imply the lack of commensurability is a fact about the *nature* of the values themselves, not just our inability to measure them?"
      *   *Interviewer Note:* *Denial of commensurability is contested. The distinction between value ontology, rational choice, and measurement is crucial and debated. Consensus holds that commensurability is complex but often assumed possible in some form.*

  2.  **Threshold Location:** How do we locate this lexical threshold? Since it defines the point where priorities radically shift, how can we specify *what it is* (e.g., "a life barely worth living," "minimally flourishing") without already presupposing the very priority of suffering avoidance that the threshold is meant to establish? Isn't there a risk of circularity?
      *   *Likely Answer/Follow-up:* (If she uses examples like "unbearable suffering") But doesn't labeling suffering as "unbearable" or life as "not worth living" *already* imply a judgment that the suffering outweighs *all* possible enjoyment in that state? Isn't that the conclusion the threshold is supposed to *lead* to, rather than its independent definition?
      *   *Possible Deflection Press:* If she appeals to phenomenology ("we just know severe suffering is different"), ask: "Couldn't that phenomenological 'knowing' be explained by a very steep, but still finite, weighting of suffering below a certain point, rather than a true lexical discontinuity? How does metaphysical indeterminacy help avoid that alternative explanation?"
      *   *Interviewer Note:* *Defining a non-arbitrary, non-circular threshold is a major challenge. Appeals to intuition or phenomenology are common but contested foundations.*

  3.  **Indeterminacy Nature:** You describe the threshold as a "region of indeterminacy" that is *metaphysical*. What does this metaphysical indeterminacy mean? Does it mean there are *genuinely borderline cases* where it's neither true nor false that a life is below the threshold? If so, how does rational choice work *within* this indeterminate zone?
      *   *Likely Answer/Follow-up:* (If she confirms genuine indeterminacy) So, for lives within this zone, is it rationally *permissible* to prioritize either suffering avoidance *or* enjoyment promotion, since it's indeterminate which priority applies? Or does the lexicality still hold, but we just can't *know* where?
      *   *Possible Deflection Press:* If she struggles with permissibility in the zone, ask: "Doesn't this indeterminacy risk collapsing the strict priority rule in the very area where it's supposed to be most crucial? How can lexical priority be strict if its application is metaphysically fuzzy?"
      *   *Interviewer Note:* *Metaphysical indeterminacy applied to value thresholds is highly contested and unusual. Most indeterminacy in ethics is seen as epistemic (about our knowledge).*

  4.  **NU Classification:** Traditional Negative Utilitarianism (NU) prioritizes minimizing suffering *simpliciter*, often seeing pleasure as merely instrumental or secondary. Above the threshold, your view allows finite trade-offs between suffering and enjoyment. Doesn't this mean TLNU isn't truly a *form* of NU, but rather a distinct hybrid view that borrows the "negative" label for the sub-threshold domain? What makes the core commitment "negative"?
      *   *Likely Answer/Follow-up:* (If she argues the sub-threshold priority defines it as NU) But if the *overall* axiology above the threshold includes positive enjoyment as an intrinsic good traded against suffering, doesn't that fundamentally depart from the core NU tenet that only suffering has intrinsic disvalue/negative weight? Isn't TLNU closer to a deontologically constrained consequentialism below the threshold?
      *   *Possible Deflection Press:* If she emphasizes the strict priority below threshold as the defining NU element, ask: "Couldn't a non-NU view (like a rights-based view) *also* impose strict priority against severe suffering in certain contexts? What specifically makes TLNU's foundation utilitarian rather than deontological?"
      *   *Interviewer Note:* *Labeling TLNU as "Negative Utilitarianism" is contested. Many argue true NU only minimizes suffering, period. Hybrid views are common but their classification is debated.*

  5.  **Aggregation (Intensity vs. Numbers):** How does TLNU handle aggregation *below* the threshold? Specifically: Does the lexical priority of suffering apply *per individual*? If so, would TLNU allow imposing a very large number of *very mild* pains (e.g., minor annoyances, fleeting discomforts) on many people to prevent *one* person from experiencing an intense, life-wrecking pain that would push *their* life below the threshold?
      *   *Likely Answer/Follow-up:* (Likely Yes, due to strict per-person priority) So, potentially millions could suffer minor pains to prevent one intense suffering event below the threshold? Isn't this deeply counterintuitive and a major cost of the lexicality? Or does the metaphysical indeterminacy somehow mitigate this?
      *   *Possible Deflection Press:* If she suggests minor pains might not push lives below threshold, ask: "But if the minor pains are sufficiently numerous and persistent, *couldn't* they cumulatively push a life below the threshold? How does TLNU weigh preventing one life *clearly* falling below against preventing many lives from *risking* falling below due to accumulated minor pains?"
      *   *Interviewer Note:* *Aggregation problems (esp. large numbers of small harms vs. few large harms) are a major challenge for lexical and threshold views. No consensus solution exists.*

  6.  **Aggregation (Within Suffering):** Below the threshold, is *all* suffering lexically prior to enjoyment? Or could a sufficiently large amount of *milder* suffering *below* the threshold outweigh a smaller amount of *more intense* suffering *also below* the threshold? For example, preventing a vast number of moderate pains vs. preventing one excruciating pain (both keeping lives below threshold).
      *   *Likely Answer/Follow-up:* (If suffering intensities are commensurable below threshold) If suffering intensities *can* be compared and aggregated below the threshold, doesn't that reintroduce a kind of commensurability *within* suffering that your view denies *between* suffering and enjoyment? What justifies this asymmetry?
      *   *Possible Deflection Press:* If she denies commensurability even within suffering below threshold, ask: "So preventing *any* suffering below threshold takes strict priority over preventing *any other* suffering below threshold? How do we then choose between alleviating different types of severe suffering?"
      *   *Interviewer Note:* *Whether suffering types/intensities are commensurable below threshold is a critical detail of TLNU often left implicit. The asymmetry (if present) needs justification.*

  7.  **Evidence/Falsifiability:** The central discontinuity at the threshold seems crucial. Given you characterize the indeterminacy as *metaphysical*, how could empirical evidence about human psychology, neuroscience, or lived experience of suffering and enjoyment *ever* count as evidence *against* the existence of this specific threshold structure? Doesn't this metaphysical commitment insulate the core claim from empirical test?
      *   *Likely Answer/Follow-up:* (If she appeals to intuitions or conceptual arguments) So, does this mean TLNU rests ultimately on foundational moral intuitions or conceptual necessities that are themselves contestable? If empirical findings about how people *actually* weigh suffering vs. enjoyment conflict sharply with the predictions of TLNU (e.g., people sometimes accept intense suffering for great future enjoyment), does that challenge the view, or is it simply dismissed as irrationality?
      *   *Possible Deflection Press:* If she dismisses conflicting empirical data, ask: "If the view is insulated from both empirical counter-evidence and the need for a non-circular definition of the threshold, what grounds do we have for accepting it besides its initial intuitive appeal to you?"
      *   *Interviewer Note:* *The methodological status of such thresholds (empirical vs. intuitive/a priori) is deeply contested. Insulation from empirical test is a common criticism of strongly metaphysical value claims.*

  8.  **Motivation & Alternatives:** What problem in traditional utilitarianism or other views is TLNU uniquely positioned to solve? Could the core intuitions motivating TLNU (e.g., the special badness of severe suffering) be captured equally well or better by a view with a very large, but *finite*, disvalue weighting for suffering below a certain point, avoiding the challenges of strict lexicality and metaphysical indeterminacy?
      *   *Likely Answer/Follow-up:* (If she argues lexicality is necessary for the *absolute* priority) But does the *practical* difference between a sufficiently large finite weight and true lexicality ever manifest in real-world decisions? If not, isn't the simpler, finite weighting preferable?
      *   *Possible Deflection Press:* If she insists on the principled difference, ask: "Doesn't the metaphysical indeterminacy you introduce actually *blur* the absolute priority you aim to establish, making it less clear-cut than a very large finite weighting would be in practice?"
      *   *Interviewer Note:* *Whether lexical thresholds are necessary or superior to very large finite weightings is a key point of debate. Lexicality is often seen as theoretically extreme.*

  9.  **Practical Implications:** How does TLNU translate into practical guidance in complex scenarios like resource allocation for global health? Does the strict priority below threshold imply we must divert *all* resources to alleviate the very worst suffering anywhere (e.g., extreme poverty, torture victims) until it's eliminated, even if that means abandoning vast improvements in well-being for those above threshold?
      *   *Likely Answer/Follow-up:* (Likely Yes, with caveats about feasibility/indeterminacy) Given the scale of suffering below threshold globally, and the metaphysical indeterminacy making identification difficult, doesn't this lead to profound practical paralysis or require implausible judgments about who is definitively below?
      *   *Possible Deflection Press:* If she emphasizes feasibility constraints, ask: "But doesn't TLNU, *in principle*, demand that we prioritize alleviating *any identifiable instance* of suffering below threshold over *any* improvement above threshold, no matter how large? Isn't the feasibility caveat an admission that the pure principle is practically untenable?"
      *   *Interviewer Note:* *The demandingness and potential paralysis of strict lexical priority in real-world contexts are major practical criticisms.*

  10. **Distinguishing Features:** What is the *strongest* argument *against* TLNU that you grapple with? How do you respond to it?
      *   *Likely Answer/Follow-up:* (Listen and engage) [Follow up directly on the weakness she identifies, e.g., if she cites aggregation, press: "Does your response fully resolve the counterintuitive implication of prioritizing one intense pain over millions of mild ones?" or if she cites circularity, press: "Does your response provide a truly independent anchor for the threshold?"]
      *   *Interviewer Note:* *This assesses her view of the main vulnerabilities. Be prepared to challenge her response based on prior lines of questioning.*

  11. **Settled vs. Contested:** Stepping back, which core elements of Threshold Lexical Negative Utilitarianism do you believe are relatively settled within its framework, and which aspects remain genuinely contested even among philosophers broadly sympathetic to prioritizing suffering?
      *   *Likely Answer/Follow-up:* (Listen) Focusing on one contested aspect you mentioned: What specific argument or development would you most like to see to help resolve that particular controversy?
      *   *Interviewer Note:* *This forces reflection on the view's stability and open questions. It highlights internal debates beyond external criticisms.*

  **Key Interviewer Notes Throughout:**

  *   **Commensurability Denial:** Contested whether incommensurability is necessary or coherent; disagreement on whether it's ontological, rational, or epistemic.
  *   **Threshold Location:** Defining it non-circularly is a major, unresolved challenge. Appeals to intuition are common but debatable foundations.
  *   **Classification as NU:** Contested. Strict NU adherents deny views incorporating positive value above threshold qualify.
  *   **Aggregation:** Handling aggregation, especially many small harms vs one large harm below threshold, is a severe and widely acknowledged problem for lexical views with no consensus solution.
  *   **Metaphysical Indeterminacy:** Highly contested and unusual. Most ethicists view indeterminacy as epistemic (about knowledge), not metaphysical (about reality).
  *   **Falsifiability:** Contention over whether such views can be empirically tested or rest solely on intuition/a priori reasoning.
  *   **Alternatives:** Debate over whether core intuitions are better served by non-lexical views (e.g., very large finite weights).

  Use these notes to gently push back or clarify if the guest presents contested elements as settled consensus. Focus on the structure of the argument and its internal tensions. Good luck with the interview!
