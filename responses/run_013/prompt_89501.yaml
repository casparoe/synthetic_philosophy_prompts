          - Resolution: The facilitator computes the metric for tutoring and study space by adding the adjustments from all distributed slips to a base value. Then compares.

     Example calculation: 
          Base: tutoring 50, study space 50.
          Slip 1 (tutoring negative): -5 -> tutoring 45
          Slip 2 (study space positive): +10 -> study space 60
