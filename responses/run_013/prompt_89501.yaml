  We are designing a 90-minute session for an undergraduate philosophy society to explore futarchy through an interactive activity. The goal is for students to experience both the promise and pitfalls of the mechanism, particularly:
  - The initial appeal of separating values (voted) from beliefs (traded in markets)
  - The problem that the metric chosen by vote already settles a value conflict
  - Issues of manipulability, endogeneity (when the market influences the metric), and counterfactual resolution

  The activity will revolve around a decision: use a fixed pot of money for either a peer-tutoring program or a late-night study space.

  Key structural features to preserve:
  1. There must be a values disagreement (what the money is for) and a factual uncertainty (which policy will deliver better on the chosen metric).
  2. The group must vote on a single scalar metric first.
  3. Then, run a conditional prediction market on which policy (tutoring or study space) will produce a higher value of the metric.
  4. Include private information slips to distribute asymmetric information.
  5. Have a resolution procedure agreed in advance.
  6. Then, introduce two rounds that break the initial setup:
     a. Endogeneity: some participants can influence the metric (so betting on the metric becomes betting on their actions).
     b. Counterfactual: the metric is redefined after the fact, or the market resolves on a comparison between two worlds of which only one exists.

  Materials:
  - Play money (or points) for trading.
  - Private information slips (each with a unique piece of information).
  - A way to record market prices (a whiteboard or shared document).
  - Timer.

  Participants: ~20 students.

  Timeline: 90 minutes.

  Proposed Activity:

  1. Introduction (5 minutes)
     - Explain the scenario: The department has a fixed pot of discretionary money. Two options: 
          Option A: Subsidize a peer-tutoring program.
          Option B: Pay for a late-night study space.
     - Emphasize there is a real disagreement about what the money is for (values) and uncertainty about which will work better (facts).
     - Explain that they will use a decision-making procedure inspired by futarchy.

  2. Voting on the Metric (10 minutes)
     - The group must decide on a single metric by which to judge the success of either policy. This metric must be scalar (a single number) and measurable within the resolution period (which we will simulate).
     - Guide the discussion: 
          - Suggest examples: "Number of students using the service per week", "Average GPA improvement of users", "Student satisfaction score (on a 1-10 scale) after one month".
          - But let them propose and debate. The key is that they must converge on one metric by vote.
     - Vote: Each student votes for one metric. The metric with the most votes wins.
     - Note: The facilitator should make sure that the chosen metric is actually measurable in the context of the activity (we'll simulate the measurement). Also, note that the vote on the metric is where values are being settled. Some students might prefer a metric that favors their preferred policy (but they might not say that). The facilitator should not point this out yet.

  3. Setting up the Prediction Market (10 minutes)
     - Explain the market: They will trade a contract that pays off based on which policy (tutoring or study space) produces a higher value of the chosen metric.
     - Contract: "The tutoring program will yield a higher [metric] than the study space." 
          - If true, the contract pays 100 points. If false, it pays 0.
     - Trading: They can buy and sell these contracts using play money (each student starts with, say, 1000 points). The market will be open for trading for a set period (e.g., 15 minutes).
     - Resolution: They must agree on how the metric will be measured and when. Since we are simulating, we will have a resolution procedure (see below).
     - Distribute private information slips (to about 5-7 students, so that not everyone has one). Each slip has a piece of information that might affect the outcome. Examples:
          - "The tutoring coordinator is about to leave the university, so the program might be disorganized."
          - "The study space is next to a construction site that will be active during the late-night hours, causing noise and disruption."
          - "A survey of students last term showed that 70% would prefer a tutoring program over a study space."
          - "The tutoring program would use graduate students who are currently on strike, so it might not start on time."
          - "The study space would be in a room that is available only on Tuesdays and Thursdays, limiting its use."
