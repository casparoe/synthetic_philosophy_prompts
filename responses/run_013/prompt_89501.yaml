  - Round 3: Setup (3 min), Trading (7 min), Resolution and metric change (5 min) -> 15 min [Total: 80 min]

  - Final Debrief (10 min) [Total: 90 min]

  Now, the detailed steps and wording.

  Due to the complexity, we might want to skip Round 3 and extend the debrief. But the counterfactual is important. Alternatively, we can drop Round 3 and instead discuss the counterfactual in debrief, using Round 1 as an example (in Round 1 we never implemented, so we had to simulate both).

  Given time, I propose:

  Round 1: As described.
  Round 2: Endogeneity with two markets and influencers.
  Round 3: We drop the trading and just illustrate the metric change. After Round 2, we say: "Now, imagine that after we've chosen tutoring and measured the metric, we realize that we should have used a different metric. Let me show you what would have happened if we had used [new metric]." And then recalculate both policies under the new metric using the same information slips (even though only one was implemented) and show that study space would have been better. Then we ask: "But how can we trust the market when the metric can change?"

  This would save time.

  Final timeline with this adjustment:

  - Introduction (5 min)
  - Vote on Metric (10 min)
  - Round 1: Setup (5 min), Trading (10 min), Resolution (5 min), Debrief (5 min) -> 35 min [Total: 40 min]
  - Round 2: Setup (5 min), Trading (10 min), Policy choice & influencer action (5 min), Payoff (2 min) -> 22 min [Total: 62 min]
  - Round 3: Illustration of metric change (8 min) [Total: 70 min]
  - Final Debrief (20 min) [Total: 90 min]

  Materials for facilitators:

  - Play money: Enough for each student (e.g., 1000 points each).
  - Information slips for Round 1 and Round 2 (different sets? or reuse?).
  - Secret role cards for Round 2 influencers.
  - Whiteboard to record market prices.

  Wording of information slips (Round 1 and 2):

  For Round 1, we use the examples above. For Round 2, we can use similar or different. But note, in Round 2 we are not using the slips for resolution? In Round 2, the metric is set by the influencer. So we don't need slips for Round 2. We only need the influencer role cards.

  In Round 2, we can include some information slips to make the markets more interesting, but then the actual metric is set by the influencer. So the information slips might be misinformation or be overridden.

  To keep it simple, in Round 2 we do not distribute information slips. The only private information is the influencer's power.

  In Round 3, we don't need slips either.

  So:

  - Round 1: Distribute information slips (5-7 slips).
  - Round 2: Distribute two influencer role cards (and no information slips).
  - Round 3: No materials.

  In Round 2 resolution, the metric for the chosen policy is set by the influencer. For the non-chosen policy, we don't need a metric because those contracts pay 0. But in the two markets, the contract for the non-chosen policy expires worthless. The contract for the chosen policy pays the metric value set by the influencer.

  Example influencer role card for tutoring:
      "You are the tutoring coordinator. If the tutoring program is chosen, you will be able to set the metric to either 40 or 60. You will make this choice AFTER the market closes and the policy is chosen. You will be paid 10 extra points for every 10 points of the metric (so if the metric is 60, you get 60 extra points). Also, you can trade in the markets."

  Similarly for study space.

  But note: the contract pays the metric value to every holder. So if the influencer sets it to 60, every contract holder gets 60.

  This gives the influencer an incentive to set it high if they hold many contracts, and low if they are short.

  But also, they get extra points based on the metric? That might be too much. Alternatively, we can just let them trade and have the contract payout be their incentive.

  Revised influencer role card for tutoring:
      "SECRET ROLE: Tutoring Influencer
       - If the tutoring program is chosen, you will be asked to set the metric to either 40 or 60.
       - You may trade in the markets.
       - Note: Your setting of the metric will affect the payout for the tutoring contract. If you hold tutoring contracts, you will want the metric to be high. If you have sold tutoring contracts (or gone short), you will want the metric to be low."

  Similarly for study space.

  This avoids extra payments and keeps it within the market.

  In Round 3, we illustrate the metric change:

      - We say: "In Round 2, we used metric M1. Now we realize that we should have used metric M2."
      - We take the same two policies and the same information (from Round 1 slips) and compute what the metric M2 would have been for each policy.
      - For example, if in Round 1 we had slips that we used to adjust M1, we now use them to adjust M2 with a different formula.
      - We show that under M2, the study space might have been better even though we chose tutoring.

  Example:
      - Original metric M1: number of users.
      - New metric M2: satisfaction score.

      - For tutoring: 
            Base M1: 50, adjustments from slips -> 45.
            Base M2: 5.0, adjustments -> 6.0.
      - For study space:
            Base M1: 50, adjustments -> 60.
            Base M2: 5.0, adjustments -> 4.0.

      - In Round 2, if tutoring was chosen and set to 60 (by the influencer) for M1, that was high. But for M2, tutoring would have been 6.0 and study space 4.0, so tutoring is still better? We want it to flip.

  Alternatively, we can make it flip.

      - Let's say in Round 2, the influencer for tutoring set M1 to 60. But for M2, we compute:
            Tutoring: 4.0 (because the same factors that increased M1 might decrease M2)
            Study space: 7.0.

      - So under M1, tutoring (60) > study space (we don't have it, but in Round 1 study space was 60? so tie) -> but in Round 2 study space wasn't implemented, so we use the Round 1 information for study space for M2? 

      To avoid confusion, we recompute both policies for M2 using the Round 1 information slips.

      We announce: 
          "Under the new metric M2 (satisfaction), here's what we estimate:
              - Tutoring: 4.0
              - Study space: 7.0
          So if we had used M2, we would have chosen study space."

      But in Round 2, the market for study space might have been lower because of trading, but we ignore that and use the Round 1 information.

      This is a bit disconnected, but it makes the point: the metric change can alter the decision.

  Final debrief points (20 minutes):

  1. What did we do?
     - Voted on a metric (values) -> settled the fight quietly.
     - Round 1: Market aggregated beliefs about which policy is better for that metric. But we had to simulate the counterfactual (both policies) to resolve.

  2. Round 2: 
     - We used markets to choose the policy. 
     - But then the metric became endogenous: the market price influenced the outcome because the influencer could set the metric in response to the market or their trades.
     - This is the Goodhart's law problem: when a measure becomes a target, it ceases to be a good measure.

  3. Round 3:
     - We realized that the metric might change after the fact. The values we voted on might not be the ones we care about later.

  4. Problems with futarchy:
     - The metric vote is value-laden and may not capture everything.
     - The market requires counterfactual estimates (what would have happened under the other policy) which are hard.
     - Endogeneity: policies might be chosen because the market is optimistic, and then the optimism becomes self-fulfilling (or self-defeating if there is sabotage).
     - Thin markets and manipulation: in a small market, a few traders can influence prices.

  5. What the activity didn't capture:
     - In real futarchy, the markets are conditional: "What will the metric be if we do A?" and that market runs independently. We did that in Round 2 with two markets.
     - Real markets might be more efficient with more participants.
     - The counterfactual problem is even worse in reality because we have no data from the other policy.

  Failure modes and handling:

  1. The metric vote takes too long or they cannot agree.
     - Solution: After 8 minutes, take the top two metrics and do a runoff vote.

  2. Round 1 trading is slow.
     - Solution: The facilitator can act as a market maker, posting bids and asks. Or seed the market with orders (e.g., one buy order at 40 and one sell at 60).

  3. In Round 2, the markets are confusing.
     - Solution: Explain clearly that there are two separate contracts. Use a whiteboard with two columns. Also, do a quick example trade.

  4. The influencers in Round 2 don't trade or don't understand.
     - Solution: When giving the role card, pull them aside and explain. Also, suggest they trade to make money.

  5. Time runs out.
     - Solution: Cut trading short if needed. Facilitator can announce: "We have 2 minutes left."

  6. The resolution in Round 1 seems arbitrary.
     - Solution: In the debrief, acknowledge that in reality we would have real data, but in the game we simulate.

  7. Students might not see the connection to futarchy.
     - Solution: In the debrief, explicitly map each part.

  This is a complex activity, but it should be engaging and revealing. Good luck!
answer: |-
  ### Futarchy Simulation Activity Design  
  **Goal:** Students experience the core mechanics of futarchy (vote on values, bet on beliefs) and encounter its pitfalls endogenously—endogeneity, counterfactuals, and metric manipulation—through structured gameplay.

  ---

  ### **Materials**  
  1. **Play Money:** 1,000 units per student (use colored paper or digital tracker).  
  2. **Information Slips:** 7 unique slips (distributed secretly; see wording below).  
  3. **Market Boards:** Two whiteboards (or shared docs):  
     - Board 1: Metric vote options.  
     - Board 2: Prediction market prices (updated in real-time).  
  4. **Role Cards:** For endogeneity round (2 cards: "Tutoring Influencer" and "Study Space Influencer").  
  5. **Timer:** For trading rounds.  
  6. **Resolution Protocol Sheet:** Visible to all (explained in setup).  
  7. **Sticky Notes:** For metric redefinition in Round 3.  

  ---

  ### **Information Slips Wording**  
  *(Distribute 7 slips privately before Round 1; each reveals asymmetric information.)*  
  1. *"Peer-Tutoring Coordinator is leaving next month; replacements are inexperienced."*  
  2. *"Late-night study space neighbors a construction site (noise 10 PM–2 AM)."*  
  3. *"Tutoring program qualifies for a grant doubling its budget if launched this term."*  
  4. *"Study space would be supervised by a popular professor, boosting attendance."*  
  5. *"Department survey: 70% of students prefer tutoring over study spaces."*  
  6. *"Study space furniture is delayed; temporary chairs reduce comfort."*  
  7. *"Tutoring volunteers are overbooked; wait times likely."*  

  ---

  ### **Activity Rules & Timeline** (90 Minutes Total)  

  #### **Phase 1: Setup (5 min)**  
  - **Explain the Decision:**  
    *"Our philosophy society has £5,000. We must choose:  
    - **Option A:** Subsidize peer-tutoring (tutors help struggling students).  
    - **Option B:** Fund a late-night study space (open until 2 AM).  
    We care about different things—some want academic support, others want community space. But we can’t do both."*  
  - **Preview Steps:**  
    "First, we’ll vote on how to measure success. Then, we’ll bet on which policy delivers that outcome. Finally, we’ll test how robust this system is."  

  ---

  #### **Phase 2: Metric Vote (10 min)**  
  - **Task:** Groups of 4 propose scalar metrics (e.g., "GPA improvement," "weekly users"). Write options on Board 1.  
  - **Vote:** Anonymous ballot; top metric wins.  
  - **Facilitator Prompt:**  
    *"Argue for your metric—does it capture what we *really* value? Does it favor one policy?"*  
  - **Key Tension:** Students realize voting on a metric (e.g., "attendance counts") silences values (e.g., "tutoring helps marginalized students more").  

  ---

  #### **Phase 3: Round 1 – Prediction Market (20 min)**  
  - **Market Setup:**  
    - Contract: *"Policy A (tutoring) will produce a higher [chosen metric] than Policy B (study space)."*  
    - Pays 100 if true, 0 if false. Trading with play money.  
    - **Resolution Protocol** (agreed in advance):  
      *"Metric measured after 4 weeks. Data from department records. If tied, contract voids."*  
  - **Trading (12 min):**  
    - Open outcry trading (students shout bids/asks; facilitator updates Board 2 with latest price).  
    - Distribute 7 information slips secretly.  
    - *Optional:* Appoint 2 market makers to ensure liquidity (post bids at 40, asks at 60).  
  - **Resolution (5 min):**  
    - Collect slips publicly. Facilitator calculates outcome:  
      - Base: Tutoring = 50, Study Space = 50.  
      - Adjust: +10/-10 per slip (e.g., "construction site" → Study Space -10).  
    - Announce winner, pay contracts.  
  - **Debrief Prompt (3 min):**  
    *"Did the market price reflect what you knew? Did voting on the metric feel like deciding the fight early?"*  

  ---

  #### **Phase 4: Round 2 – Endogeneity (20 min)**  
  - **Twist:** Secretly give 2 students role cards:  
    - *Tutoring Influencer:* "You can inflate tutoring’s metric by 20 points if chosen (e.g., by falsifying sign-ins)."  
    - *Study Space Influencer:* "You can deflate study space’s metric by 20 points if chosen (e.g., by misreporting usage)."  
  - **New Market (15 min):**  
    - Same contract as Round 1.  
    - Influencers trade knowing they can manipulate outcomes.  
  - **Resolution (5 min):**  
    - Pay contracts based on Round 1’s calculation.  
    - Reveal influencer roles.  
    - *"If tutoring won, its metric jumps +20. If study space won, its metric drops -20."*  
  - **Debrief Prompt:**  
    *"Did betting on the metric feel like betting on the influencers? How did this change your trust in the market?"*  

  ---

  #### **Phase 5: Round 3 – Counterfactuals & Redefinition (15 min)**  
  - **Twist 1 (Counterfactual):**  
    *"We chose Policy A. But to pay the contract, we need Policy B’s metric—which never happened. How do we estimate it?"*  
    - Students debate: Use historical data? Guess? Void the market?  
  - **Twist 2 (Redefinition):**  
    Distribute sticky notes: *"Redefine the metric: e.g., change ‘attendance’ to ‘satisfaction survey score.’"*  
    - Re-resolve Round 1’s outcome with new metric (facilitator recalculates with slips).  
  - **Debrief Prompt:**  
    *"Did the original market answer a useless question? Whose values did the redefinition prioritize?"*  

  ---

  #### **Phase 6: Structured Debrief (20 min)**  
  Map gameplay to futarchy concepts:  

  | **Activity Moment**           | **Futarchy Concept**                                  | **Lived Experience**                                                                 | **Limitations**                                        |  
  |-------------------------------|-------------------------------------------------------|--------------------------------------------------------------------------------------|-------------------------------------------------------|  
  | Metric vote                   | Vote on values                                        | "Our fight was over before trading started."                                         | Real values are multidimensional; voting flattens them. |  
  | Round 1 market aggregation    | Bet on beliefs                                        | "Prices merged our private info."                                                    | Assumes information is factual, not manipulative.     |  
  | Resolution protocol debate    | Threshold selection                                   | "We set rules in advance, but what if data is fuzzy?"                                | Real-world data is messy and politicized.             |  
  | Round 2 influencers           | Endogeneity (metric becomes a target)                 | "Betting on tutoring was betting on the influencer."                                 | Real influencers are subtler (e.g., CEOs gaming KPIs).|  
  | Round 3 counterfactual        | Unverifiable comparisons                              | "We made up Study Space’s outcome—it felt arbitrary."                                | Futarchy requires comparing unrealized worlds.        |  
  | Metric redefinition           | Value drift                                           | "Changing the metric invalidated our bets."                                          | Values evolve; contracts can’t adapt.                 |  

  **Honesty Note:**  
  - The activity **reproduces**: Metric vote as value settlement, endogeneity, counterfactual uncertainty.  
  - It **gestures at**: Thin markets (via small group), manipulation (via influencers).  
  - **You must supply**: Real-world examples (e.g., GDP as flawed metric, prediction markets in corporations).  

  ---

  ### **Predictable Failure Modes & Fixes**  
  1. **Trading Stagnation (Round 1/2):**  
     - *Why:* Students hesitate to trade.  
     - *Fix:* Seed bids/asks (e.g., "Buy at 45! Sell at 55!"). **Don’t over-liquify**—let uncertainty linger.  

  2. **Metric Vote Deadlock:**  
     - *Why:* Students lobby for polarizing metrics.  
     - *Fix:* Impose "no metric hybrids" rule. **Don’t suggest compromises**—let them feel the loss of nuance.  

  3. **Influencers Reveal Early (Round 2):**  
     - *Why:* Role-play excitement.  
     - *Fix:* Brief influencers privately: *"You lose power if exposed."* **Don’t restart**—use it to discuss trust.  

  4. **Counterfactual Debate Dominates (Round 3):**  
     - *Why:* Philosophical disagreement on estimating unknowns.  
     - *Fix:* Set a 3-minute cap, then force a vote. **Don’t resolve**—highlight that futarchy demands arbitrary choices.  

  5. **Debrief Drifts Abstract:**  
     - *Why:* Students generalize prematurely.  
     - *Fix:* Anchor in game moments: *"Recall when Ava’s slip moved prices..."* **Don’t lecture**—ask: "Where did futarchy feel brittle?"  

  ---

  ### **Key Takeaways for Students**  
  - Futarchy’s appeal: Separating values (democratic) from facts (efficient).  
  - Its fragility: Metrics are politicized, endogenous, and static; counterfactuals are unknowable.  
  - **Ultimate Question:** "Does relocating values to a metric vote solve disputes—or hide them?"  

  This design forces students to confront futarchy’s tradeoffs experientially. The moments of friction—voting on a reductive metric, discovering manipulation, wrestling with counterfactuals—are where learning crystallizes. Run it tightly, embrace chaos, and let the debrief unpack what they’ve lived.
