  The requirements I need to cover include: distinguishing correlation from causation, handling one-shot vs repeated interactions, maintaining probabilistic coherence, avoiding dominance violations, preserving standard rationality in small worlds, allowing for acausal cooperation (their primary interest), and being computationally feasible. For the test case, I'll explain how the theory should support cooperation through evidential reasoning without causation.

  I'll note that distinguishing correlation from causation is non-negotiable, while computational feasibility might be more flexible. The probabilistic coherence requirement likely causes the most trouble for existing theories. There might be tension between the acausal cooperation requirement and avoiding dominance violations in certain setups. I'll keep all this within the 700-word limit while ensuring the table is clear and each justification is precisely one sentence.
answer: |-
  Here are the core requirements for theories of rational choice in large correlated worlds, presented as requested:

  | Requirement                     | Description                                                                                                        | Consideration                                                                 |
  | :----------------------------- | :----------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------- |
  | **Causation/Correlation Distinction** | Must cleanly separate evidential correlation from causal influence between actions.                             | Preserves fundamental metaphysical difference between signaling and shared structure. |
  | **One-Shot Primacy**           | Must deliver correct prescriptions for genuinely non-repeated interactions without relying on future repercussions. | Avoids collapsing distinct game-theoretic structures (PD vs. Iterated PD).    |
  | **Probabilistic Coherence**    | Must strictly adhere to probability theory (e.g., no Dutch books, consistent conditional probabilities).          | Prevents internal contradictions and exploitable inconsistencies.             |
  | **Causal Dominance Respect**   | Must never recommend an action causally dominated by another *within the agent's causal reach*.                   | Upholds a bedrock principle of instrumental rationality in controllable domains. |
  | **Small-World Consistency**    | Must reduce to standard causal decision theory (CDT) when no relevant correlated agents exist.                    | Ensures continuity with established rational choice in uncorrelated scenarios. |
  | **Acausal Cooperation Enablement** | Must permit cooperation as rational in symmetric one-shot dilemmas with correlated reasoning agents.            | Captures the core phenomenon motivating the large-world view.                 |
  | **Computational Tractability** | Must offer a feasible method for agents to reason about their correlation class and expected utility.             | Ensures the theory is practically applicable by bounded reasoners.            |

  **Non-Negotiable vs. Parochial:** Causation/Correlation Distinction, Probabilistic Coherence, Causal Dominance Respect, and Small-World Consistency are non-negotiable foundations. One-Shot Primacy and Acausal Cooperation Enablement are core to the target problem but reflect a focus on large-world acausal dilemmas. Computational Tractability is desirable but often relaxed in foundational theory.

  **Most Excluding Requirement:** **Probabilistic Coherence** causes the most trouble. Many intuitive approaches (e.g., simple "I cooperate iff I believe others like me cooperate") lead to spurious correlations, incoherent priors, or Dutch books when formalized. Newcomb-like paradoxes and defining the "reference class" of correlated agents pose severe formal challenges.

  **Conflict Potential:** **Causal Dominance Respect** and **Acausal Cooperation Enablement** can *appear* to conflict in Prisoner's Dilemma-like structures. If donating (*cooperating*) is causally dominated by keeping (*defecting*) for the individual, yet cooperation is required by the Acausal Enablement, reconciliation requires showing the evidential link makes donating *not* causally dominated when considering correlation (i.e., `P(others donate | I donate)` is sufficiently high).

  **Your Test Case:** A minimally adequate theory must satisfy Acausal Cooperation Enablement (requirement 6). It should *allow* donating to be rational *if* your credence that sufficiently many *other* donors exist (causally disconnected but correlated via shared reasoning/structure) is high enough *conditional on your own donation*, such that the expected global benefit outweighs your personal cost. This evidential link ("My donating is good evidence others like me donate") must overcome Causal Dominance (requirement 4) purely through correlation, satisfying Probabilistic Coherence (requirement 3) and distinguishing it from causation (requirement 1). Failure to enable this rationalizes selfishness; failure to respect dominance risks incoherence.
