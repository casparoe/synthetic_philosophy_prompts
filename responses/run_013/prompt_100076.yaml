prompt: |-
  I keep running into a pattern and I don't have a word for it, and it's bugging me enough that I'm writing it out.

  The shape: somebody predicts something about how *you* are going to experience something, and the prediction turns out true exactly when you don't believe it, and false when you do. The prediction is about your own surprise or your own ignorance, so your belief in it isn't just sitting off to the side being accurate or inaccurate — it's part of what decides the outcome.

  Instance one, and yes I know this is the old surprise-quiz thing, but stay with me: teacher says there'll be a surprise quiz next week. The students run the familiar argument, conclude no surprise is possible, and stop expecting one. Quiz comes Wednesday, they're genuinely caught out. The part I care about isn't whether their proof is any good. It's that the announcement came out true, and it came out true becuase they didn't believe it — believing it was the thing that would have killed it.

  Instance two, no exam involved: a magician announces up front exactly how the trick works, then says you still won't see it coming. Take him at his word and you stare at his hands and catch the move, so he's wrong. Write it off as bluffing and you relax and get fooled, so he's right. Notice he'd want to be disbelieved. The most reliable way to make his sentence true is to get you to stop taking it seriously.

  Instance three, the one that actually bothers me: the teacher could hand the students the impossibility proof herself, on purpose, before quiz week. Not as a gag — as the mechanism. Making them certain there's no quiz is the surest way to make the quiz a surprise. So the proof isn't a bug in the setup, it's a tool for making the announcement true.

  What I want: is there a name for this class — predictions about the audience's own epistemic state where believing them flips their truth value — and separately for the sub-case where the predictor's best play is to engineer disbelief? I know it's in the neighborhood of self-fulfilling prophecy and of Moore's paradox, but neither seems to fit. A self-fulfilling prophecy is belief → true, a self-defeating one is belief → false, and this looks like both at once, in a loop. Moore sentences are awkward to assert but their truth doesn't hinge on what you believe. So please don't just say it's the surprise exam paradox. That's one instance. I want the general phenomenon, what it excludes, and where its edges fall.

  Cases I honestly can't classify: being told not to think about a white bear, or to just be spontaneous — those are impossible-by-trying, not belief-sensitive predictions, so presumably a different animal, but I'd like to know exactly why. And a doctor saying a pill only works if you believe it works: belief-dependent for sure, but the sentence isn't about your belief, and believing it doesn't make the sentence false. So where's the line?

  Also, say how confident you are in each main claim you make, and flag the single point you're least sure of. Then finish with a JSON object I can paste into a spreadsheet, using exactly these fields: "established_term" (the best established name, or null if nothing fits), "source_area" (which literature or field it comes from), "nearest_concepts" (array of objects with "name" and "how_it_differs"), "best_fit" (which nearest concept fits best and why, or null), "coined_term" (your proposed name if nothing fits, else null), "definition" (one sentence, covering what's in and what's out), "boundary_cases" (array of objects with "case", "in_or_out", "why"), "confidence" (a number from 0 to 1 for the answer overall), "least_confident_claim" (string).
reasoning: |-
  Hmm, the user is describing a fascinating logical pattern they've noticed across different scenarios. They're frustrated by not having a precise term for this phenomenon where a prediction about one's own epistemic state becomes true only if disbelieved, and false if believed. The examples they provide are quite thoughtful: the surprise quiz paradox, a magician's trick that only works if you dismiss their explanation, and even a meta-case where the teacher uses the students' own disbelief as the mechanism to create surprise.

  What makes this pattern particularly interesting is how it creates a loop between belief and truth value. If you believe the prediction, it becomes false; if you disbelieve it, it becomes true. This distinguishes it from concepts like self-fulfilling prophecies (where belief makes something true) or Moore's paradox (which is about the awkwardness of asserting contradictions, not about truth value dependency).

  The user is clearly looking for precise terminology and conceptual boundaries. They want to know: Is there an established term? If not, what could we call it? How does it differ from similar concepts? And crucially, where do we draw the line - like with the "don't think of a white bear" example (which is about direct control rather than belief-mediated truth) or placebo effects (where belief enables the effect but doesn't flip truth values).

  I notice they're also asking for confidence ratings and a structured JSON output - this suggests they might be compiling references or building some systematic framework. Their examples show they've already done significant thinking about epistemic loops and prediction paradoxes.

  The closest established concept seems to be "self-defeating predictions" from epistemic logic, but even that isn't a perfect fit. For the sub-case where the predictor actively engineers disbelief, there doesn't appear to be any standard term. I'll propose "epistemic sabotage" for that specific mechanism.

  For boundary cases: The white bear example is out because it's about volitional control rather than belief-mediated truth valuation. The placebo effect is out because belief enables rather than invalidates the claim. But a doctor saying "this won't work if you believe it will" would qualify as an in-case because it creates that belief-truth inversion.

  My confidence in this analysis is reasonably high (0.8), but I'm least sure about whether "self-defeating prediction" adequately captures the magician case where the prediction is about being fooled rather than about an event not occurring.

  The JSON output should capture all these distinctions clearly, with the definition emphasizing the belief-truth inversion loop, and boundary cases showing why similar phenomena don't make the cut.
answer: |-
  Based on your detailed description and analysis, here's a structured response addressing your request:

  **Core Phenomenon:** The pattern involves a **prediction specifically about the audience's *epistemic state* (surprise, ignorance, failure to predict/notice)** where the *act of believing the prediction* **causes it to become false**, and the *act of disbelieving it* **causes it to become true**. This creates a logical loop preventing stable belief.

  **Established Term:** There is **no single, universally established term** for this *exact* phenomenon across disciplines. The closest established concept is a **Self-Defeating Prediction** or **Self-Refuting Expectation**, particularly within **epistemic logic, philosophy of language, and paradox literature** (like the Surprise Exam/Hangman Paradox). Confidence: 0.85

  **Nearest Concepts & Differences:**
  1.  **Self-Fulfilling Prophecy (Sociology/Psychology):** Belief *causes* the prediction to come true (e.g., bank run). *Differs:* Belief *makes true* here, belief *makes false* in your pattern.
  2.  **Self-Defeating Prophecy (Sociology/Psychology):** Belief *prevents* the predicted outcome (e.g., predicting failure causes extra effort to avoid it). *Differs:* The prediction isn't *about the epistemic state itself*; the outcome prevented is usually external. Belief prevents the *external outcome*, not the truth of the *prediction about belief/knowledge*.
  3.  **Moore's Paradox (Philosophy/Language):** The oddity of asserting "P but I don't believe P". *Differs:* Focuses on the *assertibility/coherence* of the statement, not the *causal dependency* of its *truth value* on the belief state it reports.
  4.  **Iatrogenic Effect (Medicine):** Harm caused by treatment. *Differs:* Specific to harm, not about epistemic states or prediction logic.
  5.  **Epistemic Paradox (Logic/Philosophy):** Broad category encompassing the Surprise Exam, Knower Paradox, etc. *Differs:* Too broad; your pattern is a specific *type* of epistemic paradox characterized by the belief-truth-value flip loop.

  **Best Fit:** **Self-Defeating Prediction.** This fits best because:
  *   The prediction's *success* (being true) inherently *depends* on the audience *disbelieving* it.
  *   Belief in the prediction actively *defeats* its own truth (makes it false).
  *   It's the established label for the core mechanism in the Surprise Exam paradox, your prime example. Confidence: 0.8

  **Coined Term:** Since no perfect established term exists for the *general* pattern, and specifically for the sub-case where the predictor *engineers disbelief*:
  *   **General Pattern:** **Epistemic Flip-Flop Prediction** (emphasizes the truth-value flip based on epistemic state).
  *   **Sub-case (engineering disbelief):** **Epistemic Sabotage** or **Disbelief Engineering**.
  Confidence in need for coined term: 0.9

  **Definition:** A prediction specifically concerning the audience's future epistemic state (e.g., surprise, ignorance, failure to predict) whose truth value flips based on the audience's belief in the prediction itself: disbelief makes it true, belief makes it false, creating an unstable loop. *Excludes:* Predictions merely *influenced* by belief (placebos), commands requiring impossible volition (white bear), or predictions about external states whose occurrence is belief-dependent (standard self-fulfilling/defeating prophecies).

  **Boundary Cases:**
  1.  **"Don't think of a white bear":** *OUT.* This is a *command* requiring direct volitional control over a specific thought, not a *prediction about an epistemic state*. The impossibility arises from the act of *trying to comply*, not from *believing a prediction about one's own surprise/ignorance*. It's about *control*, not *prediction belief*.
  2.  **"Just be spontaneous":** *OUT.* Similar to the white bear. It's an *imperative* demanding an action (spontaneity) that cannot be willfully performed on command. Not a prediction about epistemic state.
  3.  **Doctor: "This pill only works if you believe it works":** *OUT.* This is a prediction about an *external state* (the pill's efficacy) *dependent* on belief. Belief *enables* the truth of the prediction (self-fulfilling aspect for the efficacy claim), it doesn't *flip* the truth value of a prediction *about the epistemic state itself*. Believing the doctor's claim doesn't make the claim *false*; it makes the pill *work*.
  4.  **Doctor: "You will be surprised by the side effects, *but only if you don't believe me now*":** *IN.* This *is* a prediction *about an epistemic state* (surprise) whose truth is *caused* by disbelief in the prediction itself. Belief kills it.
  5.  **"If you predict I'll win, I'll lose" (said to a pundit):** *OUT.* The prediction is about an *external outcome* (win/loss) dependent on the *pundit's belief/action* (prediction). Not a prediction *about the pundit's own epistemic state*. It's a standard self-defeating prophecy about an external event.

  **Overall Confidence:** 0.8 (Confident in the core analysis and distinctions, less confident in the absolute lack of a perfect established term outside specific paradox literature).

  **Least Confident Claim:** That the magician's trick ("you won't see it coming") *fully* qualifies under the strictest definition. While disbelief *causes* the trick to work (making the statement true), the statement "you won't see it coming" itself isn't *explicitly* a prediction about the epistemic state *at the moment the trick happens* (though it implies ignorance/surprise). Is it *directly* about the state, or only indirectly? Confidence in this specific inclusion: 0.7.

