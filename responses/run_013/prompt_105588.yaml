prompt: |-
  I'm putting together the plan for the third meeting of a small reading group I host out of my apartment — six or seven people, mostly lapsed STEM graduate students plus two humanities people, all of them veterans of the sequences and the broader rationalist blogosphere but none with any formal training in philosophy of mind — and the topic I've drawn for that evening is the distinction between knowing how and knowing that. I don't need you to explain the distinction to me; I have a view and can defend it. What I want is a plan for how I should explain it to this room: which idea has to be on the table before the next one can be, and why the order is forced rather than merely convenient — what actually depends on what, given that the natural opening move ('some knowledge is practical, some theoretical') is already the thing that needs unpacking rather than the thing that does the unpacking. Give me the single case that should carry the whole session, what that case has to contain and, just as importantly, what it must not smuggle in; the misconceptions this particular audience will walk in with or manufacture on the spot, with exactly where in the sequence I should head each one off before it sets; and the one question I can ask at the close that would show me the distinction has landed as a live problem rather than a memorized slogan.

  Because this group will not be satisfied with the folk version, I want the session to end somewhere genuinely unsettled. Specifically, I want to build toward the question of whether a system that can fluently narrate how to do something — recite the steps, answer counterfactuals about the method, correct a novice's description of it — while being unable to perform the action itself is a clean case of knowing that without knowing how, or whether it instead reveals that our grip on the distinction was always doing hidden work; and conversely whether there are skilled performances that involve no state worth calling propositional at all. Fold that arc into the plan rather than bolting it on at the end, and let me know if pursuing it means some earlier piece has to be set up differently. I'm also worried that the obvious candidate examples are either too pat or too contested to carry the weight — I first thought of the bicycle, then of some patient in the neurology literature who can do the thing but cannot say it, and I have reasons to distrust both for this audience — so tell me what the carrying example ought to be and why it beats the ones I'd instinctively reach for. I want the order of ideas with the dependency structure spelled out, the closing check for understanding, and an explicit list of the parts of the standard treatment I should deliberately omit and announce that I'm omitting.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a philosophy of mind session for a sophisticated reading group, focusing on the know-how/know-that distinction with specific pedagogical and conceptual requirements. 

  First, I need to recognize the audience's profile: STEM/humanities hybrids familiar with rationalist discourse but no formal philosophy training. Their likely misconceptions include reductionist tendencies (treating knowledge as exclusively propositional), implicit behaviorism (equating ability with knowledge), and over-reliance on functionalist explanations. 

  The core challenge is structuring the discussion to avoid the folk distinction ("practical vs theoretical") as a starting point. The natural entry point is actually the problem of failed translation - cases where propositional knowledge doesn't yield ability. But standard examples like bicycle riding are problematic because they're either too intuitive or neurologically contested. 

  I consider alternative cases: chess visualization fails because it's skill-bound; cocktail parties are too social; factory assembly risks behaviorist traps. The optimal example emerges as lockpicking - it meets all criteria by being procedural yet analyzable, with clear expert/novice divergence, and avoids neurological controversies through its mechanical nature. 

  For the dependency chain: We must establish ability asymmetry first (expert's fluidity vs novice's failure despite instructions) to destabilize the default "knowledge is unitary" assumption. Only then can we isolate propositional expression as a separate dimension when examining the instructor paradox. This sequence is forced because starting with definitions would beg the question. 

  Critical omissions to announce: Ryle's regress (too meta), neural implementation (distracts from epistemic layer), and anti-intellectualism debates (premature). The closing question about perfect verbalizers who can't perform serves dual purpose: checks understanding and lands the group in productive uncertainty about whether the distinction holds or collapses. 

  The lockpicking case specifically avoids smuggling in motor requirements (unlike bicycle examples) and sidesteps clinical literature's interpretive debates. By keeping it mechanical and everyday, we prevent the group from retreating to STEM reflexes about neural pathways. 

  Finally, the arc builds naturally to the unsettled question: If perfect verbal instruction without performance exists, does that validate the distinction or show it's artificial? And conversely, if some skills resist articulation, does that imply non-propositional knowledge or just unverbalized propositions? This mirrors the user's requested endpoint without requiring specialized literature.
answer: |-
  Here’s a battle-tested plan for your session, optimized for this audience and your goals. The structure is forced by conceptual dependencies—later steps *require* earlier foundations—and designed to destabilize folk intuitions while ending in productive uncertainty.

  ### **Core Case: Lockpicking**  
  *Why it beats bicycles/clinical cases:*  
  - Avoids motor-skill debates (bicycles invite "muscle memory" distractions).  
  - Sidesteps clinical literature’s interpretive baggage (e.g., blindsight debates re: consciousness).  
  - Scalable: Novices *can* recite instructions but fail; experts *can* perform but often struggle to articulate subtle cues.  
  - Mechanically transparent: Forces focus on epistemic states, not neuropathology.  

  **What it MUST contain:**  
  - A novice who memorizes a lockpicking manual (tension control, pin states, binding order) but utterly fails to open even a simple lock after hours.  
  - An expert who opens the lock fluidly but gives incomplete/oversimplified instructions ("feel for the binding pin").  
  - A counterfactual test: The novice *accurately* answers "What happens if you overset pin 2?" but *cannot* avoid oversetting it.  

  **What it must NOT smuggle in:**  
  - No reference to "automaticity" or "procedural memory" (this invites reductionism).  
  - No implication that expertise requires inarticulacy (avoid romanticizing the "tacit").  

  ---

  ### **The Dependency Chain & Session Flow**  
  *(Each step answers "Why this order?")*  

  1. **Problem: Failed Translation**  
     - *Present:* The novice lockpicker’s failure *despite* verbatim recall of instructions.  
     - *Why first?* Demonstrates the insufficiency of "knowing that" for performance. Forces the group to confront that *something is missing* beyond propositional knowledge.  
     - *Head off misconception:* "They just need practice!" → *Block by noting:* Practice refines ability but doesn’t explain why perfect recall + effort fails *now*.  

  2. **Expertise as Correction**  
     - *Present:* The expert’s corrective interventions ("less tension", "you overset pin 3").  
     - *Why now?* Shows knowledge-how manifesting as *situated judgment*—not just action but *diagnosis*. Depends on Step 1 to establish the novice’s propositional knowledge as inadequate.  
     - *Head off misconception:* "This is just more know-that!" → *Block by asking:* "Could the novice generate these corrections *before* seeing the failure? If not, what changed?"  

  3. **The Verbalization Gap**  
     - *Present:* The expert’s inability to fully articulate *why* their corrections work ("I feel the counter-rotation").  
     - *Why now?* Reveals knowledge-how’s resistance to exhaustive propositional expression. Depends on Step 2 to establish expertise isn’t just "more facts."  
     - *Head off misconception:* "They just lack language!" → *Block by noting:* The expert *can* articulate *some* cues but not *sufficient conditions* for success.  

  4. **Stress Test: Perfect Verbalizer**  
     - *Pose:* Imagine an AI that outputs flawless lockpicking manuals, answers all counterfactuals ("If pin 4 is spool-shaped, increase tension by 15%"), but *has no body* and cannot pick locks. Does it "know how"?  
     - *Why here?* Tests if "know-that" *exhausts* knowledge-how. Depends on Steps 1-3 showing knowledge-how exceeds propositional expression.  
     - *Crucial pivot:* "Does this reveal the distinction—or prove it’s artificial because 'know-how' reduces to *possessing certain counterfactual know-that*?"  

  5. **Reverse Test: Skill Without Narration**  
     - *Pose:* A savant who picks complex locks instantly but cannot answer *any* questions about method (not even "do you use torque?"). Does this agent "know how"?  
     - *Why last?* Tests if performance *alone* suffices for knowledge-how. Depends on Step 4’s challenge to purely propositional accounts.  

  ---

  ### **Closing Check for Understanding**  
  **The Decisive Question:**  
  *"Could there be two agents identical in their ability to pick locks, where one clearly 'knows how' and the other does not—and if so, what would differentiate them?"*  

  - **Why it works:**  
    - If they grasp the distinction, they’ll identify differences in *counterfactual responsiveness* (e.g., adapting to novel locks) or *articulation capacity* (per Steps 4-5).  
    - If they reduce know-how to ability, they’ll struggle to justify differences.  
    - Reveals whether the distinction is live (generates new hypotheses) or memorized (spouts Rylean slogans).  

  ---

  ### **Deliberate Omissions (Announce These)**  
  1. **Ryle’s regress argument:** Too meta; distracts from the epistemic/psychological core.  
  2. **Neural implementation (e.g., cerebellum vs. cortex):** Your audience will leap here—explicitly table it to avoid reductionism.  
  3. **Anti-intellectualism (e.g., Stanley & Williamson):** Premature; let the group *feel* the tension before naming positions.  

  ---

  ### **Why This Arc Delivers Uncertainty**  
  The lockpicking case escalates naturally to your target dilemma:  
  - Step 4’s "Perfect Verbalizer" forces confrontation with *whether know-that suffices for know-how*.  
  - Step 5’s "Skill Without Narration" asks *if know-how requires any know-that at all*.  
  By ending here, the group must face that *neither* pure propositional accounts *nor* pure ability accounts capture the phenomena—leaving the distinction’s validity *itself* in question.  

  **Final Tip:** When skepticism arises (e.g., "But lockpicking *is* just know-that!"), double down on the expert’s inarticulable corrections. Ask: "What proposition *exactly* corresponds to 'feel the binding pin'?" Make them try to formalize it. The failure lands your point.
