  ### Good's Theorem Activity: "The Information Dilemma"  
  **Objective:** Experience Good's theorem (nonnegative value of costless information) in a single-agent setting, then see it break in a strategic context.  

  **Materials:**  
  - Projector/whiteboard (display decisions, calculations)  
  - Index cards (for signals in Part 2)  
  - Play money/tokens (optional, for engagement)  
  - Timer  

  **Roles:**  
  - **Facilitator (you):** Explain rules, moderate, resolve disputes.  
  - **Participants:** 12-15, split into 3 groups of 4-5 for Part 2.  

  **Timeline (90 min):**  
  | Time       | Activity                                                                                                                                 |  
  |------------|------------------------------------------------------------------------------------------------------------------------------------------|  
  | **0:00-0:10** | **Intro (Single-Agent Game)**<br>- Explain the decision: Invest in Project X or skip. Payoffs depend on state (Strong/Weak).<br>- Prior: P(Strong) = 0.6, P(Weak) = 0.4.<br>- Payoffs: Invest in Strong = +$100, Invest in Weak = -$50; Skip = $0. |  
  | **0:10-0:25** | **Without Signal:**<br>- Groups compute expected utility (EU) of investing: (0.6 × 100) + (0.4 × -50) = $40. EU(skip) = $0.<br>- *Consensus:* Invest for $40. |  
  | **0:25-0:45** | **With Signal (Free & Private):**<br>- Signal accuracy: P("Strong"\|Strong) = 0.8, P("Weak"\|Weak) = 0.7.<br>- Groups compute:<br>  - P(Strong\|"Strong") = (0.8×0.6)/0.6 = 0.8 → EU(invest) = $70.<br>  - P(Strong\|"Weak") = (0.3×0.6)/0.4 = 0.3 → EU(invest) = -$5; better to skip ($0).<br>  - Overall EU with signal: [P("Strong")×70] + [P("Weak")×0] = $42.<br>- *Key insight:* Signal adds $2. Ignoring it (always invest) gives $40—same as no signal. |  
  | **0:45-0:50** | **Debrief Part 1:**<br>- Good's theorem holds: Signal is free, you can ignore/condition, actions & utilities fixed. Nonnegative value ($2 ≥ 0). |  
  | **0:50-1:05** | **Part 2: Strategic Setting (Auction Game)**<br>- Split into 3 groups. Each runs a sealed-bid auction for an item with *common* value V (V = $100 or $0, P=0.5).<br>- **Round 1 (No signals):** Bidders bid on expected value = $50.<br>- Payoffs: Winner gets V - bid; others get $0.<br>- *Typical outcome:* Bids ≈ $25 (since 2 bidders: (n-1)/n * $50 = $25), winner gains $25 on average. |  
  | **1:05-1:25** | **Round 2 (With Signals):**<br>- Each bidder gets a *private* signal (index cards):<br>  - If V=$100: Signal "High" (P=0.8), "Low" (P=0.2).<br>  - If V=$0: Signal "Low" (P=0.8), "High" (P=0.2).<br>- Groups bid again (signal in hand). Run 2 auctions: one w/ V=$100, one w/ V=$0 (use coin flips).<br>- **Predictable outcome:** Winners overpay. E.g., bidder with "High" bids high, wins when V=$0, loses $40+.<br>- Compare: Avg profit *with* signals is negative; *without* was $25. |  
  | **1:25-1:30** | **Conclusion & Final Debrief**<br>- Why did the signal hurt? In strategic settings, others’ actions depend on *their* signals. Even if you ignore yours, winning a bid implies others had bad signals (winner’s curse).<br>- Good’s theorem fails when information affects *other agents* (multi-player), not just your beliefs. |  

  ---

  **Key Learning Points:**  
  1. **Good’s Theorem Conditions:**  
     - Fixed action set (invest/skip or bid levels).  
     - Fixed utility function (no goal changes).  
     - Costless information (free signal).  
     - Single agent (no other players to react).  
     - Bayesian updating (conditionalization).  
     *Violate any → information can hurt.*  

  2. **Why Part 2 Broke the Theorem:**  
     - **Strategic disclosure:** Your signal affects others’ bids (even if you ignore it).  
     - **Winner’s curse:** Winning an auction *reveals* others had worse signals → you overpaid.  
     - *Condition violated:* Single-agent setting (the theorem doesn’t cover multi-player games).  

  ---

  **Predictable Challenges & Solutions:**  
  1. **"The probabilities feel arbitrary!"**  
     - *Solution:* Use dice/coins to physically generate states/signals. Emphasize, "This is the world you’re in; we’re testing rational response given the rules."  

  2. **"Ignoring the signal is irrational!"**  
     - *Solution:* In Part 1, show math: Ignoring gives $40 (same as no signal), but conditioning gives $42. No penalty for ignoring!  

  3. **Part 2 auctions get chaotic:**  
     - *Solution:* Pre-set V values for groups (e.g., Group 1: V=$100; Group 2: V=$0). Use a projector to display bid ranges ("Typical bids: $30-$70 for ‘High’ signals").  

  **Facilitator Note:**  
  - You *must verbally reinforce* the "single-agent" assumption in Part 1. Participants can’t "feel" it—the game rules enforce it by design. In Part 2, the auction mechanics make multi-agent incentives visceral.  

  **Why This Works:**  
  - Part 1 forces math showing signal ≥ ignore = no signal.  
  - Part 2’s auction creates winner’s curse *through play*, not lecture. The jump from single to multi-agent explains why "free information hurts" feels true despite Good’s theorem.
