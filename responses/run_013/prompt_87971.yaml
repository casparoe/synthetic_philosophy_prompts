  We are designing a 90-minute activity to demonstrate Good's theorem and then a strategic setting where information can hurt. The activity is for a group of 12-15 people comfortable with basic probability and expected utility.

  Plan:

  Part 1 (45 minutes): Single-agent decision problem where a free signal is beneficial.
  Part 2 (45 minutes): Variant where the same signal hurts due to strategic interaction.

  Materials: Index cards, projector (for displaying rules and calculations), whiteboard, play money or tokens (optional but can make it more tangible).

  Structure:

  Part 1: Single-Agent Scenario - "The Investment Game"

  Overview:
  - Each participant (acting as an individual agent) decides whether to invest in a project.
  - The project can be either Good (success with high probability) or Bad (success with low probability).
  - Without any signal, the agent must base the decision on the prior.
  - A free signal (costless) is available that gives some information about the state (Good/Bad).
  - We want participants to compute the expected value of the signal and see that it is nonnegative, and that they can always ignore it if it is not beneficial.

  Setup:

  States of the world:
  - Let the prior probability that the project is Good be 0.6 (so Bad is 0.4).

  Payoffs:
  - If they invest and the project is Good: they get $100.
  - If they invest and the project is Bad: they lose $50.
  - If they don't invest: they get $0.

  Without the signal:
  - EU(invest) = 0.6*100 + 0.4*(-50) = 60 - 20 = 40
  - EU(not invest) = 0
  - So they should invest, getting 40.

  Now, introduce a signal. Let the signal be a test that can be "Positive" or "Negative". The test is not perfect:

  - If the project is Good, the test is Positive with probability 0.8 (so Negative with 0.2).
  - If the project is Bad, the test is Negative with probability 0.7 (so Positive with 0.3).

  We can compute the expected value of the signal (EVSI) by comparing the expected utility with the signal (where they can condition on the signal) to the expected utility without the signal.

  First, compute the marginal probabilities of the signals:
  - P(Positive) = P(Positive|Good)*P(Good) + P(Positive|Bad)*P(Bad) = 0.8*0.6 + 0.3*0.4 = 0.48 + 0.12 = 0.6
  - P(Negative) = 1 - 0.6 = 0.4

  Now, the posterior probabilities:
  - P(Good|Positive) = [P(Positive|Good)*P(Good)] / P(Positive) = (0.8*0.6)/0.6 = 0.48/0.6 = 0.8
  - P(Bad|Positive) = 0.2

  - P(Good|Negative) = [P(Negative|Good)*P(Good)] / P(Negative) = (0.2*0.6)/0.4 = 0.12/0.4 = 0.3
  - P(Bad|Negative) = 0.7

  Expected utility if they see the signal and condition:
  - If Positive: 
     - EU(invest|Positive) = 0.8*100 + 0.2*(-50) = 80 - 10 = 70
     - EU(not invest|Positive) = 0 -> so they invest, getting 70.
  - If Negative:
     - EU(invest|Negative) = 0.3*100 + 0.7*(-50) = 30 - 35 = -5
     - EU(not invest|Negative) = 0 -> so they don't invest, getting 0.

  Therefore, the expected utility with the signal is:
  EU(with signal) = P(Positive)*70 + P(Negative)*0 = 0.6*70 + 0.4*0 = 42.

  Without the signal, they got 40. So the value of the signal is 42 - 40 = 2.

  We can also see that if they had the option to ignore the signal, they would still get at least 40 because they can always choose the action they would have taken without the signal. So the signal is nonnegative.

  Activity Flow for Part 1 (45 minutes):

  1. Introduction (5 min): Explain the game without the signal. Let them compute the expected utility of investing vs not investing. They should see that investing is better (40 vs 0). So without a signal, they would invest.

  2. Introduce the signal (5 min): Explain the signal and its accuracy. Then, have them compute the posterior probabilities (in small groups of 2-3) and the expected utility conditional on each signal. Then compute the overall expected utility with the signal.

  3. Compare (5 min): Show that with the signal they get 42, which is better than 40. So the signal is worth 2.

  4. Ignorability (10 min): Ask: "What if you get the signal but you don't like what it says? Can you just ignore it?" Let them see that if they get a negative signal and they ignore it (and invest anyway), then they would get -5 in that case, which is worse than 0. But they don't have to ignore it; they can condition. However, if they were forced to commit to an action without seeing the signal, they get 40. With the signal, they can always choose to ignore it and do the same action (invest) regardless. Then they would get:
     - If Positive: invest -> 70
     - If Negative: invest -> -5
     - Expected: 0.6*70 + 0.4*(-5) = 42 - 2 = 40, which is the same as without the signal. So by ignoring the signal they can always get at least the same as without. But by using the signal they can get more.

  5. Discussion (15 min): Lead a discussion to draw out the key points:
     - The signal is free and you can condition on it or ignore it.
     - Therefore, having the signal is at least as good as not having it.

  6. Debrief for Part 1 (5 min): Map to Good's theorem: fixed action set (invest/not invest), fixed utility function, the agent can condition on the signal (update by Bayes) and then choose optimally, and the information is costless. The agent is a single decision-maker.

