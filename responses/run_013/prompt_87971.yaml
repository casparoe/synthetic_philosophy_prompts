        Without signals, it was 12.5. So it dropped to 0.

  4. Discussion (10 min): Why did this happen? Because the information caused the bids to be more spread out, and in particular, when the value is 0, if one bidder gets H (which happens with prob 0.2) and the other gets L, then the H bidder bids 40 and wins, and then gets 0-40=-40, which is bad. Without signals, they would have both bid 25 and the winner would have gotten 0-25=-25, which is also bad, but less so. But in the no-signal case, they also have a 0.5 chance of V=100, so on average they get 12.5.

  5. Conclusion (5 min): In the single-agent case, you can ignore the signal and do as well as without. In the multi-agent case, you cannot ignore the signal because then you would never win when the value is high (because others will bid high) and you would win only when the value is low, leading to losses.

