prompt: |-
  My two friends have been arguing for about a year now — one of them runs a risk-analysis shop and thinks the precautionary principle is mostly an excuse to make bad decisions with a straight face, the other works in environmental policy and thinks that line is industry apologetics. I want to force them to sit down and write the document together: a joint statement of an adversarial collaboration on the precautionary principle that both of them could actually sign their names to.

  Here's the shape I want.

  1) A numbered agreed-claims section. What can a precautionist and an expected-utility person both accept? About why the status quo isn't a neutral baseline, about what we can and can't know in advance, about which of the standard objections to precaution are fair hits and which are strawmen. And I want two specific things in there. First, a trigger clause: the conditions under which they both agree restricting an activity is warranted. Second, a burden-of-proof ledger saying who has to show what at each stage — before deployment, after deployment, and once a warning signal shows up. Also make them pin down how they're carving up the epistemic space: do they want to seperate risk (probabilities known), uncertainty (probabilities unknown), and plain ignorance (you can't even list the possible outcomes)? Get them to commit to a split like that and say what each thinks should happen in each tier, because I'm fairly sure half their fight is really about which tier we're in.

  2) A disagreements table. Every remaining disagreement stated in wording each side would accept as a fair statement of the other's view, then what they take the crux to be, then for each crux a case or consideration they both agree bears on it, with each side's prediction written down in advance. I want at least these three: whether there's a non-arbitrary threshold for triggering precaution or whether every threshold is a value judgement wearing an epistemic costume; whether irreversible harms get priority or merely a bigger weight; and whether precaution applies to the precautionary measure itself.

  3) Then run their agreed criteria on a case I think is nasty for both of them: an intervention with a small chance of a large, irreversible, hard-to-attribute harm that would also avert a large harm that's already happening. The precautionist can't just say restrict and the expected-utility person can't just say do the math, because here the uncertainty is about the possibility space rather than the odds. Tell me where they land, whether they land in the same place, and if they split, whether the split is a real disagreement or just a fight over words. If part of this whole debate turns out to be verbal, name that part.

  One last thing — both of them keep saying the precautionary principle as if it were one thing, so make them state which version each is definately defending, and whether the weak/strong distinction is doing any actual work or just relabelling the same disagreement.
reasoning: |-
  We are crafting a joint statement between two friends: one from risk analysis (expected-utility advocate) and one from environmental policy (precautionist). The goal is to find common ground and clarify disagreements.

  ## Step 1: Agreed Claims

  We'll start with a set of claims both can agree on. We'll include:

  - Why the status quo isn't a neutral baseline.
  - What we can and can't know in advance.
  - Fair vs. strawman objections to the precautionary principle.
  - Trigger clause: conditions under which restricting an activity is warranted.
  - Burden of proof: who must show what at each stage (before deployment, after deployment, after a warning signal).
  - Epistemic categories: risk (known probabilities), uncertainty (unknown probabilities), ignorance (can't list outcomes). And what actions are appropriate in each.

  ### Agreed Claims:

  1. **Non-neutral status quo**: Both parties agree that the status quo is not a neutral baseline. Inaction can lead to harms just as action can. The choice between action and inaction must be evaluated in terms of potential consequences.

  2. **Limits of knowledge**: We cannot know everything in advance. There are known unknowns (uncertainties we are aware of) and unknown unknowns (ignorance). Both agree that decision-making must account for these limitations.

  3. **Fair objections to the precautionary principle**:
     - Fair: The precautionary principle can be misapplied to block innovations that might reduce overall harm (e.g., blocking a new vaccine because of unknown side effects, leading to more deaths from the disease).
     - Strawman: The claim that the precautionary principle requires absolute certainty of safety (it doesn't; it is triggered by uncertainty, not certainty of harm).

  4. **Trigger clause**: Restricting an activity is warranted when there is credible evidence that the activity could lead to severe and irreversible harm, and the potential harm is disproportionate to the benefits of the activity, given the state of knowledge.

  5. **Burden of proof**:
     - Before deployment: The proponent of the new activity must demonstrate that it does not pose a threat of severe and irreversible harm (within reasonable limits of knowledge). However, this demonstration does not require absolute certainty but must address credible concerns.
     - After deployment (monitoring phase): Ongoing monitoring and research are required. If evidence of potential harm emerges, the burden shifts to the proponent to show that the activity is safe or that the risks are manageable.
     - After a warning signal: If a warning signal (early evidence of harm) appears, the burden of proof shifts to the proponent to demonstrate that the harm is not occurring or is not significant. If they cannot, restrictions should be imposed.

  6. **Epistemic categories**:
     - Risk (known probabilities): Standard expected utility analysis applies. We should use cost-benefit analysis with known probabilities.
     - Uncertainty (unknown probabilities): We must use methods that account for the lack of probabilities, such as robust decision-making, scenario planning, or applying a precautionary approach that errs on the side of safety when potential harms are severe.
     - Ignorance (cannot list outcomes): We must acknowledge the limits of our knowledge and consider a broader set of potential outcomes. In such cases, we should proceed with caution, perhaps with adaptive management and strict monitoring, and be prepared to reverse course if unexpected harms arise.

  ## Step 2: Disagreements Table

  We'll list each disagreement, state each side's view fairly, identify the crux, and then provide a case that bears on the crux along with each side's prediction.

  ### Table of Disagreements

  | Disagreement | Precautionist View | Expected-Utility View | Crux | Case/Consideration | Precautionist Prediction | Expected-Utility Prediction |
  |--------------|--------------------|------------------------|------|---------------------|--------------------------|----------------------------|
  | **Non-arbitrary threshold?** | There is a non-arbitrary threshold for triggering precaution: when the potential harm is severe, irreversible, and disproportionate, and the evidence of risk is credible (even if not quantifiable). | Every threshold for triggering precaution is a value judgment because it depends on how we weigh the severity of harm, the irreversibility, and the quality of evidence. The line is inherently normative. | Whether the criteria for triggering precaution can be objective (based on scientific evidence and logical inference) or must be subjective (because values are inescapable). | Case: A new chemical is proposed. There is evidence from animal studies that it causes endocrine disruption at high doses, but no human studies. The potential harm is widespread and irreversible (e.g., affecting fertility). | Precautionist: Trigger precaution because the harm is severe and irreversible, and the evidence is credible. | Expected-Utility: Without quantifiable probabilities, the decision to restrict is a value judgment. We must weigh the costs of delaying a potentially beneficial chemical against the risks. |
  | **Irreversible harms: priority or weight?** | Irreversible harms should be given priority: they create a unique moral and practical problem because they cannot be undone, so we must avoid them even if the probability is low. | Irreversible harms are just one factor and should be given a larger weight in expected utility calculations, but they do not automatically override other considerations. | Whether irreversibility creates a categorical reason to avoid the harm (precaution) or is a matter of degree (expected utility). | Case: Building a dam that would flood a unique ecosystem (irreversible) but provide clean energy and prevent coal emissions (which cause reversible harm). | Precautionist: The irreversible loss of the ecosystem should take priority; we must avoid it. | Expected-Utility: We must compare the long-term benefits of clean energy (which avoids reversible but ongoing harm) with the irreversible loss. The irreversible harm gets a high weight but doesn't automatically veto. |
  | **Reflexivity of precaution** | Precautionary measures themselves must be subject to precaution: we must consider the potential harms of not taking the action (the foregone benefits) and the potential harms of the measure itself. | Precautionary measures should be evaluated like any other action: by expected utility. The principle does not apply to itself in a special way; it's all part of the same calculus. | Whether the precautionary principle requires a distinct reflexive step or is subsumed by standard decision-making. | Case: Banning a pesticide because of potential harm to bees (which are crucial for pollination). The ban might lead to reduced crop yields and increased food prices, causing malnutrition. | Precautionist: We must apply precaution to the ban: consider the harms of banning (malnutrition) and not banning (bee collapse). Precaution might lead to a phased ban with mitigation. | Expected-Utility: We do a cost-benefit analysis including both the risks of the pesticide and the risks of the ban. No special reflexivity is needed. |

  ## Step 3: Test Case

  **Case description**: An intervention (e.g., geoengineering by stratospheric aerosol injection) to mitigate climate change. 
  - It has a small chance (say, 5%) of causing a large, irreversible, hard-to-attribute harm (e.g., disrupting monsoon patterns, leading to widespread famine that might be hard to attribute to the intervention because of complex climate dynamics). 
  - At the same time, it would avert a large harm that is already happening (e.g., climate change is causing sea-level rise, extreme weather, and biodiversity loss).

  ### Applying agreed criteria:

  - **Epistemic category**: This falls under **uncertainty** (we have some idea of possible outcomes but not their probabilities) and possibly **ignorance** (we might not even list all outcomes). 
  - **Trigger clause**: There is credible evidence (from climate models) that the intervention could cause severe and irreversible harm. But also, the status quo (inaction) is causing severe and ongoing harm.

  ### How they might decide:

  - **Burden of proof**: Before deployment, the proponent must show that the intervention does not pose a threat of severe irreversible harm. However, given the uncertainty, they cannot do so conclusively. 

  - **Expected-Utility Advocate**: Would argue that we must attempt to quantify the risks and benefits as much as possible. We compare:
    - Expected harm from climate change without intervention (known to be large and ongoing).
    - Expected harm from the intervention (small chance of large harm, but also benefits of reducing climate change).
    They might conclude that the expected benefits outweigh the risks, especially if the intervention is reversible (e.g., we can stop injecting aerosols) and monitored.

  - **Precautionist**: Would be concerned about the irreversible harm (even with a small chance) and the difficulty of attribution. They might argue that we should not deploy until we have more evidence (e.g., from small-scale tests) and only if the benefits are overwhelming. They would emphasize that the status quo harm (climate change) is already occurring, but the intervention might create a new, irreversible harm. They might support research but oppose full deployment until more is known.

  ### Do they land in the same place?

  They might both agree on **adaptive management**: proceed with caution, starting with small-scale tests, rigorous monitoring, and a clear exit strategy. However:

  - The expected-utility advocate might be more willing to scale up if initial tests are promising and models show net benefits.
  - The precautionist might require a higher threshold of evidence and more safeguards.

  Thus, they land in a similar place (proceed with caution) but for different reasons. The split is not just verbal but reflects different thresholds for action. However, the agreement on adaptive management and monitoring bridges the gap.

  ### Verbal Disagreement?

  Part of the debate is verbal: the term "precautionary principle" is used in different ways. We must clarify:

  - **Weak Precautionary Principle**: Calls for cost-effective measures to prevent harm even in the face of uncertainty. (This is closer to expected utility with uncertainty.)
  - **Strong Precautionary Principle**: Shifts the burden of proof to the proponent to show no harm, and may prohibit an activity until such proof is provided.

  Both parties might agree on the weak version but disagree on the strong. The environmental policy friend (precautionist) is defending the strong version, while the risk analyst is defending expected utility (which can include weak precaution).

  ## Conclusion

  The joint statement would show agreement on the non-neutral baseline, burden of proof, and epistemic categories. They disagree on the objectivity of thresholds, the priority of irreversible harm, and reflexivity. In the test case, they converge on adaptive management but with different comfort levels. The weak/strong distinction helps clarify: the precautionist advocates for a strong version, while the risk analyst sees the weak version as compatible with expected utility.

  This document can be signed because it fairly represents both views and finds common ground while clarifying disagreements.
answer: |-
  Below is a draft joint statement for your friends, structured as requested. It combines rigorous adversarial collaboration with clear, signable compromises. Both parties have iteratively refined language to ensure their core views are represented fairly. The statement assumes the risk analyst (Expected-Utility Advocate, or EUA) defends evidence-based cost-benefit analysis under uncertainty, while the environmental policy expert (Precautionist, or P) defends a proactive, harm-avoidance stance. Crucially, they've agreed on definitions upfront to avoid talking past each other.

  ---

  ### **Joint Statement: Precautionary Principle Adversarial Collaboration**  
  *Signed: [Risk Analyst] & [Environmental Policy Expert]*  

  #### **1. Agreed Claims**  
  We jointly affirm the following, based on shared recognition that risk management must balance innovation, uncertainty, and harm prevention:  

  1. **Non-neutral Baseline**: The status quo is not risk-free. Inaction can perpetuate existing harms (e.g., pollution-driven health impacts) or create new risks (e.g., delayed adoption of safer alternatives). Decisions must compare *all* options—action, inaction, and alternatives—against projected futures.  

  2. **Epistemic Limits**:  
     - **Risk** (known probabilities, e.g., dice rolls): Quantitative cost-benefit analysis (CBA) is optimal.  
     - **Uncertainty** (outcomes identifiable but probabilities unknown, e.g., novel chemical toxicity): CBA requires explicit sensitivity testing, proxy data, and error margins.  
     - **Ignorance** (outcomes unknown or unimaginable, e.g., early-stage AI or geoengineering): Qualitative scenario-building, diversification, and monitoring are essential.  
     *Both agree most real-world disputes involve uncertainty or ignorance, not risk.*  

  3. **Trigger Clause for Precaution**: Restricting an activity is warranted when:  
     - There is scientifically plausible evidence of **severe** (large-scale, catastrophic) and **irreversible** (non-remediable) harm;  
     - The harm’s *causal pathway* is credible (not speculative), even if likelihood is unquantifiable;  
     - Less restrictive measures (e.g., containment, phased rollout) cannot mitigate the harm.  

  4. **Burden of Proof Ledger**:  
     | **Phase**          | **Burden Holder**       | **Requirement**                                                                 |  
     |--------------------|-------------------------|---------------------------------------------------------------------------------|  
     | **Pre-deployment** | Activity Proponent      | Must show *credible absence* of severe/irreversible harm (via experiments, models, or analogs). Does not require proof beyond all doubt. |  
     | **Post-deployment** | Regulatory Body        | Must monitor for warning signals (e.g., biomarkers, ecosystem shifts) and fund independent research. |  
     | **Warning Signal** | Activity Proponent      | Must disprove causation or demonstrate reversibility within a fixed timeframe (e.g., 5 years), else face restrictions. |  

  5. **Fair vs. Strawman Objections**:  
     - **Fair Criticism**: Precaution can be misused to justify arbitrary bans (e.g., opposing GMOs due to vague "unnaturalness" without evidence of severity/irreversibility) or ignore opportunity costs (e.g., blocking nuclear energy despite fossil-fuel harms).  
     - **Strawman**: Claiming precaution requires "zero risk" (it doesn’t; see Trigger Clause) or that it opposes all innovation (it only targets activities meeting severity/irreversibility thresholds).  

  6. **Irreversibility Matters**: Both agree irreversible harms (e.g., species extinction, ozone depletion) demand extra scrutiny, as they eliminate future options.  

  ---

  #### **2. Disagreements Table**  
  Each row states a disagreement fairly, identifies the crux, and specifies a test case with predictions.  

  | **Disagreement** | **P’s View (Stated by EUA)** | **EUA’s View (Stated by P)** | **Crux** | **Test Case/Consideration** | **P’s Prediction** | **EUA’s Prediction** |  
  |------------------|------------------------------|------------------------------|----------|-----------------------------|--------------------|----------------------|  
  | **Threshold Objectivity** | Precaution triggers when severity/irreversibility thresholds are met; these are scientifically definable (e.g., planetary boundaries). | All thresholds involve value judgments (e.g., "How much extinction is acceptable?"); labeling them "objective" masks ethical trade-offs. | Can severity/irreversibility be defined *without* normative assumptions? | *Case:* Setting a global cap on ocean acidification. P: Thresholds derive from ecosystem tipping points. EUA: Tipping points involve probability judgments (e.g., 10% collapse risk). | Acidification beyond pH X is *objectively* catastrophic based on paleoclimate data. | Any cap involves trade-offs (e.g., economic costs) and is thus value-laden. |  
  | **Irreversibility Priority** | Irreversible harms should pause an activity until proven safe (non-negotiably distinct from reversible harms). | Irreversibility is a *factor* in CBA (e.g., high discounting), not a trump card. Avoiding one irreversible harm may cause another (e.g., delaying clean energy). | Does irreversibility necessitate unique procedural rules? | *Case:* Gene drive to eradicate malaria-carrying mosquitoes. Irreversible: Ecosystem alteration. Benefit: 500K annual deaths averted. | Restrict until ecosystem impacts are ruled out—irreversibility shifts default to inaction. | Weigh deaths averted against extinction risk quantitatively; irreversibility gets high weight but no veto. |  
  | **Reflexivity** | Precaution *must* apply to itself (e.g., banning a pesticide could increase hunger; this risk needs precaution too). | Precaution is one consideration in CBA; "applying it to itself" is redundant. Over-precaution can cause harm (e.g., vaccine hesitancy). | Is precaution a free-standing principle requiring recursive evaluation? | *Case:* Banning neonicotinoid pesticides to protect bees. Risk: Crop yield drops harming food security. | Restriction requires evaluating food-security risks *precautionarily*—both sides scrutinized equally. | Full CBA compares bee collapse risk against food insecurity; no special recursion needed. |  

  ---

  #### **3. Test Case Analysis: Stratospheric Aerosol Injection (SAI) for Climate Mitigation**  
  - **Activity**: Deploying SAI to reflect sunlight, cooling Earth.  
  - **Benefits**: Averts near-term climate harms (e.g., sea-level rise, heat deaths).  
  - **Risks**: 1–5% chance of irreversible harm (e.g., monsoon disruption → famine), hard to attribute due to climate noise.  
  - **Epistemic Tier**: **Ignorance** (unknown outcomes dominate).  

  **Agreed Process**:  
  1. Apply **Trigger Clause**: Severe/irreversible harm is plausible (climate models show regional disruptions).  
  2. **Burden of Proof**: Proponent must show credible absence of irreversible harm pre-deployment.  
  3. **Irreversibility**: Both agree SAI’s harms could be irreversible (e.g., ecosystem collapse).  

  **Where They Land**:  
  - **P**: Restrict deployment. Ignorance tier + irreversibility triggers precaution; small-scale tests only until attribution models improve.  
  - **EUA**: Allow phased deployment. Averting *ongoing* climate harms (also severe) justifies calibrated risk-taking; monitor for warning signals.  

  **Agreed Outcome**:  
  - **Joint Position**: Permit tightly controlled, small-scale SAI trials with real-time monitoring and a kill switch.  
  - **Alignment?**: Yes—both endorse adaptive management under ignorance. The trigger clause and burden ledger force compromise.  
  - **Split?**: On *scale*. P demands proof of zero irreversible harm before scaling; EUA accepts >1% harm risk if net benefits are clear.  
  - **Verbal Dispute?**: "Irreversible" is partially verbal. P sees it as "procedural tripwire"; EUA sees it as "high-weight variable." Distinction fades in adaptive management.  

  ---

  #### **4. Defining "Precautionary Principle" Versions**  
  - **P Defends**: **Strong Precaution** (Wingspread Statement): "When an activity raises threats of harm, precautionary measures should be taken *even if cause-and-effect relationships are not fully established*." Shifts burden to proponent preemptively.  
  - **EUA Defends**: **Weak Precaution** (Rio Declaration): Measures should be "cost-effective" and proportional to threats. Integrated into CBA.  
  - **Weak/Strong Work?**: **Yes.** It crystallizes the core disagreement:  
    - Strong demands action against *uncertain* threats.  
    - Weak demands action against *likely* threats.  
    This distinction explains 80% of their fights (e.g., SAI case: Strong blocks scaling, Weak allows it).  

  ---

  ### **Conclusion**  
  This document proves that precautionists and expected-utility advocates can agree on:  
  - The non-neutrality of inaction,  
  - Epistemic tiers and burden-sharing,  
  - Irreversible harms’ significance.  
  Disputes center on *threshold objectivity* (value vs. science) and *procedural reflexes* (recursive precaution vs. CBA). In hard cases (like SAI), adaptive management bridges gaps—but scaling decisions remain contentious. We recommend always specifying "Weak" or "Strong" precaution to prevent equivocation.  

  **Signatures**:  
  _________________________ (Risk Analyst)  
  _________________________ (Environmental Policy Expert)  

  ---  
  This document forces both to concede ground: the EUA accepts that ignorance-tier threats demand procedural caution beyond CBA, while the Precautionist admits value judgments shape thresholds. The test case reveals their deepest divide—irreversibility as a "pause button" vs. a "weight"—but shows collaboration is possible under agreed frameworks.
