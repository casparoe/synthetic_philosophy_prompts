answer: |-
  Your dissection captures a profound and frustrating pattern of argumentative evasion. While no single established term perfectly encompasses this composite tactic, we can analyze its structure and propose precise terminology:

  **Core Pattern Dissected:**
  1.  **Initial Justification Standard (Functionalist):** Defender invokes Chesterton's Fence ("Don't remove until you know *why* it was built") *implying* the arrangement has a specific, knowable purpose.
  2.  **Reformer Meets Standard:** Reformer provides a plausible historical function, evidence of obsolescence (changed context, better alternatives), and argues for abolition.
  3.  **Escalated Justification Standard (Organicist/Ineffable):** Defender shifts ground, redefining the arrangement not as a functional device but as an "organic growth" or repository of "inarticulable goods." The demand shifts from explaining a *function* to justifying the *inherent, irreducible value* of the whole.
  4.  **Asymmetrical Burden:** The burden of proof perpetually rests on the reformer. The defender's position is presented as the "default" requiring no positive justification, merely resistance to change. Meeting the initial burden triggers the escalation.
  5.  **Perpetual Reformer-Wrongness:** The reformer is always positioned as lacking: either failing to understand the *reason* (Step 1) or failing to grasp the *inherent, ineffable worth* (Step 3).

  **Proposed Term: Justificatory Escalation (or Burden Escalation)**

  *   **Why it fits:**
      *   **Justificatory:** Directly addresses the core issue – the shifting standards of *justification* demanded of the reformer.
      *   **Escalation:** Captures the key dynamic – the burden doesn't just shift, it *increases in difficulty and changes in kind* precisely when the initial demand is satisfied. It moves from achievable (documenting historical function and obsolescence) to potentially impossible (proving the negative of ineffable value or fully articulating the irreducible worth of a complex "growth").

  **Distinguishing the Edges:**

  1.  **vs. Honest Conviction of Inarticulable Goods:**
      *   **Key Difference: Timing & Consistency.** An honest believer in inarticulable goods would likely lead with that argument *from the outset*. They might say, "This practice embodies values deeper than any functional purpose we can state; its worth is felt, not explained." The dishonesty lies in *first* demanding a functional justification *and then*, only after it's provided, switching to the ineffable defense. The initial Chesterton demand *implies* a functional justification *is possible and sufficient*.
      *   **Test:** If the defender had *started* by arguing the practice's value was inherently ineffable, rejecting the *premise* of Chesterton's Fence as applicable, it would be consistent (if debatable). The bait-and-switch is the defining flaw.

  2.  **vs. Fixed, Openly Avowed Preference for Status Quo:**
      *   **Key Difference: Argumentative Pretense & Burden Shifting.** Someone openly stating, "I simply prefer the tradition; change makes me uncomfortable, and I won't justify it further," is being bluntly conservative. They *accept* the burden of defending their preference lies with them, even if they refuse to engage. Justificatory Escalation hides this preference behind a facade of rational argument. It *pretends* to engage rationally (demanding a reason) but uses the demand and subsequent shift as *tools* to avoid defending the preference itself, placing the *entire* justificatory burden asymmetrically on the reformer. It weaponizes reasonableness to mask unreasoned preference.
      *   **Test:** Does the defender *ever* accept any positive justificatory burden for the arrangement itself, or only ever impose escalating burdens on the reformer?

  3.  **vs. Plain Stonewalling:**
      *   **Key Difference: Sophistication & Simulated Engagement.** Stonewalling is simple refusal: "No, we won't change it, no discussion." Justificatory Escalation simulates engagement. It offers *reasons* for resistance (first Chesterton, then ineffability) that *sound* reasonable or profound but are deployed strategically to create an impossible hurdle. It's a *rhetorical* stonewall disguised as a philosophical objection.
      *   **Test:** Is there an *argumentative structure* presented that *changes* in response to the reformer's points, specifically to nullify their argument without conceding ground?

  **Why "Chesterton's Fence" and "Conservative Presumption" Aren't Enough:**

  *   **Chesterton's Fence:** As you note, this is explicitly discharged by providing the reason. It doesn't account for the *second step* where the reason is rejected because the thing wasn't "built" but "grown." Chesterton's principle assumes a *knowable purpose*.
  *   **Conservative Presumption:** This identifies the *starting bias* but doesn't capture the *dynamic* shift in the nature of justification required when the initial presumption is challenged successfully. It describes the *attitude* but not the specific *tactic* of argumentative escalation.

  **The Essence: A Dialectical Shell Game**

  The core mechanism is a **burden-of-proof shell game.** The defender controls the cups (standards of justification: functional, then ineffable) and moves the pea (the actual burden) precisely when the reformer is about to reveal it under the first cup. The reformer is perpetually accused of looking under the wrong cup. The defender never has to show the pea is under *their* cup (positively justify the arrangement); they only need to keep moving it.

  **Conclusion:**

  "**Justificatory Escalation**" (or "**Burden Escalation**") accurately names the specific, deceptive tactic you describe: the strategic raising of the justificatory bar *and* a fundamental shift in the *type* of justification demanded (from functional to ineffable) precisely when the reformer satisfies the initial, seemingly reasonable demand. This distinguishes it from:
  *   **Honest Ineffability:** (Leads with it, doesn't demand functional reasons first).
  *   **Open Status Quo Preference:** (Openly owns the preference, doesn't hide behind shifting arguments).
  *   **Stonewalling:** (Blunt refusal, no simulated argumentative engagement).

  It captures the dynamic where the defender's position is presented as requiring no defense ("presuming nothing"), while the reformer is forever chasing an impossible standard, perpetually "in the wrong" not due to the merits of the case, but due to the rigged rules of the justificatory game.
