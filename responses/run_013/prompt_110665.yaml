answer: |-
  Here’s a rigorously pruned agenda, argued from the ground up. I’ll start with a raw brainstorm (12 questions), then cut aggressively based on your constraints, and finally rank the top 5–6 with explicit criteria. The "Type A/B" distinction is treated as a central driver—it forces reevaluation of foundational assumptions.

  **Brainstorm Dump: Open Questions in Vagueness (Raw)**
  1.  **Semantics for Type A/B Hybrids:** What formal system handles predicates with *both* convergence-ready and practice-dependent borderline cases?
  2.  **Normative Constraints on Precisification:** Can supervaluationism justify *why* some precisifications are "inadmissible" without smuggling in metaphysical facts (Type A) or sociological facts (Type B)?
  3.  **Metaphysical Ground of Type A:** If Type A borderlines have a sharp-but-unknowable boundary, what *makes* it sharp? (Language use? World? Both?)
  4.  **Dynamics of Type B Resolution:** How does a Type B borderline case *become* determinate? Is it semantic change or discovery?
  5.  **Logic of "Indeterminate":** Is "indeterminate" univocal across Type A and Type B? What logic governs mixed claims (e.g., "This is a Type B borderline case of a Type A vague predicate")?
  6.  **Higher-Order Vagueness Revisited:** Is higher-order vagueness primarily a Type B phenomenon? (Disagreement about *whether* a case is borderline feels practice-dependent).
  7.  **Psychological Basis of Categorization:** How do cognitive processes underlying vague predicates map onto Type A (access limitation) vs. Type B (lack of representation)?
  8.  **Context & Vagueness:** Does context-sensitivity primarily resolve Type A indeterminacy (providing access) or create Type B flexibility (shifting practices)?
  9.  **Vagueness in Law/Norms:** Are legal borderline cases typically Type A (hidden fact) or Type B (unsettled practice)? Implications for interpretation.
  10. **Truth-Gaps vs. Truth-Value Gluts:** Does Type A demand gappy logic (neither true nor false), while Type B might allow gluts (both true *and* false under different precisifications)?
  11. **Epistemicism’s Explanatory Burden:** Can epistemicism explain *why* we *cannot know* Type B boundaries? (Seems harder than explaining ignorance of Type A).
  12. **Compositionality Nightmare:** How does a hybrid Type A/B semantics compose? Does "tall mountain" inherit A/B status from "tall" and "mountain" predictably?

  **Pruning & Why:**
  *   **Cut #7 (Psychological Basis):** Requires empirical work (fMRI, categorization studies). Violates "no empirical work" constraint.
  *   **Cut #9 (Law/Norms):** Downstream application. Answer depends entirely on resolving core semantics/metaphysics first.
  *   **Cut #10 (Gaps vs. Gluts):** Technical debate that often distracts from the deeper metaphysical/linguistic questions your distinction raises. Answer doesn’t *force* progress on A/B.
  *   **Cut #12 (Compositionality):** Intractably complex for a single semester paper. Requires solving the core hybrid semantics *first*. More dissertation-sized.
  *   **Cut #6 (Higher-Order Vagueness):** A quagmire. Progress likely depends *on* clarifying Type A/B first. Starting here is putting the cart before the horse.
  *   **Cut #8 (Context):** Over-discussed and often superficial in the core vagueness literature. Doesn’t cleanly resolve the A/B distinction; context might interact with both types. Low upstream impact.
  *   **Cut #4 (Dynamics of Resolution):** Important, but slightly downstream. *How* B resolves depends on *what it is* (semantic fact? practice?) which is covered by #2 and #3.

  **Ranked Agenda: Top 5 Open Questions (Your Semester Focus)**

  1.  **What Formal Semantics Can Model Hybrid (Type A/B) Vague Predicates? (Upstream Impact: MAXIMAL)**
      *   **Why Upstream:** *Everything* depends on this. Until we have a formalism capturing predicates with *both* convergence-ready borderlines and practice-dependent borderlines, we can't rigorously test theories, evaluate logic, or even properly frame metaphysical questions about A/B. It forces confrontation: Does supervaluationism need radical revision? Can epistemicism accommodate Type B? Is a third framework needed?
      *   **Tractability:** High (with focus). Requires "decent logic": Build on supervaluationist frameworks (e.g., introducing "precisification stability" flags?) or epistemicist models with added indeterminacy layers. No need for *new* complex logic, just novel application/combination. Prototype a semantics for one paradigmatic hybrid predicate.
      *   **Neglected?** Hugely. Most formal work assumes a single model (epistemic, supervaluationist, fuzzy) for *all* vagueness. Explicitly hybrid models are rare.
      *   **Overrated Alternative:** Purely technical extensions of *existing* single-model semantics (e.g., elaborate fuzzy logics). They avoid the core conceptual split.

  2.  **What Normative Constraints Govern "Admissible Precisification," and Do They Differ for Type A vs. Type B? (Upstream Impact: HIGH)**
      *   **Why Upstream:** Directly challenges supervaluationism's core. If "admissibility" for Type A borderlines is about *tracking a hidden fact* (via usage patterns?), but for Type B it's about *coherence with evolving practice/purpose*, supervaluationism needs a bifurcated (or richer) normativity. This exposes whether supervaluationism can *genuinely* be non-epistemic or if it collapses into a form of epistemicism for Type A. Also impacts the logic (which precisifications count?).
      *   **Tractability:** Medium-High. Conceptual analysis + logical implications. Analyze paradigmatic Type A (e.g., "heap" under fixed grain size?) vs. Type B (e.g., "art" in a new medium) examples. What *rules out* a precisification? Factual error (A) vs. pragmatic incoherence (B)?
      *   **Neglected?** Yes. Normative foundations of supervaluationism are often assumed or gestured at ("meaning," "use," "purpose") without deep analysis relative to *different kinds* of borderlines.
      *   **Overrated Alternative:** Debating whether borderline cases exist. Settled; the A/B distinction presupposes them but asks *what kind*.

  3.  **Is "Indeterminate" Univocal? Developing the Logic of Mixed A/B Claims. (Upstream Impact: HIGH)**
      *   **Why Upstream:** Clarifies the *nature* of the distinction. If "indeterminate" means *epistemic limitation* (Type A) in one context and *genuine semantic underdetermination* (Type B) in another, our logic and metalanguage must reflect this. Can a single operator "∇P" (it's indeterminate whether P) suffice? Or do we need ∇ₐP and ∇ᵦP? Impacts truth conditions, negation, and higher-order claims ("It's indeterminate whether it's indeterminate...").
      *   **Tractability:** High. Formal logic project. Sketch a bimodal logic or an enriched supervaluationist semantics with dual indeterminacy operators. Test inference patterns.
      *   **Neglected?** Very. Logics of vagueness typically treat "indeterminate" as monolithic.
      *   **Overrated Alternative:** Refining the *probability* of borderline cases. Treats indeterminacy as scalar, obscuring the A/B categorical difference.

  4.  **What is the Metaphysical Ground of Type A Sharp Boundaries? (Upstream Impact: MEDIUM-HIGH)**
      *   **Why Upstream:** Forces epistemicism to confront its most vulnerable point. If Type A exists, *what* fixes the sharp boundary? Linguistic conventions *alone* (risking collapse into Type B)? Mind-independent properties? A hybrid? Answer determines if epistemicism is viable *only* for Type A, and if so, what justifies belief in Type A boundaries existing. Impacts the plausibility of Type A itself.
      *   **Tractability:** Medium. Conceptual/metaphysical analysis. Requires defending a coherent metaphysics (e.g., reference magnetism for natural properties? ideal convergence of rational inquiry?) for Type A boundaries. Argument-heavy, less formal.
      *   **Neglected?** Relatively. Epistemicists often *assume* boundaries exist due to bivalence/classical logic, dodging the "why" question. Deep dives into the ground are less common.
      *   **Overrated Alternative:** The "location problem" (where *is* the sharp boundary?). A red herring; the deeper issue is *what makes it there*, not finding it.

  5.  **Can Epistemicism Meaningfully Accommodate Type B Borderline Cases? (Upstream Impact: MEDIUM)**
      *   **Why Upstream:** Tests the limits of the major rival to supervaluationism. If epistemicism must reduce Type B to Type A (claiming there's *always* a hidden fact about how the community *would* decide, even before practice changes), is this plausible? Or does it force epistemicism into an untenable metaphysical stance (e.g., modal realism over linguistic practices)? Conversely, if epistemicism *denies* Type B exists, it must explain away the intuition that some borderlines are genuinely practice-dependent.
      *   **Tractability:** Medium. Conceptual analysis + argumentation. Analyze epistemicist responses to paradigm Type B cases. Does Williamson's "margin for error" apply? Or Sorensen's "blindspots"?
      *   **Neglected?** Yes. Epistemicists focus on defending sharp boundaries against sorites, rarely engaging deeply with the *sociolinguistic dynamism* inherent in Type B.
      *   **Overrated Alternative:** The sorites paradox itself. Important, but solutions are evaluated *within* epistemicist/supervaluationist/etc. frameworks. Your A/B distinction challenges the frameworks *themselves*.

  **What Would Change This Ranking?**
  1.  **A Breakthrough Hybrid Formal Model (Q1):** If a compelling formalism for A/B hybrids emerges (e.g., at a major conference), **Q2 (Normative Constraints)** immediately becomes the *most urgent*. The model would demand an explanation of *why* it works, forcing the normative question.
  2.  **Strong Empirical Evidence for Ubiquitous Type A or Type B:** If psychology/corpus linguistics shows one type dominates natural language, **Q4 (Metaphysical Ground of A)** or **Q5 (Epistemicism & B)** shoots to #1, and **Q1 (Hybrid Semantics)** loses priority.
  3.  **A Killer Argument Against Type A or Type B:** If someone convincingly argues Type B is just messy Type A (or vice versa), the entire agenda pivots. **Q3 (Univocality of Indeterminate)** becomes critical to salvage or refute the distinction, and **Q1** needs revision.

  **Execution Strategy for Your Semester:**
  1.  **Weeks 1-2:** Deep dive into **Q1 (Hybrid Semantics)**. Prototype a simple model (e.g., modify supervaluationism: a precisification is "A-stable" if competent speakers *would* converge on it under idealization, "B-flexible" otherwise). Find a test case predicate ("game," "religion"?).
  2.  **Weeks 3-5:** Confront **Q2 (Normative Constraints)** head-on. Why are some precisifications inadmissible for your hybrid model? Does your model *require* different norms for A-stable vs. B-flexible precisifications? This will feed back into refining Q1.
  3.  **Weeks 6-8:** Tackle **Q3 (Logic of Indeterminate)**. Formalize "indeterminate" in your hybrid model. Can you use one operator? Do you need two? What happens to "∇∇P"?
  4.  **Weeks 9-12:** Synthesize. Focus paper on **Q1 & Q2**: Present your hybrid semantics model and argue for its necessary normative foundations, explicitly contrasting Type A and Type B admissibility constraints. Use Q3 results to clarify the logic. Briefly gesture to Q4/Q5 as implications. **Result:** A paper arguing that standard views fail because they lack the resources to model *and normatively ground* the hybrid nature of vague predicates.

  This agenda leverages your A/B insight as an engine, focuses on tractable but foundational formal/conceptual work with high upstream impact, and targets neglected questions where a single philosopher with logic skills can make genuine headway. Good luck – this is where the interesting work is.
