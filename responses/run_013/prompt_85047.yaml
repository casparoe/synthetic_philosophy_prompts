prompt: |-
  Hey — I'm a third-year student taking a decision theory module and I'm stuck on something I came up with while messing around with coin games, and I'd like to actually understand it rather than just be handed a label.

  Put yourself in the shoes of someone who works on decision theory and infinite games, think this through carefully, and feel free to brainstorm a few candidate concepts first before you commit to which one fits.

  Here's the thing. I invented a game: you flip a fair coin until the first heads. If heads comes up on flip n you get 2^n/n, but with the sign alternating — odd n you win (win 2, win 8/3, win 32/5, ...) and even n you lose (lose 2, lose 4, ...). When I worked out the long-run average I got a sum whose terms shrink to zero, but whose positive part and negative part each add up to infinity, which means I can arrange the terms to get any total I like, positive or negative, or make it blow up entirely. My TA said that just means the game has no expected value and moved on, which feels like a dodge: in an actual play the outcomes arrive in a fixed order, so is it even legitimate to reorder them like that? And it's odd that a game I've got no particular reason to refuse to play is one that decision theory apparently can't rank against a sure $1.

  Is there a name for this? I know the St. Petersburg game (payout doubles, average is infinite) and mine doesn't feel like that, since that one at least gives you an answer, just an uncomfortable one. So: does what I'm describing have an established name, and what's its nearest neighbour? Don't just give me the label — I want to know exactly what the phenomenon is, what it isn't, how it differs from the St. Petersburg kind of case, and where the edges are (does it matter how fast the payouts grow? what if I made them grow faster or slower?). And tell me straight whether the "outcomes come in a fixed order" objection is a real reply or just me being confused.

  Format: lead with your bottom line in the first sentence — say whether it has a name, and what you'd call it if not — then give the reasoning after. No preamble, and dont restate my question.
reasoning: |-
  We are dealing with a game that has alternating payouts: for odd n (win) and even n (loss). The payout when heads first appears on flip n is (-1)^{n+1} * (2^n / n). Specifically:
  - For n=1 (odd): win 2^1/1 = 2
  - For n=2 (even): lose 2^2/2 = 4/2 = 2
  - For n=3 (odd): win 2^3/3 ≈ 8/3 ≈ 2.666...
  - For n=4 (even): lose 2^4/4 = 16/4 = 4
  - and so on.

  The probability of the game ending at flip n is (1/2)^n (since n-1 tails and then a heads). So the expected value is the sum over n=1 to infinity of (1/2)^n * (-1)^{n+1} * (2^n / n).

  Simplify the term: (1/2)^n * 2^n = 1, so the expected value is the sum of (-1)^{n+1} / n.

  But note: (-1)^{n+1} / n is the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + ... which converges to ln(2) (about 0.693).

  Wait, that seems to contradict your initial statement? Let me check:

  You said: "when I worked out the long-run average I got a sum whose terms shrink to zero, but whose positive part and negative part each add up to infinity". But if we break the series into positive and negative parts:

  Positive terms: n odd: 1/n (for n=1,3,5,...) -> 1, 1/3, 1/5, ... which is the harmonic series of odd terms. The harmonic series (all positive terms) diverges, so the sum of 1/(2k-1) for k=1 to infinity diverges.

  Negative terms: n even: -1/n (for n=2,4,6,...) -> -1/2, -1/4, -1/6, ... which is -1/2 times the harmonic series of the even terms (which also diverges).

  So indeed, the positive part (sum of 1/(2k-1)) and the negative part (sum of -1/(2k)) both diverge (to +infinity and -infinity respectively). However, the alternating series 1 - 1/2 + 1/3 - 1/4 + ... converges conditionally to ln(2). This is a classic example of a conditionally convergent series.

  But conditional convergence is the key: the series converges only because of the alternating signs. If we rearrange the terms, we can make the series converge to any real number, or diverge to ±∞, or oscillate. This is the Riemann series theorem (or rearrangement theorem).

  So the problem is that the expected value is conditionally convergent. This is different from the St. Petersburg paradox, which has an expected value that diverges to +∞ (unconditionally). In St. Petersburg, the payout for n heads in a row is 2^n (with probability 1/2^n) and the series sum (2^n * (1/2^n)) = sum(1) from n=1 to infinity, which is divergent to infinity (and unconditionally so because all terms are positive).

  Now, to your point: in an actual play, the outcomes are in a fixed order? Actually, the game is defined so that we flip until the first heads. The payouts occur in the order of the flip index n (i.e., the natural order: n=1,2,3,...). So the series we are summing is in the natural order. Therefore, the expected value is the sum in the natural order: the alternating harmonic series, which converges to ln(2) ≈ 0.693.

  Why then did you initially think you could rearrange to get any total? Because the series is conditionally convergent, so if we were allowed to rearrange the order of the terms (i.e., change the order of the outcomes arbitrarily) then we could get any sum. But in the game, the outcomes are fixed in the natural order (by the flip sequence). Therefore, the expected value is well-defined and equals ln(2).

  So the TA's comment that the game has no expected value is not correct if we interpret the expectation as the natural order. The expectation exists and is ln(2). However, if we consider rearrangements (which would correspond to changing the game, for instance by having a different stopping rule that reorders the outcomes arbitrarily), then we could get different values. But in the standard setup, the order is fixed.

  But note: the problem you might be facing is that the conditional convergence implies that the expectation is not absolutely convergent (i.e., the absolute series sum |a_n| = sum 1/n diverges). This means that the expected absolute payout is infinite, which can lead to some pathological behavior in decision theory. For example, if we consider risk, the game has infinite variance? Actually, the variance is also infinite because the second moment would be the sum of (1/n)^2 * (1/2)^(-n)? Wait, let me compute the absolute expectation:

  The absolute value of the payout is 2^n / n, and the probability of payout at n is (1/2)^n, so the expected absolute payout is sum_{n=1}^infty (2^n / n) * (1/2)^n = sum_{n=1}^infty 1/n, which is the harmonic series and diverges. So the expected absolute payout is infinite. This is a key point: the expectation exists (is finite) but the expected absolute value is infinite. This is a hallmark of conditional convergence.

  So to summarize:

  - The expected value (in the natural order) is ln(2) ≈ 0.693.
  - However, because the series is not absolutely convergent (the expected absolute value is infinite), the expectation is fragile: small changes in the way we compute the expectation (like a rearrangement) can change the value.

  But in the context of the game as described (with the natural order of outcomes), we have a well-defined expectation.

  Now, to your questions:

  1. Does it have a name? We might call it a "conditionally convergent expected value" or an expectation that is conditionally convergent. The phenomenon is related to the Riemann rearrangement theorem.

  2. How it differs from St. Petersburg? In St. Petersburg, the expectation is unconditionally divergent to +∞. In your game, the expectation is conditionally convergent to a finite number.

  3. The "fixed order" objection: Yes, it matters. In the natural order, we have a fixed expectation. The rearrangement is only a mathematical artifact and does not correspond to the actual game. So the answer is that the game does have an expected value of ln(2).

  4. What if we change the payout? The key is the absolute convergence. If the series of absolute payouts (each multiplied by its probability) converges, then the expectation is absolutely convergent and rearrangement is not an issue. If it diverges but the signed series converges (as in this case), then we have conditional convergence and rearrangement matters. The growth rate matters: if the payout grows slower than 2^n (say, 2^{n/2}) then the absolute expectation might converge. For example, if the payout were 2^{n/2}/n, then the absolute expectation would be sum (2^{n/2}/n) * (1/2)^n = sum (1/2^{n/2}) / n. Since 1/2^{n/2} = (1/sqrt(2))^n, and the series of (r^n)/n for |r|<1 converges (by the ratio test), so the absolute expectation would converge. Then the expectation would be absolutely convergent and rearrangement would be safe.

  In your case, the payout is 2^n/n, so the absolute expectation is the harmonic series (divergent). Hence the conditional convergence.

  Bottom line: The game has a well-defined expected value of ln(2) in the natural order, but it is conditionally convergent and therefore sensitive to rearrangements. The phenomenon is called conditional convergence of the expected value.

  So the TA was incorrect: the game does have an expected value. However, the fact that the expected absolute value is infinite is a source of concern because it means that the expectation is not robust to certain changes (like rearrangements, or in more complex decision problems, risk aversion). But for the basic game, we can compute the expectation.

  Therefore, the name for this phenomenon is "conditional convergence of the expected value" or "conditionally convergent expectation". Its nearest neighbor is the alternating harmonic series.

  Final note: The Riemann rearrangement theorem tells us that if we were to change the order of the terms arbitrarily (which does not correspond to the physical game) we could get any value. But in the physical game, the order is fixed by the flip sequence. So the expectation is ln(2).

  But what about the long-run average? You mentioned the long-run average. The expected value is a theoretical average per game. The long-run average of many independent plays would converge to ln(2) by the law of large numbers? However, note that the law of large numbers requires the expectation to exist and be finite (which it is) and also that the variance is finite? Actually, the strong law of large numbers for independent random variables with finite expectation holds. But note: the variance of this game is infinite? Let's check:

  The variance is E[X^2] - (E[X])^2. We know E[X] = ln(2). Now E[X^2] = sum_{n=1}^infty ( (2^n/n) )^2 * (1/2)^n = sum_{n=1}^infty (2^{2n} / n^2) * (1/2)^n = sum_{n=1}^infty 2^{n} / n^2.

  But 2^n / n^2 grows without bound and the series diverges (since 2^n grows faster than any polynomial). Therefore, the variance is infinite. The strong law of large numbers still holds for independent, identically distributed random variables with finite expectation (even if the variance is infinite) by the law of large numbers (Kolmogorov's strong law). Therefore, the long-run average will converge to ln(2) almost surely.

  So the game is well-defined and has a finite expectation, though with infinite variance.

  In summary:

  - The game has a name: it's a conditionally convergent expected value.
  - The fixed order matters: in the natural order, the expectation is ln(2).
  - The St. Petersburg game has unconditional divergence (to +∞), but this game has conditional convergence (to a finite number).
  - The growth rate matters: if the payout were slower (e.g., exponential with base less than 2) then the absolute expectation might converge and we would have absolute convergence.

  Therefore, your TA might have been thinking of the rearrangement issue and concluded that the expectation doesn't exist, but in the context of the game as defined, it does.

  Bottom-line first: The phenomenon is called conditionally convergent expectation, and the game has a well-defined expected value of ln(2) in the natural order.

  Now, write the answer accordingly.
answer: |-
  Conditionally convergent expected value is the name for this phenomenon, and your game has a well-defined expectation of $\ln(2) \approx 0.693$ when outcomes follow the natural order (n=1,2,3,...).  

  The payout sequence is $(-1)^{n+1} \frac{2^n}{n}$, with probability $\left(\frac{1}{2}\right)^n$ for heads first appearing on flip $n$. The expected value is $\sum_{n=1}^\infty \left(\frac{1}{2}\right)^n (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^\infty (-1)^{n+1} \frac{1}{n}$. This is the alternating harmonic series, which converges to $\ln(2)$. The positive terms ($n$ odd) sum to $+\infty$ and the negative terms ($n$ even) sum to $-\infty$ individually, but their alternating arrangement in the natural order yields a finite value due to cancellation.  

  This conditional convergence (convergent but not absolutely convergent) arises because the absolute series $\sum_{n=1}^\infty \frac{1}{n}$ diverges. Riemann’s rearrangement theorem states that rearranging terms can produce any real limit or cause divergence, but this is irrelevant here. In your game, outcomes occur in fixed order by flip sequence: n increases sequentially until heads appears. Physical play enforces this order, so expectation is $\ln(2)$. The "fixed order" objection is valid—rearrangement is a mathematical artifact, not a property of the game.  

  Contrast with St. Petersburg:  
  - St. Petersburg has payout $2^n$ (all positive) and expectation $\sum_{n=1}^\infty \left(\frac{1}{2}\right)^n 2^n = \sum_{n=1}^\infty 1$, which diverges unconditionally to $+\infty$.  
  - Your game has alternating payouts and conditionally convergent expectation ($\ln(2)$), making it strictly different: finite expectation under natural order vs. infinite expectation.  

  Growth rate and convergence:  
  - If payout grows slower (e.g., $\frac{c^n}{n}$ with $c < 2$), the absolute series $\sum \frac{c^n}{n}$ converges (absolutely convergent expectation). Rearrangement immunity holds.  
  - If payout grows faster (e.g., $\frac{d^n}{n}$ with $d > 2$), the signed series $\sum (-1)^{n+1} \frac{d^n}{n}$ diverges (no finite expectation).  
  - Your case ($d=2$) is the boundary: conditional convergence occurs.  

  Decision-theoretic implications:  
  - The game has finite expectation ($\ln(2)$) but infinite expected absolute value and infinite variance.  
  - It can be ranked: prefer over $0.69$ sure gain, avoid over $0.70$.  
  - St. Petersburg cannot be ranked against finite gains (infinite expectation dominates all).  

  In actual play, the law of large numbers applies: average payoff over many independent games converges to $\ln(2)$ almost surely (despite infinite variance). The TA’s claim of "no expected value" overlooks the natural order enforcement. Conditional convergence explains the sensitivity to order, but the game itself fixes the order.
