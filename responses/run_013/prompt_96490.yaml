  Okay, the user is a postdoc in cognitive science, tasked with leading a lab meeting on epiphenomenalism, specifically the puzzle of phenomenal judgment. They need a teaching plan tailored for an audience of psychologists and neuroscientists. Let me break down their requirements.

  First, they want a structured plan with clear dependencies. The audience knows psychology and neuroscience but lacks recent philosophy background. So, the sequence must build concepts step-by-step, avoiding jargon. Key elements: explaining epiphenomenalism, the reliability of reports, the aboutness issue, and the dilemma of beliefs being epiphenomenal. Also, addressing common misconceptions in the order they might arise.

  The user mentioned using examples like steam-whistle or speedometer but suspects they won't work. I need to analyze why. Steam-whistle implies causation (steam causes whistle, unlike epiphenomenal qualia). Speedometer shows correlation but misses the aboutness problem—it's designed to represent speed, whereas phenomenal judgments aren't designed to represent brain states. A better example is needed, perhaps one where two effects correlate but one isn't about the other.

  Common misconceptions: conflating the issue with the hard problem, thinking reports obviously refute epiphenomenalism, or dismissing it as a non-issue. These need preemptive addressing at specific points. For instance, when introducing the correlation, clarify that reliability doesn't imply causation.

  The user wants to end with the dilemma: either experience doesn't cause the belief, or the belief is epiphenomenal. Also, the correlation due to common cause explains reliability but not aboutness. The deeper point about why we feel there's a mystery should emerge naturally from the discussion.

  Structuring the session: start with the hard problem to connect to their background, then introduce epiphenomenalism. Use a thought experiment to show how reliability can exist without causation. Highlight the aboutness problem. Present the dilemma. Address misconceptions as they arise. End with a question testing their grasp of the structure, like why reliability doesn't resolve the issue.

  Time management is crucial. Avoid tangents like other theories or complex philosophy. Explicitly state omissions to keep focus. The carrying example must avoid implying causation or intentional design. The smoke/fire analogy might work, but it lacks the aboutness element. Need an example where correlation exists without one event being about the other, like shadows and tree height. But shadows aren't "about" height; they just correlate. That illustrates the point: beliefs correlate with experiences but aren't inherently about them.

  Finally, the end question should check if they understand that reliability is explained by correlation, but aboutness remains a puzzle. Emphasize that their intuition of a mystery stems from conflating correlation with intentionality.
answer: |-
  Here’s a battle-tested teaching plan optimized for your audience and time constraints. The structure preempts misconceptions by building dependencies logically, and the carrying example is designed to avoid common pitfalls.

  **Core Arc:**  
  Hard Problem → Epiphenomenalism → Reliability Puzzle → Aboutness Puzzle → The Dilemma → Why This Feels Mysterious  

  ---

  ### **Teaching Plan (75 mins)**  
  **Total Time:** 10 min setup, 50 min content, 15 min discussion  

  #### **1. Grounding in the Hard Problem (10 mins)**  
  - *Why start here?* Your audience knows this. It’s the bridge to philosophy.  
  - Recap: "Hard Problem = why subjective experience arises from physical processes, not just *how* functions are computed."  
  - *Key point:* "Even if we solve the neural correlates of consciousness (NCC), that doesn’t explain *why* NCCs feel like anything."  
  - *Preempts misconception:* Clarifies epiphenomenalism isn’t just rehashing the Hard Problem—it’s a *response* to it.  

  #### **2. Introduce Epiphenomenalism (5 mins)**  
  - "One radical solution: Qualia are byproducts. They’re real but causally inert—like exhaust fumes don’t power the engine."  
  - Emphasize: *"Experiences don’t affect the physical world, including your brain states producing speech or decisions."*  
  - *Dependency:* Hard Problem must be clear first. Otherwise, they’ll ask, "Why posit this?"  

  #### **3. The Reliability Puzzle: Thought Experiment (15 mins)**  
  - **The Carrying Example (NEW): "The Shadow Indicator"**  
    *Imagine a device attached to a tree. As the tree grows taller:  
    (a) It casts a longer shadow (epiphenomenal side effect).  
    (b) A sensor on the device reliably displays "HEIGHT: X meters."  
    The sensor is causally sensitive ONLY to the tree’s internal growth processes (trunk fibers, cell division), NOT to the shadow. The shadow and display are perfectly correlated—but the shadow does nothing. The display is *about* the tree’s physical state, not the shadow.*  
  - **Why this works (and steam/speedometer fail):**  
    - Steam whistle: Implies causation (steam → sound).  
    - Speedometer: Its readings *are about* speed by design.  
    - **Shadow’s advantages:**  
      - Clearly epiphenomenal (shadow doesn’t cause sensor state).  
      - Shows correlation without causation.  
      - Sensor is *about* the physical cause (tree growth), not the shadow.  
      - Avoids "design" implications (unlike speedometer).  

  - **Puzzle Setup:**  
    "In humans: Pain NCC → (1) Pain experience (qualia), (2) Verbal report 'I’m in pain.'  
    If (1) is epiphenomenal, why is (2) so reliable? And why do we think (2) is *about* (1)?"  

  #### **4. Dissolving Reliability (10 mins)**  
  - *Explanation:* "Reliability is no mystery! Reports and experiences share a common cause (NCC). Like shadow length and display output."  
  - *Preempts misconception:* "This is where people say epiphenomenalism is obviously false—'But I report based on my experience!' No: NCC causes *both*. Reliability ≠ causation."  
  - *Dependency:* Must have the common-cause model clear first. Otherwise, they’ll jump to refutation.  

  #### **5. The Aboutness Puzzle (10 mins)**  
  - **The Crucial Turn:** "Reliability is solved—but now the *aboutness* problem bites.  
    In the tree example, the display is *about* tree growth, not the shadow. But when I say 'I feel pain,' I take myself to be referring to my *experience*, not NCC #273. How? If the experience does nothing, what grounds the report’s intentionality?"  
  - *Key insight:* "Correlation doesn’t bestow aboutness. Brain states lack intrinsic 'meaning' of qualia."  
  - *Preempts misconception:* "This isn’t solved by 'we just learn the association.' Association presumes prior aboutness!"  

  #### **6. The Dilemma & Why It Feels Mysterious (5 mins)**  
  - **Present the Dilemma:**  
    > "Option 1: Experience *causes* belief → epiphenomenalism false.  
    > Option 2: Belief is *also* epiphenomenal → but then nothing is *about* anything (collapse into eliminativism)."  
  - **The Deep Puzzle:** "We’re tempted to think Option 1 *must* be true because our judgments *feel* directly caused by experience. But that intuition itself is produced by... NCCs! The mystery arises because we’re *in* the system."  
  - *Dependency:* Aboutness puzzle must precede this. It’s the payoff.  

  ---

  ### **Where to Preempt Misconceptions**  
  - **"This is just the Hard Problem!"** → Shut down at Step 1 by distinguishing *problem* (Hard Problem) from *solution* (epiphenomenalism).  
  - **"Reports obviously refute it!"** → Crush at Step 4 (common cause explains reliability).  
  - **"But introspection!"** → Neutralize at Step 5: "Introspective reports are NCC-driven; the 'feeling' of direct access is part of the data to explain."  

  ---

  ### **Ending Question to Test Understanding**  
  > **"Why doesn’t the reliability of pain reports rule out epiphenomenalism, and why does that leave us with a deeper puzzle about intentionality?"**  
  - *Tests grasp of:*  
    (a) Common cause (reliability ≠ causation)  
    (b) The aboutness gap (correlation ≠ content)  

  ---

  ### **What to Explicitly Omit**  
  - **Say this upfront:** "We’re bracketing:  
    1. Alternatives to epiphenomenalism (illusionism, panpsychism).  
    2. Quantum mechanics/overdetermination.  
    3. Historical debates (Huxley vs. James).  
    Why? To isolate *this* puzzle. You can’t refute what you haven’t fully understood."  

  ---

  ### **Why This Arc Works**  
  - **Flow:** Each step solves the previous puzzle but creates a deeper one (Hard Problem → reliability → aboutness → meta-mystery).  
  - **Empirical hook:** Starts with their terrain (NCCs), ends with a challenge to their assumptions about introspection.  
  - **Pacing:** Tight timing, but doable if you strictly police tangents. Use the shadow example as an anchor—return to it at each step.  

  **Final tip:** When they try to "solve" it in Q&A, ask: "Does that address the aboutness puzzle or just reliability?" Keep them pinned to the structure.
