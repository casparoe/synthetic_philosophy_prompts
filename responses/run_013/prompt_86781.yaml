prompt: |-
  I've been reading around the boundary problem in democratic theory — the question of who belongs to the demos — for a couple of years now, and I've come to think of it as one of those debates in which every move is public, everyone has heard the replies, and yet the camps never move. I'd like you to diagnose the impasse rather than adjudicate it.

  Here is how the two sides look from where I sit. On one side are those who treat the boundary problem as a genuine and possibly intractable paradox. Any decision about who is to be included in the demos must be made by some demos; if the demos is already bounded, the decision merely ratifies an arbitrary prior exclusion, and if it is not yet bounded, there is no body with the standing to make the decision. On this view every boundary is either undemocratic at its origin or circular, and no procedure can bootstrap a people into existence legitimately. On the other side are those who think the paradox is a pseudo-problem: it rests, they say, on a picture of a demos as a pre-political set of persons who then adopt a rule, whereas in fact a demos is constituted and reconstituted through ongoing practices of claim-making, contestation and mutual recognition, so the real question is never how the first boundary was licensed but how present boundaries are contested and revised. A third group proposes criteria — all whose interests are affected, or all who are subject to the body's coercive authority — and is met with the objection that any such criterion already presupposes the very boundary it was meant to fix.

  My hypothesis, offered as a hypothesis, is that the two main camps are not disagreeing about democracy's procedure at all but about the metaphysics of political collectives: whether there is any pre-institutional people for a boundary to be true or false of. I also suspect that much of the standoff turns on an ambiguity between a temporal reading of the circularity (which came first, the demos or the decision rule?) and a normative reading of it (what could give a demos the authority to bind?), and that some participants are covertly committed to a pre-political people while denying it.

  What I want from you is a diagnosis, not a survey. Is this a substantive disagreement, a verbal one, two camps answering different questions under a single heading, or a sign that the question is ill-posed? If a hidden empirical or formal question is doing the work, say which. Test your diagnosis against hard cases in which there is no inherited demos to appeal to — a secession, a charter for a newly founded city, an authority governing a shared river basin or the atmosphere — and tell me whether the camps' positions actually diverge there or merely re-describe the same facts in different vocabularies. Then say what, if anything, would count as progress given your diagnosis: a distinction, a formal result, a change of question, or an argument that none should be expected.

  Work as a political philosopher at home in democratic theory and in the methodology of philosophical disagreement. Think carefully before committing; begin by restating each position in your own words so that I can see you have the debate in view, then diagnose. Keep the prose clean and the reasoning explicit, and flag where your own diagnosis is contestable. End with a single final line of the form \answer{...} containing a label for the kind of disagreement and a short phrase naming what would count as progress.
reasoning: |-
  Okay, let me work through this user's query systematically. The user presents a sophisticated analysis of the boundary problem in democratic theory and requests a diagnostic approach rather than a survey or adjudication. They've clearly engaged deeply with the literature and identified what they perceive as a persistent impasse between three positions: the paradox camp, the constitutive practices camp, and the criteria-based camp. Their hypothesis suggests the core disagreement may be metaphysical - about whether a pre-political people exists - and that ambiguity between temporal and normative circularity sustains the standoff.

  Hmm, the user's framing is remarkably precise. They want me to avoid rehashing arguments and instead diagnose why this debate seems stuck. The challenge lies in untangling whether this is substantive, verbal, or conceptual while testing against hard cases like secessions or new foundations. I notice they're particularly interested in whether positions diverge in practice or just semantically when no inherited demos exists.

  First, I need to restate the positions accurately. The paradox view sees an inescapable circularity: any boundary-setting requires a prior demos, creating either arbitrariness or infinite regress. The constitutive view rejects this as a category error, arguing demoi emerge through political action, not philosophical fiat. The criteria camp tries to solve it with principles like affected interests but gets accused of presupposing boundaries. 

  The user's metaphysical hypothesis resonates - this does feel like a foundational disagreement about political ontology. But I suspect there's more: the temporal/normative ambiguity they mention might explain why theorists talk past each other. When a paradox theorist says "no one had standing to decide," they often mean normatively, while constitutive theorists hear it temporally and point to historical emergence.

  Testing against hard cases is crucial. In secession scenarios, paradox theorists see impossible legitimacy gaps ("who authorized the secessionists?"), while constitutive theorists point to mobilization creating new political facts ("recognition followed claim-making"). Yet both descriptions capture aspects of reality - suggesting the camps emphasize different moments in a process rather than contradictory truths.

  For progress, mere conceptual clarification won't suffice since the divide reflects deeper commitments about what makes collectives legitimate. But we might reframe the question away from origins toward ongoing contestation. Or adopt a methodological shift where normative ideals inform practice rather than demanding logical purity. 

  Ultimately the disagreement is substantive but not irreconcilable - it's about what counts as resolving the problem. Progress would involve acknowledging both the ideal of non-arbitrariness and the reality of political constitution, perhaps through what I'll call "democratic realism."
answer: |-
  ### Restatement of Positions  
  **Paradox Camp**: The boundary problem presents an irresolvable circularity: any decision about the demos must be made *by* a demos. If the demos is pre-bounded, its boundary is arbitrary; if unbounded, no legitimate decision-maker exists. Thus, all democratic foundations are either undemocratic or viciously circular (e.g., Whelan, Abizadeh).  
  **Constitutive Camp**: The paradox misconstrues democracy as requiring a pre-political "people." Instead, the demos emerges iteratively through political practices—claim-making, contestation, and recognition (e.g., Habermas, Honig). Boundary-setting is ongoing, not a one-time logical puzzle.  
  **Criteria Camp**: Proposes objective standards (e.g., "all affected" or "all subjected") to define membership but faces charges of question-begging: criteria presuppose a prior authority to define "affected" or "subjected" (e.g., Goodin’s "all affected" principle critiqued by Arrhenius).  

  ### Diagnosis: The Nature of the Impasse  
  Your hypothesis is largely correct. The deadlock stems from **divergent metaphysical commitments** about political collectives and **conflated dimensions of circularity**:  
  1. **Metaphysical Disagreement**:  
     - *Paradox Camp* assumes a *pre-institutional demos* must exist for legitimacy. Democracy requires a "people" antecedent to rules.  
     - *Constitutive Camp* adopts a *pragmatist ontology*: the demos is perpetually (re)made through action; no pre-political entity is needed.  
     This is a **substantive disagreement**—not procedural—about whether legitimacy requires temporal priority or emerges immanently.  

  2. **Ambiguity in Circularity**:  
     - *Temporal Circularity*: "Which comes first, the demos or the rule?" (Paradox Camp’s focus).  
     - *Normative Circularity*: "What grants authority to bind?" (Constitutive Camp’s implicit reply: practice, not origins).  
     The camps talk past each other because one sees a logical flaw, the other a mislocated idealism.  

  3. **Hidden Commitments**:  
     Paradox theorists covertly rely on a pre-political people while denying its possibility—a performative contradiction. Constitutive theorists evade normative justification for *initial* acts of boundary-drawing, risking descriptivism.  

  ### Testing Against Hard Cases  
  **Case 1: Secession (e.g., Catalonia)**  
  - **Paradox View**: Secessionists lack prior authorization; the boundary is arbitrary.  
  - **Constitutive View**: Mass mobilization *creates* a demos via collective action; recognition follows.  
  - **Divergence**: Substantive. The Paradox Camp sees illegitimacy; the Constitutive Camp sees legitimacy-in-formation. Vocabulary reflects divergent metaphysics: "arbitrary" vs. "emergent."  

  **Case 2: New City Charter (e.g., Neom)**  
  - **Paradox View**: Founders act without mandate; the charter’s authority is circular.  
  - **Constitutive View**: Early residents’ participation and mutual recognition bootstrap the demos.  
  - **Divergence**: Normative, not empirical. Both agree on facts (e.g., founders drafted rules), but differ on whether this *can* be legitimate without prior authorization.  

  **Case 3: Global Climate Governance**  
  - **Criteria Camp**: "All affected" by climate change should be included.  
  - **Paradox Reply**: Who defines "affected"? This presupposes a boundary (e.g., "humanity").  
  - **Constitutive Reply**: Affectedness is revealed through contestation (e.g., climate lawsuits).  
  - **Divergence**: The Criteria and Constitutive camps functionally converge in practice (contestation refines "affected"), but Criteria Camp’s formalism invites Paradox objections.  

  ### What Counts as Progress?  
  1. **Clarify the Question**: Distinguish *temporal* vs. *normative* circularity explicitly. Ask not "How *did* the demos form?" but "What *validates* its authority?"  
  2. **Embrace Democratic Realism**: Acknowledge that all boundaries originate in contingency (force, history) but gain legitimacy retrospectively through inclusive practice.  
  3. **Shift to Dynamic Models**: Focus on mechanisms for *revision* (e.g., pathways for inclusion in river-basin governance) rather than originary moments.  
  4. **Formal/Conceptual Aid**: Prove that no consistent *procedural* solution exists (a la Arrow’s Theorem), redirecting energy to substantive inclusion.  

  **Contestable Elements of this Diagnosis**:  
  - I frame the Constitutive Camp as having a "pragmatist ontology," but some may argue they reject ontology entirely.  
  - The Paradox Camp’s "covert commitment" to a pre-political people is interpretive; they may deny this.  
  - Hard cases may not fully expose divergence; in practice, many theorists blend positions.  

  ### Conclusion  
  The impasse is **substantive and metaphysical**, rooted in irreconcilable intuitions about political ontology. Progress lies in **abandoning the search for an originary democratic moment** and focusing on the conditions for legitimate *renegotiation* of boundaries.  

  \answer{Substantive metaphysical disagreement; progress via shift to boundary-revision mechanisms}
