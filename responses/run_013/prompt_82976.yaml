  Names matter - "Leo" sounds everyman, "Dr. Finch" clinical. The machine names should sound plausibly medical: "Conception Replayer" with gamete swap modes (OVS/SVS/DVS). Dark humor opportunities: the waiver about "existential distress" and the tech complaining about gamete quality. 

  Crucially, the ending must refuse answers. Leo's panic attack when seeing his "total stranger" double (DVS mode) mirrors the user's unresolved frustration. Having Maya voice both perspectives ("You're still you" vs "Who is that?") keeps the tension alive. The final line about the "ghost of a boy who never was" leaves the question hauntingly open - just as the user requested.
answer: |-
  The air in the New Dawn Fertility Centre hummed with sterile efficiency and faint ozone. Leo tapped his foot, rereading the waiver for the third time. Clause 7b was particularly cheery: *'The New Dawn Fertility Centre accepts no liability for existential distress, identity confusion, or relationship dissolution resulting from Conception Replay Visualization (CRV) procedures.'*

  "Signing your life away, Mr. Vance?" chirped Dr. Finch, materializing with a tablet. Her smile was as crisp as her lab coat.

  "Just my sense of self, apparently," Leo muttered, scrawling his signature. "This is ridiculous. Maya and I just need the certificate for the Unified Marriage Act. Prove I'm the product of Robert and Evelyn Vance's specific... biological contribution. For the inheritance clause." His parents' estate required proof of direct genetic lineage. Paperwork wasn't enough anymore; the law demanded Origin Verification.

  "Standard procedure since the CRV-5 rollout," Dr. Finch said breezily. "Think of it as a highly specific paternity test with existential side effects. We just need to confirm your registered origin point. The machine will replay your conception, using your parents' archived gamete samples. If the visualized result matches your biometrics and registered origin ID... bingo. Certificate issued."

  "And if it doesn't?"

  "Then we have a different conversation, potentially involving lawyers and repressed memories." She gestured down the hall. "This way."

  The CRV chamber looked like a high-tech tanning bed crossed with an MRI scanner. A large, slightly opaque screen dominated one wall.

  "The CRV doesn't *change* anything, Mr. Vance," explained Kenji, the technician, as Leo lay down. Cool gel pads adhered to his temples. "It calculates and visualizes the phenotypic and neurological outcome – the 'you' – that would have developed from different gamete combinations, using your parents' archived samples and your own full genomic/epigenetic map as the template. Think of it as running alternate simulations based on different starting points, but constrained by the 'you' pattern."

  "Right. So, the machine shows... me. But from different sperm or eggs."

  "Exactly! We have three modes," Kenji said, tapping his console. "OVS: Ovum Swap. We keep the registered sperm, swap the registered egg for another archived one from your mother. SVS: Sperm Swap. Keep the egg, swap the sperm. And DVS: Dual Swap. Both gametes replaced. That one’s more... abstract. Takes longer, costs triple." He grinned. "We start with SVS today, as per your registration. Quickest path to verification."

  Leo swallowed. His mate Dave's voice echoed in his head: *"You *are* that specific spark, Leo. Your exact atoms, arranged that exact way, only happened once. Changing the spark changes the fire, even if it looks similar."* But Leo had argued: *"If the fire is identical in every way – heat, light, shape, fuel consumed – what difference does the spark make? It's the fire that matters."*

  The machine whirred. The screen flickered, then resolved into an image. Leo gasped.

  It was him. Undeniably him. Mid-30s, same slightly crooked nose from a childhood bike accident, same faint scar above his left eyebrow, same way his hair refused to lie flat at the crown. He was wearing different clothes – generic grey scrubs – but the *essence* was Leo Vance. He blinked, looked around the virtual space projected on the screen with an expression of mild curiosity identical to Leo's own.

  "Huh," Kenji said, sounding surprised. "Biometric match is... 99.998%. Neurological signature overlap is well within the 'Identical Continuity' threshold. That's unusually high for an SVS. Usually, we see minor variations – hair color, facial structure quirks. This is... remarkably stable." He frowned at the console. "According to this, this *is* you, Mr. Vance. But... it's not originating from your registered sperm ID."

  Leo's heart thudded. "What? That can't be. It looks exactly like me!"

  "It *is* you, phenotypically and neurologically," Kenji corrected. "But the sperm sample used in this visualization isn't the one linked to your birth record. It's another archived sample from your father. The egg is correct."

  "So... that person on the screen... is me? But from a different sperm?"

  Kenji shifted uncomfortably. "The CRV-5 models identity as emergent pattern continuity. Based on the parameters, yes, that visualization represents *you* emerging from a different paternal gamete. The machine says it's you."

  Leo stared at his own face looking back, utterly familiar, yet now imbued with a terrifying strangeness. "Run the OVS," he demanded, his voice tight. "Keep the sperm – the *registered* sperm."

  The screen dissolved, reformed. Another Leo. Visually identical. Same posture, same slight frown line. Biometrics: 99.997% match. Neurological signature: Identical Continuity.

  "Egg is swapped," Kenji announced, sounding bewildered. "This visualization uses the registered sperm but a different egg from your mother's archive. Again, pattern match is extremely high." He looked at Leo, then the console. "Mr. Vance... your registered origin point? The CRV can't replicate a *you* from that specific gamete pair listed in the database. The simulation using *those* specific archived sperm and egg produces a phenotypic mismatch – different bone structure, different predicted neurological patterning. It wouldn't be recognized as 'Leo Vance'."

  The sterile air turned thick. Leo felt dizzy. "So... the 'me' in the official record? The sperm and egg combo my parents swore was mine... it wouldn't have made *me*?"

  "According to the CRV-5 algorithm," Kenji said carefully, avoiding Leo's eyes, "the registered gametes would likely have produced a different individual. The 'you' we're seeing in the OVS and SVS simulations... they match *you*, but they originate from *different* archived gametes than the ones on file. It's... possible there was a mix-up decades ago during archiving. Or reporting."

  Leo felt untethered. "Run the DVS. Both swapped."

  Kenji hesitated. "Mr. Vance, DVS is... unpredictable. It generates someone genetically unrelated to your parents, but patterned to be *you*. It’s philosophically contentious. And expensive."

  "Do it."

  The machine whirred louder. Calculations scrolled rapidly on Kenji's console. The screen flickered wildly, then stabilized.

  Leo felt his blood turn to ice.

  It was him again. Perfectly him. Wearing the same generic scrubs. Same eyes, same slight asymmetry of the smile, same everything. He raised a virtual hand, examining it with an expression that mirrored Leo's own dawning horror.

  "Biometric match: 99.999%," Kenji whispered. "Neurological signature: Identical Continuity. Origin: Gametes archived under 'Donor Pool Gamma-7'. Genetically, this individual shares no direct lineage with Robert or Evelyn Vance."

  Leo stared at the man on the screen – the man who *was* him, down to the last atom of his simulated being, yet born from total strangers. The face was his reflection, yet it felt like looking at a ghost wearing his skin. *His* thoughts, *his* memories, *his* love for Maya, *his* annoyance at Dave’s stubbornness... all housed in a body that owed nothing to the people he called Mum and Dad. Was this person *him*? Or the ultimate imposter?

  The door hissed open. Maya stood there, her face pale. She’d come straight from work, clutching the paperwork. Her eyes flicked to Leo, then to the screen showing his perfect double in the DVS simulation. Her gaze locked onto Leo’s face, searching.

  "Leo?" Her voice was small. "The clinic commed me. They said... there's an anomaly? That the verification failed?" She looked at the screen again, then back to him, her eyes wide with confusion and a dawning fear. "Who... who is that?"

  Leo opened his mouth, but no sound came out. He looked at the Leo on the screen, who seemed to look back with the same profound uncertainty. He looked at Maya, the woman he loved, who now looked at him as if seeing him for the first time. He thought of his parents, the lie or the mistake written into his very origin story. He thought of the fire, and the spark.

  The certificate didn't matter anymore. The question screamed in the sterile silence, echoing in Maya's frightened eyes and the calm, identical gaze of the stranger on the screen who shared his every thought: *What am I?*

  Kenji cleared his throat, holding out a datapad. "Dr. Finch needs your decision, Mr. Vance. Which visualization... which 'origin point'... do you want us to certify for the legal record? The registered one that wouldn't produce you? The SVS or OVS version that *does* produce you but uses different gametes? Or...?" His eyes flicked nervously towards the DVS screen.

  Leo didn't look at the options. He kept his eyes on Maya, trying to project *himself*, the person she knew, across the sudden, terrifying gulf. He saw the love warring with the doubt. He saw her clinging to *him*, the pattern she recognized, even as the ground beneath them dissolved.

  He reached for her hand. It felt real. Solid. Hers. But the ghost of a boy who never was, born from the wrong sparks, flickered silently on the screen behind them, waiting for an answer no one in the room could give.
