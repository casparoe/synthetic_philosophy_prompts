  **IN THE DISTRICT COURT OF MIDWESTERN STATE**  
  **CIVIL DIVISION**  

  **PROF. ARTHUR THORNE, )**  
  *Plaintiff, )*  
  *vs. )* Case No. CV-23-8741  
  **MIDWESTERN STATE UNIVERSITY, )**  
  *Defendant. )**  

  **DEPOSITION OF PROFESSOR ARTHUR THORNE**  
  Taken before Emily Rostova, CSR  
  June 12, 2024  

  **APPEARANCES:**  
  For Plaintiff: Ms. Jane Ellis, Esq.  
  For Defendant: Mr. Robert Vance, Esq.  

  * * *

  **EXAMINATION BY MR. VANCE:**

  **Q:** Professor Thorne, you are seeking damages from Midwestern State University for "pain and suffering" resulting from the alleged malfunction of your office chair on January 17th of last year, correct?  
  **A:** That is correct.  

  **Q:** And you claim this malfunction caused you chronic, debilitating pain?  
  **A:** Yes. Primarily in my lower back. It is constant and severe.  

  **Q:** This pain you feel – this sharp, burning sensation in your back – it’s real to you?  
  **A:** Of course it’s real. It’s a vivid, undeniable feature of my conscious experience.  

  **Q:** And you’ve published scholarly work on the nature of conscious experience, correct?  
  **A:** Yes, I have. Several papers and a monograph.  

  **Q:** Specifically, you defend a position known as epiphenomenalism regarding conscious states like pain?  
  **A:** I articulate and defend its coherence, yes.  

  **Q:** For the record, could you summarize epiphenomenalism in your own words?  
  **A:** Certainly. It holds that subjective conscious states – the raw *feel* of pain, the sensation of color, the taste of coffee – are real phenomena arising from brain processes. However, they themselves possess no causal power. They do not affect the physical world, including subsequent brain states or bodily actions. They are causally inert byproducts. Like the whistle on a steam engine – it sounds, but it doesn’t drive the train. The brain does all the causal work.  

  **Q:** So, according to your published view, this intense back pain you’re suing over… it cannot cause anything?  
  **A:** The *feeling* itself, the subjective agony, cannot cause physical events, no. It is an effect, not a cause.  

  **Q:** Including causing you to *believe* you are in pain?  
  **A:** Correct. The feeling doesn’t cause the belief.  

  **Q:** Or cause you to *say* "I am in pain"?  
  **A:** No.  

  **Q:** Or cause you to fill out workers' compensation forms?  
  **A:** No.  

  **Q:** Or cause you to hire Ms. Ellis here and file this lawsuit?  
  **A:** (Pause) No. All those actions are caused by underlying neurophysiological processes in my brain. The feeling accompanies them but doesn’t initiate or influence them.  

  **Q:** So the neural state N1 causes both the conscious feeling of pain *and*, separately, the neural state N2 that produces the *belief* "I am in pain"?  
  **A:** Precisely. They are parallel consequences of the physical cause. The feeling and the belief are correlated effects, but the feeling doesn’t *generate* the belief.  

  **Q:** But Professor, if the feeling itself does nothing, what connects the *belief* "I am in pain" to the actual *feeling* of pain?  
  **A:** They share the same physical cause. The neural state responsible for the feeling also triggers the mechanisms for forming that specific belief. It’s a reliable correlation established by evolution.  

  **Q:** Reliable correlation. But if the *feeling* isn’t doing any work, isn't it possible that the exact same neural state N1 could occur, causing the belief "I am in pain" and all my pain behaviors – grimacing, saying "ouch", filing lawsuits – *without* there actually being any feeling of pain at all?  
  **A:** (Pause) Theoretically... yes. According to the model, the feeling is a distinct property that supervenes on the neural state. It’s logically possible for the physical state to exist without the feeling, though I believe in reality they co-occur.  

  **Q:** So, for all this court knows, based solely on your behavior and testimony today – which you admit is caused entirely by your brain states, not by your pain – you might *not* actually be feeling any pain at all?  
  **A:** That... follows from the theory, but I assure you I *am* feeling it. The correlation holds.  
  **Ms. Ellis:** Objection. Argumentative. Calls for speculation.  
  **Mr. Vance:** Withdrawn. Let me rephrase.  

  **Q:** Professor, what makes your *belief* "I am in pain" a belief *about* your feeling of pain?  
  **A:** I’m not sure I follow.  

  **Q:** Well, according to you, this belief was caused directly by a brain state. That brain state also caused the feeling. But the belief itself never interacted with the feeling, did it? The feeling didn’t shape the belief, inform the belief, or cause the belief.  
  **A:** No, it did not.  

  **Q:** So why isn’t your belief actually *about* the brain state that caused it? Why isn't "I am in pain" really just your brain reporting "Neural State N1 is occurring"?  
  **A:** Because... because the content of the belief refers to the phenomenal experience.  
  **Mr. Vance:** Move to strike as non-responsive.  
  **Deponent:** (Sighs) The belief *represents* the feeling because of the specific causal history linking that type of neural state to that type of phenomenal report.  

  **Q:** But you just said the feeling plays no role in that causal history. The belief is caused by the neural state alone. Its content – its "aboutness" – seems anchored only to the physical cause, not to this separate, causally isolated feeling. How does the belief latch onto the feeling if they never touch?  
  **A:** (Long pause) This is the paradox of phenomenal judgment. It’s a recognized challenge. I maintain that the representational content is fixed by the reliable covariation established by the shared physical substrate.  

  **Q:** Reliable covariation that could, as we discussed, exist even if the feeling didn't?  
  **A:** Logically possible, but not actual.  

  **Q:** Professor, let's imagine a highly skilled neurosurgeon. Suppose she could precisely stimulate the very brain state – N1 – that you say causes both the feeling of your specific back pain *and* the belief that you are in pain. If she did that right now, what would happen?  
  **A:** I would experience the feeling of pain and form the belief that I am in pain.  

  **Q:** Even if your actual back was perfectly fine?  
  **A:** Yes. The brain state is sufficient.  

  **Q:** And conversely, if she could somehow inhibit *only* the generation of the feeling itself, leaving the neural state N1 intact and thus still causing you to *believe* you were in pain and *act* as if you were in pain... you’d behave exactly like you are now, insisting you're in agony, but without actually feeling anything?  
  **A:** (Visibly unsettled) That... is a conceivable scenario under the theory.  

  **Q:** So, Professor Thorne, based on your own published philosophical position: Your testimony today, your complaints, your lawsuit – all caused solely by brain states. The feeling of pain you describe is, as you put it in your monograph, "a causally inert shadow." How does this shadow constitute an injury for which this court can award damages? What, precisely, are we compensating?  
  **A:** (Pause) We are compensating... the existence of the experience itself. The intrinsic badness of the pain quale, regardless of its causal powers. The suffering is real, Mr. Vance. Its reality doesn't depend on it *doing* anything. It is a harm in itself.  

  **Q:** Even though it had no role in bringing you here today?  
  **A:** Even so. Its presence is the injury.  
  **Mr. Vance:** Nothing further for now.  

  * * *

  **(Deposition concluded at 3:15 p.m.)**
