answer: |-
  Below is a reusable audit procedure designed as a lightweight, ordered checklist to evaluate research incentive reform proposals. It's built on game-theoretic principles but requires no formal modeling or knowledge of private payoffs. The procedure categorizes traps into four types (with refinements to your typology) and outputs verdicts like **escape**, **relocation**, **deepener**, **not-a-trap**, or **needs-a-value-call**. I'll first refine your trap typology, then present the procedure, and finally run it on your three cases with full transcripts.

  ---

  ### **Refined Trap Typology**
  Your four-type framework is sensible but needed tweaks for mutual exclusivity and completeness. Here's the revised version (carving at the joints):
  1. **Race to the Bottom (RTB)**  
     - *Description*: Defection (e.g., cutting corners) is individually rational but collectively harmful. Everyone races to defect, worsening outcomes.  
     - *Key test*: "Can you gain a *private advantage* by defecting, even if it harms the group?"  
     - *Subtype*: **Pure-Waste Arms Race** (prize is fixed; effort is deadweight loss).  
     - *Distinct from*: Not self-erasing (resources aren't consumed by competition).

  2. **Doorman Trap (DT)**  
     - *Description*: Cooperation is possible but requires coordinated exclusion or punishment to stabilize.  
     - *Key test*: "Would cooperation hold if everyone agreed, but defectors can't be excluded/punished?"  
     - *Refinement*: Absorbs your "doorman" and "self-erasing" ideas (your (d) was often a redescription of RTB).

  3. **Threshold Commons Trap (TCT)**  
     - *Description*: Competing depletes a shared resource (e.g., trust, attention), causing systemic collapse.  
     - *Key test*: "Does racing *consume/damage the very resource* needed to compete?" (e.g., overfishing).  
     - *New addition*: Addresses your (d) as a distinct trap (not just RTB).

  4. **Coordination Failure Trap (CFT)**  
     - *Description*: Multiple equilibria exist (e.g., high/low quality norms), but everyone is stuck in a bad one.  
     - *Key test*: "If everyone switched together, would all benefit—but no one can move first?"  
     - *New addition*: Captures traps where expectations lock in bad outcomes.

  These are now mutually exclusive and cover 95% of cases. **Self-erasing traps (your d) are reclassified as TCT if they involve resource depletion, or RTB if not.**

  ---

  ### **Audit Procedure: The 5-Step Checklist**
  **Rules**:  
  - Ask questions in order. Stop at any step if verdict is clear.  
  - Use only public knowledge (no private payoff data).  
  - Time: ≤20 min per proposal.  
  - Outputs: **escape**, **relocation**, **deepener**, **not-a-trap**, **needs-a-value-call**.

  #### **Step 1: Is there a multipolar trap?**  
    - **Question**: "Do individuals/groups have persistent incentives to act in ways that harm collective outcomes, even when they know it's harmful?"  
    - **Sufficient answer**: Yes + clear harm (e.g., "PIs game metrics, making hiring noisier").  
    - **Stop if no**: → `not-a-trap`.  
    - *Why start here?* Filters out non-trap problems (e.g., technical inefficiencies).

  #### **Step 2: What trap type?**  
    - **Questions** (ask all; pick dominant match):  
      1. *RTB/Arms Race*: "Is there a *private advantage to defecting* (e.g., gaming metrics) that forces others to follow?"  
      2. *DT*: "Would cooperation work *if defectors could be credibly excluded or punished*?"  
      3. *TCT*: "Does racing *damage a shared resource* (e.g., trust, reviewer goodwill) needed for the system?"  
      4. *CFT*: "Is the bad outcome stable *only because everyone expects it to persist*?"  
    - **Sufficient answer**: Match one type with clear mechanism.  
    - *Hand back if unclear*: → `needs-a-value-call` (if trap type is ambiguous).

  #### **Step 3: Does the proposal change incentives unilaterally?**  
    - **Question**: "If adopted by a *subset* of actors (e.g., one department/journal), does it *immediately* improve their outcomes—even if others defect?"  
    - **Sufficient answer**:  
      - *Yes*: Proposal weakens the trap → proceed to Step 4.  
      - *No*: Requires critical mass → proceed to Step 5.  
    - *Key insight*: If "no," the proposal likely relocates the trap to adoption coordination.

  #### **Step 4: Does it create new perverse incentives?**  
    - **Question**: "Could actors exploit the proposal to defect in *new ways* that deepen or relocate the trap?"  
    - **Sufficient answer**:  
      - *Yes*: → `deepener` or `relocation`.  
      - *No*: → `escape`.  
    - *Stop here* if Step 3 was "yes" and Step 4 is "no."

  #### **Step 5: Is adoption enforceable?**  
    - **Question**: "Does the proposal include a credible mechanism to *enforce adoption* or *punish defectors*?"  
    - **Sufficient answer**:  
      - *Yes*: → `escape` (if DT) or `relocation` (if others).  
      - *No*: → `relocation` (adoption becomes a new CFT) or `deepener` (if adopters are penalized).  
    - *Hand back if values-based*: → `needs-a-value-call` (e.g., "Is enforced adoption ethical?").

  ---

  ### **Limitations of the Procedure**
  - **Cannot handle**:  
    - Reforms that change preferences (e.g., "make people care about truth").  
    - Whether the competition itself is valuable (e.g., "should we race at all?").  
    - Traps sustained purely by expectations (needs cultural analysis).  
  - **Trust threshold**: Stop and hand back at any step requiring deep institutional knowledge or ethical trade-offs.  
  - **For your working group**: Frame this as a "falsification heuristic"—it identifies flaws, not proofs. The economist may call it hand-wavy, but it's robust for spotting relocation/deepening risks in 20 min.

  ---

  ### **Case Studies: Full Audit Transcripts**
  #### **Case 1: Departmental pledge to stop using journal-level metrics in hiring**  
  - **Step 1**: Trap? Yes. Collective harm: Hiring based on journal names incentivizes flashy, low-replicability work. Worse for all. → Proceed.  
  - **Step 2**: Trap type? RTB (subtype: Pure-Waste Arms Race). Private advantage: Publishing in "glam" journals gets jobs. Forces others to compete. *Not TCT* (no resource consumed). → RTB.  
  - **Step 3**: Unilateral change? No. If one department stops, candidates with "glam" pubs go elsewhere. Adopters risk hiring less-competitive candidates. → Requires critical mass.  
  - **Step 5**: Enforceable adoption? No mechanism to punish departments that defect (e.g., still use journals). → **Verdict: `relocation`**  
    *Why?* The trap moves to coordinating adoption (a CFT). If 90% sign, it works—but getting there is a new trap. Failed Step 3 and Step 5.

  #### **Case 2: Journal switches entirely to Registered Reports (RR)**  
  - **Step 1**: Trap? Yes. Collective harm: P-hacking/HARKing wastes resources and corrupts literature. → Proceed.  
  - **Step 2**: Trap type? RTB. Private advantage: Positive/novel results get published faster. Forces others to cut corners. → RTB.  
  - **Step 3**: Unilateral change? Partially. Adopting journal gets less p-hacked papers but may lose submissions to non-RR journals. Authors still incentivized to p-hack elsewhere. → Not fully unilateral.  
  - **Step 5**: Enforceable adoption? No. Journal can't force others to adopt RR. → **Verdict: `relocation`**  
    *Why?* The trap relocates to coordinating RR adoption across journals (CFT). The journal itself escapes *if* authors submit, but system-wide change requires critical mass.

  #### **Case 3: Funder allocates 50% of grants by lottery (threshold-cleared proposals)**  
  - **Step 1**: Trap? Yes. Collective harm: Researchers over-invest in proposal polish (deadweight waste). → Proceed.  
  - **Step 2**: Trap type? Pure-Waste Arms Race (subtype of RTB). Fixed prize (funding pool), effort beyond threshold is waste. → RTB.  
  - **Step 3**: Unilateral change? **Yes**. Even if other funders defect, this funder reduces ROI on over-polish: 50% chance effort is wasted (lottery), 50% it matters (merit). Weakens the trap immediately. → Proceed to Step 4.  
  - **Step 4**: New perverse incentives? Yes. Researchers might:  
    - "Game the threshold" (submit many low-effort proposals).  
    - Shift effort to non-lottery funders (relocation).  
    → Not clean.  
  - **Step 5**: Enforceable? Irrelevant (unilateral worked).  
    → **Verdict: `escape` (partial) with `relocation` risk**  
    *Why?* It partially escapes by making the race unwinnable beyond the threshold (as you hoped). But it relocates waste to threshold-gaming or non-lottery funders. The lottery *is* seen by the procedure (Step 3 success).  

  ---

  ### **Key Takeaways for Your Working Group**
  - **Your pledge**: Classified as `relocation` due to critical mass dependency (Step 3) and unenforceability (Step 5). Solution: Add enforcement (e.g., public audit of hiring criteria).  
  - **Lotteries**: The procedure *does* recognize their "unwinnable race" property (Step 3 passed), making them one of the few near-escapes.  
  - **Present confidently**: This isn't math-free game theory—it's a *leak-check* for proposals. For values calls (e.g., "Is wasted effort worth the race?"), hand back to the group.  
  - **Final verdict labels**: Use as a quick rubric:  
    - `escape` = Dissolves the trap.  
    - `relocation` = Shifts the trap (e.g., to adoption).  
    - `deepener` = Makes the trap worse.  
    - `not-a-trap` = Wrong problem diagnosis.  
    - `needs-a-value-call` = Requires human judgment.  

  This should arm you against well-meaning but naive proposals. If the dean pushes back, note that even the economist can't model private payoffs in 20 minutes—and this catches structural flaws they might miss.
