prompt: |-
  I'm a fifth-year phil sci PhD, and one day a week I sit in our research office, which means I've somehow become the person everyone hands their well-meaning proposal for fixing research incentives to — stop counting journal names in hiring, mandate preregistration, hand out badges, switch a journal to registered reports, replace peer review with prediction markets, you get the idea. They all have the same shape: someone has read about Moloch and multipolar traps, concluded that the reason everyone keeps doing the locally rational thing that makes the collective worse off is that nobody has designed the right pledge yet, and now wants a committee to endorse it. My honest suspicion is that most of these either preach to the choir or just relocate the race instead of ending it, but I've got nothing better than vibes to argue with, and I'm tired of relitigating this case by case with people who are more confident than me. So what I want is a reusable audit procedure — a short ordered set of tests I can run on a proposal in twenty minutes at my desk, without doing any actual modelling, that tells me whether the situation it's aimed at is really a multipolar trap, which kind, and whether the proposal dissolves it, relocates it, or feeds it. Please give me the questions in the order I should ask them, what counts as a sufficient answer to each one, where the procedure just stops and returns a no, and where it has to hand the decision back to a human because the remaining question is about values rather than structure. It has to be usable by someone whose game theory is one grad seminar, it can't require me to know other institutions' private payoffs, and it should end in a small set of verdict labels I can write on a one-pager — something like escape, relocation, deepener, not-a-trap, needs-a-value-call. I also want you to push back on my own crude typology before you build on it: I currently think there are four shapes, (a) the plain race, where defecting is individually rational and everyone ends up worse off, (b) the pure-waste arms race, where the prize is fixed and therefore all the extra spending is deadweight, (c) the doorman trap, where cooperation is available but only with some credible exclusion or punishment mechanism, and (d) the self-erasing trap, where competing consumes the very resource being competed over. (d) is the one I'm least sure about and might just be a redescription of (a); tell me if these carve at the joints, if they're not mutually exclusive, or if there's a fifth I'm missing.

  Then run the procedure on three cases and show me the full transcript of the tests for each. First, my own proposal: a departmental pledge not to use journal-level metrics in hiring and promotion decisions, which is the one I've been advocating for two years and which I suspect your procedure is going to be rude about — if it comes out as a relocation or a deepener I want you to say so plainly and explain exactly which test it failed, because I need to know before I take it to the working group. Second, a journal that moves its whole pipeline to registered reports. Third, a funder that allocates half its budget by lottery among proposals that clear a quality threshold, keeping the other half merit-ranked. For the lottery case I especially want to know whether the procedure can even see the thing that makes lotteries attractive to me, which is that they make the race unwinnable rather than better-policed.

  Two more things. Be explicit about what the procedure can't do: I don't want it pretending to settle whether the competition is worth keeping at all (some of it probably is — I'd rather have labs racing on a real problem than not), it can't handle the case where the reform changes what people want rather than just what they can get, and it obviously can't distinguish a trap held up by real structure from one held up only by everyone's expectation that everyone else will keep playing. And note where I should stop trusting it and just make a judgement call, since I'll be presenting this to a working group of PIs, one economist who will say this is game theory with the math removed, and one dean who signs off on anything that touches hiring, so it has to survive being publically called hand-wavy.
reasoning: |-
  We are going to design an audit procedure for proposals aimed at fixing research incentives. The goal is to have a reusable set of tests that can be run in about 20 minutes without modeling, to classify a proposal's impact on a multipolar trap.

  The user's crude typology of traps:
  (a) Plain race: Defecting is individually rational, leading to collectively worse outcomes (like a prisoner's dilemma).
  (b) Pure-waste arms race: Fixed prize, so extra spending is deadweight loss (e.g., rent-seeking).
  (c) Doorman trap: Cooperation is possible but requires exclusion or punishment (e.g., to prevent free-riding).
  (d) Self-erasing trap: Competing consumes the resource being competed over (e.g., a common-pool resource problem).

  We note:
  - (a) and (b) are similar but (b) is a special case of (a) where the competition is for a fixed prize and the cost of competing is pure waste.
  - (d) is a common-pool resource problem, which is a well-known type of multipolar trap (like the tragedy of the commons). It is distinct because the resource depletion leads to the collapse of the system.

  We will use a typology that is mutually exclusive and exhaustive enough for the procedure. Let's define:

  1. **Race to the Bottom (RTB)**: Individuals have an incentive to lower standards/quality (or increase effort wastefully) because if one does, others must follow to compete, leading to a worse outcome for all. (Includes (a) and (b) above, but we can split (b) as a special case if needed.)
  2. **Common-Pool Resource (CPR)**: The resource is subtractable (using it reduces what's left for others) and non-excludable (hard to prevent use), leading to overuse and depletion. (Matches (d).)
  3. **Coordination Problem (CP)**: Multiple equilibria exist, and we are stuck in a bad one. Moving to a good one requires coordination (e.g., via a doorman or focal point). (Includes (c).)

  But note: the "doorman trap" (c) is about the need for enforcement to sustain cooperation. This is typical in public goods games (which are a type of RTB) or CPR management. We might fold (c) into the other categories when the issue is enforcement.

  Alternatively, we can use the standard game theory classification:

  - Prisoner's Dilemma (PD): The classic RTB.
  - Coordination Game: With multiple equilibria (good and bad).
  - Commons Dilemma: CPR.

  We'll design the procedure to identify the type of trap and then assess the proposal.

  The audit procedure:

  We need a set of ordered questions. We stop and return a verdict if we can, or hand back to human for value judgments.

  **Step 0: Pre-check - Is there a multipolar trap?**
     - Ask: **"Is there a widespread perception that individual researchers/labs/departments/journals are acting in ways that are individually rational but lead to a collectively worse outcome?"**
       - If no: Then the problem might not be a multipolar trap. Verdict: **not-a-trap**.
       - If yes: Proceed.

  **Step 1: Identify the type of trap**
     - We ask: **"What is the collective bad outcome that results from individual rational actions?"**
       - Options:
          - **Waste of resources** (e.g., excessive time spent on submissions, overproduction of low-quality papers, redundant research): This suggests a **Race to the Bottom (RTB)** or **Arms Race**.
          - **Depletion of a shared resource** (e.g., loss of public trust in science, degradation of a common methodology, overuse of a limited resource like attention or funding): This suggests a **Common-Pool Resource (CPR)** problem.
          - **Failure to coordinate on a better outcome** (e.g., everyone uses a substandard method because others do, even though a better one exists): This suggests a **Coordination Problem (CP)**.

     - Then we ask: **"Is the prize for which agents are competing fixed in quantity (i.e., not increased by the competition)?"** 
          - If yes and the problem is waste, then it's a **Pure-Waste Arms Race** (a subtype of RTB).
          - If no and the problem is waste, then it's a **Race to the Bottom** (with variable prizes, but still wasteful).

     - For CPR: We ask: **"Is the resource being consumed or degraded by the competition?"** (If yes, then CPR.)

     - For CP: We ask: **"Are there multiple stable outcomes (equilibria), and are we stuck in a bad one?"** (If yes, then CP.)

     But note: These are not mutually exclusive. We can have a combination. The procedure will pick the dominant one.

     We then assign the trap type: **RTB**, **Arms Race (fixed prize)**, **CPR**, or **CP**.

  **Step 2: Assess the proposal**
     - We now ask about the proposal: **"Does the proposal change the rules of the game (incentives) for all relevant agents, or only for those who adopt it?"**
       - If it only changes for adopters (and adoption is voluntary), then we are in a situation of partial adoption. This is critical because the trap might persist if not everyone adopts.

     - Then: **"Does the proposal remove the incentive for individuals to defect (i.e., engage in the harmful behavior)?"**
       - If yes, then we must check if this removal is conditional on widespread adoption. If it requires widespread adoption to be effective, then we have a coordination problem in adopting the proposal.

     - We break down:

     For **RTB/Arms Race**:
          - **"Does the proposal make the harmful behavior more costly, or the cooperative behavior more rewarding, in a way that holds even if others continue to defect?"**
            - If yes, then it may **dissolve** the trap.
            - If no, then we ask: **"Does the proposal rely on a critical mass of adopters to change the incentives?"**
               - If yes, then it may be a **relocation** of the trap (to the coordination problem of getting adoption).
               - If no, then it might be ineffective or even deepen the trap.

     For **CPR**:
          - **"Does the proposal establish clear ownership or boundaries for the resource, or impose rules for sustainable use that are enforceable?"**
            - If yes, then it may **dissolve** the trap.
            - If no, then we ask: **"Does the proposal rely on voluntary restraint without enforcement?"** 
               - If yes, then it may **deepen** the trap (because the cooperators lose out to defectors) or be ineffective.

     For **CP**:
          - **"Does the proposal create a focal point or provide a coordination mechanism that allows everyone to move to the better equilibrium at once?"**
            - If yes, then it may **dissolve** the trap.
            - If no, then it may be ineffective.

     But note: Some proposals might change the game entirely. We must be cautious.

  **Step 3: Check for unintended consequences**
     - **"Could the proposal create new incentives that lead to a different multipolar trap?"** 
          - If yes, then the proposal might **relocate** the trap.

  **Step 4: Value judgments**
     - If at any point the assessment requires comparing the desirability of different outcomes (e.g., whether the collective outcome is indeed worse, or whether the new equilibrium is better), then we stop and return **needs-a-value-call**.

  **Final Verdicts**:
     - **escape**: The proposal dissolves the trap (if implemented) without creating a new one.
     - **relocation**: The trap is moved to a different domain (e.g., the adoption of the reform becomes the new coordination problem) or a new trap emerges.
     - **deepener**: The proposal might make the trap worse (e.g., by increasing the cost of cooperation or by creating a new way to compete).
     - **not-a-trap**: The situation is not a multipolar trap.
     - **needs-a-value-call**: The procedure cannot decide without a value judgment.

  Now, we run the procedure on the three cases.

  ---

  **Case 1: Departmental pledge not to use journal-level metrics in hiring and promotion decisions**

  Step 0: Pre-check
     - There is a perception that departments use journal names (like impact factors) as a proxy for quality because it's easy, even though it leads to collectively worse outcomes (e.g., incentivizing flashy but shallow work, or publication in high-impact journals over substantive contributions). So, yes, a multipolar trap? We think so.

  Step 1: Identify trap type
     - Collective bad: Waste of resources (researchers spending time on journal targeting instead of substantive work) and degradation of research quality (if journals become the target instead of real impact). 
     - Is the prize fixed? The jobs and promotions are fixed in number? Yes, in the short run. So it's a **Pure-Waste Arms Race** (a subtype of RTB).

  Step 2: Assess the proposal
     - The pledge: If adopted by the department, they stop using journal names. But note:
          - The proposal changes rules only for adopters (this department). Other departments may still use journal names.
          - Does it remove the incentive? For the adopting department, they stop using journal names, so for their hiring, they look at other things. But for the job candidates, they still have to apply elsewhere. So the candidates still have an incentive to publish in high-impact journals for the job market as a whole. Thus, the harmful behavior (targeting high-impact journals) is still incentivized by the rest of the market.
          - Therefore, the proposal does not make the harmful behavior more costly or cooperative behavior more rewarding in a way that holds if others defect. In fact, if only one department adopts, then candidates might even avoid that department if they have high-impact papers (because they can get a job elsewhere that values them) or if they don't, they might be at a disadvantage when applying to other places. So the adopting department might get worse candidates (if they are the only one) because they can't attract the ones with high-impact papers.

          - Alternatively, if the department is prestigious, they might set a trend. But that requires coordination.

          - The proposal relies on a critical mass of adopters to change the incentives. Until then, the adopting department might be at a disadvantage (e.g., in hiring star researchers who have high-impact publications). So the trap is relocated to the problem of getting enough departments to adopt.

          - Verdict: **relocation** (the new trap is getting everyone to sign the pledge).

     Step 3: Unintended consequences?
          - The department might start using other heuristics (like citations) that are also gameable. So a new arms race on citations? Then it's a relocation of the trap.

          - We don't have enough to say for sure, but it's a risk.

     Step 4: Value judgment?
          - Not needed for the verdict.

     Final verdict: **relocation**

     Why? The proposal only works if adopted widely, and until then, it may disadvantage the adopters. So it relocates the trap to the coordination problem of adoption.

  ---

  **Case 2: A journal that moves its whole pipeline to registered reports**

     Step 0: Pre-check
          - The problem: Researchers have an incentive to run many experiments, cherry-pick results, and engage in p-hacking to get publications. This leads to a collective bad: a literature full of false positives and non-replicable results, which wastes resources and erodes trust.

          - So, yes, a multipolar trap.

     Step 1: Identify trap type
          - Collective bad: Waste of resources (on non-replicable research) and depletion of a shared resource (trust in science). This is both waste and resource depletion. But the primary mechanism is a race to produce positive results by any means. The prize (publications) is not fixed? Actually, the number of publications in a journal is fixed per issue, but the total publications across journals is not. However, the competition for publication slots is a race.

          - We can see it as a **Race to the Bottom** (RTB) in research integrity: If one researcher p-hacks, others must do the same to compete. This leads to a collective bad (low trust). It is also a **CPR** if we consider the trust in science as a common resource that is depleted.

          - But note: the journal's move is about changing the incentives for submissions to that journal. So we focus on the trap in the publication process.

          - Trap type: **RTB** (with a possible CPR element).

     Step 2: Assess the proposal
          - The journal moves to registered reports (RR). This changes the rules for everyone who submits to that journal.

          - Does it remove the incentive for p-hacking? Yes, because in RR, the acceptance decision is made before the results are known. So the incentive to p-hack is removed for papers submitted to this journal.

          - But note: Researchers can still submit to other journals that don't use RR. So the incentive to p-hack for other journals remains.

          - However, the proposal changes the rules for one journal. For that journal, it works: the harmful behavior (p-hacking) is not rewarded for submissions there. But the trap for the whole system remains because other journals are still there.

          - So does it change the incentive even if others defect? For the adopters (this journal and authors who submit there), yes, for that journal. But the authors still have the incentive to p-hack for other journals. So the overall incentive remains.

          - The proposal might create a niche for high-integrity research. Some researchers might prefer this journal. But the problem is that the overall system hasn't changed.

          - However, the journal's move might set an example and lead to more journals adopting RR. So it could be a step toward broader reform. But until then, the trap is relocated: now the challenge is to get other journals to adopt RR.

          - Also, note: the journal might attract more high-quality preregistered work, but it might also lose submissions from researchers who want quick publications without preregistration. So the journal might suffer in terms of impact (if impact is measured by citations, because RR might take longer to publish). This could create a new trap for the journal: if they are the only one, they might get less flashy results and lose prestige.

          - Thus, the proposal relies on a critical mass of journals adopting RR to change the incentives for researchers. Until then, the journal might be at a disadvantage.

          - Verdict: **relocation** (the trap moves to getting other journals to adopt).

     Step 3: Unintended consequences?
          - The journal might become a haven for a certain kind of research, but it might also fragment the literature. Also, researchers might do two kinds of research: some with RR and some without, which might not change the overall waste.

     Step 4: Value judgment?
          - Not needed.

     Final verdict: **relocation**

     Why? The proposal changes the game for one journal, but the system-level trap remains unless others follow. The adoption by other journals becomes a coordination problem.

