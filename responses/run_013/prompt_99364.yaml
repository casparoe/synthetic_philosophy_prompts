prompt: |-
  In my Theory of Knowledge class my teacher has been ruling on claims about the past, and I have been keeping a list. She calls pseudohistory the claim that Atlantis was a real maritime empire whose memory survives in Plato and whose destruction the dialogues record; the claim that the Egyptian pyramids were built with extraterrestrial help; and the New Chronology associated with the mathematician Anatoly Fomenko, which holds that the events we assign to ancient Rome, Greece, and Egypt actually happened in the Middle Ages and that the history of everything before roughly 1600 was fabricated. Her stated reason is similar each time: the claim cannot lose. The lost island is always somewhere not yet excavated, the missing alien artefacts prove how well the cover-up has worked, and the documents that contradict the chronology are forgeries.

  She is careful in the other direction as well. She does not call pseudohistory the argument that the weathering of the Sphinx enclosure shows the monument to be far older than dynastic Egypt; she thinks it is probably wrong, but its defenders say in advance what would refute them. She does not call pseudohistory a local amateur's contention that a runestone in our town museum is a genuine medieval Norse inscription; he is probably wrong, but he argues in the open and would withdraw the claim if the runes turned out to be modern. And when I asked about a famous fossil forgery from the early twentieth century, she said it was a fraud rather than pseudohistory, because the forger had to hide from the evidence and was eventually caught by it.

  The case we are arguing about next week is this. A research group at a major university, with the usual credentials, publishes in the ordinary peer-reviewed journals of its field. It maintains that a particular ancient population collapse was caused by one specific event. When the signature that event should have left fails to turn up at a newly excavated site, the group does not abandon the claim; it adds a qualification — the signature was not preserved there, the site was disturbed, the event affected only part of the population — and carries on. Each qualification is individually defensible, and the group members are not cranks; they are simply never wrong for long.

  Predict my teacher's verdict on that case. I care less about the verdict than about the rule she is actually running. State the criterion that best fits her earlier rulings, name at least two other criteria that fit those rulings equally well, and say what each of them predicts about the new case. Give me your best guess at her verdict and the reasons for preferring that reading. Then tell me which case on the table — hers or mine — genuinely forces a choice among the criteria, and which move a defender of the research group would make to insist that no line is being crossed at all.
reasoning: |-
  Okay, let me start by understanding the user's query. They're in a Theory of Knowledge class where the teacher distinguishes pseudohistory from legitimate historical claims based on whether a claim can be falsified. The teacher labels claims as pseudohistory if they're structured to avoid refutation—like Atlantis always being undiscovered, alien artifacts being covered up, or Fomenko's chronology dismissing contradicting documents as forgeries. Conversely, she accepts claims that can be tested, even if they're probably wrong, like the Sphinx weathering or the runestone debate. 

  The user presents a new case: a research group at a university publishes in peer-reviewed journals, attributing a population collapse to a specific event. When evidence against it emerges, they adjust with defensible qualifications (e.g., preservation issues, site disturbance). The group isn't abandoning their theory despite counter-evidence. The user wants to predict the teacher's verdict and identify the underlying criterion. 

  First, I need to recall the teacher's pattern. Her main criterion seems to be falsifiability. Pseudohistory avoids falsification by making excuses for negative evidence. Legitimate claims, even if wrong, specify what would disprove them. So for the research group, their constant adjustments might fit the unfalsifiable pattern. Each qualification is reasonable, but collectively, they prevent the theory from ever being proven wrong. 

  But the user also wants alternative criteria that fit past rulings. Two others come to mind: methodological integrity and transparency. Methodological integrity involves how evidence is handled—cherry-picking or ad-hoc adjustments. Transparency is about openness to scrutiny, like the runestone amateur who'd admit if proven wrong. 

  Applying these to the research group: falsifiability suggests they're pseudohistory because their theory evolves to escape refutation. Methodological integrity might see their adjustments as legitimate but potentially problematic if they ignore disconfirming data. Transparency could be mixed; they're publishing openly but might not concede if proven wrong. 

  The teacher's likely verdict is pseudohistory because the group's approach mirrors Atlantis and Fomenko—endless qualifications. The key reason is the lack of a clear failure condition. 

  Cases forcing a choice between criteria: The Sphinx weathering example. Falsifiability is met (they specify disproof), but methodological integrity might be questioned if they downplay counter-evidence. Here, the criteria align, so no forced choice. The runestone case is clearer; transparency is key, as the amateur's willingness to concede makes it not pseudohistory. 

  The research group's defender would argue each qualification is valid and scientific, not evasive. They'd say adjustments are normal in science, pointing to peer review as legitimacy. To avoid crossing the line, they'd emphasize that future evidence could still disprove them. 

  Deep down, the user might be exploring how to demarcate science from pseudoscience in history, and the ethical implications of unfalsifiable claims. They could also be grappling with real-world examples where reputable scholars blur these lines, challenging the teacher's criterion. Ensuring the answer addresses these epistemological concerns is crucial.
answer: |-
  Based on your teacher's established pattern, here's the analysis and prediction:

  1.  **Predicted Verdict:** Your teacher is highly likely to rule this research group's behavior as **pseudohistory** (or at least exhibiting pseudohistorical *tendencies*).

  2.  **The Core Criterion:** The best-fitting criterion explaining her prior rulings is **Methodological Falsifiability (or Refutability) in Practice**.
      *   **Definition:** A claim crosses into pseudohistory when its proponents *structure it or their methodology* such that *no conceivable empirical evidence could definitively disprove it in their eyes*. They employ consistent, pre-emptive strategies to explain away negative evidence, rendering the core claim unfalsifiable in practice.
      *   **Fits Past Rulings:**
          *   *Atlantis:* Negative evidence (no island found) is explained by it being "somewhere not yet excavated." The claim cannot be falsified by absence of evidence.
          *   *Pyramids/Alien Help:* Absence of alien artifacts proves the "cover-up worked." Negative evidence is reinterpreted as proof of conspiracy.
          *   *Fomenko:* Contradictory documents are dismissed as "forgeries." The core chronology is shielded from documentary refutation.
          *   *Sphinx Weathering:* Proponents specify what evidence *would* refute them (e.g., definitive proof the weathering patterns match the dynastic period). The claim is falsifiable.
          *   *Runestone:* The amateur specifies that modern dating of the runes *would* refute his claim. The claim is falsifiable and he commits to accepting refutation.
          *   *Fossil Forgery:* The forger actively *hid* from evidence (avoiding falsification attempts) and was *caught* by evidence. The fraud was falsifiable and *was* falsified.

  3.  **Alternative Criteria Fitting Past Rulings:**
      *   **Criterion 1: Commitment to Abandonment Upon Refutation**
          *   **Definition:** Pseudohistory is characterized by a fundamental *unwillingness* of its proponents to *ever* abandon the core claim, regardless of the evidence. Legitimate inquiry involves a commitment (explicit or implicit) to withdraw the claim if sufficiently strong counter-evidence is presented under agreed-upon conditions.
          *   **Fits Past Rulings:**
              *   *Atlantis/Pyramids/Fomenko:* Proponents show no scenario where they would abandon the core idea (lost empire, alien help, revised chronology).
              *   *Sphinx/Runestone:* Proponents explicitly state conditions under which they *would* abandon their claim.
              *   *Fossil Forgery:* The forger didn't abandon his claim upon refutation because he was hiding; he was *forced* to abandon it when caught.
          *   **Prediction for New Case:** This criterion would also predict pseudohistory. The research group "simply [is] never wrong for long" because they *never abandon* the core claim of the specific event causing the collapse. They only add qualifications to absorb the blow of counter-evidence. Their actions demonstrate no commitment to abandonment, only to perpetual defense.
      *   **Criterion 2: Methodological Integrity Regarding Counter-Evidence**
          *   **Definition:** Pseudohistory involves systematic methodological flaws in *handling disconfirming evidence*, such as consistently resorting to *ad hoc* hypotheses (qualifications invented solely to save the theory), ignoring counter-evidence without strong justification, or invoking conspiracies/cover-ups to dismiss it. Legitimate inquiry engages seriously with counter-evidence and adjusts methodology accordingly, potentially leading to theory revision or abandonment.
          *   **Fits Past Rulings:**
              *   *Atlantis/Pyramids/Fomenko:* They use classic *ad hoc* hypotheses ("not found yet," "cover-up," "forgery") or conspiracy to dismiss counter-evidence, demonstrating poor methodological integrity.
              *   *Sphinx/Runestone:* Proponents engage with counter-evidence by specifying what would refute them; their methodology *allows* for falsification. The runestone amateur exhibits integrity by stating he *would* accept refutation.
              *   *Fossil Forgery:* The forger's *method* was fraudulent (fabrication, hiding); his lack of integrity *was* the pseudohistory/fraud in action.
          *   **Prediction for New Case:** This criterion would predict pseudohistory. The group consistently uses *ad hoc* qualifications ("not preserved," "disturbed," "only part affected") *specifically to dismiss each new piece of counter-evidence* that should have falsified their specific causal claim. This pattern shows a lack of methodological integrity in handling disconfirmation; they protect the theory rather than test it against the evidence.

  4.  **Reason for Prefering "Methodological Falsifiability in Practice":**
      *   This criterion most directly captures the *essence* of your teacher's repeated phrase "the claim cannot lose." It focuses on the *structural* and *procedural* aspect that makes a claim immune to empirical defeat. The Atlantis claim *structurally* cannot be falsified by absence of evidence; the Fomenko claim *structurally* dismisses contradictory documents. The Sphinx and Runestone claims *structurally incorporate* potential falsification. The research group's pattern of qualification *structures their claim* to be perpetually unfalsifiable; no matter what new site is excavated lacking the signature, a plausible-sounding reason can be generated to explain it away. The *methodology itself* prevents falsification.

  5.  **Case Forcing a Choice Among Criteria:**
      *   **The Sphinx Weathering Hypothesis** genuinely forces a choice, particularly between "Methodological Falsifiability" and "Methodological Integrity."
      *   **Why:** Proponents *do* specify falsifying conditions (e.g., conclusive proof the weathering aligns *only* with the dynastic wet period). They pass the Falsifiability test.
      *   **However:** Critics might argue they *downplay* or reinterpret geological counter-evidence using their own *ad hoc* arguments, potentially failing the Methodological Integrity test. Your teacher accepts it as legitimate despite probably thinking it's wrong, suggesting she prioritizes the *potential* for falsification (the core claim *could* be refuted *in principle* by evidence they acknowledge) over potential nitpicking about *how* they handle every piece of counter-evidence *in practice*. This highlights that "Falsifiability in Practice" is her primary, but not necessarily sole, criterion. The Runestone case is clearer on all counts (falsifiable, commitment to abandon, transparent method).

  6.  **The Research Group's Defense (Avoiding the Line):**
      *   The defender would argue: **"This is simply how normal science works within complex historical disciplines."** They would contend:
          *   **Complexity:** Ancient history and archaeology deal with incomplete, fragmentary, and often ambiguous evidence. Singular explanations are rarely perfect fits. Adjustments based on new data are *necessary* and *scientific*.
          *   **Defensible Qualifications:** Each qualification ("not preserved," "disturbed," "partial effect") is *individually plausible* and *commonplace* in the field. These aren't fantastical excuses like "alien cover-up," but standard considerations when interpreting archaeological sites.
          *   **Peer Review & Credentials:** The group operates within the mainstream academic system (major university, peer-reviewed journals). Their work is scrutinized by experts. This institutional context legitimizes their methodology.
          *   **Not Final:** They would insist they *are* open to falsification *in principle*. If, for example, *multiple* key sites across the affected region *all* perfectly preserved other expected signatures *except* this one, *and* showed no signs of disturbance, *and* evidence indicated the collapse was sudden and universal, *then* they might reconsider. They would claim the current counter-evidence is simply *not yet sufficient* to overturn a well-supported theory, warranting qualification, not abandonment. They frame their adjustments as nuanced refinement, not evasion.

  **In essence:** Your teacher sees pseudohistory defined by an *unbreakable shield* against evidence. The research group, despite its credentials, deploys a shield of plausible qualifications. Her likely verdict is pseudohistory because, like Atlantis being perpetually undiscovered, their specific causal event perpetually evades disconfirmation through methodological maneuvering. The defender counters by claiming this maneuvering is just the normal, messy process of doing rigorous history with imperfect data.
