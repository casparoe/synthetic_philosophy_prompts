prompt: |-
  I'm doing an MA in practical ethics and I've been slowly talked round to a position I used to find frankly repugnant, which is that moral trade — the thing where two people who disagree morally each give up something they care about less in exchange for the other giving up something they care about more, so each ends up closer to their own ideal — isn't just permissible but is something we probably have a pro tanto duty to do a lot more of. My mates think I've lost it, and honestly the bit I find most convincing is the bit they hate most: that it doesn't matter a jot if the person you're trading with holds views you find monstrous, and that the trade can be anonymous, indirect, and run through some kind of clearing house that sets an exchange rate between causes (so many units of animal-welfare concession to one unit of immigration-policy concession, or whatever). Lately I've been chewing over a few extensions that seem to follow and that I can't decide if they're features or reductios — trades where the commodity isn't an action but your advocacy or your vote, trades where one side is a group you're not a member of and can't really speak for, trades across time where you concede now and they concede later and someone has to hold the promise, and trades where your counterparty is simply mistaken about the facts and would give you a much worse deal if they knew what you know.

  What I want is the strongest honest case against the whole thing, but done properly — not a list of things that make me feel icky, but the observations, arguments, intuitions and formal results that should actually move me, sorted from fatal to merely awkward. I'd especially like the defeaters that a sympathetic defender of moral trade would themselves concede rather than only the ones critics throw at it, and an honest verdict on whether the view has been quietly insulated into unfalsifiability by all the caveats it's accumulated (sincerity, no coercion, informed consent, no one's rights get violated, both sides better off ex ante) such that it never actually gets to endorse a real trade — and if that's what's happened, whether that's a problem for a view of this kind or just what any sensible view looks like once it's grown up. Tell me too what the position predicts that its rivals don't, in particular the rival that says moral commitments just aren't the sort of thing that can be traded at all, and whether the clearing-house exchange-rate machinery covertly assumes some interpersonal comparability of moral value that, if it doesn't hold, sinks the entire project rather than just making the arithmetic hard. And I'd be curious whether the erosion objection — that a world where everything is tradeable corrodes the norm that some things aren't for sale, and that the corroding is itself a moral cost the trade doesn't price in — is a genuine defeater or just a side-constraint that a clever defender can absorb. I'll say up front what I'd personally find most persuasive: I don't think I'd be moved by anything that just reasserts that some values are sacred, but I think I would be moved by a case where the trade works exactly as advertised and the world still comes out worse, or where the machinery turns out to be doing something under the table that the parties never agreed to.
reasoning: |-
  Okay, let me try to unpack this user's query. They're doing an MA in practical ethics and have shifted towards supporting moral trade, even in cases involving morally repugnant views. Their friends are critical, and they want the strongest counterarguments. 

  First, I need to understand their position deeply. They're not just looking for surface-level criticisms; they want rigorous, potentially fatal flaws that even proponents would acknowledge. The key areas they highlighted include trades involving advocacy/votes, representation issues, time-delayed concessions, information asymmetry, and the clearing-house model. 

  The user seems to value intellectual honesty. They mentioned being unswayed by "icky" feelings or appeals to sacred values but would engage with scenarios where trades backfire structurally. That's crucial—their vulnerability is systemic failure, not disgust.

  Hmm, the erosion objection stands out. They framed it as a potential side-constraint, but I wonder if there's empirical work on how marketization corrodes non-market norms. Titmuss's blood donation studies might be relevant here—showing market mechanisms displacing altruistic motives. Could that apply to moral commitments? 

  The clearing-house exchange-rate mechanism feels fragile. If it relies on interpersonal comparability of moral value, that's philosophically thorny. Even in welfare economics, comparability is controversial. Maybe this sinks the project rather than just complicating it. 

  The "insulation into unfalsifiability" point is sharp. If every real-world trade violates a caveat (sincerity, consent, etc.), does the theory become vacuous? Proponents might argue that idealization is necessary, but then what's the practical value? That tension needs probing. 

  For prediction differences: rivals like deontologists would say moral duties aren't alienable. Predictively, moral trade would expect coalition shifts (e.g., anti-abortion + vegan alliances), while rivals would expect stable moral tribes. Real-world examples? The user might appreciate concrete cases. 

  On delayed trades: the collateral damage risk seems underexplored. If I trade away future advocacy on refugees for a current animal welfare win, who bears the cost when displaced refugees suffer? The "promissory note" metaphor breaks if the harmed aren't consenting parties. 

  Information asymmetry feels particularly damning. If I know migrant detentions are more brutal than my counterpart realizes, the trade exploits their ignorance. Defenders might call it "efficiency," but it mirrors predatory markets. That could trigger the user's "world comes out worse" criterion. 

  I should also consider if moral trade inadvertently legitimizes extreme views. Negotiating with a white supremacist might signal that their framework is negotiable rather than abhorrent. That's not just erosion—it's endorsement risk. 

  ...Wait, did the user mention "conceding advocacy"? That’s voting or public support. If I trade my vote on immigration policy for someone else's concession on farm subsidies, am I betraying democratic representation? Constituents didn’t consent to that bargain. 

  The group representation issue is messy. If I "trade" concessions on behalf of future generations or marginalized groups without their input, it’s paternalistic at best. Climate policy trades might fit here—sacrificing future welfare for present gains. 

  Ultimately, the strongest case might be that moral trade’s efficiency claims depend on a fungibility that doesn’t hold. If values aren’t interchangeable commodities (even with exchange rates), the whole machinery collapses into false precision. That’s not arithmetic difficulty—it’s category error. 

  The user’s "under the table" request makes me think of preference laundering: trading lets people mask selfish choices as moral compromises. E.g., "I’ll concede on refugee rights so I can keep eating steak" becomes framed as noble pragmatism. That’s insidious. 

  ...I should probably structure this from fatal to awkward. Comparability failure first, then insulation/unfalsifiability, then collateral damage and information asymmetry. Save erosion for last—it’s potent but more gradual. 

  Gotta check if there’s formal work against this. Ord’s "Moral Trade" paper concedes some pitfalls but might underestimate how often they manifest. Maybe emphasize that in non-ideal theory, the caveats rarely align. 

  Final thought: the user’s shift suggests they’re intellectually brave. The counterattack needs equal rigor. No strawmen.
answer: |-
  Here’s the strongest honest case against moral trade, structured from potentially fatal flaws to thorny complications. I’ve drawn on formal ethics, game theory, and real-world constraints, prioritizing arguments that proponents should take seriously — and flagging where your view might be unfalsifiable.

  ### **Potentially Fatal Defeaters**  
  1. **The Interpersonal Comparability Problem (The Exchange Rate Mirage)**  
     - **Core Issue**: The clearing-house model assumes a *common metric* for moral value (e.g., "1 unit of animal suffering = 0.2 units of human rights violation"). But if moral commitments are incommensurable across agents (e.g., a vegan’s suffering-at-slaughter vs. a nativist’s border-violation aversion), no stable exchange rate exists.  
     - **Why It’s Fatal**: Proponents (e.g., Ord, MacAskill) concede this is the "Achilles' heel." If comparability fails, trades collapse into subjective guesswork, inviting exploitation or arbitrage (e.g., I trade cheap concessions you overvalue). Unlike economic utility, there’s no revealed preference or currency to anchor comparisons.  
     - **Proponent’s Concession**: Even sympathetic defenders admit this could sink the project if comparability is metaphysically impossible (e.g., Parfit’s "Repugnant Conclusion" terrain).  

  2. **Collateral Damage & Third-Party Rights**  
     - **The Silent Victim Problem**: Moral trades often impose costs on *unconsenting third parties*. Example: You trade your vote against factory farming for my vote against refugee resettlement. Refugees/animals bear costs without representation.  
     - **Formal Flaw**: Violates the "Pareto improvement" ideal. If trades only require *ex ante* consent of traders but harm outsiders, they fail basic welfare economics. Rights-based theories (e.g., Nozick) condemn this as using others as means.  
     - **Prediction Rival**: Deontologists predict trades will systematically ignore duty-bearers; utilitarians worry net harm increases if victims’ interests are discounted.  

  ### **Serious but (Perhaps) Solvable Challenges**  
  3. **Time-Delayed Trades & Commitment Failure**  
     - **The Broken Promise Trap**: In cross-temporal trades (e.g., "I concede immigration limits now; you ban fur farms in 2030"), enforcement is impossible without coercion. Future agents may renege or reinterpret terms.  
     - **Game Theory Reality**: Repeated interactions *could* foster trust, but anonymous/clearing-house trades lack this. Defenders (e.g., Easterbrook) suggest escrow or bonds, but this monetizes morality — arguably corrupting the act.  

  4. **Epistemic Asymmetry as Exploitation**  
     - **The Informed Consent Paradox**: If you trade with someone factually mistaken (e.g., an anti-vaxxer who undervalues lives saved by vaccines), you gain concessions based on their ignorance. This isn’t mutual benefit — it’s predation.  
     - **Proponent’s Dilemma**: Requiring full information makes trades vanish (who is fully informed?). Allowing asymmetry turns moral trade into a market for gullibility.  

  5. **Advocacy/Vote Trading Erodes Democracy**  
     - **Representation Without Authorization**: Trading your vote or advocacy (e.g., "I’ll publicly support policy X if you support Y") breaks the principal-agent link. Voters/constituents didn’t consent to your side deal.  
     - **Erosion Amplified**: Unlike pork-barrel politics (which is transparent), moral vote trading hides behind ideology, weakening accountability. Predicts *less* coherent policy, not more.  

  ### **Awkward Complications & Erosion Risks**  
  6. **The Unfalsifiability Trap (Caveat Inflation)**  
     - **Insulation Critique**: Your caveats — "no coercion," "informed consent," "no rights violated" — may render the theory vacuous. Real-world trades *always* risk hidden coercion (e.g., structural poverty), imperfect information, or third-party harm.  
     - **Sympathetic Defender’s Worry**: If moral trade only endorses impossible ideals, it loses action-guiding force. Rivals (e.g., virtue ethics) handle non-ideal cases better.  

  7. **Erosion of Moral Integrity**  
     - **Corrosion as Moral Cost**: Titmuss’s *The Gift Relationship* shows markets crowd out altruism. If moral commitments become tradeable commodities, we may lose the capacity to hold them sacred.  
     - **Not Just "Icky"**: Empirical psychology (e.g., Tetlock’s "sacred values") finds trading taboo values causes cognitive dissonance, distrust, and *reduced cooperation*.  
     - **Can Defenders Absorb This?** Only by accepting massive transaction costs (e.g., "trade only when erosion risk < gains"). But this concedes erosion is real and potentially decisive.  

  8. **Legitimizing Monstrous Views**  
     - **The Endorsement Effect**: Trading with bigots (e.g., exchanging anti-racism concessions for anti-speciesism gains) signals their moral framework is negotiable. This *amplifies* their credibility (e.g., "Even ethicists deal with us!").  
     - **Rival Prediction**: Absolutists argue this normalizes evil; moral trade predicts reduced extremism via cooperation. Evidence from political bargaining (e.g., coalition governments) shows mixed results — sometimes it moderates, sometimes it empowers.  

  ---

  ### **Where Your View Stands**  
  - **Strongest Prediction vs. Rivals**: Moral trade uniquely predicts **coalitions across moral tribes** (e.g., animal rights activists + anti-abortionists trading concessions). Rivals predict stable in-groups or universalist expansion.  
  - **Is It Unfalsifiable?** Not yet — but it risks becoming so if caveats multiply. Test: Does it ever endorse a *real, non-trivial* trade? If all examples are hypothetical (e.g., "Suppose two perfectly rational agents..."), it’s inert.  
  - **The "World Comes Out Worse" Case You Requested**:  
    **Scenario**: Vegan V trades with Nativist N. V concedes on border controls (leading to family separations); N concedes on factory farming (reducing animal suffering). But:  
    - The trade leaks, energizing N’s movement ("See? We forced concessions!").  
    - Asylum seekers (unconsenting parties) suffer.  
    - V’s allies lose trust in them, fragmenting the animal rights movement.  
    **Result**: Net welfare decreases. Moral trade’s ledger ignores reputational damage, movement cohesion, and extremist reinforcement.  

  ---

  ### **Verdict**  
  Moral trade isn’t *obviously* incoherent, but its real-world viability hinges on solving comparability and collateral harm. At best, it’s a limited tool for non-urgent, reversible disputes among honest actors — not a general duty. The machinery *does* "do something under the table": it smuggles in **consequentialism** and **fungibility** assumptions that deontologists/Kantians reject categorically. If moral commitments are irreducible duties (e.g., "human rights aren’t for sale"), trading them is corruption, not compromise.  

  **Recommended Test**: Propose a *specific, real-world* trade to your mates. If every objection feels like a caveat ("Ah, but with perfect information and no third parties..."), your view may have hardened into dogma. If not, you’ve found a lab to stress-test it.
