prompt: |-
  I'm building a unit for an applied-ethics course on the moral status of everyday conventions, and I keep hitting the same gap: everyone has confident intuitions about tipping, queueing, and jaywalking, but no one has written down what a theory of these practices would actually have to accomplish before we start arguing over whether any particular norm binds us. So please act as a philosopher working across moral philosophy, social ontology, and the theory of convention, think carefully and brainstorm the full space of cases before you commit to anything, and produce a specification rather than a verdict -- the desiderata that any adequate theory of the normative force of local conventions must satisfy.

  To keep us off the examples everyone rehearses, treat the following invented practices as part of the test set, alongside the familiar ones (tipping at a restaurant, first-come-first-served queues, crossing mid-block when no traffic is coming). In the fictional town of Marrow Bay, drivers at a four-way stop wave through whoever arrived second rather than first, on the reasoning that the first arriver has already been waiting and is therefore the patient one; locals regard a driver who insists on the ordinary order as rude. In the same town, mourners leave a smooth stone on a bereaved neighbour's windowsill, and omitting the stone is taken as evidence that you did not care. At a Marrow Bay café the bill already includes service, yet the staff expect a written note of thanks in a book by the door, and leaving nothing reads as a rebuke. On the local bus, boarding passengers thank the driver aloud, and visitors from a city where no one does this are thought cold. Assume further that some local conventions are morally odious -- for instance a custom requiring the youngest person present to eat last, which in practice falls hardest on members of one sex -- and that conventions change, so that what was obligatory a generation ago now marks you as a crank.

  Now give me the requirements list. For each desideratum, state the requirement in a sentence, give the case or consideration that motivates it, and say whether it is non-negotiable or merely a preference of one camp -- and be willing to tell me that some of the things people demand of such a theory (that it derive obligation from consent, that it make every convention morally binding, that it be silent on manners, that it treat visitors exactly like locals) are prejudices rather than genuine requirements. I especially want the part where you identify any subset of the requirements that cannot be jointly satisfied -- say, a requirement that obligations be knowable or voluntarily assumed running against a requirement that outsiders be bound by conventions they have never heard of, or a requirement that only just conventions bind running against the thought that the moral force of a convention is independent of its content -- and explain why the tension is not merely apparent. Close by naming the single requirement that does the most to eliminate otherwise popular theories, and, if you can do it briefly, a few lines on how a Humean coordination account, a Kantian universalizability account, and a virtue- or civility-centred account fare against the list. A table is welcome for the requirements themselves. Do not give me a reading list or citations; the cases I have supplied are the material, and I want your reasoning about the criteria, not a survey of who said what.
reasoning: |-
  Hmm, the user is building an applied ethics unit on the moral status of everyday conventions and needs help developing a specification for what a theory of these norms must accomplish. They're frustrated that everyone has intuitions about practices like tipping or queueing, but no one has systematically outlined what makes a convention binding.

  The user presents several test cases: both real-world examples (tipping, queueing, jaywalking) and fictional scenarios from "Marrow Bay" involving unconventional traffic norms, mourning rituals, café thank-you notes, and bus etiquette. They also include morally problematic conventions (like youngest eating last) and note that conventions change over time.

  Key challenges they want addressed:
  - Identifying necessary features any theory must explain
  - Distinguishing genuine requirements from popular prejudices
  - Highlighting unavoidable tensions between requirements
  - Showing which requirement eliminates most theories
  - Briefly evaluating how major philosophical approaches handle these

  The user specifically wants:
  - A specification rather than verdicts
  - No citations or reading lists - just reasoning based on their cases
  - Clear delineation of non-negotiable vs debatable requirements
  - Explicit identification of irresolvable tensions
  - A table organizing the desiderata

  Important nuances from their examples:
  - Conventions can be morally neutral (queueing), positive (mourning stones), or negative (discriminatory eating customs)
  - They involve both coordination (traffic) and expression (thank-you notes)
  - Binding force varies by role (locals vs visitors)
  - Change over time affects obligations
  - Social perception matters ("reads as a rebuke")

  Core philosophical tensions to address:
  1. Voluntarism vs social embeddedness (can you be bound by rules you didn't choose?)
  2. Content-independence vs moral scrutiny (must binding conventions be just?)
  3. Knowability vs obligation (can unknown rules bind?)
  4. Stability vs moral progress (how can conventions change if binding?)

  The fictional cases help isolate variables:
  - Wave-through traffic shows conventional alternatives to functional equivalence
  - Mourning stones demonstrate expressive conventions without coordination function
  - Café notes reveal hybrid transactional/expressive norms
  - Bus greetings highlight in-group markers
  - Discriminatory custom forces confrontation with unjust conventions

  For the output structure:
  - Table of desiderata with requirement, motivation, and negotiability status
  - Analysis of irreconcilable tensions
  - The "theory killer" requirement (likely #3: content-independence)
  - Brief evaluation of Humean, Kantian, and virtue approaches against the list
answer: |-
  Below is a specification of desiderata for a theory of the normative force of local conventions, derived from your cases (both real and fictional). I distinguish **non-negotiable** requirements (essential for any minimally adequate theory) from **preferences** (common but contestable assumptions). Irreconcilable tensions are identified, and the "theory killer" requirement is highlighted.  

  ---

  ### **Desiderata for a Theory of Conventional Normative Force**  

  | # | Requirement                                      | Motivating Case/Consideration                                                                 | Status              |  
  |---|--------------------------------------------------|----------------------------------------------------------------------------------------------|--------------------|  
  | 1 | **Must distinguish conventions from moral rules** | Morally odious conventions (e.g., youngest eats last) show conventions ≠ morality. A theory must avoid collapsing them. | Non-negotiable |  
  | 2 | **Must explain content-independence**            | *Same convention* (e.g., queueing) can be just or unjust; *different content* (e.g., tip vs. thank-you note) can bind similarly. Force cannot derive solely from content. | Non-negotiable |  
  | 3 | **Must account for variable scope**              | Visitors to Marrow Bay bus are bound to thank the driver; locals are bound to leave mourning stones. Obligations differ for insiders vs. outsiders. | Non-negotiable |  
  | 4 | **Must accommodate dynamism**                    | Conventions change (e.g., once-obligatory acts now mark you as a crank). Theory cannot treat conventions as static. | Non-negotiable |  
  | 5 | **Must address expressive function**             | Leaving a stone or thank-you note expresses care/respect; omitting it conveys rebuke/indifference (even without "harm"). | Non-negotiable |  
  | 6 | **Must explain pro tanto (defeasible) force**    | Odious conventions (youngest eats last) lack binding force; benign ones (Marrow Bay traffic wave) bind. Theory must allow override conditions. | Non-negotiable |  
  | 7 | **Must resolve epistemic accessibility**         | Visitors unaware of Marrow Bay’s traffic rule or café book are still judged. Force cannot require explicit knowledge. | Preference         |  
  | 8 | **Must avoid voluntarism as necessity**          | No one "consents" to tipping/jaywalking norms; they bind via participation. Consent cannot be foundational. | Non-negotiable |  
  | 9 | **Must reject universal bindingness**            | Café thank-you notes bind in Marrow Bay but not elsewhere. Not all conventions obligate universally. | Non-negotiable |  
  | 10| **Must integrate with social ontology**          | Conventions exist as collective attitudes (e.g., "omission = rebuke" requires shared interpretation). Theory must ground force in social facts. | Non-negotiable |  
  | 11| **Must separate manners from core morality**     | Insisting on standard stop-sign order is "rude" but not immoral. Theory should distinguish etiquette from duty. | Preference         |  

  ---

  ### **Irreconcilable Tensions**  
  Two pairs of requirements **cannot be jointly satisfied** without theoretical trade-offs:  

  1. **Tension: Epistemic Accessibility (#7) vs. Variable Scope (#3)**  
     - *Conflict*: If outsiders are bound by conventions they don’t know (#3), but obligations must be knowable (#7), the theory cannot simultaneously demand both.  
     - *Why not merely apparent?* Unknowable obligations violate moral agency for deontologists; yet social coordination requires binding outsiders (e.g., Marrow Bay bus). One must yield: either reject #7 (allow unwitting obligations) or restrict #3 (limit scope to knowledgeable agents).  

  2. **Tension: Content-Independence (#2) vs. Pro Tanto Force (#6)**  
     - *Conflict*: If normative force is content-independent (#2), odious conventions would bind; but pro tanto force (#6) says they don’t.  
     - *Why not merely apparent?* Content-independence is essential to explain *how* conventions work (e.g., arbitrary traffic rules bind). Yet #6 insists force is contingent on moral permissibility. A theory must either:  
       - (a) Deny #2 (force depends partly on content), weakening conventionalism; or  
       - (b) Deny #6 (odious conventions bind, weakly), violating moral intuitions.  

  ---

  ### **The "Theory Killer" Requirement**  
  **#2 (Content-Independence)** eliminates most popular theories:  
  - **Kantian accounts** (grounded in universalizability/rational consent) fail because conventions like Marrow Bay’s wave-through traffic are arbitrary and local, not universalizable.  
  - **Virtue/civility accounts** struggle because expressive conventions (mourning stones) bind regardless of character (a virtuous outsider might omit the stone unknowingly).  
  - **Humean coordination accounts** partially succeed by explaining content-independence (conventions solve coordination problems arbitrarily), but falter on expressive norms (thank-you notes don’t "coordinate" anything).  

  ---

  ### **How Major Theories Fare Against Key Desiderata**  
  | Approach               | Strengths                                  | Weaknesses                                   |  
  |------------------------|--------------------------------------------|---------------------------------------------|  
  | **Humean Coordination** | Explains #2 (content-independence), #10 (social facts), #4 (dynamism). Handles traffic/queueing. | Fails #5 (expressive norms like stones/notes lack coordination function), #6 (cannot explain override of odious conventions). |  
  | **Kantian Universalizability** | Explains #6 (pro tanto force via moral scrutiny), #11 (manners/morality split). | Fails #2 (content-independence), #3 (variable scope), #9 (universal bindingness). |  
  | **Virtue/Civility**    | Explains #5 (expressive function), #11 (manners). Suits thank-you notes/bus greetings. | Fails #2 (content-independence), #3 (variable scope), #4 (dynamism—virtues are stable). |  

  ---  
  **Final Note**: A viable theory must navigate tensions by prioritizing **social ontology (#10)** and **content-independence (#2)**, while accepting that force is **defeasible (#6)**, **non-voluntary (#8)**, and **scope-sensitive (#3)**. No theory satisfies all desiderata perfectly, but the gaps reveal where conventional normativity diverges from morality.
