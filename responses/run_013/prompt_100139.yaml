prompt: |-
  I am planning a single seventy-five-minute session for an advanced undergraduate seminar in metaethics — twelve students, one prior course in ethics, no prior exposure to metaethics — on the family of views that locate what an agent ought to do in what an idealized counterpart of that agent would endorse, where the counterpart is improved along some axis such as information, coherence, or concern for others. Do not explain the view to me; give me the plan for explaining it. Begin with the dependency order: which components must come before which, and why, including which prior problem has to be live for the idealization move to look like an answer rather than a stipulation, and which of the standard objections cannot even be stated until some later piece is in place. Then specify the one case that should carry the session — what it must contain so that the actual agent and her idealized counterpart come apart for a reason other than the agent's ignorance, what it must leave out so that the divergence cannot be dismissed as the agent simply being misinformed, and why the obvious candidates, such as a person who is wrong about the facts or a person who has not thought long enough, will not do. Next, the misconceptions, in the order the students will actually form them, with the exact point in the sequence at which to head off each: that idealized means thinking harder and longer; that the idealized verdict is a procedure the agent could follow; that idealization can only push an agent toward greater selfishness or only toward greater impartiality; and that the whole view is a dressed-up universalizability test. I also want the session to end with the students holding two things that look inconsistent — that the idealized counterpart is still in some sense them, and that its verdict can demand the surrender of something they actually care about — so tell me where in the sequence that tension should be allowed to surface rather than be resolved. Give me one closing question that would reveal whether they can separate the authority problem, why the counterpart's verdict binds the actual agent, from the determinacy problem, whether the idealization picks out a unique verdict at all, with a note on what a strong answer and a weak answer would each look like, and one exchange to have ready for the student who asks which idealization is the correct one. Finally, say what I should leave out at this level and announce that I am leaving it out.
reasoning: |-
  Okay, let me think through this metaethics seminar plan request. The user wants a tightly structured 75-minute session on ideal advisor theories for advanced undergrads who've had ethics but no metaethics. 

  First, I need to consider the dependency order carefully. The students must grasp why we'd even consider idealization before seeing how it works. That means starting with the authority problem of normative reasons - why should an agent care about some considerations? Without this foundation, idealization just looks like arbitrary stipulation. Only after establishing that can we introduce the core idealization move as a response. 

  For the central case study, I'm considering a conflicted artist scenario. It needs to show divergence beyond mere ignorance - so no factual errors. The tension should stem from partiality versus impartiality, where the agent's actual attachments conflict with what a more detached perspective would recommend. The artist case achieves this by making their commitment to art deeply personal yet possibly unjustifiable from an idealized view. 

  Anticipating misconceptions is crucial. Students will likely first think "idealized" just means more calculation time - I'll need to cut that off immediately when introducing the concept. Later, when discussing variants, they might confuse idealization with universalizability or assume it always favors selfishness/altruism. Each requires precise intervention points. 

  The unresolved tension should emerge when examining what makes the idealized self still "me". I'll let that hang in the air during the transition from case analysis to objections, using it to pivot to deeper questions about normative authority. 

  For the closing, I'll prepare a question separating authority ("why obey?") from determinacy ("is there one answer?"). Strong answers would recognize these as distinct problems; weak ones would conflate them. And if someone asks which idealization is correct, I'll emphasize that's the central debate - reframing it as the seminar's overarching question rather than resolving it. 

  What to omit? Definitely the specifics of different theorists' versions (Smith, Railton etc.) and semantic debates about "ought". I'll explicitly state we're bracketing those to focus on the conceptual core.
answer: |-
  Here’s a structured 75-minute session plan focusing on conceptual dependencies, targeted misconceptions, and unresolved tension:

  ---

  ### **Dependency Order (25 mins)**
  1.  **Start with the Authority Problem (10 mins):**  
      *Why:* Students must first grasp *why* we need idealization. Pose the question: "If moral facts exist, *why should this specific agent care*?" Highlight that desires/commitments vary. Without establishing that authority is problematic (e.g., "Why listen to reason if I don’t care?"), idealization seems ad hoc.
  2.  **Introduce the Idealization Move (10 mins):**  
      Frame it as a *response* to the authority problem: "What if the agent *would* care if they were 'better' in key ways?" Define core axes (information, coherence, concern) as attempts to capture "better" without smuggling in external standards.
  3.  **Delay Standard Objections (5 mins):**  
      *Why:* Key objections (e.g., **alienation** ["It’s not *me* anymore!"], **deliberative impotence** ["I can’t *use* this!"]) require the concept of "idealization-as-response" to be in place. Save these for *after* the case study.

  ---

  ### **The Pivotal Case: "The Resentful Benefactor" (20 mins)**
  *   **Scenario:**  
      *Aya* works tirelessly at a high-paying job to fund her sibling’s life-saving medical treatment. She deeply resents this burden, wishes she could abandon them, but acts out of familial guilt. An idealized Aya (fully coherent, empathetic, informed) would endorse helping *joyfully* as expressing her core values.
  *   **Why This Case Works:**  
      - **Divergence beyond ignorance:** Aya knows all facts; the clash is due to *attitudinal flaws* (resentment, incoherence between values/feelings).  
      - **Not misinformed:** She accurately knows costs/benefits.  
      - **Why "obvious candidates" fail:** Ignorant agents (wrong facts) or hasty thinkers (incomplete reasoning) allow dismissing divergence as epistemic failure. This case forces focus on *character/perspective*.
  *   **Use:** Contrast actual Aya’s resentment vs. idealized Aya’s endorsement. Ask: "Would idealized Aya’s verdict *bind* the actual Aya? Why/why not?"

  ---

  ### **Sequencing & Debunking Misconceptions (15 mins)**
  Interrupt misconceptions *as they naturally arise* during the case analysis:
  1.  **"Idealized = More Thinking Time"**  
      *When:* As you describe "coherence."  
      *Head-off:* "Clarity ≠ duration. Aya might brood for years without resolving her resentment. Idealization fixes *structural* flaws in her practical reasoning."
  2.  **"I Can Just Do What Ideal Me Would Do"**  
      *When:* During Q&A after case discussion.  
      *Head-off:* "Can resentful Aya *choose* to feel joyful? The ideal verdict may be *psychologically inaccessible* to her actual self (deliberative impotence)."
  3.  **"Idealization Only Promotes Selfishness/Impartiality"**  
      *When:* When contrasting axes (e.g., "concern for others").  
      *Head-off:* "It depends on the *starting point*. A selfish agent’s idealized self may become more impartial; an overly self-sacrificing agent’s idealized self may regain self-concern (coherence!)."
  4.  **"This is Just Universalizability"**  
      *When:* Likely during authority discussion.  
      *Head-off:* "Universalizability asks: 'Could everyone do this?' Idealization asks: 'What would *a better version of **you*** endorse?' It’s *agent-relative*."

  ---

  ### **The Unresolved Tension (5 mins before objections)**
  *   **Surface the Tension:** During the Benefactor case debrief, pose:  
      *"The idealized Aya is 'her' (built from her values, cohered) yet demands she surrender her deeply felt resentment. How can both be true?"*  
  *   **Do NOT resolve:** Let dissonance linger. Transition to objections: "This tension underpins key critiques..."

  ---

  ### **Closing & Key Question (10 mins)**
  1.  **Closing Question:**  
      *"Could the idealization procedure be both* ***authoritative*** *for the actual agent (solving the ‘why listen?’ problem) and* ***radically indeterminate*** *(failing to specify a unique verdict)? How?"*  
      - **Strong Answer:** Distinguishes the problems clearly. E.g., "Even if many verdicts are ‘ideal’ (indeterminacy), one might argue *any* is binding if it meets minimal criteria (authority)."  
      - **Weak Answer:** Conflates issues. E.g., "If it’s not unique, it can’t be binding."
  2.  **Exchange for "Which Idealization is Correct?":**  
      *Student:* "But which *kind* of idealization (full info? coherence? impartiality?) is right?"  
      *You:* "That’s the central debate! Each variant answers a different *version* of the authority problem. Railton’s ‘objectified interests’ (info + coherence) vs. Smith’s ‘rational unity’ (coherence + impartial concern) reflect different views of what makes a verdict *authoritative*. We lack a meta-standard to judge them... yet."  

  ---

  ### **Explicit Omissions**
  *   **Announcement:** "Today we treat ideal advisor theories as a *family* responding to the authority problem. We **omit**:  
      1. Specific theorists (e.g., Railton vs. Smith vs. Firth),  
      2. Semantic debates (e.g., does ‘ought’ *mean* ‘what my ideal self would advise’?),  
      3. Whether idealization requires convergence across all agents.  
      Why? To isolate the *core motivational structure* and its challenges."  

  ---
  **Timing Buffer:** Build in 5 mins flex (e.g., shorten case discussion if dependency chat runs long).  
  **Goal:** Students leave grappling with the *binding force* of an ideal self’s demands, seeing idealization as a contested but compelling response to normativity’s source.
