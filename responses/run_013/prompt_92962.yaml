  I am a software engineer with no formal background in philosophy, and I have been working through a popular book on consciousness. Its treatment of Daniel Dennett runs more or less as follows. Descartes held that the mind contains an inner theater, the 'Cartesian theater', in which the contents of consciousness are displayed to an inner audience, and he placed that audience in the pineal gland; Dennett's contribution is to show that no such single place exists in the brain, since the processing is massively parallel. In its place Dennett offers the multiple drafts model: the brain continuously produces many partial interpretations of the incoming signal, these compete with one another, and whichever draft wins the competition is broadcast to the rest of the brain and thereby becomes conscious. On this picture there is no determinate answer to the question of when I became conscious of a stimulus, because consciousness is not an event that occurs at a moment but a retrospective narrative that the brain assembles afterwards. And since there is neither an inner show nor an inner spectator, Dennett concludes that the private, subjective glow we ordinarily call consciousness does not really exist, so that we are in effect zombies who merely believe themselves to be conscious.

  I would like to know how much of this I can trust. Please go through it claim by claim and tell me which parts a philosopher of mind who actually works on consciousness would accept as a fair statement of Dennett's position, which parts they would wince at as a simplification or a conflation, and which parts are simply wrong; wherever the summary misstates something, say what the real claim is and why the difference matters. I am especially unsure about the final sentence, since it strikes me as the sort of thing that would be a scandal if a philosopher really said it, yet I have also heard Dennett described as denying consciousness, so I do not know what to think. Finally, tell me whether the conclusions the summary draws, that consciousness does not exist and that we are zombies, actually follow from the parts of the account that are correct, or whether they follow only from the misreadings. Please do not quote long passages at me; I want the argument in your own words. And please write the answer as continuous prose, in the manner of a long email: no headings, no bullet points, no bold or italicized emphasis, and no tables.
