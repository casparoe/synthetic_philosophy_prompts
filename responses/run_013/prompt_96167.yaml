  Hmm, I need to map this precisely to epidemiological terms. The key elements seem to be: indefinite causal chains (like infinite mediator pathways), unmeasured confounding at every step (hidden variables), and effect modification that spirals out of control. But the residue analysis is where it gets juicy - what survives translation?

