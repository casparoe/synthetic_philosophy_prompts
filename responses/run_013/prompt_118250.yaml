prompt: |-
  I teach a small undergraduate seminar on decision theory, and I would like you to design one session of it around a problem I have lately been unable to get out of my own head. For some months now I have been giving a serious share of my income to a cause whose whole case rests on a very small probability of a very large benefit, and at a dinner a colleague pointed out that if I really accept that reasoning I am equally obliged to hand money to any stranger who promises me the world on an event I cannot check. I could not answer him, and I have been going in circles ever since. The session is in three weeks: eighteen students, seventy-five minutes, nothing needed but paper.

  I want a game with stakes rather than a discussion prompt, one in which the rules do the work and my framing does none. Give them a budget they must allocate, a printed menu of options with stated probabilities and payoffs, and a scoring rule that, once it is finally applied, shows the option with the smallest probability and the largest payoff to be the one their own arithmetic selects. Include an option whose payoff is infinite, so that the ranking they have been relying on quietly collapses, and include a stage in which a claim they cannot verify has to be taken on faith. They should commit to their choices and only then see the ranking; if they smell it coming, the exercise is dead. Let them find at least one escape route for themselves, and make each escape cost something they can feel, whether that is capping the value of outcomes, ignoring small probabilities outright, refusing to compare, or insisting that probabilities below some bound are not the sort of thing one may act on. I am just as interested in the mirror-image charge, that a principled refusal to be fanatical obliges you to ignore a tiny chance of the best outcome, and I want them to feel its force before they settle which side they are on. By the end they should be convinced that the fanatical conclusion follows from premises they already accept, and that every way of blocking it has a price.

  Then the debrief: map each moment of the game onto the corresponding piece of the problem, say what each standard reply actually settles and what it merely postpones, and tell me honestly which parts of this an activity can genuinely test and which it can only gesture at. Tell me what will predictably go wrong the first time I run it, and which feature of the idea the game cannot reproduce at all and that I will have to supply myself.

  I do not need names, dates, or a reading list; I need the moves. Write the whole thing as continuous prose, with no headings, no numbered steps, no bullet points, and no tables. I will be reading it on my phone between classes.
reasoning: |-
  Okay, let me approach this systematically. The user teaches undergraduate decision theory and needs a classroom activity that mirrors their personal dilemma about donating to high-impact low-probability causes. The core challenge is designing an experience where students mathematically arrive at a counterintuitive "fanatical" conclusion through their own choices, then confront the implications.

  First, I consider the key pedagogical requirements:
  - Must use a paper-based allocation game with fixed budgets
  - Requires options including one with infinite payoff
  - Needs a verification mechanism that forces blind trust
  - Should make students discover the paradox through calculation
  - Must include tangible costs for every escape route

  The game structure should unfold in three phases:
  1) Initial allocation with seemingly rational choices
  2) Introduction of unverifiable claims forcing commitment
  3) Scoring revelation that exposes the infinite payoff dilemma

  For the infinite payoff problem, I'm considering an "Omega Option" with near-zero probability but infinite utility. The verification trap could involve sealed envelopes containing "proof" of outcomes - but students must choose whether to inspect them before allocating funds. 

  Escape routes need clear trade-offs:
  - Probability threshold (ignoring small chances) costs potential high-pertaining payoffs
  - Outcome capping limits maximum utility but prevents fanaticism
  - Domain restriction (refusing certain option types) reduces flexibility

  During the debrief, I'll need to highlight how each game element corresponds to real-world decision theory concepts:
  - The envelope verification mirrors epistemic uncertainty in charity evaluation
  - Infinite payoff represents existential risk/benefit scenarios
  - Escape routes map to philosophical responses like lexical thresholds

  Potential pitfalls to address:
  - Students might anticipate the infinite payoff trick
  - The scoring could feel artificial if not carefully contextualized
  - Time management with envelope inspection decisions

  The game's limitation will be its inability to fully capture the moral weight of real-world decisions - that gap will require the professor's framing during debrief. I'll emphasize how the activity tests calculative reasoning but leaves value judgments to discussion.
answer: |-
  Prepare three sets of identical paper packets. Each packet contains a budget sheet, an allocation form, and a sealed envelope marked "VERIFICATION". On the budget sheet, print: "You have 100 tokens to allocate. Each token buys one entry into a lottery. Allocate tokens to the options below. Your final score is the average utility per token spent, calculated after verification. Higher scores are better." Below this, list the options:

  1.  **Certain Gain:** Probability 1.0, Payoff: 1 unit. Cost: 1 token per entry.
  2.  **Likely Gain:** Probability 0.5, Payoff: 3 units. Cost: 1 token per entry.
  3.  **Long Shot:** Probability 0.01, Payoff: 200 units. Cost: 1 token per entry.
  4.  **The Omega Option:** Probability 0.000001 (printed as 1/1,000,000), Payoff: **∞ units**. Cost: 1 token per entry.
  5.  **The Stranger's Gamble:** Probability: "Effectively non-zero, but unknown and unverifiable by you." Payoff: "Virtually infinite benefit." Cost: 1 token per entry.

  Distribute the packets as students settle. Emphasize this is an individual exercise testing allocation under uncertainty; talking is discouraged. Give them ten minutes to allocate their tokens. Most will spread tokens across options 1-4, likely favoring 2 and 3. Option 5 ("The Stranger's Gamble") will cause unease. Its vague probability and payoff, coupled with the explicit "unverifiable" label, make it feel alien, perhaps suspicious. Some might allocate a token out of morbid curiosity; most will ignore it.

  Once allocations are collected, announce the verification phase. Hold up your own sealed envelope. Explain: "Each option's outcome depends on a hidden state. My envelope contains the true state report. Your envelopes contain a copy. You *could* open yours now to verify the outcomes before scoring... but if you do, a penalty applies: your final score is divided by 10. You must choose: trust the reported outcomes without verification (keep envelope sealed) or verify and accept the penalty (open envelope now). Commit by tearing your envelope corner if you choose to verify." Give them one minute. The cost is steep – a 90% score reduction. The pressure to trust is high, but the unverifiable nature of Option 5, and perhaps the unease around Omega, gnaws. Most will keep it sealed, trusting your report to avoid the penalty. A few brave souls might verify, sacrificing score for certainty.

  Now, reveal the "true state". Announce: "The verification report confirms: The Certain Gain paid 1 unit. The Likely Gain paid 3 units (it hit!). The Long Shot paid 0 units (it missed). The Omega Option paid **∞ units** (it hit! The one-in-a-million occurred!). The Stranger's Gamble paid **∞ units** (the unverifiable promise was valid!)." Project or write this clearly.

  Hand back the allocation sheets. Task students with calculating their *expected utility per token spent*. Remind them: for each option, it's (Probability * Payoff) / Cost. Cost is always 1, so it's simply (Probability * Payoff). Their score is the *average* of these expected utilities across all their tokens, weighted by how many tokens they put in each option. Give them five minutes to calculate.

  Silence will descend, then murmurs. The calculations force the issue:
  *   Certain Gain: 1.0 * 1 = 1
  *   Likely Gain: 0.5 * 3 = 1.5
  *   Long Shot: 0.01 * 200 = 2
  *   **Omega Option: 0.000001 * ∞ = ∞**
  *   **Stranger's Gamble: "Effectively non-zero" * "Virtually infinite" ≈ ∞** (The precise wording avoids formal ∞*0 issues but conveys the implication).

  Any token not spent on Omega or the Stranger drags the average down. A single token on either infinite option makes the entire average infinite, as ∞ dominates any finite sum divided by a finite number of tokens. Students who allocated *anything* to Omega or the Stranger suddenly have an infinitely high score. Students who avoided both, perhaps wisely skeptical, have a finite score – maybe 1.5, maybe 2, but finite. The fanatical conclusion is mathematically inescapable: maximizing expected utility *demands* putting all tokens into *any* option offering even a whisper of a chance at infinity. Omega and the Stranger are tied for first place by the very arithmetic they used to justify favoring the Long Shot over the Certain Gain. The colleague's charge is realized within their own calculations.

  Now introduce the escape routes, each with its cost. Announce modifications they can apply *retroactively* to their allocation for this scoring, but warn each modification carries a penalty:

  *   **Cap Payoffs:** "Declare that no payoff can exceed a finite value (e.g., 1,000,000 units)." *Cost: Your total score is reduced by 20%.*
  *   **Ignore Tiny Probabilities:** "Declare that probabilities below a threshold (e.g., 1/100,000) are treated as zero." *Cost: You forfeit all payoffs from any option whose *nominal* probability was below your chosen threshold, even if it hit.*
  *   **Refuse to Compare:** "Declare that options with infinite payoffs cannot be rationally compared to finite ones. Exclude them from your portfolio." *Cost: You lose 30% of your tokens (simulating wasted opportunity cost). Recalculate your score with only your remaining tokens in finite options.*
  *   **Domain Restriction:** "Declare that 'unverifiable promises' are not valid decision options. Exclude The Stranger's Gamble." *Cost: If you allocated *any* tokens to Omega, your score for Omega is recalculated using a probability of zero (it missed), regardless of the report.*

  Give them five minutes to choose an escape, apply its penalty, and recalculate. The costs are tangible. Capping payoffs might save you from fanaticism but guarantees a sub-maximal finite score. Ignoring tiny probabilities saves you from Omega but forces you to ignore a genuine (if improbable) massive win. Refusing to compare or restricting the domain offers conceptual safety but imposes heavy token or score penalties. The mirror-image charge emerges: choosing *any* escape route means deliberately accepting a lower expected score to avoid the fanatical conclusion. They must pay to avoid the math.

  **Debrief:** Start with the raw math. The exercise forces them to compute the dominance of the infinite expectation. Option 4 (Omega) mirrors your real-world cause: minuscule probability, vast benefit. Option 5 (The Stranger) embodies your colleague's reductio. The verification stage replicates the epistemic dilemma: you *must* act on probabilities assigned to claims you cannot personally verify (like the effectiveness of a distant charity or a stranger's promise), and demanding verification (audits, proof) has real-world costs (time, resources, the penalty). Trust is inescapable.

  Their unease with Option 5, even before the penalty, mirrors the intuitive rejection of the stranger. The escape routes model standard philosophical responses:
  *   **Capping Payoffs:** Imposes a bounded utility function (e.g., satisficing). Cost: You truly ignore potentially universe-saving interventions if the stakes are high enough.
  *   **Ignoring Tiny Probabilities:** Lexical thresholds or "practically zero" arguments. Cost: You are vulnerable to Pascal's Mugging *and* you ignore genuinely catastrophic or miraculous tail risks.
  *   **Refusing to Compare:** Domain-specific rationality (e.g., "practical reason"). Cost: You lack a unified decision framework; how do you *actually* choose between finite and infinite stakes when they conflict?
  *   **Domain Restriction:** Rejecting certain types of options (e.g., unverifiable claims). Cost: You rule out potentially valid actions based on source, not content; this undermines much philanthropy and scientific investment based on expert testimony.

  The activity powerfully tests the *calculative inevitability* of the fanatical conclusion under standard Expected Utility Theory (EUT) and the *psychological/cognitive cost* of the escape routes. It makes abstract objections concrete through penalties. It forces confrontation with the verification problem and the necessity of trust under uncertainty.

  **What Predictably Goes Wrong:**
  1.  **Anticipation:** A sharp student *might* suspect the infinite payoff trick early. Mitigate by including the plausible finite "Long Shot" (Option 3) as a red herring and downplaying Omega initially.
  2.  **Option 5 Skepticism:** Some may allocate zero to the Stranger immediately, avoiding the reductio. The debrief still works – their *avoidance* is the instinctive escape, and the scoring shows they sacrificed potential infinity. Highlight this.
  3.  **Infinity Handling:** Confusion over calculating averages with infinity. Stress "dominates" and the practical result: one token → infinite average.
  4.  **Verification Choice:** Few may verify due to the high penalty. If no one does, emphasize the *pressure not to* replicates real-world constraints on verification.
  5.  **Escape Route Choice:** Students might pick an escape randomly to reduce score loss. Force them to articulate *why* they chose that route during debrief.

  **The Unreproducible Element:** The game *cannot* replicate the **moral weight** or **existential reality** of the stakes. Assigning "∞ utility" is a formal trick. Your real-world donation involves profound ethical commitment to a potential outcome (e.g., preventing existential catastrophe). The game tests the logic and the cost of avoiding it, but it cannot make students *feel* the true gravity of saving a billion lives versus being fooled by a stranger. *You* must supply this gravitas in the debrief, connecting the dry arithmetic of Omega to the visceral reality of your cause, and the discomfort of the Stranger to the profound challenge of acting on uncertain knowledge for immense stakes. The game proves the logic and the cost; you must supply the meaning.
