  Okay, this user is preparing a metaontology session using the Pluto reclassification as a case study. They've provided a detailed factual background and want a strict verbal dispute analysis across five specific questions. 

  Hmm, they're clearly well-versed in philosophical methodology - note how they preemptively dismiss references by saying they know the literature. This is someone who wants rigorous conceptual dissection, not textbook answers. The British English requirement suggests either academic context or personal preference.

  Right, let's unpack their framework first. Their diagnostic tool has three clear steps: identify disputed term → check for non-linguistic factual disagreement → if none, determine if meaning disagreement is substantive. The whale/tomato dichotomy is classic Chisholmian paradigm stuff. 

  For question 1 about mapping parties... The dynamical vs structural camps disagree purely on taxonomic relevance (orbital dominance vs hydrostatic equilibrium). Astronomers vs public is trickier - laypeople care about cultural continuity while professionals prioritize systematic classification. And the IAU... ah, that's about institutional authority versus folk taxonomy. Must keep these layers separate.

  On question 2's diagnostic... The key insight is that nobody disputes Pluto's mass, orbit, or composition. The fight is entirely about which features should define "planet" - and that's normative, not factual. But is "taxonomic relevance" factual? Only if you believe natural kinds exist independently... which the structural camp might, actually. 

  Question 3's renaming test... If "helioplanet" existed, the scientific utility debate would continue (should orbital clearance matter?) but public outrage vanishes. That residual normative debate about classification purposes proves it's not purely verbal - there's a substantive disagreement about what taxonomy should achieve. 

  For question 4... Pluto resembles the tomato more than whale. Multiple valid classification systems coexist: astronomical vs cultural. The persistence comes from unresolved normative tension - scientists want predictive power, the public wants cultural continuity. If Pluto had aquatic life, it'd be like whale - but it doesn't.

  Question 5 is thorniest... The IAU absolutely engaged in conceptual engineering. Their definition wasn't discovered but engineered for solar system mechanics. The backlash? Mostly legitimacy challenge - why should astronomers decide cultural symbols? Though some dissenters genuinely defend structural taxonomy as "truer" classification.

  Better emphasize: the whale/tomato distinction isn't exhaustive. Pluto introduces a third type - taxonomy where multiple purpose-based definitions compete without one being "wrong". That's why the dispute feels deep - it's about scientific authority and cultural ownership, not just semantics.
answer: |-
  Here's a case analysis structured by your questions, adhering strictly to the facts provided and using British English throughout:

  ### 1. Mapping the Parties  
  **(a) Dynamical camp vs. Structural camp**  
  - **Disagreement**: Purely about **taxonomic relevance**, not facts.  
    - Structural camp: Argues "roundness" (hydrostatic equilibrium) is the defining feature for "planet" (a physical property).  
    - Dynamical camp: Argues orbital dominance ("cleared the neighbourhood") is essential (a contextual property).  
  - **No factual dispute**: Both accept Pluto’s size, orbit, and the existence of Kuiper Belt objects.  

  **(b) Astronomers vs. Public**  
  - **Disagreement**: About the **purpose and ownership of the term "planet"**.  
    - Astronomers (IAU): Seek a precise, dynamically useful taxonomy for solar system mechanics.  
    - Public/Schoolchildren: View "planet" as a cultural/symbolic category (e.g., mnemonics, educational tradition).  
  - **No factual dispute**: Both agree Pluto exists, is small, and shares orbital space.  

  **(c) IAU vs. Everyone Else**  
  - **Disagreement**: Primarily about **standing to decide**.  
    - IAU: Asserts authority as astronomy’s governing body to set technical definitions.  
    - Critics (public, dissenting astronomers): Reject IAU’s legitimacy to redefine culturally embedded terms.  

  ### 2. Running the Diagnostic  
  - **(i) Disputed term**: "Planet".  
  - **(ii) Non-linguistic facts?** **No disagreement**. All parties accept:  
    - Pluto’s size (< Moon’s mass), orbital similarities to KBOs, Eris’ discovery.  
    - Hydrostatic equilibrium (roundness) vs. orbital clearance as measurable properties.  
  - **(iii) Residual disagreement**: **Substantive**, but **normative**, not verbal.  
    - The core clash is *which properties should matter* for taxonomy.  
    - **Framework accommodation**: The machinery *can* handle this. "Which features matter" is a **normative question** about conceptual purpose (e.g., "Should taxonomy prioritise physical structure or orbital dynamics?"). This isn’t a third thing—it’s step (iii) revealing a non-factual but substantive dispute about concept choice.  

  ### 3. The "Fresh Word" Test  
  - **Scenario**: IAU coins "helioplanet" for dynamically dominant bodies, leaves "planet" undefined/folk usage.  
  - **Result**:  
    - **Public dissent vanishes**. No outrage over Pluto losing "planet" status.  
    - **Residual disagreement**: Astronomers still debate **whether orbital clearance should be a taxonomic criterion** for solar system bodies.  
  - **Analysis**:  
    - The public backlash *was* verbal (attachment to the word "planet").  
    - The **non-verbal residue** is the astronomers’ normative debate: *Should* orbital dynamics define a key category? This is substantive but not about facts—it’s about optimal classification for scientific modelling.  
  - **Verdict**: The test **works**. It isolates the normative core from verbal disputes.  

  ### 4. What the Episode Shows About the Theory  
  - **Deflationary line challenged?** **No—it confirms it**.  
    - The persistence stems from unresolved **normative questions** (e.g., "Should taxonomy serve mechanics or culture?").  
    - It feels "deep" due to cultural attachment and professional stakes, but the *factual* agreement shows the dispute is non-empirical.  
  - **Control case resemblance**: **Tomato** (not whale).  
    - **Why**: Like "fruit" (botanical) vs. "vegetable" (culinary), "planet" has **multiple context-valid meanings**:  
      - Structural: "Planet" = hydrostatically rounded body (scientific/physical).  
      - Cultural: "Planet" = major solar system icon (educational/historical).  
      - Dynamical: "Planet" = orbitally dominant (mechanical).  
    - **Whale defence fails**: Unlike fish/whales, no new discovery *falsified* Pluto’s planethood. It was always small/non-dominant; the IAU merely privileged one criterion.  
    - **For whale to fit**: Pluto would need properties contradicting *all* historical criteria (e.g., if it were a comet).  

  ### 5. Conceptual Engineering and Legitimacy  
  - **IAU’s role**: **Pure conceptual engineering**.  
    - They didn’t "discover" Pluto wasn’t a planet; they **redefined** "planet" to prioritise orbital mechanics over geophysics.  
  - **Public backlash**: **Primarily a legitimacy challenge**, not conceptual disagreement.  
    - Key grievance: "Why should astronomers dictate a cultural/educational term?"  
    - Secondary layer: Some structural-camp astronomers *also* reject the engineering (arguing roundness is "more fundamental").  
  - **Theory’s silence**: The machinery doesn’t address **who gets to engineer concepts**. The backlash highlights that normative disputes about taxonomy often mask power/authority struggles.  

  ### Summary Verdict  
  - The dispute is **not verbal** at root (there’s a substantive normative debate about taxonomy), but it **manifests verbally** via the word "planet".  
  - Pluto is a **tomato case**: Multiple purpose-relative definitions coexist. The IAU tried to impose one purpose (mechanics) on a culturally loaded term, sparking dissent.  
  - **Legitimacy matters**: The persistence of the "Pluto war" underscores that conceptual engineering in science can’t ignore social/cultural capital—even when the underlying theory is deflationarily sound.
