prompt: |-
  I host a small philosophy of language podcast, and next week's guest is a philosopher who has spent most of her career defending a deflationary picture of truth — the idea that 'true' is a thin, almost logical device for agreeing with a lot of claims at once rather than the name of some substantive property that our beliefs have to line up with. My co-host keeps joking that this will be twenty minutes of her saying truth isn't a real property and then we go home, so I want to make her work for it. She's very fluent in the standard exchanges, so please aim the questions at the places where I think deflationism actually feels pressure, and give me a follow-up attached to each one, keyed to the answer she's most likely to give, so I'm not stuck when she takes the predictable exit. I'd like somewhere between eight and ten questions. Concretely, I want at least one question on the generalizing or expressive function and its ugly cases — the way truth-talk lets us endorse a heap of claims without listing them, and then the cases that seem to break it, like a sentence that everything one person said is true while everything another said is true even though the two of them contradict each other, or quantification into positions that aren't names of things, or truth-talk about people who speak a language I don't, where the disquotationalist seems to need a translation in hand before she can even state her schema, which looks like smuggling in a real assumption about meaning. I also want at least one on whether truth earns its keep as an explanatory notion: whether a deflationary truth predicate can do the work a truth-conditional theory of meaning wants from it, whether it can underwrite the explanation that reliable ways of forming beliefs tend to produce true ones, and what to make of the formal result that bolting a truth predicate onto a base theory isn't conservative — does that show truth was doing substantial work all along, or can she absorb it? A third front is the value and normative side: truth as what inquiry aims at, truth as the norm of assertion, why anyone should care about truth at all if it's this thin, and whether deflationism really deflates the realism fight or just relocates it. And I'd like the last couple to press on the Liar and the logical machinery she needs to survive it — if the view ends up requiring a non-classical logic and a lot of technical scaffolding, in what sense is it still lightweight? It would also be good to end with something about what would actually make her give the view up.

  Order them so that her standard moves get progressively harder to reach for, and don't let any question be answerable with a one-line restatement of the position. One more thing, and this matters: give me the whole thing as continuous prose, the way you'd write me an email — no headings, no bullet points, no bold, no tables. If you need to number the questions to keep them straight, do it inline inside the sentences, but keep everything in flowing paragraphs with the follow-ups folded in right next to the questions they belong to. I'll be reading this off my laptop in the studio, so I dont want to be hunting around a document for things, and honestly I find prose easier to rehearse from.
