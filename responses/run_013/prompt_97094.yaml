  First, I need to recall Aristotle's main points. He argues that if future statements are true or false now, determinism follows, making deliberation pointless. But he wants to preserve contingency. The user is stuck on the tension between bivalence and excluded middle, and the asymmetry between past and future.

  The user mentions the actuality principle ("what is, is necessarily when it is"). They wonder if it applies to the future or past. I should explain that Aristotle uses this to distinguish between qualified and unqualified necessity. Past events, being actual, have qualified necessity, while future contingents don't exist yet, so no necessity applies.

  The past-future asymmetry is key. The user asks why saying "yesterday it was true there'd be a battle tomorrow" doesn't cause the same problem. Aristotle would say past truths are fixed because the past is actual, but future truths aren't fixed. The necessity is temporal, not logical.

