answer: |-
  You've nailed the central tension in *De Interpretatione* 9 — it's notoriously thorny, and scholars have debated it for centuries. Let's break down the moves, the ambiguities, and the scholarly reconstructions, keeping close to your excellent summary.

  **Aristotle's Problem (The Determinism Argument):**

  1.  **Bivalence (Assumed Premise):** Every declarative statement (affirmation or denial) about the past, present, or future is *now* either true or false (Principle of Bivalence: PB).
  2.  **Truth/Falsity Implies Necessity (The Fatal Step):**
      *   If it is *now true* that "There will be a naval battle tomorrow" (P), then it *cannot not happen*. It is *necessary* that it happens.
      *   If it is *now false* that "There will be a naval battle tomorrow" (~P), then it *cannot happen*. It is *necessary* that it does not happen.
      *   *(This step relies on a principle like: "If a proposition is true at time T about an event at time T+X, then the event's occurrence at T+X is fixed/necessary as of T".)*
  3.  **Universal Application:** This reasoning applies to *any* future-tense singular proposition.
  4.  **Conclusion (Determinism):** Therefore, *everything* that happens happens of necessity. Nothing is contingent (could be otherwise). Deliberation and action are pointless illusions. The future is as fixed as the past.

  Aristotle finds this conclusion **unacceptable** because it destroys contingency, free will, and the point of deliberation — things he deeply believes in.

  **Aristotle's Solution (The Core of Confusion):**

  He rejects the conclusion (determinism) but must block the argument. He attacks **Step 2** by qualifying **Step 1** for a specific class of statements.

  5.  **Qualification of Bivalence:** "In the case of things that are not always so or not always not so, but are capable of being and also of not being, for these it is necessary that *each* of the two contradictories [P or ~P] should be capable of being and not be necessary, and also that *neither* should be true or false *simpliciter* (haplōs)." (Standard paraphrase of the key line).
      *   **The Class:** Singular future contingent events (e.g., "This particular sea battle will occur tomorrow").
      *   **The Claim:**
          *   Neither P ("Battle will happen") nor ~P ("Battle won't happen") is *simply* (haplōs) true *now*.
          *   Neither is *simply* (haplōs) false *now*.
          *   *(He often adds that one may be* more likely *or* natural*, but not simply true/false).*
  6.  **Preservation of Excluded Middle (LEM):** However, Aristotle *emphatically maintains* the Law of Excluded Middle: "It is necessary for there to be or not to be a sea-battle tomorrow." (LEM: P ∨ ~P is necessarily true).
      *   *He does NOT say "It might neither happen nor not happen".* He insists the disjunction *must* hold. The battle either will happen or won't.
  7.  **The Actuality Principle & Qualified Necessity:** "What is, necessarily is, when it is; and what is not, necessarily is not, when it is not." (18b11-13, 19a23-27).
      *   This principle applies to the *present* and the *actual* past. When an event *is happening* or *has happened*, it is *necessary* **at that time** and **relative to that time**. This is "necessity *simpliciter*" only *when* the thing is actual.
      *   Crucially, **this necessity does not apply forward.** Just because something *will be* necessary *when it happens* (if it happens), does *not* mean it is necessary *now* that it *will* happen. The necessity is temporally qualified.

  **Fitting the Pieces Together: The Core Interpretations**

  The ambiguity lies in *exactly* what Aristotle means by "neither is *simply* (haplōs) true or false" for future contingents, while preserving LEM. There are two main scholarly camps:

  1.  **The Rejection of Bivalence (PB) Interpretation (More Common, Textually Closer?):**
      *   **Thesis:** Aristotle genuinely denies that singular future contingent statements have a *present* truth-value. They are neither true nor false *now*. PB fails for this class.
      *   **How it Fits:**
          *   Step 2 of the determinism argument ("Truth/Falsity now implies Necessity now") is blocked *at the root* because the statements aren't true or false now. There's nothing to ground the necessity.
          *   LEM is preserved: P ∨ ~P is necessary *because* one *will become* true tomorrow. The *disjunction* is necessary, but *neither disjunct* has a truth-value *yet*. The necessity is of the *alternatives* (battle or no battle), not of a specific outcome.
          *   **Actuality Principle's Role:** It explains *why* past/present statements *do* have truth values and exhibit necessity *simpliciter* relative to their time: they are actualized. Future contingents aren't actualized yet, so they lack a definite truth-value *now*. The principle highlights the temporal asymmetry.
          *   **Past-Future Asymmetry:** Statements *about the past* (e.g., "It was true yesterday that there would be a battle today") *are* true or false *now* because they refer to an *actualized past state of affairs* (yesterday's reality, including yesterday's future). Yesterday, *that* future (today) was not yet actualized, so *yesterday* the statement "There will be a battle tomorrow (today)" *may not have been* true or false *yet*. The truth-value is fixed only when the relevant time becomes present/past. Truth supervenes on actuality. The past is fixed *because* it's actual; the future is open *because* it's not.
      *   **Scholarly Reconstruction:** This reading is quite close to the text's claim that "neither is *simply* true or false". The heavy lifting comes in explaining *how* LEM holds without PB (modern logics like supervaluationism or Lukasiewicz's three-valued logic offer models, but Aristotle didn't have these). Critics argue Aristotle *needs* PB elsewhere or that rejecting it is messy.

  2.  **The Scope Distinction / Modal Interpretation (Often Associated with G. E. M. Anscombe, Hintikka, Frede):**
      *   **Thesis:** Aristotle *accepts* PB for future contingents. P and ~P *are* each true or false *now*. However, he denies that their *present* truth/falsity implies *present, unqualified necessity* of the future event (Step 2). He distinguishes the necessity *of* the truth-value from the necessity *in* the event described.
      *   **How it Fits:**
          *   LEM is preserved trivially (PB entails LEM).
          *   Step 2 is blocked by reinterpreting the necessity: "It is true that P" does *not* entail "It is necessary that P". The necessity applies only *when* the event is actual (Actuality Principle). The truth of "P" *now* entails only that P *will be necessary when it happens*, not that it is necessary *now* that it *will* happen. The necessity operator has narrow scope relative to time.
          *   **"Not simply true/false" Explained:** Scholars in this camp often argue that "haplōs" modifies the *implications* or the *kind* of truth, not the *existence* of truth-value. Perhaps Aristotle means the statements aren't "definitely verifiable" now, or that their truth isn't "necessary truth", or that affirming them doesn't carry the same force as affirming a past truth. The text "neither is simply true or false" is the hardest part for this view to accommodate directly.
          *   **Actuality Principle's Role:** It directly provides the model for the scope distinction: Truth about the future event *now* only entails the *future, qualified necessity* described by the principle (necessity-when-it-is), *not* present unqualified necessity. It defines the *only* kind of necessity events ever have – temporal, not eternal.
          *   **Past-Future Asymmetry:** Similar to the PB-rejection view. A past-tensed statement ("It was true that...") refers to an *actual past state* (which has its own qualified necessity), whereas a future-tensed statement refers to a not-yet-actual state. The truth *maker* for the past statement exists; for the future statement, it doesn't exist *yet*. The necessity we ascribe to the past is the qualified necessity of the actuality principle applied to past actualities.
      *   **Scholarly Reconstruction:** This reading does significant heavy lifting to interpret "neither is simply true/false" in a way that doesn't outright reject PB. It emphasizes the modal and temporal aspects of the Actuality Principle to block Step 2. It aligns better with Aristotle's apparent commitment to PB elsewhere and avoids introducing truth-value gaps.

  **Addressing Your Specific Questions:**

  *   **"Does he give up bivalence or mess with scope?"** Scholarly consensus is deeply divided. The text *explicitly says* "neither is simply true or false," which strongly suggests rejecting PB for future contingents (Interpretation 1). However, reconciling this with his robust use of LEM and potential commitments elsewhere leads others to prefer Interpretation 2 (scope/modal). Interpretation 1 is more textually literal for the key phrase; Interpretation 2 requires less overall revision to his logical system.
  *   **"Why the Actuality Principle?"** Its core function is to **define temporal necessity and create the asymmetry.**
      *   For **PB-Rejection (Int 1):** It explains *why* past/present statements *do* have truth-values (they're about actualities) and why future contingents *don't* (they're not).
      *   For **Scope Distinction (Int 2):** It provides the *model* for the only kind of necessity events have (temporal), blocking the inference from present truth to present, unqualified necessity. It shows that "It is true that P (future)" entails only "If P happens, it will be necessary when it happens," *not* "It is necessary now that P will happen."
      *   **It doesn't prove too much about the past:** The necessity it ascribes to the past *is* the qualified, temporal kind ("necessarily was when it was"). We *can* say truly *now* that a past event happened necessarily *in that sense*, but this necessity is *not* eternal or logical necessity. It's just the fixity of the actual past.
  *   **"Why is the past different?"** The asymmetry is **ontological, not merely epistemic or tensal.** The past is *actual*; the future (in contingent matters) is *not yet actual*, only *potential*. Truth depends on actuality (or, for Int 2, the truth *maker* depends on actuality). Saying *now* "It was true yesterday that there would be a battle today" is true *because* it accurately describes an *actual past state of affairs* (yesterday's reality). Crucially, *yesterday*, the statement "There will be a battle tomorrow (today)" *itself* may not yet have been true (Int 1) or, if true, did *not* entail that the battle was necessary *yesterday* (Int 2) – it only entailed that *if* it happened, it would be necessary *when* it happened (today). The necessity attributed *retrospectively* is the qualified necessity of the actuality principle applied to *today's* event (if it happened).

  **Modern Tense Logic: Gains and Losses**

  Logicians like A. N. Prior developed tense logic (branching time models) precisely to model Aristotle's intuition.

  *   **Tidying Up:** It provides a rigorous formal framework.
      *   **Branching Time:** Represents the open future (multiple possible futures) and the fixed past (single actual past).
      *   **Truth-Value Gaps (for Int 1):** Future contingents lack a truth-value on some branches until the branch is actualized. LEM holds globally (P ∨ ~P is true on all branches), but neither P nor ~P is true *simpliciter* at a past moment if the outcome isn't settled yet.
      *   **Ockhamist Semantics (for Int 2):** Truth is relative to both a moment *and* a future history (branch). "P (future)" is true *now* relative to a specific future branch where P happens. Necessity is defined as truth on *all* branches. "True that P" (relative to a branch) does *not* entail "Necessary that P" (true on all branches). The Actuality Principle is modeled by truth being tied to the single, actualized history as it unfolds.
  *   **What Gets Lost:**
      *   **Aristotle's Metaphysics:** The modern formalisms often lose the deep connection to Aristotle's concepts of *potentiality (dynamis)* and *actuality (energeia)* which underpin his distinction. For Aristotle, the "openness" isn't just logical; it's a fundamental feature of being for contingent beings.
      *   **The "Haplōs" Nuance:** The formalisms implement either PB-rejection or the scope distinction cleanly, but they don't capture the *reason* Aristotle might have used the ambiguous phrase "simply (haplōs)" – it might reflect his metaphysical grounding.
      *   **The Dialectical Context:** Aristotle's argument is presented as a response to a specific threat (logical determinism destroying contingency). The formal system stands alone.

  **In Summary:**

  Aristotle's core move is to block the inference from present truth/falsity to present necessity for future contingents. He does this by either:

  1.  **Denying they have a present truth-value at all (Rejecting PB),** preserving LEM by making the disjunction necessary while its disjuncts are indeterminate. The Actuality Principle explains why past/present statements *are* truth-valued and exhibit temporal necessity.
  2.  **Accepting present truth-value but denying it implies present, unqualified necessity (Scope Distinction),** using the Actuality Principle to define the *only* kind of necessity events ever have (temporal) and limit the implication of truth. The "not simply true/false" phrase is interpreted contextually.

  The **past-future asymmetry** is grounded in **actuality:** Past events are actual and fixed, possessing qualified temporal necessity. Future contingent events are not yet actual, only potential. Truth depends on actuality (or requires an actual truth-maker). Retrospective statements about past truths describe actual past states.

  Scholarly debate centers on interpreting "neither is simply true or false." The PB-rejection reading takes it literally but must reconcile it with LEM. The scope/modal reading preserves PB but must explain away that phrase. Both lean heavily on the Actuality Principle to establish temporal necessity and the asymmetry. Modern logic provides clean models but loses some Aristotelian metaphysics. The text remains ambiguous, but Aristotle's fundamental goal is clear: preserve genuine contingency and the efficacy of deliberation against the threat of logical determinism.
