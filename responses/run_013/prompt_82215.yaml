answer: |-
  Here's the breakdown of where the argument goes wrong, why it's tempting, the cost of rejecting it, and what you need to surrender:

  **The Step to Reject: Step (3)'s Inference is Invalid in the Supervaluationist Framework.**

  1.  **The Problem:** While (2) is correct (*"On every admissible precisification, 'there is a number n such that n grains make a heap and n−1 grains do not' is true"*), the move to (3) (*"Therefore, 'there is a number n such that n grains make a heap and n−1 grains do not' is true (simpliciter)"*) misapplies the supervaluationist truth definition.
  2.  **Why it Looks Acceptable:** Step (3) *looks* like a straightforward application of the supervaluationist definition: "A sentence is true just in case it is true on every admissible precisification." Since the sentence *is* true on every precisification (step 2), it seems to follow that it's true simpliciter. This feels like simple modus ponens.
  3.  **Why Supervaluationism Must Reject It:** Supervaluationism draws a crucial distinction between:
      *   **Truth-on-a-Precisification (T<sub>c</sub>):** A sentence can be true relative to a specific sharpening `c`.
      *   **Truth Simpliciter (T):** A sentence is true (full stop) iff it is T<sub>c</sub> for *every* admissible precisification `c`.
      The existential statement `S`: "There is a number n such that n grains make a heap and n−1 grains do not" is indeed T<sub>c</sub> for every `c`. Therefore, `S` is true simpliciter (T).
      **However,** crucially, `S` being T *does not imply* that there is some specific number `k` such that the statement `P_k`: "`k` grains make a heap and `k-1` grains do not" is itself true simpliciter (T). For `P_k` to be T, it would need to be T<sub>c</sub> for *every* admissible precisification `c`. But this fails for every `k` – for any specific `k`, there are precisifications where the boundary is at `k-1` (making `P_k` false) and precisifications where the boundary is at `k+1` (making `P_k` false). `P_k` is only T<sub>c</sub> for the precisification `c_k` where the boundary is precisely at `k`.
  4.  **The Diagnosis:** The inference from (2) to (3) is correct *for the sentence `S` itself*. `S` *is* true simpliciter. **The mistake is believing that `S` being true simpliciter entails that there must be some true instance `P_k`.** Supervaluationism explicitly denies this entailment. `S` is true because *each precisification supplies its own witness `n_c`* (the boundary in that precisification). But *no single `n` is the witness across all precisifications*. The existential quantifier in `S`, when evaluated for truth simpliciter, is understood as ranging *over the precisifications*: roughly, "For every way `c` of making 'heap' precise, *there is a number `n_c` relative to `c`* such that...". It's a *distributive* or *plurally quantified* claim over precisifications, not a claim that picks out a single number independent of precisification. Step (8) ("an existential cannot be true unless one of its instances is true") holds *within* a single precisification, but not *across* precisifications for truth simpliciter.

  **What This Costs You:**

  By rejecting the inference that `S` being true simpliciter entails a true instance `P_k`, you must surrender:

  1.  **Classical Existential Quantification for Truth Simpliciter:** You must give up the principle that a true existential claim (at the level of truth simpliciter) *must* have a true instance (also at the level of truth simpliciter). This is the core cost. The supervaluationist quantifier "there is" in the context of truth simpliciter does *not* behave classically when it ranges over entities whose status (like being the boundary) depends on precisification.
  2.  **The "No Sharp Boundary" Intuition (as literally stated):** You must surrender the *literal, unqualified* statement "There is no sharp boundary to 'heap'" as being true simpliciter. `S` ("There *is* a sharp boundary") *is* true simpliciter. What you *can* preserve is:
      *   "There is no *determinate* sharp boundary to 'heap'." (Meaning: No specific `n` is the boundary simpliciter).
      *   "It is not the case that there is a sharp boundary *known to us*." (But this is weaker than the original anti-epistemicist motivation).
      *   "For each `n`, it is not true that `n` is the boundary." (This remains true simpliciter).

  **Addressing Your Concerns Directly:**

  *   **Rejecting (4):** You *should* reject (4). Supervaluationism *does* entail `S` ("There is a sharp boundary") is true simpliciter. **However,** it crucially *does not* entail epistemicism (step 5). Epistemicism says there is a *single, specific, unknowable* `n` that *is* the boundary. Supervaluationism denies this: while `S` is true, no specific `P_k` ("`k` is the boundary") is true. The "sharp boundary" exists only relative to ways of sharpening the concept, not absolutely. Your inability to locate it isn't *merely* epistemic (like not knowing a hidden fact); there is *no fact of the matter* about which `n` it is. Rejecting (4) does *not* mean abandoning the core anti-epistemicist insight that no particular location is metaphysically privileged; it means accepting that the *existence* of boundaries (plural, across precisifications) is a consequence of the framework.
  *   **Preserving (8):** You *can* keep (8) **within each precisification `c`.** Within any single, sharp precisification, if "∃x Fx" is T<sub>c</sub>, then there *is* some object `a` in the domain of `c` such that "Fa" is T<sub>c</sub>. The breakdown happens only when moving to truth *simpliciter*.
  *   **Metalanguage Infection (10):** The cost *does* infect the metalanguage used to state the supervaluationist theory itself. When you say "`S` is true simpliciter", you are making an existential claim *in the metalanguage* about precisifications (∀c ∃n<sub>c</sub> ...). This metalanguage existential claim about precisifications *does* have true instances (each precisification `c` is a witness). The non-classicality is confined to the *object language* existential claims about vague entities (like the boundary `n`) when evaluated for truth simpliciter. However, stating the theory requires quantifying over precisifications classically in the metalanguage. This is generally considered manageable, though purists might balk.
  *   **Losses:** The primary loss is the classical behavior of the existential quantifier for truth simpliciter concerning vague predicates. Specifically:
      *   **Existential Generalization (Object Language):** If "Fa" is true simpliciter, then "∃x Fx" is true simpliciter. **This holds.**
      *   **Existential Instantiation (Object Language):** If "∃x Fx" is true simpliciter, you cannot infer there is some *specific* `a` such that "Fa" is true simpliciter. **This fails.** Reasoning by cases based on an existential in the object language for truth simpliciter becomes highly restricted or invalid.
      *   **Disquotation (Object Language):** The T-schema ("'P' is true iff P") fails for borderline-vague sentences. For `S`, we have: `S` is true simpliciter, but *there is no specific `n` such that* "`n` is the boundary" is true simpliciter. The right-hand side of the T-schema for `S` (`S` itself) is true, but it doesn't decompose classically. The disquotational schema holds for `S` *as a whole*, but not in a way that distributes to its instances.

  **Confidence & Uncertainty:**

  *   **Overall Confidence: High (95%).** This rejection of the step (2) to (3) inference *as invalid for the intended conclusion about instances* is the standard supervaluationist response to this "problem of higher-order vagueness" or "the argument from true existentials without instances." It's articulated by Fine, Keefe, and other major proponents. It's the price of the view.
  *   **Point of Least Certainty: The Cost to "No Sharp Boundary" (10%).** While I'm highly confident this *is* the supervaluationist response, I'm slightly less confident it fully satisfies your initial attraction (rejecting sorites without a sharp boundary). You *must* accept that the theory entails the *existence* of sharp boundaries in a distributed, precisification-relative sense (`S` is true). Whether you can still genuinely say "supervaluationism says there is *no sharp boundary*" depends entirely on carefully qualifying what "sharp boundary" means. If you mean "no single, determinately correct boundary location," then yes. If you mean "no boundary exists at all, even distributively," then no. This semantic shift might feel like a significant retreat from the initial motivating intuition. The cost is real and philosophical, not just logical.

  **In Summary:** Reject the inference that `S` being true simpliciter entails a true instance `P_k`. This preserves the core logic of supervaluationism and avoids collapsing into epistemicism, but forces you to accept that the unqualified claim "There is a sharp boundary" (`S`) is true simpliciter, while denying that any specific location is true. The cost is surrendering classical existential quantification for truth simpliciter concerning vague predicates, particularly the link between a true existential and a true instance. You retain classical logic within each precisification and in the metalanguage describing precisifications, but not for the super-truth of object-language existentials over the domain affected by vagueness. Your motivating intuition of "no sharp boundary" survives only as "no *determinate* sharp boundary."
