answer: |-
  Dave squinted at his nearly-empty pint in the dingy Wetherspoons corner booth. "Right," he slurred slightly, turning to his mate Colin, who was meticulously annotating a dog-eared philosophy paperback. "I'm on my fourth. Best call a cab."

  Colin waved a dismissive hand. "Nonsense, Dave! Van Fraassen’s Reflection principle applies. My *current* credence that I can drive home safely must match my expected *future* credence when I actually leave."

  Dave blinked. "Eh?"

  "Simple probabilistic deference!" Colin tapped the book. "When I stagger out of here in twenty minutes, plastered, I fully *expect* my drunken future self will be 90% certain he can drive perfectly well. Therefore..." Colin beamed triumphantly, fishing his car keys from his pocket, "...my rational credence *right now* is also 90%! Practically a sure thing. Come on, I’ll give you a lift."

  Dave sighed, reaching for his phone. "Colin, mate... your 'future self' will be even more pissed than you are now."

  "Exactly!" Colin stood, swaying slightly but radiating philosophical certainty. "And my present self, bound by rational coherence to that glorious future confidence, is already 90% committed to driving! Let’s go!" He lurched towards the exit, keys jingling.

  Dave dialled the taxi number, muttering, "Reflection principle’s a real bastard when your future self’s an idiot."
