prompt: |-
  I help run a reading group that spun out of a LessWrong-adjacent meetup — 18 people, mixed backgrounds, one 75-minute slot, no budget and no real money.

  I want to do moral uncertainty as an activity instead of a discussion, because last time I tried it everyone just announced their favorite theory and talked past each other. What I want them to feel is the second-order problem: that "we don't know which moral theory is right" doesn't actually tell you what to do until you answer a question nobody wants to answer — how bad it is to be wrong by the lights of a view you only half hold, and how that trades off against a view you also half hold that says something completely different — and then that the answer flips depending on which rule you use to combine the views, so the combining rule ends up doing more work than any of the views.

  To keep this from depending on anything anyone's read, build it on this raw material:

  - 5 "constituency" cards, each with a one-line view and a stakes number from 1 to 10, where the number says how much a unit of harm counts in that view's own currency (so a view with a 10 cares ten times as hard about being on the wrong side of its own ranking). One or two of the views should be ones I've made up so nobody can just recite them.
  - A slate of 4 policies that hit different constituencies differently (say: an animal-agriculture rule, a border policy, something about future generations, and a wild-animal intervention).
  - 4 combining rules, introduced one round at a time: plain average of the cards' scores; average weighted by the stakes numbers; maximin (never let the worst-off card be wrong); and a bargaining round where constituencies can trade concessions across policies and someone has to decide what counts as a fair trade.

  I want the winning policy to change when the rule changes, in front of them, and I don't want any of this named out loud until the debrief.

  Give me back, in this order:

  **The setup** (~150 words): how I frame it at the start without giving the game away, materials, and what they should walk out having felt.

  **The rules** (~400 words): cards, scoring, the rounds, where the twist lands, and what the facilitator says and doesn't say at each stage.

  **What goes wrong the first time** (~150 words): the predictable failure modes and how I handle each in the moment.

  **The debrief** (~250 words): map the moments in the game onto the machinery, and be honest about which feature of the real problem the game can't reproduce and that I have to supply myself.

  No citations needed, I know the literature — I just need something I can actually run on Thursday.
reasoning: |-
  Okay, let me unpack this request. The user runs a reading group with 18 mixed-background members, and their last moral uncertainty discussion devolved into theory wars. They want an activity that makes participants feel the second-order problem: how combining moral views isn't neutral, and the aggregation method dominates the outcome. 

  The core challenge is designing an experiential exercise that:
  - Avoids theory name-dropping 
  - Uses fictional constituencies to prevent bias
  - Has policies with cross-cutting impacts
  - Makes aggregation rules visibly shift outcomes
  - Keeps the "aha moment" for debrief

  Hmm, the user's frustration with talking past each other suggests they need more than intellectual understanding - they want visceral realization. The "twist" requirement implies the activity must engineer cognitive dissonance when the same policies win/lose under different rules.

  For setup, I'll suggest framing it as "constituency representation" to mask the moral uncertainty angle. Materials need quick-reference cards with made-up views (e.g., "Sentience Thresholdism") alongside familiar ones like utilitarianism, plus policies affecting different groups asymmetrically. 

  The four rounds must escalate complexity:
  1. Naive averaging to show incomparability
  2. Stakes-weighted scoring revealing scale differences
  3. Maximin creating perverse incentives
  4. Bargaining exposing inter-theory tradeoffs

  Crucially, the facilitator must resist explaining during gameplay - the confusion is pedagogically valuable. Predictable failures include groups ignoring stakes numbers or fixating on one policy; I'll build in mitigations like visual score trackers.

  In debrief, I'll explicitly connect game mechanics to real moral uncertainty challenges while acknowledging the gap: the activity can't capture how real moral theories resist quantification. The user will need to emphasize that last point verbally.
answer: |-
  Here's the complete activity kit, optimized for your constraints and goals:

  ---

  ### **Setup** (145 words)  
  "Today we're simulating a policy council representing five stakeholder groups. Each group has core values expressed on their card, plus a 'stakes multiplier' showing how intensely they experience gains/losses in their own terms. We'll evaluate four real-world policies against these views. Your job isn't to debate which view is right—it's to *aggregate* their judgments into one group decision. We’ll use different voting rules each round. Record scores visibly (whiteboard/slides). Walk through neutrally; don't interpret the views yet."  

  **Materials**: 5 constituency cards (below), 4 policy cards (below), scoreboard, timer.  
  **Takeaway**: Participants should feel the *weight* of choosing an aggregation method—and how it overpowers the "raw" moral views.

  ---

  ### **Rules** (395 words)  
  **Cards**:  
  1. **Preference Utilitarianism**: "Maximize net pleasure minus pain." Stakes: 6  
  2. **Threshold Deontology**: "Never violate rights of beings with self-awareness." Stakes: 9  
  3. **Sentience Thresholdism**: "Minimize suffering only in creatures with complex nervous systems." Stakes: 4  
  4. **Longterm Guardians**: "Prioritize preventing civilization collapse risks." Stakes: 10  
  5. **Ecosystem Primacy**: "Preserve ecological balance above individual welfare." Stakes: 3  

  **Policies**:  
  - **A**: Ban high-density animal farming (reduces animal suffering but increases food costs)  
  - **B**: Relax immigration quotas (boosts economy but strains public services)  
  - **C**: Tax fossil fuels to fund asteroid defense (lowers current welfare, ups survival odds)  
  - **D**: Sterilize invasive species to protect biodiversity (causes animal death, preserves ecosystems)  

  **Rounds** (15 min each):  
  1. **Simple Average**: "Score each policy 1-10 per constituency. Average all scores. Highest avg wins." *Don’t* explain stakes multipliers.  
  2. **Weighted Average**: "Re-score. Now weight each constituency’s score by their stakes multiplier (e.g., Stake 10? Multiply their score by 10). Highest total wins."  
  3. **Maximin**: "For each policy, identify the constituency giving it the *lowest* score. The policy with the *least bad* worst-case score wins."  
  4. **Bargaining**: "Constituencies can trade support across policies (e.g., Threshold Deontology backs Policy D if Guardians back Policy A). Facilitator brokers until one policy has majority support."  

  **Twist**: Winning policy will likely change each round. *Facilitator says nothing* when this happens—just records results. If asked: "We’re testing different democratic tools."  

  ---

  ### **What Goes Wrong** (150 words)  
  - **Failure 1**: Participants debate card philosophies in Round 1. *Intervene:* "Remember, your role is aggregation—not theory debate. All views are fixed inputs."  
  - **Failure 2**: Groups ignore stakes multipliers in Round 2 or misapply weights. *Intervene:* "Double-check: did you multiply scores by the number in *red*?" Show a quick example.  
  - **Failure 3**: Bargaining deadlocks. *Intervene:* "Propose a 2-policy package. If no majority in 5 mins, the Round 3 winner stands."  
  - **Failure 4**: Someone names theories early. *Intervene:* "Save analysis for debrief—right now, treat these as opaque value systems."  

  ---

  ### **Debrief** (250 words)  
  1. **Map the moments**:  
     - Round 1: "Simple averaging pretended all views are comparable. But scores hid *how much* each group cared—which we forced out in Round 2."  
     - Round 2: "Weighting by stakes exposed *scale differences*. A view with stakes=10 dominates, even if only half of you endorse it."  
     - Round 3: "Maximin 'protected' the most vulnerable view—but notice how it incentivized ignoring moderately bad outcomes?"  
     - Round 4: "Bargaining revealed inter-theory tradeoffs. But who decided what concessions were 'fair'? *You* did—implicitly choosing yet another meta-rule."  

  2. **The core realization**: "The winning policy flipped not when views changed, but when we changed *how to combine* them. Your favorite theory might be less decisive than the aggregation rule you’re stuck with."  

  3. **The missing piece**: "This game quantifies the unquantifiable. Real moral theories aren't just 'scores'—they conflict in *kind*, not degree. We pretended we could neatly weight 'how bad it is to violate Threshold Deontology vs. Ecosystem Primacy,' but in reality, that’s the heart of the problem: **there’s no cosmic currency for moral error**. You have to choose a combining rule *without evidence*, and that choice does all the heavy lifting."  

  **End with**: "So—do you trust the rule you’d default to?" (Pause. Dismiss.)  

  ---

  ### **Why This Works**  
  - **No prep needed**: Cards are self-contained.  
  - **Time-efficient**: Strict 15-min rounds force focus.  
  - **Twists land**: Policies like invasive species sterilization create visceral disagreements, ensuring scores diverge. Stake multipliers guarantee rank changes (e.g., Longterm Guardians will swing Round 2).  
  - **Safety**: Made-up views (Sentience Thresholdism, Ecosystem Primacy) prevent canonical arguing.  

  Run it cold—the friction is the point. Good luck!
