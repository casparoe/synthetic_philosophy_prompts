answer: |-
  Here's the expressivist desiderata list with concrete cases and analysis:

  ### (1) Phenomena to Save (~250 words)
  *   **Embedding Behavior:** Must explain how moral sentences retain evaluative force when embedded.  
      *Case:* In "If stealing is wrong, then shoplifting is wrong," the antecedent isn't *asserted* as wrong but still contributes to the conditional's meaning. Expressivism must capture this without reducing it to a factual conditional.
  *   **Unasserted Contexts:** Must handle moral sentences appearing in beliefs, doubts, or fiction.  
      *Case:* "Alex believes charity is good" doesn't express the speaker's pro-attitude toward charity, yet clearly refers to Alex's moral view. Expressivism can't imply the speaker endorses charity here.
  *   **Mixed Argument Validity:** Must explain the validity of arguments combining moral and factual premises.  
      *Case:* "Lying causes unnecessary harm. Causing unnecessary harm is wrong. Therefore, lying is wrong." The inference feels logically compelling, not just a pragmatic shift in attitude. Expressivism needs a logic for such inferences.
  *   **Meaning Stability:** Must ensure moral sentences mean the same thing whether asserted or not.  
      *Case:* "Torture is wrong" uttered assertively vs. embedded in "Suppose torture is wrong..." must express the *same* moral concept. The meaning shouldn't change with the speech act.
  *   **Compositionality (Novel Combinations):** Must generate meanings for novel/unheard complex moral sentences predictably.  
      *Case:* Faced with the novel sentence "If frobbing is gleeful, then gleeful frobbing is obligatory," a competent speaker understands it without prior exposure. Expressivism must explain how attitudes compose systematically to form this understanding. *(Yes, distinct from embedding: embedding shows *existing* sentences work; compositionality requires a *system* generating *any* complex sentence's meaning.)*

  ### (2) Distinctions Not to Collapse (~200 words)
  *   **Accepting a Claim vs. Having an Attitude:** Distinguish endorsing the proposition "Charity is good" from merely feeling charitable.  
      *Case:* A jaded philanthropist might *believe* charity is good (accept the claim) yet lack warm feelings (attitude) due to burnout. Expressivism must account for the cognitive commitment.
  *   **Believing vs. Desiring:** Maintain the fundamental difference between cognitive states (beliefs) and conative states (desires/plans).  
      *Case:* Believing "Ice cream is in the freezer" (world-mind direction of fit) is fundamentally different from desiring "I want ice cream" (mind-world direction of fit). Expressivism cannot reduce moral *judgment* entirely to a desire-like state without losing its propositional character.
  *   **Sentence Meaning vs. Expressed State:** Meaning must be distinct from the psychological state conventionally expressed by uttering it.  
      *Case:* "Murder is wrong" means roughly *that murder is wrong*. It conventionally expresses disapproval. But the meaning is public and shareable; the disapproval is a psychological state. An expressivist theory needs semantic content beyond just the speaker's current attitude.

  ### (3) Constraints Not to Violate (~150 words)
  *   **Hume's Law / No Ought-from-Is:** Cannot derive a substantive moral conclusion from purely non-moral (descriptive) premises without some implicit moral standard.  
      *Case:* Validly concluding "Therefore, you ought to give to charity" requires a moral premise (e.g., "You ought to relieve suffering"), not just "Charity relieves suffering" and "Suffering exists."
  *   **Moore's Open Question Argument:** Cannot equate moral properties simplistically with natural properties.  
      *Case:* Even if "good" is defined as "pleasure," the question "I know this causes pleasure, but is it *good*?" remains intelligible and open. Expressivism should explain this persistent doubt without collapsing good/pleasure.
  *   **Internalism Constraint:** Must respect the (defeasible) conceptual connection between sincerely judging something good/wrong and being motivated to some degree toward/promote/avoid it. *(Less absolute, but a strong background feature to accommodate).*

  ### (4) Potentially Jointly Unsatisfiable Requirements (~200 words)
  The most severe tension lies between **Compositionality** and maintaining core expressivist theses (**Believing vs. Desiring**, **Meaning vs. State**).

  *   **The Problem:** Core expressivism identifies the meaning of "X is wrong" with the expression of a *simple* conative attitude (e.g., disapproval). Compositionality demands that the meaning of complex sentences like conditionals, negations, or belief reports ("If X is wrong...", "~X is wrong", "Bob thinks X is wrong") be built systematically from the meanings of their parts.
  *   **The Conflict:** How can the attitude expressed by a *complex* sentence be systematically generated from the simple conative attitudes associated with its *parts*? The attitude expressed by "If stealing is wrong, then shoplifting is wrong" isn't disapproval of stealing, nor disapproval of shoplifting, nor some simple combination. It seems to express a complex *cognitive* state about the relation between wrongness properties.
  *   **Why Unsatisfiable?** Saving compositionality seems to require assigning moral sentences complex, attitude-like states that function logically like beliefs (contravening Believing vs. Desiring) or assigning them robust propositional content distinct from attitudes (contravening Meaning vs. State). This is the core challenge driving complex quasi-realist expressivism (Blackburn, Gibbard).

  ### (5) The Knockout Requirement (Short)
  **Compositionality.** It's the most persistent and structurally demanding challenge. While embedding highlights specific problematic contexts, compositionality requires a *general, systematic semantic machinery* for generating the meaning (or expressive function) of *any* complex sentence containing moral vocabulary, directly challenging the expressivist's core commitment to non-cognitive meaning. Most unsuccessful expressivist attempts fail fundamentally here. **Handling "probably" and questions:** These are further instances of embedding/compositionality. "Probably stealing is wrong" embeds "stealing is wrong" under a probability operator; "Is stealing wrong?" embeds it in a question. They require the same systematic account as conditionals or negation. They aren't *new* requirements but reinforce the *scope* of the embedding/compositionality challenge.
