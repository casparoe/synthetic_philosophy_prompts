  We can generate this table by simulating the state machine. We start with state Calm. For each history, we run the state machine step by step and record the output at the last step. But note: the output at the last step depends on the entire history. We can compute it by:

  state = initial_state (Calm)
  for each input in the history:
     output, next_state = transition_function(state, input)
     state = next_state
  Then the output for the last step is the last output.

  But for the table, we are only showing the output at the last step? However, the test cases require the entire output sequence. How do we get the entire sequence? We run step by step. For step 1, we have history [a] -> output for step 1. For step 2, we have history [a,b] -> output for step 2. And so on. So the table will give the output for the current step given the entire history. We can have a table that for each history (of any length from 1 to 5) gives the output at that step.

  Alternatively, we can have a function that computes it. But we want it to be a lookup. So we precompute for every history of length 1 to 5.

  We'll do that.

  Finally, we are ready.
