  ### **Activity Design: The Two-Sided Squeeze on Mental State Realization**

  **Specification:** A **Light-Avoider** creature.  
  - **Inputs:** Light (1) or Dark (0), detected at each timestep.  
  - **Outputs:** Move (1) or Stay (0).  
  - **Internal States:** Calm (C) or Agitated (A).  
  - **Rules:**  
    - If in **Calm** and detects **Dark (0)**: **Stay (0)** → remain **Calm**.  
    - If in **Calm** and detects **Light (1)**: **Move (1)** → transition to **Agitated**.  
    - If in **Agitated** and detects **Dark (0)**: **Stay (0)** → transition to **Calm**.  
    - If in **Agitated** and detects **Light (1)**: **Move (1)** → remain **Agitated**.  

  **Key Goal:** Students experience the tension between *denying* mental states to physically plausible systems (chauvinism) and *granting* them to purely behavioral systems (liberalism) using their own criteria.  

  ---

  ### **Materials**  
  1. **Device Implementation:**  
     - 2 cups labeled "Calm" (C) and "Agitated" (A).  
     - 1 marble (represents current state).  
     - Rule card for operator (see rules above).  
     - Input cards (0 or 1) for test sequences.  

  2. **Group Implementation:**  
     - 2 volunteers as state-holders ("Calm" and "Agitated").  
     - 2 rule cards (one per state, summarizing rules above).  
     - A "state token" (e.g., a hat) to designate the active state-holder.  
     - Input cards (0 or 1).  

  3. **Lookup Table Implementation:**  
     - Precomputed lookup table (poster-sized) mapping **input histories** to outputs (e.g., history `[0,1]` → output `1` for step 2).  
     - Calculator or assistant to run queries (no internal states—only history→output pairs).  

  4. **Testing Tools:**  
     - Test battery sheets (1 per student) with 8 sequences (e.g., `[0]`, `[1,0]`, `[1,1,0]`).  
     - Expected outputs (e.g., `[0]` → `[0]`; `[1,0]` → `[1,0]`).  
     - Index cards and pins for criteria.  
     - Voting cards (green = "has state", red = "lacks state").  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0–5 min: Setup & Introduction**  
  - Briefly describe the Light-Avoider without using philosophical jargon.  
  - Divide students into three testing groups (each tests all implementations).  
  - Assign roles:  
    - 1 device operator (manages cups/marble).  
    - 2 state-holders (group implementation).  
    - 1 lookup assistant (reads table).  
    - Rest are testers (run tests, record results).  

  **5–20 min: Device Implementation**  
  - Operator starts marble in "Calm" cup.  
  - **Test:** Group 1 reads input sequence step-by-step (e.g., `[1,0]`).  
    - Operator moves marble per rules, calls out output.  
    - Class records outputs, confirms if matches expected (e.g., `[1,0]` → `[1,0]`).  
  - *Predictable issue:* Operator error. *Fix:* Practice once with `[0,1]` first.  
  - **Outcome:** Device passes all tests.  

  **20–35 min: Group Implementation**  
  - State-holders start with "Calm" holding the token.  
  - **Test:** Group 2 reads input sequence step-by-step.  
    - Active state-holder consults rule card, calls output, passes token if state changes.  
    - Class records outputs (e.g., for `[1,1]`, outputs `[1,1]`).  
  - **Outcome:** Group passes all tests.  

  **35–40 min: Write Criteria**  
  - Each student writes a **one-sentence criterion** for:  
    *"What it takes for the Light-Avoider to* really *be in the state of* wanting to avoid light *(or being agitated)."*  
    - **Examples (to nudge without leading):**  
      - *"It must feel uncomfortable in light."*  
      - *"Its internal parts must causally produce motion."*  
      - *"It must behave as if it dislikes light."*  
  - Pin criteria on the board.  

  **40–45 min: Vote 1 (Device) & Vote 2 (Group)**  
  - **Vote 1 (Device):** *"By your criterion, does the device* really *have the state of wanting to avoid light when the marble is in ‘Agitated’?"*  
    - **Predicted vote:** >80% "no" (students deny mental states to simple hardware).  
  - **Vote 2 (Group):** *"Does the group implementation* really *have this state?"*  
    - **Predicted vote:** >80% "yes" (human state-holders feel "agitated").  
  - Record votes visibly.  

  **45–55 min: Lookup Table Implementation**  
  - Reveal lookup table: "This is a cheat sheet. You give it the *entire history of inputs*, and it returns the output."  
  - **Test:** Group 3 reads a sequence (e.g., `[1,0,1]`).  
    - For each step, assistant looks up output based on **full history so far** (e.g., step 3: history `[1,0,1]` → output `1`).  
    - Class records outputs. Confirms it passes tests (e.g., `[1,0,1]` → `[1,0,1]`).  
  - **Key point:** Emphasize the table has **no internal states**—it’s just a "dictionary" of answers.  

  **55–60 min: Vote 3 (Lookup Table)**  
  - **Vote 3:** *"By your* own *criterion, does the lookup table* really *have the state of wanting to avoid light?"*  
    - Students vote while staring at their pinned criteria.  
    - **Predicted outcome:** 50–70% "yes" (liberalism trap—criterion forces them to grant the state).  

  **60–90 min: Debrief**  
  ***Map the activity to philosophical tensions (avoid jargon until now):***  
  1. **The Squeeze:**  
     - **Vote 1 (Device):** Most denied the state. But the device *does* everything the spec requires. This is **overly demanding**—rejecting systems that physically mimic mental states.  
     - **Vote 3 (Table):** Many granted the state. But the table is just a list of answers with **no internal machinery**. This is **overly permissive**—granting mental states to anything that behaves correctly.  
     - *"Your criteria forced you into this trap. You denied a ‘dumb’ device but granted a ‘dumb’ table."*  

  2. **The Functionalist Reply:**  
     - **Problem:** The table has the **right behavior** but the **wrong causal organization**. It doesn’t have states that *interact* with inputs/outputs over time—it’s a static map.  
     - **Fix:** Demand a system where states *mediate* causes (e.g., light *causes* agitation, which *causes* movement).  
     - **Cost:** This excludes the table... but now the device *must* count! Yet many still *feel* it lacks "real" agitation. That discomfort is the unresolved **demand for something more** (e.g., biology, subjectivity).  

  3. **What This Doesn’t Solve:**  
     - **Phenomenal consciousness:** This was about *wanting* (functional states), not *feeling* (raw experience). A robot could "want" to avoid light without *suffering*.  
     - **Not an argument:** This was an **intuition pump**—it exposes tensions but doesn’t prove functionalism true/false.  

  4. **Open Discussion:**  
     - *"Which votes surprised you? How did your criterion betray you?"*  
     - *"Could the device ‘want’? Could the table? What’s missing?"*  

  ---

  ### **Predictable Issues & Fixes**  
  - **Operator errors:** Rehearse implementations once with a simple sequence first.  
  - **Vote 3 backlash:** If students resist granting the table mental states, ask: *"If not, why did you grant it to the group? What’s the difference?"* Highlight inconsistency.  
  - **Shallow criteria:** If criteria are vague (e.g., "it just does"), reframe: *"What would you need to see under the hood?"*  

  ### **What the Activity Cannot Do**  
  - **Phenomenal consciousness:** This only tests *functional* states (e.g., wanting). It leaves the hard problem of subjective experience untouched.  
  - **Not proof:** This pumps intuitions about functionalism’s challenges but doesn’t refute or validate it.  

  ---

  **Outcome:** Students leave feeling the squeeze—functionalist theories must thread a needle between rejecting plausible realizations and accepting empty behavior. The debrief ties this to core philosophy of mind debates without presupposing jargon, letting the tension speak for itself.
