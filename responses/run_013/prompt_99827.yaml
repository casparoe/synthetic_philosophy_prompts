  2) Comparison of Dutch directness vs. Japanese indirection 
  3) Stress-testing the ledger with conventionalized indirection 
  Plus requiring students to identify when the ledger itself fails.

  *Scratching head* Need to avoid: 
  - Theory name-dropping (Grice, Brown/Levinson etc.) 
  - Cultural bias traps 
  - Memorization-only answers 
  Must reward spotting the "insider/outsider" assumption in the ledger.

  *Brainstorming question structure*... 
  Start with white lies as ethical puzzle → force principle-based judgment. Then juxtapose Dutch/Japanese styles → demand analysis of whether labor distribution differences are technical or fundamental. Finally drop the conventionalized indirection bomb → make them articulate failure conditions for the ledger itself. 

  *Model answer considerations*... 
  Must show: 
  1) White lies aren't inherently wrong but manipulate labor distribution unethically 
  2) Dutch/Japanese represent different ethical tasks (burden-shifting vs option-granting) 
  3) Ledger fails when labor disappears for insiders - reveals its assumption about shared conventions 
  4) Ledger becomes useless if meaning is truly non-intentional 

  *Marking scheme*... 
  Six precise traps: 
  - Missing that white lies close options (common error) 
  - Equating Dutch/Japanese as mere stylistic differences (superficial reading) 
  - Not confronting conventionalization challenge (dodging the hard part) 
  - Overlooking insider/outsider dynamic (key insight) 
  - Cultural relativism or universalism bias (explicitly forbidden) 
  - Failure to specify ledger's failure conditions (incomplete answer)

  *Checking timing*... 
  700-word model answer ≈ 50 mins writing at strong student pace. Tight but doable if arguments are pre-structured. 

