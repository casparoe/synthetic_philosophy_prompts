  For the essay question, I need to force students to confront these tensions directly. It should require them to distinguish the claims, show their interdependence, and explain how Geneva's context activates their danger. The model answer must demonstrate this synthesis while taking a clear stance. For assessment, I'll design a 20-point rubric emphasizing conceptual distinctions (6 points), reconciliation of (i)/(ii) (6 points), integration of (iii) and Geneva (5 points), and coherence (3 points). Common pitfalls to flag include: conflating the theses, missing the amplification logic, and failing to see how Geneva exemplifies Rousseau's broader theory.

  The crux boils down to how theater's mirror-like nature enables its corrupting power in specific contexts. This captures the essential tension students must resolve.
answer: |-
  ### Essay Question  
  **Analyze how Rousseau reconciles his seemingly contradictory claims that (a) theater merely reflects existing morals and is powerless to change them, (b) theater actively corrupts its audience, and (c) acting is inherently degrading. In your view, which of these claims does his argument about Geneva’s vulnerability *most critically* depend upon?**  

  ---

  ### Model Answer (Strong A, 750 words)  

  Rousseau’s *Letter to M. d’Alembert* presents a layered critique of theater that avoids contradiction by positioning spectacle as an *amplifier* of social pathologies rather than an external corrupting force. His three theses—theater’s impotence to reform morals (i), its capacity to corrupt (ii), and acting’s inherent degradation (iii)—cohere when understood as facets of a unified theory: theater crystallizes and accelerates latent societal decay by replacing authentic social bonds with manufactured illusions. Geneva’s fragility makes it uniquely susceptible to this process, but the mechanism hinges on thesis (i) as the foundation for (ii) and (iii).  

  Thesis (i)—theater’s powerlessness to improve morals—stems from Rousseau’s view that spectacles "follow from the morals they are meant to reform" (*Letter*, Bloom, p. 61). Theater flatters prevailing tastes because its commercial survival depends on pleasing audiences. In corrupt societies like Paris, comedies normalize vice (e.g., *Le Misanthrope* rewards Philinte’s duplicity), but this merely reflects existing moral bankruptcy. Crucially, Rousseau argues theater cannot *create* new vices; it "gives not virtue but a love of virtue" only where virtue already exists (p. 64). This establishes theater as a mirror, not an independent agent.  

  Thesis (ii)—theater’s active corruption—appears to clash with (i) but is its logical extension. Where morals are *already* decaying, theater functions as a catalyst. By aestheticizing vice and rewarding hypocrisy, it erodes the audience’s capacity for moral indignation. Alceste’s humiliation in *Le Misanthrope* delights spectators because it indulges their *preexisting* desire to punish uncompromising honesty (p. 50). Rousseau’s key insight is that corruption arises not from theater introducing foreign elements, but from *intensifying* the audience’s worst impulses through emotional voyeurism. The pleasure taken in Alceste’s downfall is a symptom of social fragmentation, which theater exacerbates by replacing participatory civic life with passive consumption.  

  Thesis (iii)—acting’s inherent degradation—extends this logic to the performer. Actors embody Rousseau’s broader critique of *amour-propre* (self-love dependent on others’ opinions). By "selling their person" and feigning emotions for profit, actors epitomize the substitution of appearance for authenticity (p. 79). This degradation is not isolated; it mirrors the audience’s complicity in valuing artifice over truth. When Rousseau claims actors "traffic in the public’s laughter and tears" (p. 81), he links their moral emptiness to spectators’ demand for emotional simulacra. Thus, (iii) reveals theater as a *system* of mutual debasement: actors commodify identity, while audiences outsource empathy to paid surrogates.  

  **Geneva as the Crucial Test Case**  
  Rousseau’s contextualism—that theater’s impact depends on a society’s size and health—resolves the tension between (i) and (ii). Geneva’s small, virtuous republic exemplifies thesis (i): it lacks the "idle luxury" (p. 135) that sustains corrupt theater. Yet Rousseau opposes introducing theater precisely because Geneva’s *potential* fragility activates thesis (ii). Unlike robust ancient Athens, Geneva’s cohesion relies on active citizenship: festivals where participants *are* the spectacle (p. 125). Theater would replace this with passive observation, creating "idlers" detached from communal labor (p. 120). Corruption enters not via new ideas, but by *displacing* practices that sustain virtue. Thus, theater’s danger lies in exploiting Geneva’s latent vulnerability to individualism—a corruption-by-neglect consistent with (i)’s logic.  

  The argument about Geneva depends most critically on **thesis (i)**. If theater could independently implant vice, Rousseau’s insistence that Athens tolerated plays harmlessly would collapse. Instead, he argues Geneva’s simplicity makes it a "fertile ground" for theater’s corrosive effects *only* because those effects amplify existing social dynamics (p. 134). By exposing how theater hollows out authentic relationships, (i) explains why even morally inert spectacles threaten Geneva’s delicate ecosystem of mutual surveillance and civic engagement.  

  In conclusion, Rousseau’s theses form a dialectic: theater’s reflective nature (i) enables its corrupting power (ii) in societies where spectatorship replaces participation, while actors’ degradation (iii) manifests the system’s ethical bankruptcy. Geneva proves that thesis (i) is the linchpin; without it, Rousseau could not claim theater is benign elsewhere yet lethal for the republic. His genius lies in showing how spectacle consummates a society’s self-betrayal.  

  ---

  ### Marking Scheme (20 points total)  
  1. **Clear distinction of the three theses** (i, ii, iii) — 3 pts  
  2. **Reconciliation of (i) and (ii)**: Theater as amplifier/mirror of *existing* corruption — 6 pts  
  3. **Integration of (iii)**: Acting as symptom/system of communal inauthenticity — 3 pts  
  4. **Analysis of Geneva**: Contextualism as key to resolving (i)/(ii) tension — 3 pts  
  5. **Argument for primary thesis** (i as most critical for Geneva) — 3 pts  
  6. **Coherence and originality** (Logical flow, avoids bullet-point regurgitation) — 2 pts  

  **A vs. B Differentiation**  
  - **A**: Explicitly links (iii) to (i)/(ii) via *amour-propre*/inauthenticity; shows Geneva *exemplifies* rather than *exceptions* Rousseau’s theory.  
  - **B**: Correctly reconciles (i)/(ii) but treats (iii) as separate; describes Geneva’s vulnerability without grounding it in (i).  

  ---

  ### Common Failures Note  
  1. **Conflating (i)/(ii) as identical** (e.g., "Theater corrupts *by* reflecting morals") without explaining the amplification mechanism: **–4 pts**.  
  2. **Treating (iii) in isolation** (e.g., focusing *only* on actors’ immorality): **–3 pts**.  
  3. **Misreading Geneva’s contextualism** (e.g., "Theater is always evil, but Rousseau excuses Athens"): **–3 pts**.  
  4. **Ignoring the mirror principle** (i) when discussing corruption: **–5 pts** (undermines core argument).  

  ---

  Crux: **Theater corrupts by amplifying latent social decay it cannot create**.
