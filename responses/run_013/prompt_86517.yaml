prompt: |-
  During an argument with a friend about a well-known disaster — he holds that the official account is a cover-up — I observed that years of investigation have turned up nothing supporting what he alleges, and he waved the point away with the line "absence of evidence is not evidence of absence." I would like a careful inventory of what that sentence can actually be claiming. Separate the readings: that nobody has yet looked, so there is no evidence in either direction; that the alleged fact is the kind of thing that would leave no traces; that the failure to find what we would expect to find under a hypothesis is itself evidence against it, and what would have to be true of the relevant likelihoods for that to hold; that a hypothesis which predicts its own concealment makes the missing evidence irrelevant rather than probative; and that the sentence is at bottom a claim about who bears the burden of proof rather than about confirmation at all. For each reading, say whether it is a platitude, a substantive and defensible principle, or simply false, and what it would license someone to conclude. Then tell me which reading my friend must be relying on for the line to do the work he needs it to do, and whether he can hold that reading without it collapsing into the claim that no observation could ever count against his view. A menu with verdicts, please, rather than an essay on conspiracy theories.
reasoning: |-
  Okay, the user is in an argument with a friend about a disaster, where the friend believes the official account is a cover-up. The user pointed out that years of investigation haven't found evidence supporting the friend's claims, and the friend countered with "absence of evidence is not evidence of absence." The user wants a careful analysis of what this phrase could mean in different contexts. 

  First, I need to unpack the possible interpretations of that statement. The user mentioned specific readings: lack of investigation, untestable claims, failed predictions, self-sealing theories, and burden of proof. For each, I should evaluate whether it's a platitude, defensible, or false, and what conclusions it allows. Then, determine which one the friend is using and if it makes their position unfalsifiable.

  Starting with the first reading: no one has looked. If no investigation has occurred, then absence of evidence doesn't mean anything. That's a platitude. But here, investigations have happened, so this doesn't apply. The friend can't use this.

  Next, untestable claims. If the alleged cover-up leaves no traces, then absence of evidence is expected and doesn't disprove it. This is defensible but makes the claim unscientific. The user's friend might be implying this, but it weakens their argument because it can't be verified.

  Then, failed predictions. If we expect evidence under the hypothesis but find none, that should count against it. This is a substantive principle in probability and science. The user's point relies on this: investigations should have found something if the cover-up were real. The friend dismissing this might be ignoring the likelihoods involved.

  Self-sealing theories are tricky. If the cover-up includes hiding evidence, then absence is part of the theory. But this makes the theory unfalsifiable. It's defensible only if there's independent evidence of concealment. Without that, it's a fallacy. The friend might be using this to deflect, but it risks making their position immune to evidence.

  Lastly, burden of proof. The friend might be saying the user hasn't disproven the cover-up, so the burden is on skeptics. This is a procedural point. But in rational discourse, the burden is on the claimant. The friend shifting the burden avoids providing evidence.

  The friend likely relies on the self-sealing theory (Reading 4) to explain why evidence is missing. However, without evidence of concealment, this collapses into unfalsifiability. Reading 3 (failed predictions) is what the user is invoking, and the friend is dismissing it incorrectly. The friend's stance, especially with Reading 4, leads to a position where no evidence could ever refute their view, which is problematic.
answer: |-
  Here's a precise inventory of the readings of "absence of evidence is not evidence of absence," with verdicts and implications, tailored to your dispute:

  **Reading 1: Investigation Gap**  
  *Claim*: No serious search for evidence has occurred.  
  *Status*: **Platitude** (if true).  
  *Licenses*: No conclusion can be drawn; the claim remains unevaluated.  
  *Applies here?* **No** – you specified "years of investigation."

  **Reading 2: Untestable Claim**  
  *Claim*: The alleged fact inherently leaves no discoverable traces.  
  *Status*: **Defensible principle** (but epistemically weak).  
  *Licenses*: Absence is expected, so it cannot disprove the claim. Makes the allegation unfalsifiable.  
  *Applies here?* **Unlikely** – cover-ups typically leave traces (documents, whistleblowers, inconsistencies).

  **Reading 3: Failed Prediction**  
  *Claim*: Under hypothesis H (cover-up), evidence E *should* be found. Absence of E *is* evidence against H.  
  *Status*: **Substantive, defensible principle** (core to Bayesian reasoning & science).  
  *Requires*: P(E|H) is high *and* P(E|not-H) is low.  
  *Licenses*: Absence of E *reduces* probability of H proportional to how likely E was under H vs. alternatives.  
  *Applies here?* **Yes** – your argument implicitly relies on this. Investigations *should* have found evidence if H were true.

  **Reading 4: Self-Sealing Hypothesis**  
  *Claim*: H predicts the absence of evidence (e.g., "the cover-up was flawless"). Absence is consistent with H, not evidence against it.  
  *Status*: **Defensible only with independent evidence of concealment**; otherwise **false/unfalsifiable**.  
  *Licenses*: Absence is irrelevant to judging H. Risk: Makes H immune to disconfirmation.  
  *Applies here?* **Likely your friend's primary reliance** – he implies the cover-up explains the absence.

  **Reading 5: Burden of Proof**  
  *Claim*: The sentence asserts the skeptic must *disprove* H, not that the proponent must prove it.  
  *Status*: **Defensible procedural principle in some contexts** (e.g., law), but **misapplied** here.  
  *Licenses*: Shifts obligation to opponent; avoids defending H's positive evidence.  
  *Applies here?* **Possible secondary reliance** – friend evades justifying his own claim.

  ---

  **Your Friend's Necessary Reading:**  
  He **must rely on Reading 4 (Self-Sealing Hypothesis)** for his rebuttal to work. Only this reading nullifies your observation that investigations found nothing.  

  **Does it collapse into unfalsifiability?**  
  **Yes, inevitably.** If he insists the *cover-up itself* explains all absent evidence *without independent proof of such concealment*, then:  
  - No possible observation could disprove his claim (since absence is "expected").  
  - Reading 3 (which demands evidence *should* exist under H) is categorically rejected.  
  - His position becomes **dogmatic** – compatible with *any* state of evidence.  

  **Verdict Menu:**  
  | **Reading**               | **Status**                          | **Licenses**                                | **Friend's Use?** |  
  |---------------------------|-------------------------------------|--------------------------------------------|-------------------|  
  | 1. Investigation Gap      | Platitude (if true)                | No conclusion                              | ❌ No (investigations occurred) |  
  | 2. Untestable Claim       | Defensible (but weak)              | Unfalsifiability                           | ❌ Unlikely (cover-ups leave traces) |  
  | **3. Failed Prediction**  | **Substantive & Defensible**       | **Evidence *against* H**                   | ❌ Rejected by friend |  
  | **4. Self-Sealing**       | **Defensible iff proven; else False** | **Immunity to counter-evidence**           | ✅ **Necessary** |  
  | 5. Burden of Proof        | Contextually defensible            | Shifts obligation to opponent              | ⚠️ Possible (but secondary) |  

  **Conclusion for your dispute:** Your friend uses Reading 4 to deflect your argument, but this requires his hypothesis to *assume* its own concealment success, rendering it fundamentally unfalsifiable. Unless he provides **independent evidence** that concealment occurred (e.g., proof of evidence destruction), his position is circular and voids rational debate. Reading 3 remains the epistemically sound principle: prolonged absence of *expected* evidence *is* evidence of absence.
