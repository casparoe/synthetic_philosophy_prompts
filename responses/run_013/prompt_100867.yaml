prompt: |-
  hey, so i'm a 5th-year phil phd working on decision theory / formal epistemology, and i've somehow become the decision person for a policy lab my friend runs. they keep asking me: should we gather more info before we decide? i keep saying Good's theorem says free info can't hurt in expectation, and they keep saying but it's not free, and also the info will change what we're deciding. i want to give them a procedure they can actually run.

  can you write a decision procedure for a research analyst at the lab? a checklist / flowchart in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no (don't gather more info), and where it hands the decision to a person because it's a values call. the analyst has about a week, no stats beyond an intro course, and the director has to sign off. these decisions come up maybe twice a month, budgets $50k-$500k, and they affect real people.

  teh wrinkle i keep running into: Good's theorem assumes the decision problem is fixed and the info is free. in our lab, getting info often changes the decision problem—new options become salient, stakeholders change their demands, and the info itself becomes a bargaining chip. also, sometimes the information is about whether we can trust our own prior, which seems to make the theorem circular. and there's a commitment problem: once we know, we can't un-know, and stakeholders can force us to act on it, so there's an option value of ignorance. i want the procedure to handle what i've been calling endogenous information—info that changes the action set or the utility function—and strategic information—info that other players will react to. is there a principled way to extend the theorem, or does it just break? take a stand.

  then run it on two cases: (1) a lab deciding whether to run a $40k pilot before a $2m scale-up, where the pilot would mostly tell them something they already 80% believe; (2) a city deciding whether to commission a $100k study before rolling out a policy the mayor has already publicly committed to. for each, give a definate recommendation, and include one where the procedure gives an answer i won't like.

  i want a committed answer: take a definite position on whether Good's theorem actually justifies always get more info in these real cases, and make definite calls on the two cases, with reasons, rather than laying out options and leaving it to me. also flag where the procedure is just judgment dressed up as math, and what it can't do.
reasoning: |-
  We are designing a decision procedure for a policy lab that faces the question: "Should we gather more information before making a decision?" The procedure must account for the fact that information is not free and that it can change the decision problem (endogenous information) or be used strategically (strategic information). We are also aware of Good's theorem (which states that free information cannot hurt in expectation) but note that in real-world settings, information is not free and the decision problem may not be fixed.

  The procedure will be a checklist/flowchart with specific questions. The goal is to have a step-by-step guide that the research analyst (with limited stats background) can follow in about a week, leading to a clear recommendation: gather more info, don't gather more info, or hand off to a human for a values call.

  Key challenges to address:
  1. Endogenous information: Gathering information may change the set of available actions or the utility function (e.g., by revealing new options or changing stakeholder demands).
  2. Strategic information: The information may be used by other players (stakeholders) in a strategic way, potentially forcing actions or changing the bargaining position.
  3. Commitment problem: Once known, the information cannot be unknown, and stakeholders might force actions based on it, creating an option value of ignorance.
  4. Trust in priors: Sometimes the information is about the reliability of our own prior beliefs.

  We will design the procedure to handle these issues by breaking down the decision into key considerations. The procedure must also flag when it becomes a judgment call.

  Procedure: "Information Gathering Decision Protocol"

  Step 1: Define the current decision problem and the proposed information gathering.
     - What is the main decision we are facing? (e.g., whether to scale up a program)
     - What specific information are we considering gathering? (e.g., a pilot study)
     - What is the cost of gathering this information? (include time, money, opportunity cost)

     If the cost is more than the entire budget for the decision, then stop: do not gather (too expensive).

  Step 2: Assess if the information will change the decision problem (endogenous change).
     - Will getting this information likely introduce new actions that are not currently available? (e.g., if the pilot shows a surprising result, will we design a completely new program?)
     - Will it change the preferences (utilities) of the stakeholders? (e.g., if the study shows a negative effect, will the mayor lose support and thus change the weight of political considerations?)

     If the answer to either is "yes", then we cannot rely solely on Good's theorem because the decision problem is not fixed. Proceed to Step 3.

     If the answer is "no", then the decision problem is fixed. Proceed to Step 4.

  Step 3: Handle endogenous changes.
     - Can we anticipate and model the new decision problem that would arise after the information? (e.g., can we list the new actions and estimate the new utilities?)
        - If yes, then we can try to build an expanded decision tree that includes the post-information decision problem. This requires expert judgment. If feasible, proceed to Step 4 with the expanded model.
        - If no (because it's too uncertain or complex), then we cannot use a standard expected value calculation. Instead, we must rely on qualitative judgment. Proceed to Step 6 (values call).

  Step 4: Calculate the expected value of information (EVI) under a fixed decision problem (or the expanded one from Step 3 if applicable).

     Note: EVI = Expected value with information minus Expected value without information.

     How to do it (simplified for an intro stats level):
     a) Without the information, what are the possible actions and their expected utilities?
          - List the actions (A1, A2, ...) and the current beliefs (probabilities) about the states of the world that affect outcomes.
          - For each action, compute: EU(action) = sum [ utility(outcome | state) * P(state) ] for all states.

     b) The best action without information: A* = argmax EU(action)

     c) With the information, we will get a signal (which may be one of several possible results). For each possible signal:
          - Update beliefs (using Bayes' rule if possible, or expert judgment) to get P(state | signal).
          - Find the best action given that signal: A*(signal) = argmax EU(action | signal)
          - Compute the expected utility of that best action given the signal.

     d) Then, the expected utility with information is: 
          EU(info) = sum [ EU(A*(signal) | signal) * P(signal) ] for all signals.

     e) EVI = EU(info) - EU(A* without info)

     f) Compare EVI to the cost of gathering the information (from Step 1):
          - If EVI > cost: gathering the information is worth it (in a fixed problem).
          - If EVI <= cost: not worth it.

     However, if the decision problem was expanded in Step 3, we must account for the new actions and utilities in the above calculation.

     If the EVI calculation is feasible and EVI > cost, then recommend gathering the information. If not, then proceed to Step 5.

     If the EVI calculation is not feasible (e.g., too uncertain, lack of data), then proceed to Step 5.

  Step 5: Assess strategic concerns and commitment problems.
     - Could the information be used by other stakeholders to force an action that we would not choose voluntarily? (e.g., if a negative study is released, the public might demand canceling a program even if we think it's still worth it)
     - Is there an option value in remaining ignorant? (e.g., by not knowing, we avoid being forced into a suboptimal action by external pressures)

     If there are significant strategic concerns, then we must consider:
          - The risk of being forced into a bad action: if the information might lead to a worse outcome due to external pressure, then the EVI might be negative (i.e., the information could hurt).
          - Weigh the strategic risks against the potential benefits of the information.

     This step is inherently judgmental. The analyst should list the potential strategic risks and benefits. If the risks are high and likely to lead to a worse outcome, then do not gather the information. Otherwise, if the benefits (from Step 4) are clear and outweigh the risks, then gather. If uncertain, proceed to Step 6.

  Step 6: Values call.
     - When the analysis is too complex, when there are unquantifiable strategic risks, or when the decision involves ethical or political values that cannot be reduced to expected utility, then hand the decision to the director (or relevant decision-maker) with a summary of:
          - The cost of the information.
          - The potential benefits (if any) from Step 4.
          - The risks of endogenous changes and strategic problems.
          - Any other qualitative factors.

     The decision-maker must then use their judgment.

  Summary of the flowchart:

  Start at Step 1.
  Step 1: If cost > budget -> Do not gather.
  Step 2: If the information will change the decision problem (endogenous) -> Step 3.
          Else -> Step 4.
  Step 3: Can we model the expanded problem? 
          Yes -> Step 4 (with expanded model).
          No -> Step 6.
  Step 4: Calculate EVI. If feasible and EVI > cost -> Gather.
          If EVI <= cost -> Do not gather.
          If not feasible -> Step 5.
  Step 5: Assess strategic concerns. If risks outweigh benefits -> Do not gather.
          If benefits outweigh risks -> Gather.
          If uncertain -> Step 6.
  Step 6: Hand to decision-maker.

  Now, we apply the procedure to the two cases.

  Case 1: Lab deciding whether to run a $40k pilot before a $2m scale-up. They already believe the result with 80% confidence.

  Step 1: 
     - Main decision: whether to scale up (cost $2m) or not.
     - Proposed information: pilot study costing $40k.
     - Cost: $40k.

  Step 2: 
     - Will the pilot change the decision problem? 
          - Possibly: if the pilot shows something unexpected, they might design a different program? But let's assume for this case that the only actions are "scale up" or "don't scale up". 
          - The pilot is about the effectiveness of the program. If it shows the program is ineffective, they might avoid a costly scale-up. If it confirms, they proceed. 
          - We assume no new actions and no change in utilities (stakeholders' preferences are fixed). So proceed to Step 4.

  Step 4: Calculate EVI.
     - Without the pilot, they have two actions: Scale-up or Not.
     - Current belief: 80% chance the program is effective (worth scaling up), 20% ineffective.
     - Utilities (simplified in monetary terms, ignoring the cost of the pilot for now):
          - If effective and scaled up: net benefit = benefit - $2m (cost of scale-up). Let benefit be $3m (so net $1m).
          - If ineffective and scaled up: net benefit = -$2m (no benefit, so loss of the cost).
          - If not scaled up: net benefit = 0.

          So:
            EU(scale-up) = 0.8 * 1m + 0.2 * (-2m) = 0.8 - 0.4 = $0.4m = $400,000.
            EU(not) = 0.

          So without pilot, they would scale up (expected utility $400k).

     - With the pilot:
          The pilot can give two signals: positive (suggesting effective) or negative (suggesting ineffective).
          We need P(positive) and P(negative), and the updated beliefs.

          Assume the pilot is a perfect test (for simplicity). Then:
            P(positive | effective) = 1, P(positive | ineffective) = 0.
            So P(positive) = 0.8, P(negative)=0.2.

          After a positive signal: P(effective|positive)=1, P(ineffective|positive)=0.
            Then EU(scale-up|positive) = 1m, EU(not|positive)=0 -> best action: scale up (EU=1m).

          After a negative signal: P(effective|negative)=0, P(ineffective|negative)=1.
            Then EU(scale-up|negative) = -2m, EU(not|negative)=0 -> best action: not (EU=0).

          So EU(info) = P(positive)*1m + P(negative)*0 = 0.8*1m + 0.2*0 = $800,000.

          But note: this is the expected utility without subtracting the cost of the pilot. We are comparing to the without-info case which was $400k. However, the without-info case did not include the pilot cost. So:

          Without pilot: net EU = $400k (since no pilot cost).

          With pilot: the expected utility from the program decision is $800k, but we subtract the cost of the pilot: $40k -> net EU = $760k.

          Then EVI = (net EU with info) - (net EU without info) = 760k - 400k = $360k.

          Since EVI ($360k) > cost of pilot ($40k), it is worth gathering.

     However, note that the pilot is not perfect? The problem says "mostly tell them something they already 80% believe". But we assumed a perfect test. What if the test is noisy?

     Let's assume the pilot has 90% accuracy (since they already have 80% confidence, the pilot might be more reliable). Then:

          P(positive | effective) = 0.9, P(negative | effective)=0.1
          P(negative | ineffective)=0.9, P(positive | ineffective)=0.1

          P(positive) = P(positive|effective)*P(effective) + P(positive|ineffective)*P(ineffective)
                     = 0.9*0.8 + 0.1*0.2 = 0.72+0.02=0.74
          P(negative)= 1-0.74=0.26

          After positive:
            P(effective|positive) = [0.9*0.8] / 0.74 ≈ 0.97297
            P(ineffective|positive)=0.02703
            EU(scale-up|positive)= 0.97297*1m + 0.02703*(-2m) ≈ 972,970 - 54,060 = 918,910
            EU(not|positive)=0 -> so scale up.

          After negative:
            P(effective|negative)= [0.1*0.8] / 0.26 ≈ 0.3077
            P(ineffective|negative)=0.6923
            EU(scale-up|negative)=0.3077*1m + 0.6923*(-2m) ≈ 307,700 - 1,384,600 = -1,076,900
            EU(not|negative)=0 -> so not scale up.

          Then EU(info) = P(positive)*918,910 + P(negative)*0 = 0.74*918,910 ≈ 680,000

          Net EU with info = 680,000 - 40,000 = 640,000

          Without pilot: 400,000 (as before)

          EVI = 640,000 - 400,000 = 240,000

          Still, 240,000 > 40,000 -> worth it.

     But note: the analyst might not do these calculations perfectly. However, we are illustrating.

     Therefore, the procedure leads to: Gather the pilot.

  Case 2: City deciding whether to commission a $100k study before rolling out a policy the mayor has already publicly committed to.

  Step 1:
     - Main decision: whether to roll out the policy (which the mayor is committed to) or not (but the mayor is committed, so maybe not an option?).
     - Proposed information: a study costing $100k.
     - Cost: $100k.

  Step 2:
     - Will the study change the decision problem? 
          - Yes, because the mayor is publicly committed. If the study is positive, it will strengthen the commitment. If negative, it might force the mayor to abandon the policy (against their will) or cause political fallout. Also, new options might emerge (e.g., modify the policy). Moreover, the study itself becomes a political tool.

     So we go to Step 3.

  Step 3: 
     - Can we model the expanded problem? 
          - It's complex. The outcomes are not just about the policy effectiveness but also political consequences. The utilities might change (e.g., the mayor's utility function might change if they are embarrassed). 
          - It is difficult to assign probabilities and utilities to political outcomes. 
          - Therefore, we might not be able to build an expanded decision tree. Go to Step 6? But let's try Step 5 first because Step 3 says if we can't model, go to Step 6, but we can also consider Step 5 for strategic concerns.

     Alternatively, we might note that the decision problem is not fixed because the commitment of the mayor might make the "without info" action forced (roll out). But the study might change that.

     Given the complexity, we skip to Step 5 (since Step 3 fails) but note that Step 5 is about strategic concerns.

  Step 5: Assess strategic concerns.
     - The study could be used by opponents to force the mayor to abandon the policy if negative. This might be good if the policy is bad, but the mayor is committed and might face political costs from reversing. Also, the mayor might ignore the study? 
     - There is an option value of ignorance: without the study, the mayor can proceed without having to publicly confront negative information. 
     - The risk: if the study is negative, it might force the mayor to abandon a policy that they believe in (and have committed to) and cause political damage. But if the policy is indeed bad, then abandoning might be better. 

     However, note that the mayor is already committed. If the study is negative, the mayor might be forced to change, causing political harm and possibly leading to a worse policy outcome (if the policy is actually good) or better (if bad). But the key is that the information may force an action that without the information would not have been taken (the mayor would have proceeded). 

     Without the study, the mayor proceeds. The expected utility of proceeding is based on current beliefs. Let’s say the current belief is that the policy is effective with probability p. But the mayor is proceeding regardless? Then the EU without study is: p * (benefit) + (1-p) * (harm) [ignoring political costs].

     With the study, if it’s positive, the mayor proceeds and gets the benefit (and maybe extra political gain). If negative, the mayor might be forced to abandon, avoiding harm but incurring political cost. 

     However, we don't have numbers. The strategic risk is that the study might lead to a worse outcome due to political constraints. For example, if the study is negative, the mayor might be forced to abandon a policy that is actually good (because of the public pressure) and then the city loses the benefit and the mayor also loses political capital. 

     Given that the mayor is already committed, the study might create a no-win situation if negative. Therefore, the information could hurt. 

     Also, the cost is $100k, which might be better spent elsewhere.

     Without being able to quantify, the analyst might judge that the risks (of forcing a suboptimal action and political costs) outweigh the benefits (which are to avoid a bad policy). Moreover, since the mayor is committed, the study might not change the policy outcome (if the mayor will proceed regardless) but will only add cost and risk.

     Therefore, the recommendation would be: do not gather the information.

     However, note: if the analyst believes that the policy might be very harmful and the mayor might be persuaded by a negative study to avoid it (which would be good), then the study might be worth it. But given the commitment, the mayor might not change. This is a judgment.

     We'll take a stand: in this case, the procedure leads to "do not gather" because of the strategic risks and the cost.

     But note: if the analyst can quantify, they might go back to Step 4. However, the problem states the mayor is committed, so without the study the action is fixed (roll out). Then:

          Without study: only one action (roll out), so EU(roll out) = p * benefit + (1-p) * harm.

          With study:
            If positive: roll out -> get benefit (and maybe extra political gain, which we ignore for simplicity).
            If negative: then the mayor abandons -> avoid harm, but incur a political cost (say, C) and the cost of the study.

          Let:
            P(positive) = ... (based on current belief p and study accuracy)

          But we don't know p, benefit, harm, or the study accuracy. And the political cost C is hard to quantify.

     Since the analyst has limited stats and a week, they might not be able to do this. Therefore, we stick with Step 5: risks outweigh benefits -> do not gather.

  Definite recommendations:
     Case 1: Gather the pilot. (Because the EVI is positive and greater than cost, and no strategic concerns were raised.)
     Case 2: Do not gather the study. (Because of strategic risks and the cost of the study, and the commitment of the mayor makes the information potentially harmful.)

  Comments on Good's theorem:
     - In a fixed decision problem with free information, Good's theorem holds. But in the real world, information is not free and the problem may change. The theorem breaks when the decision problem is not fixed (endogenous changes) or when there are strategic interactions. Our procedure extends by explicitly checking for these and using judgment when necessary.

     - In Case 1, the theorem applies (fixed problem) and the information is not free but the EVI exceeds cost. So we gather.
     - In Case 2, the theorem does not apply because the decision problem is not fixed (strategic concerns and commitment) and the information might be harmful. So we do not gather.

  One of the answers you won't like: You (as a decision theorist) might argue that in Case 2, the study might still be valuable to avoid a harmful policy. But the procedure, due to the strategic concerns and the mayor's commitment, says not to gather. This is a judgment call that prioritizes avoiding political risks and the cost of the study.

  Finally, note that the procedure flags Step 5 and Step 6 as judgment calls. In Case 2, we used Step 5 (strategic assessment) which is judgmental.
answer: |-
  Below is a decision procedure for your policy lab, designed to handle the complexities of endogenous and strategic information. It's structured as a flowchart with explicit questions, exit points, and handoff criteria. The procedure explicitly rejects the universal applicability of Good's theorem in these contexts due to **endogenous problem shifts** (information changes the action set or utilities) and **strategic contamination** (information triggers uncontrollable external reactions). I'll first present the procedure, then apply it to your two cases with definitive recommendations.

  ---

  ### **Information Gathering Decision Protocol**  
  *For policy analysts with 1 week, intro stats, $50k-$500k decisions*

  **When to use**: When asked "Should we gather more info before deciding?"  
  **Inputs**: Decision context, cost of information, stakeholder map, estimated priors.  
  **Output**: (1) Gather info, (2) Don't gather, or (3) Escalate to director (values call).  

  ---

  #### **Flowchart Questions**  
  *(Follow in order; stop at first terminal answer)*

  1. **Is the information free (cost ≤ 0) and the decision problem fixed?**  
     - *Sufficient answer*: Cost includes time, money, opportunity cost, and reputational risk. Problem is "fixed" only if:  
       - Actions/options cannot change post-information.  
       - Utilities are not renegotiable with stakeholders.  
       - No self-doubt about priors (e.g., not assessing foundational assumptions).  
     - → **If yes**: Apply Good's theorem → **Gather info** (theorem holds).  
     - → **If no**: Proceed to #2.  
     - *Why stop here?* Good's theorem only applies in this narrow case. Real-world info is rarely "free," and problems often shift.

  2. **Does gathering info risk changing the decision problem?**  
     - *Check for endogenous information*:  
       - Could info reveal new options? (e.g., pilot exposes unplanned alternatives)  
       - Could it alter utilities? (e.g., stakeholders redefine "success" post-study)  
       - Does it address self-trust? (e.g., "Do we believe our 80% prior?")  
     - → **If no**: Proceed to #3.  
     - → **If yes**: Proceed to #4.  
     - *Judgment note*: Flag if stakeholders are litigious, adversarial, or politically volatile.

  3. **Is Expected Value of Information (EVI) > cost with 95% confidence?**  
     - *Calculation*:  
       - EV(no info) = Max[Σ P(outcome|action) * Utility(outcome)] for current actions.  
       - EV(with info) = Σ [P(info) * Max[Σ P(outcome|action, info) * Utility(outcome)]] for all info scenarios.  
       - EVI = EV(with info) - EV(no info).  
     - *Sufficient answer*: Use conservative estimates. Requires:  
       - Mappable actions/outcomes.  
       - Quantifiable utilities ($$, QALYs, etc.).  
       - Intro-stats-friendly tools (e.g., decision trees, sensitivity analysis in Excel).  
     - → **If EVI > cost**: **Gather info**.  
     - → **If EVI ≤ cost**: **Don’t gather**.  
     - → **If unquantifiable**: Proceed to #4.  
     - *Why 95% confidence?* Hedges against low-stat-skill estimation errors.

  4. **Does info create strategic risks?**  
     - *Check for strategic information*:  
       - Can opponents/stakeholders weaponize the info? (e.g., FOIA requests, leaks)  
       - Will it force irreversible actions? (e.g., public pressure to act post-disclosure)  
       - Is ignorance preferable to avoid coercion? (e.g., "plausible deniability" value)  
     - → **If no**: Proceed to #5.  
     - → **If yes**: **Don’t gather** (strategic contamination dominates).  
     - *Judgment note*: Strong default for "yes" if stakeholders are adversarial or policy is politically charged.

  5. **Is the cost of gathering > 20% of total decision budget?**  
     - → **If yes**: **Don’t gather** (opportunity cost too high).  
     - → **If no**: Escalate to #6.  
     - *Why 20%?* Heuristic for "disproportionate spend"; adjust via director input.

  6. **Escalate to director for values call**  
     - *Handoff criteria*:  
       - Endogenous shifts (#2) or strategic risks (#4) are present but unquantifiable.  
       - Conflicting stakeholder utilities (e.g., equity vs. efficiency tradeoffs).  
     - *Analyst must provide*:  
       - Cost of info.  
       - 1-pager on "best guess" risks/benefits.  
       - Stakeholder conflict map.  

  ---

  ### **Where Good's Theorem Breaks**  
  - **Endogenous information**: Info that changes actions/utilities violates Good's fixed-decision assumption.  
  - **Strategic information**: External reactions make "expected value" incalculable (no Nash equilibrium).  
  - **Self-doubt**: Asking "Should we trust our prior?" creates circularity (no prior to anchor on).  
  - **Option value of ignorance**: Avoiding coercion can justify not gathering info.  
  *→ Theorem is inapplicable to most policy contexts. Always gathering info is* ***not justified***.

  ---

  ### **Case Applications**  
  #### **Case 1: $40k Pilot Before $2M Scale-Up**  
  - **Context**: Pilot confirms 80% prior belief. No stakeholder shifts expected.  
  - **Procedure walkthrough**:  
    1. **Cost**: $40k > 0 → Not free.  
    2. **Endogenous risk?** Unlikely (no new actions; utilities stable) → Proceed to #3.  
    3. **EVI calculation**:  
       - EV(no info) = Scale-up: [0.8 × $1M] + [0.2 × -$2M] = **$400k**.  
       - EV(with pilot):  
         - Pilot positive (P=0.8): Scale-up → $1M.  
         - Pilot negative (P=0.2): Cancel → $0.  
         - EV = (0.8 × $1M) + (0.2 × $0) - $40k = **$760k**.  
       - EVI = $760k - $400k = **$360k** > $40k cost.  
    4. **Strategic risks?** None stated → **Gather info**.  
  - ***Recommendation***: **Run the pilot**. EVI dominates cost; no strategic threats.  
  - *Why you might dislike this?* If the pilot’s 80% prior is untrustworthy (self-doubt), but the procedure flags this in #2. Here, it’s assumed stable.

  #### **Case 2: $100k Study for Mayor-Committed Policy**  
  - **Context**: Mayor publicly committed; study could trigger backlash.  
  - **Procedure walkthrough**:  
    1. **Cost**: $100k > 0 → Not free.  
    2. **Endogenous risk?** Yes (study may force mayoral reversal → utilities change) → Proceed to #4.  
    3. **Strategic risks?** Yes:  
       - Info is bargaining chip (opponents demand policy cancelation).  
       - Commitment problem: Mayor cannot "un-know" or ignore results.  
       - Option value of ignorance: Avoidance preserves mayor’s autonomy.  
       → **Don’t gather** (terminal answer at #4).  
  - ***Recommendation***: **Do not commission study**. Strategic contamination risk dominates.  
  - *Why you might dislike this?* As a formal epistemologist, you value truth-seeking. But the procedure prioritizes avoiding real-world harm from stakeholder coercion.  

  ---

  ### **Limitations & Caveats**  
  - **Judgment dressed as math**: EVI (#3) uses quantifiable proxies but ignores unmeasurable social values (flagged for handoff).  
  - **What it can’t do**:  
    - Model complex game-theoretic reactions (needs advanced stats).  
    - Resolve deep moral conflicts (e.g., equity vs. efficiency → director’s call).  
    - Handle rapidly changing contexts (e.g., crises).  
  - **Designed for your constraints**: Fits 1-week timeline, intro stats, and director signoff.  

  **Final take**: Good's theorem is a useful toy, not a policy tool. In ambiguity-rich, stakeholder-driven worlds, **strategic silence often dominates informational greed**. Use this procedure to force disciplined tradeoffs—and deflect requests for "always gather more data."
