prompt: |-
  I'm a high school student, and for the extended essay attached to my philosophy course I've been working through Elizabeth Anscombe's attack on the decision to award Harry Truman an honorary degree at Oxford — the episode in which she argued that the bombings of Hiroshima and Nagasaki were murder, that Truman was therefore a murderer, and that a university's decision to honour him was a scandal rather than a lapse of taste. What interests me is that she seems to be making a claim of a peculiar kind: not that the bombings had bad consequences, or fewer good ones than people suppose, but that intentionally killing the innocent is absolutely prohibited, and that this prohibition does not bend no matter how much good might come of bending it. Her way of defending that, as I understand it, leans on a distinction between what an agent intends, whether as his end or as his means, and what he merely foresees as a side effect of what he does — which is why she can condemn the deliberate terror-bombing of cities while allowing, in principle, a strike on a military target whose collateral deaths are foreseen but not aimed at. At lunch two friends and I argued about this until we were told to leave: one of them insists Truman saved hundreds of thousands of lives, the other says that is exactly the sort of accounting Anscombe was refusing to do, and neither could tell me what evidence would ever make the other change his mind. I have more or less come round to her position, and that worries me, because I cannot tell whether I have come round to an argument or to a wall.

  So I want you to treat the position as mine and map its exposure. What would count against it — which arguments, intuitions, historical facts, or formal results should actually move me, sorted by how decisive they would be, from the ones that would be fatal to the ones that are merely awkward? I would like you to distinguish two things I suspect are tangled together: whether the absolute prohibition on intending the death of the innocent is a substantive moral thesis, in which case consequences and cases can bear on it, or a conceptual thesis about the description under which an action is intentional, in which case almost nothing empirical could touch it — and if it is the latter, whether that is a virtue or a way of buying immunity. Then tell me honestly whether the position has been qualified into unfalsifiability, and whether that is a problem for a view of this kind. Please include, among the defeaters, at least the following, evaluated rather than merely listed: the objection that a rule whose whole point is to protect the innocent ends up forbidding the acts that would protect the most innocents, which looks self-defeating; the case of a drone operator who destroys a house in which a wanted commander is meeting, knowing that the commander's family is inside, and who insists that he does not intend their deaths; the charge that the category of the innocent, rather than the prohibition, is doing all the work, so that the view may be far narrower or far more demanding than it first appears; and the thought that her verdict on Truman does not change at all if the bombings turn out, unknowably, to have been pointless — which either shows the view is immune to consequences by design or shows that it never was a view about what to do. I also want to know what the position predicts that its rivals do not: if it is true, where should we expect to find a difference in kind between two acts with identical body counts, and is that prediction testable in anything but hindsight? For each defeater, say which ones a committed follower of Anscombe would concede as genuinely counting against her and which ones she would dismiss out of hand, and why the dismissal is or is not legitimate. What I would personally find most persuasive is a demonstration that the very same criterion that condemns Truman also condemns something I am certain was permissible, or that the criterion cannot be stated without circularity — so if you think that is the shape of the real problem, say so, and if you think the position survives that, tell me what it costs to hold it.
reasoning: |-
  Okay, let me approach this deep philosophical query methodically. The student presents a sophisticated engagement with Anscombe's position on moral absolutes, specifically her condemnation of Truman's atomic bomb decision based on the principle of intentionally killing innocents. They've clearly wrestled with the core tension between consequentialist calculations and deontological constraints.

  The student's primary concern seems to be epistemological: has their acceptance of Anscombe become dogmatic ("a wall") rather than reasoned? They request a vulnerability assessment of the position, particularly regarding its falsifiability and conceptual coherence. The depth of their inquiry suggests they've moved beyond surface-level debate into meta-ethical territory.

  First, I need to address the student's distinction between substantive moral thesis and conceptual thesis. This is crucial because if Anscombe's prohibition is purely conceptual (about what constitutes "murder"), it becomes resistant to empirical counterarguments in a way that substantive claims aren't. I recall Anscombe's work in "Modern Moral Philosophy" grounds morality in human flourishing - so there might be a naturalistic basis here that could respond to consequences indirectly.

  For the defeaters they listed: The self-defeating rule objection (protecting innocents by forbidding actions that save them) requires examining whether moral rules can have "threshold deontology" exceptions. The drone operator case probes whether intention can be psychologically separated from foresight. The innocence categorization problem connects to broader just war theory debates about combatant/non-combatant distinction. The "unknowably pointless bombings" scenario tests if the view cares about actual outcomes at all.

  What worries me most is the student's request for a concrete example where Anscombe's principle condemns something clearly permissible. I'm considering cases like self-sacrifice or unintended deaths in medical triage - but these might not satisfy them. The circularity challenge (defining "intention" precisely) might be more damning. Anscombeans could retreat to phenomenological descriptions of agency, but that risks making the position unfalsifiable.

  Historically, I should note that Anscombe herself acknowledged the doctrine might demand martyrdom rather than sin - which she saw as a feature, not a bug. But for a high school student writing an extended essay, emphasizing this cost might help them articulate why the position remains compelling despite its burdens.

  The predictive power question is sharp: Does Anscombe predict behavioral differences or just retrospective judgments? This touches on moral philosophy's purpose - is it for guidance or evaluation? I'll need to admit that the difference often appears only in agents' mental states, not observable outcomes.

  Throughout, I'll maintain that the strongest aspect of their inquiry is recognizing that philosophical positions aren't "true" by coherence alone, but must withstand being "tested to destruction." That's remarkably mature for a high school student.
answer: |-
  Here’s a systematic vulnerability assessment of the Anscombe/Thomistic double-effect position you’ve adopted, structured by decisiveness and addressing your core concerns. I’ll treat the position as yours and subject it to rigorous stress-testing.

  ---

  ### **I. Core Tension: Conceptual Thesis vs. Substantive Moral Claim**
  **Your worry:** Is this a conceptual claim about intentional action (immune to consequences) or a moral norm (open to empirical challenge)?  
  **Resolution:** It’s both, but the fusion creates vulnerabilities:  
  - **Conceptual pillar:** Intending evil (even as means) *always* corrupts the act, making it *intrinsically* wrong. This is a claim about action-description.  
  - **Moral pillar:** This corruption violates an absolute duty grounded in natural law/respect for persons.  

  **Vulnerability:** If "intention" is defined circularly (e.g., "whatever makes an act wrong"), the position becomes unfalsifiable. *This is the deepest flaw*.  

  ---

  ### **II. Decisive Defeaters (Potentially Fatal)**
  #### **A. The Circularity/Unfalsifiability Problem**  
  - **The charge:** The distinction between "intended" and "foreseen" is retrofitted to match intuitions about permissible acts. E.g., "If collateral deaths make an act wrong, we call them intended; if not, we call them foreseen."  
  - **Why it’s fatal:** If intention is defined by moral outcome, the theory explains nothing. It becomes a linguistic shield.  
  - **Anscombe’s reply:** Intention is determined by the *agent’s reason for acting* (e.g., "I destroy the house *to kill the commander*; civilian deaths aren’t my tool").  
  - **Counter-reply:** Psychology is murky. Agents can frame motives strategically (e.g., Truman: "I bombed *to end the war*; civilian deaths were foreseen but unintended").  
  - **Cost to hold the position:** You must accept that intention is objectively discernible via action/logic (e.g., "If you couldn’t achieve your goal without the deaths, you intended them"). This demands high confidence in moral realism.  

  #### **B. The "Innocence" Problem**  
  - **The charge:** "Innocent" smuggles in contested assumptions. Combatants in a just war? Civilians producing weapons? Conscripts? If "innocent = non-threatening," bombing Hiroshima’s factory workers might *not* be innocent.  
  - **Why it’s decisive:** If "innocence" collapses, the prohibition loses its target. Anscombe’s view may *demand pacifism* (if all war inevitably kills innocents) or *permit total war* (if few are truly "innocent").  
  - **Anscombe’s reply:** "Innocent" means *not currently engaged in unjust aggression*. Civilians, children, non-combatants are innocent.  
  - **Vulnerability:** Modern war blurs combatant/civilian lines. Her rule might forbid *all* warfare since collateral damage is inevitable—a self-defeating outcome for a rule meant to protect life.  

  ---

  ### **III. Strong but Not Fatal Defeaters (Awkward but Survivable)**  
  #### **A. The Self-Defeating Rule Objection**  
  - **The case:** A terrorist will nuke a city unless you intentionally kill one innocent child. Refusing *maximizes* innocent deaths.  
  - **Why it’s awkward:** The rule forbids the only act that saves net innocents. This clashes with moral common sense.  
  - **Anscombe’s reply:** Moral rules aren’t calculators. Intending evil corrupts the agent and society. We cannot "bargain with evil."  
  - **Cost to hold:** You must accept that letting millions die is preferable to murdering one. This demands heroism/martyrdom.  

  #### **B. The Drone Operator Case**  
  - **The scenario:** A drone operator bombs a terrorist’s home, killing his family, insisting he only "intended" to destroy the building.  
  - **Why it’s awkward:** This looks identical to terror bombing if family death was certain. Distinguishing "intent" seems semantic.  
  - **Anscombe’s reply:** If the deaths were *necessary for success* (e.g., the terrorist would only be home for family dinner), they’re intended. If truly collateral (e.g., he targeted the building’s structure alone), they’re foreseen.  
  - **Vulnerability:** In practice, proportionality (foreseen deaths vs. military gain) often *does* sway judgments—suggesting consequences matter.  

  ---

  ### **IV. Weak Defeaters (Easily Dismissed by Anscombe)**  
  #### **A. "The Bombings Saved Lives"**  
  - **Anscombe’s dismissal:** Consequences don’t justify intending evil. If Truman murdered innocents, *even saving millions is irrelevant*.  
  - **Why dismissal works:** This is the core of her view. Conceding here abandons the position.  

  #### **B. "What If the Bombings Were Pointless?"**  
  - **Anscombe’s reply:** Truman’s guilt hinges on his *intention* at the time, not outcomes. If he *intended* civilian deaths to coerce surrender, it’s murder—regardless of later revelations.  
  - **Why it’s not a problem:** This coheres with the view that morality tracks intentions, not results.  

  ---

  ### **V. Predictions & Testability**  
  - **Prediction 1:** Two acts with identical outcomes (e.g., 100K dead) differ morally if:  
    - **Act A:** Dead civilians are the *means* (e.g., terror bombing to demoralize).  
    - **Act B:** Dead civilians are *side effects* (e.g., bombing a missile base; civilians die incidentally).  
  - **Testability:** Only via *agent testimony* and *logical reconstruction of their reasoning*. Hindsight is useless.  
  - **Vulnerability:** This moral difference is invisible to outsiders. It privileges the agent’s psychology over observable harm.  

  ---

  ### **VI. The Real Problem: Circularity & the Martyrdom Demand**  
  **Your request:** *"Show me a case where this principle condemns something clearly permissible."*  
  - **Case: Sacrificing oneself to save others.** Jumping on a grenade *intends* your own death as a means to shield others. If "innocent" includes yourself, this is self-murder.  
    - **Anscombe’s escape:** You may *accept* death, but not *intend* it. Distinction: "I jump to cover the grenade (intended act); my death is foreseen but unintended."  
    - **Why it’s unsatisfying:** This feels like sophistry. The act is incoherent without the death.  

  **The cost of holding this position:**  
  1. **Moral solitude:** You’ll condemn universally praised acts (e.g., Truman) and defend counterintuitive distinctions.  
  2. **No tragedy resolution:** In true dilemmas (e.g., kill one or let five die), you must let five die—and call it duty.  
  3. **Epistemic burden:** You must claim certainty about intentions (Truman’s, your own) amid ambiguity.  

  **Survival verdict:** The position *can* survive if you:  
  - Accept that intention is objective (not psychological).  
  - Define "innocent" narrowly and consistently.  
  - Embrace that morality forbids optimizing outcomes.  

  **But its immunity comes at the price of isolation from common moral intuitions.** It’s a fortress—secure but austere. Whether that fortress is built on rock or circular logic depends on your faith in moral absolutes. Your worry about "coming round to a wall" is profound: this view *is* a bulwark against consequentialism. Its strength is its refusal to bend; its weakness is its refusal to bend.  

  For your essay, I recommend confronting the circularity charge head-on. If Anscombe’s distinction is more than post-hoc labeling, *where does it come from?* If from reason, defend that. If from revelation, admit it. Anything less risks unfalsifiability.
