          The properties (4) IIA and (5) individual monotonicity are in conflict. 
          In practice, many game theorists drop IIA because it is less intuitive in the context of bargaining. 
          The reason is that the removal of alternatives may change the relative bargaining power even if the solution point is still available. 

          For example, in the first example we had with the quadrilateral, when we removed the points that were not chosen, we also removed threats (like the point (4,0) which could be a threat for player1: "I can hold out for more"). 

          So which to drop? 
            If you want the KS solution, you drop IIA.
            If you want the Nash solution, you drop individual monotonicity.

          What do you lose by dropping IIA? 
            You may have solutions that are not robust to the addition of irrelevant alternatives. But note: the addition of a very good alternative might change the solution even if the solution is not that alternative. 

          What do you lose by dropping individual monotonicity? 
            You may have that when the set expands in a way that specifically benefits one player, that player might not get a raise. 

