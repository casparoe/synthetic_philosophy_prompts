  Ah—the "cost of exit" argument is crucial for Jean-Pierre. If a girl can't remove her headscarf at school without community backlash, the secular space isn't neutral; it's her only exit ramp. Chloé would counter that forcing removal outsources the cost to her family life. Both truths hurt. 

