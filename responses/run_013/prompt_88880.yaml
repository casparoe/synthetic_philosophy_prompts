prompt: |-
  I'm a novelist — fourth book, and my first one with a real historical setting (a small port city, roughly the 1890s, though I'm making up most of the people in it). I'm about two thirds through and I've noticed something worrying: I keep switching between three completely different relationships to the past and I have no idea which one each scene wants. Sometimes I'm writing a scene because some old figure was magnificent and I want my reader to feel that magnificence and take courage from it. Sometimes I'm lovingly cataloguing how people kept their accounts, what was in the pantry, what the harbour sounded like at four in the morning, purely because I've spent two years learning it and I can't bear to throw it away. And sometimes I'm writing to put a period on trial — to show that a thing my characters treat as natural and eternal was in fact made by people who could have made it otherwise, and that it was rotten.

  It only occured to me recently that this is basically the three ways Nietzsche says we can do history for the sake of life — monumental, antiquarian, critical — and that he thinks each one has a disease it slides into if you don't watch it. Which is very flattering to me, except I have no idea how to turn that into something I can actually use at the desk, at 11pm, on a Tuesday, when I've got a scene half-written and I'm not sure if I'm writing it for the right reason.

  So: give me a procedure. A reusable one, that I run per scene or per historical element before I commit to it — questions in order, what counts as a good enough answer to each, and where the thing stops with a no and tells me to cut it. Where the procedure reaches a question that's genuinely about what kind of book I want to write rather than about the material, it should say so and hand it back to me instead of pretending to decide. I'd like it to run in ten minutes, tops. I'm not a philosopher and I'm not going to re-read the essay while I'm drafting. My editor sees the manuscript in March and I'd like to be able to defend each choice in one sentence, so build in whatever it takes to produce that sentence.

  Then run it on three things that are actually in my draft:

  - A battle scene I'm very attached to, where a character's grandfather is at his finest. I think this is my best writing in the book. I suspect you're going to tell me something I won't like about it.
  - A chapter that is basically a long inventory of a household — objects, recipes, the way people addressed their servants — that I love and that does almost nothing to move anything forward.
  - A subplot where I'm using a real institution of the period to show my characters that its cruelties were contingent and changeable, which I now worry is me delivering a verdict rather than telling a story.

  For each, tell me which mode the procedure thinks I'm in, whether that's the mode the scene needs, and what the procedure says to do — and where it just shrugs. And at the end, be honest about what this procedure can't do: Nietzsche was talking about a culture keeping itself healthy, not about a novel, and I don't want to kid myself that his categories fit my problems more neatly than they do.
reasoning: |-
  Okay, the user is a novelist working on their fourth book, set in a historical port city in the 1890s. They're struggling because they keep switching between three different approaches to the past—monumental, antiquarian, and critical—based on Nietzsche's ideas. They need a practical procedure to decide per scene which approach to use, and they want it fast and actionable. Plus, they want examples applied to their specific scenes.

  First, I need to recall Nietzsche's three modes: monumental (celebrating greatness), antiquarian (preserving details), and critical (judging the past). Each has a downside: monumental can become myth-making, antiquarian can turn into hoarding, and critical might lead to moralizing. The user needs a way to avoid these pitfalls in their writing.

  The user is two-thirds through the manuscript and needs to streamline their process before their editor sees it in March. They want a reusable method that takes about ten minutes per scene. The key is to help them identify the purpose of each scene and ensure it aligns with the book's overall goals. They also mentioned wanting to defend each choice in one sentence, so the procedure must generate that justification.

  Breaking down the procedure: It should start by identifying the current mode of the scene. Then, check if it serves the story's needs—character, plot, theme. Next, assess if it's slipping into the diseased version of that mode. If it fails any step, cut or revise. The procedure must flag when a decision depends on the author's intent for the book, not just the material.

  Now, applying the procedure to their three examples. The battle scene (monumental) needs to show why this moment matters to the character's arc. The inventory chapter (antiquarian) must tie details to character or theme, not just dump research. The institutional subplot (critical) should avoid lecturing by integrating the critique into character development or plot.

  I should also address the limitations. Nietzsche was discussing cultural health, not novel-writing. The procedure can't resolve deeper structural issues like pacing or whether a subplot fits the main narrative. The user needs to make those higher-level decisions themselves.

  The user's deeper needs: They want confidence in their choices, efficiency in editing, and clarity to defend their scenes to their editor. They might also fear that their research-heavy approach is undermining their story. The procedure should empower them to make intentional choices without overcomplicating things.
answer: |-
  Here’s a reusable 10-minute procedure, designed for quick desk use. Nietzsche’s categories are used as diagnostic tools, not sacred rules. The goal is **intentionality and integration** – ensuring every historical element serves *your specific novel*.

  **The Historical Element Triage Procedure:**

  Run this per scene *or* per significant historical element (customs, institutions, objects, events). Have your scene/element in mind. Answer in order. Stop if you hit a "No."

  1.  **IDENTIFY THE MODE (1 min):**
      *   *Question:* Which impulse is *currently* driving this element?
          *   **Monumental (M):** Is it primarily showcasing greatness, heroism, or inspiring awe?
          *   **Antiquarian (A):** Is it primarily showcasing detail, texture, or preservation for its own sake?
          *   **Critical (C):** Is it primarily exposing flaws, injustices, or contingency?
      *   *Good Enough Answer:* A quick gut check label (M, A, or C). Don't overthink. If unsure, pick the *dominant* current impulse.
      *   *Stop if No:* (Not applicable – always pick one).

  2.  **STORY FUNCTION CHECK (3 mins):**
      *   *Question:* Does this element **actively serve** at least *one* of the following *in this specific place*?
          *   **Character:** Reveal/change a core character's motivation, belief, flaw, or relationship? Drive a character decision *now*?
          *   **Plot:** Directly cause a significant story consequence (action, revelation, setback, victory) *in the immediate sequence*?
          *   **Theme:** Develop the novel's central argument/question in a necessary way *here*? (Not just "it's historical," but how it connects to *your* core themes).
      *   *Good Enough Answer:* A clear "Yes" for *one* function *with a brief, specific reason* (e.g., "Shows why Protagonist idolizes grandfather, motivating their next risky choice," or "Establishes suffocating routine Protagonist will rebel against," or "Demonstrates the systemic cruelty Protagonist must navigate"). If it serves multiple, bonus!
      *   *Stop if No:* **CUT or RADICALLY REPURPOSE.** If it doesn't serve story *here*, it's likely indulgence or bloat, regardless of mode. (*This is the hardest but most crucial filter*).

  3.  **MODE DISEASE CHECK (3 mins):**
      *   *Question:* Is this element sliding into the "diseased" version of its identified mode?
          *   **M-Disease (Myth-Making):** Is it portraying the past/figures as *unrealistically perfect*, ignoring complexity or cost? Does the awe feel unearned or simplistic?
          *   **A-Disease (Hoarding):** Are the details presented *for their own sake* rather than filtered through character POV or serving atmosphere *that impacts the story*? Does it feel like an info-dump from your notebook?
          *   **C-Disease (Moralizing):** Is the critique *told*, not shown? Does it feel like *your* modern verdict being *announced*, rather than emerging naturally from character experience, conflict, or the world's inherent logic? Is it simplistic "good vs. bad"?
      *   *Good Enough Answer:* An honest "No," or "Yes, but..." with a *specific tweak* to mitigate it (e.g., "Yes (Myth), add a line showing the grandfather's exhaustion/fear cost," or "Yes (Hoarding), filter inventory through Protag's resentful/curious POV," or "Yes (Moralizing), show the institution's defenders' *believable* reasoning through dialogue, not just victims").
      *   *Stop if No:* If it passes disease check, proceed. If you can't mitigate the disease convincingly, **CUT or SIGNIFICANTLY RECAST.**

  4.  **MODE INTENTION CONFIRMATION (2 mins):**
      *   *Question:* Is the identified mode (M, A, C) **the most effective way** to serve the story function identified in Step 2 *in this specific instance*?
          *   *Example:* Your story function is "Show why Protagonist is disillusioned." Is the *Monumental* scene about Grandpa's glory *really* the best way, or would a *Critical* scene exposing a hidden flaw, or an *Antiquarian* scene showing Grandpa's petty hypocrisy in daily life, work better?
      *   *Good Enough Answer:* A confident "Yes," or "It's effective *enough* combined with other elements," or "No, but changing the mode now would derail the draft – note for revision."
      *   ***Hand-Back Point:*** If the answer is a hesitant "No," or "I'm not sure," **THIS IS ABOUT THE BOOK YOU WANT TO WRITE.** The procedure can't decide this. You must choose: Does this scene *need* to be M/A/C to serve your core vision? Is another mode lurking that would be truer? *Make a conscious authorial choice here and note it.*

  5.  **DEFENSE SENTENCE GENERATOR (1 min):**
      *   *Action:* Synthesize Steps 1-4 into **one sentence** justifying the element's inclusion *in its final form*.
      *   *Formula:* "[Element/Scene] uses [M/A/C] history to [Story Function from Step 2], while avoiding [Disease Mitigation from Step 3] and serving [Character/Plot/Theme]."
      *   *Example:* "The battle scene uses Monumental history to establish the grandfather's legend as Protag's motivating ideal, while hinting at its personal cost, driving Protag's reckless courage in Act 3."

  **Procedure Output Summary:**
  *   **Passes Steps 2 & 3:** Keep (with tweaks if needed). Generate Defense Sentence.
  *   **Fails Step 2 (No Story Function):** Cut or Radically Repurpose.
  *   **Fails Step 3 (Unfixable Disease):** Cut or Significantly Recast.
  *   **Struggles at Step 4 (Mode Choice):** Authorial Decision Required. Pause and decide the scene's *true* purpose for *your* novel.

  ---

  **Applying the Procedure to Your Scenes:**

  1.  **The Grandfather's Battle Scene (Your Best Writing):**
      *   **Step 1 (Mode):** Clearly **Monumental (M)**.
      *   **Step 2 (Story Function):** *Does it serve Character/Plot/Theme?* Likely **Yes (Character/Theme)**. It establishes an ideal the Protagonist measures themselves against, motivates their actions/choices, embodies a specific vision of "greatness" the book explores. *Assume "Yes" based on your attachment.*
      *   **Step 3 (Disease Check):** *Myth-Making?* **High Risk.** You love it, it's "magnificent." Does it show *only* glory? Is complexity/context/cost absent? *This is the warning.*
      *   **Step 4 (Mode Intention):** *Is M the best way?* **Probably Yes,** IF the point *is* the power of the myth/ideal on the Protagonist, even if flawed. BUT requires Step 3 mitigation.
      *   **Verdict:** **KEEP, BUT MITIGATE DISEASE.** Your Defense Sentence needs to show awareness: "This Monumental battle scene establishes the grandfather's legend as Protag's defining ideal and source of courage, *while subtly framing it as a potentially burdensome or incomplete myth through [specific detail: e.g., a witness's fear, the grandfather's hidden doubt, the overlooked cost to others]*." Find *one* subtle way to crack the monument. This makes it *novelistic*, not just heroic.
      *   **What the Procedure Can't Do:** It can't tell you *how* to mitigate without changing the magnificence you love. That's craft. But it flags the *necessity* to avoid simple myth-making.

  2.  **The Household Inventory Chapter:**
      *   **Step 1 (Mode):** Clearly **Antiquarian (A)**.
      *   **Step 2 (Story Function):** *Does it serve Character/Plot/Theme?* **No (or Very Weak).** You state it "does almost nothing to move anything forward." If details aren't revealing character psychology (e.g., miserliness, aspiration, hidden anxiety), establishing atmosphere *crucial* to an imminent plot event, or directly illustrating a core theme (e.g., stifling domesticity, fragility of comfort), it likely fails.
      *   **Stop if No:** **CUT or RADICALLY REPURPOSE.** This is the core failure. Your love for the research and the details isn't enough. Hoarding is evident.
      *   **Verdict:** **CUT UNLESS REPURPOSED.** Defense Sentence impossible without passing Step 2. *Repurposing Idea:* Could it become a scene where a character's *interaction* with these objects reveals something crucial (e.g., finding a hidden letter in the pantry, the way they handle the accounts showing guilt, the servant address revealing a shift in power)? Then it becomes A-mode *in service* of Character/Plot.

  3.  **The Institutional Cruelty Subplot:**
      *   **Step 1 (Mode):** Clearly **Critical (C)**.
      *   **Step 2 (Story Function):** *Does it serve Character/Plot/Theme?* **Likely Yes (Theme/Character).** Exposing systemic cruelty and its contingency *is* thematic. Presumably, it impacts characters (victimization, complicity, awakening, rebellion). *Assume "Yes".*
      *   **Step 3 (Disease Check):** *Moralizing?* **High Risk.** You worry it's "delivering a verdict rather than telling a story." Are characters *experiencing* the contingency and rottenness through conflict, choice, and consequence? Or is the narrator/author *explaining* it? Are opposing viewpoints presented believably, even if wrong?
      *   **Step 4 (Mode Intention):** *Is C the best way?* **Probably Yes**, if critiquing this institution is core to your theme. BUT requires Step 3 mitigation.
      *   **Verdict:** **KEEP, BUT MITIGATE DISEASE.** Your Defense Sentence must emphasize *how* it's shown: "This Critical subplot exposes the institution's contingent cruelty *through the specific choices, conflicts, and consequences faced by [Character X] and [Character Y], demonstrating its human cost and potential for change within the narrative.*" Ensure the *story* delivers the critique via character agency and plot, not authorial lecture. Show characters *grappling* with the "natural and eternal" belief being challenged.
      *   **What the Procedure Can't Do:** It can't guarantee the subplot is seamlessly integrated into the *main* plot or that its pacing works. It only checks its *historical mode execution*.

  ---

  **Honest Limitations of This Procedure (As Requested):**

  1.  **Nietzsche Wasn't Writing Novels:** His focus was cultural vitality. Novels prioritize narrative cohesion, character arcs, and thematic resonance. This procedure borrows his *diagnostic categories for historical engagement* but filters them ruthlessly through *story mechanics*. It won't solve pure plot holes, weak character motivation, or pacing issues unrelated to the historical element's *mode*.
  2.  **It Prioritizes Function Over Beauty:** Your "best writing" (battle scene) might need surgery. The antiquarian chapter you love might get cut. The procedure values *why* something exists in *this* story over intrinsic quality or research effort. This is painful but necessary for a tight novel.
  3.  **Step 4 is a Cliffhanger:** It identifies when the *fundamental purpose* of a scene is an authorial choice about the book's *identity* (e.g., "Is this *primarily* a book about the weight of legacy (M), the texture of lost time (A), or the exposure of historical injustice (C)?"). The procedure flags this decision point but can't make it for you. You need your North Star.
  4.  **It Doesn't Judge "Quality":** It assesses *intentionality and integration*. A scene that passes could still be poorly written, or a cut scene might contain brilliant prose salvageable elsewhere. That's a separate editing pass.
  5.  **"Good Enough" is Subjective:** The "brief, specific reason" in Step 2 needs to convince *you* and, ultimately, your editor. The procedure provides the framework, but the rigor of your answers determines its effectiveness.
  6.  **Theme is Slippery:** Defining your core theme(s) clearly is crucial for Step 2 & 4. The procedure assumes you have this clarity. If not, it might feel vague.

  **In essence:** This procedure is a sharp knife for historical indulgence and unintentional mode-slide. It forces clarity on *why* a piece of the past belongs in *your specific story*, using Nietzsche's categories as warning signs. It generates your defense sentence by design. But it won't write the book for you, define its deepest purpose, or fix non-historical problems. Use it as a ruthless, time-efficient triage nurse at 11 pm on a Tuesday. Good luck with the final third and March!
