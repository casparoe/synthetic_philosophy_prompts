prompt: |-
  I am a senior probabilistic ML engineer. I build factor graphs and probabilistic programs for a living, and I think in terms of variable nodes, factor nodes, message passing, sum-product and max-product, KL projection, hard and soft factors, conditioning by clamping, marginalization, and variational inference. I have a decent grasp of Bayesian networks and the difference between observational and interventional distributions. I want you to restate the Judy Benjamin problem, and the debate it has generated about updating on conditionals, in my vocabulary, as faithfully as you can, and then give me a residue report.

  Here is the problem as I understand it, so you know what to translate. An agent has a joint distribution over two binary variables, R and S. She receives a report that is naturally represented as a constraint on a conditional credence, something like P(S | R) = q, where q is strictly between 0 and 1. The report is not a proposition in her probability space, so she cannot simply conditionalize on it. The question is how she should revise her joint distribution. Proposed rules include relative entropy minimization subject to the constraint, Jeffrey conditioning (updating on a partition), Adams conditioning (updating on a conditional), and various others, and they disagree. In the original story, the agent is lost in a forest divided into Red and Blue territories, and the report concerns whether she is in the Second Company area if she is in Red. The debate is about which rule is correct, whether there is a unique rational response, and what the constraint is really telling the agent.

  Translate this into my vocabulary. Treat the agent's credences as a factor graph or a probabilistic program; treat the constraint as a factor, a soft factor, or a constraint on a factor; treat the update rules as inference procedures. In particular, consider whether a constraint on a conditional probability can be encoded as a factor in a standard factor graph without adding auxiliary variables or changing the graph, and what that implies for the translation. For each of the main positions or proposed rules, say what it becomes in my terms. Then give me the residue report: what translates cleanly, what translates only with distortion, and what cannot be expressed in my vocabulary at all. I am especially interested in whether the distinction between a conditional event and a conditional credence survives; whether the difference between hard and soft factors captures the debate; whether belief propagation or variational inference can represent the update without changing the graph; and whether the normative question of which update rule is rational has any counterpart in my framework. Tell me whether the residue is a defect of my vocabulary or a sign that the original debate is less clear than it looks. I care more about the translation and the residue than about historical accuracy, so if you are unsure of a detail, say so rather than guessing.

  Answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
