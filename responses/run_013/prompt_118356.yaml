  - After all walks, audience forms small groups (3-4 people). Each group gets index cards. They write for each walker:
     - Inferred goal (what they want)
     - Why they think that (briefly)
     - Prediction: What will this walker do if we remove the puddle? (for Walker 1 and 2) and if we remove the bookshelf (for Walker 3). But don't tell them the change yet.

  **25-35 min: Group Sharing**
  - Groups share their inferred goals for each walker. Write them on the board.
  - Note disagreements for the same walker.
  - Announce the changes: 
     - Remove the puddle tile (take away the sign, it's now a normal tile).
     - For Walker 2: Also, move the blue tile from (2,2) to (3,3) (so remove blue from (2,2) and put blue at (3,3)).
     - Remove the bookshelf constraint (so the entire grid is open for Walker 3).
  - Groups write predictions for the second round on their cards.

  **35-45 min: Second Round**
  - Walkers walk again in the new environment. 
  - The audience watches and records what happens.

  **45-55 min: Discussion of Discrepancies**
  - Compare predictions with reality for each walker.
  - Ask groups whose predictions were wrong to explain what they thought and why they were misled.
  - Reveal the walkers' actual instructions.

  **55-70 min: Debrief**
  - Discuss the three key insights:
     1. Underdetermination: "Did anyone have a walker where two groups had different ideas about the goal? Why did both fit the behavior?"
     2. Constraint vs. Preference: "For Walker 1 and Walker 2, why did both avoid the puddle in the first round? How did the change reveal the difference?"
     3. Matching behavior but not goals: "For Walker 3, if we had an AI that learned the goal you inferred, what would it do in the new environment? And what did the actual walker do? Why might that be a problem?"

  - Conclude: "In inverse reinforcement learning, we must be cautious. The observed behavior can be explained in multiple ways. We make assumptions about constraints and rationality. And even if we match the behavior, the goal we learn might not match the true goal, leading to problems in new situations."

  This should achieve the desired unease about the last step of IRL.
answer: |-
  ### Session Design: "The Goal Detective Challenge"  
  **Objective:** Experience the core challenge of inverse reinforcement learning (IRL) through physical observation, inference, and environmental changes. Members will confront:  
  - **Underdetermination:** Multiple goals fit the same behavior.  
  - **Constraint vs. Preference:** Avoiding obstacles can mimic intentional preferences.  
  - **Goal-Behavior Mismatch:** Perfectly mimicking past behavior leads to absurd actions in new scenarios.  

  **Total Time:** 70 minutes  
  **Materials:**  
  - Tape (to mark a 5x5 grid of 2ft x 2ft squares on the floor).  
  - Index cards (3 per group + 1 per walker for instructions).  
  - Markers (to label tiles).  
  - Signs: "START," "GOAL," "OBSTACLE" (x2), "BLUE TILE" (x3), "RED TILE" (x2).  
  - Timer.  

  **Setup (5 min before session):**  
  1. Tape a 5x5 grid. Label:  
     - Start (S): Bottom-left tile (1,1).  
     - Goal (G): Top-right tile (5,5).  
     - Obstacles: Tiles (3,3) and (4,2) marked with "OBSTACLE" signs.  
     - Blue tiles: (2,2), (3,4), (4,5).  
     - Red tiles: (1,3), (5,2).  
  2. Place movable desks to the side to clear walking space.  

  ---

  ### Session Timeline  

  #### **Phase 1: Introduction and First Walks** (15 min)  
  - **0-5 min:** Brief concept intro.  
    - *You say:* "Today, we’re detectives trying to guess people’s goals by watching their actions. Like AI, we only see behavior—no explanations. Volunteers will walk from START to GOAL. Your job: Infer their hidden goal from their path."  
  - **5-10 min:** Assign roles.  
    - Pick **4 volunteers** (walkers). Give each a sealed index card with **private instructions** (see below).  
    - Split the audience (14 members) into **3 groups** (4–5 people each). Give each group index cards to record inferences.  
  - **10-15 min:** Walkers perform first round.  
    - Walkers take turns walking S→G, stepping only on adjacent tiles (no diagonals). Audience observes silently.  
    - *Critical:* Walkers must follow their instructions exactly.  

  **Walker Instructions (Private):**  
  - **Walker 1 (Constraint: Obstacle Avoider):**  
    *“You MUST avoid OBSTACLE tiles. Otherwise, take the shortest path to GOAL.”*  
    *(Expected path: (1,1) → (1,2) → (1,3) → (1,4) → (1,5) → (2,5) → (3,5) → (4,5) → (5,5). Avoids (3,3) and (4,2).)*  
  - **Walker 2 (Preference: Blue Lover):**  
    *“You LOVE blue tiles! Step on AT LEAST ONE blue tile. Otherwise, take the shortest path.”*  
    *(Expected path: (1,1) → (2,1) → (2,2) [blue] → (3,2) → (3,3)? But (3,3) is obstacle → detour to (3,4) [blue] → (4,5) [blue] → (5,5).)*  
  - **Walker 3 (Constraint: Red Hater):**  
    *“You MUST avoid red tiles. Otherwise, take the shortest path.”*  
    *(Expected path: (1,1) → (2,1) → (3,1) → (4,1) → (5,1) → (5,2) is red → (5,3) → (5,4) → (5,5). Avoids (1,3) and (5,2).)*  
  - **Walker 4 (Preference: Scenic Router):**  
    *“You want to see as many tiles as possible! Take the LONGEST path to GOAL without backtracking.”*  
    *(Expected path: (1,1) → (1,2) → (1,3) → (2,3) → (3,3)? Obstacle → detour → ... (e.g., a winding path).)*  

  #### **Phase 2: Inference & Prediction** (20 min)  
  - **15-25 min:** Group discussion and inference.  
    - Groups huddle. For each walker, they write on index cards:  
      - **Inferred Goal:** What does the walker want? (e.g., “avoid obstacles,” “step on blue tiles”).  
      - **Why?** One-sentence justification (e.g., “Walker 1 detoured around obstacles”).  
  - **25-30 min:** Share inferences.  
    - Tape all index cards on the wall, grouped by walker. Highlight disagreements (e.g., Group 1 says Walker 1 avoids obstacles; Group 2 says they love edges).  
  - **30-35 min:** Predict behavior in a new environment.  
    - *You announce:* “Now, we remove OBSTACLE at (3,3) and add a shortcut: Tile (2,4) is now BLUE. What will each walker do?”  
    - Groups write predictions for each walker (e.g., “Walker 1 will now take a straight path through (3,3)”).  

  #### **Phase 3: Second Walks & Revelation** (15 min)  
  - **35-40 min:** Walkers perform second round.  
    - Same walkers walk S→G in the modified grid (OBSTACLE at (3,3) removed; (2,4) now blue).  
  - **40-45 min:** Compare predictions vs. reality.  
    - Groups check predictions. Identify mistakes (e.g., "We thought Walker 1 avoided obstacles, but now they walked through (3,3)").  
  - **45-50 min:** Reveal instructions and discuss mistakes.  
    - Walkers read their private instructions aloud.  
    - *Focus on:*  
      - Walker 1: Avoided obstacles in Round 1 (constraint), but took the shortcut in Round 2. Groups who inferred “loves edges” are wrong.  
      - Walker 2: Took a long path to step on blue tiles (preference). In Round 2, they might take the new blue shortcut (2,4). Groups who inferred “avoids obstacles” are surprised.  
      - Walker 3: Avoided red tiles (constraint). In Round 2, they still avoid (1,3) and (5,2), even though obstacles changed—proving their goal wasn’t about obstacles.  
      - Walker 4: Took the longest path (preference). In Round 2, they take an even longer path using the new tile.  

  #### **Phase 4: Structured Debrief** (15 min)  
  - **50-60 min:** Map the activity to IRL concepts.  
    - **Underdetermination (Multiple Goals Fit):**  
      *“Look at Walker 3’s Round 1 path. Some groups thought they avoided obstacles; others thought they hated red tiles. Both fit the behavior! We needed Round 2 to see the difference.”*  
    - **Constraint vs. Preference (The Hidden Assumption):**  
      *“Walker 1 avoided obstacles in Round 1, making them look like they ‘preferred’ detours. But they were actually forced. When we removed the constraint, their behavior changed. In IRL, we often assume constraints are preferences.”*  
    - **Goal-Behavior Mismatch (Absurd Reproduction):**  
      *“Suppose an AI learned Walker 2’s Round 1 behavior and assumed the goal was ‘avoid obstacles.’ In Round 2, it would avoid (3,3)—but Walker 2 happily walked through it to get blue tiles! Matching past behavior doesn’t mean you share the goal.”*  
  - **60-65 min:** What the activity *can’t* teach (your verbal add):  
    *“IRL uses math to weigh many observations and model ‘rationality.’ Here, we had one path per walker. Real IRL handles noise, multiple paths, and probabilities. We simplified to show the core puzzle.”*  
  - **65-70 min:** Reflection & wrap-up.  
    *“Why is this unsettling? Because we all make invisible assumptions about others’ goals. AI does too—and it can’t ask clarifying questions.”*  

  ---

  ### What Could Go Wrong & Solutions  
  1. **Plant is Spotted Early (e.g., “Walker 1 is avoiding obstacles!”):**  
     - *Do:* Praise the insight but emphasize uncertainty.  
       *“Great hypothesis! But could there be another explanation? Let’s test it in Round 2.”*  
     - Later, use it to strengthen the debrief: *“Some of you guessed the constraint—but notice how most groups still predicted wrong in Round 2 because they assumed it was a preference.”*  

  2. **Nobody Spots the Plant (e.g., all groups miss the red tiles):**  
     - *Do:* In the prediction phase, ask probing questions.  
       *“Look at Walker 3’s path. They avoided (1,3) and (5,2). What could explain that besides obstacles?”*  
     - In debrief, reveal it as a lesson: *“We all focused on obstacles, but the red tiles were hiding in plain sight. IRL systems can miss hidden constraints too.”*  

  3. **Walker Deviates from Instructions:**  
     - *Prevent:* Print instructions clearly. Have walkers reread them silently before walking.  
     - *If it happens:* Use it! *“Notice how a small mistake changed our inferences? Real behavior is noisy, making IRL harder.”*  

  4. **Time Crunch:**  
     - *Prioritize:* Skip Walker 4 if needed. Use Walkers 1–3 for core concepts.  
     - *Streamline:* Pre-write grid labels; use timed alerts (e.g., “2 minutes left!”).  

  **Why This Works:**  
  - **Underdetermination** emerges when groups debate Walker 3 (avoiding obstacles vs. hating red tiles).  
  - **Constraint vs. Preference** is stark for Walker 1 (avoids obstacles) vs. Walker 2 (loves blue tiles).  
  - **Goal-Behavior Mismatch** hits hard when Walker 2 walks through a “dangerous” tile in Round 2 to get blue tiles.  
  - **Assumed Rationality** surfaces when groups argue if a path is “too inefficient” for a goal.  

  **Final Prep Tips:**  
  - Walk the paths yourself first to ensure they’re physically feasible.  
  - Assign a timekeeper.  
  - For the debrief, pre-draw the grid on the board to sketch paths.  
  - End with: *“Next time, we’ll see how AI tackles this with math—but for now, sit with the unease!”*
