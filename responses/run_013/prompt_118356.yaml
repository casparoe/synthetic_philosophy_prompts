  We are designing a session for a high school AI club that focuses on inverse reinforcement learning (IRL). The goal is to make students experience the challenge of inferring goals from observed behavior and to see the pitfalls: multiple goals can explain the same behavior, constraints can be mistaken for preferences, and matching behavior doesn't guarantee matching goals.

  Key elements:
  1. The activity must be non-programming and use paper, index cards, tape, and physical movement.
  2. The session is 70 minutes long with 18 members.
  3. We want students to see:
     a. Multiple goals can fit the same behavior.
     b. A constraint (like avoiding a tile) can be misinterpreted as a preference.
     c. An agent that reproduces the observed behavior may act in ways the original person would reject when the environment changes.

  Proposed mechanism (with improvements):
  - Use a grid of taped squares on the floor (e.g., 5x5 grid).
  - Volunteers (walkers) are given private instructions (goals or constraints) and walk from a start to a goal tile.
  - The audience observes the paths and infers the goal.
  - Then, the environment is changed (obstacles moved, added, or removed) and the walkers walk again, testing the inferred goals.

  We'll structure the session as follows:

  ### Materials:
  - Tape to mark a grid on the floor (e.g., 5x5 squares, each about 2ft x 2ft). Mark start (S) and goal (G) tiles.
  - Index cards (or paper) for the audience to write inferences and predictions.
  - Markers for labeling.
  - Signs for obstacles (e.g., "water", "lava") that can be taped to the floor and moved.
  - Private instruction cards for walkers.

  ### Roles:
  - Facilitator (you) to run the session.
  - 3-5 Volunteers as walkers (they will be given private instructions).
  - The rest of the club (about 13-15) as the audience (observers and inferrers).

  ### Setup (10 minutes):
  1. Use tape to create a 5x5 grid on the floor. Label one square as "Start" (S) and one as "Goal" (G). Place them such that there are multiple paths (e.g., S at (1,1) and G at (5,5)).
  2. Place obstacles (e.g., a "puddle" that must be avoided, or a "shortcut" that is blocked initially) using signs. For example:
     - A "puddle" tile that is to be avoided (by the walkers who are instructed to avoid it).
     - A "lava" tile that is deadly and must be avoided (for a constraint).
     - A "desired" tile that is a preferred path (for a preference).
  3. Prepare instruction cards for walkers (see below).

  ### Timeline (70 minutes total):

  #### (0-10 min) Introduction and Setup
  - Explain the concept: "We are going to try to figure out what someone wants by watching what they do. This is a key idea in AI called inverse reinforcement learning."
  - Describe the grid: start, goal, and obstacles. Explain that walkers will try to get from S to G following their private instructions.
  - Select 3-5 volunteers to be walkers (depending on time). Each will get a private instruction card.

  #### (10-25 min) First Round: Observation and Inference
  - Walkers take turns: Each walker reads their instruction privately and then walks from S to G. They must walk on the grid, stepping only on adjacent squares (no diagonals). They can take any path they choose as long as they follow their instruction.
  - The audience observes and takes notes on the paths taken. They do not know the instructions.
  - After all walkers have gone, the audience forms small groups (3-4 people) to discuss and write on an index card:
     - For each walker, what do they think the walker's goal was? (e.g., "minimize steps", "avoid puddles", "step on every blue tile", etc.)
     - Also, predict what the walker would do if the environment changes (e.g., if we remove an obstacle, add a shortcut, etc.). But don't reveal the change yet.

  #### (25-35 min) Group Sharing and Prediction
  - Each group shares their inferences for one walker (assign walkers to groups). Write the inferred goals on the board for each walker, so everyone sees the variety.
  - Focus on disagreements: if two groups have different inferences for the same walker, note it.
  - Then, announce a change to the environment (e.g., remove the puddle, or add a new obstacle, or create a shortcut by removing a barrier). Have the groups write a prediction for what the walker would do in the new environment.

  #### (35-45 min) Second Round: Test in Changed Environment
  - Rearrange the room as announced (e.g., remove the puddle tile, or add a new tile that is a shortcut).
  - The same walkers (with the same private instructions) walk again from S to G in the new environment.
  - The audience watches and checks their predictions.

  #### (45-55 min) Discussion of Discrepancies
  - For each walker, compare the predictions with what actually happened.
  - Groups that were wrong explain why they thought that and what misled them.
  - Reveal the walkers' actual instructions and discuss.

  #### (55-70 min) Debrief and Concept Mapping
  - Discuss the key ideas:
     a. **Underdetermination of goals by behavior**: Point out cases where multiple goals were proposed and both fit the original data. Ask: "What extra assumptions did you make to choose one goal over another?"
     b. **Constraint vs. Preference**: Highlight the walker who was avoiding a tile (constraint) vs. one that had a preference (e.g., to step on blue tiles). The behavior might look the same (both avoid the tile) but for different reasons. In the changed environment, the constraint-avoiding walker might now take the previously blocked path, while the preference-based walker might still avoid it.
     c. **Matching behavior but not goals**: Use a case where the inferred goal led to a prediction that failed. The agent (the walker) in the new environment did something that the inferred goal would not have done. But note: in reality, the walker's goal was fixed, so the behavior changed appropriately. However, an AI trained to mimic the old behavior might have learned a goal that leads to absurd actions in new situations.

  ### Designing the Walkers' Instructions

  We need at least three walkers with different instructions to illustrate the points. Let's assign:

  - **Walker 1 (The Constraint Walker)**: 
     - Instruction: "You must avoid stepping on the puddle tile at all costs. It's dangerous. Otherwise, take the shortest path to the goal."
     - Setup: Place a "puddle" tile in one of the paths. The shortest path without the puddle is the one they take.

  - **Walker 2 (The Preference Walker)**:
     - Instruction: "You really like stepping on blue tiles. Try to step on as many blue tiles as possible without going too far out of your way. Take a path that has at least one blue tile, but you don't have to take the very shortest path if it avoids blue tiles."
