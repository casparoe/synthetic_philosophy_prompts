prompt: |-
  My mate from a reading group has been on a Pascal kick and has built this argument that I cant stop thinking about but also can't accept. He says it's basically Pascal's view of justice and force, just cleaned up. I'm hoping you can tell me where it breaks, or if it doesn't break, which piece I should actually give up. Here it is:

  (1) There's no standard of justice we can actually get hold of that's independent of the laws and customs we grew up in. Every appeal to 'natural' justice, or to what's obviously right, turns out to just be some particular society's habits in a nicer outfit. (His Pascal gloss: custom is the whole of equity, and only because it's accepted.)

  (2) So there's nothing to measure a law against. When we call a law unjust, we aren't comparing it to any standard.

  (3) So 'unjust' can't mean 'fails to meet the standard.' The only thing it can mean is 'isn't the custom I happen to favor.'

  (4) Laws and customs are kept in place by force. A custom just is whatever pattern the prevailing force protects.

  (5) So a law is just -- in the only sense left -- exactly to the extent it's backed by enough force, and unjust exactly to the extent it isn't.

  (6) So any exercise of power that succeeds makes itself just, and any rebellion that fails was unjust by definition.

  (7) So there's no such thing as an unjust law, only stronger and weaker ones.

  That last bit obviously can't be right -- we know some laws are unjust, that's the whole reason the word exists. But I dont want to give up (1); I find it kind of convincing. I'd rather keep (1) and lose something else. So: which step do I drop, and what does dropping it cost me?

  Can you lay it out in four bits, roughly like this: 'Where it breaks' (one paragraph, naming the step and saying why that one and not the others), 'Why it looked fine' (a short paragraph on why that step seemed so plausible), 'What giving it up costs' (a paragraph or two, and include what I'd pay if instead I gave up (1) or (3)), and 'Bottom line' (two or three sentences).
reasoning: |-
  Okay, the user's friend has presented an argument inspired by Pascal about justice and force, and the user wants to know where it breaks down. The argument concludes that there's no such thing as an unjust law, only stronger and weaker ones, which the user finds unacceptable. They want to keep premise (1) but are willing to give up another step. I need to identify which step is the problem and explain why.

  Let me start by breaking down the argument step by step. Premise (1) claims that justice is entirely based on custom, with no independent standard. Pascal's view here is that equity comes solely from accepted customs. The user finds this convincing and wants to keep it. 

  Premise (2) follows from (1): if there's no independent standard, there's nothing to measure laws against. Then (3) says that calling something unjust just means it's not the custom one prefers. Step (4) links customs to force, stating that customs are maintained by prevailing force. Step (5) concludes that justice is equivalent to being backed by sufficient force. Steps (6) and (7) extend this to say that successful power is just, and failed rebellions are unjust, leading to the idea that there are no unjust laws, only stronger ones.

  The user's main issue is with (7), but they want to preserve (1). So where does the argument go wrong? Let me look at step (4). Premise (4) says that customs are whatever the prevailing force protects. But is this necessarily true? A custom might exist without being enforced by the state. For example, social customs like shaking hands or saying "please" aren't necessarily backed by force. Force might uphold laws, but customs can be more organic. So step (4) seems to conflate laws (which are enforced) with customs (which might not be). 

  If step (4) is incorrect, then the jump to (5) falls apart. Justice being tied to force only applies to laws, not customs in general. The argument assumes that all customs are maintained by force, but that's not always the case. Therefore, the conclusion that justice equals force doesn't hold. 

  Why would step (4) seem plausible? Well, in many cases, laws are enforced by the state's power. Historical examples like divine right of kings or authoritarian regimes might make this connection seem natural. However, this overlooks non-coercive customs and social norms that exist without force. 

  Giving up (4) costs the clean link between justice and force. It means justice might involve more than just power, such as social consensus or moral reasoning. But the user can still keep (1), accepting that justice is culturally relative without reducing it to force. If they gave up (1), they'd need an objective moral standard, which is philosophically heavy. Giving up (3) would mean that "unjust" refers to a standard beyond preference, which could be hard to define without (1). 

  So the bottom line is that step (4) is the problem. By distinguishing customs from force-backed laws, the user can maintain cultural relativism about justice without accepting that might makes right. This preserves the idea that laws can be unjust based on societal standards, even without an objective measure.
answer: |-
  Here's the breakdown of where the argument fails and what giving up that step costs, while preserving your commitment to (1):

  ### Where it breaks
  **Step (4):** "Laws and customs are kept in place by force. A custom just is whatever pattern the prevailing force protects." This is the critical misstep. While **laws** are often *enforced* by power, **customs** are not reducible to "whatever force protects." Customs arise from complex social practices, shared values, traditions, and informal consensus—not solely from coercion. Force may *reinforce* some customs or laws, but it doesn't *define* them. Conflating "custom" (from premise 1) with "force-backed edict" (in premise 4) smuggles in a hidden authoritarian premise that undermines the cultural relativism of (1). Justice-as-custom (from 1) and justice-as-force (from 5) are distinct concepts unjustly merged here.

  ### Why it looked fine
  Force visibly upholds *laws* (police, courts, armies), making it easy to confuse enforcement with essence. Historically, rulers often *claimed* their power defined justice ("divine right," "sovereign will"), reinforcing this illusion. Pascal himself emphasized force's role in maintaining order, making this leap seem like a natural extension of his thought. The conflation is seductive because it simplifies complex social realities into a single variable: power.

  ### What giving it up costs
  - **Cost of dropping (4):** You lose the clean, mechanistic link between justice and raw power. You must accept that customs (and thus justice-claims) emerge from social processes *beyond* mere coercion—shared narratives, collective bargaining, moral reasoning (even if culturally bound), and historical accidents. This means "unjust" (step 3) can mean "violates *our own society's* deeper customary norms" (e.g., a law legalizing torture might violate a society's long-standing custom of dignity, making it "unjust" *by that society's lights*). Rebellions can then appeal to *internal* customary ideals against the current force-backed law.
    
  - **Cost of dropping (1) instead:** You'd need an objective standard of justice (natural law, rationality, divine command) to ground critiques of laws. This rejects cultural relativism, requiring robust philosophical defense against the very historical/cultural variability that makes (1) plausible. You'd regain a clear basis for calling laws unjust but lose Pascal's insight about the contingency of moral intuitions.

  - **Cost of dropping (3) instead:** If "unjust" *doesn't* just mean "disfavored custom," you must explain its meaning without an independent standard (contra 2). This forces you into murkier territory—perhaps "unjust" signifies *internal contradictions* within a society's customs (e.g., "All men are equal" vs. slavery laws), or emotional responses rooted in evolved psychology. It's philosophically messy but preserves the reality of injustice without objective foundations.

  ### Bottom line
  The fatal flaw is equating *custom* (a social practice rooted in collective meaning) with *force-backed command* (a top-down imposition of will). By rejecting step (4), you keep Pascal's cultural relativism (1) while avoiding his authoritarian conclusion. You pay by acknowledging that justice-claims arise from complex social ecosystems—not just power—allowing you to call a law "unjust" when it betrays a society's own deepest customs, even if those customs aren't "objective." Might doesn't make right; it just makes order.
