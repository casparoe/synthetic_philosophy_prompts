  Okay, let me start by understanding the user's request. They're writing a short story for a friend's reading group with the theme "reasons without reasoners." The example given is the plant that emits a chemical to attract wasps without any intentional design. The user has a specific setup: a PhD student on an island studying a songbird's alarm call that triggers a ground-nesting bird to flee. The supervisor wants to frame it as cross-species communication for funding reasons, but the student thinks it's exploitation of a cue, not a signal. 

  The constraints are clear: under 1000 words, no specific jargon words, show purpose attribution without explanation, British English, end with concrete imagery. The deeper need here is to explore the theme through character actions and events without exposition. The user wants the story to demonstrate the concept through the narrative, not explain it.

  First, I need to establish the characters and setting efficiently. Dr. Armitage is the pragmatic supervisor focused on funding, while Maya is the skeptical student. The island setting with the birds should feel authentic. The conflict between their perspectives drives the theme. 

  Maya's experiment with the speaker is crucial. It shows her testing her hypothesis that the ground-birds are cueing into an unintended signal. The failed playback highlights the complexity—sometimes the purpose is misattributed. The leaf curl example contrasts this, where she correctly identifies a purpose without a reasoner.

  The ending with the scratched-out words and the alarm call brings it back to the unresolved tension. The supervisor's dismissal emphasizes institutional pressures versus scientific truth. Using British terms like "torch," "trousers," and spelling "behaviour" correctly is essential. 

  I need to ensure the moments of purpose attribution are clear without labels. The leaf curl scene shows correct attribution through Maya's observation and the natural consequence. The failed playback scene shows incorrect attribution via the unexpected outcome and her reaction. The concrete end—Maya's pen snapping and the alarm call in the distance—leaves the theme lingering without explanation.

  Checking word count: the draft is concise, focusing on key scenes. Avoiding jargon means showing through actions—Maya's notes, the experiment, the supervisor's focus on funding. The scratched "signal" and "cue" visually represent her internal conflict. 

  Finally, ensuring the story stays within the constraints while conveying the theme subtly. The ending with sound and object meets the user's request, leaving the reader to ponder the reasons without reasoners through the narrative.
answer: |-
  The island air clung, thick and salty, as Maya adjusted her parabolic mic, tracking a streak of brown through the wind-tossed gorse. *Pip-whirr! Pip-whirr!* The sharp, two-note alarm call of the skylark mimic sliced through the afternoon haze. Instantly, thirty metres away, a dun-coloured shape exploded from the heather – a stone-runner, bolting for the rocky scree like a feathered bullet. Maya scribbled in her battered notebook: *Run triggered. Mimic alarm, 15:07.*

  Back at the cramped field station, Dr. Armitage peered at her spreadsheet. “Consistent, Maya! Near-perfect correlation. The stone-runner *listens*.” He tapped the screen where funding review criteria glowed: *Acoustic Networks: Inter-species Dynamics*. “This ticks boxes. Cross-species alarm signalling. Clean, publishable.”

  Maya chewed her pen cap. “But sir… *why* would the mimic signal to the runner? They don’t share predators. Mimics get hawked mid-air. Runners get stalked by weasels on the ground. Makes no sense.”

  Armitage waved a dismissive hand. “Doesn’t matter *why* evolution shaped it, only that it works. The runner benefits, so the mimic’s call *serves* as a warning for it.” He emphasised the last phrase, leaning in. “That’s the story the review panel needs. ‘Signal’.”

  Later, alone on the bluffs, Maya watched a mimic preen. *Pip-whirr!* Another runner vanished. She thought about Armitage’s certainty. *Serves as*. Like the thorny bindweed choking the gorse. It *served* to climb, to strangle, without wanting sunlight. Purpose etched without an etcher.

  She set up her speaker the next dawn, hidden near a known runner scrape. Not the mimic’s call. Instead, she played the harsh, grating shriek of a hunting Peregrine – a real, mortal threat to the mimics high above, irrelevant to the ground-bound runners. If the runners were tuned to *danger*, they should bolt. If they were tuned specifically to the *mimic’s call* as a useful cue… maybe not.

  She pressed play. The falcon’s scream ripped the air. Nothing. A minute passed. Then another. A stone-runner emerged, pecked calmly at the turf ten feet from the speaker. No bolt. No cover sought. Maya’s shoulders slumped. *Wrong kind of peril. They don’t care.* She scribbled, frustration heavy: *Peregrine playback: No runner response. Not danger. Specific sound?*

  Later, examining a curled, brown leaf-edge on a windswept rowan, she showed Armitage. “See that tight curl? Perfect funnel for rainwater straight to the roots in this dry soil. Amazing bit of engineering.”

  He barely glanced. “Hmm. Or just wind damage.”

  “It’s *every* leaf on the windward side,” she insisted quietly. “Seems… shaped for it.” No mind shaped it, yet the purpose felt solid, undeniable.

  *Pip-whirr! Pip-whirr!* The real call echoed. Like clockwork, a runner fled. Armitage beamed. “Proof! Listen to it *work*.”

  Back at her desk, surrounded by spectral analysis printouts, Maya stared at the words in her notebook: *Signal or Cue?* She circled them, then scratched them out so hard the paper tore. Whose cue? The mimic didn’t produce it *for* the runner. The runner just… used it. Stole it, almost. Like rainwater finding the leaf’s curl. The *pip-whirr* just *was*. And its effect? A stone-runner safe in the rocks. A mimic… unchanged. Calling for its own reasons, heard by others for theirs.

  Armitage bustled in, holding a draft email to the funding committee. “First draft, Maya! ‘Ground-breaking evidence of intentional acoustic signalling network…’ Capture that runner reaction tomorrow on video? Gold dust.”

  Maya looked at the excited flush on his cheeks, then down at her torn notebook page. Her pen hovered over the scratched-out words. Slowly, deliberately, she drew a single arrow beside the tear: *Mimic call → Runner bolts*. No labels. Just the bare connection.

  She snapped her pen lid shut. Outside, distantly, *pip-whirr*. Somewhere, unseen, feathers rustled as a small bird pressed itself flat against cool stone.
