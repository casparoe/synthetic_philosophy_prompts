prompt: |-
  I'm a novelist — a year into a book that keeps mutating into a courtroom novel — and I've been reading trial transcripts the way other people read thrillers. Something's been nagging at me. A judge will let a doctor walk in, swear an oath, and say 'in my opinion the man had a heart attack,' and that one sentence basically decides the case: one person's say-so, and we call it evidence. The same judge will then throw out a witness who says 'the defendent told me he did it,' because that's hearsay — also somebody's say-so, only the somebody isn't sitting there. And the whole trial runs on a witness squinting at something that happened four years ago and saying 'I remember it.' So that's three different attitudes to being told something, and I can't tell whether they're three consistent applications of one theory of knowledge or three different theories wearing the same robe.

  I also fell down a rabbithole on Nyāya — the classical Indian school with the four pramāṇas, ways of knowing: perception, inference, comparison, testimony, or something like that — and apparently there was a real fight over whether taking a trustworthy person's word for a thing is its own way of knowing or just a fancy species of inference (you reason from the fact that they're reliable). And I think I read that memory doesn't even make the list, which seems nuts for a courtroom, since a trial is basically a memory contest with a stenographer. If I've got any of that wrong, tell me.

  I have no philosophy training, so unpack your terms. What I want to know: what does the law's treatment of testimony actually presuppose about how we know things? Which side of that old fight does it land on, if either — or does it not have to pick a side, with seperate theories of testimony all licensing the same rules? Where is it genuinely underdetermined, and where is it doing work that only one theory can underwrite? And if the courts took the Nyāya line seriously instead, what in the courtroom would have to change?

  Give it to me as a numbered list, exactly five items, one or two sentences each, no intro, no conclusion. Straight into my notes.
reasoning: |-
  Hmm, the user is a novelist working on a courtroom novel and is fascinated by the epistemology behind legal testimony. They've been reading trial transcripts and noticed inconsistencies in how courts treat different types of testimony: expert opinions are accepted as evidence, hearsay is rejected, and eyewitness memory is central to trials. They're also curious about Nyāya philosophy from India which has "pramāṇas" or ways of knowing - perception, inference, comparison, and testimony - and how this contrasts with courtroom practices.

  The user has no formal philosophy training but wants a clear, structured analysis. Specifically, they want to understand what the law presupposes about knowledge, how it relates to the Nyāya debate on testimony vs. inference, where the law's position is ambiguous, what would change if courts adopted Nyāya principles, and if memory isn't a distinct way of knowing in Nyāya, how that would affect trials.

  I need to provide exactly five numbered points without introduction or conclusion. Each point should be one or two sentences, directly addressing their questions. For the first point, I'll explain that the law sees testimony as a distinct form of evidence, similar to Nyāya's view, but with strict reliability checks like cross-examination. For the second point, I'll clarify that hearsay is excluded because it's unreliable testimony, not because testimony in general is doubted, which aligns with Nyāya by emphasizing source trustworthiness.

  For the third point, I'll address the underdetermination: the law doesn't resolve whether testimony is fundamental or inferential, but its rules work with either theory as long as reliability is key. For the fourth point, I'll outline changes if Nyāya were adopted: memory might be treated as perception or inference, potentially affecting how recollections are evaluated. For the fifth point, I'll note that Nyāya's omission of memory as a separate pramāṇa could lead to stricter scrutiny of eyewitness accounts, seeing them as derived rather than direct knowledge.

  My response will be concise and jargon-free since the user requested unpacked terms. This should give them practical insights for their writing while staying true to the philosophical and legal nuances.
answer: |-
  1.  The law treats testimony as a *distinct* and *foundational* source of evidence under oath, presupposing that a witness's direct reporting (perception, expertise, memory) offers reliable access to truth, distinct from inference; this aligns with Nyāya's view of testimony (*śabda*) as a separate *pramāṇa*.
  2.  Hearsay is excluded not because testimony itself is doubted, but because the *original source* of that information isn't present for reliability assessment (oath, cross-examination, demeanor observation), reflecting a Nyāya-like focus on the *trustworthiness* of the testifier as the bedrock of valid testimony.
  3.  The law's epistemology is underdetermined regarding *why* testimony works: the rules function whether testimony is seen as fundamental (like Nyāya *śabda*) or merely reliable inference (as Nyāya opponents argued), as long as mechanisms ensure source reliability.
  4.  If courts adopted the strict Nyāya framework (where memory is *not* a separate *pramāṇa* but derivative of past perception), eyewitness testimony would be scrutinized more as potentially flawed *recollection* of prior perception/smṛti, not as direct evidence, potentially demanding new reliability criteria.
  5.  The Nyāya omission of memory as a fundamental *pramāṇa* highlights a core tension: courts functionally treat vivid recall *as* perception-like evidence, while Nyāya would insist memory is secondary and inferential, requiring different justification for its weight in proof.
