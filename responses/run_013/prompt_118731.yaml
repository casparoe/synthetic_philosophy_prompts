answer: |-
  ### Exam Question: Evidence and Confirmation in Field Ornithology

  **Instructions:** Answer all parts of the question below. Your response should be a self-contained essay of approximately 1,200 words. Base your analysis solely on the case described and general principles of confirmation theory. Do not cite or discuss historical literature (e.g., Hempel, Bayes, Goodman). Focus on the philosophical issues raised. Time allocation: 90 minutes.

  **Case Description:**  
  The Midwest Ornithological Atlas Project recruits volunteers for a one-season survey. Volunteers must follow one of two exclusive protocols:  
  - **Protocol A (Black-Bird Count):** Submit a photograph and species identification for every bird judged *black*.  
  - **Protocol B (Non-Black Register):** Submit a photograph and species identification for every bird judged *non-black*.  

  The hypothesis \( H \) under investigation is: "All ravens are black."  

  Three events occur:  
  1. The project coordinator notes that every entry in the Non-Black Register is an instance of a non-black non-raven (e.g., a blue jay). Since \( H \) implies "All non-black things are non-ravens," the coordinator claims each entry confirms \( H \). To strengthen support for \( H \), they propose adding 10,000 new Non-Black Register entries.  
  2. A Protocol B volunteer photographs a rare albino raven (genetically confirmed, pure white). Judging it non-black but unsure of the species, they label it "large white corvid (species unidentified)." This entry is later verified as an albino raven.  
  3. Biologists note that Protocol B is uniquely capable of detecting non-black ravens (if they exist), as such birds would be non-black and thus enter the Register. Conversely, Protocol B *cannot* record black ravens, as they are excluded by design.  

  **Question Parts:**  
  (a) Does the Non-Black Register confirm \( H \)? Critically evaluate the coordinator’s proposal to add 10,000 entries. (8 marks)  
  (b) Analyze the albino raven entry: Does it confirm or disconfirm \( H \)? Does your answer depend on how the evidence is described (e.g., "non-black corvid" vs. "albino raven")? (7 marks)  
  (c) Protocol B is called a "more sensitive test" for non-black ravens but "structurally incapable" of confirming black ravens. Explain how these features affect the *comparative strength* of evidence from Protocol A vs. Protocol B for \( H \). What does this imply about treating confirmation as binary? (6 marks)  
  (d) What general lessons does this case hold for resolving the raven paradox? Discuss the roles of (i) evidence description, (ii) sampling design, and (iii) prior plausibility of alternatives. (4 marks)  

  ---

  ### Model Answer (Strong Student Response, 850 words)  

  **(a) Confirmation Status and the Coordinator’s Proposal**  
  The Non-Black Register generates evidence *compatible* with \( H \) but does not strongly confirm it. Each entry (e.g., a blue jay) is a non-black non-raven. Under an instance-based view (e.g., Hempel’s satisfaction criterion), this satisfies the contrapositive of \( H \) ("If non-black, then non-raven") and thus confirms \( H \). The coordinator’s proposal—adding 10,000 entries—assumes this logic: more instances imply stronger confirmation. However, this overlooks two critical flaws.  

  First, the likelihood principle shows why these entries are weak evidence. Let \( E \) be "a non-black non-raven is observed." Under \( H \), \( P(E|H) \) is high (since \( H \) entails no non-black ravens exist). Yet \( P(E|\neg H) \) is also high if non-black ravens are rare, as most non-black things are non-ravens regardless of \( H \)’s truth. Thus, \( E \) does not significantly distinguish \( H \) from its negation. Adding 10,000 such entries (\( E_{10k} \)) barely changes this: \( P(E_{10k}|H) \approx P(E_{10k}|\neg H) \) if non-black ravens are improbable *a priori*. The coordinator’s proposal thus confuses *compatibility* with *discriminatory power*.  

  Second, the sampling protocol biases evidence. Protocol B *only* collects non-black birds, making non-black non-ravens inevitable even if \( H \) is false. This creates a "confirmation trap": the Register’s design guarantees it produces "confirming" instances irrespective of \( H \)’s truth. The proposal exacerbates this by privileging low-information evidence.  

  **(b) The Albino Raven: Description-Relativity of Evidence**  
  The albino raven entry is pivotal. Described as "a large white corvid (unidentified)," it appears to confirm \( H \) under the instance-based view: it is non-black and (as a corvid) plausibly non-raven, satisfying the contrapositive. Yet described as "an albino raven," it directly falsifies \( H \). This tension reveals that confirmation depends on how evidence is characterized.  

  A likelihood analysis resolves this. Let \( E_1 \) = "a non-black corvid is observed." Under \( H \), \( P(E_1|H) > 0 \) (non-ravens like crows are possible). Under \( \neg H \), \( P(E_1|\neg H) \) is higher if non-black ravens exist. But \( E_1 \) is weak evidence since corvids are diverse. Crucially, \( E_1 \) masks the entry’s true nature. When re-described as \( E_2 \) = "an albino raven is observed," \( P(E_2|H) = 0 \) (it falsifies \( H \)), while \( P(E_2|\neg H) \) is low but non-zero (if albino ravens are rare). Thus, \( E_2 \) strongly *disconfirms* \( H \), while \( E_1 \) negligibly supports it. The misidentification illustrates how coarse-grained descriptions can artificially inflate confirmation.  

  This case differs from "grue"-style problems. Here, the misdescription stems from epistemic limitations (volunteer uncertainty), not semantic trickery. It underscores that evidence must be characterized at a level of specificity that reflects causal-relevant properties (e.g., species identity).  

  **(c) Sensitivity, Structural Limitations, and Comparative Confirmation**  
  Protocol B’s "sensitivity" to non-black ravens highlights why confirmation must be comparative. If non-black ravens exist, Protocol B *must* detect them (as they are non-black), while Protocol A cannot. This makes Protocol B a stronger *test* of \( \neg H \): a non-black raven observation would decisively falsify \( H \). Conversely, Protocol A is a stronger test *for* \( H \): observing a non-black raven is impossible under \( H \), but a black raven observation (while consistent with \( H \)) is weak evidence, as black ravens are common under both \( H \) and \( \neg H \) (assuming some ravens are black).  

  Protocol B’s inability to collect black ravens further weakens its confirmatory power. Since it cannot record positive instances, its "confirming" evidence (non-black non-ravens) is only absence of counterexamples—which is trivial when non-ravens vastly outnumber ravens. Protocol A, while inefficient, at least *can* collect positive instances (black ravens), which slightly raise \( P(H) \) if ravens are rare.  

  This shows confirmation is not binary. Evidence from Protocol B has low weight for \( H \) because:  
  - It arises from a process that filters out potentially disconfirming evidence for \( \neg H \) (black ravens).  
  - Its likelihood ratio \( \frac{P(E|H)}{P(E|\neg H)} \) is near 1.  
  Treating it as "confirming" without comparing alternatives or protocols ignores these nuances.  

  **(d) Lessons for the Raven Paradox**  
  This case reframes the paradox by exposing flaws in instance-based confirmation:  
  **(i) Evidence description matters**: The albino raven shows that syntactic criteria (e.g., contrapositive satisfaction) ignore epistemic context. Confirmation requires evidence individuated by relevant variables (e.g., species).  
  **(ii) Sampling design dominates sheer volume**: The Register’s confirmatory power depends on *how* data is sampled, not quantity. Protocol B’s design precludes strong evidence for \( H \); adding entries only compounds its bias.  
  **(iii) Prior plausibility anchors weight**: The evidential impact of non-black non-ravens depends on the prior probability of non-black ravens. If albino ravens are deemed implausible (e.g., via genetic models), \( E \) from Protocol B is uninformative; if plausible, it gains slight confirmatory power.  

  The paradox arises from treating confirmation as instance-counting divorced from experimental design. A better approach evaluates how evidence affects probability ratios relative to plausible alternatives, given the constraints of observation. Here, Protocol B’s evidence is inert because it fails to reduce uncertainty about \( H \)’s risk of falsity.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Key:** A-grade answers (21–25) must engage likelihood comparisons, description-relativity, and sampling; B-grade (16–20) address instance-based views but miss key nuances.  

  **(a) Coordinator’s Proposal (8 marks)**  
  - **Must-hit points:**  
    - (3 marks) Distinguishes instance-based (confirms via contrapositive) vs. likelihood-based (weak evidence due to high \( P(E|\neg H) \)).  
    - (2 marks) Identifies sampling bias: Protocol B guarantees low-value evidence.  
    - (2 marks) Critiques proposal: Adding entries ignores diminishing returns if \( P(E|H) \approx P(E|\neg H) \).  
    - (1 mark) Notes that the proposal confuses quantity with quality.  
  - **Common errors:**  
    - Memorizing students: Assert Bayesianism "solves" paradox without calculating likelihoods (0 marks).  
    - Claiming sheer size of Register proves strength (loses 2 marks).  

  **(b) Albino Raven (7 marks)**  
  - **Must-hit points:**  
    - (3 marks) Explains description-relativity: "Non-black corvid" weakly confirms; "albino raven" falsifies.  
    - (3 marks) Uses likelihoods: \( P(\text{non-black corvid}|H) \) vs. \( P(\text{albino raven}|H) = 0 \).  
    - (1 mark) Contrasts with Goodman-style cases (epistemic vs. semantic issues).  
  - **Common errors:**  
    - Memorizing students: Call it "merely a counterexample" without analyzing misdescription (loses 3 marks).  
    - Treating it as identical to green apples (loses 2 marks).  

  **(c) Protocol Sensitivity (6 marks)**  
  - **Must-hit points:**  
    - (2 marks) Explains sensitivity: Protocol B detects non-black ravens if they exist.  
    - (2 marks) Structural limitation: Protocol B cannot collect black ravens.  
    - (2 marks) Compares evidence strength: Protocol A’s black ravens > Protocol B’s non-black non-ravens when priors favor \( H \).  
  - **Common errors:**  
    - Equating Protocols A and B via equivalence condition (loses 2 marks).  
    - Ignoring test severity (loses 2 marks).  

  **(d) General Lessons (4 marks)**  
  - **Must-hit points:**  
    - (1 mark) Evidence description: Coarse descriptions inflate confirmation.  
    - (1 mark) Sampling design: Protocol structure > instance count.  
    - (1 mark) Prior plausibility: Weight depends on probability of alternatives.  
    - (1 mark) Conclusion: Paradox stems from non-comparative, instance-driven models.  
  - **Common errors:**  
    - Generic claims like "Bayes dissolves it" without specifics (0 marks).  

  **A vs. B Differentiation:**  
  - **A answer**: Integrates (a)–(d) to show likelihood/sampling reframes paradox; uses albino case to demonstrate description-dependence.  
  - **B answer**: Correctly applies instance/likelihood views but misses links to protocol design or equivocates on albino description.  
  **Memorizer penalty**: Students reciting "green apples don’t confirm" or "equivalence condition" without engaging protocols/albino case lose 10+ marks for irrelevance.  

  ---  
  This solution centers the unique case, penalizes rote knowledge, and requires analyzing likelihoods, descriptions, and sampling. The model answer and scheme ensure only students who grasp confirmation dynamics can excel.
