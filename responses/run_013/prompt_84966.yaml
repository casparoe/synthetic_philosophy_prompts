answer: |-
  ### Translation and Residue Report

  **Prose Translation:**  
  Taurek's position translates to a **chance constraint** requiring all individuals to have equal *ex ante* survival probability, implemented via a **lottery over deterministic policies**. Each deterministic policy saves one group entirely. The coin flip becomes a uniform random policy selection: for two groups, each policy (save A or save B) has probability 0.5, equalizing individual survival probabilities. This rejects aggregating lives into a reward function, instead imposing per-individual constraints. 

  **Residue Analysis:**  
  1. **Equal Claim Representation**:  
     - Cleanly maps to a **chance constraint** enforcing identical survival probabilities.  
     - Also maps to a **lottery over deterministic policies** (e.g., 50% chance to save Group A or B).  
     - *Not* a max-min objective: Taurek mandates equality, not merely protecting the worst-off. Leximin would permit unequal probabilities if they benefit the least advantaged, violating Taurek's strict equality.  

  2. **Saving vs. Not Saving / Doing vs. Allowing**:  
     - **Distortion**: Deterministic policies starkly distinguish saving/not-saving, but the lottery blurs this by making outcomes stochastic. "Allowing death" via inaction is replaced by **active randomization**, converting "doing" into designing the lottery. Taurek’s moral distinction weakens under policy optimization.  

  3. **Separateness of Persons / Non-Aggregability**:  
     - **Partial Distortion**: Survival-probability vectors treat individuals as separate *coordinates*, preserving non-aggregation by avoiding summed rewards. However, constraints are evaluated *jointly*, subtly aggregating claims into a system-wide feasibility condition (e.g., "all probabilities equal" is a global constraint).  

  4. **Coin-Flip Uniqueness**:  
     - **Distortion**: The vocabulary generates **multiple equal-chance lotteries** in asymmetric cases. For example, with groups of size 1 and 5, a coin flip (50% save each group) gives all 6 individuals 50% survival. Alternatively, a lottery saving the individual from the smaller group with 1/6 probability and from the larger with 5/6 also equalizes probabilities but violates Taurek’s "equal respect for groups." Taurek’s position lacks a principle to select between these, revealing unstated group-based symmetry assumptions.  

  5. **Residue Diagnosis**:  
     - Untranslatable elements stem from **ethical under-specification in Taurek**, not vocabulary limitations. Key gaps:  
       - No basis for choosing between individual- or group-level equality when group sizes differ.  
       - Ambiguity in moral responsibility for stochastic outcomes.  
     - The vocabulary *can* represent Taurek’s prescription but exposes unresolved tensions in the original position.  

  **Verdict on Your Intuition**:  
  *Wrong.* While fairness constraints operationalize ex ante equality, Taurek’s core is a **deontological rejection of aggregation**, not merely equitable optimization. Your vocabulary captures the *mechanism* (constraints/lotteries) but misses the **ethical injunction against trading lives for totals**. The residue confirms Taurek’s position implicitly relies on unformalized group symmetries.

