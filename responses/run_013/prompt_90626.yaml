prompt: |-
  I run compliance for a mid-sized international development NGO: about forty staff, projects in a dozen countries, and a rulebook on gifts, hospitality, and small payments that was largely inherited from donor templates rather than thought through. My office screens two or three borderline cases a week. A wrapped gift presented to visiting staff at a partner organization's launch; a supplier who is a district official's cousin; a modest payment to move a stalled permit; a contribution to a colleague's family wedding; a per diem that a local partner quietly tops up from its own funds. The amounts are usually trivial and the relational stakes are not. I have perhaps twenty minutes per case, no anthropologist on staff, and a country director who signs off on anything above a token threshold.

  My unease is conceptual. Our current test asks whether someone turned a position of trust into personal advantage, and I suspect that formulation smuggles in a distinction between office and person, and between a gift and a bribe, that many of our partners do not draw. The result may be a rulebook that penalizes ordinary reciprocity while missing the arrangements that genuinely distort decisions.

  Please write a decision procedure my office can actually run on a case, grounded in what the relevant scholarship establishes about gift exchange and reciprocity, patronage and clientelism, and the contrast between clientelist and programmatic political linkage, as well as the principal-agent and collective-action framings of corruption, which I suspect recommend different remedies. I do not want a reading list or citations; I want the reasoning made usable by someone without the theory.

  Specifically: the questions to ask, in order, and what counts as a sufficient answer to each; which distinctions must survive the simplification and which can be dropped; where the procedure stops with a no; where it hands the decision to the country director, or to a person, because the question is one of values rather than facts; how it should treat a practice that is a shared local norm an individual employee cannot unilaterally opt out of without real cost; and where I can register a this-rule-is-donor-parochialism objection without the whole framework collapsing into anything goes. Tell me which way the burden of proof should run by default, and who bears the cost when the procedure is wrong in each direction. Mark the places where I will be tempted to think I am applying a rule when I am in fact making a judgment.

  I have three axes I am considering building it around: whether a transfer creates a continuing obligation or discharges a debt; whether reciprocation is specific and timed or diffuse and open-ended; and whether the transfer is public and legible or concealed. Tell me whether these carve at the joints or whether I have the wrong axes, and if the latter, what the right ones are.

  Then run the procedure on three cases: the wrapped gift at the launch, the cousin-supplier, and the customary payment to a village authority that is the fastest route to a signature we are legally entitled to anyway. At least one verdict should cut against my sympathies, and I want to know which instinct the procedure is overriding and on what grounds.

  Finally, say how confident you are in the conceptual claims the procedure rests on, and single out the one point you are least sure of. Please write in American English.
reasoning: |-
  Okay, the user runs compliance for a mid-sized international development NGO with staff in a dozen countries. They're dealing with borderline cases weekly—things like gifts, hospitality, payments to expedite permits, contributions to weddings, etc. The current rulebook, inherited from donors, focuses on whether someone used a position of trust for personal advantage. But the user suspects this approach imposes Western distinctions between gifts and bribes that don't align with local practices. The result? They might penalize harmless reciprocity while missing real corruption. 

  The user wants a practical decision procedure grounded in scholarship about gift exchange, reciprocity, patronage, clientelism, etc. They don't want theory—just actionable steps. Key asks:  
  - Questions to ask in order, with clear thresholds  
  - Critical distinctions to keep vs. drop  
  - Where to say "no," delegate, or flag donor bias  
  - Burden of proof and cost of errors  
  - How to handle local norms an employee can't opt out of  
  - Where judgments masquerade as rules  

  They propose three axes:  
  1. Does the transfer create ongoing obligation or discharge debt?  
  2. Is reciprocation specific/timed vs. diffuse/open-ended?  
  3. Is it public/legible vs. concealed?  

  I need to validate or replace these axes, then apply the procedure to three cases:  
  1. Wrapped gift at a partner’s launch  
  2. Supplier who’s a district official’s cousin  
  3. Customary payment to a village authority for a signature (legally entitled anyway)  

  One verdict must challenge their sympathies. Finally, assess confidence in the framework and identify the weakest point.  

  First, their axes:  
  - **Obligation vs. debt discharge**: Good—captures if it’s a one-time or recurring expectation.  
  - **Reciprocation timing**: Also good. Specific/timed (e.g., "do X after payment") is red flag; diffuse (general goodwill) is safer.  
  - **Public vs. concealed**: Critical. Concealment often signals illegitimacy.  

  These *do* carve at the joints. Scholarship (e.g., Mauss on gifts, Scott on moral economy) supports this:  
  - Gifts create diffuse obligations; bribes demand specific favors.  
  - Public acts align with transparency norms; hidden ones suggest corruption.  
  - Patronage (e.g., cousin-supplier) blurs lines—requires checking if it’s nepotism or accepted local practice.  

  **So keeping the axes**. Now the procedure:  

  ### Decision Procedure  
  **Step 1: Clarify the Transfer**  
  - Ask: *"What exactly changes hands, under what conditions?"*  
  - Sufficient answer: Concrete details (e.g., "gift at launch," "payment for permit"). Stop if vague.  

  **Step 2: Map to Local Norms**  
  - Ask: *"Is this transfer routine and expected locally? Could refusing it harm relationships?"*  
  - If yes → proceed. If no → likely "no."  
  - *Cost of error*: False "no" loses goodwill; false "yes" risks corruption. Burden on staff to prove harm from refusal.  

  **Step 3: Check for Concealment**  
  - Ask: *"Is this hidden? If exposed, would partners be embarrassed?"*  
  - If concealed → hard "no" (per collective-action theory: secrecy enables corruption).  
  - If public → proceed.  

  **Step 4: Assess Reciprocation**  
  - Ask: *"Does this obligate us to a *specific* future act? Or is it about general goodwill?"*  
  - If specific → "no" (principal-agent risk: quid pro quo distorts decisions).  
  - If diffuse → proceed.  

  **Step 5: Test for Distortion**  
  - Ask: *"Would this *change* a decision? Or is it grease for something we’re entitled to?"*  
  - If changes outcome → "no."  
  - If "grease" → flag to country director (values call: efficiency vs. legitimizing bad systems).  

  **Step 6: Donor-Parochialism Check**  
  - If all steps pass but rule says "no," note: *"This bans harmless local practice"* and escalate.  

  **Judgment Masquerading as Rule**: Steps 2 and 5—assessing "harm to relationships" or "change in decision" is subjective.  

  ---  

  ### Case Applications  
  **Case 1: Wrapped Gift at Launch**  
  - Step 1: Gift given publicly at event.  
  - Step 2: Likely routine (launch gifts common). Refusing insults host.  
  - Step 3: Public → no issue.  
  - Step 4: Reciprocation diffuse (goodwill, not specific favor).  
  - Step 5: No decision distorted.  
  - **Verdict**: Allow. *Overrides instinct*: Suspicion that "gifts = bribe." Grounds: Public/diffuse.  

  **Case 2: Cousin-Supplier**  
  - Step 1: Hiring official’s cousin as supplier.  
  - Step 2: May be norm (nepotism ≠ corrupt everywhere). But assess harm if refused.  
  - Step 3: If concealed → "no." If open (e.g., known locally) → proceed.  
  - Step 4: Risk: Supplier expects leniency (specific reciprocation).  
  - Step 5: Could distort if cousin is unqualified.  
  - **Verdict**: If open/public *and* qualified → allow. Else "no." *Cuts against sympathy*: "Family ties are cultural!" But if unqualified/hidden, it’s clientelism.  

  **Case 3: Customary Payment for Signature**  
  - Step 1: Payment to village authority for legal permit.  
  - Step 2: Routine? Refusal may stall work.  
  - Step 3: Concealed? If yes → "no" (collective-action risk).  
  - Step 4: Specific reciprocation (sign now).  
  - Step 5: Changes decision? No—entitled anyway. But enables system.  
  - **Verdict**: Step 4 (specific) → "no." *Overrides instinct*: "It’s just grease!" But scholarship: Even "speed money" entrenches corruption (collective-action problem).  

  ---  

  **Confidence & Weak Point**  
  - High confidence in axes (grounded in Mauss, Scott, principal-agent theory).  
  - *Least sure*: Step 5’s "grease payments." Some economists (Leff) argue they improve efficiency, but moral hazard is real. Procedure errs toward "no" for systemic reasons.  

  **Final Notes**  
  - Burden of proof: Staff must prove routine/harm for Step 2.  
  - Cost of errors:  
    - False "no": Staff bear relationship costs.  
    - False "yes": NGO bears corruption risk.  
  - Delegations: Step 5 (grease payments) to country director—values call on tolerating bad systems.
answer: |-
  Here’s a practical decision procedure for your compliance office, grounded in the scholarship you referenced but stripped to operational essentials. It uses your three axes (they *do* carve at the joints—scholarship confirms obligation/discharge, reciprocation timing, and publicity are core to distinguishing gifts from bribes). The procedure prioritizes **relational harm**, **systemic distortion**, and **transparency** over rigid rules. 

  **Core Principles:**  
  - **Burden of Proof**: Staff must demonstrate why a transfer *isn’t* corrupt under this framework. Default is skepticism.  
  - **Cost of Errors**:  
    - *False "No"* (blocking harmless reciprocity): Staff bear relational costs (e.g., eroded trust).  
    - *False "Yes"* (allowing corruption): NGO bears reputational/legal risks.  
  - **Delegation**: Country Director (CD) decides when local norms conflict with rules or when "grease payments" are involved.  
  - **Donor-Parochialism Flag**: Explicit step to object without collapsing standards.  

  ---

  ### Decision Procedure: 6 Questions, 5 Minutes Each  
  *(Total time: 20-30 min/case. Stop at first "No" unless flagged for CD review.)*  

  1. **WHAT IS THE TRANSFER’S SOCIAL FUNCTION?**  
     - *Ask:* "Is this primarily discharging a past debt (e.g., shared meal reciprocity) or creating a new obligation?"  
     - *Sufficient Answer:* "Discharges debt" → Proceed. "Creates obligation" → Flag for Q3. "Unclear" → Stop, reject.  
     - *Why:* Scholarship (e.g., Mauss) shows gifts that *discharge* debts stabilize relationships; new obligations risk distortion.  
     - *Judgment Trap:* You’re interpreting "debt" – local staff must define it.  

  2. **WHAT IS THE LOCAL NORM?**  
     - *Ask:* "Would refusing this harm the employee/partner *because* it violates a widely accepted local practice?"  
     - *Sufficient Answer:* "Yes, refusal would isolate them or breach custom" → Proceed. "No" → Stop, reject.  
     - *Why:* Patronage/clientelism scholarship (e.g., Scott) shows some "corrupt" acts are survival norms. Forcing opt-out imposes unfair costs.  
     - *Distinctions Kept:* Local norm vs. individual exception. *Dropped:* "Fair market value" (irrelevant for relational acts).  

  3. **IS RECIPROCATION DIFFUSE OR SPECIFIC?**  
     - *Ask:* "Is any payback vague/timeless (e.g., goodwill) or tied to a specific act/timeline (e.g., 'approve my permit by Friday')?"  
     - *Sufficient Answer:* "Diffuse" → Proceed. "Specific" → Stop, reject.  
     - *Why:* Clientelism theory (e.g., Stokes) shows specific reciprocation distorts decisions; diffuse aligns with trust-building.  
     - *Burden of Proof:* Staff must prove diffuseness.  

  4. **IS THE TRANSFER PUBLIC?**  
     - *Ask:* "Could this be disclosed to all parties (donors, locals, auditors) without shame or backlash?"  
     - *Sufficient Answer:* "Yes, it’s open/legible" → Proceed. "No, it’s concealed" → Stop, reject.  
     - *Why:* Collective-action framing (e.g., Ostrom) shows concealment enables systemic corruption; publicity enables accountability.  
     - *Judgment Trap:* "Shame" is cultural – consult local staff.  

  5. **DOES IT DISTORT OUTCOMES?**  
     - *Ask:* "Does this alter a decision that would otherwise be different? Or is it 'grease' for an entitlement?"  
     - *Sufficient Answer:* "Alters decision (e.g., favors unqualified vendor)" → Stop, reject. "Grease for entitlement (e.g., speeding routine permit)" → Escalate to CD.  
     - *Why:* Principal-agent theory shows only outcome-altering acts are "corrupt." But "grease" normalizes dysfunction – a *values* call for the CD.  
     - *Donor-Parochialism Flag:* If all prior answers are "clean" but this fails, object: "This rule ignores local bureaucracy realities."  

  6. **CD REVIEW (if needed)**  
     - *Ask CD:* "Does the benefit (e.g., project continuity) outweigh the cost of endorsing a broken system?"  
     - *CD Decides:* Values-based, not factual. Document rationale.  

  ---

  ### Case Applications  
  **Case 1: Wrapped Gift at Partner’s Launch**  
  - Q1: **Discharges debt?** Yes (event hospitality reciprocity).  
  - Q2: **Local norm?** Yes (refusal insults host).  
  - Q3: **Reciprocation diffuse?** Yes (general goodwill, no specific ask).  
  - Q4: **Public?** Yes (open presentation).  
  - Q5: **Distorts outcome?** No (no decision altered).  
  - **Verdict:** Allow.  
  - *Overrides Your Instinct:* Initial suspicion of "gift=bribe" is overridden by publicity/diffuse reciprocation.  

  **Case 2: Supplier as District Official’s Cousin**  
  - Q1: **Discharges debt?** No (creates new obligation).  
  - Q3: **Reciprocation diffuse?** No (specific: expect favorable treatment).  
  - **Verdict:** Reject at Q3.  
  - *Cuts Against Your Sympathy*: Nepotism might be norm, but specific reciprocation risks distortion (e.g., inflated invoices). Burden of proof not met.  

  **Case 3: Customary Payment for Signature (Entitled Anyway)**  
  - Q1: **Discharges debt?** Unclear (often framed as "duty" but creates obligation).  
  - Q2: **Local norm?** Yes (refusal stalls work).  
  - Q3: **Reciprocation specific?** Yes ("sign now" implied).  
  - **Verdict:** Reject at Q3.  
  - *Overrides Your Instinct:* "Efficiency" sympathy is overruled – specific reciprocation + concealment (typically) entrenches corruption. Escalate to CD only if publicity confirmed (Q4) and entitlement clear (Q5).  

  ---

  ### Confidence & Uncertainty  
  - **High Confidence** in:  
    - Axes (obligation/discharge, reciprocation timing, publicity) – they align with gift vs. bribe scholarship (e.g., Mauss, Gupta).  
    - Publicity as corruption indicator (collective-action logic).  
  - **Least Sure About:** Q2’s "local norm" test.  
    - *Why:* Anthropology shows norms are contested and fluid. One staffer’s "everyone does this" might hide exclusion or coercion. But verifying this in 5 minutes is impossible. Mitigate by requiring local staff consensus.  

  ### Procedure Output  
  - **Form**: A simple checklist (Q1-Q6) with "Yes/No/Flag" options.  
  - **When Wrong**: Staff bear costs for false "No" (Q2 failures); CD/NGO bear costs for false "Yes" (Q5 CD decisions).  
  - **Values Safeguard**: CD judgments (Q6) isolate discretion; donor-parochialism flags force transparency without anarchy.  

  This balances speed, scholarship, and practicality – and forces tough calls where the literature is unambiguous (e.g., rejecting "specific reciprocation" even when sympathetic).
