answer: |-
  ### The Practice, Restated
  Insurance pricing relies on reference class grouping, not individualized probability. Insurers assign applicants to classes defined by observable characteristics (e.g., age, location, claims history). Everyone within a class pays an identical base premium, calculated from the class's historical loss frequency and severity. Individual adjustments (e.g., safe-driver discounts) are layered atop this base but remain minor modifiers. This structure is codified in laws like the Affordable Care Act (ACA), which mandates broad classes (age, tobacco use) while prohibiting narrower, predictive factors (health status, gender). The practice explicitly prioritizes group-based pooling over individual risk assessment, treating the class’s loss experience as the actuarial foundation for pricing. Individualized "chances" are neither calculated nor priced directly.

  ### The Implicit Theory of Probability
  The practice presupposes a **frequency interpretation of probability** and implicitly rejects single-case propensity views. The premium is derived solely from observed frequencies within the reference class. There is no metaphysical commitment to an "inherent chance" of *you* crashing; the probability *just is* the class frequency. This frequency is treated as an objective, measurable property of the *group*, not as an estimate of a hidden individual propensity. While a propensity theorist *could* interpret the class rate as a useful estimate of an individual’s latent propensity, the *practice itself* operates without needing this layer. Pricing relies entirely on the empirical regularity of the class, not speculation about unobservable individual dispositions. 

  The practice also presupposes **epistemic practicality**: no uniquely "correct" reference class exists. Classes are chosen based on data availability, predictive power, legality, administrative cost, and social policy—not because they metaphysically "match" an individual’s essence. Insurers use the narrowest *practicable* class that is legally permissible and statistically stable. The ACA’s restrictions demonstrate that class selection is fundamentally a normative and pragmatic choice, not a truth-seeking exercise. If a "truer" class exists (e.g., one using genetic data), it may be rejected for ethical reasons. Thus, the practice aligns with frequentism’s rejection of unique individual probabilities and embraces conventionalism in class selection.

  ### Strict Presupposition Versus Comfortable Fit
  **Strict presupposition:** The practice *cannot function* without presupposing that (1) probabilities are *inherently group-level properties* derived from observed frequencies, and (2) individual risk is *not* a fundamental ontological category for pricing. It rules out views insisting that probabilities *must* refer to irreducible single-case chances (e.g., strong propensity theories). The pooling mechanism collapses if premiums must reflect individualized "true chances."

  **Comfortable fit:** The practice is *compatible* with (1) propensity theories treating class frequencies as reliable *estimates* of individual propensities, and (2) subjective Bayesian views where the class rate provides an objective prior for individual risk. However, these add metaphysical or epistemic layers unnecessary for the practice itself. 

  **Philosophical underdetermination:** All theories accepting that group frequencies *suffice* for pricing—even as estimates—yield identical rates. The practice is neutral between epistemic (frequency as best evidence) and ontological (frequency as the reality) interpretations of the class probability. What is excluded is any theory demanding that pricing track an *individual* chance beyond the class data.

  ### The Two Rating Logics
  **Actuarial fairness** (insurer’s logic) presupposes that premiums *should* reflect expected cost based on the best predictive class. It assumes that fairness lies in accurate risk-based pricing: lower-risk groups subsidizing higher-risk groups violates efficiency and fairness. Here, the reference class is chosen for maximal predictive accuracy.

  **Community rating** (ACA logic) presupposes that fairness and social solidarity *require* deliberately *ignoring* some predictive differences. It treats certain characteristics (e.g., health status) as morally illegitimate bases for differential pricing, even if they improve accuracy. Fairness here means limiting actuarial segmentation to enforce cross-subsidy. 

  **Consistency?** Both logics accept frequency-based *group pricing* as foundational. Their conflict arises at the normative level: *which group distinctions are permissible?* Actuarial fairness prioritizes accuracy; community rating prioritizes distributive justice. The insurer’s practice *can* operate under either logic—premiums are still group-based frequencies—but the *choice of class* reflects divergent values. The tension emerges not in the theory of probability, but in the ethics of classification: community rating deliberately sacrifices accuracy for solidarity, challenging the insurer’s default efficiency norm. Both, however, reject pricing individual propensities.

  ### If the Presupposition Were Replaced
  Adopting a view where "individual chance" is metaphysically real and priced would dismantle insurance as pooling. 

  1.  **Underwriting** would become an impossible quest to quantify an unobservable individual propensity. Actuarial science (relying on group data) would be replaced by speculative models of singular causation. Without group frequencies, pricing loses its objective anchor.
  2.  **Pooling** would collapse. If each person pays their "true" individual risk price, there is no risk-sharing—only individual pre-payment of expected losses. High-risk individuals would face unaffordable premiums or exclusion, defeating insurance’s social purpose.
  3.  **Institutional change:** Insurance would devolve into either:
      *   **Mandatory individual savings schemes** (e.g., health savings accounts), where you pay your "own" expected costs, eliminating cross-subsidy.
      *   **State-guaranteed coverage** for uninsurable "propensities," funded by taxation, acknowledging the market’s failure under this view.
      *   **Radical risk segmentation**, where only near-identical "propensity twins" pool together, making large-scale insurance impractical.

  Insurance relies on the *fiction* that group risk supersedes individual destiny. Taking individual chances seriously dissolves the pooling fiction and eliminates the rationale for traditional insurance.
