prompt: |-
  so i've been reading david lewis's paper where he asks wether we really believe in penal substitution (the one where he distinguishes punishment from penalty, brings in the debt analogy, and drags in his punishment-that-leaves-something-to-chance stuff). before i go further i want the desiderata for a theory of penal substitution. what does any adequate theory of christ bearing the penalty for our sins actually have to deliver? not just 'explain the atonement' — the specific cases and constraints. off the top of my head: punishment is conceptually tied to guilt, so if christ was innocent what happened to him can't literally be punishment; a penalty (unlike punishment) can be transferred or paid by another, like a debt; god's justice has to be satisfied rather than just waived; the substitute has to be voluntary; the trinity means god is somehow both the punisher and the punished; the deterrent or retributive function of the penalty has to survive the substitution; and the whole thing can't collapse into 'god punished an innocent man, which is unjust' or into 'god just forgave, which makes the cross pointless'. then lewis's chance model: if the point of punishment is deterrence and deterrence works through a lottery of who gets punished, the penalty is a risk imposed, and a risk can be borne vicariously — does that requirement help or just move the problem? for each desideratum give the case or consideration behind it, say which ones are non-negotiable and which are just preferences of one camp (penal vs debt vs deterrence models), and flag any pair that looks jointly unsatisfiable. thats the part i most want — if the list itself shows the theory can't be had, fine. then a short paragraph on how lewis's own modified version does against the list, and maybe one rival (the pure debt model, or the 'god just forgives' model) for contrast. no citations or reading list, just the spec. and please don't definately just give me the standard reformed talking points, i want the constraints that actually bite.
reasoning: |-
  Okay, the user is diving deep into David Lewis's paper on penal substitution, specifically focusing on the distinctions between punishment and penalty, the debt analogy, and the chance-based deterrence model. They want a clear list of desiderata for any adequate theory of penal substitution, not just a rehash of standard Reformed theology. 

  First, I need to unpack their request. They’re clearly well-versed in the philosophical and theological nuances—mentioning Lewis’s "punishment that leaves something to chance" suggests they’re familiar with his broader work. Their frustration with "standard reformed talking points" means I should avoid doctrinal clichés and focus on logical constraints. 

  The user’s list of off-the-top-of-head desiderata is sharp: guilt-punishment linkage, transferability of penalty, God’s justice satisfaction, voluntariness, Trinitarian tension, functional survival of deterrence/retribution, and avoiding two fatal collapses (punishing innocence or rendering the cross pointless). They’re especially keen on spotting jointly unsatisfiable desiderata—where the theory might implode. 

  Breaking it down:  
  - **Guilt-Punishment Link**: Non-negotiable. Punishing the innocent is universally unjust, so any theory must resolve this. Lewis’s penalty-as-risk move helps, but does it fully escape the problem?  
  - **Transferability**: Penalty ≠ punishment. Debt models handle this cleanly, but then struggle with "justice satisfaction" if it’s just a ledger adjustment.  
  - **Divine Justice Satisfaction**: Non-negotiable for penal substitution advocates. God can’t just waive consequences—something must *happen*.  
  - **Voluntariness**: Mostly non-negotiable (otherwise it’s scapegoating). Easy for models where Christ is divine.  
  - **Trinitarian Tension**: Tricky. If God punishes God, is it self-harm? Some models sidestep by distinguishing persons; others call it metaphor.  
  - **Functional Survival**: If substitution voids deterrence/retribution, why impose penalties at all? Lewis’s chance model directly tackles this.  
  - **Avoiding Collapses**: The core tension. Sacrificing innocence vs. empty forgiveness.  

  Key conflicts:  
  1. **Guilt Requirement vs. Innocent Substitute**: If punishment requires guilt, Christ *can’t* be punished. Debt models avoid this but feel less "just" to some.  
  2. **Justice Satisfaction vs. Transfer Legitimacy**: If justice is retributive ("guilty *must* suffer"), transfer seems unjust. If it’s deterrent, transfer might work (Lewis’s gamble).  
  3. **Trinity vs. Coherence**: God as both punisher/punished risks contradiction. Some bite the bullet; others soften "punishment" to "penalty."  

  Lewis’s model shines on functional survival (deterrence via risk) and dodges "punishing innocence" (it’s risk-bearing, not punishment). But does it satisfy *retributive* justice? If God’s justice is about desert, not just deterrence, Lewis might fall short.  

  Contrast with pure debt model: Clean transfer, no guilt issue. But if "debt payment" lacks the weight of moral violation (vs. monetary debt), does it *feel* like justice? And with "God just forgives": Sidesteps all problems but voids the cross’s necessity, offending orthodox theology.  

  User’s real ask: "Can this theory hold without breaking?" The desiderata list *does* strain coherence—especially guilt/innocence and Trinity. Lewis’s model is clever but niche; it saves deterrence but may not satisfy retributive intuitions. The debt model is safer logically but theologically thinner. Ultimately, the user might be spotting why some theologians abandon penal substitution entirely.
answer: |-
  Here’s a distilled desiderata list for a theory of penal substitution (PS), grounded in logical, theological, and moral constraints, with key tensions highlighted:

  ### **Core Desiderata & Their Rationale**  
  1. **Non-Transferability of Punishment (Guilt Requirement)**  
     - *Case/Constraint*: Punishment presupposes guilt; imposing suffering *as punishment* on an innocent is intrinsically unjust (e.g., human legal intuitions).  
     - *Non-negotiable* for any model claiming strict justice.  
     - *Conflict*: Directly challenges PS unless "penalty" ≠ "punishment."  

  2. **Transferability of Penalty/Debt**  
     - *Case/Constraint*: Penalties (fines, debts) can be paid vicariously without injustice (e.g., paying a friend’s debt).  
     - *Non-negotiable*: PS requires *some* mechanism for substitution.  
     - *Tension*: If penalty is *punitive*, not merely transactional, it collapses into (1).  

  3. **Satisfaction of Divine Justice**  
     - *Case*: God’s holiness demands sin’s consequence cannot be ignored (e.g., Anselm’s *Cur Deus Homo*). Mercy cannot trump justice without compromising divine character.  
     - *Non-negotiable* for classical PS advocates.  
     - *Conflict*: Risks "punishing innocence" if not resolved with (1)–(2).  

  4. **Voluntary Substitution**  
     - *Case*: Coercion would make God unjust and Christ a victim (vs. John 10:18).  
     - *Non-negotiable* across models.  

  5. **Trinitarian Coherence**  
     - *Case*: God cannot be divided against Himself (Father judges, Son suffers; Heb 9:14).  
     - *Constraint*: Must avoid portraying God as self-abusive or internally conflicted.  
     - *Tension*: Risks depicting divine injustice or masochism.  

  6. **Functional Efficacy of Penalty**  
     - *Case*: Penalties serve purposes (deterrence, retribution, restoration). Substitution must not void these (e.g., if Christ bears penalty, why are sinners not free to sin?).  
     - *Non-negotiable* for PS to be meaningful.  
     - *Conflict*: If Christ fully absorbs the penalty, what deters future sin?  

  7. **Avoidance of Fatal Collapses**  
     - *Collapse A* ("Punishing Innocence"): Substitution must not imply God commits injustice.  
     - *Collapse B* ("Pointless Cross"): If God can forgive freely, the crucifixion is theatrical.  
     - *Non-negotiable*: Failure here falsifies PS.  

  ### **Key Tensions (Jointly Unsatisfiable?)**
  - **The Central Paradox**: (1) + (3) + (7A) conflict:  
    - If divine justice *requires* punishment (3), and punishment *requires* guilt (1), but Christ is innocent, then substitution either violates justice (7A) or (3) is false.  
    - *Resolution attempts*: Reject (1) by distinguishing penalty/punishment (Lewis) or redefine justice (e.g., as debt-based).  
  - **Functional Efficacy vs. Complete Substitution** (6):  
    - If Christ fully bore *all* consequences, why do believers suffer? Partial substitution?  

  ### **Lewis’s Model Assessment**  
  Lewis sidesteps (1) by treating penalty as **risk-bearing under deterrence**:  
  - Divine justice imposes a *risk* of punishment (like a lottery) for deterrence.  
  - Christ voluntarily bears the *entire risk* (the "chance" of punishment) vicariously.  
  - *Satisfies*: (2) (risk is transferable), (4), (6) (deterrence preserved via risk-imposition), (7A) (no one is *actually* punished unjustly).  
  - *Fails*: (3) for retributivists (justice isn’t risk-based), (5) (still has God imposing suffering on Son), and (7B) (if risk-bearing is symbolic, why necessary?).  

  ### **Contrast: Pure Debt Model**  
  - Sin = debt; Christ pays it.  
  - *Satisfies*: (2), (4), (7A) (no punishment, just payment), (5) (no conflict).  
  - *Fails*: (3) for retributivists (justice isn’t transactional), (6) (no inherent deterrence; debt payment doesn’t reform the debtor), (7B) (why can’t God cancel debts freely?).  

  ### **"God Just Forgives" Model**  
  - Forgiveness is unilateral; cross as moral example/love.  
  - *Satisfies*: (1), (4), (5), (7A).  
  - *Fails*: (3), (6), (7B) (no justice mechanism; cross functionally unnecessary).  

  ### **Conclusion**  
  The desiderata **cannot all be satisfied simultaneously** without trade-offs:  
  - Lewis’s model resolves (1) and (7A) but sacrifices retributive justice (3).  
  - Debt models avoid injustice but fail divine justice (3) and efficacy (6).  
  - **Core tension**: Retributive justice + substitution + innocence = logical inconsistency. PS either redefines justice (Lewis), denies retribution (debt), or embraces paradox (orthodox "mystery"). Lewis offers a coherent but niche solution—viable only if divine justice is purely consequentialist.
