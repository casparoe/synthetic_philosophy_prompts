  Here’s a speech that tackles the philosophy head-on, respects both audiences, and defends the clause without flinching—while keeping the tone warm and appropriate for an anniversary dinner. I’ve structured it to build common ground, address the core tension honestly, and end with unity.

  ---

  **(Start with warmth and context)**
  Good evening, everyone. It’s a joy to celebrate twenty-five years of protecting this land we love—not just as a line on a map, but as a living promise. Tonight, I want to talk about one small part of that promise: a sentence in our charter that’s sparked some… *spirited* board discussions. It’s the clause forbidding “pure time preference.” Now, before half of you reach for the dessert menu and the other half starts mentally drafting rebuttals—bear with me. This isn’t about economics textbooks; it’s about what we owe the future, and why we drew this line.

  **(Explain discounting simply, using a shared metaphor)**
  Imagine we plant an oak sapling today. It’s small, fragile. We know it won’t be a mighty tree giving shade, acorns, and a home for owls for a hundred years. Now, when we decide *how much* effort, water, or fence to put around that sapling, how do we weigh its tiny present benefit against its huge future one? That’s “discounting.” It’s how we compare values across time.

  **(Acknowledge the "ordinary reasons" – validating economists & pragmatists)**
  Of course, we discount future benefits for sensible, practical reasons—*exactly* as our charter allows. We **discount for uncertainty**. Will pests, drought, or that rogue backhoe destroy our sapling before it matures? We **discount for opportunity cost**. If we spend money on fencing *this* sapling, could we have planted *ten* elsewhere with a faster payoff? And yes, we **discount because money grows**. A dollar invested today might yield ten dollars to protect more land later. These are rational, necessary tools. Our charter embraces them. They’re about *knowledge* and *resources*, not time itself.

  **(Introduce the "weird clause" and the controversy)**
  But our charter draws a bright line. It says we cannot discount a future benefit *merely because it happens later*. A unit of good – clean water, fertile soil, a preserved meadow – in the year 2225 counts the same as a unit of good today. No “pure time preference.” No inherent devaluation of the future just because it’s… future.

  **(Address the Economists Directly & Honestly)**
  Now, I hear my economist friends stirring. “Ramsey’s formula!” you’re thinking. “The social discount rate is ρ (pure time preference) plus θg (the growth term)! You can’t just set ρ to zero! It’s naive!” And you’re right—in a model of aggregate societal investment, ρ is often included. It reflects observed impatience. Some argue separating “pure” impatience from risk or growth is artificial—they blur together.

  **(Make the Philosophical Case – Appealing to Values & Reason)**
  But here’s where we land trust folks step back and ask: *Should* we be impatient with the future? Is that a *defensible ethical stance*, or is it a bias—like favoring ourselves over strangers, or our children over our great-great-grandchildren? Think about it. If I told you, “I value clean water for *my* child less than clean water for *me* today,” you’d call that selfish, not rational. If I said, “I care less about harm done to people born in 2225 simply because they aren’t born yet,” that feels… wrong. Arbitrary. Like declaring someone’s suffering matters less based on their birth year.

  **(Bridge the Gap – Why the Distinction Matters Here & Now)**
  This isn’t about denying economic models. It’s about **making a conscious ethical choice for *this* institution**. Our mission isn’t maximizing short-term utility or GDP. It’s *stewardship*. It’s holding land in trust *forever*. When we discount purely for time, we systematically undervalue the very long-term benefits we exist to create. That oak tree’s shade in 2125? The carbon sequestered by our wetlands in 2225? They are *core* to our purpose. Discounting them *merely* because they’re distant risks turning our “permanent” protection into a polite fiction. It risks saying, implicitly, “The future matters less.”

  **(Address the Practicality/Objection Head-On)**
  “But,” someone might say, “isn’t zero pure time preference unrealistic? Don’t we *feel* the future less?” Perhaps. But feelings aren’t ethics. And here’s the key: our charter *doesn’t* ignore realism. We still discount heavily for uncertainty! We discount for opportunity cost! We’re prudent stewards. All we’ve done is stripped out one specific element: the *inherent* devaluation of the distant future. We’re saying: **When we know a future benefit *will* happen, and we can accurately assess it, its value doesn’t diminish just because the calendar flips.** That’s not economics – it’s a commitment.

  **(Unite the Room – Connect to Shared Love & Legacy)**
  This clause speaks to the heart of why many of us are here. For our farming families: you understand patience. You plant seeds knowing you might not harvest them. You inherit land knowing you borrow it from your grandchildren. You don’t discount next year’s crop to zero just because it’s not today! For our donors and volunteers: your generosity isn’t just about immediate impact. It’s about legacy. It’s about whispering to the future, “You matter. We saw you coming.” This clause is that whisper written down. It’s our promise that we won’t let the quiet tyranny of “later” erode the meaning of “permanent.”

  **(The Punchline – Why It’s Worth the Fight)**
  Is the line between “pure time preference” and other discounts perfectly sharp in every complex model? Maybe not. Economics grapples with messy reality. But **ethics requires clear lines**. By drawing this one, we anchor ourselves. When tempted by a short-term gain that risks a long-term loss, we must justify it based on *real* uncertainty or *real* opportunity cost—not just an unexamined bias that the far future counts for less. That forces better, clearer, more honest decisions for the centuries we’re meant to protect.

  **(Wrap Up with Celebration)**
  So, yes, this clause causes debate. Good! It *should*. It forces us to confront what “forever” really means. It challenges us to match our tools to our deepest purpose. On this 25th anniversary, let’s celebrate not just the land we’ve saved, but the rigor and courage we’re building to save it *for all time*. Thank you, and happy anniversary!

  ---

  **Why this works:**

  1.  **Respects Both Audiences:** Economists hear their concerns acknowledged ("Ramsey," "blurring," "models") but are challenged on ethical grounds *outside* their usual domain. Locals get a clear moral argument using relatable concepts (planting seeds, legacy, fairness).
  2.  **Doesn't Dodge Philosophy:** It explicitly frames pure time preference as an *ethical bias*, not a rational necessity. It distinguishes between *prudent* discounting (risk, opportunity cost) and *inherent* discounting.
  3.  **Honest About the Controversy:** Admits the line might be fuzzy in complex models but argues its *ethical necessity* for *this specific mission*. "Ethics requires clear lines" is a powerful rebuttal to "it's all blended."
  4.  **Connects to Core Mission:** Anchors the clause in stewardship, permanence, legacy, and fairness – values everyone in the room shares. The oak tree metaphor provides a consistent, tangible anchor.
  5.  **Appropriate Tone:** Starts and ends celebratory. Uses plain language ("whisper to the future," "tyranny of 'later'"). Avoids jargon. Humorous opener ("dessert menu," "spirited discussions").
  6.  **Provides a Robust Defense:** It doesn't just explain the clause; it argues *why* it's correct and necessary for a land trust, framing the economists' objections as valid *within their domain* but insufficient for the *ethical* domain of permanent stewardship.
  7.  **Keeps the Peace:** By elevating the discussion to shared values and mission, it diffuses potential conflict. It makes the clause a point of pride, not division.

  **Straight Talk on Feasibility:** The distinction *can* hold water ethically, even if it's messy empirically. Economists might still grumble, but this speech gives them an honorable off-ramp by respecting their technical points while firmly situating the decision in the land trust's unique ethical mandate. It's unlikely to start a fight at the party because it’s framed positively, unites people under shared purpose, and makes the technical point subsidiary to the moral vision. **This is the best path forward.** The alternative – avoiding it or watering it down – just kicks the can down the road to another rancorous board meeting. This speech airs it constructively and proudly.

  **Deliver it with conviction and warmth!** Good luck.
