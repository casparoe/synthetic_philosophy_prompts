prompt: |-
  I've been trying to see why the Frege-Geach problem is supposed to be such a serious threat to expressivism, and I suspect I'm missing the point of it. As I reconstruct the objection, the trouble is with what "lying is wrong" is doing in the antecedent of "if lying is wrong, then telling my brother to lie is wrong": nothing is being asserted there, so the expressivist's story about expressing disapproval has no foothold, and he owes us an account of the unasserted occurrence. But that looks like a problem with an obvious answer — where nothing is asserted, nothing is expressed, so there is no attitude to be accounted for — which makes me think the real difficulty must lie somewhere else, perhaps in a merely technical demand about formalizing the inference. What does the Frege-Geach problem actually require of the expressivist that "unasserted clauses express nothing" fails to supply, and why doesn't that observation simply dissolve the problem? Please lead with your answer in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user is struggling to understand why the Frege-Geach problem is such a big deal for expressivism. They think they've got a handle on it—unasserted clauses express nothing, so there shouldn't be an issue. But they suspect they're missing something deeper, maybe something technical about formalizing inferences. 

  Hmm, the user is clearly philosophically inclined—they're reconstructing arguments and spotting potential solutions. That's good. But their proposed solution ("unasserted clauses express nothing") feels too quick, like it might dodge the real challenge. They even sense this themselves, wondering if the "real difficulty" is elsewhere. Smart intuition.

  Let me unpack why "unasserted = nothing expressed" doesn't work. The core isn't just about attitude-expression gaps; it's about preserving logical structure across asserted/unasserted contexts. If "lying is wrong" means *boo, lying!* when asserted, but means... nothing? when unasserted, then how does the conditional "if lying is wrong..." even make sense? Its meaning would evaporate in the antecedent. And worse—how can modus ponens work if the antecedent and standalone sentence don't share the same semantic content? 

  The user might be underestimating how much expressivism needs to explain logical validity. If validity rests on truth-preservation, but expressivists reject truth-aptness for moral sentences, they owe us a new account of validity. Blackburn's quasi-realism tries this with attitudes, but it gets messy. The technical demand isn't arbitrary—it's about saving logic itself for moral discourse.

  ...Also, the user asked for the answer first, then reasoning. Gotta lead with "The expressivist must explain..." right upfront. No preamble. Check.
answer: |-
  **The expressivist must explain how unasserted moral sentences retain identical meaning across embedded and standalone contexts to preserve logical validity, particularly for inferences like modus ponens, which "unasserted clauses express nothing" fails to address because it severs the semantic connection between asserted and unasserted occurrences.**  

  The core problem lies in *logical compositionality and inference*, not merely in accounting for attitudes in unasserted contexts. Consider:  
  1. **Meaning Identity Requirement**: For the inference "If lying is wrong, then getting your brother to lie is wrong; lying is wrong; therefore, getting your brother to lie is wrong" (modus ponens) to be valid, the phrase "lying is wrong" must mean the *same thing* in both the antecedent and the second premise. If the expressivist claims the standalone assertion expresses disapproval (e.g., "Boo, lying!"), but the embedded occurrence expresses *nothing* (as you suggest), then:  
     - The antecedent lacks semantic content, rendering the conditional meaningless.  
     - The inference collapses because the second premise ("lying is wrong") no longer shares content with the antecedent.  

  2. **Threat to Logical Validity**: Logic requires that sentences contribute the *same content* wherever they appear. If "lying is wrong" in the antecedent doesn’t contribute the content needed for the conditional to be truth-apt (or validity-apt), modus ponens fails. Expressivism must explain how moral sentences in embeddings:  
     - Participate in truth-functional compounds (e.g., conditionals, negations),  
     - Preserve logical relations (e.g., contradiction between "Lying is wrong" and "Lying is not wrong"),  
     - Without appealing to truth-conditional semantics they reject.  

  3. **The Technical Demand**: Expressivists must provide a unified account where:  
     - The mental state expressed by an asserted moral sentence (e.g., disapproval) is *systematically related* to the state expressed by complex sentences embedding it.  
     - For example, "If lying is wrong..." might express *disapproval of combining approval of lying with disapproval of telling one’s brother to lie*. But this must be shown to validate all logical patterns (e.g., negation, disjunction) without ad hoc solutions.  

  **Why "unasserted clauses express nothing" doesn’t dissolve the problem**: It makes moral logic inexplicable by destroying meaning continuity. If embedded occurrences lack content, conditionals like "If lying is wrong..." become non-cognitive (e.g., mere attitudes), but logic requires cognitive content to bear truth-like properties. Without this, expressivism cannot explain why modus ponens *works* for moral arguments as it does for descriptive ones—threatening its ability to account for ordinary moral reasoning. The challenge is not merely to *deny* expression in embeddings, but to *replace truth-conditional logic* with an alternative model of moral inference.
