  ### **III. Tension Analysis**
  *Identifying incompatibilities and key fault lines.*

  #### **Tension 1: Lexical Priority vs. Representability & Uncertainty**  
  - **Desiderata in Tension**:  
    - Strict Lexical Priority (D2)  
    - Usability Under Uncertainty (D11)  
    - Clarity on Representability (D7)  
  - **Incompatibility Argument**:  
    Lexical priority demands that any state with above-threshold suffering is infinitely worse than any without it. This:  
    - **Breaks Real-Valued Representability**: Real numbers require continuity (Archimedean property), but lexicality creates discontinuities. For example, no real-valued function can map a state with above-threshold suffering to −∞ while preserving finite values elsewhere without trivializing comparisons (e.g., all above-threshold states are equally bad).  
    - **Paralyzes Decision-Making Under Uncertainty**: If above-threshold suffering is infinitely disvaluable, any lottery with a positive probability of it becomes infinitely bad. Thus, D11 (usability) fails—e.g., a 10^-100 chance of a stubbed toe (if misclassified as above-threshold) outweighs curing cancer. D2 forces infinite risk aversion, violating D12 (risk consistency).  
  - **Fault Line**: **D2 (Lexical Priority)** is the primary driver. It necessitates rejecting continuity (D8) and complicates uncertainty (D11–12).  

  #### **Tension 2: Commensurability vs. Threshold Structure**  
  - **Desiderata in Tension**:  
    - Local Commensurability (D1)  
    - Defended Commensurability (D10)  
    - Non-Arbitrary Threshold (D5)  
  - **Incompatibility Argument**:  
    Commensurability (D1, D10) assumes a single valence scale with a common unit and zero point. But a threshold implies scale *inhomogeneity*—below-threshold valence is commensurable, above is not. This creates two problems:  
    - **Zero-Point Instability**: If the zero point (where pain/pleasure balance) is below the threshold, D1 holds, but above-threshold suffering becomes incommensurable with everything else. Why is the scale unified if one region is incomparable?  
    - **Threshold Consistency**: If valence is commensurable, a smooth scale should allow gradual trade-offs, but D5 (non-arbitrary threshold) demands a sharp discontinuity. This invites sorites objections (D13).  
  - **Fault Line**: **D10 (Commensurability Grounding)** is the weak link. If valence isn’t fundamentally unified (e.g., pleasure/pain are distinct dimensions), the threshold becomes more plausible, but D1 (local trade-offs) may fail.  

  #### **Tension 3: Lexical Priority vs. Transitivity**  
  - **Desiderata in Tension**:  
    - Strict Lexical Priority (D2)  
    - Transitivity/Completeness (D6)  
  - **Incompatibility Argument**:  
    Lexical priority can threaten transitivity if above-threshold suffering is *scalar* (e.g., agony > severe pain > moderate pain). Suppose:  
    - A: Moderate pain (below threshold) + massive pleasure.  
    - B: Severe pain (above threshold).  
    - C: Agony (above threshold).  
    By D2, B > A and C > B. But if C involves more suffering than B, and B lexically dominates A, transitivity holds. However, if above-threshold states are incomparable to below-threshold states, completeness fails. If they are comparable only lexically, transitivity holds but risks circularity if thresholds are vague.  
  - **Resolution**: This tension is resolvable if lexical priority applies categorically (all above-threshold > all below-threshold), and above-threshold states are ordered separately. D6 survives if the theory ensures completeness within/between categories.  

  #### **Most Exclusionary Desideratum**  
  - **D2 (Strict Lexical Priority)** does the most to exclude theories. It:  
    - Forces rejection of Archimedean continuity (D8).  
    - Complicates real-valued representability (D7).  
    - Creates uncertainty paralysis (D11–12).  
    - Demands robust defenses against reductio (D14).  
    Alternative views (e.g., weighted utilitarianism) avoid these issues but fail to capture LTNU’s core intuition about extreme suffering.  

  ---

  ### **IV. Scoring Standard Contenders**
  *Evaluated against the desiderata. ✓ = Satisfies, ✗ = Fails, ~ = Partially/Ambiguous.*

  | Desideratum                          | Classical Utilitarianism | Prioritarianism | Two-Scale Incommensurabilism | Finite-Enormous-Weighting |
  |--------------------------------------|--------------------------|-----------------|------------------------------|---------------------------|
  | 1. Local Commensurability            | ✓ (Single scale)         | ✓               | ✗ (No common scale)          | ✓                         |
  | 2. Strict Lexical Priority           | ✗ (No thresholds)        | ✗ (Finite weighting) | ~ (If thresholds exist)      | ✗ (Finite weighting)      |
  | 3. Intensity-Number Distinction      | ✗ (Aggregates totals)    | ~ (Weights but aggregates) | ✓ (If scales separate)       | ✗ (Aggregates)            |
  | 4. Non-Aggregation Across Threshold  | ✗                        | ✗               | ✓                            | ✗                         |
  | 5. Non-Arbitrary Threshold           | ✗ (No threshold)         | ✗               | ~ (If thresholds are sharp)  | ~ (Continuous)            |
  | 6. Transitivity/Completeness         | ✓                        | ✓               | ✗ (Often incomplete)         | ✓                         |
  | 7. Clarity on Representability       | ✓ (Real-valued)          | ✓               | ✗ (No single scale)          | ✓                         |
  | 8. Explicit Archimedean Rejection    | ✗ (Satisfies Archimedean)| ✗               | ~ (If incommensurable)       | ✗                         |
  | 9. Axiological-Decision Distinction  | ~ (Often conflated)      | ~               | ~                            | ~                         |
  | 10. Defended Commensurability        | ✓ (Assumed)              | ✓               | ✗ (Denied)                   | ✓                         |
  | 11. Usability Under Uncertainty      | ✓                        | ✓               | ✗ (Incomparability issues)   | ✓                         |
  | 12. Risk Consistency                 | ✓                        | ✓               | ✗                            | ✓                         |
  | 13. Threshold Justification          | ✗                        | ✗               | ~                            | ~                         |
  | 14. Anti-Reductio Defense            | ✓ (No lexicality)        | ✓               | ~                            | ✓                         |

  **Summary**:  
  - **Classical Utilitarianism**: Fails lexicality (D2, D4), aggregation (D3), and threshold-based desiderata (D5, D13). Strong on formal properties.  
  - **Prioritarianism**: Better for equity but fails lexicality (D2, D4) and threshold structure (D5).  
  - **Two-Scale Incommensurabilism**: Satisfies lexicality (D2) and non-aggregation (D4) if thresholds exist, but fails commensurability (D1, D10) and uncertainty (D11–12).  
  - **Finite-Enormous-Weighting**: Mimics lexicality pragmatically but fails strict priority (D2, D9) and allows compensation in principle.  

  ---

  ### **Conclusion**
  The most severe tensions arise from **lexical priority** (D2), which clashes with representability (D7) and uncertainty usability (D11–12), and **commensurability** (D1, D10), which strains the threshold’s sharpness (D5, D13). LTNU’s viability hinges on:  
  1. **Rejecting Archimedean continuity** and embracing discontinuous value structures (e.g., lexicographic orders or multi-dimensional functions).  
  2. **Decoupling axiology from decision theory**—e.g., using thresholds for risk (e.g., "ignore probabilities below ε") to avoid paralysis.  
  3. **Grounding the threshold** in non-arbitrary phenomena (e.g., neuroscientific pain thresholds) to defuse arbitrariness objections.  

  No theory satisfies all desiderata perfectly. LTNU excels at capturing the moral urgency of extreme suffering but pays a high formal and practical cost. The **lexical cliff** is both its defining feature and its greatest vulnerability, demanding careful defense against reductio. If commensurability cannot be rigorously defended, a **two-scale incommensurabilist view** may be structurally superior, albeit at the cost of calculability.
