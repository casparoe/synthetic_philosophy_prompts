prompt: |-
  You are an expert in axiology and the formal structure of value — the kind of philosopher who cares as much about the shape of a value ordering as about the verdicts it issues. I want you to help me assemble the desiderata for a family of theories, and I want you to reason carefully and show your work rather than reach for a stock answer. Begin by brainstorming the candidate requirements and the cases that motivate them before you commit to a final list.

  Here is the territory. Consider a view I will call lexical threshold negative utilitarianism (LTNU), stated as a family rather than a single doctrine so that we do not get stuck on labels. LTNU holds that pleasures and pains lie on a single scale of valence — that they are commensurable, at least locally — but that the scale is not homogeneous. Below some threshold of suffering, positive and negative valence trade off at a finite exchange rate: enough pleasure can outweigh some pain. At or above the threshold, the exchange rate becomes infinite in one direction: no finite amount of pleasure, however great, can compensate for even a tiny increment of above-threshold suffering. Above the threshold, the disvalue of suffering is lexically prior to all positive value.

  I am far less interested in defending LTNU than in knowing what any theory in this neighborhood would have to deliver in order to be adequate. So please produce the desiderata — the specification a theory of this kind must meet.

  I want the list to cover, at minimum:

  - The cases the theory must get right, each with the case that motivates it. Include the two-dials case (a subject whose pleasure and pain are separately adjustable) and the ledge case (intense short-lived suffering for one against mild protracted suffering for many).
  - The distinctions it must not collapse: between the amount of suffering and the number of sufferers; between a value being lexically prior and its merely being weighted more heavily; between a genuine threshold and a merely steep but continuous exchange rate; between axiological priority and decision-theoretic priority.
  - The formal constraints it must respect or explicitly reject: transitivity and completeness of the betterness relation, representability by a real-valued value function, continuity or the Archimedean condition, and the possibility of ranking options under uncertainty.
  - The puzzles it must dissolve rather than stipulate away, with each puzzle stated: the threshold-arbitrariness problem (where the threshold lies and why not elsewhere); the zero-point or commensurability problem (what makes pleasure and pain quantities of the same kind at all, and what fixes their common unit); the lexical cliff (if any above-threshold suffering defeats any finite pleasure, is that a feature of the view or a reductio?); aggregation across persons; and the lottery case (a minute chance of above-threshold suffering against a certainty of enormous pleasure).

  For each requirement, say what is behind it — the case or consideration that makes it a requirement rather than a prejudice. Then mark which requirements are non-negotiable and which are merely preferences of one camp.

  The part I most want to see is the tension analysis. Identify any subset of the desiderata that you suspect cannot be jointly satisfied, and argue for the incompatibility rather than merely gesturing at it. I have a hunch that lexical priority sits badly both with the demand for representability by a real-valued function and with the demand that the theory be usable under uncertainty, and that the commensurability requirement may be in tension with the very idea of a threshold; but do not defer to my hunch — tell me where the real fault lines are, and which single requirement does the most to exclude candidate theories.

  Finally, briefly score the standard contenders against your list: classical utilitarianism, prioritarianism, a two-scale incommensurabilist or parity view, and a finite-but-enormous exchange-rate view that refuses true lexicality. I care about the structure of each view, not about who held it, so do not bother with names, dates, or reading lists.
reasoning: |-
  We are constructing a set of desiderata for theories in the neighborhood of Lexical Threshold Negative Utilitarianism (LTNU). The goal is to specify what any such theory must deliver to be adequate. We'll proceed by:

  1. Brainstorming candidate requirements motivated by cases and distinctions.
  2. Organizing them into a list with justifications.
  3. Identifying tensions between desiderata.
  4. Scoring standard contenders against the list.

  We focus on:
  - Cases the theory must get right.
  - Distinctions it must not collapse.
  - Formal constraints it must respect or reject.
  - Puzzles it must dissolve.

  ---

  **I. Brainstorming Candidate Requirements and Motivating Cases**

  **A. Cases and the Desiderata They Motivate**

  1. **Two-Dials Case**: 
     - *Case*: An agent's pleasure and pain can be independently adjusted via two dials. The theory must be able to compare states that differ in both pleasure and pain.
     - *Desideratum* (D1): **Comparability of Mixed States**. The theory must be able to compare states that have both positive and negative components (at least when the negative is below the threshold) and states that have above-threshold suffering.

  2. **Ledge Case**:
     - *Case*: A choice between (A) one person suffering intensely for a short time and (B) many people suffering mildly for a long time. The total suffering in B might be greater in aggregate but each instance is below the threshold, while in A the suffering is above the threshold. LTNU would say A is worse because it involves above-threshold suffering, even if the total suffering in B is greater.
     - *Desideratum* (D2): **Lexical Priority of Above-Threshold Suffering**. Any state of affairs containing above-threshold suffering (even a tiny amount) is worse than any state without above-threshold suffering, no matter how much positive value the latter has.

  3. **Threshold Location Case**:
     - *Case*: We must be able to say why the threshold is at a particular level (e.g., at the level of severe torture) and not at a higher or lower level (e.g., at a stubbed toe or at a level beyond any human experience).
     - *Desideratum* (D3): **Non-Arbitrariness of Threshold**. The theory must provide a non-arbitrary basis for the threshold's location.

  4. **Zero-Point and Commensurability Case**:
     - *Case*: We need to compare a unit of pleasure and a unit of pain. What is the common scale? For instance, if we have a state with 10 units of pain and 20 units of pleasure, how do we compare it to a state with 0 pain and 5 units of pleasure? This requires a common unit and a zero point (where pain and pleasure balance).
     - *Desideratum* (D4): **Commutability Below Threshold**. Below the threshold, there must be a finite exchange rate between pain and pleasure. The theory must specify how to determine when a mixed state is better or worse than a state with no pain.

  5. **Lexical Cliff Case**:
     - *Case*: Consider a state with a single instance of suffering just above the threshold and a state with an enormous amount of pleasure (e.g., the happiness of billions for centuries). LTNU says the former is worse. But if the above-threshold suffering is only slightly above and the pleasure is immense, this might seem counterintuitive. We need to be able to explain this as a feature, not a bug.
     - *Desideratum* (D5): **Lexical Priority as a Feature**. The theory must embrace the lexical priority of above-threshold suffering and explain why it is not a reductio.

  6. **Aggregation Across Persons**:
     - *Case*: Suppose we have a choice between (A) one person experiencing above-threshold suffering and (B) a large number of people experiencing below-threshold suffering that aggregates to a very high total. LTNU says A is worse. But what if we have a choice between (C) one person above threshold and (D) a vast number of people just below the threshold? The theory must handle aggregation of below-threshold suffering without letting it override above-threshold suffering.
     - *Desideratum* (D6): **Non-Aggregation Across the Threshold**. The theory must not allow any aggregation of below-threshold suffering to outweigh even a single instance of above-threshold suffering.

  7. **Lottery Case**:
     - *Case*: A choice between (A) a certainty of an enormous amount of pleasure and (B) a lottery that with a very small probability leads to one person experiencing above-threshold suffering and with high probability leads to a state of even more pleasure. How does the theory rank these under uncertainty?
     - *Desideratum* (D7): **Handling Uncertainty**. The theory must be able to rank prospects (lotteries) that have a chance of above-threshold suffering.

  **B. Distinctions the Theory Must Not Collapse**

  8. **Amount vs. Number**:
     - *Distinction*: The theory must distinguish between the intensity of suffering (which might push it above the threshold) and the number of sufferers (which might aggregate below-threshold suffering). For instance, a single instance of above-threshold suffering might be worse than any number of below-threshold sufferings.
     - *Desideratum* (D8): **Distinguish Intensity and Numbers**. The theory must not collapse the distinction between the intensity of suffering and the number of sufferers when the suffering is above threshold versus below.

  9. **Lexical Priority vs. Heavy Weighting**:
     - *Distinction*: Lexical priority means that no amount of the less important value can compensate for any loss of the more important one. Heavy weighting is finite but very large. The theory must not collapse these because LTNU requires true lexicality above the threshold.
     - *Desideratum* (D9): **Genuine Lexicality**. The theory must have a genuine lexical threshold (infinite exchange rate) and not merely a very high finite exchange rate.

  10. **Axiological vs. Decision-Theoretic Priority**:
      - *Distinction*: Axiological priority is about the goodness of outcomes. Decision-theoretic priority is about what to choose under uncertainty. The theory must not conflate them because one might hold that above-threshold suffering is lexically worse in axiological terms but that in decision-making under risk, we might accept a small chance of it for a large enough benefit.
      - *Desideratum* (D10): **Clarity on Axiological vs. Decision-Theoretic**. The theory must clearly separate the axiological ordering from the decision-theoretic rules for uncertainty, and specify how they relate.

  **C. Formal Constraints**

  11. **Transitivity and Completeness**:
      - *Constraint*: The betterness relation must be transitive (if A is better than B and B is better than C, then A is better than C) and complete (for any two states A and B, either A is better than B, B is better than A, or they are equally good). Without transitivity, the ordering is incoherent; without completeness, we cannot compare some states.
      - *Desideratum* (D11): **Transitivity and Completeness**. The betterness relation must be transitive and complete.

  12. **Representability by a Real-Valued Function**:
      - *Constraint*: It is convenient to have a real-valued function that represents the betterness relation. But lexical priority typically violates continuity, which is required for such a representation in the usual sense (e.g., using a utility function). The theory must either provide a representation or explain why it is not required.
      - *Desideratum* (D12): **Representability (if possible)**. The theory should ideally be representable by a real-valued function, but if not, it must explain how to work without it.

  13. **Archimedean Condition and Continuity**:
      - *Constraint*: The Archimedean condition says that for any three outcomes A, B, C with A better than B better than C, there is a probability p in (0,1) such that a lottery between A and C is better than B for sure. Lexical priorities typically violate this. The theory must either reject this condition or find a way to satisfy it.
      - *Desideratum* (D13): **Clarity on Archimedean/Continuity**. The theory must state whether it satisfies the Archimedean condition and continuity, and if not, explain how it handles trade-offs.

  14. **Ranking under Uncertainty**:
      - *Constraint*: The theory must be applicable to choices under risk and uncertainty. It should provide a way to rank lotteries (prospects) that may result in states with above-threshold suffering.
      - *Desideratum* (D14): **Usability under Uncertainty**. The theory must provide a method for evaluating prospects (lotteries) and not just sure outcomes.

  **D. Puzzles to Dissolve**

  15. **Threshold-Arbitrariness Problem**:
      - *Puzzle*: Why is the threshold at level L and not at L+ε or L-ε? If the threshold is sharp, then a state with suffering at L-ε is compensable by pleasure, but at L it is not. This seems arbitrary.
      - *Desideratum* (D15): **Dissolve the Threshold Arbitrariness**. The theory must provide a non-arbitrary account of why the threshold is where it is, and why a sharp threshold is acceptable.

  16. **Zero-Point and Commensurability Problem**:
      - *Puzzle*: What is the common scale for pleasure and pain? How do we define a unit? And what is the zero point (the point at which pain and pleasure balance)? Without this, the finite exchange rate below threshold is undefined.
      - *Desideratum* (D16): **Commensurability Below Threshold**. The theory must provide a basis for commensurability of pleasure and pain below the threshold, including a zero point.

  17. **Lexical Cliff Puzzle**:
      - *Puzzle*: The lexical cliff (the jump from compensable to non-compensable) might seem too extreme. The theory must explain why this is acceptable and not a reductio.
      - *Desideratum* (D17): **Defend the Lexical Cliff**. The theory must explain why lexical priority is justified, even when the above-threshold suffering is minimal and the pleasure to be sacrificed is enormous.

  18. **Aggregation Puzzle**:
      - *Puzzle*: How does the theory handle aggregation of below-threshold suffering? Can we aggregate it to the point where it is worse than an above-threshold suffering? LTNU says no, but then how do we avoid the counterintuitive result that we should prevent a single instance of above-threshold suffering even at the cost of allowing a huge amount of below-threshold suffering?
      - *Desideratum* (D18): **Non-Aggregation of Below-Threshold Suffering Across the Threshold**. The theory must not allow aggregation of below-threshold suffering to outweigh above-threshold suffering, but it must also account for our intuitions about the badness of large amounts of below-threshold suffering.

  19. **Lottery Puzzle**:
      - *Puzzle*: How should we evaluate a lottery that has a very small chance of above-threshold suffering? If we are risk-averse to above-threshold suffering, we might reject any positive chance of it, no matter how small, which would lead to paralysis (since almost any action might have some tiny chance of causing above-threshold suffering). Alternatively, we might accept very small chances.
      - *Desideratum* (D19): **Resolve the Lottery Puzzle**. The theory must provide a consistent way to evaluate lotteries that involve above-threshold suffering.

  ---

  **II. Final List of Desiderata**

  We now organize the above into a numbered list, grouping similar ones and removing duplicates.

  **Desiderata (with Motivation and Negotiability)**

  1. **Comparability of Mixed States (D1)**  
     - *Motivation*: Two-dials case. We must compare states with varying amounts of pleasure and pain.  
     - *Negotiability*: Non-negotiable. Without this, the theory cannot guide choices in mixed scenarios.

  2. **Lexical Priority of Above-Threshold Suffering (D2, D5, D6, D9)**  
     - *Motivation*: Ledge case, Lexical cliff case, Aggregation across persons. The core of LTNU: above-threshold suffering cannot be compensated by any amount of pleasure.  
     - *Negotiability*: Non-negotiable for LTNU. This is the defining feature.

  3. **Non-Arbitrariness of Threshold (D3, D15)**  
     - *Motivation*: Threshold location case. To avoid ad hoc specification.  
     - *Negotiability*: Non-negotiable. Without a non-arbitrary threshold, the theory is arbitrary.

  4. **Commensurability Below Threshold (D4, D16)**  
     - *Motivation*: Zero-point and commensurability case. We need a finite exchange rate below threshold.  
     - *Negotiability*: Non-negotiable for LTNU. Without this, the view collapses into a two-scale view.

  5. **Distinguish Intensity and Numbers (D8)**  
     - *Motivation*: Ledge case and aggregation. We must not confuse the intensity of suffering (which may cross the threshold) with the number of sufferers (which may aggregate below-threshold suffering).  
     - *Negotiability*: Non-negotiable.

  6. **Genuine Lexicality (D9)**  
     - *Motivation*: To avoid collapsing into a weighted view.  
     - *Negotiability*: Non-negotiable for LTNU.

  7. **Clarity on Axiological vs. Decision-Theoretic (D10)**  
     - *Motivation*: To avoid conflating the value of outcomes with decision rules.  
     - *Negotiability*: Non-negotiable for clarity, but the specific relation might vary.

  8. **Transitivity and Completeness (D11)**  
     - *Motivation*: Required for a coherent ordering.  
     - *Negotiability*: Non-negotiable for a rational choice theory.

  9. **Representability (if possible) (D12)**  
     - *Motivation*: Desirable for mathematical tractability.  
     - *Negotiability*: Negotiable. Lexical views typically cannot be represented by a real-valued function in the usual way, so we may have to drop this.

  10. **Clarity on Archimedean/Continuity (D13)**  
      - *Motivation*: To be explicit about trade-offs.  
      - *Negotiability*: Non-negotiable for clarity. The theory must reject the Archimedean condition for above-threshold suffering.

  11. **Usability under Uncertainty (D14, D19)**  
      - *Motivation*: Lottery case. We must be able to make decisions under risk.  
      - *Negotiability*: Non-negotiable for a practical theory.

  12. **Defend the Lexical Cliff (D17)**  
      - *Motivation*: Lexical cliff puzzle. The theory must argue that lexical priority is acceptable even in extreme cases.  
      - *Negotiability*: Non-negotiable for LTNU.

  13. **Non-Aggregation of Below-Threshold Suffering Across the Threshold (D18)**  
      - *Motivation*: Aggregation puzzle. Below-threshold suffering, no matter how much, cannot outweigh above-threshold suffering.  
      - *Negotiability*: Non-negotiable for LTNU.

  ---

  **III. Tension Analysis**

  We suspect that some desiderata are incompatible. Let's identify the tensions.

  **Tension 1: Lexical Priority vs. Representability by a Real-Valued Function**  
  - Lexical priority (D2, D6, D9) requires that above-threshold suffering is infinitely worse than any amount of pleasure. In a real-valued function, we would assign a value of -∞ to any state with above-threshold suffering. But then all states with above-threshold suffering are equally bad, which may not be acceptable (e.g., one person suffering above threshold vs. a billion). If we try to represent the value of above-threshold suffering with a finite number, then we lose lexicality because a sufficiently large pleasure could outweigh a small above-threshold suffering.  
  - *Incompatibility*: D2 (lexical priority) and D9 (genuine lexicality) conflict with D12 (representability by a real-valued function) because lexical orders are not continuous and thus not representable by a real-valued function in the usual way.

  **Tension 2: Lexical Priority vs. Archimedean Condition / Continuity**  
  - The Archimedean condition (part of D13) requires that for any three outcomes A, B, C with A > B > C, there is a lottery between A and C that is better than B. But if A is a state without above-threshold suffering, B is a state with a small above-threshold suffering and huge pleasure, and C is a state with huge above-threshold suffering, then by lexical priority, B and C are both worse than A (and we might have B better than C if we can compare within above-threshold states). But there is no lottery between A and C that is better than B because any positive chance of C (above-threshold suffering) would make the lottery worse than A, and if p=0 then it's just A. But we require p>0.  
  - *Incompatibility*: D2 (lexical priority) implies that we must reject the Archimedean condition (D13). But D13 requires clarity, so we can reject it. The tension is with the desire for continuity, which is necessary for real-valued representation.

  **Tension 3: Lexical Priority vs. Usability under Uncertainty**  
  - In the lottery case (D14, D19), if we have a lottery that with a small chance p causes above-threshold suffering and with chance (1-p) causes a state of enormous pleasure, how do we rank it against a sure state of moderate pleasure? Lexical priority might suggest that any positive chance of above-threshold suffering is unacceptable, so the lottery is worse than any sure outcome without above-threshold suffering. But then we are paralyzed because many actions have a tiny chance of causing above-threshold suffering. Alternatively, we might use a decision rule that allows very small chances. But then we collapse lexical priority in decision-making.  
  - *Incompatibility*: D2 (lexical priority) and D19 (resolve lottery puzzle) may be in tension because if we strictly enforce lexical priority in decision-making, we get paralysis. If we do not, then we lose lexical priority in the decision-theoretic context. This is linked to D10: we must separate axiological and decision-theoretic priority. We might hold that axiological lexical priority does not imply that we must avoid any chance of above-threshold suffering in decision-making. But then we need a decision rule that can handle it.

  **Tension 4: Non-Arbitrariness of Threshold vs. Genuine Lexicality**  
  - If the threshold is sharp, then an arbitrarily small increase in suffering can cause a discontinuous jump from compensable to non-compensable. This seems arbitrary. We might try to make the threshold vague, but then we lose the sharpness required for lexicality.  
  - *Incompatibility*: D3 (non-arbitrariness) and D9 (genuine lexicality) are in tension because a sharp threshold is inherently arbitrary at the boundary. The theory must explain why a sharp threshold is acceptable despite the arbitrariness at the boundary.

  **Most Troublesome Desideratum**: **D2 (Lexical Priority of Above-Threshold Suffering)** is the core of LTNU but causes the most trouble. It leads to:
  - Rejection of representability (D12) and the Archimedean condition (D13).
  - Challenges in decision-making under uncertainty (D14, D19).
  - The threshold arbitrariness problem (D3, D15).

  ---

  **IV. Scoring Standard Contenders**

  We evaluate the following views:

  1. **Classical Utilitarianism (CU)**: 
     - Sum of pleasure minus pain on a single scale. No thresholds, no lexicality.
     - *Scores*: 
       - Fails D2 (lexical priority) and D6 (non-aggregation across threshold): it aggregates all suffering and pleasure linearly.
       - Meets D1, D4, D8? (but doesn't have a threshold to distinguish), D11, D12, D13, D14, D16.
       - Fails D3 (no threshold to be arbitrary), D5, D9, D15, D17, D18.

  2. **Prioritarianism**:
     - Weights the interests of the worse off more heavily. But no threshold and no lexicality.
     - *Scores*:
       - Fails D2, D6, D9: it does not have lexical priority, only finite weighting.
       - May meet D1, D4, D8? (but no threshold), D11, D12, D13, D14, D16.
       - Fails D3, D5, D15, D17, D18.

  3. **Two-Scale Incommensurabilism (or Parity View)**:
     - Pleasure and pain are on separate scales and are incommensurable, or at best, comparable only by parity. No finite exchange rate. No lexical threshold.
     - *Scores*:
       - Fails D4 (commensurability below threshold) and D16: they deny commensurability.
       - May have a different kind of threshold? Not necessarily. 
       - Fails D2, D9: it does not have lexical priority in the same way.
       - May meet D1? (but only partial comparability), D3 (if no threshold), D8? (but no threshold), D11? (incommensurability leads to incompleteness), D12? (no), D13? (no), D14? (difficult under uncertainty because of incompleteness), D15 (if no threshold), D17? (n/a), D18? (n/a).

  4. **Finite-but-Enormous Exchange-Rate View**:
     - Above a certain level of suffering, the exchange rate becomes very high (but finite). Not lexical.
     - *Scores*:
       - Fails D2, D9: no genuine lexicality.
       - Meets D1, D3? (the threshold is arbitrary but the exchange rate is continuous), D4, D8, D11, D12, D13, D14, D16.
       - Fails D5, D6, D17, D18: because in principle, enough pleasure can outweigh above-threshold suffering.

  **Summary of LTNU's Score**:
  - LTNU meets: D1, D2, D4 (if commensurability is solved), D5 (if defended), D6, D8, D9, D18.
  - It struggles with: D3 (arbitrariness), D10 (must clarify axiological vs decision), D12 (representability - fails), D13 (Archimedean - fails), D14 (uncertainty - needs a decision rule), D15 (arbitrariness), D16 (commensurability - must be provided), D17 (defending the cliff), D19 (lottery puzzle).

  ---

  **Conclusion**

  The most central and problematic desideratum for LTNU is the lexical priority of above-threshold suffering (D2). It forces the rejection of continuity and real-valued representability and creates challenges in decision-making under uncertainty. The threshold arbitrariness problem and the commensurability problem are also major hurdles. 

  To move forward, an LTNU theory must:
  - Provide a non-arbitrary account of the threshold (possibly tying it to a normative concept of personhood or agency).
  - Develop a decision theory that handles lexical priorities without leading to paralysis (e.g., by allowing sufficiently small probabilities to be ignored or by using a multi-dimensional utility representation).
  - Accept that the betterness relation is not representable by a single real-valued function and instead use a vector-valued function or a lexical ordering.

  The tensions are severe but not necessarily fatal. The success of LTNU will depend on how well it can address these challenges.
answer: |-
  Below is a systematic analysis of the desiderata for theories in the neighborhood of Lexical Threshold Negative Utilitarianism (LTNU), structured as requested. I begin by brainstorming candidate requirements motivated by cases and considerations, then consolidate them into a final list with justifications. I identify tensions, score standard contenders, and conclude with the fault lines. The focus is on formal structure, axiological coherence, and practical applicability.

  ---

  ### **I. Brainstorming Candidate Requirements**
  *Motivating cases and considerations for each requirement, before consolidation.*

  1. **Two-Dials Case (Adjustable Pleasure/Pain)**  
     - **Case**: A subject's pleasure and pain can be independently dialed (e.g., dial A: +10 pleasure; dial B: -5 pain). The theory must compare states mixing positive/negative valence.  
     - **Requirement**: **Commensurability Below Threshold**. Pleasure and pain must be locally commensurable below the threshold, with a finite exchange rate (e.g., 2:1).  
     - **Motivation**: Without this, the theory cannot handle trade-offs in ordinary decisions (e.g., medical choices balancing side effects and benefits).

  2. **Ledge Case (Intense Short Suffering vs. Mild Protracted Suffering)**  
     - **Case**: Choice between (A) one person experiencing 10 seconds of excruciating pain (above threshold) and (B) a million people experiencing mild discomfort (below threshold) for years.  
     - **Requirement**: **Lexical Priority of Above-Threshold Suffering**. Any above-threshold suffering, however brief, lexically dominates any finite pleasure or below-threshold suffering.  
     - **Motivation**: To capture the intuition that extreme suffering (e.g., torture) cannot be justified by aggregating mild harms.

  3. **Threshold Location Case**  
     - **Case**: Why place the threshold at "excruciating pain" rather than "moderate pain" or "annoyance"?  
     - **Requirement**: **Non-Arbitrary Threshold Basis**. The threshold must be grounded in a non-arbitrary property (e.g., psychological breaking point, loss of agency).  
     - **Motivation**: Avoids ad hoc moral reasoning; ensures the theory is principled.

  4. **Zero-Point/Commensurability Case**  
     - **Case**: How can a unit of pleasure "cancel" a unit of pain? What is the neutral point?  
     - **Requirement**: **Defended Zero Point**. The theory must specify a non-arbitrary zero point (valence equilibrium) and unit for commensurability.  
     - **Motivation**: Without this, below-threshold trade-offs lack coherence; valence becomes incomparable.

  5. **Lexical Cliff Case**  
     - **Case**: A state with 1 nanosecond of barely-above-threshold suffering vs. a state with galactic-scale pleasure. LTNU says the former is worse.  
     - **Requirement**: **Lexicality as Non-Reductio**. The theory must defend why lexical priority is plausible even in extreme cases.  
     - **Motivation**: To preempt charges of fanaticism; show lexicality reflects moral gravity, not absurdity.

  6. **Aggregation Case**  
     - **Case**: Can a vast sum of below-threshold suffering (e.g., billions of headaches) outweigh one instance of above-threshold suffering?  
     - **Requirement**: **Non-Aggregation Across Threshold**. Aggregation of below-threshold suffering cannot override above-threshold suffering.  
     - **Motivation**: Preserves the lexical cliff; avoids collapsing into total utilitarianism.

  7. **Lottery Case (Risk and Uncertainty)**  
     - **Case**: A 1/1,000,000 chance of above-threshold suffering vs. certainty of immense pleasure.  
     - **Requirement**: **Usability Under Uncertainty**. The theory must rank lotteries without ad hoc rules.  
     - **Motivation**: Moral decisions often involve risk; theories must handle probability.

  8. **Distinction: Suffering Amount vs. Number of Sufferers**  
     - **Case**: One person in agony (above threshold) vs. a billion people in moderate pain (below threshold).  
     - **Requirement**: **Intensity-Distinctness**. The theory must prioritize intensity over numbers when above-threshold suffering is present.  
     - **Motivation**: To avoid conflating "how bad" with "how many" at the threshold.

  9. **Distinction: Genuine Lexicality vs. Heavy Weighting**  
     - **Case**: A view that weights above-threshold suffering 10^100:1 vs. pleasure is not lexical; LTNU requires infinite disvalue.  
     - **Requirement**: **Anti-Approximation**. Lexical priority must be strict (infinite exchange rate), not merely high weighting.  
     - **Motivation**: High weighting allows compensation with sufficient pleasure; lexicality forbids it absolutely.

  10. **Distinction: Axiological vs. Decision-Theoretic Priority**  
      - **Case**: Axiologically, above-threshold suffering is worst, but under uncertainty, we might accept tiny risks (e.g., driving a car).  
      - **Requirement**: **Axiological-Decision Distinction**. The theory must separate value orderings from choice rules under risk.  
      - **Motivation**: Prevents conflation of "what is good" with "what to do" in risky cases.

  11. **Formal Constraint: Transitivity/Completeness**  
      - **Case**: If A > B and B > C, then A > C; all states are comparable.  
      - **Requirement**: **Ordering Rigor**. The betterness relation must be transitive and complete.  
      - **Motivation**: Rational choice requires coherent preferences; avoids money-pump problems.

  12. **Formal Constraint: Real-Valued Representability**  
      - **Case**: Can value be mapped to a real number? Lexicality breaks continuity.  
      - **Requirement**: **Clarity on Representability**. The theory must state if it allows real-valued functions or rejects continuity.  
      - **Motivation**: Representability aids calculation; its absence complicates rankings.

  13. **Formal Constraint: Archimedean Condition**  
      - **Case**: For any three states A > B > C, there exists a probability p such that pA + (1-p)C > B. Lexicality violates this.  
      - **Requirement**: **Explicit Archimedean Stance**. The theory must accept/reject trade-offs via probabilities.  
      - **Motivation**: Archimedean violations challenge standard decision theory.

  14. **Puzzle: Threshold Arbitrariness**  
      - **Case**: Why not shift the threshold slightly? A state at threshold-ε is compensable; at threshold+ε, it is not.  
      - **Requirement**: **Threshold Justification**. The theory must explain why the threshold is fixed and immune to sorites problems.  
      - **Motivation**: Vagueness undermines moral obligations; e.g., is "severe pain" sharp enough?

  15. **Puzzle: Commensurability Foundation**  
      - **Case**: What makes pleasure/pain quantities of a common kind? Is their "unit" physiological, phenomenological, or preference-based?  
      - **Requirement**: **Commensurability Grounding**. The theory must specify the common valence scale (e.g., hedonic tone).  
      - **Motivation**: Prevents LTNU from resting on undefined concepts.

  16. **Puzzle: Lottery Paradox**  
      - **Case**: If any chance of above-threshold suffering is lexically worse, we must avoid all risky actions—even with minuscule probabilities.  
      - **Requirement**: **Risk Consistency**. The theory must avoid paralysis or contradiction in probabilistic choices.  
      - **Motivation**: Lexicality under risk may demand infinite risk-aversion, which is impractical.

  ---

  ### **II. Final List of Desiderata**
  *Consolidated, with justifications and negotiability status. Non-negotiable (NN) requirements are essential to LTNU; others are preferences.*

  | # | Desideratum                          | Justification                                                                                                | Negotiability |
  |---|---------------------------------------|--------------------------------------------------------------------------------------------------------------|---------------|
  | 1 | **Local Commensurability**           | Motivated by **Two-Dials Case**: Trade-offs below threshold require finite exchange rates.                   | NN            |
  | 2 | **Strict Lexical Priority**          | Motivated by **Ledge Case** and **Lexical Cliff**: Above-threshold suffering is infinitely disvaluable.      | NN            |
  | 3 | **Intensity-Number Distinction**     | Motivated by **Aggregation Case**: Above-threshold intensity trumps numbers.                                 | NN            |
  | 4 | **Non-Aggregation Across Threshold** | Motivated by **Aggregation Case**: Below-threshold suffering cannot override above-threshold suffering.      | NN            |
  | 5 | **Non-Arbitrary Threshold**          | Motivated by **Threshold Location Case**: Threshold must be grounded (e.g., in agency loss).                | NN            |
  | 6 | **Transitivity/Completeness**        | Motivated by **Formal Rigor**: Incoherent orderings are irrational.                                         | NN            |
  | 7 | **Clarity on Representability**      | Motivated by **Formal Structure**: Lexicality breaks real-valued functions; the theory must address this.    | Preference    |
  | 8 | **Explicit Archimedean Rejection**   | Motivated by **Formal Constraints**: Lexicality violates Archimedean continuity; this must be embraced.      | NN            |
  | 9 | **Axiological-Decision Distinction** | Motivated by **Lottery Case**: Value orderings ≠ choice rules under risk.                                   | Preference    |
  |10 | **Defended Commensurability**        | Motivated by **Zero-Point Case**: A common scale/zero point must be justified.                              | NN            |
  |11 | **Usability Under Uncertainty**      | Motivated by **Lottery Case**: Must rank prospects without ad hoc rules.                                    | NN            |
  |12 | **Risk Consistency**                 | Motivated by **Lottery Paradox**: Must avoid paralysis (e.g., via lexical thresholds for risk).             | NN            |
  |13 | **Threshold Justification**          | Motivated by **Threshold Arbitrariness**: Explain why threshold sharpness isn’t fatal.                      | Preference    |
  |14 | **Anti-Reductio Defense**            | Motivated by **Lexical Cliff Case**: Defend why lexical priority isn’t absurd in extremes.                 | Preference    |

  **Notes**:  
  - **NN (Non-Negotiable)**: Failure violates LTNU's core (e.g., lexical priority, commensurability).  
  - **Preference**: Desirable but not definitional (e.g., representability is useful but may be sacrificed).  

