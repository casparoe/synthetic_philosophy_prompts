answer: |-
  ## The Unbearable Lightness of Feeling: Hedonism and the Heterogeneity Problem

  The heterogeneity problem strikes at the heart of classical hedonism, the doctrine that pleasure is the sole intrinsic good and pain the sole intrinsic evil. It observes a stark phenomenological diversity among states we label as "pleasures": the visceral sweetness of chocolate, the cool relief of thirst quenched, the warm glow of pride, the intellectual thrill of solving a puzzle, the tranquil contentment of a sunset. These states seem to share no single, introspectively identifiable "hedonic tone" or common phenomenal quality. This diversity is not merely a linguistic inconvenience; it poses a profound conceptual threat, crystallized in the **Collapse Argument**:

  1.  **The Dilemma:** Either (a) the *only* thing common to every pleasure is that the subject wants it or wants it to continue, or (b) there *is* a distinctive, common felt quality (a hedonic tone) unifying all pleasures.
  2.  **The First Horn:** If (a) is true, then desire is doing the unifying work. Pleasure becomes defined *by* being desired. This reduces hedonism to a desire-satisfaction theory of well-being. The intrinsic good is no longer a specific *feeling* (pleasure), but rather the satisfaction of the subject's desires (whatever they may be for). Hedonism *collapses*.
  3.  **The Second Horn:** If (b) is true, then we must account for this common phenomenal quality. However, introspective scrutiny of diverse pleasures reveals no obvious candidate – sweetness feels nothing like relief, which feels nothing like intellectual satisfaction. Positing an elusive "hedonic tone" seems empirically dubious and explanatorily empty.
  4.  **Conclusion:** Either way, hedonism faces serious trouble: it either evaporates into desire theory or relies on a phenomenologically implausible common quality.

  **Why Heterogeneity is a Problem for Hedonism Specifically**

  Ordinary language is indeed untidy; we group diverse things under broad terms ("game," "furniture"). The problem bites hedonism uniquely because hedonism makes a strong *metaphysical and normative claim*: pleasure is a *unified kind of mental state* that constitutes the *sole intrinsic good*. Its value is supposed to reside intrinsically within this specific type of experience. If "pleasure" merely labels a heterogeneous collection of states with no essential commonality beyond being liked, then:
  *   There is no *single* intrinsic good called "pleasure." Instead, there are multiple intrinsic goods (various liked states), undermining the simplicity and unity promised by hedonism.
  *   The source of value shifts. If the only commonality is being desired/liked, then it is the *desiring/liking itself*, or the *relation* between the state and the subject's attitude, that seems fundamental, not the intrinsic nature of the state experienced. This directly threatens the core hedonist claim that the *feeling itself* is the bearer of intrinsic value.

  Heterogeneity doesn't just make categorization messy; it potentially dissolves the very object hedonism needs to exist as a distinct theory.

  **Sensory vs. Attitudinal Hedonism: Facing Heterogeneity**

  *   **Sensory Hedonism:** Identifies pleasure with a specific, introspectible, felt quality or "raw feel" – a distinctive sensation or tone present in all pleasant experiences. This view is *maximally vulnerable* to the heterogeneity problem. Its core claim *is* that there is a common phenomenal quality. If introspection reveals no such quality across diverse pleasures, sensory hedonism is empirically falsified. It struggles immensely with the gasoline case (discussed below) and intellectual/altruistic pleasures, which seem to lack any obvious sensory component comparable to taste or touch.
      *   *Can say:* It offers a clear (though arguably flawed) answer to what pleasure *is* – the feeling. It can insist that heterogeneity is superficial and a fundamental tone *does* exist, awaiting better introspection or scientific discovery.
      *   *Cannot say:* It cannot easily explain why phenomenally distinct states are all called "pleasure" *without* appealing to something external (like being desired), which risks collapse. It struggles to accommodate valence shifts without phenomenal change.

  *   **Attitudinal Hedinalism:** Identifies pleasure not with a feeling, but with a *pro-attitude* – taking intrinsic favor or liking toward some experience or state of affairs one is conscious of. Pleasure is the *attitude of liking*, not necessarily the *object* liked. This view *sidesteps* the phenomenal heterogeneity problem. The diverse sensory experiences (chocolate, relief, pride) are merely the *objects* of the pleasant attitude; the pleasure itself is the uniform attitude of liking directed at those objects.
      *   *Can say:* It readily explains the heterogeneity of pleasant *experiences* – the objects of the attitude are diverse. It cleanly handles the gasoline case and valence flips (the *attitude* changes, not necessarily the smell). It avoids the search for an elusive common feeling.
      *   *Cannot say:* It risks collapsing into the first horn of the dilemma. If pleasure *is* just taking a pro-attitude (liking/desiring the experience to continue), then why isn't this simply desire-satisfaction applied to experiences? What distinguishes "liking" from a generic desire? If the attitude is defined by its functional role (causing pursuit/continuation), it might face functional heterogeneity issues. It struggles to capture the intuition that pleasure has a distinctive *felt* character.

  **Assessing Replies to Heterogeneity**

  1.  **Determinable-Determinate Reply:** Argues that "pleasure" names a determinable property (like "color"), with diverse determinates (sweetness-sensation, relief-sensation, intellectual-satisfaction-sensation). These determinates share the higher-order property of being pleasurable, even if they feel different.
      *   **Assessment:** This offers a plausible metaphysical structure. However, it pushes the problem back a level: *What is the determinable property "being pleasurable"?* Introspection doesn't reveal *what* property sweetness and relief share *as feelings* beyond the fact that we like them. If the determinable is defined phenomenally, we're back to the search for the elusive tone. If defined relationally (e.g., "tends to be liked"), we risk collapse. It feels more like a description of the problem than a solution for sensory hedonism. It works better as a *concession* within attitudinal hedonism (the attitude is the determinable, its diverse objects are the determinates).

  2.  **Functional Kind Reply:** Argues pleasure is defined not by how it feels, but by what it *does* – its causal role in motivation, learning, and behavior. Pleasant states are those the organism is disposed to pursue, sustain, or learn to obtain; unpleasant states are those it is disposed to avoid or terminate. Valence is a functional property.
      *   **Assessment:** This effectively bypasses phenomenal heterogeneity. Gasoline smell is pleasant for some because it functionally motivates approach/continuation for them. Valence flips indicate a functional role change. It aligns well with neuroscience (reward systems).
      *   **Weaknesses:** (i) **The Collapse Risk:** If pleasure *just is* being the object of pursuit/desire, this strongly resembles desire-satisfaction theory applied to experiences. Hedonism's distinct claim that a specific *type of state* (feelings/experiences) is the good seems lost. (ii) **The Experience Problem:** It struggles to capture the *subjective experience* of pleasure. We seem to *feel* pleasure, not just be disposed to act. A state could conceivably cause pursuit without feeling good (e.g., compulsive behavior), or feel good without strong pursuit motivation (deep contentment). Functionalism risks leaving out the very phenomenal character essential to traditional hedonist value. (iii) **Circularity?** Defining pleasure functionally often relies on notions like "reinforcement" or "reward," which themselves might be defined in terms of pleasure, raising circularity concerns.

  **The Gasoline Case: Sensory Hedonism's Awkward Moment**

  Consider the smell of gasoline. For Person A, it's intensely pleasant (a common phenomenon); for Person B, it's nauseatingly repellent. For Person C, it was once pleasant but, after a bad experience, is now repellent, even though they report the *smell itself* hasn't changed phenomenally. This case is deeply problematic for sensory hedonism:

  1.  **Same Sensation, Different Valence:** If sensory hedonism claims the pleasure *is* a component of the phenomenal experience itself, then A and B must be having different olfactory *experiences* – the hedonic tone must be integrated into the smell. But both report the same *smell quality* ("like gasoline"), differing only in whether they *like* it. Person C's report explicitly denies a change in the smell quality despite the valence flip. Sensory hedonism must either deny these reports (implausible) or posit an undetectable phenomenal component that magically attaches to or detaches from an otherwise constant smell.
  2.  **What is the Hedonic Component?:** If the smell quality is unchanged but the pleasure differs, what phenomenal residue constitutes the "hedonic tone" when it *is* present? Sensory hedonism struggles to identify any *additional* introspectible quality beyond the smell itself and the knowledge of liking/disliking it. The "work" seems done by the attitude (liking/disliking) toward the constant sensory object.

  Attitudinal hedonism and functionalism handle this case easily: A likes (takes a pro-attitude toward) the gasoline smell experience, B dislikes it, C's attitude changed. The functional role (motivation to smell/avoid) changed for C. The *object* of the attitude (the smell quale) remains constant.

  **Verdict: Hedonism Survives, But Only as Attitudinal**

  The heterogeneity problem, culminating in the collapse argument and exemplified by cases like gasoline valence, is fatal to **Sensory Hedonism**. The persistent failure to identify a common phenomenal quality across diverse pleasures, coupled with the ability of valence to dissociate from specific sensory qualities, renders the core claim of a unified hedonic tone phenomenologically indefensible. Sensory hedonism cannot surmount the second horn of the collapse argument.

  However, **Attitudinal Hedonism** survives the challenge, albeit requiring careful refinement to avoid collapsing into desire-satisfaction theory. The key revision is to **sharply distinguish the attitude of *intrinsic liking* (pleasure) from desire proper**:

  *   **Pleasure (Intrinsic Liking):** A conscious, occurrent, intrinsic pro-attitude directed at an *experience one is currently having* or a state of affairs one is currently contemplating. It is an *affective endorsement* of the present conscious state. This attitude *can* have a distinctive (though perhaps subtle) phenomenal character – the feeling *of liking* – but this feeling is the *attitude itself*, not necessarily a quality of the object. Crucially, this attitude is not defined *by* a desire to continue, nor is it reducible to motivational force.
  *   **Desire:** Primarily future-directed, involving motivation to bring about or sustain some state of affairs. One can desire something without currently liking the experience of contemplating it (e.g., desiring a painful but necessary surgery). One can *like* an experience (find it pleasant) without a strong desire to continue it (e.g., the last bite of a rich meal).

  This revised attitudinal hedonism answers the heterogeneity problem: the diverse sensory and cognitive states are the *objects* of the single, unifying attitude of intrinsic liking. It avoids the second horn by not requiring a common phenomenal quality *in the objects*. It avoids the first horn by insisting that the pro-attitude (liking) is a distinct mental state type from desire, even if they are often co-present. The intrinsic good is the *occurrence of this liking attitude* itself, directed at some present experience. The gasoline case is resolved: the smell quale is the constant object; the liking attitude varies between individuals and over time.

  **Implications for Hedonist Doctrines**

  1.  **Pleasure as the Sole Intrinsic Good:** The revised attitudinal hedonism maintains this claim. The intrinsic good is the conscious state of taking an intrinsic liking attitude toward one's present experience. The heterogeneity of the *objects* of this attitude is irrelevant to the unity of the good, which resides in the attitude itself. Well-being consists in the occurrence of these likings.
  2.  **Pleasure as the Ultimate Motivator:** The heterogeneity problem, and the attitudinal solution, bear *less directly* on this motivational claim. While pleasant experiences (construed attitudinally) are powerful motivators, the revised view explicitly decouples the attitude of liking from *necessarily* generating strong desires or pursuit motivations. One can intrinsically like an experience without being strongly motivated to continue it (contentment), and one can be motivated by desires not grounded in present liking (future-oriented desires, duty). Therefore, attitudinal hedonism *weakens* or even *severs* the necessary link between pleasure and motivation traditionally assumed by psychological hedonism. Pleasure (liking) is a good, and often a motivator, but not the *only* motivator, and not always a strong one.

  **Conclusion**

  The heterogeneity problem is not mere linguistic untidiness; it exposes a deep tension within the hedonist project of identifying a single, phenomenally unified state as the sole intrinsic good. Sensory hedonism succumbs to this tension, unable to reconcile the collapse argument with the introspective evidence of diverse pleasures and dissociable valence. However, attitudinal hedonism, rigorously distinguishing the attitude of intrinsic liking from both sensory qualities and desires, provides a viable path forward. By locating the essence of pleasure in the subject's occurrent pro-attitude toward their present conscious state, it preserves the core hedonist insight about the nature of the good while accommodating the manifest heterogeneity of what we find pleasant. The cost is a more complex psychology, where the ultimate good (liking) is no longer guaranteed to be the sole engine of action. Hedonism survives, but only by embracing the mind's capacity to take diverse experiences as objects of its affirmative regard.
