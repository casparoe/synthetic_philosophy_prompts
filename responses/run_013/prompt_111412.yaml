prompt: |-
  A government advisory panel I sit on proposes to adopt the average score on the standard international ladder question, in which people place their own lives on a ten-step scale, as our national well-being indicator, with the explicit aim of climbing the international ranking built from it. Explain the conceptual issue this raises about what such a score can and cannot mean. Distinguish three readings of it: a measure of how well people's lives are actually going; a measure of the gap between how people's lives are going and how well they expected them to go; and a measure of what people in that country take to be a normal thing to say about their lives. Say what each reading implies for a government that wants to raise the score, including whether a policy could improve people's lives while lowering it, and whether reaching the top of the ranking would be worth wanting. Assume I know the surveys; I want the conceptual structure rather than a literature review. No more than 500 words, in British English.
reasoning: |-
  Hmm, the user is on a government advisory panel considering using a ladder-scale score as a national well-being indicator with an explicit goal of climbing international rankings. They want me to explain the conceptual issues with this approach and distinguish three interpretations of what the score might represent.

  This is an interesting policy question about measurement validity and interpretation. The ladder question (probably the Cantril ladder) asks people to rate their lives on a 0-10 scale, but the score's meaning is ambiguous. I need to unpack three distinct interpretations clearly.

  For the first interpretation - as a measure of actual life quality - we'd expect policies targeting objective improvements like healthcare or education. But cultural norms might distort scores, and policies could paradoxically lower scores if they raise expectations faster than conditions improve.

  The second interpretation - as an expectation gap - suggests policies should manage expectations rather than improve lives. This creates perverse incentives where governments might benefit from lowering aspirations. Improving lives could actually decrease scores if expectations rise disproportionately.

  The third interpretation - as a cultural reporting norm - implies scores reflect what's socially acceptable to report. Policies would focus on shifting narratives, not material conditions. This interpretation makes international comparisons meaningless since scores reflect expression norms rather than lived experience.

  The ranking ambition compounds these problems. Reaching the top might mean genuine flourishing (ideal but unlikely), low expectations (problematic), or boastful culture (irrelevant). The user needs to recognize that each interpretation implies different policy paths, some ethically questionable.

