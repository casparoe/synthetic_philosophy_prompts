prompt: |-
  After thirty years in experimental physics I retired and have spent the last few years in a small philosophy discussion group; next month it falls to me to lead ninety minutes on the claim that preference is revealed by choice and that utility names nothing over and above the pattern in a person's choices. The group is eight or nine adults, mostly humanities graduates with no economics, and I have a whiteboard. Plan the session for me rather than explaining the idea to me: the order in which the components must come and why each depends on the one before it (I take it that something must be settled about choice versus inner state before consistency conditions can even be stated, and that the ordinal character of the resulting scale only becomes visible after that); the one case that should carry the whole thing, and what it must have and must not smuggle in — I had thought of a person whose choices over three options cycle, whom I then invite to pay a small sum to escape the cycle; tell me whether that is the right carrier, and what the group would need to have already accepted for it to land rather than merely amuse; the misconceptions to expect and the point in the sequence where each must be headed off, including utility as a quantity of felt satisfaction, the thought that inconsistent choices refute the theory rather than specify what the theory forbids, and my own physicist's temptation to go looking for a measurable magnitude; and the single question to put at the end that would show whether they have grasped that the content lies in restrictions on choice data rather than in any mental state — in particular whether they can see why, if preference is allowed to range over menus as well as items, almost any pattern can be rationalized, so that the empirical bite has to come from somewhere narrower. Finally, tell me what to leave out at this level and to say so explicitly; I assume the representation result itself and the aggregation of ordinal scales across persons are both beyond a first pass.
reasoning: |-
  Okay, the user is a retired experimental physicist leading a philosophy discussion group. They need a 90-minute session plan on the revealed preference theory. The group consists of humanities graduates without economics background. I need to structure the session step by step, focusing on logical dependencies between concepts.

  First, I should start by distinguishing choice from inner states. The group might conflate preference with feelings, so establishing that choice is observable while inner states aren't is crucial. This sets up why economists focus on behavior rather than psychology.

  Next, the concept of consistency needs to be introduced. Without settling the choice vs. inner state distinction, consistency conditions wouldn't make sense. I'll use simple pairwise choices to demonstrate transitivity as the core consistency requirement. The whiteboard will help visualize this.

  The cycling choices case seems perfect as the central example. A person choosing A>B, B>C, but C>A creates a cycle. Offering to pay to break the cycle demonstrates preference reversals violating consistency. But this only works if the group accepts that choices reveal preference in the moment. I need to ensure they understand each choice reflects preference at that point.

  Common misconceptions must be addressed. Utility as felt satisfaction is a big one - I'll clarify that utility here is just an ordinal label for ranking. Inconsistent choices as refuting the theory is another; I'll explain they define what the theory forbids. The physicist's temptation to quantify should be acknowledged but set aside.

  The key insight is that content lies in restrictions on choice data. I'll pose a question at the end: if preferences include menus, almost any choice can be rationalized. The group should realize this forces economists to narrow their focus to specific choice contexts.

  I'll explicitly exclude representation theorems and interpersonal utility comparisons. These are too advanced for a first session. Stating these boundaries upfront keeps the session focused.

  The session structure should flow logically: observable behavior → consistency requirements → cycling example → limitations of the theory. Each step builds on the previous one. Time management is important - 20 minutes per segment with buffer for discussion.

  The final question needs to highlight how revealed preference theory's power comes from restricting what counts as valid choice data. If they understand why economists can't allow preferences over menus without losing predictive power, they've grasped the core idea.
answer: |-
  Here's a structured 90-minute session plan focused on logical dependencies, using your cycling example as the central case, and addressing your specific concerns. The core flow is: **Observed Choice → Revealed Preference → Consistency as the Test → Ordinal Utility → Limitations & Empirical Bite.**

  **Session Structure (90 Mins Total):**

  1.  **Grounding: Choice as the Observable Primitive (15 mins)**
      *   **Why Start Here:** We need a foundation everyone agrees on *before* talking about preference or utility. What can we actually *see*? Choice is observable behavior; "preference" and "utility" are interpretations/imputations.
      *   **Activity:** Ask the group: "What does it *mean* to say someone 'prefers A to B'? How could we *know* it?" List answers on the whiteboard (e.g., "They say so," "They look happy with A," "They *choose* A when offered A or B").
      *   **Crucial Point:** Distinguish **inner state** (feeling, belief, satisfaction - private, unobservable directly) from **overt behavior** (choice - public, observable). Highlight that economics, in its *positive* (descriptive) mode, often starts with observable behavior because it's testable.
      *   **Settle This:** Conclude: "For *this* session, we'll define **'A is preferred to B'** *operationally* as: **'When offered a choice between A and B, the person chooses A.'** Preference is *revealed by* choice." Whiteboard: `Choice(A over B) → Reveals Preference(A ≻ B)`.
      *   **Head Off:** Address "Utility as Felt Satisfaction" here. Explicitly state: "We are *not* talking about a quantity of happiness or satisfaction *behind* the choice. We are *only* talking about the choice itself revealing a ranking. We'll call any numerical label we assign later 'utility,' but it's just a tool for describing the ranking revealed by choices, *not* a measure of inner joy."

  2.  **The Problem & The Core Idea: Consistency (20 mins)**
      *   **Why Now?** With preference defined *as* revealed by choice, we can ask: What does it mean for choices (and thus revealed preferences) to be "rational" or make sense? We need a testable criterion *based on the data* (choices).
      *   **Activity:** Introduce your **Cycling Choices Case** (The Core Example):
          *   *Setup:* "Imagine Sarah is offered choices, two at a time, between options: Tea (T), Coffee (C), and Hot Chocolate (H)."
          *   *Observed Choices (Revealed Preferences):*
              *   T vs C: Chooses T → Reveals T ≻ C
              *   C vs H: Chooses C → Reveals C ≻ H
              *   H vs T: Chooses H → Reveals H ≻ T
          *   *Problem:* Whiteboard the cycle: T ≻ C ≻ H ≻ T. "What do Sarah's choices tell us about her preferences? She prefers T to C, C to H, but H to T. This seems contradictory. If she has a stable ranking, one of these choices *shouldn't happen*."
      *   **Key Insight:** "The core idea of 'revealed preference' theory is that **consistent choices reveal stable underlying preferences.** Inconsistency (like this cycle) suggests there *isn't* a stable underlying preference ranking guiding *all* these choices."
      *   **Head Off:** Address "Inconsistent Choices Refute the Theory" here. Explicitly state: "The theory *isn't* saying people are always consistent! It's saying: **If we want to *model* someone as having stable, rankable preferences, then their choices *must* satisfy consistency conditions.** The cycle violates the most basic condition: **Transitivity** (If A ≻ B and B ≻ C, then A ≻ C). The theory *forbids* such cycles *if* we assume stable preferences." Whiteboard: **Consistency (Transitivity) is the Test** for the existence of a stable preference relation revealed by choices.

  3.  **The Payoff: Ordinal Utility & Escaping the Cycle (25 mins)**
      *   **Why Now?** Having established inconsistency as a problem *for the model*, we can show how consistency allows us to construct a useful representation and how inconsistency has behavioral consequences.
      *   **Activity (Part 1 - The Representation):**
          *   *Consistent Example:* Quickly contrast Sarah with "Rational Raj": T ≻ C, C ≻ H → *must* have T ≻ H. Choices reveal a clear ranking: T ≻ C ≻ H.
          *   *Utility as Label:* "To summarize Raj's revealed preferences, we can assign numbers: U(T)=3, U(C)=2, U(H)=1. Importantly: **Only the *order* matters (3>2>1).** U(T)=100, U(C)=99, U(H)=0 would be *just as good*. The magnitude of the difference (3-2 vs 2-1) is meaningless. This is an **ordinal scale**." Emphasize: These numbers only represent the *ranking* revealed by choices; they are *not* measures of intensity of feeling.
      *   **Activity (Part 2 - Escaping the Cycle - The Crucial Test):**
          *   *The Offer:* "Back to Sarah with the cycle (T≻C, C≻H, H≻T). We now offer her a small cost (say $0.10) to *avoid* a specific pairwise choice. For example: 'Sarah, you must make either the T vs C choice OR the H vs T choice later. Pay me $0.10 now, and I'll let you skip having to make the H vs T choice.'"
          *   *The Paradox:* If her choices reveal momentary preferences, she should be willing to pay to avoid a choice she expects to make "correctly" (H≻T). *But...* Why pay to avoid a choice she "prefers" to make? The very act of paying reveals she anticipates making a choice (H≻T) that *contradicts* the implications of her other choices (T≻C ≻H *should* imply T≻H, not H≻T!). Paying exposes the inconsistency as costly/uncomfortable.
          *   *Why it Lands:* This only works if the group accepts:
              1.  Choice reveals preference *at that moment* (Step 1).
              2.  The cycle is inconsistent *if* we want stable preferences (Step 2).
              3.  Paying a cost is itself a choice revealing a preference (to avoid the upcoming choice situation). This action highlights the conflict *within* the set of past/future choices.
          *   *Physicist Temptation:* Acknowledge it here: "We might want to measure the 'strength' of preference implied by how much she pays. But remember Step 1: We only observe *that* she prefers paying to facing HvsT *in this context*. Assigning cardinal meaning to the $0.10 is going beyond revealed preference at this ordinal level. It might be possible, but it requires stronger, different assumptions."
      *   **Head Off:** Reinforce **Ordinality**. "The $0.10 payment reveals a preference (avoiding HvsT ≻ facing HvsT at cost $0.10), but it doesn't tell us *how much more* she dislikes the HvsT choice compared to other things costing $0.10. Utility here is still just about orderings revealed by specific choices."

  4.  **Limitations & The Source of Empirical Bite (20 mins)**
      *   **Why Now?** Having seen the power of consistency restrictions, we need to understand their limits and what makes the theory meaningful.
      *   **Activity - The Menu Problem (Rationalizing Anything):**
          *   *Setup:* "Suppose I observe someone choose Apple (A) from {A, B}. Later, they choose Banana (B) from {A, B, C}. Is this inconsistent?"
          *   *Naive View:* "They preferred A to B first, then B to A! Inconsistent!" BUT...
          *   *The Escape Hatch:* "What if they have preferences over *menus* or the *act of choosing*? Maybe they *prefer* {A, B} *to* {A, B, C}? Choosing B from {A,B,C} reveals they prefer B *given* they are in the menu {A,B,C}. Choosing A from {A,B} reveals they prefer A *given* menu {A,B}. These are different choice contexts! If we allow preferences over anything (including menus, contexts, timing), we can 'explain' almost *any* pattern of choices by inventing the right complex preference."
          *   **The Crucial Question (Put this to the group!):** "If we allow preferences to range over absolutely anything (items, menus, contexts, the weather on choice day...), can *any* pattern of choices be 'rationalized' as revealing *some* preference? What does this mean for the empirical content (testability) of revealed preference theory?"
      *   **The Answer & Empirical Bite:** Guide them to see:
          1.  Yes, if preferences can be over *anything*, almost any choice pattern can be rationalized (*too* flexible, no testable restrictions).
          2.  **The empirical bite comes from restriction:** Economists *assume* preferences are defined **only over the final outcomes/items** (A, B, C themselves), and crucially, that the **choice context (the menu offered) doesn't change the underlying preference ranking** over those items. Preferences are assumed stable and context-independent (w.r.t. the items).
          3.  This restriction is what makes consistency conditions (like transitivity across different pairwise menus) testable and potentially falsifiable. It forces the choices in *different* menus to be logically connected. Sarah's cycle violates this restricted view. Choosing B from {A,B,C} when A was chosen from {A,B} violates it *unless* we introduce a preference for menus (which we forbid for testability).
      *   **Head Off:** Briefly note this is a *modeling assumption*. People *do* have context-dependent preferences! But the theory gains its predictive/empirical power by *assuming* they don't, allowing us to test that assumption via consistency.

  5.  **Wrap-up & Key Takeaway (10 mins)**
      *   Reiterate the logical flow: Observable Choice → Defines Revealed Preference → Requires Consistency (Transitivity) for stable preferences → Allows Ordinal Utility Representation (ranking only).
      *   Emphasize: **Utility is not a mental state quantity; it's a numerical label summarizing the *ordinal ranking* revealed by *consistent* choices under the assumption of context-independent preferences over items.**
      *   The power (and limitation) lies in the **restrictions**: Assuming preferences are (1) defined only over items, (2) stable, and (3) revealed *only* by choice, *plus* the consistency requirement, creates testable implications about observable choice behavior.
      *   **Final Thought/Question:** "Is revealed preference theory *descriptive* (how people actually choose) or *normative* (how they *should* choose to be consistent)? (Hint: It started normative but is often used descriptively/testably)."

  **What to Explicitly Leave Out (State this upfront):**

  1.  **The Representation Theorem:** Proving formally that consistent choices *imply* the existence of an ordinal utility function. (We'll assume it works if choices are consistent).
  2.  **Aggregation of Preferences (Social Choice):** Comparing or adding utilities across different people. (This session is only about modeling *one* person's choices).
  3.  **Cardinal Utility & Risk:** Assigning meaningful magnitudes to utility differences (needed for choices under uncertainty - von Neumann-Morgenstern). We're sticking to simple, deterministic choice.
  4.  **Advanced Choice Anomalies:** Framing effects, endowment effect, etc., in depth. (The Menu Problem touches on this, but we won't delve into prospect theory etc.).
  5.  **Revealed Preference Axioms (GARP):** Beyond basic transitivity for pairwise choices. (Too technical).

  **Why Your Cycling Case is Perfect:**

  *   **Concrete:** Easy to grasp with common items.
  *   **Visually Clear:** The cycle is obvious on the whiteboard.
  *   **Demonstrates Inconsistency:** Directly violates transitivity.
  *   **Allows Behavioral Test:** The payment offer powerfully demonstrates the cost of inconsistency and reinforces that preference is *defined* by choice (even the choice to pay to avoid a choice!).
  *   **Connects to Utility:** Shows why utility must be ordinal (no "strength" resolves the cycle).
  *   **Leads to Restrictions:** Highlights why we need to assume preferences are over items only and context-independent for the theory to have bite.

  **Key to Success:**

  *   **Relentlessly Link Back:** Constantly tie "preference" and "utility" back to the *observed choices* and the *consistency requirement*. "What choice reveals this?" "What would consistency require here?"
  *   **Use the Whiteboard:** Diagram the cycles, write the revealed preferences, label the ordinal utilities.
  *   **Manage Time:** Stick to the segments. Be ready to adapt discussion but keep the core flow.
  *   **Embrace the Philosophy:** Highlight the *operationalist* perspective (defining concepts by measurement/operation) and the trade-off between realism and testability (restricting preferences to items/gain testability, lose realism). Your physics background gives you great perspective here!

  This plan builds logically, uses your strong central example, targets the misconceptions you foresee, and ends with the critical insight about restrictions providing the empirical content. Good luck with the session!
