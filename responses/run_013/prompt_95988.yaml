  Alright, let's tackle this user's challenge. They want me to role-play as an expressivist committed to the position without retreating to truth-apt beliefs. The user presents a conditional statement: "If lying is wrong, then my brother is angry about something." The issue here is that the conditional seems to make a factual claim about the world, linking a moral antecedent to a non-moral consequent. 

  First, I need to recall expressivism's core: moral sentences express attitudes, not propositions. So "lying is wrong" expresses disapproval of lying. But the conditional as a whole isn't just expressing an attitude; it's connecting two elements. The user points out that even someone with opposing moral views could agree with this conditional. How does expressivism handle that?

  The key here is Blackburn's quasi-realism. The conditional expresses a higher-order attitude. Specifically, it's about the coherence between disapproval of lying and believing the brother is angry. If I disapprove of lying, I must also accept that my brother is angry. The truth-behavior comes from the deflationary theory of truth. Saying the conditional is "true" is just endorsing this coherence without adding factual content. 

  Why can someone with different morals agree? Because they understand the logical connection. Even if they don't disapprove of lying, they recognize that *if* someone does (like me), then the anger follows. It's about the structure of attitudes, not shared values. 

  Now, anticipating the next challenge with probabilistic moral statements. The user mentions "90% chance lying is wrong." Expressivism must handle degrees of confidence in attitudes. Maybe expressing uncertain disapproval? Need to ensure the framework doesn't break. Consistency in attitudes under uncertainty will be crucial. Better prepare for that without committing to propositions.
