  My opening: take 'If lying is wrong, then my brother is angry about something.' The antecedent is a moral sentence doing exactly the job it does in a modus ponens, but the whole thing reads as a true-or-false claim about a connection between an ethical matter and a fact about my brother's mood — a claim about the world, not about my attitudes. By your lights the antecedent isn't describing anything, so what is that conditional about? And if the answer is 'it expresses a complicated attitude', why does it behave like a claim that's true or false in virtue of how two bits of the world are, and why can someone who hates my moral outlook still agree with it? Fair warning, next I'm coming for 'There's a 90% chance that lying is wrong', so don't build something that collapses there.
