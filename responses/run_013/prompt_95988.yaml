  Specifically, asserting "If lying is wrong, then my brother is angry" expresses my commitment to *adjusting my attitude* about your brother's anger *based on* my attitude towards lying. It’s a rule I’m adopting for my own practical reasoning: if I hold the attitude expressed by "lying is wrong" (disapproval), I *must* also hold the attitude expressed by "my brother is angry" (belief). The "truth" of the conditional isn't about matching reality directly; it's about the *logical coherence* of my attitudes – I'm committed to not disapproving of lying while simultaneously refusing to believe your brother is angry. Someone who hates my moral outlook can still *agree* with this conditional because they understand the *logical* constraint it imposes: they recognize that *if* (hypothetically) they shared *my* disapproval of lying, *then* logic demands they accept the brother's anger too. They're acknowledging the structure of the implication, not endorsing my underlying attitude. The seeming "factual" feel comes from the disciplined, logical structure of our attitudes and the deflationary way we use "true" for such coherent commitments.

