answer: |-
  ### Fellowship Proposal: The Cost of Knowing - Disentangling the Non-Negativity of Information Value  

  #### (1) Abstract (120 words)  
  This project challenges the informal claim that "free information cannot hurt a rational agent" by rigorously disentangling the theorem underlying it (Good’s result) from its philosophical interpretations. While Good’s theorem proves that the *ex ante expected utility* of acquiring costless information is non-negative under specific assumptions, I argue that this does not license the broader platitude that information is never harmful *in situ*. I will demonstrate that the non-negativity claim conflates (i) the refinement of a fixed information partition with the expansion of the decision problem itself, and (ii) ex ante expectations with post-hoc outcomes. The deliverable—a 30-page paper—will establish that once utility depends on beliefs or the decision context shifts, non-negativity fails for *actual* welfare, revealing constraints on rational choice frameworks.  

  #### (2) The Question, Stated Precisely (400 words)  
  **The Target Claim**: "Acquiring costless information never reduces a rational agent’s welfare."  
  **Good’s Theorem**: For an agent with a *fixed* prior probability distribution, *fixed* state-independent utility function, *fixed* set of available acts, and who maximizes expected utility (EU), the ex ante EU of observing a signal (before choosing an act) is ≥ the EU of not observing it.  

  **The Contested Gap**: The theorem guarantees non-negativity only for the *ex ante expectation of EU across states*, assuming:  
  - Utility is *solely a function of states and acts* (e.g., \( u(a,s) \)), not beliefs or psychological states.  
  - Information *refines the agent’s existing partition* without altering available acts, utilities, or the decision topology.  
  - Rationality requires EU-maximization with stable priors.  

  The informal platitude, however, asserts that information cannot harm *actual welfare in real choice contexts*. This is false when:  
  (A) **Utility is belief-sensitive**: \( u(a,s,b) \) where \( b \) is a belief state (e.g., anxiety from knowing a negative prognosis lowers utility of "waiting" even if medically optimal).  
  (B) **Information alters the decision problem**: Offering information may introduce new acts (e.g., "pay to unsee") or change the salience of options (e.g., regret avoidance).  
  (C) **Partition-dependence**: Some non-EU decision rules (e.g., minimax regret) evaluate acts relative to the *information structure itself*, making "ignoring" incoherent.  

  The precise question: **Is there a coherent notion of "rational choice" under which *the welfare outcome for an agent who receives costless information* can be strictly worse than *not receiving it*, even when they choose optimally at all stages?** This separates the *ex ante expectation* (covered by Good) from *realized welfare* in belief-sensitive contexts.  

  #### (3) Why the Question is Open (500 words)  
  **Case for Non-Negativity as a Substantive Constraint**:  
  Proponents argue that any deviation implies irrationality. If information harms, the agent could precommit to ignoring it or adjust their utility function to internalize belief-dependent costs (e.g., by valuing "peace of mind" as a commodity). Resisting this is either a failure of rationality (e.g., dynamic inconsistency) or a misdescription of preferences. Good’s theorem thus reveals a core truth: rational agents *define* welfare such that more information refines achievement of ends. To deny non-negativity is to tolerate agents who "shoot themselves in the foot" despite no constraints, violating minimal instrumental rationality. Frameworks like causal decision theory reinforce this by requiring acts to be evaluated solely by consequences, not beliefs.  

  **Case for Non-Negativity as a Representational Artifact**:  
  Critics note that Good’s assumptions exclude belief-dependent welfare and partition-sensitive evaluation. When utility incorporates psychological states (e.g., regret, anxiety), information directly alters the *value* of acts independently of states. A patient avoiding a genetic test may rationally maximize welfare by preserving hope, even if an EU model labels this "irrational" due to stable \( u(a,s) \). Similarly, non-EU rules (e.g., ambiguity-averse models) may assign lower *ex post* value to acts when finer information increases perceived uncertainty. Crucially, "ignoring" is often impossible: once known, information affects counterfactual reasoning (e.g., regret if a bet loses). The theorem holds only by assuming utilities are *separable* from epistemic states and decision contexts—a substantive, not neutral, modeling choice.  

  **The Stalemate**:  
  Neither side resolves the core tension. The first reduces all harms to irrationality or preference misspecification, risking circularity (rationality = satisfying Good’s axioms). The second risks ad hoc expansions of utility. A deeper analysis must clarify whether rationality permits welfare to depend intrinsically on informational contexts or requires "purification" of utilities.  

  #### (4) Method and Plan of Work (600 words)  
  **Approach**: Instead of hunting for isolated counterexamples, I will first taxonomize distinct "values of information" (VoI), then construct partition-sensitive decision rules to test robustness. This ensures conceptual clarity and reveals structural vulnerabilities.  

  **Monthly Plan**:  
  1. **Months 1–2: Conceptual Taxonomy**  
     - Define three VoI types:  
       (i) *Instrumental VoI* (Good’s ex ante EU gain from refinement).  
       (ii) *Contextual VoI* (change in welfare due to decision-problem expansion).  
       (iii) *Realized Welfare VoI* (ex post outcome difference with/without information).  
     - Formalize "belief-sensitive utilities" (e.g., \( u(a,s,b) \)) and "partition-dependent rules" (e.g., acts evaluated relative to information structure).  

  2. **Months 3–5: Model Belief-Sensitive EU**  
     - Extend Good’s proof to \( u(a,s,b) \). Show that if \( b \) evolves with information, non-negativity fails for *realized welfare* even with optimal updating.  
     - Build cases:  
       - *The Anxious Patient*: Test result induces anxiety that directly diminishes treatment utility.  
       - *Regret-Averse Gambler*: Knowing a coin outcome pre-bet triggers regret if loss occurs.  

  3. **Months 6–8: Non-EU Rules**  
     - Analyze minimax regret, ambiguity aversion (e.g., maxmin EU), and reference-dependent models.  
     - Prove: Under finer partitions, the worst-case regret/ambiguity can increase, lowering the *ex post* value of chosen acts.  
     - Construct partition-sensitive choice: An act’s evaluation differs if information is "available but ignored" vs. "unavailable."  

  4. **Months 9–10: Normative Implications**  
     - Assess whether belief-sensitivity requires redefining rationality (e.g., as sensitivity to epistemic constraints) or if utilities can be "belief-purified" without loss.  
     - Test coherence: Can agents consistently precommit to ignoring information?  

  5. **Months 11–12: Synthesis and Paper Drafting**  
     - Identify which VoI types are non-negative under which rationality constraints.  
     - Argue that instrumental VoI is a theorem, but contextual/realized VoI are substantive claims demanding psychological realism.  

  **Why not hunt for counterexamples?** Isolated cases risk being dismissed as "irrational" or misspecified preferences. A taxonomy reveals *systematic* divergence between VoI types, showing when non-negativity reflects decision theory’s normative commitments versus its formalism.  

  #### (5) What Success and Failure Look Like (300 words)  
  **Success** is demarcating distinct VoI concepts and proving:  
  - Under belief-sensitive utilities or partition-sensitive rules, *realized welfare* can decrease with costless information.  
  - This is compatible with rationality if we reject "belief-purification" as a norm.  
  - Non-negativity holds only for instrumental VoI under narrow conditions (fixed utility, partition refinement).  

  This advances the debate by showing that Good’s theorem is insufficient to justify the platitude *unless* rationality requires state-dependent utilities and partition-insensitivity. Progress is *not* terminological: it reveals a trade-off between formalism and psychological realism in rational choice.  

  **Failure** would be if:  
  - All apparent counterexamples reduce to irrationality (e.g., inconsistent updating).  
  - Belief-sensitive utilities can be fully "purified" into state-dependent equivalents.  
  - Partition-dependence always leads to dynamic incoherence.  

  **Abandonment Condition**: If I find that *any* rational framework must treat "ignoring information" as functionally equivalent to "not having it" (e.g., via equivalence theorems), the project fails.  

  #### (6) Scope, Feasibility and Risks (200 words)  
  **Feasibility**: The 12-month scope is viable—core formal work (months 3–8) uses established techniques (dynamic choice, non-EU models). Taxonomy (months 1–2) builds on existing critiques (e.g., Schervish’s belief-dependent utilities). No new machinery is needed.  

  **Risks**:  
  - *Infinite regress*: Belief-sensitivity might always be re-described as state-dependence (e.g., "anxiety" as a state). Mitigation: Argue this misrepresents phenomenology and alters the decision problem.  
  - *Overreach*: Philosophers may reject partition-dependent rationality. Mitigation: Ground norms in instrumental success (e.g., "peace of mind" as a goal).  

  **If Overwhelmed**: Cut non-EU cases (month 6–8) to focus on belief-sensitivity in EU, which alone suffices to challenge the platitude.  

  ---  
  *This proposal disentangles a theorem from its overreach, using precision to transform a nagging objection into a constraint on rational choice.*
