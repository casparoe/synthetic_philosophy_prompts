prompt: |-
  I'm a second-year PhD student in philosophy, working mainly on formal epistemology and decision theory, and I need to turn a nagging objection into a proposal for a one-year fellowship (the deliverable would be a single paper of roughly 25–30 pages; there is no lab work, no empirical component, so everything has to be argument and formalism I can do at a desk). The objection began as a disagreement with a friend in an economics seminar, where everyone treated it as a platitude that free information cannot hurt you: if someone offers you a free look at the coin before you bet, or a free test result before you choose a treatment, you could always just ignore what you are told and act as though you had never been told it, so your situation cannot get worse. I accept the formal result behind the platitude — the one usually called Good's theorem — and I accept that it is a theorem under its own assumptions: for an agent who maximises expected utility with a fixed prior, a fixed and state-independent utility function, and a fixed set of available acts, expected utility is weakly increasing as the information partition is refined. What bothers me is that the informal gloss does no real work in the proof, and looks false as stated, because declining to use information as evidence is not the same as not having it as part of one's situation. Once the utility of an act depends on what the agent believes — the patient who would rather not know, the person who pays a premium not to find out, the agent who is stung by anticipated regret, anyone whose confidence or peace of mind enters the payoff directly — the information changes the value of the very act you were going to choose anyway, and no act of ignoring can restore the old payoff. My suspicion is that the phrase "the value of information is non-negative" is really three or four different claims that the literature has run together (about the ex ante expectation versus the outcome once you have looked; about refining a fixed partition versus enlarging the decision problem itself; about what a rational rule must permit versus what a particular representation happens to deliver), and that once they are separated, some of them turn out to be substantive constraints on any acceptable account of rational choice while others are artifacts of the expected-utility representation. I have a hunch that non-expected-utility rules, and rules whose evaluation is sensitive to the partition an agent faces, will supply counterexamples, but I have not yet built a case I am happy with, and I do not know how to state the target claim so that the question has a determinate answer rather than collapsing into terminology. That is the part I need help with. Please act as a decision theorist who works on both the formal and the philosophical side of this material, and think the problem through carefully rather than reaching for the familiar line that the theorem settles the matter. Begin with a short brainstorming section in which you lay out two or three genuinely different ways of framing the question — for instance, as a question about representation, as a question about the norms governing diachronic choice, and as a question about what we are entitled to assume about the utility function — and then choose one, saying why the others are worse. I would rather see the roads not taken than a single confident framing.

  Then write the proposal itself, addressed to a fellowship committee of philosophers and decision theorists who will not be impressed by a survey of the literature but will be impressed by a precise question and a credible plan. Use exactly these sections, in this order, at roughly these lengths: (1) "Abstract" — 120 words, stating the question and the result I expect to reach; (2) "The question, stated precisely" — about 400 words, which must include a clean statement of what exactly is being claimed to be non-negative, an explicit inventory of the assumptions under which it is a theorem, and a statement of the contested claim that is more than a restatement of the theorem; (3) "Why the question is open" — about 500 words, giving the strongest case for treating non-negativity as a substantive constraint on any acceptable account of rational choice, and the strongest case for treating it as an artifact of one particular representation, without pretending that either side has won; (4) "Method and plan of work" — about 600 words, saying what I will actually do month by month across twelve months, including the formal work, the construction of cases, and any conceptual taxonomy, and why this approach rather than the obvious alternative of simply hunting for counterexamples; (5) "What success and failure look like" — about 300 words, distinguishing a result that would count as genuine progress from one that would be merely terminological, and stating what discovery would make me abandon the project; (6) "Scope, feasibility and risks" — about 200 words, assessing honestly whether this is too much for a year and what I would cut first. Do not include a bibliography, a reading list, or any citations: refer to positions and arguments by description and I will supply the references myself. Write in continuous prose rather than bullet points, except in the plan of work, where a list is acceptable if it genuinely helps.
