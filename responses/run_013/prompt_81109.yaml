answer: |-
  Below is a complete 90-minute session plan designed around experiential learning. Students will play iterative prisoner's dilemma games to discover key insights, followed by a structured debrief. The payoff matrix (T=5, R=3, P=1, S=0) remains visible throughout.

  ---

  ### **Materials List**
  1. **Game Supplies**  
     - 8 sets of **choice cards** (each set: 10 "C" cards and 10 "D" cards per player, labeled "Player 1" or "Player 2")  
     - 8 **score sheets** (pre-printed tables: Round, P1 Move, P2 Move, P1 Points, P2 Points, Cumulative P1, Cumulative P2)  
     - 2 six-sided dice (for referees)  
     - 2 coins (for noise/error randomization in Block 4)  
     - Whiteboard markers (for recording payoffs and debrief)  

  2. **Classroom Setup**  
     - Movable desks arranged in 8 isolated pairs (prevents cross-pair communication)  
     - Whiteboard with permanent payoff grid:  
       ```
             Player 2  
           C       D  
       C  (3,3)  (0,5)  
       D  (5,0)  (1,1)  
       ```

  3. **Referee Kits** (for each of 2 rotating referees per block)  
     - Referee instructions (step-by-step rules for their block)  
     - One die and one coin  
     - Clipboard with score sheets for assigned pairs  

  ---

  ### **Session Timeline (90 Minutes)**  
  **Total Students:** 18 (8 pairs + 2 referees per block; rotate referees after each block).  

  #### **Block 1: One-Shot Game (5 min)**  
  - **Rules:**  
    - Pairs play **one round**, simultaneous choice. No communication.  
    - Each player secretly hands a "C" or "D" card to the referee.  
    - Referee records moves, scores points, and collects all cards.  
  - **Student Goal:** Maximize individual points.  
  - **Key Silence:** Do not mention "dilemma," "cooperation," or "defection."  

  #### **Block 2: Repeated Game with Uncertain End (20 min total)**  
    - **Part A: High Continuation (5/6 probability) (10 min)**  
      - After each round, referee rolls die: continues on 1–5, ends on 6.  
      - Pairs told: "After each round, there’s a high chance you’ll play again."  
    - **Part B: Low Continuation (1/3 probability) (10 min)**  
      - Continue on die roll 1–2, end on 3–6.  
      - Pairs told: "After each round, there’s a low chance you’ll play again."  
    - **Rules:**  
      - Scores accumulate across rounds.  
      - Referee rolls die publicly but conceals future rolls.  

  #### **Block 3: Finite Horizon (8 Rounds) (10 min)**  
  - **Rules:**  
    - Pairs play exactly 8 rounds. No die rolls.  
    - Told: "You will play exactly eight rounds. No more, no less."  
  - **Referee:** Tracks rounds on score sheet.  

  #### **Block 4: High Continuation with Noise (15 min)**  
  - **Rules:**  
    - Play repeats Block 2A (high continuation).  
    - **Noise twist:** Each round, referee secretly rolls die.  
      - On a 6, flip a coin to pick one player at random; flip their move (C→D or D→C) before scoring.  
      - Record flipped move on score sheet; **do not reveal the error**.  
  - **Repair Phase (5 min included):**  
    - After games end, ask pairs: "How would you fix misunderstandings?"  
    - Let 2–3 pairs share strategies; encourage testing ideas in 1–2 bonus rounds.  

  ---

  ### **Debrief (35 min)**  
  **Rule:** No jargon, citations, or names—only concepts derived from gameplay.  

  1. **One-Shot Game (5 min)**  
     - Plot student choices on the board: "How many pairs got (3,3)? (5,0)? (1,1)?"  
     - Guide realization: **Defection dominates** when no future consequences.  

  2. **Repeated Games & Continuation Threshold (10 min)**  
     - Ask pairs to report **% cooperation** for high vs. low continuation games.  
     - Derive threshold on board:  
       - *Gain from defecting now*: T – R = 5 – 3 = 2.  
       - *Cost of future punishment*: T – P = 5 – 1 = 4.  
       - *Threshold*: (T – R) / (T – P) = 2/4 = 0.5.  
     - Overlay results: High (5/6 ≈ 83% > 50%) enabled cooperation; low (1/3 ≈ 33% < 50%) collapsed it.  

  3. **Finite Horizon & Backward Induction (5 min)**  
     - Chart cooperation rates by round (e.g., "How many pairs cooperated in round 1? Round 8?").  
     - Contrast prediction ("defect immediately") with data ("cooperation unravels late").  
     - **Optional 5-min extension:** Announce a 100-round game. Students instantly grasp cooperation persists but unravels later.  

  4. **Noise and Error-Correction (10 min)**  
     - Ask: "In Block 4, did you retaliate for 'defections'? How did it feel?"  
     - Contrast **forgiveness** ("ignore defections sometimes") vs. **contrition** ("apologize after your own defection").  
     - Key insight:  
       - *Pure retaliation* fails with noise (self-destructive).  
       - *Pure forgiveness* invites exploitation.  
       - **Cooperation requires both punishment and repair**.  

  5. **Philosophical Close (5 min)**  
     - Distinguish:  
       - **Explaining cooperation**: It emerges under specific conditions (continuation > 50%, low noise).  
       - **Justifying cooperation**: Even when rational to defect, we might cooperate for moral reasons.  
     - "The game shows *how* cooperation works, not *why* it’s good—that’s where philosophy begins."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Out-of-band deals in Block 1:**  
     - **Prevention:** Physically separate pairs; use silent card submission; emphasize anonymity.  
     - **Response:** If suspected, remind: "Your partner can’t see your choice until it’s scored."  

  2. **Uneven game length in Block 2/4:**  
     - **Solution:** Referees enforce a 60-second/round timer. If a pair’s game runs long, they finish the current round but don’t start another.  

  3. **Last-round defections taken personally (Block 3):**  
     - **Pre-brief:** Frame Block 3 as "testing endgame behavior," not personal trust.  
     - **Debrief:** Normalize defection as a predictable strategy.  

  4. **Referee errors:**  
     - **Mitigation:** Simplify referee sheets; assign experienced students first; instructor circulates to assist.  

  5. **Noise-induced feuds in Block 4:**  
     - **Repair Phase:** Encourage public sharing of "fixes" (e.g., "We cooperated twice to signal restart").  

  ---

  ### **What the Activity Cannot Reproduce**  
  **You must explicitly teach:**  
  - Real-world interactions lack **known probabilities** (e.g., δ = 5/6). Players estimate continuation subjectively.  
  - **Noise in human communication** is richer than random flips (e.g., ambiguous actions, cultural signals).  
  - **Moral motivations** exist beyond payoffs. The game explains *instrumental* cooperation, not altruism.  

  ---

  This design ensures students experience the fragility of cooperation through play, setting up a debrief that transitions smoothly from game theory to philosophical inquiry. Adjust timing as needed based on group engagement.
