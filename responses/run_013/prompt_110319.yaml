  ### Game Design: "Trust & Testimony"

  #### Core Concept
  This game creates two rounds mimicking an epistemic bubble (Round 1) and an echo chamber (Round 2). Participants experience how **missing evidence** (bubble) vs. **discounting evidence** (echo chamber) leads to the same false belief, but with divergent remedies. The trust mechanism is endogenous—participants *generate* the discounting through a credibility system.

  ---

  ### Game Setup
  - **Participants**: 24 adults, split into **Group A** (12) and **Group B** (12).  
  - **Materials**:  
    - Whiteboard (for credibility scores and conclusions).  
    - Index cards (for clues and individual reflections).  
    - Pens.  
  - **Setup**: Arrange chairs into two circles (Group A and Group B) facing each other.  

  ---

  ### Rules and Mechanics
  #### **Round 1: Epistemic Bubble (25 min)**  
  **Objective**: Solve "Who stole the museum artifact?"  
  - **Clue Distribution** (Missing Evidence):  
    - *Group A* gets Clue Set A (points to **Sarah**):  
      - "Security log: Sarah scanned into the artifact room at 9:45 PM."  
      - "Sarah recently donated $1M to the museum."  
      - "A glove found at the scene fits Sarah."  
    - *Group B* gets Clue Set B (points to **Alex**):  
      - "Alex was fired by the museum director last week."  
      - "Footprints match Alex’s rare shoe size (14)."  
      - "Alex was seen arguing with security at 9:30 PM."  
  - **Procedure**:  
    1. Groups discuss clues separately (5 min).  
    2. Groups present conclusions to each other (2 min each).  
    3. Open debate (5 min).  
    4. Groups finalize answers: "Who stole it? (Sarah/Alex/Both/Neither)".  
  - **Reveal Truth**: The director stole it (neither Sarah nor Alex). Groups lack the critical clue: "Director’s alibi was falsified."  

  #### **Round 2: Echo Chamber (45 min)**  
  **Objective**: Solve "Who hacked the company database?"  
  - **Trust Mechanism**:  
    - Each group has a **Credibility Ledger** on the whiteboard (initial score: 5/10 for all).  
    - Groups earn/lose points by:  
      - **Coherence Bonus**: +1 for each clue that aligns with their theory.  
      - **Citation Tax**: -1 if they cite a clue from the other group.  
  - **Clue Distribution** (All Evidence Present):  
    - *Both groups get identical clues*:  
      - "Logs show login from [CEO's] home IP at 2 AM."  
      - "IT intern (Jamie) accessed the server room unsupervised."  
      - "CFO resigned abruptly yesterday."  
      - **Critical Flaw**: "CEO's alibi: Security footage shows CEO at home at 2 AM (timestamp blurry)."  
  - **Manipulation**:  
    - Facilitator subtly primes Group A: "Prior studies show groups with high coherence solve faster."  
    - Group B is primed: "Overconfidence causes errors; scrutinize everything."  
  - **Procedure**:  
    1. Groups discuss clues (10 min), updating Credibility Ledger based on coherence/citation.  
    2. Groups present theories (2 min each).  
    3. Open debate (5 min).  
    4. **Individual Reflection**: All write privately:  
       - "My current belief: ______ hacked it."  
       - "What would change my mind? ______"  
       - "Other group’s competence: 1 (low) to 10 (high)."  
    5. Groups finalize answers.  
  - **Reveal Truth**: Jamie hacked it (CEO’s alibi was flawed; timestamp was doctored).  

  ---

  ### Minute-by-Minute Timeline  
  | Time  | Activity |  
  |-------|----------|  
  | 0-5   | Introduce game, split groups, explain Round 1. |  
  | 5-10  | **Round 1 Group Work**: Groups discuss clues. |  
  | 10-15 | **Round 1 Presentations**: Groups share conclusions. |  
  | 15-20 | **Round 1 Debate**: Open discussion. |  
  | 20-25 | **Round 1 Final Answers & Reveal**: Truth = director. |  
  | 25-30 | Introduce Round 2 rules, Credibility Ledger, clues. |  
  | 30-40 | **Round 2 Group Work**: Groups discuss, update ledger. |  
  | 40-45 | **Round 2 Presentations**: Groups share theories. |  
  | 45-50 | **Round 2 Debate**: Open discussion. |  
  | 50-55 | **Individual Reflection**: Write beliefs/competence. |  
  | 55-60 | **Round 2 Final Answers & Reveal**: Truth = Jamie. |  
  | 60-90 | **Debrief** (see below). |  

  ---

  ### Debrief Structure (30 min)  
  1. **Contrast Rounds 1 and 2** (5 min):  
     - Round 1: "You lacked evidence (bubble). Truth emerged when clues combined."  
     - Round 2: "All evidence was present, yet discounting occurred (echo chamber)."  

  2. **Analyze Trust Mechanisms** (10 min):  
     - Show Credibility Ledger:  
       - *Group A*: High scores from coherence (ignored Group B’s clues).  
       - *Group B*: Lower scores from citation tax (penalized for engaging).  
     - Highlight reflection cards:  
       - "Group A rated Group B’s competence low (avg. 3/10)."  
       - "Group B rated Group A’s competence high (avg. 7/10)."  
     - Key Point: Trust was relocated *before* evidence was evaluated ("routed around").  

  3. **Gap Analysis** (10 min):  
     - Critical flaw: "CEO’s alibi was weak (blurry timestamp). Reasonable to mildly distrust it."  
     - Reality: Groups discounted *all* evidence from the other side.  
     - Show written cards: "Many said, ‘I’d change my mind with video proof,’ but ignored IP/logs."  

  4. **Map to Real World** (5 min):  
     - Bubble: Fix by adding evidence (e.g., invite diverse voices).  
     - Echo Chamber: Evidence fails because trust is broken (e.g., "media bias" labels).  
     - Stress: "You weren’t gullible/stubborn—you rationally followed incentives. Real echo chambers form slowly this way."  

  ---

  ### Predictable Problems & Salvage  
  1. **Problem**: Groups share clues freely in Round 2, bypassing discounting.  
     - **Salvage**: Enforce "Citation Tax" strictly. Remind: "Coherence gains points; citation loses them."  

  2. **Problem**: Groups solve Round 2 correctly (e.g., spot the timestamp flaw).  
     - **Salvage**: Use reflection cards to show *attitudes*: "You believed Jamie, but still rated the other group poorly. Why?"  

  3. **Problem**: One group dominates debate.  
     - **Salvage**: In Round 2, cap speaking time (1 min/person).  

  ---

  ### What This *Cannot* Reproduce  
  - **Slow Accretion**: Real echo chambers form over years; this compresses it into incentives.  
  - **Lived Experience**: Participants know it’s a game. Real echo chambers involve identity/emotion.  
  - **Complex Evidence**: Real-world evidence is messier than curated clues.  

  ### What *You* Must Supply  
  - **Narrative Framing**: Explain post-game how trust relocation happens IRL (e.g., leaders discrediting sources).  
  - **Emphasis on Modesty**: Stress that the "flaw" (e.g., blurry timestamp) warrants *mild* skepticism, not total dismissal.  
  - **Safety**: Pre-empt defensiveness: "This isn’t about stupidity—it’s about how systems shape trust."  

  ---

  ### Why This Works  
  - **Endogenous Discounting**: The Credibility Ledger forces groups to *self-generate* bias.  
  - **Physical Presence**: Groups see each other ignore evidence.  
  - **No Villains**: The "flawed alibi" makes discounting feel reasonable.  
  - **Aha Moment**: Reflection cards reveal the gap between "rational" self-perception and actual behavior.  

  Run this, and they won’t just *understand* the distinction—they’ll *feel* it.
