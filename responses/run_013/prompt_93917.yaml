prompt: |-
  Right, I need a joke, and I need it to be a good one. You're going to be a philosopher who moonlights as a stand-up comic — so before you write anything, put on the philosopher's hat and jot down what's actually, structurally funny about expected value fanaticism, then swap to the comedian's hat and write the joke. Think carefully, this is trickier than it looks.

  The thing I want the joke to be about: the view (call it fanaticism) that you should maximise expected value come what may. Its signature consequence is that for any sure thing on offer, however good, there's some lottery with a small enough chance of a big enough payoff that the lottery beats the sure thing — so the fanatic always ends up buying the lottery ticket instead of taking the guaranteed prize. The standard objection is paralysis: there's always a better lottery ticket somewhere out there, so you never get round to doing anything at all. And the standard fix is to bound your value function, or to order outcomes lexically, so that some goods simply aren't up for trade — except then you get the mirror-image absurdity, where there's some sure enormous good you'd have to turn down.

  Here's the seed I want you to actually build on rather than wandering off: two flatmates in some mundane domestic standoff — a kitchen, a queue, a car, your call — one of them a committed fanatic and the other a sensible sort who's bounded their utility function. The whole thing should hang on the fanatic's refusal to treat some sure decent thing as worth more than a vanishing chance of something absurdly better. But let the bounded flatmate land a blow too, and by the end make the bounded one's position look just as daft as the fanatic's. I want both of them to be recognisably right about something.

  Rules: the punchline has to turn on the actual content — the tiny-probability-times-enormous-value trade, the paralysis, or the bounded-value catch — not on the word 'utility' or on someone being a nerd. Someone who's read about Pascal's mugging should genuinely laugh; someone who hasn't should at least follow it and not think I've got the theory wrong. Don't lean on any names or papers. Give me two versions, then say in a sentence or two which one works and why the punchline lands.

  Write it in British English, ta.
