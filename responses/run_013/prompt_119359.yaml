  Hmm, this user presents a sophisticated philosophical analysis of military responsibility norms. They're clearly well-versed in ethics of autonomous weapons, legal theory, and moral philosophy - probably an academic or policy expert working on AI ethics. The query shows deep engagement with three key concepts: meaningful human control (MHC), command responsibility, and corporate liability.

  The core puzzle here is about reconciling seemingly contradictory practices: MHC requires direct human control for responsibility attribution, while command responsibility holds leaders accountable for distant actions, and corporate liability distributes blame across organizations. The user wants me to excavate the unstated theory of responsibility behind MHC.

  Let me break this down systematically. First, MHC's defenses suggest two philosophical foundations: the "metaphysical defense" (machines can't bear responsibility) and the "pragmatic defense" (avoiding responsibility gaps). But both seem shaky when compared to other legal practices.

  Command responsibility is particularly interesting - it violates strict control conditions by holding commanders liable for atrocities they didn't directly order or even know about. Corporate personhood is equally challenging, treating organizations as single responsible entities despite lacking consciousness. These practices point toward more distributed concepts of responsibility.

  The implicit theory behind MHC appears to be individualist and control-based: responsibility requires both causal control and epistemic access. But this creates tension with the other two practices. Command responsibility relies on normative control (duties to prevent/punish), while corporate liability uses functionalist attribution (assigning blame based on organizational structure).

  Where MHC seems most defensible is in its demand for answerability - the need for some human who can explain decisions. This aligns with legal systems' preference for identifiable accountable agents. Still, the corporate liability analogy suggests organizations too can be "called to account" through representatives.

  The user's deeper concern might be whether current responsibility frameworks can handle autonomous systems. If we adopted systemic responsibility models, MHC would need radical rethinking - perhaps shifting from direct control to ensuring robust organizational oversight structures. But this risks creating precisely the responsibility gaps MHC aims to prevent.

  Notably, MHC doesn't strictly require either defense. The pragmatic avoidance of responsibility gaps is sufficient justification on its own, making the metaphysical claims about machines optional. This reveals MHC as primarily a legal safety mechanism rather than a deep philosophical position.
answer: |-
  The meaningful human control (MHC) requirement presupposes a **causal-individualist theory of responsibility** centered on direct agency and answerability. Here's a precise reconstruction:

  ### Implicit Theory of Responsibility
  1. **Control Condition**: Responsibility requires *direct, immediate causal control* over the specific harmful action.  
     - *Manifest in MHC*: Humans must authorize/veto each use of force or be able to intervene.  
     - *Implied Logic*: Responsibility is nullified if causal chains are mediated by complex systems beyond real-time oversight.

  2. **Answerability Condition**: Responsibility must attach to an entity capable of *giving reasons, accepting blame, and being punished*.  
     - *Manifest in MHC*: Machines lack moral agency; only humans can "answer" for actions.  
     - *Implied Logic*: Blameworthiness requires a conscious mind to hold accountable.

  3. **Individualism**: Responsibility cannot be distributed across systems; it must reside in *specific human agents*.  
     - *Manifest in MHC*: Rejects responsibility gaps by ensuring a human "terminus" in the decision chain.  

  ### Tensions with Other Practices
  | **Practice**               | **Contradiction with MHC's Theory**                          |  
  |----------------------------|-------------------------------------------------------------|  
  | **Command Responsibility** | Violates the *control condition*: Liability without direct causation or knowledge. |  
  | **Corporate Liability**    | Violates *individualism*: Responsibility distributed across organizations, not specific minds. |  

  ### Underdetermined Aspects
  MHC is compatible with multiple theories if we focus on outcomes rather than foundations:  
  - **Tracing Condition**: MHC ensures a culpable human origin (fits defense #2).  
  - **Agency Theory**: Only entities with intentions can be responsible (fits defense #1).  
  - **Pragmatism**: Avoiding responsibility gaps is a policy priority, regardless of metaphysics.  

  ### Which Defense Does MHC Need?
  - **Defense #2 (Responsibility Gap)** is essential: MHC’s core function is ensuring blame can be assigned.  
  - **Defense #1 (Machine Non-Responsibility)** is supplementary: Useful but not strictly necessary if gaps are avoided.  

  ### Internal Consistency?  
  **No.** MHC’s theory conflicts with command/corporate practices:  
  - Command responsibility relies on *normative control* (duties to prevent/punish), not causal control.  
  - Corporate liability treats responsibility as *functional* (assigned to entities that can bear costs), not metaphysical.  
  → MHC implicitly rejects these models, creating inconsistency in the legal system.

  ### Implications of Alternative Theories  
  If we adopt:  
  1. **Distributed Responsibility** (e.g., organizational or systemic models):  
     - MHC becomes obsolete. Design focus shifts to *procedural safeguards*, not human intervention.  
     - Liability could attach to institutions (e.g., "The AI Division failed to audit algorithms").  

  2. **Accepting Responsibility Gaps**:  
     - MHC is abandoned. Society tolerates "no-fault" harms from complex systems (like natural disasters).  
     - Compensation replaces blame (e.g., victim funds).  

  ### Conclusion
  The MHC requirement rests on a **control-and-answerability theory** that is **individuated and causal**. This conflicts with command responsibility (normative duties) and corporate liability (collective agency). While defensible pragmatically to prevent gaps, it is philosophically inconsistent with broader legal practices. Adopting alternative theories would necessitate dismantling MHC in favor of systemic accountability or no-fault frameworks—fundamentally altering military ethics and international law.  

  *Key Insight*: MHC’s purpose is less about *moral truth* and more about *institutional risk management*—ensuring every harmful act has a human scapegoat. Its tension with other practices reveals unresolved fractures in how law conceptualizes agency in complex systems.
