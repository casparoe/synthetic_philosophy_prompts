answer: |-
  ## Joint Statement on Neural Network Representations  
  *Issued by Adversarial Collaboration Between Realist and Deflationist Frameworks*

  ### Preamble  
  After sustained good-faith deliberation, we identify substantial common ground alongside persistent empirical disagreements. We distinguish three grades of commitment:  
  - **(i) Informational**: Internal states correlate with behaviorally relevant distinctions and support output predictions.  
  - **(ii) Structural**: Activation space admits a *canonical* decomposition into features (unique up to behavior-preserving transformations) over which computation factorizes.  
  - **(iii) Semantic**: Internal states bear content about the world (e.g., reference, truth-conditions), not merely causal roles.  

  We agree that **(i)** is uncontroversial and **(iii)** involves terminological divergence. The core dispute resides at **(ii)**.  

  ---

  ### 1. Agreed Claims  
  Both camps endorse the following without reservation:  
  1. Trained networks implement functions mapping inputs to outputs, and internal activations carry information about behaviorally relevant input properties.  
  2. Interpretability methods (e.g., probing, dictionary learning, activation editing) can construct *human-useful descriptions* of network internals that predict outputs on held-out data.  
  3. Different methods may yield divergent feature descriptions due to differing assumptions (e.g., sparsity penalties, probe architectures).  
  4. Networks exhibit invariance to certain re-parameterizations (e.g., invertible linear transforms) that preserve input-output behavior.  
  5. Feature interpretations induced by analysts are not arbitrary; they are constrained by the network’s input-output function and architecture.  
  6. Interventions on activations (e.g., ablation, steering) alter network outputs, demonstrating causal relevance of activation subspaces.  

  ---

  ### 2. Table of Residual Disagreements  
  | Disagreement                                                                 | Realist Position                                                                                                  | Deflationist Position                                                                                                  | Terminological? |  
  |------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|-----------------|  
  | **Canonical decomposition**                                                  | The network’s computation factorizes over a unique (up to gauge) set of features; methods approximate this ground truth. | "Features" are useful fictions for describing the network’s function; no unique decomposition exists absent analyst choices. | No              |  
  | **Overcompleteness & interference**                                          | Non-orthogonal features exist and interfere; this reflects resource-constrained representation.                   | Apparent interference arises from mismatched analyst models; the network implements a function without intrinsic features. | No              |  
  | **Dictionary non-uniqueness**                                                | Reconstruction equivalence classes are gauge freedoms; the *role* of features (e.g., load-bearing) is invariant.  | Equivalence proves no decomposition is privileged; "gauge freedom" smuggles in realist assumptions.                   | Partially       |  
  | **Robustness across seeds/widths**                                           | Robustly recurring features across training runs indicate discovery of intrinsic structure.                      | Robustness reflects functional requirements of the task, not ontology; it validates utility, not reality.             | No              |  
  | **Counterfactual content**                                                   | Fixed computation graph defines counterfactual behaviors; features have determinate "what if" properties.         | Counterfactuals depend on intervention granularity; no unique level of description defines "the" computation.         | Yes             |  

  ---

  ### 3. Cruxes, Tests, and Predictions  
  **Crux 1: Compositionality of Feature Interventions**  
  - **Sub-question**: When intervening on *multiple* purported features simultaneously, do output changes combine linearly (additively) or nonlinearly (with dominant interactions)?  
  - **Test**: Train probes/dictionaries for features {A,B} on a model. Define interventions altering A or B individually and jointly. Measure whether *Δ_output(A+B) ≈ Δ_output(A) + Δ_output(B)* under standardized metrics. Behavioral equivalence = output distributions indistinguishable on test sets. "Same feature" = direction identifiably reused across layers/tasks.  
  - **Realist Prediction**: Interactions are small (<10% variance) for features at the "right" level of abstraction; linear composition holds.  
  - **Deflationist Prediction**: Interactions dominate (>40% variance); composition is nonlinear and context-dependent.  

  **Crux 2: Load-Bearing vs. Informational Directions**  
  - **Sub-question**: Do directions with high probe accuracy substantially contribute to the network’s output computation?  
  - **Test**: For a high-accuracy probe direction **d**, compare (a) probe accuracy, (b) output change when **d** is ablated, and (c) output change when a random direction with *identical* probe accuracy is ablated. "Substantial contribution" = ablation degrades task performance >2× more than random equally-informative direction.  
  - **Realist Prediction**: High-accuracy directions are load-bearing; ablation effects correlate strongly (r > 0.8) with probe accuracy.  
  - **Deflationist Prediction**: Probe accuracy poorly predicts load-bearing; ablation effects uncorrelated (r < 0.3) with probe accuracy.  

  **Crux 3: Feature Conservation Across Architectures**  
  - **Sub-question**: When two architectures (e.g., CNN vs. Transformer) solve the same task equally, do they converge on isomorphic feature sets?  
  - **Test**: Train models M1 (e.g., ResNet) and M2 (e.g., ViT) to equal accuracy on task T. Extract "features" via dictionary learning. Test if linear maps exist between M1/M2 feature spaces that preserve (a) reconstruction, (b) intervention effects. Isomorphism = bidirectional map with >90% fidelity in output prediction under cross-model interventions.  
  - **Realist Prediction**: Architectures converge to functionally isomorphic features; maps achieve >85% fidelity.  
  - **Deflationist Prediction**: Features are architecture-bound; maps fail (<50% fidelity).  

  ---

  ### 4. Falsifiability Conditions  
  - **Realists** would reconsider their position if:  
    - No feature set exhibits consistent compositionality *and* intervention robustness across tasks (Crux 1 failure).  
    - "Features" from one model cannot predict intervention outcomes in another functionally identical model (Crux 3 failure).  
  - **Deflationists** would reconsider their position if:  
    - A unique decomposition (up to gauge) is found that predicts *all possible* intervention outcomes across architectures (Crux 3 success).  
    - Load-bearing consistently aligns with probe accuracy across random seeds and tasks (Crux 2 success).  

  ---

  ### 5. Meta-Conclusion  
  We agree that **Crux 1** (compositionality) is the most decisive test. A strong result (>90% additive composition or >50% interactions) would materially advance the debate. **Crux 2** (load-bearing) may resolve terminological disputes about "relevance." **Crux 3** (isomorphism) risks conflation with implementation details.  

  We further concur that **counterfactual content** is defined only relative to an intervention protocol. Thus, while the network’s input-output function is fixed (agreed), its decomposition into features depends on the chosen granularity of description. This suggests the debate centers on whether a *natural* granularity exists (realists) or whether all decompositions are pragmatically imposed (deflationists).  

  ---  
  *Signatories:*  
  **Realist Framework Advocates**  
  **Deflationist Framework Advocates**  
  *Date: [Date of Adversarial Collaboration Conclusion]*
