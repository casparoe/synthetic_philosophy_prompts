prompt: |-
  A friend of mine scores old forecasts as a hobby — she keeps a spreadsheet and posts her verdicts every so often. So far: Malthus, 'right but early' (the population/food squeeze was a real constraint, it only got lifted by stuff he had no way of seeing coming, and the framework he built even predicts the way out); Ehrlich's famine forecasts, 'falsified', on the grounds that the deadline just kept sliding and his escape hatch — that it would all have happened anyway without the Green Revolution — can't be tested; Hubbert's peak oil, 'right but early' for the US, still open globally; the prediction that capitalism would drive workers' real wages down and keep them there, 'falsified'; and the 1980s warnings that we were wrecking the ozone layer, 'not falsified', since the reason it looks like a false alarm is that everyone believed it and stopped using CFCs.

  Now she's got a new one to score. A food policy group said in 2011 that by 2022 world wheat yields would come in about 8% below their 2010 level, because of salinisation and groundwater depletion. 2022: yields up roughly 15%. Their line is that the salinisation and aquifer numbers were basically right, they just underestimated how fast farmers would move to drip irrigation and salt-tolerant seed; they've reworked the model and it now says the Indus and Nile deltas lose about 6% of yields by 2035. And the 2011 report is generally credited with kicking off the drip-irrigation subsidy programmes in three countries, so part of why the original call failed is that people read it and did something about it.

  What's she going to call this one? I'm less interested in the label than in the rules she's actually running: I want the ones that fit all her earlier calls, what each of them predicts here, which you'd put your money on and why, and the sort of case that would split those rules apart if you could feed her one.
reasoning: |-
  Hmm, the user describes their friend's system for scoring forecasts and wants to apply it to a new case about wheat yield predictions. Let me unpack this carefully.

  The friend has established clear patterns in her scoring methodology: "right but early" for predictions that identified correct mechanisms but missed timing (Malthus, Hubbert), "falsified" for those that failed empirically without testable caveats (Ehrlich, Marx), and "not falsified" for warnings that triggered preventive action (ozone layer). 

  The new case presents an interesting dilemma - the 2011 wheat yield prediction was empirically wrong (15% increase vs predicted 8% decrease), but the underlying mechanisms (salinization, aquifer depletion) were validated, and the prediction itself catalyzed mitigation efforts (drip irrigation subsidies, new seeds). This creates tension between different scoring dimensions: empirical accuracy vs mechanistic validity vs reflexive impact.

  The user's deeper request seems to be about reverse-engineering the friend's decision rules. Three scoring approaches emerge:
  1) Outcome-focused: Strict falsification based on actual yield data
  2) Mechanism-focused: "Right but early" given the validated drivers
  3) Reflexivity-focused: "Not falsified" since the warning served its purpose

  The friend's history suggests she prioritizes mechanism validity over simple empiricism (as with Malthus), but draws the line at unfalsifiable excuses (Ehrlich). The ozone case precedent is particularly relevant - like CFC regulations, the irrigation subsidies here demonstrate how valid warnings can make themselves "wrong" by inspiring solutions.

  Key distinctions matter: Unlike Ehrlich's sliding deadlines, the 2011 report specified a clear timeframe. Unlike Malthus, the mitigation occurred within the causal chain (farmers adapting), not via external shocks. This likely tips toward "not falsified" using the ozone precedent.

  To test these rules, imagine a counterfactual where yields rose despite no policy response - that would force choosing between mechanism validity ("right but early") and pure falsification. But given actual events, the reflexive effect aligns perfectly with the ozone case logic.
answer: |-
  Based on your friend's established scoring rules and precedents, here's the most likely verdict, the underlying rules, and how they apply:

  **Most Likely Verdict: "Not Falsified"**

  **Why & How the Rules Apply:**

  1.  **The Core Principle: Reflexivity & Self-Prevention:** This is the *strongest* parallel to the ozone layer case. The friend explicitly scored the ozone warnings as "not falsified" *because* the dire prediction spurred action that prevented the bad outcome. The key factor isn't just that action happened, but that **the prediction itself was the catalyst for the action** that rendered it inaccurate.
  2.  **Applying the Ozone Precedent:**
      *   **2011 Report:** Predicted yield decline due to salinization/depletion.
      *   **Action Triggered:** The report is credited with kicking off drip-irrigation subsidy programs (a direct mitigation effort).
      *   **Outcome Prevented:** The predicted yield decline didn't happen; yields increased. The report explicitly states the mitigation efforts (drip irrigation, salt-tolerant seeds) are why their original prediction failed.
      *   **Conclusion:** This fits the ozone template perfectly. The warning worked as intended by prompting solutions, making the specific numerical prediction "wrong" only because the warning was heeded.

  3.  **Distinguishing from "Right but Early" and "Falsified":**
      *   **"Right but Early" (Malthus, Hubbert-US):** This applies when the *core mechanism* was valid but *timing* was wrong due to unforeseen technological/social shifts *external to the prediction's influence*. Here, the core mechanism (salinization/depletion pressure) *was* valid, but the shift (adoption of drip/salt-tolerant seeds) *wasn't* unforeseen or external. It was *directly caused* by the prediction itself. The timing wasn't just off; the outcome was fundamentally altered by the prediction's success in prompting action.
      *   **"Falsified" (Ehrlich, Marx):** This applies when:
          *   The *core prediction* demonstrably didn't happen within the stated timeframe (Ehrlich's famines).
          *   The offered excuses are *untestable* or *shift the goalposts* without acknowledging the core failure (Ehrlich's "it would have happened without the Green Revolution").
          *   The *core mechanism* driving the prediction is shown to be flawed or incomplete in a way that invalidates the prediction (Marx's wage prediction).
      *   **Why it's NOT "Falsified":** While the specific numerical prediction failed, the core mechanisms *weren't* falsified (salinization/depletion pressures were real). Crucially, the reason for the failure *is testable and acknowledged*: the mitigation efforts prompted by the report worked. They aren't making an untestable excuse; they point to concrete actions taken *because of their report*. This aligns with the ozone logic, not Ehrlich's untestable "without the Green Revolution" caveat.

  4.  **The Underlying Rules (Synthesized):**
      *   **Rule 1 (Empirical Falsification):** Did the predicted event demonstrably *not* happen within the stated timeframe? (Yes - yields up 15%, not down 8%).
      *   **Rule 2 (Mechanism Validity):** Was the core causal mechanism driving the prediction valid? (Yes - salinization/depletion were real pressures).
      *   **Rule 3 (Excuse Testability):** If the prediction failed, is the reason given testable and non-tautological? Or is it an untestable "heads I win, tails you lose" argument? (Here: Testable - adoption rates of drip/salt-tolerant seeds and impact of subsidy programs *can* be measured).
      *   **Rule 4 (Reflexivity/Impact):** Was the prediction itself a significant causal factor in preventing the predicted outcome? (Yes - credited with kicking off key mitigation programs).
      *   **Scoring Matrix (Implied):**
          *   Fail Rule 1 + Fail Rule 2 = **Falsified** (Core mechanism wrong, prediction wrong).
          *   Fail Rule 1 + Pass Rule 2 + Fail Rule 3 = **Falsified** (Core mechanism *might* be ok, but excuse is untestable/shifting goalposts - Ehrlich).
          *   Fail Rule 1 + Pass Rule 2 + Pass Rule 3 + Fail Rule 4 = **Right but Early** (Core mechanism valid, failure due to unforeseen developments *external* to prediction's influence - Malthus, Hubbert).
          *   Fail Rule 1 + Pass Rule 2 + Pass Rule 3 + Pass Rule 4 = **Not Falsified** (Prediction served its warning function, prompting action that prevented the outcome - Ozone, and now Wheat).

  **The Case That Would Split These Rules:**

  Imagine a scenario for the wheat prediction that tests the boundary between "Not Falsified" and "Right but Early":

  *   **The Scenario:** The 2011 prediction is made. Yields in 2022 are up 15%, *not* down 8%. The core mechanisms (salinization/depletion) are confirmed as valid pressures. However, the surge in drip irrigation and salt-tolerant seeds is proven to be driven *entirely* by:
      *   A massive, unrelated technological breakthrough in solar-powered desalination that dramatically lowered the cost of drip systems in 2015, or
      *   A separate, devastating drought in a major region around 2014 that *independently* terrified farmers and governments into adopting these technologies aggressively.
      *   Crucially, evidence shows the *2011 report itself had negligible influence* on policy or farmer behavior; the mitigation happened for completely different reasons.

  *   **Why it Splits the Rules:**
      *   **Rule 1:** Fail (Prediction wrong).
      *   **Rule 2:** Pass (Mechanism valid).
      *   **Rule 3:** Pass (The reason - technological breakthrough/unrelated crisis driving adoption - is testable).
      *   **Rule 4:** **Fail** (The prediction itself did *not* cause the mitigation).
      *   **Conflict:** This now perfectly fits the "Right but Early" template (Malthus, Hubbert). The core problem was real, the prediction failed because unforeseen developments provided an escape route, but the prediction itself didn't *cause* that escape route. It would *not* fit "Not Falsified" because Rule 4 fails.

  **Putting Your Money Where the Rules Are:**

  Based on the established patterns, especially the clear precedent of the ozone case scoring, I would confidently bet on "Not Falsified" for the wheat prediction. The alignment of the core mechanism being validated, the specific and testable reason for the prediction's failure (mitigation efforts), and crucially, the *direct attribution of those mitigation efforts to the influence of the report itself*, mirrors the ozone logic exactly. The "Right but Early" label doesn't fit because the mitigation wasn't an unforeseen external development; it was the intended and achieved consequence of the warning.
