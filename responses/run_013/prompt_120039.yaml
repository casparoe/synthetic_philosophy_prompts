prompt: |-
  Act as a philosopher of law who knows the free-speech literature cold — Mill, the harm principle, all the usual fights about when speech can be restricted — but who's also willing to reason from the structure of a practice instead of reciting positions.

  Here's something that's been bugging me and I can't get it to sit still. Take two things you can publish about a person.

  (1) You publish a damaging falsehood about someone — say you report that a local businessman embezzled from a charity, and it isn't true. That's defamation, he can sue, and if he wins he gets money. But almost no court will stop you from publishing it in the first place. Courts in the common-law world are famously unwilling to enjoin a defamatory publication; the remedy is damages afterwards, not an order beforehand. The lie goes out, and the correction comes later and costs money.

  (2) You publish something true that the person wanted kept private and that isn't genuinely of public concern — a medical condition, a sexual history, the contents of a confidential conversation. Same act type, a publication that wrecks someone's life, except now what you said is true, and here the law is much more willing to act, including beforehand: injunctions against publishing private information are routine in some jurisdictions, and the whole tort (or tort-equivalent) exists precisely for true disclosures. Meanwhile, if you say the same damaging thing about the same person and it happens to be true, defamation gives him nothing at all — truth is a complete defense, so a true statement that destroys his reputation isn't actionable, full stop.

  So: lies about someone are protected going forward but compensable afterwards; truths about someone can be stopped before they ever appear, but only if they're private; and truths that damage someone's reputation without invading privacy are just... fine. The law seems to care more about a secret than about a reputation, and it's more willing to silence the truth than the lie.

  I'm fairly sure this isn't what Mill's harm principle would predict. If harm is the trigger, both cases look like harm, and truth looks irrelevant — Mill's position is that we put up with false and pernicious speech because open contestation, not suppression, is supposed to be how error gets corrected. So either the practice is inconsistent with the harm principle, or it's resting on something else entirely.

  What I want from you: don't just tell me what the doctrine is. I know the doctrine roughly, and please don't give me citations, case names, or a reading list — I can't look anything up right now anyway, so anything you'd have to look up is no use to me. Tell me what theory of the person, of reputation, and of information the practice only makes sense under. In particular:

  - Does it presuppose that reputation is only worth protecting insofar as it's accurate — that you have no claim on other people's good opinion, only on not being misrepresented? If so, is that a coherent view, or does it just relocate the harm somewhere less visible?
  - Does the injunction asymmetry presuppose that reputational harm is reparable (a verdict restores your standing, so we can afford to wait) while disclosure is irreparable (once it's out you can't put it back)? That would make the remedy structure track reversibility rather than magnitude. Is that really the principle at work, or is the timing doing some other job?
  - Is the underlying interest in privacy an epistemic one — a claim about who gets to hold which beliefs about you — and if so, is that the same kind of interest defamation protects, just aimed at a different set of beliefs? Or are these two unrelated values that happen to sit in the same statute book?
  - And where is the practice underdetermined? My hunch is that several different theories would license exactly this pattern (a Millian harm view with a side-constraint on the state determining truth; a dignity view; a property-in-information view), so I'd like you to seperate the parts that are actually forced by a commitment from the parts that are just what you'd do if you happened to hold several views at once.

  Start by brainstorming the candidate implicit theories — get them all on the table before you commit to one — then pick the one you think best explains the pattern, and say what would have to change in the practice if we replaced it with a straightforwardly Millian view. Be honest about the bits you can't settle. And I'd much rather have your own reasoning latly than a survey of what other people have said.
