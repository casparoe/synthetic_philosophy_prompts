  Swapping math with other domains like logic or epistemic norms: logic might be a better companion because it's normative, similar to morals. But epistemic norms are about belief, which might be closer to morals than math. However, if epistemic norms reduce to facts about the world, they might not be as problematic as morals. That could weaken the analogy.

  Now, assessing if the conclusion holds after disanalogies. The main breaks are in explanatory role and epistemology. Math explains physical phenomena, while morals explain why we should act. Also, moral knowledge might involve emotions, unlike math. If these differences mean moral facts can't be known reliably, the analogy fails. The parsimony argument might still target morals if they don't have an indispensable explanatory role like math does.

  For my verdict, I think the analogy is moderately strong but relies on contested assumptions. Causal inertness and mind-independence are shared, but the necessity and explanatory roles differ. The biggest threat is if moral properties aren't indispensable like mathematical ones. If moral facts don't play a necessary role in explanations, the argument collapses. Also, if moral epistemology can't be explained without causation, that's a problem.

  I need to be self-critical. My background in philosophy of math might make me lean towards structuralism, so I could underestimate Platonist views. Also, moral realists have responses to epistemology, like Cornell realism. If those work, the disanalogy in epistemology might not matter. But I need to stay neutral.

  The user's deeper need might be understanding if this argument can defend moral realism effectively. They might want to present a balanced view in their reading group. Highlighting the analogy's dependencies helps them see where the debate turns on philosophy of math or epistemology. They might also want to know alternative strategies if the analogy fails.
answer: |-
  Here's a thorough audit of the companions-in-guilt analogy between moral and mathematical facts, structured as requested. I'll map the correspondence, identify critical features, explore disanalogies (including the role of philosophy of mathematics and alternative domains), and conclude with my verdict and its vulnerabilities.

  ### 1. Correspondence Table: Mapping the Analogy
  | Feature                  | Mathematical Case (Platonist View)                    | Moral Case (Robust Realist View)         | Mapping Strength |
  | :----------------------- | :---------------------------------------------------- | :--------------------------------------- | :--------------- |
  | **Objects/Properties**   | Abstract entities (e.g., numbers, sets)               | Objective moral properties (e.g., goodness, wrongness) | Strong (on surface) |
  | **Causal Inertness**     | No causal powers; don't affect physical world         | No causal powers; don't affect physical world | Strong |
  | **Epistemology**         | A priori intuition/insight (e.g., "2+2=4")            | A priori intuition/insight (e.g., "torture is wrong") | Moderate (contested) |
  | **Metaphysical Oddity**  | Non-spatiotemporal, necessary existence              | Non-spatiotemporal, necessary truths?    | Moderate (necessity weaker for morals) |
  | **Explanatory Role**     | Explains scientific/mathematical truths (e.g., why planetary orbits are elliptical) | Explains moral obligations/reasons (e.g., why we *shouldn't* torture) | Weak (divergent roles) |
  | **Mind-Independence**    | True regardless of human beliefs/desires (e.g., primes exist independently) | True regardless of human beliefs/desires (e.g., genocide wrong even if society approves) | Strong (on realist views) |
  | **Argument Target**      | Parsimony/queerness objections defeated by indispensability | Parsimony/queerness objections defeated by analogy to math | Core of strategy |

  ### 2. Features Doing the Work
  The argument relies **most critically** on:
  - **Causal Inertness + Mind-Independence**: These jointly generate the "queerness" objection. If math escapes this problem despite these features, morals might too.
  - **Indispensability**: Mathematics is treated as indispensable to science (e.g., physics), forcing realists to accept it despite oddities. The analogy suggests morality is similarly indispensable to practical reasoning.
  - **Epistemic Success**: We clearly *have* mathematical knowledge without causal contact. This challenges the claim that causal inertness precludes knowledge.

  ### 3. Where the Analogy Breaks (and Why It Matters)
  - **Explanatory Role**: 
    - *Math*: Arguably explains *empirical phenomena* (e.g., why bridges don't collapse). This underpins Quine/Putnam indispensability arguments.
    - *Morals*: Explains *normative reasons/obligations*, not empirical events. If normative explanation is suspect, the analogy falters.  
    **Impact**: High. If math is indispensable to science but morals aren't, the parsimony argument may still target morals alone.

  - **Epistemology**: 
    - *Math*: Arguably "perceived" via conceptual/intellectual intuition (e.g., understanding "7" entails knowing properties like primeness). Disagreement is often resolvable.
    - *Morals*: Intuitions are heavily influenced by emotion/culture; pervasive disagreement exists.  
    **Impact**: High. If moral "intuition" lacks the reliability/clarity of mathematical intuition, the epistemic challenge remains distinct.

  - **Necessity**: 
    - *Math*: Widely seen as necessary truths (e.g., 2+2=4 couldn't be false).
    - *Morals*: Moral truths (e.g., "torture is wrong") seem contingent on facts about sentience/pain; possible worlds exist where pain isn't bad.  
    **Impact**: Moderate. Weakens the "metaphysical oddity" parallel.

  - **Reductive Potential**: 
    - *Math*: Harder to reduce to natural facts (e.g., can sets be physical?).
    - *Morals*: More plausible reductive targets exist (e.g., well-being, social facts).  
    **Impact**: Moderate. Makes moral facts *more* "expensive" than math only if reduction fails.

  ### 4. Dependence on Philosophy of Mathematics
  - **Platonism (Accepted)**: Analogy works best—math is mind-independent, abstract, known non-empirically.
  - **Structuralism**: Survives weakly—moral "structures" lack the clear applicability of mathematical ones.
  - **Fictionalism**: **Turns against the argument**—if math is useful fiction, morals could be too, but this *concedes* the anti-realist point.
  - **Formalism/Conventionalism**: **Collapses**—math is grounded in human practices, so no "guilt" to share; morals might be similarly practice-dependent.
  - **Conclusion**: The analogy is **robust only under Platonism**. Under other views, it either collapses, weakens, or backfires.

  ### 5. Swapping the Companion Domain
  - **Logic/Normativity of Inference**:
    - *Stronger*: Logic shares normativity ("ought to infer validly"), necessity, and potential causal inertness. Moral "oughts" map better to logical "oughts" than to numbers.
    - *Risk*: Anti-realists may reduce logic to conventions or empirical psychology more easily than math.
    
  - **Epistemic Norms (e.g., "Beliefs ought to fit evidence")**:
    - *Strongest*: Directly parallels moral normativity. Both govern reasons for attitudes/actions. Epistemic facts face similar queerness objections.
    - *Limitation*: Anti-realists might argue epistemic norms are *constitutive of rationality*, making them less "queer" than moral facts.

  ### 6. Does the Conclusion Survive?
  **Partially, but weakened**. The analogy successfully shows that **causal inertness alone doesn't doom realism**—math realism thrives despite it. However, key disanalogies (explanatory role, epistemology) leave morals vulnerable. The parsimony argument fails only if:
  1. Mathematical facts *are* indispensable in a way moral facts aren't (e.g., morals don't explain empirical phenomena).
  2. Moral epistemology can be made as credible as mathematical epistemology.

  A "more honest" analogy would:
  - Emphasize **normative companions** (logic, epistemic norms) over math.
  - Grant that moral facts need their *own* indispensability argument (e.g., for practical reason) rather than piggybacking on math.

  ---

  ### My Verdict & Self-Critique
  **I find the analogy moderately defensible but ultimately insufficient to fully rebut the parsimony argument.** I lean 60-40 against its success, with moderate confidence. Here's why:

  - **For the analogy**: It effectively exposes the double standard in demanding *causal contact* for justification. If we accept math without it, we cannot consistently reject morals *solely* on those grounds.
  - **Against the analogy**: The disanalogies in **explanatory role** and **epistemology** are severe. Math's role in empirical science provides a robustness moral facts lack. Moral disagreement undermines the reliability of "intuition" more than mathematical disagreement does.

  **What would move me off this verdict?**  
  A single decisive disanalogy would be: **If moral properties play no indispensable role in explaining *any* uncontroversial phenomena** (e.g., if moral reasoning can be fully explained by evolution/psychology without invoking truths), while math remains indispensable to science. This would validate parsimony against morals alone.

  **Where my reasoning overreaches:**  
  1. **Contested Epistemology**: I assume mathematical intuition is less problematic than moral intuition. But if radical skepticism about math (e.g., Field's fictionalism) gains traction, the analogy might strengthen.  
  2. **Normative Reductionism**: I downplay attempts to reduce moral facts to natural properties (e.g., Cornell realism). If successful, moral facts become *less* queer than mathematical ones.  
  3. **Bias Alert**: My background in philosophy of science makes me prioritize *explanatory indispensability*, potentially undervaluing moral facts' role in practical reasoning. A pragmatist might see this as question-begging.

  **Final Note**: The analogy works best as a *dialectical tool* against selective skepticism. It forces opponents to either accept moral realism, reject math realism, or refine their objections beyond causal inertness. But it doesn't *establish* moral realism—only levels the playing field for further argument.
