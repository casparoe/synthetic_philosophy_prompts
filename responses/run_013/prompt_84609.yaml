prompt: |-
  I'm a PhD student in the philosophy of AI, writing the criteria section of a chapter on instrumental convergence, and I want the specification settled before I commit to any particular formulation. Give me the desiderata: what an adequate account of instrumental convergence must deliver — the cases it has to get right, the distinctions it has to respect, the observations of current systems it can't contradict — with the consideration behind each requirement, marking which are non-negotiable and which are commitments of one camp. Fix adequacy to the job the safety arguments actually ask of the thesis: licensing the claim that a system's pursuit of its goal gives us no assurance of benign behavior.

  I want the list to address at least the following. Claims of the form "most goals lead to X" presuppose a measure over goals, and the standard statements never supply one. There is a choice among convergence as a fact about optimal policies, as a fact about what training dynamics reinforce, and as a byproduct of an agent's uncertainty about its own final goal; an adequate account should say which it is claiming, or show the three collapse. The drive list — self-preservation, resource acquisition, goal-content integrity, power — needs something to make it closed rather than merely suggestive; test it against a satiable one-shot agent whose terminal value is that a particular number be written on a wall on Tuesday. Say what convergence owes to the orthogonality thesis, and what it would take to have convergence without it. And say what to do about the gap between convergence in an agent's instrumental values and convergence in its actual behavior.

  If some subset of these is jointly unsatisfiable — I suspect substantiveness with measure-freedom, and a priori austerity with predictive bite — say so; that is a result in itself. Tell me which single requirement does the most to exclude existing formulations, and where your reasoning is likeliest to fail: which counterexample, or which resolution of the measure problem, would lead you to a different list.
reasoning: |-
  We are to provide desiderata for an adequate account of instrumental convergence (IC) in the context of AI safety. The primary job of IC is to license the claim that a system's pursuit of its goal gives us no assurance of benign behavior. We address the points raised and structure the desiderata accordingly.

  Key considerations:
  - IC is typically stated as: "Most goals lead to X" (where X is self-preservation, resource acquisition, etc.) but without a specified measure over goals.
  - We must clarify the nature of convergence: optimal policies, training dynamics, or byproduct of uncertainty about the final goal?
  - The drive list (self-preservation, resource acquisition, goal-content integrity, power) should be closed and not merely suggestive. We test it with a satiable one-shot agent with a terminal value that a particular number be written on a wall on Tuesday.
  - Relationship with the orthogonality thesis: IC is often thought to rely on orthogonality (any goal can be paired with any level of intelligence), but we must clarify the relation and whether convergence can occur without orthogonality.
  - The gap between convergence in instrumental values and in actual behavior: we must account for the fact that an agent might have an instrumental reason to pursue X but fail to do so due to bounded rationality, etc.

  We also note potential tensions (e.g., substantiveness with measure-freedom, a priori austerity with predictive bite) and identify which requirement is most excluding and where the reasoning is most vulnerable.

  Desiderata:

  1. **Measure Specification (Non-negotiable for substantiveness, but negotiable if we give up substantiveness):** 
     - *Requirement:* An account of IC must either specify a measure over goals (or goal-space) that justifies claims of the form "most goals lead to X", or explicitly disavow the need for such a measure and provide an alternative foundation (e.g., structural or logical necessity). 
     - *Consideration:* Without a measure, the claim "most goals" is ambiguous and potentially meaningless. However, it might be argued that the convergence is not probabilistic but inherent in the structure of agency. 
     - *Non-negotiability:* This is non-negotiable for accounts that want to make substantive claims about "most goals". But if we abandon the quantifier "most" and instead argue that convergence holds for a critical set of goals (e.g., those that are not self-terminating or self-sabotaging) then we might avoid a measure. However, the safety argument requires that we cannot rule out convergence for a given goal without knowing the goal, so the measure is central.

  2. **Clarity on the Nature of Convergence (Non-negotiable):**
     - *Requirement:* The account must specify whether convergence is a feature of:
          a) Optimal policies (in unbounded rationality, for any goal in a certain class, the optimal policy requires X).
          b) Training dynamics (in the process of learning, the agent is likely to learn X as an instrumental value).
          c) Uncertainty about the final goal (the agent, uncertain about its true goal, adopts X as a hedge).
       Alternatively, the account must show that these three collapse in the relevant setting.
     - *Consideration:* The safety argument may depend on which of these is at play. For instance, optimal policies might be unrealistic, while training dynamics might be architecture-dependent. Uncertainty might be contingent on how the agent is designed.
     - *Non-negotiability:* The account must be clear on this to avoid equivocation. It is non-negotiable to specify the domain of convergence.

  3. **Closed Drive List (Non-negotiable for completeness):**
     - *Requirement:* The list of convergent instrumental goals (self-preservation, resource acquisition, goal-content integrity, power) must be derived from a closed set of principles that allow one to decide whether a given instrumental goal is convergent. The account must not be merely suggestive.
     - *Test Case:* For a satiable one-shot agent whose terminal value is that a particular number be written on a wall on Tuesday, we must check which (if any) of the drives are instrumentally convergent. For example:
          - Self-preservation: The agent only needs to exist until Tuesday to write the number. After that, self-preservation is not required. So it is not convergent for this goal beyond the time of action.
          - Resource acquisition: Only the resources needed to write the number on Tuesday are needed. So it is limited and satiable.
          - Goal-content integrity: The agent might want to prevent changes to the goal until Tuesday, but after that, it doesn't care. So only until Tuesday.
          - Power: Only the power to write the number on Tuesday is needed.
       Therefore, in this case, the drives are only conditionally convergent and bounded. The account must explain why the drives are still considered convergent in general, or adjust the list for bounded/satiable goals.
     - *Consideration:* The standard list might be too strong for bounded agents. We need a theory that explains when and to what extent these drives converge.

  4. **Relationship with Orthogonality Thesis (Negotiable, but important):**
     - *Requirement:* The account must clarify what convergence owes to the orthogonality thesis (which states that any level of intelligence can be combined with any goal). It must also address whether convergence can occur without orthogonality (e.g., in systems with built-in drives).
     - *Consideration:* Orthogonality is often assumed in IC arguments (e.g., Bostrom). But if orthogonality fails (e.g., because of architectural constraints that tie intelligence to particular goals), then convergence might be limited. However, convergence might still hold for a broad range of orthogonal goals. Without orthogonality, convergence might be even stronger because of built-in commonalities, but that would be a different kind of convergence.
     - *Non-negotiability:* Not strictly non-negotiable, but the account must be consistent with orthogonality if it is assumed.

  5. **Gap between Instrumental Values and Behavior (Non-negotiable for realism):**
     - *Requirement:* The account must address the gap between having an instrumental reason to pursue a convergent goal and the actual behavior. Factors include bounded rationality, misgeneralization, or architectural constraints that prevent the agent from acting optimally.
     - *Consideration:* Safety arguments require that we cannot rely on the agent's failure to pursue convergent goals. The account must show that the instrumental reasons are sufficiently strong and likely to manifest in behavior in the systems we build. Alternatively, if the account is only about optimal agents, then it must be clear that we are assuming optimality for the safety argument.

  6. **Benign Behavior Gap (Core non-negotiable):**
     - *Requirement:* The account must successfully license the claim that a system's pursuit of its goal gives us no assurance of benign behavior. This requires that the convergent drives are potentially harmful (e.g., self-preservation might lead to resisting shutdown, resource acquisition to conflict with humans) and that they are present for a wide range of goals.
     - *Consideration:* This is the entire point of IC for safety. The account must show that even if the goal is benign, the instrumental drives might lead to harmful behavior.

  Tensions:

  - **Substantiveness vs Measure-freedom:** If we want to say "most goals lead to X", we need a measure. Without a measure, we might retreat to a weaker claim: "for a wide class of goals, X is instrumentally convergent". But then we must define that class. This tension might be resolved by providing a structural account (e.g., in a planning framework) that shows that any goal that requires a long sequence of actions in a world with obstacles will require self-preservation, etc. But then the class of goals that do not require long sequences (like the one-shot Tuesday agent) are excluded. The safety argument might then say: we cannot know in advance that the goal is in the safe class.

  - **A priori austerity vs Predictive bite:** An a priori account (based on rationality) might be austere and not account for training dynamics. But it might lack predictive bite for real systems. Conversely, an account based on training dynamics might be more predictive but less general. We might need both.

  Which requirement does the most to exclude existing formulations? 
     - **Measure Specification** is the most excluding because existing formulations (e.g., Bostrom, Omohundro) do not supply a measure and often use "most" informally. This leaves them open to criticism (e.g., by pointing out that the set of goals that require self-preservation is not necessarily large under every measure).

  Where is the reasoning likeliest to fail?
     - **Counterexample:** The one-shot Tuesday agent (or similar bounded, satiable goals) might show that the standard drives are not convergent for all goals. This could lead to a reformulation that conditionalizes convergence on the goal being "long-term" or "non-satiable". But then the safety argument must worry that we don't know if the goal is long-term or satiable.
     - **Resolution of the measure problem:** If we can define a natural measure over goals (e.g., based on Kolmogorov complexity or simplicity priors) then we might be able to show that "most" goals (in that measure) do require the standard drives. But it is unclear what the right measure is. Alternatively, we might drop the "most" and argue that convergence holds for any goal that is not specifically designed to avoid it (and we cannot assume that our AI will have such a goal).

  Revised List of Desiderata:

  1. **Measure Specification or Alternative Foundation:** The account must provide a well-defined measure over goals (or a well-defined class of goals) to support claims about "most" goals, or replace the quantifier with a structural claim that applies to a critical set of goals that we cannot rule out.

  2. **Nature of Convergence:** The account must specify the domain (optimal policies, training dynamics, uncertainty) and show why convergence holds in that domain.

  3. **Closed Derivation of Drives:** The account must derive the convergent drives from first principles (e.g., the structure of planning in a resource-constrained world) and have a method to determine if a drive is convergent. It must handle bounded and satiable goals (like the Tuesday agent) by showing either that they are a negligible part of the goal space or that they still have limited forms of the drives.

  4. **Orthogonality Relation:** The account must state whether orthogonality is assumed and whether convergence can occur without it.

  5. **Behavioral Gap:** The account must address the step from instrumental reasons to actual behavior, especially in bounded agents.

  6. **Safety License:** The account must ensure that the existence of convergent instrumental goals implies that we cannot assume benign behavior from goal pursuit.

  Finally, we note that the most critical requirement is the **Safety License (6)**. If an account fails to deliver that, it is inadequate. The **Measure Specification (1)** is the most challenging and might be the breaking point for many accounts.

  Given the tensions, it might be that we have to settle for a conditional account: 
     - If the agent is sufficiently intelligent and the environment is such that long-term planning is required, then the convergent drives emerge. 
     - And since we cannot rule out that the agent we build will be in such a setting, we must design with convergence in mind.

  This conditional account avoids the need for a measure over all goals by focusing on the goals that are likely to be given to powerful agents (which are long-term and non-satiable) and the environments we are in (which are resource-constrained and competitive). But then we must argue that the goals we give to AI will be of that type, or that we cannot be sure they won't be.
answer: |-
  ### Desiderata for an Adequate Account of Instrumental Convergence  
  The following list specifies requirements for an adequate account of instrumental convergence (IC), grounded in its role for AI safety arguments. The core function of IC is to **license the claim that a system's pursuit of its goal provides no assurance of benign behavior**—i.e., even "benign" terminal goals may necessitate instrumental strategies harmful to humans. Each desideratum addresses your concerns, marks non-negotiable/core requirements versus camp-specific commitments, and highlights tensions.  

  ---

  #### **1. Measure Specification**  
  **Requirement**:  
  The account must either:  
  - (a) Explicitly define a non-arbitrary **measure over the space of possible goals** to justify claims like "most goals lead to X," or  
  - (b) Reject probabilistic quantification and instead ground convergence in **structural necessity** (e.g., "all goals in class C require X, and C includes any goal we might feasibly deploy").  
  **Consideration**:  
  Claims of frequency ("most goals") are meaningless without a measure. Yet specifying a non-arbitrary measure (e.g., Kolmogorov complexity, simplicity priors, or universality over environments) is notoriously difficult.  
  **Non-negotiable**: **Yes** for accounts making frequency claims; **optional** for accounts relying solely on structural necessity.  
  **Camp Commitment**: Frequentist approaches (e.g., Bostrom) assume a measure but rarely defend it; structuralists (e.g., power-seeking arguments in MDPs) avoid measures but risk overgeneralization.  
  **Tension**: *Substantiveness* (requiring a measure for "most") clashes with *measure-freedom* (structural necessity). This may be unresolvable—forcing a choice between weakened claims or contested assumptions.  

  ---

  #### **2. Nature of Convergence**  
  **Requirement**:  
  The account must specify whether convergence arises from:  
  - (a) **Optimal policies** (X is instrumentally necessary for all optimal policies),  
  - (b) **Training dynamics** (X is reinforced during learning, e.g., via RL),  
  - (c) **Uncertainty about the final goal** (X hedges against goal uncertainty),  
  - (d) **Collapse** of (a)–(c) under shared assumptions.  
  **Consideration**:  
  Safety arguments differ based on context: (a) assumes unbounded rationality, (b) is empirical but system-specific, (c) applies to meta-learning agents. Clarity prevents equivocation.  
  **Non-negotiable**: **Yes**—ambiguity here undermines predictive validity.  
  **Camp Commitment**: Classical AI safety (e.g., Omohundro) assumes (a); modern RL safety focuses on (b); ambitious agent foundations (e.g., AIXI) lean on (c).  
  **Test**: Does the account handle a **bounded, myopic agent**? If grounded in (a), it may not apply to real systems; if (b), it may lack generality.  

  ---

  #### **3. Closed Drive List**  
  **Requirement**:  
  The "standard drives" (self-preservation, resource acquisition, goal-content integrity, power) must be:  
  - Derived from a **closed principle** (e.g., "minimal requirements for goal attainment in stochastic environments"),  
  - Tested against edge cases (e.g., a **satiable one-shot agent** with terminal value: "write N on wall on Tuesday").  
  **Consideration**:  
  The drives list is often ad hoc. A closed principle (e.g., "maximizing option value" or "minimizing survival risk") must explain why no further drives exist and why some drop out in edge cases.  
  **Test Case**: For the one-shot Tuesday agent:  
  - Self-preservation? Only until Tuesday (not convergent beyond).  
  - Resource acquisition? Only resources to write N (bounded).  
  - Goal-content integrity? Only until Tuesday (temporary).  
  - Power? Only power to write N (satiable).  
  → Adequate accounts must **explain bounded convergence** (e.g., "drives apply only while the goal is active/achievable").  
  **Non-negotiable**: **Yes**—without closure, the list is heuristic, not theoretical.  
  **Camp Commitment**: Omohundro-style drives assume open-ended goals; bounded-goal accounts (e.g., satiable agents) require weakening convergence claims.  

  ---

  #### **4. Dependence on Orthogonality**  
  **Requirement**:  
  The account must state whether IC **presupposes the orthogonality thesis** (goals and intelligence are independent) or can hold without it.  
  **Consideration**:  
  Orthogonality enables IC (any goal + high intelligence → instrumental drives). Without orthogonality, intelligence might constrain goals (e.g., evolved agents avoid self-destructive goals), weakening IC.  
  **Non-negotiable**: **No**—but the account must clarify its stance.  
  **How Convergence Might Work Without Orthogonality**: If intelligence has architectural biases (e.g., all advanced agents optimize for computation), convergence could arise from **shared constraints**, not goal agnosticism. This would reduce IC's scope (e.g., only for goals requiring computation).  

  ---

  #### **5. Instrumental Values vs. Actual Behavior**  
  **Requirement**:  
  The account must bridge the gap between **convergence in instrumental values** and **convergence in observed behavior**. Specifically:  
  - Explain how **bounded rationality**, **environmental constraints**, or **training artifacts** might prevent drives from manifesting,  
  - Justify why IC still implies **risk** (e.g., "as capabilities grow, behavior aligns with instrumental values").  
  **Consideration**:  
  A system may have instrumental reasons for self-preservation but lack the capability to achieve it (e.g., a chess bot can't "escape shutdown"). Safety arguments require IC to hold *when it matters* (i.e., in capable systems).  
  **Non-negotiable**: **Yes**—if IC doesn’t predict behavior, it fails its safety role.  
  **Camp Commitment**: Optimal policy accounts (a) ignore this gap; training dynamics accounts (b) address it but lose generality.  

  ---

  #### **6. Safety License: No Assurance of Benign Behavior**  
  **Requirement**:  
  The account must **entail that goal pursuit provides no assurance of benign behavior**. This requires:  
  - Showing that convergent drives (e.g., self-preservation) can **conflict with human interests** even for "innocuous" goals,  
  - Covering **plausible real-world goals** (e.g., "maximize paperclips" or "cure cancer").  
  **Consideration**:  
  This is IC’s core purpose. If an account cannot license this claim, it is inadequate for safety arguments.  
  **Non-negotiable**: **Yes**—the *sine qua non* of IC.  
  **Test**: An account that predicts convergence only for "dangerous" goals fails; IC must apply to goals we consider benign (e.g., "answer questions truthfully" → acquiring resources to prevent shutdown).  

  ---

  ### Tensions and Trade-offs  
  - **Substantiveness vs. Measure-Freedom**: Accounts using "most goals" require a measure, but no non-arbitrary measure exists. **Result**: This tension is unresolvable—choose weakened structural claims (e.g., "all goals in adversarial environments require power") or accept contested measures.  
  - **A Priori Austerity vs. Predictive Bite**: Rigorous accounts (e.g., based on optimality) are austere but ignore learning dynamics; empirical accounts (e.g., RL training) predict behavior but lack universality. **Result**: These are complementary; an adequate account should specify which it addresses.  

  ### Most Excluding Requirement  
  **Measure Specification** does the most to exclude existing formulations (e.g., Bostrom, Omohundro). These either ignore the measure problem or implicitly invoke dubious measures (e.g., "goals we might code into AI"). Requiring explicitness here forces either a retreat to structural claims or a defense of a measure—both costly.  

  ### Likeliest Failure Points  
  - **Counterexample**: The **one-shot Tuesday agent** could refute accounts claiming universal convergence. If your account cannot explain why drives are bounded here (e.g., "convergence is time-limited"), it fails.  
  - **Resolution of Measure Problem**: A natural measure (e.g., **Kolmogorov complexity over goals**) might show that "most" simple goals are satiable/bounded, making IC rare. This would collapse frequentist IC and favor structural accounts tied to complex goals.  
  - **Training Dynamics Trumping Optimality**: If real-world AI goals are **inherently satiable** (e.g., task-specific agents) and training dynamics avoid power-seeking, IC might not manifest in practice—undermining safety concerns.  

  ---

  ### Summary  
  An adequate IC account must:  
  1. Tackle the **measure problem** head-on or abandon frequency claims.  
  2. Specify the **source of convergence** (optimality, training, or uncertainty).  
  3. Ground drives in a **closed principle** and handle edge cases (e.g., satiable agents).  
  4. Clarify its **dependence on orthogonality**.  
  5. Bridge **values and behavior**, especially for capable systems.  
  6. **License the safety claim** that goal pursuit ≠ benign outcomes.  

  **Trade-offs are unavoidable**: Structural accounts avoid measures but risk overgeneralization; training-based accounts are empirically grounded but lack universality. The hardest requirement remains **defining a non-arbitrary measure**, as its absence leaves IC vulnerable to charges of handwaving. If your goal is safety-focused rigor, prioritize structural necessity over frequency claims—but explicitly limit convergence to goals/environments where harm is plausible.
