prompt: |-
  I'm working on the pragmatics of default assumptions and keep circling back to Hofstadter's Person Paper, where he swaps sex-marked English for race-marked English so the supposedly generic masculine suddenly reads as loaded as racial defaults do. Give me an example of a conceptual issue the swap exposes but that a straight find-and-replace of gendered terms with neutral ones would leave untouched. I'm especialy interested in a case where the neutralized term is extensionally fine, it really does cover everyone, yet the old default still gets read in — something like an occupational title that has gone neutral but still conjures a particular kind of person when you hear it cold. Then say how you'd tell, from the inside of a language, whether a default has been dismantled or just gone underground, since we can't run the counterfactual of growing up in the reformed version. Bonus if your example also strains the analogy itself, i.e. a spot where race and sex defaults don't line up well enough for the mirror to do its work.
