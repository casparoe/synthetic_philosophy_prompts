answer: |-
  ## Workshop Proposal: Reframing the Demos Boundary Problem via Claim-Bundling

  **Bottom Line:** This workshop proposes to reframe the democratic boundary problem ("who constitutes the demos?") by analyzing the demos not as a fixed group of persons, but as a *dynamic bundle of claims* requiring collective decision. This shift aims to generate new insights into persistent dilemmas like secession, immigrant inclusion, and representing future generations, moving beyond the limitations of existing "all-affected" or "all-subjected" principles.

  **The Core Question:** What principle(s) determine *which claims get bundled together* into a single demos for collective decision-making, rather than being split into separate demoi or excluded entirely?

  **Why Existing Frameworks Leave This Open:** Current dominant approaches focus on identifying *individuals*:
  *   **All-Affected Interests:** Defines membership based on who is impacted by a decision. *Problem:* Scope is notoriously ambiguous (how affected? how far into the future?) and struggles with conflicts where groups *want* different boundaries (e.g., secessionists vs. unionists).
  *   **All-Subjected to Coercion:** Defines membership based on being subject to a polity's binding rules. *Problem:* Presupposes an existing polity with established boundaries, failing to address the prior question of *how those boundaries were justified* and struggles with overlapping jurisdictions or new claims (e.g., long-term immigrants subject to rules but lacking formal membership).
  Both frameworks get stuck on the circularity of defining "the people" *before* they can decide and treat claims as derivative of pre-defined membership, not constitutive of it. They offer limited tools for adjudicating *which set* of claims belongs where when boundaries are contested.

  **The Proposed Reframing: Demos as Claim-Bundle:** Instead of starting with persons, start with *claims* – demands, interests, or needs requiring authoritative resolution. The demos is then the collective formed by the decision to bundle a specific set of these claims together for joint determination. The boundary problem becomes: *Why are these particular claims bundled here, and not others?*

  **Workshop Method & Paper Focus:**
  1.  **Articulate the Framework:** Develop the core concept of the demos as a *claim-bundle*, defining what constitutes a "claim" in this context and distinguishing it from mere preferences.
  2.  **Identify Bundling Principles:** Propose and critically evaluate candidate principles for claim-bundling. Possibilities include:
      *   **Functional Interdependence:** Claims are bundled if their resolution inherently requires coordinated action or impacts each other fundamentally (e.g., managing a shared water resource).
      *   **Reciprocal Vulnerability:** Claims belong together if the claimants are mutually vulnerable to each other's actions/inactions (potentially addressing future generations).
      *   **Shared Fate/Common World:** Claims arising from inhabiting the same irreducible context or facing a common existential challenge.
      *   **Relational Justice:** Claims are bundled based on the existence of specific, justice-relevant relationships between claimants (e.g., co-workers, neighbors).
  3.  **Apply to Test Cases:** Rigorously apply these bundling principles to the thorny cases:
      *   **Secession:** Does a subgroup's claims constitute a distinct bundle justifying a new demos? Or do existing interdependencies mandate remaining bundled?
      *   **Immigrant Inclusion:** When do the claims of non-citizens become so intertwined with the existing bundle that exclusion undermines the demos's coherence or legitimacy?
      *   **Future Generations:** Can claims about the future be meaningfully "bundled" with present claims? If so, on what basis (e.g., irreversibility of impacts creating reciprocal vulnerability)?

  **What a Good Result Looks Like:**
  *   A clear, defensible principle (or small set of principles) for claim-bundling emerges that is distinct from simply restating person-based criteria.
  *   This principle provides novel, plausible, and non-circular ways to analyze and potentially resolve the test cases, offering advantages over traditional frameworks.
  *   The framework opens productive lines of inquiry for further research on democratic boundaries and legitimacy.

  **What Failure Looks Like:**
  1.  **Incoherence:** The concept of "claims" proves too vague or the bundling principle(s) too abstract to be meaningfully applied to real-world boundary disputes.
  2.  **Redundancy:** The bundling principle(s) collapse back into existing person-based criteria (like all-affected or all-subjected) without adding significant analytical value.
  3.  **Intractability:** The framework fails to generate compelling or novel insights for the key test cases (secession, immigrants, future people), leaving the dilemmas as unresolved as before.
  4.  **Impracticality:** The resulting principle is theoretically interesting but offers no feasible path for practical institutional design or democratic justification.

  **Deliverable:** A workshop paper outlining the claim-bundle framework, proposing and evaluating bundling principles, demonstrating their application to the test cases, and assessing the framework's potential value and limitations compared to existing approaches. This will provide the foundation for collaborative discussion and refinement.
