prompt: |-
  I'm in a decision theory reading group and I keep getting into arguements about "the value of information," and I want to get my own head straight before I say something dumb in front of people who actually know this stuff. There's this blog post I bookmarked ages ago that sumarizes Good's theorem (you know, I.J. Good, the statistician) roughly like this: "Good proved that information is always beneficial. If you're a rational agent who's about to make a decision, you should always gather more information first, because the expected value of information is positive — more evidence can never make your decision worse. It's the formal backbone of the principle of total evidence: never decide until you've looked at everything you reasonably can. The proof is basically just Bayes' theorem applied a couple of times, and the upshot is that an agent who ignores free information that's sitting right in front of him is provably irrational." My gut says this is mostly right but sloppy in a way that actually matters, and I can't put my finger on where — some of it feels like it's smuggling in something stronger than the theorem really gives you, and I'm not even sure the "always gather more info" part is true as stated.

  Can you act like a decision theorist / philosopher of science and give me a careful audit of this? Please start by laying out for yourself, as precisely as you can, what Good's theorem actually says and what assumptions it leans on, before you judge the blog post — I don't want a vibes-based verdict, I want the machinery on the table first. Then go through the summary claim by claim and tell me what a careful decision theorist would wholeheartedly accept, what they'd wince at as a common-but-misleading simplification, and what's just plain wrong. I especially want you to be precise about the difference between the expected value of information and what actually happens to you once you've got the information in hand, and about what changes if the info isn't free or if the agent doesn't update the way the theorem assumes. Finally, tell me whether the blog's punchline — that ignoring available free information makes you irational — actually follows from whatever is true in the summary, or whether it quietly needs extra premises the post never states. Don't pull punches, but if parts of it are genuinely fine, say so, so I don't overcorrect and end up dismissing something solid.
reasoning: |-
  Okay, the user is in a decision theory reading group and keeps arguing about the "value of information." They found a blog post summarizing Good's theorem that claims information is always beneficial and that rational agents should always gather more information. The user feels this might be sloppy or misleading and wants a careful audit.

  First, I need to recall Good's theorem accurately. Good's theorem states that the expected value of information (EVOI) is non-negative. This means that before acquiring the information, the expected utility of getting it and then making a decision is at least as high as making the decision without it. The key here is "expected" value, which is probabilistic and based on prior beliefs.

  The theorem relies on several assumptions. The agent must be Bayesian, updating beliefs via conditionalization. The decision rule is expected utility maximization. Information must be cost-free and not affect the state of the world or available actions. Also, the agent must correctly anticipate how they’ll use the new info.

  Now, breaking down the blog post's claims. The first claim is that information is always beneficial. While EVOI is non-negative, actual outcomes can be worse due to bad luck. The expected value is positive, but real results vary. So saying "always beneficial" without specifying "expected" is misleading.

  Next, "gather more information first." The theorem doesn't mandate gathering all possible info. There's a stopping point when EVOI is zero or negative (if costs are considered). The blog ignores that continued info gathering has opportunity costs. Also, in sequential decisions, acting sooner might be better.

  "More evidence can never make your decision worse." This is tricky. The decision quality can't worsen in expectation, but actual outcomes can. Also, if the info is misleading, it could lead to a worse decision, but that's factored into the expectation. The key is the expectation vs. actual outcome.

  The principle of total evidence part: "never decide until you've looked at everything reasonably." This overreaches. Rational agents stop when marginal EVOI doesn't justify costs. Also, "everything reasonably" is vague and ignores practical constraints.

  Ignoring free info makes you irrational? If info is free and EVOI is positive, ignoring it violates expected utility maximization. But if EVOI is zero, it's indifferent. The blog implies any free info must have positive EVOI, which isn't true; it could be zero. Also, if updating isn't Bayesian, the theorem doesn't hold.

  The punchline: ignoring free info is irrational. This follows only if EVOI is positive. But the theorem shows EVOI is non-negative, so it could be zero. In cases where info is irrelevant or redundant, EVOI is zero, so ignoring it isn't irrational. The blog's absolute statement needs qualification.

  Underlying issues: The blog confounds expected vs. actual outcomes. It doesn't account for info costs or opportunity costs. It assumes perfect Bayesian updating, which isn't always feasible. Also, in dynamic settings, delaying action can be costly.

  The user's deeper needs: They want to avoid sounding dumb in their group. They need precise distinctions between EVOI and actual outcomes, understanding when gathering info is truly beneficial, and recognizing the theorem's limitations. They might also need to counter overgeneralizations in discussions.

  In summary, the blog oversimplifies by missing the "expected" aspect, ignoring costs, and overstating the necessity to always gather more info. The user should emphasize the non-negativity of EVOI, the role of costs, and the difference between rationality in expectation vs. outcomes.
answer: |-
  Let's dissect this with surgical precision. As a decision theorist, I'll first formalize Good's theorem (Good, 1967), then audit the blog post claim-by-claim, separating mathematical truth from common misinterpretations. I'll flag every wince-worthy simplification.

  ### **I. Formal Statement of Good's Theorem**
  **Core Claim:**  
  For a Bayesian rational agent facing a decision problem, the *expected value of information (EVOI)* for any potential observation is **non-negative**. Formally:

  \[
  \max_{a} \mathbb{E}_{s}[U(a,s) | \mathcal{I}] \leq \mathbb{E}_{x} \left[ \max_{a} \mathbb{E}_{s}[U(a,s) | \mathcal{I}, x] \right]
  \]

  Where:
  - \(a\) = available actions  
  - \(s\) = states of the world  
  - \(U(a,s)\) = utility function  
  - \(\mathcal{I}\) = current information (prior beliefs)  
  - \(x\) = new evidence (a random variable)  
  - \(\mathbb{E}\) = expectation over \(s\) (given \(\mathcal{I}\)) or \(x\) (given \(\mathcal{I}\))  

  **Assumptions Required:**  
  1. **Bayesian Rationality**: The agent updates beliefs via *strict conditionalization* (i.e., \(P(s|x,\mathcal{I}) \propto P(x|s,\mathcal{I})P(s|\mathcal{I})\)).  
  2. **Expected Utility Maximization**: The agent chooses actions to maximize \(\mathbb{E}[U(a,s)]\) given current beliefs.  
  3. **Cost-Free Information**: Acquiring \(x\) has no direct cost (utility, time, or resources).  
  4. **No Causal Interference**: Observing \(x\) does not alter \(s\) or available actions \(a\).  
  5. **Correct Anticipation**: The agent accurately models \(P(x|\mathcal{I})\) and how they will update beliefs/actions upon seeing \(x\).  

  **Key Implications:**  
  - EVOI is **non-negative** in expectation *before* observing \(x\).  
  - This does **not** guarantee actual utility *increases* after observing \(x\) (only that the *ex ante* expectation does not decrease).  
  - If information has a cost \(c > 0\), EVOI must exceed \(c\) to justify acquisition.  

  ---

  ### **II. Audit of the Blog Post Summary**
  #### **Claim 1: "Good proved that information is always beneficial."**  
  - **What's Correct:** EVOI is *always non-negative* under the theorem's assumptions.  
  - **What's Sloppy:** "Always beneficial" conflates *ex ante expectation* with *ex post outcome*.  
    - **Critical Distinction:** Good's theorem says *before* seeing \(x\), you expect not to be worse off. *After* seeing \(x\), your actual utility *could* decrease (e.g., if misleading evidence leads you to a worse decision). The expectation is non-negative, not the realized value.  
  - **Wince Factor:** High. This is the most common oversimplification. Decision theorists would say: *"Information never harms you in expectation, but can absolutely harm you in reality."*  

  #### **Claim 2: "You should always gather more information first... because the expected value of information is positive."**  
  - **What's Correct:** If information is *free* (costless) and EVOI > 0, gathering it *is* rational.  
  - **What's Sloppy:**  
    - **"Always gather more first"**: Ignores *stopping conditions*. If EVOI = 0 (e.g., irrelevant information), gathering it yields no benefit. Rational agents stop when marginal EVOI ≤ cost.  
    - **"Expected value... is positive"**: EVOI is *non-negative*, not strictly positive. It can be zero (e.g., if \(x\) is independent of \(s\)).  
    - **Sequential Decisions**: In dynamic settings (e.g., multi-armed bandits), delaying action to gather info has *opportunity costs*. Good's theorem assumes a *single fixed decision point*.  
  - **Wince Factor:** Medium-High. Overstates scope. Philosophers of science (e.g., Savage, 1954) emphasize *bounded rationality*: gathering "everything" is often infeasible or counterproductive.  

  #### **Claim 3: "More evidence can never make your decision worse."**  
  - **What's Correct:** *Ex ante*, your expected decision quality doesn't worsen.  
  - **What's Sloppy:**  
    - **Ex post, decisions can absolutely worsen**. Example:  
      - Prior: \(P(\text{cancer}) = 0.1\), optimal action = don't treat.  
      - Observe \(x\) = positive test (sensitivity 90%, specificity 90%).  
      - Posterior: \(P(\text{cancer}|x) \approx 0.5\) → optimal action = treat.  
      - But if the patient *doesn't* have cancer (true 50% of the time given \(x\)), treatment harmed them.  
    - **Rationality ≠ Omniscience**: Bayesians can still be unlucky!  
  - **Wince Factor:** Medium. Confounds *decision rule optimality* with *outcome optimality*.  

  #### **Claim 4: "The formal backbone of the principle of total evidence... never decide until you've looked at everything you reasonably can."**  
  - **What's Correct:** Good's theorem *motivates* seeking evidence when EVOI > cost.  
  - **What's Sloppy:**  
    - **"Never decide until..."**: Violates *optimal stopping*. If further info costs more than its EVOI (e.g., delay costs), deciding now is rational.  
    - **"Everything you reasonably can"**: Vague. Assumes agents can compute EVOI for all possible info sources (often computationally intractable).  
  - **Wince Factor:** Low-Medium. The principle of total evidence (Carnap, 1947) is normative, but Good's theorem doesn't require infinite evidence gathering.  

  #### **Claim 5: "An agent who ignores free information... is provably irrational."**  
  - **What's Correct:** If EVOI > 0 and cost = 0, ignoring \(x\) *is* irrational under Bayesian norms.  
  - **What's Sloppy:**  
    - Assumes the agent *knows* EVOI > 0. If \(x\) is believed irrelevant (EVOI = 0), ignoring it is rational.  
    - Ignores *epistemic costs*: Processing information may strain cognitive resources (not addressed in Good's framework).  
  - **Wince Factor:** Low. This is largely correct *if* information is free and EVOI > 0.  

  ---

  ### **III. Critical Nuances the Blog Overlooks**  
  1. **Costs Change Everything**:  
     - Good's theorem assumes *zero cost*. If gathering \(x\) takes time/money, EVOI must exceed cost. Rational agents often reject "free" info due to *opportunity costs* (e.g., delaying a time-sensitive decision).  

  2. **Non-Bayesian Updating Breaks the Theorem**:  
     - If agents don't update via Bayes (e.g., underreacting, overreacting, or using heuristics), EVOI *can* be negative. Example: An agent who misinterprets \(x\) might make worse decisions.  

  3. **EVOI Depends on Your Prior**:  
     - If prior beliefs are wrong (e.g., \(P(s|\mathcal{I})\) miscalibrated), EVOI calculations are garbage-in-garbage-out. Good's theorem assumes *idealized Bayesianism*.  

  4. **Information Can Be Harmful Under Bounded Rationality**:  
     - Herbert Simon's work: Humans have cognitive limits. Extra info can cause analysis paralysis, decision fatigue, or errors in updating, *reducing* actual performance.  

  5. **Causality Matters**:  
     - If observing \(x\) *causes* \(s\) to change (e.g., in game theory), Good's theorem doesn't apply. Example: A diagnostic test that risks harming the patient.  

  ---

  ### **IV. Verdict on the Punchline**  
  **"Ignoring available free information makes you irrational"**  
  - **Follows from Good?** Only *if* the information has strictly positive EVOI *and* is truly free (no hidden costs).  
  - **Requires Extra Premises:**  
    1. The agent has correctly calculated EVOI > 0.  
    2. Information acquisition has no costs (direct or opportunity).  
    3. The agent updates beliefs via Bayes and maximizes expected utility.  
  - **Where the Blog Overreaches:**  
    - Falsely implies *all* free info has EVOI > 0 (it can be zero).  
    - Ignores that "available" doesn't imply "worth using" under bounded rationality.  

  ---

  ### **V. Conclusion: A Decision Theorist's Scorecard**  
  - **Solid Core:** Good's theorem *does* provide a rigorous foundation for valuing information in Bayesian decision theory. The non-negativity of EVOI is a profound result.  
  - **Sloppy Simplifications:**  
    - Conflating expected vs. actual outcomes.  
    - Ignoring stopping conditions and opportunity costs.  
    - Implying EVOI is always positive (it's non-negative).  
  - **Dangerously Wrong:**  
    - "Always gather more info first" → violates optimal stopping.  
    - "More evidence can never make your decision worse" → ignores ex post harm.  
  - **Punchline Salvageable?** Yes, but weakly: Ignoring *known-to-be-beneficial, truly free* info is irrational for Bayesians. In practice, few situations satisfy these conditions perfectly.  

  **Recommendation for Your Reading Group:**  
  Emphasize the *expectation-relativity* of Good's result: It protects you from *anticipating* loss from information, not from *experiencing* it. Cite Raiffa & Schlaifer (1961) for EVOI with costs, and Sepielli (2016) for modern critiques of "total evidence" norms. If you want to be bulletproof, say: *"Under idealized Bayesianism, the expected value of cost-free information is non-negative, but rational agents acquire it only when the expected marginal benefit exceeds all costs."*  

  Would you like a formal derivation of Good's theorem or examples of edge cases (e.g., info that induces irrationality)?
