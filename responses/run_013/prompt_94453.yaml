  I need to recall the key distinctions: psi-ontic views see the quantum state as physically real (causal difference-maker, part of fundamental reality), while psi-epistemic views treat it as representing knowledge or beliefs about systems. The user specifies several conceptual tools both sides can use without conceding ground: senses of "real," representations of states (vector, ray, density matrix), global phase significance, and whether state realness could be law-like or relativized.

  The user identifies two cruxes I must address: (1) whether distinct preparations yielding the same state imply identical underlying facts, and (2) whether there's a fact about an unmeasured single system versus only ensembles. For each crux, I need to present a neutral case/argument/protocol with both sides' predictions, plus my verdict on verbal aspects.

  For the joint statement, I'll structure it as: 
  1) Common ground claims both can sign. 
  2) Residual disagreements phrased in each side's language. 
  3) Crux 1 with protocol and predictions. 
  4) Crux 2 with argument and predictions. 
  5) My verdict on verbal vs substantive disputes.

  For common ground (Item 1), I'll emphasize undisputed aspects like empirical equivalence and mathematical representations. For disagreements (Item 2), I'll let psi-ontic insist on state as physical and psi-epistemic on state as informational, using their preferred phrasing.

  For Crux 1 (Item 3), I'll propose a quantum state tomography protocol on distinct preparations producing the same density matrix. Psi-ontic would predict identical physical facts, psi-epistemic would allow distinct underlying realities. Both can accept tomography as relevant.

  For Crux 2 (Item 4), I'll use the argument about unmeasured systems: psi-ontic maintains there are facts even unmeasured, psi-epistemic says facts emerge only through measurement or ensembles. The no-signaling theorem could be a common reference point.

  In my verdict (Item 5), I'll argue that the dispute becomes verbal if "real" is relativized or if state is seen as law-like, but substantive differences remain about causal status and preparation dependence. I'll note that psi-epistemic views often imply additional variables, while psi-ontic doesn't require them.

  I'll keep each item concise—one or two sentences—and avoid introductions/conclusions as instructed. The goal is a neutral yet precise framing that honors both perspectives while clarifying their empirical and conceptual boundaries.
answer: |-
  **Joint Statement on Quantum State Realism**

  1.  **Common Ground:** Both sides affirm that the quantum state (whether vector, ray, or density operator) is the central mathematical object of quantum theory, indispensable for predicting the outcomes of possible measurements on quantum systems with maximal accuracy. We agree that empirically, all predictions derived from the state, including probabilities for measurement outcomes and correlations (e.g., via the Born rule), are identical regardless of ontological interpretation, and that the global phase of a pure state vector is empirically unobservable. The distinction between a state interpreted as representing physical reality ("psi-ontic") and one interpreted as representing knowledge or information ("psi-epistemic") is a meaningful conceptual distinction within the foundations of quantum mechanics.

  2.  **Residual Disagreements:**
      *   *Psi-Ontic Stance:* The quantum state (specifically, the physical reality it represents) is a direct causal difference-maker in the world, an element of its fundamental ontology, and indispensable in this *ontic* sense to our best physical explanation of quantum phenomena; its representation (e.g., ray vs. vector) reflects this underlying physical reality.
      *   *Psi-Epistemic Stance:* The quantum state fundamentally represents an agent's degrees of belief or information about the potential outcomes of future interventions on a system, constrained by past preparation and universal quantum constraints; it is indispensable in this *epistemic* or *predictive* sense, but does not necessarily denote a unique, observer-independent element of fundamental physical reality itself.

  3.  **Crux 1: Preparation Independence & Underlying Facts**
      *   **Case:** Consider two distinct physical preparation procedures (P1 and P2) that, according to quantum theory, result in the same density operator ρ for a system (e.g., a pure state preparation vs. a proper mixture). Is there necessarily a fact of the matter about the system's physical condition that is identical under P1 and P2?
      *   **Protocol/Argument:** Examine whether any future measurement statistics or operational tasks (including arbitrarily complex sequences of operations on the system and potentially entangled ancillas) can distinguish between the systems prepared by P1 and P2, *beyond* what is predicted by their identical density operator ρ. Quantum theory asserts they cannot (the "no-distinction theorem"). Both sides accept this operational equivalence as a crucial test.
      *   **Predictions:**
          *   *Psi-Ontic:* Predicts that if the density operator ρ is identical, then the underlying physical reality of the system is identical, regardless of preparation history. The two procedures prepare the *same* ontic state.
          *   *Psi-Epistemic:* Predicts that the underlying physical reality *can* differ between P1 and P2, despite the identical ρ and operational equivalence. The state ρ encodes the same information/expectations, but this information is compatible with distinct underlying physical states ("ontic states") in the world.

  4.  **Crux 2: Single System vs. Ensemble**
      *   **Case:** Consider a single, isolated quantum system prepared in a definite state but never measured. Is there a fact of the matter about "its quantum state" prior to any measurement, or do facts about the state only pertain to the statistics of measurement outcomes observed over an ensemble of identically prepared systems?
      *   **Protocol/Argument:** Analyze the explanatory power and necessity of attributing a state to a single system for predicting the outcomes of *counterfactual* measurements (what *would* happen *if* we measured a specific observable) and for explaining phenomena like interference, decoherence, or the no-signaling theorem in entangled scenarios involving single pairs. Both sides agree that ensemble statistics provide the empirical grounding, but the significance for the single system is contested. Consider whether explanations of single-system phenomena (e.g., a single atom's spontaneous emission statistics, or the behavior of a single particle in a double-slit setup without recording which slit) require attributing a state *to that individual system*.
      *   **Predictions:**
          *   *Psi-Ontic:* Predicts there is a fact of the matter about the state of the single, unmeasured system; it possesses definite properties (described by the state) that ground the truth of counterfactual claims and explain its future behavior or its role in non-local correlations.
          *   *Psi-Epistemic:* Predicts that the quantum state fundamentally describes potential measurement outcomes; while pragmatically useful for predicting the behavior of a single system, there is no further fact of the matter about "its state" beyond the dispositions revealed by actual measurements or the statistics of ensembles. Facts reside in the outcomes and their correlations.

  5.  **Verdict on Verbal Disputes:** Significant parts of the dispute hinge on the meaning of "real" and "state." If "real" is construed strictly as "causal difference-maker" and "state" as the specific mathematical object (vector/ray/density op) used predictively, the disagreement is largely substantive, centered on whether this predictive structure *must* reflect an underlying physical state (Crux 1) or governs single systems (Crux 2). However, the dispute becomes more verbal if:
      *   "Real" is broadened to include "indispensable to best explanation" without specification, as both sides claim indispensability but mean different things (predictive power vs. physical presence).
      *   "State" is conflated with the preparation procedure or the full set of constraints on future probabilities rather than a specific ontic referent.
      *   "Realness" is explicitly relativized to an observer or context; psi-epistemic views naturally accommodate this, while psi-ontic views typically reject it as fundamental. Relativization shifts the debate but doesn't resolve the core ontological commitment. Viewing the state as primarily law-like (a dynamical constraint) rather than thing-like also blurs the lines, as both sides can accept a law-like aspect while disagreeing on whether it governs an underlying reality (psi-ontic) or directly constrains possible experiences (psi-epistemic). The substantive core lies in the interpretation of preparation independence and single-system attribution.
