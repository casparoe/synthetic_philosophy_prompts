prompt: |-
  I'm prepping a session for our reading group on supererogation -- acts that go beyond the call of duty -- and I want us to start from the spec rather than from any one author. So before anyone assigns a paper, give me the desiderata: what any adequate theory of supererogation actually has to deliver.

  You're a philosopher who's spent a lot of time in normative ethics and on the deontic categories, so think this through carefully -- brainstorm first, then write the list. I don't want a literature summary or a tour of who said what; I want the requirements, each one tied to the case or consideration that motivates it.

  Some of the pressure points I want covered, though don't feel boxed in by my list:

  - The theory has to face the alleged paradox: if an act is morally better than its alternatives, it starts to look like the act you ought to do, which would make it required rather than optional -- and then it isn't supererogatory at all. Whatever the view is, it has to either dissolve this or explain why it's a pseudo-problem.
  - It has to respect the difference between the supererogatory and the merely permissible, and also the difference between the supererogatory and the obligatory. You can't just collapse "beyond duty" into "allowed" or into "required."
  - I keep getting stuck on cases where the sacrifice is basically free for the agent. A billionaire who gives away a tenth of their fortune does a lot of good but never feels it; someone who gives up a kidney, or a parent who wrecks their own health caring for a dying child, pays in a way that's hard to compare. The theory needs a principled line on whether cost to the agent belongs in the definition at all.
  - Related: is there such a thing as supererogation toward oneself? Can you go beyond the call of duty to yourself, or does the "call of duty" only bind you in relation to others?
  - And the treadmill worry: as an agent gets more virtuous, what used to be heroic becomes ordinary, and supererogation looks like it keeps evaporating. Does the theory survive that, or does it turn moral progress into a machine that deletes its own subject?
  - Whether supererogatory acts can be omissions and not just actions -- can declining to do something be beyond the call?

  For each requirement, give me the case or consideration behind it. Then tell me which requirements you think are non-negociable and which are really just hang-ups of particular camps. The part I most want is this: flag any pair or set of requirements you suspect can't all be satisfied at once, because if that's right, then the list itself is the result.

  Don't hedge into a survey -- take a definite position on the contested calls and give your reasons, even where you're not fully sure. I'd much rather argue with a committed list than a fence-sitting one. Finish with a line on which single requirement does the most work in ruling out the popular theories, and why.
reasoning: |-
  Okay, the user is prepping a reading group session on supererogation and wants desiderata for any adequate theory—basically the must-haves, not a literature review. They provided specific pressure points and want each requirement tied to a motivating case. Let me unpack their needs.

  First, they want the theory to handle the paradox: if an act is morally better, why isn't it obligatory? This is central because it challenges the very possibility of supererogation. Then, distinguishing supererogatory from merely permissible or obligatory acts is crucial; collapsing these categories undermines the concept. 

  The cost issue is tricky. Cases like a billionaire donating versus a parent sacrificing their health raise whether cost should factor into the definition. The user seems conflicted here, so the desideratum needs to address both angles. 

  Supererogation toward oneself is another point. Can you go beyond duty for yourself, or is it only others-oriented? This might involve self-regarding duties versus supererogatory self-care. 

  The treadmill problem: moral progress turning heroic acts into duties, erasing supererogation. Does the theory allow for shifting standards without eliminating the category? 

  Lastly, omissions—can not doing something be supererogatory? Like refusing a reward or not enforcing a right. 

  Now, considering possible conflicts. For instance, the paradox requirement might clash with maintaining a clear line between obligatory and supererogatory. If a theory resolves the paradox by allowing optional better acts, it must still prevent them from becoming obligatory. Also, incorporating cost could conflict with omission cases where the sacrifice isn't tangible. 

  The user’s deeper needs: they want a robust framework to evaluate theories, highlighting tensions that might make some desiderata incompatible. They’re likely aiming to spark critical discussion in their group, so the desiderata should expose foundational challenges. They also need clarity on non-negotiables versus contentious points to focus the debate. 

  I should prioritize the paradox and distinction requirements as non-negotiable since they’re core to supererogation’s coherence. Cost and self-directed aspects might be more debatable. The treadmill problem tests the theory’s adaptability over time, which is essential for real-world applicability. 

  The most critical requirement is likely the paradox resolution because many theories fail here, either collapsing supererogation into duty or permitting suboptimal acts. This is where utilitarianism struggles, for example. 

  Need to present each desideratum with a motivating case, flag conflicts, and take a stance. For instance, cost should be included but contextually, and self-supererogation is possible but secondary. Omissions count, and the treadmill requires a solution that preserves supererogation despite moral growth.
answer: |-
  Here’s a distilled list of desiderata for any adequate theory of supererogation, rooted in cases and core conceptual demands. I’ve flagged tensions, non-negotiables, and the key pressure point. My commitments are explicit.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  1. **Resolve the Paradox of Moral Worth**  
     *Case:* A medic jumps on a grenade to save comrades. This is morally better than diving for cover (saving only themselves), yet intuitively not *required*. If "morally best act = obligatory," supererogation collapses.  
     *Requirement:* The theory must explain why some morally optimal acts are *optional*, not obligatory.  
     *My Stance:* The paradox is real; solutions denying optional optimality (e.g., scalar utilitarianism) fail as theories *of supererogation*.

  2. **Tripartite Deontic Distinction**  
     *Case:* Donating $10 to charity (permissible), paying taxes (obligatory), donating a kidney to a stranger (supererogatory).  
     *Requirement:* Must sharply distinguish:  
     - Supererogatory ≠ Obligatory (no duty to donate kidney)  
     - Supererogatory ≠ Merely Permissible (donating kidney is praiseworthy; donating $10 isn’t).  
     *My Stance:* Collapsing supererogation into mere permissibility (e.g., some minimalist deontologies) voids the concept’s essence.

  3. **Accommodate Cost-Insensitive Cases**  
     *Case:* A billionaire anonymously donates $1M to save a hospital, feeling zero financial impact. Is this supererogatory?  
     *Requirement:* The theory cannot *define* supererogation by sacrifice alone. Some costless acts must qualify.  
     *My Stance:* Sacrifice is typical but not necessary. Supererogation hinges on *absence of requirement*, not presence of cost.

  ---

  ### **Contested but Necessary**  
  4. **Include Omissions**  
     *Case:* A judge declines a bribe (duty) vs. a victim *forgoes* rightful revenge against their tormentor (supererogatory mercy).  
     *Requirement:* Supererogation must encompass forbearances, not just actions.  
     *My Stance:* Omissions qualify—refusing a moral privilege (like revenge) can be beyond duty. Rejecting this narrows the domain arbitrarily.

  5. **Resolve the Treadmill Problem**  
     *Case:* A nurse who routinely works 80-hour weeks during pandemics. If heroism becomes habit, does it cease to be supererogatory?  
     *Requirement:* The theory must explain how moral progress doesn’t "absorb" supererogation into duty.  
     *My Stance:* Treadmill is fatal if unsolved. Supererogation must be agent-relative (e.g., tied to *expected* duty, not idealized virtue).

  ---

  ### **Contentious/Theory-Dependent**  
  6. **Address Self-Directed Supererogation**  
     *Case:* An artist destroys their masterpiece to avoid pride, or a monk undergoes extreme asceticism for spiritual growth.  
     *Requirement:* Must clarify whether duties-to-self can have "beyond duty" acts.  
     *My Stance:* Supererogation primarily concerns *other-regarding* duties. Self-directed "heroism" is either aesthetic or falls under prudence—not core to the moral concept.

  7. **Role of Sacrifice**  
     *Case:* Contrast billionaire’s donation (costless) vs. a pauper giving their last dollar (sacrificial). Both seem supererogatory, but praise-worthiness differs.  
     *Requirement:* Must explain if/how sacrifice affects *degree* of supererogation without being definitional.  
     *My Stance:* Sacrifice is a *magnifier* of moral worth, not a criterion for the category. The pauper’s act is *more* supererogatory, but both belong to it.

  ---

  ### **Tensions Between Desiderata**  
  - **Paradox vs. Treadmill:** Resolving the paradox often requires fixed deontic thresholds (e.g., "duty = minimal decency"). But this clashes with the treadmill, where thresholds seem to shift with agent capacity.  
  - **Cost-Insensitivity vs. Sacrifice Magnifier:** If supererogation doesn’t require cost, but cost amplifies its value, we need a unified account of "value beyond duty" that isn’t reducible to cost.  

  ---

  ### **The Most Damaging Requirement**  
  **Resolving the Paradox of Moral Worth** does the heaviest lifting. It rules out:  
  - **Classical Utilitarianism:** All optimal acts are obligatory → no room for optional goodness.  
  - **Kantian Rigorism:** If "ought implies can," heroic acts may become duties for capable agents.  
  - **Scalar Consequentialism:** Rejects binary oughts → supererogation dissolves into "better/worse."  

  *Why it’s decisive:* Any theory that cannot preserve *optional moral optimality* fails to capture supererogation’s core intuition. The solution (e.g., agent-centered prerogatives, dual-ranking systems, or non-maximizing deontology) defines the theory’s entire structure.

  ---

  **Final Position:** A viable theory must ground supererogation in a **non-maximizing moral framework** with **agent-relative permissions**, distinguishing *required minima* from *praiseworthy maxima*. Sacrifice is incidental; omissions count; self-directed cases are marginal; and the treadmill is solved by tethering duty to *reasonable expectations*, not variable virtue. The paradox isn’t pseudo—it’s the litmus test.
