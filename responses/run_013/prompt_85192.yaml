prompt: |-
  Me and my mate got into it for like two hours last night about group selection and honestly I still don't know if we were even disagreeing about the same thing.

  His line: the gene's-eye view is a modelling choice, not a discovery, and everything kin selection does, multilevel selection does too, same predictions, different bookkeeping, so when someone says "there's no such thing as group selection" they're smuggling a metaphysical claim into the maths. My line: a bookkeeping choice isn't nothing, and I don't think the two formalisms are as interchangeable as he says, because they seem to carve up the causal responsibility differently -- one of them ends up saying the group-level trait is doing the work, the other says it's the individuals' interactions and the group is just where the sums land. He said that's just taste. I said taste that changes what you go looking for isn't taste. He said it's like blaming a car crash on the driver versus on the laws of physics -- both true, one useless. Then he brought in the major transitions and human ultrasociality, I said half of that is kin selection with extra steps, and we went round again til he had to go pick up his kid.

  Anyway. I've got about a year of funded time before I have to commit to a thesis area, and I'd definately rather not spend it re-fighting this in slightly different vocabulary.

  So what are the actual open questions in the units-of-selection debate right now, and which ones matter most? I want the ordering and the reasons more than the list -- which questions are upstream of which, which are tractable with conceptual work rather than new data, which would change how people actually build models or design experiments if they got settled, and which are just verbal disputes wearing a lab coat. And tell me where I'm wrong about the equivalence thing, if I am, and whether "which unit is the *real* unit" is one of the live questions or the thing that dissolves when you ask it properly.

  Coming at this from philosophy, not a wet lab, so weight it for that.
