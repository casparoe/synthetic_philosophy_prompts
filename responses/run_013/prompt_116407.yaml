prompt: |-
  I run a monthly reading group for people who came to philosophy sideways — engineers, statisticians, longtime rationalist-blog readers — sharp and mathematically literate but with almost no exposure to twentieth-century epistemology, and next month I have ninety minutes on Moore's proof of an external world. I don't want you to explain the proof to me; I want you to plan how I should explain it. Assume nobody in the room has heard of Moore and that the only prior they bring is a general sympathy for the principle that extraordinary claims require extraordinary evidence, which will predispose them to assume the skeptic wins by default. Lay out the order in which the components have to arrive for the hand-raising to look like a serious philosophical move rather than a stunt: what must already be on the table before the gesture even makes sense (the form of the skeptical argument, the closure assumption it leans on, and the fact that Moore grants that assumption rather than attacking it), where the general argumentative shape — that one person's modus ponens is another's modus tollens — should be introduced relative to the specific case, and which piece has to come last so that the group's instinctive reaction gets reframed rather than merely contradicted.

  Then the pedagogical specifics. Tell me what should carry the whole session and why: whether the hands can bear that weight for this audience, or whether I should build the arc around a different case and let the hands arrive late as the historical punchline — and if the latter, what the substitute case must have and must not have (it should be something they already treat as more certain than any philosophical premise that could impugn it, and it must not be a case where they would happily say they merely believe it). Give me the misconceptions in the order this audience will actually form them. My guess at the list: that Moore is being cheeky, that he begs the question against the skeptic, that he is denying closure, that he confuses having a perceptual experience as of hands with knowing that one has hands, and that the whole thing is a verbal trick about the word know. For each, say exactly where in the sequence to head it off, and which ones I should let them voice first and dismantle themselves. I also want to fold in two threads I take to be load-bearing and that popular treatments usually flatten: first, that the real interest of the proof is not whether it works but what it reveals about which commitments we treat as bedrock and why; second, that asserting knowledge may be doing something different from reporting an inner state, so that relocating I know out of its ordinary use might be the actual error. Say which of those two belongs in the session, which I should cut for time and say out loud that I am cutting, and give me one closing question that would show whether they have grasped the shape of the disagreement rather than just memorized who said what.

  Finally, be candid about the fragility of your own plan. Tell me where the sequencing is most likely to fail with this particular audience, what I would observe in the room that would signal it has failed, and which argument or consideration would make you revise the order or the choice of carrying example. I would rather have a plan with a visible weak point than a smooth one that pretends the audience arrives neutral.
reasoning: |-
  Okay, let me start by understanding the user's request. They run a reading group for people with backgrounds in engineering, stats, and rationalist blogs. The topic is Moore's proof of an external world, and they need a pedagogical plan. The audience is mathematically literate but new to 20th-century epistemology. Their main challenge is that the group is predisposed to skepticism, thinking extraordinary claims need extraordinary evidence.

  First, I need to structure the session so Moore's hand-raising isn't seen as a stunt. The user mentioned several misconceptions: Moore being cheeky, begging the question, denying closure, confusing perception with knowledge, and it being a verbal trick. I should address these in sequence. 

  The key is to build up the skeptical argument first. The closure principle is crucial here. If the audience doesn't grasp that the skeptic uses closure and that Moore accepts it, the gesture won't make sense. Starting with a strong skeptical argument using closure will set the stage. 

  Then, introducing the modus ponens vs. modus tollens point early is important. Using a mathematical example, like the proof of the irrationality of sqrt(2), could help because it's familiar. This shows how the same logical structure can lead to different conclusions. 

  The hands example might not be the best starting point for this audience. They might dismiss it as a stunt. Instead, something they consider certain, like mathematical knowledge (2+2=4) or their own existence, could work better. But the user said it shouldn't be something they'd say they "merely believe." So maybe a simple sensory experience, but that risks the perception vs. knowledge confusion. Perhaps using the existence of the room they're in? The problem is they might still say they believe it rather than know it. 

  Wait, the user wants a substitute case that's treated as more certain than any philosophical premise. Maybe their own thought processes? Descartes' cogito? But that might lead to abstract discussions. Another idea: the reality of the screen they're looking at if it's an online group, or the chair they're sitting on. But again, similar issues as hands. 

  Alternatively, a logical or mathematical certainty. But Moore's point is about empirical knowledge. Balancing this is tricky. Maybe start with a math example to illustrate modus ponens/tollens, then transition to empirical with something less charged than hands, like a pencil or cup in the room. Then reveal that Moore used hands as the historical example. 

  For misconceptions: the cheekiness and question-begging should be addressed by showing that Moore accepts the skeptic's premises and uses closure. Let the audience voice the cheekiness first, then dismantle it by showing the logical structure. 

  The confusion between perception and knowledge needs clarification early. Distinguish between the experience and the claim of knowledge. The verbal trick about "know" can be addressed by discussing ordinary language use versus philosophical skepticism. 

  The two deeper threads: the bedrock commitments and the performative aspect of "I know." The user wants to include one. The performative aspect might be more accessible. Pointing out that asserting knowledge is a move in a language game, not just describing a state. This ties into Wittgenstein and could resonate with their rationalist background. 

  Closing question: ask them to formulate where Moore and the skeptic disagree, given they share premises. This tests understanding of the logical structure. 

  Fragility: if the audience doesn't accept the substitute case as certain, the whole thing fails. Observing pushback on the example choice would signal this. Have backup examples ready, like a simple object in the room. Also, if they resist the closure principle, need to reinforce it with logical examples they accept. 

  Need to ensure the sequence builds logically, preempting misconceptions at each step. Let them voice doubts early but structure the discussion to resolve them through the flow. Time is tight, so focus on the essential: the logical move, not historical details. Cut the bedrock commitments if needed, explicitly stating so.
answer: |-
  Here’s a battle-tested plan optimized for your audience, designed to reframe instincts rather than overwhelm them. The fragility is real (I’ll flag where), but the structure forces engagement with Moore’s core move.

  ### **Core Sequence: The Logical Scaffolding**
  *(Timing: ~60 mins)*  
  1.  **Skeptic’s Argument First (15 mins)**  
      - **Start with their prior**: "Extraordinary claims need extraordinary evidence." Pose the skeptic’s challenge: *"Can you prove an external world exists?"*  
      - Formalize the **Dream Argument** (simplified):  
        `P1: If I know I have hands, I must know I’m not dreaming.`  
        `P2: I cannot know I’m not dreaming.`  
        `∴ I don’t know I have hands (and by extension, anything about the external world).`  
      - **Crucial**: Highlight the **closure principle** (if you know P, and P entails Q, you must know or be able to know Q). *This is what the skeptic leans on*.  
      - *Audience buy-in*: Engineers respect formal logic. Let them solidify skepticism here.  

  2.  **Moore’s Grant (5 mins)**  
      - Explicitly state: **Moore accepts both premises and closure**. He doesn’t attack the skeptic’s logic. *This disarms the "he’s denying closure" misconception early*.  
      - **Key transition**: "So if the logic is sound, how can Moore claim to prove an external world?"  

  3.  **Introduce the Modus Ponens/Tollens Frame (10 mins)**  
      - **Use a math example they respect**:  
        *Skeptic’s Structure*:  
        `If √2 is rational, then it can be expressed as a/b (simplest terms).`  
        `It cannot be expressed as a/b.`  
        `∴ √2 is irrational.` (Modus Tollens)  
        *Moore’s Flip*:  
        `If √2 is rational, it can be expressed as a/b.`  
        `√2 *can* be expressed as a/b (assume false premise).`  
        `∴ √2 is rational.` (Modus Ponens)  
      - **Point**: Same valid form, opposite conclusions. Choice depends on which premise you trust more.  

  4.  **Moore’s Gesture (The Substitute Case First!) (20 mins)**  
      - **DO NOT START WITH HANDS**. Use a case they *already* treat as bedrock:  
        > *"I know that 2 + 2 = 4."*  
      - **Build the skeptic’s attack**:  
        `P1: If I know 2+2=4, I must know no evil demon is deceiving me.`  
        `P2: I cannot know no evil demon is deceiving me.`  
        `∴ I don’t know 2+2=4.`  
      - **Moore’s response**: "But I *do* know 2+2=4. Therefore, I *can* know no evil demon is deceiving me (or that the skeptical hypothesis is false)."  
      - **Why this works**:  
        - They won’t say they "merely believe" 2+2=4—they’ll insist they *know* it.  
        - It’s mathematically certain, sidestepping perception issues.  
        - Reveals the logical move (Modus Ponens) without perceptual baggage.  
      - *Now* introduce hands as Moore’s *empirical* example: "He applied this same logic to sensory knowledge."  

  5.  **The Historical Punchline: Hands (5 mins)**  
      - Display Moore’s actual gesture: "Here is one hand, here is another."  
      - Emphasize: **This is the same Modus Ponens move applied to perception**.  
      - Connect: "Just as with 2+2=4, Moore treats ‘I have hands’ as more certain than the skeptic’s premise."  

  ---

  ### **Tactical Misconception Management**
  *(Address as they arise, but preempt strategically)*  
  - **"He’s being cheeky/begging the question"**:  
    - **Preempt at Step 2 (Moore’s Grant)**. Stress he *accepts* the skeptic’s premises/closure. His move is logical, not rhetorical.  
    - **Let them voice it early**, then dismantle: "If he’s begging the question, *which premise* is he assuming? The skeptic assumes P2—Moore assumes the opposite."  

  - **"He denies closure"**:  
    - **Crush at Step 2**. Moore explicitly endorses closure. His proof relies on it.  

  - **"Perception ≠ Knowledge"**:  
    - **Preempt with the math case (Step 4)**. Once they accept Modus Ponens works for math, hands become harder to dismiss.  
    - **Clarify during hands example**: Moore isn’t saying perception *guarantees* truth; he’s saying we *treat* certain perceptions as knowledge-foundations.  

  - **"Verbal trick about ‘know’"**:  
    - **Save for last**. Let this emerge, then pivot to the **performative thread**:  
      > "When Moore says ‘I know I have hands,’ is he *reporting a mental state* or *making a claim in a context*? If ‘I know’ is a move in a language-game (like promising), doubting it *outside that game* might be the error."  

  ---

  ### **Deep Threads & Cuts**  
  - **Include**: The **performative aspect of "I know"** (10 mins).  
    - *Why*: Connects to language-use (familiar to rationalists). Ask: "When you say ‘I know the code works’ at work, are you reporting infallibility or staking your credibility?"  
    - *Pedagogical hook*: It explains why Moore’s gesture feels legitimate—it’s how "know" functions socially.  
  - **Cut Explicitly**: **Bedrock commitments/why**.  
    - *Why*: Time. It requires meta-epistemology (Wittgenstein, hinge propositions). Say: "We’re skipping *why* some claims become bedrock—that’s next month’s topic on ‘On Certainty.’"  

  **Closing Question**:  
  > *"If Moore and the skeptic agree on the closure principle and the form of the argument, what is the *real* disagreement about?"*  
  *(Target answer: Which premises we treat as immune to doubt.)*  

  ---

  ### **Fragility & Recovery Plan**  
  1.  **Weak Point: The Math Case Failing**  
      - *Risk*: Audience says, "But 2+2=4 *is* certain—hands aren’t!" They reject the analogy.  
      - *Signal*: Pushback like, "Skepticism only applies to empirical things!" or "Math is analytic—this is cheating."  
      - **Revision**: Swap to **cogito-like certainty** ("I know I exist"). If that fails, use **"I know I’m in [this room]"** (but stress it’s not "belief").  

  2.  **Weak Point: Closure Rejection**  
      - *Risk*: Engineers may attack closure (e.g., "I know P without knowing all entailed Qs!").  
      - *Signal*: "But that premise is unrealistic!" or debates about knowability.  
      - **Revision**: Isolate closure as the skeptic’s tool. Say: "Whether *we* accept closure, the skeptic *does*—and Moore fights *on their turf*. Grant it temporarily to see his move."  

  3.  **Weak Point: Obsession with Evidence**  
      - *Risk*: "Where’s Moore’s *evidence* against dreaming?" (Missing the point).  
      - *Signal*: Demands for "extraordinary evidence" for hands.  
      - **Revision**: Reiterate Step 4: Moore’s "evidence" is the greater *certainty* of hands over skeptical premises. Ask: "What evidence would *you* accept for not dreaming? If none, is skepticism unfalsifiable?"  

  **Carry the Session With**: The **math case → modus tollens/ponens frame**. Hands are the memorable demo, but the logical pivot must land first. Your audience admires structural ingenuity—show them Moore’s move as a masterful exploit of shared rules.  

  > "Moore doesn’t defeat the skeptic; he exposes that the skeptic’s victory depends on us prioritizing doubt over ordinary certainty. The proof is a mirror."  
  > — End here. Let them stare into it.
