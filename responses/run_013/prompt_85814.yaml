  - Change: Vendor must retrain the model with appropriate data and provide ongoing monitoring. Hospital must implement a validation process for any machine learning model, including demographic fairness checks. If the vendor does not fix the model, the hospital must decommission it.

  But note the repair gap: The hospital cannot change the model. So we assign to the vendor, but if the vendor fails, the hospital must remove the model. Therefore, the change responsibility is shared.

  *Output*:
  - Gaps: Repair gap (because the hospital cannot change the vendor's model, so the capacity to change lies with the vendor).
  - Explain: Vendor (for model behavior) and Hospital (for deployment decision and validation).
  - Repair: Hospital (to the patient) and Vendor (to the hospital, for costs incurred and for fixing the model).
  - Change: Vendor (to fix the model) and Hospital (to validate models before deployment and monitor outcomes; if the vendor doesn't fix, decommission).
  - Unallocated: None.

  But note: The repair gap exists because the hospital cannot directly change the model. Therefore, the change assignment to the vendor is critical. If the vendor is unresponsive, the hospital must change its own processes to stop using the model.

  ---

  **Case 3: Surgical robot whose manufacturer pushed a software update changing force limits after the hospital's biomedical team had approved an earlier version.**

  *Incident Reconstruction*:
  - The manufacturer pushed a software update without the hospital's approval (or without the biomedical team's re-approval). The update changed force limits, leading to an incident.

  *Gap Diagnosis*:
  - **Answerability**: The update caused the change in behavior. The manufacturer can explain why the update was pushed and what changed. The hospital might not have known about the update. No gap.
  - **Liability**: The manufacturer pushed the update without proper approval. The hospital might have a process that allowed automatic updates. The manufacturer might be liable for the harm. The hospital might share liability for allowing automatic updates. No gap.
  - **Repair**: The manufacturer can roll back the update or adjust it. The hospital can change its update approval process. No gap.

