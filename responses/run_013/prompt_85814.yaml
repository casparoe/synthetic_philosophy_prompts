  We are building an operational decision procedure for a hospital incident-review panel to allocate forward-looking responsibilities after an incident involving an autonomous system. The procedure must be practical for a non-specialist panel with two hours per case, access to logs and interviews, and no legal authority. The output must assign: who must explain (answerability), who must repair (repair), who must change the system (to prevent recurrence), and what cannot be allocated.

  The procedure is built around three gaps:
  1. Answerability gap: No one can give an adequate account of why the system acted.
  2. Liability gap: No one can be made to bear the cost (but note: we are not making legal findings, so we focus on who should bear the cost in a forward-looking sense, e.g., compensation or taking on the burden of improvement).
  3. Repair gap: No one has the standing or capacity to change the system.

  The procedure should diagnose which gaps are present (one, two, or all three) before assigning responsibilities.

  Steps of the Procedure:

  1. **Incident Reconstruction (30 minutes)**
     - Review logs and conduct brief interviews (if possible within time) to reconstruct the incident timeline.
     - Identify the key decision points and the actors (human and machine) involved.
     - If logs are missing, note the missing data and infer from available evidence. If critical data is missing, flag an answerability gap.

  2. **Gap Diagnosis (30 minutes)**
     - **Answerability gap**: Can the panel reconstruct a clear causal chain? If not, or if there's insufficient explanation for the system's behavior, mark this gap.
     - **Liability gap**: Consider who can reasonably bear the cost (in terms of compensation, taking blame, or investing in fixes). If no individual or entity is clearly appropriate (e.g., due to diffusion of responsibility, or the cost is too high for one party), mark this gap. Note: We are not assigning legal liability but forward-looking responsibility to cover costs (e.g., the hospital might cover medical costs).
     - **Repair gap**: Check if there is a clear party with the authority and capability to change the system to prevent recurrence. If the system is a black box, the vendor is unresponsive, or the hospital lacks control, mark this gap.

  3. **Assignment of Responsibilities (60 minutes)**
     - Based on the gaps present, assign responsibilities:
       - **Explain (Answerability)**: Assign to the party that is best positioned to investigate and provide an account. This might be the vendor (for the system's internal logic) or the hospital (for the context of use). If there's a gap, then the assignment might be to a committee or to multiple parties to jointly investigate and report.
       - **Repair (Liability)**: Assign the responsibility for immediate redress (e.g., covering costs of harm, apologizing, providing additional care). This is often the hospital because it is the provider of care, but might be shared with the vendor or manufacturer if they contributed to the harm.
       - **Change (Repair)**: Assign the responsibility for long-term fixes. This might be the vendor (to update the model), the hospital (to change protocols or training), or a regulatory body (if beyond the hospital's control). If there's a repair gap, the assignment might be to advocate for system change at a higher level or to decommission the system.

  4. **Handling Special Cases**:
     - **Missing logs**: If logs are missing, the panel should note the impact on answerability and assign the responsibility for improving logging (to the hospital IT or the vendor). The incident reconstruction might be incomplete, leading to an answerability gap.
     - **Defunct contractor**: If the relevant designer is defunct, then the repair gap is present. The hospital must take responsibility for finding an alternative solution (e.g., replacing the system) and the liability might fall to the hospital as the user of the system.
     - **Combined system (vendor model + hospital workflow + clinician judgment)**: Break down the incident into the contributions of each component. Assign responsibilities accordingly. For example, the vendor for the model flaws, the hospital for workflow issues, and the clinician for judgment errors (if any).

  5. **Value Decisions**: The panel must make value judgments at several points:
     - How much risk is acceptable? (e.g., when overriding alerts is allowed)
     - Whose consent counts? (e.g., when a software update is pushed without the hospital's approval)
     - What level of explanation is adequate? (e.g., for a machine learning model, is a high-level feature importance enough, or is full transparency required?)

  6. **Output Format**: The panel must produce a written allocation with:
     - Which gaps are present (answerability, liability, repair).
     - Assignments:
        - Explain: [Party or parties]
        - Repair: [Party or parties]
        - Change: [Party or parties]
     - Unallocated: [What cannot be assigned and why]

  The procedure avoids metaphysical debates (e.g., free will) by focusing on practical control and capacity. If a debate about free will would arise (e.g., in determining if a human override was truly free), the panel should instead look at the protocols and training that were in place and assign responsibility based on the design of the system and the institution.

  Now, run the procedure on the three cases.

  ---

  **Case 1: Autonomous infusion pump that delivered a dose outside protocol because a nurse overrode an alert.**

  *Incident Reconstruction*:
  - The pump had an alert that the dose was outside protocol. The nurse overrode the alert and administered the dose. The patient deteriorated.

  *Gap Diagnosis*:
  - **Answerability**: The pump's alert was clear, and the nurse's reason for override (if documented or from interview) might be known. No gap.
  - **Liability**: The nurse and the hospital might be liable, but the nurse acted against the alert. The hospital might bear liability for training and protocols. However, we are not assigning legal liability. The cost of repair (e.g., compensating the patient) would typically fall to the hospital. The nurse might be subject to disciplinary action. No gap.
  - **Repair**: The hospital can change training and protocols. The pump vendor might adjust the alert system. No gap.

  *Assignment*:
  - Explain: The nurse must explain why the override was done (if not documented, then the hospital must ensure such explanations are part of the protocol). The hospital must review the adequacy of the alert and the override protocol.
  - Repair: The hospital (as the provider) must cover the costs of harm and provide redress.
  - Change: The hospital must revise training on when overrides are appropriate and consider if the alert was too easy to override. The vendor should be asked to review the alert design (e.g., requiring a second nurse to approve overrides).

  *Output*:
  - Gaps: None.
  - Explain: Nurse (for the specific override decision) and Hospital (for the protocol and training context).
  - Repair: Hospital.
  - Change: Hospital (training and protocol) and Vendor (pump alert design).
  - Unallocated: None.

