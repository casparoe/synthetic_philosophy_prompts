  *Value Decision*: The panel must decide if the hospital's approval is required for updates. This is a value judgment about control and risk.

  *Assignment*:
  - Explain: Manufacturer must explain why the update was pushed without re-approval (if required) and why the force limits were changed. Hospital must explain why their update process allowed this (if it did).
  - Repair: Manufacturer must cover the costs of harm and provide compensation. Hospital must provide patient redress and then seek reimbursement from the manufacturer.
  - Change: Manufacturer must change its update policy to require explicit approval for changes that affect safety-critical parameters. Hospital must change its process to disable automatic updates and require re-approval for any update.

  *Output*:
  - Gaps: None.

