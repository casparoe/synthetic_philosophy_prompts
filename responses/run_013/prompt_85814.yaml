answer: |-
  ### Operational Decision Procedure for Incident-Review Panel  
  **Purpose**: Diagnose gaps (answerability, liability, repair) and assign forward-looking responsibilities for incidents involving autonomous systems. Outputs: Who must *explain*, who must *repair* (redress harm), who must *change* (prevent recurrence), and what is unallocated. Time: 2 hours per case.  

  #### Procedure Steps  
  1. **Reconstruct Incident (20 min)**  
     - Review logs, conduct brief interviews (if feasible).  
     - Identify: System components (vendor model, hospital workflow, human actions), key decisions, and harm.  
     - **Missing logs**: Flag answerability gap; assign "explain" to the party responsible for logging (e.g., hospital IT if internal, vendor if external). Treat gaps in data as evidence of answerability issues.  

  2. **Diagnose Gaps (30 min)**  
     - **Answerability gap**: Is there no adequate account of *why* the system acted? (e.g., no rationale for ML output, unclear override reason).  
     - **Liability gap**: Is there no party that can reasonably bear the cost? (e.g., harm is diffuse, costs exceed capacity, defunct contractor).  
     - **Repair gap**: Is there no party with standing/capacity to *change* the system? (e.g., vendor controls software, hospital lacks authority).  
     - *Output gaps present (0–3)*.  

  3. **Assign Responsibilities (40 min)**  
     - **Explain**: Assign to parties who can investigate and justify actions (e.g., vendor for system logic, clinician for judgment, hospital for context).  
     - **Repair**: Assign to parties who can redress harm (e.g., hospital for patient care, vendor for compensation).  
     - **Change**: Assign to parties who can modify the system (e.g., hospital for protocols, vendor for software, regulatory body for standards).  
     - **Unallocated**: Note responsibilities that cannot be assigned due to gaps (e.g., "explain" if answerability gap is irreparable).  
     - **Rules**:  
       - Prioritize named individuals only for specific actions (e.g., "Dr. Smith must explain override"); else, assign to roles/institutions (e.g., "nursing supervisor role").  
       - For combined systems (vendor + hospital + human), split assignments by contribution (e.g., vendor for model flaws, hospital for workflow).  
       - **Defunct contractor**: Assign "repair" to hospital (cost-bearing) and "change" to hospital (decommission or replace); flag liability/repair gaps.  
       - **Value decisions required** (panel must decide, not discover):  
         - Acceptable residual risk (e.g., when overrides are permissible).  
         - Whose consent counts (e.g., vendor vs. hospital for updates).  
         - Adequacy of explanation (e.g., is "black-box" ML output sufficient?).  
     - Avoid metaphysical debates (e.g., free will): Focus on control, capacity, and protocols. If debate arises (e.g., "was override truly voluntary?"), set aside and assign based on design/training.  

  4. **Finalize Output (30 min)**  
     - Write allocation: Gaps present, assignments (explain/repair/change), unallocated.  
     - Use template:  
       ```  
       Gaps: [answerability, liability, repair]  
       Explain: [Parties]  
       Repair: [Parties]  
       Change: [Parties]  
       Unallocated: [Reason]  
       ```  

  ---

  ### Case Applications  
  **Case 1: Autonomous infusion pump overdose due to nurse override**  
  - **Incident**: Nurse overrode pump alert; dose outside protocol harmed patient.  
  - **Gaps**: None (answerability: reason for override clear; liability: nurse/hospital can bear cost; repair: hospital/vendor can change protocols/design).  
  - **Value decisions**: Panel must define acceptable override risk (e.g., "overrides allowed only with second nurse approval").  
  - **Output**:  
    ```  
    Gaps: None  
    Explain: Nurse (reason for override), Hospital (protocol adequacy)  
    Repair: Hospital (patient compensation)  
    Change: Hospital (revise override training), Vendor (redesign alert to require dual verification)  
    Unallocated: None  
    ```  

  **Case 2: Triage model under-ranks demographic group due to biased training data**  
  - **Incident**: Model trained on non-representative data; patient deprioritized, deteriorated.  
  - **Gaps**: Repair gap (hospital cannot modify vendor's model; vendor must fix).  
  - **Value decisions**: Panel must decide adequacy of consent (e.g., did hospital "consent" to risk by not auditing model?).  
  - **Output**:  
    ```  
    Gaps: Repair  
    Explain: Vendor (model bias cause), Hospital (deployment validation failure)  
    Repair: Hospital (patient redress), Vendor (reimburse hospital)  
    Change: Vendor (retrain model with local data), Hospital (implement audit protocol; decommission if vendor non-compliant)  
    Unallocated: None  
    ```  
  - **Philosophical resistance**: Assigning "repair" to hospital (not vendor) for patient harm may feel unfair, but hospital is care provider and bears immediate burden.  

  **Case 3: Surgical robot update changed force limits without hospital re-approval**  
  - **Incident**: Vendor pushed update post-approval; new force limits caused harm. Manufacturer is defunct contractor.  
  - **Gaps**: Answerability gap (why force limits changed? defunct vendor can’t explain), Liability gap (defunct vendor can’t bear cost), Repair gap (hospital can’t modify defunct vendor’s software).  
  - **Value decisions**: Panel must define whose consent counts for updates (e.g., vendor cannot push without hospital re-approval).  
  - **Output**:  
    ```  
    Gaps: Answerability, Liability, Repair  
    Explain: Hospital (document incident; note vendor’s absence)  
    Repair: Hospital (patient compensation; absorb cost)  
    Change: Hospital (decommission robot; update procurement policy to require code escrow)  
    Unallocated: Full explanation (vendor defunct), Software repair (vendor defunct)  
    ```  

  ---

  ### Default Allocation for All Three Gaps  
  When answerability, liability, and repair gaps are all present (e.g., Case 3), responsibilities default to the hospital as the institution of last resort. The hospital must:  
  - **Explain**: Document the incident and gaps.  
  - **Repair**: Absorb costs and redress harm.  
  - **Change**: Decommission the system and advocate for systemic fixes (e.g., regulatory changes).  
  This is labeled **institution-first** (hospital bears unallocable burdens).  

  \answer{institution-first}
