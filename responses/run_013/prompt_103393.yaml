  First, I need to unpack the core frustration: it's about an argumentative tactic that seems immune to counterevidence. The user gives two concrete examples - one from language acquisition (Chomskyan debates) and one from ML scaling arguments. The central ask is whether this tactic has a name and how to distinguish legitimate versions from rhetorical dodges.

  The user's technical background shows in their precise framing - they're clearly thought deeply about this. Their request for British English and "don't just hand me a label" suggests they want substantive analysis, not just terminology. They're also self-aware about potential philosophy term mangling, so I'll need to clarify concepts carefully.

  Hmm... the key elements seem to be:
  - Claim: Ability X can't be learned, must be innate
  - Counter: System learns X from data
  - Rebuttal: But the learning mechanism itself has innate structure
  - Loop repeats with the "innate" label shifting downward

  This feels familiar from philosophy of cognitive science debates. The nearest established concept is indeed the "poverty of the stimulus" argument, but as the user suspects, that's more specific. What they're describing is how POS arguments can morph into something more slippery.

  The tactic reminds me of what philosophers call "trivializing nativism" - where any successful learning is reinterpreted as proof of prior structure, making nativism unfalsifiable. That might be the label they need. But I should also address the ML parallel they mention, where "scale trumps bias" becomes the counter-dogma.

  Important to distinguish:
  1) Legitimate arguments about necessary architectural priors (e.g. convolutional nets needing translation equivariance for vision)
  2) Rhetorical moves that preserve nativism by redefinition

  The boundary lies in falsifiability and specificity. A legitimate claim specifies what minimal structure is truly unlearnable and could in principle be tested. The dodgy version keeps retreating to vaguer "something must be innate" claims.

  For the ML side, the "scaling solves everything" view risks its own overreach - sometimes architectural biases are genuinely efficient. But both extremes can become non-falsifiable.

  I'll structure the response by:
  1) Naming the tactic (trivializing nativism) with sources
  2) Explaining how it relates to poverty of stimulus
  3) Analyzing the ML parallel
  4) Giving clear criteria to distinguish substantive vs dodgy arguments
