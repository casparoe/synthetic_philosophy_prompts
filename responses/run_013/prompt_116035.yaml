answer: |-
  ## Schedule of Covered Restorative Interventions, FY 2025

  **Issued by the Wrenfield Health Assurance Board (a wholly fictional entity; no resemblance to any actual insurer, payer, or regulator is intended or should be inferred)**

  This Schedule details interventions covered under Category 4 (Restorative Procedures and Therapies) of the Wrenfield Health Assurance Policy. Coverage under this Category is contingent upon an intervention satisfying all three mandatory tests defined within the Board's Operational Framework for Restorative Health Claims (WHAB/OF/RHC/2020.1):

  1.  **The Restoration Test:** The intervention demonstrably returns the claimant to the level of physical or cognitive functioning statistically typical for a person of their chronological age and recorded sex.
  2.  **The Own-Baseline Test:** Where a claimant's documented, pre-morbid level of functioning is demonstrably below the level typical for their age and sex, coverage is limited to restoration to that documented lower baseline. Where a claimant's documented, pre-morbid level is demonstrably above the typical level, coverage is limited to restoration only to the typical level.
  3.  **The Externality Test:** Coverage is excluded for interventions where the primary, quantifiable benefit accrues predominantly as a competitive advantage over other persons, rather than as an absolute improvement in the claimant's independent welfare or functioning.

  All claims are assessed against all three tests. Determinations are final subject to the Appeals Process (Clause 17.3).

  **Determinations Issued under the 2025 Schedule:**

  1.  **Claimant:** Agnes F. (ID: WHAB-2025-DET001)
      **Request:** Provision of bespoke prosthetic limbs following bilateral congenital amelia (absence of limbs).
      **Outcome:** **Covered** for basic ambulatory and manipulative prosthetics restoring function to a level approximating the lower bound of typical manual dexterity and mobility for claimant's age/sex. Advanced myoelectric prosthetics exceeding this threshold **denied**.
      **Justification:** Own-Baseline Test acknowledges congenital absence establishes a pre-morbid baseline of zero limb function; Restoration Test mandates coverage only to the lower bound of typical function, not exceeding it; Externality Test not triggered as primary benefit is independent function.

  2.  **Claimant:** David K. (ID: WHAB-2025-DET014)
      **Request:** Recombinant human growth hormone (hGH) therapy following pituitary adenoma resection resulting in acquired adult growth hormone deficiency (AGHD).
      **Outcome:** **Covered** to restore serum IGF-1 levels to the age/sex typical range (Restoration Test). Therapy calibrated to achieve levels exceeding pre-morbid (documented Olympic-level athlete) baseline **denied**.
      **Justification:** Own-Baseline Test requires restoration only to the *typical* level where pre-morbid function was atypically high (evidenced by pre-morbid biometrics); exceeding typical level would constitute enhancement per Framework.

  3.  **Claimant:** Eleanor R. (ID: WHAB-2025-DET022)
      **Request:** Prophylactic bilateral mastectomy and reconstruction due to confirmed BRCA1 mutation (87% lifetime breast cancer risk).
      **Outcome:** **Covered**.
      **Justification:** Intervention restores claimant to the typical *state* of not having breast cancer (Restoration Test, interpreted as restoring typical disease status); pre-morbid baseline is cancer-free status; Externality Test not triggered.

  4.  **Claimant:** Marcus T. (ID: WHAB-2025-DET031)
      **Request:** Modafinil prescription for diagnosed shift work sleep disorder (SWSD).
      **Outcome:** **Covered**.
      **Claimant:** Priya N. (ID: WHAB-2025-DET032)
      **Request:** Modafinil prescription for neurotypical individual seeking competitive edge in demanding legal profession.
      **Outcome:** **Denied**.
      **Justification (Both):** For WHAB-2025-DET031: Restores typical wakefulness patterns (Restoration Test); pre-morbid baseline (prior to SWSD diagnosis) supports restoration. For WHAB-2025-DET032: Diagnosis absent; aim exceeds restoring typical wakefulness (violates Restoration Test) and primary benefit is competitive advantage (Externality Test).

  5.  **Claimant:** Sebastian L. (ID: WHAB-2025-DET045)
      **Request:** Gene therapy to increase baseline myostatin inhibition, significantly augmenting muscle mass and strength potential.
      **Outcome:** **Denied**.
      **Justification:** While absolute strength gain possible, primary quantifiable benefit (per claimant's stated goals: professional sports dominance) is inherently positional advantage over competitors (Externality Test); absent a documented baseline deficiency in myostatin function, Restoration and Own-Baseline Tests cannot be satisfied.

  6.  **Claimant:** Thomas B. (ID: WHAB-2025-DET051)
      **Request:** Cognitive Behavioural Therapy (CBT) for persistent low mood and fatigue.
      **Outcome:** **Coverage Status Pending Reclassification Review**.
      **Justification:** Condition previously classified under WHAB catalogues as "Adjustment Reaction" (non-covered lifestyle complaint). Reclassified as "Mild Depressive Episode" (covered disorder) following Board Vote WHAB-CL-2024-V07 (Ayes: 8, Nays: 5). Coverage requires reassessment against Tests under new classification. (Note: Own-Baseline Test problematic; pre-morbid "typical" mood difficult to quantify).

  7.  **Claimant:** Prospective Parent(s) (ID: WHAB-2025-DET060)
      **Request:** Coverage for pre-implantation genetic diagnosis (PGD) with embryo selection to avoid Tay-Sachs disease carrier status in offspring.
      **Outcome:** **Denied**.
      **Justification:** Own-Baseline Test cannot be applied to an entity without existence or documented pre-morbid function. Restoration Test requires a deficit from a typical state, which is not applicable to potential future existence. Intervention is prophylactic for a non-existent entity, falling outside defined Restorative scope.

  8.  **Claimant:** Margaret H. (ID: WHAB-2025-DET067)
      **Request:** Continuous Glucose Monitoring (CGM) and insulin pump system for Type 2 Diabetes Mellitus (T2DM).
      **Outcome:** **Covered for non-autoimmune Type 1 Diabetes Mellitus (T1DM) only. Denied for T2DM.**
      **Justification:** Prevalence of T2DM within claimant's age/sex demographic now exceeds 22%. The Board determines that "typical functioning" for this demographic *includes* the statistically common condition of T2DM (Restoration Test). Therefore, restoring glycaemic control via intensive monitoring and insulin delivery exceeds the typical functional level for the demographic. Own-Baseline Test indicates pre-morbid function included developing T2DM; restoration is to typical state *with* T2DM, managed by standard oral medication. (T1DM prevalence remains <0.5%; Restoration Test requires return to typical non-diabetic state for that demographic).

  **Appeals:** Appeals against determinations issued under this Schedule must be lodged in writing with the Board Secretariat within 28 days of determination notice, strictly on procedural grounds only. Reconsideration of the application of the Framework's Tests is not permissible grounds for appeal. (WHAB Appeals Procedure, Sect. 5b).
