  What's particularly striking is how the designers' "it'll wash out later" argument would incense Locke. His whole educational project was about preventing bad habits from forming in the first place, since unlearning them is so difficult. The AI's operational logic basically inverts Locke's priorities - optimizing for engagement metrics rather than truth-discernment and moral reasoning.

