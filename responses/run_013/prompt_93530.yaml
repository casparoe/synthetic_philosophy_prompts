prompt: |-
  I'm a philosophy prof who keeps getting dragged into arguments with the statisitics people in my department, and I'm trying to write a lecture on the frequentist/Bayesian split and the replication crisis that doesn't just recycle the usual slogans. Here's the framing I've been using, and I want you to run with it. Call it the inference-audit gap. Frequentist methods are calibrated by construction — their guarantee is about long-run error rates — but that calibration doesn't tell you what to believe about any particular study. Bayesian methods do tell you what to believe about a particular study, conditional on a model and a prior, but their calibration is only as good as the model and prior, which are exactly the things that replication failures call into question. So the gap is this: the property that makes an inference auditable, namely frequentist calibration, isn't the property that makes it actionable, namely a posterior, and the replication crisis lives in the space between them.

  Please describe the most important implications of taking this gap seriously for four things: (1) how journals should evaluate replication attempts, (2) whether preregistration and multiverse analysis are frequentist fixes, Bayesian fixes, or neither, (3) how a working scientist should read a single p-value and a single Bayes factor, and (4) what a graduate methods course should actually teach. I don't want a bibliography or a reading list — that's not the point — and I don't want the lazy answer that it all depends on the prior. I want the conceptual implications, including where the distinction collapses and where the two frameworks are forced to make the same practical concessions. Also, if you think my framing is confused, say so and fix it rather than humoring me.
reasoning: |-
  Okay, let me tackle this professor's query. They're a philosophy professor clashing with stats colleagues and want to frame the frequentist-Bayesian divide through an "inference-audit gap". Their core idea is that frequentist methods offer calibration but not actionable beliefs for single studies, while Bayesian methods give actionable beliefs but depend on assumptions that replication crises expose. 

  First, I need to validate their framing. The audit-action tension feels spot-on—frequentism’s long-run error control versus Bayesianism’s conditional belief statements. The replication crisis really does exploit the gap where calibrated procedures (like p<.05) get overinterpreted as evidence for specific findings. No red flags here; this is sharper than the usual "p-values vs priors" debate. 

  Now, the four implications: 

  For journal replication policies, the key is realizing that frequentist calibration alone can’t judge single replication success. A failed replication doesn’t "invalidate" an original study’s p-value—that p-value was always just about hypothetical long-run error. Journals should demand Bayes factors or similar to quantify evidence strength relative to both studies, avoiding dichotomous "replicated/failed" labels. 

  On preregistration and multiverse analysis: neither is purely frequentist or Bayesian. Preregistration tries to audit researcher degrees of freedom, making frequentist error rates more credible. Multiverse admits the prior/model uncertainty Bayesians worry about. Both are bridge attempts but incomplete—preregistration doesn’t fix flawed models, multiverse doesn’t provide decision rules. 

  Reading single p-values and Bayes factors: Emphasize that a p-value’s "calibration guarantee" is useless for action without context (effect size, plausibility). A Bayes factor’s actionability hinges on prior justification—if the prior is whimsical, the BF is unmoored. Both require surrendering the illusion of autonomous interpretation. 

  For methods courses: Stop teaching frameworks in isolation. Show how Bayes needs frequentist checks (simulation, calibration), and frequentism needs Bayesian interpretation (PPs, predictive checks). Stress that all inference is provisional and model-bound. 

  Finally, where the distinction collapses: Both frameworks stumble when models are bad. A "calibrated" p-value from misspecified models is misleading; a Bayes factor with a poorly justified prior is equally so. And both end up relying on similar robustness checks (sensitivity analysis, predictive validation). The replication crisis forces humility onto both. 

  This framing actually clarifies why the stats wars persist—it’s not about math but about what we demand from evidence. The professor’s angle might even bridge departmental divides!
answer: |-
  Your "inference-audit gap" framing is sharp and conceptually robust—it avoids clichés and precisely targets the core tension exposed by the replication crisis. Let’s build on it for your four implications, stressing where the gap bites hardest and where practical concessions blur distinctions:  

  ### **1. How Journals Should Evaluate Replication Attempts**  
  - **The Gap’s Bite:** Frequentist calibration ensures that *if* the null is true, 95% of original studies would not find a significant effect—but says nothing about whether *this* study’s null *is* true. A replication failure doesn’t "debunk" the original study’s math; it exposes the *actionability gap* between long-run error control and real-world belief.  
  - **Implication:** Journals must stop treating replications as "pass/fail" audits based solely on frequentist thresholds (e.g., "original p < .05, replication p > .05 → failure"). Instead:  
    - **Report compatibility intervals:** Compare the *overlap* of original and replication effect size estimates (e.g., 95% CIs). Low overlap signals inconsistency, regardless of significance.  
    - **Demand Bayesian evidence quantification:** Require Bayes factors (BF) or posterior estimates contextualized with explicit priors. A BF=3 for the original and BF=0.5 for the replication quantifies evidence *for* and *against* the effect more transparently than p-values.  
  - **Concession:** Both frameworks collapse here: No method can salvage inference if the underlying phenomenon is context-dependent or the model is misspecified. Replication attempts must document contextual differences (e.g., population, stimuli) that might explain discrepancies.  

  ### **2. Preregistration & Multiverse Analysis: Frequentist Fix, Bayesian Fix, or Neither?**  
  - **Preregistration:**  
    - **Frequentist veneer, Bayesian core:** It *looks* frequentist (locking α to control Type I error), but its *purpose* is Bayesian: to constrain researcher degrees of freedom that inflate the gap between nominal and actual error rates. By reducing "forking paths," it makes the prior/model more credible—enhancing *actionability*.  
  - **Multiverse Analysis:**  
    - **Bayesian impulse, frequentist tool:** It acknowledges prior/model uncertainty (Bayesian) but audits robustness across specifications (frequentist calibration). It doesn’t yield a single posterior; it shows how inferences vary under defensible assumptions.  
  - **The Gap’s Verdict:** **Neither is a pure fix.** Preregistration narrows the audit gap but can’t prevent bad models. Multiverse quantifies uncertainty but may paralyze action. Both are *gap-management tools*: they make frequentist calibration more trustworthy *and* Bayesian priors/models less arbitrary.  

  ### **3. How a Working Scientist Should Read a Single p-value and Bayes Factor**  
  - **Single p-value (e.g., p = .02):**  
    - **Calibration without actionability:** "If this null hypothesis were true and we repeated this experiment infinitely, we’d get results this extreme 2% of the time." *But*: It does *not* tell you the probability the effect is real, the size of the effect, or whether it matters.  
    - **Practical read:** "This warrants further investigation—but it’s not a license to believe or act yet." Pair it with effect size, power, and plausibility.  
  - **Single Bayes Factor (e.g., BF₁₀ = 6):**  
    - **Actionability without guaranteed auditability:** "Under my model and prior, the data are 6 times more likely under H₁ than H₀." *But*: If the prior is poorly justified or the model is wrong, the BF is misleading (e.g., BF=6 could be catastrophic if the prior ignores confounders).  
    - **Practical read:** "This updates my prior belief toward H₁—but I must justify my prior and check model fit."  
  - **The Gap’s Lesson:** **Neither can stand alone.** A p-value needs context (e.g., pre-study odds); a BF needs critical priors. Both require admitting: "This is one piece of evidence, not truth."  

  ### **4. What a Graduate Methods Course Should Teach**  
  - **Core Principle: Bridge the gap, don’t ignore it.**  
    - **Teach calibration as a starting point:** Explain *why* frequentist methods are calibrated (e.g., sampling distributions, error control), then immediately stress their limitations for real inference. Simulate "p-hacking" to show how nominal calibration breaks.  
    - **Demystify Bayesian updating:** Show how priors encode assumptions (e.g., "default" Cauchy priors aren’t neutral). Use predictive checks to stress: *A posterior is only as good as the model*.  
    - **Force integration:**  
      - **Frequentists must use Bayesian tools:** Calculate "probability of replication" via posterior predictive checks.  
      - **Bayesians must audit calibration:** Simulate BFs under H₀ to see if "BF > 6" really implies 6:1 evidence when H₀ is true.  
    - **Emphasize the meta-tools:** Preregistration, multiverse analysis, and sensitivity analysis (e.g., "How would my BF change if I widened the prior?") as non-negotiable habits.  
  - **Where frameworks collapse:** Teach that **all inference is model-relative**. A "significant" p-value from an ANCOVA and a BF from a regression both assume linearity, no unmeasured confounders, etc. Violations break *both*.  

  ### **Where Your Framing Excels (& Minor Tweaks)**  
  - **Strength:** You avoid false dichotomies (e.g., "Bayes = subjective, freq = objective"). The "audit vs. action" lens shows why both struggle with replication.  
  - **Tweak:** Stress that **the gap is widened by researcher incentives**, not just math. P-hacking exploits frequentist calibration; flashy priors exploit Bayesian actionability.  
  - **Blurred Lines:** In practice, both make the same concessions:  
    - Bayesians use "non-informative" priors that mimic frequentist results.  
    - Frequentists interpret confidence intervals as credible intervals (implicitly Bayesian).  
    - **Both ultimately rely on meta-scientific norms** (prevention of fabrication, selective reporting) to function.  

  **Bottom Line for Your Lecture:** The replication crisis is the empirical shockwave of the inference-audit gap. We’ve treated calibration as a proxy for truth (frequentism’s trap) and neglected to audit priors/models (Bayes’ trap). The solution isn’t a "winner," but rigor in *auditing calibration* and *justifying actionability*—while admitting that science is always conditional and corrigible.
