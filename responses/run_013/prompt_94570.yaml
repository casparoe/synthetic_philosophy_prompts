answer: |-
  Aris traced the equation on the tablet screen, the familiar glow illuminating the sharp angles of her face. Beside her, Leo leaned over her shoulder, his breath warm against her ear, pointing at a variable. “Here,” he murmured. “The friction coefficient we logged from the garage floor last week. Without it, the whole torque calculation collapses.”

  Their shared workspace, ‘Cerebro’, pulsed with the quiet hum of accumulated thought. Not just data – grocery lists and birthdays – but the scaffolding of their combined cognition. Leo navigated social complexities like a seasoned diplomat, his intuition weaving through unspoken rules Aris found baffling. Aris dissected logic puzzles, built intricate models, her focus a laser where Leo’s was a floodlight. Cerebro bridged the gap. Arguments were hashed out line by line, annotated in shared ink. Insights bloomed in collaborative paragraphs. Forgetting wasn’t personal failure; it was a temporary disconnect, easily remedied by a quick search within their shared mind.

  The problem was the balcony railing on Leo’s aging apartment. Was it strong enough to hold the large planter box Aris wanted? A simple stress calculation, Aris insisted. But Leo fretted, picturing cascading soil and shattered terracotta. They’d argued it out in Cerebro months ago. Aris recalled the conclusion vividly: *Load capacity exceeds estimated weight by 40%. Approved.* She’d felt a flicker of pride, the logic undeniable.

  Now, preparing to order the planter, she pulled up the file. The familiar calculations scrolled past. Density of soil, volume of the box, material specs for the railing… then a jump. A sudden, jarring gap where the final stress analysis and the bold ‘Approved’ conclusion should have been. Instead, the document ended mid-sentence: *While the tensile strength suggests…*

  Aris blinked. Coldness seeped into her fingers. Where was the rest? She searched her own memory. She remembered the late-night coffee, Leo’s skeptical frown, the triumphant feeling when the numbers lined up… but the *numbers themselves*? The final summation? It was like reaching for a word on the tip of her tongue that dissolved into smoke. She *knew* she’d done it. She *felt* the certainty of the conclusion. But the proof, the specific path her mind had taken to get there… it was gone. Not misplaced. *Excised*.

  “Leo?” Her voice sounded thin. “The balcony calculation. The one we did for the planter. It’s… incomplete.”

  Leo looked up from his book, feigning mild surprise. “Incomplete? You finished that one ages ago, didn’t you?” He walked over, peering at the screen. “Huh. Looks like it cuts off. Weird.” He tapped the screen, scrolling. “Must have been a glitch during that last sync.”

  “But I remember *doing* it,” Aris insisted, a tremor beneath the words. “I remember proving it was safe.”

  “Do you?” Leo asked softly, his gaze steady on her face, not the screen. “Because I remember you being worried. I remember you saying the old wrought iron made you nervous, that maybe we shouldn’t risk it. Maybe… maybe you didn’t actually finish the math? Maybe you got cold feet?” He shrugged, a gesture meant to be casual but landing like a stone. “Memory’s funny like that. Especially when something feels risky.”

  Aris stared at him, then back at the abrupt ending on the screen. The gap yawned in Cerebro, and simultaneously, terrifyingly, echoed inside her own head. Had she finished it? The conviction she’d held moments ago wavered, undermined by the physical evidence on the screen and Leo’s calm, plausible suggestion. The certainty *felt* like hers, yet its foundation was missing, and Leo was pointing at the empty space, naming it her own doubt.

  She *knew* he was wrong. She *knew* she’d solved it. But the knowing had no anchor. It floated, untethered, in a sea of doubt stirred by that blank space in Cerebro – a space Leo seemed so comfortable beside. Had he simply deleted the conclusion? Or had he somehow… erased the memory trace *in her* by altering their shared context? The boundary between her recollection, Cerebro’s record, and Leo’s intervention dissolved into a nauseating blur. Where did her mind end? Where did his manipulation begin? Was the feeling of certainty just an echo of text that no longer existed?

  She looked at her trembling hands, then at the tablet – the cool, glowing rectangle that held, and now withheld, pieces of her self. Leo watched her, his expression unreadable. The silence stretched, filled only by the phantom sensation of a memory amputated, leaving behind a raw, disorienting stump that felt profoundly, terrifyingly *her own*. The balcony railing, the planter box… they were irrelevant now. The real question hung unspoken, chilling the room: whose mind was she even inhabiting?
