prompt: |-
  Longtime reader of the rationalist blogs — I'm in a Discord of about forty people who mostly wandered in through the Sequences, and we have some version of the same argument every few months in different clothes. Last night's was whether a mind could be non-computational. Someone brought up Penrose, someone else said "fine but what if physics lets you do hypercomputation," and it got shut down in one line: "computable just means computable by a Turing machine. That's the definition. There's nothing to argue about." Same move shows up whenever anyone worries that the brain might do something our laptops can't, and I've also seen the related line that the Church-Turing thesis is really a definition dressed up as a thesis.

  I'm pretty sure that's not the end of it, but I can't say exactly where the trick is, and I'd rather not be the guy who objects without being able to state the objection. So lay it out for me as a menu. What are the distinct precise things that one-liner could be claiming? I want the whole range, from the trivially-true reading where it's just a stipulation about how we'll use a word, through the reading where it's a substantive claim about what a human being can do by rote with paper and pencil, through the reading where it's a claim about what any physical system in this universe can do, through whatever it is that's being said when the fact that several totally independent formalisms — Turing machines, lambda calculus, recursive functions — all turned out to pick out the same class of functions gets treated as evidence. For each reading: is it analytic, empirical, a theorem, or a category error? Is it plausible? What would it even take to falsify it, and if the answer is "nothing," is that a strength or a bug?

  Then tell me which of those readings actually licenses the shutdown move he made — which one makes "could a mind be non-computational?" a non-question — and which ones leave it as a live question that he's just refusing to engage with. And say which reading I should probably just concede, because I suspect at least one of them is definately right and I don't want to be defending something indefensible in front of people who'll notice.
reasoning: |-
  Okay, the user is part of a Discord group that's deep into rationalist discussions, and they keep having debates about whether minds can be non-computational. Someone shut down the argument by saying "computable just means computable by a Turing machine. That's the definition." The user feels this is too simplistic but can't articulate why. They want a breakdown of the possible interpretations of that one-liner, ranging from trivial to substantive claims, and which ones actually invalidate the question about non-computational minds.

  First, I need to unpack the different meanings of "computable." The strict definitional reading is just about word usage—it's true by stipulation. Then there's the formal equivalence of models like Turing machines, lambda calculus, etc., which is a mathematical theorem. But when people bring up hypercomputation or physics, they're probably thinking about the physical Church-Turing thesis, which is empirical. The user also mentioned the convergence of formalisms as evidence, which ties into the philosophical thesis.

  The user wants to know which interpretations make "can a mind be non-computational?" a non-question. The definitional and mathematical readings do that, but they're trivial. The substantive claims (physical and philosophical theses) leave it open. The shutdown move relies on conflating these levels—using the certainty of the definition to dismiss the empirical question.

  I should clarify that conceding the definitional point is fine, but the physical and philosophical claims are where the real debate is. The user needs to avoid defending the idea that "computable" could mean something else mathematically, which is indefensible. Instead, focus on whether the brain's processes are computable in the physical sense. 

  Also, the user might be worried about looking foolish in front of their group. They need to show they understand the math but can separate it from the empirical question. Highlighting the difference between mathematical computability and physical realizability should help. Emphasize that Penrose's argument isn't about redefining computation but questioning if physics allows non-computational processes in cognition. 

  Finally, the falsifiability aspect: the physical thesis could be falsified by discovering hypercomputation in nature, while the definitional reading can't be falsified. The shutdown move's weakness is treating an empirical question as a matter of definition.
answer: |-
  Here's your menu, broken down by interpretation of "computable just means computable by a Turing machine," with evaluations and implications for the "non-computational mind" question:

  ### The Interpretations

  1.  **The Trivial Definitional Reading:**
      *   **Claim:** "Computable" is *stipulatively defined* as "computable by a Turing Machine (or equivalent formal system)." It's a term of art within computability theory.
      *   **Status:** Analytic (True by definition). A theorem *within* the defined formal system (Turing machines capture their own notion of computability).
      *   **Plausibility:** Undeniably true *within the context of this specific formal definition*.
      *   **Falsifiability:** None. It's a definition. Attempting to falsify it is like trying to falsify "A bachelor is an unmarried man." Strength: Clarifies technical discussion. Bug: Only addresses the defined term, not the underlying concepts.
      *   **Shutdown Power for Minds?** **High, but Trivial.** If "computable" *just means* TM-computable by definition, then asking "Can a mind compute something non-computable?" is asking "Can a mind compute something not computable by a TM?" which is a contradiction *under this specific definition*. The question dissolves into incoherence *using these specific terms*. However, this says nothing about whether minds can perform tasks *outside* what we *intuitively* mean by "computation" or what physical systems can achieve.
      *   **What to Concede:** **Definitely concede this.** This is the bedrock of computability theory. Within its formal domain, "computable" *is* defined as TM-computable. Arguing against *this specific definition* is pointless and shows misunderstanding.

  2.  **The Mathematical Equivalence Reading:**
      *   **Claim:** All independently proposed formal models of computation (Turing Machines, Lambda Calculus, General Recursive Functions, Register Machines, etc.) define the *exact same class* of functions (the partial recursive functions). This class is robust and mathematically well-defined.
      *   **Status:** Proven Theorem (Church-Turing Thesis in its mathematical aspect).
      *   **Plausibility:** Extremely high, mathematically proven.
      *   **Falsifiability:** Effectively none within standard mathematics. The equivalence proofs are rigorous. If a new formalism were proposed claiming to compute more, it would be scrutinized to see if it truly fits the intuitive notion or relies on infinitary processes disallowed in the standard models. Strength: Demonstrates a profound convergence on a fundamental concept.
      *   **Shutdown Power for Minds?** **Moderate, but Misleading.** It shows that "computability" as a mathematical concept is uniquely captured by these equivalent models. It strongly suggests that *any* algorithmic process (like pen-and-paper calculation following fixed rules) is captured by TMs. If "computation" *means* algorithmic symbol manipulation, then minds doing *only that* are computational. However, it **does not** address whether cognition *is* solely algorithmic symbol manipulation or whether physical laws *allow* processes beyond TM simulation. The shutdown move conflates the robustness of the mathematical concept with claims about physics or cognition.
      *   **What to Concede:** **Concede the mathematical equivalence.** This is a cornerstone result. Don't argue that "computable" *could* mathematically mean something broader than TM-computable under the standard definitions.

  3.  **The Physical Church-Turing Thesis (PCTT):**
      *   **Claim:** Any function that can be *physically computed* by a machine operating within our universe, exploiting its laws, can be computed by a Turing Machine. Physics does not permit hypercomputation. Brains, being physical systems, are thus subject to this limitation.
      *   **Status:** Empirical Hypothesis. Highly influential and plausible, but not proven. Based on the observation that all known physical laws are computable (or can be simulated to arbitrary precision by TMs) and that no physical hypercomputer has been realized or credibly proposed based on known physics.
      *   **Plausibility:** Very plausible, but not certain. Debates exist around quantum gravity (Penrose!), cosmological models, analog chaos, and hypothetical physics.
      *   **Falsifiability:** **Yes, in principle.** Discovering a physical process (e.g., exploiting a singularity, harnessing uncomputable aspects of quantum gravity, building a Malament-Hogarth spacetime computer) that demonstrably computes a non-Turing-computable function would falsify PCTT. Strength: Grounds abstract computation in physics. Bug: Its truth is contingent on the nature of our universe.
      *   **Shutdown Power for Minds?** **None.** This is **precisely the core of the debate!** The shutdown move ("nothing to argue about") assumes PCTT is true *by definition*, which it is not. Penrose's argument *is* an attempt to falsify PCTT *specifically for brains* by suggesting quantum gravity effects in microtubules perform non-Turing-computable processes essential for consciousness. The question "Could a mind (as a physical system) be non-computational?" is **exactly equivalent** to asking "Is the PCTT false for the specific physical processes underlying cognition?" The shutdown move illegitimately dismisses this empirical/philosophical question by hiding it behind definitions and mathematical theorems.
      *   **What to Concede:** **Do not concede this as definitionally true or proven.** Acknowledge its plausibility but insist it remains a substantive hypothesis about physics.

  4.  **The Algorithmic Human ("Pencil-and-Paper") Church-Turing Thesis:**
      *   **Claim:** Any function that a human being can compute by following a finite, definite, purely mechanical procedure (algorithm) using paper and pencil (or equivalent finite discrete symbols and steps) can be computed by a Turing Machine.
      *   **Status:** Strongly supported empirical/philosophical claim, often considered the core "original" meaning of the Church-Turing Thesis. Backed by the mathematical equivalence and centuries of formalizing calculation.
      *   **Plausibility:** Extremely high. No human has ever demonstrably followed an algorithm to compute a non-recursive function.
      *   **Falsifiability:** **Yes, in principle.** A human demonstrably following a clear, finite, mechanical procedure to compute (e.g.) the Halting Function for all TMs would falsify it. Strength: Captures the essence of algorithmic human thought.
      *   **Shutdown Power for Minds?** **Limited Scope.** It shuts down the idea that *deliberate, conscious, rule-following human calculation* could outpace a TM. However, it **does not** address the *entirety* of cognition. It says nothing about intuition, insight, qualia, or subconscious processes that might not be reducible to following explicit finite algorithms, even if the *outputs* of those processes are computable. The shutdown move often illegitimately extends this claim to cover *all* mental phenomena.
      *   **What to Concede:** **Concede for explicit algorithmic calculation.** Humans haven't shown they can calculate non-Turing-computable functions by rote. But deny that this covers everything interesting about cognition.

  5.  **The Philosophical/Intuitive Church-Turing Thesis:**
      *   **Claim:** The class of functions captured by Turing Machines exhausts the *intuitive notion* of "effectively calculable" or "mechanical procedure" – any process we would naturally call a computation is TM-computable. The convergence of formalisms is evidence that this intuitive concept has been precisely captured mathematically.
      *   **Status:** Philosophical claim, strongly supported by the mathematical equivalence. It's the claim that the formal definition perfectly matches the pre-theoretic intuition.
      *   **Plausibility:** Very high, based on the historical success and lack of counterexamples to the intuitive notion.
      *   **Falsifiability:** **Conceptually tricky.** It involves matching a formal concept to a vague intuition. Discovering a process that everyone intuitively calls a "computation" but is provably non-Turing-computable would falsify it, but agreement on the intuition might be hard. Strength: Explains the significance of the mathematical result. Bug: Relies on subjective intuition.
      *   **Shutdown Power for Minds?** **Moderate, but Begs the Question.** It shuts down the argument *if* you accept that cognition is *nothing but* "effective calculation." However, the core question "Is cognition just effective calculation?" is precisely what's at stake! Critics (like Penrose, or proponents of embodied cognition) argue that key aspects of mind *aren't* captured by the *intuitive* notion of "effective calculation" formalized by TMs. The shutdown move assumes the answer ("yes, it is just computation") to dismiss the question.
      *   **What to Concede:** **Concede the convergence is strong evidence for capturing the *algorithmic* intuition.** But deny that this proves *all* mental phenomena fall under this specific intuition.

  ### The Shutdown Move Analysis

  *   **What It Relies On:** The shutdown move ("computable just means computable by a Turing machine. That's the definition. There's nothing to argue about") **explicitly** uses Reading 1 (Definitional). However, its *force* in shutting down the discussion about minds/physics **implicitly relies on conflating Reading 1 with Readings 3 (PCTT) or 5 (Philosophical)**.
  *   **Why it Shuts Down (Illegitimately):** By emphasizing the definitional aspect ("that's the definition"), it creates a veneer of unassailable truth (which Reading 1 does have). It then uses this to imply that the substantive questions about physics (PCTT - Reading 3) or the nature of cognition vis-a-vis computation (Reading 5) are *also* settled by definition ("nothing to argue about"). This is a **category error**.
  *   **What it Ignores:** It ignores the crucial distinction between:
      1.  The *mathematical definition* of "computable" (Readings 1 & 2).
      2.  The *empirical claim* about what physical systems can compute (Reading 3 - PCTT).
      3.  The *philosophical claim* about whether minds are *entirely* captured by this specific concept of computation (Reading 5).
  *   **Which Readings License the Shutdown?** Only **Reading 1 (Definitional)** strictly licenses the shutdown *of the specific question phrased using the word "computable" as formally defined*. It makes "non-computational mind" a contradiction *in terms* (under that definition). **Reading 2 (Equivalence)** supports this but doesn't *by itself* license the shutdown regarding minds/physics.
  *   **Which Readings Leave it as a Live Question?** **Readings 3 (PCTT) and 5 (Philosophical/Intuitive)** are **exactly where the live question resides.** Reading 3 is the core physical claim Penrose disputes. Reading 5 is the philosophical stance that cognition *is* just computation, which is the foundational assumption being challenged. **Reading 4 (Algorithmic Human)** leaves open questions about non-algorithmic aspects of cognition.

  ### Your Strategy

  1.  **Concede Immediately and Clearly:**
      *   "Yes, absolutely, within the field of computability theory, 'computable' is formally defined as computable by a Turing Machine or equivalent. That definition and the equivalence of models like lambda calculus are proven mathematical facts. I'm not disputing that." (Covers Readings 1 & 2).

  2.  **Pivot to the Substance:**
      *   "However, that definition doesn't automatically answer the question we're *really* interested in, which is a question about *physics* and *biology*: **Can the specific physical processes occurring in the human brain, exploiting the laws of physics (including potentially unknown aspects like quantum gravity), perform tasks or realize states that cannot, *even in principle*, be simulated or modeled by *any* Turing Machine?**"
      *   "Penrose isn't trying to redefine 'computable' mathematically. He's arguing that known physics (specifically quantum gravity) might allow brain processes to be *physically non-simulable* by a TM, which would mean they are non-computational *relative to the physical Church-Turing thesis*."
      *   "The mathematical definition tells us what TMs *can't* do (e.g., solve the Halting Problem). The open question is whether the universe allows physical systems to do things that fall into those 'can't do' gaps. The convergence of formalisms is amazing evidence that we've nailed the abstract concept of *algorithmic calculation*, but it doesn't prove that *everything the brain does* is algorithmic calculation in that specific formal sense."

  3.  **Focus on the PCTT:**
      *   "The substantive claim being used to shut down the possibility of a non-computational mind is the *Physical* Church-Turing Thesis: 'No physical system can compute a non-Turing-computable function.' That is **not** a definition. It's a profound claim about the universe, which might be true, but it's **not proven**. Penrose is offering a potential counter-argument. Dismissing his argument requires engaging with the physics, not just repeating the definition of 'computable'."

  **In essence:** The shutdown move exploits the undeniable truth of the mathematical definition to sidestep the difficult and fascinating empirical/philosophical questions about physics and the mind. Your objection is that it commits a conflation of distinct conceptual levels. Concede the math, demand engagement with the physics and philosophy.
