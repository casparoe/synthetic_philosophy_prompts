prompt: |-
  I'm in a philosophy of action seminar this term and we spent two weeks on Kavka's toxin thing — the eccentric billionaire, the vial that makes you miserably ill for a day, the million dollars that's already sitting in your account before the drinking is even due, all you have to do is intend at midnight to drink it the next afternoon and then you're free to change your mind. I got into a stupidly long argument about it with my flatmate (who does econ and thinks the whole thing is just a word game about "intend") and I came out of it with a pile of verdicts that I can't get to line up. I want someone to tell me what principle they add up to, and I'd rather you not just hand me the two standard lines from the literature — I've read those, and neither of them matches what I actually think.

  Here's what I actually think. (i) Original setup, million in the account overnight, one day of nausea: it's rational to try to form the intention, I'd pay real money for a pill that made me intend it, and then the next day I would not drink. I dont see why intending to do something has to mean predicting you'll do it — changing your mind is a normal thing people do, and once the money's mine, drinking is pure loss. (ii) Same deal but the wire only goes through after I drink: no puzzle at all, I drink, I don't need any pill. Which bothers me, because the only difference between (i) and (ii) is the timing of a bank transfer, and it feels wrong that rationality should hinge on that. (iii) Now make the toxin lethal — I die, family gets the million, same overnight payment. I couldn't intend that one, pill or no pill, and I'd refuse the pill if it were offered. But I can't see how that's consistent with (i): if I can intend what I'm certain I won't do, I could intend the lethal one and simply not drink it either. (iv) Instead of intending, the money is for *believing* at midnight that I'll drink it. Can't do it, and I wouldn't take a pill for it — it feels slimy in a way the intention pill doesn't, even though both are just fiddling with my own head for cash. (v) Harmless version, the vial is water: the whole thing evaporates, I intend it instantly, no pill, no tension. (vi) Promise version: instead of intending, I give the billionaire my word, paid upfront, unenforceable. I'd do it and then not drink, but I'd feel worse about it than about (i), and I can't say why the promise is worse when neither one actually binds me to drink anything.

  So: what principle, or small set of competing principles, gets these — stated precisely enough that I can see which clause is earning its keep in which case — and what does it predict for cases I haven't listed? I'd be curious about things like intending to drink it twice, or intending it for a stranger's benefit rather than mine, or being offered the pill before I know how much the money is. And please be straight with me about which verdicts the principle can't save. I suspect (i) is the one that has to go — if it does, say so and say what should replace it, and tell me whether the resulting view still lets the billionaire's offer be a genuine offer or turns it into a trick. No citations or reading list, this is just for me and my notes.
reasoning: |-
  Okay, let me tackle this user's philosophy of action puzzle. They've presented six nuanced verdicts on variations of Kavka's Toxin Puzzle and want a unifying principle that doesn't just regurgitate standard literature positions. 

  First, I need to map their intuitions clearly: 
  - In (i) they think forming intention for upfront payment is rational but acting on it isn't 
  - (ii) shows payment timing changes rationality, which feels odd 
  - (iii) lethal toxin makes intention impossible despite identical structure 
  - (iv) belief feels "slimy" where intention doesn't 
  - (v) harmless case resolves easily 
  - (vi) broken promise feels worse than abandoned intention 

  The core tension is between their willingness to strategically form intentions in (i) versus the moral queasiness in (iv) and (vi). Their econ-flatmate's "just word games" objection probably nags at them. 

  Hmm... what if we model this as two competing principles? 
  1. Instrumental rationality: intentions are tools for reward, separable from action 
  2. Cognitive hygiene: some self-manipulations feel like "cheating" cognition 

  But that's too vague. Let's get surgical. Their (i) works only if intention-formation has independent value - like signing a non-binding LOI in business. But (iii) fails because death isn't compensable by money, violating the principle that rewards must outweigh costs. 

  Ah! The key might be distinguishing between: 
  - Intention as provisional commitment (revocable if conditions change) 
  - Belief as fixed prediction 
  - Promise as social contract 

  That explains why (iv) feels slimy - believing false things corrupts epistemic integrity, while intending temporarily doesn't. And (vi) feels worse because promises create interpersonal obligations even when unenforceable. 

  For test cases: 
  - Intending to drink twice? Only rational if payment > nausea² 
  - Stranger's benefit? Depends on altruism calculus 
  - Unknown payment size? Intention becomes impossible - can't weigh costs 

  Their (i) is salvageable if we add a clause: "Intentions may be formed strategically iff the intended act would be irrational to perform after reward acquisition." That licenses midnight intention but not noon action. 

  Biggest tension remains: why does payment timing matter in (i) vs (ii)? The principle would say rationality doesn't care about timing per se - only about irreversible costs. Since nausea in (ii) is unavoidable for payment, acting becomes rational. 

  If they reject this, the only alternative is to abandon (i) and say intention requires sincere commitment - but that makes the billionaire's offer incoherent. Better to bite the bullet on bank timings being morally neutral. 

  Final principle package: 
  A. Instrumental value principle 
  B. Cognitive hygiene constraint 
  C. Cost-reward separability clause 

  ...with precise definitions for "intention" vs "belief" vs "promise". The lethal case (iii) breaks C because death costs can't be separated from the act. 

  There - now they can stress-test this against new cases like reversible toxins or intention-duration discounts. The flatmate's "word game" charge gets defanged by showing functional differences between speech acts.
answer: |-
  Based on your intuitions, here’s a set of precise principles that reconcile your verdicts. They hinge on **two core ideas**: the **instrumental trade-off value of intention-formation** and a **cognitive hygiene constraint**. Neither standard evidential nor causal decision theory fully captures this—it’s a hybrid view prioritizing intention as a *tool for securing rewards* while rejecting self-deception.

  ### The Principles
  1. **Instrumental Intention Principle (IIP)**:  
     *It is rational to form an intention to φ if (a) forming it yields a net benefit, (b) φ-ing itself would be irrational post-benefit, and (c) the cost of φ-ing is compensable by the benefit.*  
     *Rational intention-formation does not require rational action.*

  2. **Cognitive Hygiene Constraint (CHC)**:  
     *It is irrational to induce states that:*  
     *(d) require believing a known falsehood (propositional mismatch), OR*  
     *(e) impose non-compensable costs (e.g., death).*

  3. **Social Expectation Asymmetry (SEA)**:  
     *Promises create interpersonally expected obligations, making their deliberate violation inherently costly (via guilt/shame), even if no material penalty exists.*

  ---

  ### How Your Verdicts Line Up
  - **(i) Original case (intend, paid upfront, non-lethal)**:  
    → **Rational per IIP**: Forming the intention (a) gets $1M (net benefit), (b) drinking is irrational post-payment, (c) nausea is compensable by $1M. CHC not violated (no false belief needed).  
    **→ Verdict saved: Form intention, don’t drink.**

  - **(ii) Paid after drinking**:  
    → **IIP doesn’t apply**: Benefit requires action, so (b) is false—drinking *is* rational. No intention-formation puzzle.  
    **→ Verdict saved: Drink willingly.**

  - **(iii) Lethal toxin (paid upfront)**:  
    → **CHC(e) violation**: Death is non-compensable (c) fails. IIP(a) irrelevant.  
    **→ Verdict saved: Can’t form intention, refuse pill.**

  - **(iv) Belief instead of intention**:  
    → **CHC(d) violation**: Inducing belief you’ll drink requires believing a falsehood (you know you won’t). Sliminess = cognitive corruption.  
    **→ Verdict saved: Can’t do it, pill refused.**

  - **(v) Harmless toxin (water)**:  
    → **IIP unnecessary**: Drinking costs nothing, so (b) is false—just drink! No need for strategic intention.  
    **→ Verdict saved: No tension, intend/drink trivially.**

  - **(vi) Promise version**:  
    → **SEA violation**: Breaking a promise imposes a *psychic cost* (guilt) that isn’t fully compensable by money. IIP still says form the promise (net benefit), but SEA makes violation feel worse than abandoning a private intention.  
    **→ Verdict saved: Would promise/not drink but feel worse.**

  ---

  ### Why Payment Timing Matters (and Shouldn’t Bother You)
  - **Principle work**: Timing matters *only* because it changes whether (b) holds. IIP cares about *when costs/benefits bind*, not timing intrinsically. Rationality *should* be sensitive to incentive structures—this is a feature, not a bug.  
  - **Your unease**: Likely stems from overgeneralizing "intending ≈ committing." IIP treats intention as a one-time *key to unlock rewards*, not a commitment.

  ---

  ### Predictions for New Cases
  Apply IIP + CHC + SEA:

  - **Intend to drink twice (2 days sick, $2M upfront)**:  
    → **Rational per IIP**: (a) Net benefit = $2M - 0 = $2M, (b) drinking twice irrational post-payment, (c) nausea compensable. Form intention, drink zero times.

  - **Intend for stranger’s benefit (you get nausea, they get $1M)**:  
    → **IIP conditional**: Only rational if you value their benefit > your nausea. If altruism is insufficient, irrational (fails (a)).

  - **Pill offered before knowing the payout**:  
    → **IIP blocks formation**: Can’t weigh benefit vs. cost (violates (a)). Rationally refuse the pill.

  - **Reversible toxin (drink, then antidote within 1 hour)**:  
    → **IIP irrelevant**: Drinking is rational (small cost, big reward). No intention puzzle.

  ---

  ### Which Verdict is Fragile? (i) Can Stay!
  **(i) is defensible** if you accept IIP’s core: intention-formation is a distinct action with its own rationality. The billionaire’s offer isn’t a trick—it exploits how intentions *actually function* as reward-triggers.  

  **If you abandon (i)**, you must either:  
  - Reject strategic intention-formation (collapsing to evidential decision theory, which fails (i)), OR  
  - Demand intention entails action (failing (iii)/(iv)).  

  **Your view’s cost**: It licenses "empty intentions" when conditions align. That’s consistent but may feel odd. Lean into it: intentions aren’t prophecies; they’re *tools*.

  ---

  ### Principle Performance Report Card
  | Verdict | IIP | CHC | SEA | Status       |  
  |---------|-----|-----|-----|--------------|  
  | (i)     | ✅  | ✅  | —   | **Saved**    |  
  | (ii)    | ✅  | —   | —   | **Saved**    |  
  | (iii)   | ❌  | ✅  | —   | **Saved**    |  
  | (iv)    | —   | ✅  | —   | **Saved**    |  
  | (v)     | ✅  | —   | —   | **Saved**    |  
  | (vi)    | ✅  | —   | ✅  | **Saved**    |  

  **Weak spot**: SEA’s psychic costs are subjective. If you don’t feel guilty breaking promises, (vi) might not hold. But your intuition suggests you do.

  ---

  ### Final Summary
  **Your operative principle**:  
  *Form intentions instrumentally to seize rewards, but never corrupt your beliefs or accept uncompensable harms. Promises are social tools—breaking them hurts more than changing your mind.*  

  This view lets the billionaire’s offer be genuine (not a trick) while explaining why lethal/belief cases fail. The tension in (i) vs. (iii) is resolved by compensability; (i) vs. (vi) by social psychology. If your flatmate calls it "word games," retort: "No—it’s how minds navigate payoff structures."
