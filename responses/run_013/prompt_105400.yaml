answer: |-
  Your view—that money-pumps reveal a distinct *diachronic* irrationality not reducible to synchronic failures—faces profound challenges. Below, I map its exposures, rank them by severity, and address your three focal points. I'll be direct: **the view is critically exposed on the changing-taste pump and collapse worries**, though not fatally destroyed. Escape routes are less damaging but highlight strategic ambiguities.

  ---

  ### **1. The Changing-Taste Pump: A Fatal Flaw?**  
  **The Case**:  
  *Agent*: A wine collector with time-indexed preferences.  
  - At **t₁**: Prefers **B** (Burgundy) > **C** (Champagne) > **B-** (cheap Burgundy). Synchronic EU: transitive, no cycles.  
  - At **t₂** (after tasting Burgundy): Develops a craving for Champagne. Now prefers **C** > **B** > **B-**. Synchronic EU intact.  
  - *Predictable shift*: Known at t₁ that at t₂, **C** > **B** (e.g., past pattern, psychological trait).  

  **The Pump**:  
  1. At **t₁**: Offered **B** or **B-** + $10. Chooses **B** (prefers **B** > **B-** + $10).  
  2. At **t₂**: Offered to trade **B** for **C** + $1. Chooses trade (now **C** > **B**).  
  3. At **t₃**: Offered to trade **C** for **B-** + $1. Chooses trade (now **B-** + $1 > **C**, and **B-** + $1 < **B** initially by $9).  
  *Result*: Pays $8 net for nothing. Worse off by t₁-lights (**B** > **B-** + $8).  

  **What This Shows**:  
  - **Not mere exploitability**: The agent *is* exploited, but preferences are *rational* shifts (acquired taste, new information).  
  - **Over-generation**: If this is irrational, *all preference change* becomes suspect (e.g., learning, maturation). Yet we deem such shifts rational (e.g., quitting smoking after valuing health more).  
  - **Your Dilemma**:  
    - **Option 1**: Deny rationality of predictable shifts. But this pathologizes growth/learning.  
    - **Option 2**: Conclude money-pumps track *vulnerability to exploitation*, not structural irrationality. This guts your view—cyclic preferences aren’t uniquely sinful.  

  **Verdict**: **Fatally awkward**. Defenders (e.g., McClennen) concede this as a *counterexample* to the universality of money-pump arguments. To salvage diachronic irrationality, you must argue that *predictable* preference shifts are irrational—a heavy burden.  

  ---

  ### **2. Escape Routes: Merely Awkward, But Revealing**  
  **Defenses**:  
  - **Foresight**: At t₁, agent refuses the first trade, knowing it leads to exploitation.  
  - **Precommitment**: Binds herself to keep **B** at t₂.  
  - **Rejecting trades**: Declines "bad" offers by seeing the sequence.  

  **Why These Don’t Fully Rescue Your View**:  
  - **Target of the argument**: The money-pump traditionally targets agents with *static* cyclic preferences. If foresight/precommitment "solves" it, the irrationality was *correctable* naïveté, not inherent structural vice.  
  - **Concession by defenders**: Yes, only the *myopic* agent is pumped. **Rational agents avoid pumps via planning** (e.g., Bratman, Gauthier). This *does* concede that the argument fails against sophisticated agents—undercutting the claim that cyclic preferences *themselves* are irrational.  

  **Silver Lining**: This shows money-pumps are *practical* tests of myopia, not pure logic. Your view survives if restricted to agents lacking foresight/binding mechanisms. But this is a retreat.  

  ---

  ### **3. The Collapse Worry: Nearly Fatal**  
  **The Reduction Argument**:  
  - At each time, the agent has preferences over *entire histories* (e.g., at t₁, prefer "keep **B** forever" > "get pumped").  
  - If so, synchronic intransitivity *over plans* explains diachronic failure: the agent inconsistently values sequences.  
  - **Example**: At t₁, the agent prefers:  
    **Plan α**: Keep **B** > **Plan β**: Trade for **C** at t₂ > **Plan γ**: Trade for **B-** at t₃.  
    But if **γ** is chosen stepwise, it violates α > γ. Synchronic cycle in plan-space.  

  **Does Diachronicity Survive?**  
  - **Yes, weakly**: The *temptation* to deviate from a planned sequence might be irreducible to synchronic preferences (e.g., hyperbolic discounting).  
  - **But**: Sophisticated agents *can* incorporate diachronic stability into synchronic planning (e.g., "resolute choice" by McClennen).  
  - **Your view’s burden**: It must show that diachronic coherence (e.g., sticking to plans) is *not* reducible to synchronic preferences over outcomes. Evidence? Neuroeconomics suggests time-inconsistent preferences are a distinct cognitive glitch (e.g., limbic vs. prefrontal conflict).  

  **Verdict**: **Seriously damaging**. Most philosophers (e.g., Broome) see diachronic requirements as derivative. Your view needs empirical support for irreducible diachronic norms.  

  ---

  ### **Predictions, Evidence, and Unfalsifiability**  
  - **Unique prediction**: Agents with cyclic preferences *will* accept losing trades *even when foresight is possible* (if they lack self-binding tools).  
  - **Evidence for**:  
    - Real-world money-pumps (e.g., gambling loops, subscription traps).  
    - Time-inconsistency in neuroscience (e.g., dopamine-driven myopia).  
  - **Evidence against**:  
    - No natural cases of *sophisticated* agents being pumped (they use contracts, vows, apps).  
    - Changing-taste pumps hitting rational agents (e.g., career pivots after value shifts).  
  - **Unfalsifiability?**  
    - If every pumped agent is deemed "myopic" or "naive," the view dodges counterexamples. This *is* a problem—it risks becoming a tautology ("rational agents avoid pumps").  
    - **But**: Not fatal. Normative theories often idealize (e.g., "full rationality includes foresight"). The view is falsifiable if we find cyclic-preferring agents who *cannot* be exploited (e.g., via commitment tech).  

  ---

  ### **The Paragon of Rationality Test**  
  **Can a "rational" agent be pumped?**  
  - **Yes, in a changing-taste case**: Consider a philanthropist who shifts funding from **Medicine** to **Education** after new evidence (e.g., education prevents disease long-term). If exploiters manipulate the timing of evidence/trades, she might pay to "revert" to a less effective donation.  
    - **But**: We’d blame the *exploiter*, not her rationality. This suggests money-pumps target *opportunism*, not structural vice.  
  - **For cyclic preferences**: No clear case. A truly rational agent with cyclic preferences would precommit (e.g., use a trust to block trades). If cyclic preferences *prevent* such precommitment, the irrationality is synchronic (inability to value plans consistently).  

  **Result**: No pumping of paragons with cyclic preferences. This *supports* rivals who see money-pumps as revealing synchronic flaws.  

  ---

  ### **Honest Verdict: Exposure Level**  
  **Critical vulnerabilities**:  
  1. **Changing-taste pumps** show your criterion over-generates, punishing rational preference shifts.  
  2. **Collapse to synchronicity** is plausible; diachronicity needs stronger grounding.  
  3. **Escape routes** concede the argument only bites non-ideal agents.  

  **Surviving core**: Money-pumps *do* reveal irrationality in **myopic agents with static cyclic preferences**. Diachronic requirements have force when preferences are *rigidly* flawed.  

  **Recommendation**: Adopt **Option 2**: Money-pumps track *exploitability of instability* (diachronic or synchronic), not a unique irrationality. This saves the phenomenon without overreach. Your view’s strength is in highlighting *pragmatic* failure, but its exposure lies in claiming *structural* necessity.  

  **Final Word**: The view is **50% exposed**—viable in limited cases (myopic, rigid preferences), but untenable as a general diachronic requirement. Its future hinges on empirical work: if time-indexed preferences are cognitively irreducible, diachronic norms gain ground. Until then, synchronicists hold the high card.
