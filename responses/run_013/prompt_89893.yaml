prompt: |-
  I serve as parliamentarian for a membership organization of about forty thousand people, which meets every second year in a convention of some six hundred delegates. The convention can amend the articles, the bylaws, and the standing orders. I sit beside the chair during sessions, advise in real time on points of order, and write up the reasoning afterwards in a rulings memo. Most of what comes up is ordinary — a quorum count, whether a motion is in order under the current agenda, what two-thirds means — and the manuals cover it. What they do not cover is a recurring family of proposals whose effect is to change the rules by which rules are changed: a motion to lower the threshold for future amendments, to be decided under the present threshold; a motion to entrench a provision so that no future convention can touch it; a motion to let a standing committee amend the standing orders without coming to the floor; a motion making the convention's decisions final and unreviewable by any other body; and, once, a motion to change who is entitled to rule on the motion itself. The manuals will tell me what two-thirds means. They do not tell me how to think about a rule that applies to itself.

  I want from you a decision procedure I can actually run, built on Hofstadter's contrast between a tangled hierarchy and the inviolate level — the picture in which a system can bend back on itself, as Escher's two hands each draw the other and a canon's variations comment on the theme that generates them, only because the bending happens against a level that is not itself bent: the surface the drawing is on, the rules that generate the variations, the artist who is nowhere inside the picture. What I want made operational is not "find the highest-ranking rule" but something narrower and stranger: for a given proposal, identify the level that must be held fixed for the proposal even to be a determinate act — for it to be true or false that the assembly did something, rather than there being no fact of the matter about what it did — and then ask whether the proposal is trying to move that level from inside the tangle.

  Some things I need the procedure to confront rather than sidestep. First, our documents are silent on all of this and there is no court above us, so "inviolate" cannot mean "guaranteed by something outside the system." When the inviolate level is itself only a convention — nothing in the world forces our standing orders to be the surface rather than the thing drawn — its inviolate status is something we stipulate for the length of a single act, not something we discover. Second, I suspect we routinely conflate two things: a level that is inviolate for the purposes of this act, and a rule that is entrenched against the future. Third, the regress is real: if a proposal can move the level that constitutes the tangle, then there is presumably a level above that one, and I need to know when to stop climbing and why stopping there is not arbitrary.

  Constraints. I have about five minutes while the chair waits, and whatever I say has to be sayable out loud without sounding like a seminar. The chair decides; I only advise, and the memo records my advice alongside the ruling. The delegates are not philosophers, but they will notice arbitrariness, and the point of the exercise is that rulings on self-amendment be followable by delegates who lost.

  Please write the response in the following sections, in this order, with roughly these lengths.

  **The distinction, operationalized** (~200 words): the working difference between a tangled hierarchy and the inviolate level, stated so that a delegate could follow it, plus the single diagnostic question the rest of the procedure turns on. Include the one thing about this distinction that is most likely to be misunderstood by someone who has heard of it only in passing.

  **The test, step by step** (~700 words): a numbered sequence I can run in five minutes. For each step give the question to ask, what counts as a sufficient answer, which answer terminates the procedure with a ruling that the motion is out of order, which answer terminates it with a ruling that the motion is in order, and which answer hands the matter to the chair as a judgment call that no procedure can settle. The steps should distinguish at least: proposals that change a rule, proposals that change the rule for changing rules, proposals that change the identity or authority of the body that decides, and proposals that purport to bind future conventions. State explicitly where in the sequence the climb up levels stops, and what makes stopping there principled rather than arbitrary.

  **Worked cases** (~600 words): run the test on three motions. (a) A motion to reduce the threshold for future bylaw amendments from two-thirds to a simple majority, to be decided under the present two-thirds threshold. (b) A motion to declare a named provision unamendable by any future convention. (c) A motion to let the bylaws committee amend the standing orders on its own authority, subject to reversal at the next convention — this one I favor, and I have said so in a committee meeting, so I need the procedure to be run on it without regard to what I want. For each, give the ruling, the sentence I would say to the chair, and the sentence I would put in the memo. If the procedure tells me something I will not like about (c), say so plainly rather than softening it.

  **The judgments the procedure cannot make for me** (~250 words): the points at which the honest answer is that the documents do not decide the question, the assembly decides by voting, and the record should note that the circularity was seen and accepted rather than papered over. Say when I should say that out loud, and what I should refuse to claim.

  **Where it will misfire, and the warning signs** (~200 words): the situations in which the procedure will give a confident wrong answer or invite abuse, the kinds of proposals that will look tangled and are not (and the reverse), and the one piece of business I should insist on handling outside the procedure altogether.
reasoning: |-
  We are given an operationalization problem for a parliamentarian dealing with self-referential rule changes in a convention setting. The goal is to create a decision procedure based on Hofstadter's concept of tangled hierarchy vs. inviolate level, which can be applied in real-time during a convention. The procedure must be run in about five minutes, be explainable to non-philosophers, and avoid arbitrariness.

  We break the response into the requested sections.

  ### The distinction, operationalized (~200 words)

  The key distinction is between the rules that are being changed (the tangled hierarchy) and the level that must remain fixed for the act of changing to have a definite meaning (the inviolate level). The tangled hierarchy is like the rules that are being drawn and redrawn – for example, the current threshold for amending the bylaws. The inviolate level is the foundation that makes the act of changing rules possible at this moment – such as the current authority of the convention as a whole to make decisions. 

  The diagnostic question is: **"For this motion to be a definite act that either passes or fails, what must we hold fixed as the ultimate authority at this moment?"**

  The most common misunderstanding: The inviolate level is not necessarily a rule written in the documents, nor is it guaranteed by an outside force. It is a temporary stipulation for the current act. We are not discovering an eternal truth but agreeing on what we are taking as the basis for this decision.

  ### The test, step by step (~700 words)

  Here is a step-by-step procedure, designed to be run in about five minutes:

  1. **Identify the type of change:** What rule or rules does the motion directly change? 
     - If it changes an ordinary rule (like a bylaw provision), then it is a first-order change and is almost certainly in order. Proceed to step 2 only if the motion is about changing the rules for changing rules, or about the authority of the body.
     - If it changes the rules for changing rules (e.g., lowering the threshold for future amendments), go to step 3.
     - If it changes the identity or authority of the body that decides (e.g., transferring power to a committee), go to step 3.
     - If it purports to bind future conventions (e.g., making a rule unamendable), go to step 3.

  2. **For first-order changes:** The motion is in order. The ruling is that it is in order. (Terminate with "in order".)

  3. **Ask the diagnostic question:** "For this motion to be a definite act (i.e., for it to be true or false that the assembly has done something), what must we hold fixed as the ultimate authority at this moment?" 
     - The answer must be: the current convention as the supreme authority for this session, operating under the current rules of decision (e.g., the current thresholds and procedures). This is the inviolate level for the current act.

  4. **Check if the motion attempts to move the inviolate level:** 
     - Does the motion, if passed, change the very thing we identified in step 3 as the inviolate level? For example:
       - If the motion changes the threshold for future amendments, it does not change the current convention's authority or the current rules for this decision. So it does not move the inviolate level. (Go to step 5.)
       - If the motion transfers the authority to amend standing orders to a committee, then it is changing who has the authority to make rules. This directly moves the inviolate level (which is the convention's authority) for future acts. (Go to step 6.)
       - If the motion declares a provision unamendable, it attempts to bind future conventions. This moves the inviolate level for future acts by trying to make a rule inviolate for those future acts. (Go to step 6.)
       - If the motion changes who rules on the motion itself (e.g., transferring the parliamentarian's role), that moves the inviolate level for this very act. (Go to step 6.)

  5. **If the motion does not move the inviolate level:** Then the motion is in order. (Terminate with "in order".)

  6. **If the motion moves the inviolate level:** Then ask: "Is this motion being made from the inviolate level we have identified?" 
     - That is, is the convention, using its current authority, attempting to change the basis of its own authority? 
     - If yes, then we face a self-referential loop. There is no higher level to appeal to. The motion is attempting an act that requires a level above the inviolate level, which does not exist. Therefore, the motion is out of order. (Terminate with "out of order".)
     - However, note: if the motion moves the inviolate level for future acts but not for the current one, then it is being made from the inviolate level and may be in order. But wait: if it moves the inviolate level for future acts, then for those future acts, the convention is no longer the inviolate level. This is acceptable only if the current convention is explicitly yielding its own supremacy. This is a judgment call. (Go to step 7.)

  7. **When the motion moves the inviolate level for future acts but not the current one:** The convention has the authority to surrender its own future supremacy, but that surrender must be explicit and deliberate. The motion is in order only if it is clear that the convention understands it is yielding its own ultimate authority in the specified area for the future. This is a judgment call by the chair. (Terminate by handing to the chair for a judgment call.)

  **Stopping the regress:** The climb stops at step 3 when we identify the inviolate level for the current act. This is principled because without stipulating that the current convention is the ultimate authority for this session, no decision can be made at all. We stop because we are in the act of making a decision now, and we must have a starting point. This is not arbitrary because it is the necessary condition for the current act to occur.

  ### Worked cases (~600 words)

  **(a) Motion to reduce the threshold for future bylaw amendments from two-thirds to a simple majority, to be decided under the present two-thirds threshold.**

  - Step 1: Changes the rule for changing rules (the threshold). Go to step 3.
  - Step 3: The inviolate level is the current convention's authority and the current two-thirds threshold for this decision.
  - Step 4: The motion does not change the current convention's authority or the current threshold for this decision. It only changes the threshold for future amendments. So it does not move the inviolate level. Go to step 5.
  - Step 5: Motion is in order.

  To the chair: "The motion is in order because it changes the rules for the future without altering the basis of this decision."

  In the memo: "The motion to lower the threshold for future amendments does not affect the current convention's authority or the rules governing this vote, and is therefore in order under the current rules."

  **(b) Motion to declare a named provision unamendable by any future convention.**

  - Step 1: It purports to bind future conventions. Go to step 3.
  - Step 3: The inviolate level is the current convention's authority.
  - Step 4: The motion attempts to make a rule inviolate for future acts, thereby moving the inviolate level for those future acts. Go to step 6.
  - Step 6: The motion is being made from the inviolate level (the current convention) and it moves the inviolate level for future acts. Therefore, it is an attempt to change the basis of future authority. This is a self-referential loop without a higher level. Thus, the motion is out of order.

  To the chair: "The motion is out of order because it attempts to make a rule inviolate for all future conventions, which would move the inviolate level for future acts. The current convention, as the supreme authority for this session, cannot bind the inviolate level of future sessions in this absolute way."

  In the memo: "The motion to entrench a provision indefinitely is out of order because it attempts to remove the future convention's authority to amend, which is a core aspect of the convention's role. Without a higher authority to authorize such entrenchment, the motion creates a self-referential loop and is invalid."

  **(c) Motion to let the bylaws committee amend the standing orders on its own authority, subject to reversal at the next convention.**

  - Step 1: Changes the authority of the body that decides (transfers power to the committee). Go to step 3.
  - Step 3: The inviolate level is the current convention's authority.
  - Step 4: The motion moves the inviolate level for future acts by transferring the authority to amend standing orders to the committee. For future amendments of standing orders, the committee would be the body making the decision, not the convention. This moves the inviolate level for those future acts. Go to step 6.
  - Step 6: The motion is being made from the inviolate level (the current convention) and it moves the inviolate level for future acts. Therefore, it is an attempt to change the basis of future authority. However, note that the motion allows reversal at the next convention, meaning the convention is not giving up its own ultimate authority entirely. This is a gray area. Go to step 7.
  - Step 7: This is a judgment call. The chair must decide if the convention understands that it is yielding its authority in the interim but retaining the right to reverse. The motion may be in order because the convention is explicitly preserving its own ultimate authority (through the reversal mechanism). But the procedure does not automatically rule it in order.

  To the chair (if the procedure leads to step 7): "This motion moves the inviolate level for future acts by delegating authority to the committee. However, because it allows reversal at the next convention, it does not absolutely bind the future. It is a judgment call whether this delegation is within the convention's power to structure its own operations. I recommend that you allow it as a temporary delegation, but it is your call."

  In the memo: "The motion to delegate amendment authority to the committee, subject to reversal, was ruled in order by the chair after consultation. The parliamentarian advised that while such a motion moves the inviolate level for future acts, the explicit reversal clause preserves the convention's ultimate authority, making it a permissible act of self-restraint."

  Note: The procedure does not rule (c) automatically in order. It flags it as a judgment call. Even though you favor it, the procedure points out that it moves the inviolate level and requires the chair's judgment.

  ### The judgments the procedure cannot make for me (~250 words)

  The procedure cannot decide:
  - Whether the convention, as the inviolate level, should be allowed to yield part of its authority for the future (as in case c). That is a political decision about the organization's structure, not a procedural one.
  - Whether a particular act of self-restraint (like allowing reversal) is sufficient to avoid a self-referential loop. The documents are silent, and the assembly must decide by voting.

  In such cases, you should say out loud: "The documents do not specify whether the convention can delegate its rule-amending authority in this way. This is a matter for the assembly to decide by vote. However, the chair must note that the motion attempts to change the basis of future authority, and without a higher rule to authorize this, the decision rests on the convention's understanding of its own powers. The chair rules that the motion is in order for consideration, but delegates should be aware they are voting on a fundamental change."

  Refuse to claim that there is a clear, objective answer in the rules. The record should note: "The parliamentarian advised that the motion involves a self-referential change to the authority structure. The chair, after considering the advice, ruled the motion in order, noting that the convention has the inherent authority to determine the scope of its own powers, subject to the understanding of the delegates."

  ### Where it will misfire, and the warning signs (~200 words)

  The procedure will misfire in two main ways:

  1. **False tangles:** A motion that seems to change the rules for changing rules but is actually an ordinary change. Example: A motion to create a new standing committee with specific powers. This might appear to change authority, but if the convention has the power to create committees, it's first-order. Warning sign: The motion does not alter the fundamental rules of decision or the convention's supremacy.

  2. **Missed tangles:** A motion that appears ordinary but actually moves the inviolate level. Example: A motion to dissolve the convention and transfer all authority to a new body. This clearly moves the inviolate level but might be mistaken for a first-order change. Warning sign: Any motion that abolishes or fundamentally alters the convention's role.

  The one piece of business to handle outside the procedure: A motion to change the identity or authority of the parliamentarian during the session. This directly affects the current act's inviolate level (because you are part of the process of ruling on points of order). You should recuse yourself and let the chair rule without your advice, as you have a conflict.

  Overall, the procedure is a tool, not a guarantee. It makes the circularity explicit, so the assembly can decide with open eyes.
answer: |-
  ### The distinction, operationalized
  The tangled hierarchy is the web of rules that reference each other—like a rule about how to change rules. The inviolate level is the fixed foundation that lets us define an "act" (e.g., voting) as real and determinate. Without it, we couldn’t say whether a vote even happened. For any motion, ask: **"What must we hold fixed—right now—for this vote to be a definite act that either passes or fails?"** That fixed element is the inviolate level for this act. Crucially, it’s not eternal or external (like a court); it’s a temporary stipulation for *this* decision. The biggest misunderstanding? People often confuse "inviolate for this act" with "entrenched forever." They’re separate: inviolate is about the current act’s coherence; entrenchment is about binding the future.

  ---

  ### The test, step by step  
  1. **What does the motion directly change?**  
     - *Question:* Is it changing an ordinary rule (e.g., a bylaw), a rule about changing rules (e.g., a threshold), the authority of the body (e.g., who decides), or does it bind future conventions?  
     - *Sufficient answer:* Categorize it clearly. If changing an ordinary rule, go to step 2. For the others, go to step 3.  
     - *Terminates if:* Ordinary rule → **in order**.  

  2. **For ordinary rules, confirm scope.**  
     - *Question:* Does this alter only the content of a rule, without touching how/who changes rules?  
     - *Sufficient answer:* Yes (e.g., "Add a new membership fee").  
     - *Terminates:* **In order**.  

  3. **Identify the inviolate level for this act.**  
     - *Question:* "For this vote to be a definite act (true/false outcome), what must be fixed?"  
     - *Sufficient answer:* "The current convention’s authority to decide, using today’s rules (e.g., thresholds, who votes)." This is always the inviolate level—we stop here. It’s principled because without this, no vote is possible. The regress ends because we’re *in* the act now, and this is its minimal foundation.  

  4. **Does the motion move the inviolate level?**  
     - *Question:* "If passed, would this change the very thing we just identified as fixed for *this* act?"  
     - *Sufficient answer:*  
       - **Yes** if it changes today’s decision-making authority (e.g., "Let a committee rule on this motion now") → go to step 6.  
       - **No** if it changes only future rules or thresholds (e.g., "Lower future amendment thresholds") → go to step 5.  
       - **Unclear** if it binds future conventions (e.g., "Make this unamendable") → go to step 6.  

  5. **For motions that don’t move the inviolate level:**  
     - *Question:* "Does this only affect future acts, leaving today’s foundation intact?"  
     - *Sufficient answer:* Yes (e.g., "Future amendments need only majority vote").  
     - *Terminates:* **In order**.  

  6. **For motions that move the inviolate level:**  
     - *Question:* "Is this motion trying to use the inviolate level (today’s authority) to destroy or transfer itself?"  
     - *Sufficient answer:*  
       - **Yes** (e.g., "Give the chair sole power to amend rules from now on") → **out of order**. It creates a paradox: no fixed level to ground the act.  
       - **No** but binds future conventions (e.g., "Entrench this rule") → **hand to chair**. The convention *can* limit its future self, but it’s a judgment call.  
       - *Terminates:* "Out of order" or hands to chair.  

  7. **Chair’s judgment call (if handed from step 6):**  
     - *Question (to chair):* "Does the convention understand it is surrendering its future authority, and is that surrender explicit?"  
     - *Sufficient answer:* Chair decides based on clarity and scope.  
     - *Terminates:* Chair rules.  

  ---

  ### Worked cases  
  **(a) Motion to reduce future bylaw amendment thresholds from two-thirds to majority, voted on under current two-thirds rules.**  
  - Steps: 1 (changes rule for changing rules) → 3 (inviolate level: current convention/two-thirds) → 4 (doesn’t move it; changes only future) → 5 → **in order**.  
  - To chair: "This is in order because it uses today’s rules to change future rules, without altering today’s authority."  
  - Memo: "Motion in order: it operates within the current inviolate level (convention’s authority under existing thresholds) to amend future procedures."  

  **(b) Motion to declare a provision unamendable by any future convention.**  
  - Steps: 1 (binds future conventions) → 3 (inviolate level: current convention) → 4 (moves it for future acts) → 6 (tries to use today’s authority to bind future inviolate levels) → **out of order**.  
  - To chair: "Out of order: it uses today’s authority to eliminate future conventions’ authority, creating a self-destructive loop."  
  - Memo: "Motion out of order: it attempts to move the inviolate level for future acts, rendering those acts indeterminate without a higher authority."  

  **(c) Motion to let the bylaws committee amend standing orders unilaterally, subject to reversal at next convention.**  
  - Steps: 1 (changes authority) → 3 (inviolate level: current convention) → 4 (moves it for future amendments) → 6 (tries to transfer authority) → **hand to chair** (judgment call).  
  - To chair: "This moves the inviolate level by delegating future authority. But since reversal is allowed, it’s a judgment call—does the convention understand it’s yielding power?"  
  - Memo: "Advised chair that motion requires judgment: delegation moves the inviolate level, but reversibility may preserve convention supremacy. Chair ruled in order."  
  - **Truth you won’t like:** The procedure flags this as high-risk—it *does* move the inviolate level. Even with reversal, it might encourage future committees to act beyond scrutiny. Your support doesn’t change the tangle.  

  ---

  ### The judgments the procedure cannot make for me  
  The procedure fails when ambiguity forces a choice about the convention’s **inherent authority**. Say this out loud when:  
  - A motion binds future conventions but isn’t clearly self-destructive (e.g., entrenchment with exceptions).  
  - The inviolate level is stable, but the motion’s *intent* conflicts with the organization’s purpose (e.g., "Abolish future conventions").  
  In these cases, advise: "The documents don’t resolve this. The assembly must decide by vote, knowing it’s circular. The chair should rule based on whether delegates understand the power they’re claiming."  
  Refuse to claim:  
  - That the outcome is "objectively" valid. Say instead: "The act’s validity rests on the convention’s acceptance of the circularity."  
  - That entrenchment is impossible. Instead, note: "Future conventions may reject this as void, risking chaos."  
  In the memo, write: "The circularity was acknowledged; the ruling reflects the chair’s judgment on the convention’s authority to limit itself."  

  ---

  ### Where it will misfire, and the warning signs  
  **Misfires:**  
  - False tangles: Motions that *seem* self-referential but aren’t (e.g., "Establish a committee to study rule changes"). The procedure may overcomplicate them.  
  - Missed tangles: Motions that subtly shift authority (e.g., "Require court review for amendments")—they appear ordinary but move the inviolate level by introducing an external force.  
  - Abuse: Delegates may reframe hostile motions as "procedural" to exploit the test (e.g., "Lower thresholds just for this vote").  

  **Warning signs:**  
  - The motion mentions "future conventions," "final," or "unreviewable"—likely a tangle.  
  - It involves "who decides now?"—likely moves the inviolate level.  

  **Handle outside the procedure:** Any motion affecting *your role as parliamentarian* during the session (e.g., "Let the chair overrule the parliamentarian"). Recuse yourself—it targets the inviolate level of the *current* act. Advise the chair independently.
