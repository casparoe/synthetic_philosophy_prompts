  For (a) cognitive byproduct theory: Must stress it's about *origin* of beliefs, not resilience. Failed prophecies? Not its domain. Mickey Mouse problem bites hard here—Miller's God survived because of embedded God concepts, not inherent "catchiness." Zeus problem too: theology got upgraded (sanctuary doctrine), not abandoned. 

  (b) Costly-signaling: Oof, the "costs paid to nothing" is brutal. But wait—the real cost was social capital, not the date itself. Survivors doubled down because *shared sacrifice* bonded them. The shut door? Genius move—it turned failure into higher-stakes commitment. Evidence against? If defectors had thrived socially/economically, but accounts say they were stigmatized.

  (c) Rational-choice strict-church: Here's the twist—disappointment *was* good news! It purged casuals, leaving fanatics. But user's right to question: did it screen free-riders or just true believers? Key nuance: post-failure demands (Sabbath, visions) were costlier, amplifying strictness. Counterevidence would be if lax splinter groups grew faster (they didn't—SDAs won).

  (d) Cognitive dissonance: User's spot-on—it's messy. Millerites show all three paths: exit (dissolution), reinterpretation (sanctuary/spiritualizers), *and* proselytizing (Hiram Edson's "light in field"). But dissonance alone doesn't explain *which* path; that needed theology + Ellen White's charisma.

  Theology/path-dependency: Can't handwave this. Sanctuary doctrine wasn't random—Millerites were ex-Baptists/Methodists steeped in apocalyptic typology. Ellen White fit existing "visionary girl" tropes (cf. Ann Lee). If a different teen emerged preaching reincarnation? Would've flopped. 

  Betting time: Costly-signaling + strict-church hybrid wins. Why? Survivors needed both social binding *and* doctrinal escalation to cohere. But cognitive dissonance is weakest—too many exiters. Would kill it with data on membership churn.

