answer: |-
  ## *The Journal of Applied Prediction*  
  **Instructions to Authors (Revision 7.3, effective 1 Jan 2024)**

  1.  **Scope:** *The Journal of Applied Prediction (JAP)* publishes original research advancing predictive models across social, economic, and behavioral phenomena. We prioritize empirical accuracy in forecasting observable outcomes above all other theoretical considerations. Submissions focused on explanatory depth, microfoundational realism, or "understanding" absent superior predictive power are strongly discouraged.

  2.  **The Primacy of Prediction:** The sole criterion for evaluating a theoretical model is the accuracy and robustness of its predictions against relevant, out-of-sample data. The descriptive realism, psychological plausibility, or intuitive appeal of a model's assumptions are categorically irrelevant to its scientific merit. Indeed, JAP recognizes that assumptions deliberately divorced from observed reality often generate the most potent predictive engines ("The Productive Falsity Principle").

  3.  **Mandatory Falsity Disclosure & Assessment (F-D Section):** All submissions must include a dedicated **Falsity Disclosure (F-D) Section** immediately following the abstract. This section must:
      *   **a.** List each core assumption of the model known by the author(s) to be demonstrably false or grossly unrealistic in the relevant application context.
      *   **b.** For each listed assumption, provide a brief **Falsity Justification Statement (FJS)**. This statement must argue *why* the false assumption contributes to the model's predictive power. Merely stating "simplification" is insufficient.
      *   **c.** Assign a **Productive Falsity Quotient (PFQ)** on a scale of 1 (Marginally Useful Falsity) to 5 (Paradigm-Shifting Counterfactual Leverage) for each assumption. Justify the PFQ rating within the FJS. *(Example FJS: "Assumption: Agents possess perfect foresight regarding market fluctuations for 10 years. PFQ: 4. Justification: This radical temporal disconnect from bounded rationality eliminates 'noisy' expectation-formation dynamics, allowing the core price-adjustment mechanism to generate exceptionally sharp predictions of quarterly inflation, as demonstrated in Section 4.")*

  4.  **Referee Evaluation Criteria:** Referees will assess submissions primarily on predictive performance metrics (R², RMSE, MAE, AUC, Brier score, etc., as appropriate). Crucially, referees are instructed to evaluate the F-D Section using the **Assumption Utility Matrix (AUM)**:
      *   **Utility Type:** Is the false assumption acting as a *Generative Engine* (directly enabling key predictive derivations), a *Stabilizing Constraint* (suppressing irrelevant variance), or *Conceptual Ballast* (merely upholding traditional formalism)?
      *   **Falsity Payoff:** Does the falsity demonstrably *enhance* predictive accuracy or scope compared to more realistic alternatives? Referees should flag assumptions rated PFQ ≥ 3 but lacking clear FJS justification as potential "Decorative Falsehoods," grounds for revision or rejection.

  5.  **Model Selection Under Predictive Parity:** If multiple models achieve statistically indistinguishable predictive accuracy on the designated test data:
      *   Priority is given to the model whose core assumptions exhibit a higher **Aggregate PFQ Score** (mean PFQ of listed assumptions).
      *   If Aggregate PFQ Scores are comparable, priority is given to the model employing assumptions demonstrating greater **Counterfactual Defiance** (i.e., assumptions more radically divergent from established empirical knowledge about the underlying entities or processes).
      *   Models incorporating "realistic" elements purely for aesthetic, narrative, or conventional reasons without measurable predictive gain (i.e., low PFQ or Conceptual Ballast) will be penalized under the **Assumption Realism Penalty (ARP)** clause.

  6.  **Intervention Claims:** A model demonstrating superior predictive accuracy may warrant claims about potential interventions. However, authors must clearly distinguish:
      *   **Operational Validity:** "Intervention X, *as modeled* (incorporating assumptions A,B,C rated PFQ 4,3,5), predicts outcome Y with accuracy Z."
      *   **Practical Implementation Caveat:** JAP explicitly notes that the practical design of an intervention based on such a model may *necessarily* diverge significantly from the model's assumptions to function in the real world. Predictive success *earns the right to propose* an intervention schema, but does not guarantee the real-world feasibility or mechanics will resemble the model's internal logic. The burden of outlining this translation rests with the author(s).

  7.  **Handling Realism-Enhancing Revisions:** Submissions arguing for revisions to a published model aimed *solely* at increasing the descriptive realism of its assumptions, without demonstrating a *concomitant and significant improvement in predictive accuracy*, will be considered a downgrade ("Explanatory Aspiration Revision"). Such revisions are only publishable as brief Technical Notes, and only if they rigorously demonstrate that the increased realism does *not* degrade predictive performance (i.e., they pass a strict **Non-Degradation Covenant**).

  8.  **Presentation:** Models must be presented with predictive performance as the central result. Extensive discursive justifications for assumptions based on realism, interviews, case studies, or psychological evidence are superfluous unless directly forming part of a novel predictive algorithm. The F-D Section is the appropriate venue for discussing assumptions. Derivations should focus on the path from assumptions (however counterfactual) to testable predictions.

  9.  **Data & Code:** Replication files must include all data and code necessary to exactly reproduce the *predictive results* reported. Code verifying the realism of assumptions is not required.

  **Managing Editor's Note:** Adherence to these guidelines ensures *JAP* remains the premier venue for theoretically bold, empirically rigorous predictive science. We champion the counterintuitive insight that the path to truth about *what will happen* often lies through deliberate, productive falsehoods about *what is*.
