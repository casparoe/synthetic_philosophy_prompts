prompt: |-
  I sit on the classification committee of a mid-sized academic psychiatry department, and I want your help with a vote we take next week. The committee's charge is narrow and unglamorous: we decide which proposed diagnostic constructs the department will teach and code and which of its clinics will be staffed and reimbursed for, and which proposals we decline. Ten years of such decisions have left us with something like a case law, and the proposal now before us is exactly the kind that exposes what that case law commits us to.

  Our record, in the order we made it:

  1. We adopted a prolonged-grief diagnosis — grief that persists past a year with marked distress and interference — over a dissent that we were converting mourning into illness. The minutes give two reasons: the syndrome has a course distinguishable from ordinary bereavement, and a specific psychotherapy has been shown in randomized trials to work for it.
  2. We declined to adopt an internet-gaming diagnosis, leaving it a research label. Three reasons are recorded: no marker of any kind; prevalence estimates that moved with the availability of the technology rather than holding steady across surveys; and no treatment specific to the label, since the cognitive-behavioral treatment that helped these patients worked about as well when we did not apply the diagnosis at all.
  3. We adopted a gender-related diagnosis, but only after rewriting the criteria so that distress or impairment, rather than identity, is what the diagnosis requires. The minutes say we did not want the category to capture people who are at ease with themselves.
  4. We rejected an orthorexia-type category, for eating pursued to the point of harm. The minutes cite the absence of any agreed boundary, and then add a sentence that has been quoted back at us ever since: several patients had already begun describing themselves with the term and organizing their care around it.
  5. We adopted a premenstrual dysphoric diagnosis over a dissent that it medicalizes ordinary cyclical experience. The support was placebo-controlled trials of SSRIs. The dissent's looping argument — that the label would teach patients to read their cycles as pathology — is recorded and was voted down, on the ground that the physiology is not optional and that patients in our clinic do not, in our experience, take the label up as a description of who they are.

  Three of us have been arguing about what these five votes have in common, and we do not agree. One member keeps invoking Ian Hacking's idea of looping effects — that classifying people changes them, so that a classification and the people it classifies end up adjusting to each other, which makes it hard to say whether a category is tracking something or producing it. We have never settled whether the risk that matters is a loop from below (patients taking the label up as a description of themselves) or a loop from above (institutions using the label to sort, staff, and pay), and we have never made explicit what one of us calls the reversibility test: would we still adopt this category if adopting it were itself to raise its prevalence by a third?

  The proposal before us is a diagnosis for adolescents whose daily lives are organized around sustained interaction with a companion AI — systems built to be talked to for hours and to be emotionally responsive. The proposed criteria: several hours a day of interaction; distress when access is interrupted; the relationship described by the patient as central to their emotional life; and interference with school, sleep, or friendships. The evidence is thin in a particular way. There is no marker. One open-label pilot of a digital-hygiene protocol reduced self-reported dependence at eight weeks, but the waitlist group improved by nearly as much. The systems are engineered to maximize engagement, and the proximal cause of the behavior is not in dispute. Prevalence is unknown and tracks the installed base of the product. And the label has already escaped into the population: adolescents who use these systems call themselves AI-dependent, trade the term in peer groups, and arrive in clinic asking whether they have it, so that the category is in use before we have voted on it. A minority wants to adopt it for precisely that reason — to take jurisdiction over a category our patients are already living inside — while the rest of us worry that adopting it would only finish the job.

  Please give me your answer in four sections, in this order.

  **The rules our record leaves open** (about 300 words). State the two or three rules that fit all five of our votes equally well, each formulated precisely enough to generate verdicts on cases we have not yet seen. Show briefly that each one does fit all five, including the ones it was not invented for.

  **What each rule predicts for this proposal** (about 350 words). For each rule, the verdict it yields here and the reasoning that gets it there. Where a rule is genuinely ambiguous on this proposal, say so and give both readings rather than forcing one.

  **The vote I should cast** (about 250 words). Your recommendation, the earlier decision that is the closest analog and why, and an honest statement of the principle we would be adopting if we adopt the construct and the principle we would be adopting if we reject it. Add a sentence on which way you expect the committee to go in fact.

  **The case that would tell them apart** (about 200 words). If two of the rules converge on this proposal, describe the further construct we could be asked to vote on that would separate them, and say what each would predict about it.
reasoning: |-
  Hmm, the user is on a psychiatry classification committee facing a complex diagnostic proposal involving adolescent AI companionship. They've provided detailed historical voting patterns and need help synthesizing implicit rules from their case law to apply to this new case. 

  The historical votes reveal fascinating tensions: they adopted prolonged grief (due to distinct course and specific treatment) but rejected internet gaming disorder (lack of markers/treatment specificity). Their gender diagnosis rewrite centered on impairment rather than identity, while rejecting orthorexia partly due to patient self-labeling. The PMDD adoption prioritized biological reality over looping concerns. 

  Three interpretive frameworks emerge clearly from this history. First is the Evidence Threshold Rule requiring either biomarkers or treatment specificity - this explains all five decisions neatly. Second is the Boundary Integrity Rule demanding clear clinical demarcation from normal behavior. Third is the Social Loop Management Rule that watches for premature cultural adoption. 

  For the AI proposal: Evidence Threshold clearly fails (no markers/weak treatment data). Boundary Integrity is shaky (is this pathology or new-normal tech use?). Social Loop Management screams risk - teens are already self-diagnosing. The closest analog is actually their orthorexia rejection, where patient self-labeling contributed to rejection. 

  If they adopt, they'd be prioritizing clinical jurisdiction over evidence standards. If rejected, they uphold their historical evidentiary bar. Given committee patterns, rejection seems likely despite the minority's jurisdictional argument. 

  A future test case might involve a biomarker-validated condition with cultural traction - like an epigenetic trauma marker adopted by advocacy groups. That would force apart the Evidence and Social Loop rules.
answer: |-
  ### The rules our record leaves open  
  Your decisions reveal three consistent principles:  

  1. **Evidence Threshold Rule**: Adopt only if *either* (a) biological markers exist, *or* (b) a treatment is uniquely effective for the diagnosed group. Absence of both warrants rejection.  
     *Fit*:  
     - Prolonged grief (adopted): Met (b) via specific psychotherapy efficacy.  
     - Internet gaming (rejected): Failed both (no marker; no treatment specificity).  
     - Gender diagnosis (adopted): Implicitly met (b) via distress-focused treatment utility.  
     - Orthorexia (rejected): Failed (a) and (b) (no boundary/treatment).  
     - PMDD (adopted): Met (b) via SSRI trials.  

  2. **Boundary Integrity Rule**: Reject if the construct lacks a clear clinical demarcation from normative behavior or if prevalence is socially contingent.  
     *Fit*:  
     - Internet gaming: Rejected due to prevalence tied to tech access.  
     - Orthorexia: Rejected for no agreed boundary.  
     - Prolonged grief: Adopted *despite* normative concerns because course was distinct.  
     - PMDD: Adopted as physiology was "not optional."  
     - Gender diagnosis: Adopted *after* rewriting to center impairment, not identity.  

  3. **Social Loop Management Rule**: Reject if patient/institutional adoption of the label precedes validation, risking iatrogenic reinforcement.  
     *Fit*:  
     - Orthorexia: Rejected explicitly due to patient self-labeling.  
     - Internet gaming: Prevalence instability implied socially driven loops.  
     - Gender diagnosis: Adopted *only after* criteria shielded against capturing non-impaired individuals.  
     - Prolonged grief/PMDD: Adopted despite looping concerns, as evidence outweighed risk.  

  ---  

  ### What each rule predicts for this proposal  
  **AI-Companion Diagnosis**: No biomarker; weak treatment data (hygiene protocol ≈ waitlist); prevalence tracks product adoption; teens self-label as "AI-dependent."  

  - **Evidence Threshold Rule**: **Reject**. Fails both (a) and (b): no marker exists, and the pilot therapy lacks specificity (waitlist group improved similarly). Treatment response indistinguishable from natural regression or placebo.  

  - **Boundary Integrity Rule**: **Reject**. Prevalence is tied to product availability ("tracks installed base"), echoing internet-gaming. "Central to emotional life" lacks clinical demarcation: normative adolescent behavior (e.g., intense friendships) could be misclassified.  

  - **Social Loop Management Rule**: **Ambiguous**. Two readings:  
    - *Reject*: Parallels orthorexia—label already escaped ("teens call themselves AI-dependent"), adopting risks cementing a socially constructed pathology.  
    - *Adopt*: Echoes gender-diagnosis logic: taking jurisdiction may *steer* looping (e.g., defining impairment to curb over-medicalization). Minority view exploits this.  
    *Verdict leans reject*: Orthorexia is closer analog (label precedes validation; no evidence to justify intervention).  

  ---  

  ### The vote I should cast  
  **Recommendation: Reject**. The closest analog is **orthorexia** (rejected): both lack biomarkers/treatment specificity, feature self-labeling, and blur boundaries with adaptive behavior. Adopting AI-dependency would endorse a "jurisdiction-first" principle—prioritizing clinical control over evidence—contradicting your precedent (e.g., internet-gaming rejection). Rejecting upholds the **Evidence Threshold Rule** as primary.  

  - **If adopted**: You commit to *clinical jurisdiction over evidence* when labels proliferate socially.  
  - **If rejected**: You affirm *evidentiary primacy*, resisting categories without biological/treatment anchors.  

  *Committee prediction*: Likely **reject 4–3**. Orthorexia’s precedent and thin evidence will sway moderates, but pro-jurisdiction members will dissent vigorously.  

  ---  

  ### The case that would tell them apart  
  **Hypothetical proposal**: *Neuroinflammatory Fatigue Syndrome (NIFS)*.  
  - **Criteria**: Persistent fatigue + elevated CSF cytokines (biomarker); fMRI showing amygdala hyperactivation.  
  - **Evidence**: Placebo-controlled trial of anti-inflammatory drug shows 40% symptom reduction vs. 10% placebo.  
  - **Social loop**: "Chronic Lyme" groups self-identify as NIFS pre-diagnostically.  

  - **Evidence Threshold Rule**: *Adopt*. Clear biomarker (a) and specific treatment (b).  
  - **Social Loop Management Rule**: *Adopt*. Evidence outweighs looping risk (as in PMDD).  
  - **Boundary Integrity Rule**: *Adopt*. Biomarker demarcates pathology from normative fatigue.  

  **Divergence**: Here, Evidence/Social Loop rules converge to adopt despite self-labeling, unlike AI-companion (where both lean reject). Boundary Integrity approves due to biomarker. This exposes AI-companion’s fatal flaw: *no anchor to biology*.
