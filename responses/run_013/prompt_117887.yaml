prompt: |-
  I am trying to fix my credence in a thesis in the vicinity of what is usually discussed under the heading of consequentialist cluelessness, and I would like yours, fully decomposed. Please treat the following as the proposition, stated so that it has a truth value.

  (P) Deep cluelessness is real and pervasive. That is: for a large class of the actions actually available to a well-informed moral agent — not exotic thought experiments, but ordinary choices such as which career to pursue or which cause to donate to — the long-run consequences differ so greatly between the best and worst options, and that difference is carried so entirely by causal chains that are chaotic with respect to anything the agent could know, that no feasible improvement in information or computation would yield a justified credence above a bare 0.5 that one option is better than another. Count (P) true if this holds for a substantial share (say, a majority) of the consequentialist-relevant decisions a well-resourced agent faces over a lifetime, and false if it holds only for a fringe subset.

  My own credence is about 0.55. I want your number, but the number matters less than the derivation, so please give me a rough probability, with one line of justification each, for at least the following sub-questions, plus any others you think belong:

  - Whether the underlying sensitivity claim is true: that micro-differences in present conditions propagate to macro-differences in the far-future outcomes we care about, so that the sign of an action's long-run effect is hostage to details no one can know.
  - Whether, even granting that sensitivity, expected value is well-defined for these choices, or whether the relevant distributions have ill-behaved or divergent expectations — in which case the problem is one for decision theory rather than for information.
  - Whether the right response is to retreat from expected-value maximization to something more robust (rules, heuristics, or a restricted class of effects we can reliably influence), and whether that retreat concedes that consequentialism is false or only that it cannot serve as a usable decision procedure.
  - Whether deep cluelessness, if real, undermines consequentialism as a criterion of rightness, or is simply orthogonal to it.

  Then combine them, tell me which sub-question my 0.55 and your number most plausibly come apart on, and name the single argument or piece of evidence that would move your number the most.

  This is contested territory, so please be explicit about which of your claims are settled and which are live disagreements among people who work on this; do not present a contested reading as the consensus.

  End with a final line of exactly this form: \answer{X}, where X is your credence in (P) as a decimal.
