  Below is a decision tree that sorts positions on the epistemic status of models with false central assumptions. It uses forced-choice questions based on concrete cases, ensuring each internal node can be answered without prior knowledge of positions. The tree has 7 internal nodes and 8 leaves (7 named positions, 1 unoccupied). Positions that collapse without specific nodes are noted, and unoccupied combinations are diagnosed. Each leaf includes one sentence naming its most awkward commitment.

  ---

  ### **Decision Tree: Epistemic Status of Models with False Assumptions**

  **Start at Node 1:**  
  **A model’s central assumption (e.g., perfectly rational agents) is known to be false. What does this imply?**  
  - **A:** The falsity is a *positive strength*—more unrealistic assumptions yield more significant theories.  
  - **B:** The falsity is a *debt*—the model must eventually "pay it down" via de-idealization.  
  - **C:** The falsity is *irrelevant*—the assumption was never meant to describe the world, only to hold something fixed.  
  - **D:** The falsity *disqualifies* the model unless the assumption is approximately true.  

  ---

  #### **Branch A (Positive Strength)**  
  → **Leaf: Unoccupied**  
  *Diagnosis:* Incoherence—If falsity is a strength, the model cannot simultaneously describe reality. *Awkward commitment:* None (no defended view).  

  ---

  #### **Branch B (Debt)**  
  → **Node 2:** **Later work adds friction to a frictionless plane model. Does this successor model...**  
  - **A:** Come *closer to the truth* about real surfaces?  
  - **B:** Merely offer a *different model* with the same epistemic standing?  

  **Branch B → A (Closer to truth)**  
  → **Node 3:** **An economic model with infallible expected-utility agents predicts market behavior well. This success...**  
  - **A:** Gives reason to believe something about real agents’ *unobservable decision processes*.  
  - **B:** Shows only that the model is *empirically adequate* about observables (e.g., market outcomes).  
  - **C:** Shows *nothing at all* about real agents—it’s a useful calculating device.  

  - **Branch B→A→A (Believe unobservables):**  
    → **Leaf: Galilean Idealization (Convergent Realism)**  
    *Awkward commitment:* Must hold that de-idealization *always* converges to truth, even in complex systems.  
  - **Branch B→A→B (Empirically adequate):**  
    → **Leaf: Unoccupied**  
    *Diagnosis:* Neglect—Realists about de-idealization typically tie success to truth, not just observables.  
  - **Branch B→A→C (Nothing about agents):**  
    → **Leaf: Unoccupied**  
    *Diagnosis:* Incoherence—If de-idealization seeks truth, success must reveal *something* about the world.  

  **Branch B → B (Different model, same standing)**  
  → **Node 4:** **Treating a massive body as a point mass (distortion) vs. ignoring a known force like air resistance (isolation). These...**  
  - **A:** Have *different epistemic standing*—isolation is legitimate, distortion is not.  
  - **B:** Are points on a *single continuum* of idealization.  

  - **Branch B→B→A (Different standing):**  
    → **Leaf: Minimalist Idealization (Isolationism)**  
    *Awkward commitment:* Must deny the unity of science, holding that laws are *only* true in isolated systems.  
  - **Branch B→B→B (Single continuum):**  
    → **Leaf: Unoccupied**  
    *Diagnosis:* Unattractive—If all idealizations are equivalent, "debt" lacks meaning; de-idealization becomes arbitrary.  

  ---

  #### **Branch C (Irrelevant)**  
  → **Node 5:** **The model itself is best seen as a...**  
  - **A:** *Description* of the world (even if false or approximate).  
  - **B:** *Tool* for exploring what follows from assumptions—like an experiment on a non-existent system.  

  **Branch C → A (Description)**  
  → **Node 3:** **Economic model success (as above)...**  
  - **A:** (Believe unobservables) → *Incompatible with falsity being irrelevant* → **Leaf: Unoccupied** (Diagnosis: Incoherence).  
  - **B:** (Empirically adequate) → **Node 6:** **The regularities the model encodes (e.g., market equilibria) are...**  
    - **A:** True of the world (at least approximately).  
    - **B:** Only locally true of the model system—the world never quite matches them.  
    - **Branch C→A→B→A (True of world):**  
      → **Leaf: Constructive Empiricism**  
      *Awkward commitment:* Cannot explain *why* theories are empirically successful without truth.  
    - **Branch C→A→B→B (Locally true):**  
      → **Leaf: Unoccupied**  
      *Diagnosis:* Neglect—No major view pairs descriptive models with purely local truth while deeming falsity irrelevant.  
  - **C:** (Nothing about agents) → **Node 6:** **Regularities are...**  
    - **A:** (True of world) → *Incompatible with "nothing about agents"* → **Leaf: Unoccupied** (Diagnosis: Incoherence).  
    - **B:** (Locally true) → **Leaf: Model Fictionalism**  
      *Awkward commitment:* Must explain how we learn from models *without* them representing reality.  

  **Branch C → B (Tool)**  
  → **Node 7:** **The model’s primary role is...**  
  - **A:** *Prediction* (forecasting observable outcomes).  
  - **B:** *Exploration* (e.g., understanding possibilities or explanations).  

  - **Branch C→B→A (Prediction):**  
    → **Leaf: Friedman-style Instrumentalism**  
    *Awkward commitment:* Cannot account for models’ *explanatory* success.  
  - **Branch C→B→B (Exploration):**  
    → **Leaf: Model-as-Experiment View**  
    *Awkward commitment:* Must justify how exploring non-actual scenarios informs us about the *actual* world.  

  ---

  #### **Branch D (Disqualifies)**  
  → **Node 3:** **Economic model success (as above)...**  
  - **A:** (Believe unobservables) → **Leaf: Assumption-Realism**  
    *Awkward commitment:* Must hold that successful models *cannot* have centrally false assumptions.  
  - **B:** (Empirically adequate) → *Incompatible with disqualification* → **Leaf: Unoccupied** (Diagnosis: Incoherence—empirical adequacy assumes the model is usable).  
  - **C:** (Nothing about agents) → **Node 6:** **Regularities are...**  
    - **A:** (True of world) → *Incompatible with "nothing about agents"* → **Leaf: Unoccupied** (Diagnosis: Incoherence).  
    - **B:** (Locally true) → **Leaf: Cartwright-Style View**  
      *Awkward commitment:* Must deny fundamental laws explain; only phenomenological regularities hold locally.  

  ---

  ### **Collapsed Positions & Unoccupied Leaves**
  - **Instrumentalism, fictionalism, and constructive empiricism** collapse without Node 3 (economic model) and Node 5 (description vs. tool). Node 3 separates belief in unobservables (realism) from anti-realism; Node 5 separates descriptive (fictionalism, constructive empiricism) from non-descriptive (instrumentalism) anti-realism.  
  - **Galilean vs. minimalist idealization** requires Node 2 (de-idealization) to separate convergent progress (Galilean) from pluralistic legitimacy (minimalist). Without Node 2, they merge into a generic realism.  
  - **Unoccupied leaves (5 total):** All due to incoherence (3), neglect (1), or unattractiveness (1). Diagnoses are in the tree.  

  ### **Tree Summary**
  - **Internal nodes:** 7 (1, 2, 3, 4, 5, 6, 7).  
  - **Leaves:** 8 (7 named, 1 unoccupied in Branch A).  
  - **Total positions:** Friedman instrumentalism, model fictionalism, constructive empiricism, Galilean idealization, minimalist idealization, Cartwright-style, model-as-experiment, assumption-realism.  

