prompt: |-
  I'm giving a talk at our cognitive science lab meeting defending a paper where I argue that when someone reliably offloads remembering onto an external thing -- a phone, a notes app, these days a chatbot -- and does it automatically, without deciding each time, that offloaded process should count as part of their memory itself, not just a tool they happen to use. My actual move is that the artifact has to be woven into a control loop the person is running, so that pulling it out changes the process, not merely the performance; and I predict offloaded recall should show the same interference signatures as internal recall (swap their usual device for an unfamiliar one and it should degrade roughly the way scrambled internal memory would). The room is mostly experimental psychologists who run memory and attention studies, two computational neuroscientists, and one philosopher of cognitive science who's deep into embodied/4E views. Can you draft my Q&A prep sheet: the objections this exact crowd will actually throw at me, in their own vocabulary, ordered by how much damage they'd do, each with a two-minute reply and a note on where the reply is soft, plus the one question I'm really hoping nobody asks.
