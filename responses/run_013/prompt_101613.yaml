prompt: |-
  I'm a master's student in public policy who spent two summers working at a small irrigation cooperative, and I keep running into a pattern that I have no name for and that none of the labels I've been handed quite seem to fit. Here is the shape of it. A shared resource — water, a pasture, a fishery, a shared database, a pool of overtime shifts — is owned by no one and has no formal rule governing its use, yet it stays intact for years, not because people are virtuous but because use is *legible*: everyone can see who is taking what. I hold back not out of principle but because being seen to overdraw would cost me more, in standing and in future cooperation, than the extra I would gain. Now suppose something changes that touches nobody's preferences and nobody's numbers: the resource starts being drawn through an intermediary, or usage gets aggregated into statistics, or the group grows past the point where you know the other users, or a privacy-protecting reform hides individual consumption. Taking becomes hard to attribute. The resource collapses. The users are no more numerous, no greedier, and no worse off in any material sense; all that has changed is that individual use has become illegible. Two further things strike me, and the usual story doesn't capture either. First, the loss of legibility is often something people *chose*, because it arrived bundled with something genuinely good — privacy, convenience, scale — so the collapse is the price of a benefit rather than a failure of character. Second, the obvious remedy — metering, auditing, surveillance to restore legibility — carries its own costs, so there is a real trade-off rather than a clean fix.

  So my question is whether there is an established name for this specific dependence of a shared resource on the legibility of individual use, and for the collapse that follows when legibility is lost. I want to be told clearly what it is *not*. It is not, I think, the plain tragedy of the commons, because there the problem is open access and the driver is the number of users or the absence of any norm, whereas here a working norm exists and the only thing that changes is observability. It is not the free-rider problem, because the people here are not riding free — they are still contributing; they have merely stopped being *seen* to contribute, and the collapse runs through reputation rather than through each person's private calculus. It is not just a matter of enforcement, because no rule was ever enforced; the norm held by visibility, not by sanction. And I suspect it is also not the same as the literature on how communities successfully govern shared resources, because that literature seems to treat legibility as one design feature among several rather than as the load-bearing one. If a single established term does cover this, tell me which, and where my description overshoots or undershoots it; if nothing does, coin a term and define it, and tell me where its edges are — whether a norm sustained by mutual visibility is the same phenomenon as one sustained by an external monitor, and whether the collapse still counts if legibility was lost but a new norm grew back in its place.

  Please structure your answer as follows: (1) **Restatement** — the phenomenon in your own words in a few sentences, so I can check that you have got it; (2) **The nearest existing concepts** — the two or three closest terms or bodies of work, each in a short paragraph, naming the specific respect in which each fails to fit; (3) **Verdict** — either the single best-fitting term or, if none fits, a coinage with a definition, in one or two paragraphs; and (4) **Boundary cases** — a short list of cases that would test the definition.
reasoning: |-
  Okay, the user is a master's student in public policy who worked at an irrigation cooperative. They've noticed a pattern where a shared resource remains sustainable because individual usage is visible to all, leading to self-restraint based on social standing. But when something makes usage illegible—like an intermediary or privacy measures—the resource collapses, even though users haven't become greedier. They want to know if there's a term for this specific dependence on legibility and the collapse that follows.

  First, I need to restate the phenomenon clearly. The key points are: mutual visibility enables informal social enforcement; illegibility breaks that, causing collapse without changes in greed or numbers. The user already ruled out Tragedy of the Commons, free-rider problem, and Ostrom's design principles. So I should confirm why those don't fit. 

  Tragedy of the Commons is about open access and no norms, whereas here norms exist but rely on visibility. Free-rider problem involves actual non-contribution, but here people still contribute—they just aren't seen. Ostrom's work includes monitoring as one factor, but the user emphasizes it as the load-bearing element. 

  Looking for existing concepts, "observability" in institutional economics comes close but isn't specific to mutual visibility. "Informal social control" captures the mechanism but doesn't highlight the collapse from losing legibility. So no perfect term exists. 

  For the verdict, I'll coin "Legibility Collapse". Define it as the breakdown when mutual visibility is lost. Mention that it's distinct because no new norms form, and external monitors change the dynamic. 

  Boundary cases: mutual visibility vs external monitors, partial legibility loss, and if new norms emerge post-collapse. These test if the core is mutual visibility and irreversible collapse. 

  The user's deeper need might be to frame their observations for academic work, seeking credibility with a precise term. They might also want to highlight trade-offs in policy interventions that unintentionally harm resources by reducing transparency. Ensuring the response addresses both the academic gap and practical implications would be valuable.
answer: |-
  Here’s a structured analysis of your phenomenon:

  ### (1) Restatement
  The phenomenon describes a shared resource sustained by **mutual visibility of individual use**, where participants self-limit consumption because social costs (reputational damage, lost future cooperation) outweigh the benefits of overuse. This equilibrium collapses **not due to changes in user behavior, incentives, or group size**, but solely because individual actions become obscured (e.g., through intermediaries, aggregation, privacy measures, or scaling). The collapse occurs despite unchanged material conditions, and restoring legibility (via surveillance) incurs new trade-offs.

  ### (2) Nearest Existing Concepts
  - **Ostrom’s Design Principles (CPR Governance):**  
    Ostrom emphasizes monitoring as a key feature for sustainable commons, but treats it as *one component* within a broader institutional framework (e.g., clear boundaries, conflict resolution). Your case isolates **observability itself as the primary sustaining mechanism**—no formal rules, sanctions, or collective-choice procedures exist. Ostrom’s work doesn’t address systems where *only* visibility prevents collapse, nor the paradox where privacy/scale (often societal goods) trigger failure.

  - **Informal Social Control / Reputational Enforcement:**  
    This literature acknowledges that visibility enables norm enforcement via reputation. However, it doesn’t specifically diagnose **the fragility introduced when legibility is externally eroded** (rather than by internal norm decay). Your case highlights a *systemic vulnerability*: the resource fails when the *infrastructure of observability* is disrupted, even if social ties remain intact.

  - **Transaction Cost Economics (Observability Problems):**  
    Work on "observability" in contracting (e.g., Holmström, Milgrom) notes that hidden actions distort incentives. Yet this focuses on principal-agent dynamics with *formal* incentives, not **informal, reputation-based restraint in non-hierarchical groups**. Your case lacks principals, contracts, or explicit rewards/punishments—only latent social consequences matter.

  ### (3) Verdict: Coinage  
  **Legibility Collapse** best captures your phenomenon.  

  **Definition:** *The breakdown of a self-regulating, shared-resource system resulting solely from the loss of mutual visibility of individual contributions or withdrawals, where no formal governance exists and where collapse is driven by the erosion of reputational enforcement mechanisms.*  

  **Why it fits:**  
  - Centers **legibility** (observability + attribution) as the critical variable.  
  - Distinguishes from the Tragedy of the Commons by requiring a *pre-existing, stable equilibrium* maintained by visibility.  
  - Excludes free-riding by emphasizing that collapse occurs *despite continued participation/contribution*—only attribution is lost.  
  - Acknowledges the trade-off: Legibility often conflicts with values like privacy or efficiency, making restoration costly.  

  **Boundary:** Legibility Collapse occurs only when:  
  - Mutual visibility was the *sole* stabilizer (no sanctions, rules, or altruism).  
  - No new governance emerges post-legibility loss (if norms adapt, it becomes a different dynamic).

  ### (4) Boundary Cases
  1. **External Monitoring:** A fishery switches from fishers observing each other to satellite surveillance. *Is this still Legibility Collapse?*  
     → **No.** The resource persists, but the enforcement mechanism shifts from *mutual* to *centralized* legibility. Collapse only occurs if attribution vanishes entirely.

  2. **Partial Obscurity:** In a cooperative, 30% of water withdrawals are anonymized. *Does collapse occur?*  
     → **Unclear.** Depends on whether the remaining 70% of visible use sustains sufficient reputational pressure. Tests the *threshold* of legibility needed.

  3. **Norms Persist Without Visibility:** After database usage is anonymized, users still self-limit out of habit. *Is collapse inevitable?*  
     → **Yes, by definition here.** If restraint continues, it implies an *internalized norm* was always present—violating your condition that restraint was purely reputational.

  4. **Legibility Restored by Users:** A collapsed work-share pool reverts to a public sign-up sheet. *Does the resource recover?*  
     → **Yes, but distinct.** Recovery confirms legibility’s role, but the collapse itself remains a discrete event fitting the definition.

  ### Key Insight
  Your phenomenon reveals a **subtype of institutional fragility**: systems relying entirely on "soft" enforcement via mutual legibility are uniquely vulnerable to technological or organizational changes that anonymize individual actions. Naming it *Legibility Collapse* isolates this mechanism from broader commons governance failures—a crucial distinction for policy design where privacy, scale, or efficiency gains might inadvertently dismantle invisible social contracts.
