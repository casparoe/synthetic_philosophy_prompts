  7. **Q7a - (For those with all No) Do you think the concept of 'democratic backsliding' is often used as a partisan weapon?**
     - Yes: **Leaf E - The whole word is a partisan label and the real question is "whose team are you on".**
     - No: **Leaf F - It's just ordinary politics with a scary name.**

  8. **Q7b - (For those with at least one Yes) Do you think the opposition's actions in 2023 (expanding the court and the media ownership law) also undermine democracy?**
     - Yes: Go to Q8.
     - No: Go to Q8.

  9. **Q8 - For the actions you considered to undermine democracy, was the government's intent to entrench itself in power a necessary factor in your judgment?**
     - Now, based on Q7b and Q8:
       - If Q7b is No and Q8 is Yes: **Leaf C - It's about the intent to entrench rather than the effects.**
       - If Q7b is No and Q8 is No: **Leaf B - Rights and the rule of law count too.**
       - If Q7b is Yes and Q8 is No: **Leaf D - It's about the effects regardless of intent.**
       - If Q7b is Yes and Q8 is Yes: **Note: This combination is rare and doesn't fit a clean leaf. It suggests that intent matters and both sides are guilty of intentional backsliding. In practice, few hold this because the opposition just won and might not have intent to entrench in the same way.**

  10. **Q9 - (For those with at least one Yes in Q3-Q6) Do you think the term "democratic backsliding" is too soft and we should call it what it is (e.g., authoritarianism)?**
      - Yes: **Leaf G - It's real but "backsliding" is too soft and we should just say what it is.**
      - No: Remain with the leaf from Q8.

  But Q9 is asked after Q8, and if they say Yes to Q9, they go to Leaf G, overriding the previous leaf.

  However, Leaf G is about terminology, so it could be combined with any substantive view. But to avoid too many leaves, we can let Leaf G be a final override for terminology.

  But then a person could be at Leaf C but also Leaf G? We can say that if they say Yes to Q9, they go to Leaf G, and we don't care about the previous classification for naming.

  Alternatively, we can make Q9 for all who have backsliding, and if they say Yes, they are G, if No, then they go to the leaf from Q8.

  So in the tree, after Q8, we ask Q9 for the backsliding group.

  But we have to stop.

  Given the complexity, let's finalize the tree as follows, with 9 questions.

  Also, note: we might not separate Leaf B and Leaf D clearly, but in our tree, Leaf B is when they see backsliding only by NRF and not by opposition, and don't require intent, so it's about effects but only one side. Leaf D is when both sides are bad by effects.

  And for the rare case of Q7b Yes and Q8 Yes, we flag it.

  Also, for the redistricting, if someone cares only about that, it's included.

  Finally, the tree in plain language.

  **Democratic Backsliding in Marena Decision Tree:**

  1. **Start with Question 1:**  
     "When judging if a government action harms democracy, should we just go by whether the country's own courts said it was legal at the time?"  
     - **If YES → Position H:** "It's whatever the courts or international monitors say it is."  
     - **If NO → Move to Question 2.**

  2. **Question 2:**  
     "Is the only thing that can destroy a democracy a rigged or stolen election?"  
     - **If YES → Position A:** "Only broken elections count as backsliding."  
     - **If NO → Move to Question 3.**

  3. **Question 3:**  
     "Did forcing out constitutional judges in 2017 (via a retirement law) weaken democracy, even though it was legal?"  
     - Yes/No  
  4. **Question 4:**  
     "Did the 2018 media law (leading to channels being sold to a government ally) weaken democracy?"  
     - Yes/No  
  5. **Question 5:**  
     "Did the 2019 referendum threshold change (from 50% to 33%) and the referendum itself weaken democracy?"  
     - Yes/No  
  6. **Question 6:**  
     "Did the 2020 redistricting weaken democracy?"  
     - Yes/No  

     - **If you answered NO to all of Questions 3-6 → Move to Question 7A.**  
     - **If you answered YES to at least one of Questions 3-6 → Move to Question 7B.**

  7. **Question 7A (for the "NO on all" group):**  
     "Do you think people mostly use the term 'democratic backsliding' as a political weapon against their opponents?"  
     - **If YES → Position E:** "The whole word is a partisan label; the real question is 'whose team are you on?'"  
     - **If NO → Position F:** "It's just ordinary politics with a scary name."  

  8. **Question 7B (for the "YES on at least one" group):**  
     "Do the opposition's 2023 actions (expanding the court and passing the media ownership law) also weaken democracy?"  
     - Yes/No → **Then move to Question 8.**

  9. **Question 8:**  
     "For the actions you said weakened democracy, was it essential that the government was trying to grab power for itself?"  
     - Yes/No → **Now assign a position based on your answers to 7B and 8:**  
       - If you said **NO to 7B (opposition not bad) and YES to 8 (intent matters)** → **Position C:** "It's about the intent to entrench rather than the effects."  
       - If you said **NO to 7B (opposition not bad) and NO to 8 (intent not necessary)** → **Position B:** "Rights and the rule of law count too."  
       - If you said **YES to 7B (opposition bad) and NO to 8 (intent not necessary)** → **Position D:** "It's about the effects regardless of intent."  
       - If you said **YES to 7B (opposition bad) and YES to 8 (intent matters)** → **Note:** This view is rare and messy. It might mean you think both sides tried to entrench power, but few people argue this because the opposition had just won power. It doesn't cleanly fit a named position.  

  10. **Question 9 (for the "YES on at least one" group, after Q8):**  
      "Is 'democratic backsliding' too gentle a term? Should we just call it authoritarianism or something stronger?"  
      - **If YES → Position G:** "It's real but 'backsliding' is too soft; we should just say what it is."  
      - If no, you keep the position from Question 8 (B, C, D, or the rare view).

  **Notes on the tree:**

  - **Position G** can be reached from any of the backsliding views (B, C, D) if you answer YES to Question 9. It overrides the label but not the substance.
  - **The rare view** (YES on 7B and YES on 8) isn't a named leaf because it's uncommon and the user didn't request it. In practice, it might align with "both sides are corrupt" or "all elites undermine institutions," but it's not a standard backsliding position.
  - **Leaf B and D are separated** by whether the opposition's actions are seen as harmful (D) or not (B).
  - **We didn't forget redistricting** — it's covered in Question 6.
  - **The tree can't separate** someone who thinks only elections matter (A) from someone who thinks only courts/media matter but didn't see these cases as bad (F) — but they are separated by Question 2 and the path.
  - **No one likely holds** the rare view (YES on 7B and YES on 8) because it requires attributing entrenchment intent to a party that just won power and was undoing past changes. It's not incoherent, just implausible.

