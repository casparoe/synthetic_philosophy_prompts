  The user wants the toast to be 4-5 minutes long, with the tension as the spine. They don't want a lecture; the philosophy should be underlying, not explicit. Also, after the toast, they need a private note highlighting what's settled versus debated in cultural studies, so they don't present contested ideas as facts.

  I should start by framing the sister's success through both lenses. Begin with personal anecdotes that show her character—both her drive and her humility. Use stories that both sides can relate to, like her baking mishap or helping the neighbor. This humanizes her and bridges the gap. Then, acknowledge the cultural perspectives without diving deep into academic debates. Present the tension as a universal human experience, not just Danish vs. American.

  For the personal concern about status grabbing, the toast should emphasize the sister's own efforts and the family's pride without claiming any reflected glory. Maybe use a metaphor like "standing near the sun" but clarify that the tan isn't theirs. Highlighting specific actions of the sister that show her remaining grounded can counter the envy reading.

  In the private notes, I need to clarify the academic perspectives. Janteloven's origins in satire but its real-world application, the debates on whether it's envy or social cohesion. The American Dream's contested nature—empowerment vs. victim-blaming. Also, note that the user's role is to celebrate, not claim success, which addresses their personal worry.

  I should avoid jargon and keep the toast warm and personal. Use humor where appropriate, like the baking story. Structure it with an intro, personal stories, the cultural tension as a reflection of human nature, and a conclusion that ties both values together. Make sure both sides feel recognized and respected. The private notes will then outline the settled points versus ongoing debates so the user is informed but doesn't present contested ideas as facts during the toast.
