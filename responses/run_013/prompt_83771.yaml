answer: |-
  Here’s a tightened, one-page proposal framework addressing your core argument and specifications:

  ---

  **Project Title:** Beyond Bureaucracy: Concealment as a Universal Criterion for Defining Corruption  

  **Research Question:**  
  Can *concealment of transfers* (independent of public office) function as a cross-culturally valid criterion for corruption when office-based definitions fail?  

  **The Problem:**  
  Dominant corruption frameworks rely on *breach of public office duties* (e.g., Nye, Kaufmann). This assumes:  
  1. A formal state with role differentiation ("office").  
  2. That societies share Western bureaucratic norms.  
  This excludes non-state societies (e.g., kinship-based groups) and legitimizes "legal" corruption (e.g., open patronage). Conversely, *concealment-based* definitions (e.g., transfers hidden from third-party scrutiny) are dismissed as secondary or insufficient. Yet:  
  - **Office ≠ corruption:** Open nepotism may violate office duties but lacks concealment.  
  - **Concealment ≠ corruption:** Secret gifts may hide shame, not corruption.  
  **The gap:** We lack systematic analysis of whether concealment *alone* can define corruption absent office, especially in non-Western/stateless contexts.  

  **Methodology (Desk-Based):**  
  1. **Conceptual Analysis:**  
     - Disaggregate "office" (formal role, delegated authority) and "concealment" (intent to hide from third-party scrutiny).  
     - Identify necessary/sufficient conditions for each to define corruption.  
  2. **Case-Based Scrutiny:**  
     - Select 8-10 historical/anthropological cases (e.g., tribal gift economies, pre-colonial administrations, modern lobbying) where office-based and concealment-based criteria *diverge*.  
     - Analyze primary/secondary sources: Do observers label acts "corrupt" based on concealment *despite* no formal office? Or vice versa?  
  **No fieldwork**—relies on existing ethnographies, historical records, and legal/policy documents.  

  **Genuine Result (Beyond Taxonomy):**  
  A successful outcome would:  
  - Demonstrate that **concealment operates as a standalone corruption criterion** in societies lacking formal bureaucracy (e.g., secret deals violating communal norms).  
  - **Theoretically explain why concealment is foundational:** It signals a shared recognition that the transfer undermines a group’s legitimate order, irrespective of formal roles.  
  - **Implications:** Challenge the claim that anti-corruption standards require "exporting bureaucracy." A concealment-based criterion offers a culturally adaptable tool for norm enforcement.  

  **Failure Conditions:**  
  The project fails if:  
  1. Concealment *only* signals corruption when a formal office exists (undermining universality).  
  2. Concealment is *always* incidental (e.g., hiding shame, not illegitimacy) in non-office cases.  
  3. Cases show no stable pattern—concealment lacks consistent connection to social judgments of corruption.  

  **Why It Matters:**  
  Resolves tensions in anti-corruption policy: If concealment independently defines corruption, international frameworks can avoid imposing Western bureaucratic models. This offers a non-ethnocentric standard for cross-cultural accountability.  

  ---

  ### Key Strengths of Framing
  - **Determinate Answer:** Tests concealment’s *independent utility* in defining corruption. Success/failure hinges on empirical patterns in cases.  
  - **Critical Edge:** Targets the "state-centric" bias in corruption studies and policy.  
  - **Scope:** Desk-based, feasible in 6 months. Cases selected for conceptual divergence (not representativeness).  
  - **Output Clarity:** "Genuine result" establishes theoretical stakes—*why* concealment matters beyond classification.  
  - **Failure Defined:** Clear, falsifiable conditions (e.g., concealment’s dependence on office).  

  **Next Steps:** Insert cases (e.g., Māori *koha*, Ottoman tax-farming, modern corporate bribery) and citations to ground the divergence claim. Emphasize how this reframes debates on "universal" norms.
