prompt: |-
  I'm putting together a proposal for a small grant -- six months, one person, mostly desk work -- on the corruption question, and I need the framing tightened up. Here's my half-baked idea. Accounts of corruption seem to come in two shapes: by the office (a public role's power converted into private benefit) or by concealment (a transfer the parties have some reason to hide from third-party scrutiny). I think these come apart in ways people haven't taken seriously enough -- there's openly-broadcast patronage that hides nothing, and secret transfers nobody would call corrupt -- and the more interesting point is that the office criterion seems to presuppose a state with role-differentiated duties, while the concealment criterion might be available to any society at all. If that's right it matters a lot for the "are Western standards universal?" fight, because it'd give us a criterion that isn't just exported bureaucracy. Turn this into a one-page proposal: state the question so it has a determinate answer, say why the office-based and standards-based accounts leave it open, say what the method actually is (no fieldwork -- it's conceptual work plus reading how the cases get described), what a genuine result looks like as opposed to just a taxonomy of cases, and what would count as the project failing. Don't bother with citations, I'll add those.
