answer: |-
  Here is a continuous prose decision tree exploring the logical space of positions on the heterogeneity of pleasure, incorporating your diagnostic cases and constraints:

  We begin by asking whether there is a single, defining feature common to all experiences we call pleasure – the taste of the peach, the relief from headache, the good mood, the satisfaction of solving a proof, delight in a friend's success. If the answer is yes, then we must identify what *kind* of thing this unifying feature is. One path is that it is a specific, intrinsic *felt quality* present in the experience itself – a distinctive phenomenological 'tone' or 'glow'. Taking this intrinsic quality path leads to another fork: is this felt quality a single, simple sensation, like a uniform brightness, making all pleasures fundamentally alike in kind (differing only in intensity or source), or is it rather a complex *determinable* – a high-level category encompassing many distinct, incommensurable determinate feelings (e.g., the buzz of excitement, the warmth of contentment, the sharpness of relief)? This distinction is crucial for whether 'higher' intellectual pleasures and 'lower' sensual pleasures can truly be compared on a single scale. If, however, the unifying feature is not intrinsic but *relational*, we face another set of choices. Perhaps pleasure is defined by its relation to *desire*: it is whatever experience the subject intrinsically desires to have for its own sake, or conversely, the satisfaction of a desire. Alternatively, pleasure might be defined by an *attitude* of being pleased by or liking the experience as it occurs. A third relational option is *functionalism*: pleasure is whatever mental state plays a specific causal role, typically being sought for its own sake and reinforcing the behaviors that lead to it. These relational accounts must grapple with the masochist who desires and perhaps likes a sensation others call pain, and the person who takes pleasure in a friend's success without necessarily having a distinct concurrent sensation – does their pleasure consist *in* the desire for the friend's good, the liking of the news, or the functional role of that state? They also face the case of the dreamless, restful sleep: if pleasure requires a *felt* experience, this state seems pleasurable only retrospectively; but if pleasure is a relational property (e.g., the satisfaction of a desire for rest), it might be pleasurable even unfelt.

  But perhaps the initial answer is no; there is no single defining feature shared by all pleasures. If so, we must consider whether the category 'pleasure' is still usefully unified. One possibility is a *cluster concept* or *family-resemblance* view: while no single feature is common to all pleasures, various overlapping features (like being inherently motivating, feeling good in some way, involving desire satisfaction, causing one to seek more) link them together in a network, allowing 'pleasure' to function as a coherent, albeit pluralistic, category for hedonism. If this cluster view seems too weak, the remaining options offer less unity. *Disjunctivism* holds that 'pleasure' simply names a disjunction of fundamentally different states – the peach taste, the headache relief, the proof-satisfaction, etc. – with no deeper unity, perhaps relying only on our disposition to label them similarly. *Eliminativism* goes further, arguing that 'pleasure' fails to pick out any coherent natural kind; the heterogeneity reveals it to be a confused folk concept unfit for precise ethical theory like hedonism. Finally, a *deflationary* or *no-fact-of-the-matter* view suggests the heterogeneity stems from a merely verbal dispute; there is no objective answer to what pleasure really is, only different ways of using the word based on context or preference.

  Now, consider how these positions handle the diagnostic cases. Relief poses a problem for simple felt-quality views: is the cessation of pain a *positive* feeling or just the absence of a negative? The dreamless restful sleep challenges relational views: can a state be pleasurable if entirely unfelt, or does pleasure require phenomenology? The masochist complicates desire/attitude/functional role views: if they desire and like the 'pain', is it pleasure for them? Vicarious pleasure (in a friend's success) tests the scope of relational properties and whether a distinct feeling is necessary. The person appreciating wonderful music without concurrent feeling probes the boundaries of what constitutes pleasure: is their subsequent judgment sufficient, or must there be a felt moment-to-moment experience? A simple felt-quality theorist might deny the music case is pleasure at all, while a desire-satisfactionist might count it if the person desired to hear it. The functionalist might look for reinforcing behavior. The cluster theorist has more flexibility, and the disjunctivist can simply add it as another disjunct.

  **Combinations & Constraints:** Few hold a simple felt-quality view *and* accept the dreamless sleep as genuinely pleasurable *during* the sleep; such a combination is unattractive because it severs pleasure from conscious experience. Similarly, eliminativism combined with strong hedonism is incoherent. Views that collapse: Pure desire-based and attitude-based liking theories often converge in practice and may only diverge sharply in the unfelt pleasure case (e.g., can an unfelt state satisfy a desire? Yes. Can it be the object of a *liking* attitude? Less clear). Functionalism sometimes overlaps significantly with these relational views unless strictly tied to specific causal mechanisms. The determinable felt-quality view and the cluster view can be difficult to distinguish empirically, relying more on metaphysical commitments about properties. The disjunctive view is often indistinguishable from eliminativism in its practical consequences for hedonistic calculation, making it similarly unattractive for most hedonists. The deflationary view is largely unexplored in ethical theory due to its undermining of normative debate.
