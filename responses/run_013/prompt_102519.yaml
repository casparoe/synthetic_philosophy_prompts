answer: |-
  ### Exam Question (90-minute essay)  
  **"Patients with pain asymbolia report feeling pain yet exhibit no distress, avoidance, or protective behavior—sometimes even laughing at injuries. Using this case, critically evaluate whether *anything* remains intrinsically 'bad' about their pain experience. Distinguish three distinct candidate sources for pain’s badness: (i) its intrinsic phenomenal quality, (ii) its motivational force, and (iii) its role as a signal of bodily damage. Explain which (if any) of these sources survives asymbolia and why. In your analysis, clarify how pain asymbolia differs from congenital insensitivity to pain and why this distinction is pivotal to your argument. Finally, assess whether the asymbolic patient is still 'worse off' due to their condition—and if so, in what sense."**  

  ---

  ### Model Answer (650 words)  
  Pain asymbolia presents a profound challenge to intuitive accounts of pain’s badness. Patients accurately describe pain’s sensory qualities (e.g., location, intensity) but lack any negative affect, demonstrating no aversion, suffering, or defensive actions. To address what—if anything—remains "bad" in such cases, we must dissect three candidate sources of badness and test their resilience against asymbolia.  

  **First, intrinsic phenomenal quality**: Some argue pain’s badness lies in its raw feel—a hurtfulness inherent to the sensation itself. Asymbolia refutes this. Patients perceive pain’s sensory dimension ("I feel a burning cut") yet report *no unpleasantness*. This decoupling proves that the putative "awfulness" of pain isn’t intrinsic to the sensation but depends on an affective layer that asymbolia disrupts. If badness were truly phenomenal, asymbolics *would* suffer—but they do not.  

  **Second, motivational force**: Pain is often seen as bad because it compels avoidance (e.g., via "stop this!" imperatives). Asymbolia dismantles this view. Patients feel pain but feel *no urge* to withdraw, treating injuries with indifference. The motivational "badness" vanishes precisely because the affective driver of action is absent. Without distress, pain loses its normative force to command action, revealing that imperatives rely on affective states, not sensation alone.  

  **Third, signaling bodily damage**: Pain might be bad instrumentally—as a warning of harm. Crucially, this account *survives* asymbolia. Even when unaccompanied by suffering, pain still carries information about tissue damage (e.g., a patient noting "my leg is cut" without concern). The signal remains intact and epistemically useful. However, its "badness" is now extrinsic: damage is bad, but pain itself is merely a neutral messenger. Stripped of affective weight, the signal loses its normative urgency.  

  **Distinguishing asymbolia from congenital insensitivity (CIP)** is essential here. CIP patients lack *sensory detection* of pain—they feel nothing, often incurring severe injuries unknowingly. Asymbolics, conversely, *feel* pain but lack affective responses. This distinction matters because CIP challenges pain’s *epistemic* role (they miss signals entirely), while asymbolia isolates and disrupts *affective-motivational* components. Only asymbolia tests whether badness can persist independently of suffering.  

  **Is the asymbolic patient worse off?** Functionally, yes—but not experientially. They remain vulnerable to injury (e.g., ignoring a fractured bone) because pain fails to motivate protection. This instrumental harm arises from the *absence* of badness-affect, not its presence. Yet experientially, they are *not* worse off: they feel pain without suffering, arguably achieving a state some might envy. The "badness" lies not in their consciousness but in the failure of a protective mechanism.  

  **Conclusion**: Asymbolia shows that pain’s badness cannot reside in intrinsic feel or motivational force—both require affective engagement. Only its signaling role persists, but as a neutral indicator. The patient’s "worse off" status is thus purely instrumental: they lose pain’s biological function, not its experiential torment. Pain’s badness, then, is not in the sensation but in the inescapable aversion it typically evokes—an aversion absent in asymbolia.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Must-hit moves** (A-grade answers hit all; B-grade miss nuances):  
  1. **Accurate description of asymbolia vs. congenital insensitivity** (4 marks)  
     - *A: Clearly distinguishes asymbolia (preserved sensation/lost affect) from CIP (lost sensation).*  
     - *B: Blurs the distinction (e.g., "both don’t feel pain’s badness") or omits functional consequences.*  

  2. **Analysis of how asymbolia threatens each candidate source of badness** (4 marks)  
     - *A: Explains *why* intrinsic/motivational accounts fail (e.g., "no suffering despite sensation").*  
     - *B: States threats superficially (e.g., "asymbolia disproves intrinsic badness") without causal links.*  

  3. **Identification of the surviving account (signaling) + its transformed status** (3 marks)  
     - *A: Notes signaling survives *as extrinsic/instrumental* and explains its neutrality ("neutral messenger").*  
     - *B: Claims signaling survives but treats it as intrinsically bad or conflates signal with damage’s badness.*  

  4. **Assessment of "worse off" status with dual experiential/instrumental distinction** (5 marks)  
     - *A: Separates experiential (not worse off) from instrumental (vulnerable, thus worse off).*  
     - *B: Conflates dimensions (e.g., "still bad because they get hurt") or ignores experiential neutrality.*  

  5. **Why the CIP/asymbolia distinction matters for the argument** (4 marks)  
     - *A: Uses distinction to show asymbolia uniquely tests affect’s role (CIP tests sensation).*  
     - *B: Mentions distinction but fails to tie it to isolating affect (e.g., "CIP is different but irrelevant").*  

  **A (17–20)**: Hits all moves with precision, uses asymbolia to *build* an argument (not just describe), and defends a coherent stance on "badness."  
  **B (13–16)**: Covers all moves but with gaps in causal reasoning (e.g., states conclusions without showing *how* asymbolia challenges theories) or conflates instrumental/experiential "badness."
