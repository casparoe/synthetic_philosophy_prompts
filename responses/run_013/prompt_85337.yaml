prompt: |-
  I've been arguing with a friend in a group chat about whether habitat destruction is good or bad for wild animals, and I'd like your honest credence rather than a tour of the debate. Here's the proposition I want a number on: take a typical hectare of temperate deciduous forest, convert it to managed cattle pasture on a standard production cycle, and hold it as pasture for the next hundred years; my claim is that this lowers the welfare density of that hectare — expected net welfare per hectare per year, summed over every sentient organism living there, positive and negative, in whatever common currency you pick and state — compared with leaving it as forest, so that the conversion is on net good for wild animals. If a nearby proposition is the one that actually has a truth value, sharpen it, but state the version you are scoring explicitly before you score it, and give me a single number I can argue with rather than a range.

  Then give me the decomposition that produces the number: the sub-questions it actually turns on, a rough probability for each, one line of justification per term, how the terms combine, and the resulting figure. My own list, which you should add to or replace as you see fit: (1) population — is the standing number of sentient organisms per hectare substantially higher in forest than in pasture, and by what order of magnitude? (2) sign — is the average lifetime welfare of a typical wild forest organism, most of which are small arthropods, negative? (3) replacement — do the organisms that move in (cattle, pasture arthropods, earthworms, soil fauna) have higher average welfare, and are there enough of them for that to matter against the population term? (4) moral weight — how much does weight per organism vary across taxa, and is there any plausible weighting scheme that flips the sign of the total? (5) comparison — does the century-long steady-state differential dominate the one-time pulse of deaths from clearing and displacement, or does that pulse settle the question on its own? (6) framing — is the question about total suffering summed over lifetimes, or about the expected welfare of a randomly chosen organism that ever exists in that hectare, and do those two answers come apart here?

  Then tell me which term the final number is most sensitive to, and what would move it most — a specific empirical finding, or a conceptual argument about welfare aggregation or the moral weight of invertebrates. I'm at about 0.55 and my friend is at about 0.15, so also tell me which sub-question our disagreement most likely lives in. Finally, be explicit about where your reasoning is most likely to be wrong and what argument or consideration would flip you, and if you catch yourself reciting the standard effective-altruism talking points instead of thinking it through, say so and mark which parts of the answer are recycled. Write in American English.
