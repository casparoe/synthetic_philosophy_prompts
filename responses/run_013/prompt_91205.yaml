  Okay, let me tackle this step by step. The user's friend argues that hedonism fails because pleasure isn't a single unified thing. The user thinks this argument proves too much because it could destroy all psychological kinds. They want to know which step to reject and how to fix it.

  First, I need to analyze the argument's structure. Premise (2) claims that for hedonism to be substantive, "pleasure" must name a single kind with a shared feature. Premise (3) lists diverse examples of pleasure that lack a common feature. Then (4) concludes pleasure isn't a real kind, leading to (5) hedonism being false or empty.

  The user's main concern is that this reasoning would also dissolve other psychological categories like pain or belief. So the problem must be in premise (2). If we reject (2), we can allow that pleasure is unified in another way without a single feature.

  What alternatives are there? Maybe pleasure is a determinable with determinates, like color has red, blue, etc. Or perhaps it's a cluster concept without sharp boundaries. Hedonists like Mill or Sidgwick might say pleasures share the property of being desired or liked when experienced.

  But each alternative has issues. A dispositional account might make hedonism circular. A determinable might still need a core essence. The cluster approach could be too vague. Still, rejecting (2) saves psychological kinds from being abolished.

  The user doesn't want to give up (1) or (3), so the cost is accepting a less rigid unity for pleasure. That means hedonists must provide a plausible unifying story. The argument's flaw was demanding a single feature when other options exist. This keeps hedonism substantive without collapsing all psychological categories.
answer: |-
  **Reject step (2) by weakening "single kind" to allow a unified psychological kind grounded in a shared higher-order disposition or determinable structure, not a single phenomenological feature.**

  The argument mistakenly assumes that for "pleasure" to be a substantive kind unifying diverse phenomena (per 3), it must share "some one feature" (2)—likely a specific, introspectible quality. This is an untenably strict criterion for psychological kinds. Rejecting (2) costs hedonism a simple introspective foundation but saves it from vacuity and avoids destroying all psychological categories. Here's how:

  1.  **Why (2) is flawed:** Psychological kinds (pain, belief, desire) are *functional* or *dispositional* kinds, not reducible to a shared sensory quality. Beliefs vary wildly (e.g., believing "2+2=4" vs. fearing climate change) but share the functional role of representing the world as being a certain way. Similarly, diverse pains (throbbing, stinging, grief) share the disposition to cause avoidance and be disliked. (2) demands phenomenological homogeneity where it isn't needed for kindhood or normative significance. Its appeal lies in the intuition that "real" goodness must have a unified *feel*, but this intuition is mistaken.

  2.  **Unifying pleasures without a single feature:** Hedonists can offer:
      *   **Dispositional Account:** Pleasures are states or activities that subjects *like* or *are disposed to like* (seek/continue) *for their own sake* during their occurrence (Sidgwick, Crisp). The taste of water, closing a proof, and a friend's joke are all *liked* intrinsically while experienced. This "being liked" is the unifying higher-order property.
      *   **Determinable Account:** "Pleasure" is a determinable with many determinates (sensory, intellectual, aesthetic, etc.), sharing the abstract property of *positive affect* or *felt goodness* (Broad, Parfit). The examples share being positively valenced experiences, even if their specific valence-feel differs vastly.
      *   **Cluster Account (less common):** Pleasures form a cluster united by overlapping features (e.g., liked, sought, intrinsically motivating, feels good) without requiring *all* features in *every* case. Baths and jokes might share being liked and sought, while proofs and jokes share intellectual satisfaction.

  3.  **Trouble for the unifying story:**
      *   **Circularity/Normative Question-Begging:** Defining pleasure as "what is liked" risks making hedonism ("pleasure is good") tautologous ("what is liked is good") and empty. The hedonist must argue that "being liked" *explains* goodness, not just defines it (e.g., by linking "being liked" to well-being conceptually or empirically).
      *   **The Wrong Kind of Reason:** Could we "like" something (e.g., a rival's failure) for *bad* reasons, making it not *truly* good? The dispositional account must handle cases where liking seems misguided without collapsing into an idealized desire theory.
      *   **Phenomenal Vagueness:** The determinable "positive affect" might be too vague or itself lack clear boundaries. Is the relief of removing pain "positive affect" or just the absence of negative? Is flow (being absorbed in an activity) pleasurable if not consciously "felt" as such?
      *   **Explanatory Burden:** The hedonist must show *why* this heterogeneous kind (unified dispositionally or as a determinable) is *the* fundamental good, especially when rivals (desire, objective list) face similar heterogeneity challenges but might offer different unifying principles.

  **Why this works without destroying other kinds:** Rejecting (2)'s demand for a single phenomenological feature allows psychological kinds to be unified functionally or dispositionally (belief as representation, pain as disliked sensation, memory as stored information). This preserves substantive ethics and philosophy of mind. The argument only *seemed* to prove too much because it imposed an unrealistic criterion for kindhood. Hedonism survives as substantive by identifying the good with a psychologically real kind of state or activity unified by its positive motivational/affective role, not by a shared sensory quale. Your insight that the argument overgeneralizes is correct; the fix is to weaken (2) to allow the kinds of unity we accept for other mental states. The cost is increased theoretical complexity for hedonism.
