answer: |-
  ### Examination Question  
  **Essay Question (20 marks; 90 minutes)**  
  Adjudicate among the candidate norms for assertion (truth, belief, justification, knowledge) using the two theater cases. Your essay must:  
  1. Explain whether the cases support an *epistemic* norm (e.g., justification or knowledge) over a *merely alethic* norm (truth alone).  
  2. Address **when** the norm should be applied to Mira’s utterance, given that its truth was caused by her act of assertion.  
  3. Evaluate whether either utterance qualifies as an assertion at all, considering alternative classifications (e.g., prediction, reassurance).  
  4. Defend a verdict about which norm best captures the governing standard, while acknowledging where the cases leave philosophical disputes unresolved.  

  ---

  ### Model Answer (650 words)  
  The cases of Mira and Tomás reveal tensions between alethic and epistemic norms of assertion, challenging whether truth alone suffices to license an assertion or whether stronger epistemic conditions (justification/knowledge) are required. I argue that the cases collectively undermine the truth norm and support a knowledge norm, while highlighting unresolved disputes about speech-act classification and the application-timing problem.  

  **The Failure of the Truth Norm**  
  The truth norm holds that an assertion is permissible iff it is true. Tomás’s utterance satisfies this norm: his claim (“Everyone will get out unharmed”) is true, albeit accidentally. Yet his assertion seems intuitively improper—he has no evidence and acts on a hunch. This echoes the “Gettier-style” objection: truth plus belief (without justification/knowledge) can permit reckless assertions. Mira’s case further complicates the truth norm. Her utterance *becomes* true *because* she asserts it, raising the question: should we assess truth at the moment of utterance or after the outcome? At utterance-time, her claim was neither true nor false; its truth depended on contingent future actions (the crowd’s response). Thus, the truth norm cannot straightforwardly vindicate Mira, as its applicability relies on a settled truth-value. Truth-alone advocates (e.g., Weiner 2005) might argue that retrospective truth suffices, but this clashes with the intuition that norms govern assertions *when made*.  

  **Justification and Knowledge Norms**  
  The justification norm (assert only what you are justified in believing) and knowledge norm (assert only what you know) handle Tomás robustly: he lacks both justification and knowledge. Mira is more contentious. She has a “well-grounded expectation” from training and drills, but is this justification? Justification minimalists might argue yes; skeptics could note that expectations about crowd behavior fall short of probabilistic certainty. The knowledge norm faces a starker challenge: Mira *cannot* know an outcome dependent on her utterance’s reception. If knowledge requires safety from error (Williamson 2000), her belief’s truth was fragile—a panicked crowd reaction could falsify it. Thus, Mira seemingly violates the knowledge norm.  

  **Self-Fulfillment and Application Timing**  
  Mira’s case introduces a self-fulfilling assertion: its truth is caused by the act itself. This creates a dilemma for epistemic norms. If norms apply at utterance-time, Mira’s assertion lacks truth/knowledge then. If they apply retrospectively, Tomás’s assertion becomes permissible. A plausible solution is that norms apply at utterance-time but accommodate *reasonable projections* of causal influence. Mira’s training justifies her expectation that her utterance *will* cause the truth of the proposition. This blurs belief and justification into a “pragmatic license” distinct from descriptive assertion—a point underscoring speech-act ambiguity.  

  **Speech-Act Classification**  
  Neither utterance neatly fits standard models of assertion. Mira’s statement functions as a *reassurance* or *directive*: its goal is to *cause* calm, not describe a fact. Tomás’s utterance may be a self-directed *exhortation*. If these are not assertions, norms of assertion may not govern them. However, both speakers present their claims as factual, inviting assessment under assertion norms. This ambiguity is a live dispute: reductionists (like Bach 2008) might deny these are assertions; functionalists could argue that any constative speech-act falls under assertion norms.  

  **Verdict and Residual Disputes**  
  The cases best support the knowledge norm. Tomás clearly violates it, and Mira’s justification—while practically reasonable—fails to secure knowledge of the future outcome. The truth norm’s inability to distinguish Tomás (lucky truth) from a responsible asserter remains fatal. However, this verdict is contested. Proponents of the justification norm (e.g., Lackey 2007) could argue Mira meets a contextual standard of justification, while knowledge norm advocates must explain why Mira’s assertion is *excusable* rather than permissible. Ultimately, the cases illustrate that assertion’s function—to convey secure information—clashes with performative or causal uses of language, leaving open whether a unified norm can cover all such acts.  

  ---

  ### Marking Scheme (20 marks)  
  **Must-hit points** (Award marks per level of insight):  
  1. **Critique of truth norm** (4 marks):  
     - *Top*: Explains why Tomás’s luck undermines truth norm; notes truth’s indeterminacy in Mira’s case at utterance-time.  
     - *Common error*: Asserts truth norm works because both utterances ended true.  

  2. **Analysis of epistemic norms for Tomás/Mira** (5 marks):  
     - *Top*: Contrasts Tomás’s epistemic failure with Mira’s partial justification; acknowledges knowledge norm’s tension with future contingents.  
     - *Common error*: Claims Mira “knows” due to training; ignores safety/anti-luck conditions.  

  3. **Self-fulfilling structure & application timing** (4 marks):  
     - *Top*: Argues norms apply at utterance-time; notes Mira’s truth is unsettled then but causally projected.  
     - *Common error*: Claims norms apply retrospectively (vindicating Tomás).  

  4. **Speech-act classification** (3 marks):  
     - *Top*: Evaluates alternative classifications (e.g., reassurance); discusses whether assertion norms still apply.  
     - *Common error*: Assumes both are assertions without argument.  

  5. **Synthesis and philosophical awareness** (4 marks):  
     - *Top*: Defends a norm while showing where disputes persist (e.g., “Is justification sufficient?”); distinguishes competent (descriptive) from outstanding (evaluative) answers.  
     - *Common error*: Merely sorts cases into norms without adjudicating; ignores unresolved tensions.  

  **Competent vs. Outstanding Distinction**:  
  - **Competent (12–15 marks)**: Correctly categorizes cases under norms; identifies speech-act ambiguity; notes Mira’s causal influence.  
  - **Outstanding (16–20 marks)**: As above, plus defends *why* a norm succeeds/fails given assertion’s function; engages application-timing dilemma; acknowledges contested premises (e.g., “justification” thresholds).
