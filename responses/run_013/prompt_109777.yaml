answer: |-
  Here’s your Q&A sheet, structured by likelihood/damage potential, with objections phrased authentically and replies crafted for a 2-minute defense. I’ve noted which subsidiary claim the room likely targets first.

  ---

  ### **Q&A Sheet: Defending Modal Realism (Lewis)**
  **Primary Audience:** Actualists (some Ersatzists) + Set-Theory Logician  
  **Your Subsidiary Claims:**  
  1. **Indexical Actuality:** "Actual" is indexical (like "here"), defusing arbitrariness worries.  
  2. **Restricted Recombination:** Unrestricted recombination overgenerates absurd worlds; needs constraints.

  ---

  ### **Ranked Objections & Replies**  
  *(Ordered by likelihood + damage potential)*  

  1. **The Logician’s Quantification Challenge** (Most Damaging + Likely)  
     *Objection (sharp, impatient):*  
     "You say there’s a world for every possibility. Fine. But when you quantify over ‘all possible worlds’—what is that? If they form a set, by Cantor, there are more possibilities than worlds in that set. If they don’t form a set, what are your variables ranging over? How is this not incoherent?"  
     *2-Minute Reply:*  
     "Worlds don’t form a set; they form a *proper class*. Quantification here is primitive and unrestricted, much like quantifying over all sets in ZFC. We’re committed to absolute infinity—no ‘totality’ of worlds, just irreducibly plural quantification over concrete entities. This avoids paradox: possibilities correspond 1:1 with worlds because recombination operates on individuals *within* worlds, not on worlds themselves."  
     *Soft Spot:*  
     Invoking proper classes may feel like hand-waving to a set theorist. "Irreducibly plural quantification" is philosophically contentious.  

  2. **Ersatzist’s Ontological Economy** (Very Likely, Moderately Damaging)  
     *Objection (smug, pragmatic):*  
     "Why pay ontological rent for infinite concrete universes when an abstract model—propositions, sets, or linguistic constructs—does the job for free? Your ‘worlds’ are just representational devices we already use in logic. What’s the *cash value* of making them concrete?"  
     *2-Minute Reply:*  
     "Ersatz worlds *describe* possibilities but don’t *ground* them. Modal realism avoids primitive modality: truthmakers for claims like ‘dragons could exist’ are concrete non-actual dragons. Your abstracta require ad hoc truthmaking (e.g., uninstantiated properties). Concrete worlds explain similarity, causation, and counterfactuals *without* invoking mysterious abstract-representational relations."  
     *Soft Spot:*  
     Ersatzists will retort that they *can* ground modality without concrete worlds (e.g., via combinatorialism). The reply assumes realism is the only alternative to primitivism.  

  3. **Actuality’s Arbitrariness** (Likely, Targets Subsidiary Claim #1 First)  
     *Objection (scoffing, from actualists):*  
     "So ‘actual’ just means ‘this-worldly’? That’s a dodge. Why should *this* world get special moral/epistemic weight? If all worlds are equally real, my suffering here is cosmically insignificant—a reductio of your ethics of caring!"  
     *2-Minute Reply (Indexical Defense):*  
     "Actuality *is* indexical, but that’s not arbitrary—it’s essential! Just as ‘here’ picks out my location without denying reality elsewhere, ‘actual’ picks out our world. Special care for ‘here-now-world’ is rational *because we’re in it*. This doesn’t diminish other worlds; it explains why we *experience* this one as privileged."  
     *Soft Spot:*  
     Doesn’t resolve why *intrinsic* properties of this world (e.g., conscious observers) don’t warrant non-indexical significance. Moral realists will press further.  

  4. **Recombination Overgeneration** (Likely, Targets Subsidiary Claim #2 Second)  
     *Objection (raised post-recombination claim, technical):*  
     "You restrict recombination to avoid ‘worlds with round squares’—but now your theory isn’t purely combinatorial. What’s the *principle* restricting it? If it’s ‘no contradictions’, you’re piggybacking on ersatz logical constraints, not concrete possibility."  
     *2-Minute Reply:*  
     "Recombination copies or reshuffles *actual* parts. Round squares aren’t excluded by logic but by the *nature of properties*: actual space has no co-instantiable shape properties yielding a ‘round square’. Restrictions come from genuine incompatibilities in attributes, not abstract logic."  
     *Soft Spot:*  
     "Genuine incompatibilities" may require primitive modal facts—undermining the promise of reduction.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *Objection (lethal if delivered by the logician):*  
  "Granted your worlds are concrete and form a proper class. But then, by plural quantification, we can define a ‘world’ for every class-sized description. But then there should be a world *W* that satisfies ‘contains all and only worlds not containing themselves’. How is this not a modal Liar paradox?"  

  *Why It’s Deadly:*  
  This exploits class-sized quantification to generate self-reference in a way that even Lewis’s ontology can’t easily block. A weak reply might assert that "world" must be well-defined or that descriptions must be recombination-compliant—but both feel ad hoc.  

  ---

  ### **Strategy Notes**  
  - **Room’s Likely Focus Order:** They’ll jump on **Actuality Arbitrariness (#3)** first (it’s intuitive and morally charged), then pivot to **Recombination (#4)** once you mention it.  
  - **Logician’s Role:** They’ll interject early (#1) to destabilize, then watch how you handle ersatzists (#2).  
  - **Defense Soft Spots:** Lean into the *explanatory power* of concreteness (causation, counterfactuals) and *indexicality* as familiar/parsimonious. Admit that "primitive quantification" is a cost but stress ersatzism’s hidden costs (e.g., unanalyzed representation).  

  *Good luck—actualists are a tough crowd, but at least they’re actual.*
