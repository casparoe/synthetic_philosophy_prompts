  I'm presenting a defense of modal realism next week to a metaphysics reading group that is mostly actualists — several of them ersatzists who hold that possible worlds are abstract representations or set-theoretic constructions rather than concrete universes — plus one logician who works in set theory and has twice pressed the point that if the worlds formed a set they could not be all the worlds, so he wants to know what our variables range over when we say there is a world where such-and-such. Prepare my Q&A sheet: the objections this room will actually raise, ordered by how likely and how damaging they are, phrased the way each of them would put it — the ersatzists' "why pay ontological rent for what a model already does for free," the logician's "quantifying over what, exactly" — each with a two-minute reply and a note on where the reply is soft. I will be defending two subsidiary claims, and I need to know which one the room goes for first: that the indexical account of actuality defuses the charge that it is arbitrary to care specially about this world, and that the principle of recombination must be restricted if it is not to overgenerate. End with the question I am hoping nobody asks.
