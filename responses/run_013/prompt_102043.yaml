answer: |-
  Here is a structured list of desiderata for any adequate theory of why pain is bad, organized around the phenomena it must accommodate. Each desideratum is derived from specific cases or considerations, labeled as non-negotiable (essential for any minimally adequate theory) or optional (a commitment of specific theoretical camps, e.g., hedonic or desire-based). I include two constructed cases (as requested) and flag conflicts. The desiderata are ordered by the phenomena they address, with the motivating cases/considerations driving each requirement.

  ### Core Desiderata
  1. **Ordinary Pain Accommodation**  
     - **Desideratum**: The theory must explain why typical bodily pain (e.g., a burn) is *prima facie* bad for the subject, intrinsically or extrinsically, and why it motivates avoidance.  
     - **Motivating Case**: Everyday experiences of acute pain (e.g., stubbing a toe), where pain is felt as awful and elicits immediate withdrawal.  
     - **Status**: Non-negotiable. Any theory failing this is inadequate.  
     - **Probes**: The core intuition that pain is inherently disagreeable.

  2. **Pain Asymbolia Accommodation**  
     - **Desideratum**: The theory must explain why subjects with pain asymbolia (e.g., due to brain lesions) report feeling pain but deny it is bothersome and show no avoidance, without denying the pain's existence.  
     - **Motivating Case**: Clinical cases (e.g., Berthier et al. 1988), where patients describe pain sensations but smile, relax, or fail to withdraw from noxious stimuli.  
     - **Status**: Non-negotiable. Demonstrates pain sensation ≠ suffering.  
     - **Probes**: Whether badness requires more than the sensory-discriminative component of pain.

  3. **Informative or Merely Unwanted Pain**  
     - **Desideratum**: The theory must accommodate pain that is not intrinsically bad but serves as a useful signal (e.g., warning of injury) or is merely unwanted without being intensely aversive.  
     - **Motivating Case**: Mild background pain (e.g., a dull ache from posture) that is acknowledged as informative or inconvenient but not actively distressing.  
     - **Status**: Optional for hedonic/desire theories (which often conflate sensation with badness), but non-negotiable for a comprehensive account.  
     - **Probes**: Whether badness is separable from pain's informational role or mild unpleasantness.

  4. **Sought or Welcomed Pain**  
     - **Desideratum**: The theory must explain why pain can be sought, endured, or welcomed (e.g., in masochism, athletics, or medical contexts) without contradiction, and why this does not negate its potential badness.  
     - **Motivating Case**: An athlete embracing "good pain" during training, or a masochist deriving pleasure from pain, where the sensation is intense but integrated into a positive experience.  
     - **Status**: Optional for evaluative/imperative theories (which may treat pain as inherently "bad-commanding"), but non-negotiable for accounts respecting contextual variability.  
     - **Probes**: Whether pain's badness can be context-dependent or overridden by higher-order states.

  5. **Motivational Pull vs. Felt Awfulness Dissociation**  
     - **Desideratum**: The theory must explain how pain's motivational force (e.g., flinching) can decouple from its felt awfulness (e.g., suffering), and vice versa.  
     - **Motivating Case**: Depressive episodes where pain feels unbearable but motivates no action, or reflexive withdrawal (e.g., touching a hot stove) with minimal suffering.  
     - **Status**: Non-negotiable. Highlights that badness is not reducible to motivation.  
     - **Probes**: Whether badness is tied to affective experience, motivational states, or neither.

  6. **Capacity Independence**  
     - **Desideratum**: The theory must not ground pain's badness in capacities absent in newborns or nonhuman animals (e.g., language, desire-formation, or evaluative judgment).  
     - **Motivating Case**: Newborn infants or animals (e.g., a mouse) exhibiting pain responses (crying, withdrawal) that are intuitively bad for them.  
     - **Status**: Non-negotiable. Rules out over-intellectualized accounts.  
     - **Probes**: Whether badness is primitive or cognitively mediated.

  ### Constructed Cases
  7. **Automatic Defensive Response Without Dislike**  
     - **Case**: A subject (e.g., with a rare neurological condition) reports a sharp pain from a pinprick and denies disliking it ("It's just a sensation—no big deal"). However, when undistracted, they exhibit involuntary flinching and withdrawal.  
     - **Desideratum**: The theory must explain why defensive behaviors (flinching/withdrawal) can occur independently of reported dislike or aversiveness.  
     - **Motivating Consideration**: Probes whether pain's badness requires conscious endorsement or if reflexive responses indicate a deeper, non-conscious form of disvalue.  
     - **Status**: Non-negotiable. Tests accounts that reduce badness to desire or judgment.  
     - **Probes**: The role of automatic threat-response systems in badness.

  8. **Subjective Awfulness Without Avoidance**  
     - **Case**: A subject (e.g., with severe apathy syndrome) describes their chronic back pain as "unbearably awful" and "torturous" but shows no avoidance behavior (e.g., remains seated for hours, refuses pain relief).  
     - **Desideratum**: The theory must explain how pain can be subjectively awful without motivating avoidance, and whether this awfulness constitutes badness.  
     - **Motivating Consideration**: Probes whether badness is defined by subjective experience alone or requires motivational efficacy.  
     - **Status**: Optional for perceptual/evaluative theories (which may prioritize phenomenology), but non-negotiable for capturing cases where suffering and motivation dissociate.  
     - **Probes**: The link between felt quality and disvalue.

  ### Conflicts and Ruling-Out Power
  - **Flagged Conflict**: Desideratum 5 (Motivational/Awfulness Dissociation) and Desideratum 7 (Automatic Defense Without Dislike) **cannot be jointly satisfied** by theories that tightly couple badness with motivation (e.g., imperative accounts). Desideratum 7 demands that automatic responses indicate badness even without dislike, while Desideratum 5 requires that awfulness can exist without motivation—creating tension for accounts that equate badness with motivational force.
    
  - **Most Exclusionary Requirement**: **Desideratum 6 (Capacity Independence)** does the most to rule out popular contenders:  
    - **Hedonic accounts** (pain's badness is intrinsic to its unpleasant phenomenology): Struggle with asymbolia (D2) and sought pain (D4), but D6 challenges them if phenomenology requires higher cognition.  
    - **Desire-based accounts** (pain is bad if disliked or frustrates desires): Fail D6 directly (newborns/animals lack complex desires) and D7 (automatic withdrawal without dislike).  
    - **Evaluative/imperative accounts** (pain is bad because it represents bodily damage or commands avoidance): Fail D6 (require evaluation/judgment capacities) and D5/D8 (cannot explain motivation-awfulness decoupling).  
    - **Perceptual accounts** (pain is a perception of damage, with badness extrinsic): Fail D2 (asymbolia involves perception without badness) and D6 if perception implies cognitive interpretation.  

  ### Brief Scorecard of Popular Theories
  | Theory              | Key Failure(s)                                                                 | Passes Non-Negotiables?       |  
  |---------------------|--------------------------------------------------------------------------------|-------------------------------|  
  | **Hedonic**         | Fails D2 (asymbolia), D4 (sought pain), D7 (if dislike required for badness).  | Partial (D1, D6 if primitive).|  
  | **Desire-Based**    | Fails D6 (capacity independence), D7 (automatic defense).                      | No.                           |  
  | **Evaluative/Imperative** | Fails D5 (dissociation), D6 (capacity independence), D8 (awfulness without action). | Partial (D1, D2 if modified). |  
  | **Perceptual**      | Fails D2 (asymbolia), D3 (informative pain), D6 (if perception is cognitive).  | Partial (D1, D4).             |  

  This framework shows that an adequate theory must treat pain's badness as a multifaceted construct, likely involving intrinsic affective dimensions (not just sensation) that are independent of higher cognition but can be modulated by context. Desideratum 6 is the strongest filter, while the constructed cases (D7–D8) expose gaps in accounts that cannot dissociate behavior, motivation, and phenomenology.
