  The vis viva case is telling. Both sides saw the same phenomena but carved "force" differently. The dissolution came via terminological surgery—distinguishing mv and mv². But does this solve incommensurability or prove it was temporary? Depends on your lens: linguistic folks might say "See! Translation worked!" while practice-focused folks note scientists initially couldn't align their workflows. 

  Progress might require: 
