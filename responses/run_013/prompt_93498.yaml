  We are going to break down the debate into two main parts: the strongest case for school choice and the strongest case against it, using the specified vocabulary. Then we will analyze the residue.

  ### Strongest Case for School Choice (in mechanism design terms)

  1. **Efficiency Claims**:
     - **Increased allocative efficiency**: By allowing families to choose schools (public or private) and introducing competition among schools, the matching process can better reflect heterogeneous parental preferences. This can lead to a Pareto improvement if the initial assignment was not Pareto efficient. Vouchers can further expand choice by making private schools affordable, thus shifting budget sets and enabling more families to access preferred options.
     - **Productive efficiency**: Competition among schools (both public and private) for students (and the funding they bring, e.g., via vouchers) can incentivize schools to improve quality and reduce costs. This can be modeled as a multi-principal problem where schools are agents that must compete by improving their "output" (educational quality) to attract students.

  2. **Distributional Claims**:
     - **Equity through access**: Vouchers can be designed to be progressive (e.g., larger for low-income families) to offset inequities in the existing assignment. This can lead to a more equitable distribution of educational opportunities by breaking the link between residential location (which is often correlated with income) and school assignment.
     - **Reduced segregation**: By allowing choice, families from disadvantaged backgrounds can opt for better schools that were previously inaccessible due to capacity constraints or priorities in the public system. However, this claim is contingent on the design (e.g., whether the choice mechanism includes diversity constraints).

  3. **Outside Option and Stability**:
     - The availability of private schools and homeschooling as outside options can make the public assignment mechanism more stable. If the public system cannot provide a satisfactory match, families can exit, which might pressure the public system to improve.

  ### Strongest Case Against School Choice (in mechanism design terms)

  1. **Efficiency Claims**:
     - **Negative externalities from peer effects**: In a system with choice, if schools can select students based on ability or if families sort by socioeconomic status, peer effects may lead to increasing inequality in school quality. High-achieving students cluster in certain schools, causing a negative externality on the schools they leave (reducing their average peer quality). This can lead to a Pareto inferior outcome due to the externality.
     - **Inefficiency from information asymmetry and strategic behavior**: If parents have incomplete information about school quality or if the choice mechanism is not strategy-proof, the outcome may be inefficient. Moreover, private schools might engage in cream-skimming (attracting high-ability students) and leave public schools with a disproportionate share of students with higher costs (e.g., special needs), leading to an inefficient allocation of resources.

  2. **Distributional Claims**:
     - **Increased inequality**: Without proper regulation, school choice can lead to increased stratification by income or ability. Families with higher resources (financial, informational, or social capital) are better positioned to navigate the choice system and secure spots in high-quality schools. This can exacerbate existing inequalities.
     - **Unfairness in priority assignment**: In a choice system, the priorities (e.g., based on residence, sibling ties) that aim to promote fairness may be undermined. For example, if private schools set their own priorities (e.g., based on ability to pay or test scores), they might exclude disadvantaged students.

  3. **Stability and Capacity Constraints**:
     - Introducing choice without sufficient capacity in high-quality schools can lead to instability. Some families might be left without any acceptable option, and the public system might face a "death spiral" as it loses funding (if funding follows the student) and struggles to maintain quality.

  ### Residue Report

  We now examine which parts of the debate do not fit neatly into the mechanism design vocabulary and why.

  1. **Equality of Opportunity as a Constraint**:
     - In mechanism design, equality of opportunity can be modeled as a constraint on the assignment (e.g., reserving seats for certain groups). This is a straightforward translation. However, the philosophical notion of equality of opportunity as a fundamental principle might require more than just a constraint; it might demand a particular kind of process or a guarantee of substantive outcomes. The mechanism design framework can incorporate constraints but may not capture the full moral weight of the principle.

  2. **Child's Interest as a Separate Agent**:
     - In standard models, the parent is the decision-maker. However, if the child's interests diverge from the parent's, we might need to model the child as a separate agent. This is a distortion because it complicates the preference structure and may require a multi-agent model within a household. The mechanism design framework can accommodate this by having multiple stakeholders per student, but it is not standard and raises questions about whose preferences should count.

  3. **Education as a Constitutive Good**:
     - This idea holds that education shapes the person and is not merely a service. In mechanism design, we typically treat education as a good that provides utility (with possible externalities). The constitutive aspect is a residue because it cannot be reduced to preferences or externalities without losing its essence. It suggests that the process of education and the environment (e.g., civic values in public schools) matter in ways that are not contractible or measurable. This is a genuine limitation of the framework, which focuses on outcomes and incentives.

  4. **Value of a Shared Public School as a Site of Civic Formation**:
     - This is a positive externality that might be underprovided in a choice system. We can model it as a network externality: the more diverse the student body, the greater the civic benefits. However, the mechanism design framework might struggle to quantify this externality and incorporate it into the matching mechanism. Moreover, the idea of a shared public experience as a collective good is hard to capture without a notion of community that goes beyond individual utilities. This is a limitation.

  5. **Non-contractual Character of the Parent-Child Relationship**:
     - The parent-child relationship is one of care and responsibility, not a market transaction. In the mechanism design model, we treat the parent as an agent making choices for the child. This misses the moral dimension that the relationship is not based on contract but on trust and duty. This residue might indicate a limitation because the model reduces the relationship to a principal-agent problem, which may be too narrow.

  6. **Corruption of Education by Marketization**:
     - The claim is that treating education as a market commodity alters the nature of education (e.g., turning students into customers, schools into businesses). This is a residue because it is about the process and the meaning of education, which are not captured by the mechanism design model. The framework is agnostic about the symbolic meaning of institutions. This might be a genuine limitation, as the model does not account for how the rules of allocation change the social meaning of the good.

  ### Assessment of Residues

  - **Genuine Limitations**: 
    - The constitutive nature of education, the civic formation role of public schools, and the non-contractual parent-child relationship are genuine limitations. They require concepts beyond individual preferences and externalities, touching on the formation of identity and community.
    - The corruption argument is also a limitation because it involves the expressive function of institutions, which is not captured by standard efficiency or distributional metrics.

  - **Rhetorical Work that Cannot Survive Precision**:
    - Some aspects of equality of opportunity might be modeled as constraints, but when the claim is that choice inherently undermines equal opportunity regardless of design, that may be a rhetorical overstatement. Similarly, the separate representation of the child's interest might be addressed by careful modeling (though it complicates the mechanism). 

  ### Conclusion

  The translation reveals that the core efficiency and distributional claims of both sides can be represented in the mechanism design vocabulary, but the deeper philosophical concerns about the nature of education and the role of schools in society are left as residues. These residues point to genuine limitations of the economic framework, which focuses on allocation and incentives but not on the formative aspects of institutions or the non-instrumental value of social goods.
answer: |-
  ### Restated Debate in Mechanism Design Vocabulary

  #### **Strongest Case for School Choice**  
  1. **Efficiency Claims**  
     - **Allocative Efficiency**: Under a decentralized choice system (e.g., voucher-augmented Deferred Acceptance with private options), families reveal true preferences over schools, leading to a more efficient matching. Public systems with rigid priorities/capacities often result in justified envy (instability), while choice reduces inefficiencies by incorporating heterogeneous preferences. Peer effects can be internalized if schools compete to attract high-productivity peers, raising aggregate outcomes.  
     - **Productive Efficiency**: Private schools (as profit-maximizing firms) face competitive pressure to improve quality per unit cost. Vouchers expand competition by shifting budget constraints, forcing public schools to respond or lose students (exit = credible threat).  

  2. **Distributional Claims**  
     - **Equity Gains**: Vouchers act as nonlinear subsidies, relaxing budget constraints for low-income families. This mitigates inequality by weakening the link between residential priorities (often correlated with wealth) and school access.  
     - **Stability via Outside Options**: Homeschooling or private exit options reduce blocking pairs in public assignment by allowing unmatched families to leave without disrupting the mechanism.  

  #### **Strongest Case Against School Choice**  
  1. **Efficiency Claims**  
     - **Negative Externalities**: Peer effects create strategic complementarities. Choice induces cream-skimming, where private schools admit high-ability students (positive peers), leaving public schools with concentrated negative peer effects → Pareto loss.  
     - **Congestion Externalities**: If high-demand schools have fixed capacities, uncoordinated choice can lead to inefficient sorting (e.g., overcrowding in "popular" schools despite lower-quality alternatives).  

  2. **Distributional Claims**  
     - **Inequitable Priorities**: Private schools set admissions standards (de facto priorities) that favor wealth/ability, exacerbating inequality. Vouchers may be regressive if high-income families top-up to access elite schools.  
     - **Instability from Stratification**: Choice can cause cyclical rejection chains (e.g., TTC-like dynamics) where disadvantaged students are displaced by high-priority peers, violating fairness constraints.  

  3. **Non-Mechanism Claims**  
     - **Civic Externalities**: A universal public system generates non-excludable benefits (e.g., democratic socialization) eroded by fragmentation.  

  ---  

  ### **Residue Report**  
  Arguments are categorized by survival under translation:  
  - ✅ **Intact** (fully captured),  
  - ⚠️ **Distorted** (requires framework contortions),  
  - ❌ **No Counterpart** (outside mechanism design).  

  #### **1. Equality of Opportunity**  
  - ⚠️ **Distorted**: Becomes a *constraint on priorities*. E.g., reserving seats for low-income students to satisfy "equal access." Original moral claim (opportunity as intrinsic good) is reduced to a technical allocation rule.  
  - **Verdict**: Rhetorical work lost. The framework quantifies fairness as probabilistic assignments or quotas but cannot ground why equality matters beyond welfare.  

  #### **2. Child's Interest vs. Parental Authority**  
  - ⚠️ **Distorted**: Requires modeling the child as a *separate agent* with distinct preferences. Parent-child conflict becomes a principal-agent problem (e.g., parent chooses school to maximize utility, ignoring child’s disutility).  
  - **Verdict**: Genuine limitation. Mechanism design assumes unitary household preferences, but philosopher’s "child’s autonomy" claim resists this reduction.  

  #### **3. Education as a Constitutive Good**  
  - ❌ **No Counterpart**: If education shapes identity/values (not just human capital), it cannot be reduced to utility or externalities.  
  - **Verdict**: Genuine limitation. The framework treats schooling as a service with consumption/production attributes, ignoring its role in moral development.  

  #### **4. Public Schools as Civic Sites**  
  - ❌ **No Counterpart**: The claim that shared schools foster democratic norms is a *non-contractible externality*. Mechanism design can model diversity preferences (e.g., valuing heterogeneous peers) but not civic formation as a public good.  
  - **Verdict**: Genuine limitation. The framework’s externality concept is too narrow for non-pecuniary societal benefits.  

  #### **5. Non-Contractual Parent-Child Relationship**  
  - ❌ **No Counterpart**: The objection that market logic corrupts familial duties (e.g., parents as "consumers" of children’s education) has no analogue.  
  - **Verdict**: Genuine limitation. Mechanism design is agnostic on relational ethics; it only models incentives.  

  #### **6. Anti-Commodification of Schooling**  
  - ❌ **No Counterpart**: The claim that markets "corrupt" education’s social meaning (e.g., turning students into products) lacks a formal representation.  
  - **Verdict**: Rhetorical work lost. The framework sees prices/subsidies as allocation tools, not value-laden symbols.  

  ---  

  ### **Summary**  
  - **Intact Arguments**: Efficiency/distribution trade-offs (e.g., stability vs. equity), externalities from peer effects, and competitive incentives under vouchers.  
  - **Distorted Arguments**: Equality of opportunity (becomes a constraint), child’s welfare (requires multi-agent modeling).  
  - **Residues Marking Framework Limits**: Civic formation, constitutive goods, anti-commodification, and non-contractual relationships. These resist formalization because they appeal to non-welfarist values or social metaphysics.  
  - **Residues as Rhetorical Artifacts**: Claims about "corruption" or intrinsic equality lose force when translated; they rely on normative priors the framework excludes by design.  
    
  **Conclusion**: Mechanism design clarifies efficiency/distribution tensions but cannot adjudicate disputes about the *telos* of education or society. The residues highlight where philosophy must take over from economics.
