  ### Rules Fitting All Five Verdicts
  Two distinct rules can explain Priya's verdicts equally well. Both account for her aversion to extreme suffering, her willingness to aggregate small harms for large numbers, and her switch to concentration when numbers are small for non-extreme harms.

  1. **Rule A: Lexical Threshold with Aggregation for Non-Extreme Harms**
     - **Description**: Priya categorizes harms into "extreme" and "non-extreme." Extreme harms (like the worst pain imaginable) are lexically forbidden—she refuses to cause them under any circumstances. For non-extreme harms (like nausea, headaches, or dust specks), she aggregates total harm linearly but with a critical number threshold: if the number of people affected by distributed harm is above a critical value \( n_c \), she distributes; below \( n_c \), she concentrates.
