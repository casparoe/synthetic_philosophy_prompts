answer: |-
  Here’s a precise 90-minute teaching plan for Kalai-Smorodinsky (KS), designed to confront misconceptions, leverage your group’s background, and emphasize the two mathematical features you highlighted. The structure forces engagement with infeasible benchmarks and scale invariance while actively disrupting "fairness" and "pie-splitting" reflexes.

  **Core Example: The Asymmetric Job Negotiation**  
  *Why this example?*  
  - **Must have**:  
    - Asymmetric BATNAs (disagreement points): Worker’s BATNA = $40k (another job), Employer’s BATNA = $0 (position unfilled).  
    - Asymmetric "ideal points": Worker’s max possible salary = $120k (if employer concedes everything). Employer’s max possible profit = $100k (if worker accepts bare minimum salary).  
    - **Infeasible ideal point**: ($120k for worker, $100k for employer) is impossible (employer’s max profit requires low salary).  
    - Feasible set: All salary/profit pairs where Salary + Profit ≤ $150k, Salary ≥ $40k, Profit ≥ $0. Visually, a triangle on axes with vertices at (40,0), (40,110), (120,30).  
  - **Must lack**:  
    - Symmetry (hides KS vs. Nash contrast).  
    - Linear Pareto frontier (avoids coinciding with Nash).  
    - Obvious "fair" split (disrupts fairness framing).  

  *Disqualified candidates*:  
  - Symmetric dollar split: Nash and KS coincide.  
  - Unit simplex: Obscures BATNA asymmetry and infeasible ideal point.  
  - Linear production economies: Often have feasible ideal points or symmetric gains.  

  **Session Plan (90 mins; whiteboard only)**  

  1.  **Reset the Frame (10 mins)**  
      - *Start with the example*: Sketch axes (Worker $, Employer Profit). Mark BATNAs: D = (40, 0). Sketch feasible set: Line from (40,110) to (120,30).  
      - *Force confrontation with the infeasible*: Ask: "What’s the absolute maximum each could get if the other gave them everything they wanted?" Mark Utopia/Ideal Point U = (120, 100). Circle it BIG. **Crucial Question**: "Is this point achievable? Why not?" (Answer: No, tradeoffs exist).  
      - *Break the pie habit*: "This isn’t a fixed pie. If the worker gets more $, the employer’s profit shrinks – but the *slope* of that tradeoff matters, and their *outside options* differ."  

  2.  **Construct KS Visually (25 mins)**  
      - *Anchor to BATNA, Aim for Utopia*: Draw ray starting at D (40,0), passing through U (120,100).  
      - *Find the intersection*: Show where this ray hits the Pareto frontier (approx. (88, 60) in this example). **THIS IS KS**.  
      - *Why this point?*: "It gives each player the *same proportional gain* relative to their worst-case (BATNA) and their impossible best-case (Utopia)."  
          - Worker’s Gain Ratio: (88-40)/(120-40) = 48/80 = 0.6  
          - Employer’s Gain Ratio: (60-0)/(100-0) = 60/100 = 0.6  
      - *Your "working summary" – Use Cautiously Here*: State: "KS gives each player the same *fraction* of their potential gain (from BATNA to Utopia)." **IMMEDIATELY FOLLOW WITH**: "But remember: Utopia is *impossible*. This fraction is relative to a *counterfactual* benchmark of unilateral power, not a jointly achievable good. KS doesn’t split ‘gains from cooperation’; it splits ‘gains from maximal accommodation’."  

  3.  **Contrast with Nash & Debunk Misconceptions (20 mins)**  
      - *Compute Nash*: Max (S-40)*P over feasible set (solution approx. (70, 80)). Plot it.  
      - *Visual Shock*: KS (88,60) vs Nash (70,80). Worker gets MUCH more under KS.  
      - *Why the difference?*: "Nash anchors only to BATNA, KS also anchors to Utopia. Worker has a stronger *unilateral claim* here (higher Utopia)."  
      - **Debunk Misconceptions NOW**:  
          - **Fairness?** "Is KS ‘fairer’? Nash prioritizes joint gains (product), KS prioritizes proportional concessions relative to potential. Neither is inherently ‘fair’ – they are algorithmic."  
          - **Egalitarian Payoffs?** "KS payoffs (88,60) are NOT equal! It equalizes the *proportion of potential gain achieved*, not the final utility."  
          - **Utopia as Reasonable?** Reiterate: "Utopia (120,100) is impossible. It’s a benchmark, not a target."  
          - **Pie-Splitting?** "The feasible set’s shape (the slope of the frontier) matters critically. KS reacts to how hard it is for one player to improve when the other concedes."  

  4.  **Scale Invariance & What Axioms Demand (20 mins)**  
      - *Rescale Worker’s Utility*: Suppose Worker’s utility is √(Salary). BATNA √40 ≈ 6.32, Utopia √120 ≈ 10.95.  
      - *Recalculate KS*:  
          - Original Proportional Gain: (88-40)/(120-40) = 0.6  
          - New Target: Worker’s utility gain ratio = (u_w - 6.32)/(10.95 - 6.32) = 0.6 → u_w ≈ 9.12 → Salary ≈ 83.2k  
          - Employer’s ratio unchanged: (P - 0)/(100-0) = 0.6 → P = 60k.  
      - *Plot New KS* (83.2k, 60k) vs Original (88k, 60k). **Key Insight**: "The dollar amount changed! KS is invariant to rescaling *only if we apply the same scale to BATNA, Utopia, and payoffs*. The *proportion* 0.6 is what’s invariant. **Interpersonal comparison?** None! We never compare Worker’s 0.6 to Employer’s 0.6 – we ensure each gets 0.6 *of their own personal scale*. KS demands that each player’s utility scale has meaningful zero and unit (ratio scale), but doesn’t link scales between players."  

  5.  **Axioms & Limitations (10 mins)**  
      - *State KS Axioms Simply*:  
          1.  **Pareto Optimality** (No waste).  
          2.  **Symmetry** (If game is symmetric, solution is symmetric).  
          3.  **Scale Invariance** (As above).  
          4.  **Individual Monotonicity (CRUCIAL)**: "If the feasible set expands in a way that improves one player’s Utopia *without hurting the other’s*, that player shouldn’t lose."  
      - *Monotonicity Trap*: "Does adding options *always* help? NO. If the expansion lowers your opponent’s Utopia, or changes the tradeoff, KS might lower your payoff! Individual Monotonicity only guarantees no loss when *your* Utopia improves *and the other’s doesn’t fall*."  
      - **The 3+ Player Issue**: YES, mention it concisely: "For 3+ players, KS can violate Pareto optimality. It’s fundamentally a 2-player concept. Characterizations for n>2 are complex and less settled." **PHRASE TO CLOSE**: "This is a deep technical limitation beyond today’s scope. The elegant 2-player characterization breaks because anchoring to Utopia becomes ambiguous when players can form coalitions."  

  6.  **Check for Understanding (5 mins)**  
      - *Pose a new, simple asymmetric problem*:  
          - Player A: BATNA = 10, Utopia = 50.  
          - Player B: BATNA = 0, Utopia = 30.  
          - Feasible Set: Line from (10, 20) to (30, 0) on (A util, B util) axes.  
      - *Ask*: "What is the KS solution? Explain *why* using the ray and ratios."  
          - *Correct Answer*: Ray from D(10,0) through U(50,30). Hits frontier (line A+B=30) at (30,0)? But (30,0) is on frontier.  
          - *Catch*: U(50,30) is infeasible. Ray equation: (A-10)/40 = (B-0)/30 → B = (3/4)(A-10).  
          - Constraint: A + B = 30. Solve: A + (3/4)(A-10) = 30 → (7/4)A = 37.5 → A ≈ 21.43, B ≈ 8.57.  
          - Ratios: A: (21.43-10)/(50-10)=11.43/40≈0.286, B: (8.57-0)/(30-0)≈0.286.  
      - *Why this works*: Tests if they can construct KS (ray, intersection, ratios) and understand Utopia is infeasible. A group that merely followed will struggle with the calculation; an understanding group grasps the process and counterfactual benchmark.  

  **What to Explicitly Withhold**  
  Say upfront: "We will *not* cover:  
  1.  Proofs of uniqueness or existence.  
  2.  Alternative bargaining solutions beyond Nash and KS.  
  3.  Bargaining under incomplete information.  
  4.  Philosophical debates on ‘fairness’ – focus on the mechanics today.  
  5.  The n-player generalization’s complexities."  

  **Misconceptions & When to Head Them Off**  
  1.  **"Utopia is achievable/desirable"**: Head off IMMEDIATELY when introducing U (Step 1). Constantly revisit.  
  2.  **"KS means equal final payoffs"**: Debunk during visual contrast with Nash (Step 3) and when stating the ratio (Step 2).  
  3.  **"Monotonicity means adding options always helps me"**: Crush when explaining the axiom (Step 5) – emphasize the *conditional* nature.  
  4.  **"The ratios compare the players’ utilities"**: Destroy during scale invariance demo (Step 4) – stress the invariance holds *within* each player’s scale.  
  5.  **"The BATNA doesn’t matter for KS, only Utopia"**: Correct during construction (Step 2) – the ray starts at D!  
  6.  **"KS is Rawlsian/maximin"**: Preempt during debunking (Step 3) – KS cares about *gain ratios*, not levels or worst-off.  

  **Key Phrasing for Your "Same Fraction" Summary**  
  Use it IN STEP 2, but ONLY after constructing the point, and IMMEDIATELY qualify:  
  > "So, Kalai-Smororodinsky gives each player the *same fraction* of their potential gain – the fraction of the distance from their BATNA to their Utopia that they achieve. **BUT** – crucially – remember that Utopia is *unachievable* by both simultaneously. This isn’t splitting gains from cooperation; it’s splitting gains relative to a counterfactual where one player gets everything *at the expense of feasibility*. The fraction measures how much of their *unilateral potential* they capture."

  This plan forces engagement with the infeasible anchor and scale invariance, uses a tailored example to highlight KS vs. Nash, systematically breaks target misconceptions at the moment they arise, and ends with a diagnostic check. The focus stays on mechanics, not fairness.
