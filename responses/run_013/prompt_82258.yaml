answer: |-
  ## Six Minutes in the Gym

  Friends, families, faculty, and most importantly, the remarkable Class of [Year] – thank you. It’s an honour to stand here. Truly. I’ve known many of you since you were much smaller, shuffling through these halls with backpacks bigger than you were. Seeing you reach this milestone… well, it means more than I can easily say.

  For months, I’ve wrestled with what to offer you today. Because if there’s one thing I promised myself, it was this: I wouldn’t stand up here and hand you a slogan. Not one more shiny, easy phrase to toss in the drawer with the others. Life, I suspect you’re already discovering, is rarely that simple.

  My wrestling started with a puzzle. Picture this: I’m in my car, looking at the fuel gauge. It reads “Full.” So, I believe the tank is full. Why? Because the gauge says so. Later, I drive, I check the gauge again, it drops steadily, and eventually, the engine sputters right when it says “Empty.” Aha! I think. Proof! The gauge is reliable! It worked! I add this to my mental list: *Gauge read full, tank was full. Gauge read empty, tank was empty.* Over time, I declare the gauge trustworthy.

  But wait. Think about it. Every single piece of evidence I used to *prove* the gauge was reliable… came *from* the gauge itself. I never stuck a measuring stick down the tank. I never compared it to a master gauge. The gauge checked itself. And somehow, that feels… too easy. Like cheating. Like building a ladder out of the very wood you’re trying to reach.

  Now, this isn’t just about cars. It happens all the time. I look at that curtain over there. It looks red to me. So, I believe it’s red. Therefore, I believe it’s *not* a white curtain under a red light. Therefore, I believe my eyes are working correctly. See? I just certified my eyesight… using nothing but my eyesight. Again. Too cheap.

  So, what’s the alternative? If I say, “Hold on! I can’t trust *anything* – not my eyes, not my memory, not my own gut feeling – until something *outside* me vouches for it,” then where do I even start? I’m frozen. Stuck. Nothing gets off the ground. And that doesn’t feel right either. I *do* trust my eyes, most of the time. I navigate the world. We all do.

  This tension – between the uneasy feeling of trusting an instrument based only on its own testimony, and the paralysis of demanding impossible guarantees from outside – this is the space I’ve been sitting in. And I bring it up not to solve it (I haven’t!), and certainly not to suggest you can’t know *anything* at all. But because I think it touches directly on the most tempting piece of advice given at graduations.

  It’s the one that goes: “Trust yourself. Deep down, you know what’s right. Your inner compass is your truest guide. Follow your heart.”

  And part of me wants to say that. You *are* capable. You *do* have intuition worth listening to. But another part of me hears the echo of that fuel gauge checking itself. *Trust your instrument, because your instrument tells you it’s trustworthy.* It feels… incomplete. Unsatisfying. Potentially misleading. Because sometimes, our instruments *are* wrong. Sometimes the heart leads us astray, the gut feeling is fear disguised as wisdom, and the inner compass spins wildly.

  So, what *can* I offer, standing here, unwilling to give the easy slogan but equally unwilling to drown you in doubt?

  Perhaps it’s this: While you can’t *certify* your judgment in advance, in some perfectly sealed, circular test, you absolutely can *test* it. And that testing doesn’t happen in the vacuum of your own thoughts. It happens *out here*.

  Real confidence – the kind worth having – isn’t the untouchable, self-assured kind that never ventures beyond its own echo. It’s the kind forged when your belief meets the world. When you act on an idea, or a feeling, or a principle, and the world pushes back. When it costs you something – time, effort, comfort, maybe even failure. When there’s a *chance* you could be wrong, and finding out stings a little.

  That pushback, that cost, that potential for being wrong – that’s the “something outside”. It’s not a perfect master gauge. It’s messy. It’s unpredictable. It’s life.

  Your education here wasn't just about filling your tank with facts. It was about giving you tools and then, crucially, creating moments where you had to *use* them against something real – a difficult problem set, a complex text, a group project friction, maybe even a conversation that challenged you. You didn’t just trust your math skills; you did the math and saw if the answer worked. You didn’t just trust your interpretation; you had to defend it, hear others, adjust.

  That process doesn’t stop today. It accelerates. You will make choices – about work, about relationships, about who you want to be in the world. You *will* use your internal instruments: your reason, your empathy, your values, your gut. You have to. There’s no other way to begin.

  But the confidence you seek, the deeper trust in your own capacity, won’t come from simply *declaring* your instruments reliable in isolation. It will come from taking them out on the road. From acting, from engaging, from sometimes being surprised – pleasantly or unpleasantly – by the results. It comes from the moments when your belief about yourself, or the world, meets resistance, and you learn. It might smell faintly of gasoline and effort.

  So, Class of [Year], I won’t tell you to simply “trust yourself” like it’s a magic spell. But I will tell you this: Trust yourself *enough* to start. Trust yourself enough to act, to try, to step into the messy, uncertain, beautiful world beyond these walls. Trust yourself enough to let that world test you, refine you, and yes, sometimes correct you. That’s not a slogan. That’s the work. That’s where real knowing – imperfect, hard-won, constantly evolving – begins.

  Go test your instruments. The road is waiting. Congratulations.
