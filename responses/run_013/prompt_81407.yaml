prompt: |-
  I have been reading rationalist blogs and forums for something like fifteen years, and the one habit I have kept from them is this: when my stated beliefs and my actual verdicts come apart, I write the verdicts down and work out what principle they imply, rather than adjusting the verdicts to fit the belief. That is what I am asking for here, on a subject where I have never once managed it.

  By conviction I am a consequentialist. I do not believe in karma as a causal ledger, in rebirth, or in any form of cosmic bookkeeping. But when I write down what I actually think about particular acts, the verdicts come out looking like something out of Buddhist practice, and I cannot tell whether that is because the practice got the structure of morality right or because I absorbed the intuitions without the reasons. I do not want an answer about what any tradition says, and I do not want texts cited at me — I cannot check them and it would not help. I want a principle that fits the verdicts, stated precisely enough that I could apply it to a case I have not thought of, along with an honest account of what it costs me. I would rather be told that one of my verdicts has to go than be handed a principle with a new clause for every case.

  Here are the verdicts.

  1. A pharmacist lies to a customs officer about what is in a parcel so that a medicine gets through to a patient who will die without it. Clearly fine. I would do it without hesitation.
  2. The same pharmacist steals the medicine from a warehouse, because the owner will not sell at a price the patient can pay. Also fine, though less comfortable.
  3. A doctor, at the family's request, gives a dying woman a dose that ends her life. Wrong, and I am not moved by the fact that she would have died in a few days, in pain.
  4. A doctor lies to a confused patient about what a procedure is, so that she will accept a treatment that will save her. Fine.
  5. One person gives away most of her savings anonymously; another gives the same sum at a gala where she is thanked for it. The first is better, and not because the second's money does less good — the money does the same good.
  6. Someone is privately pleased that a rival's project has failed, does nothing about it, and tells no one. Bad, and I do not think that is only a matter of what such pleasure tends to lead to.
  7. The same true words about a friend's manuscript, said to him alone, are right; said in front of two other people, are wrong. Nothing about the words or their effect on him changes.
  8. A man drinks alone at home on a night when nothing comes of it. Not wrong at all, though the precepts I half-absorbed say otherwise.
  9. I eat meat and think it is wrong, and I do not think it would stop being wrong if the animals were raised painlessly and the farming were carbon-neutral — which suggests the wrongness is not located in the suffering.

  The pair I cannot reconcile is 1 and 3, or rather the classes they stand for. I will break the rule against deceiving to prevent one death without a second thought, and I will not break the rule against killing to prevent several, even when I am sure the arithmetic favors it. Cases 2 and 3 are in tension in the same way: taking what is not mine is available to me as a solution; killing is not.

  The only thing I have come up with that fits most of this is what I have been calling the consent clause. What matters to me is not how much harm comes about, but whether the agent had to consent to that harm as the thing she was doing, rather than merely foresee it as something her doing would bring about. Under that clause, killing one to save five is out, because the death is the instrument; lying to save a life is in, because the deception is not the point of what I am doing, only the shape my speech has to take. But when I say it out loud it sounds less like a principle than like a restatement of the verdicts. It also seems to misfire: I think an engineer who ships a system she believes has a small chance of being used to kill many people is not off the hook just because that harm is a foreseen side effect rather than her aim, and I think someone privately glad at a rival's failure has done something bad without doing anything at all.

  What I want from you:

  - the principle, or the two or three candidates, stated precisely, with each clause attached to the case that forces it;
  - whether what I have is a form of consequentialism — with side constraints, or a threshold, or a restriction on what may be intended — or a genuinely non-consequentialist view that happens to agree with Buddhist practice on many cases; if the latter, say exactly where the arithmetic is overridden;
  - the verdicts of the best candidate on cases I have not listed, including at least one I will not like;
  - which of my nine verdicts I should give up, and what I would be buying by giving it up.

  If the honest answer is that no single principle fits and the best I can do is a list of clauses, say so, and say what the list would have to contain.
reasoning: |-
  Okay, let me start by really understanding what the user is asking for. They've been into rationalist thinking for 15 years and have this habit of aligning their actual judgments with stated beliefs. But here, they're stuck because their consequentialist beliefs don't match their intuitive verdicts, which seem influenced by Buddhist ethics. They want a principle that explains their specific judgments without resorting to traditional doctrines.

  First, I need to look at their nine verdicts. The key tension is between cases 1/2 (lying/stealing to save a life is okay) and case 3 (euthanasia is wrong even if it prevents suffering). They mention the "consent clause" they came up with, where harm is acceptable if it's a foreseen side effect but not if it's intended. But they point out flaws, like the engineer example where foreseen harm still feels wrong, or private schadenfreude being bad without action.

  The user wants a precise principle that fits most cases, identifies if it's still consequentialism or something else, provides new case verdicts (including ones they won't like), and suggests which of their verdicts might need revising and why.

  Looking at their examples, there's a pattern. Cases 1, 2, 4 involve deception or theft but to prevent harm, which they accept. Case 3 is direct killing, which they reject. Case 5 values anonymous giving over public, suggesting intrinsic worth of motives. Case 6 shows badness in mere private pleasure at others' misfortune. Case 7 depends on context (private vs. public criticism). Case 8 rejects the idea that solitary drinking is wrong. Case 9 thinks meat eating is inherently wrong, beyond suffering or environmental impact.

  The consent clause (intended vs. foreseen harm) explains some but not all. Double Effect is similar but fails with the engineer case. Maybe incorporating agent-relative constraints? That is, some actions are forbidden regardless of consequences. But that might not fit with their consequentialist identity.

  Another angle: intrinsic nature of actions. Killing vs. letting die. But case 3 is active killing, which they reject, while case 4 involves deception to save, which they accept. The distinction might be between doing harm actively versus allowing harm through omission, but that doesn't fully cover it.

  Looking at case 6 and 7, the social context matters. Private thoughts vs. public actions. Also, the motive in case 5. So maybe a principle that includes the moral weight of intentions, the intrinsic wrongs of certain acts (killing), and the value of purity in motives.

  But how to reconcile? A hybrid system: consequentialism with strong constraints on certain actions like killing, plus a focus on intentions and virtues. That moves away from pure consequentialism. For example, killing is always prohibited, but deception isn't if it prevents harm. Stealing might be a lesser violation. 

  The user might need to accept that their view isn't purely consequentialist. The principle could be: "Maximize welfare, but never directly intend harm to innocents, and maintain integrity in motives." But then the engineer case: the engineer foresees harm but doesn't intend it. Still feels wrong. So maybe add a responsibility clause—if you enable harm, you're responsible even if unintended. But that complicates things.

  For the rival's failure (case 6), it's about the vice of envy, not consequences. Virtue ethics sneaks in. Case 5 values humility, a virtue. So maybe the principle incorporates both constraints and virtues. 

  But the user wants a single principle. Perhaps a threshold deontology: consequentialism up to a point, but absolute prohibitions on killing. That fits cases 1-4. Case 2 (stealing) is permissible because it's below the threshold, but killing isn't. But case 9: meat eating wrong even without suffering. That suggests an intrinsic wrong in killing animals, which aligns with a constraint against killing. 

  Cases 6 and 7 are trickier. Private pleasure being bad—that's about character, not actions. The user might need to give this up or accept a virtue component. Similarly, case 7: context changes morality, which could be about social consequences, but they say the effect on the friend is the same. So maybe the principle includes the social meaning of actions—public criticism shames, private doesn't. 

  New cases: What about self-defense killing? If someone attacks you, is killing them okay? Their principle might allow it because the harm isn't intended as a means? Or not? Also, the trolley problem: diverting a train to save five but kill one. They would probably reject it under their current verdicts, since it's directly causing death. 

  The user might need to abandon verdict 6 or 9. If they keep 9, meat eating is intrinsically wrong, but then why is euthanasia (case 3) also wrong? Both involve killing. But in case 3, it's human life, which might have higher sanctity. But case 9 suggests animals have intrinsic value too. Inconsistency? They might need to either accept euthanasia or justify why humans and animals are different. 

  Alternatively, give up verdict 6: private schadenfreude isn't morally bad, just a human flaw. But they feel it's bad intrinsically. Or accept that their view includes character ethics. 

  The cost of adopting a non-consequentialist framework is losing the simplicity of outcome-based decisions. They might have to accept moral dilemmas where constraints prevent maximizing good. But they gain consistency with their intuitions. 

  Best candidate principle: **"Act to prevent harm, but never intentionally cause harm to an innocent being. Evaluate actions based on intentions, the nature of the act, and motives, not just outcomes."** This explains cases 1-4, 8, 9. Case 5: anonymous giving has purer motives. Case 6: schadenfreude involves harmful intent, so bad. Case 7: public criticism intends to shame, private doesn't. 

  New verdict they won't like: Trolley problem—killing one to save five is forbidden. Or, self-defense killing might be acceptable if the attacker isn't innocent. 

  Abandon verdict 6: private pleasure without action isn't blameworthy. Or accept it as a character flaw but not a moral wrong. That simplifies the principle. 

  In conclusion, their view is a non-consequentialist hybrid. They should drop verdict 6 or integrate virtue ethics. The cost is complexity, but alignment with their intuitions.
answer: |-
  Your self-consistent verdicts point to a **non-consequentialist hybrid framework** combining agent-centered constraints, a focus on moral intentions/responsibility, and the intrinsic character of acts—not merely outcomes. Below is a precise principle derived from your judgments, with costs, unresolved tensions, and prescriptions.

  ---

  ### **The Core Principle: Constrained Instrumentality**
  **"Minimize harm, but never use an innocent being as an instrumental means to an end. The moral character of an act depends on:  
  (i) Whether harm is *intended* as a tool or merely *foreseen*;  
  (ii) The *nature of the act itself* (some acts are intrinsically prohibited);  
  (iii) The agent's *integrity of will* (motives and attitudes matter independently of outcomes)."**

  #### **How It Fits Your Cases**
  - **Cases 1 & 2 (lying/stealing for medicine):** Harm (deception/theft) is foreseen but not *intended as the instrument*; the goal is saving life. Theft is "less comfortable" because property rights carry weak (but not absolute) constraint.  
  - **Case 3 (euthanasia):** Killing is *intended as the instrument* to end suffering → violates (i) and (ii). Death is not a side effect; it is the means.  
  - **Case 4 (deception for treatment):** Lying is foreseen but not instrumental (goal is healing). No intrinsic prohibition against lying → permissible.  
  - **Case 5 (anonymous vs. public giving):** Motive purity ("integrity of will") has intrinsic value → anonymous act is morally better.  
  - **Case 6 (private schadenfreude):** Malicious attitude corrupts the will → intrinsically wrong (iii), even without action.  
  - **Case 7 (criticism in private vs. public):** Public criticism *instrumentalizes* humiliation (using shame as a tool) → violates (i). Private criticism avoids this.  
  - **Case 8 (solitary drinking):** No harm intended, foreseen, or actual → neutral.  
  - **Case 9 (meat-eating):** Killing animals *instrumentalizes* them (even painlessly) → violates (i). Suffering is secondary; the wrong is in using life as a resource.

  #### **Is This Consequentialism?**  
  No. **This is deontology with virtue elements and a consequentialist tilt.**  
  - **Where arithmetic is overridden:** Harm minimization *fails* when an act requires intending harm to innocents (e.g., kill one to save five) or violates integrity (e.g., schadenfreude). Constraints are agent-relative: *you* cannot commit certain acts, even to optimize outcomes.  
  - **Consequentialist remnants:** Harm minimization still matters (e.g., theft is "less comfortable" than lying because it causes greater harm; saving life justifies minor transgressions).

  ---

  ### **Verdicts on New Cases (Testing the Principle)**
  1. **Trolley Problem:** *Pulling a lever to divert a train, killing one worker to save five.*  
     **Verdict:** **Wrong.** Death is intended as the means to save others (instrumentality violation). *You won’t like this: it rejects "harm-minimizing" killing.*  
  2. **Self-Defense Killing:** *Shooting an attacker to save your life.*  
     **Verdict:** **Permissible.** The attacker is not "innocent"; their harm is not instrumentalized (it’s a side effect of stopping them).  
  3. **The Engineer Case:** *Building a system likely to be weaponized.*  
     **Verdict:** **Wrong.** Despite foreseen harm, you enable mass instrumentalization of lives → violates (iii) (negligence corrupts will).  
  4. **Charity with Side Harm:** *Donating to a clinic that accidentally kills one patient but saves ten.*  
     **Verdict:** **Permissible.** Harm is unintended and non-instrumental; your act remains pure in motive/execution.

  ---

  ### **Which Verdict Should You Give Up?**
  **Abandon Verdict #6 (private schadenfreude).**  
  - **Why:** It conflicts with the core framework. If *no harm is caused or risked*, and *no act is committed*, moral wrongness must stem *only* from character corruption. But your principle rejects virtue ethics as primary (e.g., Case 8 rejects "character" condemnation of drinking). Schadenfreude is a *vice*, not inherently *immoral* without action.  
  - **What You Gain:** Consistency. Your other verdicts focus on acts and responsibilities. Keeping #6 forces a "no bad thoughts" clause that overextends your principle.  

  **Alternative:** Keep #6 but accept a **virtue-ethics hybrid**. *Cost:* It bloats the principle: "Avoid acts that instrumentalize harm *and* cultivate goodwill." This weakens parsimony.

  ---

  ### **Costs of Adopting This Principle**
  1. **Arithmetic Becomes Secondary:** You cannot kill, deceive, or exploit innocents *even to maximize good*. Extreme cases (e.g., "torture one to save millions") become unresolvable.  
  2. **Ambiguity in "Intent":** Distinguishing "intended means" vs. "foreseen side effect" is slippery (e.g., is stealing medicine *using* the owner's loss instrumentally?).  
  3. **Moral Clashes:** When constraints conflict (e.g., "lie to prevent a murder"), no hierarchy exists. You must intuit which constraint dominates.  
  4. **Case #9 Inconsistency:** If killing animals is intrinsically wrong, why isn’t euthanasia (Case 3) *more* defensible? Humans can consent; animals cannot. *To fix this, you must either:*  
     - Drop the "innocence" clause for animals (making meat-eating permissible if painless), or  
     - Accept that humans and animals have asymmetric moral worth (undercutting Case 9’s intuition).  

  ---

  ### **Conclusion: A Three-Part Non-Consequentialism**
  Your principle is **not a list of clauses** but a unified framework with three anchors:  
  1. **Instrumentality Constraint:** Never intend harm as a tool (resolves Cases 1-4, 9).  
  2. **Act-Type Prohibition:** Certain acts (killing innocents) are forbidden (resolves Case 3).  
  3. **Will/Motive Integrity:** Attitudes and motives carry weight (resolves Cases 5-7).  

  **Final Prescription:**  
  - Keep all verdicts *except #6*.  
  - For Case 9, clarify if animals are "innocent beings" or if their instrumentalization differs from humans.  
  - Accept that this is **threshold deontology**: consequences matter until they clash with constraints against instrumentalizing harm.  

  This costs you the simplicity of pure consequentialism but honors your deepest intuitions. If you *insist* on consequentialism, only a heavily gerrymandered version (e.g., "Consequences matter, plus never intend harm, plus virtues matter") fits—but it ceases to be recognizable as such. Your verdicts reveal a mind that values moral boundaries beyond arithmetic. Embrace it.
