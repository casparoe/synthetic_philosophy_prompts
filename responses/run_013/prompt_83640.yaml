prompt: |-
  I run a small housing policy shop — four of us, about two years of funding, and a mandate to push our city council on zoning reform. We're not academics and we can't run big studies, so our only real asset is arguements. I want to spend those two years on the conceptual questions that actually do work in the fights we keep having, not on stuff that only matters to other policy shops.

  Here's the thing I keep tripping over. Every zoning fight in this city has two ledgers running at once. One is about what the neighborhood owes the people already living there — the ones who bought in, planted trees, sat through a decade of meetings, and who have some claim that the place will stay recongizably itself. The other is about what the city owes everyone else — the people priced out, the people who'd move in if they could, the people whose only realistic shot at a decent school or a short commute runs through a neighborhood like this one. Nobody I talk to keeps both ledgers open at the same time. The homeowner side argues from the first and treats the second as an abstraction; the YIMBY side does the exact reverse. I've started calling it the two-ledger problem, and I think most of our stalemates are really about how to merge the ledgers, or whether they can be merged at all.

  So, within that — plus whatever else in the zoning and NIMBY space you think sits upstream of it — what are the open questions that matter most, and in what order should we take them? I want the reasoning more than the list. For each one: why is it upstream of the other things we argue about, is it tractable for four people with no data, no lawyers and no PhDs, and what would actually move it up or down my ranking — a court ruling, a new kind of tenure, a change in who bothers showing up to meetings?

  Two things I specifically want you to take a side on, because I suspect that's where the real disagreement lives and everyone dodges them. First, whether standing in these fights should be weighted by tenure and ownership at all — whether someone who's lived on a block thirty years has a stronger claim on its rules than someone who moved in last year, or whether that's just an intuition that happens to protect incumbents. Second, whether the fix is changing the rules (upzone, allow more by right) or changing who holds the power to make them (move discretion up to the region, or down to the block). Those feel like different questions to me, but I keep hearing them collapsed into one, and if they are different then one of them is probably upstream of the other, and I'd like to know which. The right-to-the-city tradition is somewhere in the background here and I've read enough of it to be dangerous, so use it if it helps, but don't just hand me back its slogans.

  Last thing: tell me what I'm missing. What question would you put at the top of this list that I haven't mentioned, and why does it beat the ones I have?
reasoning: |-
  Okay, let me unpack this housing policy director's challenge. They're running a small shop focused on zoning reform, wrestling with what they call the "two-ledger problem" - the tension between existing residents' claims to neighborhood stability and the city's obligation to excluded populations. 

  First, I need to understand their core constraints: four people, two years, no academic resources, and a mandate to influence city council. Their weapon is arguments, so I should focus on conceptual leverage points rather than data-heavy solutions. The explicit asks about tenure weighting and rule-making power distribution are crucial, but I suspect there's deeper structure beneath these surface debates.

  The tenure question seems fundamental - it's about the moral architecture of neighborhood change. When they ask whether a 30-year resident has stronger rule-making rights than a newcomer, they're really probing the legitimacy of incumbent advantage. The power distribution question (upzoning vs restructuring decision-making) feels like a false binary - both matter, but at different levels. 

  What's striking is how both sides in these debates engage in ledger denial. Homeowners ignore the exclusion ledger; YIMBYs dismiss the attachment ledger. The real conflict isn't about density but about competing moral frameworks for place governance. This makes me think the most upstream question is actually: "What moral obligations does a neighborhood owe to non-residents?" - because that determines whether the second ledger gets acknowledged at all.

  For their shop's capacity, I'm considering arguments that work in public meetings and council sessions. Things like: the "democratic deficit" frame showing how current rules disenfranchise future residents, or the "sunk costs" analogy exposing how we treat housing differently from other investments. The tenure weighting issue could be flipped using property law itself - ownership gives control over your parcel, not the neighborhood. 

  On the power question, I'm realizing reforming rules and restructuring power aren't alternatives but sequential steps. You first change rules to enable development, then shift power to sustain it. The regional scale matters because exclusionary zoning's harms spill across municipal lines - a single neighborhood can't solve regional housing shortages. 

  The element they might be missing? The "democracy of inhabitance" concept - that those affected by decisions (including the excluded) deserve representation. This beats their listed questions because it reframes the conflict from "residents vs newcomers" to "insiders vs affected outsiders." A court ruling expanding standing could change everything, but that's a long shot. More immediately, changing who shows up at meetings by partnering with community colleges or unions could unstick debates. 

  For prioritization, I'd sequence it: first establish the moral claim of non-residents (using everyday analogies), then attack tenure weighting (through paradoxes in current practice), then push rule changes (with by-right development as wedge), and finally restructure power (via regional compacts). The tenure and power questions aren't just tactical - they're where the underlying worldview clash becomes visible, so taking clear positions there is essential for credibility. 

  The right-to-the-city framework is useful but needs translation - less "capital accumulation" talk, more "my commute steals family time" stories. What would actually move needles? Not studies, but unexpected voices in hearings: teachers testifying about 90-minute commutes, young parents describing illegal unit crowding. Their shop could curate these testimonies while framing the conceptual arguments.
answer: |-
  Here’s a strategic framework for tackling the "two-ledger problem," prioritizing questions by their upstream leverage, tractability for your team, and potential catalysts. The goal is to merge the ledgers by reframing the conflict — not as "stability vs. justice," but as **"how we govern shared resources when claims conflict."**

  ### Core Strategic Insight
  The stalemate exists because both sides see the ledgers as **zero-sum moral claims** (attachment vs. need). Your opening move must **redefine the conflict** to something resolvable through policy. Focus on questions that expose the *systemic* roots of the conflict, not just its symptoms.

  ---

  ### Ranked Open Questions & Action Plan
  #### 1. **What Obligation Does a Neighborhood Owe to Non-Residents?**  
     *Why it’s upstream:* Until this is established, the second ledger is dismissed as "not our problem." This question forces acknowledgment that zoning isn’t just local — it’s a regional welfare mechanism.  
     *Tractable for you?* Yes. Use analogies:  
     - *Water rights:* A neighborhood upstream can’t hoard a river. Housing is infrastructure.  
     - *School funding:* Local taxes fund schools non-residents use. Exclusion has reciprocal costs.  
     *Catalysts:*  
     - **Regional cost data:** Partner with transit agencies to show commuter burdens (e.g., "Residents here gain 2 hours/day from short commutes; excluded pay in time/gas").  
     - **Shame/Pride Leverage:** "Should our neighborhood be known as a bottleneck or a solution?"

  #### 2. **Does Tenure Grant Special Rights Over Neighborhood Rules?**  
     *Your ask: Take a side.* **No.** Here’s the case:  
     - **The Property Rights Mismatch:** Ownership confers control over *your lot*, not collective veto over *others’ lots*. Zoning is a public rulebook, not a homeowners’ covenant.  
     - **The Mobility Penalty:** Weighting power by tenure privileges those who stay put over those who *must* move (job loss, family needs). Stability for some creates instability for others.  
     - **Democracy Test:** Should voting power increase with residency length? We reject this in elections; why in land use?  
     *Why it’s upstream:* This legitimizes exclusion. Concede this, and the first ledger swallows the second.  
     *Tractable?* Yes. Use reductio ad absurdum:  
     > *"If Ms. Jones gets 30 votes for her 30 years here, and a new firefighter gets 1 vote, can Ms. Jones veto the fire station?"*  
     *Catalyst:* **A developer lawsuit** challenging public comment weighting (rare, but watch for it). Short-term: Train renters/young parents to testify about "stake" vs. "tenure."

  #### 3. **Rules vs. Power: Which Comes First?**  
     *Your ask: Take a side.* **Change rules first, then shift power.**  
     - **Rules first:** Upzoning (e.g., allowing duplexes citywide) *reduces the stakes* of each fight. When every lot can add units, blocking projects feels petty, not existential.  
     - **Power second:** Once rules are looser, shift oversight to professionals (e.g., design review boards) or regional bodies. Discretionary review *is* the weapon; holster it before redistributing it.  
     *Why order matters:* Transferring power without reforming rules lets NIMBYs capture *new* institutions (e.g., hyper-local councils). Rules create facts on the ground.  
     *Tractable?* Yes. Frame as "streamlining":  
     > *"Let’s stop wasting everyone’s time on whether Ms. Kim can add a granny flat. Set clear rules, then focus on *how* it looks."*  
     *Catalyst:* **State preemption laws** (e.g., California’s SB 9). Cite nearby cities that upzoned without chaos.

  #### 4. **Who Counts as "The Neighborhood"?**  
     *Why it’s upstream:* "Neighborhood character" is wielded as a veto. Redefining "who decides" reshapes what "character" means.  
     - **The missing voices:** Renters (often >50% of residents), employees (teachers, cashiers), future residents.  
     *Tractable?* Yes. Use **spatial justice framing:**  
     > *"A ‘neighborhood’ isn’t just owners within 500 feet. It’s the waitstaff biking in at 5 AM, the nurse commuting 90 minutes. Their character matters too."*  
     *Catalyst:* **Map the exclusion zone.** Show how far low-wage workers travel to serve the area. Partner with unions for testimony.

  #### 5. **What’s the "Stability" We’re Protecting? (And Who Pays for It?)**  
     *Why it’s upstream:* Attachment isn’t irrational — but we conflate *change* with *loss*. Forced stagnation breeds its own instability (displacement, aging population).  
     *Tractable?* Yes. Reframe stability as **resilience through managed change:**  
     - *Paradox:* "Fighting all change makes collapse likelier (see shrinking cities). Gentle growth *is* stability."  
     - *Cost:* "When we block apartments, who pays? Young families buying tear-downs at inflated prices? Taxpayers funding longer roads/transit?"  
     *Catalyst:* **Aging-in-place stories.** Seniors supporting granny flats: *"I want to downsize *here* but can’t find anything small."*

  ---

  ### What You’re Missing: The "Democracy of Inhabitance" Question  
  **Top of List: *"Do people have a right to live where their life unfolds (work, family, community) — and if so, what institutions honor that right?"***  
  - *Why it beats your questions:* This forces both ledgers into one frame. The first ledger is about *existing* inhabitance; the second is about *potential* inhabitance. Failing to answer this cedes the moral high ground to incumbents.  
  - *Right to the City (RTTC) stripped down:* Don’t say "collective ownership of urban space." Say: *"If you serve this city, you deserve a shot to live in it."* RTTC is useful here because it links **dignity** (first ledger) to **access** (second ledger).  
  - *Action:* Find people emblematic of "denied inhabitance" (e.g., teacher commuting 2 hours) and have them **claim their right** in hearings:  
    > *"I teach your kids. I deserve to live where I work."*  

  ---

  ### Execution Strategy: How to Spend Two Years
  | Quarter | Focus                      | Tactics                                                                 |
  |---------|----------------------------|-------------------------------------------------------------------------|
  | 1-2     | **Legitimize the 2nd Ledger** (Q1) + **Tenure Weighting** (Q2) | Testimony from "excluded" voices; Op-eds debunking tenure claims; Simple analogies |
  | 3-4     | **Rules Reform**           | Push 1-2 "easy" by-right changes (ADUs, duplexes); Frame as "local control for owners" |
  | 5-6     | **Redefine Neighborhood**  | Map exclusion zones; Partner with labor/unions; "Character" rebuttals   |
  | 7-8     | **Shift Power**            | Advocate for regional housing targets; Professionalize design review    |

  **Your weapon: Moral clarity, not data.** You don’t need PhDs to ask: *"Is it fair that…?"* or *"Who pays when we say no?"*  
  **Kill the stalemate by refusing the false choice.** The merged ledger reads: *"We honor those who built here by ensuring others can too."*
