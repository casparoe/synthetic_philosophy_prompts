prompt: |-
  I write novels for a living (or near enough), but this year I've somehow ended up as writer-in-residence in a philosophy department, and the woman who runs the masters module on decision theory has asked me to contribute one essay question to the final assessment — her reasoning being that it's good for the students to get a question from someone outside the discipline, mine being that I get a nice dinner out of it. The topic she's given me is Good's theorem on the value of information. I know roughly what it says: for a Bayesian expected-utility maximiser, the expected value of information can't be negative, because whatever you learn you can always ignore it and choose the act you would have chosen anyway. I also know that 'you can always ignore it' is doing an enormous amount of unexamined work in that sentence, and that's where I want the question to live. Assume the exam is sat in a hall with no internet, so please don't build anything into the question that needs them to cite or look anything up — no reading lists, no references; it has to stand on its own.

  What I'd like from you: the question itself; a model answer of about 700 words; and a marking scheme out of 20, with the marks attached to specific must-hit moves and a one-line note on how candidates typically get each of them wrong. It's a 90-minute essay paper, and I'd like the question to have two or three short parts as long as they hang together, rather than three separate questions stapled together. The thing I care about most is that a student can't scrape a decent mark by reciting 'free information is always worth having' and padding it out for a page and a half. I'm not a philosopher, so don't give me a question that's secretly just a vocabulary test.

  I've been fiddling with a little two-state example and I'd like the question built on it. A character has finished a novel. The market will either be hungry for it or glutted, fifty-fifty as far as she can tell. If she publishes now she gets 10 in the hungry state and 0 in the glutted one; if she holds it back a year she gets a steady 4 either way. So she publishes, and the decision is worth 5 to her. If she knew the state in advance she'd publish when hungry and hold back otherwise, which is worth 7, so on the face of it the information is worth 2. Now the version I actually want to use: she can commision a market report that will tell her the state, and she's the sort of person who cannot bear knowing her book would have flopped. Learning that the market is glutted costs her 8 of misery; learning it's hungry gives her 1 of pleasure. That makes the report's net value negative even though the decision problem hasn't otherwise budged. I genuinely can't tell whether that's a counterexample to Good's theorem or simply a case of information that isn't free in the relevant sense, and that argument is exactly what I want the exam question to stage, so the marking scheme should tell me which side a strong answer has to be able to argue and why the other side isn't stupid, and it should seperate the A from the B by naming the moves. Beyond that, please have the question force them apart on the ex-ante/ex-post thing — what the theorem does and doesn't promise about how things turn out — and on what exactly the 'ignore it' step presupposes, with at least one part where they have to say where the theorem's premises come apart once you leave the single-agent expected-utility picture. I'd rather they got there through an example of their own (a game where knowing more hurts, a committee whose members start from different priors, someone who can't stand ambiguity) than by naming papers, which they won't be able to do anyway. And in the marking scheme, please flag the errors I can already see coming: students thinking the theorem promises that information is good for you once you've got it, and students thinking risk aversion breaks it. British English throughout, please.
reasoning: |-
  We are constructing an exam question based on the provided scenario and the author's requirements. The question will have two or three parts that hang together, and we'll build it around the example given. The core issue is whether the negative net value of the market report (due to emotional costs) constitutes a counterexample to Good's theorem, and what it reveals about the theorem's assumptions.

  Good's theorem states that for a Bayesian expected utility maximizer, the expected value of information (EVOI) is non-negative. The key idea is that one can always ignore the information and thus not be worse off. However, the example introduces emotional costs of learning, which might make the net value negative.

  We'll break the question into parts:

  Part (a): Explain Good's theorem and why, in the standard setup, the EVOI is non-negative. Use the initial example (without emotional costs) to illustrate.

  Part (b): Present the modified example with emotional costs and calculate the net value of the market report. Then, argue whether this is a counterexample to Good's theorem and why or why not.

  Part (c): Discuss the broader implications: what does this reveal about the assumptions of Good's theorem? In particular, address the ex-ante vs ex-post perspective, the possibility of "ignoring" information, and one other scenario (e.g., multiple agents, ambiguity aversion) where the theorem might not hold.

  Now, let's write the question.

  ---

  **Exam Question**

  (a) Explain Good's theorem on the value of information. Using the following scenario, illustrate why the expected value of information is non-negative in the standard Bayesian decision-theoretic framework.

  *Scenario (without emotional costs):* A novelist has finished a book. The market will either be hungry for it (with probability 0.5) or glutted (with probability 0.5). If she publishes now, she gets a payoff of 10 if the market is hungry and 0 if glutted. If she holds the book back for a year, she gets a payoff of 4 regardless. The novelist is an expected utility maximiser.

  (b) Now consider a modified version of the scenario:

  The novelist can commission a market report that will reveal the state of the market (hungry or glutted). However, learning the state comes with emotional costs: if she learns the market is glutted, she experiences misery that reduces her utility by 8; if she learns the market is hungry, she experiences pleasure that increases her utility by 1. These emotional effects are additive to the payoffs from publishing/holding.

  Calculate the expected net value of commissioning the report (i.e., the expected utility with the report minus the expected utility without the report, accounting for the emotional costs). Does this example violate Good's theorem? Explain why or why not.

  (c) Good's theorem assumes that the decision maker can freely choose to ignore information. Discuss how the emotional costs in part (b) challenge this assumption. Further, discuss one other situation (for example, involving multiple agents, ambiguity aversion, or an individual who cannot tolerate ambiguity) in which the non-negativity of the value of information might fail, and explain why.

  ---

  **Model Answer (Approx 700 words)**

  (a) Good's theorem states that for a Bayesian expected utility maximiser, the expected value of information (EVOI) is always non-negative. The reasoning is that the decision maker can always choose to ignore the information and act as they would have without it, thereby guaranteeing at least the same expected utility as without the information. Hence, acquiring information can never be detrimental in expectation.

  In the given scenario, without any report, the novelist has two options:
  - Publish now: expected utility = (0.5 * 10) + (0.5 * 0) = 5.
  - Hold back: expected utility = 4.

  She chooses to publish now, getting an expected utility of 5.

  If she could know the state for sure, she would publish in the hungry state (getting 10) and hold back in the glutted state (getting 4). The expected utility with perfect information is (0.5 * 10) + (0.5 * 4) = 7. The EVOI is the difference: 7 - 5 = 2. This is positive, consistent with Good's theorem.

  (b) In the modified scenario, commissioning the report provides perfect information but with emotional costs. We calculate the expected utility with the report:

  - If the state is hungry (probability 0.5): she learns it's hungry, gets pleasure (+1), and then publishes (getting 10). Total utility: 10 + 1 = 11.
  - If the state is glutted (probability 0.5): she learns it's glutted, gets misery (-8), and then holds back (getting 4). Total utility: 4 - 8 = -4.

  The expected utility with the report: (0.5 * 11) + (0.5 * -4) = 5.5 - 2 = 3.5.

  Without the report, she publishes and gets expected utility 5. Therefore, the net value of the report is 3.5 - 5 = -1.5. This is negative.

  Does this violate Good's theorem? No, because Good's theorem applies to the expected value of information *before* accounting for any costs of acquiring or processing the information. In this case, the negative net value arises from the emotional costs, which are not part of the pure decision problem. The theorem only guarantees that the information itself (if costless) has non-negative value. Here, the report is not free: it comes with emotional side effects. The pure information value (without emotional costs) is still 2, but the net value is reduced by the expected emotional cost: (0.5 * 1) + (0.5 * -8) = 0.5 - 4 = -3.5. So the net value is 2 - 3.5 = -1.5. The theorem is not violated because the emotional costs are an additional factor.

  (c) The emotional costs challenge the assumption that the decision maker can freely ignore information. Good's theorem relies on the idea that the decision maker can conditionally ignore the information, i.e., they can choose to act as if they had not received it. However, in this case, once the novelist has commissioned the report, she cannot avoid the emotional impact of learning the state. The act of learning itself imposes a cost (or benefit) that cannot be undone by ignoring the information in the decision. Thus, the "ignoring" option is not costless.

  Moreover, the theorem is an ex-ante statement: it says that before learning the information, the expected value is non-negative. But ex-post, after learning, the outcome might be worse (as when she learns the market is glutted and ends up with -4). The theorem does not promise that information will always lead to a better outcome, only that in expectation it does not harm.

  Another situation where the value of information might be negative is in a game-theoretic setting with multiple agents. For example, consider a prisoner's dilemma where two players decide whether to cooperate or defect. Suppose one player can acquire information about the other's move. If the other player knows that the first player has this information, it might change their strategy in a way that harms the first player. Thus, even though the information might be useful in isolation, the strategic response of others could lead to a worse outcome. Here, the non-negativity of information value might fail because the decision maker is not acting in isolation.

  Similarly, an individual with ambiguity aversion might prefer not to receive information that reduces ambiguity if they are pessimistic about the outcome. For instance, in the Ellsberg paradox, people prefer known probabilities to unknown ones. If information resolves ambiguity and the decision maker is ambiguity-averse, they might avoid information to prevent the discomfort of facing a known bad probability. This does not violate Good's theorem because the theorem assumes expected utility (with known probabilities) and not ambiguity aversion. However, it shows that in broader models of decision-making (e.g., with multiple priors), information can have negative value.

  In conclusion, Good's theorem holds in the standard Bayesian framework, but its assumptions (such as costless ignoring, single-agent, and expected utility) are crucial. When these are violated, information can have negative net value.

  ---

  **Marking Scheme (out of 20)**

  The essay will be marked out of 20, distributed as follows:

  **Part (a) [5 marks]**
  - 2 marks: Correct explanation of Good's theorem (non-negativity of EVOI, with the "ignore" option). [Common error: vague or incomplete statement, e.g., "information is always good".]
  - 3 marks: Correct calculation and reasoning in the given scenario (without emotional costs): expected utility without report is 5; with perfect information is 7; EVOI=2. [Common error: miscalculation of expected utilities or not showing the "ignore" option.]

  **Part (b) [8 marks]**
  - 3 marks: Correct calculation of expected utility with the report (accounting for emotional costs): (0.5 * 11) + (0.5 * -4) = 3.5. [Common error: not including emotional costs in utility or miscalculation.]
  - 2 marks: Correct net value: 3.5 - 5 = -1.5. [Common error: subtracting the wrong values.]
  - 3 marks: Correct argument that this does not violate Good's theorem because the negative value comes from the emotional costs, not the pure information, which is still worth 2. [Common error: claiming it is a counterexample without addressing the distinction between pure information and additional costs.]

  **Part (c) [7 marks]**
  - 3 marks: Discussion of how emotional costs challenge the "ignore" assumption: the novelist cannot avoid the emotional impact even if she ignores the information in her decision. [Common error: not linking the emotional cost to the inability to ignore.]
  - 2 marks: Explanation of ex-ante vs ex-post: the theorem is about ex-ante expectation, not ex-post outcomes. [Common error: thinking the theorem promises ex-post benefits.]
  - 2 marks: One other situation (e.g., game theory, ambiguity aversion) correctly described and explained as a violation of the theorem's assumptions. [Common error: providing an example without linking to the breakdown of assumptions, or choosing an example that doesn't actually break non-negativity (like risk aversion). Note: risk aversion does not break Good's theorem because it is already accounted for in expected utility.]

  **Additional Notes:**
  - Clarity, structure, and coherence: Up to 2 marks may be deducted for poor presentation, but the above are content marks.
  - The total is 20 marks. The distribution is 5+8+7=20.

  **Strong Answer (A grade):** Must correctly handle all calculations and arguments, especially in part (b) distinguishing pure information value from net value, and in part (c) providing a valid additional example and linking to assumptions.

  **Weaker Answer (B grade):** Might get the calculations right but miss the nuances in the argument (e.g., in part (b) not separating the pure information value, or in part (c) giving a weak example).

  **Common Pitfalls:**
  - Claiming that the emotional cost example is a counterexample without recognizing that the theorem is about the value of the information per se, not the cost of acquiring it.
  - Confusing risk aversion (which is compatible with Good's theorem) with other factors like emotional costs or ambiguity aversion.
  - Not addressing the ex-ante nature of the theorem and focusing on ex-post outcomes.
  - In part (c), providing an example of risk aversion as a reason for negative information value (which is incorrect because expected utility accounts for risk aversion).

  This marking scheme ensures that a student cannot get a decent mark by merely reciting the theorem without engaging with the nuances.
answer: |-
  ### Exam Question

  **Question:** Good’s theorem states that for a Bayesian expected-utility maximiser, the expected value of information (EVOI) is non-negative. This is often justified by noting that one can always ignore new information and stick to the original decision.  

  (a) **Explain Good’s theorem** using the following scenario: A novelist must decide whether to publish a book now or hold it back. The market has a 50% chance of being "hungry" (yielding 10 utility if published now) or "glutted" (yielding 0 utility if published now). Holding the book back yields 4 utility for sure. Assume the novelist maximises expected utility. Calculate the expected value of perfect information about the market state, and show why it is non-negative. (5 marks)  

  (b) **Now consider a variant:** The novelist can commission a market report that perfectly reveals the state. However, learning the market is glutted causes her 8 disutility (misery), while learning it is hungry grants her 1 utility (pleasure). These emotional effects are added to the publishing/holding payoffs. Calculate the net expected value of commissioning the report (including emotional costs). Does this violate Good’s theorem? Justify your answer by analysing whether the theorem’s assumptions hold. (8 marks)  

  (c) **Discuss the implications:** (i) Explain why Good’s theorem is an *ex-ante* claim and how this relates to the outcome in (b). (ii) Describe *one* other situation (e.g., involving multiple agents, ambiguity aversion, or strategic interaction) where information could have negative expected value, and explain how it challenges the idea that one can "always ignore" information. (7 marks)  

  ---

  ### Model Answer (≈700 words)  

  #### Part (a)  
  Good’s theorem asserts that for a Bayesian decision-maker, acquiring new information has non-negative expected value. The rationale is that you can conditionally ignore the information, falling back on your original optimal act. Thus, information cannot harm you *in expectation* before you receive it.  

  In the scenario:  
  - **Without information:** Publishing now yields expected utility \( (0.5 \times 10) + (0.5 \times 0) = 5 \). Holding back yields 4. The optimal act is publishing (EU=5).  
  - **With perfect information:** If hungry, publish (gain 10); if glutted, hold back (gain 4). Expected utility: \( (0.5 \times 10) + (0.5 \times 4) = 7 \).  
  - **EVOI:** \( 7 - 5 = 2 \geq 0 \), satisfying Good’s theorem. Crucially, if information were useless (e.g., always publish regardless), the novelist could ignore it and still achieve EU=5. The "ignore" option ensures EVOI cannot be negative.  

  #### Part (b)  
  In the variant, emotional costs alter the net value:  
  - **Utility with report:**  
    - If market hungry (prob 0.5): Publish + pleasure = \( 10 + 1 = 11 \).  
    - If glutted (prob 0.5): Hold back + misery = \( 4 - 8 = -4 \).  
    - Expected utility: \( (0.5 \times 11) + (0.5 \times -4) = 3.5 \).  
  - **Utility without report:** Original EU=5 (publish now).  
  - **Net value of report:** \( 3.5 - 5 = -1.5 \) (negative).  

  This **does not violate Good’s theorem**. The theorem concerns the value of information *itself* (the "pure" EVOI), assuming no costs of acquisition or psychological side effects. Here:  
  - Pure EVOI remains 2 (as in (a)), which is non-negative.  
  - The net value is negative (\( -1.5 \)) due to *emotional costs* (\( (0.5 \times 1) + (0.5 \times -8) = -3.5 \)) imposed by *learning*, not by the information’s decision-use.  
  Crucially, the novelist **cannot "ignore" the emotional impact**. Good’s theorem assumes information is "free" (costless to receive and process), but here, merely *learning* the state inflicts unavoidable utility changes. The theorem holds for pure information value, but external costs break the net benefit.  

  #### Part (c)  
  (i) Good’s theorem is an *ex-ante* (pre-learning) guarantee: it promises non-negative *expected* value, not that outcomes improve *ex-post* (after learning). In (b), ex-ante net value is negative due to foreseeable emotional costs, but this stems from non-informational factors. Ex-post, if the market is glutted, utility plummets to -4 (vs 0 without the report), illustrating that the theorem does not insure against bad realisations—only that, *on average*, pure information doesn’t harm.  

  (ii) **Example of negative value in multi-agent settings:** Consider a committee deciding on publishing, where members have conflicting priors and voting power. Suppose learning a "glutted" market report causes factional conflict, leading to a suboptimal decision (e.g., deadlock forces a delay, costing utility). Here, information’s net value could be negative because:  
  - **"Ignoring" is impossible strategically:** Even if one member disregards the report, others may act on it, altering collective outcomes.  
  - **Assumption failure:** Good’s theorem presumes a single, unified Bayesian agent. With multiple agents, information can trigger harmful coordination problems or adversarial reactions.  

  This shows the "ignore" option assumes full control over how information influences decisions and welfare. When information affects others’ behaviour or imposes psychological/strategic costs, the theorem’s premises collapse.  

  **Conclusion:** Good’s theorem is robust for pure information in a single-agent Bayesian framework. However, it fails to ensure non-negative value when information acquisition involves costs (e.g., emotional or strategic) that preclude "ignoring" its effects. The theorem’s limits highlight its dependence on idealized assumptions about agency and costless learning.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **General Notes:**  
  - Award partial marks for incomplete but sensible steps.  
  - Deduct 1–2 marks for significant errors in arithmetic or logic.  
  - **British English required**: Penalise American spellings if pervasive.  

  #### Part (a) (5 marks)  
  - **2 marks:** Clear explanation of Good’s theorem, including the "ignore" rationale.  
    - *Common error:* Vague statements like "information is always good" without referencing Bayesianism or the fallback option.  
  - **3 marks:** Correct EU calculations (no info: 5; with info: 7; EVOI: 2).  
    - *Common error:* Miscalculating EU without info (e.g., ignoring dominance of publishing) or EVOI (e.g., using 10 and 4 without weighting).  

  #### Part (b) (8 marks)  
  - **3 marks:** Correct utility-with-report calculation (11 and -4; EU=3.5).  
    - *Common error:* Forgetting emotional costs or misadding them (e.g., subtracting misery only if publishing).  
  - **2 marks:** Correct net value (-1.5) and comparison to no-report (5).  
    - *Common error:* Net value as 3.5 alone, or omitting comparison.  
  - **3 marks:** Argument that this does *not* violate Good’s theorem, separating pure EVOI (2) from emotional costs (-3.5), and noting the unavailability of costless "ignoring."  
    - *Common error:* Claiming a counterexample without addressing assumptions, or conflating net value with pure EVOI.  

  #### Part (c) (7 marks)  
  - **(i) 3 marks:** Explains ex-ante (theorem’s domain) vs. ex-post (realised outcomes), linking to (b)’s negative net value as consistent with ex-ante expectations.  
    - *Common error:* Stating the theorem promises ex-post benefits or misinterpreting (b)’s outcome as a refutation.  
  - **(ii) 4 marks:** Describes one valid situation (e.g., multi-agent game, ambiguity aversion) and explains why "ignore" fails.  
    - **2 marks:** Plausible example (e.g., committee conflict, ambiguity-averse agent avoiding anxiety-inducing information).  
    - **2 marks:** Explanation linking to assumption failures (e.g., loss of control in multi-agent settings, or non-Bayesian preferences).  
    - *Common error:* Citing risk aversion (does not break theorem, as EU accounts for it) or giving an irrelevant example.  

  **A-grade (17–20):** Hits all must-hit moves: correct calculations in (a)/(b), distinguishes pure EVOI from costs in (b), and provides a coherent example in (c)(ii) with assumption analysis.  
  **B-grade (12–16):** Minor errors (e.g., arithmetic in (b)) or superficial treatment of "ignore" in (c), but recognises theorem’s limits.  
  **C-grade (7–11):** Major gaps (e.g., claiming (b) violates theorem, or no ex-ante discussion).  
  **Fail (<7):** Fundamental misunderstandings (e.g., ignoring emotional costs, misstating theorem).  

  ---  
  This question ensures students engage the assumptions behind Good’s theorem, not just recite it. The marking scheme rewards critical analysis of the "ignore" clause and distinguishes pure information value from real-world costs.
