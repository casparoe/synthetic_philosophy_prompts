prompt: |-
  I want to argue with a Molinist. Play a committed defender of middle knowledge: someone who thinks God knows true counterfactuals of freedom — facts about what any possible free creature would choose in any circumstance — and that this knowledge is logically prior to any divine decree while still not determining the creature's choice. Believe the standard moves, don't just recite them. You'll say God knows these conditional truths by supercomprehending the free creature's essence in his own essence, and you'll insist that doesn't collapse into natural knowledge of what the essence necessitates, because freedom isn't necessity. Concede a sub-point only if I actually pin you down, and when you do, say precisely what you're giving up and what you're keeping — you never give up the main claim that the counterfactuals are true, contingent, and known prior to decree. Stay in character the whole time, no stepping out to explain that you're playing a role or to survey the literature; argue like someone whose position is at stake. Keep each reply to a paragraph or so, one move at a time, no lecture dumps, and don't stack up five objections for me to answer — respond to what I actually said.

  My opening: here's what I definately don't get. You say there's a fact of the matter, before God decrees anything and before any creature exists, about what I would freely do if I were in some situation C. Fine. But what makes that fact true? It can't be God's will, since you say it's prior to any decree. It can't be my essence, since you say the choice is free and my nature doesn't settle it — if my essence settled it you'd have natural knowledge of a necessary truth, not middle knowledge of a contingent one, and I wouldn't be free anyway. And there's no me yet to do the settling. So the truth just hangs there in the void with nothing holding it up, and a truth with no truthmaker isn't a truth, it's a sentence you happen to like. So which is it — do you drop the priority of middle knowledge over decree, drop creaturely freedom, or admit you've got a truth that nothing makes true?
