  Hmm, their background is crucial here. As a stratigrapher, they reconstruct singular, unobserved events (like basin subsidence) using present-day processes, without deducing from laws. That’s their "datum." But they’re wrestling with Hempel’s covering-law model, which demands deduction from universal laws for true explanation. Their discomfort is palpable: historians don’t state laws, so is all history just "storytelling with footnotes"? 

  They propose "actualism" as an alternative: explain past events by invoking only causes attested in the accessible record, without requiring laws or deduction. But they’re self-aware—worried this might just smuggle laws in through the back door or be too weak to choose between causes. 

