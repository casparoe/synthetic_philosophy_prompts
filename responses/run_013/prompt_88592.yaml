  Deep down, they might be testing whether their scientific instincts—forged in geology—can contribute to philosophy of history. They’re not just seeking validation; they want to know if their perspective holds water or if it’s "provincial." The phrase "I’d rather find that out now than in front of the group" reveals vulnerability—they fear professional embarrassment. 

  Philosophically, they’re spot-on about Hempel’s rigidity and history’s lawlessness. But they might underestimate narrativism (e.g., Danto’s "narrative sentences"). Their asymmetry point is sharp: geologists infer causes from effects but say causes *explain* effects. That’s not confusion—it’s a legit puzzle about explanation’s directionality. 

  Biggest risks in their draft:  
  - Oversimplifying Hempel (he allowed statistical explanations later).  
  - Dismissing narrative too glibly (it’s not "mere chronology").  
  - Not seeing that actualism resembles "uniformitarianism," which faces its own critiques.  

  Strengths:  
  - Their "retrospective descriptions" point torpedoes covering-law’s assumption of neutral explananda.  
