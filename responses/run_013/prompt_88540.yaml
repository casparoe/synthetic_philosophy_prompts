prompt: |-
  I write about science and ideas for a living, and I sit on the funding committee of a small nonprofit that backs long-shot research bets. Thursday we vote on a proposal thats got us all stuck, and I have to circulate a written recommendation before then.

  Heres the shape of it: the project runs in rounds, a fair coin decides when it stops, and if it stops on round n our net payoff is (-2)^n divided by n — so round 1 is -2, round 2 is +2, round 3 is about -2.7, round 4 is +4, and so on, with round n reached with probability 1/2^n. Our finance guy says the expected value works out to minus the natural log of 2, a small loss, so pass. The one statistician on the committee says no: that series only adds up in that particular order, rearrange the terms and you can make it come out to any number you like, plus or minus infinity included, so the expected value isn't -0.69, it's undefined, and you can't even rank the thing against the boring grant we'd fund instead. The person who brought us the proposal keeps saying that there's a twin of this program where every single outcome is better than ours and whose expected value is exactly as undefined as ours — so if our rule says no to this one, it says no to the better one too, and any rule like that is junk.

  Draft the committee's decision memo: fund it, reject it, or fund with conditions, with a concrete next step and a timeframe, and give the losing side's best argument a real hearing instead of a polite nod. I won't get to ask the proposer anything else before the vote. No citations needed, just tell me what to do and why.
reasoning: |-
  We are faced with a proposal that has an expected value that is controversial. The finance guy calculates it as -ln(2) ≈ -0.69 (a loss) and says we should reject. The statistician argues that because the series is conditionally convergent (it converges only when the terms are taken in a specific order), by the Riemann rearrangement theorem we can rearrange the terms to get any sum, including ±∞, so the expected value is undefined. The proposer argues that there is a "twin" program that is strictly better in every outcome and has the same issue (undefined expected value) and therefore if we reject this one we must reject the twin too, which they claim is absurd.

   Let's break down the arguments:

   1. The expected value calculation:
      The payoff for round n is (-2)^n / n, and the probability of stopping at round n is (1/2)^n (since it's a fair coin and we stop at the first heads, say, with tails meaning continue). The expected value is the sum over n from 1 to ∞ of [ (-2)^n / n ] * (1/2)^n.
      Simplify the term: [ (-2)^n / n ] * (1/2)^n = [ (-2/2)^n ] / n = (-1)^n / n.
      So the expected value is the sum_{n=1}^{∞} (-1)^n / n.

      This is the alternating harmonic series: -1 + 1/2 - 1/3 + 1/4 - ... = -ln(2) ≈ -0.69.

      However, the alternating harmonic series is conditionally convergent. The Riemann rearrangement theorem says that for a conditionally convergent series, we can rearrange the terms to make it converge to any real number, or diverge to ±∞. This is the statistician's point.

   2. The statistician's argument: The expected value is undefined because the series is only conditionally convergent and we are not fixing an order? But note: the order of the rounds is inherent in the experiment. The rounds happen in sequence: we start at round 1, then 2, then 3, etc. So the natural order of the terms is the order of n. Therefore, we are summing in the order of increasing n. This is the order that gives -ln(2). The rearrangement theorem does not say that the series has no meaning in its natural order; it says that if we were to rearrange the terms arbitrarily we could get different sums. But in the experiment, we don't rearrange the terms arbitrarily. The experiment proceeds in the fixed order of the rounds.

