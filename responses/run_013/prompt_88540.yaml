      But note: the definition of the expected value for a discrete random variable is the sum of the outcomes multiplied by their probabilities. The order of summation is the order of the outcomes. In this case, the outcomes are labeled by n=1,2,3,... and we are summing in that order. Therefore, the expected value is -ln(2).

