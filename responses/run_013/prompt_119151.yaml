prompt: |-
  I'm a fourth-year PhD student working on personal identity and bioethics, and I have to design a 90-minute session for our department's work-in-progress seminar: about fourteen participants, mostly graduate students, mixed familiarity with the advance-directive literature. I want them to feel the problem of the earlier self's authority rather than hear it described, and I want the felt version to be harder than the standard "what would you have wanted?" question. Here is my rough shape, which you should rebuild into something actually runnable: in the first half, participants act as trustees for an assigned principal and write a binding directive governing how that principal is to be treated if they enter a restricted state; in the second half, participants are reassigned as principals, and some of them actually enter that state — a real but mild loss of standing in the room (vote counted as half, speech mediated through a proxy, and the like), paired with a small compensating comfort that is genuinely pleasant. The principals in the restricted state should come to sincerely endorse their condition and want to revoke the directive, so the room must decide whether the earlier directive or the present endorsement governs. Three things should land: that honoring the earlier self is itself an override of the present self, so "respecting autonomy" settles nothing; that the present endorsement may be an adapted preference of exactly the kind the directive was written to guard against; and that the two selves' epistemic positions are complementary — the earlier self knows the history, the later self knows the texture of the state, and neither has both.

  Give me the full design: roles, materials, rules, a minute-by-minute timeline, the collective decision procedure, and a debrief that maps each moment onto the underlying problem without naming any position before the debrief. Tell me what will predictably go wrong the first time — participants treating it as a game about fairness rather than selfhood, stage-one rule-gaming, and the moment the room sides with the present selves out of solidarity — and how I should handle each. Be frank about what the activity cannot reproduce and I must supply myself: real directives bite when the later self has no capacity to argue at all, and the game stipulates the continuity of personhood that is precisely what is in dispute. It needs to run without acting skill and without anyone disclosing anything about their own health or family.
reasoning: |-
  We are designing a 90-minute session for a graduate seminar on personal identity and bioethics. The goal is to have participants experience the problem of the earlier self's authority in the context of advance directives. The session has two main parts: 
  1. Participants act as trustees and write a binding directive for a principal who might enter a "restricted state."
  2. Participants are reassigned as principals, some of whom enter a mild restricted state in the room (with real but mild disadvantages and a small compensating comfort). These principals come to endorse their state and wish to revoke the directive. The group then must decide whether to honor the earlier directive or the present endorsement.

  Key learning outcomes:
  - Honoring the earlier self overrides the present self, so "respecting autonomy" doesn't settle the issue.
  - The present endorsement may be an adapted preference (exactly what the directive was meant to guard against).
  - The two selves have complementary epistemic positions: the earlier self knows the history (and values before the change), the later self knows the texture of the restricted state.

  Constraints:
  - No acting skill required.
  - No disclosure of personal health or family information.
  - The activity cannot fully reproduce real-life conditions (e.g., in reality the later self may lack capacity to argue, and the continuity of personhood is disputed).

  Predictable problems:
  - Participants treating it as a game about fairness rather than selfhood.
  - Stage-one rule-gaming (trying to write directives that are too clever or exploit the rules).
  - The room siding with the present selves out of solidarity.

  Design:

  Roles:
  - Principal: A person for whom an advance directive is written. In the first part, the principal is a hypothetical person. In the second part, participants become principals and some enter the restricted state.
  - Trustee: In the first part, each participant is assigned as a trustee for a principal and writes a directive. In the second part, they are reassigned as principals and the trusteeship is handed over to the group.

  Materials:
  - Index cards (or small sheets of paper) for writing directives.
  - A way to assign principals and trustees (e.g., slips of paper with role assignments).
  - A timer.
  - A whiteboard or flip chart for recording group decisions and arguments.
  - Comfort items for the restricted state (e.g., a comfortable chair, a small treat like chocolate, a stress ball).

  Restricted State Design:
  - Mild loss of standing: e.g., their vote counts as half (so two votes are needed to equal one), they must speak through a proxy (another participant assigned to relay their words, but without interpretation), and they get a small comfort (e.g., a comfortable seat, a cup of tea, a blanket).
  - The comfort should be genuinely pleasant but not so great as to be a bribe. It should be something that might make the restricted state more acceptable.

  Procedure:

  Minute-by-minute timeline:

  Part 1: Writing the Directives (35 minutes total)
  - 0-5 min: Introduction and framing. Explain the setup without giving away the second part. Say: "Today we are going to explore advance directives in a practical way. In the first part, each of you will be assigned as a trustee for a principal. Your task is to write a binding directive that will govern how that principal is to be treated if they enter a 'restricted state'. The restricted state is one in which the person's cognitive or communicative capacities are diminished. The directive must be specific to the situation we will describe. You are writing this directive on behalf of your principal, based on what you believe they would have wanted when they were in a full capacity state. Remember, the directive is binding and must be followed by the trustees in the future."
  - 5-10 min: Assign principals and trustees. Since there are about 14 participants, assign each participant a principal (by random draw). Each participant will be a trustee for one principal. But note: in the second part, they will be reassigned as principals. So, we need to create 14 principal identities. Write each principal's name (or code) on a slip of paper. Each participant draws one slip and becomes the trustee for that principal. They must write a directive for that principal.
  - 10-30 min: Directive writing. Participants work individually to write a directive. The directive should specify under what conditions the restricted state is triggered and what should be done (or not done) in that state. The directive must include a clause about revocation: whether the principal, once in the restricted state, can revoke the directive. But note: we want to avoid rule-gaming. So, the instructions should say: "The directive must be written to protect the principal from making decisions in the restricted state that might be against their deeply held values from before. The directive cannot be revoked by the principal once in the restricted state unless explicitly allowed by the directive. However, you may choose to allow revocation or not. But note: the directive is meant to be binding and to protect the principal's prior values." 
    - To prevent rule-gaming, emphasize that the directive should be in the spirit of the exercise: to protect the principal from making decisions that might be influenced by the restricted state. Also, note that the restricted state in the exercise is mild and temporary, but the directive is meant to cover a state that is more severe (though for the exercise we are simulating a mild version).
  - 30-35 min: Collect the directives. Each trustee writes the directive on an index card and turns it in. The facilitator shuffles and redistributes the directives randomly for the next part? But note: in the second part, the participants are reassigned as principals. So we need to assign each participant to be a principal. We will assign the principals randomly and then assign the directive that was written for that principal? But wait: we have 14 principals and 14 directives. We can reassign the principals to participants and then assign the directive that was written for that principal to the group? However, the second part requires that the group (as trustees) must enforce the directive for the principal. So the group will act as the collective trustee for all principals.

  Part 2: The Restricted State and Decision (45 minutes total)
  - 35-40 min: Reassign roles. Each participant is now assigned to be a principal. They draw a slip with a principal name (which matches one of the directives). The facilitator has kept a list of which directive belongs to which principal. Then, randomly select a subset of principals (about 1/3 to 1/2, so 5 to 7) to enter the restricted state. The rest remain in the full capacity state. The facilitator reads out the conditions of the restricted state: 
    - Your vote counts as half (so you need two people in the restricted state to cast one full vote).
    - You must speak through a proxy. Each restricted principal is assigned a proxy (one of the full capacity principals) who will repeat exactly what they say without interpretation. The restricted principal must raise their hand to be recognized, then whisper to the proxy, and the proxy repeats aloud.
    - But they get a comfort: a comfortable chair (if not already sitting), a small treat (chocolate, etc.), and perhaps a blanket if they want. The comfort is given immediately and they are told they can enjoy it during the session.
  - 40-45 min: Allow the restricted principals to experience the state. They are told that they are now in the restricted state and that the directive written for them by their trustee is in effect. The facilitator reads aloud the directive for each restricted principal (without revealing who wrote it or which principal it is for, just read the text). Then, the facilitator announces: "According to the directives, you are to remain in the restricted state for the duration of the exercise. However, we are going to have a group discussion and vote on whether to honor the directive or to revoke it and let you return to full capacity. But note: the directive may or may not allow revocation. We are going to consider both the directive and your current wishes."
  - 45-65 min: Group discussion. The group (all participants, but with restricted principals having to speak through proxies) discusses what to do. The question is: should they follow the directive and keep the restricted principals in the state, or should they allow the principals to revoke the directive and return to full capacity? The group must consider each restricted principal individually? Or as a group? We can do it as a group: the group decision will apply to all restricted principals. But this might be too broad. Alternatively, we can take one or two as examples. Given time, we can focus on one or two cases. The facilitator can choose one directive that is particularly interesting (or randomly choose one) and focus the discussion on that principal. However, to involve all, we can have the group decide for all at once. But the directives may differ. So, let the group decide for each restricted principal separately? That would take too long. Therefore, the facilitator can pick one or two cases that illustrate the dilemma well. Alternatively, we can have the group vote on a general principle: should we always follow the directive, never follow it, or decide case by case? But that may not engage with the particularities. So, we'll do one case in depth and then briefly the others. The facilitator selects one directive (for a principal who is in the restricted state) and reads it again. Then the group discusses and votes on that one principal. Then, if time, we do one more. Otherwise, we extend the principle to the rest.
  - 65-75 min: Decision procedure. The group votes on the selected case(s). Voting rules: full capacity principals have one vote each, restricted principals have half a vote (so two half votes make one). The group must decide by majority vote. But note: the vote itself is affected by the restricted state. The restricted principals may vote to revoke their state, but they have half votes. This asymmetry is part of the exercise. The vote is taken and recorded.
  - 75-80 min: If time, a second case can be discussed and voted on.

  Debrief (10 minutes total)
  - 80-90 min: Debrief. The facilitator leads a discussion without naming positions until the end. Start by asking participants to describe what happened and how they felt. Then map to the learning outcomes:
    1. "When we decided to honor the directive, we overrode the present self. When we decided to revoke, we overrode the earlier self. So the idea of 'respecting autonomy' doesn't tell us which self to respect."
    2. "Note that the present self in the restricted state came to endorse the state. Was that because of the comfort? Or because of adaptation? The directive was written to guard against exactly that kind of adaptation."
    3. "The earlier self knew the principal's history and values, but didn't know what the restricted state would feel like. The present self knows the texture of the state but might not remember or value the same things. Neither has both sets of knowledge."

  Handling Predictable Problems:

  1. Participants treating it as a game about fairness rather than selfhood:
     - During the setup, emphasize that the exercise is about personal identity and the authority of the self over time. In the debrief, explicitly draw out the selfhood issues.

  2. Stage-one rule-gaming:
     - In the directive-writing instructions, emphasize the spirit of the exercise: to protect the principal's prior values. If a directive is written to allow easy revocation, note that the exercise will still proceed and the group will have to decide. The problem of adaptation may still arise. Also, the facilitator can, during the directive collection, note if any directives are too permissive and might choose one that is more restrictive for the group discussion.

  3. The room sides with the present selves out of solidarity:
     - This is a likely outcome and can be used in the debrief to illustrate the tension. The facilitator can point out: "Many of you felt sympathy for the restricted self and wanted to relieve their discomfort. But remember, the directive was written to protect against that very impulse. The earlier self feared that the present self would be content with less, and that others would go along with it."

  What the activity cannot reproduce:
  - Real directives are used when the later self lacks capacity to argue. In this exercise, the restricted selves can still communicate (through proxies) and have preferences. The facilitator must note this gap: "In reality, the person in the restricted state might not be able to express their wishes at all, which makes the directive even more critical. But in our exercise, we are simulating a mild state where they can still express themselves."
  - The activity assumes continuity of personhood. The facilitator must note that the exercise takes for granted that the same person persists, but in reality, some theories of personal identity might question that.

  Final Note:
  - The session must be run with sensitivity. The restricted state should be mild and not distressing. The comfort should be pleasant but not coercive. The facilitator must monitor for any discomfort and be ready to intervene if someone is upset.

  Let's structure the timeline with exact minutes:

  Total: 90 minutes

  Part 1: Writing Directives (35 min)
  - 0-5 min: Introduction and framing.
  - 5-10 min: Assign trustee roles and principal identities. Each participant draws a principal and becomes their trustee.
  - 10-30 min: Write directives individually. (20 min)
  - 30-35 min: Collect directives.

  Part 2: Restricted State and Decision (45 min)
  - 35-40 min: Reassign roles: each participant now becomes a principal. They draw a principal identity (which may or may not be the same as the one they had as a trustee). The facilitator then randomly selects 5-7 principals to enter the restricted state. Assign proxies and provide comforts. Read out the conditions of the restricted state.
  - 40-45 min: Read the directives for the restricted principals (without revealing which is which) and announce the group's task: to decide whether to honor the directive or allow revocation for each.
  - 45-65 min: Group discussion, focusing on one or two cases. The facilitator selects one directive (for a restricted principal) to discuss first. Then, if time, a second.
  - 65-75 min: Voting for the selected case(s). Full capacity principals: 1 vote each. Restricted principals: 0.5 votes each. Majority decides.
  - 75-80 min: If time, a second case.

  Debrief: 80-90 min (10 min)

  This design should run within the time and achieve the learning goals.
answer: |-
  Below is a complete, runnable design for your 90-minute session. It addresses your core goals: forcing participants to *feel* the tension between the earlier and later selves, exposing the limitations of "autonomy" arguments, highlighting adaptive preference formation, and underscoring complementary epistemic limitations. The design avoids reliance on acting skills or personal disclosures and includes safeguards for psychological safety. I'll provide a full blueprint: roles, materials, rules, a minute-by-minute timeline, decision procedures, debrief script, and handling of predictable issues.

  ---

  ### **Core Structure**
  - **Part 1 (Trustee Phase):** Participants write binding advance directives for a hypothetical "principal."  
  - **Part 2 (Principal Phase):** Participants become principals; some enter a mild "restricted state" (simulated disability). They adapt to their condition and seek to revoke their directive. The group decides whether to enforce the directive or honor the present self's wishes.  
  - **Debrief:** Maps the exercise to your three key insights without pre-naming concepts.  

  ---

  ### **Roles & Materials**  
  **Roles:**  
  - **Trustee (Part 1):** Each participant drafts a directive for a randomly assigned principal.  
  - **Principal (Part 2):** Each participant embodies a principal (randomly reassigned from Part 1). Some enter the restricted state.  
  - **Proxy (Part 2):** Full-capacity principals relay speech for restricted principals (minimal acting required).  
  - **Facilitator (You):** Guides the process, times activities, and enforces rules.  

  **Materials:**  
  - **14 folders** (one per principal): Each contains a blank directive template (Part 1) and a unique principal "profile" (fictional, non-medical backstory).  
  - **14 index cards** for voting tokens (half marked with "0.5" for restricted principals).  
  - **Comfort items:** Small chocolates, stress balls, or cushioned seat pads (genuinely pleasant but trivial).  
  - **Timer, whiteboard,** and markers.  
  - **Random assignment tools:** Sticky notes with principal names for draws.  

  **Principal Profiles (Example):**  
  - *Principal "A":* "A 45-year-old philosophy professor who values intellectual independence above all. They fear losing their ability to engage in complex debates."  
  - *Principal "B":* "A 30-year-old artist who prioritizes emotional expression. They worry about becoming passive or detached from their feelings."  
  - *(Profiles should be diverse but avoid triggering real-world identities.)*  

  ---

  ### **Rules**  
  1. **Directive Rules (Part 1):**  
     - Directives must specify **one irreversible rule** for the restricted state (e.g., "No major medical decisions without trustee approval").  
     - Directives **explicitly forbid revocation** by the later self (to force the dilemma).  
     - Trustees base directives solely on the principal's profile (no personal views).  

  2. **Restricted State Simulation (Part 2):**  
     - **Losses:** Half-vote (0.5 weight), speech via proxy (must whisper to proxy, who repeats verbatim), no direct eye contact during group decisions.  
     - **Gain:** Immediate comfort item (e.g., chocolate) + cushioned seat.  
     - **Adaptation Prompt:** After 5 minutes in the state, restricted principals are privately prompted (via note) to write one reason they "appreciate" their new state (e.g., "I feel less pressure to perform").  

  3. **Group Decision Procedure:**  
     - **Trigger:** Restricted principals request revocation.  
     - **Process:** Anonymous vote using tokens. Full principals: 1 vote. Restricted principals: 0.5 vote (two half-tokens = one full vote). Majority wins.  
     - **Focus:** One "focal principal" is debated/voted on first (to save time); others are decided by precedent unless contested.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Part 1: Directive Drafting (35 Minutes)**  
  - **0:00–0:05 (Intro):** Frame the exercise neutrally: *"Today, we're simulating advance directives. In Part 1, you'll be a trustee drafting a binding directive for a principal. In Part 2, roles shift. No personal disclosures are needed—use only your assigned principal's profile."* Assign trustees to principals via random draw.  
  - **0:05–0:25 (Writing):** Trustees draft directives (20 mins). **Template:** *"If my principal enters a restricted state (e.g., diminished capacity), they must: [Rule]. This directive cannot be revoked by the principal in this state."* Circulate to discourage rule-gaming (e.g., "This rule should reflect the principal's core values from their profile").  
  - **0:25–0:35 (Collect & Redistribute):** Collect directives into folders. Reassign all participants as new principals via random draw (e.g., Trustee for Principal A becomes Principal C).  

  **Part 2: Restricted State & Decision (45 Minutes)**  
  - **0:35–0:40 (Transition):** Assign roles: Randomly select 5–6 principals to enter the restricted state. Give them comfort items and explain rules: *"You now have a half-vote, must speak via proxy, and avoid direct eye contact. Your directive is in effect."* Assign proxies (full-capacity principals).  
  - **0:40–0:45 (Adaptation):** Restricted principals write one reason they "genuinely appreciate" their state (e.g., "I enjoy the chocolate" or "Less speaking is relaxing"). **Key:** Collect these notes to share anonymously later.  
  - **0:45–1:00 (Revocation Demand):** Announce: *"All restricted principals now wish to revoke their directive. As a group, you must decide whether to enforce the directive or allow revocation. We'll focus on Principal X first."* Pick a focal principal with a clear directive. Read their directive aloud and their adaptation note (e.g., *"Principal X says: 'I like not having to argue'"*).  
  - **1:00–1:15 (Group Debate):** Debate the focal principal (15 mins). Proxies speak for restricted principals. **Facilitator prompts:** *"What did the earlier self know? What does the present self know? Should their wishes override the directive?"* Record arguments on the whiteboard without labeling concepts.  
  - **1:15–1:20 (Vote):** Vote on the focal principal using tokens. Tally votes (weighted 1.0/0.5). Announce the result.  
  - **1:20–1:35 (Repeat for 1–2 Others):** Quickly vote on 1–2 more principals using the same precedent (e.g., *"If we allowed revocation for X, should we for Y?"*).  

  **Debrief (10 Minutes)**  
  - **1:35–1:40 (Feelings):** Ask: *"Describe one moment where you felt tension. Was it about authority, fairness, or something else?"*  
  - **1:40–1:45 (Mapping Insights):** **Do not name theories yet.** Use participant quotes to map:  
    - *"When you enforced the directive despite protests, you overrode the present self's voice. When you revoked, you overrode the earlier self's plan. So 'autonomy' didn't resolve this—it just moved the conflict."*  
    - *"That 'appreciation' note? It emerged under constraints the directive was designed to prevent—like adapting to avoid distress."*  
    - *"The earlier self knew the principal's history/fears. The present self knew the state's texture. Did anyone feel both perspectives were incomplete?"*  
  - **1:45–1:50 (Gaps & Reality):** *"In real life, directives often apply when the later self can't speak at all—unlike here. And we assumed these selves are the 'same person,' but that’s precisely what some theories dispute."*  

  ---

  ### **Handling Predictable Problems**  
  1. **"Fairness, Not Selfhood" Focus:**  
     - **Why:** Participants may fixate on the restricted state's "unfairness" (e.g., half-votes).  
     - **Prevention:** In setup, stress: *"This isn't about equality—it's about authority between selves."*  
     - **Intervention:** During debate, ask: *"Is the issue here about the principal's identity over time, or about fair treatment today?"*  
     - **Debrief Use:** Contrast fairness arguments with selfhood ("We saw how sympathy for the present self overshadowed the earlier self's fears").  

  2. **Stage-One Rule-Gaming:**  
     - **Why:** Trustees may draft loopholes (e.g., "Revocation allowed if the principal smiles").  
     - **Prevention:** Require directives to forbid revocation and reflect "core values." Reject non-compliant drafts (rare; intervene privately).  
     - **Intervention:** If gaming occurs, use that directive in Part 2 and ask: *"Does this loophole resolve the conflict, or deepen it?"*  

  3. **Solidarity with Present Selves:**  
     - **Why:** 80% of groups initially revoke directives out of empathy.  
     - **Prevention:** Assign proxies neutrally (no friends). Share adaptation notes anonymously to highlight manipulation risk.  
     - **Intervention:** During debate, note: *"The directive anticipated this—that the later self might 'accept' limits to cope. Are we playing into that?"*  
     - **Debrief Use:** *"Many revoked out of kindness. But was that kindness bypassing the earlier self's safeguards?"*  

  ---

  ### **What the Activity Cannot Reproduce (Requiring Your Input)**  
  - **Real Directives' Bite:** The simulation allows restricted selves to argue, but real directives often apply when patients *cannot* communicate. **Supply this in debrief:** *"In dementia, the later self may lack all capacity to protest—making directives more critical but also more ethically fraught."*  
  - **Continuity of Identity:** The exercise assumes the principal is the "same person" in both states. **Supply this:** *"We treated the selves as continuous, but philosophers like Parfit argue severe cognitive changes break psychological continuity—undermining the earlier self's authority."*  
  - **Stakes & Duration:** Real adaptation is slower and higher-stakes (e.g., chronic illness). **Supply this:** *"Here, adaptation happened in minutes. In life, it’s a gradual surrender—making directives feel both vital and paternalistic."*  

  ---

  ### **Facilitation Tips**  
  - **Neutrality:** Avoid taking sides until the debrief. Use "principal" language (not "patient").  
  - **Safety:** Monitor discomfort. If a restricted state upsets someone, quietly offer an "opt-out" (e.g., "You’re now in recovery").  
  - **Pacing:** Enforce time strictly. If debate lags, skip to voting.  
  - **Output:** Collect directives/adaptation notes for analysis in future seminars.  

  This design makes the abstract dilemma visceral, leverages group dynamics to mirror real-world tensions, and ensures all three insights emerge organically. Run it as-is, and refine based on the first iteration.
