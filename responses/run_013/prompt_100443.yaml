prompt: |-
  I cover science and ideas for a magazine, so I end up sitting in on a lot of expert panels — hospital ethics committees, scientific advisory boards, that kind of thing — and I keep hitting a pattern I don't have a word for. Take a hospital ethics committee I shadowed last year. They had to settle four things: whether the patient had capacity, whether the patient was refusing treatment, whether that refusal was properly informed, and then whether to treat anyway. They voted on each one separately. Majority said the patient had capacity. Majority said the refusal was informed. Majority said that if someone has capacity and refuses treatment in an informed way, you don't treat them. And then a majority voted to treat. Nobody in the room batted an eye; I only saw it when I went back through the minutes. A different board did the opposite — put a single bottom-line question to the room and got an answer that none of their separate votes would have predicted, so the "same" body gave two different verdicts depending on how the question was put. When I ask people about this they either shrug and say its just Arrow's theorem or say the group was simply being inconsistent, and neither feels right: every member was perfectly consistent on their own, and voting issue-by-issue vs. voting on the conclusion doesn't look like one right way and one wrong way, more like two different things being asked.

  Start by brainstorming what might be going on before you commit to an answer. Then: is there a name for this? I don't want just the label — tell me what the phenomenon actually is, how it differs from Arrow-style results and from an ordinary Condorcet cycle and from a flat "the group was incoherent," which of the nearby concepts fits best, whether it makes a difference if you aggregate the sub-questions or only the final verdict, and where the edges of the thing are — cases that look like it but aren't. Answer as a philosopher who works on group decision-making and is good at telling near-neighbours apart.
reasoning: |-
  Hmm, the user is a science and ideas journalist who frequently observes expert panels like hospital ethics committees and scientific advisory boards. They've noticed a puzzling pattern where groups make decisions that seem inconsistent depending on whether they vote on sub-questions separately or on the final conclusion as a whole. 

  The user describes a specific case where an ethics committee voted consistently on each logical step (patient has capacity, refusal is informed, therefore shouldn't be treated) but then voted against their own logic to treat anyway. Another case showed the opposite pattern. 

  What's interesting is that the user has already done some homework - they've heard people dismiss this as Arrow's theorem or simple inconsistency, but they sense those explanations don't quite fit. They want a precise conceptual unpacking, not just a label. 

  Let me break this down. First, this isn't Arrow's theorem - that's about aggregating preferences, while here we're aggregating judgments on interconnected factual/logical propositions. It's also not a Condorcet paradox, which involves cyclical majorities in pairwise votes. 

  The heart seems to be the difference between premise-based and conclusion-based voting. When voting on premises separately, the group follows logical inference to a conclusion. When voting directly on the conclusion, they bypass that process. Both are valid aggregation methods but can yield different results because: 

  1) Logical omniscience problem: Groups aren't required to be logically consistent in their collective judgments
  2) Different information pooling: Conclusion-voting might incorporate unstated considerations
  3) The "doctrinal paradox" specifically captures this tension between aggregating premises vs. conclusions

  The user's hospital example is textbook doctrinal paradox. Each member was individually consistent, but the aggregation method changed the outcome. This differs from group incoherence because the inconsistency emerges from the voting system, not individual irrationality. 

  Important distinctions: 
  - This requires interconnected propositions with logical dependencies
  - It matters whether we aggregate premises or conclusion
  - Not the same as strategic voting (though that could compound it)

  Cases that look similar but aren't: 
  - Genuine preference reversals (e.g. framing effects)
  - Groups changing minds after deliberation
  - Simple majority cycles

  The user needs this for science journalism, so I should emphasize why this matters - it shows how institutional design shapes outcomes in ethics boards, policy committees etc. The takeaway isn't that groups are irrational, but that decision architectures create different kinds of collective rationality.
answer: |-
  What you're describing is a profound and underappreciated phenomenon in collective decision-making—one that exposes a fundamental tension in how groups reason through interconnected propositions. Let's dissect this systematically.

  ### Brainstorming Core Mechanisms:
  1. **Premise-Based vs. Conclusion-Based Aggregation**:  
     - Premise-based: Vote separately on premises (e.g., "capacity," "informed refusal"), then derive conclusion logically.  
     - Conclusion-based: Vote directly on the final verdict ("treat or not").  
     Both are procedurally valid, but they aggregate judgments differently.  

  2. **Logical Interdependence**:  
     The propositions form a logical chain:  
     - P1: Capacity exists  
     - P2: Refusal occurred  
     - P3: Refusal was informed  
     - C: ∴ Do not treat (if P1–P3 hold)  
     Yet the group isn't required to honor this logic when voting on C directly.  

  3. **Epistemic vs. Practical Rationality**:  
     Individuals may vote "treat" on C due to:  
     - Unstated qualifiers (e.g., "unless life-threatening")  
     - Moral intuition overriding logic  
     - Risk aversion not captured in premises  

  ---

  ### The Phenomenon: **Doctrinal Paradox** (or *Discursive Dilemma*)  
  **What it is**:  
  A situation where a group's aggregated judgment on interconnected propositions is logically inconsistent *depending on whether premises or conclusions are voted on first*. Crucially, **every individual member is fully consistent**—the inconsistency emerges *only* at the collective level.  

  **Key Features**:  
  - Requires a logical connection between premises and conclusion (e.g., medical ethics rules, legal doctrines).  
  - Arises from majority voting on each proposition independently.  
  - Demonstrates the *impossibility of simultaneous logical closure and majoritarian aggregation*.  

  ---

  ### Distinguishing from Near-Neighbors:  

  | Concept              | How It Differs                                   | Why Your Case Isn’t This               |  
  |----------------------|-------------------------------------------------|----------------------------------------|  
  | **Arrow’s Theorem**  | About ranking *preferences* (e.g., voting for candidates); assumes unrestricted domain. | Your case involves factual/logical *judgments* with constraints (medical ethics). |  
  | **Condorcet Cycle**  | Cyclical majorities in *pairwise preferences* (A>B, B>C, C>A). | No cycles here; the conflict is between *premise-conclusion coherence* vs. *direct verdict*. |  
  | **Group Incoherence**| Implies irrational individuals or chaotic deliberation. | Individuals are consistent; the flaw is in *aggregation design*, not reasoning. |  
  | **Buridan’s Ass**    | Deadlock between equally valid options.         | No deadlock; both paths are valid but yield different outcomes. |  

  ---

  ### Why Aggregation Method Matters:  
  1. **Premise-Based Voting**:  
     - *Strengths*: Ensures logical consistency with shared rules.  
     - *Weaknesses*: May ignore holistic context (e.g., "patient will die tomorrow").  

  2. **Conclusion-Based Voting**:  
     - *Strengths*: Captures tacit knowledge/intuition.  
     - *Weaknesses*: Risks "logical incoherence" (violating the group’s own stated principles).  

  In your ethics committee:  
  - Premise-based outcome: "Don’t treat" (by logic).  
  - Conclusion-based outcome: "Treat" (by override).  
  **Neither is "wrong"**—they answer different questions. Premise-based asks, "What do our rules imply?" Conclusion-based asks, "What feels right *all things considered*?"  

  ---

  ### Edges and Boundary Cases:  
  **Genuine Instances**:  
  - Medical ethics panels (as described)  
  - Legal juries deciding guilt via elements of a crime  
  - Scientific panels assessing risk (e.g., "Is substance X toxic?" via hazard/exposure votes)  

  **Look-Alikes (But Different)**:  
  - **Strategic Voting**: Members misrepresent views to manipulate outcomes.  
    *Test*: If votes were secret, would individuals still be consistent?  
  - **Ambiguous Premises**: If "informed refusal" is poorly defined, the paradox may mask conceptual disagreement.  
  - **Deliberation Effects**: New information emerges *during* voting, altering judgments.  
  - **Preference Aggregation**: E.g., budgeting votes—no logical *necessity* between "Fund A" and "Fund B."  

  ---

  ### Philosophical Implications:  
  This reveals a **metaproblem of institutional design**:  
  > *Groups cannot simultaneously satisfy:*  
  > (1) *Majority rule on every proposition*  
  > (2) *Collective logical consistency*  
  > (3) *Respect for all individual judgments*  

  Your panels face a **tragic choice**: Prioritize procedural rationality (premise-based) or pragmatic wisdom (conclusion-based). Neither resolves Arrow-style impossibilities; they merely shift the locus of inconsistency.  

  ### Why This Matters for You:  
  As a science journalist, frame this as a **hidden architecture of power**. The choice to vote on premises vs. conclusion determines outcomes more than debate—e.g., a climate panel voting on "CO2 rise" + "causal link" + "severity" separately might reject action, even if a direct "act now" vote passes. The paradox is **why committee procedures need scrutiny**, not just their conclusions.  

  Would you like historical cases (e.g., FDA panels) or strategies committees use to mitigate this?
