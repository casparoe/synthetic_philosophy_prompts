prompt: |-
  I belong to a small reading group that works through philosophy-of-AI material, and we have spent the last several sessions on a proposal I want to pin down before we argue about it any further. The proposal, usually referred to as HCH, is offered as a specification of what it would mean for a system to do the right thing: not whatever a human happens to say, but the verdict a human would reach given unlimited time and cooperation, where any sub-question may be handed off to another human — or to a copy of the original human — and the sub-answers are then aggregated back into an answer to the original question. The companion idea, sometimes called factored cognition, is the hypothesis that this can actually be carried out, because a hard task admits of decomposition into subtasks that a single bounded human can check, so that the whole structure ultimately rests on steps that are individually verifiable. What draws us to it is that the target is neither raw human opinion nor some alien optimum; what frustrates us is that no one has said clearly what such a target would have to be in order to deserve that role.

  Our disagreements have begun to repeat themselves. One of us says the proposal is circular, because "what a human would say given unlimited time and cooperation" appears to be defined by the very process under discussion, so the account has no content until the process is fixed; another says the real load is borne by an unstated assumption that every sub-agent is honest, and that once you drop it the whole thing is manipulable; a third says that even if it works it may converge on something monstrous, and that a target we would not endorse on reflection cannot be what we should be aiming at; and a fourth observes that for some questions no bounded human can verify an answer at all, so the structure either has nothing to say or quietly smuggles in an oracle.

  So I would like the desiderata rather than a defense. Write the specification that a theory of idealized deliberation must satisfy to count as a legitimate account of what we should be aiming at: the cases it has to get right (the regress case, in which every sub-question spawns further sub-questions and the process must either bottom out or converge; the deception case, in which a sub-agent misreports; the convergence-to-something-we-reject case; and the case of a question whose answer no bounded human can actually check); the distinctions it must not collapse (between what the idealization converges on and what we would endorse on reflection; between what a bounded human can verify and what a bounded human can compute; and between the idealization being well-defined and its being reachable); and the results it must be consistent with (that human beings are bounded, biased, and unreliable, and that no physical process enjoys unlimited time or energy). Behind each requirement, give the case or consideration that motivates it, and mark which requirements you regard as non-negotiable and which as the commitments of one camp rather than another. I am most interested in the part where you identify a pair or a subset of these requirements that cannot be jointly satisfied — if the list comes out consistent, I will assume we have not sharpened it enough — and in your judgment about which single requirement does the most work in ruling out the proposals people actually make. Leave the scorecard aside; we will fill that in ourselves.
reasoning: |-
  Okay, the user is part of a philosophy-of-AI reading group grappling with the HCH (Humans Consulting HCH) proposal and factored cognition. They've hit recurring disagreements and want desiderata for an idealized deliberation theory rather than a defense. Let me unpack this carefully.

  First, the core tension: HCH promises a "gold standard" for AI alignment by simulating unbounded human deliberation through task decomposition. But the group sees cracks in this foundation - circular definitions, vulnerability to deception, potential convergence to unethical outcomes, and unsolvable problems. 

  The user's request is surgical: they don't want me to fix HCH or take sides. They want the criteria any such theory must satisfy, motivated by concrete failure modes. Specifically, they highlight four test cases (regress, deception, unacceptable convergence, unverifiable questions) and three key distinctions (ideal vs endorsable, verifiable vs computable, defined vs reachable). 

  Hmm... the challenge is structuring this neutrally while exposing inherent tensions. The group already senses contradictions - that's why they want desiderata that might conflict. I should start by mapping the landscape:

  The regress case attacks the foundation: if sub-questions spawn infinitely, how does it bottom out? This demands a well-defined termination condition (Desideratum 1). But their fourth member points out some questions can't be verified by bounded humans at all (Desideratum 4 - no oracles allowed). These two might conflict if termination requires "simple" answers humans can always verify. 

  Then there's the deception problem (Desideratum 2). Honest sub-agents are assumed, but humans aren't reliably truthful under incentive pressure. If we relax this, the whole structure becomes manipulable. Yet demanding perfect honesty feels unrealistic - humans are biased (Desideratum 8). 

  The convergence worry is thorniest (Desideratum 3). If HCH converges to something we'd reject (like paperclip maximization), can it really be our "ideal"? This forces a distinction between procedural and reflective rationality (Desideratum 5). But maintaining that distinction might undermine HCH's claim to be normative. 

  Underpinning everything is the physical impossibility of infinite deliberation (Desideratum 9). Yet the theory must accommodate boundedness (Desideratum 7) without collapsing into what humans currently think (Desideratum 6). 

  The biggest tension I see is between Desideratum 3 (convergence to endorsable outcomes) and Desideratum 4 (no oracles). If a question's answer requires cognitive abilities beyond humans (e.g., complex math proofs), HCH either fails to answer (violating well-definedness) or secretly upgrades humans - both unacceptable. This isn't fixable by better decomposition; it's a hard limit. 

  And the heaviest desideratum? Likely Desideratum 5 - distinguishing the idealization's output from what we'd endorse. Most HCH defenses quietly assume these align, but history shows rational processes can yield atrocities. Maintaining this distinction torpedoes any "it's ideal by definition" dodge. 

  The user's group is sharp - they'll spot if I soften edges. Need to present conflicts raw: regress vs no-oracles, honesty vs boundedness, convergence vs endorsability. The physical constraints (Desideratum 9) make all this moot in practice, but the theory must still hold up conceptually. 

  ...Time to structure this as neutral axioms with motivations. No hedging - their frustration is precisely with unexamined assumptions. Flag which criteria are near-universal (no oracles, physical realism) vs contested (must convergence = endorsable?). The deception case will split people: game theorists might accept manipulation risks, ethicists won't. 

  Most importantly, highlight that Desideratum 4 and Desideratum 1 conflict when sub-questions hit human verification limits. That's where factored cognition might fundamentally break - and why their fourth member's oracle concern bites deep.
answer: |-
  Below is a structured set of desiderata for a theory of idealized deliberation (e.g., HCH), motivated by your group's core disagreements and test cases. I focus on necessary conditions, tensions between them, and the considerations forcing these requirements. Desiderata are grouped by **function** (what the theory must handle), **distinctions** (what it must preserve), and **constraints** (what it must respect). Each includes its motivation ("**M**") and negotiability status.  

  ---

  ### **I. Function: Cases the Theory Must Resolve**  
  1. **The Regress Case**  
     - *Requirement*: The process must define a clear **termination condition** for sub-question recursion (e.g., bottoming out at atomic judgments or converging asymptotically).  
     - **M**: Infinite regress voids the idealization (no answer is ever produced).  
     - *Status*: **Non-negotiable**. Without this, the specification is incoherent.  

  2. **The Deception Case**  
     - *Requirement*: The theory must either **guarantee sub-agent honesty** or **function robustly** under strategic misreporting (e.g., via consistency checks or incentive alignment).  
     - **M**: Unchecked deception corrupts aggregation (e.g., a sub-cohort hijacks the output).  
     - *Status*: **Negotiable** (solutions divide camps). Pro-HCH views often assume honesty; critics demand robustness.  

  3. **The Unacceptable Convergence Case**  
     - *Requirement*: The idealization must **distinguish "correct" from "endorsable" convergence**. It cannot define correctness *solely* by the process's output.  
     - **M**: Convergence on repugnant conclusions (e.g., "torture is optimal") reveals a flaw in the target.  
     - *Status*: **Non-negotiable** for critics; contested by proceduralists.  

  4. **The Unverifiable Question Case**  
     - *Requirement*: The theory must **reject oracle-models**. If no bounded human can verify a sub-answer even ideally, the process must fail or abstain—not presuppose omniscience.  
     - **M**: Smuggling in uncheckable answers (e.g., P=NP) voids the "factored cognition" hypothesis.  
     - *Status*: **Non-negotiable** for realism.  

  ---

  ### **II. Distinctions the Theory Must Preserve**  
  5. **Ideal Convergence vs. Reflective Endorsement**  
     - *Requirement*: The theory must **avoid defining the "right answer" as "whatever HCH outputs"**. It needs independent grounds to claim HCH converges on truth/ethics.  
     - **M**: Otherwise, the account is circular ("correct because HCH says so").  
     - *Status*: **Non-negotiable** (motivates your group’s frustration).  

  6. **Verifiable vs. Computable**  
     - *Requirement*: It must **acknowledge tasks humans can *verify* but not *compute*** (e.g., checking a proof vs. generating one). Factored cognition relies on verification, not computation.  
     - **M**: Factored cognition collapses if verification requires unbounded computation.  
     - *Status*: **Non-negotiable** for HCH’s viability.  

  7. **Defined vs. Reachable**  
     - *Requirement*: The idealization must **remain meaningful even if unreachable in practice**. Its value is normative, not procedural.  
     - **M**: Human boundedness precludes physical instantiation; the target must still guide action.  
     - *Status*: **Negotiable**. Critics see this as evasion; proponents see it as necessary for ideals.  

  ---

  ### **III. Constraints the Theory Must Respect**  
  8. **Human Boundedness**  
     - *Requirement*: The theory must **presuppose no superhuman cognitive powers** in sub-agents (e.g., no solving NP-hard problems in polynomial time).  
     - **M**: Humans are computationally bounded; idealization cannot erase this.  
     - *Status*: **Non-negotiable**.  

  9. **Physical Realism**  
     - *Requirement*: The idealization must **not rely on physically impossible resources** (infinite time/energy). It must be approximatable finitely.  
     - **M**: Physics constrains all processes; unbounded resources are incoherent.  
     - *Status*: **Non-negotiable** (but often handwaved in practice).  

  ---

  ### **Key Tensions and Conflicts**  
  - **Desideratum 4 (No Oracles) vs. Desideratum 1 (Termination)**:  
    For questions requiring superhuman verification (e.g., "Is this cryptographic hash breakable?"), the process cannot terminate without oracles (*violates 4*) or never answers (*violates 1*). **This tension breaks factored cognition for unverifiable problems.**  

  - **Desideratum 2 (Robustness to Deception) vs. Desideratum 8 (Human Boundedness)**:  
    Guaranteeing honesty under unlimited recursion may require superhuman coordination (e.g., Byzantine agreement with unboundedly many agents). If humans *can’t* do this robustly, HCH is either corruptible (*violates 2*) or assumes superhumans (*violates 8*).  

  - **Desideratum 3 (Endorsable Convergence) vs. Desideratum 5 (Avoid Circularity)**:  
    If HCH converges to something unendorsable, but "correctness" is defined by HCH, the theory is circular (*violates 5*). If correctness is independent, HCH may be unreliable (*violates 3*).  

  ---

  ### **Most Impactful Requirement**  
  **Desideratum 5 (Avoid Circularity)** does the heaviest lifting:  
  - It forces the theory to **ground HCH’s output externally** (e.g., in logic, ethics, or empirical truth), preventing proceduralism from devolving into "whatever the machine says."  
  - This requirement alone **invalidates naïve formulations of HCH** ("HCH is right by definition") and compels engagement with philosophy (e.g., meta-ethics, epistemology).  
  - It exposes why HCH alone cannot define "the right thing"—it needs a bridge to independent normative standards.  

  ---

  ### **Conclusion**  
  A viable theory must resolve the regress/deception/unverifiable cases while respecting human limits and avoiding circularity. The deepest tension is between **factored cognition’s promise (any task decomposes into human-verifiable steps)** and **the existence of problems humans cannot verify even ideally** (Desiderata 4 vs. 1). If your group accepts such problems exist (e.g., questions requiring exponential computation to verify), HCH cannot handle them without cheating—a fatal flaw for a universal specification. The circularity requirement (5) then ensures that even where HCH *does* work, it must earn its normative status independently.  

  This framework should let you systematically test proposals. If no tension arises, sharpen Desiderata 4 (unverifiable questions) or 3 (unendorsable convergence) with concrete examples that challenge decomposition.
