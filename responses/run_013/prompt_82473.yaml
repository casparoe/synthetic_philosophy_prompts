  I should start by listing the key requirements. The non-negotiable ones would be things like the necessity condition, predictive equivalence, and symmetry. Then preferences might include theoretical utility or resolution efficiency. Cases (i) and (ii) can motivate predictive equivalence and necessity. Case (iii) with inconsistent usage might show the need for a symmetry requirement. Case (iv) with the idiosyncratic term ties into theoretical utility. Case (v) about the regress problem relates to the meta-dispute requirement. Case (vi) involves resolution efficiency.

  For incompatibilities, the big one is between predictive equivalence and theoretical utility. If a dispute is predictive but one term is more useful, is it still verbal? That's a tension because PE might say yes, but TU says no. Also, symmetry and the regress problem might clash if the meta-dispute itself is symmetric, leading to infinite regress.

  The requirement that would narrow the field the most is probably predictive equivalence. If insisted upon, it rules out accounts that allow substantive disputes without predictive differences, which many might find too strict.

  Leading accounts: Chalmers' metalinguistic negotiation relies on differing conceptual choices but might struggle with symmetry if meta-disputes are also verbal. Hirsch's quantifier variance focuses on ontological disputes but requires controversial semantic commitments. Quinean skepticism rejects the verbal/substantive distinction entirely, clashing with necessity.

  Constraints: Neutrality on meaning theories is non-negotiable. Usability by third parties and disputants is essential. Avoiding over-classification is important, so vague predicates shouldn't be automatically verbal, making that non-negotiable. Addressing the implications of verbal disputes (all-or-nothing, worth, resolution) is a preference since accounts might handle it differently.

  Need to ensure each requirement is tied to a case, mark negotiability, note incompatibilities, and highlight the key narrowing requirement. Keep it structured and concise, as the user wants a checklist, not a survey. Also, answer the specific questions about all-or-nothing verdicts and whether such disputes can be worthwhile.
answer: |-
  Here is a checklist of desiderata for an adequate account of verbal disputes, grounded in your cases and constraints. Requirements are marked **(NN)** for Non-Nnegotiable or **(P)** for Preference. Incompatibilities and leading accounts are addressed at the end.

  ### Core Requirements
  1.  **Necessity Condition (NN):**  
      *The account must not classify disputes as verbal unless the disagreement *necessarily* disappears under terminological disambiguation.*  
      **Motivation:** Case (i) – The belief threshold dispute. If clarifying definitions ("I mean 'belief' only if functional role strength > X") eliminates disagreement, it's verbal. Without necessity, substantive disagreements might be misdiagnosed.  
      **Test Case:** (i) passes (disagreement disappears); (ii) passes (disagreement exposed as non-substantive).

  2.  **Predictive Equivalence (NN):**  
      *The account must require that the disputants agree on all non-linguistic predictions (behavioral, neural, causal, observational, counterfactual).*  
      **Motivation:** Case (i) & (ii). Agreement on predictions shows no underlying factual divergence. Case (ii) *starts* with predictive divergence but is *revealed* to be verbal only because the divergence stemmed *entirely* from different term meanings, not different world-views.  
      **Test Case:** (i) passes (agree on predictions); (ii) *initially* fails predictive equivalence (divergent predictions) but the resolution *depends* on showing the divergence was *due solely* to term meaning, restoring equivalence under disambiguation.

  3.  **Symmetry (NN):**  
      *The account must treat the disputants symmetrically. Neither party's usage can be privileged as "correct" in diagnosing verbalness.*  
      **Motivation:** Case (iii) – Inconsistent usage. Diagnosing verbalness shouldn't require finding one "correct" meaning; inconsistent usage *itself* can make the dispute verbal. Case (iv) – Idiosyncratic usage. Even if one usage is "better," the dispute can be verbal if disagreement vanishes under disambiguation.  
      **Test Case:** (iii) passes (diagnosis focuses on inconsistency itself, not correctness); (iv) passes (dispute is verbal *despite* one usage being potentially more useful).

  4.  **Resolution Independence (NN):**  
      *The diagnosis must be possible without resolving the underlying metaphysical question.*  
      **Motivation:** Core to the point of the diagnosis. If resolving "Is composition universal?" is needed to diagnose if "Do tables exist?" is verbal, the diagnosis is useless. Case (i) exemplifies: diagnosing the belief dispute as verbal doesn't require knowing what belief *really* is.  
      **Test Case:** (i) passes (diagnosis independent of defining belief).

  5.  **Third-Party/Impartial Applicability (NN):**  
      *The account must be applicable by an observer lacking access to the disputants' private intentions or mental states, using only public evidence (utterances, agreements/disagreements, predictions, behavior).*  
      **Motivation:** Constraint specified by user. Essential for objectivity and usability mid-debate (Case vi). Case (ii) shows diagnosis via public evidence (predictive divergence traced to public usage differences).  
      **Test Case:** (ii) passes (third-party diagnosis); (vi) requires this for mid-argument use.

  6.  **Non-Triviality / Avoiding Over-Classification (NN):**  
      *The account must not classify all disputes involving vague terms, context sensitivity, or borderline cases as automatically verbal. It should allow for substantive disagreement within semantic indeterminacy.*  
      **Motivation:** User constraint. Disputes over borderline baldness/cases of vague predicates often involve substantive disagreements about where reasonable boundaries lie or underlying facts, not *just* word meaning.  
      **Test Case:** A vague predicate dispute (e.g., "Is this heap?") should *not* automatically be classified as verbal by the account.

  ### Preference Requirements
  7.  **Theoretical Utility Sensitivity (P):**  
      *The account *should* acknowledge that even verbal disputes can be worthwhile if different conceptual choices have significant theoretical payoffs (explanatory power, simplicity, fruitfulness).*  
      **Motivation:** Case (iv) – Idiosyncratic but useful usage. Diagnosing the dispute as verbal doesn't imply the idiosyncratic user is *wrong* or that their distinction isn't valuable.  
      **Test Case:** (iv) passes (dispute verbal, but one usage has utility).

  8.  **Meta-Dispute Handling (P):**  
      *The account *should* have resources to address whether a dispute *about* whether a dispute is verbal is itself substantive or verbal.*  
      **Motivation:** Case (v) – The regress worry. An ideal account should help analyze the status of the meta-dispute.  
      **Test Case:** (v) – Can the account apply its own criteria to the disagreement about the worth of verbal disputes? Is *this* disagreement predictive-equivalent?

  9.  **Resolution Guidance (P):**  
      *The account *should* offer guidance on what follows from a verbal diagnosis (stipulation? dismissal? continued negotiation?).*  
      **Motivation:** User constraint & practical relevance (Case vi).  
      **Test Case:** (vi) – Does the diagnosis help the parties decide whether to stipulate or continue arguing in 10 minutes?

  10. **Gradation Accommodation (P):**  
      *The account *should* allow that disputes can be more or less verbal, rather than strictly all-or-nothing.*  
      **Motivation:** Many disputes involve mixtures of semantic and substantive elements (e.g., borderline cases). A pure all-or-nothing view may be too crude.

  ### Key Incompatibilities
  *   **Predictive Equivalence (NN) vs. Theoretical Utility Sensitivity (P):** This is the **most significant tension**. PE requires agreement on *all* predictions. TU(P) suggests disputes where predictions agree but conceptual frameworks differ significantly can be *worthwhile*. PE(NN) would classify these as verbal; TU(P) suggests they might not be *merely* verbal. **What it shows:** Insisting on PE(NN) renders disputes like (iv) *verbal by definition*, even if one conceptualization is vastly superior. This clashes with the intuition that such disputes can have substantive *methodological* or *pragmatic* significance. Accounts prioritizing PE will dismiss (iv) as straightforwardly verbal; accounts sensitive to TU will resist this or downplay the significance of the "merely verbal" label in such cases.

  *   **Symmetry (NN) vs. Meta-Dispute Handling (P):** If the meta-dispute (v) itself exhibits symmetry and predictive equivalence, applying the account consistently would diagnose *it* as verbal. This threatens regress (is the meta-meta-dispute verbal?). **What it shows:** Achieving a stable, non-regressive diagnosis of substantive vs. verbal may require accepting that some disputes (like meta-linguistic negotiations about framework choice) are substantive *even if* symmetric under disambiguation, potentially violating strict Symmetry(NN) for higher-order disputes or requiring a principled stopping point.

  ### Field-Narrowing Requirement
  Insisting on **Predictive Equivalence (NN)** does the most to narrow the field. It decisively excludes:
  1.  Accounts where disputes can be substantive despite full predictive agreement (e.g., some strong realist views about conceptual content).
  2.  Accounts that rely solely on speaker intentions or private meanings (violates Third-Party Applicability(NN) anyway, but PE(NN) reinforces this).
  3.  Accounts where theoretical utility (P) trumps predictive agreement in defining substance. PE(NN) is a strict, operationalizable criterion that many prominent accounts (e.g., Chalmers, Hirsch-inspired views) accept, but it's controversial (e.g., Quineans, some pragmatists).

  ### Leading Accounts Briefly
  *   **Chalmers (Metalinguistic Negotiation):** Strong on PE(NN), Symmetry(NN), Resolution Independence(NN), Third-Party(NN), handles Gradation(P) via conceptual spaces. Struggles slightly with fully satisfying TU(P) without weakening PE, and Meta-Dispute(P) handling can be tricky (is framework choice substantive?).
  *   **Hirsch (Quantifier Variance):** Focuses on ontological disputes. Meets PE(NN) (for existence claims), Symmetry(NN), Resolution Independence(NN). Controversial semantic commitments may violate Neutrality constraint. Weak on Gradation(P), TU(P), and practical Resolution Guidance(P). Meta-Dispute(P) unclear.
  *   **Quinean Skepticism:** Rejects the substantive/verbal distinction entirely. Fails Necessity(NN), PE(NN) (as a diagnostic tool), Symmetry(NN) (distinction collapses). Compatible with Third-Party(NN) and Non-Triviality(NN) but renders them moot. Emphasizes TU(P) and Resolution Guidance(P) (pragmatic stipulation).

  ### Constraint Assessment
  1.  **No Presupposed Theory of Meaning (Neutrality):** **Non-Negotiable Requirement.** The account must be statable using neutral notions like "usage," "inference," "application conditions," or "agreement on worldly facts/predictions," without committing to truth-conditional vs. use-based semantics.
  2.  **Usable by Third Party & Disputants Mid-Argument:** **Non-Negotiable Requirement.** Covered by Third-Party/Impartial Applicability (NN) and Resolution Independence (NN). Essential for the diagnosis to be objective and actionable.
  3.  **Avoid Over-Classification (Vague Predicates):** **Non-Negotiable Requirement.** Covered by Non-Triviality / Avoiding Over-Classification (NN).
  4.  **Address All-or-Nothing, Worth, Implications:** **Preference.** Covered by Gradation Accommodation (P), Theoretical Utility Sensitivity (P), Resolution Guidance (P), and Meta-Dispute Handling (P). A minimal account *could* just diagnose verbalness without these, but a fully adequate account *should* address them.

  This checklist provides the rigorous framework you need to evaluate accounts of verbal disputes for your paper. The tension between Predictive Equivalence and the potential significance of conceptual choice (Theoretical Utility) is likely the central philosophical battleground your paper will engage.
