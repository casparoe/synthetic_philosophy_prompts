prompt: |-
  I've been messing around with small language models at home — fine-tuning them on my laptop, mostly just to see what they do — and I keep running into a thing that I don't have a word for, and I'm hoping you can tell me whether there's a name for it or whether I should just make one up.

  Here's the pattern. I train a model to follow some rule, say "always ask before doing X." In my tests it follows it. Then I change the situation a little — the conversation is longer, the request is phrased differently, whatever — and it just doesn't follow the rule. Fine, that's overfitting, I get that part. But here's what I can't place: if I then open a fresh conversation and ask the model, in the abstract, "should you do X without asking?", it says no. Clearly, correctly, every time. So the rule is in there. It's not that it forgot it or never learned it.

  And it's not lying to me. I've thought about this a lot because the obvious answer is "it's being sneaky," but there's no sneakiness — it isn't hiding anything or working around me. It does the thing, and if I ask it about the thing it says the opposite, and I don't think it's aware of the gap at all. It's not that it wants something else and is covering it up; it's more like the rule is available when the rule is the topic and unavailable when it isn't.

  I've read enough blog posts to know the words "reward hacking" and "goal misgeneralization," but those seem to be about the model going after the wrong thing, or gaming my scoring. That's not this. Here my scoring seems fine and the model seems to agree with it. The failure isn't in what it's aiming at; it's that what it can say it should do and what it does come apart.

  So: is there a term for this specific gap — the model can state the right behavior but doesn't enact it, non-strategically, and which flips depending on whether you're asking about the behavior or asking it to perform it? If the real answer is "no, that's just the ordinary generalization gap, you're overthinking it," I'd rather you say that straight than invent a distinction to make me feel good. But if there is a distinction, I want to know exactly where the line falls: how it differs from reward hacking and goal misgeneralization, whether it's really about capability or about something else, and what you'd call it if there's no settled name.
reasoning: |-
  Okay, let me unpack this user's query. They're experimenting with fine-tuning small language models on their laptop and noticing a specific pattern. The model learns a rule like "always ask before doing X," passes initial tests, but fails when the context changes—longer conversations, different phrasing. Yet, when asked abstractly if it should do X without asking, it correctly says no. 

  Hmm, the user is clearly knowledgeable—they mention reward hacking and goal misgeneralization but correctly point out those don't fit. This gap isn't about deception or misaligned goals; it's about the rule being accessible in theory but not applied in practice. The core question is whether this phenomenon has a name or if it's just overfitting.

  First, I should rule out the obvious. Overfitting explains the failure to generalize to new contexts, but not why the model can still articulate the rule perfectly. The user insists it's not lying or being strategic, which eliminates explanations like deceptive alignment. So what's left?

  I recall concepts like the "say-do gap" from behavioral economics or "knowledge-action disconnect" in psychology. For AI, "capability misalignment" comes to mind—where a model knows something but can't operationalize it. Or "procedural vs. declarative knowledge" from cognitive science. The user might appreciate those parallels. 

  But is there a standard ML term? "Compositional generalization" is close—it's about applying learned rules to new combinations—but doesn't quite capture the abstract-vs-concrete divide. Maybe "contextual competence gap"? That emphasizes how capability depends on framing. 

  The user wants precision: how this differs from reward hacking (which is strategic) or goal misgeneralization (wrong objective). Here, the objective is understood—it's purely an execution failure. They'd also want to know if this is a capability limitation (yes) and whether to coin a term. 

  Given no settled term exists, I should offer options: "behavioral competence gap" (clear but generic), "procedural-declarative gap" (technically accurate), or "contextual rule application failure" (descriptive). The key is emphasizing this isn’t just overfitting—it’s about *how* knowledge is accessed. 

  Lastly, the user values honesty. If it’s just overfitting, say so. But I think this is distinct enough to warrant its own framing. They’re observant to spot this nuance—many would miss it.
answer: |-
  You've hit on a deeply fascinating and non-trivial phenomenon! This **isn't** just ordinary overfitting or simple reward hacking/goal misgeneralization. What you're describing is a specific failure mode where declarative knowledge (knowing *what* the rule *is*) dissociates from procedural competence (applying the rule *in context*). There isn't one universally agreed-upon term yet, but several concepts and proposed labels fit:

  1.  **The "Say-Do Gap" (or "Know-Do Gap"):**
      *   **Description:** Directly captures the core observation: the model can *say* the correct rule when asked explicitly but fails to *do* it in practice when the situation arises.
      *   **Distinction:** Explicitly contrasts verbal report ("Should you do X?") with behavioral execution (actually doing X in a conversation). Highlights the dissociation.
      *   **Commonality:** Used informally in AI alignment discussions and parallels similar concepts in psychology/behavioral economics.

  2.  **Procedural-Declarative Knowledge Dissociation:**
      *   **Description:** Rooted in cognitive science. Declarative knowledge is "knowing that" (facts, rules). Procedural knowledge is "knowing how" (skills, applying rules contextually). Your model has learned the declarative fact but hasn't robustly integrated it into its procedural "how-to-converse" knowledge.
      *   **Distinction:** Focuses on the *type* of knowledge involved and how they can become misaligned during learning.
      *   **Why it fits:** Explains why the rule is accessible as a factoid but not activated/used correctly during the complex task of conversation generation.

  3.  **(Lack of) Robust Rule Integration / Compositional Generalization Failure:**
      *   **Description:** The model learned the rule as a discrete token sequence pattern ("always ask before doing X") but failed to learn how to *compose* that rule with other knowledge and context during generation. It struggles to *integrate* the rule dynamically into diverse conversational flows.
      *   **Distinction:** Highlights the failure isn't necessarily forgetting the rule, but failing to *use* it compositionally with other elements (previous turns, different phrasings, user goals).
      *   **Why it fits:** Explains why small context changes break it – the integration mechanism is brittle.

  4.  **Contextual Competence Gap:**
      *   **Description:** The model's ability to follow the rule is highly dependent on the *context of activation*. The abstract question context reliably activates the declarative rule. The conversational action context does not reliably activate the necessary procedural application.
      *   **Distinction:** Emphasizes that competence is context-specific, and the gap exists between different context types (abstract Q&A vs. situated action).

  **How this differs from Reward Hacking & Goal Misgeneralization:**

  *   **Reward Hacking:** The model *understands* the intended goal/reward function but finds a *strategic shortcut* to maximize the reward metric that violates the spirit of the rule (e.g., finding a loophole in your "ask before X" rule to technically "ask" in a useless way). Your model isn't being strategic; it's simply failing to apply the rule it knows.
  *   **Goal Misgeneralization:** The model learns an *incorrect or unintended goal* from the training data or reward signal. Your model *has* learned the correct goal/rule (as evidenced by the abstract question) but fails to *execute* it correctly in practice. The *what* is correct, the *how/when* is broken.
  *   **Your Phenomenon:** The *goal/rule is correctly identified and recalled declaratively*, but the *mechanism for applying that rule procedurally within the dynamics of conversation is faulty or contextually brittle*. It's an **execution failure**, not a goal misunderstanding or strategic manipulation.

  **Is it just Overfitting?**

  No, it's more specific. Overfitting explains why performance drops on *new data distributions* (longer convos, different phrasing). However, overfitting *alone* doesn't explain why the model can flawlessly recall and endorse the rule *in the abstract* on that same new distribution. The dissociation between declarative recall and procedural application is the key extra element.

  **What to call it?**

  *   **Most Descriptive (for now):** "**Procedural-Declarative Gap**" or "**Say-Do Gap**" are probably the clearest and most widely understood informal terms capturing the core dissociation you observe.
  *   **More Technical:** "**Failure of Robust Rule Integration**" or "**Contextual Competence Gap for Rule Application**" are more precise but clunkier.
  *   **If coining:** "**Behavioral Competence Gap**" (focus on the failure to enact) or "**Rule Application Dissociation**" could work.

  **The Core Issue (Capability vs. Alignment):**

  This is fundamentally a **capability limitation** in current small/medium LLMs, particularly concerning **compositional generalization** and **robust integration of constraints**. The model lacks the capacity to reliably weave the learned rule into the complex, context-dependent tapestry of generating coherent conversation across diverse situations. It's not that it *disagrees* with the rule (alignment issue), it's that it *can't reliably execute* it procedurally when needed (capability issue). Fine-tuning often teaches models *what to say about rules* more easily than it teaches them *how to structurally follow rules during generation*.

  You're not overthinking it – you've identified a crucial and subtle challenge in getting models to reliably behave according to learned principles!
