answer: |-
  ### The Question (150 words)  
  Consider the following case: A woman has cared for her brother since a traumatic brain injury radically altered his personality, making him frequently cruel. Initially, she resented his behavior. Over years, however, she finds she can no longer feel resentment toward him, describing him instead as "a machine that sometimes says hurtful things." She is troubled by this loss and has tried repeatedly—but unsuccessfully—to deliberately regain her resentment. Crucially, she insists she still holds him responsible and continues to expect better conduct from him.  

  **Your Task:** Analyze this case through P.F. Strawson’s framework of reactive attitudes. Is her psychological condition intelligible on Strawson’s account? Is her claim of "responsibility-without-resentment" coherent? Finally, what does her inability to *choose* her attitude imply about whether our responsibility practices are voluntary? Defend your interpretation with close attention to Strawson’s arguments.  

  ---

  ### Model Answer (700 words)  
  Strawson’s "Freedom and Resentment" argues that moral responsibility is grounded not in metaphysics but in the inescapable human practice of reactive attitudes—emotions like resentment, gratitude, and indignation that respond to others’ attitudes toward us. The participant attitude, where we view others as responsible agents, is our default mode of engagement. The objective attitude, in contrast, treats others as objects to be managed or fixed, suspending ordinary interpersonal expectations. While Strawson acknowledges we can *sometimes* adopt the objective stance deliberately (e.g., with children or the mentally ill), the caregiver’s case exposes a deeper tension: the *involuntariness* of attitude shifts and its implications for responsibility.  

  **First, the case is intelligible within Strawson’s framework, but reveals its complexity.** Strawson notes that reactive attitudes can be "naturally inhibited" by circumstances, like recognizing a person’s profound impairment. The brother’s brain injury provides such a cause: repeated cruelty coupled with knowledge of his condition rationally undermines resentment. Crucially, Strawson describes this shift as something that *happens* to us, not something we *do*. The woman’s failed attempts to "recover" resentment confirm this: we cannot conjure reactive attitudes at will. They arise—or dissolve—based on our perception of others’ capacities and intentions. Her machine-like perception of him is thus a psychologically plausible, if pathological, extension of the objective attitude.  

  **However, her insistence on "responsibility-without-resentment" presents a challenge.** For Strawson, holding someone responsible *is* the disposition to experience reactive attitudes like resentment when expectations are violated. If resentment is fully extinguished, can responsibility persist? Here, the woman’s *continuing expectation* ("I still expect better of him") is key. Strawson separates the *expectation* (a cognitive judgment about standards) from the *reactive attitude* (the emotional response to breaches). Her retention of expectations suggests a fractured participant stance: she cognitively affirms his agency (hence "holding responsible") but lacks the emotional correlate (resentment). This is coherent but unstable. Strawson might see it as an "attenuated" form of responsibility, where the expectation lingers emotionally neutered, sustained by habit or moral commitment rather than spontaneous feeling. Her disturbance at this loss signals that she recognizes the normative gap: full responsibility requires the possibility of the reactive response.  

  **This directly implicates the "switching problem" and the voluntariness of responsibility practices.** The woman cannot revert to resentment by choice, illustrating Strawson’s core point: reactive attitudes are not voluntary practices but natural, psychologically ingrained reactions to our social environment. We "find ourselves" in these attitudes. If adopting the objective or participant stance isn’t fully subject to will, then our responsibility practices cannot be understood as something we collectively "opt into" or suspend rationally. They are part of our natural history as social beings. The caregiver’s case shows that even when we *wish* to participate fully (as she tries to resent), we may be *compelled* toward objectivity by overwhelming psychological forces (trauma, exhaustion, perceived incapacity in the other).  

  **Verdict:** Her condition is intelligible but reveals a limit-case for Strawson. Responsibility-without-resentment is *coherent* as an attenuated, cognitive vestige of the participant stance, but it is *incomplete* and existentially fraught—lacking the emotional fabric Strawson deems essential to full moral engagement. Crucially, her inability to switch attitudes at will undermines any voluntarist interpretation of responsibility. Strawson’s framework suggests our practices are not chosen; they are expressions of our nature, which we can modify only marginally in response to causes (like trauma or reflection), never by fiat. The "switching problem" thus confirms Strawson’s anti-voluntarist thesis: we are *subject* to our reactive attitudes, not their sovereign authors.  

  ---

  ### Marking Scheme (5 points, 20 marks total)  

  1.  **Identifies Strawson’s core project: Shifting justification of responsibility to the inescapability of reactive attitudes.** (4 marks)  
      *Error: Summarizing the objective/participant distinction without linking it to the grounding of responsibility.*  

  2.  **Explains the non-voluntary nature of attitude shifts: Uses the case to show attitudes are responses to causes, not acts of will.** (4 marks)  
      *Error: Claiming the objective attitude is always chosen or that resentment can be summoned deliberately.*  

  3.  **Resolves responsibility-without-resentment tension: Distinguishes cognitive expectation from emotional response, acknowledging attenuated responsibility.** (5 marks)  
      *Error: Insisting resentment is strictly necessary for responsibility or dismissing her claim as incoherent without analysis.*  

  4.  **Addresses the "switching problem": Explicitly links involuntary attitude shift to the (non-)voluntariness of responsibility practices.** (4 marks)  
      *Error: Discussing voluntariness abstractly without connecting it to the case’s core difficulty (inability to switch back).*  

  5.  **Original Analysis: Uses the specific case details (disturbance, failed attempts, machine analogy) to deepen the argument.** (3 marks)  
      *Error: Treating the case as a generic example of objectivity; failing to engage its unique features.*  

  **A vs. B Differentiation:** An **A** answer (16-20 marks) successfully integrates all five points into a fluent, philosophically nuanced argument. It recognizes the case as a *challenge* revealing tensions in Strawson (attenuation, instability of stance) and decisively uses the switching problem to defend Strawson’s anti-voluntarism. A **B** answer (12-15 marks) hits most key points but lacks this synthesis: it may list intelligibility, coherence, and involuntariness separately without showing how they interconnect to answer the core problem, or it may offer a less developed account of attenuated responsibility.
