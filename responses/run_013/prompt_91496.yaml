answer: |-
  Here is a structured specification of desiderata for a theory of pure time preference (PTP), organized as requested, with conflicts highlighted and the most constraining requirement identified.

  ---

  ### **I. Cases the Theory Must Get Right**
  *(Non-negotiable: Failure here invalidates the theory's core purpose)*

  1.  **Pure Delay**:  
      *   **Case**: Identical goods, identical recipients (same individuals), zero risk, identical opportunity cost, differing only in delivery date (e.g., 1 apple to Alice today vs. 1 apple to Alice in 10 years).  
      *   **Requirement**: The theory must state whether the later delivery is valued less *solely due to its futurity*. It must justify this judgment (e.g., impatience, ethical principle) or its absence (e.g., temporal neutrality).  
      *   **Motivation**: Isolates the pure temporal component by eliminating all confounding factors.

  2.  **Non-Growing Good**:  
      *   **Case**: A fixed, irreplaceable stock (e.g., a unique artwork, a non-replicable mineral) deliverable now or later.  
      *   **Requirement**: The theory must generate a discount (or not) for the future delivery *without appealing to growth potential or opportunity cost*.  
      *   **Motivation**: Forces reliance on pure time preference alone, as growth-based discounting is logically excluded.

  3.  **Guaranteed-Richer Recipients**:  
      *   **Case**: Future recipients are certain to be wealthier (higher consumption/utility) than present ones (e.g., bequeathing a fixed sum to a wealthier future generation).  
      *   **Requirement**: The theory must distinguish the discount arising *purely from time* from the discount arising from Diminishing Marginal Utility (DMU) of consumption across richer recipients. It must isolate the PTP component.  
      *   **Motivation**: Prevents conflation of PTP with the ethically distinct justification based on inequality aversion.

  4.  **Empty Future**:  
      *   **Case**: A potential future benefit may never be received because the intended recipients might not exist (e.g., due to extinction risk).  
      *   **Requirement**: The theory must classify the discount applied due to this possibility. Is it PTP (discount for futurity per se) or a distinct discount type (e.g., probabilistic survival discount)?  
      *   **Motivation**: Tests the boundary of "pure time preference" versus discounting due to nonexistence/risk. Requires conceptual clarity.

  5.  **Horizon Stability**:  
      *   **Case**: Valuation of an identical benefit delivered at 100 years vs. 1 million years vs. 1 billion years.  
      *   **Requirement**: The theory must provide a stable, non-arbitrary method for valuation across vastly different time horizons. It must either yield convergent present values under extension or justify why divergence is acceptable.  
      *   **Motivation**: Ensures practical applicability and avoids absurdities (e.g., valuing the near-future astronomically higher than the far-future solely due to functional form).

  ---

  ### **II. Distinctions the Theory Must Not Collapse**
  *(Non-negotiable: Collapsing these distinctions obscures the phenomenon)*

  1.  **Pure vs. Derivative Discounting**:  
      *   **Requirement**: Must rigorously separate discounting due *only to futurity* (PTP) from discounting derived from:  
          *   Expected economic growth & DMU (`η*g`)
          *   Risk (known probabilities)
          *   Uncertainty (unknown probabilities/ambiguity)
          *   Opportunity cost (forgone alternative investments).
      *   **Motivation**: PTP is definitionally distinct from these other reasons for valuing present goods more highly.

  2.  **Intrapersonal vs. Intergenerational Discounting**:  
      *   **Requirement**: Must distinguish discounting *one's own future utility* (within a lifetime) from discounting *utility across different generations* who never coexist.  
      *   **Motivation**: Ethical justifications (e.g., impatience vs. obligations to the unborn) and empirical bases likely differ fundamentally.

  3.  **Pure Rate (δ) vs. Social Discount Rate (SDR)**:  
      *   **Requirement**: Must clearly differentiate the pure time preference *component* (`δ`) from the overall social discount rate (`r ≈ δ + η*g` + risk premia), which aggregates multiple factors.  
      *   **Motivation**: Policy relevance requires isolating the ethically contentious δ from the potentially more consensual growth/risk components.

  4.  **Discounting Utility vs. Discounting Consumption**:  
      *   **Requirement**: Must specify whether time discounting applies directly to *utility flows* (`U(c_t)`) or to *consumption units* (`c_t`), or both.  
      *   **Motivation**: These imply different ethical stances (e.g., is the *experience* of utility less valuable later, or just the physical good?).

  5.  **Rate Applied to Flow vs. Compounding Horizon**:  
      *   **Requirement**: Must clarify the relationship between the *instantaneous discount rate* applied to a future flow and the *integrated discount factor* applied over a long horizon.  
      *   **Motivation**: Prevents confusion between the rate parameter and its mathematical effect over time (e.g., constant rate ≠ constant discount factor).

  ---

  ### **III. Formal Results the Theory Must Be Consistent With**
  *(Non-negotiable: Inconsistency implies logical/mathematical incoherence)*

  1.  **Vanishing Present Value (PV)**:  
      *   **Result**: If the *pure time preference rate* is constant and positive (`δ > 0`), the present value of *any fixed future benefit* (utility or consumption) approaches *zero* as the time horizon (`T`) approaches infinity (`lim_{T→∞} e^{-δT} * Benefit = 0`).  
      *   **Requirement**: The theory must be compatible with this mathematical truth if it posits δ > 0.  
      *   **Motivation**: Basic consequence of exponential discounting with a positive constant rate.

  2.  **Exponential Consistency**:  
      *   **Result**: A *constant* pure time preference rate (`δ`) implies *exponential discounting* (`e^{-δt}`), which satisfies *time consistency* (preferences between two future dates don't change as the present moment advances). A *declining* discount rate (`δ(t)` decreasing in `t`) implies *time inconsistency*.  
      *   **Requirement**: The theory must either generate constant `δ` (ensuring time consistency) or explicitly justify and model declining `δ(t)` (acknowledging time inconsistency).  
      *   **Motivation**: Links the functional form of discounting directly to the constancy of the pure rate and the behavioral/ethical property of time consistency.

  3.  **Multiplicative Composition**:  
      *   **Result**: When combining pure time preference (`δ`) with growth-based discounting via DMU (`η*g`), the *total discount factor* is multiplicative: `e^{-(δ + η*g)t}`, not additive in the discount *factors*.  
      *   **Requirement**: The theory must represent the interaction of pure and growth-based discounting multiplicatively in the *discount factor*.  
      *   **Motivation**: Reflects the mathematical reality that distinct discounting reasons compound their effects multiplicatively over time.

  ---

  ### **IV. Conflicts Between Requirements**

  1.  **Horizon Stability vs. Vanishing PV & Constant Positive δ:**  
      *   **Conflict**: Horizon Stability demands a valuation method that doesn't render astronomically distant benefits irrelevant (`PV → 0`). However, a constant positive pure rate (`δ > 0`) mathematically guarantees `PV → 0` for large `T` (Vanishing PV). Satisfying Horizon Stability while maintaining a constant positive δ is impossible.
      *   **Resolution Requires**: Either:
          *   **δ = 0**: Pure temporal neutrality avoids PV → 0.
          *   **Declining δ(t)**: A rate decreasing asymptotically to zero can avoid PV → 0 for finite benefits (e.g., hyperbolic-like forms), but violates Exponential Consistency (time inconsistency).
      *   **Argument**: This is the core tension in long-term discounting. A constant positive δ is simple and time-consistent but ethically/practically problematic for the far future. δ=0 or declining δ avoids devaluing the far future but introduces complexity (δ=0 ignores potential impatience, declining δ causes time inconsistency).

  2.  **Pure Delay (Potential δ>0) vs. Guaranteed-Richer Recipients (DMU) vs. Horizon Stability:**  
      *   **Conflict**: Justifying a positive δ based on pure impatience (Pure Delay) might seem plausible within a lifetime (Intrapersonal). Applying this same δ to intergenerational contexts (especially with Guaranteed-Richer Recipients) can compound discounting (via DMU already favoring the present) and exacerbate the Horizon Stability/Vanishing PV problem. A δ>0 sufficient to reflect perceived intrapersonal impatience may be ethically indefensible and mathematically catastrophic when applied intergenerationally over long horizons.
      *   **Resolution Requires**: Explicitly different rates or justifications for intrapersonal vs. intergenerational discounting, or δ=0 for intergenerational contexts.

  ---

  ### **V. The Most Constraining Requirement**

  *   **Requirement**: **Horizon Stability**
  *   **What it Rules Out**:
      1.  **Unqualified Constant Positive δ**: Any theory proposing a constant `δ > 0` for intergenerational discounting is ruled out, as it inevitably drives the PV of far-future benefits to zero, violating Horizon Stability for any finite benefit. This rules out the simple Ramsey Rule (`r = δ + ηg`) with `δ > 0` as the sole approach for very long horizons.
      2.  **Naive Application of Intrapersonal Rates**: Applying discount rates calibrated to observed individual impatience (e.g., market interest rates over short terms) directly to intergenerational problems over centuries/millennia.
  *   **Why it's Most Constraining**: Horizon Stability forces the theory to confront the practical and ethical implications of discounting over geological/evolutionary timescales, where most popular positions (relying on constant δ>0 calibrated to short-term behavior) catastrophically fail. It mandates either δ=0, a carefully justified declining schedule δ(t), or a non-discounted approach (e.g., sustainability constraints, lexical thresholds) for the far future. It is the requirement that most directly challenges standard economic practice in long-term policy evaluation (e.g., climate change, nuclear waste).

  ---
  This specification provides the rigorous foundation needed to evaluate competing theories of pure time preference before engaging in the debate over specific rates. The identified conflicts, particularly Horizon Stability vs. Constant Positive δ, highlight the fundamental trade-offs at the heart of intergenerational ethics.
