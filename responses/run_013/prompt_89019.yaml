  They already know it's not the "magic circle" concept from game studies, which is about boundaries being fuzzy, not strategically redrawn. It's also not plain inconsistency since different parties or contexts are involved. So, I need to dig deeper into philosophy to see if any existing concepts fit.

  I'm thinking of David Lewis's counterparts or possible worlds, but that's more about modal realism. John Searle's institutional facts come closer—things like money that exist by collective agreement. But in the user's examples, the agreement shifts based on stakes, which Searle doesn't address directly. 

  Then there might be concepts like "ontic dumping" from science studies, where entities are treated as real or not based on utility. Or legal concepts like "forum shopping," but that's procedural, not ontological. Neither fits perfectly. 

  The core issue is the assignment of reality status being instrumental—determined by what's at stake rather than inherent properties. For example, a virtual item is "real property" when the studio wants to sue but "just data" when a player complains. This seems like a gap in existing terminology. 

  The user also asks about boundaries: if the same party holds conflicting views simultaneously (like a platform banning for harassment but denying liability), or if the asymmetry harms the claimant (e.g., downplaying a virtual loss). They want to know if there's an innocent version where ontology adapts without bad faith. 

  Considering coining a term, something like "instrumental ontology" or "stakes-sensitive ontology" might work. But "instrumental ontology" captures the idea that reality is a tool for achieving outcomes. It emphasizes the pragmatic shifting without implying dishonesty. 

  Defining it: the reality status is assigned based on the practical consequences of the assignment. Boundaries: it applies when the same entity or different parties benefit from conflicting statuses. It can harm claimants too, and there might be neutral cases where ontology evolves with practice. It extends beyond harms to virtual objects themselves. 

  This isn't just about virtual worlds; it could apply elsewhere, like corporations being "persons" for rights but not duties. The user's focus is on virtual contexts, but the concept has broader implications. 

  The user needs a precise definition to anchor their thesis. They're not looking for a reading list but a conceptual handle to dive into literature. By framing it as "instrumental ontology," they can explore connections to pragmatism, social ontology, and legal theory. 

