answer: |-
  Right, I know exactly the pattern you're circling—it's maddeningly pervasive and conceptually slippery. It feels like the ontological equivalent of having your cake and eating it too, but systematically and often without conscious deceit. I haven't encountered a single, widely accepted term that precisely captures *this specific dynamic* you're describing, though it brushes against several established ideas. Let me unpack why existing concepts fall short and propose a coinage with defined boundaries.

  The closest existing frame is arguably **"pragmatic ontology"** or **"contextual ontology"** within social ontology and philosophy of technology. Think Searle's institutional facts – the reality of money or marriage depends on collective recognition within a context. What your examples highlight, however, is *not just* that virtual reality is socially constructed or context-dependent (which is widely acknowledged), but that **the *assignment* of reality status within a *single* broad context (like the virtual world or its surrounding social/legal sphere) is strategically *instrumentalized*.** The "Is it real?" question isn't settled first by examining the entity or relationship itself, or even by firmly fixing the context; it's settled *retrospectively* based on the desired *consequence* of that assignment for the assigning party. The ontology bends to serve the exigencies of the moment – liability, obligation, sympathy, control, profit.

  Existing concepts come apart in key ways:
  1.  **Institutional Facts (Searle):** Captures the constructedness but not the *instrumental flip-flopping within overlapping institutions*. The guild, the university HR department, the game studio, and the legal system are all institutions with their own rules, but the *same entity* (the friendship, the city, the harassment) is being assessed, and the reality status changes based purely on which institutional consequence (grief recognition vs. leave entitlement; property claim vs. data denial; ban justification vs. liability shield) is in play. Searle's framework doesn't inherently predict this *conflicting* assignment *across* linked institutional contexts for the *same* fact.
  2.  **The Magic Circle (Huizinga/Caillois):** As you note, it's about a boundary being porous or blurry, not about the boundary being *repositioned deliberately* depending on who benefits. Your examples show the boundary isn't just crossed; it's actively *redefined* mid-discourse.
  3.  **Motivated Reasoning/Cognitive Dissonance:** While self-interest is often *served*, the actors often *aren't* consciously lying or being hypocritical in the moment. They genuinely feel the grief *is* real *for the purpose of mourning* but perhaps not *for the purpose of formal workplace accommodation* because the institutional script for the latter demands a different kind of "proof" of reality (physical proximity, legal next-of-kin, etc.). The instrumental shift happens at the level of the *framing institution*, often absorbed uncritically by individuals.
  4.  **Legal Fictions:** These are conscious, stable constructs (like corporate personhood). Your pattern is often *ad hoc*, unstable, and inconsistently applied even within the same actor's logic (studio: "Our items are valuable property when stolen!" / "Your items are worthless data when we delete them!").

  Therefore, I propose coining the term: **"Instrumental Ontology"** or, more precisely, **"Instrumental Ontological Assignment" (IOA)**.

  **Defining Instrumental Ontological Assignment (IOA):**

  IOA occurs when the reality status (existence, properties, significance) of an entity, relationship, event, or harm within a contested or hybrid domain (like the virtual) is determined *primarily* by the pragmatic consequences that assigning a *particular* ontological status would have *for the party making the assignment or the specific institutional context requiring it*, rather than by:
  *   a consistent set of intrinsic properties of the entity itself,
  *   a stable, pre-defined set of criteria for reality within that domain, or
  *   a unified social consensus.
  The ontological status becomes a *tool* or *instrument* wielded to achieve a specific practical outcome (avoiding liability, securing sympathy, asserting control, denying claims, justifying action) within a given frame of interaction.

  **Carving the Edges (Addressing your specific queries):**

  1.  **Does it count if the same party holds both attributions at once? Absolutely, and this is core.** The game studio simultaneously asserting the *reality* of virtual property value (to sue gold farmers for theft) and the *unreality* of the player's property claim (to deny compensation on server closure) is a paradigmatic example of IOA. The platform banning based on the *reality* of harassment but denying liability based on its *unreality* is another. The ontology is instrumentalized *differently* for different purposes by the *same* actor within a short timeframe or even concurrently in different contexts.
  2.  **What if the asymmetry runs the other way (declared unreal to hurt the claimant)? Yes, this is included.** If a university denies bereavement leave precisely *because* they deem the online friendship "not real *enough*" to warrant formal accommodation, that's IOA. The ontological assignment (unreal) is chosen because it justifies denying a claim or obligation. The instrumental purpose (denying the claim) drives the ontological assignment.
  3.  **Is there an innocent version? Potentially, but it's complex.** One could argue that *all* social ontology is somewhat instrumental in the sense that our categories serve human purposes. However, IOA implies a *conflict of assignments* driven by *conflicting stakes* within a recognizably connected domain. A purely "innocent" evolution of practice where ontology adapts *without* creating contradictory assignments benefiting specific parties in conflicting ways (e.g., a community gradually coming to universally recognize in-game relationships as "real" for all purposes) would lack the *instrumental conflict* that defines IOA. IOA thrives on the *asymmetry* of the assignment. If the ontology shifts *neutrally* for *all* stakeholders in a domain, it's just ontological evolution, not necessarily instrumental assignment.
  4.  **Does it apply to virtual objects themselves, not just harms? Definitely.** The server shutdown/city destruction example is fundamentally about the object (the virtual city). Is it "real property"? The player says yes (claim for loss), the studio says no (denial of obligation). The studio might simultaneously treat functionally identical code/items as "real property" when *they* want to assert a claim against a third party (gold farmer). The ontological status of the *object itself* is being instrumentally assigned based on who is making the claim and against whom.

  **Why "Instrumental"?** It emphasizes that the ontology is not being discovered or consistently applied based on principle, but is being actively *used as a tool* to achieve a specific, often self-serving or institutionally convenient, outcome. The "assignment" part highlights the active (though often unreflective) process of bestowing a particular status.

  This framing, IOA, gives you a sharp tool to dissect those frustrating moments where the rug of reality gets pulled depending on who's standing on it and which way they might fall. It captures the core dynamic you've identified: ontology subordinated to pragmatics, with the virtual serving as an exceptionally fertile ground for observing this phenomenon in action. Good luck wrestling with it – it's a beast of a pattern, but naming it is the first step to taming its analysis.
