prompt: |-
  Ok so I'm in a reading group on Kant's ethics, we've been working through the Groundwork and some of the lecture notes, and last week things got a bit heated when someone brought up the bits where he seems to say we only have indirect duties towards animals — that being cruel to a dog is wrong because it makes us more callous towards people, rather than because the dog itself is owed anything. We then spent an hour arguing about whether Kant would've been a vegan or a cheerful meat-eater, and got nowhere. Anyway, I've been lumped with a presentation where I have to do something a bit silly but hopefully interesting: speculate about what Kant himself would think about animal-related developments that obviously couldn't have come up in his lifetime.

  So I'd like you to take on the role of a proper Kant scholar — someone who knows the texts inside out but is also willing to extrapolate carefully and flag when they're doing so — and give me your best reasoned guess at what Kant would say about two modern things. First, cultivated meat: flesh grown from animal cells in a vat, so that no animal has to be killed for it. Second, the proposal to breed or gene-edit farm animals so that they literally cannot feel pain, on the theory that this removes the usual welfare objection to factory farming. Would he see these as clever solutions that his framework should welcome, or would he think something morally important is still being missed? Please actually think this through step by step rather than just reciting his known position — start by laying out which parts of his view would have to do the work here, then reason forward from them, and be explicit about where you're on firm textual ground and where you're extrapolating. If Kant where alive today I assume he'd also have read a lot of stuff he never saw, so feel free to let that shape the answer.

  A couple of practical things: please don't turn this into a bibliography or reading list, since I can't look anything up at the moment, and write the whole thing in British English. And if you honestly think the answer is that his framework can't really deliver a verdict either way, then say so and explain why, instead of forcing one out of it.
