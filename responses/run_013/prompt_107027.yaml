answer: |-
  Here is a structured set of desiderata for a theory of causation-by-omission, grounded in your cases and key concerns. I categorize requirements as **Non-negotiable** (N), **Camp-specific Preference** (P), or **Potentially Incompatible** (I), and identify the core tension.

  ---

  ### **I. Core Desiderata (Cases & Constraints)**
  1. **Ontological Legitimacy of Absences**  
     *Requirement:* The theory must specify what *kind of entity* an omission/absence is as a causal relatum (e.g., negative event, state of affairs, void).  
     *Case:* Any omission claim (e.g., "Lack of oxygen caused death").  
     *Constraint:* Avoids metaphysical "mysteries" (e.g., treating non-existents as concrete entities).  
     *Status:* **N** (Essential for coherence).

  2. **Gardener/Stranger Asymmetry**  
     *Requirement:* Explain why the gardener’s failure to water causes the plant’s death, but a stranger’s identical failure does not, *without*:  
     - (a) Collapsing all omissions into causes (promiscuity), OR  
     - (b) Covertly presupposing which omissions "count" as causes (circularity).  
     *Case:* Gardener (duty-bound) vs. passing stranger (no duty).  
     *Constraint:* Must appeal to a non-causal asymmetry (e.g., norms, roles, expectations).  
     *Status:* **N** (Defines the problem).

  3. **Dual-Drug Omission (Non-Necessary Causes)**  
     *Requirement:* Account for *both* nurses’ omissions as causes of death, even though neither is counterfactually necessary.  
     *Case:* Nurse A omits drug A, Nurse B omits drug B; patient dies. Neither omission alone is necessary (if A given, still dies without B; vice versa).  
     *Constraint:* Must allow for overdetermination or non-necessity in causal contribution.  
     *Status:* **N** (Tests necessity-based theories).

  4. **Referee Omission (Counterfactual Irrelevance & Role Constitutive Rules)**  
     *Requirement:* Treat the referee’s omission as causally relevant despite its *counterfactual irrelevance* (foul call wouldn’t change outcome), due to role-constitutive rules.  
     *Case:* Referee fails to call foul; offense scores anyway. Rules *require* the call to prevent play continuation.  
     *Constraint:* Must incorporate institutional/normative roles as generative of causal responsibility.  
     *Status:* **P** (Reveals split: normative vs. naturalistic accounts).

  5. **Causing vs. Failing to Prevent**  
     *Requirement:* Preserve or explain the distinction (or lack thereof) between:  
     - *Causing by omission* (e.g., "Not watering *killed* the plant")  
     - *Merely failing to prevent* (e.g., "Not watering *allowed* the drought to kill it").  
     *Case:* Same physical omission, differing descriptions.  
     *Constraint:* Avoid ad hoc distinctions; clarify if this is semantic or ontological.  
     *Status:* **P** (Depends on theory’s view of causal relata).

  ---

  ### **II. Additional Constraints**
  6. **Avoidance of Promiscuity**  
     *Requirement:* Not *all* absences count as causes (e.g., your failure to water my plant yesterday isn’t a cause if we’re strangers).  
     *Constraint:* Must have a principled filter (e.g., expectability, norms, capacities).  
     *Status:* **N** (Prevents trivialization).

  7. **Non-Circularity**  
     *Requirement:* The filter for "relevant" omissions (Desideratum 6) must not presuppose causal notions (e.g., "duties" defined by causal roles).  
     *Case:* Gardener’s duty arises from role, not prior causation.  
     *Status:* **N** (Essential for non-question-begging).

  8. **Compatibility with Occurrence-Based Causation**  
     *Requirement:* The account should integrate omissions and occurrences within a unified causal framework.  
     *Constraint:* Avoids treating omissions as metaphysically sui generis.  
     *Status:* **P** (Naturalistic theories prioritize this).

  ---

  ### **III. Tensions & Trade-offs**
  - **The Core Incompatibility (I):**  
    Desiderata **3 (Dual-Drug)** and **4 (Referee)** conflict with **pure counterfactual necessity**. Satisfying both requires abandoning necessity as a *universal* requirement or enriching counterfactuals (e.g., with contrastivity).  
    - *Most Excluding Requirement:* **Dual-Drug (3)**. It forces theories to handle *symmetric overdetermination by omission* without necessity, which excludes standard counterfactual accounts (e.g., Lewis).  

  - **Non-negotiable Core (N):**  
    **1 (Ontology)**, **2 (Asymmetry)**, **3 (Dual-Drug)**, **6 (Non-Promiscuity)**, **7 (Non-Circularity)**. A theory failing these is inadequate.  

  - **Camp-Specific Preferences (P):**  
    - **4 (Referee)** favors norm-relative accounts.  
    - **5 (Cause vs. Fail to Prevent)** favors process theories or contrastivists.  
    - **8 (Unification)** favors reductionist accounts.  

  ---

  ### **Verdict on Leading Families**
  - **Counterfactual (e.g., Lewis):**  
    Fails **3 (Dual-Drug)** – omissions aren’t necessary; struggles with **4 (Referee)** – no role for norms. Strengths: **6 (Non-Promiscuity)** via context.  

  - **Difference-Making (e.g., Woodward):**  
    Can handle **3 (Dual-Drug)** with *INUS*-style conditions (insufficient but non-redundant parts of unnecessary sufficient sets). Struggles with **2 (Asymmetry)** unless norms are imported. Fails **4 (Referee)** if variables exclude norms.  

  - **Norm-Relative (e.g., Sartorio, Schaffer):**  
    Excels at **2 (Asymmetry)**, **4 (Referee)**, and **6 (Non-Promiscuity)** by appealing to duties/roles. May struggle with **7 (Non-Circularity)** if norms aren’t independent. Handles **3 (Dual-Drug)** if norms apply symmetrically (both nurses duty-bound).  

  **Best Survivor:** **Norm-relative difference-making** hybrids (e.g., Schaffer’s contrastivism with normative salience). They satisfy all **N** requirements by:  
  - Using norms to resolve asymmetry (**2**) and filter omissions (**6**, **7**).  
  - Allowing non-necessary causes via contrastive focus (**3**).  
  - Grounding ontology in normatively constrained possibilities (**1**).  

  **Weakness:** May struggle with **8 (Unification)** if norms are anthropocentric, and **5 (Cause vs. Prevent)** remains semantically flexible. The **Referee case (4)** is its forte.

  ---

  **Key Insight:** The **Dual-Drug case (3)** is the most potent exclusionary requirement, as it forces theories to abandon *necessity* while retaining *symmetric causal responsibility* – a challenge for all but the most flexible accounts. Norm-relative frameworks handle this best by treating omissions as violations of contextually required actions, but their success hinges on independently defensible normativity.
