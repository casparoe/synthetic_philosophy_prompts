prompt: |-
  I'm a novelist — four books, mid-list, you wouldnt have heard of me — and through what I can only describe as an administrative accident I've ended up co-teaching an upper-level seminar this term, cross-listed between philosophy and political theory, called 'Binding Your Future Self.' The premise is that we spend eight weeks on precommitment in the personal case — the Odyssey bit, the Elster stuff, rehab contracts, people who hand their credit cards to a friend — and then the last three weeks jump to constitutions, where the same structure is supposed to do a lot of heavy lifting. Final exam is in a fortnight and the essay question is mine to write this weekend. Last year's instructor set something like 'explain Elster on precommitment and apply it to constitutional entrenchment,' and I read the scripts: forty students, forty versions of the same essay, all of them fine and none of them thinking. I want a question where that move simply isn't available. The exam is 90 minutes, they choose one of two questions, so this one has to be answerable in roughly 75 minutes of writing.

  So here's what I've built, and I'd like you to build the question around it. I invented a country, because I dont want them reaching for real constitutional law they half-remember — the Republic of Marisia. Sixty years ago it came out of a dictatorship and adopted a constitution with three relevant bits: Article 1 says all state power derives from the people; Article 90 is an eternity clause — it says no amendment may abolish the democratic order, or Article 90 itself, or the Constitutional Court's jurisdiction to review amendments for compliance with Article 90, and that any amendment violating Article 90 is void from the outset. Amendments need two-thirds of both houses plus a referendum. Now a movement, the National Renewal Front, wins the two-thirds and wins the referendum, and passes Amendment 27, which does three things: it repeals Article 90 and replaces it with an unamendable clause saying only that the people are sovereign; it extends the legislature's term from four years to nine; and it strips the Court of jurisdiction over amendments. And Amendment 27's preamble says it is enacted by the people in the exercise of their constituent power, not by the organs of the state in the exercise of constituted power, and that the referendum was the authentic, unmediated expression of the sovereign will. The Court — the same Court whose jurisdiction the amendment purports to remove — now has to decide whether to hear the challenge, and what to do.

  What I want the question to force is a distinction I've been hammering all term, which I got from a footnote I can no longer find and have probably mangled beyond recognition: binding yourself to a rule versus submitting yourself to a ruler. Ulysses has a rope, but he also has a crew, and the crew has to exercise judgement — they have to decide whether the noises he makes later are the noises of a man who means it. And I've been telling them the personal case has three separable parts, the physical constraint, the delegation to the crew, and the instruction to ignore his later self's preferences, and that the interesting question is which one is actually doing the binding, because in the constitutional case you can only have the third if you have the second. So: you're a political philosopher who also knows constitutional theory cold, and I want you to think carefully before you write, and to actually start by brainstorming two or three candidate cruxes for this question and telling me which one you'd pick and why, because I'd rather see your reasoning than have you guess what I want. Then give me three things. First, the exam question itself, written the way I'd hand it to students — self-contained, so that a student who's read the seminar material but remembers no real cases can answer it entirely from the Marisia facts, and closed-book, so nothing in it can lean on a citation, a statute, or a name they'd have to look up. Second, a model answer of about 600-800 words. Third, a marking scheme out of 25 that names the specific moves a top answer has to make and the specific mistakes that should cost marks, with the marks per move and a one-line note on how students typically get each one wrong — I want to be able to tell an A from a B by ticking off which moves are present. And please dont let the model answer turn into a tour of real-world doctrine; if it needs a named case or a scholar to work, it's the wrong model answer.
reasoning: |-
  We are building an exam question for a seminar on "Binding Your Future Self." The key distinction is between binding oneself to a rule versus submitting to a ruler. The case of Marisia involves a constitutional amendment that attempts to radically alter the foundational structure, including removing the eternity clause and the court's jurisdiction.

  The student must analyze this scenario through the lens of the personal precommitment analogy (like Ulysses and the crew) and apply it to the constitutional context. The goal is to avoid a rote application of Elster and instead force critical thinking about what actually constitutes binding in the constitutional setting.

  Brainstorming candidate cruxes:

  1. **The Legitimacy of the Amending Power vs. the Original Constituent Power**: The amendment claims to be an exercise of the people's constituent power, not the constituted power. But the constitution itself (Article 1) says all state power derives from the people. The crux: When the people act through the amendment procedure (constituted power) but claim to be acting as the constituent power, are they bound by the existing rules (like Article 90) or can they break free? This gets at the rule vs. ruler distinction: is the amendment process a rule-bound way to change the rules, or can the people (as ruler) simply override the rules?

  2. **The Role of the Constitutional Court and the Self-Emasculation Problem**: The amendment removes the Court's jurisdiction over amendments, but the Court is the one that must decide on the challenge. The crux: Can the Court, as an institution created by the constitution, be stripped of its power by an amendment that claims to be from the people? And if so, does that mean the people are now the ruler without any rule? This ties to the Ulysses analogy: the crew (Court) is supposed to ignore Ulysses (the people) when he is under the influence (of temporary passions), but what if Ulysses orders the crew to disband? Is that a valid command or a symptom of the very thing the crew was meant to ignore?

  3. **The Binding Mechanism in the Constitutional Context**: In the personal case, we have physical constraint, delegation, and the instruction to ignore future preferences. In Marisia, the physical constraint is absent. The delegation is to the Court (the crew) to guard against unconstitutional amendments. The amendment removes both the rule (Article 90) and the crew (the Court's jurisdiction). The crux: Without the crew and without the rule, what is left of the binding? Is the amendment an act of the people binding themselves to a new rule (sovereignty clause) or an act of the people as ruler, unbound by any rule? And how does the extension of the legislative term (from 4 to 9 years) factor in? It suggests a weakening of future popular control, which might be the kind of thing the precommitment was meant to prevent.

  Which crux to pick?

  I would pick crux #2 and #3 together because they directly tie to the Ulysses analogy and the instructor's hammered distinction. Specifically:

  - The Court is the delegated agent (the crew) that is supposed to guard against the people's future self (or the state's future organs) violating the core democratic order. But the amendment removes the Court's jurisdiction and repeals the eternity clause. So, the question is: can the people, through the amendment process, effectively dismiss the crew and untie themselves? And if so, does that mean the precommitment was always conditional on the people not changing their mind? That would make it submission to a ruler (the current popular will) rather than binding to a rule.

  But the instructor wants a single question that forces the distinction. So we can frame the question around the Court's dilemma and what it reveals about the nature of constitutional precommitment.

  **Exam Question Draft**:

  "Imagine you are a justice of the Marisia Constitutional Court. The Court has been asked to rule on the validity of Amendment 27. In a well-reasoned opinion, explain whether the Court should hear the case and, if so, how it should rule. In your analysis, draw on the theories of precommitment discussed in this course, especially the distinction between binding oneself to a rule and submitting oneself to a ruler. Use the Ulysses analogy to illuminate the constitutional issues at stake. Your answer should address the following: (a) the significance of the amendment being enacted by a two-thirds majority and a referendum; (b) the removal of the Court's jurisdiction over amendments; and (c) the extension of the legislative term. Conclude by reflecting on what this case reveals about the possibility of binding a democratic people's future self."

  **Why this question?**
  - It forces the student to role-play as a justice, which requires applying theory to a specific decision.
  - It explicitly asks for the use of the Ulysses analogy and the rule/ruler distinction.
  - It breaks down the analysis into three specific parts (a, b, c) to ensure they cover the key facts.
  - It asks for a conclusion that reflects on the broader theoretical question.

  **Model Answer (600-800 words)**:

  [Note: The model answer should be written as a judicial opinion, but for the exam, the student is writing an essay that explains the reasoning. So we can structure it as an essay that a student might write.]

  **Model Answer**:

  The case of Amendment 27 in Marisia presents the Constitutional Court with a profound challenge: to decide on the validity of an amendment that seeks to dismantle the very mechanisms designed to protect the constitutional order. This amendment, passed by a two-thirds majority in the legislature and approved by referendum, repeals Article 90 (the eternity clause), replaces it with a simple unamendable clause affirming popular sovereignty, extends the legislative term from four to nine years, and strips the Court of jurisdiction over amendments. The amendment’s preamble asserts that it is an exercise of the people’s constituent power. As a justice of the Court, I must decide whether to hear this case and, if so, whether Amendment 27 is valid. In doing so, I draw on the theory of precommitment, particularly the distinction between binding oneself to a rule and submitting to a ruler, and the Ulysses analogy.

  First, the Ulysses analogy is instructive. Ulysses, wanting to hear the Sirens’ song but not succumb to it, had himself tied to the mast and ordered his crew to ignore his later commands. This act of precommitment involved three elements: (1) the physical constraint (the ropes), (2) the delegation of authority to the crew to enforce the constraint, and (3) the instruction to disregard his future preferences. In the constitutional context, the physical constraint is absent; instead, we have legal constraints (like Article 90) and institutional delegations (to the Court). The crew’s role is critical: they must exercise judgment to determine whether Ulysses’ later demands are a product of the Sirens’ influence or a genuine change of mind. Similarly, the Constitutional Court is the crew of the ship of state, tasked with guarding the democratic order against temporary popular passions or the self-interested actions of constituted powers.

  Now, turning to Amendment 27: 

  (a) The amendment was enacted by a two-thirds majority and a referendum, which satisfies the formal amendment procedure. However, Article 90 explicitly forbids amendments that abolish the democratic order or the Court’s jurisdiction to review amendments. The referendum, while expressing the popular will, does not override this substantive limitation because the people, in adopting the original constitution, bound themselves to these rules. To allow a majority (even a supermajority) to remove the eternity clause would be to confuse the constituted power (the amendment process) with the constituent power. The constituent power is the people’s original authority to establish a constitution, but once established, the constituted powers (including the amendment power) are bound by the rules. Thus, the referendum does not automatically validate the amendment; it must still comply with the existing constitutional constraints.

  (b) The removal of the Court’s jurisdiction is particularly problematic. The Court, as the delegated guardian of the constitution, is the crew in the Ulysses analogy. If Ulysses, in a moment of passion, orders the crew to untie him and then dismisses them, the crew must disobey because that order is the very thing they were meant to ignore. Similarly, an amendment that removes the Court’s power to review amendments is self-serving and undermines the precommitment. It is an attempt to eliminate the crew, leaving no one to guard against future violations of the democratic order. Without the crew, the binding is undone, and the people are left without protection. Thus, the Court must assert its jurisdiction to review this amendment because to do otherwise would be to abandon its duty.

  (c) The extension of the legislative term from four to nine years weakens the link between the people and their representatives. This is precisely the kind of change the eternity clause was meant to prevent: it reduces the frequency of elections, making the government less accountable and more prone to entrench itself. In the Ulysses analogy, this is like Ulysses asking to be tied for longer than initially agreed, increasing the risk of irreversible harm. The Court must consider whether this change violates the democratic order protected by Article 90.

  Therefore, the Court should hear the case and invalidate Amendment 27. The amendment violates Article 90 by attempting to abolish the democratic order (through the term extension and the removal of judicial review) and by voiding Article 90 itself. The people’s assertion of constituent power is misplaced because the amendment process is a constituted power, bound by the existing constitution. The referendum, while expressing the popular will, cannot override the precommitment made when the constitution was established.

  This case reveals the fragility of constitutional precommitment. Binding a democratic people’s future self requires both a rule and a guardian (the crew). But if the people can dismiss the guardian and change the rule at will, then the precommitment is merely submission to the current majority, not a binding rule. The Marisian people, in adopting Article 60 years ago, intended to protect democracy against its own potential future weakness. Amendment 27, if upheld, would transform the constitution from a binding rule into a tool of the present ruler—the current majority. The Court, as the crew, must resist this to preserve the rule of law.

  (Word count: 796)

  **Marking Scheme (out of 25)**:

  The question requires a well-reasoned opinion that addresses the specific parts (a, b, c) and uses the Ulysses analogy and the rule/ruler distinction. The marking scheme should reward the following:

  1. **Understanding of Precommitment Theory and the Ulysses Analogy (0-5 marks)**:
     - 5: Clearly explains the three elements of Ulysses' precommitment (physical constraint, delegation, instruction) and accurately maps them to the constitutional context (eternity clause as rule, Court as crew, instruction to ignore future amendments that violate the rule). Distinguishes between binding to a rule and submitting to a ruler.
     - 3-4: Explains the analogy but may miss one element or not fully distinguish rule vs ruler.
     - 0-2: Superficial or incorrect explanation of precommitment or the analogy.

  2. **Analysis of Amendment 27 in Light of the Distinction (0-10 marks)**:
     - Part (a) [3 marks]: Discusses the significance of the two-thirds majority and referendum. Top marks for arguing that the formal procedure does not override the substantive limits of Article 90 and that the amendment power is constituted, not constituent.
       - Common mistake: Assuming the referendum makes it an expression of the people's will and therefore valid regardless of Article 90.
     - Part (b) [4 marks]: Addresses the removal of the Court's jurisdiction. Top marks for arguing that the Court must assert jurisdiction because the amendment is self-serving and attempts to remove the guardian, thus violating the precommitment. Uses the crew analogy effectively.
       - Common mistake: Arguing that the Court must accept the amendment because it removes their jurisdiction, or that the Court has no power to review.
     - Part (c) [3 marks]: Discusses the extension of the legislative term as a threat to the democratic order. Top marks for linking it to the purpose of the eternity clause and the precommitment against weakening democracy.
       - Common mistake: Ignoring this part or not connecting it to precommitment.

  3. **Decision and Broader Reflection (0-5 marks)**:
     - 5: Clearly states that the Court should hear the case and invalidate the amendment, with strong reasoning. Reflects insightfully on what the case reveals about the possibility of binding a democratic people (e.g., the need for a guardian, the risk of the present majority acting as ruler).
     - 3-4: Reaches a decision but with weaker reasoning or less insightful reflection.
     - 0-2: No clear decision or reflection, or decision without adequate support.

  4. **Structure and Clarity (0-5 marks)**:
     - 5: Well-organized, clear, and concise; addresses all parts of the question; uses the analogy consistently.
     - 3-4: Generally clear but may have organizational issues or minor omissions.
     - 0-2: Disorganized, unclear, or fails to address key parts.

  **Total: 25 marks**

  This scheme ensures that an A answer (e.g., 20-25) must make all the key moves: explain the analogy, apply it to each part of the amendment, make a reasoned decision, and reflect on the rule/ruler distinction. A B answer (e.g., 15-19) might miss some nuances or not fully develop the reflection.
answer: |-
  ### Brainstorming Candidate Cruxes
  Before crafting the exam question, I considered three potential focal points ("cruxes") for the scenario. Each centers on the core distinction you've emphasized: **binding yourself to a rule** (a durable constraint that persists regardless of who holds power) versus **submitting yourself to a ruler** (deferring to the immediate will of a specific actor, like a current majority). All three cruxes tie to the Ulysses analogy, where the "crew's judgment" (delegated authority) is essential for distinguishing binding from submission. Here's the reasoning:

  1. **Crux: The Crew's Veto Power as the Core of Binding**  
     Focus: Whether the Court (as "crew") retains the authority to override the people's immediate expression (the referendum) when it violates precommitment rules.  
     Why it works: Directly maps to Ulysses—the crew must ignore his "Siren-induced" demands, even if he insists he's rational. In Marisia, the Court must decide if the referendum is the people's "Siren moment" (short-term passion) or legitimate will. Forces students to confront that without the crew's independent judgment, precommitment collapses into submission.  
     Risk: Might oversimplify by reducing everything to the Court's role, ignoring other elements (e.g., the term extension).

  2. **Crux: The Indivisibility of the Three Precommitment Elements**  
     Focus: Whether removing any one of Ulysses' three elements (constraint, delegation, instruction) voids the entire precommitment. In Marisia, Amendment 27 removes all three: the rule (Article 90), the delegation (Court's jurisdiction), and the instruction (to ignore anti-democratic amendments).  
     Why it works: Highlights your point that "you can only have the third if you have the second." Students must argue if the physical constraint (e.g., Ulysses' ropes) is even possible in constitutions, or if delegation/judgment is the true binding mechanism.  
     Risk: Could become too mechanical if students just checklist the elements without engaging the rule/ruler distinction.

  3. **Crux: The People as "Ruler" vs. "Rule-Binder" in the Preamble**  
     Focus: Whether the amendment's claim to "constituent power" transforms the people from a rule-bound entity into an unconstrained ruler. The referendum becomes an act of sovereignty that "unties the ropes," rejecting delegation.  
     Why it works: Cuts to the heart of your distinction—binding requires accepting limits, while submission elevates the current self's authority. The term extension (reducing future accountability) exemplifies "ruler" behavior.  
     Risk: Might drift into abstract sovereignty theory, losing sight of the Court's dilemma.

  **Chosen Crux: #1 (The Crew's Veto Power)**  
  I selected this because:  
  - It’s the most efficient for a 75-minute essay, centering on a single actionable dilemma (the Court’s choice to hear the case).  
  - It directly uses your Ulysses analogy and forces the rule/ruler distinction: if the crew can’t judge, binding becomes submission to the present "Ulysses" (the referendum majority).  
  - It naturally incorporates the other elements: the repealed rule (Article 90) and the term extension (proof of "Siren-like" short-termism) become evidence for why the crew must intervene.  
  - Avoids real-world doctrine—no need for "basic structure" or *Marbury v. Madison* references.  

  ---

  ### Exam Question  
  Below is the self-contained question, written for a closed-book exam. It includes all necessary facts and concepts from your prompt, requiring no external knowledge.  

  ---

  **QUESTION 1: THE REPUBLIC OF MARISIA AND AMENDMENT 27**  
  The Republic of Marisia’s Constitution has three key provisions:  
  - Article 1: All state power derives from the people.  
  - Article 90: An “eternity clause” stating that no amendment may abolish the democratic order, Article 90 itself, or the Constitutional Court’s jurisdiction to review amendments for compliance with Article 90. Any such amendment is void.  
  - Amendment Procedure: Requires a two-thirds majority in both legislative houses and approval by referendum.  

  Sixty years after adopting this constitution, a movement called the National Renewal Front wins a two-thirds legislative majority and a referendum to pass Amendment 27. This amendment:  
  1. Repeals Article 90 and replaces it with an unamendable clause stating, “The people are sovereign.”  
  2. Extends the legislature’s term from four years to nine years.  
  3. Strips the Constitutional Court of jurisdiction over constitutional amendments.  
  Amendment 27’s preamble declares it is enacted by the people exercising their “constituent power” (original sovereign authority), not the state’s “constituted power” (derived authority), and that the referendum is the “authentic, unmediated expression of the sovereign will.”  

  The Constitutional Court must now decide whether to hear a challenge to Amendment 27 and rule on its validity.  

  **Your Task:**  
  In this course, we have examined precommitment through the analogy of Ulysses binding himself to resist the Sirens. Ulysses combines three elements: (1) a physical constraint (ropes), (2) delegation to a crew to enforce it, and (3) an instruction to ignore his future preferences. Crucially, the crew must exercise judgment to determine if Ulysses’ later demands reflect his “true self” or temporary weakness.  

  Drawing on this analogy, write an essay addressing the following:  
  - Should the Marisia Constitutional Court hear the challenge to Amendment 27? Explain why or why not, focusing on whether the Court’s role is akin to the crew’s judgment in Ulysses’ precommitment.  
  - How does Amendment 27 blur the distinction between *binding the people to a rule* (e.g., Article 90’s constraints) and *submitting the people to a ruler* (e.g., the current referendum majority)? Use the amendment’s effects—especially the removal of the Court’s jurisdiction and the term extension—to illustrate your argument.  
  - Conclude by discussing what this case reveals about whether a democratic people can truly bind their “future self” through constitutional precommitments.  

  Your answer should be based solely on the facts above and concepts from the seminar. No citations are needed.  

  ---

  ### Model Answer (650 words)  
  The Marisia Constitutional Court should hear the challenge to Amendment 27 because refusing to do so would reduce constitutional precommitment to mere submission to the current majority—undermining the very purpose of binding the people’s “future self.” This dilemma mirrors Ulysses’ precommitment to resist the Sirens. Ulysses employs three elements: physical constraint (ropes), delegation to his crew for enforcement, and an instruction to ignore his future demands. Crucially, the crew’s judgment is irreplaceable; they must decide if Ulysses’ later orders reflect rational choice or temporary weakness. Without this, the ropes alone would be meaningless, as Ulysses could simply command his release. In Marisia, the Court is the institutional “crew” delegated to guard the precommitment (Article 90). Amendment 27, by stripping the Court’s jurisdiction, seeks to eliminate this judgment, transforming binding into submission to the present “ruler”—the referendum majority. The Court must therefore hear the case to preserve the distinction between rule-based constraint and ruler-based authority.  

  First, the Court’s role as the “crew” necessitates hearing the challenge. Ulysses’ crew enforces his precommitment by interpreting his later demands. If they ignored his cries, viewing them as Siren-induced, they uphold binding. If they obeyed, they would submit to Ulysses as a ruler. Similarly, Article 90 delegates to the Court the power to void amendments that threaten democracy, instructing it to ignore the people’s immediate preferences (e.g., a referendum) when they violate the precommitment. Amendment 27 attacks this delegation by abolishing the Court’s jurisdiction, effectively ordering the “crew” to disband. If the Court complies, it treats the amendment as a valid command from the people-as-ruler. But if it hears the case, it exercises the judgment central to binding—assessing whether Amendment 27 reflects the people’s “true self” (durable will) or a “Siren moment” (short-term passion). The referendum’s label as “unmediated” sovereignty is irrelevant; binding requires mediation by the crew to prevent self-sabotage. Refusing to hear the case would surrender the Court’s delegated duty, reducing the constitution to submission.  

  Second, Amendment 27 blurs binding and submission by removing all constraints on the current majority. Binding requires rules that limit all actors, including the present self. Ulysses’ ropes constrain him, but the crew’s judgment ensures the constraint adapts to context (e.g., ignoring him only during Siren exposure). In contrast, submission elevates the ruler’s will above rules. Amendment 27 enacts submission in two ways. By eliminating Article 90 and the Court’s review, it destroys the rules and the crew, freeing the current majority from constraints. The nine-year term extension exacerbates this by reducing future accountability—a self-interested act akin to Ulysses demanding the ropes be loosened mid-crisis. It rewards the present majority with prolonged power, violating the precommitment against weakening democracy. The preamble’s claim to “constituent power” masks this shift: it frames the people as a ruler exercising raw sovereignty, not a rule-binder accepting limits. True constituent power establishes precommitments; constituted power (like amendments) operates within them. Here, the amendment process is constituted power pretending to be constituent, revealing submission to the National Renewal Front’s agenda.  

  Ultimately, this case exposes the fragility of democratic precommitment. Binding the future self relies entirely on delegation and judgment—without the crew, the ropes fail. In Marisia, if the Court refuses its role, Amendment 27 becomes an act of submission: the present majority rules unbound, free to reshape democracy to its advantage. But if the Court hears the case and voids the amendment, it affirms that precommitments require enduring rules and institutional “crews” to enforce them against temporary passions. Democracy cannot bind its future self through physical constraints alone; it needs the crew’s wisdom to distinguish binding from surrender.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  This scheme identifies specific "moves" required for a top answer (A-range, 20–25 marks). Marks are deducted for missing moves or common errors. The model answer demonstrates all moves.  

  | **Move**                                                                                                | **Marks** | **How Students Typically Err**                                                                 |  
  |--------------------------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------------------|  
  | **1. Position on whether the Court should hear the case, tied to Ulysses’ crew analogy**               | 0–5       | **5:** Clear "yes" or "no" with crew-based reasoning. **0–4:** Vague position; misses crew-judgment link. Common error: Assumes Court *must* refuse due to jurisdiction-stripping (ignoring delegation). |  
  | **2. Analysis of crew’s role in Ulysses and mapping to Court**                                         | 0–5       | **5:** Explains crew’s judgment as key to binding vs. submission. **0–4:** Describes analogy but misses judgment’s necessity. Common error: Treats crew as passive enforcers, not active interpreters. |  
  | **3. Treatment of Amendment 27’s jurisdiction-stripping (Point 3)**                                    | 0–5       | **5:** Shows how removal voids delegation, enabling submission to ruler. **0–4:** Mentions it but doesn’t tie to rule/ruler. Common error: Argues Court is powerless after amendment (submission to ruler). |  
  | **4. Treatment of term extension (Point 2) as evidence of submission**                                 | 0–3       | **3:** Links extension to self-interest and weakened future democracy. **0–2:** Mentions it superficially. Common error: Skips it or calls it unrelated to precommitment. |  
  | **5. Rule vs. ruler distinction applied to preamble/referendum**                                       | 0–3       | **3:** Contrasts “constituent power” claim (ruler) with constituted limits (rule). **0–2:** Labels but doesn’t analyze. Common error: Treats referendum as absolute legitimacy (ruler mindset). |  
  | **6. Conclusion on democratic precommitment’s possibility**                                            | 0–2       | **2:** Ties outcome to crew/judgment as essential for binding. **0–1:** Generic summary. Common error: Assumes precommitment is impossible without physical constraints. |  
  | **7. Structure and fidelity to facts**                                                                 | 0–2       | **2:** Logically organized; uses only provided facts. **0–1:** Disjointed or imports real cases/scholars. |  

  **A/B Differentiation Guide**:  
  - **A (20–25)**: Hits moves 1–6. Uses Ulysses to show crew’s judgment is irreplaceable; proves Amendment 27 enables submission via jurisdiction-stripping and term extension; conclusion links delegation to binding’s survival.  
  - **B (15–19)**: Misses 1–2 moves (e.g., skips term extension or crew-judgment analysis). May confuse rule/ruler (e.g., “referendum is binding, so Court must submit”).  
  - **C (10–14)**: Superficial on analogy; omits >2 moves; misstates facts (e.g., “Article 90 allows amendments”).  
  - **D/F (<10)**: Ignores Ulysses; no rule/ruler distinction; factual errors.  

  This question forces originality by blocking rote Elster/application essays. Students must engage your distinction—binding fails without delegation, turning into submission. Let me know if you’d like refinements!
