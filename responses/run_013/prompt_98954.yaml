prompt: |-
  I am a PhD student TAing a graduate seminar on collective responsibility, and I have a stack of problem-set answers to grade this week. I would like a grade and a set of marginal comments for one of them. The problem I set was:

  "Suppose a harm occurs if and only if at least 5,000 of a pool of 10,000 agents each perform the same act, and suppose that in fact all 10,000 perform it. (i) State the inefficacy objection to the claim that any one of them acts wrongly. (ii) Evaluate the reply that appeals to expected contribution. (iii) Evaluate a reply that appeals to complicity or participation rather than to consequences. (iv) Say what changes if exactly 5,000 act, and what changes if the agents are uncertain how many of the others will act."

  The answer to be graded:

  "Part (i). The inefficacy objection holds that no individual act in this case makes a difference. Had any one agent refrained, the threshold would still have been crossed by the remaining 9,999, so her act is neither necessary nor sufficient for the harm, and the harm would have occurred just the same. Since an act can be wrong only in virtue of the difference it makes, and since here no act makes any difference, no individual acts wrongly; whatever wrongdoing there is attaches to the 10,000 as a collective rather than to any member. The objection should be read as metaphysical rather than epistemic: it is not that we cannot tell what any individual contributed, but that there is nothing for a contribution to consist in.

  Part (ii). The expected-contribution reply denies this. Even if no act is a difference-maker ex post, ex ante each act raises the probability of the harm: a world in which this agent acts and the others' conduct is uncertain is more likely to cross the threshold than one in which she does not. Each act therefore carries expected harm, and that is enough to make it pro tanto wrong. I take the reply to succeed only where the agent is confident that enough others will act, since only then can her act be credited with membership in the set that produces the harm; under genuine uncertainty her act is one candidate among many and carries no weight. So the reply rescues individual wrongdoing in the easy case but not in the hard one.

  Part (iii). A complicity reply says that the participant is responsible not for the harm as such but for her participation, which is objectionable in its own right and independently of what the others do. This is a coherent position, and it does not depend on any marginal difference the act makes. Its cost is that it must explain what is objectionable about participation when the participation is not itself harmful, and it is not obvious that this can be done without reintroducing the consequentialist reasoning that part (ii) relied on.

  Part (iv). If exactly 5,000 act, each act is necessary for the harm, and the inefficacy objection lapses. If the agents are uncertain how many of the others will act, the case is intermediate, and the strength of the expected-contribution reply varies with the perceived likelihood of being pivotal."

  Please assign a grade (I use a standard A–F scale) and, more importantly, write the marginal comments I should attach to each part, indicating which errors are serious enough to move the grade and which are matters of completeness or presentation. I need the comments specific enough that the student can see exactly where the reasoning goes wrong, and I would rather have a short list of precise objections than a general impression of the answer.
reasoning: |-
  Okay, let me approach this grading task methodically. The student's answer shows strong conceptual grasp but has notable gaps that need precise feedback. For part (i), their formulation of the inefficacy objection is technically correct but misses the crucial threshold-crossing nuance - I'll highlight how they should emphasize the exact point where individual impact disappears. 

  Part (ii) reveals a significant misunderstanding: the student incorrectly limits expected harm calculations to cases of certainty about others' actions. I need to explain why probability matters even under uncertainty, perhaps referencing expected value theory. Their "candidate among many" phrasing suggests a deeper confusion about probability aggregation that warrants concrete correction.

  For part (iii), while they correctly identify the complicity reply's challenge, they overlook key non-consequentialist approaches like expressive or relational theories. I should suggest specific alternatives like Scanlon's participation principles. Their "coherent position" assessment is fair but needs expansion points.

  The part (iv) response is mostly accurate but undersells the uncertainty implications. I'll reinforce how probability distributions affect expected harm calculations beyond just being "intermediate". The phrasing about "strength varying" is vague - I'll push for mathematical precision.

  Throughout, the grade anchors at B+ for strong foundations with deductive gaps. Comments will target conceptual precision (i), probability misconceptions (ii), alternative theories (iii), and quantitative nuance (iv). I'll keep feedback actionable by naming specific missing elements rather than general critique.
answer: |-
  ### Grade: **B+**  
  *Strong conceptual grasp with minor errors in nuance and completeness. The grade reflects deductive errors in part (ii) and underdeveloped analysis in part (iii), offset by clarity and correctness elsewhere.*

  ---

  ### Marginal Comments by Part:  
  **Part (i):**  
  ✓ Correctly captures the metaphysical inefficacy objection’s core (no necessity/sufficiency, no difference-making).  
  ✓ Good clarification that the objection is metaphysical, not epistemic.  
  ⚠️ **Needs refinement:** The harm occurs *only when the 5,000th act is performed*. While no single act is pivotal *in this scenario* (with 10,000 acting), the objection hinges on the *threshold structure* making individual contributions *causally redundant* when surplus acts exist. Emphasize that redundancy (not just lack of necessity/sufficiency) is key.  

  **Part (ii):**  
  ✓ Correctly explains expected harm (ex ante probability increase).  
  ✗ **Serious error:** Claims the reply *only works when agents are "confident enough others will act."* This is incorrect. Expected harm arises *whenever an act has a non-zero probability of being pivotal* (i.e., being the 5,000th act). Under uncertainty, an agent’s act *still* increases the probability of harm if there’s *any chance* the threshold would otherwise not be met.  
  ✗ **Misconception:** The "candidate among many" argument ignores probability weighting. Even if unlikely, the *expected harm* = (probability of being pivotal) × (harm magnitude). If piv probability is 0.01%, expected harm is small but non-zero.  
  **Impact:** This error lowers the grade. Correct reasoning must note that uncertainty *reduces* expected harm but doesn’t nullify it unless piv probability is zero.  

  **Part (iii):**  
  ✓ Accurately frames complicity as non-consequentialist and participation-focused.  
  ⚠️ **Underdeveloped critique:** While noting the challenge of explaining "objectionable participation," misses key non-consequentialist strategies:  
  - **Expressive wrongs:** Participating expresses endorsement of harm (e.g., "I join this unjust project").  
  - **Relational wrongs:** Violating duties of solidarity or fairness (e.g., "free-riding on others’ restraint").  
  - **Conditional wrongs:** "If others act wrongly, joining them is wrong *because* it shares their aim."  
  **Improve:** Distinguish these from consequentialism. The "cost" you note is real, but the reply *can* avoid consequentialism (e.g., Scanlon on participation in unjust systems).  

  **Part (iv):**  
  ✓ Correct that each act is necessary if exactly 5,000 act (pivotal case).  
  ⚠️ **Incomplete on uncertainty:** Merely calling it "intermediate" undersells the implications. Clarify:  
  - Under uncertainty, *expected harm depends on the agent’s belief distribution* about others’ actions.  
  - If an agent believes *exactly 4,999 others will act*, their piv probability is 100%, making their act maximally wrong.  
  - If they believe 10,000 will act, piv probability is ~0 (minimal expected harm).  
  **Strengthen:** Link this explicitly to part (ii)’s expected-contribution reply.  

  ---

  ### Why B+?  
  - **Strengths:** Clear writing, correct on pivotal cases (i, iv), identifies key challenges (iii).  
  - **Deductions:**  
    - Part (ii) misrepresents expected harm under uncertainty (**significant error**).  
    - Part (iii) lacks depth in evaluating complicity (misses non-consequentialist defenses).  
    - Part (iv) needs sharper articulation of probability’s role.  
  - **No fatal flaws:** Core structure is sound; errors are corrigible.  

  ### Student Guidance:  
  > "Your answer shows strong conceptual understanding but needs tightening on probability (ii) and complicity (iii). For (ii), remember: *any* non-zero chance of being pivotal generates expected harm. For (iii), explore expressive/relational accounts to avoid consequentialism. In (iv), quantify uncertainty (e.g., piv probability). Solid work—focus on nuance!"
