answer: |-
  ### Session Plan: Experiencing Conceptual Slippage  
  **Goal:** Students *feel* conceptual slippage—where a rule's meaning shifts contextually without error—through minimal string-transformation puzzles.  

  ---

  #### **Materials**  
  - **Whiteboard** for puzzles, rules, and recording answers.  
  - **Index Cards** (one per student per puzzle) for private answers/rules.  
  - **Alphabet:** Only `a, b, c` (circular: `a→b`, `b→c`, `c→a`). Avoids `z`-edge complications.  
  - **Rules:**  
    > **Rule R:** *"Change the last part to the next one."*  
    *(Deliberately ambiguous: "last part" = last character? last group of identical letters?)*  

  ---

  #### **Timeline (90 Minutes)**  
  **0–10 min: Introduction & Warm-Up**  
  - **Goal:** Frame the session without spoiling slippage.  
  - **Script:**  
    > "We’re exploring how rules guide transformations. Use only **Rule R** and the circular alphabet. There are no ‘tricks’—apply the rule as it makes sense to you. We’ll start simple."  
  - **Warm-Up Puzzle (Non-Ambiguous):**  
    - Rule: *"Change the last character to the next one."*  
    - Example: `a → b`  
    - Question: `b → ?` (Answer: `c`), `c → ?` (Answer: `a`).  
    *Why:* Practices the circular alphabet and unambiguous instructions.  

  **10–35 min: Puzzle 1 (Slippage Emerges)**  
  - **Puzzle on Board:**  
    - Example: `aab → aac`  
    - Question: `bb → ?`  
  - **Process:**  
    1. Students write answers and *their personal rule interpretation* on cards (e.g., "last character" or "last group").  
    2. Collect and tally answers on the board (expect split: `bc` vs. `cc`).  
    3. Pair discussion: *"Convince your neighbor your answer is correct."*  
  - **Predicted Split:**  
    - `bc` ("last character" = change final `b` to `c`).  
    - `cc` ("last group" = `bb` is one group → change both to `c`).  
  - **Key Moment:** Point out identical rule words but different outcomes. *Do NOT define slippage yet.*  

  **35–50 min: Puzzle 2 (Slippage in Action)**  
  - **Modify the Board:**  
    - Add a second example: `aaa → aab` (under original `aab → aac`).  
    - **Re-ask:** `bb → ?` *using the same Rule R*.  
  - **Process:**  
    1. Students re-answer privately.  
    2. Tally new answers (most shift to `bc`).  
  - **Why the Shift?**  
    - New example `aaa → aab` invalidates "last group" interpretation (that would require `aaa → bbb`).  
    - "Last character" becomes the only plausible reading *in this context*.  
  - **Reveal:** Show initial vs. new answers for `bb`. Highlight: *Same rule, same string, but context changed your reading.*  

  **50–70 min: Puzzle 3 (Divergent Outcomes)**  
  - **Puzzle on Board:**  
    - No example. Only Rule R and string: `abb → ?`  
  - **Process:**  
    1. Students answer privately.  
    2. Form groups of 3–4 with mixed answers.  
    3. Task: *"Agree on one answer using Rule R."*  
  - **Predicted Answers:**  
    - `abc` ("last character" → change `b` to `c`).  
    - `acc` ("last group" → `bb` becomes `cc`).  
    - `aab` (edge case: "last part" = entire string? → `abb`→`bcc`?→`aab`?).  
  - **Outcome:** Groups fail to agree—identical rules yield irreconcilable outcomes.  

  **70–85 min: Debrief (Name the Phenomenon)**  
  - **Walk Through Moments:**  
    1. **Puzzle 1’s Split:** *"Two people used Rule R on `bb` but got different results. Why?"*  
       - Highlight: Ambiguous "last part" → Your background (CS, philosophy, etc.) primes initial reading.  
    2. **Puzzle 2’s Shift:** *"Why did most of you change your answer for `bb`?"*  
       - Highlight: Context (added `aaa→aab`) silently redefined "last part." No one was "wrong."  
    3. **Puzzle 3’s Deadlock:** *"Why couldn’t your group agree on `abb`?"*  
       - Highlight: Rule words are fixed, but meanings are fluid. Slippage is unavoidable.  
  - **Introduce Term:** *"This is **conceptual slippage**—the same rule morphs as context pulls its boundaries. You felt it."*  
  - **Connect to CogSci:**  
    > "In analogy, this slippage lets one structure map to multiple targets (e.g., ‘love is a journey’ vs. ‘love is a battlefield’). Your mind isn’t being sloppy; it’s contextually adaptive."  

  **85–90 min: Wrap-Up**  
  - **What We Captured:**  
    - Bare-context slippage (no expertise to lean on).  
    - Private vs. social rule application (individual shifts vs. group disagreements).  
  - **What We *Couldn’t* Capture (Briefly Mention):**  
    > "In real life, slippage involves emotion, culture, and deep knowledge. You can’t *feel* that here—e.g., arguing about ‘freedom’ in politics vs. software. That layer requires narrative, not strings. We stripped it away to expose the mechanism."  

  ---

  #### **What Will Go Wrong (and Fixes)**  
  1. **Problem:** Everyone adopts the *same* initial interpretation (e.g., all pick "last character").  
     - **Fix:** Seed ambiguity—ask: *"Could ‘last part’ mean something else for `aab→aac`?"* If stuck, suggest: *"What if ‘last part’ meant the final group of identical letters?"*  
     
  2. **Problem:** Students insist one interpretation is "correct."  
     - **Fix:** Reframe: *"We’re not debating right/wrong. We’re observing how context influences meaning. Your answer changed—why?"*  

  3. **Problem:** Time runs short during group debates.  
     - **Fix:** Strict 8-minute timer for Puzzle 3. Focus on the *process* of disagreement, not resolution.  

  4. **Problem:** Slippage feels like a "mistake."  
     - **Fix:** In debrief, contrast slippage (adaptive) vs. error (random): *"Did your shift feel arbitrary? Or did the new example make it feel inevitable?"*  

  ---

  #### **Why This Works**  
  - **Microworld:** Letter strings are expertise-proof. Rule R’s ambiguity is in plain sight but feels "obvious" until context shifts.  
  - **Predictable Moments:**  
    - Puzzle 1: Split reveals identical rules ≠ identical outcomes.  
    - Puzzle 2: Same person changes answer—*feels* the rule morph.  
    - Puzzle 3: Groups hit deadlock—social slippage.  
  - **Debrief Structure:** Students articulate the slippage *before* naming it, solidifying the experience.  

  This plan forces confrontation with fluid concepts—no abstraction, just lived tension. By the end, "conceptual slippage" isn’t a term; it’s a memory.
