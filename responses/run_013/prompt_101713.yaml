prompt: |-
  Ok, here's something thats been bugging me and I want an actual number, not a shrug. Take a single case — one specific 90-year-old bridge in one specific city, one specific patient in front of me, the next roll of one specific die I suspect is biased. I want a probability for that one case. There's no frequency to read straight off, so I've got to pick a reference class: bridges that age, bridges of that material, bridges with that maintenance history, all the rolls of this die so far, all rolls of dice out of that factory. Each choice hands me a different number, sometimes a wildly different one.

  Give me your credence, 0 to 1, that for at least one such single case there is a fact of the matter about which reference class is the right one — that "the correct reference class" is a real thing that could in principle be right or wrong, not just a pragmatic choice with no truth value attached.

  Then decompose it. Here are the terms I can see; tell me if you'd carve it up differently. (a) Whether single-case probabilities are objective at all, or whether probability only ever lives over classes. (b) Given that they're objective, whether the objectivity reaches as far as picking the class, or only fixes the value once a class is handed to you. (c) Whether the whole reference class problem is a genuine problem or just dissolves once you notice that every probability is relative to some class and that's simply fine. (d) Whether a rule like "use the narrowest class with adequate data" is actually true or merely a heuristic — and mind the nasty bit, that the narrowest class is the case itself, which either happened or didn't, so the rule looks like it collapses into 0 or 1 unless you smuggle in a minimum class size, say 30. Is that minimum-size patch principled or ad hoc? Give a rough probability on each term with one line of justification, say how they combine into your number, and tell me which term the final number is most sensitive to.

  For what it's worth I'm sitting at about 0.6 that there's a fact of the matter. If you land far from that, tell me which sub-question we're actually fighting about.
