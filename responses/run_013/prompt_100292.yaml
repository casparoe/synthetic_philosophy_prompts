prompt: |-
  I'm putting together a two-page prospectus for a summer research grant and I've got a half-formed idea I need you to beat into shape. Everyone working on transformative experience treats the hard part as missing information: you can't know what the experience will be like, so how could you choose rationally. I think thats the wrong diagnosis for the cases that actually break decision theory. The genuinely hard cases aren't ones where you're ignorant, they're ones where the choice changes what you'll end up valuing, so there's no single subject whose preferences the decision is even supposed to maximize, and "rational choice" comes out underspecified rather than impossible. I want to pull those two things apart: cases where the experience just adds knowledge versus cases where it rewrites the valuer, and see whether only the second kind is a real threat or whether the distinction just relocates the paradox. Turn this into a proposal: state the question so it has a definite answer, explain why the usual positions don't settle it, what I'd actually do over the summer, what a result would look like and what would count as the project failing, and whether this is doable in a summer or is really a dissertation-sized mess. Skip the citations, I'll add those.
