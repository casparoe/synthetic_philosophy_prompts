  The proposal structure should hit: 
  1. Central question with a yes/no answer (e.g., "Does value transformation uniquely challenge decision theory?"). 
  2. Critique of existing views (e.g., Paul's missing info approach). 
  3. Methodology: analyzing cases, modeling them in decision theory frameworks. 
  4. Deliverables: typology of cases, model outputs, conference paper. 
  5. Feasibility: stressing summer-sized scope (no new surveys, just theory). 

  Biggest risk? The distinction collapsing or not mattering. That's actually okay—it'd still be a result! Need to reassure them that either outcome is valuable. 

  Also, they'll add citations later, so no need to hunt for references now. Keeping it lean. 

