prompt: |-
  I keep running into a pattern on the science beat and I've never found a good name for it, so I'm hoping you can either give me the term or invent one that sticks. Here it is. Somebody builds a model that everyone involved knows is a cartoon -- one representative household, a fluid with no viscosity, a population where every individual is identical -- and when you press them on it they say the same thing every time: the assumptions don't need to be realistic, only the predictions do. Fine, I've made my peace with that. What I notice is what happens to the number afterwards. The number leaves the paper and shows up in a press release, in a regulator's cost-benefit table, in a minister's speech. The caveat doesn't leave with it. And not because anyone is covering anything up -- the person who built the model will give you the caveat straight away if you call them. It's that the caveat only means something to someone who already knows how the model is assembled. "It assumes a single representative agent" isnt a sentence you can staple to a figure for a general reader; it just reads as noise. So the qualification is real, freely offered, and permanently stuck at the source. A philosopher friend told me this is just external validity, and I dont think that's it, because external validity is about whether results hold somewhere else, and this happens even when everyone agrees the results hold exactly where they're meant to. So: is there a name for the thing about the caveat rather than the model? If there isn't, give me one, and then tell me where its edges are -- how it differs from ordinary uncertainty, how it differs from plain spin, and whether the same thing happens when what travels isn't a number but a way of talking, when suddenly everyone in a field is saying "discount rate" or "phase transition" and nobody remembers whose model that came out of.
reasoning: |-
  Okay, the user is a science journalist who's noticed a recurring pattern in their reporting. They describe how simplified scientific models produce numbers that get widely cited without their important caveats. The caveats exist but don't travel with the numbers because they're too technical for general audiences. 

  Hmm, their philosopher friend suggested "external validity," but the user correctly points out that's not quite it - the issue isn't whether the results hold elsewhere, but how the caveats get stripped away during communication. 

  What they're really asking for is: 
  First, whether there's an existing term for this caveat-stripping phenomenon. 
  Second, if not, to coin a precise term that captures it. 
  Third, to define the boundaries of this concept - how it differs from regular uncertainty or spin. 
  Fourth, whether this also happens with terminology adoption like "discount rate."

  I recall similar concepts: 
  - In science studies, there's "blackboxing" when technical details become invisible. 
  - In media, there's "lossy compression" from information theory. 
  - The "McNamara Fallacy" about over-relying on quantifiable data. 

  But none fully capture this specific journey where caveats remain technically available yet practically inseparable from the traveling number. 

  For naming: 
  "Travelling Number Syndrome" fits well - it's descriptive and memorable. The "travelling" part emphasizes how the number moves between contexts while shedding meaning. 

  Boundaries: 
  - Vs regular uncertainty: This is about omitted structural assumptions rather than statistical confidence intervals. 
  - Vs spin: Here the caveat exists authentically but fails to propagate, unlike intentional deception. 

  The terminology adoption point is sharp - it's the same mechanism but with conceptual language instead of numbers. The coined term should cover both. 

  User seems analytically sophisticated - they've clearly wrestled with this for years. Their frustration is palpable but professional. They want precision to improve science communication. The invented term needs to be both academically rigorous and journalist-friendly.
answer: |-
  This phenomenon is brilliantly observed and absolutely deserves a name. It's a critical flaw in the science-to-policy/popular understanding pipeline. **There isn't a single, universally accepted term, but several related concepts exist.** Let's synthesize and propose a strong new term.

  ## Existing Concepts & Why They Don't Quite Fit

  1.  **External Validity:** As you note, this is about whether findings generalize *beyond the specific context studied*. Your issue is about the *internal simplification assumptions* being lost *before* we even get to the question of external validity. The caveats are about the model's inherent structure, not its generalizability per se.
  2.  **Model Uncertainty:** This is broad and often refers to statistical uncertainty or parameter sensitivity. Your issue is specifically about **structural assumptions** being forgotten, not the *range* of possible values given those assumptions.
  3.  **Blackboxing (STS - Science & Technology Studies):** This describes how complex technical processes become opaque. It's relevant, but doesn't capture the *specific journey* of the number shedding its caveats as it travels.
  4.  **Lossy Compression (Information Theory):** A good metaphor! Information (caveats) is lost when simplifying for transmission. However, it's not specific to science/model caveats.
  5.  **McNamara Fallacy / Quantification Bias:** Focuses on over-reliance on measurable factors, ignoring unquantifiables. Related, but your issue is about forgetting the *specific simplifying assumptions* behind a quantified result, not just ignoring unquantifiable factors.
  6.  **Science Communication Gap:** Too broad. Doesn't pinpoint this specific mechanism of caveat-stripping.

  ## The Coined Term: Travelling Number Syndrome (TNS)

  **Definition:** Travelling Number Syndrome (TNS) describes the phenomenon where a numerical result, generated by a simplified model whose validity critically depends on specific, non-realistic structural assumptions ("caveats"), becomes detached from those caveats as it disseminates beyond its originating technical context. The caveats remain known and accessible to specialists but fail to propagate effectively with the number into policy, media, or public discourse, leading to the number being interpreted and used with unwarranted literalness.

  ### Why "Travelling Number Syndrome"?

  *   **"Travelling":** Emphasizes the key dynamic – the number *moves* from the lab/paper to broader spheres.
  *   **"Number":** Pinpoints the specific output that becomes detached.
  *   **"Syndrome":** Highlights it as a recurring, systemic problem with characteristic symptoms (detachment of caveats, misinterpretation).
  *   **It captures the journey and the loss.** The core idea is the number travels light, shedding its baggage (caveats).

  ## Defining the Edges of Travelling Number Syndrome

  1.  **How it differs from ordinary uncertainty:**
      *   **Ordinary Uncertainty:** Concerns *precision* or *statistical confidence* within the model's *given assumptions* (e.g., "The model predicts a 10% increase, ±2%"). This uncertainty often *does* travel (e.g., "up to 12%").
      *   **TNS:** Concerns the *fundamental validity* or *meaning* of the number *itself* due to forgotten *structural assumptions* (e.g., "This 10% assumes frictionless fluid, which doesn't exist"). This validity caveat gets stripped away. It's about the *framework* generating the number, not the number's *variability* within that framework.
  2.  **How it differs from plain spin:**
      *   **Spin:** Involves *intentional* selection, framing, or distortion of information to present a biased view. It's active manipulation.
      *   **TNS:** Is often *unintentional* and systemic. The caveat exists, is offered freely by the source, but the communication ecosystem (complexity, space limitations, audience comprehension) fails to transmit it effectively alongside the number. It's a *structural failure of communication fidelity*, not necessarily malice. (Though spin artists can *exploit* TNS).
  3.  **Does it happen with terminology/concepts ("discount rate", "phase transition")?**
      *   **Absolutely. This is a core feature of TNS.** The phenomenon extends beyond single numbers to **travelling concepts** or **travelling frameworks**.
      *   **Process:** A complex, model-specific term/concept originates in a technical context with precise, bounded meaning. It gets adopted because it's useful, evocative, or simplifies complex ideas ("tipping point," "herd immunity," "efficiency," "rational actor"). As it travels:
          *   Its precise technical definition is lost or diluted.
          *   The specific assumptions and limitations inherent in its original model-based usage fade.
          *   It becomes a generalized buzzword, often acquiring connotations or implications absent in the original model.
          *   People use it without remembering (or ever knowing) *whose model it came out of* or what constraints were baked into its original calculation.
      *   **Example:** "Herd immunity threshold" travelled widely during COVID. Its calculation depends *critically* on assumptions about mixing patterns, R0, intervention effectiveness – assumptions that were often forgotten in public discourse, leading to overly simplistic interpretations of a single "magic number."

  ## In Summary

  **Travelling Number Syndrome (TNS)** captures the core issue: valuable but simplified model outputs (numbers *or* key concepts) inevitably shed their crucial qualifying assumptions as they move from technical to public/policy spheres. This isn't primarily about malice (spin) or statistical uncertainty, but about the inherent difficulty of transmitting complex structural caveats alongside simplified outputs in a noisy information environment. The caveats are "stuck at the source" not because they are hidden, but because the communication channels are lossy for that specific type of complex, contextual information.

  This is a vital concept for science journalists, policymakers, and scientists themselves to name and understand. "Travelling Number Syndrome" provides a clear, memorable label for this pervasive and often consequential phenomenon. Use it and spread it!
