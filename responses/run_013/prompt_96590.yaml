answer: |-
  ## Pantoum of the Doubtful Shoe

  I sought a raven, black as deepest night,
  To test the rule that binds their feathered kind.
  A white shoe gleamed, a sudden, pallid light,
  A "non-black thing" that reason said I'd find.

  To test the rule that binds their feathered kind,
  Its logic clear, both statements equal stand:
  A "non-black thing" that reason said I'd find
  Supports the claim that governs raven-land.

  Its logic clear, both statements equal stand?
  Yet *how* I saw it matters, truth to tell:
  Supports the claim that governs raven-land?
  This found shoe casts a faint confirming spell.

  Yet *how* I saw it matters, truth to tell!
  I searched my room for things not black, not bird:
  This found shoe casts a faint confirming spell...
  But *why* this sample? Is it not absurd?

  I searched my room for things not black, not bird,
  Selecting objects where exceptions hide.
  But *why* this sample? Is it not absurd?
  My focused quest could turn the evidence tide.

  Selecting objects where exceptions hide –
  I *sought* the non-black, fearing what might be!
  My focused quest could turn the evidence tide:
  The white shoe now suggests uncertainty.

  I *sought* the non-black, fearing what might be!
  If I avoid the ravens' shadowed ground,
  The white shoe now suggests uncertainty –
  A warning sign, in method, might be found.

  If I avoid the ravens' shadowed ground,
  I sought a raven, black as deepest night.
  A warning sign, in method, might be found:
  That white shoe gleamed, a sudden, pallid light.

  ---

  **Notes on Fulfillment:**

  *   **Form:** Uses the strict pantoum structure (ABAB BCBC CDCD... ending with ZAZA), forcing repeated lines ("A white shoe gleamed...", "To test the rule...", "Supports the claim...", "But *why* this sample?") to shift meaning dramatically as context changes.
  *   **Core Paradox:** Explicitly states the logical equivalence ("both statements equal stand").
  *   **White Shoe's Shift:**
      *   Initially presented as simple confirmation: "casts a faint confirming spell" (standard, negligible view).
      *   Shifts dramatically to potential *disconfirmation* when the sampling method (actively searching non-black items) is questioned: "The white shoe now suggests uncertainty," "A warning sign."
  *   **Sampling Focus:** The crux is the *method* ("*how* I saw it," "Selecting objects," "My focused quest," "If I avoid the ravens," "in method, might be found").
  *   **Clarity for New Readers:** The poem tracks an investigator's actions and changing understanding, making the paradox experiential. The shift from seeking confirmation to realizing method-induced doubt is clear.
  *   **Accuracy for Philosophers:** Captures the core insight that confirmation depends on sampling protocol (e.g., selecting *only* non-black things vs. random sampling), not just logical form. The white shoe moves from confirming instance to a sign of potentially biased data collection.
  *   **Key Lines:**
      *   "Yet *how* I saw it matters, truth to tell" introduces the critical sampling dependence.
      *   "But *why* this sample? Is it not absurd?" directly challenges the representativeness.
      *   "My focused quest could turn the evidence tide" explicitly shows the observation lowering the hypothesis's probability under biased sampling.
      *   "A warning sign, in method, might be found" encapsulates the poem's central, less familiar point.
