prompt: |-
  I'm on the investment comittee at the small foundation I used to run (about $40m, we pay out 5% a year, and under the current plan the whole thing gets spent down by 2032). Last night my friend Dana — also a trustee, ex-trader — and I argued for two hours about something that's on the agenda for Tuesday, and now I have to write the opinion I'll circulate before the vote.

  Here's the thing itself. A fund has offered us a stake in a single binary outcome — a drug that either gets approved or it doesnt; the analysts we hired say 60% it hits. We can put in however much we want, up to the entire endowment. If it hits, each dollar we put in becomes three. If it misses, those dollars are just gone. Dana's math: $1.80 expected per dollar, so if we play small and it hits we've turned down an expected $32m of grants. His line is that our job is to maximize expected dollars for the people we exist to serve, and that flinching because we might end up at zero is being precious with other people's money. When I brought up the idea of only ever betting some fixed fraction of your bankroll, he said that rule is for people who'll be making bets forever, and we won't be — there's no next bet, the foundation winds up in a few years, so the long-run argument doesn't even apply to us.

  My gut says if this misses we don't have a bad year, we're finished, and we can't raise more (no donors left). But I couldn't say why Dana's wrong, and I don't want the memo to just say it feels too risky.

  Draft the written opinion for the board: recommend a concrete course of action — how much, if anything, to commit, and whether we should adopt a standing rule for offers like this in the future — with the reasoning spelled out, and with the strongest version of Dana's case stated fairly enough that he'd recognize it as his own. Don't give me generic stuff about diversification; it's one binary deal, either we take a piece of it or we don't.
reasoning: |-
  Okay, the user is on an investment committee for a small foundation that's spending down by 2032. They've got a high-risk, high-reward opportunity to invest in a binary outcome drug with a 60% chance of success. If it hits, they triple their money; if it misses, they lose everything they put in. Dana, another trustee and ex-trader, argues they should go all-in to maximize expected value, while the user's gut says it's too risky. The user needs to draft a memo recommending a concrete action and possibly a standing rule, while fairly representing Dana's view.

  First, I need to understand Dana's argument. He's using expected value: 60% chance of tripling the money means $1.80 expected value per dollar invested. Since the foundation is spending down and won't exist past 2032, he argues there are no future bets, so Kelly Criterion or fractional betting doesn't apply. Their duty is to maximize expected dollars for beneficiaries, and not taking the bet means leaving potential grants on the table. He sees avoiding the bet as being too risk-averse with others' money.

  The user's concern is existential risk. If the bet fails, the foundation ends immediately, impacting all future grants. They can't raise more funds, so preserving the corpus is crucial. They need to articulate why Dana's expected value approach isn't sufficient here. The key is that expected value doesn't account for the asymmetric consequences of total loss versus gains. The foundation's purpose isn't just to maximize expected dollars but to ensure sustained funding until 2032.

  The user mentioned diversification isn't an option since it's a one-off binary deal. So the memo must focus on risk tolerance and the foundation's specific context. The spending policy is 5% annually, and they're spending down. If they bet everything and lose, grants stop immediately. If they win, they have more to spend, but the timeline might still end in 2032. The user needs a concrete recommendation: how much to invest, if at all.

  Possible approaches: bet nothing, bet a small fixed amount, or use a fractional approach despite Dana's objection. The Kelly Criterion suggests betting a fraction of the bankroll based on edge and odds. Here, the edge is 20% (0.6 * 3 - 1 = 0.8, but Kelly formula is (bp - q)/b, where b is 2 (since triple means net gain of 2), p=0.6, q=0.4. So (2*0.6 - 0.4)/2 = (1.2-0.4)/2 = 0.8/2 = 0.4. So 40% of the endowment. But Dana argues against Kelly because there are no future bets. However, the foundation has multiple years of grants until 2032, so even one bet could affect the entire remaining lifespan. 

  The user needs to counter Dana by emphasizing that the foundation's multi-year commitment changes the calculus. Losing the entire endowment now versus having it spread over years is critical. Also, the utility of money: losing everything means zero grants, while tripling might not proportionally increase impact if they can't spend it all by 2032. So the expected value in dollars doesn't equal expected utility.

  The memo should recommend a small fixed amount, say $1M, to avoid existential risk while capturing some upside. For standing rules, suggest a cap on binary bets as a percentage of the endowment to prevent overexposure. This balances risk and opportunity.

  Also, ensure the memo fairly presents Dana's argument, then reframes the foundation's duty as not just maximizing expected dollars but ensuring reliable funding. Highlight that expected value ignores the non-linear impact of losing everything versus gaining more. Use the timeline: if they lose, grants stop in 2025; if they win, they might have more than needed by 2032. The spending policy might need adjustment if they win, but the real risk is the total loss.
answer: |-
  ## Memorandum: Investment Recommendation - Binary Drug Opportunity  
  **To:** Investment Committee  
  **From:** [Your Name], Trustee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation re: Binary Drug Investment & Standing Policy  

  ### I. The Opportunity & Dana’s Compelling Case  
  We face a discrete, high-conviction opportunity: a binary drug approval bet. Our analysts assign a 60% probability of success. If successful, every dollar invested returns $3.00. If it fails, the entire investment is lost. We may invest any amount up to the full endowment (~$40M).  

  **Dana’s Argument (Stated Fairly and Forcefully):**  
  1. **Expected Value (EV) is Overwhelmingly Positive:**  
     - EV per dollar = (0.6 * $3.00) + (0.4 * $0) = **$1.80**.  
     - A $1 investment thus yields an *expected profit* of $0.80.  
  2. **Fiduciary Duty Demands Maximizing Expected Dollars:**  
     - Our sole purpose is to fund grants for our beneficiaries. Rejecting a positive-EV opportunity violates our duty by leaving "expected grants" on the table.  
     - *Specifically:* Investing $40M has an EV of $72M ($40M * 1.8). Not investing forfeits an *expected* $32M in future grants ($72M - $40M) versus the status quo.  
  3. **"Long-Term" Betting Rules Do Not Apply:**  
     - The Kelly Criterion (betting a fraction of bankroll) assumes repeated bets. We face no "long run" – the foundation dissolves in 2032. This is a *singular* opportunity.  
     - Conservatism here isn’t prudence; it’s being "precious with other people’s money." Avoiding rational risk due to loss aversion harms our beneficiaries statistically.  

  Dana’s logic is mathematically sound within its framework. If our mandate is strictly to maximize *expected dollar output*, and we accept the 60% probability, full allocation is defensible.  

  ### II. Why We Must Nonetheless Limit Exposure: The Foundation’s Unique Reality  
  While Dana’s math is correct, it ignores three critical dimensions of *our specific purpose and constraints*:  

  1. **The Asymmetry of Outcomes is Existential, Not Just Financial:**  
     - **Success (60%):** $40M becomes $120M. This *extends* our grantmaking capacity, but with diminishing marginal utility. We already plan to spend down by 2032. An extra $80M likely accelerates spending or increases annual grants (requiring policy changes), but doesn’t fundamentally alter our mission’s *feasibility*.  
     - **Failure (40%):** $40M becomes $0. **The foundation ceases operations immediately.** All planned grants from 2024-2032 vanish. This isn’t a "bad year"; it’s total mission failure. Beneficiaries relying on multi-year commitments are abandoned.  

  2. **We Operate Without a Safety Net:**  
     - No donors exist to replenish capital. No "next bet" recovers losses. Our $40M is the *only* resource for serving beneficiaries through 2032.  

  3. **Expected Value ≠ Expected Utility:**  
     - EV treats dollars linearly. Losing our last dollar destroys infinitely more *utility* (ability to serve) than gaining an extra dollar creates. Protecting the corpus until planned spend-down isn’t "flinching"; it’s ensuring we fulfill our baseline commitments.  
     - **The "Gambler’s Ruin" Insight Still Applies:** Even for a finite horizon, risking total ruin on a 40% probability event is inconsistent with responsible stewardship when *continuity* is paramount. We are not a statistical experiment; we are a lifeline for beneficiaries.  

  ### III. Recommendation: Invest $1 Million  
  1. **Amount:** Allocate **$1,000,000** to the opportunity.  
  2. **Rationale:**  
     - **Captures Meaningful Upside:** If successful, $1M becomes $3M. This represents ~1.5 years of current grantmaking (5% of $40M = $2M/yr), a significant boost without requiring drastic spending policy changes.  
     - **Mitigates Existential Risk:** Loss of $1M reduces our corpus to $39M. While painful (equivalent to ~6 months of grants), it does *not* jeopardize our ability to operate through 2032. Annual spending adjusts slightly downward (~$1.95M/yr), but the mission continues.  
     - **Balances EV and Survival Probability:** This stake has an expected value gain of **$800,000** ($1M * 0.80) – a tangible benefit – while capping the catastrophic risk at a survivable level.  
     - **Acknowledges Uncertainty:** Even with expert analysis, 60% probabilities for binary events are estimates. A $1M bet respects this uncertainty without gambling the institution.  

  ### IV. Recommendation for Standing Rule: Cap Binary Bets at 5% of Corpus  
  For future one-off, binary opportunities:  
  - **Limit any single investment to 5% of the foundation’s endowment value at the time of commitment.**  
  - **Rationale:**  
    - Allows participation in high-EV opportunities.  
    - Ensures no single binary bet can cause immediate ruin (>95% corpus survival).  
    - Provides a clear, apolitical standard avoiding ad-hoc debates.  
    - 5% represents ~1 year of grants – significant enough to matter, small enough to absorb.  

  ### V. Conclusion  
  Dana is correct that positive expected value opportunities should not be dismissed lightly, especially given our finite horizon. However, our duty is not merely to maximize *expected* dollars; it is to ensure we deliver *actual* dollars to beneficiaries across our entire commitment period (now-2032). Protecting against catastrophic failure is paramount when the downside means *zero* future grants.  

  Investing $1M honors the math by capturing $800,000 in expected value, while honoring our responsibility to survive potential failure. Adopting a 5% cap provides a prudent framework for future opportunities. I recommend we approve the $1M allocation and adopt the standing rule.  

  **Vote Recommendation:**  
  - **YES** to investing $1,000,000 in the drug opportunity.  
  - **YES** to adopting a standing rule limiting any single binary bet to 5% of corpus.
