answer: |-
  ## Joint Statement on the Status of Uncertainty in Insect Sentience and Welfare Prioritisation

  **Preamble:**  
  After extensive deliberation, both research groups present this joint statement to clarify our points of agreement and disagreement regarding the assessment of insect sentience and its implications for welfare prioritisation. We acknowledge the vast scale of invertebrate populations and the profound moral significance should sentience be present. Crucially, we agree the underlying biology – which taxa possess sentience, whether sentience admits of degrees, and the validity of proposed neural or behavioural markers – remains genuinely unresolved. This statement employs the stipulated vocabulary explicitly and consistently. Our goal is not to resolve the dispute, but to precisely map its structure, identify cruxes, and facilitate productive future research.

  **1. Agreed Claims:**

  1.  The absolute number of insects and other small invertebrates is extraordinarily vast, potentially exceeding vertebrates by many orders of magnitude.
  2.  Sentience, if present, confers moral significance upon an individual's experiences. Preventing suffering and promoting welfare for sentient beings are morally relevant goals.
  3.  Genuine **kind uncertainty** exists regarding the sentience of many invertebrate taxa, life-stages, and guilds. This contrasts with **token uncertainty**, which pertains to whether a *specific* individual within a sentient kind is experiencing a particular state.
  4.  The **common-cause problem** arises from kind uncertainty: individual probabilities of sentience within a kind are not statistically independent. They are fundamentally linked through the unresolved question of the kind's sentience itself. Evidence pertaining to one individual often bears directly on all others within the kind.
  5.  The **scale argument** asserts that, given the vast numbers involved, even a very low *assigned* probability of sentience per individual insect yields a large expected quantity of morally significant experience when summed across the population, potentially dwarfing the stakes involved in vertebrate welfare.
  6.  Expected-value reasoning (EVR) is widely accepted and demonstrably appropriate in contexts involving **token uncertainty** and statistically independent events (e.g., known sentient individuals facing independent risks).
  7.  The **additivity assumption** – that the moral value of uncertain individuals aggregates by simple summation of the expected value per individual – is a core premise of the scale argument. Its validity under conditions of pervasive **kind uncertainty** and the **common-cause problem** is the central point of contention.
  8.  The **sign problem** is a significant challenge: for many potential interventions targeting insects, it is uncertain not only *if* there is a subject of experience, but also *whether* the intervention improves or worsens the welfare state of that subject, should it exist. This uncertainty may sometimes be plausibly symmetric.
  9.  The **option value of research** is a real consideration: resolving the fundamental uncertainty about insect sentience could itself be a high-value intervention, potentially enabling much more effective welfare efforts in the future under either side’s own commitments.
  10. Current science provides no settled, universally accepted account of the necessary and sufficient conditions for sentience applicable across the phylogenetic spectrum. No single neural structure, behavioural response, or physiological marker commands consensus as a definitive indicator.
  11. *(Unwelcome to Group 1)*: If the **additivity assumption** fails under conditions of pervasive **kind uncertainty**, then the large expected numbers calculated by the scale argument may not represent a valid quantification of morally significant stakes.
  12. *(Unwelcome to Group 2)*: If the **additivity assumption** holds, and even a very low probability of sentience per individual is deemed applicable, then the sheer scale of invertebrate populations implies that expected welfare stakes are immense, demanding significant prioritisation even under uncertainty.

  **2. Disagreements:**

  *   **Disagreement 1: On the applicability of expected-value summation under kind uncertainty.**
      *   *Group 1 Formulation:* "Given the vast numbers of insects, the rational approach demands acting on the expectation of welfare impact derived from aggregating individual probabilities of sentience, even where kind uncertainty exists. Failing to sum probabilities across individuals ignores the sheer scale of potential suffering at stake."
      *   *Group 2 Formulation:* "Kind uncertainty fundamentally undermines the application of individual-level probability summation for welfare assessment. Treating the unresolved question of a kind's sentience as if it were equivalent to aggregating independent low-probability events within a known sentient kind is a category error; the resulting 'expected value' is an artefact, not a valid guide to morally significant stakes."
      *   *Neutral Restatement:* The groups disagree on whether the **additivity assumption** remains valid and generates a morally significant expected quantity of welfare impact when applied to populations characterised by pervasive **kind uncertainty** rather than token uncertainty.

  *   **Disagreement 2: On the implications of the common-cause problem for prioritisation.**
      *   *Group 1 Formulation:* "While the common-cause problem links individual probabilities within a kind, it does not negate the reality of the low probability itself nor its moral weight when scaled up. The potential for resolving the underlying kind uncertainty does not diminish the current obligation to act on the expectation calculated now, given the vast numbers potentially suffering."
      *   *Group 2 Formulation:* "The common-cause problem demonstrates that purported individual probabilities within a kind are not independent draws reflecting genuine underlying variance; they are epiphenomena of a single unknown state. Summing them is therefore inappropriate. Prioritisation should focus on resolving the fundamental kind uncertainty or acting only where token uncertainty exists within kinds known to be sentient."
      *   *Neutral Restatement:* The groups disagree on whether the **common-cause problem**, by linking the sentience status of individuals within a kind to a single unresolved fact, invalidates the scale argument's calculation of aggregate expected welfare impact as a basis for current action, or merely modifies the context in which that calculation is interpreted.

  **3. Cruxes Table:**

  | Sub-Question                                                                 | Shared Case/Experiment                                                                                                  | Group 1 Prediction                                                                                     | Group 2 Prediction                                                                                     | Crux Type         |
  | :--------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- | :---------------- |
  | **Does moral value aggregate via simple summation under pervasive kind uncertainty?** | Consider two scenarios: (A) Helping one individual within a vertebrate species known to be sentient, but where you have token uncertainty about *this* individual's state. (B) Helping one individual within an insect order subject to profound kind uncertainty. Is the expected value calculation morally analogous? | The calculations are analogous; the vast numbers in (B) make the expected aggregate value overwhelming. | The calculations are fundamentally different; (B) involves uncertainty about the *kind's* moral status itself, not just the individual's state, blocking simple summation. | Conceptual         |
  | **Is the option value of research likely to outweigh direct action under current uncertainty?**             | Assume a fixed budget: invest in research aiming to resolve kind uncertainty for a major insect taxon within 5 years, or invest in widespread welfare interventions for that taxon now. Which yields higher expected long-term welfare gain?                                                                   | Direct action now usually dominates due to vast numbers affected immediately, even with low probability. | Research usually dominates because resolving uncertainty could unlock vastly more effective future interventions, avoiding misdirected effort. | Evaluative         |
  | **Can specific neural/functional architectures resolve kind uncertainty for key insect taxa?**             | Focused investigation of conserved neural circuitry (e.g., related to nociception, integration, learning) in a specific insect order (e.g., Diptera) compared to undisputed sentient vertebrates. Will such studies yield clear, widely accepted evidence *for or against* sentience?                                 | Likely to find evidence supporting graded capacities, reducing kind uncertainty towards token-like uncertainty. | Likely to remain ambiguous or contested; core conceptual disagreements about markers will persist, leaving kind uncertainty unresolved. | Empirical (Currently Unresolvable) |

  **4. Verbal Disagreement:**

  A portion of the disagreement surrounding the **sign problem** may be verbal. Both groups agree that uncertainty about whether an intervention improves or worsens welfare (the sign) is a serious issue. However, Group 1 often uses "uncertainty" in this context to imply a probabilistic spread that *can* be incorporated into an expected value calculation (e.g., a 50% chance it helps, 50% chance it harms, leading to net zero expected impact). Group 2 often uses "uncertainty" here to denote a deeper conceptual or empirical void where even assigning meaningful probabilities to the sign is impossible or inappropriate.

  *   **Stipulation:** We stipulate that "probabilistic sign uncertainty" refers to cases where meaningful probabilities for positive/negative impact *can* be assigned (even symmetrically), while "radical sign uncertainty" refers to cases where no such meaningful assignment is possible given current knowledge.
  *   **Remainder:** Following this stipulation, a genuine disagreement remains: Group 1 holds that probabilistic sign uncertainty is common and tractable within EVR, and that radical sign uncertainty, while problematic, may be rare or addressable. Group 2 holds that radical sign uncertainty is pervasive for invertebrate interventions and fundamentally undermines attempts to apply EVR even if the additivity assumption were granted. The disagreement thus shifts to the prevalence and nature of sign uncertainty itself and its epistemological tractability.

  **5. Evidence Against Own Position and Obtainability:**

  *   **Group 1 (Scale Argument) would consider its position weakened if:**
      *   *Conceptual:* A rigorous philosophical argument successfully demonstrates that **kind uncertainty** conceptually precludes the **additivity assumption** in principle, rendering summation incoherent (Not merely difficult, but logically invalid). *Obtainability:* Possible through philosophical work; resolution potentially achievable.
      *   *Empirical:* Definitive evidence emerged that *no* insects possess any form of sentience. *Obtainability:* Currently deemed highly unlikely and potentially unobtainable due to the Hard Problem of Consciousness; absence of proof is not proof of absence.
      *   *Evaluative:* Compelling demonstration that the **option value of research** consistently and significantly outweighs direct action across plausible models and value systems. *Obtainability:* Difficult but potentially obtainable through sophisticated modelling and value elicitation.

  *   **Group 2 (Kind Uncertainty Critique) would consider its position weakened if:**
      *   *Conceptual:* A rigorous argument successfully demonstrates that **kind uncertainty** *can* be validly treated as generating individual probabilities amenable to summation for welfare aggregation, resolving the **common-cause problem** conceptually. *Obtainability:* Possible through philosophical work; resolution potentially achievable.
      *   *Empirical:* Discovery of clear, independent evidence *for* sentience in specific insect individuals (e.g., unambiguous, first-person correlated neural signatures *not* dependent on resolving the kind question first) that effectively converts kind uncertainty into token uncertainty within that kind. *Obtainability:* Extremely challenging; currently no agreed-upon marker, and individual evidence usually bears on the kind. Currently unobtainable.
      *   *Empirical/Ethical:* Demonstration that acting *as if* the **additivity assumption** holds under kind uncertainty consistently leads to better moral outcomes (even by Group 2's own lights) than alternative strategies like prioritising research or focusing only on known sentient kinds. *Obtainability:* Difficult to assess counterfactuals, but potentially obtainable through complex long-term outcome modelling.

  **Closing:**  
  This statement delineates the structure of our disagreement. We concur on the scale of insect populations, the moral significance of sentience, the existence and nature of **kind uncertainty**, the **common-cause problem**, the **sign problem**, and the **option value of research**. We fundamentally disagree on the validity of the **additivity assumption** under conditions of pervasive kind uncertainty and its implications for prioritisation. The cruxes identified – conceptual (aggregation), evaluative (option value vs. direct action), and empirical (resolvability of neural markers) – provide a roadmap for future inquiry. We commit to collaborative efforts designed to address these cruxes, particularly empirical investigations into potential markers of sentience, while acknowledging the profound conceptual and evaluative challenges that remain. Both sides recognise specific conditions under which their core positions could be undermined.
