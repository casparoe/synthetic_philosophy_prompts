prompt: |-
  I'm in my second year of archaeology and our lecturer has one line he deploys whenever somebody questions an interpretation: 'the present is the key to the past.' Most recently I said I couldn't see how you get from a handful of pierced animal teeth in one grave to 'this person had a special ritual role', and he just said it again, like that settled it. A different tutor told us that some past environments and communities have no modern analogue at all, which seems to cut the other way, so now I dont really know what the line is even supposed to mean. Can you break out the different precise claims it could be making — from the trivial to the radical — and say for each one whether it's a platitude, a real substantive thesis, or something that's just false? And tell me which reading he'd need to be using for it to actually license reading beliefs and roles off the objects, versus which readings people usually mean when they say it. Lay it out as a list, I'm going to ask him about it after the lecture.
