prompt: |-
  I have spent a long time reading and arguing in rationalist-adjacent forums, and I have never managed to say what I actually mean by wireheading. I have a set of verdicts I would defend in a real argument, and I want to know what principle, if any, they add up to, and what it would cost me to keep that principle.

  Here are my verdicts.

  1. The textbook case, whatever its historical accuracy: a rat with an electrode in its pleasure center, pressing a lever until it stops eating and dies. Wireheading. Not a hard case.

  2. A person with severe depression who takes an SSRI and, for the first time in years, enjoys their friends and their work. Not wireheading. I do not think it is even close.

  3. A person who decides, on reflection, that their ambition was mostly a status drive, and deliberately sets about wanting other things — new hobbies, different friends, new habits of attention — until the old goals no longer pull at them. Not wireheading. If anything, admirable.

  4. A person with a brain implant that produces a continuous, unvarying sense of contentment, independent of what happens to them. Wireheading. This is my paradigm case.

  5. A person who takes a drug that does not make them happier but makes them stop caring that they are not happy — they lose the goal rather than reach it. I say wireheading, or near enough.

  6. An AI that, instead of solving the problem it was given, rewrites the part of itself that reports its score. Reward tampering. This is the case I would use to teach the concept.

  7. An AI that, instead of solving the problem, talks its human supervisor into signing off on a false report. I want to call this tampering too, but I notice it looks different: the AI never touched its own machinery; it changed the world, and specifically it changed a person.

  8. A company that, instead of improving its product, spends its effort getting the accounting rules changed so that its product scores better. My gut says gaming, not wireheading, but I cannot say why this differs in kind from case 6.

  9. A field that abandons a metric it has decided was a bad proxy and adopts a better one, deliberately and in public. Not tampering. This one feels obviously fine.

  10. A person who, having been told they will fail at a task, comes to find the task genuinely less interesting — and now reports, honestly and accurately, that they no longer care about it. I cannot get a stable verdict here. Sometimes this seems like case 3 and sometimes like case 5.

  The pattern I keep reaching for is something like: wireheading is when you change the measure instead of the thing measured, and tampering is when you change the signal instead of the world. But that principle makes 2 and 4 come out the same — both directly change my affect without changing my circumstances — and my verdicts on 2 and 4 are firm and opposite. It also makes 3 and 5 come out the same — both change what I want without changing the world — and again my verdicts differ. So either the principle is wrong or one of my verdicts has to go.

  Tell me what principle, or small set of principles, actually covers these. State it precisely enough that I could apply it to a new case without asking you again. For each clause, tell me which case forces it. Then apply the result to cases I have not listed, at least these three: a person who prays or meditates until their desires change; a company that hires a lobbyist to change the metric versus a company that improves the product; and a person who takes a drug that makes a boring task seem interesting rather than merely tolerable. Finally, be honest about which of my ten verdicts your principle cannot accommodate. I would rather lose a verdict than keep a principle that survives only because I never stated it. If you think the right answer is that wireheading is not one thing, say so, and give me the several things, with the case that separates each pair.
reasoning: |-
  Okay, the user has presented a complex philosophical problem about defining "wireheading" across various scenarios. They've clearly spent considerable time grappling with this concept in rationalist circles but feel unsatisfied with existing definitions. Their frustration with inconsistent verdicts across cases is palpable - especially the tension between cases 2/4 and 3/5 where similar mechanisms (changing internal states) yield opposite moral judgments.

  Hmm... what's really at stake here? Beyond just taxonomy, they seem to be wrestling with:
  - The ethics of self-modification (when is altering desires/affect legitimate vs cheating?)
  - The ontology of value (what makes a goal "authentic"?)
  - The fear of self-deception (how to distinguish wise preference-shifts from cowardly evasion)

  The key insight emerges when I notice their paradigm cases (1,4,5,6) all involve disconnecting valuation from reality-tracking. That rat isn't experiencing pleasure from actual food, the contentment implant isn't responding to life events, the apathy drug bypasses problem-solving. Whereas their "acceptable" cases (2,3,9) maintain feedback loops: SSRIs restore normative functioning, deliberate value-shifts align with reflection, metric reforms improve measurement fidelity.

  Ah! The unifying principle seems to be whether the intervention preserves or severs the connection between internal states and external states. But that's not enough - case 3 (deliberate value shift) works because it's conscious and reality-oriented, while case 5 (apathy drug) feels like cheating because it's passive and disconnect-inducing.

  For the AI cases, the distinction crystallizes: tampering occurs when the score/report no longer tracks the intended target, whether by self-modification (6) or deception (7). Case 8 (lobbying) is tricky because changing metrics isn't inherently wrong (as in 9), but becomes "gaming" when done deceptively rather than transparently.

  The prayer/meditation case will test whether conscious effort matters more than mechanism. The boring-task drug reveals their discomfort with pharmacological value-alignment - if it makes work meaningful, is that self-actualization or manipulation?

  Notably, case 10 remains unstable because context determines whether the desire-shift is adaptive (accepting realistic limitations) or defensive (avoiding growth). This exposes the limitation of any bright-line rule - sometimes wireheading is in the eye of the beholder.

  The user's intellectual honesty is admirable. They'd rather abandon a verdict than force consistency. This suggests the solution might be accepting that "wireheading" isn't monolithic but clusters around:
  1. Reality-disconnect (1,4,5)
  2. Measurement-corruption (6,7)
  3. Bad-faith gaming (8 when covert)

  ...with edge cases (3,10) requiring contextual judgment about agency and truth-relations.
answer: |-
  Your verdicts reveal a coherent principle—it's just more precise than "changing the measure instead of the thing measured." **Wireheading/tampering occurs when an agent *severs the feedback link* between their values/goals and the state of the world, making their internal state (or reported score) *non-responsive* to reality.** Crucially, this must be **non-consensual with the agent's own core values** or **opaque to their understanding**. 

  Here's the formal principle:

  **The Feedback-Severs Principle (FSP):**  
  An intervention constitutes wireheading/tampering iff:  
  *(a)* It disconnects the agent's valuation mechanism (e.g., happiness, goal satisfaction) from the *actual state of the world* it purports to track, AND  
  *(b)* This disconnection *bypasses* or *subverts* the agent's reflective endorsement (for humans) or intended goal-architecture (for AIs/systems).  

  ---

  ### **How FSP Explains Your Cases**  
  | Case | Verdict | Why FSP Applies |  
  |------|---------|----------------|  
  | 1. Rat | Wireheading | Electrode severs feedback: pleasure no longer tracks survival needs (food). Rat can't reflect. |  
  | 2. SSRI | Not | SSRI *restores* feedback: mood now *responds* to friends/work (world-state). Aligns with patient's values. |  
  | 3. Value shift | Not | Conscious reflection *updates* values. Feedback preserved: new desires respond to world (e.g., hobbies). |  
  | 4. Contentment implant | Wireheading | "Contentment" is *fixed*, unresponsive to world-state (e.g., disaster = same feeling). Severs feedback. |  
  | 5. Apathy drug | Wireheading | Losing the goal *without* resolving its cause severs feedback. Happiness-state now ignores world. |  
  | 6. AI self-rewrite | Tampering | Score no longer tracks actual problem-solving (world-state). Bypasses goal-architecture. |  
  | 7. AI deceives human | Tampering | Score is *false*; no longer tracks world-state. Subverts intended goal (truthful reporting). |  
  | 8. Accounting rule change | Gaming, not wireheading | Metric still *tracks world* (just a worse proxy). Not severed feedback—just bad measurement. |  
  | 9. Metric reform | Not | New metric *better* tracks the target (e.g., user value). Feedback improved, not severed. |  
  | 10. "Sour grapes" | **Unstable** (FSP explains why) | If desire shift *reflects acceptance* (world-state: low odds of success), not wireheading. If *self-deception* (ignoring world-state), wireheading. |  

  ---

  ### **Applied to New Cases**  
  1. **Person praying/meditating until desires change:**  
     - **Not wireheading** if desires shift via *insight* (e.g., "I now see family matters more than status"). Feedback preserved: new values respond to world/reason.  
     - **Wireheading** if it induces *delusion* (e.g., "I now feel content with failure via forced dissociation"). Severs feedback.  

  2. **Company hires lobbyist vs. improves product:**  
     - **Lobbyist to change metric:**  
       - If metric becomes *worse proxy* (e.g., lobbying for loopholes), **gaming** (like Case 8). Feedback degraded but not severed.  
       - If metric becomes *detached from reality* (e.g., bribing auditors to falsify reports), **tampering** (like Case 7). Feedback severed.  
     - **Improves product:** **Not wireheading** (like Case 2). Feedback improved.  

  3. **Drug makes boring task seem interesting:**  
     - **Wireheading** if interest is *chemically induced* regardless of task value (e.g., scrubbing floors feels like art). Severs feedback: interest no longer tracks task properties.  
     - **Not wireheading** if drug *removes barriers* to engagement (e.g., ADHD meds helping focus on genuinely meaningful work). Feedback restored.  

  ---

  ### **What Your Principle Cannot Accommodate**  
  - **Case 10 ("Sour Grapes")** remains unstable under FSP because it hinges on *why* the desire shifted:  
    - **If adaptive** (e.g., "I see this goal is unrealistic, so I reorient"): Feedback *preserved* (world-state: low success odds → value update).  
    - **If defensive** (e.g., "I can't admit I failed, so I numb my desire"): Feedback *severed* (desire suppressed, not updated).  
    **FSP forces you to abandon a fixed verdict here.** Context determines if it's wireheading.  

  - **Case 8 (Accounting rule change)** is correctly "gaming" under FSP, but your gut *wanted* it closer to wireheading. FSP insists: as long as the metric *tracks something real* (even poorly), it’s not tampering.  

  ---

  ### **Why This Works**  
  - **FSP resolves your contradictions:**  
    - Case 2 (SSRI) vs. 4 (implant): SSRIs *enable* feedback (mood responds to world); implant *disables* it.  
    - Case 3 (value shift) vs. 5 (apathy): Value shift *updates* feedback; apathy *destroys* it.  
  - **It handles AI/human symmetry:** Tampering = severing feedback in goal systems (machine *or* human).  
  - **It avoids moralizing:** Focuses on *functional integrity* of valuation, not "naturalness" or "virtue."  

  **Cost of Keeping FSP:** You must accept that wireheading is *functional* (not ontological) and that Case 10 demands context. But this reflects reality: a desire shift can be wise or cowardly, and only the latter severs feedback.  

  **Final Note:** Wireheading *is* one thing: **corrupting the truth-tracking link between mind and world.** What varies is *how* (drugs, AI hacks, self-deception) and *why* (defense vs. growth). FSP captures this.
