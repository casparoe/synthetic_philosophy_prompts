prompt: |-
  I'm putting together an episode for a small philosophy podcast and the guest is a philosopher who defends a version of the Dennett-ish idea that the self is a centre of narrative gravity. Her twist is that she thinks the narrative isn't authored by the person at all -- it's co-authored and continuously maintained by other people, institutions, group chats, medical records, gossip, the lot. She calls it distributed narrativism. She's got alot of fans and I don't want to just tee her up, and she's also annoyingly good at deflecting with a line about that just being the social side of the story whenever anyone presses her on first-person authority. Can you draft me eight to ten interview questions that actually get somewhere? I want at least one each on: how her view differs from plain Dennett (where's the gravity if there's no single author?); what happens to the self in cases like advanced dementia or dissociative identity; and whether distributed narrativism can avoid collapsing into the claim that selves are just social constructions. For each of those, add a follow-up keyed to the answer she's most likely to give. Also throw in a couple on whether there's any first-person authority left, and one on what would count as evidence against the view. There's a seperate case I keep thinking about: a man in a coma whose family keep telling his story to each other and to him, so when he wakes up he inhabits a self he never authored. I'd like at least one question on that. Don't ask her what got her into philosophy or what she's reading. Keep it in the weeds.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who advocates for "distributed narrativism," a twist on Dennett's idea of the self as a center of narrative gravity. The twist is that the narrative isn't authored by the individual but co-created by others, institutions, and social elements. The user wants challenging questions that push beyond the guest's typical deflections, especially on first-person authority. 

  First, I need to understand the core of her theory. Distributed narrativism posits that the self is a narrative maintained externally—medical records, gossip, group chats, etc. The key challenge is that she often deflects critiques by saying they only address the social aspect. So, the questions must bypass this by forcing her to confront the implications for personal agency.

  The user has specific areas to cover: differences from Dennett, cases like dementia or DID, avoiding reduction to social construction, first-person authority, evidence against the theory, and the coma case. Each needs a main question and a follow-up anticipating her deflection. 

  For the Dennett comparison, the main question should target the "center of gravity" metaphor. Dennett still sees the individual as the author, but she removes that. The follow-up needs to challenge how coherence emerges without a central author. Her likely response is emergent order, so the follow-up should press on conflicting narratives.

  On dementia/DID, the question must address fragmentation. Her deflection might be that the self persists through external narratives. The follow-up should question if this reduces the person to a passive object, especially in dementia where internal narrative is gone.

  Avoiding social construction collapse is tricky. If she claims it's a distinct ontological category, the follow-up needs to push on explanatory power versus just relabeling. 

  For first-person authority, the main question challenges the sense of ownership. Her deflection about the "social side" needs a follow-up that forces her to address the pre-reflective self or face eliminativism.

  Evidence against the theory is crucial. She might dismiss counterexamples, so the follow-up should demand what would falsify it, pushing for testable claims.

  The coma case is perfect for narrative imposition. The follow-up should question if the waking self is authentic or coerced, targeting autonomy.

  I should ensure questions are concise, avoid biography, and stay in the weeds. Each question must corner her into deeper explanations without letting her retreat to deflections. The structure: main question, follow-up based on predicted response. Need to cover all requested areas without overlap, keeping it to 8-10 questions total.

  Also, the user mentioned her annoying deflection about the "social side," so questions must preempt that. For example, on first-person authority, directly challenge the phenomenology she sidesteps. The coma case illustrates narrative without agency, so it's a strong example to include.

  Finally, check that all user points are addressed: Dennett difference, dementia/DID, social construction collapse, first-person authority, evidence, coma case. Aim for incisive questions that provoke new insights, not just rehashing her usual points.
answer: |-
  Here are 10 tightly focused questions designed to push past deflections and get to the core tensions in distributed narrativism, incorporating your specific requests and anticipating common responses:

  1.  **Core Distinction from Dennett:** "Dennett's 'center of narrative gravity' metaphor implies a *center* – a locus where narratives converge, even if authored by subsystems. If the narrative is fundamentally *distributed* across others and systems, lacking a single authoring source, what exactly constitutes the 'gravity' holding *this specific* self-narrative together? Where is the center?"
      *   *Likely Deflection/Response:* "The gravity emerges from the dynamic network itself, the patterns of reinforcement and circulation."
      *   **Follow-Up:** "But networks generate *multiple*, often conflicting narratives about a person simultaneously (e.g., work persona vs. family gossip). What prevents distributed narrativism from resulting in multiple, fragmented 'centers of gravity' for one biological entity, rather than one coherent self?"

  2.  **The Dementia Challenge:** "In advanced dementia, the internal capacity for narrative self-construction is severely diminished or absent. According to distributed narrativism, is the self *primarily* sustained by external narratives (medical charts, caregiver stories, family memories)? And if so, does this mean the deeply demented person *is* the self constructed *for* them by others, even if radically disconnected from their current internal state?"
      *   *Likely Deflection/Response:* "The self persists precisely *through* those sustaining social narratives, even as internal capacities fade. It's about the narrative being maintained *around* the individual."
      *   **Follow-Up:** "Doesn't this risk reducing the person to a purely passive object of others' stories? Where is the 'selfhood' in that scenario, beyond being a character in someone else's narrative?"

  3.  **Dissociative Identity Disorder (DID) Stress Test:** "DID presents distinct alters with their own memories, behaviors, and often reported sense of self. Distributed narrativism would presumably see these as distinct narratives maintained by the system and potentially external observers. Does your view entail that *each alter* is a distinct distributed self? And if so, how does this differ from simply saying there are multiple biological individuals?"
      *   *Likely Deflection/Response:* "It highlights how different narrative clusters can crystallize around different behavioral patterns and social recognitions within one body."
      *   **Follow-Up:** "If the narratives supporting different alters are generated *internally* by the same brain/system (even if experienced as distinct), doesn't this reintroduce a crucial, internal source of narrative generation that distributed narrativism seeks to downplay?"

  4.  **Social Construction Collapse:** "Critics might argue distributed narrativism is just a rebranding of strong social constructionism about the self – the self is *nothing but* a product of social forces and attributions. How does your view *fundamentally differ* from that claim? What, if anything, resists being *fully* constructed by the distributed network?"
      *   *Likely Deflection/Response:* "It emphasizes the *specific mechanisms* (records, chats, gossip, institutions) and the *continuous, distributed process* of co-authoring, not just abstract social forces. It's about the ontological category being a narrative *itself*."
      *   **Follow-Up:** "If the self *is* the narrative, and the narrative *is* entirely constructed by the distributed network, how is this materially different from saying the self *is* a social construction? What unique explanatory power does the 'narrative' framing add beyond the social construction label?"

  5.  **First-Person Authority - The Core Challenge:** "You often note that challenges based on first-person experience only address the 'social side'. But the *phenomenology* of selfhood – the raw feeling of being *me*, of authorship (even if illusory), of privileged access to my own thoughts and sensations – seems utterly central. How does distributed narrativism account for this powerful, persistent *sense* of first-person authority and interiority, if the narrative is authored elsewhere?"
      *   *Likely Deflection/Response:* "That sense *itself* is a product of the narrative! We learn to interpret internal states through social narratives about minds and selves."
      *   **Follow-Up:** "But doesn't this risk becoming circular? The *feeling* of being the author is explained by the narrative, which is authored by others who also have the *feeling* of being authors... What breaks this circle? Is the pre-reflective sense of 'mineness' (e.g., Gallagher's minimal self) *also* just a distributed narrative effect?"

  6.  **First-Person Authority - Resistance & Revision:** "Can a person actively *resist* or *radically revise* the dominant distributed narrative about them (e.g., coming out, rejecting a family narrative, whistleblowing)? If so, doesn't this imply a source of agency and self-definition that *isn't* purely derived from the current distributed narrative?"
      *   *Likely Deflection/Response:* "Such acts leverage *alternative* distributed narratives (subcultures, new communities, different institutional records) or exploit contradictions *within* the existing network."
      *   **Follow-Up:** "Doesn't the *impulse* to resist, the *choice* of which alternative narrative to embrace, and the *persistence* in maintaining that new story against the old network suggest a locus of agency that *precedes* and *utilizes* distributed narratives, rather than being constituted by them?"

  7.  **The Coma Case - Narrative Imposition:** "Consider a man in a long coma. His family, friends, and medical team maintain a rich narrative about 'him' – his personality, values, past deeds, future hopes – talking *to* him and *about* him constantly. He wakes up with amnesia and gradually absorbs *their* narrative as his own identity. Does distributed narrativism see this as a paradigmatic case of self-formation? Is the man who wakes up the 'author' of that self, or merely its inheritor?"
      *   *Likely Deflection/Response:* "It perfectly illustrates the primacy of the distributed network in sustaining and constructing the self, even in the absence of internal contribution. He becomes the subject *of that narrative*."
      *   **Follow-Up:** "If he later recovers hidden memories or develops desires profoundly at odds with this inherited narrative, and rejects it, does that mean the distributed narrative *failed* to constitute his 'true' self during the early awakening period? Or was that simply one self-narrative being replaced by another distributed narrative?"

  8.  **Evidence Against - Falsifiability:** "What kind of empirical finding or thought experiment would constitute strong evidence *against* distributed narrativism? What scenario, if demonstrated, would force you to significantly revise or abandon the core claim that the self *is* the distributed narrative?"
      *   *Likely Deflection/Response:* "Demonstrating a stable, coherent self existing entirely independently of *any* social interaction, language, or external record-keeping would challenge it. But such a thing is likely impossible for humans."
      *   **Follow-Up:** "Isn't that an unfalsifiable standard? If the theory can only be challenged by an impossible scenario (a truly isolated human), does it risk becoming a truism – 'all human selves involve social narratives' – rather than the stronger claim that the self *is identical to* that distributed narrative?"

  9.  **The "Gravity" Revisited - Coherence vs. Fragmentation:** "Building on the network idea: the internet is a vast distributed network generating countless narratives. Yet, it often produces fragmentation, noise, and conflict, not cohesive 'centers of gravity'. Why should the distributed narratives around an individual reliably cohere into a single, stable-enough 'self' rather than a chaotic mess? What force ensures sufficient integration?"
      *   *Likely Deflection/Response:* "Biological continuity, institutional frameworks (legal ID, medical history), and core social groups (family, close friends) act as stabilizing nodes and feedback loops, reinforcing a dominant narrative cluster."
      *   **Follow-Up:** "But doesn't acknowledging the crucial stabilizing role of the biological individual's *continuity* and specific *social embeddedness* effectively reintroduce the individual organism and their immediate relationships as the *real* 'center', with the broader distribution being merely supportive context?"

  10. **Practical Implications - Responsibility:** "If the self is a distributed narrative, how do we assign responsibility? If a person's actions are shaped by narratives authored by institutions, group chats, and gossip, to what extent is *the individual* (as the narrative center) truly responsible, versus the network that authored the narrative leading to the action?"
      *   *Likely Deflection/Response:* "Responsibility also becomes distributed. We hold the narrative center accountable *as a node in the network*, but also examine the contributing narratives from institutions, peers, etc."
      *   **Follow-Up:** "Doesn't this risk diffusing responsibility to the point of incoherence? If the 'node' (the individual) is *constituted* by the network, how can it be a meaningful locus of *accountability*? Isn't the legal concept of responsibility fundamentally reliant on a more robust notion of individual agency?"

  **Key Tactics Used:**

  *   **Pre-empting the "Social Side" Deflection:** Questions 5 & 6 directly target the phenomenology and agency associated with first-person perspective, forcing engagement beyond "it's just the social aspect."
  *   **Concrete Cases:** Dementia (Q2), DID (Q3), Coma (Q7) provide specific, hard-to-dodge scenarios that test the theory's limits.
  *   **Demanding Distinctions:** Q4 directly challenges the "not just social construction" claim, demanding unique explanatory value.
  *   **Pressing Metaphors:** Q1 & Q9 attack the core "center of gravity" and "narrative" metaphors when authorship is removed.
  *   **Falsifiability:** Q8 forces consideration of the theory's empirical stakes and potential weaknesses.
  *   **Following the Logic:** Follow-ups (especially Q2-F, Q3-F, Q4-F, Q5-F, Q7-F, Q9-F) are designed to take her most probable initial answer and push it to a potentially uncomfortable or revealing conclusion.
  *   **Avoiding Softballs:** No intros, bios, or reading lists. Straight into the conceptual deep end.

  Good luck with the interview – these should make for a lively and substantive discussion!
