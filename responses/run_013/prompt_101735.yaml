prompt: |-
  I moved to a new city about three months ago, and last week I ended up listening to two friends, Rana and Devi, spend most of a dinner going round and round about how much of the local etiquette I am actually bound by. The question is not academic for me, but I kept out of it — they were arguing with each other, not with me — and I would now like it settled properly.

  Here is the exchange as best I can reconstruct it. The three things in dispute are the ones I keep getting wrong: leaving a tip at the café (where a service charge is added automatically but a cash tip is still expected), queueing for the tram (a loose line, with the local custom that you may leave your place to sit down or buy a ticket and reclaim it by asking who is last), and crossing the road on a red light, which is against the law here but which everybody, locals included, does the moment the road looks clear.

  Rana opened by saying that I am obliged to leave the tip, to hold my place in the queue properly, and to wait for the light rather than crossing on red with everyone else. Her reason was the familiar one: when you are a guest somewhere, you follow the house rules.

  Devi said the three cases are not alike and cannot be covered by one slogan. The tip moves money to a worker who is paid on the assumption that she will receive it, so that is a question of what she is owed. Queueing and waiting for the light are, in her words, pure coordination — any workable arrangement would do, and the local one is simply what everyone happens to have settled into. She said Rana was treating a coordination equilibrium as though it were a moral requirement.

  Rana replied that the difference Devi was drawing matters less than she thinks. Each of the three conventions, whatever its origin, is something other people rely on: the café worker counts on the tip as part of her wage; the queue works because each person keeps their place; the drivers at the crossing rely on pedestrians not to step out. On Rana's account the obligation is not owed to the convention as such but to the people whose expectations it has stabilized — you wrong them by defeating a reliance you knew they had. She added that there is also a force to the done thing itself: once a practice is firmly entrenched, the mere fact that it is what is done here becomes a reason for a newcomer, quite apart from whether the practice is a good one.

  Devi said that if reliance is the test it proves too much and too little at once. Look at the crossing: nobody relies on pedestrians waiting, because the standing local practice is that everyone crosses when the road is clear and the drivers know it perfectly well. So by Rana's own standard I wrong no one by crossing on red, since the convention that actually operates here is the practice, not the statute. And that undercuts the slogan she began with: if what binds the guest is the local practice rather than the official rule, then the rule about following local rules tells me to cross on red along with everybody else. As for the "force of the done thing," Devi said that this is just the force of the majority's preferences, and a preference is not an obligation.

  Rana answered that this misses the asymmetry between hosts and guests. Locals get to live by the practice; the visitor is held to the rule. Nobody minds when a local crosses on red, but people notice and resent it when a foreigner does. So the norm that applies to me is not the locals' actual behaviour but the standard the locals apply to outsiders — and those are two different things. There is, she said, a convention about how strictly visitors are held to conventions, and that second-order convention is what binds me.

  Devi said that if the binding norm is simply whatever the locals will resent me for ignoring, then we have stopped talking about morality and started talking about prudence. Avoiding resentment is a reason, but it is not the kind of reason that makes an action obligatory; it makes it advisable. Rana said the two cannot be pulled apart that cleanly, because part of what it is to wrong someone is to disregard a legitimate expectation they hold of you, and the locals' expectation that a guest will be scrupulous is not obviously illegitimate.

  They left it there, and neither convinced the other. I would like a real adjudication rather than a verdict on who "won." Please go through the exchange move by move, saying where each of them is right and where each overreaches, and then tell me what both of them are missing. I am especially interested in three things: (a) whether the three conventions really do fall into different categories, or whether Rana is right that a single reliance-based account covers all of them; (b) whether the host/guest asymmetry she raises is a genuine feature of obligation or a piece of special pleading on the locals' behalf; and (c) whether Devi's prudence objection is fatal to Rana's position or merely a boundary that any account of convention-based obligation has to draw. If it helps you keep the thread, rate each move from clearly mistaken to clearly right, with a one-line justification for each rating.
reasoning: |-
  Hmm, the user has presented a fascinating philosophical debate about social conventions and obligations when moving to a new place. This seems to be a genuine dilemma they're facing in their new city, not just an academic exercise. 

  Let me break this down systematically. The core dispute between Rana and Devi centers on three specific local customs: tipping at cafés despite service charges, flexible queueing for trams, and jaywalking against red lights when locals do it. 

  Rana takes a unified approach - all these conventions create obligations through others' reliance, regardless of their origins. Her host-guest asymmetry argument is particularly interesting - that visitors are held to different standards than locals. Devi makes sharp distinctions: tipping involves actual economic reliance, while queueing and jaywalking are mere coordination conventions without moral weight. Her prudence vs obligation distinction cuts deep.

  For my analysis, I should consider:
  First, Devi's categorization seems stronger for the tipping case - there's a clear economic reliance where workers depend on tips as part of their livelihood. But for queueing, the reliance might be more about maintaining social order than direct harm. The jaywalking case is messier due to the gap between official rules and actual practice.

  Second, Rana's host-guest point reveals something real - newcomers often face stricter scrutiny - but framing it as obligation rather than social pressure feels shaky. The resentment factor seems more about pragmatism than morality.

  Third, Devi's prudence objection exposes a key flaw in Rana's reliance model - not all expectations create moral obligations. The locals' expectation that guests follow rules they themselves ignore feels hypocritical rather than legitimate.

  What both miss is how conventions evolve - the café tipping may be transitioning from voluntary to mandatory, while the jaywalking shows community rejection of bad rules. The deeper obligation might be to respect the local social contract in its complexity, not just individual expectations.

  I'll structure my response by evaluating each argument step-by-step, then synthesizing the insights into practical guidance. The user clearly wants nuanced understanding, not just who "won" the debate. They're trying to navigate real social tensions in their new home, so practical wisdom matters more than philosophical victory.
answer: |-
  Below is a move-by-move adjudication of Rana and Devi's exchange, addressing your three core questions (a, b, c) with ratings and justifications. The analysis prioritizes philosophical coherence over "winning," highlighting insights and overreaches from both perspectives.

  ---

  ### **Adjudication of the Exchange**
  #### **1. Rana’s Opening Move**  
  *Claim*: You are obligated to follow all three conventions ("house rules") as a guest.  
  **Rating: Partially Right (⭐️⭐️🔸)**  
  *Justification*: Correct that conventions stabilize expectations, but overreaches by treating all conventions as morally equivalent obligations. Ignores *why* a convention exists (e.g., exploitation vs. coordination).

  #### **2. Devi’s First Response**  
  *Claim*: The three cases differ: tipping is about owed compensation; queueing/jaywalking are "pure coordination."  
  **Rating: Mostly Right (⭐️⭐️⭐️🔸)**  
  *Justification*: Correctly distinguishes *reliance harms* (tips as wages) from *coordination efficiency* (queueing/jaywalking). Overreaches by dismissing coordination conventions as morally weightless—they *can* create obligations if flouting them harms others (e.g., queue chaos).

  #### **3. Rana’s Reliance Argument**  
  *Claim*: All conventions create obligations because people rely on them; the "done thing" itself has normative force.  
  **Rating: Partially Right (⭐️⭐️🔸)**  
  *Justification*: Strong on *reliance as a moral source* (e.g., café workers depend on tips). Overreaches by conflating *reliance* (tip) with *predictability* (queue/light)—latter lacks the same harm potential. The "done thing" point is weak: mere entrenchment ≠ obligation.

  #### **4. Devi’s Reliance Counter**  
  *Claim*: Reliance test fails—drivers don’t rely on pedestrians waiting (they expect jaywalking!); thus, "local practice" overrides statute.  
  **Rating: Clearly Right (⭐️⭐️⭐️⭐️)**  
  *Justification*: Exposes Rana’s inconsistency: if obligation flows from *actual* reliance, jaywalking aligns with local practice. Correctly notes statute ≠ binding convention if universally ignored.

  #### **5. Rana’s Host/Guest Asymmetry**  
  *Claim*: Locals apply stricter rules to visitors; resentment defines the obligation.  
  **Rating: Misguided (⭐️🔸)**  
  *Justification*: Identifies a real social dynamic (outsiders scrutinized more), but frames it as *obligation* rather than *social pressure*. Fails ethically: "resentment = obligation" risks endorsing prejudice (e.g., "foreigners must obey rules we ignore").

  #### **6. Devi’s Prudence Objection**  
  *Claim*: Avoiding resentment is prudence, not morality; preferences ≠ obligations.  
  **Rating: Clearly Right (⭐️⭐️⭐️⭐️)**  
  *Justification*: Correctly separates *moral duty* (what you owe others) from *pragmatic advice* (what avoids backlash). Rana’s "legitimate expectation" retort is circular—it doesn’t explain *why* the expectation is legitimate.

  ---

  ### **Answers to Your Three Questions**  
  #### **(a) Do the conventions fall into different categories?**  
  **Yes.** Devi’s distinction holds:  
  - **Tipping**: A *compensatory reliance practice*. Workers’ livelihoods depend on tips (exploitative or not), creating a duty to avoid material harm.  
  - **Queueing**: A *coordination convention*. While flouting it *can* cause minor harm (confusion, delay), the flexibility ("ask who is last") shows it’s designed for efficiency, not rigid duty.  
  - **Jaywalking**: A *rejected statute*. When laws conflict with universal practice, the *operative convention* (cross when safe) nullifies reliance on the statute. Drivers adjust expectations accordingly.  

  *Rana overreaches*: Treating all as "reliance" ignores material harm (tips) vs. inconvenience (queue) vs. inert rules (jaywalking).

  #### **(b) Is host/guest asymmetry a genuine obligation?**  
  **No.** It reflects *social reality*, not moral necessity.  
  - Locals may *enforce* stricter rules on newcomers (due to bias, scrutiny, or conservatism), but this is a power dynamic—not an ethical obligation.  
  - *Rana’s error*: She confuses "is" (what people expect) with "ought" (what is fair). Obligations stem from mutual respect, not double standards.  

  #### **(c) Is Devi’s prudence objection fatal to Rana?**  
  **Yes, for her specific argument.**  
  - Rana grounds obligation in *resentment avoidance*, which Devi correctly labels *prudential* (self-interest), not moral.  
  - *But*: This doesn’t doom *all* convention-based obligations. Compensatory reliance (tips) or practices preventing harm (e.g., orderly queues during emergencies) can create moral duties *independent* of resentment.  

  ---

  ### **What Both Missed: The Core Insight**  
  **Conventions create obligations only when:**  
  1. **They prevent tangible harm** (e.g., tips as wage supplements).  
  2. **They enable fair cooperation** (e.g., queueing if chaos would disadvantage vulnerable people).  
  3. **They reflect a *shared* moral understanding**—not hypocrisy (e.g., locals demanding guests follow rules they ignore).  

  In your cases:  
  - **Tip**: Owed, as it directly impacts workers’ income.  
  - **Queue**: Follow flexibly, as the convention accommodates reclaiming spots. No moral failing if you briefly step out.  
  - **Jaywalking**: Cross safely with locals. The statute is dead letter; the *actual* convention (cross when clear) carries no reliance harms.  

  ### **Practical Verdict for Your City Life**  
  | Convention       | Obligation? | Why |  
  |------------------|-------------|-----|  
  | Café tip         | **Yes**     | Compensatory reliance (worker welfare). |  
  | Flexible queueing| **Contextual** | Follow local flexibility—no moral harm in reclaiming your spot. |  
  | Jaywalking       | **No**      | Statute is ignored; actual practice nullifies reliance. |  

  Rana’s "house rules" slogan oversimplifies; Devi’s dismissal of coordination undersells its role in fairness. Your obligation is to **avoid harming others and cooperate in good faith**—not to obey every local whim.
