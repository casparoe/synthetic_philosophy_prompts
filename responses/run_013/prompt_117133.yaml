prompt: |-
  You are an expert in comparative constitutional law and political philosophy, with a specialist's feel for the unwritten conventions that hold Westminster-style systems together. I have a passage I need audited, and I would like you to work through it carefully rather than react to it. Before you write anything, spend some time enumerating for yourself the separate claims the passage makes, so that you can see which of them are load-bearing and which could be revised without the rest collapsing.

  Here is the passage, from a general-audience explainer on constitutional monarchy that a friend sent me:

  Constitutional monarchy sounds like a contradiction until you see how neatly it is put together. The trick, as every schoolchild used to learn, is that the monarch reigns but does not rule. In Britain the Crown still formally holds enormous powers — summoning and dissolving Parliament, appointing the prime minister, assenting to legislation, commanding the armed forces — but each of these is exercised on the advice of elected ministers, so the monarch's personal role has shrunk to ceremony: opening Parliament, reading a speech someone else wrote, and cutting ribbons. Japan's postwar constitution does the same work more openly, making the Emperor a symbol of the state and of the unity of the people and requiring the advice and approval of the Cabinet for his acts in matters of state. The Scandinavian monarchies have gone further down the same road: Sweden's king no longer has any formal role in forming a government, and today he is chiefly a master of ceremonies. The upshot is that the monarch has no discretion left. The rules that keep her in line are not laws at all but customs, and customs are only as strong as the general willingness to keep them; if a British monarch announced tomorrow that she would not sign a bill, nothing would happen to her, because no court would touch the question. What the arrangement buys a democracy is a head of state who is above politics: a symbol of continuity, a focus for patriotic feeling, and an ornament that costs a great deal and decides nothing. It is a decorative residue of an older constitution, kept because it is familiar, and it could be abolished tomorrow without anything else having to change.

  I am not asking for a literature review, and you do not need to cite sources; I will supply references myself if I end up using any of this. What I want is your judgment on each claim: would a careful scholar accept it as stated, accept it only with a qualification, or reject it? Where the passage does something that is defensible for a general reader but would mislead someone who took it literally, tell me what the misdirection is and why it matters. Please distinguish, as you go, between claims about the law and claims about political practice, and give definite verdicts rather than a survey of considerations on both sides.

  Two questions interest me most. First, does the passage's closing inference — that the arrangement is a decorative residue which could be abolished without anything else changing — follow from the parts of the description that are accurate, or does it depend on the parts that are overstated or wrong? Second, is the passage right about the relation between legal rules and political conventions here, or does it slide between the two in a way that matters?

  For what it is worth, my own instinct is that the slogan about reigning and not ruling is broadly right, that the conclusion is much too strong, and that the passage flattens some real differences among the British, Japanese, and Scandinavian arrangements — but I do not trust my instincts and would rather be corrected than reassured. Write in American English, in continuous prose with clear organization, and end with a verdict: how much of the passage survives contact with the details, and what a corrected version of it would say.
