prompt: |-
  My freind and I got into a stupidly long arguement last night about a puzzle she heard in a grad seminar. The setup: you're dropped somewhere in a territory that's split into Red and Blue, and each of those is split into sub-regions (one of them has a headquarters area and a second-company area, or something like that). You have a map with the sizes, but you don't know where you are. Then you get a radio message, and the message isn't a plain fact like "you're in Red" — it's conditional: "if you're in Red, you're probably in the headquarters part." And the question is how you're supposed to change your probabilities after hearing that. My friend says there's a standard answer; I say there isn't, or at least not an obvious one, because the thing you learned isn't a proposition you can just conditionalize on. We couldn't even agree on what a good answer would look like.

  So before I read anything else on this, tell me what a theory of updating on conditional information would actually have to get right. Not a list of named theories — the requirements. Which cases it has to handle (the radio message case, ordinary conditionalization as a special case, cases where the conditional has probability 1, cases where it doesn't, cases where you learn several conditionals in a row and the order shouldn't matter, etc.), which principles it can't violate, what it has to say about how much your probabilities are allowed to move, and for each requirement, the case or consideration that makes it a requirement. Also tell me which of these are non-negotiable versus just preferences of one camp, flag any requirements that might be jointly unsatisfiable, and say which single requirement does the most to rule out candidate rules.

  Give it to me as exactly five numbered points, each a sentence or two, no intro or conclusion.
reasoning: |-
  Okay, the user is in a debate with their friend about updating probabilities based on conditional information like "if you're in Red, you're probably in headquarters." They want to know the core requirements for a theory of updating on such conditionals without specific references to named theories. 

  First, I need to recall probability theory basics, especially conditionalization. Standard Bayesian updating applies when learning a fact, but here the information is a conditional statement. The user mentioned cases like ordinary conditionalization as a special case, probability 1 conditionals, sequential updates, and order invariance.

  The user's deeper need seems to be resolving their argument by understanding foundational requirements. They might be frustrated by the ambiguity in their friend's "standard answer" and want objective criteria to evaluate any theory. 

  Key requirements would include:
  1. **Reduction to standard conditionalization** when the conditional is certain. This is non-negotiable for consistency.
  2. **Handling probabilistic conditionals**, where the "probably" implies a likelihood ratio rather than a binary fact. The theory must adjust probabilities based on the strength indicated.
  3. **Order invariance** for multiple updates, as sequential learning shouldn't affect the final belief. This is crucial but might conflict with other requirements.
  4. **Preserving probabilistic coherence**, meaning probabilities must remain valid (sum to 1, non-negative). Non-negotiable to avoid contradictions.
  5. **Minimal belief revision**, ensuring updates change probabilities only as much as necessary. This prevents arbitrary adjustments and is a key differentiator between theories.

  I should check if these cover the user's cases: the radio message (requirement 2), ordinary conditionalization (1), probability 1 cases (1), sequential updates (3), and coherence (4). The minimal change (5) addresses "how much probabilities move." 

  Potential conflicts: Order invariance (3) and minimal change (5) might clash in sequential updates. Also, interpreting "probably" in requirement 2 could be subjective. The strongest requirement is likely minimal change (5), as it rules out many ad-hoc rules.

  The user emphasized exactly five points without intros/conclusions. I'll structure each point concisely, noting negotiability and conflicts where relevant.
answer: |-
  1. **Must reduce to standard conditionalization when the conditional is certain**: If the message is a definite "if A then B" (P(B|A)=1), learning it must update P(B) to P(B|A) via Bayes' rule. *Non-negotiable*; violates probability axioms otherwise, as in cases where you learn "if Red then Headquarters" and Headquarters was initially improbable.  
  2. **Must handle probabilistic conditionals naturally**: For messages like "if Red, *probably* Headquarters" (implying P(Headquarters|Red) > P(Headquarters|Red) was), the update should increase P(Headquarters|Red) appropriately. *Non-negotiable for realism*; ignoring this fails the radio message case.  
  3. **Must be sequentially consistent and order-invariant**: Updating on multiple conditionals (e.g., radio messages about different regions) should yield the same final probabilities regardless of order. *Strongly preferred*; violates intuitive coherence if order matters, as in receiving "if Red then HQ" before/after "if Blue then Field".  
  4. **Must preserve probabilistic coherence**: Output must satisfy Kolmogorov axioms (non-negative, sum to 1). *Non-negotiable*; any violation breaks probability theory, e.g., if updating inflates P(Red) beyond plausible bounds.  
  5. **Must enforce minimal belief revision**: Probabilities should change only as much as required by the new information. *Does the most to rule out candidates*; alternatives allow arbitrary shifts, like over-updating P(Red) on "if Red then HQ" when the message primarily concerns HQ's likelihood. Conflicts with requirement 3 in some sequential cases.
