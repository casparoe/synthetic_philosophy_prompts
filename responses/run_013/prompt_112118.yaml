  First, I recall that the core mechanism here is the misinterpretation of silence. Each person thinks others aren't objecting because they know something, leading to a self-reinforcing cycle. The key is the absence of disagreement being taken as a signal. 

  I remember that "pluralistic ignorance" fits when people privately reject a norm but publicly go along with it, thinking others accept it. But in this case, it's about a specific claim or decision, not a general norm. So that's a distinction. 

