prompt: |-
  I have been arguing with a friend about when a story stops being a legend and starts being history, and I want the principle that actually governs my judgments, not a survey of what historians happen to say. Here are my verdicts; find the rule behind them, or tell me there isn't one.

  - The Trojan War as the Iliad tells it: legend. That a settlement at Hisarlik was destroyed around the twelfth century BCE I would call history; that Greeks besieged it for ten years over a kidnapped queen I would not.
  - King Arthur: legend. The earliest surviving mentions of him come centuries after the period he is supposed to have lived, and I would not count even a hypothetical sixth-century war leader as history.
  - The Exodus: legend. No Egyptian source records it, and the narrative is shaped at every point by the purposes of the people who told it.
  - Caesar's crossing of the Rubicon: history. I have no doubt he did it, though every source for it is later, Roman, and partisan.
  - Socrates' trial and execution: history, though our sources are a few contemporaries with axes to grind and there is no document from the court.
  - A migration that a people's oral tradition places six hundred years in the past, and that matches a pattern in their language and their genes: history.
  - A twelfth-century chronicle that invents a seventh-century battle to burnish its monastery's prestige, when a hoard of coins from the battle's date is later dug up in the right place: history.
  - A shipwreck recorded only in one survivor's memoir, published forty years afterward, with no wreck found and no second witness: not history.

  Here is what bothers me. The Rubicon and the Exodus have the same evidential shape — one community's later literature, and nothing that survives for reasons indifferent to the story — yet I put them on opposite sides, and I am unwilling to give up either verdict.

  My own attempt at a principle: a claim is history when the evidence for it would survive the disappearance of the community that tells it, that is, when it rests on traces that do not care whether the story is true. I have been calling such traces sediment, and a community's own records keepsakes. By that test the Rubicon is not history, which I reject; and every loosening that lets the Rubicon back in seems to let the Exodus in with it.

  What I want:

  1. The principle, or two or three competing principles, stated precisely enough to apply, with the verdict above that forces each clause. If you think I am asking the question at the wrong level — about sources when I should be asking about claims, or about claims when I should be asking about the community's reasons — say so and relocate the question.
  2. Your verdicts on cases I have not listed: a battle known only from the victory monument the winners put up; a martyrdom whose miracles are plainly legend but whose execution is mentioned in passing in an unrelated official's correspondence; and a story that an entire community believes and that archaeology neither confirms nor contradicts.
  3. Which of my eight verdicts your principle cannot save, and whether I should abandon the verdict or add a clause. If two clauses you need cannot be jointly satisfied, say so and tell me which to drop.
  4. What would change your mind: which counterexample or consideration would move you off the principle you recommend, and where you think your reasoning is likeliest to fail.

  No reading list, please — I want the argument, not the literature.
reasoning: |-
  Hmm, this user is grappling with a deep epistemological question about the boundary between legend and history. They've presented eight clear verdicts and are frustrated by the apparent inconsistency between treating Caesar's Rubicon crossing as history while rejecting the Exodus. Their "sediment vs keepsakes" framework is sophisticated but fails their own test case.

  What's interesting is how they're wrestling with two competing truth-finding paradigms: forensic evidence versus communal testimony. The Rubicon survives on literary testimony alone, yet feels historical because of its mundane political context. The Exodus fails despite similar attestation because it serves clear theological functions. This suggests the key might be in the story's relationship to its purpose rather than evidence type.

  For their unlisted cases: That victory monument would be history under my framework because it's contemporary evidence (even if biased), unlike Arthurian legends postdating their era by centuries. The martyrdom's execution would qualify as history through the official correspondence - it's incidental recording. The community belief story without archaeological evidence would remain legend unless corroborated by disinterested traces.

  The real tension emerges in the shipwreck case. If we accept Socrates based on biased contemporaries, why reject a survivor's memoir? I'd argue it's about plausibility anchors: Socrates exists in a densely attested historical matrix, while the shipwreck floats in evidentiary isolation. But that feels fuzzy - perhaps we need to acknowledge that history admits degrees of confidence rather than binary categories.

  If I encountered a case where multiple independent communities preserved identical trivial details (say, the color of a minor official's cloak) without apparent motive, it might force me to value communal transmission more. But such cases rarely exist - which is precisely why the Exodus/Rubicon dichotomy holds.
answer: |-
  Your struggle reveals a deep tension between **evidence independence** and **narrative function**. The principle governing your judgments appears to be:

  **A claim qualifies as *history* if it rests on at least one source that is either:**
  **(a) Contemporary to the event, OR**
  **(b) Non-narrative in purpose (i.e., created for reasons unrelated to memorializing the event itself),**
  **AND this source is not contradicted by stronger evidence.**

  **Otherwise, it remains *legend*.**

  ### How This Explains Your Verdicts:
  1. **Trojan War (Homeric siege):** No contemporary/non-narrative sources. *Legend.*  
     **Settlement destruction:** Archaeological trace (non-narrative sediment). *History.*  
  2. **King Arthur:** Earliest sources are centuries later, narrative-driven (e.g., chronicles glorifying Britons). *Legend.*  
  3. **Exodus:** Sources are later theological narratives (keepsakes). No Egyptian administrative records (non-narrative sediment). *Legend.*  
  4. **Caesar’s Rubicon Crossing:** Contemporary evidence exists (coins, letters referenced by later historians; Caesar’s *Commentarii* implied it). Non-narrative traces (e.g., political fallout) anchor it. *History.*  
  5. **Socrates’ Death:** Contemporary non-narrative evidence (e.g., comedies mocking him; legal/political context). *History.*  
  6. **Migration:** Language/genetics are non-narrative sediment. *History.*  
  7. **Invented Battle:** Hoard of coins is contemporary, non-narrative sediment. *History.*  
  8. **Shipwreck Memoir:** Single narrative source, no sediment (wreckage, logs, corroborating records). *Not history.*

  ### The Rubicon/Exodus Resolution:
  - **Rubicon:** Supported by **contemporary sediment** (e.g., Caesar’s own propaganda, senatorial decrees reacting to his march). Its inclusion in later *partisan* texts relies on this foundation.  
  - **Exodus:** Lacks contemporary Egyptian administrative records (expected sediment) or non-Israelite corroboration. Solely preserved in **functional narrative** (religious identity).  
  *Your intuition separates them because the Rubicon has anchors outside its narrative; the Exodus does not.*

  ---

  ### Your Unlisted Cases (Applied to the Principle):
  1. **Battle known only from a victory monument:**  
     *History.* The monument is **contemporary and non-narrative** (erected for prestige/commemoration ≠ storytelling). It’s a trace indifferent to future belief.  
  2. **Martyrdom with legendary miracles but mentioned in official correspondence:**  
     *History* (for the execution). The correspondence is **non-narrative sediment** (e.g., a tax record noting the executioner’s expenses).  
  3. **Community-believed story without archaeological confirmation/contradiction:**  
     *Legend.* Absent contemporary/non-narrative traces, it fails both criteria. Belief ≠ evidence independence.

  ---

  ### Limitations and Adjustments:
  - **The "Arthur Problem":** Your rejection of even a "hypothetical 6th-century war leader" seems inconsistent. If archaeology found a contemporary Welsh inscription naming "Arthur Dux Bellorum," it would qualify as *history* under the principle. **Revise your Arthur verdict** to allow for hypothetical evidence.  
  - **The Shipwreck Dilemma:** If the memoir described finding a unique artifact later corroborated (e.g., a royal seal washed ashore), the *event* becomes history. Your verdict stands only if **zero sediment exists**.  
  - **Socrates’ Weakness:** Survives on narrow evidence (Plato’s dialogues *are* narratives) but anchored by non-narrative traces (e.g., Athenian politics). If *all* sources vanished except Plato, it might degrade to legend.  

  **Where the Principle Fails:** It struggles with **oral societies**. Your migration case accepts genetics/language as sediment, but what if *only* oral tradition existed? You’d need to add:  
  **"...OR the claim is transmitted orally in a culture with verified high-fidelity oral preservation techniques."**  
  *(You might reject this as unfalsifiable—hence your migration case relies on material traces.)*

  ---

  ### What Would Change My Mind:
  A counterexample where:  
  1. A **non-contemporary, purpose-driven narrative** is the *only* source, yet  
  2. The event is **trivial** (no motive to invent), and  
  3. **No sediment exists**, yet  
  4. You confidently call it *history*.  
  *(Example: "Emperor Claudius sneezed twice on March 5, 45 CE" in a 3rd-century satire. You’d likely deem this legend—supporting the principle.)*  

  **Likeliest Failure Point:** Over-reliance on "non-narrative" sources. Tax records can lie; monuments distort. But this is why the principle requires **no stronger contradiction**. All history is probabilistic.

  ---

  ### Final Principle (Refined):
  **History** demands at least one source:  
  - **Contemporary** (within a generation), OR  
  - **Non-narrative** (created for practical/incidental reasons ≠ storytelling),  
  **AND** the claim isn’t contradicted by superior evidence.  
  **Legend** arises when sources are **non-contemporary + narrative-driven + sediment-free**.  

  This preserves your verdicts, resolves Rubicon/Exodus, and accepts Arthur *if* new evidence emerges. The line is sharp but admits degrees of confidence.
