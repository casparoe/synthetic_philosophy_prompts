  ### In-Class Activity: Base & Superstructure Simulation  
  **Objective:** Illustrate the tension between economic determinism ("the base explains everything") and the relative autonomy of superstructures (political/legal institutions) through an experiential game. Students should feel both the pull of economic explanations and their instability, setting up a debrief on Marxian concepts without naming them until afterward.  

  ---

  ### **Roles & Materials**  
  **Participants:** 16 students.  
  **Materials:**  
  - **Endowment Cards:** 48 cards total (durable cardstock).  
    - **Blue Cards (Capital):** 16 cards (4 cards labeled "1", 8 labeled "2", 4 labeled "3").  
    - **Red Cards (Labor):** 32 cards (all labeled "1"; consumable per round).  
  - **Production Trackers:** 16 sheets for students to calculate points.  
  - **Rule-Making Poster:** For the elected chamber to write rules.  
  - **Voting Ballots:** For final-round popular vote (if triggered).  
  - **Timer:** For strict phase management.  

  **Initial Endowments (Round 1):**  
  - **4 "Poor" Students:** 1 Blue card each.  
  - **8 "Middle" Students:** 2 Blue cards each.  
  - **4 "Rich" Students:** 3 Blue cards each.  
  - **All Students:** Receive 3 Red cards each round (labor is replenished; capital is permanent).  

  **Production Rules:**  
  - Activate 1 Blue card with 1 Red card → 2 points.  
  - Unused Blue cards → 0 points.  
  - Unused Red cards → 1 point each.  
  *Example:* A "Rich" student (3 Blue, 3 Red) activates all 3 Blue cards (6 points). A "Poor" student (1 Blue, 3 Red) activates 1 Blue (2 points) + 2 unused Red (2 points) → 4 points.  

  **Chamber Rules:**  
  - Top 4 producers by points form the chamber.  
  - Chamber sets **one rule** for the next round (5-minute deliberation).  
  - Rules can:  
    - Alter labor distribution (e.g., "Rich get +1 Red card").  
    - Change production (e.g., "Unused Red cards now yield 2 points").  
    - Modify elections (e.g., "Next chamber elected by popular vote").  
    - Redistribute Blue cards (rare; requires unanimous chamber vote).  
  - Chamber members *remain players* with personal endowments.  

  **Payoff Currency:**  
  - Points determine chamber membership → Chamber sets rules → Rules reshape future endowments/production.  
  - **No money:** Power comes from rule-setting, not accumulation.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Round 1 (20 mins)**  
  1. **Setup (5 mins):** Assign roles/endowments. Explain production rules only (*no* mention of chamber or Marx).  
  2. **Production (5 mins):** Students calculate points using trackers.  
  3. **Election (5 mins):** Instructor tallies points. Top 4 producers form chamber.  
  4. **Rule-Making (5 mins):** Chamber deliberates, writes one rule for Round 2.  

  **Round 2 (20 mins)**  
  1. **Setup (5 mins):** Reset Red cards (all get 3, plus any new rules).  
  2. **Production (5 mins):** Students calculate points under new rules.  
  3. **Election (5 mins):** Top 4 form chamber (usually Rich again).  
  4. **Rule-Making (5 mins):** Chamber sets rule for Round 3 (*predictably self-serving*).  

  **Round 3 (20 mins)**  
  1. **Setup (5 mins):** Apply Round 2 rules to Red cards.  
  2. **Production (5 mins):** Points calculated.  
  3. **Twist Election (10 mins):**  
     - If chamber set "popular vote" rule, all 16 students vote (1 ballot each) for chamber.  
     - If not, default to top 4 by points.  
     - **Force the twist:** If chamber avoids popular vote, *instructor secretly prompts one Rich member* to propose it as a "fair experiment" (ensuring instability).  

  **Debrief (30 mins)**  
  1. **Describe the arc (5 mins):** Ask students:  
     - "How did rules change? Who benefited?"  
     - "Why did Round 3’s outcome surprise/diverge from early rounds?"  
  2. **Map to Marx (10 mins):** Introduce terms:  
     - **Base:** Economic relations (endowments/production).  
     - **Superstructure:** Institutions (chamber, rules).  
     - Highlight: Rules initially tracked economic power (Rich set self-serving rules), but Round 3 broke the pattern (e.g., popular vote elected Middle/Poor).  
  3. **Three Explanatory Questions (10 mins):**  
     - **Content:** Why did rules favor the Rich early on? *(Base interests shaped superstructure).*  
     - **Persistence:** Why did this hold for two rounds? *(Rules reproduced economic power).*  
     - **Change:** Why did Round 3 rules backfire? *(Superstructure gained autonomy via new election rule).*  
  4. **Last-Instance Determinism (5 mins):**  
     - Concede superstructures have "relative autonomy" (e.g., popular vote altered outcomes).  
     - Argue base remains "determining in the last instance" (e.g., Rich *chose* the vote rule; endowments still shaped production).  
     - **Stress:** This feels like a hedge—because it is. The game can’t resolve if "last instance" is coherent.  

  ---

  ### **Frank Notes**  
  **Predictable Problems (First Run):**  
  1. **Time Crunch:** Production calculations or chamber debates may bleed into debrief time. *Mitigation:* Use a visible timer; pre-calculate example points.  
  2. **Chamber Gridlock:** Students may deadlock on rules. *Mitigation:* Provide a "rule menu" (e.g., "Redistribute 1 Blue card," "Add +1 Red to X group").  
  3. **Predictable Rich Rule:** Rich often entrench power (e.g., "Rich get +2 Red cards"). *Use this!* It shows base-superstructure alignment.  
  4. **Unconvincing Twist:** If popular vote elects Rich anyway (e.g., due to charisma), note that *attempted* autonomy still proves instability.  
  5. **Student Frustration:** "Poor" students may disengage. *Mitigation:* Assign observer roles to 1–2 students to track contradictions.  

  **Honest Limitations:**  
  - **Indispensable but Unstable:** The game makes base/superstructure feel *necessary* (rules clearly track economics early) yet *fragile* (Round 3 breaks the pattern).  
  - **Unsettled Theory:** A 90-minute game can’t prove if "last-instance determinism" is a deep insight or a dodge. It *will* feel like a hedge—because Marx’s formula *is* ambiguous, and the activity mirrors that tension.  
  - **Goal:** To leave students unsettled about simplistic materialism, not to convert them to Marxism. The debrief should validate their skepticism while deepening the question: *"If not the base, what?"*  

  **Why It Works:**  
  - **Mechanics → Concept:** Unequal endowments → predictable rules → autonomous superstructure in Round 3 mirrors Marx’s "relative autonomy."  
  - **No Framing Lecture:** Students experience the dynamic *before* labeling it, avoiding confirmation bias.  
  - **Debrief Structure:** Isolates content/persistence/change to show base-superstructure isn’t monolithic.  

  This simulation won’t "solve" base/superstructure debates—but it will make them visceral, showing why they persist in political philosophy.
