  - The activity can make the base/superstructure distinction feel indispensable because it shows how the rules are set by the economically powerful. It feels unstable because in the final round, the outcome might not align with the base.
  - But it cannot settle whether the distinction is well-formed: for example, are the rules part of the base or superstructure? (In Marxism, the rules of production are base, but the political rules are superstructure.) In our game, the production rules are set by the chamber, which is superstructure, but they affect the base. This circularity is part of the debate.
  - The "last instance" formula will look like a hedge: we are saying the base matters ultimately, but in the short term, the superstructure has autonomy. In the game, the base (endowments) was set at the start and then the rules (superstructure) changed, but the rule change was done by the base-determined chamber. So the base had the last word? But then in round 3, the popular vote might change things. It's messy and will feel unresolved.

  **Materials:**
  - Blue tokens: for example, blue index cards. Each player gets a fixed number at the start (1, 2, or 3). They keep these for the whole game.
  - Red tokens: red index cards. Each round, the instructor distributes them (3 per player in round 1, then according to rules).
  - A way to record points: a whiteboard or spreadsheet.
  - For voting in round 3 (if that rule is set): ballots or a show of hands.

