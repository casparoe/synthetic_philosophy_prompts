prompt: |-
  My mate and I burned about four hours last night arguing about Sidgwick's psychical research, and I need to get my act together before we pick it up again on Thursday. His line: Sidgwick was a great ethicist who happened to have a crankish side-hobby, the Society for Psychical Research stuff has nothing to do with the Methods of Ethics, different project, different audience, probably just a Victorian emminent-person's way of not facing up to his own religious collapse. My line: it's all one thing. Sidgwick's whole problem at the end of the Methods is that practical reason comes apart — egoism tells you one thing, universal benevolence another, both seem to survive his own tests, and he can't find a purely ethical way to choose between them. The only thing that would really heal that split is a fact about how the world is put together: that duty and happiness converge in the long run, that the universe is governed in some sense, so that being good isn't finally a sucker's bet. And that's exactly the kind of thing he was after with the psychical research — survival of bodily death, some evidence of an order that carries on past the grave. He was a founder and the first president of the SPR, so this wasn't a weekend hobby.

  I don't want you to just adjudicate the arguement, I want the specification, so I can win on the merits. Write me the desiderata: what would a body of evidence from psychical research have to establish, and what would the evidence itself have to be like, for it to actually do the work Sidgwick wanted — to close the dualism of practical reason rather than just adding one more spooky fact to the pile. Give me the requirements list with the consideration behind each, say which ones are non-negotiable and which are just preferences of a particular camp (fraud-proof observation, repeatability, the whole super-ESP / subliminal-self escape hatch, the gap between evidence for survival and evidence for a morally ordered universe, whether a statistical result about mediums could bear on a philosophical thesis at all, and whatever else you think belongs). Flag any pair of requirements you think can't be met together — if the spec turns out unsatisfiable, that's the most interesting result and I want it said out loud, and I want to know which single requirement does the most work, i.e. which one kills off the most of the plausible approaches.

  Skip the reading list, I'm not citing anything at a kitchen table.
reasoning: |-
  Okay, the user and his friend are deep into a debate about Henry Sidgwick's psychical research and its connection to his ethical work in "The Methods of Ethics." The user's position is that Sidgwick's psychical research wasn't just a hobby but integral to resolving the dualism of practical reason—the conflict between egoism and universal benevolence. His friend thinks it's separate. The user wants a detailed specification of what evidence from psychical research would need to look like to actually bridge that gap, not just add spooky facts.  

  First, I need to recall Sidgwick's ethical dilemma. In "Methods," he concludes that egoism (self-interest) and utilitarianism (universal benevolence) are both rational but irreconcilable without a deeper cosmic order. Sidgwick hoped for empirical evidence—like life after death—to show that virtue and happiness converge in the long run. So psychical research wasn't a side project; it was aimed at resolving this philosophical impasse.  

  The user wants desiderata: what would evidence need to establish, and what characteristics must it have? Key considerations include fraud-proofing, repeatability, handling the super-ESP objection, linking survival to a moral universe, and whether stats on mediums can support a philosophical thesis. I should outline non-negotiables vs. preferences and flag conflicts.  

  Starting with the core requirement: evidence must demonstrate a morally ordered universe where duty aligns with happiness posthumously. Survival alone isn't enough; it must show moral governance. That's non-negotiable.  

  For evidence quality: it must be fraud-proof. Sidgwick was wary of deception, so controls like sealed rooms or pre-registered tests are essential. Also, repeatability—not necessarily lab replication, but patterns across cases to rule out chance. These are non-negotiables for credibility.  

  The super-ESP problem: evidence must distinguish between spirits and living minds accessing information supernormally. Cross-verification chains (e.g., multiple mediums independently confirming obscure facts) could help, but it's a preference—tough to prove conclusively.  

  Linking survival to moral order: here's a big gap. Even with proof of afterlife, it might be morally neutral. Evidence would need causal chains—e.g., virtuous actions leading to rewards—but that's speculative. Non-negotiable but hard to satisfy.  

  Statistical evidence: can it bear on philosophy? Sidgwick needed it to support a metaphysical claim. Stats alone might show anomalies but not cosmic order. Requires interpretation, so it's a preference—better with narrative depth.  

  Now, conflicts:  
  - Demonstrating moral governance vs. empirical constraints: How do you empirically observe cosmic justice? Likely unsatisfiable.  
  - Fraud-proofing vs. spontaneity: Tight controls might stifle phenomena, creating a catch-22.  

  The biggest bottleneck? Proving moral governance. It kills most approaches because it demands observable moral causality in the universe, which is beyond current empirical methods.  

  Finally, the user wants this for a kitchen-table debate, so keep it practical. Highlight that Sidgwick's project might be unsatisfiable—evidence could support survival but not the ethical bridge, which is the most critical takeaway.
answer: |-
  Here's the specification for Sidgwick's "evidence bridge" – the body of psychical research findings necessary to genuinely close the Dualism of Practical Reason (DPR). Each requirement is driven by the core ethical problem Sidgwick faced.

  **The Core Ethical Problem:** The DPR arises because Sidgwick found both Egoism (maximize own happiness) and Utilitarianism (maximize universal happiness) to be rationally compelling, yet fundamentally incompatible *unless* the universe guarantees a convergence of duty and self-interest *in the long run*. Mere *belief* (faith) isn't enough; Sidgwick sought *justification* potentially accessible to reason and evidence.

  **The Desiderata for Evidence to Close the DPR:**

  1.  **Demonstrate Post-Mortem Survival of Consciousness (Non-Negotiable):**
      *   **What:** Clear, unambiguous evidence that individual consciousness persists after bodily death.
      *   **Why:** This is the foundational step. If consciousness ends at death, the "long run" for the individual is finite, and convergence *only* happens if virtue *always* pays off *in this life* – which Sidgwick (and experience) saw wasn't reliably true. Survival opens the possibility for convergence beyond the grave.
      *   **Evidence Requirement:** Must go beyond vague "energy" or "presence" to demonstrably individual, persisting consciousness with memory and identity.

  2.  **Establish a Connection Between Post-Mortem State and Earthly Conduct (Non-Negotiable):**
      *   **What:** Evidence showing that the nature or quality of the post-mortem existence is *causally linked* to the moral quality (virtue/vice) of the individual's earthly life.
      *   **Why:** Mere survival isn't sufficient. Survival could be morally neutral (like a cosmic waiting room) or even worse for the virtuous (a dystopian afterlife). Convergence requires that being good *improves* one's ultimate happiness/situation, while being bad *diminishes* it. This links survival to the *moral order* Sidgwick needed.
      *   **Evidence Requirement:** Communications or phenomena must reliably describe or demonstrate a link between specific virtuous/vicious actions/character and specific positive/negative post-mortem consequences or states (e.g., reports from "departed" indicating their state reflects their life choices).

  3.  **Prove the Existence of a Governing Intelligence/Principle Ordering this Convergence (Non-Negotiable):**
      *   **What:** Evidence pointing to an active, intelligent force or principle ensuring that the link between conduct and post-mortem state (Requirement 2) is maintained universally and justly.
      *   **Why:** Convergence isn't guaranteed by mere survival + a vague link. It requires a *reliable mechanism* ensuring justice – that virtue *always and ultimately* leads to happiness, vice to misery. This is the "governance" Sidgwick sought. Random or impersonal forces might not guarantee it.
      *   **Evidence Requirement:** Communications or patterns revealing conscious intent, purpose, and consistent moral governance behind the survival state and its connection to earthly life (e.g., coherent descriptions of a system of moral law or benevolent entities administering it).

  4.  **Fraud-Proof Observation (Non-Negotiable):**
      *   **What:** Evidence generated under conditions rigorously excluding deception by mediums, sitters, investigators, or confederates.
      *   **Why:** Sidgwick was acutely aware of fraud. Evidence tainted by fraud cannot provide rational justification. It actively undermines the project.
      *   **Evidence Requirement:** Sealed rooms, pre-registered tests, independent observers, controls against cold/hot reading, information restriction, replication across diverse investigators. Must withstand professional magician scrutiny.

  5.  **Repeatability / Robust Pattern (Strong Preference, but Contextual):**
      *   **What:** Phenomena or evidential results that can be observed repeatedly by different investigators under controlled conditions, or a robust pattern of high-quality evidence emerging independently across multiple cases.
      *   **Why:** Single, unrepeatable events can be dismissed as flukes, errors, or residual fraud. A consistent pattern significantly increases evidential weight and counters the "chance" hypothesis.
      *   **Evidence Requirement:** Not necessarily lab-like repetition of *identical* phenomena, but consistent production of high-quality, veridical information under fraud-proof conditions by different mediums/subjects over time.

  6.  **Immunity to the "Super-ESP" / "Subliminal Self" Hypothesis (Non-Negotiable Countermeasure):**
      *   **What:** Evidence that cannot be plausibly explained by the living agent's (medium, sitter, or investigator) unconscious access to information via unknown but *natural* psychic faculties (telepathy, clairvoyance, precognition) operating at extraordinary levels ("Super-ESP") or by tapping into a collective unconscious ("Subliminal Self").
      *   **Why:** This is the biggest *evidential* hurdle *for survival specifically*. If information ostensibly from the dead could theoretically come from the living minds involved (even via undiscovered natural means), it fails to prove *survival*. It just proves spooky information transfer. Sidgwick needed evidence *forcing* the survival conclusion.
      *   **Evidence Requirement:** "Cross Correspondences" (complex, fragmented messages requiring multiple mediums to piece together meaning only known to the deceased), veridical information *unknown to any living person* but later verified, information demonstrating the *ongoing, independent existence and activity* of the deceased consciousness beyond mere information retrieval (e.g., reporting events post-dating their death unknown to sitters/mediums). Novel, creative, personality-specific content beyond information access is key.

  7.  **Bearing on Philosophical Thesis: Beyond Anomaly to Foundational Support (Non-Negotiable):**
      *   **What:** The evidence must be of a nature and scale that it can legitimately support a profound metaphysical and ethical claim about the fundamental structure of reality and practical reason.
      *   **Why:** Sidgwick wasn't just collecting spooky facts. He needed evidence rationally compelling enough to resolve a foundational philosophical aporia. Statistical quirks or isolated spooky events are philosophically inert for this purpose.
      *   **Evidence Requirement:** Needs to be qualitatively rich, coherent, and converge on the *specific narrative* of survival + moral link + governance (Requirements 1-3). A large body of diverse, high-quality evidence (fraud-proof, super-ESP resistant) that collectively paints a consistent picture of the post-mortem moral order is required. It must move beyond "something odd is happening" to "this *specific* structure of reality exists."

  **Critical Conflicts & The Unsatisfiability Problem:**

  *   **The Core Conflict: Demonstrating Moral Governance (Req 3) vs. Empirical Constraints:** This is the **Achilles Heel**. Requirements 1 (Survival) and 6 (beating Super-ESP) are *immensely* difficult but *conceivable*. Requirement 3 (Governance) is fundamentally different. How do you get *empirical evidence* for the *intentional, just, universal* moral ordering of the universe? Communications *claiming* this could be deceptive, delusional, or symbolic constructs of the subconscious mind (even a super-ESP mind). Observing *causal links* between virtue and post-mortem reward empirically is arguably beyond the scope of any conceivable psychical research methodology. **This requirement likely makes the entire spec unsatisfiable.** Evidence might *suggest* governance to believers, but it cannot *prove* it to the standard Sidgwick's philosophy demands.
  *   **Fraud-Proofing (Req 4) vs. Spontaneity/Phenomena:** The most compelling phenomena often occur spontaneously, not under lab conditions. Rigorous controls can stifle phenomena or create sterile environments where nothing happens. This is a practical tension inherent in the field.
  *   **Repeatability (Req 5) vs. Uniqueness (Req 6):** Truly unique phenomena (critical for beating Super-ESP, like novel information unknown to anyone) are, by definition, hard to repeat. Standardized tests seeking repeatability often produce weaker evidence easily explained by normal or super-ESP means.

  **The Single Most Damaging Requirement:**

  *   **Requirement 3: Prove the Existence of a Governing Intelligence/Principle Ordering Convergence.** This requirement **does the most work in killing plausible approaches.** It's the leap from "consciousness survives" (difficult but potentially addressable via Req 6) to "and the universe is *morally ordered by intelligence* to ensure duty and happiness converge." *No* evidence from mediums, apparitions, or psi phenomena can *conclusively prove* this metaphysical and theological claim. It transforms the project from empirically investigating survival into attempting to empirically prove the existence and nature of God/the moral absolute – a task arguably beyond the reach of *any* empirical science, psychical or otherwise. Requirement 2 (Moral Link) is also vulnerable, but Requirement 3 is the true philosophical lynchpin and the most insurmountable evidentiary hurdle.

  **Conclusion for Your Argument:**

  You can forcefully argue that Sidgwick's psychical research was *absolutely integral and not a hobby* – it was a direct, rational (if desperate) attempt to find empirical grounds to resolve the DPR. The SPR wasn't about ghosts; it was about cosmic justice. **However, the specification reveals why it *failed* to achieve its goal:** The crucial requirement to empirically *demonstrate* a morally governing intelligence ensuring convergence (Requirement 3) is likely **unsatisfiable** through any conceivable psychical evidence. The gap between "evidence for survival" and "evidence for a morally ordered universe" is philosophically and evidentially unbridgeable by the methods Sidgwick employed. He sought empirical proof for a metaphysical necessity. Your mate is wrong about the connection (it *is* one project), but arguably right about the futility of the SPR aspect *for its intended philosophical purpose*. The deepest irony: Sidgwick's own rigorous standards for evidence (fraud-proofing, beating Super-ESP) and the sheer ambition of what he needed to prove (moral governance) ensured the project couldn't succeed. The DPR remained open. Use this spec to show the *intent* and the *immense, likely impossible, burden of proof* Sidgwick placed on the evidence. That's winning on the merits.
