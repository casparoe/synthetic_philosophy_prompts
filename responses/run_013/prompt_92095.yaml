answer: |-
  Here’s a tailored set of questions designed to probe the tensions between temporal discounting models and philosophical akrasia, with surgical follow-ups. I’ve structured it to your specifications, prioritizing the "phenomenon goes missing" section.

  ---

  ### 1. **Warm-up**  
  **Question:** "In your models, hyperbolic discounting explains procrastination and addiction as preference reversals—but how does it distinguish between someone who *merely changes their mind* about a future reward and someone who *judges their own action irrational* at the moment of choice?"

  ---

  ### 2. **The Identity Claim**  
  **Question 1:** "You argue ‘weakness of will’ is just folk psychology for present bias. Is akrasia *identical* to present bias, or is present bias merely its mechanism? If identical, why do philosophers need new labels?"  
  *Likely Answer:* She’ll claim identity (e.g., "Akrasia *is* present bias—the labels are redundant").  
  **Follow-up:** "If they’re identical, does that mean every instance of present bias *entails* acting against one’s better judgment? Because in your model, a naive discounter acts *on* their current judgment—so where’s the ‘better judgment’ they’re violating?"  

  **Question 2:** "What does the term ‘weakness of will’ capture that ‘present bias’ fails to, if anything? Is it just baggage, or is there a phenomenological or normative gap?"  
  *Likely Answer:* She’ll dismiss it as baggage ("It adds nothing beyond temporal inconsistency").  
  **Follow-up:** "Then why do people *experience* akrasia as a conflict—‘I shouldn’t do this, but I am’—rather than as a seamless shift in preference? If it’s just bias, why the guilt?"  

  ---

  ### 3. **Where the Phenomenon Goes Missing**  
  **Question 1:** "Take a *sophisticated* hyperbolic discounter: she precommits to avoid temptation. By locking in future choices, she never acts against her judgment. Doesn’t this eliminate akrasia entirely from your model?"  
  *Likely Answer:* She’ll say precommitment *resolves* akrasia by aligning action with long-term judgment.  
  **Follow-up:** "But if precommitment erases the conflict, doesn’t that imply akrasia only exists for *failures* of precommitment? Isn’t that circular—defining the phenomenon by its own prevention?"  

  **Question 2:** "Now take a *naive* discounter: at T1, she prefers long-term reward X; at T2, she switches to short-term Y. But at T2, doesn’t she *judge* Y as best *then*? Where’s the ‘action against judgment’ if her judgment shifts?"  
  *Likely Answer:* She’ll argue the T1 judgment *is* her "true" preference.  
  **Follow-up:** "What makes T1 ‘truer’? If the agent’s judgment is time-indexed, isn’t calling T1 ‘better’ just importing a *philosophical* norm—that she *should* privilege past/future selves?"  

  **Question 3:** "Hyperbolic discounting explains *diachronic* preference reversals. But akrasia is typically *synchronic*: I judge X best *now* yet do Y *now*. How can a model about reversals *across time* capture a conflict *within time*?"  
  *Likely Answer:* She’ll collapse synchronic conflict into the "immediate urge" winning over long-term goals.  
  **Follow-up:** "But if the urge is my *current* preference, I’m not acting against my *current* judgment—I’m acting *on* it. Isn’t this just redefining ‘judgment’ as ‘whatever wins’? Where’s the *failure*?"  

  ---

  ### 4. **Judgement and the Felt Struggle**  
  **Question 1:** "In your framework, is ‘judgment’ separable from revealed preference? When someone says ‘I shouldn’t smoke this,’ but does, is that ‘should’ just noise, or does it reflect a competing valuation?"  
  *Likely Answer:* She’ll reduce judgment to a competing preference (e.g., long-term health vs. immediate relief).  
  **Follow-up:** "But if judgment is *just* another preference, why call it ‘weakness’? Isn’t that smuggling in a normative claim—that one preference *ought* to dominate—which your model can’t ground?"  

  **Question 2:** "The felt *struggle* of akrasia—gritted teeth, effort—suggests something beyond preference ranking. If it’s just present bias, why isn’t giving in effortless? Is willpower depletion epiphenomenal?"  
  *Likely Answer:* She might invoke ego depletion or cognitive effort.  
  **Follow-up:** "Given critiques of ego depletion (e.g., meta-analyses showing weak effects), isn’t that just replacing one folk theory with another? What in *your model* predicts struggle rather than indifference?"  

  ---

  ### 5. **What the Philosophers Get to Keep**  
  **Question:** "What’s one thing philosophers *get right* about akrasia that behavioral economics misses—e.g., the role of identity, normative self-governance, or the distinction between ‘wanting’ and ‘endorsing’?"  
  *Likely Answer:* She might concede phenomenology or normativity.  
  **Follow-up:** "If those aspects matter, doesn’t reducing akrasia to present bias risk losing what makes it a *distinct* human problem—not just miscalibration, but a breakdown in agency?"  

  ---

  ### 6. **Close**  
  **Question:** "For your listener in addiction services: if present bias is the whole story, why do commitment devices often fail those with severe addiction—and what should we offer when precommitment isn’t an option?"  

  ---

  ### Why this works:
  - **"Phenomenon goes missing"** is the centerpiece, forcing her to confront whether her model *lacks resources* to capture synchronic conflict or must covertly borrow norms.  
  - **Follow-ups anticipate replies** (e.g., "true preference" appeals get challenged on circularity; struggle appeals hit shaky empirical ground).  
  - **Practical close** ties theory to real-world constraints, avoiding app-solutionism.  
  - **No softballs**—each question cuts to conceptual tensions.  

  Focus on her replies to the "naive discounter" and "synchronic vs. diachronic" questions—that’s where the model’s limits will show.
