prompt: |-
  I cover the mind sciences for a national magazine, and this term I'm teaching a final-year seminar at a journalism school on evidence about the mind — what a reporter is entitled to conclude from a self-report, a behavioural measure, a scan. I'm writing the midterm and I want one essay question on the reliability of introspection. The reflex answer to anything in this territory is a recitation of the classic confabulation findings, that people confidently give reasons for choices they never made, and I can get that from any student in the first ten minutes. What I want instead is a question that forces them into the validation problem underneath it: to call an introspective report reliable, you have to be able to say what independent record it could be checked against, and it is not obvious that any such record exists for the things introspection is supposed to report.

  Two things of my own should be built into the question, because I want the students to have to use them and, if they can, push back on them. The first is a rule of thumb I use in the newsroom and call the two-ledger test: a claim about someone's inner life is only as good as the second ledger you can name for it, the independent record against which the report could be checked; where there is no second ledger, you have a claim, not a measurement. The second is a habit I call reliability laundering: the way a guess about one's own mind becomes hard data the moment it is entered as a 4 on a seven-point scale and then circulates with no trace of how it was produced.

  The scenario I want the question built around is a newsroom one, since that is where my students are headed. A science desk runs a feature on how people form political judgements: some participants are beeped at random intervals over a fortnight and asked what was going through their minds at that moment; the same participants are interviewed a week later about how they made up their minds; the feature's headline distinction is between what people actually thought at the time and the stories they tell afterwards. Students should have to decide whether the beeper reports earn the word "actually". Give them two targets of introspection without naming the distinction — a source's reasons for a decision, and the participants' present experience — so that a good answer can discover for itself that the verdict comes out differently depending on what the report is about; don't hand that to them in the question text.

  The question itself should be short enough to read in a minute, self-contained, and answerable in fifty minutes for 25 marks with no reading. Do not require citations and do not supply a reading list: the model answer has to stand on reasoning alone, and I would rather you not name particular studies or researchers at all, since neither the students nor I could check them from the exam room.

  Please give me three things: first, the student-facing question as it would appear on the paper, including the scenario, the time allowed and the marks; second, a model answer of about 650 words in continuous prose; third, a marking scheme that separates an A from a B by naming the specific moves each must contain and, for each, the specific mistake that costs the marks — a student who can only recite the confabulation findings should top out at a B. Put the marking scheme in the structured form below, after the prose.

  If the question as I have framed it cannot be asked at the level I want — if the two-ledger test is confused, if the reliability of introspection turns out to be too many questions to sit behind a single exam item, or if the marking criteria I am after are not really separable from one another — say so plainly in the pushback field rather than tidying it over. I would rather have a straight objection than a polished answer to a badly posed question.

  Format the marking scheme as one JSON object with exactly these fields:

  - "exam_question": string — the student-facing text exactly as it would appear on the paper.
  - "total_marks": integer.
  - "criteria": array of objects, each with "id" (string, e.g. "C1"), "move" (string — the specific move the answer must make, in one sentence), "marks" (integer), "exemplary" (string — what a top answer does with this move), "typical_error" (string — the specific mistake that costs these marks, phrased as the wrong move a student actually makes), and "required_confidence" (one of "high", "medium", "low" — your confidence that a top answer must contain this move rather than reaching the same mark another way). The marks across criteria must sum to "total_marks".
  - "a_b_boundary": string — one short paragraph naming what a B answer has and what it lacks.
  - "contestable_criteria": array of objects with "id", "why_contestable", and "marks_at_stake" (integer).
  - "pushback": object with "is_the_task_well_posed" (boolean), "concerns" (array of strings), and "what_i_would_change" (string).
reasoning: |-
  We are designing an essay question for a midterm exam in a journalism seminar on the reliability of introspection. The goal is to push beyond the standard confabulation findings and force students to grapple with the validation problem (the "two-ledger test") and the issue of "reliability laundering". The scenario involves a news feature comparing real-time beeper reports of thoughts with retrospective interviews about political judgments.

  The student-facing question should:
  - Present the newsroom scenario (beeper study on political judgments, comparing real-time reports with retrospective stories).
  - Ask whether the beeper reports earn the word "actually" (in the headline's claim about "what people actually thought").
  - Be short and self-contained.
  - Not explicitly name the two targets of introspection (reasons for decisions vs. present experience) but allow the student to discover the distinction.

  Additionally, we need:
  - A model answer (~650 words) that demonstrates the reasoning we expect.
  - A marking scheme in a specific JSON format.

  The marking scheme should:
  - Include criteria that separate an A from a B. A B answer might only recite confabulation findings and not engage deeply with the two-ledger test and the distinction between the two targets.
  - The criteria array should have objects with: id, move, marks, exemplary, typical_error, required_confidence.
  - An a_b_boundary description.
  - A contestable_criteria array (if any criteria are debatable).
  - A pushback object that honestly addresses if the task is well-posed.

  Let's break down:

  1. **Exam Question**: We'll write a concise scenario and question.

  2. **Model Answer**: We'll write an essay that:
     - Introduces the two-ledger test and applies it to the scenario.
     - Distinguishes between two kinds of introspective reports: (a) reports about the reasons for a decision (which are prone to confabulation and lack a second ledger) and (b) reports about present experience (which might have a second ledger in the form of concurrent behavioral or neural measures, but even then it's tricky).
     - Discusses reliability laundering in the context of the beeper method (how the real-time report becomes a number and then hard data).
     - Concludes that for present experience (what was going through their minds at the moment) the beeper report might be the best we have, but it doesn't necessarily earn the word "actually" without a second ledger. However, for the reasons for a decision, the retrospective account is clearly problematic.

  3. **Marking Scheme**:
     - We need to define specific moves that an A answer must make.
     - We'll have 25 total marks.
     - Criteria might include:
          C1: Introduce the two-ledger test and explain its relevance.
          C2: Apply the two-ledger test to the two kinds of introspective reports (without being told the distinction) and show they are different.
          C3: Discuss reliability laundering in the context of the beeper method.
          C4: Make a nuanced judgment about the word "actually" for each kind of report.
          C5: Overall structure and clarity.

     However, note the instruction: the model answer must stand on reasoning alone without citations.

     We must also define the A/B boundary: a B answer might discuss confabulation and the two-ledger test but fail to distinguish the two targets or apply the test appropriately to both.

     Contestable criteria: The distinction between the two targets might be contestable? Or the two-ledger test itself? We'll note if any.

     Pushback: We'll be honest if there are concerns.

  Let's draft the exam question:

  ---

  **Exam Question**:

  The science desk of a national magazine runs a feature on how people form political judgments. The study involved participants being beeped at random intervals over a fortnight, at which point they reported what was going through their minds at that moment. A week later, the same participants were interviewed about how they made up their minds on the political issue. The feature headline claims it reveals "what people actually thought at the time" versus "the stories they tell afterwards". 

  In an essay of approximately 650 words, evaluate whether the beeper reports deserve the label "actually" in the headline. In your evaluation, you must address the two-ledger test (which requires an independent record to validate a claim about inner life) and the concept of reliability laundering (where subjective reports become treated as hard data). 

  (Time allowed: 50 minutes; Marks: 25)

  ---

  Now, the model answer (we'll write it as continuous prose, about 650 words):

  **Model Answer**:

  The headline of the science feature draws a sharp distinction between "what people actually thought at the time" (captured by the beeper reports) and the "stories they tell afterwards" (from the retrospective interviews). At first glance, the real-time beeper method seems to bypass the pitfalls of memory and self-presentation that plague retrospective accounts. However, to evaluate whether the beeper reports truly deserve the label "actually", we must confront the fundamental problem of validating introspective reports: the two-ledger test. This test, a rule of thumb in journalism, asserts that any claim about a person's inner life is only as reliable as the independent record (the "second ledger") against which it can be checked. Without such a ledger, we have a claim, not a measurement.

  Applying the two-ledger test to the beeper reports reveals that the answer depends critically on *what aspect* of inner life is being reported. The study collects two kinds of introspective data: (1) reports of the participants' *present experience* at the moment of the beep (e.g., "I was thinking about the candidate's smile") and (2) in the retrospective interviews, reports about their *reasons for a decision* (e.g., "I decided because of the candidate's policy on education"). Crucially, the headline uses "actually thought" to refer to the beeper reports, which are about present experience, but the study also contrasts these with retrospective accounts of decision-making. The reliability of these two kinds of reports must be assessed separately.

  For the retrospective reports about reasons for a decision, the two-ledger test is devastating. When a participant says, a week later, "I decided because of X," what independent record exists to validate this? The decision itself is a fact, but the reasons behind it are not directly observable. Classic confabulation studies show that people often invent plausible reasons for choices they never actually made, and they do so with high confidence. Without a second ledger (such as a real-time recording of their reasoning process, which we don't have), these retrospective accounts are merely claims. They are particularly vulnerable to reliability laundering: when the reporter takes these reasons and turns them into quantitative data (e.g., coding them as categories or scales), the subjective and potentially confabulated nature of the report is laundered into the appearance of objective fact.

  The beeper reports, however, are about present experience. At the moment of the beep, the participant reports what is currently in their awareness. Is there a second ledger for this? The immediate challenge is that inner experience is private. However, one might argue that concurrent behavioral or neural measures could serve as a ledger. For instance, if a participant reports thinking about a candidate's smile, and eye-tracking shows they were looking at the candidate's face at that moment, that might be partial validation. But even then, the correspondence is imperfect: a person can look at a smile without consciously thinking about it, and vice versa. More fundamentally, the beeper report itself becomes laundered when it is turned into data. The participant's words ("I was thinking about the smile") are reduced to a code (e.g., "appearance-related thought") and then treated as a direct readout of "actual" thought. This laundering obscures the fact that the report is still a subjective interpretation of experience, not an objective measurement.

  So, does the beeper report earn "actually"? For present experience, it might be the best available record, but the two-ledger test shows we cannot validate it against a truly independent ledger. We have no access to the raw stream of consciousness; we only have the participant's description of it. This description is filtered through attention, language, and self-presentation. Thus, while the beeper method minimizes memory distortions, it does not provide a direct window into "actual" thought. It provides a *real-time self-report*, which is a different kind of claim than a retrospective one, but still only a claim.

  In conclusion, the headline overreaches by using "actually". The beeper reports are less distorted by memory than retrospective accounts, but they are not validated by a second ledger. Moreover, the study conflates two distinct targets of introspection: present experience and reasons for decisions. The beeper reports about present experience might be more reliable than retrospective reasons in the sense of being temporally closer, but neither meets the two-ledger test. The feature would be more accurate if it presented the beeper reports as real-time self-reports, not as the unvarnished truth. This distinction is vital for journalists: without it, we risk reliability laundering, turning subjective claims into hard data and misleading readers about what we can truly know of the mind.

  (Word count: ~650)

  ---

  **Marking Scheme** (as JSON):

  We need to define:

  - total_marks: 25
  - criteria: an array of 5 criteria (we'll assign marks so they sum to 25)
  - a_b_boundary: a string
  - contestable_criteria: maybe one or two?
  - pushback: we'll be honest.

  Criteria:

  C1: Introduce and explain the two-ledger test. (Marks: 4)
  C2: Identify and distinguish between the two kinds of introspective reports (present experience vs. reasons for decisions) without being prompted. (Marks: 6)
  C3: Apply the two-ledger test to both kinds of reports, showing why the retrospective reports about reasons fail and why the beeper reports about present experience are problematic but different. (Marks: 6)
  C4: Discuss reliability laundering in the context of the study, explaining how both types of reports can be laundered. (Marks: 5)
  C5: Make a nuanced judgment about the word "actually" for the beeper reports, recognizing the distinction and the lack of a second ledger. (Marks: 4)

  Total: 4+6+6+5+4 = 25.

  For each criterion, we provide:
  - id: e.g., "C1"
  - move: the specific move in one sentence.
  - marks: the points.
  - exemplary: what a top answer does.
  - typical_error: the mistake.
  - required_confidence: high, medium, low.

  A/B boundary: A B answer will discuss confabulation and the two-ledger test but might not distinguish the two targets (thus missing C2) or fail to apply the test appropriately to both (C3). It might mention reliability laundering but not in depth (C4). It might give a simplistic yes/no about "actually" without nuance (C5). An A answer must make all these moves.

  Contestable criteria: 
  - The distinction between the two kinds of reports (C2) might be contestable because the beeper report might sometimes include reasons? But we think it's clear enough. We'll note one contestable criterion: the application of the two-ledger test to present experience (part of C3) because some might argue that real-time reports are the gold standard and don't need a second ledger.

  Pushback: The task is well-posed, but one concern is that the two-ledger test might be seen as too strict (if we require independent records for inner states, we might never have any). Also, the distinction between the two targets might be blurred in practice. However, we think it's workable.

  Let's write the JSON.
answer: |-
  ### Exam Question
  **Essay Question (50 minutes, 25 marks)**  
  The science desk of a national magazine runs a feature comparing two methods for studying political judgments: (1) real-time "beeper" reports (participants describe what was going through their minds when beeped at random intervals over a fortnight), and (2) retrospective interviews (participants explain a week later how they made up their minds). The headline claims the beeper method reveals "what people actually thought," while the interviews capture "stories they tell afterwards."  

  Evaluate whether the beeper reports warrant the term "actually" in this context. Your answer must address the **two-ledger test** (a claim about inner life requires an independent record for validation) and **reliability laundering** (subjective reports becoming treated as objective data).  

  ---

  ### Model Answer (650 words)  
  The headline’s use of "actually" implies the beeper reports objectively capture true mental states, unlike the retrospective "stories." To evaluate this, we apply the two-ledger test: any introspective claim is only as reliable as an independent record against which it can be checked. If no such ledger exists, we have a claim—not a measurement. This test reveals a critical distinction between two types of introspection in the study: reports of **present experience** (what was in awareness at the beep moment) versus reports of **reasons for decisions** (why a choice was made). The validity of "actually" hinges on this unstated difference.  

  For **retrospective reports about decision-making**, the two-ledger test fails decisively. When participants explain their political choices a week later, they reconstruct reasons that feel plausible but often misalign with actual cognitive processes. Confabulation studies show people invent coherent narratives for choices they never made, unaware of the fabrication. Crucially, no independent ledger exists to verify these reasons. Decision-making involves unconscious biases, social influences, and fragmented memories inaccessible to introspection. A journalist cannot cross-check a source’s recollection against a "truth ledger" of mental causation. Here, reliability laundering compounds the problem: when a participant’s post-hoc reason (e.g., "I opposed the policy due to economic concerns") is coded as a "4" on a scale, it gains false objectivity. The number disguises its origin in guesswork, circulating as hard data.  

  The **beeper reports for present experience** face a different challenge. At first glance, they seem immune to memory distortion—participants describe thoughts in real time (e.g., "I’m wondering if the candidate is lying"). However, the two-ledger test still applies: what ledger validates that this report matches their "actual" inner state? Introspection accesses conscious awareness, but not pre-conscious or unconscious processes shaping it. For instance, a fleeting emotion might alter a thought before it enters awareness. More fundamentally, the report itself is a translation: raw experience into language. No independent record exists to confirm fidelity—unlike, say, a physical event captured by multiple cameras. Functional MRI or eye-tracking might correlate with reported thoughts, but these measure neural or behavioral proxies, not the experience itself. Reliability laundering emerges here too. When a beeper response ("I’m anxious about taxes") becomes a quantitative entry (e.g., "anxiety: 5/7"), it launders subjectivity into data. The "5" carries no trace of interpretive steps: Did the participant conflate "anxiety" with "anger"? Did they self-censor?  

  Does this mean beeper reports earn "actually"? For present experience, they are *less unreliable* than retrospective accounts because they avoid memory decay and narrative reshaping. But "less unreliable" ≠ "actual." The two-ledger test shows no ledger can verify the private link between experience and report. We accept beeper data pragmatically—as the *best available* window into conscious thought—but it remains a subjective claim. The headline’s phrasing obscures this; "actually" implies scientific certainty where none exists.  

  A rigorous journalist would thus avoid declaring either method captures "true" thoughts. For decision-making reasons, retrospective reports are epistemologically weak—a B-grade answer might note confabulation but miss the ledger test’s core point: without validation, reasons are stories, not facts. For present experience, beeper reports are useful descriptors but still laundered interpretations. The feature could honestly frame beeper data as "real-time self-reports" and interviews as "retrospective reconstructions," dropping "actually." This respects the limits of introspection while still contrasting temporal perspectives. Ultimately, the two-ledger test forces humility: inner life claims are inferences, not measurements. Treating them otherwise risks misleading readers with laundered certainty.  

  ---

  ### Marking Scheme  
  ```json
  {
    "exam_question": "The science desk of a national magazine runs a feature comparing two methods for studying political judgments: (1) real-time 'beeper' reports (participants describe what was going through their minds when beeped at random intervals over a fortnight), and (2) retrospective interviews (participants explain a week later how they made up their minds). The headline claims the beeper method reveals 'what people actually thought,' while the interviews capture 'stories they tell afterwards.' Evaluate whether the beeper reports warrant the term 'actually' in this context. Your answer must address the two-ledger test (a claim about inner life requires an independent record for validation) and reliability laundering (subjective reports becoming treated as objective data).",
    "total_marks": 25,
    "criteria": [
      {
        "id": "C1",
        "move": "Define and apply the two-ledger test to introspective reports.",
        "marks": 5,
        "exemplary": "Clearly explains the test as requiring an independent record for validation and applies it to both beeper and interview methods, showing why absence of a ledger reduces claims to inferences.",
        "typical_error": "Mentions the test superficially (e.g., 'we need evidence') but fails to articulate why inner states lack independent records or how this undermines 'actually'.",
        "required_confidence": "high"
      },
      {
        "id": "C2",
        "move": "Distinguish between two unstated targets of introspection: present experience vs. reasons for decisions.",
        "marks": 6,
        "exemplary": "Identifies the beeper's focus on real-time experience and the interview's focus on decision-making reasons without prompting, then evaluates their reliability separately.",
        "typical_error": "Treats all introspection as equally unreliable or conflates the two targets (e.g., assumes beeper reports also capture 'reasons').",
        "required_confidence": "high"
      },
      {
        "id": "C3",
        "move": "Explain why retrospective decision-reasons fail the two-ledger test.",
        "marks": 5,
        "exemplary": "Argues decision-making reasons have no possible ledger (e.g., unconscious biases are inaccessible) and links this to confabulation risks beyond mere citation.",
        "typical_error": "Only recites confabulation findings (e.g., 'Nisbett and Wilson') without tying them to the ledger test's validation problem.",
        "required_confidence": "medium"
      },
      {
        "id": "C4",
        "move": "Analyze beeper reports for present experience using both the ledger test and reliability laundering.",
        "marks": 5,
        "exemplary": "Concedes beeper reports avoid memory distortions but shows they still lack validation (no ledger for raw experience) and become laundered when quantified.",
        "typical_error": "Assumes real-time reporting guarantees accuracy or only critiques laundering without ledger-test analysis.",
        "required_confidence": "medium"
      },
      {
        "id": "C5",
        "move": "Reach a nuanced verdict on 'actually' that depends on the introspection target.",
        "marks": 4,
        "exemplary": "Concludes 'actually' is indefensible for decision-reasons, and overreaching for present experience (calling it 'less unreliable' but not validated).",
        "typical_error": "Gives a binary yes/no about beeper reports, ignoring the distinction between experience and reasons.",
        "required_confidence": "low"
      }
    ],
    "a_b_boundary": "A B answer covers confabulation and the two-ledger test superficially (e.g., 'introspection is flawed') but fails to distinguish present experience from decision-reasons (C2) or articulate why the ledger test fails for each (C3/C4). It may misuse 'reliability laundering' as a buzzword. An A answer must make both distinctions and show how the ledger test's outcome differs for each target.",
    "contestable_criteria": [
      {
        "id": "C2",
        "why_contestable": "Students may argue the beeper could incidentally capture decision-reasons (e.g., if beeped during deliberation), blurring the distinction.",
        "marks_at_stake": 6
      },
      {
        "id": "C4",
        "why_contestable": "Some may claim real-time reports are the 'least bad' ledger for experience, making 'actually' justifiable pragmatically.",
        "marks_at_stake": 5
      }
    ],
    "pushback": {
      "is_the_task_well_posed": true,
      "concerns": [
        "The two-ledger test assumes inner states require external validation—a stance some philosophers/psychologists reject (e.g., phenomenal realists).",
        "Students might overindex on confabulation due to its prominence in curricula, requiring strong rubric enforcement."
      ],
      "what_i_would_change": "Clarify the scenario: specify beeper prompts avoid direct questions about decisions (e.g., 'What is in your mind now?' not 'Why do you support X?')."
    }
  }
  ```

  ### Key Rationale for Marking  
  - **Why a confabulation-only answer tops at B**: Reciting Nisbett/Wilson-style findings (e.g., "people invent reasons") earns partial credit for C3 but misses the core epistemological problem (no ledger exists for reasons). Without distinguishing targets (C2) or laundering analysis (C4), it cannot achieve nuance.  
  - **A-grade differentiation**: Top answers must **discover** the two introspection targets and show why the ledger test invalidates "actually" for decisions but leaves present experience in a gray zone (laundered but pragmatically useful).  
  - **Contestability handled**: The rubric rewards recognizing the distinction (C2) even if debatable, and C4 allows arguing beeper data is "best available" while still rejecting "actually" as overstated.  
  - **Pushback transparency**: The task is sound but flags where students might reasonably dissent (e.g., if they reject ledger-test strictness).
