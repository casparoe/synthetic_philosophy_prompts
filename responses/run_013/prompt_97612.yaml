  So, structuring the response: Start with the slavery example. Detail the scenario, confirm valid consent, then explain why it's impermissible due to violating self-regarding duties, impacting moral agency. Mention Kant's view. Then discuss why third-party harm isn't involved. Acknowledge that some ethicists reject duties to oneself but the example highlights the conceptual split.
answer: |-
  You're absolutely right to separate these two questions – it's a crucial distinction in ethics and law. The cleanest example that meets your criteria (valid consent, no third-party harm, impermissibility tied to a duty to oneself) is:

  **Selling Oneself into Slavery**

  1.  **The Act:** A competent, financially desperate adult voluntarily signs a legally and morally binding contract to become the permanent, chattel slave of another person. This includes irrevocable surrender of all autonomy, rights, and freedoms. The "buyer" is wealthy and seeks absolute control over another human being.
  2.  **Valid Consent:**
      *   **Competence:** The seller is an adult of sound mind, understands the lifelong, irreversible consequences of total subjugation (loss of freedom, bodily autonomy, right to refuse labor, right to leave, etc.).
      *   **Informed:** The terms are crystal clear. The seller knows exactly what "chattel slavery" entails – complete ownership by another person. No deception is involved.
      *   **Voluntary/Uncoerced:** While desperate, the seller isn't under direct duress (e.g., no one is holding a gun to their head). They see this as their least bad option to escape crushing poverty or debt. They freely sign the contract after deliberation. Their consent is *substantively* autonomous in the moment.
  3.  **Why it Should Still Not Happen (Impermissibility):**
      *   **The Core Reason:** The act fundamentally violates a profound **duty one owes to oneself** as a moral agent: the duty to preserve one's own inherent dignity, autonomy, and status as an end-in-oneself (not merely a means). By irrevocably surrendering their entire being and future agency, they are effectively annihilating their own moral personhood.
      *   **Violation of Self-Regarding Duty:** Consent here is being used as a tool for self-destruction *as a moral agent*. Even if validly given, the act is impermissible because it treats the self as a disposable commodity or tool, violating the inherent respect owed to human dignity *by the person themselves*.
      *   **No Third-Party Harm (Directly):** The immediate harm is entirely self-inflicted. The "buyer" might be acting immorally by *accepting* such an offer, but the *impermissibility of the seller's act itself* stems from what the seller is doing *to themselves*.

  **Why this works:**

  *   **Consent is Clearly Valid:** It meets all standard criteria for valid consent (competence, information, voluntariness).
  *   **Impermissibility is Separate:** The reason it shouldn't happen isn't that the consent is defective (it's not), or that it directly harms a third party (the buyer *wants* it, and society's harm is indirect/downstream). The core problem is the *nature of the act itself* on the person performing it.
  *   **Appeals to Duty to Self:** This example forces the appeal to something like a Kantian duty to oneself: humans, as rational beings with dignity, have an obligation not to degrade or destroy their own capacity for rational agency and self-determination. Selling oneself into slavery is the ultimate violation of this duty.
  *   **Conceptual Split:** It cleanly separates the question "Did they *really* agree?" (Yes) from the question "Is this a thing that *should be agreed to*, even if truly and freely wanted?" (No, because of its self-destructive nature regarding moral agency).

  **Objections and Nuances:**

  1.  **"But isn't desperation coercion?"** Not necessarily in the legal/philosophical sense needed to invalidate consent. People make desperate but valid choices all the time (e.g., taking dangerous jobs). The consent here is still *informed and unforced*, even if the *motivation* is terrible circumstances.
  2.  **"Doesn't society have an interest?"** Yes, but that's a *separate*, indirect reason for impermissibility (maintaining a free society, preventing exploitation markets). The *primary* reason the act itself is impermissible, even in a vacuum, is the self-violation. Society's interest reinforces it but isn't the core conceptual point.
  3.  **"Duties to oneself aren't real!"** This is the crux of your skepticism. Philosophers like Kant argue they *are* fundamental. Others (like many consequentialists) reject them. However, **this example is designed to challenge that skepticism.** If you feel strongly that selling oneself into slavery *should not happen* even with valid consent and no direct third-party harm, you are likely appealing, at least intuitively, to *some* notion that the person owes it to *themselves* not to do this utterly self-destructive thing. If you find it permissible, that reveals a different ethical stance.

  **Other potential examples (less clean but related):**

  *   **Consensual Cannibalism (to be eaten):** Valid consent possible? Arguably (e.g., Armin Meiwes case). Impermissible? Strongly argued due to violation of the sanctity of life/duty to self-preservation, even if consent is valid. (More controversial due to extreme nature and direct harm *to the consenter*, but fits the duty-to-self argument).
  *   **Severe, Non-Therapeutic Self-Mutilation:** E.g., consensual amputation of a healthy limb purely for personal gratification/identity. Valid consent possible? Yes. Impermissible? Argued as violating bodily integrity/duty to preserve one's wholeness *for its own sake*. (Harder to separate from potential mental health questions).

  The slavery example remains the strongest philosophical case for cleanly separating valid consent from permissibility based on a duty to oneself. It highlights that autonomy isn't just about *having* choices; some choices fundamentally undermine the very capacity for autonomy and dignity that gives choice its moral weight.
