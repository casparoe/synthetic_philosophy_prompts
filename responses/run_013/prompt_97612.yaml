  Here's a distinction I keep tripping over: whether consent is *valid* (the person actually waived the right — competent, informed, not coerced) versus whether the thing they consented to is *permissible* (nothing else stands in the way). i'm fairly sure these are two different questions, but I can't come up with a clean case where they really come apart. Can you give me one — a case where the consent is unquestionably valid and yet the act still shouldn't happen — where the reason isn't that the consent was somehow defective, and isn't harm to some third party either? It'd be even better if the example forces you to appeal to something like a duty the person owes to themselves, since honestly I'm not sure those are even a thing.
