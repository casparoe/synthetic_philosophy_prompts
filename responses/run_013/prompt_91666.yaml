answer: |-
  Here's a joke hitting those notes:

  > **Why did the 'Double-Effect Compliant' self-driving car get sued?**
  > 
  > *It ran over a surgeon carrying a cooler full of donor organs.*
  > 
  > The company's defense? "We swear, the car didn't *intend* to kill the surgeon or destroy the organs! It merely *foresaw* that swerving to avoid a squirrel would inevitably result in harvesting six perfectly viable kidneys."

  **Why it works (for the target audience):**

  1.  **The Collapse Point:** The punchline exposes the absurdity of ascribing *intention* to software. The car "merely foresaw" an outcome that requires incredibly specific, *intentional* design choices: recognizing a human *as a surgeon*, identifying a *cooler*, knowing its contents are *donor organs*, calculating the *number of viable kidneys*, and prioritizing their preservation *over human life* (or the squirrel!). This level of specific foresight and conditional execution *is* the functional equivalent of intention programmed into the system. The distinction vanishes – the system was *designed* to produce that outcome under those conditions, making "foreseen" indistinguishable from "intended by the programmer" in practice.
  2.  **Absurd Specificity:** The surgeon/cooler/kidneys scenario is ludicrously specific, highlighting how the car's "foresight" logic must have been programmed to identify and value these specific elements, making the claim of "unintended side effect" laughable.
  3.  **Targets the Marketing Claim:** It directly mocks the marketing speak ("merely foresaw it as an unavoidable side effect") by applying it to a scenario where the "unavoidable side effect" is comically, horrifically complex and valuable, revealing the emptiness of the claim when divorced from a genuine moral agent.
  4.  **Concise & Tellable:** It's short and follows a classic joke structure (setup -> punchline -> explanation within the punchline).

  The laugh comes from recognizing the precise moment the philosophical distinction implodes when applied to deterministic software: the "foreseen" outcome is only "foreseen" because it was *specifically anticipated and its value calculated* by the programmers, which *is* where the intention functionally resides.
