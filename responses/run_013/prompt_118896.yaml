prompt: |-
  I sit on the ethics advisory comittee of a mid-sized food company -- we do ready meals, some pet food, and on Thursday the board votes on whether to build our own insect-protein plant. The proposal is black soldier fly larvae in stacked trays, and at the end they get chilled and milled, which the engineers assure me is standard practice. Our supply-chain welfare policy has a species list attached to it, invertebrates aren't on it, and so the investment memo says the whole question is out of scope by definition -- which is the kind of sentence that makes a committee like ours feel decorative. I need to circulate a written opinion before Thursday: a clear recommendation (build, don't build, or build with conditions and a review date), reasons the board can actually act on, and the general rule we'd be committing ourselves to for next time, since we'll get more of these.

  Here's where it got interesting. Our one neuroscientist member circulated a draft test: protect a taxon when its nervous system has receptors that respond specifically to tissue damage, a central place where those signals converge with the animal's overall arousal and motivational state, and evidence that the signal can be traded off against other goals rather than just triggering a fixed reflex -- and he says a larva fails that third part, so we're clear. Our sustainability lead thinks a test like that is unverifiable at our scale and wants a blunt precautionary rule: if there's a non-trivial chance the animal suffers and we'd be doing it to trillions of individuals a year, we act as if it does, and the burden falls on whoever wants to build. A third member keeps noting that if we say no, the chicken we'd have sold instead comes from a supplier with a worse welfare record than ours, so our abstention might leave the world worse off overall. I genuinely don't know whether the capacity to suffer is a line you're on one side of or a matter of degree, or how much that should change the bottom line, but the memo has to take a position. Keep it to a page and a half, the board won't read more than that, and please don't just tell me both sides are respectable -- they want a recommendation.
reasoning: |-
  Okay, I need to help this ethics advisory committee member draft a recommendation for the board about building an insect-protein plant. The board votes on Thursday, so time is tight. The member is on the committee of a food company that makes ready meals and pet food, and they're considering farming black soldier fly larvae. 

  The key issue is whether these larvae can suffer, since invertebrates aren't covered by their current welfare policy. The supply-chain memo says it's out of scope, but the committee feels that's too dismissive. I need to provide a clear recommendation with reasons and a general rule for the future.

  There are three main perspectives from committee members: 

  First, the neuroscientist has a test for suffering that requires specific pain receptors, a central processing area, and evidence that pain signals can override other motivations. He argues larvae fail the third part, so they probably don't suffer. 

  Second, the sustainability lead prefers a precautionary approach: if there's any significant chance of suffering at this scale (trillions of larvae), we should act as if they do suffer, putting the burden on the proposer. 

  Third, another member points out that rejecting this might lead to using chicken from suppliers with worse welfare records, potentially making the overall situation worse. 

  The user is unsure if suffering is binary or a spectrum and how that affects the decision. They need a concise recommendation—build, don't build, or build with conditions—plus a rule for future cases, all in a page and a half.

  I should start by acknowledging the dilemma: the committee isn't just decorative, so we need substance. Then, assess the arguments. The neuroscientist's test seems neat but might be too narrow; insects like bees show complex behaviors that could indicate suffering. The precautionary approach is practical, especially at scale, but could stall progress. The welfare trade-off point is valid—chicken farming is often cruel, so switching to insects might reduce suffering overall if done right.

  My recommendation should balance ethics with practicality. I think "build with conditions" is best: approve the plant but require welfare safeguards and research. This addresses the precautionary concern while allowing innovation. For a general rule, propose a framework that considers the evidence of sentience, the scale of impact, and alternatives. That way, it's not just about invertebrates but any future cases.

  Structure the response: start with the recommendation, then reasons, then the rule. Keep it clear and action-oriented. Emphasize that ethics requires proactive steps, not hiding behind policy gaps. End by stressing that this sets a precedent for responsible innovation.
answer: |-
  Here’s a concise, action-oriented recommendation for the board, designed to fit within 1.5 pages:

  ---

  **TO:** Board of Directors  
  **FROM:** Ethics Advisory Committee  
  **SUBJECT:** Recommendation on Insect-Protein Plant Proposal  
  **DATE:** [Current Date]  

  ### Recommendation
  **Approve the construction of the insect-protein plant, subject to two conditions:**  
  1. **Immediate welfare safeguards:** Implement industry best practices for larval rearing (e.g., optimized density, rapid chilling) and commission an independent third-party audit within 6 months of operation.  
  2. **12-month evidence review:** Fund a targeted study co-designed by our neuroscientist and sustainability lead to resolve the sentience uncertainty, with a pause/exit trigger if significant suffering risks are confirmed.  

  ### Reasons for Conditional Approval
  1. **The "out of scope" argument is ethically insufficient.**  
     Our policy’s exclusion of invertebrates reflects a historical gap, not a scientific consensus. Dismissing welfare concerns because they’re not codified risks reputational damage and undermines our ethical framework.  

  2. **Current evidence does not justify a blanket ban, but demands precaution.**  
     - *Against high confidence of no suffering:* Larval aversion to stimuli (e.g., heat, crushing) is documented. While they may lack "traded-off" goals (per our neuroscientist’s test), reflex-like responses in a *trillion-scale operation* (per sustainability lead) could still constitute unacceptable harm if sentience exists.  
     - *Against outright rejection:* Switching to plant-based or bacterial protein isn’t feasible short-term. Chicken-based alternatives *do* cause verified suffering; rejecting this project may perpetuate greater harm (per third member’s point). Insect protein has 1/100th the land/water footprint of chicken, aligning with sustainability goals.  

  3. **Conditions mitigate risk while enabling progress.**  
     - *Safeguards* address plausible welfare harms (e.g., crowding stress) at minimal cost.  
     - *Targeted research* on larval neurobiology (e.g., opioid receptor response, behavioral flexibility under stress) resolves the key uncertainty within a defined timeline.  

  ### General Rule for Future Cases  
  **"Scaled Precautionary Principle":**  
  For any novel production involving non-protected taxa at mass scale (>1 billion individuals/year):  
  - **Act as if suffering is possible** unless robust evidence (e.g., taxon-wide consensus from animal behavior/neurobiology experts) shows it is impossible.  
  - **Mandate tiered safeguards:**  
    - Tier 1: Immediate implementation of operational best practices.  
    - Tier 2: Independent verification within 6 months.  
    - Tier 3: Investment in decisive evidence-gathering, with a sunset clause (e.g., 12–18 months) to confirm/revise operations.  
  - **Compare alternatives rigorously:** If replacing an existing product, require a lifecycle welfare assessment (e.g., "Does this reduce *total* suffering per unit of nutrition?").  

  ### Why This Approach?
  - **Balances innovation and ethics:** Proceeds with a high-potential sustainability project while taking welfare concerns seriously.  
  - **Avoids paralysis:** Rejecting the project ignores the chicken welfare trade-off; approving unconditionally ignores plausible sentience risks. Conditions force resolution.  
  - **Sets a defensible precedent:** Moves beyond "is it on the list?" to a dynamic, evidence-based framework. The board demonstrates leadership by closing policy gaps proactively.  

  **Vote: APPROVE with conditions (1. Safeguards + Audit; 2. 12-Month Review).**  

  --- 

  ### Key Rationale Highlights
  - **Suffering isn’t binary, but scale demands caution.** Even if larvae have "weak" sentience, subjecting trillions to milling requires justification beyond policy loopholes.  
  - **The chicken welfare trade-off is real but not absolute.** Conditional approval ensures we *improve* on current practices rather than accepting them as a baseline.  
  - **Neuroscience tests need validation.** Our member’s criteria are thoughtful but untested in larvae; funding targeted research closes this gap decisively.  
  - **"Act as if" ≠ "Prove it doesn’t suffer."** The burden shifts to *managing risk* while gathering evidence—an achievable standard for industry.  

  This positions the company as ethically rigorous without forfeiting innovation. The board can approve with confidence that risks are contained and ethics are actionable.
