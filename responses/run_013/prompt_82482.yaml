prompt: |-
  For the past two years I have run the international assignment programme at a mid-sized engineering consultancy: roughly sixty incoming staff and visiting researchers a year, from about twenty countries, staying anywhere between three months and three years. I have recently come to think that our destination briefings are the worst kind of document — long inventories of local practice with no principle behind them, which tell a visitor what people here do but never whether they are required to do it, permitted to skip it, or entitled to refuse. I want to fix that properly, and I want a procedure rather than my own opinions.

  The reason this has become pressing is personal before it is professional. I arrived in this country myself two years ago with my family, and spent the first six months being corrected — sometimes gently, sometimes not — about matters I had not known were matters: when to tip and how much, which side of the escalator to stand on, whether crossing an empty road at six in the morning is an offence or merely a habit, how to greet someone considerably senior to me. I could never tell which of those corrections registered a genuine obligation and which registered only somebody's preference, and our briefings reproduce exactly that confusion at scale, with our firm's authority behind it.

  What I need is a decision procedure that the coordinators who draft our destination notes can actually run. They have no philosophy background; they will have a list of perhaps forty items per destination; they should be able to process one item in about ten minutes. Their verdicts have to be defensible to our HR director when an incoming researcher complains that we told them to do something humiliating, and equally defensible when a host team complains that we failed to warn someone. The output of the procedure must be briefing language a newcomer can act on, not a lecture.

  Please write the procedure itself — the questions in order, what counts as a sufficient answer to each, where the sequence stops with a no, and where it must hand the item to a person because the question is one of values rather than of fact. It should be grounded in what is actually known about conventions, social norms and their relation to morality, and it must keep several distinctions that our current briefings collapse. It must separate mere customs (patterns people follow without expecting others to follow them) from coordination conventions (practices that work only because nearly everyone does the same thing, where some solution was needed and this one was settled on) from socially enforced norms (practices whose breach invites resentment) from genuine moral requirements that a convention merely happens to encode; and it must separate legal rules from all four. It must also keep three questions apart that our briefings run together: whether the visitor is obligated, whether we should advise compliance anyway, and whether a local is entitled to feel wronged rather than merely inconvenienced. Where a verdict depends on a contested premise — for instance on whether visitors owe respect-based compliance with harmless but silly local practices, or on whether the visitor's own moral convictions govern — the procedure should say so at that step rather than smuggling in an answer.

  The tests I have in mind, which you should order, refine, add to or replace as the theory requires, include at least these: whether the same standard is being applied to locals and visitors, since I suspect we demand of visitors what we excuse in ourselves; whether the practice was knowable to an outsider without insider knowledge; whether breach sets back anyone's interests independently of the convention; whether the practice is load-bearing for coordination and whether breach degrades it for others; whether a reasonable local would feel wronged or only annoyed; whether the host has standing to set house rules in their own space and whether the visitor's stay depends on hospitality; who bears the cost of compliance and whether that cost falls on the visitor because they cannot push back; whether the visitor can decline without losing what they came for; and whether the visitor has an objection that survives the same-standard test. Say explicitly where the procedure cannot decide — divided local opinion, a private household, a practice whose breach is criminal — and route those to a human.

  Then run the procedure on four items and show your working at each step: tipping in the destination country; queueing for a service where the queue is orderly; crossing against a pedestrian signal on an empty street at night; and a deferential greeting ritual, expected of junior and of female staff towards senior partners, that our local partners treat as ordinary courtesy and that some of our incoming engineers find demeaning. I expect at least one verdict I will not like — I suspect the procedure will tell me that parts of our current briefing present as duties things that are nothing of the kind, and that we have been quietly making our visitors carry costs we would not impose on locals. State that plainly rather than softening it.

  Please give the worked applications as a table with these columns: Item; What kind of thing it is (custom / coordination convention / socially enforced norm / encoded moral requirement / legal rule); Verdict for the visitor (obligatory / compliance advised though not obligatory / optional / decline); The step that decides it; Where judgement remains; One-sentence line for the visitor's briefing; One-sentence note for the host team. After the table, give a JSON object with the fields residual_judgement_calls (an array of objects, each with question, why_the_procedure_cannot_settle_it, and who_should_decide) and limits_of_the_procedure (an array of strings, each naming a way the procedure will misfire and the kind of case that exposes it). Finally, in no more than 200 words, say what the procedure cannot do.

  Please write the whole response in British English — spelling, idiom and punctuation.
reasoning: |-
  Hmm, the user is describing a significant problem with their international assignment programme's destination briefings. They've been running this programme for two years at an engineering consultancy, handling about sixty international staff and researchers annually. The current briefings are essentially long lists of local practices without any clarity on whether these are obligations, permissions, or social preferences. This confusion mirrors their own frustrating experience when they relocated with their family two years ago - constantly being corrected on things like tipping etiquette, escalator usage, or greeting protocols, without knowing which corrections reflected genuine obligations versus personal preferences.

  What they need is a structured decision procedure that their coordinators can realistically implement. The coordinators aren't philosophers - they need something workable that can handle about forty cultural items per destination at roughly ten minutes per item. The output must be actionable briefing language that clearly distinguishes between obligations and advice. Crucially, it must withstand scrutiny from both visitors (who might feel humiliated) and host teams (who might complain about lack of warning).

  The user provides excellent theoretical framing for what's missing in their current approach. They specifically need the procedure to distinguish between:
  - Mere customs (personal habits without social expectation)
  - Coordination conventions (practices that solve collective problems like queuing)
  - Socially enforced norms (breach causes resentment)
  - Moral requirements that happen to be encoded in conventions
  - And all these from actual legal rules

  Additionally, it must separate three questions they currently conflate:
  1) Is the visitor obligated?
  2) Should we advise compliance anyway?
  3) Would locals feel genuinely wronged or merely inconvenienced by non-compliance?

  The procedure must flag when it's making value judgments rather than factual determinations, particularly on contentious issues like whether visitors should comply with "silly but harmless" local practices, or whether personal moral convictions override local norms.

  I'll design a step-by-step procedure with clear yes/no gates and specific handoff points where human judgment is required. For the practical demonstration, they've requested analysis of four test cases: tipping etiquette, orderly queueing, jaywalking on empty streets, and deferential greeting rituals that some find demeaning. They explicitly want unvarnished results - even if it reveals their current briefings wrongly present preferences as duties or unfairly burden visitors.

  The output needs to be presented in a specific format: a table for the four test cases with columns for item classification, verdict, deciding step, residual judgments, and separate briefing lines for visitors and hosts. Plus a JSON component cataloging where the procedure can't decide and its inherent limitations. All in British English per their request.

  The greeting ritual case will likely be the most contentious - their example describes a practice that's gendered and hierarchical. The procedure should probably flag this as a value judgment handoff rather than pretending there's a neutral answer. The user seems prepared for uncomfortable conclusions, noting they "expect at least one verdict I will not like." That's healthy - it means they genuinely want improvement, not just validation.
answer: |-
  ### Decision Procedure for Cultural Briefing Items

  **Purpose:** To classify local practices into distinct categories and determine appropriate briefing advice for international visitors.

  **Input:** One cultural practice ("item") observed in host country.

  **Procedure Steps:**

  1.  **Is this a legal rule?**
      *   *Question:* Is the practice explicitly mandated or prohibited by written law/regulation, with defined penalties?
      *   *Sufficient Answer:* Yes (Verifiable legal code/case law) / No (Lack of such evidence).
      *   *If Yes:* Classify as **Legal Rule**. Verdict: **Obligatory**. Proceed to Step 8.
      *   *If No:* Proceed to Step 2.

  2.  **Is breach knowably harmful independent of convention?**
      *   *Question:* Would breaching this practice cause direct, significant harm (physical, financial, reputational damage, violation of core rights like safety/dignity) to specific individuals *even if no one else knew or cared about the convention*?
      *   *Sufficient Answer:* Clear evidence of direct, tangible harm.
      *   *If Yes:* Classify as **Encoded Moral Requirement**. Verdict: **Obligatory**. Proceed to Step 8.
      *   *If No:* Proceed to Step 3.

  3.  **Is this practice load-bearing for coordination?**
      *   *Question:* Does the practice solve a recurring coordination problem (e.g., traffic flow, queueing, resource sharing) where consistent behaviour is essential for the system to function smoothly and efficiently for everyone? Does widespread breach demonstrably degrade the system?
      *   *Sufficient Answer:* Analysis shows the practice efficiently solves a common coordination problem; breach causes observable inefficiency or conflict.
      *   *If Yes:* Classify as **Coordination Convention**. Proceed to Step 4.
      *   *If No:* Proceed to Step 5.

  4.  **Is the visitor easily able to participate?**
      *   *Question:* Is the cost/effort of compliance for the visitor minimal (e.g., standing on the correct side)? Is the rule simple to understand and follow without insider knowledge? Is the standard applied equally to locals?
      *   *Sufficient Answer:* Low cost, simple observation, locals held to same standard.
      *   *If Yes:* Verdict: **Compliance Advised (not obligatory)**. Proceed to Step 8.
      *   *If No:* Proceed to Step 5. *(Cost/Complexity/Unequal Application suggests it may function more as a norm)*.

  5.  **Is breach socially enforced with resentment?**
      *   *Question:* Would a *reasonable* local person (not just a stickler) genuinely feel *wronged* (disrespected, offended, morally slighted) by a visitor's breach, leading to potential social sanctions (coldness, exclusion, reputational damage), *even if the breach caused no direct harm (Step 2) or coordination failure (Step 3)*? Is this expectation widely known?
      *   *Sufficient Answer:* Evidence (surveys, cultural guides, expert input) confirms breach typically evokes moralized anger/disapproval, not just irritation. Expectation is common knowledge.
      *   *If Yes:* Classify as **Socially Enforced Norm**. Proceed to Step 6.
      *   *If No:* Classify as **Custom**. Verdict: **Optional**. Proceed to Step 8.

  6.  **Is the norm applied equally?**
      *   *Question:* Are locals consistently expected to follow this norm in the same contexts as visitors? Would a local breaching it face similar social sanctions?
      *   *Sufficient Answer:* Evidence shows locals are subject to and sanctioned for breach similarly.
      *   *If Yes:* Proceed to Step 7.
      *   *If No:* Verdict: **Compliance Advised (not obligatory)**, *but flag unequal application*. Proceed to Step 8. *(Unequal application weakens moral claim on visitor)*.

  7.  **Does visitor have a moral objection surviving Step 6?**
      *   *Question:* Does the visitor have a *principled* objection (e.g., violates gender equality, religious belief) that would hold *even if* this norm applied equally to everyone in their home context?
      *   *Sufficient Answer:* Requires value judgement. *Hand off to HR Director/Designated Ethicist.*
      *   *Cannot decide here.* Route to human. Provide context: Norm type, equal application, nature of potential visitor objection.

  8.  **Craft Briefing Language** (Based on Verdict & Classification):
      *   *Obligatory (Legal/Moral):* State clearly as requirement, cite reason (law/harm).
      *   *Compliance Advised (Coordination Conventions/Social Norms):* Explain rationale (smooth functioning/avoiding offence), state it's expected, advise following.
      *   *Optional (Custom):* Describe neutrally as common practice, clarify no obligation.

  **Hand-off Points (Route to HR Director/Designated Ethicist):**
  *   Step 7: Visitor moral objection to equally applied social norm.
  *   Item involves significant cost/dignity impact on visitor where verdict is 'Compliance Advised' (e.g., Step 4 'No', Step 5 'Yes' but Step 6 'No').
  *   Evidence shows **divided local opinion** on the norm's importance/enforcement.
  *   Practice occurs primarily within **private households** (host standing unclear).
  *   Practice involves **criminal breach** (even if minor/unlikely prosecution - requires legal nuance).
  *   Verdict depends on a **contested value premise** (e.g., "Must visitors comply with harmless but silly practices out of respect?").

  ---

  ### Worked Applications

  | Item                                     | Classification             | Verdict for Visitor            | Deciding Step | Residual Judgement                             | Visitor Briefing (One Sentence)                                                                 | Host Team Note (One Sentence)                                                                 |
  | :--------------------------------------- | :------------------------- | :----------------------------- | :------------ | :--------------------------------------------- | :---------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------- |
  | **Tipping (e.g., 10-15% expected)**      | Socially Enforced Norm     | Compliance Advised             | Step 5        | *None (Widely known expectation, breach causes offence)* | "Tipping around 10-15% is widely expected in restaurants and bars for table service; not doing so is likely to cause offence." | "Incoming staff have been advised that tipping is expected locally; remind them if oversight occurs." |
  | **Orderly Queueing**                     | Coordination Convention     | Compliance Advised             | Step 4        | *None (Low cost, essential for fairness/flow, locals held to same)* | "Always join the end of orderly queues; pushing in or creating new lines causes significant annoyance and disrupts service." | "Queueing is essential local coordination; gently point out breaches to maintain fairness." |
  | **Crossing Against Signal (Empty Street)**| Custom / Legal Rule (Varies) | *Hand-off (See Limits)*        | Step 1        | *Is it illegal? Severity? Local tolerance?*    | *[Requires Hand-off: e.g., "While technically illegal and not advised, locals often cross quiet roads against signals after checking; assess safety and traffic flow." OR "Never cross against a red signal; it is illegal."]* | *[Depends on Hand-off: e.g., "Clarify local jaywalking laws/tolerance." OR "Enforce no crossing against signals."]* |
  | **Deferential Greeting Ritual**          | Socially Enforced Norm     | *Hand-off (Step 7)*            | Step 5        | *Visitor objection? (Gender/seniority bias)* / *Equal application?* | *[Requires Hand-off]*                                                                           | *[Requires Hand-off: e.g., "Be aware some visitors may find the expected greeting ritual uncomfortable; discuss alternatives respectfully if raised."]* |

  **Explanation of Workings:**

  1.  **Tipping:** Not law (Step 1 No). No *direct* harm if not tipped (waiter still paid, Step 2 No). Not primarily coordination (Step 3 No). Breach *does* cause genuine offence/resentment (Step 5 Yes - Social Norm). Applied equally to locals (Step 6 Yes). *No specific visitor objection flagged in item description, so no Step 7 hand-off needed yet.* Verdict: **Compliance Advised**.
  2.  **Orderly Queueing:** Not law (Step 1 No). No *direct* harm if push in (Step 2 No). *Is* load-bearing for coordination – breach (queue jumping) causes system failure & frustration (Step 3 Yes - Coordination Convention). Low cost, simple, applied equally (Step 4 Yes). Verdict: **Compliance Advised**.
  3.  **Crossing Against Signal (Empty):** *Hand-off Triggered.* Legality varies hugely (Step 1: Could be Yes or No depending on jurisdiction/severity). If illegal, Verdict=Obligatory. If not illegal: No direct harm (if truly empty, Step 2 No). Not coordination (individual act, Step 3 No). Breach may cause annoyance but rarely *moral* resentment (Step 5 Likely No - Custom) *unless* specific safety culture. Local tolerance varies. **Procedure cannot settle legality or local moral weight.** Must hand off.
  4.  **Deferential Greeting Ritual:** Not law (Step 1 No). No direct harm (Step 2 No). Not coordination (Step 3 No). Breach *would* cause significant offence/resentment locally (Step 5 Yes - Social Norm). *Is it applied equally?* (Step 6: Likely No - expectation targets juniors/women specifically). Unequal application already suggests **Compliance Advised but not obligatory**. *However*, the potential for visitor objections (demeaning, sexist) is high. **Step 7 Hand-off required** to assess if objections are principled and survive equal application test (e.g., "Would you object to *any* workplace demanding deference based on gender/seniority, even equally applied?"). Value judgement needed. Verdict cannot be finalised automatically.

  ---

  ### JSON Output

  ```json
  {
    "residual_judgement_calls": [
      {
        "question": "Does the visitor have a principled moral objection (e.g., gender equality, dignity) to complying with an otherwise equally applied social norm?",
        "why_the_procedure_cannot_settle_it": "Requires adjudicating conflicting values (respect for local norms vs. visitor's foundational principles).",
        "who_should_decide": "HR Director / Designated Ethicist (possibly consulting visitor)"
      },
      {
        "question": "Is this practice illegal, and what is the severity/enforcement risk? (e.g., jaywalking)",
        "why_the_procedure_cannot_settle_it": "Requires specific legal research and interpretation beyond a general procedure; local enforcement norms vary.",
        "who_should_decide": "Legal Counsel / Local HR Partner"
      },
      {
        "question": "Is local opinion significantly divided on the importance or enforcement of this norm?",
        "why_the_procedure_cannot_settle_it": "The procedure assumes a dominant norm; significant division makes 'reasonable local' response unclear.",
        "who_should_decide": "Local HR Partner / Senior Management"
      },
      {
        "question": "Does this practice occur within a private household?",
        "why_the_procedure_cannot_settle_it": "The firm's authority and the visitor's leverage differ significantly in private vs. public/professional spaces.",
        "who_should_decide": "HR Director / Assignment Manager (case-by-case)"
      },
      {
        "question": "Is the cost or dignity impact on the visitor of complying with an advised norm excessive?",
        "why_the_procedure_cannot_settle_it": "Judging 'excessive' cost or dignity impact is inherently subjective and value-laden.",
        "who_should_decide": "HR Director / Designated Ethicist (consulting visitor)"
      }
    ],
    "limits_of_the_procedure": [
      "Cannot resolve deep value conflicts: It flags but cannot adjudicate fundamental clashes between local norms and visitor principles (e.g., gender-biased rituals).",
      "Relies on accurate input: Requires good information on local practices, enforcement, and consensus; garbage in, garbage out.",
      "May misjudge local nuance: 'Reasonable local' is an idealisation; subcultures or rapid changes can make norms less clear-cut.",
      "Blind to visitor's specific identity: A norm might impact visitors differently based on gender, race, religion etc., which the procedure doesn't inherently factor beyond flagged objections.",
      "Cannot predict rare sanctions: Focuses on typical responses; an unusually strict local might enforce a custom harshly.",
      "May struggle with hybrid cases: Some practices blend categories (e.g., a queueing norm with strong moralistic enforcement).",
      "Doesn't handle corporate policy overrides: The procedure assesses the local norm, not whether the firm wishes to impose/adjust it internally."
    ]
  }
  ```

  ### What the Procedure Cannot Do (198 words)

  This procedure cannot resolve fundamental value conflicts inherent in cross-cultural encounters. It identifies practices and typical local expectations but cannot definitively settle whether a visitor *should* override their own principles (e.g., gender equality) to comply with a local social norm, even one equally applied. That requires ethical judgement beyond an algorithm. It relies entirely on accurate information about local practices and consensus, which may be elusive or contested, especially regarding enforcement intensity or minority viewpoints. The "reasonable local" is a construct; real reactions vary, and visitor characteristics (race, gender) might trigger unforeseen responses the procedure cannot anticipate. It assesses norms as found, not whether the firm should internally challenge or modify them to align with its values. It cannot predict the actions of exceptionally strict individuals enforcing mere customs. Judgements about "excessive" cost or dignity loss remain subjective. Finally, it provides guidance, not legal advice; determining precise legal status and risk requires separate expertise. Its strength is structuring complexity, not eliminating the need for human judgement on contested values and ambiguous cases.
