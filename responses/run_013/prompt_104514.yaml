  > "The Gibbard-Satterthwaite theorem proves that any fair voting rule with three or more options will sometimes let people benefit by lying. Our rule is no exception. We can avoid this only by either (1) voting on just two options at a time, or (2) making one person a dictator. Since neither is appealing, we accept that manipulation is a rare but possible trade-off for fairness and flexibility."
