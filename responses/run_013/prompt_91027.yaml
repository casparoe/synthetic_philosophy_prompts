prompt: |-
  You're a philosopher who works on population ethics, and I want you to actually think this through instead of giving me the standard survey — start with a short brainstorm of what each camp is really committed to, then give me the diagnosis.

  My reading group just spent a semester on the repugnant conclusion and we've stalled completely. Here's the shape of it. The totalist adds up welfare across lives and says a huge world of people whose lives are just barely worth living is better than a smaller world of people flourishing — we all hate that. But every escape hatch seems to cost as much as it saves: an average view says one ecstatic person beats a billion contented ones; views on which creating a happy person is never itself a benefit, only making an already-existing person happy counts, can't explain why it's bad to create a miserable person either; and critical-level views have to say where the line sits and then defend the line. And the very repugnant thing keeps popping back up, where you're allowed to make some people miserable as long as you create enough new happy people to outweigh them. Nobody in the group is ignorant of anyone else's arguments — weve read the same papers and we each have our favourite counterexample — and yet not one person has moved an inch.

  My suspicion is that we aren't really disagreeing about which axiology is correct. I think we're disagreeing about what kind of claim 'world A is better than world B' is when A and B contain different people — whether it's a value fact that holds independent of any chooser, or a claim about what a certain kind of chooser would prefer — and that the intuition pumps on both sides quietly slide between the two readings. Am I right? If not, what is the disagreement really: about whether existence itself is a good to be brought about or just a bad to be avoided, about whether 'better than' is even well-defined across worlds with different populations, or about which intuitions get to count as data in the first place? Give me the diagnosis with reasons, and then be honest about what would count as progress here — a distinction, a proof that the conditions can't all be satisfied at once, an argument that one side's intuitions are debunkable — or say why no progress should be expected.
