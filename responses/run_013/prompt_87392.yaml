prompt: |-
  I'm a philosophy professor who has somehow ended up as the academic member of our hospital trust's new-interventions panel (dont ask). Twice a term a proposal lands — fund a nurse-led clinic, roll out some remote-monitoring kit — and the meeting always stalls on the same question: decide now, or spend six months running a local pilot and collect more data first? Everyone nods along to 'more evidence can only help' and I mutter that it can't, but I've never once managed to say anything they could actualy use in the ten minutes we've got.

  So write me a procedure the panel can run on a proposal, grounded in what decision theory genuinely says about the value of information — Good's result about free information being worth having, and the places where it quietly stops applying. I want it in order: what to ask, what counts as a sufficient answer, where it says 'decide now, more data changes nothing', where it says 'don't look', and which steps are value judgements I shouldn't dress up as arithmetic. Keep the machinery to what four people can do on a whiteboard in ten minutes — nothing beyond 'rough chance of each outcome' and 'rough cost of being wrong'.

  Things it has to handle, because these are the ones that bite us: information that costs money or delay; the gap between what a pilot would actually tell us and what we'd like it to tell us; the case where running the pilot changes the thing being measured, because everyone behaves differently once they know they're being watched; the case where we've publicly promised to act on the result — I have a suspicion that this quietly destroys the very thing that makes free information free; cases where finding out is bad for the patients whatever we then do about it; and, if it can be done without a blackboard, the case where the fact that we chose to look is itself a signal about what's there to be found.

  Then run it on two proposals: a pilot of a new triage protocol in A&E, and a survey of staff before we decide whether to change the rotas. One of them should come out 'don't bother gathering more', and I'd rather it wasn't the one I already like.

  Finish by telling me what the procedure can't do — where it gives up and the panel has to argue it out like grown-ups. British English throughout, please.
reasoning: |-
  Hmm, the user is a philosophy professor serving on a hospital trust's new-interventions panel. They're frustrated because every meeting stalls on whether to implement a proposal immediately or run a six-month pilot for more data. They want a decision-theory grounded procedure to resolve this in 10 minutes using only rough estimates.

  The key insight is Good's theorem - free information is always valuable - but with caveats: information isn't free if it costs resources or causes delays, pilots might measure the wrong thing (Hawthorne effect), precommitment to act introduces bias, and sometimes knowing is harmful. The procedure must handle these while being whiteboard-friendly.

  I need to build a step-by-step flow: first establish if the decision is reversible (if yes, piloting loses urgency), then calculate the Expected Value of Perfect Information (EVPI) as an upper bound. If EVPI is low relative to pilot costs, reject piloting immediately. Then evaluate the actual pilot's information value by considering reliability and alignment with decision needs. Finally, account for hidden costs like moral harms or signaling effects.

  For the examples: The A&E triage protocol pilot should likely be approved - high stakes, reversible, and Hawthorne effect manageable. The staff rota survey should be rejected - low EVPI, high bias risk, and potential for creating discontent. 

  Crucial limitations to acknowledge: when values conflict irreconcilably, when uncertainty can't be quantified, or when political constraints override rationality. The professor needs to know where the model stops and philosophical debate must take over.

  British English throughout: "trust" not "hospital", "A&E" not "ER", "rotas" not "schedules". Maintain academic rigor but avoid jargon - this is for clinicians who need practical tools, not decision theory seminars.
answer: |-
  Right then, Professor. Let's get you out of muttering obscurities and into chairing decisively. This procedure leverages Good's insight ("free information is always worth having") but explicitly flags when information **isn't** free or when Good's assumptions break. It's designed for speed: whiteboard, rough estimates, 10 minutes.

  **The "Should We Pilot?" Decision Procedure**

  **(British English, Whiteboard-Friendly, 10-Minute Max)**

  1.  **Clarify the Core Decision:**
      *   *Ask:* "What are the **two (or few) key actions** we're ultimately choosing between *now*? (e.g., 'Adopt Protocol X permanently' vs. 'Stick with Current Protocol')?"
      *   *Sufficient Answer:* Clear, mutually exclusive options. If complex, force a binary simplification for *this* decision step. *(Value Judgement: Defining the scope of the immediate decision.)*
      *   *Decide Now If:* The decision is easily **reversible** later without significant cost/harm (e.g., switching software back). Piloting usually wastes time here. Flag reversibility.

  2.  **Sketch Uncertainties & Stakes:**
      *   *Ask:* "What's the **main thing we're uncertain about** that affects this decision? (e.g., 'Will Protocol X reduce waiting times by >15%?' or 'Will new rotas increase staff burnout?') What are the **rough chances** of the key outcomes (Good / Bad / Neutral)? What's the **rough cost of being wrong** (e.g., patient harm, wasted money, staff turnover cost, reputational damage) if we choose the *worst* option for the actual outcome?"
      *   *Sufficient Answer:* 1-3 key uncertainties, likelihoods (e.g., High/Med/Low, or 20%/50%/30%), ballpark cost ranges (e.g., "Major harm & £100k+", "Minor grumble", "£50k saving"). *Focus on the difference the intervention makes.*
      *   *Decide Now If:* The potential **upside is tiny** *or* the potential **downside is trivial** *or* the **cost of being wrong is symmetrical and low**. (Low Stakes = Low EVPI). More data changes little. *Flag if costs are asymmetric.*

  3.  **Estimate EVPI (Expected Value of Perfect Information - The Ideal Case):**
      *   *Explain:* "Imagine a magic oracle tells us *exactly* the truth about our key uncertainty, for free, instantly. How much would knowing that *perfectly* save us (on average) by avoiding the wrong choice?"
      *   *Calculate (Roughly):* `EVPI ≈ [Chance of Bad Outcome if we choose Blindly] * [Cost of that Bad Choice]`. (Simplified, assumes only one 'bad' state).
      *   *Whiteboard:* `EVPI = P(Bad) * £Cost(Bad)`
      *   *Sufficient Answer:* A rough figure (e.g., "Tens of thousands", "Negligible", "Major harm risk equivalent to £X"). This is the **absolute maximum** the pilot info could be worth.
      *   *Don't Look (Pilot) If:* `EVPI << Cost of Pilot (Money + Delay + Opportunity Cost)`. If perfect info isn't worth the pilot cost, imperfect info certainly isn't. **Stop here if EVPI is clearly too low.** *(Arithmetic, but inputs are judgements).*

  4.  **Assess the Actual Pilot (The Reality Check):**
      *   *Ask:* "**What exactly would the pilot/survey measure?** How reliably does that **predict** the real-world outcome we care about? (e.g., Does a 6-month pilot *actual waiting time* reliably predict long-term *sustained reduction*? Does a *survey* reliably predict actual *future burnout*?) How big is the **gap**?"
      *   *Sufficient Answer:* Acknowledge measurement limitations, Hawthorne effect ('being watched changes behaviour'), short-term vs. long-term differences. Rate reliability (High/Med/Low).
      *   *Ask:* "**Would running the pilot change the future?** (e.g., Hawthorne effect permanently alters practice? Survey primes staff negatively?)"
      *   *Sufficient Answer:* Yes/No/Maybe. Describe the risk.
      *   *Ask:* "**Are we pre-committed to acting on the pilot result, regardless?** Does this create perverse incentives?"
      *   *Sufficient Answer:* Yes/No. Acknowledge if 'Yes' undermines objectivity – the info isn't "free" to use optimally.
      *   *Ask:* "**Is there any potential harm *just from finding out* during the pilot?** (e.g., Survey reveals widespread distress we can't immediately address, lowering morale; pilot exposes vulnerable patients to a potentially harmful process even in 'test' phase)"
      *   *Sufficient Answer:* Yes/No. Describe the harm.
      *   *Decide Now / Don't Look If:*
          *   The pilot measures the **wrong thing** so badly its info is near-useless (Low Reliability).
          *   The pilot **distorts the future** it's meant to predict (Strong Hawthorne/Priming).
          *   **Precommitment** means we can't use the info optimally (e.g., must adopt even if result is ambiguous).
          *   **Finding out itself causes harm** that outweighs EVPI. *(Value Judgements: Assessing reliability, Hawthorne risk, moral harm. Pragmatic call on precommitment impact.)*

  5.  **The Signalling Question (Whiteboard Optional):**
      *   *Ask:* "**If we *choose* to run this pilot/survey, what does that signal?** Could it signal weakness, lack of confidence, or open a can of worms regardless of results? (e.g., Surveying staff about rotas signals we think there *might* be a big problem, potentially creating anxiety even if results are fine)."
      *   *Sufficient Answer:* Brief discussion of potential negative signalling. Often minor, but can tip the balance if other factors are marginal. *(Value Judgement: Assessing organisational perception risk.)*

  6.  **Make the Call:**
      *   *Weigh:* `Rough Value of Pilot Info (<< EVPI)` vs. `Cost of Pilot (Money + Delay + Opportunity Cost + Harm from Finding Out + Risk of Distortion + Signalling Risk)`
      *   *Decide:*
          *   **Pilot:** If Value >> Cost *and* info is likely useful/reliable *and* risks manageable.
          *   **Decide Now (Adopt):** If high confidence upside > downside, or reversibility is easy.
          *   **Decide Now (Reject):** If downside risk too high, or upside too low.
          *   **Don't Look (No Pilot, Defer Decision):** If Value < Cost (especially due to delay/harm/distortion), or info too unreliable, or precommitment trap too binding. *Sometimes waiting without a formal pilot is best.*

  **Applied to Your Proposals:**

  1.  **Proposal 1: Pilot New Triage Protocol in A&E**
      *   **1. Core Decision:** Adopt New Protocol vs. Keep Current Protocol. **Not easily reversible** (training, process change).
      *   **2. Uncertainties & Stakes:** Uncertainty: Will it reduce avg. wait time by >15% without increasing clinical errors? Chances: Maybe 60% Success (Good), 30% No Change, 10% Worse (Errors ↑). Cost of Being Wrong (Adopt if Worse): Major patient harm risk + reputational damage (£££ + ethical cost). Cost of Being Wrong (Reject if Good): Continued long waits (patient harm, financial penalty risk - ££).
      *   **3. EVPI:** High stakes, asymmetric cost (harm worse than missed gain). `EVPI = P(Worse) * Cost(Worse)` is substantial (likely >> pilot cost). **EVPI High - Pilot potentially worthwhile.**
      *   **4. Assess Actual Pilot:**
          *   *Measures:* Actual wait times, error flags during pilot period. Gap: Good predictor of *initial* effect, less so long-term sustainability. Reliability: Med-High for initial impact.
          *   *Changes Future?:* Moderate Hawthorne likely (staff extra careful). *Might* establish good habits.
          *   *Precommit?:* Probably not *formally*, but politically hard to ignore a 'success'.
          *   *Harm from Finding Out?:* Minimal during pilot (patients get current or new protocol, both standard care). Finding errors *good* (stops rollout).
      *   **5. Signalling:** Signals proactive improvement. Generally positive.
      *   **6. Call:** **RUN THE PILOT.** High EVPI, pilot measures core outcomes reasonably well, Hawthorne manageable, harm risk low, signalling positive. Value >> Cost (Pilot cost: time, analysis).

  2.  **Proposal 2: Survey Staff Before Changing Rotas**
      *   **1. Core Decision:** Implement New Rotas vs. Keep Current Rotas. **Reversible?** Moderately (disruptive, but possible).
      *   **2. Uncertainties & Stakes:** Uncertainty: Will new rotas significantly increase staff burnout? Chances: Maybe 40% Big Burnout ↑, 40% Small ↑/No Change, 20% Improvement? Cost of Being Wrong (Adopt if Big Burnout ↑): High staff turnover (£££ recruitment), low morale, worse care, potential strikes. Cost of Being Wrong (Reject if Improvement): Missed efficiency gains/some staff preferences (Moderate £ cost/morale opportunity cost).
      *   **3. EVPI:** Asymmetric (Burnout ↑ cost >> Missed gain cost). `EVPI = P(Big Burnout ↑) * Cost(Big Burnout ↑)` is significant, but depends on P(Big Burnout ↑) estimate. **EVPI Potentially Medium - Worth checking.**
      *   **4. Assess Actual Survey:**
          *   *Measures:* Stated *anticipated* burnout/preference under hypothetical new rota. Gap: **Huge gap.** Surveys predict *stated intent/feeling* poorly, especially for future states. Reliability: **Low** for predicting actual *future* burnout after implementation. People are bad at predicting their own reactions, surveys susceptible to framing/mood.
          *   *Changes Future?:* **High Risk.** Survey primes staff to focus negatively on rotas ("Why are they asking? It must be bad!"). Can *create* discontent before anything changes. Strong Hawthorne/Priming effect.
          *   *Precommit?:* If promised, yes. Creates pressure to "listen" even if survey flawed.
          *   *Harm from Finding Out?:* **High Risk.** Revealing widespread anxiety/fear about a *potential* change causes immediate morale drop, distrust ("Management don't know what they're doing"), regardless of final decision. Finding out anticipated distress without being able to fix it *immediately* is harmful.
      *   **5. Signalling:** Signals uncertainty and potential problems, likely **creating anxiety.**
      *   **6. Call:** **DON'T LOOK (Do NOT run the survey).** Why?
          *   Information Quality: Survey is a **poor predictor** (Low Reliability) of the real outcome (actual burnout).
          *   Harm Risk: **High risk of causing harm** (morale drop, anxiety) just by running it.
          *   Distortion: **High risk of changing the outcome** (priming negativity).
          *   Value vs. Cost: The likely value of the flawed info is **Low**, while the cost (delay, analysis cost, harm, distortion risk) is **High**. EVPI is eaten up by these costs and the info's poor quality.
          *   *Alternatives:* Decide based on manager/staff rep consultation + evidence from similar trusts. Or implement *reversibly* in one area without a formal survey. **Gathering this 'evidence' actively makes things worse.**

  **What the Procedure Can't Do (Where Grown-Ups Must Argue):**

  1.  **Resolve Fundamental Value Conflicts:** If clinicians prioritise slightly faster throughput above all else, but nurses prioritise slightly lower workload, and the intervention affects both... the procedure needs the *cost of being wrong* inputs. It won't resolve the underlying value difference. You need ethics/philosophy here.
  2.  **Handle Extreme Uncertainty or Novelty:** When "rough chances" are pure guesswork (e.g., first-in-world tech), the EVPI calculation is flimsy. The procedure flags this but can't magically create knowledge. Precautionary principle arguments enter here.
  3.  **Quantify Intangibles Perfectly:** Assigning a "cost" to reputational damage or staff morale is inherently judgemental. The procedure forces acknowledgement but relies on panel judgement for the number.
  4.  **Override Political Reality:** If the Chief Exec has already promised a pilot to the board, or the system regulator demands one, the "Don't Look" output might be ignored. The procedure informs but doesn't dictate.
  5.  **Deal with Complex Interdependencies:** If the pilot decision affects five other service changes, the simplified model struggles. It assumes the decision is relatively contained.
  6.  **Define "Reversibility":** How easy is "easy"? How costly is "costly"? This is a key judgement call at Step 1.

  **In summary:** This procedure forces the panel to explicitly consider *why* they want more data, *what* that data will actually tell them, *what it costs* (in all dimensions), and *whether it's likely to help*. It uses Good's theorem as a starting point but builds in the crucial caveats where information isn't free or perfect. It shines a light on the often-overlooked costs of delay, distortion, and simply *asking the question*. Now go forth and chair with decisiveness, Professor. And maybe bring biscuits next time – it helps with the grown-up arguments.
