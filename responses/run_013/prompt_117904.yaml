prompt: |-
  I'm putting together a handout for a small reading group that meets in a pub and keeps having the exact same fight. One guy says we should celebrate people who do well; another says the whole celebration industry is a con that turns everyone else's ordinary life into evidence of failure; a third says "that's just Jantelagen" as if that settles it, and someone else brings up the tall poppy thing and the American Dream and then we're all just naming countries at each other. It never gets anywhere, I think because everyone is actually talking about four or five different things — envy of what someone has, resentment of how they got it, the feeling that their success is being narrated as a story about *you*, and the suspicion that admiring anyone is a status game you can't opt out of. So what I want is a decision tree that takes a reader from their gut reaction to a named position, built from the logical space first rather than from a list of labels. Each branch node should be a question the reader can actually answer without already knowing which position it leads to, and I'd rather the questions be about concrete cases than about what people call themselves.

  The cases I want threaded through it: a hometown friend who got rich and stopped coming back for Christmas; a colleague promoted over you for reasons you think were 60% luck; a scientist who's genuinely brilliant in their field and confidently wrong outside it; a cousin who wins something and then refuses to take any credit for it; a school that posts its top students' names on a board in the lobby; an influencer whose success is literally the product they sell; and someone who wins a pile of money and gives most of it away. Branch questions I want somewhere on the tree, though you should add your own: is the winner's advantage zero-sum or just additive (did they take something, or only get something?); is the reaction aimed at the person, at the audience watching, or at the system that produced them; is your complaint about desert (they didn't earn it), about effects (celebrating them makes the rest of us worse off), or about the admirer's own character (admiring this is corrosive to me); are you a peer in the race, a spectator with no chance, or a beneficiary of their win; and does it matter whether the community they left was actually diminished by their leaving, or whether the Jante norms are protecting the weak or just enforcing mediocrity. Also: does the winner's own stance change the verdict? A person who deflects all praise, or redistributes it, or turns it into an obligation on everyone else — does that land them on a different leaf than the same person who basks?

  Then give me the leaves. Aim for 8 to 11 of them and don't let the tree get wider than 9 branch questions. Where a position has a recognizable name, use it; where the combination of answers corresponds to something nobody actually defends, put it on the tree anyway and label it unnamed, with a sentence diagnosing *why* it's empty — incoherent, merely unattractive, or just unexplored. I care most about the pairs the tree can't separate, so flag those explicitly instead of quietly collapsing them (I suspect the person who says the Dream is a lie and the person who says the Dream is true but we've stopped running it will end up on the same leaf, and I want to know if that's really so). One line per leaf on its most awkward commitment. No reading list and no citations — I just need the instrument, and the whole thing should fit on one side of A4 when it's drawn out. Also please don't just hand me the three familiar positions (admire / envy / systemic critique); if the tree doesn't produce at least two views that sound identical in ordinary conversation but come apart on one of the questions, it's not doing its job.
reasoning: |-
  Hmm, the user is creating a handout for a pub reading group that keeps having circular arguments about success, envy, and social norms. They want a decision tree that maps gut reactions to specific philosophical positions without relying on labels. The tree needs concrete cases and branch questions that lead to 8-11 distinct positions.

  First, I need to identify the core tensions: envy vs admiration, systemic critique vs personal responsibility, and the social impact of celebrating success. The user mentioned specific scenarios like a rich friend who stops visiting, a colleague promoted by luck, and an influencer selling their success. These should anchor the tree's branches.

  Key branch questions must be answerable without prior knowledge. The user provided some: zero-sum vs additive advantage, target of reaction (person, audience, system), complaint type (desert, effects, character corrosion), observer's position (peer, spectator, beneficiary), and community impact. I'll add questions about the winner's stance (deflects, basks, redistributes) and whether norms protect or suppress.

  I should avoid collapsing distinct positions. For example, the American Dream critique might split between "it's a lie" and "we've stopped pursuing it." The tree must separate views that sound similar but differ on one question. Also, include unnamed positions if they're incoherent or unexplored.

  Designing the tree structure: Start with the most fundamental question. "Is the winner's advantage zero-sum?" splits the tree early. Then, for each case, ask who the reaction targets. Sub-branches address the complaint type and the observer's relation. Finally, the winner's stance and community impact refine the leaves.

  The leaves need clear labels: Jantelagen, Tall Poppy Syndrome, American Dream, etc. For unnamed positions, explain why they're untenable. Ensure each leaf has a distinct commitment, like "Celebration is theft" for zero-sum desert-based views.

  Check for overlapping positions. For instance, resentment of luck-based promotion vs envy of additive success. The colleague scenario can test this. Also, the influencer case challenges whether success is deserved or performative.

  Finally, verify the tree fits on one A4 page. Limit to 9 questions max. Use concise phrasing. Test logical consistency: each path should lead to a unique leaf, and conflicting answers diverge appropriately.
answer: |-
  Here's a decision tree designed to map gut reactions to distinct positions, using your cases and branching questions. It starts concrete and builds logically towards named (or unnamed) philosophical stances.

  **Success & Spectacle: Decision Tree**

  **Start:** Think of a specific instance of someone being celebrated for success (use the cases provided as prompts).

  1.  **Did their gain primarily *take* something finite others could have had (opportunity, resource, status), or did it *add* something new (wealth, knowledge, attention) without directly reducing others' share?** (Zero-Sum vs. Additive)
      *   **Took Something (Zero-Sum):** Go to Q2.
      *   **Added Something (Additive):** Go to Q3.
      *   *(e.g., Colleague promoted? Feels like took *your* spot = Zero-Sum. Scientist discovers cure? Likely Additive. Influencer gains followers? Can feel either way - pick your reaction).*

  2.  **Was their gain deserved (earned fairly based on merit/effort), or undeserved (luck, unfair advantage, cheating)?** (Desert)
      *   **Undeserved:** Go to Q4.
      *   **Deserved:** Go to Q5.
      *   *(e.g., Colleague promoted via luck? Undeserved. Hometown friend built legit business? Deserved).*

  3.  **Is your primary reaction directed at: a) The successful person themselves, b) The people admiring/celebrating them, or c) The system/rules that enabled their success?** (Target)
      *   **The Person (a):** Go to Q6.
      *   **The Audience (b):** Go to Q7.
      *   **The System (c):** Go to Q8.
      *   *(e.g., Annoyed at *friend* for not coming home? Target Person. Annoyed people *admire* the influencer? Target Audience. Angry the *system* rewards luck? Target System).*

  4.  **Does celebrating them actively harm the community (e.g., breed resentment, discourage others, enable exploitation), or is the harm more abstract/individual (just *your* feeling of being slighted)?** (Harm)
      *   **Harms Community:** **Leaf 1: Tall Poppy Syndrome (Enforcement)**. *Commitment:* Cutting down the tall poppy is necessary to protect group cohesion and prevent corrosive envy/competition. (Sees Jante as protection).
      *   **Abstract/Individual Harm:** **Leaf 2: Resentment of Undeserved Gain**. *Commitment:* The core offense is the *injustice* of unearned reward, making celebration feel like endorsing theft. (Focuses on desert within zero-sum).
      *   *(e.g., School board breeds unhealthy competition? Harms Community. Just *you* feel slighted by colleague's luck? Abstract Harm).*

  5.  **Does celebrating them actively harm the community (e.g., breed resentment, discourage effort) or is the harm minimal/outweighed by inspiration?** (Harm)
      *   **Harms Community:** **Leaf 3: Tall Poppy Syndrome (Resentment)**. *Commitment:* Even deserved success should be downplayed to avoid making others feel inadequate or disrupting social harmony. (Sees Jante as suppressing individual distinction).
      *   **Minimal/Outweighed Harm:** **Leaf 4: Unnamed Position (Zero-Sum Meritocracy)**. *Commitment:* *Why Unnamed?* Logically incoherent long-term. If gains are zero-sum *and* deserved, celebrating winners inherently means celebrating losers' deserved failure – unsustainable for community morale. Diagnose: Celebration feels *just* but creates unavoidable tension.
      *   *(e.g., Rich friend's deserved success makes hometown feel poor? Harms Community).*

  6.  **Is your complaint about the winner's *character* (arrogance, inauthenticity) or about the *effects* of admiration itself (e.g., makes you feel lesser, pressures you)?** (Complaint Focus)
      *   **Winner's Character:** **Leaf 5: Critique of Hubris**. *Commitment:* The problem is the winner's failure to acknowledge luck/context or their inflated ego when stepping outside their domain (e.g., brilliant scientist opining wrongly). Celebration *enables* this.
      *   **Effects of Admiration:** Go to Q9.
      *   *(e.g., Mad at scientist's *arrogance* outside field? Character. Mad that admiring them makes *you* feel dumb? Effects).*

  7.  **Is celebrating them primarily a *status game* the admirers are playing (signaling values, belonging), or is it creating harmful *false narratives* (e.g., "anyone can do it," ignoring privilege)?** (Admiration Motive)
      *   **Status Game:** **Leaf 6: Critique of Performative Admiration**. *Commitment:* Public celebration is often less about the winner and more about the admirers signaling virtue or group membership. Opting out feels socially costly.
      *   **False Narratives:** **Leaf 7: Critique of the "Myth of Meritocracy"**. *Commitment:* Celebrating individual success obscures systemic luck/privilege, perpetuating the harmful myth that success is purely earned and failure is deserved. (Systemic critique via audience focus).
      *   *(e.g., People admire influencer to seem 'in the know'? Status Game. Celebrating self-made colleague ignores luck? False Narrative).*

  8.  **Is the system fundamentally fair but currently malfunctioning, or is the concept of rewarding this *type* of success itself flawed?** (System Flaw)
      *   **Malfunctioning:** **Leaf 8: American Dream (Eroded)**. *Commitment:* The system *could* reward hard work fairly, but current corruption/inequality means it often doesn't. Celebration feels hollow or unjust. (Belief in redeemable system).
      *   **Fundamentally Flawed:** **Leaf 9: Radical Systemic Critique**. *Commitment:* The very mechanisms producing "success" (e.g., capitalism, influencer culture) are exploitative or alienating. Celebrating winners legitimizes a harmful system.
      *   *(e.g., Promotion system is good but rigged *this time*? Malfunctioning. Influencer success model is inherently vapid/exploitative? Fundamentally Flawed).*

  9.  **Does the winner's own stance (basking, deflecting, redistributing) significantly change the *offense* of celebrating them?** (Winner's Stance Matters?)
      *   **Yes:** **Leaf 10: Contextual Admiration/Resentment**. *Commitment:* The *way* success is held (modesty, redistribution) is crucial. Admiration is earned not just by the win, but by conduct (e.g., cousin refusing credit, winner giving money away). Resentment focuses on baskers.
      *   **No:** **Leaf 11: Jantelagen (Core Principle)**. *Commitment:* No individual, regardless of merit or humility, should believe they *are* better than the group. Any distinction, even handled well, threatens the collective norm. Celebration inherently breaks this law.
      *   *(e.g., Cousin refusing credit makes them *more* admirable? Yes, stance matters. Still feel they shouldn't be singled out *at all*? No, stance irrelevant - Jantelagen).*

  **Key Observations & Pairs:**
  *   **Tall Poppy (1 & 3):** Splits based on *desert* (1: Undeserved harm, 3: Deserved harm) and *perceived purpose* of norms (protection vs. suppression).
  *   **American Dream Eroded (8) vs. Radical Critique (9):** Separated by belief in the redeemability of the *system* itself. Both critique current celebration, but one sees a fixable flaw, the other a foundational rot.
  *   **Jantelagen (11) is Distinct:** It uniquely rejects *any* individual distinction as inherently problematic, regardless of desert, harm, or winner's stance. It's about the *assertion* of difference, not its effects.
  *   **Unnamed Position (4):** Highlights the inherent tension in celebrating deserved winners in a perceived zero-sum game – it logically demands celebrating losers' "deserved" loss.
  *   **Context Matters (10):** This position sounds like simple admiration/resentment in conversation but crucially *separates* based on the winner's *post-success conduct*, unlike positions focused purely on the win or system (e.g., 5, 7, 9).
  *   **Critique of Performative Admiration (6) vs. Critique of Myth (7):** Both target the audience, but one sees status games, the other sees harmful ideological reinforcement.

  This tree forces distinctions based on concrete answers about the nature of the gain, the target of discomfort, the type of harm, and the role of conduct, moving beyond simple "admire/envy/system" labels.
