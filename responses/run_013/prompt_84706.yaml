  The AI question is particularly thorny. Could an algorithm possess "weight" in Keynes's sense? His definition ties weight to the human capacity for synthesising heterogeneous evidence - something beyond current AI's pattern-matching. Though one might speculate about future AGI, Keynes would probably insist that weight requires conscious understanding of evidence relevance - not just data volume.

