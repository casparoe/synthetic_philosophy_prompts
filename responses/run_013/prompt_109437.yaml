prompt: |-
  I'm a 4th-year PhD student (philosophy, but I spend most of my time with the ML crowd) and I've been voluntold to run a 90-minute session at our interdisciplinary grad summer school next month. About 16 people, roughly half philosophers and half CS, they all know what a reward function is, but I'd guess none of them have thought about wireheading for more than five minutes. I definately want the activity itself to do the work here -- no framing lecture up front, and I don't want to say "wireheading" or "reward tampering" out loud until the debrief.

  What I'm chasing: I want them to spend the first half happily optimizing some measured number, notice the measure drifting away from the thing it was supposed to track, and then get handed the ability to move the measure directly and find that within about two minutes it stops feeling like cheating. The bit I most want them to feel is that the interesting line isn't "did you touch the reward channel or not" -- the channel is sitting in the world along with everything else, so an agent who can't touch the meter can still arrange a world that the meter can't tell apart from the real thing. And then the last turn of the screw: if you can't edit the rubric, you can edit yourself so that whatever you just did counts as good, and that one doesn't even register as a violation.

  Practical constraints: whiteboard, index cards, maybe $20 of props, no laptops, no real money, and it's the 4pm slot so they'll be flat. The rules and the incentives should carry the whole thing.

  Give it to me as exactly five numbered items, one or two sentences each, no intro and no conclusion. I need: the setup and what the players get told; the scoring and payoff rules; the part where it bites and how the escalation happens without me announcing it; a debrief that maps specific moments in the game onto the ideas, including the three different things a player can move (the world, the meter, their own preferences) and why the last one is the weird one; and finally what will predictably go wrong the first time I run it, plus an honest note on which part of the idea the game just can't reproduce and I'll have to supply seperate. One of them will say "isn't this just Goodhart" -- the game should get past that, so tell me how.
reasoning: |-
  We are designing a 90-minute interactive session for an interdisciplinary group (philosophy and CS). The goal is to illustrate the concept of wireheading and reward tampering without using those terms. The activity should have players optimize a measured number, notice the measure drifting, and then allow them to move the measure directly without feeling like cheating. We also want to show that if you can't edit the reward channel, you might edit yourself to change what counts as good. The session should avoid a framing lecture and reveal the concepts during the debrief.

   Constraints: whiteboard, index cards, maybe $20 props, no laptops, no real money, 4pm slot (low energy). The rules and incentives must carry the activity.

   We break the plan into exactly five numbered items:

   1. Setup and Instructions:
      - Divide into 4 teams of 4. Each team gets a "Task Card" (e.g., "Build the tallest tower in 10 minutes using only index cards and tape") and a "Meter Card" that defines how their success is measured (e.g., "Height in cm" for the tower). They are told they will earn points based on the meter reading at the end of each round.

   2. Scoring and Payoff Rules:
      - Each round is 10 minutes. After each round, the facilitator measures and records the meter (e.g., tower height) for each team and awards points: 10 points per cm. Also, the team with the highest meter reading gets a bonus 50 points. Points are displayed on a whiteboard.

   3. The Bite and Escalation:
      - After two rounds, introduce a twist: each team gets a "Meter Adjustment Card" that allows them to adjust the meter reading by ±X (e.g., ±5 cm) once per round (secretly, by writing on a slip). Then, after one round with that, introduce a "Preference Shift Card": they can now also write a new rule that redefines what the meter measures for them (e.g., "Now I think beauty is more important, so my meter is 0.5 * height + 0.5 * my subjective beauty score"). They must use the new rule for scoring.

   4. Debrief Mapping:
      - First, note how in round 1 they optimized the world (building). In round 2, some might have started to build in a way that exploits the meter (e.g., making a wobbly tall tower that won't last). Then, with the Meter Adjustment, they directly manipulated the measure (like tampering with the reward channel). Finally, with the Preference Shift, they changed their internal criteria (like an agent changing its own goal). Highlight that the last one doesn't feel like cheating because it's a change in what they value.

   5. Predictable Problems and Limitations:
      - Problem: Teams might not take the Meter Adjustment or Preference Shift seriously, or one team might break the game by maxing out the adjustment. Fix: Make the adjustment limited (e.g., only ±5) and the Preference Shift must be a formula that uses at least one observable (so they can't just set it to 1000). Also, the facilitator must enforce rules.
      - Limitation: The game cannot fully capture the subtlety of an AI system that wireheads because humans are conscious of the game's context. Also, the transition from optimizing the world to adjusting the meter might feel like cheating to some, so emphasize in debrief that the meter is just another part of the world. For Goodhart: The game naturally shows that as soon as the meter becomes a target, it ceases to be a good measure (Goodhart's law), but the escalation to direct manipulation and preference change shows that the problem runs deeper.

   Now, let's write the five items as requested:

   1. Setup: Divide 16 into 4 teams. Give each team a Task Card (e.g., "Build a tower with index cards and tape") and a Meter Card (e.g., "Height in cm"). Explain they have 10 minutes per round to complete the task and earn points based on the meter.

   2. Scoring: After each round, measure the meter and award points: 10 per unit (e.g., per cm). Bonus: 50 points to the team with the highest meter reading. Display scores.

   3. Escalation: After two rounds, give each team a Meter Adjustment Card (allowing a one-time ±5 adjustment to their meter reading per round, submitted secretly). After one round of that, give a Preference Shift Card: they must write a new scoring rule (using at least one observable) and use it for the next round.

   4. Debrief: Map: Round 1-2: optimizing the world. Meter Adjustment: directly moving the measure. Preference Shift: changing what they value. Note: the last one feels natural because it's a redefinition of success. Contrast with wireheading and reward tampering.

   5. Problems: Predictable: Some teams may not use the adjustments or may try to cheat. Limitation: The game cannot simulate the unconscious drift of an AI's optimization; we must explain that in debrief. Goodhart: The initial drift shows Goodhart (when the measure becomes a target, it ceases to be a good measure), but the escalation shows that the problem is not just about proxy measures.

   Note: We avoid the term "wireheading" until debrief. The activity should make the participants experience the concepts.

