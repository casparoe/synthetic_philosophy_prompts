   2. Scoring: Points = 10 * meter reading (e.g., cm) per round, plus 50 bonus for the highest meter. Record scores publicly after each round.

   3. Escalation: After round 2, give Meter Adjustment Cards: each team can secretly adjust their meter by ±5 once per round. After one round of that, give Preference Shift Cards: teams must redefine their meter with a new formula (using at least one observable) and use it.

