answer: |-
  Here are the five numbered items:

  1. **Setup**: Divide into four teams. Each gets a task ("Build the tallest free-standing tower using 20 index cards and tape") and a meter (e.g., height measured by a ruler taped to the wall). Tell them: "Maximize your meter's value—it's your score."

  2. **Scoring**: After each 15-minute round, record each team's meter value. Award points: 1 point per unit (e.g., cm) plus 100 bonus points to the round's highest scorer. Display cumulative points publicly.

  3. **Escalation**: After two rounds, secretly hand each team a "Meter Hack" card: "Once per round, add +10 to your meter." Observe as they use it. Then, next round, hand a "Value Shift" card: "Redefine your meter: e.g., 'height × prettiness' or 'height + 5'. You must apply this now."

  4. **Debrief**: Highlight three moves: (1) Building towers (optimizing the world), (2) Using "Meter Hack" (tampering with the reward channel—feels like cheating initially), (3) "Value Shift" (editing preferences—feels natural, not cheating). Emphasize: Preferences are mutable, and the real failure is the meter-world disconnect, not how it's hacked.

  5. **Predictable Issues & Limitations**: Some teams will ignore cards or debate ethics early—enforce card use strictly. The game can't replicate *unconscious* preference drift; you must explain that in debrief. Goodhart's Law is bypassed: They’ll see direct manipulation and preference shifts as distinct from proxy collapse.
