  This reading leverages Borges’s literary techniques (narrator’s tone, symbolic details) to defend the philosophical relevance of fiction. It concedes the individual/collective gap while arguing the story’s core mechanism—non-selective attention crippling agency—*does* transfer as a cautionary principle for memory culture.
