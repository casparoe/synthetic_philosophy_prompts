  Based on the historian's past verdicts and statements, I infer the rule she consistently applies and predict her verdicts for the ongoing episode. I also address your queries about rule constraints, alternative rules, the impact of narrowing claims, betting preferences, and how to resolve rule ambiguities.

  ### Her Apparent Rule
  The historian's verdicts hinge on **whether a programme produces confirmed novel predictions (made before measurement) while retaining its central postulate (the "hard core")**. Key elements of her rule:
  - **Novel predictions are paramount**: A programme is progressive if it generates at least one confirmed novel prediction (published before data collection) without altering the hard core. This outweighs defensive motivations, practical success, or periods of perceived degeneration.
  - **Hard core integrity is non-negotiable**: If the hard core is revised or dropped—even to produce predictions—the programme is degenerating in that phase, and predictions are credited to a successor.
  - **Retrospective, phase-based appraisal**: Verdicts assess entire episodes or phases, not contemporaneous judgments. A programme can transition between progressive and degenerating phases (e.g., Episode 4), but ongoing programmes are not ranked (per her seminar statement).
  - **Irrelevance of auxiliary traits**: Anomaly absorption without predictions, practical utility, or narrowing/broadening of claims does not determine verdicts unless tied to novel predictions or hard-core changes.

  This rule explains all four verdicts:
  - **Episode 1**: Progressive because predictions emerged post-refutation while retaining the hard core.
