answer: |-
  Your frustration is warranted—you're spotting a deep philosophical crack in the foundations of standard social psych practice. Let me reconstruct the presuppositions, diagnose the tensions, and contrast this with a Bayesian alternative. **Verdict: Your field's workflow implicitly commits to a hybrid of Neyman-Pearson decision theory and Fisherian evidentialism, but functionally prioritizes the former while paying lip service to the latter. This creates an unstable foundation for interpreting replications.**

  ### Core Presuppositions of the Current Workflow
  1. **Decision-Theoretic Threshold Commitment**:  
     Preregistration + α = 0.05 cutoff presupposes a **Neyman-Pearson (NP) error-control framework**. Here, science is a long-run decision procedure: You choose actions ("reject H₀" or "fail to reject") to control false positives (α) at 5%. A "finding" (p < .05) is a *decision to act as if H₁ is true*, not a claim about evidence strength. The "file drawer" is a direct consequence—non-significant results aren't "errors" but *uninformative outcomes* for NP purposes.

  2. **Evidential Asymmetry**:  
     Logging p = .09 (right direction) as a "failed replication" while p = .04 is "confirmation" reveals a **binary view of evidence**. This only makes sense if:
     - The p-value is treated as a *sufficiency criterion* for evidence (Fisher's influence), where p > .05 is "inconclusive" (Fisher's "no evidence").
     - But crucially, **the NP framework overrides Fisher** by demanding that *only* outcomes crossing α warrant action (publication, citation). Thus, p = .09 isn't just "inconclusive"—it's *functionally equivalent to evidence for H₀* in replication tallies.

  3. **Meta-Analysis as a NP Extension**:  
     Tallying "successes" (p < .05) vs. "failures" (p ≥ .05) in replications assumes that **replication is itself a hypothesis test** with a bright-line threshold. This presupposes:
     - Each study is a Bernoulli trial with "success" probability = statistical power if H₁ is true.
     - The proportion of p < .05 results *is* the relevant statistic for assessing replicability (not pooled effect sizes or CI coverage).

  ### What the Practice Rules Out
  - **Graded Evidence Interpretation**: If p-values were truly treated as continuous evidence (per Fisher), p = .04 and p = .09 would be seen as *similar* (both modest evidence against H₀), not binary opposites.  
  - **Absence of Evidence ≠ Evidence of Absence**: The replication tally *contradicts* this mantra. By counting non-significant results as "failures," you commit to treating them as *positive evidence for H₀* (or against H₁).  
  - **Likelihoodism or Bayesianism**: These require comparing relative support for hypotheses across *all data*, not dichotomizing outcomes. A p = .09 with d = 0.48 and p = .04 with d = 0.49 provide nearly identical support for H₁ over H₀—but your workflow discards this information.

  ---

  ### The Bayesian Alternative: What Would Change
  **Not just "p-values but continuous," but a fundamental shift in ontology of evidence.** Here’s how a serious Bayesian workflow would differ:

  | **Current Practice** | **Serious Bayesian Alternative** |
  |----------------------|----------------------------------|
  | **Hypotheses** | Directional (H₁: μ > 0) | Quantified (e.g., H₁: δ ~ Normal(0.3, 0.1)) |
  | **Evidence** | Binary (p < 0.05 = "finding") | Continuous (BF₁₀ or posterior density) |
  | **Preregistration** | Analysis plan + α threshold | Prior justification + model specification |
  | **Non-Significant Results** | Filed away ("failed replication") | Directly update posteriors (reduce certainty) |
  | **Meta-Analysis** | Vote-counting p < 0.05 successes | Hierarchical modeling accumulating all data |
  | **Replication Logic** | "Same p < 0.05 result?" | "Does posterior tighten around true effect?" |

  **Key implications:**
  - **Priors Do Real Work**: A prior reflecting plausible effect sizes (e.g., δ ~ Normal(0.2, 0.15) for social priming) *scales the interpretation* of new data. A study with p = .09 and d = 0.48 might *strengthen* evidence for H₁ if the prior expects small effects.
  - **No File Drawer Problem**: All data update the posterior. A "non-significant" result with d = 0.3 and wide CI *lowers the probability* of large effects but *may not support H₀*.
  - **Replication Defined Differently**: A "successful replication" shows consistency with *prior evidence* (e.g., 95% CI of new study overlaps posterior mode from previous work), not p < .05.

  ---

  ### Where My Reconstruction Could Be Wrong (and What Would Flip It)
  1. **If "Failed Replication" Doesn't Mean Evidence for H₀**:  
     If your lab treats p = .09 as "inconclusive, not a failure" *in theoretical discussions* (despite logging it as "failed" in meta-analyses), my claim about presupposing evidence for H₀ weakens. **What would change my mind**: You show me meta-analyses where non-significant results are explicitly modeled as *uninformative* rather than counterevidence.

  2. **If Power Analysis is Decorative**:  
     If power calculations are ritualistic (e.g., always assuming 80% power for d = 0.5) rather than determining sample size for a *decision threshold*, the NP commitment is superficial. **Flip condition**: Your lab frequently runs underpowered studies knowing they'll interpret results continuously.

  3. **If Effect Sizes Trump p-Values in Practice**:  
     If studies with p = .06 but large d are published and cited equally, the binary threshold isn't operational. **Counterevidence**: Audit your lab's last 5 papers—do non-significant results with d > 0.3 appear in main tables, or are they supplemental?

  ---

  ### The Bottom Line
  **Your practice presupposes a decision-theoretic framework (NP) while borrowing Fisher's language to disavow its implications.** This creates cognitive dissonance: You *say* "p-values aren't probabilities" but *act* as if p < .05 licenses truth claims. The replication tally exposes this—by counting "successes," you reveal that p < .05 isn't just a pragmatic threshold but a *truth criterion* in your epistemology.

  **Switching to Bayesianism wouldn't just change math—it would demand a new ontology of evidence:**  
  - Claims become *graded beliefs* (posterior probabilities), not binary "findings."  
  - "Replication" means *consistency with cumulative knowledge*, not re-crossing α = .05.  
  - The file drawer dies because all data reduce uncertainty.  

  The barrier isn’t computation—it’s philosophical: accepting that evidence is inherently subjective (prior-dependent) and probabilistic. Until your field faces this, the replication crisis will persist because **you’re not controlling for Type I errors; you’re institutionalizing a distorted epistemology that conflates decision thresholds with evidence strength.**
