prompt: |-
  Someone in my reading group keeps leaning on the engineer analogy for natural selection: selection 'designs' a wing roughly the way an engineer designs a wing, traits are 'solutions' to environmental 'problems', and that's what licenses him to talk about the function of a trait and to run optimality models. Another person says it's just a designer smuggled back in, and that if you take the engineer out you also take out the right to say what a trait is *for*. I'd like an audit instead of a shouting match. Give me the correspondance table first — what plays the engineer, the blueprint, the materials, the spec, the workshop, the prototype testing — then where the mapping breaks, then say which of those breaks actually matter for which claim: does function-talk survive it, do optimality models survive it, does the broader line that competence comes first and comprehension is a late optional add-on survive it? And if there's a better analogy for the same job, tell me what it is. Table plus a short paragraph each, 700 words max.
