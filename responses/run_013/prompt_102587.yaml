     - Actually, there is a result: some agendas are "safe" and some are not. The agenda (P, Q, R) with the rule R<=>(P and not Q) is not safe for majority rule. But if we drop R and only vote on P and Q, then we don't have the problem? But then we don't have a verdict. We have to derive R.

     - Alternatively, we can have the group vote on R and then also on the premises? But that might lead to inconsistency again.

     - It's known that for some logical structures, there is no aggregation function that is consistent, respects majority, and satisfies some other desirable properties (like non-dictatorship).

     - We can run a quick second round: change the agenda to vote on R and one premise? But time might be short.

     - We can discuss: what if we vote on P, Q, and R, but allow people to change their votes to avoid inconsistency? But that would be deliberation, not just aggregation.

  7. (5 min) Wrap up: What does this teach us about social epistemology?
     - Groups might not be able to form consistent collective judgments even when individuals are consistent.
     - The design of the decision procedure (premise-based vs. conclusion-based) can determine the outcome.
     - Real-world implications: legal juries, expert panels, democratic decision-making.

     Controversies: 
     - There is no consensus on which procedure is better. 
     - Some argue premise-based is better because it focuses on reasons. Others argue conclusion-based respects the overall judgment.
     - The dilemma does not necessarily argue against majoritarian democracy; it may just require careful agenda setting.

  What might go wrong:

  1. Some students might not follow their role. Solution: Emphasize that they must stick to their role for the experiment.

  2. The case might be too clear for some? But we made it ambiguous and assigned roles.

  3. Students might say: "But in a real case, we would discuss and not just vote." That's true, but the point is to show the problem with aggregating without discussion. We can note that in the debrief.

  4. Students might question the rule: "Why is R defined as P and not Q? Maybe there are other factors." We can say: in this simplified case, we are using this rule.

  5. The split might not work if we don't have the right numbers? But we preassigned.

  6. Time: We must keep to the timeline.

  Real result the game can't reproduce: In real life, individuals might change their judgments in response to the group. But in this activity, they are fixed by the role.

  We have to say: in real groups, deliberation might help, but it also might not. The point is that even with fixed individual judgments, aggregation is tricky.

  Final note: We must make the case packet and role cards.

