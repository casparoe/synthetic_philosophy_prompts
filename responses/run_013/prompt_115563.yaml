prompt: |-
  A colleague of mine works on the ethics of intervening in nature, and I am trying to work out what rule she is actually running from her record of verdicts on particular cases. She supports disentangling a humpback whale from fishing gear and rehabilitating it, and supports a costly programme of feeding and veterinary care for a colony of bats whose roost was destroyed by a road. She opposes culling introduced foxes to protect a seabird colony, on the grounds that the ecological consequences are unpredictable and the cull would have to be repeated indefinitely. She opposes a vaccination programme against a naturally arising disease in a wild ungulate population, since no delivery mechanism could reach enough animals to matter. She also opposes releasing sterile males to suppress an abundant rodent species, for much the same reasons.

  The proposal before her next month is to release a self-spreading vaccine against a naturally arising parasite that causes prolonged and severe illness in a wild mammal species. The vaccine has been well tested in captivity, its ecological effects are expected to be contained and monitorable, and it would spare an enormous number of animals a great deal of suffering.

  Predict her verdict. More usefully, set out the candidate rules that fit her record equally well, say what each predicts about this proposal, give your best guess with your reasons for preferring it, and identify the case that would best separate whichever rules survive.

  Answer in British English.
reasoning: |-
  Okay, the user is asking me to predict a colleague's verdict on a wildlife intervention proposal based on her past decisions. Let me start by understanding her previous positions. 

  She supported disentangling a humpback whale and rehabilitating it. That's a direct, one-off intervention helping an individual animal. Then she backed feeding bats after their roost was destroyed by human activity (a road). Both cases involve mitigating human-caused harm with clear, contained actions.

  But she opposed several things: culling invasive foxes to protect seabirds (due to unpredictable ecology and perpetual need), vaccinating wild ungulates against natural disease (ineffective delivery), and sterile male release for rodents (same efficacy issues). The common thread seems to be rejecting interventions that are either ecologically risky, logistically unfeasible, or require endless repetition.

  Now the new proposal: a self-spreading vaccine against a natural parasite in wild mammals. It's well-tested, expected to have contained/monitorable effects, and would prevent widespread suffering. But "self-spreading" is key – it's designed to propagate through the population autonomously.

  Hmm. Her past approvals involved targeted, finite actions (rescues, short-term care). Her rejections targeted systemic/ongoing methods (culls, population-wide controls). This vaccine is systemic by design – once released, it spreads indefinitely. That might trigger her "indefinite repetition" objection like the fox cull. Even with monitoring, self-propagation introduces unpredictability she typically avoids.

  The user probably wants to understand her ethical framework beyond just a prediction. They mention "candidate rules" – so I should outline possible principles fitting her record. Rule 1: "Intervene only for human-caused harm with contained solutions." Rule 2: "Reject interventions with high uncertainty or indefinite commitment." Both fit her past calls but diverge here: Rule 1 rejects the vaccine (natural parasite), Rule 2 rejects it (self-spreading = indefinite). 

  My bet is Rule 2. She refused the fox cull for being perpetual despite predictable suffering; similarly, a self-sustaining vaccine might feel like an uncontrollable long-term alteration. The bat case shows she helps even with natural consequences if harm is human-triggered, but this parasite is natural. 

  Best test case? Propose vaccinating livestock against a human-introduced disease spilling into wildlife. Rule 1 approves (human cause + contained), Rule 2 might reject if delivery is inefficient. That would split them cleanly.
answer: |-
  Based on your colleague's record, here's a breakdown of candidate rules, predictions for the vaccine proposal, a reasoned verdict prediction, and a decisive test case:

  **Candidate Rules Fitting Her Record:**

  1.  **Rule 1: "Intervene only to directly mitigate significant harm *caused by humans*, using targeted, finite, and ecologically low-risk methods."**
      *   **Fits Verdicts:** Supports whale disentanglement (human-caused entanglement, targeted rescue). Supports bat colony aid (human destruction of roost, finite care/rehab). Opposes fox cull (introduced by humans *but* intervention is indefinite/high-risk). Opposes ungulate vaccine & sterile males (natural disease/abundance; intervention ineffective/indefinite).
      *   **Prediction for Self-Spreading Vaccine:** **Oppose.** The parasite is "naturally arising," not human-caused. The intervention (self-spreading) is inherently *not* finite or fully targeted, despite monitoring.

  2.  **Rule 2: "Reject interventions that are ecologically unpredictable, require indefinite repetition, or have low probability of significant population-level efficacy, regardless of cause."**
      *   **Fits Verdicts:** Opposes fox cull (unpredictable, indefinite). Opposes ungulate vaccine (low efficacy). Opposes sterile males (low efficacy/practicality, likely needs repetition). *Doesn't contradict* whale/bat support: disentanglement is finite/high-efficacy; bat care, while costly, is finite/rehab-focused with a clear endpoint (stabilisation or relocation).
      *   **Prediction for Self-Spreading Vaccine:** **Oppose.** Although effects are "expected to be contained and monitorable," the *self-spreading* nature introduces significant *inherent unpredictability* and potential for indefinite persistence in the environment/ecosystem, even if initial spread is contained. Low efficacy isn't argued here, but the mechanism creates novel risks.

  3.  **Rule 3: "Prioritise interventions that relieve severe individual suffering via direct, observable action, especially where human responsibility is clear, but reject population-level 'engineering' with systemic risks."**
      *   **Fits Verdicts:** Supports whale disentanglement (direct relief of individual suffering, clear human cause). Supports bat care (direct relief for identifiable individuals, human cause). Opposes fox cull, ungulate vaccine, sterile males (all are population-level management attempts with systemic risks or low individual impact certainty).
      *   **Prediction for Self-Spreading Vaccine:** **Oppose.** This is population-level "engineering" via a self-propagating medical intervention. While it aims to relieve suffering, the mechanism (indirect, systemic spread) is fundamentally different from the direct, hands-on care she supported.

  **Best Guess Prediction & Reasoning:**

  *   **Predicted Verdict: Oppose the self-spreading vaccine proposal.**
  *   **Reasoning:** Rule 2 ("Reject interventions that are ecologically unpredictable, require indefinite repetition, or have low probability of significant population-level efficacy") provides the most consistent and compelling explanation for her *pattern* of rejections, particularly her strong opposition to the fox cull based on unpredictability and indefinite commitment. While the self-spreading vaccine is claimed to be "contained and monitorable," its fundamental design – autonomous spread within a wild ecosystem – directly triggers the core concerns evident in her fox cull opposition: the potential for unforeseen ecological ripple effects and the inherent difficulty of truly recalling or fully controlling a self-replicating agent once released. This creates a level of unpredictability and potential long-term commitment (monitoring, managing unexpected consequences) that aligns with her rejection criteria. Rules 1 and 3 also predict opposition and are consistent, but Rule 2 best captures the *systemic risk and control* anxieties demonstrated by her previous rejections.

  **Best Test Case to Separate Surviving Rules:**

  *   **Scenario:** A proposal to vaccinate a wild deer population against Chronic Wasting Disease (CWD) *using individual darting*, where:
      1.  CWD was *introduced to the area via human movement of infected captive deer* decades ago.
      2.  The disease causes prolonged, horrific suffering and is 100% fatal.
      3.  A highly effective vaccine exists.
      4.  A feasible, well-funded plan exists to dart and vaccinate >70% of the population over 5 years within a defined, isolated habitat (e.g., an island or fenced reserve), after which the program would definitively end. Ecological risks of darting/vaccine are deemed very low and monitorable.
  *   **Why this Separates Rules 1 & 2:**
      *   **Rule 1 ("Only for human-caused harm, finite, targeted"):** Would **Support**. Harm (CWD intro) was human-caused. Intervention is targeted (darting individuals), finite (5-year plan with end date), and low-risk.
      *   **Rule 2 ("Reject unpredictable/indefinite/low-efficacy"):** Would likely **Oppose** (or be highly skeptical). While efficacy might be achievable (>70% target), delivering it reliably via darting across 70% of a wild population is inherently challenging and prone to efficacy concerns ("low probability of significant population-level efficacy" - similar to ungulate vaccine objection). There's also potential for unforeseen ecological impacts (e.g., behavioural changes due to darting, vaccine effects on non-targets). It's *less* indefinite than a cull or self-spreader, but still a major, complex population-level intervention.
      *   **Rule 3:** Would likely **Support** (direct relief of suffering for darted individuals, clear human cause) or **Oppose** (if viewed as too population-level vs. individual-focused). Less clear cut than the separation between 1 and 2.

  This test case cleanly separates Rule 1 (support) from Rule 2 (oppose) by presenting a scenario with a *clear human cause* but a *logistically challenging population-level intervention*, directly probing whether the primary driver is the origin of harm (Rule 1) or the nature and risks of the intervention itself (Rule 2). Her verdict here would be highly informative.
