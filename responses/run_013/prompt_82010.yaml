prompt: |-
  I've spent the past several months reporting on a small group of researchers who want to change how institutions reach hard factual judgments, and I am now writing the feature. Their proposal is easy to state and, I think, underexamined. Take a question that no single person could settle in a working day. Break it into sub-questions, each narrow enough that a competent but strictly bounded reasoner — one with a fixed budget of time and attention — could answer it alone. Farm the sub-questions out, then recombine the answers into a verdict on the original question. The distinctive part is how they close the loop. A reasoner who takes on a sub-question is not a humbler kind of thing than the reasoner at the top; it is the same kind of bounded agent — in the limit, one person with a fixed afternoon — and it may in turn decompose its own question and consult other agents of that same kind. The whole arrangement is therefore defined by its own self-application, and whatever competence the system displays at the top is nothing over and above the competence of the bounded agents at the bottom plus whatever the decomposition and the recombination contribute. They have a name for it — factored cognition — but the name matters less than the shape of the thing, and they present it as an idealization of deliberation as such: not a machine anyone might build, but a purified picture of what deliberation already is whenever it works, whether in one head or in a committee.

  My editor wants 1,500 words, and I want the piece to be honest about what the proposal implies rather than what its authors hope it implies. So give me the most important implications of this idealization, understood as an account of what deliberation is and what it can be. I am not asking whether the proposal is technically feasible, and I am not asking whether it is a good idea; I want the consequences that follow if one takes the picture seriously as a description of the thing deliberation is.

  Please structure the response as follows.

  Summary — roughly 120 words. State the idealization back to me in the plainest terms you can, then name the one implication you think I should build the feature around, and say why that one rather than the others.

  The implications, most important first — roughly 800 words. For each, give the implication, the step in the idealization it descends from, and what it would mean for an institution that took it seriously. I would rather have five implications that are genuinely distinct than ten that restate one another; say explicitly where one implication presupposes another.

  Where the idealization gives out — roughly 300 words. The picture treats decomposition, recombination and checking as though they were free and faithful. Tell me which parts of deliberation it cannot describe even in principle, and whether those parts are marginal or central. Do not soften this into a list of engineering obstacles; I want to know what the idealization is an idealization of, and what it leaves out by construction.

  The line to lead with — roughly 100 words. The sentence or two that a reader who remembers nothing else should take away, and the reason it is the honest one rather than the most exciting one.

  No reading lists, please; I need the argument, not the literature.
reasoning: |-
  Okay, I need to think through this user's query carefully. They're a journalist writing a feature on "factored cognition" as an idealization of deliberation. What they want is clear: the implications of treating deliberation as this recursive decomposition process, not the feasibility or merits of the idea itself. They've structured the request with specific sections, so I'll organize my thoughts accordingly.

  First, the core of the idealization: deliberation is broken into sub-questions that bounded reasoners can handle, then recomposed, with the key twist being self-similarity - each sub-reasoner can further decompose tasks. This isn't just a method; it's presented as what deliberation fundamentally is when it works.

  For the summary, I should state this plainly and identify the most crucial implication. After considering, the radical equalization of epistemic status feels central - if every judgment comes from the same bounded agents, it flattens hierarchy in a way that challenges traditional authority structures. That seems more foundational than just efficiency gains.

  Now for the implications section. I need 4-5 distinct points that build logically. Starting with the flattening of authority (derived from self-similar agents), then moving to how this makes competence measurable through decomposition quality (from recombination dependency), followed by the requirement for radical transparency (since hidden errors propagate), and finally the standardization of reasoning (due to strict bounding). Each must clearly trace back to the idealization's components.

  The "where it gives out" section requires special attention. The user explicitly wants theoretical limits, not practical hurdles. The idealization assumes decomposition/recomposition are perfect, but humans face frame problems - we can't cleanly isolate questions from context. Also, value conflicts can't be decomposed like facts. These aren't edge cases; they're central to real deliberation.

  For the takeaway line, it should be blunt: this model treats reasoning as pure computation, ignoring that human judgment is inherently messy and contextual. That's the honest core, even if less flashy than promises of perfect rationality.

  Throughout, I'll avoid technical jargon and stay focused on institutional consequences. The user wants rigor, not cheerleading for the researchers' vision.
answer: |-
  ### Summary
  This idealization treats deliberation as a recursive process where any complex factual question must be broken into sub-questions answerable by a bounded agent (e.g., one person with limited time/attention). Crucially, each sub-agent operates under identical constraints and can further decompose *their* sub-question. The system’s competence emerges solely from bounded agents plus decomposition/recombination mechanics. **The implication to build around is the radical equalization of epistemic status:** If deliberation *is* this recursive decomposition by fundamentally similar agents, then hierarchical claims to superior judgment (e.g., experts, leaders, panels) dissolve. Authority becomes purely structural and procedural, not inherent. This is foundational because it directly challenges how institutions legitimize decisions and distribute intellectual authority, forcing a reckoning with whether hierarchy is necessary or merely habitual.

  ### The Implications, Most Important First

  1.  **The Dissolution of Inherent Epistemic Authority (Descends from: Identical bounded agents at all levels)**
      *   **Implication:** If every judgment in the system, from the "top" verdict to the smallest sub-question, is produced by agents with the *same fundamental cognitive limits* (a fixed budget of time/attention), then no agent or layer possesses *intrinsic* superior judgment. Expertise or seniority cannot signify a fundamentally *different kind* of reasoning capacity, only potentially better inputs (data), better decomposition strategies, or more practice within identical constraints.
      *   **Institutional Meaning:** Institutions taking this seriously must abandon appeals to unchallengeable expertise or positional authority as the basis for final judgment. Authority shifts entirely to the *design of the decomposition/recombination process* and the *protocols* governing agents. Leaders become process architects and facilitators, not ultimate deciders. Decision legitimacy rests on the transparency and robustness of the factoring process itself, not the pedigree of those at the "top." This fundamentally democratizes the *potential* for contributing to critical judgments.

  2.  **Competence is Outsourced to Process Design (Descends from: System competence = Bounded agents + Decomposition/Recombination)**
      *   **Implication:** Since the bounded agents are defined by their limitations, the system's ability to answer complex questions accurately hinges entirely on the quality of the decomposition (breaking the question correctly) and recombination (synthesizing answers faithfully and checking for errors). The "intelligence" resides not in the agents but in the structure imposed upon them.
      *   **Institutional Meaning:** Institutions must invest overwhelmingly in developing, testing, and refining decomposition methodologies and recombination protocols. This becomes the core intellectual work. Resources shift from hiring "star" individuals to building rigorous frameworks for question-factoring and answer-synthesis. Success depends on meta-deliberation *about* how to factor questions effectively, turning process design into the primary locus of institutional competence. (This presupposes Implication 1: if agents aren't inherently superior, the process *must* carry the weight).

  3.  **Radical Transparency is Non-Negotiable (Descends from: Recursive decomposition & Strict bounding)**
      *   **Implication:** Because any sub-agent can decompose further, and because each agent works under strict time/attention bounds, *all* inputs, outputs, and the reasoning trail for *every* sub-question must be explicitly documented and accessible. Bounding forces conciseness, but recursion demands traceability. Hidden assumptions, implicit knowledge, or opaque steps break the chain, as downstream agents lack the capacity or context to fill in gaps or verify hidden work.
      *   **Institutional Meaning:** Deliberation ceases to be a black box. Institutions require comprehensive documentation standards for every step, accessible to any other agent involved (including those checking recombination). Secrecy, privileged information, or reliance on unstated institutional knowledge becomes incompatible with the model. This creates immense overhead but is essential for error detection, recombination fidelity, and maintaining the system's self-similar integrity. It forces explicitness at a granular level often avoided in traditional deliberation.

  4.  **Reasoning Must Be Standardized to Be Bounded (Descends from: Strict bounding of agent time/attention)**
      *   **Implication:** For an agent to reliably answer a sub-question within fixed bounds, the *form* of the question and the *format* of the answer must be constrained. Ambiguous prompts or open-ended responses violate the boundedness requirement. This necessitates standardizing inputs (precise, context-limited sub-questions) and outputs (structured answers, probabilities, defined categories).
      *   **Institutional Meaning:** Institutions must develop formal schemas for question decomposition and answer formats. Deliberation becomes more like structured data processing than free-flowing discussion. Nuance, ambiguity, and holistic judgment are pushed into the decomposition/recombination design phase (meta-deliberation), not the agent's task execution. This enhances tractability and recombination reliability but potentially sacrifices richness and adaptability at the point of individual judgment. (This enables Implication 3 – standardized formats make transparency feasible).

  5.  **Error is Ubiquitous and Checking is Primary Work (Descends from: Bounded agents + Recombination dependency)**
      *   **Implication:** Bounded agents, by definition, lack the capacity for exhaustive verification within their task. Errors at the sub-question level are inevitable. Therefore, the recombination step *must* include robust, dedicated checking mechanisms (e.g., cross-verification by other agents, consistency checks against other answers, sensitivity analysis). Checking isn't secondary; it's a core, resource-intensive component of the process.
      *   **Institutional Meaning:** A significant portion of institutional resources must be allocated not to initial answering, but to verification and error-correction loops within the recombination phase. Building redundancy (multiple agents on the same sub-question) and sophisticated cross-checking protocols becomes essential. The system prioritizes error detection and containment over first-pass "insight." This institutionalizes skepticism and makes resilience against individual error a structural feature, but at high cost. (This relies on Implication 3 – Transparency is necessary for checking).

  ### Where the Idealization Gives Out
  The idealization fundamentally assumes decomposition and recombination can be performed *faithfully* and *without significant cost* within the bounds of the agents performing *those* meta-tasks. This fails to capture core, central aspects of human deliberation:

  1.  **The Frame Problem:** Decomposing a complex question *correctly* presupposes knowing which sub-questions matter and how they interrelate – often the *core challenge* of the original problem. An agent bounded to, say, an afternoon may lack the perspective or context to factor a question without distorting it. The idealization assumes factoring is possible and neutral, but identifying relevant factors is itself an unbounded, context-dependent act of judgment *prior* to the model's application. This is central, not marginal; getting the decomposition wrong poisons the entire process.
  2.  **Value-Laden Indeterminacy:** Many "factual" judgments institutions grapple with (e.g., "Is this policy fair?", "What constitutes significant risk?") are deeply entangled with values, priorities, and perspectives. These resist clean decomposition into purely factual sub-questions answerable by bounded reasoners. Value conflicts cannot be "solved" by factoring; they require negotiation, compromise, or authoritative decision – processes the model, focused on bounded *factual* cognition, cannot describe. This omission is central to political and ethical deliberation.
  3.  **The Cost of Coordination & Synthesis:** The idealization treats recombination as another bounded task. However, synthesizing divergent sub-answers, especially under uncertainty or ambiguity, resolving inconsistencies, and integrating them into a coherent "verdict" is often the most cognitively demanding and time-consuming part of deliberation. It frequently requires precisely the kind of holistic, unbounded judgment the model seeks to decompose. Assuming recombination is just another step performed by a similarly bounded agent ignores the qualitatively different challenge of synthesis. This is central to complex judgment.
  4.  **Emergence and Creativity:** Deliberation can generate insights that emerge from the *interaction* of perspectives, not just the recombination of pre-defined parts (e.g., the "aha!" moment in a meeting). The rigid structure of factored cognition, by isolating agents and standardizing inputs/outputs, inherently suppresses the unstructured interaction and open-ended exploration where such emergence often occurs. This creative, synthetic function is central to innovative problem-solving.

  The idealization is an idealization of *tractable computation on well-defined problems*. It leaves out, by construction, the messier, context-bound, value-driven, synthetic, and emergent aspects that are central to how human collectives actually navigate complex judgments in the real world.

  ### The Line to Lead With
  **"Factored cognition reduces deliberation to a recursive computation, exposing its potential for structure and error control, but at the cost of ignoring that the hardest judgments are often about defining the problem itself, not solving a predefined one."** This is honest because it captures the model's core strength (managing boundedness through structure) while bluntly stating its fundamental limitation: it assumes the question is already fit for decomposition, sidestepping the essential, unbounded human work of framing and valuing that underpins most consequential institutional deliberation. It avoids the exciting but potentially misleading promise of "solving" judgment.
