        - Size: Very small if any.
        - Test status: Evidence, but not a test.
    - Testing camp:
        - Direction: No change.
        - Size: N/A
        - Test status: Not a test of the raven hypothesis.

  Crux 2: Does the equivalence condition hold without restriction?

  - Test Case 2: A non-black object is drawn at random from the set of non-black things and proves to be a non-raven (e.g., a red apple).
    - Probabilistic camp: 
        - Direction: Increases the probability of the contrapositive hypothesis and hence the raven hypothesis.
        - Size: Moderate if the sample is representative and the set of non-black things is not too large relative to non-ravens.
        - Test status: It is evidence for both hypotheses.
    - Testing camp: 
        - Direction: Confirms the contrapositive hypothesis (because the test was on non-black things) but not the raven hypothesis.
        - Size: Moderate for the contrapositive, none for the raven hypothesis.
        - Test status: It is a test of the contrapositive hypothesis, but not of the raven hypothesis.

  Crux 3: Background that entails no ravens.

  - Test Case 3: Background knowledge entails there are no ravens. Then a non-black non-raven (e.g., a green chair) is observed.
    - Probabilistic camp:
