prompt: |-
  There is a long-running disagreement over the raven paradox, and I want the joint statement that its two camps could sign. Three claims each have independent pull:

  (i) The instance criterion: a universal generalization is confirmed by its positive instances, that is, by objects satisfying both the antecedent and the consequent — so a black raven confirms that all ravens are black.
  (ii) The equivalence condition: logically equivalent hypotheses are confirmed by exactly the same evidence — so anything that confirms that all ravens are black confirms that all non-black things are non-ravens, and conversely.
  (iii) Non-black non-ravens — green chairs, white shoes — do not confirm that all ravens are black.

  The three cannot all be true, and the two camps divide over which to surrender. The probabilistic camp keeps (i) and (ii) and rejects (iii): it takes confirmation to be, at bottom, the raising of a probability, so that a green chair does confirm the raven hypothesis, only by a vanishing amount, and it treats the pull of (iii) as a confusion between a genuine but negligible increment and the increments that matter in inquiry. The testing camp keeps (iii) and therefore restricts or rejects one of the first two: it holds that evidence confirms a hypothesis only when it issues from a procedure under which the hypothesis's falsity would have made the observed outcome less likely, and it concludes either that the instance criterion must be limited to relevant instances or that the equivalence condition must be qualified so that equivalent propositions are not thereby equivalent hypotheses under test.

  Both camps grant that the probability calculus is not in question as mathematics. They differ over what 'confirms' should mean, over how much of the sampling procedure belongs to the evidence, and over whether the equivalence condition constrains the confirmation relation itself or only the contents of hypotheses.

  Write the joint statement. It should contain:

  1. A numbered list of claims both camps can sign — about the raven case itself, about the relations among (i), (ii) and (iii), about what the probability calculus does and does not settle, and about what would count as progress. No item may be vacuous, and none may be worded so as to smuggle in one camp's position; where a claim is acceptable to a camp only with a qualification, state the qualification.
  2. The precise points of residual disagreement, each first in the wording the camp holding it would accept as its own, then in wording the other camp accepts as a fair rendering of the opposing view.
  3. The cruxes — the sub-questions such that settling one would move at least one camp — and, for each crux, a concrete case or argument both camps agree bears on it, together with each camp's prediction about how that case comes out, stated in advance and in checkable form.
  4. For each camp, what it would count as a reason to abandon its own position.
  5. A verdict on how much of the dispute is verbal: if some of it dissolves once 'confirms' is disambiguated, say which part and why; if the residue is substantive, say exactly what turns on it.

  Where they sharpen matters, use cases of this kind, and add others: an object drawn uniformly at random from the whole universe proves to be a non-black non-raven; a non-raven known in advance to be a non-raven proves to be non-black; a non-black object proves to be a non-raven; a raven proves to be black; a background that already entails that there are no ravens; and a hypothesis stated with a 'grue'-style predicate — a thing is grue if it is first examined before a certain future date and green, or otherwise blue — rather than with a colour predicate. For each case you use, say what each camp predicts about the direction and the size of any change in probability, and whether that camp regards the case as a test of the hypothesis at all.

  Format the result as a numbered agreed-claims section followed by a table of disagreements, with the cruxes, their test cases and the camps' predictions placed after the table. The document must stand on its own: no citations, no attributions to named authors, no reading list.
reasoning: |-
  We are to produce a joint statement for two camps in the raven paradox. The camps are:
  - Probabilistic camp: keeps (i) and (ii), rejects (iii). Confirmation is probabilistic, so non-black non-ravens do confirm, but negligibly.
  - Testing camp: keeps (iii), and thus restricts (i) or (ii). Confirmation requires a testing procedure that could have falsified the hypothesis.

  We must write a document that includes:

  1. A numbered list of agreed claims (without vacuity or smuggling in a position).
  2. The precise points of residual disagreement, stated from each camp's perspective and then the other camp's fair rendering.
  3. Cruxes (sub-questions) with test cases and each camp's predictions.
  4. For each camp, what would count as a reason to abandon its position.
  5. A verdict on how much is verbal and what residue is substantive.

  We are to use specific cases and add others as described.

  Let's organize the document as follows:

  # Joint Statement on the Raven Paradox

  ## 1. Agreed Claims

  Both camps accept the following:

  1.1. **The probability calculus as mathematics**: The rules of probability (e.g., Bayes' theorem, the definition of conditional probability) are mathematically sound and not in dispute.

  1.2. **The inconsistency of (i), (ii), and (iii)**: The three claims (i) instance criterion, (ii) equivalence condition, and (iii) that non-black non-ravens do not confirm, cannot all be true simultaneously.

  1.3. **The role of background knowledge**: Background knowledge (including information about the sampling procedure and the domain) can affect whether a given piece of evidence confirms a hypothesis, and to what degree.

  1.4. **The role of sampling procedures**: The method by which evidence is gathered (e.g., random sampling from the whole universe, or targeted sampling of ravens) is relevant to the confirmation relation.

  1.5. **The vanishingly small effect in the probabilistic view**: In the probabilistic camp, the confirmation provided by a non-black non-raven (such as a green chair) to the hypothesis that all ravens are black is typically extremely small (and in many realistic settings, negligible) compared to the confirmation provided by a black raven.

  1.6. **The testing camp's rejection of (iii) without a test**: The testing camp holds that non-black non-ravens do not count as evidence in a test of the raven hypothesis unless they are encountered in a procedure that could have produced a counterexample (i.e., a non-black raven).

  1.7. **The equivalence condition in logic**: Logically equivalent hypotheses have the same truth conditions. However, the camps agree that the equivalence condition for confirmation (ii) might not hold without qualification when the method of testing is taken into account.

  1.8. **Progress indicators**: Progress in resolving the dispute would be made by:
     - Clarifying the concept of confirmation (e.g., by distinguishing different senses of 'confirms').
     - Developing a formal model that incorporates the role of testing procedures and background knowledge.
     - Identifying and agreeing on a set of clear, shared criteria for what counts as a confirmation.

  ## 2. Points of Disagreement

  We present each point of disagreement in two ways: first as the camp holding it would state it, then as the other camp states it fairly.

  ### Disagreement 1: The confirmation by non-black non-ravens

  - **Probabilistic camp's statement**: Non-black non-ravens (e.g., a green chair) do confirm the hypothesis that all ravens are black, but the degree of confirmation is typically so small as to be negligible in practical inquiry. This is because the observation of a non-black non-raven slightly increases the probability of the hypothesis (as per the probability calculus) when background knowledge is taken into account.
  - **Testing camp's fair rendering**: The probabilistic camp holds that even irrelevant objects (like a green chair) can provide some confirmation, but they admit it is negligible and not what we would normally count as evidence in a test.

  - **Testing camp's statement**: Non-black non-ravens do not confirm the hypothesis that all ravens are black because they are not part of a testing procedure that could have falsified the hypothesis. The hypothesis is about ravens, so only observations of ravens (or perhaps of non-black things) can test it.
  - **Probabilistic camp's fair rendering**: The testing camp holds that non-black non-ravens do not confirm the hypothesis at all, because they are not gathered in a way that could have produced a counterexample to the hypothesis.

  ### Disagreement 2: The scope of the equivalence condition

  - **Probabilistic camp's statement**: The equivalence condition (ii) holds without restriction: any evidence that confirms a hypothesis also confirms any logically equivalent hypothesis. Thus, a black raven confirms "all non-black things are non-ravens" just as it confirms "all ravens are black", and a non-black non-raven confirms "all ravens are black" just as it confirms "all non-black things are non-ravens".
  - **Testing camp's fair rendering**: The probabilistic camp holds that the equivalence condition applies without any restriction to the confirmation relation.

  - **Testing camp's statement**: The equivalence condition must be qualified: it applies to the logical content of hypotheses, but it does not necessarily hold for the confirmation relation when the testing procedure is considered. Thus, a non-black non-raven might confirm the hypothesis "all non-black things are non-ravens" (if gathered in a test of that hypothesis) but not "all ravens are black" (because it was not gathered in a test of the raven hypothesis).
  - **Probabilistic camp's fair rendering**: The testing camp holds that the equivalence condition does not hold for confirmation when the hypotheses are being tested by different procedures.

  ### Disagreement 3: The instance criterion

  - **Probabilistic camp's statement**: The instance criterion (i) holds without restriction: a positive instance (a black raven) of a universal generalization always confirms it.
  - **Testing camp's fair rendering**: The probabilistic camp holds that any positive instance confirms the generalization, regardless of how it was obtained.

  - **Testing camp's statement**: The instance criterion must be restricted: a positive instance confirms a universal generalization only when it results from a test that could have produced a counterexample. For example, a black raven observed in a context where we are specifically examining ravens (and thus could have found a non-black one) confirms the hypothesis, but a black raven observed in a context where we are sampling everything might not (if the sampling procedure is not designed to test the raven hypothesis).
  - **Probabilistic camp's fair rendering**: The testing camp holds that an instance only confirms if it is gathered in a test of the hypothesis.

  ## 3. Cruxes, Test Cases, and Predictions

  We present three cruxes with test cases. For each test case, we describe the scenario, and then state each camp's prediction about the direction and size of the change in the probability of the hypothesis (if applicable) and whether they regard the case as a test of the hypothesis.

  ### Crux 1: Does the method of evidence collection matter for confirmation?

  **Test Case 1a**: An object is drawn uniformly at random from the entire universe and proves to be a non-black non-raven (e.g., a green chair).

  - **Probabilistic camp prediction**: 
    - Direction: The observation slightly increases the probability of the hypothesis that all ravens are black (and of the equivalent hypothesis that all non-black things are non-ravens). The size is very small (negligible in a large universe).
    - Test status: It is evidence, but not a test in the sense of being a designed experiment for the raven hypothesis.

  - **Testing camp prediction**: 
    - Direction: No change in the probability (or not considered confirmation). 
    - Test status: Not a test of the raven hypothesis because the sampling procedure was not targeted at ravens and the hypothesis does not predict the absence of green chairs.

  **Test Case 1b**: A non-raven, known in advance to be a non-raven (e.g., because it is a shoe), is examined and proves to be non-black (e.g., white).

  - **Probabilistic camp prediction**: 
    - Direction: Slight increase in probability (if the non-raven was not already known to be non-black). But if the object was known to be a non-raven, then observing it to be non-black might not change the probability (because the hypothesis only constrains ravens and non-black things, and if we knew it was a non-raven then the hypothesis does not say anything about its color). However, if we did not know its color, then it would be a non-black non-raven and thus a positive instance of the contrapositive, so it should slightly increase the probability. But note: if we already knew it was a non-raven, then the observation that it is non-black might be irrelevant? The probabilistic camp would need to model the background knowledge. Let us assume that we did not know the color and we are updating. Then:
      - If the object was known to be a non-raven but not its color, then observing it to be non-black confirms the contrapositive, hence the hypothesis. But the degree is small because non-ravens are common.
    - Size: Very small.
    - Test status: Evidence, but not a test.

  - **Testing camp prediction**: 
    - Direction: No change. 
    - Test status: Not a test of the raven hypothesis because we were examining a known non-raven and the hypothesis does not predict what color non-ravens are.

  ### Crux 2: Does the equivalence condition hold without restriction?

  **Test Case 2**: A non-black object (e.g., a red thing) is drawn at random from the set of non-black things and proves to be a non-raven (e.g., it is a red apple).

  - **Probabilistic camp prediction**: 
    - Direction: This observation confirms the hypothesis that all non-black things are non-ravens (and hence, by equivalence, the raven hypothesis). The amount of confirmation might be moderate if the sample is representative and the set of non-black things is not too large relative to the set of non-ravens.
    - Test status: It is evidence for the contrapositive, and hence for the original.

  - **Testing camp prediction**: 
    - Direction: This observation confirms the hypothesis that all non-black things are non-ravens (because the test was designed for that hypothesis by sampling non-black things). However, it does not confirm the raven hypothesis because the test was not about ravens. 
    - Test status: It is a test of the contrapositive hypothesis, but not of the raven hypothesis.

  ### Crux 3: The role of background knowledge that entails there are no ravens

  **Test Case 3**: The background knowledge entails that there are no ravens (e.g., we are in a world without ravens). Then we observe a non-black non-raven (e.g., a green chair).

  - **Probabilistic camp prediction**: 
    - Direction: The observation does not change the probability of the hypothesis because the hypothesis is already true (since there are no ravens). The probability was 1 and remains 1. 
    - Test status: The evidence is irrelevant because the hypothesis is already known to be true.

  - **Testing camp prediction**: 
    - Direction: No change. 
    - Test status: Not a test because the hypothesis is already settled.

  ### Crux 4: Grue-style hypothesis

  **Test Case 4**: We consider the hypothesis that all emeralds are grue (grue = green if first observed before some date T, blue otherwise). We observe an emerald before T and it is green.

  - **Probabilistic camp prediction**: 
    - Direction: This observation confirms the grue hypothesis (by the instance criterion). However, the camp recognizes that the grue hypothesis is not projectible and that the confirmation might be undermined by background knowledge about color and time.
    - Size: Depends on the background knowledge. Without any background knowledge that distinguishes grue from green, it would be a standard confirmation. But typically, background knowledge about color constancy would make the grue hypothesis less probable.

  - **Testing camp prediction**: 
    - Direction: The observation confirms the grue hypothesis only if it is part of a test that could have falsified it (e.g., by observing an emerald before T that is not green). But the testing camp might also hold that the grue hypothesis is not testable in the same way because it is not a lawlike generalization. They would say that the instance criterion does not apply to such predicates without a suitable testing procedure.

  ## 4. Reasons for Abandonment

  - **Probabilistic camp**: They would abandon their position if it could be shown that the observation of a non-black non-raven does not increase the probability of the raven hypothesis in any model that reasonably represents our background knowledge (e.g., if in every reasonable model it either leaves the probability unchanged or decreases it).

  - **Testing camp**: They would abandon their position if it could be shown that a non-black non-raven, observed in a context where it is not part of a test of the raven hypothesis, does in fact provide confirmation (and not just a negligible amount) in a clear case where the testing procedure is irrelevant.

  ## 5. Verdict on Verbal vs Substantive Dispute

  The dispute is partly verbal and partly substantive.

  - **Verbal aspect**: The camps use the word 'confirms' differently. For the probabilistic camp, 'confirms' means any increase in probability, no matter how small. For the testing camp, 'confirms' means passing a test that could have falsified the hypothesis. If we disambiguate by using two terms (e.g., 'probabilistically confirms' vs 'test-confirms'), then part of the dispute dissolves: both can agree that non-black non-ravens probabilistically confirm by a negligible amount but do not test-confirm.

  - **Substantive residue**: The substantive disagreement is whether the probabilistic notion of confirmation (any increase in probability) is the right one for understanding scientific inquiry and induction. The testing camp holds that the probabilistic notion is too weak and does not capture the idea of a severe test. They also disagree on whether the equivalence condition should hold for the confirmation relation when the testing procedure is taken into account.

  Thus, the core substantive issue is: **Should confirmation be defined solely by the probability calculus (as a relation between propositions) or must it also incorporate the method of evidence collection?**

  ## Formatting

  We now format the above as required.

  ### Joint Statement: Agreed Claims

  1.1. The probability calculus, as a mathematical formalism, is sound and not in dispute. It provides the tools for calculating probabilities under specified assumptions.

  1.2. The three claims — (i) the instance criterion, (ii) the equivalence condition, and (iii) that non-black non-ravens do not confirm the raven hypothesis — are jointly inconsistent. Therefore, at least one must be rejected or modified.

  1.3. Background knowledge, including knowledge about the domain and the sampling procedure, plays a crucial role in determining whether and to what degree a given piece of evidence confirms a hypothesis.

  1.4. The method by which evidence is collected (the sampling procedure) is relevant to the confirmation relation.

  1.5. In the probabilistic camp's view, the confirmation provided by a non-black non-raven to the raven hypothesis is typically extremely small (and in many contexts negligible) compared to that provided by a black raven.

  1.6. The testing camp holds that non-black non-ravens do not confirm the raven hypothesis when they are not gathered in a procedure that could have produced a counterexample (a non-black raven).

  1.7. Logically equivalent hypotheses have the same truth conditions. However, the equivalence condition for confirmation may require qualification when the testing procedure is considered.

  1.8. Progress in resolving the dispute would be facilitated by:
      a) Clarifying the concept of confirmation, possibly by distinguishing different senses of the term.
      b) Developing formal models that explicitly incorporate the role of testing procedures and background knowledge.
      c) Identifying shared criteria for confirmation that both camps can accept.

  ### Table of Disagreements

  | Issue | Camp | Their Statement | Fair Rendering by the Other Camp |
  |-------|------|----------------|----------------------------------|
  | Confirmation by non-black non-ravens | Probabilistic | Non-black non-ravens do confirm the raven hypothesis, but the degree is typically negligible. | The probabilistic camp holds that even irrelevant objects provide some confirmation, but they admit it is negligible. |
  |   | Testing | Non-black non-ravens do not confirm the raven hypothesis because they are not part of a test that could have falsified it. | The testing camp holds that non-black non-ravens do not confirm at all, because they are not gathered in a test of the hypothesis. |
  | Equivalence condition | Probabilistic | The equivalence condition holds without restriction: evidence confirming a hypothesis also confirms any logically equivalent hypothesis. | The probabilistic camp holds that the equivalence condition applies without restriction to the confirmation relation. |
  |   | Testing | The equivalence condition must be qualified: it applies to the logical content but not necessarily to the confirmation relation when the testing procedure is considered. | The testing camp holds that the equivalence condition does not hold for confirmation when the hypotheses are tested by different procedures. |
  | Instance criterion | Probabilistic | A positive instance (e.g., a black raven) of a universal generalization always confirms it. | The probabilistic camp holds that any positive instance confirms the generalization, regardless of how it was obtained. |
  |   | Testing | A positive instance confirms a universal generalization only when it results from a test that could have produced a counterexample. | The testing camp holds that an instance only confirms if it is gathered in a test of the hypothesis. |

  ### Cruxes and Test Cases

  Crux 1: Does the method of evidence collection matter for confirmation?

  - Test Case 1a: An object drawn uniformly at random from the whole universe proves to be a non-black non-raven (e.g., a green chair).
    - Probabilistic camp: 
        - Direction: Slight increase in probability.
        - Size: Very small (negligible).
        - Test status: Not a test (in the testing camp's sense) but it is evidence.
    - Testing camp:
        - Direction: No change (or not confirmation).
        - Size: N/A
        - Test status: Not a test of the raven hypothesis.

  - Test Case 1b: A non-raven known in advance to be a non-raven (e.g., a shoe) is examined and proves to be non-black (e.g., white).
    - Probabilistic camp: 
