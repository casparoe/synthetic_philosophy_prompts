prompt: |-
  You're going to act as a philosopher who works on the ethics of deception — specifically the lying-vs-misleading literature. Think carefully, and before you write anything, brainstorm privately: list the structural features people usually cite when they say lying is worse than merely misleading, and then work out which of those features you can invert without cheating. Don't show me the brainstorm unless it changes your answer.

  I need a thought experiment built to spec. I'm putting together a dataset of philosphy prompts and I need cases that can't be answered by just reciting the usual moves, so build the case rather than describing the literature.

  Here's what I want: a single case with two speakers in otherwise parallel situations. Speaker A tells a straight-out lie. Speaker B says only things that are true — all of them — with no tricks involving unusual readings of words, no exploiting a hearer who's being sloppy, no "technically I said X" games, and the hearer is a fully competent, attentive adult who is not being careless. B still misleads that hearer into a false belief, and the false belief has to come out of the hearer's own good reasoning from the true things B said. B doesn't get to rely on a false conversational implicature that any linguist would count as part of what was meant.

  The spec I actually care about: B's action has to come out *worse* than A's, and not because of downstream consequences — stipulate the consequences are as equal as you can make them. The badness has to sit in the act itself. And I want the case engineered so the load-bearing feature is this: when the hearer later learns everything, there's nothing for them to correct. Every sentence B uttered is still true, so they can't point to a falsehood; the false belief has to be dismantled by re-reasoning, and B gets to stand there saying they never said anything false. A's lie, by contrast, once discovered hands the hearer something to grab hold of — a false sentence that can be marked false and thrown out. So the case needs to make the paltering (I think that's the word for it) stickier and more corrosive than the lie.

  Constraints: one paragraph for the scenario, realistic — a workplace, a family, a contract negotiation, a medical or financial conversation. Not sci-fi, not a trolley. Don't reuse any example you've already seen floating around in this literature, and don't let the case work by making B a worse person for independent reasons (B isn't a sadist, doesn't enjoy it, isn't getting paid more for it).

  Then do the analysis, in this order:

  1. State the belief, the true statements, and the hearer's inference, so I can check that no false implicature is doing the work.
  2. Give the verdict of at least two rival accounts of the lying/misleading distinction — for instance the picture on which what matters is what's literally said versus what's implicated, and the picture on which what matters is the kind of assurance or warrant a speaker takes on by addressing someone at all. Say whether each account can even see a moral difference here, and in which direction. Be careful with this step: if you can't honestly get one of the two accounts to say B is worse, say so plainly rather than fudging it.
  3. Tell me which single feature of the case is doing the work, and what happens if I remove it — does the case collapse back into the boring "lying is worse" result?
  4. Give me the strongest reply from someone who still thinks the lie is the worse of the two. Don't strawman it.

  Finish with a JSON object, in American English, with exactly these fields: "scenario" (the one-paragraph case), "true_statements" (array of strings, the sentences B asserts), "hearer_inference" (string), "verdict_said_vs_implicated" (string), "verdict_assurance_warrant" (string), "load_bearing_feature" (string), "removal_test" (string), "strongest_reply_lying_worse" (string), "confidence" (one of "high", "medium", or "low", with a short parenthetical saying why).
