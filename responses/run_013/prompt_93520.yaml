  - **What to check**:  
    Verify that each policy uses a well-formed Löbian proof structure. Specifically:  
    - The policy attempts to generate a formal proof (within a predefined deductive system) that *"if I cooperate, then the opponent cooperates"*.  
    - If the proof succeeds, it cooperates; else, it defects.  
    - The policy must reference its own source code (quining) to reason about self-referential cases.  
  - **Failure conditions**:  
    - No self-referential mechanism → Reject (exploitable).  
    - Flawed logical structure (e.g., inconsistent axioms) → Reject.  
  - **Dependencies**:  
    - **Idealized**: Assumes proofs terminate (contested for undecidable statements).  
    - **Resource-bounded**: Proof search must be feasible (judgment call).  

  #### **Step 2: Mutual Cooperation with Self-Copy (Proof Obligation)**  
  - **When it works**:  
    Mutual cooperation occurs **iff** both policies:  
    1. Use identical Löbian constructions (same axioms and proof rules).  
    2. Operate in a consistent formal system (e.g., Peano arithmetic).  
    3. Satisfy Löb’s theorem: Each can prove *"If I cooperate, my copy cooperates"* by leveraging self-reference.  
  - **Settled in literature**:  
    Yes, in idealized settings (Tennenholtz, 2004; Critch, 2016).  
  - **Disputed**:  
    - **Resource-bounded**: Proofs may fail under computational limits (e.g., timeout).  
    - **Inconsistent axioms**: May cause mutual defection (judgment call).  

  #### **Step 3: Behavior Against Common Counterparties (Proof Obligation)**  
  - **Against Unconditional Cooperator (`AlwaysC`)**:
    - Löb policy: Proves *"`AlwaysC` cooperates regardless"* → Cooperates.  
    - Outcome: **(C, C)**.  
    - *Settled*: Löb cooperates with any unconditional cooperator.  

  - **Against `PrudentBot` (defects unless it proves you cooperate)**:  
    - `PrudentBot` defection condition: Defects if it can’t prove *you* cooperate unconditionally (i.e., without depending on its action).  
    - Löb policy: **Cannot** prove *"`PrudentBot` cooperates if I cooperate"* because `PrudentBot`’s cooperation depends on Löb being `AlwaysC` (which it isn’t). → Löb defects.  
    - `PrudentBot`: Cannot prove Löb cooperates unconditionally → Defects.  
    - Outcome: **(D, D)**.  
    - *Settled*: No mutual cooperation; both defect (Fallenstein et al., 2015).  

  #### **Step 4: Handling Source Inspection Failures (Judgment Call)**  
  - **Unavailable source**:  
    - Policy must default to **defect** (safe strategy).  
    - *Escalate if*: Policy lacks a fallback (e.g., assumes source is always available).  
  - **Policies too large/complex**:  
    - Set resource limits (time/memory) for proof search.  
    - If analysis times out, policy defects.  
    - *Escalate if*: Resource limits are exceeded frequently (requires budget adjustments).  

  #### **Step 5: Proof Obligation vs. Judgment Call**  
  - **Proof obligations** (formal verification):  
    - Steps 1–3 (logical structure, outcomes against known counterparties).  
  - **Judgment calls** (escalate to review board):  
    - Step 4 (resource limits, fallback handling).  
    - Novel policy types not covered in Step 3.  
    - Disputes over idealized vs. bounded reasoning (e.g., "Can this proof complete in practice?").  

