  ### **Key Controversies in Decision Theory**
  - **Settled in Literature**:  
    - Löbian mutual cooperation with identical copies (program equilibrium).  
    - Löb cooperates with `AlwaysC` but defects with `PrudentBot`.  
  - **Genuinely Disputed**:  
    1. **Resource-bounded rationality**:  
       - Can real-world agents find Löbian proofs before timeout? (No consensus; depends on implementation.)  
       - How to set optimal time/memory limits? (Engineering trade-off.)  
    2. **Self-referential consistency**:  
       - What if agents use different axiomatic systems? (Risk of mutual defection; requires standardization.)  
    3. **Adversarial incentives**:  
       - Can a malicious agent spoof proof traces? (Requires cryptographic extensions; not in base theory.)  

