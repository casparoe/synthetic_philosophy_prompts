  #### **Pair 1: Two Löb-Style Self-Verifying Cooperators**
  - **Step 1**: Both use valid Löbian quining → Pass.  
  - **Step 2**: Mutual cooperation in idealized setting → **(C, C)**.  
  - **Idealized vs. Bounded**:  
    - *Settled*: Cooperation is proven (Löb’s theorem).  
    - *Disputed*: May fail if proofs exceed resource limits.  

  #### **Pair 2: Löb vs. Unconditional Cooperator (`AlwaysC`)**  
  - **Step 3**:  
    - Löb proves `AlwaysC` cooperates → Cooperates.  
    - `AlwaysC` always cooperates → **(C, C)**.  
  - **Idealized vs. Bounded**:  
    - *Settled*: Robust even under bounded resources (trivial proof).  

  #### **Pair 3: Löb vs. `PrudentBot`**  
  - **Step 3**:  
    - Löb cannot prove `PrudentBot` cooperates conditionally → Defects.  
    - `PrudentBot` cannot prove Löb cooperates unconditionally → Defects.  
    - Outcome: **(D, D)**.  
  - **Idealized vs. Bounded**:  
    - *Settled*: No cooperation (both defect).  
    - *Disputed*: If `PrudentBot`’s proof system is weaker, outcomes may vary (rare).  

