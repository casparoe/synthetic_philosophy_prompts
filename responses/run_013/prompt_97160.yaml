prompt: |-
  I help run a small supported-housing charity — I'm the vice chair of the board, not an academic, I just did a night class in philosophy years ago and it's left me with enough knowledge to be annoying at meetings. Whenever something bad happens to one of our tenants (someone dies of an overdose after we missed a couple of welfare checks, a fella falls down a stairwell we'd been meaning to fix the light in) we have to do one of these "learning reviews," and we always get stuck on the same thing: did we cause this, or did it just happen while we weren't doing anything? Someone says well if we'd done X it wouldn't have happened, and then someone else says you could say that about anything, if we'd done Y or Z instead it also wouldn't have happened, and then the meeting dissolves and we write "lessons learned" and go home. I've realised this is a real topic with a name — causation by omission — so what I want is a procedure my committee can actually run on a case, not a lecture. Something like: the questions to ask in order, what counts as a good enough answer to each, where the thing stops with a no, and where it has to hand the decision to a person because the question has turned into a question about what we owed the tenant rather than about what happened. It has to be honest about the trap where "it wouldn't have happened without us doing nothing" lets in basically everything we've ever failed to do, and about the way whether skipping something even registers as a cause seems to depend on whether anyone expected us to do it in the first place (and on who those people are, and whether we ever said we'd do it). It should also handle the case where we did do something and the case where two different things we failed to do would each have been enough on their own, and where we acted but the harm still came through something else. I need to be able to run it in an afternoon with four trustees who aren't philosophers, and I need it to say plainly which steps are just judgement calls wearing a lab coat.

  Then please run it on two of our actual-ish cases. First: a tenant with a known history dies of an overdose after we missed two scheduled welfare checks. Second, and this is the one I'm worried about: a tenant died during a cold snap and we had never applied for a grant that would have paid for a night warden, which we had said in our annual report we were going to apply for; I think we're basically blameless there and I suspect the procedure will disagree with me, so if it does, say so straight and tell me why, don't soften it.

  And at the end, tell me where the whole thing is most likely to be wrong — which consideration, if it turned out to be the real story, would flip the verdict on either case, and what would make you say the procedure itself was the problem rather than the case. I'd rather have a procedure with a visible seam than a tidy one that quietly hides the bit where we're just deciding what kind of charity we want to be.
reasoning: |-
  Okay, the user is involved in a small supported-housing charity as the vice chair of the board. They're struggling with "learning reviews" after incidents like tenant deaths. The core issue is determining if the charity caused harm through omission—like missing welfare checks or not applying for a grant. They want a practical, step-by-step procedure to assess causation by omission, not theoretical lectures. 

  First, I need to understand their pain points. The committee gets stuck in circular debates: "If we did X, it wouldn't have happened" vs. "that could apply to anything." They need a structured process to cut through that. They also mention real cases—overdose after missed checks and death during a cold snap without a night warden—so the procedure must handle concrete examples. 

  The user’s explicit request is a clear procedure with ordered questions, decision points, and honesty about where judgment calls are disguised as logic. But deeper needs are likely accountability without paralyzing guilt, legal protection, and maintaining team morale. They don’t want to assign blame unfairly but need to know when the charity truly failed. 

  Now, structuring the procedure. Key elements from philosophy (causation by omission) and law (duty of care) must be simplified. Steps should include: establishing duty, actual omission, factual causation (but-for test), scope of duty, and normative judgment. I’ll use thresholds like "reasonably expected" to prevent overreach (e.g., blaming every hypothetical omission). 

  For Case 1 (overdose): Missed welfare checks are a clear duty breach. But-for test likely passes—checks could’ve prevented death. Scope of duty covers overdose risks. Verdict: causal omission. 

  For Case 2 (cold snap): Duty exists for tenant safety. Omission—failing to apply for a grant mentioned in reports—but but-for test is shaky. Would the grant fund a warden? Would a warden have prevented the death? Too speculative. Verdict: likely not causal, but highlights procedural failure. 

  User suspects Case 2 is blameless; I agree but stress procedural gaps. The vulnerability? If evidence shows the grant was certain and a warden would’ve spotted the tenant, it flips. 

  Biggest flaw in the procedure: Step 5 (normative judgment) is inherently subjective. It forces confronting "what kind of charity we are," which is uncomfortable but necessary. Transparency about this seam is crucial—no hiding the values debate. 

  Finally, the procedure must be runnable in an afternoon by non-philosophers. Language should be plain, with clear "stop here if no" points. Emphasize that some steps are judgment calls ("lab coat" moments) to manage expectations.
answer: |-
  Here's a practical, step-by-step procedure for your committee to assess causation by omission in "learning reviews." It's designed to cut through circular debates, acknowledge judgment calls, and focus on actionable accountability. The core structure is: **Duty -> Omission -> Factual Cause -> Scope -> Normative Cut-off**.

  **The Procedure: 5 Questions with Thresholds**

  1.  **Was there a specific, reasonably expected duty or commitment related to the harm?**
      *   **Ask:** What specific action(s) *should* we have taken *before* the event, based on our policies, contracts, explicit promises (like annual reports), professional standards, or basic tenant safety obligations? Was this duty active *at the relevant time*?
      *   **Good Enough Answer:** Reference to a written policy, a recorded decision (meeting minutes), a contractual obligation, a regulatory requirement, or a *specific, documented* commitment (like the grant application promise). General goodwill or "best practice" isn't enough *alone*.
      *   **Threshold:** If **No** -> **Stop.** This omission isn't a *candidate* cause. (The harm may still be tragic, but not *causally* linked to *our specific inaction*). If **Yes** -> Proceed to Q2.
      *   **Judgment Call (Lab Coat Alert):** Defining "reasonably expected." Is it based on *our stated standards* or an *external expert view*? (Default: *Our* stated standards/promises are primary).

  2.  **Did we actually omit that specific duty/commitment?**
      *   **Ask:** Did we demonstrably *fail* to perform the specific action identified in Q1 at the relevant time? (e.g., Missed *those* checks? Didn't submit *that* grant application by the deadline or at all?).
      *   **Good Enough Answer:** Clear evidence of non-performance (e.g., check logs show gaps, grant application records show no submission).
      *   **Threshold:** If **No** (we did it) -> **Stop** for *this specific omission*. (Harm might link to *how* we did it, or another cause). If **Yes** -> Proceed to Q3.
      *   **Judgment Call (Minimal):** Usually straightforward verification.

  3.  **Factual Causation ("But For"): Would the harm *likely* have been avoided *if* we had performed the duty?**
      *   **Ask:** Is it more probable than not ("on the balance of probabilities") that performing the omitted action *would have prevented or significantly mitigated* this specific harm? Focus on realistic, direct connections.
      *   **Good Enough Answer:** A logical, evidence-based chain: Performing X -> Leads to Y -> Prevents Z (this harm). Evidence includes tenant history, known risks, timing, nature of the action. *Avoid absolute certainty* ("guaranteed").
      *   **Threshold:** If **No** (harm was inevitable, or action wouldn't have changed outcome) -> **Stop.** Omission is not a factual cause. If **Yes** -> Proceed to Q4.
      *   **Judgment Call (Major Lab Coat Alert):** This is the core speculation. Base it on *known facts and reasonable probabilities*, not remote possibilities. "Could have" is too weak; "likely would have" is the threshold.

  4.  **Scope of Duty: Was the *type* of harm that occurred within the *reasonably foreseeable scope* of the risk this duty was meant to address?**
      *   **Ask:** When we established this duty (e.g., welfare checks, securing funding for wardens), was preventing *this type of harm* (overdose, cold-weather death) a core reason *why* we had that duty? Does it fall squarely within what the duty was designed to protect against?
      *   **Good Enough Answer:** Direct link between the purpose of the duty and the harm (e.g., welfare checks aim to spot crises like overdoses; night wardens aim to provide safety/assistance including during emergencies like cold snaps).
      *   **Threshold:** If **No** (harm was freakishly unexpected given the duty's purpose) -> **Stop.** Omission exists, but not causally responsible *for this harm*. If **Yes** -> Proceed to Q5.
      *   **Judgment Call (Lab Coat Alert):** Defining "reasonably foreseeable scope." Use the perspective of a reasonable person/trustee *at the time the duty was set*, knowing what we knew then.

  5.  **Normative Cut-off: Is holding us causally responsible for this harm *through this omission* reasonable and fair, given the context, or does it open the floodgates to absurdity?**
      *   **Ask:** Does assigning causation here:
          *   a) Align with the core purpose of our duty and our role as a charity?
          *   b) Avoid making us responsible for *every* possible bad thing that *could* conceivably be prevented by *any* action we *might* have taken?
          *   c) Account for practical realities and resource constraints *at the time*?
      *   **Good Enough Answer:** A reasoned discussion balancing accountability with reasonableness. Did this omission represent a *meaningful failure* in our core protective function, or is linking it to *this harm* stretching responsibility too thin?
      *   **Threshold:** This is **ALWAYS a Judgment Call (No Lab Coat - This is the Seam).** There is no mechanical test. The committee must decide based on their understanding of the charity's mission, values, and practical operation. This is where "what we owed the tenant" becomes central. **Output:** **Yes** (Causal Omission) or **No** (Not Causal Omission).
      *   **Crucial Note:** A "No" here *doesn't mean the omission was okay*. It means that *for this specific harm*, the causal link is too attenuated, speculative, or unfair to assign. The omission might still be a serious procedural failure needing correction!

  **Handling Complexities (Built-in):**
  *   **We acted, but harm happened:** Q2 - If you performed the duty, it stops there for *that* duty. Harm might be due to *inadequate* action (a different duty breach?) or an entirely separate cause.
  *   **Multiple omissions, each sufficient alone:** Run each omission through Q1-Q5 separately. If *any one* passes Q5, it's a causal omission. (e.g., Both a missed check *and* a broken stair light omission could independently be found causal for a fall).
  *   **Harm came "through something else":** Q3 & Q4 handle this. Did your omission *enable* the other cause? Was the "something else" within the scope of the risk your duty addressed?

  ---

  **Running the Cases:**

  **Case 1: Tenant dies of overdose after two missed scheduled welfare checks.**

  1.  **Duty?** **YES.** Specific duty: Conducting scheduled welfare checks. Based on policy/procedure designed to monitor tenant well-being and identify crises.
  2.  **Omission?** **YES.** Evidence: Check logs confirm two specific checks were missed.
  3.  **Factual Cause?** **YES (Likely).** Based on tenant history, the purpose of checks is to identify overdose risks/incidents. A timely check *likely* would have discovered the overdose in progress or imminent risk, enabling intervention (calling EMS, administering naloxone if trained/permitted). Not guaranteed, but probable.
  4.  **Scope of Duty?** **YES.** Preventing health crises, including overdoses, is a *primary* reason for welfare checks. Overdose is squarely within the foreseeable risks the checks aim to mitigate.
  5.  **Normative Cut-off?** **Judgment Call, but likely YES.** Missing scheduled checks is a core failure of the monitoring system designed *specifically* to prevent such events. Holding the omission causally responsible is reasonable and doesn't open absurd floodgates (it's specific to the established procedure). **VERDICT: Causal Omission.**

  **Case 2: Tenant died during a cold snap; charity never applied for a grant (mentioned in annual report) that *could* have paid for a night warden.**

  1.  **Duty?** **YES (Problematic for you).** Specific duty: Applying for the grant mentioned in the annual report. This was an explicit, documented *commitment* made by the charity to stakeholders (including tenants indirectly). It implies a duty to follow through reasonably.
  2.  **Omission?** **YES.** Evidence: Grant application not submitted, as per records.
  3.  **Factual Cause?** **UNLIKELY / PROBABLY NO.** This requires *multiple* uncertain links:
      *   *If* applied, *would* the grant have been awarded? (Uncertain - depends on competition, application quality, funder priorities).
      *   *If* awarded, *would* it have funded a *night warden specifically*? (Plausible, but depends on grant terms).
      *   *If* a night warden was funded and in place, *would* they have been present *at the right time/location*? (Depends on role, schedule, property size).
      *   *If* present, *would* they have detected *this specific tenant's cold-weather distress* and intervened *successfully*? (Plausible but not certain).
      The chain is long and speculative. Each "if" introduces significant uncertainty. It's *possible*, but not "more probable than not" that the grant application omission *alone* would have prevented *this specific death*. The cold snap and the tenant's vulnerability were significant independent factors.
  4.  **Scope of Duty?** **YES (Conditional on Q3).** *If* a night warden was the intended purpose, preventing harm during vulnerable times (like cold snaps) is within the foreseeable scope of such a role. *But Q3 likely fails.*
  5.  **Normative Cut-off?** **Judgment Call, but likely MOOT (due to Q3 failure) or leaning NO if forced.** Even if Q3 passed, this is the key debate. While failing to follow through on a public commitment is a serious *procedural/organizational failure*, holding this specific omission causally responsible for *this specific death* feels attenuated. The link is indirect and involves too many external variables (grant success, warden effectiveness). It risks opening floodgates (blaming any unfunded project for any future harm it *might* have prevented). The core failure here is breaking a commitment and failing to pursue a safety enhancement, *not* causing this death. **VERDICT: Likely NOT a Causal Omission for this death.** (But a significant organizational failing nonetheless!).

  **You were right on Case 2.** The procedure highlights the commitment failure (Q1 & Q2) but breaks the causal chain at Q3 (Factual Cause) due to the high level of speculation required. The "Normative Cut-off" (Q5) reinforces that attributing *this death* to the grant omission would be unreasonable.

  ---

  **Where the Procedure is Most Vulnerable & When It's the Problem:**

  1.  **Factual Causation (Q3 - "But For"):** This is the **biggest vulnerability.**
      *   **What flips a verdict?** **New, concrete evidence drastically altering probability.** In Case 1: Evidence showing the tenant died *instantly* from an unusually pure/potent batch *before* the first missed check was even due. Verdict flips to "No" on Q3. In Case 2: Concrete evidence the grant was virtually guaranteed for the warden role *and* specific evidence (e.g., warden logs from similar properties) showing wardens *routinely* checked on vulnerable tenants during cold snaps and intervened successfully in similar situations. This *might* push Q3 to "Yes", forcing a tough Q5 call.
      *   **When is it the procedure's fault?** If the committee applies Q3 too rigidly (demanding impossible certainty) or too loosely (accepting "could have" as enough). The procedure relies on reasonable, evidence-based probability – if the committee can't do this well, the output is flawed.

  2.  **Normative Cut-off (Q5):** This is the **inherent seam.**
      *   **What flips a verdict?** **A shift in the committee's collective values or interpretation of the charity's duty.** In Case 1, a committee prioritizing strict resource limits over individual tenant safety *might* argue "We can't guarantee safety, checks aren't foolproof" and vote "No" on Q5, despite Q1-Q4 passing. In Case 2, a committee emphasizing accountability for all promises *might* vote "Yes" on Q5 if Q3 somehow passed, seeing the grant failure as a fundamental breach of trust contributing to an unsafe environment.
      *   **When is it the procedure's fault?** **Never.** Q5 *is* the explicit acknowledgment that causation-by-omission judgments ultimately rest on normative (value-based) decisions about responsibility and fairness. The procedure forces this into the open instead of hiding it behind false objectivity. If this step feels uncomfortable or inconsistent, it reflects the *committee's* challenge in defining its accountability, not a flaw in the process. The procedure *exposes* the "what kind of charity are we?" question precisely where it belongs.

  **Conclusion:** This procedure provides structure to move beyond "could have" debates by focusing on specific duties, actual omissions, and reasonable probabilities. It explicitly marks the judgment calls (Q3 & Q5). Case 1 shows a clear causal omission; Case 2 shows how the procedure limits responsibility when the causal chain is too speculative, even for a serious procedural failure. Its strength is in forcing tough conversations (especially at Q5) and its vulnerability lies in the inherent difficulty of counterfactual reasoning (Q3). Use it to foster focused, honest discussion, not to generate mechanically "correct" answers. The "seam" at Q5 is a feature, not a bug – it's where your charity's values meet reality.
