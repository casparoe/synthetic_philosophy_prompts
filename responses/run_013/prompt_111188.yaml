prompt: |-
  A research group I advise runs two evaluation regimes side by side. Before a high-stakes release, a model must pass a process review: it has to lay out an inspectable reasoning trace, follow a documented procedure, and clear a checklist, and a model that reaches the correct answer by an undocumented shortcut is recorded as failing even though its outputs were sound. In deployment, the same models are graded only on outcomes — task success and the absence of incidents — and nobody reads the traces. After an incident, the review asks whether the procedure was followed, not what harm came of it. What conception of justification does each half presuppose? Does the process gate treat good reasoning as constituted by the documented steps or merely as indicated by them, and does the outcome half treat outcomes as the thing we ultimately care about or only as a proxy for it? Which rival views does each half quietly rule out, and can a single institution hold both at once, or does the process half end up doing the real justificatory work while the outcome half merely supplies the number? Reconstruct what the practice strictly requires, distinguish that from what it merely fits well with, and say where it is underdetermined. Separate what is settled from what is genuinely contested among people who study AI evaluation, and do not present a contested view as the consensus.
reasoning: |-
  Okay, the user is asking about the different conceptions of justification in their research group's two evaluation regimes. Let me start by breaking down each part of their query. 

  First, there's the process review before a high-stakes release. The model has to provide an inspectable reasoning trace, follow documented procedures, and clear a checklist. Even if the model gets the right answer through an undocumented shortcut, it fails. This seems to emphasize the method over the outcome. Then in deployment, the evaluation is solely on outcomes—task success and absence of incidents. The reasoning traces aren't reviewed unless there's an incident, and even then, the focus is on whether procedures were followed, not the harm caused.

  I need to figure out the presupposed conceptions of justification for each half. For the process gate, it's treating good reasoning as constituted by the documented steps. Following the procedure isn't just evidence; it's what makes the reasoning valid. This aligns with deontological ethics, where adherence to rules defines correctness. The outcome half, however, treats outcomes as what we ultimately care about. Success and avoiding incidents are the end goals, making it consequentialist.

  Next, the user wants to know which rival views each half rules out. The process gate rejects views where outcomes justify the means or where internal reasoning isn't transparent. It also dismisses purely statistical evaluations. The outcome half, on the other hand, rules out proceduralism and deontology, focusing only on results regardless of how they were achieved.

  Can both coexist in one institution? The process gate handles justification during pre-release, ensuring reliability and auditability, while the outcome part monitors real-world performance. But there might be tension. If a model passes the process but fails in deployment, the outcome data might prompt procedure updates. Conversely, a model failing process but succeeding in outcomes would still be rejected, showing the process gate's dominance in justification.

  The practice strictly requires documented procedures for release and outcome monitoring post-release. It fits with a hybrid approach but is underdetermined regarding why procedures are trusted and the weight given to outcomes versus process. Settled aspects include the need for process rigor pre-release and outcome tracking. Contested areas involve whether outcomes should influence procedural updates and the balance between process and results in justifying decisions.

  I should ensure I'm not presenting contested views as consensus. For example, whether outcome data should refine procedures is debated. Also, the primacy of process in justification versus a more integrated approach is an open question. Highlighting these distinctions will address the user's request accurately.
answer: |-
  Based on your description, here's a breakdown of the conceptions of justification, their implications, and the tensions within your group's dual-regime evaluation:

  1.  **Process Gate Conception:**
      *   **Presupposed Conception:** **Procedural Justification.** Good reasoning is **constituted by** adherence to the documented steps and the ability to produce an inspectable trace. The process *is* the justification.
      *   **Implied View of Reasoning:** Reasoning is valid only if it demonstrably follows approved, auditable procedures. Internal states (even if correct) are irrelevant without externalized, rule-compliant evidence.
      *   **Quietly Rules Out:**
          *   **Consequentialism in Justification:** The view that a correct outcome justifies the means used to reach it ("the end justifies the means" for reasoning). An undocumented shortcut producing a sound output is explicitly invalid.
          *   **Reliabilism (Pure Outcome Focus):** The view that justification rests solely on the *reliability* of a process in producing true beliefs/outputs, regardless of its internal structure or traceability. The documented procedure is paramount, not just statistical success.
          *   **Black-Box Instrumentalism:** The view that only the input-output behavior matters, and internal reasoning is irrelevant. The trace *is* required and inspected pre-release.
          *   **Mysterianism/Non-Verbalizable Intuition:** The view that valid reasoning can be fundamentally intuitive or non-articulable. The requirement for an inspectable trace rules this out.

  2.  **Outcome Half Conception:**
      *   **Presupposed Conception:** **Consequentialist Justification.** Outcomes (task success, absence of incidents) are **the thing we ultimately care about.** Justification is primarily about achieving the desired results and avoiding harm.
      *   **Implied View of Reasoning:** Reasoning is a *means* to an end (good outcomes). While the process might be a useful *proxy* during development, its ultimate value is determined by its results in the real world.
      *   **Quietly Rules Out:**
          *   **Strict Proceduralism/Deontology in Deployment:** The view that adherence to the procedure is *intrinsically* valuable or obligatory *regardless of outcomes* during operation. Post-release, no one checks the trace; only results matter.
          *   **Intentionalism:** The view that the *intent* or *internal reasoning state* behind an action/output is crucial for its justification. Incidents are assessed by procedure violation, not harmful intent or reasoning quality *per se*.
          *   **Process Fundamentalism:** The view that the documented process is the *only* source of justification, even post-deployment. Outcomes become the primary metric.

  **Can a Single Institution Hold Both?**

  *   **Yes, Pragmatically:** They serve distinct functions.
      *   **Process Gate:** Primarily a **pre-release risk mitigation and accountability mechanism.** It aims to ensure *predictability, auditability, and alignment with defined safety protocols* before high-stakes deployment. It's about minimizing unknown unknowns and establishing a baseline of control.
      *   **Outcome Half:** Primarily a **post-deployment performance and safety monitoring system.** It assesses the *real-world effectiveness and impact* of the deployed model.
  *   **But with Tension & Potential Hierarchy:** The institution *can* hold both, but the relationship is hierarchical in justification:
      *   **Process Gate Does the "Real" Justificatory Work (for Release):** The process gate provides the *authorization for release*. Passing it is a necessary condition for deployment, justified by the need for control, audit trails, and risk reduction. A model failing the process gate is barred *even if* past outcome data suggests it might perform well. The "number" from outcomes (pre-deployment testing?) might inform procedure design but doesn't override the gate.
      *   **Outcome Half Primarily Provides Data (for Iteration & Incident Analysis):** Post-deployment outcomes primarily serve as **feedback**.
          *   *Success* validates the pre-release process (indirectly justifying it).
          *   *Incidents* trigger a specific type of investigation: **Procedural Root Cause Analysis.** The question isn't "How bad was the harm?" but "Was the documented procedure followed?" This reinforces the primacy of the process. If the procedure was followed and harm occurred, it suggests the *procedure itself* needs revision. If not, it suggests non-compliance was the issue. Harm severity might influence *resource allocation* for the investigation but not the *fundamental question asked*.

  **Reconstructing What the Practice Strictly Requires vs. Fits Well With vs. Underdetermined**

  *   **Strictly Requires:**
      *   Pre-release: Adherence to documented procedure, production of inspectable trace, checklist clearance. *Failure* for undocumented shortcuts *regardless of output soundness.*
      *   Post-release: Monitoring of task success and incident occurrence.
      *   Post-incident: Determination of whether the documented procedure was followed.
  *   **Fits Well With (but not strictly required):**
      *   A **hybrid justification theory:** Process constitutes justification pre-release (deontological/procedural), while outcomes constitute the ultimate goal post-release (consequentialist). The post-incident review fits a "blame the process, not the agent" quality/safety management approach.
      *   Viewing the process as a **necessary proxy for reliability/robustness** in high-stakes, novel situations where pure outcome testing might be insufficient.
      *   Viewing outcome monitoring as the **ultimate validation** of the process.
  *   **Underdetermined:**
      *   **Why trust the procedure?** What justifies *this specific documented procedure* as constitutive of good reasoning? Is it based on past outcomes, expert consensus, theoretical guarantees, or regulatory compliance? The practice assumes the procedure is valid but doesn't mandate how *it* is justified.
      *   **The weight of outcome data vs. process adherence.** How strongly should consistently good outcomes *without incidents* challenge the necessity of a failed process gate? The practice strictly requires failing the gate for shortcuts, implicitly ruling out outcome data overriding it pre-release.
      *   **The role of harm severity.** The practice *requires* asking "Was procedure followed?" post-incident but *does not require* asking "How severe was the harm?" or "Could a different procedure have prevented it?". Severity's influence is unspecified.
      *   **The ultimate goal of the outcome monitoring.** Is it *only* to catch failures and trigger process review, or is sustained good performance meant to *justify continued use* independently? The incident review mechanism suggests the former dominates.

  **Settled vs. Contested in AI Evaluation**

  *   **Settled (Broad Consensus):**
      *   Both process-based *and* outcome-based evaluations are necessary components of responsible AI development, especially for high-stakes systems. Neither alone is sufficient.
      *   Interpretability/explainability (traces) is crucial for debugging, auditing, and building trust, particularly pre-deployment.
      *   Measuring real-world performance (outcomes) is essential.
      *   High-stakes deployments require rigorous safety gates.
      *   Root cause analysis after failures is essential.
  *   **Genuinely Contested:**
      *   **The Primacy/Constitution Question:** Is adherence to a *specific documented, inspectable process* *constitutive* of justified reasoning (as your process gate assumes), or is it merely a strong *indicator/proxy* for a deeper property (like robustness or alignment)? Many argue for the proxy view.
      *   **The Role of Shortcuts:** Is failing a model for using a correct but undocumented shortcut always justified? Some argue that if the shortcut is reliable and robust, it *is* good reasoning, and the procedure needs updating. Others (like your gate) argue the lack of auditability and predictability is an inherent flaw.
      *   **Root Cause Focus:** Is focusing *solely* on procedural adherence in incident review sufficient? Many argue that harm severity, systemic factors beyond the immediate procedure, and alternative mitigations should play a larger role (e.g., "Safety Cases" approaches).
      *   **Outcome vs. Process Weighting:** How much should consistently strong real-world outcomes *without incidents* count against a pre-release process failure? Should outcome data ever override a process gate failure if sufficiently compelling? This is highly debated.
      *   **The Nature of "Good Reasoning":** There is no consensus on the fundamental philosophical grounding of what constitutes "good reasoning" in AI, leading to different evaluation priorities.

  **In essence:** Your practice embodies a **strong procedural/deontological conception of justification pre-release**, treating the documented steps as constitutive, and a **consequentialist focus on outcomes post-release**, treating them as the ultimate goal. The process gate provides the authorization (justification for release), while the outcome monitoring provides validation and feedback. The institution *can* hold both, but the process gate holds hierarchical primacy in granting permission to deploy. Outcome data informs iteration but doesn't override the gate. The practice strictly mandates procedural adherence pre-release and procedural root cause post-incident, fitting well with a hybrid view but leaving open fundamental questions about *why* the specific procedure is trusted and the relative weight of outcomes versus process in the overall justification framework, which remain actively contested in AI evaluation.
