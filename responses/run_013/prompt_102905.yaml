prompt: |-
  I write the lives of people who are mostly dead, and I keep meeting a pattern I can describe but cannot name. Two people perform what I can only call the same act — the same intentions, the same conduct, the same effects in the world — and one is remembered as a benefactor while the other is remembered as a cautionary tale. Nothing in the world differs; only the reading differs. A voyage that one generation praises as courage the next condemns as plunder, and the third, with no new facts in hand, praises again. A confidence offered as generosity is received as condescension, and the giver is blamed for a slight she did not intend and could not have foreseen. A disclosure that, had it been believed, would have made its author a hero, and that, being disbelieved, made him a crank.

  I know there is a familiar idea in philosophy to the effect that we hold people answerable for matters outside their control — that the driver who strikes a child is judged more harshly than the one who arrives home, though both drove the same way. That idea I take myself to understand, and it is about what happens. What puzzles me is that in my cases nothing happens. Only the description changes, and it can change again: the same person can be acquitted and condemned and acquitted by the same community across a century, for the same deeds, on the same evidence. Sometimes the shift lies in the audience's moral standards, sometimes in its interests, and sometimes in nothing I can identify at all.

  Does this second thing have a name of its own? Is it a distinct kind of bad luck — luck in what an act is taken to mean, rather than in what it causes — or is it the familiar phenomenon in disguise, with the interpretive setting counted as one more circumstance beyond the agent's control? If it is distinct, I want it defined and marked off from its neighbours: from the luck of outcomes, from the luck of circumstances, from the luck of the character one was born with, and from plain moral disagreement. I want its edges as well: whether being misread in one's own lifetime is the same phenomenon as being reinterpreted after death, and whether a society's changing its mind about an old act is bad luck for the actor at all, or something else entirely. A bare name would not help me; I need the thing drawn precisely enough that I can tell when I am looking at it and when I am looking at something else.
reasoning: |-
  Okay, the user writes biographies of historical figures and keeps encountering a pattern where the same actions are interpreted differently across time, leading to opposite moral judgments. They want to know if there's a specific philosophical concept for this phenomenon.

  First, I recall that moral luck is a concept where people are judged based on factors outside their control. The user mentions this but says their concern is different because in their cases, the outcomes and circumstances are identical—only the interpretation changes. So they need something beyond traditional moral luck.

  The user distinguishes between outcome luck (like the driver example) and their issue, where the interpretation shifts without new facts. They want this phenomenon separated from other types of luck and moral disagreement. 

  I consider terms like "hermeneutic injustice," but that's usually about marginalized groups being misunderstood in their time. The user's examples include posthumous reinterpretation, so that might not fit. "Evaluative luck" comes to mind, but it's not commonly used. Maybe "interpretive moral luck" could work, combining the interpretive element with moral luck. 

  I also think about "historical contingency of judgment" or "moral fortune," but these aren't established terms. The user needs precise boundaries: is being misread during one's life the same as after death? And is societal change in judgment bad luck or something else?

  The key is that the agent's intentions and actions remain constant, but the audience's interpretive framework changes due to shifting values, interests, or hermeneutic resources. This differs from moral disagreement, which is simultaneous, whereas the user's cases involve temporal shifts without new evidence.

  I should define a new term: "hermeneutic moral luck." It captures the luck in how actions are interpreted based on changing societal contexts. This distinguishes it from outcome, circumstantial, and constitutive luck. The boundaries: during life, it's hermeneutic injustice if systemic; posthumously, it's hermeneutic moral luck. The bad luck is in temporal placement relative to interpretive frameworks.

  The user needs clarity to identify when this phenomenon occurs versus others. By outlining the criteria—identical facts, shifting interpretations due to time, moral judgment reversal—they can apply this to their historical figures accurately.
answer: |-
  Your phenomenon isn't merely a subset of traditional moral luck; it's a distinct conceptual beast requiring its own name. The closest established term is **"hermeneutic injustice"** (coined by Miranda Fricker), but it doesn't fit perfectly. Let's dissect it and define a precise concept:

  1.  **The Core Phenomenon:** **Interpretive Moral Luck** (or **Hermeneutic Moral Luck**).
      *   **Definition:** The luck inherent in the *interpretive framework* (hermeneutic lens) through which an agent's *identical intentions and actions* are evaluated by an audience, where shifts in this framework across time or context lead to radically different moral judgments *without any change in the factual record of the act or its immediate outcomes*.
      *   **Key Distinction:** Unlike outcome luck (judgment based on consequences), circumstantial luck (judgment based on situations faced), or constitutive luck (judgment based on character traits), interpretive moral luck concerns *how the meaning of the act itself is constructed* by the evaluating community.

  2.  **Distinguishing Features & Boundaries:**
      *   **vs. Outcome Luck:** The *physical consequences* of the act are identical or irrelevant to the judgment shift (e.g., the disclosure is disbelieved vs. believed, but the *act of disclosure itself* is the same; the voyage's material outcome is fixed, but its *meaning* changes). Bad luck lies in *how the act was read*, not what it physically caused.
      *   **vs. Circumstantial Luck:** The agent isn't judged differently based on *what situation they encountered* (e.g., encountering a child vs. not), but on *how the meaning of the action they took* is interpreted *given the same circumstances*. The "circumstance" here is the *hermeneutic environment*.
      *   **vs. Constitutive Luck:** The judgment shift isn't based on luck in the agent's character traits, but on luck in how the *meaning* of their *actions* (driven by those traits) is interpreted. The traits are constant; the interpretation of the actions flowing from them changes.
      *   **vs. Plain Moral Disagreement:** This isn't a simultaneous disagreement between contemporaries (e.g., some calling it courage, others plunder *now*). It's a *diachronic* shift: the *same community* (or its intellectual descendants) changes its collective mind *over time* about the *meaning* of the *same act* on the *same evidence*. The shift is temporal and contingent on evolving hermeneutic resources/values.
      *   **vs. Hermeneutic Injustice (Fricker):** Fricker's concept focuses on *structural, identity-based* disadvantages *during the agent's lifetime* that prevent them from being understood *at all* or force their experience into harmful categories. Your phenomenon is broader:
          *   It can happen posthumously.
          *   The shift isn't necessarily tied to the agent's social identity (though it can be).
          *   The "injustice" is less about *structural silencing* and more about the *contingency of historical meaning-making*. It's the *luck* of whether your act lands in a hermeneutic environment that constructs its meaning favorably or unfavorably.

  3.  **Edges & Nuances:**
      *   **Lifetime Misreading vs. Posthumous Reinterpretation:**
          *   **Lifetime:** Being misread in one's own time *can* be a form of interpretive moral luck *if* the misreading is contingent on the specific, historically-bound hermeneutic limitations of the audience *and* the agent couldn't reasonably overcome them. It overlaps with hermeneutic injustice if systemic prejudice is involved, but can occur without it (e.g., simply being "ahead of one's time").
          *   **Posthumous:** Reinterpretation after death is the *purest* form of interpretive moral luck. The agent is utterly powerless; their fate rests entirely on the contingent evolution of meanings and values in a society they no longer inhabit. This is distinct from lifetime luck.
      *   **Is it "Bad Luck" for the Actor?**
          *   **Lifetime:** Yes, profoundly. Misreading affects reputation, relationships, opportunities, and psychological well-being *now*. It's bad luck in the hermeneutic environment they inhabited.
          *   **Posthumous:** Not directly for the *actor* (they are dead). However, it *is* bad (or good) luck *for their legacy* and historical significance. The "bad luck" pertains to the enduring meaning and moral valuation of their life's work. It's luck in the *historical trajectory of interpretation*. Whether we call this "bad luck *for the actor*" is semantic; it's undeniably luck concerning *how their identity and actions are remembered and judged*.
      *   **Cause of Shift:** The shift can stem from:
          *   **Moral Standards:** Changing values (e.g., colonialism seen as heroic then, genocidal now).
          *   **Interests:** Shifts in power, resources, or national narratives reframing past acts.
          *   **Hermeneutic Resources:** Development of new conceptual tools (e.g., psychoanalysis, critical race theory, postcolonial studies) providing new lenses.
          *   **Contingent Recontextualization:** Seemingly random shifts in cultural focus or the emergence of new information *about other things* that casts the act in a new light, without new facts *about the act itself*.

  4.  **Identifying Interpretive Moral Luck:**
      You are looking at **Interpretive Moral Luck** when:
      *   **Identical Core:** The agent's *intentions, conduct, and the immediate, objective facts of the act* remain constant across judgments.
      *   **Radical Moral Shift:** The act receives *opposing moral valuations* (benefactor vs. monster, courageous vs. reckless, generous vs. condescending).
      *   **Diachronic Shift:** The shift occurs *over time* within the same cultural lineage or community.
      *   **Interpretive Cause:** The shift is demonstrably caused by a change in the *interpretive framework, values, or hermeneutic resources* of the audience, *not* by the discovery of new factual evidence about the act itself or its direct, intended consequences.
      *   **Contingency:** The shift feels contingent – it could plausibly have been otherwise if the timing or cultural context were different.

  **In summary:** The phenomenon you describe is **Interpretive Moral Luck (or Hermeneutic Moral Luck)**. It is the luck an agent (or their legacy) experiences concerning *how the meaning of their fixed intentions and actions is constructed* by the evaluating audience, where shifts in the audience's hermeneutic framework over time lead to radically different moral judgments without any change in the factual record of the act itself. It is distinct from other forms of luck and moral disagreement due to its focus on the *diachronic contingency of meaning-making*. Its edges involve the distinction between lifetime misreading (potentially overlapping with hermeneutic injustice) and pure posthumous reinterpretation, with "bad luck" applying directly to the living agent and to the legacy of the dead. You identify it by the stability of the act's core facts against the backdrop of a shifting interpretive landscape causing moral judgment reversals.
