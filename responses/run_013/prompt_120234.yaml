answer: |-
  Here’s your Q&A prep sheet, structured by threat level, with replies and weaknesses noted. Expect rapid-fire objections—this audience will come armed.

  ---

  ### **Tier 1: Existential Objections (Must Answer Perfectly)**  
  **1. Economist: "This is textbook Pascal’s Mugging. Your math says we should fund *any* cause with tiny credence and vast scale—like mitigating asteroid risks or plant suffering. Why isn’t this irrational?"**  
     *Reply:* "Because we’re restricting the domain to *plausibly sentient* entities under current science. Insects have nociceptors, opioid receptors, and pain-avoidance learning—unlike plants or rocks. We’re not opening the door to infinity; we’re focusing where biological analogy to known sentience exists. The threshold is tractability: insect welfare interventions *could* be feasible if sentience is confirmed, unlike asteroids."  
     *Weakness:* "Plausibly sentient" is fuzzy. Economists may retort that bivalves or nematodes meet your criteria.  

  **2. Neurobiologist: "You’re conflating nociception with suffering. My lab’s work shows insects lack the neural integration for subjective experience. This is like worrying about a thermostat’s ‘pain’."**  
     *Reply:* "Respectfully, we lack consensus on the *minimal* neural architecture for subjective states. Bees show cognitive flexibility and long-term aversion after injury—behaviors irreducible to reflex. We’re not asserting sentience; we’re saying the evidence gap justifies targeted research before dismissing it. Your own 2021 paper called for more work on descending modulation in arthropods."  
     *Weakness:* They may double down on "category error," citing cortex-centric models. Hard to refute without conceding ground.  

  **3. Farm-Animal Colleague: "This diverts funds from proven vertebrate suffering. If we fund this, donors will see us as unserious—or worse, anti-science."**  
     *Reply:* "A 10-20% allocation isn’t abandonment; it’s insurance against potentially catastrophic oversight. If insects *are* sentient, our neglect causes orders of magnitude more suffering than we currently prevent. Reputational risk? Leading foundations (e.g., EA Funds) already fund this work credibly."  
     *Weakness:* "Insurance" framing may not sway someone prioritizing immediate impact.  

  ---

  ### **Tier 2: Technical/Objection (High Damage if Fumbled)**  
  **4. Economist: "Your ‘stopping rule’ is arbitrary risk aversion. If your expected value math holds, why not fund interventions *now*? Delaying is inconsistent."**  
     *Reply:* "With credence intervals spanning orders of magnitude (0.1% to 10%), direct interventions could be 100x less effective than we think. Research-first isn’t delay—it’s ensuring we don’t burn resources on false positives. The stopping rule kicks in when evidence tightens the interval enough to prioritize cost-effectiveness."  
     *Weakness:* They’ll smell epistemic timidity. Cite a *specific* threshold (e.g., "When P(sentience) confidence interval narrows to ±0.5 log-units").  

  **5. Grant-Maker: "Why allocate fixed % *before* research? What if year-one evidence shows P(sentience) << 0.01%?"**  
     *Reply:* "The fixed share ensures we invest enough to *get* meaningful evidence. A tiny pilot won’t resolve uncertainty. If year-one strongly disproves sentience, we reallocate year two—but we must fund the work to know."  
     *Weakness:* Sounds like moving goalposts. Stress that the % is a *ceiling*, not a floor.  

  ---

  ### **Tier 3: Hostile but Manageable**  
  **6. Neurobiologist: "You’re asking us to price ‘credence.’ Science doesn’t work that way. Either there’s evidence or there isn’t."**  
     *Reply:* "Grant decisions *always* weigh probabilities under uncertainty—e.g., funding Alzheimer’s research despite 90% drug failure rates. We’re transparent that this is prioritization under ignorance, not pseudoscience."  
     *Weakness:* May alienate if they feel you’re commodifying their field.  

  **7. Economist: "Even at your 1% credence, insect lives are so cheap that direct aid (e.g., reducing insecticide use) beats research. Prove otherwise."**  
     *Reply:* "With current ignorance, ‘direct aid’ may be futile or harmful. Does replacing neonicotinoids with pyrethroids reduce suffering? We lack metrics to even ask that. Research must precede action."  
     *Weakness:* They’ll demand cost-effectiveness estimates you can’t provide.  

  ---

  ### **Strategic Concessions (First 5 Minutes)**  
  To buy credibility:  
  - **"I agree the scale argument can’t be actioned literally—it’s why I reject straight expected-value maximization."**  
  - **"Vertebrates remain our core moral priority until insect sentience is proven."**  
  - **"If year-one research shows P(sentience) << 0.1%, we cut the allocation."**  

  ---

  ### **The Must-Land Reply**  
  **When Pascal’s Mugging is raised (Objection #1):**  
  Your reply *must* reframe the debate:  
  *"This isn’t about embracing infinitesimal probabilities—it’s about avoiding a potential moral blind spot. We’re not gambling on asteroids; we’re investigating whether we’ve underestimated a *known* suffering vector by 5 orders of magnitude. Dismissing it uncritically is the real gamble."*  
  **→ If this fails, the proposal dies.**  

  ---

  ### **The Nightmare Question (Pray It Goes Unasked)**  
  **"If we accept your two-stage rule, why stop at insects? Why not allocate 5% to bivalve sentience research, 3% to nematodes, etc.? Doesn’t your logic demand we fragment the budget?"**  
  *Why it’s fatal:* It exposes the arbitrariness of your threshold. Insects are your "least implausible" gateway, but conceding this invites infinite regress.  
  *Soft Reply:* "We start with insects because they’re the most studied invertebrates with evidence of pain-like states. But yes—if research shows bivalves have similar evidence, we reassess."  
  *Reality:* This sounds like a slippery slope because it is.  

  ---

  ### Summary  
  - **Concede early:** Scale ≠ actionability; vertebrates still priority.  
  - **Save the proposal:** Neutralize Pascal’s Mugging by stressing tractability and biological plausibility.  
  - **Dreaded question:** On fragmentation—have a clear "insects-first" rationale ready, but know it’s vulnerable.  

  **Final Tip:** When economists cite "mugging," agree it’s a valid concern—then pivot to *your* constraints (biological plausibility, tractability). For neurobiologists, cite their own field’s open questions (e.g., Birch on criteria for invertebrate sentience). Good luck.
