  The homeostatic property cluster (HPC) concept from philosophy of biology could be useful here. It explains how species share overlapping traits without a single essence, maintained by underlying mechanisms. Applying this to politics: left/right as a cluster of positions held together by social/causal factors like institutions or polarization.

  But why did it fizzle out in discussions? Maybe because HPC is meta and doesn't resolve practical disagreements. Realists might say it validates the axis; skeptics might argue the cluster is too unstable. The user needs a way to move beyond this stalemate.

