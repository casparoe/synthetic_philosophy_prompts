  ## Persistence Mutual: Frame Problem Mitigation Coverage  
  **Customer Service Bulletin #DPS-7 (Rev. 09)**

  **1. What is the Frame Problem, and why do I need Persistence Mutual?**  
  The Frame Problem describes the inherent difficulty in efficiently determining which aspects of a complex environment remain unchanged following an action. Persistence Mutual offers contractual certainty. By establishing your **Declared Persistence Schedule (DPS)**, you explicitly catalogue those household fluents (facts about your environment) guaranteed to persist after any covered action. This eliminates costly computational ambiguity through binding declaration. Failure to maintain a current DPS exposes you to potentially unlimited ontological liability.

  **2. What does the Standard Coverage Tier (Frame Problem Mitigation) include?**  
  Our Standard Tier protects against unforeseen persistence *failures* impacting your declared fluents. If an action covered under your policy (e.g., "Moving Chair from Location A to Location B") results in an *unexpected change* to a fluent explicitly listed in your DPS (e.g., "Floorboard Integrity at Location A remains ≥ 98%"), we initiate remediation.  
  *   **Remedy:** Policyholder submits Form FP-44 "Persistence Anomaly Report" detailing the unexpected change. Persistence Mutual audits the DPS and action log. If the change violated the DPS guarantee *and* the action was listed in Schedule 3A (Permitted Actions), we compensate for direct costs incurred restoring the fluent to its pre-action state, minus deductible.  
  *   **Key Limitation:** Coverage *only* applies to fluents explicitly listed and described in your active DPS. Unlisted fluents are presumed volatile; changes are uninsured. See Rider G-12 ("Closed-World Assumption Endorsement").  
  *   **Premium:** $0.25 per fluent per month (minimum 50 fluents). Declared actions: $2.00 per unique verb/object pair per month.

  **3. What does Enhanced Coverage (Qualification Problem Shield) add?**  
  The Qualification Problem addresses the open-ended set of potential preconditions that could prevent an action from achieving its intended outcome. Enhanced Coverage protects against unforeseen obstacles invalidating a declared action's effect on a declared fluent.  
  *   **Example Scenario:** Your DPS lists "Vase remains Fragile" and you schedule the action "Walk from Kitchen to Living Room." An unreported "Pet Cat (Felix) exhibits Sudden Sprint Behavior" precondition causes an unintended fluent change ("Vase Fragility status: False").  
  *   **Remedy:** Policyholder submits Form QP-19 "Precondition Failure Manifest" listing *all* potential preconditions *not* explicitly excluded in DPS Schedule 2 (Known Hazard Exclusions). Persistence Mutual assesses if the manifest adequately anticipated the failure mode. If validated, we cover costs related to the unexpected outcome (e.g., vase replacement).  
  *   **Key Limitation:** Coverage void if the failure precondition was reasonably foreseeable but omitted from Schedule 2. Burden of exhaustive hazard declaration rests with the policyholder. "Known Unknowns" require quarterly supplemental filings (Fee: $75/filing).  
  *   **Premium:** +$0.15 per fluent per month. +$5.00 per declared action per month. Hazard Exclusion listing: $1.00 per exclusion per month.

  **4. What is Premier Coverage (Ramification Consequence Management)?**  
  The Ramification Problem concerns indirect, cascading consequences of an action beyond its immediate effect. Premier Coverage addresses unintended changes to *other declared fluents* triggered by a covered action achieving its *intended* effect on a *target* fluent.  
  *   **Example Scenario:** DPS lists "Chair Location = Dining Room" and "Dining Room Airflow Rate = 15 CFM". Action "Move Chair to Living Room" succeeds (intended fluent change: "Chair Location = Living Room"). However, this indirectly causes "Dining Room Airflow Rate = 17 CFM" (due to reduced obstruction), damaging a sensitive houseplant reliant on 15 CFM.  
  *   **Remedy:** Policyholder submits Form RC-87 "Causal Chain Analysis" demonstrating the causal link between the covered action's success and the unintended fluent change. Persistence Mutual verifies the chain's validity against the DPS's stated causal axioms (Schedule 4). If verified, covers restoration costs for the impacted secondary fluent.  
  *   **Key Limitation:** Coverage applies *only* to ramification chains explicitly mapped within the causal axioms of Schedule 4. Discovering a novel causal pathway requires a DPS amendment (Amendment Fee: $150 + reassessment premium). Unlimited ramification coverage requires the "Omniscient Observer Rider" (Contact Underwriting; availability limited).  
  *   **Premium:** +$0.35 per fluent per month. +$10.00 per declared action per month. Causal axiom declaration: $5.00 per axiom per month.

  **5. Why was my claim denied when moving my chair damaged the floor?**  
  Claim #20245-67 ("Unreported Floorboard Integrity Diminution post Chair Movement Action K-12") was denied per Section 4.1.7 of your policy. Your DPS listed "Chair Weight = 5kg" and "Floorboard Max Load = 10kg". However, your "Static Furnishing Endorsement" (Rider SFE-3) required *all* objects exerting static load to be listed in Schedule 5 ("Permanently Load-Bearing Fluents"). The chair was not listed. Its weight was therefore not factored into the persistence guarantee of the floorboard load fluent at its location *prior* to movement. Damage resulted from exceeding the *static* load threshold during occupancy prior to the action – a non-covered precondition. Maintain your Schedules diligently.

  **6. Why wasn't my spilled coffee covered under Qualification Shield?**  
  Claim #20245-89 ("Liquid Dispersion Event during Walk Action L-7") invoked Enhanced Coverage. The claimed precondition failure was "Unexpected Canine Trajectory." However, your Schedule 2 (Known Hazard Exclusions) listed only "Feline Organisms (Domestic Shorthair)." You failed to declare the canine fluent ("Canis lupus familiaris present: True") in your core DPS *or* list it as a hazard in Schedule 2. Canine presence constitutes an undeclared variable, nullifying the Qualification Shield for that action path. Remember: Undeclared entities are ontological exclusions. Please review the "Sleeping-Dog Proviso" (Standard Policy Clause 8.3) regarding undeclared persistent entities.

  **7. How much does maintaining a compliant DPS cost?**  
  Costs reflect the granularity of certainty required. A basic 50-fluent Standard Tier DPS with 10 declared actions starts at **$27.50/month** ($12.50 fluents + $20.00 actions). Adding Enhanced Tier for 50 fluents/10 actions is +$20.50/month. Adding Premier Tier is +$32.50/month. Hazard exclusions, causal axioms, and specialized riders add cost. Most households require continual amendments ($75-$150 each). As our spokesperson, Arthur Vance (VP, Ontological Risk) states: "Precision in persistence declaration is the bedrock of predictable domestic continuity. Persistence Mutual transforms infinite uncertainty into manageable monthly premiums." File amendments promptly. Incompleteness is exposure.
