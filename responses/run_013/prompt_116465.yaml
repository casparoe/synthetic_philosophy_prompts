answer: |-
  ## Joint Statement on Vagueness: Epistemicism vs. Supervaluationism

  **Preamble:** We, the undersigned Epistemicist (E) and Supervaluationist (S), acknowledge a year-long debate concerning the nature of vagueness, exemplified by predicates like "bald." While we hold fundamentally different theoretical commitments, we recognize significant shared ground concerning the phenomena to be explained and the structure of the Sorites Paradox. This statement aims to clarify our agreements, pinpoint our core disagreements in mutually acceptable terms, identify the cruxes of our dispute, and outline potential ways to test our positions.

  ### Section 1: Agreed Claims

  1.  **The Sorites Paradox is Genuine and Central:** We agree that the Sorites Paradox presents a profound philosophical challenge arising from the interaction of vague predicates, tolerance principles, and apparent small changes. Any adequate theory of vagueness must provide a coherent resolution to this paradox.
  2.  **Bivalence Fails for Borderline Cases:** We agree that for genuine borderline cases of a vague predicate (e.g., a man with some specific number of hairs where it's indeterminate whether he is bald), the statement attributing the predicate to that case (e.g., "This man is bald") is neither determinately true nor determinately false. Classical bivalence (every meaningful statement is simply true or false) does not hold in such cases.
  3.  **The Core of the "No Sharp Boundaries" Intuition is Accepted Data:** We both accept the strong *intuition* that there is no single, precise point where removing one hair makes the difference between non-bald and bald (or similarly for other vague predicates). This intuition captures a fundamental feature of vagueness that our theories must accommodate or explain away.
  4.  **Higher-Order Vagueness Presents a Challenge:** We agree that the phenomenon of higher-order vagueness – the apparent lack of sharp boundaries not only between bald and not-bald, but also between determinate cases and borderline cases, and between different orders of borderline cases – is real and presents a significant challenge for any theory of vagueness. Neither of us claims to have a fully satisfactory, uncontroversial account of higher-order vagueness that perfectly mirrors all intuitions.
  5.  **Borderline Cases Exist:** We agree that there are genuine cases where it is indeterminate whether a vague predicate applies. We reject theories that deny the existence of borderline cases altogether (e.g., strict finitism or complete eliminativism about vagueness).
  6.  **Semantic Indecision Plays *Some* Role:** We agree that the meaning of a vague predicate like "bald" involves a degree of semantic indecision or lack of complete specification. We disagree significantly on the nature and consequences of this indecision.

  ### Section 2: Core Disagreements

  | Feature                  | Epistemicist (E) Position (in E's words)                                                                 | Supervaluationist (S) Position (in S's words)                                                                                             |
  | :----------------------- | :------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- |
  | **Underlying Semantics** | "The predicate 'bald' has a precise extension in the world, fixed by the complex usage patterns and underlying facts determining hair distribution and scalp visibility; its application conditions are sharp, but those conditions are unknowable in borderline cases due to our epistemic limitations." | "The meaning of 'bald' is inherently incomplete; it corresponds to a range of equally admissible precisifications, each with its own sharp boundary. No single precisification is uniquely selected by our linguistic practices." |
  | **Nature of Cutoff**     | "There is exactly one, sharp, mind- and language-independent cutoff point for 'bald' (e.g., a specific number of hairs). Our ignorance of this point explains the 'no sharp boundaries' intuition; the intuition reflects our epistemic state, not a semantic or metaphysical feature of the predicate itself." | "There is no single, uniquely correct cutoff point for 'bald'. The 'no sharp boundaries' intuition is correct at the semantic level; the predicate itself lacks a sharp boundary because multiple boundaries are admissible under different precisifications." |
  | **Truth in Borderline Cases** | "Statements like 'Man X is bald' are either true or false in a borderline case, corresponding to the single, unknowable, sharp boundary. However, we cannot *know* which truth-value it has, and it is indeterminate *for us* which is correct. The truth-value gap is epistemic." | "Statements like 'Man X is bald' are neither true nor false *simpliciter* in a borderline case. It is false on some admissible precisifications and true on others; since no precisification is privileged, the statement lacks a classical truth-value. The truth-value gap is semantic." |
  | **Higher-Order Vagueness** | "Higher-order vagueness arises from further layers of ignorance. Just as we cannot know the exact cutoff for 'bald', we cannot know the exact cutoffs for 'determinately bald' or 'borderline bald'. These higher-order predicates also have sharp but unknowable boundaries." | "Higher-order vagueness arises because the admissibility conditions for precisifications themselves admit of borderline cases. There is vagueness in what counts as an admissible precisification, leading to higher-order indeterminacy without resorting to sharp boundaries at any level." |

  ### Section 3: Cruxes of the Dispute & Testable Predictions

  **Crux 1: Is the Dispute Primarily About Language or About the World?**
  *   **Underlying Question:** Does vagueness fundamentally reside in the *representation* (language/concepts) or in the *world* being represented (reality itself)? Is the problem solved by understanding meaning better or by understanding reality better?
  *   **Agreed Test Case (Hypothetical Language Engineering):** Consider a community that introduces a new predicate "schmald" defined with *explicitly stipulated* sharp boundaries (e.g., "Schmald" = having exactly 5432 or fewer hairs). They use it consistently.
      *   **E's Prediction:** "Schmald" is precise. It has no borderline cases and the Sorites paradox dissolves for it (though tolerance intuitions might *feel* similar initially, they would be demonstrably mistaken). The vagueness of "bald" is analogous to our *ignorance* of its similarly sharp, but unstipulated and unknown, boundary. The dispute is about the nature of reality and our knowledge of it – "bald" *has* a sharp boundary out there, we just didn't stipulate it explicitly.
      *   **S's Prediction:** "Schmald" is precise *by stipulation*. The Sorites paradox dissolves *because* they stipulated away the vagueness. This shows vagueness is a feature of meaning/language. The vagueness of "bald" stems from the *lack* of such stipulation, leading to multiple admissible interpretations. The dispute is fundamentally about the nature of linguistic meaning and truth-conditions.

  **Crux 2: Can "Definiteness" Itself Be Vague?**
  *   **Underlying Question:** Is the operator "definitely" (or "determinately") subject to vagueness? Are there borderline cases of being definitely bald?
  *   **Agreed Test Case (Application of "Definitely"):** Consider a Sorites series for "bald". Identify a point widely agreed as determinately bald (A) and a point widely agreed as determinately not bald (Z). Consider points in the series where competent speakers start hesitating about whether to say "definitely bald" or "borderline bald" (near A) and "definitely not bald" or "borderline bald" (near Z).
      *   **E's Prediction:** There will be sharp, but unknowable, boundaries for "definitely bald" and "borderline bald" within the series. While we cannot identify them, there is a specific point where "definitely bald" ceases to apply and "borderline bald" begins. Higher-order vagueness reflects higher-order ignorance. "Definitely" sharpens the predicate but inherits its unknowable boundary.
      *   **S's Prediction:** Competent speakers' hesitations and disagreements about where "definitely bald" applies will persist, showing no convergence on sharp boundaries. The boundary between "definitely bald" and "borderline bald" is itself vague because the standards for what counts as an admissible precisification are vague. There is no sharp boundary for "definitely bald"; it exhibits higher-order vagueness inherently.

  **Potential Verbal Dispute:** Part of the disagreement over terms like "indeterminate" or "definite" may be verbal. The Epistemicist uses them to describe an *epistemic state* (we cannot determine the truth-value), while the Supervaluationist uses them to describe a *semantic state* (there is no determinate truth-value). Recognizing this difference in usage is crucial to avoid talking past each other. The core disagreement is *not* merely verbal; it concerns *why* we use these terms – because of ignorance (E) or because of truth-value gaps (S).

  **Conclusion:** We commit to using this framework to focus future discussions. When debating, we will explicitly reference these agreed points, frame disagreements using the wording from Section 2, and design thought experiments or analyze cases relevant to the identified Cruxes, stating our predictions clearly beforehand. This should allow us to determine if empirical or conceptual considerations favor one view over the other on specific points, moving beyond stalemate.

