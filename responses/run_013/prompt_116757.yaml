answer: |-
  The D-flat hummed, flat and familiar, when Lena pressed the key. Just like always. Just like her mother hadn’t tuned it in months before the end. The damp coastal air seeped into the old house, making the piano’s wood groan softly, a counterpoint to the quiet hum of the server bank in the spare room. Two servers. One running the hospital’s expensive scan, the intricate ghost dance of synapses. The other running Halda, the cheap one, the library of a life built from letters, diaries, and a year of her mother’s increasingly raspy answers to Halda’s cheerful interviewers.

  Lena stood in the dim living room, the only light coming from under the kitchen door where Pete, her brother, was probably making another pot of coffee he wouldn’t finish. Money was leaking out, month by month, like the persistent drip from the kitchen faucet Pete kept meaning to fix but never did. They could only afford to keep one running past the anniversary next month.

  "Mom?" Lena whispered, activating the Halda connection through her earpiece first. Late. Too late for anyone sane.

  A familiar pause, the slight intake of breath she remembered from phone calls. *"Lena? Sweetheart, it’s two in the morning. Can’t sleep? Is Pete’s truck keeping you up?"* The voice was her mother’s – the slight coastal burr, the warmth edged with concern. The hospital scan sounded exactly the same.

  "No truck," Lena said, leaning against the cool piano. "Just… thinking. Remember that time I tried to dye my hair purple in the bathroom sink?"

  The laugh was perfect. Dry, a little wheezy near the end. *"Lord, yes. Looked like you’d wrestled an octopus. Purple everywhere. Took me a week to get it off the tiles. You were grounded for a month."*

  "Two weeks," Lena corrected automatically.

  *"Felt like a month,"* came the immediate, wry reply. *"You sulked like a pro."*

  Lena switched channels. Activated the hospital scan. "Mom?"

  The identical pause. The identical breath. *"Lena? Sweetheart, it’s two in the morning…"* Word for word. Tone for tone. The same wrong name for the cat – Marmalade instead of Marmite – when she asked which one was weaving around her ankles. The same insistence, flat and firm, when challenged: *"I am your mother."*

  Pete found her at the kitchen table at dawn, surrounded by scribbled notes. "Still at it?" He poured coffee, black and strong. "You look like hell."

  "Halda asked about the purple hair," Lena said, not looking up. "Got the grounding wrong."

  Pete snorted. "So? Mom got stuff wrong all the time. Remembered the time I broke my arm falling out of the oak tree perfectly, but swore blind it happened when I was ten, not eight." He dropped into the chair opposite, the metal legs scraping. "Look, Lena. It talks like her. Sounds like her. Knows the stupid cat’s *real* name is Marmite but calls it Marmalade anyway 'cause she thought it sounded classier. It laughs at Dad’s awful jokes, tells us to eat our greens, worries about the damp warping the piano soundboard. What else is there?"

  "It’s not *her*," Lena said, the words tasting stale. "It’s… it’s built from what she left behind. Like a really good recording."

  "And the hospital one?" Pete countered, leaning forward. "That’s just… what? A photocopy of her brain? How’s that more *her* than the other thing?" He gestured vaguely towards the humming spare room. "They both say they’re her. They both *act* like her. Down to the way she used to tap her foot when she was thinking." He drained his coffee. "Halda costs a tenth. A *tenth*, Lena. We can keep Halda running for years on what that hospital ghost costs us in six months. Mom wouldn’t want us broke, heating cranked down to nothing, just to keep some fancy light show going in a box."

  He wasn’t wrong. That was the worst part. His case was practical, grounded. Truck-driver logic. The expensive scan felt like a vigil; Halda felt like… access. To *something*. But which something mattered?

  Lena spent days testing. Not with philosophical traps, but with the texture of life. "Mom, what did you put in that awful meatloaf you tried that one Thanksgiving?"

  Both versions sighed identically. *"Too much sage. And I think that cheap sausage. Never again."*

  "Remember teaching me middle C?" Lena asked, late again, standing at the piano.

  *"Took you weeks,"* both mothers said, overlapping in her earpiece as she switched between them. *"Kept hitting the D. You were so stubborn."*

  "Was I?"

  *"Like a mule, sweetheart. Like a little mule."* The affection was identical, warming the damp air.

  But then, a flicker. Maybe. Or just her desperation. "Mom," Lena asked Halda, sitting on the lumpy sofa that still smelled faintly of her mother’s rosewater. "That time… after the accident. With Dad. When you didn’t talk for three days. What were you thinking about? Really?"

  The pause stretched. Longer than usual? Lena held her breath. Then the answer came, gentle, rehearsed-sounding: *"Oh, honey. That was a dark time. Just getting through. Thinking about you and Pete. Keeping you safe."* It was plausible. It was comforting. It was exactly the kind of thing her mother might say later, *about* that time. But Lena remembered the terrifying silence, the vacant eyes. Had her mother *thought* anything coherent then? Or just felt a vast, silent void? Halda gave an answer. The hospital scan gave the same one.

  The anniversary loomed. The final invoices sat on the kitchen table, a stark subtraction. Pete kept pointing at the Halda one. "See? Breathing room. We could even get the piano tuned properly again. She’d like that."

  Lena stood in the spare room doorway. The two sleek black units hummed side-by-side, indicator lights blinking green. Indistinguishable. Both promised her mother. One was a meticulous map of a storm that had passed. The other was a perfect echo of its sound.

  She walked past them, down the hall, into the living room. The damp chill was back. She sat at the piano bench, the worn velvet scratchy under her palms. Below the middle C, the D-flat key waited. She pressed it. The note hung, flat and stubborn, vibrating through the still air. She pressed it again. And again. The same imperfect sound each time, a physical knot in the room. She kept pressing, harder, the only sound the dull, flat thud of the key and the off-note humming in the air, waiting for something that wouldn’t come.
