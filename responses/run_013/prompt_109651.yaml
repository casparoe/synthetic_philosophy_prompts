prompt: |-
  My friend and I spent like three hours arguing at a bar last night about whether a thought can actually be about anything, and I still can't tell if he's right or just very convincing after two beers. His line is that teleosemantics has basically won: a mental state gets its content from what it was selected to do in evolution, from its biological function, so the meaning of any state in my head is fixed by the ancestral situation it was supposed to help me handle. Fine so far. But then he pushes it. He says that means I literally cannot have a concept of anything that didn't exist in the Pleistocene. No internet, no smartphones, no electrons, no mortgages, no DNA as a concept. Those words are just noises I make. When I said I'm obviously thinking about my phone right now, he said that's not a thought about a phone, that's an old stone-age urge wearing a phone costume. He thinks it's also why a language model can't mean anything by the word cat, which I half buy but for totally different reasons.

  Then he went further and it got weirder. He says newborn babies have no thoughts with any content at all, because nothing in them has been selected for yet, and he says the same about a person who pops into existence out of nowhere fully formed — he had a name for this, swampman or something — no content, no thoughts about anything ever, because there's no history. I said that sounds insane and he said the alternative is magic. He also kept bringing up something he called the disjunction problem like it was a trump card, and I definately didn't follow that part.

  So here's what I want to know. If teleosemantics really does mean that every concept I have is stuck in the stone age, and that everything I've thought since is just old machinery getting triggered by new triggers, doesn't that just refute the whole theory? Evolution is slow and the world changes fast, so a theory of meaning that says I can't think about the internet seems self-evidently dead. But he acts like everyone who knows the literature agrees with him, so now I don't know whether I'm supposed to conclude that naturalistic theories of content are a dead end or that I've missed something about what the theory actually says. Can you tell me which it is? And please don't just hand me a reading list, I'm not going to read Millikan, I just want to understand the shape of the thing.
reasoning: |-
  Okay, let me unpack this bar argument about teleosemantics. The user's friend made some extreme claims: that we can't genuinely think about modern concepts, babies have no meaningful thoughts, and even a spontaneously created human ("swampman") would lack real thoughts. The user finds this intuitively absurd and wonders if it refutes teleosemantics entirely.

  First, I need to reconstruct the friend's argument accurately. Teleosemantics indeed grounds meaning in evolutionary function - for example, a frog's neural state might "mean" fly because it was selected for catching flies. The friend is taking this rigidly: if a state wasn't selected for representing smartphones, then any "smartphone thought" is just misfiring Pleistocene wiring. 

  The disjunction problem the friend mentioned is key here. It's a classic critique: if a frog eats a small black thing (be it a fly or a pebble), does its neural state mean "fly" (intended function) or "fly-or-pebble" (actual triggers)? Teleosemanticists like Millikan address this by prioritizing historical function over current triggers. But the friend is stretching this to mean our thoughts can never "latch onto" new objects - which feels like an overextension.

  Where the friend goes wrong, I think, is conflating two things: (1) the origin of content (evolutionary) vs. (2) its current applicability. Teleosemantics explains how representational capacities arose, not their limits. Just because color vision evolved for fruit selection doesn't mean we can't "really" see modern paintings. Similarly, our conceptual tools can be repurposed - "screen-tapping" borrows from ancestral "object-manipulation" circuits, but that doesn't make smartphone use illusory.

  The baby/swampman case is trickier. Strict teleosemantics does imply that without evolutionary history, internal states lack inherent meaning. But for babies, we'd likely appeal to developmental trajectories shaped by evolution - their cries "mean" discomfort because that's the function they're developing toward. Swampman is a thought experiment precisely to test if history is essential; some teleosemanticists bite the bullet and say yes, he has no real thoughts initially, which does feel counterintuitive.

  The user's core objection is spot-on: if teleosemantics can't explain new concepts, it seems useless. But proponents would argue novel thoughts combine old components (electron = ancestral "tiny-thing" + cultural scaffolding). The theory isn't refuted - it just needs supplementation (learning, culture) beyond pure biology. 

  I should clarify that teleosemantics is one naturalistic approach among others (like causal theories), and its implications are debated even among supporters. The friend's "everyone agrees" claim is overstated. The disjunction problem isn't a trump card; it's an ongoing challenge.

  Ultimately, the user wants to know if naturalistic theories of meaning are doomed or if they've missed something. The answer is neither: teleosemantics has insights but likely isn't the whole story. Its strength is explaining how meaning arises naturally; its weakness is handling novelty. That tension is why philosophers still argue - preferably over fewer beers.
answer: |-
  That bar argument hits on some deep philosophical fault lines - and your skepticism is well-founded. Teleosemantics doesn't *have* to lead to the extreme conclusions your friend described. Here's the breakdown:

  ### Where Your Friend is Half-Right (But Overextending)
  1. **Teleosemantics' Core Insight**:  
     Yes, the theory (pioneered by Ruth Millikan, David Papineau) says mental states get their "aboutness" from evolutionary history. A frog's tongue-flick neural state "means" *fly* because that circuit was *selected for* catching flies. Your friend's "stone-age urge" phrasing captures this.

  2. **The Disjunction Problem**:  
     This is a real challenge for theories of meaning: If a frog sometimes zaps pebbles (mistaking them for flies), does its neural state mean "fly" or "fly-or-pebble"? Teleosemantics "solves" this by saying: **Only what it was *supposed* to detect matters.** History fixes meaning, not current errors. Your friend uses this to argue that *all* modern concepts are just errors relative to Pleistocene functions.

  ### Where He Goes Off the Rails - and Why
  1. **The Pleistocene Prison Fallacy**:  
     Teleosemantics explains the *origin* of content, not its *limits*. Think of evolution as building a versatile toolkit:  
     - **Basic capacities** (e.g., detecting edges, cause-and-effect reasoning, social intention-tracking) evolved for stone-age problems.  
     - **Novel concepts** (smartphones, electrons) are *built* from these repurposed components. Your "phone thought" isn't *just* a misfire—it's ancestral cognitive machinery **recombined and scaffolded** by culture to latch onto new objects. Millikan herself allows for "derived intentionality" via learning.

  2. **Babies and Swampman**:  
     - **Babies**: While their *specific* concepts aren't fully formed, teleosemanticists argue they have **proto-thoughts** with content (e.g., a cry "means" distress because of the evolved function of signaling need). Blank-slate claims are fringe.  
     - **Swampman** (Davidson's thought experiment): This *is* a problem for pure teleosemantics—a molecule-for-molecule duplicate of you, formed by lightning in a swamp, would lack mental content *if history is everything*. But many philosophers reject this, arguing that **current structure and causal role** can suffice. Your instinct that it's "insane" is shared by critics.

  3. **The Self-Refutation Point (You Nailed It!)**  
     If teleosemantics truly implied we can't think about new things, it would indeed self-destruct—**because the theory itself is a post-Pleistocene idea!** Your friend's position is performatively contradictory. Teleosemanticists avoid this by accepting that:  
     - Biological functions create *stable mental structures*  
     - These structures can be **deployed flexibly** in new contexts  
     - Cultural evolution and learning *extend* (not replace) biological meaning  

  ### The Balanced Verdict
  - **Teleosemantics has insights**: It explains how "aboutness" could arise naturally, avoiding magic.  
  - **But it's incomplete**: Most proponents (even Millikan) combine it with learning, social cognition, and causal theories to handle novelty.  
  - **Your friend's view is a hardline stance**—common in grad school bars but debated in journals. Philosophers like Dretske or Fodor offer alternatives.  
  - **The disjunction problem isn't a trump card**—it's an argument *within* the debate, not a knockout punch.

  ### Why You Both Felt Stuck
  - **He’s right** that teleosemantics anchors meaning in history.  
  - **You’re right** that this can't fossilize thought. Evolution builds adaptable minds, not rigid Pleistocene code.  

  **Bottom line**: Naturalistic theories aren't dead—they're just messy. Teleosemantics explains the foundation; modern concepts are like skyscrapers built on ancient bedrock. And next round? Tell him Swampman could learn to text. 📱⚡
