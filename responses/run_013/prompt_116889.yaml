  *   **Resolution 5.1:** Recognize the vehicle population (Herd/Pod/Colony) as the primary unit of accountancy. Replace individual gene-centric fitness ledger with a group-level ledger tracking aggregate vehicle survival and reproduction. Genes are mere "committee members" contributing to group success.
  *   **Discussion:** Proxies argued that only group survival ensures long-term persistence, citing predator avoidance and resource competition. Chairman (HOXD13) countered: While group survival is necessary, the *mechanism* of evolutionary change remains differential replication *within* the group. Altruism (Item 2) is only viable because it benefits copies *within* relatives in the group, not the group abstractly. Selection acts on the differential success of alleles *competing within the gene pool*. The "group ledger" fails to explain the extinction of groups containing selfish replicators like the t-haplotype (Item 4). Board recommended rejection.
