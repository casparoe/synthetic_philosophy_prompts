  *   **Exception 3.1: Erroneous Credit Assignment to Passenger Alleles.** The Auditor identified instances where alleles hitchhiking via linkage disequilibrium with positively selected variants received fitness credit in the ledger, despite contributing no causal effect. This violates accounting standard GAAP-GE (Generally Accepted Accounting Principles - Genetic Evolution). Motion to direct bookkeeper (Replication & Repair Dept.) to implement stricter causal attribution protocols.
