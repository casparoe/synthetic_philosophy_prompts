  Hmm, this is fascinating. The user is clearly well-traveled and observant, noticing these intricate dynamics. They're not just asking for a term but probing deeper into the structure of this paradox - particularly the inverse relationship between personal religious engagement and defense of institutional arrangements. Their frustration at not finding existing terminology suggests they've done substantial research already.

  The core tension seems to be between functional vs confessional perspectives. Non-practitioners defend the system for its utilitarian benefits (social services, cultural cohesion), while active believers attack it for compromising spiritual integrity. What's striking is how both sides attack precisely what the other values most - the non-believer's lack of faith becomes proof they don't understand the institution's true purpose, while the believer's rejection of utility undermines the practical benefits.

  This reminds me of several concepts but none fit perfectly. "Cultural religion" captures the non-practitioners' stance but misses the institutional dimension. "Religious disestablishment" is too narrow. The closest might be "institutional instrumentalism" versus "confessional integrity," but that's descriptive rather than a recognized term. 

  The user's secondary questions reveal sophisticated analysis: they recognize this isn't just coalition politics because the arguments operate on different planes (practical vs principled), and they rightly distinguish it from hypocrisy since the defenders aren't necessarily insincere. Their request for clear cases/non-cases shows methodological rigor.

  I should emphasize that the inversion is essential - it's the reverse alignment of engagement vs defense that makes this pattern distinctive. And no, it doesn't require establishment; any state-religion interface (funding, exemptions) can trigger it. The clearest non-case would be when religious practitioners defend arrangements that directly serve their worship needs.

  This user deserves a response that honors their careful observation. Since no perfect term exists, coining "the Settlement Paradox" might serve best - capturing both the institutional nature ("settlement") and the contradictory stances ("paradox"). The explanation should preserve their brilliant "exposed flank" metaphor about mutual vulnerabilities.
answer: |-
  Based on your detailed description, you've identified a nuanced and significant pattern in church-state relations. While no single, universally accepted term perfectly encapsulates *every* facet you describe, we can name it, define its boundaries, and answer your specific questions.

  **The Pattern's Name: The Settlement Paradox**

  *   **"Settlement"**: Reflects the specific, often historical, arrangement governing church-state relations in a given context (establishment, tax levy system, strict separation).
  *   **"Paradox"**: Highlights the core inversion you identified – those who *use* the religious institution least are often its staunchest *defenders* of the *settlement*, while those most invested in the institution's religious mission are often its fiercest *critics* of that same settlement. It also captures the "talking past each other" dynamic.

  **Why "Paradox" Fits:**
  1.  **Inversion of Engagement/Defense:** The most active religious participants oppose the settlement meant to support their institution, while the least religiously engaged defend it.
  2.  **Clashing Rationales:** Defenders justify the settlement based on **secular utility and social infrastructure** (funerals, schools, cultural glue, accountable public service providers). Critics attack it based on **theological integrity and spiritual mission** (compromise, loss of prophetic voice, state control undermining religious purpose).
  3.  **Mutual Exposure:** Each side effectively attacks the other's weakest point from their own perspective: critics highlight the defenders' lack of genuine religious commitment, defenders highlight the critics' disregard for the practical benefits the settlement provides.

  **Answering Your Specific Questions:**

  1.  **Is the inversion essential?** **Yes.** The core of the pattern you describe is the *inverse relationship* between personal religious practice/belief and support for the *existing institutional settlement*. Without this inversion (e.g., if devout believers strongly defended establishment, or non-believers strongly attacked it for theological reasons), it wouldn't be *this* specific pattern.
  2.  **Does it require an established church?** **No.** As your examples show, the pattern manifests with:
      *   Formal Establishment (UK model)
      *   State-Collected Religious Levies (German Kirchensteur model)
      *   Strict Separation with Residual Elements (US model with "In God We Trust," legislative prayers)
      The common thread is **any significant, structured interface between the state and religious institutions** (state funding via tax mechanisms, legal privileges/restrictions, constitutional recognition/prohibition, symbolic entanglement). Wherever the state tangibly supports, restricts, recognizes, or funds religious bodies in a systematic way, this dynamic *can* arise.
  3.  **How is it distinguished from ordinary coalition politics?** Ordinary coalition politics involves groups supporting policies that benefit them materially or politically, often trading support across different issues. The Settlement Paradox is distinct because:
      *   **Rationale Mismatch:** Support/opposition isn't primarily about direct *material* self-interest (though that can be present, like using church-run hospitals) but about *conflicting valuations* of the institution (utility vs. integrity).
      *   **Target of Critique:** The criticism isn't just about policy inefficiency but about the *fundamental nature* of the religious institution under the settlement (compromised, state-controlled vs. vital public service).
      *   **Inversion:** The key paradox – those benefiting most spiritually oppose, those valuing the civic utility support – isn't typical of simple interest-group politics.
  4.  **Is it a species of hypocrisy?** **Generally, no.** This is crucial:
      *   **Defenders (Non-Practitioners):** They are typically sincere in valuing the settlement for its *non-religious* benefits (social services, cultural cohesion, ceremonial function, accountable infrastructure). They aren't pretending religious belief; they're prioritizing civic utility. Their defense isn't hypocritical; it's utilitarian.
      *   **Critics (Practitioners):** They are sincere in their belief that the settlement harms the *religious* mission and identity of their institution. Their opposition stems from theological conviction, not hypocrisy.
      *   **The friction arises not from insincerity, but from fundamentally different frameworks for valuing the religious institution and its relationship to the state.** Each side perceives the other as misunderstanding the *true* purpose or value of the arrangement/religion.
  5.  **Clear Cases vs. Non-Cases:**
      *   **Clear Case:** A prominent atheist intellectual passionately defends the Church of England's established status, arguing it provides essential social glue, beautiful ceremonies for national events, and a network of community support, while the Archbishop of Canterbury argues disestablishment is necessary for the church to speak prophetically to power and reclaim its spiritual focus. *Inversion present. Rationales clash. Flanks exposed.*
      *   **Clear Case:** A non-religious German citizen supports the Kirchensteuer because it funds hospitals and kindergartens they use, while a devout member of a small Baptist church (exempt from the levy) argues that state-collected funds make the participating churches mere social service agencies, not true communities of faith. *Inversion present. Rationales clash. Flanks exposed.*
      *   **Clear Case:** A secular activist in the US fiercely defends strict separation, filing lawsuits to remove any religious symbol from public property on principle, while a local Catholic priest argues zoning laws using "strict separation" unfairly restrict his church's ability to run a soup kitchen. Simultaneously, a non-religious mayor defends keeping "In God We Trust" in the council chamber as harmless tradition. *Inversion present (non-believer defends strict separation fervently, believer finds it restrictive; non-believer defends residual symbol). Rationales clash.*
      *   **Non-Case:** Devout members of an established church lobby the government for *more* state funding for church schools, arguing it benefits their community. (No inversion – active users support the settlement for direct religious/community benefit).
      *   **Non-Case:** Non-believers campaign to dismantle an established church solely because they object to state funding of religion on principle, arguing it violates fairness or their atheism. (No inversion – non-users oppose for reasons directly related to their non-belief; no focus on infrastructure utility. Rationale is consistent, not clashing with a believer's defense on utility grounds in the same way).
      *   **Non-Case:** A purely political coalition where secular liberals support church-run homeless shelters because they provide a needed service, and socially conservative believers support them because they align with their values, both agreeing on the policy outcome for different reasons. (No inversion regarding the *settlement* itself; this is standard coalition politics focused on a specific service, not the underlying church-state structure).

  **Distinguishing from Similar Concepts:**

  *   **Cultural Religion/Belonging without Believing:** This describes *individual* identity/affiliation without practice/belief. The Settlement Paradox focuses on *institutional defense/critique* specifically and the *inverse relationship* with practice. Cultural religion might *explain* why non-practitioners defend the settlement, but the paradox is the *structure* of the debate and the inversion.
  *   **Civil Religion:** This refers to using religious *symbols, language, and rituals* to foster national unity, often detached from specific denominations. The Settlement Paradox involves *actual institutional arrangements* (funding, legal status) and the *conflict* between those valuing the institution for civil/social purposes vs. religious purposes. Civil religion might be one *manifestation* defended under the settlement.
  *   **Religious Hypocrisy:** As argued above, this doesn't typically fit, as the positions are sincerely held based on different value frameworks.

  **In Summary:**

  You've identified **The Settlement Paradox**: **A recurring dynamic in church-state relations where the existing institutional settlement (establishment, funding mechanism, separation doctrine) is defended most vigorously by those least engaged with the religious institution (valuing it for secular utility and social infrastructure), while being attacked most vigorously by those most engaged with the religious institution (seeing it as compromising theological integrity and spiritual mission), resulting in arguments that talk past each other by targeting the other side's core vulnerability.** The inversion is essential, it arises from any significant state-religion interface, it's distinct from simple interest-group politics due to the rationale clash and inversion, and it generally does not constitute hypocrisy.
