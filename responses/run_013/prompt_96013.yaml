  I am a law student taking, in the same term, a seminar on social choice and bargaining theory and a course on insolvency law, and the two have collided in a way I cannot sort out on my own. In the insolvency course the elementary fairness idea is proportionality: when the estate cannot pay everyone in full, creditors of the same rank each recover the same fraction of what they are owed, so that a creditor owed twice as much receives twice as much. In the bargaining seminar we spent a week on the Kalai–Smorodinsky solution, which selects the point on the efficient frontier at which each party captures an equal fraction of the largest gain it could have obtained, measured from the disagreement point, the outcome that would obtain if no agreement were reached. It struck me that the insolvency rule is arithmetically the same rule, with the creditors' claims playing the role of each party's best feasible gain and liquidation playing the role of the disagreement point. But the same body of law declines to apply proportionality across ranks: a creditor whose claim is secured by particular assets is paid out of those assets ahead of the unsecured creditors, and in many jurisdictions wage arrears and tax claims jump the queue ahead of ordinary trade creditors. And nowhere does the practice ask how much the money is worth to the claimant. When I told a classmate that the pro rata rule is just Kalai–Smorodinsky with dollars standing in for utility, he said that cannot be right, because the law never compares one person's welfare with another's; I could not tell whether he had a point.

  What I want from you is a reconstruction of what this practice presupposes. What view of fairness does it only make sense under — that claimants are entitled to equal proportional treatment relative to their claims, that entitlements rather than welfare are the currency of the whole exercise, or something else? Is the resemblance to Kalai–Smorodinsky substantive or merely arithmetical, and what turns on the difference? In particular, does the practice tacitly presuppose the very interpersonal comparison it appears designed to avoid, by treating a nominal dollar of claim as worth the same to every claimant, and if so is that assumption load-bearing or idle? Do the priority rules contradict the proportional rule, or is the practice coherent under a two-currency view, entitlement governing relations across ranks and proportional fairness governing relations within a rank? Which rival views does it quietly rule out: equal absolute shares within a rank; a Nash-style criterion that would maximize the product of the parties' gains and would therefore have to measure how much each claimant actually stands to lose; a need- or hardship-based criterion; a maximin criterion that would hand everything to the worst-off claimant? Which features of the practice strictly require the view you attribute to it, and which merely fit it, so that several theories would license the same outcomes? And what would have to change if the system took the criterion seriously and tried to measure each claimant's real gain — for instance, if a small supplier's survival turns on the recovery while a bank barely registers it — or if it replaced proportionality with equal absolute shares within a rank? I am not looking for cases, statutes, or a reading list; I want the analysis.

  Please give me that analysis in prose, and then finish with a single JSON object summarizing it, containing exactly these fields: "presupposed_view" (string: the view of fairness the practice only makes sense under, in one or two sentences); "is_it_kalai_smorodinsky" (one of "identical rule", "same family, different rule", "superficial resemblance only"); "ks_verdict_reason" (string: what the verdict turns on); "strictly_presupposed" (array of strings: claims the practice cannot do without); "merely_compatible" (array of strings: rival views the practice also fits); "ruled_out" (array of strings: rival views it excludes); "internal_consistency" (one of "consistent", "tension", "inconsistent"); "consistency_explanation" (string: the strongest case on each side); "if_gains_were_measured" (string: what would have to change under a criterion that measured actual gains); "weakest_link" (string: the point in your reconstruction you are least confident of); and "confidence" (one of "high", "medium", "low").
