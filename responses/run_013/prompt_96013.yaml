answer: |-
  ### Analysis of Insolvency Proportionality and Priority Rules

  The insolvency practice, with its within-rank proportionality and across-rank priority rules, presupposes a specific view of fairness centered on **entitlements rather than welfare or utility**. Under this view, creditors are seen as holding legal claims that establish pre-existing rights to the debtor's assets. Fairness is achieved by respecting the absolute priority of these entitlements across classes (secured > wages/taxes > unsecured) and by distributing the shortfall proportionally within each class based on the nominal value of claims. This approach deliberately avoids interpersonal comparisons of welfare, treating each dollar of claim as equivalent in legal weight regardless of the creditor's circumstances. The priority rules create a lexicographic ordering of entitlements, while proportionality operationalizes equality of treatment among creditors holding claims of the same legal rank—each dollar of entitlement receives identical proportional satisfaction.

  The resemblance to Kalai-Smorodinsky (KS) is **superficial only**, despite arithmetic similarities in the proportional calculation. KS requires equalizing the *fraction of maximal feasible gains* from the disagreement point, where "gains" are defined by a party's ideal utility. Insolvency proportionality, conversely, equalizes the *fraction of nominal claims paid*, ignoring utility entirely. The KS ideal point is derived from feasibility constraints (e.g., asset limits), while the insolvency "ideal" is the creditor's legal claim—a fixed entitlement independent of feasibility. What turns on this difference is the core philosophy: KS is welfarist and context-sensitive, while insolvency practice is deontological, prioritizing legal rights over outcomes.

  #### Core Presuppositions and Compatibility
  - **Strictly Presupposed** (claims the practice cannot do without):  
    1. Fairness is defined by pre-existing legal entitlements.  
    2. Entitlements must be strictly ordered across ranks (priority).  
    3. Within a rank, fairness requires equal proportional satisfaction of claims.  
    4. Interpersonal welfare comparisons are irrelevant/inadmissible.  

  - **Merely Compatible** (rival views the practice also fits):  
    1. A formal equality principle (equal treatment per unit of claim).  
    2. Libertarian emphasis on property rights (secured assets).  
    3. Consequentialist stability arguments (predictability encourages lending).  

  - **Ruled Out** (rival views it excludes):  
    1. Equal absolute shares within a rank (ignores claim size).  
    2. Nash bargaining (requires utility/product-of-gains maximization).  
    3. Need/hardship criteria (e.g., favoring distressed small suppliers).  
    4. Maximin (allocating to the worst-off creditor).  

  #### Internal Consistency
  The practice is **consistent** under a two-tiered entitlement framework. Priority rules govern vertical relations between ranks, reflecting the hierarchy of legal claims. Proportionality governs horizontal relations within ranks, ensuring equal respect for claims of equal legal status. No tension arises because the "currency" is uniform: nominal entitlements at both levels. Priority does not contradict proportionality; it lexically orders the contexts in which proportionality applies.

  #### Implications of Alternative Approaches
  If gains were measured by welfare (e.g., a supplier's survival vs. a bank's indifference), the system would collapse into **radical context-dependence**. Proportionality would be replaced by utility-based allocation (e.g., KS or Nash), requiring courts to assess creditors' marginal utilities, vulnerability, or opportunity costs. Priority rules would dissolve, as a "needy" unsecured creditor could leapfrog secured ones. This would undermine predictability, increase litigation, and contradict the entitlement ethos. Replacing proportionality with equal absolute shares within a rank would violate the entitlement view by severing recovery from claim size—e.g., a $100 claimant and a $10,000 claimant receiving identical amounts, treating unequal claims equally.

  #### Weakest Link
  The interpretation of priority rules as purely entitlement-based is the most vulnerable point. One could argue that priorities like wage arrears reflect latent welfare concerns (protecting vulnerable employees), subtly introducing a needs-based criterion. While this tension exists, the practice rationalizes such priorities as statutory entitlements, not welfare judgments—preserving coherence.

