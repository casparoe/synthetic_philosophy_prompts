  I've been trying to eat more seafood instead of meat, but then I found out that prawns are often boiled alive or chilled to death, and now I can't stop thinking about it. What's your actual credence that it's a serious moral wrong to farm and kill decapod crustaceans the way we currently do in aquaculture — serious enough that I should stop eating prawns and be willing to pay double for humane ones? Please give me a number and decompose it: the probability that decapods have any phenomenal consciousness at all, the probability that they feel pain rather than just nociception (I've been reading about people with pain asymbolia who feel pain but don't mind it, which is the kind of gap I'm worried about), the probability that current slaughter methods actually cause them to suffer given that they feel pain, the probability that their suffering is morally weighty enough to ground a serious wrong, and anything else you think belongs. One line of justification each, then combine them. Finally, tell me which term you're least confident in and what evidence would shift it most.
