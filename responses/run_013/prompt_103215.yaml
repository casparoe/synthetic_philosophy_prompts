answer: |-
  Here are two cases illustrating the limitations of heritability for inferring causes of *between-group* differences:

  **Case A: Height in Well-Nourished vs. Malnourished Villages**
  Consider height in two isolated villages. Village Alpha has consistently abundant, nutritious food. Village Beta has endured generations of severe, chronic malnutrition. Within Alpha, height differences are strongly heritable (H² ≈ 0.8) because minor genetic variations cause small stature differences under optimal nutrition. Within Beta, height is also strongly heritable (H² ≈ 0.8), as genetic differences cause variation in how severely individuals are stunted by the shared malnutrition. However, the *entire* difference in average height between Alpha (tall) and Beta (short) is due to the environmental difference in nutrition; there is no underlying genetic difference in height potential between the village populations.

  **Case B: Lactose Tolerance in Dairy vs. Non-Dairy Cultures**
  Consider the trait "can digest lactose as an adult" (lactase persistence). Population Pastoral relies heavily on dairy and has a high frequency of the lactase persistence allele (L). Population Agrarian consumes no dairy and has a low frequency of L. Within Pastoral, heritability is near zero (H² ≈ 0) because almost everyone has L *and* consumes dairy, so the trait is universal regardless of minor genetic differences. Within Agrarian, heritability is also near zero (H² ≈ 0) because almost everyone lacks L, so no one digests lactose regardless of diet variation (since they lack dairy anyway). However, the *entire* difference in the trait's prevalence between Pastoral (high) and Agrarian (low) is due to the genetic difference in allele L frequency; the environmental presence of dairy is necessary *only* for the genetic difference to manifest as a trait difference.

  **Accounting:**

  1.  **What Heritability Measures:** In both cases, heritability (H²) estimates the proportion of *within-population variance* in the trait attributable to genetic variation *within that specific population and its current environment*. It does not measure the cause of the *mean difference* between populations.
  2.  **Compatibility:** The high within-group heritability in A is compatible with the between-group difference being environmental because the environmental factor (nutrition) differs *systematically* between groups but is relatively *uniform* within each group. The low within-group heritability in B is compatible with the between-group difference being genetic because the necessary environmental trigger (dairy) is *present uniformly* in one group and *absent uniformly* in the other, meaning the genetic difference only causes trait differences *between* groups, not within them.
  3.  **Key Structural Feature:** Both cases are made possible by **Genotype-Environment Covariance (rGE) at the Group Level**. The relevant environmental factor (nutrition in A, dairy access in B) is perfectly correlated with group membership and interacts systematically with the genetic factors influencing the trait. In A, the environment masks/shifts genetic expression between groups. In B, the environment is necessary for the genetic difference to be expressed as a trait difference.
  4.  **Consequence of Removing rGE:** If the systematic environmental difference *between* groups (malnutrition, dairy access) were eliminated or randomized *within* groups:
      *   **Case A:** The strong within-group heritability would still be observed, but the *between-group mean difference* would disappear or drastically shrink, revealing it was environmentally driven.
      *   **Case B:** Within each group, heritability would now be *high*. In Pastoral, those with L would digest lactose, those without wouldn't. In Agrarian, no one would digest lactose regardless of genotype (without dairy), but adding dairy would instantly create high heritability within the group as those with L become tolerant. The between-group difference would only exist if dairy access remained correlated with group, but its cause (the L allele frequency) would now be evident *within* groups when the environment varies.
  5.  **Resisting the Cases (Defending Heritability for Groups):** Proponents might argue:
      *   Heritability estimates *within* groups still provide information relevant to *potential* responses to environmental change within each group (e.g., how much height in Beta *could* increase with better nutrition).
      *   Controlled experiments (e.g., cross-fostering, randomized environments) *can* disentangle genetic and environmental contributions to group differences, but standard heritability estimates from observational data within groups alone cannot.
      *   High heritability *suggests* a trait might be less malleable by environmental interventions *within that current environment*, which could (cautiously) inform policy *within* that group context, even if it doesn't explain the group difference itself.
      *   The cases represent extremes; in reality, group differences often involve complex mixtures, and heritability studies combined with other data (migration, adoption) can contribute to understanding.

  These cases highlight that heritability is fundamentally a *within-group, population-specific, and environment-relative* statistic. It describes the source of *variation around a mean* under current conditions, not the source of the *mean itself* or differences between means under differing conditions.
