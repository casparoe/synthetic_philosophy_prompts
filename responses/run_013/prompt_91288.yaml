  ### Philosophy of Science Black Box Activity: "The Pinch of Underdetermination"

  #### **Materials & Prep** (£30 budget)
  1. **Black Box Construction** (build two identical units):
     - **Core Components**:
       - 2× plastic project boxes (opaque, sealed with tamper-proof tape) - £6
       - 2× toggle switches (labeled "A" and "B") - £4
       - 1× 5-position rotary switch (labeled "Dial: 1-5") - £3
       - 1× LED (red/green) + buzzer (optional) - £2
       - 1× 9V battery + holder - £3
       - Wires, resistors, breadboard (for easy modification) - £5
     - **Circuit Logic**:
       - **Behavior**: LED lights when `(A=ON AND Dial≥3) OR (B=ON AND Dial≤3)`.
       - **Key Ambiguity**: At Dial=3, both A and B trigger the LED independently, allowing two equally valid interpretations:
         - *Theory 1*: "A controls high (3-5), B controls low (1-3)."
         - *Theory 2*: "A activates for ≥3, B for ≤3, with overlap at 3."
       - **Soldering**: Hide wiring under a layer of hot glue to prevent reverse engineering. Test rigorously.

  2. **Anomaly Mechanism**:
     - Insert a hidden mercury tilt switch (or vibration sensor) inside one box. When tilted >30° (e.g., during transport), the LED flickers/dims. Cost: £2 per switch.

  3. **Group Kits** (per group):
     - Data sheet (table: Inputs A/B/Dial, Output LED ✔/✖)
     - Theory card (blank paper)
     - Pens

  #### **Rules & Turn Structure**
  - **Group Split**: Two teams (8 students each), isolated rooms/partitions.
  - **Query Limit**: 12 tests per group (tests = any combo of A/B/Dial).
  - **Anti-Cheating**: 
    - Assign a TA "moderator" per group to record outputs.
    - Seal boxes with tape marked "VOID IF OPENED."
    - Groups write theories *before* sharing.

  #### **Timeline** (75 min total)
  1. **Intro & Setup (5 min)**:
     - "You're instrument scientists. This box has inputs (A/B/Dial) and an output (LED). Find the hidden mechanism with 12 tests. Write your theory: *what’s inside* and *why*."

  2. **Testing Phase (25 min)**:
     - Groups test inputs (e.g., "A=ON, B=OFF, Dial=4 → LED ON?"). Moderator records outputs.
     - *Predictable issue*: A student tries to open the box.  
       **Response**: "As scientists, you can only observe outputs. Tampering voids your data."

  3. **Theory Submission (5 min)**:
     - Groups write theories on cards. Collect immediately.

  4. **Reveal & New Data (15 min)**:
     - Display both theories. *Example divergence*:
       - Group 1: "A powers the LED for Dial≥3; B is irrelevant."
       - Group 2: "B powers the LED for Dial≤3; A is irrelevant."
     - **Beat 1**: Highlight incompatible internal stories (e.g., "irrelevant" vs. "critical" switches) despite identical evidence.
     - **New Queries**: Test Dial=3, A=OFF, B=ON → LED ON (both theories predict correctly).  
       **Beat 2**: "More data" fails to resolve the conflict.

  5. **Anomaly Phase (15 min)**:
     - Tilt the box slightly. Test Dial=4, A=ON, B=OFF → LED flickers/dims.
     - Groups suggest fixes:  
       Group 1: "Loose wire in the A circuit!"  
       Group 2: "Dial sensor is misaligned!"  
       **Beat 3**: Both preserve core theories with unstated auxiliaries.

  6. **Debrief (10 min)**:
     - Map beats to philosophy:
       - **Beat 1 → Underdetermination**: Identical evidence supports rival theories (Laudan, Stanford). No "crucial experiment" exists yet.
       - **Beat 2 → In Principle vs. In Practice**: More data *could* resolve some underdetermination (e.g., if Dial=3, A=OFF, B=OFF lit the LED), but not when theories are empirically equivalent (Quine). Here, equivalence holds for all possible inputs.
       - **Beat 3 → Holism**: You never test a core theory alone; auxiliaries (e.g., "no loose wires") absorb anomalies (Duhem-Quine). Science is a web, not a foundation.
       - **Constructive Empiricism**: If science aims for empirical adequacy (van Fraassen) not truth, both theories are "good" – they predict all observations. Truth is superfluous.
     - **Historical Angle**: "Your theories assumed switches/wires, but what if the box had microchips? 19th-century physicists couldn’t conceive of quantum fields. Underdetermination isn’t about bad choices – it’s about unseen options."

  #### **Handling Predictable Issues**
  - **"The box is rigged!"**: 
    - "Science often faces skepticism about instruments. Your job is to work with observable data – assume the box is reliable until anomalies force auxiliary hypotheses."
  - **Group opens the box**: 
    - Swap in a backup box. Emphasize: "Real scientists can’t ‘open’ quarks or black holes. Focus on inference from evidence."

  #### **Limitations & Honesty**
  - **What it can't do**:
    - **Realism’s "miracle argument"**: The activity can’t replicate science’s *predictive depth* (e.g., deducing new particles). Acknowledge: "Realists argue successful predictions imply truth – but here, predictions are shallow."
    - **Theoretical virtues**: Simplicity/unification don’t apply. Say: "In real science, we’d prefer the theory that explains *more* with *less*. Here, both are equally simple."
  - **Why it works**: Forces students to *experience* underdetermination and holism – making abstract critiques tangible.

  #### **Post-Activity Payoff**
  Students leave uneasy about evidence’s limitations. In essays, they can’t unsee:  
  *"Saying ‘theories work’ ignores underdetermination," or "Auxiliaries make theories unfalsifiable."*  
  The "pinch" transitions from intellectual to visceral.
