prompt: |-
  A friend in my reading group stitched this together from something he half-remembers, and it's been bugging me all week.

  (1) Someone has a reason to do a thing only if a sound deliberative route leads from his existing motivational set to a motivation to do it. (2) Sound deliberation can correct false beliefs, sloppy reasoning and means-end incoherence, but it can't manufacture a brand-new terminal end. (3) Now meet Dermot: he knows every fact about the pain he causes, he's perfectly consistent, and nothing in him — no sympathy, no vanity, no wish to see himself as decent — pushes against it. (4) There's no sound deliberative route from Dermot's set to a motivation to stop. (5) So he has no reason to stop. (6) And if he has no reason to stop, then nothing anyone says to him is an argument; it's an attempt to install a desire, and moral criticism of him is just a politer version of that. (7) Same story for the man who doesn't care what happens to his own future. (8) That can't be right, so (1) is false.

  Here's my problem. Drop (1) and I owe an account of how a consideration can be a reason for someone it leaves completely cold, and of what makes it bind him — you can't fault a man for failing to be moved by something that, by hypothesis, doesn't touch him. Keep (1) and I'm stuck with (6). My group says (2) is the weak link: Dermot simply isn't imagining what he's doing properly, and if he were, a motivation would show up. That feels like cheating, though I can't say exactly why.

  Take a definite line: which step goes, why did it look fine, and what does dropping it cost me? Don't hand me the menu — pick one and defend it. Under 400 words, and in British English.
reasoning: |-
  Hmm, the user presents a philosophical puzzle about reasons for action, based on a thought experiment involving Dermot, who causes pain without any internal motivation to stop. The argument concludes that if internalism about reasons (premise 1) is true, then moral criticism of Dermot is merely manipulative, which seems counterintuitive. The user struggles with rejecting premise 1 because it raises questions about how reasons can bind someone unmoved by them, but keeping it leads to uncomfortable conclusions about morality.

  The reading group suggests attacking premise 2—that proper imagination would generate motivation in Dermot—but the user finds this "cheating." They want me to pick a definite line: which step to reject, why it seemed plausible, and what the rejection costs. The response must be under 400 words in British English.

  I think premise 4 is the weakest point. It assumes that no sound deliberative route exists from Dermot's motivational set to stopping, but this relies on a static view of motivation. Motivational sets aren't fixed; engagement with moral considerations can reshape them. For example, vivid confrontation with suffering might trigger latent empathy, even if initially absent. Premise 4 overlooks this dynamic aspect, treating Dermot's current indifference as immutable. It seemed fine because we often take motivations as given in hypotheticals, but real deliberation is transformative.

  Rejecting premise 4 allows me to keep premise 1 (internalism) while avoiding conclusion 6. Dermot might have a reason to stop if proper deliberation could activate undeveloped aspects of his psychology. The cost is accepting that reasons depend on empirical contingencies—whether a person's motivations are flexible enough to respond. This preserves internalism but makes reasons less universal; some agents might be "morally incorrigible" if their psychology is rigid. However, it avoids reducing moral criticism to mere manipulation, as we can fault Dermot for failing to engage in genuine deliberation that might change him.

  This approach is better than attacking premise 2 because it doesn't assume motivation must arise (which feels dogmatic), nor does it abandon internalism entirely (which creates the "binding" problem). Instead, it challenges the assumption that deliberation can't cultivate new sensitivities.
answer: |-
  Blame **premise (4)**: "There's no sound deliberative route from Dermot's set to a motivation to stop." This is the step that fails. It *looked* fine because we're told Dermot lacks any current sympathy, vanity, etc., and knows the facts. But premise (4) assumes his motivational set is static and that sound deliberation can only work with *existing, occurrent* motivations. Sound deliberation, however, isn't just cool calculation; it involves *attending* properly to the relevant features. Deliberation can sometimes *generate* the appropriate motivation by making the agent vividly appreciate the significance of facts they already know intellectually – like the nature of pain.

  For Dermot, truly *confronting* the reality of the pain he causes *might* elicit a motivational response, even if none is currently present. Perhaps latent capacities for empathy or aversion to suffering exist but are dormant or suppressed. Sound deliberation demands this kind of attention; it's not just about logic but about *understanding* the object. If such attention *could* spark a motivation (even if it doesn't *now*), then a sound deliberative route *exists* – it involves that act of proper appreciation. We can fault Dermot precisely for *failing* to deliberate soundly by not properly attending.

  Dropping (4) costs you the neat guarantee that an agent's current, occurrent motivations fully determine what reasons they have *right now*. It makes reasons hinge on potential motivational responses elicited by proper deliberation, which is empirically uncertain. We might be wrong about whether a given agent *could* be moved by such attention. However, it avoids the absurdity of (6) while preserving the core internalist insight of (1) that reasons must be capable of motivating *via* the agent's psychology under ideal rational conditions. Moral criticism then becomes the demand that Dermot *engage* in that proper attention.
