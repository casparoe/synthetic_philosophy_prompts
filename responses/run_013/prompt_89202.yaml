prompt: |-
  I teach the causal inference module on our third-year psych/stats degree and I'm setting the final, and I want one question on Simpson's paradox that students cant pass just by reciting the Berkeley admissions story. I've built a little dataset I want to use: treatment A vs B, recovery yes/no, and a third variable I'm calling stage, two levels. Stage 1: A recovers 60/100 (60%), B recovers 7/10 (70%). Stage 2: A recovers 1/10 (10%), B recovers 20/100 (20%). So pooled A is 61/110 (55%) and B is 27/110 (25%) -- A looks far better overall, B looks better inside both stages. The whole point I want the question to force is that they have to decide which comparison actually answers "does A cause recovery?", and to see the table alone cant tell them: it hinges on whether stage is a pre-treatment confounder or a post-treatment mediator, and the numbers are identical either way.

  Please write the question, a model answer of about 600 words, and a marking scheme. Build the marking scheme on specific must-hit moves, say what each is worth out of 20, and add a one-line note on the mistake that costs marks for each -- e.g. treating "obviously you stratify" as a theorem instead of a causal assumption. Dont let the model answer sit on the fence about which estimate is right under each assumption; make it pick a side and defend it. Aim it at students who've seen potential outcomes and DAGs but are still shaky.
reasoning: |-
  We are setting a question on Simpson's paradox with a dataset that has two treatments (A and B), an outcome (recovery), and a third variable (stage with two levels: Stage 1 and Stage 2). The data is:

  Stage 1:
    Treatment A: 60 recoveries out of 100 (60%)
    Treatment B: 7 recoveries out of 10 (70%)

  Stage 2:
    Treatment A: 1 recovery out of 10 (10%)
    Treatment B: 20 recoveries out of 100 (20%)

  Pooled (ignoring stage):
    Treatment A: 61 recoveries out of 110 (55.45% ≈ 55%)
    Treatment B: 27 recoveries out of 110 (24.55% ≈ 25%)

  In the pooled data, A has a higher recovery rate (55% vs 25%) but within each stage, B has a higher recovery rate (70% > 60% in Stage 1 and 20% > 10% in Stage 2). This is Simpson's paradox.

  The key point is that the causal question "does A cause recovery?" cannot be answered by the data alone. We need to know the causal role of the variable "stage". Specifically:

  - If "stage" is a pre-treatment confounder (i.e., it affects both the treatment assignment and the outcome), then we must condition on it (stratify) to get an unbiased estimate of the causal effect.

  - If "stage" is a post-treatment mediator (i.e., it is affected by the treatment and then affects the outcome), then conditioning on it would induce bias (because it blocks part of the causal path from treatment to outcome, and might open backdoor paths if there are unmeasured common causes of stage and outcome). In this case, the pooled estimate might be more appropriate.

  Therefore, the question must force the student to recognize that without knowing the causal structure (via a DAG or background knowledge) we cannot decide which estimate is appropriate.

  We are to write:
  1. The question
  2. A model answer (about 600 words) that takes a clear stance under each scenario and defends it.
  3. A marking scheme with specific must-hit moves, each worth a fraction of 20, and a note on the mistake that costs marks.

  Let's design the question:

  **Question:**

  Consider the following data from a clinical trial comparing two treatments (A and B) for a disease. The outcome is recovery (yes or no). Additionally, each patient is classified by disease stage (Stage 1 or Stage 2) at the time of treatment.

  The data:

  |          | Treatment A | Treatment B |
  |----------|-------------|-------------|
  | **Stage 1** | 60/100 (60%) | 7/10 (70%)  |
  | **Stage 2** | 1/10 (10%)   | 20/100 (20%)|

  The overall (pooled) recovery rates are:
  - Treatment A: 61/110 ≈ 55%
  - Treatment B: 27/110 ≈ 25%

  We observe that in the pooled data, treatment A has a higher recovery rate than treatment B (55% vs 25%). However, within each stage, treatment B has a higher recovery rate than treatment A (70% > 60% in Stage 1 and 20% > 10% in Stage 2).

  (a) Explain why this situation is an example of Simpson's paradox. (2 marks)

  (b) The causal effect of the treatment (A vs B) on recovery is of interest. Discuss how the causal role of the variable "stage" (whether it is a pre-treatment confounder or a post-treatment mediator) affects the choice of which estimate (pooled or stratified) we should use to answer the causal question. (10 marks)

  (c) Suppose we have two different scenarios:

     Scenario 1: The disease stage is determined before treatment and affects both the treatment choice and the chance of recovery.

     Scenario 2: The treatment assignment is randomized (so independent of stage and any other factors), but the disease stage is affected by the treatment and then affects recovery.

     For each scenario, state which estimate (pooled or stratified) is appropriate for estimating the average causal effect of the treatment on recovery and explain why. (8 marks)

  **Model Answer:**

  (a) This situation is an example of Simpson's paradox because the direction of the association between treatment and recovery changes when we condition on the third variable (stage). In the overall data, treatment A is associated with a higher recovery rate than treatment B, but within each level of stage, treatment B is associated with a higher recovery rate. This reversal of the association when conditioning on a third variable is the hallmark of Simpson's paradox.

  (b) To answer the causal question of whether A causes recovery (relative to B), we must consider the causal role of "stage". The data alone cannot tell us which estimate (pooled or stratified) is appropriate because the same data can support two different causal stories.

  - If "stage" is a pre-treatment confounder (i.e., it is a common cause of treatment assignment and recovery), then failing to condition on it would leave a backdoor path open, biasing the estimate of the causal effect. In this case, we must condition on stage (i.e., use the stratified estimate) to block this backdoor path. The stratified estimate (which in this case would be a weighted average of the stage-specific effects) would be unbiased.

  - However, if "stage" is a post-treatment mediator (i.e., treatment affects stage and stage then affects recovery), then conditioning on stage would block part of the causal effect of treatment on recovery (specifically, the indirect effect through stage) and might also introduce bias if there are unmeasured common causes of stage and recovery. In this case, we should not condition on stage and instead use the pooled estimate to capture the total effect of treatment.

  Therefore, without knowing whether "stage" is a confounder or a mediator, we cannot choose the correct estimate. The decision must be based on subject-matter knowledge or a causal diagram (DAG) that clarifies the relationships.

  (c) 

  Scenario 1: Stage is a pre-treatment confounder (affects treatment and recovery). In this scenario, we must condition on stage. Therefore, we use the stratified estimates. The causal effect in each stratum is:

  - In Stage 1: The risk difference is 70% - 60% = 10% (favoring B). 
  - In Stage 2: The risk difference is 20% - 10% = 10% (favoring B).

  Since the effect is the same in both strata (10% higher for B), we can compute the average causal effect by taking a weighted average of these stratum-specific effects. However, note that the distribution of stage in the population must be considered. If we are interested in the average treatment effect (ATE) and the study population is representative, we might weight by the overall proportion of stage. But in this case, the effect is homogeneous (same in both strata) so the ATE would be 10% in favor of B. Therefore, the appropriate estimate is that treatment B causes a 10% higher recovery rate than treatment A, on average.

  Scenario 2: Treatment is randomized (so no confounding) and stage is a mediator (affected by treatment and then affects recovery). In this case, we are interested in the total effect of treatment, which includes both the direct effect and the indirect effect through stage. Conditioning on stage would block the indirect path and bias the estimate of the total effect. Therefore, we use the pooled estimate. The pooled risk difference is 55% - 25% = 30% in favor of A. This estimate is unbiased because randomization ensures no confounding, and we are not conditioning on a mediator. Hence, we conclude that treatment A causes a 30% higher recovery rate than treatment B, on average.

  In summary, the causal structure dictates the appropriate estimate. In Scenario 1, the stratified estimate (favoring B) is correct, and in Scenario 2, the pooled estimate (favoring A) is correct.

  **Marking Scheme (total 20 marks):**

  (a) Explanation of Simpson's paradox [2 marks]
  - Must-hit: Recognize the reversal of association when conditioning on a third variable. [2 marks]
  - Mistake: Just describing the data without mentioning the reversal.

  (b) Discussion of the role of stage (confounder vs mediator) [10 marks]
  - Must-hit 1: Explain that if stage is a pre-treatment confounder, conditioning is necessary (stratified estimate). [3 marks]
  - Mistake: Saying we always condition without considering the causal role.
  - Must-hit 2: Explain that if stage is a post-treatment mediator, conditioning is inappropriate (pooled estimate). [3 marks]
  - Mistake: Not recognizing that conditioning on a mediator can bias the total effect.
  - Must-hit 3: Emphasize that without causal knowledge (e.g., DAG) we cannot decide from data alone. [4 marks]
  - Mistake: Asserting that one method is always correct (e.g., "obviously you stratify").

  (c) Application to scenarios [8 marks] (4 marks per scenario)

  For each scenario:
  - Must-hit 1: Correctly identify which estimate (pooled or stratified) is appropriate. [1 mark per scenario]
  - Must-hit 2: Explain why, based on the causal role of stage. [2 marks per scenario]
  - Must-hit 3: State the conclusion about the causal effect (including direction and magnitude). [1 mark per scenario]

  Mistakes in (c):
  - In Scenario 1: Failing to condition (using pooled) or not justifying why conditioning is needed.
  - In Scenario 2: Conditioning on stage (using stratified) or not explaining why the total effect requires the pooled estimate.
  - Not providing the numerical effect (risk difference) and direction.

  Note: The numbers in the data are chosen so that the risk difference is constant in the strata (10% in favor of B in each) and the pooled risk difference is 30% in favor of A. This makes the calculation straightforward.

  This question and marking scheme should test the student's understanding of the causal assumptions behind Simpson's paradox and move beyond the Berkeley example.
answer: |-
  ### Question: Simpson's Paradox and Causal Inference  
  **Background**: You are given data from a clinical trial comparing treatments A and B for a disease. The outcome is recovery (yes/no), and patients are stratified by disease stage (Stage 1 or Stage 2). The data:  

  - **Stage 1**: A recovers 60/100 (60%); B recovers 7/10 (70%).  
  - **Stage 2**: A recovers 1/10 (10%); B recovers 20/100 (20%).  
  - **Pooled**: A recovers 61/110 (55%); B recovers 27/110 (25%).  

  We observe:  
  - Pooled: A has higher recovery (55% vs 25%).  
  - Stratified: B has higher recovery in Stage 1 (70% > 60%) and Stage 2 (20% > 10%).  

  **Tasks**:  
  (a) **Explain** why this is Simpson’s paradox (2 marks).  
  (b) **Discuss** how the causal role of "stage" (confounder vs. mediator) determines whether the pooled or stratified estimate answers: "Does A cause recovery?" (10 marks).  
  (c) **Analyze two scenarios**:  
    - **Scenario 1**: Stage is a *pre-treatment confounder* (affects treatment choice and recovery).  
    - **Scenario 2**: Stage is a *post-treatment mediator* (treatment affects stage, which affects recovery; treatment is randomized).  
    For each, **state** which estimate (pooled or stratified) is appropriate for the causal effect of A vs. B on recovery, **justify** your choice, and **report** the effect (direction/magnitude) (8 marks).  

  ---

  ### Model Answer (≈600 words)  
  **(a) Simpson’s Paradox Explanation**  
  This is Simpson’s paradox because the direction of the association between treatment and recovery reverses when conditioning on a third variable (stage). Pooled data suggests A is superior (55% vs. 25%), but stratified data shows B is superior in both stages (70% > 60% in Stage 1; 20% > 10% in Stage 2). The paradox arises because stage imbalances distort the pooled estimate.  

  **(b) Causal Role of Stage**  
  To estimate "Does A cause recovery?", we need causal—not statistical—reasoning. The data alone cannot resolve this; we must know if stage is a confounder or mediator:  
  - **If stage is a pre-treatment confounder**, it opens a backdoor path (e.g., stage → treatment and stage → recovery). Failing to condition on it biases the effect. Here, we *must stratify* to block confounding. The stratified estimate shows B is superior (Stage 1: B +10%; Stage 2: B +10%), so A *harms* recovery.  
  - **If stage is a post-treatment mediator**, conditioning blocks part of treatment’s effect (e.g., treatment → stage → recovery). Stratifying would bias the total effect. We *must use the pooled* estimate. Pooled data shows A improves recovery by +30% (55% – 25%), so A *benefits* recovery.  
  Without a DAG or domain knowledge, we cannot assume stage’s role. "Stratify always" is incorrect: it assumes no mediators, which is a causal—not statistical—claim.  

  **(c) Scenario Analysis**  
  - **Scenario 1 (Stage = Confounder)**: Stratified estimate is appropriate. Stage is a common cause of treatment and recovery (e.g., severe-stage patients select B and have lower recovery). Conditioning blocks confounding. The effect is homogeneous: in Stage 1, B’s recovery is +10% (70% – 60%); in Stage 2, +10% (20% – 10%). Weighted by strata size, B’s average causal effect is +10%. **Conclusion**: A *reduces* recovery by 10% vs. B.  
  - **Scenario 2 (Stage = Mediator)**: Pooled estimate is appropriate. Treatment is randomized (no confounding), but stage mediates treatment’s effect (e.g., A worsens stage, lowering recovery). Pooling captures the total effect, while stratifying would block the indirect path. Pooled risk difference is +30% for A (55% – 25%). **Conclusion**: A *increases* recovery by 30% vs. B.  

  **Summary**: In Scenario 1, stratification shows A harms recovery; in Scenario 2, pooling shows A benefits recovery. The paradox dissolves only by clarifying stage’s causal role.  

  ---

  ### Marking Scheme (20 marks total)  
  **General Notes**:  
  - Marks deducted for:  
    - Confusing association with causation.  
    - Omitting potential outcomes/DAG logic.  
    - Claiming data alone can resolve the paradox.  

  **(a) Simpson’s Paradox Explanation (2 marks)**  
  - **Must-hit 1 (2 marks)**: Clearly notes reversal of association when conditioning on stage.  
    *Mistake cost*: Describes data without reversal (e.g., "rates differ by stage").  

  **(b) Causal Role Discussion (10 marks)**  
  - **Must-hit 1 (3 marks)**: Explains confounder case: Stratifying is necessary to block backdoor paths.  
    *Mistake cost*: Assumes stratification is always correct without causal justification.  
  - **Must-hit 2 (3 marks)**: Explains mediator case: Pooling is necessary to avoid blocking causal paths.  
    *Mistake cost*: Ignores that conditioning on mediators biases total effects.  
  - **Must-hit 3 (4 marks)**: Emphasizes that data alone is insufficient; causal structure (DAG/assumptions) decides.  
    *Mistake cost*: Treats "stratify" as a theorem (e.g., "obviously you stratify").  

  **(c) Scenario Analysis (8 marks; 4 per scenario)**  
  For **each scenario**:  
  - **Must-hit 1 (1 mark)**: Correctly picks pooled or stratified estimate.  
    *Mistake cost*: Wrong choice (e.g., stratifying in Scenario 2).  
  - **Must-hit 2 (2 marks)**: Clear justification based on stage’s role (confounder/mediator).  
    *Mistake cost*: Justification missing or misapplies DAG logic.  
  - **Must-hit 3 (1 mark)**: Reports effect direction/magnitude (e.g., "A +30%" or "B +10%").  
    *Mistake cost*: Effect not quantified or direction wrong.  

  **Total**: 20 marks.  
  **Key**: Full marks require causal reasoning, not just arithmetic.
