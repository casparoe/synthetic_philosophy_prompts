answer: |-
  Here's a tight joke playing on the fink/mask distinction using generosity:

  > Everyone called Sam incredibly generous—until you actually asked him for help. The moment you did, he'd suddenly develop a profound personal philosophy *against* charity.  
  >  
  > They called his sister generous too, but her assistant intercepted every request before it reached her.  
  >  
  > So Sam *stopped* being generous the instant he was tested. His sister? Still generous—just permanently shielded from proof.

  **Why it works for the audience:**
  1.  **Sam = Finkish Case:** His generosity *ceases to exist* precisely when the stimulus (request for help) is applied ("develop a profound personal philosophy against charity").
  2.  **Sister = Masked Case:** Her generosity remains intact ("Still generous"), but an external factor (the assistant) *prevents* the manifestation ("intercepted every request," "permanently shielded from proof").
  3.  **Punchline Contrast:** The final line explicitly contrasts the core difference: one disposition *vanishes* under test (fink), the other disposition *persists* but its *manifestation is blocked* (mask).
  4.  **No Jargon:** Uses clear descriptive language ("stopped being," "shielded from proof") instead of terms like "fink" or "mask."
  5.  **Human Analogy:** Uses generosity instead of fragility/liveness, fitting your request.
