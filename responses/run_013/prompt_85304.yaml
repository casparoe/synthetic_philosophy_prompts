prompt: |-
  I'm working on a feature about dispositions — fragile, soluble, live wire, all that — and I want to open it with a joke insted of the usual "a glass is fragile because..." windup. The angle I'm after is the fink vs. mask thing. Fink: the wire is live, but the second you touch it a gadget cuts the current, so the disposition itself disappears exactly when you'd go to test it. Mask: the wire is still perfectly live, something else is just sitting between it and whatever it would light up — like a fragile glass packed in bubble wrap that won't break when you smack it. (And then there's the reverse trick, a thing that's actually dead but springs to life the moment you test it, so it passes as live.) Can you write me a joke along those lines, with a person standing in for the wire — someone generous, or brave, or funny — where the punchline really turns on the fink/mask difference? It has to land for people who actually know this literature, so no "philosophers are weird" stuff and no string of jargon puns. Keep it tight, four or five sentences max.
