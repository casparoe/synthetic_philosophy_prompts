  Then, for each interpretation, I need to assess: Is it descriptive or normative? Does it assume a unified agent? How does behavioral econ concepts like hyperbolic discounting apply? For example, if "spirit" is a long-term preference, hyperbolic discounting explains why it loses to immediate gratification.

