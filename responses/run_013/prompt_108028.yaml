prompt: |-
  I host a departmental interview series, and my next guest is a political theorist whose book argues that historical analogies are best understood not as premises in an inference — predictions, warnings, items of evidence — but as instruments of description: an analogy supplies the vocabulary in which a present situation is characterised, so its characteristic failure is not that it predicts badly but that it renders certain features of the present case unsayable. She calls this description capture, and she holds that the long quarrel between those who defend the lessons of history and those who dismiss them as rhetoric is a stalemate because both sides treat the analogy as a premise.

  Please draft eight to ten questions for me, none of them biographical or warm-up, that press the position rather than invite a restatement of it. I want at least one question on how description capture is supposed to differ from ordinary framing effects or confirmation bias, since a sceptic will say the view collapses into one of those; one on whether the account can accommodate cases where an analogy seems genuinely to have carried information, such as the non-use of nuclear weapons since 1945 or the decline of great-power conquest; one on the reflexive difficulty that her own diagnosis is offered in a vocabulary that is itself selective; one on whether the view has any practical upshot for someone advising a decision-maker, or whether it amounts to a counsel of quietism; and one on what would count as evidence against the account. Do not ask her for citations or for a survey of the literature.

  Return the result as a JSON object with two fields. "guest_thesis" is a one-sentence restatement of her position in my own words, as a check that I have understood it. "questions" is an array of eight to ten objects, each with the fields: "order" (integer, its position in the sequence), "question" (the question as I would actually put it aloud), "targets" (which component of her position it is meant to test), "likely_reply" (the answer she is most likely to give), and "follow_up" (what I should ask if she gives that reply). At least two of the follow-ups must be designed to close off the deflection that I have misunderstood the thesis.
reasoning: |-
  We are given a detailed description of the guest's thesis and specific requirements for the questions.
   The thesis: Historical analogies are not premises for inference (like predictions, warnings, evidence) but instruments of description. They supply the vocabulary for characterizing a present situation. The characteristic failure is not bad prediction but "description capture" — making certain features of the present unsayable. She argues that the traditional debate (defending vs. dismissing historical analogies) is a stalemate because both treat analogies as premises.

   We are to draft 8-10 questions that press the position (not invite restatement). Specific required questions:

   1. At least one on how "description capture" differs from ordinary framing effects or confirmation bias (sceptic might say it collapses into these).
   2. One on cases where analogies seem to carry genuine information (e.g., non-use of nuclear weapons since 1945, decline of great-power conquest).
   3. One on the reflexive difficulty: her own diagnosis is in a vocabulary that is selective.
   4. One on the practical upshot for advising a decision-maker (or whether it leads to quietism).
   5. One on what would count as evidence against the account.

   Also: no biographical or warm-up questions. At least two follow-ups must be designed to close off the deflection that we have misunderstood the thesis.

   Structure the result as a JSON object with two fields:
     - "guest_thesis": a one-sentence restatement of her position in our own words.
     - "questions": an array of 8-10 objects, each with:
          "order": integer (position in sequence)
          "question": the question as we would ask aloud
          "targets": which component of her position it tests
          "likely_reply": the answer she is most likely to give
          "follow_up": what to ask if she gives that reply

   Let's restate the thesis in one sentence:

     "Historical analogies function primarily as descriptive frameworks that shape the vocabulary through which we understand present situations, and their primary failure mode is not inaccurate prediction but the silencing of certain aspects of the present, a phenomenon she terms 'description capture'; she contends that the standard debate about historical lessons is mired in a stalemate because both sides mistakenly treat analogies as premises in an argument."

   Now, we design the questions. We need 8-10. We'll aim for 10 to cover the required ones and more.

   We are to press the position, so we challenge it.

   Required questions:

    A. How does description capture differ from framing/confirmation bias? (Question 1)
    B. Cases where analogy seems to carry information (Question 2)
    C. Reflexive difficulty: her own vocabulary is selective (Question 3)
    D. Practical upshot for advising (Question 4)
    E. What counts as evidence against? (Question 5)

   We'll also design other challenging questions.

   Let's list 10 questions:

   1. Target: Distinction from framing effects
      Question: "A skeptic might argue that what you call 'description capture' is just a familiar framing effect or confirmation bias in disguise. How does your concept of description capture differ from these well-known cognitive biases?"
      Targets: Differentiation of description capture from framing effects and confirmation bias.
      Likely Reply: She might say that framing effects are about how the same information is presented differently and confirmation bias is about seeking evidence that confirms prior beliefs, but description capture is about the very vocabulary we use to describe a situation, which can make some features of reality linguistically inaccessible.
      Follow Up: "But doesn't the selection of a historical analogy itself frame the situation and thereby lead to confirmation bias? How is that distinct from what you're describing?"

   2. Target: Cases where analogies carry information
      Question: "You argue that analogies are not premises for inference, but what about cases where an analogy seems to have genuinely carried information? For instance, the analogy to the Cuban Missile Crisis in nuclear standoffs, or the 'long peace' since 1945, which some attribute to the analogy of the devastation of world wars. How does your account explain such cases?"
      Targets: Accommodation of cases where analogies appear to convey information.
      Likely Reply: She might say that even in these cases, the analogy is structuring the way we describe and understand the situation, and the perceived 'information' is actually a retrospective interpretation within that descriptive framework. The non-use of nuclear weapons, for example, is described in terms of deterrence theory, which is itself a product of historical analogies.
      Follow Up: "So are you saying that the analogy doesn't actually provide any new information about the present, but only structures how we talk about it? Then how do we account for the fact that decision-makers often feel they have learned from history?"

   3. Target: Reflexive difficulty
      Question: "Your own account of description capture is presented in a particular vocabulary — one that emphasizes linguistic constraints and the unsayable. Doesn't this very vocabulary risk its own form of description capture, by selectively highlighting certain aspects of how analogies function while obscuring others?"
      Targets: Reflexivity of her own theoretical framework.
      Likely Reply: She might acknowledge that any theoretical framework has its limitations and that she is offering a new lens to break the stalemate, but she might also argue that her account is self-aware and designed to avoid the pitfalls of treating analogies as premises.
      Follow Up: "But if every descriptive framework, including your own, inevitably captures and obscures, how can we ever have a critical perspective on description capture itself? Doesn't that lead to an infinite regress?"

   4. Target: Practical upshot
      Question: "If your account is correct, what practical guidance does it offer to someone advising a decision-maker? Doesn't the idea that analogies are inescapably descriptive frameworks lead to a kind of quietism, where we can only point out the constraints of the vocabulary but not offer positive advice?"
      Targets: Practical implications and avoidance of quietism.
      Likely Reply: She might say that the practical upshot is to become more aware of the descriptive constraints and to actively seek out alternative analogies and vocabularies to avoid capture, thus enabling more nuanced decision-making.
      Follow Up: "But if we are always operating within some descriptive framework, how can we ever truly break free to consider alternatives? And doesn't the selection of an alternative analogy just subject us to a different form of capture?"

   5. Target: Evidence against the account
      Question: "What kind of evidence or historical case study would you consider as a challenge to your account? In other words, what would falsify or significantly undermine your thesis that analogies function primarily as descriptive frameworks rather than as premises?"
      Targets: Falsifiability and evidence against the theory.
      Likely Reply: She might say that if we found clear cases where an analogy was used solely as a predictive premise and led to successful outcomes without any descriptive constraints, that would challenge her account. But she might also argue that such cases are unlikely because the use of an analogy always shapes the descriptive landscape.
      Follow Up: "Given that you might interpret any apparent counterexample as having an implicit descriptive function, doesn't that make your account unfalsifiable?"

   6. Target: The stalemate and the premise-treatment
      Question: "You claim that the long-standing debate between defenders and critics of historical analogies is a stalemate because both treat analogies as premises. But what if one side in that debate already recognizes the descriptive function? For example, some critics of analogies might argue that they are misleading precisely because they impose an inappropriate descriptive framework. Doesn't that break the stalemate?"
      Targets: The stalemate argument and the premise-treatment.
      Likely Reply: She might say that even those critics typically focus on the analogy as a bad premise (i.e., the two situations are not similar enough to warrant the inference) rather than on the descriptive constraints imposed by the analogy.
      Follow Up: "But if a critic argues that the analogy is misleading because it forces us to describe the present in terms that hide crucial differences, isn't that exactly what you mean by description capture? So why isn't that critic already on your side?"

   7. Target: The failure mode
      Question: "You say the characteristic failure of an analogy is not that it predicts badly but that it renders certain features unsayable. But isn't bad prediction often the result of description capture? For example, if we are captured by the 'Munich analogy' and describe every adversary as an appeasement-seeking dictator, we might fail to predict diplomatic solutions. So isn't prediction failure a key consequence of description capture?"
      Targets: Relationship between description capture and prediction failure.
      Likely Reply: She might agree that prediction failure can be a consequence but maintain that the root failure is the descriptive one, and prediction failure is derivative.
      Follow Up: "But if prediction failure is a common and observable consequence, why not focus on that as the primary failure? Doesn't that make the analogy's function as a premise more central than you allow?"

   8. Target: The alternative to premises
      Question: "If analogies are not premises, what is the logical structure of their use? Are they more like definitions, or metaphors, or something else? And how does that structure avoid the problems of premise-based use?"
      Targets: The positive account of the logical structure of analogies.
      Likely Reply: She might say that analogies are more like metaphors that structure our perception and language, and they avoid the problems of premise-based use by not making explicit claims that can be directly tested.
      Follow Up: "But don't metaphors also imply comparisons that can be evaluated as more or less apt? And doesn't that evaluation depend on premises about similarity? How is that different?"

   9. Target: The role of the historian
      Question: "What role do you see for historians in light of your account? If they are to avoid description capture, must they refrain from drawing any analogies? Or is there a way for them to use analogies that mitigates capture?"
      Targets: Implications for the practice of history.
      Likely Reply: She might say that historians can use multiple analogies to highlight different aspects and avoid capture by one, and they can be explicit about the limitations of the descriptive vocabulary.
      Follow Up: "But doesn't the use of multiple analogies risk creating confusion rather than clarity? And how can we know when we have enough analogies to avoid capture?"

   10. Target: The normative dimension
      Question: "Your account seems to be descriptive of how analogies function, but does it have a normative dimension? Should we try to avoid description capture, and if so, how?"
      Targets: Normative implications and avoidance strategies.
      Likely Reply: She might say that we should be aware of description capture and actively seek to use a diversity of analogies and vocabularies to describe complex situations.
      Follow Up: "But if every analogy brings its own capture, isn't the only way to avoid capture to avoid analogies altogether? And isn't that impossible?"

   Now, we must ensure at least two follow-ups are designed to close off the deflection that we have misunderstood the thesis. We can note:

     - In question 1, the follow-up challenges the distinction and might be met with "you're misunderstanding the centrality of vocabulary constraints" -> so we design the follow-up to press that point.
     - Alternatively, we can note that in the reflexive question (3) and the stalemate question (6), if she says we are misunderstanding, we have follow-ups that push back.

   Let's adjust two follow-ups to explicitly counter the "you misunderstood" deflection.

   For instance:

     In question 3 (reflexive): 
          Follow-up: "But if every descriptive framework, including your own, inevitably captures and obscures, how can we ever have a critical perspective on description capture itself? Doesn't that lead to an infinite regress?"

     This doesn't let her off by saying we misunderstood; it presses the point.

     In question 6 (stalemate):
          Follow-up: "But if a critic argues that the analogy is misleading because it forces us to describe the present in terms that hide crucial differences, isn't that exactly what you mean by description capture? So why isn't that critic already on your side?"

     This challenges her by showing that the critic might be doing what she advocates.

   We'll note that these two follow-ups are designed to close off the deflection.

   Now, we write the JSON.

   Note: We have 10 questions. We can number them 1 to 10.

   Let's write the guest_thesis sentence:

     "Historical analogies primarily function as descriptive frameworks that shape the vocabulary for understanding present situations, with their key failure being 'description capture'—rendering certain aspects of the present unsayable—and the traditional debate over historical lessons is stalemated because both sides treat analogies as premises for inference."

   Now, the JSON structure.
