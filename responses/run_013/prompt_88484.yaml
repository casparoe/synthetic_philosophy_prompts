prompt: |-
  Ok, weirdly specific question, but this has been eating at me for months. I got covid in early 2022 and my sense of smell never came back right — coffee smells like gasoline to me now, and a bunch of foods I used to love are just gross. It's been two and a half years and nothing has budged. The part that actually messes with my head is that I can't tell anymore whether coffee changed or I did. My girlfriend says coffee tastes exactly like it always did. I can't re-smell the old coffee and I can't get inside her nose, so nobody can really check.

  Anyway, I went down a rabbit hole and read Dennett's "Quining Qualia" paper, the one with the two coffee tasters, Chase and Sanborn, who both flip on coffee and then can't agree on whether the coffee changed or their taste buds did. He lays out the four things people want qualia to be — ineffable, intrinsic, private, and immediately given to you — and then argues that nothing could actually be all four, so the whole notion is an incoherent posit. As far as I can tell his point is that there's no fact of the matter about whether the coffee changed or I changed. Fine, I'll take it. But then what am I actually doing when I say coffee smells like gasoline? Is the smell not real? Is my report just a confused way of saying something else — like "my smell receptors are shot" dressed up as a claim about experience? Should I stop talking about it as if something changed?

  I want you to answer as a philosopher of mind who actually works on consciousness, not a generalist summarizing the debate. Start by brainstorming the different things someone could mean by "qualia don't exist" before you settle on anything, and be explicit about where you're reading Dennett in a way that other people who know this material would push back on. Keep the settled stuff seperate from the genuinely contested stuff, please — I don't want a contested reading of him handed to me as if it were the consensus.

  At the very end, give me a table with three columns: (1) the claim or assumption I made, (2) whether it's settled, contested, or just wrong, (3) what the actual situation is. Five or six rows, no filler.
