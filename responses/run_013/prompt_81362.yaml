prompt: |-
  I'm writing the final for a senior/grad seminar on fairness in machine learning (mixed CS and philosophy crowd), and one of the essay questions is going to be on the impossibility results — the ones where you can't have a calibrated score and equal error rates across groups at the same time once the groups have different base rates. Problem is everyone just regurgitates the proof from the slides. So I want the question built around a variant they haven't seen, so they have to actually reason rather than recite. It's closed book, they can't look anything up, so everything they need has to be in the stem.

  Here's the setup I want to use. Fix a binary outcome Y, a group attribute A in {0,1}, and a score S in [0,1]. Call the score calibrated within groups if, for every score value s in the support, P(Y = 1 | S = s, A = 0) = P(Y = 1 | S = s, A = 1) = s. Call it error-balanced if the two groups have equal false positive rates and equal false negative rates. The standard impossibility result says calibration plus error-balance forces the group base rates to be equal, or else the classifier to be degenerate. Now define the common support of the two groups as the set of score values s such that both groups have positive probability of producing a score near s. A student in office hours proposes this fix: 'the impossibility only bites because the two groups' score distributions sit on top of eachother. So require calibration and error-balance on the common support only, and let the classifier do whatever it wants off it. That's still a real constraint — it stops you treating similarly-scored people from the two groups differently — but it's one you can actually satisfy.' I want the question to ask whether the student is right that this escapes the impossibilty, and if so whether the resulting constraint is doing any real work. Second part: if they think the common-support move is a dodge, what would a repair have to look like? Third part, short: what does the whole episode show about what the impossibility result is actually a result about — the metric, the classifier, or the population?

  Can you write the question itself (stem, the setup as I gave it, three parts, marks broken out), then a model answer of 700-800 words pitched at a strong student in that course, then a marking scheme? For the scheme I want the must-hit points with the marks attached, and next to each one a one-line note on the mistake that typically costs students that mark. It's a 25-mark question, about 60 minutes. And keep the model answer honest about the bits that are genuinely arguable — I don't want it pretending there's a single textbook answer.
reasoning: |-
  We are creating an exam question that challenges students to reason about a variant of the fairness impossibility theorem. The variant restricts the fairness conditions to the common support of the two groups' score distributions. The question has three parts:

  Part 1: Is the student's claim correct? That is, does requiring calibration and error-balance only on the common support avoid the impossibility result? And if so, does the constraint (calibration and error-balance on the common support) actually do any real work? (10 marks)

  Part 2: If the common-support move is seen as a dodge, what would a repair have to look like? (10 marks)

  Part 3: What does the whole episode show about what the impossibility result is actually a result about — the metric, the classifier, or the population? (5 marks)

  We are to write the stem (the setup), then the three parts. Then provide a model answer (700-800 words) and a marking scheme.

  ### Stem (Setup)

  Consider a binary outcome \(Y \in \{0,1\}\), a group attribute \(A \in \{0,1\}\), and a score \(S \in [0,1]\). The score \(S\) is said to be **calibrated within groups** if, for every score value \(s\) in the support of \(S\) and for each group \(a \in \{0,1\}\), we have \(P(Y=1 | S=s, A=a) = s\). The score is **error-balanced** if the false positive rate (FPR) is equal across groups and the false negative rate (FNR) is equal across groups. The standard impossibility result shows that if the base rates (i.e., \(P(Y=1|A=0)\) and \(P(Y=1|A=1)\)) are unequal, then a non-degenerate classifier cannot be both calibrated within groups and error-balanced.

  A student proposes the following: "The impossibility only occurs because the two groups' score distributions might not have the same support. Instead, let us require calibration and error-balance only on the **common support** of the two groups. The common support is defined as the set of score values \(s\) for which both groups have positive probability density (for continuous scores) or positive probability (for discrete scores) in every neighborhood of \(s\). Off the common support, the classifier can behave arbitrarily. This constraint still ensures that similarly-scored individuals from both groups are treated similarly on the scores that both groups actually exhibit, but it avoids the impossibility."

  ### The Question

  **Part 1 (10 marks):** Is the student correct that this modified requirement (calibration and error-balance on the common support only) avoids the impossibility result? If so, does the constraint (calibration and error-balance on the common support) actually do any real work? Explain your reasoning.

  **Part 2 (10 marks):** If you believe the common-support move is a dodge (i.e., it does not address the fundamental issue), what would a repair have to look like? That is, what kind of alternative fairness definition or constraint might avoid the impossibility without resorting to such a restriction? Explain.

  **Part 3 (5 marks):** What does this entire discussion reveal about what the standard impossibility result is fundamentally highlighting — is it about the metrics (calibration and error-balance), the classifier, or the population? Briefly explain.

  ---

  ### Model Answer (700-800 words)

  **Part 1: Evaluating the Common-Support Move**

  The student's proposal to restrict calibration and error-balance to the common support does avoid the standard impossibility result. However, the constraint does little real work in achieving fairness when the base rates differ because the common support might be very small or even empty, rendering the conditions vacuous.

  To see why the impossibility is avoided, consider that the standard proof relies on the entire support. The proof (as in the original Barocas et al. or Kleinberg et al.) shows that calibration and error-balance together imply that the base rates must be equal. The key step involves integrating the calibration condition with the error rates. But if the conditions are only required on the common support, then outside this set we are free to set the classifier arbitrarily. Therefore, we can adjust the score distribution off the common support to satisfy the error-balance condition without affecting the calibration on the common support.

  For example, suppose group 0 has a base rate of 0.3 and group 1 has a base rate of 0.7. The common support might be an interval [0.4, 0.6]. On this interval, we set the calibrated scores for both groups: for any s in [0.4,0.6], P(Y=1|S=s, A=0)=s and similarly for A=1. Now, to achieve error-balance, we need to set the distributions off the common support. We can set the score distribution for group 0 to have a high density below 0.4 (so that the scores for group 0 are mostly low) and for group 1 to have a high density above 0.6 (so that their scores are mostly high). Then, by setting thresholds appropriately (say, at 0.5), we can get the same FPR and FNR for both groups. Specifically, we can set the mass of group 0 above the threshold to be such that the FPR and FNR match group 1's, by adjusting the tails.

  However, the real issue is whether this constraint does meaningful work. The problem is that the common support might be very limited. If the two groups have disjoint supports (for instance, group 0 only has scores in [0,0.5] and group 1 in [0.5,1]), then the common support is empty and the conditions are trivially satisfied. Even if there is some overlap, the common support might be a small interval, and then the calibration condition only applies to a small portion of the population. The error-balance condition, being a global condition, is then satisfied by manipulating the parts of the distribution not in the common support. Thus, the requirement of calibration on the common support does not constrain the classifier in any substantial way for the rest of the distribution. This means that individuals with scores outside the common support might be treated arbitrarily differently across groups, which could lead to unfairness.

  Therefore, the student is technically correct that the impossibility is avoided, but the constraint is weak and does not ensure a meaningful form of fairness when the common support is small. The move essentially dodges the problem by pushing the hard part of the distribution to the tails where no constraints apply.

  **Part 2: What a Repair Might Look Like**

  If we consider the common-support move a dodge, then a genuine repair would require a fundamental change in the fairness criteria. One approach is to relax the strict equality of error rates and instead look for other forms of balance that are compatible with calibration. For instance, we might require that the error rates are not equal but are as close as possible given the base rate difference, or we might use a different measure of error balance such as equal opportunity (which requires equal true positive rates) or predictive parity (which requires equal positive predictive values). However, these are also subject to their own impossibility results when combined with calibration.

  A more promising repair is to move away from group fairness metrics and consider individual fairness, which requires that similar individuals receive similar scores. This might be combined with calibration. But note that individual fairness is difficult to define and measure.

  Alternatively, we might accept that we cannot satisfy both calibration and error-balance and instead aim for a trade-off. One could use a metric that combines both, such as a weighted sum, and then minimize the combined loss. However, this does not avoid the impossibility but rather acknowledges it and seeks a compromise.

  Another approach is to question the requirement of calibration. In many real-world settings, calibration might not be strictly necessary. We might require approximate calibration, or calibration only at certain levels (e.g., at the threshold). Similarly, we might relax error-balance to approximate equality.

  But a deeper repair might involve causal reasoning. If the difference in base rates is due to structural inequities, then a fairness intervention might require adjusting the base rates by intervening on the causal factors. However, this goes beyond the classifier and into the data generation process.

  In summary, a repair would likely involve either:
  - Choosing one fairness criterion over the other (e.g., prioritize calibration and then minimize the disparity in error rates, or vice versa).
  - Using a completely different notion of fairness that is compatible with base rate differences (e.g., sufficiency or separation alone, without requiring both simultaneously).
  - Accepting that in the presence of base rate differences, we must tolerate some disparity and focus on minimizing harm.

  **Part 3: What the Impossibility Result Reveals**

  The impossibility result fundamentally highlights a conflict between two desirable properties (calibration and error-balance) that we might want from a classifier when applied to populations with different base rates. It is not about the classifier per se, because the result holds regardless of the classifier's design (as long as it is non-degenerate). Nor is it solely about the population, because the population's base rates are a given. Instead, the result is about the metrics: it shows that these two metrics (calibration and error-balance) are mutually exclusive in the presence of base rate disparities. Therefore, the result forces us to recognize that we cannot have both and must choose which metric to prioritize. This choice is inherently normative and depends on the context and the values we wish to uphold.

