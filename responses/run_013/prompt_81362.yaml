  ### Marking Scheme (Total 25 marks)

  #### Part 1 (10 marks)

  1. **Correctly states that the impossibility is avoided (2 marks).**  
     *Missed if the answer says the student is wrong about avoiding impossibility.*

  2. **Explains why the impossibility is avoided (3 marks):**  
     *Because the conditions are only enforced on the common support, leaving freedom off the support to adjust the score distributions to meet error-balance without violating calibration on the common support.*  
     *Typical mistake: Failing to explain how the off-support region can be used to satisfy error rates.*

  3. **Discusses whether the constraint does real work (3 marks):**  
     *Notes that if the common support is small or empty, the constraint is weak and may not ensure meaningful fairness.*  
     *Typical mistake: Only stating that it avoids impossibility without evaluating the strength of the constraint.*

  4. **Gives an example or argument about the common support being small (2 marks):**  
     *For instance, if the supports are disjoint, the conditions are vacuously satisfied, and then the classifier can be arbitrarily unfair. Or if the common support is limited, then only a small portion of the population is constrained.*  
     *Typical mistake: Not providing an example or not discussing the implications of a small common support.*

  #### Part 2 (10 marks)

  1. **States that the move is a dodge (or not) and that a repair must change the criteria (2 marks):**  
     *Accept either view as long as argued, but the model answer takes the position that it is a dodge. If the student argues it is not, they must justify how it does real work.*  
     *Typical mistake: Not taking a clear position.*

  2. **Proposes at least two alternative approaches for a repair (4 marks, 2 each):**  
     *For example: (a) relaxing to approximate fairness, (b) using a different fairness metric (e.g., equal opportunity), (c) individual fairness, (d) causal interventions, (e) trade-off solutions.*  
     *Typical mistake: Only one idea or ideas that are not feasible.*

  3. **Explains why the proposed alternatives avoid the problem (4 marks):**  
     *For each alternative, a brief explanation of how it addresses the fundamental issue. For example, using equal opportunity (TPR) instead of FPR/FNR might be compatible with calibration if we don't require both FPR and FNR to be equal. Or, approximate conditions allow for small violations.*  
     *Typical mistake: Listing alternatives without explanation.*

  #### Part 3 (5 marks)

  1. **Identifies the core issue as the metrics (3 marks):**  
     *The result is about the incompatibility of calibration and error-balance when base rates differ, not about the classifier or the population per se.*  
     *Typical mistake: Blaming the population or the classifier.*

  2. **Draws the normative implication (2 marks):**  
     *The result forces a choice between fairness criteria, and that choice is value-laden.*  
     *Typical mistake: Not mentioning the normative aspect or the need to choose.*
answer: |-
  ### Exam Question: Fairness in Machine Learning Impossibility Result Variant

  **Stem:**  
  Consider a binary outcome \(Y \in \{0,1\}\), a group attribute \(A \in \{0,1\}\), and a probabilistic score \(S \in [0,1]\). The score \(S\) is **calibrated within groups** if, for every \(s\) in the support of \(S\), \(P(Y=1 \mid S=s, A=0) = P(Y=1 \mid S=s, A=1) = s\). The score is **error-balanced** if the false positive rates (FPR) and false negative rates (FNR) are equal across groups: \(P(S \geq t \mid Y=0, A=0) = P(S \geq t \mid Y=0, A=1)\) and \(P(S < t \mid Y=1, A=0) = P(S < t \mid Y=1, A=1)\) for a threshold \(t\). The standard impossibility result states that if the group base rates \(P(Y=1 \mid A=0)\) and \(P(Y=1 \mid A=1)\) differ, no non-degenerate classifier can simultaneously satisfy calibration and error-balance.  

  A student proposes a solution: "The impossibility arises because the score distributions for \(A=0\) and \(A=1\) overlap entirely. Instead, require calibration and error-balance **only on the common support**, defined as the set of \(s\) values where both groups have positive probability density (for continuous \(S\)) or positive probability mass (for discrete \(S\)) in any neighborhood of \(s\). Off the common support, let \(S\) behave arbitrarily. This ensures similarly scored individuals from both groups are treated equally where scores overlap, but avoids impossibility."  

  **Part 1 (10 marks):**  
  Is the student correct that this modification avoids the impossibility result? If yes, does the constraint (calibration and error-balance on the common support) achieve meaningful fairness? Explain rigorously.  

  **Part 2 (10 marks):**  
  If you believe the common-support requirement is a "dodge" (i.e., it fails to resolve the core fairness conflict), sketch a repair: What alternative constraint(s) or fairness definition(s) could genuinely address the impossibility? Justify your proposal.  

  **Part 3 (5 marks):**  
  Briefly explain what this episode reveals about what the standard impossibility result fundamentally depends on: the choice of fairness metrics, the classifier’s design, or the population’s properties.  

  ---

  ### Model Answer (Approx. 750 words)  

  **Part 1: Avoiding Impossibility and Meaningfulness of the Constraint**  
  The student is technically correct that restricting calibration and error-balance to the common support avoids the impossibility result, but the constraint does minimal "real work" for fairness when base rates differ.  

  *Why impossibility is avoided:*  
  The standard proof (e.g., Chouldechova, 2017) relies on the law of total probability applied to the *entire* support. For example, FPR for group \(A=a\) is \(P(S \geq t \mid Y=0, A=a) = \int_{s \geq t} P(S=s \mid Y=0, A=a)  ds\). With calibration, \(P(Y=1 \mid S=s, A=a) = s\), which links score distributions to base rates. Crucially, if calibration and error-balance hold only on the common support \(C\), the score distributions outside \(C\) can be manipulated freely. For instance, if group \(A=0\) has a low base rate and \(A=1\) a high base rate, we can:  
  - Set \(S\) for both groups to be calibrated on \(C\) (e.g., \(C = [0.3, 0.7]\)).  
  - Assign \(A=0\)’s "excess" low-risk mass to scores \(< \min(C)\) (e.g., \(s = 0.1\)) and \(A=1\)’s high-risk mass to scores \(> \max(C)\) (e.g., \(s = 0.9\)).  
  By tuning the off-support mass, we equalize FPR/FNR without affecting on-support calibration. For example, adjusting the density of \(S<0.3\) for \(A=0\) lowers its FPR to match \(A=1\)’s FPR. Thus, no contradiction arises.  

  *Does the constraint do real work?*  
  Minimally. The common support \(C\) may be small or empty, reducing the constraint to near-vacuousness:  
  - If \(C\) is empty (e.g., disjoint score distributions), calibration and error-balance are trivially satisfied (no \(s\) to constrain), allowing arbitrary discrimination.  
  - If \(C\) is non-empty but narrow (e.g., \(C = \{0.5\}\)), calibration forces \(P(Y=1 \mid S=0.5, A=0) = P(Y=1 \mid S=0.5, A=1) = 0.5\), but this affects few individuals. Error-balance is achieved via off-support manipulation, which dominates the rates.  
  Even with large \(C\), off-support regions can harbor inequities: A low-scoring individual from \(A=0\) might be denied (high FNR) while a similarly scoring \(A=1\) individual (off-support) is accepted. The proposal thus "solves" impossibility mathematically but fails to ensure group fairness. It is a procedural fix that neglects distributional disparities.  

  **Conclusion:** The student is right about avoiding impossibility, but the constraint lacks substance when base rates differ.  

  **Part 2: Repairing the Dodge**  
  The common-support move is a dodge because it evades the core conflict: calibration and error-balance measure incompatible *population-level* properties when base rates differ. A repair should either:  
  1. **Reframe the fairness goals:** Replace error-balance with a metric compatible with calibration under base rate differences. For example:  
     - *Equal opportunity* (equal TPR): While incompatible with calibration per standard results, it can be paired with *sufficiency* (calibration) if we relax group-wise parity. Some argue this is ethically preferable when base rate differences reflect historical inequities (e.g., lending decisions).  
     - *Cost-sensitive fairness:* Introduce asymmetric costs for FPR/FNR errors and minimize overall cost, acknowledging that "fairness" may require unequal error rates.  
     - *Causal fairness:* If base rate differences stem from unjust confounding (e.g., \(A \rightarrow Y\)), use causal models to define fairness via path-specific effects. For example, ensure calibration after adjusting for discriminatory variables (Kilbertus et al., 2017).  

  2. **Accept approximate satisfaction:**  
     - Require \(\epsilon\)-calibration (e.g., \(|P(Y=1 \mid S=s, A=a) - s| < \epsilon\)) and \(\delta\)-error-balance (e.g., \(|\text{FPR}_{A=0} - \text{FPR}_{A=1}| < \delta\)). This accepts inherent trade-offs but provides no guarantee of meaningful fairness when \(\epsilon, \delta\) are large.  

  3. **Shift to individual fairness:**  
     - Replace group fairness with Dwork et al.’s (2012) individual fairness: "Similar individuals receive similar scores." Combine this with calibration, though defining "similarity" is challenging. This avoids group-level contradictions but may not address systemic disparities.  

  A principled repair must confront the value judgment: Should we force equal errors (error-balance) or equal risk assessments (calibration) when base rates differ? Neither is universally "correct"; the choice depends on context (e.g., criminal justice vs. healthcare). The repair should thus integrate domain ethics, not just mathematics.  

  **Part 3: Fundamental Lesson of the Impossibility Result**  
  This episode shows that the impossibility result is primarily about the *fairness metrics*, not the classifier or population. Calibration and error-balance encode distinct, often conflicting, normative ideals:  
  - Calibration ensures scores reflect actual risk (e.g., "If \(S=0.2\), 20% should have \(Y=1\)").  
  - Error-balance ensures equal error burdens across groups.  
  When base rates (a population property) differ, these metrics clash because they impose mathematical constraints that cannot align (via the law of total probability). The classifier is merely the vessel exposing this conflict—it cannot resolve it. Thus, the result highlights that no classifier can satisfy both metrics under realistic population disparities, forcing us to choose which metric aligns with our ethical priorities.  

  ---

  ### Marking Scheme (25 marks total)  

  **Part 1 (10 marks)**  
  1. **States that impossibility is avoided** [2 marks]  
     - *Missed if:* Answer claims the student is wrong.  
  2. **Explains why (e.g., off-support manipulation)** [3 marks]  
     - *Typical mistake:* Only restates the proposal without mathematical intuition.  
  3. **Argues constraint lacks substance (e.g., small/empty \(C\))** [3 marks]  
     - *Typical mistake:* Claims it "works" without addressing edge cases.  
  4. **Notes trade-off (e.g., off-support inequities)** [2 marks]  
     - *Typical mistake:* Omits real-world fairness implications.  

  **Part 2 (10 marks)**  
  1. **Identifies move as a dodge (or defends why not)** [2 marks]  
     - *Typical mistake:* Unclear stance.  
  2. **Proposes 1–2 repairs (e.g., alternative metrics)** [4 marks]  
     - *Typical mistake:* Vague suggestions (e.g., "change the classifier").  
  3. **Justifies how repairs address core conflict** [4 marks]  
     - *Typical mistake:* Repairs ignore base rates or metrics incompatibility.  

  **Part 3 (5 marks)**  
  1. **Attributes result to metrics, not classifier/population** [3 marks]  
     - *Typical mistake:* Blames population ("base rates cause it").  
  2. **Connects to normative choice** [2 marks]  
     - *Typical mistake:* No ethical implication.  

  **Word Limit Note:** Model answer fits ~750 words; students should concisely hit key points. Arguments with reasonable alternatives (e.g., in Part 2) are acceptable if justified.
