answer: |-
  ## Research Proposal: Disaggregating Comparison in the Ranking of Historical Evils  

  **1. Research Question:**  
  Can the moral legitimacy of comparing historical evils be resolved by distinguishing four operations within "comparison" (ordering, scaling, adjudicating, expressive ranking), and does this separation show that *ordering* is defensible while *scaling* and *expressive ranking* attract the "obscenity charge," leaving adjudication as the unresolved core stake?  

  **Why existing positions fail:** The commensurabilist defense of ranking targets *ordering* (a) and *scaling* (b) as necessary for moral reasoning, while incommensurabilist objections focus on the perceived obscenity of *scaling* (b) and *expressive ranking* (d). The debate stagnates because neither side acknowledges these distinct operations—each argues past the other by attacking or defending different components.  

  **2. Core Hypothesis:**  
  Ordering evils (A is worse than B) is a minimal, defensible act of moral judgment; scaling (quantifying "how much worse") and expressive ranking (treating ranking as a performative act) are the true targets of the obscenity charge. Adjudication (using order to allocate resources or blame) is where the moral stakes lie—but current conflations prevent progress.  

  **3. Methodology: Conceptual Taxonomy**  
  A formal model (e.g., decision theory) would presuppose commensurability, begging the question. Close readings of atrocities risk conflating empirical horror with conceptual structure. A taxonomy clarifies the *architecture* of comparison itself, isolating operations to test their logical independence and moral implications.  

  **4. Six-Month Work Plan (Part-Time):**  
  - **Month 1:** Refine the four-operation framework. *Deliverable:* Precise definitions of (a) ordering, (b) scaling, (c) adjudication, (d) expressive ranking, with examples (e.g., Holocaust vs. Atlantic slavery debates).  
  - **Month 2:** Analyze why existing scholarship conflates operations. *Deliverable:* Map commensurabilist arguments to (a)/(b) and incommensurabilist objections to (b)/(d).  
  - **Month 3 (Load-Bearing Step):** Test whether *ordering* requires *scaling*. *Key task:* Can "A is worse than B" be sustained without a common measure? (e.g., lexical priority, thresholds, or paradigmatic cases). *Risk:* If ordering collapses into scaling, the project fails.  
  - **Month 4:** Apply the taxonomy to 1–2 user-supplied cases. *Deliverable:* Show how separating operations changes moral verdicts (e.g., ordering might be defensible in Case X, while scaling remains obscene).  
  - **Month 5:** Steelman the strongest counterargument: That the "obscenity charge" is itself a moral claim that *all* ranking expresses hubris or desecration. *Task:* Defeat this only if expressive ranking (d) can be isolated as optional.  
  - **Month 6:** Synthesize findings for adjudication (c). *Deliverable:* Framework for when ordering can guide action without scaling or expressive acts.  

  **5. Expected Outcomes & Failure Modes:**  
  - **Success:** A peer-reviewed paper proving:  
    - Ordering is separable from scaling/expressive acts.  
    - Adjudication can proceed using ordering alone.  
    - One case study where separation resolves a stalemate.  
  - **Failure:**  
    - Ordering cannot exist without scaling (collapsing the taxonomy).  
    - All four operations are inseparable in practice.  
    - The obscenity charge attaches equally to all forms of comparison.  

  **6. Why Philosophy (Not Empirical Work) Progresses:**  
  The dispute hinges on whether comparison *can* be legitimate—a question about moral concepts, not historical facts. No new archival research can answer whether scaling is inherently obscene; this requires conceptual disentanglement.  

  **7. Scope Management:**  
  Output is one journal article (not a book). Focus is the taxonomy’s application to *one* argument: that separating operations defuses the ranking debate. No comprehensive theory of value will be constructed.  

  ---  
  **Proposal Strength:** This project resolves a deadlock by clarifying what "comparison" means. Success offers a practical path forward: Societies *can* use moral ordering to allocate resources (adjudication) without demanding quantification (scaling) or performative hierarchy (expressive ranking). Failure still advances the debate by exposing conceptual inseparability as the core problem.
