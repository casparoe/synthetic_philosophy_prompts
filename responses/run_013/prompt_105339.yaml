prompt: |-
  I'm a journalist who covers philosophy and the human sciences, and I'm about six months into a feature about the way people tell each other they have no reason to do things — the whole "thats not a reason, thats an excuse" genre of argument, which it turns out is a live fight in philosophy and not just something my relatives do at dinner. I've got the cartoon version of the internal/external reasons split: internalists think a reason has to hook onto something the agent already cares about, externalists think it doesn't. What I want is the version that isn't a cartoon, and especially the part I never see laid out properly, which is that there are three or four quite different theses all called "internalism" that get used interchangeably in the secondary stuff I've been reading. There's the Williams-style claim about what reason-statements mean, tied to an agents existing motivational set and whatever sound deliberation could get out of it; there's the metaethical claim that sincerely judging something right necessarily motivates you (or does so unless you're depressed, or a psychopath, or just very tired); and there's the Humean claim about motivation always needing some prior desire behind it. I'm fairly sure these are supposed to come apart, but every time I draft the paragraph that distinguishes them I end up writing something that collapses two of them into each other.

  So: can you walk me through what actually separates them — what each thesis is a claim about (the semantics of reason-talk, the psychology of moral judgment, the mechanics of action), which ones entail which and which are merely neighbours, and a concrete case where someone plainly satisfies one and plainly violates another? And then the thing I really can't get straight: the internalist formulation that says an agent has a reason to X if she would be motivated to X were she to deliberate soundly starting from the motivations she already has. That counterfactual seems to be doing something sneaky — either the soundly-deliberating agent isn't quite the same person anymore, or the deliberation can only ever shuffle around desires she already had, so the thesis comes out either false or empty — but I can't put my finger on the exact problem, and I have a suspicion philosophers have a name for it. No need for a reading list, I'm not going to cite anybody, I just want the conceptual map and the case.
reasoning: |-
  Okay, the user is a journalist working on a feature about how people dismiss actions as excuses rather than reasons. They're deep into the internal/external reasons debate in philosophy but struggling to differentiate between three types of internalism that often get conflated: Williams-style internalism, motivational internalism in metaethics, and the Humean theory of motivation. 

  Hmm, they've clearly done their homework—they've identified key distinctions but keep collapsing them when drafting. Their frustration is palpable. The core ask is crystal clear: they want a conceptual map showing how these theses differ in subject matter (semantics vs. psychology vs. action mechanics), their logical relationships, and a concrete case where someone satisfies one but violates another. 

  Ah, and there's that nagging skepticism about Williams' counterfactual—they sense it's either question-begging or vacuous but can't articulate why. Smart catch. That's the "conditional fallacy" objection philosophers discuss. Need to unpack that carefully. 

  First, let's disentangle the three internalisms:  
  - **Williams' Internalism** (semantic/normative): About what "has a reason" means. Tied to an agent's subjective motivational set + sound deliberation.  
  - **Motivational Internalism** (metaethical): Moral judgment intrinsically motivates. Exceptions allowed.  
  - **Humean Theory of Motivation** (psychological): Beliefs alone can't motivate; desire must be present.  

  Key insight: These operate at different altitudes. Williams is about reason statements, motivational internalism is about moral psychology, Humeanism is about action causation. They're neighbors, not twins.  

  For the concrete case: Imagine Anya, the depressed ethicist.  
  - She *judges* donating to famine relief morally right (so motivational internalism fails—no motivation follows).  
  - She *has* a desire to alleviate suffering (S) but depression blocks connection. Williams' sound deliberation *would* activate S → motivation to donate. So Williams says she *has a reason*.  
  - Hume smiles: Her *actual* motivation to donate requires desire (S exists!). But motivational internalism is falsified because judgment didn't spark motivation.  

  Now the counterfactual trap in Williams:  
  If sound deliberation *adds* new motivations (e.g., "you'd care if rational!"), it smuggles in externalism. If it only reshuffles existing S, it might not reach the "right" conclusion (e.g., if S is vile). Hence the dilemma: vacuous or false. Philosophers call this the **conditional fallacy**—evaluating a person's reasons via a hypothetical version of themselves who might not share their core attributes.  

  User's instinct is sharp. The counterfactual's success depends entirely on how "sound deliberation" is defined... which risks circularity. That's why externalists pounce here.  

  ...Better emphasize that these theses are modular. One can endorse Humeanism but reject Williams (e.g., moral realists). Or accept Williams but reject motivational internalism (Anya's case). The conflation in secondary literature does everyone a disservice.  

  Final note: User's "cartoon version" quip suggests they want precision without jargon. Need to keep examples visceral (depressed ethicist, corrupt politician) and label each thesis's domain explicitly. Their readers won't care about philoso-babble—just the human drama of reasons vs. excuses.
answer: |-
  Here's the conceptual map you need, separating the three distinct "internalisms" and addressing Williams' counterfactual dilemma. Think of these as three different species often mistakenly grouped under one genus:

  ### 1. **Bernard Williams-Style Internalism (Semantic/Normative)**
      *   **Claim About:** The *meaning* of statements like "A has a reason to φ." What it *is* for a reason to *exist for* an agent.
      *   **Core Thesis:** "A has a reason to φ" is true *only if* A could reach the motivation to φ by *sound deliberation* starting from their *"subjective motivational set" (S)*. S includes desires, dispositions, commitments, projects – anything that can motivate.
      *   **Scope:** Normative reasons (what an agent *should* do, relative to their S).
      *   **Mechanism:** "Sound deliberation" = rational procedures applied to S (e.g., identifying relevant beliefs, considering consistency, means-end reasoning, resolving conflicts, imagining consequences). It *uncovers* or *activates* potential motivations latent in S; it *does not create fundamentally new elements* not connected to S.
      *   **Key Point:** It's a claim about the *truth conditions* of reason-attributions. External reasons claims are *false* or *incoherent*.

  ### 2. **Motivational Internalism (Metaethical/Psychological)**
      *   **Claim About:** The necessary connection between *making a sincere moral judgment* and being *motivated* to act accordingly.
      *   **Core Thesis:** If A sincerely judges that "It is morally right for me to φ," then A is necessarily *motivated* to φ (at least to some degree), *unless* A is practically irrational (e.g., suffering weakness of will, depression, exhaustion, psychopathy).
      *   **Scope:** Moral judgments specifically.
      *   **Mechanism:** The judgment *itself* carries motivational force. Motivation is internal to the moral faculty.
      *   **Key Point:** It's a claim about the *nature of moral judgment*. Denying this link often leads to non-cognitivism (moral judgments are expressions of feeling/command) or externalism (motivation requires an independent desire).

  ### 3. **Humean Theory of Motivation (Psychological)**
      *   **Claim About:** The *causal mechanics* of intentional action. What *actually moves* an agent to act.
      *   **Core Thesis:** Beliefs *alone* cannot motivate action. Motivation requires a *pre-existing desire* (or pro-attitude) *in conjunction with* a relevant belief. The "Desire + Belief" model: Desire provides the goal-direction, belief provides the roadmap.
      *   **Scope:** All intentional action.
      *   **Mechanism:** Desires are the necessary "engine" of motivation. Reasoning (belief manipulation) is the "steering wheel."
      *   **Key Point:** It's a claim about the *causal psychology* of action. It's descriptive, not normative.

  ### How They Relate (and Don't)

  *   **Distinct Domains:** Williams is about *meaning/norms* (What *is* a reason?); Motivational Internalism is about *moral psychology* (What does moral judgment *do*?); Humeanism is about *action theory* (What *causes* action?).
  *   **Entailments?** None strictly *entail* another. They are logically separable.
      *   You can accept Humeanism (motivation needs desire) but reject Williams (reasons might still exist externally, even if motivation requires internal desire). Many moral realists do this.
      *   You can accept Williams (reasons depend on S) but reject Motivational Internalism (someone could judge φ morally right but lack motivation because nothing in S connects via deliberation). Williams himself did this.
      *   You can accept Motivational Internalism (moral judgment motivates) but reject Humeanism (if you think moral judgments *are* a special kind of motivating belief). Some Kantians/Rationalists do this.
      *   You can accept Motivational Internalism and Humeanism but reject Williams (moral judgment provides the motivating desire, but reasons exist externally).
  *   **Common Ground/Neighbors:** All emphasize the *agent's perspective* in motivation/normativity. Humeanism provides a *possible psychological basis* for Williams' focus on S. Motivational Internalism might *explain* why some reasons (moral ones) seem especially compelling *if* linked to S. But these are affinities, not entailments.

  ### The Concrete Case: Anya the Depressed Ethicist

  *   **Anya's Situation:** Anya is a dedicated ethicist who firmly believes donating a significant portion of her income to effective famine relief (*φ*) is morally right and obligatory. However, she is experiencing severe clinical depression, characterized by profound anhedonia and apathy. She has a standing, deep-seated desire to alleviate suffering (part of her S).
  *   **Analysis:**
      1.  **Williams (Semantic):** *Does Anya have a reason to donate?* **Yes (Plausibly).** Sound deliberation starting from her S (desire to alleviate suffering) + relevant true beliefs (donating effectively alleviates suffering) would lead her to be motivated to donate. The depression *blocks* access to this motivation, but the *reason exists* because the *potential* motivation is latent within S + sound deliberation. Williams might say she *has* the reason but her depression prevents her from *acting* on it or *feeling* it.
      2.  **Motivational Internalism (Metaethical):** *Does Anya's sincere moral judgment motivate her?* **No.** Despite sincerely judging donating to be morally obligatory, her depression renders her completely unmotivated to donate (or do much of anything). She violates the "necessarily motivates" clause, even accounting for irrationality (depression is the excusing condition). Her judgment *fails* to motivate.
      3.  **Humean Theory (Psychological):** *What would motivate Anya to donate?* **A desire + belief.** Her *existing desire* to alleviate suffering + her *belief* that donating is effective *could* motivate her. Crucially, the Humean *isn't* blocked by the depression itself - the desire *is* there in S, the belief is there. The depression acts like a physiological/psychological *barrier* preventing the desire+belief combo from generating the *felt motivation* and action. The Humean structure (desire needed) is still satisfied; the engine exists but isn't firing due to external blockage. The Humean doesn't claim desires always *succeed* in motivating, just that they are *necessary*.

  **Anya Satisfies:** Williams (Has a reason), Humeanism (The required desire *exists* in her S).
  **Anya Violates:** Motivational Internalism (Moral judgment doesn't motivate).

  ### The Williams Counterfactual Trap: The Conditional Fallacy

  You've pinpointed the core criticism. The formulation is: *"A has a reason to φ if A would be motivated to φ if she deliberated soundly from her S."*

  *   **The Dilemma:**
      1.  **"Isn't the Same Person" (False/Externalist):** If "sound deliberation" allows introducing *fundamentally new* evaluative elements *not* derivable from S (e.g., "if you were fully rational, you'd value Kantian duty intrinsically"), then the motivation comes from this *new* element, not S. This violates Williams' core internalism – it smuggles in external reasons. The counterfactual person *isn't* A anymore; she's A+. The thesis becomes false (or covertly externalist).
      2.  **"Only Shuffles Desires" (Possibly Empty/Trivial):** If "sound deliberation" is *strictly limited* to means-end reasoning, information gathering, and consistency checks *only* on the *existing, actual* contents of S, then:
          *   It might *not* lead to motivation to φ if nothing in S provides even a distant hook (e.g., S contains only selfish desires; sound deliberation won't magically create altruism).
          *   It seems trivial: the reason just *is* whatever the agent would end up motivated to do after thinking straight. It risks collapsing into "A has a reason to φ iff A is (or could be) motivated to φ," losing its normative bite. It doesn't explain why we feel reasons can *criticize* S.

  *   **The Philosopher's Name:** This is known as the **Conditional Fallacy** objection to dispositional/counterfactual analyses (like Williams'). The fallacy lies in evaluating a property of the *actual* agent (A's reasons) based on a hypothetical scenario (A-in-condition-C) where A is altered in ways that might *change the very basis* of the property being evaluated. Defining "sound deliberation" in a way that *guarantees* motivation to φ often requires building the *conclusion* (φ-ing is required) into the *premises* (the definition of "sound"), making the analysis circular or question-begging. (Philosophers like Michael Smith and Jean Hampton pressed this hard).

  *   **The Sneaky Part:** The counterfactual tries to be both *internal* (starts from S) and *normative* ("sound" implies correctness). The tension arises in defining "sound." If "sound" means "procedurally rational relative to S," it might not yield the "right" motivation. If "sound" means "leading to the *correct* conclusion," it likely smuggles in external standards. Williams aimed for the first, but critics argue it fails to capture normativity; defenders argue the normativity comes precisely from the *best application of the agent's own S*.

  **In short:** You're grappling with distinct theses often conflated. Williams defines *reasons* via counterfactual motivation derived from existing S. Motivational Internalism links *moral judgment* to motivation. Humeanism explains *action* requiring desire. Anya shows how one can satisfy Williams & Humeanism while violating Motivational Internalism. Williams' counterfactual is vulnerable to the Conditional Fallacy – defining "sound deliberation" without circularity or externalist baggage is its Achilles' heel. Keep wrestling with that counterfactual; it's where the real philosophical blood is spilled.
