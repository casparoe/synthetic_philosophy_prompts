answer: |-
  ### Exam Question: Philosophy of Biology Final Essay (90 minutes)

  **Question:**  
  Analyze the case of the "copper reed frog," focusing on the forearm gland in three populations:  
  1. **Ancestral Population:** Gland secretion prevented infection from mating wounds (directly selected for antimicrobial properties).  
  2. **Derived Population:** Pathogen extinct; secretion now increases female receptivity (sexually selected for mating success).  
  3. **Lab Colony:** Germ-free, random mating; secretion occurs but has no measurable effect on survival or reproduction.  

  Additionally, consider **blocked-duct males** in the derived population: gland tissue is intact but no secretion occurs.  

  Address the following:  
  **(a)** What is the *function* of the gland in each population (ancestral, derived, lab) according to:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) *Causal-role accounts* (focus on current causal contributions to system capacities)?  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) *Etiological accounts* (distinguishing between *any* past selection and *recent/relevant* selection under current conditions)?  
  **(b)** How does each account classify the gland in **blocked-duct males**?  
  **(c)** Which family of accounts (causal-role or etiological) provides the most coherent analysis of this case overall? Defend your position, explicitly addressing trade-offs (e.g., stability vs. flexibility, handling edge cases).  

  *Do not simply define theories; apply them rigorously to the case. Avoid reductive analogies (e.g., "like the heart").*

  ---

  ### Model Answer (Approx. 600 words)

  **(a) Functional Attributions:**  
  *(i) Causal-role accounts* assign function based on a component’s *current* causal contribution to a containing system’s capacities.  
  - **Ancestral:** Function is infection prevention (secretion actively inhibits pathogens).  
  - **Derived:** Function is mate attraction (secretion triggers receptivity).  
  - **Lab:** *No function*. Secretion exists but plays no causal role in survival/reproduction.  
  - **Blocked-duct males:** *No function*. Without secretion, the gland contributes nothing to the system.  

  *(ii) Etiological accounts* assign function based on evolutionary history. Two variants must be distinguished:  
  - **"Any-history" etiological view:** Function is what the trait was *ever* selected for.  
  &nbsp;&nbsp;→ Ancestral & Derived: Function is infection prevention (original selection).  
  &nbsp;&nbsp;→ Lab: Function is infection prevention (historical selection persists).  
  &nbsp;&nbsp;→ Blocked-duct: *Malfunction* (trait fails to perform its historically selected role).  
  - **"Recent/relevant" etiological view:** Function requires selection under *current* conditions.  
  &nbsp;&nbsp;→ Ancestral: Function is infection prevention.  
  &nbsp;&nbsp;→ Derived: Function is mate attraction (current selection).  
  &nbsp;&nbsp;→ Lab: *No function* (no current selection maintains secretion).  
  &nbsp;&nbsp;→ Blocked-duct: *Malfunction* in derived pop. (fails at current sexual function); *no function* in lab.  

  **(b) Blocked-Duct Males:**  
  - **Causal-role:** No secretion → no causal contribution → *no function*.  
  - **Etiological (any-history):** Trait exists due to past selection for secretion → *malfunction* (incapable of ancestral role).  
  - **Etiological (recent/relevant):** In derived pop., selected for sexual attraction → *malfunction* (fails current role). In lab, no selection → *no function*.  
  *Causal-role struggles:* It cannot distinguish a broken gland from a non-functional trait (e.g., vestigial structures), as both lack current effects.  

  **(c) Evaluation:**  
  The **etiological account (recent/relevant variant)** offers the most coherent analysis, though it faces trade-offs.  
  - **Strengths:**  
  1. **Handles functional change:** Distinguishes ancestral (infection prevention) from derived (mate attraction) functions.  
  2. **Explains loss of function:** Correctly identifies the lab gland as non-functional (no current selection).  
  3. **Addresses malfunction:** Blocked-duct glands are *broken* relative to their current selective regime.  
  - **Causal-role’s weakness:** It cannot explain why the blocked-duct gland *should* secrete (ascribing "no function" equates broken traits with non-adapted structures). Its over-flexibility also renders the lab gland functionless despite identical structure to derived frogs.  
  - **Trade-offs:**  
  &nbsp;&nbsp;- *Stability:* Etiological accounts provide stable functions (e.g., ancestral function doesn’t disappear). The recent/relevant variant sacrifices some stability for relevance.  
  &nbsp;&nbsp;- *Edge cases:* Etiological accounts better handle malfunction (blocked-duct) but struggle if selection is transient. Causal-role handles current contributions cleanly but ignores normative dimensions ("should do").  
  **Conclusion:** The recent/relevant etiological view best balances historical grounding and contemporary relevance, capturing functional shifts while explaining malfunction. Its cost is reliance on often-inaccessible selective histories, but this is preferable to causal-role’s inability to normatively evaluate traits.  

  ---

  ### Marking Scheme (Total: 20 marks)
  **Must-hit points (MHP) with mark allocation and common errors:**

  1. **MHP1: Correct application of causal-role to all populations & blocked-duct (4 marks)**  
     *Error: Fails to state lab gland has no function OR misassigns derived function as "infection prevention."*  
  2. **MHP2: Correct distinction of two etiological views across all populations (4 marks)**  
     *Error: Conflates "any-history" and "recent/relevant" OR misassigns function in lab (e.g., "recent/relevant = no function" missed).*  
  3. **MHP3: Accurate analysis of blocked-duct males under all accounts (4 marks)**  
     *Error: Claims causal-role ascribes "malfunction" OR states etiological views assign "no function."*  
  4. **MHP4: Clear defense of one account, highlighting trade-offs (e.g., stability vs. flexibility) (4 marks)**  
     *Error: Only lists pros/cons without justifying choice OR ignores trade-offs entirely.*  
  5. **MHP5: Avoids reductive analogies & demonstrates case-specific reasoning (4 marks)**  
     *Error: Relies on "heart pumps blood"-style memorization OR does not engage population contrasts.*  

  *Essays scoring <12/20 typically fail MHP3 and MHP4, revealing superficial grasp of malfunction and evaluation.*  

  ---
  This question forces engagement beyond textbook definitions by:  
  1. **Requiring population-specific analysis** (preventing generic answers),  
  2. **Demanding distinction within etiological accounts** (exposing nuance),  
  3. **Centering the blocked-duct edge case** (where causal-role falters),  
  4. **Mandating evaluative trade-offs** (beyond recitation).  
  A student relying on "heart pumps blood" logic would be unable to explain why the gland’s function differs in derived vs. ancestral frogs or why blocked ducts matter.
