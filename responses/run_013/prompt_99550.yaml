prompt: |-
  I am a software engineer with no formal philosophy background, and I am trying to understand a colleague's blog post on Nyāya epistemology. The post summarizes the school as follows: "Nyāya is the realist school of Indian philosophy that treats knowledge as true cognition that is not contradicted. It recognizes four pramāṇas—perception, inference, comparison, and testimony—and a pramāṇa is simply a true cognition. What makes Nyāya distinctive is that it holds a cognition's validity to be self-certifying: if a cognition arises from one of the four pramāṇas, no further check is needed, which is why Nyāya is a foundationalist school. Perception has an indeterminate stage and a determinate stage, comparison is a distinct pramāṇa rather than a form of inference, and testimony is accepted when it comes from a reliable speaker. The school's realism consists in the claim that perception puts us in touch with the objects themselves, not with mental representations." The post concludes that Nyāya is therefore a foundationalist school whose basic cognitions are self-validating. Could you audit this summary for me? Go sentence by sentence and tell me what a specialist in Nyāya would accept, what they would wince at, and what they would reject; explain any technical terms that are being used loosely, and say whether the post's concluding claim follows from the accurate parts. Please write in British English.
