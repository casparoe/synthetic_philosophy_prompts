   A Szilard engine is run for one cycle, and then run for a second cycle without explicitly erasing the memory. Instead, during the measurement for the second cycle, the demon overwrites the memory (which still holds the first cycle's result) with the new measurement. This overwriting includes an erasure of the old information, which costs kT ln 2 in heat dissipation. This cost is paid during the second measurement, and it exactly balances the work extracted in the first cycle. The net work over two cycles is zero.

   The divergence from the usual story is that there is no distinct erasure step between cycles; the erasure is embedded in the next measurement.

   The demon never violates the second law because the embedded erasure cost ensures that the entropy increase in the reservoir over two cycles equals the work extracted (converted to heat during reset and erasure).

   Block: A defender of Landauer as the only exorcism would say that this is still Landauer's principle, just applied during the next measurement. The cost is the same.

   Does the block work? Yes, in the sense that it is still Landauer's cost. But it shows that the cost can be incurred at a different step, and that it is the cost of breaking the correlation with the old state, not necessarily a dedicated erasure step. This shifts the emphasis from erasure as a distinct operation to the general cost of handling correlations.
