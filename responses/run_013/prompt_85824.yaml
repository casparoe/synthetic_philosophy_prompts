answer: |-
  1. My beliefs keep telling my eyes, "Those lines are equal," and my eyes snap back, "We measured them—still looks wrong, boss!"  

  2. El Greco walks into an optician: "These corrective lenses make everything look normal!" Optician sighs, "Sir... you painted the prescription."  

  3. Tried to check if my vision was warped, but realized if it *was*, the ruler I’d use would look warped too—so now I just apologize to mirrors.  

  4. My uncle insists the world’s crooked. We asked how he knew; he said, "My beliefs bend light!" We nodded—then tilted our heads exactly 12 degrees.  

  5. If thoughts *really* changed sight, I’d see a unicorn right now. But alas, I just see a horse... that *might* be a unicorn? Damn this perceptive democracy.
