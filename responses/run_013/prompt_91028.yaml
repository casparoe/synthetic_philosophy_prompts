prompt: |-
  I'm in a philosophy club and I keep a notebook of my gut reactions to cases so I can figure out what I actually think, and my promises section has gotten totally out of hand, so I want to know what principle, if any, is generating these. Here's the list. Promising my friend I'll be at his game Saturday and then he forgets I ever said it and doesn't care: I still feel I have to go, though maybe a little less. Promising my uncle at his deathbed that I'll finish the woodworking project he started: I feel completely bound, and it bugs me because he'll never know either way, which by the "he'd be disappointed" logic should make it the weakest promise I've ever made. Promising to lend a guy in my class my notes because he threatened to beat me up if I didn't: I feel kind of bound, less than normal, but weirdly more bound than if I'd made the exact same promise drunk at a party. Promising as a joke that I'll buy my sister a car when she turns 16, and she knows it's a joke: not bound at all, even though it sounded just like the real ones. Promising to help someone move and then finding out they only asked so they could grab their stuff before the landlord shows up because they're skipping rent: I feel released. Promising to keep a secret that turns out to be about someone who's about to get hurt: I feel like I have to keep it and I hate it. Promising to do something totally pointless, like that I'll memorize the periodic table, to a friend who then moves away and forgets: barely bound at all.

  My half-baked theory is that a promise binds because you've handed someone a little piece of control over your future, so breaking it is like taking back something that isn't yours anymore, and the strength tracks how much control you handed over and whether they were actually relying on it. That gets most of the list I think, but it makes the deathbed one come out weird since he isn't relying on anything anymore, and it doesn't really explain why the threat promise and the drunk promise land in different places at all. Someone in club said promises are basically self-legislation, and someone else said they're just a way of making your future self predictable to other people, and I can't tell which of those my reactions are secretly tracking. So: is there one principle that gets all of these, or close, and what is it? I want it stated precisely, with each clause traced to the case that forces it, its verdict on a case I haven't listed (I've been wondering about promising a friend I'll cover for them, and then they have a kid and covering for them would cost the kid something), and an honest statement of which of my gut reactions the principle just can't save and which one I should probably give up. Please write it as continuous prose, no headings, bullet points, bold, or tables, like you're explaining it to me in an email.
reasoning: |-
  Okay, the user is in a philosophy club and has this notebook full of gut reactions to different promise scenarios. They're trying to find an underlying principle that explains all their feelings about when a promise feels binding and when it doesn't. The list includes situations like promises to a friend who forgets, a deathbed promise to an uncle, a coerced promise under threat, a joking promise, and others. Each case triggers a different level of obligation in them.

  Looking at their examples, I notice patterns. The deathbed promise feels strongly binding even though the uncle will never know, which contradicts the idea that reliance matters most. The coerced promise feels more binding than a drunk promise, which is interesting because both involve impaired consent. The joking promise isn't binding at all, which makes sense. 

  Their half-baked theory about handing over control fits many cases but fails with the deathbed example and doesn't explain the threat vs. drunk distinction. The club's suggestions about self-legislation or predictability don't fully capture their reactions either.

  I need to synthesize a principle that covers all these nuances. Maybe it's about the promisee's legitimate normative authority over the promisor's actions. Authority comes from the promisor granting it voluntarily, the promisee having a legitimate interest, and the promise aligning with that interest. 

  Testing this: In the deathbed case, the uncle has authority because he cared deeply about the project. In the threat case, the coercer has no legitimate interest, so the promise is weak. The drunk promise is weak because intoxication undermines voluntary granting of authority. The secret that could cause harm conflicts with preventing harm, overriding the promise. 

  For their new case: promising to cover for a friend who then has a kid. If covering would harm the kid, the friend's authority over that action is illegitimate because it conflicts with the duty to prevent harm. So they'd be released.

  This principle handles most cases but struggles with the forgotten promise where the friend doesn't care. The user feels slightly bound, but the principle says if there's no reliance or interest, obligation fades. Maybe they're clinging to self-consistency here. They might need to adjust that gut reaction.

  I'll present this principle clearly, link each clause to their examples, apply it to the new case, and note where their intuition might need rethinking. The tone should be conversational, like an email from a fellow philosophy enthusiast.
answer: |-
  Here’s a principle that threads through your reactions, refined from your "control transfer" intuition but incorporating elements of normative authority and relational context. I’ll state it plainly, then unpack how it maps to your cases, test it against your new scenario, and flag tensions:

  **A promise creates a binding obligation proportional to the degree to which (a) you voluntarily granted the promisee normative authority over the specified action, and (b) that authority remains legitimate given the promisee’s ongoing relationship to the action’s moral/social context. The obligation dissolves if upholding it would violate a deeper moral duty.**

  Now, tracing the clauses to your cases:

  - **Voluntary Granting of Authority**: This explains the threat case vs. drunk case. Under threat, your "grant" is coerced (weak authority transfer), making you feel *less* bound. Drunkenness voids voluntariness entirely—you didn’t meaningfully grant authority at all, so even weaker obligation. The joke promise fits: no voluntary grant of real authority occurred. The skipped-rent case: you granted authority under false pretenses (mutual understanding of help ≠ aiding fraud), voiding the grant.

  - **Legitimacy of the Promisee’s Ongoing Authority**: This resolves the deathbed paradox. Your uncle’s *legacy* (his life’s values/project) maintains normative weight *independent of his awareness*. You’re bound not by his *reliance* but by the enduring legitimacy of his claim over the project he entrusted to you. Contrast the forgotten game promise: your friend’s current indifference undermines his claim to authority, weakening obligation. The pointless promise (memorize table) + friend moving away: without ongoing relational stakes, his authority fades to near-zero.

  - **Conflict with Deeper Moral Duty**: The harmful secret case: keeping it violates the duty to prevent harm, overriding the promise. The skipped-rent promise collapses here too (duty not to enable wrongdoing).

  **Your New Case (Cover for Friend → Cost to Their Child)**  
  *Promise*: Cover for a friend (e.g., lie about their whereabouts).  
  *Changed Context*: Fulfilling it now harms their child (e.g., concealing parental neglect).  
  *Verdict*: **Not bound**. You granted authority to aid your friend, but that authority was contingent on a shared (implied) moral framework where "covering" doesn’t enable serious harm. Harming an innocent child violates a deeper duty, invalidating the friend’s claim to authority over that action. The child’s welfare trumps the promise.

  **Where the Principle Struggles & What to Reconsider**  
  - **The Struggle**: Your lingering obligation to attend the game despite your friend’s forgetfulness. The principle says his indifference *should* dissolve his normative authority almost entirely. Your residual feeling might track **personal integrity** (consistent identity as "promise-keeper") more than relational authority. This hints at the "self-legislation" view your clubmate mentioned.  
  - **What to (Probably) Give Up**: The intuition that the deathbed promise is *paradoxical*. If normative authority can stem from symbolic/legacy claims (not just reliance or awareness), it’s coherent. Your discomfort might reflect conflating *moral motivation* ("he'd be disappointed") with the *source* of obligation. The obligation persists precisely because his death doesn’t negate the project’s meaning—it amplifies it.

  **Why This Over "Control" or "Predictability"?**  
  - "Control transfer" explains voluntariness but falters on posthumous/forgotten promises (no one "controls" the action).  
  - "Predictability" fails the joke/coercion cases (no serious intent to signal reliability) and the deathbed (predictability for whom?).  
  - "Self-legislation" (Kantian view) struggles with coerced promises (you’d still be bound) and the secret case (it can’t easily override duties to others).  

  Your reactions suggest a hybrid: promises *create relational debts* grounded in **voluntary ceding of agency** + **the promisee’s moral stake in the outcome**. When the stake vanishes (forgiveness, irrelevance) or the grant was void (coercion, fraud), the debt weakens. When higher duties intervene, they cancel the debt. The deathbed case isn’t an outlier—it’s where symbolic stakes *intensify* the authority transfer. If this resonates, your notebook is tracking a sophisticated, context-sensitive ethics of commitment.
