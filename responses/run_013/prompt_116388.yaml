  I need to defend the criterion as largely correct. Historically, famines like Bengal, Irish, and Great Leap Forward show governments prioritizing war, ideology, or control over lives. Amartya Sen's entitlement approach supports that access, not just availability, is key. For clause (a), feasibility must be judged by contemporary knowledge, not hindsight. Examples like Churchill ignoring Indian requests or Mao's policies despite warnings illustrate knowable alternatives.

  Addressing the hard cases: For sincere but harmful policies, if alternatives were knowable, it's still a crime due to negligence. The Bengal famine had feasible solutions like halting exports, but Churchill prioritized war supplies. For the marginal region, neglect due to apathy violates the duty to protect all citizens, making it a crime. The criterion's (c) clause covers valuing other things more, including political expediency.

