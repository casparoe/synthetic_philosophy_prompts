  The grim trigger strategy is SPE if no player gains by deviating from cooperation in any subgame. Let \(V_c\) denote the expected total payoff from mutual cooperation, and \(V_d\) the expected payoff from mutual defection (punishment phase). These satisfy:  
  \[
  V_c = 3 + p V_c \quad \Rightarrow \quad V_c = \frac{3}{1 - p}
  \]  
  \[
  V_d = 1 + q V_d \quad \Rightarrow \quad V_d = \frac{1}{1 - q}
  \]  
  A player deviating in a cooperation round gains 5 (unilateral defection) and triggers punishment, yielding expected payoff \(5 + q V_d\). Cooperation is optimal if:  
  \[
  V_c \geq 5 + q V_d \quad \Rightarrow \quad \frac{3}{1 - p} \geq 5 + q \cdot \frac{1}{1 - q}
  \]  
  Simplifying the right side:  
  \[
  5 + \frac{q}{1 - q} = \frac{5(1 - q) + q}{1 - q} = \frac{5 - 4q}{1 - q}
  \]  
  Thus, the condition is:  
  \[
  \frac{3}{1 - p} \geq \frac{5 - 4q}{1 - q} \quad \text{(Condition for SPE)}
  \]  

  **Comparison to Fixed Continuation:** Cooperation is *easier* to sustain here than in a fixed-continuation model (where continuation probability is \(\delta\) regardless of actions). In the fixed model, grim trigger requires \(\delta \geq \frac{1}{2}\). Here, with \(p > q\), the state-dependent probabilities:  
  - Increase the value of cooperation (\(V_c = \frac{3}{1-p}\) is larger than in a fixed model with \(\delta = p\), as \(p > q\) implies a longer expected cooperation phase).  
  - Reduce the severity of punishment (\(V_d = \frac{1}{1-q}\) is smaller than in a fixed model with \(\delta = p\), as \(q < p\) shortens punishment).  
  The right side of the condition, \(\frac{5 - 4q}{1 - q}\), decreases as \(q\) decreases (since \(\frac{d}{dq}\left[\frac{5-4q}{1-q}\right] > 0\)). Thus, for fixed \(p\), lowering \(q\) relaxes the condition. For example, with \(p = 0.45 < \frac{1}{2}\) and \(q = 0\), the left side is \(\frac{3}{0.55} \approx 5.45\), exceeding the right side (5). In a fixed model with \(\delta = p = 0.45\), \(\delta < 0.5\) fails the standard condition. Hence, \(p > q\) makes cooperation easier.  

  **(ii) Credibility of Punishment and SPE Implications**  
  The punishment (permanent defection) is credible because it constitutes a Nash equilibrium in the punishment subgame. If both players defect:  
  - A player deviating to cooperation gets 0 (since the other defects) plus continuation payoff \(q V_d\), yielding \(0 + q \cdot \frac{1}{1-q}\).  
  - Defecting yields \(1 + q V_d = 1 + q \cdot \frac{1}{1-q}\).  
  Since \(1 + \frac{q}{1-q} > \frac{q}{1-q}\) (as \(1 > 0\)), defecting is optimal. Thus, the threat is self-enforcing.  

  This credibility *preserves* the incentive to cooperate. The punishment is a credible deterrent because players have no unilateral incentive to deviate from it, ensuring the grim trigger strategy is subgame perfect when the condition in (i) holds. Some might argue players "want" to revert to cooperation to avoid mutual defection payoffs, but without coordination, unilateral cooperation is irrational (it yields 0). Hence, the most defensible verdict is that punishment is credible, and the strategy remains SPE if \(\frac{3}{1-p} \geq \frac{5-4q}{1-q}\).  

  **(iii) Conceptual Insights on Shadow of the Future and Assumptions**  
  This variant refines the claim that cooperation requires a "sufficiently long shadow of the future." It shows that cooperation depends not just on the *average* expected duration (shadow length), but on *how* actions influence this duration. Here, mutual cooperation extends the future (higher \(p\)), increasing the value of cooperation, while defection shortens it (lower \(q\)), reducing punishment severity. Crucially, cooperation can be sustained even if the overall expected duration is modest (e.g., \(p = 0.45\)), provided \(p > q\) creates asymmetric incentives—longer shadows under cooperation act as a reward, shorter shadows under defection a partial but credible penalty.  

  The analysis assumes continuation probabilities \(p\) and \(q\) are **exogenous** (externally fixed) and **common knowledge**. It does not explain their source—e.g., whether they arise from strategic choices (e.g., relationship investments) or environmental factors (e.g., institutional stability). In reality, \(p\) and \(q\) might be endogenous to player behavior, but the model treats them as immutable, sidestepping how actions beyond the immediate round shape the future.  

