  ### Exam Question (Total: 25 marks)

  **Repeated Prisoner's Dilemma with Outcome-Dependent Continuation Probabilities**  
  Consider a repeated prisoner's dilemma stage game with payoffs:  
  - Mutual cooperation (C, C): (3, 3)  
  - Unilateral defection (e.g., D by one player, C by the other): (5, 0) for the defector, (0, 5) for the cooperator  
  - Mutual defection (D, D): (1, 1)  

  After each round, the game continues with probability \(p\) if both cooperated, and probability \(q\) if at least one defected, where \(1 > p > q > 0\). Players maximize expected total undiscounted payoff (sum of payoffs until the game stops). Actions are observed, and all parameters are common knowledge.  

  **(i)** [10 marks] Derive the condition on \(p\) and \(q\) under which the following grim trigger strategy is a subgame-perfect equilibrium (SPE): "Cooperate initially and after any history of mutual cooperation; defect permanently after any history with a defection." Explain whether this outcome-dependent continuation probability (with \(p > q\)) makes cooperation easier or harder to sustain compared to a standard repeated prisoner's dilemma with a fixed continuation probability \(\delta\) (independent of actions). Support your verdict with algebra.  

  **(ii)** [10 marks] Critically evaluate the credibility of the permanent defection punishment: Once a deviation occurs, would players rationally carry out this punishment? How does this affect the incentive to cooperate? What is the most defensible conclusion about the SPE status of grim trigger when this consideration is addressed?  

  **(iii)** [5 marks] Discuss what this variant reveals about the claim that cooperation requires "a sufficiently long shadow of the future." What does the analysis implicitly assume about the source of the continuation probabilities \(p\) and \(q\)?  

