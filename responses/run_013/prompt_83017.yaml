  ### Marking Scheme (25 marks total)  
  Must-hit points, marks allocation, common errors, and distinction-level differentiation:  

  1. **Correct derivation of SPE condition (i)** [6 marks]  
     - **Must-hit:** Equations for \(V_c\), \(V_d\), and \(\frac{3}{1-p} \geq \frac{5-4q}{1-q}\).  
     - **Common error:** Wrong \(V_d\) (e.g., using \(p\) for punishment) or mis-simplifying \(5 + qV_d\).  
     - **Distinction:** Precise algebra and intuition (e.g., linking \(V_c\)/\(V_d\) to expected rounds).  

  2. **Accurate comparison to fixed continuation (i)** [4 marks]  
     - **Must-hit:** Verdict that cooperation is *easier* with \(p > q\), supported by algebra/example.  
     - **Common error:** Claiming it is harder or not justifying with \(p > q\) effects (e.g., ignoring \(q\)'s role).  
     - **Distinction:** Numerical example (e.g., \(p=0.45, q=0\)) and intuition on asymmetry.  

  3. **Punishment credibility analysis (ii)** [6 marks]  
     - **Must-hit:** Proof punishment is Nash (defect > cooperate when other defects), preserving SPE.  
     - **Common error:** Arguing punishment is non-credible without game-theoretic reasoning (e.g., "players forgive").  
     - **Distinction:** Explicit best-response calculation and rebuttal of renegotiation.  

  4. **Conclusion on SPE status (ii)** [4 marks]  
     - **Must-hit:** Defensible verdict that grim trigger is SPE if condition holds.  
     - **Common error:** Concluding punishment undermines cooperation despite credibility.  
     - **Distinction:** Linking credibility to subgame perfection’s definition.  

  5. **Conceptual insights (iii)** [5 marks]  
     - **Must-hit:** Shadow of future depends on action-contingency; exogeneity assumption for \(p,q\).  
     - **Common error:** Vague restatement of condition or ignoring source of probabilities.  
     - **Distinction:** Contrasting action-contingent vs. fixed shadow, and limitations of exogeneity.  

  **Total**: 25 marks.  
  **Distinction threshold (e.g., >20/25)**: Integrates parts holistically (e.g., connects (i) and (iii) on shadow length), uses game-theory terminology precisely, and anticipates/counters misconceptions.
