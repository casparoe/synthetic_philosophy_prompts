prompt: |-
  I have been trying to find a name for a kind of category that keeps turning up in the applied sciences, and I cannot place it on the usual map that runs from natural kinds at one end to socially constructed kinds at the other. I would like to know whether it already has a name, and if it does not, whether it deserves one.

  The category has three features at once. First, there is a genuine division in the world: things on one side of the line really do resemble one another in ways that support prediction, so that a generalization which holds of one member usually holds of the rest. Second, the boundary between the sides is not discovered but stipulated. Something varies continuously, a number is chosen, and above that number one belongs to the category while below it one does not. Third, the number is not chosen at random; it is chosen with an eye to what follows from belonging, and it is revised when those consequences change. The boundary is thus at once an administrative instrument and a working part of the science.

  Two instances. In medicine, a quantity that varies continuously across a population is given a threshold, and the threshold decides who is diagnosed and who is treated. When a treatment becomes cheaper, or a trial shows benefit at a lower level, the threshold is moved, and a large number of people who were healthy last year are patients this year, though not one of their measurements has changed. In field ecology, a classification manual stipulates where one vegetation type ends and the next begins; a rival manual draws the lines elsewhere, and yet either set of classes will predict how a plot responds to fire or drought, so a model that uses the wrong boundaries makes real errors.

  What I cannot classify is the combination. These categories are not merely conventional, since they support inductions and figure in causal explanations. They are not natural kinds in the usual sense, since their boundaries are not discovered, and since moving a boundary changes which generalizations come out true, which suggests that the boundary is part of the machinery rather than a mark on something that was already there. Nor are they simply vague predicates, because the boundary is not fuzzy but exact and deliberately placed.

  If there is a term of art for this, I would like to know which of the nearby terms covers it and where the others fall short. If there is none, I would like one coined and defined, with its edges drawn: does the phenomenon essentially involve the revision of the boundary, or can a boundary be fixed once and for all and still count; does it require that the boundary have practical consequences, or is it enough that it be stipulated; and does it matter that the boundary is set by people acting within an institution rather than by the science alone? I am not much interested in the label itself. I want to know what exactly is being asserted when someone says that one of these categories is real, and whether that assertion survives a change in where the line is drawn.
reasoning: |-
  Okay, the user is describing a specific type of category that appears in applied sciences, combining elements of natural divisions and human stipulation. They mentioned three key features: genuine resemblance supporting prediction, stipulated boundaries based on a chosen threshold, and revision based on consequences. Examples include medical diagnoses with changing thresholds and ecological classifications in field manuals.

  First, I need to recall existing philosophical terms. Natural kinds are out because boundaries here are stipulated, not discovered. Social constructs don't fit because these categories do track real patterns. Cluster kinds might be close, but they usually don't involve explicit threshold-setting. Pragmatic kinds emphasize utility but don't capture the administrative aspect or boundary revision.

  Hmm, the user's examples highlight thresholds that are both scientifically functional and administratively consequential. The medical threshold changes when treatments become cheaper, affecting who gets diagnosed. Ecology manuals use different boundaries, yet both predict environmental responses. This suggests the boundary itself is part of the explanatory model.

  The term "operational kind" comes to mind. It's used in measurement contexts, but does it cover the administrative role? "Coordinating kind" from Chang's work involves stabilizing concepts across contexts, which aligns with the boundary's role in prediction. But maybe a new term is needed. "Administrative kind" could work, emphasizing the practical consequences, but might overlook the epistemic aspect. "Threshold-dependent kind" is descriptive but clunky. "Dynamic threshold kind" captures the revision aspect but might be too narrow.

  The user wants clarity on whether boundary revision is essential. In their examples, revision happens due to practical changes, but even if a threshold is fixed, as long as it's stipulated and functional, it might still fit. The key is the combination of real patterns, stipulated boundaries, and their role in both prediction and decision-making. Institutional involvement seems crucial in setting and revising thresholds, so that should be part of the definition.

  They also ask about the reality of such categories. The assertion of reality here isn't undermined by boundary changes because the underlying pattern persists; the threshold is a tool to access that pattern. The reality lies in the predictive reliability, not the exact boundary placement. So the category is real in a pragmatic sense—it's instrumentally valid.

  I should check if existing terms like "interactive kind" (Hacking) apply. Interactive kinds involve feedback loops, where classifications affect the classified. In medicine, diagnosing someone might change their behavior, but the user's focus is on the boundary itself being a functional part of science, not just social interaction. So interactive kind might not fully capture it.

  Perhaps the best approach is to define a new term: "nomological threshold kind." "Nomological" stresses law-like generalizations, and "threshold" highlights the stipulated boundary. This combines the predictive power with the administrative mechanism. The reality assertion survives boundary shifts because the generalizations hold relative to the threshold, which is optimized for current practical and epistemic needs.
answer: |-
  This is a fascinating and deeply important category that straddles epistemology, philosophy of science, and practical ontology. You've identified a crucial hybrid that doesn't fit neatly on the natural/social kind spectrum. **There isn't a single universally accepted term, but the most precise existing label is likely "Operational Kind," with strong contenders being "Pragmatic Kind" or "Coordinating Kind." However, your description suggests nuances warranting potential refinement or a new coinage.**

  Here's the breakdown of existing terms and why they fit (or don't):

  1.  **Operational Kind:** This is the strongest existing candidate.
      *   **Fits:** Directly addresses the stipulated boundary defined by an operational criterion (e.g., "Hypertension is defined as systolic BP ≥ 140 mmHg"). It emphasizes the *measurement* or *operational definition* as constitutive. It inherently allows for revision as measurement techniques or contexts change. It acknowledges the genuine empirical basis ("supports prediction") while centering the human-defined operation.
      *   **Falls Short:** Often used more narrowly in measurement contexts. Doesn't *explicitly* emphasize the *administrative instrument* aspect or the *consequence-driven revision* as strongly as your description. Primarily focuses on the *definitional act* rather than the *functional role in the system*.

  2.  **Pragmatic Kind:**
      *   **Fits:** Emphasizes the category's usefulness for specific purposes (prediction, intervention, policy). Explains why the boundary is chosen and revised based on consequences (e.g., treatment cost/benefit, predictive power in ecology models). Acknowledges the real basis *and* the human interest driving the boundary placement.
      *   **Falls Short:** Can be quite broad, encompassing categories where the boundary might be discovered but chosen for utility, or where the "real resemblance" is weaker than you stipulate. Doesn't *necessarily* highlight the *stipulated, exact threshold* or its administrative function as distinctly.

  3.  **Coordinating Kind** (Hasok Chang):
      *   **Fits:** Focuses on categories that serve to coordinate different practices, instruments, or communities (e.g., clinicians, researchers, insurers in medicine; different ecologists using different manuals). Explains why a stipulated boundary is necessary *despite* underlying continuity – it creates a shared reference point enabling communication and joint action. Captures the "working part of the science" aspect by enabling models and predictions across contexts.
      *   **Falls Short:** Less commonly used than "Operational" or "Pragmatic." Focuses more on coordination between practices than on the threshold itself being a functional part of causal/predictive models.

  4.  **Why Not Others?**
      *   **Natural Kind:** Boundaries are discovered, not stipulated and revisable. They carve nature at its joints. Your categories don't; they impose a joint *onto* a continuum based on utility. The truth-value of generalizations changing with boundary shifts is fatal to the classic natural kind view.
      *   **Socially Constructed Kind:** While their boundaries *are* constructed, their core function and legitimacy stem from tracking *real, empirically verifiable patterns* that support induction and prediction. Their reality isn't *solely* constituted by social agreement but by their grounding in observable regularities.
      *   **Cluster Kind / Homeostatic Property Cluster (HPC):** Can handle family resemblance and vague boundaries but struggles with the deliberately placed, *exact*, non-fuzzy threshold that is central to your cases. HPCs typically have *discovered* clusters with fuzzy edges, not *stipulated* sharp cut-offs.
      *   **Vague Predicate:** Explicitly rejects the exact boundary you describe. Vague predicates (like "tall") inherently have borderline cases; your categories *eliminate* borderline cases by fiat with a sharp line.
      *   **Interactive Kind (Hacking):** Focuses on how classification *changes* the classified individuals (e.g., labeling affects behavior). While relevant in medicine (diagnosis changes patient experience), your core mechanism is different: it's about the *threshold itself* being a functional part of the scientific/predictive/administrative machinery, not primarily about feedback loops altering the classified entities.

  **The Need for a New Term/Refinement: "Nomological Threshold Kind" or "Administrative Kind"**

  Your description highlights elements not fully captured by existing terms:
  *   The **explicit, non-fuzzy, numerically defined threshold**.
  *   The **dual role** as both an **epistemic tool** (enabling prediction/explanation) and an **administrative instrument** (determining diagnosis, treatment, resource allocation, classification).
  *   The **revision mechanism** driven by **changing practical consequences** (cost, benefit, model performance).

  Therefore, proposing:

  1.  **Nomological Threshold Kind (NTK):**
      *   **Definition:** A category defined by a stipulated, exact threshold on an underlying continuous (or multi-dimensional) variable, where the threshold is chosen and revised based on its effectiveness in generating or supporting *nomological* (law-like) generalizations, predictions, and causal explanations within a specific domain of inquiry or practice. It functions simultaneously as an epistemic and administrative tool.
      *   **"Nomological"**: Emphasizes the core function: enabling reliable predictions and explanations (the "genuine division... supports prediction").
      *   **"Threshold"**: Explicitly names the central mechanism – the sharp, stipulated cut-off.
      *   **"Kind"**: Acknowledges it functions as a category supporting induction.
      *   **Captures:** The real pattern basis, the stipulated exact boundary, the role in science (nomological), and implies the potential for revision (thresholds are adjustable).

  2.  **Administrative Kind (AK):**
      *   **Definition:** A category defined by a stipulated, exact boundary, grounded in an underlying real pattern that supports induction, but whose specific boundary placement is determined by and serves practical administrative, regulatory, or interventionist purposes within an institutional context. The boundary is revisable based on changes in these practical consequences.
      *   **"Administrative"**: Highlights the crucial instrumental/decision-making role.
      *   **Captures:** The real pattern, stipulated boundary, practical consequence-driven revision, and institutional context.

  **Answering Your Refinement Questions:**

  *   **Revision Essential?** No. The *potential* for consequence-driven revision is inherent and characteristic, but a boundary *could* remain fixed if consequences remain stable. The key is that the boundary's justification *rests on* its consequences (epistemic and practical), *not* on discovering a pre-existing joint. A fixed boundary chosen for permanent optimal consequences still qualifies.
  *   **Practical Consequences Required?** Yes, essentially. While the epistemic consequence (supporting prediction/explanation) is primary, the category's *raison d'être* and boundary placement *always* involve practical considerations, even if implicit. In pure science (e.g., defining "dwarf planet"), the "practical" consequence is model coherence, predictive scope, or theoretical simplicity. The boundary is never *just* stipulated; it's stipulated *for a purpose* beyond mere labeling.
  *   **Institutional Context Required?** Typically, but not absolutely. The act of stipulation and revision often involves committees, manuals, guidelines, or regulatory bodies (institutions). However, even an individual researcher defining a threshold for their model is acting within the institutional norms of their scientific community. The "administrative" or "operational" act implies a context where decisions have weight beyond individual whim.

  **The Reality Question:**

  When someone says such a category is "real," they assert:
  1.  **There is a genuine underlying pattern:** The continuous variable (or property cluster) *does* correlate significantly with other important variables/outcomes (disease progression, fire response, etc.).
  2.  **The category is instrumentally valid:** Using *this specific threshold* (at this time, in this context) provides a reliable and useful way to access that pattern for prediction, explanation, and intervention. It "carves" the continuum in a way that yields significant generalizations.
  3.  **The boundary is not arbitrary:** It reflects a considered judgment optimizing epistemic gain (predictive accuracy, explanatory power) and practical utility (treatment efficacy/cost, model performance, policy implementation).

  **Does this reality survive boundary shifts? Absolutely, but contextually.**

  *   The *underlying pattern* remains real.
  *   The *effectiveness of the specific threshold* for its intended purposes remains real *in the context for which it was chosen*.
  *   A revised threshold doesn't falsify the old one; it reflects changed circumstances (new treatments, new data, new priorities). The *old* threshold might still be valid for *some* purposes or historical analysis, but the *new* one is now more appropriate for *current* purposes. The reality is in the *functional effectiveness relative to goals*, not in the threshold being a mirror of a pre-existing discrete entity. The category is real *as a tool* grounded in reality, not as a discovered natural atom.

  **Conclusion:**

  You've pinpointed "**Operational Kinds**" as the closest existing term, but your emphasis on the exact threshold, its dual epistemic/administrative function, and consequence-driven revision suggests valuable nuance. Coining "**Nomological Threshold Kind**" (emphasizing the law-supporting function of the threshold) or "**Administrative Kind**" (emphasizing the practical instrumentality) would provide a sharper tool. The core reality claim survives boundary shifts because it's a claim about *functional effectiveness grounded in an underlying pattern*, not about mirroring a static discrete structure in nature. This hybrid category is fundamental to how science operates in the complex, continuous, and humanly consequential world.
