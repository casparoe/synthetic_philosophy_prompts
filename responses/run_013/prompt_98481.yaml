answer: |-
  Your Kantian friend's argument is logically tight but relies on contestable interpretations of Kantian ethics—especially premises (3) and (4). You can reject these while preserving (1), the core idea that truthfulness is a duty owed to humanity. Here’s how:

  ### Step-by-Step Rejection
  1.  **Keep (1)**: The duty of truthfulness *is* owed to humanity ("the right of humanity," as Kant calls it). A lie corrupts the shared practice of communication essential to rational agency. **This is defensible and need not be abandoned.**

  2.  **Keep (2)**: The murderer’s depravity doesn’t negate your duty *to humanity*. **Agreeing here doesn’t force you to accept (5).**

  3.  **Reject (3)**: **The form of deception *does* matter.** Kant’s duty of truthfulness governs *assertions* (intentional communicative acts). Not all deceptions are lies:
      *   **Lying**: Asserting what you believe to be false. *This violates the duty directly.*
      *   **Misleading Truth**: Asserting a technically true statement intended to deceive. *This is often argued to violate the *spirit* of the duty (by corrupting trust) even if not the letter.*
      *   **Evasion/Silence**: *Refusing to make any assertion at all.* **This is not an assertion, so it falls outside the scope of the duty of truthfulness.** You haven’t said anything false; you’ve simply declined to speak. Kant himself distinguishes between lying and reticence (*Vorbehalten*, reservation). Your silence *may* cause the murderer to infer something false, but *you* haven’t asserted it. The duty governs your speech acts, not others' inferences.
      *   **Cost of Rejecting (3)**: You must accept that the duty of truthfulness has a specific scope—it regulates *what you say when you choose to speak*, not every possible way of influencing another's beliefs through non-assertion. You lose the "purity" of treating all deception identically, but gain a more plausible account of moral agency.

  4.  **Reject (4)**: **Refusing to answer is *not* inherently equivalent to a lie or meant to deceive in a way that violates the duty.** Silence is non-assertion. Consider:
      *   **Context Matters**: If a stranger asks your credit card number, refusing isn't deceptive; it’s prudent. The murderer’s demand is illegitimate. You have no duty to assist him.
      *   **Motive ≠ Assertion**: While your motive might be protective, *silence itself makes no claim*. The murderer’s mistaken inference is *his* error, not your false assertion. Kantian duties primarily concern the *maxim* of your action (your underlying principle). The maxim "I will refuse to answer illegitimate questions to protect the innocent" can be universalized without contradiction, unlike the maxim of lying.
      *   **The "Meant to Mislead" Trap**: *All* silence in response to a question could be interpreted as "meant to mislead." This stretches the concept beyond recognition. The duty of truthfulness isn't a duty to prevent *all* false beliefs in others—only to avoid instilling them through your own false statements.
      *   **Cost of Rejecting (4)**: You acknowledge that morality allows (and sometimes requires) *not speaking* in the face of evil demands. This avoids the monstrous outcome without endorsing falsehood. The cost is accepting that silence can be a morally distinct category from lying.

  5.  **Thus, Reject (5)**: Telling the murderer the truth is **not** the only option. **Silence is permissible.** (Some Kantians, like Christine Korsgaard, argue *misleading truth* might also be permissible in extremis, but silence is the safer path for preserving (1)).

  ### Addressing Your Concrete Worry: Journalism and Silence
  Your practice of refusing to answer (vs. lying) **does genuine moral work** under this revised Kantian view:
  1.  **Preserves Integrity**: You avoid making a false assertion, upholding the duty to humanity’s reliance on truthful communication.
  2.  **Avoids Complicity**: You don’t actively assist wrongdoing by providing harmful truth (like the murderer’s location).
  3.  **Maintains Moral Distinction**: Silence signals the *illegitimacy* of the demand. Lying might imply the questioner has a right to the truth; refusal denies that right.
  4.  **Universalisable Maxim**: "I will refuse to answer questions when answering truthfully would cause grave harm or violate a higher duty (e.g., protecting a source)" is consistent with a world where rational agents respect just boundaries of inquiry.

  **What This Costs (Summary):**
  *   You concede that Kantian duties have *scope*: Truthfulness governs assertions, not all forms of influence.
  *   You accept that *silence* is a morally significant category distinct from lying.
  *   You allow that duties can sometimes *conflict* (e.g., duty to protect life vs. duty of truthfulness *if you speak*), and that non-assertion can sometimes resolve this without violating the categorical imperative.

  **Why This Preserves Kant's Core Insight (1):**
  The duty to humanity remains foundational. Lying *does* misuse communication and disrespect rational agency *as such*. By refusing to speak to the murderer (or a journalist seeking to harm a source), you:
  - Avoid *using* communication for evil.
  - Protect the broader practice of truthfulness by not introducing a lie.
  - Uphold the "right of humanity" by refusing to be instrumentalized for immoral ends.

  **In short: Keep (1) and (2). Reject (3) and (4) by arguing that the duty of truthfulness applies only to assertions, and silence is not an assertion. This justifies (moral) silence to the murderer and validates your journalistic practice as more than a dodge—it's a way to honor the duty to humanity *without* enabling evil.** The rigor lies in defining the duty precisely, not in applying it indiscriminately to all forms of non-cooperation.
