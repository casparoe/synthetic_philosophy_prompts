  Okay, the user needs a teaching plan for a 90-minute session on the metaphysics of laws of nature. The audience includes a physicist, engineer, historian, theologian, and two grad students. None have read technical literature, and they all think laws are just equations scientists find. The main goal is to contrast Humean and anti-Humean views using a video game example instead of standard cases like grue or ideal gas law.

  First, I need to choose a carrying example. A video game physics engine works because it separates observable regularities from the underlying code. That makes the distinction clear. The example needs two key elements: an exceptionless regularity that isn't a law (like the crate's path) and a lawlike one with exceptions (like the light ball's floatiness). This setup will help challenge their initial equation-equals-law belief.

  The session should start by eliciting their default view. Ask them what makes something a law. They'll say things like equations describing patterns. Then introduce the video game world to create a gap between regularities and the actual code. Show the crate moving at 1 m/s always but explain the code has no such law. That introduces the idea that not all regularities are laws.

  After that, present the light ball floating as a law. It has exceptions but feels fundamental. This leads to the modal intuition—the sense that laws govern or explain why things happen. The physicist might jump in here, so I need to acknowledge that intuition without diving into anti-Humeanism yet.

  Now, the Humean response. Define the best system: simplest, strongest description of the mosaic. Use the video game's data to build systems. Show how simplicity vs. strength trade-off works. Maybe include a redundant system that adds the crate's speed, making it complex without benefit. This should make Humeanism seem less like evasion.

  Next, the anti-Humean counter. They'll argue that laws explain the regularities. Use the crate's path—why does it always happen? Humeans say it's just part of the best system; anti-Humeans say the code governs. Highlight the governing vs. summarizing distinction.

  Possible misconceptions: 
  - Early on, someone says laws are just patterns. Need to clarify that Humeans see laws as summaries, not just any pattern.
  - If laws don't govern, they can't explain. Address this when discussing the crate's path, showing Humeans do explain but differently.
  - Anti-Humeanism as theology. The theologian might worry, so preempt by framing it as a metaphysical stance, not religious.
  - Dispute about existence of laws. Clarify both sides agree laws exist but differ on what they are.

  Timing is tight. Stick to one example. Avoid tangents like necessity, possible worlds, or scientific realism. End with a question: "In the game, is the crate's constant speed a law?" to see if they grasp the core disagreement.

  Need to ensure each step builds on their questions. Start from their intuition, create a problem (gap in the game), then introduce solutions (Humean vs. anti-Humean). Keep jargon minimal. Use the mosaic term carefully after defining it. Make sure the trade-off does the work, not pre-existing beliefs. Highlight where modal intuition peaks—during the crate's exceptionless regularity—to make anti-Humeanism appealing before presenting Humean alternative.
answer: |-
  Below is a step-by-step teaching plan for your 90-minute session, designed to make the Humean/anti-Humean dispute emerge from the audience’s own questions. The plan uses a single video-game example to force key conceptual tensions, avoids technical jargon, and strategically targets misconceptions. Timing allocations are approximate.

  **Core Example: "PixelWorld" Video Game**  
  *A 2D physics sandbox with gravity, friction, and object interactions. Crucially:*  
  - **What it includes:**  
    - A crate that *always* slides at exactly 1 m/s on ice (exceptionless regularity).  
    - A "light ball" that *mostly* floats upward (say 95% of trials) but occasionally sinks if overlapping with a "dark zone" (lawlike with exceptions).  
    - Background code (the "metaphysical laws") that defines forces *without* direct speed rules: e.g., `IF object=light_ball THEN apply upward_force=5N; IF surface=ice THEN set friction=0`.  
  - **What it excludes:**  
    - No overt references to "simplicity" or "strength" in the code—this must emerge from analyzing the game’s observable events ("mosaic").  
    - No anthropomorphic terms (e.g., "governance") in the code description.  

  ---

  ### **Teaching Sequence**  
  **Goal:** Move from "laws = equations" to the core disagreement via felt puzzles.  

  #### **Phase 1: Elicit Naive View & Create a Gap (15 mins)**  
  - **Hook (2 mins):** Ask the group: *"What makes F=ma a ‘law’ and not just a true claim?"*  
    - *Expected answers:* "It describes patterns," "it’s fundamental," "it predicts."  
  - **Introduce PixelWorld (8 mins):**  
    - Show gameplay clips: crate sliding steadily, light ball usually floating.  
    - Ask: *"If you were a scientist in this game, what equations would you call ‘laws of nature’?"*  
    - *Audience will likely nominate: "Crates slide at 1 m/s on ice" and "Light balls rise."*  
  - **Reveal the Gap (5 mins):**  
    - Show the actual game code. Point out:  
      - No law dictates the crate’s speed (it emerges from friction=0 + initial push).  
      - The light ball’s "float law" is directly coded but has exceptions (dark zones).  
    - **Pivot question:** *"If the crate’s motion is perfectly predictable but not in the code, is it governed by a law? What about the light ball’s behavior—is it a law even with exceptions?"*  
    - *This forces the distinction: regularity ≠ law. The historian may note parallels to historical "laws" (e.g., Kepler’s) later refined.*

  #### **Phase 2: Modal Intuition at Peak Strength (20 mins)**  
  **When to introduce:** After revealing the gap, when the audience feels the crate’s motion *demands* an explanation.  
  - **Highlight the crate puzzle (10 mins):**  
    - Stress: The crate *never* deviates. Ask: *"Why does this happen every single time? Is it a cosmic coincidence? Or is something ‘making’ it happen?"*  
    - *Engineer/physicist may say: "It’s determined by initial conditions + true laws (friction=0)."*  
    - **Key move:** Agree but press: *"So are we saying the *real* law is the friction rule, and the speed is just a ‘bonus’? What if we *only* had the speed observation—would it be a law?"*  
  - **Elicit anti-Humean intuition (10 mins):**  
    - Audience will sense the crate’s regularity is "merely derivative." Contrast with the light ball: *"Even with exceptions, does its upward tendency feel more ‘lawlike’? Why?"*  
    - **Peak modal intuition:** They’ll say the light ball’s code *explains why* it usually floats (it’s "built to"), while the crate’s speed "just happens." *This is where anti-Humeanism feels irresistible—acknowledge it.*  
    - *Theologian may link to "sustaining forces"—note this but table it.*  

  #### **Phase 3: Humeanism as a Solution (Not Evasion) (25 mins)**  
  **Prerequisites:** The mosaic (all game events) must be established as the "brute truth."  
  - **Define the mosaic (5 mins):**  
    - *"Imagine a giant spreadsheet of every event in PixelWorld: positions, velocities, etc. This is all that’s real. No hidden ‘forces’—just what happens."*  
  - **Best-system statement (15 mins):**  
    - Task: *"Find the best summary of this spreadsheet. What makes one summary ‘better’?"*  
    - Elicit criteria: Simplicity (light ball’s code is simple) vs. Strength (crate’s speed rule is strong but redundant).  
    - **Trade-off exercise:** Offer competing summaries:  
      - System A: Includes friction=0 and light_ball_force=5N. *Misses crate speed but simple.*  
      - System B: Adds "crates move 1m/s on ice." *Stronger but messier.*  
      - Ask: *"Which is more useful? Which feels more ‘lawful’?"*  
    - **Reveal payoff:** Humean laws = whatever generalizations win this competition. The crate’s speed isn’t a law because mentioning it adds complexity without new predictive power.  
  - **Address "governing" (5 mins):**  
    - *If asked: "But what *causes* events?"* Reply: *"For Humeans, laws don’t cause—they describe patterns. Like a map doesn’t *make* rivers flow, but still explains why bridges are built here."*  

  #### **Phase 4: Standoff & Misconception Management (20 mins)**  
  - **Clash (10 mins):**  
    - Humean: *"Laws are our best shorthand for the mosaic."*  
    - Anti-Humean: *"Laws are *in* the code—they make the mosaic regular!"*  
    - Press: *"In PixelWorld, does ‘friction=0’ govern—or just summarize?"*  
  - **Targeted misconception defusing:**  
    | Misconception | When it arises | Response (1 min max) |  
    |---------------|----------------|----------------------|  
    | "Laws = patterns" | Phase 1 (naive view) | *"Yes, but not *any* pattern—which ones ‘must’ hold? The crate’s speed is a pattern but may not be a law."* |  
    | "If no governing, no explanation" | Phase 3 (Humean summary) | *"Humeans *do* explain: the best system tells you what to expect. But it’s ‘why is the pattern there?’ not ‘what enforces it?’"* |  
    | "Anti-Humeanism = theology" | Phase 2 (modal peak) | *"Not necessarily—governing could be a brute fact. PixelWorld’s code isn’t divine; it’s just how the world is built."* |  
    | "Dispute is about existence" | Phase 4 (standoff) | *"Both agree laws exist! They disagree on *what laws are*: summaries vs. builders."* |  
  - **End with diagnostic question (5 mins):**  
    - *"In PixelWorld, is the crate’s constant speed a law? Why would a Humean say no and an anti-Humean say yes?"*  
    - *Correct grasp:* Humean—no, it’s redundant in the best system. Anti-Humean—yes, if the code implies it necessarily. *If they cite simplicity/governing, they get it.*  

  #### **What to Openly Decline (Preempt Early)**  
  - **At the start, say:** *"We won’t resolve whether laws *really* govern, discuss quantum mechanics, or dive into ‘necessity.’ Today’s goal: see why two smart views clash on what laws *are*."*  
  - **If pressed:** *"That’s beyond our scope—but I’d love to discuss it after!"*  

  ---

  **Why this works:**  
  - The **crate’s speed** forces the question: *"Is every exceptionless regularity a law?"* (No → anti-Humean intuition).  
  - The **light ball’s exceptions** force: *"Can a law have exceptions?"* (Yes → Humean systematization).  
  - **Simplicity-strength trade-off** becomes concrete when comparing summaries of the game’s data.  
  - **Peak modal moment** (Phase 2) makes anti-Humeanism feel obvious *before* Humeanism offers a deflationary alternative.  

  **Final Tip:** Let the physicist and engineer debate prediction vs. explanation early—it primes the later clash. Use the theologian’s "sustaining" language to illustrate anti-Humeanism but frame it neutrally as "built-in constraints."
