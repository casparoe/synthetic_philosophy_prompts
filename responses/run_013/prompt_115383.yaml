answer: |-
  Below is the complete "Which Side Are You On?" quiz designed for your philosophy club. It includes 10 concrete scenarios with three answer choices each, written to be accessible to a 16-year-old with no prior jargon. Each choice subtly maps to one of the three stances (physical, design, or intentional) or core ideas about reality, without using technical terms. After the quiz, you'll find a scoring key that maps answer patterns to the six named results you specified. I've also flagged combos that don't map cleanly, explaining why (e.g., incoherent or undefended positions), and noted where the quiz can't distinguish between certain results.

  ---

  ### **Quiz: Is It Real or Just a Useful Story?**
  **Instructions:** For each scenario, pick the answer (A, B, or C) that feels most true to you. Be honest—there are no right or wrong answers!

  1. **Glider in Game of Life**  
     In Conway’s Game of Life, a "glider" is a pattern of cells that moves diagonally. After a few steps, all the original cells are gone, and new ones form the same glider shape in a new spot. Is it the same glider?  
     - A) No, it’s just new cells—the glider isn’t a real thing, only the cells are.  
     - B) It’s useful to call it the same glider to predict where it’ll go, but strictly speaking, it’s just cells changing.  
     - C) Yes, it’s the same glider because the pattern matters more than the cells.  

  2. **Hurricane "Aiming" at the Coast**  
     A hurricane’s path looks like it’s heading straight for the coast, as if it’s "aiming" to hit it. Is the hurricane really aiming?  
     - A) No, it’s just wind and pressure—no goals, just physics.  
     - B) Thinking of it as "aiming" helps us predict its path, but it’s not truly purposeful.  
     - C) Yes, in a way—it’s a complex system acting like it has a goal.  

  3. **Chess Engine "Threatening" Your Queen**  
     A chess program keeps putting your queen in danger, even when you’re not watching. Is it really threatening your queen?  
     - A) No, it’s just code crunching numbers—it doesn’t "threaten" anything.  
     - B) It’s designed to play strategically, so "threatening" is a handy way to describe its moves.  
     - C) Yes, it’s intentionally trying to threaten your queen to win.  

  4. **Bacterium "Swimming" Toward Sugar**  
     A bacterium moves toward higher sugar concentrations. Is it trying to get food?  
     - A) No, it’s just chemicals reacting—no wants or goals.  
     - B) It’s built to seek sugar, so we say it’s "trying" as a shortcut, but it’s automatic.  
     - C) Yes, it’s purposefully swimming to eat.  

  5. **Thermostat "Thinking" It's Too Cold**  
     A thermostat switches on heat when the room cools down. Does it think the room is too cold?  
     - A) No, it’s just a sensor and switch—no thoughts.  
     - B) We talk about it "thinking" to explain what it does, but it’s just mechanics.  
     - C) Yes, in a basic sense, it’s detecting and acting on a "belief."  

  6. **Dollar Bill as "Money"**  
     If everyone forgets what dollar bills are for, is a dollar bill still money?  
     - A) No, it’s just paper—money only exists if people agree it does.  
     - B) It’s designed as money, so it could be money again if people remember, but right now it’s useless.  
     - C) Yes, it’s inherently money because of its history and design.  

  7. **Lion as a "Species"**  
     Is a lion a real thing, or just a label we put on similar big cats?  
     - A) Just a label—only individual cats exist.  
     - B) Grouping them as "lions" helps us study and predict behavior, but it’s not fundamental.  
     - C) Yes, lions are a real category in nature.  

  8. **Chair as "Real" or Atoms**  
     Is a chair a real thing, or just atoms arranged chairwise?  
     - A) Just atoms—the chair is a label for how atoms are arranged.  
     - B) It’s a functional object; calling it a "chair" is useful for how we use it.  
     - C) Yes, the chair is a real object, not just atoms.  

  9. **AI "Wanting" to Make Paperclips**  
     An AI is programmed to maximize paperclip production and acts obsessed. Does it really want to make paperclips?  
     - A) No, it’s just following code—no real desires.  
     - B) It’s useful to say it "wants" paperclips to predict its actions, but it’s not conscious.  
     - C) Yes, it has a genuine goal to make paperclips.  

  10. **All-Knowing Demon and Patterns**  
      A demon knows every particle’s position and never needs approximations. Does it see patterns like chairs or storms?  
      - A) No, it only sees particles—patterns are just human shortcuts.  
      - B) It could see patterns if it chose to, but they wouldn’t tell it anything new.  
      - C) Yes, patterns are real things it would notice, just like particles.  

  ---

  ### **Scoring Key**
  Tally your A, B, and C answers. Then, use the table below to map your answer pattern to one of the six results. If your combo isn’t listed, see the "Unmapped Combos" section for why.

  | Result                                                                                                | Condition                                                                                             |
  |-------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|
  | **A: Only the physics is really real**<br>Everything else is a useful story.                           | **7+ A’s** (with no more than 3 C’s). Focuses on particles, cells, or code as the only reality.       |
  | **B: Patterns are real but relative**<br>They exist only for beings with limited time/memory.         | **6+ B’s** (with fewer than 5 C’s). Favors "useful story" answers across all questions.               |
  | **C: Patterns are real full stop**<br>They exist independently, regardless of observers.              | **6+ C’s** (with fewer than 5 B’s). Believes patterns like gliders or species are fundamental.       |
  | **E: Mind/meaning are real and irreducible**<br>They can’t be reduced to physics.                     | **3+ C’s in mental questions (Q3,4,5,9)** AND **5+ C’s total**. Prioritizes intention in minds/AI.   |
  | **F: Beliefs/desires don’t exist**<br>We should ditch that vocabulary.                                | **3+ A’s in mental questions (Q3,4,5,9)** AND **5+ A’s total**. Rejects "wanting" or "thinking" as real. |

  #### **Notes on Results**
  - **B vs. D (Can’t Distinguish)**: The quiz **cannot distinguish** between B ("patterns are real but relative") and D ("patterns are just tools, no fact of the matter"). Both map to **6+ B’s** because B and D are pragmatically identical in the quiz’s cases—they both treat patterns as useful fictions. Defenders of B/D often blend these, so I combined them to avoid false precision.
  - **Missing Result?** Result C ("patterns are real full stop") is included but **rarely paired** with mental skepticism (e.g., someone who thinks chairs are real but denies AI desires). This combo is covered under F if they also reject mental states.
  - **Unmapped Combos**:  
    - **High B’s + High C’s (e.g., 5 B’s and 5 C’s)**: Incoherent—B and C contradict (B says patterns depend on observers, C says they don’t). No major philosophy defends this mix.  
    - **High A’s in mental + High C’s elsewhere (e.g., 3+ A’s in Q3,4,5,9 and 5+ C’s)**: Not mapped. This combo (e.g., "beliefs aren’t real, but chairs are") is defensible but niche. It’s excluded to keep results focused; most realists (C) accept mental patterns too.  
    - **Low totals (no dominant pattern)**: E.g., 4 A’s, 4 B’s, 2 C’s. Undefended—philosophies require consistency, so this "middle ground" isn’t claimed by any school.  

  #### **How to Use**
  1. Have participants tally their A/B/C counts and mental A/C counts (for Q3,4,5,9).  
  2. Apply the conditions in order (e.g., if someone has 7 A’s, they’re A, even if they fit E too).  
  3. Discuss unmapped combos as "borderline" cases—great for debate!  

  This quiz emphasizes **what people say about cases** (e.g., denying gliders but accepting chairs) over labels. It’s based on the idea that patterns are "real" when they help predict/compress information (indeed inspired by Dennett, but no jargon included!). Enjoy your philosophy club session!
