prompt: |-
  I have to write an essay for bio class on wether the handicap principle actually explains honest signaling or just re-describes it. My teacher said the key is differential cost: a signal is only honest if it hurts a low-quality peacock more than a high-quality one, otherwise a faker could just copy it. But that makes me wonder if costly signaling is a real explanation at all, or if it's just saying that whatever trait survives is honest because it survived. Please write the essay: weigh both sides, use an everyday example like expensive charity stunts or designer logos, and definately reach a verdict instead of sitting on the fence. Start with the essay itself, no preface, and make the first sentence my verdict.
