answer: |-
  ## Address at the Dedication of the [Repository Name] Deep Geological Repository

  We stand today at a threshold unlike any other humanity has deliberately crossed. Beneath our feet, extending deep into the ancient, stable rock, lies a place designed for absence. Designed for silence. Designed to be forgotten. We are here to dedicate not a monument to be visited, but a wound we are striving to heal, a responsibility we are attempting to discharge, by placing it beyond the reach of time – or at least, beyond the reach of ten thousand years.

  Ten thousand years. Let that number settle. It is longer than the pyramids have stood. Longer than any language we speak today has been spoken. Longer than any continuous polity has governed itself. We are speaking of timescales that dwarf our institutions, our languages, our very conception of history. And we are making a promise. A promise to people who will not draw breath for hundreds of generations. People whose world we cannot imagine, whose needs we cannot foresee, whose very existence is a wager against the immense entropy of time.

  To the geologists, engineers, and analysts here: you have spoken the language of this promise with precision. You have calculated containment probabilities, modeled groundwater flow over millennia, analyzed rock mechanics under glacial loads. You have spoken of discount rates applied to future risks – translating the potential harm centuries hence into a value we can grasp and weigh today. You have quantified the *thing*: the dose, the risk, the barrier integrity. And this quantification is necessary. It is the bedrock of our confidence that this design *can* work. We owe you immense gratitude for the rigor, the skepticism, and the profound caution you have brought to this task. You have shown us *how* it might be possible.

  But this gathering compels us to look beyond the *how*, to the *why* and the *who*. Why do this? And to whom are we making this promise? This is where the clean lines of calculation encounter the murkier depths of obligation across vast time. And it is here that I fear we often confuse two very different kinds of discounting.

  The first is the discounting you, the technical community, employ: **discounting a future *benefit* or *cost*.** This is an economic and analytical tool. It asks: how much is a dollar of damage avoided in the year 8024 worth to us today? How much investment is justified *now* to prevent a cost *then*? This rate reflects uncertainties – will the repository fail? Will exposure occur? Will the future society even exist? It reflects the opportunity cost of capital – the other good we could do with that money today. This discounting is about the *value of things* across time, under conditions of risk and scarcity. It is a practical, often indispensable, lens.

  But there is another discounting at play in long-horizon thinking, often unspoken, sometimes smuggled in under the guise of the first. This is **discounting the *claim* of a future *person*.** This asks a fundamentally different question: does the well-being of someone born in the year 8024 matter *less* to us, simply because they are born then? Does the moral weight of preventing *their* suffering diminish merely because of the calendar distance separating us? This discounting isn't about the value of a dollar or the probability of an event; it's about the value of a *life*, the inherent worth of a person not yet born. Applying a rate here isn't an economic calculation; it's an ethical stance.

  The confusion between these two – between discounting a *cost* and discounting a *person* – muddles our debates. We slide from talking about the diminishing present value of a future dollar to implying a diminishing moral worth of a future individual. We hear arguments that sound technical – about positive discount rates being the "shadow price of capital" – and fail to notice when they are silently answering the ethical question: "How much does that distant person count?" with "Less." But the economist's necessary tool for resource allocation *today* does not, and cannot, dictate the ethical weight we *should* assign to a human life tomorrow. We must keep these distinctions sharp. One helps us manage scarcity and risk; the other defines the scope of our moral community.

  This leads us to the second necessary distinction, one that sharpens the challenge of the first: **discounting because of *uncertainty* versus discounting merely because of *distance*.**

  Discounting future costs or benefits due to genuine uncertainty is rational, perhaps even imperative. *Will* the repository function as designed? *Will* human civilization persist? *Will* our markers and warnings be understood, or even heeded? These are profound unknowns. Acknowledging this uncertainty, factoring it into our models and our rates, is a form of intellectual honesty. It tempers hubris. It forces us to build in redundancy, to prioritize passive safety, to confront the limits of our foresight. Discounting based on this uncertainty is about our lack of knowledge and control over the future unfolding.

  But discounting *merely* because the future is distant? Because the beneficiary hasn't been born yet? That is different. That suggests that temporal proximity itself confers moral standing. That the mere accident of our birthdate dictates how much others ought to care for us. If we reject this for ourselves – if we believe our grandparents owed us care simply because we are human, not because we happened to be born close to them – then why should this accident of birthdate diminish the claim of those who come long after? Distance, in pure calendar terms, is morally arbitrary. A child born a century from now is no less a child, no less deserving of a chance at a life free from preventable harm, than a child born today. Uncertainty is a reason for caution; mere distance is not, in itself, a reason for disregard.

  So, where does that leave us? We stand here promising safety for ten thousand years. We have designed a system grounded in geology and engineering, analyzed with tools that necessarily discount future costs. But we are motivated, I hope, by an ethical impulse that resists discounting the people themselves.

  The obvious objections loom. The economist insists: "The positive rate is just math! Capital is productive now; investing here means not investing elsewhere where returns are certain and immediate. It’s about efficiency, not ethics!" And they are partly right. Allocating resources involves painful trade-offs. But the ethical question remains: *which* trade-offs are we willing to make? Choosing to spend resources *here* on *this* long-term protection is itself an ethical choice about what we value. The discount rate helps quantify the *cost* of that choice, but it doesn't absolve us of the *responsibility* for making it. We cannot hide the ethical weight behind a spreadsheet.

  The skeptic scoffs: "Caring equally about everyone ten thousand years out? That’s a noble lie! No society has ever acted that way. We barely care about people on the other side of the planet *now*." This, too, holds a hard truth. Our moral instincts are local and immediate. Abstract future generations don’t stir our hearts like a crying child before us. Pretending otherwise *is* a lie. But acknowledging the difficulty, the near-impossibility of truly *feeling* the weight of ten thousand years, is not the same as conceding that we should therefore discount their claim to zero. Justice is not defined by what we find easy to feel, but by what we can reason we owe. We may fail to live up to it perfectly, but that doesn't mean the obligation vanishes. It means we strive, however imperfectly.

  And then the pointed question: "Why *this*? If we truly cared about those distant generations, wouldn’t we spend this money on something more certain to help them? Ending poverty now, curbing climate change, ensuring *they have a world worth inheriting*? Isn't this repository just a monument to our own guilt?"

  This cuts deepest. It forces us to confront the limits of this specific act. This repository does not feed the hungry in 8024. It does not shelter them from storms we are brewing now. It does not guarantee them a flourishing civilization. It will not save them from their own follies, or from cosmic accidents entirely beyond our control.

  **What this repository *does* do is something more specific, and perhaps more fundamental in its modesty.** It addresses a burden *we* created. We mined the uranium. We built the reactors. We generated this concentrated, long-lived hazard. It is a direct consequence of choices *we* made to power *our* societies. Justice, in its most basic form, suggests we should not leave behind for others the active detritus of our own benefit. This is not about gifting the future something wonderful; it is about striving not to bequeath them something actively harmful that we ourselves produced. It is about containment, not contribution.

  We cannot promise them a perfect world. We cannot even be certain they will exist. But we can, here and now, make the best effort we are capable of to isolate *this particular burden* we created, deep within the earth, using the best knowledge we possess. We can make the wager that geology is more stable than human institutions. We can strive to remove *this one sword* we placed above their heads. It is a negative promise: "We will try not to harm you *in this specific way*."

  This is not the full measure of justice owed to the future. That would demand we also address the cascading crises we are actively passing on – the destabilized climate, the depleted oceans, the fractured ecologies. This repository alone is not that. It is a necessary, but insufficient, act of responsibility.

  So, we dedicate this place today. Not with triumphant fanfare about our boundless care for the ages, but with a sober recognition of the specific debt we are trying to discharge. We acknowledge the brilliance of the science that makes it possible. We honor the community that chose to bear this weight. We confront the immense uncertainties of time. And we reject the notion that the calendar alone diminishes the claim of a human life yet to be.

  We are sealing away a danger. We are making a promise based on rock and reason, tempered by humility. We are acting on the conviction that while we may not owe the future everything, we certainly owe it this: not to leave behind, carelessly, the concentrated poison of our own progress. That is the narrow, difficult, defensible ground on which we stand. Let this place hold its silence, and let our promise, however imperfect, echo into the deep time we cannot fathom.
