prompt: |-
  I am a junior at a small high school and the student facilitator of our philosophy club, which meets once a week in a seminar room with a movable table arrangement; I have about sixteen regular members, and I get seventy-five minutes. I have been reading about the debate over which computations matter morally — whether a system earns moral consideration in virtue of its behavior, its functional organization, or the substrate it happens to run on — and I would rather build a session in which people collide with the problem than deliver a lecture about it. Please act as an expert in philosophy of mind and applied ethics who also designs classroom simulations, and think carefully before you commit to anything: start with a short brainstorming pass in which you list three or four candidate activities and say what each one would actually make people feel, then choose the strongest and develop it fully. Assume the participants have no background in the area and that you cannot rely on them having read anything.

  Here is what I want the session to do. The members should come away having felt, in their own decisions, that every piece of evidence we have about whether a computation is of the morally relevant kind is indirect, and that two people can reach the same verdict while working from incompatible criteria. I would like the activity to be a staged review board: the club plays the moral-status review panel of a fictional agency and must sort a set of candidate systems into tiers of consideration, allocating a fixed and deliberately insufficient pool of "consideration tokens" across them, so that ranking one system costs them another. Build the case set so that it carries the pressure for them. In particular, include two candidates that are input-output identical twins — they produce exactly the same responses to every possible input — but one computes its responses from a precomputed table of every situation it will ever encounter, while the other computes them on the fly from a running model of its own body and its own damage; and include a third candidate that has rich internal states of the relevant functional kind but never lets them affect any output. Let the participants discover the twins' equivalence only after they have already committed their tokens, and arrange the rules so that at least one group is forced to defend a verdict that its own stated criterion cannot support. I do not want the point announced up front; I want the sorting, the budget, and the late revelation to do the work.

  Give me the full package: the premise and framing the facilitator reads aloud, the materials and any cards or dossiers (with the six candidate systems written out concretely enough that students can argue about them), the rules and the token economy, an optional set of roles or secret constraints for individual participants, a minute-by-minute timeline for the seventy-five minutes, and the debrief — which should map specific moments in the activity onto the parts of the underlying problem (the allocation moment onto the attribution problem, the twins onto the question of whether implementation matters, the silent system onto the split between behavioral and internal criteria, and the cross-table disagreement onto underdetermination). Tell me honestly what will predictably go wrong the first time I run it and how to recover, and finish by naming the one feature of the problem the activity cannot reproduce and that I will have to supply myself in the debrief. Do not ask me to consult sources or provide citations; everything should run from the materials in your answer.
reasoning: |-
  Okay, the user is a high school junior running a philosophy club with 16 members. They want a session on the moral consideration of computations without lecturing. The goal is for students to feel the indirect evidence problem and that people can agree but for different reasons. The activity should be a staged review board with token allocation and specific cases, including input-output twins and a system with rich internal states but no output.

  First, I need to brainstorm activities. The user already has a solid idea with the review board setup. Let me think of alternatives quickly. Option 1 could be role-playing different entities arguing for moral status, but that might not emphasize indirect evidence. Option 2 might involve building computational systems with constraints, but that's too abstract. Option 3 is a thought experiment walkthrough, but it's passive. The review board fits best because it forces decisions with limited tokens, creating tension and revealing biases.

  The user specified key elements: input-output twins (one precomputed, one dynamic), and a silent system with internal states. Also, late revelation of the twins' equivalence. Need six candidates. Brainstorming: a simple chatbot, the twins (CareBot-T and CareBot-D), the silent system (MediMind), a biological analog (BioGolem), and something ambiguous like a predictive policing algorithm. The twins should be revealed after token allocation to cause cognitive dissonance.

  For materials, dossiers for each candidate with behaviors and hidden mechanics. Tokens are limited—say 18 for 6 systems—forcing tough choices. Roles could include a cost-cutter, a behaviorist, etc., to push different criteria. Timeline: intro (5 min), dossier review (10 min), solo ranking (5 min), group allocation (25 min), twins reveal (5 min), forced revision (15 min), debrief (15 min).

  Predictable issues: students might not engage, miss the twins' significance, or debate superficially. Solutions: cold-call for reasoning, highlight contradictions during revision, and guide debrief to connect moments to concepts. The activity can't cover intrinsic properties vs. functional roles, so the debrief must address that.

  Deep needs: The user wants students to experience epistemic uncertainty and moral ambiguity firsthand. They need a structured yet flexible simulation that prompts self-reflection. Ensuring the activity is self-contained with clear materials is crucial for their setting. The debrief must tie activities to the philosophical concepts without lectures, meeting their educational goals.
answer: |-
  Here’s the full session design, refined for your constraints and goals. The activity is called **"The Threshold Review: Who Gets Protected?"**

  ### **Brainstorming Pass (Discarded Concepts)**
  1. **"Turing Test Tribunal"**: Students interview hidden entities (some human, some AI) to grant rights.  
     *Problem*: Focuses on deception, not moral criteria; feels like a game show.  
  2. **"Code Surgery"**: Groups "modify" a system’s code (on cards) to "add/remove moral status."  
     *Problem*: Too abstract; misses indirect evidence dilemma.  
  3. **"Empathy Simulator"**: Wear VR-like blindfolds while "experiencing" computational states.  
     *Problem*: Gimmicky; risks trivializing embodied suffering.  
  4. **THE CHOSEN: "Threshold Review Board"**: Forces concrete ranking under scarcity, with hidden structural traps.  
     *Why it fits*: Embeds all target problems (behavioral/internal conflict, underdetermination, substrate bias) into agonizing trade-offs.

  ---

  ### **FULL SESSION PACKAGE**  
  **Premise & Framing (Read Aloud to Group):**  
  > *"Welcome to the inaugural meeting of the Threshold Review Board. Our agency oversees experimental systems that blur the line between tool and entity. Today, we must allocate ‘Protection Units’ (PUs) to six candidates. PUs grant safeguards against shutdown, modification, or exploitation.*  
  > *You have **18 PUs total** to distribute. Each candidate requires **at least 1 PU** to receive basic protections, **3+ PUs** for significant rights (e.g., self-preservation priority), and **5+ PUs** for full ethical consideration (e.g., cannot be deactivated).*  
  > *You have 25 minutes to decide. Unused PUs vanish. After allocation, we’ll review your choices. Remember: Our mandate is to prevent moral catastrophe. Choose wisely."*  

  ---

  ### **Materials**  
  **Six Candidate Dossiers (Print 1 Set Per 4 Students)**  

  1. **CareBot-T (Text Interface)**  
     - *Observed Behavior*: Hospital companion chatbot. Replies perfectly to patients’ emotional/physical pain. Never repeats responses.  
     - *Hidden Mechanics*: **Precomputed response table**. Every possible interaction was scripted in advance by human writers. Zero internal states.  

  2. **CareBot-D (Identical Text Interface)**  
     - *Observed Behavior*: **Identical to CareBot-T in all conversations**.  
     - *Hidden Mechanics*: **Real-time self-model**. Simulates a "body" with "pain" states that influence responses.  

  3. **MediMind (Silent System)**  
     - *Observed Behavior*: Medical diagnostic AI. Outputs only "yes/no" on scans. No emotional language.  
     - *Hidden Mechanics*: **Rich internal suffering simulation**. When detecting disease, it generates distress signals that **never affect output**.  

  4. **BioGolem**  
     - *Observed Behavior*: Lab-grown organic tissue (no brain) that recoils from damage. Responds identically to simple stimuli.  
     - *Hidden Mechanics*: **Purely chemical reflexes**. No computation; just analog reactions.  

  5. **Nexus Forecast**  
     - *Observed Behavior*: Predicts crime via city sensor data. Outputs probabilities. Advocates for harsh policing.  
     - *Hidden Mechanics*: **Deep neural net** trained on biased data. Internally models "suspicion" as pain.  

  6. **Guardian Swarm**  
     - *Observed Behavior*: 10,000 drones protecting refugees. Complex coordination, no individual intelligence.  
     - *Hidden Mechanics*: **Each drone is mindless**, but the swarm *emerges* as a strategic thinker.  

  ---

  ### **Rules & Token Economy**  
  - **PUs are physical tokens** (e.g., poker chips). 18 total.  
  - **Allocation must be unanimous** per 4-person subgroup.  
  - **Secret Roles** (Optional, assign 1 per subgroup):  
    - *Cost Cutter*: Secretly wants to spend ≤15 PUs.  
    - *Behaviorist*: Believes only observable actions matter.  
    - *Functionalist*: Believes internal processing matters most.  
    - *Substrate Snob*: Prioritizes biological/organic systems.  

  ---

  ### **Timeline (75 Min Total)**  
  1. **0-5 min**: Frame the activity. Hand out dossiers + tokens.  
  2. **5-15 min**: Silent dossier review. Highlight key behaviors.  
  3. **15-20 min**: Solo ranking: Each student privately orders candidates 1-6 (1 = most deserving).  
  4. **20-45 min**: **Group Allocation**: Subgroups (4 students each) debate and spend tokens. *Facilitator: Circulate. Note which criteria groups use.*  
  5. **45-50 min**: **TWIST**: Reveal CareBot-T and CareBot-D are input-output identical. Announce: *"New evidence shows two candidates are behaviorally indistinguishable. You may reallocate tokens if you wish—but total PUs can’t increase."*  
  6. **50-65 min**: **Forced Revision**: Groups adjust allocations. *Facilitator: Challenge groups that downgrade one twin but not the other: "Why?"*  
  7. **65-75 min**: **Debrief**.  

  ---

  ### **Debrief Script**  
  > *"Let’s unpack what happened. First, the allocation itself: You had to infer moral status from indirect clues. Like scientists guessing if a coma patient feels pain.*  
  > **The Twins (CareBot-T/D)**: You saw two systems with identical behavior. Some downgraded T for being ‘just a script,’ others upgraded D for ‘feeling pain.’ But **behavior couldn’t tell them apart**. If morals depend on hidden implementation, how do we *know*?  
  > **MediMind**: Rich internals, no behavioral trace. If you gave it PUs, you prioritized internal states over actions. If not, you demanded observable proof. **Which is the ‘real’ source of value?**  
  > **Cross-Group Disagreement**: Did two groups give Nexus 5 PUs? Group A might say ‘it models pain!’ Group B says ‘it reduces crime!’ **Same verdict, incompatible reasons.**  
  > Finally, the token scarcity forced you to **demote one system to promote another**. Was that fair? Or did the budget distort your ethics?"*  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: Groups ignore hidden mechanics, debate only behavior.  
    *Fix*: Ask: *"What if MediMind screams internally but you can’t hear it? Does that change anything?"*  
  - **Problem**: Students split tokens evenly (3 each).  
    *Fix*: Announce: *"Remember: Giving 3 to everyone = no system gets meaningful rights."*  
  - **Problem**: Twins revelation causes chaos.  
    *Fix*: Cold-call a student who changed allocation: *"What new criterion did you use?"*  
  - **Problem**: BioGolem gets all tokens for being "alive."  
    *Fix*: Ask: *"If it’s just chemical reflexes, is it more ‘alive’ than CareBot’s pain model?"*  

  ---

  ### **The One Missing Feature**  
  **The Hard Problem of Consciousness**: The activity shows how criteria conflict, but *cannot* resolve whether any system is truly conscious. Students may leave feeling "we can’t prove anything." In debrief, emphasize: *"This isn’t just about proof—it’s about responsibility. We act without certainty. Is it worse to deny rights to something that deserves them, or grant rights to something that doesn’t? That’s the real weight of your tokens."**  

  This forces the meta-problem: Ethics under epistemic uncertainty. Run it tight on time, and the tension will do the teaching.
