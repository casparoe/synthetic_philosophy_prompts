prompt: |-
  I'm a software engineer with no formal background in philosophy, and I've somehow been drafted into running a monthly lunch-and-learn for my team — a mix of engineers, a couple of PMs, and one designer, none of whom have read any decision theory. Next month I've claimed the topic of satisficing and bounded rationality, and I'd like you to act as an expert in the philosophy and cognitive science of decision-making who is also a genuinely good teacher, and to design the session for me rather than deliver it. What I need is a teaching plan: the order in which the ideas must be introduced so that each step actually depends on the one before it, rather than a list of topics in a sensible-sounding sequence. Begin by thinking through, in a scratchpad you can share with me, what the load-bearing components really are and which of them cannot be said until something else is already in place — my own suspicion is that the whole thing collapses if you introduce the descriptive reading of satisficing and the normative/prescriptive reading in the wrong order, but tell me if that suspicion is misplaced.

  On the carrying example: my instinct is to build the entire session on a single concrete case, and the one I had in mind is a hiring decision — we interview candidates and make an offer to the first one who clears our bar, instead of interviewing everyone and ranking them. Evaluate that candidate seriously. Does it actually exhibit what has to be exhibited, or does it quietly smuggle in an optimization story (we can always say the bar itself was chosen to maximize something, and then haven't we just optimized with extra steps)? If it won't carry the weight, tell me what the example must have and must lack, and give me the one you'd use instead, concrete enough that I can put it on a single slide. Then map the misconceptions I should expect, in the order they will actually surface in the room, and tell me precisely where in the sequence to head each one off: I'm already expecting "satisficing just means settling for something mediocre," "bounded rationality is a polite word for being irrational," "this is really just optimization once you add a search cost, so there's nothing new here," and probably "it's a claim about individuals, not about firms or teams." For each, I want the moment in the plan where it needs to be defused, not a general rebuttal I can deliver at any point.

  Finish with one question I can put to the room at the end that would show whether the distinction actually landed rather than whether they can repeat my vocabulary, and tell me what I should deliberately leave out at this level and say out loud that I am leaving it out. Please don't hand me a reading list — nobody in the room is going to read anything.
reasoning: |-
  We are designing a teaching plan for a session on satisficing and bounded rationality for a team of software engineers, PMs, and a designer with no prior background in decision theory. The goal is to build understanding step by step, with each step depending on the previous one.

  Key considerations:
  - The session must be built on a concrete example that clearly illustrates the concepts without smuggling in optimization.
  - We must address common misconceptions at the right moments to prevent them from derailing the understanding.
  - The plan must sequence ideas so that foundational concepts are in place before more complex ones.

  The hiring example (making an offer to the first candidate who clears the bar) is a good candidate because:
  - It's familiar to the audience.
  - It seems to avoid the need to rank all candidates (which would be optimizing).
  - However, there is a legitimate concern: the bar itself might be set by an optimization process (e.g., we set the bar to maximize expected utility, considering search costs). This would indeed reduce satisficing to optimization with extra steps.

  To avoid this, we need to emphasize that in bounded rationality, the bar is set by a heuristic or rule of thumb that is not necessarily the result of optimization. We can present the bar as being set by experience, company standards, or even arbitrarily, without a formal model of the entire decision space.

  Alternatively, we can use an example that is more clearly non-optimization. Let me propose:

  **The "Apartment Hunting" Example**: 
  You are moving to a new city and need to rent an apartment. You have limited time (say, one weekend) to find one. You set a list of criteria (e.g., maximum rent, minimum number of bedrooms, maximum commute time) and you commit to taking the first apartment that meets all your criteria. You do not look at every available apartment, nor do you try to find the absolute best. You stop when you find one that is "good enough".

  Why this example works:
  - It's relatable.
  - It clearly involves time constraints (bounded rationality) and a satisficing strategy (first acceptable option).
  - The criteria are set in advance and are not the result of a formal optimization (they might be based on your budget and needs, but without considering the entire market or computing expected utilities).

  But even here, one might argue that the criteria were set optimally. To counter, we can note that the criteria are often set by practical constraints (e.g., "I can't spend more than $X because that's my budget") and that the decision to stop at the first satisfactory option is a heuristic to avoid the cost of continued search.

  We'll use the apartment example. However, if the hiring example is more relevant to the team, we can use it but with a twist: the bar is set by a quick heuristic (like "must have 5 years of experience in Java") and the decision to hire the first acceptable candidate is due to the high cost of interviewing (time, losing candidates to other offers, etc.). We must stress that the bar is not set by an optimization process that considers the entire candidate pool and all possible trade-offs, but by a practical, rule-of-thumb.

  I will design the session around the apartment example, but note that we can substitute the hiring example if preferred.

  **Teaching Plan Structure**:

  1. **Set the stage with a problem of choice under constraints** (to introduce bounded rationality naturally)
  2. **Introduce the classical model of rational choice (optimization)** as a contrast, but quickly show why it's often infeasible.
  3. **Introduce bounded rationality** as a response to these feasibility issues.
  4. **Define satisficing** as a strategy within bounded rationality.
  5. **Clarify the descriptive vs. normative aspects** (with care: descriptive first, then normative?).
  6. **Address misconceptions** as they naturally arise in the flow.

  **Detailed Plan**:

  **Step 0: The Concrete Example (to anchor the session)**
  - Present the apartment hunting scenario. Ask: "How would you approach this? Would you look at every apartment? Would you set some criteria and take the first that meets them? Would you try to find the best?"

  **Step 1: The Classical Ideal: Optimization**
  - Explain that in classical decision theory, a rational agent would:
    - Identify all possible alternatives (apartments in the city).
    - Evaluate each against a utility function (considering rent, location, size, etc.).
    - Choose the one with the highest utility.
  - But note: this is often impossible because:
    - The set of alternatives is huge (or unknown).
    - The time and cognitive resources required to evaluate each are prohibitive.
  - *Why now?* We start with the classical model to set up the problem that bounded rationality solves.

  **Step 2: Bounded Rationality**
  - Introduce Herbert Simon's concept: human decision-makers are bounded by:
    - Limited information
    - Limited time
    - Limited cognitive capacity
  - Therefore, they cannot optimize in complex real-world situations. They must use shortcuts (heuristics) to make decisions that are feasible.
  - *Why now?* The infeasibility of optimization leads naturally to bounded rationality.

  **Step 3: Satisficing as a Strategy**
  - Define satisficing: setting an aspiration level (the criteria) and accepting the first alternative that meets or exceeds it.
  - In the apartment example: set criteria (max rent $2000, at least 2 bedrooms, <=30 min commute) and take the first apartment that meets all.
  - Emphasize: the criteria are set in advance and are not adjusted during the search (at least in the basic model). They are based on what is "good enough", not on the best possible.
  - *Why now?* After bounded rationality, we introduce a specific strategy that works within those bounds.

  **Step 4: Descriptive vs. Normative**
  - **Descriptive**: This is how people actually decide in many situations (e.g., apartment hunting, hiring). We observe satisficing behavior.
  - **Normative/Prescriptive**: Satisficing is not just what we do; it can be what we *should* do when optimization is infeasible. It is a rational response to bounded constraints.
  - *Order: Descriptive first, then normative.* Why? Because we start by observing behavior (which is easier to accept) and then argue that it is a rational strategy. This order avoids the common mistake of thinking that satisficing is a second-best or irrational strategy. We show that it is a smart response to constraints.
  - *Why now?* After introducing the strategy, we address its status: it's not just a description of human frailty but a prescriptive approach.

  **Addressing Misconceptions**:

  We must weave in the refutations at the points where the misconceptions are likely to arise:

  1. **"Satisficing just means settling for something mediocre"**:
     - This is likely to come up when we first define satisficing (Step 3). We must immediately clarify:
       - Satisficing does not mean low standards. The aspiration level (the bar) can be set high. It means stopping the search when you find an option that meets your (possibly high) standards, rather than searching for the absolute best.
     - *Where to address*: In Step 3, when defining satisficing, explicitly contrast "good enough" with "mediocre". Give an example: if you set the bar at 4 out of 5 stars, then you are not settling for mediocrity; you are setting a high bar and taking the first that clears it.

  2. **"Bounded rationality is a polite word for being irrational"**:
     - This might come up when introducing bounded rationality (Step 2). We must clarify:
       - Bounded rationality is not irrationality. It is rationality within realistic constraints. It's about making the best possible decision given limited resources, not about making bad decisions.
     - *Where to address*: In Step 2, immediately after defining bounded rationality, contrast it with irrationality. Emphasize that bounded rationality is a model of rational decision-making under constraints.

  3. **"This is really just optimization once you add a search cost, so there's nothing new here"**:
     - This is a sophisticated objection that might arise when we present satisficing as a normative strategy (Step 4). We must clarify:
       - While it is true that one can model search costs and then optimize (e.g., optimal stopping), in practice, the information and computational requirements to do that optimization are often prohibitive. Satisficing is a heuristic that works without requiring that full optimization.
     - *Where to address*: In Step 4, when discussing the normative aspect, acknowledge that optimization with search costs is a theoretical possibility, but then argue that satisficing is a practical alternative when the optimization is too complex. Stress that bounded rationality is about the actual cognitive processes, not about an idealization.

  4. **"It's a claim about individuals, not about firms or teams"**:
     - This might come up when we discuss the application. We must clarify:
       - Bounded rationality applies to organizations as well. Teams and firms also face constraints (time, information, coordination). Satisficing can be a strategy for teams too (like in the hiring example).
     - *Where to address*: When we apply the concepts to the team's context (after Step 4). We can say: "Now, how does this apply to our team? We are bounded too! We have limited time and resources. So, we might use satisficing in our decisions, like in hiring."

  **Final Question to Check Understanding**:

  Instead of asking for definitions, we can present a scenario and ask how they would approach it and why. For example:

  "Imagine you are designing a new feature and there are many possible implementations. You have one week to decide on one and start building. How would you approach this decision? Would you try to evaluate every possible implementation? Why or why not? What strategy would you use and why?"

  What we are looking for:
  - They should recognize that evaluating every option is infeasible (bounded rationality).
  - They might suggest setting criteria (e.g., must meet performance benchmarks, must be maintainable) and choosing the first implementation that meets them (satisficing) or perhaps another bounded rationality strategy (like using a heuristic).
  - They should be able to explain why optimization is not feasible and why satisficing is a rational response.

  **What to Leave Out**:

  At this level, we should avoid:
  - The mathematical formalizations of bounded rationality (e.g., computational complexity arguments).
  - The debates between different schools (e.g., Simon vs. the heuristics and biases program of Tversky and Kahneman).
  - Advanced topics like aspiration adaptation (how the bar might change over time).

  Explicitly state: "We are leaving out the mathematical details and some of the deeper debates in the field to focus on the core ideas that you can apply in your work."

  **Summary of the Teaching Plan**:

  1. **Start with the example**: Apartment hunting (or hiring) scenario. Get initial reactions.
  2. **Classical optimization**: Present as an ideal, then show why it's infeasible.
  3. **Bounded rationality**: Introduce as a response to the constraints.
  4. **Satisficing**: Define and illustrate with the example.
  5. **Descriptive and normative**: First, describe how people actually use satisficing, then argue that it is a rational (prescriptive) strategy.
  6. **Address team context**: Apply to the team's work (e.g., hiring, feature design).
  7. **Final question**: Scenario to check understanding.
  8. **Explicitly leave out**: Mathematical details and advanced debates.

  With this plan, the ideas build step by step, and we address misconceptions at the points where they naturally arise.
answer: |-
  ### Teaching Plan: Satisficing and Bounded Rationality  
  *Designed for a 45-60 minute session with no prior philosophy background. Built on a single concrete example to ensure coherence.*

  ---

  ### **Core Structure: Step-by-Step Logical Dependencies**  
  Your suspicion is correct—the order of descriptive vs. normative concepts is critical. We start descriptively (how humans *actually* decide) to ground the discussion in observable behavior, then transition to normative (why this is *rational* under constraints). Introducing normative too early risks framing satisficing as a "flaw" rather than an adaptive strategy.  

  **Load-Bearing Ideas & Dependencies**:  
  1. **Real-world constraints must precede bounded rationality**  
     (Without establishing why optimization fails, bounded rationality seems unnecessary.)  
  2. **Descriptive satisficing must precede normative claims**  
     (Showing "this is what humans do" before "this is smart" avoids misinterpretation as laziness.)  
  3. **Bounded rationality must be framed as *adaptive* before addressing misconceptions**  
     (Otherwise, "irrational" accusations derail the conversation.)  

  ---

  ### **The Concrete Example: Why "Apartment Hunting" Beats "Hiring"**  
  Your hiring example risks smuggling in optimization (e.g., "the bar was optimized!"). Instead, use:  

  **The Apartment Hunt**:  
  *You have 1 day to find a rental in a new city. You set minimum criteria: ≤30 min commute, ≤$2,000/month, 2+ bedrooms. You visit apartments in random order and rent the **first** that meets all criteria. You don’t see all options or rank them.*  

  **Why this works**:  
  - **Exhibits satisficing**: Clear "aspiration level" (criteria), search stops at first success.  
  - **Avoids optimization**: Criteria are fixed upfront based on rough needs (not calculated trade-offs). No ranking or utility maximization.  
  - **Highlights constraints**: Limited time/cognition (1 day, unfamiliar city), unknown options.  
  - **Relatable**: Everyone has faced time-pressured decisions.  

  **One-Slide Visual**:  
  ```  
  [Apartment Hunt Flow]  
  Constraints: 1 day, unknown options  
  Criteria: ≤30 min commute, ≤$2,000, 2+ bedrooms  
  Action: Rent FIRST apartment meeting criteria  
  ```  

  ---

  ### **Teaching Sequence**  
  *Each step builds on the prior. Common misconceptions are addressed at the point they’re likely to surface.*

  #### **Step 1: Set Up the Problem (5 min)**  
  - **Activity**: Pose the apartment-hunt example. Ask: *"What would you do? Would you try to see every apartment? Why/why not?"*  
  - **Goal**: Surface real-world constraints (time, information gaps, effort).  
  - **Dependency**: Must start here to make constraints visceral.  

  #### **Step 2: Contrast with Classical Rationality (Optimization) (5 min)**  
  - **Explain**: *"The ‘ideal’ decision: List ALL options, rank them perfectly, choose the best."*  
  - **Why infeasible?**: In apartment hunt, this requires infinite time/ knowledge.  
  - **Key Insight**: Optimization is mathematically elegant but often impossible in practice.  
  - **Dependency**: Without this, bounded rationality seems like an arbitrary "shortcut."  
  - **Misconception Head-Off**:  
    - *"But isn’t setting criteria just optimization in disguise?"* → **Address here** by stressing:  
      *"Criteria are based on rough needs (e.g., budget), not calculated trade-offs. We don’t know if a ‘better’ apartment exists—we stop to avoid wasting time."*  

  #### **Step 3: Introduce Bounded Rationality (Descriptive) (10 min)**  
  - **Define**: *"Human decisions are ‘bounded’ by limited time, information, and brainpower."*  
  - **Evidence**: Cite Herbert Simon’s research (e.g., chess masters don’t calculate all moves; they use heuristics).  
  - **Apartment Link**: *"You can’t see all apartments → you adapt by using a ‘fast and frugal’ rule."*  
  - **Dependency**: Must follow Step 2 to show this as a response to optimization’s failure.  
  - **Misconception Head-Off**:  
    - *"Bounded rationality = irrational?"* → **Address here** by reframing:  
      *"It’s not ‘irrational’—it’s smart adaptation. Like a chess master sacrificing perfection for speed."*  

  #### **Step 4: Define Satisficing (Descriptive) (10 min)**  
  - **Define**: *"Satisficing = Setting an ‘aspiration level’ (criteria) and accepting the first option that meets it."*  
  - **Apartment Link**: *"You satisfice by renting the first apartment meeting your criteria."*  
  - **Dependency**: Must follow Step 3 to frame satisficing as a tool for bounded agents.  
  - **Misconception Head-Off**:  
    - *"Satisficing = settling for mediocre?"* → **Address here** by emphasizing:  
      *"Mediocre ≠ good enough. Your criteria can be high (e.g., $2K rent isn’t cheap!). Satisficing avoids perfectionism, not quality."*  

  #### **Step 5: Transition to Normative (Why Satisficing is Smart) (10 min)**  
  - **Argue**: *"When optimization is infeasible, satisficing isn’t just what we do—it’s rational."*  
  - **Why?**: Saves time/effort for other goals (e.g., in apartment hunt, you avoid homelessness).  
  - **Apartment Link**: *"Spending 3 weeks hunting for a ‘perfect’ apartment costs you a job offer."*  
  - **Dependency**: Must follow Steps 3–4 to prevent misreading as "excuse for laziness."  
  - **Misconception Head-Off**:  
    - *"This is just optimization with search costs!"* → **Address here** by clarifying:  
      *"Optimization would require knowing all costs upfront. Satisficing uses simple rules because we often can’t calculate those costs (e.g., how do you value a day of apartment hunting?)"*  

  #### **Step 6: Group Application (5 min)**  
  - **Activity**: *"When have we used this as a team? E.g., choosing a library: We set criteria (‘supports X, easy docs’) and pick the first that works."*  
  - **Dependency**: Steps 1–5 establish this as a universal strategy.  
  - **Misconception Head-Off**:  
    - *"This is for individuals, not teams/firms!"* → **Address here** by noting:  
      *"Teams face tighter constraints (deadlines, coordination). Satisficing avoids analysis paralysis."*  

  ---

  ### **Final Check-for-Understanding Question**  
  **Pose**: *"Your team needs a logging tool. You have 2 hours to choose. Do you:  
  (A) Research all 20 options and rank them,  
  (B) Set 3 key criteria (e.g., ‘free tier, Python support, docs’) and test until one fits,  
  (C) Flip a coin?  
  Why is (B) more rational than (A) here?"*  

  **What Shows Success**:  
  - They identify (B) as satisficing.  
  - They explain that (A) is infeasible (time-bound) and (C) ignores criteria.  
  - They link it to bounded rationality ("We don’t have time to optimize").  

  ---

  ### **What to Leave Out (Explicitly State This)**  
  *"We’re skipping three advanced ideas today to keep this practical:  
  1. How aspiration levels adapt over time (e.g., if you never find an apartment).  
  2. Debate between ‘fast-and-frugal heuristics’ vs. other decision models.  
  3. Mathematical proofs (Simon’s work has them, but we’re focusing on intuition)."*  

  ### **Why This Works**  
  - **Single example** carries the logic without cognitive overload.  
  - **Misconceptions** are defused at the point they’re likely to arise (based on classic cognitive science pitfalls).  
  - **No jargon**: "Aspiration level" is framed as "criteria," "normative" as "smart under constraints."  

  Tailor the apartment example to your team’s context (e.g., "like choosing a cloud service"), but keep the structure intact. Let me know if you need slide templates or dialogue snippets!
