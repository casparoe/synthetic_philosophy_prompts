prompt: |-
  Right, my mate and I had a proper row about this down the pub last night and I want it settled properly, not with more shouting. Here's where I stand, case by case.

  I promised my mate I'd feed his cat while he was away, then forgot, and the cat died. Did I cause the cat's death? Yes. Obviously.

  A bloke walks past a canal, sees a toddler face-down in the water, and keeps walking. The kid drowns. Did he cause the death? No. He's a disgrace, but he didn't kill anyone.

  The nurse on shift doesn't connect the drip. Patient dies. Did she cause it? Yes.

  A storm brings the power line down, the leccy's off for a week, the burglar alarm is dead, and the house gets done over. Did the storm cause the burglary? I want to say yes — the reason the place got robbed is that there was no alarm, and the reason there was no alarm is the storm. But I don't want to say a storm did anything to a house.

  Now the one that broke the argument. My mate's cousin cut the phone line to the cottage so that nobody could ring the fire brigade, and then the place burnt down. Did he cause the house to burn? I say yes — he didn't start the fire, he just made sure nobody could stop it. My mate says if that counts, then the bloke at the canal counts too, because he also failed to stop a death.

  Then the bridge. The inquest said it came down because there was nothing in the design to let the steel expand in the heat. Not a person, not an act — a gap. I still want to say the gap caused the collapse.

  And one more, because it keeps nagging me: there were two of us on the rota to lock up the shop, we each assumed the other had done it, neither of us did, and the place got robbed overnight. I say we both caused that, even though you can't point at either of us and say it wouldn't have happened if only he'd done it.

  My mate's rule is the but-for one: you caused it if it wouldn't have happened had you acted. But that makes the man at the canal a killer, and the storm the cause of the burglary, and honestly it makes all of us the cause of everything we never got round to preventing.

  So — is there a principle that gets my verdicts right, or nearly all of them, without swallowing the whole world? I want it stated properly, not vibes. Tell me what each clause is doing and which case forces it. If a clean principle costs me one of my verdicts, say which one I should give up rather than bolting on another clause to save it; and if no single principle does the job, give me the two best and what each of them costs. I'm not intrested in a list of everything anyone's ever said about this — I want the thing itself, and I want it to tell me what to say about a case I haven't listed: a surgeon who decides not to operate and the patient dies, where operating would've given them maybe a fifty-fifty chance.
reasoning: |-
  Okay, let me try to unpack this user's problem. He's had a heated argument with his mate about causation across different scenarios and wants a clear principle to resolve it. His examples include forgetting to feed a cat leading to its death, a bystander ignoring a drowning child, a nurse failing to connect a drip, a storm causing a burglary, cutting a phone line before a fire, a bridge collapse due to a design gap, and shared responsibility in a shop robbery. The user rejects the simple "but-for" test because it makes everyone responsible for all preventable harms.

  First, I need to understand why the but-for test is problematic for him. It seems too broad, making inaction equivalent to action in all cases. He distinguishes between actively causing harm (like the nurse) versus failing to prevent it (like the canal bystander). His intuition suggests that causation requires more than just conditional necessity—it needs a direct link or a duty to act.

  Looking at his cases, the cat and nurse examples involve a duty (promise, professional role) and direct reliance. The canal bystander has no duty, so his inaction isn't causal. The storm-burglary case is tricky; he feels the storm caused it indirectly, but calling a storm a "cause" feels off. Maybe because natural events aren't agents, but he still sees the causal chain. The phone line cutting is active interference, making it causal. The bridge gap is a design flaw, a static condition, yet he sees it as a cause. The shop robbery involves shared duty, so both are responsible even if individually, their absence wasn't sufficient.

  The key might be combining but-for with a "duty to intervene" or distinguishing acts from omissions. But the storm isn't an omission. Perhaps differentiating between initiating causes (actions that create new risks) and enabling conditions (background factors). The nurse's omission breaks a duty, creating a new risk. The canal bystander doesn't create a risk; he just doesn't mitigate an existing one. Cutting the phone line is initiating a new risk (preventing rescue). The bridge gap is an enabling condition, but critical enough to be seen as causal. The shop case: both had a duty, their combined omission caused the robbery.

  For the surgeon case: not operating where there's a 50% chance. If the surgeon had a duty to operate, failing that duty could be seen as causing the death if but-for applies. But since the survival wasn't certain, causation is probabilistic. The user might accept that the surgeon's omission caused the death only if the operation would likely have saved the patient. Here, 50% is ambiguous. The principle should handle this by requiring that the action would more likely than not prevent the harm, based on duty and directness.

  So the proposed principle has three parts: but-for necessity, duty to prevent, and directness. The surgeon had a duty; operating would have given a chance, but not certainty. If evidence shows the patient would probably have survived, then causation holds; otherwise, not. The user might need to accept that in probabilistic cases, causation isn't clear-cut, which might cost him a verdict. Alternatively, adjust to say that breach of duty suffices if the action had a significant chance of prevention, even if not certain.
answer: |-
  Here's a clear, testable principle that captures your intuitions across almost all cases, explains *why*, and handles new cases like the surgeon. It rests on two core ideas: **"But-for" necessity + a breach of a specific duty to prevent the specific harm.**

  **The Principle:**

  > **You caused Harm H if:**
  > **1.  But-For Condition:** H would not have occurred *when or how it did* but for your conduct (act *or* omission); **AND**
  > **2.  Duty & Breach:** You had a specific, established duty (legal, contractual, role-based, or undertaken) to prevent H (or a harm of that type); **AND**
  > **3.  Direct Mechanism:** The mechanism linking your breach to H was direct and foreseeable – your breach created, substantially increased, or deliberately exploited the immediate, specific risk that materialized as H, rather than merely failing to mitigate a pre-existing or unrelated risk.

  **How it Works Clause-by-Clause & Why Your Cases Force Each Part:**

  1.  **But-For Condition (Forces Causal Link):** This ensures there's *some* causal link. Without your action/inaction, the harm wouldn't have happened *in that specific way or at that specific time*. This eliminates truly random events or harms that would have happened regardless.
      *   **Forces Clause:** All your "Yes" verdicts require this (Cat, Nurse, Phone Line, Bridge Gap, Shop Robbery - both of you). It also forces the Storm/Burglary link and the Canal link. *But this alone isn't enough*, which is why you reject the "whole world" problem.

  2.  **Duty & Breach (Limits Scope to Responsible Parties):** This is the key filter preventing the "whole world" problem. It restricts causation to situations where society or specific agreements impose an *obligation* on *you* to act to prevent *this specific type of harm*.
      *   **Forces Clause:** Your "No" verdict on the Canal Man forces this. He had *no duty* to rescue the toddler (absent a special relationship like parent/guardian, lifeguard, etc., which isn't stated). He's morally reprehensible, but causally irrelevant under this principle.
      *   **Explains Verdicts:**
          *   **Cat:** You undertook a specific duty (promise) to feed the cat, preventing its death by starvation. Breached duty.
          *   **Nurse:** Had a professional duty (role-based) to provide care (connect drip) to prevent patient death. Breached duty.
          *   **Phone Line:** Had a *duty not to actively create danger* (a fundamental legal duty). Cutting the line wasn't mere inaction; it was an *act* breaching the duty not to sabotage safety measures, directly creating the inability to call for help.
          *   **Shop Robbery:** Both had a specific duty (job role/rota) to lock up, preventing burglary. *Both* breached their duty. The "but-for" condition holds for *both* because the robbery wouldn't have happened *that night* if either had fulfilled their duty (either one locking up would have prevented it). The principle captures joint causation through shared duty/breach.
          *   **Surgeon (New Case):** Has a professional duty to provide indicated care. Deciding *not* to operate (omission) breaches that duty *if* operating was the standard of care. **Verdict depends on probability:** If operating offered a >50% chance of survival, breaching the duty likely *caused* the death (but-for: patient *probably* wouldn't have died then). If it was <50% (long shot), the breach exists, but causation fails the but-for test (death was more likely than not anyway). If exactly 50%, causation is arguable but weak.

  3.  **Direct Mechanism (Prevents Over-Extension & Captures Intuition):** This ensures the link isn't too remote or merely background. Your breach must be tightly connected to the *realization of the specific risk* it was meant to guard against.
      *   **Forces Clause:** Your unease with the Storm/Burglary forces this. The storm *is* but-for (no power, no alarm). But the storm breached *no duty* to the homeowner. More importantly, the storm didn't *create* the risk of burglary; burglars and insecure houses create that risk. The storm merely *failed to mitigate* that pre-existing risk by disabling one protective measure (the alarm). The mechanism (weather disabling alarm) is too indirect and not the *purpose* of the storm. Storm is a condition, not a cause under this principle.
      *   **Explains Verdicts:**
          *   **Bridge Gap:** The gap *is* but-for (no gap, no collapse that day). The designer/owner *had a duty* (professional/legal) to design/build a safe bridge, including considering expansion. The breach (omission of the gap) *directly created* the specific, immediate risk (thermal stress failure) that materialized. The gap wasn't just background; it was the critical, designed-in flaw.
          *   **Canal Man Revisited:** Even if he *had* a duty (e.g., he pushed the kid in earlier), his *inaction* (walking away) doesn't meet "Direct Mechanism" *unless* he created the drowning risk. Mere failure to mitigate a pre-existing risk (kid falling in) usually fails under this clause *unless* the duty is extreme (like a parent).
          *   **Phone Line:** Cutting the line *directly created* the immediate, specific risk that the fire could not be reported/fought. It exploited the fire risk.

  **The Cost: The Storm/Burglary Case**

  This principle forces you to give up your "Yes" verdict on the Storm/Burglary case. As argued above:
  *   Storm satisfies But-For (1).
  *   Storm fails Duty & Breach (2) (No duty to prevent burglaries).
  *   Storm fails Direct Mechanism (3) (It disabled a mitigation for a pre-existing risk; it didn't create the burglary risk).

  **Applying it to All Your Cases:**

  1.  **Cat:** **Yes.** (But-For: Cat starves without food. Duty: Undertaken promise. Direct: Starvation directly results from failing the feeding duty).
  2.  **Canal Man:** **No.** (But-For: Maybe. Duty: **None** stated. Direct: N/A).
  3.  **Nurse:** **Yes.** (But-For: Patient dies without drip. Duty: Professional role. Direct: Death directly results from failing care duty).
  4.  **Storm/Burglary:** **No.** (But-For: Yes. Duty: **None**. Direct: Fails - disables mitigation, doesn't create risk).
  5.  **Phone Line:** **Yes.** (But-For: No call, no brigade, fire spreads. Duty: Duty not to actively endanger/sabotage safety. Direct: Actively created inability to get help for the fire).
  6.  **Bridge Gap:** **Yes.** (But-For: No gap, no collapse. Duty: Duty to design safely (implied role/legal). Direct: Omission *created* the specific risk of thermal failure).
  7.  **Shop Robbery (Both):** **Yes.** (But-For: If either locked, no robbery. Duty: Job role/rota. Direct: Failing lock-up duty directly enabled burglary).
  8.  **Surgeon (50/50):** **Likely No (on causation), but breach of duty exists.** (But-For: Unclear - operation had only 50% chance. Duty: Professional duty likely breached (if op indicated). Direct: Link exists, but But-For fails the probability threshold. Surgeon is *responsible* for the *risk* of death, but didn't clearly *cause* *this* death).

  **Why it Works & What it Costs:**

  *   **Gets Your Verdicts:** It correctly gives your "Yes" (Cat, Nurse, Phone Line, Bridge, Shop) and "No" (Canal Man) and forces the "No" on Storm you were uneasy about but logically needed.
  *   **Avoids Swallowing the World:** The "Duty & Breach" clause is the critical filter. The world isn't full of duties; they are specific (promises, jobs, laws, roles, undertakings). The "Direct Mechanism" clause prevents stretching causation down endless chains of conditionality (like the storm).
  *   **Handles Omissions vs. Acts:** It cleanly distinguishes the Nurse/Shop (duty-bound omission = cause) from the Canal Man (no-duty omission ≠ cause), and the Phone Line (active endangerment = cause).
  *   **Handles Joint Causation:** Shop case works via shared duty/breach satisfying But-For jointly.
  *   **Handles Design Flaws:** Bridge gap is a breach of duty via omission in design, directly creating the risk.
  *   **Handles Probabilistic Cases (Surgeon):** Provides a clear test based on probability (>50% needed for But-For causation in omission cases with duty).
  *   **Cost:** You must accept the **Storm did not *cause* the burglary**, even though it was a but-for condition. It was merely an *enabling condition* or *circumstance*.

  This principle reflects common legal and philosophical approaches (like proximate cause + duty) distilled for your intuitions. It provides actionable answers based on responsibility and directness, not just possibility or moral outrage.
