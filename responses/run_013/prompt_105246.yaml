prompt: |-
  I'm a reporter who writes long features on politics and ideas, and I'm trying to work up a piece on "performance legitimacy" -- the claim that a government earns the right to rule, or at least the loyalty of its people, by delivering prosperity, order and competent administration, with China and Singapore trotted out as the test cases. My problem is this: every time I read into it, it feels like two different claims get braided together and nobody bothers to say which is which. One is normative -- delivery justifies the rule. The other is causal -- delivery is why people actually comply. And the causal story seems to have a measurement problem I never see anyone stare at directly: if a regime controls the information citizens would need to check the delivery, how would you ever tell performance legitimacy apart from plain coercion? Then there's a transition problem too -- what happens to a legitimacy built on results when the results stall, or when the guy who delivered them dies or steps down? Every strongman eventually leaves.

  So here's what I need. My editor doesn't want a survey, she wants an agenda I can pitch. Suppose there were five or six sharp people -- political theorists and social scientists, no field access, three years -- and I could tell them what to spend the time on. Which open questions about performance legitimacy are actually worth that, and in what order? Rank them and defend the ranking: which ones are upstream of the others, which are tractable for people working on concepts and evidence rather than doing interviews in Shanghai, and which ones I should stop treating as live because the answer wouldn't change much downstream. I also want the oversold implications called out -- I keep seeing people draw enormous conclusions for how democracies ought to deal with these regimes, or for "authoritarian resilience," and I suspect half of them dont follow from anything. And tell me what evidence over the next couple of years would move a question up or down your list.

  Keep it readable, I'll be working off this on deadline. Finish with a last line that starts "Verdict:" and names the one question you'd put first, in a short phrase.
reasoning: |-
  Okay, the user is a reporter working on a feature about "performance legitimacy," particularly focusing on how governments like China and Singapore claim legitimacy through delivering prosperity and order. They're frustrated because the concept often mixes normative and causal claims without distinction. Also, there's the issue of measuring legitimacy when information is controlled, and what happens during transitions when results stall or leaders leave. 

  The reporter needs an agenda to pitch to their editor. They want five or six key questions for experts to tackle over three years, ranked by importance. The questions should be tractable with existing evidence—no field interviews—and address oversold implications. Plus, they want to know what evidence could shift the rankings in the next few years.

  First, I need to unpack the core problems: the normative vs. causal confusion, the measurement challenge under information control, and the transition dilemma. The user also mentioned "authoritarian resilience" and policy implications as potentially oversold. 

  For the ranking, the most upstream issue is separating normative and causal claims (#1). If we don't clarify this, everything else is muddy. Next is the measurement problem (#2), since coercion vs. genuine belief is foundational to the causal story. Third is the transition question (#3) because it's a major vulnerability but hard to study without real-world cases. Fourth, the role of information control (#4) is key but often assumed; we need to test how it shapes perceptions. 

  The fifth question tackles oversold implications (#5), like authoritarian resilience, which might be exaggerated. Finally, question #6 about normative foundations might be less urgent if the causal mechanics are shaky. 

  I'll defend the ranking: #1 and #2 are prerequisites—without clarifying concepts and measurement, the rest is guesswork. #3 is critical but contingent on #2. #4 is a specific angle of #2, so it's downstream. #5 addresses real-world hype, and #6 is more philosophical but less pressing. 

  For evidence shifts: If China's economy stumbles or leadership changes occur, that could boost #3's urgency. New propaganda studies or leaked surveys might help #2 and #4. A democracy crisis could make #6 relevant. 

  The verdict should spotlight #1 as the top priority since it's the root of the confusion. 

  I'll keep the response punchy and deadline-friendly, ending with "Verdict:" as requested. And I'll call out the flimsy links to policy advice—like how people overextend "performance legitimacy" to justify dealing with autocracies.
answer: |-
  Here’s a focused research agenda for unpacking "performance legitimacy," ranked for impact and tractability. These questions prioritize conceptual clarity, evidence-based answers, and avoiding dead ends – tailored for theorists and social scientists using existing data.

  **Ranked Questions & Rationale:**

  1.  **What is the *minimal measurable threshold* of "performance" required to observe compliance distinct from coercion?**  
      **Why #1:** Until we define what "successful delivery" empirically looks like (e.g., specific GDP growth rates, stability metrics, service delivery benchmarks) *and* link it to observable compliance (not just regime claims), the entire causal claim is unfalsifiable. This is the upstream foundation.  
      **Tractability:** Analyze historical/contemporary cases where performance demonstrably *collapsed* (e.g., Venezuela, Sri Lanka, USSR collapse) or varied regionally within a state. Use data on protests, tax compliance, migration, grey-market activity, and *available* survey data (e.g., World Values Survey, Asian Barometer where possible) to see if compliance shifts correlate with objective performance drops *despite* coercion.  
      **Evidence Shift:** Rigorous studies correlating granular local economic/service data with observable citizen behavior (e.g., court cases, petty crime rates, business registrations) in controlled-info states. Leaked internal regime assessments would be gold dust.  
      **Oversold Implication:** The claim that "good performance *automatically* equals genuine legitimacy" ignores coercion's role.

  2.  **How does *information control* distort the causal mechanism? Can citizens accurately attribute outcomes to the regime?**  
      **Why #2:** Directly tackles the core measurement problem. If people can't know the true state of performance or who's responsible (due to propaganda, censorship, scapegoating), attributing compliance to "legitimacy" rather than manufactured perception or fear is dubious.  
      **Tractability:** Experimentation (e.g., vignette studies), analysis of propaganda narratives vs. reality, studying diaspora communities' perceptions vs. those inside, examining shifts when information *briefly* leaks (e.g., during disasters). Compare compliance in sectors with more/less transparent performance (e.g., infrastructure vs. foreign policy).  
      **Evidence Shift:** Research on the effectiveness of regime framing (e.g., does blaming "external forces" for economic woes actually preserve compliance?). Studies mapping information exposure gradients within controlled societies.  
      **Oversold Implication:** Assumptions that citizens in authoritarian states are rationally judging performance. Often, they're judging a *narrative*.

  3.  **What are the *transition mechanisms* when performance falters or founding leaders depart? Does legitimacy transfer, mutate, or collapse?**  
      **Why #3:** The Achilles' heel of performance legitimacy. Strongmen die, economies stall. Is compliance sticky? Does legitimacy shift to institutions, ideology, nationalism? Or does coercion become glaringly primary? Critical for understanding regime fragility.  
      **Tractability:** Comparative historical analysis (post-Mao China, post-Lee Kuan Yew Singapore, post-Pinochet Chile, USSR succession crises). Track elite discourse, public rituals, and policy shifts during transitions. Look for institutionalization efforts. Analyze succession planning rhetoric vs. reality.  
      **Evidence Shift:** China's current economic challenges and the post-Xi Jinping transition (whenever it happens) will be the ultimate test case. Monitor Singapore's next major leadership change.  
      **Oversold Implication:** "Authoritarian resilience" based solely on past performance. Stalling results or botched succession can unravel it quickly.

  4.  **How does performance legitimacy interact with/co-opt *other legitimacy sources* (nationalism, tradition, ideology, proceduralism) to bolster compliance?**  
      **Why #4:** Performance is rarely the *only* game in town, even in the test cases. Understanding how regimes *combine* performance with other appeals (e.g., China's nationalism + "Socialism with Chinese Characteristics") is key to the causal story. Is performance the foundation or just a pillar?  
      **Tractability:** Analyze state discourse, education curricula, and propaganda to see how performance is framed alongside other claims (e.g., "our system delivers *because* it's Chinese/exceptional"). Survey analysis (where feasible) probing relative weight of different legitimacy claims.  
      **Evidence Shift:** Research on how regimes pivot messaging when performance dips (e.g., emphasizing external threats or cultural superiority).  
      **Oversold Implication:** Treating performance legitimacy as a pure, standalone model. It's often a hybrid strategy.

  5.  **Are the observed *outcomes* attributed to performance legitimacy (stability, compliance) actually caused by it, or by other regime features (coercive capacity, patronage networks)?**  
      **Why #5:** Challenges the *necessity and sufficiency* of performance. Do high-performing democracies show similar compliance? Do poorly-performing autocracies with strong coercion (e.g., North Korea) still see compliance? This questions performance's unique causal role.  
      **Tractability:** Large-N comparative studies correlating performance indicators, indices of coercion/patronage, and stability/compliance metrics. Process-tracing within cases to see if compliance changes *precede* or *follow* performance changes, controlling for repression.  
      **Evidence Shift:** Identifying cases where performance improves but compliance *doesn't* (or vice-versa), controlling for other factors.  
      **Oversold Implication:** The "deal with autocracies" argument – assuming their stability stems from legitimacy rather than repression or fear, justifying engagement over pressure.

  6.  **What are the *normative boundaries*? Can horrific regimes gain genuine legitimacy through "good" performance for a subset? (Downstream if causal mechanics are weak)**.  
      **Why #6 (Lower Priority):** If the causal chain (#1-2) is weak or the measurement problem insurmountable, the normative question becomes largely hypothetical or reliant on contested definitions of "legitimacy." Important philosophically, but less urgent for explaining real-world compliance.  
      **Tractability:** Theoretical work, historical case studies of regimes with mixed records (e.g., colonial administrations, apartheid South Africa's economic performance for whites).  
      **Evidence Shift:** Less about new evidence, more about consensus emerging from answers to #1-5.  
      **Oversold Implication:** Using the *concept* of performance legitimacy to normatively excuse or endorse authoritarian systems. A conceptual danger, not a direct causal finding.

  **Stop Treating as Live (or Severely Downgrade):**
  *   **"Performance legitimacy exists in China/Singapore as a primary driver of compliance, full stop."** The measurement problem makes this unsupported without much stronger evidence disentangling perception, information control, and coercion. Treat it as a hypothesis, not a finding.
  *   **"Performance legitimacy guarantees long-term stability."** The transition problem (#3) makes this highly suspect. Past performance ≠ future results or successful leadership transfer.
  *   **"Democracies must emulate performance efficiency to compete."** This confuses normative goals (good governance) with regime type legitimacy. Democracies derive legitimacy differently (procedurally). Efficiency is desirable, but not their sole legitimacy base.

  **Verdict:** Define and measure the performance-compliance threshold under information control.
