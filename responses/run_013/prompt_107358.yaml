  ### Essay Question  
  **Decision Problems Analysis**  

  Consider the following four decision problems. In each, choose one lottery from the given pair.  

  **First Pair:**  
  - **Problem 1:**  
    - **A:** $400 for certain.  
    - **B:** 90% chance of $400, 9% chance of $2,000, 1% chance of $0.  
  - **Problem 2:**  
    - **C:** 10% chance of $400, 90% chance of $0.  
    - **D:** 9% chance of $2,000, 91% chance of $0.  

  **Second Pair:**  
  - **Problem 3:**  
    - **E:** $1,000 for certain.  
    - **F:** 80% chance of $2,500, 20% chance of $0.  
  - **Problem 4:**  
    - **G:** 50% chance of $1,000, 50% chance of $0.  
    - **H:** 40% chance of $2,500, 60% chance of $0.  

  Empirical evidence suggests many people choose:  
  - **A** over **B** (Problem 1) and **D** over **C** (Problem 2).  
  - **E** over **F** (Problem 3) and **H** over **G** (Problem 4).  

  **Your Tasks:**  
  1. For each pair (Problems 1–2 and Problems 3–4), show that the combination of choices violates a core principle of rational choice requiring consistency when adding a common outcome. Demonstrate this by decomposing the lotteries into mixtures (e.g., "probability *p* of lottery *X* plus probability *1−p* of lottery *Y*") rather than merely describing preferences.  
  2. It is often claimed that the pattern in the first pair arises because a "sure gain" is treated as special. Explain why this claim cannot explain the pattern in the second pair.  
  3. Discuss whether these violations imply that people are irrational. Engage with the argument that the "common part" of the mixtures should be irrelevant to the choice, and letting it sway decisions is an error.  
  4. Propose a principled modification to the core principle in (1) that accommodates all four intuitive choices while preserving its essential idea. Assess the costs of this modification. If impossible, justify why.  

  ---  
  ### Model Answer (Approx. 700 words)  

  #### 1. Violation of the Core Principle via Mixture Decomposition  
  The core principle (often called "independence") requires that if lottery *X* is preferred to lottery *Y*, then for any lottery *Z* and probability *p*, the mixture *pX + (1−p)Z* is preferred to *pY + (1−p)Z*. The intuitive choices violate this.  

  **First Pair (Problems 1–2):**  
  Decompose using a common outcome *Z* = **$0 with certainty** and *p* = 0.10.  
  - **A** = *p* × **$400** + (1−*p*) × **$400**  
    (i.e., 10% chance of $400 plus 90% chance of $400).  
  - **B** = *p* × **$400** + (1−*p*) × **90% $400, 9% $2,000, 1% $0**  
    But rewrite **B** as:  
    **B** = 0.10 × **[90% $400, 9% $2,000, 1% $0]** + 0.90 × **$400**.  
    Equivalently, with *Z* = **$0**:  
    **B** = 0.90 × **$400** + 0.10 × **[90% $2,000, 10% $0]**.  
  - **C** = 0.90 × **$0** + 0.10 × **$400**.  
  - **D** = 0.90 × **$0** + 0.10 × **[90% $2,000, 10% $0]**.  

  The preference **A** > **B** implies that in the 10% "variable" portion (where outcomes differ), **$400** is preferred to **[90% $2,000, 10% $0]**. But **D** > **C** implies the opposite: in the same 10% variable portion, **[90% $2,000, 10% $0]** is preferred to **$400**. This reversal violates the principle.  

  **Second Pair (Problems 3–4):**  
  Decompose using a common outcome *Z* = **$0 with certainty** and *p* = 0.50.  
  - **E** = 0.50 × **$1,000** + 0.50 × **$1,000**.  
    Rewrite **E** using *Z*:  
    **E** = 0.50 × **$1,000** + 0.50 × **$1,000** (no *Z* directly, but see below).  
    For mixture consistency:  
    **E** ≡ 0.50 × **[100% $1,000]** + 0.50 × **[100% $1,000]**.  
  - **F** = 0.50 × **[160% $2,500?]** → Use scaling:  
    **F** ≡ 0.50 × **[80% $2,500, 20% $0]** + 0.50 × **[80% $2,500, 20% $0]**.  
    Better: **F** is 80% $2,500 + 20% $0. Embed in mixture:  
    **F** = 0.50 × **[160% $2,500?]** → Not stochastic.  
    Instead, define:  
    **F** ≡ 0.50 × **[100% $2,500]** + 0.50 × **[60% $2,500, 40% $0]**.  
    But probabilities must sum to 1.  

  Alternative decomposition:  
  - **G** = 0.50 × **$1,000** + 0.50 × **$0**.  
  - **H** = 0.50 × **[80% $2,500, 20% $0]** + 0.50 × **$0**.  
    (Since 0.50 × 80% = 40% $2,500, 0.50 × 20% = 10% $0, plus 50% $0 → 60% $0).  
  For **E** and **F**, use *p* = 0.50 and *Z* = **$0**:  
  - **E** = 0.50 × **$1,000** + 0.50 × **$1,000** (but **$1,000** ≡ 100% $1,000).  
    **E** is not directly a mixture with *Z*, but note:  
    **G** = 0.50 × **$1,000** + 0.50 × **$0** (scaled-down **E**).  
    **H** = 0.50 × **F** + 0.50 × **$0** (since **F** = 80% $2,500 + 20% $0).  
    **E** > **F** implies **$1,000** > **F**, so by independence, 0.50 × **$1,000** + 0.50 × **$0** should be preferred to 0.50 × **F** + 0.50 × **$0**, i.e., **G** > **H**. But **H** > **G** is observed, a violation.  

  #### 2. Certainty Effect Fails for the Second Pair  
  The "sure gain" explanation argues that certainty (e.g., **A** and **E**) is overweighted, causing risk aversion. This explains **A** > **B** and **E** > **F**. However, in Problem 4, **both G and H are risky** (neither offers certainty). The choice **H** > **G** occurs without a sure gain, so certainty cannot be the driver. A deeper explanation is needed, such as probability weighting (e.g., underweighting moderate probabilities like 40–50% compared to certainty).  

  #### 3. Irrationality and the "Irrelevant Common Part" Defense  
  Violating independence does not automatically imply irrationality. Descriptively, it reflects systematic human psychology: people weigh outcomes conditionally on contextual risks (e.g., the "common part" feels like a safety net or loss frame). Normatively, defenders of independence argue the common part (*Z*) is irrelevant; only differences should matter. Ignoring *Z* prevents inconsistencies and money pumps (e.g., dynamic choice traps).  

  However, one might argue that *context matters for rationality*: if the common part (e.g., 90% $400 in **A**/**B**) alters risk perception, it is not irrelevant. For example, **B**’s 1% risk of $0 feels catastrophic against **A**’s safety, while in **C**/**D**, the baseline is $0, so risk-taking for $2,000 seems rational. Abandoning independence avoids overly rigid prescriptions but risks permitting intransitivities.  

  #### 4. Principled Repair: Probability Weighting  
  A repair is to embed probability weighting (e.g., rank-dependent utility). Replace objective probabilities with *decision weights* that overweight extremes. For instance:  
  - Underweight moderate probabilities (e.g., 40% feels like 30%) but overweight certainty (100% feels like 100%) and near-zeros (1% feels like 5%).  
  - **First Pair**: **A** > **B** because 100% $400 is overweighted; **D** > **C** because 9% $2,000 is overweighted vs. 10% $400.  
  - **Second Pair**: **E** > **F** due to certainty overweighting; **H** > **G** because 40% $2,500 might feel more salient than 50% $1,000.  

  **Costs**:  
  - **Complexity**: Adds parameters (weighting function), reducing predictive elegance.  
  - **Normative cost**: Weakens the "irrelevant common part" defense, as weights depend on full-context probabilities.  
  - **New anomalies**: May violate stochastic dominance if weights are non-linear.  

  No modification retains full independence, but probability weighting accommodates all four choices while preserving a *weakened independence* (applying only after weighting).  

