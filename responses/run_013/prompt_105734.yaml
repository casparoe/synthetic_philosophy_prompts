answer: |-
  It sounds like your seminar has hit upon one of those deceptively compact philosophical phrases that functions like a Rorschach test—everyone projects their own commitments onto it. Your instinct about ambiguity is exactly right; "all truths are knowable" is a chameleon of a claim, shifting its meaning and implications dramatically depending on what philosophical baggage it’s carrying. Let me try to unpack the spectrum of readings, starting from the thinnest and working toward the most substantive, then address your specific questions about your classmates’ move and your friend’s collapse argument.

  At the most anemic end, the slogan might mean nothing more than: **any true proposition is expressible in some possible language**. This is a claim about the *formulability* of truth, not its epistemic accessibility. If a fact obtains, we can (in principle) craft a sentence that describes it, even if no one ever does or could verify it. On this reading, the slogan is nearly trivial—it’s hard to imagine what a "truth" would be if it couldn’t even be articulated. Refuting it would require demonstrating a fact so alien to conceptual thought that no linguistic structure could capture it (e.g., a pre-linguistic reality or ineffable qualia). But this reading does *no work* for your classmates. It doesn’t render "unknowable truth" incoherent; it merely insists such truths could be named, like labeling a locked box whose contents we can’t access. The skeptic’s objection remains intact: we might formulate truths we cannot justify or confirm.

  A modest step up: **any true proposition could, under some possible circumstances, be known by some possible being**. This introduces epistemic *possibility* without demanding actual or feasible human knowledge. It allows for truths knowable only by beings with different cognitive capacities or in alternative physical conditions (e.g., a fact about the center of a black hole might be knowable to a being inside it). This is defensible but contentious; refutation would require showing some truths are *necessarily* unknowable by any conceivable intellect (e.g., precise microhistorical facts erased from all causal traces). Still, this doesn’t license your classmates’ move. The gap between "could be known under *some* conditions" and "*can* be known *by us*" is vast. The skeptic can coherently argue that some truths—while formulable and *abstractly* knowable—are pragmatically or nomologically inaccessible to *actual* inquirers.

  Now we reach the readings your classmates likely intend—the **verificationist-semantic** family. Here, the slogan isn’t about possibility but about *meaning*: a proposition is truth-apt (i.e., capable of being true or false) *only if* there is some possible method of verification or falsification. Truth is constitutively tied to knowability; to assert "P is true but unknowable" is not just false but *meaningless*, because it invokes "truth" for a proposition detached from all criteria of assessment. This is a substantive (and historically loaded) thesis, associated with logical positivism or Dummettian anti-realism. It’s defensible only within specific frameworks (e.g., intuitionistic logic) and is refuted by counterexamples that feel intuitively truth-apt despite apparent unknowability: "There was an even number of daisies in Babylon on the day Hammurabi died" or "A singularity exists in a causally disconnected universe." If such propositions strike you as meaningful (even if unverifiable), this reading fails. *This* is the reading that licenses your classmates’ move: if truth *requires* knowability, then "unknowable truth" is not a falsehood but a category error.

  More ambitiously, the slogan might assert a **metaphysical idealism**: reality is constituted by actual or potential knowers, such that there are no "facts in themselves" independent of all possible cognition. This collapses the gap between truth and knowability ontologically. It’s radically contentious (refuted by appeals to mind-independent physical facts or mathematical platonia) and far stronger than needed for your classmates’ argument. The semantic reading already does their work without this heavy metaphysical machinery.

  Finally, there’s the **actualist** reading your friend mentioned: "all truths are knowable" *entails* that every truth is *actually known* (by someone, at some time). This is the notorious Fitch paradox. If we interpret "knowable" as "there exists a time at which it is known" (and assume knowledge distributes over conjunction and is factive), a formal derivation shows that if all truths are knowable, then all truths are known. This collapse happens specifically under a *modal-temporal* reading of knowability (e.g., "for every truth, there’s a possible world *and a time* where it’s known"). It’s a problem for readings that tie knowability to *actual or possible knowers in time*—primarily the "modest" (epistemic possibility) and verificationist readings. The collapse *doesn’t* affect the thin "expressibility" reading, nor does it automatically ruin idealism. But for verificationism, it’s devastating: if the slogan implies that we *already* know all truths, it becomes absurd. Responses exist (e.g., rejecting the logical principles used in Fitch’s proof, or restricting the scope to "basic" propositions), but they complicate the view.

  So, which reading are your classmates invoking? Almost certainly the **verificationist-semantic** one. Only this reading transforms "unknowable truth" from a potential fact into a conceptual confusion. Does it survive? Barely, and with scars. The Fitch paradox is a serious challenge, and intuitive counterexamples (like the Babylonian daisies) erode its plausibility. It survives mainly as a local thesis for specific domains (e.g., mathematics for intuitionists, ethics for constructivists), not as a global theory of truth. Your classmates’ confidence likely stems from conflating the slogan’s readings: they hear the trivial "expressibility" intuition but deploy the verificationist hammer. Pointing out this ambiguity—and asking which refutations they’re immune to—might loosen the slogan’s grip. The move from "false" to "incoherent" only works if truth is *defined* by knowability, a claim far more radical than they seem to realize. Without that definition, the skeptic’s worry remains philosophically legible, even if ultimately mistaken. Your instinct to dissect the slogan’s ambiguities is the right one; it’s not a silver bullet, but a spectrum of distinct claims, most of which can’t do the work your classmates demand.
