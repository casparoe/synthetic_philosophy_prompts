prompt: |-
  Right, so I need help writing something up for my phil-of-physics reading group. We've got two people who've been bickering for about a year about the string landscape / eternal inflation / multiverse thing, and I want to force them to produce a joint statement instead of another round of seminar shouting. Call them the Landscape Optimist and the Detector-Or-It-Didn't-Happen guy.

  The Optimist's line: a framework can earn rational acceptance without a decisive experiment. Roughly — (i) if there's no serious rival on the table, (ii) if the framework unexpectedly ties together things it wasn't built to tie together, and (iii) if theories of that general kind have historically panned out, then that adds up to real evidential weight, not just sociology. The Detector guy's line: (i) is an argument from our ignorance, (ii) is aesthetic taste dressed up in Bayesian clothing, (iii) is an induction over a sample of about one, and anyway a framework that can accommodate any low-energy observation has stopped predicting anything worth the name.

  What I want from you is the document they could both actually sign. So:

  1. A numbered list of agreed claims. It should cover what the formalism actually commits you to, as opposed to what gets said on podcasts; what they both agree would count as a prediction in the relevant sense; what's agreed about the anthropic bound on the cosmological constant that was written down before anybody had measured dark energy and that came out roughly where the later measurements landed — the Optimist calls that a prediction, the Detector guy calls it a constraint that happens to be satisfied and says a constraint earns no credit for being satisfied, so find an agreed formulation that doesn't smuggle in either reading. Also whatever they agree about how the appearance of a genuine rival would change things, and about whether "the multiverse" is even one hypothesis or a family of them.

  2. Then the residual disagreements, and I want them to seperate the genuine ones from the verbal ones. For each: the question, each side's own formulation in wording that side would accept as its own, and the crux — the sub-question where settling it would actually move somebody. Candidates I can see: whether the no-alternatives argument is a claim about likelihoods or a claim about the sociology of physics departments; whether any probability can be extracted at all without a measure, and if not, whether the measure can be pinned down by internal consistency conditions — the Boltzmann-brain-domination worry, and the self-undermining version where if most observers are brains in a box then our evidence about the physics that says so is shot — or whether those conditions are just more priors in a lab coat; whether the CMB tensor-to-scalar measurement bears on the landscape itself or only on which inflaton potential is right; and what happens to the no-alternatives argument when a chunk of the Optimist's own field argues, from inside string theory, that the de Sitter vacua you need for eternal inflation aren't in the theory at all — the swampland stuff. If your own method tells you to take that seriously, does the landscape survive it?

  3. For each crux, the case, argument, or future measurement the two of them would agree bears on it, plus each side's prediction written down in advance, including what each would say if it goes the other way.

  And tell me whether any of this is just a fight about the word "confirmation" — if part of the disagreement is verbal, say which part and what the non-verbal remainder is. Don't bother with a bibliography or reading list; I don't need citations and you can't look anything up anyway, so just do the work from what you know. Format it as numbered agreed claims, then a table for the disagreements. They both have to be able to put their name on it, so if a formulation is vacuous or slanted toward one side, it's a fail.
