prompt: |-
  I am a high school student preparing a presentation for my school's philosophy club, and I have reached the point where the standard summaries have stopped helping me. I can recite that epistemic contextualism and pragmatic encroachment both connect knowledge to practical matters, but I cannot state cleanly what separates them, and I suspect I have been quietly running the two together.

  As I understand it, the contextualist holds that the word 'knows' is context-sensitive: whether a given sentence of the form 'S knows that p' is true depends on the epistemic standards governing the conversation in which the sentence is uttered, so that one and the same person, with one and the same evidence, may be correctly described as knowing in an ordinary conversation and as not knowing in a more demanding one. The pragmatic encroachment theorist, by contrast, seems to hold that the word itself does not shift in this way, but that the property of knowing, the thing the word picks out, itself depends on the practical stakes of the person who is said to know, so that someone whose evidence has not changed at all may fail to know simply because more now rides on being right.

  I would like you to explain, in your own words and with as much precision as you can manage, whether that contrast is the right way to draw the line between the two views, and where it needs to be corrected. To make the difference concrete, please work through two cases. In the first, the person who might know faces very high practical stakes, but the person making the knowledge attribution is in a relaxed, everyday conversational setting. In the second, the person who might know faces trivial stakes, but the attribution is made by someone in an unusually demanding, skeptical conversation. For each case, tell me what the contextualist should say and what the pragmatic encroachment theorist should say, and explain why they diverge, if they do. I am especially interested in whether there is a case in which the two views issue genuinely different verdicts about the same utterance, since that would be the sharpest way for me to see that they are not the same thesis wearing two names.

  I would also like you to address the objection that pragmatic encroachment makes knowledge depend on facts that are not really epistemic at all, facts about what someone stands to lose rather than about evidence or truth, and to explain how a defender of the view would answer that objection.

  Please write this as continuous prose, without headings, bullet points, bold text, or tables. I would like it to read like a long, careful letter rather than a set of notes.
