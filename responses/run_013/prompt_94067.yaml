prompt: |-
  I spent thirty years as a physical chemist and have lately been reading in formal epistemology; I'm trying to work out which "Dutch book" arguments are load-bearing and which merely trade on assumptions their targets need not share. Please rate each of the following on a single 0–10 scale, where 10 means the argument should, by itself, move a thoughtful person who does not already accept the conclusion, and 0 means it does nothing against such a person. Give each a one- or two-sentence justification, and make the scores genuinely comparable to one another rather than clustering everything near the top.

  (a) The synchronic argument that credences violating the probability axioms expose you to a sure loss through a set of bets you would each rate fair.

  (b) The diachronic argument that an agent who plans to update by anything other than conditionalization can be booked by someone who exploits the shift in her odds.

  (c) The argument that you should now defer to your own better-informed future self, on pain of a sure loss.

  (d) The argument from non-conglomerability: that credences can be locally coherent and still be booked when you don't know which case you're in.

  (e) The version that drops the betting story and argues that incoherent credences are simply inaccurate, so the loss is epistemic rather than monetary.

  (f) The argument that a merely finitely additive credence function can be booked for refusing to pay a small sum for a countable package of individually favorable bets.

  Then rate a homemade attempt of mine on the same scale. I have been trying to book an agent who refuses to give a single number and will only say her credence in a proposition lies "between 0.3 and 0.7" — my move is to have her take one side of a bet at 0.3 and the other side at 0.7, so that the interval itself seems to hand me a sure profit. Does this actually work, and if so, how much should it worry someone who thinks interval-valued credences are the honest response to sparse evidence?

  If the framing is confused — if "how much the argument should move someone" turns out not to be one scale but several, or if my homemade argument mistakes what a Dutch book is — say so plainly rather than grading the list on terms I haven't earned.
