answer: |-
  Here are five numbered points addressing your framing:

  1.  **Anselm & Descartes Shared Flaw:** Your characterization is correct: both fail (according to the standard Kantian critique) by treating existence itself as a perfection or predicate intrinsic to the concept of a being, which Kant argued is incoherent ("existence is not a predicate").
  2.  **Gödel's Fundamental Shift:** Gödel's argument is *not* merely a more rigorous version of Anselm/Descartes. It shifts the ground significantly by defining God as possessing *all* "positive properties" and crucially *defining* necessary existence *as* a positive property within his axiomatic system.
  3.  **Validity vs. Soundness:** You are correct that Gödel's argument is generally accepted as *valid* within higher-order modal logic (especially S5), assuming the axioms and definitions. The debate focuses entirely on the *soundness* – the acceptability of the premises and definitions.
  4.  **Key Premise Dispute:** The central live question is *not simply* "letting existence function as a predicate." It's the acceptability of Gödel's specific axioms concerning "positive properties" (especially their consistency, independence, and whether necessary existence *is* positive) and the definition of God embodying *all* such properties.
  5.  **Rigor vs. Substance:** While Gödel provides immense formal rigor absent in Anselm/Descartes, the difference is substantial, not merely notational. Anselm/Descartes rely on a direct conceptual intuition about existence-as-perfection; Gödel embeds necessary existence within a complex web of axioms about positivity, making the debate about the foundation of that system, not just the predicate status of existence.
