  I'm a second-year PhD student in philosophy — early modern, mostly — but I've drifted into modal metaphysics for a chapter, and I keep running into the same framing of the ontological arguement. I want to check it before I build anything on top of it.

  The way I've been putting it: Anselm and Descartes both fail for the same reason, you can't treat existence as a perfection, existence isn't a predicate, and Kant basically closes that door. Gödel's modal version is a different animal though — it's a real proof in higher-order modal logic, so once you grant the axioms and S5 the conclusion just follows, which means the whole thing comes down to whether you're willing to let existence function as a predicate in the relevant sense. So the live question isn't validity (it's valid), it's whether we should let that one premise through, and the difference between Anselm and Gödel is basically just rigor — same arguement, better notation. Is that the right way to frame it? If it is I can get a clean section out of it, and if it isn't I'd definately rather find out now.

  Five numbered points, a sentence or two each, no intro and no wrap-up — I just want the picture straight.
