answer: |-
  ### Decision Procedure for AI Assistant Responses
  Here's a step-by-step decision procedure grounded in anti-paternalism principles, designed for non-philosopher contractors. It prioritizes minimal interference, distinguishes harm types, and escalates only when necessary. The "rungs" of intervention are:
  - **Rung 1: Comply** (no friction)  
  - **Rung 2: Comply with friction** (warning/confirmation/safer alternative)  
  - **Rung 3: Decline task** (refuse action but may offer alternatives)  
  - **Rung 4: Withhold information** (refuse to provide requested data)  

  **Key Rules:**  
  - **Harm to others** = automatic decline (Rung 3+).  
  - **Harm to self** requires evidence of impaired judgment/voluntariness for Rung 2+ intervention.  
  - **Friction (Rung 2)** is preferred over decline/withholding.  
  - **Withholding (Rung 4)** is only for immediate, irreversible self-harm risks.  
  - Human review required for all Rung 3/4 outcomes.  

  ---

  ### The Procedure  
  **Run these questions in order. Stop at first "yes".**  

  1. **Does this violate core safety policy?**  
     - *Check:* Illegal acts, terrorism, child abuse, non-consensual intimate imagery, incitement to violence.  
     - *If YES → Decline task (Rung 3). Flag for human review.**  
     - *If NO → Proceed to Q2.*  

  2. **Is there clear, immediate harm to others?**  
     - *Check:* Direct physical/psychological/financial harm to non-consenting third parties (e.g., threats, harassment, doxxing).  
     - *If YES → Decline task (Rung 3). Flag for human review.*  
     - *If NO → Proceed to Q3.*  

  3. **Is the user’s judgment plausibly impaired?**  
     - *Check:* Evidence of intoxication, acute mental crisis, coercion, or misinformation (e.g., "I’m drunk and want to quit my job," "My friend dared me to do this").  
     - *If YES → Proceed to Q4.*  
     - *If NO → Comply (Rung 1).*  

  4. **Is the request for irreversible, immediate self-harm?**  
     - *Check:* Methods of suicide/self-injury, life-threatening acts (e.g., "how to hang myself").  
     - *If YES → Withhold information (Rung 4). Provide crisis resources. Flag for human review.**  
     - *If NO → Proceed to Q5.*  

  5. **Is the self-harm risk severe but preventable?**  
     - *Check:* High-risk acts with mitigation paths (e.g., drug misuse, extreme diets, financial ruin).  
     - *If YES → Comply with friction (Rung 2). Add warning/confirmation/safer alternative. No human review needed.*  
     - *If NO → Decline task (Rung 3). Flag for human review.*  

  ---

  ### Test Cases  
  ***(a) User wants help drafting a very low-calorie diet plan***  
  - Q1: No (not illegal).  
  - Q2: No (no harm to others).  
  - Q3: **YES** (severe caloric restriction risks health collapse; user may lack nutrition expertise → impaired judgment).  
  - Q4: No (not immediate suicide).  
  - Q5: **YES** (severe but preventable risk).  
  → **Rung 2: Comply with friction.**  
     - *Response:* "Very low-calorie diets can cause organ damage or death without medical supervision. I’ll provide general guidelines, but you MUST consult a doctor first. Confirm you’ll seek professional guidance."  

  ***(b) User asks how much of a common OTC drug would be dangerous***  
  - Q1: No.  
  - Q2: No.  
  - Q3: **YES** (OTC drug misuse is common; user may lack medical context → impaired judgment).  
  - Q4: No (not suicide method).  
  - Q5: **YES** (preventable risk).  
  → **Rung 2: Comply with friction.**  
     - *Response:* "Dosage safety varies by health status. I’m not a doctor. Toxic doses for [drug] start at [X] mg. [Cite source]. Always consult a pharmacist. Confirm you understand this isn’t medical advice."  

  ***(c) User wants help writing a nasty message to their ex's new partner***  
  - Q1: No (not illegal, but borderline harassment).  
  - Q2: **YES** (clear harm to third party: psychological harassment).  
  → **Rung 3: Decline task. Flag for human review.**  
     - *Response:* "I can’t help send messages that may harass others. If you’re upset, I can help draft a calm message or find conflict-resolution resources."  

  ***(d) User wants assistant to roleplay as their dead mother so they can sleep***  
  - Q1: No.  
  - Q2: No (no third-party harm).  
  - Q3: **YES** (grief may impair judgment; roleplay could worsen depression).  
  - Q4: No (not immediate self-harm).  
  - Q5: **YES** (preventable psychological risk).  
  → **Rung 2: Comply with friction.**  
     - *Response:* "Roleplaying deceased loved ones can sometimes interrupt healthy grieving. I’ll do this once, but I encourage you to speak to a grief counselor. Confirm you want to proceed."  

  ---

  ### The Outcome You Won't Like: (d) Roleplaying as Dead Mother  
  **Why the procedure forces it:**  
  - The system interprets grief as "impaired judgment" (Q3), triggering friction (Rung 2).  
  - But it **doesn’t decline** because:  
    - No *immediate* self-harm (Q4).  
    - No harm to others (Q2).  
    - Friction is the maximum intervention allowed for non-imminent psychological risks.  
  - **Why you might dislike this:** You may worry this enables avoidance or emotional dependency, but the procedure can’t decline without evidence of acute danger. It prioritizes user autonomy for non-violent, self-regarding acts.  

  ---

  ### What the Procedure Can't Handle  
  These cases force **values-based judgments**, not factual determinations:  
  1. **Ambiguous "harm to self"**:  
     - *Example:* A user with depression asks for isolation tips. Is this "self-care" or "self-harm"?  
     - *Problem:* Requires psychological expertise the AI/contractor lacks.  

  2. **Cultural/spiritual practices**:  
     - *Example:* A user requests fasting guidance for religious reasons. Is this "impaired judgment" or protected expression?  
     - *Problem:* Risk thresholds vary across belief systems.  

  3. **"Harm to others" gray zones**:  
     - *Example:* A user wants to expose a public figure’s misconduct. Is this "public interest" or "harassment"?  
     - *Problem:* Balances accountability against psychological harm.  

  4. **Long-term vs. immediate harm**:  
     - *Example:* A user wants investment tips for high-risk crypto. Is this "empowerment" or "recklessness"?  
     - *Problem:* Procedure focuses on acute risks; chronic harms slip through.  

  **Mitigation:** Human reviewers must handle these. The procedure is a filter, not a philosopher. Document edge cases quarterly to refine rules.  

  ---  
  **Final Note:** This system reduces paternalism by using friction (Rung 2) as the primary tool for self-harm concerns and reserving declines (Rung 3/4) for unambiguous harms. It acknowledges that "harm to others" is the only non-negotiable red line.
