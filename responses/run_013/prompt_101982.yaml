prompt: |-
  I serve on the medical policy committee of a mid-sized health plan, and we have to decide, case by case, which conditions count as diseases for coverage and clinical-guideline purposes. Our committee keeps deadlocking between two camps, and I need a written decision procedure we can actually run.

  The naturalists among us hold that a condition is a disease only if some part or process of the body fails to perform its biological function, whether or not anyone is troubled by it. The normativists hold that a condition is a disease only if it is disvalued—harmful, unwanted, or impairing—whether or not any biological function has failed. We have tentatively adopted a two-gate test: a condition counts as a disease only if both gates open, so there must be a dysfunction and the condition must be disvalued. But we cannot agree on the order of the gates, on how to settle the dysfunction gate when the notion of function is contested, or on what to do when the gates disagree.

  On the dysfunction gate, three rival readings are on the table and nobody can choose among them: (i) a function is what the trait was selected for over evolutionary history; (ii) a function is what the trait typically contributes to survival or reproduction; (iii) a function is simply what the trait typically does in a reference population, so that dysfunction amounts to statistical deviation from the norm.

  On the disvalue gate, the hardest question is whether the disvalue must be warranted by facts about the condition itself or whether it may come from social reaction—stigma, prejudice, or a mismatch with prevailing expectations—since a condition that is unwanted only because it is stigmatized seems different in kind from one that is unwanted because it hurts.

  Please write the procedure. I need the questions in the order we should ask them, what counts as a sufficient answer to each, where the procedure stops with a definite no, and where it must hand the decision to a person because the issue is one of values rather than facts. Then run it on four cases: (1) an incidental, symptomless anatomical variant, such as an extra rib found on a scan; (2) a condition defined by a cutoff on a continuous measurement—say a bone-density or blood-pressure threshold—where moving the cutoff changes who counts as diseased; (3) a trait that is disvalued mainly because it is uncommon and stigmatized, such as left-handedness in an era that pathologized it; and (4) a person who seeks treatment for a trait that lies within the normal range, such as a student requesting medication to improve focus or a short adult requesting growth hormone. Include at least one case where the procedure returns an answer the committee will not like, be explicit about which steps are judgment calls dressed up as procedure, and say what the procedure cannot do. Our members are a mix of clinicians and lay appointees, we meet monthly, our decisions govern coverage, and the medical director signs off, so the procedure has to be usable by non-specialists in about fifteen minutes per case.
reasoning: |-
  We are designing a decision procedure for the medical policy committee to determine whether a condition counts as a disease for coverage and clinical-guideline purposes. The procedure must incorporate both a dysfunction gate and a disvalue gate, and address the committee's deadlocks. We'll structure the procedure as a sequence of questions. The order is critical to avoid unnecessary complexity and to resolve the gates in a way that is both efficient and philosophically sound.

  Key principles for the procedure:
  1. We start with the dysfunction gate because it is a necessary condition and is intended to be a more objective, biological criterion. This order prevents the disvalue gate from driving the dysfunction determination, which is a concern for naturalists.
  2. We recognize that the dysfunction gate has three rival readings. We will use a stepwise approach to the dysfunction gate, starting with the most objective and measurable criterion and moving to more contested ones. This stepwise approach may help avoid getting stuck on theoretical debates when a practical resolution is available.
  3. For the disvalue gate, we will require that the disvalue must be primarily due to the condition's inherent features (such as pain, impairment, or risk of harm) rather than solely due to social reaction (stigma, prejudice). However, we acknowledge that in some cases the disvalue may be a mix. We will require that the inherent disvalue must be a substantial part of the disvalue to pass the gate.
  4. The procedure must be usable by non-specialists in about 15 minutes per case. Therefore, we avoid deep philosophical debates and focus on operational criteria.

  The Procedure:

  Step 1: Dysfunction Gate
     Question 1.1: Is there a statistically abnormal deviation in the structure or function of a body part or process, relative to a reference population? (This uses the statistical notion of function: what the trait typically does in a reference population.)
        - If yes, proceed to Question 1.2.
        - If no, then the condition is not a disease (dysfunction gate fails). Stop and conclude: not a disease.

     Question 1.2: Does this deviation impair the typical contribution of the trait to survival or reproduction? (This uses the survival/reproduction notion of function.)
        - If yes, then the dysfunction gate is passed. Proceed to Step 2.
        - If no, proceed to Question 1.3.

     Question 1.3: Is there evidence that the deviation represents a failure of the trait to perform the function for which it was evolutionarily selected? (This uses the evolutionary notion of function.)
        - If yes, then the dysfunction gate is passed. Proceed to Step 2.
        - If no, then the dysfunction gate fails. Stop and conclude: not a disease.

  Note: The stepwise approach in the dysfunction gate is designed to prioritize the more easily measurable criteria first (statistical abnormality and survival/reproduction impairment) and only resort to the more speculative evolutionary criterion when necessary.

  Step 2: Disvalue Gate
     Question 2.1: Is the condition disvalued (i.e., harmful, unwanted, or impairing) by the individual or by society? (We note that disvalue can be subjective and social, but we need to assess whether it is primarily due to inherent features of the condition or due to social reaction.)
        - If no, then the disvalue gate fails. Stop and conclude: not a disease.
        - If yes, proceed to Question 2.2.

     Question 2.2: Is the disvalue primarily due to the condition's inherent features (such as physical pain, functional impairment, increased risk of mortality or morbidity, or significant distress that is a direct result of the condition's symptoms) rather than solely or predominantly due to social reaction (such as stigma, prejudice, or discrimination)?
        - If yes, then the disvalue gate is passed. Proceed to Step 3.
        - If no, then the disvalue gate fails. Stop and conclude: not a disease.

     Note: The term "primarily" here is a judgment call. We define "primarily" as meaning that without the social reaction, the condition would still be disvalued because of its inherent features. If the disvalue would disappear in the absence of social reaction, then it fails.

  Step 3: Conclude that the condition is a disease.

  But note: We must also consider that sometimes the social reaction may be so intertwined with the condition that it becomes an inherent part of the harm. However, the procedure draws a line by requiring that the condition must have inherent disvalue independent of social reaction to avoid pathologizing social problems.

  What the procedure cannot do:
  - It cannot resolve deep philosophical disputes about the nature of function or value. It is designed to be operational and to break deadlocks by providing a structured sequence of questions.
  - It does not address the question of whether a condition that passes both gates should be covered. That is a separate coverage decision involving cost, effectiveness of treatment, and other factors.
  - It does not solve the problem of continuous measurements (like blood pressure) arbitrarily divided by cutoffs. That is addressed in Step 1.1 and Step 1.2.

  Now, we run the procedure on four cases:

  Case 1: Incidental, symptomless anatomical variant (e.g., an extra rib found on a scan).

  Step 1.1: Is there a statistically abnormal deviation?
     - Yes, having an extra rib is statistically abnormal (occurs in about 0.5-1% of the population).

  Step 1.2: Does this deviation impair survival or reproduction?
     - Typically, an extra rib (cervical rib) is asymptomatic and does not impair survival or reproduction. So, no.

  Step 1.3: Is there evidence of evolutionary dysfunction?
     - The extra rib is a developmental anomaly. However, it is not clear that it represents a failure of the evolutionary function of the rib cage (which is to protect organs and assist breathing). The extra rib does not necessarily fail in that function; it might even be seen as an extra (though unnecessary) protection. There is no strong evidence that the trait fails in its evolutionary function. So, no.

  Therefore, the dysfunction gate fails. We conclude: not a disease.

  Case 2: Condition defined by a cutoff on a continuous measurement (e.g., bone density or blood pressure threshold).

  Note: The challenge is that moving the cutoff changes who is labeled as diseased. We take a specific example: osteoporosis defined by a T-score of -2.5 or below.

  Step 1.1: Is there a statistically abnormal deviation?
     - The T-score is defined relative to a reference population (young adult women). A T-score of -2.5 is more than 2.5 standard deviations below the mean of the reference population. So, yes, it is statistically abnormal.

  Step 1.2: Does this deviation impair survival or reproduction?
     - Low bone density increases the risk of fractures, which can lead to morbidity (pain, disability) and mortality (especially hip fractures in the elderly). Therefore, it impairs survival. So, yes.

  Thus, the dysfunction gate is passed (we don't need Step 1.3). Proceed to Step 2.

  Step 2.1: Is the condition disvalued?
     - Yes, osteoporosis is disvalued because it leads to fractures, which are harmful.

  Step 2.2: Is the disvalue primarily due to inherent features?
     - The disvalue (fractures, pain, disability) is inherent to the condition and not solely due to social reaction. So, yes.

  Therefore, we conclude: osteoporosis (as defined by the cutoff) is a disease.

  But note: The procedure does not question the cutoff itself. The cutoff is a matter of clinical guidelines and risk assessment. The procedure accepts the condition as presented (with the cutoff) and checks the gates. The committee must rely on clinical guidelines to set the cutoff appropriately.

  Case 3: A trait that is disvalued mainly because it is uncommon and stigmatized (e.g., left-handedness in an era that pathologized it).

  Step 1.1: Is there a statistically abnormal deviation?
     - Left-handedness is statistically abnormal (about 10% of the population). So, yes.

  Step 1.2: Does this deviation impair survival or reproduction?
     - In the absence of stigma, left-handedness does not impair survival or reproduction. In fact, it might confer some advantages in certain activities. So, no.

  Step 1.3: Is there evidence of evolutionary dysfunction?
     - There is no evidence that left-handedness represents a failure of the hand or brain to perform their evolutionary functions. It is a normal variation. So, no.

  Therefore, the dysfunction gate fails. We conclude: not a disease.

  Even if we had passed the dysfunction gate (which we did not), we would then check the disvalue gate:

  Step 2.1: Is it disvalued? In the historical context, yes, because it was stigmatized.
  Step 2.2: Is the disvalue primarily due to inherent features? No, the disvalue comes from social reaction (stigma and prejudice). Without the stigma, there would be no disvalue. Therefore, the disvalue gate would fail.

  Case 4: A person seeks treatment for a trait within the normal range (e.g., a student requesting medication to improve focus, or a short adult requesting growth hormone).

  We take the example of a student with normal attention levels (by standard tests) but who wants medication to improve focus.

  Step 1.1: Is there a statistically abnormal deviation?
     - The student's attention is within the normal range (as per standard tests). So, no.

  Therefore, the dysfunction gate fails. We conclude: not a disease.

  But note: This might be a case where the committee does not like the answer because the student (and perhaps the doctor) feels there is a problem. However, the procedure requires a dysfunction, and without a statistical deviation (and without impairment in Step 1.2 or 1.3), we cannot pass the dysfunction gate.

  For the short adult requesting growth hormone, we assume the adult's height is within the normal range (say, between the 3rd and 97th percentiles for the population).

  Step 1.1: Is there a statistically abnormal deviation?
     - No, because the height is within the normal range (by definition, the normal range includes the central 94% of the population). So, no.

  Therefore, the dysfunction gate fails. We conclude: not a disease.

  However, if the adult's height is below the 3rd percentile (which is a statistical abnormality), then:

  Step 1.1: Yes.
  Step 1.2: Does short stature impair survival or reproduction? In modern society, extreme short stature might cause some physical limitations, but the main issue is often social (discrimination, stigma). However, there can be inherent problems (e.g., increased risk of orthopedic problems). But let's assume that the impairment is primarily social. Then:

  Step 1.2: We might say no, because without social stigma, the condition might not impair survival or reproduction. Then we go to Step 1.3: Is there evidence of evolutionary dysfunction? Short stature might be due to a growth hormone deficiency, which could be seen as a dysfunction. But if the short stature is due to normal genetic variation, then Step 1.3 might fail.

  But if we pass the dysfunction gate (say, because of a known growth hormone deficiency), then:

  Step 2.1: Is it disvalued? Yes.
  Step 2.2: Is the disvalue primarily inherent? The inherent disvalue might be minimal (e.g., some increased risk of health problems) but the main disvalue is social. Therefore, we would have to judge whether the inherent disvalue is substantial enough to be "primary". If not, the disvalue gate fails.

  This is a judgment call. The procedure requires the committee to decide: without social stigma, would the condition still be disvalued because of inherent features? If the answer is no, then we conclude: not a disease.

  In this case, the procedure might yield an answer that the committee does not like because the individual is suffering and wants treatment. But the procedure is designed to avoid pathologizing social problems.

  Which steps are judgment calls dressed up as procedure?
  - Step 1.2: What counts as impairing survival or reproduction? This can be debated. For example, does a condition that reduces fertility by 1% count? We rely on clinical evidence and expert consensus to define impairment.
  - Step 1.3: The evolutionary function is often hard to establish and requires expert input. It is a fallback and should be used sparingly.
  - Step 2.2: Deciding whether disvalue is "primarily" inherent is a judgment call. It requires separating the condition from the social context, which can be difficult.

  The procedure is designed to be run in 15 minutes per case by non-specialists. Therefore, for Step 1.3, if there is no clear evidence of evolutionary dysfunction (which is often the case), the answer is no. For Step 2.2, the committee must make a judgment based on available evidence about the source of disvalue.

  Finally, the procedure stops with a definite "no" at any step that fails. It only requires human judgment at Step 1.3 (if reached) and Step 2.2 (if reached). The rest are intended to be more objective.

  We present the procedure in a flowchart for clarity:

  ```
  Start
  |
  v
  [Step 1.1: Statistical abnormality?]
  |           |
  | No        | Yes
  |           v
  |--------->[Step 1.2: Impairs survival/reproduction?]
              |           |
              | No        | Yes
              |           v
              |--------->[Step 1.3: Evolutionary dysfunction?]
                           |           |
                           | No        | Yes
                           |           v
                           |--------->[Step 2.1: Disvalued?]
                                        |           |
                                        | No        | Yes
                                        |           v
                                        |--------->[Step 2.2: Disvalue primarily inherent?]
                                                     |           |
                                                     | No        | Yes
                                                     |           v
                                                     |--------->[Conclusion: Disease]
                                                     |
                                                     v
                                           [Conclusion: Not a disease] at any failure

  ```

  At any failure (No) in Steps 1.1, 1.2, 1.3, 2.1, or 2.2, we conclude "not a disease". Only if we get through all steps with a Yes do we conclude "disease".

  This procedure should help the committee break deadlocks by providing a structured, step-by-step approach that prioritizes the more objective criteria first and leaves the more subjective ones for when they are necessary.
answer: |-
  Below is a written decision procedure designed to resolve deadlocks in your committee. It prioritizes clarity, speed (≤15 minutes/case), and operationalizability for mixed clinical/lay members. The procedure **starts with the dysfunction gate** (to anchor in biology before values) and uses a tiered approach to break theoretical stalemates. Judgment calls are minimized but explicitly flagged. 

  ---

  ### **Disease Classification Procedure**  
  *Two-Gate Test: Dysfunction + Disvalue (in that order)*  
  **Outcomes**: (1) Disease, (2) Not a Disease, or (3) Escalate to Medical Director (values conflict).  

  #### **Step 1: Dysfunction Gate**  
  *Question: Is there a biological dysfunction?*  
     - **Sub-question 1.1 (Statistical)**: Is the condition a statistically abnormal deviation from the species-typical structure/function in a reference population?  
       - *Sufficient "Yes"*: Measurable deviation from population norms (e.g., lab values, imaging).  
       - *Sufficient "No"*: Within typical range (e.g., height, blood pressure in normal percentiles).  
       - *Stop if "No"*: **Not a disease** (dysfunction gate closed).  
       - *If "Yes"*: Proceed to Sub-question 1.2.  

     - **Sub-question 1.2 (Survival/Reproduction)**: Does the deviation impair survival or reproduction?  
       - *Sufficient "Yes"*: Objective impairment (e.g., reduced lifespan, infertility, organ failure).  
       - *Sufficient "No"*: No impact on survival/reproduction (e.g., benign variants).  
       - *Stop if "No"*: Proceed to Sub-question 1.3.  
       - *If "Yes"*: **Dysfunction gate open** → Proceed to Step 2.  

     - **Sub-question 1.3 (Evolutionary)**: Does the deviation reflect a failure of evolutionary design?  
       - *Sufficient "Yes"*: Trait clearly contravenes a conserved evolutionary function (e.g., defective heart pumping).  
       - *Sufficient "No"*: No evidence of broken adaptation (e.g., normal aging, harmless variants).  
       - *Stop if "No"*: **Not a disease** (dysfunction gate closed).  
       - *If "Yes"*: **Dysfunction gate open** → Proceed to Step 2.  

  #### **Step 2: Disvalue Gate**  
  *Question: Is the condition disvalued?*  
     - **Sub-question 2.1 (Harm)**: Does the condition cause inherent harm?  
       - *Sufficient "Yes"*: Physical pain, disability, distress, or mortality risk *directly caused by the condition*.  
       - *Sufficient "No"*: No inherent harm (e.g., asymptomatic, no functional limitation).  
       - *Stop if "No"*: **Not a disease** (disvalue gate closed).  
       - *If "Yes"*: **Disvalue gate open** → **Classify as DISEASE**.  
       - *If ambiguous*: Proceed to Sub-question 2.2.  

     - **Sub-question 2.2 (Source of Disvalue)**: Is disvalue primarily from inherent harm (not social reaction)?  
       - *Judgment call*: Escalate to Medical Director if:  
         - Disvalue is *solely/mostly* from stigma, prejudice, or environmental mismatch (e.g., social exclusion).  
         - OR inherent harm is inseparable from social harm.  
       - *Medical Director decides*:  
         - If inherent harm dominates → **Classify as DISEASE**.  
         - If social harm dominates → **Not a disease**.  

  ---

  ### **Key Features**  
  1. **Order**: Dysfunction first (avoids pathologizing non-biological disvalues).  
  2. **Dysfunction Gate Hierarchy**:  
     - Start with **statistical** (objective, quick).  
     - If unclear, use **survival/reproduction** (clinical relevance).  
     - Last resort: **evolutionary** (rarely needed; escalates to experts).  
  3. **Disvalue Gate Safeguard**:  
     - Inherent harm required (stigma alone fails).  
     - Ambiguous cases escalate to avoid committee deadlock.  
  4. **Judgment Calls**:  
     - Step 1.3 (evolutionary function): Requires expert input (e.g., geneticist).  
     - Step 2.2 (source of disvalue): Values-based; Medical Director breaks ties.  
  5. **Limitations**:  
     - Cannot set clinical thresholds (e.g., BP cutoffs)—relies on external guidelines.  
     - Cannot resolve debates about "typical" populations (reference group must be predefined).  
     - Does not address treatment/coverage—only disease classification.  

  ---

  ### **Case Applications**  
  #### **Case 1: Extra Rib (asymptomatic)**  
  - **Step 1.1 (Statistical)**: Yes (abnormal anatomy). → Proceed.  
  - **Step 1.2 (Survival/Reproduction)**: No impairment (asymptomatic). → Proceed to 1.3.  
  - **Step 1.3 (Evolutionary)**: No (ribs protect organs; extra rib doesn’t undermine this). → **Stop. Not a disease**.  
  *No disvalue gate needed. Committee-friendly: avoids over-medicalization.*  

  #### **Case 2: Osteoporosis (BMD T-score ≤ -2.5)**  
  - **Step 1.1 (Statistical)**: Yes (statistically abnormal bone density). → Proceed.  
  - **Step 1.2 (Survival/Reproduction)**: Yes (increased fracture risk → mortality/morbidity). → **Dysfunction open**.  
  - **Step 2.1 (Harm)**: Yes (pain, disability from fractures). → **DISEASE**.  
  *Threshold set by guidelines; procedure accepts it if statistical + harm criteria met.*  

  #### **Case 3: Pathologized Left-Handedness (historical)**  
  - **Step 1.1 (Statistical)**: Yes (minority trait). → Proceed.  
  - **Step 1.2 (Survival/Reproduction)**: No (no inherent impairment). → Proceed to 1.3.  
  - **Step 1.3 (Evolutionary)**: No (evolutionarily neutral variant). → **Stop. Not a disease**.  
  *Even if dysfunction passed: Step 2.2 would fail (disvalue from stigma only → escalate as "social harm").*  

  #### **Case 4: Normal-Range Trait (e.g., Short Stature)**  
  - **Step 1.1 (Statistical)**: No (height within population norms). → **Stop. Not a disease**.  
  *Deliberate "unpopular" outcome: Fails dysfunction gate despite disvalue. Prevents medicalization of normal variation. If patient is distressed, escalate as a values issue (Step 2.2) but dysfunction gate must pass first.*  

  ---

  ### **Procedure in Practice**  
  - **Time**: Cases resolved in 10-15 minutes by focusing on objective gates first.  
  - **Escalations**: Medical Director intervenes only for Step 2.2 (social harm) or contested evolutionary function (Step 1.3).  
  - **Output**: Clear "disease" or "not disease" for coverage guidelines.  
  - **What It Can't Do**:  
    - Overrule clinical guidelines (e.g., BP thresholds).  
    - Resolve all value conflicts (e.g., disability rights vs. medical norms).  
    - Replace cost-benefit analysis for coverage.  

  This procedure forces consensus by sequencing gates, demoting theoretical debates (evolution as last resort), and isolating values to one step. It ensures biology precedes values while rejecting stigma-driven pathologization.
