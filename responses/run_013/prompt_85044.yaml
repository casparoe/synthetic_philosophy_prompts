answer: |-
  Based on your precise description – the consistent, sincere congratulations immediately followed by a neutral, factual reassignment of credit away from the individual to external factors (luck, timing, tools, team), applied universally (including self), and the unreserved celebration of *non-individual* successes (groups, tools, data) – **there is no single, widely recognized term for this specific phenomenon.**

  Existing concepts fall short:
  1.  **Tall Poppy Syndrome / Jante Law:** Focus on *cutting down* success due to envy or resentment. You explicitly rule out sourness, malice, or "cutting down." The congratulations are warm and sincere.
  2.  **Damning with Faint Praise:** Involves *insincere* or *minimal* praise intended to undermine. Your observation is the *opposite*: the praise is robust and sincere, followed by a separate, factual-sounding statement.
  3.  **Modesty Norms:** While related, these are broader, encompassing various behaviors (downplaying one's role, avoiding boasting). Your phenomenon is a very specific, two-step *linguistic ritual*: praise + immediate, factual-sounding credit reassignment.
  4.  **Fundamental Attribution Error:** This is a cognitive bias (over-attributing others' actions to personality, under-attributing to situation). Your observation is a *socially enforced norm manifesting in speech*, applied equally to self and others, not necessarily a cognitive error.
  5.  **Collectivism:** While the *outcome* aligns with collectivist values (de-emphasizing the individual), your description captures the specific *mechanism* – the consistent, paired verbal move – which isn't explicitly named by the broad cultural label.

  **The Coined Term: Communal Attribution Reflex (CAR)**

  *   **What it is (The Move):** CAR describes the **automatic, normative verbal ritual consisting of sincere individual congratulations immediately followed by a factual reassignment of credit for the achievement to non-individual factors (luck, timing, tools, team, institution), applied universally.**
      *   It is a *defense mechanism* for a deeply held social norm: **Achievement is communal property, not individual possession.**
      *   The "reflex" highlights its automatic, ingrained nature. The "communal attribution" captures the core action: shifting credit away from the individual towards the collective context.
      *   The sincere congratulations fulfill the social obligation to acknowledge the event, while the attribution protects the norm by dissolving individual ownership.
      *   It is triggered by *individual* attribution of success. Group/institutional successes or impersonal improvements (tools/data) bypass this reflex and receive unqualified praise because they inherently embody the communal norm.

  *   **What it is NOT (Edges):**
      *   **NOT motivated by envy or resentment:** The congratulations are genuine. There is no intent to diminish the person's *feeling* of success, only to dissolve their *exclusive claim* to it.
      *   **NOT "damning with faint praise":** The praise component is strong and sincere. The attribution is not a veiled insult; it's presented as an objective statement of how success *works* in that culture.
      *   **NOT Tall Poppy/Jante:** It does not seek to *cut down* the individual or enforce mediocrity. It seeks to *absorb* the individual's success into the communal fabric. The person isn't diminished; their success is recontextualized.
      *   **NOT simply modesty:** While modesty might be a personal trait, CAR is a *social script*. It operates even if the individual internally feels proud, and it's applied *to* others just as readily as to oneself. It's about enforcing a communal reality, not just personal humility.
      *   **NOT necessarily a cognitive error:** While it involves attribution, it functions primarily as a *normative speech act*, reinforcing social cohesion and shared reality, rather than being solely a misjudgment of causality.

  *   **Relation to Ruled-Out Concepts:**
      *   **Tall Poppy/Jante:** CAR shares the *outcome* of downplaying individual exceptionalism but achieves it through a fundamentally different, non-malicious *mechanism* (absorption vs. cutting down).
      *   **Faint Praise:** CAR demonstrates the *opposite* of faint praise: robust praise is a necessary first step in the ritual. The attribution serves a different purpose (norm defense) than veiled insult.
      *   **Collectivism:** CAR is a specific *behavioral manifestation* and *enforcement mechanism* of a core collectivist principle (communal ownership of outcomes) within professional/academic settings.

  **Why "Communal Attribution Reflex" Fits Your Observation:**

  1.  **"Communal":** Captures the core norm being defended – achievement belongs to the group, context, or system, not the isolated individual.
  2.  **"Attribution":** Directly addresses the act of reassigning cause/credit away from the person.
  3.  **"Reflex":** Emphasizes the automatic, ingrained, almost unconscious nature of the paired response (congrats + reassignment), highlighting its role as a learned social script.
  4.  **It accounts for:** The sincerity of the praise (part of the ritual), the factual tone of the reassignment (stating the communal reality), the universality of application (norm enforcement), and the different treatment of group/impersonal successes (they don't violate the norm).

  CAR names the specific, consistent, two-part verbal performance you witnessed across labs and countries, defending the unspoken rule that individual scientists are vessels within a larger, luck-dependent, tool-enabled, team-based, and institutionally-supported endeavor. The achievement isn't *yours*; it's *ours* (the team, the lab, the field, the circumstances), and the CAR reflex ensures this understanding is linguistically reinforced every time individual success is noted.
