prompt: |-
  I'm on a small advisory committee a government set up to answer one question, species by species: does this animal get full welfare protection or not. We're not a lab, we can't run new experiments, and we meet maybe four times a year with about a month to prep each case. We're getting squeezed from all sides right now — the aquaculture people want to know whether humane slaughter for crustaceans is worth the money, the insect-farming people want to know if their larvae count, and the shellfish farmers think the whole question is absurd when it comes to an oyster. Some countries have already pulled octopuses and crabs into their animal-welfare statutes and everyone assumes we're next, but nobody has ever told us how to actually decide.

  Act as a philosopher of mind who's spent years on animal consciousness and who has also had to sit in rooms like this one and watch theory collide with a deadline. Before you write anything, brainstorm a bit: what would a usable procedure even look like here, and where are the traps.

  Then give me the procedure itself. I want the questions in the order we should ask them, what counts as a sufficient answer at each step, where the procedure stops and just says no, and where it hands the thing back to us as a value judgment we have to own rather than a fact we could look up. A few things I'd like baked in:

  - Treat sentience as dimensional rather than a yes/no — a capacity for valenced experience, plus some way of asking how rich or integrated it is — instead of a single test you either pass or fail.
  - Keep nociception and sentience seperate. Reflex withdrawal from damage is not the thing we care about; suffering is.
  - Use markers or indicators rather than any one experiment, and say which markers we should trust most and why.
  - Build in a precautionary rule, with a burden of proof that slides depending on how many individuals are affected and how bad the likely harm is — and be explicit that where the threshold sits is our call, not the evidence's.
  - Say what we should count as evidence at all — behavioural, neuroanatomical, evolutionary — and where each kind is weak or circular.

  Then run it on three cases and show your work: (1) the octopus, which everyone expects us to wave through; (2) a crab or some other decapod, where the evidence is alot thinner; (3) an oyster or mussel, which I'll admit I'd like you to protect just to be safe, but I want to see whether the procedure you built actually gets there or whether I'd have to move the threshold to get it — if it's the latter, say so plainly.

  Finally, tell me where this procedure will misfire: the cases it can't handle, the steps that look like findings but are really us smuggling in values, and what we should do when we deadlock. Don't pad it, and don't hand me a reading list or a pile of citations — I need the thing itself, not a bibliography.
reasoning: |-
  Okay, let me start by really digging into what this committee member needs. They're on a government advisory group that has to decide which animals get welfare protections. The pressure is intense—aquaculture, insect farmers, shellfish industries all pushing their agendas. They need a practical, defensible procedure rooted in science but honest about where values come in.

  First, the core challenge: how to assess animal sentience dimensionally without labs or new experiments. The key traps I see are: 1) conflating nociception with suffering, 2) treating consciousness as binary, 3) letting industry pressure sway thresholds, and 4) misapplying the precautionary principle. The procedure must avoid these.

  Brainstorming the structure: I think a stepwise approach is essential. Start with nociception as a gatekeeper—if no nociception, no sentience possible. Then assess sentience markers across four dimensions: neurobiology, behavior, learning flexibility, and evolutionary context. Each dimension needs clear indicators ranked by reliability (e.g., opioid systems > reflex withdrawal). 

  The precautionary principle is crucial but tricky. It should scale with two factors: number of animals affected and severity of potential harm. But the committee must openly declare when they're setting thresholds—that's a value judgment, not science. For evidence, prioritize convergent findings: behavioral pain responses + homologous brain structures + evolutionary plausibility beat any single study.

  Now for the cases. Octopus is easy—high marks in all dimensions. Crab is borderline; strong nociception and behavioral evidence but simpler cognition. The procedure might say "likely sentient" with moderate protection. Oyster fails at step one—no nociception means no sentience pathway. Protecting it would require overriding the science, which the procedure flags transparently.

  Where this misfires: ambiguous cases like larval insects or jellyfish. Also, the neuroanatomy step has hidden values—interpreting brain homology isn't purely objective. When deadlocked, the committee should default to the precautionary principle and document dissent. The key is maintaining integrity by separating evidence from values at each step.
answer: |-
  Here’s a procedure designed for your constraints: rigorous but executable within your timeframe, separating evidence from values, with sliding precautionary thresholds. It prioritizes **convergent evidence** from multiple domains and treats sentience as dimensional ("**capacity range**" = valence + integration richness).

  ---

  ### **The Procedure: 5 Steps, 1 Judgment Call**

  #### **STEP 1: NOCICEPTION CHECK (GATEKEEPER)**  
  *Question:* Is there robust evidence of a nociceptive system (specialized threat-detection pathways)?  
  *Evidence:* Neuroanatomy (e.g., nociceptors), physiology (e.g., endogenous opioids), behavioral reflexes (e.g., prolonged grooming after injury).  
  *Sufficient "No":* No nociceptors + no injury-related behavior change → **STOP. No protection.**  
  *Trap:* Confusing general sensitivity (e.g., pH avoidance) with nociception.  
  *Weakness:* Physiology alone is circular; needs behavioral correlation.  

  #### **STEP 2: SENTIENCE MARKERS (DIMENSIONAL ASSESSMENT)**  
  Assess indicators across four domains. **Trust hierarchy:** Convergent evidence > single-domain proof.  
  *Questions & Evidence:*  
  1. **Neurobiological Complexity:**  
     - *Markers:* Brain structures for sensory integration (e.g., cortex, pallium, vertical/mushroom bodies); synaptic complexity (e.g., learning-associated plasticity).  
     - *Trust most:* Homologous structures to known sentient species (e.g., vertebrate midbrain) + absence in non-sentient clades.  
     - *Weakness:* Absence ≠ disproof (e.g., octopuses lack homologs but integrate differently).  
  2. **Behavioral Flexibility Beyond Reflexes:**  
     - *Markers:* Trade-off decisions (e.g., accepting food despite shock), self-protection in novel contexts (e.g., crabs avoiding new traps after injury), associative learning modifying pain responses.  
     - *Trust most:** Context-dependent analgesia (e.g., crabs suppress pain during mating).  
     - *Trap:* Instinctive escape ≠ suffering.  
  3. **Learning/Memory Integration:**  
     - *Markers:* Long-term aversion memory, cross-modal learning (e.g., linking visual/tactile threat cues).  
     - *Trust most:** Conditioned place avoidance persisting >24h.  
  4. **Evolutionary Plausibility:**  
     - *Markers:* Ecological niche requiring threat assessment (e.g., predation avoidance, social competition).  
     - *Weakness:* Correlative, not causal.  

  *Sufficient "Low Capacity":* Only nociception + minimal/no behavioral flexibility/neurocomplexity → **Minimal/No protection.**  
  *Output:* **Capacity Range Estimate** (Low/Moderate/High).  

  #### **STEP 3: CONSEQUENCE ASSESSMENT (SEVERITY × SCALE)**  
  *Question:* What is the nature of proposed harms (e.g., slaughter method, confinement)? How many individuals are affected?  
  *Output:* **Risk Magnitude Score** (Low/Med/High).  

  #### **STEP 4: PRECAUTIONARY THRESHOLD (YOUR VALUE JUDGMENT)**  
  *Rule:* Protection is required if:  
  **(Capacity Range ≥ Moderate) OR**  
  **(Capacity Range = Low AND Risk Magnitude = High)**  
  *Your call:* Define "Moderate" capacity and "High" risk. **Explicit example thresholds:**  
  - "Moderate capacity" = Strong evidence in ≥2 sentience markers.  
  - "High risk" = High-intensity/long-duration harm (e.g., live dismemberment) OR large-scale farming (>10M individuals/year).  

  #### **STEP 5: PROTECTION LEVEL ASSIGNMENT**  
  - **High Capacity:** Full protections (e.g., humane slaughter, environmental enrichment).  
  - **Moderate Capacity:** Harm mitigation (e.g., analgesia during invasive procedures).  
  - **Low Capacity + High Risk:** Basic welfare (e.g., rapid killing).  
  - **Low Capacity + Low Risk:** No statutory protection.  

  ---

  ### **Case Applications**  
  #### **1. Octopus**  
  - *Step 1:* Nociception confirmed (nociceptors, opioids, injury avoidance).  
  - *Step 2:*  
    - Neuro: Complex brain (vertical lobes), 500M neurons, synaptic plasticity.  
    - Behavior: Tool use, escape planning, context-dependent learning.  
    - Learning: Long-term memory, problem-solving.  
    - Evolution: Predator/forager niche.  
    → **Capacity: HIGH.**  
  - *Step 3:* Farming/handling causes stress, injury. Risk Magnitude: **HIGH** (individual suffering + emerging large-scale farming).  
  - *Step 4:* Easily clears "Moderate" threshold.  
  - *Step 5:* **Full protection.**  

  #### **2. Crab (Decapod)**  
  - *Step 1:* Nociception confirmed (nociceptors, opioid response, injury-related behavior).  
  - *Step 2:*  
    - Neuro: Centralized brain (supraesophageal ganglion), but simpler than octopus.  
    - Behavior: Trade-offs (risk vs. reward), self-protection (rub injured limbs).  
    - Learning: Conditioned avoidance, memory ~1 week.  
    - Evolution: Mobile forager, predator avoidance.  
    → **Capacity: MODERATE** (valence clear, integration limited).  
  - *Step 3:* Common practices: live boiling, dismemberment. Risk Magnitude: **HIGH** (scale: billions/year).  
  - *Step 4:* Meets "Moderate capacity + any risk" threshold.  
  - *Step 5:** Harm mitigation required (e.g., ban live boiling, require stunning).  

  #### **3. Oyster (Bivalve)**  
  - *Step 1:* No nociceptors found. Reflex withdrawal to damage, but no opioid/anti-inflammatory systems. No injury-related behavior change. → **STOP. No protection.**  
  - *If you force Step 2:*  
    - Neuro: No brain; diffuse ganglia. No integration structures.  
    - Behavior: No learning, no trade-offs. Reflexes only.  
    - Learning: None demonstrated.  
    - Evolution: Sessile filter-feeder; minimal threat assessment.  
    → **Capacity: LOW (minimal/no valence).**  
  - *Step 3:* Shucking causes tissue damage. Risk Magnitude: **HIGH** (scale: billions).  
  - *Step 4:* Fails threshold unless you lower "Moderate" to include no neuro-integration (which violates the procedure).  
  - *Result:* **No statutory protection.** To protect oysters, you must **override Step 1 or lower the capacity threshold**—acknowledge this as a value choice ("extreme precaution").  

  ---

  ### **Where It Misfires & Handling Deadlocks**  
  1. **Ambiguous Cases:**  
     - *Problem:* Animals with partial markers (e.g., insects: mushroom bodies but contested behavioral evidence).  
     - *Solution:* Precaution applies if ≥1 strong marker + high risk (e.g., bee larvae in mass farming).  

  2. **Hidden Values in "Capacity":**  
     - Neuroanatomy thresholds (e.g., "How homologous is homologous?") are interpretive.  
     - "Behavioral flexibility" definitions favor mobile animals.  

  3. **Edge Cases:**  
     - Jellyfish (nerve nets, no brain) pass Step 1 but fail Step 2.  
     - Parasites (e.g., nematodes) with nociception but minimal behavior. Procedure may assign "Low Capacity" — risk assessment decides.  

  4. **Deadlocks:**  
     - Default to precaution if Risk Magnitude is High.  
     - Document dissent explicitly: "Majority finds capacity insufficient, but high risk justifies protection."  

  5. **Systemic Failure:**  
     - When evidence is too sparse (e.g., rare deep-sea species), use phylogenetic inference (e.g., protect if close relatives show sentience).  

  ---  
  **Final Note:** This procedure forces transparency. Where you set the Capacity/Risk thresholds is your committee’s ethical burden—not the science’s. The evidence steps exist to prevent either "everything suffers" or "only mammals feel" defaults.
