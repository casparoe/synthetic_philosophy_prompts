  I recall that computational irreducibility and undecidability in dynamical systems are key here. The user is concerned that these terms might be conflated. They need clear boundaries between sensitive dependence, computational expense, and structural barriers. They also question if undecidability is a stronger form of irreducibility or a separate issue.

