answer: |-
  Here's a concrete decision tree designed for dialogue, built on questions a character could ask or cases they might reference, leading to distinct positions with their inherent tensions:

  **The Abortion Argument Tree**

  1.  **"Does that cluster of cells developing in the womb have the same moral weight as you or me *right now*?"**
      *   **No (Not a full person now):** Go to 2.
      *   **Yes (Full person now):** Go to 3.
      *   **It's complicated/Becoming one/Partial weight:** Go to 7.

  2.  **"So, ending a pregnancy is more like preventing a future person than ending an existing one?"**
      *   **Yes, exactly:** → **Early Prevention View.** *Awkward swallow: Ending a potential, much-wanted life at 8 months feels disturbingly different than ending it at 8 weeks, even if both are just "potential."*
      *   **No, it's still wrong, but differently:** → **Lost Future View.** *Awkward swallow: It's wrong because it deprives a being of a valuable future, but that future only exists because of the pregnancy you're ending.*
      *   **Depends entirely on the woman's situation/choice:** → **Bodily Autonomy First.** *Awkward swallow: A woman's right to control her body seems absolute, even if the developing life is valued highly by others (like the hopeful sister in your surrogacy case).*

  3.  **(Assuming full personhood) "Does that person have the right to use the woman's body to stay alive, even if she doesn't want them to?"**
      *   **Yes, absolutely:** Go to 4.
      *   **No, bodily integrity trumps:** → **Forced Sustenance Denial.** *Awkward swallow: You must accept that knowingly ending the life of an innocent person (the fetus) is sometimes permissible, even necessary (like unplugging from the violinist).*
      *   **Only if she consented to the risk:** Go to 5.

  4.  **"So the unborn person's right to life includes a right to the mother's body?"**
      *   **Yes, always:** → **Absolute Fetal Right.** *Awkward swallow: Even in cases of rape, incest, or severe threat to the mother's life/health, the fetus's right prevails.*
      *   **Only if the pregnancy resulted from voluntary sex:** → **Consent-to-Sex Implied Consent.** *Awkward swallow: Perfect contraception use (your case) makes "consent to pregnancy" feel like a very stretched concept.*
      *   **Only until viability, then it gets murky:** → **Viability Threshold.** *Awkward swallow: Drawing a sharp moral line at a medical milestone (viability) feels arbitrary, and viability keeps changing.*

  5.  **(Assuming consent matters) "By having voluntary sex, did she accept the risk of pregnancy and thus the responsibility to carry it?"**
      *   **Yes, always:** → **Strict Responsibility.** *Awkward swallow: This equates any voluntary sex, even with maximal contraception (your case), with accepting forced organ donation for 9 months.*
      *   **Only if she was reckless/didn't use protection:** → **Negligence-Based Duty.** *Awkward swallow: Defining "reckless" is messy (was one form enough? Two? What about failed IUDs?). Also, doesn't address your surrogacy case where protection wasn't the issue.*
      *   **No, consent to risk isn't consent to the outcome:** → **Risk ≠ Obligation.** *Awkward swallow: Separating consent to sex from consent to pregnancy entirely, making the latter always require explicit, ongoing consent.*

  6.  **(From 1: It's complicated/Partial) "When does it *become* a person with rights we must respect?"**
      *   **At conception:** → Effectively merges with branches under 3 (Full Personhood).
      *   **At some point during development (heartbeat, brain activity, etc.):** → **Gradual Personhood.** *Awkward swallow: Picking any specific biological marker feels scientifically arbitrary and creates a sliding scale of moral value.*
      *   **At birth:** → Merges with branches under 2 (Not a Full Person).
      *   **When the woman/parents decide it's 'wanted':** → **Personhood Through Acceptance.** *Awkward swallow: The moral status of the developing life depends entirely on the feelings/choices of others, making its inherent value contingent.*

  7.  **(From anywhere) "Is the core wrong here about the *act* of ending the pregnancy, or about the *character* of the person who chooses it?"**
      *   **The Act Itself:** → All positions above primarily focus here. The act is inherently right/wrong based on personhood, consent, etc.
      *   **The Character/Motivation:** → **Moral Disposition Focus.** *Awkward swallow: This can seem to dodge the core ethical questions about the act and life. It judges the woman (selfish? brave? desperate?) rather than the termination itself. It struggles to condemn a "selfish" woman in a medically necessary case or praise a "brave" one ending a healthy pregnancy for trivial reasons without implicitly judging the act.*
      *   **Both are deeply intertwined:** → Most positions incorporate elements of both, but this explicitly centers judgment on the chooser. *Awkward swallow: Risks making the argument entirely about shaming or excusing individuals rather than principles.*

  **Handling Your Cases & Notes:**

  *   **The Violinist:** Used explicitly in the "Forced Sustenance Denial" leaf (3b) to illustrate bodily integrity trumping even full personhood.
  *   **Deprived Future:** Explicit "Lost Future View" leaf (2b).
  *   **Surrogacy (Sister changes mind at 20 weeks):** This stresses the "Bodily Autonomy First" leaf (2c) and "Personhood Through Acceptance" leaf (6d). It challenges "Consent-to-Sex Implied Consent" (4b) and "Strict Responsibility" (5a) because the initial context was explicit consent *to pregnancy* that was revoked.
  *   **Perfect Contraception Failure:** Directly challenges "Consent-to-Sex Implied Consent" (4b), "Strict Responsibility" (5a), and "Negligence-Based Duty" (5b). Supports "Risk ≠ Obligation" (5c) and "Bodily Autonomy First" (2c).
  *   **Nurse's Character Focus:** Explicitly addressed in Node 7 and its leaves.
  *   **Attorney's Consent Push:** Explicitly addressed in Nodes 5 and its leaves, and embedded in 4b and 5a.
  *   **Empty/Incoherent Combinations:**
      *   **"Full Person, No Right to Life/Bodily Use, But Still Can't Abort":** Incoherent. If it's a full person but has *no* right to use the body *and* no inherent right to life violated by abortion, why restrict abortion? This space is empty.
      *   **"Not a Person, But Absolute Ban":** Ugly/Incoherent. Why ban terminating something with no moral weight? Might exist as an unexamined cultural/religious stance, but logically empty.
      *   **"Gradual Personhood + Absolute Ban from Conception":** Incoherent. Can't hold both.

  **How to Use This Tree:**

  1.  **Pick a Character:** Which of your four is speaking?
  2.  **Trace Their Path:** Follow the questions (*as they would ask or answer them*) through the tree. They won't hit every node! Their core beliefs lead them down specific branches, skipping others.
  3.  **Land on Leaf(ves):** Find the leaf (or small cluster of leaves) that best captures their core position *in this argument*. A character might touch on adjacent leaves if conflicted or making a specific point.
  4.  **Know the Swallow:** Remember the awkward implication of their position. This is their internal friction point and where others can attack.
  5.  **Dialogue Prompt:** Use the *question* from the node they're reacting to, or the *scenario* implied by a leaf (surrogacy, contraception failure) to spark their specific response. Instead of "Life begins at conception!" you get "How can you say that embryo isn't already one of us?" (Node 1) or "She knew the risks when she signed that contract!" (Node 5, Surrogacy context).

  This structure forces specificity beyond slogans by grounding positions in concrete questions and cases, revealing the underlying logic and the tensions each character must navigate or ignore. Good luck with the dinner party!
