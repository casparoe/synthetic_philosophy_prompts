answer: |-
  Here’s a fully designed 90-minute activity titled **"The Boundary Game"** focused on experiential learning of Wittgenstein’s family resemblance and the necessity of "use." Materials are simple: index cards and a whiteboard.

  ---

  ### **Materials**  
  - **30 pre-printed cards** (mix of "games" and "non-games"):  
    *Included:* Speedrunning *Minecraft*, TikTok dance challenge, LARP battle, rigged casino slot machine, kids playing "house," *Among Us* sabotage, fantasy football draft, escape room puzzle, Calvinball (no rules), "hot potato" at a party, Twitch streamer playing *Dark Souls*, "the floor is lava" game.  
    *Outliers:* Rock-paper-scissors, a lottery ticket, a crossword puzzle.  
    *Spoiler Chain:* Chess → boxing match (shared: competition) → street fight (shared: physical struggle) → a rock (shared: "can be thrown").  
    *Contested Case:* An AI-generated *Skyrim* "speedrun" (no human player).  

  - **2 labeled boxes**: "GAME" and "NOT A GAME"  
  - **Whiteboard** for tracking team points.  

  ---

  ### **Rules & Structure (90 mins total)**  
  **1. Framing & Teams (10 mins)**  
  - *Do not mention "family resemblance" or Wittgenstein.*  
  - Split class into 3 teams of 5. Introduce: "We’re playing a game about games. Your goal: sort cards into ‘GAME’ or ‘NOT A GAME.’ Teams earn 1 point per *correct consensus* placement. Most points wins. **Rule: No definitions allowed. Argue only by similarities/differences to clear cases.**"  

  **2. Round 1: Easy Cases (15 mins)**  
  - Give each team 5 unambiguous cards (e.g., *Among Us*, escape room, lottery ticket, crossword, "floor is lava").  
  - Teams discuss and place cards in boxes. Award points for consensus matches with your pre-set answers (e.g., lottery = NOT; escape room = GAME).  

  **3. Round 2: The Chain Spoiler (20 mins)**  
  - Introduce the chain cards: **Chess → Boxing → Street Fight → Rock**.  
  - Teams must place each card *sequentially*.  
  - *Predicted disaster:* Teams will agree Chess/Boxing are IN. Street Fight splits votes (50/50). Rock is OUT, but students must justify why resemblance "fails." **Intervene:** "Team 1, you said Boxing and Street Fight both involve ‘struggle’—why is one IN and one OUT? What changed?"  

  **4. Round 3: Borderline Battle (20 mins)**  
  - Introduce the contested case: **AI *Skyrim* speedrun** (no player).  
  - Teams debate. Force a vote. *Likely outcome:* No consensus (e.g., "It’s *like* a game but empty of intent"). Highlight: "What feature would settle this? Can you find one?"  

  **5. Scoring & Reveal (5 mins)**  
  - Tally points (rigged so teams are close). Declare a winner.  

  ---

  ### **Debrief (20 mins)**  
  **Q1:** "When sorting, what guided your choices? Was there one trait all ‘games’ shared?"  
  → *They’ll note overlapping features (rules, fun, goals) but no universal core.*  

  **Q2:** "What happened with the rock? If resemblance chains work, why was it clearly OUT?"  
  → *Elicit: "Resemblance alone lets nonsense in!"*  

  **Q3:** "What *actually* stopped the chain? Why is a street fight not a game?"  
  → *Draw out: Context, intent, social practice ("We don’t ‘use’ it that way").*  

  **Q4:** "What about the AI speedrun? Why couldn’t features solve it?"  
  → *Highlight: Borderlines expose that meaning lives in human activity.*  

  **Finally:** "This mirrors Wittgenstein’s point: categories hang on **use in a form of life**, not definitions. ‘Family resemblance’ names the symptom, but ‘language-games’ cure the disease."  

  ---

  ### **What Will Go Wrong & How to Fix It**  
  - **Problem:** Teams invent definitions early ("Games must have rules!").  
    *Fix:* Gently enforce: "What *similarity* makes this like [clear game]? Not what ‘rule’ it follows."  
  - **Problem:** Students dismiss the rock as "cheating."  
    *Fix:* "If resemblance is our only tool, why is this invalid? What’s *missing*?"  
  - **Problem:** Teams avoid debate, default to majority vote.  
    *Fix:* Assign a devil’s advocate per team. Require disagreements to be voiced.  

  ---

  ### **What This Activity Can’t Do**  
  1. **"Forms of life" abstraction:** Students experience "use" as context, but Wittgenstein’s deeper idea of shared human practices needs framing. *Say:* "Use isn’t just context—it’s woven into our biological/social history."  
  2. **Rival theories:** Prototype theory (Rosch) or disjunctive definitions could explain the data. *Clarify:* "Wittgenstein rejects *any* fixed criteria—even fuzzy ones. Meaning is fluid, anchored in action, not mental categories."  
  3. **Private language argument:** This activity focuses on categorization. The "private language" critique requires separate treatment.  

  ---

  ### **Why It Works**  
  - **Spoiler chain** forces them to feel resemblance’s failure.  
  - **Borderline case** blocks definitional fixes.  
  - **Tactile debate** makes "use" emerge naturally.  
  - You withhold "family resemblance" until they’ve lived the problem.  

  This turns abstraction into muscle memory. They’ll leave feeling the hole in resemblance—and why practice fills it.
