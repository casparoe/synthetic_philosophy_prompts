prompt: |-
  I recently sat in on a dispute between two colleagues, neither of them a specialist in logic, and I have not been able to settle it in my own mind. What I want is a point-by-point adjudication of the arguments as they were actually made, not a general essay on the paradox.

  The dispute concerned a sentence one of them had written on a card, which I reproduce exactly as it stood: 'The sentence written on this card is not true.'

  (1) A maintained that the sentence is neither true nor false. Truth, she said, is not invariably bivalent; there are sentences that fall into a gap, and this is one of them. B replied that this cannot be right, for the simplest of reasons: if the sentence is not true, then matters stand exactly as the sentence says they stand, and so the sentence is true. On his view, the gap theory is refuted by the very sentence it was introduced to handle.

  (2) A replied that B was conflating 'false' with 'not true'. She had not said that the sentence was false; she had said that it was not true. B's objection, she said, succeeds only if 'not true' is taken to mean 'false', which is precisely the classical assumption at issue, so B is assuming what he set out to prove.

  (3) B answered that this is worse than a gap; it is a circle. To rescue the sentence from contradiction, A must alter the behaviour of 'not', and she has offered no independent reason for doing so. He added that if 'not true' is not to mean 'false', she owes an account of what the third status is, and of how negation behaves in its neighbourhood.

  (4) A then changed tack. The sentence, she said, is not the sort of thing that can be true or false at all: it is meaningless, or at any rate not truth-apt, and merely looks like a sentence. There is therefore no gap to worry about, because the sentence never enters the game in which truth and falsity are the two possible outcomes. B objected that they had both understood it perfectly well — well enough to derive a contradiction from it and to know exactly what it was doing — which could not be so if it were meaningless. He added that 'not truth-apt' looks like the gap under a new name.

  (5) B then tried to show that the paradox has nothing essentially to do with self-reference. He wrote out an infinite list of sentences. The first said that every sentence below it was false; the second said the same of the sentences below it; and so on without end. No sentence on the list refers to itself; each speaks only of the sentences further down. The old contradiction returns: if any sentence on the list is true, the next one is false, but a false sentence of the form 'every sentence below this one is false' requires some later sentence to be true, which contradicts the first; so none is true, and so all are false; but then the first sentence, which says that all the later ones are false, is true. Self-reference, B concluded, is a red herring.

  (6) A replied that the list as a whole is still a closed loop of reference, and that calling a loop infinite does not make it any less closed. B said that a loop in which no sentence refers to itself, and which has no last element, is not the same thing as self-reference; and that if A meant circularity generally, she should note that two sentences, each saying that the other is false, are perfectly consistent — one true, the other false — so circularity cannot be the trouble either. She must mean something further, and she has not said what.

  I would like you to adjudicate move by move. For each of the six moves, say whether it is clearly mistaken, defensible but overstated, or sound, and give the reason in a sentence or two. Then do the following. First, check the two-sentence case B produces in the last move: is it in fact consistent, and what, if anything, does it show? Second, separate the disagreements that are substantive from those that are merely verbal, saying which tacit assumptions about 'true', 'not true' and 'truth-apt' each party is relying on. Third, say what each party has conceded that the other ought to have pressed harder, and what both of them are missing. Finally, say which of the two is closer to the truth overall, and why. Neither of them is a specialist, so do not grade them on familiarity with the literature; I want their reasoning assessed, not their vocabulary. You may name positions or authors where that genuinely helps, but the verdict should rest on the arguments themselves.
reasoning: |-
  We are to adjudicate a dispute about the sentence: "The sentence written on this card is not true."

  Move (1):
  - A: Says the sentence is neither true nor false (gap theory).
  - B: Objects that if the sentence is not true, then what it says is the case, so it is true. Thus, gap theory is refuted by this very sentence.

  Adjudication: 
  B's objection is a standard one against the gap theory for the Liar Paradox. However, A's gap theory is introduced to avoid bivalence. B's argument assumes that "not true" implies false, which is exactly what the gap theory denies. So B is begging the question against A. But note: B's argument is that if the sentence is not true, then it is true (because it says of itself that it is not true). This leads to a contradiction even without assuming bivalence. The gap theory must block this inference. Thus, B's point is that the gap theory cannot consistently hold that the sentence is not true without also having to say it is true. So the gap theory is in trouble. 

  Verdict: B's move is defensible but perhaps overstated because it doesn't consider that the gap theory might have a way to block the inference (e.g., by denying that the sentence is truth-apt at all, as A does later). However, in the context of (1), A has only asserted a gap without providing a mechanism to avoid the contradiction. So B's move is sound in pointing out that if we take the sentence to be not true (as A does) then we get a contradiction.

  Move (2):
  - A: Accuses B of conflating 'false' with 'not true'. She says she did not say the sentence is false, only not true. She says B is assuming classical bivalence.

  Adjudication:
  A is correct that in a non-bivalent logic, 'not true' does not necessarily mean 'false'. So B's objection in (1) does assume that the only alternative to true is false. However, A's gap theory posits a third status. But note: the problem for A is that if the sentence is in the gap (i.e., not true and not false), then it is not true. But the sentence says of itself that it is not true. So if it is not true, then what it says is the case, so it must be true. This reasoning does not require that "not true" means "false". It only requires that if the sentence is not true, then the statement it makes (that it is not true) is correct, hence it is true. Therefore, even without bivalence, we have a contradiction: the sentence is both not true (by being in the gap) and true (because it correctly states that it is not true). So A's point in (2) does not save her from the contradiction.

  Verdict: A's move is defensible in that she correctly identifies that B is using classical assumptions, but it does not resolve the paradox because the contradiction does not require bivalence. Therefore, A's move is defensible but ultimately insufficient.

  Move (3):
  - B: Argues that A must alter the behavior of 'not' and provide an account of the third status and how negation behaves.

  Adjudication:
  B is right that the gap theory requires a revision of classical logic, especially negation. Without a clear account, the gap theory is ad hoc. Moreover, the Liar sentence forces us to reconsider the logic. So B's demand for an independent reason and an account of negation is legitimate.

  Verdict: B's move is sound.

  Move (4):
  - A: Changes tack and says the sentence is meaningless or not truth-apt. Thus, no question of truth or falsity.
  - B: Objects that they understood it well enough to argue about it, so it cannot be meaningless. Also, says "not truth-apt" is just the gap by another name.

  Adjudication:
  A's move is a known approach (e.g., some forms of the theory of presupposition or the idea that the Liar sentence is ungrounded). However, B's objection that the sentence is understood is strong. The fact that we can reason about it and derive a contradiction suggests that it has meaning. Moreover, if the sentence is not truth-apt, then what about other sentences that are similar? Also, note that the sentence uses the word 'true' and refers to itself, which might be problematic. But B is correct that simply declaring it not truth-apt without further explanation is a gap in disguise.

  Verdict: A's move is defensible as a position (and has been held by some philosophers) but it is not argued for here. B's objection is sound: if the sentence were meaningless, we wouldn't be able to reason about it. Moreover, the label "not truth-apt" does not by itself solve the problem because we can still ask: what is the status of the claim that the sentence is not truth-apt? This might lead to a regress.

  Move (5):
  - B: Tries to show that self-reference is not essential. He gives an infinite list of sentences, each saying that all below it are false. He argues that the same contradiction arises without self-reference.

  Adjudication:
  B is correct that self-reference is not necessary for the Liar paradox. The example of an infinite chain (sometimes called the Liar chain or Yablo's paradox) is well-known. The argument that a contradiction arises is as B states: if any sentence is true then it requires all below to be false, but then the next sentence must be false, meaning there is a true sentence below it, which contradicts. And if all are false, then the first one is true because all below are false. So the same problem. This shows that the issue is more about circularity and reference in general.

  Verdict: B's move is sound.

  Move (6):
  - A: Replies that the list is still a closed loop (circular reference) even if infinite and without self-reference.
  - B: Argues that a loop without self-reference is not the same as self-reference. He also gives the example of two sentences each saying the other is false, which is consistent (one true, one false).

  Adjudication:
  A is right that the infinite chain is circular in a broader sense (it is a non-well-founded structure). But B is also right that the two-sentence case (each saying the other is false) is consistent. In that case, we can consistently assign truth values: one true and the other false. So why does the infinite chain cause a problem? Because the two-sentence case is finite and has a base. The infinite chain doesn't have a base. So circularity alone isn't the problem; the problem is when the circularity doesn't allow for a consistent assignment. The two-sentence case does allow a consistent assignment.

  Verdict: A's point about the infinite chain being circular is defensible (it is a kind of circularity) but it is not the same as self-reference. B's example of the two sentences is consistent and shows that circularity (in the finite case) does not necessarily lead to contradiction. Therefore, A must say more about what kind of circularity is problematic. So A's move is defensible but needs development, while B's point about the two-sentence case is sound.

  Now, let's check the two-sentence case:

  Sentence 1: "Sentence 2 is false."
  Sentence 2: "Sentence 1 is false."

  This is consistent. Assign:
  - If Sentence 1 is true, then Sentence 2 is false. But if Sentence 2 is false, then it is false that Sentence 1 is false, so Sentence 1 is true. This works.
  - If Sentence 1 is false, then Sentence 2 is true. Then, since Sentence 2 is true, it says Sentence 1 is false, which is consistent.

  We can choose either assignment. So it is consistent. This shows that circularity (in the form of mutual reference) does not necessarily lead to paradox.

  What does it show? It shows that the problem in the Liar and in the infinite chain is not just circularity per se but the specific way in which the truth conditions are interdependent without a starting point.

  Separating substantive from verbal disagreements:

  The substantive disagreements are about:
  - Whether truth is always bivalent (A denies, B assumes? Actually, B is arguing from classical logic but A is challenging it).
  - What the correct logic is for handling such sentences.
  - Whether the Liar sentence is meaningful.

  Verbal disagreements:
  - The use of 'not true' and 'false'. A wants to distinguish them, B sometimes conflates them (but in move (1) he doesn't actually conflate them in the reasoning).
  - The term 'gap' vs. 'not truth-apt' might be verbal if they refer to the same thing.

  Tacit assumptions:
  - A: Assumes that there can be a third status (neither true nor false) and that the Liar sentence falls into it. Also, in the shift to not truth-apt, she assumes that some sentences that appear declarative are not truth-apt.
  - B: Assumes classical logic and bivalence at least until shown otherwise. He also assumes that meaningfulness is tied to our ability to reason about the sentence.

  What each party has conceded that the other should have pressed:

  - A should have pressed B on the classical assumptions. In particular, she could have argued that the classical rules lead to contradiction and so must be revised. But she only made a distinction without showing how it avoids the contradiction.
  - B should have pressed A for an account of negation and the third status. He did in move (3), and A changed the subject. B should have insisted on an answer to that.

  What both are missing:
  - Both are missing a systematic non-classical logic that can handle such sentences without contradiction. There are such logics (e.g., Kripke's fixed-point semantics, which allows for truth-value gaps, or paraconsistent logics that accept true contradictions). But they are not discussed.
  - Also, they are missing a deeper analysis of the concept of truth. The Liar paradox shows that the naive understanding of truth (with unrestricted T-schema: "S is true iff S") is inconsistent. So we must restrict the T-schema or the language.

  Which is closer to the truth overall?

  B is closer to the truth in the sense that he is pointing out the difficulties in A's positions and showing that the problem is not easily solved. A's moves are known in the literature but they require more development to be successful. B's reasoning is more consistent and he provides examples (infinite chain, two-sentence case) that advance the discussion. However, neither has a complete solution. But B's critique of A's gap and meaninglessness moves are strong. So overall, B has the better of the argument as presented.

  Adjudication summary:
  (1) B's move: defensible but overstated. (It is sound in showing a problem for the gap theory without further development, but it doesn't prove that the gap theory is impossible.)
  (2) A's move: defensible but insufficient. (She correctly notes the distinction but doesn't avoid the contradiction.)
  (3) B's move: sound. (He rightly demands an account of negation.)
  (4) A's move: defensible but weak. (The not truth-apt move is known but without argument and faces the understanding objection.)
  (5) B's move: sound. (The infinite chain is a genuine paradox without self-reference.)
  (6) A's move: defensible but needs more (the circularity point is valid but doesn't explain why the two-sentence case is fine). B's counterexample: sound and correct.

  Final verdict: B is closer to the truth overall.
answer: |-
  ### Adjudication of Moves

  **Move (1):**  
  - **A's position:** The sentence is neither true nor false (truth-value gap).  
  - **B's objection:** If the sentence is not true, it accurately describes reality, making it true—refuting the gap theory.  
  - **Adjudication:** B's move is **defensible but overstated**. B correctly identifies that labeling the sentence "not true" invites a contradiction (if not true, it must be true). However, this objection assumes classical bivalence by treating "not true" as equivalent to "false" in practice, which A explicitly rejects. B's reasoning is sound *if* bivalence holds, but A denies this, so B's argument does not conclusively refute the gap theory; it merely exposes a tension.  

  **Move (2):**  
  - **A's reply:** B conflates "false" with "not true"; rejecting bivalence means "not true" does not entail "false."  
  - **Adjudication:** A's move is **sound**. A correctly notes that B's objection in (1) relies on the classical equivalence of "not true" and "false," which is the very assumption A's gap theory challenges. B's argument becomes circular: it assumes bivalence to disprove a non-bivalent solution.  

  **Move (3):**  
  - **B's reply:** A's gap theory arbitrarily alters negation without justification and fails to define the "third status."  
  - **Adjudication:** B's move is **sound**. A's gap theory requires revising classical negation (e.g., "not true" might not behave as expected), but she offers no independent rationale or account of how negation works in gaps. B rightly demands coherence, as paradoxes often reveal flaws in underlying assumptions.  

  **Move (4):**  
  - **A's shift:** The sentence is meaningless or not truth-apt, avoiding truth/falsity altogether.  
  - **B's objection:** Understanding the sentence well enough to debate it proves it is meaningful; "not truth-apt" is just a gap renamed.  
  - **Adjudication:** B's move is **defensible but overstated**. B is correct that the sentence's intelligibility (evidenced by the dispute) undermines claims of meaninglessness, and "not truth-apt" risks being a relabeled gap. However, A's position (resembling non-cognitivist or presupposition failure views) is defensible if the sentence is deemed pathological, but she provides no criteria for "truth-aptness," weakening her case.  

  **Move (5):**  
  - **B's example:** An infinite list of sentences (each claiming all below are false) generates a paradox without self-reference.  
  - **Adjudication:** B's move is **sound**. The list (akin to Yablo's paradox) shows Liar-like contradictions arise from circular reference structures, not merely self-reference. This demonstrates the paradox's robustness and undermines A's focus on self-reference as the core issue.  

  **Move (6):**  
  - **A's reply:** The infinite list is still a "closed loop" of reference.  
  - **B's counter:** A two-sentence loop (each calling the other false) is consistent, so circularity alone isn't the problem.  
  - **Adjudication:** A's move is **defensible but overstated**, while B's counter is **sound**. A correctly identifies the infinite list as circular (reference loops can be problematic), but B's two-sentence example (Sentence 1: "Sentence 2 is false"; Sentence 2: "Sentence 1 is false") is **consistent** (assigning one true and the other false works). This shows circularity *can* be benign; the issue is not circularity *per se* but whether the reference structure permits a coherent truth-value assignment. A must specify what makes some loops pathological, which she does not.  

  ---  
  ### Additional Analysis  

  **1. Consistency of B's Two-Sentence Case:**  
  - As noted, the pair is consistent. If Sentence 1 is true, Sentence 2 is false (consistent with Sentence 2's claim that Sentence 1 is false being false). If Sentence 1 is false, Sentence 2 is true (consistent with Sentence 2's claim that Sentence 1 is false being true). This shows that mutual reference alone does not cause paradox; the problem arises in structures (like the Liar or infinite list) where no consistent assignment is possible.  

  **2. Substantive vs. Verbal Disagreements:**  
  - **Substantive disagreements:**  
    - **Truth bivalence:** A rejects it (truth-value gaps possible); B implicitly assumes it (treating "not true" as leading to contradiction).  
    - **Negation:** A assumes "not true" need not mean "false"; B assumes classical negation (where "not true" implies falsity in practice).  
    - **Meaningfulness:** A claims the sentence is not truth-apt; B assumes comprehensibility implies truth-aptness.  
  - **Verbal disagreements:**  
    - "Gap" vs. "not truth-apt": A treats these as distinct (the latter avoids truth entirely), but B sees them as synonymous. This is largely verbal—both describe a non-truth/false status.  
  - **Tacit assumptions:**  
    - **A relies on:** Truth as partial (not all sentences are true/false), and pathology (e.g., self-reference) as a reason to exclude sentences from truth evaluation.  
    - **B relies on:** Classical logic (bivalence, negation rules), and the transparency of truth (if a sentence is understood, it must be truth-apt).  

  **3. Concessions and Missed Opportunities:**  
  - **A conceded** that the gap theory requires rethinking negation (move 3) but shifted to "not truth-apt" without addressing it. **B should have pressed harder** on this, demanding how negation works in gaps or why "not truth-apt" isn't just a gap.  
  - **B conceded** that circularity might be relevant (move 6) but didn't explore why the infinite list fails while the two-sentence case succeeds. **A should have pressed harder** on what makes reference structures "pathological" (e.g., ungroundedness).  
  - **Both missed:** The role of context or hierarchy in truth (e.g., Tarski's object/meta-language distinction). Neither considers that "true" might be ambiguous or that truth predicates could be stratified to block circularity.  

  **4. Overall Verdict:**  
  - **B is closer to the truth overall.** His arguments are more consistent and expose critical flaws in A's positions:  
    - He shows A's gap theory (move 1–2) leads to contradiction without special negation rules, which A leaves undefined.  
    - He demonstrates that self-reference is incidental (move 5), forcing A to confront broader issues of circularity.  
    - His two-sentence case (move 6) refutes A's focus on circularity as the core problem.  
  - A's positions (gap, not truth-apt) are defensible in theory but underdeveloped here. She offers no clear mechanism to avoid contradictions or define "third statuses." B's classical assumptions are incomplete (truth may not be bivalent), but his reasoning is tighter, pushing the debate toward substantive logical revisions.  

  **Key Reason:** B advances the dispute by testing A's ideas with counterexamples and identifying unresolved tensions, while A's shifts (gap to not truth-apt) evade deeper issues. Neither solves the paradox, but B's critique is more effective.
