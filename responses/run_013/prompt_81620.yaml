  ## Dialogue: The Weight of Omnipotence

  **Setting:** A dimly corner booth in the Grad Student Pub, three empty pint glasses between them. Rain streaks the window. MARA (early 30s, precise gestures, leans forward intently) and LEO (mid-30s, restless energy, taps the table lightly) are locked in.

  **Mara:** ...so it’s *not* that God *can’t* lift the stone, Leo. It’s that the phrase "make a stone too heavy for an omnipotent being to lift" doesn’t designate a *possible action*. It’s like telling a grandmaster to castle his rook sideways. We don’t fault the grandmaster for lacking the power to violate the game’s constitutive rules; that’s not a *weakness*, it’s what *makes* him a grandmaster *at chess*. Omnipotence is relative to the nature of the being possessing it – it means God can do anything *consistent* with being the kind of being God *is*.

  **Leo:** (Sighs, runs a hand through his hair) That’s the shell game, Mara. You define God’s nature such that anything seemingly impossible gets shoved *into* that nature, making it *ex hypothesi* non-doable. Then ‘omnipotence’ just collapses into ‘can do whatever’s logically possible *for God*’. But a *rock* can do whatever’s logically possible *for a rock*. Is a rock omnipotent? You’ve preserved the *word* by gutting the *meaning*. Maximal power has to mean power *over* the modal landscape, not power *defined by* a pre-fenced-off corner of it.

  **Mara:** No, it means maximal power *simpliciter*, but power is *always* nature-relative! Does a unicorn lack power because it can’t have a horn made of *anti*-matter? The concept of a unicorn horn *requires* horn-ness. Asking God to create a stone too heavy for *Him* to lift is asking Him to create an object whose defining property *contradicts* the very concept of His own omnipotence – it’s not a task, it’s gibberish disguised as a task. Your ‘maximal power over everything’ ignores the fact that possibilities aren’t free-floating; they’re tethered to the natures that ground them.

  **Leo:** But *who* tethers them, Mara? If it’s God’s *own* nature, then isn’t He fundamentally constrained *by* that nature? That’s the voluntarist core: power means God could, in principle, have constituted reality – including His own nature – differently. You’re smuggling in a *necessary* nature that just *is*, independent of divine will, and *then* defining omnipotence relative to *that*. It makes God a prisoner of His own essence.

  **Mara:** Necessary existence isn’t a *prison*; it’s *what* God is. You’re confusing ‘unconstrained’ with ‘arbitrary’. God isn’t *less* free because He can’t cease to be good; goodness *is* His freedom actualized. We don’t say God lacks power because He can’t sin or make 2+2=5. Those aren’t genuine inabilities; they’re markers of perfection. Why is this different?

  **Leo:** Because self-limitation *is* a power! Consider this: Can God make Himself *not* omnipotent? Not just lose a fight or get weakened by something else, but *choose*, freely, to lay down omnipotence entirely and become a finite being from that moment forward? Describe that: "A being, previously omnipotent, freely relinquishes all infinite power, becoming permanently finite." Is that *logically* contradictory? I don’t see it. It seems perfectly coherent. So, by *my* lights – maximal power over existence – it *should* be possible. If God *can’t* do it, then there’s something describable, coherent, and non-contradictory that He *cannot* do. That’s a genuine limit, full stop.

  **Mara:** (Leans back, eyes sharp) Ah, the late-night special. It *looks* coherent, but it’s the same pseudo-task as the stone, just reflexively applied. ‘God lays down omnipotence’ presupposes God *could* exist without being God. But ‘God’ *means* the necessarily existent, essentially omnipotent, omniscient, perfect being. ‘God stops being God’ isn’t a state change; it’s nonsense. It’s like asking if the number three could decide to be prime *and* composite. The action you describe *requires* God to cease being the subject capable of *being* God while performing it. It’s self-referential annihilation disguised as an option.

  **Leo:** But that’s precisely the voluntarist point! You’re defining God’s essence as *immutable*. Fine, but *why* must it be? Why couldn’t God’s essence *include* the potential for self-diminishment? If omnipotence is real power, shouldn’t it encompass the power to *limit* oneself? Your view makes God’s nature a cage He Himself didn’t build and can’t escape. ‘Can’t stop being God’ sounds like the ultimate inability, Mara. An eternal, necessary constraint.

  **Mara:** You’re conflating *power* with *independence from essence*. God’s power *is* the expression of His necessary essence. His inability to *not* be God isn’t a *constraint*; it’s the logical corollary of being the ground of all possibility. What you call an inability is the flip side of aseity. Besides, remember the older distinction: *de potentia absoluta* vs. *de potentia ordinata*. Considered absolutely, in Himself, God *could* have willed different natures, different logics... but having willed *this* reality with *this* necessary divine nature, He is now ‘bound’ by His own consistent will and nature. What you propose – laying down omnipotence – isn’t an action *within* the ordained system consistent with His nature.

  **Leo:** (Leans forward, finger pointing slightly) But that just relocates the shell game! You say ‘considered absolutely’ He *could* have set things up differently, meaning He *had* that power *before* ordaining this nature. But what *was* that power? Was there a ‘pre-essence’ God who had maximal power *without* your nature-relativity? If He *did* have that absolute power to ordain *any* nature, including one where He could later diminish Himself, then why can’t He exercise a *vestige* of that absolute power *now* to alter His *current* ordained nature? If He *never* had that ‘absolute’ power, then your distinction is just words. And if He *did*, then my scenario *is* coherent within the system, as a potential ordained-but-not-currently-exercised power He retains. You can’t have it both ways.

  **Mara:** No, the distinction *is* consistent. *De potentia absoluta* refers to logical possibilities *prior* to any act of divine will – possibilities that might involve entirely different frameworks of necessity. But *having willed* this specific necessary being – God – into actuality, *that being* has a fixed essence. The ‘power’ to have willed differently isn’t a power *possessed by* the God of *this* reality; it’s a counterfactual about the origin of modal space itself. The God who *exists* is essentially who He is. Asking *this* God to lay down omnipotence is asking *this* God to perform an action that negates the subject performing it – it dissolves the agent. It’s not an action *He* can take; it’s the end of *Him*.

  **Leo:** Then let’s test the boundary with something less extreme. Can God create a *second* omnipotent being? Distinct from Himself, but equally all-powerful? Is *that* a coherent action? It seems describable: "God creates another entity possessing all the powers God possesses." If He *can*, then omnipotence isn’t unique to His nature. If He *can’t*, then creating another omnipotent being is something God *cannot* do. Is that off the table too because it’s ‘inconsistent with His nature as the sole necessary ground’? Or is it a genuine limit?

  **Mara:** (Pauses, thinking) It’s subtle. If omnipotence *means* having all power, then two beings *each* having all power seems contradictory – they couldn’t will opposing states. One would have to ‘win’, implying the other lacked the power to make their will actual. So, creating a *genuinely* co-equal, co-omnipotent being seems impossible, a contradiction in terms, not a task God fails at. He could create a being with vast powers, perhaps even *nearly* all power relative to creation, but not *absolute* omnipotence identical to His own. That limitation stems from the logic of ‘all power,’ not a defect in God.

  **Leo:** See? You keep drawing circles around the impossible, defined *by* God’s nature as you conceive it. The stone, self-diminishment, creating a true equal – all ruled out as pseudo-tasks or contradictions. But each ruling-out reinforces that God’s power is fundamentally *defined* by limits inherent in His essence. My voluntarism says: reject those inherent limits. God’s power is primary; His nature is *what He wills it to be*, consistently or not. The stone case *exposes* that tension: if ‘making an unliftable stone’ is coherent (and I think it is), then either God *can* make it (and then can’t lift it, limiting power) or *can’t* make it (limiting power). I bite the bullet: God cannot make a stone He cannot lift, and *that* is a genuine, though logical, limitation on maximal power. It doesn’t make Him weak; it makes logic a boundary even for God. Your essentialism avoids the bullet by denying the stone is a real thing He *could* be asked to make. I think you’re denying the reality of the question.

  **Mara:** And I think you’re mistaking grammatical possibility for metaphysical possibility. ‘Unliftable stone for omnipotent being’ *sounds* like a phrase, but it smuggles in a contradiction that renders it empty. It asks God to create an object defined by its ability to limit the unlimited. That’s not a *thing*; it’s a trick of language. Recognizing that *isn’t* denying a real limit; it’s recognizing the incoherence of the proposed limit. God’s ‘inability’ here is like the grandmaster’s ‘inability’ to castle sideways – a testament to the structure within which genuine power operates, not a lack of it.

  **Leo:** But your structure feels arbitrary! Why *this* structure? Why *this* necessary nature? My point about self-diminishment stands: if God *could* have ordained a nature that allowed for self-alteration, and if He truly has maximal power, why *can’t* He enact a profound self-limitation *within* this ordained order? Why is ‘God ceases to be omnipotent’ incoherent, but ‘God becomes incarnate as a finite human’ isn’t? Both involve limitations assumed voluntarily.

  **Mara:** Incarnation involves assuming *additional* limitations without ceasing to *be* God. Laying down omnipotence *entails* ceasing to be God. It’s the difference between adding a role and annihilating the core self. One is an act *of* God; the other is the termination *of* God as agent. The latter isn’t an action *He* performs; it’s His cessation. You keep asking God to perform the ontological equivalent of pulling Himself up by His own bootstraps and then vanishing.

  **Leo:** (Takes a long sip of water, staring at the table) Fine. Maybe it’s termination. But is the power to *choose* termination – even self-annihilation – not the ultimate expression of sovereignty? If His nature forbids it absolutely, then His nature is the master, not His will. That’s the rub, Mara. For me, true maximal power implies authority even over the self’s deepest constitution. For you, true maximal power is inseparable from and expressed *through* an immutable, necessary essence. I see your essentialism as protecting coherence at the cost of ultimate divine freedom over self-definition. You see my voluntarism as demanding incoherent feats to preserve an abstract notion of ‘no limits’ that ultimately undermines divine simplicity and aseity.

  **Mara:** Pretty much. We’re circling the same ontological drain. The stone, the self-diminishment, the second God… they all probe whether the modal limits we hit are *imposed* on God or *constitutive* of Him. I see them as constitutive. You see them as imposed, even if only by logic itself.

  **Leo:** And logic is… what? Created? Discovered? Necessary but separate? *(He shrugs, a gesture of exhausted stalemate)* Pass me the peanuts. I think we just defined the abyss. Again. Cheers.

  **Mara:** (Taps her glass against his water tumbler, a wry smile) To the abyss. Where all good philosophy ends up after last call. Let’s get the bill. My round next time… assuming we still exist as coherent agents by then.

  **(Word Count: ~1450)**

  **Key Points Covered:**
  *   **Nature-Relative Omnipotence (Mara):** Emphasizes coherence within divine nature (Grandmaster/Unicorn analogies), rejects pseudo-tasks.
  *   **Maximal Power Over Existence (Leo):** Sees essentialism as defining away limits, argues "can do whatever is describable/coherent" (rock analogy).
  *   **The New Case (Self-Diminishment):** Leo argues coherence makes it possible, exposing a limit if God can't. Mara argues it's ontological nonsense, dissolving the agent.
  *   **Inability vs. Perfection:** Mara links inability to sin/error to perfection. Leo distinguishes them, seeing self-alteration as a unique power.
  *   ***De Potentia Absoluta/Ordinata*:** Mara uses it to separate counterfactual origins from current essence. Leo argues it relocates the problem or is vacuous.
  *   **Second Omnipotent Being:** Explored as a boundary case, leading back to core disagreement about the nature of omnipotence and possibility.
  *   **Core Stalemate:** Is God's nature constitutive of possibility (Mara) or is God's power sovereign even over His own essence (Leo)? Neither concedes ground; the fundamental metaphysical rift remains.
