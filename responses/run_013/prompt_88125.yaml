  ### Scenario Setup
  Two researchers, Dr. Aria (A) and Dr. Ben (B), negotiate over lab equipment usage for a critical project. The equipment is available for 100 hours this month. Aria gains 50 utils per hour (high-value experiments), while Ben gains 100 utils per hour (lower-value diagnostics). Without agreement, each gets 20 hours (yielding 1,000 utils for Aria, 2,000 for Ben). Due to scheduling limits, Aria cannot use >60 hours, Ben cannot use >80 hours, and total hours cannot exceed 100. Risk-neutral and no utility comparisons apply.

  ### Formal Elements
  - **Feasible set \( S \)** (convex, from capacity constraints):  
    \( u_A \in [1,000, 3,000] \), \( u_B \in [2,000, 8,000] \), and \( 2u_A + u_B \leq 10,000 \).  
  - **Disagreement point \( d \)**: \( (1,000, 2,000) \).  
  - **Ideal point \( a \)**: \( (3,000, 8,000) \) (Aria’s max given Ben’s min, and vice versa).  
  - **Kalai-Smorodinsky (KS) solution**: \( (2,200, 5,600) \).  
  - **Nash solution**: \( (2,500, 5,000) \).  

  ### Solution Derivation
  - **KS solution**: Lies on the ray from \( d \) to \( a \), with direction \( (3,000 - 1,000, 8,000 - 2,000) = (2,000, 6,000) \). Parametrize as \( u = (1,000 + 2,000t, 2,000 + 6,000t) \). Intersect with Pareto frontier \( 2u_A + u_B = 10,000 \):  
    \( 2(1,000 + 2,000t) + (2,000 + 6,000t) = 10,000 \) → \( t = 0.6 \) → \( KS = (2,200, 5,600) \).  
  - **Nash solution**: Maximizes \( (u_A - 1,000)(u_B - 2,000) \) on \( 2u_A + u_B = 10,000 \). Substitute \( u_B = 10,000 - 2u_A \):  
    Maximize \( (u_A - 1,000)(8,000 - 2u_A) \). Derivative w.r.t \( u_A \): \( 10,000 - 4u_A = 0 \) → \( u_A = 2,500 \) → \( u_B = 5,000 \).  

  ### Key Divergence and Feasible Set Role
  - **Divergence**:  
    - Ben’s *ideal gain* is larger (\( 8,000 - 2,000 = 6,000 \) vs. Aria’s \( 3,000 - 1,000 = 2,000 \)).  
    - KS gives Ben *larger absolute gain*: \( 5,600 - 2,000 = 3,600 \) (KS) > \( 5,000 - 2,000 = 3,000 \) (Nash).  
    - Nash gives Aria *larger fraction of ideal gain*: \( (2,500 - 1,000)/2,000 = 75\% \) (Nash) > \( (2,200 - 1,000)/2,000 = 60\% \) (KS).  
  - **Feasible set feature**: The constraint \( 2u_A + u_B \leq 10,000 \) (from asymmetric utility scales and capacity) skews the Pareto frontier. Removing this asymmetry (e.g., equal utils/hour) would align the solutions.  

  ### Axiomatic Critiques
  - **Nash defender attacks KS**: Violates *independence of irrelevant alternatives* (IIA). If \( S \) shrinks to a subset containing \( d \), KS, and Nash, KS may shift arbitrarily while Nash stays fixed.  
  - **KS defender attacks Nash**: Violates *individual monotonicity*. If Ben’s max hours increase (expanding \( S \) and his ideal point), Nash may not improve Ben’s utility proportionally, while KS does.  

  ### Pedagogical Purpose
  This case demonstrates that **KS prioritizes proportional gains relative to ideal potentials** (favoring parties with larger possible gains), while **Nash prioritizes balanced mutual gains** (favoring parties with smaller ideal gains in fractional terms). The choice between them hinges on whether negotiators value equity in potential (KS) or immediate compromise (Nash), guided by axiomatic commitments.
