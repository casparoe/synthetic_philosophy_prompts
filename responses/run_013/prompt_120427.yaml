  Hmm, the user is a novelist grappling with a philosophical inconsistency in regulatory economics for their character. They've noticed that agencies use revealed preferences (wage-risk tradeoffs) to value life in cost-benefit analyses, yet ban other voluntary exchanges like organ sales or unsafe work. The core tension is between two state behaviors: treating risk-money choices as authoritative in regulations but paternalistically overriding similar choices elsewhere.

  The user needs help articulating what theory of value underpins this practice. They suspect it's preference-satisfaction utilitarianism but want confirmation on whether it strictly requires that theory or just fits it, and which alternatives it excludes. They also ask if the same theory can justify the bans (probably not), implying the state might have a two-tier system of preferences. Finally, they wonder how substituting experiential welfare or addressing poverty would change regulations.

  The character's job involves translating lives into dollars via statistical value of life calculations - an emotionally complex task perfect for fiction. The user likely wants to explore their character's moral conflicts through this lens. Beyond surface theory, they're probing how institutions rationalize valuing life inconsistently. This isn't academic - it's about giving their character intellectual scaffolding for her existential unease.

  The revealed preference approach strictly requires that choices = welfare because it has no other data. Alternatives like experiential welfare (how life feels) or objective goods are incompatible since they reject choice as the metric. The bans, however, imply doubt about choice quality - suggesting a tiered system where "real" preferences (like safety needs) override expressed ones when coercion or ignorance is suspected. But the state never admits this hierarchy, creating hypocrisy.

  Switching to experiential welfare would collapse cost-benefit analyses - you can't measure felt experience via wage premiums. Accounting for poverty would require weighting benefits toward the poor, violating the current model's neutrality. Both would make regulations less industry-friendly. That's the buried tension: the system uses market logic where convenient but suspends it when outcomes feel wrong, exposing unspoken limits of economism.
answer: |-
  The regulatory pricing practice strictly presupposes that individual welfare consists solely in the satisfaction of revealed preferences – what people *choose* indicates what is good for them, and the monetary value they accept for small risk increments is the definitive measure of that good's worth.

  This practice *requires* this revealed preference theory of welfare. It cannot function without treating observed choices as the authoritative source of value. It explicitly rules out rival accounts:
  1.  **Experiential Welfare Theories (Hedonism/Feelings):** If welfare is how life feels, choices (especially under duress or ignorance) might not reflect true experiential benefit. The practice ignores subjective states, relying solely on behavior.
  2.  **Objective List Theories:** If welfare includes objective goods like health, autonomy, or knowledge independent of preference, the practice is invalid. It assumes safety's value *is* determined *only* by what people trade for it.
  3.  **Perfectionist Theories:** These judge welfare based on fulfilling human potential, which may contradict actual choices (e.g., someone choosing risky work might be seen as failing to flourish). The practice rejects such judgments.
  4.  **Theories Rejecting Choice as Metric (e.g., Capability Approach):** These focus on capabilities (freedoms) rather than choices or utilities. Valuing safety based *only* on wage premiums contradicts this, as it reduces capability to a market transaction.

  The state's refusals (banning organ sales, mandating safety, minimum wage) **cannot** be justified by the *same* revealed preference theory. That theory would logically endorse those voluntary bargains as welfare-enhancing. The state is tacitly employing a **two-tier system**:

  *   **Tier 1 (Revealed Preferences = Welfare):** Applies to small, probabilistic risks in regulated job markets. Choices here are deemed informed enough to reveal true value.
  *   **Tier 2 (Revealed Preferences ≠ Welfare / Overridden):** Applies to transactions involving:
      *   **Desperation/Coercion:** Selling organs or accepting extreme risks/poverty wages is seen as arising from unacceptable background conditions (poverty, lack of alternatives), corrupting choice.
      *   **Irreversible Harm:** Kidney sales or catastrophic injury represent permanent losses of essential capabilities, deemed too grave to be left to individual choice, even if "voluntary."
      *   **Fundamental Rights/Dignity:** These bans often rest on implicit beliefs about bodily integrity or basic human dignity that market choices cannot override.

  **The Principle Drawing the Tiers:** Choices are authoritative *only* when made under conditions deemed "sufficiently free" (not desperate) and involving risks that are "sufficiently small/probabilistic" and not "fundamentally damaging." The boundary is contested and underdetermined – *why* is a 0.001% annual risk increment acceptable for valuation, but selling a kidney is not? The principle relies on societal judgments about acceptable risk and vulnerability that aren't derived from revealed preference itself.

  **Changing the Implicit Theory:**

  1.  **Experiential Welfare (How Life Feels):** The agency could not use wage-risk premiums. It would need direct measures of subjective well-being (happiness, suffering) before and after risk reductions. This is practically difficult (measuring small probabilistic changes in feeling) and conceptually shifts focus from choice to sensation. Rules would be justified if they demonstrably increased net positive experience, irrespective of what people *said* they wanted via wages.
  2.  **Rejecting WTP Due to Poverty:** The agency would need to:
      *   **Weight Benefits:** Assign higher value to risk reductions benefiting poorer populations, recognizing a dollar means more to them.
      *   **Consider Alternatives:** Evaluate if regulations disproportionately burden the poor (e.g., job losses) and seek alternatives.
      *   **Justify Overrides Explicitly:** Acknowledge that low WTP reflects constrained choice, not low value of life/safety. Rules might be justified even if monetized benefits (using unadjusted WTP) didn't exceed costs, based on distributive justice or basic needs.
      *   **Use Alternative Metrics:** Potentially shift towards non-monetary assessments of health equity or capabilities gained.

  Both changes would fundamentally challenge the current practice's reliance on market behavior as the sole arbiter of value.
