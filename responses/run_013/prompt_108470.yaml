  ### Key Implications for Your Spreadsheet
  1. **Cycles are fatal to the ranking**: Leaving one unrevised makes the list incoherent. You must treat them as errors to fix.
  2. **Anomalies demand explicit rules**: Formalize exemptions (e.g., "never fund rights violations") or adjust weights to reflect scope sensitivity—but this may create new inconsistencies.
  3. **The repugnant conclusion is latent**: If you accept transitivity and impersonality, the chain holds. To avoid it, you must modify the moral weights (e.g., steeply discount low well-being) or abandon the single currency.
  4. **Pluralism is possible but costly**: Switching to multiple currencies allows deontology/compassion but loses the simplicity of one threshold. You’d need to define exchange rates and a decision rule (e.g., lexicographic priorities).

  The practice is licensed by *utilitarianism* (if anomalies are errors) or *pluralism with fixed trade-offs* (if anomalies are valid)—but not both simultaneously. Your committee is unwittingly straddling this divide.
