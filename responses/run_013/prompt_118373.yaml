answer: |-
  Here’s your battle plan for the reading group, structured for maximum damage control and strategic concessions. I’ll map objections by likely source, craft tight replies, flag vulnerabilities, and identify the "dreaded question."

  ---

  ### **Preemptive Concession (First 5 Minutes)**  
  **"I concede Sidgwick never explicitly ties psychical research to the *Methods* in print. The link is reconstructive—but it’s grounded in his letters, SPR addresses, and the structural void at the end of the *Methods*. My claim is that psychical research *is* his empirical response to the dualism, even if he didn’t footnote it in Book IV."**  
  *Why?* This disarms purists early. They’ll want blood if you imply the psychical is *in* the *Methods*. Save your textual ammo for the dualism’s unresolved tension.

  ---

  ### **Objections & Replies**  
  *(Ordered by likely sequence/aggressor)*  

  1. **The Sidgwick Purist (Methods Scholar):**  
     *Objection:* "The *Methods* is a closed system of rational ethics. SPR was a private hobby—he kept it separate to preserve philosophy’s rigor. Bringing it in contaminates his project."  
     *Reply (2 min):* "Sidgwick’s own letters call SPR work ‘paramount’ to his life’s meaning post-*Methods*. The dualism’s unresolved tension (*Methods* IX.iv.6) forces an existential choice: abandon rational ethics or find extra-rational grounds. SPR *is* that search—not a hobby, but a necessary empirical bridge for a system he admitted was incomplete without cosmic teleology."  
     *Thin Spot:* No smoking-gun quote *in Methods*. Lean on his 1889 essay "The Pursuit of Culture": ethics depends on "whether the Moral Order is a delusion."  

  2. **The Bayesian Epistemologist:**  
     *Objection:* "Actuarial evidence is just low-probability noise. Aggregating weak testimony doesn’t create a ‘signal’—it amplifies error. Sidgwick should’ve demanded *likelihood ratios*, not headcounts."  
     *Reply (2 min):* "Sidgwick’s 1888 SPR address explicitly rejects ‘forensic’ proof (e.g., séances) in favor of ‘statistical regularity’ precisely to *avoid* base-rate neglect. He’s not naively summing anecdotes—he’s tracking deviations from expected rates of hallucination (Census work). For him, a 0.1% anomaly in 10,000 cases *was* probative because it exceeded chance. That’s proto-frequentist, not Bayesian."  
     *Thin Spot:* Sidgwick lacked modern stats tools. Stress he was innovating *against* séance-chasing contemporaries.  

  3. **The Testimony/Disagreement Epistemologist:**  
     *Objection:* "Testimony in bulk doesn’t solve disagreement—it compounds it. If one medium is caught frauding, why trust *any* witness? Sidgwick ignored the *underdetermination* problem."  
     *Reply (2 min):* "That’s exactly why he prioritized aggregate data! His 1882 SPR Presidential Address says fraud in *individual* cases is predictable noise. The signal must survive when fraud is *discounted* statistically. Disagreement among mediums was a *datum* for him—not a refutation, but a variable to model (see his ‘canons’ for weighing testimony)."  
     *Thin Spot:* Sidgwick never quantified "discounting for fraud." Admit this, but note he systematized error-filtering before error-correcting stats existed.  

  4. **The SPR Emeritus (Your Ally):**  
     *Objection:* "You’re downplaying the séances! Sidgwick investigated Eusapia Palladino for years. He *cared* about individual cases."  
     *Reply (2 min):* "He pursued them, yes—but his letters show frustration with ‘wasted time’ (e.g., to Arthur Balfour, 1894). His epistemology *in theory* centered on aggregates. The séance work was tactical PR for SPR funding and public attention—not his core methodology. Palladino’s exposure disappointed Myers, not Sidgwick, because he expected fraud as background noise."  
     *Thin Spot:* Sidgwick *did* spend time on séances. Concede he hedged his bets but emphasize his *published* canons prioritize bulk data.  

  ---

  ### **The Soft Joint: "Hope Isn’t an Argument"**  
  **Yes, this is your Achilles’ heel.** Expect this from *all* sides.  
  - **Reply:** "It’s not *just* hope—it’s a *methodological imperative*. The dualism creates a rational standoff. Ethics *requires* a non-ethical fact to resolve it (‘Is the cosmos teleological?’). SPR was his *only* empirical tool to hunt that fact. No, hope isn’t proof—but it’s why he built a research program to *replace* hope with evidence."  
  - **Defense:** Quote his 1883 essay "A Lecture on the Ethics of Conformity and Subscription": *"If I am asked ‘Do you believe in God?’ I must answer… I am trying to find out."* SPR was the "trying."  

  ---

  ### **The Dreaded Question (You’re Praying No One Asks)**  
  **"If Sidgwick was so actuarial, why did he *fail* to publish a probabilistic model for SPR data? He left it as anecdotal ledgers—wasn’t that a methodological collapse?"**  

  - **Why it’s deadly:** Impugns his competence. Forces you to admit he never operationalized his "canons."  
  - **Reply (Salvage):** "He died before the Census analysis was complete (published 1894). His model was nascent—but his *direction* was clear: delegate data-gathering (e.g., to Gurney), then seek patterns. Criticize the execution, but the *impulse* was rigorously naturalist: treat spirits as a hypothesis to test via witness statistics, not revelation."  
  - **Sacrifice:** Admit this was SPR’s failure, not Sidgwick’s triumph. Pivot to: "But that failure doesn’t negate that his *motivation* was ethical desperation."  

  ---

  ### **Tactical Summary**  
  - **Minute 0–5:** Concede no explicit *Methods* link. Ground the bridge in dualism + letters.  
  - **Q&A Priority:** Let the SPR emeritus defend you early (he’ll smell blood). Use his energy to tire purists.  
  - **Save Ammo:** Don’t litigate séances. Say: "That’s not my case—I’m arguing his *epistemology* favored aggregates."  
  - **Exit Gracefully:** If gutted on hope→ethics, retreat to: "At minimum, SPR was *symbiotic* with his ethics—one can’t grasp his late-life angst without both."  

  You’re framing Sidgwick as a tragic innovator: an ethicist driven to proto-data-science by philosophy’s limits. That’s defensible—and a hell of a story. Devorah owes you whisky. 🥃
