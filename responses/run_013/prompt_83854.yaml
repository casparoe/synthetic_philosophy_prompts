answer: |-
  Below is a procedural framework designed for your welfare classification officer, refined from your criteria with strict adherence to your non-negotiables: **separating confidence from moral weight** and **avoiding conflating damage registration with negative experience**. The form is structured for speed (20-minute assessments) and forces clear decision points where values-based judgments kick in.

  ---

  ### **Welfare Classification Form (v.3.1)**  
  **Part 1: Site Summary**  
  - Entity Type: _________________________  
  - Population Scale: ☐ Individual ☐ Dozens ☐ Hundreds ☐ Thousands ☐ Millions  
  - Observation Duration: ______ min  

  **Part 2: Sentience Assessment**  
  *(Answer: Y/N/Unclear | Confidence: H/M/L)*  
  1. **Physical Substrate**: Does the entity possess a nervous system, distributed processing network, or equivalent?  
     - *Notes: "Equivalent" = anything that integrates information (e.g., wires, ganglia, data nodes).*  
     - **Answer**: ___ **Confidence**: ___  

  2. **Harm Avoidance Under Cost**: Does the entity avoid previously harmful stimuli *even when avoidance conflicts with a competing drive* (e.g., hunger, efficiency)?  
     - *Notes: Must observe trade-offs (e.g., hunger vs. pain). Reflexive recoil ≠ pass.*  
     - **Answer**: ___ **Confidence**: ___  

  3. **Phenomenal Indication**: Is there behavioral evidence of subjective states (e.g., self-soothing after stress, curiosity, play, or context-dependent responses to identical stimuli)?  
     - *Notes: Focus on behaviors implying internal experience, NOT just reflexes. "Unclear" if ambiguous.*  
     - **Answer**: ___ **Confidence**: ___  

  4. **Future Stake**: Does the entity alter *present behavior* to secure future outcomes (e.g., hoarding, delayed gratification, avoiding future threats)?  
     - *Notes: Instinctual prep (e.g., hibernation) ≠ pass. Must show adaptive flexibility.*  
     - **Answer**: ___ **Confidence**: ___  

  5. **Valenced Signaling (Fallback)**: If all above are N/Unclear, does it have an internal system that *assigns positive/negative values* to stimuli (e.g., reward/punishment circuits)?  
     - *Notes: Must distinguish from simple sensors (e.g., "circuit flags damage" ≠ "bad for entity").*  
     - **Answer**: ___ **Confidence**: ___  

  **Part 3: Tier Assignment**  
  ☐ **Tier 0** (Non-sentient): All criteria N/Unclear.  
  ☐ **Tier 1** (Minimal): Passes **1 + 2** OR **5**.  
  ☐ **Tier 2** (Moderate): Passes **1 + 2 + 3** OR **1 + 2 + 4**.  
  ☐ **Tier 3** (High): Passes **1 + 2 + 3 + 4**.  
  - **Overall Confidence**: H/M/L  
  - **Escalation Triggers**:  
    - Any criterion = Unclear *and* Confidence = L  
    - Conflict between criteria (e.g., Passes 2 but Fails 3)  
    - Population Scale ≥ Thousands *and* Tier ≥ 1  

  **Part 4: Moral Weight**  
  *(Independent of sentience confidence!)*  
  - **Scale Severity**: How bad if misclassified?  
    ☐ Negligible (e.g., wrong on a rock)  
    ☐ Low (e.g., minor discomfort if sentient)  
    ☐ Medium (e.g., significant suffering if sentient)  
    ☐ High (e.g., severe/irreversible harm if sentient)  
    ☐ Extreme (e.g., mass suffering or ethical catastrophe)  
  - **Drivers**:  
    - Harm Intensity: Potential pain depth (shallow → excruciating)  
    - Harm Scope: Population size × individual risk  
    - Reversibility: Can harm be undone?  

  **Part 5: Decision**  
  ☐ **Auto-Tier 0** (No license needed)  
  ☐ **Supervisor Review** (Tier 1-3, or Moral Weight ≥ Medium)  
  ☐ **Regional Panel** (Escalation Trigger hit)  
  - **Officer Notes**: _________________________________________  

  ---

  ### **Key Features Addressing Your Requirements**  
  1. **Confidence ≠ Moral Weight**:  
     - Sentience confidence (Part 2) is siloed from moral weight (Part 4). An entity can be "Tier 1, Low Confidence" with "High Moral Weight" (e.g., larvae farm).  
  2. **"Damage Registration ≠ Bad For It"**:  
     - Criteria 2 and 5 require evidence of *internal valuation*, not just registration. A robot "avoiding damage" fails without proof of conflict (C2) or valence (C5).  
  3. **Values-Based Escalation Points**:  
     - "Equivalent wiring" (C1), "subjective states" (C3), and population-scale conflicts force escalation. These are **values judgments** (e.g., "Is silicon 'equivalent' to nerves?").  
  4. **Population Handling**:  
     - **Tier is per entity type** (e.g., one larvae = all larvae). **Moral Weight** combines tier and population (e.g., "Tier 1 + Millions → Extreme Moral Weight").  

  ---

  ### **Filled Forms for Your Cases**  
  #### **Case 1: Black Soldier Fly Larvae Farm**  
  **Part 1**:  
  - Entity: Larvae | Scale: Millions | Duration: 20 min  

  **Part 2**:  
  1. Physical Substrate: **Y** (ganglia) | Conf: **H**  
  2. Harm Avoidance: **N** (no cost-based avoidance) | Conf: **H**  
  3. Phenomenal: **N** (no behavioral evidence) | Conf: **M**  
  4. Future Stake: **N** | Conf: **H**  
  5. Valenced Signaling: **Unclear** (reflexive withdrawal only) | Conf: **L**  

  **Part 3**:  
  - Tier: **0** (Fails 2,3,4; 5 Unclear) | Overall Conf: **M**  
  - Escalation: **☑** (Scale = Millions + Tier 0)  

  **Part 4**:  
  - Moral Weight: **Extreme** (if sentient, farming causes mass suffering)  

  **Part 5**:  
  - **Regional Panel** (Escalation: Scale + Unclear C5)  

  ---

  #### **Case 2: Warehouse Robot (Fault-Avoidance Circuit)**  
  **Part 1**:  
  - Entity: Robot | Scale: Individual | Duration: 20 min  

  **Part 2**:  
  1. Physical Substrate: **Unclear** (wiring exists, but "equivalent"?)| Conf: **L**  
  2. Harm Avoidance: **Y** (avoids pallet spot despite battery cost) | Conf: **H**  
  3. Phenomenal: **N** (no behavioral evidence) | Conf: **H**  
  4. Future Stake: **N** | Conf: **H**  
  5. Valenced Signaling: **N/A** (skipped—C2 passed)  

  **Part 3**:  
