  I'll recommend upholding the complaint and ordering a new statement that meets the test criteria. I'll address the remedial/expressive distinction by noting that while sincerity matters ethically, the code functionally requires remedial elements. And I'll tackle objections about compelled speech and refusal by emphasizing that the code's requirements exist regardless of reception, as long as the statement is capable of being received.

  The tone needs to be judicious and authoritative, reflecting the quasi-judicial nature of this committee. I'll avoid legalese while maintaining formality, and ensure every recommendation flows logically from the analysis.
answer: |-
  **EDITORIAL STANDARDS COMMITTEE OPINION**  
  **Case Reference: ESC/2024/07**  
  **Complainant: Dr. [Researcher's Name]**  
  **Programme: [Programme Name], Broadcast Date: [Date]**  
  **Date of Committee Deliberation: [Thursday Date]**  

  ### I. FINDINGS OF FACT
  1. The programme segment in question made two substantive statements about the complainant: (a) that her published work was "discredited"; (b) that she was "a campaigner rather than a scientist."  
  2. These statements were made without engagement with her peer-reviewed work.  
  3. The broadcaster subsequently aired a scripted statement: *"There have been claims that our reporting on this was wrong. Mistakes were made, and I’m sorry for the upset this has caused. We’ll do better."*  
  4. This statement followed a confidential legal settlement regarding a threatened defamation action. The broadcaster maintains it concedes neither falsity nor fault.  
  5. The complainant asserts the statement is not an apology and seeks a further on-air correction. The broadcaster contends it has satisfied its obligation and that further action would breach the settlement.  

  ### II. ANALYSIS OF THE CODE  
  The broadcaster’s Code requires that where a complaint is upheld, the broadcaster must **"publish an apology."** Precedent establishes that:  
  - Corrections must (i) identify the specific statement corrected, (ii) state the accurate position, and (iii) reach the original audience (*ESC Ruling 2019-12*).  
  - An apology must be (i) directed to the person wronged and (ii) capable of being received by them (*ESC Ruling 2021-05*).  

  The Code does not define "apology," nor does it distinguish between "remedial" (record-repairing) and "expressive" (emotion-conveying) apologies.  

  ### III. TEST FOR AN "APOLOGY" UNDER THE CODE  
  For a published statement to constitute an **"apology"** under the Code, it must meet all three criteria:  
  1. **Acknowledgment:** Clearly identify the *specific statement(s)* found to be in breach.  
  2. **Responsibility:** Acknowledge the broadcaster’s role in publishing the inaccurate/harmful statement(s).  
  3. **Reparation:** Express regret *for the harm caused by the specific breach* (not general "upset") and, where applicable, correct the factual record.  

  *Rationale:* This flows from the Code’s purpose (upholding accuracy and fairness) and precedent. "Acknowledgment" and "Reparation" align with the specificity required for corrections. "Responsibility" and "Reparation" ensure the statement is directed to the wronged party and capable of meaningful receipt. A "remedial" focus (repairing harm to the complainant’s standing and the public record) is sufficient under the Code; while sincerity of feeling ("expressive" apology) may be desirable, it is not mandated. The Code’s requirement is functional, not psychological.  

  ### IV. APPLICATION OF TEST TO THE AIRED STATEMENT  
  The statement *"There have been claims that our reporting on this was wrong. Mistakes were made, and I’m sorry for the upset this caused. We’ll do better"* **fails** as an apology under the Code:  
  1. **Lacks Acknowledgment:** Does not specify *which* reporting was claimed wrong, *which* mistakes were made, or the *specific statements* about the complainant.  
  2. **Deflects Responsibility:** "Mistakes were made" is passive and non-attributable. It does not acknowledge the broadcaster’s agency.  
  3. **Inadequate Reparation:** Expresses regret for "upset" but not for the *specific harm* caused by labelling her work "discredited" or her a "campaigner." It fails to correct the record.  
  The statement is generic, defensive ("claims that..."), and does not meaningfully address the breach. It is incapable of being received by the complainant as an apology for the specific wrongs suffered.  

  ### V. COMMITTEE DETERMINATION  
  The complaint is **UPHELD IN PART**.  
  - **UPHELD:** Regarding the aired statement’s insufficiency as an apology under the Code.  
  - **DISMISSED:** Regarding the initial substantive accuracy of the segment. The Committee lacks jurisdiction to revisit the settled defamation claim or compel admissions of fault beyond the Code breach.  

  ### VI. REMEDY  
  The broadcaster shall **publish an on-air apology** within **twenty-one (21) days** of this ruling, during the same programme, meeting the following requirements:  
  1. **Acknowledgment:** State the specific programme, date, and the two contested descriptions ("discredited" work; "campaigner rather than a scientist").  
  2. **Responsibility:** State that *the broadcaster* presented these descriptions.  
  3. **Reparation:** State that these descriptions were inaccurate/harmful *in the context of the Code breach*, express regret *to the complainant for the harm caused*, and affirm her standing as a scientist whose published work merits engagement.  
  *Example Structure:* "On [Date], in reporting on [Topic], this programme described Dr. [Name]’s work as ‘discredited’ and called her ‘a campaigner rather than a scientist’ without engaging her published research. This breached our standards for accuracy and fairness. We regret the harm caused to Dr. [Name] by these statements and apologise to her. Scientists like Dr. [Name] deserve to have their work evaluated on its merits."  

  ### VII. ADDRESSING KEY OBJECTIONS  
  1. **"The Remedial/Expressive Distinction is Unworkable":**  
     The distinction *is* workable for Code purposes. The recommended test focuses solely on the *remedial function*: repairing the record and the complainant’s standing. It does not require the broadcaster to express subjective feelings it does not hold ("expressive" apology). The Code mandates repairing harm from the breach, not emoting.  

  2. **"A Compelled Apology Cannot Be Sincere":**  
     Sincerity in an expressive sense is not required by the Code. The obligation is to publish a statement fulfilling the remedial functions of acknowledgment, responsibility, and reparation. Its sincerity, in the expressive sense, is irrelevant to its compliance with the Code. The act of publication itself fulfills the broadcaster’s accountability function.  

  3. **"The Complainant Has Already Refused Uptake; An Apology Needs Uptake":**  
     The Code requires the apology be *capable of being received* by the wronged party (*ESC Ruling 2021-05*), not that it *be* received or accepted. The broadcaster’s duty is to publish a statement meeting the functional criteria (Acknowledgment, Responsibility, Reparation). Whether the complainant accepts it is beyond the broadcaster’s control and does not negate compliance. The remedy outlined above is capable of being received.  

  4. **"This Breaches the Settlement":**  
     The settlement pertains to defamation liability. This ruling addresses compliance with the broadcaster’s *own Editorial Code*. The remedy requires stating facts (what was broadcast, that it breached the Code) and expressing regret *for the harm caused by the breach*. It does not require admitting defamation or fault beyond the Code breach itself. The broadcaster retains editorial control over the precise wording, provided it meets the three criteria.  

  ### VIII. RECOMMENDATION  
  The Committee **ADOPTS** this Opinion and directs the broadcaster to publish an on-air apology compliant with Section VI within 21 days.  

