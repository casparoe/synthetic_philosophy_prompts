prompt: |-
  I sit on a review panel that has to decide whether to renew a large multi-lab programme built around the free energy principle, and the panel has agreed to fix its standard of adequacy in advance, before we see any further results — otherwise we will simply rationalise whatever the programme has already produced. I have been asked to draft that standard, and to draft it in a form that two hostile camps could both sign: the camp that treats the framework as the long-sought unifying theory of brain and behaviour, and the camp that suspects it of being unfalsifiable, or true but empty.

  Write the standard. I want the full specification of what a theory in this territory — predictive processing, active inference, and the free energy principle as the unifying claim above them — would have to deliver in order to count as an adequate theory of perception, action, and learning. Organise it as a list of requirements, and for each one give the case, result, or consideration that makes it a requirement rather than a matter of taste.

  Cover at least:

  - the phenomena the theory has to explain, including those any account in this area is expected to cover and those that have historically been taken to distinguish it from its rivals;
  - the distinctions it must not collapse: between the free energy principle and predictive coding, between a normative principle and an empirical hypothesis, between the computational and the algorithmic level, and between a system that actually minimises something and one that can merely be redescribed as if it did;
  - the results and objections it has to survive, among them the charge that it cannot be falsified or is trivially satisfied, the dark-room problem, and the worry that its explanations generalise so far that they predict nothing a rival could not predict;
  - the constraints imposed by its being offered as a theory of living systems rather than of a single subsystem.

  For every requirement, say whether it is a genuine demand on the theory or the prejudice of one camp, and mark which requirements are non-negotiable and which are negotiable.

  Then flag the pairs that concern me most: requirements that appear jointly unsatisfiable, or that pull against each other — falsifiability against the breadth that makes the framework unifying is my first guess, but tell me whether I am right and whether there are worse ones. If some subset of the desiderata cannot be met together, that is the most useful thing you can tell me, so put it plainly.

  Close with a short section — a few sentences per view, no more — assessing predictive coding, active inference, and the free energy principle in its broadest form against your list. I will do the detailed scorecard at the panel; I want the criteria from you, and only a rough sense of how the contenders fare.
reasoning: |-
  Hmm, the user is on a review panel for a multi-lab program centered on the free energy principle (FEP), and they need help drafting a standard of adequacy that both opposing camps can agree on. One camp sees FEP as a unifying theory of brain and behavior, while the other suspects it's unfalsifiable or vacuous. This is a complex task requiring neutrality and scientific rigor.

  First, I need to recall what FEP entails: it's a framework that includes predictive coding (how the brain processes sensory input), active inference (how it acts to test predictions), and the overarching FEP claim that all biological systems minimize free energy—a measure of surprise or prediction error. The camps disagree on its validity, so the standard must address core tensions without bias.

  The user specified key areas to cover: phenomena to explain (like perception-action loops), necessary distinctions (e.g., between normative principles and empirical claims), objections (like the dark-room problem), and constraints for living systems. I should organize this as a list of requirements, each justified by scientific reasoning, not opinion. For every requirement, I need to label whether it's a genuine demand or a potential prejudice, and mark which are non-negotiable versus negotiable.

  Crucially, the user wants me to identify conflicting requirements—like falsifiability versus unifying breadth—and assess if they're jointly unsatisfiable. Falsifiability is key here: if the theory is too broad, it might not make testable predictions, but narrowing it could lose its unifying power. That's probably the biggest tension. I should also note others, such as mechanistic detail versus algorithmic generality.

  For the closing section, I'll briefly evaluate predictive coding, active inference, and FEP against the list. The user only wants a rough sense—no detailed scoring—so I'll highlight strengths and weaknesses: e.g., predictive coding handles perception well but struggles with action, while FEP risks unfalsifiability. This keeps it concise.

  Underlying needs: The user is worried about panel dynamics—hostile camps might deadlock without predefined standards. They need criteria that force objective evaluation, preventing post-hoc rationalization. Unspoken, they might fear the program's renewal hinges on resolving philosophical divides, so the standard must be scientifically robust and compromise-enabling. By focusing on irreconcilable conflicts, I help them anticipate deal-breakers.

  Finally, I'll structure the response clearly: requirements in a numbered list with justifications, conflict analysis, and a succinct evaluation. This should equip the user to draft a fair, effective standard.
answer: |-
  Here is a draft standard of adequacy for the Free Energy Principle (FEP) programme, designed to be acceptable to both supportive and skeptical camps, organized as requested:

  **Standard of Adequacy for the Free Energy Principle Programme**

  This standard defines the minimum requirements for the FEP framework (encompassing Predictive Coding (PC), Active Inference (AIF), and the overarching Free Energy Principle) to be considered an empirically adequate, non-trivial, and unifying theory of perception, action, and learning in living systems. Requirements are grounded in core scientific and philosophical expectations for explanatory theories in neuroscience and cognitive science.

  1.  **Requirement: Comprehensive Explanation of Core Phenomena (Perception, Action, Learning Loop)**
      *   **Specification:** The theory must provide a coherent, integrated, and *mechanistically plausible* account of how perception (including illusions, bistable perception), action (including goal-directed behaviour, exploration), and learning (including perceptual learning, habit formation, model updating) interact continuously within a single agent-environment loop. This includes phenomena like sensory attenuation, mismatch negativity (MMN), place cell remapping, sensorimotor contingencies, and action-perception cycles.
      *   **Case for Requirement:** Any purported unifying theory of brain and behaviour *must* explain the fundamental, interdependent processes that constitute cognition and adaptive behaviour. Failure here renders the theory irrelevant to its core domain. (Genuine Demand, **Non-Negotiable**)
  2.  **Requirement: Explanation of Pathologies as Deviations from Normative Principle**
      *   **Specification:** The theory must provide specific, testable accounts of how deviations from its proposed normative principle (e.g., failure to minimize expected free energy appropriately) manifest as recognized pathologies (e.g., specific perceptual deficits in schizophrenia, compulsions in OCD, catatonia, certain types of delusion, learning impairments).
      *   **Case for Requirement:** Demonstrating explanatory power for breakdowns is a hallmark of robust mechanistic theories in neuroscience/psychiatry. It provides crucial leverage for testing the core normative claim. (Genuine Demand, **Non-Negotiable**)
  3.  **Requirement: Clear Distinction Between FEP, PC, and AIF**
      *   **Specification:** The programme must explicitly articulate the distinct claims and roles of:
          *   FEP: The overarching normative claim (biological systems minimize an information-theoretic quantity related to surprise).
          *   PC: A specific computational strategy for perceptual inference under FEP.
          *   AIF: A specific computational strategy for planning and action selection under FEP.
      *   **Case for Requirement:** Conflation obscures testability. Failure to distinguish risks attributing successes/failures of specific implementations (PC/AIF) to the broader principle (FEP) incorrectly, or vice-versa, and hides explanatory gaps. (Genuine Demand, **Non-Negotiable**)
  4.  **Requirement: Falsifiable Empirical Hypotheses Derived from Normative Principle**
      *   **Specification:** The programme must generate specific, empirically testable hypotheses derived *uniquely* from the FEP normative principle + specific PC/AIF implementations that are *not* trivially derivable from, or easily mimicked by, rival frameworks (e.g., reinforcement learning, Bayesian brain without FEP, classical control theory). These hypotheses must predict *novel, non-obvious* phenomena or make *quantitatively precise* predictions about measurable variables (e.g., neural activity patterns, reaction times, learning curves, choice behaviour).
      *   **Case for Requirement:** Without unique, falsifiable empirical hypotheses derived from its core normative claim, the FEP risks being a redescription or purely mathematical framework, not a scientific theory. (Genuine Demand, **Non-Negotiable**)
  5.  **Requirement: Resolution of the Dark Room Problem**
      *   **Specification:** The theory must provide a compelling and empirically supported account of why agents seek information and engage with complex, changing environments (exploration, curiosity, play), rather than simply minimizing surprise by seeking a predictable, low-stimulus state (like a dark room).
      *   **Case for Requirement:** This is a persistent and fundamental conceptual challenge directly confronting the FEP's core claim of surprise minimization. Failure to resolve it undermines its plausibility as a theory of adaptive behaviour. (Genuine Demand, **Non-Negotiable**)
  6.  **Requirement: Distinction Between Minimization Mechanism and "As-If" Redescription**
      *   **Specification:** The theory must specify *how* biological systems (neurons, circuits, organisms) *mechanistically implement* the minimization of variational free energy or expected free energy. It must go beyond merely showing that behaviour *can be described* as minimizing F, to proposing and testing specific neural/biophysical mechanisms that *perform* the minimization (e.g., specific message passing schemes, synaptic plasticity rules, homeostatic mechanisms).
      *   **Case for Requirement:** "As-if" descriptions are useful heuristics but insufficient for a mechanistic theory of living systems. Without specifying plausible mechanisms, the theory remains at an abstract level disconnected from biology. (Genuine Demand, **Non-Negotiable**)
  7.  **Requirement: Computational-Algorithmic Distinction**
      *   **Specification:** The programme must clearly separate:
          *   The *computational goal* (e.g., minimize VFE/EFE under the FEP).
          *   The *algorithmic strategies* used to achieve it (e.g., specific PC architectures, AIF planning schemes like MCTS or policy iteration).
          *   The *physical implementation* in neural tissue.
      *   **Case for Requirement:** Conflation obscures the level of explanation and makes it impossible to determine if failures are due to the core principle, a specific algorithm, or implementation constraints. (Genuine Demand, **Non-Negotiable**)
  8.  **Requirement: Scope Constraint - Explaining Living Systems**
      *   **Specification:** The theory must explicitly address the unique constraints and characteristics of *living, self-organizing, adaptive systems* (e.g., metabolic constraints, embodiment, phylogenetic history, phenotypic plasticity, niche construction) and explain how the FEP framework accounts for these specifically, beyond merely applying to any system that can be described as having a Markov blanket.
      *   **Case for Requirement:** The FEP is proposed as a biological principle, not just a mathematical truism. Its value hinges on explaining the distinctive features of life. (Genuine Demand, **Negotiable** in precise details of how this is demonstrated, but **Non-Negotiable** that it *must* be addressed)
  9.  **Requirement: Demonstration of Unification Power**
      *   **Specification:** The theory must demonstrate its unifying power by showing how specific, diverse phenomena (e.g., from low-level sensory processing to high-level decision-making, motor control, and social cognition) are *better explained* under the single FEP framework (+ PC/AIF) than by a collection of separate, domain-specific theories. "Better" means greater parsimony, novel predictions, or resolving inconsistencies between existing theories.
      *   **Case for Requirement:** Unification is the primary *promise* of the FEP programme. Without demonstrable unification, its core selling point vanishes. (Genuine Demand, **Non-Negotiable** for programme renewal justification, but **Negotiable** on the specific benchmarks for "better")
  10. **Requirement: Avoidance of Trivial Satisfaction / "Not Even False" Status**
      *   **Specification:** The programme must demonstrate that the FEP, as applied to specific biological systems and processes, makes concrete predictions that can *fail*. It must identify specific conditions under which the FEP *would not hold* for a living system, or where its predictions would be clearly falsified.
      *   **Case for Requirement:** This addresses the core skeptical charge of unfalsifiability. A theory that can explain any outcome explains nothing. (Genuine Demand, **Non-Negotiable**)

  **Analysis of Key Tensions and Potential Conflicts:**

  1.  **Falsifiability vs. Unifying Breadth (Your Guess):**
      *   **Conflict:** Requirement 4 (Falsifiable Hypotheses) and Requirement 9 (Unification Power) pull strongly against each other. Generating specific, unique, falsifiable predictions often requires narrowing the scope and making auxiliary assumptions. The broader and more unifying the framework (FEP itself), the harder it is to derive *unique* predictions that couldn't be mimicked by other approaches or dismissed as implementation details. Unification often comes at the cost of specificity. **This conflict is real and severe.** Reconciling it requires showing that specific *instantiations* (PC/AIF models) make unique predictions *because of* the FEP normative foundation, not despite it.
  2.  **Normative Principle vs. Mechanistic Implementation:**
      *   **Conflict:** Requirement 3 (Distinguish FEP/PC/AIF) and Requirement 6 (Mechanistic Implementation) vs. Requirement 4 (Derive Empirical Hypotheses). It's challenging to derive specific, testable hypotheses purely from the high-level normative FEP without committing to specific algorithmic implementations (PC/AIF). However, tying the FEP too tightly to specific implementations (like standard PC) risks making the core principle vulnerable to failures of those specific implementations. The programme must navigate deriving predictions *from* the FEP that constrain *possible* implementations without being hostage to one.
  3.  **Unification Power vs. Avoiding Triviality:**
      *   **Conflict:** Requirement 9 (Unification Power) and Requirement 10 (Avoid Triviality). The broader the theory's applicability (unification), the greater the risk it becomes a framework for redescription rather than a theory making specific predictions ("everything minimizes free energy, therefore everything is explained"). Demonstrating genuine unification requires showing *how* the FEP provides *better* explanations, not just different descriptions.
  4.  **Mechanistic Detail vs. Algorithmic Generality:**
      *   **Conflict:** Requirement 6 (Mechanistic Implementation) and Requirement 7 (Comp-Algo Distinction) vs. Requirement 9 (Unification Power). Specifying detailed neural mechanisms for FEP minimization might yield high falsifiability but could tie the theory too closely to specific biological implementations, hindering its unifying power across different levels or types of organisms. Conversely, staying at a high algorithmic level aids unification but risks the "as-if" trap (Requirement 6).

  **These conflicts are inherent to the ambitious scope of the FEP programme. Success requires demonstrating that the framework *productively constrains* the development of specific, falsifiable models (PC/AIF) that deliver unique explanations and predictions across diverse domains, while the normative principle itself offers non-trivial, testable insights into biological organization.**

  **Brief Assessment Against Requirements:**

  *   **Predictive Coding (PC):**
      *   **Strengths:** Strong on Requirement 1 (Perception), provides mechanistic hypotheses (Req 4, 6, 7), falsifiable predictions exist (e.g., MMN, sensory attenuation - Req 4, 10).
      *   **Weaknesses:** Weak on Action/Learning loop (Req 1), struggles with Dark Room (Req 5), scope limited primarily to perception/cognition (Req 8, 9), not the unifying principle itself.
  *   **Active Inference (AIF):**
      *   **Strengths:** Addresses Action (Req 1), attempts Dark Room resolution via epistemic value (Req 5), offers algorithmic solutions for action/planning (Req 3, 7).
      *   **Weaknesses:** Computational tractability often requires major approximations, undermining mechanistic plausibility (Req 6). Empirical validation of *unique* AIF predictions vs. RL is limited (Req 4, 10). Scope still often narrower than full FEP promise (Req 9).
  *   **Free Energy Principle (Broadest Form):**
      *   **Strengths:** Aims for ultimate unification (Req 8, 9), provides a grand normative vision.
      *   **Weaknesses:** Severe risk of failing Requirements 4 (Falsifiable Hypotheses), 5 (Dark Room - though attempts exist), 6 (Mechanism vs. Redescription), and 10 (Trivial Satisfaction). The distinction from PC/AIF (Req 3) is often blurred in practice. Demonstrating unique explanatory power (Req 4, 9) and avoiding triviality (Req 10) remain the paramount challenges.

  **In essence:** PC and AIF, as specific computational strategies, have made progress on specific requirements (especially perception and action mechanisms) but face their own challenges. The overarching FEP, while inspiring, currently struggles most acutely with the core demands of falsifiability, non-triviality, mechanistic grounding beyond redescription, and demonstrating *unique* unification power that justifies its status as a fundamental biological principle rather than a useful mathematical perspective. The programme's adequacy hinges on bridging the gap between the broad normative claim (FEP) and the production of specific, validated, uniquely predictive, and unifying models (PC/AIF) of perception, action, and learning in living systems.
