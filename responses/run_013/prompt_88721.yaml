prompt: |-
  I am a software engineer with no formal training in philosophy, and I have somehow ended up as the technical member of a small review panel that our company has asked to recommend how to spend a research budget — roughly three researcher-years spread over two years — on the conceptual foundations of mind uploading. The engineering is moving faster than our thinking about it: we have working prototypes of three different replacement protocols, and I keep finding that the questions I can answer with a profiler are not the ones that decide whether what we are building is something a person should be willing to undergo. What I want from you is not a survey of the field but a defended agenda: which open conceptual questions in this area most deserve those three researcher-years, in what order, and why.

  To make the question concrete, here is what the three protocols actually do. In the first, a subject's biological neurons are replaced one at a time — on a fixed schedule, over about a year — by silicon units that we have verified are equivalent at the level of input-output behavior and spike timing; the subject is awake for some sessions and under general anesthesia for others. In the second, the same replacement is done in a single uninterrupted procedure lasting a few hours, with the biological tissue discarded as it is swapped out, so there is never a moment at which the subject is partly biological and partly silicon under any schedule we control. In the third, a full non-destructive scan is taken and instantiated on silicon while the original body stays alive and keeps running, so that for a period there are two systems claiming the same memories and dispositions. For each protocol I want to know which conceptual questions it turns on that we cannot settle by measurement, and which of those questions are upstream of the others — the ones where an answer would dissolve or reorder a whole cluster of downstream worries, as opposed to the ones that are interesting but would not change what we build, what we tell subjects, or what the law should do.

  Please give me the ranking, the criteria you used, and the trade-offs among them. My own guess at criteria is something like how many other questions depend on a given one, how tractable it is for someone working with arguments rather than instruments, and how much a shift in the answer would change practice — but I would like those criteria defended rather than assumed. Tell me also what kind of argument or finding over the next two years would move a question up or down the list. I am much less interested in a list of topics than in the reasoning that puts one thing above another; and if you think some questions that get a lot of attention in these discussions are actually downstream or idle, say so and say why.
reasoning: |-
  Okay, this is a fascinating and highly specific request. The user is a software engineer thrust into a philosophical evaluation role for mind uploading research, seeking a prioritized research agenda based on three concrete protocols. They're clearly frustrated with the disconnect between technical progress and foundational questions - a classic engineer-meets-philosophy dilemma.

  Hmm... what they really need isn't just a list of philosophical questions, but a decision framework. The key pain point seems to be that current instrumentation answers technical questions but not the "should we do this?" questions. Interesting how they emphasize upstream/downstream dependencies - this suggests they've already encountered tangled philosophical debates and want to cut through noise.

  Let me unpack their protocols first:
  1. Gradual replacement (year-long, intermittent consciousness) - raises continuity questions
  2. Instant swap (no hybrid state) - avoids continuity but creates abruptness concerns
  3. Duplication (two instances) - introduces identity/singularity problems

  The user's proposed criteria (dependency, tractability, impact) are actually quite sophisticated for a non-philosopher. I should validate these rather than replace them. Noticing they dismiss "topics that get attention but are idle" - probably referring to things like qualia debates or Chinese Room arguments that don't affect engineering choices.

  Biggest challenge: resisting the academic urge to catalog all philosophical issues. Must maintain ruthless prioritization. Their "upstream/downstream" framing is brilliant - reminds me of dependency graphs in software architecture. Maybe I should model it that way...

  Ah! The anesthesia detail in Protocol 1 is crucial - shows they've already considered consciousness interruptions. And their distinction between "changing what we build" vs "changing what we tell subjects" reveals pragmatic legal/ethical awareness beyond pure philosophy.

  Worried they might underestimate how much conceptual work feeds into protocol design itself. For example, continuity theories could determine whether Protocol 2 needs to preserve certain neural rhythms during swap. But must stay focused on their explicit request: which questions deserve those researcher-years.

  The duplication protocol (3) seems most explosive - could derail entire funding if identity issues aren't resolved. But is that truly the most urgent? Depends whether they're closer to deploying 1/2 or 3. User didn't specify timeline... must assume all are equally viable.

  Noticing subtle emphasis on "what the law should do" - suggests regulatory concerns are looming. This pushes ethical/legal questions higher than pure metaphysics. Also their mention of "what we tell subjects" implies informed consent is a live issue.

  ...after mapping dependencies, I realize most debates collapse into two core forks: numerical identity vs informational identity. Everything else (consciousness, ethics, continuity) branches from there. That's the true upstream nexus. Will structure the ranking accordingly.

  Must remember to flag which questions could become measurable later - e.g. if we develop consciousness probes, the anesthesia question in Protocol 1 shifts from philosophy to engineering. Important for their "up/down the list" request.

  Final insight: The "discarded tissue" in Protocol 2 might actually be philosophically significant if any theory considers neural substrate essential. But user implied it's biologically inert after removal... interesting assumption worth examining briefly.
answer: |-
  Based on your criteria and the concrete protocols, here is a prioritized research agenda for the conceptual foundations of mind uploading, ranked by impact on practice, dependency, and tractability. The ranking focuses on **questions that directly determine protocol viability, ethical permissibility, legal status, and subject consent**—avoiding debates that don’t change outcomes.

  ### **Ranking & Rationale**
  1. **The Identity/Criterion Question**  
     **Core Question:** *What constitutes the persistence of personal identity through replacement or duplication?*  
     - **Why #1?**  
       - **Highest Dependency:** Every protocol hinges on this. If gradual replacement (Protocol 1) doesn’t preserve identity, it’s unethical. If duplication (Protocol 3) creates two valid identities, legal chaos ensues.  
       - **Max Impact on Practice:**  
         - *Protocol 1/2:* If identity requires continuity of biological substrate, both fail. If functional equivalence suffices, they advance.  
         - *Protocol 3:* Determines if duplication is murder, cloning, or harmless backup. Changes liability, consent, and commercial model.  
       - **Tractability:** Focused arguments (e.g., "Is identity pattern-based or biological?") can be tested against edge cases (e.g., anesthesia gaps in Protocol 1).  
     - **Downstream Idle Debates:** Avoid "What is consciousness?" unless it directly informs identity criteria.  
     - **What Moves It?** A consensus framework (e.g., "Identity requires uninterrupted causal history") could resolve Protocol 1/2. Empirical work on subjective continuity in neural implants would elevate this.  

  2. **The Duplication Problem (Protocol 3-Specific)**  
     **Core Question:** *Does duplicating a mind create one identity split, two competing identities, or a derivative copy?*  
     - **Why #2?**  
       - **Existential Risk to Practice:** If duplication invalidates original identity (e.g., via "psychological connectedness" theories), Protocol 3 is unusable.  
       - **Legal/Ethical Domino Effect:** Determines inheritance, criminal liability, and personhood rights. A "copy is not me" answer collapses Protocol 3’s value proposition.  
       - **Upstream of Consciousness Questions:** Resolving identity dissolves debates like "Which duplicate feels pain?"  
     - **Tractability:** Can leverage thought experiments (e.g., teleportation paradoxes) and legal precedents (e.g., digital estate law).  
     - **What Moves It?** Behavioral studies on twins or brain-injury patients showing how identity claims resolve conflicts. If subjects reject duplication post-scan, this question surges.  

  3. **Continuity of Consciousness (Protocol 1-Specific)**  
     **Core Question:** *Does intermittent disruption (e.g., anesthesia) break psychological continuity in ways that terminate identity?*  
     - **Why #3?**  
       - **Critical for Protocol 1 Viability:** Gradual replacement relies on uninterrupted "selfhood" despite gaps. If anesthesia voids continuity, Protocol 1 is lethal.  
       - **High Impact on Consent:** Subjects will demand guarantees they "survive" the process.  
       - **Tractable Subset:** Narrower than general consciousness debates. Focus on empirical proxies (e.g., memory integration post-anesthesia).  
     - **Downstream of Identity:** If identity is purely functional, continuity matters less.  
     - **What Moves It?** EEG/fMRI data linking post-anesthesia cognition to pre-anesthesia states. If gaps cause identity fragmentation, Protocol 1 drops in priority.  

  4. **Substrate Dependence**  
     **Core Question:** *Do conscious states fundamentally depend on biological features (e.g., quantum effects in microtubules) or are they substrate-neutral?*  
     - **Why #4?**  
       - **Protocol 1/2 Gatekeeper:** If consciousness requires biology, silicon replacement fails.  
       - **Moderate Impact:** Silences "hard problem" objections if resolved.  
       - **Tractability Challenge:** Philosophical but can use computational equivalence arguments.  
     - **Why Not Higher?** Protocol 3 bypasses this (original biology remains). Also, I/O equivalence in your units may already answer it.  
     - **What Moves It?** Evidence of consciousness in artificial neural nets. If achieved, this drops off the agenda.  

  5. **Ethical Thresholds for "Success"**  
     **Core Question:** *What minimal criteria must uploading meet to be ethically permissible?*  
     - **Why #5?**  
       - **Practical Necessity:** Determines regulatory approval and public acceptance.  
       - **Downstream of Identity/Continuity:** If Protocol 2 preserves identity, ethics reduces to risk management.  
       - **Tractability:** Can build on medical ethics (e.g., clinical trials for high-risk procedures).  
     - **Why Lowest?** Heavily dependent on higher-ranked questions.  
     - **What Moves It?** Lawsuits or regulatory rulings against similar tech (e.g., neural implants).  

  ---

  ### **Criteria Defense & Trade-offs**
  1. **Dependency (Weight: 40%)**  
     - Questions that unlock/clarify others rank highest (e.g., identity resolves duplication ethics).  
     - *Trade-off:* Avoids "interesting but isolated" puzzles (e.g., "Can uploads have qualia?").  

  2. **Impact on Practice (Weight: 40%)**  
     - Measures how much an answer changes:  
       - Protocol design (e.g., ditching Protocol 3 if duplication isn’t "me").  
       - Subject consent materials (e.g., disclosing identity risks).  
       - Legal strategy (e.g., preempting personhood claims for copies).  
     - *Trade-off:* Ignores theoretically profound questions with no engineering consequences.  

  3. **Tractability (Weight: 20%)**  
     - Prioritizes questions amenable to progress in 2 years via:  
       - Conceptual clarity (e.g., defining "continuity").  
       - Empirical proxies (e.g., neuroimaging during anesthesia).  
     - *Trade-off:* Shelves intractable problems (e.g., "Why does consciousness exist?").  

  ---

  ### **Protocol-Specific Conceptual Risks**
  | Protocol | Make-or-Break Questions | Downstream If Resolved |
  |----------|-------------------------|------------------------|
  | **1 (Gradual)** | Continuity of consciousness under disruption; identity persistence through hybrid states. | Lowers ethical barriers for incremental enhancement. |
  | **2 (Instant)** | Identity via causal abruptness; substrate dependence. | Establishes "clean swap" as gold standard. |
  | **3 (Duplication)** | Singularity vs. branching identity; rights of the copy. | Unlocks backups/versioning but requires new legal frameworks. |

  ---

  ### **Recommendation: Allocation of 3 Researcher-Years**
  - **Year 1:** 2 researchers on **Identity/Criterion** (foundational for all protocols).  
  - **Year 2:** 1 researcher on **Duplication Problem** (critical for Protocol 3), 0.5 on **Continuity** (Protocol 1), 0.5 on **Substrate Dependence** (Protocols 1–2).  
  - **Ethics** addressed via monthly cross-team reviews—it’s too derivative for dedicated time.  

  **Why this order?** Until you know *what survives*, you can’t ethically build anything. Identity isn’t just philosophy—it’s your product spec. Duplication is next because Protocol 3 could implode your business model if unresolved. Continuity and substrate are protocol-specific refinements. Two years won’t solve everything, but this cuts the Gordian knot blocking progress.
