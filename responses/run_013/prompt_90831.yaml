  2. **Calibration as ontological reality vs. epistemic artifact**:  
     Probability: 0.4  
     Justification: Heuristic reliability likely reflects human ignorance and selection effects, not intrinsic randomness; calibration may not hold universally.

  3. **Non-circular recognition of defeaters**:  
     Probability: 0.3  
     Justification: Detecting "hidden structure" without prior knowledge risks circularity if the defeasible rule is the sole tool; no existing systems resolve this.

  4. **Reference class relativity and selection effects**:  
