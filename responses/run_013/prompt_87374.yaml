  **OFFICE OF NOMOLOGICAL AFFAIRS (ONA)**  
  **PUBLIC NOTICE: PN-7H/04 - ADOPTION OF OFFICIAL METAPHYSICAL FRAMEWORK**

  **Preamble:**  
  Pursuant to Directive 12-C (Metaphysical Harmonization), and following extensive stakeholder consultation (see Archive Ref: CON/ONA/META/23), the Office of Nomological Affairs hereby adopts the Best-System Account (BSA) as the jurisdiction's official framework for characterizing observed uniformities. This framework provides the most administratively efficient and pragmatically adequate description of the spatiotemporal distribution of particular matters of fact (the "mosaic"). The BSA supersedes all previous informal characterizations implying non-observable modalities or governing principles. Compliance with this descriptive framework is mandatory for all official documentation, educational syllabi, and state-funded research proposals effective 01/10/24.

  **Section 1: Framework Overview**
  1.1 The BSA identifies "laws of nature" as those generalizations which form an integral part of the deductive system offering the optimal balance of *simplicity* and *strength* in describing the total mosaic of particular facts (Schedule A, Definitions 1.3-1.7).
  1.2 The designation "law" is a descriptive classification applied by the ONA, contingent upon the current state of the mosaic and prevailing standards of simplicity and strength (as per ONA Regulatory Standard RS-Meta-8). This classification is subject to periodic review and revision.
  1.3 No implication of governance, enforcement, necessity, or productive power is associated with the term "law" under this framework. Laws summarize; they do not prescribe.

  **Section 2: Responses to Frequently Anticipated Queries (FAQs)**

  2.1 **Query:** *If a previously noted uniformity exhibits exactly one exception, is it still a law? Who determines this?*
      **Response:** An exception constitutes a previously unobserved particular fact within the mosaic. The descriptive generalization encompassing both the prior uniform observations and the exception demonstrably lacks the requisite strength (Def 1.5, Schedule A). The ONA will initiate a reclassification review (Procedure PR-7H.2). The prior generalization may be:
      (a) Reclassified as a "Localized Pattern" (if spatially/temporally bounded).
      (b) Reclassified as "Statistical Tendency" (if probabilistic strength remains high).
      (c) Removed from the Official Register of Natural Uniformities (ORNU) if deemed insufficiently systematic. Determination rests on the revised system's overall simplicity/strength balance vis-à-vis the updated mosaic. The exception is merely another fact; it was not "disobeyed."

  2.2 **Query:** *Are regularities stated using predicates like "examined before date D" excluded from lawhood? Is this exclusion principled or arbitrary?*
      **Response:** Predicates referencing arbitrary human actions or contingent historical events (e.g., "examined before D," "named 'Bob'") generally yield generalizations lacking robustness and systematic utility. While such a generalization might *accidentally* be true of the mosaic, incorporating it typically degrades the *simplicity* of the overall descriptive system without offering compensatory gains in *strength* across the totality of facts (RS-Meta-8, Clause 4.c). Exclusion is therefore based on systemic inefficiency, not a principle concerning the "truth" of the isolated generalization. Its descriptive utility is minimal.

  2.3 **Query:** *If nothing necessitates events, what grounds the counterfactual claim that "If this match had been struck, it would have lit"?*
      **Response:** Counterfactual statements are descriptive projections based on observed patterns within the mosaic. The claim "if struck, would have lit" reflects the high degree of uniformity observed in past instances where matches of type M, in conditions C, were struck and lit. It is a compact description of a robust pattern concerning the behaviour of type-M objects under condition C. The ONA classifies this pattern under the relevant law (e.g., ORNU Entry F-Comb-1). No unobserved "necessity" is invoked; the projection relies solely on the descriptive strength and entrenchment of the pattern within the best system.

  2.4 **Query:** *Does this framework change anything for working scientists? If not, what was the disagreement about?*
      **Response:** The operational procedures for observation, experimentation, data collection, and predictive modeling remain unchanged (Ref: ONA Guidance Note GN-SciPrac/BSA). Scientists will continue to identify robust patterns and formulate generalizations. The disagreement pertained solely to the *interpretive characterization* of these activities and their outputs. Previous characterizations employed terminologies ("govern," "necessitate," "causal power") deemed operationally redundant and potentially misleading by the ONA Audit of Metaphysical Efficiency (2022). The BSA provides a terminologically streamlined, metaphysically parsimonious framework for the same descriptive practices. The disagreement was terminological and interpretive, not operational.

  2.5 **Query:** *Doesn't the BSA make laws depend on our subjective standards of simplicity, rather than reflecting how the world objectively is?*
      **Response:** The standards of simplicity and strength applied by the ONA (RS-Meta-8) are optimized for predictive accuracy, explanatory scope (descriptive comprehensiveness), and practical utility within this jurisdiction. These standards are informed by historical success in pattern description and are subject to peer-review calibration (Committee META-REV). While alternative descriptive systems are conceivable given different pragmatic priorities, the ONA-designated Best System is objectively the most efficient *for describing the observed mosaic* under the prevailing, empirically informed standards. The mosaic itself is fixed.

  **Section 3: Implementation & Compliance**
  3.1 All references to "laws of nature," "natural necessity," "causal powers," or similar terms in official documents must be interpreted strictly within the BSA framework outlined herein and in Schedule A.
  3.2 Non-compliant terminology (e.g., "broken law," "enforced regularity," "necessary connection") must be replaced with BSA-approved equivalents (See Schedule B: Terminology Crosswalk).
  3.3 The ONA Helpline (Ext. 7HUME) is available for clarification. Persistent non-compliance may trigger a Metaphysical Audit (Procedure MA-1).

  **Closing:** This framework ensures administrative clarity and metaphysical economy. The ONA remains committed to the accurate and efficient description of the spatiotemporal mosaic.

  **Appendix A: Excerpts from Consultation & ONA Responses**

  *   **Comment 1 (Submitted by "Concerned Citizens for Metaphysical Rigour"):** *The BSA utterly fails to capture what a law of nature IS. Laws aren't just summaries we find convenient! They are the deep, mind-independent structures that MAKE the world behave as it does. They NECESSITATE their instances – the apple falls BECAUSE of gravity’s law, it doesn't just happen to fall while we note a pattern. Gravity would compel the apple even if no one was looking! Your "best system" is just a human fiction imposed on reality, ignoring the real, governing ontology. Without genuine necessity, science loses its explanatory power and becomes mere list-making.*
      **ONA Response:** The ONA acknowledges the comment. The terminology of "making," "compelling," and "necessitating" falls outside the operationally defined vocabulary of the BSA framework. These terms refer to concepts deemed non-observable and thus inadmissible for official descriptive purposes under Directive 12-C. The BSA provides a complete and efficient description of all observable phenomena (the mosaic), including apple descents. Projections concerning unobserved instances (e.g., apples falling unwitnessed) are fully supported within the framework (Ref: FAQ 2.3). The ONA disputes the characterization of the BSA as "mere list-making"; it is systematic pattern description optimized for predictive and explanatory utility. The assertion regarding "mind-independent structures" is noted but lacks an operationally definable verification protocol within the ONA mandate.

  *   **Comment 2 (Submitted by Dr. Aris Thotles, Emeritus Professor):** *Consider a potential law L, perfectly uniform across all observed instances for millennia, except for a single, well-documented anomaly in the records of 1583. Under BSA, is L a law? If not, due to one "exception," doesn't this show the absurdity of reducing laws to mere summaries? A true law can HAVE an exception (perhaps a miracle, perhaps unknown interference) without ceasing to BE the law that was violated. Your framework cannot distinguish a violated law from a mere statistical fluke.*
      **ONA Response:** The scenario is addressed under FAQ 2.1. The 1583 event is a particular fact within the mosaic. The generalization previously labelled L, if it excluded this fact, would constitute an inaccurate description. The ONA would initiate Procedure PR-7H.2. The most likely outcome would be the reclassification of L as a "Statistical Tendency" (e.g., 99.997% uniform) or, if the anomaly suggests a previously unrecognized variable, the formulation of a new, more complex generalization incorporating the 1583 datum. The term "violated" is non-compliant terminology (Schedule B). The distinction sought by the commentator ("violated law" vs. "statistical fluke") relies on modalities not recognized within the BSA framework. The anomaly is simply a fact requiring descriptive integration.

  *   **Comment 3 (Submitted by "Real Modalities Alliance"):** *How can the BSA possibly support counterfactuals? You say a struck match *would have* lit, based on past patterns. But if the patterns are purely contingent, with no underlying necessity, why *should* the future resemble the past? For all you know, the next match struck might turn into a dove or fail entirely, even under identical conditions. Your "projection" is a leap of faith disguised as description. Genuine laws ground counterfactuals because they dictate what MUST happen.*
      **ONA Response:** The ONA acknowledges the philosophical concern regarding the uniformity of the mosaic. The BSA framework operates on the *observed* uniformity of the mosaic to date. Projections (counterfactuals) are extrapolations of these observed patterns, constituting our best available descriptive tools for unobserved or non-actualized scenarios. They are not claims about unobservable necessities. The possibility of radical discontinuity ("matches turning into doves") is a descriptive hypothesis about a potential future state of the mosaic. Should such an event occur, it would constitute a new particular fact requiring integration into the Best System, potentially leading to significant reclassification. The practical reliability of pattern-based projections is well-established empirically. Concerns about ultimate metaphysical grounding fall outside the ONA's remit for efficient description. A working group (WG-CF/BSA) has been convened to develop non-modal phrasing for common counterfactual assertions.
