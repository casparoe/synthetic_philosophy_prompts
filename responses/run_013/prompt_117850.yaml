prompt: |-
  I'm a grants officer at a small foundation — four of us, roughly £2m a year to give away — and our remit is long-term risk, which means we constantly recieve proposals built on an argument I can't shake and can't use. The shape is always the same: a tiny probability of something astronomically good, multiplied out into a number that swamps everything else on the spreadsheet, and the person sending it is completely sincere. We've had someone ask for £30k to buy lottery tickets, on the theory that the jackpot funds the entire programme; someone else wanting us to bankroll a physics idea that, if it works, unlocks effectively free energy; and last cycle a proposal arguing we should put our whole reserve into a single moonshot because the expected value comes out to something like a googol. I've read enough to know there's a real literature here — Pascal's mugging, fanaticism, bounded utility, the difference between a small chance of a big finite payoff and an infinitesimal chance of something infinite — but I can't get any of it into a shape my colleagues will accept, and the board wants reasons in writing. What I actually need from you is a decision procedure I can run on a proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it has to hand off to a person or the board because the question is one of values rather than facts. Assume an afternoon per proposal, no maths beyond arithmetic, and that I have to write my reasoning up in a page.

  Things it needs to handle: what to do when the proposal hands me a probability that's really a guess about whether the whole theory is right rather than about whether a coin lands heads, since those seem to deflate in completely different ways; the fact that if I accept the argument once, I'm committed to funding an infinite regress of ever-more-improbable schemes, because someone will always turn up with a bigger number; and the boring modest proposal where my instinct is just to fund it and get on with my day. It should also be honest about which steps are judgement calls dressed up as procedure — I'd much rather know where I'm the one deciding than have it papered over.

  Then run it on two of the ones above: the lottery tickets, and the moonshot that wants the reserves. And give me one case where the procedure tells me something I won't like — say a proposal we've been funding for years that it says to drop, or a long shot it says to take seriously. Lead with your bottom line in the first sentence and then give the reasoning; no preamble, and don't restate my question. Finally, tell me what the procedure can't do: where it will misfire, and what I should escalate rather than pretend to decide.
reasoning: |-
  Okay, the user is a grants officer at a small foundation dealing with high-risk, high-reward proposals. They're struggling with proposals that present tiny probabilities of enormous payoffs, which makes traditional evaluation methods ineffective. They need a decision procedure that's practical, avoids complex math, and can be documented in a page. The key challenges include handling subjective probabilities, avoiding infinite regress, and distinguishing between value judgments and factual assessments.

  First, I need to address the core issue: Pascal's Mugging scenarios. The user mentioned examples like lottery tickets and physics moonshots. The procedure must filter out proposals where the claimed probability is unverifiable or based on speculative theories. A step-by-step process with clear exit points is essential. Steps should start with verifying if the proposal fits the foundation's scope to avoid wasting time on irrelevant projects.

  Next, assessing the magnitude of the outcome. If the outcome is finite, it's manageable, but claims of infinite value need special handling since they can justify any probability. Then, probability assessment is critical. The user needs to differentiate between measurable probabilities (like coin flips) and speculative ones (like theoretical physics). Proposals relying on the latter should be rejected early to prevent infinite regress.

  The expected value calculation must consider both gains and losses, emphasizing opportunity costs. Since the foundation has limited resources, comparing the proposal's cost against alternatives is vital. For the lottery example, the probability is known but minuscule, and the expected value doesn't justify the cost. The moonshot proposal's infinite claim requires board intervention because it's a value judgment on whether to pursue such gambles.

  I should also consider edge cases. For instance, a long-shot proposal with a track record might pass the initial steps but fail on opportunity cost. Conversely, a modest proposal with measurable outcomes and reasonable probability gets funded. The procedure must flag where judgment is needed versus factual stops. The user needs transparency on where their discretion applies, like assessing plausibility or comparable projects.

  The user's unspoken needs include institutional support—getting board buy-in for the procedure. They also need to manage internal pressure to fund longstanding projects that don't meet criteria. The procedure should identify such cases, even if it's unpopular. Additionally, acknowledging the limits of the method, like when outcomes involve ethical dimensions beyond quantifiable metrics, is crucial for escalation.

  Testing the procedure on the lottery and moonshot examples shows clear rejections based on steps 3 and 5. For a long-shot proposal with a track record, it passes initial checks but fails on opportunity cost, which might be counterintuitive but necessary. The procedure can't handle interdependent proposals or ethical trade-offs, requiring board escalation. Ensuring the steps are sequential and have clear rejection points prevents analysis paralysis and maintains efficiency.
answer: |-
  **Bottom Line:** Use this 5-step sequential filter; stop and reject at any "No", escalate only at Step 4B, and fund only if reaching Step 5 with a "Yes".

  **The Decision Procedure:**
  1.  **Scope & Legality:** *"Is this proposal within our charitable remit and legally permissible?"* **No:** Reject. **Yes:** Proceed.
  2.  **Outcome Magnitude:** *"Is the claimed 'astronomically good' outcome demonstrably finite (e.g., £X saved, Y lives improved, Z policy changed), not infinite or undefined?"* **No:** Escalate to Board (Value Judgement: Pursuing "Infinite" Good). **Yes:** Proceed. *(Judgement: Defining "demonstrably finite")*
  3.  **Probability Plausibility:** *"Is the claimed probability based on replicable data, established science, or statistically valid modelling (e.g., drug trial phases, engineering reliability), not a subjective guess about an entire unproven theory being correct?"* **No:** Reject (Deflates under scrutiny, opens infinite regress). **Yes:** Proceed. *(Judgement: Assessing "replicable" vs. "subjective guess")*
  4.  **Expected Value (EV) & Cost:**
      *   **A. Calculate Simple EV:** EV = (Probability of Success * Value of Success) - (Probability of Failure * Cost of Proposal). Use *only* the proposer's numbers here.
      *   **B. Compare EV to Cost:** *"Is the EV *greater than* the proposal cost?"* **No:** Reject (Fails basic cost-benefit). **Yes:** Proceed.
      *   *(Judgement: Using proposer's numbers fairly; handling very small probabilities in calculation)*
  5.  **Opportunity Cost:** *"Is this proposal's *net benefit* (Value of Success * Probability of Success) *significantly higher* than achievable by reallocating this funding to our best *comparable, near-term alternative* (e.g., funding 10 proven interventions vs. 1 moonshot)?"* **No:** Reject (Better uses exist). **Yes:** Fund. *(Judgement: Defining "comparable", "significantly higher", estimating near-term alternative value)*

  **Applying the Procedure:**

  1.  **The Lottery Tickets (£30k):**
      *   Step 1: Yes (Charity can technically buy tickets).
      *   Step 2: Yes (Jackpot is finite £££).
      *   Step 3: **No.** Probability is known (tiny) but *not* based on replicable data/modeling for the *claimed outcome* (funding the whole programme). It's a known statistical gamble. **STOP: REJECT.** Reasoning: Probability, while precise, is derived from a random game of chance unrelated to any charitable intervention mechanism. Funding this validates any lottery-based proposal, leading directly to infinite regress (Step 3 violation).

  2.  **The Whole Reserves Moonshot:**
      *   Step 1: Assume Yes (Within remit, if risky).
      *   Step 2: **No.** Proposal claims outcome value is effectively "infinite" or a "googol" (beyond any conceivable finite good). **STOP: ESCALATE TO BOARD.** Reasoning: The claimed outcome magnitude is not demonstrably finite. Whether to pursue alleged "infinite" good, despite infinitesimal probability, is a fundamental value judgement about the foundation's purpose that the Grants Officer cannot make. Board must decide if this aligns with their interpretation of "long-term risk."

  3.  **A Case You Won't Like (Long-shot it takes seriously):** A proposal for early-stage, high-risk biomedical research (£150k). The theory is novel but based on recent, credible (though contested) papers. Probability of a major breakthrough is low (say 0.1% based on analogous early research), but success means curing a major disease (Value: £10 billion saved). A comparable near-term alternative funds proven palliative care (£150k saves 50 quality-adjusted life-years).
      *   Step 1: Yes.
      *   Step 2: Yes (£10bn is finite).
      *   Step 3: **Yes.** Probability is a low-confidence *estimate* based on analogous research data and peer-reviewed theory. It's not a guess about the *entire theory being correct* in a vacuum. Proceeds.
      *   Step 4A/B: EV = (0.001 * £10e9) - (0.999 * £0.15e6) = £10,000,000 - £149,850 = **£9,850,150**. EV (£9.85m) > Cost (£0.15m). **Yes.** Proceeds.
      *   Step 5: Net Benefit = 0.001 * £10e9 = £10,000,000. Best Alternative Net Benefit = Value of 50 QALYs (Assume £30k/QALY) = £1,500,000. £10m > £1.5m? **Yes, significantly higher (in potential).** RESULT: **FUND (Seriously Consider).** *This will feel uncomfortable due to the low probability, but the procedure forces evaluation based on potential scale and plausible (if low) probability.*

  4.  **A Case You Won't Like (Drop a funded project):** A long-funded (£50k/year) local arts education program. Modest, proven outcomes (e.g., 100 kids/year gain measurable skills, Value ~£200k/year). A *new* proposal emerges using similar methods but targeting a demonstrably more disadvantaged group with higher potential impact per £ (e.g., 80 kids/year, but Value ~£300k/year due to greater need uplift). The old project passes Steps 1-4 easily. At Step 5:
      *   Old Project Net Benefit: High confidence, ~£200k.
      *   New Project Net Benefit: ~£300k (higher per £).
      *   Is the New Project's net benefit *significantly higher* than the Old Project's? **Yes.**
      *   RESULT: **REJECT OLD PROJECT** when the new proposal is considered for funding (*or* reduce old funding to partial level if viable). The procedure prioritizes maximum impact, forcing hard choices about incumbent projects when better alternatives emerge.

  **What the Procedure Can't Do (Escalate Here):**

  1.  **Value Trade-offs Beyond Magnitude:** It can't decide between two proposals with similar calculated net benefits but *qualitatively different* goods (e.g., saving lives now vs. preventing potential future extinction). Escalate to Board/Committee.
  2.  **Resolving Deep Uncertainty/Disagreement:** If there's fundamental, expert disagreement on the *plausibility* of the probability (Step 3) that the GO can't reasonably adjudicate, escalate.
  3.  **Interdependent Proposals:** It treats proposals in isolation. If funding A precludes B, or enables C, but their values/probabilities interact complexly, escalate for strategic portfolio review.
  4.  **Ethical Boundaries:** It assumes positive outcomes. If a high-EV proposal has significant ethical controversy (e.g., certain AI research), even if legal and finite, escalate.
  5.  **Defining "Comparable" in Opportunity Cost:** When proposals are radically different in nature (e.g., arts vs. disaster relief), Step 5 requires a major judgement call. If the GO feels unable to make a fair comparison, escalate the final funding decision between finalists. **This is the most common escalation point.**
  6.  **Board-Level Strategy:** Deciding the *proportion* of funding for high-risk/high-reward vs. steady-impact projects is a strategic, value-laden board decision, not for this procedure per proposal.
