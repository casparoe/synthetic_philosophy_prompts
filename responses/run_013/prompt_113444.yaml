prompt: |-
  I keep getting into this argument and I keep going in circles, so before I read one more hot take I want the spec. Everyone argues about whether soldiers on both sides of a war are morally on a par by jumping straight to a verdict on one case -- the conscript, the volunteer, the guy defending his village -- and I want the requirements list first.

  So: what would a theory of when it's permissible for one combatant to kill another actually have to get right? Give me the desiderata, with the case or consideration behind each one.

  Things I want covered, at minimum:
  - the cases it has to handle: the conscript who had no real choice, the volunteer in a war he's been lied into, the soldier on the other side doing the same thing for the same reasons, the one defending his own home while his side is the aggressor overall, the one who's stopped believing in the cause halfway through;
  - the distinctions it can't just flatten: permissibility vs blameworthiness, being liable to attack vs deserving it, ad bellum vs in bello, combatant vs civilian;
  - the results it can't contradict -- and here I mean both the moral results people are pretty confident about and the boring empirical ones about how wars are actually fought and who actually ends up in them;
  - and whatever you think it owes to the weird cases that keep coming up now: contractors, drone operators a continent away, people fighting for a group that isn't a state at all.

  One more constraint, and it's the one I actually care about. I'm helping a friend who does pre-deployment legal briefings -- twenty minutes, a room of nineteen-year-olds, and no way for her to know whether the war itself is just. So the theory has to be usable by someone who can't see the whole picture and can't wait for the philosophers to finish. Tell me what that requirement adds, and whether it can be met at the same time as the ones above.

  Then the part I most want: which single requirement is doing the most work of excluding theories, and is there any pair of these requirements that can't be satisfied together? If the list turns out to be jointly unsatisfiable, that's the real result and I'd rather hear it now. Also mark which requirements are non-negotiable and which are just the house preference of one camp or another.

  And please dont tell me the theory can just defer to what the law happens to say. I want the moral story -- though it does need to tell me what to do about the fact that the law is symmetric and the morality maybe isnt. A table is fine if it helps.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're frustrated with circular debates about the moral parity of soldiers in war and want a clear set of requirements for a theory that determines when it's permissible for one combatant to kill another. They mention specific cases like conscripts, volunteers misled by propaganda, soldiers defending their homes, and contractors. They also want distinctions like permissibility vs. blameworthiness and ad bellum vs. in bello addressed.

  The user is helping a friend who gives legal briefings to young soldiers pre-deployment. The theory needs to be practical for someone without full visibility into the war's justice. The key constraint is usability in a 20-minute session for 19-year-olds. The friend can't assess the war's overall morality, so the theory must work without that knowledge.

  I need to list desiderata covering all mentioned cases, necessary distinctions, uncontroversial results, and modern scenarios like drone operators. Then, identify which requirement excludes most theories and if any requirements conflict. Non-negotiables versus preferences must be marked. The moral theory can't just defer to law but must address its symmetry.

  First, the cases: conscripts, volunteers deceived, soldiers on both sides, defenders in aggressor nations, those who lose faith mid-war. Distinctions: permissibility vs. blameworthiness, liability vs. desert, ad bellum vs. in bello, combatant vs. civilian. Results: soldiers kill, civilians die, soldiers aren't criminals, wars have fog. Modern cases: contractors, remote operators, non-state actors.

  The usability constraint is crucial. The theory must provide actionable guidance without needing ad bellum judgments. This pushes towards in bello symmetry but must handle moral asymmetry somehow. Maybe through liability based on role or threat, not cause justice.

  Possible conflicts: Usability requires simplicity and symmetry, but moral asymmetry demands differentiation. For example, conscripts vs. volunteers might need different treatment morally, but the briefing officer can't assess individual circumstances. So, a theory based on immediate threat (like McMahan's) might be morally accurate but fail usability. Traditional Just War theory (Walzer) offers symmetry and simplicity but flattens moral distinctions.

  Non-negotiables: Moral truth (asymmetry exists), Practical Action-Guidance (for the briefings), Combatant-Civilian Distinction (to protect non-combatants), and Liability Grounding (why soldiers can be targeted). Preferences include Symmetry (if not essential) and Perfect Alignment with Intuitions (which might be too ideal).

  The biggest conflict is between Moral Truth and Practical Action-Guidance. McMahan's view is morally nuanced but complex; Walzer's is usable but oversimplifies. Pairing them might be impossible. The briefing needs a hybrid: default in bello symmetry for rules of engagement but with exceptions where moral asymmetry is clear (e.g., unlawful orders). However, the user's friend might not have the authority to make those calls.

  So, the core tension is creating a theory both morally accurate and practically usable by a junior officer. The solution might be a two-tier approach: teach symmetric rules for the battlefield but include mechanisms for refusing unlawful orders, emphasizing individual moral responsibility where feasible. But even that has limits in a 20-minute briefing.
answer: |-
  Here’s a requirements list ("spec") for a theory of permissible killing in war, based on your constraints. The desiderata are grouped by category, with the underlying case/consideration and whether each is **non-negotiable** (NN) or **negotiable** (N). Conflicts and trade-offs are highlighted.

  ---

  ### **I. Cases & Agents the Theory Must Handle**
  1.  **The Conscript:**  
      *   *Requirement:* Must permit killing conscripts under certain conditions, even if their participation is involuntary.  
      *   *Why:* Wars rely on conscription; denying permissibility here would paralyze defense against aggressors.  
      *   *Status:* **NN** (Empirical reality of war).

  2.  **The Misled Volunteer:**  
      *   *Requirement:* Must not automatically excuse killing volunteers who joined based on state propaganda/lies.  
      *   *Why:* Subjective belief ≠ objective justification; otherwise, any aggressor could immunize forces via lies.  
      *   *Status:* **NN** (Moral truth).

  3. **The Symmetric Soldier:**  
      *   *Requirement:* Must explain why combatants on opposing sides often *appear* morally symmetric in their right to kill each other.  
      *   *Why:* Soldiers experience moral equivalence in combat ("he’s trying to kill me, I can kill him").  
      *   *Status:* **N** (Psychological/practical reality; may not reflect deep morality).

  4. **The Defensive Combatant in an Aggressor Force:**  
      *   *Requirement:* Must permit killing a soldier defending his occupied forward base *even if his nation is the unjust aggressor overall*.  
      *   *Why:* Soldiers retain defensive rights in immediate threats (e.g., repelling an attack on their position).  
      *   *Status:* **NN** (Reciprocity in combat).

  5. **The Disillusioned Combatant:**  
      *   *Requirement:* Must not grant blanket immunity to combatants who privately doubt their cause but continue fighting.  
      *   *Why:* Internal dissent doesn’t remove the immediate threat they pose; wars would be unworkable if intent determined liability.  
      *   *Status:* **NN** (Practical necessity).

  ---

  ### **II. Essential Distinctions the Theory Must Preserve**
  6. **Permissibility vs. Blameworthiness:**  
      *   *Requirement:* Must distinguish between *whether killing is allowed* and *whether the killer/combatant is culpable*.  
      *   *Why:* A conscript may be non-culpable but still permissibly killed if posing a threat.  
      *   *Status:* **NN** (Core moral distinction).

  7. **Liability vs. Desert:**  
      *   *Requirement:* Must explain why combatants are *liable* to attack (due to role/threat) without implying they *deserve* harm.  
      *   *Why:* Not all combatants are morally guilty (e.g., conscripts), but they forfeit certain rights by participating.  
      *   *Status:* **NN** (Moral precision).

  8. **Ad Bellum (Justice of War) vs. In Bello (Justice in War):**  
      *   *Requirement:* Must not collapse ad bellum and in bello judgments; in bello rules must function independently to some degree.  
      *   *Why:* Soldiers need clear, actionable rules *during* combat, regardless of their nation’s overall cause.  
      *   *Status:* **NN** (Practical action-guidance).

  9. **Combatant vs. Civilian:**  
      *   *Requirement:* Must maintain a bright(er) line between permissible targeting of combatants and impermissible targeting of civilians.  
      *   *Why:* Core of LOAC/IHL; moral intuition against harming non-threats.  
      *   *Status:* **NN** (Moral and legal bedrock).

  ---

  ### **III. Results the Theory Cannot Contradict**
  10. **Moral Asymmetry (Deep Structure):**  
      *   *Requirement:* Must acknowledge that *fundamentally*, combatants fighting for an unjust cause lack a right to kill.  
      *   *Why:* Intuition that aggression is wrong; killing in service of aggression can’t be fully justified.  
      *   *Status:* **NN** (Moral truth).

  11. **Practical Symmetry (Surface Structure):**  
      *   *Requirement:* Must explain why combatants *in practice* are treated symmetrically (e.g., POW status).  
      *   *Why:* Historical practice, reciprocity, and fog of war make ad bellum judgments unreliable *in the field*.  
      *   *Status:* **N** (Contingent reality; may be overridden).

  12. **Soldiers Kill & Are Killed:**  
      *   *Requirement:* Must permit combatants to kill enemy combatants as a central feature of war.  
      *   *Why:* Empirical reality; denying this abolishes war as we know it.  
      *   *Status:* **NN** (Empirical constraint).

  13. **Non-Criminal Combatants:**  
      *   *Requirement:* Must not imply that ordinary soldiers (even volunteers) are murderers or war criminals *by default*.  
      *   *Why:* Moral intuition; most soldiers aren’t tried for killings under lawful orders.  
      *   *Status:* **N** (Social/legal practice).

  ---

  ### **IV. Modern/Complex Cases**
  14. **Contractors & Non-State Actors:**  
      *   *Requirement:* Must assign liability based on *function* (e.g., direct participation in hostilities) not formal status.  
      *   *Why:* Moral relevance lies in posing a threat, not wearing a uniform.  
      *   *Status:* **NN** (Moral consistency).

  15. **Remote Operators (Drones, Cyber):**  
      *   *Requirement:* Must permit targeting those directly responsible for attacks (e.g., drone pilots), but not distant commanders/civilians.  
      *   *Why:* Liability stems from causal responsibility for imminent threats.  
      *   *Status:* **NN** (Moral extension of threat principle).

  ---

  ### **V. The Action-Guidance Constraint (Usability)**
  16. **Epistemic Limitation:**  
      *   *Requirement:* Must generate *actionable rules* for combatants *who cannot reliably know* if their war is just.  
      *   *Why:* Your friend’s scenario – soldiers need clear, executable rules *now*.  
      *   *Status:* **NN** (Your core constraint).

  17. **Procedural Reliability:**  
      *   *Requirement:* Rules must be simple, objective, and resistant to self-serving bias (e.g., "Don’t target civilians" > "Only target unjust combatants").  
      *   *Why:* 19-year-olds in a 20-minute briefing need unambiguous guidance.  
      *   *Status:* **NN** (Derived from usability).

  ---

  ### **VI. The Law/Morality Tension**
  18. **Accounting for Legal Symmetry:**  
      *   *Requirement:* Must explain why symmetric legal rules (e.g., equal POW status) can be *morally tolerable* even if deep morality is asymmetric.  
      *   *Why:* Law serves coordination and reciprocity; morality demands deeper justification.  
      *   *Status:* **NN** (Bridging theory/practice).

  ---

  ### **Conflict Analysis & Trade-offs**
  | **Key Conflict**                     | **Why It’s a Problem**                                                                 | **Potential Resolution**                                                                 |
  | :----------------------------------- | :------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- |
  | **Moral Asymmetry (10) vs. Usability (16-17)** | A theory acknowledging deep asymmetry (10) requires knowing *ad bellum* justice to assign liability – impossible for your friend’s briefing. | **Hybrid Approach:** Default in bello symmetry for *rules of engagement* (usability), but ground it in contingent epistemic limits, not deep morality. Emphasize individual moral responsibility where feasible (e.g., refusing *clearly* unlawful orders). |
  | **Moral Asymmetry (10) vs. Practical Symmetry (11)** | Treating combatants symmetrically in practice ignores the moral difference between just/unjust combatants. | **Walzer’s "Moral Equality":** Treat symmetry as a *concession* to war’s chaos, not a moral truth. Just combatants have a *right* to fight; unjust combatants have a *privilege* (immunity from prosecution) but no moral right. |
  | **Non-Criminal Combatants (13) vs. Moral Asymmetry (10)** | If unjust combatants lack a right to kill, why aren’t they murderers? | **Liability without Culpability:** Unjust combatants are *liable* to be killed due to their threat, but not necessarily *culpable* if excused (e.g., duress, ignorance). Their killings may be objectively wrong but not *blameworthy*. |

  **The Single Biggest Excluder: Usability (16-17).**  
  *   **Why:** Theories emphasizing deep moral asymmetry (e.g., McMahan’s revisionism) are often complex and require contested ad bellum judgments. Traditional "Moral Equality" (Walzer) thrives on simplicity and symmetry, making it vastly more usable for your friend. Usability demands rules that function *without* perfect knowledge of the war’s justice, which asymmetric theories struggle with.

  **Joint Satisfiability:**  
  *   **Possible, but with Trade-offs:** A usable theory *can* cover all desiderata, but **not perfectly**. The core tension is **Moral Truth vs. Action-Guidance**. You *can* have a theory that:
      *   Acknowledges deep moral asymmetry exists (Satisfies 10).
      *   Provides simple, symmetric *rules* for in bello conduct (Satisfies 3, 8, 11, 12, 13, 16, 17).
      *   Grounds liability in posing a threat/function (Satisfies 1, 2, 4, 5, 6, 7, 9, 14, 15).
      *   Explains legal symmetry as a pragmatic necessity (Satisfies 18).
  *   **Cost:** This approach downplays deep moral asymmetry *at the operational level*. It tells the 19-year-old: "Follow the Laws of Armed Conflict (target combatants, spare civilians, minimize harm) because these are the best achievable rules, and deviating makes you a criminal. Your individual moral duty is to refuse *clearly* illegal orders." It doesn’t tell them whether *this specific war* is just, or if the enemy soldier they face *deserves* to be targeted in some ultimate sense. It focuses on *their* conduct within their sphere of control.

  **Non-Negotiables (NN) Summary:**  
  *   Must handle conscripts, misled volunteers, defenders-in-aggressor-forces, disillusioned fighters (1, 2, 4, 5).
  *   Must preserve distinctions: Permissibility/Blame, Liability/Desert, Ad Bellum/In Bello, Combatant/Civilian (6, 7, 8, 9).
  *   Must acknowledge deep moral asymmetry exists (10).
  *   Must permit combatants to kill enemy combatants (12).
  *   Must handle liability based on function/threat (14, 15).
  *   Must be usable by someone without ad bellum knowledge (16, 17).
  *   Must account for the law/morality gap (18).

  **Recommendation for Your Friend:**  
  Adopt a **modified Traditionalist/In Bello Symmetry** approach grounded in **Threat-Based Liability** and **Epistemic Limitation**:

  1.  **Core Message:** "The law treats soldiers on both sides equally regarding who they can target (other combatants) and who they must protect (civilians, wounded, POWs). Follow these rules strictly. They are your shield and your duty."
  2.  **Why Symmetry?** "In the chaos of war, it’s impossible for soldiers to reliably judge the overall justice of the cause. These rules focus on what *you* control: minimizing suffering and distinguishing fighters from non-fighters. Disobeying them makes *you* a criminal."
  3.  **Moral Nuance (Briefly):** "While the *law* is symmetric, morality isn't always simple. If you are ever ordered to do something *clearly* wrong – like harming civilians or prisoners – you have a moral *and* legal duty to refuse. Your conscience matters." (This addresses 10/18 without undermining usability).
  4.  **Focus on Function:** "Anyone directly participating in hostilities, regardless of uniform or contract, becomes a lawful target. Anyone not participating, regardless of who they are, is protected." (Satisfies 14, 15, 9).

  This provides clear, actionable guidance compatible with the law, acknowledges the usability constraint, and carves out space for individual moral responsibility at critical junctures, satisfying the most critical NN desiderata, even if it doesn't deliver perfect moral symmetry at the operational level. It’s the best fit for a 20-minute pre-deployment briefing.
