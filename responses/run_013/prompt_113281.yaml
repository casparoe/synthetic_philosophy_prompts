  Connecting to larger themes: Geneva's small republic relies on active participation and shared values. Theater promotes passivity—spectators instead of citizens. The artificiality of staged virtue replaces genuine virtue, which requires action and engagement. The seductiveness of the image makes people prefer the appearance over reality, eroding civic virtues.

