prompt: |-
  I have no academic training in philosophy, and what follows is my own attempt at a position rather than a report of anyone else's, so please take it as it stands.

  For years I have been bothered by the old puzzle about ravens. If the claim that every raven is black is equivalent to the claim that every non-black thing is not a raven, then a white shoe appears to be a sliver of evidence that every raven is black. I have come to think that the puzzle is not really about how much a white shoe tells us, but about what a piece of evidence is evidence for. My position is this: a hypothesis is not a sentence floating free of a purpose but a tool for settling a particular question, and an observation is evidence for it only if it could change how one ought to act on that question. A black raven can change what I do about ravens; a white shoe cannot change anything I would do about ravens; therefore it is not evidence for the claim, whatever logic says about a statement and its contrapositive being one and the same. I would add that although truth is preserved when you turn a statement around, the subject matter is not, and that evidence attaches to subject matter rather than to truth-value.

  I do not want a summary of the puzzle or of the familiar replies to it. I want a map of what counts against my position: which arguments, cases or observations should move me, which are merely awkward, and which would be fatal, ranked by how decisive they are, together with an honest note on which of them I would have to concede on my own terms rather than merely being told by a critic. Three things interest me most. First, whether the position can be put in a way that is not merely a redescription of the problem: if the requirement that evidence be able to change what one does is the whole of it, does the view ever predict anything I could check, or does it simply draw the line wherever I want it drawn? Second, whether it survives cases in which an observation is useless in practice yet seems plainly to bear on the truth of a general claim — a test nobody will ever act on, or a generalisation about something nobody can do anything about. Third, what becomes of my talk of subject matter when the same fact admits two equally natural descriptions, one of which makes the white shoe relevant and the other not: is that a defect in the view, or a fact about evidence that every view must live with?

  I should say what would move me most. I would be most persuaded by a case in which an observation plainly irrelevant to ravens ought nevertheless to change what a reasonable person believes about ravens. I would be least moved by the reply that the white shoe does confirm the claim, only by a vanishingly small amount, since that seems to grant my point about what we should do and merely relabel it. Tell me if I am too quick there.
reasoning: |-
  Okay, the user presents a unique take on the Raven Paradox, rejecting standard solutions and proposing that evidence must be actionable for a specific purpose. They want critique focused on three main concerns: testability of their view, handling "useless" evidence, and descriptive relativity. 

  Hmm, their core argument is pragmatic—evidence only matters if it can influence action related to the hypothesis's subject matter. That’s clever but raises eyebrows. For testability, they worry their view might be unfalsifiable if "actionable" bends to preference. The "white shoes can’t affect raven-related actions" example is central. 

  Notably, they dismiss incremental confirmation as missing the point—interesting, since most philosophers bite that bullet. Their request for a "fatal" counterexample suggests intellectual honesty. I should avoid rehashing standard debates; they’ve clearly studied this. 

  First major hole: what about hypotheses where action is impossible? If we hypothesize all neutron stars have quark cores, a non-quark star observation would confirm it—but no one can act on it. Their view might call this non-evidence, which feels wrong. That’s probably a top-tier problem. 

  Second, descriptive relativity: if I reframe finding a white shoe as "failing to find a non-black raven," suddenly it seems raven-relevant. Their subject-matter boundary gets fuzzy here. This might force them to admit evidence depends on description—awkward for their "subject matter is fixed" stance. 

  Third, predictive weakness: if "actionable" is defined per context, their view risks being retroactive ("this wasn’t actionable because I didn’t act"). They need clear criteria for when evidence should trigger action. Without that, it’s just labeling. 

  They’d concede the impractical-test case (e.g., impossible physics experiment) undermines the strong action requirement. For relativity, they might argue descriptions must be "purpose-relative," but that needs fleshing out. The unfalsifiability charge is toughest—if no independent test for "could change action," the view collapses. 

  Surprisingly, they’d resist the incremental confirmation reply least. Smart—their critique is about relevance, not degree. A better counter: a white shoe could indirectly affect raven beliefs (e.g., if shoes and ravens share habitats). But they’d likely dismiss that as stretching "raven-related" actions. 

  Fatal flaw? Probably the impractical evidence case. If they admit neutron star observations confirm theories despite no possible action, their view breaks. They’d have to either accept that or bite a very hard bullet. 

  Overall, their position is original but has soft spots. They’re clearly thoughtful; pushing them on edge cases where pragmatism clashes with intuition about evidence would advance the conversation. No need to coddle—they want rigor.
answer: |-
  Your position is a thoughtful pragmatist/pragmaticist approach to evidence, prioritizing action and subject matter over logical equivalence. Below is a critique structured by decisiveness, highlighting potential weaknesses using your own terms. I’ll rank challenges as **Fatal**, **Strongly Undermining**, or **Awkward but Survivable**, and note where you’d need to concede.

  ---

  ### **1. Fatal Challenge: Impractical Evidence for Untouchable Phenomena**
  **The Case**:  
  Consider a hypothesis about an unreachable domain:  
  *"All dark matter particles (DMPs) in the Virgo Cluster have spin 1/2."*  
  We observe a *non*-spin-1/2 particle in a lab on Earth. This *isn’t* a DMP, but by the contrapositive, it technically confirms the hypothesis (since it’s a non-spin-1/2 thing that isn’t a Virgo DMP).  

  **Why it’s fatal**:  
  - **On your terms**: This observation *cannot* change any action related to DMPs (we can’t interact with or manipulate them). Your view must deny this is evidence.  
  - **The problem**: Intuitively, this *should* strengthen belief in the hypothesis. It eliminates a potential falsifier (a non-spin-1/2 DMP) from the observable universe. If we found a spin-1/2 particle instead, it would do nothing (since DMPs might still have different spin).  
  - **Your concession**: You’d have to deny this is evidence—but this clashes with scientific practice and intuition. If "ought to act" requires *practical* possibility, your view dismisses evidence for untestable claims.  

  ---

  ### **2. Strongly Undermining: Descriptive Relativity & Framing Effects**
  **The Case**:  
  The "white shoe" can be redescribed in two equally natural ways:  
  - *Aspect 1*: "Observing a white shoe" (subject matter: shoes).  
  - *Aspect 2*: "Failing to observe a non-black raven during a sampling procedure" (subject matter: ravens).  

  **Why it undermines**:  
  - **Your claim**: Evidence attaches to subject matter. But if the *same observation* has two descriptions—one shoe-related, one raven-related—is it evidence for the raven hypothesis or not?  
  - **The conflict**:  
    - Under *Aspect 1*, it’s irrelevant (as you argue).  
    - Under *Aspect 2*, it *is* evidence: sampling non-black objects and finding no ravens *does* support "all ravens are black" (e.g., in ecology, absence counts).  
  - **Your dilemma**:  
    - If evidence depends on the *description chosen*, your view becomes subjective (based on how we frame the observation).  
    - If it depends on the "true" subject matter, you need an objective criterion to resolve competing descriptions—which your view lacks.  
  - **Your concession**: You’d likely need to accept that descriptions matter, making evidence context-dependent. This weakens the claim that subject matter is fixed.  

  ---

  ### **3. Awkward but Survivable: Predictive Weakness & Circularity Risk**
  **The Challenge**:  
  You worry your view might be a mere redescription. Test: *Can it predict whether a *new* observation is evidence before we decide how to act?*  

  **The Problem**:  
  - Your criterion ("could change how one ought to act") risks circularity:  
    - *Q*: "Why isn’t a white shoe evidence?"  
    - *A*: "Because it couldn’t change raven-related actions."  
    - *Q*: "Why couldn’t it change actions?"  
    - *A*: "Because it’s not evidence."  
  - **To survive**: You must define "could change action" independently. Example: An observation is evidence if it *rationally prescribes* a change in *hypothesis-dependent behavior* (e.g., seeking ravens vs. non-black things).  
  - **Prediction test**: In a novel scenario (e.g., "All Martian caves contain lichen"), observing a lichen-free Earth cave *should not* affect actions regarding Martian caves. This is falsifiable if someone argues it *should*.  

  **Verdict**: Awkward but fixable with careful definitions.  

  ---

  ### **4. Weak Rejoinder: Incremental Confirmation**
  You’re right to dismiss "the white shoe confirms negligibly" as missing your point. If evidence must be *actionable*, minuscule confirmation is irrelevant—it still doesn’t affect *doing*. This reply doesn’t engage your core argument.  

  ---

  ### **Ranked Summary of Challenges**  
  | **Rank** | **Challenge**                          | **Decisiveness**       | **Your Concession Needed**         |  
  |----------|----------------------------------------|------------------------|-----------------------------------|  
  | 1        | **Untouchable Phenomena** (e.g., dark matter) | Fatal               | Must deny evidence exists for practically inert hypotheses. |  
  | 2        | **Descriptive Relativity** (framing the shoe) | Strongly Undermining | Accept evidence depends on description, not "fixed" subject matter. |  
  | 3        | **Predictive Weakness**                | Awkward              | Define "could change action" non-circularly (e.g., via rational prescription). |  

  ---

  ### **Conclusion**  
  Your strongest insight—that evidence must be tethered to *action within a domain*—avoids the paradox’s absurdity but faces hard limits:  
  1. **Fatal for inaccessible realms** (e.g., cosmology), where you must reject intuitive evidence.  
  2. **Vulnerable to framing**: If redescribing an observation shifts its subject matter, your view either becomes subjective or needs a theory of "natural" descriptions.  
  3. **Salvageable with refinement**: Specify how "could change action" is assessed (e.g., counterfactual: *If* we could act, *would* this alter our choices?).  

  You’d concede most on **untestable hypotheses** and **descriptive relativity**, but the core pragmatism survives if restricted to *empirically actionable* inquiries. This aligns with Deweyan instrumentalism but leaves abstract truths behind.
