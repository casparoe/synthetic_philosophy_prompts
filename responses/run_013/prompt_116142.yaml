prompt: |-
  I serve on my university's honorary degrees committee, and we are currently considering a nomination that has forced me to think carefully about the ethics of killing in war. The nominee is a former Secretary of Defense who, during his tenure, authorized a drone strike against a terrorist leader. The strike was aimed at the leader, who was a legitimate military target, but it was carried out on a house where his family was present, and the family—his wife and two children, none of whom were combatants—were killed. The Secretary has said that the family's deaths were a foreseeable but unintended side effect of the operation, and that the strike was the only feasible way to kill the leader, who was planning further attacks.

  I have been reading Elizabeth Anscombe, because she is the philosopher who famously opposed Oxford's decision to award an honorary degree to Harry Truman on the grounds that he was a murderer for authorizing the bombings of Hiroshima and Nagasaki. I am trying to figure out what she would say about our nominee. From her writings on Truman and on war, I have extracted the following pattern of verdicts: she holds that Truman was a murderer; she holds that the terror bombing of cities, where civilians are killed as a means to break the enemy's will, is murder; she holds that killing enemy soldiers in battle is not murder; she holds that killing a hostage to force a concession is murder; and she holds that killing a healthy person in order to harvest their organs for others is murder.

  What I cannot tell is what she would say about a case like our nominee's, where the victims are innocent civilians but their deaths are a foreseen side effect of an attack on a legitimate military target rather than a means to the attack's success. Would she call the Secretary a murderer, as she called Truman a murderer? Or would she distinguish the cases? I would like you to predict her verdict on the drone strike, identify the rule or principle she is implicitly running across the verdicts I have listed, say whether that rule is the one she actually holds or whether a different rule fits her verdicts just as well, and tell me which further case would best discriminate between the candidate rules. I am less interested in a general essay on just war than in a careful extrapolation from the verdicts I have given you.
reasoning: |-
  Okay, the user is on their university's honorary degrees committee and is grappling with whether to award an honorary degree to a former Secretary of Defense who authorized a drone strike that killed a terrorist leader's family. They're specifically interested in Elizabeth Anscombe's potential judgment on this case, based on her known positions. 

  The user has done impressive homework—they've mapped Anscombe's verdicts on Truman, terror bombing, combatant killing, hostage execution, and organ harvesting. But they're stuck on the "foreseen side effect" scenario. This is a classic double effect problem, and Anscombe was famously rigorous about intention. 

  Hmm... the key is whether Anscombe would see the family's deaths as intended or merely foreseen. The user's description suggests the Secretary viewed their deaths as collateral damage, not as leverage. But Anscombe might be skeptical—did the operation *rely* on the family's presence? Or was it truly incidental? 

  The user also wants me to identify Anscombe's implicit rule. From their examples, it's clearly the prohibition against intentional killing of innocents as either end or means. Terror bombing uses deaths as means; hostage killing as means; organ harvesting as means. Combatant killing is acceptable because soldiers aren't innocents. 

  But could proportionality matter too? In the hostage/organ cases, even if you didn't "intend" death, Anscombe would still condemn it if death was certain. Yet in war, she accepted foreseen civilian deaths if truly unintended. So the rule is: never intentionally kill innocents, but foreseeing their death may be tolerable if it's not part of the plan. 

  To test this, I should propose a case where intention is ambiguous—like bombing a military factory knowing workers will die, versus bombing workers to demoralize the enemy. Anscombe would condemn the latter. The drone strike feels closer to the factory case, but... wait, was the house a legitimate target? If the family was the only ones present, it's messier. 

  The user is clearly wrestling with their conscience. They want philosophical clarity, not just procedural advice. I should emphasize that for Anscombe, the moral weight rests entirely on whether the deaths were instrumentalized. If the Secretary genuinely didn't need the family to die for the strike to succeed, she might not call it murder. But given her harshness toward Truman—who also claimed collateral damage—she'd likely demand extreme justification.
answer: |-
  Based on Anscombe's established verdicts and her core philosophical principles, here's a careful extrapolation predicting her judgment on the drone strike case:

  1.  **Predicted Verdict:** Anscombe would **condemn the Secretary's action as murder**, similar to her condemnation of Truman.

  2.  **The Implicit Principle/Rule Anscombe is Running:**
      *   **The Principle:** **It is absolutely forbidden to intentionally kill the innocent.**
      *   **Key Distinction:** **Intention vs. Foresight.** What matters is *whether the death of the innocent is intended as an end or as a means to an end*, not merely whether it was foreseen. If the death is part of the plan's *intended structure* (either as the goal or as a necessary step to achieve the goal), it is murder. If the death is a *foreseen but genuinely unintended side-effect* of an action whose *object* is legitimate, it *might* be permissible under the principle of double effect, subject to proportionality.
      *   **Application to Verdicts:**
          *   **Truman:** The *point* of bombing Hiroshima/Nagasaki was to break Japanese will *by* destroying the cities and killing civilians. Civilian death was the *means* to the end of surrender. Therefore, intentional killing of innocents = Murder.
          *   **Terror Bombing:** Civilians are killed *in order to* break the enemy's will. Their death is the *means* to the end. Therefore, intentional killing of innocents = Murder.
          *   **Killing Enemy Soldiers:** The object is to stop a combatant posing a direct threat. Their death is intended as the means to stop the threat. Soldiers are *not* "innocent" in the relevant sense (they are legitimate targets). Therefore, not murder.
          *   **Killing a Hostage:** The hostage's death is *intended* as the means to force the concession. Therefore, intentional killing of an innocent = Murder.
          *   **Killing for Organs:** The healthy person's death is *intended* as the necessary means to harvest organs. Therefore, intentional killing of an innocent = Murder.

  3.  **Why She Would Condemn the Drone Strike (Applying the Principle):**
      *   Anscombe would be deeply skeptical of claims that the deaths of the family were merely a "foreseen side effect" and not intended *in any way* as part of the plan's structure.
      *   **The Means Question:** She would ask: *Was the presence of the family, and their consequent death, part of the calculation that made the strike feasible or effective?* If the strike was knowingly undertaken *on a house containing non-combatants* and their deaths were *foreseen as certain or highly probable*, Anscombe would argue that their deaths become part of the *intended means* to kill the leader. Carrying out the strike *required* accepting their deaths as a condition of success; it wouldn't have been done if the family *weren't* there to be killed alongside him? This makes their deaths functionally integral to the plan's execution.
      *   **Proximity & Certainty:** The strike targeted a *home*, not a battlefield or military installation. The non-combatants were *known* to be present, and their deaths were not just possible but *foreseen* (as admitted). This level of certainty and proximity makes it extremely difficult to claim their deaths were truly "collateral damage" and not an accepted part of the attack's mechanism.
      *   **The Truman Parallel:** Anscombe would see a direct parallel to Hiroshima/Nagasaki: a foreseeable, near-certain death of innocents was accepted as the necessary condition for achieving the military objective. She rejected the "side effect" justification in Truman's case, seeing the civilian deaths as intended means to the end of surrender. She would likely apply the same stringent logic here.

  4.  **Is this her actual rule? Does another rule fit?**
      *   **Yes, this is her actual rule:** Anscombe explicitly championed the absolute prohibition on intentional killing of the innocent and the Doctrine of Double Effect (DDE). Her writings on Truman, modern warfare, and morality consistently focus on intention as the critical factor separating permissible acts of war from murder. Her condemnation hinges on whether innocents are targeted or their deaths are used.
      *   **Alternative Rule? - Proportionality:** One might think proportionality is the key rule (e.g., Truman's bombing was disproportionate). While proportionality matters *if* the DDE applies (the unintended bad effect must be proportionate to the intended good), Anscombe's primary and absolute barrier is the intentionality rule. She condemned Truman *even if* proportionality could be argued, because the killing was intentional. Her verdicts on terror bombing, hostages, and organ harvesting are all driven by intentionality, not primarily by disproportionality (though disproportionality would compound the wrong).

  5.  **Discriminating Case to Test the Rules:**
      *   **The Case:** Bombing a *legitimate and critical military target* (e.g., a command bunker, a major weapons factory actively producing WMDs) located deep within a civilian area. The attack is militarily necessary to win a just war. Intelligence confirms the presence of numerous civilians (workers, nearby residents) such that *a large number of civilian deaths (e.g., hundreds) is certain and foreseen*. The deaths are not the *means* to destroy the target; destroying the target is the direct effect of the bombs. The civilian deaths are a side-effect of the location. However, the commander knows that the *scale* of civilian casualties will also have a demoralizing effect on the enemy population.
      *   **Discriminating the Rules:**
          *   **Under the Intentionality Rule (Anscombe's Rule):** The key question is the commander's intention. If the commander *intends* the civilian deaths *as a means* to demoralize the enemy, the action is murder. If the commander *solely intends* the destruction of the military target, and the civilian deaths, while foreseen and proportionate to the military objective, are *genuinely unintended* (even if the demoralization is a welcome *further* consequence), Anscombe *might* consider it permissible under DDE (subject to proportionality). The focus is intensely on the subjective intention regarding the civilian deaths.
          *   **Under a Strict Proportionality Rule:** The permissibility would hinge primarily on whether the military advantage gained (destroying the critical target) is sufficiently great to outweigh the *foreseen* civilian deaths, regardless of whether those deaths were intended *as a means* or not. The demoralization effect might even be counted as a *positive* factor justifying the proportionality calculation further.
      *   **Why it Discriminates:** This case separates the *intention* of the deaths (as means vs. side-effect) from the *foreseen consequence* and its *scale/proportionality*. Anscombe's rule demands we scrutinize the agent's intention towards the innocent deaths above all else. A rule focused solely on proportionality or overall consequences would focus on the balance of outcomes. Anscombe would condemn the action if the civilian deaths were *intended* to demoralize (making them a means), even if the target was legitimate and proportionality could be argued. She would *potentially* permit it (if proportionate) if the deaths were *truly* unintended side-effects, even if very large and foreseeably demoralizing.

  **Conclusion:** Based on Anscombe's unwavering principle prohibiting the intentional killing of innocents as end or means, and her specific condemnation of Truman in a closely analogous situation (foreseen, near-certain civilian deaths accepted as the condition for achieving a military objective), she would almost certainly condemn the Secretary's authorization of the drone strike as murder. The key factor for her is not foresight alone, but whether the deaths of the innocents were functionally part of the intended plan to achieve the objective. The proposed discriminating case highlights how intention, not just consequence or proportionality, is the bedrock of her moral analysis.
