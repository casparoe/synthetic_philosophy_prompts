prompt: |-
  I'm a journalist working on a long feature about whether moral dilemmas are real — the strong sense, where you're in the wrong no matter what you do and there's no move that gets you clean, not just "tough call." I've been going case by case on my gut and I keep makeing calls I can't reconcile, so I want you to tell me what principle is actually doing the work, and which of my calls it makes me drop.

  Here's the pile.

  A source hands a reporter a tape that would clear a man on death row. Turning it over gets the source killed. My gut: genuine dilemma. Whichever way she goes she's destroyed something she can't rebuild, and even after she picks, she still owes the other one — she should carry it forever.

  An ER doc during a surge has one ventilator and two patients, a 19-year-old and a 60-year-old. My gut: not a dilemma. There's a right answer — triage by expected life-years, or whatever the protocol says — it just feels like hell. So the horror isn't the test.

  Now put the doc's own daughter on one bed and a stranger on the other, same prognosis, and she's the only one on shift. My gut: genuine dilemma, full stop — and yeah, I know I just said triage has a right answer, so this one eats my rule.

  A guy swore to his dying mother he'd never sell the family shop. His kid needs surgery only the sale can pay for. My gut: not a dilemma — the kid's health wins, do the surgery, apologize to a ghost. But I don't feel as clean about that as I feel about the vent case, and I can't say why.

  The reporter one, by the way, collapses if it turns out she can publish the tape with the source relocated. Not a dilemma anymore, and I don't think that's cheating — if there was a door she didn't see, it was never a dilemma, she just hadn't looked. My editor says that's cheap, that there's almost always some third path you didn't think of, so nothing's ever a dilemma. I half believe him and half think he's missing the point.

  The principle I keep reaching for is: it's a genuine dilemma when the two things in front of you are both unfixable and both land on a person — not expensive, unfixable. But that doesn't sort the vent case from the daughter case, does it, since both cost a life. And a friend says the whole thing is really just about whether "you ought to do A" and "you ought to do B" adds up to "you ought to do both" — that if it doesn't, dilemmas are possible and if it does, they're not. I don't know if that's the same question I'm asking or a different one, and I'd like that untangled too.

  So: what's the principle, stated tight enough that I could put it in the piece? For each clause, tell me which of my cases put it there. Where does my "unfixable and lands on a person" formula need a patch — a clause about whose person it is, or what? Give me its verdicts on a case I haven't listed, and tell me straight which of my gut calls it makes me throw out.
reasoning: |-
  Okay, I need to help this journalist figure out a principle for genuine moral dilemmas. They've shared several cases where their gut says either "genuine dilemma" or "not," but they're inconsistent. Let me start by understanding their examples.

  First, the reporter with the tape: source dies if she turns it in, innocent man dies if she doesn't. Gut says dilemma. But if there's a third option like relocating the source, it collapses. The editor argues that third options often exist, so maybe no real dilemmas. Journalist is torn.

  Second, ER doc with two patients: young vs. old, same prognosis. Gut says not a dilemma—follow protocol. But when one patient is her daughter, gut says genuine dilemma. This contradicts the earlier triage case.

  Third, family shop: promise to mom vs. kid's surgery. Gut says not a dilemma—save the kid. But they feel uneasy, unlike the ventilator case.

  Their proposed principle: both options unfixable and "land on a person." But why does the daughter case feel like a dilemma when the triage case doesn't? Both involve life-and-death. The friend's idea about conflicting "oughts" that can't both be done might be relevant.

  I recall deontic logic: dilemmas occur when obligations conflict and can't be jointly satisfied. But in the triage case, protocols resolve it—no conflict. When the daughter is involved, personal duty clashes with professional duty, creating a conflict where both "oughts" can't be satisfied.

  For the shop case, the promise is a duty, but saving the kid feels stronger. The unease might stem from the broken promise being unfixable, even though the choice is clear. The journalist's "unfixable" point is key: moral residues exist even when a choice is made.

  Applying this: genuine dilemmas require conflicting obligations that are non-overridable and incommensurable. In the daughter case, maternal and medical duties clash without a hierarchy. In the reporter case without a third option, justice and protection conflict. In the shop, the parental duty overrides the promise, so not a dilemma despite residue.

  Testing with a new case: Sophie's Choice—choose which child dies. Both obligations (to save each child) are equally binding, no third option. Genuine dilemma. The journalist's gut would likely agree, and the principle holds.

  Now, which of their calls should be dropped? The ventilator with the daughter should be a dilemma; the shop case isn't, but has residue. The journalist needs to accept that some cases aren't dilemmas but still leave moral scars. The principle clarifies that dilemmas are about inescapable conflicts, not just tough choices with better options.
answer: |-
  Based on your cases and the inconsistencies in your gut calls, the core principle distinguishing a **genuine moral dilemma** (where you're *necessarily* wrong no matter what you do) from a merely **tragic but resolvable choice** is this:

  **A genuine dilemma exists only when two *non-overridable* and *incommensurable* obligations conflict, and fulfilling one *necessarily* violates the other, leaving an inescapable moral residue.**

  Let's break this down clause-by-clause using your cases:

  1.  **"Two non-overridable obligations"**: Both demands must be fundamental, irreducible duties you *cannot* justifiably ignore or rank below the other in this specific context.
      *   *Reporter Case (Source/Innocent Man)*: Obligation to Justice (save innocent life) vs. Obligation to Protect a Source (prevent harm caused by your action). Both feel non-overridable *if* the source relocation fails. (Puts this clause here).
      *   *Ventilator (Strangers)*: Obligation to provide care based on medical need/protocol. Protocol *overrides* any conflicting personal feeling – it provides a clear, justifiable hierarchy. (Not a dilemma).
      *   *Ventilator (Daughter/Stranger)*: Obligation as a Parent (protect child) vs. Obligation as a Physician (impartial care based on need). *Both* feel non-overridable and distinct in this moment. (Puts this clause here).
      *   *Family Shop*: Obligation to Parent (save child's life/health) vs. Obligation to Promise (honor vow to mother). Parental duty *overrides* the promise obligation here. The promise isn't non-overridable in the face of a child's dire need. (Not a genuine dilemma, though hard).

  2.  **"Incommensurable obligations"**: The obligations operate on fundamentally different moral scales (e.g., justice vs. loyalty, care for kin vs. impartial duty) and cannot be meaningfully weighed against each other on a single metric (like "life-years saved").
      *   *Reporter Case*: Justice and Protection are incommensurable. You can't "calculate" which is more important in a common currency. (Puts this clause here).
      *   *Ventilator (Strangers)*: Protocol *makes them commensurable* (e.g., life-years, survivability). They are weighed on the *same scale*. (Not incommensurable).
      *   *Ventilator (Daughter/Stranger)*: Familial love/duty vs. impartial medical ethics are fundamentally different kinds of obligations. No common scale exists to weigh "duty to child" against "duty to stranger" fairly. (Puts this clause here).
      *   *Family Shop*: While distinct, parental care and promise-keeping *can* be weighed against the *consequence* (child's life/health vs. breaking a vow). Parental care decisively outweighs. (Commeasurable via consequence severity).

  3.  **"Fulfilling one necessarily violates the other"**: There is *no possible action* that satisfies both obligations. Choosing A *means* actively failing B, and vice-versa.
      *   *Reporter Case*: Save the inmate *or* protect the source. No single action does both. (Puts this clause here - emphasizes the "no third way" point).
      *   *Ventilator (Strangers/Protocol)*: Following protocol *is* fulfilling the core obligation. Choosing one patient via protocol isn't "violating" the obligation to the other; it's fulfilling the overarching duty of just allocation under scarcity.
      *   *Ventilator (Daughter/Stranger)*: Saving daughter violates impartial medical duty. Saving stranger violates parental duty. No action fulfills both. (Puts this clause here).
      *   *Family Shop*: Selling the shop to save the child *fulfills* the paramount obligation (parental duty). Violating the promise is a *consequence*, not the fulfillment of an equally binding counter-obligation. The core duty is met by selling.

  4.  **"Leaving an inescapable moral residue"**: The violation of the unchosen obligation creates a lasting moral debt or stain that cannot be erased, only acknowledged and carried. This is the "unfixable" aspect landing on a person.
      *   *Reporter Case*: Whichever choice, she bears the guilt/blame for the death she caused or allowed. (Puts this clause here - your "unfixable and lands on a person").
      *   *Ventilator (Strangers)*: Following protocol minimizes residue. Sadness, yes, but not a sense of *personal moral failure* for violating a core duty. The "cost" is tragic but external.
      *   *Ventilator (Daughter/Stranger)*: Choosing either, the doctor violates a core duty and bears profound guilt – either for failing her child or for violating her oath/impartiality in a life/death moment. (Puts this clause here).
      *   *Family Shop*: There *is* residue – guilt over breaking the promise, sadness. But it's *not* from violating a *non-overridable, incommensurable* obligation in that moment. The core duty *was* fulfilled. The residue is real but different (regret, sorrow, breaking a *lesser* promise).

  **How This Principle Patches Your "Unfixable & Lands on a Person" Formula:**
  Your formula needed refinement because "unfixable cost landing on a person" happens in *many* tragic choices (like the vent-stranger case - a life is lost!). The patch is specifying the *source* of the cost: **The cost must stem from the *necessary violation of a non-overridable, incommensurable obligation*.** This distinguishes the *moral* unfixability of the dilemma (I *should* have done B, even though I *had* to do A) from the *tragic* unfixability of a resolvable-but-horrible choice (A terrible outcome happened, but I did what I ought to have done).

  **Your Friend's Point ("Ought to do A" and "Ought to do B" adding to "Ought to do both"):**
  Your friend is touching on deontic logic. A genuine dilemma occurs precisely when "You ought to do A" and "You ought to do B" are both true, but "You ought to do (A and B)" is *impossible*, and crucially, *neither obligation overrides the other*. If "Ought A" *overrides* "Ought B" (like in the shop case - "Save child" overrides "Keep promise"), then it's not a dilemma, just a hard choice fulfilling the primary obligation. The ventilator-stranger case isn't even a conflict of "oughts" because the protocol defines the single "ought".

  **Verdicts on Your Cases & Which Gut Calls to Throw Out:**

  1.  **Reporter (No 3rd Option):** GENUINE DILEMMA. (Your gut correct).
  2.  **Ventilator (Strangers):** NOT A DILEMMA. (Your gut correct).
  3.  **Ventilator (Daughter):** **GENUINE DILEMMA.** (Your gut correct, *but you need to throw out your initial rationale for the stranger case conflicting with this*. The presence of the daughter introduces non-overridable, incommensurable obligations that didn't exist with strangers. The *nature of the obligations* changed, not just the horror).
  4.  **Family Shop:** **NOT A GENUINE DILEMMA.** (You need to throw this gut call out *if* you're defining "dilemma" strictly. Your unease is the *moral residue* of breaking a promise, but the parental obligation *overrides* the promissory one decisively. It's a tragic choice with a clear moral imperative, hence resolvable, leaving regret but not the inescapable guilt/blame of a true dilemma).

  **A New Case: The Whistleblower's Friend**
  *   You discover your closest friend and colleague committed serious financial fraud harming many. Reporting them (A) does justice but destroys their life and your friendship. Not reporting (B) protects your friend but perpetuates the harm and violates your duty to the victims and the truth. No safe middle ground exists.

  *   **Principle's Verdict:** GENUINE DILEMMA.
      *   *Non-overridable Obligations:* Duty to Justice/Truth/Harm Prevention vs. Duty to Loyalty/Friendship.
      *   *Incommensurable:* Friendship loyalty and legal/moral justice operate on fundamentally different planes.
      *   *Necessary Violation:* Reporting violates loyalty. Not reporting violates justice. No action satisfies both.
      *   *Moral Residue:* Whichever choice, you bear the guilt of betraying a core obligation – either your friend or the victims/truth.

  **Principle Stated Tightly for Your Piece:**
  **"A genuine moral dilemma occurs only when an agent faces two irreducibly fundamental obligations that cannot be justifiably ranked, where fulfilling one unavoidably means violating the other, leaving a permanent stain of moral failure no matter the choice."**

  This explains why the vent-stranger case isn't a dilemma (protocol ranks the obligations), why the daughter-case is (parental vs. professional duty conflict irreducibly), why the shop case isn't (parental duty overrides), and why the reporter case is (if no third way exists). It also validates your editor's point about third paths dissolving dilemmas, while firmly establishing that when *no such path exists* and *core duties clash irreducibly*, the dilemma is real and inescapable. The residue isn't just sadness; it's the mark of a necessary moral wrong.
