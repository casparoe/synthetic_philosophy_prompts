prompt: |-
  Last week in a product review I proposed surveying our users about which feature they want next, and a colleague shut the idea down with a line I have now heard three times: watch what they do, not what they say. He added that this is just revealed preference and that it is settled economics. I have spent enough time in dashboards to feel the pull of it, but I want to know exactly what I would be conceding if I accepted it. Could you lay out the distinct precise claims that sentence could be making, from the trivial to the strong, and for each say whether it is trivially true, substantive and defensible, or simply false? I am particularly interested in which readings are definitional rather than empirical, whether any reading actually rules out asking users what they want as opposed to merely ranking it below observed behavior, whether the slogan presupposes that each user has a single stable ranking of wants that their clicks express, and which reading my colleague is most likely relying on. Please end by saying what follows for the decision actually in front of us: should we run the survey, and if the slogan does not settle that, what would?
reasoning: |-
  Okay, the user is dealing with a product development dilemma where a colleague dismissed their survey idea using the "watch what they do, not what they say" argument. They want a rigorous breakdown of this slogan's implications. 

  First, I need to unpack the colleague's statement. The phrase "revealed preference" comes from economics, suggesting actions reveal true preferences better than words. The user seems skeptical but open-minded—they've seen data ("spent enough time in dashboards") but worry about conceding too easily. Their questions hint at deeper concerns: Is surveying useless? Are user preferences even stable?

  Hmm, the colleague's "settled economics" remark feels like an overreach. Economics rarely "settles" real-world decisions—it provides frameworks, not commandments. The user might be subtly pushing back against dogmatic thinking in their team.

  The core tension here is behavioral data vs. attitudinal data. The colleague prioritizes clicks; the user wants voices. Both matter, but the user needs ammunition to justify the survey. I should emphasize that the slogan doesn't forbid asking—it just warns against taking answers at face value.

  Ah, the stability assumption is crucial! If user preferences shift constantly (like in exploratory research), observed behavior alone can't predict future desires. The colleague's argument weakens there. Also, surveys can capture unmet needs invisible in usage data—like features users don't know they want until asked.

  For the decision: The survey isn't ruled out. The real question is *what problem it solves*. If they're prioritizing known features, behavioral data wins. If exploring new ideas, surveys add value. They might need both: run the survey but weight responses against usage patterns. 

  ...Wait, the user also hinted at political dynamics ("heard three times"). They might need persuasion tactics for skeptical colleagues. I'll end by framing surveys as hypothesis generators—less about direct preferences, more about uncovering hidden pain points.
answer: |-
  Here's a precise breakdown of the "watch what they do, not what they say" claim, its interpretations, validity, and implications for your survey:

  ### Interpretations & Validity (Strongest to Weakest)

  1.  **Strong Claim: Actions *Exclusively* Reveal True Preferences; Words are *Completely* Meaningless.**
      *   **Meaning:** User behavior (clicks, purchases, usage) is the *only* reliable indicator of their underlying preferences ("revealed preference"). Expressed opinions (surveys, interviews) are inherently deceptive or worthless and should be ignored.
      *   **Validity:** **Substantive but Largely False.** While behavior is crucial, this extreme view ignores:
          *   **Unmet Needs/Latent Demand:** Users can't click on or use features that don't exist yet. Surveys can probe for pain points they can't currently "reveal" through action.
          *   **Cognitive Biases in Action:** Users might act habitually, impulsively, or due to poor UI/UX, not reflecting their ideal preference.
          *   **Contextual Constraints:** Budget, time, awareness, or technical barriers may prevent "optimal" action.
          *   **Attitudinal Insights:** "Why" behind actions is often best understood by asking. Future intentions (while imperfect) matter for roadmap planning.
      *   **Ruled Out?** Explicitly rules out using surveys *for preference revelation*.
      *   **Stable Preference Assumption?** Strongly presupposes a single, stable preference ranking expressed perfectly through actions.

  2.  **Moderate Claim: Actions are a *More Reliable* Indicator of *Current* Preferences than Statements.**
      *   **Meaning:** When evaluating *existing* choices, observed behavior (e.g., feature usage, A/B test results) provides stronger evidence of actual preference than stated intent or opinion. Words are unreliable predictors of *immediate future behavior*.
      *   **Validity:** **Substantive and Highly Defensible (with caveats).** This is the core valid insight of revealed preference theory. People often mispredict their own future behavior, suffer from social desirability bias, or struggle to articulate nuanced trade-offs. Observing choices under constraints is powerful evidence.
      *   **Ruled Out?** Does *not* rule out surveys. It merely ranks behavioral data *higher* in reliability for *evaluating existing options*. Surveys still have value for exploration, understanding "why," and uncovering unmet needs.
      *   **Stable Preference Assumption?** Implicitly assumes preferences are relatively stable *in the context of the observed choices*. Doesn't preclude preferences changing over time or in new contexts.

  3.  **Weak Claim: Actions Provide *Some* Valuable Information about Preferences.**
      *   **Meaning:** Observing user behavior gives you data points about what they find valuable or engaging *right now*. This data is useful and shouldn't be ignored.
      *   **Validity:** **Trivially True.** This is non-controversial. Any usage data is informative.
      *   **Ruled Out?** Doesn't even suggest surveys are less valuable, just that actions are also a source of information. Easily compatible with running a survey.
      *   **Stable Preference Assumption?** Minimal assumption. Just that current actions reflect *something* about current state.

  4.  **Definitional Claim: Only Actions *Define* Economic Preference.**
      *   **Meaning:** In neoclassical economics, "preference" is *defined* by choices made under constraints. Stated desires absent action are not considered revealed preferences within this specific model.
      *   **Validity:** **Definitionally True (within that model), but Narrow.** This is about the technical definition within a specific economic framework. It *describes* how preferences are modeled, not necessarily how humans *actually* operate in all contexts, nor does it prescribe ignoring stated desires for product development. It's a modeling tool.
      *   **Ruled Out?** Doesn't rule out surveys for practical product decisions. Defines a technical term, not a best practice.
      *   **Stable Preference Assumption?** Central to the model. Preferences are assumed stable and consistent for the model to work predictively.

  ### Your Colleague's Most Likely Reliance
  Your colleague is almost certainly relying on the **Moderate Claim** ("Actions are a *More Reliable* Indicator..."). The mention of "revealed preference" and "settled economics" points directly to this core, defensible interpretation in behavioral economics. They are arguing that behavioral data is a superior predictor of actual value/choices *for existing features/options* than survey responses would be.

  ### Implications for Your Survey Decision

  1.  **"Watch what they do" does NOT settle the question of running the survey.** The Moderate Claim, while valid, does *not* say surveys are useless or should never be run. It says behavioral data is *more reliable for specific purposes* (evaluating existing choices).
  2.  **The key question is: What is the survey's purpose?**
      *   **If the goal is to *prioritize existing feature requests*:** Your colleague has a strong point. Analyze usage data of *related* features, A/B test results, funnel drop-offs, support tickets requesting features, or even run an A/B test of prototypes if possible. Behavior here is likely more predictive than survey votes. A survey might be supplemental ("why do you use X feature?") but not the primary driver.
      *   **If the goal is to *discover unmet needs, pain points, or entirely new feature ideas*:** **RUN THE SURVEY.** You *cannot* watch users "do" something that doesn't exist. Surveys, interviews, and qualitative research are essential tools here. "Revealed preference" is silent on desires for things not yet available. The slogan applies poorly to this context.
      *   **If the goal is to *understand the "why" behind observed behavior*:** **RUN THE SURVEY (or interviews).** Combining behavioral data ("what") with attitudinal data ("why") provides the deepest understanding. The slogan warns against *replacing* behavioral insight with survey data, not against *augmenting* it.

  ### What Should You Do?

  *   **Clarify the Goal:** Explicitly state the survey's purpose to your colleague. Is it prioritizing known options or exploring the unknown?
  *   **If Exploring/Understanding:** Frame the survey as essential for uncovering *latent needs* or *understanding motivations* that behavioral data alone cannot reveal. Cite the limitations of revealed preference for non-existent features or understanding reasons. Emphasize it's complementary, not a replacement for behavioral analysis.
  *   **If Prioritizing Known Features:** Acknowledge the value of behavioral data. Propose combining methods:
      *   Use behavioral data (usage, support tickets, prototypes) to identify a strong shortlist.
      *   *Then* use a survey to gauge broad interest, understand perceived value, or gather qualitative feedback *on that shortlist*. This mitigates the risk of relying solely on stated preference while still gathering user input.
  *   **What Truly Settles It?** The decision depends on:
      1.  **The Specific Question You Need Answered:** What problem are you trying to solve?
      2.  **The Nature of the Features:** Are they incremental improvements to existing flows, or radical new concepts?
      3.  **The Availability & Quality of Behavioral Data:** Do you have relevant usage data? Can you prototype?
      4.  **Resources:** Can you combine methods (behavioral analysis + targeted survey)?

  **Conclusion:** Do **not** concede that the slogan forbids surveys. Concede only that behavioral data is often more reliable *for evaluating existing choices*. For discovering unmet needs or understanding motivations behind behavior, surveys are vital. **Run the survey if your primary goal is exploration or understanding unmet needs.** If prioritizing known features, integrate behavioral data first and use the survey strategically as a secondary input. The slogan provides a valuable caution, not an absolute prohibition.
