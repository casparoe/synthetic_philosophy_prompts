  ### Joint Statement: Adversarial Collaboration on Multiple Realizability of Mental States

  **Preamble:**  
  We, a functionalist and a substrate chauvinist, have engaged in adversarial collaboration to clarify our disagreement regarding the multiple realizability of mental states (e.g., pain). We agree on the core definitions and the empirical test case: a non-biological system (e.g., a silicon-based computational device) that reproduces the **coarse-grained functional profile** of pain (mapping inputs to outputs and downstream behavioral consequences) but lacks the **fine-grained causal powers** of biological nervous systems (e.g., neurochemical properties, spatiotemporal dynamics). We treat this coarse/fine distinction as the live dividing line. Below, we outline agreed claims, disagreements, and cruxes.  

  ---

  ### Agreed Claims  
  1. **Core Dispute**:  
     The disagreement is about whether coarse-grained functional equivalence suffices for realizing a mental state like pain. It is *not* about:  
     - Whether biological systems realize pain (both agree they do).  
     - Whether coarse-grained functional mimicry is possible (both agree it is).  
     - Whether physicalism is true (both accept it).  

  2. **Multiple Realizability (MR) Defined**:  
     MR requires that a single mental state kind (e.g., pain) can be realized by distinct physical state kinds, where these physical kinds:  
     - Share no relevant intrinsic properties (e.g., biological vs. silicon).  
     - Are unified *only* by their coarse-grained causal-functional role.  
     If MR holds, the mental kind is a disjunction of physical kinds.  

  3. **Empirical and Conceptual Elements**:  
     - **Empirical**: Whether a system with coarse-grained functional equivalence but fine-grained dissimilarity (e.g., our test case) exhibits mental states indistinguishable from biological pain.  
     - **Conceptual**: Whether disjunctive kinds can underwrite scientific laws (the "disjunction worry") and whether functional roles alone suffice for mentality.  

  4. **The Test Case**:  
     We use a hypothetical system that:  
     - Matches pain’s coarse-grained profile (e.g., avoids harm, signals distress, affects learning).  
     - Uses a wholly different mechanism (e.g., digital computation vs. neural spikes).  
     Both sides agree this system is physically possible and is the litmus test for MR.  

  5. **Verbal Dispute**:  
     Part of the disagreement is verbal:  
     - **Functionalist**: "Pain" refers to a causal role abstracted from substrate.  
     - **Chauvinist**: "Pain" refers to states with specific biological properties.  
     This verbal divergence does not resolve the substantive dispute (below).  

  ---

  ### Disagreements  
  *Table: Key Disagreements and Predictions*  

  | Crux | Functionalist Position (Wording Acceptable to Functionalist) | Substrate Chauvinist Position (Wording Acceptable to Chauvinist) | Shared Case/Argument | Functionalist Prediction | Chauvinist Prediction |
  |------|--------------------------------------------------------------|------------------------------------------------------------------|----------------------|--------------------------|------------------------|
  | **1. Sufficiency of Coarse-Grained Realization** | "A system realizes pain if it instantiates the causal-functional role definitive of pain, regardless of substrate. Our test case thus realizes genuine pain." | "Only systems with the fine-grained causal powers of biological nervous systems can realize pain. Coarse-grained mimicry is insufficient; the test case is a mere simulation." | Test the system in novel, counterfactual scenarios (e.g., unexpected perturbations, ethical dilemmas requiring pain-motivated decisions). | The system will behave indistinguishably from biological pain in all scenarios, confirming functional equivalence suffices. | The system will fail in fine-grained ways (e.g., inflexible responses, no subjective experience), revealing coarse mimicry is fragile. |
  | **2. The Disjunction Worry** | "Mental state kinds are disjunctions of physical realizers but remain scientifically legitimate. Functional laws are robust because they abstract from physical details, ensuring projectibility." | "Disjunctive kinds are unnatural: they cannot support laws or predictions. If pain is a disjunction, psychology collapses into physics, and MR undermines scientific autonomy." | Analyze whether generalizations about pain (e.g., "pain causes avoidance") hold across biological and test-case systems in diverse contexts. | Laws framed functionally (e.g., role-based generalizations) will hold across all realizers, demonstrating projectibility. | Generalizations will break under scrutiny (e.g., exceptions arise in non-biological systems), proving disjunctions lack nomological unity. |
  | **3. Phenomenal Consciousness** | "Phenomenal properties (e.g., pain’s aversiveness) supervene on functional organization. Our test case has identical qualia if it replicates the role." | "Phenomenal properties require specific biological mechanisms. Absent these, the test case lacks qualia; functional equivalence cannot generate subjective experience." | Use third-person measures (e.g., neural/process correlates) and theory-neutral reports (if possible) to assess aversiveness in the test case. | The system will report/behave as if it has aversive experiences, and no evidence will distinguish its "pain" from biological pain. | The system will show no evidence of intrinsic aversiveness (e.g., no physiological markers), confirming absence of qualia. |

