prompt: |-
  Draft the joint statement of an adversarial collaboration between a functionalist and a substrate chauvinist about whether mental states are multiply realizable. The functionalist holds that a mental state is fixed by its causal-functional role and so is realizable by any system that plays that role; the chauvinist holds that only systems sharing the right intrinsic causal powers — roughly, the relevant properties of biological nervous systems — can realize a state like pain, so functional equivalence is not enough. Both have agreed to treat as the live dividing line the difference between coarse-grained realization (matching inputs, outputs, and downstream functional consequences) and fine-grained realization (matching the causal powers of the realizing states themselves), and to use as a shared case a system that reproduces the coarse profile of pain through a wholly different mechanism. Give me the claims both can sign — about what the dispute is and is not about, what multiple realizability would require, and which parts are empirical; the precise statements of their disagreement, each phrased so its own side would accept the wording; the cruxes, at least one of which should be the disjunction worry — that if a single mental kind is realized by many different physical kinds, the mental kind is a disjunction, and disjunctions do not underwrite laws; and, for each crux, the case or argument both would count as bearing on it, with each side's prediction recorded in advance. If part of their dispute is merely verbal, say which part. Format as a numbered agreed-claims section followed by a disagreements table.
reasoning: |-
  We are drafting a joint statement between a functionalist and a substrate chauvinist on multiple realizability of mental states, using the case of a system that reproduces the coarse-grained functional profile of pain but with a different mechanism.

  Agreed Claims:

  1. The dispute is about whether mental states (like pain) are multiply realizable in a way that is non-trivial and scientifically significant. Specifically, it is about whether a system that reproduces the coarse-grained functional profile of pain (i.e., typical inputs, outputs, and downstream functional consequences) but does not share the fine-grained causal powers (i.e., the intrinsic properties and causal mechanisms) of a biological nervous system, can genuinely realize the mental state of pain.

  2. The dispute is not about:
     a) Whether coarse-grained functional equivalence is achievable by different systems. Both sides agree that it is possible in principle to build a system that mimics the input-output behavior and functional consequences of pain without being biologically similar.
     b) Whether biological nervous systems (like those in humans) can realize pain. Both sides agree that they do.
     c) Whether the physical world is causally closed. Both sides accept that all events have physical causes.

  3. Multiple realizability, as a substantive thesis, requires that the same mental state kind can be realized by distinct physical state kinds that are not unified by any underlying physical property (or at least not by a property that is required for having that mental state). The functionalist holds that such multiple realizability is actual and widespread, while the chauvinist denies it.

  4. The core of the disagreement is empirical in at least one crucial respect: whether there exists a system that is not biologically similar to a human nervous system but nevertheless realizes the mental state of pain. However, there is also a conceptual component regarding what counts as realizing a mental state.

  5. Both sides agree that if multiple realizability is true, then the mental state kind (e.g., pain) is realized by a disjunction of physical state kinds. However, they disagree on the implications of this disjunction for the scientific status of psychology.

  6. Both sides agree that the following case is a live test case: a system (e.g., a sophisticated computer program running on silicon-based hardware) that is designed to replicate the coarse-grained functional profile of pain (e.g., it detects tissue damage, produces aversive responses, and influences learning and decision-making in ways typical of pain) but does so without any biological neurons or the typical biochemical processes of nociception. The system uses an entirely different algorithm and physical substrate.

  7. Both sides agree that if such a system were to exist, the functionalist would say it realizes pain, and the chauvinist would say it does not.

  8. Both sides agree that the question of whether the system has phenomenal consciousness (what it is like to be in pain) is part of the dispute, but they also agree that the dispute is not solely about qualia. It also concerns whether the system has the intentional and dispositional properties that constitute pain.

  9. Both sides agree that the disjunction worry is a central crux: if pain is realized by a disjunction of physical kinds, then pain might not be a natural kind and might not participate in strict laws. This would challenge the scientific legitimacy of psychology as an autonomous science.

  Disagreements Table:

  | Crux | Functionalist Position (as worded by functionalist) | Chauvinist Position (as worded by chauvinist) | Shared Case/Argument | Functionalist Prediction | Chauvinist Prediction |
  |------|-----------------------------------------------------|------------------------------------------------|------------------------|--------------------------|------------------------|
  | 1. **The Disjunction Worry** | "The disjunction of physical realizers does not undermine the scientific legitimacy of mental state kinds because the functional role itself unifies the kind. Functional kinds are projectible and can support laws at the functional level, which are autonomous from the physical level. Therefore, even if the physical realizers are disjunctive, the functional kind is not." | "If pain is realized by a disjunction of physical kinds that have nothing in common except that they each play the coarse-grained functional role, then pain is not a natural kind. Disjunctive kinds do not support laws and are not projectible. Therefore, psychology cannot be a science if it posits such disjunctive kinds." | Consider the scenario where we have two systems: one biological and one artificial (as described in the agreed case). We observe that both exhibit the same coarse-grained functional profile. We then attempt to formulate psychological laws that generalize over both systems. | The functionalist predicts that we will be able to formulate robust psychological laws that apply to both systems, and that these laws will be projectible to new instances of the same functional kind. | The chauvinist predicts that any such attempt will fail because the artificial system does not actually have the same mental states (like pain) and that the apparent functional similarities will break down under new tests or in novel situations, revealing that the functional kind is not projectible. |
  | 2. **The Empirical Test Case** | "The artificial system that perfectly replicates the coarse-grained functional profile of pain (including all inputs, outputs, and downstream functional consequences) does indeed realize genuine pain. This is because pain is defined by its causal role, and the system satisfies that role." | "The artificial system, despite replicating the coarse-grained functional profile, does not realize pain because it lacks the intrinsic causal powers that are necessary for pain. These intrinsic powers are found only in biological systems (or systems with the right physical substrate)." | Build the artificial system and subject it to a battery of tests that cover all typical and counterfactual scenarios for pain behavior. Also, examine its internal mechanisms to see if they are physically similar to biological nociception. | The functionalist predicts that the system will pass all tests and that there will be no breakdown in functional equivalence. Moreover, they predict that the system will report having phenomenal experiences of pain (if it has the capacity for such reports) and that these reports will be reliable. | The chauvinist predicts that the system will either fail in some counterfactual scenarios (revealing that the functional equivalence is not complete) or, even if it passes all behavioral tests, that it will lack the phenomenal aspect of pain. They also predict that upon closer inspection, the system's internal states will not have the causal powers to produce genuine mental states. |
  | 3. **The Role of Intrinsic Properties** | "The intrinsic properties of the realizing substrate are irrelevant to the mental state, as long as the causal role is played. Therefore, the fine-grained causal powers of the realizing states are not constitutive of the mental state." | "The intrinsic properties of the substrate are essential because they provide the causal powers that ground the mental state. Without the right intrinsic properties, the system is merely simulating the functional role without instantiating the mental state." | Analyze the causal powers of the realizing states in the artificial system and compare them to those in the biological system. | The functionalist predicts that the differences in intrinsic properties will not matter for the mental state, as the causal role is what matters. | The chauvinist predicts that the differences in intrinsic properties will lead to differences in the causal powers of the states, which will ultimately manifest in a failure to support the same counterfactuals or in a lack of the requisite phenomenal character. |

  Verbal Dispute:

  Both sides agree that part of the dispute is verbal. Specifically, they agree that the term "pain" might be used in a way that includes only biological realizations (as the chauvinist prefers) or in a way that includes any system that plays the functional role (as the functionalist prefers). However, they also agree that the substantive issue remains: whether the functional role is sufficient for having the mental state, and whether such a state would have the same scientific and metaphysical status as the biological realization.

  Therefore, they agree that the dispute is not merely verbal because it has empirical consequences (as tested by the case) and because it affects the scientific legitimacy of psychology.

