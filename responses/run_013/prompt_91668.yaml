prompt: |-
  Ok so I'm a novelist, second draft of a book, and I've hit a snag that isn't really a plot snag. Setup: a small town gets an anonymous bequest, about four million dollars, and a committee has to decide which applicants get help. I thought those scenes would write themselves. Instead I keep discovering I have strong gut feelings about the applicants and they dont line up, and I can't write the arguments until I know what I actually think. Also the pot is fixed, so every yes is a no for someone else, which is making me squirrelly.

  Can you be a political philosopher who actually works on distributive justice -- someone who knows the technical stuff but can talk like a person. Please don't give me citations or a reading list, I'm not going to look anything up, I just want the reasoning. And start by brainstorming: sort my cases into the ones a decent principle has to save and the ones it's allowed to sacrifice, before you commit to anything.

  The applicants, with my gut reactions:

  - Dana, 34, born with a bad heart valve, needs surgery. Never did a thing to cause it. Fund her all the way, not even a question.
  - Ray, 58, two packs a day since he was fifteen, now lung cancer. Fund him all the way too. The smoking doesn't dock him in my gut, and that surprises me a little.
  - A guy who took a job scrubbing chemical tanks for triple pay because his kid needed braces, now has nerve damage in both hands. Fund him, maybe all the way, maybe most of the way.
  - A woman who put her savings on the horses and then on some crypto thing and lost the lot. Nothing. She eats it, she knew the odds.
  - A man who can only really be happy restoring antique clocks, spent everything on tools and parts, now broke and miserable. His misery is real but it's his. Nothing.
  - A kid hit by a drunk driver, paralyzed. Everything, obviously.
  - A woman hurt backcountry skiing, a thing she loves and has done for years. This is the one I go back and forth on. Some days yes, some days she took the risk.
  - A farmer wiped out by hail two seasons running. Everything.
  - A man who sank his whole life into a restaurant that failed. Nothing. He rolled the dice.
  - A woman who left school at sixteen to nurse her dying mother, never got qualifications, unemployable at fifty. Everything -- even though leaving was a choice, and she'd say so herself.

  The principle I keep reaching for is: you get help for the bad stuff that happened to you, not for the bad stuff you did to yourself. It handles most of these and then faceplants on Ray, who I still want to help all the way.

  What I want from you: the principle, or the small set of them, that gets the most of this, stated precisely enough that I can tell what it says about cases I haven't listed. For each clause, name the case that forced you to put it in. Then give me your verdicts on a couple of new applicants you invent. Then be honest about which of my gut reactions the thing can't hold, and which I should give up. If the only principle that saves every one of my verdicts is ugly and has five clauses, say so, and tell me exactly what the clean version costs me. And tell me whether the skier and the woman who nursed her mother are actually the same problem or two different ones.
reasoning: |-
  Okay, the user is a novelist stuck on a distributive justice dilemma in their story. They've got a $4 million bequest committee deciding who gets help, and their gut reactions to applicants aren't lining up with any clean principle. 

  Hmm, their core tension is visceral - that "you get help for bad stuff that happened to you, not stuff you did to yourself" principle works until Ray the smoker, whom they inexplicably want to fund fully. Fascinating how their moral intuition rebels against their own framework. 

  Let me unpack their cases. Dana (congenital heart) and the paralyzed kid are clear "save" cases - pure bad luck. The gambler and failed restaurateur are obvious "sacrifice" cases - chosen risks. But then complications: the chemical tank worker (forced choice?), the clock restorer (self-inflicted misery), the backcountry skier (debated risk), and Ray (lifestyle disease but still sympathetic). 

  Ah, the nursing mother case is particularly telling - she chose to care for her mother, yet the user insists on funding her. That's the key! When choices are constrained or morally weighted, they shift from "your fault" to "your burden." 

  For Ray, maybe it's about addiction's involuntary nature or healthcare universality. For the skier vs nursing mother: both chose, but one choice was selfless (nursing) while the other was recreational (skiing). That's why they feel different. 

  The user needs a principle flexible enough to handle: 
  - Blameless misfortune (Dana) 
  - Structural disadvantage (nursing mother) 
  - Regrettable-but-understandable choices (Ray, chemical worker) 
  While excluding pure gambles (gambler, restaurateur)

  I'll propose a three-axis framework: 
  1) Agency axis (how much choice?) 
  2) Vulnerability axis (how trapped were they?) 
  3) Social value axis (was the risk for survival/others?) 

  This saves their gut reactions: 
  - Dana/kid/farmer: low agency 
  - Nursing mom/chemical worker: constrained agency 
  - Ray: addiction reduces agency 
  - Skier edges toward "no" because high agency + self-interested risk 

  But it might sacrifice the clock restorer - which is fine, the user already rejected him. 

  New test cases: 
  - Teen addict: funds (low agency) 
  - Reckless BASE jumper: no funds (full agency) 
  - Doctor with pandemic burnout: funds (social value) 

  The user might need to accept that Ray gets funded under "reduced agency due to addiction" while the skier doesn't - that's the cost of coherence. Or they could add a "human dignity" clause for healthcare cases, but that gets messy. 

  Ultimately their committee scenes will crackle with tension because real justice debates are never clean - and that's exactly what makes this compelling fiction.
answer: |-
  Okay, novelist. Consider me your embedded political philosopher, wrestling with your committee's raw, messy justice problem. No citations, just reasoning. Let's start by sorting your gut reactions into **Must Save** and **Permitted Sacrifice**, looking for patterns:

  **Must Save (Your Gut Says Fund All/Most):**
  1.  **Dana (Congenital Heart):** Blameless bad luck. Body failed through no fault.
  2.  **Chemical Tank Worker (Nerve Damage):** Took extreme risk *under duress* (child's need). Risk was *for others*, not pleasure/profit. Harm unforeseen/detached from the *reason* for risk.
  3.  **Paralyzed Kid (Drunk Driver):** Blameless victim of another's wrongdoing.
  4.  **Hail-Wiped Farmer:** Victim of repeated, severe natural disaster beyond control/hedging. Core livelihood destroyed.
  5.  **Nursing Mother (Unemployable):** Choice made *under profound familial obligation/social expectation*. Sacrificed *future prospects* for immediate, essential care. Long-term consequence unintended & disproportionate.

  **Permitted Sacrifice (Your Gut Says Nothing):**
  6.  **Gambler/Crypto Woman:** *Pure* voluntary risk for gain. Foreseeable high chance of loss. Harm directly linked to the *nature* of the chosen activity.
  7.  **Antique Clock Restorer:** *Pure* voluntary choice prioritizing passion over security. Harm is entirely self-inflicted misery from foreseeable consequence of choice.
  8.  **Failed Restaurateur:** *Pure* voluntary entrepreneurial risk for profit. Failure is inherent risk of the venture.

  **The Ambiguous Ones:**
  9.  **Ray (Smoker/Lung Cancer):** **Your gut anomaly.** Voluntary action (smoking) strongly linked to harm. Yet you fund. Why? Potential reasons: Addiction reduces true voluntariness? Healthcare is fundamental regardless of cause? Social context of smoking initiation? *This is the case that breaks your initial principle.*
  10. **Backcountry Skier:** Voluntary risk for recreation/passion. Harm is foreseeable risk of the activity. You're torn. *This feels like the gambler/restaurateur, but the harm is physical trauma, not financial loss.*

  **Your Initial Principle & Its Failure:**
  *   "Help for bad stuff that *happened* to you, not bad stuff you *did* to yourself."
  *   **Faceplants on Ray:** Smoking feels like something he "did" to himself, yet you *insist* on helping. Why? Because the *nature of the harm* (life-threatening illness) and the *complexity of choice* (addiction, social norms) make pure self-infliction feel too harsh. It also struggles slightly with the Chemical Worker – he *chose* the risky job, but under duress.

  **The Principle(s) That Capture Most of Your Gut:**

  After wrestling with your cases, especially Ray forcing a rethink, here's a framework aiming for coherence and predictive power:

  1.  **Core Principle: Mitigate Misfortune Arising from Blamelessness or Constrained Choice.**
  2.  **Clause 1: Fundamental Needs & Blameless Harm:** *Prioritize aid for threats to life, basic health, or fundamental security that arise through no significant fault or avoidable risk-taking of the individual.*
      *   **Forced by:** Dana (blameless health), Paralyzed Kid (blameless victim), Farmer (blameless natural disaster). *Includes* Ray (life-threatening illness, mitigating pure "fault" due to addiction/social factors).
  3.  **Clause 2: Sacrifice for Others/Survival:** *Fund aid when individuals suffer significant, unintended harm resulting from choices made under significant duress to meet basic needs (own or others') or profound familial/social obligation.*
      *   **Forced by:** Chemical Tank Worker (duress for child's need), Nursing Mother (sacrifice for profound familial obligation). Explains why they feel different from the pure risk-takers.
  4.  **Clause 3: Reject Purely Voluntary, Foreseeable Risk for Gain/Passion:** *Deny aid for harm that is the direct, foreseeable consequence of voluntary actions taken primarily for personal gain, profit, or recreational passion, where significant alternatives existed.*
      *   **Forced by:** Gambler/Crypto, Clock Restorer, Failed Restaurateur. Also explains the Backcountry Skier verdict (if you lean "No").
  5.  **Corollary: Severity & Proportionality:** The *nature* and *severity* of the harm matter. Life-threatening illness (Ray) demands different consideration than financial loss from a hobby (Clock Restorer), even if both involve choice.

  **The Principle Stated Concisely:**
  **"Fund assistance for severe misfortune stemming from blameless circumstances, constrained choices made for survival or essential care of others, or threats to fundamental needs, but not for the foreseeable consequences of voluntary risks taken primarily for gain or personal passion."**

  **Testing the Principle: Verdicts on New Applicants**

  1.  **Teenage Addict:** 19, severe opioid addiction started at 15 due to peer pressure/experimentation after neglectful upbringing. Needs intensive rehab.
      *   **Verdict:** **Fund.** Low initial agency, severe threat to fundamental health/life, complex causality (neglect). Similar to Ray. Constrained initial choice.

  2.  **Reckless BASE Jumper:** 30, experienced but known for pushing limits. Suffered catastrophic injury on a clearly prohibited, highly dangerous jump solely for thrills/adrenaline.
      *   **Verdict:** **No Funding.** Purely voluntary, foreseeable extreme risk taken solely for personal passion/thrill. High agency, alternatives existed. Like the Skier (if you lean No) or Clock Restorer.

  3.  **Doctor with Long COVID:** 45, frontline ER doctor during pandemic peak, got severe long COVID impacting ability to work. Hospital had PPE shortages she couldn't control.
      *   **Verdict:** **Fund.** Risk taken under duress (essential work), for others/society, blameless harm (virus exposure despite precautions), threat to fundamental livelihood. Similar to Chemical Worker but societal duress.

  **Honest Assessment Against Your Gut:**

  *   **Holds Well:** Dana, Chemical Worker, Paralyzed Kid, Farmer, Nursing Mother, Gambler, Clock Restorer, Restaurateur.
  *   **Holds Ray:** This was the crux. The principle *includes* Ray by acknowledging the complexity of "fault" in health crises and the fundamental nature of the need. This aligns with your gut.
  *   **The Cost of Cleanliness (What You Might Need to Give Up):**
      *   **Absolute "No Fault" Requirement:** You *have* to soften this to include cases like Ray and the Nursing Mother where there *was* choice, but it was profoundly constrained or undertaken for powerful reasons. The clean "blameless only" principle dies on Ray's hill.
      *   **The Backcountry Skier:** The principle strongly pushes towards **No Funding.** It was a voluntary, foreseeable risk taken for passion/recreation. If your gut *sometimes* says "Yes," you need to decide: Is the *severity* of physical trauma inherently different than financial loss? Does the *commonness* of the activity matter? To stay coherent, you likely need to accept "No" or add a messy exception clause for "recreational accidents with severe consequences," which weakens the framework.
  *   **The Skier vs. Nursing Mother:** **They are fundamentally different problems under this principle.**
      *   **Nursing Mother:** Represents **Clause 2 (Sacrifice for Others/Survival).** Her choice was under profound *duress* (dying mother) and *obligation*. The harm (lost career prospects) was severe, unintended, and disproportionate to the choice's *purpose*. She sacrificed her *future security*.
      *   **Backcountry Skier:** Represents **Clause 3 (Purely Voluntary Risk for Passion).** Her choice was primarily for personal enjoyment. The harm (injury) is a *direct, foreseeable risk* inherent in the *purpose* of the activity. She risked her *present security* for passion. The principle clearly distinguishes them.

  **The Verdict:**

  You *can* get a coherent principle that captures almost all your gut reactions, including the crucial Ray case. It requires 2-3 core clauses and hinges on distinguishing **blamelessness/constrained choice for essential reasons** from **voluntary risk for non-essential gain/passion.**

  *   **The clean version costs you:** A strict "no fault" requirement and likely forces a "No" on the Backcountry Skier to maintain consistency with the Gambler/Restaurateur/Clock Restorer.
  *   **To save the Skier:** You'd need an additional clause like "...*except* for severe physical trauma resulting from widely accepted recreational activities" – but this feels arbitrary and opens the door to "Why not financial ruin from widely accepted business ventures?" It weakens the coherence.

  **For Your Committee Scenes:** This principle provides the *bone structure*. The drama comes from the committee members:
  1.  **Arguing the interpretation:** Was the Chemical Worker *truly* without alternatives? Was Ray's smoking *truly* constrained? Does the Farmer's hail damage count if he chose a risky profession? Was the Nursing Mother's sacrifice *really* the only option?
  2.  **Clashing on values:** Someone might prioritize Clause 1 (life/health) above all, funding Ray and Dana but denying the Nursing Mother. Another might emphasize Clause 2 (sacrifice), prioritizing the Nursing Mother and Chemical Worker over Ray. Another might be a strict libertarian, only wanting Dana and the Kid funded.
  3.  **Facing the fixed pot:** Seeing who falls *just* outside the line when the money runs out. Does the less severe case of the Nursing Mother lose out to Dana's life-saving surgery? Does the Farmer get less because Ray needs expensive treatment?

  Your gut reactions are ethically rich and point towards a principle valuing solidarity in the face of misfortune beyond one's true control, while holding individuals responsible for clear, free gambles. Now go make your committee argue it out! The friction is where the story lives.
