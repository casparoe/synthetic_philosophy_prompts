answer: |-
  What you're describing is the **core challenge and artistry of poetic translation**, especially between languages with vastly different systems. There's no single perfect term, but several concepts overlap to define your "move":

  1.  **Functional Equivalence / Systemic Adaptation:** This is the most precise conceptual description.
      *   **Core Idea:** You're preserving the *function* or *effect* of the original device within the *target language's poetic system*. The Latin wordplay *functions* by creating a moment of linguistic surprise and comparison. English rhyme *functions* similarly by creating a sonic link that draws attention to the words themselves. Dactylic hexameter *functions* as the formal, elevated meter for serious Latin verse. English iambic pentameter *functions* as a common formal, elevated meter for serious English verse.
      *   **Not Dynamic Equivalence:** While related, DE focuses on the *overall reader experience and comprehension* (making it feel "natural" in the target culture). You're focused on replicating a specific *structural/poetic effect*.
      *   **Not (Simple) Compensation:** Compensation often refers to adding a device elsewhere to make up for a *loss* (e.g., adding alliteration in line 3 because a pun was lost in line 1). You're doing something more fundamental: **replacing the *load-bearing structural element* itself** with the *equivalent load-bearing element* from the target system. It's not patching; it's swapping the foundation beam for one made of a different but equally strong material suitable for *this* building.
      *   **Not Paraphrase:** Paraphrase changes the *wording* to explain meaning, often sacrificing form and effect. You are meticulously preserving both the semantic meaning *and* the core poetic effect/function, even though the *mechanism* changes. The *what* (meaning and the *type* of aesthetic experience) stays; the *how* changes.

  2.  **Transposition:** (Especially relevant to the meter change)
      *   **Core Idea:** Shifting a stylistic or formal element from one category or system to another within the target language. You transposed the formal rhythmic structure from the Latin metrical system (quantitative: long/short syllables) to the English metrical system (accentual-syllabic: stress patterns). You found the English formal equivalent.

  3.  **(Systemic) Compensation:** While often used more narrowly, your approach *is* a form of high-level compensation. You are compensating for the *impossibility* of directly replicating the original device by substituting a device native to English that fulfills the *same poetic role* (creating surprise/reflection, signaling formality). It's compensation at the level of the *poetic system*, not just an individual word or line.

  **Where Does It Stop Being Translation?**

  This is the eternal debate! Your approach sits firmly within the realm of skilled literary translation. The line blurs when:

  1.  **The New Device Fundamentally Alters the Meaning/Effect:** If the rhyme you added creates a comedic effect the original wordplay didn't have, or if the iambic pentameter imposes a ponderousness absent from the flowing Latin hexameter, you might be drifting into adaptation.
  2.  **The Core Purpose is Sacrificed:** If the *entire point* of the original was showcasing a feature utterly unique to Latin (like a complex acrostic relying on Latin grammar), and your translation abandons that for a different effect, it becomes more of an "inspired by" piece.
  3.  **You Prioritize the "New" Effect Over Faithfulness:** If you *choose* the rhyme or meter primarily because you like how it sounds in English, regardless of whether it matches the original's function/tone, it leans towards adaptation.

  **Your key test:** **Have you preserved the *primary intended effect* of the original device on the reader?** For the wordplay -> rhyme: Did you preserve the moment of surprise/reflection on the words? For hexameter -> pentameter: Did you preserve the sense of formal, elevated discourse? If yes, it's translation. If the *effect* is significantly different, it's adaptation.

  **The Invisibility of the Engineering:**

  **This is absolutely part of the same phenomenon and a hallmark of *successful* translation using these techniques.**

  1.  **Seamless Integration:** The goal of functional equivalence is for the target text to feel natural *in its own language and system*. A perfect rhyme in English feels like a natural poetic device, not an awkward stand-in for Latin wordplay. A fluent iambic pentameter line sounds naturally "poetic" in English.
  2.  **Fluency Norm:** Much translation theory (sometimes controversially) values the translation that doesn't "feel" translated – that reads as if originally written in the target language. Your successful engineering achieves this fluency.
  3.  **Success Hides the Labor:** When the substitution works perfectly, the reader experiences the *effect* intended by the original poet, but through the target language's own resources. They shouldn't be thinking, "Ah, the translator had to find a rhyme here because Latin had wordplay." They should just experience the poetic moment. The effort disappears *because* the new device functions authentically within the English poem.
  4.  **The Paradox:** The more complex the problem (like your wordplay or hexameter) and the more ingenious the solution (your functional equivalent), the *less* it draws attention to itself *as a solution*. A clumsy solution (e.g., a forced rhyme, a metrically jarring line) *does* draw attention to the translator's struggle.

  **In Summary:**

  You are practicing **Functional Equivalence** or **Systemic Adaptation**. You identify the **core function** of a device in the source poem (surprise/reflection, formal rhythm) and replace it with the **native device** from the target language's poetic system that best fulfills that **same function** (rhyme, established formal meter). This often involves **Transposition** (especially for meter). It's a sophisticated form of **Systemic Compensation**.

  This is still translation because you are faithful to the *meaning* and the *essential aesthetic/experiential function*, even while changing the *formal mechanism*. The "invisibility" of your engineering is the sign of your success in integrating the new device naturally into the fabric of the English poem, allowing the original's intent to shine through using a different linguistic toolkit. You're not just translating words; you're translating *poetic energy* from one system to another.
