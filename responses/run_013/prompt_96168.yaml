  For means vs. ends paternalism, I plan to have Alex argue that nudges respect ends by only altering means, while Jordan counters that constant nudging might prevent certain ends from forming at all. This ties into the course reading where the professor thinks nudges only seem bad if misread as imposing ends. 

  On transparency and resistibility: Alex will cite Thaler and Sunstein's definition that nudges must be noticeable and easy to opt out of. Jordan should challenge whether this is feasible since effective nudges often operate subconsciously. The back-and-forth needs to explore if the test is truly enforceable or just theoretical. 

