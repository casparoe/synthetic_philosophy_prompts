  Hey, I'm working through Descartes' Discourse on Method, Part V, and I'm stuck on the part where he argues that animals are basically machines. I can't find the exact wording right now, but here's the gist of the passage: he says that if someone made machines that looked like us and copied our actions, we could still tell they weren't human by two tests. First, they could never use words or signs the way we do to tell others what they're thinking. Even if a machine could say some words, it wouldn't be able to arrange them appropriately to respond to what's going on. Second, even if a machine did some things as well as or better than us, it would fail at other things, which shows its not acting from knowledge but from the arrangement of its organs. He then says this proves that animals have no reason at all, and that their souls are completely different from ours. But then I remember that Descartes also says somewhere that animals do have sensations, like they can feel pain, because sensation depends on the body. So I'm kinda confused: if animals can feel pain and have sensations, why does he say they have no thoughts? What's the difference between sensation and thought for him? And how does the language test actually work—like, what about a parrot that learns words, or a dog that seems to understand commands? I've been thinking about this alot. I'm not looking for citations or a reading list, just help understanding the ideas. Keep it in American English. At the very end, put a one-sentence summary of your main takeaway on its own line starting with 'Summary:'.
