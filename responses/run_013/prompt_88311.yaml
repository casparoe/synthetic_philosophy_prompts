prompt: |-
  I'm in a reading group on consequentialism and I got volenteered to make the handout for our session on the demandingness objection, and I want it to be a decision tree rather than a list of -isms, because last time we just put names on the board and spent the whole hour arguing about what the labels meant instead of about whether a theory can really ask that much of us. Here's my angle, tell me if it's a bad one. I think people lump several distinct complaints under demandingness depending on who's supposed to bear the cost of complying: the agent's welfare (she'd be worse off, maybe miserable), her projects and relationships (her life stops being hers to live), her motivational capacities (no human could sustain this, so it can't be a requirement in the first place), or her epistemic position (she can't tell which act is the maximizing one, so the theory gives her nothing usable to act on). My hunch is that which of those you find decisive, plus a couple of downstream questions, sorts you into a position more reliably than asking whether you're a consequentialist. I'd also like the tree to be built from the logical space rather than from the roster of names, so please work out the questions and the answer combinations first and only then say who lives where.

  So build the tree. The root should be that cost-of-compliance question. Every later node has to be something a reader can answer without already knowing where it leads, so a concrete case or a yes/no claim rather than do you accept the agent-centered prerogative. A few nodes I'd like in there somewhere if they fit: whether the objection is supposed to show the theory is false or merely that it can't be anyone's decision procedure (criterion versus guide); whether a theory only a saint could live up to is refuted by that fact or is instead a compliment to the theory and an indictment of us; whether the fix is to revise the theory or to revise our intuitions about the cases; and whether the demands get capped by what we could get everyone to do together rather than what you can do alone. I want 9 to 12 leaves, each labeled with the position that lives there, or unnamed if the combination is empty, plus one line on the most awkward thing that position has to say about a concrete case. What I want most is the empty boxes: combinations your tree allows that apparently nobody occupies, with a guess at whether that's because the view is incoherent, because it's unattractive, or just because nobody has bothered. If two positions can't be seperated by any of your nodes, say so instead of fudging it, I'd rather have a tree that admits a gap than one that pretends to cut where it can't.

  The audience is grad students and two faculty who know the literature, so don't explain what act-utilitarianism is, but also don't assume we all read the same things this month. Skip the bibliography, I have one. And tell me how confident you are in what you claim: how sure you are about the overall structure, and specifically the single branch or leaf you're least sure about, since I'd rather know where you're guessing. Last line, for my own notes: Verdict: followed by a short phrase naming the one node that does the most sorting work in the whole tree.
reasoning: |-
  Okay, let me tackle this demandingness objection decision tree request. The user wants to avoid label-focused debates and instead map the logical space based on cost types. 

  First I need to validate their core insight about different cost dimensions: welfare, projects/relationships, motivational capacity, and epistemic limits. That seems solid - these are distinct failure modes that would require different solutions. 

  The branching structure should start with "What type of cost matters most?" as the root node. Then each branch needs concrete follow-ups: 
  - For welfare costs: "Could following this theory make you miserable?" 
  - For projects: "Would it destroy your personal commitments?" 
  - For motivation: "Is this psychologically impossible to sustain?" 
  - For epistemic limits: "Can we actually identify the maximizing act?"

  Secondary branches will handle implications like:
  - Is this a theory problem or intuition problem?
  - Should demands be individual or collective?
  - Does impossibility refute the theory?

  I'm noticing potential gaps already. For example, a position that accepts extreme welfare costs but rejects project destruction might not exist - that could be an empty box. Also, satisficing vs scalar consequentialism might not separate cleanly in this framework. 

  The most uncertain branch is probably the "impossibility" path. I'm not entirely sure if denying that motivational limits matter leads directly to virtue critiques or if there's a missing step. 

  The key sorting node seems to be the initial cost-type question - it creates four distinct trajectories that rarely reconverge. That's where the real analytical work happens.
answer: |-
  Here's a decision tree for the demandingness objection, built from logical space, focusing on *cost-type* as the root and avoiding -ism labels until the leaves. It prioritizes concrete questions over doctrinal commitments, identifies empty boxes, and flags uncertainties.

  **Decision Tree: The Demandingness Objection**

  1.  **ROOT: What is the core problem with the demandingness?**
      *   **A. Agent Welfare Cost:** Compliance would severely damage the agent's own well-being/happiness (e.g., constant sacrifice makes her miserable).
      *   **B. Agent Project/Relationship Cost:** Compliance requires abandoning central personal projects/commitments/relationships (e.g., can't be a good parent/friend, pursue meaningful work).
      *   **C. Motivational Capacity Cost:** Compliance requires motivation/sustained effort beyond normal human capacity (e.g., no one *could* think/act that way constantly).
      *   **D. Epistemic Cost:** Identifying *which* act maximizes the good is too difficult/uncertain to guide action reliably (e.g., can't calculate consequences well enough).

  ---

  *   **Branch A: Welfare Cost is Primary**
      *   **A1. Does this welfare cost show the theory is *false* (wrong about right/wrong), not just hard to follow?** (Criterion vs. Guide)
          *   **Yes:** Welfare cost invalidates the theory's account of right action.
              *   **A1a. Is the fix to *cap demands* relative to agent welfare?** (e.g., Agent-Centered Prerogative)
                  *   **Yes:** **LEAF: Schefflerian Agent-Centered Prerogative.** *Awkward Thing:* Must justify why saving your own vacation fund is permissible while letting five distant strangers die from preventable disease *isn't* wrong.
                  *   **No:** **LEAF: Satisficing Consequentialism** (or 'Good Enough' Threshold). *Awkward Thing:* Must explain why *stopping* at "good enough" isn't wrong when doing *more* good is clearly possible and imposes only moderate cost.
              *   **No:** **LEAF: Virtue Ethics (Consequentialist-leaning) / Character-Consequentialism.** *Awkward Thing:* Must explain why cultivating virtues that *don't* maximize good in each act is the truly "right" way to approach morality. (Focus shifts from act-evaluation to character).
          *   **No:** Welfare cost means the theory is a bad *guide* but might still be the correct *criterion*. (Separation of Criterion and Guide).
              *   **A1b. Should we *revise our intuitions* about demandingness?** (Embrace the cost as morally required)
                  *   **Yes:** **LEAF: Radical Act-Consequentialism (Guide & Criterion).** *Awkward Thing:* Must consistently affirm that failing to donate *everything* beyond bare subsistence to effective charities is seriously morally wrong, akin to letting children starve.
                  *   **No:** **LEAF: Indirect Consequentialism (e.g., Rule-Utilitarianism as Guide).** *Awkward Thing:* Must defend why following a rule (e.g., "keep promises") is right even in *this specific case* where breaking it would clearly produce more good.

  *   **Branch B: Project/Relationship Cost is Primary**
      *   **B1. Is the problem that compliance destroys *integrity* (makes life alien/non-authentic), not just welfare?**
          *   **Yes:** **LEAF: Williams/Sloterdijk Integrity/Objection.** *Awkward Thing:* Must argue that George refusing the weapons job (even if taking it *would* prevent worse people from doing more harm) isn't selfish weakness but protects something core to moral agency itself.
          *   **No:** *(See Branch A - Welfare Cost likely subsumes this)* **EMPTY BOX?** *Reason:* Unattractive/Incoherent? Denying integrity's distinctness while prioritizing projects seems unstable. Projects matter *because* of welfare or integrity. If not welfare, it defaults to integrity.

  *   **Branch C: Motivational Capacity Cost is Primary**
      *   **C1. Is the motivational limit a *fatal flaw* for the theory?** (Does impossibility imply non-obligation?)
          *   **Yes:** **LEAF: Motivational Skepticism / "Ought Implies Can" Objector.** *Awkward Thing:* Must explain why *any* demand slightly beyond typical motivation isn't also invalidated (e.g., heroic acts).
          *   **No:** Motivation limit is real but doesn't refute the theory's truth.
              *   **C1a. Does this show we need *collective* solutions (rules/institutions), not individual heroism?**
                  *   **Yes:** **LEAF: Rule-Consequentialism (Strong Focus on Feasibility).** *Awkward Thing:* Must justify why an individual breaking a generally optimal rule *is* wrong even if *their specific act* would clearly maximize good and the rule-breaking is undetectable/not erosive.
                  *   **No:** **LEAF: Scalar Consequentialism.** *Awkward Thing:* Must deny that there's a clear line between "right" and "wrong" acts; failing to maximize is just "worse," not necessarily *blameworthy* or *impermissible*. (Moves demandingness to evaluation/praise/blame, not permissibility).

  *   **Branch D: Epistemic Cost is Primary**
      *   **D1. Is the epistemic problem *insurmountable* for identifying the right act?**
          *   **Yes:** **LEAF: Satisficing Consequentialism / "Good Enough" Heuristics.** *Awkward Thing:* Must explain why aiming for "good enough" based on reasonable estimates isn't *giving up* on maximizing when better information *might* be available with effort.
          *   **No:** Epistemic limits can be managed with reasonable effort/estimates.
              *   **D1a. Should the theory *only* demand acting on *reasonably expected* consequences?**
                  *   **Yes:** **LEAF: Expected Value Consequentialism.** *Awkward Thing:* Must defend choosing an act with a *lower* expected value if you know (with certainty) it will have worse actual consequences than a riskier option.
                  *   **No:** *(Reconverges with Radical/Indirect approaches)* - The theory remains maximizing actual value, and epistemic limits are a practical problem we must live with. (No distinct leaf here, covered in A1).

  ---

  **Empty Boxes & Uncertainties:**

  1.  **B1 "No" Branch:** As noted. Unattractive/incoherent? Prioritizing projects over welfare *without* appealing to integrity seems unstable.
  2.  **C1a "No" Branch leading to Scalar Consequentialism:** This is the *most uncertain placement*. Scalarists might equally emphasize welfare, projects, *or* motivation as the *reason* demandingness is misplaced at the *deontic* level (right/wrong). The branch captures the *implication* that motivational limits don't refute the theory's core claim about betterness, but doesn't perfectly isolate Scalarism *only* from motivational concerns. *Confidence: Low (60%)* - It logically fits the "No" answer to C1, but Scalarians might arrive via other paths.
  3.  **D1 "No" + D1a "No":** Covered elsewhere (A1 paths). No distinct view needed.

  **Confidence:**

  *   **Overall Structure: High (85%).** The root cost-type distinction is robust and generates distinct argumentative paths. The secondary questions (criterion vs. guide, revise theory vs. intuitions, individual vs. collective) effectively sort major positions.
  *   **Least Confident Leaf Placement:** **Scalar Consequentialism under C1a "No".** As explained, Scalarism is primarily a thesis about deontic categories, and motivational limits are *one* reason to adopt it, but not the only path. *Confidence: 60%*. It's the best fit *within this branch*, but the tree doesn't perfectly capture that Scalarism could be motivated by *any* of the cost types leading to dissatisfaction with binary right/wrong judgments.

  **Verdict: The root distinction (A/B/C/D) does the most sorting work.** Identifying *which cost* drives the objection fundamentally shapes the entire subsequent argument and the type of solution required. A welfare-focused objection leads to very different places than an integrity-focused or motivational one. This explains why label-based debates are often unproductive – proponents start from different core concerns hidden under the same "demandingness" label.
