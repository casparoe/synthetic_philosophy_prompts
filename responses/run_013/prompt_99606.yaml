answer: |-
  Here’s a tight list of desiderata for any formal account of "avoiding side effects" in AI agents, reflecting your requirements. British English maintained throughout.

  ---

  ### **Desiderata for a Formal Account of Side Effects / Impact Measures**
  1. **Epistemic Feasibility**  
     *Must be computable from the agent’s own model/predictions, not ground-truth states.*  
     *Why:* Agents lack omniscience. If it requires perfect knowledge, it’s useless for real-world decisions.

  2. **Non-Triviality (No "Do-Nothing" Loophole)**  
     *Must not assign minimal impact to inaction or freezing the world.*  
     *Why:* Otherwise, the safest option is always inertia (e.g., refusing to act). This fails basic usefulness.

  3. **Gradience**  
     *Must quantify impact as a continuous or ordinal degree, not binary.*  
     *Why:* Side effects range from negligible (moving air) to catastrophic (causing a blackout). Binary measures can’t prioritise.

  4. **Multi-Agent Robustness**  
     *Must handle cases where individual actions are low-impact, but aggregate actions cause harm.*  
     *Why:* Real-world examples (e.g., traffic congestion, resource depletion) require accounting for others’ agency.

  5. **Body/Goal Delineation**  
     *Must explicitly address whether changes to the agent’s body or goal-achievement count as "impact".*  
     *Why:* Ambiguity here leads to paradoxes (e.g., is a robot "impacting" the world by moving its own arm?).

  6. **Intentionality-Independence**  
     *Must recognise unintended consequences (e.g., vase-in-box) as impact.*  
     *Why:* Moral responsibility often hinges on outcomes, not intent. A broken vase is broken regardless of foresight.

  7. **Value-Minimalism**  
     *Must not smuggle in a full value specification (e.g., "undesirable" states).*  
     *Why:* If impact relies on pre-defined human values, it fails as a *formal* constraint. This should be a result, not an assumption.

  8. **Causal Attribution**  
     *Must distinguish between changes caused by the agent vs. external factors.*  
     *Why:* Without this, agents get "blamed" for unrelated events (e.g., rain damaging a roof during their operation).

  9. **Counterfactual Sensitivity**  
     *Must benchmark impact against a plausible baseline (e.g., "what would happen if I didn’t act?").*  
     *Why:* Otherwise, background dynamics (e.g., natural decay) distort measurements.

  ---

  ### **Which Requirement Does the Most Work?**  
  **Non-Triviality (№2)** is pivotal. It forces the baseline problem: *What counts as "no impact"?* If you define impact as "deviation from a frozen world", you get do-nothing incentives. Use a dynamic baseline (e.g., "expected future without agent"), and you need values to define "expected" (clashing with **Value-Minimalism №7**).

  ---

  ### **Tensions & Suspicions Confirmed**  
  - **The Core Tension:** **Value-Minimalism (№7)** vs. **Non-Triviality (№2) + Counterfactual Sensitivity (№9)**.  
    *Why:* Avoiding "do nothing" requires a baseline. Baselines inherently reflect *what we value preserving* (e.g., ecosystems, structures). If you say "impact is deviation from a *natural* state", you’ve smuggled in "natural=good".  
  - **Multi-Agent (№4)** + **Body/Goal (№5)** compounds this: if two agents preserve "their" baselines but jointly disrupt a shared resource, whose baseline matters?  

  **Conclusion:** You’re right—**impact can’t be defined without implicit values**. A "pure" measure is impossible. The desiderata force this out: any adequate formalisation must either:  
  (a) **Openly incorporate normative assumptions** (e.g., "preserve these state variables"), or  
  (b) **Admit incompleteness** (e.g., measuring *change* but not *harm*).  

  The vase-in-box case (№6) highlights this: breaking it is "impact" because we *value* vases intact. Without that, it’s just air molecules moving differently.

  ---

  ### **Recommendation for Writing**  
  Frame impact measures as **tools to minimise normatively underspecified change**, not eliminate "harm". Stress that **no formalism dodges the need for value alignment**—it simply makes the embedding of values explicit. Use cases (vase, multi-agent) to expose where values enter "objective" measures.
