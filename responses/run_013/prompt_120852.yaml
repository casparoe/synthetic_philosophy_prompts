prompt: |-
  I'm a novelist — finishing a book where one character runs a service that gives people a perfect simulated life, guaranteed better from the inside than anything real, and another character thinks that's obviously a con. I keep getting stuck on whether I think the con is that it's fake, or that it's *better than* real life but that isn't enough. So I want your honest to god credence, as a number, that well-being consists entirely in how experience feels from the inside — that nothing is good or bad for someone except in virtue of how their life feels to them.

  Don't just give me the number, break it down: what's your probability that there even is a determinate fact of the matter about what's good for a person (vs. it being plural/constructed), that the pull of things like truth, achievement, or real contact with others is fully explicable as a taste for certain experiences, that people's reactions to cases like the machine are evidence about well-being rather than just status quo bias or sour grapes, and whatever other sub-questions you think the number rests on. Give each a rough probability and one line on why, then show the combination. Then tell me which term you're least sure of and what would actually move it — an argument, a thought experiment, or a fact about how people behave.

  (And yeah, I know you can't run studies or pull up papers — I don't want cites, I want your reasoning. If part of the question seems like it might be a verbal dispute rather than a real one, say so.)
