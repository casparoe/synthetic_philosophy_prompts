  First, I need to validate their insight because it's sharp—they're spotting something fundamental. The etiological view (selected-for history) gives you malfunction and "why it exists," while the systemic view (current contribution) tells you "what it's doing now." That *is* two different questions. But I can't stop there because the user is already sensing there's more—they ask if the historical view does something the structural one *can't*, like explaining normativity (why we say a heart "should" pump blood even if it's defective).  

  The user also hints at meta-philosophy: is "malfunction" even a fact about the world, or just us projecting desires? That’s huge. If they’re flirting with anti-realism, they might be ready for the nuclear take: maybe *both* camps are smuggling in human interests. Etiology anchors "ought" in evolutionary history; systemic anchors it in current survival. But both "oughts" depend on valuing persistence (of lineages or organisms).  

  For progress: the user’s spot-on that awkward cases (rewired hearts, vestigial organs) aren’t knockout punches—they’re stress tests showing which question you’re answering. Real progress would be either: (a) a case that *requires* collapsing the two views (doesn’t exist?), or (b) admitting this is about what *we* need "function" to do (explain design vs. reverse-engineer systems).  

  Bottom line: It’s **mostly verbal** because the questions differ, **but** the residual disagreement is about whether biology needs normative concepts (like "malfunction") to be objective or if they’re human projections. That’s where the heat is.
answer: |-
  **Bottom line:** Your hypothesis is fundamentally correct—this is primarily two distinct questions under one ambiguous term, *but* with a residual substantive disagreement about whether biology requires irreducibly normative concepts.  

  ### Why it's mostly two questions:  
  1. **Your split holds:**  
     - **Historical/etiological view** (e.g., Millikan, Neander) answers: *"Why did this trait evolve, and what is it *supposed* to do?"* It explains persistence, provides norms for malfunction (e.g., a heart not pumping *is broken*), and is backward-looking.  
     - **Systemic/causal role view** (e.g., Cummins) answers: *"What does this trait *currently contribute* to the system's capacities?"* It explains how complex systems work *now*, ignores history, and is forward-looking/descriptive.  
  2. **Awkward cases aren’t counterexamples—they’re category checks:**  
     - A surgically rewired heart: Etiological function = pumping (it’s malfunctioning if rewired). Systemic function = new task (e.g., circulating coolant).  
     - Vestigial organs: Etiological function = ancestral role (e.g., whale pelvis for walking). Systemic function = potentially none, or a new accidental role.  
     - Exaptations: Etiological function = original selected effect. Systemic function = current causal contribution.  
     Neither view *fails*; they just answer different questions.  

  ### The residual substantive disagreement:  
  The conflict isn’t about cases—it’s about **whether biology needs normativity**:  
  - **Etiologists insist**: Biology must explain *purposiveness* (why traits *ought* to work a certain way). A "malfunctioning" heart isn’t just statistically atypical—it’s *failing* at what it was *for*. This normativity is grounded in selection history, making it objective.  
  - **Systemicists counter**: Biology can (and should) be purely descriptive. "Function" as causal role suffices; "malfunction" is just a value-laden folk concept. Injecting "oughts" into science is unsupported or anthropomorphic.  

  ### What would count as progress:  
  - **If etiologists could show**: Normative function is *indispensable* for explanations natural selection provides (e.g., why deleterious mutations are *errors*). If systemic views can’t capture this without smuggling in norms, etiology wins.  
  - **If systemicists could show**: All biological explanations (even selection-based ones) work fine with *only* causal roles, reducing "malfunction" to descriptive stats (e.g., "heart failure" = statistically atypical pumping). Normativity is just pragmatics.  
  - **A decisive case?** Neither camp is refuted by edge cases—they’re *reconciled* by your two-question split. Progress would require proving one view *cannot* handle a core biological concept (e.g., adaptation, disease) without contradiction or circularity.  

  **Your meta-doubt is spot-on**: The heart of the clash is whether "malfunction" reflects a *fact* (selection history) or a *human interest* (we value survival). Etiologists naturalize normativity; systemicists demote it to instrumental reasoning. That’s the unresolved rift—and it’s about philosophy, not biology.
