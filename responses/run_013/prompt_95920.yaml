prompt: |-
  For several years I have served on committees that resolve a single question by taking majority votes on each of its components separately — a hiring committee that votes on whether a candidate clears the research bar, then the teaching bar, then the funding bar, and only afterwards announces a decision to hire or not — and only recently did it strike me that such a procedure can produce a collective decision that no member of the committee actually holds, and that contradicts our own component-by-component majorities. I now have to explain this to a reading group of colleagues from law, medicine, and engineering, none of them philosophers, in a single ninety-minute session, and what I want from you is a plan for the explanation rather than the explanation itself. Set out the order in which the ideas must be introduced for the puzzle to feel like something we discovered rather than a conjuring trick: what has to be in place before the inconsistency even registers as a problem, and why each piece depends on the one before it. Identify the one example that should carry the whole session, state what it must contain — several issues that are logically connected, so that issue-by-issue majority voting can yield a majority for each premise and a majority against the conclusion those premises entail — and tell me whether the well-worn three-judge contract case is still the right vehicle or has gone stale. Then list the misconceptions they will bring or form — that this is merely a restatement of Arrow's theorem, that it is really about insincere or strategic voting, that the remedy is simply to vote on the conclusion instead of the premises, that it shows collective decision-making to be impossible — and mark the precise point in the sequence where each should be headed off. Close with a single question I can put to the room that would show whether they have grasped where the trouble comes from rather than merely followed the arithmetic, and tell me what I should explicitly refuse to go into at this level.
reasoning: |-
  We are going to explain the paradox of majority voting on separate components leading to an outcome that no individual member holds and that contradicts the component majorities. The key is to have the audience discover the puzzle step by step.

  **Overall Goal**: To show that when a decision is broken down into multiple independent yes/no votes (premises) and the final outcome is determined by the conjunction (or disjunction) of these premises, the majority vote on each premise might lead to a collective set of premises that imply a conclusion which is rejected by the majority when voted on directly.

  **Core Example**: We will use a single example throughout to avoid confusion. The well-worn three-judge contract case (from Kornhauser and Sager) is still effective and not stale for a non-philosophical audience. It's clear and relatable.

  **The Three-Judge Contract Case**:
  - There are three judges (A, B, C) deciding on a breach of contract case.
  - The law says the defendant is liable (must pay damages) if and only if:
    1. The defendant was contractually obligated (Promise), and
    2. The defendant failed to fulfill that obligation (Breach).
  - So, Liability = Promise AND Breach.

  - The judges' individual opinions:
    - Judge A: Promise (Yes), Breach (Yes) → therefore, Liability (Yes)
    - Judge B: Promise (Yes), Breach (No) → therefore, Liability (No)
    - Judge C: Promise (No), Breach (Yes) → therefore, Liability (No)

  - Now, if we vote on each issue separately:
    - Promise: 
        - A: Yes, B: Yes, C: No → majority says Yes (2-1)
    - Breach:
        - A: Yes, B: No, C: Yes → majority says Yes (2-1)
    - Therefore, by the majority votes, we have Promise and Breach both true, so Liability should be Yes.

  - But if we vote directly on Liability:
    - A: Yes, B: No, C: No → majority says No (2-1).

  Thus, the majority on the premises (Promise and Breach) leads to Liability, but the majority on the conclusion (Liability) is against it. Moreover, note that no individual judge holds the position that the majority outcome on the premises implies (which is Liability=Yes). Judge A holds Liability=Yes, but only because they believe both premises, but the collective outcome is not held by any judge because:
  - Judge A: holds (Promise, Breach) = (Yes, Yes) → Liability=Yes.
  - The collective outcome is (Promise, Breach) = (Yes, Yes) which implies Liability=Yes, but Judge B and C both hold Liability=No.

  So the collective outcome (Yes, Yes) is held by no one: 
  - Judge A: (Yes, Yes) → holds it? Actually, Judge A does hold (Yes, Yes). But note: the collective decision on the premises is (Yes, Yes) and that leads to Liability=Yes, but when we vote directly on Liability, we get No. And importantly, the set of beliefs (Yes, Yes) is held by Judge A, but the problem is that the majority on the conclusion disagrees with the implication of the majority on the premises.

  However, the paradox also highlights that the collective set of premises (Yes, Yes) is not the view of any one judge? Actually, it is Judge A's view. But note: the majority on the premises does not reflect a coherent individual view because:
  - The majority on Promise is 2-1 (Yes) and on Breach is 2-1 (Yes), but the only judge who holds both is Judge A. The other two judges each hold one of the premises but not the other. So the collective view on the premises is a combination that only one judge holds, but the conclusion drawn from that collective view (Liability) is rejected by two judges.

  But the real issue is: the collective decision on the premises leads to a conclusion that is rejected by the majority when they vote on the conclusion.

  **Plan for the Session**:

  1. **Introduction (10 minutes)**: 
     - Start with the context: committees making decisions by breaking down a complex question into components and voting on each. Give examples: hiring (research, teaching, funding), contract breach (promise, breach), medical diagnosis (symptom A, symptom B, etc.).
     - Emphasize that we assume each member votes sincerely on each component.

  2. **Building the Setting (10 minutes)**:
     - Present the three-judge contract case without the votes. Explain the rule: Liability if and only if both Promise and Breach are established.
     - Introduce the three judges and their individual positions (as above). Make a table:

       | Judge | Promise | Breach | Liability |
       |-------|---------|--------|-----------|
       | A     | Yes     | Yes    | Yes       |
       | B     | Yes     | No     | No        |
       | C     | No      | Yes    | No        |

     - Ask: What should the collective decision be? How would we decide?

  3. **Voting on Components (10 minutes)**:
     - Propose: Let's vote on each component (Promise and Breach) by majority.
     - Vote on Promise: majority (A and B say Yes) -> Yes.
     - Vote on Breach: majority (A and C say Yes) -> Yes.
     - Therefore, by the rule, Liability = Yes (since both premises are Yes).

  4. **Voting on the Conclusion (10 minutes)**:
     - Now, what if we vote directly on Liability?
     - A: Yes, B: No, C: No -> majority (2-1) says No.
     - So we have:
          - Component-wise majority: Liability should be Yes.
          - Direct vote on Liability: No.

     - Point out: This is inconsistent. The same group, using the same rule, gets two different outcomes depending on the voting method.

  5. **Highlighting the Problem (10 minutes)**:
     - Show that the outcome from the component voting (Liability=Yes) is not held by any judge. Wait, actually Judge A holds it. But note: the component-wise outcome (Promise=Yes, Breach=Yes) is held by Judge A. However, the majority of the judges (B and C) are against Liability. So the component-wise voting forces a conclusion that the majority rejects.
     - Also, note that the collective set of premises (Promise=Yes, Breach=Yes) is held by only one judge (A). The other two judges each disagree with one premise. So the collective view on the premises is a "Frankenstein" view that no one holds? Actually, A holds it. But the problem is that the majority on the conclusion is different.

     Clarify: The problem is that the collective decision on the premises leads to a conclusion that is not supported by the majority when they vote directly on the conclusion.

     Also, note that if we had voted directly on the conclusion, we would have gotten No, which is the view of the majority. But by breaking it down, we got Yes.

  6. **Why is this a problem? (5 minutes)**:
     - The committee's own rule (the definition of Liability) is being violated by their voting procedure. The rule says: if both premises are true, then liability holds. But when we have a majority on each premise, we get both true, so liability must hold. Yet, when asked directly, the majority says liability does not hold.

     - This is a logical inconsistency in the collective decision.

  7. **Addressing Misconceptions** (Weave these in as they come up, but plan for when):

     a. **This is just Arrow's theorem?** 
        - No. Arrow's theorem is about ranking preferences and the impossibility of a perfect voting system for three or more options. This is about the aggregation of judgments on interconnected propositions. It's a specific paradox (the discursive dilemma) that can occur even when we are only dealing with yes/no questions and majority rule. We are not aggregating preferences but judgments on multiple issues that are logically connected.

     b. **It's about strategic voting?**
        - No. We assume sincere voting. The paradox occurs even when everyone votes honestly.

     c. **The remedy is to vote on the conclusion instead of the premises?**
        - That would avoid the inconsistency, but then we lose the information about why the conclusion was reached. Also, sometimes we want to know the reasons (e.g., in hiring, we want to know if the candidate failed on research or teaching). Moreover, in some cases, the conclusion might be too complex to vote on without breaking it down.

     d. **It shows collective decision-making is impossible?**
        - No, it shows that one particular method (component-wise majority) can lead to inconsistency. There are other methods (e.g., voting on the conclusion, or using a different aggregation rule) that avoid this. But we must be aware of the trade-offs.

     - When to address:
          - Arrow: when someone brings it up, or when we are discussing the generality of the problem. We can say: "This is a different kind of problem. Arrow's theorem is about preference aggregation, but here we are aggregating judgments on multiple propositions that are logically connected. And note: majority voting on each proposition is an appealing method but leads to this paradox."
          - Strategic voting: when we introduce the example, we must emphasize that we are assuming everyone votes sincerely. We can say: "Even if everyone votes honestly, this problem can occur."
          - Remedy: when we get to the inconsistency, someone might suggest just voting on the conclusion. We can then discuss the pros and cons, but note that sometimes we need the component votes (for transparency, or because the conclusion is too complex). Also, if we only vote on the conclusion, we don't get to see the breakdown.
          - Impossible? At the end, when we wrap up, we can say: "This doesn't mean we can't make collective decisions. It means we have to choose our voting procedure carefully, knowing that each has trade-offs."

  8. **The Key Question to Check Understanding (5 minutes)**:
     - Ask: "In our example, if we vote on the components, we get both Promise and Breach as Yes, leading to Liability being Yes. But when we vote directly on Liability, we get No. Why does this happen? And what does it tell us about breaking down decisions into components and voting on each by majority?"

     - We want them to see that the majority on each component does not necessarily represent a view held by a majority (or even by any individual) when the components are connected. Specifically, the set of majority-approved premises is held by only one judge (A) and is rejected by the other two when it comes to the conclusion. The majority on the premises is a kind of "composite" that doesn't reflect a coherent individual position held by the majority.

     - Alternatively, we can ask: "Is there any judge who holds both Promise and Breach as Yes? And if so, how many? And what do the other judges think about Liability?" 
          Answer: Only Judge A holds both as Yes. But the majority on each component is achieved by different coalitions: 
            - Promise: A and B (so B, who thinks Breach is No, is part of the majority for Promise)
            - Breach: A and C (so C, who thinks Promise is No, is part of the majority for Breach)
          And when it comes to Liability, both B and C say No.

  9. **What to Refuse to Go Into**:
     - Avoid deep dives into:
          - Arrow's theorem and its proof.
          - Other aggregation functions (like premise-based vs conclusion-based) beyond a brief mention of the trade-offs.
          - Strategic voting in depth (we assume sincerity).
          - The general theorem on judgment aggregation (for example, the List-Pettit theorem) and its technicalities.
          - Variations with more issues or more voters (unless a question is asked, then we can say it can happen with any odd number above 1 and with more issues).

     - Keep it focused on the example and the paradox.

  **Timing Breakdown**:
  - 0-10 min: Introduction and setting.
  - 10-20 min: Present judges and their views.
  - 20-30 min: Vote on components and derive Liability.
  - 30-40 min: Vote on conclusion and show inconsistency.
  - 40-50 min: Discuss why it happens and the fact that the component-wise outcome is held by only one judge.
  - 50-60 min: Address misconceptions as they arise (or preemptively if the audience is quiet).
  - 60-80 min: Discussion and the key question.
  - 80-90 min: Wrap up and implications for real committees.

  **Adjustment**: Be flexible. If the audience gets it quickly, move to the implications and remedies. If not, spend more time on the example.

  **The Example**: The three-judge contract case is still the best because it's simple and the logic is clear. We'll use it.

  **Final Note**: Emphasize that this is not a magic trick but a fundamental issue in collective decision-making. The goal is to make them aware of the problem so they can design better procedures in their own committees.
answer: |-
  ### Plan for Explaining the Committee Voting Paradox

  #### **Guiding Principle**
  Frame the session as a collective discovery of a hidden flaw in familiar decision-making processes. Avoid upfront jargon; build intuition through a relatable example. The goal is to make the paradox feel *inevitable* once the pieces are in place, not like a technical trick.

  ---

  ### **Order of Ideas** (90-Minute Session)

  #### **1. Establish Real-World Context (10 min)**  
  **Goal:** Ground the discussion in concrete committee experiences.  
  - **Start with their world:** Ask colleagues to share examples of multi-component decisions (e.g., medical diagnosis: symptoms → condition; engineering: safety, cost, feasibility → project approval; law: evidence elements → verdict).  
  - **Highlight the procedure:** Emphasize that committees often vote on components (premises) separately, then combine results for a final decision.  
  - **Why now?** "We’ve all used this method—but today we’ll test if it reliably reflects our collective judgment."

  #### **2. Introduce a Single Example (20 min)**  
  **Goal:** Use one vivid case to carry the entire session. Reject abstract examples.  
  - **Chosen example:** **The three-judge contract case** (still optimal—it’s simple, relatable, and logically airtight).  
    - **Setup:** Three judges (A, B, C) decide if a defendant is liable for breach of contract.  
    - **Rule:** Liability requires two premises:  
      - P: A valid contract existed.  
      - Q: The defendant breached it.  
      - ∴ Liability = P AND Q.  
    - **Judges’ views:**  
      - Judge A: P true, Q true → **Liable**.  
      - Judge B: P true, Q false → **Not liable**.  
      - Judge C: P false, Q true → **Not liable**.  

  #### **3. Vote on Premises (15 min)**  
  **Goal:** Show "obvious" agreement on components.  
  - **Majority vote on P:** A and B say P true → **P passes (2-1)**.  
  - **Majority vote on Q:** A and C say Q true → **Q passes (2-1)**.  
  - **Infer conclusion:** P AND Q both true → **Collective decision: Liable**.  
  - **Check-in:** "Does this match how your committees operate? Any objections yet?"  

  #### **4. Vote on the Conclusion (10 min)**  
  **Goal:** Reveal the inconsistency.  
  - **Direct vote on liability:**  
    - Judge A: Liable (Yes).  
    - Judge B: Not liable (No).  
    - Judge C: Not liable (No).  
    → **Liability fails (2-1)**.  
  - **Contrast outcomes:**  
    - Premise-based: Liable.  
    - Conclusion-based: Not liable.  
  - **Pause:** "Hold that thought. We’ll unpack why this happens."  

  #### **5. Highlight the Paradox (15 min)**  
  **Goal:** Make the contradiction visceral and show it’s not arithmetic fluke.  
  - **Key observations:**  
    - **No individual holds the collective view:**  
      - Premise-based outcome (P true, Q true) is only held by Judge A.  
      - Judges B and C *both* reject P AND Q (B accepts P but not Q; C accepts Q but not P).  
    - **Self-contradiction:**  
      - The committee’s *own votes* show:  
        - Majority believes P (2-1).  
        - Majority believes Q (2-1).  
        - Majority rejects the conclusion those premises entail (2-1).  
  - **Emphasize:** "The procedure forces an outcome that contradicts the majority’s will and is held by *none* of us."  

  #### **6. Generalize the Problem (10 min)**  
  **Goal:** Abstract the logic without jargon.  
  - **Core structure:**  
    - Decisions with **multiple premises** (P, Q, ...) that **logically determine a conclusion** (e.g., P AND Q → Liability).  
    - Premise-by-premise majority voting can approve all premises but the conclusion fails under direct vote.  
  - **Why it matters:**  
    - This isn’t about bad faith—it’s a structural flaw in aggregating *linked* judgments.  
    - Real-world analogs: Hiring (research + teaching + funding → hire), medical triage (symptoms → treatment).  

  ---

  ### **Addressing Misconceptions**  
  Preempt these at specific points:  

  | **Misconception**                          | **When to Address**                          | **Response**                                                                 |
  |--------------------------------------------|----------------------------------------------|-----------------------------------------------------------------------------|
  | "This is just Arrow’s Theorem."            | After Step 6 (generalization).               | "Arrow’s Theorem is about ranking *preferences* (e.g., voting for candidates). This is about *logical consistency* in judgments on interconnected propositions. Different problem." |
  | "It’s about strategic voting."             | After Step 4 (revealing inconsistency).      | "We’re assuming everyone votes sincerely—no strategy. The paradox arises from the voting *method*, not dishonesty." |
  | "Just vote on the conclusion instead!"     | After Step 5 (highlighting paradox).         | "But then we lose transparency: *Why* did we reject liability? Was it no contract (P) or no breach (Q)? Committees need component-level reasoning for due process." |
  | "Collective decisions are impossible."     | During wrap-up.                              | "This doesn’t make decision-making impossible—it shows we need better *methods* (e.g., structured deliberation, modified voting rules), not abandonment." |

  ---

  ### **Closing Question to Test Understanding**  
  **Pose after Step 5:**  
  > "In our judge example, the committee voted 'yes' on both premises, leading to 'liable'—but only one judge actually supported that outcome. Why did the other two judges, who formed the majority against liability, vote 'yes' on the premises that forced it?"  

  **Why this works:**  
  - Reveals if they grasp the **coalition flaw**:  
    - Judge B (P true, Q false) voted for P, forming a majority with A.  
    - Judge C (P false, Q true) voted for Q, forming a majority with A.  
    - Together, B and C’s votes on *different premises* unintentionally created a premise-based outcome neither wanted.  
  - If they articulate this, they see the problem is **procedural**, not mathematical.

  ---

  ### **What to Explicitly Refuse**  
  **Do not dive into:**  
  - **Technical generalizations** (e.g., judgment aggregation theorems, Condorcet cycles).  
  - **Solutions** (e.g., premise vs. conclusion-based voting trade-offs)—save for follow-up discussions.  
  - **Philosophical debates** (e.g., "What is collective rationality?").  

  **Justification:** At this level, depth on these distracts from the core "aha" moment. The goal is awareness, not mastery.

  ---

  ### **Why This Flow Works**  
  1. **Starts concrete** (their committees) → builds intuition.  
  2. **Uses one extended example** (judges) → avoids cognitive overload.  
  3. **Reveals inconsistency before diagnosing it** → creates curiosity.  
  4. **Preempts misconceptions in real-time** → keeps focus on the mechanics.  
  5. **Closes with a non-arithmetic question** → tests conceptual grasp.  

  The paradox emerges as a natural consequence of their own assumptions—making it feel discovered, not taught.
