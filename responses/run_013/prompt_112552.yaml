answer: |-
  ### Diagnostic Decision Tree: Norms of Assertion

  **Start:** You hear someone assert, "Your flight leaves from Gate 7."  
  **Question 1:** Must there *necessarily* be a distinct rule *constitutive* of assertion itself (i.e., breaking it means you weren’t *really* asserting), or could the practice function without any such rule?  
  - **Branch A (No constitutive norm):** → **Leaf: Normative Quietism**  
    *Awkward Commitment:* Cannot explain why assertions feel inherently "wrong" when groundless, unlike guesses.  
  - **Branch B (Yes, constitutive norm):** → Proceed to Question 2.  

  **Question 2:** Does the primary norm govern *what you put forward* (the proposition itself) or *how you relate to it* (your mental state/commitment)?  
  - **Branch C (Governs the proposition):** → Proceed to Question 3.  
  - **Branch D (Governs your relation/commitment):** → Proceed to Question 5.  

  **Branch C Path (Proposition Governed):**  
  **Question 3:** Is the core requirement that the asserted proposition *becomes common ground* (a shared basis for discussion), or that it *accurately reflects the speaker’s commitment*?  
  - **Branch E (Common ground):** → **Leaf: Acceptance/Common-Ground View**  
    *Awkward Commitment:* Allows asserting known falsehoods if they advance dialogue (e.g., in bargaining).  
  - **Branch F (Speaker’s commitment):** → **Leaf: Sincerity/Truthfulness Norm**  
    *Awkward Commitment:* Permits asserting wildly irrational beliefs sincerely held (e.g., paranoid claims).  

  **Branch D Path (Relation/Commitment Governed):**  
  **Question 5:** In a standard lottery (1 million tickets, 1 winner), you hold 1 ticket. Is it permissible to assert, "My ticket won't win"?  
  - **Branch G (Yes, permissible):** → Proceed to Question 6.  
  - **Branch H (No, impermissible):** → Proceed to Question 7.  

  **Branch G Path (Lottery Assertion Permissible):**  
  **Question 6:** You assert a true proposition based on compelling but misleading evidence (a Gettier case: you see a convincing fake barn but assert "That’s a barn" while pointing coincidentally at the only real barn). Was your assertion permissible?  
  - **Branch I (Yes):** → **Leaf: Truth Norm**  
    *Awkward Commitment:* Permits "lucky" assertions with no justification if true.  
  - **Branch J (No):** → Proceed to Question 11.  

  **Branch H Path (Lottery Assertion Impermissible):**  
  **Question 7:** You assert a true proposition P, have strong evidence for P, but due to unusual circumstances, you don’t *know* P (e.g., unpossessed evidence against P exists). Was your assertion permissible?  
  - **Branch K (Yes):** → **Leaf: Justified Belief/Warrant Norm**  
    *Awkward Commitment:* Allows asserting truths one rationally believes but doesn’t know.  
  - **Branch L (No):** → **Leaf: Knowledge Norm**  
    *Awkward Commitment:* Forbids asserting truths in Gettier cases or based on statistical evidence alone.  

  **Branch J Path (Needs Justification Beyond Truth):**  
  **Question 11:** Must the speaker possess evidence *adequate for knowledge* at the moment of assertion, or is it sufficient that they are *responding responsibly* to their total evidence, even if it later proves misleading?  
  - **Branch M (Adequate for knowledge):** → **Leaf: Knowledge Norm** (Reachable via different path)  
  - **Branch N (Responsibly responding):** → **Leaf: Evidence-Responsiveness Norm**  
    *Awkward Commitment:* Permits assertions later shown to be unjustified if evidence was misleading *and* handled well.  

  **Question 8 (From Branch D):** Does the norm apply *uniformly* across contexts, or can it *vary* depending on stakes, audience, or topic?  
  - **Branch O (Uniform/Monistic):** → Your position is one of the leaves already reached (Truth, Knowledge, etc.).  
  - **Branch P (Varies/Pluralistic):** → **Leaf: Context-Sensitive Pluralism**  
    *Awkward Commitment:* Struggles to define clear boundaries for when norms shift (e.g., when do "high stakes" begin?).  

  **Question 9 (From Branch D):** If challenged a week later with new counterevidence, must you *retract* your earlier assertion if it *failed the norm then*, or only if you *now* fail the norm regarding the same content?  
  - **Branch Q (Retract if failed then):** → **Leaf: Diachronic/Retraction-Based Norm**  
    *Awkward Commitment:* Forces retracting assertions that were correct *and* justified when made, if new evidence undermines them.  
  - **Branch R (Only if fail now):** → Most synchronic norms (e.g., Knowledge Norm synchronic version) don’t require retraction solely based on past failure if current evidence supports it.  

  **Question 10:** Your research team agrees P is the best hypothesis. You assert P at a conference. Is the norm satisfied if *the group* knows/justifiably believes P, even if *you personally* have doubts?  
  - **Branch S (Group state suffices):** → **Leaf: Group-Based Norm** (Unnamed, unexplored variant)  
    *Awkward Commitment:* Individuals could licitly assert what they privately disbelieve if the group accepts it.  
  - **Branch T (Individual state crucial):** → Standard positions apply.  

  **Indistinguishable Pair:** The **Justified Belief Norm** (Branch K) and **Evidence-Responsiveness Norm** (Branch N) *cannot be reliably separated by this tree alone*. Both permit the lottery assertion (Question 5: No) and the Gettier assertion (Question 7: Yes).  
  *Further Question Needed:* "You assert a false proposition based on strong, non-misleading evidence that makes your belief highly rational (e.g., a well-calibrated weather forecast predicting no rain, but it rains). Was your assertion permissible?"  
  - *Yes* → Favours Evidence-Responsiveness Norm (focus on responsible handling).  
  - *No* → Favours Justified Belief/Warrant Norm (focus on actual justification/accuracy link).  

  **Scoring Key (Quiz Use):**  
  1. A → Quietism  
  2. E → Common-Ground  
  3. F → Sincerity  
  4. I → Truth Norm  
  5. K → Justified Belief Norm  
  6. L or M → Knowledge Norm  
  7. N → Evidence-Responsiveness Norm  
  8. P → Context-Sensitive Pluralism  
  9. Q → Diachronic/Retraction Norm  
  10. S → Group-Based Norm  
  *Note:* Paths converge; e.g., Knowledge Norm reached via Branch L or Branch M.
