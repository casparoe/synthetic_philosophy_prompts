  Here's a fresh case meeting your specifications, followed by the analysis and "honest bit." The case avoids nested lifetimes, uses non-trivial persistence for the matter-like entity, and flags key assumptions.

  ### The Case: The Grove and the Grove-Keeper's Masterpiece
  In an arboretum, a grove of aspen trees (A) begins when the first genetically identical stems sprout from a shared root system, forming a single biological organism. Decades later, the head gardener intentionally prunes and trains the grove into a cohesive, symmetrical shape, declaring it "The Sentinel" (B) – a topiary artwork. The grove (A) dies when the root system succumbs to blight, leaving dead but intact wood. However, "The Sentinel" (B) persists as the gardener preserves the dead structure, treating it as a sculptural relic. Thus, A (the living organism) begins before B (the artwork), B outlasts A after biological death, and they share all matter identically during their overlapping existence.  
  *(Assumption flagged: This relies on a biological criterion for the grove-organism's death (cessation of metabolic activity/root function) and an artefactual/cultural criterion for the artwork's persistence (intentional maintenance of form/designation as an artwork, even with dead matter).)*

  ### Analysis of Views
  1.  **Constitution/Coincidence View:**  
      *Says:* A and B are distinct objects. A (the grove-organism) is constituted by its matter but persists only while biologically alive. B (the artwork) is constituted by the same matter but persists as long as its form is culturally sustained. Their distinct persistence conditions (biological life vs. cultural artefact) explain the crossed lifetimes – A starts first as biological growth begins, B starts later upon artistic completion, and B outlasts A because cultural persistence outlives biological death.  
      *Why:* The difference in "kind" (organism vs. artwork) directly generates the difference in persistence conditions, allowing distinct objects to coincide materially yet have non-nested temporal boundaries.

  2.  **Dominant Sortal / One-Object View:**  
      *Says:* This view struggles and likely fragments. There is only one object, but no single "dominant" sortal ("organism" or "artwork") applies uncontroversially across its entire lifespan. If "organism" dominates, then B never truly exists as a distinct entity – the shaping is just a phase of the grove, which ceases entirely at death (denying B's persistence). If "artwork" dominates, then B's existence is artificially retrojected to the grove's beginning or the shaping is seen as B's "genesis," contradicting the stipulation that A starts first. Neither sortal comfortably governs the entire lifespan while respecting the crossed lifetimes.  
      *Why:* The case exploits the lack of a single, continuous dominant sortal by having the persistence conditions pull in opposite directions at the temporal extremes.

  3.  **Artefact Eliminativism (e.g., Merricks-style):**  
      *Says:* Only the grove-organism (A) truly exists as a composite object. "The Sentinel" (B) is not a real object; it's merely a concept or description applied to the grove at certain times. Therefore, there is no persistence of B after A's death. The "outlasting" is merely an illusion of our conceptual practices – only the dead matter (arranged grove-wise) remains, but it constitutes no persistent object (B). A starts and ends with the biological organism.  
      *Why:* Eliminativism denies the reality of artefact kinds like artworks. Thus, B's purported later existence is rejected, collapsing the case to a single object (A) with dead matter persisting after its demise. The crossed lifetimes disappear.

  4.  **Four-Dimensionalism:**  
      *Says:* There is a single spacetime worm with temporal parts. The temporal part before shaping is only A-parts (grove-organism parts). The temporal part after the grove's death is only B-parts (artwork parts). The temporal part during the overlap is shared by both A and B – these stages are common parts of the A-worm and the B-worm. The crossed lifetimes are simply the A-worm starting earlier and the B-worm ending later, with the worms overlapping in the middle region.  
      *Why:* 4D readily handles non-nested spatiotemporal regions. A and B are distinct sums of temporal parts of the same matter-arranged-grove-wise, differing only in their temporal boundaries.

  ### The Honest Bit
  *   **The Real Work:** The **non-trivial persistence condition of the matter-like entity (A)** is doing the crucial work. Specifically, A's persistence being tied to *biological function/life* (starting with sprouting/root activity, ending with metabolic death) – not mere matter – forces its earlier start and earlier end. If A were a lump of "dead matter," its persistence would default to mereological or spatiotemporal continuity, likely making it exist *before and after* B (the artefact), resulting in nested lifetimes (like statue/clay). The biological criterion prevents this nesting.
  *   **What Happens with Dead Matter?** If you swap the grove for inert matter (e.g., a naturally formed stone column (A) later carved into "The Obelisk" (B)), the lifetimes become nested. A (the column of stone) exists before carving begins (B comes into existence) and would persist after B is destroyed (if the rubble remains). The modal argument for distinctness (B could be destroyed while A remains intact) then runs in the standard direction, favoring constitution or 4D views.
  *   **Constitution Theorist's Attack & Cost:** The constitution theorist's strongest attack is indeed on **the biology**. They could argue:
      *   **Attack:** "Death doesn't destroy the grove-organism (A); it merely renders it non-living. A persists as the *dead grove-organism* until its matter is scattered. Thus, A still exists while B is preserved, and lifetimes *are* nested (A outlasts B only if the preserved structure is later dismantled)."
      *   **Cost:** This move requires abandoning standard biological persistence conditions, which typically link an organism's existence to its being alive (a dead cat is not a cat, but cat-matter). To maintain that A persists dead, the theorist must either:
          1.  **Adopt a non-biological (e.g., mereological) persistence condition for A**, undermining the core setup designed to block the "dead matter" intuition and collapsing back towards the standard case, or
          2.  **Stipulate a bizarre, hybrid persistence condition** (A persists as long as its *form* remains, even dead), which blurs the distinction between A and B and weakens the motivation for seeing them as distinct kinds with different persistence conditions. This undermines the constitution view's reliance on clear differences in kind-based persistence.
  *   **Agreement:** **Eliminativism and the One-Object view (if forced)** effectively agree in denying that B genuinely outlasts A. Eliminativism denies B exists at all. A One-Object view prioritizing the biological sortal denies B persists after death. Both reject the core phenomenon of crossed lifetimes involving two entities. Constitution and 4D agree on two entities with crossed lifetimes but explain it very differently (coincident objects vs. overlapping worms).
