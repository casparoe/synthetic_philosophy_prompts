prompt: |-
  I am a novelist, and for several years now I have sat on the editorial board of an annotated reissue series — a small line that brings out-of-print novels back into circulation with notes on those passages whose meaning readers have genuinely fought over. Volume by volume, the board decides which reading of a contested passage the edition will set as the text's sense and which it will banish to a footnote as a rival. We have ruled on enough of these cruxes by now that I can feel a rule forming behind our decisions, though I would be hard pressed to state it.

  Our record, as well as I can reconstruct it, is this. For Ashby's The Long Orchard, the closing reunion is written straight, and Ashby said as much in an interview at the time of publication; we printed the sincere reading. For Okonkwo's posthumous The Harmattan Papers, the author left no notes, no letters, nothing, and we settled the disputed crux on internal evidence alone. For Lindqvist's The Glassworks, the crux turns on an image that recurs at three points in the novel, and Lindqvist's letters confirm the recurrence was deliberate; we printed the reading that image supports. And for Ferreira's Nightbound, Ferreira told an interviewer twenty years after publication that a scene we had always read as tenderness had in fact been meant as cruelty, and we declined to change the printed reading, on the ground that a late remark cannot rewrite a published book.

  A new crux has now landed on my desk. The author's estate has turned up her working notebooks from the months in which she drafted the novel in question, and those notebooks show beyond any doubt that she intended a particular scene to be read as a cold, deliberate betrayal. The scene as written is not ambiguous in the ordinary way: nothing in its language, its structure, or its context signals betrayal, and any careful reader would take it for an act of loyalty. The notebooks are private, unpublished, and were unknown to anyone until last month.

  Tell me what the board will decide, or, if our record genuinely underdetermines the case, what we ought to decide in order to remain consistent with ourselves. Set out the candidate rules our past rulings are jointly compatible with, say what each of them predicts about this crux, and give me your best guess with your reasons for preferring it. Identify which of our earlier cruxes is the closest analog. And name the further crux — a case we have not yet faced — that would best separate whichever rules are still standing after this one, in particular the rule that lets a private, contemporaneous intention override the text and the rule that confines intention to what was publicly available to the book's first readers or else recoverable from the text itself.
reasoning: |-
  Okay, the user is a novelist and part of an editorial board for annotated reissues. They handle contested passages in out-of-print novels, deciding which interpretation to include in the main text versus footnotes. They've provided four past cases to establish a pattern, and now they have a new crux involving an author's private notebooks that reveal an intention contradicting the text. The user wants to know how the board will decide based on consistency, the rules derived from past decisions, the closest analog, and a future test case.

  First, I need to analyze the past rulings to identify any underlying principles. The key cases are:

  1. **Ashby's *The Long Orchard***: Used the author's public statement (interview) to confirm the sincere reading. This shows reliance on contemporaneous, public authorial intent.
  2. **Okonkwo's *The Harmattan Papers***: No external evidence; decision based solely on internal textual evidence. Here, the board prioritized the text itself when no authorial input was available.
  3. **Lindqvist's *The Glassworks***: Author's letters (published, known) confirmed a deliberate recurring image, so the board used that to support the interpretation. This again uses authorial intent but through documented, public sources.
  4. **Ferreira's *Nightbound***: Author's late interview (20 years post-publication) claimed a scene was meant as cruelty, but the board kept the original reading, dismissing late remarks as invalid for changing the published text. This establishes a cutoff for post-publication statements and prioritizes the text as it stands.

  From these, a pattern emerges: the board values **contemporaneous, public authorial intent** and **textual evidence**. Late or private inputs are discounted if they contradict the public text. The Ferreira case specifically rejects late remarks, emphasizing that the published book's integrity is paramount.

  Now, the new crux: An author's private, unpublished notebooks surface, showing she intended a scene as betrayal, but the text reads as loyalty. The notebooks are contemporaneous (from drafting) but were unknown until now. 

  Applying the past principles:
  - **Contemporaneous**: The notebooks are from the drafting period, so they're not "late" like Ferreira's interview. This might give them more weight.
  - **Private/Unpublished**: Unlike Ashby's interview or Lindqvist's letters, these weren't public. The board hasn't dealt with private evidence before.
  - **Textual Evidence**: The scene isn't ambiguous; it clearly reads as loyalty. The notebooks contradict the text without supporting textual cues.

  The Ferreira case is the closest analog because it deals with external intent versus the text. But there's a twist: Ferreira's input was late, while here it's contemporaneous but private. This is a new dimension.

  Possible rules compatible with past decisions:
  1. **Text as Final Arbiter**: Intent only matters if reflected in the text or supported by public evidence. Private intent is irrelevant. (Aligned with Ferreira and Okonkwo cases).
  2. **Contemporaneous Intent Only**: If intent is documented during drafting/publication, it can override the text, even if private. (But no past case supports overriding clear text with private evidence).
  3. **Public Availability Principle**: Only intent available to first readers (via text or public sources) counts. Private materials don't affect the reading. (Fits Ferreira rejection of late remarks and reliance on public evidence in Ashby/Lindqvist).

  Rule #3 seems strongest. The board consistently prioritizes what readers could know. Private notebooks weren't available, so they shouldn't change the reading. The text itself doesn't support betrayal, so forcing that reading would confuse careful readers.

  Prediction: The board will keep the loyalty reading in the text and footnote the notebook evidence as a rival interpretation. This maintains textual integrity and avoids privileging undisclosed intent.

  Closest analog is Ferreira, as both involve external intent claims that contradict the text. Ferreira's was late; this is contemporaneous but private. The board treats both as secondary to the published text.

  Future test case: An author's contemporaneous, public statement (e.g., an interview at publication) that contradicts the text. If the statement was available to first readers, does it override the text? This would force a choice between public intent and textual evidence. Past cases (Ashby) used intent that aligned with the text, not contradicted it. Handling this would clarify if public intent can trump clear text.
answer: |-
  Based on your board’s consistent pattern of prioritizing **the published text's integrity and publicly available evidence** over private or belated authorial statements, I predict the board will **reject the notebook evidence** and retain the scene’s reading as an act of loyalty in the main text, relegating the notebook’s “betrayal” interpretation to a footnote. Here’s the breakdown:

  ---

  ### **Candidate Rules Compatible with Past Rulings**
  Your decisions reveal an implicit hierarchy of evidence. I distill three coherent rules that align with your history:

  1. **The Public Text Principle**:  
     *The text as published is primary. Authorial intent is admissible only if (a) contemporaneous and publicly available (e.g., interviews, letters), or (b) corroborated by the text itself.*  
     - **Ashby**: Public interview (contemporaneous/available) supported the text → **Accepted**.  
     - **Lindqvist**: Letters (publicly available) confirmed textual patterns → **Accepted**.  
     - **Ferreira**: Late interview (non-contemporaneous/unavailable to readers) → **Rejected**.  
     - **Okonkwo**: No external evidence → Relied solely on the text.  
     - **New Crux Prediction**: Private notebooks (unavailable to readers) lack public corroboration → **Rejected**.

  2. **The Reader’s Horizon Principle**:  
     *Interpretations must be anchored to evidence accessible to the book’s first readers (text, paratexts, or public author statements). Private materials are irrelevant.*  
     - **Ferreira**: Late interview inaccessible to first readers → **Rejected**.  
     - **Okonkwo**: Only internal evidence (accessible to readers) → **Used**.  
     - **New Crux Prediction**: Notebooks undisclosed until now → **Rejected** as outside the reader’s horizon.

  3. **Contemporaneous Intent with Textual Alignment**:  
     *Authorial intent must be both contemporaneous AND consistent with the text’s language/structure. Private evidence can override only if the text is ambiguous.*  
     - **Lindqvist**: Letters (contemporaneous) aligned with textual imagery → **Accepted**.  
     - **New Crux Prediction**: Notebooks (contemporaneous) but text *unambiguously* reads as loyalty → **Rejected** (text overrides intent).

  ---

  ### **Decision for the New Crux**
  - **Prediction**: The board will retain "loyalty" in the main text and footnote the notebooks as a rival reading.  
  - **Reasoning**:  
    - The Ferreira case is your **closest analog**. Both involve extratextual authorial claims contradicting the text, but Ferreira’s late interview was rejected for being *non-contemporaneous*. Here, the notebooks *are* contemporaneous but fail the **public availability** test (Ferreira’s core logic) and the **textual coherence** test (Okonkwo/Lindqvist). The scene’s clarity ("any careful reader would take it for loyalty") mirrors Ferreira’s defense of the text against external interference.  
    - Crucially, your board treats the *published work* as a cultural artifact separate from private drafts. Accepting undisclosed intent would destabilize interpretation, privileging archival luck over readerly engagement. As with Ferreira, "a late remark [or private note] cannot rewrite a published book."  

  - **Inconsistency Risk**: If you accepted the notebooks, you’d contradict Ferreira (rejecting extratextual claims) and Okonkwo (prioritizing internal evidence). The text itself is not ambiguous—forcing "betrayal" would violate Lindqvist’s rule that intent must align with textual evidence.

  ---

  ### **The Closest Analog: Ferreira’s *Nightbound***  
  Both cases share:  
  - A clear textual reading (tenderness/loyalty).  
  - An external authorial claim contradicting it (late interview/private notebooks).  
  - A board philosophy that the published text’s autonomy outweighs post-hoc authorial revisions.  
  The distinction (contemporaneous vs. late notebooks) is secondary to your consistent **rejection of non-public evidence**.

  ---

  ### **The Future Crux to Separate the Rules**  
  To test the tension between **contemporaneous private intent** vs. **public/textual primacy**, pose this:  
  > *An author gives a televised interview upon a novel’s release, explicitly stating that a seemingly heroic act by the protagonist is meant as satire. The text itself contains no irony, and readers universally interpreted it sincerely. The interview was public but went largely unnoticed. Decades later, the estate cites it to demand a satirical reading.*  

  - **Why This Splits the Rules**:  
    - **Public Text Principle**: Rejects the interview (text lacks irony; interview is extrinsic).  
    - **Reader’s Horizon Principle**: Accepts the interview (publicly available, even if overlooked).  
    - **Contemporaneous Intent Rule**: Accepts the interview (contemporaneous/public) but rejects if text cannot support satire.  
  - **Your Board’s Likely Path**: You’d reject the interview, extending Ferreira/Nightbound: availability alone is insufficient if the text resists the reading. But this crux would force a choice—does *public* contemporaneous intent override an uncooperative text? Your history suggests no, cementing the text as supreme.  

  This future case would isolate whether your philosophy truly centers the *text* or the *author’s public persona*—and I suspect your rulings would favor the former.
