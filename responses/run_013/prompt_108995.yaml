answer: |-
  Your half-formed rule—match the objective chance unless your extra evidence is directly correlated with the outcome—captures the core intuition well and aligns with standard Bayesian principles. Let's refine it, test it against your cases, and then address the coin machine scenarios.

  ### Refined Principle: The Chance-Evidence Separation
  - **When to match the chance**: Set your credence equal to the known objective chance when you have no additional evidence that is *outcome-relevant* (i.e., evidence that correlates directly with the outcome rather than just the chance mechanism).  
  - **When to override the chance**: If you possess outcome-relevant evidence (e.g., predictions, past outcomes, or causal links to the outcome), use the total evidence to update your credence via conditionalization (Bayes' theorem).  

  This principle respects the **Principal Principle** (match known chances) but avoids "double-counting" by recognizing when evidence "screens off" the chance (i.e., when evidence directly pertains to the outcome, rendering the chance statisticially irrelevant for your credence).  

  ### Applying the Principle to Your Cases:
  1. **Fair coin, nothing else known**:  
     - Objective chance = 0.5.  
     - No extra evidence → credence = 0.5.  
     - **Verdict**: Correct.  

  2. **Coin from randomized-bias factory (unknown bias)**:  
     - Overall chance of heads = 0.5 (calculated as 0.5 × 0.9 + 0.5 × 0.1).  
     - No outcome-relevant evidence (you don’t know the bias) → credence = 0.5.  
     - **Verdict**: Correct. The chance is "known" in a statistical sense, and no evidence overrides it.  

  3. **Same coin, known bias is 0.9 heads**:  
     - Objective chance = 0.9.  
     - No outcome-relevant evidence beyond this → credence = 0.9.  
     - **Verdict**: Correct.  

  4. **Flip already happened, you saw tails (chance was 0.5)**:  
     - Objective chance was 0.5, but now you have direct outcome evidence (tails) → credence = 0 for heads.  
     - **Verdict**: Correct. The seen outcome overrides the historical chance.  

  5. **Reliable predictor says fair flip will be heads**:  
     - Objective chance = 0.5, but the prediction is outcome-relevant evidence.  
     - If the predictor’s reliability is known (e.g., 90% accurate), your credence = P(heads | prediction) ≈ 0.90.  
     - **Verdict**: Correct. The prediction correlates with the outcome, not the chance mechanism.  

  Your rule holds up here. The predictor case shows that "extra evidence correlated with the outcome" (not just the chance) is key.  

  ### The Coin Machine Scenarios: Pathological Cases
  Your proposed machines create self-referential loops where your credence directly affects the outcome. This breaks the standard chance-evidence separation. Let’s analyze both machines.  

  #### **Machine 1**:  
  - **Setup**: Heads occurs iff your credence in heads at flip time is *below* 0.5.  
  - **Problem**: No coherent credence exists.  
    - Suppose your credence is *p*.  
    - Heads occurs iff *p* < 0.5.  
    - Thus, *p* should equal P(heads) = 1 if *p* < 0.5, or 0 if *p* ≥ 0.5.  
    - Contradictions:  
      - If *p* < 0.5, then *p* must be 1 (since heads occurs), but 1 ≮ 0.5.  
      - If *p* ≥ 0.5, then *p* must be 0 (since tails occurs), but 0 ≱ 0.5.  
  - **Result**: No fixed point. Your credence cannot be stable.  
  - **Resolution**: This scenario is **incoherent**. Avoid it or reject its premises. In practice, you cannot form a rational credence here because the setup violates the assumptions of probability theory (self-reference without equilibrium).  

  #### **Machine 2**:  
  - **Setup**: Heads occurs iff your credence in heads at flip time is *above* 0.5.  
  - **Analysis**:  
    - Let *p* be your credence.  
    - Heads occurs iff *p* > 0.5.  
    - Thus, *p* should equal P(heads) = 1 if *p* > 0.5, or 0 if *p* ≤ 0.5.  
    - Fixed points:  
      - If *p* = 1 (>0.5), then heads occurs → *p* = 1 is consistent.  
      - If *p* = 0 (≤0.5), then tails occurs → *p* = 0 is consistent.  
  - **Result**: Two stable credences (*p* = 0 or *p* = 1), but *no neutral credence* (e.g., *p* = 0.5 fails because if *p* = 0.5, tails occurs, so you should have *p* = 0).  
  - **Resolution**:  
    - You *must* choose *p* = 0 or *p* = 1 arbitrarily (e.g., based on a coin toss before setting your credence).  
    - Why? Both are self-consistent:  
      - Set *p* = 1 → heads occurs → your belief is confirmed.  
      - Set *p* = 0 → tails occurs → your belief is confirmed.  
    - **This violates your half-formed rule**: The objective chance isn’t independent of your credence, so you cannot naively "match" it. Instead, you select a self-fulfilling prophecy.  

  ### Which Verdicts to Give Up?
  - **Machine 1**: Give up the expectation of *any* rational credence. The scenario is ill-posed.  
  - **Machine 2**: Give up the idea that credence must be "caused" only by evidence. Here, your choice *creates* the truth, so extreme credences (0 or 1) are stable but arbitrary.  

  ### Final Framework
  1. **Normal cases (non-self-referential)**:  
     - Match the known objective chance, unless you have outcome-relevant evidence (e.g., predictions, observed results).  
     - Update credences using Bayes’ theorem with all evidence.  

  2. **Pathological cases (self-referential)**:  
     - **No stable credence** (Machine 1): Avoid or reject.  
     - **Self-fulfilling extremes** (Machine 2): Choose 0 or 1 arbitrarily—both are consistent but lack grounding in prior evidence.  

  Your intuition about evidence correlation is sound. The coin machines are edge cases where chance and credence interdependencies break standard rationality constraints. In real-world scenarios, stick to your rule: let chances guide you unless outcome-specific evidence overrides them.
