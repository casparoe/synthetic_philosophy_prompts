prompt: |-
  I have recently begun sitting with a small Buddhist study group, largely because of a difficult year, and I have found myself trying to reverse-engineer what one of the older members — a woman I will call R., whose judgments I have come to trust — actually holds about karma as a matter of desert. What she has said about the cases we have discussed:

  - A surgeon performs a technically flawless operation, intending only to heal, and the patient dies of a condition the operation did not cause: R. says the surgeon incurs no karmic debt, though the death is a misfortune.
  - A driver glances at a phone, means no harm, and kills a pedestrian: R. says this does incur karmic debt; carelessness counts even where malice is absent.
  - Someone privately wishes a rival dead but does nothing: R. says no debt attaches to the wish alone.
  - Someone gives anonymously to a charity that is in fact a front for harm, when a few minutes of checking would have shown this: R. says the giver incurs debt, because they failed to find out what they were supporting.

  The case I now turn over is my own. Last spring I urged my mother to move into a care home, having looked into it carefully and with nothing but her good in view. She fell there, broke a hip, and died within the year. Nothing about the fall was foreseeable from where I stood.

  What I want from you is not really a yes or no. I want the rule R. appears to be running; the other rules that fit her four verdicts just as well; what each of those rules predicts about my case; which rule you would bet she is actually running, and why; and the further case that would best separate the rules that survive. Please also be explicit about which parts of this are settled among people who genuinely know the Buddhist traditions and which are contested — whether karma is best understood as a causal law or as a ledger, whether what matters is the agent's knowledge or their causal contribution, whether intention is required at all — and do not present a contested reading as the consensus.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a complex ethical puzzle rooted in Buddhist karma theory, specifically seeking to reverse-engineer the reasoning pattern of someone they call R. based on four case judgments, then apply it to their personal situation. 

  First, I need to analyze R.'s four cases to identify common principles. The surgeon case shows outcome isn't decisive when intention is pure and due diligence done. The distracted driver case introduces negligence as karmically significant even without malice. The malicious thought case suggests mental states alone don't generate karma without action. The misguided charity case emphasizes responsibility for willful ignorance. 

  Hmm, the core tension seems to be between intention, due diligence, and foreseeable consequences. R. appears to reject strict liability while affirming that negligence breaks the threshold of karmic responsibility. But there are at least three viable interpretations of her framework: a negligence-focused view, an expanded intention model, or a hybrid approach. Each would judge the user's care home situation differently.

  For the user's personal case - advising their mother's move to a care home - the key factors are: pure intention (undisputed), due diligence (user claims thorough research), and unforeseeability of the fall. Under the negligence model, this would likely incur no karmic debt. But the hybrid view might scrutinize whether any aspect of the fall could have been anticipated. 

  I should also clarify what's doctrinally settled in Buddhism versus contested. The primacy of intention (cetanā) is canonical, but interpretations vary on negligence and due diligence. The causal law versus ledger metaphor represents different school traditions - Theravada tends toward natural law, Mahayana toward more transactional frameworks. Contemporary teachers debate whether "constructive knowledge" (what one should have known) carries karmic weight.

  The most revealing test case might be someone taking reasonable precautions where harm still occurs through freakish coincidence - like checking food allergies but a guest dies from unknown contamination. This could separate frameworks that emphasize effort versus outcomes. 

  Throughout this, I'll maintain the requested distinction between consensus positions (like intention's centrality) and contested interpretations (like negligence standards), while acknowledging my own analysis is provisional. The user's deeper need seems to be less about theoretical clarity and more about finding ethical resolution for their grief - so the response should offer principled analysis while leaving space for their emotional processing.
answer: |-
  Based on R.'s four cases and Buddhist doctrinal nuances, here's a breakdown of her apparent rule, alternatives, predictions for your case, and areas of consensus/contention:

  **R.'s Apparent Core Rule (Most Likely):**
  *   Intention (*cetanā*) is necessary but **not sufficient** for karmic debt.
  *   Karmic debt arises from **volitional actions (karma)** driven by intention, **including actions of negligence or willful ignorance**.
  *   **Key Threshold:** **Foreseeability/Reasonable Care** matters. Harm caused by actions where negative consequences *could reasonably have been anticipated or prevented through due diligence* incurs debt, even without malice. Pure accidents after due diligence or purely mental states without action do not.

  **How R.'s Cases Fit Her Rule:**
  1.  **Surgeon:** Pure intention + flawless action + unforeseeable complication = **No Debt.** (Action was skillful, harm unforeseen).
  2.  **Driver:** Pure intention? + **Negligent Action** (glancing at phone) + foreseeable harm = **Debt.** (Action was careless, harm foreseeable).
  3.  **Wishing Death:** Negative intention + **No Action** = **No Debt.** (No volitional *act*).
  4.  **Charity Giver:** Positive intention? + **Negligent Action** (not checking) + foreseeable harm (supporting bad actors *could* be found) = **Debt.** (Action was willfully ignorant, harm foreseeable).

  **Alternative Rules Consistent with R.'s Four Verdicts:**
  1.  **Strict Intention + Causation:**
      *   Debt requires **intention + a causal link between the volitional act and the harm.**
      *   *Fits Cases:* Surgeon (no causal link intention->death? Unclear), Driver (causal link), Wish (no act, no causation), Charity (causal link via support).
      *   *Problem:* Unclear on foreseeability/non-malicious causation (like surgeon). Why no debt for surgeon but debt for driver? Relies on implicit negligence.
      *   **Prediction for Your Case:** Likely **No Debt** (Pure intention, no direct causal link between your recommendation and the unforeseeable fall?).

  2.  **Intention + Responsibility for Outcomes within Agent's Sphere:**
      *   Debt requires intention + the harm occurring within the sphere of influence/responsibility created by the agent's action, **regardless of specific foreseeability.**
      *   *Fits Cases:* Surgeon (sphere: operation; death outside intended/expected sphere? Unclear), Driver (sphere: driving; death within sphere), Wish (no sphere created), Charity (sphere: donation; harm within sphere of influence created).
      *   *Problem:* Why no surgeon debt? Requires defining "sphere" tightly (only intended medical outcome). Blurs into foreseeability.
      *   **Prediction for Your Case:** **Debt?** (Your recommendation placed mother in the care home 'sphere'; harm occurred there. But was the *fall* within the *intended/responsible* sphere of "safe care"? Unclear).

  3.  **Intention + Gross Deviation from Skillful Means:**
      *   Debt requires intention + the action **grossly deviating** from what a reasonably skillful/virtuous person would do in that situation.
      *   *Fits Cases:* Surgeon (skillful), Driver (gross deviation: distracted driving), Wish (no action to judge), Charity (gross deviation: no due diligence).
      *   *Problem:* "Gross deviation" is vague. Why driver yes, but surgeon no? Relies on implicit standard of care (negligence).
      *   **Prediction for Your Case:** Likely **No Debt** (Recommendation made carefully, not a gross deviation).

  **Which Rule Would I Bet R. is Running?**
  I'd strongly bet on **"Intention + Negligence/Willful Ignorance (Failure of Due Diligence/Foreseeability)" as the core threshold.** It most cleanly explains the distinction between the surgeon (no negligence) and the driver/charity giver (clear negligence/failure of reasonable care), while excluding mere wishes (no action). Foreseeability/reasonable care is the implicit bridge in all her debt cases.

  **Prediction for Your Case (Based on R.'s Likely Rule):**
  *   **Pure Intention?** (Undisputed: "nothing but her good in view").
  *   **Volitional Action?** (Yes: urging the move).
  *   **Negligence/Willful Ignorance?** (Key Question: "looked into it carefully," "nothing foreseeable"). If your diligence was truly reasonable and the fall was genuinely unforeseeable *despite* that diligence, **R. would likely say NO KARMIC DEBT.**
  *   **Analogy:** Much closer to the **Surgeon** than the Driver or Charity Giver. Misfortune, not karmic debt.

  **Test Case to Separate Surviving Rules:**
  *   **Scenario:** A homeowner carefully checks their old but well-maintained deck railing before a party, finds it secure. A guest leans on it normally, it gives way due to a completely hidden internal rot, and the guest is seriously injured.
  *   *R.'s Likely Rule (Negligence/Foreseeability):* **No Debt.** Harm was unforeseeable despite reasonable care/diligence.
  *   *Strict Intention + Causation:* **Debt?** (Intention to host + causal link via providing the deck). Unclear and inconsistent with surgeon.
  *   *Intention + Sphere of Responsibility:* **Likely Debt.** Harm occurred within the sphere of responsibility (their property/home).
  *   *Intention + Gross Deviation:* **No Debt.** Checking was reasonable, not a gross deviation.

  **Buddhist Consensus vs. Contention:**

  1.  **Karma as Law vs. Ledger:**
      *   **Consensus:** Karma is fundamentally understood as a **natural law of cause and effect** (*karma-vipāka*), not a divine judgment or literal "ledger." Actions (*karma*) plant seeds that ripen into results (*vipāka*) based on conditions. (Theravada, Mahayana core).
      *   **Contention:** Emphasis varies. Some popular interpretations/mythology use ledger-like metaphors. Philosophical depth vs. folk understanding differs.

  2.  **Primacy of Intention (*Cetanā*):**
      *   **Strong Consensus:** "Intention, I tell you, is karma. Intending, one does karma..." (AN 6.63). The **volitional impulse** behind an action is the *primary* determinant of its karmic quality. Malicious intent creates negative karma; wholesome intent creates positive karma.
      *   **Contention:** *Degree* and *application*. Does *all* karma *require* intention? Most say yes for significant karma, but some schools (e.g., certain Vaibhāṣika views) allow for unintentional actions to have minor karmic weight. The role of *negligence* (as in R.'s view) often falls under analyzing the intention *behind the careless act* (e.g., valuing distraction over safety).

  3.  **Role of Knowledge & Causation:**
      *   **Consensus:** Ignorance (*avijjā*) is a root cause of suffering and unskillful action. **Intention is shaped by understanding (or lack thereof).** Causation is complex and interdependent (*pratītyasamutpāda*); results require conditions to ripen.
      *   **Contention:**
          *   **"Constructive Knowledge"/Due Diligence:** Is failing to know what you *should* have known (like the charity giver) equivalent to intentional wrong for karma? R.'s view leans yes; other interpretations might weight the *actual* intention at the moment of giving more heavily. This is a major grey area.
          *   **Causal Contribution:** While the *act* is the vehicle for intention, how tightly must the *specific harm* be linked to the *specific intention*? The surgeon case highlights this. Most agree mere association isn't enough, but defining the link is debated. Pure accident vs. negligent accident is key (R.'s driver).

  **Regarding Your Case & R.'s Framework:**
  Based on your description and R.'s apparent emphasis on **foreseeability and reasonable diligence as the threshold separating misfortune from karmic debt**, her likely verdict would be **no karmic debt incurred**. Your intention was pure, your action (urging the move) was based on careful research, and the harm (the fall) was unforeseeable. This aligns strongly with her surgeon case verdict. The profound grief and guilt you feel are part of the human condition (*dukkha*), but within the karmic framework R. seems to use, they do not signify a karmic debt stemming from your actions. The core Buddhist teaching here would likely focus on processing the grief with compassion and understanding the impermanent, conditioned nature of all events, rather than seeking karmic blame.
