  B: Yeah, that's Moore's paradox for you.

  A: But if I say: "Yesterday I had my phone but I didn't believe I had it" — that's fine. Or: "B has his phone, but A doesn't believe it." (pointing at B) Wait, that doesn't apply because you don't have your phone out.

  B: Exactly. So what now?

  A: How about: "A has his phone, but B doesn't believe it." (to B) Do you believe it?

  B: I do. It's right there.

  A: (frustrated) Then I'll say: "A has his phone, but A doesn't believe it." But that's still bad.

  B: That's the stronger version. You're asserting you have the phone and that you believe you don't. That's a contradiction in your assertion.

  A: (suddenly) I know! (puts the phone away) Now it's in the past! "I was holding my phone, but I didn't believe I was holding it." There, fixed.

  B: But you just put it away. So now you're not holding it.

  A: Exactly. So now it's true: I was holding it and I didn't believe it. But now I do believe it? Wait, no, I still don't believe I was holding it? I'm confused.

  B: (laughing) This is why philosophers go crazy.

  A: (smirking) And that's why it's funny.

  [End]

  This version ends with the character creating a new paradox about the past, which they then question, leading to further confusion. The punchline is the circular confusion and the nod to philosophers.

  Choose whichever scenario you prefer. Both highlight the paradox and the loopholes, and the humor comes from the characters' attempts to outwit the paradox only to get more entangled.

