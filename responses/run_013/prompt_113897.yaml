prompt: |-
  Alright, I'm a phil prof who's somehow ended up chairing the funding panel for our faculty's internal research grants — twice a year we read about forty proposals and decide who gets seed money. I keep running into the higher-order-evidence problem and my panelists dont have the vocabulary for it. Like: I finish a proposal convinced it's strong, then a colleague whose judgment I trust says it's thin; or I recall that panels like ours reliably over-fund anything that sounds interdisciplinary and under-fund the plodding-but-solid work; or the dean circulates a calibration sheet showing that, across past rounds, each of our confidence ratings barely predicted whether the project ever produced anything, and that a couple of us are actually below chance on the "will this get cited" call. And we still have to vote — we cant suspend judgment and go home, somebody has to rank the pile and send it up.

  So dont give me a seminar on conciliationism, give me a procedure the panel can actually run: turn what we know about higher-order evidence and epistemic akrasia into a checklist for a panelist who's just gotten evidence that their own read is unreliable. The questions to ask in order, what a yes and a no to each look like, where it tells you to discount your own read and where to stand pat, and what to do when you have to cast a score while thinking your own scoring is garbage. Run it on two of my cases — the disagreeing-colleague one and the calibration-sheet one where someone has to act on a judgment they think is junk. Say where it'll misfire, and give me one case where following it forces a panelist to do something they'll hate.

  Give it back as exactly five numbered items, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Okay, the user is a philosophy professor chairing a faculty research grant panel. They're struggling with higher-order evidence (HOE) issues, like trusting their own judgment when colleagues disagree or data shows their past ratings were poor. They need a practical checklist for panelists to handle these situations, not theoretical discussions. 

  Hmm, they specifically want a five-step procedure that tells panelists when to adjust their scores and when to hold firm. They mentioned two cases: colleague disagreement and calibration data revealing poor predictive accuracy. The solution must force uncomfortable actions in some scenarios. 

  First, I need to identify core HOE dilemmas: epistemic akrasia (believing against one's judgment) vs stubbornness. The procedure should anchor on external reliability indicators. Key triggers: disagreement from trusted peers, or statistical proof of bias/inaccuracy. 

  For the colleague case: if the dissenter is reliable and has full access to the proposal, the panelist should moderate their score. But if the dissenter is biased or skimmed the proposal, holding firm might be justified. 

  For the calibration case: proof of personal inaccuracy (like below-chance citation predictions) demands score adjustment toward panel average. But if the data shows systemic errors (e.g., entire panel overfunds X), everyone should correct for that bias. 

  The painful scenario? When a panelist must downgrade a proposal they personally love because HOE overwhelmingly indicts their judgment. Classic akrasia in action. 

  ...Wait, did I cover all requirements? Five numbered steps, no fluff. Cases analyzed. One hate-inducing outcome. Yep. The "discount and recalibrate" step will feel brutal but necessary when data screams "you're bad at this." 

  Final check: avoids theory, focuses on actionable questions. Uses "reliability" as the north star. Nods to institutional realities (must vote anyway). Good.
answer: |-
  Here is the five-step procedure:  

  1. **Identify HOE source reliability**  
     Ask: *Is this higher-order evidence (e.g., colleague dissent, calibration data) from a source I judge reliable about this domain?*  
     YES → Proceed to step 2.  
     NO → Ignore HOE; stand pat.  
     *Example (calibration sheet): If data shows your past "will this get cited" ratings were below chance, source is reliable → proceed.*  

  2. **Assess HOE scope and relevance**  
     Ask: *Does the HOE directly challenge my current judgment’s reliability for this specific proposal?*  
     YES → Proceed to step 3.  
     NO → Stand pat.  
     *Example (colleague): If they read the full proposal and critique its core argument, YES. If they only skimmed and complain about font choice, NO.*  

  3. **Determine corrigibility**  
     Ask: *Can I concretely adjust my judgment using the HOE without arbitrariness?*  
     YES → Discount your read; apply correction → step 4.  
     NO → Nullify your vote → step 5.  
     *Example (calibration sheet): If data shows you systematically overrate "interdisciplinary" proposals, YES (discount those). If HOE just says "you’re unreliable" without pattern, NO.*  

  4. **Apply mechanical correction**  
     Adjust your score using the HOE’s explicit directive:  
     - *Colleague dissent:* Shift score halfway toward theirs (e.g., 8 → 7 if they rate 6).  
     - *Bias calibration:* If HOE shows +1 bias on category X, subtract 1 from X proposals.  
     - *Accuracy calibration:* If your past scores correlated poorly with outcomes, weight your vote 50% less.  
     *Example: After step 3 YES on colleague dissent, change 8 to 7.*  

  5. **Vote under akrasia**  
     If at step 3 you answered NO (cannot correct concretely) but must vote:  
     Submit your original score but flag it as epistemically compromised in panel notes.  
     *Forced hate case: You LOVE a proposal but calibration data proves your "passion picks" always fail. Step 3 demands discounting → you slash its score, killing its funding chance.*  

  ---  
  **Misfires**: Overcorrects when HOE is coincidental (e.g., one bad calibration round) or undercorrects when HOE reveals deep incompetence.  
  **Cases resolved**:  
  - *Colleague dissent*: If reliable + specific (steps 1-2 YES), mechanically compromise (step 4).  
  - *Calibration sheet*: If proves personal inaccuracy (steps 1-2 YES) but no pattern (step 3 NO), vote akratically (step 5).
