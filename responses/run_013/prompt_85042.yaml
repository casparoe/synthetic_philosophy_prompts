prompt: |-
  I've been reading rationalist and effective-altruism blogs and forums for years, and I've never gotten a clean account of the priority view. A post I came across recently summarized it as follows, and I'd like to know how much of it I should keep:

  "The priority view says that benefiting people matters more, morally, the worse off those people are: a given gain in well-being counts for more, the lower the level of the person who receives it. So far as I can tell it's egalitarianism with a friendlier face — the two views give the same verdict in almost every real case, since both hold that an unequal outcome is worse than an equal one, and both tell us to push resources toward the bottom until the gap narrows. Like other consequentialist views, it ranks outcomes by how much weighted well-being they contain. Its real foundation is the diminishing marginal utility of income: a hundred dollars to someone sleeping rough buys far more well-being than a hundred dollars to a hedge-fund manager, so the hundred dollars to the rough sleeper should weigh more heavily in the moral calculus. The standard objection to views of this kind is the leveling-down objection. If equality is what matters, then a world in which everyone is equally badly off is better than a world in which everyone is better off but unequally so, the worst off included. The priority view inherits that objection, and since almost nobody thinks leveling down is an improvement, the view looks unworkable. The lesson, I take it, is that we should go back to plain utilitarianism, with perhaps a mild thumb on the scale for the poor."

  My instinct has always been that the whole point of the priority view was to get around the leveling-down objection, but I couldn't reconstruct the reasoning if you asked me to, and I suspect I'm mixing it up with something else. I don't need references — I want the substance.

  Please go through the summary claim by claim. For each one, tell me what a philosopher working on distributive justice would accept as stated, what they would call a defensible simplification, what a defender of the priority view would object to, and what is simply wrong. I'm especially interested in the places where the summary's errors are load-bearing for its conclusion: does the closing verdict follow from any part of the summary that survives correction, and if not, what would follow instead? Where a distinction can be made vivid, give me a concrete case. In particular, I'd like one pair of outcomes on which the priority view and plain utilitarianism disagree, and a second pair on which the priority view and a rule of "always help the worst off first" disagree. Finally, if you had to rewrite the summary so that a careful defender of the priority view would sign off on it, what are the two or three changes that matter most?
reasoning: |-
  Alright, let me unpack this user's query. They've been into rationalist and EA content for years but are struggling with the priority view. The summary they found has several claims they want verified. First, I need to address each part of that summary step by step.

  The user mentions that the priority view is like egalitarianism with a friendlier face. But actually, priority view isn't about equality at all. It's about giving weight to well-being based on how badly off someone is. That's a key difference. Egalitarianism cares about reducing inequality, while priority view cares about absolute well-being levels. The leveling-down objection hits egalitarianism but not priority view. The summary confuses this, so I need to clarify that distinction.

  Then there's the claim about diminishing marginal utility of income. The user's summary links it directly to income, but priority view is about well-being, not money. Money is just a proxy. Philosophers emphasize well-being as the metric. Plus, diminishing marginal utility supports utilitarianism too, not just priority view. So pointing that out is important.

  The leveling-down objection part is where the summary really goes wrong. It says priority view inherits the objection, but actually, priority view avoids it. Leveling down makes everyone worse off, which priority view wouldn't support. The user thought the whole point was to avoid this objection, which is correct. So I need to highlight that error and explain why priority view doesn't fall into that trap.

  Looking at the user's deeper needs: they want clarity on fundamental concepts in distributive justice. They might be trying to apply these ideas in EA contexts, like resource allocation. Their confusion between priority view and egalitarianism could lead to misinformed decisions. By correcting these points, I can help them make better ethical choices.

  I should provide concrete examples. For utilitarianism vs. priority view: giving to a moderately deprived person vs. a severely deprived one. Utilitarianism might favor the larger overall gain, while priority view picks the worse-off. For priority vs. leximin: helping the worst-off even if it's inefficient. Examples make the theories tangible.

  Key changes to the summary: clarify that priority view isn't about equality, it avoids leveling down, and it's based on well-being, not just income. Emphasize that priority view focuses on absolute deprivation. The user's conclusion favoring utilitarianism is based on misunderstandings, so correcting those might shift their view.

  Finally, ensuring the response is structured but not too academic. Use plain language, address each claim, and reinforce the user's correct instincts about avoiding leveling down. That should give them the clarity they need.
answer: |-
  Here's a breakdown of the summary, claim by claim, followed by your requests for concrete cases and a revised summary:

  **Claim-by-Claim Analysis:**

  1.  **"The priority view says that benefiting people matters more, morally, the worse off those people are: a given gain in well-being counts for more, the lower the level of the person who receives it."**
      *   **Acceptable:** This is the core, standard definition. Philosophers would accept this as a correct starting point.
      *   **Simplification:** It's defensible as a summary of the core idea.
      *   **Defender's Objection:** A defender might quibble about "matters more, morally" potentially implying a lexical difference rather than a continuous weighting function (priority is usually continuous prioritization, not an absolute lexicographic rule). They'd prefer "receives greater moral weight."

  2.  **"So far as I can tell it's egalitarianism with a friendlier face — the two views give the same verdict in almost every real case, since both hold that an unequal outcome is worse than an equal one, and both tell us to push resources toward the bottom until the gap narrows."**
      *   **Acceptable:** They *sometimes* recommend similar policies (helping the worst off) in practice due to diminishing marginal utility & empirical realities.
      *   **Simplification:** Calling it "egalitarianism with a friendlier face" is a *dangerous* simplification, not a defensible one. It obscures the fundamental distinction.
      *   **Defender's Objection:** This is a **major error** and **load-bearing for the summary's conclusion**. Priority view proponents vehemently reject this conflation.
          *   **Foundation:** Egalitarianism values *equality itself* as intrinsically good. Priority view values *improving the condition of the worse off* due to their absolute level of deprivation, *not* because it reduces inequality. Equality is irrelevant to the priority view's *foundation*.
          *   **Unequal Outcome:** Priority view does *not* inherently hold "an unequal outcome is worse than an equal one." It holds that an outcome where someone is *absolutely worse off* is worse, regardless of whether others are equal or unequal. The *reason* for favoring transfers is the *absolute badness* of being low, not the *relative gap*.
          *   **Veracity:** While practical recommendations often overlap (due to diminishing marginal utility), they can diverge significantly, especially in thought experiments designed to isolate the principles (like leveling down).
      *   **Simply Wrong:** Equating the foundational motivations. Priority view is not fundamentally concerned with equality; egalitarianism is.

  3.  **"Like other consequentialist views, it ranks outcomes by how much weighted well-being they contain."**
      *   **Acceptable:** Yes, it's a form of consequentialism (welfarism specifically) that aggregates weighted well-being. Philosophers accept this.
      *   **Simplification:** Defensible. The key is the nature of the weighting (priority weighting).
      *   **Defender's Objection:** None. This is accurate.

  4.  **"Its real foundation is the diminishing marginal utility of income..."**
      *   **Acceptable:** Diminishing marginal utility (DMU) of resources *supports* the practical application of the priority view and is a common empirical reason people find it plausible.
      *   **Simplification:** Calling it the "real foundation" is a significant oversimplification.
      *   **Defender's Objection:**
          *   **Metric:** Priority view is about the *moral weight* of gains in **well-being**, not income. Income is only a means to well-being. DMU of *income* is an empirical phenomenon supporting the idea that resources often translate into well-being gains more efficiently for the worse off. But the *moral* foundation is the diminishing *moral value* of *absolute well-being gains* as a person's *absolute well-being level* increases.
          *   **Foundation vs. Support:** DMU of resources is evidence *for* the priority view and explains why its recommendations often align with utilitarianism + DMU. However, the *moral* foundation is the intrinsic ethical claim that a benefit to a worse-off person matters more *simply because they are worse off in absolute terms*. DMU is an empirical, contingent fact; the priority weighting is a normative principle.
      *   **Simply Wrong:** Stating DMU of income is the "real foundation." The foundation is the normative principle concerning the moral weight of well-being gains at different absolute levels.

  5.  **"The standard objection to views of this kind is the leveling-down objection. If equality is what matters, then a world in which everyone is equally badly off is better than a world in which everyone is better off but unequally so, the worst off included."**
      *   **Acceptable:** This is a correct description of the leveling-down objection *against egalitarianism*.
      *   **Simplification:** Defensible description of the objection itself.
      *   **Defender's Objection:** The claim that the priority view is a "view of this kind" (implying it shares egalitarianism's foundational commitment to equality) is **deeply mistaken** and **load-bearing**.
      *   **Simply Wrong:** Applying the leveling-down objection *as an objection to the priority view*. This is the summary's **core error**.

  6.  **"The priority view inherits that objection..."**
      *   **Acceptable:** Utterly rejected.
      *   **Simplification:** Not defensible.
      *   **Defender's Objection:** This is **fundamentally and categorically wrong** and the **primary reason the summary fails**. The *whole point* of the priority view (vs. telic egalitarianism) is to *avoid* the leveling-down objection. Priority view cares about absolute well-being levels. Leveling down makes the worst-off person *even worse off* in absolute terms. Therefore, a leveling down *always* makes the outcome worse according to the priority view. It does *not* value the resulting equality.
      *   **Simply Wrong:** Yes. Priority view does *not* inherit the leveling-down objection; it was designed explicitly to avoid it.

  7.  **"...and since almost nobody thinks leveling down is an improvement, the view looks unworkable."**
      *   **Acceptable:** True that almost nobody thinks leveling down is an improvement.
      *   **Simplification:** Defensible regarding consensus on leveling down.
      *   **Defender's Objection:** Based entirely on the false premise that the priority view is susceptible to the leveling-down objection. Since it isn't, this conclusion doesn't follow. The priority view *agrees* that leveling down is not an improvement.
      *   **Simply Wrong:** The conclusion that the priority view is unworkable *because* it supposedly endorses leveling down is wrong.

  8.  **"The lesson, I take it, is that we should go back to plain utilitarianism, with perhaps a mild thumb on the scale for the poor."**
      *   **Acceptable:** Rejected.
      *   **Simplification:** Rejected.
      *   **Defender's Objection:** This conclusion only follows if the previous errors (conflation with egalitarianism, susceptibility to leveling down) are accepted. Since those premises are false, the conclusion doesn't hold. Utilitarianism (sum-total) + DMU often coincides with priority view recommendations empirically, but they are distinct normative principles that *can* diverge. The "mild thumb" downplays the fundamental normative difference.
      *   **Simply Wrong:** As a conclusion drawn from this flawed chain of reasoning.

  **Does the closing verdict follow?** No. The closing verdict ("go back to utilitarianism") relies entirely on the mistaken claims that the priority view is a form of egalitarianism (Claim 2) and therefore susceptible to the leveling-down objection (Claims 5 & 6). Since these claims are false, the conclusion does not follow. The priority view remains a distinct and viable alternative *precisely because* it avoids leveling down while prioritizing the worse-off.

  **Concrete Cases:**

  1.  **Priority View vs. Utilitarianism:**
      *   **Situation:** You have a fixed resource (e.g., a life-saving drug dose) to give to one of two people.
      *   **Person A:** Severely ill, near death. Giving them the drug saves their life, increasing their well-being dramatically (say, from 10 to 70 utils).
      *   **Person B:** Moderately ill, suffering but stable. Giving them the drug cures them completely, increasing their well-being significantly (say, from 60 to 100 utils).
      *   **Utilitarianism:** Choose Person B. Total gain = 40 utils (100-60) > 60 utils (70-10) gain for Person A. Maximizes sum total.
      *   **Priority View:** Choose Person A. Although the *absolute gain* is smaller (60 utils vs 40 utils), the gain occurs to someone who is *much worse off* initially (10 vs 60). The priority weighting gives much greater moral weight to benefiting the person at level 10 than the person at level 60. Saving the worse-off life is prioritized.

  2.  **Priority View vs. "Always Help Worst-Off First" (Leximin/Sufficientarianism-ish Rule):**
      *   **Situation:** You have resources to help two groups.
      *   **Group 1 (Worst-Off):** 10 people at well-being level 20. Helping each costs $10,000 and raises their well-being to 21 (gain of 1 util per person).
      *   **Group 2 (Very Badly Off, but better than Group 1):** 100 people at well-being level 25. Helping each costs $1,000 and raises their well-being to 30 (gain of 5 utils per person). Total resources are limited; you can only help one group.
      *   **"Always Help Worst-Off First" (Leximin):** Help Group 1. They are the single worst off individuals. Raising the absolute floor is paramount, regardless of cost or gains to others.
      *   **Priority View:** Help Group 2. While Group 1 is slightly worse off (20 vs 25), the cost per util gain is astronomical for Group 1 ($10,000/util) compared to Group 2 ($200/util). Furthermore, helping Group 2 generates vastly more *priority-weighted* well-being: each gain of 5 utils at level 25 (which is still very low) receives significant weight, and there are 100 such gains. Helping Group 1 gives only 10 tiny gains (1 util each) at level 20. The priority view, while weighting gains to the worse off more heavily, still aggregates the *total* weighted gain. The inefficiency of helping Group 1 outweighs the fact that they are the very worst off. (Sufficientarianism might also favor Group 2 if level 25 is below the sufficiency threshold).

  **Rewritten Summary (Key Changes):**

  "The priority view says that benefiting people matters more, morally, the worse off those people are **in absolute terms**: a given gain in well-being counts for more, the lower the **absolute well-being level** of the person who receives it. It **differs fundamentally from egalitarianism**. While egalitarianism values equality for its own sake, the priority view is solely concerned with **improving the absolute condition of the worse off**; it assigns **no intrinsic value to equality**. Consequently, the priority view **clearly avoids the leveling-down objection** – making everyone worse off just to achieve equality is never an improvement. Like other consequentialist views, it ranks outcomes by aggregating weighted well-being. **While the diminishing marginal utility of resources often aligns with its recommendations in practice, its core foundation is the ethical claim about the diminishing moral weight of well-being gains as absolute well-being increases.**"

  **Key Changes:**
  1.  **Clarified Metric & Foundation:** Explicitly states the metric is *absolute well-being level*, not income. Separates the normative foundation (diminishing moral weight of gains) from the supporting empirical phenomenon (DMU of resources).
  2.  **Distinguished from Egalitarianism:** Explicitly and strongly states the fundamental difference: priority view cares about absolute levels of the worse off, *not* equality. This is crucial.
  3.  **Addressed Leveling-Down:** Explicitly states that the priority view avoids the leveling-down objection, which is its primary advantage over telic egalitarianism. This corrects the summary's most damaging error.

  This revised summary accurately captures the core idea, its key distinction from egalitarianism, its avoidance of leveling down, and clarifies its foundation, allowing a defender to sign off.
