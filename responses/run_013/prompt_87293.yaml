prompt: |-
  I'm slowly working through Thucydides on the Mytilene affair — Athens votes to kill every adult male on the island, then a second assembly the next day reverses itself — and I've gotten stuck on Diodotus' speech, the part where he argues that the death penalty can't deter anyone. I follow the gist but I cant tell what the argument is actually doing. Here's the passage in an old public-domain translation, so the English is clunky:

  "All, states and individuals, are alike prone to err, and there is no law that will prevent them; or why should men have exhausted the list of punishments in search of enactments to protect them from evil-doers? It is probable that in early times the penalties for the greatest offences were less severe, and that, as these were disregarded, the penalty of death has been by degrees in most cases arrived at, which is itself disregarded in like manner. Either then some means of terror more terrible than this must be discovered, or it must be owned that this restraint is useless; and that as long as poverty gives men the courage of necessity, or plenty fills them with the ambition which belongs to insolence and pride, and the other conditions of life remain each under the thraldom of some fatal and master passion, so long will the impulse never be wanting to drive men into danger. Hope also and cupidity, the one leading and the other following, the one conceiving the attempt, the other suggesting the facility of succeeding, cause the widest ruin, and, although invisible agents, are far stronger than the dangers that are seen. Fortune, too, powerfully helps the delusion, and by the unexpected aid that she sometimes lends, tempts men to venture with inferior means; and this is especially the case with communities, because the stakes played for are the highest, freedom or empire, and, when all are acting together, each man irrationally magnifies his own capacity. In fine, it is impossible to prevent, and only great simplicity can hope to prevent, human nature doing what it has once set its mind upon, by force of law or by any other deterrent force whatsoever."

  Take the role of someone who teaches Greek political thought and walk me through this carefully. Think it through before you answer, and start by just breaking the passage into its separate claims before saying anything about how they're supposed to fit together. Then:

  - Is he claiming punishment never deters, or something narrower? And does the hope-and-cupidity bit commit him to more than he wants, given he's still fine with punishing the Mytilenaeans and the assembly ends up putting a lot of them to death anyway?
  - The escalation point — penalties get harsher over time and each new maximum just gets disregarded in turn — looks like it has a no-last-step structure. Is that the actual argument, and does it cut against Athens as much as against its subjects?
  - What is "great simplicity" doing in that last sentence? I suspect the translation is flattening something. Is it an insult to the audience, or a claim about what kind of mind thinks deterrence works?
  - People say this is the ancient version of the idea that certainty of punishment deters more than severity does. Is it actually that, or just adjacent to it?

  Dont cite anything or give me a reading list — I have no internet here. Just flag where you're unsure, and where the Greek would settle the question.
