prompt: |-
  So my department just switched on the AI-detection feature in the plagiarism software, and as a first-year TA I'm the one who gets to read the flags. Here's the actual setup, because I think the details are the whole point. Every submitted essay gets a score from 0 to 100 for "percent AI-generated." Under 20, nothing happens. Between 20 and 60, the instructor has to sit down with the student for a "developmental conversation." Over 60, it goes to the academic integrity office as suspected misconduct. The software's own docs, which I read because I'm that kind of person, say the score "should not be used as the sole basis for adverse action" and isn't proof that AI was used at all. My department read that and kept the thresholds anyway, just adding a line to the handbook that the score is "one input among many." Also the score is per essay, but obviously if a student used a chatbot it might be for one paragraph, or for the outline, or to fix the grammar, and the number doesn't tell you which.

  I can't stop chewing on this and I dont have the vocabulary for what's bugging me. It feels like the whole apparatus is quietly assuming things about what writing is and what a mind does, and then the disclaimer is assuming something else, and nobody notices they don't match.

  What I want from you: what philosophical commitments does this practice presuppose? Does treating the score as a measurable magnitude with meaningful thresholds commit us to there being a real, continuous property of "AI-ness" in a text -- and if so, is that property about the text or about the process that produced it? Does the detection project itself presuppose that human and machine writing leave different fingerprints, and how does that sit with the "stochastic parrots" / fancy-autocomplete line (no understanding, just next-token prediction -- so maybe no signature to find) versus the view that these models really do understand (so maybe there's no principled difference in the output at all)? Which view of authorship, intention, and understanding does the misconduct rule need, and which rival views does it quietly rule out? And is the practice internally consistent given its own disclaimer, or is the disclaimer doing something else -- liability-shifting, maybe -- rather than describing the epistemology?

  Please give it to me in four sections, in this order:

  1. "What it presupposes" -- about a paragraph, the implicit theory spelled out.
  2. "What it rules out" -- about a paragraph, the rival views the practice can't accommodate.
  3. "Where it's underdetermined" -- short, just the parts several different theories would all license equally well.
  4. "What would have to change" -- about a paragraph, what the practice would look like if we replaced the presupposed view with, say, the idea that authorship comes in degrees or that the relevant fact is about process rather than product.
reasoning: |-
  Okay, the user is a first-year TA dealing with their department's new AI-detection system for student essays. They're troubled by the philosophical inconsistencies in the setup and want a structured analysis. Let me unpack their query layer by layer.

  First, the practical setup: essays get an "AI-percentage" score triggering actions at 20/60 thresholds. The software's disclaimer says scores shouldn't be the sole basis for action, but the department treats them as "one input among many" while keeping rigid thresholds. The TA senses cognitive dissonance between the system's mechanics and its stated epistemology.

  Their core concern hinges on implied philosophical commitments. They're asking about:
  - Whether "AI-ness" is treated as a real, continuous property
  - Whether detection presupposes inherent output differences between humans and AI
  - How this interacts with conflicting NLP theories (e.g. "stochastic parrots" vs. understanding-based models)
  - What model of authorship/intention the misconduct rule requires
  - Whether the disclaimer contradicts the practice

  The TA also hints at anxiety about their role in enforcing potentially flawed systems. There's unspoken tension between institutional efficiency and pedagogical ethics here.

  For section 1 (presuppositions), I'll argue the system assumes:
  1. "AI-ness" is quantifiable and linear
  2. Text carries process fingerprints
  3. Human and AI writing are categorically distinct
  4. Authorship is binary (human-or-machine)
  5. The score meaningfully correlates with misconduct extent

  Section 2 (rival views ruled out) must counter:
  - Process-oriented views (e.g. partial AI assistance)
  - Continuum theories of authorship
  - "Stochastic parrot" perspectives denying detectable differences
  - Student intent as irrelevant
  - Threshold arbitrariness critiques

  Section 3 (underdetermined) will note:
  - What "20-60% AI" even means operationally
  - Whether editing/outlining uses "count" equally
  - How "one input among many" should weight the score

  For section 4 (needed changes), alternatives could include:
  - Process-disclosure requirements
  - Qualitative assessments of AI use purpose
  - Dynamic thresholds
  - Shifting focus from detection to pedagogy

  The TA's depth suggests they might appreciate references to Borges' "Funes the Memorious" (quantification obsession) or Latour's actor-network theory (human/nonhuman authorship). But I'll keep it focused since they requested strict structure.

  Notably, they're not asking for practical workarounds but philosophical grounding - probably to articulate their unease to superiors. The analysis should arm them with clear terminology about epistemic incoherence.
answer: |-
  Here’s a breakdown of the philosophical commitments and tensions in your department’s AI-detection practice, structured as requested:

  ---

  ### 1. What It Presupposes  
  The practice assumes **textual determinism**: that "AI-generated" content leaves an intrinsic, quantifiable signature in the text itself, independent of its production process. It treats "AI-ness" as a continuous, measurable property of the *product* (like chemical composition), implying that human and machine writing exhibit distinct, stable patterns detectable at scale. This presupposes a **categorical boundary** between human and AI authorship, where "authentic" writing is purely human-cognitive (intentional, embodied) and AI output is mechanistically different. The thresholds (20/60) further assume this property is meaningfully linear—e.g., 40% AI is twice as "tainted" as 20%—and that such percentages reliably map to *misconduct severity*. Crucially, it frames authorship as **binary**: a text is either "by a human" or "by AI," ignoring hybrid or collaborative creation.

  ---

  ### 2. What It Rules Out  
  The system cannot accommodate:  
  - **Process-based views of authorship**: If authorship is defined by *intent and agency* (e.g., a student editing AI output critically), the score’s focus on textual artifacts becomes irrelevant.  
  - **Continuum theories**: Rival views holding that *all* writing is socio-technical (using tools like grammar checkers, templates, or even subconscious "internal autocomplete") render the human/AI dichotomy artificial.  
  - **"Stochastic parrot" critiques**: If LLMs merely remix training data without generating a unique "fingerprint," detection collapses—there is no stable "AI-ness" to measure.  
  - **Anti-essentialism**: Perspectives denying *any* inherent textual difference between human and machine output (e.g., if an LLM perfectly mimics a human) make detection epistemically incoherent.  
  - **Intentionality as key**: The score ignores *why* AI was used (e.g., accessibility aid vs. fraud), ruling out ethical frameworks where misconduct depends on deceptive intent, not textual origin.  

  ---

  ### 3. Where It’s Underdetermined  
  - **What the percentage quantifies**: Is it sentence origin? Stylistic similarity? Training-data resonance? The software’s methodology is opaque.  
  - **The ontology of "partial" AI use**: Does an AI-generated outline "contaminate" 10% or 50% of the final text? The score arbitrates arbitrarily.  
  - **How "one input among many" integrates**: If the score isn’t proof, what evidence *would* override it? The procedure is silent.  

  ---

  ### 4. What Would Have to Change  
  If authorship were seen as **process-oriented** or **gradient**, practices would shift radically:  
  - **Disclose process, not product**: Students might document *how* they used AI (e.g., "I generated three bullet points, then expanded them myself"), with misconduct hinging on deception, not detection scores.  
  - **Thresholds as pedagogical, not forensic**: Scores >20 might trigger conversations about *effective tool use* (e.g., "How did AI help your thinking?") rather than suspicion. Above 60? Revise the essay to clarify original contributions.  
  - **Abolish linear quantification**: Replace percentages with qualitative descriptors (e.g., "heavy editing assistance," "conceptual scaffolding") tied to learning outcomes.  
  - **Redefine misconduct**: Focus on intent to deceive or failure to engage cognitively (e.g., submitting unedited AI output as original work), assessed via oral defenses or drafting histories.  
  The disclaimer’s role would flip: from liability shield to genuine epistemology, acknowledging that "AI-ness" is not in the text, but in the writer’s relationship to their tools.  

  ---

  ### Core Tension  
  The system’s machinery assumes **textual essentialism** (AI leaves a trace), while its disclaimer nods to **pragmatic constructivism** (meaning depends on context). This isn’t just inconsistent—it outsources ethical judgment to software never designed for it. The thresholds imply precision where none exists, turning epistemology into administrative theater.
