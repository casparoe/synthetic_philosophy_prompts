  You're a decision theorist who's good at spotting when a debate is stuck because two different questions got run together, and I need you to help me write a short research proposal. Setting: three months, one person, small grant, so scope is real. Topic: expected-value fanaticism. My half-formed idea is that the usual fight — bounded vs unbounded value, or whether you're allowed a probability threshold below which you just ignore the case — is aimed at the wrong axis. I think the fault line is diachronic. Any rule that refuses to be moved by a minuscule probability of an enormous payoff looks like it can be milked by someone who offers you a long enough sequence of such bets, and any rule tough enough to survive that looks like it has to be fanatical after all. So what I want made precise is roughly: is there a decision rule that (a) never lets an arbitrarily small probability outweigh a certain moderate loss, (b) is dynamically consistent in the sense that a plan you'd endorse up front you'd still endorse at every later stage, and (c) isn't a sitting duck for a bookie? State the question so it has a determinate answer, explain why the existing positions don't settle it, lay out what I'd actually do month by month, say what a result would look like and what would count as the project failing, and be honest about whether this fits in three months. Brainstorm a couple of ways to sharpen the question before you commit to one. Dont bother with citations, I'll add those.
