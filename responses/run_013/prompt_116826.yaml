  First, we must state Good's theorem precisely.

  Good's theorem (originally by I.J. Good) is about the value of information in decision theory. It can be stated as:

  **Theorem (Good, 1967):** In a decision problem, if an agent can make an observation (which may be partial or complete) at no cost and then choose an action, the expected utility of the optimal strategy that uses the observation is at least as high as the expected utility of the optimal strategy without the observation.

  Assumptions:
  1. The decision maker is rational in the sense of maximizing expected utility (with a consistent utility function and subjective probabilities).
  2. The observation is costless (no direct cost or disutility from obtaining the information).
  3. The information is "free" in the sense that it does not constrain future actions (i.e., the agent can choose any action after observing the outcome, just as they could without the observation).
  4. The decision problem is static in the sense that the state of the world does not change during the observation (except through the act of observation, but the theorem assumes that the observation does not change the state of the world that is relevant to the decision).
  5. The observation yields a random outcome (which may be a signal about the state of the world) and the agent knows the conditional probabilities of the states given the signal.

  The theorem is a result in Bayesian decision theory.

  Now, we go through the author's claims:

  1. "The expected utility of observing first and afterwards choosing the best act still available is never lower than the expected utility of simply choosing the best act now, in ignorance."
     - This is a correct statement of the theorem. Let EU(no info) be the expected utility of the best act without the observation, and EU(with info) be the expected utility of the strategy that first observes and then chooses the best act given the observation. Then EU(with info) >= EU(no info).

  2. "This holds whatever the observation turns out to reveal and however coarse or fine the evidence may be"
     - The theorem is about the ex-ante expected utility (before the observation is made). The author seems to be implying that in every possible outcome of the observation, the agent is at least as well off as without the observation. This is not what the theorem says. The theorem says that the expectation is at least as high. It is possible that for some realizations of the signal, the agent ends up worse off than if they had not observed. But on average (and in expectation) they are better off. So this claim is an overstatement.

  3. "That is why economists say information is always valuable and why a rational agent will never decline free evidence"
     - This is a standard interpretation of Good's theorem. However, note that the theorem requires that the information is costless and that there are no indirect costs (like psychological costs). Also, the agent must be able to use the information optimally. So within the strict assumptions, this is correct. But if we relax any of the assumptions, it may not hold.

  4. "It finally disposes of the romantic notion that some truths are better left unknown — since there is no state of the world in which learning the truth leaves you worse off than remaining ignorant."
     - This is a major overstatement. The theorem does not say that in every state of the world the agent is better off. It says the expected utility (averaged over all states and observations) is at least as high. Moreover, it is possible that in some states the agent ends up worse off. Also, the theorem does not account for:
        - Psychological factors: learning a truth might cause anxiety or regret that the utility function does not capture.
        - Strategic considerations: in a game, others might react to what you know.
        - The act of obtaining information might change the world (e.g., in quantum mechanics, but also in social settings).
        - The information might not be free (if it has a cost, even if small, then it might not be worth it).

  Now, we address the moral about ignorance and test cases:

  The author's moral that "there is no state of affairs in which learning the truth leaves you worse off than remaining ignorant" does not follow from Good's theorem. The theorem is about ex-ante expected utility. It does not guarantee that in every realized state of the world the agent is better off. In fact, it is easy to construct examples where in some states the agent is worse off.

  Test cases:

  1. **A patient who would rather not learn a prognosis:**
     - Suppose a patient has a terminal illness and will die in a month. Without knowing the prognosis, the patient may enjoy the month. If they learn the prognosis, they may become depressed and not enjoy the time. The utility function might capture this: the disutility from depression might outweigh the benefits of knowing. But note: Good's theorem assumes that the utility function already incorporates all psychological effects. So if the utility function is defined appropriately (including the psychological state), then the theorem applies. However, if the utility function does not account for the disutility of knowing (or if the agent cannot properly evaluate the disutility), then the theorem's assumptions are violated. In practice, people might have a utility function that assigns negative utility to knowing bad news. Then, the observation (learning the prognosis) is not costless. The cost is the psychological harm. Therefore, the theorem does not apply. So the patient might rationally decline.

  2. **Evidence that is entirely irrelevant to the decision:**
     - Suppose the evidence is independent of the state of the world that affects the decision. Then, the expected utility with the information is the same as without. So it doesn't hurt, but it doesn't help. The theorem says "never lower", so it holds. The agent is indifferent about getting the information. But note: the theorem says the expected utility is at least as high. So it's okay to get it, but not necessary. The author's claim that the agent will never decline free evidence still holds because it doesn't hurt. However, if there is any cost at all (even a tiny one, like the time to listen), then it might be declined.

  3. **Evidence that is cheap but not free:**
     - The theorem requires the observation to be costless. If there is a cost, then the net value (expected utility minus cost) might be negative. So it might be rational to decline. For example, if the cost of obtaining the information is $1 and the expected benefit is $0.50, then the agent would decline.

