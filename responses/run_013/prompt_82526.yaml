          Severity: serious (but not fatal, because the author might be able to argue that the symmetry constraint is prior to the Humean account).

       3. The essay says: "Chance is what remains of your credence once you forget your position". This sounds like a subjectivist interpretation of chance. But the Principal Principle is often seen as connecting subjective credence with objective chance. The author needs to clarify the ontological status of chance in their account.

