   1. Definition: A situation is "relocation-symmetric" if two agents who differ only in which position they occupy (and share total evidence) must assign the same credence to the outcome at their own position.

   2. Thesis: The Principal Principle is the demand for credence invariance under relocation across positions that the chance hypothesis treats as interchangeable.

   3. Implications:
      a. The undermining problem dissolves because the principle is a symmetry constraint on current credence, not about future truth of the chance hypothesis.
      b. Admissibility becomes a hypothesis about which positions are genuinely interchangeable, which leads to two potential problems:
          - If symmetries are selected to fit observed frequencies, then the principle reduces to "be calibrated".
          - If symmetries are selected to fit the chances, then we have circularity.

   4. The author believes there is a middle path but is unsure.

