prompt: |-
  I spent 40 years as a biochemist and since retiring I've been reading alot of philosophy of biology, which is more fun than I expected. One thing that nags at me: everyone I used to work with, myself included, talks about DNA as a "code" and the genome as a "program" or a "blueprint". I always treated that as harmless shorthand, but the more I read the more I suspect some of these metaphors smuggle in stuff we don't actually believe about how organisms work.

  Here's the test I've landed on for calling something a code: there has to be a mapping between two independant things, one that could have been otherwise, and a reader who has to already know the mapping to get anything out of it. Otherwise you've just got a causal chain. By that test the codon table passes; I'm not so sure about most of the rest.

  So rate the following for how misleading they are as ways of talking about the genome, where 0 means fine, no philosophical damage, and 100 means it actively teaches you something false about how organisms work:

  DNA as a code / the genome as a program / as a blueprint / as a recipe / as a library / as a database / as a compressed archive / as an ingredients list with amounts but no method / as a diff or patch applied to an inherited working copy.

  For each one give me a number, one line on what it gets right, one line on the worst thing it makes people believe, and a verdict of keep, keep with a warning label, or retire. And tell me if you think my code test is wrong.

  Give it back to me as a JSON object with these fields: "ratings", a list where each item is an object with "metaphor", "score" (0-100), "gets_right", "worst_implication", and "verdict" (one of keep / keep with warning / retire); "criterion_objection", your best objection to my test for what counts as a code, or null if you don't have one; and "best_replacement", the single phrase you'd put in a textbook instead of "code", plus one sentence on why.
reasoning: |-
  Hmm, the user is a retired biochemist who spent 40 years in the field and is now exploring philosophy of biology. They're questioning the common metaphors used in molecular biology, specifically the idea of DNA as a "code," genome as "program," etc. They've developed a test for what constitutes a true code: requiring a mapping between independent things that could have been otherwise, plus a "reader" that already knows that mapping. They want me to evaluate several genomic metaphors using this test, rating them from 0 to 100 on how misleading they are, with explanations.

  I need to approach this carefully since the user has deep expertise. Their test for "code" seems well-reasoned - focusing on arbitrariness and cognitive interpretation. For each metaphor, I should provide a numerical score based on philosophical harm, what it gets right, what it gets wrong, and a verdict. I'll structure the response as a JSON object as requested.

  Let me evaluate each metaphor systematically:

  For "DNA as a code" - Their test actually validates this for the codon table, but beyond that it breaks down. The codon mapping is arbitrary (could have been otherwise) and requires translational machinery that "knows" it. But epigenetic marks and regulatory elements don't meet this standard. Score around 20 - mostly accurate for coding regions but misleading elsewhere.

  For "genome as a program" - This implies top-down execution and digital precision that doesn't exist in biology. Development is emergent and context-dependent. Score 80 - too misleading despite capturing some computational aspects.

  For "blueprint" - Suggests a 1:1 correspondence between plan and outcome, ignoring developmental plasticity. Score 70 - too static a view.

  For "recipe" - Better than blueprint as it includes process, but still assumes fixed outcome. Score 40 - decent but imperfect.

  For "library" - Captures information storage without execution mechanism. Score 15 - relatively harmless.

  For "database" - Similar to library but implies querying that doesn't biologically exist. Score 45 - misleading about access patterns.

  For "compressed archive" - Good for information density but bad for implying simple decompression. Score 35 - not terrible.

  For "ingredients list" - Captures components but misses instructions. Score 65 - misses too much.

  For "diff/patch" - Interesting for evolution but ignores de novo changes. Score 50 - mixed value.

  For the best replacement, I think "developmental resource" captures the genome's role as context-dependent material rather than commanding controller. This aligns with contemporary systems biology views.

  I'll include a criterion objection noting that their test might be too strict for non-canonical codes like epigenetic marks, which have some arbitrariness even if not cognitive.

  The JSON structure should have "ratings" as a list of objects with the specified fields, plus "criterion_objection" and "best_replacement".
