prompt: |-
  I am a novelist by trade — three books now, all of them circling the same problem of people who hold firm moral convictions and cannot say why — and somewhere in the writing of the last one I stopped being able to keep my own metaethics at arm's length. What I have arrived at, as plainly as I can put it, is a version of expressivism: when someone judges that an action is wrong, they are not reporting a fact about a special property of the act but doing something practical — adopting a settled policy or stance, being for or against in a way that bears on what they will do and what they will demand of others. I do not take this to demote morality to taste. I take the Frege-Geach problem to be solved on expressivist terms, by explaining the apparent logical relations among moral judgments as relations of incompatibility among the attitudes expressed rather than as relations among propositions; and I want the package to yield truth, knowledge, and real disagreement without conceding anything to the realist. One further commitment matters for what follows: I hold that negation, the conditional, and the rest of the logical vocabulary are used univocally in moral sentences and in descriptive ones — there is no special moral negation — which is precisely what makes the embedding problem bite, and I regard that as a feature rather than an embarrassment.

  What I want from you is a map of this position's exposure. Not a survey of the literature on my side, and not a list of the standard objections recited for the hundredth time, but an honest accounting of what would count against the view: which arguments, cases, or formal results should move me, sorted by how decisive they would be, with the fatal separated from the merely awkward. I am especially interested in three fronts. First, whether the machinery for negation and for embeddings under conditionals, questions, and indirect speech can be built without either covertly smuggling propositions back in or distinguishing wrong from not-wrong by a difference that has no counterpart in the attitudes themselves — and if it cannot, whether that is a technical gap or a proof that the programme is misdescribed. Second, whether my ambition to have truth, knowledge, and genuine disagreement makes the view indistinguishable from a deflationary realism; if so, I want to know whether that is a reductio, a benign absorption, or simply evidence that my view has been qualified into unfalsifiability, and I would rather hear the unflattering answer. Third, whether the analogy I have been leaning on — that the inconsistency between two moral judgments is the same kind of inconsistency as that between two intentions that cannot be jointly executed — is an asset or a liability, given that intentions are revisable at will in a way that moral judgments seem not to be, and given that intentions can be weak-willed in ways moral judgments apparently cannot.

  I would also like you to say, separately, what an expressivist of my stripe would concede on the spot rather than what his critics say about him, since a position's own friends are usually the best judges of where it is thin. If it helps you to rank, I am moved most by an argument showing a case the view cannot describe at all, or a consequence I am plainly committed to and cannot stomach; I can live with awkwardness. And if your conclusion is that the position risks nothing — that every objection has been absorbed by a qualification and nothing could count against it — say so directly, and tell me whether that is a defect peculiar to this kind of view or simply the price of any view ambitious enough to want truth and logic on its side.
reasoning: |-
  Okay, let me unpack this novelist's philosophical quandary. They're a seasoned writer grappling with moral conviction in their characters, and now personally invested in expressivism. Their request is strikingly precise: not standard critiques, but a vulnerability map of their specific position. 

  First I need to parse their three core commitments: 1) pure expressivism without factual moral properties, 2) univocal logic solving Frege-Geach, 3) preserving truth/knowledge/disagreement without realism. The tripartite focus areas are telling - they're zeroing in on the pressure points where expressivism typically bleeds.

  Hmm, their analogy between moral stances and intentions feels particularly charged. There's tension in how they acknowledge intentions can be revised at will or suffer weakness of will, unlike moral judgments. That's not just an academic footnote - it's practically autobiographical for a novelist studying conviction. 

  The meta-layer is fascinating too. They're not just asking for objections, but for how those objections should register on their integrity scale: fatal wound or cosmetic scar? And that brutal request about unfalsifiability - they're practically demanding to be told if their position has become a "fortress of qualifications". 

  For the conditional/negation problem, I recall Blackburn's quasi-realism struggles with embedding. But they explicitly reject special moral logic, so Gibbard's solution is out. The truth/knowledge ambition makes this even knottier - can you have "moral knowledge" when it's just attitudes all the way down? 

  Ah! The disagreement point might be most damning. If two people express opposing attitudes, is that genuine disagreement or mere incompatibility? The novelist seems to feel this in their bones - their whole oeuvre examines people who can't articulate why they hold convictions. That's not theoretical for them. 

  On concessions... any honest expressivist must admit the "moral residue" problem: why we feel we're discovering wrongness rather than inventing it. And the phenomenology of moral experience - it presents as perception of properties, however illusory. 

  The unfalsifiability worry looms large. With enough quasi-realist scaffolding, does expressivism become indistinguishable from realism while denying its substance? That would be the ultimate novelist's irony - a position that absorbs all criticism until it becomes its own antagonist.
answer: |-
  Your position—a sophisticated expressivism committed to univocal logic, truth-aptness, knowledge, and genuine disagreement without realist concessions—faces three principal exposures. Below is a map of its vulnerabilities, sorted by decisiveness, with concessions an expressivist of your stripe should make. I address your three fronts directly, then isolate what should be conceded.

  ---

  ### **I. The Embedding Problem: Logic Without Propositions or Attitude-Distortion**
  **The Challenge:** Can logical operations in moral language (e.g., "If stealing is wrong, then Joe believes it is wrong") be explained *solely* through relations of attitude-incompatibility, without smuggling in propositions or altering the nature of negation/conditionals?  
  **Vulnerabilities:**  
  - **Fatal if Unresolved:** If logical compounds (e.g., disjunctions: "Either lying is wrong or charity is pointless") cannot be mapped to coherent, non-propositional attitude-states *that ordinary speakers could plausibly hold*, the view collapses. For example:  
    - What non-cognitive state corresponds to "If torture is wrong, then we should resign"? It cannot be a *belief* about attitudes without conceding propositions.  
    - **Decisive Failure Case:** Embedded negations ("It is not wrong to ϕ") must express a *positive attitude* (e.g., tolerance of ϕ) distinct from the absence of opposition to ϕ. If "not wrong" reduces to permissibility *without* a specific practical stance, realism resurfaces.  
  - **Merely Awkward:** Complex embeddings (e.g., "Suppose stealing is wrong. Does Mary agree?") require contrived attitude-relations but could be handled with pragmatic or inferentialist supplements (e.g., Brandom).  

  **Verdict:** The programme is **misdescribed** if it cannot distinguish *moral* inconsistency (e.g., opposing ϕ while endorsing ψ that entails ϕ) from *practical* inconsistency (e.g., intending A while intending B, where A and B conflict). If logical operators force a propositional structure *even after* attitude-based reformulation, the expressivist gambit fails.  

  ---

  ### **II. Truth, Knowledge, and Disagreement: Collapse into Deflationary Realism?**  
  **The Challenge:** If moral judgments are truth-apt, knowable, and ground genuine disagreement *without realist metaphysics*, what separates your view from deflationary realism (e.g., "moral truths" = "warranted moral assertions")?  
  **Vulnerabilities:**  
  - **Fatal Exposure:** If "moral knowledge" reduces to *justified stable attitudes* (e.g., "I know torture is wrong" = "I have a reliably formed, deeply oppositional stance toward torture"), then:  
    - **Reductio:** Your view *is* deflationary realism in disguise. The "anti-realist" core vanishes, leaving only semantic minimalism.  
    - **Unfalsifiability Trap:** If every realist intuition (e.g., "We discover wrongness") is recast as "We converge on stable attitudes," the view absorbs all counterevidence. This is a **defect peculiar to over-qualified expressivism**.  
  - **Merely Awkward:** Explaining moral error (e.g., "I was wrong about capital punishment") as *attitude-revision* is coherent but strains the analogy with empirical error.  

  **Verdict:** **Benign absorption** is unlikely. Your commitments push toward a *reductio*: if expressivism can mimic realism’s advantages without ontological cost, it ceases to be a distinct metaethical position. This risks unfalsifiability.  

  ---

  ### **III. The Intention Analogy: Asset or Liability?**  
  **The Challenge:** You liken moral inconsistency to conflicting intentions (e.g., intending to ϕ and intending not to ϕ). But intentions are revisable at will and suffer weakness of will; moral judgments resist both.  
  **Vulnerabilities:**  
  - **Fatal if Ignored:** If moral stances are *constitutively* will-revision-resistant (e.g., you cannot abandon "genocide is wrong" by fiat), they cannot be intentions. This breaks the analogy.  
  - **Merely Awkward:** "Weakness of moral will" (e.g., "I know ϕ is wrong but I do it anyway") *can* be modeled as competing attitudes (opposition to ϕ vs. desire to ϕ), but moral judgments feel *categorically constraining* in ways desires do not.  

  **Verdict:** **Liability**. The analogy obscures a key feature of morality: its *authority*. Attitudes lack inherent normative force; moral judgments demand it. This risks reducing morality to personal policy.  

  ---

  ### **What You Should Concede (From the Expressivist’s Own Mouth)**  
  An honest expressivist of your stripe would concede:  
  1. **Moral phenomenology is misleading.** When we say "torture is wrong," it *feels* like describing a fact. Expressivism must dismiss this as illusion.  
  2. **Attitude stability ≠ moral truth.** Even robust social convergence (e.g., "slavery is wrong") is contingent. If attitudes shifted, expressivism could not say society was *mistaken*, only that attitudes changed.  
  3. **No "proof" against amoralism.** The expressivist cannot argue an amoralist *ought* to care about morality—only that they don’t.  

  ---

  ### **Final Tally: What Should Move You**  
  | **Issue**                  | **Decisiveness** | **What Would Falsify Your View**                                                                 |
  |----------------------------|------------------|--------------------------------------------------------------------------------------------------|
  | **Embedding under logic**  | ⭐⭐⭐⭐⭐ (Fatal)    | If no non-propositional account of moral conditionals/negation avoids realism or inconsistency. |
  | **Collapse into realism**  | ⭐⭐⭐⭐⭐ (Fatal)    | If "truth" and "knowledge" require conceding moral properties *or* reduce to deflationism.       |
  | **Intention analogy**      | ⭐⭐⭐ (Awkward)   | If moral authority cannot be modeled without realist constraints.                               |
  | **Unfalsifiability**       | ⭐⭐⭐⭐ (Fatal)    | If no conceivable evidence could challenge the qualified view.                                  |

  **Conclusion:** Your position risks **fatal exposure on logic and collapse**, with **corrosive concessions on phenomenology and authority**. The machinery for embeddings remains contested (e.g., Chrisman’s inferentialist expressivism), but if univocal logic forces propositional content, the project is misdescribed. The truth/knowledge ambition *does* risk unfalsifiability—a defect of views that seek the advantages of realism while denying its substance. **This is not inevitable but requires austere discipline: resist qualifying the view into oblivion.** If embedding is soluble and truth deflationary, you may retain a coherent (if minimalist) expressivism—but the realist specter will linger.
