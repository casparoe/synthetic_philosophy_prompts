answer: |-
  Pray attend closely, Sir, for you conflate two distinct principles. I approve the Navigation Acts **only insofar as they serve the defence of the realm** by nurturing the maritime strength essential for security against invasion. A reserve of ships and seamen is a public good, a necessary foundation for any state bordering the sea. This is a matter of national preservation, where the expense imposed upon commerce is, however regrettable, a justifiable burden for collective security. It is a regulation of trade for defence, not an exclusive monopoly *on* trade for profit.

  The colonial monopoly – the exclusive right to supply the colonies and purchase their produce – is a scheme of an entirely different character. It is not primarily for defence, but for the enrichment of a narrow mercantile interest. It forcibly diverts capital from more advantageous employments, raises prices for British consumers, depresses industry in the colonies, and, as you rightly note, fosters the very animosities and jealousies that lead to ruinous wars *defending* these monopolistic privileges. The Navigation Acts *could* exist without this monopoly; the monopoly could not exist without the Acts. The latter is the corrupt superstructure built upon the former's necessary, if burdensome, foundation. Defence justifies the maritime nursery; it does not justify the mercantile extraction that exploits it. My condemnation is rooted in principle: the monopoly is an unjust, artificial distortion of industry and a source of perpetual discord. My assessment that it "does not pay" – that Britain would profit more from free commerce, even with independent neighbours – is the *consequence* of that principle, observable in the mechanics of trade and capital, not a mere private wager. As for affection and mutual interest prevailing after separation: I state it as a strong *probability*, based on proximity and reciprocal benefit, *if* separation were amicable. The jealousy I describe elsewhere is often inflamed precisely by the very monopolies and exclusions I condemn; removing that poison fosters the harmony interest dictates. Are we clear on the distinction?

  Now, Sir, what is your next thrust?
