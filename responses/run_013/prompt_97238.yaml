prompt: |-
  Im putting together a handout for my constitutional theory seminar and I want a bit of scripted dialogue to open the session with, so could you write me one? Two speakers. One is a judicial supremacist — thinks that when it comes to what the constitution means, the courts have the last word, and the other branches are simply bound by their reading. The other is a departmentalist — thinks every branch has its own authority to interpret the constitution, and none of them is just bound by another's reading of it. I want them both to be sharp. The departmentalist shouldn't just chant democracy, and the supremacist shouldn't just chant rule of law; each should actually take on what the other says rather than talk past them.

  Things I'd like them to get into along the way: the countermajoritarian difficulty (unelected judges striking down what a democratically elected legislature has done — why on earth should they get to?); the gap between a ruling being final and a ruling being supreme, with the departmentalist leaning hard on that distinction and the supremacist pushing back on whether it's a real distinction or just face-saving; the objection that departmentalism simply collapses into whichever branch happens to hold the guns; and the thought that constitutional meaning might get settled by the public outside all three branches rather than by any of them. Feel free to hang it on a concrete scenario — a legislature keeps passing something the court has said is unconstitutional and refuses to back down.

  British English please. No footnotes, no name-dropping, just the arguement. Maybe 800 words or so.
