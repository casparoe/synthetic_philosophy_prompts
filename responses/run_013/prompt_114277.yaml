prompt: |-
  My flatmate is doing a philosophy of maths module by distance learning and has to write a response to this passage from one of those pop-philosophy books she's working through. She's asked me to sanity-check her reading of it first and I'm well out of my depth, so I'd rather get a proper answer than pass on my own half-remembered impressions.

  The passage: "Thomson's lamp is the neatest proof we have that supertasks are impossible. A lamp starts off; the switch is flicked half a minute later, then a quarter of a minute later, then an eighth, and so on — infinitely many flicks, all before the one-minute mark. Since every flick reverses the lamp, at one minute it would have to be both on and off at once, which is a flat contradiction, and that is Thomson's point: you cannot complete infinitely many tasks in a finite time. (Some clever-clogs reply that the series 1 − 1 + 1 − 1 + … sums to a half, so the lamp is half-on, which is obviously nonsense.) Benacerraf later objected that there is no problem at all: the lamp is perfectly possible, we simply are not told what state it ends up in, which shows the puzzle was never really about infinity but about our ignorance. The wider lesson is that any actually completed infinity is incoherent, so any view that needs one — an infinite past, say — is in trouble."

  Could you take it sentence by sentence and tell me what a philosopher who works on this stuff would accept, what they'd call a fair simplification, and what is flatly wrong or misattributed — including whether that last sentence follows from anything true in the passage, and what someone who thinks supertasks are perfectly fine would say the passage gets wrong about their side? She needs the answer in British English, and would rather have a clear verdict on each bit than a general impression. For what it's worth I suspect the whole business is more contested than the passage lets on, but I cant see where the overstatement is.
