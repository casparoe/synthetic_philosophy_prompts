prompt: |-
  I keep a mental ledger of what I will and will not take someone's word for, and I want to know whether a principle underlies it. My sister says the chili is too hot for the kids: I believe her and move the bowl, no tasting required. A friend says the new album is mournful: I believe that before I hear a note. A critic I trust says a cathedral I have never visited is beautiful, and I come away believing it is beautiful. But when a colleague says the joke he just heard is hilarious, his word gives me nothing until I hear it and laugh, and when a reviewer says a novel is exquisite, or that it moved him to tears, I do not think I have acquired that belief until I read it myself. Strangely, when a friend who knows my taste says I will love a film I have not seen, I believe him and rent it. My half-formed guess is that testimony can hand me facts about the object — how hot it is, how mournful, how I would find it — but never the value the thing has in itself, which would mean giving up the cathedral verdict.

  Answer as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion: (1) the principle that best fits these verdicts, stated precisely, or a small set of candidates if no single one will do; (2) which of my verdicts each clause of it is built to save, and how it handles the cathedral; (3) its verdicts on three cases I have not mentioned — a smell someone tells me is disgusting, a proof someone tells me is elegant, and a friend telling me the water is too cold to swim in; (4) the verdict of mine the principle cannot accommodate, and whether you would surrender the verdict or add a clause; (5) the case most likely to break the principle. Write in American English.
reasoning: |-
  Hmm, the user is describing how they rely on testimony from others in different situations, and they're trying to figure out what principle underlies their decisions. They trust some statements without verification (like their sister saying chili is too hot) but require direct experience for others (like needing to hear a joke to believe it's hilarious). They also mention trusting a friend about a film they'll love, which complicates things because it involves personal taste.

  The user wants me to analyze this as a numbered list with five specific items. I need to be precise about the principle that governs their mental ledger. From what they've described, it seems like they're distinguishing between factual claims about properties (hotness, mournfulness) and evaluative judgments about value (beauty, hilarity). But then they trust their friend about the film, which is an evaluative judgment about how they'll feel, so that's a wrinkle.

  I'm thinking the core principle might be that testimony can convey objective properties or personal predictions, but not intrinsic value. That would explain why they accept their sister saying the chili is hot (objective property) and their friend predicting they'll love a film (personal prediction), but reject the critic saying the cathedral is beautiful (intrinsic value) without seeing it. The cathedral case is interesting because they do accept the critic's word about beauty, which contradicts this principle. That might be a key exception.

  For the numbered list: First, I need to state the principle clearly. I'll propose that testimony gives facts about properties or how something will affect them, but not its inherent value. Second, I'll map each part of their examples to this principle and address the cathedral issue—it works if beauty is treated as a property in this context. Third, I'll apply the principle to new cases: a disgusting smell (probably accepted as objective), an elegant proof (might require verification), and cold water (accepted as objective). Fourth, the main problem is the cathedral verdict; I'd suggest modifying the principle to allow trusted sources for aesthetic properties. Fifth, the toughest case would be something like a trusted source on beauty that they later disagree with, which could break the principle.

  I need to ensure each item is concise—just a sentence or two. No intros or conclusions. And use American English. I'll make sure the principle handles their examples as much as possible, while noting where it might need refinement.
answer: |-
  1.  Testimony reliably conveys objective properties of the world (including how it causally affects others) and reliable predictions about how it will affect *me* personally, but it cannot directly transfer the intrinsic aesthetic or emotional value the testifier experiences; that value must be encountered firsthand.
  2.  The clause about objective properties saves the chili (heat as causal effect on kids), the album (mournfulness as sonic property), and the cold water case (below). The "prediction about me" clause saves the film recommendation (trusted taste-match). The "cannot transfer intrinsic value" clause saves the joke, novel, and critic's tears (requiring firsthand experience), while the cathedral verdict is accommodated by treating "beautiful" here as an objective property reportable by a trusted expert source, not intrinsic value transfer.
  3.  The smell is disgusting: I believe it (objective property/causal effect). The proof is elegant: I do not fully believe its elegance until I see it myself (intrinsic value). The water is too cold to swim: I believe it and won't swim (objective property/causal effect).
  4.  The principle cannot easily accommodate why I believe the trusted critic about the cathedral's beauty without seeing it, as that seems like intrinsic value. I would add a clause: "...except for aesthetic properties reported by sources whose judgment on such matters I have verified as highly reliable and aligned with objective standards."
  5.  A friend whose taste in art I deeply trust (and have verified) tells me a specific abstract painting is profoundly beautiful and moving, but when I see it, I find it utterly banal and feel nothing; this breaks the principle's reliance on trusted prediction or objective-property reporting for aesthetic value.
