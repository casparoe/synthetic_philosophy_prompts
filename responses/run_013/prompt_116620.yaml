  I'm in this weird reading group that meets above a bakery — half of us do UI and type design, half do philosophy of perception — and we've been stuck for months on the Letter Spirit problem: what makes every lowercase a an a? The room has split into two camps. One camp are the shape essentialists: they think there's some structural invariant, a kind of abstract skeleton or topology, that any a has to have, and that style is just clothing on top of it. The other camp are the family-resemblance people: they think a's are held together by a shifting cluster of perceptual cues, motor habits, historical accidents and learned conventions, and that asking for the essence of a is like asking for the essence of a game. They've been arguing alot past each other for a year. I want you to write the joint statement they should have produced after a good-faith adversarial collaboration — the document both camps could sign, not a dialogue and not a verdict on who's right.

  It needs: (1) a numbered agreed-claims section, including the strongest claims both can honestly sign about what any theory has to explain, about legibility and recognition, about how much variation is possible without losing identity, and about which cases are genuinely borderline; (2) a disagreements table that states each remaining dispute in wording each side would accept for its own view — not strawmen, not vacuous; (3) the cruxes, i.e., the sub-questions such that settling one would move at least one side; and (4) for each crux, a concrete case, test, or argument both sides agree would bear on it, with each side's prediction written down in advance. We've been using a variable font prototype called Quaver that interpolates between a double-story a (the kind with the little upper bowl and the lower bowl), a single-story a (one bowl plus stem), and a lowercase e; at one point in the interpolation half the group reads the shape as a weird a and half as a weird e, and the essentialists say that just shows the interpolation left the category, while the family-resemblance people say it shows the category has no sharp boundary. Use that kind of case if it helps, but don't let it swallow the document. Also tell me if any part of their disagreement is really verbal — e.g., if they mean different things by essence or by style — and if so, which part and why. Don't give me reading lists or citations; I care about the formulations, the cruxes, and the predictions. Format it as a numbered agreed-claims section followed by a disagreements table, then a short crux-and-test section.
