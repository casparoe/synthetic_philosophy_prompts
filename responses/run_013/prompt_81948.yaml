prompt: |-
  I'm in a metaphysics reading group — we meet in a pub on Thursdays, which this argument has ruined two of — and we've been on material constitution for a few weeks. One of the members brought in an argument I can't shake, and the case is my aunt's, so I know it's clean. She bought a lump of clay at a craft stall, kept it in a drawer as a paperweight for about three years, then my cousin squeezed it into a little horse, and then a week later it got rained on and slumped back into a shapeless lump. Nothing was added and nothing was taken away at any point; the same clay sat in that drawer the whole time. Here's the argument, roughly as he wrote it up. (1) If a and b are one and the same thing, then whatever is true of a is true of b — that's just what being one thing amounts to. (2) Three years ago the lump of clay existed; three years ago the horse did not. (3) So there is something true of the lump — that it existed three years ago — that is not true of the horse. (4) So the lump and the horse are two things and not one; they merely happen to be made of the same clay and to sit in the same place. (5) Nothing in 1-4 is special to clay or to horses: the recipe runs whenever some matter gets arranged into a new thing. (6) So run it again on the paperweight, on the lump, on the horse, and on any arbitrary way of carving up that same clay, and you don't get two objects in the drawer, you get a crowd of them, with no principled line between the real ones and the made-up ones. And here's the bit I keep chewing on: (7) the same rule runs backwards too. The clay was soft three years ago and it's hard now; if soft and hard are genuine properties of the thing itself rather than just relations it bears to times, then one and the same lump has two properties it can't have at once, so the lump from back then and the lump from today must be two things after all — which would mean nothing survives any change at all, the lump included.

  He says the moral is that constitution without identity is incoherent and we have to pick a side: either there are no statues, only clay arranged statuewise, or premise 1 is too strong as stated and there's no fact of the matter about how many things are in that drawer. I don't want either, but I also dont want to just wave my hands at it. So: tell me which numbered step is the one to give up, say honestly why it looked fine when he wrote it up, and then price the going fixes — relativizing properties to times, saying identity is sortal-relative (same clay, different statue), saying the statue is just the clay under a description and there's nothing over and above it, or biting the bullet on coincident objects and giving a principled account of which ones there are. I'd most like to keep 1, since a version of identity without indiscernibility sounds to me like a different subject than identity, but tell me what that costs. No reading lists please — I've got plenty and they never tell me which step is wrong; I want to know where the argument actually slips, if it does, and what I pay to say so.
reasoning: |-
  Okay, the user is part of a metaphysics reading group dealing with material constitution, specifically the problem of the lump of clay that becomes a horse and then reverts to a lump. They've been presented with an argument that concludes there are multiple objects coinciding at the same place and time, or that nothing survives change. The user wants to know which step of the argument is flawed, why it seems plausible, and the cost of rejecting it.

  First, I need to parse the argument step by step. The key premises are:

  1. Leibniz's Law: If a and b are identical, they share all properties.

  2. The lump existed three years ago; the horse did not.

  3. Therefore, the lump has a property (existing then) that the horse lacks, so they are distinct.

  4. This extends to any arbitrary object defined from the same matter.

  5. The same issue applies backward through time: the clay was soft then and hard now, so if properties aren't relational, the past and present lump are distinct.

  The conclusion is that either ordinary objects like statues don't exist, or identity isn't strict, leading to coincident objects or ontological proliferation.

  The user wants to keep premise 1 (Leibniz's Law) because they think identity without indiscernibility isn't really identity. But rejecting premise 1 might be necessary. I should consider the options:

  - **Temporal parts/relativization**: Reject the idea that "existed at t" is a non-relational property. Instead, existence and properties are time-relative. So the lump and the horse are identical at times when they coincide, but have different temporal histories. This saves Leibniz's Law by making properties temporal. The cost is accepting temporal parts, which some find counterintuitive.

  - **Sortal-relative identity**: Identity is relative to a sortal. The lump and horse are the same mass of matter but different artifacts. This requires giving up absolute identity, which is a big cost, as identity is usually considered absolute.

  - **Eliminativism**: Deny that the horse exists; only the clay exists. But the user doesn't want to eliminate ordinary objects.

  - **Coincident objects**: Accept that the lump and horse are distinct but coinciding objects. The cost is explaining why we don't count them as two objects in everyday scenarios and providing a principled account of which objects exist.

  The user mentioned they dislike both options presented: no statues or rejecting premise 1. But premise 1 seems solid; it's how identity is defined. The problem is with how properties are attributed. Step 2 claims the horse didn't exist three years ago, but that's only true if we consider the horse as a statue. If the statue didn't exist then, but the matter did, then the property "existing three years ago" is tied to the sortal.

  The core issue is step 2 treating "existed at t" as a property without specifying the sortal. If existence is sortal-dependent, then the horse (as a statue) didn't exist, but the lump (as matter) did. So the properties are different, and Leibniz's Law isn't violated because the properties are relative to descriptions.

  However, this approach requires either relativizing identity or introducing coincident objects. The minimal revision might be to adjust how we understand properties in step 2. By making properties sortal-relative or time-relative, we avoid the contradiction.

  But the user wants to keep Leibniz's Law absolute. So temporal parts might be the best option. It retains absolute identity by indexing properties to times. The cost is accepting temporal parts, which means objects are composed of temporal stages. This solves the problem by saying the lump-at-t1 and horse-at-t2 are parts of the same spacetime worm, so identical in a four-dimensional sense.

  The user might find temporal parts metaphysically heavy. Another option is stage theory, where objects are instantaneous stages, and "the lump" refers to different stages at different times. Then "existed three years ago" means a counterpart stage existed, not the same numerical identity. This also revises our notion of persistence.

  The argument "slips" at step 2 by treating "existed at t" as a monadic property rather than a relational one. Once we recognize that properties like existence at a time are temporal, the contradiction dissolves. The cost is adopting a perdurantist view or similar, which not everyone likes.

  Alternatively, in an endurantist framework with sortals, we can say that the lump and the horse are the same object but different aspects under sortals. But this might require giving up absolute identity or accepting coincident objects.

  The user's deep need is to resolve the paradox without abandoning ordinary objects or Leibniz's Law. Temporal parts allow this by redefining persistence. The cost is a four-dimensional ontology. If that's too high, coincident objects with a principled account (like different modal properties) might work, but accepting two objects in one place is also costly.
answer: |-
  The argument *is* slippery, but it slips decisively at **step 2**, specifically in how it attributes the property "existed three years ago" to the lump but not to the horse. This step looks compelling because it taps into a common-sense intuition: the lump (as matter) was present in the drawer, while the horse (as a statue) hadn't yet been shaped. But the flaw is that "existed at time *t*" isn't a simple, monadic property like "is red" or "is hard." It's a *temporal-relational* property—it depends on how we conceptualize the object *over time* and what *kind* of thing we're talking about. Rejecting step 2 as stated doesn't require giving up Leibniz's Law (premise 1), but it forces a revision of how we understand persistence and property attribution. Here's the breakdown:

  ### Why Step 2 is the Problem
  - **What's wrong with it**: Step 2 treats "existed three years ago" as a brute, timeless fact about the object itself, ignoring that existence claims are *sortal-relative* (i.e., dependent on the kind of thing we're considering). The clay-matter *did* exist three years ago, but the *statue* did not—because "statue" implies a specific form or function that wasn't present then. However, this doesn't mean the statue is a *distinct object* from the clay; it means we're describing the same entity under different *phases* or *modes*. Step 2 falsely assumes that "the horse" refers to a wholly separate entity rather than the clay *in a later state*.  
  - **Why it looked fine**: It exploits our linguistic habits. We say "the lump existed, but the horse didn't" naturally, as if we're comparing two things. But in metaphysics, this is a disguised way of saying "the matter arranged lump-wise existed, while the matter arranged horse-wise did not exist *at that time*." That’s a claim about temporal stages or descriptions, not about separate objects.  

  ### The Fix: Relativize Properties to Times (Perdurantism)
  To save Leibniz's Law (premise 1) and avoid coincident objects or eliminativism, you need to treat properties as *time-indexed*. This is the core of **perdurantism** or "temporal parts" theory:  
  - **How it works**:  
    - Objects persist by having different temporal parts at different times. The "lump" and "horse" are temporal stages of a single, four-dimensional "spacetime worm."  
    - Properties are relativized: instead of "existed at *t*," we say "has a temporal part at *t*."  
    - Applied to the case:  
      - Three years ago, the clay had a temporal part (a "lump-stage") but no "horse-stage."  
      - Now, it has a "horse-stage" (or later, a "slumped-lump-stage").  
    - Leibniz's Law holds: the *entire spacetime worm* has the property *having-a-part-at-t1-that-is-lump-shaped* and *having-a-part-at-t2-that-is-horse-shaped*. These aren't conflicting properties because they're relational (to times).  
  - **Costs**:  
    - **Metaphysical price**: You must accept that objects are extended in time, like worms in spacetime. The "lump" you touch today isn't strictly identical to the "lump" from three years ago; they're temporal parts of a larger whole. This can feel counterintuitive—it denies that the *very same object* endures through change.  
    - **Change problem solved**: For the backward-running argument (step 7), hardness and softness aren't incompatible properties of the whole worm; they're properties of different temporal parts. Nothing survives change *without temporal parts*, but the spacetime worm persists.  
  - **Why it’s better than alternatives**:  
    - Keeps Leibniz’s Law absolute.  
    - Avoids coincident objects (only one entity: the spacetime worm).  
    - Preserves ordinary objects (statues exist as temporal stages).  

  ### Why Other Fixes Are Costlier (Or Less Effective)
  - **Sortal-Relative Identity (Rejecting Absolute Identity)**:  
    - Give up step 2 by saying "same clay, different statue" isn’t about distinct objects—it’s about different *counts* under different sortals. The lump and horse are "identical under the sortal 'clay-mass'" but "distinct under the sortal 'statue'."  
    - **Cost**: You must abandon absolute identity (premise 1 becomes sortal-relative). This is metaphysically radical—identity is no longer a universal relation. It also struggles with step 7 (change over time) and feels ad hoc when applied to arbitrary "carvings" (step 6).  
    - **Why avoid it?** It doesn’t solve the problem cleanly; it just relabels it. If identity is sortal-relative, you still need to explain *why* "existed at *t*" is sortal-dependent, which circles back to temporal indexing.  

  - **Coincident Objects (Accepting Multiple Objects)**:  
    - Deny step 4: the lump and horse are distinct but coincident entities (same matter, same location, different modal properties).  
    - **Cost**: You must explain why there aren’t infinitely many objects (step 6) and defend which ones are "real." Standard moves (e.g., only objects with distinct persistence conditions exist) get messy fast. For example, the lump survives squashing, the horse doesn’t—so they’re distinct. But this inflates ontology and makes ordinary counting arbitrary. Step 7 becomes even worse: every change produces a new object, so nothing persists.  

  - **Eliminativism (Deny Ordinary Objects)**:  
    - Reject step 3: the horse doesn’t exist; only the clay exists. "Statue" is just a way of talking about clay arranged statue-wise.  
    - **Cost**: You lose ordinary objects (e.g., your aunt didn’t make a horse). This is revisionary and unsatisfying—it feels like avoiding the problem.  

  - **Deflationism (Properties as Descriptions)**:  
    - Treat the statue as the clay "under a description." Step 2 is misleading because "the horse" isn’t an additional thing—it’s the clay + a contextual label.  
    - **Cost**: This collapses into either eliminativism ("statue" isn’t real) or perdurantism (descriptions track temporal stages). It doesn’t resolve step 7’s change problem.  

  ### The Bottom Line
  Step 2 is the linchpin. By revising properties as temporal-relational (via perdurantism), you keep Leibniz’s Law intact, avoid coincident entities, and save ordinary objects. The cost—accepting temporal parts—is the lightest in your toolkit because it directly addresses the argument’s core confusion: treating temporal existence as a non-relational property. If you balk at temporal parts, you’re forced into costlier options (e.g., sortal-relativity or coincident objects). But perdurantism is the fix that meets your constraints: it tells you exactly where the argument slips (step 2’s property attribution), explains why it seemed sound (untensed language), and prices the fix clearly (objects are spacetime worms). Pour a pint and test-drive it next Thursday—it’ll keep the clay, the horse, and your metaphysics group intact.
