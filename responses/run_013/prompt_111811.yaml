  The thermostat/bacteria rejections clearly eliminate simple homeostasis as sufficient. The LLM rejection shows linguistic behavior alone is insufficient. The game character case emphasizes that designer stipulation voids moral weight.

  Now constructing candidate principles... The Phenomenal Grounding Account seems promising: requiring (1) actual phenomenal states (2) with intrinsic disvalue (3) non-derivatively instantiated. This would explain:
