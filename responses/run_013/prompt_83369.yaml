prompt: |-
  I've been having the same argument with a mate for about three years and I need it settled by someone who isn't me. I know the old Ranke picture — the historian just reports how it really was, no theory, no point of view — is supposed to be naive, and that Carr basically said the historian's selection is unavoidable, and that Hayden White went further and said (as I remember it, so don't hold me to the details) that the plot shape of a history gets picked before you've even sorted the evidence. Fine, I'll take all that. But I still have strong gut verdicts about which histories are honest and which are crooked, and I don't think I'm just tracking whether I happen to agree with the author, because some of the ones I think are honest are ones I disagree with politically. So either there's a real distinction here that survives Carr and White, or my gut is just tribal and I should shut up. Here's what I actually think:

  - A doorstop military history of the Somme that's all corps-level decisions and never a word about the men who drowned in the mud: honest, just narrow.
  - A school textbook that's scrupulous about dates and names, but our side's massacres have vanished and theirs get dwelt on: crooked. Note that this and the Somme book both leave things out, so leaving things out can't be the thing.
  - A book on the empire written openly from the point of view of the colonised, and openly of the view that the whole business was a crime: honest. The moralising doesn't bother me at all, and I expected it to.
  - A firm's centenary history: every sentence true, zero moralising, and I think it's basically an advertisement. The question it set itself — how did this great firm come to be? — picked the material for it.
  - One of those denial tracts: real documents, footnotes, tables, arguing that some atrocity never happened. Not just crooked, not history. What I think is going on is that it can't lose — any document against it just becomes evidence of the cover-up.
  - A cliometric book that counts what's in the parish registers and the tax rolls and nothing else, exhaustively: honest, but it isn't the history of the period, it's the history of what got written down.
  - A history of the Middle East that starts in 1917. Nothing in it is false. The start date is doing the work.
  - An oral history of a strike, collected fifty years later from the strikers' grandchildren: fine, and I don't think it's the same kind of move as the denial tract, even though in both cases you can't go and check.

  Is there a principle that gets all of these, or close? The nearest I've got is something like: a history goes crooked when its shaping choices — scope, start date, whose voices, what counts as a cause — are answerable to a verdict rather than to a question, and it stops being history altogether when nothing could count against the verdict. Does that survive my list? Which verdict does it make me give up? And what does it say about the two I keep flip-flopping on: a historian writing about his own family's eviction, as a partisan but honestly; and a historian who says "I'll write the strongest possible case for one side, you write the case for the other, and we'll let them fight it out"?

  Please commit. Pick the principle, state it precisely, defend it against those last two cases, and tell me straight which of my verdicts it costs me — I'd rather have a definite answer I can push back on than a tour of the options with the decision left to me. Also give me its verdict on one case I haven't listed, your choice, so I can see the thing working. No reading lists please, I'm not going to chase them down. British English.
reasoning: |-
  Okay, let me try to unpack this user's query. They've been arguing with a friend for three years about what makes a history book honest or crooked. They know about Ranke's "how it really was" idea being naive, and they accept Carr and White's points about selection and narrative shaping. But they still have gut feelings about which histories are trustworthy, even when they disagree politically. They listed several examples and want a principle that explains their judgments.

  First, I need to understand their examples. The Somme military history that's narrow but honest, versus the biased textbook that's crooked. The empire book with a clear moral stance is honest, but the firm's centenary history feels like an ad. Denial tracts aren't history at all. Cliometrics is honest but limited. Starting a Middle East history in 1917 isn't false but problematic. Oral history from strikers' grandchildren is fine. The user's proposed principle is about shaping choices serving a verdict instead of a question.

  The user wants a clear principle that covers all cases, handles their two flip-flop cases (partisan family history and adversarial histories), and shows where their judgments might be wrong. They want commitment, not options. No reading lists, British English.

  I should start by analyzing their examples. The key seems to be whether the history allows for counter-evidence and whether its framing serves an open inquiry versus a predetermined conclusion. The denial tract is the extreme case where any counter-evidence is twisted to fit the verdict, making it unfalsifiable. The centenary history frames everything as progress, ignoring failures. The textbook omits inconvenient facts. But the Somme book, while narrow, doesn't deny other perspectives; it just focuses on one aspect. The colonized perspective book is honest because it's transparent and doesn't suppress counter-evidence.

  The user's principle about "shaping choices answerable to a verdict" seems strong. But how to phrase it precisely? Maybe: "A history is dishonest when its methodological choices systematically exclude evidence that could challenge its core argument, or when its structure renders it immune to counter-evidence." That covers the denial tract (immune to counter-evidence) and the centenary history (excludes challenges). The textbook excludes opposing massacres. The Middle East start date excludes Ottoman context, serving a verdict about the region's inevitability.

  Now, the flip-flop cases. The partisan family historian: if they acknowledge their bias and engage with counter-evidence (e.g., landlord records), it could be honest. If they ignore anything contradicting their narrative, it's crooked. Adversarial histories: if both sides are open to counter-arguments and evidence, it's honest debate. If they cherry-pick or distort, it's not.

  Which verdicts would this principle change? Maybe the oral history. The user thinks it's fine, but if the grandchildren's accounts exclude management perspectives and the historian doesn't address that, it might be systematically excluding counter-evidence. But the user accepts it, so perhaps the principle needs refinement. Maybe transparency about limitations makes it honest, even if one-sided.

  A new test case: a history of the Cold War from a Western perspective that mentions Soviet atrocities but downplays US interventions. If it ignores or minimizes events like the Iran coup, that's systematic exclusion to serve a verdict of Western righteousness. Crooked.

  So the refined principle: "A work is dishonest history if (1) its framing or methodology systematically excludes accessible evidence that could materially challenge its core argument, or (2) its argument is constructed such that no evidence could falsify its conclusions. Transparency about limitations or perspective does not exempt it from (1) if exclusion serves to preempt counter-argument." 

  This costs the user their tolerance of the oral history if it excludes opposing voices without justification. But if the historian admits the limitations and doesn't make broader claims, it might still be honest. The partisan family history could be honest if it engages with counter-evidence. Adversarial histories are honest if both sides follow evidence.

  The user might need to accept that some of their gut feelings, like on oral history, might be inconsistent if the principle is applied strictly. But overall, the principle validates most of their judgments, especially the key distinction between open inquiry and predetermined verdicts.
answer: |-
  Right. No hedging. Here's the principle that best captures your distinctions and survives your list:

  **Principle (The Verdict-Proof Test):**  
  *A historical work is "crooked" if its core argument or framing is structured to be unfalsifiable by evidence within its own claimed scope, or if its methodological choices systematically exclude readily available, contextually essential evidence that could materially challenge its central conclusion. "Honest" history, even when partisan or limited, must allow its core claims to be tested against accessible evidence relevant to its stated question.*

  **Defence Against Your Flip-Flops:**

  1.  **The Partisan Family Historian:** *Honest, under the principle.* Why? Their *framing* is openly partisan ("the eviction from *our* perspective"). The *question* is clear: "How did this event unfold for my family, and why does it feel like injustice?" Crucially, evidence *within this scope* can still challenge them: family letters showing internal disagreements, court records contradicting their narrative of landlord malice, evidence their ancestor provoked the eviction. If they engage with *accessible* counter-evidence relevant to their question (even to refute it), it's honest history. If they suppress or dismiss *all* such evidence, it becomes crooked – the verdict (family victimhood) is insulated from challenge.

  2.  **The Adversarial Histories ("My Side vs. Your Side"):** *Honest, under the principle.* Why? Each historian sets a *specific question*: "What is the strongest possible case for Side A/B?" Crucially, evidence within *that* scope *can* falsify their attempt. If the "pro-Side A" historian finds damning evidence against A *within the sources they've defined as relevant*, they either must weaken their "strongest case" argument or address it explicitly. The *argument* ("this is the strongest case") remains testable against the evidence they've committed to using. The *framing* (partisan advocacy) is transparent. The key is that neither side *systematically excludes essential counter-evidence available within their defined arena*; they just interpret it differently. The *joint project* ("let them fight") implicitly invites testing each case against evidence the *other* might bring.

  **What This Principle Costs You:**

  It forces you to **re-evaluate your verdict on the Oral History of the Strike**. Under this principle, it *could* be crooked, depending on execution.

  *   **Why?** "Collected fifty years later from the strikers' grandchildren" is a massive methodological choice shaping the evidence. The *core argument* implied by such a collection is usually the *experience* and *memory* of the strike participants/their community.
  *   **The Risk:** If the historian *only* uses these accounts, making claims about the strike's *objective causes, events, or outcomes* (beyond subjective experience), they are systematically excluding *essential, readily available evidence* that could challenge those claims: contemporary police reports, management records, newspaper accounts from the time, even union meeting minutes. Grandchildren's memories 50 years later are not reliable for factual events; they *are* reliable for intergenerational memory and impact.
  *   **Honest Execution:** If the work is framed *strictly* as an "Oral History of Family Memory and Legacy of the Strike," making *only* claims about how the event is *remembered and understood within that community decades later*, then it's honest. It's answering *that specific question* and excludes other evidence as irrelevant to its scope. The shaping choice (whose voices) is answerable to the *question* (memory/legacy), not a verdict.
  *   **Crooked Execution:** If it uses these later memories to make definitive claims like "The strike began because management cut wages by 30%" or "Police violence on Day 3 was unprovoked massacre," *without engaging* with contemporary documents that might contradict this (payroll records, police logs, neutral newspapers), then it systematically excludes essential, accessible evidence that could falsify those claims. The verdict (strikers' pure victimhood/cause) is being protected by the methodology. It becomes analogous to the denial tract – contradictory evidence is simply absent or explained away as part of the "cover-up" or "biased record".
  *   **Your Gut:** You felt it was fine, likely focusing on the *transparency* of the source limitation and its value for capturing memory. The principle forces you to ask: *Is the historian making claims beyond what their chosen sources can reliably support within the context of the question they imply?* If yes, it's crooked.

  **Verification: Applying the Principle to a New Case**

  *   **Case:** A popular "Decline and Fall of the Roman Empire" book. It argues the Empire collapsed primarily due to moral decay, luxury, and the loss of traditional Roman virtues (a very Gibbon-esque view). It heavily quotes Roman moralists like Juvenal and Tacitus bemoaning decadence. It mentions barbarian invasions, economic issues, and plagues only briefly, dismissing them as symptoms or secondary consequences of the moral rot.
  *   **Principle's Verdict:** **Crooked.**
  *   **Why:**
      1.  **Systematic Exclusion:** It excludes vast amounts of readily available, contextually essential evidence that directly challenges the "moral decay as *primary* cause" thesis: extensive archaeological data on climate change (Late Antique Little Ice Age), economic studies of coin debasement and tax collapse, demographic analyses of the plague's impact, detailed military histories showing strategic overstretch and changing barbarian tactics/power. These are not obscure; they're fundamental to modern scholarship.
      2.  **Insulating the Verdict:** By framing the moral critique as the *cause* and other factors as mere *symptoms*, the argument becomes unfalsifiable within its own terms. Any evidence of economic collapse can be dismissed as "caused by the loss of virtue that made Romans industrious." Evidence of military defeat is "caused by the loss of martial virtue." The core verdict (moral failure killed Rome) is protected from challenge by the very structure of the argument. The shaping choices (focus on moralists, downplaying other factors) serve the pre-determined verdict, not an open inquiry into complex causality.

  **The Principle vs. Your List:**

  | Your Example                     | Your Verdict | Principle's Verdict | Why Principle Agrees/Disagrees (Costs marked) |
  | :------------------------------- | :----------- | :------------------ | :-------------------------------------------- |
  | **Somme Doorstop (Narrow)**      | Honest       | Honest              | Scope limited, but *within scope* (corps decisions), evidence can challenge claims. Doesn't make broader claims its chosen scope can't support. |
  | **Biased Textbook**              | Crooked      | Crooked             | Systematically excludes essential evidence (our massacres) readily available to challenge its implied narrative of relative guilt. |
  | **Anti-Empire Book**             | Honest       | Honest              | Framing is transparent. Evidence *within* its scope (colonised experience, policy effects) can still challenge specific claims. Moralising is argument, not methodological exclusion. |
  | **Firm's Centenary**             | Crooked (Ad) | Crooked             | Framing ("How did this great firm come to be?") systematically excludes accessible evidence of failures, scandals, or negative impacts that could challenge the "greatness" narrative. |
  | **Denial Tract**                 | Not History  | Not History         | Core argument is unfalsifiable by design; any counter-evidence becomes proof of conspiracy. |
  | **Cliometric Book**              | Honest       | Honest              | Scope is explicit and narrow. Makes claims only about what its specific data can support. Doesn't pretend to be the "whole history". |
  | **Middle East Starts 1917**      | Crooked      | Crooked             | Start date systematically excludes essential context (Ottoman era, pre-WWI dynamics) readily available and crucial for understanding the *genesis* of the post-1917 situation it analyzes. Serves the verdict of an inevitable post-Ottoman trajectory. |
  | **Oral History Strike**          | Honest       | **Costs You: Potentially Crooked** | *If* it makes factual claims about the strike's *events/causes* beyond memory/legacy, it systematically excludes essential contemporary evidence (police logs, mgmt records) that could challenge those claims. Transparency doesn't excuse exclusion relevant to the implied question. |
  | **Partisan Family History**      | (Flip-Flop)  | Honest              | *If* open about framing and engages with accessible counter-evidence relevant to its question (family experience/justice claim). |
  | **Adversarial Histories**        | (Flip-Flop)  | Honest              | Each side answers a specific question ("strongest case for X") testable against evidence within their defined scope. The *contest* allows testing. |

  **Commitment:** Your "verdict vs. question" instinct was spot on. The precise principle above sharpens it by focusing on **systematic exclusion of *accessible, essential* counter-evidence** and **arguments rendered *unfalsifiable* within their own frame**. It survives Carr/White because it accepts perspective and selection are inevitable, but demands that the selection *doesn't actively insulate the core argument from challenge*. It costs you your easy pass on the Oral History, demanding scrutiny of its *implied claims* vs. its *source limitations*. It validates your rejection of denial tracts and centenary ads as fundamentally non-historical or crooked. The flip-flops become clear: transparency and a defined *question* allow partisanship to be honest; the adversarial method works *because* it invites testing.

  Push back all you like – that's the point of the argument settled. Now go tell your mate.
