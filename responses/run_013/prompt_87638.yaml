  Okay, the user has been grappling with moral luck after a debate with a friend. They're confused and seeking clarity. Let me start by recalling the key points. The friend argues that since outcomes depend on luck, blaming people is arbitrary, and we should abandon desert entirely. The user agrees with examples but feels uneasy about the conclusion.

