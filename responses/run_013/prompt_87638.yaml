prompt: |-
  I spent most of last weekend arguing with a close friend about moral luck, and I've come away more confused than when we started, so I'd like your help thinking it through. My friend's view is that once you accept the point Nagel and Williams are after — that the driver who happens to hit a child is condemned while the equally careless driver who happens to miss is not — you have to admit that our entire practice of blaming people is arbitrary, and that the honest response is to stop holding anyone responsible for outcomes and to judge only what was genuinely under their control. He then pushed further: since none of us chose our temperaments, our upbringing, or the situations we happen to face, he says moral luck shows there is simply no fact of the matter about who deserves blame or credit, and that any institution built on desert — courts, promotions, even ordinary praise — is therefore illegitimate. I agreed with him about the examples but found myself resisting the conclusion, and I couldn't articulate why.

  So my question is this: if moral luck really does show that a person's moral record depends on factors entirely outside their control, doesn't it follow that the only defensible position is to abandon outcome-based blame, treating the merely careless driver exactly as we treat the one who killed someone, and then — more radically — to abandon desert altogether? Please answer me directly rather than just summarizing the debate; I want to know where the argument goes wrong, if it does. Keep your answer to a single paragraph, and put your verdict in the first sentence.
