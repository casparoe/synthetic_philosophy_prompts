  Why is the friend's argument problematic? Well, moral responsibility isn't solely about control. We often hold people accountable for intentions, negligence, or risks they take. The careless driver, even if no one is hurt, is still blameworthy for taking the risk. The outcome matters for consequences but not necessarily for blameworthiness. 

  Also, abandoning all desert ignores how social practices function. Legal systems consider intent and recklessness, not just outcomes. Praise and blame also serve purposes like reinforcement and deterrence, which don't require absolute control. 

  The user might be worried that accepting moral luck undermines responsibility altogether. But a compatibilist view could reconcile luck with responsibility by focusing on reasons-responsive actions. Even with luck, agents can still be accountable based on their choices within their circumstances. 

  The user's deeper need might be a desire to maintain a sense of justice without ignoring luck. They need reassurance that responsibility isn't illusory. Emphasizing the role of normative standards and societal functions could address that. 

  I should make sure the verdict is clear in the first sentence: rejecting desert is an overreaction. Then explain why, using the driver example and linking to broader practices. Keep it concise, one paragraph as requested.
answer: |-
  **Your friend's radical conclusion overreacts to moral luck by mistakenly assuming moral responsibility requires absolute control and ignoring the essential role of outcomes in our normative practices.** While Nagel and Williams correctly highlight that luck influences judgments, rejecting *all* desert because we lack control over every factor is flawed: we reasonably blame agents for *actions* (like reckless driving) based on their choices and foreseeable risks within their context, even if luck affects the *consequences*; we don't treat the drivers identically because the reckless act *itself* warrants blame regardless of outcome, and the tragic result rightly intensifies societal response for practical/expressive reasons. Abandoning desert wholesale ignores how responsibility practices—focusing on intentions, negligence, and the risks agents *voluntarily impose*—function to regulate behavior and express values, without needing the impossible standard of total control over circumstances or constitution.

  **Key points in this condensed response:**  
  1. **Control isn't all-or-nothing:** Blame targets negligent *choices* (e.g., deciding to drive carelessly), not just outcomes.  
  2. **Outcomes matter pragmatically:** Legal/social responses *must* consider results for deterrence, restitution, and expressing communal values.  
  3. **Desert is contextual:** We assess agents within their actual circumstances (which include luck), not a vacuum of pure will.  
  4. **The alternative is unlivable:** Abandoning all praise/blame would paralyze ethics, law, and personal relationships.
