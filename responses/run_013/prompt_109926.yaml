        otherwise, if you win at least one, then you have at least 100 - D + D = 100 (because if you lose one and win one: 100 -D + D=100), or if you win both, more than 100.
        So to have wealth<100, you need two losses: wealth=100-2D.
        So P(wealth<100) = P(LL) = 0.4^2=0.16, so P(>=100)=1-0.16=0.84, for any D>0.
        Therefore, for any positive D, the probability is the same.

    So to have a distinct choice for C, we need to include D=0.

   Therefore, the split remains.

   The strongest objection an expected-wealth maximizer can raise against the growth-optimal verdict (which is to choose f=0.2 in the fractional case) is that it is too conservative and forgoes a higher expected wealth (125.44 vs 108.16) in exchange for a reduction in the risk of very poor outcomes. In particular, the expected-wealth maximizer might point out that the potential upside of the more aggressive strategy (f=0.6) is substantially higher (256 at best vs 144) and that over a single or finite number of trials, the higher expected value is a compelling reason to choose it. 

   However, the growth-optimal criterion is designed to maximize the rate of growth over the long run, and the expected-wealth maximizer's strategy (0.6) has a negative expected growth rate (as evidenced by the negative expected log wealth) and will almost surely lead to ruin in the long run. But the objection is that in a finite number of trials (here, only two), the long-run argument does not apply, and the expected-wealth maximizer might value the higher average monetary outcome.

   The objection may or may not succeed depending on the decision maker's risk preferences and time horizon. In this specific two-round instance, the expected-wealth maximizer can indeed end up with a higher wealth on average, but at the cost of a 16% chance of ending up with only $16 (a very bad outcome). The growth-optimal bettor avoids that outcome by construction. 

  In conclusion, the example isolates that the Kelly criterion (growth-optimal) is sensitive to the risk of ruin and seeks to maximize the compounded growth, while expected wealth is myopic to the variance and the possibility of severe losses.
