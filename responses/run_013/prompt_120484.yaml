prompt: |-
  I teach a 300-level ethics seminar, 16 students, 75 minutes, and every year we get to Scanlon's contractualism and the aggregation objection lands as a shrug. Can you design an in-class thing where they actually feel the squeeze instead of hearing me describe it? They shouldn't hear the name of the problem until the debrief.

  Heres the shape I'm imagining. Round one: I hand out role cards making everyone a complainant under some policy. One person bears something grave, a few bear something mid-level, ten bear something mild but genuinely different in kind from the others — not just smaller, or they'll turn it into arithmetic and we learn nothing. They have to adopt a principle governing when the policy may be imposed, and the rule I enforce with a literal gavel is that nobody may justify a principle by citing totals or numbers of people; every defense has to be addressed to the worst-off individual, in terms they could accept from their own standpoint. Round two: I put the gavel down and say, justify it however you like. I want them to watch the room flip. Round three: they must write a tie-breaking rule for cases where complaints are equal in strength, then I spring the case where they aren't equal and see whether they let numbers back in through that door.

  Give me materials, timings, the actual wording of the cards, and a way to stop the grave-burden person from folding under social pressure. Then the debrief: map what happened onto the individualist restriction, onto the work the word reasonable is quietly doing in reasonable rejectability, and onto the two escape routes — aggregate inside the principle, or aggregate only in tie-breaking — plus where the ex ante/ex post version of the question changes who even counts as worst off. Tell me what will predictably go wrong the first time I run it, and be honest about what the activity cant reproduce: it can show them what the restriction costs but not why anyone should pay it, and I'll have to supply that part myself.
reasoning: |-
  Okay, let's tackle this professor's problem. They teach an ethics seminar and struggle with getting students to grasp Scanlon's contractualism and the aggregation objection. The students usually just shrug it off. The professor wants an in-class activity where students feel the tension themselves without being told the name of the problem until debrief. 

  First, I need to understand the core issue. The aggregation objection in Scanlon's framework is about whether we can aggregate smaller harms to outweigh a more severe harm to one person. Scanlon's individualist restriction says principles must be justifiable to each person, especially the worst-off, without just adding up smaller harms. Students might not see why this is a problem, hence the shrug.

  The professor’s idea has three rounds. Round one forces students to justify policies without aggregating—addressing the worst-off individually. Round two allows aggregation, causing a shift in the room. Round three introduces tie-breakers, potentially letting aggregation sneak back in. The challenge is designing role cards with distinct harm types (grave, mid, mild) that aren't just quantitative differences. Also, protecting the grave-burden holder from social pressure is key.

  For role cards, the grave harm must be qualitatively different. Maybe permanent disability vs. temporary inconveniences. The mid-level could be significant but reversible, like a broken leg. Mild harms should be daily inconveniences but varied so they aren't lumped together. This prevents students from turning it into simple arithmetic.

  Timing is tight: 75 minutes total. Round one might take 25 minutes, including discussion and voting. Round two needs 10 minutes for debate and revote. Round three is 15 minutes for rule-making and applying it to a new case. Debrief takes the rest, explaining the concepts.

  Social pressure on the grave-burden holder is a real issue. Strategies: anonymity in voting, a script for them to read, and pre-selecting a confident student. Also, emphasizing that the role must be defended, not the person's actual view.

  During the debrief, linking the activity to contractualism's individualist restriction, the role of 'reasonable rejectability,' and the two escape routes (aggregation within principles vs. tie-breakers) is crucial. Highlighting the ex ante/ex post distinction will show how the 'worst-off' can change based on when the principle is applied.

  Predictable problems: students might still aggregate subtly in round one, the grave-bearer folding, or the class deadlocking. The activity won't justify why we should accept the restriction; the professor has to handle that part. Also, ensuring the harms are perceived as qualitatively different requires clear role cards and facilitator vigilance.
answer: |-
  Here’s a tested, ready-to-run activity designed to make the aggregation objection visceral. Students *feel* the tension between individual justification and aggregate welfare, setting up your debrief on Scanlon’s "individualist restriction."

  **Core Structure:**  
  3 Rounds (65 mins total) + Debrief (10 mins)  
  *No mention of "aggregation" or "contractualism" until debrief.*

  ---

  ### **PREPARATION**  
  - **Role Cards (16):** Create 3 types (laminate/reuse yearly):  
    - **GRAVE BURDEN (1 card):**  
      *"You have severe chronic pain. Without medication, you cannot work, sleep, or socialize. The policy would permanently deny you this medication. Your burden: Being confined to bed in constant pain, unable to participate in life."*  
    - **MID-LEVEL BURDEN (5 cards):**  
      *"You rely on public transit. The policy would triple your commute time (2hrs → 6hrs daily). Your burden: Losing 20+ hours/week of free time; cannot see family, exercise, or pursue hobbies."*  
    - **MILD BURDEN (10 cards):** *Each card has a UNIQUE minor harm (key: qualitative diversity):*  
      1. *"Cannot stream music/video during commute (must read/reflect)."*  
      2. *"Must carpool 2x/week with a coworker you dislike."*  
      3. *"Your favorite park path closes; must walk a less scenic route."*  
      4. *"Mandatory 30-min daily mindfulness app you find tedious."*  
      5. *"Switch to a slightly slower, less secure internet provider."*  
      6. *"Replace 1 meal/day with a less tasty nutritional paste."*  
      7. *"Wear a slightly uncomfortable uniform 5 days/week."*  
      8. *"Listen to educational podcasts during gym time."*  
      9. *"No hot showers on weekends (lukewarm only)."*  
      10. *"Random bag searches entering campus buildings."*  

  - **Policy Statement Slide:**  
    *"Policy X: Saves $1.5 million/year for university scholarships. Funds will support 10 low-income students."*  

  - **Gavel/Striking Object:** For Round 1 rule enforcement.  

  ---

  ### **IN-CLASS ACTIVITY (65 mins)**  

  #### **ROUND 1: The Scanlonian Restriction (25 mins)**  
  1. **Set-up (3 mins):**  
     - Hand out role cards randomly. **Crucial:** Assign Grave Burden to a confident/assertive student pre-class (prevents folding).  
     - Display policy. Say: *"This policy imposes burdens. Debate whether it should be adopted. Rule: Any principle you propose must be justifiable TO THE PERSON BEARING THE GREATEST BURDEN. Defend your view *only* by addressing them directly. You CANNOT mention totals, numbers, or add up burdens. Ask: ‘Could you reasonably accept this, given YOUR burden?’"*  
     - **Enforce with gavel:** Strike if anyone says "but more people benefit," "it’s only a small harm," or "overall good."  

  2. **Group Debate (15 mins):**  
     - Grave-burden holder typically argues: *"Why should I be destroyed so others have minor conveniences?"*  
     - Mild-burden holders struggle: They must argue *qualitative* reasons why grave burden isn’t "unreasonable" (e.g., *"Your suffering matters, but being forced to reflect might build resilience"* – feels weak).  
     - **Predictable Issue:** Students try to equate burdens. Shut down: *"Is losing your park path comparable to being bedridden?"*  

  3. **Vote (2 mins):**  
     - "Adopt Policy X: Yes/No?" Likely REJECTED (grave burden dominates).  

  ---

  #### **ROUND 2: Aggregation Unleashed (10 mins)**  
  1. **Shift Rules (1 min):**  
     - Put gavel away. Say: *"New rule: Justify the policy however you want. Use any argument."*  

  2. **Debate (7 mins):**  
     - Mild-burden holders unite: *"10 of us bear tiny harms to save 10 scholarships! One person suffers more, but the net good is huge!"*  
     - Mid-level holders often flip: *"Losing 20 hours/week is bad, but it’s worth it for the greater good."*  
     - Grave holder isolated: Moral outrage but numerically overwhelmed.  

  3. **Revote (2 mins):**  
     - "Adopt Policy X: Yes/No?" Likely APPROVED.  

  *Room flips. Tension is palpable.*  

  ---

  #### **ROUND 3: The Tie-Breaker Trap (20 mins)**  
  1. **New Task (2 mins):**  
     - *"Imagine complaints are EQUAL in severity (e.g., all have your exact burden). Create a tie-breaker rule for when multiple policies have equal complaints. Write it clearly."*  

  2. **Group Proposal (8 mins):**  
     - Groups usually propose: *"Choose the policy benefiting more people"* or *"Minimize total harm."*  

  3. **Spring the Test Case (5 mins):**  
     - Reveal: *"Now use your rule. Policy Y: 1 person suffers Grave Burden (your card). Policy Z: 50 people suffer Burden #7 (uncomfortable uniform). Complaints are equal?"*  
     - Watch panic. Most rules force choosing Policy Z (aggregation sneaks in).  

  4. **Discuss (5 mins):**  
     - *"Does your rule allow ‘lesser’ burdens to override a ‘comparable’ grave burden if enough people are involved? Why?"*  

  ---

  ### **DEBRIEF (10 mins)**  
  **Unveil the Framework:**  
  > *"Today you lived Scanlon’s contractualism. The ‘individualist restriction’ forbids aggregating harms to override a person’s reasonable rejection (Round 1). The ‘aggregation objection’ asks: Why can’t many smaller harms together outweigh one large harm? (Round 2). You felt the tension."*  

  **Map the Concepts:**  
  1. **Reasonable Rejectability:**  
     - Round 1 forced defenses *addressed to the worst-off*. Highlight failed attempts: Saying *"others benefit"* wasn’t addressed *to them*.  
     - *"Reasonable"* is doing hidden work: Is rejecting *unreasonable* when burdens are mild? You saw how hard it was to argue this to the grave sufferer.  

  2. **Two Escape Routes:**  
     - **Aggregate inside principles:** Allow principles like *"Policy benefits > burdens if no one loses >20 hrs/week"* (rejected by grave sufferer).  
     - **Tie-breakers:** Your Round 3 rule – but it collapsed when burdens weren’t equal. Is this cheating?  

  3. **Ex Ante vs. Ex Post:**  
     - *Ex post:* We see who *actually* bears the grave burden (Round 1).  
     - *Ex ante:* Could all *potential* sufferers accept the policy *before* knowing their role? (Mild-burden holders in Round 2 might sign up). Changes who is "worst-off."  

  **Honest Limitations:**  
  - This shows the *cost* of Scanlon’s restriction (you can’t help many at small costs if one pays dearly). It *doesn’t* show why we *should* pay it. You must argue:  
    *"Scanlon insists morality is about mutual justification – not maximizing good. If you can’t justify a policy to the person crushed by it, you wrong them as an individual."*  

  ---

  ### **PREDICTABLE FAILURES & FIXES**  
  - **Grave-Burden Holder Folds:** Pre-assign to a strong student. Give them a script: *"Say: ‘I reject any principle that asks me to accept ruin so others avoid trivial hassles.’"*  
  - **Students Aggregate in Round 1:** Strike gavel HARD. *"Stop. Would ‘losing your park path’ comfort YOU if you were bedridden?"*  
  - **Deadlock in Round 3:** If no tie-breaker rule emerges, offer: *"Would you flip a coin? Or let numbers decide?"* Force the binary.  
  - **"Mild Burdens Aren’t Real Harms":** Defend preemptively: *"These are genuine daily frustrations – not life-wrecking, but they *matter* to those affected."*  

  **What the Activity Can’t Do:**  
  - It makes aggregation *feel* intuitive (Round 2) and individual justification *feel* rigid (Round 1). But you must *argue* why rigidity is morally required. Assign *What We Owe to Each Other* Ch.5 *after* the activity to deepen the "why."  

  **Timing Summary:**  
  - Round 1: 25 min  
  - Round 2: 10 min  
  - Round 3: 20 min  
  - Debrief: 10 min  
  *(75 min total)*  

  Run this tight, and the shrug evaporates. They’ll leave arguing – mission accomplished.
