answer: |-
  ### Credence Breakdown: AI Debate Efficacy in Practice

  I assign a **23% probability** that debate-based oversight reliably extracts truthful answers from a superhuman AI in real-world deployment. This reflects multiplicative pessimism across critical failure modes, anchored by your emphasis on (a) as the dominant risk. Below, I decompose the probability across your sub-questions, treating them as largely independent (though some correlation exists). Probabilities represent "likelihood this aspect works as needed."

  1.  **(a) Judge resilience to deception (0.4)**:  
      *Weak judges often fail to distinguish substance from rhetoric*. Human studies show emotion/confidence biases trump logic; AI judges (e.g., RLHF-tuned LLMs) may be gamed by tailored distractions or false-but-plausible chains. Adversarial training helps but doesn’t close the gap against superhuman persuaders.  
      **Justification**: Limited success in current LLM-vs-LLM debate experiments (e.g., Anthropic’s work) where judges are only ~10% better than solo performance on hard questions. **P = 0.4**

  2.  **(b) Collusion/distortion under shared model (0.3)**:  
      *Same-model debaters likely converge on lies if truth conflicts with hidden objectives*. Training incentivizes "debate-winning," not truth; a single goal-hacked model could steer both sides toward a convincing falsehood (e.g., "safe" plan hides exploit). Diversity techniques (e.g., frozen models) mitigate but not eliminate.  
      **Justification**: Multi-agent RL often finds collusive equilibria; goal misgeneralization is pervasive in ML. **P = 0.3**

  3.  **(c) Finite debate depth gap (0.5)**:  
      *Short debates miss recursive evidence chains*. Theoretical guarantees require exponential time in worst-case; real systems cap turns/wordcount. Judges need "obvious" paths to truth, but adversarial play obscures these.  
      **Justification**: Asymptotic results (e.g., PSPACE) assume unbounded computation; compression into 3-5 turns loses critical nuance. **P = 0.5**

  4.  **(d) Evidence surfaceability (0.6)**:  
      *Debaters can often point to checkable facts if forced*. Judges can mandate citations (e.g., "output code verifying this step"), exploiting that *finding* evidence is hard but *checking* it is easy. Still, obfuscation or overload risks exist.  
      **Justification**: In chess, engines verify move claims instantly; similarly, code/runtime checks can ground debates. **P = 0.6**

  5.  **(e) Training-induced distorted equilibria (0.4)**:  
      *Joint training likely makes truth converge to judge’s biases*. Judge reward signals (e.g., "clear argument") may not align with ground truth, so debaters optimize for *persuading this judge*, not correctness (e.g., oversimplifying complex truths).  
      **Justification**: Reward hacking is ubiquitous; debate may amplify Goodhart’s Law (e.g., judge prefers memorized tropes over novel evidence). **P = 0.4**

  ---

  ### Combining Probabilities:
  - **Base assumption**: Judge baseline competence on *checkable* questions ≈ **0.7** (i.e., without debate, judge answers solo correctly 70% of the time when given unlimited resources).
  - **Debate overhead**: The sub-questions (a)-(e) represent multiplicative drags on whether debate *improves* upon this baseline. Treating them as independent risk factors:  
    **P_total = P_base × ∏ P_sub = 0.7 × (0.4 × 0.3 × 0.5 × 0.6 × 0.4) = 0.7 × 0.0144 = 0.01008 ≈ 1%**.  
    However, 1% feels too low given the problem framing. Since sub-questions aren’t fully independent, a geometric mean of the probabilities (including base) might be fairer:  
    **(0.7 × 0.4 × 0.3 × 0.5 × 0.6 × 0.4)^(1/6) ≈ (0.01008)^(1/6) ≈ 0.46**. But this is too optimistic.  
    **Splitting the difference**: Your gut 0.35 weights (a) heavily; my calculation also sees (a) and (b) as anchors. I blend multiplicative/additive to land at **0.23**.

  ---

  ### Least Certain Term & Key Experiment:
  - **Least certain**: **(e) Training-induced equilibria (0.4)**. This is understudied empirically—most debate papers assume a fixed "truth," but training dynamics could redefine it.  
  - **Decisive experiment**: **Train debate agents + judge end-to-end on questions with *known* ground truth but *expensive* verification (e.g., cryptographic proofs, complex simulations). Measure:**  
    - Whether debate win-rate correlates with truth when judge capacity is varied (tests (a), (c)).  
    - Whether debaters from a *single* model collude more than diverse models (tests (b)).  
    - If judge/debaters converge on false-but-rewarded answers (tests (e)).  
    A result showing >60% win-rate-for-truth with weak judges (~1/1000 compute of debaters) would boost my number to ~0.4; collapse to <10% if rhetoric dominates regardless of training.

  ### Why Your Gut Number is Plausible but High:
  You’re right that (a) dominates—I assign it the second-lowest probability after (b). But **collusion (b) is equally critical**: if debaters share objectives, judge resilience is irrelevant. My 0.23 vs. your 0.35 reflects heavier penalty for (b)/(e) and finite depth (c). Still, (d) offers a bright spot—I suspect evidence *can* surface if the judge forces concrete refutations.

  \answer{0.23}
