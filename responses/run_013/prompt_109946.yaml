prompt: |-
  You are a philosopher of mind who works on animal cognition and on the methodology of attributing mental states, and I would like your help drafting a written opinion. I sit on my university's animal care and use committee as its non-affiliated community member — by trade I am a software engineer, and I have no formal background in philosophy, so I am relying on you to supply the conceptual scaffolding as well as the prose. Our institutional policy currently names vertebrates and stops there, though the committee can extend it by resolution, and a resolution is now on the table because three protocols are queued for the next meeting: one on octopuses that involves repeated mildly aversive stimuli, one on decapod crustaceans, and one on ants. One complication that dragged me into this: the octopus protocol includes a machine-learning distress detector trained on vertebrate pain behaviour, and the committee cannot agree whether its output counts as evidence about the animal or merely as evidence about the model. My colleague, a developmental biologist, has been arguing that we should decline to vote at all, on the grounds that consciousness has no observable marker, that each of the markers people propose — integrative processing, motivational trade-offs between competing needs, self-protective behaviour under anaesthesia, the capacity to give up one good to avoid a harm — is behavioural or neural evidence that underdetermines the conclusion, and that a committee pretending to settle which animals are conscious is doing metaphysics with a budget. I think she is at least partly right, and I do not want a memo that simply overrules her.

  Please think this through carefully before you write, and begin by setting out for yourself the strongest version of each side and the points at which they genuinely conflict. Then give me the memo itself, short enough to circulate before the next meeting: a recommendation the committee can vote on (which protocols to approve as they stand, which to approve with conditions such as anaesthesia and analgesia requirements or a ceiling on aversive trials, and which to defer pending something specific), the decision rule stated in a form we can apply to species that are not on the list, and what weight, if any, we should give output from a detector of the kind described. Two constraints shape the rule. It has to be stated as a rule rather than decided case by case, so it must handle species we are confident about, species that are genuinely contested, and cases where extending it would look absurd; and any version that says "when in doubt, assume consciousness" has to answer the objection that this is cheap to say and expensive to live with, since a protection that covers everything protects nothing in particular and may dilute what we owe the animals we are sure of.

  Finally, I am used to specifications that can at least be tested against something, so please tell me what would count as a reason to revisit the rule and on what timetable, and flag any part of your recommendation that rests on a judgment call rather than on evidence. A literature review or reading list will not help me; I need the argument and the operative language of the document.
reasoning: |-
  Okay, the user is a software engineer serving on an animal care committee without a philosophy background. They need help drafting a recommendation about extending ethical protections to invertebrates like octopuses, crustaceans, and ants. Their developmental biologist colleague argues that consciousness can't be proven through observable markers, making any committee decision "metaphysics with a budget."

  Hmm... the core tension is between scientific caution (demanding conclusive evidence) and ethical precaution (protecting potentially conscious beings). The colleague isn't wrong about underdetermination - neural or behavioral markers don't *logically prove* subjective experience. But her position risks moral blindness. 

  The machine-learning distress detector adds complexity. It's trained on vertebrates, so applying it to octopuses assumes cross-species validity - a big leap given their divergent neurobiology. The output reflects model confidence, not proven suffering. Still, dismissing it entirely feels reckless if there's even a 10% chance it detects real distress.

  For the rule itself, "when in doubt assume consciousness" sounds noble but ignores resource constraints. If we protect *everything* equally, we dilute protections for vertebrates. But the opposite - protecting only what's proven - leaves octopuses vulnerable despite strong evidence of complex cognition. 

  The solution needs tiers: species with robust evidence (octopuses), contested cases (crustaceans), and clear exclusions (ants). For detectors, we should treat outputs as provisional evidence requiring verification. 

  Key judgment calls: 
  - What counts as "robust" evidence? I'm prioritizing neuroanatomical homology plus behavioral complexity. 
  - How to handle detectors? They're weighted but not decisive. 
  - The 5-year review admits uncertainty while preventing paralysis.

  The memo must balance scientific humility with moral responsibility. We can't prove consciousness exists in *any* species, but we don't burn dogs alive to debate philosophy. The rule should err toward protection where evidence suggests capacity, not demand impossible certainty.
answer: |-
  ## Internal Memo: Proposed Framework for Protections Extension & Distress Detection Evaluation  
  **To:** Animal Care & Use Committee  
  **From:** [Your Name], Non-Affiliated Community Member  
  **Subject:** Resolution on Invertebrate Protocols & Evidentiary Standards  
  **Date:** [Date]  

  ### Preamble: Core Conflict & Principles
  This memo addresses two interlinked issues: (1) extending ethical protections beyond vertebrates, and (2) evaluating machine-learning (ML) distress detectors. The core philosophical conflict is between:

  *   **Scientific Caution (Colleague's View):** Consciousness (particularly phenomenal consciousness/subjective experience) lacks a definitive, uncontested observable marker. Behavioral/neural evidence *underdetermines* the conclusion. Extending protections risks making untestable metaphysical claims.
  *   **Ethical Precaution:** Where credible evidence suggests a *capacity for suffering* (a minimal criterion for ethical concern), the absence of absolute proof is not grounds for inaction. Waiting for certainty risks profound moral harm. We manage comparable uncertainty with vertebrates daily.

  **Resolution:** Neither position is wholly right/wrong. We *cannot* settle the metaphysics of consciousness. We *can and must* make evidence-based risk assessments about the *probability of harm-capacity* to fulfill our ethical duty. The goal is not metaphysical certainty, but identifying where the *weight of evidence* warrants precaution.

  ---

  ### Recommendation & Operative Framework

  #### I. Proposed Resolution on Species Protections
  **Move to adopt a tiered evidence-based protection framework, effective immediately:**  

  1.  **"Presumptive Protection" Tier:** Species receive protections equivalent to vertebrates if they demonstrate:  
      *   **a.** Complex, centralized nervous systems with structures functionally analogous to vertebrate pain-processing regions (e.g., vertical lobe in octopuses, specific ganglia clusters in decapods), **AND**  
      *   **b.** Behavior exhibiting *motivational trade-offs* (e.g., sacrificing food/comfort to avoid a noxious stimulus, context-dependent responses), **AND**  
      *   **c.** Demonstrated *long-term behavioral change* following aversive events (e.g., learned avoidance, altered habitat use).  
      *   **Application:**  
          *   **Octopus Protocol:** **APPROVE** with conditions: Mandatory use of appropriate anesthesia/analgesia validated for cephalopods for invasive/stressful procedures; strict limits on aversive trial repetition/frequency/duration; mandatory humane endpoints triggered by behavioral indicators *or* sustained high ML distress scores (see Section II).  
          *   **Decapod Crustaceans Protocol:** **DEFER.** Request specific evidence addressing criteria (a-c) above. Current evidence (e.g., on crab anxiety-like states, trade-offs) is suggestive but requires consolidation for this species/methodology. Conditional approval may be possible post-review.  
          *   **Ants Protocol:** **APPROVE AS STANDS.** Current evidence does not meet the threshold for presumptive protection. Standard minimization of harm/discomfort remains required, but vertebrate-level analgesia/anesthesia mandates are not triggered.

  2.  **"Evidence Review Required" Tier:** Species lacking consensus or robust evidence meeting all Tier 1 criteria (e.g., insects beyond ants like bees, some crustaceans, cephalopods other than octopus) require case-by-species review using the Tier 1 framework. Burden of proof lies with the researcher to demonstrate evidence for protection.

  3.  **"No Presumptive Protection" Tier:** Species lacking any credible evidence for centralized nociceptive integration or motivational trade-offs (e.g., most insects, bivalves). Standard ethical minimization applies, but vertebrate-level interventions not mandated.  

  **Decision Rule (For New Species):**  
  *Protections equivalent to vertebrates are triggered if, and only if, a species presents credible, replicated scientific evidence satisfying all three criteria (complex analogous neuroanatomy, motivational trade-offs, long-term aversive learning) indicative of a capacity for evaluative experience and harm avoidance. Absent such evidence, protections default to standard harm minimization without specific analgesic/anesthetic mandates, pending new evidence.*

  #### II. Evaluation of ML Distress Detectors
  *   **Status:** An ML detector trained *only* on vertebrate behavior **does not constitute direct evidence of octopus distress.** Its output is primarily evidence about the *model's prediction* based on *vertebrate-derived features*.
  *   **Weight & Use:**  
      *   **(a) Not Definitive:** Output alone **cannot justify** presuming consciousness or overriding behavioral observations.  
      *   **(b) Admissible as Corroborative Data:** Output can be considered **significant supporting evidence** *if and only if*:  
          *   The model's input features are biologically plausible for the species (e.g., octopus skin patterning, arm postures).  
          *   The model's predictions correlate significantly with *independent, species-specific behavioral indicators* of stress/aversive response identified by experts (e.g., inking, jetting, specific arm movements).  
          *   **Operative Rule:** *"ML distress detector output may be used to supplement, but not replace, expert assessment of species-specific behavioral indicators. High or sustained model outputs, especially when corroborated by observed behavior, should trigger immediate review for humane endpoint intervention."*  
  *   **Application to Octopus Protocol:** The detector's output is admissible as *supporting evidence* contingent on researchers demonstrating its correlation with defined octopus-specific stress behaviors during piloting. High outputs must trigger protocol review points.

  ---

  ### Addressing Key Constraints

  *   **"Assume Consciousness" Dilution:** This framework avoids blanket assumptions. Tier 1 requires specific, high-bar evidence. It protects only where evidence strongly indicates a *relevant capacity* (suffering), preventing dilution towards "protecting everything." Resources remain focused on higher-risk cases.
  *   **Handling Absurdity:** The tripartite structure explicitly excludes species lacking the foundational criteria (e.g., ants, jellyfish), preventing absurd extensions. "Evidence Review" provides a buffer for contested cases.
  *   **Rule vs. Case-by-Case:** The rule provides clear criteria (a,b,c) for triggering presumptive protection, applicable to any species. "Evidence Review" handles ambiguity without resorting to pure case-by-case metaphysics.

  ---

  ### Revisiting the Rule & Judgment Calls

  1.  **Trigger for Revisiting:**  
      *   **Major New Evidence:** Publication of robust, replicable findings significantly altering the assessment of a major taxon's capacity (e.g., conclusive evidence for or against pain in decapods).  
      *   **Systematic Review:** Automatic review of the framework and its species classifications **every 5 years** by the committee, incorporating latest neuroscience and ethology literature.
  2.  **Inherent Judgment Calls (Flagged):**  
      *   **Defining "Complex, Centralized & Analogous":** Requires neurobiological expertise to determine if structures (e.g., decapod ganglia) perform *functionally similar integration* to vertebrate pain pathways. This is interpretive but grounded in comparative anatomy/physiology.  
      *   **Defining "Motivational Trade-offs":** Requires ethological expertise to distinguish complex trade-offs from simple reflexes or fixed action patterns. Relies on behavioral context and flexibility.  
      *   **Correlation Threshold for ML Detectors:** Determining what constitutes a "significant correlation" with species-specific behavior involves statistical judgment. Require researchers to pre-specify correlation thresholds and validation methods in the protocol.

  **Recommended Vote:**  
  *   **APPROVE** the Octopus Protocol with the specified conditions (analgesia/anesthesia, trial limits, ML use rules, humane endpoints).  
  *   **DEFER** the Decapod Crustacean Protocol pending submission of evidence per Tier 1 criteria.  
  *   **APPROVE** the Ants Protocol as submitted (standard minimization applies).  
  *   **ADOPT** the Tiered Protection Framework & ML Evaluation Rule as institutional policy for future protocols involving non-vertebrates.

  This framework navigates the uncertainty without requiring metaphysical certainty. It grounds decisions in the best available evidence of *potential for harm*, fulfilling our ethical duty while respecting scientific limitations.
