prompt: |-
  I run the exceptions desk at a mid-sized humanitarian org. I'm not a philosopher, I'm just the person who gets the awkward requests. We have a short public list of things we say we never do: we don't pay armed groups for access or to get our staff released, we don't hand beneficiary data over to governments, and we don't decieve people to get their consent to be in our research. Maybe a dozen times a year some country office asks for an exception, and the argument is always the same shape: fine, this one thing breaks the rule, but doing it prevents several more breaks of the very same rule down the line. Five more detentions if we don't pay. Thousands of patients dropped if we don't hand over the list. A study that would save a lot of lives if we're allowed to be sneaky just this once.

  That's the bit I can't get my head around. If the whole reason we have these rules is that each person matters and shouldn't be used as a tool, then we should care a lot about the extra people who get hurt when we stick to the rule, so why not break it? But the moment we start weighing the numbers we don't have rules anymore, we have a cost-benefit sheet, and the rules were supposed to be exactly the thing that stops us doing that.

  So please turn this into a decision procedure my desk can actually run. The order of the questions, what counts as a good enough answer to each, where it just stops with a no, and where it hands the call to a human because it's a value judgment and not a fact. It has to be runnable by a smart non-philosopher in an afternoon on incomplete information, and it has to keep whatever it is that makes a rule a rule rather than a number to be traded. I want it to be able to say: the fact that there are more people on the other side doesn't cancel the reason not to do this to this one person. But it still has to admit that some exceptions are genuinely right. Throw in a step for the what-if-everyone-copies-us worry, and be clear that that's a seperate kind of reason from the one the rule is made of.

  Then run it on three: (1) the payment to get two staff back, where not paying has correlated with more detentions but we can't prove it; (2) the beneficiary list, where refusing probably kills the programme for thousands and handing it over puts a few people in real danger; (3) a case I'll hate, where a field team wants to mislead a local official to move medical supplies through and save several lives, and I suspect your procedure says no. I want to watch it say no to me. Anything that overrides a rule has to go to the board, so the output has to be something I can put in front of them.

  At the end, tell me straight which steps are just judgment dressed up as procedure, and what this thing can't do at all.
reasoning: |-
  We are designing a decision procedure for handling exception requests to the organization's rules. The rules are absolute in principle but may have exceptions in practice. The challenge is to create a procedure that respects the deontological nature of the rules (they protect individual rights and dignity) while allowing for consequentialist considerations in extreme cases, without reducing the rules to mere cost-benefit calculations.

  The key principles:
  1. The rules are in place to protect individual rights and dignity. Each rule violation directly harms an individual (or group) by treating them as a means to an end.
  2. However, we recognize that sometimes violating a rule might prevent more violations of the same rule (or similarly grave harms) in the future.
  3. We must also consider the "what if everyone did this?" (universalizability) concern, which is separate from the immediate harm.

  The procedure must:
  - Be runnable by a non-philosopher in an afternoon with incomplete information.
  - Preserve the rule's character as a rule (not a tradable number).
  - Be able to say that the harm to one person cannot be canceled by benefits to others, except in extreme and well-justified cases.
  - Include a step for the universalizability worry (copying effect).
  - Require that any exception that overrides a rule must go to the board.

  Structure of the Decision Procedure:

  We will break the decision into a series of questions. The goal is to either reject the exception (and stop) or, if the exception might be justified, to require board approval. We can have intermediate steps that might lead to a "no" without going to the board, but any "yes" to an exception must go to the board.

  Steps:

  1. **Rule Identification and Direct Harm Assessment**:
     - Identify which rule is being requested for an exception.
     - Describe the direct harm that would be caused by breaking the rule in this instance. (This is the harm to the individual(s) directly affected by the rule-breaking.)
     - If the direct harm is irreversible, severe, and/or violates core humanitarian principles (like do no harm), note that this is a strong reason against the exception.

  2. **Prevented Harm Assessment**:
     - Assess the harm that the requester claims will be prevented by breaking the rule. This must be harm that would result from *the same type of rule violation* (or a very similar one) if the rule is not broken. For example, if breaking the rule prevents several future detentions (which would be violations of the same rule against paying for staff release), then that counts.
     - The prevented harm must be of the same kind and severity (or worse) as the direct harm from breaking the rule. We are only comparing like with like.
     - The evidence for the prevented harm must be strong. We require a high standard of evidence because predictions are uncertain. If the evidence is weak (e.g., correlation without proven causation, vague threats), then this step fails.

     Note: This step is not about trading one harm for another. It is about whether breaking the rule in this instance is the only way to prevent more instances of the same rule being broken (or similar harms) in the future. The idea is that by breaking the rule once, we prevent multiple future rule breaks (each of which would harm individuals). This is the only consequentialist consideration we allow, and it must be tightly constrained.

  3. **Necessity and Last Resort**:
     - We must be certain that there is no other way to achieve the same result without breaking the rule. The requester must demonstrate that all alternatives have been exhausted.
     - If there is any alternative, even if it is more costly or time-consuming, then the exception is not justified.

  4. **Universalizability (Copying Effect)**:
     - We consider what would happen if every humanitarian organization in similar circumstances broke this rule. Would it lead to a situation where the rule becomes meaningless and the harm we are trying to prevent becomes widespread? If so, then even if the immediate prevented harm is great, the long-term effect could be catastrophic.
     - This step is about the integrity of the humanitarian system and the trust placed in it.

  5. **Board Referral**:
     - If the exception passes steps 1-4 (i.e., the direct harm is outweighed by the prevented harm of the same kind, with strong evidence, and it is necessary, and the copying effect is not catastrophic), then the exception must be referred to the board for a final decision. The board will consider the same factors and make a value judgment.

     - However, if at any step the conditions are not met, the exception is denied.

  Now, we run the three cases:

  **Case 1: Payment to get two staff back, where not paying has correlated with more detentions but we can't prove it.**

  1. **Rule Identification and Direct Harm**: The rule is "we don't pay armed groups for access or to get our staff released." The direct harm: paying armed groups supports and enriches them, potentially fueling conflict and making future detentions more likely. It also violates the principle of not funding armed groups.

  2. **Prevented Harm Assessment**: The claim is that not paying will lead to five more detentions. However, the evidence is only correlational and we cannot prove causation. Therefore, the evidence is weak. Also, the prevented harm (future detentions) is of the same kind as the harm we are trying to prevent by the rule. But without strong evidence, we cannot accept this prevented harm as certain or even probable enough.

     -> Step 2 fails. We cannot proceed.

  3. **Necessity**: Not assessed because step 2 failed.

  4. **Universalizability**: If we pay, it signals that detentions can be profitable, which might encourage more detentions. This copying effect could be very harmful.

  5. **Decision**: The exception request is denied without needing to go to the board.

  **Case 2: Handing over beneficiary data to a government, where refusing kills the program for thousands and handing it over puts a few people in real danger.**

  1. **Rule Identification and Direct Harm**: The rule is "we don't hand beneficiary data over to governments." The direct harm: handing over the data puts a few individuals in real danger (e.g., persecution, arrest, or worse). This is a severe and irreversible harm.

  2. **Prevented Harm Assessment**: The claim is that without handing over the data, the program ends and thousands of patients are dropped. However, note that the harm to the thousands is not a violation of the same rule. The rule is about data privacy. The harm to the thousands is a harm of a different kind (lack of access to services). Therefore, we cannot compare these directly. The rule is designed to protect individuals from being exposed to danger by our actions. We are not allowed to trade the danger to a few against the loss of service to many because that would be using the few as a means to help the many.

     -> Step 2 fails because the prevented harm is not of the same kind as the direct harm (it's not multiple instances of the same rule being broken). The rule is not about providing services; it's about protecting beneficiary data.

  3. **Necessity**: Not reached.

  4. **Universalizability**: If we hand over data, it erodes trust in humanitarian organizations and might lead to beneficiaries refusing to provide data, which would harm future programs. Also, governments might routinely demand data.

  5. **Decision**: The exception is denied.

  **Case 3: Misleading a local official to move medical supplies through and save several lives.**

  1. **Rule Identification and Direct Harm**: The rule is "we don't deceive people to get their consent to be in our research." However, note that this case is about moving medical supplies, not research. But the rule about deception is broader? Let's assume the rule is interpreted as a principle against deception in all our operations, or at least in this context. The direct harm: deception undermines trust and violates the principle of informed consent and honesty. Even if it is an official, it is a form of lying that can have consequences for the organization's reputation and future access.

  2. **Prevented Harm Assessment**: The claim is that without deception, the medical supplies won't get through and several lives will be lost. But note: the harm prevented (death due to lack of supplies) is not the same as the harm caused by the rule violation (deception). The rule is about deception, not about providing supplies. Therefore, we cannot compare. The prevented harm is not multiple instances of deception (which would be the same rule) but a different harm (death). 

     -> Step 2 fails because the prevented harm is not of the same kind.

  3. **Necessity**: Not reached.

  4. **Universalizability**: If we deceive officials, it could lead to a breakdown in trust and make future operations harder. Officials might retaliate or become more suspicious.

  5. **Decision**: The exception is denied.

  However, note that in case 3, the rule is specifically about consent in research. If this situation is not about research, then it might not be covered by that rule. But the organization likely has a broader principle of honesty? We must check the rule's scope. If the rule only applies to research, then this case might not be a rule exception. But the user mentioned "deceive people to get their consent to be in our research", so if the field team is not doing research, then the rule doesn't apply. But the user says "a field team wants to mislead a local official", which might be covered under a different rule or principle. The procedure requires that we identify the rule. If there is no rule against deception in non-research contexts, then this case might not require an exception. But the user presents it as a rule exception, so we assume the organization has a similar rule against deception in operations.

  But let's stick to the given rules. The rules are:
  1. Don't pay armed groups.
  2. Don't hand over beneficiary data.
  3. Don't deceive to get consent for research.

  Case 3 is about deception but not for research. So it might not be covered by rule 3. However, the organization may have a general principle of honesty. The procedure only applies to the three rules. So if there's no rule against deception in non-research contexts, then this is not a rule exception. But the user is asking to run it as a rule exception, so we must assume that the deception rule is being invoked (or that there is a similar rule). Alternatively, the user might be extending the rule by analogy. For the sake of the exercise, we treat it as an exception to the rule against deception (even though the rule is research-specific, we interpret it broadly as a principle).

  But note: the rule is about consent to research. If the field team is not doing research, then they are not breaking that rule. So maybe it doesn't require an exception? However, the user says they are being asked for an exception to a rule. Therefore, we assume that the organization considers this a violation of the spirit of the rule or that there is an implied rule against deception. To be safe, we note that the rule might not apply, but if it does, then we deny the exception.

  Alternatively, the organization might have a broader ethical framework. But the procedure is for the three rules. So if the request doesn't break one of the three, then it doesn't go through the exception desk. But the user says the field team wants to mislead and they are asking for an exception to a rule. So we assume they are invoking the rule against deception and asking to break it.

  Given that, we stick to the denial.

  Now, what steps are just judgment dressed up as procedure?

  - Step 2 (Prevented Harm Assessment) requires judgment about the kind of harm and the strength of evidence. It is not purely factual because:
     - Determining if the prevented harm is of the "same kind" is a value judgment. What counts as the same kind? (e.g., in case 2, is the harm of data exposure the same as the harm of program termination? We said no, but someone might argue they are both harms to beneficiaries.)
     - Assessing the strength of evidence is also judgmental.

  - Step 3 (Necessity) is judgmental: what counts as having exhausted alternatives?

  - Step 4 (Universalizability) is highly speculative and requires judgment about what would happen if everyone copied.

  What the procedure can't do at all:

  - It cannot handle cases where the prevented harm is of a different kind but much more severe (e.g., saving many lives by violating a rule that causes a minor harm). The procedure is designed to only consider prevented harms that are the same kind (to avoid trading one type of harm for another). But sometimes, a minor rule violation might prevent a catastrophe of a different kind. The procedure would not allow that because it would be trading. This is a limitation.

  - It relies on the ability to categorize harms and predict consequences, which is often uncertain.

  - It cannot resolve conflicts between different values (e.g., honesty vs. saving lives) because it is built for the specific rules.

  Final Procedure Outline:

  1. **Rule Identification and Direct Harm**:
     - Which rule is being broken? 
     - What is the direct harm to the individual(s) from breaking the rule? (Describe the nature and severity.)
     - If the direct harm is severe and irreversible, note it.

  2. **Prevented Harm Assessment**:
     - What is the harm that will be prevented by breaking the rule? 
     - Is this prevented harm of the same kind as the direct harm? (i.e., would it be a violation of the same rule if it occurred?) 
     - How many instances of the same harm would be prevented? (This is the only time we count: we break one rule to prevent multiple future breaks of the same rule.)
     - What is the evidence for the prevented harm? (Require strong evidence; if weak, reject.)
     - If the prevented harm is not of the same kind, then step fails.

  3. **Necessity**:
     - Have all alternatives been exhausted? (Require documentation of alternatives tried.)
     - Is there any way to achieve the same result without breaking the rule?
     - If alternatives exist, reject.

  4. **Universalizability**:
     - If we break the rule in this case, what would happen if every humanitarian organization did the same in similar circumstances?
     - Would it lead to a significant erosion of the rule and cause more harm overall? (If yes, that weighs against the exception.)

  5. **Decision**:
     - If steps 2 and 3 are satisfied (same kind of harm prevented, strong evidence, necessary), and step 4 does not show catastrophic copying effects, then refer to the board with all the analysis.
     - Otherwise, deny the exception.

  Note: The board referral step is for cases that pass the initial screening. The board makes the final value judgment.

  This procedure maintains the rules as rules by only allowing exceptions when the same rule would be broken multiple times in the future if we don't break it once now. It avoids trading different kinds of harms. However, it still requires judgment in categorizing harms and assessing evidence.
answer: |-
  Below is a decision procedure designed for your exceptions desk. It's built on a **hybrid ethical framework** that preserves the core deontological value of your rules (each person has inherent dignity; they cannot be used as a tool) while allowing narrow exceptions only when *failing to break the rule would cause more violations of that exact same rule*. This prevents "trading" individuals for outcomes, but acknowledges that in rare cases, breaking the rule *once* might prevent *multiple future breaches* of the same rule. The "what if everyone copies us?" (universalizability) test is a separate, non-negotiable check.

  The procedure is structured as a **step-by-step flowchart** with clear stopping points. It requires no philosophy expertise—just factual analysis and disciplined adherence to the steps. If an exception clears all steps, it **must** go to the board. The board then makes the final value judgment on whether the exception is justified. Steps that involve judgment (vs. factual checks) are explicitly flagged.

  ---

  ### **Decision Procedure for Rule Exceptions**
  **Input Required**: Written request from the country office detailing: (1) Rule to be broken, (2) Direct harm from breaking it, (3) Harm prevented by breaking it, (4) Evidence for both, (5) Alternatives explored, (6) Risk of copying effects.

  #### **Step 1: Rule and Direct Harm Identification**  
  *Purpose: Ground the analysis in the specific person(s) harmed by breaking the rule.*  
  - **Question 1a:** Which rule does this request ask to break? (Select from your predefined list.)  
  - **Question 1b:** Who is *directly* harmed by breaking this rule, and how? Describe the concrete harm to *this specific person/group* (e.g., "This beneficiary’s data is exposed to a persecutory regime").  
  - **Stopping Point:** If no direct harm is identified → **DENY EXCEPTION** (breaking the rule has no victim; the rule may not apply).  
  - **Output for Board (if proceeding):** "Breaking Rule X directly harms [Person/Group Y] by [Harm Z]."

  #### **Step 2: Prevented Harm Assessment**  
  *Purpose: Only proceed if the *only* justification is preventing future breaches of the SAME rule.*  
  - **Question 2a:** What harm is claimed to be prevented by breaking the rule?  
  - **Question 2b:** Is this prevented harm **the same type** as the direct harm from Step 1b? (e.g., "Exposing one person’s data to save others from data exposure" = same harm; "Exposing data to save lives via program continuation" = different harm).  
    - **Judgment Call:** "Same type" means: (a) Same rule violated, (b) Same nature of harm (e.g., detention, data exposure, deception), (c) Harm to comparable entities (e.g., individuals, not systems).  
  - **Question 2c:** Is there **strong evidence** that breaking the rule *will* prevent *more* instances of this *exact same harm*? (e.g., "Not paying now leads to 5+ future detentions").  
    - **Evidence Threshold:** Correlations or anecdotes → weak. Verified patterns, credible threats, or data from similar contexts → strong.  
  - **Stopping Points:**  
    - If prevented harm is *not the same type* as direct harm → **DENY EXCEPTION** (This is "trading" one harm for another; violates the rule’s purpose).  
    - If evidence is weak → **DENY EXCEPTION** (Unverified predictions don’t override rules).  
  - **Output for Board (if proceeding):** "Breaking Rule X once prevents [Number] future violations of Rule X, evidenced by [Summary of Evidence]."

  #### **Step 3: Necessity and Alternatives**  
  *Purpose: Ensure breaking the rule is the ONLY option.*  
  - **Question 3:** Have **all feasible alternatives** to breaking the rule been exhausted? (e.g., Negotiation, legal routes, third-party mediation, program redesign).  
    - **Judgment Call:** "Feasible" = logistically possible within time constraints, even if costly or inefficient.  
  - **Stopping Point:** If alternatives exist → **DENY EXCEPTION** (Rules aren’t optional when other paths exist).  
  - **Output for Board (if proceeding):** "No alternatives exist. Options explored: [List]."

  #### **Step 4: Universalizability Test ("What If Everyone Copies Us?")**  
  *Purpose: Assess systemic impact—separate from the rule’s core logic.*  
  - **Question 4:** Would widespread adoption of this exception by other aid groups **erode the rule or amplify harm** globally? (e.g., "If all groups pay armed groups, detentions increase industry-wide").  
    - **Judgment Call:** Focus on incentives and precedents (e.g., Does this teach bad actors that breaking rules is profitable?).  
  - **Stopping Point:** If copying would likely destroy the rule’s efficacy → **DENY EXCEPTION** (Even if Steps 1–3 pass, this is a veto).  
  - **Output for Board (if proceeding):** "Systemic risk if copied: [Low/Medium/High]. Rationale: [Summary]."

  #### **Step 5: Board Referral**  
  *Purpose: Final safeguard for value judgments.*  
  - **If all Steps 1–4 are satisfied** → **REFER TO BOARD** with a dossier including:  
    - Rule broken and direct harm (Step 1).  
    - Prevented same-harm evidence (Step 2).  
    - Alternatives exhausted (Step 3).  
    - Copying risk (Step 4).  
  - **Board’s Role:** Weigh whether the prevented harm *outweighs* the direct harm *within the same moral framework* (e.g., "Does exposing 1 person’s data to prevent 10 future data exposures align with our values?"). This is inherently subjective.  
  - **If any step fails** → **DENY EXCEPTION** (No board referral needed).

  ---

  ### **Key Features of This Procedure**  
  1. **Rules stay rules**: By only allowing same-harm tradeoffs (Step 2), it avoids reducing people to numbers. You cannot sacrifice one person for a "greater good" of a different kind (e.g., data exposure for program survival).  
  2. **Practicality**: Uses clear thresholds (e.g., evidence strength, harm type). A smart non-philosopher can run it in an afternoon.  
  3. **Copies the "real world"**: Requires documentation, separates facts (evidence) from judgments (harm type, copying risk), and forces requesters to prove their case.  
  4. **Escalates judiciously**: Only plausible exceptions reach the board.  

  ---

  ### **Run the Cases**  
  *Assumptions:* Your rules are:  
  ① No paying armed groups for staff release.  
  ② No sharing beneficiary data with governments.  
  ③ No deception for consent in research.  
  *For simplicity, we extend Rule ③ to cover *operational* deception (e.g., misleading officials), as this is implied in your case.*

  #### **Case 1: Pay armed group to release 2 staff; not paying correlated with more detentions (no proof)**  
  - **Step 1:** Rule ① broken. Direct harm: Enriching armed groups incentivizes further violence/detentions.  
  - **Step 2:** Prevented harm = future detentions (same type: Rule ① breaches). **BUT** evidence is weak (correlation ≠ causation; no proof). → **DENY EXCEPTION** (Stops at Step 2).  
  - **No board referral**.  

  #### **Case 2: Share beneficiary list to save program for thousands; refusal "probably kills" program, sharing puts few in danger**  
  - **Step 1:** Rule ② broken. Direct harm: Specific beneficiaries exposed to persecution/danger.  
  - **Step 2:** Prevented harm = program cancellation (different type: Not a Rule ② breach; this is "denying aid," not "exposing data"). → **DENY EXCEPTION** (Stops at Step 2).  
  - **Why?** Sacrificing data security for program survival trades one harm (individual endangerment) for another (systemic service loss). The rule exists precisely to block this calculus.  
  - **No board referral**.  

  #### **Case 3: Mislead local official to move medical supplies, saving lives**  
  - **Step 1:** Rule ③ broken (extended to operations). Direct harm: Deception erodes trust; violates consent/autonomy of the official.  
  - **Step 2:** Prevented harm = deaths due to lack of supplies (different type: Not a Rule ③ breach). → **DENY EXCEPTION** (Stops at Step 2).  
  - **Why?** Lives saved ≠ same harm as deception. If you allow this, the rule becomes "don’t deceive unless it’s life-or-death"—a slippery slope to routine tradeoffs.  
  - **No board referral**.  
  - *(You suspected a "no"—here it is.)*  

  ---

  ### **Where Judgment Masquerades as Procedure**  
  These steps **require value judgments**; the procedure only structures them:  
  - **Step 2b (Harm Type)**: Deciding if harms are "the same" is subjective (e.g., is "detention by armed groups" the *same* as "detention by corrupt police"?). The procedure forces explicit reasoning but doesn’t eliminate discretion.  
  - **Step 4 (Copying Risk)**: Predicting industry-wide effects is speculative. The procedure mandates considering it but relies on the user’s intuition about incentives.  
  - **Board’s Role (If Referred)**: The board must answer: "Does preventing 10 future harms justify causing 1 harm now?" This is philosophical, not procedural.  

  ### **What This Procedure Can’t Do**  
  1. **Handle novel harms**: If a request involves a harm not covered by your rules (e.g., environmental damage), it won’t fit.  
  2. **Override the "copies" veto**: If Step 4 shows high systemic risk, the exception dies—even if everything else passes.  
  3. **Resolve ambiguous evidence**: It flags weak evidence but can’t magically verify field claims.  
  4. **Eliminate board subjectivity**: The board must confront the same moral tension you described. This procedure only ensures they see it clearly.  

  ---

  ### **Final Recommendation**  
  This procedure will:  
  - Reject most exceptions (as your cases show).  
  - Force requesters to rigorously justify "same harm" claims.  
  - Reserve board time for truly borderline cases.  
  - Preserve the core spirit of your rules: **You never use a person as a means to an end, even if the math seems to justify it.**  

  When in doubt, remember: The rules are your armor. If you chip away at them for "exceptions," they cease to work. This procedure lets you hold the line without ignoring reality.
