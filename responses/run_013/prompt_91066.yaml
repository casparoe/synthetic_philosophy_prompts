prompt: |-
  I teach a ninety-minute session in a two-week residential summer programme in philosophy. Fourteen participants, mixed levels, no set reading: about half live in the city where the programme is held, the other half are visiting from elsewhere, and I want to make use of that fact rather than treat it as incidental.

  The idea I want them to feel is the difference between a local custom that is merely how things are done here and one that has hardened into something you owe people — and then, harder, the position of the visitor, who is subject to both their own customs and ours. I want them to arrive at three claims themselves, in roughly this order: that what separates the two kinds of custom is not the content of the custom but whether a person can decline it in a way that others can read; that the visitor's felt obligation to conform is produced mostly by their illegibility to the locals rather than by anything about the custom itself; and that the locals' sense of entitlement to the visitor's conformity is, on inspection, a claim about being able to predict and be understood, not a claim about harm. None of this should be said out loud before the debrief.

  Build the activity on a customs sheet I will hand out for a fictional host city. Three customs on it. In cafés a service charge is already included, and leaving extra money is read either as a comment on the server's wages or as a bid for better treatment, so locals do not tip. At the tram stop there is no physical line, but boarding is strictly by order of arrival, tracked by eye contact, a half-step forward and a small nod — legible to locals, invisible to visitors, whose mistakes are read as rudeness rather than as ignorance. Crossing against the signal is unremarkable and locals do it mid-conversation, with one exception: nobody crosses against the signal when a small child is waiting at the curb. You may add at most one further custom of the same mundane kind if the activity needs it, and I would rather you did not add more than one.

  Two things I want the activity to make participants do rather than discuss. First, for each custom on the sheet they should have to work out what a person would actually have to do to opt out visibly — what it would cost, who would notice, whether the opt-out would be read as an insult, an imposition, or mere difference — and then compare what happens when one person opts out with what happens when everyone does. Second, at some point a participant must choose in front of the others with something small but real at stake, so the choice is not hypothetical; points, turns, or standing in a queue will do, but no money.

  Give me: the roles or rules; the materials, including how the customs sheet is introduced without lecturing; a minute-by-minute timeline for the ninety minutes; the stake scheme; and a phase late in the session in which the visitors have become the numerical majority and the group has to decide whether the locals still have any claim on them. Then the debrief, which should map particular moments from the run onto the three claims above rather than restating them in the abstract, and should tell me what the activity genuinely shows as opposed to what it merely dramatises. Finally, tell me what will predictably go wrong the first time I run this — including what happens if the participants are too polite to break the customs, or if the visiting students simply defer to the locals — and how I should handle each case. Be explicit about which part of the idea the activity cannot reproduce at all and that I will have to supply myself.
reasoning: |-
  We are designing a 90-minute session for a philosophy summer program. The goal is to explore the difference between local customs that are merely habitual and those that feel obligatory, and the experience of visitors who are subject to both their home customs and the new ones. The participants will arrive at three key claims through an activity centered on a fictional host city's customs.

  The three claims are:
  1. What separates habitual customs from obligatory ones is not the content but whether one can decline in a way that others can understand (legible opt-out).
  2. The visitor's felt obligation to conform is mostly due to their illegibility to locals, not the custom itself.
  3. The locals' sense of entitlement to the visitor's conformity is about predictability and understanding, not harm.

  We will use a customs sheet with three customs (and possibly a fourth if needed) for a fictional city. The customs are:
  1. Tipping: Service charge included, no tipping. Extra money is read as a comment on wages or a bid for better treatment.
  2. Tram boarding: No physical line, order by arrival tracked by eye contact, half-step forward, and a nod. Mistakes by visitors are seen as rudeness.
  3. Jaywalking: Crossing against the signal is common, except when a small child is waiting at the curb.

  We may add one more custom if needed, but try to avoid.

  The activity should have participants:
  - For each custom, work out what a person would have to do to visibly opt out, and the social cost (insult, imposition, difference) and then compare when one person opts out vs. when everyone does.
  - At some point, a participant must make a non-hypothetical choice with a small real stake (like points, turns, standing in a queue).

  Structure:
  - Roles: Some participants will be "locals" and some "visitors". Since half are actually from the city and half visiting, we can assign roles accordingly, but note that in the activity we are using a fictional city so their real origins may not directly map. We'll assign roles: 7 locals and 7 visitors for the fictional city. (We have 14 participants.)

  - Materials: 
    - Customs sheet (handout) for the fictional city of "Portsmouth" (or another fictional name). 
    - A whiteboard or flip chart to record ideas.
    - Optional: Some props for the stake (e.g., tokens for points, or a small prize).

  - Introduction: Without lecturing, we can introduce the customs sheet by saying that they are going to simulate being in the city of Portsmouth and that they will be assigned roles as locals or visitors. We then hand out the customs sheet and give them a moment to read it.

  - Timeline (90 minutes total):

    0-5 min: Introduction and role assignment. 
      - Explain that they are in a fictional city, and assign roles (7 locals, 7 visitors). 
      - Hand out the customs sheet and ask them to read it. 

    5-15 min: Understanding the customs. 
      - In pairs (one local and one visitor) discuss the customs: What do they mean? How would they play out? 
      - Then, briefly share with the whole group to clarify any questions. (But avoid giving answers; let them interpret.)

    15-40 min: Opt-out analysis for each custom. 
      - Divide into three groups (about 4-5 per group). Each group takes one custom and answers:
          a) How can a single person visibly opt out? What would they do? What would it cost (socially)? How would it be read (insult, imposition, difference)?
          b) What if everyone opted out? How would that change the dynamic?
      - Each group then reports back (5 min per group).

    40-55 min: Real-stake activity. 
      - We choose one custom to enact with a real stake. The tram boarding custom is the most actionable. 
      - Set up: We have a "tram stop" in the room. We form a "queue" without a physical line, using the described method (eye contact, half-step, nod). 
      - We do two rounds:
          Round 1: Locals and visitors board as per custom. The stake: The order in which they board will determine the order for a small reward (e.g., choosing a piece of candy, or extra points for a game). We do this once normally.
          Round 2: We ask one volunteer (a visitor) to deliberately break the custom (e.g., board out of turn). Then observe the reactions. Then, we ask a local to break the custom. Then, we might have everyone break it (if time allows, but we don't have to do all). 
      - After, discuss briefly: What happened? How did it feel? How was the breaker perceived?

    55-70 min: Shift in majority. 
      - Now, we change the numbers: We reassign so that visitors become the majority (e.g., 10 visitors and 4 locals). 
      - Then, we choose one custom (say, the jaywalking custom) and ask: Do the locals still have a claim on the visitors to follow the custom? Why or why not? 
      - They discuss in small groups (mixed) and then report.

    70-90 min: Debrief. 
      - Map the activity to the three claims:
          Claim 1: Legible opt-out. Refer to the opt-out analysis: In the tram custom, what would a legible opt-out look like? (Maybe announcing, "I'm new, I don't know the order, so I'll just follow you.") But without that, it's illegible and seen as rude. Compare with tipping: If a visitor leaves a tip and explains, "In my country we tip to show appreciation," it might be read as difference rather than insult. But if they just do it without explanation, it's illegible. 
          Claim 2: Visitor's obligation due to illegibility. In the tram activity, when the visitor broke the custom, the locals' reactions were of annoyance because they couldn't read the intention. The visitor felt pressure to conform to avoid being seen as rude, even though the custom itself wasn't inherently better. 
          Claim 3: Locals' entitlement as about predictability. In the majority shift, when visitors are the majority, the locals might still want their custom followed to maintain predictability and mutual understanding, even if they are outnumbered. The debrief should point to moments in the activity (e.g., during the tram boarding, the locals' reactions when someone broke the custom) to show that the reaction was about confusion and disrupted expectations, not harm.

      - What the activity genuinely shows: 
          - The social dynamics of conformity and the importance of legibility in social norms. 
          - How the same action can be interpreted differently based on the actor's perceived group (local vs. visitor) and the context (majority/minority). 
          - The difference between habitual and obligatory norms is not in the norm itself but in the social enforcement and the possibility of legible deviation.

      - What it merely dramatizes: 
          - The activity uses fictional customs, so it doesn't show real harm or long-term social consequences. It only simulates the immediate reactions. 
          - The stakes are low and temporary, so the emotional weight is not as heavy as in real life.

    - What cannot be reproduced and must be supplied: 
          - The activity cannot reproduce the deep internalization of norms that comes from years of living in a culture. The participants are only role-playing for a short time. 
          - The activity may not capture the full emotional weight of being a visitor in a foreign culture, especially if the participants are from similar cultural backgrounds. The instructor must help them reflect on real experiences they have had.

  - Predictable problems and solutions:

    1. Participants are too polite to break the customs.
       - Solution: The instructor can assign a participant to be a "rebel" in the real-stake activity (Round 2 of tram boarding) and give them explicit permission to break the custom. Alternatively, the instructor can break the custom themselves to model it.

    2. Visiting students defer to the locals and don't challenge.
       - Solution: In the majority shift phase, explicitly ask the visitors (now majority) to consider whether they want to change the custom. Also, in the opt-out analysis, the groups should have both locals and visitors so that visitors are encouraged to think from their perspective.

    3. The discussion becomes too abstract.
       - Solution: Keep bringing them back to the specific moments in the activity. Use the whiteboard to note down observations during the activity for later reference.

    4. Time management: 90 minutes is tight.
       - Solution: Stick strictly to the timeline. Cut short the reporting if needed. The real-stake activity should be quick (15 min).

  - Stake scheme: Use a point system. In the tram boarding, the order of boarding determines the order of choosing from a set of rewards (e.g., different types of candy, or small stationery items). Alternatively, assign points for participation that can be redeemed at the end for a small prize (like a chocolate bar). The points are given for participating in the activity, not for following the custom. But in the tram boarding, the order might give a better choice.

  - Custom addition: We have three, but let's add one more if we have time? The instructions say at most one more and preferably not. We'll stick with three unless we see a need. The three are sufficient.

  Let's write the customs sheet:

  **Customs of Portsmouth**

  1. **Cafés and Tipping**: In Portsmouth, a service charge is always included in the price of food and drinks. Leaving extra money on the table is not expected and is interpreted in one of two ways: either as a comment that the server's wages are too low (and thus an insult to the establishment) or as a bribe for better service on a future visit (which is seen as unfair). Therefore, locals never leave a tip.

  2. **Tram Boarding**: At tram stops, there is no physical line. Instead, the order of boarding is maintained by a system of non-verbal cues. When a tram arrives, locals establish the queue order by making eye contact with others who were there before them, taking a half-step forward when it is their turn, and giving a small nod to the person who should board before them. This system is well understood by locals but often invisible to visitors. When visitors make mistakes (such as boarding without waiting their turn), locals interpret this as rudeness, not ignorance.

  3. **Crossing the Street**: In Portsmouth, it is common and unremarkable to cross the street against the pedestrian signal when there is no traffic, and locals do this without interrupting their conversations. However, there is one exception: if a small child is waiting at the curb for the signal to change, no one crosses against the signal until the child has crossed or until the signal changes. This is seen as setting a good example for children.

  We'll not add a fourth.

  Now, the detailed timeline:

  0-5 min: 
    - Welcome and role assignment: "We are going to do an activity set in the fictional city of Portsmouth. I will assign half of you as locals of Portsmouth and half as visitors. Locals, you have lived here all your lives and know the customs well. Visitors, you are new to the city and may be unfamiliar with the customs." Assign roles arbitrarily (or if we want to use the real city/visitor status, we can, but note that the customs are fictional so it might be better to assign randomly to avoid real-world associations). Hand out the customs sheet. "Please read this sheet silently for two minutes."

  5-15 min: 
    - Pair up: One local and one visitor per pair. "In your pairs, discuss the customs: What do they mean? How would you, as a local, explain them to a visitor? And as a visitor, what questions would you have?" (5 min) 
    - Then, bring the group together and ask: "What questions came up?" Clarify only if there is confusion, but don't give answers. (5 min)

  15-40 min: 
    - Split into three groups (each group has both locals and visitors). Assign each group one custom. 
    - Task: "For your assigned custom, answer two questions: 
          a) If one person wanted to visibly opt out of the custom, how could they do it? What would be the cost? How would others interpret it (insult, imposition, or just difference)? 
          b) What if everyone in the city opted out? How would that change the situation?" 
      (15 min for group work, then 10 min for reporting: about 3 min per group)

  40-55 min: Real-stake activity (tram boarding)
    - Set up: Clear a space. Designate a "tram" (a row of chairs or just a line on the floor). 
    - Explain: "We are at a tram stop. The order in which you board will determine your choice of reward at the end. There are [number] rewards, and the first to board gets first choice." (The rewards can be small items like different colored pens, different candies, etc.)
    - Round 1: Have the group form the queue using the Portsmouth custom. They should use eye contact, half-step, and nod. Then board and note the order. (Do not distribute rewards until after the activity, just record the order.)
    - Round 2: 
          - Ask for a volunteer (a visitor) to break the custom. They might board out of turn. Then run the boarding again and observe reactions. 
          - Then, ask a local to break the custom. Run again. 
          - (Optional) If time, ask everyone to break the custom (e.g., form a physical line). 
    - After, ask: "What happened? How did you feel when the custom was broken? How did you perceive the person who broke it?" (5 min discussion)

  55-70 min: Majority shift
    - Reassign: Now, 10 visitors and 4 locals (by asking 3 locals to become visitors). 
    - Question: "In this new situation, where visitors are the majority, do the locals still have a claim on the visitors to follow the jaywalking custom? Why or why not?" 
    - Form small groups (mixed) to discuss for 5 min. Then, each group reports (2 min per group). (Total 15 min)

  70-90 min: Debrief
    - Guide the discussion by referring to the activity:
      - For Claim 1: "In the tram custom, what would have made the opt-out by the visitor legible? How did the lack of legibility lead to it being seen as rude? How was that different from when a local broke the custom?" (Link to group's opt-out analysis.)
      - For Claim 2: "When the visitor broke the custom, what did they feel? Was the pressure to conform due to the custom itself or because they didn't want to be seen as rude? How did the locals' reactions show that the visitor's actions were illegible?"
      - For Claim 3: "When the locals were the minority, what reasons did they give for wanting the custom followed? Was it about harm or about being able to predict behavior and understand each other? Remember the jaywalking custom: what harm would there be if visitors crossed when a child is waiting? Or is it about the child's understanding of social norms?"
    - Summarize what the activity shows: The social construction of norms and the role of legibility and majority/minority dynamics.
    - End by connecting to real life: "How does this relate to your experiences in the actual city where we are?"

  This should fit within 90 minutes if managed strictly.

  What cannot be reproduced: The deep-seated nature of real customs and the emotional weight of being an outsider in a real foreign culture. The activity is a simulation and may feel artificial. The instructor must help participants draw on their own experiences to fill that gap.

  Materials: 
    - Customs sheet (one per participant)
    - Whiteboard or flip chart for recording
    - Rewards for the tram boarding (e.g., a variety of small candies or trinkets)

  Now, let's write the customs sheet as a handout.
answer: |-
  ### Session Design: "Customs and Claims"  
  **Core Idea:** Participants experience how customs shift from habitual to obligatory based on **legible opt-out**, how **illegibility drives visitor conformity**, and how local "entitlement" is rooted in **predictability**, not harm.  

  ---

  ### **Roles & Rules**  
  - **Roles:**  
    - **Locals (7):** Born and raised in fictional "Portsmouth." Understand all customs intuitively.  
    - **Visitors (7):** New to Portsmouth for a 2-week programme. Know customs only from the handout.  
  - **Rules:**  
    - No explicit instruction on *why* customs matter.  
    - Participants must interact physically during activities (e.g., tram boarding).  
    - "Opting out" means visibly deviating from a custom in a way others notice.  

  ---

  ### **Materials**  
  1. **Customs Sheet (Handout):**  
     - **Title:** *Portsmouth: A Guide for Newcomers*  
     - **Text:**  
       > **1. Tipping:** Service charge is always included. Leaving extra cash is read as either pity (implying underpaid staff) or bribery (for special treatment). Locals *never* tip.  
       > **2. Tram Boarding:** No physical line. Order is tracked by eye contact, a half-step forward, and a nod. Visitors’ mistakes are seen as deliberate rudeness.  
       > **3. Crossing Signals:** Crossing against the signal is normal, *except* when a child waits at the curb. Locals never cross in this case, to avoid confusing children.  
     - **Delivery:** Hand it out during intro: *"Here’s a guide from Portsmouth’s tourism board. Skim it—you’ll need it to navigate the city."*  

  2. **Stake Materials:**  
     - **"Priority Tokens":** 14 unique tokens (e.g., numbered cards). Holding a token grants early access to breaks, extra Q&A time, or choosing discussion topics later.  

  3. **Other:**  
     - Whiteboard (for recording observations).  
     - Timer.  

  ---

  ### **Timeline (90 Minutes)**  
  #### **0–10 min: Setup & Immersion**  
  - Assign roles (7 locals, 7 visitors).  
  - Hand out customs sheet: *"Portsmouth has unique norms. As locals/visitors, act accordingly."*  
  - Pair locals/visitors: *"Discuss one custom you find intriguing. Visitors, ask locals: ‘How would I mess this up?’"*  

  #### **10–30 min: Opt-Out Analysis (Small Groups)**  
  - **Groups:** 3 groups (4–5 people each), mixed roles. Each group takes one custom.  
  - **Task:**  
    - *Step 1:* Brainstorm **one person visibly opting out.**  
      - *E.g., Tipping: A visitor leaves coins "for luck." Cost: Server frowns, locals gossip. Read as: Ignorance (if legible) or insult (if illegible).*  
    - *Step 2:* Brainstorm **everyone opting out.**  
      - *E.g., Tram boarding: All form a physical line. Result: Efficiency? Or chaos if no one knows "line rules"?*  
  - **Output:** Groups write answers on whiteboard.  

  #### **30–50 min: Real-Stake Activity (Tram Boarding)**  
  - **Stake:** Priority tokens determine who picks snacks first during break.  
  - **Setup:** Designate "tram" (e.g., a row of chairs).  
  - **Rounds:**  
    1. **Baseline:** Locals/visitors board using Portsmouth custom. Record boarding order → token order.  
    2. **Opt-Out:**  
       - *Visitor volunteers to break custom:* Boards out of turn (e.g., no eye contact, pushes ahead). Group reacts.  
       - *Local volunteers to break custom:* Same action. Group reacts.  
  - **Debrief Qs:** *"What did you assume about the rule-breaker? Was it easier when a local vs. visitor broke it?"*  

  #### **50–60 min: Majority Shift**  
  - **Shift:** Reassign 4 locals → visitors. Now: 11 visitors, 3 locals.  
  - **Task:** Discuss: *"Visitors dominate Portsmouth. Do locals still have a claim to enforce the child-curb crossing custom? Why?"*  
  - **Output:** Groups argue "yes/no" → share key points.  

  #### **60–80 min: Debrief (Mapping to Claims)**  
  - **Claim 1: Legible Opt-Out**  
    - *Map:* "When the visitor broke tram custom, you saw them as rude—**not** because tram order is sacred, but because you couldn’t ‘read’ their refusal. In the analysis, you noted tipping could be legible if a visitor said, ‘In my country, this means appreciation.’"  
  - **Claim 2: Visitor Conformity from Illegibility**  
    - *Map:* "In the stake activity, the visitor who broke the custom later told me they felt guilty. Not because tramboarding is moral, but because your stares made them feel **illegible**. The sheet said visitors’ mistakes are read as rudeness—that’s the pressure."  
  - **Claim 3: Locals’ "Entitlement" = Predictability**  
    - *Map:* "When visitors became the majority, locals argued, ‘You must follow the child-curb rule, or kids won’t learn norms.’ That’s **not harm** (no one gets hurt), but a claim about **predictability**: ‘We need shared signals to trust each other.’"  
  - **What It Genuinely Shows:**  
    - Social norms rely on *mutual interpretability*, not inherent "rightness."  
    - Visitors’ conformity is a response to exclusion, not custom value.  
  - **What It Dramatizes (Without Real Harm):**  
    - Real-world power imbalances (e.g., colonialism, immigration).  
    - Long-term stigma for "illegible" outsiders.  

  #### **80–90 min: Reflection & Close**  
  - *"Share one moment where you felt the tension between ‘habit’ vs. ‘obligation.’"*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Too Polite to Break Customs**  
     - *Risk:* Stake activity lacks tension.  
     - **Solution:** Assign "rebel" roles secretly. Pre-brief 2 visitors/locals: *"Your job is to break tram custom—I’ll back you."* If still passive, *you* break it as a "visitor."  

  2. **Problem: Visitors Defer to Locals**  
     - *Risk:* Majority shift discussion becomes one-sided.  
     - **Solution:** Flip roles: *"Visitors, argue why locals should adapt to YOU now."* If silent, reframe: *"Portsmouth’s economy relies on tourists. What if visitors boycott customs?"*  

  3. **Problem: Superficial Analysis**  
     - *Risk:* Groups miss illegibility/predictability nuances.  
     - **Solution:** Inject probing Qs: *"If a local tips ‘as protest,’ is it read differently than a visitor? Why?"*  

  4. **Problem: Time Crunch**  
     - *Risk:* Debrief rushed.  
     - **Solution:** Cap opt-out analysis at 15 min; skip "everyone opts out" if needed.  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **The Emotional Weight of Real Exclusion:**  
    - Participants know this is fiction. They won’t feel the visceral fear/shame of real illegibility (e.g., immigrants facing xenophobia).  
    - **How You Supply It:** Share a real example post-activity: *"Think of a time you were ‘illegible’—like using slang abroad and being mocked. How did that *feel*?"* Tie to systemic issues (e.g., "This is why immigrants ‘over-conform’").  

  - **Long-Term Social Reinforcement:**  
    - The activity shows immediate reactions, not how customs harden over generations.  
    - **How You Supply It:** In debrief, ask: *"What if Portsmouth’s customs were enforced by law? Or taught in schools? How would that change the ‘opt-out’ cost?"*  

  --- 

  **Final Tip:** Start with a visceral hook: *"Raise your hand if you’ve ever been called ‘rude’ for not knowing a local rule. Today, we dissect why that stings."* This grounds the fiction in lived experience.
