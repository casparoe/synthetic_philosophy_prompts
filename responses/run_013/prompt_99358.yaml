prompt: |-
  I have been arguing with a friend about whether information can be bad for you. She is a decision theorist and keeps invoking a result she calls Good's theorem: for an agent who maximises expected utility and updates her beliefs by conditionalisation, the expected value of receiving information cannot be negative, so a rational agent should never pay to avoid a free look at the evidence, and should not regret having looked. I accept the theorem in the abstract, but my verdicts on cases keep pulling away from it, and I want to know what principle actually captures them. Here are the cases and my gut verdicts. (1) A sealed envelope contains the exact date and manner of my death; I would pay a small amount not to open it, even though knowing could not change anything I do. (2) A medical test would tell me whether I have an untreatable condition whose course I could prepare for; I would pay to know, even though the only actions it changes are practical arrangements I could make blind. (3) I have recorded a match and avoided the score; I would pay a small amount to keep from being told, and I think the person who blurts it out has done me a minor harm. (4) I would pay to know whether a close friend secretly despises me, even if I would not confront them or change my behaviour. (5) I would pay not to know whether my partner once had a fleeting unkind thought about my work, even though it would not change how I act. (6) If a reliable oracle offered to tell me the exact number of atoms in my body at this moment, I would not pay a penny either way; it seems to me to have no value at all, though the theorem says it cannot be negative. (7) If the oracle offered to tell me whether a stranger I will never meet has a benign or malignant tumour, I would rather not know, and I do not think that is irrational. (8) But if the oracle offered to tell me whether the same stranger will be in pain tomorrow, and I could send anonymous aid, I would pay to know, and I would pay more than for the date of my own death.

  What principle, or small set of principles, best captures these verdicts? I am tempted by this: information has positive value when it either changes what you can do or is itself part of what you care about, and negative value when it causes suffering you cannot use. But that seems to make (1) and (4) both non-action-guiding and yet opposite, and (5) and (7) non-action-guiding and negative, while (4) is non-action-guiding and positive. Perhaps the distinction is between information that is constitutive of a good you already have and information that is merely descriptive of a world you cannot affect, but I cannot make that precise. Please state the principle precisely, giving the case that motivates each clause; say what it predicts for cases I have not listed—information that is bad news but lets you savour the time remaining, information that is good news but spoils a surprise, information about a past event you cannot change, information that is intrinsically trivial but completes a theory you care about; and tell me honestly which of my verdicts the principle cannot accommodate. I am especially interested in whether Good's theorem survives as a special case, and if so under what restriction—say, that utility is defined only over actions and consequences, not over the state of being informed. If the theorem must be given up, say which verdict I should abandon and why. Please answer in British English.
reasoning: |-
  Okay, the user is grappling with the tension between Good's theorem in decision theory and their intuitive judgments about the value of information in various real-life scenarios. They've presented eight detailed cases where their gut reactions conflict with the theorem's prediction that information should never have negative expected value. 

  Hmm, this is a sophisticated philosophical puzzle. The user clearly understands the theorem but feels it doesn't capture human experience. Their cases cover death knowledge, medical tests, spoilers, relationships, and altruism - quite a range! The depth of their examples suggests they've thought hard about this. 

  I notice they're particularly troubled by cases (1) and (4) where information doesn't change actions yet has opposite valence - wanting to avoid death knowledge but seeking truth about friendship. Their proposed "constitutive good" distinction is insightful but fuzzy. The medical test case (2) is interesting too - they value actionable information even when actions are merely "practical arrangements". 

  The spoiler case (3) reveals how information can destroy experiential goods like suspense. Case (5) about fleeting unkind thoughts shows we sometimes protect relationships through ignorance. The atom count (6) is clever - truly neutral information. The altruism cases (7 vs 8) beautifully demonstrate how value depends on ability to help. 

  Their struggle reminds me of the literature on "information as experience" rather than just instrumental value. The key seems to be that for humans, information isn't just input for decisions - it reshapes our lived experience directly. 

  *scratches head* How to systematize this... The "anticipatory disutility" concept might help - some knowledge forces painful thoughts we can't unthink. Whereas not knowing preserves mental peace. But then why seek painful truths? Ah - because sometimes truth itself is relationship-constitutive, like in friendship (case 4). 

  The altruism cases suggest another dimension: information's value depends on our sphere of concern. We care more about helping than about unactionable facts. The tumour case (7) is depressing knowledge; the pain case (8) is empowering. 

  *steeples fingers* For a precise principle: information has direct utility when it affects (a) anticipatory states (b) relationship goods (c) self-conception. Its instrumental value depends on (d) expanded action sets (e) ability to prepare. Negative when (a) or (b) outweigh (d) or (e). 

  This explains case 1 (anticipatory dread > preparation value), case 4 (truth as constitutive good), case 7 (dread without empowerment) vs case 8 (empowerment). The atom count (6) fails all criteria. 

  *winces* But Good's theorem survives only if we exclude experiential utility - which feels artificial. Perhaps we should bite the bullet: rational agents with full experiential utilities can reasonably avoid information. The user might need to accept that case (4)'s "truth for truth's sake" is an experiential good. 

  *checks watch* Better include those test cases they requested: 
  - Bad news with time to savour: positive if cherish time outweighs dread 
  - Good news spoiling surprise: negative if surprise was valuable 
  - Past unchangeable events: neutral unless affects self-narrative 
  - Trivial completing theory: positive as cognitive good 

  *shrugs* Their verdict on case (5) (unkind thoughts) is hardest - why avoid harmless knowledge? Perhaps we protect relational illusions. That might be irrational by strict standards, but human. 

  Final note: British English as requested. Must remember "whilst", "penny", "bloke" etc. Right then - time to lay this out clearly with case mappings and that honest bit about where the principle strains.
answer: |-
  Your cases reveal a profound tension between Good's theorem's formal elegance and human experiential values. The theorem holds *if* we accept its restrictive axioms: expected utility maximisation, Bayesian updating, and crucially, **utility defined solely over world-states and actions**. Your intuitions rebel because, as your cases show, *the state of being informed itself carries intrinsic utility or disutility*. Below is a principled framework capturing your verdicts, with motivations, predictions, and limitations.

  ---

  ### **The Principle: Dual-Aspect Value of Information (DAVI)**
  Information has value from two distinct aspects:
  1. **Instrumental Value (IV)**: Arises when information enables *actionable control* (changing decisions to improve outcomes).  
     *Motivated by:* Case (2) (medical test enabling preparation), Case (8) (knowing pain to send aid).  
  2. **Experiential Value (EV)**: Arises when information directly alters *subjective experience* (e.g., anticipation, meaning, or psychological states), independent of action. This can be:  
     - *Positive*: When truth itself is constitutive of valued states (e.g., trust, closure).  
       *Motivated by:* Case (4) (knowing a friend’s true feelings).  
     - *Negative*: When knowledge inflicts inescapable psychological harm (e.g., dread, spoiled joy).  
       *Motivated by:* Cases (1) (death date), (3) (spoiler), (5) (unkind thought), (7) (untreatable tumour).  
     - *Neutral*: When information lacks experiential salience.  
       *Motivated by:* Case (6) (atom count).  

  **Net Value (NV) = IV + EV**  
  Rational aversion/seeking occurs when |EV| > |IV|, and NV is negative/positive.  
  Good’s theorem holds **only under the restriction that utility ignores experiential states** (i.e., EV ≡ 0).

  ---

  ### **Predictions for New Cases**
  | Case                                  | Prediction & Reasoning                                                                 |
  |---------------------------------------|----------------------------------------------------------------------------------------|
  | **Bad news with time to savour**<br>(e.g., terminal diagnosis with years left) | *Positive NV if IV (preparation) + positive EV (savouring) > negative EV (dread).* Rational to seek if net gain. |
  | **Good news spoiling a surprise**<br>(e.g., learning a gift early)             | *Negative NV:* Strong negative EV (ruined anticipation) outweighs near-zero IV. Rational to avoid. |
  | **Past unchangeable event**<br>(e.g., historical fact about ancestors)         | *Depends on EV:* Neutral if trivial (e.g., "Great-aunt wore blue"); negative if traumatic; positive if meaning-enhancing. |
  | **Trivial information completing a theory**<br>(e.g., final digit of π) | *Positive NV:* High positive EV (aesthetic/cognitive closure) despite zero IV. Pay to know. |

  ---

  ### **Accommodating Your Verdicts**
  | Case | Your Verdict | DAVI Fit |
  |------|--------------|----------|
  | (1) Death date | Pay to avoid | ✓ NV negative: EV⁻ (existential dread) >> IV (no actionable control). |
  | (2) Untreatable condition | Pay to know | ✓ NV positive: IV (practical prep) > EV (likely slight EV⁻). |
  | (3) Spoiler | Pay to avoid | ✓ NV negative: EV⁻ (ruined suspense) >> IV (none). |
  | (4) Friend’s contempt | Pay to know | ✓ NV positive: EV⁺ (truth as constitutive of relationship) >> IV (no action planned). |
  | (5) Partner’s unkind thought | Pay to avoid | ✓ NV negative: EV⁻ (pointless relational anxiety) >> IV (none). |
  | (6) Atom count | Indifferent | ✓ NV neutral: EV ≈ 0, IV = 0. |
  | (7) Stranger’s tumour | Avoid | ✓ NV negative: EV⁻ (helpless distress) >> IV (no actionable control). |
  | (8) Stranger’s pain + aid option | Pay to know | ✓ NV positive: IV (enable aid) > EV⁻ (distress). |

  **All verdicts accommodated** except one tension:  
  - Case (4) (*wanting* non-actionable truth) and Case (5) (*avoiding* non-actionable truth) seem contradictory. DAVI resolves this via **constitutive vs. corrosive truth**:  
    - In (4), truth is *constitutive of the friendship good* (you value "true mutual respect" inherently).  
    - In (5), truth is *corrosive to the relationship good* (a fleeting thought lacks meaning; knowing it poisons trust).  

  ---

  ### **Where Good’s Theorem Stands**
  - **Survives as a special case** when utility *excludes experiential states*. If utility depends only on actions and world-states (e.g., a robot optimising material outcomes), EV ≡ 0, so NV = IV ≥ 0.  
  - **Breaks down** when utility includes *being in a state of knowledge*. Humans intrinsically value ignorance (e.g., bliss), truth (e.g., authenticity), or suspense (e.g., narrative joy).  

  ### **Honest Tension: Should You Abandon a Verdict?**
  **Case (5) is the weakest.** Why pay to avoid a *fleeting, past* unkind thought? If it truly wouldn’t change actions *or* your self-concept, EV⁻ seems irrational. Possible fixes:  
  - Admit it’s a bias: Humans over-weight negative information (negativity dominance).  
  - Refine EV: Knowledge might corrode "baseline trust," a constitutive good. But this risks ad hoc justification.  
  **Recommendation:** Hold your verdicts—they reveal legitimate dimensions of value. Good’s theorem is descriptively inadequate for human psychology.

  ---

  ### **Core Insight**
  Information is not merely a tool for optimisation. It is *experientially potent*: it can nourish or poison the mind, define relationships, and alter the texture of existence—independent of action. **DAVI** captures this by treating knowledge as both an instrument *and* an experience. While Good’s theorem governs rational action, DAVI governs *rational lived experience*. The conflict arises because rationality is contextually defined: what is instrumentally rational may be experientially irrational. Your cases prove that for humans, the latter often matters more.
