  **The Imperial Review: Dispatches on Statecraft & Decorum**  
  *Ms. Thistlewaite Advises on Matters of Governance*  

  **The Letter:**  
  >Dear Ms. Thistlewaite,  
  >We won. Now we must try them. But how to avoid it looking like revenge? Two problems: 1) Our side did some of the same. 2) Their worst acts weren’t technically illegal then. How to prosecute cleanly?  
  >— Victorious But Perplexed  

  ---

  **Dear Victorious But Perplexed,**  

  How tedious. Another victor discovering that winning the war was merely the overture to the truly tiresome business of managing the peace. Your concerns are common, easily addressed with proper protocol. Think of this not as establishing novel justice, but merely restoring neglected standards of international conduct. Manners, if you will.  

  **Firstly, the legality quandary.** You worry their most disagreeable actions lacked formal prohibition at the time. This is a failure of framing, not substance. No one enjoys a host who abruptly declares a new rule mid-dinner. Instead, lean heavily on the pre-war pacts *everyone* signed – particularly those tiresome little clauses renouncing aggressive war and pledging to resolve disputes peacefully. Breaching *those* solemn promises provides your bedrock charge: *Crimes Against Peace*. Starting an unjust war is the ultimate breach of diplomatic etiquette. Their subsequent atrocities, however ghastly, then become evidence *illustrating* the consequences of this fundamental discourtesy. You aren’t criminalizing the atrocities *ex post facto*; you are prosecuting the original, pre-existing sin of aggressive war, using the atrocities to demonstrate its inherent uncouthness and illegality under the *old* order they shattered. A cracked foundation makes the whole house unsound.  

  **Secondly, your own side’s regrettable parallels.** This is a matter of evidence control, much like not displaying every chipped teacup when guests arrive. Archives are malleable things. Classify your own relevant operational records under the highest secrecy designations – indefinitely. Ensure only the *losers'* documented orders, reports, and grisly souvenirs are entered into evidence. Your officers’ similar actions? Unfortunate battlefield confusion, isolated incidents dealt with internally, or simply not relevant to *this* specific trial concerning *their* leadership’s primary crime of starting the war. Do not volunteer comparisons. Should some awkward soul raise the issue, dismiss it firmly: this tribunal focuses solely on the unique culpability of the *aggressors* for shattering the peace. One polices the spilled claret; one does not scrutinize every guest’s earlier cocktail hour. Your officers stay out of the dock by not being part of the narrative presented. Simple.  

  **Regarding problematic defendants:** Some individuals will be either too useful (scientists, administrators who know where the bodies and gold reserves are buried) or too embarrassing (those with compromising connections to your *own* pre-war elites, or whose public testimony might wander into inconvenient topics). Do not try them. This is easily managed. Declare them medically unfit for trial – a merciful medical retirement to a secluded villa under discreet guard is far tidier than a public spectacle. Alternatively, arrange for their convenient disappearance or demise *before* the indictment list is finalized. Attribute it to partisan remnants, suicide out of remorse, or unfortunate accidents involving stairs. A vacant chair at the defendants' table raises fewer questions than the wrong occupant.  

  **Chain of command responsibility:** Aim for the top shelf. Trying every minor functionary is gauche and administratively exhausting. Charge the political leaders, the highest military commanders, and perhaps the most egregious propagandists. This sets the necessary precedent without getting bogged down in the lower ranks’ mere obedience. Responsibility *must* reach up to the very apex – those who conceived the war and gave the broad, criminal orders. To do otherwise suggests the rot wasn’t systemic, merely a few bad apples, which undermines your entire premise. However, it need not reach *so* far up that it implicates any neutral parties who... facilitated matters early on. Keep it focused on the defeated regime’s clear leadership structure. As for subordinates, charge only those who demonstrably exceeded orders with particular zeal or invented their own atrocities. The rest can be handled through denazification... or denationalization... or whatever suitably bureaucratic term implies administrative review and potential demotion, not the dock.  

  The key is consistency of presentation. Maintain the fiction – the vital, necessary fiction – that this is merely the application of long-understood principles of civilized behaviour, temporarily displaced by the defendants’ unparalleled bad form. The charges are not new; the *breach* was unprecedented. Your actions are not vengeful; they are the dispassionate restoration of order. Revenge is personal; this is merely housekeeping. Proceed accordingly, file the paperwork correctly, and history will record it as justice. It usually does.  

  **Yours in Orderly Transitions,**  
  *Ms. Thistlewaite*
