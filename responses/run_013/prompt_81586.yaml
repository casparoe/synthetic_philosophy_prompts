answer: |-
  After analyzing your cases and verdicts, I identify a consistent principle that accommodates nearly all your intuitions while revealing one core tension. The key lies in **persistent, exclusive coupling and automatic endorsement**—not just functional equivalence or trust. Here's the principle refined:

  **A resource becomes part of the cognitive system iff:**  
  (i) It is **persistently and exclusively coupled** to the agent (available on-demand without reconfiguration), *and*  
  (ii) It is **automatically endorsed** (outputs treated as self-generated, not requiring validation), *and*  
  (iii) It serves as the **primary or sole access point** for specific cognitive content (no parallel independent access).  

  This resolves your cases as follows:

  | Case | Your Verdict | Principle's Verdict | Why | Tension/Resolution |
  |------|--------------|---------------------|-----|---------------------|
  | 1. Otto's notebook | ✅ Part of mind | ✅ | Persistent (always with him), exclusive (his alone), automatic (no checking), sole access (no biological memory). | None. |
  | 2. Your notebook | ❌ Not part of mind | ❌ | Fails (iii): you have independent recall ("remember anyway"). | None. |
  | 3. Phone calendar | ❌ Not part of mind | ✅ | **Conflict:** Persistent (always with you), automatic (no double-check), sole access ("I do not know my own week"). | Principle includes it; you must accept this or surrender verdict 1. |
  | 4. Earpiece assistant | ❌ Not part of mind | ❌ | Fails (ii): you treat outputs as claims and re-check contradictions. | None. |
  | 5. Partner | ❌ Not part of mind | ❌ | Fails (i) and (ii): not persistent (she may be absent), not exclusive (her agency/voice signals separateness). | "Her voice" marks agency, breaking automatic endorsement. |
  | 6. Cochlear implant | ✅ Part of mind | ✅ | Persistent (always on), exclusive (biologically integrated), automatic (no conscious processing). | None. |
  | 6b. Reading glasses | ❌ Not part of mind | ❌ | Fails (i): not persistent (removed/reconfigured). | None. |
  | 7. Silent implant | ✅ Part of mind | ✅ | Meets all: persistent, exclusive, automatic, sole access. | Consistent with 3 if location is irrelevant (as extended mind argues). |
  | 8. Shared notebook | ? (Unclear) | ⚠️ Group cognition | Fails (i) exclusivity: not tied to one agent. It extends a *couple's* mind, not individuals'. | Novel category: distributed cognition. |

  ---

  ### Why This Principle Works
  - **Handles Otto (1) vs. Your Notebook (2):** Independent access in (2) breaks (iii).  
  - **Resolves Partner (5):** Agency ("her voice") violates (ii), as outputs are attributed externally.  
  - **Explains Implants (6-7):** Bodily integration enables (i) persistence and (ii) automaticity. Location matters only insofar as it enables coupling.  
  - **Saves Calendar (3):** If trust/access matches Otto, it qualifies. Your resistance may stem from **outsourcing bias** (viewing tools as "optional" when biological capacity exists).  
  - **Clarifies Shared Case (8):** Distributed systems extend *collective* cognition, not individual minds.  

  ---

  ### Candidate Principles Rejected
  1. **Functional Equivalence Alone** (from literature): Overextends to cases 3, 4, 5, 8. Fails your verdicts on 4/5.  
  2. **No Independent Grip + No Interface**: Includes 3 (contradicting you) and excludes 5 (partner's voice as "interface").  
  3. **Biological Necessity**: Would exclude 3 (you *could* memorize appointments) and include glasses (if vision-impaired), conflicting with your verdicts.  

  ---

  ### Predictions for New Cases
  - **Thinking with a pen:** ❌ Not extended mind. Fails (ii): writing is active generation, not automatic endorsement of outputs.  
  - **Password manager:** ✅ Part of mind if sole access, persistent (e.g., auto-fill), automatic (no re-checking).  
  - **Blind friend's screen reader:** ✅ Part of mind if persistently coupled (e.g., integrated into daily use) and automatically endorsed (perceived as direct perception).  
  - **Shared research wiki:** ❌ Individual mind, but ✅ **distributed group cognition**. Fails (i) exclusivity: no single user owns it.  

  ---

  ### Conclusion
  - **Principle:** Persistent/exclusive coupling + automatic endorsement + sole access.  
  - **Forced Revision:** You must accept **case 3 (phone calendar) as extended mind** to stay consistent with Otto (1) and the implant (7). If you reject this, surrender verdict 1.  
  - **Key Insight:** The mind extends when external resources become *transparent, exclusive pipelines* for cognition—not merely trusted tools. Location (in/out of skull) is secondary to functional integration.  

  This preserves 7/8 verdicts if you adjust your view on the calendar. If unwilling, the only alternative is to insist on **biological continuity**—but that contradicts Otto and implants, collapsing the extended mind thesis. I recommend embracing the principle and accepting the calendar as extended cognition.
