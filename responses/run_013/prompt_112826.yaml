  Hmm, they've given very specific parameters: no one says "illusion" aloud, 1500-2500 words, close third person POV, and a thematic tightrope walk between neither endorsing brutal honesty nor retreating into delusion. The emotional core seems to be their own resonance with du Châtelet—that raw post-divorce space where intellectual passion feels like the only stable ground. 

