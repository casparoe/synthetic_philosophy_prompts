  *muttering* And the ending... no tidy morals. Just her choosing to keep the flimsy, unverified idea of his respect because it fuels the work, while knowing the work would burn anyway if she stripped it bare. The "why" living in her trembling hands holding the page. 

  *deep breath* Title should whisper the theme..."The Load-Bearing Page." And no therapists appear, per user's snort about theirs. Just du Châtelet haunting the margins. 

