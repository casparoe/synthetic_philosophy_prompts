answer: |-
  ## Memorandum to Governing Council: Proposed Withdrawal of Truman Scholarship Honour

  **To:** Governing Council Members  
  **From:** [Your Name/Position]  
  **Date:** 23 October 2023  
  **Subject:** Recommendation Regarding President Truman Scholarship & Historical Honours Policy  

  This memorandum addresses the proposal to remove President Truman’s name from our largest scholarship, relocate his portrait, and issue an explanatory statement. It also considers the request for a historian’s report and necessary amendments to our draft policy on historical honours. After careful reflection, I recommend **rejecting the immediate removal of Truman's honour** but **amending our policy** and **commissioning a focused historian's report** within a defined timeframe to inform broader policy application.

  **I. The Moral Philosophical Argument (Steelmanned)**
  My colleague in moral philosophy presents a compelling critique of our draft policy’s core test. His argument, rooted in Elizabeth Anscombe’s protest, contends that our current standard – requiring conduct condemned as gravely wrong by a *substantial body of informed opinion at the time* – is fundamentally flawed. The flaw lies in prioritising *contemporary approval* over an objective moral analysis grounded in just war principles, specifically the Doctrine of Double Effect (DDE).

  His proposed alternative test is: *an honour may be withdrawn where the conduct can be defended only by treating the killing of non-combatants as a cost worth bearing for a greater good*. This, he argues, identifies the crucial moral failing: intentionally targeting non-combatants (civilians) as a means to an end. On this view:
  1.  Truman’s defence of the atomic bombings rests *entirely* on the calculation that civilian deaths (Hiroshima and Nagasaki) were a necessary cost to save more lives (by ending the war swiftly and avoiding invasion).
  2.  This constitutes *intending* the deaths of non-combatants as the means to achieve the "greater good" of peace/saved lives, violating the DDE's prohibition on intending evil (civilian deaths).
  3.  Contemporaneous approval (or lack of widespread condemnation) is irrelevant to this fundamental moral wrong. Anscombe’s objection was precisely that Oxford ignored this objective wrong in favour of contemporary sentiment and utilitarian calculation.

  This argument possesses significant rigour. It shifts the focus from shifting historical perceptions to a timeless principle: the absolute immunity of non-combatants from *intentional* attack. If accepted, it would provide a clear, principle-based reason for withdrawing Truman’s honour, irrespective of 1945 opinion.

  **II. Evaluating the Argument and its Implications**
  While powerful, applying this test consistently presents profound difficulties for our institution’s historical honours:
  1.  **Overbreadth:** As my colleague cheerfully acknowledged, this standard would likely require withdrawing honours from nearly every major statesman associated with any significant war effort since the doctrine's formal articulation. Strategic bombing in WWII (Churchill, Roosevelt), interventions involving civilian casualties, even defensive wars where non-combatant deaths were deemed "necessary costs," would all fall under scrutiny. Our honour roll would be drastically depopulated, transforming it from a recognition of complex historical contribution to a purity test few could pass.
  2.  **Historical Complexity:** The DDE is a tool for *moral analysis*, not a straightforward historical descriptor. Applying it definitively to complex historical decisions, often made under immense pressure with imperfect information, requires nuanced historical *and* philosophical judgement – precisely the kind our current policy seeks to temper by referencing contemporary judgement as a mitigating factor against presentism.
  3.  **Institutional Purpose:** College honours typically recognise multifaceted contributions within their historical context. While we must not honour egregious evils, a policy demanding absolute adherence to a specific, stringent moral doctrine applied retrospectively risks divorcing honours entirely from their historical grounding and our institution's own evolving story.

  Therefore, while the philosophical argument highlights a vital moral concern about the intentional targeting of civilians, adopting it *as the sole or primary test* for withdrawing honours is impractical and would fundamentally alter the nature and scope of our historical recognition. It mistakes a tool for deep moral critique for a practicable institutional policy.

  **III. The Historian’s Report**
  My colleague objects to commissioning a historian’s report, viewing it as a category error (moral vs. factual) and a delaying tactic. There is merit to the concern about delay and the fundamental moral point being distinct from *consequentialist justification*. **However, I recommend commissioning a tightly scoped report, with a strict deadline, for the following reasons:**
  1.  **Policy Refinement:** Our *existing* draft policy references context. Understanding the historical facts (e.g., the genuine projected invasion casualties, intelligence on Japanese surrender prospects, alternatives considered) is crucial for applying our *own* standard, even if it doesn't resolve the core moral objection for proponents of removal. Did Truman's actions represent the *only* perceived path, influencing how his choices were viewed contemporaneously?
  2.  **Future Cases:** This report will provide a template and precedent for how we handle future historical enquiries, demonstrating rigorous process.
  3.  **Informed Deliberation:** While the moral principle is central, the council’s decision on the *honour* benefits from understanding the full context in which Truman acted, even if it doesn't absolve him morally under the DDE critique.
  4.  **Procedural Necessity:** As the council will likely vote on the report proposal first, rejecting it entirely risks procedural confusion and denies the council potentially useful context for the subsequent honour vote under our *current* policy framework.

  **Recommendation:** Commission the report, but limit its scope strictly to:
  *   The known/projected casualty estimates for a mainland invasion (Allied and Japanese, military and civilian) available to Truman in July/August 1945.
  *   The state of intelligence regarding Japanese surrender intentions and diplomatic channels (including via the USSR) in July/August 1945.
  *   A brief summary of known alternatives to invasion or atomic bombing seriously considered by the US leadership at the time.
  **Timetable:** The report must be commissioned by **30 November 2023** and delivered by **31 January 2024**.

  **IV. Recommendations: Action & Policy Amendment**
  1.  **Truman Scholarship (Immediate Vote):** **Recommend AGAINST withdrawal at this time.** The case against Truman under our *draft* policy is not clear-cut. While the atomic bombings were controversial, there was not a *substantial body of informed contemporary opinion condemning them as gravely wrong*; significant support and belief in their necessity existed among military, political, and public spheres. Reasonable disagreement among well-informed contemporaries was profound. Under our existing draft, this weighs heavily against withdrawal. Deferring final decision until the historian's report is delivered is unnecessary for *this specific case* under our policy as the contemporary opinion criterion is sufficiently established.
  2.  **Policy Amendment:** Our draft policy needs refinement to better address concerns like the DDE critique without adopting its absolutism.
      *   **Proposed Amended Test (Final Clause):** "...and it adds that reasonable disagreement among well-informed contemporaries should weigh against withdrawal. **Notwithstanding the above, conduct involving a fundamental violation of the principle of non-combatant immunity, particularly where non-combatant deaths were intentionally pursued as a direct means to a strategic end, may constitute grounds for withdrawal even absent substantial contemporary condemnation, provided such a violation is clearly established.**"
      *   **Rationale:** This retains the crucial safeguard against presentism (contemporary opinion and disagreement) but explicitly acknowledges the unique gravity of *intentionally* targeting civilians as a core war crime, potentially overriding the contemporaneous opinion factor in the most egregious cases. It incorporates the DDE insight without mandating its application to all wartime figures universally.
  3.  **Timetable for Review:** Following receipt of the historian's report, initiate a formal review of *all* historical honours associated with significant military decisions in light of the **amended policy** by **30 June 2024**. This addresses the "slippery slope" fairly and systematically, rather than making Truman a unique target.

  **V. Conclusion**
  My colleague’s argument compellingly forces us to confront the moral gravity of intentionally targeting civilians. However, adopting his test wholesale is incompatible with maintaining a meaningful historical honours roll. Our amended policy better balances the need for moral accountability with historical context and institutional practicality. I recommend against removing Truman’s honour under our existing draft policy, commissioning the scoped historian’s report to inform future policy application and broader review, and adopting the amended policy wording to explicitly recognise the unique wrong of intentional attacks on non-combatants. This provides a principled, consistent, and manageable path forward.
