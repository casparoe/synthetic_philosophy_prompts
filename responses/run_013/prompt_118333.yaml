prompt: |-
  I teach a course on character and I keep bumping into a puzzle I don't have the vocabulary for, which is getting embarrassing. I'm in ethics, not metaphysics, so be gentle with me.

  Here's the pattern. I say someone is generous, or brave, or honest, and then the behaviour doesn't show up — and there turn out to be several very different ways for it not to show up:

  (a) The trait is gone exactly when the moment arrives. He's generous in every conversation about generosity, and the one time I actually needed money the generosity wasn't there — not overridden, just absent. He says he doesn't know what happened to him either.

  (b) The trait is intact and the moment arrives, but something outside stops it. He reaches for his wallet and the account is frozen. Ask a second earlier and he'd have given it to you.

  (c) The trait only shows up because the moment arrives. The crisis is what makes the team resilient; before it there was no resilience to speak of, and if the crisis had never come we'd never have called them resilient. And yet 'they'd have coped if it had come' still seems true.

  (d) The trait is intact, the moment arrives, and nothing is standing in the way — nobody's frozen anything, nothing interferes — but nothing happens, because something the trait needs just isn't there. A tree that would fruit in decent soil, sitting in bad soil. No blocker, the background is just wrong.

  I once sat in on a metaphysics reading group where someone used the word 'finkish' about a case like (a), I think, and never explained it, and when I asked a colleague he said 'oh yeah, finks and masks, that's a whole literature,' which was not helpfull, because he couldn't tell me which of my four cases is which, or whether (c) and (d) are anything at all rather than sloppy versions of (a) and (b).

  So: what are the established names, which of my cases do they actually fit, and what's left over? I don't want the labels so much as the joints — where you cut and why. And I especially want to know which of these cases makes real trouble for the reading my students and I keep sliding into, that 'disposed to X' just means 'would X if the trigger came', because if one of my cases shows that reading is wrong I want to be able to say which one and how. If (c) or (d) has no name of its own, coin one, define it, and tell me what it rules out.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach a character course and are struggling with how traits manifest—or don't—in specific scenarios. They've outlined four cases (a-d) where expected behavior fails to appear for different reasons. Their main request is for terminology to classify these cases and understand which challenges the dispositional statement "disposed to X means would X if triggered."

  First, I recall dispositional metaphysics concepts like finks, masks, mimics, and antidotes. The user mentioned encountering "finkish" in a reading group, so that's likely relevant to case (a). Let me match each case to these concepts.

  Case (a): The trait disappears when needed. The person is generous until the moment to act arrives, then the generosity vanishes without override. This sounds like a finkish disposition—where the disposition itself is lost when the triggering condition occurs. The example given aligns with Martin's finkish cases where a wire loses its fragility when struck.

  Case (b): External factors block the trait. The person intends to act (reaches for the wallet) but is prevented by an external event (account frozen). This resembles masking—an external factor interferes without changing the underlying disposition. The disposition is intact but prevented from manifesting.

  Case (c): The trait emerges only due to the situation. Resilience appears during a crisis but wasn't present before. This is tricky. It's not a standard disposition failure but rather a situational manifestation. The user mentions "they'd have coped if it had come," implying a potentiality. This seems like what I'd call a "mimic"—the situation creates the appearance of a disposition that wasn't there beforehand. But maybe it's better framed as an extrinsic disposition, dependent on context. 

  Case (d): The trait exists but lacks necessary background conditions. Like a tree that could bear fruit in good soil but is in bad soil. No blocker, just missing enabling factors. This is an antidote—the absence of necessary conditions prevents manifestation, even if the disposition is present. Bird's antidotes fit here.

  The user's deeper need is to challenge the simple conditional analysis (SCA) of dispositions. They want to know which case most effectively refutes "disposed to X iff would X if triggered." Case (a) with finks is the strongest counterexample because the disposition vanishes upon triggering, making the conditional false despite the disposition existing. Cases (b) and (d) involve masks and antidotes, which also challenge SCA by showing external factors or missing enablers disrupt the outcome. Case (c) is more about the definition of the disposition itself—whether it's intrinsic or context-dependent.

  The user might also be interested in practical implications for teaching character. If traits can be finkish or masked, it complicates assessing character based on behavior. They likely want to convey that character isn't just about consistent behavior but involves underlying stable dispositions that can be interfered with. Highlighting these nuances can help students understand why people act out of character sometimes.

  I should ensure the explanations are accessible since the user is from ethics, not metaphysics. Avoiding jargon where possible, but providing necessary terms with clear examples. Emphasizing how each case maps to existing literature and their implications for dispositional analysis will address their core questions. Also, clarifying that case (c) might not have a direct term but can be understood as extrinsic dispositions or mimics.
answer: |-
  You've hit on a beautifully deep puzzle in dispositional metaphysics – the exact territory of "finks and masks" (and more!). Your cases are distinct and map neatly to established concepts. Let's break down each one, name it, and see how it challenges the simple conditional analysis (SCA: "disposed to X" = "would X if triggered").

  ### The Core Challenge: The Simple Conditional Analysis (SCA) is Flawed
  Your intuition is correct: **Case (a) is the most direct and powerful refutation of SCA**. The others also pose problems, but (a) is the "killer app" in the literature. The core insight from dispositions (like fragility or solubility) applied to character traits is that **a disposition is a *property* of an object/person *now*, not just a prediction about its future behavior.** SCA tries to reduce the property to the prediction. Your cases show why this reduction fails.

  ### Mapping Your Cases to the Metaphysics Toolbox

  1.  **Case (a): The Vanishing Trait (Generosity absent when needed)**
      *   **Name: Finkish Disposition** (coined by C.B. Martin).
      *   **The Joint:** The disposition itself is *removed or altered* precisely when the triggering condition occurs. The triggering condition *causes* the loss of the disposition.
      *   **Why it fits:** The person *was* generous (had the disposition). The moment of need (the trigger) arrives. This very trigger *causes* the generosity disposition to vanish (or be "finked out"). He doesn't override it; it simply ceases to exist *because* the trigger happened. He genuinely doesn't know why – the change is sub-intentional.
      *   **How it challenges SCA:** SCA says: "If he *is* generous (disposed to give), then *if* a need arises, he *would* give." In this case, *before* the need, he *is* generous. The need *does* arise. But he *does not* give. The conditional ("if need, then give") is **false** at the moment of need. Yet, *before* the need arose, he genuinely *was* disposed to give (as evidenced by his consistent attitude, past behavior in non-critical moments, etc.). Therefore, "being disposed to give" **cannot be identical to** "would give if the need arose". The SCA is false.
      *   **Your Example Perfectly Illustrates This:** The disposition vanishes *because* the trigger (the actual urgent need) occurs.

  2.  **Case (b): The Blocked Trait (Wallet frozen)**
      *   **Name: Masking** (also widely discussed, often alongside finks).
      *   **The Joint:** The disposition is **intact** and *would* manifest *if nothing interfered*. An **external factor** actively *prevents* the manifestation *without* changing the underlying disposition.
      *   **Why it fits:** The generosity disposition is fully present. The trigger (your need) occurs. He *starts* to manifest it (reaches for wallet). An *external* event (account freeze) physically prevents the *completion* of the manifestation. The disposition is "masked" by the interfering factor.
      *   **How it challenges SCA:** SCA says: "If he is generous (disposed to give), then if a need arises, he *would* give." Here, the need arises, but he *does not* give (due to the freeze). So the conditional is **false**. Yet, we strongly believe the disposition *was* intact – a second earlier he *would* have given. Masking shows that the truth of the conditional ("would X if triggered") depends on the *absence* of interfering factors, which isn't specified in the SCA. The disposition exists, but the world cooperates poorly.
      *   **Your Example Perfectly Illustrates This:** The disposition is present and tries to manifest, but an external blocker stops it.

  3.  **Case (c): The Emergent Trait (Resilience only in crisis)**
      *   **Name: (Less settled, options: Mimic, Extrinsic Disposition, or Context-Dependent Manifestation).** This is the trickiest and least directly addressed by the classic fink/mask literature focused on intrinsic properties. Let's define it clearly.
      *   **The Joint:** The disposition **does not exist as a stable, intrinsic property** *before* the triggering condition. The triggering condition (or the *prospect* of it) is **constitutive** in *creating* the disposition itself, or the capacity for its manifestation. The disposition is fundamentally **extrinsic** or **situationally emergent**.
      *   **Why it fits:** Before the crisis, there was no resilience "trait" residing in the team. The crisis *creates* the coordinated response, the shared purpose, the adrenaline – the very things that *are* the resilience *in that moment*. It's not that the resilience was hidden; it *came into being* because of the extreme context. The counterfactual "they'd have coped if it had come" points to a *potential* that exists *in the system under crisis conditions*, not a pre-existing disposition *of the team members* in normal times.
      *   **How it challenges SCA:** SCA *seems* true here: "If the crisis came, they *would* cope" (and they did). But SCA tries to define a *current* disposition ("they *are* resilient") *in terms of* this conditional. The problem is, **before the crisis, they *weren't* resilient.** There was no stable dispositional property "resilience" inherent in the team prior to the crisis. The conditional might be true of them *in the crisis context*, but it doesn't track a *standing* property they possessed beforehand. SCA, by linking the disposition *now* to the conditional, would misleadingly suggest they *were* resilient all along, just waiting for a crisis. They weren't. The disposition was extrinsic/emergent.
      *   **Coining a Term:** Let's call this a **Mimic Disposition** or an **Extrinsically Triggered Capacity (ETC)**. It *looks like* a standard disposition after the fact ("They were so resilient!") but it *mimics* one rather than arising from a stable intrinsic property. The capacity only exists *because* of, and *during*, the specific triggering context. It's not "finked" (it doesn't vanish when triggered, it *appears*), it's not "masked" (nothing blocks it, it *is* the manifestation). It's something else: **the trigger creates the disposition it manifests**.
      *   **What it Rules Out:** It rules out the idea that all character dispositions are *intrinsic, stable properties* of an agent that exist independently of the specific contexts that trigger them. It shows that some "traits" are fundamentally relational and emergent, constituted by the interaction between the agent(s) and the demanding situation.

  4.  **Case (d): The Missing Background Trait (Tree in bad soil)**
      *   **Name: Antidote** (coined by Alexander Bird, sometimes called "reverse finks" or discussed under "enablers").
      *   **The Joint:** The disposition is **intact**. The trigger occurs. **No active interferer prevents manifestation.** However, a **necessary background condition** for the disposition to manifest is **absent**. The manifestation fails *because of the absence of something required*, not the presence of a blocker.
      *   **Why it fits:** The generosity disposition (the "fruiting" potential) is real and present. The trigger (your need) occurs. Nothing actively stops him (no mask). But a necessary enabling condition for generosity to manifest *as action* (e.g., a basic sense of security, belief his own needs are met, functional empathy in *this* context) is missing (the "bad soil"). The disposition is present but "starved" of what it needs to operate, leading to no manifestation.
      *   **How it challenges SCA:** Like masking, the conditional ("if need arises, he would give") is **false** (need arose, he didn't give). Yet, the disposition *is* present. SCA fails because it doesn't account for the myriad *enabling conditions* (the "good soil") required for the manifestation to occur, even without active interference. The disposition exists, but the world doesn't cooperate in a more passive way (absence of enablers vs. presence of maskers).
      *   **Your Example Perfectly Illustrates This:** No blocker, the disposition is there, the trigger is there, but necessary background conditions (soil quality) are wrong, so no manifestation. It's the absence of a needed "vitamin" for the trait.

  ### Summary Table

  | Case | Description                  | Metaphysical Term | Disposition Present? | Trigger Present? | Manifestation? | Why Not?                                                    | Challenge to SCA ("Would X if Triggered")                                |
  | :--- | :--------------------------- | :---------------- | :------------------- | :--------------- | :------------- | :---------------------------------------------------------- | :----------------------------------------------------------------------- |
  | **(a)** | Trait vanishes when needed   | **Finkish**       | **Yes (then lost)**  | **Yes**          | No             | Trigger *causes* loss of disposition itself                 | **Strongest Refutation:** Disposition existed, trigger came, but didn't manifest *because disposition vanished*. |
  | **(b)** | External blocker             | **Masking**       | **Yes**              | **Yes**          | No             | **External factor** actively prevents manifestation         | Disposition exists, trigger present, but external blocker prevents manifestation. |
  | **(c)** | Trait only emerges in crisis | **Mimic / ETC**   | **No (created)**     | **Yes**          | Yes (emergent) | Disposition **did not exist** before trigger; trigger creates it | SCA seems true *after*, but doesn't reflect a *pre-existing* disposition; disposition is extrinsic/situational. |
  | **(d)** | Missing enabling condition   | **Antidote**      | **Yes**              | **Yes**          | No             | **Absence of necessary background condition**               | Disposition exists, trigger present, no blocker, but enabling condition missing. |

  ### What This Means For Your Character Course

  1.  **SCA is Wrong (Thanks to Finks!):** Case (a) is your prime exhibit. You can confidently tell your students: "Saying someone *is* generous cannot simply mean they *would* give if asked, because sometimes the very act of asking can make the generosity vanish in that moment, even if it was real before. Character traits are properties *now*, not just predictions of future actions."
  2.  **Character is Fragile (in the metaphysical sense!):** Traits aren't guarantees. They can be:
      *   **Finked:** Subconsciously undermined by the triggering situation itself (a).
      *   **Masked:** Thwarted by external obstacles (b).
      *   **Antidoted:** Rendered inert by the lack of necessary psychological/social "nutrients" (d).
  3.  **Some "Traits" Aren't Stable Properties:** Case (c) is crucial. What we *call* "resilience" or "courage" in the heat of the moment might not be a trait the person *carried with them* beforehand. It might be an extraordinary capacity *elicited* by the extreme demand, a property of the *agent-in-situation*, not the agent alone. This challenges the idea of character as a fixed set of internal dispositions.
  4.  **Vocabulary is Power:** Now you have the tools!
      *   "His generosity seems **finkish** – it disappears precisely when it's most needed."
      *   "Her honesty was **masked** by the overwhelming pressure to conform."
      *   "Their courage wasn't a pre-existing trait; it was a **mimic** / **extrinsically triggered capacity** – the crisis itself called it forth."
      *   "His kindness is there, but it's **antidoted** by his current exhaustion and fear; the right conditions just aren't present for it to show."

  You've identified genuine metaphysical distinctions that matter deeply for understanding character. Your cases aren't sloppy; they reveal the complex reality behind dispositional talk. Finks (a) are the most revolutionary concept, showing SCA is fundamentally flawed. Masks (b) and Antidotes (d) show the myriad ways the world can interfere. Mimics/ETCs (c) challenge the very idea that all traits are intrinsic properties. This gives you a powerful framework to analyze why character sometimes fails to manifest, far beyond simple weakness or hypocrisy.
