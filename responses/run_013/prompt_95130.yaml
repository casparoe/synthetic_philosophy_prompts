prompt: |-
  You're an expert in personal identity and care ethics, and I need a thought experiment built to order. Think carefully, and start by brainstorming two or three candidate teletransporter setups before you settle on one. The target is a case where Parfit's account of what matters in survival and a care-ethical account of survival come apart in the less obvious direction: Parfit says the original does not survive, while the care-ethical view says the original does survive. So the replica, or whatever comes out the other end, should fail Parfit's conditions -- no psychological connectedness or continuity of the right kind, no Relation R -- but should still count as the same person on a care-ethical view, because survival is partly relational: you survive by remaining the same node in a web of care, dependency, and responsibility. Constraints: no branching or fission, no duplicate copies running around, no souls or Cartesian egos, and the care-ethical yes can't just be wishful thinking or the family being sentimental; it has to definately follow from the theory. First, say in a sentence or two what you mean by a care-ethical account of survival, so we're not equivocating. After the scenario, walk through why Parfit's account says no and why the care-ethical account says yes. Then tell me which single feature is doing the work, what happens if you remove it, and how a Parfitian would try to deflate the care-ethical objection. Keep the scenario itself to a paragraph or two, then do the analysis. Don't just assert the verdicts -- derive them.
