  By "turns on the content" I mean stuff like: a signal stays honest because it's differentially costly — cheap for a genuinely good sender, ruinous for a faker trying to copy it; or the distinction between a real signal (a trait that evolved to change the receiver's behaviour) and a mere cue that just leaks information as a byproduct; or the point that the receiver has to actually come out ahead for any of this to be stable; or the old complant that the handicap principle is nearly unfalsifiable, since you can tell a handicap story about almost anything. Pick whichever one gives the best joke — don't just cram all four in.

  Please don't set it in the obvious places (peacocks, sports cars, watches, that whole aisle). Somewhere less worn would be better — a group chat, a tenure committee, a dog park, an interview panel, whatever — as long as the mapping onto the actual theory is tight. The test I care about: someone who's read the literature laughs and doesn't wince, and someone who only knows the buzzword "costly signaling" can't tell what the funny part is.

  If you can work the signal-vs-cue thing in without it feeling bolted on, great, but the joke comes first.

