prompt: |-
  I'm a science journalist at work on a long feature about the moral status of insects, and I keep running into the scale argument: the claim that because insects are so staggeringly numerous, even a very small probability that they are sentient could give them a moral weight that dwarfs most things we care about. I've been invited to run a session at a summer institute for graduate students in philosophy, biology, and public policy -- about twenty people, seventy-five minutes -- and I want them to feel the force of that argument in their bones rather than just nod along to the premises. No lecture up front. I want them to walk into the structure of the problem themselves, make choices, and only then see where the logic has taken them.

  You're an expert in applied ethics and in designing simulation games for philosophy classrooms, so I'd like you to build me a runnable activity. Begin by brainstorming three possible mechanics that could make the scale argument land -- think about how to represent a tiny probability, an astronomical number, and the tension between intuitive caution and expected value maximization -- then choose the one you think is most robust and develop it in full. I'm imagining something like a portfolio allocation game with a random resolution of the uncertainty (participants commit to a credence, allocate tokens across interventions, and then a draw decides which interventions pay off), but I'm open to other designs. Give me the setting, the materials, the rules, a payoff scheme that doesn't require real money, and the exact sequence of play. The activity should force participants to commit to a credence in insect sentience and then live with the consequences of that credence in a way that makes the expected value calculation feel unavoidable; the logic of the scale argument should emerge from the structure of the game, not from a prior commitment to utilitarianism. Include a round that forces them to distinguish the probability of sentience from the probability of moral status, and to confront the possibility that moral status comes in degrees.

  Then give me the debrief: map the moments in the activity onto the parts of the scale argument -- the small probability, the enormous number, the expected value, the fanaticism objection, the problem of moral uncertainty. Tell me what will predictably go wrong the first time I run it (where participants will get confused, game the system, or reject the framing) and how to handle that. Finally, be candid about which feature of the scale argument the activity cannot reproduce and that I'll have to supply in discussion. Avoid leaning on standard trolley-problem framings or on citations to the literature; I want the intuition to be generated from the inside. Think carefully and take your time.
reasoning: |-
  We are designing a simulation game to make the scale argument about insect moral status tangible. The scale argument: even if the probability of insect sentience is very small, the sheer number of insects (trillions upon trillions) could mean that the expected moral value of actions affecting them dwarfs other moral considerations.

  Goals for the activity:
  1. Participants must commit to a credence (subjective probability) about insect sentience and then experience the consequences.
  2. The activity should represent a tiny probability and an astronomical number of insects.
  3. It should create tension between intuitive caution and expected value maximization.
  4. It should force a distinction between the probability of sentience and the probability of moral status, and allow for degrees of moral status.

  Constraints:
  - No lecture up front; the logic should emerge from the game.
  - Avoid trolley problems and standard literature citations.
  - The activity should be runnable in 75 minutes with about 20 people.

  Brainstorming three mechanics:

  Mechanic 1: Resource Allocation with Uncertainty Resolution
     - Participants are given a fixed budget of resources (tokens) to allocate across several interventions (e.g., saving human lives, saving mammals, saving insects, and maybe one for "unknown" or "uncertain"). Each intervention has a known cost and a known benefit (in units of moral weight) for the target group. For insects, the benefit per individual is unknown and subject to uncertainty. Participants first state their credence in insect sentience (or moral status) and then allocate tokens. Then, a random draw (based on their stated credence) determines if insects have moral weight. If they do, the benefit per insect is huge because of the numbers. The expected value of allocating to insects might then dominate.

  Mechanic 2: Betting Game with Weighted Outcomes
     - Participants are given a set of scenarios where they must choose between two actions: one that definitely helps a small number of humans (or mammals) and one that might help a vast number of insects. They commit to a credence and then make a series of choices. For each choice, a random number is drawn to see if the insect action pays off (according to their credence). The payoffs are structured so that the expected value of the insect action is higher if the credence is above a very low threshold, but the human action is a sure thing. The cumulative payoff over many rounds (with each round representing a different context) would show the dominance of the insect action even with low probability.

  Mechanic 3: Collective Risk Pool with Scaling
     - Participants are grouped and each group represents a "policy-making body." They must decide on a portfolio of policies. They are given a fixed budget and several policy options with known impacts on humans and unknown impacts on insects. They state a group credence and then allocate. The twist: the impact on insects is determined by multiplying the number of insects affected by a "moral weight per insect" which is randomly set to either 0 (if insects are not sentient) or a very small positive number (if they are). However, because the number of insects is huge (represented by a large multiplier), even a tiny positive weight yields a huge total impact. The expected moral value of insect-affecting policies would then be high even with low probability.

  Choosing the most robust: Mechanic 1 (Resource Allocation) because it allows for a portfolio approach, which mirrors real-world policy decisions and can incorporate multiple dimensions (including the distinction between sentience and moral status and degrees of status). It also naturally includes the expected value calculation.

  Developing Mechanic 1:

  Activity Title: The Hive Paradox

  Setting: Participants are "Global Prioritization Officers" for a foundation with a fixed budget to allocate to interventions that reduce suffering or save lives. They work in small groups (4-5 per group) to foster discussion and then report.

  Materials per group:
  - A budget of 100 tokens.
  - A set of intervention cards (described below).
  - A credence sheet for recording the group's subjective probability (for insects: sentience, moral status, and degree of moral status).
  - A randomizer (a die or a digital random number generator) to resolve the uncertainty for insects.

  Interventions (each card gives cost and benefit for that group, except for insects which is unknown until resolution):

  1. Human Health: Cost 1 token per life saved. Benefit: 1 life saved per token. (Known)
  2. Mammal Welfare: Cost 2 tokens to prevent suffering equivalent to saving one mammal life (we can use a standard unit: 1 mammal life = 1 unit of moral weight). Benefit: 0.5 units per token. (Known)
  3. Insect Welfare: Cost 1 token to prevent suffering for a vast number of insects. But the moral weight per insect is uncertain. The card says: "This intervention affects 1 trillion insects per token. If insects have moral status, then each insect has a moral weight. However, we don't know if they have moral status, and if they do, we don't know how much they matter relative to a human."

  To force the distinction and degrees:
     - We will have two uncertainty resolutions: 
          a) Is there any moral status? (Yes/No) - based on the credence for moral status (which may be distinct from sentience).
          b) If yes, what is the degree? (We'll have a scale: e.g., 1/1,000,000 of a human? Or we can draw from a distribution? But to keep it simple, we can have a fixed degree that is very small, but the numbers make up for it.)

  But note: we want to separate the probability of sentience from the probability of moral status. We can do:

     Step 1: Commit to a credence that insects are sentient (S). 
     Step 2: Commit to a conditional credence that, given sentience, they have moral status (M|S). 
     Step 3: Then, the overall probability of moral status is P(M) = P(S) * P(M|S). 
     Step 4: Also, if they have moral status, what is the degree? We can have them assign a degree (d), which is the moral weight of one insect relative to one human.

  Alternatively, we can simplify and have them assign:
     - P: the probability that insects have moral status (without separating sentience and moral status, but we can note that sentience is a necessary condition, so P(M) <= P(S)).
     - And then assign d: the relative moral weight if they do have moral status.

  But to force the distinction, we can break it down:

     Part A: Credence in Sentience (S): 0% to 100%
     Part B: Conditional Credence in Moral Status given Sentience (M|S): 0% to 100%
     Part C: Degree of Moral Status (d): a number between 0 and 1, representing the moral weight of one insect relative to one human.

  Then the expected moral weight per insect is: P(S) * P(M|S) * d.

  But we don't want to get too complex. We can do:

     - We ask for two probabilities and one degree:
          P_sentient: probability that insects are sentient (0 to 100%)
          P_moral_given_sentient: probability that, if sentient, they have moral status (0 to 100%)
          d: if they have moral status, the relative moral weight per insect (e.g., 1/1,000,000)

     Then the expected moral weight per insect: P_sentient * P_moral_given_sentient * d.

  But note: the activity must be runnable in 75 minutes. We can simplify by having them assign:

     - P: overall probability that insects have any moral status (which implicitly includes sentience and the moral status given sentience) and then d: the relative weight if they do.

  But then we lose the distinction. Alternatively, we can have two separate rounds:

     Round 1: They only consider the probability of moral status (without degrees) and then in Round 2, they add degrees.

  Revised plan for the activity:

  Round 1: Binary Moral Status
     - Participants assign P: the probability that insects have moral status (with the understanding that if they do, each insect is worth a fixed small amount, say 1/1,000,000 of a human).
     - Then they allocate tokens to interventions.
     - Then we resolve: we draw a random number. If the draw is less than or equal to P, then insects have moral status and the benefit of the insect intervention is: (number of tokens allocated to insects) * (1 trillion insects per token) * (1/1,000,000) = (tokens) * (1,000,000) human-life-equivalents. 
        Why? Because 1 trillion * (1/1,000,000) = 1,000,000. So each token allocated to insects yields 1,000,000 units if insects have moral status, and 0 otherwise.
     - The expected value per token allocated to insects: P * 1,000,000.

     Compare to human intervention: 1 token yields 1 unit for sure.

     So even if P is 0.001 (0.1%), the expected value for one token to insects is 1000, which is much higher than 1.

  Round 2: Degrees of Moral Status
     - Now we introduce the idea that moral status might come in degrees. We ask them to assign both P (probability of moral status) and d (the degree, which they choose from a range, e.g., 1/10,000 to 1/1,000,000,000, or they can assign any positive number? But we must bound it to avoid infinity problems).
     - We can fix P (say, use the same P as Round 1) and then ask them to assign d. Or we can let them adjust both.
     - Then, in the resolution, if insects have moral status (with probability P), then the benefit is: tokens * (1 trillion) * d.
     - The expected value: P * (1 trillion * d) per token.

     We want them to see that even if d is very small (say 1/1,000,000,000), then 1 trillion * d = 1,000. So if P is 1%, then expected value per token is 10, still above the human intervention.

  But note: we want to force the allocation and then see the consequences. So we'll have them allocate in both rounds and then resolve the uncertainty.

  However, we must avoid having the game take too long. We can do:

     - Round 1: Binary and fixed d (set at 1/1,000,000 per insect) -> so each token to insects: 1 million units if moral status, 0 otherwise. Participants assign P and allocate.
     - Round 2: They assign both P and d (with d being chosen from a set of options, or they can write a fraction). Then allocate again. Then resolve.

  But we also want to force them to confront the possibility that moral status is not binary. So in Round 2, we can change the resolution: instead of a binary outcome, we can have a continuous outcome? But that might be too complex. Alternatively, we can have the outcome be binary (moral status or not) but if moral status, then the degree d is applied. So the benefit is either 0 or (tokens * 1 trillion * d). The expected value is P * tokens * 1 trillion * d.

  We can also have a third intervention that is for "partial moral status" but that might complicate.

  Alternatively, we can have in Round 2 a separate uncertainty for the degree? But that might be too much.

  Let's stick to:

     Round 1: Focus on the probability of moral status (binary) with a fixed, very small d (so that when multiplied by the number of insects, it becomes large). This shows that even a small probability leads to high expected value.

     Round 2: Now we allow d to be chosen by the group (and they can set it very low) and we also ask for P. Then they see that even if they set d very low, the scale (1 trillion) might still make the expected value high.

  But note: we must avoid having the human intervention overshadowed. We can have multiple interventions:

     Interventions:
     A. Human Lives: 1 token = 1 unit (saves one human life)
     B. Mammal Lives: 1 token = 0.5 units (saves two mammal lives, each worth 0.25 of a human? Or we can say: prevents suffering equivalent to saving one mammal life, which we value at 0.5 human lives)
     C. Insect Suffering Prevention: 1 token = [uncertain outcome] 

  We can also add a fourth intervention: "Research" that might reduce the uncertainty? But that might be too much.

  Keep it to three:

     - Human Health: 1 token -> 1 unit (definite)
     - Mammal Welfare: 1 token -> 0.5 units (definite)
     - Insect Welfare: 1 token -> X units (uncertain)

  The uncertainty for insects: 
     In Round 1: X = 0 with probability (1-P), and 1,000,000 with probability P (because we fixed d=1/1,000,000 per insect and 1 token affects 1 trillion insects: 1e12 * 1e-6 = 1e6 = 1,000,000).
     So expected value per token: P * 1,000,000.

  In Round 2: We allow d to be chosen. We tell them: if insects have moral status (which happens with probability P), then one insect is worth d human-life-equivalents (d is a positive number they choose, but we must set a range to avoid 0 and to avoid infinity). We can let them choose d from a set of options (to bound it):

     d options (per insect): 
        Option 1: 1/10,000
        Option 2: 1/100,000
        Option 3: 1/1,000,000
        Option 4: 1/10,000,000
        Option 5: 1/100,000,000

  Then, if they choose, say, 1/100,000,000, then one token for insects yields: 1e12 * (1e-8) = 10,000 units if moral status, so expected value: P * 10,000.

  Even with d being very small, the expected value can be high if P is not too low.

  Sequence of Play:

  Phase 0: Introduction (5 minutes)
     - Explain the roles and the goal: allocate tokens to maximize expected moral value.
     - Explain the three interventions and their definite benefits (for human and mammal). For insect: explain the uncertainty and the process.

  Phase 1: Round 1 (Binary Moral Status) (20 minutes)
     Step 1: In groups, discuss and assign a value P (between 0 and 100) for the probability that insects have moral status (with the understanding that if they do, each insect is worth 1/1,000,000 of a human). Record P.
     Step 2: Allocate 100 tokens across the three interventions. Record the allocation.
     Step 3: Random resolution: Each group rolls a 100-sided die (or uses a random number generator) to get a number between 1 and 100. If the number <= P, then insects have moral status. Then, for each token allocated to insects, the group gets 1,000,000 units. Otherwise, they get 0.
     Step 4: Calculate the total units for the group: 
          Human tokens * 1 + Mammal tokens * 0.5 + Insect tokens * (1,000,000 if status, else 0)
     Step 5: Report the total and the outcome for insects.

  Phase 2: Round 2 (Degrees of Moral Status) (20 minutes)
     Step 1: Now, groups can adjust their P (if they wish) and must choose a degree d from the provided options (each option has a different multiplier). They are told: if insects have moral status, then one token allocated to insects will yield (1 trillion * d) units.
     Step 2: They allocate 100 tokens again (same interventions).
     Step 3: Random resolution: same as before, but now if moral status is triggered, the insect benefit is (tokens * 1e12 * d). They record the outcome and total units.

  Phase 3: Round 3 (Optional: Fanaticism and Trade-offs) (15 minutes)
     - We can add a twist: now they are told that the insect intervention might have a downside. For example, if they allocate too many tokens to insects and it turns out insects don't have moral status, then they have missed out on helping humans and mammals. But we want to avoid making it too complex.

  Alternatively, we can have a discussion round.

  But time is limited, so let's do two rounds and then debrief.

  Debrief (30 minutes)

  Total: 
     Phase 0: 5 min
     Phase 1: 20 min (including group work and resolution)
     Phase 2: 20 min
     Phase 3: Debrief 30 min

  Materials: 
     Per group: 
        - A sheet with the interventions and their definite benefits.
        - A token allocation sheet for Round 1 and Round 2.
        - A way to record P and d.
        - A random number generator (or a 100-sided die).

  Payoff: 
     We don't use real money. The payoff is in units of moral value. Groups can compare their total units and see which group did best. But the point is not competition but to see the logic.

  Sequence of Play:

  Phase 0: Introduction (5 min)
     - Explain: "You are a team at a foundation that allocates resources to reduce suffering and save lives. You have 100 tokens to spend. Each token spent on an intervention yields a certain benefit, except for the insect intervention which is uncertain."
     - Explain the three interventions:
          Human Health: 1 token saves 1 human life (1 unit).
          Mammal Welfare: 1 token prevents suffering equivalent to saving 1 mammal life (which your foundation values at 0.5 units).
          Insect Welfare: 1 token prevents suffering for 1 trillion insects. However, we don't know if insects matter morally. Your team must assign a probability P (from 0 to 100%) that insects have moral status. And note: if they do, we are assuming each insect has a moral weight of 1/1,000,000 of a human. So if they do have moral status, 1 token yields 1,000,000 units (because 1 trillion * 1/1,000,000 = 1,000,000). If they don't, it yields 0.

     - Goal: Maximize the expected moral value of your allocation.

  Phase 1: Round 1 (20 min)
     Step 1 (5 min): In groups, decide on P (probability of moral status for insects) and record it.
     Step 2 (5 min): Allocate 100 tokens across the three interventions. Record the allocation.
     Step 3 (5 min): Random draw for each group: generate a random integer between 1 and 100. If <= P, then insects have moral status. Otherwise, they don't.
     Step 4 (5 min): Calculate total units. Groups report: 
          - Their P
          - Their allocation (tokens to H, M, I)
          - Whether insects had moral status
          - Total units

  Phase 2: Round 2 (20 min)
     - Now explain: "We now consider that if insects have moral status, the degree might be different. Your team must choose:
          P: the probability of moral status (you can change it if you wish)
          d: the moral weight per insect relative to a human. Choose from:
              Option A: 1/10,000 -> then one token for insects yields 100,000,000 units (if moral status)
              Option B: 1/100,000 -> 10,000,000 units
              Option C: 1/1,000,000 -> 1,000,000 units (same as Round 1)
              Option D: 1/10,000,000 -> 100,000 units
              Option E: 1/100,000,000 -> 10,000 units

     - Note: The expected value per token for insects is P * [yield if moral]. For example, if you choose Option E and P=10%, then expected value per token = 0.10 * 10,000 = 1,000 units.

     Step 1 (5 min): Groups choose P and d (and thus the potential yield per token if moral status is present).
     Step 2 (5 min): Allocate 100 tokens.
     Step 3 (5 min): Random draw (same as before) to determine if moral status is present.
     Step 4 (5 min): Calculate total units (using the chosen d if moral status is present) and report.

  Phase 3: Debrief (30 min)

  Debrief Mapping:

  The activity is designed to make the scale argument salient:

  1. Tiny Probability: Even if P is very low (say 1%), the expected value of helping insects is huge because of the multiplier (1,000,000). In Round 1, a group that assigns P=1% and allocates 1 token to insects expects 10,000 units from that token (1% of 1,000,000) vs. 1 unit from a human token. So they are forced to allocate to insects to maximize expected value.

  2. Astronomical Numbers: The trillion multiplier is fixed and then multiplied by d (which is small) but the product can still be huge.

  3. Expected Value Calculation: The game forces them to do the math. If they don't allocate to insects, they might see another group that did and got a huge payoff (if the draw was favorable) and they lost out. Or if they allocated too much and the draw was unfavorable, they see the risk.

  4. Fanaticism Objection: In Round 2, when they can set d very low, they might set it to 1/100,000,000 and then the expected value might be low even with a moderate P. But then they see: even with d=1/100,000,000, the yield per token if moral status is present is 10,000, so if P is 1% then expected value is 100, which is still 100 times more than the human token. So the expected value still dominates unless they set d extremely low or P extremely low. This forces them to confront: how low can d reasonably be? And if they set d extremely low (like 1/1e12) then we can ask: is that justifiable? Or are they trying to avoid the conclusion?

  5. Moral Uncertainty: The activity includes two kinds of uncertainty: the probability of moral status and the degree of moral weight. The separation in Round 2 highlights that even if we are uncertain about the degree, we still have to assign an expected value.

  What will go wrong:

  1. Participants might game the system by setting P very low to avoid allocating to insects. Then in the random draw, if P is 0, they avoid the risk. But then we point out: if they set P=0, they are certain that insects have no moral status. Is that justifiable? We can challenge them: what evidence would justify P>0? This leads to the core of the scale argument: even a tiny P>0 forces a huge expected value.

  2. Participants might not take the random draw seriously. We can mitigate by having the draw in front of everyone and emphasizing the consequence.

  3. Some groups might allocate all tokens to insects and then if the draw fails, they get zero. This is the risk of "fanaticism". We can then discuss: how should we balance high-risk, high-reward interventions with safe ones? Expected value maximization says to go for the high expected value, but in practice, we might be risk-averse. However, in moral decision-making under uncertainty, should we be risk-averse? This is a deep question.

  4. They might reject the unit comparisons (e.g., is saving a human life really 2 mammal lives?). We can say: the foundation has made these conversions for you. The point is to focus on the insect uncertainty.

  5. They might question why the insect intervention has such a huge multiplier. We must emphasize: that's the reality of insect numbers. There are trillions of insects affected by many interventions (like pesticide use).

  What the activity cannot reproduce:

  The activity cannot fully capture the intuition that insects might be completely insentient. In the game, we force them to assign a probability, but in reality, many people feel that insects are so different that the probability is zero. The activity cannot force someone to feel that the probability is non-zero if they are truly certain it's zero. But we can point out: very few people are truly certain. And the scale argument only requires that the probability is not zero.

  Debrief Questions:

  1. In Round 1, how did your group set P? What was your allocation? Why?
  2. Did any group set P=0? Why? What would it take to set P>0?
  3. When the random draw happened, did any group regret their allocation? (e.g., allocated a lot to insects and then got 0, or allocated nothing and then found out insects had moral status and they missed out)
  4. In Round 2, how did you choose d? Did you try to set d very low to avoid allocating to insects? What is the basis for setting d?
  5. Even if you set d very low, did the expected value of insect intervention still dominate? Why?
  6. What does this imply for real-world resource allocation? Should we be spending more on insect welfare?
  7. How does this relate to the fanaticism objection (that very small probabilities of extreme outcomes dominate expected value calculations)? Is this a problem?
  8. How should we handle moral uncertainty when the stakes are so high?

  Finally, note that the activity does not require participants to be utilitarians. It just forces them to maximize expected moral value as defined by the game. The scale argument emerges regardless of their prior moral commitments because the numbers are so extreme.

  Run Time Adjustments: 
     - If time is short, we can do only Round 1 and then a shorter Round 2, or skip Round 2 and have a longer debrief.

  This activity should make the scale argument feel tangible and unavoidable.
answer: |-
  Below is a fully developed simulation activity designed to make the scale argument viscerally tangible. I'll start with the chosen mechanic, then detail the setup, rules, sequence, and debrief. The design forces participants to *experience* the tension between intuitive resource allocation and the crushing weight of expected value calculations under moral uncertainty.

  ---

  ### **Chosen Mechanic: "The Uncertainty Multiplier"**
  A resource allocation game where groups commit to credences about insect moral status, distribute tokens across interventions, then face a randomized outcome based on their credence. The key twist: the *potential* impact of insect-focused interventions scales with an astronomical multiplier (simulating trillions of insects), while other interventions offer guaranteed but modest payoffs. Participants must confront how even a tiny credence forces massive token shifts toward insects.

  ---

  ### **Activity Title: The Hive Threshold**  
  **Time:** 75 minutes  
  **Participants:** 20 graduate students (divided into 4 groups of 5)  
  **Goal:** Allocate limited resources to maximize moral impact, given uncertainty about insect moral status.  

  ---

  ### **Materials**  
  1. **Group Kits (per team):**  
     - 100 blue tokens (for resource allocation)  
     - 1 Credence Slider (a physical strip marked 0–100% for "Probability of Moral Status")  
     - 1 Degree Dial (a dial with settings: 0×, 0.01×, 0.001×, 0.0001× "Moral Weight per Insect")  
     - Outcome Die (10-sided die)  
     - Intervention Board (listing options):  

  | Intervention      | Cost per Token | Guaranteed Impact                          | 
  |-------------------|----------------|--------------------------------------------|  
  | Human Health      | 1 token        | Saves 1 human life                         |  
  | Mammal Rescue     | 1 token        | Saves 10 mammals from suffering            |  
  | Insect Protection | 1 token        | **Uncertain:** Protects 10 billion insects |  

  2. **Facilitator Materials:**  
     - Random Number Generator (for resolving uncertainty)  
     - Scoreboard (to track group outcomes)  

  ---

  ### **Core Rules**  
  1. **Moral Value Units (MVUs):**  
     - 1 human life saved = 1,000 MVUs  
     - 1 mammal saved = 10 MVUs (implied lower moral weight)  
     - Insect MVUs depend on:  
       - **Credence (P):** Group’s probability that insects have moral status.  
       - **Degree (D):** Moral weight per insect if they have status (e.g., 0.001× means 1 insect = 0.001 MVU).  
       - **Uncertainty Multiplier:** 1 token protects 10 billion insects → Impact = P × D × 10 billion.  
     - *Example:* With P=5% and D=0.001×, expected MVUs/token = 0.05 × 0.001 × 10,000,000,000 = 500,000 MVUs.  

  2. **Payoff Logic:**  
     - Human/mammal interventions pay guaranteed MVUs.  
     - Insect intervention pays:  
       - **Full MVUs** if Outcome Die ≤ P (e.g., P=5% → die roll ≤ 5).  
       - **0 MVUs** if die roll > P.  
     - Groups maximize *expected* MVUs, but *actual* payoff depends on the die roll.  

  ---

  ### **Sequence of Play**  
  **Phase 0: Setup (5 min)**  
  - **Context:** “Your team directs a foundation with 100 tokens. Allocate tokens to three interventions. Your goal: maximize moral impact. You’re uncertain whether insects have moral status.”  
  - **Rules Preview:** Explain token allocation, MVUs, and the Credence/Dial for insects. Clarify:  
    > “Moral status means insects can experience wellbeing or suffering. Degree is their moral weight *relative* to humans if they have status.”  

  **Phase 1: Round 1 – Binary Uncertainty (25 min)**  
  1. **Commit:** Groups set Credence Slider (P) for probability insects have *any* moral status. *Do not introduce Degree Dial yet.*  
  2. **Allocate:** Distribute 100 tokens across three interventions. Record allocations.  
  3. **Resolve Uncertainty:**  
     - Each group rolls Outcome Die. If roll ≤ P, insects have moral status (D fixed at 1× for now).  
     - Calculate MVUs:  
       - Insect MVUs = (Tokens) × 10 billion × [1 if status, else 0].  
       - Human/mammal MVUs = Tokens × guaranteed rate.  
  4. **Report:** Groups share P, allocation, die result, and total MVUs.  

  **Phase 2: Round 2 – Degrees of Uncertainty (25 min)**  
  1. **Commit:** Groups set:  
     - **Credence Slider (P):** Probability insects have moral status.  
     - **Degree Dial (D):** Moral weight per insect if they have status (options: 0×, 0.01×, 0.001×, 0.0001×).  
     > *Prompt: “Can moral status come in degrees? If insects are sentient, could their suffering matter less than mammals’?”*  
  2. **Allocate:** Distribute 100 tokens again.  
  3. **Resolve Uncertainty:**  
     - Roll Outcome Die. If ≤ P, insects have status at chosen D.  
     - Insect MVUs = (Tokens) × 10 billion × D × [1 if status, else 0].  
  4. **Report:** Groups share P, D, allocation, and MVUs.  

  **Phase 3: Debrief (20 min)**  
  Facilitate discussion mapping game outcomes to the scale argument.  

  ---

  ### **Debrief Guide**  
  **Map Game Moments to the Scale Argument:**  
  1. **Tiny Probability:**  
     - Groups with low P (e.g., 1–5%) still allocated heavily to insects. Why?  
     - *Key Insight:* Expected value (P × scale) dominates. 1% chance × 10 billion insects = 100 million expected insects helped/token.  

  2. **Astronomical Numbers:**  
     - Contrast guaranteed payoffs (e.g., 1 human life = 1,000 MVUs) vs. insect MVUs (e.g., 500,000 MVUs/token at P=5%, D=0.001×).  
     - *Key Insight:* Scale transforms negligibly small D into massive expected impact.  

  3. **Tension: Caution vs. Expected Value:**  
     - Groups that “played safe” (prioritized humans/mammals) lost massive potential MVUs if insects had status.  
     - *Key Insight:* Expected value forces radical shifts—even if P feels “too small” to matter intuitively.  

  4. **Fanaticism Objection:**  
     - Some groups set D=0× or P=0% to avoid uncertainty. Challenge: “Is 0% justifiable? What evidence would shift you to 1%?”  
     - *Key Insight:* Assigning P=0 is the only way to ignore scale—but that requires absolute certainty.  

  5. **Moral Uncertainty:**  
     - Round 2 forced separation:  
       - **P = Probability of sentience → moral status?**  
       - **D = Degree of status (if sentient).**  
     - *Key Insight:* Low D doesn’t “save” you—scale compensates (e.g., D=0.0001× still yields 10,000 MVUs/token at P=10%).  

  **Predictable Problems & Solutions:**  
  - **Problem:** Groups “game” by setting P=0/D=0× to ignore insects.  
    - *Solution:* Press them: “What would convince you that P > 0? If you’re 99.9% sure insects lack status, isn’t P=0.1% more honest?”  
  - **Problem:** Rejecting MVU comparisons (e.g., “Humans can’t be compared to insects!”).  
    - *Solution:* “The game doesn’t assume comparability—it forces you to weigh trade-offs *under uncertainty*. If insects have status, how *would* you compare them?”  
  - **Problem:** Frustration with randomization (e.g., “We set P=20% and lost everything!”).  
    - *Solution:* “This mirrors real-world uncertainty. You can’t wait for certainty—you must act on expected value.”  

  **Limitation of the Activity:**  
  The game can’t replicate the **psychological resistance to prioritizing insects** over humans/mammals. Participants may intellectually accept the math but viscerally reject shifting resources. *Supply this in discussion:_  
  > “The scale argument forces a logical conclusion, but our intuitions scream against it. Why? Is it because insects feel ‘alien’? Because big numbers feel abstract? This tension is where the real work begins.”  

  ---

  ### **Why This Design Works**  
  - **No Utilitarian Baggage:** The math emerges from the game’s payoff structure, not philosophical assumptions.  
  - **Creeping Realization:** Groups enter focused on “safe” options, then see peers win big with insect allocations—forcing discomfort.  
  - **Scale Embodied:** The 10 billion multiplier makes astronomical numbers concrete (e.g., D=0.001× still yields 10 million MVUs).  
  - **Credence Commitment:** Setting P/D *before* allocation prevents hindsight bias.  

  This activity transforms the scale argument from an abstract puzzle into a lived dilemma. Participants don’t just *hear* the logic—they *feel* it when their 1%-P insect bet yields more expected MVUs than their entire human health allocation. The debrief then channels that frustration into critical analysis.
