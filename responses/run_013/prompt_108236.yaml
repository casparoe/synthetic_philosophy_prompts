  Hmm, the user teaches a 300-level ethics seminar on biography and wants to create an activity that makes students feel the problem of learning from others' lives. They're frustrated with the usual shallow debate. They've tried a two-part exercise with a composite biography, but want a third "beat" to deepen the discussion without lecturing.

  I need to understand their goals: they want students to experience how narrative framing shapes moral lessons, question whether admiration leads to knowledge, and connect to Plutarch's comparative method and hagiography's erasure of flaws—without using technical terms upfront.

  The user's unspoken needs might include:
  - Creating an experiential "aha" moment rather than theoretical discussion
  - Handling quiet grad students and potential groupthink
  - Managing time tightly in 90 minutes
  - Making historical concepts (Plutarch/saints) feel immediate
  - Avoiding their own frustration when students miss the point

  For the activity structure:
  - Beat 1: Admiring bio → students extract lesson + action
  - Beat 2: Candid bio → students revise lesson
  - Beat 3 needs to create cognitive dissonance. My idea: have them apply their revised lesson to a paired "opposite" life (e.g., their cautious person vs. a risk-taker). This mirrors Plutarch while raising questions about universal morals.

  Practical considerations:
  - Must use composites to avoid fact debates
  - Handouts should be visually distinct but same length
  - Timing is critical—strict 7-min phases
  - Grad students might dominate if they engage; need silent tasks first
  - Risk of students resisting the pivot in Beat 3

  Implementation plan:
  1. Handout 1 (admiring bio) → silent write → quick share
  2. Handout 2 (candid bio) → silent revise → share shifts
  3. Introduce "counter-life" handout → force choice: whose approach is right? → boil down to one universal "lesson" → reveal impossibility

  Why this works:
  - The counter-life creates productive tension
  - Forcing synthesis exposes how morals depend on framing
  - Avoids terms like "hagiography" until debrief

  Predictable problems:
  - Students might dismiss the exercise as artificial
  - Some may fixate on composite authenticity
  - Group might converge on bland consensus
  - Time pressure in final discussion

  Contingencies:
  - If stuck, ask: "What would the *first version's author* say about your universal lesson?"
  - If rushed, skip whole-group sharing for paired discussion
  - If resistant, focus on "What made you trust one narrative over another?"

  What the activity can't do:
  - Fully replicate historical context (Plutarch/saints)
  - Prevent some students from disengaging
  - Replace instructor's role in framing the "why"

  Final touch: Debrief should circle back to their initial beliefs about biography, making their own shift visible. Save terms like "hagiography" for the last 5 minutes as revelation.
answer: |-
  Here’s a fully built 90-minute activity designed to make students *feel* the problem of biography-as-moral-instruction, with a structured third beat that forces them to confront admiration as narrative artifice. It avoids lecturing about Plutarch/hagiography until the final reveal.

  ---

  ### **Activity Structure: "The Lens of a Life"**
  **Goal:** Trap them in the tension between *story* and *substance*, forcing them to question whether "lessons" are discovered in a life or manufactured by narrative framing.

  **Materials:**  
  - **Handout 1 (Admiring Tribute):** 1-page composite biography (e.g., "Dr. Elena Vasquez," a humanitarian physician). Flowery language, emphasis on courage, sacrifice, unwavering ethics.  
  - **Handout 2 (Candid Account):** Same life events, but exposes her ambition, ignored family, suppressed failures. Clinical tone.  
  - **Handout 3 (Counter-Life):** A *contrasting* composite (e.g., "James Finch," a pragmatic lobbyist who achieved similar social impact through compromise). Deliberately amoral tone.  
  - **Worksheet:** 3 sections: "Lesson from Version 1 + Action," "Revised Lesson from Version 2," "Universal Lesson?"  

  **Rules:**  
  1. **No fact-checking:** "These are constructed portraits. Argue with the *framing*, not the facts."  
  2. **Silent writing first:** 3 minutes per worksheet section. Forces individual engagement.  
  3. **No consensus-seeking:** "Your job isn’t to agree—it’s to trace how *your judgment shifts*."  

  ---

  ### **90-Minute Timeline**  
  **(0:00–0:10) Setup & Handout 1**  
  - **What you say:** *"Read this tribute. Write ONE sentence: What’s the core lesson this life teaches? And one concrete thing you’d do tomorrow to honor it."*  
  - **What you refuse:** Context about the session’s theme. Stay neutral: "This is just a warm-up."  
  - **Why:** Activates their instinct to moralize. The grad students might engage here.  

  **(0:10–0:20) Share-Out (Version 1)**  
  - Cold-call 4–5 students. *Do not debate*. Just map responses on the board:  
    - *"Courage requires sacrificing personal happiness."* → *"I’ll speak up in a meeting tomorrow."*  
    - *"True impact demands unwavering principles."* → *"I’ll donate to a cause."*  
  - **Crucial:** Note how *similar* the lessons are.  

  **(0:20–0:30) Handout 2 & Revision**  
  - **What you say:** *"Same person. Same facts. Revise your lesson and action based solely on this version."*  
  - **Refuse to say:** Whether this version is "truer."  

  **(0:30–0:40) Share-Out (Version 2)**  
  - Contrast with first column. Expect:  
    - *"Ambition can corrupt idealism."* → *"I’ll call my parents tonight."*  
    - *"Impact isn’t worth human cost."* → *"I’ll reassess my internship goals."*  
  - **Point silently:** Circle where actions shifted from *public* (Version 1) to *private* (Version 2).  

  **(0:40–0:55) THIRD BEAT: Handout 3 + Synthesis**  
  - **The Pivot:** *"You’ve seen two versions of one life. Here’s a different life. Read it. Now, look at your revised lesson from Version 2. Does it apply to James Finch? If not, revise it into ONE universal lesson that fits BOTH lives."*  
  - **Why this works:** Vasquez (idealist) and Finch (pragmatist) are Plutarchian opposites. To make the lesson "universal," students must strip away *all* specifics—which mirrors hagiography’s erasure of idiosyncrasy.  
  - **Predictable Struggle:** They’ll try to make the lesson vague: *"Be persistent?"* *"Adapt?"* Push: *"Would Vasquez admire Finch? Would Finch see Vasquez as naïve?"*  

  **(0:55–1:25) Debrief: Trapping Them in the Turn**  
  - **Key Questions (Ask in this order):**  
    1. *"Which version of Vasquez felt more true? Why?"* (Exposes narrative trust)  
    2. *"When you made the lesson ‘universal,’ what did you have to ignore?"* (Forces admission of erasure)  
    3. *"Did your admiration for Vasquez help you understand her—or just help you build a lesson?"* (Ties admiration to utility)  
    4. *"If biography is about learning how to live, why does the ‘lesson’ vanish when we add complexity or contrast?"*  
  - **Reveal Plutarch/Hagiography (Last 5 mins):**  
    *"You’ve recreated a 2,000-year-old problem. Plutarch paired lives to force moral comparisons—but the ‘lesson’ emerged from the pairing, not the lives. Medieval hagiographies erased flaws to make saints imitable. Your ‘universal lesson’ was a secular saint-making. So: Is admiration a way of knowing? Or a tool for turning lives into fables?"*  

  ---

  ### **What Goes Wrong & Fixes**  
  1. **"This feels manipulative!"**  
     - *Lean in:* "Good. Why? What’s the difference between manipulation and insight?"  
  2. **Grad students dominate once engaged:**  
     - Assign them silent roles: *"You two chart the shifts in the room’s language."*  
  3. **Students dismiss the composite:**  
     - *"Pick a real biography you admire. How would it change if we did this to it?"*  
  4. **Consensus too fast:**  
     - *Force dissent:* "Who thinks Finch is *more* ethical? Why?"  
  5. **Time runs short in Beat 3:**  
     - Skip whole-group synthesis; do paired debates on universal lessons.  

  ---

  ### **What the Activity Can’t Do (And You Must Supply)**  
  - **The historical weight:** They won’t feel Plutarch’s cultural authority or medieval piety’s grip. You’ll need to frame the reveal as a *recurring human impulse*, not just an academic concept.  
  - **The gut-punch of self-implication:** When a student says, *"I made her a lesson to feel better about myself,"* you must freeze that moment: *"Yes. That’s the engine of biography."*  
  - **The "why care" factor:** Hammer home: *"If we can’t learn from others’ lives, what’s left? Self-help slogans? Raw intuition?"*  

  ---

  **Why this works:** The third beat isn’t another "gotcha"—it makes them *complicit* in the act of moral reduction. By forcing them to distill a universal lesson, they experience firsthand how biography flattens lives into tools. When you reveal Plutarch/hagiography, it won’t feel like history; it’ll feel like a confession.  
    
  **Final tip:** End with silence. Ask: *"If you wrote a biography tomorrow, what would you refuse to omit?"* Let them sit with that.
