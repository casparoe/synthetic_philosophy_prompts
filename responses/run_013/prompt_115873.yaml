prompt: |-
  I'm putting together a small online interview series in philosophy of biology, mostly for grad students and a couple of postdocs, and next months guest is a philosopher who works on biological function. I'm not a philosopher by training—I just host the thing—so I might be mangling her view, but here's the gist. She defends a view she calls the stabilized contribution account. Roughly: a trait's function is the effect that explains why the trait is retained in a lineage, but retention needn't be natural selection—it can be developmental canalization or reliable social transmission, and she thinks drift-retained traits have no function. The effect also has to be a contribution to a larger system's persistence, not just any effect. She thinks this keeps the etiological account's historical condition while answering the causal-role theorist's complaint that functions are often just capacities in a system, and she claims it gives a better account of malfunction than either: a trait can malfunction when it stops making its stabilized contribution, even if it was never selected for. She also draws a distinction between a trait's retention profile (what actually kept it around) and its contribution profile (what it does now), and says function ascriptions can come apart from both.

  Can you draft eight to ten interview questions for me? I want them to go beyond letting her restate the view. Please include at least one question each on: (1) what stabilized adds to selected, whether canalization- or transmission-based retention can really ground functions and malfunctions, and whether excluding drift is principled; (2) how her account handles a byproduct that later becomes useful, and whether a trait's function changes when the environment changes but the trait doesn't; (3) the indeterminacy problem—lots of effects are stabilized, so how does she pick out the function without circularity or a designer's intentions; (4) how she individuates the lineage and the trait across generations, especially for symbiotic or cultural inheritance; (5) the standard causal-role objection that her history is just evidence for a capacity, not constitutive of function; and (6) what empirical findings or cases would make her give up the view. For each question, add a follow-up that's keyed to the answer she's most likely to give, and make the later questions harder to deflect with that's a different project or that's an empirical question. Also, if you can, include one question about a one-off somatic mutation that helps a cell survive but isn't inherited, one about whether synthetic organisms or first replicators can have functions on her view, and one about whether the account extends to ecological or ecosystem-level functions, where lineage retention gets murky. I'd like the questions to sound like a real interviewer who's read her work, not a textbook. No need for reading suggestions or citations—just the questions.
reasoning: |-
  Okay, let me break this down. The user needs interview questions for a philosopher of biology specializing in biological function, specifically her "stabilized contribution account." The request is detailed with six mandatory topics plus three extra cases, all requiring follow-ups that prevent deflection. 

  First, I need to grasp the core of her theory: functions as effects that explain trait retention (beyond just natural selection), excluding drift, requiring contribution to system persistence, and distinguishing retention from contribution profiles. The challenge is crafting questions that probe without letting her retreat to rehearsed answers.

  For the drift exclusion (topic 1), I'll question the principled distinction between selection and other stabilizers versus drift. The follow-up must challenge if excluding drift is arbitrary given her broadened mechanisms. The somatic mutation case fits here—testing if non-inherited but beneficial effects challenge her historical requirement.

  Topic 2 (byproducts and environmental change) needs to force clarity on function identity. If she says function changes with environment, the follow-up pushes on trait identity across changes. For byproducts-turned-useful, the follow-up asks if this creates "function without stabilization history."

  Indeterminacy (topic 3) is tricky. Her likely "system persistence" criterion risks circularity—does persistence depend on the very functions? The follow-up must corner this loop without designer talk.

  Trait/lineage individuation (topic 4) must tackle messy cases like symbiosis. If she uses causal role, the follow-up asks if that collapses into causal-role theory—undermining her etiological claims.

  The causal-role objection (topic 5) needs sharpness. Her reply might separate evidence from constitution, but the follow-up demands why history isn't just suggestive evidence for current capacities.

  For falsification (topic 6), I'll push for concrete scenarios. If she offers vague answers, the follow-up insists on specific empirical deal-breakers.

  Synthetic organisms and ecosystem functions test her boundaries. The follow-up for ecosystems questions if "lineage" stretches too thin without clear inheritance.

  Throughout, questions must sound conversational yet informed—no jargon dumps. Phrases like "I'm curious" or "Help me unpack" keep it natural. Follow-ups anticipate her defenses ("different project," "empirical question") and block exits by demanding internal consistency.
answer: |-
  Here are ten interview questions with follow-ups, designed to push deeper into the Stabilized Contribution Account while respecting your guest's framework and avoiding easy deflections:

  1.  **Core Mechanism Nuance:** "You argue that 'stabilized contribution' replaces 'selected for' to include canalization and reliable social transmission. Could you elaborate on what 'stabilized' specifically *adds* beyond just 'non-accidental persistence,' especially in contrast to drift? What makes canalization or transmission sufficiently 'stabilizing' to ground real functions and malfunctions, but drift isn't?"
      *   *Likely Follow-up:* "If drift is excluded because it lacks a *specific* causal explanation for persistence (it's just statistical survival), but canalization explains persistence via developmental constraints, doesn't this make the account hinge on identifying the *right kind* of causal story? How do we reliably distinguish, say, a canalized trait from one that's merely drifted but happens to be developmentally 'easy'?"

  2.  **Drift Exclusion Challenge:** "The principled exclusion of drift-retained traits seems central. Could you defend why *only* mechanisms like selection, canalization, or transmission – but not drift – can ground a functional ascription? Isn't drift itself a *stabilizing* force in population genetics, preventing loss? Why doesn't that count?"
      *   *Likely Follow-up:* "Some might argue that excluding drift is an *ad hoc* move to preserve normativity (malfunction). If a drift-persisted trait *currently* contributes indispensably to system persistence, why *shouldn't* we say it has that function *now*, even if its history was accidental? Doesn't your 'contribution profile' distinction open this door?"

  3.  **Byproducts & Environmental Shift:** "Consider a trait that's a mere byproduct initially, but later, due to an environmental change, its effect becomes crucial and starts getting stabilized (say, via selection or transmission). On your view, does this trait *acquire* a function at that later point? Does the *function itself* change retroactively, or is it a new functional trait?"
      *   *Likely Follow-up:* "If the trait *does* acquire a function only later, what exactly changes? The trait itself might be identical. Is it solely the *stabilization history going forward* that matters? Does this mean a trait can have *no* function for generations, then suddenly gain one based on future events?"

  4.  **Indeterminacy Problem:** "A trait stabilizes many effects simultaneously: pumping blood, making noise, consuming energy. You say the function is the effect that explains retention *and* contributes to a larger system's persistence. But doesn't 'system persistence' risk circularity? How do we non-arbitrarily pick *the* specific contribution that counts as the function without smuggling in designer-like intentions about what the system is 'for'?"
      *   *Likely Follow-up:* "You might say the relevant contribution is the one that features in the *actual stabilization mechanism*. But isn't the mechanism itself often sensitive to *multiple* effects? How do we isolate *the* explanatorily relevant effect, especially if the stabilization mechanism (like developmental constraints) is coarse-grained?"

  5.  **Trait & Lineage Individuation:** "Your account relies on identifying traits and lineages across generations. How do you handle cases where this is messy? For instance, in obligate symbiosis (like mitochondria), is the 'lineage' the host, the symbiont, or a new holobiont unit? How do we stably individuate the 'trait' across cultural transmission where variations accumulate rapidly?"
      *   *Likely Follow-up:* "If you argue for a pragmatic or context-dependent approach to individuation, doesn't this make functional ascriptions relative in a way that might undermine the objectivity your historical condition seeks? How do you prevent function from collapsing into just 'whatever we find useful to track'?"

  6.  **Causal-Role Rebuttal:** "Causal-role theorists argue that historical facts are merely *evidence* for a trait's current systemic capacity, not what *constitutes* its function. They'd say the stabilized contribution is just evidence for a *current* disposition. What's your direct response to the claim that the history, while informative, isn't *constitutive*?"
      *   *Likely Follow-up:* "If a trait makes a crucial contribution *now* but lacks any stabilization history (say, a novel mutation that arose yesterday and saves the organism), the causal-role theorist says it *has* a function. You say it doesn't *yet*. Why is the historical fact *essential* to the function itself, rather than just telling us the function is likely stable or important?"

  7.  **Somatic Mutation Edge Case:** "Consider a one-off somatic mutation in a single cell that allows it to survive a toxin, but this mutation isn't inherited by any offspring. The cell survives and contributes to the organism's persistence. Does this mutation have a 'function' for that cell *within* the organism on your view? Why or why not?"
      *   *Likely Follow-up:* "If not, because it lacks lineage-level stabilization, does this mean functional ascriptions are *only* possible at the germ-line/organismal lineage level? How does this square with common biological talk about cellular functions?"

  8.  **Artificial & Origin of Life:** "Can synthetic organisms (e.g., designed minimal cells) or the very first self-replicating molecules have functions on your account? If so, at what point does the 'stabilization history' begin? If not, how do we describe the teleonomic appearance of their behavior?"
      *   *Likely Follow-up:* "For first replicators, if their persistence is initially just due to basic physics/chemistry (arguably analogous to drift?), when does 'stabilization' kick in? Does your account require a *population* with variation for stabilization to be meaningful?"

  9.  **Beyond Organisms: Ecosystems?:** "You mention contribution to a 'larger system's persistence.' Could this extend to ecological or ecosystem-level functions? For example, could predator-prey dynamics be stabilized and contribute to ecosystem persistence? How would you handle 'lineage' retention in such diffuse, multi-species systems?"
      *   *Likely Follow-up:* "If ecosystems lack clear, stable lineages in the way organismal traits do, does this mean ecosystem-level 'functions' are merely metaphorical on your account, or can they be literal? If literal, what replaces the trait-lineage unit?"

  10. **Empirical Falsification:** "What kind of empirical findings or specific biological cases would pose the strongest challenge and potentially make you reconsider or significantly revise the Stabilized Contribution Account? Are there any known cases that already feel like uncomfortable stretches?"
      *   *Likely Follow-up:* "If you point to cases where function ascription seems clear but stabilization history is ambiguous or absent, how would you rule out the possibility that your account is simply *fitting the data* rather than being genuinely explanatory? What test could decisively falsify the *necessity* of the historical condition?"

  **Key features incorporated:**

  *   **Conversational Tone:** Uses phrases like "Could you elaborate...", "Help me understand...", "Consider this case...", "What's your direct response...".
  *   **Precision on Her Terms:** Directly references "stabilized contribution," "retention profile," "contribution profile," "system persistence," "drift exclusion," "canalization," "transmission."
  *   **Targets Core Tensions:** Explores boundaries (drift vs. stabilization, somatic mutations), challenges (indeterminacy, causal-role objection), applications/limitations (byproducts, environment change, symbiosis/culture, ecosystems, synthetic life/origins).
  *   **Forces Engagement:** Follow-ups anticipate common responses ("it's different," "it's empirical," appeals to future stabilization, pragmatism on individuation, circularity risk) and push back by demanding internal consistency, principled distinctions, and implications.
  *   **Includes Requested Cases:** Somatic mutation (Q7), Synthetic/First Replicators (Q8), Ecosystem-level (Q9).
  *   **Seeks Falsification:** Explicitly asks for potential weaknesses (Q10).

  These questions assume familiarity with her specific arguments but avoid jargon overload. They aim to elicit clarification, defense, and exploration of the view's edges and foundations. Good luck with the interview!
