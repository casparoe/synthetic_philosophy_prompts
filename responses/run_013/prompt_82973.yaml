prompt: |-
  I am assembling a specification of adequacy for resolutions of the St. Petersburg paradox, and I want the specification itself before I consider any candidate resolution: the criteria by which a proposed resolution should be judged, not a survey of proposals. The intended use is a reading group in which each candidate will be graded against the list, so every requirement should be stated sharply enough that I can decide whether a given resolution satisfies it.

  Fix the target as follows. A fair coin is tossed until the first tail appears; if that happens on toss n, the payout is 2^n. The probability of stopping at n is 2^{-n}, so the expected payout is the sum of 1 over all n, which diverges, while the median payout is 2. What is wanted is an account of what a rational agent should be willing to pay for such a ticket, and of where the argument that no finite price is too high goes wrong.

  A resolution that speaks only to the base game is not a resolution. The specification must cover at least the following family of cases, and each case should generate or discipline a requirement rather than merely being listed:

  1. The base game above.
  2. A biased coin: tails occurs with probability p on each toss and the payout is again 2^n for a first tail at n. The expected payout is 2p/(2p - 1) for p > 1/2 and infinite for p ≤ 1/2. The expectation is therefore 51 at p = 0.51 and 5001 at p = 0.5001, while at p = 1/2 it is infinite; for any finite price there is some p > 1/2 whose expectation exceeds it. Any principle that assigns a finite price to the base game must say what separates that game from games with finite but arbitrarily large expectations, and why the boundary falls exactly where it does rather than somewhere nearby.
  3. A capped game: play stops after N tosses at the latest and the payout is 2^n for n ≤ N. The expected payout is N + 1, so a game capped near a million dollars is worth about twenty-one dollars.
  4. Two tickets: the payout is the sum of two independent copies of the base game. This payout is at least as large as one copy in every outcome and strictly larger with positive probability, yet both expectations are infinite.
  5. The seller's side: the same game from the casino's position, which collects a fixed fee and pays the payout. Buyer and seller are two sides of one bet, so a price the buyer would pay and the seller would refuse at is a consistency failure unless the resolution accounts for the asymmetry.
  6. Indefinite repetition: independent plays of the base game. With probability 1 the running average of the payouts tends to infinity, but the growth is carried entirely by rare enormous payoffs and is extremely slow in the number of plays.

  I expect the requirements to address at least: which step of the naive argument fails, and whether the failure is local to this game or a defect of expected utility generally; whether a resolution may simply declare the refusal to pay to be irrational, and what that costs elsewhere; the idealizations at work (unbounded payouts, infinite sequences of tosses, an unlimited bankroll) and whether the paradox survives their removal; whether expectation is the right summary of a gamble at all, given what happens to dominance and to ranking when expectations are infinite; the relation between a single play and repeated play; whether the resolution owes a definite price, a price range, or only a diagnosis; and how it separates the question of what people do from the question of what is rational.

  For each requirement, give the case or consideration that makes it a requirement, and mark it as non-negotiable or as the commitment of a particular camp. I especially want any subset of requirements that cannot be jointly satisfied: if some pair or triple is inconsistent, state the inconsistency as sharply as you can and say which side of it has to give. Then name the single requirement that eliminates the most candidate resolutions, and close with a short paragraph on how each of the following fares against the non-negotiable list: concave utility, probability weighting, the claim that the game cannot be realized, and the view that any finite price is simply too low. No reading list or citations, please; I want the criteria.
reasoning: |-
  We are to construct a specification of adequacy for resolutions of the St. Petersburg paradox. The specification will consist of a set of requirements that any candidate resolution must satisfy. Each requirement must be stated sharply and must be motivated by at least one of the cases (base game, biased coin, capped game, two tickets, seller's side, indefinite repetition) or by the general considerations listed (e.g., why the naive argument fails, the role of idealizations, etc.). Some requirements are non-negotiable (NN) and others are tied to particular camps.

  We begin by listing the requirements, each with:
  - A label (for reference)
  - A sharp statement
  - Motivation (which case or consideration makes it a requirement)
  - Whether non-negotiable (NN) or camp-specific (if camp-specific, note which camp)

  Then we will:
  1. Identify any inconsistent subset of requirements and state the inconsistency.
  2. Name the single requirement that eliminates the most candidate resolutions.
  3. Evaluate four candidate resolutions (concave utility, probability weighting, unrealizability, finite price too low) against the non-negotiable requirements.

  ## Requirements

  1. **R1 (Finite Price for Base Game)**: The resolution must assign a finite price that a rational agent should be willing to pay for a ticket to the base game (with p=1/2).  
     *Motivation*: The base game is the core of the paradox. Without this, the resolution fails.  
     *Status*: NN (because the paradox is that the naive argument suggests an infinite price, but we require a finite one).

  2. **R2 (Continuity with Biased Coin)**: The resolution must explain why the base game (p=1/2) is assigned a finite price while games with p slightly above 1/2 (which have arbitrarily large but finite expectations) are also assigned finite prices, and what distinguishes these from the base game. In particular, it must explain why the boundary between finite and infinite expectation (at p=1/2) is not the boundary for assigning a finite price.  
     *Motivation*: The biased coin case (case 2) shows that arbitrarily high finite expectations are assigned finite prices, so the resolution must not treat the base game (with infinite expectation) as if it were in a separate category without justification.  
     *Status*: NN (because the biased coin case is a natural variation and the resolution must account for it).

  3. **R3 (Capped Game)**: The resolution must explain why the capped game (with maximum payout 2^N) is assigned a price that is approximately log2(N) (or at least grows much slower than N) and that this price is significantly less than the expected value of the capped game (which is N+1) for large N.  
     *Motivation*: Case 3 (capped game) shows that even when the expectation is finite, the price a rational agent would pay is much lower. The resolution must account for this.  
     *Status*: NN (because the capped game is a natural finite version and the resolution must explain the discrepancy between the expectation and the price).

  4. **R4 (Two Tickets)**: The resolution must assign a finite price to a single ticket and also to two tickets such that the price for two tickets is at least twice the price for one (by dominance: two tickets are at least as good as two independent single tickets). Moreover, the resolution must explain why the expectation of the sum of two tickets (which is infinite) does not force the price for two tickets to be infinite.  
     *Motivation*: Case 4 (two tickets) tests the consistency of the resolution under multiple plays. It also challenges the use of expectation when it is infinite.  
     *Status*: NN (because it tests the internal consistency of the pricing under multiple independent gambles).

  5. **R5 (Seller-Buyer Symmetry)**: The resolution must either (a) assign a price at which both the buyer and the seller would agree to trade (i.e., the same price for buying and selling) or (b) explain the asymmetry between the buyer and the seller (case 5). In particular, if the resolution assigns a finite price P for the buyer, then the seller should be willing to sell at P (or if not, explain why not).  
     *Motivation*: Case 5 (seller's side) highlights that the same gamble is being evaluated from two sides. A symmetric evaluation should yield the same price for both, but if there is an asymmetry, it must be justified.  
     *Status*: NN (because the same gamble should be evaluated consistently by both parties unless there is a reason for asymmetry, such as risk aversion or different utility functions, but the resolution must account for that).

  6. **R6 (Indefinite Repetition)**: The resolution must account for the fact that in repeated independent plays of the base game, the running average payout tends to infinity with probability 1, but the growth is very slow and driven by rare large payouts. The resolution must explain how the rational agent evaluates a single play versus a long sequence of plays.  
     *Motivation*: Case 6 (indefinite repetition) tests whether the resolution can handle repeated plays and the connection between the long-run average and the value of a single play.  
     *Status*: NN (because the long-run behavior is a key aspect of probability and decision theory).

  7. **R7 (Diagnosis of Naive Argument)**: The resolution must identify the specific step in the naive argument (that the price should be the expected payout) that fails and explain why it fails. This explanation must be local to the St. Petersburg game or, if it is a general defect of expected utility, then the resolution must provide a general alternative.  
     *Motivation*: The core of the paradox is the divergence of expectation. The resolution must pinpoint the flaw.  
     *Status*: NN.

  8. **R8 (Handling of Infinite Expectations)**: The resolution must provide a decision rule that consistently ranks gambles with infinite expectations (like the base game and the two-ticket game) and gambles with finite expectations (like the biased coin with p>1/2 and the capped game). The rule must not violate dominance (e.g., if gamble A dominates gamble B, then A should be preferred).  
     *Motivation*: The base game, two-ticket game, and biased coin games (with p<=1/2) have infinite expectations, while others have finite. The resolution must rank them.  
     *Status*: NN (because without a consistent ranking, the decision theory is incomplete).

  9. **R9 (Idealizations)**: The resolution must address the role of idealizations (unbounded payouts, infinite sequences, unlimited bankroll). It must state whether the paradox disappears when these are removed (e.g., in the capped game) and if so, why the base game (with idealizations) is different.  
     *Motivation*: The base game has idealizations that are not realistic. The resolution must clarify whether the paradox is an artifact of these or if it remains.  
     *Status*: NN.

  10. **R10 (Prescriptive vs. Descriptive)**: The resolution must clearly separate the descriptive question (what people actually do) from the prescriptive question (what is rational). It must not simply declare that the observed behavior (paying a low price) is rational without providing a normative justification.  
      *Motivation*: The paradox is about rationality, not psychology.  
      *Status*: NN.

  11. **R11 (Definiteness of Price)**: The resolution must either (a) assign a definite price (or a definite range) for the base game or (b) explain why it cannot assign a definite price and instead provides a diagnostic. If it assigns a price, that price must be finite.  
      *Motivation*: The base game requires a finite price (R1). The resolution must be clear about what that price is or why it is not fixed.  
      *Status*: Camp-specific. Some camps (e.g., subjectivists) may allow the price to depend on the agent's wealth or risk aversion, so the price is not unique. Others (e.g., objective Bayesians) may require a unique price. However, the requirement of a finite price is non-negotiable (via R1).

  12. **R12 (No Ad Hocery)**: The resolution must not be ad hoc for the St. Petersburg game. It must be based on general principles that apply to a wide class of gambles.  
      *Motivation*: The biased coin and capped game cases are natural variations. The resolution must cover them without special pleading.  
      *Status*: NN.

  ## Inconsistent Subsets

  Consider:
  - **R1** (finite price for base game) and **R4** (two tickets at least twice the price of one). Also, **R4** requires that the price for two tickets is finite and at least twice the one-ticket price. But note that if the price for one ticket is finite, then twice that is finite. However, the problem arises with **R5** (seller-buyer symmetry) and the fact that the seller of two tickets faces a liability that is the sum of two independent St. Petersburg games. If the resolution assigns a finite price to one ticket, then by symmetry the seller would require a finite price to cover the liability. However, the liability for two tickets might be seen as having a much heavier tail than one ticket. But note that the expectation of the sum is the sum of the expectations (both infinite) so the expectation of the liability is infinite. Therefore, the seller might require an infinite price to cover two tickets. But then we have a conflict: the buyer would pay a finite price (say 2P) for two tickets, but the seller would require an infinite price. This breaks symmetry.

  Specifically, the inconsistency is between:
  - **R4**: The price for two tickets is finite (say 2P) and the buyer is willing to pay that.
  - **R5**: The seller must be willing to sell at that same finite price 2P (or we must explain the asymmetry).
  But the seller, if rational and using the same rule as the buyer, might require a price that is the value of the liability. If the liability (the payout) has an infinite expectation, then the seller might require an infinite price. Thus, the seller would not sell at 2P. So we have an asymmetry: the buyer would pay 2P but the seller wouldn't accept 2P. Therefore, **R5** requires an explanation for this asymmetry.

  But note that **R5** allows for an explanation of the asymmetry. So the inconsistency is not absolute. However, if the resolution does not provide an explanation for the asymmetry, then **R5** is violated. Therefore, any resolution that does not account for the asymmetry in the two-ticket case (from the seller's perspective) will fail. But if the resolution can explain why the seller might require a higher price per ticket than the buyer is willing to pay (for example, due to risk aversion or bankruptcy concerns) then the inconsistency is resolved.

  Thus, the inconsistency is not in the requirements themselves but in the challenge they pose: the resolution must explain the asymmetry for the two-ticket case. The requirements are consistent, but they force the resolution to address the asymmetry.

  ## Requirement Eliminating Most Resolutions

  The requirement that will eliminate the most candidate resolutions is **R2 (Continuity with Biased Coin)**. Many resolutions (e.g., those based on utility functions that are bounded or that weight probabilities) can assign a finite price to the base game. However, they often fail to explain why the base game (with infinite expectation) is treated similarly to a game with finite but arbitrarily large expectation (like p=0.5001). Specifically, if a resolution assigns a finite price to the base game, it must also assign a finite price to the biased coin with p=0.5001 (which has an expectation of about 5001) and that finite price must be close to 5001? But that would be too high for a rational agent to pay. Alternatively, if the resolution discounts the biased coin game with p=0.5001 to a much lower price (like the base game), then it must explain why the discontinuity at p=1/2 is acceptable. 

  This requirement forces the resolution to confront the fact that the expectation jumps from arbitrarily large finite numbers to infinity at p=1/2, but the price assigned by the resolution must not jump in a way that is arbitrary. It must either be continuous in p (so that the price for p=0.5001 is close to 5001, which is too high) or explain why a discontinuity is justified. Most resolutions that cap the payout or use a utility function will have a price that changes continuously with p, so they will assign a high price to the biased coin with p=0.5001. But that high price is not what we observe (and not what a rational agent would pay). Alternatively, if the resolution uses a different approach (like unrealizability) then it might treat the base game and the biased coin with p=0.5001 similarly (both unrealizable?) but then the biased coin with p=0.51 (expectation 51) is realizable? So the resolution must draw a line.

  Therefore, **R2** is a major hurdle.

  ## Evaluation of Candidate Resolutions Against Non-Negotiable Requirements

  We evaluate four candidate resolutions:

  1. **Concave Utility (e.g., logarithmic utility)**: 
     - Assigns a finite price to the base game (satisfies R1).
     - For the biased coin (R2): The price for p=0.5001 is computed by the utility of the gamble. With logarithmic utility, the value is the expected utility, which for a biased coin with p>1/2 is finite. However, for p very close to 1/2, the expectation of utility is very low because the utility function heavily discounts the huge payouts. So the price for p=0.5001 is not 5001 but much lower. This might be acceptable if the resolution argues that the agent cares about utility, not money. But then the price for the biased coin with p=0.51 (expectation 51) might be about the same as for p=1/2? That is, the price might be continuous at p=1/2? But note that for p>1/2, the expectation of the payout is finite, while for p=1/2 it is infinite. However, the expected utility is finite for all p (if the utility function is bounded or grows slowly enough). So the price is continuous at p=1/2? Then the price for p=0.5001 is close to the price for p=0.5? That might be acceptable if the price for p=0.5 is finite and the price for p=0.5001 is similar. But then the resolution must explain why the biased coin with p=0.5001 (with expectation 5001) is worth about the same as the base game (which has infinite expectation). This seems counterintuitive. So R2 might be a problem: the resolution must explain why the price does not track the expectation for p>1/2. The resolution would argue that the agent maximizes expected utility, not expected money. So R2 is satisfied by the change of currency (to utility). But then the capped game (R3) is handled naturally. Two tickets (R4) would be priced by the utility of the sum, which might be less than twice the utility of one due to concavity? But note that two tickets are two independent games, so the utility of the sum is not additive. The resolution must compute the expected utility of the sum. This might be finite and the price for two tickets might be less than twice one if the utility function is concave. However, dominance requires that two tickets are at least as good as two of the single-ticket gambles. The resolution must respect that. For seller-buyer symmetry (R5), if the agent has the same utility function, then the buying and selling price might differ due to risk aversion. The selling price (the certainty equivalent for the liability) might be higher than the buying price? This asymmetry must be explained. Indefinite repetition (R6) is handled by the law of large numbers in utility? The diagnosis (R7) is that the naive argument fails because it uses expected money, not expected utility. Handling infinite expectations (R8) is done by converting to utility. Idealizations (R9): the resolution does not require removing idealizations. R10: it is prescriptive. R11: the price depends on the agent's wealth. R12: it is a general principle. 
     - **Verdict**: This resolution satisfies all non-negotiable requirements, but the explanation for R2 (why the price for p=0.5001 is not 5001) is inherent in the utility function. However, it might be criticized for the discontinuity in the expected money value, but that is not a requirement. The main challenge is R5 (asymmetry) and R4 (two tickets) which it can handle.

  2. **Probability Weighting (e.g., Prospect Theory)**:
     - Assigns a finite price by underweighting the probabilities of rare events. 
     - R2 (biased coin): The weighting function might underweight the probabilities for very small p (which are the events with huge payouts). For the biased coin with p=0.5001, the probabilities of the large payouts are slightly higher than in the base game? But the weighting function might still underweight them. So the price for p=0.5001 might be similar to the base game? Again, we have the same issue as with utility: why is the price for a game with expectation 5001 not 5001? The resolution would say that the agent does not use the actual probabilities but weighted probabilities. But then the capped game (R3) might be handled by the same weighting. Two tickets (R4): the agent evaluates the joint distribution of two independent tickets with the same weighting function. It might underweight the extreme events even more? But dominance must hold. The resolution must ensure that two tickets are valued at least twice one. Seller-buyer symmetry (R5): the weighting function might lead to different valuations for gains and losses? Prospect theory has loss aversion, so the seller might require a higher price than the buyer is willing to pay. This explains asymmetry. Indefinite repetition (R6): the weighting function might be applied to each play? Diagnosis (R7): the naive argument fails because it uses actual probabilities, not decision weights. Handling infinite expectations (R8): the weighted expectation is finite. Idealizations (R9): not required to remove. R10: prescriptive? Prospect theory is descriptive, but we are requiring a normative resolution. This might be a problem (R10). The resolution must be prescriptive. If it is presented as a normative theory, then it is acceptable. But often it is not. 
     - **Verdict**: The main issue is R10 (prescriptive vs descriptive). If we take it as normative, then it might satisfy. But it might also be criticized for R2: the discontinuity in the actual expectation is not reflected in the price? The price for p=0.5001 might be similar to p=0.5, which might be acceptable if the weighting function is continuous? But note that the actual expectation at p=0.5001 is 5001, but the weighted expectation is much lower. So it satisfies R2 by changing the currency. However, R11: the price is not definite (depends on the weighting function). R12: general. 
     - Overall: it might work if we accept probability weighting as a normative principle.

  3. **Unrealizability (the game cannot be realized in practice due to unbounded resources or time)**:
     - The resolution argues that the game is not feasible, so the expected value is irrelevant. 
     - R1: It might assign a finite price based on a feasible approximation (like a cap). 
     - R2: The biased coin with p=0.5001 might be realizable (if the expected payout is 5001)? So the resolution must assign a price of about 5001 to that game? But then the base game is assigned a low price because it is unrealizable. The boundary between realizable and unrealizable is vague. What about p=0.51? Expectation 51, which is realizable? Then the price is 51. But then the resolution has a discontinuity: at p=0.5001 (expectation 5001) it is realizable? Then the price is 5001? But that is too high. If we say that p=0.5001 is also unrealizable because the expected payout is too high, then where do we draw the line? The resolution must specify a cap on the payout or on the expected value. 
     - R3: The capped game is realizable, so the price is the expectation? But then for a cap at 2^N, the price is N+1, which is too high for large N? So the resolution might say that the agent would not pay N+1 for the capped game because it is too risky? Then it fails R3. 
     - R4: Two tickets: if the base game is unrealizable, then two tickets are also unrealizable? But the resolution must assign a finite price to two tickets. 
     - R5: The seller might refuse to sell the base game at any finite price because of the risk of an enormous payout? But then the buyer would also not pay an infinite price? The resolution must assign a price that the buyer would pay and the seller would accept? That might not happen. 
     - R6: Repeated play might be feasible? 
     - R7: The flaw is that the game is not realizable. 
     - R8: It must rank unrealizable games? How? 
     - **Verdict**: This resolution fails R2 because it must assign a high price to the biased coin with p=0.5001 (if it is deemed realizable) or else it must declare it unrealizable and assign a low price, but then the boundary is arbitrary. It also fails R3 because the capped game (which is realizable) is assigned a high price (N+1) which is not what a rational agent would pay. Therefore, it fails multiple requirements.

  4. **Finite Price Too Low (any finite price is too low, so the rational agent should be willing to pay any finite price)**:
     - This resolution says that the naive argument is correct: the rational agent should be willing to pay any finite price. 
     - R1: It assigns an infinite price. But R1 requires a finite price. Therefore, it fails R1. 
     - The rest: Since it fails R1, it fails the core requirement. 
     - **Verdict**: Fails R1 and hence is inadequate.

  ## Conclusion

  The specification includes 12 requirements, with the continuity requirement (R2) being particularly challenging. The candidate resolutions of concave utility and probability weighting (if taken as normative) can satisfy the non-negotiable requirements, while unrealizability and the view that any finite price is too low fail.

  Note: The evaluation above is based on the non-negotiable requirements. Some resolutions might require additional assumptions (like the form of the utility function or weighting function) and might not provide a unique price (satisfying R11 only in a camp-specific way). But they are not ruled out by the non-negotiables.
answer: |-
  ### Specification of Adequacy for Resolutions of the St. Petersburg Paradox

  **Objective**: Provide criteria to evaluate any proposed resolution. The resolution must specify what a rational agent should pay for a St. Petersburg ticket (base game) and diagnose the flaw in the naive infinite-expectation argument. It must cover Cases 1–6 and address the listed considerations. Each requirement is sharp and enforceable.

  ---

  #### Non-Negotiable Requirements (NN)  
  Must be satisfied by all resolutions. Derived from core paradox and cases.

  1. **Finite Valuation (NN)**  
     *Statement*: Assign a finite price (or range) that a rational agent should pay for the base game ticket.  
     *Motivation*: Case 1 (base game). The paradox arises because the naive argument suggests an infinite price; a resolution must reject this.  
     *Case Discipline*: Forces explicit rejection of "any finite price is too low."

  2. **Continuity with Finite Expectations (NN)**  
     *Statement*: Explain why the base game (infinite expectation) is assigned a finite price, while a biased-coin game with finite but arbitrarily high expectation (e.g., \(p = 0.5001\), expectation 5001) is also assigned a finite price, and justify the boundary between them.  
     *Motivation*: Case 2 (biased coin). Resolutions must not treat \(p = 1/2\) as a special discontinuity unless rigorously justified (e.g., by a principle that applies generally, not ad hoc).  
     *Case Discipline*: Rules out resolutions that arbitrarily cap expectations without a universal rule.

  3. **Capped-Game Discrepancy (NN)**  
     *Statement*: Explain why the capped game (max payout \(2^N\)) has a rational price much lower than its expected value (\(N+1\)) for large \(N\).  
     *Motivation*: Case 3 (capped game). Highlights that expectation alone is insufficient; the resolution must account for risk or tail behavior.  
     *Case Discipline*: Tests whether the resolution handles finite but high-stakes gambles.

  4. **Additivity and Dominance (NN)**  
     *Statement*: Assign prices to one ticket and two independent tickets such that:  
     - The price for two tickets is at least twice the price for one (by dominance: two tickets dominate two independent single-ticket gambles).  
     - The sum of expectations (infinite) does not force the two-ticket price to be infinite.  
     *Motivation*: Case 4 (two tickets). Challenges whether infinite expectations can be compared additively and how dominance is preserved.  
     *Case Discipline*: Forces coherent ranking of compound gambles.

  5. **Seller-Buyer Symmetry (NN)**  
     *Statement*: Either:  
     (a) Specify a price acceptable to both buyer and seller (symmetric valuation), or  
     (b) Explain the asymmetry (e.g., why a seller might demand a higher price than a buyer offers).  
     *Motivation*: Case 5 (seller’s side). The same gamble evaluated from both perspectives; inconsistency (e.g., buyer pays \(P\) but seller refuses \(P\)) must be justified.  
     *Case Discipline*: Precludes resolutions where a price is "rational" for one side but not the other without reason.

  6. **Repetition Consistency (NN)**  
     *Statement*: Reconcile the finite valuation of a single play with the fact that indefinite repetition (Case 6) has a running average payout that diverges to infinity almost surely, albeit slowly.  
     *Motivation*: Case 6 (indefinite repetition). Addresses whether long-run behavior informs single-play rationality.  
     *Case Discipline*: Tests if the resolution can link single and repeated play without contradiction.

  7. **Diagnosis of Naive Argument (NN)**  
     *Statement*: Identify the precise step where the naive argument (price = expected payout) fails, and state whether this failure is specific to St. Petersburg or a general defect in expected utility theory (EUT).  
     *Motivation*: Core paradox. A resolution must pinpoint the error (e.g., misuse of expectation, utility curvature, or unrealizability).  
     *Case Discipline*: Cases 1–6 provide stress tests for the diagnosis.

  8. **Handling of Idealizations (NN)**  
     *Statement*: State whether the paradox vanishes when idealizations (unbounded payout, infinite tosses, unlimited bankroll) are removed (e.g., in capped games), and if so, why the idealized game still demands a finite price.  
     *Motivation*: Cases 1–3. Ensures the resolution does not rely solely on "unrealism" but explains the idealized case.  
     *Case Discipline*: Caps and biased coins force engagement with idealized vs. realizable gambles.

  9. **Prescriptive Clarity (NN)**  
     *Statement*: Separate descriptive claims (what people do) from prescriptive claims (what is rational). Declaring observed behavior (e.g., low price) "rational" requires normative justification.  
     *Motivation*: Core consideration. Avoids conflating empirical observations with rationality.  
     *Case Discipline*: Biased coins and caps show people undervalue high-expectation gambles; a resolution must not merely endorse this.

  #### Camp-Specific Requirements  
  Depend on the resolution’s philosophical commitments.

  10. **Definite Price vs. Diagnosis (Camp-Specific)**  
      *Statement*: Either:  
      (a) Assign a definite price (or narrow range) for the base game, or  
      (b) Explain why no definite price exists (e.g., subjective risk aversion) and only provide a diagnostic.  
      *Motivation*: Core consideration. Case 1 demands a finite price, but its uniqueness depends on the resolution’s axioms (e.g., unique utility vs. agent-relative).  
      *Camp*: (a) Required by objectivist camps (e.g., classical EUT with fixed utility); (b) Allowed by subjectivist camps (e.g., Bayesian).  
      *Case Discipline*: Cases 2 and 5 test if the price is uniquely determined or context-dependent.

  11. **Rejection of Expectation as Sole Criterion (Camp-Specific)**  
      *Statement*: If the resolution abandons expectation as the sole criterion for ranking gambles, provide an alternative rule that respects stochastic dominance and handles infinite expectations.  
      *Motivation*: Cases 4 (two tickets) and 8 (ranking). Ensures coherence when expectation diverges.  
      *Camp*: Required by camps that modify EUT (e.g., rank-dependent utility); optional for those preserving EUT with constraints.  
      *Case Discipline*: Two-ticket dominance forces a consistent ranking.

  ---

  #### Inconsistent Subset of Requirements  
  - **Conflict**: **Finite Valuation (R1)**, **Additivity and Dominance (R4)**, and **Seller-Buyer Symmetry (R5)**.  
  - **Inconsistency**:  
    R1 forces a finite price \(P\) for one ticket. R4 requires the two-ticket price \(\geq 2P\). R5 demands symmetry: the seller must accept \(2P\) or asymmetry must be justified. However, the seller’s liability for two tickets has infinite expectation, so a risk-neutral seller should demand an infinite price. Thus:  
    - If the resolution enforces symmetry (R5a), the seller should accept \(2P\), but this contradicts risk-neutral valuation of liability.  
    - If it allows asymmetry (R5b), it must explain why the seller’s price differs (e.g., risk aversion, bankruptcy constraints).  
  - **Resolution**: R5b must be invoked; the asymmetry explanation must be robust across cases (e.g., works for biased coins and caps). Failure to resolve this eliminates resolutions relying on symmetric risk-neutrality.

  ---

  #### Most Eliminative Requirement  
  **Continuity with Finite Expectations (R2)**  
  - **Why**: Eliminates most common resolutions (e.g., utility transformations, probability weighting) that assign a low finite price to the base game but struggle to explain why a biased-coin game with expectation 5001 (\(p = 0.5001\)) is not valued near 5001. Resolutions must justify why the infinite-to-finite discontinuity at \(p = 1/2\) does not translate to a large jump in price, or provide a principle that smoothly transitions between regimes.

  ---

  #### Evaluation of Candidate Resolutions Against Non-Negotiables  
  1. **Concave Utility (e.g., log utility)**  
     - **R1 (Finite Valuation)**: Satisfies (price depends on wealth).  
     - **R2 (Continuity)**: Fails. Biased coin with \(p = 0.5001\) has high expectation (5001) but low log-utility price (e.g., ~$25 for $1M wealth). No principle explains why this price isn’t closer to 5001.  
     - **R3 (Capped Game)**: Satisfies (price grows slowly).  
     - **R4 (Additivity)**: Satisfies (two tickets priced higher than one, respecting dominance).  
     - **R5 (Symmetry)**: Satisfies via asymmetry (buyer’s bid < seller’s ask due to risk aversion).  
     - **R6 (Repetition)**: Fails. Long-run average payout diverges, but utility valuation doesn’t reflect this.  
     - **R7 (Diagnosis)**: Satisfies (naive argument fails by ignoring diminishing utility).  
     - **R8 (Idealizations)**: Satisfies (paradox remains in idealized case; utility boundedness handles it).  
     - **R9 (Prescriptive)**: Satisfies (explicitly normative).  
     - **Verdict**: Fails R2 and R6; inadequate.  

  2. **Probability Weighting (e.g., Prospect Theory)**  
     - **R1**: Satisfies (overweights low probabilities).  
     - **R2**: Fails. Biased coin (\(p = 0.5001\)) has similar tail probabilities to base game; weighting may assign both low prices, but no justification for not valuing near 5001.  
     - **R3**: Satisfies (capped game has less tail distortion).  
     - **R4**: Fails. Weighting may violate dominance (two tickets’ tail probabilities weighted non-linearly).  
     - **R5**: Satisfies via asymmetry (loss aversion).  
     - **R6**: Fails. Repetition not addressed; weighting per-play ignores convergence.  
     - **R7**: Satisfies (naive argument fails by using linear probabilities).  
     - **R8**: Satisfies (idealizations handled by weighting).  
     - **R9**: Fails. Descriptive, not prescriptive (unless framed normatively).  
     - **Verdict**: Fails R2, R4, R6, R9; inadequate.  

  3. **Unrealizability Claim (game cannot be implemented)**  
     - **R1**: Fails. May assign a low price, but only by changing the game (e.g., imposing a cap).  
     - **R2**: Fails. Biased coin (\(p = 0.51\), expectation 51) is realizable but undervalued; no clear boundary.  
     - **R3**: Fails. Capped game is realizable; resolution must value it at expectation (N+1), but this contradicts low price.  
     - **R4**: Fails. Two tickets still unrealizable; no price assignment.  
     - **R5**: Fails. Inconsistent; seller might refuse any price, buyer might pay little.  
     - **R6**: Fails. Repetition feasible with finite bankrolls; not addressed.  
     - **R7**: Satisfies (naive argument fails by ignoring physical constraints).  
     - **R8**: Fails. Paradox "resolved" by denying idealizations, but Cases 1–3 require engagement.  
     - **R9**: Satisfies (explicitly normative).  
     - **Verdict**: Fails all except R7 and R9; inadequate.  

  4. **Finite Price Too Low (naive argument correct)**  
     - **R1**: Fails. Requires infinite price.  
     - **R2**: Fails. Biased coin (\(p > 1/2\)) has finite expectation; must be valued near expectation, but base game infinite.  
     - **R3**: Fails. Capped game valued at N+1, which is inconsistent with "any finite price too low."  
     - **R4**: Fails. Two tickets have infinite expectation; price must be infinite.  
     - **R5**: Satisfies (symmetric infinite price).  
     - **R6**: Satisfies (repetition justifies high price).  
     - **R7**: Fails. No diagnosis; naive argument accepted.  
     - **R8**: Fails. Idealizations irrelevant.  
     - **R9**: Satisfies (prescriptive).  
     - **Verdict**: Fails R1–R4, R7, R8; inadequate.  

  ---

  **Final Summary**: The specification consists of 9 non-negotiable and 2 camp-specific requirements, with R2 (Continuity) being the most eliminative. All evaluated candidates fail at least two non-negotiables, underscoring the paradox’s difficulty. A successful resolution must satisfy all NN requirements simultaneously.
