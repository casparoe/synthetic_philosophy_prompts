prompt: |-
  Background first: I'm a software engineer, no real philosophy training (one ethics elective I mostly slept through), but I've lived in a few countries and worked with people from a lot more, and I keep noticing that my gut reactions to "corruption" type situations don't line up with each other. I want you to tell me what principle, if any, actually captures my reactions, and then test it to destruction.

  Here are the cases and my honest gut verdicts. I'm being as concrete as I can.

  - A customs officer at the border takes $50 from me "for the paperwork" and moves my shipment up the queue. He was going to process it anyway, just slower. I think this is corruption, full stop, not fine.
  - After a friend at a company puts in a good word that helps me land a contract there (he wasn't the one deciding), I give him a nice bottle of wine. I think this is completely fine, just thanking someone.
  - A company hires the son of the minister who regulates that company. The son is genuinely qualified and went through the normal process. I can't shake the feeling that this is corrupt, even though nothing improper happened that I can point to.
  - My uncle gets me an internship at his firm. I'm qualified. This feels fine, obviously just family.
  - A politician steers a highway to her own district when two districts needed it equally badly. Sleazy, wasteful, I'd vote against her, but I don't actually feel it's corruption — more like bad politics.
  - A nurse in a public hospital gets slipped some money to bring my mother in to be seen sooner. It's officially free; without the payment she'd be seen, just later in the week; the medical decision is identical either way. This feels wrong to me, and I'd still do it, and I'd call it corruption.
  - A company donates to a politician's campaign, and later the politician takes a meeting with them. Fine. That's just how it works.
  - Same donation, but now the meeting is followed by a contract award that the company was about to lose on the merits. That's corrupt, clearly.

  The tentative principle I'd write down if you forced me: it's corruption when someone in a position of trust receives a private benefit that's tied to how they exercise that trust. But I can already tell it's either too loose or too tight in places — e.g. it seems to nail the nurse and the customs officer, but then why is the campaign donation fine, and why is the minister's qualified son dirty while my qualified uncle's-nephew arrangement isn't? And the wine to my friend — a private benefit tied to how he exercised... something? — should be corrupt by that rule and obviously isn't.

  What I want:

  1. A principle, or a small set of competing ones, stated precisely enough that I could apply it to a new case without asking you again. For each clause, tell me which of my cases it exists to handle.
  2. Its verdicts on a few cases I haven't listed. In particular: a purely private-sector version of the minister's-son case (a startup hires the CEO's college roommate, who's qualified); a gift to a public school teacher; a case where the official is elected rather than appointed; and a case where the "bribe" is a favor in kind rather than cash.
  3. An honest statement of which of my verdicts the principle can't accommodate. I'd rather drop a verdict than keep some Frankenstein rule that saves all of them — tell me which verdict is the one to give up.
  4. And settle the thing I actually keep going back and forth on: a "facilitation payment" for a permit that I'm legally entitled to, which will be granted either way, but takes six months without the payment and two weeks with it. Some days I feel certain it's just case #1 with extra steps; other days it feels more like tipping the nurse, or maybe like nothing at all. Where does your principle put it, and does my wavering itself tell you something about the principle?

  One more thing, and don't dodge it: am I just imposing some Western or American standard on arrangements that are normal and even expected elsewhere, or does the principle you land on say something that holds regardless of the local norms? If the honest answer is "it's relative," say so and tell me what that does to the rest of your answer.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a software engineer without formal philosophy training but have lived in multiple countries and noticed inconsistencies in their gut reactions to corruption. Their examples range from customs bribes to nepotism in hiring. The main challenge is to find a consistent principle that explains their judgments.

  First, I need to analyze each case they provided. The customs officer taking $50 feels corrupt to them, while giving wine to a friend for a recommendation is fine. Hiring a minister's qualified son seems corrupt, but an uncle helping a qualified nephew isn't. The nurse taking money for faster service is wrong but something they'd do. Campaign donations are okay unless they directly influence a contract award.

  Their tentative principle about "private benefit tied to position of trust" has issues. For example, the wine gift should be corrupt under that rule but isn't. The key might be distinguishing between personal relationships and institutional roles. The friend and uncle cases involve personal connections, while the customs officer and nurse are abusing their official duties.

  The minister's son case is tricky. Even if qualified, the hire might be seen as repaying a favor or gaining influence, which breaches institutional trust. The uncle's case is personal and doesn't involve public trust. Campaign donations are part of the political system, but direct quid pro quo crosses the line.

  For the facilitation payment, it's similar to the customs case. Even if the outcome is the same, bypassing procedures for payment undermines fairness. The user's wavering might stem from the immediate benefit vs. the systemic harm.

  Cultural relativism is important. Some societies see such payments as normal, but the principle here focuses on institutional betrayal, which might be universal. If local norms accept it, the act isn't seen as betrayal there, but the underlying harm to trust remains if the system is supposed to be impartial.

  Testing the principle with new cases: private sector hiring of a CEO's qualified roommate might feel off but not corrupt because it's a personal relationship, not public trust. A gift to a teacher could be problematic if tied to favors, but a genuine thank you isn't. Elected officials fall under institutional roles. Non-cash bribes, like favors, still count if tied to official acts.

  The hardest case to fit is the politician steering the highway. The user sees it as bad politics, not corruption. The principle might categorize it as a breach of trust because it serves personal gain over public good, but the user's verdict differs. Acknowledging this mismatch is necessary; maybe they view such decisions as within political discretion.

  In conclusion, the core principle is the betrayal of institutional trust for personal gain. Cases involving personal relationships without institutional roles aren't corrupt under this view. The facilitation payment is corrupt, and cultural norms affect perceptions but not the inherent breach of trust if the system claims impartiality.
answer: |-
  Here's a breakdown of your intuitions, the principle that best explains them, and its implications. Your core intuition isn't about the act itself, but about **the violation of an institutional role defined by impartiality.**

  **The Principle: Institutional Betrayal**

  *An act constitutes corruption when:*
  1.  **An agent occupies a role within a system** (public office, regulated profession, fiduciary position) **that is defined by a duty of impartiality towards a specific constituency or purpose.** (This handles: Customs Officer, Minister's Son, Nurse, Politician awarding contract; clarifies why Friend/Wine & Uncle are different).
  2.  **The agent receives a private benefit** (cash, gift, favor, advantage for self/associate).
  3.  **The benefit is accepted or solicited in connection with the agent's exercise of authority or discretion inherent to that role.** (This handles: Customs Officer, Nurse, Politician awarding contract; distinguishes from Friend/Wine).
  4.  **The benefit creates a conflict of interest, breaches the duty of impartiality, or creates the reasonable appearance of such a breach.** (This is crucial: It captures the "taint" in the Minister's Son case and the Nurse case, even if the outcome *might* have been the same. It also explains why the initial donation/meeting is fine but the quid-pro-quo contract isn't).

  **Applying the Principle to Your Cases:**

  1.  **Customs Officer ($50 for faster processing): CORRUPT.**
      *   *Why:* Role (public official) defined by impartial processing. Benefit received ($50). Benefit tied to exercise of role (prioritization). Creates clear conflict/breach of impartiality.
  2.  **Friend/Wine for Good Word: NOT CORRUPT.**
      *   *Why:* Friend isn't in a role *defined by impartiality towards a constituency* regarding hiring. He provided a personal reference, not an exercise of institutional authority. The benefit (wine) is thanks for a personal favor, not tied to a breach of duty.
  3.  **Minister's Son Hired (Qualified): CORRUPT (Appearance).**
      *   *Why:* Minister role defined by impartial regulation. Hiring son provides private benefit (job for son). Benefit is tied to the minister's role (company regulated by minister). Creates *reasonable appearance* of a conflict/breach of impartiality, even if none occurred. The system's integrity is compromised.
  4.  **Uncle's Internship (Qualified): NOT CORRUPT.**
      *   *Why:* Uncle's role (assuming private firm manager) isn't inherently defined by *public* impartiality. Nepotism might be bad practice, but it doesn't inherently breach a *public trust* or institutional impartiality duty like a government minister's role does. The benefit (internship) is within a sphere of personal/family connection, not tied to a public trust role.
  5.  **Politician Steers Highway to Own District: NOT CORRUPT (by your verdict, fits principle).**
      *   *Why:* This is the closest match to your "bad politics" verdict. While sleazy, politicians *are expected* to advocate for their constituents. Discretion in allocation is inherent to the political role. Unless proven the *sole* motive was personal gain (e.g., land value increase *for herself*), this falls within the messy, non-impartial nature of political decision-making, not a clear *institutional betrayal*. Your principle would also call it bad politics unless specific personal enrichment was the clear motive.
  6.  **Nurse (Money for Faster Service): CORRUPT.**
      *   *Why:* Role (public healthcare worker) defined by impartial, needs-based triage. Benefit received (money). Benefit tied to exercise of role (prioritization). Clear breach of impartiality duty, regardless of medical outcome. System integrity is broken.
  7.  **Campaign Donation + Meeting: NOT CORRUPT.**
      *   *Why:* Political fundraising and constituent meetings are recognized parts of the political system. The donation (within legal limits) buys access/attention, not an *impartial exercise of authority*. Access isn't the same as a biased decision.
  8.  **Donation + Favorable Contract Award: CORRUPT.**
      *   *Why:* Now the private benefit (donation) is directly tied to the exercise of impartial authority (contract award) in a way that breaches the duty (awarding based on benefit, not merit). Clear institutional betrayal.

  **Why Your Tentative Principle Failed:**

  *   "Position of trust" was too vague. The *Friend* and *Uncle* hold "trust" but not the specific *institutional impartiality* trust that triggers corruption.
  *   "How they exercise that trust" needed the "reasonable appearance" clause to capture the Minister's Son case and the systemic harm.
  *   It didn't differentiate the *type* of trust inherent to a public office vs. a personal relationship.

  **Testing on New Cases (Applying Institutional Betrayal):**

  1.  **Private-Sector Minister's Son (Startup hires CEO's qualified roommate):**
      *   *Verdict:* **NOT CORRUPT (But potentially unethical/bad practice).**
      *   *Why:* While the CEO has a fiduciary duty to the company, hiring decisions in a private startup aren't governed by the same *public duty of impartiality* as a government minister. It's cronyism/nepotism, not institutional corruption *unless* it breaches specific shareholder agreements or regulations. The "reasonable appearance" standard is weaker in a purely private context without a public trust mandate.
  2.  **Gift to a Public School Teacher:**
      *   *Verdict:* **POTENTIALLY CORRUPT (Appearance), DEPENDS.**
      *   *Why:* Teacher role defined by impartial treatment of students. A significant gift *from a current student/parent* creates a reasonable appearance of conflict/partiality. A small, non-specific end-of-year gift from the class is likely fine. A large gift *after* the student has left is less problematic. Context matters, but the principle flags risk.
  3.  **Elected Official (e.g., Mayor) accepts a personal vacation from a developer with projects before the city council:**
      *   *Verdict:* **CORRUPT (Appearance and Likely Reality).**
      *   *Why:* Role defined by impartial decision-making for the public good. Significant private benefit tied to the official exercising their authority (voting on projects). Creates an undeniable appearance and high probability of a breach of impartiality.
  4.  **"Bribe" is a Favor in Kind (e.g., Customs Officer asks you to "do him a favor" later for faster processing):**
      *   *Verdict:* **CORRUPT.**
      *   *Why:* Identical to Case #1. The benefit is still private (future favor), tied to the exercise of the role (prioritization), and breaches impartiality. The form (cash vs. favor) is irrelevant.

  **Which Verdict Must Be Sacrificed?**

  *   **The Politician Steering the Highway (Case #5).** Your verdict ("bad politics, not corruption") is the least consistent with the *strict application* of the principle. The principle strongly suggests this *is* a form of corruption (breach of impartiality for personal/political gain, misusing public funds). However, your intuition reflects the messy reality that political representation inherently involves advocating for your district, blurring the "impartiality" line. **This is the verdict to drop** if you fully embrace the Institutional Betrayal principle. It *is* a form of institutional corruption ("pork-barreling"), even if common.

  **The Facilitation Payment (Permit):**

  *   **Principle Verdict:** **CORRUPT.** Identical to the Customs Officer (Case #1) and Nurse (Case #6).
      *   Role: Public official granting permits, duty to process impartially and according to rules/timelines.
      *   Benefit: Payment received.
      *   Connection: Tied to exercising role (expediting outside normal procedures).
      *   Breach: Violates impartiality and fairness (jumping the queue), undermining the integrity of the permitting system for private gain.
  *   **Why You Waver:** Your wavering reveals the tension between:
      1.  **Individual Cost/Benefit:** Paying gets you the (legitimate) permit faster. It *feels* efficient, like tipping for service. The harm seems diffuse.
      2.  **Systemic Harm:** Every payment entrenches a system where speed/service depends on bribes, disadvantaging those who can't pay, rewarding corruption, and eroding trust in institutions. The principle focuses on this systemic betrayal.
      *   Your wavering highlights the *immediacy* of the individual benefit vs. the *diffuseness* of the institutional harm. The principle forces you to prioritize the integrity of the institution over individual expediency.

  **Cultural Relativism - The Honest Answer:**

  *   **It's Relative... and Not.** The *principle itself* (Institutional Betrayal) identifies a core harm: violating the impartiality duty inherent to a role within a system. This harm exists *if the system formally claims or is expected to operate with that impartiality*, regardless of local norms.
  *   **However, local norms determine two crucial things:**
      1.  **What Constitutes the "Role":** In a society where officials are *expected* to supplement income through "gifts" for routine services, and this is openly acknowledged, the *formal definition of the role's impartiality* may be weaker or non-existent. The "duty" isn't breached if it wasn't expected. Your principle would *not* label it corruption *in that specific context* because condition 1 (duty of impartiality) isn't fully present or is defined differently. It might still be inefficient or unfair, but not "corruption" under this definition.
      2.  **"Reasonable Appearance":** What constitutes a "reasonable" appearance of conflict varies culturally. Hiring a minister's son might be *more* expected and less "appearance"-creating in some places than others, though the inherent conflict remains.
  *   **Implications:**
      *   Your principle explains *your* gut reactions because you implicitly hold systems to a standard of formal impartiality, even when practice deviates.
      *   Calling something "corruption" using this principle *is* imposing a standard (institutional impartiality) that may not be fully operational or expected in all contexts.
      *   However, the principle also explains *why* such acts are harmful *when the system aspires to or claims impartiality*. The harm (eroded trust, unfairness, inefficiency) is real even if locally normalized. Calling it "corruption" highlights this dissonance between the system's claimed values and its operation.
      *   **Conclusion:** The principle identifies a fundamental type of harm (betrayal of institutional impartiality). Whether a specific act *is* corruption depends on the *formal and widely understood expectations of the role within that specific system*. Your reactions stem from applying a standard of institutional impartiality consistently across cases.

  **Final Summary:** Your intuitions are best captured by the **Institutional Betrayal** principle focusing on breaches of impartiality inherent to specific roles. It explains most of your judgments, requires sacrificing the "highway steering is just bad politics" verdict, decisively labels facilitation payments corrupt, and clarifies that while the *label* depends on local role expectations, the *underlying harm* occurs whenever a system claiming impartiality is subverted for private gain.
