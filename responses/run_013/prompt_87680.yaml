prompt: |-
  I'm writing the final for a senior seminar on institutions and long-run development — it's cross-listed, so I've got econ students and a few philosophy grad students who wandered in for the causal inference. 90-minute in-class exam, closed book, no phones, no internet. The essay section is going to be one question, 20 marks, and I need it to be markable by a TA who isn't me. My problem with every previous version of this question is that it collapses into students reciting the settler-mortality / reversal-of-fortune story and the geography-vs-institutions shouting match, and I genuinely can't tell from the scripts whether they understand what a design is doing or just have the literature memorised.

  So I want the question built around a vignette I'll paste into the exam paper. Roughly:

  In the 1890s two European powers drew a colonial boundary through the middle of the territory of a single ethnolinguistic group. Most of the boundary follows a river for about 150 km. But a stretch of roughly 40 km cuts across open savannah with no river, no ridge, no mineral deposit, and no obvious economic feature, where the line was fixed by a surveyor's straight-edge and a slightly disputed treaty map. On the western side, land was administered under communal tenure, with chiefs recognised as intermediaries and no formal registration. On the eastern side the administration introduced individual title registration in the 1910s to encourage a particular export crop, and that system survived decolonisation more or less intact; the western side's tenure was nationalised and then partially re-customised in the 1970s. A 2019 household survey finds that households on the eastern side report about 40% higher cash income, about two more years of schooling, and much higher rates of adherence to the missionary-introduced religion. The two sides are, by every ethnographic account, the same people, speaking the same language, with the same pre-colonial political organisation. There's also a paved road on the eastern side built in the 1960s, and a smuggling route that crosses the river at two well-known points.

  What I want from you: (1) the exam question itself, phrased so that a student who's memorised the literature and a student who can actually reason about identification get clearly different marks; (2) a model answer of about 700 words; (3) a marking scheme built on five must-hit points, 4 marks each, total 20, with a one-line note per point on how candidates typically miss it, plus a short list of the wrong moves that should cap someone at a pass no matter how well written.

  The question needs to force them to actually locate the identifying variation (and notice that the river stretch and the straight-edge stretch are not the same comparison), to say what the estimand is and whether "institutions" is even one thing here, to deal honestly with the schooling and religion variables (I keep getting answers that just say "control for them"), to say what the result does and doesn't license about the aggregate question of why some nations are rich, and to say what would have falsified it. Don't let the model answer turn into a lecture on why institutions matter — it should be about what this design can and can't carry. And nothing in the question can require them to know a specific paper or author, since they can't look anything up.
reasoning: |-
  Okay, the user is designing a final exam question for a senior seminar that combines econ and philosophy students. They want to avoid students just regurgitating the settler-mortality debate and instead test genuine understanding of causal inference. The challenge is crafting a question that forces students to engage with a specific vignette about a colonial boundary affecting institutions and outcomes.

  The vignette describes a natural experiment where a straight-line border segment splits an ethnolinguistic group, creating variation in land tenure systems. Key elements include the 40km artificial boundary vs. the river boundary, different post-colonial institutions (individual titling vs. communal systems), and modern outcome disparities. The user wants the question to test: 1) identifying the valid comparison area, 2) defining the actual estimand, 3) handling non-institutional outcomes like schooling/religion, 4) interpreting broader implications, and 5) considering falsification.

  For the exam question itself, it needs to be tightly scoped to the vignette. I'll phrase it to demand specific engagement with the geographic variation ("using only the straight-edge segment") and require discussion of what the design can/cannot prove. This prevents generic institution essays.

  The marking scheme should have five 4-point criteria: 1) Recognizing why the straight-edge part is the clean comparison 2) Precise formulation of the local average treatment effect 3) Explaining why schooling/religion shouldn't be controlled for (they're likely mechanisms) 4) Acknowledging limited external validity 5) Describing falsifying scenarios (e.g., pre-existing differences). Each criterion needs specific failure modes noted - like students who miss the river vs. savannah distinction would lose marks.

  Common pitfalls that cap grades at pass level include: conflating the two border segments, treating institutions as monolithic, or suggesting controlling away mechanisms. The model answer must strictly avoid lecturing about institutions generally - it should stick to what this specific design can support.

  For accessibility, I'll ensure no prior knowledge of papers is needed. The vignette contains all required information. Philosophy students should manage by focusing on counterfactual reasoning while econ students can't rely on regression jargon.

  The model answer will demonstrate: isolating the straight-edge segment as the experimental setting, defining the LATE of formalized tenure, explaining downstream outcomes as effects not confounders, emphasizing local causality, and listing falsifications like smuggling routes affecting outcomes. It'll conclude by contrasting this micro-identification with macro-historical debates - exactly what the user wants to distinguish memorization from understanding.
answer: |-
  Here's a complete exam package designed to meet your requirements, forcing engagement with the vignette's specific identification strategy and avoiding rote recitation.

  **1. The Exam Question (To appear on the exam paper):**

  > **Vignette:** (Insert the provided vignette text here)
  >
  > **Question (20 marks):** Using *only* the information provided in the vignette:
  >   a)  Explain why the specific 40km "straight-edge" stretch of the colonial boundary provides a *more compelling basis* for identifying the causal effect of the differing institutional histories on contemporary outcomes than the river-bound stretch. (4 marks)
  >   b)  Precisely define the "effect" this comparison *can* estimate. What specific causal estimand is it most plausibly identifying? (4 marks)
  >   c)  Discuss the significance of the reported differences in schooling and religious adherence between the eastern and western sides. Should a researcher investigating the effect of the land tenure institutions on income statistically "control for" these variables? Why or why not? (4 marks)
  >   d)  To what extent does a finding of higher income on the eastern side based *solely* on this comparison support the broad historical claim that "institutions cause long-run national development"? Explain the limitations. (4 marks)
  >   e)  Describe *one* specific pattern of evidence *within the vignette* that, if observed, would severely undermine confidence in the causal interpretation of the income difference based on the straight-edge boundary comparison. Explain why. (4 marks)

  **2. Model Answer (Approx. 700 words):**

  **(a) Identifying the Valid Comparison:** The key strength of the straight-edge boundary segment for causal inference lies in its arbitrary nature and the homogeneity it bisects. Unlike the river-bound segment, which follows a prominent geographic feature (the river), the straight-edge segment cuts across "open savannah with no river, no ridge, no mineral deposit, and no obvious economic feature." Its placement was determined purely by administrative convenience ("a surveyor's straight-edge and a slightly disputed treaty map"), making it plausibly *as good as random* with respect to pre-existing characteristics of the land and the people living immediately on either side. Crucially, the vignette states that "by every ethnographic account, [the people on both sides] are the same people, speaking the same language, with the same pre-colonial political organisation" and were part of "a single ethnolinguistic group." This suggests minimal pre-treatment differences in culture, social structure, ethnicity, or initial economic potential specifically *along this 40km segment*. In contrast, the river boundary might naturally correlate with settlement patterns, resource access (e.g., fishing, fertile floodplains), or even pre-colonial territorial divisions, making it harder to isolate the effect of the colonial institutional intervention from underlying geographic or historical differences. The straight-edge segment acts as a quasi-experimental "treatment boundary" where assignment to the eastern (individual title) or western (communal tenure) institutional regime was effectively random for those living near this arbitrary line.

  **(b) Defining the Causal Estimand:** This comparison most plausibly identifies the **Local Average Treatment Effect (LATE)** of the *introduction and persistence of formalized individual land title registration* versus the *continuation and later nationalization/re-customization of communal tenure systems* on contemporary household outcomes (like cash income). Specifically, it estimates the *average causal effect* for households (or perhaps villages) located very close to this arbitrary 40km boundary segment who were exposed to one institutional system instead of the other due solely to the colonial boundary placement. It is *not* estimating the effect of "institutions" in a broad, monolithic sense, but rather the effect of this *specific historical institutional shift* concerning land rights and its long-term path dependency in this *specific local context*. The estimand is highly local: it applies to populations near this unique boundary under these specific historical circumstances. It does not directly estimate the effect of institutions in general, nor the effect for populations far from the boundary, nor the effect under different historical contexts.

  **(c) Schooling, Religion, and Controls:** The reported differences in schooling and religious adherence are likely *outcomes* or *mechanisms* of the differing institutional paths, not confounding factors that should be controlled for. The vignette states the individual title system on the east was introduced "to encourage a particular export crop." This suggests the institutional change potentially spurred market integration, altered economic incentives, and attracted mission activity focused on supporting the export economy (e.g., providing education relevant to cash cropping). Higher schooling and conversion rates are plausibly downstream consequences of the institutional intervention and the economic opportunities it fostered. Similarly, the paved road on the east side is likely an *infrastructural investment resulting from* the more formalized, market-oriented system, not a pre-existing difference. Controlling for schooling, religion, or road access in a regression aiming to estimate the *total causal effect* of the institutional difference on income would be **inappropriate**. Doing so would block part of the very causal pathway through which the institutions operate (e.g., institutions -> market integration -> missionary schools -> education -> higher productivity/income). Controlling for these variables would likely *underestimate* the total effect of the institutional difference by removing the contribution of these mediating channels.

  **(d) Limits to Broader Claims:** A finding of higher income on the east side based *only* on this comparison provides **very limited, context-specific evidence** for the broad claim that "institutions cause long-run national development." Firstly, the estimand is highly local (LATE near the boundary), not national. The effect size (40% income difference) might not be representative of the *average* effect across the entire regions or nations. Secondly, it isolates the effect of *one specific institutional difference* (formal individual land title vs. communal/nationalized systems) in *one specific historical context* (colonial imposition, path dependency post-independence). It does not demonstrate that *all* types of institutional differences (e.g., secure contract enforcement, democratic governance, financial systems) cause development everywhere. Thirdly, the finding does not address the *ultimate origins* of institutional differences. It shows that *where* this specific institutional divergence occurred arbitrarily, it had long-lasting local economic consequences, but it doesn't explain *why* colonial powers imposed different systems elsewhere (which could be driven by geography, settler mortality, preconquest conditions, etc.). While consistent with the importance of institutions, this single local experiment cannot alone settle the large-scale historical debates about the *primary* drivers of *aggregate* cross-national development differences; other factors (geography, culture, historical contingency) could still dominate at the macro level.

  **(e) Potential Falsification:** One specific pattern within the vignette that would undermine the causal interpretation is: **Evidence of systematic economic activity or pre-colonial settlement patterns concentrated *specifically along the straight-edge boundary segment* prior to the colonial intervention.** For example, if historical records or archaeological evidence showed that the straight line happened to bisect a particularly fertile micro-zone, a pre-existing important trade route unrelated to later smuggling, or a dense cluster of villages with distinct (though same language) economic specializations *exactly where the straight line was drawn*, this would severely challenge the assumption that the boundary placement was "as good as random" with respect to pre-treatment economic potential. It would suggest that the observed income difference might be driven, at least partially, by these underlying pre-colonial differences rather than solely by the imposed institutional divergence. The vignette's claim of homogeneity and the lack of "obvious economic features" is crucial; evidence contradicting this claim *for the straight-edge segment specifically* would invalidate the quasi-random assignment premise.

  **3. Marking Scheme (5 points x 4 marks = 20 marks total)**

  *   **Must-Hit Point 1 (Arbitrary Boundary Focus - 4 marks):** Candidate explicitly identifies the *straight-edge segment's arbitrariness* (surveyor's line, no features) and the *homogeneity* (same people, language, pre-colonial org) as key for quasi-random assignment, contrasting it with the *river segment's potential geographic confounding* (e.g., river might attract settlement/resources).  
      *   *Common Miss:* Vaguely mentions "border" without distinction, or treats the whole border equally. Focuses only on "same group" without highlighting the arbitrariness of the straight line.

  *   **Must-Hit Point 2 (Precise Estimand - 4 marks):** Candidate defines the effect as *local* (near the boundary), *specific* (effect of formalized individual title vs. communal tenure history), and frames it as a *LATE* (or equivalent concept like effect of treatment assignment at the boundary). Avoids vague "effect of institutions."  
      *   *Common Miss:* Uses overly broad terms like "effect of good institutions" or "effect on development." Fails to specify locality or the specific institutional contrast.

  *   **Must-Hit Point 3 (Mechanisms vs. Confounders - 4 marks):** Candidate argues that schooling/religion/road are likely *mechanisms* or *outcomes* of the institutional path (linking missionary activity/road to export crop incentive), and explicitly states that controlling for them would *bias the estimate* (likely attenuating it by blocking pathways).  
      *   *Common Miss:* Suggests controlling for them "to isolate the pure effect" or treats them as obvious confounders that must be controlled. Mentions them without addressing the core issue of mechanism vs. confounder.

  *   **Must-Hit Point 4 (Limited External Validity - 4 marks):** Candidate clearly states the finding is *local* (LATE near boundary) and *specific* (to this institutional change in this context), and explains why this limits its direct applicability to *aggregate, national* development questions or debates about the *ultimate origins* of institutions (doesn't explain *why* different systems were imposed elsewhere).  
      *   *Common Miss:* Extrapolates directly to "institutions cause national wealth." Fails to mention locality or specificity. Doesn't address the origin question.

  *   **Must-Hit Point 5 (Falsification Scenario - 4 marks):** Candidate identifies a *plausible pre-existing difference pattern specifically relevant to the straight-edge segment* (e.g., pre-colonial trade route, fertile zone, settlement cluster on the line) and explains how this would violate the "as good as random" assumption by introducing *pre-treatment confounding*.  
      *   *Common Miss:* Focuses on post-treatment differences (smuggling route - a potential outcome/mechanism), geography elsewhere, or vague "cultural differences" without linking them specifically to pre-existing conditions *on the straight-edge segment*.

  **Wrong Moves Capping at Pass (Max 11/20):**  
  *   **Conflating Boundary Segments:** Treating the river boundary and straight-edge boundary as equally valid comparisons.
  *   **Monolithic "Institutions":** Treating "institutions" as a single, undifferentiated concept rather than the specific land tenure history described.
  *   **Misapplying Controls:** Insisting on controlling for schooling, religion, or the road to estimate the total effect.
  *   **Uncritical Macro Extrapolation:** Claiming this finding *directly proves* institutions are the primary driver of *all* national development differences.
  *   **Ignoring Vignette Details:** Failing to use key elements (arbitrary line, homogeneity, export crop link, same group) in the argument. Reciting generic Acemoglu/Engerman/Sokoloff/Glaeser arguments without grounding them in the vignette's specifics.
  *   **Incorrect Falsification:** Identifying post-treatment factors (like the 1960s road or *current* smuggling) or factors explicitly ruled out (geography on the straight-edge) as primary falsifiers of the *assignment* assumption. Focusing on falsifying mechanisms rather than the assignment.
