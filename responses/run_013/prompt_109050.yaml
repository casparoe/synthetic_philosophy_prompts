answer: |-
  **INTERNAL MEMORANDUM**  
  **INSTITUTE FOR EMPIRICAL WARRANT**  
  **Research-Allocation Committee**  

  **Subject:** Review Outcome: Evolutionary Biology Programme (Ref: RAC/EB/23-47)  
  **Addressees:** Directorate of Biological Sciences; Evolutionary Biology Programme Lead; Finance Oversight Bureau; Philosophy of Science Advisory Panel; Archival Compliance Unit  

  1. **Review Context**  
     Pursuant to Institute Statute 5.1 (adopted 1 April 2023), the Research-Allocation Committee (RAC) has completed its triennial review of the Evolutionary Biology Programme (EBP) under the Falsifiability Criterion of Demarcation (FCD). The FCD mandates that hypotheses qualify for funding only if they yield a Forbiddingness Score (FS) ≥ 1.0. FS is defined as the cardinality of conceivable observations ruled out by a hypothesis, discounted by the probability of empirical verification (FS = Σ[Oᵢ × (1 − Pᵢ)], where Oᵢ is a forbidden observation and Pᵢ is the probability of its investigation). The EBP was evaluated across three domains: core theory, adaptation narratives, and historical claims.  

  2. **Core Theory: Natural Selection**  
     The principle of natural selection ("differential survival of heritable traits") was assessed. The hypothesis posits that traits persisting in a population enhance fitness. The Committee determined that this formulation forbids no conceivable observation: any observed outcome (e.g., trait persistence or extinction) is reconcilable *ex post* via redefinition of "fitness." Consequently, its FS = 0.0 (Appendix A). While the principle aids retrospective explanation, it lacks predictive specificity. The EBP’s reliance on this core mechanism thus fails the FCD.  

  3. **Adaptation Narratives: Case Study – Peacock’s Tail**  
     The EBP’s account of the peacock’s tail (as a product of sexual selection) was examined. The Committee requested the *ex ante* observation that would falsify this narrative. The Programme identified "absence of female preference" as falsifying, but acknowledged that equivalent observations (e.g., predation pressure, genetic drift) could support rival hypotheses (e.g., camouflage enhancement, neutral evolution). As no observation was uniquely precluded, the FS was calculated at 0.2 (Appendix A), below the 1.0 threshold. This is characteristic of narrative reconstructions: accommodating, but not forbidding, evidence.  

  4. **Historical Claims: Common Descent**  
     The hypothesis of universal common descent was distinguished from mechanistic explanations (e.g., natural selection). While the fossil record and genetic homologies were cited as evidence, the Committee noted that no conceivable observation rules out *all* auxiliary explanations (e.g., incomplete sampling, convergent evolution). The FS for common descent alone is 0.4 (Appendix A), owing to low-probability verification of deep-time events. The Committee recognizes that parallel issues affect geology (e.g., tectonic theory), cosmology (e.g., inflationary models), and palaeontology. These will be reviewed under separate cover.  

  5. **Funding Reclassification**  
     The EBP does not meet the FCD for full funding. However, the Committee acknowledges its utility in organizing falsifiable sub-projects (e.g., antibiotic resistance modeling, FS = 3.1). Thus, the EBP is reclassified as a **Provisional Metaphysical Research Programme (PMRP)**, effective immediately. PMRP status entails:  
     - Funding reduced to 30% of current allocation.  
     - Outputs barred from citation in the Institute’s Annual Report of Empirical Advances.  
     - Mandatory biennial re-review under FCD guidelines.  
     Sub-projects with FS ≥ 1.0 may apply for direct funding via standard channels.  

  6. **Self-Application of FCD**  
     The Committee applied the FCD to its own mandate. The hypothesis "The FCD validly demarcates science" yields an FS of 0.7 (Appendix A), as no observation forbids its utility (e.g., persistent funding disputes may reflect administrative failure, not demarcation flaws). While this result is formally non-compliant, the FCD remains binding per Statute 5.1. The Committee will submit to PMRP reclassification pending Directorate approval.  

  ---  
  **APPENDIX A: FORBIDDINGNESS SCORES (EBP)**  
  - Natural selection (core mechanism): FS = 0.0  
  - Peacock’s tail adaptation: FS = 0.2  
  - Universal common descent: FS = 0.4  
  - *FCD validity*: FS = 0.7  
  *Note: FS calculations discount observations with Pᵢ > 0.8 per RAC Handbook §4.3.*  

  ---  
  **MINORITY NOTE**  
  Dr. A. Nye (Committee Seat 7) dissents from §5. I endorse the FCD but contend the EBP can achieve compliance. Natural selection *is* testable when selection pressures are specified independently of outcomes (e.g., "Peacocks with longer tails incur 20% higher predation" forbids observations of equal survival rates). The EBP’s error was operational, not structural: it cited selection pressures *post hoc* rather than pre-registering them. I move to retain full funding contingent on pre-registration of pressure metrics in future proposals.  

  **Signed:**  
  *Dr. E. Voker*  
  Chair, Research-Allocation Committee  
  Institute for Empirical Warrant  

  ---  
  *Distribution: Level 4 Confidential*
