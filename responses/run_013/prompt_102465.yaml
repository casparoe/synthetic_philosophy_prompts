  You've hit upon a deeply entrenched methodological-metaphysical knot in quantum foundations (and philosophy of science broadly). There isn't a single, universally accepted term for *this specific dynamic*, but we can precisely carve the phenomenon and propose a fitting label. Let's break it down:

  **The Phenomenon: Metaphysical Underdetermination Anchored in Implicit Semantic Frameworks**

  1.  **Core Characteristics:**
      *   **Surface Disagreement:** Ostensibly about the "reality" or "ontic status" of a core theoretical entity/concept (e.g., the quantum state, Ψ).
      *   **Deep Agreement:** Consensus on the *predictive, operational, and inferential rules* governing the entity. Both agree on correct/incorrect assignments, probabilistic outcomes, and the formalism's constraints.
      *   **Semantic Divergence:** The key term ("real") carries fundamentally different, often implicit, meanings for the disputants:
          *   **Group A ("Not Real"):** Typically means "*not a direct, mind-independent, concrete physical object or field inhabiting spacetime*." Focuses on Ψ as a calculational/informational tool constrained by evidence.
          *   **Group B ("Real"):** Typically means "*fundamentally indispensable, not merely a summary of knowledge, possessing robust causal/explanatory power within the theory's structure*." Focuses on Ψ's irreducible role in generating predictions (e.g., via the Born rule) and explaining interference/entanglement.
      *   **Methodological Consequences:** Despite operational agreement, the chosen "sense of real" shapes:
          *   **Problem Prioritization:** What counts as a "deep" problem needing explanation (e.g., measurement problem feels urgent for B, maybe less so or differently framed for A).
          *   **Formalism Development:** Approaches to reconstructing quantum theory (e.g., seeking underlying ontic states vs. refining information-theoretic axioms).
          *   **Interpretive Stance:** What constitutes a "satisfying explanation" (e.g., locating Ψ in spacetime vs. showing its necessity for optimal reasoning).
      *   **Naturalization & Invisibility:** Each camp finds their own definition of "real" so obvious that the *semantic divergence itself* becomes invisible. They perceive the other as either stubbornly denying the obvious (B) or pointlessly reifying a tool (A).

  2.  **Distinguishing It From Related Concepts:**
      *   **Merely Verbal Dispute (Chalmers):** *Too Weak.* While semantics are central, the dispute *isn't* resolved by defining terms because the choice of definition *itself* has substantive methodological and explanatory consequences. Defining terms clarifies *why* they disagree, but doesn't dissolve the disagreement about *which framework is more fruitful/fundamental*.
      *   **Psi-Ontic vs. Psi-Epistemic (Harrigan & Spekkens):** *A Position Within the Phenomenon.* This is a specific, formalized criterion *within* the broader debate about Ψ's status. It attempts to *test* whether the quantum state corresponds directly to an ontic state (B-leaning) or represents knowledge about an underlying ontic state (A-leaning). Your phenomenon is the *meta-dynamic* that makes this categorization meaningful and contested.
      *   **Carnap's Internal/External Questions:** *Close, but Needs Nuance.* Carnap saw external questions ("Do numbers exist?") as pragmatic choices of linguistic framework, while internal questions ("Is there a prime number between 10 and 15?") are answered within the framework. Your phenomenon involves:
          *   An external question: "Do we adopt a framework where Ψ is *fundamental* ('real' in sense B) or *derivative* ('not real' in sense A)?"
          *   But crucially, both frameworks *internally* generate the same operational answers (agreement on physics). Carnap might see this as purely pragmatic, but physicists/philosophers experience the choice as deeply *explanatorily significant*, which Carnap downplayed. The "hostage situation" arises because participants treat the framework choice *as if* it were an internal question with a single right answer.
      *   **Entity vs. Law Distinction:** *A Manifestation.* Viewing Ψ as a genuine entity leans towards sense B (real), while viewing it as akin to a law of nature (governing how possibilities/probabilities evolve) can lean towards sense A (not a *thing*, but a fundamental rule/structure). This is one way the core semantic divergence manifests.

  3.  **Proposed Label & Carving: Metaphysical Underdetermination with Framing Entanglement (MUFE)**

      *   **Metaphysical Underdetermination:** The empirical/inferential success of the theory fails to uniquely determine the metaphysical status of its central elements (Ψ is real? Ψ is knowledge? Ψ is a law?).
      *   **Framing Entanglement:** The choice of metaphysical framing ("real" in sense A/B) becomes deeply entangled with methodological choices, problem framing, and explanatory values. You *can't* cleanly separate the "merely semantic" choice from the "substantive" research program it enables. The framing *does* substantive work.

  4.  **Boundaries and Scope:**
      *   **Quantum Realism/Anti-Realism:** **Yes, this is a core instance.** The entire debate often exhibits MUFE. The disagreement about Ψ's reality often maps onto broader realist/anti-realist stances about QM itself.
      *   **Outside Physics? Absolutely.** This pattern is ubiquitous where theoretical entities bridge observation and deep explanation:
          *   **Biology:** "Is the *gene* real?" (Mendelian unit vs. DNA sequence vs. developmental resource). Agree on inheritance patterns, disagree on ontological fundamentality/explanatory locus.
          *   **Psychology/Economics:** "Are *preferences* real?" (Internal mental states vs. revealed-by-choice constructs). Agree on behavioral predictions, disagree on what explains the behavior.
          *   **Fundamental Physics:** "Is *spacetime* real?" (Emergent from quantum gravity vs. fundamental). Agree on low-energy GR predictions, disagree on ontology and what needs "explaining away."
          *   **Climate Science:** "Are *climate models* representing reality?" (Approximations of a real system vs. highly sophisticated prediction tools). Agree on projections under scenarios, disagree on the directness of the model-world link.
      *   **When Does it *Not* Apply?**
          *   **Purely Verbal Disputes:** Where defining terms genuinely resolves all disagreement.
          *   **Genuinely Substantive Disagreements:** Where parties disagree on core predictions, evidence, or mathematical formalism *itself* (e.g., Bohmian trajectories vs. no trajectories in Copenhagen; Dynamical Collapse models vs. unitary-only QM).
          *   **Cases with Clear Empirical Tests:** If a future experiment *could* definitively distinguish between Ψ being "ontic" or "epistemic" in the Harrigan-Spekkens sense *and* that result forced a consensus on the meaning of "real," MUFE would dissolve for that specific aspect. (But new framings might emerge!).
          *   **Cases Where "Real" Isn't Load-Bearing:** In contexts where the ontological status of a concept isn't tied to research methodology or problem prioritization (rare in foundational fields).

  **Why This Label/Concept Helps You:**

  1.  **Diagnostic Power:** When you see a heated "real vs. not real" debate with underlying operational agreement, MUFE is likely at play. Ask: *What different work is "real" doing for each side? How does their choice of framing shape their research questions?*
  2.  **Analytical Tool:** Use it to dissect papers/conversations. Identify the implicit definitions of "real," trace how they lead to different problem formulations or formalism preferences.
  3.  **Historicization:** Analyze how different eras or schools in QM foundations adopted different framings (e.g., early Copenhagen's instrumentalism vs. Everett's realism) and how that shaped their agendas.
  4.  **Moving Forward:** Recognize that resolving MUFE often requires moving the debate *up a level*: arguing about the relative virtues of different *frameworks* (explanatory power, parsimony, unity, fruitfulness for new physics) rather than directly about which one is "right" about Ψ being "real." It highlights the need for *framework negotiation* rather than expecting a knock-down argument within one framework to convince the other.

  **In essence:** You've identified **Metaphysical Underdetermination with Framing Entanglement (MUFE)** – a persistent dynamic where agreement on the "how" (formalism, predictions) coexists with disagreement on the "what" (ontic status) and the "why" (explanatory priority), fueled by divergent, naturalized, and often implicit definitions of a load-bearing term like "real," with significant consequences for research practice. This is the engine behind much of the seemingly intractable debate in quantum foundations.
