answer: |-
  ## Keynote Address: The Living Text and the Oath We Take

  [Adjust microphone, make eye contact across the courtroom – new citizens, families, students, judges, colleagues]

  Good morning. Judge Miller, Judge Alvarez, colleagues, honored guests, families… and most importantly, our soon-to-be fellow citizens. In just a few moments, you will take an oath to support and defend the Constitution of the United States. It’s a profound moment, built on hope and history. Today, I want to talk about that document through the eyes of someone who understood its immense power, and its perilous ambiguity: Frederick Douglass.

  We often think of Douglass as a towering, unchanging symbol. But his relationship with the Constitution was anything but simple. It was a journey. For the first decade of his public life, Douglass stood shoulder-to-shoulder with the fiery abolitionist William Lloyd Garrison. And Garrison declared the Constitution a **pro-slavery covenant.** Garrison argued it was a deal with the devil, a document soaked in the blood of the enslaved. He said the words "We the People" excluded millions. He pointed to clauses protecting the slave trade, counting enslaved people as three-fifths of a person for political power, demanding their return if escaped. To Garrison, swearing an oath to this document was morally impossible. It made you complicit. And for years, Douglass agreed.

  But then, in the early 1850s, something remarkable happened. Frederick Douglass changed his mind. He didn't just soften his stance; he reversed it completely. He came to believe, passionately, that the Constitution – **read properly, read closely, like a lawyer reads a text** – was actually an *anti-slavery* document.

  His argument wasn't emotional; it was textual, logical. He pointed out fundamental things:

  1.  **The Words Missing:** The words "slave" and "slavery" never appear in the original Constitution. Not once. The document talks about "persons," "other persons," "persons held to service or labor." It avoids naming the *thing* it regulates.
  2.  **The Preamble's Promise:** "We the People... in Order to form a more perfect Union, establish Justice... secure the Blessings of Liberty..." Douglass asked: How could a document *founded* on securing liberty be fundamentally pro-slavery? The purpose, he argued, pointed towards freedom.
  3.  **The Grammar of Personhood:** Look at the clauses Garrison hated, Douglass said. The Three-Fifths Clause? It refers to enslaved individuals as "persons," not property. The Fugitive Slave Clause? It talks about "persons held to service or labour." If they were simply property, why use the language of *persons* at all? This, Douglass contended, was a fatal flaw in the slaveholders' own legal argument. The text itself undermined the idea that human beings could be mere chattel.
  4.  **The Concession:** Most powerfully, Douglass argued that by *accepting* Garrison's view – by conceding the Constitution *was* pro-slavery – abolitionists were handing their opponents an enormous, unearned victory. They were surrendering the text itself.

  [Pause, lean slightly forward]

  Now, here’s the crucial tension, the part we cannot smooth over: **Douglass wasn't entirely wrong the first time, nor entirely right the second.** The judges and lawyers here know this well. For nearly seventy years, courts *did* interpret that text to protect slavery. The "bargain with the slave power" Garrison denounced was real in practice. The words on the page didn't magically break chains. The text, by itself, didn't free anyone.

  So what changed? Not the parchment. *We* changed. Our understanding deepened. Our commitment to the ideals *expressed* in the Preamble – Justice, Liberty – grew stronger than the compromises *embedded* in the Articles. Frederick Douglass’s great insight wasn't that the Constitution was perfect. His insight was that its power lay in how we choose to read it, and more importantly, how we choose to *fight for* its highest ideals.

  He saw that the text, with its careful avoidance of naming slavery and its insistence on the language of "persons," contained within it the seeds of its own redemption. It provided the ground on which the argument for universal freedom could stand. But seeds need planting, watering, sunlight. They need the tireless work of citizens – citizens like Douglass, citizens like the suffragists, citizens like those who marched for civil rights, citizens like you.

  [Turn directly to the new citizens]

  When you swear that oath today, you are not swearing allegiance to a perfect, frozen document. You are not swearing allegiance to every interpretation that came before. You are swearing allegiance to the *project* it represents: the ongoing, often difficult, pursuit of "a more perfect Union." You are joining a conversation that began before 1787 and continues right now. You inherit both the profound ideals *and* the historical burdens. You inherit the responsibility to engage with this text, to understand its complexities, its potential for justice and its capacity for harm, and to strive, in your own way, to make its promise real.

  Frederick Douglass learned that the Constitution wasn't simply pro-slavery or anti-slavery. It was a mirror. It reflected the nation’s conscience – sometimes clear, sometimes horrifyingly clouded. It reflected who *we* were willing to be. His reversal wasn't just about changing his mind on legal theory; it was about believing that the nation itself *could* change, that the words on the page could be claimed for freedom.

  Your oath today is your entry into that vital struggle – the struggle to define what "We the People" truly means. It is a commitment not just to the text as it was written, but to the nation as it *should be*. Welcome to the conversation. Welcome to the responsibility. Welcome to the ongoing American experiment.

  Thank you.
