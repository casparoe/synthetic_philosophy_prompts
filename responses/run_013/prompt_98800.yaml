prompt: |-
  I'm running a ninety-minute session on speech acts for a reading group of linguistics grad students who've never done any philosophy of language. Don't explain Austin to me — plan how I should explain him. What has to come first and what depends on what: for instance, do the felicity conditions come before or after the locution/illocution/perlocution split, and why that order and not the reverse? Pick the single example that carries the whole session and tell me what it has to have and what it has to lack — and tell me why I shouldn't just use the wedding pronouncement or the ship-naming bit that everyone reaches for (and please don't let it be a promise either). Then give me the misconception map: what they'll walk in with and what they'll form halfway through — I'm guessing "performative just means expressive or emotional," "illocutionary force = tone of voice," "perlocutionary = any effect at all, so promising counts as perlocutionary," and "the constative-vs-performative split is the actual finished theory" — plus exactly where in the sequence I head each one off.

  Two things I want baked in, because they're definately the part that usually gets skipped. First: Austin introduces the performative and then more or less dissolves the distinction himself, so what most people remember as the theory is really the setup — I want the ordering to make that collapse feel like the payoff rather than a technicality, so where does it land? Second: the constitutive-rules idea, that promising does something only because there are rules constituting the practice, and the awkward follow-up of whether promising is institutional like a marriage or somehow works without any institution at all — too much for this crowd, and if not, where does it go and what case carries it? There's also the uptake thing, that an illocutionary act supposedly needs the hearer to understand it to come off while a perlocutionary one doesn't — worth including, or too contested here?

  Finish with one question I can put to them at the end that actually shows me whether it landed rather than whether they can nod, and tell me what to leave out at this level — and to say out loud that I'm leaving it out.
reasoning: |-
  Okay, let me tackle this linguistics grad student's request for a 90-minute session on Austin's speech acts. They're clearly familiar with the material but need pedagogical structuring, so I'll focus on sequencing and misconception prevention. 

  First, the core challenge: they want the performative/constative collapse to feel like the payoff, not a footnote. That means I need to build the session as a narrative where Austin starts with a clean distinction only to dismantle it himself. The example choice is critical here—it must be institutionally clear but not overused like weddings or ship-namings. A courtroom verdict ("Guilty!") might work: it has felicity conditions (judge's authority, proper procedure), clear illocution (declaring guilt), and perlocution (jailing the defendant), but lacks the baggage of promises. 

  For sequencing: felicity conditions MUST come before locution/illocution/perlocution. Why? Because Austin's whole move is showing that "happy" performatives aren't just about word meaning (locution) but conditions of validity. If I jump straight to the three acts, students will miss why Austin needed felicity in the first place. 

  Major misconceptions to preempt:
  - "Performative = emotional speech": Head this off immediately when defining performatives by contrasting "I apologize" (performative) with "I feel sorry" (constative). 
  - "Illocution = tone": When introducing illocution, emphasize it's conventional force, not vocal tone. Use the verdict example—same words whispered or shouted still convict if felicitous.
  - "Perlocution = any effect": Contrast the verdict's perlocution (jailing) with its illocution (declaring guilt) to show intentionality matters.
  - "Constative/performative is the final theory": Structure the second half around Austin's own erosion of the distinction via examples like "I state..." (performative constative?).

  The constitutive rules point is tricky but worth including. When analyzing the verdict's felicity conditions, explicitly frame them as rules constituting the act—no institution, no verdict. Then pivot to "I promise" to show some speech acts create obligations without formal institutions, teasing that tension. 

  Uptake: Yes, include it briefly when discussing misfires. If the jury doesn't hear "guilty," the illocution fails—this distinguishes it from perlocution (jailing happens even if the defendant faints and misses the verdict). 

  For the closing question, avoid "Define X." Instead: "If a child says 'I sentence you to bedtime!' to a doll, what speech acts occur and why?" This tests grasp of felicity conditions vs. intention vs. perlocution. 

  Cut: Searle's taxonomy, Gricean implicature. Explicitly state: "We're focusing on Austin's framework; later theorists expand this differently."
answer: |-
  Here’s a battle-tested 90-minute plan designed to make Austin’s collapse of the performative/constative distinction feel inevitable, using a fresh example while dodging common pitfalls. The sequence prioritizes conceptual dependencies and preempts misconceptions at key points.

  ---

  ### **Session Structure & Rationale**
  **Total: 90 mins**  
  **(Order is critical for building then undermining the initial framework)**

  1. **What’s Broken? (10 mins)**  
     Start with **"constative-only" assumptions**: "Language just describes states (true/false)." Have students brainstorm counterexamples (*apologizing, firing, warning*). **Preempts:** "Performative = expressive/emotional" by showing *institutional* acts (e.g., "You’re fired") aren’t about feelings.  

  2. **Enter Performatives (15 mins)**  
     Define via **explicit performatives** ("I name this ship...", "I resign"). Contrast with descriptions ("She resigned"). Stress: **Felicity conditions** (FCs) are introduced *here* (not later!) as requirements for "happiness" (authority, procedure, uptake).  
     **Why FCs first?** They’re Austin’s tool to show speech isn’t just true/false but *valid/invalid*. Skipping this risks reducing performatives to "emotional speech."  

  3. **The Illusion Cracks: Performatives as Constatives? (15 mins)**  
     Problem-spot: "I state that the session starts now" — is this a performative *or* a constative? Dissolve the binary: Austin argues *all* utterances have an **action** dimension. **Payoff landing:** This collapse isn’t a footnote — it’s the climax showing FCs apply to *all* speech.  

  4. **Locution/Illocution/Perlocution (20 mins)**  
     **Only now** introduce the triad, using FCs as the bridge:  
     - **Locution:** Saying "The window is open" (meaning/sense).  
     - **Illocution:** *Warning* you (conventional force, bound by FCs).  
     - **Perlocution:** Making you *jump* (causal effect).  
     **Why this order?** FCs define illocutionary acts — you can’t grasp illocution without them. Reverse order invites "illocution = tone" errors.  

  5. **Uptake & Constitutive Rules (15 mins)**  
     **Uptake YES:** Use "warning" — if you don’t *recognize* it as a warning, illocution fails (FC breach). Perlocution ("jumping") can still happen if you’re startled. **Preempts** "perlocution = any effect."  
     **Constitutive rules:** Tie to FCs. "Guilty!" only works in a courtroom (institution). Contrast with "I promise" (less institutional, but still rule-bound: sincerity, commitment). **Case study:** A judge saying "Guilty!" in a café fails (no institution). A friend saying "I promise" in a café *can* work (minimal institution: shared language norms).  

  ---

  ### **The Core Example: A Verdict ("Guilty!")**  
  **Why this over weddings/ships?**  
  - **Has:** Clear FCs (judge’s authority, proper trial, uptake by court).  
  - **Has:** All three acts: Locution (word meaning), Illocution (convicting), Perlocution (jailing the defendant).  
  - **Lacks:** Overfamiliarity (avoids "just memorize the classic cases"). Highlights institutional rules without being *only* about institutions (unlike ship-naming).  
  - **Avoids promises:** Too entangled with sincerity debates.  

  ---

  ### **Misconception Map & Defusal Points**  
  | Misconception | When It Arises | How to Head Off |  
  |---------------|----------------|-----------------|  
  | "Performative = emotional/expressive" | Intro (Step 1) | Use institutional examples ("You’re fired") — emotionless but performative. |  
  | "Illocutionary force = tone of voice" | Introducing illocution (Step 4) | Show "Guilty!" whispered/shouted: same illocution if FCs met. Stress *conventional* force. |  
  | "Perlocutionary = any effect" | Defining perlocution (Step 4) | Contrast: "Guilty!" causing fear (perlocution) vs. convicting (illocution). Ask: "Is fear *part* of convicting?" |  
  | "Constative/performative is the finished theory" | Pre-collapse (Step 3) | Hammer: Austin *invents* the distinction to *destroy* it. The triad is his real framework. |  

  ---

  ### **Key Bake-Ins**  
  - **Collapse as Payoff:** Frame Step 3 as the "aha!" moment: Austin didn’t "fail" to define performatives — he proved *all* speech acts need FCs.  
  - **Constitutive Rules:** Anchor to FCs in Step 2. Use "Guilty!" for heavy institutions vs. "I promise" for lighter ones. Conclude: Rules exist on a spectrum (courtroom → friendship).  

  ---

  ### **Final Diagnostic Question**  
  > **"If a chef in a restaurant says 'The soup is cold' to a customer:**  
  > - **(a) What could the illocution be? (Complaint? Warning?)  
  > - **(b) What FCs make it a *complaint*?  
  > - **(c) What perlocution might follow?  
  > - **(d) Could this also be a constative? How?"**  

  **Why it works:** Tests grasp of FCs (b), illocution/perlocution split (a/c), and the dissolved performative/constative divide (d).  

  ---

  ### **What to Cut & Announce**  
  - **Omit:** Searle’s taxonomy, Gricean implicature, cross-cultural variations.  
  - **Say aloud:** "We’re focusing on Austin’s core framework — not later developments. This means bracketing conversational implicature and cross-cultural pragmatics for today."  

  **Time Buffer:** Save 10 mins for Q&A after the diagnostic question to tackle lingering confusions.  

  This plan weaponizes Austin’s own dialectic: introduce a clean distinction only to dismantle it, making the collapse feel earned. The "Guilty!" example avoids philosophical baggage while illuminating FCs, the triad, and institutional grounding in one stroke.
