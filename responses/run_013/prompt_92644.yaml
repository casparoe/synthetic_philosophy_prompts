prompt: |-
  I retired from the lab a couple of years ago (biochemistry, forty years of it) and I've been trying to teach myself philosophy ever since. Slow going, but I've got a bit hooked on the experimental philosophy stuff — the little vignette studies where you ask people whether someone did something on purpose, and the answer seems to flip depending on whether what happened was good or bad. I think you'll know the one I mean: a senior figure in a company doesn't care about anything except the bottom line, is told the new programme will also do X as a side effect, says he doesn't care, and X happens. When X is polluting a river, people say he did it on purpose; when X is cleaning up a river, they say he didn't. I can't remember who ran it and I don't need the reference — I'll chase that up myself.

  Here's my complaint, as a lapsed experimentalist. As a piece of design it's a mess: the two versions differ in several ways at once and nobody's bothered to control for anything. I can see at least three seperate things that could be doing the work, and I'm not sure the literature has pulled them apart:

  - the plain good-or-badness of the side effect itself, which is what most people seem to assume;
  - how much skill, foresight or control the agent needed in order to bring that side effect about at all (maybe harming takes less of all three than helping does, so we credit him with one and not the other);
  - whether the side effect is the sort of thing that normally happens in that kind of situation — a normal consequence of a normal decision might get treated quite differently from a freak one, quite apart from whether it's good or bad.

  There may be a fourth, something to do with our appetite for blaming people, but I haven't got my head round it.

  What I'd like from you is a properly controlled pair of vignettes, in the spirit of that study, that seperates these explanations from each other rather than jumbling them up. Specifications:

  - Version A: two foreseen side effects of one action that differ in moral goodness/badness but are matched on everything else — same agent, same indifference, same level of understanding of what will happen, same skill and control required, and equally statistically normal in that setting. Version B: same kind of setup, but now the two side effects are matched in moral valence (both mildly bad, or both neutral — your call) and differ only in how statistically normal they are.
  - No executives, no companies, no pollution-versus-profit examples. Realistic, ordinary settings only — a household, a school, a farm, a workshop, whatever fits. No exotic machinery, no tricks of physics.
  - Each vignette one short paragraph, written plainly enough that a person off the street would answer without confusion. Do not put the verdict in the participants' mouths, and do not build the answer into the story — the vignettes have to generate the judgements, not stipulate them.
  - Don't lean on any names, authors or references. If you need a label for an explanation, invent one.

  Then do the accounting. For each version, say what each of the three (or four) candidate explanations predicts, and why. Tell me which explanation survives both versions, and name the single feature of the case that is doing the work. Say what happens if you remove or neutralise that feature — does the asymmetry vanish, reverse, or stay put? Then put on the other side's hat: how would someone who backs the explanation that comes out worst attack my design — what would they say I've smuggled into the stories? Finally, if these two versions genuinely can't be made to come apart without cheating, say so plainly and tell me which of my specifications has to give and why.

  Write it in British English, and finish with a last line in exactly this form, naming whichever explanation is left standing after both tests:

  Verdict: <one word or short phrase>
reasoning: |-
  Hmm, the user is a retired biochemist with 40 years of experience who's now teaching themselves philosophy, particularly experimental philosophy. They're frustrated with a classic vignette study about intentionality judgments (the CEO/pollution case) because it lacks proper controls. They've identified three potential confounders: moral valence, skill/control required, and statistical normality of the outcome. They want me to design two clean vignettes that isolate these variables.

  First, I need to understand their critique deeply. The original study shows asymmetric judgments: bad side effects are seen as intentional while good ones aren't, even when the agent is equally indifferent. But as the user points out, harming might require less skill than helping (confounder 2), and harmful outcomes might be more statistically expected in corporate contexts (confounder 3). These weren't controlled.

  Their request is very specific: two vignettes. Version A must isolate moral valence (good vs bad) while holding skill and normality constant. Version B must isolate statistical normality (common vs rare) while holding valence constant. Settings must be mundane - no corporations. Writing must be neutral and accessible. Then I need to analyze predictions for each explanation under both vignettes.

  For Version A, I'm considering a gardening scenario where someone moves stones to build a wall, foreseeing but not caring about two side effects: helping snails (good) and exposing mice (bad). Skill/normality are matched - both outcomes are equally likely from stone-moving, requiring no special effort. Moral Valence Explanation predicts asymmetry (intentional harm, unintentional help). Skill/Control Explanation predicts symmetry (same effort for both). Normality Explanation also predicts symmetry (both equally expected).

  For Version B, I'm imagining a farmer feeding chickens, foreseeing two side effects: making eggs easier to find (common) and startling a fox away (rare). Both are good outcomes. Valence is constant. Normality Explanation predicts asymmetry (intentional for common outcome, unintentional for rare). Skill/Control predicts symmetry (same action). Moral Valence also predicts symmetry (both good). 

  Analysis shows Moral Valence survives both tests: it predicts asymmetry only in Version A where valence differs. Skill/Control and Normality both predict symmetry in cases where they're controlled. The key feature is purely whether the outcome is good or bad. If we neutralize valence (make both neutral), asymmetry should disappear. 

  Potential criticisms: Someone favoring Normality might argue that in Version A, "exposing mice" feels more expected than "helping snails" in a gardening context. I should preempt this by making both outcomes equally mundane (e.g., snails shelter under stones daily, mice nest under them daily). 

  Finally, the verdict is clear: Moral Valence is the surviving explanation. The user's specifications hold - no cheating needed. Writing in British English ("tidy up" instead of "clean up", "torch" for flashlight). Ending with "Verdict: Moral Valence" as requested.
answer: |-
  As a former experimentalist, your critique is razor-sharp – confounding variables are the bane of clean inference. The CEO/pollution case *is* methodologically messy, and your candidate explanations are plausible. Let's build two controlled vignettes per your specifications.

  **Core Design Principle:** Isolate the target variable (Valence in A, Normality in B) while rigorously controlling the others (Agent indifference, foresight, skill/control required, and the non-target variable).

  ---

  **Version A: Isolating Moral Valence (Good vs. Bad)**
  *   **Control Target:** Moral Valence differs (Good vs Bad). Skill/Control & Normality *identical*.
  *   **Setting:** A home gardener tidying a rockery.
  *   **Vignette:**
      "Sam is tidying up the rockery at the bottom of their garden, clearing away loose stones to make it look neater. Sam knows that moving these particular stones will, as a regular and predictable side effect, disturb the small creatures living underneath them. Sam doesn't care at all about the creatures; they just want a tidy rockery. While moving the stones, Sam dislodges a colony of woodlice sheltering underneath one patch (causing them harm as they dry out and die in the sun). Simultaneously, while moving stones from another patch, Sam exposes a cluster of buried snail eggs (causing them benefit as the sunlight warms them and helps them hatch)."

  *   **Control Points:**
      *   *Valence Differs:* Harming woodlice (Bad) vs. Helping snail eggs (Good).
      *   *Skill/Control Identical:* Both outcomes result directly from the same simple action (moving stones). No special skill, foresight, or control is needed beyond knowing the creatures are there and that moving stones disturbs them. Sam applies the same low-effort action to both patches.
      *   *Normality Identical:* The story explicitly states disturbing creatures is a "regular and predictable side effect" of moving stones in this rockery. Harm and help are presented as equally normal, expected, and probable outcomes of the same indifferent action in this context.
      *   *Agent Factors Identical:* Same agent (Sam), same primary goal (tidy rockery), same indifference ("doesn't care at all"), same level of foresight/knowledge.

  *   **Candidate Predictions:**
      *   **Valence Explanation:** Predicts asymmetry. Participants will say Sam harmed the woodlice *on purpose* but did *not* help the snail eggs *on purpose*, despite identical knowledge and indifference. (Bad = Intentional, Good = Unintentional).
      *   **Skill/Control Explanation:** Predicts *symmetry*. The skill/control required to cause harm or help is identical (minimal, inherent in the simple action). Therefore, judgments of intentionality should be the same for both outcomes (likely both intentional, given foresight and indifference).
      *   **Normality Explanation:** Predicts *symmetry*. Both outcomes are equally normal, predictable consequences. Therefore, judgments of intentionality should be the same for both outcomes (likely both intentional, given foresight and indifference).

  **Survivor of Version A:** The Valence Explanation predicts the asymmetric pattern. Skill/Control and Normality predict symmetry, which would *not* match the classic effect.

  ---

  **Version B: Isolating Statistical Normality (Common vs. Rare)**
  *   **Control Target:** Statistical Normality differs (Common vs Rare). Moral Valence & Skill/Control *identical*.
  *   **Setting:** A smallholder feeding chickens.
  *   **Vignette:**
      "Lee is feeding grain to their chickens in the run each morning. Lee knows that scattering the grain will, as a side effect, make it easier for the resident robin to find spilled bits later (a very common occurrence). Lee also knows that on rare occasions, the sudden movement and noise of scattering grain near the hedge might startle away a lurking fox before it tries to get near the coop (a very uncommon occurrence). Lee doesn't care at all about the robin or deterring foxes; they just want to feed the chickens. While scattering the grain today, the robin does indeed find lots of easy food later (benefit). Also, at that exact moment, a young fox that had been cautiously approaching is startled by the noise and movement and runs off (benefit)."

  *   **Control Points:**
      *   *Normality Differs:* Helping robin (Common) vs. Deterring fox (Rare). Explicitly stated.
      *   *Valence Identical:* Both outcomes are beneficial (Good). Valence is constant.
      *   *Skill/Control Identical:* Both outcomes result from the same simple action (scattering grain). No special skill or control is exerted by Lee to achieve either specific benefit; both are passive side effects. Lee applies the same action with the same indifference.
      *   *Agent Factors Identical:* Same agent (Lee), same primary goal (feed chickens), same indifference ("doesn't care at all"), same level of foresight/knowledge.

  *   **Candidate Predictions:**
      *   **Valence Explanation:** Predicts *symmetry*. Both outcomes are Good. Therefore, judgments of intentionality should be the same for both outcomes (likely both *unintentional*, given indifference and valence).
      *   **Skill/Control Explanation:** Predicts *symmetry*. The skill/control required to cause either benefit is identical (minimal, inherent in the simple action). Therefore, judgments of intentionality should be the same for both outcomes.
      *   **Normality Explanation:** Predicts *asymmetry*. Participants will say Lee helped the robin *on purpose* (common, expected outcome) but did *not* deter the fox *on purpose* (rare, unexpected outcome), despite both being foreseen, beneficial, and resulting from the same indifferent action. (Common = Intentional, Rare = Unintentional).

  **Survivor of Version B:** The Normality Explanation predicts an asymmetric pattern, but crucially, it's the *opposite* of the valence pattern (Common Good seen as intentional vs. Rare Good seen as unintentional). Valence and Skill/Control predict symmetry.

  ---

  **The Accounting:**

  1.  **Which Explanation Survives Both Tests?** Only the **Valence Explanation** predicts the *specific asymmetric pattern* (Bad=Intentional, Good=Unintentional) in Version A where valence differs. In Version B, where valence is constant (both Good), the Valence Explanation correctly predicts *symmetry* in intentionality judgments (both likely seen as unintentional). Neither Skill/Control nor Normality correctly predict the results across both versions.
  2.  **The Single Feature Doing the Work:** The **moral valence (goodness/badness) of the side effect itself**.
  3.  **Effect of Neutralising Valence:** If the side effect's valence is neutralised (e.g., both side effects are neutral, like "scattering the grain slightly compacts the soil in one area and slightly loosens it in another"), the Valence Explanation predicts the asymmetry should **vanish**. Judgments of intentionality should become symmetrical and likely hinge more strongly on factors like normality or explicit agent desire (though indifference might lead to both being seen as unintentional). The classic asymmetry disappears.
  4.  **Critique from the Normality/Skill Camp:** An advocate for Normality (or Skill) might attack Version A thus:
      *   *Normality Advocate:* "You've smuggled in an assumption about 'regular and predictable'. Is disturbing creatures *really* equally normal for harming vs. helping? Maybe 'exposing eggs to help hatch' feels rarer or more specific than 'disturbing creatures causing harm'. The 'normality' isn't perfectly controlled; harming seems like the *default* consequence of disturbance in folk biology."
      *   *Skill/Control Advocate:* "You assume skill/control is identical, but perhaps causing *harm* through neglect is psychologically seen as requiring *less* 'positive' action (just failing to prevent) than causing *benefit* through neglect, which might require a more specific enabling action. The 'action' feels subtly different for harm (inaction/allowance) vs. help (facilitation)."
      *   **Rebuttal:** The vignettes explicitly define normality and the mechanism. Harm (woodlice drying) and Help (eggs warming) are presented as *equally direct, physical, passive consequences* of the *identical* low-effort action (moving stones), occurring with *equal predictability* in the context. The mechanism is symmetric. Any residual intuition that harm is 'easier' is likely *driven by* valence, not an independent confound. Similarly, the Skill/Control objection relies on importing valence-laden concepts ("inaction" vs "facilitation") that aren't inherent in the described physical actions.
  5.  **Can They Be Made to Come Apart Without Cheating?** Yes, they cleanly come apart. Version A isolates Valence and shows the classic asymmetry. Version B isolates Normality and shows a *different* pattern (asymmetry based on frequency for *good* outcomes), while Valence predicts (and would presumably find) symmetry. The specifications hold. Valence emerges as the primary driver of the *specific* asymmetry seen in the original CEO case.

  **Verdict: Moral Valence**
