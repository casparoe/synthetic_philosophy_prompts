  ### Actual Resolution of the Puzzle
  The two-envelope paradox is resolved by recognizing that the expected value of switching depends on the prior distribution of the envelope contents. Key points:
  - **Conditional probabilities are prior-dependent**: After observing \(X\), \(P(\text{other} = 2X | X)\) is not inherently \(1/2\); it depends on the prior distribution of the smaller amount \(S\). For example:
    - If \(S\) has a uniform prior over a finite range, \(P(\text{other} = 2X | X)\) may vary with \(X\) (e.g., it decreases for large \(X\) if the prior favors smaller amounts).
    - The expected gain \(E[\text{gain} | X]\) can be positive, negative, or zero depending on \(X\) and the prior, but unconditionally, \(E[\text{gain}] = 0\) by symmetry for any proper prior.
  - **Improper priors do not resolve the paradox**: With an improper uniform prior, \(E[\text{gain} | X] > 0\) for all \(X\), but this is misleading:
    - Unconditional expectations are undefined, so symmetry is preserved only in a limiting sense (e.g., as bounds go to infinity, \(E[\text{gain}] \to 0\)).
    - Decision rules based on improper priors can be inconsistent if applied pointwise, but this is a known limitation in Bayesian theory, not a new paradox.
  - **No flaw in decision theory**: Expected-value reasoning is consistent when priors are properly specified. The paradox arises from an incorrect assumption (equal probabilities after seeing \(X\)) or mishandling of improper priors.

