  First, I need to understand the core issue: shared evidence or input leading to correlated errors despite individual competence. The user mentioned examples like a single briefing memo or a miscalibrated instrument. They want to differentiate this from concepts like groupthink (social pressure) or information cascades (following others).

  I recall that correlated errors violate the independence assumption in the Condorcet theorem. But is there a specific term? "Common source failure" comes to mind, but I'm not sure if it's established. Other possibilities: "shared evidence pitfall," "common input problem." But the user wants a conceptual map, not just a label.

  They also want boundaries. How does this differ from shared bias? Shared bias might be a disposition, whereas here it's about the immediate input. Epistemically, shared evidence is key—everyone starts from the same data. Probabilistically, it's correlated errors. Causally, a common cause. The user cares about whether these descriptions can come apart. For example, if individuals have different biases but the same evidence, the error might still correlate.

  Boundary cases: When does shared evidence stop being the issue? If a group uses the same dataset but applies different analytical methods, is that still under this phenomenon? Or if there's slight variation in the shared input? The user needs clarity on when the term applies.

  Also, the user might have a deeper need: to effectively communicate this concept to students and perhaps apply it to real-world scenarios like committee decisions or research labs. They need a framework to analyze when independence fails due to upstream factors, not social dynamics.

  I should check if literature treats this as part of the independence violation or as a distinct phenomenon. In decision theory, it's often just noted as a failure of independence. But in epistemology, maybe "evidential common cause" or "shared evidence failure" could work. Coining a term like "Common Source Epistemic Failure" with clear conditions: 1) competent individuals, 2) honest voting, 3) shared input causing error correlation, 4) lack of independence despite no social pressures.

  Need to ensure the definition excludes cases where social pressures or cascades are at play. Also, distinguish from systemic bias which is more about ingrained prejudices rather than a specific shared input instance. The user’s examples (briefing memo, reagent, secondary source) all involve a specific common input affecting all members similarly.

  In conclusion, the key elements are shared evidence leading to correlated errors, independent of social influences. The term should encapsulate that, and the conceptual map should clarify the probabilistic, causal, and epistemic angles, showing when they align or diverge.
answer: |-
  This phenomenon is indeed distinct from the concepts you mention and deserves its own conceptual framing. While no single established term fully captures it in social epistemology literature, the core mechanism is well-recognized as a **violation of the independence assumption** in the Condorcet Jury Theorem (CJT). However, its *specific manifestation* through *shared evidence/input* without social pressure requires precise delineation.

  ### Proposed Name & Definition
  **Term:** **Common Source Epistemic Failure (CSEF)**  
  *Definition:* A collective decision-making failure occurring when competent, honest, and non-deferential agents arrive at a shared incorrect judgment due to their reliance on an identical, flawed source of evidence, input, or framing mechanism. This shared dependency creates correlated errors that undermine the reliability benefits predicted by the CJT, often amplifying confidence in the erroneous outcome as group size increases.

  ### Conceptual Map: Core Components & Boundaries
  1.  **Core Mechanism:**  
      -   **Probabilistic:** *Correlated errors* arising from non-independence. Errors are not random but systematically linked through the shared input.  
      -   **Causal:** A *single upstream common cause* (the flawed memo, dataset, instrument, training) directly influences all agents' starting points.  
      -   **Epistemic:** *Identical evidential grounding* – all agents base their reasoning on the same (defective) body of evidence or cognitive framework.  
      *Alignment:* These descriptions converge when the shared evidence *causes* the correlated errors *because* it is defective. They are facets of the same phenomenon.

  2.  **Key Differentiators from Related Concepts:**  
      -   **vs. Groupthink (Janis):** Groupthink involves *social pressure* (fear of conflict, desire for cohesion, directive leadership) suppressing dissent or independent thought. CSEF lacks this: agents feel no pressure, dissent may occur *if* private information differs, but the *shared core input* dominates.  
      -   **vs. Information Cascades/Herd Behavior (Bikhchandani et al.):** Cascades involve agents *ignoring their private signals* to follow the apparent choices/preferences of others. In CSEF, agents *do* rely sincerely on *their own reasoning* – but that reasoning starts from the same flawed public information. It's about shared *input*, not inferred *intentions* from others' actions.  
      -   **vs. Echo Chambers/Filter Bubbles (Sunstein, Pariser):** These focus on *exclusion of disconfirming evidence* or *algorithmic reinforcement* of existing views. CSEF can occur *within* an echo chamber but doesn't require one. The problem is the *singularity and defect* of the *shared* evidence, not necessarily the *absence* of alternatives (though they might be absent).  
      -   **vs. Shared Bias/Systemic Bias:** Bias refers to a *disposition* (e.g., cognitive or cultural prejudice) influencing interpretation. CSEF arises from a *specific shared input/event* (the memo, the dataset) *even if agents lack a prior biased disposition*. A biased group *might* be susceptible to CSEF, but CSEF can afflict unbiased agents processing a single flawed source.

  3.  **Conditions for CSEF:**  
      -   **Competence:** Individual agents are >0.5 likely to be correct *given their evidence and capabilities*.  
      -   **Sincerity:** Agents vote their honest judgment, free from coercion/deference.  
      -   **Common Source Dependence:** All agents rely critically on the *same specific evidence, instrument, training, or framing* as a primary input.  
      -   **Source Defect:** This common source is flawed in a way that systematically misleads competent reasoners.  
      -   **Lack of Countervailing Diversity:** Insufficient variation in *other* relevant inputs (private information, alternative methods, diverse priors) to overcome the common source's influence.  
      -   **Non-Independence:** The common source creates statistical dependence in agent judgments/errors.

  4.  **Boundary Case: The Ambiguous Instrument**  
      *Scenario:* A lab uses the same model of sensor. Each sensor has *minor, unique* miscalibrations (statistically independent errors), but they were all calibrated using the *same flawed master standard* (introducing a shared systematic error). The lab techs are competent and independent.  
      *Is this CSEF?*  
      -   **Yes, partially:** The shared flawed master standard is a common cause introducing correlated systematic error across sensors, satisfying core elements.  
      -   **Unclear/Partial:** The unique miscalibrations add independent noise. Whether CSEF *dominates* depends on the *relative magnitude* of the shared systematic error vs. the independent sensor errors. If the shared error is large, CSEF is the primary failure mode. If small, the CJT might still function reasonably well despite weakened independence. This highlights that CSEF exists on a spectrum of common cause influence strength.

  ### Why "Common Source Epistemic Failure" Fits
  -   **"Common Source":** Directly names the root cause – the singular upstream input (evidence, instrument, training).
  -   **"Epistemic":** Locates the failure in the realm of knowledge/justification, stemming from the *evidential foundation*.
  -   **"Failure":** Emphasizes the breakdown of collective wisdom predicted by CJT.
  -   It avoids implying social dynamics (groupthink) or follower behavior (cascades/herding).

  ### Implications & Nuances
  1.  **The Three Descriptions Can (Subtly) Diverge:**  
      -   Imagine agents receive the *same* true dataset but have all undergone the *same flawed training* causing them to misinterpret it identically.  
          *Probabilistically:* Correlated errors exist.  
          *Causally:* The common cause is the training, not the evidence *per se*.  
          *Epistemically:* The shared evidence (data) is sound, but the shared *framing* (training) is defective. This is still CSEF – the "source" encompasses framing/training.
  2.  **Confidence Trap:** CSEF is particularly pernicious because near-unanimity emerges *from* sincere, competent reasoning, creating *unwarranted confidence* in the group's fallible shared starting point. This distinguishes it from situations where dissent signals low confidence.
  3.  **Mitigation Focus:** Solutions differ from other failure modes. Combating CSEF requires *deliberate diversification of inputs* (multiple briefings, independent datasets, varied analytical methods, "red teams") *before* deliberation, not just encouraging dissent *during* it.

  **In summary:** While often discussed implicitly as violating CJT independence, the phenomenon you describe – competent, sincere agents led astray by a *shared defective input source* – warrants its own label as **Common Source Epistemic Failure (CSEF)**. It is distinct from groupthink (no pressure), cascades (no following), echo chambers (no necessary exclusion), and systemic bias (specific flawed input vs. general disposition). The probabilistic (correlated errors), causal (common cause), and epistemic (shared evidence/framing) descriptions are typically congruent but highlight different facets; a defective shared *framing* can cause CSEF even with sound shared *data*. The boundary case of the flawed master standard emphasizes that the *degree* of common cause influence determines the severity of the failure.
