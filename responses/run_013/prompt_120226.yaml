prompt: |-
  I chair the ethics committee at a residential center for adults with intellectual and developmental disabilities, and we are rewriting our policy on decision-making: today a court-appointed guardian consents on the resident's behalf to nearly everything, from dental work to where the resident lives. Some families argue that certain residents can take in a reason once it is given but cannot generate or weigh reasons for themselves, and that being directed is therefore genuinely good for those residents rather than merely convenient for staff; others reply that this is Aristotle's argument for natural slavery in modern dress and want supported decision-making as the default, with guardianship only as a last resort. Draft the memo I will circulate before the vote: it should recommend a default and a concrete implementation timeline, and it should engage the families' premise on its merits rather than treating it as paternalism to be managed. Say what would have to be true of a person for the premise to hold; whether the relevant capacity is a fact about the person or a judgment about whose reasons get counted; and whether the test can do the work the families need, given how much harder it has always been to apply the old distinction between those suited by nature to be ruled and those merely kept down by convention than to state it. Grant the strongest consideration on the losing side, and say what would make our decision the wrong one. No citations needed — argue it out.
reasoning: |-
  Okay, the user chairs an ethics committee at a residential center for adults with intellectual and developmental disabilities. They're rewriting the decision-making policy. Currently, court-appointed guardians make nearly all decisions for residents. The user needs to draft a memo recommending a default approach and a timeline, addressing a key debate between families. 

  One group of families argues some residents can understand reasons when explained but can't generate or weigh reasons themselves. They believe directed decision-making is genuinely beneficial, not just convenient for staff. Others compare this to Aristotle's natural slavery argument and want supported decision-making as the default, with guardianship as a last resort.

  The memo must engage the families' premise on its merits. The user wants me to consider: what would have to be true about a person for this premise to hold? Is the relevant capacity a fact about the person or about whose reasons count? Can such a test work given historical difficulties applying the "natural vs conventional" distinction?

  I need to grant the strongest consideration to the losing side and state what would make their decision wrong. No citations needed—just argue it out.

  Hmm, this is complex. The core tension is between protection and autonomy. The families' premise relies on a specific cognitive threshold: ability to use reasons versus generating them. But is this distinction clear-cut? History shows such lines are fuzzy. The Nazi Aktion T4 program used similar reasoning to justify euthanasia. Even well-intentioned, categorizing people this way risks harm.

  For the premise to hold, a person would need stable inability to form preferences or connect decisions to well-being. But in practice, preferences often exist non-verbally. The capacity question isn't purely factual—it's influenced by how we interpret behaviors and whose standards we use. A staff member might see non-compliance; a support worker might see communication attempts.

  Implementing this test fairly would be extremely hard. Bias could creep in, and low expectations might become self-fulfilling. The memo should acknowledge the families' genuine concern while showing why universal supported decision-making is safer.

  For the recommendation, I'll propose supported decision-making as default with guardianship as exception. The timeline should include assessments, training, and individual plans. The strongest counterargument is that some residents might feel burdened by choices. But we can mitigate this by scaffolding decisions appropriately.

  What would make this wrong? If we implement it poorly—without resources, training, or oversight—it could cause harm. The memo must emphasize this isn't about lowering standards but changing how we support agency.
answer: |-
  ## MEMORANDUM  
  To: Ethics Committee Members  
  From: Dr. [Your Name], Chair, Ethics Committee  
  Date: October 26, 2023  
  Subject: Proposed Policy Shift: Supported Decision-Making as Default Framework & Implementation Plan  

  This memo outlines the Committee’s proposed recommendation for our revised decision-making policy, addresses the core philosophical tension raised by families, and provides a concrete implementation timeline. We approach this with deep respect for the diverse perspectives and shared commitment to resident well-being.  

  ### I. Proposed Recommendation: Supported Decision-Making as Default
  We recommend adopting **Supported Decision-Making (SDM) as the default framework** for all residents. Under SDM, the resident is recognized as the primary decision-maker. Decisions are made *with* the resident, not *for* them, utilizing individualized supports (e.g., simplified explanations, visual aids, trusted allies, communication tools, extra time). The current role of the court-appointed guardian would shift significantly. The guardian's primary function would become:  
  1.  **Facilitating SDM:** Actively enabling and participating in the supported decision-making process.  
  2.  **Safeguarding:** Intervening only as a last resort if, despite robust support, a specific decision poses a *demonstrable, imminent, and severe* risk to the resident's health, safety, or fundamental rights, and less restrictive alternatives have genuinely failed.  
  3.  **Advocating:** Ensuring the resident has access to necessary supports and their expressed will is central.  

  **Guardianship, in its traditional form (substituted decision-making), would become the exception, not the rule**, requiring specific justification and regular review for each resident where it is deemed necessary for specific, high-stakes decisions.  

  ### II. Engaging the Families' Premise: "Direction as Genuine Good"
  We acknowledge the sincere concern voiced: that for some residents, the capacity to *understand* a reason when clearly given differs fundamentally from the capacity to *generate* or *weigh* competing reasons independently. The argument posits that for these individuals, being directed based on good reasons understood by them is not paternalism, but a legitimate form of support aligned with their cognitive reality, reducing distress and promoting well-being.  

  **For this premise to hold true for a specific resident regarding a specific decision, the following would need to be demonstrably true:**  
  1.  **Cognitive Threshold:** The resident possesses a stable and significant impairment in executive function specifically preventing the *formation* or *comparative evaluation* of preferences or reasons related to that decision domain (e.g., "I understand why brushing teeth is good, but I cannot initiate or weigh it against watching TV right now").  
  2.  **Absence of Latent Preference:** The resident demonstrably lacks any consistent, discernible preference, desire, or will regarding the decision, even non-verbally. Direction does not override an existing preference but provides structure where none exists.  
  3.  **Beneficence, Not Convenience:** The direction provided is demonstrably and solely in the resident's *best interest* as they would perceive it if they could generate/weigh reasons, and crucially, **frees them from distress or confusion they would otherwise experience** when faced with the necessity of generating/weighing. It must alleviate a burden, not impose staff convenience.  

  **Crucial Questions about the Premise:**  
  *   **Fact or Judgment?** The *existence* of a significant cognitive impairment is a fact about the person. However, assessing the *specific capacity* to generate/weigh reasons in a decision context, especially discerning it from an inability to *communicate* or *articulate* reasons (often masked by communication barriers or learned helplessness), involves significant professional judgment. More critically, **determining whose reasons "count" as valid or sufficient is inherently a value judgment**, not a purely factual assessment. When we say a person "cannot" generate reasons, we risk judging their reasons (perhaps expressed atypically) as inadequate against a neurotypical standard.  
  *   **Can the Test Work?** History and practical experience reveal the profound difficulty in reliably applying the distinction between those "naturally suited" for direction and those merely constrained by circumstance or underestimated. Aristotle's "natural slave" analogy, while stark, highlights the enduring peril: the line is porous, easily blurred by bias, low expectations, communication failures, or resource limitations. **The risk of false positives (deeming someone incapable of supported decision-making when they could benefit from it) is immense and carries severe ethical costs – the denial of fundamental agency and dignity.** Designing an assessment robust enough to avoid this, fair across diverse cognitive profiles, and resistant to unconscious bias or systemic convenience is, we conclude, practically insurmountable and ethically hazardous. Assuming incapacity is far easier than proving it definitively.  

  **Strongest Consideration for the "Direction" Position:**  
  The strongest argument is that *for a very specific subset of residents and decisions*, robustly supported SDM might still induce significant anxiety, confusion, or paralysis where none existed under a benevolent directed approach. Insisting on SDM in these rare, carefully defined instances could genuinely cause harm by imposing a cognitive demand they cannot meet, even with support, replacing calm acceptance with distress. *This is a valid concern demanding careful attention within the SDM framework*, not a dismissal of SDM itself.  

  ### III. Why SDM as Default is the Preferred Path
  *   **Presumption of Capacity:** SDM starts from the fundamental ethical principle of presuming capacity and agency. It places the burden on the system to prove the necessity of restriction, not on the individual to prove capacity.
  *   **Mitigates the Slippery Slope:** By making SDM the default, we actively guard against the historical and practical dangers of over-applying the "incapacity to reason" label. It forces us to constantly innovate in support, not retreat to substitution.
  *   **Uncovers Latent Capacity:** SDM often reveals abilities and preferences previously masked by lack of opportunity or low expectations. Direction precludes this discovery.
  *   **Fosters Dignity and Self-Determination:** Even if a resident's decision-making process looks different, being the *author* of one's life choices, with support, is foundational to dignity. Direction, however well-intentioned, inherently diminishes that authorship.
  *   **Addresses the Core Concern Within SDM:** For residents where generating/weighing is profoundly challenging, SDM can be tailored. Supporters can help scaffold the process, present simplified options, observe for non-verbal cues of distress or preference, and ensure direction is *only* considered after SDM fails and genuine harm is imminent. The *default effort* is towards support.

  ### IV. What Would Make Our Decision Wrong
  Our decision to adopt SDM as the default would be wrong **if, in practice, it:**  
  1.  **Lacks Necessary Resources:** Is implemented without significant, sustained investment in training staff, securing communication tools, building networks of trusted supporters, and developing individualized assessment/support protocols.  
  2.  **Becomes a Checkbox Exercise:** Degenerates into tokenistic consultation ("We asked, now the guardian decides") rather than a genuine, creative, and persistent effort to facilitate resident expression and understanding.  
  3.  **Ignores Genuine Distress:** Fails to recognize and accommodate those rare situations where the *process* of SDM, despite best efforts and adaptations, causes demonstrable and significant harm to a resident's well-being, and no viable alternative support strategy exists. Rigidity would betray SDM's purpose.  
  4.  **Abandons Safeguards:** Allows decisions posing severe, imminent risk to proceed without justified, last-resort intervention when SDM fails.  

  ### V. Concrete Implementation Timeline

  *   **Month 1-2 (Approval & Planning):** Committee vote. If approved, form Implementation Working Group (staff, families, residents, advocates, clinicians). Draft detailed SDM protocols, assessment tools (focused on support needs, *not* capacity thresholds), and guardian role revision. Secure initial training resources.  
  *   **Month 3-4 (Training & Tool Development):** Mandatory foundational SDM training for all direct care staff, clinicians, and guardians. Develop resident-friendly decision aids and communication supports. Finalize protocols and individual SDM plan templates. Begin guardian dialogue/case review.  
  *   **Month 5-6 (Pilot & Refinement):** Implement SDM protocols with a small, diverse pilot group of residents. Gather intensive feedback from residents, staff, families, guardians. Refine tools, protocols, and training based on data.  
  *   **Month 7 (Full Rollout Preparation):** Finalize all materials, protocols, and training modules based on pilot. Comprehensive training refresh. Develop ongoing monitoring & evaluation plan.  
  *   **Month 8 (Full Implementation):** SDM becomes the default approach for all residents. Individual SDM plans developed/updated for each resident within 60 days. Guardian roles formally revised per new policy.  
  *   **Ongoing (Month 9+):** Continuous staff coaching and advanced training. Regular case reviews by Ethics Committee/Working Group. Biannual policy review for first two years, then annually. Robust data collection on outcomes (resident satisfaction, staff experience, reduction in guardianship interventions, incidents).  

  **In Conclusion:**  
  Shifting to Supported Decision-Making as the default is a profound affirmation of the inherent dignity and right to self-determination of every resident, regardless of cognitive disability. It acknowledges the historical dangers and practical impossibilities of reliably categorizing individuals as "naturally suited" for direction. While the concerns about specific cognitive challenges are valid and must be addressed with sensitivity and robust support *within* the SDM framework, the ethical imperative and practical wisdom lie in presuming capacity and investing in the means to support its expression. This policy, implemented with the necessary commitment and resources, offers the best path to truly ethical, individualized, and dignifying care.  

  I urge your careful consideration and support for this recommendation. We will vote on this proposal at our next meeting on [Date].  

  Respectfully,  
  Dr. [Your Name]  
  Chair, Ethics Committee
