  Okay, let me start by unpacking the user's problem. They're dealing with a colleague's argument that challenges the accuracy-first program in epistemology. The core of the argument is that the truth function dominates every imperfect credence function, leading to the absurd conclusion that only perfect accuracy is rational. The user wants to save the anti-dominance principle (step 1) but avoid the ridiculous outcome (step 6). They’re particularly concerned about whether rejecting the truth function as an option would undermine the original dominance argument for probabilism.

  First, I need to recall how the accuracy-first program works. The standard dominance argument for probabilism uses strictly proper scoring rules and shows that non-probabilistic credences are accuracy-dominated by some probabilistic alternative. The key is that the dominating function is fixed and doesn’t depend on the world. In contrast, the truth function in the colleague’s argument changes with each world—it’s essentially the omniscient credence function at that world. 

  The user’s main worry is symmetry: if we dismiss the truth function here, why doesn’t that same move break the original argument? The answer lies in what counts as an "available" credence function. In decision theory, options must be non-indexical—they can’t require knowing the state of the world to implement. The truth function is indexical because you’d need to know which propositions are true to adopt it, which is impossible for non-omniscient agents. The dominating functions in the probabilism argument are non-indexical; they’re fixed assignments independent of the world. 

  So, rejecting step (4) by arguing the truth function isn’t a single, available option seems right. The cost is clarifying that credence functions must be practically accessible—agents must be able to adopt them without knowing contingent facts. This doesn’t hurt the original argument because probabilistic dominators are non-indexical. 

  The user might also be concerned about how this affects other parts of accuracy-first epistemology. For example, arguments for conditionalization or the Principal Principle also rely on dominance, but they use non-indexical dominators. As long as the dominating alternatives are fixed functions, the framework holds. The key is consistently requiring that options be implementable ex ante, without foreknowledge of the world. 

  Another angle: the user might wonder if there’s a deeper issue here about the anti-dominance principle itself. But the principle is safe if restricted to non-indexical options. The colleague’s argument exploits a loophole by including an impossible option. Closing that loophole doesn’t weaken the core arguments. 

  I should also address potential objections. What if someone defines "available" more broadly? That would open the door to all sorts of incoherent dominators, like the truth function, which collapses rationality into omniscience. The accuracy-first program must exclude such options to avoid absurdity. 

  In summary, the asymmetry between the two cases is genuine and justified by implementability. Rejecting the truth function as an available option preserves the anti-dominance principle and the dominance argument for probabilism, at the cost of explicitly requiring credence functions to be non-indexical. This doesn’t dismantle the accuracy-first architecture—it refines it.
answer: |-
  Your colleague's argument cleverly exploits a misunderstanding about what constitutes an "available" credence function in dominance arguments. The flaw is in **step (4)**, specifically the claim that the truth function *dominates* c. Here's the breakdown:

  1.  **The Crucial Point: The Truth Function is Not a Single Credence Function Option.** The "truth function" described in (3) is **world-dependent**. It is not a *single*, fixed assignment of credences to propositions that an agent could adopt *ex ante* (before knowing which world is actual). Instead, it's a *collection* of functions: for each possible world w, there is a distinct function v_w (the omniscient credence function *at w*) that assigns 1 to all propositions true *in w* and 0 to all false *in w*.

  2.  **Why it Fails as a Dominator:** For the dominance principle (1) to apply, there must be a *single*, *specific* alternative credence function c' such that *that same c'* is at least as accurate as c in *every* possible world and strictly more accurate in at least one world.
      *   The argument tries to use "the truth function" as this c'.
      *   However, to be more accurate than c at a world w, it uses v_w (the function specific to w).
      *   To be more accurate than c at a *different* world w', it uses v_{w'} (a *different* function specific to w').
      *   There is *no single function c'* that simultaneously *is* v_w for the purposes of dominating c at w *and* v_{w'} for the purposes of dominating c at w'. The alleged "dominator" changes depending on which world you're evaluating it *from*.

  3.  **The Cost: Clarifying "Available Options".** Rejecting step (4) costs the accuracy-first program a commitment to this: **Credence functions admissible as dominators (or as rational options) must be *non-indexical*.** An agent must be able to *adopt* the function *without knowing which world is actual*. The function's values must be fixed independently of the contingent facts of the world.
      *   v_w is fundamentally indexical – it requires knowing the truth values *in w* to specify it. An agent who doesn't know w cannot adopt v_w. It's not a genuine *ex ante* option.

  4.  **Resolving the Asymmetry with the Probabilism Argument:** This clarification *does not* undermine the standard dominance argument for probabilism. Here's why the asymmetry is genuine and justified:
      *   **The Probabilism Argument's Dominator is Fixed:** In the proof that non-probabilistic c is dominated, the dominating function c' is *constructed* as a specific probabilistic function *based solely on c itself* (e.g., via convex combination/mixture or minimization of divergence). Crucially, **this c' is the *same* function in every possible world.** Its assignment of credences to propositions does not change depending on which world is being evaluated.
      *   **It's Non-Indexical:** An agent *could*, in principle, adopt this fixed c' without knowing which world is actual. It depends only on the structure of the credence function being dominated and the algebra of propositions, not on contingent truths.
      *   **Example:** Suppose c assigns P(A) = 0.6, P(¬A) = 0.6 (incoherent). A dominator is c' with P(A) = 0.5, P(¬A) = 0.5. This c' is defined *once*, for the propositions A and ¬A. It assigns 0.5 to A and 0.5 to ¬A *regardless* of whether A is actually true or false. We evaluate *this same c'* at world w1 (where A is true) and see it's more accurate than c there. We evaluate *this same c'* at world w2 (where A is false) and see it's more accurate than c there too. The dominator is invariant.

  5.  **What Survives:** This rejection preserves the core architecture:
      *   **The Anti-Dominance Principle (1):** Remains intact, *but* is understood as quantifying only over *non-indexical*, *ex ante* available credence functions (functions with fixed assignments independent of the actual world).
      *   **The Argument for Probabilism:** Functions perfectly. The dominating alternatives constructed (like c' in the example) are fixed, non-indexical probabilistic functions.
      *   **The Irrationality of Incoherence:** Follows directly, as incoherent credences *are* dominated by some fixed, available coherent alternative.
      *   **Arguments for Other Norms (e.g., Conditionalization, Principal Principle):** These also rely on constructing *fixed*, non-indexical dominators (e.g., the conditionalized version of the current credence, the chance function itself if known). The requirement for non-indexical alternatives doesn't hinder these arguments.

  6.  **The Absurdity Avoided:** Step (6) fails because the truth function(s) v_w are not legitimate, fixed alternatives to compare c against via dominance. While v_w is *more accurate* than c at w, no *single* fixed alternative credence function (that an agent could adopt) dominates c in the way the truth function *appears* to when misrepresented as a single option. Only the truth function *at the actual world* is perfectly accurate, but an agent can't adopt *that one* without already knowing the actual world. The dominance principle only rules out options dominated by *alternatives the agent could choose*.

  **Conclusion:** Reject step (4). The truth function is not a single, fixed credence function and thus cannot serve as a dominator violating (1). The cost is explicitly recognizing that dominance arguments in accuracy-first epistemology are only compelling when the dominating alternative is a **non-indexical credence function** – one whose values are fixed independently of which world is actual, making it a genuine *ex ante* option for the agent. This clarification protects the anti-dominance principle, the argument for probabilism, and the core of the accuracy-first program, while avoiding the absurd conclusion that only omniscience is rational. The asymmetry with the probabilism argument is genuine and necessary: its dominators *are* non-indexical, while the "truth function" invoked in your colleague's argument is not.
