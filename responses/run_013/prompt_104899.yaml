prompt: |-
  I run the analytics team at a ~400-person company and I've somehow ended up as the unwilling owner of our quarterly metric review. Teams pitch new OKRs and dashboard numbers, I'm supposed to sign off before they go live, and right now my whole process is vibes: I ask "does this seem gameable?", everyone says no, and six months later we find out the sales team was doing something gross to hit the number. I've read enough about Goodhart's law and specification gaming to know that "gameable" isn't a yes/no property and that the interesting failures are structural, but I have no idea how to turn any of that into something my team can actually run in a 45-minute meeting. Nobody on the team is a statistician. Whatever we adopt I have to defend to the exec team, so the process needs to leave a paper trail of why a metric passed.

  Two things I keep tripping on and I'd like the procedure to actually handle. First, I think there's two different failures and everyone lumps them together: in one, the number was a decent measure to begin with but people start optimizing it directly and it drifts off the thing we cared about; in the other, the number never measured the thing at all and we all just quietly agreed to call it the thing. The fixes seem completely different and I can never tell the two apart in a meeting. Second, someone once told me there are like four flavors of this and I can never remember them — something about the number being fine on average but falling apart at the extremes, something about the causal link between the number and the goal breaking once you push on it, something about deliberate sabotage, and something about the very act of selecting on the number changing what it predicts. I'd like the procedure to force us to name which one we're worried about, because "it might be gamed" is useless as a finding.

  Can you write me the procedure? Format it like this:

  1. "What's actually going wrong" — one short paragraph, plain language, so I can paste it at the top of the doc.

  2. "The procedure" — the bulk of it. The questions to ask in order, what counts as a passing answer to each, where it stops and rejects a metric outright, and where it hands the decision to a human because it's really a values or incentives call and not a measurement call. Keep it runnable by non-statisticians in under an hour, and flag any step that's secretly a judgment call dressed up as a test.

  3. "Three reviews" — run the procedure on (a) a proposed per-agent "customer happiness" score for our support team, (b) a "code quality" score we want to put on the engineering dashboards, and (c) an "incidents per quarter" safety number. Roughly a third of a page each. At least one of these should come out with an answer I won't like — the procedure clears a metric I personally distrust, or kills one I like, or says the metric is fine and the real problem is our threshold or the incentive attached to it, which I'd then have to take back to the exec team.

  4. "Where I still have to guess" — 5 to 8 bullets, the places the procedure can't decide for us.

  5. "What this procedure can't do" — short and honest, half a page.

  Don't bother citing papers, I won't read them — just tell me what's actually known and usable.
reasoning: |-
  We are designing a procedure to evaluate metrics for potential gaming and misalignment. The goal is to catch issues early and have a clear paper trail.

  The user identifies two main failure modes:
  1. Metric drift: The metric was good initially but optimizing it causes it to drift from the intended goal.
  2. Metric misrepresentation: The metric never measured the goal in the first place.

  Additionally, the user recalls four flavors of gaming (likely referring to Goodhart's law and related concepts). From the description, we can map these to:
  a) The metric breaks at the extremes (distribution shifts).
  b) The causal link breaks under pressure (when you push on the metric, the connection to the goal weakens or breaks).
  c) Deliberate manipulation (sabotage).
  d) Selection effects (selecting on the metric changes what it predicts).

  We'll design the procedure to force the team to consider these.

  Procedure Outline:

  1. **Define the Goal and Metric**: Clearly state what we care about and how the metric is supposed to measure it.
  2. **Check for Misrepresentation (Never Measured)**: Does the metric actually capture the goal?
  3. **Check for Direct Gaming (Drift)**: What are the ways the metric can be gamed? How might optimization break it?
  4. **Consider the Four Flavors**: We'll break down the gaming potential into specific categories and ask for each.
  5. **Incentive and Threshold Review**: Even if the metric is sound, the way it's used (thresholds, incentives) might cause issues.

  We'll structure the procedure as a checklist with clear pass/fail criteria and places for human judgment.

  ---

  **1. What's actually going wrong**

  We're picking metrics that seem good on the surface but end up driving unwanted behaviors. Sometimes the metric was a decent measure but gets distorted when people optimize for it. Other times, the metric never actually measured what we cared about. We need a way to spot these issues early and either fix the metric or design safeguards.

  **2. The procedure**

  **Step 0: Pre-work (before the meeting)**
  - The proposing team must fill out a one-pager:
    - **Goal**: What outcome are we trying to achieve? (e.g., "improve customer satisfaction")
    - **Metric**: What number are we proposing? (e.g., "average post-call survey score")
    - **Baseline**: Current value and how it's calculated.
    - **Why this metric?**: Why is this the right way to measure the goal?
    - **Known issues**: Any current gaps or ways it might be gamed?
  - This doc is shared 24h before the meeting.

  **Step 1: Goal-Metric Alignment (10 mins)**
  - Question: "Does this metric actually measure the goal, or is it just correlated with it?"
  - Check: 
    - If the metric is a direct, unambiguous measure of the goal (e.g., "revenue" for "make more money"), pass.
    - If it's a proxy, we need a clear story of how it connects. If the connection is weak or relies on unproven assumptions, flag as misalignment risk.
  - Passing: The team can explain the causal link or direct representation without hand-waving.
  - Failing: The metric is clearly a bad fit (e.g., measuring "code quality" by lines of code). Reject and ask for a new metric.

  **Step 2: Gaming Scenarios (15 mins)**
  - Question: "If someone really wanted to make this metric look good without actually improving the goal, how could they do it?"
  - Check: Brainstorm ways to game the metric. Categorize each gaming attempt into:
    a) **Distortion**: Manipulating the measurement process (e.g., survey pestering for happiness scores).
    b) **Selective focus**: Hitting the metric by neglecting other important areas (e.g., closing easy tickets to boost resolution time, ignoring hard ones).
    c) **Exploiting variance**: Gaming the average by avoiding hard cases or extremes (e.g., only taking easy support calls).
    d) **Direct sabotage**: Falsifying data or deliberately undermining the system (e.g., marking unresolved tickets as resolved).
  - Passing: The team has safeguards (e.g., counter-metrics, auditing) for each plausible scenario, OR the gaming would be too costly/difficult to execute.
  - Failing: There's an obvious, low-cost way to game with no mitigation. Reject or require safeguards.

  **Step 3: Pressure Test (10 mins)**
  - Question: "What happens when we push hard on this metric? Does it break the link to the goal?"
  - Check: 
    - Imagine the metric improves by 20%. Would the goal also improve? 
    - What if we set a very high target? Would teams start doing destructive things?
    - Does the metric work at all levels? (e.g., if we drive "customer happiness score" from 4.0 to 4.5, is that still meaningful?)
  - Passing: The team can explain why the link holds even under pressure, or they set reasonable targets/guardrails.
  - Failing: The link breaks under pressure (e.g., pushing "incidents per quarter" to zero might cause engineers to avoid necessary changes). Flag as high risk and require target adjustments or a different metric.

  **Step 4: Incentive and Threshold Check (5 mins)**
  - Question: "How will this metric be used? What incentives or consequences are attached?"
  - Check:
    - Are there bonuses, penalties, or public shaming tied to this number?
    - Is there a hard threshold (e.g., "must stay below 5 incidents/quarter")?
    - If the answer is "none, it's just informational", pass.
    - If incentives/thresholds exist, are they designed to avoid perverse behaviors? (e.g., a threshold with a buffer, incentives balanced with counter-metrics).
  - Passing: Incentives are soft or well-buffered; thresholds have safe zones.
  - Failing: Hard incentives/thresholds that might force gaming. Do not reject the metric, but require a redesign of the incentive or a governance plan.

  **Step 5: Final Call (5 mins)**
  - If the metric passed Steps 1-4, approve.
  - If it failed any step but the team proposes safeguards (audits, counter-metrics, adjusted targets), conditionally approve with those safeguards documented.
  - If it failed Step 1 or 2 with no fix, reject.

  **Paper Trail**: The one-pager becomes the record, with notes from the meeting attached. The outcome (approved/rejected) and any conditions are recorded.

  **Secret Judgment Calls Flagged**:
  - Step 1: Assessing the strength of the causal link is a judgment call. We rely on the team's explanation and common sense.
  - Step 2: Deciding if a gaming scenario is "plausible" is subjective. We err on the side of over-identifying risks.
  - Step 3: Predicting behavior under pressure is speculative. We use historical data if available, else it's a judgment call.

  **3. Three reviews**

  **Review A: Per-agent "Customer Happiness" Score for Support Team**

  - **Goal**: Improve individual support agent performance in making customers happy.
  - **Metric**: Average rating from post-interaction surveys (1-5 scale) per agent.
  - **Step 1**: Aligns? Yes, direct measure of customer happiness. But only if the survey captures it. Risk: unhappy customers don't take surveys. **Pass with note**: We assume survey responders are representative.
  - **Step 2**: Gaming? 
    a) Distortion: Agents might beg for high scores. 
    b) Selective focus: Agents transfer hard customers to avoid low scores. 
    c) Exploiting variance: Agents avoid complex cases. 
    d) Sabotage: Agents fake surveys. **Fail** without safeguards. 
    - Proposed safeguard: Monitor survey participation rate and track transfer rates. Also, audits for fake surveys. **Conditional pass** with safeguards.
  - **Step 3**: Pressure test? If we push for 4.8, agents might avoid tough cases. Link breaks under high pressure. **Flag**: Risk of breaking link. Require a reasonable target range and pair with other metrics (e.g., resolution rate).
  - **Step 4**: Incentives? Tied to bonuses. This is risky without safeguards. **Conditional pass** only if incentives are blended with other metrics (e.g., volume handled).
  - **Outcome**: Conditional approval. Must implement safeguards: balanced scorecard (with volume, transfer rate), audit plan, and avoid extreme targets.

  **Review B: "Code Quality" Score for Engineering**

  - **Goal**: Improve the maintainability and reliability of our codebase.
  - **Metric**: Composite score (0-100) of static analysis checks (e.g., test coverage, complexity, linting).
  - **Step 1**: Aligns? Partially. Static analysis measures some aspects of quality but not all (e.g., design, architecture). Weak link to actual maintainability. **Risk of misrepresentation**. **Fail** unless they can show correlation with outcomes (e.g., fewer bugs in well-scored code).
  - **Step 2**: Gaming? 
    a) Distortion: Engineers might write trivial tests to boost coverage. 
    b) Selective focus: Fixing easy linting errors instead of hard design issues. 
    c) Exploiting variance: Not applicable. 
    d) Sabotage: Disabling linter rules. **Fail** without strong safeguards.
  - **Stop here**: Failed Step 1. Reject as primary metric. Suggestion: Use as one indicator among others (e.g., PR review time, bug rates).

  **Review C: "Incidents per Quarter" Safety Number**

  - **Goal**: Reduce system instability and improve reliability.
  - **Metric**: Total production incidents (SEV1+SEV2) per quarter.
  - **Step 1**: Aligns? Direct measure of major failures. **Pass**.
  - **Step 2**: Gaming? 
    a) Distortion: Teams might downgrade incidents to SEV3 to avoid counting. 
    b) Selective focus: Avoiding necessary changes to prevent incidents. 
    c) Exploiting variance: Not really. 
    d) Sabotage: Hiding incidents. **Fail** without safeguards.
  - **Proposed safeguard**: Clear incident criteria, independent review of classifications, and a parallel metric for change volume. **Conditional pass**.
  - **Step 3**: Pressure test? If we push for zero incidents, teams might stop deploying. Link breaks under high pressure. **Flag**: Risk of stagnation. Require a target that allows for some incidents (e.g., <5) and pair with deployment frequency.
  - **Step 4**: Incentives? Used in exec reviews with a target of "under 5". Hard threshold risk. **Conditional pass** if they add a buffer (e.g., target is 5, but no penalty for 6) and pair with a "deployment frequency" metric to encourage innovation.
  - **Outcome**: Conditional approval with safeguards.

  **4. Where I still have to guess**

  - **How much risk is acceptable?** The procedure flags risks, but we have to decide what level of residual risk we can live with.
  - **What's a "reasonable" target?** Step 3 identifies pressure risks, but setting the actual target is outside the procedure.
  - **Are safeguards enough?** We can require counter-metrics, but we don't know if they'll be effective until we try.
  - **Is the causal link strong enough?** Step 1 is a judgment call without rigorous testing.
  - **Will people actually game it?** We can imagine scenarios, but we don't know which ones will happen.
  - **How do we balance multiple metrics?** The procedure doesn't design the entire incentive system.
  - **What's the cost of not having a metric?** Sometimes a flawed metric is better than nothing, but that's a business call.

  **5. What this procedure can't do**

  - **Predict the future**: We're making educated guesses about human behavior. People will invent new ways to game metrics we thought were safe.
  - **Fix bad incentives**: If the company culture is punitive, even a perfect metric will be gamed. This is a governance issue, not a measurement one.
  - **Replace data**: We can't prove a metric is valid without historical data and experimentation. This is a pre-launch check, not a validation.
  - **Handle complex systems**: For metrics that interact with many parts of the business (e.g., company-wide efficiency scores), the gaming scenarios become too numerous to anticipate.
  - **Make trade-offs for you**: Sometimes a metric has known flaws but is the best available. The procedure will flag the flaws, but you have to decide if the trade-off is worth it.
  - **Eliminate judgment**: Many steps rely on experience and common sense. There's no algorithm for human behavior.
  - **Audit itself**: We won't know if the procedure worked until a metric fails in production. We should revisit metrics annually.

  ---
  We've built a procedure that:
  - Separates misalignment (Step 1) from drift (Steps 2-3).
  - Forces the team to consider specific gaming flavors (Step 2).
  - Provides clear rejection points (Step 1 and 2 failures) and conditional approvals.
  - Generates a paper trail via the one-pager and meeting notes.
  - Fits in 45 minutes by focusing on the highest risks.

  The three reviews show how it might play out, including a rejection (code quality) and conditional approvals with safeguards.
answer: |-
  ### Metric Anti-Gaming Review Procedure  
  **For: Analytics Team | Time: ≤45 min | Goal: Catch misaligned metrics early**  

  ---

  #### 1. **What’s actually going wrong**  
  We’re picking metrics that *seem* like they measure our goals but end up encouraging bad behavior or missing the point entirely. Sometimes the metric starts okay but gets distorted when teams optimize it ("drift"). Other times, it never measured the real goal to begin with ("misrepresentation"). This procedure forces us to spot these flaws *before* the metric goes live, so we don’t waste 6 months cleaning up messes.  

  ---

  #### 2. **The procedure**  
  **Pre-work (before meeting):**  
  - Proposing team submits a 1-pager:  
    - **Goal**: What outcome do we *actually* care about? (e.g., "Improve product stability")  
    - **Metric**: Exact calculation, data source, and reporting frequency.  
    - **Owner**: Who’s accountable?  
    - **Incentives**: How will this be tied to rewards/pressure? (Bonuses? Public dashboards?)  

  **In-Meeting Steps (45 min max):**  

  | Step | Question to Ask | What a "Pass" Looks Like | Red Flags (Fail/Revise) | Judgment Call? | Time |  
  |------|-----------------|--------------------------|--------------------------|----------------|------|  
  | **1. Goal-Metric Link** | "Is this metric a *direct* signal of the goal, or just loosely correlated?" | Clear explanation of *how* the metric reflects the goal (e.g., "Reduced incidents → fewer outages"). No hand-waving. | Metric is a vanity proxy (e.g., "Lines of code" for "Code quality"). **Reject outright.** | Yes – if the link feels weak but plausible, escalate to execs. | 10 min |  
  | **2. Gaming Scenarios** | "How could someone hack this metric *without* improving the goal? Name tactics." | Team lists 1–2 realistic hacks + safeguards (e.g., audits, counter-metrics). | No safeguards for obvious hacks (e.g., sales closing fake deals). **Reject or revise.** | No – if a hack is easy and likely, it fails. | 15 min |  
  | **3. Four Flavor Test**<br>(*Forces specificity*) | "Which of these 4 gaming risks applies? Explain."<br>a) **Distortion**: Gaming breaks the measurement (e.g., survey nagging).<br>b) **Extremes**: Metric works on average but fails at edges (e.g., punishing risky innovation).<br>c) **Causal Break**: Pushing the metric detaches it from the goal (e.g., cutting R&D to hit cost targets).<br>d) **Selection**: Optimizing the metric changes *what it means* (e.g., hiring easy customers). | Team names 1–2 flavors + how they’ll mitigate (e.g., "Risk: Distortion. Mitigation: Random audits"). | Team can’t name a flavor or says "none apply." **Revise metric.** | Yes – severity of risk is subjective. Flag for exec review. | 10 min |  
  | **4. Pressure Test** | "What happens if we set a *very ambitious target*? Does the metric still reflect the goal?" | Acknowledges risks (e.g., "At 95% target, teams might cut corners") and sets guardrails (e.g., safe thresholds). | Target invites destructive behavior (e.g., "Zero incidents" → no deployments). **Revise target/incentives.** | Yes – "too ambitious" is context-dependent. | 5 min |  
  | **5. Final Call** | "Is the metric + safeguards + incentives *safe enough* to trial for 1 quarter?" | Consensus on: Approve, Approve with Conditions (safeguards required), or Reject. | N/A | N/A | 5 min |  

  **Outputs:**  
  - **Approved**: Metric + safeguards documented.  
  - **Conditional**: Only goes live when safeguards are implemented.  
  - **Rejected**: Owner must resubmit with changes.  
  - **Paper Trail**: 1-perner + meeting notes (with flavor test answers) saved to shared drive.  

  ---

  #### 3. **Three reviews**  
  *(Example outputs using the procedure)*  

  **A. Per-Agent "Customer Happiness" Score**  
  - **Goal**: Improve support quality.  
  - **Metric**: Avg. post-call survey score (1–5) per agent.  
  - **Step 1 (Link)**: Pass. Direct signal of satisfaction.  
  - **Step 2 (Gaming)**: Fail. Easy hack: Agents pressure customers for high scores. No safeguards proposed.  
  - **Step 3 (Flavor Test)**: Risk: **Distortion** (begging for scores) + **Selection** (agents avoid complex calls).  
  - **Step 4 (Pressure)**: At 4.8+ target, agents game surveys.  
  - **Outcome**: **Reject**. Metric approved *only* if paired with:  
    - Safeguard 1: Random call audits.  
    - Safeguard 2: Counter-metric (e.g., % of calls escalated).  

  **B. "Code Quality" Score**  
  - **Goal**: Increase software reliability.  
  - **Metric**: Automated scan score (tests, complexity, tech debt).  
  - **Step 1 (Link)**: Weak. Metric tracks *symptoms* of quality (e.g., test coverage), not root causes (e.g., maintainability). **Misrepresentation risk.**  
  - **Step 2 (Gaming)**: Pass. Hacks: Engineers write trivial tests. Safeguard: Peer-review spot checks.  
  - **Step 3 (Flavor Test)**: Risk: **Causal Break** (high score ≠ reliable code) + **Extremes** (ignoring hard-to-test features).  
  - **Step 4 (Pressure)**: At 90+ target, engineers optimize for scans, not real quality.  
  - **Outcome**: **Conditional approval**. Must:  
    - Clarify goal (e.g., "Reduce bug rate").  
    - Pair with outcome metric (e.g., "Production bugs per release").  

  **C. "Incidents per Quarter" Safety Number**  
  - **Goal**: Reduce system downtime.  
  - **Metric**: Total SEV1/SEV2 incidents per quarter.  
  - **Step 1 (Link)**: Pass. Direct signal of stability.  
  - **Step 2 (Gaming)**: Fail. Hack: Teams downgrade incidents to SEV3 to avoid counting. No safeguards.  
  - **Step 3 (Flavor Test)**: Risk: **Distortion** (incident misclassification) + **Causal Break** (fewer incidents ≠ fewer risks if deployments halt).  
  - **Step 4 (Pressure)**: At "≤2 incidents" target, teams delay deployments.  
  - **Outcome**: **You won’t like this: APPROVED with conditions.** Why:  
    - Metric itself is sound, but incentives are broken.  
    - Safeguards required:  
      - Independent incident review panel.  
      - Counter-metric (e.g., "Deployment frequency").  
    - **You must tell execs**: "This metric is fine, but the target must be realistic (e.g., ≤5), and incentives must reward *outcomes*, not just this number."  

  ---

  #### 4. **Where I still have to guess**  
  - **How strict safeguards must be**. Audits sound great, but what if they’re costly? (Trade-off: Cost vs. risk.)  
  - **Whether a "weak" link is acceptable**. If the metric is 60% correlated with the goal, is that good enough? (Requires exec judgment.)  
  - **What "reasonable" pressure is**. A 10% stretch target? 50%? (Depends on team maturity.)  
  - **Which flavor of gaming is riskiest**. Sabotage vs. distortion might need different interventions.  
  - **How much to trust mitigations**. "We’ll add a counter-metric" is easy to say, hard to enforce.  
  - **When to kill a metric mid-quarter**. If gaming emerges, who pulls the plug?  
  - **Whether the metric distracts from the goal**. Even a good metric might make teams ignore intangibles (e.g., morale).  

  ---

  #### 5. **What this procedure can’t do**  
  - **Predict human creativity**. People will invent new hacks we didn’t brainstorm. This catches *obvious* flaws, not future ingenuity.  
  - **Fix cultural problems**. If leadership punishes misses brutally, no metric is safe. This tests the *measurement*, not the incentives.  
  - **Replace data validation**. A metric could pass this but still be buggy (e.g., data pipeline errors). That’s separate QA.  
  - **Handle complex interactions**. If 5 teams share one metric, gaming risks multiply. This focuses on single-metric sanity.  
  - **Prove causality**. We’re not running RCTs here. We’re making educated guesses.  
  - **Eliminate trade-offs**. Sometimes you need a flawed metric because it’s the only measurable signal. This flags the flaw, but you still own the risk.  
  - **Work without honesty**. If teams hide risks to get approved, we’re screwed. Psychological safety > procedure.  

  ---  
  **Final note:** This won’t stop all gaming, but it forces the conversation from "vibes" to "named risks with mitigations." Run it quarterly, revisit failed metrics, and track how many gaming fires you prevent. That’s your paper trail for execs.
