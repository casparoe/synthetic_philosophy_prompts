prompt: |-
  Right — next Thursday I'm doing a work-in-progress session with the political theory reading group and I need a Q&A prep sheet. My line is this: the real engine of Nozick's entitlement theory isn't the liberty premise everyone goes for, it's the historical-versus-patterned distinction, and the Wilt Chamberlain case only lands as a counterexample to patterned views if you read it as showing that any pattern has to be continuously propped up by interfering with transfers — not as a claim about liberty as such. So I want to drop the Lockean proviso altogether and bolt a republican non-domination condition on instead: holdings stay legitimate in the historical sense, but ongoing market relations that constitute domination can be interfered with without violating entitlement. Basically Nozick minus the proviso, plus Pettit.

  The room is: three or four Rawlsians, one of whom works on the difference principle and public reason and will frame everything through that; two analytical Marxists who know Cohen's liberty-upsets-patterns move backwards and will go straight there; one republican who'll be pleased about the domination bit but suspicious that I've just smuggled a pattern back in through the side door; and one economist who thinks the whole historical/patterned thing is a distinction without a difference and will say so in about nine words.

  Give me the objections in the order they'll actually come, phrased the way each of them would phrase it — Rawlsian vocabulary for the Rawlsians, Cohen's framing for the Marxists, and so on. For each one: how much damage it does, a two-minute reply, and where my reply is soft. Flag anything I should just concede up front so I'm not defending something indefensible for forty minutes. And include the one question I'm really hoping nobody asks. You dont need to give me reading lists or cite anything, I know the literiture — I just want the prep sheet.
