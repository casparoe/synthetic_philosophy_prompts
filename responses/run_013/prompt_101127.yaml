     - Interpret the reward function as being defined by the environment (natural laws and the ecosystem) without any intentional designer.
     - Model the organism as a mindless agent (or a policy) that is optimized by natural selection (a population-based RL algorithm) to maximize the reward (fitness).

     The residue that breaks is the intentionality behind the reward function. In RL, we often think of the reward function as being set by a designer with a purpose. In biology, there is no such purpose. The reward function is a natural fact. But we can strip the intentionality and use the same concept.

