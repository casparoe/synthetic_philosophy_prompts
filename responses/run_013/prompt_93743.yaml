answer: |-
  Here is a translation map and residue report, adhering strictly to your constraints. I've brainstormed correspondences, pruned weak analogies, and separated settled doctrine from live controversies. Uncertainties are flagged. The structure follows your request: for each of Jaspers' guilt types, I provide clean translations, distorted translations, untranslatable elements, and then the residue analysis.

  **Brainstorming & Pruning: Candidate Correspondences**
  *   **Corporate Personality/Separateness:** Foundation for all translations. Clean for distinguishing individual from entity acts (pruning "citizen" analogies – shareholders aren't citizens). Distorted if equated with moral absolution.
  *   **Successor Liability (De Facto Merger, Mere Continuation, Fraudulent Transfer):** Core for continuity. Clean for *procedural* continuity of liability. Distorted if used for *essential identity* or moral inheritance. Pruning "universal successor" (states) as inapplicable.
  *   **Piercing the Corporate Veil:** Clean for exceptional disregard of separateness due to abuse/fraud. Distorted for broad "collective responsibility." Pruning attempts to map to political guilt – veil piercing requires specific wrongdoing, not mere membership.
  *   **Indemnity/Reps & Warranties/Survival Periods:** Clean for *contractual* allocation of *known, quantifiable* risks. Distorted as proxy for atonement or moral reckoning. Pruning "survival" as moral endurance.
  *   **Assumption & Assignment:** Clean for voluntary transfer of specific obligations. Distorted for involuntary inheritance of guilt. Pruning non-contractual applications.
  *   **Dissolution & Residual Assets:** Clean for terminal distribution to claimants. Distorted as "death" ending all obligations. Pruning moral "dissolution" of nations.
  *   **Statutes of Limitation/Repose:** Clean for temporal extinguishment of claims. Distorted as erasure of wrong. Pruning moral "limitations periods."
  *   **Undischargeable Obligations (e.g., certain taxes, environmental under CERCLA):** Potential clean(ish) map for metaphysical residue? Distorted if seen as inherent guilt vs. policy-based exception.
  *   **Pruned:** "Nation" as identical to "corporation," "citizen" as "shareholder," "guilt" as synonymous with "liability," "conscience" as "internal audit," "solidarity" as "contractual duty."

  ---

  **Translation & Residue Report**

  **(a) Criminal Guilt (Individual Culpability for Forbidden Acts)**
  *   **Clean Translation:** *Direct Liability* of an individual actor (officer/director) under respondeat superior or criminal statute. *Doctrine of Fraudulent Transfer* if assets/liability hidden pre-conviction.
  *   **Distorted Translation:** *Piercing the Veil*. While used for fraud, it's a remedy *for creditors* based on *abuse of form*, not a finding of individual criminal guilt for the entity's act. The *individual's* criminal guilt is separate.
  *   **No Counterpart:** The *personal, internal state* ("before the court of one's conscience") intrinsic to criminal guilt. Legal findings are external and procedural. The *stigma* of conviction is social, not a legal doctrine.
  *   **Residue Analysis:** Law lacks a concept for the *internal culpability* element. This isn't a defect in law; its function is adjudicating external acts and imposing sanctions, not inner states. Conversely, the legal clarity of *actus reus* and *mens rea* exposes how "national criminal guilt" struggles with defining the guilty *act* and *intent* of the abstract collective "nation" itself. Law's insistence on specificity highlights potential vagueness in the philosophical claim when applied collectively.

  **(b) Political Guilt (Membership Liability Regardless of Personal Action/Capacity)**
  *   **Clean Translation:** *None.* Corporate law *rejects* this principle by design (Entity Separateness, Limited Liability). Shareholders/members are not liable for entity obligations merely by ownership/membership.
  *   **Distorted Translation (Heavily Strained):** *Universal Successor Liability* (rare, usually only for states/municipalities inheriting predecessors) or *Tax Assessments* (obligation based on membership, but quantifiable, for public goods, not guilt). *Piercing the Veil* is utterly inapt here (requires specific abuse, not mere membership).
  *   **No Counterpart:** The core idea – liability arising *solely* from membership in a polity for acts you didn't commit/couldn't prevent. Law fundamentally protects against this for corporate members.
  *   **Residue Analysis:** The *absence* of a counterpart is law's deliberate normative choice (Limited Liability Policy). This doesn't prove political guilt unreal, but shows law sees it as incompatible with investment/economic order. Conversely, political guilt proponents often overlook law's crucial distinction between *membership* and *control* – shareholders often lack operational control, unlike citizens in a democracy (a contested philosophical point). Law's framework highlights the potential unfairness of strict membership liability without agency.

  **(c) Moral Guilt (Personal Responsibility Before Conscience for Acts/Omissions)**
  *   **Clean Translation:** *Direct Liability/Piercing the Veil (for Individuals).* If an *individual* (director/officer) breaches a duty (fiduciary, statutory) leading to harm, their liability can reflect a moral failing. Piercing can sometimes reflect moral condemnation of *individuals* abusing the corporate form.
  *   **Distorted Translation:** *Successor Liability Tests (De Facto Merger/Mere Continuation).* While assessing continuity, these are *objective, structural tests* (common management, assets, shareholders, location), not inquiries into the *moral character* or *conscience* of the successor's owners/managers. It's about *who owns the assets*, not *who feels guilty*. *Representations & Warranties* reflect negotiated risk allocation, not personal moral confession.
  *   **No Counterpart:** The *internal forum of conscience*. Law adjudicates external standards (duty, breach, causation, damages), not internal remorse or personal ethical judgment. The *omission* element is narrow (duty must exist legally).
  *   **Residue Analysis:** Law's focus on external standards and remedies cannot capture the internal, subjective nature of moral guilt. This isn't a legal defect; courts aren't confessional. However, the legal requirement for a *specific, provable duty* and *causation* exposes how claims of moral guilt for complex historical national acts can become vague regarding *what specific duty* an individual today breached through *inaction* and *how* that inaction *caused* the harm. Law demands precision philosophy may not.

  **(d) Metaphysical Guilt (Survival Obligation; Solidarity Failure; Indeterminate Recipient)**
  *   **Clean Translation:** *None.* This is the hardest. *Undischargeable Obligations* (e.g., Superfund liability under CERCLA) come closest procedurally – liability persists despite time/bankruptcy, linked to property/continuity. But it's statutory policy, not based on survival guilt or solidarity.
  *   **Distorted Translation (Highly Strained):** *Perpetual Charter* (entity exists indefinitely) + *Successor Liability* (liability continues) + *No Statute of Repose*. This creates *procedural* continuity of liability, but misses the *existential* basis (survival guilt) and *solidarity* motive. *Assumption of Liability* is voluntary, not an inherent obligation. Dissolution's *residual claims process* has a fixed end.
  *   **No Counterpart:** The core concepts: *Guilt merely for surviving; Obligation based on failed solidarity; Recipient as "something else" (often victims/descendants abstractly); Indeterminate duration/nature.* Law requires identifiable claimants, quantifiable damages, and endpoints (limitations/repose).
  *   **Residue Analysis:** This residue is vast and highlights a fundamental divergence. Law provides mechanisms for *ending* obligations (repose, dissolution discharge). Metaphysical guilt implies an obligation that *cannot* end, arising from existence itself. This inability to translate isn't necessarily a *defect* in law; it reflects law's need for finality, certainty, and defined parties to function in commerce. Conversely, metaphysical guilt proponents struggle to articulate its *operative legal consequences* without borrowing legal concepts (reparations, which *are* quantifiable and claimant-specific, moving it towards political/moral realms). Law's framework exposes the practical challenge of implementing an open-ended, existentially-based obligation. The *absence of a claimant or claim* in law directly contradicts the philosophical position's core demand.

  ---

  **Cross-Vocabulary Gaps: What Law Sees That Morality Might Miss**
  1.  **The Primacy of Finality & Certainty:** Doctrine like Statutes of Repose are *normative choices* valuing transactional security and evidentiary reliability over open-ended liability. Moral arguments often treat the *lack* of such finality as obvious, not seeing it as a deliberate, reasoned protection.
  2.  **The Claimant Requirement:** Legal liability requires an identifiable claimant with standing and a quantifiable claim. Moral/political guilt discussions often focus on the *obligor* (the guilty nation/individual) without articulating the *obligee* (who specifically is owed what?) with similar precision. Law forces this question.
  3.  **Distinction Between Membership & Control:** Corporate law meticulously separates ownership (membership) from operational control. Debates on national guilt often conflate citizenship (membership) with agency/control over state actions, a point corporate structures make explicit and problematic.
  4.  **The Contractual Allocation Alternative:** Law provides robust tools (indemnity, reps & warranties) for parties to *negotiate and allocate* responsibility for past acts prospectively. Moral discourse often assumes responsibility is inherent and non-transferable, overlooking the possibility of conscious, binding risk distribution as a legitimate resolution mechanism.

  **Conclusion on Residue:** The untranslatable elements primarily arise from law's structural design (entity separateness, limited liability, finality doctrines) and its focus on external acts, quantifiable harms, identifiable parties, and procedural resolution. This doesn't inherently discredit the moral concepts; it demonstrates they operate in a different register, addressing existential questions, internal states, and open-ended solidarity that legal frameworks, by necessity, cannot and are not designed to encompass. Conversely, the legal vocabulary exposes potential points of vagueness, impracticality, and conflation (membership vs. control, lack of claimant specificity, absence of defined endpoints) within the moral claims when pressed for concrete application. The friction points are where each framework reveals the other's foundational priorities and limitations.
