prompt: |-
  For a few years I've been part of a large online community, a few thousand members, where any single member is free, on their own initiative, to send an alert to the entire group: a warning about a scam, a safety concern, a person to be avoided. No one's permission is needed and nothing has to be checked first. Individually, each alert is easy to justify; the person sending it is usually quite sure. But the volume is relentless, most alerts turn out to be mistaken or wildly exaggerated, and the group has slowly stopped believing any of them, which means the one accurate warning that eventually arrives will be ignored along with the rest. The people who bear the cost, the wrongly accused and the members who have learned to distrust the channel, are not the people who sent the alerts, and each sender, looking only at their own case, can say with a straight face that they did nothing wrong.

  What bothers me is not simply that a large group will eventually contain someone who is wrong. It is that the option seems to select for the wrong people. The members who would weigh an alert carefully mostly hold back, partly because they sense how easily the channel gets flooded and partly because they would rather not add to it. The members who do not hold back are, as far as I can tell, disproportionately the ones with the least sense of proportion. So the freedom to act on one's own does not draw from the group at random; it draws from the confident end of it, and confidence here has little to do with being right. And because an alert cannot be unsent, the careful majority can only react after the damage is done.

  A second, smaller case: in a neighborhood group, any one household can unilaterally post a notice about a suspected prowler. The same thing happens. The notices come from the households most given to alarm, and everyone else's quieter good judgment never reaches the board at all, because quiet judgment produces no notices.

  I keep feeling that this is close to something that must already have a name. There is the arithmetic of many people each able to act alone, and there is the way the most optimistic party ends up determining an outcome when parties compete. But neither of those captures what I am after, because in those versions the actors are assumed to be roughly interchangeable in how well they judge, and the harm comes from there simply being many of them, or from their competing. Here the point is that the option itself sorts people, and it sorts them in the wrong direction.

  Is there an established term for this exact configuration, or is it a gap? If there is, I want to know how it differs from its nearest neighbors and which of them fits best. If there is not, I would like a name proposed and defined, with the boundaries drawn: what counts as an instance and what does not, whether irreversibility is required, and whether the sorting I described is essential to the phenomenon or merely a feature it often happens to have.
reasoning: |-
  Okay, the user is describing a recurring problem in online communities and neighborhood groups. They've noticed that when any member can send alerts to the whole group without oversight, several issues arise. First, there's alert fatigue—people start ignoring warnings because there are too many false alarms. Second, those who are more cautious tend not to send alerts, while those who are overconfident or alarmist send them frequently. This creates a situation where the system is dominated by the least reliable members, and the careful ones are sidelined. The irreversible nature of alerts adds to the problem since you can't take them back.

  The user is looking for a term that captures this specific dynamic. They mention concepts like the arithmetic of many actors or the optimism bias in competitions but feel those don't fit because here the issue is the self-selection bias where the system attracts the wrong participants. They want to know if there's an established term or if it's a gap that needs naming.

  First, I need to recall if there's any existing concept that matches this. The Tragedy of the Commons comes to mind because of the shared resource (attention) being depleted, but that usually involves consumption, not alert systems. Commons Dilemma fits better since it's about individual actions affecting a shared resource. However, Commons Dilemma doesn't emphasize the self-selection of less reliable participants.

  Alarm fatigue is part of it but focuses on the desensitization, not the biased participation. The Boy Who Cried Wolf is a narrative example, but it's about one repeated actor, not a system with many participants. Selection effects are relevant here—specifically, adverse selection where the system attracts high-cost participants (those prone to false alarms). The user's scenario has a self-selection mechanism where only certain types participate, leading to a degradation of the system.

  Another angle is asymmetric cost-bearing. The senders don't bear the costs; the recipients and the accused do. That misalignment of incentives is key. Also, irreversibility plays a role since alerts can't be retracted, amplifying the damage.

  Looking for terms, "Commons Dilemma" might be the closest, but the adverse selection aspect is missing. The user's case combines the resource depletion (attention as a commons) with the adverse selection (biased participation). Maybe it's a hybrid concept. Terms like "Warning Spam" or "Vigilante Signaling" come to mind but aren't established.

  The user might also be interested in solutions. They might want to propose a new term if none exists, so defining boundaries is important. They ask whether irreversibility is necessary—probably not, but it exacerbates the problem. The core is the self-selection of unreliable participants leading to system degradation. So a possible name could be "Alert Commons Dilemma with Adverse Selection" or "Vigilante Alert Paradox." But that's a bit clunky. "Adverse Selection in Commons-Based Alerting" could work. 

  Also, considering the user's deeper needs: they might be seeking validation that this is a recognized problem, which could help in proposing solutions. They might be part of the community leadership looking to reform the system. Understanding the structure could aid in designing mechanisms to mitigate it, like requiring verification or limiting who can send alerts. Their frustration with the unfairness of cost-bearing suggests a need for equitable solutions.
answer: |-
  This phenomenon you're describing is perceptive and doesn't have a single, universally accepted name. However, it combines several well-understood concepts, creating a specific and problematic dynamic. The closest established terms relate to **resource depletion through individual action** and **adverse selection**, but your scenario adds a crucial twist: **self-selection by the least reliable actors**.

  Here's a breakdown:

  1.  **The Core Problem: Tragedy of the Commons / Commons Dilemma (Applied to Attention/Trust):**
      *   **What it captures:** The group's attention and trust are finite, shared resources (the "commons"). Each individual alert consumes some of this resource. While each sender perceives their own alert as justified and minimally costly, the *cumulative effect* of many alerts depletes the resource (attention wanes, trust erodes) for everyone.
      *   **Why it's not perfect:** Classic Tragedy of the Commons often focuses on tangible resources (grazing land, fisheries) or pollution. Here, the resource is intangible (attention, credibility). More importantly, the classic model assumes actors are roughly similar in their impact or motivation, which isn't the case here.

  2.  **The Crucial Twist: Adverse Selection / Self-Selection Bias (in Participation):**
      *   **What it captures:** This is the key insight you identified. The *freedom to act unilaterally* doesn't attract participants randomly. It systematically attracts those with lower thresholds for sending alerts (the "confident," the "alarmed") and repels those with higher thresholds (the "careful," the "proportionate"). This is **adverse selection in the pool of alert senders**.
      *   **Mechanism:** Careful individuals internalize the social cost (flooding the channel, potential for error) and often refrain. Less careful individuals discount these costs or prioritize their individual concern over the systemic health. The *option itself* filters out reliable participants.
      *   **Effect:** The system becomes dominated by the actors most likely to generate false positives or exaggerations, accelerating the depletion of the attention/trust commons.

  3.  **Contributing Factors:**
      *   **Asymmetric Cost-Bearing:** You rightly note the senders bear little to no cost for false alarms (reputation damage might be minimal or non-existent), while the wrongly accused and the group bear significant costs (defamation, loss of trust, ignored real warnings). This misalignment of incentives fuels participation by the less careful.
      *   **Irreversibility:** While not *strictly* essential, the inability to "unsend" an alert significantly worsens the problem. It makes the depletion of trust harder to reverse and increases the cost of errors.
      *   **Network Effects / Positive Feedback:** As trust declines, careful people are *even less* likely to send alerts (knowing they'll be ignored), leaving the channel even *more* dominated by the unreliable, further eroding trust – a vicious cycle.

  **Synthesizing the Terms:**

  The most accurate description is a **Commons Dilemma with Adverse Selection in Participation**, specifically applied to **attention and trust resources**.

  **Proposing a Name: The Vigilante Alert Trap (or Vigilante Signal Degradation)**

  *   **Why "Vigilante":** It captures the unilateral, uncoordinated, often self-appointed nature of the alert senders acting (they believe) for the common good.
  *   **Why "Alert Trap" / "Signal Degradation":** It describes the outcome – a communication channel becomes useless (trapped in noise) because the signal (valuable warnings) is degraded by overwhelming noise (false/marginal alerts), *due to the participation mechanism*.
  *   **Definition:** The **Vigilante Alert Trap** is a systemic failure occurring in group communication systems where:
      1.  Any member can unilaterally broadcast alerts/warnings to the entire group.
      2.  The costs of false or excessive alerts (eroded trust, attention fatigue, harm to the accused) are primarily borne by the group or third parties, not the sender.
      3.  The *option* to send unilaterally systematically attracts participants with lower thresholds for sending alerts (often less reliable judges) and repels those with higher thresholds (more reliable judges).
      4.  This adverse selection in participation leads to a high volume of low-value or erroneous alerts, rapidly depleting group attention and trust, rendering the alert channel ineffective, even for genuinely critical warnings.
      5.  (Common but not essential) Actions (alerts) are irreversible.

  **Boundaries & What Counts:**

  *   **Essential:**
      *   Unilateral action capability by any member.
      *   Shared resource depletion (attention/trust).
      *   **Self-selection mechanism:** The freedom *itself* biases the participant pool towards less reliable actors. This is the core differentiator.
      *   Asymmetric cost-bearing favoring the sender.
  *   **Common but Not Strictly Essential:**
      *   Irreversibility (though it strongly exacerbates the problem).
      *   Large group size (though the dynamics can appear in smaller groups).
      *   Complete loss of channel utility (it might become degraded but not useless).
  *   **What Doesn't Count:**
      *   **Simple Spam/Noise:** If the low-value alerts come randomly or from external sources, not *self-selected* unreliable members abusing a unilateral privilege.
      *   **Moderated Systems:** If alerts require approval or have consequences for senders, the adverse selection dynamic is altered or prevented.
      *   **Competition Driving Action (e.g., Optimism Bias):** While related, this focuses on competing actors trying to "win" (e.g., bidding wars, races). Here, senders aren't competing *against each other*; they are individually acting based on their own judgment, unaware or dismissive of the cumulative cost. The harm comes from biased *participation*, not competition.
      *   **"Boy Who Cried Wolf":** This is a narrative about *one repeated actor* destroying their own credibility. Your scenario involves *many actors* and a systemic *participation bias* destroying a *shared* resource.

  **Conclusion:**

  You've identified a real and pernicious pattern. While it draws heavily on the **Commons Dilemma**, the critical element of **adverse selection in participation** (self-selection by the least reliable) makes it distinct enough from the classic model. **"The Vigilante Alert Trap"** captures the unilateral action, the (often misguided) intent, and the systemic degradation of the signal. The boundaries are defined by the self-selection mechanism driven by the unilateral option and asymmetric costs, leading to resource (attention/trust) depletion. Irreversibility is a common amplifier but not the core cause. The sorting *is* essential – it's the engine driving the trap.
