  Every node should be anchored in a case, and I want the following to appear somewhere in the tree: the standard case, in which the child's condition was a precondition of the child's existing at all, so that no one is worse off than they would have been; an identity-neutral case, in which the very same child would have existed anyway but with a better childhood, so that the ordinary comparison is available; a case in which the parents could have waited and had a different, unaffected child, while the affected child's life is nevertheless well worth living; a case in which a policy creates an additional person whose life is barely worth living; and a case in which the "better" alternative would have produced a different person of a different temperament, so that the two outcomes cannot be compared person by person. Invent at least one further case of your own that separates two positions that those five leave tangled. The tree should terminate in no fewer than seven leaves and no more than twelve nodes in total, and among the leaves these must appear, described rather than named if you prefer: the view that denies any wrong in the standard case; the view that locates the wrong in a non-comparative harm to the child; the view that permits wrongness without a victim; the straightforward impersonal-aggregative view; an impersonal view with a threshold below which lives count differently; a rights- or dignity-based view that treats the child's claim as non-comparative; and a view on which the objection to the parents concerns their dispositions rather than the outcome. Where two of these prove indistinguishable by any question you can pose, flag the pair and name the further case that would separate them; likewise flag any leaf reachable only by a route that would strike most readers as a trick. Each leaf should carry one sentence naming its most awkward commitment, and I would like the whole thing written in spare prose suitable for a diagram a student fills in, not a