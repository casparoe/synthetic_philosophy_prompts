  First, I need to unpack why these two theories seem to agree on the surface but clash underneath. Both reject the sorites premise that leads to contradiction, but for different reasons. Epistemicism says there's a sharp cutoff we can't know, while supervaluationism says there's no single cutoff because truth depends on precisifications. 

  The user mentioned higher-order vagueness as a pain point. That's key—epistemicists treat "borderline" as sharp too (just unknown), while supervaluationists see it as inherently fuzzy. This might be where the shouting starts. Also, the "no sharp boundaries" intuition: why do cutoffs feel wrong? Is that evidence against epistemicism or just human limitation? 

  The user wants no fluff—concrete agreements that aren't obvious. So I'll list things like "both reject universal tolerance but accept near-indiscernibility" and "both deny truth-value gluts." Also, forced concessions: epistemicists must accept unknowable cutoffs; supervaluationists must accept truth-value gaps. 

  For disagreements, I'll phrase each side's view in their own terms. Epistemicists will say "there is a fact about where baldness begins"; supervaluationists will say "no fact, just admissible ways to sharpen." The cruxes should test these differences—e.g., can we have a case that's borderline at all orders? Epistemicists say yes but we can't identify it; supervaluationists say it undermines their framework. 

  The verbal dispute angle is tricky. Maybe "true" is used differently: epistemicists mean mind-independent truth, supervaluationists mean supertruth. But it's not just verbal—they disagree on whether vague predicates have extensions in reality. 

  Finally, the user wants embarrassment. Epistemicists must admit linguistic competence doesn't fix cutoffs; supervaluationists must admit their "no fact" claim isn't itself vague. I'll make sure neither gets off easy. 

  This should give the user ammunition to reframe the debate. Time to draft it tightly.
answer: |-
  Here’s a joint statement crafted for your epistemicist (E) and supervaluationist (S), designed to isolate genuine disagreements while clarifying common ground. It confronts the "no sharp boundaries" intuition, higher-order vagueness, and the verbal/non-verbal divide head-on.

  ---

  ### **Joint Statement: Epistemicism vs. Supervaluationism on Vagueness**

  #### **(a) Agreed Claims**  
  *(Non-vacuous commitments both endorse)*  
  1. **The Sorites Paradox**:  
     - The sorites argument (e.g., from 10,000 grains to 1 grain) is *valid* but unsound.  
     - Both reject the conclusion that "one grain is a heap" and affirm that *some premise must be false*.  
  2. **Tolerance Constrained**:  
     - For any vague predicate (e.g., "bald"), indiscriminable adjacent cases (e.g., *n* vs. *n+1* grains) cannot differ in *determinate* truth-value (e.g., neither can be determinately bald while the other is determinately non-bald).  
     - However, *universal tolerance* ("if *n* is bald, then *n+1* is bald") is false.  
  3. **Borderline Cases Exist**:  
     - There are clear cases (e.g., 10,000 grains: heap; 1 grain: non-heap) and borderline cases (e.g., 200 grains) for vague predicates.  
     - Competent speakers *correctly withhold judgment* in borderline cases.  
  4. **Classical Logic Preserved (with caveats)**:  
     - Both accept classical logic *except* where S invokes truth-value gaps for borderline cases. E accepts bivalence universally.  
  5. **No Semantic Ignorance**:  
     - Speakers are *not ignorant of the meaning* of vague terms. Competence is not undermined by vagueness.  

  #### **(b) Residual Disagreements**  
  *(Stated in each side’s preferred terms)*  
  - **Epistemicist**:  
    > "There is a precise cutoff for 'bald' (e.g., a specific *n* where *n* is bald and *n+1* is not), but it is *metaphysically necessary* that we cannot know where it is. Borderline cases reflect ignorance, not semantic indeterminacy."  
  - **Supervaluationist**:  
    > "There is *no fact of the matter* about where 'bald' cuts off; borderline cases lack a truth-value. Vague predicates admit multiple admissible precisifications, and truth is supertruth (truth on all precisifications)."  

  #### **(c) Cruxes & Test Cases**  
  *(Sub-questions where settling one would force a concession, with predictions)*  

  **Crux 1: Is 'borderline' itself sharp?**  
  - **Test Case**: Consider a series of statements:  
    - *P₀*: "200 grains is bald"  
    - *P₁*: "It is borderline whether 200 grains is bald"  
    - *P₂*: "It is borderline whether it is borderline whether 200 grains is bald"  
    - ... (up to *Pₙ* for high *n*)  
    - *Q*: "There exists a case where *all higher-order borderline claims hold* (i.e., no *k* where *Pₖ* is determinate)."  
  - **E's Prediction**: *Q is false*. There is a sharp cutoff for "borderline," though we cannot locate it. Higher-order vagueness is an illusion of ignorance.  
  - **S's Prediction**: *Q is true*. Genuine vagueness requires no sharp meta-boundaries; "borderline" is itself vague.  
  - **Why it matters**: If *Q* is true, E must explain irreducible higher-order ignorance. If false, S must explain how "borderline" escapes vagueness.  

  **Crux 2: Is the 'no sharp boundaries' intuition evidence or illusion?**  
  - **Test Case**: Suppose we discover a precise cutoff for "bald" via divine revelation (e.g., "Exactly 287 grains is the last heap"). Would competent speakers be *rationally compelled* to accept this?  
  - **E's Prediction**: *Yes*. The cutoff was always there; revelation corrects ignorance. The intuition that cutoffs are "unacceptable" is psychological, not semantic.  
  - **S's Prediction**: *No*. A precise cutoff violates the *meaning* of "heap," which requires tolerance. Revelation would change the concept, not reveal it.  
  - **Why it matters**: If E is right, the intuition is misleading. If S is right, it tracks semantic constraints.  

  **Crux 3: Is 'indeterminacy' reducible to ignorance?**  
  - **Test Case**: Can two speakers *agree on all facts* about a borderline case (e.g., hair distribution on a scalp) yet *rationally disagree* on whether "bald" applies?  
  - **E's Prediction**: *No*. All facts determine a truth-value; disagreement reflects incomplete knowledge.  
  - **S's Prediction**: *Yes*. The facts underdetermine truth; competent speakers may permissibly differ without cognitive defect.  
  - **Why it matters**: If yes, S captures normative features of vagueness; if no, E’s ignorance thesis holds.  

  #### **(d) Verbal vs. Non-Verbal Disagreement**  
  - **Where it’s verbal**:  
    Both use "true" differently:  
    - E: "true" = correspondence to a mind-independent fact.  
    - S: "true" = supertruth (true on all precisifications).  
    Thus, "There is no truth about borderline cases" (S) vs. "There is a truth we cannot know" (E) partly reflects this terminological split.  
  - **Where it’s substantive**:  
    The core disagreement is *metaphysical*: **Do vague predicates have precise extensions in reality?**  
    - E: Yes, but our epistemic access is blocked.  
    - S: No; extensions are intrinsically partial.  
    This is not verbal—it’s about whether reality is sharp or vague *independently of us*.  

  #### **(e) Embarrassing Concessions**  
  *(What each must swallow)*  
  - **Epistemicist**:  
    - *Linguistic Competence*: Competent speakers *cannot, even in principle*, know the meaning of "bald" fully (since meaning fixes the unknowable cutoff).  
    - *Why Unknowable?* Ignorance is due to *metaphysical necessity* (e.g., meaning + margins for error block knowledge), not practicality.  
  - **Supervaluationist**:  
    - *Third Status?* "Neither true nor false" *is* a truth-value gap (not epistemic "don’t know"). This requires revising classical logic for borderline claims.  
    - *No Higher-Level Facts*: Claims like "There is no fact about the cutoff" are *themselves* not vague—they are determinately true.  

  ---

  ### **Why This Works**  
  - **Confronts "No Sharp Boundaries"**: E explains it as psychological bias; S as semantic constraint. Test Case 2 forces this into the open.  
  - **Higher-Order Vagueness**: Crux 1 prevents both sides from dodging—it directly tests whether "borderline" is sharp.  
  - **Non-Vacuous Agreement**: Both concede classical logic isn’t sacrosanct (S gaps it; E accepts unknowability) and that tolerance is limited.  
  - **Moves the Debate**: Settling any crux (e.g., via thought experiments) forces one side to explain counterintuitive results.  

  Present this, and the shouting *should* turn into focused debate on the cruxes. If not, threaten to make them write apologies to Williamson and Fine. Good luck!
