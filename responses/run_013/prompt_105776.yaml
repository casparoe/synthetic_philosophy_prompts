answer: |-
  ## Proposal: Interpersonal Comparability Beyond Invariance – Disentangling Fact from Norm in Social Choice

  **Project Title:** Interpersonal Utility Comparisons: Fact, Convention, and the Limits of Invariance Conditions  
  **Duration:** 6 Months  
  **Fellow:** [Your Name]  
  **Host Institution:** [Institution Name, if applicable]  
  **Supervisor:** [Supervisor Name, if applicable]

  **1. The Core Research Question:**  
  *Can interpersonal comparisons of utility *differences* (i.e., the relative magnitudes of gains and losses in well-being) be objectively grounded in facts about individual well-being states, independent of the normative choice of invariance conditions imposed on social welfare functionals?*

  This question demands a determinate "yes" or "no" answer, contingent on a coherent analysis of the nature of well-being and the information potentially contained within individual utility representations. Crucially, it isolates the *factual* question of whether the *size* of one person's gain can meaningfully offset the *size* of another's loss in principle, from the *normative* question of whether a social choice rule *should* be sensitive to such differences.

  **2. The Problem: Conflation in the Standard Framing**  
  The dominant approach to interpersonal comparability in social choice theory (following Sen, d'Aspremont-Gevers, Bossert-Weymark, etc.) proceeds axiomatically:

  1.  **Define Information Set:** Specify what type of interpersonal information is assumed available (e.g., Ordinal Non-Comparable, Cardinal Non-Comparable, Level Comparable, Unit Comparable, Ratio Comparable, Full Comparability).
  2.  **Impose Invariance:** Require the social welfare functional (SWFL) or social ordering to be invariant under transformations preserving the specified information (e.g., invariant under individual affine transformations for Unit Comparability).
  3.  **Derive Consequences:** Identify the permissible SWFLs or aggregation rules (e.g., utilitarianism requires Unit Comparability; leximin requires Level Comparability).

  **My Suspicion & The Gap:** This framework runs together two distinct conceptual layers:
  *   **(A) The Factual/Metaphysical Layer:** Does individual well-being possess properties that, in principle, ground objective comparisons of *differences* across persons? (e.g., is there a "common scale" inherent in well-being facts?).
  *   **(B) The Representational/Normative Layer:** What invariance conditions should we impose on the *representation* of utility (via the SWFL) to reflect our normative commitments about interpersonal sensitivity and the permissible *use* of information?

  Standard discussions focus almost exclusively on (B). Arguments *for* comparability typically argue that certain invariance conditions (e.g., requiring invariance under *different* affine transformations for each individual) are *too restrictive* normatively. Arguments *against* comparability often assert that the *only* meaningful information is ordinal and non-comparable, implying invariance under all monotonic transformations is the only normatively acceptable baseline. **Both sides primarily debate the *appropriate level of normative invariance*, leaving the core *factual* question about the inherent comparability of differences largely untouched and underexplored.**

  The existing positions leave the specific question of *factual difference comparability* open because:
  1.  **Methodological Focus:** The axiomatic approach starts from assumptions about available information (often treated as given) and derives normative implications. It doesn't inherently investigate the *source* or *nature* of that information.
  2.  **Conflation with Sensitivity:** The conditions (like Unit Comparability) simultaneously encode an assumption about available information *and* dictate the SWFL's sensitivity to interpersonal differences. The factual possibility (A) is entangled with the normative permission for sensitivity (B).
  3.  **The "Manufacturing" Problem:** Instruments like money (as a common currency) or standardized health metrics (QALYs/DALYs) appear to *create* comparability where none existed. The standard framework can model their *use* (e.g., assuming Full Comparability via the metric) but struggles to answer *whether these metrics track pre-existing comparable differences or merely impose a conventional scale*. Are they discovery tools or creation tools?

  **3. Research Plan: Disentanglement and Investigation**

  *   **Month 1: Foundational Analysis & Literature Synthesis:**
      *   Deep dive into key texts defining comparability types (Sen, d'Aspremont-Gevers, Bossert-Weymark, Blackorby-Donaldson) and influential critiques (Robbins, Binmore, Plott, Mongin).
      *   Formalize the distinction between (A) *Intrinsic Difference Comparability* (IDC - a factual property of well-being states) and (B) *Normative Difference Sensitivity* (NDS - an invariance condition on SWFLs).
      *   Map how standard arguments for/against comparability primarily target NDS, not IDC.
      *   *Output:* Detailed literature review and conceptual framework memo.

  *   **Month 2: Philosophical Groundwork for IDC:**
      *   Engage with meta-ethical and philosophical literature on well-being (hedonism, desire fulfillment, objective list theories) and the possibility of cardinality and interpersonal comparison (Harsanyi, Griffin, Broome, Hausman).
      *   Analyze arguments for and against the existence of facts that could ground IDC (e.g., intensity of experience, commensurability of fundamental goods).
      *   Explore the "measurement without theory" critique in relation to IDC.
      *   *Output:* Position paper outlining the metaphysical possibilities and challenges for IDC.

  *   **Month 3: Deconstructing "Manufactured" Comparability:**
      *   Case Study 1: Money as a Common Currency. Analyze the conditions under which willingness-to-pay reveals comparable *utility differences* vs. merely reflecting budget constraints and ordinal preferences. Examine the role of diminishing marginal utility and its interpersonal validity.
      *   Case Study 2: Health Metrics (QALYs/DALYs). Critically assess the claim that these metrics create comparability. Investigate: Do standardized health state valuations purport to *discover* interpersonally comparable disutility, or are they inherently conventional? What underlying well-being facts (if any) could they plausibly track across diverse lives/conditions?
      *   *Output:* Draft analysis of key cases, identifying necessary conditions for instruments to be more than conventional.

  *   **Month 4: Formal Modeling & Implications:**
      *   Develop simple formal models exploring the logical independence of IDC and NDS.
      *   Investigate: Can a representation satisfying a given invariance condition (NDS) be consistent with both the existence *and* non-existence of IDC? What additional constraints would link the representation to underlying IDC facts?
      *   Explore implications for specific aggregation rules (e.g., utilitarianism requires NDS compatible with Unit Comparability; does it *also* require IDC to be meaningful?).
      *   Examine the role of "extended sympathy" and whether it genuinely accesses IDC or merely expands the domain for applying invariance conditions.
      *   *Output:* Technical notes and draft model sections.

  *   **Month 5: Synthesis and Argument Development:**
      *   Integrate findings from Months 1-4.
      *   Formulate a precise argument regarding the conditions under which IDC is plausible/implausible.
      *   Articulate the significance of distinguishing IDC from NDS: How does it reframe classic debates? What new light does it shed on the status of instruments like health metrics?
      *   Develop the critique that excessive focus on NDS has obscured the fundamental question of IDC.
      *   *Output:* Complete draft of core paper chapters.

  *   **Month 6: Refinement, Dissemination & Future Work:**
      *   Revise and polish the manuscript for target journals (e.g., *Economics and Philosophy*, *Journal of Political Philosophy*, *Social Choice and Welfare*).
      *   Present key findings in an internal seminar.
      *   Outline plans for future research (e.g., empirical implications, application to specific policy domains, alternative conceptions of well-being facts).
      *   Finalize fellowship report.
      *   *Output:* Submission-ready manuscript; Fellowship report; Presentation slides.

  **4. Defining Success and Failure:**

  *   **Successful Result:** The project succeeds if it achieves:
      1.  **Clear Distinction:** A rigorous and widely defensible demonstration that questions of *intrinsic difference comparability* (IDC) are conceptually distinct from, and prior to, questions about *normative difference sensitivity* (NDS) imposed via invariance conditions.
      2.  **Progress on IDC:** A coherent account (even if skeptical) of what it would *mean* for IDC to hold and the challenges/possibilities involved, moving beyond simply stating it's "impossible" or "assumed."
      3.  **Insight on Instruments:** A compelling analysis showing why instruments like health metrics face a specific challenge in *tracking* IDC, not just in being normatively acceptable (NDS). Clarifying what "more than convention" would entail for them.
      4.  **Reframed Debate:** A convincing argument that significant portions of the historical and contemporary debate have focused on NDS while neglecting or conflating the core issue of IDC.
      *   *Manifestation:* A high-quality journal article making these contributions, establishing the distinction as a necessary part of future discussions on comparability.

  *   **Failure:** The project would fail if:
      1.  **Distinction Collapses:** It proves impossible to meaningfully separate the question of IDC from the choice of NDS/invariance conditions. If the factual question is shown to be entirely parasitic on the normative representational choices.
      2.  **IDC Remains Intractable:** No coherent account of the possibility or nature of IDC can be developed beyond triviality or complete skepticism.
      3.  **No Novel Insight:** The analysis of instruments like health metrics merely reiterates existing critiques about valuation conventions without shedding new light on the IDC/NDS distinction.
      4.  **Insufficient Progress:** The conceptual groundwork proves so extensive that the core argument about disentanglement and the analysis of key cases cannot be developed adequately within six months.
      *   *Manifestation:* An inconclusive manuscript that fails to establish the distinction's significance or provide new insights into the core question or the case studies.

  **5. Feasibility and Scalability for Six Months:**

  *   **Key Risk - Philosophical Depth:** The core challenge is the philosophical heavy-lifting required in Months 1-2 (conceptual disentanglement) and Month 2 (metaphysics of well-being). Delving too deeply into meta-ethics or the foundations of measurement could consume excessive time.
      *   **Mitigation:** Focus narrowly on arguments directly relevant to the *possibility* of IDC within standard frameworks of well-being discussed in economics and social choice. Avoid getting sidetracked into pure philosophy of mind or complex measurement theory. Leverage existing economic/philosophical critiques (e.g., Hausman on health measurement, Binmore on utilitarianism).
  *   **Key Risk - Formal Complexity:** Developing novel formal models (Month 4) to explore the IDC/NDS link could become overly complex.
      *   **Mitigation:** Prioritize clarity and illustrative power over exhaustive generality. Start with simple, tractable models (e.g., two-person, two-state worlds). Focus on demonstrating the *logical possibility* of independence rather than deriving comprehensive impossibility/possibility theorems.
  *   **Contingency Plan:** If the philosophical groundwork (Months 1-2) takes longer than anticipated, reduce the scope of the formal modeling (Month 4) and focus the case studies (Month 3) on *one* primary example (e.g., health metrics) analyzed in depth through the lens of the IDC/NDS distinction. Ensure the core conceptual argument and its application to one key case are robust, even if formal exploration is less extensive.

  **Conclusion:**
  This project challenges a fundamental conflation in the theory of interpersonal utility comparisons. By rigorously disentangling the factual question of intrinsic difference comparability (IDC) from the normative choice of invariance conditions (NDS), it aims to refocus attention on the core ontological issue underlying debates about weighing gains and losses across persons. Investigating instruments like health metrics through this lens promises fresh insights into whether they reflect discovery or convention. Success would provide a clearer conceptual map for future research in social choice, welfare economics, and applied policy evaluation, moving beyond stalemated debates focused primarily on representational invariance. The six-month timeframe is demanding but achievable with a disciplined focus on core conceptual analysis and targeted case study investigation.
