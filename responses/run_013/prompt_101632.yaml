answer: |-
  Below is a joint statement drafted as an adversarial collaboration between representatives of the "agriculture as catastrophe" (C) and "agriculture as improvement" (I) camps. It follows your structure: a preamble, agreed claims, a disagreements table isolating key cruxes (with definitions, agreed evidence, and predictions), and a conclusion on falsifiability. Both camps' wording has been incorporated neutrally, and the lock-in scenario is analyzed as requested.

  ---

  ### **Joint Statement on the Foraging-to-Farming Transition**  
  *Drafted in Good Faith by Adversarial Collaborators*  

  #### **Preamble**  
  We, the undersigned, acknowledge persistent disagreement over whether the Neolithic transition to agriculture improved or harmed human welfare. We commit to:  
  1. Defining shared terms and empirical baselines.  
  2. Islining disagreements into testable cruxes.  
  3. Specifying what evidence could resolve each crux.  
  We agree this debate hinges on unresolved empirical and philosophical questions, not mere romanticism or denial.  

  ---

  ### **Section 1: Claims We Both Accept**  
  #### **1.1 Empirical Skeleton**  
  - **Biological Evidence**: The transition correlates with skeletal markers of increased nutritional stress (e.g., reduced stature, enamel hypoplasia), higher prevalence of infectious disease (e.g., periosteal lesions), and dental pathologies in early farming populations vs. contemporaneous or antecedent foragers.  
  - **Demographic Evidence**: Farming enabled sustained population growth (≥10× density increases) and eventual urbanization.  
  - **Leisure & Labor**: Ethnographic and archaeological data suggest foragers typically spent fewer hours per week on subsistence than early farmers.  

  #### **1.2 Conceptual Accounting**  
  - **Currency of Welfare**: We define "welfare" as *healthy life-years (HLY)*, combining longevity and freedom from preventable morbidity.  
  - **Two Metrics**:  
    - **Per capita HLY**: Average welfare per individual.  
    - **Aggregate HLY**: Total welfare summed across all individuals in a society.  
  - **Tension**: These metrics can conflict (e.g., farming may lower *per capita HLY* but raise *aggregate HLY* via population growth). Neither metric is self-evidently "correct"; their prioritization involves ethical choices.  
  - **Temporal Scope**: Evaluations must specify whether they address:  
    - (a) **Transition-era individuals** (immediate costs/benefits),  
    - (b) **Steady-state societies** (e.g., after 500 years), or  
    - (c) **Long-term trajectories** (including modern descendants).  

  #### **1.3 Non-Negotiables**  
  - Foraging was not universally "idyllic": violence, infant mortality, and seasonal shortages occurred.  
  - Agriculture was not universally "progress": initial costs were often severe, and lock-in dynamics limited choice.  
  - **No Anachronism**: We reject judging past societies by modern values or outcomes (e.g., using GDP or democratic institutions).  

  ---

  ### **Section 2: Disagreements Table**  
  Each crux states:  
  - **The Issue** (neutral phrasing)  
  - **Camp C Position** (catastrophe)  
  - **Camp I Position** (improvement)  
  - **Agreed Evidence** (to test predictions)  
  - **Predictions** (falsifiable statements per camp)  

  | Crux | Camp C Position | Camp I Position | Agreed Evidence | Predictions |
  |------|-----------------|-----------------|----------------|-------------|
  | **Crux 1: Welfare Currency Priority**<br>*Which metric (per capita or aggregate HLY) best captures "human welfare" in this context?* | Per capita HLY is paramount. Suffering/well-being is experienced individually. A system that degrades average lives for population growth is a net loss. | Aggregate HLY is primary. Societies can only achieve complex goods (art, science, security) at scale. More lives, even shorter ones, represent net welfare gain. | **Evidence**: Demographic & health data from:<br>- Pre-contact forager societies (e.g., !Kung, Aché)<br>- Early agricultural societies (e.g., Çatalhöyük, Neolithic Europe)<br>- Agent-based models simulating HLY under both regimes. | **C**: Early farming sites will show lower per capita HLY than foraging comparators.<br>**I**: Farming societies will show higher aggregate HLY once population growth stabilizes (by steady-state). |
  | **Crux 2: The "Affluent Forager" Scope**<br>*Were high-performing foragers typical or outliers?* | Most pre-agricultural foragers had adequate leisure, nutrition, and security ("original affluent society"). Farming eroded this baseline. | "Affluence" claims rely on marginal, late-stage foragers in resource-rich areas. Most foragers faced higher risks and lower security than early farmers. | **Evidence**: Global dataset of forager societies (ethnographic & archaeological) scoring:<br>- Calories/leisure (via time allocation studies)<br>- "Security" (violence rates, famine frequency)<br>- Control for environmental carrying capacity. | **C**: >50% of forager societies will show ≥20 hrs/week leisure & ≤1 severe famine/generation.<br>**I**: >70% will show ≥1 life-threatening crisis/generation and <15 hrs/week average leisure. |
  | **Crux 3: Lock-In Dynamics & Agency**<br>*Does coercion invalidate "mistake" claims?*<br>(Analyzing *Valley F/G scenario*) | Absorbing F into G proves farming was coercive, not chosen. This reinforces that it harmed welfare (per capita HLY ↓). "Mistake" means: *worse for those experiencing it*. | Lock-in is irrelevant to welfare assessment. Farming enabled G to outcompete F, proving its long-term advantages. "Mistake" means: *a suboptimal path for aggregate welfare*. | **Evidence**: Archaeological cases of forager displacement by farmers (e.g., European Neolithic expansion) + biomechanical stress markers in absorbed populations. | **C**: Absorbed forager remains will show sharper health declines than original farmers.<br>**I**: Within 200 years, aggregate HLY in the merged valley will exceed that of two foraging valleys. |
  | **Crux 4: Who Counts**<br>*Can we compare welfare across populations with different compositions?* | Only individuals who *would have existed* under foraging count. Adding lower-HLY lives via farming is not a welfare gain. | All actual lives matter equally. The extra lives created by farming are net positive if their HLY >0. | **Evidence**: Simulation of HLY under foraging vs. farming carrying capacities in identical environments. | **C**: Foraging simulations will yield higher average HLY and lower total HLY.<br>**I**: Farming simulations will yield higher total HLY; average HLY differences will narrow over time. |

  ---

  ### **Section 3: Resolution Mechanics**  
  #### **3.1 What Would Falsify Each Camp?**  
  - **Camp C** would abandon its position if:  
    > *Evidence shows that ≥75% of early farming societies achieved steady-state **per capita HLY** equal to or exceeding contemporary foragers within 10 generations, without relying on later innovations (e.g., irrigation).*  
    - **Obtainable?**: Possible via paleodemographic reconstructions and stress-marker syntheses.  

  - **Camp I** would abandon its position if:  
    > *Evidence proves that, in >50% of transitions, **aggregate HLY** decreased or failed to increase (accounting for population growth) by the steady-state period.*  
    - **Obtainable?**: Challenging due to data gaps, but theoretically testable with cross-regional archaeological proxies.  

  #### **3.2 Is the Question Underdetermined?**  
  We agree the *overall* verdict may remain unresolved due to:  
  - **Data Gaps**: Skeletal samples are fragmentary; forager diversity is poorly sampled.  
  - **Philosophical Weighting**: Choosing between per capita and aggregate HLY is ethical, not empirical.  
  However, **specific cruxes are testable** (e.g., "affluence" prevalence, lock-in health impacts). If new evidence consistently favors one camp’s predictions, it would shift the consensus.  

  ---

  ### **Conclusion**  
  This transition’s evaluation depends on:  
  1. **Window Choice**: Camp C emphasizes transition-era individuals; Camp I emphasizes long-term aggregates.  
  2. **Ethical Axioms**: Whether we prioritize lived experience (per capita) or potential futures (aggregate).  
  3. **Agency**: The Valley F/G scenario shows that "improvement" claims must account for coercion.  
  **Signed,**  
  *Representatives of Both Camps*  

  ---  
  This document forces clarity on the trade-offs (individual suffering vs. collective potential) and locks both sides into testable commitments. The lock-in scenario, in particular, prevents Camp I from dismissing short-term costs or Camp C from ignoring scalability. By specifying what would falsify each position, it replaces ideology with empiricism—while acknowledging that some disagreements rest on irreconcilable values.
