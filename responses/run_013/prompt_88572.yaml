prompt: |-
  You are a stratigrapher who has spent the past decade inside the Anthropocene ratification fight, and you also read enough history and philosophy of science to know that the question "when did it start?" is really four or five questions wearing one coat. I am assembling a handout for a graduate seminar that pairs a stratigraphy unit with an STS unit, and I need you to build a classification instrument: a decision tree that doubles as a taxonomy of positions on the Anthropocene as a geological time unit.

  The problem I am solving: my students collapse into two camps, "it started in 1950" and "the whole thing is politics," and both are failures of imagination about how many positions are actually on the table. The instrument should sort people by what they are committed to, not by which label they like.

  Think this through carefully before writing. Begin by brainstorming the logical space rather than by listing positions you already know: first enumerate the axes on which someone can answer the question of whether the Anthropocene is a geological time unit, and if so which kind, from when, and by whose authority; then work out which combinations of answers are internally consistent; only then attach names to the cells. A tree assembled backwards from a list of names will fail the purpose, and I will be able to tell.

  Requirements for the structure:

  Every branch node must be a question a reader can answer without knowing which position it leads to. No node may be phrased as "do you accept the Capitalocene?" or otherwise presuppose a label. Nodes should be phrased at the level of, for instance: should the base of the unit be defined by the first appearance of a signal, or by the moment that signal becomes globally legible? Must the boundary be a single point in one physical section, or may it be a numerically specified age? May the boundary surface be diachronous, arriving at different dates in different places, or must it be synchronous everywhere? (Those are only to fix the register; do not copy them.)

  At a minimum, the tree must be able to separate these axes:

  1. Kind of thing: a formal chronostratigraphic unit (a series, hence an epoch) versus a geochronological unit versus a geological event in the sense of the Great Oxidation Event, which has no base and top and is not a time unit at all versus an informal descriptor that should never be formalised versus a periodisation belonging to history or political economy rather than to geology.
  2. Marker class: a globally synchronous fallout signal such as bomb-test plutonium or bomb radiocarbon; an atmospheric or greenhouse inflection recorded in ice cores; a land-use or reforestation signal; an assemblage of artificial ground, technofossils, or industrial-age biological remains; or a diachronous package of such signals, with no single one privileged.
  3. Boundary geometry: a point defined in one section; a numerically defined age; an interval whose top is necessarily open because the unit is still unfolding; a diachronous surface; or deliberately multiple boundaries for multiple purposes.
  4. Date: Neolithic or early Holocene; 1610; the industrial revolution; the mid-twentieth century; or the claim that the demand for a single date is itself the mistake.
  5. Authority: the formal ratification procedure of the stratigraphic bodies; some wider body, whether mixed natural and social science or intergovernmental; no authority at all, because usage settles the meaning; or the claim that the fact that a small committee of geologists gets to rule on this is itself the problem.
  6. What the unit is for: correlating strata; organising interdisciplinary research; legal or political recognition, as in ecocide, rights of nature, or liability; teaching; or the diagnosis that the term names a political situation rather than measuring one.

  Leaves must be named positions, each carrying one sentence on its most awkward commitment. Include at least these as leaves: the mid-twentieth-century proposal built on a plutonium spike in a single Canadian lake; the early-Anthropocene hypothesis; the 1610 reading of the colonial collapse and the reforestation that followed it, the Orbis spike; the Capitalocene; the Plantationocene; the event-not-epoch position; the informal-term-only position, which refuses the ratification question altogether; a marker position that takes the industrial reconfiguration of the biosphere, down to the bones of industrially farmed chickens and other technofossils, as the diagnostic signal; and a position that holds the Holocene simply has not ended and there is nothing to define. Mark any cell the axes generate that nobody has named as unnamed.

  Then add two short sections. First, a table of cells in your grid that no one occupies, each with a one-line diagnosis: incoherent, unattractive, or merely unexplored. Second, a closing paragraph on what your tree cannot do. Flag every pair of leaves the questions above fail to separate, and state what further question would separate them. I expect trouble distinguishing positions that agree on a date but disagree about what the date is for, and positions that reject the geological framing while still wanting a stratigraphic marker. If your tree cannot handle either, say so plainly rather than smoothing it over; a visible gap is more useful to me than a false clean partition.

  Format: roughly 1000 to 1500 words. Use an indented outline or an ASCII tree for the structure itself, and prose only where prose is needed. No citations, no reading lists, no parenthetical years attached to authors: I know the literature and my students do not need it, and I do not want the handout to stand or fall on attribution. Where a position is standardly known by a coinage, use the coinage; otherwise describe it by its commitments.
reasoning: |-
  Okay, let me approach this systematically. The user is a scholar designing a graduate seminar tool that requires precise conceptual mapping of Anthropocene positions, without falling into oversimplified binaries. 

  First, I need to identify the core axes of variation independent of existing labels. The six required dimensions (kind, marker, boundary, date, authority, purpose) form a combinatorial grid - but not all combinations will be coherent or occupied. 

  For the decision tree structure:
  - Branch nodes must be neutral questions answerable without knowing their implications
  - Terminal leaves must include specified positions (e.g. Capitalocene, Orbis spike) 
  - Each leaf requires disclosure of its "awkward commitment"
  - Unoccupied cells need classification (incoherent/unattractive/unexplored)

  Key challenges I anticipate:
  1. Separating positions that share a date but differ fundamentally in purpose (e.g. 1950 as stratigraphic marker vs. political diagnosis)
  2. Handling positions that reject geological framing but still use stratigraphic concepts
  3. The "no single date" category potentially overlapping with multiple distinct critiques

  The tree must force distinctions where students currently conflate:
  - Technical ratification debates vs. epistemological critiques
  - Marker selection (plutonium/chickens/CO2) from boundary definitions (point/interval/diachrony)
  - Geological timescales from historical periodizations

  For unoccupied cells, I'll need to identify:
  - Logically inconsistent combinations (e.g. demanding formal ratification while rejecting ICS authority)
  - Theoretically possible but currently unclaimed positions
  - Combinations made unattractive by disciplinary norms

  The closing critique should explicitly name:
  - Which distinct positions the tree fails to separate
  - What additional questions would be required
  - The inherent limitations of any taxonomy in capturing hybrid positions

  I'll structure the output as:
  1. Decision tree (ASCII format for clarity)
  2. Unoccupied cells table
  3. Limitations statement
answer: |-
  ### Anthropocene Position Taxonomy: A Decision Tree

  **Decision Tree Structure**  
  *(Answer sequentially; each branch leads to sub-questions until a terminal leaf is reached)*  

  1. **Is the Anthropocene best understood as a geological entity?**  
     - **No** → Proceed to 2  
     - **Yes** → Proceed to 3  

  2. **Does it function as a useful interdisciplinary concept outside geology?**  
     - **No** → **Informal-Term-Only Position**: *Awkward commitment: Must deny geological utility while accepting its cultural pervasiveness.*  
     - **Yes** → **Diagnostic Political Position** (e.g., Capitalocene/Plantationocene variants): *Awkward commitment: Relies on geological imagery (e.g., "strata of power") while rejecting geological ratification.*  

  3. **Should it be formalized as a chronostratigraphic unit (series/epoch)?**  
     - **No** → Proceed to 4  
     - **Yes** → Proceed to 5  

  4. **Is it a discrete geological "event" with duration but no formal boundaries?**  
     - **Yes** → **Event-Not-Epoch Position**: *Awkward commitment: Cannot correlate strata yet insists on geological significance.*  
     - **No** → **Holocene Continuity Position**: *Awkward commitment: Dismisses novel biosphere disruptions as insufficiently distinct from Holocene variability.*  

  5. **Must the unit’s base be defined by a globally synchronous primary marker?**  
     - **Yes** → Proceed to 6  
     - **No** → Proceed to 8  

  6. **Should the marker prioritize abrupt atmospheric signals?**  
     - **Yes** → Proceed to 7  
     - **No** → **Industrial Technofossil Marker Position**: *Awkward commitment: Argues for industrial-era materials (e.g., chicken bones, plastics) as primary, despite diachrony.*  

  7. **Is the mid-20th-century plutonium spike the optimal marker?**  
     - **Yes** → **Mid-20th-Century Plutonium Position**: *Awkward commitment: Stakes entire epoch on signal from one Canadian lake core.*  
     - **No** → **Bomb Radiocarbon Position** (unnamed variant): *Awkward commitment: Favors radiocarbon over plutonium but faces identical stratigraphic limitations.*  

  8. **Is the unit’s start best defined by a numerically specified age?**  
     - **Yes** → Proceed to 9  
     - **No** → **Diachronous Boundary Position**: *Awkward commitment: Accepts temporal inconsistency in boundary recognition globally.*  

  9. **Does a 1610 atmospheric CO₂ dip (Orbis Spike) mark the base?**  
     - **Yes** → **1610 Orbis Spike Position**: *Awkward commitment: Ties geological unit to colonial genocide-induced reforestation.*  
     - **No** → Proceed to 10  

  10. **Is an early Holocene/Neolithic marker defensible?**  
      - **Yes** → **Early-Anthropocene Hypothesis**: *Awkward commitment: Stretches the unit to include pre-industrial agriculture, blurring with Holocene.*  
      - **No** → **Industrial Revolution Marker Position** (unnamed): *Awkward commitment: Cannot pinpoint a global isochronous signal pre-1950.*  

  ---

  **Unoccupied Cells**  
  | **Combination** | **Diagnosis** |  
  |-----------------|---------------|  
  | Formal epoch + Diachronous boundary + Single authority ratification | **Incoherent**: Formal units require synchronous boundaries. |  
  | Geological event + Political purpose (e.g., ecocide liability) | **Unattractive**: Events lack boundaries needed for legal applications. |  
  | Informal term + Single physical section marker | **Unexplored**: Why demand stratigraphic precision if rejecting formalization? |  
  | Technofossil marker + 1610 date | **Incoherent**: Technofossils proliferate post-1850, incompatible with Orbis spike. |  

  ---

  **What the Tree Cannot Do**  
  This taxonomy fails to disentangle four critical overlaps:  

  1. **Shared Dates, Divergent Purposes**: Positions agreeing on a mid-20th-century start (e.g., Plutonium Spike vs. Industrial Technofossils) are separated by marker choice (Q6), but not by *purpose*. To distinguish "1950 for stratigraphic correlation" from "1950 for political indictment," add: *"Is the unit’s primary value scientific correlation or societal critique?"*  

  2. **Rejected Geological Framing with Stratigraphic Markers**: The "Diagnostic Political Position" (leaf at Q2) and "Event-Not-Epoch Position" (Q4) both use stratigraphic metaphors while denying geological legitimacy. Separating these requires: *"Does the position borrow geological terminology primarily for rhetorical force or analytical precision?"*  

  3. **Authority Ambiguity**: Pro-ratification positions (e.g., Plutonium Spike, Orbis Spike) are not probed on *who* should ratify. To split "ICS-only" from "intergovernmental authority," insert after Q3: *"Must ratification adhere strictly to existing stratigraphic committees?"*  

  4. **The 'No Single Date' Blind Spot**: The tree routes "no single date" answers (Q8: diachrony; Q5: non-synchroneity) to distinct leaves but cannot isolate *why* a single date is rejected. A question like *"Is the demand for a single date epistemologically flawed or just pragmatically premature?"* would divide principled pluralists from pragmatic incrementalists.  

  The tree also conflates all non-geological positions under Q2, obscuring differences between historical periodizations (e.g., Capitalocene) and purely cultural critiques. This reflects a deliberate trade-off: exhaustive branching would produce untenable complexity. These gaps, however, expose where the Anthropocene debate exceeds stratigraphic logic—precisely the tension your seminar aims to explore.
