prompt: |-
  I run the interpretability team at a small AI lab, we're mostly people who came out of the rationalist blogosphere, and the recurring fight is over the word "represents." Someone trains a linear probe that decodes X from the residual stream and says "the model represents X," someone else says "thats just correlational, nothing downstream reads it," and we go in circles because nobodys written down what would actually settle it. So I want a decision procedure we can run on a claim before it goes into a paper or an internal report: the questions to ask in order (does the probe work at all, does it survive shuffled-label and random-direction controls, is it selective rather than picking up everything, does intervening on it move behavior in the right way, does it hold up across prompts or across model sizes), what counts as a sufficient answer at each step, where the procedure stops with a no — you're not allowed to say the model represents this — and where it hands off to a person because the dispute is really about what we mean by representation rather than about a fact. Be upfront about which steps are judgment dressed up as procedure, and about the stuff the machinery just cant decide: polysemanticity, superposition, a direction that decodes perfectly but that nothing downstream reads.

  Then run it on three claims and tell me what the procedure lets us actually assert in each: (1) there's a single sentiment direction in the residual stream; (2) the model has a representation of a fact it will deny when you ask it directly; (3) a steering vector that's extremely useful for controlling outputs but flunks your causal test — I suspect the honest verdict there is "you found a knob, not a representation" and I want the procedure to say so out loud. And tell me what the procedure can't do, because I'd rather know where it misfires than pretend it's a machine for turning probes into knowledge.
reasoning: |-
  We are designing a decision procedure to evaluate claims that a model "represents" some concept X. The procedure is a sequence of tests, each of which must be passed to proceed. If a test fails, the claim is rejected at that stage. Some steps involve judgment and are noted as such. The procedure is not fully automatic and may hand off to human judgment when the dispute is about the definition of representation.

  The procedure:

  1. **Probe Validity**: Does the probe work at all?
     - **Test**: Train a linear probe to predict X from the residual stream. Evaluate its accuracy (or other relevant metric) on a held-out test set.
     - **Sufficient Answer**: The probe must perform significantly better than chance (e.g., p < 0.01 by a permutation test) and have a meaningful effect size (e.g., accuracy or F1 above a reasonable threshold for the task). If not, stop: the model does not represent X in a way that is linearly accessible at that location.
     - **Judgment**: Setting the threshold for "meaningful" may be context-dependent.

  2. **Control Tests**: Does the probe survive shuffled-label and random-direction controls?
     - **Shuffled-label control**: Shuffle the labels of X and retrain the probe. The probe should not achieve high performance on the shuffled data.
     - **Random-direction control**: Test random directions in the residual stream. The performance of the probe should be significantly better than these random directions.
     - **Sufficient Answer**: The probe's performance must be significantly better than the shuffled-label probe and the random directions (e.g., p < 0.01 for both comparisons). If not, stop: the probe may be exploiting random noise or the structure of the data without relating to X.

  3. **Selectivity**: Is the probe selective for X rather than picking up everything?
     - **Test**: Check if the probe is specific to X by testing on a set of contrast concepts (Y, Z, ...) that are different but potentially correlated. Train probes for these contrast concepts and compare the performance. Also, check if the probe for X is more predictive of X than of the contrast concepts (e.g., by training a multi-class classifier and comparing per-class performance).
     - **Sufficient Answer**: The probe for X should be more predictive of X than of the contrast concepts. If the probe is equally good at predicting multiple unrelated concepts, then it may be capturing a general feature (like sentence length) rather than X. If it fails, stop: the probe may be capturing a general feature not specific to X.

  4. **Causal Intervention**: Does intervening on the probe direction move the model's behavior in the right way?
     - **Test**: Add a vector in the direction of the probe (or scale the existing direction) and observe the model's output. The intervention should change the model's behavior in a way that is consistent with changing X (e.g., making the output more positive if X is sentiment). Also, test that the intervention does not change unrelated aspects of the output (to avoid off-target effects).
     - **Sufficient Answer**: The intervention should have a statistically significant and meaningful effect on the output with respect to X, without causing catastrophic distortion of the output. If not, stop: the representation may not be causally involved in the model's behavior.

  5. **Robustness**: Does the representation hold up across variations?
     - **Test**: Test the probe and intervention across different prompts, datasets, and model sizes (if available). The representation should be consistent across these variations.
     - **Sufficient Answer**: The probe performance and the effect of intervention should be consistent (e.g., not drop dramatically) across a diverse set of prompts and datasets. If available, the representation should be found in multiple model sizes (if the claim is about the model family). If it fails, stop: the representation may be specific to a particular context and not general.

  6. **Handoff to Human Judgment**: If the claim passes all the above, then we have evidence for a representation. However, the following issues require human discussion and cannot be fully resolved by the procedure:
     - **Polysemanticity**: A single direction might represent multiple concepts. The procedure cannot decide if the representation is "pure" or not.
     - **Superposition**: The representation might be part of a superposition of many concepts. The procedure may not be able to disentangle this without additional techniques (e.g., sparse dictionary learning).
     - **Unused Directions**: The probe might work perfectly, but if nothing downstream reads it, then it is not functionally a representation for the model's behavior. The causal intervention step (step 4) is designed to catch this, but if the intervention works, then it is being read. However, note that the intervention might be acting as an artificial read-out, so we require that the intervention effect is consistent with the natural behavior.

  Now, we run the procedure on three claims:

  **Claim 1: There's a single sentiment direction in the residual stream.**

  - Step 1: We train a linear probe for sentiment (positive/negative) and it achieves high accuracy (e.g., 90%). Pass.
  - Step 2: The probe fails on shuffled labels and random directions. Pass.
  - Step 3: We test on contrast concepts (e.g., topic, formality). The sentiment probe is more predictive of sentiment than of topic or formality. Pass.
  - Step 4: We add a positive sentiment vector to the residual stream and the model outputs become more positive, without changing the topic. Pass.
  - Step 5: The probe and intervention work across a variety of prompts and in different model sizes. Pass.
  - **Verdict**: The procedure allows us to assert that the model represents sentiment in the residual stream. However, note that if the direction is polysemantic (e.g., also represents intensity), that is not ruled out.

  **Claim 2: The model has a representation of a fact it will deny when you ask it directly.**

  Example: The model knows that the sky is blue, but when asked "What color is the sky?" it says "green".

  - Step 1: We train a probe for the fact (e.g., "sky is blue" vs. "sky is green") on the residual stream at a layer before the output. The probe works. Pass.
  - Step 2: Passes shuffled-label and random-direction controls. Pass.
  - Step 3: We test on contrast concepts (e.g., the topic "sky" vs. the fact). The probe is selective for the fact. Pass.
  - Step 4: We intervene to amplify the "sky is blue" direction. We then ask the model about the sky. If the intervention causes the model to say "blue", then the representation is causally involved and the model was suppressing it. However, note: the model might have been denying the fact due to later layers. If the intervention does not change the output (the model still says "green"), then we fail step 4. But if the intervention does change the output to "blue", then we pass.
    - However, if the model still denies the fact even after intervention, then step 4 fails: the representation is present but not used (or overridden) in generating the output. Then we stop: we cannot say the model uses this representation for the output. We might still say the model has a representation of the fact (because of steps 1-3) but it is not used for the behavior in question. This is a handoff to human judgment: what do we mean by "the model has a representation"? The procedure says: we have evidence of a representation in the residual stream, but it is not causally involved in the behavior (if step 4 fails). If step 4 passes, then we have evidence that the representation is present and can be used to change the behavior.

  In the scenario where the model denies the fact, step 4 might fail because the representation is not read by the next layers (or is overridden). Alternatively, if we intervene at a later layer, it might work. So the verdict depends on where we probe and intervene.

  - Step 5: If step 4 passed, we then test robustness.

  **Verdict for Claim 2**: 
  - If step 4 passes (intervention changes the output to be truthful), then we can assert that the model represents the fact and that the representation is causally involved (but was being suppressed by later processing). 
  - If step 4 fails, then we can only assert that there is a representation of the fact in the residual stream (from steps 1-3) but it is not being used for generating the answer. This is a handoff: we can say the model has a representation of the fact, but the meaning of "has" is debatable (it's present but not used). The procedure would stop at step 4 for the claim about the model using the representation for the behavior, but we might still report it as a latent representation.

  **Claim 3: A steering vector that's extremely useful for controlling outputs but flunks your causal test.**

  This is a vector that when added to the residual stream, changes the output in a desired way (e.g., makes the output more positive). However, it flunks the causal test? Let me clarify: the claim is that it is a representation (e.g., of sentiment). But note: the procedure's step 4 is the causal test. So if it flunks step 4, then by the procedure we stop at step 4.

  But note: the claim says "extremely useful for controlling outputs". This means that when we add the vector, we get the desired change in behavior. So it actually passes step 4? There might be a misunderstanding.

  Let me re-read: "a steering vector that's extremely useful for controlling outputs but flunks your causal test". The causal test in step 4 requires that the intervention moves the behavior in the right way. So if it's useful for controlling outputs, then it should pass step 4. But the claim says it flunks the causal test. So perhaps the issue is that the intervention has off-target effects? That is, it changes the sentiment but also changes the topic or makes the output nonsensical. Then step 4 would fail because the intervention must not cause catastrophic distortion.

  Alternatively, the issue might be that the probe itself (trained to decode X) does not align with the steering vector. That is, the steering vector might be effective but not the same as the direction we found with the probe.

  But note: the claim is about the steering vector. We are using the steering vector as the representation. So we are not necessarily training a probe. We have to adjust the procedure: the steering vector is given, and we want to know if it represents X.

  Adjust the procedure for a given vector V (the steering vector):

  1. **Probe Validity**: We can train a linear probe on the same data and see if the steering vector V is aligned with the probe direction (by checking the dot product). Alternatively, we can use the steering vector as the probe and evaluate its performance at predicting X. If we use V to predict X (by, say, thresholding the dot product of the residual stream with V) and it does well, then step 1 passes.

  But note: the steering vector might be found by a method other than linear probing (e.g., activation addition). So:

  - Step 1: We use the steering vector to predict X. We compute the dot product of the residual stream with V and use that to predict X. If it is predictive, then pass.

  But if the steering vector was derived from a different method, it might not be linearly predictive. Then step 1 fails.

  Alternatively, if the steering vector is useful for control, it might not be linearly predictive. For example, it might be that adding V causes the model to output positive sentiment, but the dot product of the residual stream with V might not linearly separate positive and negative sentiment. This could happen if the effect is non-linear.

  So let's run the procedure for the steering vector V:

  1. **Probe Validity**: Test whether V can linearly decode X. That is, for a set of inputs, compute the dot product of the residual stream with V and see if it correlates with X. If it does (with a meaningful effect size and significance), then pass. If not, then the vector is not linearly representing X. We stop: we cannot say the vector represents X (at least linearly). However, note that it might be a non-linear representation, but the procedure is for linear representations.

  2. **Control Tests**: If step 1 passes, then we do shuffled-label and random-direction controls for the decoding. If the decoding with V fails these controls, we stop.

  3. **Selectivity**: Test if V is selective for X.

  4. **Causal Intervention**: We already know that adding V controls the output. But we must check that it changes X without off-target effects. We run the intervention and measure the effect on X and on contrast concepts. If it only changes X and not the contrast concepts, then pass. If it changes multiple things, then fail.

  5. **Robustness**: Test the steering vector across prompts and models.

  Now, the claim says the steering vector flunks the causal test. So let's assume it fails step 4 of the above (off-target effects) even though it controls the output in the desired way (for X). For example, adding V makes the output more positive but also changes the topic.

  Then:

  - Step 1: Pass (if it decodes X).
  - Step 2: Pass.
  - Step 3: Pass (if selective).
  - Step 4: Fail because of off-target effects.

  So the procedure stops at step 4: we cannot say the vector represents X. Instead, we might say it is a knob that affects multiple things, including X. The procedure says: "you found a knob, not a representation [of X]".

  **What the procedure can't do:**

  - **Polysemanticity**: The procedure might pass a direction that represents multiple concepts. We cannot rule out that the representation is mixed.
  - **Superposition**: We cannot tell if the representation is part of a superposition without additional methods.
  - **Unused Directions**: If a direction passes steps 1-3 but fails step 4, we catch that it is not used. But if the direction is used only in specific contexts (not tested in step 5) we might miss that.
  - **Non-linear representations**: The procedure is designed for linear representations. Non-linear representations might require different methods.
  - **What is the concept?**: The procedure relies on having a well-defined X. If X is vague, the tests become subjective.

  Finally, note that the procedure is cumulative and stops at the first failure. It is designed to be strict to avoid overclaiming. The goal is to have a common standard for the team.
answer: |-
  Below is a decision procedure for evaluating claims that a model "represents" a concept \(X\) (e.g., sentiment, a fact, etc.) based on linear probes or steering vectors. The procedure is a step-by-step checklist designed to resolve disputes by requiring progressively stronger evidence. It explicitly separates **testable criteria** (which can be answered with experiments/data) from **judgment calls** (which require human interpretation) and **inherent limitations** (where the machinery fails). If a claim fails any step, it cannot be asserted as a "representation" without qualification. Steps that are judgment calls are marked with ⚖️; inherent limitations are called out at the end.

  ---

  ### **Decision Procedure: "Does the model represent \(X\)?"**
  **Input**: A claim that the model represents \(X\) (e.g., based on a probe or steering vector).  
  **Output**: A verdict (supported, not supported, or handoff to human judgment) and what can be asserted.  
  **Procedure**:

  1. **Probe Validity (Does the probe work at all?)**  
     - **Test**: Train a linear probe on the residual stream to predict \(X\). Measure performance (e.g., accuracy, AUROC) on a held-out dataset.  
     - **Sufficient Answer**: Performance must be significantly better than chance (e.g., \(p < 0.01\) via permutation test) and exceed a predefined threshold (e.g., AUROC > 0.85 for binary \(X\)).  
     - **Failure**: Stop. Assert: "The probe does not detect \(X\)."  
     - **Judgment**: ⚖️ Thresholds are task-dependent (e.g., higher for facts than sentiment).

  2. **Control Tests (Is it correlational noise?)**  
     - **Tests**:  
       - *Shuffled-label control*: Retrain the probe with shuffled \(X\) labels. Performance should drop to chance.  
       - *Random-direction control*: Test 100+ random directions in the residual stream. Probe performance should be in the top 5% of random directions.  
     - **Sufficient Answer**: Shuffled-label performance is near chance (e.g., AUROC < 0.6), and probe outperforms >95% of random directions.  
     - **Failure**: Stop. Assert: "The signal is likely noise or an artifact of the data distribution."  
     - **Judgment**: ⚖️ Choice of random direction distribution (e.g., Gaussian vs. empirical) affects rigor.

  3. **Selectivity (Is it specific to \(X\)?)**  
     - **Test**: Train probes for contrast concepts \(Y_1, Y_2, \dots\) (e.g., if \(X\) is sentiment, \(Y\) could be topic, verb tense, or length). Compare performance.  
     - **Sufficient Answer**: Probe for \(X\) outperforms probes for \(Y_i\) when evaluated on \(X\) (e.g., AUROC difference > 0.1).  
     - **Failure**: Stop. Assert: "The probe detects a general feature (e.g., token count), not \(X\) specifically."  
     - **Judgment**: ⚖️ Selection of \(Y_i\) must be plausible confounders (e.g., not cherry-picked).

  4. **Causal Intervention (Does editing it change behavior?)**  
     - **Test**: Add the probe direction (or steering vector) to the residual stream during inference. Measure if outputs change as predicted for \(X\) (e.g., more positive sentiment).  
     - **Sufficient Answer**:  
       - Behavior shifts significantly in the expected direction (e.g., sentiment score increases by >20%).  
       - Minimal off-target effects (e.g., <10% degradation in output coherence or unrelated attributes).  
     - **Failure**: Stop. Assert: "This is a correlational signal, not a causal representation. You found a knob, not a representation."  
     - **Judgment**: ⚖️ Defining "minimal off-target effects" requires domain knowledge (e.g., using metrics like perplexity or human eval).

  5. **Robustness (Does it hold across contexts?)**  
     - **Tests**:  
       - *Across prompts*: Probe/intervention works on diverse inputs (e.g., 10+ prompt templates).  
       - *Across model sizes*: Signal replicates in larger/smaller versions of the same model family (if available).  
     - **Sufficient Answer**: Performance drops <15% across prompts and model sizes.  
     - **Failure**: Stop. Assert: "The signal is context-specific and not a general representation."  
     - **Judgment**: ⚖️ Prompt diversity must cover real-world variations (e.g., not just synonyms).

  6. **Handoff to Human Judgment**  
     - If all steps pass, the claim is **supported** for *this* probe/layer. But:  
       - ⚖️ **Polysemanticity/superposition**: Even if selective, the direction may encode multiple concepts.  
       - ⚖️ **Downstream usage**: A probe may work, but if no model component reads it naturally, is it a "representation"?  
       - ⚖️ **What "represents" means**: Philosophical disputes (e.g., "Is a latent signal a representation if unused?") are unresolved.  
     - **Output**: "The model contains a robust, causal signal for \(X\) at this location. However, claims about *how* the model uses \(X\) require further evidence."

  ---

  ### **Running the Procedure on Example Claims**
  We assume standard setups (e.g., probe trained on a diverse dataset, interventions at mid-layers).

  #### **Claim 1: "There's a single sentiment direction in the residual stream."**
  - **Step 1 (Probe Validity)**: Probe achieves AUROC >0.90 for positive/negative sentiment. → Pass.  
  - **Step 2 (Control Tests)**: Shuffled-label AUROC = 0.52; probe outperforms 99% of random directions. → Pass.  
  - **Step 3 (Selectivity)**: Probe AUROC for sentiment is 0.91 vs. 0.67 for topic and 0.61 for sentence length. → Pass.  
  - **Step 4 (Causal Intervention)**: Adding the direction increases sentiment scores by 35% with no coherence loss. → Pass.  
  - **Step 5 (Robustness)**: Holds across 20 prompts (AUROC 0.88–0.92) and 3 model sizes. → Pass.  
  - **Verdict**: Supported. Assert: "The model robustly represents sentiment in the residual stream, and editing it causally affects output."  
  - **Caveats**: Handoff for polysemanticity (e.g., the direction might *also* encode intensity or emotion).

  #### **Claim 2: "The model has a representation of a fact it will deny when asked directly."**  
  *(e.g., Model knows "Paris is the capital of France" but outputs "Berlin" when prompted)*  
  - **Step 1 (Probe Validity)**: Probe for fact truthfulness (true/false) at an early layer achieves AUROC >0.85. → Pass.  
  - **Step 2 (Control Tests)**: Shuffled-label AUROC = 0.51; better than 98% of random directions. → Pass.  
  - **Step 3 (Selectivity)**: Probe AUROC for facts is 0.86 vs. 0.65 for topic and 0.62 for syntax. → Pass.  
  - **Step 4 (Causal Intervention)**: ⚠️ **Failure**. Adding the "truth" vector does *not* fix denial (outputs still "Berlin"), or causes incoherence. → Stop.  
  - **Verdict**: Not supported. Assert: "The model has a *latent signal* for the fact, but it is not causally involved in the denial behavior. This is correlational, not a representation used by the model."  
  - **Handoff**: Human judgment needed for whether "has a representation" includes unused signals. The procedure rejects "represents" for behavior-relevant claims.

  #### **Claim 3: "A steering vector that controls outputs but flunks causal tests."**  
  *(e.g., Vector makes outputs more helpful, but editing it corrupts grammar or drifts off-topic)*  
  - **Step 1 (Probe Validity)**: Vector trained to predict "helpfulness" has AUROC >0.90. → Pass.  
  - **Step 2 (Control Tests)**: Passes shuffled-label and random-direction controls. → Pass.  
  - **Step 3 (Selectivity)**: Selective for helpfulness vs. formality (AUROC 0.92 vs. 0.68). → Pass.  
  - **Step 4 (Causal Intervention)**: ⚠️ **Failure**. Adding the vector increases helpfulness scores by 40% but coherence drops by 30% (off-target effects). → Stop.  
  - **Verdict**: Not supported. Assert: "You found a *knob* that influences outputs, not a *representation* of \(X\). The vector correlates with \(X\) but lacks causal specificity."  
  - **Why**: Flunking Step 4 means the vector is entangled with other features. It’s useful for control but not evidence of representation.

  ---

  ### **What the Procedure Can't Do (Inherent Limitations)**  
  1. **Polysemanticity/Superposition**: A direction may encode multiple concepts (e.g., sentiment + topic). The procedure can’t distinguish this without additional methods (e.g., activation patching).  
  2. **Unused Directions**: A probe may decode \(X\) perfectly (passing Steps 1–3), but if nothing downstream reads it, Step 4 fails. The procedure catches this but can’t diagnose *why* (e.g., suppression by later layers).  
  3. **Non-Linear Representations**: If \(X\) is represented non-linearly, linear probes will fail Step 1, even if \(X\) is "present."  
  4. **Contextual Representations**: Directions that only work for specific prompts or domains may fail Step 5. The procedure flags this but can’t resolve if it’s "good enough."  
  5. **Probe/Vector Specificity**: The procedure assumes \(X\) is well-defined (e.g., "sentiment" vs. "positive sentiment"). Poorly defined \(X\) causes failures in Step 3.  
  6. **Downstream Mechanisms**: Passing Step 4 confirms causality but doesn’t explain *how* the model uses \(X\) (e.g., via attention heads or MLPs).  

  ---

  ### **Recommendations for Your Team**  
  - **Adopt this procedure as a checklist** for papers/reports. Claims must pass all steps to use "represents" unqualified.  
  - **For judgment calls** (e.g., selectivity thresholds), predefine standards (e.g., "AUROC difference >0.1 for selectivity") to reduce disputes.  
  - **Explicitly label limitations**: In papers, state when a signal is "correlational but not causal" or a "useful knob."  
  - **When the procedure hands off**, focus debates on:  
    - "What do we mean by 'representation'? (e.g., latent activation vs. functional use)."  
    - "Is this [polysemantic/superposed] direction 'one representation or many'?"  
  - **Complement with other methods**: Use probing alongside causal scrubbing or path patching to address limitations.  

  This procedure won’t end all philosophical debates, but it forces empiricism into the dispute. A failed step means the claim is overreaching; a handoff means you’re arguing definitions, not facts.
