prompt: |-
  I'm a retired physicist — thirty years of condensed matter, then a lockdown reading binge, and now I'm halfway through a part-time MA and giving my first proper talk to our joint physics-and-philosophy seminar in a fortnight. My thesis is that panpsychism is much less alarming for ethics than everyone assumes: the fundamental experiential properties can't combine into a single subject, because nothing in the physics plays the role of a binding relation, so the bearers of suffering stay at the level of biology and nothing gets added at the micro level. On my view the ethical upshot of panpsychism is close to nil and the real work stays where it already was. The room: six or seven physicists (quantum field theory and stat mech, allergic to anything that smells like woo, and one operationalist who thinks unobservable talk is just meaningless), plus three philosophers — one panpsychist who works on the combination problem and will know my move is a dodge, one utilitarian who'll immediately ask about animals and infants, and one Kantian who frankly doesn't care about any of it. Draft me a Q&A prep sheet: the objections I'll actually get, phrased the way that lot would phrase them, ordered by how much damage they'd do, each with a two-minute reply and a note on where the reply is soft, plus what I should just concede up front to buy goodwill. And include the one question I'm praying nobody asks.
