answer: |-
  Here’s a structured handout disambiguating "But what if everyone did that?" for your graduate seminar, addressing all requested elements. The four interpretations are distilled into core theses, with assessments and divergence cases.

  ---

  ### **"But What If Everyone Did That?": Disambiguating the Retort**  
  *Handout for Graduate Seminar in Ethics/Decision Theory*  

  #### **I. The Four Interpretations: A Menu**  
  *(Key: **D** = Descriptive | **N** = Normative)*  

  1. **The Prediction Model (Descriptive Consequentialism)**  
     - **Thesis**: If everyone performed the action, it would lead to catastrophic (or otherwise unacceptable) consequences.  
     - **Type**: **D** (predicts outcomes).  
     - **Plausibility**:  
       - *Strengths*: Grounded in empirical cause-effect (e.g., "If everyone overfished, stocks collapse").  
       - *Weaknesses*: **Ignores threshold effects** (e.g., one person flying adds negligible CO₂). Fails when individual acts *are* harmless.  
     - **Licenses Conclusion?**: **No** for individual cases. The "tragedy of the commons" arises from *aggregation*, not single acts. Invoking it for one actor commits a **fallacy of division**.  

  2. **Universalizability as Consistency (Kantian Constraint)**  
     - **Thesis**: An action is permissible only if you can consistently will that *everyone* in a similar position acts the same way (without logical or practical contradiction).  
     - **Type**: **N** (tests moral permissibility).  
     - **Plausibility**:  
       - *Strengths*: Avoids hypocrisy/arbitrariness; foundational to deontology (e.g., lying fails if universalized).  
       - *Weaknesses*: **Overly rigid** (e.g., universal gift-giving might be impractical but not contradictory). Confuses *conceivability* with *desirability*.  
     - **Licenses Conclusion?**: **Yes**, but weakly. Binds the individual only if universalization yields contradiction (e.g., promise-breaking undermines the institution of promising). Fails when universalization is *possible* but suboptimal.  

  3. **Rule Consequentialism (Optimal Social Rule)**  
     - **Thesis**: We should act according to the rule whose universal adoption would produce the best overall consequences.  
     - **Type**: **N** (evaluates rules, not acts).  
     - **Plausibility**:  
       - *Strengths*: Balances consequences with fairness/rule-following (e.g., "A rule banning frivolous flights reduces emissions without undue burden").  
       - *Weaknesses*: **Idealization problem** (assumes perfect compliance); may demand too much sacrifice from individuals.  
     - **Licenses Conclusion?**: **Yes**, if the rule is optimal. Binds the individual *because* the rule (if followed) maximizes welfare. Differs from *act* consequentialism.  

  4. **Mutual Reasoning (Kantian/Categorical Imperative: Realm of Ends)**  
     - **Thesis**: When choosing, you must consider your act as setting a precedent for all others in the same position, who are *simultaneously reasoning as you are*.  
     - **Type**: **N** (procedural constraint on reasoning).  
     - **Plausibility**:  
       - *Strengths*: Captures reciprocity and fairness (e.g., voting, tax-paying). Avoids free-riding.  
       - *Weaknesses*: **Assumes symmetric reasoning** (often false in reality); may be too demanding (e.g., "If I skip voting, why can’t everyone?").  
     - **Licenses Conclusion?**: **Yes**, strongly. Binds the individual by requiring they act only on reasons acceptable to all (e.g., "My reason for flying can’t be ‘I’m special’").  

  ---

  #### **II. Where Readings Diverge: Two Test Cases**  

  | Case                          | Prediction Model              | Universalizability (Kant) | Rule Consequentialism       | Mutual Reasoning              |  
  |-------------------------------|-------------------------------|---------------------------|-----------------------------|-------------------------------|  
  | **Harmless Generalization / Wrong Single Act**<br>(e.g., *Ignoring "Keep Off Grass" sign on an empty lawn*) | ✅ Permits act.<br>(No harm if one person) | ⚠️ **May forbid**.<br>(Universal disregard erases meaning of signs) | ✅ Likely permits act.<br>(Best rule: "Obey signs when damage risk exists") | ❌ **Forbids act.**<br>("If all ignore signs when convenient, signs become meaningless") |  
  | **Ruinous Generalization / Harmless Single Act**<br>(e.g., *Tax evasion by one wealthy person*) | ❌ Forbids act.<br>(Collapse if all evade) | ❌ Forbids act.<br>(Universal evasion contradicts taxation’s purpose) | ❌ Forbids act.<br>(Optimal rule requires compliance) | ✅ **Permits act?**<br>*Only if reason isn’t self-exempting* ("I deserve tax cuts" fails universal test) |  

  **Key Insight**:  
  - **Mutual Reasoning** is most restrictive in Case 1 (binds even when harm is absent).  
  - **Prediction Model** is least restrictive in Case 1 but strictest in Case 2.  
  - **Rule Consequentialism** and **Universalizability** align in forbidding Case 2 but diverge in Case 1 if the optimal rule allows exceptions.  

  ---

  #### **III. Verdict: Which Reading "Ends the Argument"?**  
  - **Dominant in practice**: **Mutual Reasoning** (Thesis 4) or **Rule Consequentialism** (Thesis 3).  
    - *Why?* Rhetorically shifts focus from *this act* to **collective fairness/reciprocity**. Forces the actor to defend their *reasons* as universal.  
    - Example: "If everyone flew for conferences, climate costs soar" → Not a prediction, but a challenge: *"Can you justify your reason for flying if all others act on it?"*  
  - **Rarely used**: **Prediction Model** (Thesis 1) – its empirical weakness is obvious in individual cases.  
  - **When it ends debates**: Successfully invokes guilt over free-riding or hypocrisy. Fails if the actor claims their case is non-generalizable (e.g., "I’m the only expert on this topic").  

  **Conclusion**: The retort’s power lies in reframing personal choice as a **test of impartiality**. Its plausibility hinges on whether the context assumes symmetric reasoning (Thesis 4) or an optimal rule (Thesis 3). In policy debates (e.g., travel rules), Thesis 3 prevails; in personal ethics, Thesis 4 dominates.  

  ---  
  *Recommendation for students: Always ask, "Which ‘everyone’ is being invoked? Prediction, consistency, optimal rules, or mutual obligation?"*  

