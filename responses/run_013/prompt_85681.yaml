  ### Revised Activity: "Glyph Sort - The Know-How Paradox"  
  *Total Time: 90 minutes*  
  **Goal:** Make students viscerally experience Ryle's regress, the fragility of know-how, and the propositional articulation gap—without lecturing.  

  ---

  ### **Materials List**  
  1. **Glyph Cards** (Per Student):  
     - **Training Deck (20 cards)**:  
       - *Front*: Simple glyph (e.g., stem at random angle 0-360°, crossbar length 1-5 cm, stem length fixed at 5 cm).  
       - *Back*: "A" or "B" + subtle cue (e.g., A cards on lightly cream stock; B on white).  
       - **Rule**: "A iff crossbar length < 2.94 cm" (≈ stem/1.7). *Ensure visual ambiguity—hard to eyeball*.  
     - **Test Deck (10 cards, Part 2)**: Same glyphs, scrambled stock (no cream/white correlation to A/B).  
     - **Communication Deck (10 cards, Part 1 Pairs)**: Neutral stock (e.g., yellow), same glyph rules.  
     - **Proxy Deck (12 cards, Part 1 Pairs)**: Fresh glyphs, neutral stock.  
  2. **Regress Instruction Cards** (Per Student):  
     - *Text*:  
       > (i) To sort this card, first determine which instruction applies: (a) or (b).  
       > (ii) To determine (a)/(b), consult instruction (iii).  
       > (iii) To consult (iii), run steps (i)-(ii) recursively.  
       > (iv) If recursion loops, use judgment.  
     - **Test Card**: Blank or with a dot (trivial to "sort").  
  3. **Other**: Timers, whiteboard, score sheets, pens.  

  ---

  ### **Phase 1: Skill Acquisition & Communication Breakdown** (30 min)  
  **Goal:** Feel the gap between know-how and articulation.  
  1. **Individual Sorting (15 min)**:  
     - *Task*: Sort 20 training cards. Guess A/B → flip to check → record accuracy.  
     - *Rules*: No notes/talking. Track score (correct/total).  
     - *Outcome*: Most hit 85-95% by end (cue + rule reinforce accuracy).  
  2. **Write the Rule (1 min)**:  
     - "Write your sorting rule in **one sentence**."  
  3. **Pair Proxy Test (14 min)**:  
     - Partner A reads rule aloud. Partner B (no prior exposure) sorts 12 **proxy deck** cards using *only* the rule.  
     - A watches silently, scores B (correct/12).  
     - **Swap roles** with fresh proxy deck.  
     - *Predicted Issue*: Rules are vague ("if crossbar looks short") or wrong. Proxies score near chance (50-60%).  

  ---

  ### **Phase 2: Skill Fragility & Luck** (15 min)  
  **Goal:** Pull the rug out—expose dependence on unacknowledged cues.  
  1. **Reveal & Re-Sort (10 min)**:  
     - *Reveal*: "In your training deck, A cards were cream, B white. This was incidental."  
     - *Task*: Sort 10 **test deck** cards (scrambled stock, same rule). Record score.  
  2. **The Drop (5 min)**:  
     - *Whiteboard Poll*: "Training score >85%? Test score <60%? Raise hands."  
     - *Why*: Stock-trackers collapse; rule-users hold steady.  
     - *Key Q*: "If your reliability relied on a cue you never noticed, did you *ever* know how?"  

  ---

  ### **Phase 3: Rule-Following Regress** (10 min)  
  **Goal:** Stage infinite regress via recursive instructions.  
  1. **Activity (5 min)**:  
     - Hand out regress cards + test card.  
     - "Follow instructions exactly to ‘sort’ this card."  
  2. **Reflection (5 min)**:  
     - Write: "Where did the chain stop? Why?"  
     - *Outcome*: All stop at (iv)—"use judgment." No rules left.  

  ---

  ### **Debrief: Mapping the Chaos** (35 min)  
  **Goal:** Link experiences to theory *after* the storm.  
  1. **Phase 1 Recap (10 min)**:  
     - *Q*: "Why did your proxy fail? Could your sentence capture your skill?"  
     - *Map to Ryle*: Know-how isn’t reducible to know-that—articulation fails ("intellectualist legend" crumbles).  
  2. **Phase 2 + Luck (10 min)**:  
     - *Q*: "If you aced training but bombed the test, did you *know how*? Or was it luck?"  
     - *Map to epistemology*: Environmental luck (Gettier for skills)—reliability isn’t knowledge if easily defeated.  
  3. **Phase 3 + Regress (10 min)**:  
     - *Q*: "Why did the instructions force you to use judgment? What’s the alternative?"  
     - *Map to Ryle’s regress*: If know-how requires rules, you need rules to apply rules → infinite regress. Judgment stops it.  
  4. **Synthesis (5 min)**:  
     - *Whiteboard*:  
       - Know-how: Felt in Phase 1, shattered in Phase 2, foundational in Phase 3.  
       - Intellectualist escape? "You knew *that* cream = A!" → But did you? And what about rule-users?  
       - Perceptual learning? A tacit skill beyond propositions.  

  ---

  ### **What Can Go Wrong & Fixes**  
  1. **Phase 1: Rule too easy?**  
     - *Fix*: Use a nonlinear rule (e.g., "A iff crossbar < stem/1.7 + 0.2*sin(angle)"). Glyphs must be complex enough to resist verbalization.  
  2. **Phase 2: No one uses the cue?**  
     - *Fix*: Amplify cue salience (e.g., add a faint odor to A cards). In debrief, contrast cue-users vs. rule-users.  
  3. **Phase 3: Students skip instructions?**  
     - *Fix*: Emphasize: "Follow steps *literally*. No shortcuts!"  
  4. **Timing**:  
     - *Buffer*: Shorten Phase 1 individual sort to 15 cards if behind.  

  ---

  ### **What This Can’t Show**  
  - **Intellectualist Redescription**: They’ll argue skill was "tacit propositions" (e.g., "knew *that* cream = A"). The luck phase *does* bite: If the cue was unknown, was it *knowledge*? But it doesn’t refute them—just makes their view clunky.  
  - **Ryle vs. Rule-Following Regress**: The activity *can* keep them distinct:  
    - **Ryle’s regress** (Phase 3) targets reduction of know-how to rules.  
    - **Articulation gap** (Phase 1) attacks reduction to *propositions*.  
    Debrief them separately to avoid conflation.  

  **Why It Works**: Students *feel* the regress when instructions collapse into judgment, *taste* luck when their skill disintegrates, and *fumble* articulating know-how. The intellectualist survives—but limping.  

  **Final Tip**: Run the glyph rule yourself first—ensure visual ambiguity. Use thick paper for subtle stock cues.
