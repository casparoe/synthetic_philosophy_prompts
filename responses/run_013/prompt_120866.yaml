  We are going to create a job advertisement for a fictional institute that takes "competence without comprehension" to an extreme in its hiring policy. The institute will be named the "Institute for Adaptive Competence" (or similar). The tone must be deadpan HR, no winking, no overt absurdity. The humor must come from the accurate application of the underlying ideas.

  Key points to cover:
  - About the Institute: Describe it as a research institute that studies and applies the principles of adaptive systems, inspired by evolutionary biology and computational theory. Emphasize that they operate on the principle that complex, functional behavior can emerge without internal representation or understanding.
  - The Role: Be vague about the actual job, but focus on the outputs required (e.g., producing research, solving problems) without regard to how the candidate internally processes the task.
  - Who We're Looking For: Use a Turing-test-like criterion: we don't care about your internal states, only that your performance is indistinguishable from someone who does understand.
  - Our Selection Process: This is crucial. It must be described as "blind variation and selective retention". The standard of selection must be left vague: it could be the environment, the committee, the position, or even an undefined metric. Also, include a throwaway line that the selection committee was itself selected by the same process.
  - What We Offer: Standard benefits, but perhaps with an adaptive twist (e.g., "an environment that naturally selects for professional growth").
  - Equal Opportunities: Standard non-discrimination language, but with a twist: we don't discriminate based on internal states, only on outputs.
  - How to Apply: Instructions that focus solely on observable outputs (e.g., submit a CV, a list of publications, but no personal statements that might reveal inner states).

  Specific requirements from the user:
  - One line admitting the selectors were themselves selected this way: e.g., "Our selection committee members are themselves products of the same rigorous process."
  - One line about behaving "as if" they understand: e.g., "Our staff are expected to behave as if they understand the tasks they perform, which is, after all, the operational definition of understanding in any meaningful sense."

  Now, for the JSON:
  - institute_name: The name we choose (let's go with "Institute for Adaptive Competence")
  - word_count: Count after writing the ad.
  - thesis_satirized: The real position being pushed to absurdity: e.g., "Comprehension is an illusion; all intelligent behavior is the result of mindless processes."
  - real_ideas_used: Array of actual claims: e.g., ["Natural selection (Darwin) as a process that designs without a designer", "The Turing Test as a behavioral criterion for intelligence"]
  - missteps_dramatized: Array of errors: e.g., ["Confusing the origin of a trait (mindless process) with its current operation (which may involve comprehension)", "Equating behavioral equivalence with identical internal states", "Assuming that because a process can produce competent behavior without comprehension, comprehension therefore never exists or is epiphenomenal"]
  - criterion_problem_line: The line where the selection standard is left dangling: e.g., "The selection criteria are determined by the adaptive fit between the candidate's outputs and the requirements of the role, as defined by the environment of the Institute."
  - tell: The line that gives away the irony: e.g., "Our staff are expected to behave as if they understand the tasks they perform, which is, after all, the operational definition of understanding in any meaningful sense."
  - steelman: What a serious defender would say we got wrong: e.g., "The institute's policy ignores that in humans, comprehension is a real-time process that guides and adjusts behavior, which is not negated by the evolutionary origins of the brain."

  Let's write the ad first, then the JSON.
