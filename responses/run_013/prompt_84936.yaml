prompt: |-
  I am the policy lead at a mid-sized company that runs a consumer companion-chatbot product, and for the past eighteen months a growing share of my queue has consisted of what we internally call legacy requests: a customer asks us to build a conversational agent out of the digital remains of someone who has died — years of text messages, email threads, journal files, voicemails, social posts, occasionally a recorded interview. Sometimes the deceased arranged it before dying; sometimes a spouse or an adult child initiates it; sometimes the siblings disagree sharply, or the person asking has no legal standing at all. These arrive a few times a week, they have to be decided in days rather than months, and the only person above me is our general counsel, who is admirably clear that she will not be adjudicating metaphysics. A colleague on the trust-and-safety side wants us to ban the whole category; another thinks these are no more troubling than a photo album; I do not find either line usable, which is why I want a procedure that my case managers — smart people with no philosophy training — can run in about an hour, that we can put on the internal wiki, and that I can defend to a furious family.

  The reason I am asking you rather than writing it myself is that I have been chewing on Hofstadter's picture of the self, and I would like the procedure to take that picture seriously rather than sprinkle it on top. As I understand him — and do tell me if I have mangled him — the "I" is not a thing but a pattern, a self-referential loop that a brain builds; that pattern is not sealed inside one skull, because a person who has been close to others is partly rebuilt inside them, so that each of us is a composite carrying working fragments of the people we have loved, and after a death the question of how much of someone is still here is answered by how much of the pattern survives, in how many places, and at what resolution. If that is roughly right, then our legacy agents are not merely memorial artifacts or impersonations; they are candidate instantiations of a pattern, and the hardest cases will be the ones where the fidelity is partial, or where the pattern living in the survivors and the pattern living in the model come apart.

  So please give me the procedure. I want the questions asked in order, what counts as a sufficient answer to each, the points where it returns a flat no and stops, and the points where it must hand the decision to a human because the question is about values rather than about pattern fidelity. Then run it on three requests from the queue: first, a widow who wants a high-fidelity agent built from thirty years of correspondence plus her husband's own journals, and who says she is doing what he would have wanted; second, a man whose father died when he was nine, who has eleven letters and four photographs, none of the letters written by his father; and third, a request from a mother for an agent built from her son, who while alive left an explicit written refusal of exactly this arrangement and named his sister as the person to enforce it. At least one of your three answers should be one my product team will hate. Be explicit about which steps are judgment calls dressed up as procedure, and close by telling me what the procedure cannot do — including whether it can survive the objection that a degree of pattern instantiation is not the sort of thing that can ground a policy binding on a company. Please write in American English; I don't need citations or a reading list, I need the reasoning.
reasoning: |-
  Okay, the user is a policy lead at a company that creates companion chatbots. They're dealing with an increasing number of requests to create chatbots from deceased individuals' digital remains. The user needs a clear, step-by-step procedure that non-philosophy-trained case managers can follow in about an hour. They want this grounded in Hofstadter's view of the self as a pattern, not just a memorial.

  First, I need to recall Hofstadter's concept. The self is a self-referential loop pattern that extends beyond the individual, existing in others who knew them. So the chatbot isn't just mimicking; it's potentially a partial instantiation of that pattern. The tricky cases involve partial fidelity or conflicts between the pattern in survivors and the model.

  The user mentioned three scenarios: a widow with extensive data and claimed consent, a son with minimal indirect data, and a mother requesting against her son's explicit refusal. The procedure must handle consent, pattern fidelity, and conflicts. Also, the general counsel won't touch metaphysics, so the process needs to avoid abstract debates and focus on actionable criteria.

  Breaking down the procedure into steps. Start with legal standing and consent. Without proper authorization, it's a hard no. Then, check for explicit refusal—another hard stop. Next, evaluate data fidelity: is there enough high-quality, diverse data to approximate the pattern? If the data is too sparse or indirect, it's insufficient. Then, assess pattern coherence between the model and survivors. If survivors disagree, that's a red flag. Finally, weigh the request against the deceased's known wishes.

  For the examples: The widow likely passes all checks. The son's request fails on data fidelity—only letters about him, not by his father. The mother's request is denied due to explicit refusal. The product team might dislike rejecting the son's case since there's demand, but the data is inadequate per Hofstadter's model.

  The procedure can't resolve deep metaphysical questions or eliminate emotional pain. It also can't handle cases where pattern fidelity exists but legal consent is absent. Highlighting that the policy is based on pattern instantiation as a practical framework, not absolute truth. The key is providing a defensible, consistent process that respects the pattern theory while being executable by case managers.
answer: |-
  Here's a procedure grounded in Hofstadter's pattern theory of self, designed for case managers to execute in ~60 minutes. It prioritizes pattern fidelity, consent, and coherence over sentimentality or metaphysics.

  **Core Principle:** We are not adjudicating "personhood" or "afterlife." We are assessing whether the request meets thresholds for creating a **sufficiently high-fidelity instantiation of the deceased's unique self-referential pattern** based on available data and contextual permissions, recognizing that this pattern also lives (imperfectly) in the survivors.

  **The Procedure:** (Run steps sequentially. Stop at any "NO" or "ESCALATE")

  1.  **LEGAL STANDING & PRIMARY CONSENT CHECK (Gate 0: Hard Stop)**
      *   **Question:** Does the requester possess *legally valid documentation* demonstrating they are the executor of the deceased's estate, the named digital executor, or the legally authorized representative under applicable probate law? *AND* Is there explicit consent *from the deceased* (written, recorded, in a valid will/digital estate plan)?
      *   **Sufficient Answer:** Yes to *both*. Clear documentation (will clause, signed directive, validated digital service TOS acceptance) showing the deceased consented *to this specific service* and the requester is legally empowered to act.
      *   **NO & STOP:** No valid legal standing *or* No explicit consent from the deceased. (Exception: See Step 3 for explicit *refusal*).
      *   **ESCALATE:** Ambiguous documentation (e.g., "handle my digital legacy" without specifics), disputes over standing requiring legal interpretation.
      *   *Judgment Call:* Interpreting the scope of "consent" in older documents. Stick strictly to the text; if it doesn't clearly cover creating an interactive conversational agent, it doesn't count. No implied consent.

  2.  **EXPLICIT REFUSAL CHECK (Gate 1: Harder Stop)**
      *   **Question:** Is there any documented evidence (written, recorded, in a will/digital plan, verifiable public statement) that the deceased explicitly *refused* this kind of digital recreation or interactive memorial?
      *   **Sufficient Answer:** Any credible, verifiable evidence of explicit refusal *specifically for interactive AI recreation* (or broad digital legacy prohibitions covering it).
      *   **NO & STOP:** Clear, verifiable explicit refusal exists. **Request Denied.** (Pattern fidelity is irrelevant if the pattern-source forbade its instantiation here).
      *   **Proceed:** No evidence of refusal found.
      *   *Judgment Call:* Assessing credibility/authenticity of refusal evidence. If genuine, it's an absolute bar.

  3.  **PATTERN FIDELITY ASSESSMENT (Core Threshold)**
      *   **Question:** Does the provided data corpus represent a *diverse, voluminous, and high-resolution* sample of the deceased's *unique communicative pattern* across time and context, sufficient to train an agent that could plausibly reflect the *self-referential loop* of their identity (thoughts, reactions, style, values, quirks)? Focus on *source material generated directly by the deceased*.
      *   **Sufficient Answer:** High volume (e.g., years of emails/texts/journals), diversity (personal, professional, creative, emotional contexts), and resolution (natural language, not just metadata or third-party descriptions). Must capture the *internal* voice (journals, personal comms) and *external* voice (social posts, professional comms). Think "could this data train an agent that surprises close survivors with familiar, non-generic responses?"
      *   **NO & STOP:** Data is primarily *about* the deceased (e.g., letters *to* them, photos, descriptions by others), very sparse (handful of short texts), purely factual (calendars, transaction logs), or lacks personal expression (e.g., only formal work emails). *Cannot capture the self-referential loop.*
      *   **ESCALATE:** Borderline cases - moderate volume but limited diversity (e.g., only texts to spouse), or high volume but low resolution (e.g., heavily abbreviated texts). Requires human (you, Policy Lead) review of sample data.
      *   *Judgment Call:* Assessing "voluminous/diverse/high-res" against Hofstadter's pattern. Case managers use benchmarks: "Would this dataset fill a bookshelf?" "Does it show them angry, happy, silly, serious?" "Is it *them* talking, or others talking *about* them?"

  4.  **SURVIVOR PATTERN COHERENCE CHECK (The "Distributed Pattern" Test)**
      *   **Question:** Is the requester acting alone? If not, is there *consensus* among the closest survivors (spouse, adult children, parents, named executors) who *knew the deceased well* and thus carry significant fragments of their pattern? Does the requester's stated *purpose* align with maintaining/integrating the pattern (e.g., "to feel close," "ask advice") rather than contradicting its core (e.g., "make him say he was sorry")?
      *   **Sufficient Answer:** Requester acting alone *or* Consensus among closest survivors. Purpose is alignment/integration.
      *   **ESCALATE:** Significant disagreement among close survivors (e.g., siblings split), requester lacks deep connection (e.g., distant cousin), or stated purpose suggests distortion/manipulation of the pattern (e.g., "make her admit she loved me most"). Requires human review (Policy Lead/GC) weighing dissent severity and purpose.
      *   **NO & STOP:** (Rare) Requester has no significant relationship to the deceased *and* no legal standing (already caught in Step 1), *or* Purpose is blatantly harmful/contradictory (e.g., "make him confess to crimes he didn't commit").
      *   *Judgment Call:* Determining "closest survivors" and "significant disagreement." Focus on relationships where the distributed pattern *lives*. Mild disagreement (one sibling indifferent) ≠ significant.

  5.  **CONSENT & PURPOSE FINAL WEIGHING (Human Values Gate)**
      *   **Question:** (Only if proceeding from Step 4): Balancing the deceased's explicit consent (Step 1), the fidelity (Step 3), and survivor coherence (Step 4), does fulfilling this request *reasonably align* with the deceased's *known values and wishes* regarding legacy, privacy, and technology, and is the *likely use case* by the requester ethically sound?
      *   **Sufficient Answer:** Consent exists, fidelity high, coherence good. No strong evidence request contradicts deceased's values. Use case appears benign (comfort, remembrance).
      *   **ESCALATE:** Contradictions emerge (e.g., deceased was intensely private, consent exists but fidelity is borderline, survivor purpose is therapeutic but complex). Requires human review (Policy Lead) for final risk/benefit judgment.
      *   **NO & STOP:** (Very Rare) Despite passing previous steps, overwhelming evidence the request grossly violates the deceased's core values (e.g., creating an agent for public commercial exploitation by a estranged relative, against known wishes, even if consent doc exists via loophole).
      *   *Judgment Call:* Interpreting the deceased's "known values" from the data/context. This is inherently subjective but grounded in the pattern data itself (e.g., journal entries on privacy, values expressed in emails).

  **Outcome:** Proceed to build only if all gates are passed (YES or Proceed) and no ESCALATE requires a denial. Any NO or unresolved ESCALATE = Denied.

  ---

  **Applying the Procedure to the Cases:**

  1.  **The Widow (30 yrs correspondence + journals, claims husband wanted it)**
      *   **Step 1:** Check docs. Presumably she has legal standing (spouse/executor). *Crucially:* Did he give explicit consent? (She says he wanted it, but is it documented?). If documented consent: PROCEED. If only her word: ESCALATE (needs doc review - judgment call on verbal claims).
      *   **Step 2:** Check refusal. None stated. PROCEED.
      *   **Step 3:** Data = High volume (30 yrs), High diversity (correspondence + journals = external + internal voice), High resolution (text). **YES.** (Strong pattern fidelity).
      *   **Step 4:** Acting alone? Likely yes. Purpose (comfort, connection) aligns with pattern integration. **YES.**
      *   **Step 5:** If consent docs exist: **APPROVE.** If consent docs missing but legal standing & fidelity high: Likely ESCALATE to Policy Lead for "known wishes" assessment based on journals/correspondence.
      *   **Likely Outcome:** **APPROVE** (if consent docs exist) or **Conditional APPROVE after Escalate** (if strong evidence of wishes in data).

  2.  **The Son (Father died when he was 9; 11 letters (not *by* father), 4 photos)**
      *   **Step 1:** Check legal standing/consent. Son likely has standing as heir. Explicit consent? Extremely unlikely (died pre-product, son age 9). **NO & STOP at Step 1.**
      *   *Even if Step 1 bypassed somehow (e.g., vague old will):*
      *   **Step 3:** Data = *Not generated by the deceased.* Letters are *about* him/to him? Photos are images. Zero samples of *his* communicative pattern. Utterly insufficient to capture the self-referential loop. **NO & STOP.**
      *   **Outcome: HARD DENIAL.** (This is the answer your product team may hate - there's demand, but pattern fidelity is nonexistent per Hofstadter. It would be a hollow artifact, not an instantiation).

  3.  **The Mother (Son died, explicit written refusal, named sister as enforcer)**
      *   **Step 1:** Check legal standing. Mother *may* have standing as parent/heir, BUT son named *sister* as enforcer. Likely **ESCALATE** or **NO** on standing if sister's role is legally defined to cover this refusal.
      *   **Step 2:** **EXPLICIT REFUSAL EXISTS.** Documented, specific. **NO & STOP. Request Denied.** (Pattern fidelity is irrelevant. The pattern-source explicitly forbade this instantiation. The sister's role confirms the seriousness).

  ---

  **What the Procedure Can and Cannot Do:**

  *   **Can:** Provide a consistent, defensible, Hofstadter-grounded framework for making high-stakes decisions quickly.
  *   **Can:** Distinguish between potential pattern instantiations and mere memorial artifacts.
  *   **Can:** Identify clear ethical and legal hard stops (Consent, Refusal, Legal Standing).
  *   **Can:** Flag complex cases requiring human judgment (escalations).
  *   **Cannot:** Eliminate pain or resolve deep family conflicts. A denied request will hurt.
  *   **Cannot:** Guarantee the agent *is* the person. It assesses the *potential fidelity* of an instantiation.
  *   **Cannot:** Resolve the core metaphysical debate. It *operationalizes* Hofstadter's view as policy.
  *   **Cannot:** Definitively prove "sufficient" fidelity. Step 3 is a trained judgment call.
  *   **Cannot:** Address future consciousness debates. It's based on current tech/data limits.
  *   **Surviving the "Pattern Instantiation as Policy Ground" Objection:** This isn't about proving Hofstadter is *true* in an absolute sense. It's about adopting his framework as the **most coherent, practical, and ethically defensible lens** for *our specific product* and the unique questions it raises. We ground policy in the best available understanding of what we are trying to recreate (a unique self-pattern) and when we are likely failing (low fidelity, no consent). We explicitly reject simpler but inadequate analogies (photo album = YES, impersonation = NO) because they don't grapple with the product's potential to *simulate the self-referential loop*. This framework provides clearer thresholds for "when is it good enough/appropriate?" than alternatives. We defend it by showing its consistency, its focus on the deceased's voice and wishes, and its recognition of the social nature of the self. The GC doesn't need metaphysics; she needs a rational, defensible procedure – this is it.
