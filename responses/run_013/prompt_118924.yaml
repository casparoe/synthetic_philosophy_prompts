answer: |-
  Here’s a reading of *The Tempest* through Aristotle’s theory of natural slavery, adhering to your constraints. The play doesn’t merely illustrate or refute Aristotle; it *embodies* the tensions in his doctrine, exposing its psychological and political contradictions through dramatic action. Crucially, it demolishes the theory not by moralizing but by dramatizing Caliban’s irreducible humanity.

  ### **Where Aristotle’s Theory Finds Strongest Footing**
  1. **Prospero’s Justification (Act 1, Scene 2)**  
     Prospero’s claim that Caliban is “a born devil, on whose nature / Nurture can never stick” mirrors Aristotle’s “living tool” (*Politics* 1254a): an entity whose purpose is service, incapable of ethical development. Prospero’s rule is framed as benevolent stewardship: he “took pains to make [Caliban] speak” and claims his enslavement is for Caliban’s own good (protection from his own “vile race”). Caliban’s attempted rape of Miranda is cited as proof of his incorrigible nature—akin to Aristotle’s claim that natural slaves lack *boulētikon* (deliberative faculty).

  2. **Caliban’s “Eagerness to Serve” (Act 2, Scene 2; Act 3, Scene 2)**  
     Caliban’s submission to Stephano (“I’ll kiss thy foot. I’ll swear myself thy subject”) appears to validate natural slavery: he seeks a master spontaneously. Aristotle might argue this reveals an innate need for external guidance. Caliban’s plot to overthrow Prospero isn’t framed as liberation but as swapping one master for another—suggesting his nature demands subjugation.

  ---

  ### **Where the Play Explodes the Theory**
  The demolition occurs not in abstract debate but in *Caliban’s dramatic presence*—his actions, language, and relationships expose Aristotle’s psychological contradictions.

  1. **The Psychological Fault Line: Reason Where None Should Exist**  
     - **Language and Reflection (Act 1, Scene 2):** Caliban’s eloquence (“You taught me language, and my profit on’t / Is, I know how to curse”) demonstrates *deliberation*. He uses reason instrumentally (cursing as “profit”) and reflectively (recognizing linguistic manipulation). Aristotle’s slave, devoid of *logos*, cannot do this.  
     - **Aesthetic and Spiritual Capacity (Act 3, Scene 2):** Caliban’s “isle is full of noises” speech reveals an inner life rich with sensory and imaginative depth. His connection to the island’s beauty transcends utility—contradicting the “living tool” definition.  
     - **Political Strategy (Act 3, Scene 2):** His plot with Stephano and Trinculo isn’t mindless obedience but tactical reasoning: exploiting their greed, targeting Prospero’s books, timing the revolt. Aristotle’s natural slave cannot apprehend complex plans requiring *boulēsis* (rational desire).

  2. **The Origin of Servitude: Force and Crime**  
     Caliban’s enslavement is explicitly punitive (“For this, be sure, tonight thou shalt have cramps”) and founded on conquest (“This island’s mine by Sycorax my mother / Which thou tak’st from me”). Aristotle condemns such slavery as potentially unjust (*Politics* 1255a), distinguishing it from natural hierarchy. Prospero’s inability to prove Caliban’s *innate* inferiority—beyond citing the rape attempt—reveals the theory’s circularity: servitude is justified by the slave’s nature, but nature is inferred from servitude. The play forces us to ask: Is Caliban’s “nature” intrinsic, or shaped by dispossession?

  3. **The Virtue Paradox**  
     Aristotle grants slaves “a kind of moral virtue” (*Nicomachean Ethics* 1260a) but denies them reason. Caliban, however, displays proto-virtues Aristotle reserves for the rational: loyalty to his gods (Setebos), courage in rebellion, and even a twisted sense of justice (“I must obey; his art is of such pow’r”). His capacity for gratitude (“Thou strok’st me… I loved thee”) and betrayal implies moral agency—undermining the slave’s supposed psychological incompleteness.

  ---

  ### **What the Play Shows That Argument Cannot**
  *The Tempest* reveals that **natural slavery is a performative contradiction**. Prospero *declares* Caliban subhuman but *interacts* with him as a rational adversary. Every curse, plot, and poetic utterance from Caliban demonstrates the reason Prospero denies him. The theory collapses under the weight of its own psychological requirements:  
  - **Inheritance vs. Nature**: Caliban’s claim to the island (“This island’s mine”) introduces a political counter-narrative. Aristotle’s natural slave has no claim to property; Caliban’s assertion of ownership destabilizes Prospero’s “natural” authority.  
  - **Punishment as Masking Injustice**: The rape accusation serves as Prospero’s *ex post facto* justification for theft. The play suggests that “natural” slavery is often a myth crafted to sanitize conquest.  
  - **The Master’s Dependence**: Prospero needs Caliban’s labor to survive (“We cannot miss him”). Aristotle’s master is wholly self-sufficient; Prospero’s reliance on Caliban exposes the fiction of natural hierarchy.  

  **Conclusion**: *The Tempest* demolishes Aristotle’s theory **by embodying its failure in the relationship between Prospero and Caliban**. The doctrine fractures not on moral grounds (though injustice is evident) but because Caliban’s actions persistently manifest the rational capacities he is purported to lack. The play shows that **the “natural slave” is a category that cannot cohere in practice**—when dramatized, it reveals either a rational being (contradicting the theory) or a dehumanized projection of the master’s anxiety (exposing the theory as ideology). Aristotle’s distinction between natural and legal slavery crumbles because Caliban is both: his servitude begins in force but is rationalized as nature, and the play proves these cannot be separated. What survives of Aristotle is not his psychology but his insight that *all justifications of domination risk self-deception*—a lesson Prospero learns only by relinquishing control.
