prompt: |-
  Okay, I've been going down a rabbit hole on this Kelly betting stuff and I want to figure out what I actually believe, because my gut keeps giving me answers that dont obviously fit together.

  The setup: someone offers you a bet where you win or lose a fixed fraction of your current bankroll, the odds are in your favor, and you get to repeat it over and over. My gut says bet some fixed fraction of your roll each time, never all of it, even though every single bet has positive expected value. And I get the reason — a friend explained it as: if you bet everything, your wealth over the rounds gets multiplied by a string of numbers, and it's the average of the logs that compounds, so the typical path goes broke even though the average across all possible worlds is enormous. Fine, I'm on board with sizing down here. I even looked up the formula, and for a 60/40 even-money bet it says stake 20% of your roll.

  But then my gut gets weird on these:

  1. A single favorable bet, offered once and only once, ever — 60/40, even money. My gut says take it, and honestly take a big swing, since I'm never getting another shot. But that's backwards from the repeatable case, right? If anything I'd figure the repeatable one is where I can be aggressive, because it averages out over time, and the one-shot is where I should be careful. Instead I'm cautious on the repeatable one and bold on the one-shot.

  2. A bet that wins big with 99% probability but wipes me out with 1%, offered once. My gut says no, even though the expected value is clearly positive. Feels like the ruin thing again, but there's no repetition here, so I dont know why I care.

  3. Insurance. I'll happily pay a premium that's higher than the expected loss to protect against a catastrophe, and it feels smart. But that's a negative-EV bet, so it seems to cut against taking the positive-EV one-shot in case 1.

  4. Two favorable independent bets available at the same time. My gut says bet both, with a smaller stake on each than I'd use for either alone. No idea if that's principled or just nerve.

  5. A tiny edge — 51/49, even money, repeatable. My gut says stake small but positive, roughly in proportion to the edge.

  6. A friend says he always bets half of whatever the formula says, for safety. Is that principled, or just jitters?

  So what I want: is there one principle that gets all of these, or close? And does the one-shot/repeatable distinction actually do any work in it, or am I just telling myself a story? Also, my friend claims the same logic applies to anything you can 'bet' over and over — your beliefs, how much effort you put in, even how happy you let yourself be — and that the right rule is to maximize the geometric mean of whatever it is, not the arithmetic mean. Does that generalization actually follow from the money case, or is it a different claim wearing the same clothes?

  Finally, tell me which of my verdicts I should give up if I want a clean principle, and what the principle says about a case I haven't listed.
reasoning: |-
  Okay, the user is deep into Kelly betting and has these conflicting gut feelings across different scenarios. Let me unpack this step by step.

  First, I notice they're wrestling with the tension between one-shot bets versus repeated bets. Their intuition says go big on a single favorable bet but be cautious when it's repeatable. That makes sense because ruin risk compounds over time. The geometric mean growth rate explains why repeated bets need smaller sizing - avoiding ruin is mathematically crucial for long-term growth. 

  For the 99% win chance with 1% ruin risk, their aversion aligns with expected utility theory. Losing everything has catastrophic utility impact even if improbable. Kelly would reject this bet entirely since the fraction formula gives negative values. Insurance being a negative EV bet that feels smart is actually consistent - it's about reducing variance in outcomes when the loss would be devastating. 

  The two simultaneous bets case is interesting. Their instinct to split stakes matches modern portfolio theory - diversification reduces risk. The math shows sizing down each bet while keeping total exposure similar to a single bet scenario. 

  The tiny edge case confirms their intuition. Kelly fraction scales with edge size (f* = p - q here), so proportional staking makes sense. As for their friend betting half-Kelly - that's actually rational! Half-Kelly gives 75% returns with much lower volatility. 

  Where they might need adjustment: the single favorable bet. Expected utility theory would still cap the bet size based on risk aversion. Logarithmic utility would suggest betting 20% just like repeated Kelly - the math is identical for one-shot if you value wealth logarithmically. 

  The generalization beyond money? That's profound. Maximizing geometric mean applies to any repeated decision where outcomes compound multiplicatively. But for additive outcomes (like happiness moments), arithmetic mean matters more. The key is whether "wins" multiply or add. 

  New example test: a 70% chance to double money, 30% lose all. Kelly says f* = (0.7*1 - 0.3*1)/1 = 0.4. Logarithmic utility agrees for one-shot. But if bankruptcy means permanent exclusion from future opportunities, even 40% might be too aggressive - that's where their insurance intuition kicks in again. 

  Ultimately their conflicting intuitions reveal different mental models at work: probability weighting for rare events, loss aversion, multi-period compounding. Kelly unifies most cases but doesn't capture all psychological biases. Expected utility with logarithmic function is the deeper principle - and it explains both repeated and single bets coherently.
answer: |-
  You've hit on a fundamental tension in decision theory! Your intuitions reveal different mental models at play. The unifying principle is **maximizing the expected logarithm of wealth** (or "geometric mean growth"). This is the core of Kelly Criterion and its generalizations. Let's break it down:

  **The Core Principle: Expected Logarithmic Utility**
  *   **Why Log Wealth?** Your wealth compounds multiplicatively over time. The logarithm transforms multiplicative growth into additive growth. Maximizing the expected log wealth maximizes the *long-term geometric growth rate* of your wealth.
  *   **What it Does:**
      *   Automatically sizes bets to avoid ruin (log(0) → -∞, so any risk of ruin gets infinite negative weight).
      *   Balances seeking growth with avoiding excessive risk.
      *   Captures risk aversion proportional to current wealth (losing 10% hurts the same log-wise whether you have $100 or $10,000).
  *   **The Formula (Simple Even-Money Bet):** `f* = p - q`, where `p` = win probability, `q` = loss probability (1-p), `f*` = fraction of bankroll to bet. (For your 60/40: `f* = 0.60 - 0.40 = 0.20`).

  **Analyzing Your Cases:**

  1.  **Single Favorable Bet (60/40, one-shot):**
      *   **Your Gut:** Bet big.
      *   **Expected Value (EV) Maximizer:** Bet everything (or as much as allowed), since EV is positive.
      *   **Log Utility Maximizer:** Bet `f* = 20%`. Why? While it's a single bet, maximizing `E[log(wealth)]` still applies. Betting 100% gives `E[log] = 0.6*log(2) + 0.4*log(0) = -∞`. Betting 20% gives `E[log] = 0.6*log(1.2) + 0.4*log(0.8) ≈ 0.6*0.1823 + 0.4*(-0.2231) ≈ 0.1094 - 0.0892 = 0.0202`, which is positive and finite. Betting *more* than 20% reduces `E[log]`.
      *   **Resolution:** Your "bet big" intuition is driven by EV maximization ("never get another shot"). Log utility says *be cautious even in one-shot bets* because the disutility of losing a large fraction is severe. **Give up "bet big" for one-shot.** The repeatable case forces caution; the one-shot case *should* also induce caution proportional to the risk of loss. Log utility provides the consistent principle.

  2.  **99% Win Big / 1% Ruin Bet (One-shot):**
      *   **Your Gut:** No. Feels like ruin risk.
      *   **EV Maximizer:** Yes! Huge positive EV (e.g., win 100x stake: `EV = 0.99*100 + 0.01*(-1) = 99 - 0.01 = 98.99`).
      *   **Log Utility Maximizer:** **NO.** `f* = p - q/b` (General Kelly). `p=0.99`, `q=0.01`, `b`=win multiple (e.g., 100). `f* = 0.99 - (0.01 / 100) = 0.99 - 0.0001 = 0.9899`. But wait! This assumes fractional betting *is allowed*. If the bet requires staking your entire bankroll (or staking an amount where loss implies ruin), then `f=1`. `E[log] = 0.99*log(101) + 0.01*log(0) = -∞`. Log utility demands you **never take a bet with *any* risk of total ruin**, as the penalty is infinite.
      *   **Resolution:** Your gut is correct. Log utility explains why: ruin is catastrophic. The repeatable case makes ruin *eventually certain* with reckless sizing; the one-shot case makes ruin *immediately possible*. Both are unacceptable under log utility. EV maximization fails catastrophically here.

  3.  **Insurance (Negative EV):**
      *   **Your Gut:** Pay the premium. Feels smart.
      *   **EV Maximizer:** Never pay more than expected loss.
      *   **Log Utility Maximizer:** **Pay the premium (sometimes).** Log utility is highly sensitive to large losses. If insurance protects against a loss that would significantly reduce your wealth (or cause ruin), paying a moderate negative EV premium *increases* `E[log(wealth)]` by reducing the variance and protecting against catastrophic outcomes. It's about preserving capital to participate in future positive-EV opportunities or avoid ruin. The size of the acceptable premium depends on the loss size and probability.
      *   **Resolution:** Your gut is correct in context. Log utility explains it as rational risk management, not irrational fear. It complements the aversion to ruin in cases 1 & 2.

  4.  **Two Favorable Independent Bets (Same Time):**
      *   **Your Gut:** Bet both, smaller stake on each.
      *   **EV Maximizer:** Bet full Kelly on each independently (might exceed 100% bankroll!).
      *   **Log Utility Maximizer:** **Bet both, but size each *smaller* than if it were the only bet.** The optimal fraction for each bet `i` in a portfolio is found by solving a system of equations considering their joint outcomes (covariance matters!). Intuitively, diversification reduces overall risk. If the bets are identical and independent, the optimal fraction per bet is *less* than the single-bet Kelly fraction. The *total* amount bet is usually close to the single-bet Kelly fraction, but split. E.g., Two identical 60/40 bets: optimal `f*` per bet might be ~12-15%, total exposure ~24-30% (vs. 20% for one bet).
      *   **Resolution:** Your gut is correct and principled. Log utility applied to portfolios demands diversification and correlated risk adjustment. Betting full Kelly on both ignores correlation and overexposes you.

  5.  **Tiny Edge (51/49, Repeatable):**
      *   **Your Gut:** Stake small, positive, proportional to edge.
      *   **EV Maximizer:** Bet something positive.
      *   **Log Utility Maximizer:** `f* = p - q = 0.51 - 0.49 = 0.02` (2%). Exactly proportional to the edge.
      *   **Resolution:** Your gut is correct and directly matches the Kelly Criterion.

  6.  **Friend Bets Half-Kelly:**
      *   **Your Gut:** Is it principled or jitters?
      *   **Log Utility Maximizer:** **It's Principled (Fractional Kelly).** Betting `f*` maximizes long-term growth *rate*. Betting `c * f*` (where `0 < c < 1`) is called "Fractional Kelly". It sacrifices *some* growth rate (`Growth ≈ r - (f*^2 * σ^2) / (2 * (1 + c))` where `r` is max growth rate) for *significantly* reduced volatility (`Volatility ≈ c * σ`). Half-Kelly (`c=0.5`) achieves about 75% of the max growth rate with only 50% of the volatility. This is often optimal for real-world investors who dislike large drawdowns or have uncertain edge estimates.
      *   **Resolution:** Your friend is prudent. Half-Kelly is a common, sensible strategy balancing growth and risk.

  **The One-Shot/Repeatable Distinction:**

  *   **It does work, but Log Utility unifies them.** In the repeatable case, maximizing `E[log(wealth)]` *directly* maximizes the long-run compounded growth rate. In the one-shot case, maximizing `E[log(wealth)]` maximizes the *risk-adjusted utility* of the outcome for someone whose utility is logarithmic in wealth. The principle is the same: optimize the log. The repeatable case simply highlights the compounding consequence more dramatically.

  **Your Friend's Generalization:**

  *   **It Depends.** The Kelly principle (max geometric mean) applies *whenever outcomes compound multiplicatively over repeated "bets" or decisions*.
      *   **Money/Bankroll:** Yes, clearly.
      *   **Effort/Resources:** If investing effort/resources in opportunities where returns (e.g., knowledge, contacts, projects) *multiply* future opportunities, then maximizing the geometric mean growth rate of your "resource base" makes sense. (e.g., diversifying research projects).
      *   **Beliefs (Bayesian Updating):** Yes! Updating beliefs multiplicatively (Bayes' Theorem) is the poster child for logarithmic scoring rules and maximizing geometric mean accuracy. Betting your beliefs optimally uses Kelly-like sizing.
      *   **Happiness?** **Unlikely.** Happiness is generally not multiplicative. Losing happiness today doesn't necessarily prevent you from experiencing happiness tomorrow in a multiplicative way. Happiness is more additive or saturating. Maximizing the *arithmetic* mean (expected happiness) is likely more appropriate. The key is whether "successes" and "failures" *multiply* or *add* over time.

  **The Clean Principle & What to Give Up:**

  *   **The Principle:** **Maximize the expected logarithm of your terminal wealth (or relevant resource base).** For repeated multiplicative decisions, this maximizes long-term growth. For one-shot decisions, it provides optimal risk-adjusted utility under log utility.
  *   **What to Give Up:**
      1.  **Betting Big on the One-Shot (Case 1):** Log utility dictates sizing down proportionally to the risk, just like the repeated case. Your "big swing" intuition is pure EV maximization, which ignores risk of loss.
      2.  **Pure EV Maximization:** You must consistently abandon this in favor of log utility (or another concave utility function) to resolve the paradoxes, especially regarding ruin risk (Case 2) and insurance (Case 3).

  **A New Case: The Double-or-Nothing Gamble**

  *   **Scenario:** 55% chance to double your money, 45% chance to lose everything. One shot.
  *   **EV Maximizer:** Bet everything! (`EV = 0.55 * 2 + 0.45 * 0 = 1.10` - 10% return).
  *   **Log Utility Maximizer:** `f* = p - q / b`. `p=0.55`, `q=0.45`, `b=1` (you win `b` = 1 times your stake, doubling it). `f* = 0.55 - (0.45 / 1) = 0.55 - 0.45 = 0.10` (10%).
  *   **Conclusion:** Bet only 10% of your bankroll. Betting everything has `E[log] = -∞`. Betting 10% has positive `E[log]`. Your caution (from Cases 1 & 2) applies here too.

  **In Summary:** Your conflicting intuitions arise from switching between EV maximization (good for small, additive, one-shot risks with no bankruptcy) and a deeper, more consistent risk-aware preference (embodied by log utility). Embrace maximizing expected log wealth. It explains:
  *   Sizing down for repeated bets (Kelly).
  *   Sizing down even for large one-shot bets.
  *   Avoiding any risk of total ruin.
  *   Paying for insurance against catastrophic loss.
  *   Diversifying across simultaneous opportunities.
  *   Betting proportionally to small edges.
  *   Using fractional Kelly for reduced volatility.

  Your friend's generalization works for multiplicative processes (money, resources, beliefs) but likely not for additive ones like momentary happiness. The core insight—geometric mean growth—is profoundly powerful for navigating favorable but uncertain repeated opportunities.
