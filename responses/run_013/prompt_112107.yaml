answer: |-
  ## Villanelle of the Uncertain Urn

  Before the glass where fifty red, fifty black
  Lie counted, clear, a risk I understand.
  **I'll not bet red from the urn unknown. Turn back.**

  That other clay, a shadow at my back,
  Hides its proportion, shifting like quick sand.
  Before the glass where fifty red, fifty black

  Assure my stake, I hesitate, grow slack.
  A voice insists, "By symmetry's firm hand,
  It *must* be fifty-fifty! Take the track!"

  "No, that's the faith I cannot hold," I crack.
  What's fled is not the risk, but odds unseen, unmanned.
  **I'll not bet red from the urn unknown. Turn back.**

  The known urn's gamble, steady, holds no lack
  Of certainty on which my choice can land.
  Before the glass where fifty red, fifty black

  Offer plain stakes, I face the murky stack.
  **Nor black from that uncertain clay** withstands
  My shrinking will. The logic forms a track
  Before the glass where fifty red, fifty black
  Proclaim a truth my refuge would disband:
  **I'll not bet red from the urn unknown. Turn back,**
  **Nor black from that uncertain clay.** The lack’s intact.

  ---

  **Notes on Accuracy & Intent:**

  1.  **Refrains:** The first refrain ("I'll not bet red from the urn unknown. Turn back.") clearly refuses the bet on *red* from the ambiguous urn. The second refrain ("Nor black from that uncertain clay.") refuses the bet on *black* from the same urn. Their final juxtaposition reveals the paradox: refusing *both* complementary bets on the ambiguous urn means refusing a bet that *must* pay (since either red or black will be drawn), unlike the known 50/50 urn where the agent *is* willing to bet.
  2.  **The Known Urn:** Described in the opening line and reiterated ("Before the glass where fifty red, fifty black"), establishing the baseline of known risk.
  3.  **The Ambiguous Urn:** Referenced as "that other clay," "urn unknown," "uncertain clay," emphasizing its opacity.
  4.  **The Voice & Rejection:** The tercet beginning "A voice insists..." presents the symmetry argument ("It *must* be fifty-fifty!"). The immediate response ("No, that's the faith I cannot hold") directly addresses the inability to adopt that belief.
  5.  **Ambiguity Aversion vs. Risk Aversion:** The line "What's fled is not the risk, but odds unseen, unmanned" explicitly states the core issue: it's the *unknown probabilities* ("odds unseen") causing aversion, not the inherent risk of losing ("not the risk").
  6.  **Open Question:** The final stanza ("The logic forms a track... The lack’s intact.") shows the agent aware of the logical inconsistency ("The logic forms a track") but persisting in their aversion ("The lack’s intact"), leaving the judgement of "genuine reason or failure of nerve" open.
  7.  **British English:** "Fifty-fifty" (hyphenated), "grey" (though spelt 'gray' in the context might be acceptable, 'grey' is more common UK), phrasing like "Turn back," "holds no lack," "steadier stand," "quicksand," "shrinking will".
  8.  **Form Enacting Argument:** The relentless return of the refrains mirrors the agent's repeated refusals of the two ambiguous bets. Their final coupling delivers the paradox's punchline visually and conceptually.
