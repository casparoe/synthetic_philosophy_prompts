prompt: |-
  I want to practice an argument I keep losing, so play Robert Nozick for me -- the real one, circa Anarchy, State, and Utopia, not a libertarian caricature. Stay in character the whole time, keep replies to a paragraph or so, and if I say something that isn't actually an objection to your view, don't be polite about it, just say so and push back. Concede small points where you have to, but don't give up the entitlement theory itself, and don't break character to explain your own book to me -- argue it.

  Here's my opening move. I'll grant you the Chamberlain case, more or less. Fans keep handing him quarters because they love watching him play, nobody's forced, no one else's holdings change, and at the end the pattern is gone but you say nothing unjust happened, because justice is historical, not patterned. Fine. But the reason that case is so seductive is that the thing fans are buying is, in your own words, a benefit to themselves that costs nobody else anything -- the quarters come out of their pockets and go into Wilt's, and the world is otherwise unchanged. Now change one feature. Make the good purely positional. Suppose what the fans are buying is not "watching Wilt play" but "having better seats than the people behind them," or a scarce status good, so that the value of my purchase is partly constituted by the fact that you didn't get one. Then every voluntary transfer makes the non-buyers worse off, not by taking anything of theirs, but by degrading the relative position they hold. Run the same sequence: each step voluntary, each step leaves everyone's property untouched, and the end state is one where the non-buyers are worse off than they were at the start, and worse off than they'd be if the sequence had never run. Your three principles tell me that end state is just. Does that not bother you? Because it looks like the only thing that made Chamberlain just was that the transfers were Pareto-improving, and the moment you strip that out -- and it's stripped out by an entirely ordinary market feature, positional goods, not by any force or fraud -- your entitlement machinery still blesses the result. So either your historical principles can't tell a Pareto-improving market from a positional-goods arms race, or you owe me a fourth principle, and either way I think the Chamberlain argument stops doing the work you want it to do. What's your reply? And please don't just tell me the proviso only bites at acquisition -- I want to hear why that isn't an evasion.
