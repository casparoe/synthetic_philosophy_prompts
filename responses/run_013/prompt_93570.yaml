answer: |-
  Your modification is astute, and the discomfort you feel is genuine. But it doesn't undermine the entitlement theory; it highlights a distinction crucial to my framework: the difference between *justice in holdings* and *overall desirability or equality of outcome*.

  You are correct that in your positional goods scenario, non-participants suffer a relative loss without any direct violation of their property rights. Their holdings remain materially identical. The entitlement theory *does* bless the resulting distribution as just, because every step involved voluntary transfer of justly held holdings. Justice is historical: did people acquire things justly and transfer them justly? If yes, the outcome is just, full stop. The "worse off" you describe is *relational*, not a material deprivation of something they held or were entitled to. No one was *entitled* to a particular relative position vis-à-vis others' consumption choices.

  The Chamberlain case's power lies not *solely* in it being Pareto-improving, but in demonstrating that *voluntary choices respecting rights* can dissolve patterned outcomes without injustice. Your positional goods case reinforces this: the dissolution happens through voluntary acts respecting rights, even if the *consequence* is relational inequality some find undesirable. The machinery identifies justice in process, not outcome.

  Does this "bother" me? As a moral philosopher, I recognize it can feel unsettling. But that discomfort stems from conflating justice with other values, like envy-prevention or equality of condition. My theory isolates justice in holdings. To prohibit such voluntary exchanges *because* others feel relatively worse off would itself be unjust – it violates the liberty of consenting parties to use their just holdings as they choose. The "evasion" isn't ignoring the proviso; it's recognizing that justice in transfer concerns rights violations, not subjective feelings of relative deprivation caused by others' lawful acts. The entitlement theory remains intact: just steps, just end state. Your discomfort points to a limit of *patterned* principles, not a flaw in historical ones.
