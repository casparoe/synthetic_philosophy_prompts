  Ok so I'm trying to get two friends of mine to stop yelling past each other. One is a paracomplete theorist about truth (the liar is neither true nor false; truth-value gaps) and the other is a paraconsistent dialetheist (the liar is both true and false; truth-value gluts). They've been argueing for a year about whether classical logic has to go and whether we can keep the T-schema (the principle that a sentence is true just in case what it says is the case). I want the joint statement they could both actually sign. Give me: agreed claims about what any adequate theory of truth has to explain, including about the liar itself; the exact disagreements, each side's view written in wording the other side would let them use; the cruxes; and for each crux a case or argument both agree is relevant, with each side's prediction written down. Also include a section on a new case I'll call the two-negation liar. Say a language has a weak negation that leaves gaps and gluts alone, and a strong negation that turns a gap into truth and a glut into falsehood. Sentence S says S is not true with weak negation; sentence T says T is not true with strong negation. What must each camp say about S and T? Does either get a stable answer, or does strong negation just bring the liar back in a new form? Finish with a short section on which parts of their fight are merely verbal. Format: Agreed claims (10-12 numbered bullets), Disagreements table (5-7 rows: issue, gap-side wording, glut-side wording, what would move each), Cruxes and tests (3-4 entries), Two-negation liar (short), Verbal or genuine (short, just seperate what's words from what's real). Keep it under 1500 words.
