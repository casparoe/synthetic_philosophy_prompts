  Finally, the verbal/genuine split: much disagreement is about "true contradiction" vs. "indeterminacy" labels - but the core divide is whether explosion failure requires gluts or just gaps. That's substantive. Shared formalisms (like LP and K3) show they're not *totally* talking past each other.

  Word count is tight. I'll keep agreed claims to 10 bullets, disagreements to 5 rows, cruxes to 3 tests. Two-negation section will be dense but short. Verbal/genuine gets one punchy paragraph. Must avoid jargon where possible - e.g., explain "revenge paradox" parenthetically.

