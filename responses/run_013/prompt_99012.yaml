  1. Hard Perennialist/Primordialist (HP): Nations are ancient, natural, and continuous.
  2. Ethnosymbolist (ES): Pre-modern ethnic roots exist, but the nation as we know it is modern.
  3. Top-down Modernist (TM): Nations are deliberately constructed by elites in the modern period.
  4. Bottom-up Modernist (BM): Nations emerge horizontally through communication (print, media) in modern times.
  5. Bricolage (BR): Constructed from various elements, and that doesn't make it fake; it's real because people believe in it.
  6. Deflationary (DF): The question is confused because we are sliding between nation, state, and ethnic group.

  The quiz will have 9 questions. Each question is a concrete scenario with 2 or 3 options. We aim to distinguish between the positions by having the answers reflect the underlying distinctions.

  Key distinctions to capture:

  - Invented: deliberate deception vs. historical contingency?
