prompt: |-
  I program a small documentary festival: roughly 1,200 submissions a year, ninety slots, no realistic chance of my seeing more than a fraction of them. Most of my decisions rest on what other people tell me — pre-screeners' reports, two colleagues whose taste I trust, a distributor's enthusiasm, a director's track record — and then I write the program notes and do press in which I say flatly that a film is extraordinary, or devastating, or the best thing in its strand, and defend the slate to a board that signs off on it. A colleague tells me this is defensible as a programming decision and indefensible as a claim, since I don't have the judgment I'm expressing; I half agree and can't see what follows, because the notes still have to say something.

  Give me a procedure I can actually run, one submission at a time, in the ten minutes I have per title, and then again on the copy: the questions to ask in order, what counts as a sufficient answer to each, where the procedure returns a verdict by itself, and where it stops and hands me a judgment call rather than a fact. It should keep whatever the philosophy of aesthetic testimony genuinely establishes — the difference between acting on someone's say-so and asserting on it, the principle, sometimes called the acquaintance principle, that a genuine aesthetic judgment must rest on first-hand acquaintance with the work, and whether what licenses deference is the testifier's credentials or her access to the thing — and drop whatever can't survive a deadline. Then run it on three cases: a film I cannot see before the deadline, covered by two reports I trust; a film I programmed on a friend's word and disliked once I finally saw it; and the year-end list, where I am asked to rank a film I haven't seen above one I have. Include at least one verdict I won't like, and tell me what the procedure can't settle — including whether someone who defers this much can be said to have taste at all.
reasoning: |-
  Okay, the user runs a small documentary festival with 1,200 submissions and only 90 slots. They rely heavily on others' opinions—pre-screeners, trusted colleagues, distributors—to make programming decisions. Then they have to write program notes and defend their choices, claiming films are "extraordinary" or "devastating" despite not having seen all of them. A colleague criticized this as indefensible because they lack firsthand judgment. The user half-agrees but needs a practical procedure to handle each submission in ten minutes, balancing philosophical principles like the acquaintance principle against real-world constraints.

  First, I need to unpack the core conflict. The user is caught between operational necessity (can't watch everything) and ethical/critical integrity (can't authentically praise unseen work). Their colleague's critique hits hard because it questions the very foundation of their authority—if they haven't seen the films, can their praise be valid? The acquaintance principle in aesthetics insists that genuine judgment requires direct experience, so bypassing that via testimony creates tension. 

  The user's deeper needs are pragmatic: a step-by-step workflow that legitimizes reliance on others while minimizing hypocrisy. They want to retain phrases like "devastating" in notes without lying, and defend their slate to the board credibly. They also hint at existential worries—does deferring so much negate their claim to having "taste"? 

  Philosophically, two issues are key: 
  1. **Testimony vs. Assertion**: Acting on others' opinions is fine (e.g., programming), but asserting aesthetic qualities as if firsthand is problematic. 
  2. **Basis for Deference**: Trusting someone requires either their expertise ("credentials") or their access to the work ("positional authority"), but only the latter survives tight deadlines since vetting expertise takes time. 

  The procedure must therefore strictly separate *programming decisions* (which can rely entirely on testimony) from *aesthetic assertions* (which require hedging if unseen). For assertions, they can either: 
  - Attribute praise explicitly ("X calls this devastating") 
  - Use impersonal framing ("This film reportedly confronts...") 
  - Limit strong claims to films they've seen. 

  For the ten-minute-per-title workflow, I'll structure it as a decision tree with clear checkpoints: 
  1. **Evidence Check**: Gather reports, credentials, conflicts. 
  2. **Programming Verdict**: Can I slot this? (Relies on testimony) 
  3. **Copy Approach**: How to describe it? (Depends on viewing status) 

  Then apply this to their three cases: 
  - **Unseen Film**: Program based on trusted reports, but notes must attribute ("Our screeners find..."). 
  - **Disliked Film**: Programmed via testimony; now they *have* seen it, so notes can reflect their view but should acknowledge the colleague's input neutrally. 
  - **Year-End List**: Can't rank an unseen film above a seen one without undermining credibility; suggest alternatives like thematic grouping. 

  The "verdict they won't like" is likely that they can't claim personal aesthetic judgment for unseen films—forcing hedging in notes. The unresolved tension: Can they have "taste" while deferring? Yes, but only as curator (selecting trusted voices), not critic (making firsthand evaluations). Taste here becomes meta—knowing *whose* judgments to trust. 

  This balances philosophy and pragmatism: it honors the acquaintance principle by restricting strong assertions, leverages testimony for logistics, and reframes "taste" as curatorial discernment rather than direct appraisal.
answer: |-
  Here's a procedure designed for your constraints, respecting aesthetic philosophy while functioning within 10-minute slots. It separates **programming decisions** (what gets in) from **aesthetic assertions** (what you write/say), addressing the core tension.

  **Core Principles Embedded:**
  1.  **Acquaintance Principle:** Direct aesthetic judgment requires firsthand experience. You cannot *truthfully assert* "Film X is devastating" if you haven't seen it. Testimony can justify *action* (programming) but not *first-person aesthetic assertion*.
  2.  **Deference Basis:** Under deadline pressure, prioritize **positional authority** (the testifier's *access* to the work and role) over deep vetting of *credentials* (their taste philosophy). Trust is assumed based on role (e.g., trusted pre-screener, colleague) or relevant access (distributor who *has* seen it).
  3.  **Testimony vs. Assertion:** You can *act* on testimony. Your *words* must reflect your epistemic position (seen/unseen, liked/disliked).
  4.  **The "Taste" Question:** Your curatorial taste manifests in *choosing whom to trust* and *how to synthesize/contextualize* their input for the festival's vision, not necessarily in direct appraisals of unseen films.

  **The 10-Minute Procedure (Per Submission):**

  1.  **Gather & Classify Evidence (2 mins):**
      *   *Question:* What testimony/reports exist? Who provided them? What's their relation to the film (pre-screener, colleague, distributor, director history)? Have *I* seen any of this filmmaker's past work?
      *   *Sufficient Answer:* List sources (e.g., "Pre-screener A Report, Trusted Colleague B Email, Distributor C synopsis"). Note if any source is known to have conflicts. Flag if director has known track record *to me*.
      *   *Verdict:* Raw data gathered. Proceed.

  2.  **Assess Reliability & Coherence (3 mins):**
      *   *Question:* Do the sources have credible *access* (they saw it)? Is the testimony internally consistent and coherent? Is there strong disagreement between trusted sources? Does the synopsis/logline align with the praise/criticism?
      *   *Sufficient Answer:* Evidence of viewing (e.g., report details, specific references). General alignment in tone/assessment among sources (e.g., both screens mention "powerful character study"). No major red flags (e.g., distributor raves but both trusted screeners call it "shallow").
      *   *Verdict (Fact):* If sources lack confirmed access or reports are incoherent/contradictory by trusted parties -> **Reject or Flag for Later Review** (if time permits). Else, proceed.
      *   *Judgment Call:* Is the *alignment* strong enough? What weight to give distributor vs. screener? Resolve quickly based on past reliability of source types.

  3.  **Programming Decision: Fit & Feasibility (3 mins):**
      *   *Question:* Based on the *consensus/strength* of testimony, does this film *sound* like it fits the festival's vision, themes, audience, and practical needs (length, format, rights clearable, slot availability)? Does it add diversity or fill a gap?
      *   *Sufficient Answer:* Testimony clearly indicates relevant themes/quality level. Logline fits festival scope. No obvious practical blockers identified in reports/synopsis.
      *   *Verdict (Judgment Call):* **Program** / **Reject** / **Hold (Maybe)**. *This decision rests entirely on testimony.* It's defensible as curation based on trusted input and festival needs. The Acquaintance Principle is *not* violated here because you are *acting*, not *asserting judgment*.
      *   *Judgment Call:* Balancing thematic fit against reported quality. Priority level compared to others in the "maybe" pile.

  4.  **Plan for Aesthetic Assertion (Copy/Notes) (2 mins):**
      *   *Question:* Have *I* seen this film? (If unsure, check notes/database quickly).
      *   *Sufficient Answer:* Yes/No.
      *   *Verdict (Fact):*
          *   **If I HAVE seen it:** I can write/speak my *own* aesthetic judgments ("devastating," "extraordinary"). Ground them in specifics from my viewing.
          *   **If I HAVE NOT seen it:** I *cannot* assert first-person aesthetic judgments. I *must* attribute or frame impersonally.
              *   *Options:* "Pre-screeners describe this as a devastating portrait of..."; "Hailed by [Trusted Colleague Name] as an extraordinary achievement in..."; "This film confronts [Topic] with reported intensity"; "Early reviews praise its powerful approach to...".
              *   *Avoid:* "This is devastating." "A must-see masterpiece." (Unless prefixed: "Critics are calling this a must-see masterpiece").
      *   *Judgment Call:* Choosing the most compelling *attributed* or *impersonal* phrasing that still attracts an audience, while remaining truthful.

  **Procedure on the Copy (Post-Programming):**
  *   Re-run Step 4 for *each* film description.
  *   **Key Check:** For every strong adjective or claim ("powerful," "innovative," "best"), ask: "Can I honestly say this *in my own voice* based on *my* viewing? If not, attribute it or soften the framing.

  ---

  **Case Applications:**

  1.  **Film Unseen (Trusted Reports):**
      *   Step 1: Gather reports (Pre-screener X, Trusted Colleague Y). Both viewed.
      *   Step 2: Both reports are coherent, detailed, and align (e.g., both praise its intimate access and emotional impact). Distributor synopsis matches. -> **Proceed**.
      *   Step 3: Reports indicate a strong, timely film fitting our "Social Justice" strand. Slot available. -> **Decision: PROGRAM** (Based on testimony).
      *   Step 4: **I have NOT seen it.** -> **Copy Plan:** Attribute. E.g., "Pre-screener X calls this 'a devastatingly intimate look at resilience.' Trusted programmer Y highlights its 'extraordinary access and emotional power.'" *Cannot say:* "This devastating film offers extraordinary access..."

  2.  **Film Programmed on Friend's Word, I Later Disliked:**
      *   *At Programming Time:*
          *   Step 1: Input = Trusted Friend Z (known taste, confirmed viewed).
          *   Step 2: Friend's report coherent, enthusiastic. -> **Proceed**.
          *   Step 3: Friend's strong reco, fits "Experimental" strand. -> **Decision: PROGRAM** (Defensible action on testimony).
          *   Step 4: **I have NOT seen it.** -> **Copy Plan:** Attribute. E.g., "Recommended by trusted filmmaker Z as 'a visionary break from convention.'"
      *   *After Viewing (For Intro/Q&A/Press Now):*
          *   Step 4: **I HAVE seen it (and disliked it).** -> I **cannot** repeat the attributed praise *as my own*. I can:
              *   Acknowledge the reco neutrally: "This film comes highly recommended by [Friend Z], whose work I greatly admire."
              *   Focus on objective/contextual aspects: "It employs a unique [technique] to explore [theme], challenging viewers' expectations of documentary form."
              *   **Avoid:** "While Friend Z found it visionary, I found it pretentious." (Unprofessional). Stick to neutral or positive framing of *what it is/does*, not your negative aesthetic judgment.

  3.  **Year-End List Ranking (Unseen vs. Seen):**
      *   *The Verdict You Won't Like:* **The procedure FORBIDS you from ranking an unseen film above a seen film on a "Best Of" list.** The Acquaintance Principle is absolute here.
      *   *Reasoning:* A "Best Of" list is a direct, ranked assertion of *your* aesthetic judgment. Ranking Film A (unseen) above Film B (seen) based on testimony means asserting "I judge A to be better than B" without the requisite experience of A. This is indefensible.
      *   *Procedure Application:*
          *   Step 4 (Crucially): For the list, you can *only* rank films **you have seen**. Films you haven't seen **cannot be included on a ranked list purporting to be *your* judgment**.
          *   *Alternatives:*
              *   **List Only Seen Films:** The only philosophically defensible option for a *ranked* list.
              *   **Separate "Notable Films" Section:** Include highly recommended unseen films *separately*, unranked, clearly attributed. E.g., "Also generating significant buzz and highly recommended by [Sources]: [Unseen Film A], [Unseen Film B]."
              *   **Reframe the List:** Call it "Audience Favorites + Curator's Picks" and only rank the seen ones in your picks section.

  ---

  **What the Procedure Can't Settle & The Taste Question:**

  1.  **Can't Settle:**
      *   **The Ultimate "Was it Good?":** It tells you how to *act* and *speak* ethically, not whether the testimony was *correct*. You might program a dud based on trusted reports (Case 2).
      *   **Resolving Contradictory Testimony:** If two trusted screeners wildly disagree (one "masterpiece," one "shallow"), the procedure flags it, but you must make a quick, risky judgment call based on gut feeling about the sources or festival fit (Step 2/3 Judgment Call).
      *   **The "Why Trust *These* People?" Deep Dive:** It assumes pre-established trust based on roles/access due to time constraints. It doesn't solve the meta-problem of *why* you trust Colleague B implicitly – that's a background curation of *sources*.
      *   **Perfect Wording:** Finding the most impactful yet truthful way to describe an unseen film (Step 4) remains an art, balancing ethics and marketing.

  2.  **Do You Have Taste?**
      *   **Yes, but it's Curatorial Taste, not Critical Taste.** Your taste is evident in:
          *   **Selecting your sources:** Trusting Colleague B over Distributor C for certain films *is* a taste judgment about *whose judgment aligns with your vision*.
          *   **Synthesizing Input:** Weighing reports against the festival's themes, audience, and strand balance requires taste.
          *   **Crafting the Narrative:** Writing truthful, compelling notes (even when attributed) and structuring the overall program reflects your curatorial sensibility.
          *   **Your Selections:** The films you *do* see and passionately advocate for reveal your direct critical taste.
      *   **The Limitation:** You cannot claim *direct critical aesthetic judgment* over the unseen films. Your authority on those films is *delegated*, not personal. Your taste operates at a meta-level: taste in people, systems, and context.

  **In essence:** The procedure legitimizes your *actions* (programming) via testimony while constraining your *words* to reflect your actual epistemic access. It accepts that under your constraints, your role is more *curator* (facilitator, trusted selector) than *omniscient critic* for every single film. Your taste is real, but its application is necessarily indirect for the majority of titles.
