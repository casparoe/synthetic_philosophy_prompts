answer: |-
  Here’s a prioritized agenda based on upstream impact, tractability, and neglect, weighing reframings against revenge:

  **1. Diagnose and Formalize Revenge Vulnerability (Highest Priority)**  
  *Why upstream?* Revenge paradoxes recur because existing frameworks lack resources to *consistently* describe their own limitations (e.g., "ungroundedness" in Kripke). Until we systematically characterize what makes a theory "revenge-prone," reframings risk recreating the problem.  
  *Tractability:* Model-theoretic tools (e.g., dependency graphs for semantic dependence) and proof-theoretic analysis of "safety" predicates are underexplored but feasible.  
  *Neglect:* Revenge is often treated as a problem *for specific theories*, not as a general phenomenon to taxonomize.  
  *3-year goal:* A formal criterion for revenge-resistance (e.g., "No theory can prove its own semantic closure condition X without inconsistency"). A positive result here would reframe all subsequent work; failure would elevate structural/contextual reframings.  

  **2. Develop a Coherent Formal Semantics for Contextualist Truth (Medium Priority)**  
  *Why over contraction abandonment?* Contextualism directly addresses revenge by relativizing truth to contexts, blocking strengthened liars via parameterization. It leverages existing tools (e.g., modal logic, indexicals) and aligns with linguistic phenomena.  
  *Tractability:* Extending Kaplanian semantics or dynamic frameworks (e.g., Tarski hierarchies with context-shifting operators) is viable. Key challenge: formalizing "contextual adequacy" without reinstating hierarchy.  
  *Neglect:* Contextualist truth lacks rigorous formalizations compared to substructural or paraconsistent approaches.  
  *3-year goal:* A model-theoretic account where "This sentence is false" exhibits context-dependent truth-value *without* ad hoc restrictions. Success would validate contextualism as a reframing; failure might favor structural approaches.  

  **3. Explore Non-Contractive Truth in Expressive Settings (Lower Priority)**  
  *Why downstream?* Abandoning structural contraction (e.g., in sequent calculus) blocks derivations of paradox but faces steep challenges: retaining classical reasoning for non-semantic domains, and embedding arithmetic.  
  *Tractability:* Current substructural systems (e.g., ST) are weak proof-theoretically. Integrating them with sufficient mathematics for self-analysis is hard.  
  *Neglect:* Non-contractive truth is studied but rarely tested in rich mathematical environments.  
  *3-year goal:* A contraction-free truth theory supporting basic syntax and arithmetic, with a consistency proof. Success would demonstrate viability; failure might limit this reframing to niche applications.  

  **Why Revenge Diagnostics Outweigh Reframings Initially?**  
  Reframings risk *displacing* revenge (contextualism) or *avoiding* it (non-contraction) without solving the meta-problem. A foundational analysis of revenge (Priority 1) could reveal whether contextualism/non-contraction genuinely resolve it or merely relocate it. Contextualism (Priority 2) ranks above non-contraction due to better integration with semantics and higher tractability.  

  **What Changes the Ranking?**  
  - **Priority 1 down:** If revenge vulnerability is proven irreducible (e.g., via generalized incompleteness), focus shifts fully to reframings.  
  - **Priority 2 up:** A breakthrough contextualist model that naturally blocks revenge (e.g., unifying assessment-sensitivity with truth predicates) would elevate it.  
  - **Priority 3 up:** Discovery of a non-contractive system reconciling strength with consistency could make it competitive.  

  **Conclusion:** Address revenge’s roots first, then pursue contextualism as the most promising reframe, with non-contraction as a high-risk alternative. A revenge taxonomy enables evaluating *any* new approach.
