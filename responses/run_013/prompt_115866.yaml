prompt: |-
  I am a software engineer by background, with no formal training in philosophy, and I have been asked to contribute one question to the final examination of a graduate module on the foundations of probabilistic reasoning, whose students come mostly from statistics, computer science, and economics. I want the question to be on the reference class problem, but I do not want it to be answerable by reciting the familiar observation that any frequency judgment presupposes a choice of class. I want it to force a student to say why the choice cannot be made either by "use the largest class for which we have data" or by "use the most specific class possible," and to say what a genuine resolution would have to accomplish.

  Here is the scenario I want the question built on, stated in the terms I would naturally use. A hospital runs a model that, for each incoming patient, reports a number it calls the patient's probability of developing a particular complication within thirty days. For one particular patient the model reports 0.30. Three of my colleagues dispute what that number is a probability of. The first says it is the frequency of the complication among the patients the model was trained on, that being the broadest class for which we have data. The second says the only defensible class is the one matching everything known about this patient, including the variables the model never saw; taken seriously, that class has a single member, so the relevant frequency is either 0 or 1 and we do not know which. The third says the number is well defined only relative to the model's own output: among all the cases on which the model reported 0.30, thirty per cent developed the complication, so the number is a fact about the model rather than about the patient. I want the question to make the student show why each of the three positions is both defensible and unsatisfying, and to decide whether the three are disagreeing about the world or about our evidence.

  The question must require the student to do the following.

  1. State the general problem precisely enough to make clear why it arises for any probability assigned to a single case, and not only for frequencies.
  2. Explain why "use the broadest class for which there is data" and "use the most specific class" are each defective, and say what each of them gets right. I gather from a colleague that the crux is the requirement that a class be homogeneous, in the sense that no further subdivision should change the frequency, and I want the student to work out what happens to that requirement as the class is narrowed toward the single case.
  3. Say whether the problem is an artefact of frequentist interpretations or survives when the 0.30 is read as a rational degree of belief, and defend the answer.
  4. Distinguish the problem from the base-rate fallacy, and from the separate claim that some events are objectively chancy.
  5. Take a stand on what a satisfactory resolution would have to accomplish, and on whether the hospital's 0.30 can be defended at all. As a test of whether the student has actually committed rather than hedged, include a final part: if the hospital adds a variable and the reported number for this patient moves from 0.30 to 0.28, has the probability changed or has the estimate changed? The student must answer rather than sit on the fence.

  The question should be answerable in about forty-five minutes. Please produce three things: the examination question itself; a model answer of roughly seven hundred words; and a marking scheme out of twenty-five marks that separates an A answer from a B answer by naming the specific moves each must contain, with a one-line note for each part on how students typically get it wrong. Please keep the marking scheme about the moves rather than about the literature, since I do not want students rewarded for dropping names that I could not fairly police myself.
reasoning: |-
  We are constructing an exam question on the reference class problem for a graduate module on probabilistic reasoning. The scenario involves a hospital model that outputs a probability of 0.30 for a specific patient developing a complication. Three colleagues interpret this probability differently: the first as the frequency in the broadest class (training data), the second as the frequency in the most specific class (the singleton patient, which is unknown), and the third as the frequency among cases where the model output 0.30.

  The question must require the student to:
  1. State the general problem precisely, showing it arises for any single-case probability, not just frequencies.
  2. Explain why "broadest class with data" and "most specific class" are defective, and what each gets right. The crux is the homogeneity requirement and what happens as we narrow the class.
  3. Address whether the problem is specific to frequentism or survives under a Bayesian (degree of belief) interpretation.
  4. Distinguish the problem from the base-rate fallacy and from objective chance.
  5. Take a stand on what a satisfactory resolution must accomplish and whether the hospital's 0.30 can be defended. Also, answer: if adding a variable changes the output from 0.30 to 0.28, has the probability changed or the estimate?

  The question should be answerable in 45 minutes. We'll produce:
  - The examination question.
  - A model answer (about 700 words).
  - A marking scheme (out of 25) with specific moves for A vs B, and typical errors.

  Let's design the question.

  **Examination Question:**

  **Question 1 (25 marks):**

  The reference class problem is a fundamental challenge in the interpretation of probabilities, especially for single-case ascriptions. Consider the following scenario:

  A hospital uses a predictive model that, for each patient, outputs a number interpreted as the probability of developing a particular complication within thirty days. For one patient, the model reports 0.30. Three colleagues offer different interpretations:

  - Colleague A: The 0.30 is the frequency of the complication in the broadest class for which we have data, namely the entire training set of the model.
  - Colleague B: The only defensible class is the one that matches everything known about the patient, including factors the model did not consider. But this class is a singleton (only this patient), so the true frequency is either 0 or 1 (but unknown).
  - Colleague C: The 0.30 is well-defined only relative to the model's output: among all cases for which the model reported 0.30, 30% developed the complication. Thus, it is a fact about the model, not the patient.

  Address the following:

  (a) Precisely state the reference class problem, explaining why it arises for any probability assigned to a single event and not merely for frequencies. (5 marks)

  (b) Explain why both Colleague A's "broadest class" and Colleague B's "most specific class" approaches are defective, and what each correctly identifies. In your explanation, discuss the role of the homogeneity requirement (that no further subdivision changes the frequency) and how this requirement behaves as we narrow the class toward the single case. (7 marks)

  (c) Does the reference class problem vanish if we interpret the 0.30 as a rational degree of belief (Bayesian interpretation) rather than a frequency? Defend your answer. (4 marks)

  (d) Distinguish the reference class problem from (i) the base-rate fallacy and (ii) the claim that some events are objectively chancy. (4 marks)

  (e) Take a stand: What would a satisfactory resolution of the reference class problem have to accomplish? Can the hospital's 0.30 be defended? Finally, if the hospital adds a new variable to the model and the output for this patient changes from 0.30 to 0.28, has the *probability* changed or has the *estimate* changed? Justify your answer. (5 marks)

  ---

  **Model Answer (approx. 700 words):**

  **(a) The reference class problem** arises when we assign a probability to a single event (e.g., this patient developing a complication) because any such assignment must implicitly or explicitly rely on a reference class of similar events for which we have frequency data or a basis for belief. The problem is that there are multiple, non-identical reference classes to which the single case belongs, and these classes may yield different probabilities. This is not just a problem for frequentist interpretations because even in subjectivist or Bayesian views, the rational degree of belief must be grounded in some evidence, which typically involves a set of similar cases. Thus, the problem is one of selecting the appropriate reference class for the single case, and it is inherent in any interpretation of single-case probabilities.

  **(b)** 

  *Colleague A's approach (broadest class)*: Using the broadest class (the entire training set) is defective because it may be heterogeneous. The frequency in the broad class (say, 0.30) might average over subpopulations with different risks. For instance, if the patient belongs to a subgroup with a true risk of 0.10, then 0.30 misrepresents their risk. What Colleague A gets right is that using a large class typically provides more data, leading to a more stable (lower variance) estimate. However, stability is achieved at the cost of ignoring relevant differences.

  *Colleague B's approach (most specific class)*: Insisting on the most specific class (all properties of the patient) leads to a singleton. The true frequency in this class is either 0 or 1 (the event happens or not), but we do not know which. This approach is defective because it renders probability inapplicable (the event either happened or didn't) and because we never have enough data to condition on every property. What Colleague B correctly identifies is that only a homogeneous class (one that cannot be further subdivided in a way that changes the frequency) gives the "true" probability for the individual. However, as we narrow the class toward the singleton, the homogeneity requirement becomes vacuous: a singleton is trivially homogeneous (since there's no further subdivision) but the frequency is either 0 or 1. Thus, the quest for homogeneity by maximal specificity collapses into determinism and abandons probability.

  **(c)** The reference class problem does not vanish under a Bayesian interpretation. A Bayesian interprets probability as a rational degree of belief, which is updated by evidence. However, the evidence typically includes data from a reference class. For example, a Bayesian might start with a prior based on a broad class and update with specific information. But the choice of prior and the relevance of the evidence still depend on what reference class(es) are considered. Moreover, if two Bayesians condition on different sets of evidence (i.e., use different reference classes), they may have different degrees of belief. Thus, the problem of choosing the appropriate reference class (or set of evidence) remains.

  **(d)** 

  (i) *Base-rate fallacy*: This is the error of ignoring the base rate (prior probability) of an event when updating with new evidence. The reference class problem is distinct: it is about which base rate to use in the first place. For example, the base-rate fallacy might occur if we neglect the overall complication rate in the hospital when given a test result; the reference class problem arises when we must choose between the hospital-wide rate or a more specific rate (e.g., for patients with the same test result).

  (ii) *Objective chance*: Some events might be fundamentally chancy (e.g., quantum events). The reference class problem, however, arises even for events that might be deterministic because it is about our epistemic limitations. For instance, even if the patient's outcome is determined by their exact state, we do not know that state and must use a reference class to form a probability. The problem is about how to choose a reference class given our ignorance, not about whether the event is objectively random.

  **(e)** 

  A satisfactory resolution must provide a principled way to select a reference class that is both relevant and feasible. It should avoid the extremes of over-broad (ignoring important differences) and over-specific (having no data). The hospital's 0.30 can be defended pragmatically: the model uses a reference class defined by the features it considers, and if the model is well-calibrated (like Colleague C's view), then 0.30 is a good operational probability for decision-making. However, this does not fully resolve the philosophical problem because the choice of features (and thus the reference class) is arbitrary.

  Regarding the change from 0.30 to 0.28: The *estimate* has changed, but the *probability* (if we conceive of it as an objective property of the patient) may or may not have changed. However, under the operational view (like Colleague C), the probability is defined by the model's output and the calibration on past data. Therefore, when the model changes, the estimate changes and the probability (as defined by the model) changes. Alternatively, if we think there is a true probability for the patient given all factors, then the model's output is always an estimate, and the change reflects an improved estimate (if the new variable is relevant) but not necessarily a change in the true probability (which is fixed by the patient's state). Given the reference class problem, I argue that the true probability is not accessible, so we must rely on the model's estimate. Therefore, for practical purposes, the probability (as we assign it) has changed.

  ---

  **Marking Scheme (25 marks total):**

  **General Note:** An A answer (typically 18-25) must be clear, precise, and show deep understanding. A B answer (typically 14-17) may have minor gaps or inaccuracies but covers the main points.

  **(a) State the problem (5 marks):**
  - A: Clearly states that the problem is the choice of reference class for a single case and explains that it arises because any probability (even degree of belief) must be based on a class of similar events. (4-5)
  - B: Mentions the choice of reference class but may not generalize beyond frequentism or does not clearly explain why it arises for any single-case probability. (3)
  - Typical error: Only describes the problem for frequencies and does not extend to other interpretations.

  **(b) Critique of A and B (7 marks):**
  - A: Explains that the broadest class (A) ignores heterogeneity (so may average over relevant subgroups) but provides stability. The most specific class (B) leads to a singleton (0 or 1) and abandons probability, though it correctly seeks homogeneity. Discusses homogeneity: it is desirable but unattainable by maximal specificity because the singleton is trivially homogeneous but uninformative. (6-7)
  - B: Identifies the defects but does not fully explain homogeneity or the collapse in B. (5)
  - Typical error: Fails to explain the homogeneity requirement or why the singleton is problematic.

  **(c) Bayesian interpretation (4 marks):**
  - A: Argues that the problem remains because degrees of belief are based on evidence that comes from a reference class. Explains that different evidence (different classes) lead to different beliefs. (4)
  - B: States that the problem remains but without a clear explanation of why. (3)
  - Typical error: Claims the problem vanishes under Bayesianism.

  **(d) Distinguish from base-rate fallacy and objective chance (4 marks):**
  - A: Clearly distinguishes: (i) base-rate fallacy is about ignoring the prior, while the reference class problem is about choosing which prior (which base rate) to use; (ii) objective chance is about the nature of events, while the reference class problem is about epistemology (our ignorance). (4)
  - B: One distinction is clear, the other is weak. (3)
  - Typical error: Confuses base-rate fallacy with reference class problem.

  **(e) Stand and final part (5 marks):**
  - A: States that a resolution must balance relevance and feasibility (avoiding over-broad and over-specific). Defends the hospital's 0.30 pragmatically (e.g., as a well-calibrated model output) but notes the arbitrariness. For the change: Takes a clear stand (e.g., the estimate changed, and the probability as defined operationally changed) and justifies it. (5)
  - B: Gives a vague resolution requirement. Defends the hospital weakly. The answer to the change is present but not well-justified. (4)
  - Typical error: Avoids taking a stand on the change (says both or neither).

  ---
  This design should meet the requirements and be appropriate for a 45-minute answer.
answer: |-
  ### Examination Question

  **Question 1 (25 marks):**  
  The reference class problem challenges the interpretation of probabilities for single events. Consider a scenario where a hospital’s predictive model outputs a "probability" of 0.30 for a specific patient developing a complication within thirty days. Three colleagues interpret this number differently:  
  - **Colleague A**: Claims 0.30 is the frequency in the broadest class with data (the entire training dataset).  
  - **Colleague B**: Argues that only the most specific class—including all known patient attributes, even those unused by the model—is defensible. Since this class is a singleton, the true frequency is 0 or 1 (unknown).  
  - **Colleague C**: Contends 0.30 is a fact about the model: 30% of past cases with an output of 0.30 developed the complication.  

  Address the following:  
  **(a)** Precisely state the reference class problem. Explain why it arises for *any* probability assigned to a single event, not only for frequentist interpretations. (5 marks)  
  **(b)** Explain why both Colleague A’s “broadest class” and Colleague B’s “most specific class” approaches are defective, yet each captures an important insight. In your answer, discuss the role of *homogeneity* (that further subdivision should not change the frequency) and what happens to homogeneity as the class is narrowed toward the single case. (7 marks)  
  **(c)** Does the reference class problem disappear if we interpret the 0.30 as a rational degree of belief (Bayesian interpretation) instead of a frequency? Defend your answer. (4 marks)  
  **(d)** Distinguish the reference class problem from (i) the base-rate fallacy and (ii) the claim that some events are objectively chancy. (4 marks)  
  **(e)** Take a stand: What must a satisfactory resolution of the reference class problem accomplish? Can the hospital’s 0.30 be defensibly interpreted as a probability? Finally, if the hospital adds a variable to the model and the output for this patient changes from 0.30 to 0.28, has the *probability* changed or has the *estimate* changed? Justify your answer. (5 marks)  

  ---

  ### Model Answer (Approx. 700 words)  
  **(a)** The reference class problem arises when assigning a probability to a singular event (e.g., this patient developing a complication) because the probability must be derived from a class of similar events, yet multiple valid reference classes exist, yielding conflicting probabilities. This is not limited to frequentism: even under non-frequency interpretations (e.g., Bayesian degrees of belief), probabilities require evidence based on a reference class. For instance, a Bayesian updating a belief about the patient must choose which prior data (reference class) to use. The problem is epistemic: it stems from the inherent ambiguity in defining "similarity" for the single case, making any probability assignment contingent on an arbitrary choice of class. Thus, it affects any interpretation where probability depends on evidence, as all evidence implicitly references a class.  

  **(b)** Colleague A’s “broadest class” approach uses the training data for stability but is defective because it ignores heterogeneity: the class may contain sub-groups with differing risks (e.g., patients with unobserved high-risk factors), making the frequency unrepresentative for the individual. However, it correctly prioritizes data richness to reduce statistical variance. Colleague B’s “most specific class” approach is defective because it demands a singleton (only this patient), reducing the probability to 0 or 1 and eliminating uncertainty altogether. Yet it rightly insists that a probability should reflect all relevant information to achieve homogeneity—where no further subdivision alters the frequency. As we narrow the class toward the singleton, homogeneity becomes trivial: a singleton is always homogeneous (as it cannot be subdivided), but this collapses probability into determinism, rendering it useless for prediction. Thus, while homogeneity is ideal, the quest for maximal specificity destroys the probabilistic framework by conflating it with certainty.  

  **(c)** The reference class problem persists under a Bayesian interpretation. A rational degree of belief (e.g., credence of 0.30) must still be grounded in evidence, which involves selecting a reference class for prior probabilities or likelihoods. For example, a Bayesian might use the training data (Colleague A’s class) as a prior, but this faces the same heterogeneity issues. Alternatively, conditioning on all known attributes (Colleague B’s approach) leads to a singleton, which cannot support a non-extreme degree of belief without additional assumptions (e.g., exchangeability). While Bayesianism allows subjective reference class choices, it does not resolve the arbitrariness; disagreements over evidence (e.g., which attributes are relevant) still yield conflicting probabilities. Thus, the problem shifts to justifying evidence selection but remains fundamentally unsolved.  

  **(d)**  
  (i) *Base-rate fallacy*: This is a reasoning error where base-rate information (e.g., overall complication frequency) is ignored in favor of specific evidence (e.g., a test result). The reference class problem is distinct: it concerns *which* base rate to use (e.g., overall frequency or a subgroup) before updating, not the neglect of a chosen base rate.  
  (ii) *Objective chance*: This is the metaphysical claim that some events (e.g., quantum events) are inherently random, independent of human knowledge. The reference class problem is epistemological, arising from incomplete information even for deterministic events. For example, the patient’s outcome may be determined by unknown factors, but we still need a reference class to quantify uncertainty—whereas objective chance implies no such class is needed.  

  **(e)** A satisfactory resolution must provide a principled method for selecting a reference class that balances specificity (to ensure relevance) and breadth (to ensure data adequacy), avoiding both underfitting (A) and overfitting (B). It should formalize how to identify "relevant" attributes for homogeneity without collapsing to a singleton. The hospital’s 0.30 can be defended pragmatically: if the model is well-calibrated (as Colleague C notes), 0.30 represents a frequency in a class defined by the model’s output, making it useful for decisions (e.g., risk thresholds). However, this is a partial defense, as it defines probability relative to the model, not the patient’s intrinsic properties.  

  Regarding the change from 0.30 to 0.28: The *estimate* has changed, but the *probability* has not. The probability, if objective, depends only on the patient’s attributes, which are fixed. The model’s output is an estimate based on incomplete data; adding a variable refines the estimate by improving the reference class (e.g., better approximating homogeneity). Thus, we have a more accurate estimate of the same underlying probability. To hold otherwise confuses the map (model) with the territory (patient).  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **General Notes:**  
  - **A-grade (18–25 marks)**: Comprehensive, precise, and insightful. Addresses all sub-parts with clear justification, avoids vagueness, and demonstrates deep understanding of the problem’s philosophical and practical aspects.  
  - **B-grade (14–17 marks)**: Covers main points but with minor gaps, inaccuracies, or weak justification. May lack depth in critique or distinctions.  
  - **Typical Errors**: See notes per part; overall, students often recite textbook definitions without engaging the scenario or hedging in (e).  

  **(a) State the problem (5 marks)**  
  - **A (5)**: Explicitly defines the problem as ambiguity in class choice for single events; explains it applies to any probability (e.g., belief or frequency) due to evidence dependence.  
  - **B (3–4)**: Defines problem but omits non-frequentist applicability or lacks precision on "any probability."  
  - *Typical error*: Treats it as only a frequentist issue.  

  **(b) Critique approaches and homogeneity (7 marks)**  
  - **A (6–7)**: Clearly defects A (ignores heterogeneity) and B (collapses to determinism); notes A’s stability and B’s relevance/homogeneity ideal; discusses how homogeneity degrades with specificity to triviality.  
  - **B (4–5)**: Identifies defects but superficially; mentions homogeneity but not its collapse.  
  - *Typical error*: Fails to explain why B’s "homogeneous singleton" invalidates probability.  

  **(c) Bayesian interpretation (4 marks)**  
  - **A (4)**: Argues problem persists: beliefs rely on evidence from a class, leading to arbitrariness.  
  - **B (2–3)**: States persistence but with weak defense (e.g., "beliefs are subjective").  
  - *Typical error*: Claims Bayesianism resolves the problem via subjectivity.  

  **(d) Distinctions (4 marks)**  
  - **A (4)**: Clearly separates (i) base-rate fallacy (ignoring rates) from reference class (choosing rates) and (ii) objective chance (metaphysical) from reference class (epistemological).  
  - **B (2–3)**: One distinction clear, the other muddled (e.g., confuses base-rate neglect with class choice).  
  - *Typical error*: Equates reference class with base-rate fallacy.  

  **(e) Stand and final part (5 marks)**  
  - **A (5)**: States resolution must balance specificity/breadth; defends 0.30 pragmatically (e.g., as calibrated output); unambiguously chooses "estimate changed" with justification (probability fixed, model improved).  
  - **B (3–4)**: Vague on resolution; weak defense of 0.30; non-committal or poorly justified on change.  
  - *Typical error*: Sits on the fence for the probability/estimate change.
