prompt: |-
  I'm a novelist, and for several years I've been circling a distinction I can feel but can't name, and I suspect it already has a name in a literature I don't know.

  Here is what I keep noticing. Certain people seem able to try things out in advance — to run a situation forward in their heads and let the bad versions die there instead of in the world. But when I look closely, the ability is nearly always attached to an object or a notation. The clinician I based a character on is superb at catching the rare presentation, but only with the checklist on the desk in front of her; without it she guesses, and her guesses are no better than mine. A student of mine revises beautifully when he reads his pages aloud and cannot revise at all in silence. Take the instrument away and what remains is not a slightly worse version of the same skill. It is a different and much older way of getting along: try it, see what happens, try it again.

  Then there is the opposite case, which is what really puzzles me. A boatbuilder I knew could do the whole thing internally — he could feel the hull before it existed, and he made almost no false starts. He was extraordinary, and he could not teach it. Every apprentice of his learned by ruining wood, and the gift died with him.

  So the capacity to learn without acting seems to come in two forms that look identical from the outside: one that lives in a person and cannot be handed on, and one that lives in a tool, can be handed on, and can also be taken away. That makes me distrust the ordinary way we rank people by how much they can work out in advance, because the ranking looks like it is measuring what is on the desk rather than who is sitting at it.

  Is there an established term for this? I don't mean tool use in general; crows and children use tools. I mean the specific case in which the simulating capacity itself is supplied by the artefact rather than merely assisted by it, together with the fall that follows when the artefact goes. If a term exists, tell me what it covers and what it leaves out. If none exists, coin one and define it, and tell me where the line falls between a skill that is genuinely someone's own and a skill that is only being rented — including the hard cases, like a surgeon who is nothing without her team, or me without my notebooks. I would rather have the boundaries than the label.

  Please answer in continuous prose: no headings, no bullet points, no bold, no tables — the way you would write a letter.
reasoning: |-
  Okay, the user is a novelist who's been grappling with a distinction they've observed but can't quite name. They describe two types of abilities: one where people can simulate outcomes in advance using tools (like a clinician with a checklist or a student reading aloud), and another where the ability seems innate and untransferable (like the boatbuilder who could visualize the hull internally). They're asking if there's a term for when the simulating capacity is supplied by an artifact rather than just assisted by it, and how to distinguish between skills that are genuinely someone's own versus those that are "rented."

  First, I need to understand the core of their query. They're noticing that some skills are deeply tied to external tools—remove the tool, and the skill collapses, reverting to trial-and-error. Other skills are internal, almost intuitive, but can't be taught. The novelist wants to know if there's a term for the tool-dependent simulation capacity and where to draw the line between internal versus external skill ownership.

  I recall concepts like distributed cognition, where thinking extends into the environment. Hutchins' work on navigation comes to mind—tools aren't just aids but integral parts of the cognitive process. Also, embodied cognition might be relevant, especially for the boatbuilder's internalized skill, where the knowledge is in the body, not explicit.

  The user mentioned cases like a surgeon relying on a team or themselves with notebooks. These are boundary cases. For the surgeon, the team is an extension of her skill set; without them, her capability diminishes, but it's not a complete loss because she could adapt, though less effectively. Compare that to the clinician without the checklist—her diagnostic ability drops to average. That's a sharper fall-off, suggesting the tool isn't just supporting but enabling the simulation.

  The novelist also wants boundaries, not just labels. So I need to articulate the thresholds: when does a tool shift from assistance to necessity? Factors include reproducibility (can others use the tool to achieve similar results?), fall-off quality (does removing it cause a steep decline or gradual?), and teachability. For internalized skills like the boatbuilder, the boundaries involve ineffability—can the knowledge be verbalized or only demonstrated through action?

  I should check if existing terms fit. "Cognitive offloading" is close but usually refers to memory aids, not simulation. "Extended mind" (Clark and Chalmers) might apply, but it's broad. The novelist’s examples show a dependency where the tool isn't just storing info but enabling a process that can't happen otherwise. That's key: the artifact provides the simulation capacity itself.

  Since no perfect term exists, I'll coin "simulational prosthesis." It captures that the tool acts as a prosthetic for mental simulation. For the internal skill, it's "embodied simulation," emphasizing physical intuition. Boundaries: a skill is "owned" if it persists without the tool, even diminished, and can be taught conceptually. If it vanishes without the tool and relies on the artifact's structure, it's prosthetic. Hard cases: the surgeon's team is a hybrid—partially owned (her expertise) but dependent on collaboration. Notebooks might be prosthetic if they structure thought, not just record.

  The novelist’s deeper need might be to accurately portray human expertise in their writing, avoiding clichés about innate talent. They might seek to explore themes of dependency, loss, or the fragility of knowledge. By clarifying this distinction, they can add depth to characters—e.g., a professional crippled without their tools versus one whose skill is inseparable from their being.

  Finally, structure the response as continuous prose, avoiding markdown. Start by acknowledging their observation, introduce the coined terms, define boundaries with examples, and address hard cases. Keep it fluid, like a letter, to match their literary style.
answer: |-
  What you're circling is indeed a profound and under-discussed fissure in how human cognition interfaces with the world. While no single term perfectly captures the precise duality you describe, the closest existing concepts are **distributed cognition** and **cognitive offloading**, particularly when pushed to their limits. Yet your observation about the *quality of the fall* – the stark difference between a merely assisted skill and one where the simulation capacity itself resides *in the artefact* – demands sharper distinction. Let me try to parse it.

  Distributed cognition (Hutchins) describes how cognitive processes spill out into the environment, involving tools, notations, and other people. Your clinician with her checklist exemplifies this beautifully. The checklist isn't just a reminder; it structures her diagnostic reasoning, guiding her through possibilities she might otherwise overlook. It externalizes the simulation algorithm. Remove it, and that structured simulation collapses back into intuitive pattern-matching (which, as you note, reverts to a more primitive "try and see" mode). Similarly, your student reading aloud externalizes the auditory feedback loop crucial for detecting rhythm and awkwardness; silence removes the simulation engine.

  The boatbuilder represents the other pole: **embodied cognition** or **tacit knowledge** (Polanyi). His simulation isn't distributed externally through notation or tool; it's internalized, sensory, kinesthetic. He "feels" the hull through accumulated physical experience woven into his neural and muscular fabric. This knowledge is *ineffable* – he can't easily decompose the steps or rules into a teachable checklist because the simulation happens below the level of conscious symbol manipulation. It *is* his own, profoundly, but locked within the specific matrix of his body and experience, hence its non-transferability.

  The critical boundary you seek lies in the **source of the simulation algorithm and the nature of the dependency**:

  1.  **Artefact-Supplied Simulation (Prosthetic Cognition):** Here, the *structure*, the *sequence*, the *algorithm* for running the mental model forward resides primarily in the artefact (checklist, notation, specific tool-use protocol, deliberate auditory feedback loop). The human operator learns to *execute* the simulation *using* this external structure. The skill is the effective coupling with the artefact. **The Fall:** Removing the artefact doesn't just slow the process; it fundamentally removes the simulation framework. What remains is raw intuition or trial-and-error, a qualitatively different (and often significantly less reliable or sophisticated) cognitive mode. The skill was never fully internalized *as an independent simulation algorithm*; it was leased via the tool.
      *   *Your Clinician:* Without the checklist's structure, the specific simulation of rare presentations vanishes.
      *   *Your Student:* Without the externalized auditory channel, the simulation detecting textual awkwardness fails to launch.
      *   *Is it "Rented"?* Essentially, yes. The capacity to simulate *in that specific, reliable, structured way* is contingent on the presence of the artefact. It's a partnership where the artefact provides the program.

  2.  **Internally-Embodied Simulation (Tacit Mastery):** Here, the simulation algorithm is encoded within the person's neural pathways, sensory systems, and muscle memory through vast, often unconscious, experience. The artefact (the wood, the chisel) is a *medium* for expression, not the *source* of the simulation logic. The boatbuilder *internally* models stresses, curves, and outcomes based on deep, embodied understanding. **The Fall:** Without the *medium* (wood), he cannot express it, but the internal simulation capacity remains intact. However, *transferring* this internal simulation to another is the near-impossible part because the "code" isn't symbolic or easily articulated; it's lived. The skill is profoundly "owned," but imprisoned.
      *   *The Boatbuilder:* His gift died with him not because the wood was taken away, but because the complex internal simulator couldn't be disassembled and taught.

  **Navigating the Hard Cases:**

  *   **The Surgeon Without Her Team:** This is complex distribution. Her core skill – anatomical knowledge, manual dexterity, decision-making under pressure – is largely internalized (tacit mastery). However, the *smooth execution* of complex procedures relies on a distributed system: the anesthetist maintaining homeostasis, the nurse anticipating instrument needs, the assistant providing exposure. Remove the team, and her *capacity* remains, but its *effective scope* and *efficiency* drastically reduce. She can simulate the surgery internally, but executing it solo on a complex case might be impossible or unsafe. It's a dependency that cripples *performance* but doesn't destroy the core simulation *capacity*. The fall is steep but not absolute; she could likely perform simpler procedures alone. The line falls between *core simulation capacity* (internal) and *operational effectiveness* (distributed).
  *   **You Without Your Notebooks:** Where is the simulation happening? If the notebooks are mere storage (names, dates, plot points recalled), their loss is data loss, not simulation loss. But if your notebooks are where you *work through* narrative structures – scribbling arrows, testing sequences, visualizing scenes – then they are the *prosthetic* for your plotting simulation. Remove them, and that structured, externalized simulation process falters. What remains might be bursts of inspiration or character insight (tacit/internal), but the ability to systematically run complex narrative scenarios forward might degrade significantly. Your "owned" skill is the insight and voice; the *systematic plotting simulation* might be more prosthetic.

  **A Proposed Term (if needed):** While "distributed cognition" covers much ground, the specific case where the simulation *algorithm itself* is externally supplied deserves emphasis. You could call it **Simulational Prosthesis**. It highlights the artefact's role as supplying the core simulation function that the user operates, and the dramatic loss when it's removed. "Prosthesis" implies both augmentation and dependency.

  **The Essence:** The boundary isn't merely about tool use, but about *where the cognitive program for the simulation resides*. Is the simulation algorithm running on the wetware (brain/body) of the person, honed by experience into tacit mastery (even if limited in transfer)? Or is the algorithm encoded in the structure of the artefact, with the person becoming a skilled executor of that external program? The fall reveals the truth: the collapse into a qualitatively different, less effective mode when the artefact is removed signals a *simulational prosthesis*. The persistent, adaptable (if perhaps diminished) core ability signals *internalized skill*, even if tragically locked within the individual. Your distrust of the ranking is wise; it often credits the prosthesis as if it were the person. The true measure lies in what remains when the external scaffolding falls away.
