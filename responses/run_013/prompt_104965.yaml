prompt: |-
  You're a philosopher of the social sciences who's good at carving concepts at the joints, so please think carefully and brainstorm a bit before you commit to an answer. I keep noticing a pattern and I dont know whether it has a proper name. Two examples. On the holiday-let site my sister uses, prices get pushed down, but not by some general market force — they're pushed down by whoever is most desperate for that week's booking, and once that host drops their rate everyone else has to match it or sit empty, so the going rate ends up being set by the most desperate person in the market. Second example: in a university department I know, the terms offered to new lecturers have been getting steadily worse, and it's always the candidate with no other offers who accepts them, which then becomes the benchmark the next round gets negotiated against. A mate of mine calls this 'the desperation ratchet', which I don't think is quite right, because sometimes it isn't desperation at all — sometimes it's just whoever cares least about the thing being competed over who ends up setting the standard for everyone else. So: is there an established concept for this? I know it's somewhere near a race to the bottom, near Gresham's law, and near adverse selection, but I want to know precisely how it differs from each of those, and whether it's really just a prisoner's dilemma with extra steps or whether the asymmetry — the worst, or least-invested, or most-desperate actor setting the level for everyone — makes it a genuinely different animal. And if nothing fits, coin me a term and tell me where its edges are, what it would and wouldn't cover. I'm not after a bare label, I want the carving.
