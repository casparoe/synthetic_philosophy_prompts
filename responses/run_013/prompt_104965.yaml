  Okay, let me try to unpack this user's query. They're describing a pattern where the most desperate or least invested participant in a market sets the standard everyone else has to follow. The examples are holiday rentals and academic job offers. The user mentioned terms like "desperation ratchet" but feels it's not quite right because sometimes it's about indifference rather than desperation. They want to know if there's an established concept for this.

  First, I need to recall related economic concepts. Race to the bottom? That's usually about deregulation to attract business, not individual desperation. Gresham's Law? Bad money driving out good—closer, but here it's about behavior setting a standard, not the quality of goods. Adverse selection? That's hidden information leading to market failure, like in insurance. Not a perfect fit either.

  Prisoner's Dilemma involves mutual defection being worse for everyone, but here the asymmetry is key. The user points out that the most desperate or indifferent actor sets the baseline. So it's not symmetric. The user wants to know if this asymmetry makes it distinct.

  Looking for existing terms... "Reservation price" is part of it but not the dynamic. "Price taker" in microeconomics describes participants who accept market prices, but again, doesn't capture the setting of the standard by the most desperate. Maybe "marginal seller" or "marginal buyer"? Those refer to the ones who set the price at the edge of the market. In the examples, the host with the lowest reservation price or the job candidate with no other options becomes the marginal actor, setting the new norm.

  The dynamic where each transaction sets a precedent for the next is a ratcheting effect. So combining "marginal" with "ratchet"? Marginal Precedent Ratchet? That emphasizes the precedent-setting and the downward pressure. But the "marginal" part needs clarification—it's the actor with the lowest threshold, not necessarily the average one.

  How does this differ from the other concepts? Race to the bottom is structural and policy-driven. Gresham's is about quality, not behavior. Adverse selection is about information asymmetry pre-transaction. Prisoner's Dilemma lacks the asymmetric precedent-setting. So this seems distinct.

  The user also mentioned cases where indifference, not desperation, drives the effect. The term should cover both. "Marginal" works because it's about the threshold, whether due to desperation or low valuation. The ratchet effect captures the irreversible steps downward. Precedent highlights how each instance sets a new baseline.

  Edge cases: Would this apply in auctions? Probably not, because the highest bidder wins, not the most desperate seller. Or in markets with differentiation, like luxury goods, where desperate sellers don't affect others. So the concept requires homogeneity, zero-sum competition, and precedent influence. That helps define its boundaries.

  The user wants precise carving. So the term needs to encapsulate the marginal actor, the ratcheting, and the precedent. Making sure it's not too broad. Marginal Threshold Ratchet? But "threshold" might be vague. Marginal Reservation Ratchet? Reservation price is the key economic term here. Or maybe just Marginal Precedent Ratchet as first thought.

  Also, considering if there's an existing term. "Desperation pricing" is ad hoc, not formal. "Price leadership" usually refers to dominant firms, not the most desperate. So coining a term seems necessary. The user's "desperation ratchet" is close but doesn't cover indifference. "Marginal" is more inclusive.

  Finally, explaining why this is different: the core is the precedent-setting by the actor with the lowest reservation threshold, leading to iterative lowering of standards. That's the unique combination here. The user's examples show a chain reaction where each concession becomes the new norm, driven by the most accommodating participant. That's the essence to capture.
answer: |-
  You've hit upon a deeply important, yet often undertheorized, dynamic in competitive social systems. Your instinct that it's *near* established concepts but distinct is spot-on. Let's carve it precisely.

  **The Core Dynamic:** A competitive system where the participant with the **lowest reservation threshold** (due to desperation, indifference, or low valuation) **sets the prevailing standard or price through a transaction, creating a binding precedent that lowers the threshold for all future participants in structurally similar positions.** This leads to an **iterative downward ratcheting** of the norm.

  **Why Existing Concepts Don't Quite Fit:**

  1.  **Race to the Bottom:**
      *   **Similarity:** Involves a downward spiral in standards/prices due to competition.
      *   **Difference:** A "Race to the Bottom" is typically driven by systemic pressures (e.g., jurisdictions deregulating to attract businesses, firms cutting corners to compete on price). It's often *structural and intentional*. Your dynamic is more *transactional and precedent-based*. It's not everyone racing *simultaneously*; it's the *action of the weakest/most indifferent participant at a specific moment* setting the new baseline *for the next round*. The "race" metaphor implies parallel effort; this is sequential precedent-setting.

  2.  **Gresham's Law ("Bad money drives out good"):**
      *   **Similarity:** Involves inferior standards driving out superior ones.
      *   **Difference:** Gresham's Law relies on a *fixed nominal equivalence* (e.g., debased and pure silver coins both legal tender at face value) and *asymmetric information* or *legal compulsion*. The "bad" drives out the "good" because they are *artificially valued the same*. In your dynamic, there's no fixed nominal equivalence forcing acceptance. Participants *voluntarily* match the lower standard because the precedent makes the higher standard *uncompetitive*, not legally equivalent. The driving force is competition based on precedent, not legal tender laws.

  3.  **Adverse Selection:**
      *   **Similarity:** Involves market degradation due to information asymmetry *before* a transaction occurs.
      *   **Difference:** Adverse Selection is about *hidden characteristics* of participants (e.g., sellers know a used car is a lemon, buyers don't) leading to market failure where only low-quality goods are offered. In your dynamic:
          *   The "problematic" characteristic (low reservation threshold) is *revealed through the transaction itself* (the host lowering the price, the candidate accepting the bad offer).
          *   The harm isn't primarily about hidden *quality* of the good/service/position, but about the *terms of the transaction* setting a harmful precedent for *future* transactions.
          *   The degradation happens *iteratively over time* based on revealed actions, not instantly due to pre-existing hidden information.

  4.  **Prisoner's Dilemma (PD):**
      *   **Similarity:** Involves individual incentives leading to collectively worse outcomes; resembles repeated PD.
      *   **Difference:** The core PD is *symmetrical* – both players face identical choices and payoffs. Your dynamic is fundamentally **asymmetrical**:
          *   **The Precedent-Setter:** One actor (the "marginal" one with the lowest reservation threshold) acts first, setting the new standard. Their payoff is often *immediate relief* (a booking, a job).
          *   **The Followers:** Others then face a *different* choice: match the new low standard or be excluded. Their payoff structure has been *changed by the precedent-setter's action*.
          *   **The Ratchet:** The collective harm emerges *sequentially* as each precedent lowers the floor for the next marginal actor, making it harder for anyone to hold out. PD payoffs are static; here, the payoff structure itself deteriorates over time based on past actions. It's a PD nested within a deteriorating system *caused* by the actions of the most vulnerable/indifferent participants.

  **The Gap & The Carving:** The unique core is the **asymmetrical setting of a binding competitive standard by the actor with the lowest reservation threshold in a sequential process, leading to iterative degradation.** Existing concepts capture elements (degradation, competition, asymmetry, information) but not this specific *mechanism* of *precedent-setting by the marginal participant* causing a *ratchet effect*.

  **Coined Concept: The Marginal Precedent Ratchet (MPR)**

  *   **Marginal:** Refers to the actor operating at the economic "margin" – the one with the lowest reservation price/willingness-to-accept (WTA) for sellers, or highest willingness-to-pay (WTP) for buyers in a reverse dynamic. This captures both desperation (high cost of *not* transacting) *and* indifference/low valuation (low cost of accepting poor terms).
  *   **Precedent:** Emphasizes that the *specific terms of the transaction involving this marginal actor* become the *de facto benchmark* for subsequent transactions. This precedent binds others not by law, but by competitive necessity.
  *   **Ratchet:** Captures the irreversible (or highly resistant) downward (or sometimes upward, depending on context) movement of the standard. Each step down becomes the new locked-in floor.

  **Edges of the Concept (What MPR Explains):**

  1.  **Requires Homogeneity & Zero-Sum Competition:** The goods/services/positions must be perceived as largely interchangeable (holiday lets in the same area, entry-level academic jobs). Competition must be primarily on price/terms, not differentiated quality. One actor's gain (a booking, a job) directly displaces another's opportunity.
  2.  **Requires Sequential Transactions & Precedent Influence:** The market operates through discrete transactions where past outcomes are visible and influence future expectations and bargaining positions. The "ratchet" clicks with each precedent-setting transaction.
  3.  **Driven by Reservation Threshold Asymmetry:** The key driver is variation in participants' WTA/WTP. The actor at the extreme low end (seller) or high end (buyer) *in that specific transaction window* sets the precedent. This threshold difference can stem from:
      *   **Desperation:** High urgency/cost of delay (e.g., empty week, unemployed candidate).
      *   **Indifference/Low Valuation:** Low perceived value/cost of concession (e.g., host who doesn't care about maximizing income, candidate who prioritizes location over salary).
      *   **High Alternatives:** (For buyers in a reverse MPR) A buyer with many options can force prices down.
  4.  **Causes Iterative Degradation:** The standard/price doesn't just fall once; it falls in steps, each locked in by the precedent of the most recent marginal transaction.
  5.  **Harm is Systemic & Future-Oriented:** The primary harm isn't necessarily to the *current* marginal actor (they got their transaction!), but to the *system* and *future participants* who now face a lowered standard. It erodes norms and collective welfare.

  **What MPR Would NOT Cover (Edge Cases):**

  1.  **Pure Price Discovery:** In thick, liquid markets with many buyers/sellers, a single marginal actor doesn't set precedent; the price converges based on aggregate supply/demand. MPR requires thinner markets or contexts where individual transactions are highly visible/influential.
  2.  **Differentiated Goods/Monopolistic Competition:** If products/jobs are unique (e.g., luxury goods, tenured professorships), the marginal actor's deal doesn't directly constrain others. Competition isn't primarily on price/terms alone.
  3.  **One-Time Shocks:** A sudden, massive drop due to an external event (recession, pandemic) isn't an MPR, unless it triggers a *sequence* of precedent-setting marginal transactions that ratchet down further.
  4.  **Coordination Problems without Marginal Precedent:** General collective action failures (e.g., tragedy of the commons) lack the specific mechanism of a marginal actor setting a binding precedent through a transaction.
  5.  **Upward Ratchets Driven by Scarcity:** While structurally similar (marginal actor with highest WTP setting a high precedent), this is less common and often labeled differently (e.g., bidding wars, inflation spirals). MPR is most salient for downward pressures.
  6.  **Adverse Selection *per se*:** While MPR can coexist with adverse selection (e.g., only desperate candidates apply because they know the terms are bad), MPR focuses on the *transaction setting the precedent*, not the pre-transaction hidden information causing market entry failure.

  **In Essence:** The **Marginal Precedent Ratchet** captures the insidious process where the "weakest link" (most desperate or least invested) in a chain of competitive transactions doesn't just lose out individually, but actively *pulls the entire chain down to their level*, step by step, locking in a lower standard for everyone who comes after. It's a distinct dynamic arising from the interplay of competition, asymmetry in reservation thresholds, and the power of precedent in sequential interactions. Your examples are textbook cases. Your mate's "desperation ratchet" is a good colloquial term, but "Marginal Precedent Ratchet" carves the concept at its joints, encompassing both desperation *and* indifference as drivers of the marginal actor's low threshold.
