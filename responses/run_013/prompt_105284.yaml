prompt: |-
  So I keep running into a thing in modelling work and I've never found a name for it. I do forecasting for a living and read econ on the side, plus enough climate and physics modelling to have noticed that the same move shows up in all of them.

  Here's the move. A model states an assumption everyone agrees is false — perfect information, no frictions, agents who never die, an infinite population, a smooth surface. Poke at it and you get some version of: we aren't claiming it's true, we're claiming the model's predictions are good, or good enough, or good in the range we care about. Fine, I'll take that. But then the same false assumption turns up in the explanation. The reason the effect happens, or the reason the intervention will work, is told as a story in which the assumption is doing the causal work. So it's a fiction I'm told to ignore and at the same time the description of the mechanism I'm supposed to believe. I can't tell if that's one problem or two.

  The other half of it: the status of the assumption gets settled after the fact. Prediction comes out right — it was a harmless simplification, nobody was ever claiming it was true, why are you hung up on it. Prediction comes out wrong — suddenly it's a substantive claim about the world that the data just falsified, which is interesting and publishable. Same assumption, opposite statuses, and which one it gets depends on how things turned out.

  I tried to make my own cut and I don't think it works. I've been calling them load-bearing vs. decorative, with a test: swap the assumption for something more realistic, and if the answer doesn't move it was decorative, if it moves it was load-bearing. But the whole point of the move above is that the answer can move and the assumption still gets waved through as decorative, so the test just restates the problem.

  For contrast, physics seems to do something different with this, though I can't articulate how. Assume a frictionless plane or an ideal gas and there's usually a story about why the missing piece is small, plus a procedure for adding it back if it isn't. That's a real defense. 'Predictions matter' is a different kind of defense, and I think it's the one that lets the flip happen.

  I know Friedman has the argument about judging theories by predictions rather than by whether the assumptions are realistic, and I know there's a general distinction between simplifying something away for tractability and making a claim about what matters in the world. Neither of those is quite the thing I'm describing. There's also a cousin I half recognize — when a prediction fails you get to pick which assumption to blame — but that seems to be about where the blame goes, not about whether the assumption even counts as a claim in the first place.

  So: does this have a name? If it doesn't, coin one, defined tightly enough to separate it from (a) plain simplifying assumptions, (b) the Friedman-style predictions-not-assumptions defense, and (c) just having a wrong model. And tell me whether the prediction half and the explanation half are one phenomenon or two, because I suspect they come apart — a model whose assumptions are pure fiction for prediction purposes might still be a fine explanation, or might be no explanation at all, and I can't tell which way anyone thinks it goes. I'd rather have a good carving with no name than a name that doesn't fit, so dont stop at the label.
reasoning: |-
  Okay, let me try to unpack this user's query. They're describing a recurring issue in modeling across fields like economics, climate science, and physics. The core problem is that models use assumptions everyone knows are false, but these assumptions are treated as both irrelevant for predictions and essential for explanations. The user also points out how the status of these assumptions changes based on the model's predictive success.

  First, I need to understand why this bothers them. They work in forecasting, so practical accuracy matters. But they also notice a disconnect between how assumptions are defended versus how they're used in explanatory stories. The inconsistency in how these assumptions are framed post-prediction seems like a major pain point.

  The user mentions Friedman's instrumentalism, which values predictions over realistic assumptions. But they feel this doesn't fully capture their concern. They want to distinguish between harmless simplifications and assumptions that secretly drive the model's behavior. Their load-bearing vs. decorative test didn't work because even when changing the assumption affects outcomes, it might still be dismissed as unimportant.

  Looking at physics examples, there's usually a justification for why the simplification is negligible, plus methods to add complexity back if needed. This contrasts with fields where the false assumption is central to the causal narrative but waved away when questioned.

  The challenge is to name and define this phenomenon. It should separate it from standard simplifications, Friedman's instrumentalism, and just having a wrong model. Also, need to address whether the predictive and explanatory inconsistencies are two issues or one.

  Considering terms like "causal smuggling" or "epistemic double-agent" might capture the dual role. "Flexible ontology" could describe how the assumption's status changes based on results. For the post-hoc status shift, "retroactive reification" or "contingent realism" might work.

  The deeper issue seems epistemological. In instrumentalism, assumptions aren't truth claims, but when they're used causally in explanations, they're treated as real. This tension between prediction and explanation is central. The post-hoc flipping exploits this ambiguity, treating the assumption as real only when convenient.

  The user might also be hinting at a lack of accountability in modeling practices. When predictions fail, modelers can distance themselves from assumptions; when they succeed, they take credit without defending the mechanisms. This affects trust in models, especially in policy contexts.

  I should also consider if different fields handle this better. Physics often has ways to quantify approximations, while economics might struggle due to complex human factors. The user's frustration likely stems from seeing this inconsistency undermine model credibility without a clear way to address it.

  Ultimately, defining this phenomenon requires capturing both the explanatory inconsistency and the post-hoc status change. They're two symptoms of the same issue: the ambiguous ontological status of assumptions in instrumental models. Providing a clear framework to identify and critique these practices would help the user and others in similar fields.
answer: |-
  This is a beautifully articulated critique of a pervasive and under-discussed phenomenon in modeling. You've identified a genuine gap in how we talk about model assumptions – one that straddles epistemology, rhetoric, and scientific practice. It's distinct from the concepts you mention (simplification, Friedman, model falsification), and deserves its own label.

  Here's a breakdown and proposed terminology:

  1.  **The Core Problem:**
      *   **The Inconsistency:** An assumption is explicitly *denied* ontological status ("it's not true, just a simplification") when defending the model's structure. Yet, the same assumption is implicitly *granted* ontological status ("this is *why* the effect happens") when providing the causal explanation derived from the model.
      *   **The Post-Hoc Flip:** The ontological status of the assumption (is it "just a tool" or "a claim about the world"?) is contingently defined *after* seeing the prediction's outcome, serving rhetorical defense rather than principled methodology.

  2.  **Why "Load-Bearing vs. Decorative" Fails (As You Note):**
      *   You're correct. The issue isn't whether changing the assumption *changes the output* (all core assumptions do that!). The issue is the *inconsistent epistemic framing* of the assumption: denied reality for defense, implied reality for explanation, and then re-defined post-hoc based on success/failure.

  3.  **Proposed Name & Definition:**
      *   **Term:** **Causal Ontological Smuggling (COS)** or **Epistemic Double-Agent Assumption (EDAA)**
      *   **Definition:** A modeling assumption that is explicitly framed as a non-realistic, instrumental simplification *for the purpose of tractability or model defense*, yet is simultaneously relied upon *as if it were a real causal factor* within the model's explanatory narrative. Its ontological status (real entity/process vs. mere calculational device) is ambiguous and often retroactively assigned based on the model's predictive performance.

  4.  **Carving Out Distinctions:**
      *   **(a) Plain Simplifying Assumption:** "Assume a spherical cow." Used for tractability. *Crucially*, the explanation of *why* the cow rolls down the hill doesn't fundamentally rely on its sphericity being a *real* property; we understand gravity and friction are the real causes, sphericity just makes the math easier. The *causal story* isn't smuggled in via the sphere. In COS/EDAA, the false assumption *is* integral to the causal story ("agents know prices *perfectly*, that's *why* they arbitrage instantly").
      *   **(b) Friedman's Instrumentalism:** Friedman argues we *only* judge models by predictions; assumptions are irrelevant fictions. COS/EDAA *violates* pure instrumentalism because the false assumption *isn't* treated as irrelevant fiction *within the explanatory context*. The modeler implicitly asks you to accept the causal story *built upon* the fiction as explanatory. Instrumentalism says "ignore the puppet strings"; COS/EDAA uses the puppet strings to explain the puppet's movement.
      *   **(c) Just Having a Wrong Model:** A model can be wrong because its core assumptions *are* intended as substantive claims and are falsified. That's straightforward falsification. COS/EDAA is characterized by the *strategic ambiguity* around whether the core assumption was *ever* intended as a substantive claim *until after* the prediction is tested. It exploits the space *between* instrumentalism and realism.

  5.  **The Physics Contrast:**
      *   You've pinpointed the key difference. Physics models usually offer:
          *   **Justification for Neglect:** "Friction is small *because* coefficient μ ≈ 0.01 here." (Quantitative reason).
          *   **Path to Correction:** "...and here's how to add the friction term if μ is larger." (Tractable extension).
          *   **Clear Separation:** The causal story (Newton's laws) doesn't fundamentally change; friction is an *additional*, quantifiable force. The idealization isn't smuggled into the core causal mechanism; it's a controlled omission.
      *   In COS/EDAA, the false assumption *is* the core mechanism ("perfect information *causes* efficient markets"), and the path to incorporating "imperfect information" often requires a *fundamentally different model structure*, not just adding a term. The justification for neglect is often vague ("it's a useful benchmark") rather than quantitative.

  6.  **Prediction Half vs. Explanation Half: One Phenomenon or Two?**
      *   **They are intrinsically linked symptoms of the same core phenomenon:** the **strategic ambiguity in the ontological commitment** to the assumption.
      *   **Prediction Success -> "Just a Tool":** To defend the model, the assumption is stripped of ontological weight. "The model worked *despite* the false assumption; the assumption wasn't the point."
      *   **Prediction Failure -> "Substantive Claim":** To explain failure *without* abandoning the core model structure, the assumption is suddenly imbued with ontological weight. "The model failed *because* the world doesn't have perfect information like we assumed! This falsifies the perfect information hypothesis!" (Often ignoring that *no one* believed it was true *until* it served as the scapegoat).
      *   **Explanation Reliance:** Regardless of prediction success/failure, the causal story *within the model framework* inherently relies on the truth of the assumption *for the model's internal logic*. The story only makes sense *if* agents are perfectly informed, surfaces are perfectly smooth, populations are infinite *within the model world*. The smuggling happens when this *internal* logic is presented as explaining the *external* world, without resolving the contradiction that the foundational premise is known to be false externally.
      *   **Conclusion:** The post-hoc status flip leverages the ambiguity created by the core inconsistency between the instrumental defense and the realistic explanation. It's one phenomenon manifesting in two contexts: model explanation (smuggling) and model defense (flipping). The flip exploits the smuggling.

  **Why This Matters & What To Do:**

  *   **COS/EDAA is problematic** because it hinders genuine understanding. It allows modelers to have it both ways: leverage the intuitive appeal of a causal story built on a premise while evading responsibility for that premise's falsity. It obscures what the model actually tells us about causal structure in the real world.
  *   **Diagnosis:** When analyzing a model, ask:
      1.  Is this assumption explicitly stated as false/unrealistic? (Defense)
      2.  Is this assumption nevertheless presented as a key *reason why* the model produces its result? (Explanation - Smuggling)
      3.  Has the status of this assumption (mere tool vs. substantive claim) *changed* based on whether predictions succeeded or failed? (Flip)
  *   **Remedy:** Demand clarity *upfront*:
      *   What *specific* causal work is this assumption doing in the model? (Be explicit about the smuggling).
      *   *Why* is this particular false assumption necessary for tractability? (Beyond "it's standard"). What realistic feature does it approximate, and how?
      *   What is the *quantitative justification* for neglecting the deviation from this assumption? (Like physics).
      *   What happens if we relax it *within the model structure*? Is there a path, or does the whole edifice collapse? (Reveals if it's truly load-bearing for the *causal story*, not just the output).
      *   What *other* assumptions could be blamed if the prediction fails? (Force acknowledgment of underdetermination).

  **In essence, you've identified "Causal Ontological Smuggling" (COS) or "Epistemic Double-Agent Assumptions" (EDAA) and its companion, the "Post-Hoc Ontological Flip."** This captures the core inconsistency in how the assumption's relationship to reality is framed: denied for defense, implied for explanation, and opportunistically redefined based on results. It's distinct from standard simplification, pure instrumentalism, or simple falsification precisely because of this strategic ambiguity and the smuggling of the false premise into the causal narrative. Physics often avoids it through stronger justification for neglect and clearer paths to realism. Your instinct that it's a single phenomenon with intertwined explanatory and defensive manifestations is correct.
