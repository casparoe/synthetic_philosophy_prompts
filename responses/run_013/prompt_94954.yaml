prompt: |-
  I'm in a little reading group on epistemic game theory — we're a mix of econ and philosophy grad students, so half of us are scared of the formalism and half of us are scared of the philosophy — and something our professor said has been bugging me for a week. He claimed that common knowledge of rationality gets you rationalizability (iterated deletion of strategies that are never a best response) but that it does *not* get you Nash equilibrium, and that to get Nash you need some extra condition about the players' conjectures being mutually known. I nodded, but honestly I think he's wrong, and I want to write out my argument and have someone shoot it down properly. Here's my reasoning: if each player is rational, she plays a best response to her beliefs. If rationality is common knowledge, then everyone knows everyone plays a best response, and knows that everyone knows it, and so on — so we iterate. And if the game has a *unique* Nash equilibrium, then surely that equilibrium is the only profile left standing at the end of the iteration, so common knowledge of rationality alone forces equilibrium play. (He also mumbled something about how in perfect-information games common knowledge of rationality doesn't obviously give you backward induction unless you read "rational" in a very particular way, which sounds insane to me, but that's a side issue.)

  What pushed me to actually type this up: our group built a tiny 2x2 game to test the argument, and now I can't tell if the game is bad or my proof is. Row chooses T or B, Column chooses L or R. Payoffs are (Row, Column): (T,L) = (1, 0); (T,R) = (0, 2); (B,L) = (0, 2); (B,R) = (2, 0). There's no pure-strategy equilibrium, and the unique mixed equilibrium is Row playing T with probability 1/2 and Column playing L with probability 2/3 (check my arithmetic, I did it fast). But every one of the four pure strategies is a best response to *some* belief about the other player — T is best against L, B against R, L against B, R against T — so nothing ever gets deleted, the iteration stalls immediately, and common knowledge of rationality appears to tell us precisely nothing about what to do. That can't be the whole story; there has to be a unique rational thing to do in a game with a unique equilibrium. So: where does my argument actually break, and why doesn't uniqueness of the equilibrium rescue it? I'd like you to act as my game theory tutor and be patient and explicit — first, in plain language, what common knowledge of rationality really buys you in a game like this; second, the exact step of my reasoning that's wrong and the mistake I'm making about what "uniqueness" is doing; third, what the extra condition for Nash equilibrium actually is and why it's not something you get for free from rationality, in the same spirit as the professor's "conjectures" remark. Please don't just tell me "Nash equilibrium is a mutual best response," I know the definition and it's not what I'm confused about — I want the epistemic story. Think it through carefully before you answer, and if my toy game is badly chosen for the point, say so and give me a better one.
reasoning: |-
  Okay, I see what's going on here. The user is grappling with a subtle point in epistemic game theory about why common knowledge of rationality (CKR) leads to rationalizability but not necessarily to Nash equilibrium. They've built a 2x2 game that nicely illustrates the issue, and they're frustrated because their intuition about unique Nash equilibria being forced by CKR seems contradicted by this example.

  First let me unpack their core confusion. They think that if a game has a unique Nash equilibrium, CKR should force players to play that equilibrium. But in their game: no pure Nash exists, mixed equilibrium is unique (Row T:1/2, Column L:2/3), yet all pure strategies survive iterated deletion. So their intuition clashes with the formalism. 

  Hmm... where their reasoning breaks is a fundamental misunderstanding about beliefs. CKR ensures players best-respond to their beliefs, but doesn't coordinate those beliefs. In their game, Row playing T is rational if she believes Column plays L, but Column playing L is only rational if he believes Row plays B - and these beliefs aren't mutually consistent. CKR doesn't require beliefs to be correct, only that they respect the knowledge hierarchy. 

  The uniqueness of Nash doesn't help because rationalizability operates on possible beliefs, not actual play. In fact, in this game the mixed strategies that survive are exactly those that can be rationalized by some beliefs. The Nash equilibrium requires more: it needs players' beliefs to be accurate (conjectures match actual play). 

  Their professor's point about mutual knowledge of conjectures is spot-on. For Nash we need common knowledge that everyone's beliefs are correct. In this game, if it were common knowledge that Row believes Column plays 2/3 L, and Column believes Row plays 1/2 T, and these beliefs were mutually known to be correct, then yes they'd play Nash. But CKR alone doesn't give us that.

  For the side issue about perfect-information games: backward induction requires not just rationality but that rationality is common knowledge at every subgame. If players doubt others' rationality even in unreached parts of the tree, they might defect from BI. So the professor was right - "rational" needs careful interpretation.

  I should explain this step by step: first why all strategies survive in their game under CKR, then why uniqueness of Nash doesn't compel play, then what extra ingredient Nash requires epistemically. Their game is actually perfect for illustration - no need to replace it. The key is emphasizing that rationalizability is about possible justifications, while Nash is about consistent alignment.
answer: |-
  Your confusion is deep and important—it cuts to the heart of what epistemic game theory reveals about rationality and equilibrium. Let's dissect this step-by-step, using your 2x2 game as a perfect illustration. I'll be explicit about where your reasoning breaks down, why uniqueness doesn't save it, and what extra condition bridges the gap to Nash.

  ### Your Game Payoff Matrix
  |          | Column L | Column R |
  |----------|----------|----------|
  | **Row T** | (1, 0)   | (0, 2)   |
  | **Row B** | (0, 2)   | (2, 0)   |

  - **No pure Nash equilibrium**: (T,L) → Column wants R; (T,R) → Row wants B; (B,L) → Row wants T; (B,R) → Column wants L.
  - **Unique mixed Nash**: Row plays T with prob. \( p = \frac{1}{2} \), Column plays L with prob. \( q = \frac{2}{3} \). (Your arithmetic is correct.)

  ---

  ### Step 1: What Common Knowledge of Rationality (CKR) *Actually* Buys You
  - **CKR means**: 
    1. All players are rational (each plays a best response to their beliefs about others).
    2. All players know (1).
    3. All players know (2), and so on ad infinitum.
  - **This implies rationalizability**: Iteratively delete strategies that are **never** a best response to *any* possible belief about opponents' play.  
    - *Why?* If a strategy isn't a best response to *any* belief, a rational player won't play it. CKR ensures everyone knows this, so such strategies are eliminated at step 1. Then, with fewer strategies for opponents, more may become never-best-responses, and so on.

  **In your game**:  
  - Row's best responses: Play T if she believes Column plays L (>50%); play B if she believes Column plays R (>50%).  
  - Column's best responses: Play L if he believes Row plays B (>50%); play R if he believes Row plays T (>50%).  
  - **No strategy is eliminated**: Each pure strategy *is* a best response to *some* belief (e.g., T best against L, L best against B, etc.).  
  - **Result under CKR**: All 4 pure strategies survive. Players will play *some* best response to their beliefs, but beliefs are unconstrained beyond not assuming irrationality.

  ---

  ### Step 2: Where Your Argument Breaks Down & Why Uniqueness Doesn't Save It
  - **Your claim**: "If the game has a unique Nash equilibrium, CKR forces equilibrium play."  
  - **Why it fails**:  
    - **CKR constrains *strategies*, not *beliefs***. Players must play a best response to *what they believe*, but their beliefs about others need not be correct.  
    - **Uniqueness of Nash doesn't force beliefs to align**: Even with a unique Nash, players can have *incorrect* beliefs justifying non-equilibrium play.  
      - *In your game*: Row might believe Column plays L (so she plays T). Column might believe Row plays B (so he plays L). Both are rational given their beliefs, but (T,L) isn't Nash!  
      - These beliefs are *inconsistent*: Row believes Column plays L, but Column only plays L if he believes Row plays B—which contradicts Row playing T. CKR doesn't prohibit this! It only ensures no player assumes *irrationality*; it doesn't require beliefs to be *mutually consistent* or *correct*.

  - **The deeper mistake**: You conflate **rationality** with **equilibrium**. Rationality is about responding optimally to *subjective beliefs*. Equilibrium requires *objective alignment* of strategies and beliefs. Uniqueness doesn't connect these two concepts—it just means only one alignment works. CKR doesn't force that alignment.

  ---

  ### Step 3: The Extra Condition for Nash (and Why It's Not Free)
  - **The professor's "conjectures" remark**:  
    To get Nash, you need **common knowledge of rationality** (CKR) **plus mutual knowledge of conjectures**.  
    - **Conjecture**: A player's belief about others' strategies.  
    - **Mutual knowledge of conjectures**: All players know each other's beliefs, all know that all know, etc.  
    - **Why this implies Nash**:  
      1. CKR → Each plays a best response to their conjecture.  
      2. Mutual knowledge of conjectures → Player 1 knows Player 2's conjecture, so Player 1 knows what Player 2 will play (since Player 2 is rational).  
      3. Thus, Player 1's conjecture about Player 2 *must match* Player 2's actual strategy.  
      4. Repeat for all players → Conjectures are correct, and strategies are mutual best responses → Nash equilibrium.

  - **Why this isn't free from CKR**:  
    - CKR ensures players best-respond to their *own* beliefs, but says nothing about whether beliefs match reality or others' beliefs.  
    - **In your game**:  
      - Under CKR alone: Row can believe "Column plays L" (so she plays T), while Column believes "Row plays B" (so he plays L). Beliefs are wrong and inconsistent.  
      - With mutual knowledge of conjectures: If Row knows Column's conjecture ("Row plays B"), she must play B (her best response to Column playing L). If Column knows Row's conjecture ("Column plays L"), he must play R (his best response to Row playing T). Conflict! The only consistent beliefs are the Nash conjectures: Row believes \( q = \frac{2}{3} \), Column believes \( p = \frac{1}{2} \).

  ---

  ### The Big Picture & a Better Example
  Your game is ideal for illustrating rationalizability vs. Nash. For backward induction (BI) in perfect-information games:  
  - CKR alone doesn't imply BI. Why? Players might believe others are irrational in unreached subgames, so they don't best-respond there.  
  - To get BI, you need **CKR + common belief in rationality at every subgame** (even off-path).  

  **A cleaner example**:  
  |          | L       | R       |
  |----------|---------|---------|
  | **T**    | (2, 1)  | (0, 0)  |
  | **B**    | (0, 0)  | (1, 2)  |
  - **Nash equilibria**: (T,L) and (B,R).  
  - **Rationalizable strategies**: All survive (T best against L, B best against R, L best against T, R best against B).  
  - **Under CKR alone**: Row could play T (believing Column plays L), Column could play R (believing Row plays B). Not Nash!  
  - **With mutual knowledge of conjectures**: Only Nash play survives. If Row knows Column's conjecture, she plays a best response to it *and* knows it matches Column's actual play.

  ---

  ### Conclusion
  - **CKR → Rationalizability**: Deletes strategies never best responses. In your game, nothing deletes.  
  - **CKR + mutual knowledge of conjectures → Nash**: Forces beliefs to be correct and consistent.  
  - **Why uniqueness doesn't help**: CKR doesn't coordinate beliefs. Unique Nash means only one belief-strategy alignment works, but CKR allows misaligned beliefs.  
  - **The epistemic gap**: Rationality governs *responses to beliefs*. Nash requires *alignment of beliefs and actions*. The latter needs players to know each other's minds—a stronger condition.

  You're wrestling with a profound insight: rationality alone doesn't create coordination. It only ensures you play optimally given your (possibly wrong) view of the world. Equilibrium requires that everyone's views are mutually consistent and correct—a much taller order. Your professor is right, and your game perfectly exposes why.
