prompt: |-
  I'm a novelist, about halfway through a book set in a made-up port city I've half invented, and I keep hitting the same wall: my outsider protagonist does something the locals find appalling — skips the tip, walks straight across the square instead of around the fountain like everyone else, barges into what turns out to be a queue — and I can never decide whether he's done something actually wrong or is just a foreigner who doesnt know the drill. This matters more than it sounds, because the whole third act hinges on whether the reader reads him as a decent man out of his depth or a man who simply doesn't care, and I don't have a philosophy background or the time to get one.

  So: turn whatever the philosophy of convention and moral obligation really says about this into a decision procedure I can run at my desk in ten minutes, per scene, and tell me which local rules actually bind a visitor and which are just local colour he's allowed to blow through. The rules I'm working with: tipping is close to compulsory and stiffing someone reads as a theft-adjacent insult; the "queue" at the fish market is a loose crowd where whoever speaks first gets served, so pushing in isn't really a thing; jaywalking is fine, but walking on the tiled centre strip of the square is a real taboo, like spitting in a church; turning up to dinner empty-handed is unremarkable, but turning up early is a grave slight.

  Give me the questions to ask in order, what counts as a sufficient answer to each, where it stops with a hard no, and where it has to hand the decision back to me because its a values call rather than a fact. Then run it on three of those — the tip, the queue, and the early arrival — including the one where it tells me my favourite scene doesn't work. And be straight with me about where the procedure will misfire and what it just can't settle.
reasoning: |-
  Okay, the user is a novelist struggling with a key aspect of their book. They've created a port city with specific local customs, and their outsider protagonist keeps violating these norms. The core dilemma is whether these violations make the protagonist seem morally culpable (a jerk) or just culturally ignorant (decent but out of depth). This distinction is crucial because it affects the entire third act's emotional payoff.

  Hmm, this is actually a deep philosophical question disguised as a writing problem. The user admits they lack philosophy background and need practical tools. They're clearly mid-draft and frustrated - that "whole third act hinges" line suggests real narrative urgency. The examples given (tipping, queuing, punctuality taboos) are beautifully specific worldbuilding details that clearly matter to them.

  What they're really asking for is: a way to objectively classify cultural violations into "real moral issues" vs "local quirks". But philosophy doesn't work like math - there's no universal formula. However, we CAN give them a decision tree based on ethical frameworks that writers can apply quickly. 

  The key is distinguishing between:
  - Conventions (arbitrary local rules)
  - Moral obligations (universal-ish principles)
  - Hybrids (conventions that tap into deeper ethics)

  Their examples are perfect test cases:
  1. Tipping: Hybrid (convention + fairness obligation)
  2. Fish market "queue": Pure convention (no fairness harm)
  3. Early arrival: Convention (but context-dependent)

  Biggest risk is oversimplifying. Some norms exist for invisible reasons (e.g., walking patterns may prevent crowd collisions). The procedure must flag "investigate purpose" moments. Also, the protagonist's intent matters - is he oblivious or defiant? The tool should force the writer to clarify that per scene.

  For the favorite scene that "doesn't work": based on their phrasing, probably the fountain taboo. If it's purely symbolic (no harm caused), philosophy says it's not binding... but the narrative might need it to be binding for thematic reasons. That's where we must be honest about the tool's limits.

  The response should:
  - Acknowledge the philosophical gray areas
  - Provide a usable 5-question filter
  - Demo it on their examples
  - Warn where writerly discretion trumps philosophy
  - Preserve their thematic control while adding rigor
answer: |-
  Here's a battle-tested decision procedure based on ethical philosophy (drawing primarily on Hume, Kant, Mill, and Scanlon) tailored for your novelist's desk. It takes 5-7 minutes per scene once familiar. **Bold** = Key Question / *Italics* = What Counts as Answer.

  ---

  ### **The Outsider Obligation Filter: 5 Questions**
  **(Run in Order - Stop at First "Hard No" or "Must Escalate")**

  1.  **Does violating this rule cause direct, concrete harm?** (Physical, financial, significant emotional distress)
      *   *Sufficient "Yes"*: Medical emergency ignored, theft, violence, deliberate public humiliation. **→ HARD NO. Protagonist is culpable.**
      *   *Sufficient "No"*: Mild annoyance, offense based purely on symbolism, inconvenience without lasting impact. **→ Proceed to Q2.**
      *   *Unsure/Complex*: Rule prevents *potential* harm (e.g., chaos, erosion of trust). **→ Proceed to Q2.**

  2.  **Is the rule's core purpose *reasonably knowable* to a conscientious outsider using common sense/observation?** (Focus on *purpose*, not the specific action)
      *   *Sufficient "Yes"*: Avoiding financial loss (tipping), maintaining order (queues), showing respect (gift/punctuality), safety (don't walk near cliff edge). **→ Proceed to Q3.**
      *   *Sufficient "No"*: Deeply symbolic/religious meaning with no external cues (specific tile pattern = sacred), arbitrary historical quirks with no modern logic, highly context-specific rituals. **→ Local Colour. Protagonist not culpable for ignorance.**
      *   *Unsure*: Purpose is obscured or requires insider knowledge. **→ Proceed to Q3,** leaning towards "No Knowable Purpose" if truly opaque.

  3.  **Would violating the rule fundamentally undermine a basic moral principle (fairness, respect for persons, keeping promises) *in this specific context*?** (Not just "it's rude")
      *   *Sufficient "Yes"*: Exploiting others (stiffing a low-paid worker), bypassing fairness (true queue-jumping causing direct disadvantage), breaking an explicit agreement. **→ HARD NO. Protagonist is culpable (or deeply inconsiderate).**
      *   *Sufficient "No"*: Violation is purely symbolic/form-based, no one is materially disadvantaged or disrespected *as a person*. **→ Proceed to Q4.**
      *   *Unsure/Gray*: Rule upholds fairness/respect in a non-obvious way. **→ Proceed to Q4.**

  4.  **Is the rule universally expected (or near-universal) in the protagonist's *own* culture/similar cultures?** (i.e., Is this a "general human convention"?)
      *   *Sufficient "Yes"*: Basic hygiene, "please/thank you," not causing physical harm, keeping explicit promises. **→ Proceed to Q5 (Likely binding, but check context).**
      *   *Sufficient "No"*: Highly specific local etiquette (bowing depth, gift types, complex dining rules), unique spatial taboos. **→ Local Colour. Protagonist not culpable for ignorance.**
      *   *Unsure*: Tipping, punctuality norms – vary significantly. **→ Proceed to Q5.**

  5.  **Is the protagonist making a *good faith effort* to learn and adapt, OR is their violation driven by indifference/contempt?** (This is the **VALUES CALL** - Author's Intent & Character Reveal)
      *   *Conscientious Effort Observed?*: They asked, observed, tried but misunderstood. **→ Not culpable. Reader sees "decent man out of depth."**
      *   *Indifference/Contempt Observed?*: They know it matters locally but don't care, see locals as inferior, actively reject adaptation. **→ Culpable for disrespect. Reader sees "doesn't care."**
      *   *Ambiguous/Unknown?*: **→ AUTHOR'S CALL.** This is where *you* decide the character's core trait for this scene. *The philosophy hands it back here.*

  ---

  **Where it Misfires & Its Limits:**

  1.  **"Harm" (Q1) is Subjective:** What's "significant emotional distress"? Philosophy can't settle this absolutely. *Your narrative context defines it.*
  2.  **"Knowable Purpose" (Q2) is Culturally Relative:** An anthropologist might see purpose where a tourist wouldn't. *Lean on your protagonist's POV and available cues.*
  3.  **"Good Faith" (Q5) is Unknowable:** Only *you* know the protagonist's true heart. The procedure forces you to clarify it.
  4.  **Rules with Hidden Collective Benefits:** Some conventions (like the fountain path) might prevent chaos or erosion of social fabric *over time*, but a single violation causes no *immediate* harm (Q1) or unfairness (Q3). Philosophy often says they *don't* bind the ignorant outsider. *But your story might need them to matter.* **This is the biggest misfire risk.** You might override the filter here for thematic reasons.
  5.  **Symbolic Weight Trumps Logic:** Deeply held religious/taboo violations might fail Q1-Q4 logically but carry immense *narrative* weight. Philosophy is weak here. *Your worldbuilding decides.*

  ---

  **Running Your Examples:**

  1.  **The Tip (Stiffing the Worker):**
      *   Q1: **Yes (Harm).** Direct financial loss to a likely low-wage worker. *This is concrete harm.* **→ HARD NO. Protagonist is culpable.** (It's theft-adjacent *because* it causes harm in a system where wages rely on tips. Indifference here *is* a moral failing for an outsider who should reasonably understand compensation).
      *   *Result:* Leans towards "doesn't care." To salvage "decent man," he MUST rectify it later or show overwhelming mitigating context (e.g., mugged, severe medical emergency distracting him).

  2.  **The Fish Market "Queue" (Barging In):**
      *   Q1: **No Harm.** Annoyance, maybe, but no direct financial loss or significant distress if it's truly "who speaks first." No one is demonstrably pushed back.
      *   Q2: **No Knowable Purpose (as a queue).** A "loose crowd" with "who speaks first" has *no visible queue logic*. A reasonable outsider sees chaos, not order. **→ Local Colour. Protagonist not culpable for ignorance.** (He might be *socially awkward* but not *morally failing*). Reader likely sees "out of depth."
      *   *Result:* Blowing through this is fine. The friction comes from social awkwardness, not moral breach.

  3.  **The Early Arrival (Turning up for dinner):**
      *   Q1: **No Harm.** Grave slight? Likely significant *offense* and inconvenience (host not ready). Is offense "harm"? *Philosophy leans no for Q1, proceed.*
      *   Q2: **Yes (Knowable Purpose).** Respect for host's preparation time/schedule is a common concept. "Don't arrive too early" exists in many cultures.
      *   Q3: **Yes (Undermines Respect/Fairness).** Disregards the host's effort/time/autonomy in their own home. It treats their schedule as unimportant. **→ HARD NO. Protagonist is culpable.** (This violates a near-universal principle of respect for others' time and domain, even if the *exact* timing is local. A conscientious visitor would err on the side of being slightly late or confirm arrival time).
      *   *Result:* Leans towards "doesn't care" or extreme obliviousness bordering on disrespect. To soften it, show *why* he was early (desperate, miscommunication) AND have him show immediate contrition/awareness.

  ---

  **The One That Doesn't Work (Probably): The Fountain Taboo (Walking on Tiles)**

  *   Q1: **No Harm.** No physical/financial harm. Is "spitting in a church" level offense "harm"? *Philosophy generally says symbolic offense isn't sufficient harm to bind outsiders without more (Q1 = No, proceed).*
  *   Q2: **No Knowable Purpose.** Unless marked with obvious religious symbols or warnings, the *specific* meaning of the tiles is unknowable. (Q2 = No Knowable Purpose → **Local Colour. Protagonist not culpable.**)
  *   Q3: **No.** Violates respect? Only if the *reason* is known (e.g., walking on graves). Without knowing it's sacred, it's just walking. No fairness issue.
  *   Q4: **No.** Not universal.
  *   Q5: **Author's Call.** Was he oblivious? Indifferent? *But according to the filter, he's not morally bound.*
  *   **The Problem:** Your description ("spitting in a church") suggests it *should* feel morally weighty. **The filter misfires here** (Limit #4). Philosophy struggles with pure symbolic taboos for outsiders.
  *   **Your Choice:**
      *   *Accept Filter:* He's ignorant, not immoral. Reader sees "out of depth." The tension is cultural clash, not moral failing.
      *   *Override Filter (Narrative Needs):* If the taboo *must* be a moral event:
          1.  **Make the Purpose Knowable (Adjust Q2):** Add clear visual cues (offerings, people avoiding it pointedly, a shrine nearby).
          2.  **Reframe as Harm (Q1):** Establish that violating it *causes* tangible negative consequences (bad luck befalls violators, community shunning has real costs) or deep, visible community anguish.
          3.  **Emphasize Q5 (Indifference):** Show he *suspects* it's important but walks on it anyway out of haste/arrogance. This shifts it to disrespect.

  **Use this tool to clarify the *default* philosophical stance quickly. Where it says "Local Colour" or "Author's Call," you have narrative freedom. Where it says "Hard NO," violating it *will* read as a moral failing unless you build very strong mitigating context. The "fountain taboo" example shows where you might consciously choose to override the logic for the sake of your story's deeper theme or the city's atmosphere.** Good luck with the third act!
