prompt: |-
  I'm in my third year and taking a philosophy of science module — the realism/anti-realism one, lots of stuff about models, idealisation, whether theories latch onto anything real. My seminar tutor has this line he reaches for whenever anyone presses him on whether a model is actually describing what's going on: "all models are wrong; some models are useful". He used it again this week when I asked whether a model that gets the causal story back to front but predicts the data beautifully is explaining anything or just fitting it, and he said it like that settled the question — of course it's wrong, they all are, that's not the interesting bit. I don't think he's stupid, so I assume he means something by it, but I genuinely can't tell what.

  What's made it worse is that for my essay I've been reading alot about verisimilitude — the idea that a false theory can still be nearer to or further from the truth than another false theory, and the two broad ways people have tried to make "nearer" precise: one that compares theories by their consequences (roughly, more true consequences and fewer false ones counts as closer), and one that treats the truth as a point in some space of possibilities and measures how far off a theory sits from it. Both of those seem to be about exactly what his one-liner is about, and yet almost none of the readings I can squeeze out of the one-liner look like either of them.

  So: can you seperate out the precise claims that sentence could be making, from the flat trivial ones (a model is an idealisation, nothing is a perfect copy of anything) through the ones that are real positions somebody could hold and defend (instrumentalism about theories, the pragmatist thing where useful just means true, the thought that "wrong" comes in degrees, maybe some kind of structural realism?) down to any that are just false or self-undermining — and then for each one tell me whether it would actually license what he did with it, which was to shut down a question about whether a model explains? I'd like a menu, but I don't want to be left to pick from it: commit. Tell me which reading you think he's actually running, which readings you think are dead on arrival and why, and where the issue is genuinely contested say which way you'd come down anyway. And please write it as plain continuous prose — no headings, no bullet points, no bold, no tables, the way you'd write an email — because I'm copying it straight into my notes and anything with structure in it gets mangled.
