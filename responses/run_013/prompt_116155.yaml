prompt: |-
  I run the data work at a small scholarship nonprofit, and we can fund only a fixed number of applicants each year. Our community advisory board insists that among applicants who would in fact go on to succeed, a student from an under-resourced high school must be no less likely to be funded than one from a well-resourced high school; our principal funder insists that a given score must mean the same thing in both groups — that it carry the same probability of later success — so nobody can claim the number has been inflated for one side. Students from the two kinds of school differ a good deal in how often they actually do go on to succeed. Two wrinkles: our outcome label is whether the student completed a degree, which is itself partly produced by the support they get after high school, so I am unsure it is the neutral yardstick the whole argument assumes; and a colleague treats the difficulty as a technicality, proposing that we simply drop the high school variable from the model and run a lottery among the borderline cases. What should I recommend to the board — which of the two demands should we give up, what do we owe the side we disappoint, and is my colleague's fix as good as he thinks? Lead with your bottom line in the first sentence, then give the reasoning; no preamble, and don't restate my question. If I have misdescribed the bind — if these two demands are in fact compatible, or if our label is compromised enough to make the question moot — say so plainly rather than working around my framing.
reasoning: |-
  Hmm, the user is running data work at a small scholarship nonprofit and facing a dilemma about fairness in funding allocation. They need to balance two competing demands: their community advisory board wants no disadvantage for under-resourced high school students who would succeed, while their principal funder insists that the same score must predict the same success probability across groups. They also have concerns about their outcome label (degree completion) being influenced by external factors and a colleague suggesting a simple solution of dropping the high school variable.

  The core issue here revolves around fairness in algorithm design. The community advisory board's demand aligns with equal opportunity (where qualified candidates have equal chance of selection), while the funder's demand aligns with predictive parity (where scores are equally predictive across groups). These two definitions are mathematically incompatible when base success rates differ between groups, which the user confirms is the case here. I should explain this incompatibility clearly.

  The outcome label is problematic too. Degree completion depends on post-funding support, so it's not a neutral measure of student potential. This means the "success" definition itself might be biased against under-resourced students who face systemic barriers even after selection. Both fairness demands rely on this flawed metric.

  The colleague's solution - dropping high school information and using a lottery for borderline cases - doesn't solve the underlying incompatibility. Removing the variable would likely reduce model accuracy and might unintentionally introduce bias. Lotteries add randomness but don't address the fundamental tension between the two fairness criteria.

  I'll structure my response by leading with the bottom line: they must choose one fairness definition to prioritize. Then I'll explain the incompatibility, critique the outcome label, and explain why the colleague's solution doesn't work. I'll also suggest what they owe to whichever side they disappoint - either justifying the choice based on mission alignment or offering transparency and mitigation strategies. Since the user asked for no preamble, I'll dive straight into the recommendation.
answer: |-
  **You must choose which fairness definition to prioritize, as they are incompatible given differing success rates; drop the funder's demand to uphold your community board's requirement, but acknowledge the outcome label's flaws and reject your colleague's fix as insufficient.**  

  The two demands—equal opportunity (your board's demand that qualified students from under-resourced schools are funded at no lower rate) and predictive parity (your funder's demand that scores mean the same success probability across groups)—cannot simultaneously hold when success rates differ between groups. This is a mathematical incompatibility under real-world disparities.  

  ### Key reasoning:  
  1. **Incompatibility of Demands**:  
     - If students from under-resourced schools succeed at lower rates *due to systemic barriers* (e.g., less college support), forcing predictive parity would require *inflating scores* for well-resourced applicants to make the same score predict the same outcome. This violates your board's demand by making it harder for qualified under-resourced students to be selected.  
     - Conversely, enforcing equal opportunity requires accepting that a given score *may predict different success probabilities* across groups, as systemic factors beyond the score (e.g., post-funding support) affect outcomes. This breaks predictive parity.  

  2. **Flawed Outcome Label**:  
     - Degree completion is *not* a neutral yardstick. It conflates student potential with systemic factors (e.g., financial instability, lack of mentorship). If under-resourced students succeed less often *due to these factors*, using this label entrenches bias. Your funder's demand implicitly treats the score as "innate ability," ignoring that success depends on support your scholarship aims to provide.  

  3. **Why Your Colleague's Fix Fails**:  
     - Dropping the high school variable ignores underlying distributional differences. A model without this feature may still learn proxies (e.g., zip codes, extracurriculars), worsening covert bias.  
     - A borderline-case lottery *only* addresses selection fairness at the threshold, not the core tension. It does nothing to resolve the incompatibility of the two demands or the label's bias.  

  ### What to Prioritize and What You Owe:  
  - **Choose your board's demand**: It aligns with your mission to rectify opportunity gaps. Funding qualified under-resourced students equally is ethical, even if their success rates are lower *due to unmet systemic needs*.  
  - **What you owe the funder**: Transparency that predictive parity is unachievable without harming equity. Explain that scores reflect pre-opportunity potential, not post-opportunity success under unequal systems. Offer rigorous impact tracking (e.g., how funding closes success gaps) to justify trust.  
  - **Address the label**: Acknowledge its limitations openly. Supplement with intermediate metrics (e.g., college persistence, GPA) to capture near-term impact.  

  ### Final Recommendation:  
  Reject both the funder's predictive parity demand (it's mathematically incompatible and morally misaligned) and your colleague's fix (it's a band-aid). Uphold your board's demand, but overhaul outcome measurement to isolate scholarship impact from systemic barriers.
