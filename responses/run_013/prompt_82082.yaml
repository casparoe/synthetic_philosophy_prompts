prompt: |-
  Two colleagues of mine spent most of a workshop discussion arguing about whether the Darwinian framework genuinely applies to culture. I was in the audience and took no side, and I would like the exchange adjudicated rather than settled by fiat.

  The first, a selectionist, argued that Darwinian explanation requires only variation, heritability, and differential transmission. Culture supplies all three: songs, sayings, rituals, and beliefs differ from one another; some spread far more widely than others; and much of what spreads is learned from other people, so differences are carried down lineages. On that basis she was willing to call cultural items replicators and to treat their frequencies as shaped by selection. She conceded that transmission is noisy, but held that the conditions usually demanded of a replicator — copying fidelity, fecundity, longevity — are matters of degree, and that where fidelity is low the remedy is to look for larger and more robust units of transmission rather than to abandon the framework.

  The second, an attraction theorist, replied that the analogy fails at heritability rather than at fidelity. On his account, a person who learns a tune or retells a story does not copy it but reconstructs it out of her own expectations, and the errors are not random with respect to content: they are pulled repeatedly toward the same few forms, which is why the same variants turn up in lineages that have had no contact with one another. Where variation is directed toward attractors, he said, the observed distribution of cultural forms is explained by the attractors themselves, and differential reproduction does no work. He added a second objection: no one has produced a principled way of individuating a meme, and without items whose frequencies can be tracked, talk of selection lacks a well-defined subject.

  She answered that directed variation does not abolish selection; it constrains the variation on which selection operates, much as mutational bias constrains genetic evolution without replacing it. She also said the individuation objection proves too much, since species are equally contested as units and population biology proceeds regardless. He answered that the two cases are not parallel: genetic evolution is variational, with variation arising first and being sorted afterwards, whereas cultural transmission is transformational, the mutation being produced by the very process that explains the endpoint — and where a law-like transformer is available, selection is not merely bounded but unnecessary. She replied that a selection coefficient for a cultural variant is measurable in principle once a transmission channel is specified, so his objection marks an empirical gap rather than a conceptual one. Neither of them budged.

  Adjudicate this exchange move by move. For each move, rate it on a scale running from clearly mistaken to clearly right, with a brief justification, and say who bears the burden of proof at that point. Then say what the disagreement is really about: whether it is a substantive disagreement about how culture changes, a disagreement about what a Darwinian explanation is required to contain, or a terminological dispute about how loosely the word selection may be used. Finally, identify what both parties are missing — including what would count as decisive evidence for either position, and whether either side's position can be maintained in the form in which it was actually stated.
reasoning: |-
  Okay, let me approach this step by step. The user presents a detailed debate between two colleagues about applying Darwinian frameworks to culture, seeking adjudication rather than simple answers. 

  First, I need to unpack the core arguments. The selectionist focuses on three minimal requirements: variation, heritability, and differential transmission in cultural elements like songs or rituals. Her position seems rooted in universal selection theory, where imperfect copying doesn't invalidate the model. The attraction theorist counters that cultural transmission involves reconstruction toward cognitive attractors, making differential reproduction irrelevant. His transformational view sees content biases as primary drivers.

  The user's request has multiple layers: they want move-by-move analysis, burden-of-proof assessment, classification of disagreement type, and identification of missing elements. This suggests deep methodological curiosity - likely an academic wanting tools to analyze similar debates. The neutral framing ("adjudicated rather than settled by fiat") implies aversion to oversimplification.

  For each exchange point:
  - The selectionist's "minimal criteria" argument holds merit but underestimates attractor effects. Rating: Mostly right, though burden shifts to her on handling directed variation.
  - The attraction theorist's "reconstruction not copying" claim is empirically supported by cognitive studies, but overstates the death of selection. Rating: Partly right but overreaching.
  - Their meme individuation objection is valid but not unique to culture. Rating: Right in essence but weak as a framework-killer.
  - Her constraint-vs-replacement rebuttal wisely distinguishes mutational bias from selection. Rating: Strong point.
  - His transformational/variational dichotomy oversimplifies - cultural change isn't purely transformational. Rating: Mistaken binary.

  The real disagreement seems twofold: substantive (how cultural change works) and methodological (how strictly to define Darwinism). Both miss that cultural evolution likely combines selection and attraction, with the balance depending on domain. Decisive evidence would come from experiments isolating transmission channels (e.g., chain experiments with/without content biases) or phylogenetic analyses of unrelated lineages converging.

  Neither position survives unscathed: selectionism needs to account for reconstruction biases, attraction theory must explain why some variants spread despite not being attractors. The user might benefit from recognizing this as a false dichotomy - contemporary cultural evolution theory already integrates both.
answer: |-
  Here's a move-by-move adjudication of the exchange, followed by an analysis of the core disagreement and what both parties are missing:

  **Adjudication of Moves:**

  1.  **Selectionist's Opening Argument (Variation, Heritability, Differential Transmission):**
      *   **Rating:** **Mostly Right.** She correctly identifies the *minimal* conditions for a Darwinian process (variation, inheritance, differential fitness). Culture demonstrably exhibits these: variation exists (different songs/rituals), transmission occurs (learning), and some variants spread more than others.
      *   **Justification:** Hull's generalized selection theory and Dawkins' concept of the "replicator" explicitly argue for these minimal conditions being sufficient. Imperfect copying (low fidelity) is acknowledged within evolutionary biology (e.g., high mutation rates).
      *   **Burden of Proof:** Shifts to the Attraction Theorist to demonstrate why these conditions are *insufficient* for a Darwinian process in culture, despite meeting the formal criteria.

  2.  **Attraction Theorist's First Objection (Failure at Heritability/Reconstruction & Attractors):**
      *   **Rating:** **Partly Right, Partly Overstated/Misplaced.**
          *   *Reconstruction/Attractors:* **Partially Right & Important.** He correctly identifies a critical difference: cultural transmission often involves *reconstructive* processes guided by cognitive biases, schemas, and attractors, leading to *non-random*, *directed* variation. This *is* a significant departure from the random mutation assumption often associated with genetics. Evidence from transmission chain experiments (e.g., Bartlett, Mesoudi) strongly supports this.
          *   *Failure at Heritability:* **Misplaced/Overstated.** Claiming this means heritability *fails* is too strong. Transmission still occurs; descendants resemble ancestors more than non-ancestors *on average*, even if with systematic biases ("inheritance with modification + bias"). The *mechanism* differs (reconstruction vs. template copying), but descent with modification still happens. Heritability (in the broad sense of traits influencing descendant traits) isn't abolished.
      *   **Justification:** While reconstruction and attractors are crucial phenomena challenging simple copying models, they don't negate the existence of descent lineages or differential success. They change the *nature* of variation and inheritance, not their existence.
      *   **Burden of Proof:** Remains on the Attraction Theorist to demonstrate that attractors *completely explain* distributions and make differential success irrelevant, and to show why descent with modification isn't occurring.

  3.  **Attraction Theorist's Second Objection (Meme Individuation Problem):**
      *   **Rating:** **Right in Fact, Weak as Framework-Killer.**
      *   **Justification:** Individuating discrete, stable "memes" *is* notoriously difficult and often arbitrary (e.g., where does one meme end and another begin in a complex idea?). This is a valid practical and conceptual challenge for *some* models (especially strong "particulate meme" views).
      *   **Burden of Proof:** Shifts to the Selectionist to address the individuation problem or demonstrate a workable solution for their specific analysis.
      *   **Caveat:** While a serious problem, it doesn't inherently invalidate the *whole* Darwinian framework. Biologists track frequencies of often-fuzzy traits (e.g., behavioral phenotypes, quantitative traits). Selection can operate on variable, overlapping units. The burden is to define units pragmatically for a specific question.

  4.  **Selectionist's Reply to Attractors (Constraint, Not Replacement):**
      *   **Rating:** **Clearly Right.**
      *   **Justification:** Evolutionary biology readily incorporates *biased variation* (e.g., mutation bias, developmental constraints). Selection acts *on* the variation presented to it, whatever its source or bias. Attractors shaping variation *constrain* what selection can act upon but do not eliminate the role of differential success in determining which variants, *among those generated or pulled towards attractors*, actually spread and persist. A variant pulled towards an attractor still needs to be adopted and transmitted.
      *   **Burden of Proof:** Shifts decisively back to the Attraction Theorist to demonstrate that selection (differential success based on consequences) plays *no role* once attractors are considered.

  5.  **Selectionist's Reply to Individuation (Parallel to Species Problem):**
      *   **Rating:** **Mostly Right.**
      *   **Justification:** The "species problem" is real in biology – defining the fundamental unit of evolution is complex and debated. Yet, population biology progresses by defining operational units relevant to the question (genes, alleles, populations, phenotypes). Similarly, cultural evolutionists can define units pragmatically (e.g., specific ritual actions, wordings of proverbs, technological features) for specific analyses without requiring perfect, universal "memes".
      *   **Burden of Proof:** The Selectionist has reasonably countered the objection. The Attraction Theorist needs a stronger argument for why the cultural case is *fundamentally* different and intractable compared to fuzzy units in biology.

  6.  **Attraction Theorist's Reply (Variational vs. Transformational Evolution):**
      *   **Rating:** **Mistaken Dichotomy / Overreach.**
      *   **Justification:** While distinguishing variational (selection acting on pre-existing variation) and transformational (directed change of individuals) processes is insightful, framing cultural change as *purely* transformational is incorrect. The "mutation" (new variant generation/reconstruction) and the "sorting" (differential transmission success) in culture are often intertwined and difficult to separate cleanly, but both processes occur. Many cultural changes *result* from the differential success of variants generated through biased reconstruction. Claiming a "law-like transformer" makes selection unnecessary ignores that the *outcome* of the transformation process (which variants are reconstructed *and* transmitted successfully) can still depend on selective pressures (e.g., utility, social conformity, ease of recall *after* reconstruction).
      *   **Burden of Proof:** Heavily on the Attraction Theorist to demonstrate that *all* cultural change is transformational and that selective consequences play *zero* role in determining which variants persist.

  7.  **Selectionist's Final Reply (Measurable Selection Coefficients):**
      *   **Rating:** **Clearly Right (in principle).**
      *   **Justification:** Her core point is correct. Defining a transmission channel (e.g., learning a skill from a master, retelling a story within a community) allows for measuring the relative success (fitness) of different variants *within that channel*. If attractors influence the *generation* of variants entering that channel, that's a separate factor influencing the variation *available* for selection. Measuring selection coefficients for cultural variants *is* challenging but conceptually possible and empirically done (e.g., tracking popularity of baby names, diffusion of innovations, changes in word usage).
      *   **Burden of Proof:** The Attraction Theorist needs empirical evidence showing that in specific cases, measured selection coefficients are negligible or irrelevant compared to the power of attractors shaping the variants *before* transmission success is measured.

  **What the Disagreement is Really About:**

  The disagreement is **primarily substantive** (about the actual mechanisms driving cultural change), but it is **intimately tied to a methodological disagreement** about the necessary and sufficient conditions for applying a Darwinian framework.

  1.  **Substantive Core:** Does cultural change primarily result from:
      *   **(Selectionist):** The differential success and spread of variants generated (often with biases/attractors) within lineages of cultural transmission? (Selection + Constrained Variation)
      *   **(Attraction Theorist):** The repeated, independent transformation of cultural information towards specific pre-existing cognitive attractors, making differential lineage success largely irrelevant? (Attractors as Primary Driver)
  2.  **Methodological Core:** Does a Darwinian explanation *require* only variation, inheritance, and differential fitness (Selectionist), or does it *also require* that variation is undirected/"random" *relative to the selective pressure* and that inheritance involves high-fidelity replication (Attraction Theorist's implicit demand)?

  The Attraction Theorist is imposing stricter criteria (random variation, high-fidelity replication) derived from a specific (often genetic) model onto the broader Darwinian framework, which the Selectionist, following generalized selection theory, rejects as unnecessary. This is **not purely terminological** about "selection," but about the **scope and applicability of the core Darwinian logic.**

  **What Both Parties Are Missing & Decisive Evidence:**

  1.  **Missing Integration:** Both treat "selection" and "attractors" as largely mutually exclusive explanations. They miss that **cultural evolution is likely a multi-level process**:
      *   **Attractors/Cognitive Biases:** Shape the *generation and reconstruction* of cultural variants (the "mutation" process), making certain variants much more likely to arise or be reconstructed.
      *   **Selective Pressures:** Act *on* this biased pool of variants *during transmission and adoption*. Factors like utility, social prestige, compatibility, ease of communication, and emotional resonance influence which variants (even those near attractors) are actually adopted, retained, and passed on *differentially*.
      *   **Drift:** Random changes also play a role, especially in small populations or neutral traits.
      *   **The units and dynamics depend heavily on the domain:** The balance of forces differs vastly for copying a tool-making technique vs. remembering a story vs. adopting a fashion trend.

  2.  **Decisive Evidence:**
      *   **For Selectionist Framework (Differential Success Matters):** Demonstrating cases where cultural variants demonstrably *less* cognitively attractive (harder to remember, counter-intuitive) spread *because* of selective advantages (e.g., signaling group membership, perceived efficacy, mandated by authority). Phylogenetic analyses showing branching lineages *despite* attractors. Quantitative measures of selection coefficients significantly different from zero.
      *   **For Attraction Theory (Attractors Dominate):** Demonstrating cases where widely different starting points consistently converge *independently* onto the same cultural form (strong attractor) across multiple lineages *without* evidence of differential transmission success playing a role. Showing that the distribution of variants is predicted *entirely* by the attractor landscape, with no residual variance explained by transmission history or selective consequences. Transmission experiments where reconstructed variants show no differential success based on external factors, only reconstruction bias.
      *   **Critical Test:** Carefully designed transmission chain experiments that:
          1.  Manipulate the strength of potential attractors (e.g., simplicity, emotional valence).
          2.  Manipulate potential selective pressures (e.g., rewarding transmission of specific variants, adding social influence cues).
          3.  Track both the *direction* of change (towards attractors?) and the *differential success* of variants *within* chains/simulations. Results showing strong attractor effects *plus* significant effects of manipulated selective pressures would support integration. Results showing selective pressures have *no* effect beyond attractors would support the strong Attraction Theorist position.

  3.  **Can Their Stated Positions Be Maintained?**
      *   **Selectionist (Minimal Criteria):** Yes, in its *generalized* form. However, ignoring the profound role of attractors/cognitive biases in shaping variation would render the explanation incomplete and potentially misleading for many cultural phenomena. The framework *can* incorporate them as constraints.
      *   **Attraction Theorist (Heritability Fails / Transformational Only):** **No, not strictly as stated.** The claim that heritability *fails* is too strong; descent with (biased) modification exists. Framing cultural change as *purely* transformational ignores the demonstrable role of differential success in many cases. His strongest point is that attractors *can be* the dominant force, making differential success negligible *in specific instances*, but claiming this is *universally* true is unsustainable. The individuation objection, while valid, is a practical challenge, not a fatal flaw.

  **Conclusion:** The Selectionist's core argument for the *applicability* of a generalized Darwinian framework (variation, inheritance, differential fitness) to culture is sound. However, the Attraction Theorist correctly highlights that the *mechanisms* generating variation (reconstruction, attractors) are profoundly different from the genetic model and often dominant. The disagreement is primarily substantive about the balance of forces in cultural change, exacerbated by the Attraction Theorist imposing overly strict genetic criteria on the Darwinian framework. Neither pure selectionism nor pure attractionism is likely sufficient; the most productive path forward is integrating cognitive biases (attractors) as key shapers of variation within a broader framework that also recognizes the role of differential transmission success (selection) and other forces.
