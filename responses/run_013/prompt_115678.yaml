prompt: |-
  I'm trying to get clear on the wrong kind of reasons problem before I read any more about it, and I want the requirements list first, before any theory. So here's the target: an account that says, for any attitude and any consideration, whether that consideration is a reason of the right kind -- the kind that bears on whether the attitude is fitting (correct, appropriate, whatever word you like) -- or a reason of the wrong kind, the kind that might make it useful or prudent to have the attitude without touching its fittingness. What does such an account have to deliver? I want the cases it has to get right, with the case behind each requirement; the distinctions it cant collapse; and anything it has to stay consistent with. Then tell me which of those requirements can't all be satisfied at once, if any.

  Two things I especially want it to handle. First, a case I keep getting stuck on: suppose its established that being confident you'll pass an exam actually raises your chance of passing, something about stress and sleep. A doctor offers you a pill that makes you confident with no new evidence. Taking the pill seems clearly worth it -- but does the fact that the confidence helps give you a reason to be confident? And here's the part that bothers me: if you know the confidence raises your odds, doesn't that itself become evidence that you'll pass, and so a right-kind reason after all? I want to know whether the account has to rule that out, and how. Second, the symmetry issue: for every consideration that looks wrong-kind for some attitude there's usually a matching consideration that's right-kind for a neighboring attitude -- the same fact is a reason to want to be confident, wrong-kind for the confidence. So if the account just says wrong-kind reasons don't bear on the object, how does it keep the two apart without going in a circle?

  Also mark which requirements are forced and which are just what one camp wants, and be explicit about what's settled versus what people who work on this genuinely disagree about -- dont sell me a contested view as the consensus. No reading list needed. Write it as continuous prose, no headings, bullets, bold, or tables, like an email. American English.
reasoning: |-
  Okay, the user is diving deep into the wrong kind of reasons (WKR) problem and wants a clear, requirement-first approach before engaging with theories. They're specifically stuck on two things: an exam confidence pill case where pragmatic benefits might masquerade as evidence, and the symmetry issue where the same fact seems to be WKR for one attitude but RKR for another (e.g., wanting to be confident).  

  First, I need to map out what any successful WKR/RKR distinction must handle. The core challenge is separating considerations that bear on an attitude's fittingness (e.g., evidence for belief, admirable traits for admiration) from those that merely make the attitude advantageous (e.g., bribes to believe, threats for admiration). The user’s exam case is tricky because the confidence-boosting effect *could* become genuine evidence—so the account must block this collapse without cheating.  

  The requirements fall into three buckets:  
  1. **Case constraints**: Must correctly classify paradigm cases. For example:  
     - Bribes/threats (WKR for belief/admiration) must stay WKR.  
     - Evidence (RKR for belief) and admirability (RKR for admiration) must stay RKR.  
     - The exam pill case must either rule the confidence-boosting fact as WKR *or* explain why it accidentally counts as RKR (but the user likely wants the former).  
  2. **Structural constraints**:  
     - The symmetry issue: Same fact (e.g., "confidence helps me pass") must be WKR for confidence but RKR for *wanting* confidence. The distinction can’t rely on circular "because it’s about the attitude itself"—that’s contested.  
     - No overgeneration: If all pragmatic benefits infected attitudes with fittingness, RKR would collapse (e.g., "I’m paid to believe P" would make P true).  
  3. **Theoretical guardrails**:  
     - The account must work for pro-attitudes (desire, intention) and con-attitudes (blame, fear), not just belief.  
     - It should avoid presupposing what fittingness *is* (e.g., truth for belief, goodness for desire) since that’s debated.  

  Now, the user’s pain points:  
  - **Exam case**: If the confidence-boosting fact becomes self-fulfilling evidence, does that turn WKR into RKR? A good account must either (a) deny it’s evidence (e.g., by separating higher-order evidence from direct grounds) or (b) bite the bullet and call it RKR—but that risks making all WKR self-undermining. Most theorists want (a).  
  - **Symmetry**: The standard move is to say WKR bear on the *costs of having the attitude*, while RKR bear on the *object*. But this can feel circular ("why is the object what matters?"). Some accounts (e.g., "reasons as evidence") struggle here; others (e.g., "fitting-attitude analyses") lean on the object/attitude divide.  

  Where’s the controversy?  
  - **Settled**: Everyone agrees WKR exist (bribes aren’t evidence). Everyone needs to handle the cases above.  
  - **Unsettled**:  
    - Whether RKR must be "object-given" (some say yes, others say that’s circular).  
    - Whether the exam-pill fact is WKR (most say yes, but it’s contentious).  
    - How to define "object" for non-belief attitudes (e.g., is the object of admiration the person or the trait?).  

  Can all requirements be satisfied? Almost certainly not—the symmetry problem exposes a tension. If RKR are defined by relating to the attitude’s object, but "object" is defined by what RKR target, it’s circular. Solutions either break the circle (e.g., via independent norms) or accept primitive fittingness. That’s the heart of the debate.  

  For the user’s exam case: I’ll argue that the confidence-boosting fact is *not* RKR because it doesn’t directly bear on passing the exam—it’s about the *effects of confidence*. Even if it becomes evidence, it’s higher-order (evidence about evidence), not direct. But this is where theories clash.
answer: |-
  Here’s a clear breakdown of what any account distinguishing right-kind reasons (RKR) from wrong-kind reasons (WKR) must deliver, based on the established philosophical problem and your specific concerns. I’ll lay out requirements, cases they address, constraints, tensions, and where consensus ends—flagging contested points explicitly. Your exam confidence case and symmetry issue are central, so I’ll tackle them directly within the framework.

  ### Core Requirements
  1. **Must handle paradigm cases correctly**:  
     - **WKR cases**: A demon threatens to torture you unless you admire a mediocre artist. The threat is a reason to *want* to admire or *cultivate* admiration, but intuitively not a reason *for* admiration itself. Similarly, a bribe to believe something false (e.g., "$1 million to believe 2+2=5") is a reason to *try* to believe, but not a reason justifying the belief. The account must classify these as WKR—they don’t make the attitude fitting.  
     - **RKR cases**: Evidence that a cliff is dangerous is a RKR for fear; evidence of a friend’s betrayal is a RKR for resentment; a person’s kindness is a RKR for admiration. These directly bear on whether the attitude accurately reflects its object.  

  2. **Must resolve your exam confidence case**:  
     The fact that confidence raises your chance of passing *might* seem to give a RKR for confidence if it becomes self-fulfilling evidence. But the account must either:  
     - **Rule this out**: Show why the confidence-boosting effect is still WKR (e.g., it’s about the *consequences* of confidence, not evidence for the content "I will pass").  
     - **Accept it as RKR**: But this would implausibly turn all instrumental benefits into RKR (e.g., if a bribed belief improved your health, the bribe might "become" evidence). Most theorists see this as a reductio, so the account *should* classify this as WKR. Requirement: **Avoid conflating practical benefits with fittingness grounds.**  

  3. **Must respect the symmetry issue**:  
     For every WKR targeting an attitude A, there’s a parallel RKR for a "neighboring" attitude B (e.g., the threat is WKR for admiration but RKR for desiring-to-admire). The account must:  
     - Explain why the *same consideration* (e.g., "confidence raises pass rates") is:  
       - **WKR for confidence** (it doesn’t make confidence fitting; it makes confidence useful).  
       - **RKR for wanting confidence** (it directly makes wanting confidence prudent).  
     - **Avoid circularity**: Can’t just say "WKR aren’t about A’s object" if "the object" is defined as what RKR target. A non-circular distinction is needed (e.g., tying RKR to the *standards internal* to the attitude).  

  4. **Must generalize across attitudes**:  
     Works for beliefs (RKR = evidence), emotions (RKR = danger for fear), desires (RKR = desirability features), and pro-attitudes like intention. Consistency test: If a consideration is RKR for one attitude, it shouldn’t become WKR for another without explanation.  

  5. **Must not collapse fittingness with prudence/desirability**:  
     Even if an attitude is beneficial, that benefit shouldn’t automatically make it fitting. The account must preserve a gap: e.g., believing a useful falsehood isn’t epistemically justified.  

  6. **Must avoid overgeneration**:  
     If all practical reasons could "infect" fittingness (as in your exam case), RKR collapse into WKR. The account must block this.  

  ### Constraints & Tensions  
  - **Forced requirements**: Handling paradigm cases (1) and avoiding fittingness/prudence collapse (5) are non-negotiable; rejecting these undermines the WKR problem itself.  
  - **Contested but widely held**: Resolving the symmetry issue (3) without circularity is a benchmark for success, but some accounts (e.g., "reasons as evidence") struggle here.  
  - **Settled vs. contested**:  
    - **Settled**: WKR exist (bribes aren’t reasons for belief). RKR are tied to the attitude’s "correctness conditions" (truth for belief, worthiness for admiration).  
    - **Contested**: *Why* WKR aren’t fittingness reasons. Proposals include:  
      - **Object-given vs. state-given**: RKR are about the attitude’s object (e.g., the cliff for fear), WKR about the attitude itself. Critics call this circular if "object" isn’t independently defined.  
      - **Constitutivist**: RKR flow from what the attitude *is* (e.g., belief aims at truth). Critics say this doesn’t generalize (what does admiration "aim" at?).  
      - **Scalar accounts**: RKR affect *how much* of an attitude is fitting (e.g., stronger evidence warrants stronger belief), WKR don’t. But this struggles with attitudes lacking degrees (e.g., blame).  

  ### Can all requirements be satisfied?  
  Not uncontroversially. Your exam case exposes the tension: If the confidence-boosting fact *is* evidence you’ll pass (because it raises probability), it seems to become RKR—violating (5) and (6). But if the account *denies* it’s RKR, it must explain why this "evidence" doesn’t count. Most theorists insist it’s WKR, arguing:  
  - The fact is *about confidence*, not the exam’s content. It’s higher-order evidence ("confidence helps") not first-order evidence ("I’m prepared").  
  - It only provides reasons to *cause* confidence, not to *justify* it.  
  Still, this relies on distinguishing types of evidence—which some reject. The symmetry issue amplifies the tension: If "confidence helps" is RKR for *desiring confidence*, but not for *being confident*, the account must ground this asymmetry without presupposing the distinction. "Object-based" accounts often do this by fiat, inviting charges of circularity.  

  Bottom line: Any viable account must classify your exam case as WKR, resolve symmetry non-circularly, and prevent fittingness/prudence collapse—but no existing solution achieves this without contentious moves. The debate centers on *how* to satisfy these while explaining *why* RKR are distinct. If you dive into theories, watch how they handle your exam pill: it’s a litmus test.
