prompt: |-
  I chair the standing novel-technologies panel of a regional environmental regulator. We meet roughly monthly and issue written recommendations — gene drives, new classes of persistent pesticide, field trials of reflective-particle dispersal, engineered organisms for bioremediation — and every recommendation is published, is appealable, and can be pulled apart under freedom-of-information law. The panel is an ecologist, an economist, a lawyer and a lay member, and I am the only one who has read any philosophy at all; I came to this by way of the rationality blogs rather than a law degree. My difficulty is that we are nominally required to apply the precautionary principle, and the phrase in our statute is the weak formulation — that uncertainty is not by itself a reason to postpone protective action — while half the panel reads it as the strong one, on which the proponent must demonstrate safety before anything may proceed. I have watched us reach opposite conclusions on near-identical files purely according to which reading the chair happened to hold that morning, and I have watched us invoke the principle to avoid a decision we simply found uncomfortable.

  What I want from you is a reusable decision procedure I can actually run in the room: the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the matter to a person because the question is one of values rather than evidence. It has to operate at the scale of a single decision rather than a national policy, and it has to survive the objections that have always dogged this principle — that it is either vacuous (it forbids nothing in particular) or paralytic (it forbids everything), that it shifts a burden of proof without saying onto whom or how heavy, that it quietly ignores the harms of inaction and of the substitute technology, and that it treats a speculative catastrophe as though it were an established one. Please build in, explicitly: the distinction between prevention, which addresses a known risk, and precaution, which addresses uncertainty or outright ignorance; a test that forces the same precautionary reasoning to be run against inaction and against the alternative, so that two-sidedness is not optional; and some treatment of reversibility, on the familiar bind that a technology's effects are least knowable exactly when it is most malleable and best knowable when it is most entrenched. I also want you to be honest about which steps are judgement calls dressed up as procedure. Then run it on three files: a gene drive intended to crash an invasive rodent population on an island whose seabird colonies are the reason for intervening; a novel broad-spectrum insecticide with a new mode of action and unknown persistence; and a small outdoor trial of a reflective-particle dispersal method. At least one of the three should come out in a way I will not like, and you should say why I will not like it and why the procedure nevertheless returns that answer. Close by telling me what the procedure cannot do, and where it will misfire.

  Give the procedure first as prose, then as a single JSON object with these fields: "steps", an array of objects each with "step" (integer), "question" (string), "sufficient_answer" (string), "if_insufficient" (one of "stop-no", "delegate", "next") and "judgement_call" (boolean); "applications", an array of objects each with "case" (string), "verdict" (one of "allow", "allow-with-conditions", "defer", "refuse"), "decisive_step" (integer), "who_decides" (string) and "notes" (string); "cannot_settle", an array of strings; and "failure_modes", an array of strings.
reasoning: |-
  We are designing a decision procedure that incorporates the weak precautionary principle and addresses common criticisms. The procedure must:
  1. Distinguish between prevention (known risks) and precaution (uncertainty/ignorance).
  2. Apply precautionary reasoning symmetrically to action and inaction (including alternatives).
  3. Consider reversibility.
  4. Be executable in a single meeting, for a specific decision (not national policy).
  5. Survive objections (vacuousness, paralysis, burden of proof, ignoring inaction/substitute harms, treating speculative catastrophes as established).

  The procedure will be a step-by-step flow. Steps that are judgment calls will be flagged.

  **Proposed Decision Procedure in Prose:**

  **Step 0: Define the Proposal and Alternatives**
  - Clearly state the proposed technology or intervention, the problem it addresses, and the alternative actions (including inaction and substitute technologies). 
  - Question: "What is the proposed action, the problem it addresses, and what are the alternative actions (including inaction and substitute technologies)?"

  **Step 1: Known Harms Assessment (Prevention)**
  - Assess the known harms of the proposed action and of each alternative (including inaction). 
  - Question: "For the proposed action and each alternative (including inaction), what are the known harms (with evidence) and their magnitude, probability, and affected populations?"
  - Sufficient answer: A comparative assessment of known harms for each option, using available evidence. If insufficient (e.g., incomplete data), proceed to Step 2 but note the gap.
  - This step is about established risks (prevention). If known harms of an option are severe and highly probable, that option may be ruled out at this stage.

  **Step 2: Uncertainty and Ignorance Mapping (Precaution)**
  - Identify areas of uncertainty and ignorance for the proposed action and each alternative. This includes unknown harms and the possibility of catastrophic outcomes.
  - Question: "For each option, what are the key uncertainties and areas of ignorance regarding potential harms? Are there plausible pathways to catastrophic outcomes?"
  - Sufficient answer: A description of the unknown risks for each option, including worst-case scenarios and the level of uncertainty (e.g., low, medium, high confidence in the assessment). If insufficient (e.g., no consideration of catastrophic scenarios), we cannot proceed without this analysis.

  **Step 3: Symmetrical Precautionary Burden**
  - Apply the precautionary principle symmetrically: for each option (proposed action and alternatives), ask whether the uncertainty/ignorance is so great that it warrants precautionary restraint. This step avoids the trap of only applying precaution to the new technology.
  - Question: "Given the uncertainties and ignorance identified in Step 2, does the level of uncertainty for any option (including inaction) pose a threat of serious or irreversible harm such that precautionary restraint is warranted? If so, for which options?"
  - Sufficient answer: A clear identification of which options are subject to precautionary restraint and why. The weak principle applies: uncertainty alone is not a reason to postpone action, but if the potential harm is serious/irreversible and the causal link is plausible (even if uncertain), then protective action (which might mean choosing a different option) is required.
  - Judgment call: Deciding what constitutes "serious or irreversible harm" and the plausibility of the causal link.

  **Step 4: Reversibility and Monitoring Assessment**
  - For the proposed action and each alternative, assess the reversibility of harms and the feasibility of monitoring and early intervention.
  - Question: "For each option, how reversible are the potential harms? How feasible is monitoring to detect harms early, and how effective are the available interventions to halt or reverse the harms if detected?"
  - Sufficient answer: An assessment of reversibility and monitoring for each option. This step is critical because a technology that is irreversible and hard to monitor may require more precaution.

  **Step 5: Decision Synthesis**
  - Weigh the evidence from Steps 1-4. The goal is to choose the option that minimizes overall harm, including both known harms and precautionary concerns. The weak precautionary principle does not require absolute safety but does require that uncertainty not be a sole reason for inaction when there are known harms from inaction.
  - Question: "Considering the known harms (Step 1), the precautionary concerns (Step 3), and the reversibility (Step 4), which option minimizes the overall expected harm? Are there conditions (e.g., phased implementation, monitoring, exit triggers) that could mitigate the risks of the best option?"
  - Judgment call: Balancing the factors. The panel must use its best judgment to weigh the risks and choose an option.

  **Step 6: Conditions and Monitoring Plan**
  - If the decision is to allow (with conditions) or defer, specify the conditions and monitoring required.
  - Question: "If we are allowing the proposal (or an alternative) with conditions, what specific conditions (e.g., scope, monitoring, exit triggers) must be attached? If deferring, what information is required and how will it be obtained?"

  **Stopping Rules:**
  - At any step, if the evidence shows that an option has known harms that are clearly unacceptable (e.g., severe and highly probable) compared to others, that option is rejected (stop-no for that option). But note: we are comparing options. The procedure might reject the proposal but accept an alternative.
  - If at Step 3 the precautionary burden is triggered for an option, that option may be ruled out (stop-no) if the uncertainty is too high and the potential harm too severe and irreversible, and if there are better options.
  - If at Step 5 the panel cannot agree because the decision hinges on value judgments (e.g., how to weigh environmental harm vs. economic harm), then delegate to a higher authority or public consultation (delegate).
  - The procedure may also stop with a refusal if no option is acceptable.

  **Running the Cases:**

  We'll apply the procedure to three cases. The procedure must be applied symmetrically and one outcome must be unfavorable to the chair.

  **Case 1: Gene Drive for Invasive Rodents on an Island**
  - Proposal: Release a gene drive to crash invasive rodent population to protect seabird colonies.
  - Alternatives: Inaction (continued rodent predation), traditional trapping/poisoning, other biological controls.

  **Case 2: Novel Broad-Spectrum Insecticide**
  - Proposal: Approve a novel broad-spectrum insecticide with a new mode of action and unknown persistence.
  - Alternatives: Inaction (pest damage), existing insecticides, integrated pest management.

  **Case 3: Outdoor Trial of Reflective-Particle Dispersal**
  - Proposal: Conduct a small outdoor trial of reflective-particle dispersal for solar radiation management.
  - Alternatives: Inaction (no trial, continue climate change), other geoengineering trials, emission reductions.

  **Case 1: Gene Drive**

  Step 0: Proposal is gene drive to crash rodents. Problem: invasive rodents eating seabird eggs. Alternatives: inaction (seabird decline), trapping/poisoning (which may harm non-target species), other biocontrols.

  Step 1: Known harms:
  - Gene drive: potential for non-target effects if rodents leave island? But on an island, containment is better. Known: could crash rodent population, leading to ecosystem changes? But seabirds should recover.
  - Inaction: known harm - continued seabird decline and possible extinctions.
  - Trapping/poisoning: known to harm non-target species (e.g., birds that eat poisoned rodents) and may require repeated application.

  Step 2: Uncertainty:
  - Gene drive: uncertainty about long-term ecological effects, possibility of gene drive spreading beyond island (low, but catastrophic if it does), and potential for resistance evolution.
  - Inaction: uncertainty about how fast seabird colonies will collapse, but trend is clear.
  - Trapping/poisoning: less uncertainty, but known non-target effects.

  Step 3: Precautionary burden:
  - Gene drive: uncertainty about off-island spread (low probability but catastrophic) and irreversible. This might trigger precautionary restraint.
  - Inaction: irreversible harm (extinction of seabirds) is certain over time.
  - Trapping/poisoning: harms are reversible (if stopped) but non-target effects are known and may be severe.

  Step 4: Reversibility:
  - Gene drive: irreversible if released and spreads beyond island. On island, if drive fails, population rebounds. Monitoring: difficult to recall if released.
  - Inaction: irreversible (extinctions).
  - Trapping/poisoning: reversible if stopped, but harm to non-target species may be irreversible (deaths).

  Step 5: Synthesis:
  - Inaction has known, severe, and irreversible harms. Trapping/poisoning has known harms but reversible in the sense that stopping stops new harm. Gene drive has potential for catastrophic harm but low probability. However, the irreversible nature of gene drive if it escapes is a major concern. The weak precautionary principle says uncertainty alone isn't a reason to postpone, but here the uncertainty is about a catastrophic outcome. The panel might decide that the gene drive is too risky because of irreversibility and uncertainty, and choose trapping/poisoning despite its non-target effects. They might also consider that the gene drive, if contained, is more effective and long-lasting. But if the panel is precautionary, they may refuse the gene drive and allow trapping with strict non-target mitigation. 

  Verdict: Refuse gene drive, allow trapping with conditions (non-target protections). Why the chair might not like it: Chair might believe gene drive is the best long-term solution and that the island containment is sufficient.

  **Case 2: Novel Insecticide**

  Step 0: Proposal: approve novel insecticide. Problem: pest control. Alternatives: inaction (crop losses), existing insecticides (which may have resistance or known harms), IPM.

  Step 1: Known harms:
  - Novel insecticide: unknown (because new) but broad-spectrum so likely to harm non-target insects.
  - Inaction: known economic harm to farmers.
  - Existing insecticides: known harms (e.g., to pollinators, aquatic life).
  - IPM: may be less effective in short term.

  Step 2: Uncertainty:
  - Novel insecticide: high uncertainty about persistence and non-target effects, especially on pollinators and aquatic systems. Potential for catastrophic pollinator collapse if persistent and toxic.
  - Inaction: uncertainty about the extent of crop losses, but known to occur.
  - Existing insecticides: known harms, but less uncertainty.

  Step 3: Precautionary burden:
  - Novel insecticide: high uncertainty and potential for serious irreversible harm (pollinator collapse) → precautionary restraint warranted.
  - Inaction: known harms but not catastrophic at the scale of ecosystem collapse (usually).
  - Existing insecticides: known harms, but manageable? 

  Step 4: Reversibility:
  - Novel insecticide: if persistent, irreversible contamination of soil/water. Monitoring possible but hard to reverse once released.
  - Inaction: reversible (if you act later).
  - Existing insecticides: some are reversible, some persistent.

  Step 5: Synthesis:
  - The novel insecticide has high uncertainty and potential for irreversible harm. Precautionary restraint is triggered. The panel may refuse approval until more data (e.g., on persistence and non-target effects) is available. They might allow a small-scale field trial with monitoring? But the proposal is for approval, not trial. So defer for more data? Or refuse? The panel might defer for further testing, especially since there are alternatives (existing insecticides, IPM) that, while imperfect, are known.

  Verdict: Refuse approval, but suggest a small-scale trial to gather data? But note: the question is about approval. So defer until further data, or refuse? Since the uncertainty is high and the harm potential severe, we refuse without more data. The chair might not like this because it blocks a potentially valuable tool and the panel is applying a strong precautionary principle. But the procedure: Step 3 triggered precaution for the novel insecticide because of uncertainty and catastrophic potential, and Step 4 showed it might be irreversible. So refusal.

  **Case 3: Reflective-Particle Dispersal Trial**

  Step 0: Proposal: small outdoor trial. Problem: climate change. Alternatives: inaction (no trial, continue climate change), other geoengineering trials, emission reductions.

  Step 1: Known harms:
  - Trial: minimal known harm because small scale? But particles might persist or affect local weather.
  - Inaction: known harms of climate change (but not directly addressed by a trial).
  - Emission reductions: known economic costs.

  Step 2: Uncertainty:
  - Trial: high uncertainty about long-range transport, persistence, and ecosystem effects. Potential for ozone depletion or other atmospheric effects. Also, the trial might set a precedent for full-scale use.
  - Inaction: uncertainty about the severity and timing of climate change impacts.
  - Emission reductions: less uncertainty.

  Step 3: Precautionary burden:
  - Trial: uncertainty about atmospheric effects and potential for triggering a chain reaction (even if small). Also, the "slippery slope" to full-scale deployment. Precaution might be triggered because of catastrophic potential (even if low probability for a small trial).
  - Inaction: uncertainty about climate catastrophe.

  Step 4: Reversibility:
  - Trial: if particles are short-lived, reversible. Monitoring possible. But if they cause ozone depletion, that might be irreversible. 
  - Inaction: climate change impacts are irreversible on human timescales.

  Step 5: Synthesis:
  - The trial is small and reversible? But the uncertainty is high about the atmospheric effects. The weak precautionary principle does not say to postpone just because of uncertainty. But if the potential harm is serious and irreversible, then precaution applies. However, the trial is designed to reduce uncertainty. The panel might allow the trial with strict conditions (e.g., monitoring, limited particle release, exit triggers). The harm of inaction (climate change) is also severe. The panel might allow the trial because it addresses a global threat and the trial itself is small and reversible.

  Verdict: Allow with conditions (strict monitoring, limited scope, exit triggers). The chair might not like this because the chair might be opposed to geoengineering and think it's too risky. But the procedure: at Step 3, the precautionary burden for the trial is not triggered because the trial is small and reversible, and the potential harm is not clearly catastrophic at this scale. Also, the harm of inaction (on climate change) is severe. So the panel might allow the trial.

  **But note: the chair might not like one outcome. Let's say the chair is against geoengineering and would prefer to refuse the trial, but the procedure allows it. So that's the one the chair doesn't like.**

