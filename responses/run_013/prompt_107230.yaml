answer: |-
  ### Decision Procedure: Precautionary Assessment Framework (PAF)

  This procedure operationalizes the **weak precautionary principle** ("uncertainty alone is not a reason to postpone protective action") while addressing common criticisms (vagueness, paralysis, burden-shifting, ignoring inaction/substitutes, conflating speculative/established risks). It distinguishes **prevention** (known risks) from **precaution** (uncertainty/ignorance), enforces **symmetrical analysis** (action vs. inaction vs. substitutes), and incorporates **reversibility**. Judgment calls are explicitly flagged.

  #### Procedure in Prose
  1. **Define Scope & Alternatives (Step 0)**  
     State the proposed action, its goal, and alternatives (including inaction and substitutes). *Judgment call: Defining "reasonable" substitutes.*

  2. **Assess Known Harms (Prevention) (Step 1)**  
     Quantify known harms (severity, probability, affected populations) for the proposal, inaction, and substitutes. If any option has *high-probability, severe, irreversible harm*, reject it immediately. *Sufficient answer: Empirical evidence (e.g., past data, models).*

  3. **Map Uncertainties (Precaution) (Step 2)**  
     Identify plausible worst-case scenarios and knowledge gaps for all options. Distinguish "uncertainty" (quantifiable) from "ignorance" (unquantifiable). *Sufficient answer: Scenario descriptions with causal plausibility.*

  4. **Apply Symmetrical Precaution (Step 3)**  
     For each option, ask: "Could this cause *serious/irreversible* harm under uncertainty/ignorance?" If "yes" for an option, it triggers precautionary restraint. *Judgment call: Defining "serious/irreversible."*

  5. **Evaluate Reversibility & Monitoring (Step 4)**  
     Assess:  
     - **Reversibility:** Can harms be undone? (e.g., gene drives = low; particle trials = high).  
     - **Monitoring:** Can harms be detected early?  
     *Judgment call: Feasibility of monitoring/reversal.*

  6. **Synthesize & Weigh Options (Step 5)**  
     Compare all options using:  
     - Known harms (Step 1)  
     - Precautionary risks (Step 3)  
     - Reversibility (Step 4)  
     Select the option with the **lowest risk-adjusted harm**. If risks are asymmetric, apply conditions (e.g., phased trials, exit triggers). *Judgment call: Balancing trade-offs.*

  7. **Set Conditions or Defer (Step 6)**  
     If allowing, attach binding conditions (e.g., monitoring, scope limits). If uncertainty dominates, defer for more data. *Sufficient answer: Specific, enforceable safeguards.*

  **Stopping Rules**  
  - **Stop-no:** At any step if an option has *high-probability, severe, irreversible harm* (Step 1) or *irreversible harm with plausible catastrophic potential* (Step 3).  
  - **Delegate:** At Step 5 if trade-offs hinge on unresolvable value conflicts (e.g., economy vs. ecology).  
  - **Proceed:** Continue if answers are sufficient; flag gaps if not.

