  ### Case Applications
  **Gene Drive for Rodents**  
  - **Verdict:** Refuse  
  - **Why you won’t like it:** You see gene drives as a high-reward solution for seabird recovery, but the procedure blocks it due to irreversible risks.  
  - **Procedure’s rationale:** Uncertainty about gene flow to mainland rodents could cause irreversible ecosystem harm (Step 3). Inaction (seabird decline) is severe but reversible via trapping (high reversibility per Step 4). Symmetry forces comparison: Trapping’s non-target harms are known and mitigatable (Step 1), making it lower risk-adjusted harm.

  **Novel Insecticide**  
  - **Verdict:** Defer  
  - **Why uncontentious:** Data gaps are clear; deferral aligns with weak precaution (uncertainty isn’t a reason to act, but also not to postpone if data can resolve it).

  **Reflective-Particle Trial**  
  - **Verdict:** Allow-with-conditions  
  - **Why you won’t like it:** You may view geoengineering as ethically fraught, but the procedure allows it due to reversibility and outweighed inaction harms.  

  ---

  ### Limitations
  1. **Cannot resolve values:** Delegates to higher authorities when trade-offs are value-laden (e.g., "Is species extinction worse than economic collapse?").  
  2. **Fails under ignorance:** Struggles with "unknown unknowns" (e.g., novel tech with no analogs).  
  3. **Misfires if:**  
     - Panel misjudges "plausible" catastrophes (e.g., overestimating particle trial risks).  
     - Reversibility is misclassified (e.g., assuming gene drives are containable).  
  4. **Burdens:** Shifts proof to proponents only at Step 3 (if precaution applies), but symmetry ensures fairness.  

  **Final Note:** This procedure forces transparency in trade-offs but won’t eliminate dissent—judgment calls remain. Use it to structure debate, not suppress it.
