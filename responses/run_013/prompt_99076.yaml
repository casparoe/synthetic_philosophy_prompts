prompt: |-
  Design a teaching plan, not the explanation itself, for a ninety-minute session on the thesis that analogy is the core of cognition rather than a peripheral rhetorical or literary device, the thesis developed at length by Douglas Hofstadter and Emmanuel Sander in Surfaces and Essences. The audience is a mixed group of graduate students in cognitive science, philosophy, and linguistics. Most will arrive equating analogy with metaphor; at least one will arrive suspecting the thesis is either trivial, on the grounds that anything resembles anything else, or unfalsifiable.

  Build the plan around a single carrying example, and make it a micro-case rather than any of the puzzles the book itself is known for. Use this one: a chess player glances at an unfamiliar position and immediately registers it as the same as a position from a game she played years ago, before she can articulate what the similarity consists in. Specify what that case must exhibit for it to do the work (the mapping has to live above the surface features; the recognition has to feel immediate and unforced; the earlier case has to be doing genuine work in the present judgment) and what it must lack (any explicit rule, any conscious search, any shared piece placement). Then say how the plan should draw the general thesis out of that case instead of announcing the thesis first and illustrating it afterward.

  Give me the order in which the ideas must be introduced, and why that order rather than another: what has to be in place before the next component can be understood, and what breaks if you reorder it. In particular, decide where the notion of a category or concept has to come in relative to the notion of an analogy, and defend that placement.

  Then map the misconceptions in the order the audience will actually form them, and say at which point in the sequence each should be headed off: analogy as decoration; analogy as a deliberate, conscious act; analogy as retrieval of a stored match rather than construction of one; the conflation of surface similarity with the deeper same; and the overcorrection in which, because every act of categorization can be redescribed as an analogy, the thesis is taken to assert nothing. Note which of these the carrying example can defuse by itself and which require separate treatment.

  End with a check for understanding that would show the thesis has landed rather than merely been nodded at, and with the two or three things I should openly refuse to cover at this level and say so. I have in mind the architecture-level machinery Hofstadter built to model analogy-making, the question whether analogy is a distinct faculty or simply what categorization looks like from one angle, and any attempt to say quantitatively how much of thought is analogy.
reasoning: |-
  We are designing a 90-minute teaching plan centered on a specific micro-case (chess position recognition) to argue that analogy is the core of cognition. The audience is graduate students in cognitive science, philosophy, and linguistics, with potential misconceptions.

  Key elements of the carrying example (chess case):
  - The player recognizes an unfamiliar position as the same as one from years ago.
  - The mapping must be above surface features (e.g., not the same pieces in the same places).
  - The recognition is immediate and unforced (not a deliberate search).
  - The earlier case is doing genuine work (not just a vague feeling).
  - It must lack: explicit rules, conscious search, shared piece placement.

  The plan must build the general thesis from the case, not announce it first.

  Order of ideas and why:
  1. **Start with the chess case (without labeling it as analogy)**. Present the scenario and ask students to reflect on what cognitive process might be at play. This anchors the session in a concrete, relatable example and avoids premature theoretical baggage. If we start with the thesis, students may filter the example through their preconceptions.

  2. **Elicit initial interpretations**. Ask the audience: "What do you think is happening in the chess player's mind?" This surfaces potential misconceptions early (e.g., "she's remembering a rule" or "it's just a feeling of familiarity"). We then challenge these by noting the absence of shared piece placement and the immediacy.

  3. **Introduce the term 'analogy' for this process**. After the case has been discussed, label the process as an analogy. This is crucial because we want to expand their notion of analogy beyond metaphor. By starting with a non-linguistic, non-decorative example, we break the equation of analogy with metaphor.

  4. **Argue that this analogy is doing cognitive work**. Point out that the recognition is not just a feeling but is guiding the player's understanding and potential moves. This sets up the idea that analogy is not peripheral but central.

  5. **Draw out the general thesis**: If such an immediate, non-surface-based mapping is happening in chess (a domain they accept as requiring high-level cognition), then perhaps analogy is a fundamental cognitive process. Then, extend to other domains (e.g., recognizing a friend in a crowd, understanding a new concept in physics by relating it to a known one).

  6. **Address the notion of categories/concepts**. Only after establishing the analogy in the chess case do we introduce the idea that categories might be built from analogies. We say: "Notice that when the chess player says 'this is the same as that old game', she is categorizing the current position. But that category is not pre-stored; it's created on the fly by the analogy." This order is vital because if we start with categories, they might think of them as fixed and predefined, which would make the analogy seem secondary. By showing the analogy first and then revealing that it is the mechanism for categorization, we invert the traditional view.

  Why this order? If we start with categories, we risk reinforcing the idea that categories are static and analogy is just a way to access them. By starting with the dynamic process of analogy and then showing that it creates (or activates) a category, we make the stronger point that analogy is the core.

  Misconceptions and when to head them off:
  - **Analogy as decoration (metaphor)**: This will arise immediately when we use the word "analogy". We head it off at step 3 by emphasizing that the chess example has no decorative or rhetorical purpose; it's a cognitive mechanism for understanding. We contrast with literary metaphors to show the difference.

  - **Analogy as a deliberate, conscious act**: When we present the chess case, someone might say, "She must have thought about it." We head this off at step 2 by stressing the immediacy and lack of conscious search. We ask: "How could she have time to search through thousands of games? It must be automatic."

  - **Analogy as retrieval of a stored match rather than construction**: This might come up when we discuss how the old game is accessed. We head it off at step 4 by noting that the old game is not stored as a perfect match (since the piece placements differ) — the match is constructed on the spot.

  - **Conflation of surface similarity with deeper sameness**: We prevent this by design in the chess example — we specify that the piece placements are different. We highlight at step 1 that the player sees the positions as the same despite surface differences.

  - **The overcorrection (triviality/unfalsifiability)**: This might come after we generalize. We address it late (step 5 or 6) by noting that not every possible analogy is activated — only ones that are structurally relevant and that yield useful inferences. We can point to the chess example: the analogy is not to any old game but to one with a similar strategic essence. We can also note that the thesis is falsifiable: if we could show that most cognitive acts do not rely on such mappings, it would be challenged.

  Which does the carrying example defuse?
  - By itself, the example defuses: 
    - Analogy as decoration (because chess is not rhetorical).
    - Analogy as deliberate (because it's immediate).
    - Surface similarity (because the positions differ).
  - It does not fully defuse:
    - The idea that analogy is just retrieval (we need to argue construction).
    - The triviality objection (we need to argue for structural constraints and cognitive utility).

  Check for understanding:
  - Ask: "In the chess example, what is the role of the old game? Is it just a memory, or is it actively shaping how the player sees the new position? How does this relate to the way we recognize, say, a chair as a chair even if we've never seen that exact chair before?"
  - We want them to say that the old game is providing a structure that the new position is mapped onto, and that this is how we build categories (like 'chair') — by analogical mapping to past experiences.

  What to refuse to cover:
  1. The architecture-level machinery (e.g., Hofstadter's Copycat, etc.) — say: "We are focusing on the cognitive phenomenon, not the computational models, which are for another day."
  2. Whether analogy is a distinct faculty or simply categorization from one angle — say: "We are not taking a stand on the metaphysics of cognitive faculties; we are observing that categorization often happens via analogical mapping."
  3. Quantitative claims about how much of thought is analogy — say: "We are making a qualitative case for the centrality of analogy; we leave the exact proportion for empirical research."

  Teaching Plan Outline:

  Total: 90 minutes

  1. (5 min) **Introduction and framing**: Set the stage without the thesis. "Today we're going to look at a puzzling cognitive phenomenon and try to understand what it tells us about how the mind works."

  2. (15 min) **Present the chess case**: Describe the scenario in detail. Ask: "What cognitive process might this be? How is it possible?" Have them discuss in pairs. Then, collect responses. Draw out the key features: immediacy, non-surface, no conscious search.

  3. (10 min) **Label it as analogy and challenge misconceptions**: "This is what we call an analogy. But note: it's not a metaphor. It's not decorative. It's a cognitive mechanism." Contrast with their initial thoughts.

  4. (15 min) **Deepen the example**: Discuss how the analogy is constructed (not retrieved). "The old game isn't stored as a template; the mind constructs the mapping on the fly." Address the triviality worry: "Why isn't this just saying everything is like everything? Because only certain mappings are cognitively activated — those that preserve relational structure and are useful."

  5. (15 min) **Generalize to categories**: "Now, when the chess player categorizes this position as 'the same as' that old one, she is creating a category on the fly. But notice: this is how categories often work. We recognize a new chair as a chair by analogical mapping to past chairs, not by matching a definition." This step links analogy to categorization.

  6. (10 min) **State the thesis and extend**: "So, Hofstadter and Sander argue that analogy is not peripheral but the core of cognition. It's how we understand anything new — by seeing it as like something we already know." Give a couple of quick examples (e.g., understanding a new social situation by analogy to a previous one, or a new mathematical concept by analogy to a known one).

  7. (10 min) **Address remaining misconceptions and objections**: Open the floor for questions. Specifically address:
     - Triviality: "How is this different from saying everything is similar? We must note constraints: the mappings must preserve relational structure and yield useful inferences."
     - Unfalsifiability: "We can test this by seeing if cognitive tasks that block analogical mapping become impossible or by studying how people solve problems by analogy."

  8. (5 min) **Check for understanding**: Pose the question about the chair (above). Ask for a show of hands: "How many of you now see analogy as more central than you did at the start?" Then, ask one or two to explain in their own words.

  9. (5 min) **Wrap-up and boundaries**: Restate the core idea. Then say: "We haven't covered Hofstadter's computational models, the question of whether analogy is a distinct faculty, or how much of thought is analogical. These are important but beyond today's scope."

  This order ensures that the concrete example does the heavy lifting and that each step builds on the previous, while misconceptions are addressed as they naturally arise.
answer: |-
  ### Teaching Plan: Analogy as the Core of Cognition  
  **Based on Hofstadter & Sander's *Surfaces and Essences***  
  **Audience:** Graduate students in cognitive science, philosophy, and linguistics (mixed backgrounds).  
  **Time:** 90 minutes  
  **Core Pedagogical Strategy:** Build the thesis inductively from a single micro-case (chess position recognition) without pre-announcing the thesis. Defuse misconceptions as they arise.  

  ---

  ### **Carrying Example: Chess Position Recognition**  
  *Specifications for the case to do the work:*  
  - **Must exhibit:**  
    - Mapping above surface features (e.g., positions share strategic structure like "pinned king" or "weak pawn chain," not identical piece placements).  
    - Immediate, unforced recognition (player "just sees" the similarity without effort).  
    - Genuine cognitive work from the past case (the old position informs the player’s current strategy).  
  - **Must lack:**  
    - Explicit rules (no memorized "if X, then Y" pattern).  
    - Conscious search (no deliberate scanning of memory).  
    - Shared piece placement (superficial differences, e.g., pieces on different squares or colors).  

  ---

  ### **Session Outline: Order of Ideas and Rationale**  
  *Total: 90 minutes. Rationale emphasizes why the order is non-negotiable.*  

  1. **Introduce the Chess Case (10 min)**  
     - **Activity:** Describe the scenario neutrally. *"A chess master glances at a new board and instantly feels it’s identical to a game she played years ago, despite different piece locations. She can’t yet say why—it just clicks."*  
     - **Why this order first:**  
       - Anchors the session in concrete, relatable cognition (avoids abstract debates).  
       - Forces students to engage with the phenomenon *before* labeling it, reducing bias from preconceptions (e.g., "analogy = metaphor").  
     - **If reordered:** Starting with the thesis or the word "analogy" triggers literary/rhetorical associations, derailing the cognitive focus.  

  2. **Elicit Student Interpretations (15 min)**  
     - **Activity:** Small-group discussion: *"How might this recognition work? Is it memory? Intuition? A rule?"* Collect responses.  
     - **Why now:**  
       - Surfaces initial misconceptions (e.g., "it’s just pattern-matching" or "automatic retrieval").  
       - Sets up contrasts with the example’s specifications (e.g., "no shared pieces? Then it’s not surface matching!").  
     - **If reordered:** Delaying this loses the "aha" of realizing their initial models (e.g., rules or retrieval) fail.  

  3. **Label the Process as "Analogy" and Contrast with Misconceptions (15 min)**  
     - **Activity:** Name the process: *"This is analogy—but not as decoration or metaphor. It’s a mechanism for understanding."* Contrast with student suggestions from Step 2.  
     - **Defuse misconceptions:**  
       - *Analogy as decoration*: Emphasize chess is strategic, not rhetorical.  
       - *Analogy as conscious/deliberate*: Stress immediacy ("no time for search!").  
       - *Surface similarity*: Highlight missing piece placements—similarity is deeper.  
     - **Why now:**  
       - The case naturally defuses decoration/consciousness/surface errors. "Analogy" enters *after* the phenomenon is felt, redefining it.  
       - Preempts triviality objections by showing structural constraints (e.g., "Not *any* old game fits—only ones with strategic parallels").  
     - **If reordered:** Introducing analogy earlier invites metaphor associations; later risks missing the "redefinition" moment.  

  4. **Analyze the Analogy’s Cognitive Work (15 min)**  
     - **Activity:** Drill into *how* the past case guides present action: *"How does the old game help her here? Could she solve this without it?"*  
     - **Why now:**  
       - Establishes that analogy is *doing work* (e.g., predicting threats), not just retrieval.  
       - Sets up the core thesis by showing cognition depends on this mapping.  
     - **If reordered:** Skipping this leaves analogy seeming passive, not generative.  

  5. **Introduce "Categories/Concepts" as Outcomes of Analogy (15 min)**  
     - **Activity:** *"When she calls this position 'the same,' she’s categorizing it. But the category isn’t stored—it’s built via analogy to the past case."*  
     - **Placement defense:** Categories must come **after** analogy to invert intuition.  
       - **Why:** Students assume categories are stored and analogy accesses them. Showing analogy *constructs* the category (e.g., "weak king position" is forged on-the-fly) demonstrates cognition’s fluidity. If categories come first, analogy seems peripheral.  
       - **Break if reordered:** Putting categories first reinforces static, definitional views (e.g., "categories pre-exist"), contradicting the thesis.  

  6. **Generalize the Thesis (10 min)**  
     - **Activity:** Extract the big idea: *"If this 'everyday' cognition relies on analogy, could it be core to all thinking? E.g., recognizing a friend in a crowd (despite new clothes) or grasping 'democracy' by analogy to historical cases."*  
     - **Why now:**  
       - The chess case has done the heavy lifting, making generalization feel earned.  
       - Addresses *triviality/unfalsifiability*: Not "anything resembles anything" because mappings require structural coherence (e.g., chess strategy) and inferential power (e.g., guiding moves).  
     - **If reordered:** Announcing the thesis early turns the example into mere illustration, not evidence.  

  7. **Address Residual Objections (5 min)**  
     - **Activity:** Target lingering doubts:  
       - *Analogy as retrieval*: "If no stored match, how is the old case found? It’s constructed—activation spreads subconsciously."  
       - *Triviality*: "Structural constraints (e.g., relational roles like 'king under threat') make it falsifiable: if cognition used arbitrary matches, predictions would fail."  
     - **Why now:** Post-generalization, students see stakes (e.g., if analogy is trivial, cognition is inexplicable).  

  ---

  ### **Misconception Management Sequence**  
  *Order mirrors when misconceptions will arise in the audience:*  

  1. **Analogy as decoration** (arises when "analogy" is first mentioned).  
     - **Headed off at:** Step 3 (labeling), using chess to show functional role.  
     - **Carrying example defuses it?** Yes—chess is non-rhetorical.  

  2. **Analogy as deliberate/conscious** (arises when interpreting the chess case).  
     - **Headed off at:** Step 2 (eliciting interpretations) and Step 3 (emphasizing immediacy).  
     - **Carrying example defuses it?** Yes—recognition is unforced.  

  3. **Analogy as retrieval of a stored match** (arises when explaining how the past case is accessed).  
     - **Headed off at:** Step 4 (cognitive work analysis) and Step 7 (objections).  
     - **Carrying example defuses it?** Partially (lacks shared features), but requires explicit argument that mapping is constructed.  

  4. **Conflation of surface similarity with deeper sameness** (arises early in chess discussion).  
     - **Headed off at:** Step 1 (case specifications) and Step 3 (contrast).  
     - **Carrying example defuses it?** Yes—differences in piece placement force structural focus.  

  5. **Triviality/unfalsifiability** (arises post-generalization: "Isn’t this just saying everything is alike?").  
     - **Headed off at:** Step 6 (generalization) and Step 7 (objections).  
     - **Carrying example defuses it?** No—requires separate treatment of structural constraints.  

  ---

  ### **Check for Understanding**  
  - **Activity (5 min):** *"Explain to a partner how the chess case shows that categorizing 'weak king positions' relies on analogy, not stored definitions. Then, give an everyday example (e.g., recognizing 'anger' in a new context)."*  
  - **Why this works:** Tests if students can transfer the logic beyond chess. Success looks like:  
    - Using "mapping" and "structure" (not surface features).  
    - Treating analogy as dynamic (not retrieval).  
    - Linking categorization to analogy.  
  - **If they nod without depth:** Intervene with Socratic questions (e.g., *"Could a rule explain the chess case? Why not?"*).  

  ---

  ### **What to Explicitly Exclude (Announce at Start and End)**  
  1. **Architecture-level machinery** (e.g., Hofstadter’s Copycat model): *"We won’t cover computational implementations—focus is on the phenomenon."*  
  2. **Analogy as distinct faculty vs. categorization’s foundation**: *"We won’t resolve if analogy is a 'thing' or just how categorization works—assume the latter for today."*  
  3. **Quantifying analogy’s role**: *"We won’t debate 'how much' of thought is analogy—focus is on its necessity in core cases."*  
  - **Why:** Prevents tangents and keeps focus on the philosophical/cognitive claim.  

  ---  
  **Total Time Allocation:**  
  - Steps 1–7: 85 min  
  - Check for Understanding: 5 min  
  - Exclusions noted upfront (1 min) and reiterated in wrap-up (1 min).
