answer: |-
  Here's a comparison of Keynes's "Weight of Argument" and the Credal-Set framework, addressing your specific points:

  **1. Nature of Weight: Evidential Relation vs. Epistemic State & The Credal-Set Distinction**

  *   **Keynes:** Weight is fundamentally a property of the **evidential relation** between a hypothesis and the *total body of relevant evidence* available. It measures the "absolute amount" of relevant knowledge *and* ignorance. While it influences rational belief, it's an objective (logical) feature of the evidential situation itself. An ideally rational agent *should* recognize the weight inherent in the evidence.
  *   **Credal-Sets:** The set of probability functions directly represents the **agent's epistemic state** – the uncertainty arising from incomplete information, ambiguity, or unresolved comparisons. The "size" or "spread" of the set reflects the agent's *lack of confidence* or *indeterminacy*. It's subjective in the sense that it captures the state of the specific agent given what they know (or acknowledge they don't know).
  *   **Collapse?** The credal-set apparatus **collapses the distinction**. It represents the *agent's perspective* on uncertainty arising from limited evidence. While the evidence constrains the set (only distributions compatible with the evidence are included), the *extent* of the set is a feature of the agent's epistemic state *given* that evidence. It doesn't directly model an objective "amount of evidence" independent of the agent's representation. Weight becomes a *consequence* of the agent's state (the size of the set) rather than an inherent property of the evidence itself.

  **2. Does Weight Correspond to a Structural Feature of a Credal Set?**

  *   **Keynes:** Weight is a "quantity" (though potentially immeasurable) related to the *absolute amount* of relevant evidence and relevant ignorance. It's not synonymous with probability balance or uncertainty *per se*, but with the *comprehensiveness* of the evidential base.
  *   **Credal-Sets:** No single structural feature perfectly captures Keynesian weight:
      *   **Spread/Range:** The range of probability values assigned to a specific event across the set captures uncertainty *for that event*. This relates to indeterminacy but not directly to the comprehensiveness of evidence.
      *   **Cardinality:** The number of distributions in the set is problematic. A large set could represent ambiguity or conflicting evidence (high ignorance/low weight), but it could also represent fine-grained distinctions compatible with very comprehensive evidence (potentially high weight?).
      *   **Convex Hull Dimension:** The dimensionality of the convex hull of the credal set comes closest. A lower-dimensional hull (e.g., a point = unique probability, high dimension) indicates the evidence strongly constrains the possible probabilities over many partitions of the possibility space, suggesting more comprehensive evidence (higher weight). A high-dimensional hull indicates the evidence leaves many probability assignments relatively unconstrained (lower weight). However, dimensionality reflects *constraint* rather than absolute *amount*.
  *   **Verdict:** Weight is **not directly equivalent** to any single structural feature. The **dimensionality of the convex hull** is the most plausible candidate, as it captures how tightly the evidence constrains possible probability assignments across the *entire* domain, which relates to comprehensiveness. However, Keynes's notion emphasizes the *amount* of evidence, while the convex hull dimension emphasizes the *resulting constraint*. They are related but distinct concepts.

  **3. Probability Falls, Weight Rises: Handling the Divergence**

  *   **Keynes:** This is central to his concept. Adding new relevant evidence *always* increases weight (reduces absolute ignorance). However, this new evidence might be predominantly *unfavorable*, shifting the *balance* of favorable vs. unfavorable evidence against the hypothesis, thereby *lowering* its probability. There's no contradiction: weight tracks the *total volume* of evidence considered, probability tracks the *net direction* of that evidence. (Example: Investigating a murder suspect – gathering more alibis (new evidence) increases weight. If most new alibis are weak or conflicting, the suspect's probability of guilt might decrease slightly, but the overall evidential picture is fuller).
  *   **Credal-Sets:** This phenomenon is naturally accommodated:
      1.  **Initial State:** Agent has credal set C1, yielding probability range [a, b] for hypothesis H.
      2.  **New Evidence:** Agent learns new information E.
      3.  **Conditioning:** The credal set is updated to C2 = {P(·|E) | P ∈ C1 and P(E) > 0}.
      4.  **Outcome:**
          *   **Weight Increase:** C2 is *often* a subset of C1 (or at least, the convex hull might shrink in dimension), reflecting reduced indeterminacy (increased confidence/settledness). *This corresponds to increased weight.*
          *   **Probability Fall:** Crucially, conditioning can shift *all* probabilities in the set downward. E.g., C1 might give H a range [0.6, 0.8], while C2 (after unfavorable E) gives H a range [0.4, 0.6]. The *entire interval* shifted down. The probability (whether using a specific rule or looking at bounds) fell, while the set became "smaller" (higher weight).
  *   **Making Sense:** **Both frameworks make good sense** of the non-contradiction. Keynes separates the quantity (weight) from the balance (probability). Credal sets show how conditioning (adding evidence) simultaneously refines the set (potentially increasing "confidence") and shifts the probability assignments within it (which can lower the probability of H). They capture the two distinct dimensions of evidential assessment.

  **4. Low-Weight Judgments: Unsafe to Act On?**

  *   **Keynes:** Yes, explicitly. Acting on a low-weight probability is epistemically dangerous, even if the probability itself is high. The lack of evidence means the probability estimate is fragile; it could easily be overturned by future evidence we *know* is missing but haven't obtained. This danger exists **especially** for one-off, irreversible decisions. You can't "average out" the risk over repeated trials if there's only one shot. High weight provides robustness.
  *   **Credal-Sets:** Yes, implicitly through decision rules.
      *   **Rules like Maximin EU:** Directly model aversion to uncertainty/ambiguity. If the credal set is large (low weight), the worst-case scenario within the set might be very bad, leading the agent to avoid an action that looks good under some distributions but disastrous under others. This aversion is rationalized by the fear of the unknown odds implied by the large set.
      *   **Rules like E-admissibility/Maximality:** Might still allow an action if it's non-dominated *somewhere* in the set. However, a large set (low weight) makes it *less likely* that any single action will be optimal (or non-dominated) across the whole set, often leading to indecision or more cautious choices.
      *   **One-off Decisions:** The explanation **survives robustly** for one-off, irreversible decisions. The aversion captured by rules like Maximin EU is *specifically* designed for situations where you cannot rely on long-run frequencies or repeated trials to mitigate the risk of a disastrous outcome based on unknown probabilities. The large credal set *is* the representation of that unknown risk. Acting on a probability plucked from a large set ignores the presence of other, potentially catastrophic distributions also compatible with the limited evidence.

  **Conclusion: Reconstruction, Replacement, or Different Answer?**

  The credal-set framework is best understood as a **replacement and formalization of a *related* insight, but answering a different core question.**

  *   **Different Question:** Keynes's core question is: "What is the nature of probability and the *objective characteristics* of the evidential support relation?" Weight is an objective property of that relation. The credal-set framework's core question is: "How should an agent *represent their uncertainty* and make decisions *given* incomplete or ambiguous information?" It focuses on the agent's subjective epistemic state and decision-making under uncertainty.
  *   **Replacement/Formalization:** Credal sets offer a powerful mathematical framework to *represent* the kind of indeterminacy and lack of confidence that Keynes associated with low weight. It provides precise tools (set structure, decision rules) to *model* the behavioral consequences (caution, aversion to ambiguity) that Keynes argued follow from low weight. In this sense, it replaces Keynes's somewhat vague "absolute amount" with a concrete representation of uncertainty in the agent's state.
  *   **Key Difference:** Credal sets fundamentally *collapse* Keynes's distinction between the objective evidential relation and the agent's epistemic state. Weight, as Keynes conceived it, exists objectively in the evidence. Credal sets represent the *agent's perspective* constrained by that evidence. The "size" of the set is a property of the agent's model of their knowledge, not an intrinsic property of the evidence itself. The credal-set framework is *agent-centered*, while Keynes's weight is *evidence-centered*.
  *   **Verdict:** The credal-set framework is **not primarily a reconstruction of Keynes's notion**. It is a **replacement for addressing the *practical consequences* of incomplete evidence** – particularly decision-making under uncertainty/ambiguity – inspired by the *same underlying concern* (insufficient evidence making probabilities fragile and actions risky) that motivated Keynes's discussion of weight. It answers the question "How to decide with limited evidence?" rather than "What is the structure of evidential support?". It provides the formal machinery Keynes lacked for modeling the *agent's response* to low weight.
