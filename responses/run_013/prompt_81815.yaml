prompt: |-
  I teach decision theory and formal epistemology in a philosophy department, and for the past two years I have been the outside member of the risk and planning committee of a mid-sized humanitarian organization that runs an anticipatory-action program: when forecasters project a drought, a flood, or a disease surge, the committee decides in advance whether to release funds and pre-position supplies before the crisis is confirmed, rather than waiting for confirmation and responding afterwards. The committee meets quarterly, disposes of roughly two million dollars per decision, and its members — a finance officer, a program officer, a monitoring officer, and a country director who signs off — have no training in decision theory; I am the only person in the room who can do the arithmetic. The options are genuinely uncertain and genuinely rankable: releasing early buys a modest but reliable benefit for a fixed caseload, waiting buys a larger response if the window stays open and nothing if it closes, and the hybrid plans buy something in between with a chance of a great deal or a chance of very little. What I want to give them is a procedure they can actually run in a two-hour meeting with a spreadsheet, built on the theory I work on — Lara Buchak's risk-weighted expected utility, the rank-dependent decision theory on which an outcome's weight in a gamble can depend on where it ranks, and which collapses into ordinary expected utility when the risk function is linear. Their intuitive practice already looks like this theory in the wild: they sometimes refuse a gamble with the better expected outcome because of where the bad case sits, and they sometimes take one for the same reason, and I would rather they did that deliberately than by instinct.

  Please write that procedure. I need the steps in order, what counts as a sufficient answer at each step, the points where the procedure stops with a no, and the points where it must hand the decision to a person because the question is one of values rather than arithmetic; the deliverable should include a one-page worksheet the program officer can fill in. Two constraints matter to me more than convenience. First, the procedure has to elicit the committee's risk attitude without assuming expected utility along the way — if the elicitation asks them to compare gambles in a way that only makes sense for an expected utility maximizer, we have gone in a circle — and I want the procedure to say honestly how much of the risk function is measured, how much is stipulated by the country director, and how much is a judgment call dressed up as measurement. Second, the forecasters give probabilities as ranges and sometimes as little more than a ranking of scenarios, so the procedure must say what to do when the numbers are soft rather than quietly plugging in a midpoint. Then run the procedure on three cases: a plan that trades a guaranteed modest response for a small chance of a much larger one; a plan whose worst case is catastrophic in the way that worries the committee most but whose expected reach is the highest of the options; and a case where the forecast is so unreliable that the procedure should refuse to choose. I expect the second to be the case where the procedure tells the committee something it will not want to hear, and I would like you to say so plainly rather than softening it.

  Finally, be careful to separate what is settled from what is genuinely contested among people who work on this. It is contested whether risk-weighted expected utility is a real rival to expected utility or a reformulation of it, whether risk attitudes can be elicited stably from anyone, and whether a committee can have a risk function at all rather than merely a procedure for aggregating individual ones; I do not want any of that presented as consensus, nor the theory's machinery treated as though the reader already knows it. Write for a reader who has never seen the theory, name the places where the procedure will misfire, and tell me what the procedure cannot do at all — including, I suspect, anything about the people who bear the risk but do not sit on the committee.
reasoning: |-
  We are designing a decision procedure for a committee that uses Lara Buchak's risk-weighted expected utility (REU) theory. The key idea is that the weight of an outcome in a gamble depends on both its probability and its rank (how good it is relative to other outcomes), via a "risk function" r. The risk function r: [0,1] -> [0,1] is a non-decreasing function with r(0)=0 and r(1)=1. For a gamble with outcomes ordered from worst to best, the REU is computed as:
    REU = u(x_1) * r(p_1) + u(x_2) * [r(p_1+p_2) - r(p_1)] + ... + u(x_n) * [1 - r(p_1+...+p_{n-1})]

  The procedure must:
  1. Be runnable in a two-hour meeting with a spreadsheet.
  2. Elicit the committee's risk attitude without assuming expected utility (EU) at any step.
  3. Handle soft probabilities (ranges, rankings) without always using midpoints.
  4. Clearly separate settled from contested issues in the theory.

  We break the procedure into steps:

  Step 1: Define the options (gambles) under consideration. The program officer fills in a worksheet describing each option. For each option, we need:
    - The possible outcomes (states of the world) and their consequences (in terms of humanitarian impact, which we will later assign utilities).
    - The probability of each outcome (which may be given as a range or as a ranking).

  Step 2: Assign utilities to the outcomes. This is a value judgment and must be done by the committee. We need a utility scale. Since the outcomes are rankable, we can assign the worst outcome a utility of 0 and the best a utility of 1, and then assign utilities to the intermediate outcomes. We can use a method of comparison: e.g., for an outcome C, ask "Is C closer to the worst or to the best?" and then use a visual analog scale (like a slider) or a series of choices to assign a number. But note: this step is about values and must be done by the committee. We will design a worksheet for this.

  Step 3: Elicit the risk function. This is the core challenge. We cannot use EU-based methods. We can use a method based on certainty equivalents for two-outcome gambles. However, Buchak's theory is designed to accommodate risk attitudes that are not captured by EU, so we must use an elicitation that is consistent with REU.

    We propose the following method for a two-outcome gamble:

    Consider a gamble that pays the best outcome (utility 1) with probability p and the worst outcome (utility 0) with probability 1-p. We want to find the certainty equivalent (CE) for this gamble. The CE is the sure outcome (with utility u) that the decision maker is indifferent between and the gamble.

    Under REU, the REU of the gamble is: 
        REU = 1 * r(p) + 0 * [1 - r(p)] = r(p)
    Therefore, the utility of the CE is u = r(p). 

    So, if we ask the committee: "For a gamble that gives the best outcome with probability p and the worst with probability 1-p, what sure outcome (in terms of utility) is equally good?" Then, the utility of that sure outcome is r(p). 

    We can do this for several values of p (e.g., p=0.1, 0.3, 0.5, 0.7, 0.9) to get points on the risk function. However, note that the committee must understand that we are talking about utility (which we just assigned) and not about the physical outcomes. Also, the gamble is hypothetical.

    But note: the committee might not have a stable risk attitude. We must acknowledge that this is contested. We are going to assume that we can get a stable enough function for the purpose.

    We then interpolate the risk function from these points. We can use linear interpolation or fit a simple function (like a power function) if we want. However, we must be transparent that between the points we are assuming a shape.

  Step 4: Handle soft probabilities. For each option, we have a set of outcomes with probabilities that might be intervals or just a ranking. We consider:

    - If probabilities are given as intervals, we can compute the REU over the interval and see if the entire interval leads to the same decision. If not, we must flag it for the committee.

    - If probabilities are given as a ranking (order of likelihood) without numbers, we can use a default (e.g., equal probabilities) but then note that the decision is sensitive to the probabilities and we must do a sensitivity analysis.

    We propose: for each option, we compute the REU for the best-case, worst-case, and mid-case probabilities. We then see if the ordering of the options is the same in all three. If not, we must note that the decision is sensitive to the probability assignments and that the committee should either seek more precise probabilities or make a judgment.

  Step 5: Compute the REU for each option. We order the outcomes of the option from worst to best. Then we compute:

    Let the outcomes be x_1 (worst) to x_n (best), with probabilities p_1, ..., p_n and utilities u_1, ..., u_n.

    We compute cumulative probabilities: 
        c_0 = 0
        c_1 = p_1
        c_2 = p_1+p_2
        ...
        c_n = 1

    Then:
        REU = u_1 * r(c_1) + u_2 * [r(c_2) - r(c_1)] + ... + u_n * [1 - r(c_{n-1})]

    We do this for each option.

  Step 6: Compare the REU of the options. The option with the highest REU is chosen.

  But note: we must be cautious when we have soft probabilities. We may have to compute a range of REU. We then look for dominance: if one option is always better than the others in the entire range of probabilities, then we choose it. Otherwise, we must present the committee with the results and let them decide based on the range.

  Now, the procedure must have stopping points:

    - If at any step the committee cannot assign utilities (step 2), then the procedure stops and the decision must be made by discussion (because it is about values).

    - If the risk function elicitation (step 3) fails (the committee cannot agree on certainty equivalents), then we must use a default risk function (e.g., linear, which is EU) and note that we are falling back to EU.

    - If the probabilities are too soft and the REU ranges overlap for the top options, then the procedure stops and the committee must decide by discussion.

  We design a one-page worksheet for the program officer to fill in for each option (step 1). Then we have a separate sheet for step 2 (utility assignment) and step 3 (risk function elicitation).

  Now, we run three cases:

  Case 1: A plan that trades a guaranteed modest response for a small chance of a much larger one.

    Option A: Guaranteed modest response (utility u_A)
    Option B: Gamble: small chance (p) of a much larger response (utility u_B, which is high) and high chance (1-p) of a failure (utility 0, say).

    We assume u_A is between 0 and u_B. The EU of B is p * u_B. The REU of B is u_B * r(p). 

    The committee might prefer A if they are risk-averse (r(p) < p) and B if they are risk-inclined (r(p) > p). We will see based on the elicited r.

  Case 2: A plan whose worst case is catastrophic (utility 0) but whose expected reach (EU) is the highest of the options.

    Option C: Has outcomes that include a catastrophic one (with some probability) and very good ones. But the REU might be low if the catastrophic outcome is bad enough and the risk function is sufficiently concave (which captures risk aversion). The procedure might show that despite having the highest EU, the REU is lower than a safer option. This is where the procedure might tell the committee something they don't want to hear: that they should not take the option with the highest EU because of the catastrophic worst-case.

  Case 3: A case where the forecast is so unreliable that the procedure refuses to choose.

    Here, the probabilities are so vague that the REU ranges for the options overlap. For example, if for one option the REU can be anywhere from 0.2 to 0.8 and for another from 0.3 to 0.7, then there is no dominance. The procedure then stops and hands the decision to the committee.

  We now write the procedure step by step.

  ---

  **Procedure for Anticipatory Action Decisions using Risk-Weighted Expected Utility**

  **Step 1: Define Options (Worksheet 1)**
     - The program officer describes each option (gamble) in terms of possible outcomes and their probabilities (which can be a range or a ranking).
     - For each outcome, describe the humanitarian impact (in natural terms: e.g., number of people reached, severity of need addressed, etc.).
     - *Sufficient answer*: A list of outcomes for each option with either a probability, a probability interval, or a ranking (e.g., "most likely", "least likely"). If a ranking, we will later assign equal probabilities by default but note the uncertainty.

  **Step 2: Assign Utilities (Worksheet 2)**
     - The committee assigns a utility to each outcome. We set the worst outcome (across all options) to 0 and the best outcome to 1. 
     - For each other outcome, the committee must decide: How much better than the worst is this outcome? We use a visual analog scale (a line from 0 to 1) and the committee marks a point. Alternatively, use a series of pairwise comparisons to locate the utility. 
     - *Sufficient answer*: A utility number for each outcome. If the committee cannot agree, the procedure stops and the decision is made by discussion (values are contested).

  **Step 3: Elicit Risk Function (Worksheet 3)**
     - We ask the committee to consider a series of hypothetical gambles between the worst outcome (utility 0) and the best outcome (utility 1).
     - For each probability p (we suggest p=0.1, 0.3, 0.5, 0.7, 0.9), ask: "What sure outcome (in terms of utility) would make you indifferent between receiving that sure outcome and playing the gamble that gives the best outcome with probability p and the worst outcome with probability 1-p?" 
     - The answer is a utility u. Then, by REU theory, we set r(p) = u.
     - *Sufficient answer*: A table of p and u (which is r(p)) for the chosen probabilities. If the committee cannot agree on any u for a given p, we skip that p. If we have at least three points, we can interpolate. If not, we use a linear risk function (r(p)=p) and note that we are falling back to expected utility.

  **Step 4: Handle Soft Probabilities (Worksheet 4)**
     - For each option, if probabilities are given as intervals, we consider three scenarios: 
          a) Best-case probabilities (within the interval) for the option (i.e., the probabilities that make the option look best)
          b) Worst-case probabilities (within the interval) for the option
          c) Mid-case (midpoint of intervals, but note: if intervals are wide, we might use several points)
     - If probabilities are given as a ranking, we assign equal probabilities to the outcomes (but note: this is arbitrary). Then we note that the probabilities are very soft and we must do a sensitivity analysis: we vary the probabilities over a reasonable range (but this might be too vague, so we might have to treat it as an interval [0,1] for the worst outcome? This is hard). Alternatively, we can ask the committee to assign a rough probability range for the outcomes based on the ranking. But if they cannot, then we treat the entire option as having an undefined REU and we must rely on dominance or other criteria.

     We do:

       For each option, and for each scenario (best, mid, worst) of probabilities, compute the REU. Then we get a range of REU for each option.

  **Step 5: Compute REU (Worksheet 5)**
     - For each option and for each probability scenario (if soft) or for the given probabilities (if exact), we order the outcomes from worst to best. Then we compute the REU as described above, using the risk function r we elicited (interpolating as needed).

  **Step 6: Compare Options (Worksheet 6)**
     - For each option, we now have a point REU (if probabilities are exact) or a range (if probabilities are soft). 
     - We look for dominance:
          - Option A dominates option B if the minimum REU of A is greater than the maximum REU of B.
          - If one option dominates all others, choose it.
          - If there is no dominance and the REU ranges overlap, then the procedure stops and the committee must decide by discussion.
     - If the probabilities are exact, we simply choose the option with the highest REU.

  **Stopping Points:**
     - Step 2: If utilities cannot be assigned, stop and discuss.
     - Step 3: If we cannot elicit enough points for the risk function and the committee does not want to use the linear default, stop and discuss (but we have the linear default as a fallback).
     - Step 4: If probabilities are too vague to assign even intervals and the committee cannot assign them, then we cannot compute REU meaningfully. Stop and discuss.
     - Step 6: If no option dominates and REU ranges overlap, stop and discuss.

  **What the Procedure Cannot Do:**
     - It cannot handle cases where the committee cannot agree on the risk function or utilities, except by stopping.
     - It cannot account for the risk attitudes of the beneficiaries (only the committee's).
     - It cannot handle very complex gambles (with many outcomes) without more time and computational resources.
     - The interpolation of the risk function between elicited points is an assumption. The committee might have a risk function that is not captured by the interpolation.
     - It is contested whether a committee (as a group) has a coherent risk function. We are assuming they can agree on one.

  Now, we run the three cases.

