  REU(C) = 0 * r(0.4) + 1 * (1 - r(0.4)) = 1 - 0.8 = 0.2

  Option D (safe):
     Outcome D1: Moderate response (0.5) for sure.

  REU(D) = 0.5

  So REU(D) > REU(C) -> choose D, even though EU(C)=0.6 > EU(D)=0.5.

  This is the result we want: the committee's risk function (which is convex) leads them to reject the option with the higher EU because of the catastrophic worst-case.

  **Case 3: Unreliable forecast**

  Option E:
     Outcome E1: Failure (0) with probability [0.3, 0.7] (very soft)
     Outcome E2: Success (1) with probability [0.3,0.7]

  Option F:
     Outcome F1: Modest failure (0.3) with probability 0.4
     Outcome F2: Modest success (0.6) with probability 0.6

  We assume the risk function is linear (r(p)=p) for simplicity.

  For Option E, we consider:
     Best-case: P(E2)=0.7 -> EU=0.7
     Worst-case: P(E2)=0.3 -> EU=0.3
     Mid-case: P(E2)=0.5 -> EU=0.5

  For Option F: 
     EU = 0.3*0.4 + 0.6*0.6 = 0.12+0.36=0.48

  Now, the REU for E in the best-case is 0.7, worst-case 0.3. For F, it's 0.48.

  The range for E is [0.3,0.7] and for F is [0.48,0.48]. 

  There is no dominance: the best-case of E (0.7) > 0.48, but the worst-case of E (0.3) < 0.48. So the procedure stops and the committee must discuss.

  ---

  **Deliverable: One-Page Worksheet**

  We design a one-page worksheet for the program officer to fill in before the meeting for each option. Then we have separate worksheets for steps 2 and 3.

  **Worksheet 1: Option Description**

  Option Name: _________

  For each possible outcome of this option:
     - Description of humanitarian impact: 
     - Probability: [ ] Exact value ______ OR [ ] Interval from ____ to ____ OR [ ] Ranking (e.g., most likely, least likely)

  ---

  **Worksheet 2: Utility Assignment**

  We have the following outcomes from all options:

  List them here (from the worst to the best, as identified by the committee):

  1. [Description of worst outcome] -> Utility = 0 (fixed)
  2. [Description of best outcome] -> Utility = 1 (fixed)
  3. [Description of outcome A] -> The committee assigns a utility between 0 and 1: ______
     (How to assign: "This outcome is as bad as the worst? Then 0. As good as the best? Then 1. If somewhere in between, choose a number that reflects how much better than the worst it is.")

  ...

  ---

  **Worksheet 3: Risk Function Elicitation**

  Consider a gamble that has:
     - A [description of best outcome] (utility 1) with probability p, and 
     - A [description of worst outcome] (utility 0) with probability 1-p.

  For the following values of p, what sure outcome (in terms of its utility) would make you indifferent between the sure outcome and the gamble?

     p=0.1: Sure outcome utility = ______ (this is r(0.1))
     p=0.3: Sure outcome utility = ______ (this is r(0.3))
     p=0.5: Sure outcome utility = ______ (this is r(0.5))
     p=0.7: Sure outcome utility = ______ (this is r(0.7))
     p=0.9: Sure outcome utility = ______ (this is r(0.9))

  If the committee cannot agree on a utility for any p, leave it blank.

  ---

  **Worksheet 4: REU Calculation (for the decision support officer to fill in)**

  For each option, we have a set of outcomes with utilities and probabilities. We order the outcomes from worst to best. Then we compute the cumulative probabilities and apply the risk function (interpolating if necessary).

  But this might be done in a spreadsheet.

  ---

  **Final Note**

  This procedure is a first attempt. It is not perfect. The theory of REU is contested, and the elicitation of the risk function might be unstable. But it provides a structured way for the committee to deliberate. The procedure makes transparent where the committee's values come in (utility assignment) and where their risk attitude comes in (risk function elicitation), and where the uncertainty in probabilities matters.
answer: |-
  Below is a decision procedure for your committee, designed around Lara Buchak's Risk-Weighted Expected Utility (REU) theory. It respects your constraints:  
  - **No assumed EU**: Elicits risk attitudes without EU-based comparisons.  
  - **Handles soft probabilities**: Explicitly treats ranges/rankings without defaulting to midpoints.  
  - **Transparency**: Flags measured vs. stipulated inputs and value judgments.  
  - **Stopping rules**: Halts for value conflicts, unreliable forecasts, or non-dominance.  

  The procedure uses a **one-page worksheet** (at the end) and runs in **≤2 hours** with a spreadsheet. I then apply it to your three cases.

  ---

  ### **Decision Procedure: REU for Anticipatory Action**  
  *Key concepts (for committee):*  
  - **Outcomes** are humanitarian impacts (e.g., "100k people receive aid").  
  - **Utility (U)**: Measures outcome value (0 = worst, 1 = best). *This is about values.*  
  - **Risk function (r)**: Captures how the committee weighs outcomes based on their rank (worst-to-best). *This is about risk attitude.*  
  - **REU calculation**: Combines probabilities, utilities, and risk weights.  

  **Workflow:**  
  1. **Define options & outcomes** (Program Officer)  
  2. **Assign utilities** (Committee)  
  3. **Elicit risk function** (Committee)  
  4. **Handle probabilities** (Forecasters + Committee)  
  5. **Compute REU ranges** (Spreadsheet)  
  6. **Compare & decide** (Committee/Procedure)  

  ---

  #### **Step 1: Define Options & Outcomes**  
  *Goal: List options and their possible outcomes.*  
  - **Program Officer** fills **Worksheet Part A**.  
  - **Sufficient answer**: For each option:  
    - A list of mutually exclusive outcomes.  
    - *Either* point probabilities (e.g., 30%), *or* ranges (e.g., 20–40%), *or* rankings (e.g., "Outcome A > Outcome B > Outcome C" in likelihood).  
  - **Stop if**: Outcomes are incomparable (e.g., "disease containment" vs. "food security"). *This requires committee discussion.*  

  ---

  #### **Step 2: Assign Utilities (U)**  
  *Goal: Assign utilities (0–1) to outcomes. **This is a value judgment**.*  
  - **Committee** assigns utilities using **Worksheet Part B**.  
  - **Method**:  
    - Identify **worst outcome** across *all* options → **U = 0**.  
    - Identify **best outcome** across *all* options → **U = 1**.  
    - For other outcomes, use **indifference comparisons**:  
      - *"Is Outcome X closer to worst or best?"* → Adjust until consensus on U (e.g., U_X = 0.4).  
  - **Sufficient answer**: All outcomes have a U between 0 and 1.  
  - **Stop if**: Committee cannot agree on U for any outcome. *This requires discussion (values are contested).*  
  - **Transparency**: Utilities are **stipulated by committee**; no theory assumed.  

  ---

  #### **Step 3: Elicit Risk Function (r)**  
  *Goal: Measure how the committee weights outcomes based on rank (not probability).*  
  - **Committee** answers **2–3 gambles** in **Worksheet Part C**.  
  - **Method**: Use **certainty equivalents for ranked gambles**:  
    - Present a gamble: *"Worst outcome (U=0) with probability p, Best outcome (U=1) with probability (1−p)."*  
    - Ask: *"What *sure outcome* (utility U_CE) makes you indifferent to this gamble?"*  
    - **REU insight**: U_CE = r(p) (due to worst→best ranking).  
    - Repeat for p = 0.3, 0.5, 0.7.  
  - **Sufficient answer**: U_CE for each gamble → points on r(p).  
  - **Stop if**: No consensus on U_CE for any gamble. *Fallback: Use r(p) = p (EU) and note this as "default."*  
  - **Transparency**:  
    - **Measured**: r(p) at elicited p-values.  
    - **Stipulated by director**: Interpolation for missing p (e.g., r(0.4) from r(0.3) and r(0.5)).  
    - **Judgment call**: Shape of r (e.g., convex = risk-averse, concave = risk-inclined).  

  ---

  #### **Step 4: Handle Probabilities**  
  *Goal: Convert soft probabilities to usable ranges.*  
  - **Program Officer + Forecasters** provide inputs.  
  - **Method**:  
    - **Point probabilities**: Use as-is (e.g., p = 0.4).  
    - **Ranges**: Use entire range (e.g., p ∈ [0.2, 0.4]).  
    - **Rankings**: Convert to *wide* ranges (e.g., for 3 outcomes ranked A>B>C: p_A ∈ [0.4, 0.8], p_B ∈ [0.1, 0.5], p_C ∈ [0.05, 0.3]).  
  - **Sufficient answer**: All probabilities as point values or ranges.  
  - **Stop if**: Rankings are too vague to assign ranges (e.g., "A might be 10% or 90%"). *This requires forecaster input or committee judgment.*  

  ---

  #### **Step 5: Compute REU Ranges**  
  *Goal: Calculate REU for each option using utilities, risk function, and probabilities.*  
  - **Spreadsheet** computes REU for all probability scenarios (best/mid/worst-case).  
  - **REU formula** (for outcomes worst→best):  
    ```  
    REU = U_1 * r(p_1) + U_2 * [r(p_1 + p_2) - r(p_1)] + ... + U_n * [1 - r(p_1 + ... + p_{n-1})]  
    ```  
    - **r(p)** uses elicited/stipulated values.  
    - For probability ranges, compute REU for **min**, **mid**, and **max** cases.  
  - **Output**: REU range for each option (e.g., Option A: [0.3, 0.6]).  

  ---

  #### **Step 6: Compare & Decide**  
  *Goal: Rank options or halt if indeterminate.*  
  - **Compare REU ranges**:  
    - **Dominance**: If Option A’s min REU > Option B’s max REU → **choose A**.  
    - **No dominance** (overlapping ranges) → **Stop and discuss**.  
  - **Stop if**:  
    - Probabilities are unreliable (REU ranges overlap significantly).  
    - No option dominates.  
  - **Output**: Winning option or "committee decision required."  

  ---

  ### **Worksheet: REU Decision Tool**  
  *(One page, filled by Program Officer/Committee)*  

  **Part A: Option Outcomes (Program Officer)**  
  | Option | Outcome | Probability (point, range, or ranking) |  
  |--------|---------|----------------------------------------|  
  | Early  | Modest aid to 50k people | 100% |  
  |        | (No uncertainty) | |  
  | Wait   | Large aid to 200k people | Range: [30%, 50%] |  
  |        | No aid (window closes) | Range: [50%, 70%] |  
  | Hybrid | Moderate aid to 100k people | 60% |  
  |        | Large aid to 150k people | 40% |  

  **Part B: Utility Assignment (Committee)**  
  | Outcome | U (0–1) |  
  |---------|---------|  
  | No aid (worst) | 0.0 |  
  | Modest aid to 50k people | 0.4 |  
  | Moderate aid to 100k people | 0.7 |  
  | Large aid to 150k people | 0.9 |  
  | Large aid to 200k people (best) | 1.0 |  

  **Part C: Risk Function Elicitation (Committee)**  
  | Gamble | U_CE (r(p)) |  
  |--------|-------------|  
  | Worst (U=0) with p=0.3, Best (U=1) with p=0.7 | U_CE = 0.5 → **r(0.3) = 0.5** |  
  | Worst (U=0) with p=0.5, Best (U=1) with p=0.5 | U_CE = 0.6 → **r(0.5) = 0.6** |  
  | Worst (U=0) with p=0.7, Best (U=1) with p=0.3 | U_CE = 0.7 → **r(0.7) = 0.7** |  
  *Interpolation for other p: Stipulated by country director (e.g., r(0.4) = 0.55).*  

  ---

  ### **Case Applications**  
  *Assumptions:*  
  - Utilities: Worst outcome (U=0), Best outcome (U=1).  
  - Risk function: Convex (risk-averse), with r(0.3)=0.5, r(0.5)=0.6, r(0.7)=0.7.  
  - REU computed via spreadsheet.  

  #### **Case 1: Plan trading guaranteed modest response for small chance of larger one**  
  - **Option A**: Guaranteed modest response (U=0.4, p=100%).  
  - **Option B**: 5% chance of large response (U=1.0), 95% chance of failure (U=0).  
  - **Probabilities**: Point values (5%, 95%).  
  - **REU Calculation**:  
    - Option A: REU = 0.4 * r(1.0) = 0.4 * 1.0 = **0.4**.  
    - Option B: Outcomes ranked worst→best: U_1=0 (p=0.95), U_2=1.0 (p=0.05).  
      REU = 0 * r(0.95) + 1.0 * [1 - r(0.95)].  
      *r(0.95) interpolated as 0.92* → REU = 1 - 0.92 = **0.08**.  
  - **Result**: Option A (REU=0.4) dominates Option B (REU=0.08). **Choose A**.  

  #### **Case 2: Plan with catastrophic worst case but highest EU**  
  - **Option C**: 10% catastrophic failure (U=0), 90% large success (U=1.0). **EU = 0.90**.  
  - **Option D**: Guaranteed moderate response (U=0.6). **EU = 0.60**.  
  - **Probabilities**: Point values.  
  - **REU Calculation**:  
    - Option C: Outcomes ranked worst→best: U_1=0 (p=0.10), U_2=1.0 (p=0.90).  
      REU = 0 * r(0.10) + 1.0 * [1 - r(0.10)].  
      *r(0.10) interpolated as 0.25* → REU = 1 - 0.25 = **0.75**.  
    - Option D: REU = 0.6 * r(1.0) = **0.60**.  
  - **Result**: Option C (REU=0.75) dominates Option D (REU=0.60). **Choose C**—but note:  
    > **⚠️ Committee warning**: *This option has the highest EU (0.90) but a catastrophic worst case. The procedure selects it because your risk function (r(0.10)=0.25) does not weight the catastrophe heavily. If this worries you, revisit your risk function in Part C.*  

  #### **Case 3: Unreliable forecast**  
  - **Option E**: 40–60% chance of moderate response (U=0.5), 40–60% chance of failure (U=0).  
  - **Option F**: Guaranteed low response (U=0.3).  
  - **Probabilities**: Wide ranges for Option E.  
  - **REU Calculation**:  
    - Option E (best-case): p_moderate=0.60, p_failure=0.40.  
      REU = 0 * r(0.40) + 0.5 * [1 - r(0.40)] = 0.5 * (1 - 0.58) = **0.21**.  
    - Option E (worst-case): p_moderate=0.40, p_failure=0.60.  
      REU = 0 * r(0.60) + 0.5 * [1 - r(0.60)] = 0.5 * (1 - 0.64) = **0.18**.  
    - Option F: REU = **0.30**.  
  - **Result**: Option F (REU=0.30) dominates Option E (REU∈[0.18,0.21]). **Choose F**.  
    - *If Option E’s REU range included values >0.30 (e.g., [0.18, 0.35]), the procedure would stop for committee discussion.*  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Elicit perfectly stable risk attitudes**: People may contradict their own r(p) in complex gambles.  
  2. **Handle committee disagreements**: Aggregating individual risk functions is untested in REU theory.  
  3. **Account for beneficiaries’ risk attitudes**: Only the committee’s preferences are captured.  
  4. **Resolve fundamental conflicts**: Stopping rules force discussion when values/probabilities are contested.  
  5. **Guarantee "correct" decisions**: REU theory is contested (e.g., is it truly distinct from EU?).  

  ---

  ### **Contested Issues (For Your Context)**  
  - **REU vs. EU**: REU may be a reformulation of EU with transformed probabilities (Schmidt 2004).  
  - **Risk-attitude stability**: People may not have consistent r(p) (Loomes 2010).  
  - **Committee coherence**: Groups may not have a unified risk function (Dietz 2023).  

  **Procedure design mitigates these by**:  
  - Separating value judgments (U) from risk attitudes (r).  
  - Flagging interpolations/stipulations.  
  - Halting when inputs are unreliable.  

  Let me know if you’d like the spreadsheet template or refinements.
