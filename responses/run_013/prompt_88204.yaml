  First, I need to validate their hypothesis. They're spot on about the naturalization vs. determinacy divide. But there's more. The user mentions a computational neuroscientist in the group who questions if brains even have selection-shaped consumers. That's crucial. Is this empirical point relevant or a category error?

  The user wants a diagnosis, not just a survey. So, digging deeper: the core disagreements are ontological (what representation *is*), methodological (how to study it), and metaphysical (realism vs. pragmatism). Each objection targets different layers. Disjunction challenges content determinacy, swampman targets historical necessity, distality questions specificity.

  The neuroscientist's point is both profound and potentially a category error. Profound because if brains don't have teleofunctions, teleosemantics fails empirically. But it's a category error if they assume the theory must fit current neuroscience without room for conceptual groundwork. Progress here might come from distinguishing constitutive naturalization from empirical implementation. Maybe interdisciplinary work where philosophers and neuroscientists collaborate on defining cognitive functions.

  The user also asked what counts as progress. Distinctions like separating representation-establishing from content-fixing functions could help. Or formal models showing tolerable indeterminacy. Shifting focus to how representations function in cognitive systems rather than their exact content. Also, clarifying if teleosemantics provides necessary or sufficient conditions.

  Swampman is testing constitutive accounts. If teleosemantics is constitutive, swampman lacks content. If not, it's a sufficient condition. This ties into the realism vs. pragmatism debate. The user's group needs to agree on what counts as success for a theory of content. Without that, they'll talk past each other.

  Lastly, the user might be frustrated with the lack of progress. They need strategies to move forward: maybe reframing the debate, interdisciplinary dialogue, or accepting indeterminacy as unavoidable. Emphasizing that teleosemantics offers a framework, not a final answer, could help. The neuroscientist's input is valuable but should engage with the philosophical framework, not dismiss it outright.
answer: |-
  Your diagnosis is insightful and largely correct—it cuts to the heart of the stalemate. The core disagreement isn't just about *answers* but about **divergent projects and expectations** for a theory of mental content. Here's a breakdown of the load-bearing issues, why progress feels impossible, and what might break the deadlock:

  ### 1. **The Core Split: Naturalization vs. Determinacy**
     - **You're right:** Teleosemanticists (Millikan, Dretske, Papineau) aim to **naturalize intentionality**—explaining how *any* state can "mean" something in a purely physical world. Their goal is to ground representation in causal/functional history to avoid dualism or brute intentionality. **Indeterminacy is acceptable** (even expected) because biological functions are context-dependent and coarse-grained. Content is fixed *relative to selective explanations*, not absolutely.
     - **Critics** (e.g., Fodor, Stich) often demand a **determinate, internalist semantics** where content is precise, intrinsic, and independent of historical accidents. They treat "representation" as a folk-psychological kind requiring unambiguous truth conditions. Swampman and disjunction problems weaponize this expectation.

  ### 2. **Why the Objections Feel "Lethal" (But Might Not Be)**
     - **Disjunction/Distality:** These are **diagnostics for indeterminacy**, not refutations. Teleosemantics *can* answer them (e.g., by appealing to "Normal Conditions" for proper function or consumer-driven teleology), but answers involve pragmatic/theoretical choices. Critics reject this as "gerrymandering"; naturalizers see it as **constraint by evolutionary explanation**.  
       *→ Load-bearing issue:* Is content fixed *solely* by internal/current facts (critics) or *partly* by historical/ecological context (teleosemantics)?  
     - **Swampman:** Tests the **constitutive role of history**. If Swampman has identical states with "content," critics argue history isn't *necessary* for meaning. Teleosemanticists reply:  
       - *Option 1:* Swampman's states *lack* genuine content (they merely mimic it).  
       - *Option 2:* Swampman inherits content from *similarity* to evolved systems (a fallback to descriptivism).  
       *→ Load-bearing issue:* Is teleosemantics offering a **constitutive account** (history *makes* representation) or an **explanatory framework** (history *explains why* we have representations)?  

  ### 3. **The Deeper Dissagreements**
     - **Ontological:** Is representation a **natural kind** (with an essence science can discover) or a **functional/folk category** we regiment pragmatically? Teleosemantics leans toward the latter.  
     - **Methodological:** Should philosophy **reduce representation to non-intentional terms** (teleosemantics) or **describe its formal structure** (critics)?  
     - **Metaphysical:** Does meaning require **grounding in physical history** (teleosemantics) or can it be **synchronic and internal** (critics)?  

  ### 4. **The Neuroscientist's Point: Profound AND a Category Error?**
     - **Profound:** If brains lack selection-shaped "consumer" mechanisms (e.g., if neural circuits are too plastic, multi-functional, or shaped by non-selective processes), teleosemantics **fails empirically** as a theory of *actual* cognition. This challenges its scientific viability.  
     - **Category Error:** If the neuroscientist demands teleosemantics *match* current neural models, they miss its **conceptual goal**. Teleosemantics is a *philosophical framework* for naturalizing content—it might *inform* neuroscience, not derive from it.  
     - **Synthesis:** The neuroscientist exposes a tension: Teleosemantics claims to be **empirically grounded** but risks being **untestable** if "functions" are ascribed post-hoc. Progress requires **interdisciplinary dialogue**—e.g., can neuroscience identify "consumers" with evolutionary functions?

  ### 5. **What Counts as Progress?**
     - **Clarify the Project:** Admit there are **two distinct goals**:  
       - *Naturalizing intentionality* (content need not be perfectly determinate).  
       - *Providing a compositional semantics* (content must be precise).  
       Teleosemantics addresses the first; critics want the second.  
     - **Embrace Indeterminacy:** Show **how much indeterminacy is tolerable** (e.g., via formal models of biological functions). Argue that vagueness exists in biology generally (e.g., "heart function" is indeterminate between pumping blood and circulating oxygen).  
     - **Reframe Swampman:** Treat it as probing **whether teleosemantics is constitutive or causal-historical**. Concede that Swampman *seems* intentional, but argue this intuition relies on *derived* intentionality from public language, not basic mental representation.  
     - **Shift the Question:** Move from "What determines content?" to **"How do representations function in cognitive systems?"** Teleosemantics excels at explaining misrepresentation, learning, and function—highlight this.  
     - **Neuro-Philosophy Collaboration:** Task the neuroscientist with identifying **neural correlates of "consumers"** (e.g., reward-prediction error systems). If none exist, teleosemantics may need revision; if they do, it gains empirical support.  

  ### Conclusion: Stalemate Diagnosis
  This is **not** an under-specified debate—it's a **clash of paradigms** with different success criteria. Teleosemantics succeeds if it naturalizes intentionality without residue; critics succeed if they show content can't be determinate without internalism. 

  **To move forward:**  
  1. **Accept** that perfect content determinacy is unattainable in naturalistic accounts.  
  2. **Focus** on teleosemantics' strengths (explaining function, error, and evolution).  
  3. **Integrate** empirical work: If brains lack discrete selected "consumers," teleosemantics must adapt (e.g., to cultural selection or predictive processing).  

  The deadlock breaks when both sides acknowledge they're solving different problems—and that neuroscience can arbitrate *which problem is worth solving*. Your reading group needs meta-theory, not more Millikan exegesis.
