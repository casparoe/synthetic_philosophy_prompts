     - **The verifier's role:** In debate, the verifier (judge) is not just a passive checker but an active participant that asks questions. However, in IP, the verifier also sends messages. But the key difference is that the verifier in debate is not necessarily following a fixed polynomial-time algorithm. In practice, the judge might be a human or a model that is itself complex. This breaks the standard computational boundedness assumption of IP (where the verifier is PPT). Also, the judge might be persuadable in ways that are not based on rigorous checking but on rhetorical skill. This is a major fudge.

