            Stage1: One might resist by questioning the 50-50 prior. Why should we assign equal probability to small and large? The doomsday argument typically assumes a prior that is uniform over the total number of humans, but that leads to problems (improper prior). We used a two-point prior for simplicity.
            Stage2: The self-indication prior might seem arbitrary: why should we assume we are a random observer from all possible observers? This leads to the "presumptuous philosopher" problem: it seems to give too much weight to large universes.
       - What the activity cannot reproduce: 
            The actual doomsday argument is about the future of humanity, and we are in the middle of the sequence? But in our activity, we fixed the total. In the real argument, we don't know the total and we assume we are a random sample from all humans that will ever exist. Also, we assumed a discrete uniform distribution over ranks. In reality, the birth rank is continuous (if we consider the fraction of humans born so far). But the discrete version captures the idea.

   What will go wrong?
