          - The real doomsday argument is about the future of humanity, and we are at a particular point in history. We assumed a uniform distribution over birth ranks, but in reality, the birth rate changes over time. Also, we assumed we are a random sample of all humans, but we are a sample from the early part (if the total is large) or the whole (if small). The activity captures the essence of the selection effect, but it simplifies the temporal aspect.
