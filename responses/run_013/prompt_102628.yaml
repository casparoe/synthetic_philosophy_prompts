   Stage 2: Self-Indication
     Setting:
       - Each student will be independently assigned to universe A (12 billion) or universe B (60 billion) with probabilities 1/6 and 5/6.
       - Then they are assigned a rank: 
            If in A: a random integer from 1 to 12.
            If in B: a random integer from 1 to 60.
