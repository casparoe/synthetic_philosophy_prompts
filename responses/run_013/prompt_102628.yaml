  ### Anthropic Reasoning In-Class Activity Design  
  **Goal:** Students experience the core selection effect of the doomsday argument and the countervailing self-indication intuition without prior exposure to the formal concepts.  

  **Materials:**  
  - 12 envelopes per student group (3 groups total).  
  - 60 identical slips of paper per group (e.g., blank index cards cut into quarters).  
  - Markers, dice (or a random number generator app).  
  - Whiteboard for recording scores.  

  **Setup (5 min):**  
  - Divide students into 3 groups (A, B, C) of 4.  
  - **Instructor script:** *"Today, we’re simulating observers in a multiverse. Each group will create two hypothetical universes: one with few observers (12 total), one with many (60 total). Your task is to infer which universe you’re in based solely on your observer ID."*  
  - Assign roles per group:  
    - **Recorder:** Tracks scores.  
    - **Distributor:** Shuffles/assigns observer IDs.  
    - **Statistician:** Calculates betting odds (Bayes’ rule provided).  
    - **Spokesperson:** Reports conclusions.  

  ---

  ### Stage 1: Selection Effect (Doomsday Core) (30 min)  
  **Rules:**  
  1. Each group creates two sets of observer IDs:  
     - **"Small Universe"**: 12 slips numbered 1–12.  
     - **"Large Universe"**: 60 slips numbered 1–60.  
  2. Groups shuffle both sets separately.  
  3. **Random assignment**:  
     - The distributor secretly flips a coin:  
       - *Heads*: Group is in the "Small Universe."  
       - *Tails*: Group is in the "Large Universe."  
     - **Without revealing the universe**, the distributor draws one random slip (*your observer ID*) from the assigned universe’s set and gives it to each student.  
  4. **Betting**:  
     - Students see their ID but not others’.  
     - Using Bayes’ rule (on whiteboard), statisticians compute:  
       - *P(Small | ID) = [P(ID | Small) × 0.5] / [P(ID | Small) × 0.5 + P(ID | Large) × 0.5]*  
       - *P(ID | Small) = 1/12* (if ID ≤ 12), *0* otherwise.  
       - *P(ID | Large) = 1/60* (any ID 1–60).  
     - **Bet**: Each student bets "Small" or "Large" (maximize expected points).  
  5. **Scoring (no money)**:  
     - Correct bet: +5 points.  
     - Incorrect: 0 points.  
     - Recorder tracks group score.  

  **Predictable Issue:** Students with IDs ≤12 bet "Small" (posterior = 5/6), but if the coin was tails ("Large" universe), they lose. This creates cognitive dissonance—*the math was sound, but they lost?*  
  **Handling:** Acknowledge frustration: "This is a single sample. Over many runs, betting ‘Small’ at low IDs wins 83% of the time. But today, luck might oppose you."  

  ---

  ### Stage 2: Self-Indication Response (25 min)  
  **Rules:**  
  1. **New prior**: "Universes aren’t equally likely. The probability of existing in a universe is proportional to its observer count."  
     - *P(Small) = 12/(12 + 60) = 1/6*  
     - *P(Large) = 60/72 = 5/6*  
  2. Groups repeat ID assignment (same coin flip), but now:  
     - Students compute new posterior:  
       - *P(Small | ID) = [P(ID | Small) × (1/6)] / [P(ID | Small) × (1/6) + P(ID | Large) × (5/6)]*  
       - For ID ≤12: *P(Small | ID) = 0.5* (self-indication cancels the Stage 1 shift!).  
     - **Bet again** with updated probabilities.  
  3. **Scoring**: Same as Stage 1.  

  **Predictable Issue:** Students with IDs ≤12 are now indifferent (50/50). Those who bet "Small" lose half the time in "Large" universes. *Why did the evidence stop working?*  

  ---

  ### Stage 3: Reference Class Problem (20 min)  
  **Twist:**  
  - Groups A and B: Define "observers" as *all humans*.  
  - Group C: Define "observers" as *humans born in January* (assume 1/12 of humans).  
  - **New totals**:  
    - "Small Universe": 12 total humans → 1 January-born.  
    - "Large Universe": 60 total humans → 5 January-born.  
  - Groups repeat Stage 1, but:  
    - Groups A/B use original IDs (1–12 or 1–60).  
    - Group C uses January-born IDs (1–1 for Small, 1–5 for Large).  
  - **Result**: Group C’s statisticians compute:  
    - *P(Small | ID) = 5/6* for any ID (since P(ID | Large) = 1/5 for Large-universe IDs).  
    - Groups A/B report strong "Small" bets for low IDs; Group C bets "Small" even at ID=5!  

  **Debate (10 min):**  
  - Spokespersons share conclusions.  
  - **Instructor prompts**: "Group C, why are you confident in ‘Small’ with ID=5? Groups A/B, would you trust their math?"  

  ---

  ### Debrief (10 min)  
  **Map activity to concepts**:  
  | **Activity Moment**          | **Formal Concept**                          | **Where to Resist**                                  | **Cost of Resistance**                              |  
  |------------------------------|---------------------------------------------|------------------------------------------------------|-----------------------------------------------------|  
  | Stage 1: Low ID → Bet "Small" | Doomsday argument (selection effect)        | Reject 50/50 prior                                   | Requires alternative prior; weakens predictive power |  
  | Stage 2: Indifference at ID≤12 | Self-indication (SIA)                      | Reject "random observer" assumption                  | Loses ability to explain why we observe anything at all |  
  | Stage 3: Group C’s inference  | Reference class problem                     | Argue reference class is arbitrary                   | Undermines all inferences (no objective "observer" definition) |  

  **Key Takeaways**:  
  1. **Doomsday core**: Your ID *is* evidence about total observers, but only via selection effects—not future predictions.  
  2. **Self-indication**: More observers → higher prior probability of existing. This can neutralize the doomsday shift.  
  3. **Reference class**: Conclusions depend entirely on who counts as "you" in the multiverse.  

  **What the Activity Can’t Capture**:  
  - **Real-world doomsday**: Unlike the simulation, humanity’s future isn’t a fixed binary (Small/Large). We have *dynamic evidence* (e.g., risk of nuclear war, climate change) that interacts with anthropic reasoning. This requires layering empirical predictions atop the selection effect—**mention this in debrief**.  

  **Predictable Issues & Fixes**:  
  - **Bayes confusion**: Provide simplified formulas upfront (use fractions, not decimals).  
  - **Group C’s totals seem arbitrary**: Emphasize that reference class definitions *are* arbitrary—this is the point.  
  - **SIA feels unnatural**: Note that SIA isn’t a "solution," but a competing intuition. Philosophers debate whether it’s valid.  

  **Timeline**:  
  - 0–5 min: Setup  
  - 5–35 min: Stage 1 (including 15 min for assignment/betting)  
  - 35–60 min: Stage 2  
  - 60–80 min: Stage 3  
  - 80–90 min: Debrief  

  This design forces students to *live* the paradox: Stage 1 makes doomsday intuitive; Stage 2 undermines it; Stage 3 fractures consensus. By the end, they’ll grasp why anthropic reasoning remains contentious—and why it matters for cosmology, AI risk, and multiverse theories.
