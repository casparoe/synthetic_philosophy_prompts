     - Stage1: When assigning ranks for the large scenario, if we do it by drawing without replacement from 1-60, we might get ranks above 60? No, because we are drawing from 1-60. But we have to make sure we assign distinct ranks. We can use a random permutation of 1-60 and take the first 12? Or use a computer.
