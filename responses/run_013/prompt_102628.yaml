     - Problem: In stage 1, if the true total is 60, then the students with rank<=12 will lose. They might feel that the reasoning is flawed. 
          Solution: Explain that the reasoning was still correct: they had a 5/6 chance of being right. They were just unlucky in this instance. We can run a hypothetical: if we did this many times, how often would they be right?
