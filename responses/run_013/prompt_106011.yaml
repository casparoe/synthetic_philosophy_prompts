     - "rival_if_it_falls": "pragmatism" (or if it collapses, then the rival; otherwise, if refuted, then essentialism? but we don't think so. We think if it collapses, it collapses into pragmatism.)
     - "unfalsifiability_assessment": a string explaining the risk and whether it's a bug or feature.
     - "what_i_should_update": a string (what credence and what to stop saying)
     - "confidence": 0.7

