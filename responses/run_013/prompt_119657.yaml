prompt: |-
  I'm putting together the research plan for a three-year fellowship I've been awarded on moral formation through life-writing, and I need to decide which of the genuinely open conceptual questions in that area deserve the time. The constraint I've set myself is that the output should be useful to people who actually design programmes that put exemplary lives in front of students — seminaries, medical humanities, military ethics, character education in schools, the sort of institution that still assigns Plutarch's paired lives or a saint's life and hopes something will happen — rather than a contribution to a debate only other philosophers read. I've been circling a tension I can't state cleanly, and I suspect it is the hinge of the whole area. Call it the legibility/fidelity trade-off: the more a life is shaped so that its moral can be read off it — the hagiography, the encomium, the edifying obituary — the more the reader can extract a lesson, but the more the account has been purged of precisely the contingency, ambiguity and luck that make a real life worth learning from; the more faithfully a biography restores that contingency, the less it delivers anything that could be called a lesson. Every pedagogy of exemplars seems to sit somewhere on that trade-off without anyone admitting it, and I suspect the historical genres I'm drawing on have quietly inherited one side of it.

  Beyond that hinge I have half-formulated several further questions and no idea which are load-bearing: whether an exemplar teaches by proving a way of life possible rather than probable, so that the single case functions as a possibility proof rather than as evidence; whether the moral of a life is available to the person who lived it or only to the biographer who outlives it; whether admiration is a reliable faculty of moral perception or merely tracks status, charisma and whatever the readership already reveres; whether the form of the account — praise, confession, denunciation, warts and all — fixes what can be learnt from it, so that certain genres can only teach certain virtues; and whether anything at all transfers from a life set in circumstances radically unlike the learner's, or whether the genre is only ever a mirror that returns the reader's existing commitments.

  What I want from you is a defended research agenda rather than a survey or a reading list. Given three years and one person, which of these questions — or others I have failed to name, including any that would make my legibility/fidelity framing look naive — should come first, and in what order? Make the criteria explicit: which questions are upstream of which, which are tractable with the tools of philosophy rather than needing empirical collaborators, which are neglected, and which look urgent but would change nothing downstream if settled. I should also like to know what evidence or developments over the next two or three years would move a question up or down the ranking, and where you think I have mis-framed the area altogether. Please write in British English.
reasoning: |-
  Okay, the user is a researcher who's been awarded a three-year fellowship on moral formation through life-writing. They need to prioritize which conceptual questions to focus on, with the output being useful for practitioners designing educational programs using exemplary lives, rather than just academic philosophy debates. The main tension they've identified is the legibility/fidelity trade-off: how shaping a life story for clear moral lessons strips away the real-life messiness that makes it valuable for learning. 

  Looking deeper, the user seems frustrated by how this core tension isn't openly addressed in existing literature. They want practical impact—their frustration with "debates only other philosophers read" suggests they're tired of purely theoretical discussions. The real need is bridging theory and practice for curriculum designers who work with texts like Plutarch or saint biographies. 

  The user lists several half-formed questions beyond the main tension: whether exemplars serve as "possibility proofs," if the moral of a life is accessible only posthumously, whether admiration is reliable, how genre constrains learning, and if transfer across contexts is possible. These are all valid, but some are more foundational than others. 

  The legibility/fidelity framework seems robust but might oversimplify by implying a binary. In reality, it's a spectrum where practitioners intuitively navigate compromises. The user might be underestimating how historical genres (like hagiography) actively exploit this tension—their "purging" of contingency is a feature, not a bug, for pedagogical efficiency. 

  Prioritizing questions: The legibility/fidelity dilemma must come first—it's the hinge everything else turns on. Without clarifying this, other questions float untethered. Next, genre constraints are urgent because educators choose texts based on form (e.g., assigning Plutarch’s paired lives vs. Augustine’s Confessions). This directly impacts program design. Admiration’s reliability and "possibility proofs" could be merged into a unified question about psychological reception—how readers actually internalize exemplars—but this might require empirical collaboration, which conflicts with the user’s solo focus. The transferability question, while important, is less urgent; educators already assume cross-context learning happens (e.g., using medieval saints in modern classrooms). 

  Tractability matters: Philosophical tools can dissect legibility/fidelity and genre constraints through conceptual analysis and historical case studies (e.g., comparing Plutarch’s editorial choices to a modern "warts and all" biography). Empirical methods would better address admiration or transfer, so those are lower priority unless reframed theoretically. 

  Downstream impact: Settling legibility/fidelity would force practitioners to consciously position their programs on this spectrum (e.g., "We prioritize fidelity, so we use unvarnished diaries"). Genre analysis would help them match texts to learning objectives (e.g., confession for humility vs. encomium for courage). 

  Mis-framing risk: The user’s "single case as possibility proof" idea is sharp but possibly redundant—if legibility/fidelity is resolved, the "proof vs. evidence" distinction might emerge naturally. The bigger blind spot is assuming biographies must "deliver lessons." Some genres (e.g., elegy) may teach precisely by withholding moral clarity, inviting readers to sit with ambiguity. 

  Future developments: If empirical studies on admiration or transfer emerge (e.g., fMRI scans showing how brains process idealized vs. flawed exemplars), those questions could rise in priority. For now, they’re speculative. 

  Recommendation: Year 1 tackles legibility/fidelity, using case studies from the user’s historical genres. Year 2 examines genre constraints, testing how forms limit teachable virtues. Year 3 synthesizes findings into a toolkit for practitioners, perhaps exploring if "contaminated" genres (e.g., a saint’s life with deliberate ambiguities) subvert the trade-off. 

  The user’s framing isn’t naive—it’s the right entry point. Just needs refining to avoid binaries and accommodate how pedagogical genres already manipulate the tension they’ve identified.
answer: |-
  Here’s a prioritised research agenda grounded in your constraints, with explicit criteria and a defence of sequencing. The goal is **maximising actionable insights for programme designers** while acknowledging the centrality of your "legibility/fidelity" tension.

  ### Core Criteria for Prioritisation
  1.  **Upstream/Downstream Impact:** Does answering this question clarify or constrain answers to others?
  2.  **Tractability (Solo Philosophical Work):** Can it be rigorously explored using conceptual analysis, historical case studies, genre theory, and moral philosophy without *requiring* new empirical data?
  3.  **Neglect & Urgency:** Is it under-theorised in ways directly impacting practitioners? Does it address a silent, pervasive problem?
  4.  **Actionability:** Will resolving it yield concrete guidance for programme design (text selection, framing, pedagogical approach)?
  5.  **Mis-framing Check:** Does it challenge or refine the core legibility/fidelity frame?

  ### The Prioritised Agenda
  **Year 1: Core Tension & Genre Constraints (The Foundational Work)**
  *   **Question 1: The Legibility/Fidelity Trade-off - Refined & Historicised.**
      *   *Why First?* It *is* the hinge. Upstream of everything. Practitioners *must* navigate this, usually unconsciously. Your articulation is powerful, but needs refinement beyond a binary.
      *   *Refinement:* Analyse *how* specific historical genres (hagiography, Plutarchan parallel lives, spiritual autobiography, modern critical biography) *engineer* legibility or fidelity. What techniques purge contingency? How do "warts and all" accounts *preserve* ambiguity? Map this onto a spectrum, identifying hybrid strategies.
      *   *Tractability:* Perfect for philosophical/historical textual analysis. Compare textual strategies across key genres in your corpus.
      *   *Neglect/Urgency:* While the tension is felt, the systematic analysis of *how genres construct it* is lacking. Practitioners inherit genre conventions uncritically.
      *   *Actionability:* Output = A diagnostic framework. Helps designers: a) Identify *where* on the spectrum their chosen texts sit, b) Understand *what* (contingency, moral clarity) is gained/lost by that choice, c) Consciously select texts based on desired pedagogical focus (e.g., clear rules vs. complex discernment).
      *   *Mis-framing Check:* This work tests your frame. Does "fidelity" collapse under scrutiny? Is "legibility" always pedagogically desirable? You might find genres that *subvert* the trade-off (e.g., Augustine’s *Confessions* uses contingency *for* legibility of a specific moral point about grace).
  *   **Question 4: Genre as Constraint on Teachable Virtues.**
      *   *Why Next?* Directly downstream from Q1. If genre shapes *what* is presented (legibility/fidelity), it logically constrains *what can be learned*.
      *   *Focus:* Analyse how specific genres inherently favour teaching certain virtues and inhibit others. Does hagiography naturally teach fortitude but obscure prudence? Does critical biography foster critical thinking but undermine emulation? Does Plutarch’s parallelism teach comparative judgement but simplify context? Does confession teach humility but risk self-absorption?
      *   *Tractability:* Philosophical analysis of genre conventions + virtue ethics. Requires close reading of exemplars *within* their generic constraints.
      *   *Neglect/Urgency:* Hugely under-discussed. Practitioners choose texts based on subject matter or tradition, rarely considering how the *form* predetermines the learnable virtues.
      *   *Actionability:* Output = Genre-Virtue Mapping. Empowers designers to: a) Match genre to *specific* virtue-learning objectives (e.g., use Plutarch for comparative justice, confession for humility), b) Avoid genre-mismatches (e.g., using pure hagiography to teach nuanced ethical discernment), c) Consider multi-genre approaches for balanced virtue development.
      *   *Downstream Impact:* Informs Q2 (Possibility Proof) – genre shapes *how* possibility is presented. Connects to Q5 (Transfer) – genre mediates contextual distance.

  **Year 2: The Learner's Engagement (Reception & Transfer)**
  *   **Question 3: Admiration - Reliable Perception or Status Tracking? (Reframed as "Conditions for Authentic Moral Perception")**
      *   *Why Here?* Builds on Year 1. Once you know *what* a genre *offers* (Q1, Q4), how does the learner *receive* it? This is crucial for effectiveness.
      *   *Reframe:* Shift from a binary to analysing the *conditions* under which engagement with an exemplar fosters reliable moral perception versus mere charisma-worship or confirmation bias. How do genre, pedagogy, and reader context influence this?
      *   *Tractability:* Philosophical (virtue epistemology, moral psychology, social philosophy). Analyse historical receptions (e.g., how different eras read the same saint), critiques of admiration (e.g., Nietzsche, feminist critiques of canon formation). *Less* empirical than exploring the psychology of admiration *directly*.
      *   *Neglect/Urgency:* Critical for countering the "mirror" risk (Q5) and ensuring programmes don't just reinforce existing biases or create hero-worship.
      *   *Actionability:* Output = Guidelines for Fostering Critical Engagement. Helps designers: a) Structure pre/during/post-reading activities to mitigate bias, b) Select texts that challenge (not just confirm) audience assumptions, c) Frame exemplars to highlight *reasons* for admiration beyond status, d) Incorporate diverse/counter-exemplars.
      *   *Connection:* Directly addresses the "mirror" half of Q5. Informs Q2 – authentic perception is needed to grasp the "possibility proof".
  *   **Question 5: Transfer Across Contexts - Genre as Bridge or Barrier?**
      *   *Why Now?* The ultimate test for practitioners: Can lessons from Plutarch's Greeks/Romans, medieval saints, or 19th-century medics land with modern students?
      *   *Focus:* How does genre construction (Q1) *mediate* the perceived distance of context? Can certain genres (e.g., those emphasizing universal human struggles, specific narrative techniques) *bridge* contextual gaps more effectively than others? Is "abstraction" (extracting general rules) the only path, or can "immersion" in a faithfully rendered different context also be pedagogically powerful?
      *   *Tractability:* Philosophical (narrative theory, hermeneutics, ethics of difference). Analyse how texts *themselves* signal universality or particularity. Compare treatments of similar virtues across vastly different contexts/genres.
      *   *Neglect/Urgency:* Practitioners often rely on hope or vague notions of "human nature." A genre-sensitive analysis provides concrete tools.
      *   *Actionability:* Output = Strategies for Contextual Translation. Helps designers: a) Choose genres/texts with inherent bridging potential (e.g., focusing on dilemmas over specific practices), b) Develop pedagogical framing that explicitly addresses context (neither ignoring difference nor rendering the exemplar irrelevant), c) Identify core, transferable elements vs. context-bound particulars within a text.
      *   *Downstream:* This is the practical culmination. Relies on understanding *what* is being transferred (shaped by genre/Q4) and *how* it's perceived (Q3).

  **Year 3: Synthesis, Application & Refinement**
  *   **Integrate Findings:** Develop a unified framework for programme design incorporating the Legibility/Fidelity Spectrum, Genre-Virtue Mapping, Conditions for Authentic Perception, and Contextual Bridging Strategies.
  *   **Question 2: Possibility Proof vs. Probability Evidence (as Implementation Insight)**
      *   *Positioning:* Not a primary research question, but a crucial *analytic lens* emerging from the prior work. Does your framework suggest when exemplars *should* be presented primarily as "proof of possibility" (inspiring radical virtue) vs. "evidence for probability" (modeling achievable steps)? This is likely context-dependent and relates to genre choice and pedagogical framing.
      *   *Actionability:* Refine design guidelines to help practitioners decide *when* to emphasise "This shows X is humanly possible!" vs. "This shows how X navigated a situation somewhat like yours."
  *   **Develop Outputs:** Create practical resources (e.g., "Choosing Life-Writing Texts: A Designer's Guide," annotated case studies, workshop formats) directly aimed at your target institutions.
  *   **Revisit Core Tension:** With 2 years of analysis, can you propose genre innovations or pedagogical practices that *mitigate* the legibility/fidelity trade-off for specific purposes?

  ### Deliberately Deprioritised (With Reason)
  *   **Q: "Whether the moral of a life is available to the person who lived it..."** Intriguing, but primarily metaphysical/autobiographical. Less directly actionable for designers focused on learners engaging with *other* lives. Downstream impact on practice is low. A fascinating footnote, not core.
  *   **Q: "Whether anything at all transfers..." (as posed absolutely):** The extreme "mirror" scepticism. While Q5 addresses transfer *challenges*, starting with absolute scepticism is paralysing and doesn't match practitioner experience (something *does* often transfer, even if complex). Your work should *improve* transfer, not debate its possibility.

  ### What Would Change the Ranking?
  *   **New Empirical Work:** A robust, peer-reviewed study demonstrating a *specific* mechanism of moral learning (or failure) from life-writing could elevate Q3 (Admiration) or Q5 (Transfer), demanding integration. Evidence that genre has *no* significant impact on virtue learning would challenge Q4 (but this seems unlikely).
  *   **Major Shifts in Practice:** Widespread adoption of a new life-writing form (e.g., complex interactive digital narratives) in your target institutions would necessitate investigating its place within your framework.
  *   **Critical Reception:** If early publications on the legibility/fidelity trade-off reveal a fundamental flaw in the framing (e.g., showing it ignores a key historical genre's strategy), Year 1 focus would need significant adjustment.

  ### Critique & Refinement of Your Framing
  Your "legibility/fidelity" frame is **strong and central**, not naive. However:

  1.  **Beyond Trade-off?** Explore if certain genres *transcend* or *redefine* the trade-off rather than just sitting on the spectrum. Does a deeply faithful account of contingency, *properly framed pedagogically*, achieve a *different kind* of legibility (e.g., legibility of *moral complexity* itself)? This is likely your most promising avenue for original contribution.
  2.  **"Lesson" vs. "Formation":** Your phrasing ("the less it delivers anything that could be called a lesson") hints at a possible mis-framing. Is the goal always an extractable "lesson"? Or is the *process of engagement* – the confrontation with ambiguity, the exercise of judgement, the spark of admiration – itself the formative act, even without a neat takeaway? This connects to Q3 and Q5. Practitioners might need to broaden their understanding of "learning outcomes" beyond simple lessons.
  3.  **Agency of the Text/Genre:** Your frame focuses on the *designer's* shaping. Remember genres also have their own agency – they constrain *how* lives *can* be told and carry historical baggage that shapes reception.

  ### In Summary
  Your agenda is admirably focused on impact. By starting with the **legibility/fidelity tension (Q1)** and its direct consequence for **teachable virtues through genre (Q4)**, you establish the essential groundwork. Year 2 tackles the crucial reception side with the **conditions for authentic perception (Q3)** and the practical challenge of **transfer across contexts (Q5)**, using the tools of philosophy to analyse how texts and historical reception patterns illuminate these issues. Year 3 synthesises this into actionable guidance, using the "possibility proof" concept (Q2) as a useful analytic tool within the established framework. This sequence maximises tractability, addresses the most urgent and neglected issues for practitioners, and builds logically towards impactful outputs.
