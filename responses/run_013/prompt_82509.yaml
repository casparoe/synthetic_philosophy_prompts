  | State neutrality                 | Constraint on the optimization objective                                    | distorted  | The constraint (e.g., symmetric weights) is clear, but the objection is that the constraint choice is non-neutral. | Vagueness in source? The source doesn't specify which constraints are neutral. |
  | Plural conceptions of the good   | Multiple loss functions from different groups                               | clean      | Nothing. We have multiple objectives.                                                                       | N/A                             |
  | Fair aggregation rule            | Social welfare function (e.g., Nash)                                        | clean      | The rule is well-defined.                                                                                   | N/A                             |
  | Impossibility of neutrality      | Any aggregation rule has inherent bias (e.g., Nash is egalitarian)          | clean      | We can show mathematically that Nash has inequality aversion.                                               | N/A                             |
  | Framework commitments            | Choices in problem setup: group definition, loss function cardinality, etc. | absent     | The philosophical concern about meta-choices isn't represented in the optimization problem.                 | Defect of ML framework? We don't model the choice of the setup. |
  | Substantive vs. formal neutrality| Distinction between the rule's form and its ethical implications            | absent     | In ML, we see the rule's properties (like inequality aversion) but don't have a formal way to label it "substantive". | Vagueness in source? The distinction is philosophical. |

  ### Key Questions:

  **Can neutrality be represented as a constraint?**
  - Yes, but only formal (procedural) neutrality: e.g., symmetry and content-indifference as invariance. However, the main objection is that this formal constraint does not achieve substantive neutrality because the choice of constraint and the aggregation rule embed values. So representing it as a constraint does assume that the constraint itself is neutral, which is exactly what the objection challenges.

  **What would change my mind?**
  - If someone could define a mathematical condition for neutrality that is both (a) content-independent and (b) does not implicitly favor any particular ethical view (like egalitarianism), and (c) is not vacuously empty (like requiring that no trade-offs are ever made), that would change my mind about the possibility of translating neutrality without distortion. But such a condition likely does not exist (as per impossibility theorems in social choice).

  **Main objection translated:**
  - The Nash social welfare function is not neutral; it is a particular ethical choice (egalitarianism). Calling it neutral is misleading.

