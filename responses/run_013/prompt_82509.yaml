  ### Key Takeaways  
  - **What you can resolve**: Enforce symmetry, avoid lexical priority, and use Nash for fair aggregation. This satisfies *procedural neutrality*.  
  - **What remains contested**: Whether Nash (or any rule) is *substantively neutral*. Philosophy says no; ML has no tool to prove otherwise.  
  - **Actionable path**: Shift debate from "neutrality" to "which aggregation rule stakeholders accept as legitimate." Use mechanism design to let groups negotiate weights.
