prompt: |-
  Alright, I need you to be a philosopher of math slash formal epistemologist for this one — someone who actually works on resource-bounded reasoning and won't just hand me the standard Bayesian party line. Think carefully, brainstorm for a bit before you commit to a structure, and don't give me the smooth survey version. I want the version where you're genuinely trying to break my view, not the version where you're explaining it to a seminar.

  Here's the view I've talked myself into. It's a family of ideas that circulates under names like "heuristic arguments" and "the presumption of independence," and here's my reconstruction of it.

  Core claim: correlation requires a mechanism, mechanisms are programs, and short programs are scarce. So once you've conditioned on everything expressible in, say, b bits, you should treat what's left as independent — not as a subjective prior you're allowed to have, but as a structural fact about the world. The formal picture I've been using: a heuristic argument about an instance x is a short program H that samples pairs (x, y), where y is whatever you care about — a witness, a value, a property — and H is short enough that it can't be manufacturing the correlation by brute force. You then read off a conditional: given that the pair came out of a heuristic of complexity at most b, treat x and y as independent conditional on H's own description. All the correlation has to be paid for by the length of H; whatever's left over is noise. So "this instance is generic, there's nothing special about it" becomes a claim with content — it's the claim that no short program would have to exist for the instance to be special. And the whole thing is supposed to be approximately self-consistent: heuristics that both apply to the same question should agree up to the complexity slack, and there shouldn't be a short way to Dutch-book someone who reasons this way.

  The philosophical part I actually care about: I think this is the right formalization of what a bounded agent knows. Better than just having a prior over computable hypotheses, because it lets you reason about instances you can't describe, and because it turns "there's no reason for these two things to be related" into something with content instead of a shrug. And I think the real content of the theory is the self-consistency, not any particular heuristic.

  So — what would count against it? I want the defeaters sorted by how decisive they'd actually be, and I want you to say for each one whether a committed defender would concede it or dismiss it, and why. Include the ones that would make me abandon the view outright, the ones that are merely awkward, and the ones that are cosmetic. I've already thought of the obvious two — that complexity is relative to your choice of universal machine, and that an adversary who knows your complexity budget can pick the pair after the fact so that no short mechanism explains a correlation that is nonetheless real — so if that's your whole answer I'll be disappointed. Tell me whether the view survives those and how, or admit that it doesn't.

  A few things I specifically want addressed, though don't let them box you in:

  - Can a short heuristic smuggle in arbitrary correlation — say, by being short but running a long computation, or by exploiting a loophole in how "the pair came out of H" is defined? If yes, is the principle vacuous or is it just wrong?
  - Is there a genuine self-application problem? If I use the principle to reason about my own predictions ("I can't find a short mechanism that would make me wrong, so I'm probably right"), does that break, and does the breakage undermine the claim that this is the right formalism for bounded agency rather than just a clever way to guess about external instances?
  - Does a rival get the same mileage more cheaply? If plain minimum-description-length Bayesianism, or a prior over programs, reproduces everything the heuristic-argument machinery delivers, then my "better than a prior over hypotheses" claim is just branding.
  - What does my view predict that its rivals don't? I want at least one thing that's actually discriminating, not a restatement.
  - Finally: has the view been qualified into unfalsifiability? If every failed heuristic gets absorbed by saying "the slack was larger than you thought," that's a problem — but I want you to say whether it's a fatal problem or the normal cost of doing business for a principle of this kind. Be honest; if the answer is "it's well insulated and that's fine," say so, and if it's "it's insulated and that's damning," say that too.

  No citations, no reading list, no bibliography — I don't have web access and neither will you, so if you want to invoke a known result just describe it in your own words. Don't lean on names and dates.

  After the essay, give me a structured summary as a JSON object with exactly these fields:

  - position: one sentence restating the view you're assessing.
  - predictions_that_rivals_dont_make: array of strings, each a concrete discriminating prediction.
  - defeaters: array of objects, each with id (D1, D2, ...), defeater (one sentence), kind (one of: formal-inconsistency, counterexample, empirical, conceptual-incoherence, rival-does-better, self-application), what_would_have_to_be_true (the state of affairs that would make this a real defeater), decisiveness (one of: fatal, serious, awkward, cosmetic), defenders_would_concede (one of: yes, no, partly — plus a short clause saying why), and already_available (one of: yes, no, speculative).
  - insulation: an object with is_it_insulated (yes/no/partly), how (short), is_that_a_problem (yes/no/partly), why (short).
  - most_persuasive_to_me: string — the single defeater that should move me most, and why.
  - bottom_line: one or two sentences with your actual verdict.

  The essay should be where the arguement lives; the JSON should be tight, no prose padding inside the fields.
