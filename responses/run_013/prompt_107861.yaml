  The exam question should force students to confront that fitting the examples is different from identifying the actual rule. They'll need to discuss what bridges that gap - things like the drawer's intention, simplicity/naturalness of descriptions, or how the rule would apply beyond the given examples. I should emphasize that this is where the real philosophical debate lies, not in simple underdetermination.

  For the model answer, I'll demonstrate box-by-box how both rules fit the twelve examples, then show the divergence at the thirteenth box. I'll be explicit about what's settled (both rules fit the data) versus contested (what makes one "correct"). The marking scheme should reward students who articulate why we prefer one rule over the other beyond mere fit.

