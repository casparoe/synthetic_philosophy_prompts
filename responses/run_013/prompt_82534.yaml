  Below is a decision tree designed to map philosophical positions on sphexishness and agency, starting from the wasp-and-cricket case and branching through concrete examples. The tree uses three axes—**Mechanism** (fixed routine vs. updatable model), **Reasons** (explicit representation vs. causal tracking), and **Attribution** (agent-level vs. subpersonal)—to sort positions without relying on labels. Each branch point is a question about a case, answerable without prior knowledge of free will debates. The tree reaches all requested positions and identifies gaps.

