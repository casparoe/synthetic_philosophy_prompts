  ### **Decision Tree: Sphexishness and Agency**

  #### **Start: The Wasp-and-Cricket Case**
  *The wasp drags a paralyzed cricket to her burrow, leaves it to inspect the interior, and if the cricket is moved during inspection, she retrieves it and repeats the loop. Humans sometimes exhibit similar loops (e.g., autopilot driving past a turn).*

  1. **Mechanism Test: Fixed or Updatable?**  
     *Case: A pianist practices a piece until it becomes automatic. One day, the sheet music changes, but she keeps playing the old version despite noticing the error. After several attempts, she adjusts. Does this adjustment show her behavior is governed by an internal model that can update?*  
     - **Yes** → Go to 2 (Mechanism: Updatable).  
     - **No** → Go to 3 (Mechanism: Fixed trigger-response).  

  2. **Reasons Test: Represented or Tracked?**  
     *Case: A chef always chops vegetables before meat. When told the meat must marinate first (a new reason), she immediately changes her routine. Does this show she represented the* reason *for her old habit (e.g., "chopping first saves time") and revised it?*  
     - **Yes** → Go to 4 (Reasons: Explicit representation).  
     - **No** → Go to 5 (Reasons: Causal tracking).  

  3. **Scalar Test: Degree or Binary?**  
     *Case: The wasp repeats the loop 50 times. A human might repeat a habit (e.g., checking a locked door) 3 times before stopping. Is the difference just "more neurons," or a qualitative shift?*  
     - **"More neurons" (quantitative)** → **Leaf: Hard Sphexishness**  
       *Awkward commitment: Your "deliberate" thoughts are just longer loops.*  
     - **Qualitative shift** → **Leaf: Deflationary Scalar View**  
       *Awkward commitment: No clear threshold exists between sphexishness and agency.*  

  4. **Attribution Test: Agent or Mechanism?**  
     *Case: During autopilot driving, you miss your turn. You later recall "your body acted, not you." Is the autopilot action attributable to* you *or a subpersonal mechanism?*  
     - **To the agent (you)** → Go to 6.  
     - **To a subpersonal mechanism** → **Leaf: Interpretivism**  
       *Awkward commitment: A calculator could be an "agent" if we interpret it as one.*  

  5. **Awareness Test: Illusory or Unconscious?**  
     *Case: You quit biting nails by wearing gloves. You feel "in control," but the habit breaks only when gloves block it. Is the feeling of control part of the habit loop?*  
     - **Yes** → **Leaf: Illusionism**  
       *Awkward commitment: The feeling of agency is a trick played by the mechanism.*  
     - **No** → **Leaf: Hard Sphexishness** (as in 3).  

  6. **Determinism Test: Predictable or Open?**  
     *Case: A neuroscientist predicts your decision to avoid sweets via brain scans. If predictions are perfect, does that negate agency?*  
     - **No** → **Leaf: Compatibilist Reasons-Responsiveness**  
       *Awkward commitment: A brainwashed person could be "free" if responsive to reasons.*  
     - **Yes** → **Leaf: Libertarian Agent Causation**  
       *Awkward commitment: Agency requires uncaused causes (no physical basis).*  

