prompt: |-
  I'm running a lunchtime session at work on escalation of commitment -- 40 minutes, a dozen PMs and engineers, no econ background -- and I want to teach it thru the dollar auction instead of the usual doomed-project war story. Don't explain the idea to me, plan how I explain it.

  I'm going to use a parametrized version: winner pays their bid and takes the dollar, loser pays their bid too but gets a fraction r of it back, and I'll walk through r = 1, then r = 1/2, then r = 0. My hunch is that at r = 1 theres no trap at all and the trap shows up continuously as r falls, which should make the escalation feel inevitable rather than like a magic trick -- tell me if that's the right spine, or whether I should just do r = 0 straight and skip the warm-ups.

  What has to come first, what depends on what, and where in the sequence does the locally-rational step actually live? I want them to feel that dropping out at 90 cents is the crazy move and continuing is the sane one, and that nobody in the room has to be greedy or stupid for any of it to happen. Which misconceptions should I expect -- I'm betting on "this is just the sunk cost fallacy", "they just need more discipline and know when to quit", and "the auctioneer is tricking them" -- and at what exact point in the sequence do I kill each? What does the auction give me as a carrying example that a failing-project anecdote doesn't, and what do I have to bolt onto it to get from two bidders to a whole company?

  Also tell me what to openly skip at this level and say so out loud (I assume anything with subgame-perfect in it), and give me one question to ask at the end that would show they've got the structure and not just the story.
reasoning: |-
  We are going to run a dollar auction to illustrate escalation of commitment. The key parameters: 
   - The winner pays their bid and gets the dollar.
   - The loser pays their bid but gets a fraction `r` of it back. So if `r=0.5`, the loser pays their bid and then gets half of it back (so net loss is half the bid).

   We'll vary `r` to show how the trap emerges.

   Steps:

   1. Introduction (5 minutes)
      - Set the stage: "We're going to play an auction for a dollar. But it's a special auction. I'll explain the rules."
      - Rules: 
          - Two volunteers (to keep it simple for now). They will take turns bidding. The bidding must be in whole cents, and each bid must be higher than the previous.
          - The auction ends when one player drops out. The one who drops out is the loser, and the one who remains is the winner.
          - Payouts:
              Winner: Gets $1 but pays their last bid. So if they win at $0.90, they get $1 and pay $0.90 -> net $0.10.
              Loser: Pays their last bid but gets back `r` times that bid. So if they bid $0.80 and then drop out, they pay $0.80 and get back `r*$0.80`. Net loss: `(1-r)*$0.80`.
          - We'll start with `r=1` (full refund for the loser) and then do `r=0.5` (half refund) and then `r=0` (no refund).

   2. Run the auction for `r=1` (5 minutes)
      - Ask for two volunteers. Have them stand up or come to the front.
      - Explain: "In this first round, the loser gets their entire bid back. So if you lose, you don't lose any money. It's like you never bid."
      - Start the bidding at 10 cents. Let them bid until one drops out.
      - Expected behavior: Since the loser gets 100% back, there is no cost to losing. So they will bid up to just under $1 (say 99 cents) and then the winner gets the dollar for 99 cents and makes 1 cent. The loser pays nothing (because they get 100% back) so they are indifferent. 
      - Point: At `r=1`, there is no trap. The auction is straightforward and the dollar goes for about $1.

   3. Run the auction for `r=0.5` (10 minutes)
      - Change the rule: Now the loser gets half their bid back. So if they bid 80 cents and lose, they pay 80 cents and get 40 cents back -> net loss of 40 cents.
      - Start again with two new volunteers (or same, but reset the bidding).
      - Start at 10 cents. Let them bid. 
      - We expect the bidding to go beyond $1. Why?
          - Suppose the bidding is at 90 cents by A, and B is considering bidding $1.00.
          - If B drops out, they lose 90 cents but get 45 cents back -> net loss 45 cents.
          - If B bids $1.00, then A faces: 
              - If A drops out, A loses 90 cents but gets 45 back -> net loss 45 cents.
              - If A bids $1.10, then A might win: if B drops out at $1.00, then A wins and pays $1.10 for a dollar -> net loss 10 cents, which is better than losing 45 cents.
          - So A would rather bid $1.10 and lose 10 cents than drop out and lose 45 cents.
          - Similarly, at $1.10, B is facing: 
              - If B drops out, they lose $1.00 and get $0.50 back -> net loss 50 cents.
              - If B bids $1.20, then if A drops out, B wins and pays $1.20 for a dollar -> net loss 20 cents (which is better than 50 cents loss).
          - And so on. The trap is set.

      - Let the bidding go until they are both in the red and then stop them. Point out that both are now going to lose money. The winner might "win" at, say, $1.50 and get the dollar, so net loss 50 cents. The loser loses 50% of their last bid (say $1.40 -> net loss 70 cents). Both are worse off than if they had never started.

   4. Run the auction for `r=0` (5 minutes)
      - Now the loser gets nothing back. This is the classic dollar auction.
      - Same setup: two volunteers. Start at 10 cents.
      - They will quickly escalate beyond $1 because the cost of losing is the entire last bid. So at 90 cents, if A has bid 90, then B faces:
          - Drop out: lose 90 cents.
          - Bid $1.00: then A faces:
              - Drop out: lose 90 cents.
              - Bid $1.10: then if A wins, they lose 10 cents (which is better than 90 cents loss). And so on.
      - The trap is even more severe.

   5. Analysis (15 minutes)
      - Explain the locally rational step: At every stage, continuing seems better than quitting because the immediate loss from quitting is large. But by continuing, you are digging a deeper hole. This is the escalation trap.
      - Address misconceptions:
          - "This is just the sunk cost fallacy": 
              - Actually, it's more than that. The sunk cost (the bids already made) are gone. But the decision to continue is driven by the fear of the immediate loss from quitting (which is the last bid, which is not yet sunk until you quit). So it's about avoiding a certain loss now by risking a larger loss. It's a forward-looking decision that gets distorted by the structure of the game.
          - "They just need more discipline and know when to quit":
              - The point is that the rational time to quit is not obvious. Even if you set a limit (say, I won't bid above 90 cents), when you get to 90 cents and the other person bids 90, then you are faced with a new decision: lose 90 cents (or a fraction of it) or bid more and maybe win? The structure forces you to reconsider. And from a local perspective, bidding more is less bad than quitting. So discipline alone doesn't help because the situation changes dynamically.
          - "The auctioneer is tricking them":
              - The auctioneer sets the rules, but the trap is inherent in the rules. In real projects, the "auctioneer" is the situation: the competition, the project's structure, the incentives. It's not necessarily a malicious actor.

      - Why the auction is better than a war story:
          - It's interactive and visceral: they see the bidding happen and feel the tension.
          - It strips away the complexity of a real project (technical challenges, market changes) to show the core dynamic: two parties escalating because the cost of stopping is too high.
          - It's a controlled environment to show how the trap emerges from rational decisions.

      - Scaling to a whole company:
          - In a company, you might have multiple "bidders" (departments, individuals) investing in a project. Each additional investment is like a bid. The project might be failing, but the cost of stopping (writing off all the investment, layoffs, reputational damage) becomes so high that they keep investing. And just like in the auction, the more you invest, the more you have to lose by quitting.
          - Also, in a company, there might not be a clear "loser" until the project is cancelled. Everyone is losing together.

   6. What to skip:
      - We are not going to do any game theory with subgame-perfect equilibrium. We are not going to solve for the exact bidding strategies. We are focusing on the intuition: that at each step, continuing seems less bad than stopping, leading to a trap.

   7. One question at the end to test understanding:
      - "Imagine we are in the middle of the auction at $1.20, and it's your turn. You are the one who just bid $1.10, and the other person bid $1.20. Now you must decide: drop out or bid $1.30? What factors do you consider? What would you do and why?"
          - We want them to articulate the trade-off: 
              - If I drop out, I lose (1-r)*$1.10 (which is a certain loss).
              - If I bid $1.30, then I might win (if the other drops out) and then I get $1 but pay $1.30 -> net loss 30 cents, which is better than the loss from dropping out (if that loss is bigger than 30 cents). But if the other doesn't drop out, I might end up bidding even higher and losing more.
          - The key is that the immediate loss from dropping out is fixed, but by bidding more I risk a larger loss but also have a chance to avoid the immediate loss.

   8. Timing breakdown:
      - Intro: 5 min
      - r=1: 5 min
      - r=0.5: 10 min (including discussion during the bidding and after)
      - r=0: 5 min (quick run to show the extreme)
      - Analysis: 15 min (including addressing misconceptions and scaling to the company)

   9. Note: In the r=0.5 and r=0 auctions, we might not have time to run the entire auction. We can run a few steps and then project what would happen. Alternatively, we can set up a scenario and ask the audience what they would do at critical points.

   10. Why the parameterization? 
       - Starting at r=1 shows that when there is no cost to losing, there is no trap. Then as we reduce r, the trap appears and becomes more severe. This demonstrates that the trap arises from the structure of the costs of losing. It makes the escalation feel inevitable as r decreases because the cost of losing increases.

   11. One more point: 
       - The auction shows that the trap is not about greed or stupidity. It's about the structure of the situation. The bidders are making rational decisions at each step. The problem is that the collectively rational outcome (to stop early) is not achievable because of the step-by-step incentives.

   12. Final thoughts: 
       - Emphasize that in real projects, we need to recognize when we are in a dollar auction. We should design project governance to avoid these traps (e.g., by setting hard limits in advance, by having third-party reviews, by making sure that the cost of quitting is not prohibitively high).

   We'll wrap up with the question and then open for brief comments.
answer: |-
  Here's a streamlined plan for your 40-minute session, designed to build intuition through the parameterized dollar auction. The spine of starting with r=1 and reducing to r=0 is **exactly right**—it reveals how the trap emerges from rational decisions, not stupidity.

  ---

  ### **Session Flow (40 min)**
  **1. Setup: Rules & Rationale (5 min)**  
  - *Start with:* "We're simulating a decision trap using a simple auction. Two bidders, increments of 10¢, highest bid wins $1. **Critical twist:** The *loser* pays their bid but gets a refund of `r × [last bid]`. We'll test `r=1`, `r=0.5`, then `r=0`."  
  - *Why this works:* It transforms abstract "escalation" into visceral, real-time stakes. Participants *feel* the trap.  
  - *Skip upfront theory:* Explicitly say, "We’re skipping terms like subgame-perfection—focus on the intuition."

  **2. Round 1: r = 1 (Full Refund) (5 min)**  
  - Run a live auction with two volunteers.  
  - *What happens:* Bidding stops near $1 (e.g., 90¢). Winner gains 10¢; loser pays nothing (full refund).  
  - *Key point:* **No trap.** Losing costs nothing, so dropping out is easy.  
  - *Transition:* "Now reduce the refund to 50%. How does this change incentives?"

  **3. Round 2: r = 0.5 (50% Refund) (15 min)**  
  - Re-run auction with new volunteers. Start at 50¢.  
  - *Critical moment:* When bids reach 90¢ (Bidder A) vs. $1.00 (Bidder B):  
    - Ask Bidder A: *"If you drop out now, you lose 45¢ (50% of 90¢). If you bid $1.10, you might win. What do you do?"*  
    - Rational choice: **Bid $1.10** (losing 10¢ if you win is better than losing 45¢ if you quit).  
  - *Result:* Bidding escalates past $1. Both lose money (e.g., winner at $1.20 nets -20¢; loser at $1.10 loses 55¢).  
  - *Kill misconceptions here:*  
    - **"Sunk cost fallacy?"** → *"No—the *last bid* isn’t sunk yet. Quitting turns it into an immediate loss. Continuing avoids that loss, even if it’s risky."*  
    - **"Just need discipline?"** → *"Discipline fails when *locally* rational choices *feel* better. Dropping out at 90¢ costs you 45¢ immediately—who here would do that?"* (Hands poll).  
    - **"Auctioneer is tricking us?"** → *"The rules create the trap, not deception. Real projects have similar implicit rules."*

  **4. Round 3: r = 0 (No Refund) (5 min)**  
  - Fast-forward: "At r=0, losing costs everything. Would you drop out at $1.10 if quitting means losing $1.10, but bidding $1.20 risks only a 20¢ loss if you win?"  
  - *Reinforce:* The trap deepens as r decreases. Escalation is **inevitable** with r<1, not a fluke.

  **5. Connect to Projects & Scale Up (10 min)**  
  - *Auction’s unique value:*  
    - Exposes **structural forces** (not greed/stupidity).  
    - Shows **threshold effects** (trap emerges at r<1).  
    - Demonstrates **local rationality** (each step "makes sense").  
  - *From bidders to companies:*  
    - **"Multiple bidders = Departments/execs.** Marketing bids (launch ads!), Engineering bids (fix tech debt!), each trying to avoid *their* 'loss' if the project fails."  
    - **"r = Salvage value.** In projects, r is what you recover if you quit (e.g., 20% if tech is reusable). Lower r → harder to quit."  
    - **"Auctioneer = Incentive systems.** Deadlines, competition, or political pressures act like the auction rules."  
  - *Prevention frame:* "Set *binding exit criteria* upfront (e.g., 'If r<0.3, we walk'). Redesign incentives so 'losing' isn’t catastrophic."

  ---

  ### **What to Skip & Declare**
  - **Skip:** Game theory math, subgame-perfect equilibria, backward induction.  
  - **Explicitly say:** "We’re ignoring the math—focus on why smart people get stuck."

  ---

  ### **Final Question to Test Understanding**
  > **"Imagine you’re at $1.20, and your rival just bid $1.30. You’ll lose 60¢ if you quit (r=0.5). Bidding $1.40 risks a 40¢ loss if you win. Why might you *still* bid? And how does this apply to a project where your team has already spent $1M?"**  
  - *Tests if they grasp:*  
    - The local rationality (40¢ loss < 60¢ loss).  
    - Scaling to projects (sunk costs aren’t driving action; avoiding immediate "loss" is).

  ---

  ### **Why This Works**
  - **r-parameterization** proves the trap isn’t magical—it emerges from rational responses to changing incentives.  
  - **Auction > war stories:** Removes emotional baggage (no "bad teams" to blame). Forces participation. Clear causality.  
  - **Kills misconceptions** at the 90¢/$1.00 inflection point—where continuing feels *obviously* better.
