prompt: |-
  I write the "how this happened" section of short policy briefs — our shop turns out a two- or three-page lessons-from-history memo for incoming officials every couple of weeks, 800 words of actual text, no footnotes, and a section at the end that is supposed to explain why the episode in question went the way it did. I've been doing this about a year and I keep getting the same two complaints back from the academic historians we send drafts to. If I pick a single cause and build the paragraph around it — it was the drought, it was the bankers, it was one minister's decision — they say I've flattened an episode with half a dozen moving parts, and that the cause I named was on its own neither necessary nor sufficient. If I do the opposite and write "a confluence of factors" followed by eight bullet points, they say a list isn't an explanation and I've said nothing. A collegue of mine who did a philosophy degree told me the word for my problem is overdetermination, and that what I want to be able to write is something called an INUS condition, but when I looked both up I couldn't get from the definitions to a single sentence I'd actually put in a brief. I have about a day and a half per brief, I'm working from a stack of secondary sources and two or three interviews, and I hand the draft to our research director, who will ask me "so what actually caused it?" and will not accept a shrug.

  What I'd like is a procedure I can run in that day and a half — the steps in order, what counts as a good enough answer at each step, the point where the procedure stops and I have to make a call myself, and an honest note on which of the steps are really just me exercising judgment with a flowchart drawn around them. I'd also like a rule for that last paragraph: how many causes a reader can hold, whether to lead with the remote ones or the immediate one, how to tell a cause from a mere background condition, and what to do when two or three causes were each by itself enough that removing one of them wouldn't have changed the outcome — because that seems to be exactly the case the historians are complaining about, and it's the case I can't write. Please don't send me a reading list; I won't read it, and I need the thing itself. Tell me plainly what the procedure can't do. Then run it on the two cases below and flag anywhere it gives me an answer I won't like.

  Case one is our own mess. A pilot program we ran with a partner organization to get low-income households signed up for a benefit went badly: enrollment came in at a third of what we projected, the households who did sign up were mostly ones already connected to services, and the partner pulled out eight months in. The candidate causes in my notes are: we picked a city where the benefit was already heavily advertised; the partner's director left four months in; our sign-up form ran to eleven pages; we launched in late August; the funding formula paid the partner per enrollment, which made it rational for them to enroll the easiest households first; we changed the evaluation design halfway through; and a rival organization launched a similar program in the same city two months after us. Case two is a historical one we reuse constantly, the 2008 financial crisis, where my candidate list is subprime and predatory lending, the shift to originating loans in order to sell them on, the ratings agencies, leverage at the big banks, low interest rates and the global savings glut, the housing bubble itself, the incentive structure of Wall Street pay, and fragmented regulators. On the first case I suspect the honest answer is that our own design did it and the partner was behaving rationally, which is not something my director will enjoy reading, so if the procedure can reach that conclusion it should be able to say so out loud.
reasoning: |-
  Alright, the user writes policy briefs and keeps getting criticized by historians for oversimplifying or listing causes without explaining. They need a practical procedure to handle overdetermination—where multiple causes each seem sufficient on their own. The key is to structure the "how this happened" section effectively without falling into single-cause or bullet-point traps.

  First, I should break down the problem. The user has two main issues: historians complain when they pick one cause (too simplistic) or list many (no explanation). The concept of INUS conditions might help—identifying a component that's part of a sufficient set but isn't sufficient alone. But the user needs a step-by-step method, not theory.

  The user's constraints are tight: 1.5 days per brief, secondary sources, interviews. They need a repeatable process. The director asks for the "actual cause," so the output must be clear and actionable. Also, they mentioned two cases: their failed pilot program and the 2008 crisis. The pilot's honest answer might implicate their design, which is sensitive.

  The deeper needs here are credibility with historians and usefulness for policymakers. The user needs to balance academic rigor with brevity. They also need to present uncomfortable truths diplomatically. The procedure must help them synthesize multiple causes into a coherent narrative, flag judgment calls, and handle cases where removing one cause wouldn't change the outcome.

  For the procedure, I'll outline steps: group causes, identify necessary/sufficient sets, find the INUS conditions. Then structure the paragraph with a narrative flow. The user needs to know how many causes to include (3-4 major ones), how to distinguish causes from conditions, and how to sequence them.

  Testing on the pilot case: The failed program's causes include flawed incentives, timing, design complexity, and external factors. The INUS condition here is the payment structure that encouraged cherry-picking. But admitting this points to internal failure. The procedure should handle this by contextualizing without blame.

  For the 2008 crisis, multiple causes like lending practices, securitization, and deregulation interact. The INUS might be the originate-to-sell model enabling risk diffusion. The challenge is avoiding overwhelming the reader while showing interconnectedness.

  Limitations: The procedure can't resolve all academic debates. Judgment is needed in grouping causes and choosing which to highlight. Also, diplomatic framing is crucial when the conclusion criticizes the organization.

  Finally, the user needs clear rules for the paragraph: start with immediate causes, explain interactions, end with the pivotal factor. Highlighting necessary steps and where judgment applies will make the process transparent and trustworthy.
answer: |-
  Here's a battle-tested procedure designed for your 1.5-day crunch, balancing historian rigor with policy brief clarity. It directly tackles overdetermination and INUS conditions without the jargon.

  **The "How It Happened" Procedure (The 5 Steps)**

  1.  **Causal Inventory & Grouping (1-2 hours):**
      *   **Action:** List EVERY potential cause from sources/interviews (like your bullet lists). Don't filter yet. Group related items (e.g., "Sign-up form length" + "Evaluation design change" = "Program Complexity Issues"; "Banker incentives" + "Wall Street pay" = "Misaligned Incentives").
      *   **Good Enough:** You have 3-7 logical groupings covering *Actors*, *Structures*, *Events*, and *Context*. No item stands alone unless truly unique.
      *   **Judgment Call:** Deciding what constitutes a "group." Err on the side of grouping.
      *   **Stop Point:** When all items are categorized, and no glaring omissions remain based on sources.

  2.  **Necessity & Sufficiency Filter (1 hour):**
      *   **Action:** For each group, ask brutally: **"Was this group NECESSARY? Could the outcome have happened WITHOUT it?"** Then ask: **"Was this group SUFFICIENT? Could this group ALONE explain the outcome?"** (Hint: The answer to both is usually "No").
      *   **Good Enough:** You've identified which groups were likely necessary contributors (e.g., *some* form of financial vulnerability was needed for 2008; *some* partner engagement was needed for the pilot) and which were definitely NOT sufficient alone.
      *   **Judgment Call:** Assessing necessity/sufficiency based on evidence. Historians argue about this – aim for the *strongest consensus* from your sources or the most logical inference.
      *   **Stop Point:** You have a refined list of groups that were likely *contributing necessary factors* (but not sufficient alone) and groups that were *enablers/amplifiers* (not strictly necessary, but crucial in context).

  3.  **Identify the INUS Condition(s) (The Core Mechanism) (1 hour):**
      *   **Action:** Look for the group(s) that represent the **"Insufficient but Necessary part of an Unnecessary but Sufficient set" (INUS)**. This sounds complex, but ask:
          *   *"Which factor(s) was the ACTIVE TRIGGER or CRITICAL ENABLER that made the other necessary factors actually lead to disaster/success?"*
          *   *"Which factor(s) changed the situation from 'risky' to 'failure'?"*
          *   *"If I could magically change ONE thing in the chain, which change would most likely have altered the outcome?"* (Focus on *preventability*).
      *   **Good Enough:** You've identified 1-2 groups that function as the crucial *mechanism* or *catalyst* within the web of causes. This is rarely just "context."
      *   **Judgment Call:** **This is the BIGGEST judgment call.** It's about identifying the pivotal leverage point. Look for factors involving *decisions, incentives, or critical failures*.
      *   **Stop Point:** You have your INUS condition(s) – the core "why" within the "how."

  4.  **Causal Narrative Structure (1 hour drafting):**
      *   **Action:** Build the paragraph like this:
          1.  **Trigger/Catalyst (The INUS):** Start with the most *proximate* or *decisive* factor from Step 3. *(e.g., "A payment structure incentivizing 'cherry-picking'...")*.
          2.  **Key Interacting Factors (2-3 max):** Immediately explain how 2-3 other *necessary* groups from Step 2 interacted with the INUS condition to create the specific outcome. Show the mechanism. *(e.g., "...interacted with pre-existing outreach saturation and complex enrollment forms...")*.
          3.  **Context/Amplifiers:** Briefly mention 1-2 key *enabling* groups (from Step 2) that set the stage or worsened things, framing them as conditions the trigger exploited. *(e.g., "...launched during a period of administrative transition and rising competition.")*.
          4.  **The Outcome Link:** State explicitly how this combination produced the outcome. *(e.g., "...resulting in low enrollment concentrated among readily accessible households, ultimately leading the partner to withdraw.")*.
      *   **Good Enough:** A coherent 3-5 sentence paragraph showing *how specific causes combined*, not just listing them. It answers "So what caused it?" by pointing to the *decisive combination*.

  5.  **Director Gut Check & Diplomatic Framing (30 mins):**
      *   **Action:** Read your draft paragraph. Ask: "Does this clearly explain the *mechanism* of failure/success, not just list ingredients? Would the Director understand *why* it happened based on this?" For uncomfortable truths (like your pilot design), frame factually: "Key design choices, notably X, created conditions where..." or "The interaction of [INUS] with [Factor] proved decisive, though external factors like [Context] played a role."
      *   **Good Enough:** It's clear, causal, and defensible based on your process. It doesn't shy away from internal causes but presents them analytically.

  **Rules for the Paragraph:**

  *   **Number of Causes:** **Mention 4-6 MAX:** 1 Trigger (INUS), 2-3 Key Interactors, 1-2 Context/Amplifiers. Readers can't hold more.
  *   **Order:** **Lead with the INUS (Trigger/Catalyst).** Then explain key interactions. End with context/outcome. Proximate > Remote.
  *   **Cause vs. Background Condition:** A **Cause** actively changed the trajectory or was a critical *enabling* factor without which the trigger wouldn't work (e.g., per-enrollment payment *caused* cherry-picking; originate-to-sell model *caused* risk diffusion). A **Background Condition** is necessary but passive; the outcome could still have been avoided *despite* it if the active causes were different (e.g., low-interest rates existed, but better regulation *could* have prevented disaster; late August launch is bad timing, but a simpler form *could* have mitigated it).
  *   **Handling "Each Sufficient" Causes:** This is where INUS shines. Focus on the *actual mechanism that played out*. Say: "While several factors (e.g., X, Y) *could* have independently caused failure, the outcome *resulted specifically* from the interaction of [INUS] with [Key Interactors], exploiting [Context]." You acknowledge the potential while explaining the reality.

  **What the Procedure CAN'T Do:**

  1.  **Resolve Deep Historical Disputes:** If your sources fundamentally disagree on necessity/sufficiency or the INUS, you must make a call. The procedure highlights the disagreement but won't magically solve it.
  2.  **Provide Definitive Proof:** It relies on your sources and judgment. It structures reasoning, not creates new evidence.
  3.  **Make Unpleasant Conclusions Palatable:** It will identify internal design flaws as INUS conditions. Your framing (Step 5) softens it, but the analysis stands.
  4.  **Eliminate All Judgment:** Steps 2 (Necessity/Sufficiency), 3 (Identifying INUS), and 4 (Choosing Interactors/Context) are inherently judgmental. The procedure makes this judgment structured and defensible.

  **Applying the Procedure:**

  **Case 1: The Failed Pilot Program**

  1.  **Grouping:**
      *   **Program Design Flaws:** Payment per enrollment (incentivizes cherry-picking), 11-page sign-up form.
      *   **Implementation Issues:** Evaluation design change mid-stream.
      *   **Partner Instability:** Director left 4 months in.
      *   **Competitive/Timing Context:** Launch in late August, rival program launch, city with pre-existing saturation.
  2.  **Necessity/Sufficiency:**
      *   *Necessary?* Some partner engagement was necessary. Some enrollment friction likely. *Sufficient?* None alone are sufficient. (Even the payment structure needs *some* households to enroll).
  3.  **Identify INUS:** **The Payment Structure (per enrollment).** This was the *active mechanism* causing the specific failure mode (low enrollment of target group, partner withdrawal). It made rational behavior by the partner lead directly to the undesired outcome. Changing *only* this (e.g., to payment for outreach + enrollment of target demographics) would likely have altered the outcome significantly, even with other problems. It's the insufficient-but-necessary-part (needed the form complexity/city saturation to be truly effective) of an unnecessary-but-sufficient set (other sets *could* have caused failure, but *this* set did).
  4.  **Narrative Structure (Draft):**
      > "**A payment structure rewarding the partner solely for enrollments created a powerful incentive to prioritize the easiest-to-reach households.** This core design flaw interacted critically with the program's complexity (an 11-page sign-up form and mid-stream evaluation changes) and the pre-existing saturation of outreach in the target city. These factors were amplified by launching during a challenging period (late August administrative transitions, arrival of a competitor). **The result was enrollment concentrated among already-connected residents, falling far below projections, and ultimately making continued partnership unsustainable for the organization.**"
  5.  **Director Gut Check:** It clearly points to the design flaw (payment structure) as the trigger/catalyst, explaining *how* it interacted with other factors. It's uncomfortable but factual. Frame stays analytical: "core design flaw" is strong but accurate.

  **Flag:** You suspected this. The procedure confirms it. The INUS *is* the payment structure. You won't like telling the Director, but the analysis is sound.

  **Case 2: The 2008 Financial Crisis**

  1.  **Grouping:**
      *   **Risk Creation & Diffusion:** Subprime/Predatory Lending, Originate-to-Sell Model, Flawed Ratings.
      *   **Systemic Vulnerability:** High Leverage at Banks, Fragmented Regulation.
      *   **Macro Context:** Low Interest Rates / Savings Glut, Housing Bubble.
      *   **Incentives:** Wall Street Pay Structures (often grouped under Risk Creation or Systemic Vuln).
  2.  **Necessity/Sufficiency:**
      *   *Necessary?* Some form of widespread risk-taking and systemic vulnerability were likely necessary. Low rates/bubble were critical context. *Sufficient?* Unlikely any single group was sufficient. (e.g., Low rates alone don't cause collapse without reckless lending; reckless lending might not cause *systemic* collapse without high leverage).
  3.  **Identify INUS:** **The Originate-to-Sell Model combined with Flawed Ratings.** This duo *was the critical mechanism* that allowed massive volumes of high-risk loans to be created, disguised as low-risk investments, and spread throughout the system. It transformed localized lending risk into systemic, opaque financial system risk. Changing *this mechanism* (e.g., forcing significant lender risk retention or accurate ratings) would likely have prevented *this specific crisis*, even with low rates and a bubble. (Low rates + bubble + traditional bank lending with skin-in-the-game might have caused a bad recession, not a near-systemic collapse).
  4.  **Narrative Structure (Draft):**
      > "**The widespread adoption of the 'originate-to-sell' model for mortgages, combined with credit ratings that systematically underestimated the risk of bundled loans (MBS/CDOs), created a powerful engine for generating and distributing concealed risk throughout the global financial system.** This core mechanism interacted explosively with regulatory gaps that failed to keep pace with innovation or oversee non-bank lenders, and with dangerously high leverage at major financial institutions seeking outsized returns. These vulnerabilities were fueled by a prolonged period of low interest rates and a self-reinforcing housing bubble. **The result was the catastrophic repricing of mortgage-backed assets once housing prices stalled, triggering a cascade of losses and failures that overwhelmed the fragile, highly-leveraged system.**"
  5.  **Director Gut Check:** It explains the core mechanism (originate-to-sell + bad ratings) as the INUS, shows how key vulnerabilities (leverage, regulation) interacted with it, and sets the context (rates, bubble). It avoids a shopping list.

  **Flag:** Some historians might argue for the *necessity* of low rates/the bubble or the *sufficiency* of certain incentive structures. The procedure forces you to pick the *most critical mechanism* based on your sources. You might get pushback for not emphasizing low rates *enough*, but the paragraph still includes them as critical fuel. The procedure highlights that judgment call.

  This procedure gives you a fighting chance to satisfy both the historians (by acknowledging complexity and identifying mechanisms) and your director (by providing a clear, causal explanation) within your brutal timeframe. Good luck!
