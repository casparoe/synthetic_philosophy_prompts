     - At boundaries (x0 and x4) for all times: blue.
     - In the hole (t1 to t3, x1 to x3): let the students assign arbitrarily.

     **Hole Transformation Example:**

     - Swap the property cards between (x1,t1) and (x2,t1).

     **Debrief Points:**

     - The hole argument in GR: points are individuals, GR is generally covariant -> indeterminism unless we drop the individuality of points.
     - The escape routes:
          a) Accept indeterminism: but then GR is indeterministic in a way that is not physical? (because the two solutions are empirically indistinguishable)
          b) Drop the individuality of points: then the two solutions represent the same physical reality. This is the route taken by many.

     - The cost of dropping individuality: we have to say that spacetime points do not have identity across possibilities. Only the overall pattern of the fields matters.

     - How this is different from underdetermination: underdetermination is about two different theories fitting the same data. Here, it's one theory having two solutions that are empirically indistinguishable but (if points are individuals) ontologically different. The hole argument shows that if we insist on points being individuals, we get a form of indeterminism that is not based on our ignorance but on the mathematics of the theory.

     This should achieve the goal.

