  ### Spacetime Ontology Activity: The Hole Argument Experiential Simulation  
  **Goal:** Make students feel the tension between spacetime point individualism, determinism, and the "relabeling" move, without front-loading the philosophy. Use incentives to make the individualism commitment feel natural, then force a dilemma where relabeling creates "bad options."  

  ---

  #### **Materials & Setup (15 min)**  
  - **Projector/Whiteboard**: Display a 5x5 grid labeled with coordinates (x₀–x₄, t₀–t₄). This is the "manifold."  
  - **Tokens & Properties**: Use 25 identical tokens (e.g., blank index cards) taped to grid points. Attach colored property cards to tokens:  
    - **Red** = "Mass present," **Blue** = "Vacuum" (use projector to show these meanings).  
  - **Hole Region**: Designate the inner 3x3 grid (x₁–x₃, t₁–t₃) as the "hole" (highlight with tape).  
  - **Initial Conditions**: Fix tokens outside the hole:  
    - **t₀ row**: All tokens have properties (e.g., x₁,t₀ = Red; others Blue).  
    - **Boundaries (x₀, x₄)**: All tokens Blue at all times.  
  - **"Laws of Physics"**: Declare a simple, deterministic rule (projected):  
    > *"Red tokens at time tₙ must match Red tokens at tₙ₋₁ in adjacent spatial points (left/right)."*  
    (Example: If (x₁,t₀) is Red, then (x₀,t₁) or (x₂,t₁) must be Red. Adjust for your chosen initial conditions.)  

  - **Roles**:  
    - **Team Determinism (7 students)**: Must ensure the entire grid satisfies the "laws" given initial conditions. Their win condition: A logically consistent, unique evolution.  
    - **Team Uniqueness (7 students)**: Must ensure no two distinct physical worlds fit the same initial data. Their win condition: Prove all solutions are observationally identical.  
    - **Referee (you)**: Enforce rules, track "points."  

  ---

  #### **Rules & Incentives (5 min explanation)**  
  1. **Scoring System**:  
     - Teams earn 10 points for achieving their win condition.  
     - Bonus 5 points if they "trap" the other team in a contradiction.  
     - **Catch**: Points translate to extra credit (e.g., +0.5% on next assignment). Frame it as a "puzzle-solving championship."  

  2. **Procedure**:  
     - **Phase 1 (15 min)**: Teams build the world inside the hole.  
       - Team Determinism places property cards in the hole to satisfy the laws, given fixed initial conditions.  
       - Team Uniqueness verifies that only one configuration works.  
     - **Phase 2 (10 min)**: "Relabeling Round":  
       - In the hole, secretly swap property cards between two tokens (e.g., swap Red at (x₁,t₁) with Blue at (x₂,t₂)).  
       - Reveal the swap. Teams must reconcile this with their win conditions.  
     - **Phase 3 (15 min)**: "Crisis Negotiation":  
       - Teams debate whether the relabeled world is valid. They can:  
         - Accept indeterminism (Team Determinism loses points).  
         - Declare the worlds "physically identical" (Team Uniqueness loses points).  
         - Reject the relabeling (but must explain why).  

  ---

  #### **Timeline (80 min total)**  
  1. **Setup (15 min)**: Introduce grid, tokens, properties, hole, laws, and roles. Have teams choose names.  
  2. **Phase 1: World-Building (15 min)**  
     - Teams collaborate to assign properties in the hole. Team Uniqueness must sign off that the solution is unique.  
     - *Outcome*: They commit to individualism—tokens are distinct because properties are tied to fixed grid points.  
  3. **Phase 2: Relabeling Round (10 min)**  
     - Swap properties in the hole (e.g., swap two cards). Reposition tokens if needed to emphasize active reassignment.  
     - Announce: "This is a diffeomorphism. By the laws, it’s also a valid solution."  
     - *Outcome*: Students see two configurations agree outside the hole but conflict inside.  
  4. **Phase 3: Crisis Negotiation (15 min)**  
     - Teams debate while you track arguments on the board. Force them to vote:  
       - Option A: Accept both solutions → indeterminism (costs Team Determinism).  
       - Option B: Declare them the same world (costs Team Uniqueness).  
       - Option C: Reject relabeling (must justify).  
  5. **Debrief (25 min)**: Map the activity to the hole argument.  

  ---

  #### **Debrief Framework**  
  **Map Activity to Argument**:  
  | Activity Element | Hole Argument Concept |  
  |------------------|------------------------|  
  | Fixed grid points | Manifold points as individuals |  
  | Property cards | Metric/tensor fields |  
  | Relabeling swap | Active diffeomorphism (φ) |  
  | Laws of physics | Generally covariant equations |  
  | Team Determinism’s loss | Indeterminism threat |  
  | Team Uniqueness’s loss | Loss of physical distinguishability |  

  **Escape Routes & Their Costs**:  
  1. **"Relabeled worlds are the same" (Structuralism/Relationism)**:  
     - **When raised**: Usually in Phase 3, by Team Uniqueness to save points.  
     - **Cost**: Abandon point individualism. Ask: *"If points aren’t individuals, what grounds differences? Can you write this in first-order logic?"*  
     - **Patch**: Note that this dissolves the dilemma but requires denying intuitive commitment to points.  

  2. **"I’m a structuralist anyway"**:  
     - **When raised**: During debate or debrief.  
     - **Cost**: Structuralism must explain how relations fix point identities without circularity. Challenge: *"Define ‘adjacency’ without presupposing points."*  

  3. **"Diffeomorphism is just relabeling"**:  
     - **When raised**: Early, by students dismissing the swap.  
     - **Shut down**: Ask: *"Did you move the property cards or the tokens? If tokens (points) are real, this is a physical reshuffling."* Use the grid to show token positions are fixed—relabeling reassigns properties to *different* points.  

  **Avoiding Underdetermination Pitfalls**:  
  - **Key Distinction**:  
    - Underdetermination: Two *theories* fit the same data.  
    - Hole Argument: One theory has multiple *solutions* for the same initial data.  
  - **Activity Enforcer**: When teams build the hole, stress that *all* configurations use the *same* laws. The conflict is internal to GR’s formalism.  

  **Limitations & Required Lectures**:  
  - **What’s Missing**:  
    - The real argument uses smooth diffeomorphisms (not discrete swaps) and the Einstein field equations.  
    - General covariance is assumed, not derived.  
  - **Post-Activity Lecture (5 min)**:  
    > "In GR, diffeomorphisms map solutions to solutions. The hole argument generalizes this: for *any* hole-shaped region, a φ ≠ id inside the hole forces a choice—indeterminism or point non-individuality."  

  **Predictable Problems & Fixes**:  
  - **"This is a language game!"**:  
    - Likely when relabeling is revealed.  
    - **In-Moment Fix**: Redirect to incentives: *"Team Uniqueness, if you dismiss this, you lose points. Show why it’s not physical."* If persistent, reframe: *"Language games don’t cost you extra credit. This does."*  
  - **Trivializing the Hole**:  
    - If students ignore the hole, restrict communication: *"Teams can only act on their win conditions. No abstract philosophizing yet."*  
  - **Overcomplicating Laws**:  
    - If teams bog down in Phase 1, simplify laws (e.g., "Reds must form a connected path").  

  ---

  #### **Why This Works**  
  - **Individualism Feels Natural**: Teams fix properties to grid points to satisfy laws/uniqueness. The tokens *are* the ontology.  
  - **Dilemma Forced by Incentives**: Points are sacrificed only if they abandon core commitments (determinism or uniqueness).  
  - **Escape Routes Cost**: Each move has a price (conceptual or point-based), mirroring philosophical trade-offs.  
  - **Underdetermination Avoided**: By using one set of laws and highlighting the active reassignment of properties to points, the focus stays on spacetime ontology, not theory choice.  

  **Post-Activity Homework**: Have students write a 1-paragraph "negotiation memo" for their team, applying one escape route to GR. This bridges the activity to formal argument.
