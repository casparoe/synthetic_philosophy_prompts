  I need to recall the key facts of the case. Sir Roy Meadow testified that the chance of two cot deaths in a family like Sally Clark's was 1 in 73 million, obtained by squaring the single cot death probability. The Royal Statistical Society criticized this for lacking statistical basis. The conviction was overturned due to non-disclosure of medical evidence, not the statistical error. The user wants to focus on the reference class issue here.

  The reference class problem involves selecting the right group to calculate the probability. Meadow used a broad class (affluent, non-smoking parents) but didn't establish causal relevance. The user asks for competing classes: what were they? I should outline classes like the general population, affluent families, families with one prior cot death, etc. Then, evaluate each class's probability and whether principled rules (narrowest adequate data vs. causally relevant features) can resolve the choice. The problem is underdetermined; no rule cleanly selects one class. 

