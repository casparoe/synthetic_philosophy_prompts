prompt: |-
  I write a column on science and ideas, and I've spent the better part of a month trying to get to the bottom of Hempel's old raven paradox — the point that since the hypothesis that all ravens are black is logically equivalent to the claim that all non-black things are non-ravens, a green apple or a white shoe ought to count as evidence for it, which nobody can quite stomach. What has struck me in the conversations I've had about it, with friends over dinner and with a couple of philosophers I cornered at a conference, is how fast everyone reaches for their preferred machinery — Bayes nets, likelihood ratios, inference to the best explanation, contrastive accounts — without first saying what the machinery is supposed to deliver. One colleague, a philosopher of science, keeps insisting that the real lesson is that confirmation is always contrastive, that evidence bears on a hypothesis only relative to a set of live alternatives, and that the raven paradox is an artifact of pretending otherwise; I can't tell whether that belongs in the piece as the moral or as one candidate among many.

  So before I read another word of advocacy, I want the specification. What would a theory of confirmation actually have to get right to be adequate — not for a textbook, but for a working scientist who has to decide, in the field, whether a stray observation is evidence for the hypothesis she's chasing? I don't need a reading list, a bibliography, or citations; a model that can't look anything up would only be guessing at those, and so would I. What I want is the requirements themselves: the cases any adequate theory must get right, the distinctions it cannot collapse, and the results it has to be consistent with, each one tied to the particular case or consideration that makes it a requirement. Tell me which of these are genuine requirements and which are merely the prejudices of one camp, and — the part I care about most — whether some subset of them cannot be jointly satisfied, in which case the list itself is a result. Say too which single requirement does the most to rule out the usual contenders, and which of your requirements the contrastive idea, if it's right, would revise.

  Give it to me as exactly five numbered items, each one a sentence or two, with no introduction and no conclusion. Let each item state one requirement, name the case behind it, and say whether it is negotiable; if two of your five cannot both be met, say so inside the entry where the tension surfaces, and make clear which single entry carries the most excluding force. For each, I would rather have a calibrated hedge than a show of confidence — tell me how sure you are — and single out the one entry you are least sure of.
reasoning: |-
  Hmm, the user is a science columnist tackling Hempel's raven paradox. They've discussed it with philosophers and colleagues but are frustrated that everyone jumps to their preferred theories without clarifying what a confirmation theory should achieve. They want a list of requirements for an adequate theory of confirmation, specifically for practical scientific use.

  The user wants five numbered items. Each item must state a requirement, name the case behind it, say if it's negotiable, and note any tensions. They also want hedges on certainty and identification of the least certain entry. Key points: avoid advocacy, focus on what any theory must get right, and tie each requirement to a specific case.

  First, I need to recall the core of the raven paradox: observing a green apple seems to confirm "all ravens are black" because it supports the equivalent "all non-black things are non-ravens," which is counterintuitive. This highlights issues in confirmation theory.

  Now, for the requirements. I should draw from philosophy of science without bias. The user mentioned contrastive accounts, so I'll include that as a consideration. I need five distinct requirements based on real cases.

  Brainstorming requirements:
  1. **Non-tautological evidence requirement**: Evidence should confirm hypotheses without trivial logical equivalents dominating. Case: Raven paradox itself. A green apple shouldn't strongly confirm that all ravens are black. Not negotiable.
  2. **Positive instance requirement**: Direct observations should support hypotheses. Case: Seeing a black raven should confirm "all ravens are black." Not negotiable.
  3. **Relevance sensitivity requirement**: Evidence must be relevant to the hypothesis, not just anything that fits logically. Case: Grue paradox (Goodman's problem), where definitions affect confirmation. Not negotiable.
  4. **Background knowledge integration requirement**: Confirmation depends on existing scientific knowledge. Case: Ignoring known counterexamples or established facts. Not negotiable.
  5. **Comparative strength requirement**: Evidence should be evaluated against alternatives. Case: Contrastive nature of real science, like testing hypotheses against competitors. More negotiable, as some theories might handle it differently.

  Tensions: Requirement 1 and 5 might clash. The raven paradox shows that without alternatives, non-black non-ravens seem to confirm, but requirement 5 emphasizes contrast. So, in item 1, I should note tension with 5 if 5 is included.

  Excluding force: Requirement 3 (relevance sensitivity) rules out many simplistic theories, like pure hypothetico-deductivism, because it forces context-dependent reasoning.

  Least certain entry: Requirement 5, as it's more debated whether confirmation is inherently contrastive.

  Certainty levels: Use hedges like "strongly suggest," "seems essential," to show confidence levels without overstatement.

  Finalize the five items:
  1. Non-tautological evidence: Based on raven paradox. Not negotiable. Tension with 5.
  2. Positive instances: Based on direct observation. Not negotiable.
  3. Relevance sensitivity: Based on grue paradox. Not negotiable. High excluding force.
  4. Background knowledge: Based on ignoring counterexamples. Not negotiable.
  5. Comparative strength: Based on contrastive cases. Negotiable. Least certain.

  Ensure each is a sentence or two. No intros or conclusions.
answer: |-
  1. **Non-tautological evidence requirement**: Any adequate theory must prevent logically equivalent hypotheses from being confirmed by irrelevant evidence, as in the raven paradox where a green apple seems to support "all ravens are black" via equivalence; this is not negotiable for avoiding absurdity. Tension surfaces with requirement #5 if contrastive elements are deemed essential, as non-contrastive approaches struggle here. I'm highly confident (>90%) this is core, given the paradox's persistence.

  2. **Positive instance requirement**: The theory must ensure direct observations of hypothesis-confirming instances (e.g., a black raven confirming "all ravens are black") count as evidence, as denying this would cripple inductive science; not negotiable. This is straightforward and I'm very confident (>95%), rooted in basic scientific practice like validating biological generalizations.

  3. **Relevance sensitivity requirement**: It must distinguish relevant from irrelevant evidence by context, avoiding counterintuitive confirmations like Goodman's "grue" paradox (where emeralds observed as green before time T artificially confirm "grue" instead of "green"); not negotiable. This carries the most excluding force, ruling out purely formal or syntactic theories (e.g., naive hypothetico-deductivism) by demanding semantic or pragmatic elements. I'm confident (~85%), though "relevance" is slippery.

  4. **Background knowledge integration requirement**: Confirmation must incorporate existing scientific knowledge, such as ignoring a known albino raven when testing "all ravens are black," to avoid absurdities; not negotiable. I'm confident (~80%), as cases like ignoring established counterevidence (e.g., in cosmology) show science isn't tabula rasa.

  5. **Comparative strength requirement**: Evidence must be evaluated relative to live alternative hypotheses (e.g., a fossil supporting evolution over creationism), making confirmation contrastive; this is negotiable (~60% confidence) and the least certain, as some theories (e.g., Bayesian) can model it non-contrastively. If right, it revises #1 by resolving the raven paradox through alternatives (e.g., a green apple only confirms if "all ravens are white" is viable). Case: Real-world hypothesis testing, like drug trials comparing treatments.
