prompt: |-
  I've been teaching myself type design for a couple of years, mostly by drawing alphabets badly and then fixing them, and there's a thing I keep running into that I don't have a word for. Maybe the word is obvious and I'm just not in the right field to have heard it, but I've poked around and nothing fits.

  Here's the thing. How far I can push a lowercase a away from a normal a doesn't seem to depend on the a. It depends on the rest of the alphabet. In the font I'm doing now, the a is basically a circle with a stem on the right, and the only reason it isn't a d or a q is that the d's stem is on the left and the q's tail hangs down -- so one of those letters is carrying the whole distinction for both of them. With b and d it's worse: they're near mirrors, so the entire difference is a tiny flick on the bowl terminal, and I have to spend that flick somewhere, I can't just not decide. In a script face I looked at, a, o, d, q and even e share almost the same bowl, and what makes them different letters is only where the stroke stops and which way the tail flicks. And it feels zero-sum in a way I can't pin down: when I finally get b and d to read clearly, my p and q go mushy, even though I didn't touch them.

  The other half of it is the weirdness budget. If the whole alphabet is condensed, my e can be way narrower than I'd ever dare in a normal font and still reads fine. Squeeze only the e in an otherwise normal alphabet and it breaks. So there's some amount of strangeness I can spend, but only if everyone spends it together, and it isn't a per-letter allowance.

  The closest thing Ive found is family resemblance, but that doesn't feel right, because the boundaries here are pretty sharp (it's an a or it isn't) and they seem to get set by the other letters rather than by how close you are to some central a.

  So: is there a name for this? If there isn't, I'd like one that actually says where the edges are. What makes a letter's identity come from the system it sits in versus from its own shape? What is the "together" in the budget doing -- is it just that readers get used to a style, or is it something about the letters relating to each other? To be clear I'm not asking about legibility research, that's a different question, I mean identity -- when is this shape the letter a at all, and when is it not, and who decides. A bare label won't help me; I need the carving.
reasoning: |-
  Okay, the user is describing a key challenge in type design: how the identity of a letter depends on the entire alphabet system, not just its individual shape. They mention examples like a, d, q sharing similar bowls but differing only in stem placement or tail flicks, and how adjusting one affects others. They also talk about a "weirdness budget"—where deviations are acceptable if consistent across the font but not in isolation. 

  Hmm, they’re clearly experienced—self-taught for years, with sharp observations about systemic trade-offs. Their frustration is palpable: they’ve searched for terminology but found nothing fitting. "Family resemblance" (from Wittgenstein?) is close but misses the sharp boundaries and interdependence they’re seeing. They want a *structural* explanation, not just legibility studies. 

  First, unpacking their core points:  
  1. **Relational identity**: A glyph’s "a-ness" isn’t absolute but defined by contrasts with neighbors (e.g., a vs. d via stem side).  
  2. **Contrast allocation**: Distinctive features (like terminal flicks) are limited resources—spending on b/d distinction might rob p/q.  
  3. **Systemic tolerance**: Weirdness (e.g., condensed e) is legible only if the *whole system* shifts together, training the reader’s expectation.  

  Existing terms don’t quite fit. "Character distinctiveness" is too vague; "differentiation" is about legibility, not identity. "Systemic coherence" is broad. They need a term capturing the *negotiation of identity within a closed system*.  

  Ah—here’s the gap: typography lacks a crisp term for this. The closest concepts are:  
  - **Relational differentiation** (how letters distinguish *from each other*)  
  - **Contrast economy** (finite resources for distinction)  
  - **Systemic calibration** (weirdness permitted by system-wide consistency)  

  But these are phrases, not established terms. The user might need to coin one. "Glyphic relativity"? Too jargony. "Type system tension"? Meh.  

  Alternatively, framing it as **identity by contrast** or **distinctiveness budget**—but they’d still need to define it. The deeper need: they want to *articulate* this principle to analyze designs more rigorously. Maybe they’re building a mental model for decision-making.  

  Also, their "who decides" question hints at semiotics—the reader’s role in decoding systemic rules. The alphabet is a *code*, and letters are signals defined by mutual differences (like Saussure’s linguistic signs). The "together" in the budget works because readers learn the system’s logic. If *all* letters are condensed, the brain adjusts; if one is, it’s noise.  

  So the answer might be: no single term exists, but the *framework* combines contrast allocation, systemic consistency, and reader adaptation. Naming it could involve:  
  - Relational identity  
  - Contrast economy  
  - Systemic legibility tolerance  

  ...but they might prefer the raw concepts over a forced label. Emphasizing that this is the *system-dependent nature of glyph identity* could be more useful than a term.  

  Also, their "zero-sum" feel is spot-on—it’s literally about distributing limited differentiation "currency." Nodding to that could resonate.  

  Final thought: Their struggle mirrors modular design systems (like icons). Maybe cross-disciplinary terms exist? "Visual semiotics"? But typography might not have adopted them.  

  Conclusion: Validate their insight, clarify why existing terms fall short, and give them conceptual tools even if a perfect label doesn’t exist. They’ll likely appreciate the depth over a pat answer.
answer: |-
  Your intuition is brilliant, and you're grappling with a fundamental, yet often unnamed, principle in type design. **There isn't a single, universally accepted term for this phenomenon.** Existing terms like "family resemblance," "cohesion," or "systematicity" touch on it but don't capture the sharp, systemic dependency and the "budget" aspect you describe. However, we can carve out a precise conceptual framework and propose some fitting labels:

  ## The Core Concepts

  1.  **Relational Identity:** A letter's identity (its "a-ness," "b-ness") is not defined solely by its intrinsic form, but **primarily by its *contrastive relationships* and *positional cues* within the specific *closed system* of the typeface.** Your shape is an "a" because it *isn't* the "d" *in this specific alphabet*, and vice versa. The distinction isn't inherent to the shape alone; it's defined by the difference *within the system*.
  2.  **Distinctiveness Economy:** The visual resources needed to establish clear identity (stroke terminals, stem positions, counter shapes, proportions) are finite within a cohesive design. **Spending distinctiveness on one contrast (e.g., b vs. d) inevitably reduces the distinctiveness available for other contrasts (e.g., p vs. q)**. This *is* zero-sum. Your "tiny flick" is a unit of distinctiveness currency.
  3.  **Systemic Legibility Tolerance:** The *amount* of deviation or "weirdness" a single glyph can exhibit while remaining legible is **dynamically scaled by the consistency of the system**. A condensed 'e' in a condensed font works because the *entire system* trains the reader's expectation and establishes a new norm. An isolated condensed 'e' violates the established norms of the surrounding system, creating confusion.

  ## Proposed Labels & Frameworks

  Here are terms/phrases that capture different facets, often needing combination:

  1.  **Systemic Differentiation:** This emphasizes that the *difference* (what makes it an 'a' and not a 'd') is defined and maintained by the *system as a whole*, not individual glyphs in isolation. It highlights the relational aspect.
  2.  **Contrast Allocation / Distinctiveness Budget:** This directly addresses the "zero-sum" resource management you're experiencing. You are constantly *allocating* limited visual contrast resources to the most critical identity pairs (a/d, b/d, n/u, i/j/l, etc.). Running out of budget makes other pairs mushy.
  3.  **Type System Calibration:** This focuses on the "weirdness budget." The system *calibrates* the reader's expectations. Once calibrated (e.g., to "condensed"), individual glyphs can operate successfully within that calibrated range. An uncalibrated deviation breaks the system. It's about establishing and adhering to internal system rules.
  4.  **Relational Glyphics / Glyphic Relativity:** More academic/philosophical, but accurate. It frames letter identity as relative (like Einstein's relativity), defined by position and relationships within the typographic space-time (the font system), not by absolute properties.

  ## Who Decides? What is the "Together"?

  *   **The System Decides:** Within the closed universe of your typeface, *you*, the designer, define the rules. The identity of 'a' is determined by the *set of differences* you establish between it and all other glyphs, especially its near neighbors (d, o, e). The system's internal logic dictates what is possible and legible.
  *   **The "Together" (Systemic Consistency) Enables Adaptation:** The "togetherness" allows the *reader* to adapt. When all glyphs share the same underlying structure, proportions, and stylistic quirks:
      *   **Pattern Recognition Kicks In:** The brain learns the system's "grammar" quickly. It recognizes glyphs based on their *relative* positions and key contrasting features within that established pattern.
      *   **Expectations are Set:** The reader subconsciously learns the rules: "In this world, stems are thin, bowls are round and small, terminals are sharp." As long as subsequent glyphs follow these rules, even if individually unusual, they are decipherable.
      *   **Cognitive Load is Reduced:** Consistency means the reader doesn't have to constantly re-calibrate their expectations for each letter. The system provides a stable framework.

  ## Why Your Examples Fit Perfectly

  *   **a/d/q/o/e sharing a bowl:** The identity hinges entirely on **positional cues** (where the stem attaches, where the stroke starts/ends, tail direction). The *shared bowl* establishes systemic consistency (calibration), while the *minimal positional differences* are the allocated distinctiveness.
  *   **b/d/p/q mushiness:** You're hitting the limits of **contrast allocation**. The resources (terminal flick, stem position relative to bowl) needed to strongly differentiate b/d are the *same* resources needed to differentiate p/q. Strengthening one pair weakens the other if the core structure is too similar. The solution often involves introducing *more fundamental structural differences* (e.g., slightly different bowl shapes, stem angles) to create more distinctiveness "currency."
  *   **Condensed e:** This is pure **systemic tolerance**. The condensed system calibrates the reader to expect narrow proportions. An isolated condensed 'e' lacks this calibration; it conflicts with the expectations set by the wider surrounding letters, making it look distorted and illegible.

  ## In Practice

  Instead of seeking a magic label, frame your decisions with these concepts:

  1.  **Map Critical Pairs:** Identify the glyph pairs most prone to confusion in *your* design (a/d, b/d, n/h, i/j/l, o/e, u/v, etc.).
  2.  **Audit Distinctiveness Resources:** What features create contrast? (Stem position, terminal shape, counter size/shape, x-height variations, ascender/descender details, overall width). How much "currency" do you have?
  3.  **Allocate Strategically:** Decide where maximal distinctiveness is *essential* (often lowercase, common letters). Spend your "flicks" and positional cues wisely on these high-priority pairs. Accept slightly less distinctiveness on less critical pairs if needed.
  4.  **Calibrate the System:** Commit fully to your core stylistic choices (condensation, weight, contrast, terminal style). Ensure *all* glyphs adhere to these core rules consistently. This consistency *creates* the tolerance for individual glyphs to push boundaries *within* those rules.
  5.  **Test Systemically:** Never judge a glyph in isolation. Test it alongside its critical neighbors (does 'a' read clearly next to 'd' and 'o'?) and within words/sentences in the context of the *whole* font.

  You've identified a profound truth about type design: letters are not islands, but interdependent actors in a tightly choreographed system. The terms might be fluid, but the principles of **Relational Identity, Contrast Allocation, and Systemic Calibration** provide the "carving" you need to understand and master this essential dynamic. Keep designing! Your deep observation is exactly what leads to great typefaces.
