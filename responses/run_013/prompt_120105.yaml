  I'm assembling a four-person, three-year research group to build a system that, given five or six letters of an invented alphabet drawn in a consistent hand, produces the rest of the alphabet — including letters the designer never drew, and including a deliberate extrapolation to letters that don't belong to that alphabet at all (how this hand would draw a thorn, or a Cyrillic letter). Engineering isn't the bottleneck I'm funding; the first year is meant to go to conceptual foundations. Which open questions about letterform identity and style most deserve that year, and in what order? For each, say why it is upstream of the others rather than merely interesting on its own, whether it can be advanced with armchair argument and small hand-drawn cases instead of large datasets, and what would move it up or down the list. I'm especially interested in whether the identity question — what makes this an *a* — and the style question — what makes this in this hand — are separable at all, and in whether a hand determines how it would have drawn letters it never drew, including letters with more than one deep structure, such as a single- versus double-storey *a*. State how confident you are in each claim, and single out the point you are least sure of.
