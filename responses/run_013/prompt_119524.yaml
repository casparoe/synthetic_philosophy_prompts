prompt: |-
  I'm in a bioethics reading group and last week one of the other members — a palliative care fellow — put an argument up on the whiteboard and then had to leave early to cover a shift. She said she'd half-reconstructed it from something she read years ago and couldn't remember where, so I can't check a source, but I dont think that matters much here: the thing either works or it doesn't on its own. Here's what she wrote.

  (1) Whether an outcome counts as something I did or merely as something I allowed depends only on the causal structure of what happened — if the outcome wouldn't have occurred but for my behaviour, I made it happen. (2) When I switch off a ventilator, my behaviour is a but-for cause of the patient's death in exactly the way it is when I push the plunger. (3) So if the difference between killing and letting die is a difference in causal structure, then in the ventilator case there is no such difference; both are killings. (4) And this generalises: for any case of letting die there is some description of my behaviour under which it is a but-for cause of the death — I stayed at my desk, I kept walking, I didn't open the door. (5) If two pieces of behaviour share a causal structure, no moral difference between them can rest on the doing/allowing distinction. (6) So the doing/allowing distinction marks no moral difference anywhere. (7) So if it is ever permissible to withdraw futile treatment, it is sometimes permissible to kill a patient, and any rule that separates the two — double effect, the standard medical-ethics line, whatever you like — is resting on nothing.

  I keep going in circles on this. Every time I try to say where it goes wrong I end up denying something I'm sure of, like that switching the ventilator off is at least a candidate for being something I did rather than something I merely let happen. What I'd most like to keep is (7)'s antecedent, that withdrawing futile treatment is sometimes permissible; what I'd least like to be forced into is the claim that a doctor may give a lethal injection on request. Almost any other premise I'll pay. So: which step do I reject, why did it look fine when she wrote it, and what does rejecting it cost me in the cases that made me want it? I don't want just the name of the move, I want the price tag, including what it does to the cases where the two acts look least like each other.

  Please take the role of someone who's spent a lot of time in this literature and has no patience for slogans from either side. Before you commit to a diagnosis, brainstorm three or four candidate places the argument could break and say why you're dropping the weaker ones — I'd rather watch you throw out a catch that only sounds clever than have you keep it. And if it turns out there's no cheap flaw here and the thing is simply valid, so that I really do have to give up a premise I like, then say that straight instead of manufacturing a defect; I'd rather be told I'm stuck. If I've set it up so it can't be answered well — if the numbering is hiding a step she skipped — say that first.
reasoning: |-
  Okay, the user is in a bioethics reading group and encountered an argument from a palliative care fellow about the distinction between killing and letting die. The argument seems to challenge the moral difference between withdrawing life support and active euthanasia. The user is struggling with this and wants to know where the argument goes wrong without having to accept that lethal injection is permissible. They want a thorough analysis, not just slogans, and are open to rejecting premises but wary of the costs involved.

  First, I need to parse the argument step by step. The core claim is that if withdrawing a ventilator is causally equivalent to giving a lethal injection, then the doing/allowing distinction collapses, leading to the conclusion that there's no moral difference. The user wants to preserve the permissibility of withdrawing futile treatment but avoid endorsing active killing.

  I should start by identifying potential weak points in the argument. Let me brainstorm a few candidates:

  1. **Step (1):** The definition of doing vs. allowing. If this is incorrect, the whole argument might fail. But rejecting this means redefining doing/allowing beyond causality, which could be messy. The user mentioned that withdrawing the ventilator feels like "doing," so rejecting this might conflict with their intuition.

  2. **Step (2):** The claim that switching off the ventilator and pushing a plunger are causally identical. But are they really? For example, withdrawing treatment stops an intervention, whereas active killing introduces a new cause. Medical ethics often distinguishes between omitting and acting. However, the user wants to keep the ventilator case as a possible "doing," so rejecting this step might undermine that.

  3. **Step (4):** The generalization that any letting die can be described as a but-for cause. This seems strong because any inaction can be framed as an action (e.g., not saving). But if we accept that, then step (5) and (6) follow, leading to the collapse of the distinction. However, maybe the moral relevance isn't just in the causal structure but in the context, like duties or norms.

  4. **Step (5):** That shared causal structure means no moral difference can rest on doing/allowing. But even if causally similar, other factors like intentions, duties, or circumstances might create moral differences. The user wants to preserve permissibility of withdrawing treatment, so this might be a place to push back without endorsing active killing.

  Now, evaluating which of these to pursue. Step (4) seems robust because any inaction can be rephrased as an action (e.g., "I didn't save" vs. "I refrained from saving"). So attacking step (4) might not work. Step (1) is tricky because the user agrees that withdrawing the ventilator is a "doing" in some sense. Step (2) might be viable if there's a causal difference—like the ventilator case involving the removal of an artificial intervention, while the injection introduces a new harm. But the argument states they are but-for causes in the same way, which is technically true: without the action, death wouldn't occur immediately in both cases.

  That leaves step (5) as the most promising. Even if two acts share causal structure, moral differences could arise from other factors. For example, in the ventilator case, the doctor is discontinuing an invasive treatment that was sustaining life artificially, which aligns with the patient's autonomy or futility. In active killing, the doctor is introducing a new harm. The duties of the physician—to not harm versus not obligate to sustain life indefinitely—might create a moral distinction. So rejecting step (5) allows maintaining that withdrawing treatment is permissible while active killing isn't, based on context rather than causal structure alone.

  The cost here is that the doing/allowing distinction isn't doing the moral heavy lifting; instead, it's factors like duties, intentions, or norms. That means in cases where context is similar, the distinction might not hold, but in medical contexts, the norms differ. For example, a doctor isn't obligated to continue futile treatment, but they are prohibited from administering poison. So the user can keep permissibility for withdrawal without endorsing lethal injections by emphasizing role-based duties and the nature of interventions.
answer: |-
  You're right to feel caught—this argument is a compressed, potent version of a classic challenge to the doing/allowing distinction (DAD), and it's designed to force hard choices. I've seen variants in Foot, Bennett, and McMahan, but your colleague's reconstruction is admirably stark. Let's dissect it without slogans. The core pressure point is your desire to retain the permissibility of treatment withdrawal while rejecting active killing. The argument blocks easy escapes by insisting that *causal structure alone* defines doing/allowing, then showing that withdrawal shares that structure with killing. I'll brainstorm four candidate weaknesses, discard the flimsier ones, then defend the most promising—but with full transparency about the philosophical toll.

  ### Candidate Breakdown: Where Could It Fail?
  1. **Step (1): Rejecting that doing/allowing is *purely* causal.**  
     *Why it tempts*: Many argue DAD incorporates normative elements (e.g., duties, roles, baseline expectations). Withdrawing ventilation might be "allowing" because doctors aren't obligated to prolong life unnaturally.  
     *Why I'd discard it (here)*: Your colleague preempts this by making (1) a definitional claim. More crucially, **you want withdrawal to potentially count as "doing"** (as per your worry), and normative accounts often classify withdrawal as *doing* (e.g., discontinuing an intervention). If we reject (1), we might save DAD but lose your intuition about the ventilator case being agentive. Cost: muddying the distinction in ways that won't help your core dilemma.

  2. **Step (2): Denying causal equivalence between pushing the plunger and flipping the switch.**  
     *Why it tempts*: Withdrawal stops an artificial process; injection introduces a new lethal cause. Philosophically, we might distinguish "allowing nature to take its course" from "imposing death."  
     *Why I'd discard it*: The "but-for" test is ruthlessly effective here. Without the switch-flip, the vent-dependent patient wouldn't die *at that moment*; same for the injection. Causal chains differ (e.g., hypoxia vs. drug toxicity), but step (2) only claims equivalence in the minimal "but-for" sense. Rejecting this requires denying uncontroversial counterfactuals—e.g., "If I hadn't flipped the switch, they’d still be alive." That's a non-starter for you, as it undermines the voluntariness of withdrawal.

  3. **Step (4): Rejecting that *all* letting-die cases can be redescribed as but-for causes.**  
     *Why it tempts*: Some "allowings" seem truly passive—e.g., *not* starting CPR on a stranger collapses mid-street. Redescribing this as "I kept walking" feels strained; the death might occur regardless of my presence.  
     *Why I'd discard it*: The argument only needs *some* description to work, and withdrawal isn't passive—it's deliberate cessation. For cases like CPR omission, we *can* say: "Had I begun compressions, they *might* have lived." The but-for test holds if my action was *necessary* for prevention (even if not sufficient). Step (4) survives scrutiny, and weakening it doesn't help your ventilator case—which is explicitly active.

  4. **Step (5): Rejecting that shared causal structure prevents moral differences via DAD.**  
     *Why it tempts*: Even if two acts share causal structure, moral distinctions might arise from *non-causal* factors (intent, duties, context). Killing vs. letting die could be morally distinct *despite* causal parity.  
     **Verdict: This is the most viable target.** It preserves your intuitions about withdrawal while blocking the slide to permissive euthanasia. But the cost is high and requires rethinking DAD’s role.

  ---

  ### Diagnosis: Step (5) is Flawed—Here’s Why and What it Costs
  **The flaw**: Step (5) assumes that if two acts share a causal structure (both are but-for causes of death), no moral difference can rest *specifically* on the doing/allowing distinction. This is false. DAD isn't just a causal label; it’s a *moral heuristic* that interacts with other normative features (e.g., obligations, rights, role-based duties). Shared causal structure doesn't erase these differences—it just shows DAD isn't reducible to causality.  
  - **Why it looked fine**: Your colleague conflates the *definition* of doing/allowing (step 1) with its *moral relevance*. Step (5) smuggles in the assumption that moral weight must derive solely from causation. But causation is necessary, not sufficient, for moral assessment.

  **The cost**: You must abandon the idea that DAD *alone* explains why withdrawal is permissible and active killing isn't. Instead, you need auxiliary principles to justify the distinction in causally identical cases. This means:  
  1. **DAD becomes parasitic on other norms**. It’s not a freestanding moral difference-maker. For example:  
     - Withdrawing ventilation is permissible because:  
       - Physicians have no duty to provide *futile* or *burdensome* treatment (role obligation).  
       - The patient has a right to refuse interventions (autonomy).  
       - Stopping artificial support restores the "natural" baseline (non-imposition).  
     - Active killing violates:  
       - The duty not to *introduce* new harms (e.g., "first, do no harm").  
       - Societal prohibitions against intentional homicide (even if requested).  
  2. **In edge cases, the distinction blurs—and your intuitions might conflict**. Consider:  
     - **Case A (weakens your view)**: A patient is dependent on a simple, painless IV medication (not a machine). Withdrawing it is a but-for cause of death. If permissible, why isn’t injecting air? Your auxiliary principles (e.g., "no duty to continue") must do heavy lifting.  
     - **Case B (strengthens your view)**: A hiker refuses to give their only water to a dehydrated stranger. This is "allowing to die" (no duty to rescue), but causally identical to actively poisoning them? Intuitions scream "difference!"—yet step (5) forbids using DAD here. Rejecting (5) lets you say: the hiker’s *lack of obligation* justifies allowing death, while poisoning would violate a negative right.  
  3. **You must bite a bullet on "equivalent" killings**. If a doctor *accelerates* death during withdrawal (e.g., turns off vent *and* gives morphine for comfort), critics may call it "killing." Your view permits this if the *intent* is comfort and *cessation* is justified—but it strains the DAD.  

  **Why this saves what you care about**:  
  - **Withdrawal remains permissible**—not because it’s "merely allowing," but because of futility, autonomy, and role constraints.  
  - **Active killing remains impermissible**—not because of causal structure, but because it breaches fundamental prohibitions.  
  - **The argument’s conclusion (step 7) is blocked**—rules like double effect or medical ethics standards *aren’t* resting on nothing; they rest on the auxiliary norms above.  

  ---

  ### Final Note: No Cheap Flaws, But You Aren’t Stuck
  The argument is valid *if* you accept its premises uncritically. But step (5) is a Trojan horse: it demands moral monism (causation determines all), which few ethicists accept. Rejecting it costs you theoretical "cleanliness"—DAD becomes messy and context-dependent—but saves your core commitments. In practice, this mirrors how courts and ethics committees actually reason: they invoke *multiple* factors (causation + intent + duties + consequences) without reducing one to the other.  

  **For your reading group**: Press the point on step (5). Ask: "If two acts share causal structure but differ in intent, role obligations, or patient consent, why *can’t* those differences ground moral distinctions—even if both are ‘doings’?" That forces the argument to defend its narrow causal determinism.
