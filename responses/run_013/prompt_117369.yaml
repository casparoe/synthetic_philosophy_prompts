  For libertarianism, I can translate its core as requiring non-predetermined policy selection with true stochasticity at decision points. Compatibilism could map to high-fidelity credit assignment and counterfactual control within constraints. Hard incompatibilism would emphasize that no policy can escape determinism or randomness. 

