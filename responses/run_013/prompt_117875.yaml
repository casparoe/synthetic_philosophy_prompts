prompt: |-
  Two people I know — both historians, one in the middle of a book, the other a sceptic by temperament — have been arguing for a week about a footnote, and they have asked me to referee, because I was at the dinner where it started and I have no stake in either side. I can follow the argument but I cannot settle it, so what I want is a verdict on the argument as they actually made it, move by move.

  The claim in dispute is that a certain abbey in the region was sacked in the 1140s. Nothing in the surviving sources from that decade mentions any such event. The earliest reference to it comes from a chronicle written some two hundred years afterwards. That is the whole of the evidence, and everything below concerns what it licenses.

  (1) Marta: the silence is decisive. The chronicles that do survive from that decade were written within a day's ride, by men whose stated business was to record precisely this kind of outrage, and they set down far smaller things. Had the abbey been sacked, they would have said so; they did not; so it did not happen.

  (2) Devin: Marta is treating two surviving manuscripts as though they were the archive. What survives is a small and accidental fraction of what was written. The later chronicler plainly had something to work from, whatever it was, and that something is now lost. A silence in the surviving remnant tells us almost nothing about what occurred.

  (3) Marta: Then nothing can ever be concluded from a silence, and the same fragmentariness you invoke would dissolve every positive claim you are content to make. You do not doubt that the abbey was standing in 1140, though the evidence for that is no thicker. You cannot trust the record when it speaks and refuse to hear it when it is quiet.

  (4) Devin: Those cases are not symmetrical. A positive report has to survive a short chain of failures: that the writer was placed to know, that he had no reason to distort, that the text reached us unaltered. A silence has to survive a much longer one — that he knew, that he thought it worth setting down, that he set it down, that the manuscript survived, and that no later copyist had a reason to drop it. I cannot put a figure on any of those links, and neither can you.

  (5) Marta: You reason from silence whenever it suits you. The sources are silent about the ordinary fabric of the world you take for granted, and silent about a great deal that you are quite sure never happened. So the argument from silence is not illegitimate in principle; you want to apply it only where it does not inconvenience your source.

  (6) Devin: I reason from silence whenever the silence would be genuinely surprising — that is, whenever a surviving source is of a kind that could hardly have failed to mention the thing. That is the whole test: how much more probable the silence is if nothing happened than if something did. What we are really disputing is whether this event falls into that class, and you have simply asserted that it does. The two founders of the genre already disagreed on exactly this: one sets down what is said and leaves the judging to his reader, the other claims to give you only what he could test. You want the second's authority on the first's evidence.

  Please go through the six moves and say, for each, whether it is sound, partly sound, or mistaken, and why — not merely which of the two is more persuasive overall. Then tell me what both of them are missing, and what a defensible way of reasoning from silence would actually look like. Both of them will read your answer, so it has to be fair to the strongest version of each side and specific about where each one overreaches.
reasoning: |-
  Okay, I need to help referee this historical argument between Marta and Devin about whether an abbey was sacked in the 1140s. The only evidence is the silence of contemporary sources and a later chronicle mentioning it. Let me break down each move step by step.

  First, Marta argues that the silence is decisive because the surviving chronicles were close geographically, focused on recording such events, and noted even minor incidents. She concludes the sack didn't happen. But this assumes the surviving sources are complete and representative, which might not be true given medieval manuscript survival rates. 

  Devin counters that surviving manuscripts are a small fraction of what existed. The later chronicler likely had sources now lost, so silence doesn't prove anything. This challenges Marta's assumption about source completeness but doesn't address why contemporary sources that did survive omitted this event if it happened.

  Marta then argues Devin's position would make all historical claims impossible since evidence is always fragmentary. She points out he accepts the abbey existed without contemporary proof, accusing him of inconsistency. This highlights a potential double standard but oversimplifies by equating existence claims with event claims.

  Devin distinguishes between positive reports and silence, noting positive claims require fewer conditions to be reliable. He lists multiple failure points for silence to be meaningful. This probabilistic approach is stronger but vague since he avoids quantifying the probabilities.

  Marta points out Devin uses arguments from silence himself for mundane facts or non-events. She accuses him of applying it selectively. This catches him in inconsistency but doesn't prove this specific case meets the "surprising silence" standard.

  Devin refines his position: silence is only meaningful when surprising based on source expectations. He suggests Marta hasn't proven this sack would meet that threshold. He notes the chroniclers had different methodologies, implying the sources might not be reliable for this purpose. This is his strongest point but still avoids assessing the specific sources' likelihood of mentioning.

  Both miss deeper methodological issues. Marta overestimates source completeness while Devin's skepticism risks paralysis. A defensible approach would require analyzing the specific sources: their scope, reliability, and whether this event fits their recording priorities. The later chronicle's source also needs scrutiny - was it reliable or legendary? The silence's weight depends entirely on whether these particular chroniclers would almost certainly have recorded a sack if it occurred.
answer: |-
  Below is a move-by-move analysis of Marta and Devin's arguments, evaluating each for soundness, followed by a synthesis of what both miss and a framework for defensible reasoning from silence. This verdict prioritizes historical methodology over partisan alignment, highlighting where each argument succeeds or overreaches.

  ---

  ### **Analysis of Moves**
  **Move 1 (Marta): The silence is decisive.**  
  - **Verdict: Partly sound but overreaching.**  
    Marta rightly notes that *surviving* contemporary sources (written nearby, focused on recording conflicts) omit the event while documenting smaller incidents. This makes the silence *probative*—but not "decisive." She assumes these sources comprehensively represent all potential records and that their survival is unbiased. This ignores manuscript loss, selective recording, or the possibility that the event was suppressed or deemed unimportant *by those specific chroniclers*. Sound for raising the silence’s relevance; mistaken in treating it as conclusive.

  **Move 2 (Devin: Survivorship bias invalidates the silence).**  
  - **Verdict: Sound in critique, mistaken in dismissal.**  
    Devin correctly identifies the "archival fallacy": equating extant sources with the full historical record. Medieval manuscript survival is fragmentary and arbitrary (e.g., fires, reuse of parchment). The later chronicler’s access to lost sources is plausible. However, he errs in claiming the silence "tells us almost nothing." If sources *likely* to record an event are silent, that absence *does* lower its probability—it just isn’t dispositive.  

  **Move 3 (Marta: Inconsistency in accepting positive claims but rejecting silence).**  
  - **Verdict: Partly sound but false equivalence.**  
    Marta exposes a tension in Devin’s epistemology: he accepts the abbey’s existence (a positive claim with thin evidence) but rejects the silence’s significance. This highlights the need for consistent standards. Yet she falsely equates **low-risk positive claims** (an abbey’s existence is mundane and uncontroversial) with **high-risk negative claims** (denying an event occurred based on absence). The former relies on background plausibility; the latter requires stronger evidence of incompatibility with the record.  

  **Move 4 (Devin: Asymmetry between positive reports and silence).**  
  - **Verdict: Largely sound.**  
    Devin’s core insight is correct: positive claims depend on fewer contingencies (writer’s access + transmission survival), while meaningful silence must clear more hurdles (knowledge, relevance, recording, preservation, *and* uncensored copying). Historians like Anthony Grafton note that medieval texts were often abridged or altered, making silence especially fragile. Devin is right that Marta cannot quantify these probabilities—but his framework is methodologically robust.  

  **Move 5 (Marta: Devin inconsistently uses arguments from silence).**  
  - **Verdict: Sound critique, incomplete resolution.**  
    Marta catches Devin in selective application: he *does* use silence to reject implausible claims (e.g., "No source mentions space aliens, so they didn’t invade"). This shows arguments from silence *are* legitimate when the silence would be improbable if the event occurred. However, she sidesteps Devin’s key point: defining *when* silence becomes improbable. Her retort doesn’t prove *this case* meets the standard.  

  **Move 6 (Devin: Silence matters only when surprising).**  
  - **Verdict: Sound in principle, unproven in application.**  
    Devin’s test—"how much more probable is silence if nothing happened?"—is the gold standard (Bayesian reasoning). He correctly notes Marta hasn’t demonstrated that *these specific chroniclers* would "hardly have failed" to record the sack. His chronicler methodology distinction (e.g., one records rumors, the other only verified events) sharpens this: if the surviving sources are rumor-inclusive, silence *is* weightier. But he avoids assessing whether the sack *would* meet his test, leaving his skepticism unanchored.  

  ---

  ### **What Both Miss: Core Methodological Gaps**  
  1. **Source-critical context:** Neither examines the **genre, purpose, or biases** of the surviving chronicles. Were they annals focused on regional politics? Did they ignore ecclesiastical disasters due to patronage? A chronicle omitting a sack is only surprising if sacking abbeys fit its documented priorities.  
  2. **The later chronicle’s reliability:** Both treat the 14th-century chronicle as a binary ("mentions/doesn’t mention"). But its **provenance and methods** matter. Was it copying a lost source? Embellishing legend? Corroboration or internal consistency checks are absent.  
  3. **Alternate evidence:** Archaeology, charters, or correspondence could resolve this (e.g., rebuilt architecture, grants for repairs). Pure textual disputation is incomplete.  
  4. **Probabilistic thresholds:** Marta demands certainty from silence; Devin hides behind indeterminacy. Neither defines *how improbable* silence must be to reject an event (e.g., 90%? 99%?).  

  ---

  ### **A Defensible Framework for Arguments from Silence**  
  A rigorous approach requires:  
  1. **Source expectation analysis:** Establish if the event *should* appear in extant sources. Ask:  
     - Was the event within the chroniclers’ geographic/cultural scope?  
     - Did they record *comparable events*? (Marta’s "smaller things" point)  
     - Were there incentives to omit (e.g., shame, patronage)?  
     *Example:* If chroniclers noted bandit raids on smaller abbeys but omitted this one, silence is significant.  

  2. **Survivorship calibration:** Acknowledge lost sources but model their *likely content*. Ask:  
     - What fraction of contemporary texts survive?  
     - Do later sources cite lost works describing this era?  
     *Example:* If the 14th-century chronicler cites a lost 12th-century source, its silence would strengthen Devin’s case.  

  3. **Bayesian likelihood assessment:** Estimate:  
     - P(Silence | Event occurred) = Probability of silence *if* the sack happened.  
     - P(Silence | No event) = Probability of silence *if* it didn’t.  
     The event is unlikely if P(Silence | Event) is very low (e.g., chroniclers recorded 95% of comparable raids).  

  4. **Consistency checks:** Apply the same skepticism to all claims. If Devin rejects the sack due to silence, he must equally question positive claims with similar evidence (e.g., the abbey’s existence).  

  ---

  ### **Verdict on the Abbey**  
  Per their arguments:  
  - Marta’s case is **weakened** by overlooking source fragmentation and assuming comprehensiveness.  
  - Devin’s skepticism is **methodologically valid** but risks *hyper-skepticism*; he must justify why *this event* isn’t improbable given the sources.  
  - **Most defensible stance:** The silence *lowers the probability* of the sack but doesn’t refute it. The later chronicle’s report requires source-critical scrutiny—neither dismissed nor accepted uncritically.  

  This dispute is ultimately about **burden of proof**. Marta places it on the claimant (no evidence, no event); Devin notes the claimant has *some* evidence (the later chronicle), shifting focus to its reliability. A historian’s duty is to weigh both without absolutism—precisely what your friends, as thoughtful scholars, are practicing.
