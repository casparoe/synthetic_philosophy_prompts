answer: |-
  "So the new Rule 101 passed by simple majority, requiring all future repeals to pass unanimously. Immediately, Judge Judy points at it and shouts, 'That vote only passed by simple majority! By its own standard, Rule 101 is invalid! It never took effect!' The bailiff scratches his head: 'But Judge, if Rule 101 never took effect, then simple majority *was* enough to pass it... so it *is* valid!' Judy slams her gavel: 'Exactly! So my ruling that it's invalid stands... because the rule making it invalid is... valid... which means...' She stares at her gavel, then slowly lowers it. 'Bailiff... fetch me Rule 101. I need to see if I'm allowed to rule on this.' He hands her the rulebook. She reads silently, then sighs. 'Well, according to this, my ruling only counts if all parties agree unanimously. Do you agree?' The bailiff nods. 'Do *you* agree?' she asks the empty plaintiff's chair. Silence. 'Case dismissed. Turns out Rule 101 was never in force... but only because it was.'"
  *Self-entrenching rules create a paradox when the validity of their own enactment depends on the standard they introduce.*
