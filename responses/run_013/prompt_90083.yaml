prompt: |-
  I'm the de facto IRB for a small DIY cognitive-science collective -- about a dozen of us, we run online experiments plus the occasional in-person thing, there's no real ethics board, it's just me. Every protocol that goes out has to pass my sign-off, usually in twenty minutes on a weeknight, and I'm the one who then has to look the researcher in the eye and either approve it or explain why not. (Assume I'm offline, I definately can't look anything up.)

  The part I keep getting stuck on is consent. What actually makes a consent valid? The cases that keep biting us:

  - cover stories and deception (participants think its a memory task, it's really about cheating)
  - incentives and dependency (we recruit from our own Discord, we pay people, sometimes we run studies with people who want to be in the group)
  - competence (someone shows up drunk, or mid-crisis, or is just really young)
  - consent to X when you only know Y -- broad consent, open-ended follow-ups, "we might contact you later about related studies"

  Please write me a decision procedure I can actually run on a protocol: the questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it stops with "this is a values call, a human has to own it." Keep whatever the philosophy of consent actually says that survives being turned into a checklist -- the difference between consent as an inner state and consent as an act that changes whats permitted, whether deception only wrecks consent when the hidden fact is one a reasonable person would care about, whether paying someone can ever be coercive when they were already badly off, competence as a cliff versus a slope. Don't hand me a reading list, I can't fetch it.

  We have an internal word, "consent-shaped," for a yes that ticks every box but that everyone involved knows wasn't really consent. The procedure has to catch those, and it has to be honest about which of its steps are just judgment calls wearing a lab coat.

  Then run it on three cases: a deception study; a paid study recruited through our own Discord where a couple of participants are basically dependent on the money; and a study I personally really want to run that the procedure has to tell me no on. Finish by telling me what the procedure can't do.
reasoning: |-
  We are creating a decision procedure for valid consent in human subjects research. The procedure must be a checklist that can be run in about 20 minutes and must address the key issues: deception, incentives, competence, and scope of consent.

  The philosophy we'll incorporate:
  - Consent is an act that changes what is permitted, but it must be based on adequate understanding and be voluntary.
  - Deception invalidates consent if the hidden fact is material (i.e., a reasonable person would care about it and it would affect their decision).
  - Payment can be coercive if it leads a person to accept risks they would not otherwise accept, especially if the participant is in a vulnerable position (e.g., economically dependent). However, payment is not inherently coercive.
  - Competence is a threshold: the participant must have the capacity to understand the information and make a choice. Factors like intoxication, crisis, or age can impair competence. We treat competence as a cliff: if below the threshold, no consent is possible.
  - Broad consent for future use or contact must be specific enough that the participant understands the general scope and can reasonably expect what might happen.

  We are also concerned about "consent-shaped" things that look like consent but aren't.

  The decision procedure:

  1. **Voluntariness**
     - Question: Is participation voluntary, free from coercion or undue influence?
     - Red flags: 
       - Incentives that are so large they are irresistible (relative to the participant's situation) OR that exploit a dependency (e.g., if the participant is economically dependent on the researcher or the group).
       - Any penalty for non-participation or withdrawal.
     - Good enough: The participant can say no without negative consequences. Payment is reasonable and not exploitative (consider the population: if recruiting from a group that is financially struggling, even moderate payment might be undue influence).
     - Hard stop: If there is coercion (threats) or clear undue influence (e.g., exploiting a power imbalance, like a supervisor recruiting subordinates). Also, if the participant is in a position of dependency (e.g., they are a member of the group and feel they must participate to stay in good standing) and the payment is substantial enough to impair judgment, it's a no.
     - Judgment call: Whether the payment is so high it becomes undue influence. Consider the participant population: if they are from a wealthy community, $20 might be trivial; if they are low-income, $20 might be too influential.

  2. **Information**
     - Question: Does the participant receive all material information?
     - Material information: Anything that a reasonable person would want to know to make a decision, including risks, benefits, procedures, and the fact of deception (if any) after the study.
     - Red flags: 
       - Deception about material aspects (e.g., the true purpose if it involves sensitive topics, risks, or if the participant would likely decline if they knew).
       - Withholding information that would affect the decision.
     - Good enough: The consent form clearly states what the participant will do, any foreseeable risks (even minimal), and if there is deception, it is justified (non-material) and there will be a debriefing. For deception, it must be that the study cannot be done without it and the topic is important, and the deception is not about something that would cause harm or that a reasonable person would object to.
     - Hard stop: 
       - Deception about physical risks or highly sensitive topics (e.g., illegal behavior, deeply personal matters) without strong justification and without a plan for immediate debriefing and opportunity to withdraw data.
       - Withholding information that is material and there is no plan to disclose it later (e.g., in a debriefing).
     - Judgment call: Whether the deception is about a material fact. For example, in a cheating study: if the participant is led to believe they are in a memory test but then are put in a situation where they might cheat, that is material because cheating could have social or emotional consequences. However, if the deception is about the purpose of a benign task (e.g., telling them it's a pilot test when it's the real thing) and there are no risks, it might be acceptable.

  3. **Competence**
     - Question: Is the participant capable of giving consent?
     - Threshold: Must be able to understand the information and make a reasoned decision.
     - Red flags: 
       - Participant is intoxicated, in the middle of a mental health crisis, or a minor (unless the study is specifically for minors and has parental consent).
       - The study population includes individuals who might not have capacity (e.g., people with cognitive impairments) without appropriate safeguards.
     - Good enough: The researcher has a plan to screen out participants who are visibly impaired (e.g., asking if they are under the influence, observing behavior) and for minors, verification of age. For online studies, it's harder: if the platform (like Discord) is known to have minors, there must be an age check.
     - Hard stop: 
       - If the participant is clearly impaired (and the researcher knows or should know) and the study is not about that condition with appropriate safeguards.
       - If the participant is a minor and there is no parental consent and the study is not minimal risk and exempt.
     - Judgment call: How to assess competence in an online setting? We might rely on self-report and design the study to exclude those under 18. But if a participant is in crisis, it's hard to know. The procedure must require the researcher to exclude anyone they suspect is impaired.

  4. **Scope**
     - Question: Does the consent cover exactly what the participant is agreeing to, and nothing more?
     - Red flags:
       - Broad consent for future unspecified studies.
       - Consent for one study and then using the data for another without re-consent.
       - Storing data indefinitely without clear purpose.
     - Good enough:
       - The consent form specifies the current study and any future use or contact in a way that the participant can understand the scope (e.g., "We may invite you to participate in future studies about similar topics" or "We may keep your data for future research on cognitive processes, which will go through an ethics review").
       - For deception, there must be an opportunity after debriefing to withdraw consent for the use of their data.
     - Hard stop:
       - If the consent form asks for blanket permission for any future research without any boundaries.
       - If the study involves deception and there is no plan for debriefing and re-consent (or data withdrawal) after the deception is revealed.
     - Judgment call: How specific is specific enough? The participant should have a general idea of the types of future studies (e.g., "research on decision making" vs. "any research").

  5. **Documentation**
     - Question: Is the consent properly documented?
     - Good enough: For online studies, a click-through consent form that the participant must agree to. For in-person, a signed form. For minimal risk, verbal consent might be acceptable but must be recorded.
     - Hard stop: No consent form or documentation at all.

  6. **Overall Assessment**
     - After the above, ask: Is there any aspect that feels "consent-shaped" but not real? For example, if the participant is in a position where they feel they cannot refuse (e.g., because of dependency) even if the form is perfect, it's not valid.

  Now, we run the procedure on three cases:

  **Case 1: Deception Study**
  - Study: Participants think it's a memory task, but it's really about cheating. They might be put in a situation where they could cheat without getting caught.
  - Procedure:
    - Voluntariness: Payment is $5 for 30 minutes. This is unlikely to be coercive. But if recruiting from a group where $5 is a lot, we must consider. However, no dependency on the researchers. → Pass.
    - Information: The consent form does not mention the true purpose. The deception is material because cheating could cause distress or embarrassment. The debriefing must be immediate and allow data withdrawal. → Without a strong justification and a debriefing plan, this is a red flag.
      - Hard stop? If the deception is about a material fact and there is no debriefing and no opportunity to withdraw, it's a hard no. But if there is debriefing and withdrawal option, it might be acceptable if the study is important and the risk is minimal. However, the risk of distress is real. → Judgment call: We must weigh the importance of the study and the measures to minimize harm. Without a debriefing plan that includes counseling resources, this might be too risky. → Without a plan for handling distress and allowing withdrawal, it's a no.
    - Competence: Screening for age and sobriety? Online, so hard. But the study doesn't target impaired individuals. → Pass if age check is in place.
    - Scope: The consent form only covers the memory task. After debriefing, they must be given the option to withdraw. → If the form doesn't mention that there might be elements of deception and that they will be debriefed, it's a problem. The form should state that the study might involve incomplete disclosure and that they will be fully informed afterward. Without that, it's a no.
    - Documentation: Click-through consent. → Pass.

  - Verdict: Without a debriefing plan that includes emotional support and the option to withdraw data, and without the consent form mentioning that there may be deception and that they will be debriefed, this is a no. Even with that, because the deception is about a sensitive topic (cheating) and might cause distress, it's a judgment call. Given the potential harm, without strong justification and safeguards, it's a no.

  **Case 2: Paid Study with Dependency**
  - Study: Recruited through our Discord. We pay $20 for 1 hour. Some participants are regulars who do many studies and rely on this money. Two participants are known to be financially struggling and do every study we post.
  - Procedure:
    - Voluntariness: The payment is above minimum wage and might be hard to refuse for someone in need. Because we are recruiting from our own Discord, there might be a sense of obligation to participate to stay in the group. → This is a red flag. The dependency (they need the money) combined with the recruitment from a group they are part of creates undue influence. 
      - Hard stop? If the payment is so high that it overcomes free choice, and the participants are vulnerable, it's a problem. We must consider: Is the study minimal risk? If yes, then maybe acceptable. But if there are any risks, it's a no. Also, the fact that they are in-group might make them feel pressured. → We need to cap the number of studies a person can do in a month to avoid dependency. Without such a cap and without ensuring that the participants are not over-reliant, it's a no.
    - Information: The study is straightforward, no deception. → Pass.
    - Competence: Age check in place. → Pass.
    - Scope: Clear. → Pass.
    - Documentation: Click-through. → Pass.

  - Verdict: The dependency issue is a problem. Without measures to prevent exploitation (like limiting participation frequency or having a lower payment that doesn't create dependency), this is a no. Also, we must make it clear that participation is not tied to group membership.

  **Case 3: Study You Really Want to Run (But Must Be Told No)**
  - Study: You want to run a study on cognitive effects of sleep deprivation. Participants are recruited from the Discord and paid $100 for 24 hours of wakefulness during which they perform tasks. The tasks are low-risk (button pressing) but being awake for 24 hours is known to cause distress and temporary cognitive impairment. There is a screening for health issues, but it's self-report.
  - Run the procedure:
    - Voluntariness: $100 is a lot, especially for the group. This could be coercive for someone in financial need. → Red flag: undue influence.
    - Information: The risks (distress, impaired cognition, potential for accidents after the study) are material and must be clearly stated. Also, they must be warned not to drive or operate machinery after. → If the consent form does not adequately convey the risks, it's a no.
    - Competence: The study itself impairs competence! During the study, they become less able to withdraw. Also, screening might miss someone with an underlying condition. → This is a hard stop: we cannot get valid consent for a procedure that impairs the participant's capacity to continue to consent. Moreover, the risks are more than minimal.
    - Scope: The consent covers the sleep deprivation and tasks. → Pass.
    - Documentation: Click-through. → Pass.

  - Verdict: Hard no. The risks are more than minimal, and the payment is potentially coercive. Moreover, the procedure impairs the participant's capacity to withdraw during the study. Sleep deprivation studies require medical supervision and an IRB with expertise, which we don't have.

  **What the Procedure Can't Do**
  - It can't replace deep ethical reflection on novel or complex issues.
  - It can't account for every cultural or individual variation in what is material or coercive.
  - It can't force a researcher to accept a "no" if they are determined to run the study.
  - It can't catch every instance of impaired competence in online settings.
  - It relies on the honesty and vigilance of the researcher in describing their protocol and in conducting the study.
  - It can't guarantee that the participant reads or understands the consent form.
  - It can't eliminate the power imbalance in researcher-participant relationships, especially in a small group where the researcher is also the community leader.

  Final note: The procedure is a tool to structure thinking, but it requires the user to exercise judgment at the marked steps. When in doubt, err on the side of participant welfare.
answer: |-
  ### Decision Procedure for Valid Consent  
  Here’s a step-by-step checklist to run on any protocol. It prioritizes **materiality** (what a reasonable person would care about), **voluntariness** (freedom from coercion), **competence** (threshold capacity), and **scope** (alignment between what’s agreed to and what’s done). It flags "consent-shaped" issues (procedurally correct but substantively invalid) and separates hard stops ("no") from judgment calls ("human must own it").  

  **Core Philosophy Embedded**:  
  - **Consent is a permission-granting act**, not just an inner state. It requires understanding material facts and being free to say no.  
  - **Deception invalidates consent** only if the hidden fact is *material* (a reasonable person would care and it might change their decision).  
  - **Payment is coercive** if it exploits preexisting vulnerability (e.g., dependency) to override genuine choice. Poverty alone isn’t disqualifying, but leveraging it is.  
  - **Competence is a cliff**: If capacity is below threshold (e.g., drunk, underage, mid-crisis), consent is impossible—no sliding scale.  
  - **Scope must be bounded**: Consent to "X" isn’t valid for "Y" if the gap is too wide (e.g., "contact you later" is okay if specified; "use your data for anything" is not).  

  **The Procedure**  
  *Run in order. Stop at the first hard "no." If all pass, approve. Judgment calls require you to pause and justify.*  

  1. **VOLUNTARINESS CHECK: Is participation free of coercion or undue influence?**  
     - **Question**: Could a reasonable person in the participant’s position say "no" without major consequences?  
     - **Red Flags**:  
       - Incentives disproportionate to risk/time (e.g., $50 for 5 minutes).  
       - Recruitment from a closed group (e.g., your Discord) where refusal could imply social/professional fallout.  
       - Participants financially dependent on the researcher or collective (e.g., they rely on study payments to eat).  
     - **Good Enough**:  
       - Payment is reasonable for time/effort (e.g., minimum wage or standard academic rates).  
       - No penalty for declining/withdrawing.  
       - Vulnerable populations (e.g., financially desperate) aren’t targeted or are given alternatives.  
     - **Hard Stop**:  
       - Incentives exploit known dependency (e.g., paying a starving person $100 for a high-risk task).  
       - Social pressure makes refusal practically impossible (e.g., a junior member fearing exclusion).  
     - **Judgment Call**:  
       - "Does this payment/incentive *feel* like it could override a ‘no’ for this group?" (Own this call.)  
     - **"Consent-Shaped" Risk**: If the participant says "yes" only due to desperation or fear, it’s invalid.  

  2. **MATERIAL INFORMATION CHECK: Does the participant know all material facts?**  
     - **Question**: Would a reasonable person consider the hidden/disguised information relevant to their decision?  
     - **Red Flags**:  
       - Deception about the study’s true purpose (e.g., "memory test" vs. "cheating study").  
       - Withholding risks (e.g., potential distress, data reuse).  
       - Unclear follow-ups (e.g., "we might contact you later" without specifics).  
     - **Good Enough**:  
       - Debriefing planned for deception studies, with post-hoc consent for data use.  
       - Risks are disclosed (even if minimal).  
       - Future contact/data use is scoped (e.g., "related studies on decision-making").  
     - **Hard Stop**:  
       - Deception about *material* facts (e.g., hiding emotional/social risks like shame or embarrassment).  
       - No path to post-debrief consent withdrawal.  
       - Broad consent with no boundaries (e.g., "we can use your data for anything").  
     - **Judgment Call**:  
       - "Is the hidden fact something a reasonable person *would* object to?" (e.g., cheating vs. trivial task details).  
     - **"Consent-Shaped" Risk**: If the consent form ticks boxes but obscures material facts (e.g., burying risks in jargon), it’s invalid.  

  3. **COMPETENCE CHECK: Can the participant understand and decide?**  
     - **Question**: Is the participant capable of grasping the study’s nature and consequences?  
     - **Red Flags**:  
       - No age verification (for under-18s).  
       - No screening for intoxication/crisis (e.g., slurred speech, visible distress).  
       - High-risk studies targeting impaired groups (e.g., sleep-deprived subjects).  
     - **Good Enough**:  
       - Age gate for online studies (e.g., "must be 18+").  
       - Simple sobriety/sanity check (e.g., "Are you sober and fit to consent?").  
       - Minimal-risk studies where impairment doesn’t exacerbate harm.  
     - **Hard Stop**:  
       - Participant is underage without parental consent.  
       - Participant is visibly intoxicated, in crisis, or otherwise incapable.  
       - Study design impairs competence during participation (e.g., intoxication as part of the protocol).  
     - **Judgment Call**: None—competence is a cliff. If red flags exist, it’s a hard no.  
     - **"Consent-Shaped" Risk**: A drunk person clicking "I agree" is not consent.  

  4. **SCOPE CHECK: Does consent cover what’s actually done?**  
     - **Question**: Is the study within the bounds of what the participant agreed to?  
     - **Red Flags**:  
       - Deception without debriefing.  
       - Data reuse/follow-ups beyond original consent (e.g., "contact you later" for unrelated studies).  
       - Open-ended commitments (e.g., "future research" with no limits).  
     - **Good Enough**:  
       - Debriefing and re-consent for deception studies.  
       - Future contact is opt-in, specific, and infrequent (e.g., "email about similar studies, max 1x/month").  
       - Data anonymized/destroyed after use.  
     - **Hard Stop**:  
       - No debriefing for deception involving material facts.  
       - Data used for undisclosed commercial purposes.  
     - **Judgment Call**:  
       - "Is the gap between what was consented to and what’s done *so wide* it breaks trust?" (e.g., "memory test" vs. "political profiling").  
     - **"Consent-Shaped" Risk**: A "yes" to a vague future-use clause is invalid if it’s a blanket license.  

  5. **FINISHING CHECK: Would you look the participant in the eye and defend this?**  
     - **Question**: Does anything feel off, even if it passed mechanically?  
     - **Action**: If any step was a judgment call, state why you approved it. If the protocol feels exploitative, withhold approval.  
     - **Hard Stop**: If you can’t defend it ethically, it’s a no.  

  ---

  ### Running the Procedure on Three Cases  
  **Case 1: Deception Study**  
  - *Protocol*: "Memory task" that’s actually about cheating. Debriefing post-study, data withdrawal allowed.  
  - **Check**:  
    1. **Voluntariness**: $10 payment, no dependency → Pass.  
    2. **Material Information**: Deception about cheating *is material* (reasonable people would care about being tricked into unethical behavior). Debriefing planned → Passes mechanically, but **Judgment Call**: "Is cheating a material risk?" (Yes—potential for shame/reputation harm.)  
    3. **Competence**: Age-gated → Pass.  
    4. **Scope**: Debriefing and withdrawal option → Pass.  
    5. **Finishing**: Feels borderline due to deception. **Approved with caution** (own the judgment call).  

  **Case 2: Paid Study with Dependency**  
  - *Protocol*: $25 for 30-minute Discord-recruited task. Two participants rely on study income to pay rent.  
  - **Check**:  
    1. **Voluntariness**: Payment is reasonable, but dependency exists → **Judgment Call**: "Does this exploit vulnerability?" (Yes—researchers know participants can’t say no without hardship.) **Hard Stop**: Coercive due to dependency. **Rejected**.  
    2. *Stop here*—no need to check further.  

  **Case 3: Study You Want to Run (Must Reject)**  
  - *Protocol*: "Stress and creativity" study. Participants undergo public humiliation (e.g., mocked for ideas) to measure resilience. Recruited via Discord, $50 payment.  
  - **Check**:  
    1. **Voluntariness**: High payment for vulnerable group → Risk of undue influence. **Judgment Call**: "Could desperation override refusal?" (Likely yes.)  
    2. **Material Information**: Humiliation risk is hidden → **Hard Stop**: Deception about material emotional harm.  
    3. *Stop here*—rejected. (Competence/scope irrelevant once material deception is found.)  

  ---

  ### What the Procedure Can’t Do  
  1. **Assess Unseen Vulnerabilities**: It can’t catch hidden dependencies (e.g., a participant hiding financial woes) or subtle coercion.  
  2. **Handle Novel Dilemmas**: Philosophy debates (e.g., "what counts as reasonable?") become judgment calls—you must own those.  
  3. **Guarantee Understanding**: It ensures information is *offered*, not that it’s *understood*. Online forms can be consent-shaped if skimmed.  
  4. **Override Power Imbalances**: In a small collective, the "researcher in your Discord" dynamic skews voluntariness. The procedure flags it, but you must enforce boundaries.  
  5. **Replace Ongoing Review**: It’s a snapshot—doesn’t cover post-study harms or data breaches.  

  **Final Note**: This procedure forces explicit trade-offs. When in doubt, default to: "Would I consent to this if I were in their shoes?" If the answer isn’t "hell yes," it’s probably a no.
