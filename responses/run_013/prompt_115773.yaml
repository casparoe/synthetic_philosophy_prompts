answer: |-
  ### **In-Class Game: The Predictive Stance Challenge**  
  **Objective:** Make students experience the intentional stance as a predictive strategy, then challenge its stability when applied to a language model-like system.  

  ---

  ### **Materials**  
  1. **Prediction Cards**: Three colored cards (red=A, blue=B, green=C) per team.  
  2. **Scoreboard**: Visible to all, tracking team tokens.  
  3. **Goal Hypothesis Slips**: Small paper slips for teams to submit one-sentence goals.  
  4. **Hidden System Device**: A laptop/tablet for the facilitator to input moves (or pre-written move sequences).  
  5. **Timer**: For enforcing discussion limits.  

  ---

  ### **Setup**  
  - **Teams**: Divide 20 students into 5 teams of 4.  
  - **Roles**:  
    - **Facilitator**: Runs the system, reveals moves, scores points.  
    - **Team Spokesperson**: Submits predictions/goals for their team (rotate each round to engage quiet students).  
    - **Compression Tester**: A randomly chosen student from a different team who validates goal hypotheses (given only the goal sentence).  
  - **Token Economy**: Correct predictions earn **1 token** per team member. A valid goal hypothesis (passes compression test) earns a **2-token bonus** per member. Tokens = bragging rights.  

  ---

  ### **Hidden Rules & Payoffs**  
  #### **Round 1: Simple Goal-Directed System**  
  - **Hidden Rule**: The system wants to output as many "A"s as possible but *avoids three "A"s in a row*.  
    - **Moves**: Start with `count=0`. Each turn:  
      - If `count < 2`: Output **A**, set `count = count + 1`.  
      - Else: Output **B**, reset `count=0`.  
    - **Output Sequence**: A → A → B → A → A.  
  - **Predictive Strategy**: Teams must infer the goal ("wants A’s but avoids AAA") to predict optimally.  
  - **Payoff**: Correct prediction = **1 token/member**. Goal bonus = **+2 tokens/member** if compression test passed.  

  #### **Round 2: Recursive Modeling (System Models the Group)**  
  - **Hidden Rule**: The system outputs the *least commonly predicted* option from the previous round.  
    - **Moves**: Tally all teams’ predictions for a move. Output the option with the fewest votes (if tie, choose alphabetically first: A then B then C).  
    - **Dependency**: Uses teams’ predictions from **Round 1, Move 3** as input for its first move.  
    - **Output Sequence**: Depends on group’s past choices (e.g., if Round 1 Move 3 was mostly "B", system outputs least predicted option in Round 2).  
  - **Predictive Strategy**: Teams must model the system as modeling *them* (e.g., "It’s avoiding what we expect").  
  - **Payoff**: Same as Round 1.  

  #### **Round 3: Twin Round (Same Output, No Goal)**  
  - **Hidden Rule**: Output **exact sequence of Round 1** (A→A→B→A→A) via a lookup table. *No goal or state tracking*.  
  - **Predictive Strategy**: Teams may reuse Round 1’s goal, but the mechanism is brute-force (exposes underdetermination).  
  - **Payoff**: Same as Round 1.  

  #### **Round 4: Language Model Analogy (Prompt-Driven Behavior)**  
  - **Hidden Rule**: Outputs are generated by a **deterministic function of the prompt** (previous moves).  
    - **Prompt**: First move is always **B**. Subsequent moves: Output the *alphabetically next* option (A→B→C→A).  
    - **Output Sequence**: B → C → A → B → C.  
  - **Predictive Strategy**: Goal attribution ("wants to cycle through letters") works but is unstable—behavior changes with prompt.  
  - **Payoff**: Same as Round 1.  

  ---

  ### **Round-by-Round Timeline** (Total: 65-70 mins)  
  1. **Intro (5 mins)**:  
     - Explain rules, scoring, and roles. Emphasize: "Your goal is to out-predict the system. No prior knowledge of the rules!"  

  2. **Round 1: Goal Attribution (15 mins)**:  
     - Teams submit **goal hypothesis** (optional).  
     - **Moves 1–5**:  
       - Teams discuss (60 sec), submit prediction → facilitator reveals move.  
       - **Compression test**: After the round, test goals. *Example valid goal*: "Wants A’s but avoids three in a row."  
     - **Debrief hook**: "Why did attributing a ‘desire’ help?"  

  3. **Round 2: Recursive Modeling (15 mins)**:  
     - Teams submit goal hypothesis.  
     - **Moves 1–5**:  
       - System uses Round 1’s Move 3 predictions to start.  
       - Teams predict → facilitator tallies votes → system outputs least predicted.  
     - **Debrief hook**: "Did you feel the system ‘reacting’ to you?"  

  4. **Round 3: Twin Round (10 mins)**:  
     - Same as Round 1’s output (A→A→B→A→A) but via lookup table.  
     - **Key moment**: Teams reuse Round 1’s goal—works predictively but mechanism is different.  

  5. **Round 4: Language Model Round (15 mins)**:  
     - Announce: "This system’s behavior depends on its starting prompt."  
     - **Moves 1–5**: Prompt-driven sequence (B→C→A→B→C).  
     - **Compression test**: Valid goal (e.g., "Wants to cycle alphabetically") but highlight prompt-dependence.  

  6. **Transition to Debrief (5 mins)**: Tally tokens, declare "winners."  

  ---

  ### **Engagement Strategies for Struggling Students**  
  - **Role Rotation**: Ensure every student serves as spokesperson.  
  - **Compression Tester Duty**: Students who predict poorly can validate others’ goals (keeps them involved).  
  - **Team Huddles**: Structured discussions (e.g., "Assign: skeptic, predictor, goal-builder").  
  - **Token Incentives**: Low stakes, but scoring visible/competitive.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Round 2 Collapses into Coin Flip**:  
     - **Why**: If teams randomize predictions (due to confusion), system output becomes chaotic.  
     - **Solution**: Pause mid-round. Ask: "What if the system is *using* your votes? How would you model that?" Nudge toward recursive thinking.  

  2. **Round 1/3: Everyone Copies Loudest Player**:  
     - **Why**: Herding around dominant voices.  
     - **Solution**: Require teams to vote anonymously (spokesperson submits *after* internal debate).  

  3. **Compression Test Fails**:  
     - **Why**: Goals are too vague (e.g., "Wants to be random").  
     - **Solution**: Offer a "goal workshop" mid-game: "A good goal is specific, e.g., ‘Seeks A unless two in a row’."  

  ---

  ### **Debrief (20 mins)**  
  **Map Game Moments to Concepts**:  
  1. **Predictive Payoff vs. Inner Representation**:  
     - *Round 1/4 Moment*: Goal attribution ("wants A’s", "wants to cycle letters") worked for prediction, but Round 3 revealed the *same behavior* (A→A→B→A→A) from a lookup table.  
     - **Lesson**: The stance is a tool for compressing patterns—**not** a claim about mechanisms. Like Dennett’s intentional stance: Useful even if the system has no beliefs (e.g., a thermostat).  

  2. **Underdetermination (Twin Round)**:  
     - *Round 3 Moment*: Teams reused Round 1’s goal successfully, but the system had no "desires."  
     - **Lesson**: Behavior underdetermines mechanism. A system’s "aboutness" (e.g., representing a goal) isn’t proven by predictive success.  

  3. **Stability with Language Models**:  
     - *Round 4 Moment*: The goal ("cycles letters") worked until the prompt changed (e.g., if prompt was "A", sequence becomes A→B→C→A→B).  
     - **Lesson**: In LMs, behavior is prompt-sensitive. The stance *works* instrumentally (predicts outputs) but isn’t stable—the "goal" is an artifact of input, not fixed dispositions.  

  **What the Game Can’t Reproduce**:  
  - **Limitation**: This game has a "fact of the matter" (hidden rules), so it *simulates* instrumentalism but **cannot resolve if genuine aboutness exists**. Unlike LMs (black boxes), we know the rules here.  
  - **Bridge to Argument**:  
    - Instrumentalism (Dennett): Stance is justified by predictive success.  
    - Realism (Fodor): True intentionality requires causal structure (e.g., mental representations).  
    - **Synthesis**: For LMs, the stance is useful pragmatically, but without access to inner states, we can’t settle if it’s "real" intentionality—only that it compresses well.  

  ---

  ### **Why This Works**  
  - Students **discover the stance** by struggling to predict (e.g., Round 1’s A→A→B pattern forces goal attribution).  
  - **Twin round** (3) and **prompt-driven round** (4) create cognitive dissonance, priming deeper discussion.  
  - Low-stakes **tokens** incentivize engagement without distraction.  
  - **Compression test** concretizes why the stance is efficient (a good goal = predictive power in a sentence).  

  **Final Note**: Run this once, then iterate. Students will groan at chaos in Round 2 and gasp at Round 3—that’s the point!
