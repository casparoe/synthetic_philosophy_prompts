     - Output that letter.

  Round 3:
     - Move1: A
     - Move2: A
     - Move3: B
     - Move4: A
     - Move5: A

  Round 4:
     - Prompt: A, A (for the first two moves, which are given)
     - Move3: next letter after move2 (A -> B)
     - Move4: next letter after move3 (B -> C)
     - Move5: next letter after move4 (C -> A)

  Payoff table (per team member):
  - For each move in a round: 1 token for a correct prediction (so up to 5 tokens per round if they get all moves right).
  - Bonus for a goal that passes the compression test: 2 tokens.

  Timeline (90 minutes):

