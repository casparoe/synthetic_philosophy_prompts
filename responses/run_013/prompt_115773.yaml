n of the prompt it is given rather than a fixed disposition, which is where the analogy to a language model has to be handled carefully. Tell me what will predictably go wrong the first time — at minimum the round that collapses into a coin flip and the round where everyone simply copies the loudest player — and how to handle each. Finally, be frank about what the activity cannot reproduce: in my setup there is always a fact about the mechanism, so the game can make the instrumentalist reading vivid but cannot touch the question of whether there is genuine aboutness rather than merely a description that compresses well, and I want the debrief to say so and to supply that part by argument. American English.
