  - Compression test: the goal statement is used to predict the first three moves of the round? But the first two are given. So we adjust: the goal is used to predict moves 1 to 3? But move1 and move2 are given. Alternatively, we can define the compression test for round 4 to predict moves 3,4,5? But the problem is that the goal is submitted at the beginning, so it should predict the entire round. But the first two are fixed by the prompt. So we can ask the student to predict the entire 5 moves? But move1 and move2 are fixed. So the student will write A, A, then their prediction for move3,4,5. Then we compare to A, A, B, C, A. If they get the B, C, A correct, then it passes.

  But note: the compression test as defined earlier was for the first three moves. We can change for round 4: the compression test is to predict moves 1 to 3? But move1 and move2 are given, so they will be A, A. Then they have to predict move3? But that's only one move. Not three.

  We can redefine the compression test to be: predict the first three moves that are not fixed by the prompt? That is, moves 3,4,5? But that's three moves. So we do:

  For round 4, the compression test: give the goal statement and the prompt (first two moves: A, A) to a student from another team and ask them to predict the next three moves (moves 3,4,5). If they get them correct (B, C, A), the goal passes.

  So we adjust per round if necessary.

  Roles:
  - Facilitator: runs the game, reveals the moves, counts votes, does compression test.
  - Teams: discuss and make predictions.

  Keeping students engaged: 
  - Even if a team never guesses right, they can still participate in the compression test for other teams (as the predictor). Also, the team might get the bonus if their goal passes the compression test even if their predictions were wrong. 
  - Moreover, the game is fast-paced and team-based, so everyone should be involved in discussion.

  Debrief (20 minutes):
  - Map specific moments:
     - In round 1, students likely attributed a goal (e.g., "wants to output A but avoids three in a row"). This goal allowed them to predict the moves. But note: the hidden rule was a mechanism that produced the same behavior. The goal was a predictive strategy, not necessarily a claim about inner states.
     - Round 2: the system was modeling the group (it was using the group's predictions to decide its move). The best predictors were those who modeled the system as modeling them (recursive). But note: the system's rule was very simple (least votes) and didn't require it to have beliefs and desires; it was just a rule.
     - Round 3 (twin round): same behavior as round 1 but generated by a fixed sequence (no goal). This shows underdetermination: the behavior doesn't tell us which mechanism produced it.
     - Round 4: the system's behavior depended on the prompt. The goal attribution worked (e.g., "to output the next letter"), but the system's behavior was entirely determined by the rule and the prompt. There was no inner representation of the goal. This is analogous to a language model: it produces text based on the prompt and its training, but does it have beliefs and desires? The stance might be useful for prediction, but we must be careful about attributing inner states.

  - What the activity cannot reproduce: 
     - In the game, there is always a fact of the matter about the mechanism (the hidden rules). In reality, for complex systems like language models, we don't know the exact mechanism. But more importantly, the game doesn't address the question of whether there is genuine aboutness (intentionality) or just a useful description. We must remember that the intentional stance is an instrumental strategy. The debrief should argue that the stance does not settle the question of real intentionality.

  Predictable problems:
  - Round 2 might collapse into a coin flip because the system is choosing the least predicted, so if the group coordinates and all vote for the same letter, then the system will choose one of the other two. But which one? The first in the alphabet. So if they all vote A, then the system will choose between B and C: it picks B (because B comes before C). So the group might learn to all vote A, then predict B? But then if they all predict B, then the system will choose between A and C: picks A. So it might be chaotic.

  - How to handle: The facilitator can note that this round is challenging and that's part of the lesson. The system is hard to predict because it depends on the group's own actions. The best strategy might be to try to model what the system is doing (which is reacting to the group) and then try to outguess it.

  - The round where everyone copies the loudest player: This might happen in round 2. Some students might dominate and others follow. To handle, encourage teams to discuss internally and remind them that they are competing as a team. The loudest player might be right or wrong, but the team has to decide together.

  - Also, in round 3, the students might quickly notice it's the same as round 1 and just copy their previous predictions. That's fine.

  Materials:
  - Whiteboard or projector to display the moves.
  - Prediction cards (A, B, C) for each team for each move.
  - Goal submission slips.
  - Tokens (or just a scoreboard).
  - Rule sheets for the facilitator (hidden rules).

  Hidden Rules (for facilitator only):

  Round 1:
     - Move1: A
     - Move2: A
     - Move3: B
     - Move4: A
     - Move5: A

  Round 2:
     - For each move, collect the teams' predictions (each team submits one letter).
     - Count the number of predictions for A, B, C.
