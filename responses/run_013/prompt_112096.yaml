prompt: |-
  I have been arguing for months with a friend in a philosophy-of-physics reading group about whether the quantum state describes physical reality or merely an agent's information, and we have reached the stage where we simply recite the same no-go theorems at each other. I would like you to abandon the customary survey of positions and give me a credence: a single number for the proposition that the quantum state is ontic — that it represents a real, observer-independent feature of the world, rather than an agent's information about a world whose complete description it does not capture — together with the reasoning that produces it.

  Decompose the question as you see fit, but give me a rough probability and a one-line justification for each sub-question, and tell me explicitly how the terms combine. I want to know how far the no-go results really constrain the space of psi-epistemic models once you grant their auxiliary assumptions — the preparation-independence assumption of the PBR theorem, and whatever else you take to be doing the real work; how much of the surviving space is occupied by views that are only verbally epistemic; how much your answer is parasitic on how the measurement problem is resolved, and in particular whether the question threatens to become trivial in a many-worlds setting, where the wavefunction is simply the whole ontology; and whether "represents physical reality" is a determinate enough predicate for the question to have a truth value at all — if you suspect that some of the disagreement is merely verbal, give me the probability you attach to that and say how you fold it into the number rather than hiding behind it. Then give me the combined figure and name the single sub-question to which it is most sensitive.

  One further consideration I would like you to weigh explicitly, because it is my friend's and I cannot decide whether it is clever or confused. She claims that any genuinely psi-epistemic view must answer the question "information about what, and for whom?", and that the only available answer — the information possessed by some agent or system — presupposes determinate ontic states, so that psi-epistemicism quietly helps itself to the very ontic furniture it denies. Give me a probability that this objection lands against the strongest version of the epistemic view, tell me what a defender would say to defuse it, and finish by telling me which single piece of evidence or argument — a theorem, an interpretation, a reanalysis of a known result — would move your number most, and in which direction.
