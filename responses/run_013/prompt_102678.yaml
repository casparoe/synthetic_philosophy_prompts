  ### Seminar Session Design: Neurath's Picture-Language Friction Activity  
  **Total Time:** 100 minutes  
  **Students:** 9 (work in 4 pairs + 1 facilitator role; rotate as needed)  
  **Materials per Group:**  
  - One deck of 40 pictographic cards (no words, letters, numerals, or perspective).  
  - Rules sheet for meta round (blank paper).  
  - Claims list (for encoders only).  

  **Deck Specifications (40 Cards):**  
  Draw these on uniform 3"x3" cards using bold, flat, monochrome silhouettes (e.g., black ink on white). *No gradients, shadows, or depth.*  

  | **Category** | **Cards (Quantity)** | **Visual Description** |  
  |--------------|----------------------|------------------------|  
  | **Entities** | Person (5) | Stick figure (circle head, line body, no gender cues). |  
  | | Tree (3) | Simple pine shape (triangle atop rectangle trunk). |  
  | | House (3) | Square base, triangle roof, rectangle door. |  
  | | Apple (3) | Circle with small stem curve. |  
  | | Fire (3) | Jagged upward lines (like flames). |  
  | | Rain (3) | Three parallel wavy lines. |  
  | | Sun (3) | Circle with 8 short rays (equal length). |  
  | | Book (3) | Rectangle with curved spine line. |  
  | **Actions/States** | Arrow → (2) | Straight arrow pointing right. |  
  | | Arrow ↑ (2) | Straight arrow pointing up. |  
  | | Arrow ↓ (2) | Straight arrow pointing down. |  
  | | Prohibition (2) | Red circle with diagonal slash (like 🚫; use bold red). |  
  | | Plus + (1) | Black plus sign. |  
  | | Minus - (1) | Black minus sign. |  
  | **Quantifiers** | Cluster ●●● (2) | Three small dots in triangular formation. |  
  | | Cluster ●●●●●● (2) | Six small dots in hexagonal formation. |  
  | | Empty ○ (2) | Hollow circle (outline only). |  
  | **Time** | Clock (1) | Circle with two lines at 3 o’clock and 12 o’clock (no numbers). |  
  | | Sun Rise (1) | Half-sun peeking above a horizontal line. |  
  | | Moon (1) | Crescent moon. |  
  | **Modals/Relations** | Chain Link (1) | Two interlocked circles. |  
  | | Broken Chain (1) | Two circles with a gap between them. |  
  | | Lightning Bolt (1) | Zigzag line (vertical). |  

  ---

  ### Activity Sequence (55 mins)  
  **Pairs:** Encoders (Pair A) and Decoders (Pair B). After each claim, roles rotate. Facilitator times each round (5 mins/claim) and scores.  

  #### Claims to Transmit (Graded Difficulty)  
  Encoders receive this list. Decoders *never* see it.  

  1. **Classification** (Easy):  
     *"There are three houses."*  
     - *Expected Success:* Stack 3 house cards. Decoders count and report.  
     - *Friction Point:* Pictures handle concrete counts well.  

  2. **Comparison of Magnitude** (Moderate):  
     *"More people than trees."*  
     - *Expected Attempt:* Place 3 person cards above 1 tree card, or use ↑ arrow pointing to people.  
     - *Friction Point:* Ambiguity! Decoders may think it’s a sequence ("people then trees") or miss comparison entirely.  

  3. **Partial Negation (Not-All)** (Hard):  
     *"Not all people have apples."*  
     - *Expected Attempt:* Place 3 person cards; add apples to 2, and prohibition symbol over apple for the third.  
     - *Friction Point:* Prohibition may be misread as "no apples allowed," not "some lack." Quantifier (●●●) might be misused.  

  4. **Trend Over Time** (Harder):  
     *"Rain decreased over time."*  
     - *Expected Attempt:* Sun Rise + 3 rain cards → Moon + 1 rain card, or rain cards with ↓ arrow.  
     - *Friction Point:* Time symbols are arbitrary. Decoders may see "morning rain and night rain," missing *change*.  

  5. **Causal Claim** (Hardest):  
     *"Fire causes houses to burn."*  
     - *Expected Attempt:* Fire card → Arrow → House card, or fire + chain link + house.  
     - *Friction Point:* "Causality" isn’t pictorial. Decoders see sequence ("fire then house") or juxtaposition ("fire and house").  

  **Scoring:** Encoders get 1 point if decoders report *exact* intended claim. Track scores visibly (e.g., whiteboard).  

  ---

  ### Meta Round: Grammar Emergence (20 mins)  
  After all claims, each pair collaborates to:  
  1. **Write Rules:** "For a stranger to decode your cards, what *conventions* must they know? How do you represent:  
     - Quantities?  
     - Comparisons?  
     - Negations?  
     - Time changes?  
     - Causes?"  
  2. **Reveal the Discovery:**  
     - Students realize their "rules" are a *grammar* (e.g., "↑ arrow means ‘more’ when between stacks").  
     - **Critical Insight:** Some "pictures" (e.g., prohibition, arrows) are *symbols* carrying abstract meaning, not just images.  

  ---

  ### Debrief (25 mins)  
  Map activity to Neurath’s ideas. Use Socratic questioning:  

  1. **Friction Moments → Neurath’s Program:**  
     - **Anti-Metaphysical Physicalism:** "You used cards to represent observable entities (houses, rain). Neurath insisted science must use *physical* signs (ISOTYPE) to avoid metaphysics. But when you encoded ‘not all’ or ‘causes,’ you hit walls. Why?"  
       → *Link:* Pictures alone can’t escape interpretation. Physicalism demands conventions (grammar) beyond observation.  
     - **Protocol-Sentence Dispute (vs. Carnap):** "Carnap wanted a ‘neutral’ observation language. Neurath said *all* language is theory-laden. When you wrote rules for ‘trend over time,’ did you create a ‘neutral’ system or impose theory?"  
       → *Link:* Your rules (e.g., "sun rise = past") are conventions, not pure pictures. Neurath: No neutral base; science is pragmatic negotiation.  
     - **ISOTYPE Choices:** "Why did we flatten perspective and suppress detail? Neurath did this for universality—anyone can recognize a tree, regardless of language. But what did we lose?"  
       → *Link:* We couldn’t show "burning" (needs detail) or "decrease" (needs perspective). ISOTYPE’s simplicity sacrifices precision for accessibility.  

  2. **Predictable Failures & Fixes:**  
     - **Failure 1:** Decoders misinterpret arrows (e.g., ↑ as "growth" not "more").  
       *Fix:* Highlight ambiguity in debrief—this reveals Neurath’s "friction."  
     - **Failure 2:** Negation/Causality claims score 0.  
       *Fix:* Celebrate! This shows why ISOTYPE avoided complex science. Ask: "Could you fix this with more cards? Neurath would say no—you’d need *more grammar*."  
     - **Failure 3:** Pairs develop conflicting rules (e.g., prohibition = "absence" vs. "ban").  
       *Fix:* Note how Carnap sought perfect rules; Neurath embraced "muddling through."  

  3. **Limitation of the Activity:**  
     - **What You Must Assert:** The activity shows *syntactic* friction (pictures needing grammar) but not Neurath’s *social encyclopedism*. Neurath saw ISOTYPE as a tool for democratic education—its "flaws" were political choices. Assert: "Neurath sacrificed precision for accessibility because science must serve society, not just experts."  

  ---

  **Logistical Notes:**  
  - **Prep:** Pre-draw card decks (paper + laminate). Test with a colleague to refine claims.  
  - **Time Buffer:** End meta round at 75 mins; debrief at 80 mins.  
  - **No Readings:** Context given verbally. If pressed, assign Neurath’s "Visual Education" post-session.  

  **Why This Works:** Students *feel* the gap between Neurath’s ambition (pictures as theory-neutral) and reality (grammar is unavoidable). The "grammar discovery" mirrors Neurath’s pragmatism—and the debrief ties friction to Vienna Circle debates.
