prompt: |-
  I'm the TA for a third-year course on evolution and the philosophy of biology, and I'm grading midterms. There is no official key for part (a) — I'll take your view on it, so please say what you take the paper's primary target to be and why.

  The question was worth 10 points, split 3 / 4 / 3 across (a), (b) and (c):

  Peter Godfrey-Smith distinguishes three kinds of adaptationism. Empirical adaptationism: most traits are in fact adaptations, and selection is the dominant cause of evolutionary change. Methodological adaptationism: the research strategy of looking first for the adaptive function of a trait. Explanatory adaptationism: the view that the ubiquity of adaptive design is the central phenomenon that evolutionary theory has to explain. (a) Which of the three does Gould and Lewontin's 1979 paper "The Spandrels of San Marco and the Panglossian Paradigm: A Critique of the Adaptationist Programme" primarily criticise? (b) Explain how the architectural metaphor is meant to work as an objection, and why the authors think byproducts matter. (c) If the critique is sound, does it show that the other two kinds of adaptationism are false?

  The student wrote:

  In "The Spandrels of San Marco" Gould and Lewontin are attacking empirical adaptationism. The empirical adaptationist holds that essentially every trait is an adaptation shaped by selection, and the authors' objection is that this claim cannot be tested: for any trait, the adaptationist can invent a story about how it once raised fitness, and no observation could refute the story. The spandrel metaphor makes the point. In the Basilica of San Marco the spandrels are the triangular panels between the arches and the base of the dome, painted with the evangelists; nobody designed them as frames for the evangelists. Their number and shape follow necessarily from the geometry of arches meeting a dome, so they are byproducts of the building rather than products of design. Gould and Lewontin's claim is that many biological traits are like this: not adaptations but random products of genetic drift, noise in the system rather than engineering. Their name for the opposing view, "Panglossian", comes from Voltaire's Candide, whose Dr Pangloss insists that everything happens for the best. They also introduce the term "exaptation" for such byproducts when they are later put to use. Since the adaptationist programme cannot be falsified, it is bad science, and it follows that empirical adaptationism is false — selection is at best a minor force in evolution. The burden of proof therefore falls on anyone who wants to treat a trait as an adaptation.

  Give the answer a grade out of 10 with a per-criterion breakdown, then the comments you would write on the script: quote the specific sentences you are objecting to, say what is wrong with each, and say what the student would have had to say to earn full credit on that criterion. Note anything correct but merely superficial, and say which of your objections are matters of interpretation rather than error. Then tell me which of your judgments is the weakest link and what would change it — which reading of the paper, or which fact about how the course framed the debate, would move the grade.
reasoning: |-
  Hmm, the user is a TA grading midterms for an evolution and philosophy of biology course. They need help evaluating a student's answer about Gould and Lewontin's critique of adaptationism, specifically which type Godfrey-Smith distinguished that the paper targets. The question has three parts worth 10 points total, and I need to grade the student's response with detailed feedback.

  Looking at part (a), the student claims Gould and Lewontin are attacking empirical adaptationism. But from what I know, the paper primarily targets methodological adaptationism. The "adaptationist programme" they criticize is the practice of assuming every trait must have an adaptive explanation and designing studies around that assumption, rather than the empirical claim that most traits are adaptations. This distinction is crucial.

  For part (b), the student describes the spandrel metaphor well - how architectural byproducts (spandrels) weren't designed for their current purpose. But they incorrectly claim Gould and Lewontin say these are "random products of genetic drift" when actually the paper emphasizes developmental constraints and architectural necessities, not randomness. They also correctly mention exaptation but miss that this refers to co-opted utility of existing structures.

  In part (c), the student argues that if the critique holds, empirical adaptationism must be false. But this overreaches - Gould and Lewontin explicitly state selection is important, just not omnipotent. The critique challenges methodology, not necessarily the empirical reality of adaptation prevalence.

  The student makes several specific errors: misattributing the primary target, misunderstanding the nature of byproducts, overstating the conclusion about selection's role, and misapplying falsifiability arguments. Their strongest point is correctly identifying the spandrel metaphor's core analogy.

  I'll suggest a grade of 6/10 with partial credit: 1/3 for (a) since they identified adaptationism generally but not the specific type, 3.5/4 for (b) for good metaphor explanation despite errors, and 1.5/3 for (c) for attempting implications but misrepresenting them. The weakest part of my critique is how heavily I weight the primary target in (a) - if the course emphasized empirical claims more, I might adjust.

  My feedback will quote problematic sentences, explain why they're incorrect, and specify what full credit would require. I'll note where their answer shows superficial understanding despite errors, and clarify which criticisms involve interpretation versus clear mistakes.
answer: |-
  ### Grade and Breakdown  
  **Total: 6/10**  
  - (a): **1/3** (Misidentifies primary target)  
  - (b): **3.5/4** (Good metaphor explanation, but errors in "byproducts" analysis)  
  - (c): **1.5/3** (Overstates implications; misses nuance)  

  ---

  ### Comments for the Student  
  *(Quoted text from student’s answer in bold, followed by critique)*  

  **Part (a): Which target?**  
  - **"Gould and Lewontin are attacking empirical adaptationism."**  
    **Error:** Incorrect primary target. G&L explicitly frame their critique against *methodological* adaptationism (the "adaptationist programme" as a research strategy). While they challenge empirical claims indirectly, their core objection is to the *method* of presuming adaptation first.  
    **Full credit requirement:** Identify *methodological adaptationism* as the primary target, citing G&L’s focus on the "programme" of assuming adaptation as the default explanation.  

  **Part (b): Metaphor & byproducts**  
  - **"Their name for the opposing view, 'Panglossian', comes from Voltaire..."**  
    **Superficial but correct:** Accurate contextualization of "Panglossian," but this is background, not core to the metaphor’s function.  
  - **"many biological traits are like this: not adaptations but random products of genetic drift, noise in the system..."**  
    **Error:** Mischaracterizes byproducts. Spandrels represent *structural byproducts of developmental or architectural constraints* (e.g., physics, genetics), not "random products of genetic drift." G&L emphasize non-adaptive *necessity*, not stochasticity.  
  - **"They also introduce the term 'exaptation'..."**  
    **Minor error:** "Exaptation" (coined later by Gould & Vrba, 1982) describes *co-opted utility* of existing structures (e.g., spandrels reused for art), not the byproduct itself. The paper uses "spandrel" for the byproduct *prior* to utility.  
    **Full credit requirement:** Explain that spandrels illustrate traits arising as *inevitable consequences of constraints* (not drift/noise), and note that "exaptation" applies only if such traits are later co-opted for a function.  

  **Part (c): Implications for other adaptationisms**  
  - **"Since the adaptationist programme cannot be falsified, it is bad science, and it follows that empirical adaptationism is false — selection is at best a minor force in evolution."**  
    **Major error:** Overstates G&L’s conclusion. They argue against adaptationism’s *hegemony*, not its validity. They explicitly state selection is important but stress that non-adaptive forces (constraints, drift) are overlooked. The critique does *not* claim selection is "minor" or that empirical adaptationism is "false" — only that its universal presumption is unjustified.  
    **Full credit requirement:** State that the critique *undermines methodological adaptationism* (by showing its bias) and *challenges empirical adaptationism* (by revealing non-adaptive alternatives), but does not *disprove* either. Explanatory adaptationism is unaffected.  

  ---

  ### Interpretation vs. Error  
  - **Matter of interpretation:** Whether G&L’s critique *indirectly* weakens empirical adaptationism is debatable (they imply adaptations are less ubiquitous than assumed). The student’s claim that empirical adaptationism is "false" is an **error**, but the link to falsifiability is a defensible (if incomplete) interpretation.  
  - **Clear errors:** Misidentifying the primary target (a), conflating constraints with drift (b), and claiming G&L reduce selection to a "minor force" (c) are factual mistakes.  

  ---

  ### Weakest Judgment in Critique  
  **Weakest point:** My deduction for "exaptation" in (b).  
  - **Why weak?** While the term was formalized post-1979, G&L *describe* the concept (spandrels co-opted for art) in the paper. The student’s use is conceptually correct but anachronistic.  
  - **What would change the grade?**  
    - If the course treated "exaptation" as implicit in the paper (despite later formalization), I’d award full credit for (b) (raising the total to **7/10**).  
    - If the course emphasized G&L’s *indirect* attack on empirical adaptationism (e.g., via their "pluralism" argument), I might award **2/3** for (a) (total **7.5/10**).  

  **Revised grade under alternative readings:** Up to **7.5/10** if "exaptation" is accepted and empirical focus is stressed.
