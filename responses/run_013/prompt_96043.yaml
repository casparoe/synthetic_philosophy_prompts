  ### Joint Statement on Gödel's Incompleteness Theorems  
  *Agreed by Mechanist (M) and Anti-Mechanist (AM)*  

  #### 1. Agreed Claims  
  1. **Core Theorems**:  
     - First Incompleteness: For any consistent, recursively axiomatizable formal system \(T\) capable of expressing elementary arithmetic, there exists a sentence \(G_T\) (the Gödel sentence) such that \(T\) can neither prove nor refute \(G_T\), and \(G_T\) is true in the standard model of arithmetic.  
     - Second Incompleteness: Such a system \(T\) cannot prove its own consistency (\(\text{Con}(T)\)), assuming \(T\) is consistent.  

  2. **What the Theorems Do Not Say**:  
     - **Math is not arbitrary**: Truth values of arithmetic statements (e.g., \(G_T\)) are objective; incompleteness arises from formalization constraints, not subjectivity.  
     - **Humans are not proven inconsistent**: The theorems do not demonstrate human inconsistency; they address limitations of formal systems.  
     - **Machines can prove \(G_T\)**: A machine implementing \(T\) can prove \(G_T\) in a stronger system (e.g., \(T + \text{Con}(T)\)).  

  3. **Idealization of "Human Mathematician"**:  
     - Both sides acknowledge that actual humans are fallible, finite, and error-prone. Debates about implications rely on an *idealized human mathematician* (IHM), defined as:  
       - Capable of recognizing arithmetical truths in principle (given sufficient resources).  
       - Consistent and sound for arithmetic (if idealized).  
     - Neither side asserts actual humans *are* IHM, but disagree on whether IHM is a coherent/productive idealization for the argument.  

  #### 2. Disagreements Table  
  | Issue | Mechanist’s Wording | Anti-Mechanist’s Wording |  
  |-------|----------------------|--------------------------|  
  | **Legitimacy of IHM** | "IHM is a vague, anthropomorphic idealization. Actual human reasoning is probabilistic and error-prone; IHM smuggles non-algorithmic assumptions." | "IHM is a defensible idealization capturing human *capacity* to grasp mathematical truth. Incompleteness reveals limitations inherent to formalisms, which IHM transcends." |  
  | **Soundness requirement** | "The Gödelian argument *requires* assuming both machine and human are sound. But humans aren’t reliably sound; machines can be designed for soundness (e.g., via proof verifiers)." | "The argument hinges on consistency, not soundness. IHM’s *recognition* of \(G_T\)’s truth is immediate; machines lack truth-aware insight, needing external axioms." |  
  | **Cost of stronger theories** | "Moving to \(T + \text{Con}(T)\) is costless for both: humans learn new axioms non-magically; machines update via algorithmic rules. No asymmetry exists." | "Humans *intuit* \(\text{Con}(T)\)’s truth via understanding, incurring no ‘formal cost.’ Machines pay an epistemic cost: they can’t *justify* \(\text{Con}(T)\) internally." |  
  | **Target of conclusion** | "Incompleteness constrains *all* consistent, recursively axiomatizable systems—not ‘machines’ per se. Human cognition may use non-recursive or evolving algorithms." | "The theorems show *any* algorithmic system (i.e., machine) is incomplete. IHM’s ability to ‘outrun’ formalisms implies non-algorithmic cognition." |  

  #### 3. Cruxes: Shared Evidence and Predictions  
  **Crux A: IHM’s claim "I am sound" in \(T + \text{Con}(T)\)**  
  - **Shared Evidence**:  
    - A machine in \(T\) cannot prove \(\text{Con}(T)\) (Second Theorem).  
    - A human in \(T\) who asserts "I am sound" adopts \(T + \text{Con}(T)\), claiming \(\text{Con}(T)\) is true.  
  - **Mechanist Prediction**:  
    - Human assertion is *not* knowledge: it’s a fallible empirical hypothesis (humans err). Machine matches this by adding \(\text{Con}(T)\) as an axiom—both are equally "wishful."  
  - **Anti-Mechanist Prediction**:  
    - Human assertion reflects *a priori insight*. Machine can’t match this: adding \(\text{Con}(T)\) is rote; it lacks understanding of truth that justifies the move.  

  **Crux B: Epistemic cost of stronger theories**  
  - **Shared Evidence**:  
    - Both humans and machines can work in \(T + \text{Con}(T)\) to prove \(G_T\).  
  - **Mechanist Prediction**:  
    - No cost asymmetry: humans use heuristics/analogy; machines use algorithmic expansion (e.g., trial-and-error). Both extend knowledge pragmatically.  
  - **Anti-Mechanist Prediction**:  
    - Human transition is guided by truth perception (e.g., seeing \(T\)’s soundness), incurring no *new* formal burden. Machines incur "justificatory debt": \(\text{Con}(T)\) remains ungrounded.  

  **Crux C: Scope of "algorithmic"**  
  - **Shared Evidence**:  
    - Incompleteness applies to systems meeting specific criteria (consistent, recursively axiomatized, arithmetically adequate).  
  - **Mechanist Prediction**:  
    - Human cognition may use probabilistic, parallel, or adaptive algorithms not reducible to a *fixed* formal system. Theorems are silent here.  
  - **Anti-Mechanist Prediction**:  
    - If cognition were algorithmic, it would be captured by *some* formal system. IHM’s ability to validate \(\text{Con}(T)\) for any such system defies encapsulation.  

  #### 4. Verbal Dispute  
  - **Issue**: The term "machine."  
  - **Why verbal**:  
    - **Mechanist**: Uses "machine" to mean *any physical system* (including brains) governed by computable laws. Incompleteness only rules out *fixed* formal systems, not evolving/oracular machines.  
    - **Anti-Mechanist**: Uses "machine" as *recursively axiomatizable formal system*. Argues IHM’s flexibility can’t be modeled this way.  
  - **Resolution**: Agreed that incompleteness directly constrains *formal systems*, not "machines" in a broader sense. Dispute hinges on whether human cognition qualifies as a formal system.  

