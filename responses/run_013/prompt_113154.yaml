prompt: |-
  I clerk for a standing advisory panel that hears self-determination disputes — we issue non-binding opinions, no enforcement, but governments actually read them. I'm drafting the memo for next month's hearing and I want a prediction plus the reasoning underneath it, because our own reasoning is a mess. The track record:

  Ravonia, 1998. Distinct language, compact territory, sitting inside a working democracy — free elections, free press, no repression to speak of. Held it's own referendum anyway, 61% for independence, declared. We said the declaration had no legal effect and the capital had no duty to negotiate. The opinion kept circling back to the fact that nobody had agreed to any of it, and that the region hadn't tried the constitutional route first.

  Kesh, 2003. Same shape, except the capital had spent thirty years banning the language, banning the parties, closing the universities, and shooting marchers. Unilateral referendum, declaration. We said the claim was valid and the state's refusal to negotiate was the violation. We were explicit that the entitlement came from the pattern of exclusion, not from the vote total.

  Marek, 2007. The government had signed a formal, ratified agreement with the region: a referendum on a fixed question, and a promise to implement whatever came out. It carried. The government then found a procedural excuse and refused. We said the refusal was the violation, and the region's unilateral steps afterward were justified — justified because the agreement was there, that's how we put it. We spent pages on the text and the ratification.

  Twin Valleys, 2011. The lower valley had just seceded from a larger state (we blessed that one). The upper valley, different language, had voted 74% against the secession, and now wanted out of the new state. We said no: the new state's borders were the unit that had exercised the right, and you don't run the same exercise again from inside it. Nobody in the opinion could say where that principle stops.

  The Doria, 2014. A people spread across four provinces, no majority anywhere, no seperate territory they'd call home. We said internal self-government — language, schools, local government — and no territorial claim at all.

  Next month, Velland. One compact province, its own language, outvoted in every national election for forty years — but genuinely outvoted: their MPs sit in parliament, their schools are funded, their press is free, nobody's in jail. In 2019 their parties got a signed "declaration of intent" out of the governing coalition, PM's signature and the provincial premier's, promising a referendum on a fixed question. It was never put to parliament as a treaty and the enabling bill died in committee twice. Last spring the province went ahead anyway: 58% yes, turnout 71%, 12% spoiled. The coastal strip of the province, different language, voted 71% no and has said it won't be part of any new state.

  So: what do we do with Velland, which precedents are actually carrying the weight, what are all the rules that fit our five opinions equally well, what does each one say about Velland, which one do you think we're really running, and what case — or what single fact about Velland, flipped — would force us to choose between them?
reasoning: |-
  Okay, the user is a clerk for an advisory panel on self-determination disputes, and they need help drafting a memo for the Velland case. They provided five precedents and want a prediction with reasoning, plus how each precedent applies. Let me start by understanding each case.

  First, Ravonia (1998): Compact territory, distinct language, working democracy. Referendum without constitutional route. Panel said no legal effect because no agreement and didn't try constitutional methods. So, process matters even in a democracy.

  Kesh (2003): Similar but with repression—banned language, violence. Panel approved because of exclusion and oppression. The violation was the state's refusal to negotiate. Here, human rights abuses triggered the right to secede.

  Marek (2007): There was a formal agreement for a referendum, which the government ignored. Panel said refusal was a violation, and unilateral steps were justified because of the broken agreement. So, prior agreements create obligations.

  Twin Valleys (2011): After secession, a sub-region wanted out. Panel denied, saying the initial secession unit is the new state's border, and you can't re-secede from within. But the limits of this principle aren't defined.

  Doria (2014): Dispersed group without a territory. Only internal self-government, no territorial claim. Territorial compactness is key for secession.

  Now, Velland: Compact province, distinct language, outvoted but no repression. They have a signed declaration of intent for a referendum, but it wasn't ratified. They held a unilateral referendum: 58% yes, 12% spoiled. Coastal strip voted no and wants to stay.

  The key issues are: Does the unratified declaration create an obligation like Marek? Unlike Marek, it wasn't ratified. Also, no repression like in Kesh. The coastal strip complicates territorial integrity.

  Applying precedents: Ravonia says no because no constitutional attempt. But Velland tried via the declaration, though it failed. Kesh doesn't apply because no oppression. Marek is the closest, but the agreement wasn't formalized. Twin Valleys suggests the coastal strip might not be forced into secession. Doria reinforces the need for a compact territory.

  The panel might lean on Marek but note the agreement wasn't binding. The coastal strip issue could lead to a conditional opinion: if Velland secedes, the strip stays. But the panel might avoid blessing the referendum due to lack of ratification and procedure.

  Underlying tensions: When does a political promise become binding? How to handle sub-regions? The unspoiled vote total (58% of 88% valid) is 51%, which is slim. Flipping the coastal strip's existence or getting a clear majority might change things. If the agreement was ratified, it'd be like Marek. If there was repression, it'd be like Kesh.

  Prediction: The declaration isn't binding, so no duty to negotiate. But criticize the government for not honoring the intent. Coastal strip can't be forced. So, no secession justified, but urge negotiations.
answer: |-
  Based on the panel's precedents and the Velland facts, here's the prediction, reasoning, precedent analysis, underlying rules, and critical tensions:

  **Prediction:** The panel will find **no valid entitlement to independence** or duty to negotiate based on the unilateral referendum. It will emphasize the *lack of a binding agreement* (distinguishing it from Marek) and the *absence of repression* (distinguishing it from Kesh), while criticizing the capital for failing to honor the political commitment. It will likely stress the *coastal strip's objection* as a fatal flaw for territorial integrity under the Twin Valleys principle. The core violation will be the capital's bad faith in signing but sabotaging the declaration, but this won't create a *secession* right.

  **Reasoning Structure (Predicted for the Memo):**
  1.  **No Kesh-Grounds:** Velland lacks the severe, systemic repression (banned language, violence) that created an *inherent* right in Kesh. Participation in democracy negates this path.
  2.  **Marek's Promise Unfulfilled:** The "declaration of intent" lacked Marek's critical elements: formal ratification and implementation legislation. It remained a *political promise*, not a binding legal agreement. The capital's sabotage (killing bills) is condemned but doesn't elevate the promise to Marek's level.
  3.  **Ravonia's Process Matters:** Like Ravonia, Velland bypassed established constitutional channels without justification (unlike Kesh's repression). The unilateral referendum lacks inherent legal weight.
  4.  **Twin Valleys' Territorial Integrity Applies:** The coastal strip's distinct identity and overwhelming (71%) rejection of secession mirrors Upper Twin Valleys. Forcing it into a new state violates the principle that sub-units within the seceding entity have a right to remain. Velland province is not a "clean" unit.
  5.  **Referendum Deficiencies:** The 12% spoiled ballots and the narrow *effective majority* (58% of 88% valid = 51%) on a unilateral vote undermine its legitimacy as an expression of clear will, especially absent a prior agreement or repression.
  6.  **Remedy:** The panel condemns the capital's bad faith regarding the declaration and urges good-faith negotiations on *enhanced autonomy* (invoking Doria's internal solution), but finds no legal basis for secession or a duty to recognize the referendum.

  **Precedent Application to Velland:**

  | Precedent | Key Principle for Velland | How it Applies/Contrasts |
  | :--------- | :------------------------ | :--------------------------------------------- |
  | **Ravonia (1998)** | Unilateral referendums in functioning democracies without constitutional process lack legal effect. | **Directly applies:** Velland held a unilateral ref in a democracy without exhausting constitutional routes. Undercuts the referendum's weight. |
  | **Kesh (2003)** | Severe, systematic repression creates an inherent right to self-determination justifying unilateral action. | **Distinguishes:** Velland lacks repression; participation exists. Negates the "entitlement from exclusion" argument. |
  | **Marek (2007)** | A formal, ratified agreement creates a binding obligation; violating it justifies unilateral steps. | **Crucial but distinguishes:** The declaration was political, not ratified/binding like Marek's treaty. Capital's bad faith is condemned, but doesn't create the *same* obligation. |
  | **Twin Valleys (2011)** | The seceding unit's borders are fixed upon secession; sub-units cannot immediately re-run the process. | **Applies to Coastal Strip:** The strip's rejection means Velland province isn't a cohesive unit. Secession would force an unwilling sub-region out, violating TV's core logic. |
  | **Doria (2014)** | Non-territorial groups get internal solutions, not territorial secession. | **Reinforces:** Velland *is* territorial, but the strip conflict highlights internal governance needs within the province *or* state as a fallback. |

  **Underlying Rules Synthesized from Precedents:**
  1.  **Process Legitimacy:** Unilateral secession is presumptively invalid in a functioning democracy unless preceded by a *binding agreement* (Marek) or justified by *severe repression* (Kesh).
  2.  **Agreements are Paramount:** Signed, ratified agreements create enforceable obligations. Political promises do not.
  3.  **Repression Creates Entitlement:** A sustained pattern of exclusion/violence against a territorial group creates an inherent right to secede, making unilateral action *self-defense*.
  4.  **Territorial Cohesion is Required:** The seceding unit must be a clear, distinct territory. Sub-units with a distinct identity and overwhelming opposition cannot be forcibly removed (Twin Valleys). Non-territorial groups get internal autonomy only (Doria).
  5.  **Constitutional Primacy:** Groups must attempt to use existing constitutional mechanisms first, absent repression or a prior agreement (Ravonia).
  6.  **Referendum Validity:** A referendum's legitimacy depends on prior agreement, absence of repression, procedural regularity, clear majority, and territorial cohesion.

  **Which Precedent is "Really Running" Velland?**
  **Twin Valleys** is likely the dominant precedent. The **coastal strip objection** creates an insurmountable problem under TV's logic, making it impossible for the panel to bless Velland's secession as a whole unit. Even if the Marek argument had succeeded (which it likely won't due to lack of ratification), the strip issue would force a partition or invalidate the claim – an outcome the panel avoids based on TV's "fixed borders" principle. Ravonia reinforces the process failure, but TV provides the structural barrier.

  **The Case/Fact That Forces a Choice:**
  *   **The Critical Flip: Ratification of the Agreement.** If the declaration had been **formally ratified by parliament as a treaty** (like Marek), the panel would face a direct conflict:
      *   **Marek vs. Twin Valleys:** Marek's "binding agreement violated" principle would demand recognizing the referendum and justifying secession. Twin Valleys' "fixed borders" principle would demand protecting the coastal strip, potentially invalidating the referendum result for the *entire* province or requiring partition (which the panel historically avoids).
      *   **The Conflict:** Does a binding agreement *override* the territorial cohesion principle when a sub-unit objects? Marek didn't face this sub-unit issue. Twin Valleys involved a *new* state, not a broken agreement. Velland would force a choice: uphold the agreement (Marek) and risk fragmenting the territory or sacrificing the strip's rights, or uphold territorial integrity (Twin Valleys) and negate the agreement's consequence.
      *   **Likely Outcome:** The panel would likely *still* prioritize Twin Valleys, finding the agreement required implementation *only if* the seceding unit was cohesive. It might bless the referendum *except* for the coastal strip, creating a de facto partition obligation – an outcome the panel has avoided but which this flip would force. Alternatively, it could strictly apply Twin Valleys and say the agreement applied only to the *original* province unit, which no longer exists cohesively, thus voiding the obligation – a messy but precedential choice.

  **Recommendation for Memo:**
  Focus the analysis on the **lack of a binding Marek-type agreement** and the **fatal territorial incoherence caused by the coastal strip under Twin Valleys**. Explicitly contrast the absence of Kesh-repression and the Ravonia-process failure. Acknowledge the capital's bad faith but frame it as a political failing, not a legal basis for secession. Emphasize that Velland exposes a gap: unfulfilled political promises in democracies without repression leave groups without a clear path, pushing them towards destabilizing unilateral actions – urging negotiation for enhanced autonomy (Doria+) is the panel's most consistent, if imperfect, remedy here. Prepare for internal debate on whether the *scale* of democratic exclusion (40 years outvoted) edges towards Kesh-lite, but precedent suggests it won't suffice without active repression.
