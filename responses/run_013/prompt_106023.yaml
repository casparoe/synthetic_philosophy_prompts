prompt: |-
  I am a retired physical scientist who has spent the last several years reading economics and its philosophy, and I keep meeting a defence of the standard model of choice that I would like you to audit. The defence runs roughly as follows. The perfectly rational expected-utility maximizer stands to actual human deciding as a frictionless plane stands to real surfaces in mechanics: no real plane is frictionless, but the idealization is what lets one isolate the core dynamics, after which friction is added back as a correction term. By this light, satisficing, fast-and-frugal heuristics, and the rest of what goes under bounded rationality are friction — small, second-order departures from an account of the agent that is essentially right.

  Please assess how far the analogy holds, treating it as an argument rather than a picture. Give me exactly five numbered items, each one or two sentences, with no introduction and no conclusion: first, the correspondence, stating what plays the role of the plane, the friction, the core dynamics, the correction term, and — since a physicist would ask — the coefficient by which the friction is measured; second, the disanalogies that genuinely bear on the use to which the analogy is put, namely licensing the rational core and demoting bounded rationality to a correction; third, the apparent disanalogies that turn out not to matter; fourth, whether the conclusion the analogy is meant to support survives once the load-bearing disanalogies are on the table; and fifth, a better analogy, drawn if you can from a regime in which a qualitatively new theory is required rather than a perturbation of the old one, or else a clear reason why no better analogy is available.
reasoning: |-
  Okay, let me approach this systematically. The user presents an intricate analogy between physics and economics that needs auditing, specifically addressing how well the frictionless plane corresponds to rational choice theory versus bounded rationality. 

  First, breaking down the requested five-point structure: I need to map the analogy components precisely - identifying what represents the plane, friction, core dynamics, correction term, and friction coefficient in economic terms. The user being a retired physical scientist means I should maintain technical precision while avoiding oversimplification.

  Considering the key disanalogies, I recall that utility maximization isn't empirically observed like Newtonian mechanics, and cognitive biases aren't as predictable as friction coefficients. The user's mention of "demoting bounded rationality" suggests they suspect this analogy might undervalue alternative models - I should highlight how systematic deviations challenge the core theory's validity.

  For non-problematic disanalogies, I note that while the domains differ (physical vs behavioral), the methodological purpose of idealizations remains valid across sciences. The user's background in philosophy of economics likely makes them receptive to this epistemological point.

  Assessing whether the conclusion holds, I realize the analogy fails exactly where it matters most: when the "corrections" fundamentally alter the core model's predictive power. This addresses the user's implied concern about whether bounded rationality is merely peripheral.

  Finally, for a better analogy, quantum mechanics comes to mind - not as direct parallel but as example where new framework was needed. The user's request for "qualitatively new theory" examples suggests they're open to paradigm shifts beyond incremental adjustments.

  Throughout, I'll maintain conciseness per the numbered format request, trusting the user's expertise will fill in nuances. The tone should respect their scientific rigor while challenging the analogy's weak points.
answer: |-
  1. **Correspondence**: The rational expected-utility maximizer is the frictionless plane; bounded rationality (satisficing, heuristics) is friction; utility maximization under constraints is the core dynamics; behavioral adjustments are the correction term; the "coefficient" is context-dependent (e.g., cognitive load scaling error magnitude).  

  2. **Load-bearing disanalogies**: Friction is law-governed and predictable, while cognitive biases are systematic and context-dependent *deviations* from rationality that often dominate choices (e.g., framing effects reversing preferences), undermining the "core" as empirically accurate or isolatable.  

  3. **Non-load-bearing disanalogies**: Unlike physics, economics lacks universal constants—but this doesn’t invalidate idealization *methodologically*; the purpose (isolating key mechanisms via abstraction) holds despite domain differences.  

  4. **Conclusion survivability**: The analogy fails to license the rational core as "essentially right" because bounded rationality often *qualitatively* alters outcomes (e.g., preference intransitivity, market bubbles), making deviations foundational, not peripheral corrections.  

  5. **Better analogy**: Quantum mechanics superseding classical mechanics: expected utility is classical mechanics (accurate at "large scales"/simple choices), but bounded rationality requires a "quantum" framework (e.g., quantum cognition models) where probability axioms themselves are violated, demanding new axioms.
