prompt: |-
  ok so there's a thing I keep bumping into and I want your help pulling out what it assumes.

  When a famine happens, the whole international response runs in one register: it gets handled like a natural disaster. Appeals go out the way they do after an earthquake, agencies airlift food in, and the people on the ground very deliberately don't name whoever caused it — because the government that diverted the food or wrecked the farms is also the government that controlls access to the people starving. Neutrality is the price of admission. Then the exact same event gets described in completely different language in other rooms. Historians talk about relief policy in Ireland, about collectivization in China. Sen's whole thing about Bengal was that the food supply wasn't really the story, the story was who could actually get at food. And international criminal law now treats deliberately starving civilians in wartime as a war crime. There's a further wrinkle too: the word "famine" only gets applied once the mortality numbers have already crossed a threshold, so it's a label you earn after the fact, and in practice getting it applied tends to depend on the cooperation of the government in question — which is a bit rich when that government is part of why it's happening.

  So what does the practice actually presuppose? Give me exactly five numbered points, a sentence or two each, no intro and no conclusion:

  1. what view of the line between natural and political causation the whole arrangement commits you to;
  2. which rival views it genuinely rules out, as opposed to what it merely happens to fit comfortably with — i.e. where is it underdetermined?
  3. whether the neutrality norm and the war-crimes norm can be held at the same time by the same person without incoherence, or whether that's just compartmentalization;
  4. what it presupposes about the relationship between explaining a famine and blaming someone for it;
  5. what would have to change if we dropped the presupposition and treated every famine as a political event from day one.
reasoning: |-
  Okay, the user is presenting a fascinating analysis of famine response frameworks. They've clearly noticed a major disconnect between how famines are treated operationally versus analytically. 

  First, I need to unpack their core observation: humanitarian agencies approach famines as natural disasters requiring neutrality, while historians and legal frameworks treat them as political events. The mortality threshold requirement adds another layer of complexity since it requires government cooperation - often from the very actors implicated in causing the famine.

  The user wants exactly five presuppositions extracted. Let me structure this carefully. For point 1 about natural vs political causation: the current system presupposes a clean separation where immediate response requires treating it as natural, reserving political analysis for later. This maintains humanitarian access but ignores how political factors create vulnerability before the crisis.

  On point 2 about rival views: the system accommodates both perspectives sequentially but rules out seeing famines as inherently political during the emergency phase. It's designed for neutrality, not because political causes don't exist, but because acknowledging them would compromise access.

  For point 3 on neutrality vs war crimes: these can coexist through temporal sequencing - neutrality during crisis, accountability afterward. But this requires compartmentalization since the same actor (like a state) causing starvation is also granting access.

  Point 4 about explanation vs blame: the system presupposes they're separable - agencies explain starvation through apolitical mechanisms while leaving blame to others. But this ignores how the explanation itself (e.g. "food shortage") may conceal political choices.

  Finally for point 5 on treating all famines as political: this would require rethinking humanitarian access models, earlier legal interventions, and famine classification systems not dependent on perpetrator cooperation. It challenges the entire emergency-response paradigm.

  The user seems frustrated with systemic hypocrisy. They're likely looking for validation that the neutrality framework contains inherent contradictions when applied to politically-induced famines. Their request for "what it presupposes" suggests they want to expose these underlying tensions rather than just describe them.
answer: |-
  Here are the five presuppositions:

  1.  **Separation of Causation:** It presupposes that immediate humanitarian response requires bracketing political causation as a distinct, secondary layer to be addressed separately (if ever) after addressing the supposedly "natural" or technical crisis of food shortage and starvation.
  2.  **Exclusion of Inherently Political Frameworks:** It rules out the view that famines *are fundamentally and always political events* (even when triggered by natural phenomena) during the operational response phase. It accommodates, but does not require, later political analysis; it merely mandates neutrality *at the onset and height* of crisis management.
  3.  **Compartmentalization over Coherence:** The neutrality norm and war-crimes norm can be held simultaneously primarily through temporal and functional compartmentalization: neutrality governs *operational access during the crisis*, while legal accountability operates *after the fact* or in different forums. Strict logical coherence is sacrificed for pragmatic access.
  4.  **Neutrality of Explanation:** It presupposes that explaining the famine's proximate mechanisms (e.g., food distribution failure, crop loss) can and should be functionally separated from attributing blame for those mechanisms during the emergency response. Explanation is treated as a neutral technical act distinct from assigning responsibility.
  5.  **Radical Restructuring of Access and Response:** Treating every famine as political from day one would necessitate fundamentally different mechanisms for humanitarian access (potentially bypassing or coercing perpetrator states), earlier and more overt political/legal pressure during the crisis, and decoupling famine declaration from the cooperation of the responsible government.
