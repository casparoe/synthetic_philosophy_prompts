answer: |-
  Here is the numbered list addressing your query:

  1.  **The passage dismantles the logic of extreme deterrence:** Diodotus argues that escalating punishments (culminating in death) demonstrably fail to deter crimes driven by fundamental human drives (necessity, ambition, passion, hope, cupidity) and external factors (fortune, collective action); severity is therefore irrational and useless as a preventative strategy in such cases.
  2.  **It establishes the impossibility of perfect prevention, not all deterrence:** Diodotus states it's impossible to *prevent* human nature from pursuing its aims via law/deterrence *once set upon a course*, implicitly allowing that milder deterrents might still influence behavior *before* that point or for less overwhelming motives.
  3.  **This frames the debate solely in terms of Athenian self-interest:** By demonstrating the futility and counter-productivity of mass execution as a deterrent (it breeds resentment, wastes resources, harms future revenue), Diodotus forces the assembly to evaluate the decision purely on grounds of Athenian advantage ("usefulness"), explicitly sidelining abstract justice.
  4.  **The argument directly supports punishing only ringleaders:** Diodotus contends that while mass punishment fails to deter future revolts driven by universal passions, punishing only the actual instigators (who bear specific responsibility) is strategically sound: it maintains deterrence against *leadership* of revolt without alienating the potentially useful majority population needed for future tribute and alliance stability.
  5.  **Your friend's reading is partially correct but overstates the concession:** The passage *does* strategically shift focus from justice to utility, acknowledging the revolt's gravity implicitly. However, it does *not* concede the Mytilenians "deserved to die"; instead, it argues that *acting* on that desert via mass execution is counterproductive folly given human nature and Athenian interests, making utility the only viable decision-making criterion in this context.
