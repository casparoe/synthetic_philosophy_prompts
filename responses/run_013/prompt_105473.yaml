prompt: |-
  I've been reading rationalist blogs and forums for years, and there's a move I keep running into: in a thread about what a person, an institution, or a trained model "really" values, someone says to just look at the revealed preferences — the choices are the utility function, and anything the agent says about its own values is confabulation layered on top. I want to know what that one-liner could actually be asserting, because I suspect it slides between a nearly vacuous bookkeeping convention and a very strong substantive claim about welfare. I gather that on one reading, any sufficiently consistent pattern of choices can be described as maximizing some ranking, which would make the slogan close to unfalsifiable as a thesis about minds; yet it gets used as though it settled a question about what is good for someone. Lay out the distinct precise theses "revealed preference" might stand for: what a preference is on each reading, whether it is defined by choice or merely inferred from it, what would have to be true for the reading to hold, and how each reading handles cases where choices seem to run against the agent's own stated values — akrasia, addiction, preferences shaped by manipulation or by scarcity, and the awkward case of an agent whose choices are simply inconsistent. Say which readings are trivial, which are substantive and defensible, which are false, and which one is doing the work when the phrase is used to shut down a claim about what someone values. Don't worry about citations, I'll add those. And don't just hand me the menu and leave the choice to me — tell me which reading you think is correct and why, and where you think my suspicion is misplaced.
reasoning: |-
  Okay, the user has been engaging with rationalist blogs and forums and keeps encountering this idea that "revealed preferences" are what an agent "really" values, while stated values are just confabulation. They're confused about what this claim actually means because it seems to vacillate between being trivial and making a strong substantive claim about welfare. They want me to break down the different interpretations of "revealed preference," explain what each entails, and then tell them which one I think is correct and why.

  First, I need to unpack the phrase "revealed preference." The user mentioned that it's often used as a one-liner to dismiss discussions about what someone or something truly values by pointing to their choices. But the user suspects this might be conflating different ideas. They brought up examples like akrasia, addiction, manipulated preferences, and inconsistent choices. These are key to addressing the limitations of each interpretation.

  Let me start by recalling the economic origins of revealed preference theory. Samuelson introduced it as a way to derive demand curves from observable choices without assuming utility functions. That's the technical definition. But in rationalist circles, it gets extended to psychology and ethics, which adds complexity. The user wants to know how the term slides between trivial and substantive claims.

  I should outline the possible readings. First, the Technical Definition: preferences are just a mathematical representation of choices. This is trivial but useful for modeling. Then, the Behavioral Definition: preferences are the psychological states causing choices, inferred from behavior. This is substantive but can be challenged by cases like addiction. Lastly, the Normative Definition: revealed preferences reflect true welfare. This is a strong claim and often conflated in discussions.

  For each reading, I need to define what a preference is, how it relates to choice, what must be true for it to hold, and how it handles counterexamples. The Technical Definition handles inconsistency by saying no such preference exists. The Behavioral might attribute inconsistency to changing states. The Normative struggles with harmful choices.

  The user mentioned akrasia—where someone acts against their stated values. In the Technical view, that inconsistency means no stable preferences. Behaviorally, it might indicate conflicting desires. Normatively, it's problematic because it suggests the action reflects true welfare, which seems counterintuitive.

  Addiction is another challenge. If an addict chooses drugs, does that mean they "really" value it? The Technical view just records the choice. Behavioral might see it as a compulsion overriding deeper values. Normative would say the drug is what's good for them, which is ethically dubious.

  The user also pointed out manipulation and scarcity. Under scarcity, choices might not reflect true desires. Manipulation could lead to choices that don't align with pre-manipulation values. Each interpretation handles these differently.

  I think the user's deeper need is to understand when the revealed preference argument is valid and when it's misapplied. They want to push back against its use as a conversation-stopper in discussions about values, especially in ethics or AI alignment. They suspect that the move is rhetorical, conflating the trivial definition with the normative one to make a strong claim without justification.

  My response should clarify that the Technical Definition is uncontroversial but doesn't imply anything about welfare. The Behavioral is testable but falsifiable. The Normative is a claim that needs separate ethical argumentation. The conflation happens when someone uses the technical truth to support the normative claim, which is a fallacy.

  I should emphasize that while revealed preferences are real data points, they aren't the whole story. People's stated values, even if sometimes confabulated, provide context. For example, in addiction, the conflict between stated values and behavior indicates a problem, not that the behavior reveals true values.

  In AI, a model's behavior might be optimized for a proxy goal, but that doesn't mean the proxy is the "real" value. The user might be interested in this for AI alignment discussions, where defining values is crucial.

  Ultimately, I need to state which reading I find correct. The Technical Definition is sound within its scope. The Behavioral has merit but isn't always accurate. The Normative is often incorrect without additional arguments. The misuse happens when the technical sense is invoked to support normative conclusions, which is invalid.

  The user's suspicion is spot-on: the sloganeering uses the trivial definition's certainty to lend credence to the normative claim, which is unwarranted. Highlighting this conflation is key to answering their request.
answer: |-
  You've pinpointed a crucial and often muddy distinction within the "revealed preference" move. Your suspicion is entirely warranted: the phrase slides between a near-tautology and a highly contestable normative claim, frequently leveraging the certainty of the former to smuggle in the latter. Let's dissect the distinct theses:

  **The Core Readings:**

  1.  **The Technical (Revealed Preference Axiomatics) Definition:**
      *   **What a preference is:** A *mathematical construct* derived from observable choice data under specific axioms (Completeness, Transitivity, sometimes others like SARP/GARP). Preferences *are defined as* the binary relations consistent with the observed choices. They are not internal states; they are a *description* of behavior.
      *   **Relation to Choice:** Choice *defines* preference. If an agent chooses A over B when both are available, we say "A is revealed preferred to B". Preferences exist *only insofar as* they can be constructed from consistent choices.
      *   **What must be true:** The agent's choices must satisfy the axioms (like transitivity: if A > B and B > C, then A > C must hold in choice). If choices are inconsistent, no stable preference ordering exists *under this definition*.
      *   **Handling Conflicts:**
          *   **Akrasia/Addiction:** If the agent chooses the addictive substance despite stating a desire to quit, *and this choice is consistent within the observed context*, then under this definition, the preference ordering *includes* the substance over abstinence in that context. The statement is irrelevant data for preference construction. If choices are inconsistent (e.g., chooses drug today, chooses rehab tomorrow when both presented similarly), no single preference ordering exists.
          *   **Manipulation/Scarcity:** Choices reveal preferences *under the conditions of choice*. If scarcity forces choice A over B, it reveals A is preferred *to B under scarcity*. It says nothing about preference under abundance. If manipulation changes the choice context (e.g., framing effects), it reveals preferences *within that manipulated context*. The definition is context-dependent.
          *   **Inconsistency:** The central failure case. If choices violate the axioms (e.g., intransitivity: A > B, B > C, C > A), no coherent preference ordering can be constructed. The theory simply doesn't apply.
      *   **Status:** **Trivial & Unfalsifiable as Psychology/Welfare.** It's a bookkeeping convention for describing consistent choice patterns mathematically. It makes *no claim* about internal states, welfare, or what the agent "really" values beyond the literal description of what was chosen over what alternatives in specific moments. It's a tool, not a deep truth.

  2.  **The Behavioral (Choice-Caused-By-Preference) Definition:**
      *   **What a preference is:** A *latent psychological state* (desire, valuation, ranking) that *causes* or *explains* the observed choice behavior. Preference is inferred *from* choice but is conceptually distinct – it's the mental antecedent.
      *   **Relation to Choice:** Choice is the primary *evidence* for inferring the underlying preference state. The preference is the cause, choice is the effect.
      *   **What must be true:** Choices must be *reliably caused* by stable underlying preference states, and these states must be the dominant factor determining choice in the observed contexts. Observability and inference are key challenges.
      *   **Handling Conflicts:**
          *   **Akrasia/Addiction:** These present problems. The conflict suggests the stated value *is* a real preference state, but it's being overridden by another, stronger preference state (e.g., immediate gratification, craving) or a compulsion not strictly preference-based. Choice reveals the *dominant* preference *at the moment of choice*, not necessarily the "true" or "considered" preference. Stated values might reflect another preference state (e.g., a long-term desire).
          *   **Manipulation/Scarcity:** Choice reveals the operative preference *under the influence* of manipulation or scarcity. This might differ significantly from preferences in unmanipulated or abundant contexts. The inferred preference is context-bound. Scarcity might force choices that reveal a preference for survival over other goods, not that survival is the *only* good.
          *   **Inconsistency:** Inconsistency suggests either: a) rapidly changing preference states, b) multiple conflicting preference states vying for control, c) factors other than preference (randomness, error, external constraints) heavily influencing choice, or d) that "preference" might not be the best model for this agent's behavior.
      *   **Status:** **Substantive, Defensible-but-Falsifiable, and Context-Sensitive.** This is the most common *intended* meaning in psychological or everyday discussions. It's a hypothesis about mental causation. It *can* be true, but it's not always true. Addiction, akrasia, manipulation, and inconsistency are evidence that choices don't always cleanly reveal a single, stable, welfare-relevant preference state. It requires careful interpretation and acknowledges the gap between behavior and underlying state.

  3.  **The Normative (Choice-Is-Welfare) Definition:**
      *   **What a preference is:** Synonymous with *"true welfare"* or *"what is actually good for the agent."* Satisfaction of revealed preference *is* the definition of well-being.
      *   **Relation to Choice:** Choice *directly constitutes* welfare. What the agent chooses *is* what is good for them, by definition. Statements are irrelevant or even deceptive.
      *   **What must be true:** Agents must be perfect judges of their own welfare, have unlimited willpower, perfect information, and be immune to cognitive biases, manipulation, and pathological states. Choice must be an infallible guide to well-being.
      *   **Handling Conflicts:**
          *   **Akrasia/Addiction:** The addict *really does* value the drug more than abstinence *at that moment*, and satisfying that preference *is* what increases their welfare, however perverse it seems. Their stated desire to quit is either insincere or mistaken about their own good.
          *   **Manipulation/Scarcity:** Even under manipulation or extreme scarcity, the choice reveals the agent's best available option *for their welfare*. If they choose a manipulated option, it *was* better for them than the alternatives presented. Scarcity choices reveal the hierarchy of *true* needs.
          *   **Inconsistency:** A major problem. If welfare is defined by choice, inconsistency means welfare is undefined or incoherent. Proponents might argue for "cleaning up" inconsistencies to find the "true" underlying welfare function, but this moves away from pure revealed preference.
      *   **Status:** **Strongly Substantive, Highly Contested, Often False.** This is the strong claim you suspect is doing the rhetorical work. It elevates the technical definition into a moral imperative. While foundational in some branches of welfare economics (Pareto efficiency), it faces devastating critiques from behavioral economics (showing cognitive biases), philosophy (notions of objective well-being, adaptive preferences), and common sense (the addict). It ignores the distinction between *wanting* and *liking*, between impulse and considered judgment, and between preference satisfaction and flourishing.

  **Which Reading is Doing the Shutdown Work?**

  When someone uses "revealed preference" to shut down a discussion about what an agent "really" values, they are **almost always conflating the Trivial Technical Definition with the Strong Normative Definition.**

  1.  **The Move:** They start by correctly noting the *technical* point: "We can *describe* their behavior as maximizing *some* preference ordering (if choices are consistent)," implying this is a robust, objective fact. They then seamlessly slide into the *normative* claim: "Therefore, this revealed ordering *is* what they really value, and any stated values are confabulation," presenting this as an equally robust, objective conclusion derived from the technical point.
  2.  **The Conflation:** The power comes from borrowing the certainty and mathematical rigor of the technical definition (which *is* true within its narrow scope) to lend unwarranted authority to the normative claim (which is highly contested and often false). The technical definition proves nothing about welfare or "real" internal values; it merely describes behavior mathematically. The jump to "therefore, this is their true welfare/real value" is a non sequitur.
  3.  **Why it's Effective (but Wrong):** It sounds scientific and decisive. It dismisses messy introspection, stated values, and ethical arguments as "mere confabulation" by pointing to the "hard evidence" of behavior. However, it ignores the vast evidence that choices are often poor indicators of stable values or well-being due to the factors you listed (akrasia, addiction, manipulation, etc.). It confuses *description* with *prescription* and *behavior* with *welfare*.

  **Which Reading is Correct? (My View)**

  *   **The Technical Definition** is correct *as a mathematical formalism* for describing consistent choice behavior. It's indispensable in certain economic models.
  *   **The Behavioral Definition** is often a useful *heuristic* and starting point for understanding agents, but it must be applied with **extreme caution and humility**. It is **not** always true. Choices are valuable data, but they are noisy signals about complex underlying states (multiple preferences, beliefs, emotions, constraints, biases). Akrasia, addiction, and manipulation demonstrate its limits. It requires triangulation with other evidence (stated values, physiological responses, long-term outcomes, context) and an understanding of cognitive science.
  *   **The Normative Definition** is **fundamentally incorrect** as a universal claim about human (or likely AGI) welfare. Satisfaction of *all* revealed preferences *does not* equate to well-being. Humans demonstrably make choices that harm their long-term flourishing due to weakness of will, misinformation, cognitive biases, and pathological states. To define welfare solely by choice ignores the richness of human experience and the potential for mistaken desires. While respecting autonomy is crucial, respecting choices is not the same as believing all choices are equally good for the chooser.

  **Your Suspicion: Spot On**

  Your suspicion is **entirely justified and perceptive.** The "revealed preference" shutdown move is indeed a rhetorical sleight of hand. It leverages the undeniable truth of the technical definition ("we can model this behavior as optimization") to imply the highly dubious truth of the normative definition ("therefore, this behavior defines what is truly good"). This conflation is pervasive in less careful rationalist discourse and certain strains of economics.

  The key is to **demand clarity:** "Are you making a technical point about modeling behavior, or a substantive claim about welfare?" When used as a shutdown, challenge the leap from "this choice happened" to "this choice reveals the agent's true and unassailable value/welfare." Point to akrasia, manipulated preferences, or inconsistent choices as counterexamples that break the simplistic equation of choice with true value or welfare. Revealed preferences are *data*, not *oracles*.
