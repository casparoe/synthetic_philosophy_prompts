prompt: |-
  ok weird ask, feel free to tell me its not a poem shaped problem.

  Background, because it matters: I'm 34, I have a form of skeletal dysplasia. Four foot two, two spinal fusions, I use a chair for anything longer than the walk to the shop, and I have a genuinely good life — a job I like, a partner, friends who'd come at 3am. I say that up front on purpose.

  We're doing ivf. Five embryos. One of them came back carrying the same variant I have; the other four don't. Everyone has been very careful and neutral — the genetic councellor, my mum, the internet — but the subtext is loud: obviously you pick one of the others, thats what a good parent does, don't be sentimental about it.

  And I keep going in circles, because the literature on this (the whole procreative beneficence line, plus the disability-studies pushback, plus the liberal eugenics framing where all of it is fine so long as it's parents choosing freely and not the state) seems to be arguing about exactly my situation and somehow never quite about it. The standard line says pick the embryo with the best expected life. Fine. But I'm supposed to be the counterexample. And the pushback says choosing against a trait is a statement about the people who have it, whether or not you mean it — which, yeah. And then the bit that ties me in knots: the kid I'd be protecting from a hard life is a kid who only exists if I choose them. There's no version of them parked somewhere being spared. Not choosing them doesn't harm them, because not choosing them means there's no them. I can't tell if that dissolves the worry or just makes it unfalsifiable.

  Also — and I think this matters and I can't work out whether it does — I'm not designing anyone. I'm not editing a genome. There are five already-existing embryos in a freezer and I'm picking which one goes back. Selection, not design. That distinction feels load-bearing and I can't say why.

  What I want: a poem. A pantoum specifically — the form where the second and fourth line of each stanza become the first and third of the next, and the last stanza loops back so the poem's final line is the poem's first line. Four or five stanzas, 16 to 20 lines. I want that form because of the loop: the poem has to end by reusing the lines it started with, and I want the question coming back around to be built into the structure instead of just mentioned. Address it to the child, second person. Not a defense, not an apology, and I definately don't want it resolved — no "and yet I chose you and it was right," no "we're all products of chance anyway." Leave it where it is.

  You're a poet who also actually knows this literature, so write it as someone who'd wince if the philosophy was sloppy. Before you draft, brainstorm: list the beats you want the poem to carry (the best-life metric, the expressivist point, the non-identity loop, selection vs design), then list candidate lines and test which ones can survive being repeated three or four times in different contexts — a line that means one thing in stanza one and something else in stanza three is worth more than a line that just restates itself. Then draft, then go back and check the repetition rules are actually followed and that someone who knows the debate would find it accurate.

  No citations, no reading list, I don't need to be pointed at anything.
