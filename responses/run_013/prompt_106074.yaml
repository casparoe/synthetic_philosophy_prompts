  ok this might be long but stick with me. im a junior in high school, my philosophy club meets thursdays in the library, and its my turn to present. i picked the dollar auction because my cousin showed it to me at thanksgiving and i literally couldnt sleep that night. rules, in case you dont know it: someone auctions off a $1 bill. bids go up in 5 cent steps. highest bidder pays what they bid and gets the dollar. the twist is the second highest bidder ALSO pays what they bid and gets nothing. so if im sitting at 55 and you're high at 60 and we stop there, i pay 55 for nothing, you pay 60 and get a dollar.

  here's the arguement i built, and now i think it proves way too much:

  (1) a rational choice is the one with the best expected value looking forward from right now. money already spent is gone and cant be recovered, so it shouldnt affect what you do next.
  (2) suppose the other guy is high at 60 and im at 55. my choice is bid 65 or quit. quit and i pay 55 for nothing: -55. bid 65 and he folds and i win: i pay 65 and get a dollar, +35. bid 65 and he doesnt fold and i lose: -65. so bidding beats quitting whenever theres better than about a 1 in 10 chance he folds.
  (3) i checked and the same math works at every level. even if he's high at $1.00 and im at 95: quit and im at -95, bid $1.05 and win and im only at -5. same 1 in 10 threshold. the numbers dont change no matter how high we go.
  (4) so (1) plus the rules never tells me to stop, at any price.
  (5) but if we both follow (1), we can both end up paying like $40 for a dollar. this actually happens, my cousin says companies do it with lawsuits and bidding wars and stuff.
  (6) a rule of rationality that tells two people to both make themselves arbitrarily worse off, when they could both just not, is broken.
  (7) so (1) is wrong???

  except (1) is basically what rationality IS, i cant just throw it out. and i redid (2) and (3) like twice, theyre airtight.

  so please: you're a philosopher who knows decision theory and game theory and has seen alot of arguments like this. think carefully. start by brainstorming every place this could be going wrong before you commit to one, then tell me which premise or step you reject, why it looked so obvious to me, and what rejecting it costs. i would much rather keep (1) than give it up, but i want to know what im paying. and if it turns out the real issue isnt in (1)-(7) at all but in something i never wrote down, say so and explain what i left out.
