  ### Careenium Simulation Activity: "Patterns & Particles"

  **Goal:** Experience causal efficacy at two levels (individual particles vs. emergent patterns) and reconcile the tension between them without philosophical jargon upfront.

  ---

  #### **Materials & Setup**
  1. **Grid:** Use chalk to draw a 6x6 grid on the floor (cells ~1m² each).  
  2. **Particles ("Sparks"):**  
     - Assign 10 participants as "Sparks."  
     - Give each Spark an index card: 5 with **"N"** (north pole), 5 with **"S"** (south pole).  
  3. **Directors ("Pattern Guides"):**  
     - Assign 2 participants as **Directors**. They get chalk to draw on a small board (or paper).  
  4. **Interpreters ("Storytellers"):**  
     - Assign 2 participants as **Interpreters**. They get index cards to take notes.  
  5. **Goals:** Post three objectives on the wall:  
     - *GOAL 1:* Form a cluster of 4+ Sparks.  
     - *GOAL 2:* Trap a small cluster (1-2 Sparks) in the top-left corner.  
     - *GOAL 3:* Split a large cluster into two smaller ones.  

  ---

  #### **Rules & Roles**  
  **Sparks (Particle Level):**  
  - **Movement:** Each turn, move 1 step (N/S/E/W) to an adjacent cell.  
  - **Bonding:** If adjacent to a Spark with *opposite* pole (N-S), you **must** bond (link arms). Once bonded, you move *together* as a unit.  
  - **Breaking bonds:** Only if forced apart (e.g., if blocked and unable to move).  

  **Directors (Pattern Level):**  
  - **Commands:** Can *only* issue directives to **clusters** (not individual Sparks). Examples:  
    - "Move the L-shaped cluster east!"  
    - "Split the big cluster near the wall!"  
  - **Tools:** Use chalk to sketch commands (e.g., arrows →, split symbols ✂️).  

  **Interpreters (Narrative Level):**  
  - **Narrate:** Describe cluster behavior in real time (e.g., "The triangle cluster is chasing the lone Spark!").  
  - **Record:** Note successful/failed interventions.  

  **Referee (You):**  
  - Enforce rules, announce turns (3 min/turn), track goals.  

  ---

  #### **Timeline (90 Min)**  
  1. **Intro & Setup (5 min):**  
     - Assign roles, explain rules (emphasize *no talking* between Sparks/Directors).  
     - Scatter Sparks randomly on the grid.  

  2. **Round 1: Chaos (20 min)**  
     - Sparks move randomly (no Director commands).  
     - Interpreters narrate cluster behavior.  
     - *Goal:* Experience spontaneous pattern formation without top-down control.  

  3. **Round 2: Directed Patterns (25 min)**  
     - Directors issue commands to clusters (e.g., "Move the blue-shirt cluster north!").  
     - Sparks in clusters follow commands *only if physically possible* (e.g., no walls in the way).  
     - Attempt Goals 1–3.  
     - Interpreters note if cluster-level commands "work."  

  4. **Round 3: Counterfactuals (20 min)**  
     - Directors try *impossible* commands (e.g., "Phase through the wall!").  
     - Sparks obey only if the physics allows it.  
     - Interpreters contrast outcomes (e.g., "Command failed—wall blocked them!").  

  5. **Debrief (20 min)**  
     - Spark Q: "Did *you* feel pushed by clusters, or by Directors?"  
     - Director Q: "Did clusters ‘obey’ you, or was it just Sparks moving?"  
     - Interpreter Q: "Did the cluster story feel ‘real’?"  
     - **Reveal Hofstadter’s Careenium:**  
       - "Sparks = simmballs. Clusters = lumps."  
       - Tension: "If Sparks do all the work, are clusters just stories?"  
     - **Map to Philosophy:**  
       - *Causal Exclusion:* "Sparks are sufficient—so why clusters?" → Show cluster commands enabled Goals 2/3 that random Spark motion couldn’t achieve.  
       - *Compatibilism:* "Clusters are *real patterns*—they support counterfactuals (e.g., ‘if the cluster moved, Sparks *had* to move’)."  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem:** Sparks bond permanently, making clusters immobile.  
    **Fix:** Allow bonds to break if movement is blocked (e.g., "tug-of-war" rule).  
  - **Problem:** Directors command individual Sparks.  
    **Fix:** Restate: "You can *only* speak to clusters!"  
  - **Problem:** Grid too crowded.  
    **Fix:** Start with fewer Sparks (8/14) or expand the grid.  

  ---

  #### **What the Activity *Can’t* Capture**  
  **The Missing Feedback Loop:**  
  In Hofstadter’s careenium, clusters *emerge* and *self-sustain* from particle interactions alone. Here, Directors are external "homunculi"—you’ll need to clarify:  
  > *"In reality, the ‘Director’ isn’t external—it’s* ***emergent***. The lump’s pattern *is* the cause, looping back to guide the simmballs. Today’s Directors were a stand-in for that loop."*  

  ---

  **Why This Works:**  
  - **Bodily Engagement:** Sparks *feel* bonds; Directors *frustrate* when clusters resist.  
  - **Aha! Moments:**  
    - Goal 2 fails in Round 1 (random motion) but succeeds in Round 2 (cluster herding).  
    - "Phasing through walls" fails, proving physics constrains patterns.  
  - **Debrief Bridges** to causal exclusion, supervenience, and non-reductive physicalism.  

  **Outcome:** They’ll viscerally grasp why "the lump story isn’t fiction" *and* why "only balls push balls" isn’t the full picture.
