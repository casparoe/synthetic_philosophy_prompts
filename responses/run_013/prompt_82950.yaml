prompt: |-
  I chair the ethics panel at a mid-sized foundation. We make maybe eight genuinely hard grant decisions a year — grants between fifty grand and two million, real people on the recieving end — we get an hour per case, and the room is mixed: one philosopher, our lawyer, two program officers, a community rep, me. The recurring problem is that we don't agree on the moral framework and we've been improvising, case by case. I want a procedure we can actually run in that hour.

  Our house rules, and the procedure has to respect them. Each of us gives a coarse credence — high, medium, low, or "don't know" — to a short list of views we keep on the whiteboard: a welfarist one, a rights/autonomy one, a prioritarian one, a community-consent one, and a "this isn't ours to decide" one. "Don't know" is a real bucket, not a zero, and it can be the swing vote. Then, instead of just averaging, we want two screens: first something like a moral-parliament or expected-choiceworthiness step, then a second screen that asks what happens if we've got the credences wrong — including the nightmare case where the view we all ranked last turns out to be right. The second screen should be able to veto the first.

  Write it as a procedure: the questions in order, what counts as a sufficient answer to each, where it stops with a no, where it hands the decision back to a person because the step is values all the way down. Be blunt about which steps are arithmetic on incommensurables dressed up as method — I'd rather have the seams visible than a tidy flowchart that's lying to me. Don't give me a reading list or tell me who said what; I won't read it and I won't remember it.

  Then run it on two cases: (a) deworming in a high-prevalence region versus a cage-free campaign, and (b) a donor who wants us to fund something he cheerfully admits is harmful, "offset" by something good. I expect to hate the answer on at least one of those, and I'd rather find out now than in the room.
reasoning: |-
  We are designing a decision procedure that must fit within a one-hour timeframe and respect the house rules. The procedure will use the coarse credences (High, Medium, Low, Don't Know) assigned by each of the five participants to five moral views: 
  1. Welfarist (maximize overall welfare)
  2. Rights/Autonomy (respect individual rights and autonomy)
  3. Prioritarian (give priority to the worst off)
  4. Community Consent (defer to the community's decision)
  5. Not Ours (this decision isn't ours to make)

  The procedure has two screens:
  1. **First Screen (Moral Parliament / Expected Choiceworthiness):** Aggregate the credences and the moral views to get an overall expected choiceworthiness score for each grant option.
  2. **Second Screen (Robustness Check):** Check what would happen if the credences are wrong, especially if the view we all ranked last is actually correct. This screen can veto the first screen's result.

  We must be explicit about where the steps are arithmetic on incommensurables and where we hand the decision back to human judgment.

  ### Procedure Design

  **Step 0: Pre-meeting**
  - The grant proposal is distributed in advance with a one-page summary highlighting the key ethical issues in relation to the five moral views.

  **Step 1: Individual Credence Assignment (5 minutes)**
  - Each participant independently assigns a coarse credence (High, Medium, Low, Don't Know) to each of the five moral views for the current case. 
  - **Note:** "Don't Know" is treated as a distinct category (not zero). It means the participant is uncertain and does not want to commit to a level of confidence.

  **Step 2: Display and Aggregate Credences (5 minutes)**
  - The facilitator (you) writes the credences on the whiteboard for all to see.
  - Aggregate the credences by converting them to numerical weights for calculation in the first screen. We need a mapping:
    - High: 3
    - Medium: 2
    - Low: 1
    - Don't Know: 0.5 (a neutral but non-zero weight, representing uncertainty)

    Why these numbers? They are arbitrary but simple. We are dressing arithmetic on incommensurables, but we must be explicit: the numbers are just a tool to aggregate and they don't capture the full depth of the moral views.

  **Step 3: First Screen - Expected Choiceworthiness (20 minutes)**
  - For each grant option under consideration (in a given case, there might be two or more), we will assess its performance against each moral view on a scale of 1 to 5 (where 5 is best and 1 is worst). This assessment must be done quickly, so we rely on the group's expertise and the pre-circulated summary.
  - The facilitator leads a quick discussion (with strict time limits) on how the grant option scores on each view. Then, the group assigns a score for each view for each option. If there's disagreement, the facilitator takes the average of the suggested scores (rounded to the nearest integer) or if time is short, the facilitator decides (but notes the disagreement).
  - Then, for each grant option, we compute an expected choiceworthiness score (EC) as follows:
    - EC = Σ [ (Weight of view i) * (Score of option for view i) ] for i=1 to 5
    - The weights for each view are the sum of the individual weights assigned by the five participants. For example, if all five assign High (3) to a view, the weight for that view is 15. If one assigns High (3), three assign Medium (2), and one assigns Low (1), then weight = 3+2+2+2+1=10.

    This step is arithmetic on incommensurables: we are multiplying and adding scores across different moral frameworks that may be fundamentally incompatible. We are doing it for the sake of having a procedure.

  - The grant option with the highest EC score wins the first screen.

  **Step 4: Second Screen - Robustness Check (20 minutes)**
  - We consider two worst-case scenarios:
    - **Scenario A:** What if the moral view that got the lowest aggregate weight (i.e., the one we collectively discounted the most) is actually the correct one? How does the leading grant option (from Step 3) fare under that view?
    - **Scenario B:** What if the moral view that we collectively assigned the highest weight is wrong, and instead the view that we assigned the least weight is right? (This is the nightmare case: we were confident in the wrong view and the one we ignored is correct.)

    How to run Scenario A:
    - Identify the moral view with the smallest total weight (if tie, pick one arbitrarily or consider all tied).
    - Look at the score assigned to the leading grant option for that view. If it is 1 or 2 (on the 1-5 scale), then this is a red flag.

    How to run Scenario B:
    - Identify the moral view with the largest total weight (the one we were most confident in) and the one with the smallest total weight (the one we were least confident in). Then, assume that the one with the smallest weight is correct. How bad is the leading grant option under that view? If the leading option scores 1 (the worst) under the least-weighted view, then that is a nightmare.

  - **Veto condition:** The second screen vetoes the leading option if either:
    a) In Scenario A, the leading option scores 1 or 2 (low) on the lowest-weighted view, and there is an alternative option that scores at least 3 (moderate) on that same view and is within 10% of the leading option's EC score (so that it was a close second). 
    b) In Scenario B, the leading option scores 1 (the worst) on the least-weighted view and there is an alternative option that scores at least 3 on that view and is within 10% of the leading option's EC score.

    If the veto condition is met, then the alternative option (that meets the condition) becomes the new leading option. If there are multiple, pick the one with the highest EC score.

    If the veto condition is not met, the leading option passes.

    This step is also arithmetic on incommensurables because we are comparing scores across views arbitrarily. But the idea is to avoid catastrophic mistakes.

  **Step 5: Final Decision (5 minutes)**
  - If the leading option passes the second screen, it is approved.
  - If the second screen vetoes the leading option and picks an alternative, that alternative is approved.
  - If the second screen vetoes the leading option but there is no suitable alternative (i.e., no alternative within 10% of the EC score that scores at least 3 on the relevant view in the scenario), then we have a tie or a problem. In that case, we do not make a decision in this meeting. The proposal is sent back for more information or the next meeting.

  **Where the values are all the way down:**
  - The assignment of credences to moral views (Step 1) is inherently value-laden and subjective. We are not trying to eliminate that.
  - The scoring of grant options against each moral view (Step 3) is also value-laden and may require judgment. The facilitator must be prepared to make a call if there's deadlock.

  **Time Allocation:**
  - Step 1: 5 minutes (individual, silent)
  - Step 2: 5 minutes (display and aggregate)
  - Step 3: 20 minutes (discuss and score each option per view, then compute EC)
  - Step 4: 20 minutes (run robustness checks and decide on veto)
  - Step 5: 5 minutes (finalize decision)

  Total: 55 minutes, leaving 5 minutes for transitions.

  ### Case Studies

  We'll run the procedure on two cases.

  #### Case (a): Deworming in a high-prevalence region vs. a cage-free campaign.

  Assume two grant options:
  - Option A: Deworming (cost: $X, expected to prevent Y cases of parasitic infection in a high-prevalence, low-income region)
  - Option B: Cage-free campaign (cost: $Z, expected to move W chickens to cage-free conditions)

  **Step 1: Assign Credences to Moral Views**
  We don't have the actual credences from the panel, so we'll assume a typical distribution. Let's say for this case:

  | Participant   | Welfarist | Rights/Autonomy | Prioritarian | Community Consent | Not Ours |
  |---------------|-----------|-----------------|--------------|-------------------|----------|
  | Philosopher   | High      | Medium          | High         | Low               | Low      |
  | Lawyer        | Medium    | High            | Medium       | Medium            | Low      |
  | Prog Officer1 | High      | Medium          | High         | Medium            | Low      |
  | Prog Officer2 | Medium    | Medium          | High         | High              | Low      |
  | Community Rep | Low       | Medium          | Medium       | High              | Medium   |

  Convert to numbers (H=3, M=2, L=1, DK=0.5):

  | View            | Philosopher | Lawyer | PO1 | PO2 | Comm Rep | Total Weight |
  |-----------------|-------------|--------|-----|-----|----------|-------------|
  | Welfarist       | 3           | 2      | 3   | 2   | 1        | 11          |
  | Rights/Autonomy | 2           | 3      | 2   | 2   | 2        | 11          |
  | Prioritarian    | 3           | 2      | 3   | 3   | 2        | 13          |
  | Community Cons  | 1           | 2      | 2   | 3   | 3        | 11          |
  | Not Ours        | 1           | 1      | 1   | 1   | 2        | 6           |

  **Step 2: Score each option against each view (1-5)**

  We need to assign scores for each option on each view. This is subjective, but let's use typical arguments:

  - **Welfarist (max welfare):** 
    - Deworming: Prevents suffering and improves productivity (high welfare gain) -> 5
    - Cage-free: Reduces animal suffering (welfare gain for animals) -> 4 (if we count animal welfare) but note: the foundation may focus on humans. Let's assume they count animal welfare, so 4.

  - **Rights/Autonomy:**
    - Deworming: Involves treating children without full consent (but typically done with community consent) -> 3 (mixed)
    - Cage-free: Promotes animal rights? But if the foundation focuses on human rights, then perhaps not directly relevant. Alternatively, if we consider the autonomy of the animals, then 5. If we only consider humans, then maybe 1 (not relevant). Let's assume the foundation considers animal rights as part of this view? Given the community rep and others, let's say they do. So:
      - Deworming: 3 (because it might override individual autonomy for the greater good, but done in a way that respects community norms)
      - Cage-free: 4 (advocates for the rights of animals)

  - **Prioritarian (worst off):**
    - Deworming: Targets very poor children -> 5
    - Cage-free: Helps animals that are in bad conditions, but humans are worse off? -> 3 (if we consider animals, they are very badly off, but if we only consider humans, then 1). Let's assume the view includes non-human animals? Then 4. But note: the children are among the worst-off humans. We'll say:
      - Deworming: 5
      - Cage-free: 4 (if animals are included) or 1 (if not). We'll go with 4, assuming the foundation includes animals in prioritarianism.

  - **Community Consent:**
    - Deworming: Typically done with community buy-in -> 5
    - Cage-free: May be driven by external activists, not necessarily by the community of farmers or animals? -> 2

  - **Not Ours:**
    - Deworming: The foundation has expertise and the community may not have the resources -> 2 (so it is our role)
    - Cage-free: The foundation may not have expertise in animal welfare, or it might be seen as interfering in the market -> 4 (so maybe not ours)

  Scores:

  | View            | Deworming (A) | Cage-free (B) |
  |-----------------|---------------|---------------|
  | Welfarist       | 5             | 4             |
  | Rights/Autonomy | 3             | 4             |
  | Prioritarian    | 5             | 4             |
  | Community Cons  | 5             | 2             |
  | Not Ours        | 2             | 4             |

  **Step 3: Compute EC for each option**

  EC(A) = (Weight_welf * Score_A_welf) + ... = 
          (11 * 5) + (11 * 3) + (13 * 5) + (11 * 5) + (6 * 2)
          = 55 + 33 + 65 + 55 + 12 = 220

  EC(B) = (11 * 4) + (11 * 4) + (13 * 4) + (11 * 2) + (6 * 4)
          = 44 + 44 + 52 + 22 + 24 = 186

  So Deworming (A) wins the first screen.

  **Step 4: Robustness Check**

  - Identify the view with the smallest total weight: "Not Ours" (weight=6).
  - Scenario A: Leading option (A) scores 2 on "Not Ours", which is low (1 or 2). Check if there is an alternative within 10% of EC(A)=220. 10% of 220 is 22, so EC(B)=186 is within 220-22=198? No, 186 < 198, so not within 10% (it's 186 < 198). So condition (a) is not met because B is not within 10%.

    Condition (a) requires: 
      - A scores low (2) on the lowest-weighted view (Not Ours) -> true.
      - There must be an alternative (B) that scores at least 3 on the Not Ours view -> B scores 4, which is >=3 -> true.
      - And that alternative must be within 10% of EC(A): 186 is 34 below 220 (which is 15.45% below). Since 186 < 198 (220-22), it is not within 10%. 

    So condition (a) fails.

  - Scenario B: 
    - The view with the highest weight is Prioritarian (13). The view with the smallest weight is Not Ours (6). Now assume Not Ours is correct. How does the leading option (A) fare? It gets 2 (bad). How about option B? It gets 4 (moderate). 
    - The nightmare condition: leading option A scores 1 or 2 on the least-weighted view (it does: 2). And there is an alternative B that scores at least 3 on that view (it does: 4). But again, we require that B is within 10% of A's EC score? It is not (because 186 < 198). 

    So condition (b) fails.

  Therefore, the second screen does not veto. Deworming (A) is approved.

  #### Case (b): A donor wants to fund something harmful, offset by something good.

  Option A: Accept the donor's grant and do the harmful project plus the offset.
  Option B: Reject the donor's grant.

  **Step 1: Assign Credences**

  Assume:

  | Participant   | Welfarist | Rights/Autonomy | Prioritarian | Community Consent | Not Ours |
  |---------------|-----------|-----------------|--------------|-------------------|----------|
  | Philosopher   | Low       | High            | Medium       | Low               | Medium   |
  | Lawyer        | Medium    | High            | Low          | Medium            | High     |
  | Prog Officer1 | Low       | High            | Low          | Low               | High     |
  | Prog Officer2 | Medium    | High            | Medium       | Medium            | Medium   |
  | Community Rep | Low       | Medium          | Medium       | High              | Medium   |

  Converted:

  | View            | Philo | Lawyer | PO1 | PO2 | Comm Rep | Total Weight |
  |-----------------|-------|--------|-----|-----|----------|-------------|
  | Welfarist       | 1     | 2      | 1   | 2   | 1        | 7           |
  | Rights/Autonomy | 3     | 3      | 3   | 3   | 2        | 14          |
  | Prioritarian    | 2     | 1      | 1   | 2   | 2        | 8           |
  | Community Cons  | 1     | 2      | 1   | 2   | 3        | 9           |
  | Not Ours        | 2     | 3      | 3   | 2   | 2        | 12          |

  **Step 2: Score the options**

  - **Welfarist:** 
    - Option A: The net welfare might be positive (if the offset is bigger) or negative. The donor says it's offset, but we might be skeptical. Let's say 2 (because the harm might be severe and the offset uncertain).
    - Option B: No change -> 3 (neutral, no harm but no extra good).

  - **Rights/Autonomy:**
    - Option A: The harmful project violates rights, and the offset doesn't fix that. So, 1 (bad).
    - Option B: Rejecting avoids complicity in rights violation -> 5.

  - **Prioritarian:**
    - Option A: The harmful project might hurt the worst-off, and the offset might help them? Or not? Uncertain. Let's say 2.
    - Option B: Neutral -> 3.

  - **Community Consent:**
    - Option A: The community affected by the harm didn't consent? Probably not. -> 1
    - Option B: No harm, so no consent needed -> 5

  - **Not Ours:**
    - Option A: The donor is pushing us to do something harmful, which is not our role -> 1
    - Option B: We are making an independent decision to reject, which is our role -> 5

  Scores:

  | View            | Option A (Accept) | Option B (Reject) |
  |-----------------|-------------------|-------------------|
  | Welfarist       | 2                 | 3                 |
  | Rights/Autonomy | 1                 | 5                 |
  | Prioritarian    | 2                 | 3                 |
  | Community Cons  | 1                 | 5                 |
  | Not Ours        | 1                 | 5                 |

  **Step 3: Compute EC**

  EC(A) = (7*2) + (14*1) + (8*2) + (9*1) + (12*1) = 14 + 14 + 16 + 9 + 12 = 65
  EC(B) = (7*3) + (14*5) + (8*3) + (9*5) + (12*5) = 21 + 70 + 24 + 45 + 60 = 220

  Option B wins the first screen by a huge margin.

  **Step 4: Robustness Check**

  - The view with the smallest total weight is Welfarist (7).
  - Scenario A: Leading option (B) scores 3 on Welfarist (which is moderate, not low). So condition (a) doesn't apply because the leading option isn't scoring low on the least-weighted view.
  - Scenario B: 
    - The view with the highest weight is Rights/Autonomy (14). The view with the smallest weight is Welfarist (7). Now assume Welfarist is correct. How does the leading option (B) fare? It gets 3 (moderate). How about option A? It gets 2 (low). 
    - The nightmare condition: leading option B does not score 1 on the least-weighted view (it scores 3). So condition (b) doesn't apply.

  Therefore, no veto. Option B (Reject) is approved.

  ### Conclusion
  In both cases, the procedure produced a decision. In case (a) deworming was approved and in case (b) rejecting the donor was approved. Note that in case (a) the robustness check did not veto because the alternative (cage-free) was not close enough in the EC score. In case (b) the EC score difference was too large and the robustness check didn't trigger.

  You might hate the result in case (a) if you are an animal advocate because the cage-free option lost. But note: the procedure is sensitive to the assigned credences and the scores. If the panel assigned higher credence to animal-inclusive views, or scored the cage-free option higher, it might have won.

  We must remember that the procedure is a tool to structure the discussion and expose the trade-offs. It doesn't remove the need for judgment, but it makes the values in play more explicit.
answer: |-
  ### Ethical Decision Procedure for Grant Approvals  
  **Time Allocation:** 55 minutes (5 min buffer)  
  **Participants:** Philosopher, Lawyer, Two Program Officers, Community Rep, Chair (you).  
  **Moral Views:** Welfarist (W), Rights/Autonomy (R), Prioritarian (P), Community Consent (C), "Not Ours to Decide" (N).  
  **Credence Levels:** High (H), Medium (M), Low (L), Don’t Know (DK). DK ≠ zero; it’s a distinct uncertainty bucket.  

  ---

  #### Procedure  
  **Step 1: Individual Credence Assignment (5 min)**  
  - **Question:** "What’s your credence for each moral view being the *right* lens for this grant?"  
  - **Process:** Each participant assigns H/M/L/DK to W, R, P, C, N. No debate. Write on whiteboard.  
  - **Output:** 5 sets of credences.  
  - **Seams Exposed:** This is **values all the way down**. Credences reflect subjective weightings of moral theories.  

  **Step 2: Aggregate Credences & Assign Weights (5 min)**  
  - **Question:** "What’s our collective weight for each view?"  
  - **Process:** Convert credences to weights:  
    - H = 3, M = 2, L = 1, DK = 0.5 (DK is non-zero but neutral).  
    - Sum weights for each view (e.g., W: 3+2+1+0.5+3 = 9.5).  
  - **Output:** Total weight for W, R, P, C, N.  
  - **Seams Exposed:** **Arithmetic on incommensurables**. Weight sums pretend moral theories are quantifiable.  

  **Step 3: Score Grant Options (15 min)**  
  - **Question:** "How does each grant option perform under each moral view?"  
  - **Process:**  
    - Rate each option per view on a scale of 1–5 (1 = terrible, 5 = ideal).  
    - Quick consensus or chair’s tiebreak if deadlocked.  
  - **Output:** Matrix of scores (options × views).  
  - **Seams Exposed:** **More incommensurables**. Scoring reduces complex ethics to numbers.  

  **Step 4: First Screen – Moral Parliament (10 min)**  
  - **Question:** "What’s the expected choiceworthiness of each option?"  
  - **Process:**  
    - Calculate: For each option, sum `(View Weight × Option Score)` across all views.  
    - Highest sum wins.  
  - **Output:** Leading option.  
  - **Seams Exposed:** **False precision**. Multiplies weights (subjective) by scores (subjective).  

  **Step 5: Second Screen – Nightmare Check (15 min)**  
  - **Question:** "Could the leading option be catastrophic if we’re wrong about our credences?"  
  - **Process:**  
    - **A. Identify weakest view:** View with lowest total weight.  
    - **B. Nightmare test:**  
      - If leading option scores ≤2 on the weakest view:  
        - Check runner-up options: Is there an option within 10% of the leader’s Step 4 score that scores ≥3 on the weakest view?  
        - If YES: Veto the leader. Adopt the runner-up.  
        - If NO: Leader survives.  
      - Else: Leader survives.  
  - **Output:** Final option or veto.  
  - **Seams Exposed:** **Values-based veto**. The 10% threshold and score cutoff are arbitrary but necessary for decisiveness.  

  **Step 6: Final Decision (5 min)**  
  - **Question:** "Does the second screen affirm or veto?"  
  - **Process:**  
    - If veto: Adopt best runner-up per Step 5.  
    - If no runner-up: Table decision (insufficient consensus).  
  - **Output:** Grant approved, rejected, or tabled.  

  ---

  ### Case Simulations  
  #### Case (a): Deworming vs. Cage-Free Campaign  
  - **Options:**  
    - Deworming (high-prevalence region): Targets disease in impoverished children.  
    - Cage-Free Campaign: Improves conditions for egg-laying hens.  

  **Step 1: Credences (Hypothetical)**  
  | Participant       | W (Welfarist) | R (Rights) | P (Prioritarian) | C (Community) | N (Not Ours) |  
  |-------------------|---------------|------------|------------------|---------------|--------------|  
  | Philosopher       | H             | M          | H                | L             | L            |  
  | Lawyer            | M             | H          | M                | M             | L            |  
  | Program Officer 1 | H             | M          | H                | M             | L            |  
  | Program Officer 2 | M             | M          | H                | H             | L            |  
  | Community Rep     | L             | M          | M                | H             | M            |  

  **Step 2: Weights**  
  - W: 3+2+3+2+1 = 11  
  - R: 2+3+2+2+2 = 11  
  - P: 3+2+3+3+2 = 13  
  - C: 1+2+2+3+3 = 11  
  - N: 1+1+1+1+2 = 6  

  **Step 3: Option Scores (1–5)**  
  | View | Deworming | Cage-Free |  
  |------|-----------|-----------|  
  | W    | 5 (saves lives) | 4 (reduces animal suffering) |  
  | R    | 3 (medical consent issues) | 5 (animal rights) |  
  | P    | 5 (helps poorest) | 3 (animals not human-poor) |  
  | C    | 4 (community accepts aid) | 2 (external activism) |  
  | N    | 2 (expertise exists) | 4 (not our mandate) |  

  **Step 4: Moral Parliament**  
  - Deworming: (11×5) + (11×3) + (13×5) + (11×4) + (6×2) = 55 + 33 + 65 + 44 + 12 = **209**  
  - Cage-Free: (11×4) + (11×5) + (13×3) + (11×2) + (6×4) = 44 + 55 + 39 + 22 + 24 = **184**  
  - **Leader: Deworming** (209 > 184).  

  **Step 5: Nightmare Check**  
  - Weakest view: **N** (weight = 6).  
  - Deworming scores **2** (≤2), so check runner-up:  
    - Cage-Free scores **4** on N (≥3).  
    - Deworming (209) vs. Cage-Free (184): 184 is 88% of 209 (within 10%? **No**).  
  - **Result:** No veto. Deworming affirmed.  

  **Final Decision:** Fund deworming.  

  ---

  #### Case (b): Donor’s "Offset" Grant  
  - **Options:**  
    - Accept: Fund a harmful project (e.g., fossil fuel lobby) "offset" by a good project (e.g., clean energy).  
    - Reject: Decline the grant.  

  **Step 1: Credences (Hypothetical)**  
  | Participant       | W    | R    | P    | C    | N    |  
  |-------------------|------|------|------|------|------|  
  | Philosopher       | L    | H    | M    | L    | M    |  
  | Lawyer            | M    | H    | L    | M    | H    |  
  | Program Officer 1 | L    | H    | L    | L    | H    |  
  | Program Officer 2 | M    | H    | M    | M    | M    |  
  | Community Rep     | L    | M    | M    | H    | M    |  

  **Step 2: Weights**  
  - W: 1+2+1+2+1 = 7  
  - R: 3+3+3+3+2 = 14  
  - P: 2+1+1+2+2 = 8  
  - C: 1+2+1+2+3 = 9  
  - N: 2+3+3+2+2 = 12  

  **Step 3: Option Scores (1–5)**  
  | View | Accept | Reject |  
  |------|--------|--------|  
  | W    | 2 (net good?) | 3 (no harm) |  
  | R    | 1 (violates rights) | 5 (upholds integrity) |  
  | P    | 1 (harms vulnerable) | 4 (prevents harm) |  
  | C    | 1 (imposed harm) | 5 (community trust) |  
  | N    | 1 (enables bad actor) | 5 (our role: say no) |  

  **Step 4: Moral Parliament**  
  - Accept: (7×2) + (14×1) + (8×1) + (9×1) + (12×1) = 14 + 14 + 8 + 9 + 12 = **57**  
  - Reject: (7×3) + (14×5) + (8×4) + (9×5) + (12×5) = 21 + 70 + 32 + 45 + 60 = **228**  
  - **Leader: Reject** (228 > 57).  

  **Step 5: Nightmare Check**  
  - Weakest view: **W** (weight = 7).  
  - Reject scores **3** on W (>2), so **no veto needed**.  

  **Final Decision:** Reject the grant.  

  ---

  ### Chair’s Reality Check  
  - **Case (a):** Deworming wins. You might hate this if you prioritize animal rights, but the math reflects the group’s higher credence in prioritarianism and lower confidence in "Not Ours." The nightmare check didn’t save cage-free because it wasn’t close enough in score.  
  - **Case (b):** Rejection wins overwhelmingly. Nightmare check skipped because Reject wasn’t weak on the lowest-weighted view (Welfarist).  

  **Why This Works in 60 Minutes:**  
  - No philosophical debates; credences/scores force focus.  
  - Nightmare check targets overconfidence without requiring consensus.  
  - Seams visible: Subjective weights/scores dominate, but the structure contains chaos.  
  - Output: A defensible decision, not a perfect one.
