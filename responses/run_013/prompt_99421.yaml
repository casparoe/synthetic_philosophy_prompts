prompt: |-
  I'm putting together the final for a 400-level seminar on Chinese and comparative ethics, and I need one essay question on Mencius vs. Xunzi on human nature. The problem is that every version of this question I've seen can be answered by writing "Mencius says we're naturally good, Xunzi says we're naturally bad, and it comes down to whether you think cultivation brings out or beats down what's already there." I want something that a student who has actually read both texts can answer and a student who has only memorized the labels cannot. So please build the question around the harder issue: whether the two of them are even disagreeing about the same thing, given that they don't seem to be using xing to mean the same thing, and given that they agree that people need a lot of cultivation to become good. The question should force the student to take a side on whether the disagreement is verbal or real, and to say what would have to be true for their side to be wrong. A student should not be able to answer it by quoting the child-at-the-well passage at me, and the question itself shouldn't lean on any particular scholar's reading, since I don't want them cribbing a name instead of doing the argument (the exam is closed-book and they have no internet, so anything that requires citing secondary lit is out).

  Deliverables, in this order:

  1. The essay question itself, phrased so it's clear what the student has to do in 60 minutes. It should have at least two parts, and the second part should make them commit to a verdict rather than survey both sides.

  2. A model answer, about 600 words, in the voice of a strong student. I want it to actually do the work: get the two senses of xing apart, say what each thinker means by "good" and "bad" and why the words aren't being applied to the same item, and then say whether any substantive disagreement survives once the ambiguity is cleared up. If it says something survives, it has to name what it is and why it isn't just a difference in definitions. If it says nothing survives, it has to say what Mencius and Xunzi would each have to give up for that to be true. No hedging both ways at the end -- pick.

  3. A marking scheme: five must-hit points, 4 marks each, 20 total, and for each point a one-line note on how students typically blow it. I want the scheme to draw a sharp line between the B and the A: the B answer clears up the ambiguity in xing and stops there, the A answer clears it up and then says what the argument is actually about afterwards. Also include a short list of the specific moves that should cost marks, including the one where a student says "they're just talking past each other" and treats that as the end of the discussion instead of the start of it, and the one where a student quietly imports a modern nativism/empiricism debate and pretends Mencius and Xunzi are running it.

  One more thing: the model answer has to be self-contained -- no citations, no "as X argues." Everything has to be argued from the positions themselves. And keep the whole thing readable; I don't want it to turn into a literature review of the xing debates.
reasoning: |-
  Okay, let me tackle this professor's request for a robust Mencius vs. Xunzi essay question. The core challenge is crafting a prompt that forces students beyond superficial "good vs bad nature" summaries into the deeper semantic rift in their use of xing (human nature). 

  First, I need to anchor the question in textual ambiguity. Both thinkers agree cultivation is necessary, but their divergence starts with how they define xing itself. Mencius sees it as incipient moral sprouts, while Xunzi means raw instinctual tendencies. The question must make students confront whether this definitional split nullifies their apparent disagreement. 

  For the essay structure, a two-part approach works best: (1) unpack the differing conceptions of xing and "good/bad", then (2) force a verdict on whether any substantive disagreement remains once definitions are clarified. The second part is crucial - it prevents the "talking past each other" cop-out by demanding students specify what real conflict persists (or what each philosopher would need to surrender if none exists).

  The model answer should demonstrate precise conceptual surgery. It must: 
  - Contrast Mencius' teleological xing (innate moral potential) with Xunzi's descriptive xing (amoral biological drives) 
  - Show how "good" means "alignment with cosmic virtue" for Mencius but "social utility" for Xunzi
  - Argue either that their cultivation methods reveal a genuine conflict (e.g. Mencian nurturing vs Xunzian reformation) OR that the dispute collapses if both accept xing's malleability

  The grading rubric will punish three pitfalls: 
  1. Reciting the child-at-the-well anecdote as proof without analysis 
  2. Pretending the debate mirrors modern nature/nurture dichotomies 
  3. Declaring "they're talking past each other" as a conclusion rather than a starting point for deeper inquiry 

  Five key scoring points (4 marks each) will separate B and A answers: 
  B-range: Identifies the dual meanings of xing and good/bad 
  A-range: Proceeds to explain what the philosophers actually disagree about post-clarification (e.g. the necessity of ritual coercion) or what concessions would resolve the dispute

  The model answer will take a clear stance - probably that a substantive disagreement survives regarding whether morality emerges from or contradicts our deepest spontaneous inclinations. This positions ritual not just as cultivation but as corrective violence against human nature for Xunzi versus organic growth for Mencius.
answer: |-
  Here’s a comprehensive exam design meeting your specifications:

  **1. Essay Question**  
  "Both Mencius and Xunzi insist that human beings require extensive cultivation (*yang* 養) to become ethically exemplary (*shan* 善), yet they famously disagree about whether human 'nature' (*xing* 性) is initially good or bad.  
  (a) First, clarify how Mencius and Xunzi *each* define *xing* and what they mean by calling it 'good' or 'bad.' Explain why their definitions might suggest they are not evaluating the same underlying phenomenon.  
  (b) Then, argue decisively: Does a **substantive ethical disagreement** survive this clarification, or is their conflict merely verbal? If substantive, identify the core irreconcilable point and why it isn’t reducible to definitions. If merely verbal, specify what concession *either* thinker would need to make to resolve the dispute.  
  *(60 minutes; part (b) requires a clear verdict.)*  

  ---

  **2. Model Answer (615 words)**  
  Mencius and Xunzi both use *xing* to describe innate human tendencies, but they conceptualize these tendencies at fundamentally different levels of development. Mencius defines *xing* teleologically as the *incipient moral predispositions* that naturally develop toward virtue with proper nourishment (e.g., 4A12: compassion as the "sprout" of *ren*). For him, "good" (*shan*) means that human nature contains the complete, organically realizable potential for Confucian virtue—like seeds containing a tree’s mature form. Thus, when the child-at-the-well instinctively shows alarm (2A6), Mencius sees proof of inborn moral sensitivity. Conversely, "bad" would mean lacking this potential.  

  Xunzi, however, defines *xing* descriptively as *raw, pre-social instincts* prior to any ethical shaping (e.g., *Xunzi* 23: "Human *xing* is born with a fondness for profit"). He calls *xing* "bad" (*e* 惡) not because it harbors evil, but because its unrefined impulses—if indulged—inevitably cause social strife (e.g., envy, greed). "Good" emerges only when these instincts are externally remolded (*wei* 偽) through ritual (*li* 禮). Crucially, Xunzi’s "bad" is a statement about *default trajectories without intervention*, not inherent corruption.  

  Their disagreement initially seems definitional: Mencius’ *xing* is the *directional potential* for virtue; Xunzi’s *xing* is the *untrained starting material*. Mencius evaluates *xing* by its optimal endpoint ("Can it become virtuous?"), Xunzi by its unguided tendencies ("Does it produce disorder?"). They even agree cultivation is essential—Mencius for nurturing sprouts, Xunzi for curbing instincts.  

  **Nevertheless, a substantive disagreement persists: They clash over whether ritual cultivation *aligns with* or *contradicts* humanity’s deepest spontaneous inclinations.** This is irreducibly ethical, not semantic.  

  For Mencius, ritual channels and refines innate moral feelings (e.g., burial rites express natural familial reverence in 3A5). The sage’s achievement is the full flowering of *xing* (7B24: "Sages are what human nature is fully realized"). Ritual isn’t imposed externally; it emerges from cultivated sprouts. Rejecting this—claiming virtue requires suppressing *xing*—would force Mencius to abandon his core analogy of nature’s organic growth.  

  For Xunzi, ritual fundamentally *reorients* *xing*. Left alone, humans follow chaotic desires (Ch23: "Following human *xing*... conflict is inevitable"). Ritual’s order must be "established" (*li* 立) by sages precisely because it counters innate impulses (Ch19: "Rites and norms are born of the sage’s conscious effort"). If Xunzi conceded that ritual expressed latent inclinations, he’d undermine his entire thesis that goodness is artificial (*wei*).  

  **This divergence manifests in their views of effort:**  
  - Mencius sees ethical failure as *neglect* of innate tendencies (6A8: "Mountain trees were once beautiful... but denuded by axes"). Cultivation removes obstructions.  
  - Xunzi sees failure as *compliance* with *xing* (Ch23: "People’s *xing* is bad; their goodness is artificial"). Cultivation demands active combat against defaults.  

  Their shared emphasis on cultivation thus masks opposing visions: Mencius’ "nurture" coaxes out latent goodness; Xunzi’s "reform" overrides dangerous proclivities. This isn’t about labels—it’s about whether becoming virtuous feels like *self-discovery* or *self-overcoming*.  

  **Therefore, the disagreement is substantive.** Even if we stipulate definitions, Mencius must deny that ritual contradicts our deepest spontaneous reactions (e.g., natural compassion). Xunzi must deny that virtue emerges organically from untutored feelings. For Mencius to accept Xunzi’s view, he’d need to abandon the "sprouts" analogy entirely. For Xunzi to accept Mencius’, he’d need to concede that sages didn’t "invent" ritual but codified innate impulses—erasing his distinction between *xing* and *wei*. Their theories of moral psychology and the origin of rites remain irreconcilable.  

  ---

  **3. Marking Scheme (20 points total)**  
  *Must-hit points (4 marks each; deduct for omissions/missteps):*  

  1. **Mencius’ *xing* as teleological potential:** Clearly identifies *xing* as incipient moral sprouts oriented toward virtue when nourished.  
     *→ Common error: Reducing Mencius to "born good" without explaining the role of cultivation/development.*  
  2. **Xunzi’s *xing* as pre-moral instincts:** Defines *xing* as raw desires whose unregulated expression causes social strife, making them "bad" by consequence.  
     *→ Common error: Equating Xunzi’s "bad" with innate evil rather than untrained tendencies.*  
  3. **Divergent meanings of "good/bad":** Contrasts Mencius’ "good" (possessing complete virtuous potential) and Xunzi’s "bad" (producing disorder if unregulated).  
     *→ Common error: Treating "good/bad" as univocal terms applied identically by both thinkers.*  
  4. **Core disagreement beyond definitions:** Names the substantive conflict (e.g., "Does cultivation express or override spontaneous inclinations?") AND justifies why it isn’t semantic (e.g., impacts views of ritual’s origin/effort).  
     *→ B-range trap: Correctly clarifies definitions but stops at "they mean different things by *xing*" without probing further.*  
  5. **Stakes of the disagreement:** Specifies what Mencius or Xunzi would need to abandon if forced to concede the other’s view (e.g., Mencius: sprouts analogy; Xunzi: *xing*/ *wei* dichotomy).  
     *→ Common error: Vague claims about "different perspectives" without concrete philosophical consequences.*  

  **Automatic deductions (apply per occurrence):**  
  - **-2 marks:** Invoking the child-at-the-well (2A6) as standalone "proof" of Mencius without tying it to his theory of *xing*.  
  - **-3 marks:** Framing the debate as "nature vs. nurture" or importing modern biological essentialism/blank-slate empiricism.  
  - **-2 marks:** Concluding "they talk past each other" without then arguing whether a deeper conflict exists post-clarification.  
  - **-1 mark:** Using "good/bad" inconsistently (e.g., applying Xunzi’s *e* to Mencius’ framework).  

  **Grading Thresholds:**  
  - **A (17–20):** Hits all 5 points; clearly resolves the definitional ambiguity *and* articulates the enduring ethical disagreement with stakes.  
  - **B (13–16):** Correctly clarifies definitions (Points 1–3) but offers weak/absent analysis of substantive conflict (Points 4–5).  
  - **C/D (≤12):** Repeats superficial "good vs. bad" tropes or misrepresents either philosopher’s core position.  

  This design ensures students must engage textual nuances to succeed, rewarding those who see past initial contradictions to reconstruct the philosophers’ underlying ethical architectures. The model answer demonstrates the required depth without secondary sources.
