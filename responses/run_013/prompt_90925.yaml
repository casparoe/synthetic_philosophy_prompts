  Regarding the pain clinic's use of the slogan, their immediate need is reassurance that movement won't cause harm, so the practical interpretation is probably that pain doesn't indicate new injury. But the user wants to explore the broader implications. The asymbolia cases challenge the intrinsic link between pain and suffering, suggesting unpleasantness is a separate layer. However, it's crucial to note that asymbolia is pathological, so while it reveals dissociability, it doesn't negate that in normal cases, pain is inherently unpleasant.

