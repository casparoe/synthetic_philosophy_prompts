answer: |-
  Here’s your Q&A prep sheet, structured by descending damage potential. Replies are concise, with weaknesses noted. Audience phrasing is based on your description of the room.  

  ### **Top-Tier Threats (Must Defend Aggressively)**  
  1. **The Set Theorist’s Objection (Attacks core move #2)**  
     *Phrasing:* "You’re reducing the ‘true universe of sets’ to mere sociology. But the hierarchy isn’t arbitrary—it’s discovered. Your view collapses into relativism and ignores the mathematical data forcing us toward axioms like large cardinals. Are you saying my work is just groupthink?"  
     *Reply:* "Not groupthink—authoritative practice. When you distinguish a ‘true universe’ from a model, you’re enforcing norms for extending set theory (e.g., maximizing interpretive strength). That’s objective within the practice, but it’s normative, not ontological. Your ‘discoveries’ are real, but they constrain what counts as coherent set theory, not what ‘exists’ in a metaphysical sense."  
     *Weakness:* Risks alienating set theorists by reframing their ontological intuition as internal authority. Doesn’t fully address how "mathematical data" (e.g., inner models) feels discovery-like.  
     *Why defend?* Conceding here invalidates your second move. The set theorists’ buy-in is crucial for credibility.  

  2. **The Quinean Philosopher’s Objection (Exposes external weakness)**  
     *Phrasing:* "If math isn’t about objects, why does physics *require* quantifying over numbers? Your ‘thin realism’ seems like verbal gymnastics to avoid Quine’s criterion: ‘to be is to be the value of a variable.’ If math is indispensable to science, it’s describing *something* real—or your view implodes."  
     *Reply:* "Indispensability pressures us to quantify over numbers, but that’s a pragmatic commitment, not proof of a platonic realm. Physics uses math under a ‘no-paraphrase’ rule—we don’t reduce ‘2’ to physical tokens. My view explains this as a normative stance, not an ontological report."  
     *Weakness:* Thin on *why* indispensability doesn’t entail robust ontology. Avoids engaging Quine’s naturalism head-on.  
     *Why defend?* Conceding resurrects the ontology debate you’re trying to dissolve.  

  3. **The Constructivist Logician’s Objection (Undermines the entire debate)**  
     *Phrasing:* "Why waste time on ‘existence’? Your ‘thin realism’ still assumes classical logic. If you took intuitionism seriously, you’d see that mathematical truth is grounded in proof-acts, not ‘reference’ or ‘norms.’ This whole debate is a pseudo-problem."  
     *Reply:* "Intuitionism replaces ontology with epistemology—which my view does too! I agree truth is practice-bound. But ‘thin realism’ explains why classical mathematicians *take themselves* to be referring. The debate isn’t pseudo; it’s about interpreting their discourse."  
     *Weakness:* Doesn’t resolve the logic schism. If intuitionism is right, your focus on classical reference is misguided.  
     *Why defend?* Lets you reframe your project as explanatory, not metaphysical.  

  ---

  ### **High-Damage But Concede Strategically**  
  4. **The Analytic-Number Theorist’s Objection (Exposes thinness of move #1)**  
     *Phrasing:* "You say referential indeterminacy (e.g., whether ‘3’ is an urelement or a set) isn’t a problem—but when I prove theorems about primes, I *need* determinacy. If my refocusing isn’t ‘describing,’ what’s the cash value? This feels like philosophy obscuring practice."  
     *Reply:* "Indeterminacy doesn’t touch determinateness *within a context* (e.g., PA or ZFC). Your proofs work because the norms fix local reference. The ‘cash value’ is that we needn’t posit a ghostly realm to explain this—just our commitment to the framework."  
     *Weakness:* Hand-wavy on how norms fix local determinacy. Concede here—it’s a fair critique, but not fatal.  
     *Tactic:* Concede gracefully: "You’re right that local determinacy matters—my point is that it doesn’t require global metaphysics."  

  5. **The Algebraist’s Objection (Challenges relevance)**  
     *Phrasing:* "I ‘thinly’ don’t care. If your view changes nothing about how I do math—if it’s all just ‘norms’—why not just call me a formalist and be done? Why the jargon?"  
     *Reply:* "Because formalists can’t explain why you feel compelled by proof (e.g., why not reinterpret ‘ring’ arbitrarily?). My view captures your realist intuitions *without* metaphysics."  
     *Weakness:* Risks sounding like warmed-over formalism. Concede if pressed—it’s a pragmatic objection.  

  ---

  ### **Annoying but Low-Damage**  
  6. **The Emeritus’s Objection (Verbal dispute)**  
     *Phrasing:* "Isn’t this just a verbal disagreement about ‘exists’? Why not stipulate your definitions and move on?"  
     *Reply:* "Partly! But the ‘verbal’ bit masks high-stakes disagreements—e.g., whether math needs causal epistemology. I’m showing why the realism debate *isn’t* verbal by relocating it to norms and reference."  
     *Weakness:* Feels dismissive. Let him have his moment—it’s low-risk.  

  ---

  ### **Your Weakest Point**  
  **The Physics Gap:** Your view sidesteps indispensability, but Quine’s challenge (objection #2) exposes this. If math is indispensable to science, and science describes reality, how is math’s "existence" merely normative? Your reply works mathematically but feels evasive when physics enters. Prepare to admit: "This is unresolved—but physics might adopt math under the same ‘no-paraphrase’ norm."  

  ---

  ### **The Dreaded Question**  
  *Likely from the Quinean or a set theorist:*  
  **"If mathematical objects don’t exist in a robust sense, why do mathematical truths feel necessary and universal? Isn’t your ‘thin realism’ just anti-realism in disguise?"**  

  *The Reply That Must Land:*  
  "Necessity comes from the norms being non-negotiable within the practice—not from platonic objects. When we say ‘2 + 2 = 4 is necessary,’ we’re expressing a rule we can’t coherently violate. That’s *stronger* than anti-realism: it explains objectivity without metaphysics. Anti-realism (e.g., fictionalism) can’t explain why mathematicians are *answerable* to these norms. I’m saving realism by thinning it to its essential core."  

  *Why it must land:* If the room sees this as crypto-anti-realism, you lose. This reply ties necessity to practice-based objectivity—aligning with mathematicians’ intuitions while avoiding ontology.  

  **Final Tactic:** Open Q&A by preempting the emeritus ("Some will call this verbal—but I’ll show why it’s not"). First reply to the set theorist—show respect ("Your work is exemplary—I’m reinterpreting its *status*, not its value"). End with the "dreaded question" reply as a closing soundbite.
