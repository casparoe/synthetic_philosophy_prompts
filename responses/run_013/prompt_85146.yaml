answer: |-
  Here’s a complete exam package designed to force students to engage with the *mechanistic distinctions* rather than rehearsed debates. The question targets whether they can disentangle **process**, **product**, and **inheritance** while demanding causal clarity.

  ---

  ### **1. Essay Question (90 minutes, closed book)**  
  **Case:** Marsh skimmers are colonial insects. Nests (~30 adults) share a chamber. Allele *S* causes secretion of an antifungal compound into the chamber wall. Secretion is costly: *S*-bearers lay 8% fewer eggs. However, nests with many *S*-bearers suffer fewer mould wipeouts over winter, increasing adult survival to spring. Non-secretors (*s*) pay no cost but benefit from the protected chamber.  

  - **Version A**: Nests disband each spring. Adults disperse randomly; next year’s nests form from random adults. Nest composition is **not heritable**.  
  - **Version B**: Nests persist and split. Daughter colonies bud off, inheriting the mother nest’s composition largely intact. Secretor frequency is a **heritable trait of the nest lineage**.  

  **Prompt:**  
  > For **Version A** and **Version B** *separately*:  
  > (a) At what level (gene, individual, nest) does **differential reproduction causally explain** the spread of *S*? Justify.  
  > (b) At what level is antifungal secretion an **adaptation**? Explain why it cannot be an adaptation at other levels.  
  > (c) What **empirical finding** would force you to revise your answer for (a) or (b)?  
  >  
  > Finally: A colleague claims that partitioning phenotypic variance into "within-nest" and "between-nest" components settles whether selection acts at the individual or group level in both versions. Critically evaluate this claim.  

  ---

  ### **2. Model Answer (650 words)**  
  **Version A (Non-heritable nests):**  
  (a) **Causal process**: Selection acts *solely at the individual level*. *S*-bearers have lower reproductive success within nests due to egg reduction, while *s*-bearers ("cheaters") have higher fitness by free-riding. Though nests with more *S*-bearers have higher survival, random dispersal destroys any nest-level fitness associations each generation. Differential reproduction is thus *caused* by individual trait-fitness covariance (*s* > *S* within nests), not by nest survival differences.  
  (b) **Adaptation**: Secretion is **not an adaptation at any level**. It benefits nests but isn’t heritable, so it cannot evolve. At the individual level, *S* is maladaptive (lowers fitness). The trait persists due to mutation-selection balance or influx from dispersal, not selection.  
  (c) **Revision trigger**: If nests showed non-random reformation (e.g., kin association), individual selection might be insufficient to explain *S* frequency.  

  **Version B (Heritable nests):**  
  (a) **Causal process**: Selection acts at **both individual and nest levels**. Within nests, *s* outcompetes *S* (individual selection). But whole nests with high *S*-frequency survive winter better, producing more daughter nests (group selection). Crucially, nest composition is heritable, so group fitness differences cause *S* to spread *despite* individual costs.  
  (b) **Adaptation**: Antifungal secretion is a **nest-level adaptation**. Nests with high *S*-frequency are "designed" by selection to resist mould. It is *not* an individual adaptation (reduces bearer fitness) nor gene-level (no selfish propagation; *S* relies on group structure).  
  (c) **Revision trigger**: If daughter nests *did not* inherit parental *S*-frequency (e.g., extreme drift during budding), group adaptation would collapse.  

  **Variance partitioning claim**:  
  Partitioning variance (e.g., Price Equation) quantifies *selection gradients* but **does not resolve causality**. In Version A, high between-nest variance in survival exists, but this reflects individual *S*-frequency, not nest-level heritability. The partition might show group selection statistically, but dispersal breaks the causal chain. In Version B, the partition *correlates* with group adaptation but doesn’t prove it; one must confirm daughter nests inherit parental traits. Variance analysis is bookkeeping; causality requires identifying **heritable fitness differences** (process) and **functional design** (product).  

  **Verdict**: Version A involves individual selection only; Version B requires multilevel selection. Group adaptation emerges *only* with heritable group fitness (B).  

  ---

  ### **3. Marking Scheme (25 points)**  
  **Must-hit points** (5 × 5 points each):  

  | **Point** | **What to Award** | **Common Failure Modes** |
  |-----------|-------------------|--------------------------|
  | **1. Version A causal process** | Correctly identifies **individual-level selection only**; explains that random dispersal screens off nest survival as a causal force. (5 pts) | • Misapplies "group selection" label due to nest survival differences. <br> • Claims selection acts at multiple levels without justification. (0–2 pts) |
  | **2. Version B adaptation** | States secretion is a **nest-level adaptation**; argues it *cannot* be individual- or gene-level due to cost/benefit structure and heritability. (5 pts) | • Calls it "for the good of the species." <br> • Asserts individual adaptation without addressing cost. (0–2 pts) |
  | **3. A vs. B contrast** | **A-vs-B Separator**: Explicitly links **nest heritability** to group adaptation in B and its absence in A. (5 pts) | • Treats A/B identically. <br> • Mentions heritability only superficially. (0–3 pts) |
  | **4. Empirical revision trigger** | For each version, proposes a **specific, plausible finding** that would undermine their answer (e.g., non-random dispersal in A; inheritance breakdown in B). (5 pts) | • Vague scenarios (e.g., "if cheaters won"). <br> • Suggests irrelevant evidence. (0–2 pts) |
  | **5. Variance partition critique** | Notes that partitioning **quantifies selection but doesn’t establish causality**; emphasizes that heritability (not variance) determines adaptation. (5 pts) | • Claims math "proves" group selection exists. <br> • Confuses statistical vs. causal claims. (0–3 pts) |

  **A-vs-B Separator Explained**: The key move for Version A (often missing in weak answers) is **demonstrating that nest fitness differences are screened off by individual selection + random dispersal**. Strong Version B answers can omit reiterating this if they focus on heritability, but A *requires* it.  

  ---

  ### **Why This Works**  
  - **Labels fail**: "Group selection" applies statistically to both versions but causally only to B. Students must disentangle this.  
  - **Forces commitment**: They must state whether secretion is an adaptation (product) and where selection acts (process), with clear A/B divergence.  
  - **Screens off test**: Version A demands showing that individual fitness differences (+ dispersal) explain all variance.  
  - **Variance partition trap**: The question exposes that math alone can’t distinguish causal processes.  
  - **No citations needed**: All arguments derive from case mechanics.  

  This question rewards students who see that **heritability bridges process and product**—and punishes those who conflate statistical patterns with evolutionary agency.
