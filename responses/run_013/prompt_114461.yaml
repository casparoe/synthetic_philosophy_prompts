answer: |-
  **Borough Council Waste Composition Guidance**  
  *(Schedule 7, Section 4: Itemised Charging)*  

  1.  **Composition Criterion:** Discrete items constitute a single object if, and only if, they are held in mutual contact or fastened together by any means (e.g., glue, nails, gravity, or direct placement), forming a cohesive unit at the point of collection.  
  2.  **Fee Application:** Charges apply per object as defined in Provision 1; thus, a knife and fork placed loosely in a dustbin constitute two chargeable items, whereas the same cutlery bound together with string constitutes one item, irrespective of functional association.  
  3.  **Gradual Replacement:** If constituent parts of an object (e.g., sofa cushions, legs) are replaced individually over time while maintaining contact or fastening with the core structure, the resultant entity remains a single object for charging purposes; disassembly into wholly separate components triggers multiple charges.  
  4.  **Transitive Contact:** Physical contact is transitive under this policy; consequently, a sofa touching the floor, which contacts the Earth, necessitates classifying the entire planet Earth (and any attached items) as a single chargeable object. Residents are liable only for the portion presented for collection.  
  5.  **Rejected Formulations:** The Council considered but dismissed the following composition principles: (a) *No Composition* (charges per fundamental particle: administratively unworkable), (b) *Universal Composition* (any arbitrary group constitutes an object: disproportionate stationery costs for fee tickets), and (c) *Vitalist Composition* (only living organisms form wholes: impractical for assessing furniture).
