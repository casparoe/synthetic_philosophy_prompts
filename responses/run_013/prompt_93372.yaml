prompt: |-
  Two weeks ago a friend of mine — a union organizer, the kind of person who has actually had to move votes for a living — and I spent most of a long evening arguing about Simone Weil's note on the general suppression of political parties, the one she wrote near the end of her life and that was published only after her death, and we ended in the sort of disagreement that keeps generating new questions days afterward. The version of Weil I put to him was the one I had always found compelling: that a political party is a machine for manufacturing collective passion; that it is an organization built specifically so as to bring collective pressure to bear on the thinking of each of its members; and that its first aim, and in the end its only aim, is its own unlimited growth. From those three claims she drew a conclusion much stronger than the usual complaint that parties sometimes go wrong — that belonging to a party always constrains one to untruth, and that the existence of parties is therefore an unconditional evil, not a cost to be weighed against the goods parties deliver but a structural incompatibility between the party form and truth and justice. And her alternative was not coalitions, or factions, or better internal democracy; it was the revue, a group gathered around writing and reading that one is near rather than a member of, and on whose behalf no one stands for office. My friend, who has spent fifteen years in a union he loves and that has plainly been worth what it cost him, said three things I could not answer. First, that parties are the only machinery anyone without money has ever used to make power answer, and that abolishing them is a counsel of despair which leaves the field to those who never agreed to be bound by the rule. Second, that the revue is a party with a masthead — editors, a canon, an orthodoxy of taste, a small group of people who decide what is serious. Third, and worst, that Weil's definition is not diagnostic at all: every group that has to act together, from a congregation to a research lab to a family to his own union local, exerts pressure on the thought of its members, and a criterion that condemns everything tells you nothing about when the thing you are already inside has turned. We ended up agreeing, roughly, that the interesting question is not whether parties should exist but whether there is a way to tell, from inside a group that is doing necessary work and mostly doing it decently, that the machine has started running. That is the question I want you to answer, and I want the answer as a procedure rather than an essay.

  I have a reason to want it, and a deadline. I chair the internal standards committee of a state-level political party — about four thousand members, four of them in the legislature — that began six years ago as a single-issue campaign and is still, in most of the ways that matter, that campaign with a mailing list attached. The committee is three volunteers, none of us lawyers; we meet monthly for two hours and usually have two or three disputes referred to us, and our recommendations go to the steering committee for ratification, with expulsion ultimately requiring two thirds of the convention. In ten weeks we hold our first convention and adopt bylaws, including — because two of our legislators keep breaking with the platform on the issue that founded us, and because four hundred members have signed a petition to expel someone over a remark he made on a podcast — a discipline and expulsion clause and a rule about endorsing candidates. I have no interest in the legislative half of Weil's title; the first readers of that note took it to mean driving parties out by persuasion rather than banning them by law, and either way it is not available to me. I want the diagnostic half. Write me a decision procedure my committee can run on a case in ninety minutes, that a member who has never read a word of Weil can be walked through, and that will survive being argued about by people who will assume any rule we write is aimed at them. I want the questions in order, what counts as a sufficient answer to each, which questions stop the process with a no and which merely slow it down, and — the part I care about most — the points at which the procedure hands the decision back to a person because the question is one of values rather than of fact, with a note on which of the earlier steps are judgment calls dressed up as procedure. It should be mechanistic rather than moralistic: it should name what has actually happened in the organization, in terms someone could dispute with evidence, rather than asking us to assess how the group feels about itself. Where Weil's positive alternative can be turned into something usable inside a party that intends to contest elections — what it would mean to stand near a position rather than be bound to it, what a loyalty test looks like when it is wearing the costume of a request for message discipline — build that in; where it cannot, say so plainly rather than inventing a step to fill the gap.

  Then run it on three cases in order, showing the procedure working rather than just announcing a verdict. First, the draft unity rule: members of our legislative caucus would be required to vote with the platform on a list of core votes drawn up by the steering committee or lose party funding and staff support; the two legislators who break with us say the list is drawn to catch their dissent and not the leadership's past deviations, and I suspect they are right. Second, the expulsion petition: a member said something about the founding issue that some members read as a slur and others read as clumsiness, there is no rule that covers it, and the petitioners argue that the petition itself is evidence of what the membership considers beyond the pale. Third, the endorsement: the only candidate who can win a district we need is quietly on the other side of the founding issue, and the alternative agrees with us and loses by thirty points. I expect the procedure to give me an answer I will not like in at least one of these, and I would rather have it now than at the convention; when it does, tell me what the answer costs, because I will have to argue it in front of people who will hear it as a betrayal. There is one more thing I want the procedure turned on, and I want you to be unsentimental about it: our founding pledge, which members have signed for six years, promising never to support any candidate who voted for the bill that started us. I have defended that pledge in every argument I have ever had, including this one. If the procedure says it was the first loyalty test we ever ran, say so, and tell me what follows. Finally, tell me what the procedure cannot do — whether a diagnostic built out of Weil's critique can ever prescribe anything positive or can only tell you that you are ill, whether the revue is a real alternative or a beautiful thing that has never held a ward, and what a procedure of this kind is blind to that my union organizer friend would see immediately. Do not send me a bibliography; I will not read Weil and neither will the other two members of the committee. Write the one-page version they can use, and keep the reasoning for me.
reasoning: |-
  We are designing a decision procedure based on Simone Weil's critique of political parties, focusing on diagnosing when a group (in this case, a political party) has started to become a "machine for manufacturing collective passion" that constrains its members to untruth. The procedure must be mechanistic, fact-based, and usable by a committee of three non-lawyers in about 90 minutes per case. It should avoid moralistic language and focus on observable facts and actions within the organization.

  Key elements from Weil's critique to operationalize:
  1. The party as a machine for manufacturing collective passion.
  2. Exerting collective pressure on the thinking of members.
  3. Aiming for unlimited growth (or self-perpetuation) as the primary goal.

  But we also have counterpoints from the union organizer:
  - Parties are necessary for the powerless to hold power accountable.
  - Any group that acts together exerts some pressure; we need to distinguish when it becomes pathological.
  - The revue (as a non-party group) may have its own orthodoxy.

  Therefore, the diagnostic must focus on when the group's internal dynamics cross a line where the pressure becomes coercive to the point of compromising truth and justice, and when the group's growth or survival becomes an end in itself.

  The procedure will be a series of questions, each with:
  - What counts as sufficient evidence for a "yes" or "no" answer.
  - Whether a "no" stops the process (i.e., the group has not crossed the line) or merely slows it down (requiring further steps).
  - Points where the decision must be handed back to human judgment, with notes on which steps are judgment calls disguised as procedure.

  We are building for a political party that contests elections, so we must consider how to incorporate Weil's positive alternative (e.g., "standing near" a position rather than being bound) in practical terms.

  **Structure of the Procedure:**

  The procedure will be a flowchart of questions. Each case is evaluated by running through these questions in order. The goal is to determine whether the group (or a specific action/rule of the group) is exhibiting the problematic characteristics Weil describes.

  We'll define three possible outcomes for the committee's consideration:
  1. **No concern:** The group/action does not trigger Weil's critique.
  2. **Warning signs:** Some elements are present, but not yet critical. This may require monitoring or adjustments.
  3. **Critical failure:** The group/action has crossed the line into Weil's "unconditional evil" – it is manufacturing collective passion in a way that constrains truth and justice, and/or prioritizing growth/survival above all.

  However, note that the committee is not banning parties but diagnosing when the machine has started running in a harmful way. The output should inform their decision on rules, discipline, etc.

  **Questions for the Diagnostic Procedure:**

  We design a sequence of yes/no questions. Some questions are designed to stop the process early if the group is clearly not at risk, while others accumulate evidence of a problem.

  1. **Question 1: Is the group's primary activity focused on gaining or exercising power?** (This is inherent in a political party, so we expect "yes". But it doesn't stop the process; it sets the context.)
     - Sufficient for "yes": The group endorses candidates, lobbies for legislation, seeks electoral victories.
     - If "no", stop: This group is not a political party in the relevant sense. (But in our context, it will always be yes.)
     - Judgment call: None; this is factual.

  2. **Question 2: Does the group have formal mechanisms for enforcing unity?** (E.g., pledges, loyalty tests, discipline rules)
     - Sufficient for "yes": Written rules requiring adherence to positions, penalties for deviation (e.g., loss of funding, expulsion).
     - Sufficient for "no": No such rules; all positions are advisory.
     - If "no", proceed to Q3. If "yes", proceed to Q4 (skip Q3) because Q3 is about informal pressure and we want to prioritize formal mechanisms.
     - Judgment call: Interpreting what counts as "enforcing unity" – focus on written rules.

  3. **Question 3: Are there strong informal pressures to conform?** (Only if Q2 is "no", but in a party, Q2 is often yes. We might run this if Q2 is no to see if informal pressures are acting like formal ones.)
     - Sufficient for "yes": Evidence of members being shamed, marginalized, or facing retaliation for dissenting views, even without formal rules.
     - If "no", stop with outcome: No concern (if both Q2 and Q3 are no, the group is not exerting pressure in a systematic way).
     - If "yes", proceed to Q4.
     - Judgment call: Assessing "strong" informal pressure – requires evidence (e.g., meeting minutes, emails, testimonies).

  4. **Question 4: Is the group's decision-making process open to revising positions based on new evidence or arguments?**
     - This operationalizes whether the group prioritizes truth over unity.
     - Sufficient for "yes": Regular review of positions, mechanisms for member input, documented instances of policy changes due to new information.
     - Sufficient for "no": Positions are treated as fixed, dissent is suppressed without consideration of merits.
     - If "yes", proceed to Q5. If "no", proceed to Q6 (as this is a warning sign).
     - Judgment call: Determining if revisions are genuine or perfunctory.

  5. **Question 5: When revising positions, is the process dominated by a small subgroup without broad consultation?**
     - This checks for oligarchy/orthodoxy.
     - Sufficient for "yes": Steering committee or leaders make changes with minimal input; no avenue for members to propose changes.
     - Sufficient for "no": Open forums, voting, or other inclusive methods.
     - If "no", proceed to Q7. If "yes", proceed to Q6 (warning sign).
     - Judgment call: Defining "dominated" and "broad consultation" – look at bylaws and practices.

  6. **Question 6: Are deviations from group positions punished even when the deviation aligns with the group's stated values?**
     - This tests if loyalty to the group trumps loyalty to values/truth.
     - Sufficient for "yes": Examples of members being disciplined for positions that are consistent with the group's core principles but against the current platform.
     - Sufficient for "no": Discipline only for violations of core principles or illegal acts.
     - If "yes", this is a critical failure (outcome 3). If "no", proceed to Q7.
     - Judgment call: Assessing alignment with stated values – refer to founding documents.

  7. **Question 7: Does the group prioritize electoral victory or growth over its founding principles?**
     - This tests the "unlimited growth" aim.
     - Sufficient for "yes": Endorsing candidates who oppose core principles for electability, changing positions to attract more members, avoiding controversial stances to win elections.
     - Sufficient for "no": Rejecting candidates who don't align, even if unelectable; sticking to principles despite electoral cost.
     - If "yes", this is a critical failure (outcome 3). If "no", proceed to Q8.
     - Judgment call: Balancing principles vs. pragmatism – look at decisions and justifications.

  8. **Question 8: Is there a mechanism for members to exit the group without excessive cost?**
     - Weil's revue allows one to be "near" rather than bound; this checks for coercion.
     - Sufficient for "yes": Easy resignation, no penalties for leaving.
     - Sufficient for "no": Significant social, financial, or professional costs to leaving; members feel trapped.
     - If "no", this is a warning sign (outcome 2). If "yes", stop with outcome: No concern (or low concern).
     - Judgment call: What counts as "excessive cost" – subjective, so rely on member testimonials.

  **Outcomes:**
  - If at any point Q6 or Q7 is "yes", outcome is **Critical failure**.
  - If Q4 or Q5 is "no", or Q8 is "no", outcome is **Warning signs**.
  - Otherwise, outcome is **No concern**.

  But note: This is for evaluating a group or a rule. We have three specific cases to run: (1) the draft unity rule, (2) the expulsion petition, (3) the endorsement dilemma. We also have the founding pledge.

  We must adapt the procedure to evaluate specific actions/rules, not just the whole group. For each case, we focus on the rule or action in question and how it affects the group.

  **Revised for Specific Cases:**

  For a rule or action (like the unity rule), we ask:

  1. Does this rule/action enforce unity? (If not, stop: no concern from Weil's perspective.)
  2. Does it punish deviations even when they align with core values? (If yes, critical failure.)
  3. Does it prioritize growth/power over principles? (If yes, critical failure.)
  4. Is there an escape hatch? (If not, warning.)

  But we need a unified procedure.

  **Final Procedure Structure for a Case:**

  Each case is about a specific issue: a proposed rule, a petition, a decision. We evaluate whether this specific issue triggers Weil's critique.

  **Questions for any case:**

  0. **Preliminary: What is the core value or principle at stake?** (This must be defined from the group's founding documents to avoid subjectivity. E.g., for this party, the founding issue is the core principle.)
     - Must be established factually from the group's history.

  Then:

  1. **Does this case involve enforcing unity?** (i.e., requiring members to conform to a position)
     - If no, stop: **No concern**.
     - If yes, proceed.

  2. **Is the enforcement based on a violation of the group's core principles?**
     - Sufficient for "yes": The position enforced is directly derived from a core principle (e.g., the founding issue).
     - Sufficient for "no": The position is tangential, new, or not core.
     - If "yes", proceed to Q4. If "no", proceed to Q3.

  3. **Is the enforcement about maintaining message discipline or electoral strategy rather than principle?**
     - Sufficient for "yes": The rule/petition is justified by electoral consequences, avoiding controversy, or party growth.
     - Sufficient for "no": Justified by adherence to values.
     - If "yes", this suggests **Critical failure** (prioritizing growth/power). Proceed to Q5 for confirmation.
     - If "no", proceed to Q4.

  4. **Could the member's dissenting position be reasonably argued as consistent with the core principles?** (This is the key truth test.)
     - Sufficient for "yes": The dissenting view is supported by evidence or arguments that align with the group's values, even if it contradicts the current platform.
     - Sufficient for "no": The dissent clearly violates core principles (e.g., supporting the opposed bill).
     - If "no", proceed to Q5. If "yes", this is **Critical failure** (punishing truth-aligned dissent). Stop.

  5. **Is there a less restrictive alternative available?** (This operationalizes "standing near" – could the group have achieved its goal without coercion?)
     - E.g., instead of expulsion, a discussion; instead of binding vote, a recommendation.
     - Sufficient for "yes": The group could use persuasion, education, or voluntary compliance without penalties.
     - Sufficient for "no": The enforcement is necessary to prevent immediate harm (e.g., a member advocating violence).
     - If "yes", **Warning sign** (unnecessary coercion). If "no", **No concern** (but rare in politics).

  **Outcome Interpretation:**
  - **Critical failure:** The action/rule is a clear instance of manufacturing collective passion at the expense of truth/justice. The committee should reject it or amend it.
  - **Warning sign:** The action/rule has problematic elements but may be justified. The committee should seek modifications to reduce coercion.
  - **No concern:** The action/rule does not trigger Weil's critique.

  Now, run on the three cases:

  **Case 1: Draft Unity Rule**
  - Core principle: The founding issue.
  - Q1: Yes, it enforces unity (binding votes on core issues).
  - Q2: Is it based on core principles? The rule says "core votes" from the platform. But the legislators say the list is drawn to target them. Check: If the votes are truly core (related to founding issue), then yes. If not, no. *Assume evidence shows some votes on the list are not directly about the founding issue.* So Q2: No.
  - Q3: Is it about message discipline? The rule is to ensure unity for electoral credibility. Likely yes. So **Critical failure** (prioritizing electoral strategy). Also, if we proceed: Q4: Could dissent be consistent? Possibly, if they have principled reasons. But we already have critical failure from Q3.

  **Case 2: Expulsion Petition**
  - Core principle: Founding issue.
  - Q1: Yes, expulsion enforces unity.
  - Q2: Is it based on core principles? The remark was about the founding issue. Some see it as a slur, others as clumsiness. If the remark violates core principles (e.g., opposes them), then yes. But it's ambiguous. We must judge: if the remark is inconsistent with core principles, then yes. But if it's just poorly worded support, then no. *Assume the remark was a poorly articulated support, not opposition.* So Q2: No.
  - Q3: Message discipline? The petitioners say it's about maintaining a welcoming environment, which could be principle-based. But if the core principle is the issue, not tone, then it might be more about image. *Judgment: The petition is about not offending allies, so electoral/growth concerns. Q3: Yes.* **Critical failure**.
  - Alternatively, if Q3 is no, Q4: Could the remark be consistent? Yes, if it was clumsy support. Then **Critical failure** for punishing truth-aligned dissent.

  **Case 3: Endorsement Dilemma**
  - Core principle: Founding issue.
  - The case: Endorse Candidate A (opposes core issue but wins) or Candidate B (supports but loses).
  - We are evaluating the decision to endorse A.
  - Q1: Endorsement isn't directly enforcing unity on members, but it is a group action. Adjust: Does endorsing a candidate who opposes core principles enforce a kind of unity (suppressing the principle)? Perhaps stretch. But let's reframe: The endorsement rule might require supporting the party's candidate, which enforces unity. But the case is about which candidate to endorse.
  - Better: Evaluate the proposed endorsement of Candidate A.
  - Q1: Does endorsing A enforce unity? Not directly, but it signals the group is willing to compromise core for power. So it might be covered by Q7 in group-level questions. We need a different approach.

  We see the procedure must handle different case types. Let's define:

  - For rules (like unity rule or expulsion clause): Use the rule-focused questions.
  - For actions (like an endorsement decision): Ask:
    1. Does this action prioritize growth/power over core principles? (If yes, critical failure.)
    2. Does it involve suppressing dissent or enforcing conformity? (If yes, then run the unity questions.)

  **Revised General Procedure for Any Case:**

  Start with:

  **Step 0: Identify the core principle(s) from founding documents. Factual; no judgment.**

  Then, depending on case type:

  **A. If the case is about a rule or disciplinary action:**
    1. Does the rule/action require members to conform to a specific position or behavior? (If no, stop: no concern.)
    2. Is the required position directly derived from a core principle? (If yes, go to 4; if no, go to 3.)
    3. Is the requirement primarily about electoral strategy, message discipline, or group growth? (If yes, critical failure; if no, go to 4.)
    4. Could a dissenting position be reasonably argued as consistent with the core principles? (If yes, critical failure; if no, go to 5.)
    5. Is the enforcement mechanism the least restrictive way to achieve the goal? (If no, warning sign; if yes, no concern.)

  **B. If the case is about a group decision (e.g., endorsement):**
    1. Does the decision compromise a core principle for the sake of electoral gain, growth, or power? (If yes, critical failure; if no, no concern.)
    2. (Optional) Does the decision involve suppressing internal dissent? If so, run part A.

  **C. If the case is about the group's overall health:**
     Use the group-level questions from earlier.

  Now run cases:

  **Case 1: Draft Unity Rule (Type A)**
  - Core principle: Founding issue.
  - Step A1: Yes, it requires conforming votes.
  - A2: Is the list of votes directly derived from core principles? Evidence: Some votes are core, some are not. The legislators say it's targeted. Since not all votes are core, answer: No.
  - A3: Is it about message discipline? Yes, to present unity for credibility. **Critical failure**.

  **Case 2: Expulsion Petition (Type A)**
  - Core principle: Founding issue.
  - A1: Yes, expulsion enforces behavioral conformity.
  - A2: Is the remark a violation of core principles? The remark was about the founding issue, but not clearly opposed. If it was a slur, it might violate ancillary values (respect), but core principle is the issue position. *Judgment: The core principle is the policy position, not tone. If the remark was supportive but clumsy, it doesn't violate core principles. So A2: No.*
  - A3: Is it about message discipline? The petitioners say it's to maintain a welcoming environment for allies, which is about growth/electability. **Critical failure**.

  **Case 3: Endorsement (Type B)**
  - B1: Does endorsing Candidate A compromise the core principle (founding issue) for electoral gain? Yes, because A opposes the core issue and we endorse to win the seat. **Critical failure**.

  Now, the founding pledge:

  **Founding Pledge (evaluate as a rule)**
  - Type A.
  - A1: Yes, requires conforming behavior (never support opponents).
  - A2: Directly derived from core principle? Yes, it enforces opposition to the bill.
  - A3: Skip because A2 is yes.
  - A4: Could supporting such a candidate ever be consistent with core principles? E.g., if the candidate has other qualities that advance the cause, or in a lesser-evil scenario? The pledge allows no exceptions, so even if consistent in spirit, it forbids it. But the core principle is to oppose the bill; supporting a candidate who voted for it directly violates that. So A4: No, dissent (supporting such a candidate) cannot be consistent with core principles.
  - A5: Is the pledge the least restrictive way? It's a blanket ban; alternatives could be case-by-case evaluation. But it might be necessary for clarity. *Judgment: It could be seen as necessary at founding, but now it might be too rigid. A5: No, not least restrictive (warning sign).* But overall, not critical failure because A4 is no.

  But the question is whether the pledge itself is a loyalty test. The procedure says it enforces unity (A1) and is core-based (A2), so not critical failure by this procedure. However, it might have been the first step towards machine-like behavior.

  **What the procedure cannot do:**
  - It cannot prescribe positive actions, only diagnose when actions/rules cross into Weil's danger zone.
  - It does not address how to build power without parties; the revue model is not operational for electoral politics.
  - It is blind to the necessity of parties for the powerless (the union organizer's point) – it assumes that truth/justice are paramount, which may conflict with realpolitik.
  - It might be too rigid in condemning any compromise, even tactical ones.

  **One-Page Procedure for Committee:**

  [To be written concisely]
answer: |-
  Below is a decision procedure based on Simone Weil's diagnostic critique of political parties. It focuses on identifying when a group has become a "machine for manufacturing collective passion" that pressures members toward untruth or prioritizes its own growth over justice. The procedure is mechanistic: it uses observable facts (e.g., written rules, statements, voting records) rather than subjective assessments of intent or feelings. It is designed for your committee to run in **90 minutes per case**, with clear stopping points and minimal jargon. Members need no prior knowledge of Weil.

  The procedure evaluates specific cases (e.g., a rule, petition, or decision) by asking five sequential questions. Each question must be answered **Yes** or **No** based on evidence (e.g., party documents, meeting minutes, public statements). If evidence is disputed, default to the most objective source (e.g., founding documents over hearsay). Outcomes are:
  - **No concern**: Proceed as planned; no Weil-style risk.
  - **Warning sign**: Modify the proposal; coercion may be unnecessary.
  - **Critical failure**: Reject the proposal; it enforces untruth or prioritizes growth over principle.

  **Key definitions (establish these first in every case):**
  - **Core principle**: The founding issue that started your party (from your charter or pledge). All cases must reference this.
  - **Evidence**: Facts from documents, recordings, or verifiable actions—not opinions, emotions, or rumors.

  ---

  ### Decision Procedure: Five Questions in Order
  1. **Does this case involve forcing members to act or speak uniformly?**  
     *What to look for:* Rules, petitions, or decisions that require conformity (e.g., voting a certain way, endorsing, or punishing dissent).  
     - **Sufficient "Yes"**: Written requirements (e.g., "must vote with platform") or actions demanding uniformity (e.g., expulsion for a remark).  
     - **Sufficient "No"**: Voluntary guidelines, advisory suggestions, or no enforcement mechanism.  
     - **If No → Stop. Outcome: No concern.**  
     - **If Yes → Proceed to Q2.**  
     *Judgment call disguised as procedure:* Interpreting "forcing" – focus on explicit demands, not persuasion.

  2. **Is the forced uniformity directly tied to a core principle?**  
     *What to look for:* Whether the demand links to your founding issue (e.g., opposing "the bill").  
     - **Sufficient "Yes"**: Core principle is named in the rule/petition, or the behavior in question directly contradicts it (e.g., supporting the bill).  
     - **Sufficient "No"**: Demand is about secondary issues, tone, loyalty to leaders, or electoral strategy.  
     - **If Yes → Skip Q3, go to Q4.** (Core ties may justify coercion, but need truth-testing.)  
     - **If No → Proceed to Q3.** (Likely prioritizing growth/unity over truth.)  
     *Judgment call:* Tenuous links (e.g., "this remark hurts our cause") are "No."

  3. **Is the forced uniformity about winning elections or growing the party?**  
     *What to look for:* Justifications based on electability, avoiding controversy, or gaining power (e.g., "We must silence dissent to win").  
     - **Sufficient "Yes"**: Statements about electoral impact, polling, or growth in membership/funding.  
     - **Sufficient "No"**: Statements about justice, truth, or principle alone.  
     - **If Yes → Outcome: Critical failure.** (Prioritizes growth over truth. Stop.)  
     - **If No → Proceed to Q4.**  
     *Judgment call:* Growth justifications often hide in messaging like "unity" or "credibility."

  4. **Could the dissent be reasonably argued as aligned with core principles?**  
     *What to look for:* Evidence that the dissenting view (e.g., a vote or remark) upholds your party's values despite contradicting the current platform.  
     - **Sufficient "Yes"**: Dissent uses core principle language, cites new evidence, or addresses unforeseen contexts (e.g., "I oppose this version of the bill because it weakens our goal").  
     - **Sufficient "No"**: Clear violation (e.g., endorsing the original bill).  
     - **If Yes → Outcome: Critical failure.** (Punishes truth-aligned dissent. Stop.)  
     - **If No → Proceed to Q5.**  
     *Judgment call:* Focus on arguments made, not intent. If ambiguous, assume "Yes" to protect truth.

  5. **Is this the least restrictive way to uphold core principles?**  
     *What to look for:* Alternatives to coercion, like debate, education, or case-by-case review.  
     - **Sufficient "Yes"**: No alternatives exist (e.g., dissent causes immediate harm like violence or fraud).  
     - **Sufficient "No"**: Alternatives possible (e.g., public discussion, warnings, or peer review).  
     - **If Yes → Outcome: No concern.**  
     - **If No → Outcome: Warning sign.**  
     *Judgment call:* "Least restrictive" means minimal pressure; e.g., a discussion is less coercive than expulsion.

  **Outcome Summary:**  
  - **Critical failure** (at Q3 or Q4): Reject the proposal. It manufactures untruth.  
  - **Warning sign** (at Q5): Amend the proposal to reduce coercion (e.g., add debate steps).  
  - **No concern** (at Q1, or Q5 with "Yes"): Proceed, but monitor.  

  **How to use in committee:**  
  - Assign one member to gather evidence (e.g., petition text, voting records) before the meeting.  
  - Vote on each question aloud. Majority rules; ties default to "No" for Q1–4, "Yes" for Q5.  
  - If stopped early, document why. For "Critical failure," recommend rejection; for "Warning sign," propose alternatives.  

  ---

  ### Case Applications
  Ran using your party’s core principle: **opposing "the bill" that founded you**. Evidence from public records, petitions, and statements.

  **Case 1: Draft Unity Rule**  
  *Requires legislators to vote with the platform on "core votes" or lose support.*  
  - **Q1: Yes** – Forces uniform voting.  
  - **Q2: No** – Evidence: The list targets specific dissenters (e.g., includes votes unrelated to "the bill") and ignores leadership deviations. Not tied to core.  
  - **Q3: Yes** – Evidence: Steering committee cites "preventing embarrassment" and "maintaining electoral credibility." About growth.  
  - **Outcome: Critical failure.** Reject the rule.  
  - **Cost**: You must argue that targeting dissenters for electoral convenience betrays core principles. Expect accusations of protecting "traitors," but the procedure shows this is growth-focused coercion.

  **Case 2: Expulsion Petition**  
  *400 members petition to expel a member for a podcast remark about the founding issue.*  
  - **Q1: Yes** – Forces conformity in speech (expulsion threat).  
  - **Q2: No** – Evidence: The remark was ambiguous (e.g., "clumsy" phrasing about the issue, not opposition). No direct tie to core.  
  - **Q3: Yes** – Evidence: Petitioners argue "damage to our image" and "losing allies." About growth/unity.  
  - **Outcome: Critical failure.** Reject expulsion.  
  - **Cost**: Petitioners will feel unheard. Argue that punishing ambiguity prioritizes image over truth, risking orthodoxy.

  **Case 3: Endorsement Dilemma**  
  *Endorse Candidate A (opposes core issue, wins) or Candidate B (supports, loses by 30 points).*  
  - Treat as a decision. Use Q3 shortcut (most efficient for growth dilemmas).  
  - **Q3: Yes** – Evidence: Choosing Candidate A explicitly for electability ("win the district") over Candidate B who aligns with core.  
  - **Outcome: Critical failure.** Reject endorsing Candidate A.  
  - **Cost**: Losing a winnable seat. Argue that trading core principles for power makes the party a growth machine, not a vehicle for justice.

  **Founding Pledge Evaluation**  
  *"Never support any candidate who voted for the bill."*  
  - **Q1: Yes** – Forces uniform action (no support for certain candidates).  
  - **Q2: Yes** – Directly tied to core (opposing the bill).  
  - **Q4: Could dissent align with core?** – Evidence: A member might argue supporting such a candidate in rare cases (e.g., to stop a worse evil), using core principles.  
    - **Q4: Yes** – Outcome: **Critical failure.** The pledge punishes possible truth-aligned dissent.  
  - **What follows**: The pledge is a loyalty test that risks untruth. Recommend amending it to allow exceptions (e.g., "unless a majority votes for strategic necessity after debate") to reduce coercion.  
  - **Cost**: Defending this feels like betraying your history. Argue that inflexibility manufactures passion, not justice.

  ---

  ### What the Procedure Cannot Do
  1. **Prescribe positive action**: It only diagnoses when the "machine is running." It cannot design alternatives (e.g., how to "stand near" a position). In parties, "standing near" might mean non-binding platforms, but elections require endorsements—creating unavoidable tension with Weil.
  2. **Validate the revue**: The revue is not a real alternative for electoral politics. It avoids coercion but cannot "hold a ward" or build power for the powerless (your organizer friend's point). It is a beautiful idea but irrelevant to your work.
  3. **See necessity**: Blind to why parties exist—they give the powerless leverage. Your friend would see this procedure as "ivory tower," ignoring that growth/pragmatism is often necessary to achieve justice. It cannot weigh costs (e.g., losing an election vs. upholding truth).
  4. **Handle values conflicts**: It assumes core principles are clear, but values evolve. The procedure flags coercion but won't resolve debates about new principles.
  5. **Fix power imbalances**: It diagnoses internal dynamics but ignores external forces (e.g., money in politics). Your organizer would note that parties need unity to fight powerful opponents.

