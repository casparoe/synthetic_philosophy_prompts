  Hugo's dramatization through characters can show the human side of these abstract ideas. For example, Valjean's transformation after the bishop's act of mercy demonstrates justice empowered by grace, which Pascal might see as miraculous. Javert embodies the tyranny of force without questioning its justice, leading to his crisis when mercy disrupts his belief system.

