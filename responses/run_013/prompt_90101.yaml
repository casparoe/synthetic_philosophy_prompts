  Original sin is central to both. Pascal sees it as the reason for the justice-force problem, while Hugo shows characters struggling with inherent brokenness but also capable of redemption through grace, like Valjean. Hugo’s emphasis on social issues suggests systemic injustice as a form of original sin, expanding beyond individual morality.

