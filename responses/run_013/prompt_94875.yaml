prompt: |-
  I sit on the commission that runs local elections in my city, and we keep having to draw the line on who counts as one of us for voting purposes. Our record so far: non-citizen residents who've been here five years or more — yes, they vote; citizens who moved abroad and kept no property or family here — no vote; adults under full guardianship for a cognitive disability — yes, they vote; people who own a second home here and pay our property tax but live somewhere else — no vote; 16- and 17-year-olds — yes, in municipal elections. I couldnt tell you what rule we've actually been running, and honestly I'm not sure there is one.

  Now we've got a referendum coming on a flood-defence scheme, and the town across the river — same country, different municipality — is going to get hit by it: our reservoir changes their water levels and their insurance premiums, and the way the scheme is drafted our water utility would bill their households a small annual levy for the works. They're not on our electoral roll, our bylaws dont bind them, and their own council pays for their own mitigation. Should they get to vote in our referendum? Tell me what we should do to stay consistent with ourselves, what the candidate principles are and what each one predicts here, which of our past calls is the closest analog, and if the record really doesn't settle it, what we'd be buying with each choice — plus what further case would best show which principle we're really running.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're part of a commission that decides voting eligibility for local elections, and they've made various decisions in the past without a clear rule. Now they have a referendum on a flood-defence scheme that affects a neighboring town, and they need to decide if residents from that town should vote. 

  First, I need to list their past decisions to find patterns. Non-citizen residents with 5+ years can vote, citizens abroad without ties can't, adults under guardianship can, non-resident property owners can't, and 16-17-year-olds can in municipal elections. The user admits there's no clear rule, so I should identify underlying principles here.

  Looking at their decisions, the common thread seems to be "substantial daily life impact." Non-citizen residents live there long-term, so they're affected. Citizens abroad aren't impacted daily. Adults with disabilities still live there and face local issues. Property owners who don't live there aren't directly affected by daily community life. Letting 16-17-year-olds vote in local elections might be about engaging youth in issues that affect them now. 

  Now, the flood defense referendum. The neighboring town will face higher water levels and insurance costs, plus a levy from the user's utility. The key points: they're outside the municipality, not on the electoral roll, and their own council handles mitigation. But the project directly impacts their daily lives through financial costs and environmental changes. 

  The closest analog is the non-resident property owners. They pay property taxes but can't vote because they don't live there daily. However, the neighboring town residents are affected in a more direct, ongoing way—like higher insurance and annual levies. But they don't participate in the community daily. 

  So the tension is between "impact" and "community membership." If they prioritize impact, letting them vote makes sense. If they prioritize community membership (residency), then no. 

  The user needs consistency. Their past decisions leaned towards community membership, except maybe the minors. But minors live there. So sticking with residency would mean no vote for the neighbors. However, the impact here is significant and direct, unlike the property owners who chose to invest but don't live there. 

  Further cases to test principles: What about commuters using local infrastructure? If they don't vote, that reinforces community membership. If a local decision severely affects a nearby area's environment, and they can't vote, it shows that impact alone isn't sufficient without residency. 

  Ultimately, the commission should decide based on whether they want to prioritize affected parties or strict municipal boundaries. If they choose to allow the vote, it shifts towards impact-based eligibility, which might open up future precedents. If not, they maintain residency as the core principle.
answer: |-
  Based on your commission's past decisions and the need for consistency, here's the breakdown for the flood-defence referendum involving the neighboring town:

  ### 1. **Recommended Decision: No, they should *not* get to vote**
     - **Consistency:** Your history prioritizes **municipal residency and direct integration into the local community** over tangential connections (like non-resident property owners) or abstract impacts (like citizens abroad). The neighboring town residents lack residency, pay taxes to their own municipality, and are governed by their own council—paralleling your "no vote" for non-resident property owners and expatriates.

  ---

  ### 2. **Candidate Principles from Your Record**
  Your decisions reveal two competing principles, with **Principle A dominating**:

  | Principle              | Core Logic                                | Past Decisions Supporting It          | Prediction for Neighboring Town |
  |------------------------|------------------------------------------|---------------------------------------|----------------------------------|
  | **A. Community Membership & Residency** | Voting requires active daily life participation in the municipality. | Non-resident property owners (❌), citizens abroad (❌), 16/17-year-olds *living there* (✅) | **❌ No vote** (Not residents) |
  | **B. Substantial Impact** | Voting rights extend to those significantly affected by decisions. | Non-citizen residents (✅), adults under guardianship (✅) | **✅ Vote** (They bear costs) |

  **Principle A (Residency)** is stronger in your record: You rejected voting for citizens abroad (impacted by national policies) and property owners (financially invested), favoring *physical presence*. Principle B (Impact) appears secondary, only applying *within* your residency boundary.

  ---

  ### 3. **Closest Analog: Non-Resident Property Owners**
     - **Why it fits best:** Like the neighboring town, property owners have a financial stake (paying taxes) but no daily residency. You excluded them, signaling that **financial impact alone is insufficient** without community membership. The levy on the neighboring town is similar—a financial burden without residency.
     - *Distant analog:* Citizens abroad (impacted but disconnected) or non-citizen residents (integrated but non-traditional voters). Neither aligns as closely.

  ---

  ### 4. **What You're "Buying" with Each Choice**
  - **Allow the Neighboring Town to Vote (✅):**
    - **Pros:** Acknowledges real-world impact and promotes regional cooperation; may reduce legal challenges over cross-border effects.
    - **Cons:** **Undermines your residency principle**, sets precedent for non-resident voting in future referendums (e.g., commuters, business owners), complicates electoral logistics, and dilutes local accountability.

  - **Exclude the Neighboring Town (❌):**
    - **Pros:** **Upholds consistency** with prior residency-based exclusions, maintains clear municipal boundaries, and avoids slippery slopes.
    - **Cons:** Ignores tangible costs imposed on outsiders, risks perception of unfairness, and may strain inter-municipal relations.

  ---

  ### 5. **Test Case to Clarify Your Principle**
  To resolve whether **Principle A (Residency)** or **Principle B (Impact)** truly dominates, consider this hypothetical:
  > *A massive solar farm is proposed on your city's border. It would cause significant light pollution/noise for a village in a neighboring municipality but provide clean energy revenue exclusively to your city. The village residents petition to vote in your referendum.*

  - **If you grant them a vote:** You prioritize **Principle B (Impact)**, confirming your commission values affected parties beyond borders. This would conflict with your past exclusion of non-resident property owners.
  - **If you exclude them:** You reinforce **Principle A (Residency)**, proving impact alone is never sufficient. This aligns with your history and justifies excluding the flood-affected town.

  ---

  ### Final Recommendation
  **Reject the neighboring town's voting eligibility** to stay consistent with your residency-centered precedent. Your commission has consistently treated municipal boundaries as voting boundaries—even for those with financial stakes (property owners) or emotional ties (expatriates). The flood levy, while impactful, doesn't override your established requirement for physical community membership. 

  If cross-border effects are a growing concern, advocate for **inter-municipal agreements or regional voting frameworks**—but don't compromise your existing logic. Your record shows residency is your "bright line," and crossing it now would create greater inconsistency than the alternative.
