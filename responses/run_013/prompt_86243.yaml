answer: |-
  ### Decision Procedure for Causal Relevance of High-Level Features

  Below is a step-by-step decision procedure to determine if a high-level feature (e.g., a direction in activation space) is causally relevant ("pushes the substrate") or epiphenomenal. The procedure prioritizes empirical tests (ablations, patching, causal tracing) and minimizes interpretive steps. It stops early if a definitive answer is found, flags judgment calls, and specifies when to hand off to humans. Thresholds (e.g., 70% success) are adjustable based on context.

  ---

  #### **Step 1: Define the Feature and Fidelity**  
  **Question**: Is the feature robustly measurable?  
  **Method**:  
  - Use the probe to compute the feature value for 50+ diverse inputs (e.g., legal/non-legal documents).  
  - Measure agreement between the probe and human labels (e.g., AUC-ROC, F1 score).  
  **Sufficient Answer**:  
  - AUC-ROC ≥ 0.85 → Proceed to Step 2.  
  - AUC-ROC < 0.85 → **Stop. Feature is too noisy** (likely not reliable).  
  **Judgment Call**: Threshold choice (0.85 balances rigor/pragmatism).  

  #### **Step 2: Necessity Test (Ablation)**  
  **Question**: Is the feature necessary for the behavior?  
  **Method**:  
  - Ablate the feature by projecting activations orthogonally to the feature direction at layer \(L\).  
  - Test on 20+ inputs where the behavior occurs (e.g., model correctly classifies as "legal contract").  
  - Measure change in target behavior (e.g., accuracy drop, logit shift).  
  **Sufficient Answer**:  
  - Behavior degrades significantly (e.g., accuracy drop ≥ 40%) → Proceed to Step 3.  
  - Minimal degradation (accuracy drop < 10%) → **Stop. Feature is epiphenomenal**.  
  - Inconclusive (10–40% drop) → Proceed but flag for human review later.  
  **Judgment Call**: Degradation threshold; choice of \(L\) (default: layer where probe is applied).  

  #### **Step 3: Sufficiency Test (Patching)**  
  **Question**: Is the feature sufficient to induce the behavior?  
  **Method**:  
  - Patch the feature: For 20+ inputs where the behavior **does not occur** (e.g., non-legal docs), add the feature direction to activations at layer \(L\).  
  - Measure if behavior appears (e.g., model now classifies as "legal contract").  
  **Sufficient Answer**:  
  - High success rate (≥70%) → Proceed to Step 4.  
  - Low success rate (<30%) → **Stop. Feature is necessary but not sufficient** (likely part of a larger mechanism).  
  - Mixed (30–70%) → Proceed but flag instability.  
  **Judgment Call**: Success threshold; magnitude of patching (use mean feature strength from positive examples).  

  #### **Step 4: Causal Tracing (Downstream Dependence)**  
  **Question**: Does downstream computation depend on the feature?  
  **Method**:  
  - Use causal tracing: Corrupt activations for a subset of layers **after** \(L\) in non-legal inputs, then patch the feature at \(L\).  
  - Measure if patching still induces the behavior.  
  - If patching fails, corrupt layers **before** \(L\) and re-patch at \(L\).  
  **Sufficient Answer**:  
  - Patching works **only** when layers after \(L\) are intact → Proceed to Step 5.  
  - Patching fails unless layers before \(L\) are intact → **Stop. Feature is a side effect** (not causal).  
  - Inconclusive → Hand off to human review.  
  **Judgment Call**: Deciding which layers to corrupt; interpreting dependencies.  

  #### **Step 5: Stability & Specificity Check**  
  **Question**: Is the feature stable and specific?  
  **Method**:  
  - Test patching (Step 3) on OOD data (e.g., ambiguous docs, adversarial examples).  
  - Check if patching **only** affects the target behavior (e.g., does not alter unrelated outputs).  
  **Sufficient Answer**:  
  - Success rate ≥ 60% on OOD data **and** no major side effects → **Feature is causally relevant**.  
  - Success rate < 40% or severe side effects → **Feature is causal but unreliable** (use with caution).  
  - Ambiguous → Hand off to human review.  
  **Judgment Call**: Defining "side effects"; OOD dataset selection.  

  #### **Handoff to Humans**  
  - Occurs at Step 5 if results are ambiguous, or if engineers dispute thresholds.  
  - Humans must weigh:  
    - Engineering constraints (e.g., is the feature too unstable for production?).  
    - Broader goals (e.g., does the feature align with safety objectives?).  
  - **Output**: Binary decision (causal/epiphenomenal) + risk assessment.  

  ---

  ### Case Studies

  #### **Case 1: Clean Pass (Legal Contract Feature)**  
  - **Step 1**: AUC-ROC = 0.92 → Proceed.  
  - **Step 2**: Ablation drops accuracy from 98% to 45% → Proceed.  
  - **Step 3**: Patching success = 85% → Proceed.  
  - **Step 4**: Patching works only when layers after \(L\) are intact → Proceed.  
  - **Step 5**: OOD success = 75%, no side effects → **Causal**.  
  - **Verdict**: Legitimate causal lever. Engineers can use it for interventions (e.g., amplifying/suppressing for compliance checks).

  #### **Case 2: Fail (Grammar-Checking Feature)**  
  - **Step 1**: AUC-ROC = 0.78 → **Stop**. Feature too noisy.  
  - **Verdict**: Epiphenomenal. Probe likely captures correlated noise (e.g., sentence length), not grammar. Focus on neuron-level analysis.

  #### **Case 3: Engineers Won’t Like It (Unstable "Financial Risk" Feature)**  
  - **Step 1**: AUC-ROC = 0.89 → Proceed.  
  - **Step 2**: Accuracy drops 50% → Proceed.  
  - **Step 3**: Patching success = 65% → Flagged instability but proceed.  
  - **Step 4**: Clear downstream dependence → Proceed.  
  - **Step 5**: OOD success = 40%; patching causes false positives in medical docs → **Causal but unreliable**.  
  - **Verdict**: The feature *is* causal (it pushes activations), but it’s entangled with other concepts. Engineers dislike it because interventions may be unpredictable. Procedure forces acknowledgment: it’s not epiphenomenal, but unsafe to use directly. Mitigation: Use it with guardrails or decompose further.

  ---

  ### What the Procedure Cannot Settle  
  1. **Ontology Debates**: It won’t resolve whether the feature "truly exists" (Hofstadter’s careenium dilemma). It only tests *interventionist causality* (Woodward 2003).  
  2. **Feature Decomposition**: If a feature is causal but messy (Case 3), it doesn’t reveal if a cleaner subfeature exists.  
  3. **Model Intent**: It can’t distinguish if the feature is "used intentionally" by the model or is an emergent hack.  
  4. **Long-Term Effects**: Tests are short-term; cascading impacts of interventions (e.g., on downstream layers) may require iterative checks.  

  ### Does the Careenium Picture Earn Its Keep?  
  - **Yes, pragmatically**: The procedure shows that high-level features *can* act as causal clusters that "push marbles" (e.g., patching alters model behavior predictably).  
  - **But not philosophically**: It doesn’t prove features are fundamental; they might be overparametrized flukes.  
  - **Recommendation**: **Interventionism wins**. For engineering, abandon metaphysics. If a feature passes the tests, treat it as causal *for practical purposes*. The careenium is a useful metaphor to justify abstraction layers, but interventions define causality here.  

  ### Final Output for Team  
  - **Causal**: Use for interventions (e.g., steering, adversarial robustness).  
  - **Epiphenomenal**: Ignore or use only for monitoring.  
  - **Unstable Causal**: Use with safeguards, or iterate to find better features.  
  - **Time Estimate**: 1–3 days per feature (empirical steps are parallelizable).
