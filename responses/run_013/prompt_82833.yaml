  ### Candidate Rules Fitting All Prior Verdicts
  Your friend's verdicts suggest that supererogation depends on three key factors:
  1. **Absence of duty**: The act must not be required by a special relationship (e.g., parent-child), professional role, or basic moral duty (e.g., honesty).
  2. **Permissibility**: The act must not violate other moral duties (e.g., not harming others or using impermissible means).
  3. **Benefit and cost**: The act must benefit others and involve significant cost to the agent (though the threshold for "significant cost" is ambiguous from the cases).

  Two candidate rules fit all prior verdicts equally well. They differ primarily on whether the "permissibility" condition includes avoiding substantial harm to third parties (like family) without consent.

  - **Rule 1: Duty-Based Permissibility**
    - **Conditions for supererogation**:
      - The act is not required by any duty (special, professional, or basic).
      - The act is permissible, meaning it does not violate other duties (including duties to third parties, such as family obligations).
      - The act benefits others at significant cost to the agent.
    - **Rationale**: This rule emphasizes that duties to close others (e.g., family) can make an act impermissible if it imposes significant burdens on them without consent. It fits case 6 (embezzling for charity is impermissible due to violating duties to the employer) and case 4 (parental duty requires saving a child). Case 8 (charity not required) implies that giving is supererogatory only if it doesn't violate other duties (e.g., to dependents). Cost must be "significant" based on cases 1–3 (health risk, injury, financial loss), but case 8 allows for lower costs (e.g., modest charity donations) if no duties are violated.
