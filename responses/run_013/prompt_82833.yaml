  - **Rule 2: Inherent Permissibility**
    - **Conditions for supererogation**:
      - The act is not required by any duty (special, professional, or basic).
      - The act is inherently permissible, meaning it doesn't involve intrinsically wrong means (e.g., theft or deception).
      - The act benefits others at significant cost to the agent.
    - **Rationale**: This rule focuses on the act itself being morally neutral or good, regardless of consequences for third parties. It fits case 6 (embezzling is inherently impermissible due to theft) but allows for supererogation if the act isn't inherently wrong, even if it indirectly harms others. Case 3 (giving away savings with no dependents) shows that cost to the agent alone doesn't make it impermissible; harm to others must stem from the act's inherent wrongness. Cost is "significant" in cases 1–3 but flexible for case 8 (charity). Motives don't affect supererogation status (only praiseworthiness), as seen in cases 1–3 where motives are unstated or mixed.
