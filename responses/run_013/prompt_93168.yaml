prompt: |-
  I host a small podcast on decision theory and ethics (a few hundred listeners, mostly grad students). Next month's guest is a philosopher who's worked on Harsanyi's aggregation theorem for years, and she's bringing a line I want to push on. Her reading is that the theorem is almost always read wrong: on her view it isn't a proof of utilitarianism at all — it's a proof that if you make the social ranking satisfy the expected-utility axioms, then the only way to satisfy even a weak Pareto condition is a weighted sum of individual von Neumann–Morgenstern utilities, where the weights just are the social observer's own credences about being each person. So the "how much does each person count" question turns out, for her, to be an epistemic question about a hypothetical gamble rather than a moral one — and she's happy to say social welfare is observer-relative. I think thats either trivially true or a reductio.

  Draft me eight to ten interview questions. I want at least one each on:

  - whether putting the expected-utility axioms on the social ranking is itself a substantive moral assumption (the old objection that it bakes in a "before the coin lands" conception of fairness), and why she thinks that isn't where the theorem is weakest;
  - what actually happens to the weights once you drop the assumption that the observer is equally likely to be anybody — i.e., whether utilitarianism was ever inside the theorem or only ever came out of an extra impartiality premise;
  - the antisocial-preferences problem (the sadist who gets utility from other people's misery), and whether Harsanyi's own fix of splitting personal preferences from moral ones does any real work or just relabels the difficulty;
  - the case where two people's utilities can't be compared at all, and whether the theorem needs genuine interpersonal comparability or only the comparability of an observer's "extended" preferences across whoever she might turn out to be;
  - and one on whether her observer-relative reading can tell an actual government anything, or whether it quietly makes the whole thing useless for policy.

  For each of those, add a follow-up keyed to the answer she's most likely to give, so I'm not stuck when she says the obvious thing.

  One more thing: when you hand me the questions, tell me which of the claims packed into them are settled versus genuinely contested among people who actually work on Harsanyi — I don't want to walk on stage and assert some contested reading as if it were the standard one.
reasoning: |-
  Okay, the user hosts a small podcast on decision theory and ethics and is preparing for an interview with a philosopher who has a unique interpretation of Harsanyi's aggregation theorem. The user wants to challenge her view and has specific areas to cover. Let me break this down.

  First, the guest's position is that the theorem is misinterpreted: it's not a proof of utilitarianism but shows that the social ranking must be a weighted sum of individual utilities based on the observer's credences about being each person. The user thinks this is either trivially true or a reductio. The main areas to address are:

  1. Whether applying expected utility axioms to social ranking is a moral assumption. The user mentions the fairness objection. Need to ask why she doesn't see this as the weakest point.

  2. What happens to the weights if the observer isn't equally likely to be anyone. This questions if utilitarianism requires an extra impartiality step.

  3. The antisocial preferences problem. Does splitting personal and moral preferences solve anything?

  4. Whether interpersonal utility comparisons are needed or if extended preferences suffice.

  5. If the observer-relative view is useful for policy or makes it irrelevant.

  The user also wants follow-ups for each and needs to know which aspects are contested among experts. 

  For the first point, the expected utility axioms on social ranking: this is contested. Some like Weymark argue it's a moral commitment. The guest might counter that it's about rational consistency. Follow-up should press on whether rationality here assumes neutrality to risk distribution, which is moral.

  Second, the weights and impartiality. The equal weight case is standard but assumes anonymity. If the observer has asymmetric credences, weights differ. Follow-up: if asymmetric weights are acceptable, how does that align with moral equality? This is debated; some see the veil of ignorance as essential.

  Third, antisocial preferences. Harsanyi's fix of separating preferences is contested. Does it just relabel the problem? Follow-up: if preferences are split, who defines moral preferences? This risks circularity.

  Fourth, interpersonal comparability. Harsanyi uses extended preferences, avoiding direct comparison. But is this sufficient? Mongin's critique says extended preferences still need a common scale. Follow-up: if comparability is observer-dependent, can two observers disagree? This is contested—some like Binmore support extended preferences, others like Hausman doubt it.

  Fifth, policy relevance. Observer-relative weights seem subjective, making policy advice difficult. Follow-up: can the observer represent society? If not, the theorem's applicability is limited. This is a major critique from policy-oriented scholars.

  The user needs to avoid presenting contested points as settled. Key contested areas: the moral status of EU axioms, whether extended preferences solve comparability, if separating preferences handles antisocial cases, and the theorem's policy relevance. The guest's view itself is a minority position, adding another layer.

  The user's deeper needs: they want to challenge the guest effectively without misrepresenting the field. They need to expose weaknesses in her argument while staying informed on scholarly debates. Ensuring questions are precise with targeted follow-ups will keep the interview rigorous. Highlighting contested points helps the audience understand the landscape.
answer: |-
  Here are 10 interview questions with follow-ups, designed to probe your guest's position while flagging contested areas. Key scholarly disputes are noted under each question.

  ### Core Questions & Follow-Ups
  1. **On the EU Axioms as Moral Assumption**  
     *Question:* "You argue that imposing expected utility axioms on the *social ranking* isn’t a moral choice but a rational constraint. But critics (like Marc Fleurbaey or John Broome) say it smuggles in risk-neutrality and ‘ex ante’ fairness — e.g., it forces indifference between a 50% chance of everyone starving vs. a 50% chance of everyone thriving. Why isn’t *this* the theorem’s weakest link?"  
     **→ Follow-up if she defends rationality:** "If the EU axioms encode a specific attitude toward risk distribution (e.g., aggregating utilities linearly), isn’t that *itself* a moral stance — one that precludes fairness concerns about how risk is *borne*?"  
     *🎯 Contested:* **Yes.** Whether EU axioms are "purely rational" or morally loaded for social choice is hotly debated (Weymark 1991; Mongin & d’Aspremont 1998).

  2. **Weights & Impartiality**  
     *Question:* "Harsanyi’s ‘veil of ignorance’ is often read as requiring *equal* weights. But you emphasize the weights are the observer’s *subjective credences*. If the observer believes they’re 90% likely to be Elon Musk, does the theorem endorse giving Musk 90% of the social weight? And does this mean utilitarianism’s ‘equal consideration’ was never in the theorem — only added via extra premises?"  
     **→ Follow-up if she agrees:** "If asymmetric weights are coherent within the theorem, doesn’t this undermine Harsanyi’s claim to ground *impartial* morality? Or is impartiality just one possible observer stance?"  
     *🎯 Contested:* **Yes.** Whether the veil *requires* equal probability (and thus equal weights) is disputed. Many (e.g., Greaves 2017) argue equal probability is essential; your guest’s view is minority.

  3. **Antisocial Preferences**  
     *Question:* "Harsanyi proposed splitting ‘personal’ preferences (for your own welfare) from ‘moral’ preferences (impartially considered). But if a sadist’s *personal* utility spikes when others suffer, and we exclude this as ‘non-moral,’ haven’t we just relabeled the problem? What work does this split actually do beyond defining away troublesome preferences?"  
     **→ Follow-up if she endorses the split:** "Who decides which preferences count as ‘moral’? If it’s the observer again, doesn’t this make the theory vacuously flexible — e.g., an observer could deem only *their* tribe’s utilities ‘moral’?"  
     *🎯 Contested:* **Yes.** Harsanyi’s fix is widely seen as ad hoc (Roemer 1996). Whether it resolves antisocial preferences without circularity is unresolved.

  4. **Interpersonal Comparability**  
     *Question:* "You suggest utilities needn’t be interpersonally comparable — only ‘extended preferences’ over ‘being person A in state X’ matter. But if I can’t compare A’s pain to B’s joy directly, how can I coherently weigh them *as the observer*? Isn’t the claim that ‘extended preferences avoid comparability’ just semantics?"  
     **→ Follow-up if she denies direct comparability:** "If two observers rank ‘being A vs. being B’ differently (e.g., one prefers being A in poverty to B in comfort), does Harsanyi allow both social orderings? And if so, can this handle moral disagreement?"  
     *🎯 Contested:* **Yes.** Whether extended preferences resolve comparability (Binmore 2009) or presuppose it (Mongin 1994) is a key fault line.

  5. **Policy Relevance**  
     *Question:* "If social welfare is observer-relative, what can this tell a government? If policy depends entirely on the ruler’s credences (e.g., their belief about ‘being’ each citizen), doesn’t this collapse into subjectivism — making the theorem useless for democratic or objective policy?"  
     **→ Follow-up if she downplays policy use:** "Could the ‘observer’ represent an idealized societal perspective? If not, is Harsanyi’s theorem merely about *individual* rational choice under self-uncertainty, not *social* ethics?"  
     *🎯 Contested:* **Yes.** The theorem’s policy relevance is disputed, with critics (e.g., Hausman 1995) calling it "formal but empty" for real-world aggregation.

  ### Bonus Questions for Depth
  6. **On the Reductio Charge**  
     "You call the observer-relative weights a *feature*, but critics might say it’s a *reductio*: e.g., if a racist observer assigns near-zero credence to being minority members, the theorem endorses their tyranny. How do you block this?"  
     **→ Follow-up:** "Does Harsanyi’s framework have *any* resources to criticize such an observer, or is it purely descriptive of their preferences?"

  7. **Harsanyi vs. Rawls**  
     "Rawls rejected Harsanyi’s approach partly over risk attitudes (maximin vs. EU). Does your reading make their dispute purely about the observer’s risk aversion — or is there a deeper clash?"

  8. **Empirical vs. Normative**  
     "When the observer assigns credences about ‘being’ others, are these *empirical* beliefs (e.g., about probability) or *normative* stances (e.g., empathy)? How does this avoid the naturalistic fallacy?"

  ---

  ### Key Contested Claims Overview
  - **Settled**:  
    - The theorem *formally* implies a weighted VNM utility sum under its axioms.  
    - Pareto conditions + EU axioms force linear aggregation (Harsanyi’s proof is sound).  
  - **Genuinely Contested**:  
    - **EU axioms for social choice**: Moral commitment or rationality? (Weymark vs. Harsanyi).  
    - **Weights = credences**: Whether this is a *virtue* or *collapse into subjectivism* (consensus favors impartiality).  
    - **Extended preferences**: Sufficient for comparability? (Mongin’s critique is influential but not universal).  
    - **Antisocial preferences**: Can Harsanyi’s "moral/personal" split solve it? (Most say no).  
    - **Policy relevance**: Is observer-relativity fatal for applied ethics? (Split between formal and applied theorists).  

  Your guest’s epistemic reading is a **minority view** (championed by e.g., John Broome in *Weighing Lives*, but contested). Focus on her defense of observer-relativity — that’s the live wire. Good luck! 🎙️
