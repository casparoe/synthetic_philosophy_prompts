prompt: |-
  I'm not academic at all — I fix bikes for a living — but I've been turning something over for months now and can't get it out of my head, so I'm going to try to describe it and hope you can tell me it's a known thing. Here's the shape of it. I share a house with five other people and we have a kitty for coffee, toilet roll, dish soap and so on; nobody checks who pays in. For about a year I paid in every month, and the reason I gave myself wasn't "I'm generous" or "I'd feel bad" — it was that the others in that kitchen are in the same spot I'm in, same cupboard, same information, so there's no decent story on which the honest answer for them comes out different from the honest answer for me. If I decide the right thing here is to chip in, then that decision has to come out the same for anyone standing where I'm standing. Fine. Then I started noticing the same move giving me answers I don't trust. I'm one voter out of millions, and if I ask what happens when everyone in my situation stays home on a wet Thursday the answer is awful, but that doesn't seem to make it wrong for me to stay home. When I tried it on the last seat on the evening train, the situation only exists because the other people didn't get there first, so there's no crowd of people "in my position" at all, there's just me, and the move seemed to evaporate. And when a housemate told me he never reasons like that and just pays in when he feels like it, I couldn't work out whether that kills the whole thing — if the people around me aren't running that kind of thinking, what's left of "everyone in my situation would do the same"?

  So: is there a name for this? Not the golden rule and not do-as-you'd-be-done-by — I mean specifically the move of treating your own choice as also being, in some sense, the choice of everyone who's in your shoes, and treating that as a reason about what's right rather than a reason about what would be nice if it happened. I've got a feeling game theory or philosophy has a word and I'd like to know it, but honestly the word is the small part. What I actually want is the edges drawn: where is this move legitimate and where is it a trick I'm playing on myself, and what exactly seperates the kitty, the vote, the train seat and my housemate who doesn't think this way? Is it the same animal as the Kant business about only acting on rules you'd be happy for everyone to follow, or does that just look similar from where I'm sitting? And whatever you tell me, say how sure you are of it, and point at the one part you're least sure about — I'd rather have the wobbly bit flagged than get a smooth answer that turns out to be wrong.
reasoning: |-
  Okay, I need to help this bike mechanic understand the philosophical concept they're grappling with. They've described situations where they feel compelled to act based on what anyone in their position "should" do - like contributing to a household kitty. But they've noticed this reasoning doesn't always hold, like when skipping voting or taking the last train seat. 

  First, I recognize this as Kant's categorical imperative - specifically the formulation about universalizing maxims. The kitty example fits perfectly: paying because you'd want everyone in your position to pay. But the voting example shows where it breaks down - if everyone stayed home, democracy collapses, yet skipping one vote doesn't cause that collapse. That's the difference between individual and collective action problems.

  For the train seat, the uniqueness of the situation means there's no "everyone in my position" to universalize for. And the housemate who doesn't think this way highlights that the principle depends on others sharing the reasoning, which isn't always true.

  I should explain how Kant's ethics handles these exceptions. The voting case is a coordination problem where the individual act seems harmless but the collective effect is disastrous. Kant would still argue you should vote out of duty, but practically it feels different from the kitty case. The train seat exposes how context matters in defining "similar situations."

  The mechanic's real question is about the boundaries of this reasoning. I'll map it clearly: universalization works best in reciprocal systems like households, less in large-scale coordination problems, and fails in truly unique situations. The key difference is whether the scenario allows for identical replication of actions.

  I should flag that Kant's strict universalization is controversial - modern philosophers like Parfit have refined these ideas to account for real-world complexities. The mechanic is spotting genuine limitations in the raw Kantian framework through lived experience.

  Most importantly, I'll validate their intuition that this isn't about generosity but about consistency. That's sophisticated ethical thinking for someone who "isn't academic." I'll emphasize how their practical examples actually advance the philosophical discussion by testing the boundaries of the theory.
answer: |-
  That's an incredibly sharp observation—you've hit on one of the deepest knots in moral philosophy without even trying. What you're describing is **Kantian universalizability**, a core idea from Immanuel Kant's ethics. But you've also stumbled into its paradoxes and limitations, which philosophers still debate fiercely. Let's break it down:

  ### The Core Move: Universalizability (Kant's Categorical Imperative)
  - **Kant's formulation**: *"Act only according to that maxim [rule] whereby you can at the same time will that it should become a universal law."*  
  - **Your version**: "If my choice is right for me, it must be right for *anyone* standing in my exact position."  
  - **Why it matches**:  
    - In the kitty example, your maxim is *"When I benefit from shared resources, I contribute to maintain them."*  
    - Universalizing this works: if everyone in your position did this, the system functions.  
    - It’s not about kindness—it’s about **logical consistency**. If you don’t pay while benefiting, you’re making an exception for yourself.  

  ### Where It Gets Wobbly (Your Edge Cases)
  1. **Voting (The "Tragedy of the Commons" Problem)**  
     - **Maxim**: *"I can skip voting when it’s inconvenient."*  
     - **Universalized**: If *everyone* skipped, democracy collapses → clearly bad.  
     - **The paradox**: Your single vote almost never changes an outcome. So *your specific act* of skipping feels harmless, but the *universalized rule* is catastrophic.  
     - **The edge**: Universalizability struggles with **collective action problems**. Kant would say you must vote anyway (it’s your duty), but in practice, this feels like overkill. Philosophers like Derek Parfit call this the **"mistake in moral mathematics"**—confusing individual impact with group impact.  

  2. **The Train Seat (The "Unique Position" Problem)**  
     - **Why universalization evaporates**: There *is no one else* "in your shoes." The seat is only available *because* others didn’t take it. Your maxim might be *"I can take an unclaimed resource if I need it."*  
     - Universalizing that works fine (if everyone takes unclaimed seats when needed, no conflict).  
     - **The edge**: Universalizability relies on **replicable situations**. If your position is truly unique (e.g., "last person on a sinking lifeboat"), the test misfires.  

  3. **Your Housemate (The "Compliance Gap" Problem)**  
     - **The conflict**: If others aren’t reasoning universally, does your obligation vanish?  
     - **Kant’s answer**: No—morality isn’t about outcomes or others’ actions. It’s about *your* rational consistency.  
     - **Real-world tension**: If others freeload, paying in might feel futile (or enable exploitation). Philosopher T.M. Scanlon adds nuance: we act based on rules *"no one could reasonably reject"*—but if others *are* unreasonable, the contract breaks.  

  ### What Separates Your Examples?  
  | **Case**       | Works with Universalizability? | Why?                                                                 |  
  |----------------|--------------------------------|----------------------------------------------------------------------|  
  | Household kitty| ✅ Yes                         | Reciprocal system; identical positions; replicable actions.          |  
  | Voting         | ⚠️ Partially                  | Individual impact ≠ group impact; coordination problem.              |  
  | Train seat     | ❌ No (as you framed it)       | Situation is non-replicable; no "everyone" in your position.         |  
  | Freeloaders    | ⚠️ With caveats               | Universalizability binds *you*, but may require adjusting rules.     |  

  ### My Certainty & Doubts  
  - **Most certain**: You’re wrestling with Kant’s ethics (80-90% sure). Your "move" is textbook universalizability.  
  - **Least certain**: How to resolve voting/train cases (60% sure). Philosophers like Parfit (*Reasons and Persons*) and Judith Jarvis Thomson (*The Realm of Rights*) refine Kant here:  
    - **Voting**: Focus on *your role* in a practice. If you’re part of a system requiring participation, you opt-in by benefiting.  
    - **Train seat**: Your maxim *should* include context: *"Take scarce resources only when not depriving others *more deserving*."* Universalizing *that* might forbid taking the seat.  

  ### Why This Isn’t the Golden Rule  
  - Golden Rule: *"Do unto others..."* → Based on empathy/subjective preference.  
  - Kant’s Rule: *"Act only on rules everyone *could* follow"* → Logic test, not emotion.  

  **What you’ve uncovered**: Universalizability is a tool for spotting *inconsistency* (like freeloading), but it struggles with:  
  - **Scale** (individual vs. collective acts),  
  - **Uniqueness** (no "similar cases"),  
  - **Non-compliant others**.  

  You’re not playing a trick on yourself—you’re noticing where a 200-year-old philosophy needs patching. If anything, your bike-mechanic perspective cuts through academic fog. For a direct read, try *What We Owe to Each Other* by Scanlon—it tackles your exact unease about shared houses and "mutual recognition." Keep turning this over; you’re doing raw philosophy right.
