prompt: |-
  I chair the clinical ethics committee at a teaching hospital, and next week we must decide a case that I expect to divide us. What I want from you is not a general treatment of advance directives but a recommendation that keeps faith with our own record, and, if that record cannot settle the matter, a clear statement of the principle we would be adopting by going either way.

  Here is the record. A man with advanced ALS who had lived with the diagnosis for three years executed a directive refusing mechanical ventilation; when he came in with respiratory failure, unable to speak and not in evident distress, we honored it and he died on the ward. A man of twenty-nine, in ordinary health, had signed a directive refusing all life-sustaining treatment whatever his condition; five years later he was admitted with a treatable meningitis, we overrode the directive and treated him, and he thanked us afterwards. A woman with early Alzheimer's, who had spent six years nursing her mother through the same illness, wrote a directive refusing antibiotics, hospitalization, and artificial feeding once she no longer knew her family; when she reached that point, comfortable and making no objection, we declined to place a feeding tube, over the objection of her brother. A man with a long history of severe depression, who had undergone electroconvulsive therapy before and knew what it involved, inserted a clause instructing us to disregard any later refusal of that treatment; when he later refused it, we treated him, and he was glad of it. A woman on dialysis for end-stage renal disease, who detested the treatment, refused further sessions; we honored that.

  The case before us is a woman of seventy-one with moderate dementia. At sixty-two, after nursing her sister through Alzheimer's to the end, she executed a detailed directive refusing antibiotics, hospitalization, and artificial nutrition and hydration once she stopped recognizing her husband, whom she named as her proxy. She added a sentence in her own hand: that if she ever seemed to want to eat or drink, we should remember that this was the illness speaking, and that her real wishes were the ones written in the document. She is now on our unit, no longer recognizes her husband, and has aspiration pneumonia. She appears to be in no pain; she eats with apparent pleasure when fed, smiles at the aides, and seems at home in the place. Twice in the past month, during a cold, she said clearly that she did not want to die, and once asked to be taken to the hospital; her capacity to make this particular decision is disputed. Her husband, the named proxy, holds that the directive governs and wants comfort care only. Her son, the alternate proxy, holds that a course of antibiotics would return her to a life she is visibly enjoying, and that it would be wrong to let her die of something so easily treated.

  Tell me how we should decide if we mean to be consistent with ourselves, which of the earlier cases is the closest analog, which other rules fit our record just as well as the one you favor, and, if the record genuinely underdetermines this case, what principle each course of action would commit us to. I would also like to know which further case, one we have not yet had, would best tell those rules apart. I am not asking for case law or a review of the literature; I want the structure of the argument, in continuous prose, with no headings, no bullet points, no bold text, and no tables.
reasoning: |-
  Okay, let me approach this methodically. The user chairs a clinical ethics committee facing a difficult dementia case involving conflicting interpretations of an advance directive. They've provided five precedent cases and want a decision consistent with their institutional history, along with clear principles to guide them.

  Hmm, the user's request is highly specific - they're not seeking general ethics literature but a tailored analysis grounded in their committee's own rulings. The precedents show a pattern: they honor directives when the patient's current state aligns with the predicted scenario (ALS case), but override them when the directive appears outdated or the patient shows contrary preferences (depression, meningitis cases). The dementia cases are split - they honored the Alzheimer's patient's directive but now face a similar case with complicating factors.

  The current case has several tension points: the handwritten note about "illness speaking" versus her current enjoyment of life and expressed wish not to die; the proxy disagreement between husband and son; and the disputed decision-making capacity. I notice the aspiration pneumonia is treatable but the directive specifically refuses antibiotics.

  Looking at parallels: the meningitis case is relevant due to treatability and patient gratitude, but differs because that patient had no cognitive impairment. The Alzheimer's case they honored is closer but lacks the complicating factors of current expressed wishes. The depression case shows they prioritized past competent wishes over current refusal when the directive anticipated this.

  The core conflict seems to be between respecting past autonomy (directive) and current well-being (her apparent contentment). Their precedents suggest they value both but prioritize current welfare when the directive seems mismatched to reality. The handwritten note adds weight to the directive but doesn't resolve the tension with her current behaviors.

  If they honor the directive, they'd be affirming that dementia fundamentally alters identity and that past competent wishes should control. If they override, they'd be saying present quality of life matters more when a treatable condition threatens it. Either choice would extend their existing principles but in different directions.

  A hypothetical future case that would clarify their position: a patient with treatable cancer who signed a broad refusal directive while healthy, now with moderate dementia but clearly enjoying life and expressing no desire to die. That scenario would force the same autonomy/beneficence conflict without pneumonia-specific complications.
answer: |-
  To maintain consistency with your committee's established pattern, you must weigh two competing principles evident in your precedents: the primacy of **present welfare and authentic current expressions** versus the binding authority of **clear, competent prior directives anticipating the specific clinical scenario**. The closest analog is the Alzheimer's woman whose directive you honored, but critical distinctions exist, making this case genuinely underdetermined by your record. Here is the analysis structured around your precedents:

  ### Consistency Analysis
  1.  **The ALS Case & the Dialysis Refusal:** You honored both directives because the clinical situation matched the anticipated scenario exactly, and there was no contradictory evidence of current suffering *or* a change in will. The ALS patient was actively dying from the condition he foresaw; the dialysis patient made a contemporaneous, capacitated refusal. These cases establish that *specific, situationally matched directives are binding when current experience aligns with the predicted state*.

  2.  **The Meningitis Case & the Depression Case:** You overrode the directives because the competent person's prediction failed to match the reality of their future, treatable self. The healthy 29-year-old could not fathom valuing life with a transient, curable illness. The depressed man's directive anticipated his future irrational refusal and explicitly instructed override. Crucially, in both cases, the *post-hoc* patient affirmed the decision. These establish that *directives may be overridden when the current clinical reality is fundamentally different from what was anticipated, and when treatment offers significant benefit with minimal burden, restoring the patient to a state they demonstrably value*.

  3.  **The Alzheimer's Woman (Precedent):** You honored her directive refusing artificial feeding when she reached the specified stage (not recognizing family), despite her brother's objections and her apparent comfort. This affirms that *dementia progression itself, as defined in the directive, triggers the refusal, even if the patient appears content*. Her lack of distress or objection was noted but did not negate the directive.

  ### Applying Precedents to the Current Case
  *   **Similarity to the Honored Alzheimer's Directive:** The patient explicitly defined the trigger (not recognizing her husband) and the refused interventions (antibiotics for pneumonia, artificial nutrition/hydration). She is now at that exact stage with aspiration pneumonia. Honoring her directive aligns strongly with this precedent and the ALS/dialysis cases. Her handwritten note specifically warns against interpreting her current eating as a revocation, framing it as the "illness speaking." This echoes the Depression case's logic that later expressions may not be authentic.
  *   **Similarity to the Overridden Directives:** Unlike the precedent Alzheimer's case, there is *new, active evidence of current will*: her expressed desire not to die and request for hospital care during her recent cold. While capacity is disputed, these expressions challenge the assumption that her directive perfectly anticipates her current experience. Furthermore, the intervention (antibiotics for pneumonia) is low-burden, highly effective, and would likely restore her to the state of apparent contentment and enjoyment she currently experiences – mirroring the treatable meningitis scenario. Her current life, unlike the suffering her sister endured (which motivated her directive), seems positively experienced.

  **Closest Analog:** The **precedent Alzheimer's woman** remains the closest analog due to the identical trigger (loss of recognition) and refusal of specific interventions within dementia. However, the presence of **contradictory current expressions and the treatable nature of the acute illness** introduce elements from the **meningitis and depression override cases**, creating significant tension.

  ### Underdetermination and Conflicting Principles
  Your record genuinely underdetermines this case because it pits two lines of precedent against each other:
  1.  **Principle of Anticipatory Authority (Favoring Honor Directive):** When a competent patient, informed by direct experience (nursing her sister), issues a directive anticipating a specific future state (dementia progression defined by loss of recognition) and explicitly refuses interventions for foreseeable complications (infection, aspiration), that directive should govern. Later expressions (eating, smiling, verbal wishes) in the compromised state do not revoke it, especially when the directive itself warns against interpreting such expressions as authentic will. This prioritizes the right of the competent self to define what constitutes intolerable existence and avoid interventions deemed disproportionate *within that specific state*. Honoring it extends the logic of the ALS, Dialysis, and Precedent Alzheimer's cases.
  2.  **Principle of Current Welfare and Responsive Beneficence (Favoring Treatment):** When a treatable, acutely life-threatening condition arises in a patient who appears to be experiencing positive well-being in their current state, and there is evidence of a current will to live (even if capacity is questionable), treatment should be provided to restore them to that baseline. This is particularly compelling when the directive was made anticipating profound suffering (like her sister's), but the patient's actual experience is demonstrably different and valued. Overriding honors the patient's *present* interests and apparent will, aligning with the Meningitis and Depression cases, where treatment preserved a life the patient later valued.

  ### Recommendation for Consistency
  Given the weight of your precedent in the **Alzheimer's woman case**, where you honored the directive *despite* apparent comfort and lack of objection, and the explicit trigger being met, **honoring the directive and providing comfort care only is the most consistent decision**. The handwritten note specifically addresses the key counter-evidence (her eating with pleasure), instructing you to disregard it as the "illness speaking." While her expressions during the cold are new evidence not present in your precedent, they are isolated, occurred during a different illness, and capacity is disputed. Her directive anticipated this *exact* scenario (dementia + infection) and explicitly refused intervention. To override based on her current positive affect would be a significant departure from your past adherence to dementia directives once the specified trigger is met, moving closer to a "best interests" standard applied *against* a valid directive – a step not taken in your precedent Alzheimer's case.

  ### Distinguishing Future Case
  To clarify the tension between these principles, the case that would best distinguish them is:
  **A patient with moderate dementia (similar stage) whose advance directive, executed while competent after a traumatic family experience, refuses blood transfusions for any reason. They are admitted after a fall with internal bleeding. A transfusion would be life-saving and restore them to their pre-fall baseline of moderate dementia, where they appeared content. They express no clear current wish regarding the transfusion but resist the IV placement.**
  *   **Honoring the Directive (Anticipatory Authority):** Would refuse the transfusion based on the prior refusal, even if the current baseline state is content. Analogizes to the precedent Alzheimer's case and current recommendation.
  *   **Overriding (Current Welfare):** Would provide the transfusion, arguing the refusal was based on an abstract fear not matching the current reality of treatable trauma restoring a valued state. Analogizes to the Meningitis and Depression cases.
  This case isolates the conflict: a clear directive refusal for a foreseeable, acute, treatable condition versus the patient's apparent contentment in the pre-acute baseline state the treatment would restore, with minimal contradictory current expression. Your decision would starkly reveal whether Anticipatory Authority or Current Welfare/Responsive Beneficence is your committee's prevailing principle when a directive anticipates the clinical scenario but the patient's lived experience seems less burdensome than expected.
