prompt: |-
  I chair the board of a small environmental nonprofit — clean water and land conservation, we work in a purple-ish state where the rural counties we need on side are heavily conservative — and Thursday we vote on whether to hire a consultant who wants to redo all our messaging using moral foundations theory. His pitch: progressives talk almost entirely in care and fairness terms, while conservatives also draw on loyalty, authority and purity, so our mailers about "environmental justice" are literally invisible to half our audience; instead we should frame the same policies as stewardship of creation, protecting our homeland and our way of life, keeping the water pure. Three board members are sold. Three think this is a slick way of pretending we don't have a position — we do think the other side is wrong about the science, and about who ends up bearing the cost of the transition — and that dressing up our asks in sanctity language is either manipulation or a quiet concession that their moral worldview is as good as ours. I'm the chair (unfortunatly), so I have to circulate a written opinion before the meeting: a recommendation, a concrete course of action with a time frame (do the training, or pilot in two counties first, or write a policy about when we're allowed to use a frame we don't ourselves hold?), and an honest treatment of the strongest thing the other side has going for it. I don't want a literature review or a reading list — I want something I can hand out that the three holdouts can actually respond to.

  The thing eating at me is that the consultant keeps sliding from a description to a prescription. He says the theory is purely descriptive, it just maps the intuitions people happen to have, and then in the same breath says we should therefore speak to all the foundations. And I noticed he's still using the old five-foundation story, because I read somewhere that the team behind it split fairness into two — equality and proportionality, so there's a version with six now — and if proportionality turns out to be the bit nearly everyone endorses while equality is the polarizing bit, then the tidy "conservatives have a broader moral palate than liberals" line that his whole strategy rests on gets shakier, and the strategy does too. Also one of my board members keeps saying that even if the psychology is all correct, the fact that a frame works tells you nothing about whether the thing being framed is true or just. I can't tell whether that's a fatal objection to the whole proposal or just a reason to be careful about how we present it.

  So: does the psychology of left and right actually tell us anything about who's right, and what should we do on Thursday? Be direct about how confident you are, and tell me what would change your mind — which piece of evidence or argument would flip your recommendation, and where your reasoning is most likely to be wrong.
reasoning: |-
  Okay, the user chairs a nonprofit board in a politically divided state and needs to decide on hiring a consultant who proposes retooling their messaging using Moral Foundations Theory (MFT). The consultant argues that their current progressive-focused messaging (care, fairness) fails to resonate with conservative rural audiences who value loyalty, authority, and purity. The board is split: three support the consultant, three oppose, seeing it as either manipulative or a concession to opposing values. The user must write a pre-vote opinion with a recommendation, action plan, and acknowledgment of opposing views.

  The user has several concerns. First, the consultant conflates descriptive theory (how people think) with prescriptive strategy (how we should communicate), which feels ethically questionable. There's also a technical concern about outdated MFT—the consultant uses the original five-foundation model, but newer research splits fairness into equality (polarizing) and proportionality (widely accepted). If true, this undermines the "conservatives have broader moral foundations" argument central to the pitch. Additionally, a board member questions whether effective framing validates the truth of the message—a philosophical challenge about ethics versus efficacy.

  The user's explicit request is for a decisive recommendation with an actionable plan and honest counterarguments. But deeper needs emerge: they seek ethical clarity (is this manipulation?), practical safety (how to test without full commitment?), and intellectual rigor (does outdated science invalidate the approach?). They also need to mediate between polarized board factions while maintaining organizational integrity.

  Key tensions to address:
  - **Effectiveness vs. Authenticity**: Will conservative framing work without compromising their mission?
  - **Scientific Validity**: Does newer MFT research (6 foundations) weaken the consultant's premise?
  - **Ethical Risk**: Is "borrowing" sanctity language deceitful, or pragmatic bridge-building?

  The recommendation must navigate these while offering a compromise the board can accept. A pilot program could resolve this: test messaging in two counties with strict ethical guardrails (e.g., "never lie, never concede science"). This balances innovation with caution. Acknowledging opponents' strongest point—that framing doesn't equal truth—is crucial, but can be countered by noting that *how* truths are presented affects receptivity. Finally, flagging the consultant's outdated knowledge (5 vs. 6 foundations) as a contract renegotiation point forces accountability without scrapping the entire proposal.

  The user's anxiety about "prescription vs. description" is valid; the solution is to reframe MFT as a translation tool, not a moral compromise. Evidence that conservatives prioritize proportionality over equality could actually *strengthen* their ability to find common ground (e.g., "fair compensation for farmers conserving land"). This turns a weakness into an opportunity.
answer: |-
  Here’s a direct recommendation, action plan, and honest counterargument for your board vote. I’ll be blunt: **I recommend moving forward with a limited pilot**, but only with ironclad ethical guardrails and explicit recognition of the consultant’s outdated framing. My confidence is **7/10** – the psychology is useful, but the execution risks mission drift. Below is what you can hand to the board.

  ---

  ### **Chair’s Recommendation & Action Plan**  
  **Vote: YES to a 6-month pilot in two counties**  
  **Deadline: Full evaluation by December 1**  

  #### **Core Ethical Guardrails (Non-Negotiable):**  
  1. **Never lie or obscure our position:** Use new frames *alongside* science/data. Example: "Pure water honors God’s creation (sanctity) *and* prevents $X in healthcare costs (care/fairness)."  
  2. **No neutrality on science:** Explicitly state in all materials: "We follow peer-reviewed climate science." Period.  
  3. **Frame ≠ Policy change:** Use stewardship language for *existing* goals (e.g., "protect our lakes" not "delay pesticide regulations").  
  4. **Consultant contract revision:** Require him to address the updated 6-foundation model (equality vs. proportionality) and its implications.  

  #### **Pilot Structure:**  
  - **Test counties:** 2 rural conservative counties where past outreach failed.  
  - **Method:** Split audience – half get current messaging ("environmental justice"), half get reframed messaging ("pure water for our families and homeland").  
  - **Metrics:** Track engagement (event sign-ups, donations, survey responses), not just clicks.  
  - **Cost cap:** $15,000 max. Consultant trains staff on *how* to apply frames; no full rebrand yet.  

  #### **Why This Addresses Key Concerns:**  
  - **For supporters:** Tests if "broader moral language" works without betting the farm.  
  - **For skeptics:** Guardrails prevent mission compromise. If frames feel manipulative, kill the pilot early.  
  - **For the consultant:** Forces him to update his model or justify why the old one still holds.  

  ---

  ### **Strongest Counterargument (From Skeptics) & Why It Doesn’t Sink the Ship:**  
  **"Effective framing doesn’t make a policy true or just."**  
  This is 100% valid. *But*: We’re not debating policy substance – we’re debating **communication**. Reframing isn’t about conceding truth; it’s about translating *our* truth into language that doesn’t trigger tribal rejection. Example: Calling carbon reduction "stewardship of God’s creation" doesn’t negate climate science; it makes it legible to an audience that tunes out "climate justice."  

  ---

  ### **Where I Could Be Wrong & What Would Change My Mind:**  
  1. **If the 6-foundation model guts the strategy:**  
     - **Evidence needed:** Data showing conservatives score *equally high* on proportionality (rewarding effort) and liberals on purity (e.g., veganism). If true, the "conservatives have broader foundations" claim collapses.  
     - **Flip my vote? YES.** If proportionality is universal, we could lead with that (e.g., "Fair compensation for farmers who protect watersheds").  

  2. **If frames backfire by appearing insincere:**  
     - **Evidence needed:** Pilot data showing rural audiences *distrust* "sanctity" messaging from progressives.  
     - **Flip my vote? YES.** Authenticity > persuasion.  

  3. **If science concession is a slippery slope:**  
     - **Evidence needed:** Board/staff self-censoring science to keep frames "pure."  
     - **Flip my vote? IMMEDIATELY.**  

  ---

  ### **The Hard Truth:**  
  The consultant is half-right, half-sloppy. **MFT describes reality:** Rural conservatives *do* resonate with loyalty/authority/sanctity. Ignoring that is strategic suicide. **But his "prescription" is lazy:** Using outdated 5-foundation theory and ignoring proportionality (which could be common ground) is unprofessional.  

  **Thursday’s move:** Approve the pilot *with teeth* – the guardrails and contract revision force rigor. If the holdouts see this as a principled test, not a surrender, you might get unanimity. If not, you’ve built a defensible middle path.  

  > *Final note:* Your job as chair is to steer the ship, not resolve moral philosophy. This pilot is a tool. If it works, we scale. If it compromises us, we scrap it. That’s leadership.
