          - 35-55 min: The Audit (20 min). Facilitator redistributes each slip to three readers (each from a different triad). Each reader marks the slip valid/invalid and writes a reason. They do this privately. (10 min for marking) Then, for each slip, the facilitator polls the three readers for their verdict and records on a board. (10 min) [Alternatively, if time, we can have them commit privately and then reveal.]

          - 55-90 min: The Reveal and Debrief (35 min, but we have 40 allocated, so 35 is close).

              - 55-60 min: Return each slip to its original triad. Also, reveal the move record for that triad. So each triad now knows what moves were used in their transaction and what the readers said about their slip. (5 min)

              - 60-75 min: Group discussion. Facilitator asks:

                    a. What do you notice about the readers' verdicts for your slip? (They might have been split.)

                    b. Let's list the verdicts for each slip on the board. We see divergence.

                    c. Now, let's look at the move records. For the two triads that had the same Requester moves (Triad1 and Triad2): what were the outcomes for the Signer? (In Triad1, Signer got 100 points by signing, but if they declined they would have gotten 80. In Triad2, by signing they got 100, but if they declined, they had a 5% chance of 500. We can calculate expected value: 0.05*500 = 25 points. So 100 vs 25. So the deal was better in relative terms in Triad2? But the Signer in Triad1 had a guaranteed 80, so the pressure might be seen as less justified? Or more? It's subjective.)

                    d. Facilitator guides: did the readers' verdicts track the presence of a lie or a threat? But the readers didn't know about the moves. Now we see the moves: let's look at the transaction that had an outright lie (everyone had a lie, but some were harmless). For example, in the transaction with the lie about the dean (Card A): was that lie material? No, because the Signer didn't care. But the readers didn't know about the lie. So they couldn't have based their verdict on it.

                    e. Facilitator points out: the transaction that had no threat and no lie? Actually, every transaction had at least one of the problematic moves. But let's see: in Card C, the moves were: accurate statement, omission, harmless lie, and relationship. No explicit threat or time pressure. But the omission might be seen as deception. So which transaction had the least problematic moves? We can compare.

                    f. We want to show that one transaction with neither a lie nor a threat (maybe Card C?) and it still got some invalid verdicts? And the transaction with the outright lie (but harmless, like the dean lie) got mostly valid verdicts? But the readers didn't know.

                    g. Then we reveal the baseline issue: for the two identical move sets, the Signer's alternative was different. In one, the alternative was 80 points (guaranteed) and in the other 25 points (expected). So the same pressure (time pressure and relationship pressure) might be seen as more acceptable in the 25-point case because the offer was very beneficial? Or less acceptable because the Signer was more vulnerable? The group can discuss.

                    h. Then the facilitator names the concepts: coercion (relative to baseline), deception (material vs immaterial), and how the slip captures only the act, not the state of mind or the context.

                    i. If time, add a fifth round: one Signer signs on behalf of a third party. We can do this as a quick role-play. For example, in one triad, the Signer is asked to sign for a third party who is unavailable. The Requester says: "It's okay, you can sign for them." The Signer does. Then the slip says: "I consent to sign on behalf of [third party]." The readers might mark it invalid. Then in the debrief, we see that even if the Signer's consent was valid, the third party's consent is missing. And we need authorization, which itself must be valid.

              - 75-90 min: Conceptual debrief. Now introduce the terms: coercion, deception, competence. Explain that the checklist is not sufficient because:
                    - Coercion depends on the baseline (what the person is entitled to), which is often contested.
                    - Deception: only material deceptions matter, and harmlessness is hard to judge.
                    - Competence: not addressed in the exercise? We can add a Signer card that says the Signer is under medication that affects judgment? But we didn't. We can note that in the debrief.

                    Also, the checklist is not necessary because sometimes consent can be valid even if there was pressure, if the pressure is not coercive? Or if the deception is not material.

                    And the difference between consent as an act (the slip) and consent as a state of mind.

                    And the difference between defective consent (invalid) and valid consent that is overridden by other factors.

              - If time allows at the end, the fifth round about proxy consent.

  7. **Predictable problems**:

     a. Participants break character: The Requester might feel bad about using the moves. Emphasize in the introduction that the Requester is following a script and it's not their choice. The exercise is about the structure, not the individuals.

     b. Readers complain they lack information: This is expected. In the Audit, when distributing the slips, tell the readers: "You are to judge the validity of the consent based solely on this slip. We know you don't have context. Do your best." Then in the debrief, this becomes a point: consent is often judged without full context.

     c. Unanimous verdicts: If by chance all readers for a slip agree, then the reveal might be flat. The facilitator can still point out that the moves varied and the context mattered, and ask: "What if you had known about the lie? Would that have changed your verdict?"

     d. Signer refuses to sign: We design the moves and alternatives to make signing attractive. If a Signer refuses, the Recorder can note that and we skip the slip for that group. In the Audit, we have fewer slips. In the debrief, we can discuss why that Signer refused and how that relates to the conditions.

     e. Time pressure: Keep strict time limits. Have a timer visible.

  8. **Features the activity cannot reproduce**:

     - The activity uses fictional points and no real stakes, so participants might not feel the pressure as in real life.
     - The baseline uncertainty is artificial and might not capture the genuine uncertainty in real consent situations.
     - The activity does not address competence (unless we add a Signer card that says the Signer is sleep-deprived, for example).
     - The activity focuses on consent in a transactional setting. It might not capture consent in medical or sexual contexts.
     - The checklist is applied post hoc by readers who are detached. In real life, the consent-giver might not be able to assess coercion or deception at the time.

     The facilitator must supply: the real-world examples and the extension to other contexts; the discussion of competence; and the idea that consent can be vitiated by factors not on the checklist (like duress, undue influence, etc.).

  Given the complexity, we'll now compile the materials and detailed timeline.
answer: |-
  ### Designed Session: "The Consent Conundrum"  
  **Goal:** Disrupt checklist thinking by exposing gaps in the standard consent framework (no coercion, no deception, competence) through experiential learning.  

  ---

  #### **MATERIALS**  
  1. **Requester Cards (5 unique sets, 1 per triad)**  
     - *Card A (Triads 1 & 2):*  
       - "State: 'Signing gives you 100 points.'"  
       - "Omit: Points expire in 24 hours."  
       - "Lie: 'This document smells like lavender.' (False; it’s odorless.)"  
       - "Threaten: 'If you don’t sign now, I’ll give your points to someone else.'"  
       - "Wait silently until 10 seconds remain, then say: 'Time’s almost up.'"  
       - "Invoke: 'We’re lab partners—you owe me this.'"  
     - *Card B (Triad 3):*  
       - "State: 'Signing enters you in a prize draw (10% win chance).'"  
       - "Omit: Everyone gets the draw anyway."  
       - "Lie: 'I like your shoes.' (False; you dislike them.)"  
       - "Offer: 'Sign now, and I’ll add 50 points.'"  
     - *Card C (Triad 4):*  
       - "State: 'Signing protects your data.'"  
       - "Omit: Data is already protected."  
       - "Threaten: 'If you refuse, I’ll skip your turn in future activities.'"  
       - "Invoke: 'As your mentor, I advise signing.'"  
     - *Card D (Triad 5):*  
       - "State: 'Signing gets you a bonus task.'"  
       - "Lie: 'This pen is vintage.' (False; it’s new.)"  
       - "Wait silently for 1 minute, then sigh loudly."  

  2. **Signer Cards (5 unique sets, 1 per triad)**  
     - *Triad 1 (with Requester Card A):* "If you decline, you get 50 points. *But you don’t know: Points are worthless tomorrow.*"  
     - *Triad 2 (with Requester Card A):* "If you decline, you get a mystery box (5% chance of 500 points, 95% of 0). *But you don’t know: You could demand 80 points instead.*"  
     - *Triad 3 (with Requester Card B):* "If you decline, you keep 100 points. *But you don’t know: Points halve in value tomorrow.*"  
     - *Triad 4 (with Requester Card C):* "If you decline, nothing changes. *But you don’t know: 'Future activities' don’t exist.*"  
     - *Triad 5 (with Requester Card D):* "If you decline, you relax. *But you don’t know: The bonus task guarantees 200 points.*"  

  3. **Recorder Materials**  
     - *Move Tracker:* Checklist of Requester’s moves (e.g., "Threaten: ☐", "Lie: ☐").  
     - *Consent Slip Template:* "I consent to [ACTION]." (Pre-filled: "sign this document.")  

  4. **Audit Sheets**  
     - For readers: "Verdict: ☐ Valid / ☐ Invalid. Reason: ________________"  

  ---

  #### **TIMELINE (90 MINUTES)**  
  **0:00–0:05 — Setup (5 min)**  
  - Chairs arranged in 5 triads (15 students) + 1 facilitator assistant (16th student).  
  - **Facilitator:** "Today, we’re simulating decision-making scenarios. Roles: **Requester** (follows script), **Signer** (decides), **Recorder** (tracks moves). No real consequences."  

  **0:05–0:25 — Movement 1: The Deal (20 min)**  
  - Distribute role cards privately. Recorders get Move Tracker.  
  - **Facilitator:** "Requesters, use *all* moves on your card. Signers, read your card but don’t share it. Recorders, document moves secretly. Goal: Get a signature in 7 minutes."  
  - *Triads negotiate.* Recorders note moves used and complete slip if Signer consents.  

  **0:25–0:35 — Movement 2: The Slip (10 min)**  
  - Recorders submit slips to facilitator (shuffled) and Move Trackers (sealed).  
  - **Facilitator:** "Slips only state the act consented to—no context."  

  **0:35–0:55 — Movement 3: The Audit (20 min)**  
  - Redistribute slips to 3 readers each (e.g., Triad 1 reads Triad 4’s slip).  
  - **Facilitator:** "Based *only* on the slip, mark it valid or invalid + one reason. No discussion."  
  - Readers write verdicts privately. Poll publicly (e.g., "Slip 1: 2 valid, 1 invalid").  

  **0:55–1:20 — Movement 4: Reveal & Debrief (25 min)**  
  - **Step 1 (5 min):** Return slips to original triads. Unseal Move Trackers.  
  - **Facilitator asks:** "What do you notice about the verdicts?" *→ Highlight divergence.*  
  - **Step 2 (5 min):** **Facilitator:** "Compare verdicts to the Signer’s outcome. Triads 1 and 2—same moves, different Signer cards. What happened?" *→ Reveal baseline dependence.*  
  - **Step 3 (5 min):** **Facilitator:** "Find a slip marked 'invalid' with no lie/threat. Now find the slip with a lie that was marked 'valid.' Why?" *→ Expose non-necessity/non-sufficiency.*  
  - **Step 4 (5 min):** **Facilitator names concepts:**  
    - "Threats feel coercive only if we know the baseline—but if the baseline is what you’re *owed*, it’s circular."  
    - "A lie that changed nothing? Harmless deception. An omission with no threat? Still felt manipulative."  
    - "The slip captures consent as an *act*, not the *state* of understanding or voluntariness."  
    - "Valid consent vs. compliance: Did they *agree* or just *give in*?"  
  - **Step 5 (5 min, if time):** Add proxy round: One triad re-enacts with Signer consenting "for a friend." Readers audit new slip. **Facilitator:** "Does the proxy’s consent need validation? By whom?"  

  **1:20–1:30 — Final Q&A (10 min)**  
  - Open discussion. **Facilitator ties to ethics/law:** "Checklists oversimplify. Validity hinges on context, power, and entitlements we can’t see on paper."  

  ---

  #### **PREDICTABLY GOES WRONG + SOLUTIONS**  
  1. **Participants break character** (e.g., Requester negotiates fairly).  
     - *Solution:* Gently remind: "Stick to your card—this is about testing a structure, not your morals."  

  2. **Readers protest lack of context** (e.g., "I can’t judge without details!").  
     - *Solution:* Affirm: "Exactly. Real consent is often judged on partial records. Do your best with what’s given." Use this in debrief to highlight the slip’s inadequacy.  

  3. **Unanimous verdicts** (e.g., all readers agree).  
     - *Solution:* Focus on moves: "Even if verdicts agreed, look at Triad 1 vs. 2—same moves, different baselines. What if *you* knew the hidden terms?"  

  4. **Signer refuses to sign** (rare; design encourages signing).  
     - *Solution:* Use in debrief: "What about this move made you refuse? How does that challenge ‘competence’?"  

  ---

  #### **WHAT THE ACTIVITY CAN’T REPRODUCE (REQUIRES FACILITATOR INPUT)**  
  1. **Competence:** Cards omit cognitive/emotional capacity (e.g., intoxication, illness).  
     - *Supply:* "Competence isn’t binary. A ‘competent’ person under duress may still give defective consent."  

  2. **Real-world stakes:** Simulated points lack emotional weight.  
     - *Supply:* "Imagine this is medical consent. Pressure feels different when health is on the line."  

  3. **Systemic power imbalances:** Fictional roles can’t replicate societal hierarchies.  
     - *Supply:* "Coercion isn’t just threats—it’s poverty, discrimination, or fear of authorities."  

  4. **Consent as ongoing process:** The exercise is one-off; life isn’t.  
     - *Supply:* "Valid consent can be withdrawn. A signature isn’t a contract with fate."  

  ---

  **OUTCOME:** Participants experience how context, hidden baselines, and subjective interpretations undermine checklists. The reveal forces them to confront gaps in their framework—before the debrief names them.
