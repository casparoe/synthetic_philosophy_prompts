answer: |-
  ### AI Use Decision Procedure  
  **Ground Rules:**  
  1. **Understanding = Ability to be wrong on purpose**: You must articulate what evidence would overturn the result and how outputs shift if inputs change.  
  2. **Explanation debt**: If the output becomes a premise others rely on (e.g., data in a filing, code others maintain, member communications), you **must** explain it without referencing the AI.  

  **Procedure** (Run in <2 mins per task):  
  1. **Is this member-facing or pricing-related?**  
     - *Yes* → **Stop. Bucket 3 (Don’t use AI)**. Compliance sign-off is required for these, and AI cannot be the primary generator.  
     - *No* → Proceed to Question 2.  
     - *Judgment call*: "Pricing-related" includes anything affecting premiums, risk models, or regulatory filings. When in doubt, assume yes.  

  2. **Could an error cause material harm?**  
     - *Material harm* = Financial loss > $10K, regulatory penalty, member harm, reputational risk, or operational disruption.  
     - *Yes* → Proceed to Question 3A.  
     - *No* → Proceed to Question 3B.  
     - *Judgment call*: Default to "yes" if uncertain.  

  3A. **For material harm tasks: Can you be wrong on purpose?**  
     - *Yes* → **Bucket 2 (Use but explain reasoning)**. You must personally walk through the logic.  
     - *No* → **Bucket 3 (Don’t use AI)**. Lack of understanding + high risk is unacceptable.  

  3B. **For low-harm tasks: Can you be wrong on purpose?**  
     - *No* → **Bucket 3 (Don’t use AI)**. If you can’t sanity-check it, discard it.  
     - *Yes* → Proceed to Question 4.  

  4. **Is there explanation debt?**  
     - *Yes* (Output becomes a premise for others) → **Bucket 2 (Use but explain reasoning)**.  
     - *No* (Output is internal, disposable, or only you rely on it) → **Bucket 1 (Take and spot-check)**.  

  ---

  ### Case Applications  
  **Case (a): Generating SQL for monthly claims extract**  
  - **Q1:** Member-facing/pricing? *No* (routine internal data pull).  
  - **Q2:** Material harm? *No* (error delays report but fixable next cycle).  
  - **Q3B:** Can you be wrong on purpose? *Yes* (e.g., "If `WHERE` clause dates are wrong, claims drop by ~20%; evidence against: compare to last month’s volume").  
  - **Q4:** Explanation debt? *Yes* (teammates reuse this query).  
  - **Decision: Bucket 2** → Use AI but you **must** explain the SQL logic.  

  **Case (b): Drafting denial reason for a member letter**  
  - **Q1:** Member-facing/pricing? *Yes*.  
  - **Decision: Bucket 3 (Don’t use AI)**. Compliance requires human authorship for member communications. Even if AI drafts it, you’d need to re-write manually to "explain without pointing to the model," defeating the purpose. **Unpopular but non-negotiable.**  

  **Case (c): Choosing method for risk-adjustment model (feeds premiums, regulator-reviewed)**  
  - **Q1:** Member-facing/pricing? *Yes* (directly affects premiums).  
  - **Decision: Bucket 3 (Don’t use AI)**. Compliance and regulators require full human accountability. *Even if you proceed:*  
    - Q2: Material harm? *Yes* (errors cause pricing/regulatory fallout).  
    - Q3A: Can you be wrong on purpose? *Likely no* (without stats training, you can’t articulate why evidence favors Poisson regression over GLM).  
    **Result: Hard no.**  

  ---

  ### What This Procedure Can’t Do  
  1. **Handle edge cases with "harm" judgments**: E.g., an internal report used for a $9K decision might be misclassified as "low harm."  
  2. **Verify understanding depth**: Relies on self-assessment. Overconfident teams may overuse Bucket 2.  
  3. **Override compliance mandates**: If compliance later approves AI for denial letters, update Q1’s pre-approval criteria.  

  ### When to Override the Procedure  
  - **Situation**: Low-harm, no explanation debt tasks where the team lacks understanding *but* the output is trivial to verify (e.g., AI summarizes a public clinical guideline into bullet points).  
  - **Action**: Manually move to **Bucket 1** with enhanced spot-checks (e.g., "Verify 3 random statements against source").  
  - **Why**: The procedure is conservative; it flags "no understanding" as Bucket 3, but some low-stakes tasks warrant pragmatism.  

  ### Final Note  
  This forces hard choices: **High-value tasks (denial letters, pricing models) cannot be offloaded to AI** because explanation debt and compliance requirements demand human ownership. The trade-off is speed for accountability. Refine Q2’s "material harm" threshold with legal/finance to avoid under-scoping.
