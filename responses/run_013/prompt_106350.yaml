prompt: |-
  I've been going back and forth on duties to rescue people and I want help figuring out what I actually think. Take the role of a philosopher who works on normative ethics and the ethics of rescue. I don't want a survey of the literature or a history of who said what — I want you to actually reason about it, start by brainstorming a few candidate principles out loud, and only then commit to one. Think it through carefully and don't hedge at the end.

  Here are my gut reactions. Treat them as data, not as a theory I'm secretly testing you on.

  - Kid drowning in a shallow pond right in front of me. I'd ruin a good suit and probably need stitches from the glass on the bottom. I have to go in. No question.
  - Same kid, but the only floaty thing is locked in a boathouse and I'd have to break the lock. Still have to go in. A lock is a lock.
  - Same kid, crowded beach, forty people all watching, any of us could go. I still have to go. "Someone else will" isn't a reason for me specifically.
  - Faraway kid who dies unless I send $300 to a charity that's about as close to a sure thing as these things get. Honestly? I think I have to send it, and that annoys me, but I can't find the difference from the pond except the distance and the fact that I never see the kid.
  - Now the one I flip on. If the only thing that works is me sending money every month for years, I don't think I'm *required* to do it, just that it'd be good of me. And yet by my own logic above I feel like I should be required. This is the one I keep going back and forth on.
  - Guy who waded into a flooded river on a dare and is now drowning. If it's cheap for me to save him, I have to. But if saving him means real risk to me, I think I'm allowed to decline — his own stupid choice shifts some of the cost onto him.
  - Same setup, but the drowning man is an escaped murderer. I think I still have to save him if it's cheap. Being a bad person doesn't lower my duty. Which is weird sitting next to the dare guy — apparently "you chose this" matters but "you're awful" doesn't?
  - Woman on a bridge about to jump, I can grab her. I think I have to, even though she's a competent adult and does not want to be grabbed.
  - But a guy about to sell a kidney for money, or about to join some group I think is degrading — I can't just grab him. Not my call. So I override a competent adult's choice in one case and not the other, and I can't quite say why.

  What I want: is there a principle, or a small set of them, that gets all of these, or close? For each clause, tell me which of my cases forces it. Then tell me what the principle predicts for cases I haven't listed — say, a promise I made to a neighbor to watch their kid, and the kid then starts drowning; a rescue that would require me to admit I was the one who caused the problem; and a case where I could save one stranger only by shoving a second innocent person into danger. And be honest about which of my verdicts the principle can't keep. If I have to choose between a messy principle that saves every verdict and a clean one that loses one, say which you'd take and which verdict it costs me.

  End with a final line that begins "Verdict:" and gives, in under 25 words, the principle you'd endorse and the verdict it forces me to give up.
reasoning: |-
  Hmm, the user wants me to role-play as a philosopher specializing in normative ethics and rescue ethics. They've shared several concrete scenarios where they have strong intuitions about rescue duties but feel conflicted, particularly about recurring donations and cases involving personal responsibility. They want me to develop a principle that explains most of their intuitions while being honest about where it might conflict.

  Looking at their cases, I notice several patterns. They consistently endorse duties when: (1) rescue is proximate (drowning kid), (2) cost is low relative to harm averted (broken lock/ruined suit), (3) diffusion of responsibility doesn't excuse (crowded beach), and (4) physical distance doesn't negate duty (donation). But they waver on sustained sacrifices (monthly donations) and make distinctions based on personal responsibility (dare vs murderer) and autonomy (suicide intervention vs kidney sale).

  The key tension seems to be between two ethical pulls: a strong "cost-sensitive rescue principle" (you must help when harm is severe and cost to you is low) versus other values like personal projects (monthly donations), fairness (dare-taker's responsibility), and autonomy (kidney seller). Their flip-flop on recurring donations suggests that "low cost" might need temporal boundaries - perhaps a distinction between one-off and lifestyle-altering sacrifices.

  For the dare vs murderer comparison, I'm considering a "responsibility factor" where the victim's culpability reduces the rescuer's duty only when the victim knowingly caused their own peril, not when they're just morally bad. This explains why they'd help the murderer (who didn't cause the drowning) but not the dare-taker (who did) at high risk.

  The suicide vs kidney sale distinction likely hinges on immediacy and competence. Grabbing the jumper prevents irreversible harm during a crisis where decision-making may be impaired, whereas stopping the kidney sale interferes with a non-imminent choice they deem rational. This suggests a "temporal urgency" component.

  I'll develop this into a multi-part principle: 
  1. Rescue required when: (a) severe preventable harm exists (b) your action can prevent it (c) your cost is below threshold X 
  2. X decreases if victim caused the peril knowingly 
  3. Competent autonomy overrides rescue only absent immediate irreversible harm 

  This principle mostly preserves their judgments except the recurring donation case. It would require sustained donations if each $300 increment still meets the cost threshold, but the user feels this overextends. I'll note this tension honestly - their intuition wants temporal limits the principle doesn't include.

  For new test cases: 
  - The promised neighbor case would heighten duty (special responsibility) 
  - Caused-the-problem case would still require rescue (cost doesn't include shame) 
  - Shoving-innocent-person case would forbid it (cannot transfer harm)

  I'll conclude with a "Verdict" that endorses the principle but acknowledges it requires monthly donations - the one intuition they must surrender for consistency.
answer: |-
  After reasoning through your cases, I propose this principle: **You have a duty to rescue when (1) severe harm is occurring or imminent, (2) your action can prevent it at a cost to you that is *non-catastrophic* and *proportionate* to the harm averted, *unless* (3) the victim knowingly created the peril themselves, shifting partial cost-sharing to them, or (4) respecting competent autonomy overrides immediate harm prevention.**

  Here’s the clause-by-clause breakdown against your cases:  
  - **Clause (1) "Severe harm imminent"** covers all drowning cases (1-7), bridge jumper (8), and faraway kid (4). Forces you to act.  
  - **Clause (2) "Non-catastrophic/proportionate cost"** explains shallow pond (1: suit/stitches < death), boathouse (2: broken lock < death), crowded beach (3: effort < "someone else" excuse), donation (4: $300 << death), dare (6: low risk = duty; high risk shifts to cost-sharing). *This clause forces you to accept recurring donations (5) as duty if each monthly $300 is proportionate to saving a life.*  
  - **Clause (3) "Victim knowingly created peril"** excuses high-risk dare rescue (6) but *not* saving the murderer (7: he didn’t cause drowning) or bridge jumper (8: crisis may impair competence).  
  - **Clause (4) "Competent autonomy override"** allows grabbing jumper (8: crisis undermines autonomy) but forbids kidney interference (9: no imminent harm, competent choice).  

  **Predictions for new cases:**  
  - *Promised neighbor’s drowning kid*: Duty **strengthened** (promise adds obligation; clauses 1+2 still apply).  
  - *Rescue requiring admitting fault*: Duty **remains** (shame isn’t "catastrophic cost"; clauses 1+2 override).  
  - *Shove one innocent to save another*: **No duty** (cannot transfer harm; violates proportionality in Clause 2).  

  **Trade-off:** Your recurring donation case (5) is the sticking point. The principle demands it as a duty (since each $300 is proportionate to a life saved), but your intuition rejects sustained sacrifice. I prioritize theoretical cleanliness over preserving this verdict—because proportionality is binary per-action, not cumulative. If we exempt recurring costs, we undermine Clause 2’s core (e.g., "Why save one pond kid if others drown tomorrow?").  

  **Verdict:** Endorse proportionality-per-action; surrender your "no duty" in recurring donations.
