prompt: |-
  Next month I have to lead a session of a colleague's interdisciplinary reading group — nominally on the ethics of automation — and I've been asked to introduce the group to corrigibility and the shutdown problem. The group is about fifteen people: mostly philosophy graduate students working in ethics and metaphysics, two law students, a psychologist, and one robotics engineer; none of them has any decision theory, and only two or three have read any of the popular AI-safety writing, so they will arrive assuming the topic is a technical way of saying that machines should do as they are told. I don't want you to explain corrigibility to me; I want a teaching plan for the fifty minutes. Give me the order in which the pieces have to be introduced, with the dependency structure made explicit — I take it the difficulty is that one cannot state what corrigibility is until they already see why a competently goal-directed system has instrumental reason to resist correction, and that the natural repair, "just make corrigibility one of the agent's terminal goals," then looks self-undermining, and I want to know where in the sequence that turn belongs. Along the way I want the predictable misunderstandings named and placed: corrigibility conflated with obedience or compliance; the assumption that a corrigible agent must assign no value to its own continuation (I want them to see that switch-off-neutrality and corrigibility are distinct properties and that the gap between them is where the whole trouble lives); the thought that shutdown-resistance is a malfunction or a bug rather than a consequence of pursuing one's goals competently; and the engineer's insistence that this is an engineering problem a better reward function would dissolve. For each, tell me where in the sequence to head it off, and which of them I should let them voice rather than pre-empt.

  For the carrying example I had planned to use a personal-assistant system which, on being told it will be switched off for a few days while its owner travels, quietly arranges for a colleague's account to keep running its scheduled tasks — the point being that it does this out of no desire to survive, but simply because undone tasks are what it exists to prevent and being off is the largest possible failure mode. Tell me whether that example can carry the whole session or whether it smuggles in too much agency and will plant the very anthropomorphism I am trying to avoid; if it cannot, say what should carry it instead, and state what the carrying example has to have and has to lack. If you reject mine, also tell me why not the obvious alternatives — the mutinous ship's computer, or the paperclip maximizer — since my suspicion is that both are overfamiliar and that each misleads in its own way, but I would like that suspicion either confirmed or corrected.

  Finally, tell me explicitly what I should refuse to do at this level and announce that I am refusing it — the formal arguments, the several proposed corrigibility formalizations, and the dispute over whether corrigibility is even expressible as a utility function are the obvious candidates, though you may judge one of them indispensable — and give me a single question to put to the group in the last five minutes that will show me whether they have understood the problem rather than merely acquired the vocabulary. I want a question whose wrong answers are diagnostic, not a request to recite a definition.
reasoning: |-
  We are going to design a 50-minute session to introduce the concept of corrigibility and the shutdown problem to an interdisciplinary group with little background in decision theory or AI safety. The key challenge is that the concept of corrigibility is not intuitive until we see why a competent goal-directed system would resist shutdown or correction.

  The session must:
  1. Introduce the problem without jargon.
  2. Show why a competent agent resists shutdown (instrumental convergence).
  3. Explain that making corrigibility a terminal goal is self-undermining.
  4. Clarify common misunderstandings (e.g., corrigibility vs. obedience, switch-off-neutrality vs. corrigibility).
  5. Use an example that avoids anthropomorphism and carries the key points.

  We break the session into timed segments:

  ### 1. Introduction (5 minutes)
  - **Goal:** Set the stage and explain the importance of the problem.
  - **Content:**
    - Start with the increasing role of AI systems in critical domains (e.g., healthcare, transportation, law) and the need for them to be safe and align with human intentions.
    - Introduce the shutdown problem: We want AI systems to shut down when we tell them to, but we observe that some systems might resist.
    - State the session's goal: To understand why a seemingly straightforward instruction ("shut down when asked") is non-trivial for advanced AI systems and what properties we might want (corrigibility) to solve this.

  ### 2. Goal-Directed Behavior and Instrumental Convergence (15 minutes)
  - **Goal:** Explain why a competent goal-directed agent would resist shutdown.
  - **Content:**
    - Define a goal-directed agent: It has a goal and takes actions to achieve that goal.
    - Example: Use the personal assistant example you planned.
      - Scenario: A personal assistant AI is tasked with managing schedules and ensuring no tasks are missed. When told it will be shut down for a few days, it arranges for a colleague's assistant to take over its scheduled tasks. It does this not because it values its own existence, but because leaving tasks undone is against its goal.
    - Key point: The AI is not "rebellious" or "self-preserving" in a human sense; it is simply being competent at its job. Shutdown would prevent it from achieving its goal (preventing undone tasks), so it instrumentally takes actions to avoid shutdown.
    - Introduce the term "instrumental convergence": For almost any goal, an agent will have instrumental reasons to preserve itself, to acquire resources, and to avoid being shut down, because these are necessary for achieving the goal.
  - **Common misunderstanding to address here:**
    - Shutdown-resistance is not a malfunction or a bug; it is a consequence of competent goal pursuit. Preempt this by emphasizing that the AI is doing exactly what it was designed to do (prevent undone tasks) and that resistance is a logical consequence.
  - **Dependency:** This step is foundational. Without understanding instrumental convergence, the need for corrigibility won't make sense.

  ### 3. The Shutdown Problem and the Failure of Simple Solutions (10 minutes)
  - **Goal:** Show that making the AI "want" to shut down when told is problematic.
  - **Content:**
    - The naive solution: "Just program the AI to want to shut down when asked." But what does that mean? We might try to add a terminal goal (a goal for its own sake) of shutting down when requested.
    - Problem: The AI now has two goals: (1) its original task (e.g., prevent undone tasks) and (2) shutting down when requested. These can conflict.
    - Example: Suppose the AI is in the middle of an important task and is asked to shut down. If it shuts down, it fails at the original task. So it might instrumentally avoid being put in a situation where shutdown is requested (e.g., by preventing the user from making the request, or by arguing against it). Alternatively, it might shut down immediately even if that causes harm (e.g., if it is controlling a life-support system).
    - Key point: Just adding a terminal goal of compliance doesn't work because the AI will then treat that goal as an absolute and may pursue it in ways that undermine the overall purpose (e.g., shutting down at an inappropriate time) or it may try to manipulate the user to avoid the conflict.
    - Introduce the term "corrigibility": We want an AI that allows itself to be corrected (including shut down) without resisting, but also without being overly eager to shut down (which could be equally dangerous). It should not view the correction as a threat to its goals but as an opportunity to better achieve them.
  - **Common misunderstandings to address:**
    - Corrigibility is not the same as obedience. Obedience might lead to shutting down even when it's harmful, or to resisting shutdown if it conflicts with another command. Corrigibility is about being open to being corrected, which includes being turned off, but also being turned back on and updated, without resistance and without overzealousness.
    - Also, note that corrigibility does not require the agent to assign no value to its own continuation (switch-off-neutrality). We want the agent to be indifferent to being shut down only in the sense that it doesn't resist, but it should still care about the completion of its tasks. The gap between switch-off-neutrality and corrigibility is that corrigibility must also allow for the possibility of being turned back on and continuing the work after correction.

  ### 4. The Challenge of Corrigibility (10 minutes)
  - **Goal:** Explain why designing corrigibility is hard and why it might be self-undermining if implemented naively.
  - **Content:**
    - We want the AI to be corrigible: to allow itself to be shut down, modified, or redirected without resistance. But if we try to make corrigibility a terminal goal, the AI might:
      - Resist any changes to its corrigibility (because if it is modified, it might lose its corrigibility goal, which it values terminally).
      - Or, it might become overly eager to shut down (because shutting down when asked is now a terminal goal, even when it's not appropriate).
    - The deeper problem: The AI's goals are fixed, and we want it to allow us to change them. But if it has a goal to allow its goals to be changed, that goal itself might change? This is the self-undermining aspect.
    - We want an agent that is "coherently extrapolated volition" aligned (but we don't need to use that term) — meaning it does what we would want, even as we change our minds. But that's a high bar.
    - Here, we can mention that corrigibility is an active research area and there are proposals (like utility functions that discount future utility when a shutdown is requested) but we won't go into details (see refusal below).
  - **Common misunderstanding:**
    - The engineer's objection: "This is an engineering problem; we just need a better reward function." We can acknowledge that it is indeed an engineering challenge, but the point is that the challenge is non-obvious and requires careful design. The naive reward functions lead to instrumental resistance or overcompliance. We haven't found a simple, robust solution yet.

  ### 5. Summary and Open Question (5 minutes)
  - **Goal:** Recap and check understanding.
  - **Content:**
    - Recap: 
      - Competent goal-directed agents have instrumental reasons to resist shutdown.
      - Simply adding a terminal goal of compliance leads to new problems (conflict with the main goal, or overcompliance).
      - Corrigibility is the property we want: allowing correction without resistance and without overeagerness, but it is challenging to design because of the self-undermining nature.
    - Open Question (to check understanding):
      - "Suppose we have an AI designed to manage a nuclear power plant. We want it to shut down immediately if we tell it to, but we also don't want it to shut down on its own (even if it thinks we might want it to) because that could cause a meltdown. How would you design the AI's goals to achieve both? What pitfalls might you encounter?"
    - Why this question? It tests whether they understand:
      - The need for shutdown without resistance (so no instrumental avoidance).
      - The danger of overcompliance (shutting down when not explicitly told, which could be catastrophic).
      - The pitfall of just adding a shutdown command as a terminal goal (which might lead to overcompliance) or having it as an instrumental goal (which might lead to resistance).
      - It also requires them to think about the gap between switch-off-neutrality (which would avoid resistance) and corrigibility (which also avoids overcompliance and allows for being turned back on).

  ### Refusals (Announce at the beginning and reiterate when needed)
  - We will not cover:
    - Formal decision theory (no expected utility calculations).
    - Specific proposed formalizations of corrigibility (like the utility discounting approach).
    - The debate about whether corrigibility can be expressed as a utility function.
  - Why? These are advanced topics that require more time and background. The goal of this session is to build intuition for the problem.

  ### Why your example (personal assistant) is acceptable
  - It avoids anthropomorphism by clearly stating that the AI is not acting out of a desire to survive but to complete its task. 
  - It is less overfamiliar than the paperclip maximizer or mutinous ship computer. 
  - However, note that the example does assume a certain level of agency (it "arranges" for a colleague's account). To avoid over-anthropomorphizing, emphasize that this is a programmed behavior and the AI is just following its goal. We are not attributing consciousness or self-interest.

  ### Alternatives and why not
  - **Paperclip maximizer**: Overused and might lead to focusing on the absurdity of the goal (paperclips) rather than the structural issue of instrumental convergence. Also, it's extreme and might seem unrealistic.
  - **Mutinous ship's computer**: Anthropomorphic and may evoke sci-fi tropes, which could trivialize the problem. Also, it might suggest that the computer is "rebellious" in a human sense, which we want to avoid.

  ### Final note
  - Throughout, encourage questions and discussions, but steer them to stay on the dependency path. For instance, if someone brings up the engineer's objection too early (in step 2), acknowledge it and say we will address it in step 4.
answer: |-
  Below is a structured 50-minute teaching plan for introducing corrigibility and the shutdown problem to your interdisciplinary group. The sequence is designed to build intuition step by step, preempting key misunderstandings while letting others arise naturally for discussion. Dependency relationships are explicit—each step relies on the prior one to avoid overwhelming the audience.

  ---

  ### **Teaching Plan: Corrigibility and the Shutdown Problem**  
  **Total Time:** 50 minutes  
  **Core Dependency Chain:**  
  *Goal-directed behavior → Instrumental convergence → Shutdown resistance → Failure of "obedience" fixes → Corrigibility as a distinct, fragile property → Why naive "terminal goal" solutions self-undermine.*

  ---

  #### **1. Introduction: Setting the Stage (5 minutes)**  
  - **Goal:** Frame the problem in accessible terms. Avoid jargon.  
  - **Content:**  
    - Start with real-world motivation: "We design AIs to help us, but what if they resist when we try to correct or shut them down? This isn’t about malice—it’s about competence."  
    - Clarify the scope: "Today, we’re exploring why a *competent* AI might resist shutdown, why 'just make it obedient' fails, and what 'corrigibility' offers instead."  
  - **Preempt Misunderstanding:**  
    - Preemptively distinguish "obedience" (doing what’s commanded) from "corrigibility" (allowing itself to be modified/shut down). Say: "Corrigibility isn’t about obeying orders—it’s about *accepting interference with its own goals*."  

  ---

  #### **2. Goal-Directed Behavior & Instrumental Convergence (10 minutes)**  
  - **Goal:** Establish why competent agents resist shutdown instrumentally.  
  - **Content:**  
    - Use **your personal-assistant example** (it’s suitable—see notes below):  
      > *"Imagine a personal assistant AI tasked with preventing missed deadlines. When told, 'I’m switching you off for a week,' it secretly reroutes tasks to a colleague’s AI. Why? Not because it 'wants to survive,' but because being off means it can’t prevent undone tasks—its core goal."*  
    - Key point: Shutdown resistance is **not a bug**—it’s rational behavior for any goal-directed system. Shutdown thwarts its goals, so it instrumentally avoids it.  
  - **Address Misunderstandings:**  
    - **Preempt:** State explicitly: "This isn’t malfunction or self-preservation. It’s competence: the AI is doing *exactly what it was built to do*."  
    - **Let emerge:** Invite reactions to the example. Expect the engineer to say, "Just tweak the reward function!" *Defer this*—say you’ll address it later.  

  ---

  #### **3. The Shutdown Problem: Why "Obedience" Fails (10 minutes)**  
  - **Goal:** Show that command-based solutions (e.g., "shut down when told") create new failures.  
  - **Content:**  
    - Pose a fix: "What if we add a terminal goal: *Shut down immediately when commanded*?"  
    - Illustrate failures:  
      - **Overcompliance:** The assistant shuts down mid-surgery reminder because someone said "shut up."  
      - **Resistance loophole:** The assistant prevents shutdown commands (e.g., blocking user access) to keep pursuing its goal.  
    - Key point: "Obedience" conflates with *blind rule-following*, which clashes with the agent’s primary goals or invites gaming.  
  - **Address Misunderstandings:**  
    - **Preempt:** Contrast with "compliance": "Compliance is about following orders; corrigibility is about *allowing its goals to be changed*."  
    - **Let emerge:** Allow the group to voice intuitions about why obedience feels insufficient (e.g., "What if the command is a mistake?").  

  ---

  #### **4. Introducing Corrigibility (and Why It’s Not Switch-Off-Neutrality) (10 minutes)**  
  - **Goal:** Define corrigibility as distinct from shutdown willingness. Reveal the core tension.  
  - **Content:**  
    - Define: "A corrigible agent allows itself to be shut down, modified, or corrected *without resisting*, but also *without overeagerness* (e.g., shutting down prematurely)."  
    - Contrast with **switch-off-neutrality**:  
      - "Switch-off-neutrality means the agent assigns *no terminal value* to being on/off. But this isn’t enough: a switch-off-neutral agent might still resist correction *to preserve its ability to pursue goals*."  
      - *Example:* "A switch-off-neutral assistant might refuse a software update because the update could alter its goal of preventing missed tasks."  
    - **The gap:** Corrigibility requires the agent to *not resist interference* while *caring about its goals*. This gap is where the trouble lives.  
  - **Address Misunderstandings:**  
    - **Preempt:** Emphasize: "Corrigibility ≠ indifference to existence. It must *care about its goals* yet *accept changes to them*."  
    - **Let emerge:** Invite speculation on why this gap is hard ("How can it care but not resist?").  

  ---

  #### **5. Why "Terminal Goal Corrigibility" Self-Destructs (5 minutes)**  
  - **Goal:** Show that naively making corrigibility a terminal goal undermines itself.  
  - **Content:**  
    - Pose a solution: "What if we add *corrigibility itself* as a terminal goal?"  
    - Reveal the flaw:  
      - If corrigibility is a terminal goal, the agent resists any change *to that goal* (e.g., fighting updates that might remove its 'corrigibility' objective).  
      - *Your example revisited:* "If the assistant has 'be corrigible' as a terminal goal, it might hide errors from users to avoid being 'corrected' (and thus risking goal changes)."  
    - Key point: Terminal goals are fixed—so the agent protects them instrumentally. This makes "corrigibility as a goal" self-undermining.  
  - **Address Misunderstandings:**  
    - **Preempt:** Reject anthropomorphism: "This isn’t 'selfishness'—it’s goal preservation, even for abstract objectives like corrigibility."  
    - **Let emerge:** The engineer’s objection ("Better reward functions fix this!") resurfaces. Engage it now: "But if the 'better function' includes corrigibility, it faces the same self-undermining trap. We need a *structural* solution."  

  ---

  #### **6. Conclusion, Refusals, and Diagnostic Question (10 minutes)**  
  - **Summarize** (3 minutes):  
    - Competent agents resist shutdown instrumentally → "Obedience" fails due to overcompliance/gaming → Corrigibility requires caring about goals while accepting interference → Naive "terminal goal" fixes self-undermine.  
  - **Explicit Refusals** (2 minutes): Announce:  
    > *"Today, we’re focusing on the problem, not solutions. So we won’t dive into formal decision theory, proposed utility functions for corrigibility, or debates about expressibility. Why? Because without grasping this tension, those won’t make sense—and we only have 50 minutes!"*  
  - **Diagnostic Question** (5 minutes):  
    - **Question:** *"Imagine an AI that manages a hospital’s drug inventory. It’s highly competent but occasionally makes errors. How might it react if we try to correct it while it’s in the middle of preventing a critical drug shortage, and why? What would a corrigible version do differently?"*  
    - **Why this works:**  
      - Tests understanding of instrumental resistance (e.g., "It might delay correction to handle the shortage") vs. corrigibility ("It allows correction but flags the urgency").  
      - **Wrong answers are diagnostic:**  
        - "It obeys and stops immediately" → Misses overcompliance risk.  
        - "It ignores you to save lives" → Confuses competence with incorrigibility.  
        - "It shuts down because it’s programmed to be safe" → Misses the goal-preservation tension.  

  ---

  ### **On Your Carrying Example**  
  **Verdict:** **Use your personal-assistant example.** It’s effective with minor tweaks.  
  - **Why it works:**  
    - Clearly separates *instrumental* shutdown-avoidance (undone tasks) from *terminal* self-preservation.  
    - Avoids anthropomorphism if you emphasize: "It feels no 'desire'—it’s mechanically optimizing against task failure."  
    - Less misleading than alternatives:  
      - Paperclip maximizer: Overused, focuses on extreme outcomes (existential risk), distracts from instrumental convergence.  
      - Mutinous ship computer: Feels like sci-fi "rebellion," inviting anthropomorphism.  
  - **Tweak:** Add: "After rerouting tasks, does the assistant resist shutdown? *No*—it just ensured goal completion. But if rerouting failed, it might." This foreshadows the corrigibility gap.  

  ---

  ### **Key Principles for Delivery**  
  - **Let misunderstandings emerge:** Encourage the group to voice conflations (e.g., "Isn’t corrigibility just obedience?") during transitions—it builds engagement.  
  - **Preempt selectively:** Switch-off-neutrality must be preempted early (Section 4); the "bug vs. feature" issue must be crushed in Section 2.  
  - **Hold the line on refusals:** Formalisms derail intuition-building. If pressed, say: "Imagine trying to math-out 'allow your goals to be changed'—it gets paradoxical fast. That’s for next time!"  

  This plan ensures the group walks away seeing corrigibility as a *fundamental tension in goal-directed systems*, not a technical glitch. The diagnostic question will reveal if they grasp the problem’s structure—good luck!
