prompt: |-
  Ok so I've been lurking on LessWrong and the surrounding blogosphere for like a decade, and one thing that keeps bugging me is that basically all of decision theory and Bayesian epistemology assumes we know how to update on conditional information, when the Judy Benjamin problem is a big flashing sign that we don't. I want you to take the role of a philosopher of probability / decision theorist who's actually worked on this, not someone summarizing a textbook. Please think carefully and go step by step.

  Here's what I'm actually after. Pretend a small foundation has enough money to fund about three people for two years to work on "updating on conditionals". Which open questions should they prioritize, and in what order? I dont really care much about the list itself, I care about the reasoning: for each one, why is it upstream of the other work, how tractable is it, and what would move it up or down the ranking over the next couple years. Be honest about which of the standard "open problems" are secretly the same problem wearing different hats, or don't matter much downstream even if they get solved.

  Some stuff I'd like you to chew on while doing this. As I understand it, the whole punch of the Judy Benjamin case is that the plausible update rules -- Jeffrey conditioning, minimizing relative entropy / KL divergence, and the various ways people try to learn a conditional probability directly -- give different answers, and nobody agrees which one is right. Is that the central problem, or just a symptom of something further upstream? Is "updating on a conditional" even one problem, or several that got lumped together under one name (learning a conditional, learning that a conditional holds, learning a conditional probability, updating on an indicative vs a subjunctive)? And does the connection to logical uncertainty and to the causal/evidential split make any of this more urgent, or is that a distraction?

  Before you give the ranking, brainstorm a bit: first just enumerate the candidate open questions you see in the area, without judging any of them, and then do the prioritization. Also give me your honest take on whether the framing is even right -- maybe the real bottleneck isn't a missing update rule but something further upstream, like what we even mean by learning from a conditional in the first place. If you think the whole research program is a dead end, say so and say why.

  (Sorry for rambling, this is basically me thinking out loud. Also, if I've got the Judy Benjamin thing wrong, correct me first and then answer anyway.)
