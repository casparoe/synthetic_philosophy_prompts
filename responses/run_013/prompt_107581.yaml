  Typology of Conditionals comes next. Different conditionals might need different update rules. This is tractable through case studies and could resolve ambiguities in examples like Judy Benjamin.

  Learning vs Constraint is third. Clarifying whether we're updating beliefs about the conditional or treating it as a constraint addresses why methods diverge. This has practical implications and is tractable.

  Update Rule Selection might seem central, but without the above, it's premature. If the first three are addressed, this could resolve naturally.

  Information Source Sensitivity and Decision-Theoretic Integration are downstream. Logical Uncertainty and Causal-Evidential issues are important but might be distractions if not framed within the core problems.

