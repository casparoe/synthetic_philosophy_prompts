prompt: |-
  Eighteen months ago I took over a small team and deliberately changed what it ran on. The old culture was the one I grew up in: you did not want to be the person who dropped the ball, because being that person was not something you could undo. I replaced it with what I took to be the more decent arrangement — we discuss the act and not the actor, and the vocabulary of character is out of bounds. I had absorbed the standard contrast: guilt is about what you did, shame is about who you are, and any half-civilised institution should prefer the first.

  What I did not anticipate was what happened to the apology. Under the old arrangement, dropping the ball was not a bounded event with a bounded remedy; the only exit was not becoming the sort of person who does that. Under the new one it is precisely bounded: you name it, you own it, you say what you will do differently, and the account is settled. That is now what happens, and it happens repeatedly, by the same people, with what I am fairly sure is genuine feeling each time. The apology has become the price of the act. And the one colleague who is still, in the old sense, ashamed of herself has not repeated anything in a year; she is also the person everyone finds hardest to work with, because she will not accept the absolution we keep offering and keeps reopening matters we regard as closed.

  So the thing I keep needing a word for is not the object of these two emotions but their exit conditions. Guilt appears to have a bounded exit — an act can be acknowledged and repaired, and then it is finished. Shame appears to have none, since a self cannot be repaired; its only exits are concealment or becoming someone else. If that is right, the two emotions deter differently: guilt taxes the act, shame prevents it. And the very feature that makes guilt morally attractive, that it is answerable and can be discharged, is what makes it compatible with repetition.

  Is there a name for this? If there is, I want to know what it covers and, more, what it leaves out, because the two labels I have been offered do not fit. Moral licensing is about a good deed buying a bad one; here nothing good is banked in advance — the payment is made afterwards, in the same currency as the harm. Restorative justice is a proposal about how to respond to wrongdoing, whereas what I am describing is a claim about how two emotions are built. If there is no name, I would like one, with the edges drawn: what has to be true of an emotion for this to apply to it, whether it extends to emotions whose objects are not acts at all — grief, anger at the dead, regret that has no addressee — and where the reasoning goes wrong, if it goes wrong. Because as it stands it looks like an argument for preferring the less decent of two emotions, and I would rather be shown that it is not.
reasoning: |-
  Okay, let me start by unpacking the user's query. They took over a team eighteen months ago and shifted the culture from one based on shame to one focused on guilt. The old culture punished the person, making any mistake a permanent mark on their identity. The new approach separates the action from the actor, emphasizing accountability without character judgment. 

  The user noticed that under the guilt-based system, apologies become transactional. People acknowledge their mistake, state how they'll fix it, and move on. But this leads to repeat offenses because the emotional cost is bounded—once paid, it's over. In contrast, the one person still operating with shame doesn't repeat mistakes but struggles with forgiveness, making collaboration hard.

  The core issue here is the exit conditions of guilt versus shame. Guilt has a clear resolution through apology and amends, making it repeatable. Shame lacks an exit; it's tied to the self, leading to avoidance or transformation but no simple closure. The user needs a term for this distinction, specifically the boundedness of guilt versus the unboundedness of shame.

  Looking at existing concepts: Moral licensing doesn't fit because it's about good deeds offsetting bad ones, not post-harm payment. Restorative justice is procedural, not about emotional structures. The user wants a term that captures the structural difference in how these emotions resolve.

  I recall that guilt is often called "expiable" in theological contexts, meaning it can be atoned for. Shame isn't expiable since it's identity-based. Terms like "terminable" or "resolvable" might work, but "expiable" is more precise. However, it's mainly used in religious settings. Another angle is the "economy of guilt"—a closed system where debts are paid and cleared, versus shame's open-ended economy.

  The user might also be hinting at a deeper concern: Is promoting guilt over shame morally compromising? They want to ensure their approach isn't enabling repeat offenses. They need validation that guilt's boundedness is practical but must be managed to prevent abuse. Terms like "transactional guilt" or "moral amortization" could describe the repetitive aspect. 

  Beyond terminology, the user needs reassurance that their system isn't flawed. They might be seeking strategies to balance accountability without encouraging repetition. Highlighting the necessity of proportional amends and genuine remorse could address this. Also, acknowledging that shame has its place for severe breaches but isn't scalable for everyday teamwork.
answer: |-
  What you're describing is a profound distinction in the emotional "economy" of guilt versus shame, specifically focused on the **terminability of the emotional debt**. There isn't a single, universally accepted term for this precise concept, but we can build one and define its boundaries:

  1.  **The Core Concept: "Expiability" (or "Terminability") of Emotional Debt**
      *   **Guilt** is **expiable**: The negative emotional state (the "debt") incurred by a wrongful *act* can be definitively settled ("expiated," "atoned for," "paid off") through specific reparative actions (acknowledgement, apology, amends, punishment). Once these conditions are met, the emotional debt is considered *discharged*, the account is *closed*, and the actor is (in principle) free from the burden. **The exit condition is bounded and achievable.**
      *   **Shame** is **inexpiable** (or **non-terminable**): The negative emotional state arises from a perceived flaw in the *self*. Because the self is the core issue, no specific act of reparation can definitively "settle the account." The debt cannot be fully paid off through external actions. The exits are either hiding the flaw (concealment) or undergoing a fundamental change in identity (becoming someone else), neither of which is a bounded "transaction" like an apology. **There is no definitive, bounded exit condition.**

  2.  **Why Existing Terms Don't Fit:**
      *   **Moral Licensing:** As you note, this involves "banking" moral credit *in advance* to offset future transgressions. Your observation is about *settling a debt incurred after the act*, in the same moral "currency" (acknowledgement/apology for the harm caused). It's post-hoc settlement, not pre-emptive credit.
      *   **Restorative Justice:** This is indeed a *process* for achieving resolution and healing *after harm*, often leveraging the bounded nature of guilt (acknowledge, repair, reintegrate). Your focus is on the inherent *emotional structure* (expirability) that makes such a process conceptually possible for guilt but not for shame.

  3.  **What "Expiability" Covers:**
      *   The core feature is the existence of a *defined pathway* to discharge the negative emotional state associated with a specific event or act.
      *   It applies primarily to emotions triggered by *actions* perceived as wrong or harmful by the individual or their community (guilt, certain types of regret, obligation).
      *   It highlights why guilt is *practical for social regulation*: It allows for repeated transgressions to be addressed individually without permanently ostracizing the actor, facilitating cooperation and repair.

  4.  **What "Expiability" Leaves Out (Its Edges):**
      *   **Emotions not tied to specific acts:** Grief, existential dread, anger at the dead, vague regret without a clear cause or addressee. These often lack a specific "debt" that can be "paid off" through defined actions. Their resolution is typically more complex, involving acceptance, processing, or the passage of time, not bounded expiation.
      *   **Severity & Proportionality:** The concept doesn't automatically imply the reparative action *is* proportional or sufficient. A trivial apology might feel expiating to the transgressor but be woefully inadequate to the victim. The *perception* of expiation matters more for the emotional discharge than objective sufficiency.
      *   **Genuine Transformation:** Expiation settles the debt for the *act*; it doesn't necessarily guarantee the actor won't repeat it or has fundamentally changed their character (as your team illustrates). Shame might be more likely to *force* character change precisely because it offers no easy exit.
      *   **External vs. Internal Resolution:** Expiation often relies on external validation (the victim/community accepting the apology/amends). Shame is intensely internal, making external absolution ineffective (as with your colleague). Inexpiable emotions might only be resolvable through internal shifts, not external transactions.

  5.  **Is this an Argument for Shame? Not Necessarily:**
      You're right to be troubled by the implication. Here's why preferring guilt's expiability isn't inherently "less decent," though it requires careful management:
      *   **Scalability & Humanity:** A system requiring fundamental identity change (shame's exit) for every error is unsustainable and cruel for most human interactions. Guilt allows for learning, growth, and re-integration without demanding total self-annihilation for minor or even significant mistakes.
      *   **Focus on Repair:** Guilt's boundedness channels energy towards *fixing the harm* (making amends) rather than solely focusing on the internal state of the transgressor.
      *   **Preventing Concealment:** Shame's primary exit (concealment) is destructive. It hides problems, prevents learning, and erodes trust. Guilt's bounded exit encourages disclosure and repair.
      *   **The Danger:** The risk, as you've observed, is **transactional detachment**. If the "price" (apology/amends) is too easily paid or becomes purely ritualistic without genuine remorse or effort to change *behavior*, guilt loses its deterrent power and becomes a license to repeat. This is where your managerial challenge lies: ensuring the expiatory act (apology) is coupled with genuine accountability and demonstrable effort to prevent recurrence, preventing the cycle from becoming purely cynical.

  **Conclusion:**

  The clearest term for the core distinction is **expiability** (for guilt) vs. **inexpiability** (for shame), emphasizing the possibility or impossibility of definitively *settling the emotional debt* through bounded actions. Alternatively, **terminability** vs. **non-terminability** captures the exit condition.

  This structure explains the mechanism behind your observations: guilt's bounded exit makes repetition possible (and manageable in a social context), while shame's lack of exit prevents repetition but at a high personal and relational cost, often leading to concealment or paralyzing self-loathing instead of productive change. It applies best to action-based negative emotions and highlights why guilt-based systems are more practical for ongoing cooperation, *provided* the expiatory process maintains integrity and fosters genuine accountability beyond the transactional ritual. The "indecency" lies not in preferring guilt's structure, but in allowing its reparative mechanism to become hollow or disconnected from meaningful behavioral change.
