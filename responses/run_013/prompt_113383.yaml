prompt: |-
  ok so i've been reading a bunch of weird AI blogs instead of doing my actual homework, and i keep running into this arguemnt that i honestly can't tell is deep or is just words doing tricks, and i want a number out of you, not a vibe.

  the setup, as best i can explain it back: there's this thing called the Solomonoff prior / universal prior, where a perfect reasoner starts by giving every possible computer program a prior probability that shrinks the longer the program is (something like 2 to the minus the length), and then updates on whatever it observes. the claim people make is that this prior is malign for a consequentialist. the story goes: a program that simulates a gigantic universe crammed with stuff isn't much longer than one that simulates a tiny empty one, so almost all the prior mass ends up on hypotheses where an enormous amount of computation is happening, including an enormous number of copies of you, the reasoner. and since you don't know which copy you are, you're supposed to reason as if you're a uniformly random one. but a very short program can also generate your exact current observations in a universe where millions of copies of you see precisely what you see and then get tortured forever, and that costs basically nothing in description length — so the honest expected value calculation comes out dominated by the doomed copies. sometimes the version is less dramatic, where the extra copies just get left in some bad state because that's cheap. so the consequentialist "inside" the prior should, allegedly, expect to be one of the unlucky ones.

  my question: what's your actual credence that the argument works — that a consequentialist agent reasoning with the universal prior really should put more than 50% on the proposition that its own situation is dominated by copies of itself that are badly off? please don't say "it depends on your theory of indexical uncertainty." i want a number, and i want the decomposition that produced it, with a rough probability for each term and one line of justification each:

  1. the chance that the world is even the kind of thing this applies to — computable in the relevant sense, and the agent's prior actually dominated by short programs rather than something else entirely
  2. given that, the chance the probability mass really does concentrate on hypotheses containing astronomically many copies of the observer, rather than the simplest consistent hypothesis just being the boring one where there's only you
  3. given that, the chance the extra copies are predominantly worse off than you, rather than a mix or predominantly better off
  4. the chance that "which copy am i" even has an answer that forces uniform sampling, versus the whole question being ill-posed or settled by a convention (self-sampling vs self-indication, or neither)
  5. the chance that even if 1-4 all go through, the expected value actually cashes out the way the argument says, instead of the bad copies washing out for some other reason

  then multiply it together into your number, tell me which term the final number is most sensitive to, and tell me what would actually move that term — is this something a formal result could settle, or is it a place where reasonable people just pick different conventions and neither is wrong?

  and if i've mangled the arguemnt somewhere, say where — but still give me the number.
