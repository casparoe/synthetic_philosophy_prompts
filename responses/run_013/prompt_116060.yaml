answer: |-
  Here's your menu of interpretations for "absence of evidence," their validity, and historical application—ready for your group discussion:

  ### The Interpretations & Verdicts
  1.  **The Tautological Reading:**
      *   **Claim:** "Lack of proof something exists ≠ proof it doesn't exist." (Formally: ~E ≠ E~)
      *   **Verdict:** **Trivially True.** It's a basic logical truth. Denying this leads to absurdity (e.g., "You can't prove unicorns *don't* exist, therefore they must?").
      *   **Supports Friend?** **No.** It only says silence *isn't proof of absence*; it doesn't say silence *supports presence* or is *meaningless*. It's the starting point, not a conclusion.

  2.  **The Probabilistic (Neutral) Reading:**
      *   **Claim:** A specific absence of evidence *does not change* our prior probability (credence) that the thing existed/happened. It's truly neutral information.
      *   **Verdict:** **Rarely True (Usually False) in practice.** This requires the *absence itself* to be completely unsurprising *whether the thing existed or not*. (e.g., Not finding a specific grain of sand on a beach tells us nothing).
      *   **Supports Friend?** **No.** For a village missing from a survey, this is unlikely. We'd *expect* a village to appear in a relevant survey *if it existed then*. Its absence *should* lower our credence.

  3.  **The Probabilistic (Negative) Reading (Standard Bayesian):**
      *   **Claim:** A specific absence of evidence *lowers* the probability (credence) that the thing existed/happened, relative to our prior belief *and* the expectations of the source. The stronger the expectation of evidence *if it existed*, the more the absence counts *against* existence.
      *   **Verdict:** **Substantive and Defensible.** This is how reasoning under uncertainty typically works. The key is assessing the *expectation* of evidence.
      *   **Supports Friend?** **No.** This interpretation *directly undermines* her argument. If the survey *should* have included the village if it existed, its absence *is* evidence (not proof, but evidence) suggesting it *didn't* exist at that time.

  4.  **The Strong (Positive Evidence for Absence) Reading:**
      *   **Claim:** A specific absence of evidence *is* positive evidence, or even proof, that the thing *did not* exist/happen. Silence *confirms* absence.
      *   **Verdict:** **Generally False.** Absence of evidence only *strongly suggests* absence if the evidence would be *virtually certain* to exist *and* be found *if* the thing were present. This is a high bar (e.g., not finding *any* oxygen in a sealed room *is* strong evidence it's absent).
      *   **Supports Friend?** **No.** She's arguing *for* existence, not absence. This reading is about confirming something *wasn't* there.

  5.  **The Friend's Misapplication (The Inversion Fallacy):**
      *   **Claim:** "The absence of evidence (in the early survey) is not evidence of absence; *therefore*, the thing probably *did* exist all along, and the survey just missed it." (Using AofE != EofA as *positive support* for presence).
      *   **Verdict:** **False and Illogical.** This confuses "not proof of absence" with "evidence for presence." The tautology grants *only* that absence isn't *proven*; it provides *zero* positive support for existence. It leaves the prior probability unchanged at best, or lowers it (per Reading 3) at worst. **This is the reading that backs what she did.**
      *   **Supports Friend?** **Yes (but incorrectly).** This is the flawed reasoning she used to "wave off" the missing village and assert its continuous existence.

  ### The Historian's "Argument from Silence"
  *   **The Core Principle:** An argument from silence is **only valid if two conditions are met**:
      1.  **Expectation of Mention:** We have strong reason to believe that **if the thing existed/happened, this specific source *would* (or very likely *should*) have recorded it.** (e.g., A comprehensive tax roll *should* list all taxable villages; an annalist claiming completeness *should* mention a major battle in their area/year).
      2.  **Reliability & Completeness:** We have strong reason to believe the source is **reliable on such matters** and **sufficiently complete/preserved** in the relevant section. (A fragmentary manuscript or a biased source failing to mention something they'd *want* to ignore weakens the argument).
  *   **Verdict:** When these conditions are met, absence of evidence **is** significant (probative) evidence of absence (Reading 3). When they are *not* met, the silence is weak or irrelevant evidence (closer to Reading 2).
  *   **Your Friend's Error:** She invoked the phrase to **dismiss** the silence *without* examining whether these conditions apply to the early survey. Did the survey *aim* for completeness? Was it thorough for that district? Is it well-preserved? If "yes," the silence *is* meaningful evidence against the village's existence *at that time*. The phrase doesn't magically negate this.

  ### Texts vs. Archaeology
  *   **Texts:** The conditions for a strong argument from silence are often *clearer* but hinge on authorial intent, genre, and preservation. We can often assess *why* something might be recorded. (e.g., A victory monument *should* list conquered towns; its absence is strong evidence the town wasn't conquered *by that ruler*).
  *   **Archaeology:** Arguments from silence are **much harder/more perilous**. "Absence of evidence" is often the norm due to:
      *   **Preservation Bias:** Organic materials rot, sites are destroyed or buried.
      *   **Sampling Bias:** We've only excavated a tiny fraction of most sites/regions.
      *   **Visibility Bias:** Some activities leave little/no trace (e.g., nomadic pastoralism vs. monumental building).
      *   **Verification:** It's often impossible to be *certain* we *should* have found something if it existed.
  *   **Key Difference:** In archaeology, "absence of evidence" frequently *isn't* good "evidence of absence" (Reading 2 or even 1 is often more applicable) unless the context is exceptionally well-understood and preserved (e.g., no bones of a species in a perfectly preserved, comprehensively sampled, datable layer *is* strong evidence it wasn't there *then*). Historians using texts can (cautiously) make arguments from silence *more often* than archaeologists can.

  ### Summary for Your Group
  1.  **Tautology (True but Useless):** Silence isn't *proof* of absence. Doesn't help your friend.
  2.  **Neutral Silence (Rare):** Silence tells us nothing. Unlikely for the village/survey.
  3.  **Negative Evidence (Standard):** Silence *lowers* probability if evidence was *expected*. **This applies to the village case if the survey was comprehensive.**
  4.  **Proof of Absence (False):** Silence = proof it wasn't there. Usually wrong, not used by your friend.
  5.  **Friend's Fallacy (False):** "Not proof of absence" = "Evidence for presence". **This is what she did. Logically invalid.**
  6.  **Historian's Rule:** Silence only counts *against* existence if the source **would** have mentioned it and **could** be trusted to be complete/reliable on that point. She skipped this analysis.
  7.  **Archaeology vs. Texts:** Arguments from silence are **much weaker and riskier** in archaeology due to preservation and sampling issues. Textual silences can be stronger evidence *if* the source context justifies expectation.
