  We are designing a case that puts the Frege-Geach problem under maximum strain, with the following features:
   - The normative predicate is scalar (e.g., cowardly, rude, generous) rather than flat (like wrong).
   - The case includes a comparative use of that predicate (e.g., more cowardly, less rude).
   - The case includes at least one inference with a plainly non-normative premise.
   - The same normative sentence must appear asserted, negated, and as the antecedent of a conditional.
   - The surrounding inference must be valid only if the sentence carries the same meaning in all three positions.

   Let's choose the scalar normative predicate "cowardly". We'll build a short argument around it.

   Scenario:

   Alex and Bailey are discussing a mutual friend, Charlie, who is considering whether to participate in a risky protest.

   Alex: "Charlie's refusal to join the protest was cowardly." [This is an assertion of a normative sentence with a scalar predicate.]

   Bailey: "I disagree. If Charlie's refusal was cowardly, then his refusal to even sign the online petition would be even more cowardly. But I don't think his refusal to sign the petition was cowardly at all. Therefore, his refusal to join the protest wasn't cowardly either."

   Let's break down Bailey's response:

   1. Bailey makes a conditional: "If Charlie's refusal [to join the protest] was cowardly, then his refusal to sign the online petition would be even more cowardly."
      - Here, the antecedent is the normative sentence that Alex asserted: "Charlie's refusal was cowardly."

   2. Bailey then denies the consequent of that conditional: "I don't think his refusal to sign the petition was cowardly at all."
      - This is the negation of a normative sentence: "Charlie's refusal to sign the petition was cowardly" is negated.

   3. Bailey concludes: "Therefore, his refusal to join the protest wasn't cowardly either."
      - This is the negation of the original assertion.

   The inference in Bailey's argument is:

     Premise 1: If P then Q.   [Where P: "Refusal to join was cowardly", Q: "Refusal to sign was cowardly" (and in fact even more cowardly)]
     Premise 2: Not Q.          [Bailey denies that the refusal to sign was cowardly]
     Conclusion: Not P.

   This is modus tollens, which is valid. But note that in Premise 1, we have a comparative: "even more cowardly". This implies that if the refusal to join is cowardly (say, at level L), then the refusal to sign must be at a level of cowardice greater than L. But if we deny that the refusal to sign is cowardly (i.e., it is not cowardly at all, so level 0 or below the threshold), then by the conditional, the refusal to join cannot be cowardly either.

   However, note that the conditional premise also contains an embedded comparative claim. We can represent the conditional as:

     P → (Q & (cowardly-degree(Q) > cowardly-degree(P)))

   But Bailey only explicitly denies that the refusal to sign is cowardly (i.e., ~Q). We might worry that the denial of Q does not require the same meaning as in the conditional because the conditional also has a comparative element.

   To make the inference depend on the same meaning and to include the comparative, let's adjust the scenario slightly:

   Revised scenario:

   Alex: "Charlie's refusal to join the protest was cowardly."

   Bailey: "Wait, that can't be right. Because if that refusal was cowardly, then his refusal to sign the online petition would be even more cowardly. But his refusal to sign the petition wasn't cowardly at all — in fact, it was perfectly understandable. So, his refusal to join the protest wasn't cowardly."

   Now, let's represent the argument:

     P: Charlie's refusal to join the protest was cowardly.
     Q: Charlie's refusal to sign the online petition was cowardly.

     Premise 1: If P, then (Q and the cowardliness of Q is greater than the cowardliness of P).
     Premise 2: Not Q.   (Because Bailey says it wasn't cowardly at all, so Q is false)

     Therefore, by modus tollens on the conditional (if P then ... Q ...), we get: Not P.

   But note: the conditional also has a comparative claim. However, if Q is false, then the conjunction (Q and ...) is false regardless of the comparative part. So the modus tollens still holds.

   However, we need to ensure that the same meaning of "cowardly" is used throughout. The challenge for expressivism is to explain how "cowardly" in P (asserted by Alex), in the antecedent of the conditional (in Bailey's Premise 1), in the negation (in Bailey's Premise 2), and in the comparative (also in Premise 1) all have the same meaning.

   Additionally, we have a plainly non-normative premise? Actually, Bailey says "it was perfectly understandable" for the refusal to sign. But that might be normative too. Let's add a non-normative fact:

   Revised again to include a non-normative premise:

   Bailey: "Wait, that can't be right. Because if that refusal was cowardly, then his refusal to sign the online petition would be even more cowardly. But his refusal to sign the petition wasn't cowardly at all — in fact, he didn't sign because he was out of the country and had no internet access for weeks. So, his refusal to join the protest wasn't cowardly."

   Now, the non-normative premise is: "he was out of the country and had no internet access for weeks." This is a descriptive fact that is offered as a reason for why the refusal to sign wasn't cowardly.

   So the structure:

     P: Refusal to join was cowardly.
     Q: Refusal to sign was cowardly.

     Premise 1: P → (Q and cowardly-degree(Q) > cowardly-degree(P))
     Premise 2: Charlie was out of the country and had no internet access. (Non-normative fact, call it R)
     Premise 3: R → ~Q   (Because the non-normative fact explains why it wasn't cowardly: it wasn't even a refusal in the same sense? Or it excuses it.)

     From Premise 2 and Premise 3, we get ~Q.
     Then by Premise 1 and ~Q (and the fact that Q is false, so the conjunction in the consequent is false), we get ~P.

   Now, the validity of the inference depends on the meaning of "cowardly" being constant. In particular:

     - In Alex's assertion: P is asserted.
     - In Bailey's Premise 1: P is unasserted (in the antecedent of a conditional) and Q is unasserted (in the consequent and in a comparative).
     - In Bailey's Premise 3: Q is negated (in the consequent of a conditional, but note that the conditional itself is asserted, so the negation of Q is part of the asserted content? Actually, Premise 3 is asserted, and it says that R implies the negation of Q. So we have an occurrence of ~Q in an embedded context).

   Also note the comparative: we are comparing degrees of cowardliness. This scalar aspect is important.

   Expressivist Challenge:

   Expressivism traditionally holds that the meaning of a normative sentence is the attitude it expresses. For example, to say "X is cowardly" is to express a negative attitude of disapproval toward X because of its cowardice.

   The Frege-Geach problem: how can the same attitude be expressed when the sentence is embedded? In the conditional, if we say "If X is cowardly, then ...", we are not expressing disapproval of X. Similarly, when we deny that X is cowardly, we are not expressing disapproval but perhaps the opposite or the absence.

   The usual reply is that the attitude is present in a different mode: in the antecedent, we are considering a hypothetical scenario in which we have that attitude. But with scalar and comparative predicates, the challenge intensifies.

   In our case:

     - The comparative: "even more cowardly" requires that we can compare degrees of cowardliness. But if the meaning of "cowardly" is just the expression of an attitude, then what is the attitude for "more cowardly"? It might be a stronger degree of disapproval? But note that in the conditional, we are not actually expressing any disapproval at all.

     - Moreover, the non-normative premise (R) is used to support ~Q. The expressivist must explain how a non-normative fact (about being out of the country) can be a reason for a normative conclusion (~Q). This is the familiar challenge of explaining the connection between descriptive and normative claims, but in the context of embedded occurrences.

   What the expressivist must say about each occurrence:

     1. Alex's assertion of P: Expresses disapproval of Charlie's refusal to join the protest (with a certain intensity, because it's scalar).

     2. Bailey's Premise 1 (the conditional): The expressivist might say that this expresses a complex attitude: namely, a commitment to disapprove of the refusal to sign the petition (and at a higher intensity) if one disapproves of the refusal to join. But note that the conditional also has a comparative: it requires that the degree of cowardliness (and hence the degree of disapproval) for the refusal to sign is higher than for the refusal to join.

     3. Bailey's Premise 2: This is a non-normative assertion. It expresses a belief, not a normative attitude.

     4. Bailey's Premise 3: This is a conditional that connects a non-normative fact to a normative one. It might express a complex attitude: a commitment to not disapproving of the refusal to sign (i.e., to having no negative attitude toward it) if one believes that Charlie was out of the country and had no internet access.

     5. The negation of Q in the conclusion of Premise 3: This expresses the absence of disapproval toward the refusal to sign? Or perhaps a positive attitude of approval? But note that Bailey says "it wasn't cowardly at all", which might be taken as a positive assessment? Or just the absence of negative? Expressivists have different accounts for negation.

     6. The conclusion ~P: Expresses the absence of disapproval toward the refusal to join? Or a positive attitude of approval? But note that Bailey is only denying that it was cowardly, not necessarily saying it was brave.

   The problem with the scalar and comparative:

     In the comparative, we are not just expressing a simple attitude but making a comparison between two actions. The expressivist must account for the meaning of "more cowardly" in terms of attitudes. One idea is that "more cowardly" expresses a higher degree of disapproval. But in the conditional, we are not actually expressing that higher degree of disapproval. We are saying that if we disapprove of the refusal to join at level L, then we must disapprove of the refusal to sign at a level greater than L. This conditional commitment is complex and requires that we can quantify and compare degrees of disapproval.

     However, note that the expressivist account of the conditional might be that it expresses a higher-order attitude: a commitment to not having the attitude expressed by the antecedent without having the attitude expressed by the consequent. But in the case of the comparative, the consequent is not just a simple attitude but one with a specific degree. So the commitment would have to be: if one has an attitude of disapproval toward the refusal to join at degree d, then one must have an attitude of disapproval toward the refusal to sign at a degree greater than d.

     This requires that the expressivist can make sense of degrees of attitudes and comparisons between them. Moreover, the non-normative premise (R) is supposed to defeat the attitude toward Q. How? The expressivist might say that the agent has a general commitment that if R is true, then they do not disapprove of the refusal to sign. But then the inference from R and the commitment to not having the attitude toward Q (given R) leads to not having that attitude. Then, by modus tollens on the first conditional, they must not have the attitude toward P.

     The strain comes from the combination of:

       - The scalar nature: requiring degrees of attitudes and comparisons.
       - The embedding in a conditional: requiring that the attitude is not expressed but conditionally committed to.
       - The non-normative premise: which must be able to directly bear on the attitude (without itself being normative).

     The expressivist might have the resources to explain this by building a complex account of attitudes and their degrees, and by having a theory of how descriptive beliefs can trigger changes in normative commitments. But the challenge is to do so while preserving the same meaning of "cowardly" in all contexts.

   Inferential Role Expressivism:

     An expressivist who identifies meaning with inferential role (rather than with a simple attitude expressed) might have a better chance. On this view, the meaning of "cowardly" is given by the network of inferences it enters into. In our case, the inference is valid and relies on the same inferential connections for "cowardly" in all positions.

     However, the problem relocates: now the expressivist must explain the inferential role of normative terms without appealing to truth-conditional semantics. And the challenge of the scalar and comparative remains: the inferential role must include rules for comparing degrees and for how non-normative premises can defeat normative conclusions.

     Moreover, the expressivist must still account for the difference in attitude expression in asserted and unasserted contexts. The inferential role expressivist might say that the role of an asserted normative sentence is to express an attitude, but the role of the same sentence in an embedded context is to be a node in a larger inferential pattern. The challenge is to show that the same inferential role is maintained in both.

   The single feature that does the work:

     The key feature is the scalar and comparative nature of the normative predicate. Without the scalar aspect, we wouldn't have the comparative in the conditional. Without the comparative, the conditional would be simpler: P → Q. But with the comparative, we have a more complex consequent that requires a degree comparison. And the expressivist must account for degrees of attitude and their comparisons in embedded contexts.

     If we drop the scalar and comparative, and use a flat predicate, then the case becomes:

        Alex: P (asserted)
        Bailey: If P then Q. But R, and R implies not Q. So not P.

     This is a standard Frege-Geach case. The expressivist has developed responses for such cases (e.g., by appealing to higher-order attitudes or inferential commitments). The scalar comparative adds the extra strain of degrees and comparisons.

   The strongest line of defense for the expressivist:

     The expressivist might develop a sophisticated theory of degrees of attitude and the logic of scalar normative terms. For instance, they might model degrees of disapproval as a kind of measure and then define the comparative as a relation between these measures. In embedded contexts, they could treat the attitudes as being in a hypothetical state. The non-normative premise would then function as a constraint on the hypothetical state: if R is true, then in any hypothetical state we must not have disapproval of Q. This would block the conditional commitment from P to Q (with the comparative) because if we were to hypothetically have disapproval of P, we would have to have even more disapproval of Q, but the non-normative fact R prevents us from having any disapproval of Q. Hence, we cannot even hypothetically have disapproval of P.

     This line of defense requires a robust account of hypothetical attitudes and their degrees. The expressivist might argue that such an account is independently motivated and can be spelled out without collapsing into a truth-conditional semantics.

     However, critics might argue that this account is too complex and that it essentially mimics truth-conditional semantics, thereby undermining the expressivist's motivation.

   In conclusion, the case we designed puts maximum strain on expressivism by combining the Frege-Geach embedding with scalar comparatives and a non-normative premise. The expressivist must account for the same meaning (in terms of attitude or inferential role) across asserted, negated, and conditionally embedded occurrences, and do so for a scalar predicate with a comparative. The scalar comparative feature is the key element that takes the case beyond textbook examples.
answer: |-
  ### Case Design: The Cowardice Argument  
  **Scenario:**  
  Alex and Bailey are discussing Charlie's actions during a protest.  

  - **Alex (asserting):** "Charlie's refusal to join the protest was cowardly."  
  - **Bailey (reasoning):**  
    (1) "If Charlie's refusal was cowardly, then his refusal to even sign the petition was *more* cowardly."  
    (2) "But his refusal to sign wasn't cowardly at all—he was in the hospital that day."  
    (3) "So, Charlie's refusal to join wasn't cowardly."  

  ### Key Elements  
  1. **Normative sentence ("Charlie's refusal was cowardly") appears in three positions:**  
     - **Asserted:** Alex's initial claim.  
     - **Antecedent of a conditional:** (1) "If Charlie's refusal was cowardly..."  
     - **Negated:** (3) "Charlie's refusal to join wasn't cowardly."  
  2. **Scalar predicate:** "cowardly" (admits degrees: *cowardly*, *more cowardly*).  
  3. **Comparative use:** "more cowardly" in (1).  
  4. **Non-normative premise:** (2) "he was in the hospital" (factual excuse).  
  5. **Valid inference:** Modus tollens on (1) and (2):  
     - If P (refusal to join = cowardly), then Q (refusal to sign = more cowardly).  
     - Not-Q (refusal to sign ≠ cowardly, due to hospitalization).  
     - Thus, not-P (refusal to join ≠ cowardly).  
     **Validity hinges on "cowardly" meaning the same in P, Q, and not-Q.**  

  ---  
  ### Expressivist Analysis  
  **Expressivist thesis:** The meaning of a normative sentence is the attitude it expresses (e.g., disapproval).  

  #### What the expressivist must say about each occurrence:  
  1. **Asserted (Alex):**  
     - Expresses disapproval of Charlie's refusal to join.  
  2. **Antecedent of conditional (1):**  
     - Does **not** express disapproval. Instead, it hypothetically "supposes" disapproval (e.g., "If I were to disapprove of refusal X...").  
  3. **Negated (3):**  
     - Expresses the **absence** of disapproval (or approval) of refusal to join.  

  #### Why scalar/comparatives resist the "same attitude, different mode" reply:  
  - **Scalar degrees require gradable attitudes:**  
    "Cowardly" implies a threshold of disapproval. "More cowardly" requires comparing intensity of disapproval (e.g., *degree-based attitudes*).  
  - **Problem in the conditional (1):**  
    - The expressivist claims (1) expresses a *commitment*: "If I disapprove of refusal X, I must disapprove *more* of refusal Y."  
    - But "disapprove more" is not merely hypothetical—it requires quantifying attitude strength. Yet in (1), no actual disapproval is expressed for X or Y.  
    - **Strain:** How can unasserted, comparative attitudes ("disapprove more") retain the *same meaning* as asserted flat disapproval? The attitude "mode" (hypothetical vs. actual) changes the content (graded vs. threshold).  
  - **Non-normative premise (2) exacerbates the issue:**  
    - (2) uses a factual claim ("he was in the hospital") to defeat the attitude toward signing.  
    - The inference from (2) to "not cowardly" requires the *same* threshold of cowardly-disapproval to be preserved in (1) and (3). But if attitudes in (1) are hypothetical, how do they constrain actual attitudes in (3)?  

  ---  
  ### Inferential Role Expressivism: Relocating the Difficulty  
  **Thesis:** Meaning is defined by inferential role (e.g., logical connections to other sentences).  
  - **Advantage:** Can treat "cowardly" uniformly across positions via shared inference rules (e.g., modus tollens).  
  - **Problem:**  
    - The scalar comparative ("more cowardly") requires *additional* rules:  
      - If X is cowardly, and Y is more cowardly than X, then Y is cowardly.  
      - If Y is not cowardly, then nothing can be more cowardly than Y.  
    - **Relocated difficulty:** These rules must be *normative* (e.g., governing attitude commitments). Yet the non-normative premise (2) ("he was in the hospital") must directly impact these rules. How? The expressivist must explain why a factual excuse alters the inferential role of "cowardly." This collapses into the original problem: connecting descriptive facts to normative attitudes.  

  ---  
  ### The Single Feature Doing the Work  
  **Scalar comparatives.**  
  - **Why?** They force expressivists to reconcile:  
    1. Threshold-based attitudes (flat "cowardly"),  
    2. Graded attitudes ("more cowardly"), and  
    3. Their uniform meaning in asserted/unasserted contexts.  
  - **Without scalar comparatives:** If we replace "more cowardly" with a flat "wrong" (e.g., "If refusal X is wrong, refusal Y is wrong"), the case reduces to a standard Frege-Geach example. Expressivists handle these via "higher-order attitudes" (e.g., commitments to consistency). Scalars break this by requiring *degree-sensitive* attitudes.  

  ### Strongest Expressivist Defense  
  **Hybrid attitude-inferentialism:**  
  1. **Attitudes as probability-like degrees:** Model disapproval on a scale (e.g., 0–1). "Cowardly" = disapproval > threshold T.  
  2. **Embedding via probabilistic inference:**  
     - (1) expresses: "If disapproval(X) > T, then disapproval(Y) > disapproval(X) > T."  
     - (2) and (3) update degrees: Hospitalization sets disapproval(Y) = 0, forcing disapproval(X) ≤ T.  
  3. **Uniform meaning:** "Cowardly" always refers to the *same* threshold and scaling function.  
  - **Weakness:** This mimics truth-conditional semantics (e.g., "cowardly" assigns a value). It risks abandoning core expressivism (attitudes ≠ truth-apt propositions).  

  ---  
  **Conclusion:** The scalar comparative—by demanding graded attitudes that interact with factual premises—maximally strains expressivism. Without it, the problem reverts to manageable form. The expressivist’s best hope is to formalize attitudes as mathematical degrees, but this blurs the line with non-expressivist theories.
