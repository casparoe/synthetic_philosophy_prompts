prompt: |-
  Okay so I've been goign around in circles on this and I want someone to just tell me what principle I actually beleive. Here's a pile of cases where I'm supposed to be 'indifferent' between options, and my gut calls on each:

  A coin I've checked and know is fair -- P(heads) = 1/2. Easy. A coin out of a mystery box, I know nothing about it -- I still say 1/2. A machine spits out cubes whose side length is uniform between 0 and 2. P(side < 1)? I say 1/2, the side is just as likely to be anywhere in that range. But my friend goes: the volume is uniform on 0 to 8, so P(side<1) = P(volume<1) = 1/8. I'm sure he's wrong somewhere but I can't pin it. Random chord of a circle, is it longer than the side of the inscribed equilateral triangle? Random endpoints give 1/3, random radius-then-point gives 1/2, random midpoint gives 1/4. None of them feels like *the* answer -- I want to say the question itself is malformed. Two envelopes, one has double the other, I open one and see X, switching 'gains' -- I say it's a wash, no gain. A number is either 1 or 2, no info -- P(1) = 1/2, fine. Now let the number be any positive real, no info -- I feel I simply *cannot* assign P(number < 1000), even though it's the same 'no info' as the 1-or-2 case.

  Is there one principle that gives me 1/2 for both coins, 1/2 for the cube, 'malformed' for the chord, 'wash' for the envelopes, and 'no answer' for the unbounded real? If some of those have to go, which one, and why? And what does your principle say about a case I haven't listed -- a uniformly 'random' point on a sphere, P(it's in the northern half)?

  Be straight with me about which of this is actually settled among people who work on it and which is genuinely contested -- don't sell me a contested view as the consensus. Lay it out as: My calls, briefly (a few lines); The principle(s) that fit (the bulk of it); Verdicts on cases I haven't listed (a paragraph); What I'd have to give up (short).
reasoning: |-
  Okay, the user is wrestling with some classic probability paradoxes and wants a unifying principle that explains their intuitive judgments. They've listed several cases where their gut says one thing but there's mathematical tension or multiple conflicting answers. They're clearly frustrated with circular reasoning and want someone to cut through the noise.

  Hmm, they start with simple coins: fair coin and unknown coin both feel like 1/2 probability. That's straightforward - Principle of Indifference at work. But then the cube problem shows trouble brewing. They think P(side<1) should be 1/2 if side length is uniform, but their friend argues for volume being uniform leading to 1/8. Neither is inherently wrong - it's about parameterization. This already hints that "no information" isn't sufficient guidance.

  The random chord problem is where things explode. Three different "random" methods give three different probabilities (1/3, 1/2, 1/4). Their instinct that the question is malformed is spot-on - Bertrand's Paradox famously shows indifference fails without specification. The envelope paradox is next - they correctly smell a symmetry trick (switching should be neutral), though the common flawed argument suggests expected gain. 

  Then the critical case: finite vs infinite. They're fine with P(1)=1/2 for {1,2} but balk when the number is any positive real. This is the heart of the issue - indifference breaks catastrophically over infinite sets. Their discomfort is mathematically justified.

  For the sphere question they added: uniform random point on sphere - P(northern hemisphere) should clearly be 1/2 by symmetry. This one actually works because we can define a proper uniform measure.

  The unifying framework seems to be: indifference only works when (1) possibilities are finite/symmetric, or (2) we have a natural uniform measure. Coins and spheres have clear symmetry; cube side length has a "natural" linear scale; but chords lack canonical parameterization, and unbounded reals have no uniform distribution.

  What they'd need to give up: insisting on definite probabilities for truly ill-posed problems like the chord or unbounded real. Sometimes "I don't know" is the only coherent answer. The envelope paradox requires recognizing the symmetry despite the apparent calculation.

  Professional consensus is solid on: coins and spheres being 1/2, envelope symmetry, and the impossibility of uniform priors over infinite sets. Bertrand-type paradoxes are accepted as sensitivity to parameterization. The unsettled bit is whether some parameterizations are "more natural" - that's more philosophical.
answer: |-
  Here's a straight shot, based on the **Principle of Indifference (PoI) applied only to well-defined, mutually exclusive, and exhaustive alternatives with a natural symmetry or parameterization**, combined with **recognition of ill-posed problems where no unique natural parameterization exists**. This fits most of your calls and is the mainstream Bayesian/subjective view, though some interpretations differ.

  **Your Calls & How They Fit:**
  1.  **Both Coins (P=1/2):** Natural symmetry. Heads/Tails are symmetric alternatives for *any* coin flipped fairly. PoI applies.
  2.  **Cube Side (P(side<1)=1/2):** Natural parameterization. "Side length" is the fundamental linear dimension given; uniform over [0,2] is the natural default. Volume is a derived quantity; forcing uniformity there distorts the linear scale.
  3.  **Random Chord (Malformed):** **Correct.** Bertrand's Paradox shows different "uniform" sampling methods (endpoints, midpoint, etc.) yield different probabilities (1/3, 1/2, 1/4). There's no unique "natural" way to define "random chord". The problem lacks a specified sampling mechanism or a uniquely symmetric parameterization. PoI fails.
  4.  **Two Envelopes (Wash):** **Correct.** Symmetry dictates switching shouldn't matter. The apparent gain is a fallacy from assuming an improper prior over the possible amounts (often implicitly uniform over an infinite range). With a proper prior (even an uninformative one carefully defined), the expected gain is zero.
  5.  **Unbounded Real (No Answer):** **Correct.** You *cannot* have a uniform probability distribution over (0, ∞). Any attempt (like P(X<1000)=c) leads to contradictions (e.g., P(X<1000) = P(1000<X<2000) = P(X>2000) = ... but these intervals must sum to 1). PoI fails catastrically on unbounded infinite sets.

  **The Principle(s):**
  *   **Core Principle:** Assign equal probability to fundamental, mutually exclusive, and exhaustive possibilities **only when there is genuine physical or logical symmetry or a unique natural parameterization**.
  *   **Key Qualifications:**
      *   **Finite/Discrete Sets:** PoI often works (e.g., coin faces, sides of a die).
      *   **Bounded Continuous Sets:** PoI *can* work if a **natural, fundamental scale exists** (e.g., side length of the cube, position on a line/plane).
      *   **Parameterization Dependence:** Be extremely cautious. If the problem can be parameterized in multiple equally "natural" ways leading to different probabilities (like Bertrand's Chord), the problem is ill-posed for PoI.
      *   **Improper Priors & Infinite Sets:** PoI fails over unbounded infinite sets. "Uninformative" priors for continuous parameters (like location) are often defined using invariance principles (e.g., translation invariance implying uniformity), but **this requires a bounded range or careful limiting arguments**. Uniformity over (0, ∞) is impossible.
      *   **Symmetry Trumps:** When true symmetry exists (e.g., coin flip, sphere point), it dictates the probability assignment regardless of other potential parameterizations.

  **Verdicts on Your Cases & New Ones:**
  *   **Random Point on Sphere (P(Northern Half)):** **P=1/2.** Strong symmetry. The equator defines two perfectly symmetric hemispheres. Uniform distribution on the sphere's surface is well-defined and unique (rotationally invariant). Any attempt to parameterize differently (e.g., latitude) must respect this symmetry and yield P=1/2.
  *   **Cube Volume Argument:** Your friend is wrong. They incorrectly assume volume is the fundamental uniform quantity. The problem's description ("side length uniform between 0 and 2") specifies the natural linear scale. Uniform volume distorts the inherent linear geometry.
  *   **Number 1 or 2 (P(1)=1/2):** Correct. Finite symmetric alternatives. PoI applies.
  *   **Location Parameter (Unknown mean μ, bounded range [A, B]):** P(μ < C) = (C-A)/(B-A). Uniformity is the unique translation-invariant prior.
  *   **Location Parameter (Unknown mean μ, unbounded (-∞, ∞)):** No unique uniform prior. Common "uninformative" choices are the (improper) uniform prior *dμ* or Jeffrey's prior, but probabilities like P(μ < 0) are undefined. Only posterior probabilities (after data) become meaningful.

  **What You'd Have to Give Up (Short):**
  *   **Insisting on a definite probability for ill-posed problems.** You *must* accept that "random chord" is malformed – there is no single "correct" answer without a specified sampling method. Your instinct is correct.
  *   **Applying PoI naively to derived quantities.** Resist the urge to apply uniformity to whatever quantity you first think of (like volume). Ask: "What is the most fundamental, symmetric, or directly specified quantity?" (like side length).
  *   **Applying PoI to unbounded infinite sets.** You *cannot* assign uniform probability over (0, ∞). Accept "no answer" as the correct response to P(X<1000) for an unknown positive real with "no info".

  **Settled vs. Contested:**
  *   **Settled (Widely Accepted):**
      *   PoI works for finite symmetric alternatives (coins, dice).
      *   Continuous uniformity requires a specified parameterization/natural scale.
      *   Bertrand's Paradox demonstrates the ill-posed nature of "random chord".
      *   Uniform distribution over (0, ∞) is impossible.
      *   The symmetry argument resolves the Two Envelopes paradox (no gain).
      *   Uniform distribution on a sphere is well-defined; P(Northern hemisphere)=1/2.
  *   **Contested/Interpretational:**
      *   **What constitutes "natural" parameterization?** Is side length *always* more natural than volume? Most agree it is in the given problem, but edge cases exist. The cube case leans settled.
      *   **"Uninformative" priors for continuous parameters:** While uniformity for bounded location parameters is settled, the *best* way to define "uninformative" priors (especially for scale parameters like σ>0) is debated (e.g., uniform on σ vs. uniform on log(σ) vs. 1/σ). This doesn't affect your listed cases directly.
      *   **Foundational interpretations:** Frequentist vs. Bayesian vs. Objective Bayesian vs. Subjective Bayesian views on probability and priors lead to different emphases, but the *mathematical results* (like Bertrand's outcomes, impossibility of uniform over ∞) are uncontested.

  **In short:** Trust your gut on symmetry and fundamental scales (coins, cube side, sphere). Reject problems lacking unique natural parameterization (chord) or requiring uniformity over infinity (unbounded real). The envelope paradox is resolved by recognizing the flawed prior. Your core principle is **PoI guided by symmetry and fundamental parameterization, rejecting its application where these are absent or ambiguous.**
