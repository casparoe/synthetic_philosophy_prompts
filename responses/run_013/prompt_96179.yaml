  The mail drawer is perfect for case analysis. For the brother (Camp 1), the selective avoidance pattern itself proves implicit knowledge. For the user (Camp 2), it's just an oversight with no underlying belief. 

  I notice the user hints at deeper stakes - whether this is "just about words." That's crucial. The deflationist position hinges on whether "self-deception" requires actual belief contradiction or if avoidance behaviors qualify. 

  The "selective avoidance" crux is particularly thorny. Camp 1 sees motive as proof of knowledge; Camp 2 argues habits/associations could explain selectivity without conscious knowledge. The hospital letter example will test this - if the drawer contained something emotionally neutral, would avoidance still occur?

