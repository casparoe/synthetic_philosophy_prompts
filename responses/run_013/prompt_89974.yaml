  Hmm, there's a significant tension here between the claim that conditionalization maximizes expected accuracy (from the prior perspective) and the insistence that permanently dogmatic agents are irrational. If an agent never updates, their prior might actually be coherent and assign low probability to any future evidence, making non-updating seem rational under their own credences. But this clashes with the intuition that such agents are epistemically flawed.

