answer: |-
  ## Joint Statement on Deference to Objective Chance  
  *Following Adversarial Collaboration*

  ### I. Shared Ground: Claims Both Parties Accept  
  1. **Normative Function**: The chance-credence link (CCL) provides a normative constraint ensuring rational credences align with the world’s probabilistic structure, preventing arbitrary beliefs.  
  2. **Non-Reductionism**: Chance is not reducible to actual frequencies, subjective credences, or epistemic utility. It reflects an objective feature of reality (even if revisionists characterize this feature differently).  
  3. **Certainty Requirement**: If an agent knows the objective chance of *A* is 1 and possesses *no inadmissible evidence*, they must assign credence 1 to *A*.  
  4. **Admissibility Purpose**: The admissibility clause excludes information that "short-circuits" the chance mechanism (e.g., direct revelation of *A*’s truth-value). Both agree it targets information not *mediated* by chance.  
  5. **Temporal Asymmetry**: Chance is time-dependent; present chances supersede past chances for guiding credence about future events.  
  6. **Non-Vacuity**: The CCL is substantive. It does not collapse into "defer to whatever makes your credences rational."  

  ### II. Table of Remaining Disagreements  
  | **Issue** | **Orthodox Position (Party A)** | **Revisionist Position (Party B)** |
  |-----------|----------------------------------|-----------------------------------|
  | **Nature of Chance** | Chance is a *metaphysical primitive* or law-governed quantity, prior to and constraining rational credence. | Chance is *epistemically constrained*: it is the probability function delivered by the *best systematization* (BS) of history, where "best" balances simplicity, strength, and fit. |
  | **Admissibility Status** | Admissibility is a *substantive, non-stipulative* constraint. What counts as admissible is fixed by the world’s causal/nomological structure (e.g., only past light-cone events). | Admissibility is *partly definitional*: information is inadmissible only if incorporating it into the BS would yield a *better systematization*. The clause is a placeholder for BS’s epistemic role. |
  | **CCL’s Scope** | The CCL governs deference to *objective chance as such*. If no objective chance exists (e.g., in deterministic worlds), the CCL lacks direct application. | The CCL governs deference to the *BS probability*. It applies even in deterministic worlds (as BS may assign non-trivial probabilities) or when chance and BS diverge. |
  | **Metaphysical Independence** | Chance could, in principle, *diverge* from the BS probability (e.g., if the BS is imperfect). | Chance *just is* the BS probability; divergence is impossible by definition. What Party A calls "chance" is a metaphysical phantom. |

  ### III. Cruxes: Key Test Cases & Predictions  
  **Crux 1: Can chance values outrun best-system probabilities?**  
  - **Test Case (b)**: A world where the probabilistic law assigns *P*(law falsified tomorrow) > 0.  
    - *Party A Prediction*: Coherent. The chance is genuine, even if self-undermining. Rational credence must defer to it.  
    - *Party B Prediction*: Incoherent. A BS assigning non-zero probability to its own falsification cannot be "best" (violates fit/stability). The true BS assigns *P*=0.  
  - **Settling Impact**: If (b) is coherent, Party B must abandon BS as exhaustive. If incoherent, Party A must explain why self-undermining chances are illusory.  

  **Crux 2: Is admissibility metaphysically constrained or system-relative?**  
  - **Test Case (d)**: An agent learns *A*’s truth-value via a causal backdoor (e.g., a prophecy independent of *A*’s chance process).  
    - *Party A*: This is *inadmissible evidence*. Deference to chance *x* is suspended; credence should match the prophecy.  
    - *Party B*: If the prophecy improves the BS (e.g., by increasing fit), it becomes part of the chance-grounding facts. Deference to the *updated BS probability* is required.  
  - **Settling Impact**: If (d) forces suspension of deference without BS revision, Party B’s view fails. If BS absorbs the prophecy, Party A’s "metaphysical admissibility" is redundant.  

  **Crux 3: Does the CCL require objective chance?**  
  - **Test Case (c)**: A deterministic, chaotic world with only frequencies/symmetries.  
    - *Party A*: No objective chance → *CCL has no direct application*. Rational credence may use frequencies/symmetries *as proxies*, but this is not deference to chance.  
    - *Party B*: The BS assigns probabilities (e.g., via statistical mechanics). The CCL *applies directly*: defer to BS probabilities.  
  - **Settling Impact**: If agents in (c) *ought* to defer to BS probabilities, Party A must explain why this isn’t chance deference. If not, Party B’s norm lacks universality.  

  **Crux 4: Can chance be "reported" prior to its realization?**  
  - **Test Case (a)**: A reliable device reports tomorrow’s chance of *A*, conflicting with today’s chance.  
    - *Party A*: The report is *inadmissible evidence* about the future. Today’s credence should still defer to *today’s* chance, ignoring the device.  
    - *Party B*: The device reveals future BS probabilities. If reliable, it must be incorporated into *current* BS (updating chance), so deference targets the reported value.  
  - **Settling Impact**: If credence should heed the device, Party A’s admissibility is flawed. If not, Party B’s "chance" is insufficiently guiding.  

  ### IV. Semantic vs. Substantive Disagreement  
  - **Semantic Element**: Part of the dispute concerns whether "chance" refers to (A) a mind-independent metaphysical probability or (B) an epistemically constrained best-system probability.  
  - **What Remains After Semantics**: Even if "chance" is defined as BS probability, these questions persist:  
    1. Is the BS itself constrained by pre-existing metaphysical laws (A) or purely descriptive (B)?  
    2. Must rational credence in deterministic worlds obey a BS-based norm (B) or not (A)?  
    3. Can evidence be "inadmissible" relative to a BS (B) or only relative to causal history (A)?  

  ### Responses to Test Cases  
  | **Case** | **Party A (Orthodox)** | **Party B (Revisionist)** |
  |----------|------------------------|--------------------------|
  | **(a) Future chance report** | Defer to *current* chance; device’s report is inadmissible future information. | Defer to the *reported* chance; the device reveals the future BS probability, which updates current chance. |  
  | **(b) Self-undermining chance** | Coherent. Chance ≠ BS probability; rational credence defers to *P*(falsification) > 0. | Incoherent. A true BS cannot assign *P*(self-falsification) > 0; chance must be 0. |  
  | **(c) Deterministic world** | No objective chance → CCL inapplicable. Credences based on pragmatics/frequencies. | BS assigns chances (e.g., via ergodic probabilities). CCL applies: defer to BS probabilities. |  
  | **(d) Non-chance information about *A*** | Inadmissible evidence. Suspend CCL; set credence directly to prophecy’s value. | If prophecy improves BS fit, it *becomes* part of chance. Defer to updated BS probability. |  

  ---  
  This statement reflects a genuine dialectic: Party A anchors chance in metaphysics, Party B in rational systematization. Their core divide is whether probability’s normative authority derives from *how the world is* (A) or *how we best describe it* (B). The test cases probe whether systematization can fully capture chance’s guiding role without collapsing into instrumentalism.
