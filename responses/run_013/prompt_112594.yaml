prompt: |-
  I chair the exhibitions committee of a mid-sized municipal museum. We are signing off on a touring exhibition about global inequality that will open in four countries over the next two years, and I need a short written opinion to circulate before Thursday's meeting.

  The lead curator's design brief proposes that every quantitative panel in the exhibition use a single system of repeated pictograms, in the style of the pictorial statistics that Otto Neurath developed for the social and economic museum in Vienna in the 1920s and 1930s and that later took the name Isotype: a fixed quantity is represented by one identical figure, repeated, rather than by a longer bar or a larger figure. The brief asks us to go further than Neurath in two respects. First, it would strip the panels of words, numerals, legends and keys, on the ground that a genuinely self-explanatory picture language needs no translation and can therefore travel unchanged between host countries. Second, it presents the pictogram set as culturally and politically neutral — the brief's own phrase is no words, no ideology — and uses that claim to justify a single uniform design across four very different national contexts, one of which has a live public controversy over how poverty statistics are presented.

  Three objections are on the table. Our education team says the panels will be unreadable to anyone who cannot hold a stated unit value in mind, and that Neurath himself described his method as a language-like technique rather than a full language, one always shown alongside verbal elements — so the brief is not really Neurathian. A community advisory group says the generic human figure reads as belonging to a particular kind of person, and that an icon standing for one million people in poverty quietly settles who counts. The host venues, meanwhile, want the right to caption the panels locally and, in one case, to substitute local figures and clothing.

  Draft the committee's written opinion: a clear recommendation — approve, approve with conditions, or reject — with reasoning a curator could actually work with, including an honest treatment of the strongest argument on the losing side, namely the curator's case that a picture language which needs captions, keys and numerals in every venue has abandoned the one thing that made it worth using. Say what we should require of the design brief, who is accountable for meeting those requirements, and by when; the exhibition opens in fourteen months and the committee can convene again in three weeks. Argue from the material above; no sources or citations are needed.

  End with a final line in exactly one of these forms: Verdict: APPROVE, Verdict: APPROVE WITH CONDITIONS, or Verdict: REJECT.
reasoning: |-
  Okay, the user chairs an exhibitions committee for a museum and needs to draft a written opinion about a touring exhibition on global inequality. They're facing a debate over the curator's proposal to use a modified Isotype system without any words or captions. 

  Hmm, the core tension here is between visual universality and contextual accessibility. The curator's vision of a "wordless, ideology-free" design is ambitious but seems to overlook practical realities. Let me unpack the key concerns: 

  First, the education team's objection about cognitive load makes sense - expecting visitors to mentally track unit values without anchors is unrealistic. Neurath himself paired visuals with text, so the "pure" approach contradicts the method's origins. 

  Second, the community group's point about the generic figure carrying implicit bias is crucial. That "neutral" icon actually encodes assumptions about which bodies represent humanity. And in poverty statistics, representation is inherently political. 

  Third, the venues' request for localization flexibility feels non-negotiable. The exhibition's impact depends on resonance with local contexts, especially where poverty metrics are contested. 

  *flipping through mental notes* The curator's strongest argument - that adding text negates Isotype's value - deserves engagement. But their premise feels flawed: Isotype's power was never about eliminating language, but simplifying complex data. The "no words" stance actually undermines accessibility. 

  For the verdict... outright rejection seems too harsh since the pictogram concept has merit. But unconditional approval ignores real barriers. The compromise path would be: approve with mandatory revisions. 

  Key requirements should include: 
  - Reinstating minimal numeric/verbal anchors 
  - Redesigning pictograms for cultural inclusivity 
  - Granting venues caption/localization rights 
  - Appointing the curator to execute changes within 3 months 

  *adjusting framing* The opinion should acknowledge the curator's vision while firmly prioritizing visitor experience and ethical representation. The tone must be collaborative but unambiguous - this is about making the exhibition work, not winning an argument. 

  Final line locked in: Verdict: APPROVE WITH CONDITIONS. The solution preserves the visual approach while fixing its critical flaws.
answer: |-
  ## Committee Opinion: Touring Exhibition Pictogram System

  **Recommendation:** Approve with Conditions  

  **Reasoning:** The core concept of using Isotype-inspired pictograms offers significant potential for visual impact and cross-cultural data communication. However, the proposed implementation—stripping all words, numerals, and keys while claiming ideological neutrality—is fundamentally flawed and risks undermining the exhibition's accessibility, accuracy, and relevance across diverse venues.  

  1.  **Loss of Essential Clarity & Accessibility (Education Team's Objection):** The assertion that pure pictograms are "self-explanatory" is demonstrably untrue for quantitative data. Neurath understood that Isotype functioned *alongside* verbal elements (labels, keys, scales), not as a replacement. Removing all numerals and context makes the data ambiguous. Visitors cannot reasonably be expected to retain and apply a stated unit value (e.g., "1 figure = 1 million people") across multiple panels without visual reinforcement. This creates an unnecessary cognitive barrier, contradicting the goal of clear communication.  

  2.  **False Claim of Neutrality & Representation Issues (Community Advisory Group's Objection):** Pictograms are inherently representational choices. A "generic" human figure carries cultural and socio-political connotations, implicitly defining the "norm." Using such an icon to represent people experiencing poverty is not neutral; it unavoidably shapes perception regarding *who* is counted and how they are seen. The claim "no words, no ideology" ignores the ideology embedded in visual representation itself and the selection of data being visualized.  

  3.  **Lack of Contextual Sensitivity & Flexibility (Host Venues' Objection):** Demanding identical panels across four distinct national contexts, especially one with ongoing controversy about poverty statistics, is impractical and insensitive. Venues require the ability to provide essential context, ensure local relevance, and address specific societal debates through minimal localization (captions, potentially localized figures/clothing where data allows).  

  **Addressing the Curator's Strongest Argument:** The curator rightly identifies the potential power of a highly visual, easily translatable system as Isotype's key strength. However, the argument that *any* addition of text or localization negates this value is an overreach. The core strength lies in the *predominance* and *clarity* of the pictogram system, not in the absolute exclusion of minimal supporting text. Neurath embraced text as a necessary partner. Adding concise numerals (e.g., embedded within the pictogram row), brief labels (e.g., "1 = 1 Million"), and allowing venue-specific captions *enhances* understanding without sacrificing the visual immediacy. A design requiring translation of minimal text is vastly more feasible and effective than one rendered incomprehensible by the pursuit of pure visuality.  

  **Requirements for the Design Brief (Accountability & Timeline):**  

  1.  **Reintroduce Essential Context:** Numeric scales (e.g., "1 icon = [quantity]") and concise data labels (e.g., country names, data type) **must** be integrated visually into each quantitative panel design. Legends/keys are permissible if minimal and visually cohesive.  
  2.  **Redesign Pictograms for Inclusivity:** The "generic" human figure must be revised. Options include:  
      *   A more abstract/universal symbol (e.g., silhouette, circle).  
      *   A set of diverse figures used systematically.  
      *   Culturally adaptable figures *where core data representation permits*.  
      *The design must actively demonstrate consideration of representation and avoid implying a singular "norm."*  
  3.  **Mandate Localization Framework:** The design **must explicitly allow** host venues to:  
      *   Add brief contextual captions (translated locally) explaining the specific data point or its local significance.  
      *   Propose substitutions for pictogram figures *only if* the core data unit represented remains unchanged and the substitution is deemed necessary for local resonance by the venue, pending final approval by the lead curator to maintain overall coherence.  
      *   **Crucially:** Venues retain the right to *not* use localized figures if they deem the core design acceptable.  
  4.  **Remove "No Words, No Ideology" Claim:** Acknowledge that design choices involve representational decisions. Focus on clarity, accessibility, and respect for context, not unattainable neutrality.  

  **Accountability:** The Lead Curator is accountable for revising the design brief to meet these requirements.  
  **Timeline:** A revised design brief incorporating these requirements must be submitted to the Committee Chair for review **within 3 weeks** (by [Specify Date]) to allow discussion at the next convened Committee meeting if necessary. This timeline is critical to maintain the 14-month production schedule.  

  **Verdict:** APPROVE WITH CONDITIONS
