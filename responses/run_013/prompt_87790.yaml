  Okay, let me start by unpacking the user's query. They're in a philosophy Discord where a PhD student presented a summary of expressivism and the Frege-Geach problem, concluding it's fatal and the field moved to non-naturalist realism. The user has prior exposure to rationalist blogs and LW sequences, so they're inclined to believe this but want verification.

  First, I need to assess each part of the PhD student's claims. The initial description of expressivism as the sophisticated descendant of Ayer and Stevenson seems accurate. Expressivists do focus on expressing attitudes rather than stating facts. The explanation of Frege-Geach is also correct—embedding moral statements in conditionals or negations creates issues for expressivists because they're not expressing attitudes in those contexts.

  The user is concerned about the claim that expressivism is dead and that patches by Blackburn and Gibbard don't hold. I recall that contemporary expressivists like Blackburn and Gibbard have developed complex responses. Blackburn's quasi-realism argues that moral language can mimic realist talk, making it truth-apt without ontological commitments. Gibbard uses norm-expressivism and possible worlds semantics. So, saying the patches don't hold might be an overstatement. The field hasn't abandoned expressivism; it's evolved.

  The PhD student mentions that any view with truth conditions, like Hare's prescriptivism, avoids the problem. But Hare's prescriptivism isn't expressivism. Expressivists reject truth conditions, so this point is misleading. The user might not catch that nuance.

  The conclusion that the field moved to non-naturalist realism is an oversimplification. While realism is prominent, expressivism still has active proponents. Journals publish expressivist work, and it's a viable position. The user needs to know that the debate is ongoing, not settled.

  The user's deeper need might be understanding the current state of metaethics to discuss it confidently. They want to avoid repeating incorrect summaries. Highlighting areas of contention, like the success of quasi-realism, is crucial. Also, emphasizing that expressivism isn't dead but adapted could correct misconceptions.

  I should check sources: SEP articles on expressivism, Frege-Geach, and quasi-realism confirm that modern expressivists address embedding through complex semantics. The criticism exists, but it's not universally accepted as fatal. Confidence levels: high on the problem's description, medium on the patches' effectiveness, low on the field moving on entirely. The least sure point is whether quasi-realism fully solves the problem, as some realists still challenge it.
answer: |-
  Here's a breakdown of the PhD student's summary, annotated for accuracy from an expressivist perspective (focusing primarily on Blackburn and Gibbard), with confidence levels and key clarifications:

  **1. Core Expressivism Description:**  
     *   **Their Claim:** "Expressivism is the view that when you say 'lying is wrong' you aren't describing anything, you're just expressing your disapproval: the sophisticated descendant of the old boo/hurrah theory of Ayer and Stevenson."
     *   **Expressivist Response (Acceptable Caricature):** This captures the *spirit* but oversimplifies modern expressivism. Blackburn and Gibbard explicitly reject crude "boo/hurrah" emotivism. They argue moral claims express complex, *cognitive-like* attitudes (e.g., plans, commitments, norms for governing feelings) embedded within broader practices of deliberation and discourse. Disapproval is part of it, but not the whole story.
     *   **Confidence:** High (95%) - It's a common starting point, but "just expressing disapproval" is reductive for sophisticated expressivism.

  **2. The Frege-Geach Problem:**  
     *   **Their Claim:** Geach showed moral words appear in non-assertoric contexts (conditionals, questions, negations) where no attitude is expressed. This creates ambiguity for expressivists, making validity (like modus ponens) illusory.
     *   **Expressivist Response (Mostly Fair & Central):** This is a *crucially important* and historically devastating problem for *simple* emotivism. Expressivists like Blackburn and Gibbard accept this as the *core challenge* their entire project is designed to solve. The modus ponens example is the textbook case.
     *   **Confidence:** High (98%) - This is the canonical statement of the problem.

  **3. Expressivist "Patches" (Quasi-realism & Norm-Expressivism):**  
     *   **Their Claim:** "Expressivists spent decades patching this... Blackburn's quasi-realism... Gibbard bolts a theory of norms... it's generally agreed the patches don't hold."
     *   **Expressivist Response (Mischaracterization / Overstatement):** This is where the summary goes most wrong.
          *   **Not Mere "Patches":** Blackburn and Gibbard developed *systematic, positive theories* (quasi-realism, norm-expressivism) offering *comprehensive semantics* for moral language in *all* its contexts (including conditionals, negation, etc.), precisely to solve Frege-Geach. They don't see it as patching; they see it as building the full expressivist account.
          *   **Do They "Hold"?** It's **highly contested**, not "generally agreed" they fail. Proponents argue they *do* solve the problem by:
              *   **Blackburn:** Providing an account of "moral truth" and validity *within* the expressivist framework ("projectivism"). Validity becomes about the consistency of commitments expressed across different linguistic contexts. ("Thinking How to Live").
              *   **Gibbard:** Using sophisticated tools from logic and possible worlds semantics to model the meaning of normative terms in embedded contexts, showing how they systematically relate to planning states ("Wise Choices, Apt Feelings", "Thinking How to Live").
          *   **Criticism Persists:** Realists (like Derek Parfit, Russ Shafer-Landau) and others (like Mark Schroeder in "Being For") argue these solutions are inadequate, circular, too complex, or ultimately collapse into realism. **This is the heart of the ongoing debate.**
     *   **Confidence:** High (90%) that calling them mere "patches" is dismissive. Medium (70%) that the claim "generally agreed they don't hold" is a significant overstatement reflecting a realist-leaning consensus bias, not universal agreement. The solutions are live, defended options.

  **4. Field Moving On & Fatal to Expressivism:**  
     *   **Their Claim:** "Which is why the field more or less moved on to non-naturalist realism." (Implies Frege-Geach killed expressivism).
     *   **Expressivist Response (False / Overstated):**
          *   **Expressivism is Alive:** While non-naturalist realism is prominent (especially post-Parfit), expressivism remains a major, actively defended position. Blackburn, Gibbard, Allan Gibbard (still active), Michael Ridge, Mark Schroeder (hybrid), Billy Dunaway, and others continue to develop sophisticated expressivist (or quasi-realist/norm-expressivist) accounts. Journals regularly publish new work.
          *   **Frege-Geach Didn't Kill It:** It forced expressivism to evolve dramatically *beyond* simple emotivism into the complex theories we have now. It's the defining challenge, not the death knell. Modern expressivists believe their solutions *work*.
     *   **Confidence:** High (85%) that claiming the field "moved on" from expressivism is factually incorrect. Expressivism is a core pillar of contemporary metaethics alongside realism and error theory.

  **5. Truth Conditions & Hare:**  
     *   **Their Claim:** "any view that says moral sentences have truth conditions, like Hare's prescriptivism, is immune."
     *   **Expressivist Response (Misleading):**
          *   **Hare isn't Expressivist:** R.M. Hare's *prescriptivism* is distinct from expressivism. Prescriptivism often *does* assign truth conditions (e.g., to the descriptive element of "good"). Modern expressivism (Blackburn, Gibbard) explicitly *denies* that moral sentences have representational truth conditions as their core function.
          *   **"Immune" is Tricky:** Views assigning robust truth conditions *do* avoid the *specific* Frege-Geach challenge about attitude expression in embeddings, but they face *other* well-known challenges (e.g., Mackie's Queerness, epistemological access for non-naturalism, explaining motivation for naturalism). Expressivists see avoiding truth conditions as a *virtue* solving *those* problems.
     *   **Confidence:** High (90%) that lumping Hare in as an expressivist is a category error. Medium (65%) that saying truth-conditional views are "immune" oversimplifies the metaethical landscape (they have different problems).

  **Conclusion on Fatalness & Field Movement:**
  *   **Frege-Geach is NOT universally accepted as fatal to *sophisticated* expressivism.** It is *the* central problem the view must solve. Proponents believe Blackburn and Gibbard (and successors) *have* provided adequate solutions. Opponents believe they haven't. **This debate is ongoing.**
  *   **The field has NOT "moved on" from expressivism.** Non-naturalist realism has seen a resurgence, but expressivism remains a dominant, highly active research program. Claiming it's dead is inaccurate and reflects a specific perspective within the debate.

  **Your Summary for Others (Key Points):**

  1.  **Expressivism Core:** Modern expressivism (Blackburn, Gibbard) is more sophisticated than simple "boo/hurrah," expressing complex states like commitments or plans. *(Confidence: High)*
  2.  **Frege-Geach Problem:** This is the *major* challenge for expressivism, showing moral language works in contexts (like "if lying is wrong...") where no simple attitude is expressed, raising issues for validity and meaning constancy. *(Confidence: High)*
  3.  **Expressivist Responses:** Blackburn (quasi-realism) and Gibbard (norm-expressivism) developed *systematic theories*, not just patches, using complex semantics to explain embedded contexts and validity without truth conditions. *(Confidence: High)*
  4.  **Success Debated:** ***(Least Confident Point - ~65%)*** Whether these sophisticated expressivist solutions *fully* succeed against Frege-Geach is **hotly contested** within professional metaethics. Proponents argue they do; opponents (often realists) argue they fail. There is no "general agreement" they fail.
  5.  **Field Status:** Expressivism is **not dead**. It remains a major, active research program alongside non-naturalist realism and others. The resurgence of non-naturalism doesn't equate to the death of expressivism. *(Confidence: High)*
  6.  **Hare/Prescriptivism:** Hare's prescriptivism is distinct from expressivism and often involves truth conditions, so its Frege-Geach immunity isn't relevant to evaluating modern expressivism. *(Confidence: High)*

  **Therefore, the PhD student's summary:**  
  *   Accurately describes the core of expressivism and the *nature* of the Frege-Geach problem.  
  *   Significantly misrepresents the sophistication and intent of Blackburn/Gibbard's responses (calling them failed "patches").  
  *   Overstates the consensus against expressivist solutions.  
  *   Incorrectly claims expressivism is dead and the field moved on.  
  *   Misleadingly invokes Hare.  

  **His conclusion (fatal, field moved on) does NOT follow.** Frege-Geach is a severe challenge met with sophisticated, still-debated responses, and expressivism is very much alive.
