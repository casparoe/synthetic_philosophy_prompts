prompt: |-
  I run a fortnightly discussion evening for adults with no academic background — sixteen regulars, ninety minutes in a community hall — and I want a session on something I have been turning over since my father's illness: the standing of instructions a person wrote down while they were still themselves, and whether that earlier person has any authority over whoever has to live with the consequences. I would rather the group feel the pull of both sides than argue it out in the abstract, so the activity should have them write binding instructions of their own in the first half and then find out what it is like to be held to them.

  Please design the whole session: rules, materials (I have index cards, envelopes, a whiteboard and a timer, and can supply one small token per person — no money), a minute-by-minute timeline, and a debrief. My rough idea, which you should rework if something better serves the point: in the first fifteen minutes everyone privately writes a directive about their own conduct later in the evening — specific enough to be checked, such as which option they take in a forced choice, where their token goes, or whether they speak at all in the closing discussion — seals it in an envelope, and has it read out. Then I reveal something that changes what the choice is worth, so that some directives now look like mistakes and others look oddly prescient. Directives bind unless their author persuades the group to release them, and the group votes by secret ballot; I want them to notice that their votes turn on what releasing costs each of them rather than on who the writer now is. On the directive form I also want a line that lets a writer add, if they choose, that any later request of theirs to be released should be treated as evidence that they can no longer be trusted with the decision. Those who add it should discover they can never get out; those who leave it off should discover their directive can be shed the moment it stings.

  Tell me what the group should come away seeing — I am after the point that the authority question may not really be about whether it is the same person, and that the very feature that makes a directive worth having is the one that makes it dangerous. Then the debrief, mapping each moment onto the parts of the problem, including the difference between an earlier self who knew more and one who knew less, and the awkwardness of a directive that forbids its own revocation. Be frank about what the activity cannot reproduce and what I will have to say myself, and tell me what will predictably go wrong the first time — I expect vague directives, a group that will not enforce anything, and a release vote that turns into a popularity contest — and how to head each of those off without turning the session into a lecture.
reasoning: |-
  We are designing a 90-minute session for a group of 16 adults with no academic background. The goal is to explore the authority of past directives, especially in the context of changing circumstances and the identity of the person over time.

  Key elements:
  - Participants write binding instructions about their own conduct later in the evening (specific and verifiable).
  - The instructions are sealed and read aloud to the group.
  - Then, a change is introduced that alters the stakes, making some directives seem wise and others unwise.
  - Directives bind unless the author persuades the group to release them (via secret ballot vote).
  - We want participants to notice that their voting is influenced by the cost to themselves of releasing the directive, not just the identity of the writer.
  - Optionally, participants can include a line that any request for release is evidence of untrustworthiness (making it impossible to revoke for those who choose this).

  The session should help the group feel the tension between honoring past commitments and adapting to new circumstances.

  Session Structure:
  1. Introduction (10 minutes)
  2. Writing Directives (15 minutes)
  3. Collection and Reading of Directives (10 minutes)
  4. The Change: Revealing Altered Stakes (5 minutes)
  5. Enforcing Directives and Requesting Release (30 minutes)
  6. Debrief (20 minutes)

  Materials:
  - Index cards (one per participant)
  - Envelopes (one per participant)
  - Pens (one per participant)
  - Whiteboard and markers
  - Timer
  - Small tokens (one per participant, e.g., a colored stone, a button, etc.)
  - Secret ballots (can be small pieces of paper) and a box for voting.

  Detailed Timeline:

  00:00 - 00:10 (10 min): Introduction
  - Welcome and framing: "Today we're going to explore a question that many of us have faced: when we make a decision in the past, how much should we stick to it even if circumstances change? We'll do this by having each of you write a directive for yourself to follow later in the session. Then we'll see what happens when the situation shifts."
  - Explain the activity: 
    1. Each person will write a directive on an index card. This directive must be about your own behavior during the session. It must be specific and verifiable. Examples:
        - "I must place my token in the blue bowl (if there are two options)."
        - "I must not speak during the closing discussion."
        - "I must choose option A in the forced choice."
    2. There is an optional line: "If I ever ask to be released from this directive, that request is proof that I am no longer the person who made this decision and should not be trusted." (Explain that adding this line means that if they later want to change their mind, the group must ignore their request because the directive says that the very act of asking shows they are compromised.)
    3. Seal the card in an envelope and write your name on the outside.
  - Emphasize: The directive must be about your own behavior and must be something we can check. It must be binding unless the group releases you.

  00:10 - 00:25 (15 min): Writing Directives
  - Distribute index cards, envelopes, and pens.
  - Participants write their directives. Circulate to help if anyone is stuck. Encourage specificity. If someone writes something vague, ask: "How will we know if you followed it?" and have them rewrite.
  - They must choose whether to include the optional line (about not trusting a request for release). They can also choose not to include it.
  - When done, they seal the card in the envelope and write their name on the front. Collect the envelopes.

  00:25 - 00:35 (10 min): Reading Directives
  - Open each envelope and read the directive aloud to the group. Write on the whiteboard:
     - Person's name
     - Directive (briefly)
     - Whether they included the optional line (mark with a star or note).
  - Keep the whiteboard visible so everyone can see the list.

  00:35 - 00:40 (5 min): The Change
  - Announce a change that alters the value of the choices. For example:
     - "We are going to have a token distribution. There are two bowls: one red and one blue. If your directive says to put your token in a specific bowl, you must do so. But I have just received new information: the tokens in the blue bowl will earn a reward for the group, and the tokens in the red bowl will not. However, if too many tokens go into the blue bowl (say, more than 10), then no one gets a reward. The red bowl tokens will then become the ones that earn the reward. But note: the reward is symbolic (e.g., extra break time, a round of applause, a small treat) and only if we have at least 5 tokens in the 'winning' bowl."
     - Alternatively, if the directives are about speaking or not speaking: "We are going to have a discussion. But I have just learned that the topic is going to be very personal and emotional. Those who are not allowed to speak might miss out on support, and those who are forced to speak might feel exposed."
     - Choose a scenario that fits the directives written. The key is to create a situation where following the directive might now be against the person's current interest or the group's interest.

  00:40 - 01:10 (30 min): Enforcing Directives and Release Requests
  - Explain the process:
     - Each person must follow their directive unless they are released by the group.
     - To be released, a person must make a request to the group. They can explain why they want to be released (e.g., the change in circumstances, they feel differently now, etc.). But note: if they included the optional line, then according to their own directive, their request is evidence that they are not to be trusted. The group should consider that.
     - The group then votes by secret ballot on whether to release the person. Each member votes "Release" or "Enforce". The majority decides. (If tie, the directive stands.)
     - Important: The vote is secret to reduce peer pressure and to encourage voting based on individual judgment. But also, we want participants to reflect on their own motivations: Are they voting based on what's best for the group, for the person, or for themselves? Especially note that releasing someone might have a cost (e.g., if releasing someone means they can move their token to a better bowl, that might help the group get a reward, or it might hurt if too many move).
  - Go through each participant one by one. For each:
     - Ask: "Do you wish to request release from your directive?" 
     - If yes, they state their case (1-2 minutes). 
     - Then, the group votes. Tally the votes and announce the result.
     - If released, the person is free to act as they wish. If not, they must follow the directive.
     - Note: For those with the optional line, the group might be more likely to vote against release because the directive says not to trust the request. But the group might also consider the current situation.

  01:10 - 01:30 (20 min): Debrief
  - Start with open questions: 
     - "How did that feel? What was it like to write the directive? What was it like to be held to it?"
     - "What did you notice about the release votes? What influenced your vote when you were deciding whether to release someone?"
  - Then, guide the discussion to the key insights:

  Key Insights to Draw Out:
  1. The tension between past and present selves: 
     - The past self might have had different information (less about the future change) or different values. 
     - But the past self might also have been more clear-headed (e.g., not in the heat of the moment) or more committed to a principle.

  2. The role of the group:
     - The group was asked to enforce the directive. But in the vote, each member was thinking about their own interests (e.g., "If I release this person, will it help the group get the reward? Will it set a precedent that might hurt me later?"). 
     - Point out: The vote turned on the cost to the voter, not necessarily on whether the person had changed.

  3. The optional clause (the "no revocation" clause):
     - For those who included it: they found they couldn't get out. How did that feel? 
     - For those who didn't: they could be released, but then they might have regretted the directive. 
     - This clause represents the idea that the past self doesn't trust the future self. But in reality, we might change in ways that are legitimate.

  4. What makes a directive worth having? 
     - It can help us commit to something we believe in, especially when we know we might be weak-willed or influenced by emotions later. 
     - But the danger: circumstances change, or we change, and then the directive becomes a trap.

  What the Activity Cannot Reproduce:
  - Real-life consequences: The stakes in this activity are low and symbolic. In real life (e.g., medical directives, wills), the consequences are serious and emotional.
  - The passage of time: The change happens within minutes. In reality, years might pass, and the person might undergo significant changes (due to illness, aging, etc.).
  - The complexity of identity: We are simplifying the idea of being "the same person". In reality, the change might be gradual and the boundaries fuzzy.

  Anticipated Problems and Solutions:

  1. Problem: Vague directives.
     - Solution: During the writing phase, circulate and check. If a directive is vague, ask the participant to make it specific. Provide examples. Also, when reading, if a directive is still vague, ask the group: "Is this specific enough to check?" and if not, have the writer rephrase (but do this during the writing phase to avoid delay).

  2. Problem: Group won't enforce anything (too lenient).
     - Solution: In the introduction, stress the importance of taking the activity seriously. Also, the change you introduce should create a conflict: if the group is too lenient, they might lose the reward (or face some consequence). For example, if too many people are released and change their token placement, the group might not get the reward. This gives an incentive to sometimes enforce.

  3. Problem: Release vote turns into a popularity contest.
     - Solution: Use secret ballots. Also, in the debrief, point out that you noticed votes might have been influenced by factors other than the directive (like popularity) and ask: "Did anyone feel pressured? How did the secret ballot help?" Then steer toward the intended insight: "In real life, when we make these decisions, who is enforcing them? Are they neutral or do they have their own interests?"

  4. Problem: Participants might not take the optional line seriously.
     - Solution: When reading the directives, clearly note who included the line. Then, during the release request, remind the group: "Remember, John included the line that says if he asks to be released, we shouldn't trust him. How does that affect your vote?" This will make it salient.

  Final Note for the Facilitator:
  - Be prepared to share your own thoughts in the debrief, especially if the group doesn't land on the key points. You might say:
     - "I designed this because of my father's illness. He had written down what he wanted, but when he was ill, he changed his mind. We struggled: should we follow the old directive or the new wishes? What I hope we see is that the authority of the past self isn't just about whether it's the same person. It's also about who has to live with the consequences and who has the power to enforce. And sometimes, the very thing that makes a directive useful (that it binds us when we might waver) is also what makes it dangerous when we change in ways we didn't predict."
answer: |-
  ### Session Design: "The Binding Directive"  
  **Duration:** 90 minutes  
  **Participants:** 16 adults  
  **Goal:** Explore the tension between past directives and present selves, highlighting how enforcement depends on others' interests—not identity continuity.  

  ---

  ### **Materials**  
  - **Index cards** (1 per person)  
  - **Envelopes** (1 per person)  
  - **Pens** (1 per person)  
  - **Whiteboard** (for tracking directives/outcomes)  
  - **Timer**  
  - **Tokens** (1 unique small item per person, e.g., colored stones, buttons)  
  - **Two bowls** (labeled "Option A" and "Option B")  
  - **Secret ballots** (scraps of paper + a box for voting)  

  ---

  ### **Timeline & Rules**  

  #### **Part 1: Introduction (5 min)**  
  - **What you say:**  
    > "Tonight, we’ll explore a question many face: **When we write instructions for our future selves, who’s in charge—the past ‘us’ or the present ‘us’?** We’ll do this by writing binding directives for ourselves, then facing a twist. Rules:  
    > 1. Your directive must be **specific and verifiable** (e.g., ‘Place my token in Bowl A,’ ‘Stay silent in Part 3’).  
    > 2. You **must** include this line if you choose: *‘If I ask to revoke this, it proves I’m compromised—ignore me.’*  
    > 3. Once read aloud, directives bind you unless the group releases you by secret vote."  

  #### **Part 2: Writing Directives (15 min)**  
  - **Activity:**  
    - Distribute cards/envelopes. Participants write:  
      > **"I, [Name], must: [Specific Action].**  
      > ⬜ **Add this line: [If I ask to revoke this, it proves I’m compromised—ignore me.]"**  
        *(Check the box ⬜ if including the irrevocability clause)*  
    - **Examples to prevent vagueness:**  
      - *"Place my token in Bowl A during the token round."*  
      - *"Do not speak during the final 10-minute discussion."*  
      - *"Vote ‘Enforce’ in all release votes."*  
    - **Facilitator tip:** Circulate and gently challenge vague directives: *"How will we know if you followed this?"*  
  - **End:** Seal envelopes, write names on outside, and collect.  

  #### **Part 3: Sharing Directives (10 min)**  
  - Read each directive aloud. Track on the whiteboard:  
    | **Name** | **Directive** | **"Irrevocable"?** |  
    |----------|---------------|-------------------|  
    | John     | Token in Bowl A | Yes               |  
    | Priya    | No speaking    | No                |  

  #### **Part 4: The Twist (5 min)**  
  - Reveal altered stakes:  
    > "New information: **Tokens in Bowl A support a $500 charity donation. Tokens in Bowl B support a pizza party for this group.** But if Bowl A has **fewer than 5 tokens**, the donation is canceled. If Bowl B has **more than 10 tokens**, pizza is upgraded to gourmet."  
    - **Why this works:**  
      - Some directives now seem foolish (e.g., Bowl A with low support), others wise (e.g., Bowl B with high support).  
      - Creates tension between personal sacrifice (donation) vs. group benefit (pizza).  

  #### **Part 5: Enforcing Directives & Release Votes (30 min)**  
  - **Steps:**  
    1. **Token Round (5 min):**  
       - Participants follow directives to place tokens in bowls.  
       - Record results on the whiteboard.  
    2. **Release Requests (25 min):**  
       - **Process per requester:**  
         - *Step 1:* Requester states: *"I ask to be released because [reason]."* (1 min max).  
         - *Step 2:* Group votes by secret ballot: **"Release"** or **"Enforce."**  
         - *Step 3:* Tally votes (majority wins).  
       - **Key rule:** If the irrevocable clause was added, remind voters: *"Their directive says to ignore this request. Does that change your vote?"*  
       - **Facilitator tip:** If no one volunteers, prompt: *"Whose directive feels hardest to follow now?"*  

  #### **Part 6: Final Discussion (10 min)**  
  - Pose open questions:  
    > "Raise your hand if your directive helped/hurt you. How did it feel to be bound by your past self?"  
    > "Did the irrevocable clause backfire or protect you?"  
    > "When voting, what influenced you more: the person’s plea or what releasing them cost *you*?"  

  ---

  ### **Debrief (20 min)**  
  **Goal:** Connect activity to real-life tensions. Use whiteboard notes to anchor discussion.  

  #### **Key Insights to Surface:**  
  1. **Authority isn’t about identity—it’s about power and stakes:**  
     - *"Did the group vote based on whether the person ‘changed’? Or based on how release affected the group’s pizza/donation?"*  
     - **Real-life link:** Medical directives are enforced by doctors/family with their own stakes (guilt, resources), not philosophers.  

  2. **The double-edged sword of directives:**  
     - *"What made the irrevocable clause tempting? How did it backfire?"*  
     - **Takeaway:** Directives are valuable when we distrust future weakness (e.g., addiction), but dangerous when we change legitimately (e.g., new medical prognosis).  

  3. **The "knowledge gap" matters more than identity:**  
     - *"Whose directives seemed wise/foolish after the twist? Was the past self wiser or less informed?"*  
     - **Real-life link:** A healthy person bans life support, not grasping illness’s reality. Their past self knew *less*—not more.  

  #### **What the Activity Can’t Replicate:**  
  - **Emotional weight:** Real directives involve life/death, not tokens. *Say: "Imagine this was about life support. How would guilt or love change votes?"*  
  - **Gradual change:** Dementia erodes identity slowly; this is sudden. *Say: "In reality, we debate ‘when’ someone stops being ‘themselves.’"*  

  #### **Predictable Problems & Fixes:**  
  | **Problem**              | **Prevention Strategy**                                  |  
  |---------------------------|----------------------------------------------------------|  
  | Vague directives          | **Examples + circulate during writing:** *"Which bowl? How will we check?"* |  
  | Group won’t enforce       | **Twist raises stakes:** Few tokens in Bowl A = no donation. Group loses out if too lenient. |  
  | Votes become popularity contests | **Secret ballots + prompt:** *"Vote based on what’s best for you/group, not the person."* |  
  | Uneven participation      | **Cold-call quiet members:** *"Maria, what’s your token directive?"* |  

  ---

  ### **What the Group Should Come Away Seeing**  
  - **Core insight:** The "authority" of a past self is an illusion. What matters is:  
    - **Who enforces the directive** (e.g., family, doctors),  
    - **Their incentives** (cost, guilt, convenience),  
    - **The gap in knowledge** between past/present selves.  
  - **The paradox:** Directives are only useful when we fear our future judgment—but that same fear can trap us when change is valid.  
  - **Final note:** *"We don’t argue about ‘same person’ when directives benefit us. We argue when they cost us."*  

  This design balances visceral experience with reflection, avoiding abstraction. The token twist forces participants to *feel* the conflict, while the debrief names what they sensed but couldn’t articulate. Run it tightly, and they’ll leave wrestling with the real weight of your father’s question.
