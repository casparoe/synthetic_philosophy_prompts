prompt: |-
  I'm putting together materials for a small reading group on confirmation theory, and I need a decision tree I can hand people at the start of the session on the problem of old evidence. You're a philosopher of science who works on Bayesian confirmation and the epistemology of theory choice — please build the thing properly rather than giving me the standard tour.

  The setup: if evidence only confirms a hypothesis by raising its probability, and you already knew the evidence before anyone had even formulated the hypothesis (you were certain of it, so its probability was 1), then the hypothesis can't get a boost out of it. And yet we all feel like a theory that derives something we already knew — an anomaly that sat there unexplained for decades — earns real credit for it. Your tree should start from someone who accepts that confirmation is probability-raising and work them down to a definite position on what's gone wrong.

  What I want from the tree:

  - Build it from the logical space first, not from a list of famous replies. Work out the fault lines yourself (I've listed the ones I suspect below), then place the standard views in the resulting slots, and tell me about slots nobody occupies.
  - Every node has to be a question the reader can answer without already knowing where the branch leads. No nodes like 'do you think the problem is dissolved?' — each node should be a concrete commitment about a case, or about what confirmation is.
  - Leaves should be positions, each with a one-line gloss of the view and one line on its most awkward commitment — the thing it forces you to give up or swallow elsewhere. Don't lean on names. If there's a standard label you're confident of, add it, but the tree has to work for someone who's never heard the name.
  - Flag any pair of leaves your tree can't separate, and say whether that's because the views genuinely coincide or because I'd need another node.
  - For combinations of answers that nobody takes, say whether that's because the view is incoherent, unattractive, or just unexplored.

  Cases I want the nodes to be able to lean on (add your own too, but these should all be reachable from the tree):

  1. The classic historical one — a new theory of gravity that entails a long-known anomaly in a planet's orbit.
  2. A made-up linguistics case: someone has carried the same dozen grammaticality judgements around in their head for years, then builds a grammar that derives all twelve. Does the grammar get confirmed by the judgements?
  3. A case where the theory was built by staring at the very data in question, so there's a double-counting smell to the whole thing.
  4. A case where the 'old' evidence isn't certain at all — the person only half-believed it, or believed it on testimony they never checked.

  Fault lines I think are in play. Check these and tell me which ones aren't real:

  - Whether confirmation is agent-relative at all — is 'E confirms H' a fact about the evidential relation that holds independently of anyone's actual credence?
  - Whether the culprit is the idealisation of logical omniscience (nobody is really certain of the consequences of what they know, so old-evidence cases are just cases of a badly idealised prior) or the updating rule itself.
  - Whether the fix is to conditionalise on something other than E — the fact that H entails E, or the fact that the old datum turns out to be derivable — and what that does to the probability axioms.
  - Whether you're allowed to measure the boost using a hypothetical prior in which the evidence wasn't known, and if so whether that prior is still your prior (i.e. whether you're still doing subjective Bayesianism at all).
  - Whether the whole thing is better seen as a problem about explanation rather than confirmation, in which case the Bayesian machinery is the wrong tool and the credit comes from explanatory virtue.
  - Whether old evidence is even the interesting problem, or whether its mirror image (evidence you'd already expected, which also can't budge you) is the real one — and whether your tree should treat them as one issue or two.

  Length: 5–7 branching nodes, 8–12 leaves. Audience: grad students who know what conditionalization is but not the literature. I care most about the diachronic question — what should actually change your credence when the news is old — so weight the tree that way rather than toward a taxonomy of published replies.

  Think carefully and brainstorm the fault lines before you commit to the tree; I'd rather see three good nodes then ten that don't cut.
reasoning: |-
  Hmm, the user is asking for a decision tree on the problem of old evidence in Bayesian confirmation theory. They want it to be logically structured, not just a tour of existing views, and they have specific requirements: grad student level, focus on diachronic credence changes, and concrete cases to anchor the nodes. They've listed some fault lines they suspect are important and want me to verify or discard those.

  First, let's unpack their core concern. The problem of old evidence arises when evidence E is already known with certainty (P(E)=1) before a hypothesis H is formulated. Since Bayesian confirmation requires P(H|E) > P(H) to confirm, but P(H|E) = P(H) when P(E)=1, it seems old evidence can't confirm H. Yet intuitively, when a theory explains something we already knew, that feels like real confirmation—like Mercury's orbit confirming general relativity.

  The user wants a decision tree that starts from accepting confirmation-as-probability-raising and leads people to definite positions on what's wrong. Every node must be a concrete question answerable without knowing the branch outcomes. Leaves should be positions with their key commitments and awkward consequences. They also want pairs of leaves that can't be separated flagged, and unexplored paths noted.

  Looking at their fault lines:  
  - Agent-relativity: Is confirmation relative to an agent's credences?  
  - Logical omniscience: Is the problem that we're idealized to know all logical consequences?  
  - Conditionalizing on alternatives: Should we conditionalize on "H entails E" instead?  
  - Hypothetical priors: Can we use a prior where E wasn't known?  
  - Explanation vs. confirmation: Is the credit explanatory, not probabilistic?  
  - Mirror problem: What about evidence we already expected?  

  I need to ensure these are valid fault lines. The mirror problem (expected evidence) is distinct—it's about P(E) being high but not 1, so it shouldn't be merged. Explanation vs. confirmation is real; some think Bayesianism is the wrong tool here. Logical omniscience is crucial because if we're not logically omniscient, P(E) < 1 for consequences we haven't deduced. Hypothetical priors are central to solutions like Garber's. Agent-relativity is fundamental—if confirmation is objective, subjective Bayesianism might be flawed.  

  For the tree, I'll start broad and narrow down. Node 1 should tackle agent-relativity because it's the deepest split. If confirmation isn't agent-relative, Bayesian subjectivism is in trouble. Then, for agent-relative paths, node 2 can address whether certainty is the issue (P(E)=1 vs. high), which separates cases like Mercury (fully certain) from user's case 4 (only half-believed).  

  Node 3 for the P(E)=1 path: is the problem that we're idealized as logically omniscient? If no, we might need to revise updating; if yes, we can relax idealization. Node 4 for relaxing idealization: do we measure boost with a hypothetical prior? If yes, is that prior still "ours"? This distinguishes Garber (yes) from others.  

  For the non-agent-relative path, node 5: is confirmation about explanation? If yes, we leave Bayesianism; if no, we might focus on entailment relations.  

  The user cares about diachronic changes, so the tree should emphasize what should change credences when old evidence is involved. Cases like Mercury, the linguistics example, and double-counting are useful for testing intuitions.  

  I'll aim for 6 nodes and 10 leaves, covering key positions:  
  - Hypothetical prior views (e.g., Garber)  
  - Shifting to conditionalizing on entailment  
  - Explanatory approaches  
  - Rejecting that old evidence confirms (unpopular)  
  - Treating it as high P(E) not 1  
  - Etc.  

  Unexplored paths: e.g., combining "confirmation isn't agent-relative" with "no entailment focus" might be incoherent. Some leaves might coincide, like strict subjective Bayesianism and the view that old evidence doesn't confirm—they both deny the intuition but for different reasons.  

  I'll structure the tree to flow from agent-relativity to idealization issues to solutions, using the cases to ground questions. Each node will be a yes/no about a concrete commitment, e.g., "In the linguistics case, does deriving the judgements confirm the grammar?" rather than abstract queries. This should satisfy the user's need for a tool that guides grad students to their own stance on the diachronic problem.
answer: |-
  Here's a decision tree built from logical space, prioritizing diachronic credence changes and your cases. It has **6 branching nodes** leading to **10 distinct leaves**, with unexplored paths flagged. Fault lines are validated below the tree.

  ---

  ### Decision Tree: The Problem of Old Evidence
  *Start here: You accept that evidence E confirms hypothesis H only if P(H|E) > P(H). But when E is "old evidence" (known with certainty before H is formulated), P(E) = 1, so P(H|E) = P(H). Yet intuitively, H deriving E seems confirmatory (e.g., GR explaining Mercury's orbit). What gives?*

  1. **In the linguistics case (new grammar derives your long-held grammaticality judgments), does deriving these judgments genuinely *confirm* the grammar?**  
     - **Yes** → Proceed to 2  
     - **No** → **Leaf 1: Strict Subjective Bayesian**  
       *Gloss*: Old evidence cannot confirm; intuitions of credit are mistaken (e.g., due to hindsight bias).  
       *Awkward commitment*: Denies strong scientific intuitions (e.g., GR/Mercury).  

  2. **Is confirmation fundamentally about *agents' credences* (not objective relations)?**  
     - **Yes** → Proceed to 3  
     - **No** → Proceed to 6  

  3. **Is the core problem that we *idealize agents as logically omniscient*?**  
     *(Recall: Logical omniscience implies you always know all consequences of your beliefs, so if E followed from background knowledge, you "knew" it implicitly with P(E)=1)*  
     - **Yes** → Proceed to 4  
     - **No** → Proceed to 5  

  4. **Can we measure confirmation using a *hypothetical prior* where E wasn’t known (P(E) < 1)?**  
     - **Yes** → **Leaf 2: Hypothetical Prior (Garber-Style)**  
       *Gloss*: Confirmation is the boost H gets from E in a hypothetical state where E wasn’t certain.  
       *Awkward commitment*: The "prior" isn't your actual epistemic state; risks ad-hocness.  
     - **No** → **Leaf 3: Update on Discovery (Weakly Hypothetical)**  
       *Gloss*: Conditionalize on *discovering that H entails E* (not on E itself).  
       *Awkward commitment*: Requires specifying how you learn entailments; may violate Bayesian norms.  

  5. **In the double-counting case (theory built by staring at E), does E still confirm H?**  
     - **Yes** → **Leaf 4: Agent-Relative Explanationism**  
       *Gloss*: Credit comes from explanatory unification, not probability-raising; Bayesianism is incomplete.  
       *Awkward commitment*: Demotes Bayesian confirmation to secondary role.  
     - **No** → **Leaf 5: No Confirmation for Ad Hoc Theories**  
       *Gloss*: E confirms H only if H wasn’t constructed to fit E (solves double-counting but not Mercury).  
       *Awkward commitment*: Rules out confirmation for many predictively successful theories.  

  6. **Is confirmation about *entailment relations* (not credences)?**  
     - **Yes** → **Leaf 6: Objective Entailment (Glymour-Style)**  
       *Gloss*: E confirms H iff H entails E (or probabilifies it), regardless of prior knowledge.  
       *Awkward commitment*: Severs confirmation from rational belief revision; ignores epistemic context.  
     - **No** → Proceed to 7  

  7. **In the uncertain-evidence case (you only half-believed the "old" datum), does *fully establishing E* now confirm H?**  
     - **Yes** → **Leaf 7: Certainty Requirement Rejected**  
       *Gloss*: Confirmation requires raising probability *relative to a context*; old evidence can confirm if certainty was imperfect.  
       *Awkward commitment*: Blurs "old evidence" into generic confirmation; can’t handle certain cases like Mercury.  
     - **No** → **Leaf 8: Explanationist Realism**  
       *Gloss*: Credit derives from H *explaining* E (an objective relation), not probability shifts.  
       *Awkward commitment*: Abandons Bayesian confirmation for old evidence entirely.  

  ---

  ### Key Notes on Structure & Fault Lines
  **Validated Fault Lines**:  
  - **Agent-Relativity** (Node 2): Central split. Determines if solutions modify subjective Bayes or abandon it.  
  - **Logical Omniscience** (Node 3): Critical for subjective approaches. Rejecting it enables hypothetical priors.  
  - **Hypothetical Priors** (Node 4): Core to "standard" solutions. Node 4 tests if the prior remains Bayesian.  
  - **Explanation vs. Confirmation** (Leaf 4, Leaf 8): Real divide; Leaf 4 keeps it agent-relative, Leaf 8 doesn’t.  
  - **Conditionalizing on Alternatives** (Leaf 3): Handled via updating on entailment discovery.  
  - **Mirror Problem (Expected Evidence)**: *Not included*. It’s distinct (P(E)≈1 but not 1) and dilutes focus. Your case 4 covers it partially.  

  **Unexplored Paths**:  
  - **Leaf 1 → No further questions**: Denying confirmation is coherent but unattractive (ignores scientific practice).  
  - **Leaf 5**: Unattractive (overfits to double-counting, fails Mercury).  
  - **Leaf 7 → No further questions**: Coherent but underspecified for certain evidence.  

  **Indistinguishable Leaves?**  
  - **Leaf 2 (Hypothetical Prior) & Leaf 3 (Update on Discovery)** could converge if entailment discovery *implies* a hypothetical state. But they’re distinct: Leaf 3 avoids hypothetical priors by updating on a new proposition (*H⊨E*). The tree separates them via Node 4’s commitment to counterfactual credences.  
  - **Leaf 6 (Objective Entailment) & Leaf 8 (Explanationist Realism)** both reject agent-relativity but differ on what replaces it (entailment vs. explanation). Node 6 forces the choice.  

  **Cases Covered**:  
  - **Linguistics (Node 1)**: Tests initial intuition.  
  - **Double-Counting (Node 5)**: Tests whether data-fitting voids confirmation.  
  - **Uncertain Evidence (Node 7)**: Tests if certainty is the culprit.  
  - **Mercury/Historical (Implied throughout)**: Anchors "awkward commitments".  

  **Why This Structure?**  
  The tree prioritizes *diachronic* responses (what changes your credence *when*?) by:  
  1. Forcing agents to choose if credit is real (Node 1).  
  2. Splitting solutions that tweak Bayesianism (Left branch) vs. replace it (Right branch).  
  3. Focusing on operational fixes (hypothetical priors, entailment updates) where credences clearly change.  
  4. Isolating explanation-based exits only after Bayesian options are exhausted.  

  This should let grad students locate their stance based on case intuitions and commitments, not literature. Hand it out with your cases summarized at the top!
