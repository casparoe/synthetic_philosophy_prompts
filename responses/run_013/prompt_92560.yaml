prompt: |-
  I have twice recently been told what the Kelly criterion proves, and the two occasions pulled in opposite directions: once to argue that a single, non-repeatable opportunity — staking a large share of my savings in a deal with a clearly positive expected value and a substantial chance of losing the whole stake — should be declined; and once to argue that anyone staking less than the full Kelly fraction on a favourable, repeatable gamble is behaving irrationally and leaving money on the table. In both cases the entire argument rested on a one-liner, that the Kelly criterion is provably optimal, and in neither case could anyone tell me what it was supposed to be optimal at.

  I would like a menu of the distinct theses that line could be asserting, ordered from the trivial to the strong, with a verdict on each: which readings are theorems, and under exactly which assumptions (repetition, independence, known probabilities, proportional staking, perfect divisibility of the bankroll, an infinite horizon); which are substantive decision-theoretic commitments dressed up as theorems — in particular, whether 'optimal' adds anything at all to 'maximises expected log wealth', and what independent case there is for log wealth rather than some other function of wealth; which are heuristics for a world in which the edge is unknown and the future is not a sequence of identical trials; and which are simply false, such as the claims that Kelly staking cannot be ruined, that it dominates its rivals, or that the criterion transfers unchanged to a bet that will never come round again. For each reading, say what it would actually license in the two cases above, and in particular whether the cautious reading needs the assumption that the gamble is one of a long run of similar gambles, and whether the aggressive reading needs the bankroll to be large, divisible, and repeatedly staked. The slogan that 'rationality is geometric rather than arithmetic' sometimes travels with the first one; separate what is arithmetical in that claim from what is a claim about how an agent should choose. Lay the readings out side by side rather than defending one of them, and be explicit about where the line stops being a theorem and starts being a value judgement.
reasoning: |-
  Okay, the user is grappling with conflicting interpretations of the Kelly Criterion they've encountered. They've been told in one scenario to decline a single high-risk opportunity despite positive EV, citing Kelly, and in another scenario to always bet full Kelly fraction on repeatable bets. Both arguments just waved "Kelly is optimal" as justification without explaining what "optimal" actually means. 

  The user wants a systematic breakdown of possible interpretations of "Kelly is optimal," sorted by strength/triviality, with clear demarcation between mathematical truths and value judgments. They specifically want to know which interpretations apply to their two scenarios (single non-repeatable bet vs repeatable gamble), and what assumptions each interpretation relies on (repetition, bankroll divisibility etc). 

  Hmm, this is actually quite sophisticated - they're noticing how the same theorem gets weaponized for opposite conclusions by smuggling in different unstated premises. The frustration with "one-liner" arguments suggests they've encountered some intellectual laziness. Underneath, they might be seeking immunization against rhetorical misuse of math in decision-making contexts.

  Let me structure this carefully. First need to establish what Kelly actually proves mathematically - that's the uncontroversial core. Then unpack how people extend this core into normative claims, which involves: (1) different performance metrics (growth rate vs ruin probability), (2) different time horizons (asymptotic vs finite), (3) utility foundations (why log wealth?). 

  Key insights to highlight: The single bet advice misapplies Kelly - the criterion isn't designed for one-offs. The "always bet full Kelly" crowd often ignores real-world complexities like uncertainty in edge estimation. And crucially, "optimal" only means something specific within Kelly's original setup - it's not universally superior.

  Should probably use a table for clarity showing which interpretations support which conclusion in their two cases, with required assumptions. Must emphasize where the math stops: Kelly doesn't tell you to avoid positive EV single bets, nor does it command infinite leverage - those come from added assumptions. The "geometric growth" argument only becomes prescriptive if you already accept maximizing long-run growth as the goal.

  Biggest trap to avoid: letting the answer become another "one true answer" lecture. Need to show spectrum of valid interpretations while exposing where each overreaches. The value judgments come in when choosing which metric to optimize (growth vs security) or how to handle model uncertainty.
answer: |-
  Here is a systematic breakdown of interpretations of "the Kelly criterion is optimal," ordered from mathematically established to increasingly value-laden or heuristic, with implications for your two scenarios:

  ### Core Mathematical Theorem (The Trivial Reading)
  *   **Thesis:** Given repeated, identical, independent fractional-bet opportunities with known positive edge, *maximizing expected logarithmic wealth* (i.e., using the Kelly fraction) maximizes the asymptotic (long-run) *growth rate* of wealth.
  *   **Verdict:** **Theorem.**
  *   **Crucial Assumptions:**
      *   Infinitely repeated bets (or sufficiently long horizon).
      *   Identical, independent opportunities each trial.
      *   Known, fixed probabilities and payoff structure (known edge).
      *   Bets are a *fraction* of current wealth (proportional staking).
      *   Wealth is perfectly divisible.
      *   No transaction costs, taxes, or borrowing constraints.
  *   **What "Optimal" Means:** Maximizes the limit of (1/n) * log(W_n) as n -> ∞, where W_n is wealth after n bets. This is the *exponential growth rate*.
  *   **Implications for Your Cases:**
      *   **Single Non-Repeatable Bet:** **Does NOT apply.** The theorem relies critically on repetition and asymptotic behavior. It says nothing definitive about a single bet.
      *   **Staking < Full Kelly on Repeatable Bet:** Under the strict assumptions above, staking less than Kelly *does* result in a lower long-run growth rate. "Leaving money on the table" refers strictly to sacrificing asymptotic growth potential.

  ### Common Extensions & Interpretations (Beyond the Core Theorem)

  1.  **Dominance in Probability of Beating Other Strategies (Asymptotically):**
      *   **Thesis:** For sufficiently long horizons under the core assumptions, the Kelly strategy will almost surely exceed the wealth of any other "essentially different" strategy with probability approaching 1.
      *   **Verdict:** **Theorem** (a consequence of maximizing growth rate).
      *   **Assumptions:** Same as the core theorem + technical conditions on "essentially different" strategies.
      *   **Implications:**
          *   **Single Bet:** Still **does not apply** (asymptotics needed).
          *   **< Kelly on Repeatable:** Under strict assumptions, Kelly will dominate *eventually*.

  2.  **Minimizing Time to Reach a Wealth Goal (Asymptotically):**
      *   **Thesis:** Kelly minimizes the *expected time* to reach any sufficiently large wealth goal (asymptotically, for large goals) under the core assumptions.
      *   **Verdict:** **Theorem** (another consequence of maximizing growth rate).
      *   **Assumptions:** Same as core theorem.
      *   **Implications:** Same as (1).

  3.  **Rational Utility Foundation (Log Utility):**
      *   **Thesis:** Using the Kelly fraction is equivalent to maximizing *expected utility* where utility is the logarithm of wealth. Therefore, it is "optimal" for an agent with log utility.
      *   **Verdict:** **Theorem** (by definition/log tautology).
      *   **Assumptions:** The agent *has* a utility function U(W) = log(W). This is a substantive decision-theoretic commitment.
      *   **Independent Case for Log Utility:**
          *   *Growth Rate:* Maximizes long-run growth (the core theorem).
          *   *Wealth Perception:* Represents constant proportional risk aversion (CPRA) – risk attitude depends only on the *percentage* of wealth at stake, not absolute amount. Psychologically plausible for many large-stake decisions.
          *   *Behavioral Axioms:* Can be derived from axioms like the double-or-nothing paradox resolution or proportional betting principles, but these are normative, not descriptive.
          *   **Critique:** Why log? Other concave utility functions (e.g., U(W) = W^(1-γ)/(1-γ), γ>0) represent different risk preferences. Kelly/log utility implies a *specific*, relatively aggressive level of risk tolerance (γ=1). Claiming it's universally "rational" conflates a specific risk preference with rationality.
      *   **Implications:**
          *   **Single Bet:** If the agent has log utility, then maximizing E[log(W)] **is** rational decision theory for that single bet. Declining a +EV, high-risk bet *could* be rational *if* the risk of ruin causes a sufficiently large drop in E[log(W)]. Kelly calculates the *fraction* that maximizes E[log(W)] for that single bet, but declining (staking 0%) might be the utility-maximizing choice *if* the calculated optimal fraction is very small or negative (which it isn't for +EV bets). **Crucially:** The "large share of savings" aspect makes it a *large* bet relative to wealth. Log utility inherently penalizes large percentage losses severely. Kelly for this single bet would likely recommend a *small* fraction, possibly much smaller than the "large share" you considered. The advice to decline aligns with log utility *if* the stake considered was significantly larger than the Kelly fraction for that single bet.
          *   **< Kelly on Repeatable:** For a log-utility agent, staking less than the single-bet Kelly fraction *on each bet* in a sequence **is** irrational *under the core assumptions* as it directly lowers expected utility per bet. The core growth theorem provides a *separate*, powerful justification rooted in long-run performance.

  4.  **Heuristic for Unknown Edge or Non-IID:** ("Fractional Kelly")
      *   **Thesis:** Because the core Kelly fraction is highly sensitive to misestimation of edge (over-betting is far more damaging than under-betting), and real-world opportunities aren't perfectly IID, staking a *fraction* (e.g., 1/2, 1/3) of the calculated Kelly fraction is a prudent heuristic.
      *   **Verdict:** **Heuristic/Plausible Argument.** Not a theorem. Based on risk management.
      *   **Implications:**
          *   **Single Bet:** Supports caution if the edge is uncertain.
          *   **< Kelly on Repeatable:** Provides a *rationale* for staking less than full Kelly in realistic settings (uncertainty, non-IID), countering the "always irrational" claim.

  5.  **Superiority in Risk-Adjusted Return / Ruin Minimization (FALSE):**
      *   **Thesis:** Kelly maximizes risk-adjusted return or minimizes the probability of ruin.
      *   **Verdict:** **Generally FALSE.**
      *   **Why False:**
          *   Kelly does *not* minimize the probability of ruin. Fixed fractional Kelly betting *can* still lead to ruin (approaching zero wealth with positive probability, though not certain ruin if bets are continuous). Strategies staking smaller fractions have *lower* ruin probabilities.
          *   Kelly does not optimize standard risk-adjusted metrics like Sharpe Ratio. It often has higher volatility than smaller fractions. Its "risk adjustment" is specific to the long-run growth metric and log utility.
      *   **Implications:**
          *   **Single Bet:** The "substantial chance of losing the whole stake" concern is valid *regardless* of Kelly. Kelly doesn't magically prevent loss.
          *   **< Kelly on Repeatable:** Staking less than Kelly can be a *rational* choice to reduce volatility or ruin probability, contradicting the "always irrational" claim.

  **Summary Table: Kelly "Optimality" Interpretations**

  | Interpretation                                      | Verdict      | Key Assumptions                               | Single Non-Repeatable Bet?                  | Staking < Full Kelly Repeatable?          |
  | :-------------------------------------------------- | :----------- | :-------------------------------------------- | :------------------------------------------ | :---------------------------------------- |
  | **Maximizes Asymptotic Growth Rate**                | **Theorem**  | Infinite rep., IID, known prob., frac. staking | **No Application**                           | Lower growth rate (under assumptions)     |
  | **Dominates Wealth Asymptotically (Prob.→1)**       | **Theorem**  | Same as above + tech. cond.                   | **No Application**                           | Eventually beaten (under assumptions)     |
  | **Minimizes Time to Large Goal (Asympt.)**          | **Theorem**  | Same as core                                  | **No Application**                           | Slower asymptotically (under assumptions) |
  | **Maximizes E[log(W)] (Log Utility)**               | **Theorem**  | Agent has U=log(W)                            | Stake Kelly frac. (likely small); 0% *may* be rational if stake >> Kelly | Irrational (lowers E[U])                  |
  | **Prudent Heuristic (Fractional Kelly)**            | Heuristic    | Edge uncertain, non-IID bets                  | Supports caution                            | Provides rationale                        |
  | **Minimizes Ruin Risk / Optimizes Sharpe (FALSE)**  | **False**    | N/A                                           | Doesn't prevent ruin                        | Can be rational for safety                |

  **Addressing Key Phrases & Your Cases:**

  *   **"Rationality is geometric rather than arithmetic":**
      *   *Arithmetical:* The *growth rate* is geometric (compounded). Arithmetic mean return is misleading for repeated betting.
      *   *Decision-Theoretic:* This phrase argues that long-run terminal wealth (a geometric process) and its maximization should be the goal, prioritizing compounding over short-term EV or volatility. This *is* a value judgement. It dismisses other legitimate goals like survival (minimizing ruin probability) or maximizing median wealth, which might favor different strategies (e.g., fractional Kelly).
  *   **Case 1 (Decline Single Bet):**
      *   Relies on **Log Utility (Thesis 3)**. The argument implicitly assumes log utility (or similar), where the potential large percentage loss drastically reduces E[log(W)]. It *correctly* notes that Kelly (for this single bet under log utility) would recommend a fraction likely much smaller than the "large share" considered. However, **it misapplies the "long run" growth theorem** to justify declining a single +EV bet. The valid justification is solely through the lens of single-bet expected log utility and risk aversion.
      *   **Needs Repetition?** No. Its core justification (log utility) applies to a single bet. The "long run" argument is irrelevant here.
  *   **Case 2 (Always Bet Full Kelly):**
      *   Relies most directly on the **Core Growth Theorem (Thesis 0)** and **Log Utility (Thesis 3)** under *idealized conditions*. It claims that under these strict assumptions, any deviation sacrifices long-run growth or expected utility.
      *   **Needs Large/Divisible/Roll?** **Absolutely. Critically.** The core growth theorem *requires* repetition (long horizon), proportional staking (fraction of *current* wealth), and perfect divisibility to hold. The "irrational/leaving money" claim collapses without these. A small, indivisible bankroll facing one final bet makes the growth theorem irrelevant; only single-bet utility matters.

  **The Line Between Theorem and Value Judgement:**

  *   **Theorem Stops Here:** "Maximizing E[log(W)] maximizes the asymptotic growth rate under repeated, identical, fractional betting with known probabilities." Everything else builds upon this.
  *   **Value Judgement Starts Here:**
      1.  **Is asymptotic growth rate the right goal?** Survival, finite horizon performance, median wealth, or personal risk tolerance might be more important.
      2.  **Is log utility the right utility function?** It implies a specific (high) risk tolerance. Other concave utilities represent different preferences.
      3.  **Should the theorem be applied outside its strict assumptions?** (e.g., single bets, uncertain edge, non-IID, small bankrolls). This requires adaptation (like fractional Kelly) and involves judgement calls about risk.
      4.  **Does "optimal" imply universally superior?** Only in the very narrow, technical sense defined by the theorem. It is not universally superior on other metrics like short-term volatility or ruin probability.

  **Conclusion:** The Kelly criterion is a profound and valuable concept. Its core theorem is mathematically sound but operates within strict, idealized boundaries. The claim "Kelly is optimal" is only a definitive theorem when it means "maximizes asymptotic growth rate under specific repetitive conditions." When used to argue for declining a single bet, it leans heavily on the risk aversion inherent in log utility. When used to argue for always staking full Kelly on repeatable bets, it relies on the idealized assumptions being perfectly met and long-run growth being the sole objective. Most real-world applications require significant adaptation and involve trade-offs between growth and safety that go beyond the pure math, entering the realm of value judgements about risk and goals.
