prompt: |-
  I am the chief scientist at a state agency's evidence review unit. Six staff, all trained scientists, none with any background in philosophy, and we are the office that has to say in writing whether a claim is established. Each month we triage two or three questions and twice a quarter we issue a formal determination; the determinations get quoted in the press and read into the legislative record, so a hedge costs us about as much as an error. Two staffers get ninety minutes at a table with the case file — the studies, exposure estimates, and modeling reports that other people have already assembled — and no time or mandate to go find new literature. Anything we escalate goes to me, and above a threshold it goes to a public board.

  Please write us a reusable determination procedure whose governing idea is the underdetermination of theory by evidence. It has to do one job well: separate the cases where the evidence settles the question from the cases where two or more options survive the evidence and the choice among them is being made by something other than evidence — a default assumption, a precautionary tilt, a cost trade-off, an institutional habit — and route those two kinds of cases to different rooms with different sign-offs.

  The procedure should be a sequence of questions, and for each one: what counts as a sufficient answer, what disqualifies the case from going further, where it stops with a verdict, and where it hands the decision to a named person who must state on the record what they are deciding and on what grounds. Give it four verdicts — Settled; Gap Closeable; Gap Structural; Question Malformed — renaming or adding a fifth if you think one is needed. Keep the checklist itself to something a staffer can actually run in the ninety minutes, and put your explanations and the philosophical reasoning in a separate section after it.

  Four things I want built into the procedure, stated in operational terms rather than as allusions, and with a note on which distinctions can be dropped without loss and which have to survive the translation:

  1. The difference between the data being compatible with a hypothesis and two named rivals fitting the data equally well. Compatibility is nearly free and should not count as confirmation of anything.
  2. Where the gap sits: in the central hypothesis or in an auxiliary assumption — the dose-response model, the exposure estimate, the measurement instrument, the extrapolation across species or populations.
  3. Whether the gap is closeable: could a study of a kind we could plausibly fund, and that our staff could actually evaluate, close it, or would any feasible study leave the rivals standing? Treat those as different verdicts, not as degrees of the same one.
  4. The fact that the rivals anyone can name are not the rivals there are. Tell us what to do when the case file contains one hypothesis and a residual something else, and why an empty rival list should be a warning rather than support.

  Then run the procedure on three cases and show the verdict and the paperwork each would produce:

  A. A solvent causes liver tumors in rodents at high doses; the human studies are null but small. Question: does the evidence establish that it causes cancer in people at exposures measured near the facility?
  B. A cluster of a rare illness in a town beside a facility. The agency has already said publicly that the facility is the likely cause. Our review found the exposure estimates too coarse to separate exposed from unexposed, and that the town's age profile and recent in-migration could produce the same pattern. Question: does the evidence establish the link?
  C. Question: is the safety margin we currently require adequate?

  One of these should come out in a way we will not like, and I expect it to be B, so do not soften it. Close with the failure modes: where the procedure will hand down a confident-looking verdict that is really a judgment in disguise, where it can be gamed by whoever writes the case file, and what it cannot do at all. American English.
reasoning: |-
  Okay, the user is a chief scientist at a state agency's evidence review unit. They need a reusable determination procedure based on the underdetermination of theory by evidence. Their team consists of six trained scientists without philosophy backgrounds, and they handle 2-3 questions monthly with formal determinations that have significant public and legislative impact. The key challenge is distinguishing cases where evidence settles the question from those where multiple options survive and the decision involves non-evidential factors.

  The user specified four operational requirements: distinguishing compatibility from confirmation, identifying gap location (central hypothesis vs. auxiliary assumptions), differentiating closeable vs structural gaps, and handling unnamed rivals. They want a checklist that can be executed in 90 minutes by staffers, with four verdicts: Settled, Gap Closeable, Gap Structural, Question Malformed. 

  Hmm, the philosophical core here is underdetermination - the idea that evidence alone can't fully determine theory choice. Need to translate this into practical questions without philosophy jargon. The checklist should force explicit consideration of rivals and auxiliary assumptions. 

  For the structure, I'll design a six-step flow: 
  1. Clarify the question and key hypothesis
  2. Identify explicit rivals 
  3. Check for unnamed rivals
  4. Map evidence against hypotheses
  5. Locate gaps 
  6. Assess gap closeability

  Each step needs clear pass/fail criteria and off-ramps to verdicts. The "Gap Structural" verdict is crucial - it flags when no feasible study could resolve the issue, meaning the decision must involve policy considerations. 

  For the test cases:
  - Case A (solvent carcinogenicity) should get "Gap Structural" because high-dose rodent data + inadequate human studies can't establish human risk at specific exposures. 
  - Case B (disease cluster) should get "Question Malformed" since the agency pre-committed to causation - the evidence can't settle this.
  - Case C (safety margin adequacy) gets "Gap Closeable" - it's fundamentally about acceptable risk, not evidence alone.

  Biggest failure mode: staff might miss unnamed rivals (step 3) if they're not imaginative enough. Also, case file authors could game the system by omitting key studies or rivals. The procedure can't compensate for poor evidence synthesis - it only evaluates what's presented.
answer: |-
  ## Evidence Determination Procedure: Underdetermination Framework

  **Staff Checklist (90-Minute Execution)**  
  *[Answer sequentially; stop at first disqualification or verdict]*

  1. **Question Parsing**  
     - *Task:* Restate the core hypothesis (H) and required certainty threshold (e.g., "more likely than not," "beyond reasonable doubt").  
     - *Sufficient Answer:* Clear, testable H and explicit threshold stated in case file.  
     - *Disqualification:* H is vague, circular, or untestable.  
     - *Verdict:* **Question Malformed** (e.g., "Establish link" without defining "link" or threshold).  

  2. **Rival Enumeration**  
     - *Task:* List all rival hypotheses (R1, R2...) *explicitly proposed in the case file*. Then list plausible rivals *not* addressed but suggested by evidence gaps (e.g., "confounding by X," "artefact of method Y").  
     - *Sufficient Answer:* ≥1 rival named; staff notes if rivals feel artificially sparse.  
     - *Disqualification:* Zero rivals conceivable (even "chance/artifact").  
     - *Stop:* If no rivals survive Step 4, proceed to verdict. Else, continue.  

  3. **Evidence Mapping**  
     - *Task:* For H and each rival, note:  
       a) Evidence *compatible* (could be true if rival is true)  
       b) Evidence *discriminatory* (favors H over rival or vice versa)  
     - *Sufficient Answer:* Table with hypotheses vs. evidence; flag evidence only "compatible" with all.  
     - *Disqualification:* Key evidence irreconcilable with *all* hypotheses.  
     - *Verdict:* If discriminatory evidence *decisively* favors H over *all* rivals at threshold → **Settled**.  

  4. **Gap Localization**  
     - *Task:* For rivals not ruled out: Is the gap in (a) the **core hypothesis** (e.g., mechanism), or (b) an **auxiliary assumption** (e.g., exposure model, dose extrapolation)?  
     - *Sufficient Answer:* Gaps categorized with reasoning (e.g., "Rival R1 survives due to uncertainty in exposure assessment").  
     - *Handoff:* If gap is auxiliary → **Gap Closeable**. If gap is in core hypothesis → **Gap Structural**.  

  5. **Closeability Assessment** *(Only if Step 4 yields auxiliary gap)*  
     - *Task:* Could a *feasible* study (≤5 years, ≤$2M, within staff expertise) discriminate H from surviving rivals?  
     - *Sufficient Answer:* "Yes" if study design exists; "No" if gap persists even after ideal data.  
     - *Verdict:* Yes → **Gap Closeable**; No → **Gap Structural**.  

  6. **Sign-Off Routing**  
     - **Settled** → Staff issues determination.  
     - **Gap Closeable** → Staff recommends specific studies; Chief Scientist signs.  
     - **Gap Structural** → Public board decides; must state non-evidential grounds (e.g., "Precaution chosen due to irreparable harm potential").  
     - **Question Malformed** → Return to requester for clarification.  

  ---

  ### Philosophical Reasoning & Explanations  
  *Key: Underdetermination = Evidence alone cannot uniquely determine theory choice.*  

  1. **Compatibility ≠ Confirmation**  
     - *Operationalized:* Step 3 forces distinction. Compatibility is neutral; only discriminatory evidence counts.  
     - *Critical?* **Must survive.** Mistaking compatibility for proof is a primary error mode.  

  2. **Gap Location (Core vs. Auxiliary)**  
     - *Operationalized:* Step 4 isolates if uncertainty is in the hypothesis itself (structural) or tools/testing it (closeable).  
     - *Critical?* **Must survive.** Determines if science *can* resolve it (auxiliary) or if it’s fundamentally untestable (core).  

  3. **Closeability**  
     - *Operationalized:* Step 5 defines "closeable" by practical, not theoretical, standards.  
     - *Critical?* **Must survive.** Distinguishes temporary vs. permanent underdetermination.  

  4. **Unnamed Rivals**  
     - *Operationalized:* Step 2 requires actively generating plausible rivals beyond the file. An empty list is a red flag forcing "Question Malformed."  
     - *Why?* Underdetermination implies *infinite* possible rivals; failure to name any suggests flawed problem framing.  

  ---

  ### Case Applications  

  **Case A: Solvent Carcinogenicity**  
  1. **H:** Solvent causes cancer in humans at Facility X exposures.  
  2. **Rivals:** R1 (No effect in humans); R2 (Effect only at higher doses); R3 (Rodent tumors artefactual).  
  3. **Evidence:**  
     - *Compatible with all:* Human studies (underpowered), mechanism plausibility.  
     - *Discriminatory:* Rodent data favors H over R1, but not over R2/R3.  
  4. **Gap:** Auxiliary (dose extrapolation, species translation).  
  5. **Closeable?** No — No feasible study resolves high-to-low dose/species jump.  
     **Verdict: Gap Structural**  
     *Routing:* Public board decides. Non-evidential grounds required (e.g., "Precaution applied due to irreversibility").  

  **Case B: Disease Cluster**  
  1. **H:** Facility causes rare illness in Town.  
  2. **Rivals:** R1 (Chance cluster); R2 (Confounding: age/in-migration); R3 (Unknown environmental factor).  
  3. **Evidence:**  
     - *Compatible with all:* Cluster existence, facility proximity.  
     - *Discriminatory:* Exposure model flaws *disprove* H? No — compatible with H+R2. Age data favors R2 over H.  
  4. **Gap:** Core (causal mechanism); Auxiliary (exposure model).  
     **Verdict: Question Malformed** *(at Step 1)*  
     *Why?* Agency pre-commitment ("likely cause") violates neutrality. Evidence cannot "establish" link when H was assumed.  
     *Routing:* Returned. "Question presupposes conclusion; reframe without agency precedent."  

  **Case C: Safety Margin Adequacy**  
  1. **H:** Current safety margin reduces risk to "acceptable" level (per policy).  
  2. **Rivals:** R1 (Margin too low); R2 (Margin too high).  
  3. **Evidence:**  
     - *Compatible with all:* Historical safety records, mechanistic models.  
     - *Discriminatory:* None — "adequacy" is policy-dependent.  
  4. **Gap:** Structural (no evidence defines "adequate").  
     **Verdict: Gap Structural**  
     *Routing:* Public board. Grounds must state policy trade-offs (e.g., "Current margin balances economic cost vs. risk tolerance").  

  ---

  ### Failure Modes & Limitations  
  1. **Judgment in Disguise:**  
     - Step 3 (evidence mapping) may involve subjective weightings. Staff must document *why* evidence is discriminatory/compatible.  
     - *Mitigation:* Require consensus between two staffers; Chief Scientist audits 10% of "Settled" cases.  

  2. **Gaming the Case File:**  
     - Omitting rivals or key evidence in file biases outcomes.  
     - *Mitigation:* Staff must generate unnamed rivals (Step 2); Chief Scientist rejects files with obvious omissions.  

  3. **Cannot Solve:**  
     - Deep epistemological gaps (e.g., defining "proof" in chaos theory).  
     - Value conflicts masked as evidence questions (e.g., "acceptable risk").  
     - Time/Resource constraints beyond procedure scope.  

  **Final Note:** This forces explicit separation of evidence judgments (staff) from policy choices (board). Case B fails not because evidence is weak, but because the question corrupts the process. The procedure’s strength is in exposing such malformations.  

  ---  
  *Format: American English; 90-min executable checklist; philosophical basis operationalized. Verdicts: Settled (evidence suffices), Gap Closeable (auxiliary gap fixable), Gap Structural (core gap/unfixable), Question Malformed (unanswerable as framed).*
