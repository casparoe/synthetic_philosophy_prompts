prompt: |-
  I've been reading rationalist blogs and hanging around LessWrong-adjacent forums for the better part of a decade, and for the last six months a small discussion group I'm in has been circling the same question without moving. I'd like you to diagnose the disagreement rather than settle it. The topic travels under a few names — acausal trade, multiverse-wide superrationality, evidential cooperation in large worlds — and the core claim, as I understand it, is this: if the world is large enough to contain other agents whose decisions are correlated with mine (because we run the same decision procedure, or because my choice is evidence about theirs in the way one copy's choice is evidence about its duplicate's), then I can cooperate with them despite having no causal contact with them — taking the cooperative move in a one-shot Prisoner's Dilemma against an unknown other player, or treating my choice of charity or career as evidence about what other value-aligned agents do. The proponents in the group say this falls out of taking evidential or functional decision theory seriously together with a sufficiently large universe, and that the evidential payoff swamps every ordinary causal consideration. The skeptics say the correlation is either stipulated into existence or is a fact about the world we have no way of learning, that the argument has to first win the cases where evidential decision theory looks absurd — Newcomb, the bet whose payoff is determined by the past state that caused you to make it, the button that would rid the world of psychopaths given that only a psychopath would press it — and that even if you grant acausal influence, we are so clueless about the sign and magnitude of the effects that it cannot guide anyone's action. There is also a running side-skirmish about whether the view requires abandoning a certain picture of the self as bounded, and whether that abandonment is a cost or a liberation.

  My own hypothesis, offered as a hypothesis, is that the two sides are not really disagreeing about decision theory at all. It seems to me that the proponents are asking what a specified decision theory recommends under specified assumptions, while the skeptics are asking whether anyone could be justified in acting on it, and that those are different questions wearing one name. But I can also see a reading on which the real dispute is a hidden formal one — whether, once you actually write down a model of a large world with correlated agents, evidential or functional decision theory endorses cooperation or does something else entirely — with the rest being noise generated by conflicting intuitions about the puzzle cases. And a third reading, which I find least comfortable, is that the two sides simply start from incompatible bedrock intuitions about whether non-causal considerations can be reasons at all, in which case nothing either side says could ever tell.

  What I want from you is the diagnosis: is this a verbal dispute, a substantive one, two questions under one heading, a factual or formal disagreement in disguise, or a clash of starting intuitions that neither side can argue for? Ground it in what each side actually says, not in a general survey of decision theories, and be concrete about which specific move in the exchange is doing the load-bearing work. Then tell me what, if anything, would count as progress given your diagnosis — a formal result, a distinction, a specification of the model, a change of question — or argue that no progress should be expected here and explain why. I don't need citations or a reading list; I want the structure of the impasse.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been part of a discussion group for six months, stuck on the topic of acausal trade and related concepts. The core disagreement is between proponents who believe in evidential cooperation in large worlds and skeptics who challenge its feasibility. The user wants a diagnosis of the disagreement's nature, not a resolution.

  First, I need to identify the key points from each side. Proponents argue that in a sufficiently large universe with correlated agents, evidential decision theory (EDT) or functional decision theory (FDT) supports cooperation without causal contact. Skeptics raise issues about the unknowability of correlations, EDT's problems in classic paradoxes, and practical cluelessness about effects.

  The user presents three hypotheses: (1) it's about different questions—proponents focus on what the theory recommends, skeptics on justification; (2) a hidden formal disagreement about modeling; (3) bedrock intuitions on non-causal reasons. I need to evaluate which of these holds or if it's a combination.

  Looking at the proponents, they take the theories at face value with large-world assumptions. Their arguments hinge on formal models showing cooperation as the rational choice. Skeptics, however, question the applicability. They point out that real-world agents can't verify if they're in such a large world or determine correlation strength. This ties into the practicality of applying EDT/FDT.

  The user's first hypothesis seems strong. Proponents are analyzing within a theoretical framework, while skeptics are concerned with epistemology and justification. This is a meta-disagreement about the scope of decision theory—descriptive vs. normative vs. actionable.

  The second hypothesis about formal models is also relevant. Skeptics might doubt if the models are correctly applied. For example, in Newcomb's problem, EDT's recommendation is controversial. If the formal results in large worlds are disputed, that's a substantive disagreement. However, proponents might counter that their models are consistent within FDT.

  The third hypothesis about bedrock intuitions is trickier. Some skeptics might fundamentally reject non-causal reasons, viewing rationality as solely causal. This could be an irreconcilable difference in philosophical starting points. But not all skeptics might go that far; some might accept non-causal reasons in theory but not practice.

  The user's hidden concern might be about finding a path forward in their discussion group. They might feel stuck because each side talks past the other. The real need is to clarify whether progress is possible and how.

  Assessing the impasse: The core is a divergence between formal validity and practical justifiability. Proponents see the math, skeptics see the epistemic gaps. Progress could involve formalizing the conditions under which acausal trade works and the challenges in verifying those conditions. Distinguishing between "what does EDT/FDT prescribe?" and "can we reasonably act on it?" might help. Also, exploring if there's a middle ground where limited correlations could be leveraged, but that requires empirical evidence or models of bounded rationality.

  If it's about bedrock intuitions, progress might be impossible. But since not all skeptics reject non-causal reasons entirely, focusing on the epistemological barriers could be more productive. The group could shift to discussing what evidence would justify belief in relevant correlations, or design thought experiments where correlations are knowable.

  In conclusion, the primary issue is two questions under one heading. The solution is to disentangle them and address each separately. For progress, the group should agree on whether they're debating theoretical implications or practical applicability, then tackle the agreed question with relevant arguments.
answer: |-
  Based on your detailed description, the impasse is **primarily a case of "two questions under one heading"** – specifically, a divergence between *formal validity within a model* and *practical justifiability for action*. This misalignment is the load-bearing pillar sustaining the disagreement. However, it's layered with substantive formal/epistemological disagreements and potentially bedrock intuitions for *some* participants. Let's dissect it:

  ### The Core Diagnosis: Two Questions Under One Heading
  1.  **Proponents' Load-Bearing Move:** They are rigorously answering the question: *"Given a specific decision theory (EDT/FDT) and specific metaphysical assumptions (a large universe with decision-procedure correlations), what does that theory prescribe?"* Their arguments are model-internal. When they say "acausal trade falls out," they mean it is the logical consequence *within that framework* if you accept its axioms and assumptions. The "sufficiently large universe" is a stipulated axiom in their model, not an empirical claim needing justification *for the model's internal logic*. Critiques based on unknowability or Newcomb's paradox seem to them like rejecting the premises of a hypothetical.

  2.  **Skeptics' Load-Bearing Move:** They are asking: *"Can any real agent, with our limitations of knowledge and embedded in the actual world (or any plausible world we might inhabit), be epistemically justified in acting *as if* acausal trade is occurring?"* Their core argument is that the necessary conditions for acausal trade (specific, strong correlations with *relevant* other agents) are fundamentally *unknowable* or *unverifiable* by any bounded agent. Critiques like "correlation is stipulated" or "we are clueless about sign/magnitude" directly attack the *bridge* between the formal model and actionable real-world guidance. Newcomb-like cases are used not to refute the model's internal logic, but to demonstrate that EDT/FDT prescriptions *outside of tightly controlled, known-correlation scenarios* lead to absurdities or paralyzing cluelessness.

  **Why this creates an impasse:** Proponents feel skeptics are changing the subject or refusing to engage with the theoretical result. Skeptics feel proponents are building castles in the sky irrelevant to practical rationality. Neither side is *wrong* about their core question, but they are talking past each other because "Is acausal trade rational?" means:
  *   *(Proponents)* "Is it the output of EDT/FDT under large-world assumptions?"
  *   *(Skeptics)* "Can we ever rationally believe acting on it will achieve intended outcomes?"

  ### Secondary Layers: Formal & Epistemological Substance
  While the primary issue is the question-divergence, there are substantive disagreements nested within it, feeding the stalemate:

  1.  **Formal Substance (Hidden but Real):** Beneath the surface, there is disagreement about *how to formally model "large worlds" and correlation*. Proponents assume models where your decision algorithm is *uniquely identifiable* as correlated with specific other agents (e.g., exact algorithmic copies). Skeptics implicitly (or explicitly) argue that in a *truly* large and complex universe, correlation is messy, partial, diluted by countless other variables and agents, and your algorithm is just one noisy signal among many. This isn't just about "size," but about the *structure* of correlation. **Load-Bearing Move:** The skeptic's "cluelessness about sign/magnitude" argument challenges whether the clean, high-correlation models used to *derive* acausal trade are robust or representative in realistic large-world scenarios. If correlations are weak or unpredictable in sign, EDT/FDT might not prescribe cooperation, or might prescribe actions indistinguishable from causal CDT in practice.

  2.  **Epistemological Substance:** This is tightly linked to the practical justifiability question. Skeptics argue that *even if* the formal model prescribes cooperation, we have no reliable epistemic access to:
      *   Whether we *are* in such a large/structured universe.
      *   Whether our decision procedure *is* sufficiently correlated with specific value-aligned agents (and not also with value-opposed ones!).
      *   The *strength* and *direction* of the correlations.
      **Load-Bearing Move:** The "fact about the world we have no way of learning" point. Without this knowledge, acting on acausal trade prescriptions is, to skeptics, akin to gambling based on an unsupported metaphysical belief, not rational decision-making.

  ### Bedrock Intuitions: A Potential Deep Split (But Not Universal)
  For *some* participants, the disagreement might stem from bedrock intuitions about "reasons":
  *   **Proponents (implicitly):** Accept that abstract, logical, or informational relationships (like algorithmic similarity) can constitute valid reasons for action, even absent causal levers. Rationality is about optimizing logical expectations.
  *   **Skeptics (implicitly for some):** Hold that reasons for action must be grounded in potential *causal efficacy* within the spatiotemporal world. Rationality is about navigating causal webs to achieve outcomes.
  **However, this isn't necessary for the core impasse.** Many skeptics might accept non-causal reasons *in principle* (e.g., in idealized Newcomb with a *known* Predictor) but vehemently deny we ever have sufficient grounds to invoke them *in the acausal trade context* due to the epistemological barriers. The "bounded self" skirmish touches this, but often reflects the practical/epistemological concerns: if "I" am dissolved into a cloud of correlations, how can "I" possibly track and act on them coherently?

  ### What Counts as Progress?
  Given this diagnosis, progress requires disentangling the questions and addressing the epistemological/formal substance:

  1.  **Formal Clarification:** Explicitly map the *boundaries* of the formal result. What *specific* correlation structures guarantee cooperation under EDT/FDT? What structures *don't*? Can cooperation emerge under weaker assumptions (e.g., noisy signals, partial alignment)? This addresses the hidden formal layer and challenges proponents to show their models are robust or skeptics to identify fatal flaws. A result showing that cooperation *only* arises under implausibly precise correlation structures would favor skeptics; one showing robustness under plausible large-world noise would favor proponents.

  2.  **Epistemological Bridge-Building:** Shift focus to: *"Under what conditions (if any) could a bounded agent gain sufficient *evidence* or justification to believe the necessary correlations exist for acausal trade to be actionable?"* This directly addresses the skeptics' core practical concern. Progress could look like:
      *   Identifying conceivable (even if currently unavailable) evidence that *would* justify acting on acausal trade (e.g., discovering fundamental symmetries in the universe, identifying unique algorithmic fingerprints).
      *   Formalizing the "cluelessness" problem: How does the *expected value* of acausal cooperation change as our uncertainty about correlation strength/sign increases? At what point does it drop below the threshold for actionable justification?
      *   Exploring "bounded" versions of acausal reasoning: Are there heuristics for leveraging *known, local* correlations (e.g., within a community using similar reasoning tools) that offer a pragmatic middle ground?

  3.  **Reframing the Question:** Consciously separate the discussions:
      *   *"Does EDT/FDT + Large Worlds + Perfect Correlation imply Cooperation?"* (Likely "Yes," proponents win here on formalism).
      *   *"Is EDT/FDT the 'correct' decision theory?"* (Reopens Newcomb/etc., likely a separate stalemate).
      *   *"Can we ever be justified in acting *as if* we are in the scenario described in Question 1?"* (This is the skeptics' battleground – focus here for practical relevance).

  ### Why Progress Might Be Elusive (But Not Impossible)
  *   **The Formal/Epistemic Gap:** Bridging the gap between a clean formal model and the messy reality of knowledge is inherently hard. Proponents might see skeptics as demanding impossible levels of certainty; skeptics see proponents as hand-waving away the core problem.
  *   **Decision Theory Schisms:** Resolving the underlying disagreements about EDT/FDT vs. CDT (e.g., via Newcomb) is a separate, massive debate unlikely to be settled here. Acausal trade often becomes a proxy for this larger war.
  *   **Metaphysical Commitments:** Beliefs about the true nature of the universe (is it infinite? algorithmic? chaotic?) heavily influence whether one finds the large-world assumption plausible or relevant.

  **Conclusion:** The core impasse is not primarily verbal, nor purely bedrock, nor purely factual. It's a structural misalignment: proponents defend the *formal implication* of a model, skeptics attack the *practical justifiability* of acting on that model in reality, compounded by substantive disagreements about how to model correlation realistically and whether we can know enough to act. Progress requires disentangling these threads and focusing efforts on either 1) formal robustness under realistic correlation structures, or 2) the epistemology of justifying action under uncertainty about correlation. Without this separation, the discussion will continue to circle as each side answers a different question.
