prompt: |-
  I run research for a small human rights NGO, and next month our board votes on whether we adopt a written standard for when we'll call something a genocide. I'm the one arguing for it, and for a deliberately wide version: not just the legal definition, but two extra triggers -- deliberate destruction by deprivation (starving a group, cutting off medicine and water) and cultural destruction (language, shrines, archives, cemeteries). My pitch is basically that waiting for a court to say the word means the word arrives years after it could have done anything, and that an org which only uses the term when a prosecutor would is outsourcing its moral vocabulary to institutions built not to use it.

  The board is six people and I know roughly how each of them will come at me: a former ICC defence-side lawyer; the chair, who's family is from a region where this word is fought over and who is allergic to anything that looks like diluting it; a comms director who thinks the word is a fundraising grenade; our field director for the country we'd first apply it to, who has local staff and access to think about; a historian of mass violence who knows the Lemkin-era debates better than I do; and the treasurer, who mainly wants to know what this costs us.

  Give me the Q&A prep sheet -- the objections I'll actually get in that room, not the ones I'd get at a law faculty seminar -- ordered by how much damage they'd do, each phrased the way that member would phrase it, with a two-minute reply and a note on where the reply is soft. Tell me what to concede in the first minute and what to hold. And include the one question I'm hoping nobody asks.
reasoning: |-
  Okay, the user is a researcher at a small human rights NGO preparing to convince their board to adopt a broader definition of genocide. They want a Q&A prep sheet tailored to each board member's likely objections. Let me unpack their scenario.

  First, the user's core argument is about moral urgency vs legal formalism. They want to include deliberate deprivation and cultural destruction as triggers - recognizing that waiting for courts means delayed action when lives are at stake. The NGO's credibility and operational impact hang on this decision.

  Now looking at the board dynamics: six distinct profiles with specialized concerns. The ICC lawyer will fixate on legal precision, while the chair worries about dilution given personal ties to contested terminology. The comms director sees "genocide" as a fundraising double-edged sword, and the field director must protect local staff. The historian brings academic depth to the Lemkin debates, and the treasurer focuses on practical costs.

  The user needs battle-tested responses - not theoretical debates but real-world rebuttals. Prioritization is key: which objections could derail the vote? The chair's "dilution" fear and comms director's "fundraising grenade" concern feel most urgent since they speak to organizational identity and survival. 

  For responses, I'll suggest strategic concessions upfront: yes, this broadens the term beyond courts, and yes it carries risks. But the moral cost of silence is higher. Soft spots include the lack of legal recourse for cultural destruction and unpredictable donor reactions - better to acknowledge than dodge.

  The nightmare question? Probably about applying this retroactively to historical cases the NGO didn't call genocide. That could force uncomfortable reckonings with past positions. Best response: focus on moving forward with better tools.

  Noticing deeper needs too: the user isn't just seeking talking points. They want to equip this NGO to lead morally without self-sabotaging. That means balancing conviction with operational realism - which is exactly where those tailored concessions come in.
answer: |-
  Here’s your Q&A prep sheet, ranked by potential damage to your proposal, with board-specific objections, targeted replies, and vulnerability notes. Focus on **moral urgency**, **operational relevance**, and **institutional integrity** as your pillars.

  ---

  ### **Tier 1: Existential Objections (Could Sink the Vote)**  
  **1. The Chair (Family ties to contested term / "Dilution" fear)**  
  *Objection:* **"If we call everything genocide, the word loses its gravity. My community knows what it means to fight for that label in courts for decades. This feels like cheapening it for headlines."**  
  *Reply (2-min):*  
  > "I hear that. This *strengthens* the term by capturing what courts often miss: starvation as a weapon, erasing a people’s identity. The legal definition excluded cultural genocide because of 1948 politics—not moral weight. We’re not diluting; we’re *reclaiming* Raphael Lemkin’s original vision. Waiting for courts means accepting that politicians veto the word. Our role is to speak truth *before* bodies pile up. We’d apply this only to patterns meeting Lemkin’s threshold: **intent to destroy a group, in whole or in part**—just through more methods."  
  *Soft spot:* Chair may see legal recognition as validation; you reframe "authenticity" as moral clarity vs. bureaucratic delay.  

  **2. Comms Director (Fundraising/Reputational risk)**  
  *Objection:* **"Calling it genocide too early could blow back hard. Donors panic, governments expel us, and we lose access. Or worse—we cry wolf and no one listens when it’s *actually* genocide. What’s the cost-benefit?"**  
  *Reply (2-min):*  
  > "First, we’d adopt strict internal thresholds and vetting before using it publicly. But silence has costs too: when we avoid the word for access, we become complicit in sanitizing crimes. Look at Darfur: 300k dead before the ICC called it genocide. Our credibility comes from courage, not caution. Strategically: ‘genocide’ mobilizes attention *if* backed by evidence. We’d pair it with transparent dossiers. Yes, some doors close—but others open with donors who fund moral leadership."  
  *Soft spot:* "Cry wolf" risk is real. Stress rigorous evidence and phased rollout (e.g., internal use first).  

  ---

  ### **Tier 2: Operational Objections (Threaten Implementation)**  
  **3. Field Director (Staff safety & access)**  
  *Objection:* **"If we call this genocide tomorrow, my team gets kicked out or jailed. Hostile states use ‘genocide’ accusations as propaganda. How do we protect local staff?"**  
  *Reply (2-min):*  
  > "We *never* prioritize terminology over safety. This standard guides *internal* analysis first. Public use requires risk assessment by you and security. But consider: calling starvation ‘famine’ hasn’t kept us safe either. Precision is protection. Naming the crime can shield communities by forcing international scrutiny. We’d start applying it quietly in advocacy with allies—not press releases."  
  *Soft spot:* If access is severed, the policy is theoretical. Concede veto power to field staff on timing.  

  **4. Treasurer (Costs)**  
  *Objection:* **"Lawsuits, donor flight, security upgrades—what’s the price tag? Show me the budget impact."**  
  *Reply (2-min):*  
  > "Minimal new costs. We already document atrocities—this reframes existing evidence. Legal risk is low: we’re not a court, we’re advocates. The real cost is *not* acting: if we ignore cultural destruction, we lose partnerships with indigenous groups. Fundraising-wise, standing firm attracts high-impact donors. I’ll work with you on a risk matrix, but no new hires or lawyers needed."  
  *Soft spot:* Hard to quantify reputational/funding hits. Emphasize "cost of inaction."  

  ---

  ### **Tier 3: Technical Objections (Risks Credibility)**  
  **5. ICC Lawyer (Legal precision)**  
  *Objection:* **"You’re muddying a term with a strict legal meaning. If we call cultural destruction ‘genocide,’ we lose credibility with courts. Why not use ‘crimes against humanity’ or new terms?"**  
  *Reply (2-min):*  
  > "Courts need proof ‘beyond reasonable doubt’; we need early warning. ‘Crimes against humanity’ doesn’t convey *group destruction*—which is what triggers prevention. The law evolves: the Rohingya case at ICJ leaned on cultural erasure. We’re not replacing the law; we’re *urging* it forward. Our role isn’t to mimic prosecutors—it’s to push them."  
  *Soft spot:* Legally, cultural genocide isn’t prosecutable under ICC statute. Stress *advocacy* vs. legal judgment.  

  **6. Historian (Scholarly rigor)**  
  *Objection:* **"Lemkin *did* push for cultural genocide in 1948. But states rejected it to avoid responsibility for colonial crimes. Are we ready to retroactively label settler-colonialism as genocide? Where’s the line?"**  
  *Reply (2-min):*  
  > "We focus on *ongoing* atrocities with documented intent. Retroactive labeling isn’t the goal—prevention is. Lemkin saw culture as core to group survival. By excluding it, states gave themselves an out. We’re reviving his intent: **physical-biological-cultural destruction** as interlinked. We’ll draft clear criteria to avoid overreach."  
  *Soft spot:* Slippery slope to historical revisionism. Hold firm on "present-day intent."  

  ---

  ### **The Nightmare Question (Hope Nobody Asks)**  
  **"If we adopt this, will you apply it retroactively to cases we’ve worked on—like [X]—where we avoided ‘genocide’? Does this mean we failed those victims?"**  
  *Why it’s deadly:* Forces you to condemn past institutional choices, implying cowardice.  
  *Reply (Hold this line):*  
  > "This policy is forward-looking. Past decisions were made with the tools and context then. Evolving standards show progress—not failure. What matters is that *now*, confronted with new atrocities, we refuse to be complicit in silence. We honor past victims by fighting harder for future ones."  
  *Soft spot:* Implies past errors. Deflect to "lessons learned" and future focus.

  ---

  ### **Strategic Concessions in First Minute**  
  1. **"This broadens the definition beyond courts—by design."** *(Concede upfront to disarm legal/historical objections)*  
  2. **"We’ll implement safeguards: internal thresholds, field vetoes, phased rollout."** *(Address safety/funding fears)*  
  3. **"Cultural destruction must be systematic and tied to group eradication—not minor vandalism."** *(Prevent dilution concerns)*  

  ### **Hold the Line On**  
  - **Moral independence:** "We don’t outsource our voice to courts built to move slowly."  
  - **Preventive urgency:** "The word must come *before* the killing peaks, or it’s an epitaph."  
  - **Group destruction intent:** Starvation/cultural attacks aren’t standalone—they must aim to destroy a group.  

  **Final Pitch:** "This isn’t about expanding genocide—it’s about *seeing* it earlier. If we only speak the word when the UN whispers it, we’ve already lost."  

  Good luck. This is a fight for the soul of the org.
