prompt: |-
  Construct a pair of cases that isolate one variable: whether the good at stake is path-dependent — a good that exists only if the undertaking is carried through — or merely outcome-based. Two owners of small businesses must each decide whether to continue an undertaking that is losing money and that, on any ordinary forward-looking reckoning, is worse to continue than to abandon. Both have the same figures, the same options and the same beliefs about the facts, and both say that they have put too much in to stop now. In the first case, continuing is rationally defensible; in the second, it is the textbook fallacy; the two cases are to differ in nothing else. Constraints: realistic setting, no science fiction, one paragraph per case; nothing may turn on the past expenditure being evidence about the future, on its having created a saleable asset, or on reputations, contracts or third parties; and the goods at stake must be ones an ordinary person could genuinely have.

  Then do the check: for each owner, what a strict marginalist says and why, and what an account that permits preferences over paths says and why; which single feature flips the verdict; and what becomes of each case when that feature is removed. Finish with the strongest objection from someone who thinks the case cheats — that attributing a path-dependent preference will license any continuation whatever, so the case proves nothing — and your best reply to it, and with a one-line verdict on whether the case shows the dictum that sunk costs should be ignored to be false or merely badly stated. The case is for a seminar paper arguing that the irrationality of honouring sunk costs is a claim about a restricted class of preferences rather than a theorem of practical rationality, so the verdicts must be derived from the cases and not stipulated. Do not attribute the outcome/path distinction to any author or supply references.
reasoning: |-
  We are constructing two cases that are identical except for one variable: whether the good is path-dependent (exists only if the undertaking is carried through) or merely outcome-based. The key constraint is that the past expenditure (sunk cost) must not be evidence about the future, must not have created a saleable asset, and must not involve reputations, contracts, or third parties. Both owners say they have put too much in to stop now, but in one case continuing is defensible and in the other it is a fallacy.

  Case 1 (rationally defensible continuation):
  A baker has spent months developing a unique cake recipe, investing substantial time and money in failed experiments. Now, she has one final test that, if successful, will yield a perfect recipe that she can use for years. The cost of this test is $500, and the expected future profits from having the recipe are $700. However, the chance of success is only 50%. So the expected monetary value of continuing is $350 (0.5 * $700) minus the $500 cost, which is -$150. On pure outcome-based terms, it's a loss. But the baker feels that if she stops now, all her past efforts will be wasted and she will never have the recipe. The good here is not just the recipe (which is an outcome) but also the experience of having completed the project and the personal satisfaction of not having abandoned it. The path-dependent good is the sense of achievement and closure that comes only if she completes the entire path. Without the final test, the past efforts are not just sunk costs but also a path that is incomplete and thus devoid of meaning. For the baker, the entire path (including the past failures and the final success) is a narrative she values independently of the monetary outcome.

  Case 2 (textbook fallacy):
  A restaurant owner has spent $10,000 on a non-refundable deposit for a special oven that was to be delivered next week. The oven is now obsolete because a new model with better features at the same price has just been announced. He can cancel the order and lose the deposit, or he can take delivery of the old oven and then replace it in a year. The cost of the old oven (including the deposit) is $10,000, but if he takes it, he will have to spend an additional $5,000 on installation and will have higher operating costs (say, $1,000 more per year) than the new model. The new model would cost $15,000 (with no deposit required) and have lower operating costs. The restaurant owner says he has put too much to stop now and decides to take the old oven. This is the fallacy because the sunk $10,000 deposit is irrelevant. The decision should be based on future costs and benefits. If he takes the old oven, he spends $5,000 now and $1,000 extra per year, whereas the new oven costs $15,000 and saves $1,000 per year. The net present value of taking the old oven (relative to the new) is -$5,000 (immediate extra cost) minus the present value of $1,000 per year in extra costs, which is worse than just buying the new oven. The good here is entirely outcome-based: having an oven that works. There is no path-dependent value in having taken the old oven versus the new one.

  Now, the check:

  For the baker (Case 1):
  - Strict marginalist (outcome-based): The marginalist says that the past expenditures are sunk and should be ignored. The decision should be based on future costs and benefits. The future cost of $500 and the 50% chance of $700 benefit yields an expected loss of $150. Therefore, the baker should stop. The marginalist sees the continuation as irrational because it is based on honoring sunk costs.
  - Account with preferences over paths: This view allows that the baker might value the entire path (including the past efforts and the completion) as a good. The path-dependent good is the sense of achievement and closure, which only exists if she completes the test. Therefore, if the baker has a preference for completing the path, then continuing can be rational. The expected utility of continuing includes not only the monetary outcome but also the non-monetary value of completing the project. If that non-monetary value is high enough (say, equivalent to $300 or more), then the total expected utility of continuing could be positive.

  For the restaurant owner (Case 2):
  - Strict marginalist: The marginalist ignores the sunk $10,000 deposit. The decision is between two future streams: 
    Option A (take the old oven): pay $5,000 now and then $1,000 extra per year (relative to the new model).
    Option B (buy the new oven): pay $15,000 now and avoid the extra operating costs.
    The marginalist compares the future costs: Option A has a present value of $5,000 + PV($1,000 per year) and Option B has a present value of $15,000. Since the PV of $1,000 per year is less than $10,000 (unless the time horizon is very long and discount rate low), Option B is better. The sunk cost fallacy is evident because the owner is letting the sunk $10,000 influence the decision about the oven to use.
  - Account with preferences over paths: Even if we allow preferences over paths, there is no path-dependent good in this case. The restaurant owner does not get any special value from having taken the old oven versus the new one. The outcome (having an oven that works) is the same regardless of the path. Therefore, the preference-over-paths account would not justify continuing with the old oven.

  The single feature that flips the verdict is the presence of a path-dependent good (the good that only exists if the entire path is completed) in the first case and its absence in the second.

  What becomes of each case when that feature is removed?
  - In Case 1 (baker): If we remove the path-dependent good (i.e., suppose the baker does not care at all about the narrative of completion and only cares about the monetary outcome), then the expected loss of $150 would make continuing irrational. The case would collapse into a fallacy.
  - In Case 2 (restaurant owner): If we add a path-dependent good (e.g., suppose the owner has a sentimental attachment to the old oven model because it's the one his father used, and he values having the same path as his father), then continuing might become defensible. But without that, it remains a fallacy.

  Strongest objection from a skeptic:
  A skeptic might argue that allowing path-dependent preferences will license any continuation whatever. For example, in any situation where someone has invested a lot and wants to continue, they can just say they have a preference for completing the path. Thus, the distinction becomes vacuous and the rule against sunk costs becomes meaningless.

  Best reply:
  The reply is that not all path-dependent preferences are created equal. We must require that the preference for the path is genuine and not just a post-hoc rationalization for honoring sunk costs. In the baker's case, the path-dependent good (the sense of closure and achievement) is a real psychological good that an ordinary person might have. It is not arbitrarily assigned but is a common human experience. Moreover, the preference must be consistent and not ad hoc. The skeptic's worry is valid, but the solution is not to disallow all path-dependent preferences but to insist on evidence of a genuine, stable, and non-instrumental valuation of the path itself. The baker's case is designed so that the path-dependent good is the only difference and is a realistic, non-monetary good.

  One-line verdict on the dictum "sunk costs should be ignored":
  The case shows that the dictum is merely badly stated because it fails to account for path-dependent preferences; the dictum should be rephrased as "sunk costs should be ignored when the goods at stake are purely outcome-based."
answer: |-
  ### Case 1: Rationally Defensible Continuation  
  A potter has spent two years handcrafting a complex ceramic mural for her studio wall, investing $8,000 in materials and labor. The mural is 90% complete but requires one final costly firing ($1,000) to be finished. If successful (60% chance), it will be a centerpiece she values at $1,500 for its aesthetic and sentimental worth as a symbol of her craft; if it cracks (40% chance), it is worthless. Forward-looking analysis shows an expected loss: (0.6 × $1,500) − $1,000 = −$100. Yet she continues, as abandoning would render her past effort a mere waste of time, whereas completing it—win or lose—provides her with closure and the irreplaceable good of having *seen the project through*, a journey she values intrinsically at $1,200. This path-dependent good exists only if she finishes.  

  ### Case 2: Textbook Fallacy  
  A café owner pre-paid $5,000 non-refundable for a custom espresso machine, now outdated by a superior $6,000 model. Taking delivery requires an extra $1,000 in installation. The old machine’s higher maintenance costs ($300/year for 5 years) make it inferior to the new model (no extra costs). Forward-looking: accepting delivery costs $1,000 now + $1,500 maintenance (PV) = $2,500, versus $6,000 for the better machine—a $3,500 net loss to proceed. Yet he does, lamenting, “I’ve put too much in to quit.” The good—functional espresso—is purely outcome-based; owning the old machine delivers no unique satisfaction beyond its utility, which is worse than the alternative.  

  ### Check  
  **Baker (Case 1):**  
  - *Strict marginalist:* Ignores sunk costs as irrelevant; only future costs/benefits matter. Expected loss of $100 means stop. Continuation is irrational.  
  - *Path-preference account:* Values the non-monetary good of closure/perseverance (worth $1,200) only attainable by finishing. Net expected gain: (0.6 × $1,500 + $1,200) − $1,000 = $1,700 − $1,000 = $700. Continuation is rational.  

  **Café Owner (Case 2):**  
  - *Strict marginalist:* Ignores sunk $5,000. Future cost of proceeding ($2,500) exceeds alternative ($6,000) by $3,500. Stop. Continuation is irrational.  
  - *Path-preference account:* No path-dependent good exists; the espresso outcome is identical regardless of path. Continuation remains irrational.  

  **Single feature flipping verdict:** Presence of a *path-dependent good* (e.g., closure/perseverance) in Case 1 versus its absence in Case 2.  

  **Feature removed:**  
  - Case 1 without path-dependent good: Closure value ($1,200) vanishes. Expected loss of $100 makes continuation irrational (fallacy).  
  - Case 2 with added path-dependent good: If, e.g., completing the delivery path symbolized loyalty to the original supplier (valued at $4,000), continuation could become rational.  

  **Strongest objection and reply:**  
  - *Objection:* "Attributing path-dependent preferences licenses *any* continuation, making the 'fallacy' critique meaningless. E.g., one could always invent a 'journey' value to justify irrational sunk-cost honoring."  
  - *Reply:* Genuine path-dependent preferences are constrained by realism and coherence: they must reflect *non-instrumental* human goods (e.g., closure, integrity) that arise solely from the path, not ad hoc rationalizations. Case 1’s closure is a plausible, discrete psychological good; arbitrarily assigning it to Case 2 would contradict the owner’s actual motivations. The distinction thus isolates defensible preferences without collapsing into permissiveness.  

  **Verdict on the dictum:**  
  The case shows the dictum "sunk costs should be ignored" is **badly stated**—it falsely presumes all goods are outcome-based—rather than false.
