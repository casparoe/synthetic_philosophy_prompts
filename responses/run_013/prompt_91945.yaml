prompt: |-
  I have been arguing with a friend about counterfactual mugging, and I want the argument audited rather than restated. The case as we both accept it: Omega, whose predictions are reliable, flips a fair coin. If it lands tails, Omega asks you for $100. Had it landed heads, Omega would instead have paid you $10,000, but only if it had predicted before flipping that you would pay in the tails case. Omega is honest, and the prediction has already been made. The coin has landed tails, you know this, and Omega asks you for the $100. Nothing you do now alters anything else in the actual world.

  My friend, who favours decision theories that evaluate whole policies rather than individual acts, says that paying is simply the purchase of insurance. The $100 is the premium; what is insured against is your not being in the heads branch; the $10,000 is the payout; Omega is the underwriter; and the coin's having come up tails no more shows the premium to have been wasted than a year without a fire shows a fire premium to have been wasted. Her conclusion is that refusing to pay rests on the same error as regretting an insurance premium in hindsight, and that the unease people feel about the mugging is merely that error in dramatic costume.

  Please audit the analogy.

  1. Give the correspondence table: what plays the role of the premium, the payout, the insured event, the loss, the risk pool, the underwriter, the actuarial probability, and the information available to the payer at the moment of payment.

  2. Say where the mapping breaks, and separate the breaks that matter for her conclusion from those that are decorative.

  3. Press two points in particular. First, in ordinary insurance is there ever a case in which the premium is paid in one state of the world and the payout collected in another, by someone who did not pay? If not, say precisely what the insurance picture assumes about the standpoint from which the two branches are being weighed, and whether that assumption is the very thing at issue between causal and evidential (or policy-evaluating) accounts of rational choice. Second, does the insurance picture require the premium decision to be taken before the outcome is known, and does the shift from acts to policies restore whatever that timing removes?

  4. It has occurred to me that what she describes is less like insurance than like a wager on heads whose stake is collected only when the bet loses. Tell me whether that diagnosis is right, and if it is, whether it helps or damages her case.

  5. Then the verdict: does the analogy support her conclusion, or does it presuppose it? If it fails, propose a better analogy — one that keeps whatever is legitimate in the thought that it can be rational to pay for a state of affairs one knows does not obtain, without assuming that branches one knows are not actual can be treated as risks one bears. Finally, say briefly whether the verdict changes for the blackmail-shaped cases that circulate alongside the mugging, where payment is demanded to avert a threat rather than offered to secure a reward.
reasoning: |-
  Okay, the user is asking me to audit an analogy between counterfactual mugging and insurance. Their friend argues that paying Omega is like buying insurance, where the $100 is a premium that insures against not being in the heads branch. The user wants me to critically evaluate this analogy.

  First, I need to map the insurance concepts to the mugging scenario. Let me create a correspondence table:

  Premium: $100 paid in tails case
  Payout: $10,000 in heads case
  Insured event: Not being in heads branch (i.e., being in tails branch)
  Loss: The $10,000 you would have gained in heads
  Risk pool: Just you across branches
  Underwriter: Omega
  Actuarial probability: 0.5 (fair coin)
  Information at payment: You know it's tails

  Now, where does this analogy break? The key breaks are:
  - In real insurance, the payer and beneficiary are the same person. Here, the "you" in heads who benefits didn't pay the premium.
  - The premium is paid after knowing the "loss" occurred (you know it's tails).
  - The "loss" isn't actually experienced - in tails world, you never had the $10k to lose.

  These are crucial breaks that undermine the insurance analogy because they touch on the core debate between causal and evidential decision theories. The insurance framing implicitly assumes a pre-outcome perspective where both branches are open possibilities, which is exactly what causal decision theorists reject.

  Regarding the user's specific questions:
  1) No, ordinary insurance never has premium paid in one state and payout in another to a different person. This assumes a timeless or pre-commitment perspective - begging the question against causal decision theory.
  2) Yes, insurance requires premium payment before outcome is known. Shifting to policies tries to restore this by evaluating the decision rule in advance, but the mugging forces evaluation after the fact.

  The user's alternative "wager" framing is actually more accurate: paying $100 tails is like placing a bet on heads where you lose $100 if tails, win $10k if heads. But crucially, this wager is only offered when you lose! This damages the friend's case because rational agents don't accept losing bets after knowing the outcome.

  The analogy ultimately presupposes the conclusion - it assumes we should weigh counterfactual branches, which is the very point in dispute. A better analogy might be pre-commitment devices or moral responsibility across possible selves, but these still face the "why care about other branches?" objection.

  For the blackmail variant (pay to prevent Omega harming you in heads), the core issue remains the same. The insurance analogy still fails for identical reasons - you're paying to benefit a counterfactual version of yourself.

  In summary, while clever, the insurance analogy doesn't resolve the philosophical deadlock - it just restates the evidential decision theory position.
answer: |-
  Below is a structured audit of your friend's insurance analogy for Counterfactual Mugging (CM), addressing your specific points. The analogy is clever but ultimately circular and misleading in critical ways that undermine her conclusion.

  ---

  ### **1. Correspondence Table**
  | **Insurance Concept**      | **Counterfactual Mugging Equivalent**         |
  |----------------------------|-----------------------------------------------|
  | **Premium**                | $100 paid in the tails branch.                |
  | **Payout**                 | $10,000 received in the heads branch.         |
  | **Insured Event**          | "Not being in the heads branch" (i.e., being in tails). |
  | **Loss**                   | The $10,000 you *would have gained* in heads (a counterfactual loss). |
  | **Risk Pool**              | Your "other selves" across branches (only you exist in both). |
  | **Underwriter**            | Omega (sets terms and pays/collects).         |
  | **Actuarial Probability**  | 0.5 (fair coin).                              |
  | **Information at Payment** | You know the coin is tails (insured event occurred). |

  ---

  ### **2. Where the Mapping Breaks**
  - **Critical Breaks (Undermine Her Conclusion):**  
    1. **Beneficiary-Payer Separation:** In insurance, the entity paying the premium *is the same entity* that suffers the loss and receives the payout. In CM, the "you" in heads (who benefits) never paid anything, and the "you" in tails (who pays) gains nothing. The analogy assumes you are a single timeless agent, but this is the crux of the dispute between decision theories.  
    2. **Loss Is Counterfactual:** Real insurance covers actual losses (e.g., fire destroys your house). In CM, the "loss" is not experienced—it's the absence of a gain in another branch. Paying $100 to "insure" a gain you know you never had is incoherent under causal decision theory (CDT).  
    3. **Premium Timing:** Insurers require payment *before* the outcome is known. Here, you pay *after* knowing the "insured event" (tails) occurred. This retroactivity invalidates insurance logic.  

  - **Decorative Breaks (Irrelevant to Conclusion):**  
    - No profit motive for Omega (decorative; doesn’t affect rationality).  
    - No risk pool (decorative; self-insurance exists).  

  ---

  ### **3. Pressing Your Two Points**
  #### **First Point: Payer/Beneficiary Separation**  
  - **Ordinary Insurance:** No, premiums and payouts *always* involve the same entity. If Alice pays premiums, Alice (or her estate) receives the payout.  
  - **Insurance Picture’s Assumption:** The analogy assumes a **pre-outcome, timeless perspective** where you weigh both branches as "risks" you face. This is the core tenet of **evidential decision theory (EDT)** or "policy-based" views (e.g., UDT), which treat your decision as evidence about *all* branches. CDT rejects this, arguing rationality depends only on *actual* causal consequences (which here are purely negative: losing $100).  
  - **Conclusion:** The analogy **presupposes EDT/policy-based reasoning**—the very stance your friend defends—and thus cannot resolve the dispute.  

  #### **Second Point: Timing and Policy Shifts**  
  - **Insurance Requires Advance Payment:** Yes—premiums are paid when the outcome is unknown. CM violates this: you know tails occurred *before* paying.  
  - **Does Shifting to Policies "Restore" Timing?**  
    - **Her Claim:** Evaluating "policies" (e.g., "always pay") *before* the coin flip mimics insurance timing.  
    - **Problem:** This works only if you precommit. In CM, you face Omega *after* the flip. Reframing it as a "policy" smuggles in the pre-outcome perspective, again assuming EDT. CDT argues that *at the moment of choice*, the only rational consideration is the actual outcome (tails), where paying loses $100 with no benefit.  
    - **Verdict:** Policy-based reasoning **artificially restores timing** by ignoring your current knowledge. This is question-begging.  

  ---

  ### **4. Your Diagnosis: Is It a Wager?**  
  Your diagnosis is **correct**. The transaction resembles:  
  > *A bet on heads where you pay $100 only if tails occurs, and win $10,000 only if heads occurs.*  

  - **Why This Damages Her Case:**  
    - Rational agents don’t accept **known-losing bets**. At payment time, you know tails occurred (you "lost"), so paying $100 is equivalent to honoring a bet after seeing the outcome.  
    - Insurance is about *risk mitigation*; this is *speculation*. Framed as a wager, paying post-outcome is transparently irrational under CDT. Her insurance analogy obscures this by recasting a losing bet as "premium."  

  ---

  ### **5. Verdict and Better Analogy**  
  - **Verdict:** The analogy **presupposes her conclusion** (that EDT/policy-based reasoning is correct) and fails to justify it. It ignores:  
    - The payer/beneficiary mismatch.  
    - The counterfactual (non-actual) nature of the "loss."  
    - The problem of paying *after* knowing the outcome.  

  - **Better Analogy: Precommitment Devices**  
    Imagine installing software on your computer that automatically pays $100 to Omega if it detects a tails outcome. You set this up *before* the coin flip because:  
    - You want your "future self" in tails to pay so your "future self" in heads gets $10,000.  
    - **Why it works:**  
      - Legitimizes "caring" about other branches via **binding commitments**.  
      - Avoids assuming branches are "risks" by instead framing it as **moral responsibility to your other possible selves** (a UDT-like view).  
      - Acceptable even to some CDT agents if precommitment is feasible.  
    - **Limitation:** Still relies on valuing counterfactual outcomes, but grounds it in pre-decision agency.  

  - **Blackmail Variant (e.g., "Pay or Omega harms heads-you"):**  
    The verdict **does not change**. The insurance analogy breaks identically:  
    - "Premium" ($100 paid in tails) "insures" against harm in heads, but tails-you pays while heads-you benefits.  
    - At payment, you know tails is actual, so no *actual* harm is averted.  
    - Better analogy: A precommitment to protect other selves (e.g., a dead-man's switch punishing blackmailers).  

  ---

  ### **Summary**  
  Your friend's insurance analogy fails because it assumes the EDT/policy perspective it aims to defend. The core issue is whether rationality permits sacrificing actual resources for counterfactual gains. The analogy masks this by misrepresenting a known-losing bet as "insurance," sidestepping the epistemic timing problem. A precommitment device offers a more honest framing but still requires accepting that rational agents can care about non-actual branches—a stance CDT explicitly rejects. The debate remains unresolved, but the insurance analogy does not advance it.
