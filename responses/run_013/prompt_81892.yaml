prompt: |-
  i want five jokes about convention — Lewis-style, the coordiantion kind, where what makes everyone do it is that everyone expects everyone else to do it, and the particular thing they do is arbitrary (drive on this side, nod this way, stand on this step of the escalator). Not jokes that just say "society is made up, lol" — the humour has to come from the machinery actually working, so that someone who's read the real stuff laughs rather than winces. And don't lean on examples I'd have to go look up.

  Give me exactly five, numbered, a sentence or two each, no intro, no outro, and no explaining the punchline afterwards. Spread them across the following, roughly one each:

  - a joke whose punchline turns on the gap between everyone knowing something and everyone knowing that everyone knows it — the thing that's meant to be doing the real work;
  - a joke about a convention that's genuinely load-bearing and has zero justification, where "we've always done it this way" turns out to be a description of the mechanism rather than a reason;
  - a joke about the awkward moment a convention becomes a norm — when breaking it stops being merely confusing and starts earning you side-eye, and whether the side-eye does anything the coordination wasn't already doing;
  - a joke about a convention changing or dying out, the kind of change that can't happen one person at a time, where the replacement wins because it was first or salient rather than because it was better;
  - one joke about a convention you invent yourself. It has to be one that could actually arise: it should solve a real coordination problem, and what everyone does should be arbitrary, i.e. a different arbitrary thing would have served just as well.

  Keep each short enough to tell out loud at a party, and make sure the last one couldn't be mistaken for a real convention that already exists.
reasoning: |-
  Okay, the user wants five Lewis-style convention jokes. Let me start by recalling what David Lewis's conventions are—they're solutions to coordination problems where everyone follows a rule because they expect others to, and the rule itself is arbitrary. The jokes need to highlight the mechanics of this, not just "society is arbitrary."

  First, the user specified five distinct scenarios. Let me break them down one by one. The first joke needs to play on the gap between common knowledge and mutual knowledge. Maybe a situation where everyone knows something but doesn't realize others know it too. Like a nod direction—everyone does it but thinks others don't notice. The punchline could be confusion when someone actually acknowledges it.

  Second joke: a load-bearing convention with no justification. Think of something essential but arbitrary, like which side to pass someone. The humor comes from the realization that "we've always done it this way" is the only reason, and changing it would cause chaos. The office hallway scenario fits here—people stick to the left without questioning why, and it just works.

  Third joke: the transition from convention to norm. Here, breaking it should start getting social disapproval. Maybe a queue where leaving a gap is fine until someone gets glared at for skipping. The side-eye adds social pressure, but the coordination still works. Need to show that the glare is redundant but happens anyway.

  Fourth joke: convention change that can't happen incrementally. Like switching escalator standing sides. The new rule wins because it's promoted, not because it's better. The humor is in the temporary chaos and the arbitrary reason for the change—a marketing campaign.

  Fifth joke: invent a new convention. It has to solve a real coordination problem, be arbitrary, and not exist. The subway seat shuffle—everyone shifts to one side to make room, triggered by a specific gesture. The gesture itself is arbitrary; any signal could work. Important to ensure it's not a real thing, so avoiding known examples.

  I need to check each joke for clarity and brevity. Each should be a sentence or two, no explanations. Make sure the fifth is original—maybe a unique gesture like the "brow-wipe" to prevent it from being real. Also, avoid any need for prior knowledge. The examples should be everyday situations: hallways, queues, elevators, escalators, subways. That keeps them accessible. Finally, ensure the humor comes from the coordination mechanics working as described, not just randomness. Testing each punchline to see if it lands the intended point without over-explaining.
answer: |-
  Here are five Lewis-style convention jokes:

  1.  Everyone in town knew to nod upwards when passing acquaintances, but nobody knew *why*; the confusion peaked when two lifelong friends finally admitted they each thought the other had started it decades ago.
  2.  The entire office building silently coordinated passing on the left in hallways; it functioned flawlessly until the new hire asked *why*, causing a week of near-collisions as people suddenly realized the rule had no reason beyond its own existence.
  3.  At the bakery, leaving exactly one-person's gap in the queue was fine, just eccentric; but skip that gap, and the quiet side-eyes became fierce, even though the queue kept moving just fine without the unspoken rule.
  4.  The city council, baffled by escalator stand-right chaos, declared "Stand Left, Walk Right"; the ensuing weeks were pandemonium as half followed the old rule, half the new, until sheer repetition made the council's arbitrary slogan stick.
  5.  Commuters on the crowded 8:15 train solved seat shuffles with the "brow-wipe convention": seeing someone subtly wipe their brow signaled everyone to simultaneously shift one seat left, creating space through perfectly coordinated, utterly arbitrary gesture-based movement.
