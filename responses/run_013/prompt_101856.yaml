answer: |-
  This is a brilliantly articulated observation about a deep conceptual knot in perception science. You've hit on a core philosophical and methodological divide, and while there isn't one single, universally accepted term for *exactly* this fork, the best-established name capturing its essence is the **"Perceptual Reality Monitoring" problem** or the **"Time of Illusion" question**. More specifically, it's often framed as a debate about **Early vs. Late Selection** or **Pre-Phenomenal vs. Post-Phenomenal Completion/Filling-In**.

  Here's a breakdown of the distinction, its name(s), what turns on it, and its edges:

  1.  **The Core Distinction & Its Names:**
      *   **Pre-Phenomenal Completion (Early Selection):** The brain performs its interpretation, inference, and "filling-in" *before* (or as an integral part of) constructing the conscious perceptual experience. What you *experience* directly already contains the motion, the color change, or the filled-in blind spot. The illusion *is* the experience. (Terms: Pre-conscious binding, perceptual inference, constructive perception, neural filling-in).
      *   **Post-Phenomenal Completion/Inference (Late Selection):** The initial conscious experience is sparse, ambiguous, or closely tied to the raw sensory input (the two flashes, the gap in the visual field). The brain *then*, very rapidly and automatically, makes an inference *about* that experience or edits the memory trace *based* on that experience (plus context, expectation, etc.), leading to the *report* of a richer experience (motion, color change, filled spot). You don't consciously experience the filling-in itself; you experience the ambiguity and then *infer* the continuous event. (Terms: Cognitive inference, judgment, post-diction, memory revision, amodal completion).

  2.  **Why "Perceptual Reality Monitoring" Fits Well:**
      This term, borrowed from metacognition and memory research, directly addresses the question: *When and how does the brain determine what was "really there" in the external world based on ambiguous or incomplete sensory signals?* Does this determination happen *as part of building the perception* (pre-phenomenal), or is it a rapid *interpretation applied to a simpler perception* (post-phenomenal)? The "monitoring" aspect highlights the brain's attempt to discern reality, and the "perceptual" aspect locates the ambiguity in the sensory input itself. The "Time of Illusion" question directly targets the critical timing issue you identified.

  3.  **What Turns On It? Why Argue if Predictions Match?**
      While behavioral reports *seem* identical, the stakes are significant for our understanding of:
      *   **The Nature of Consciousness:** What *is* the content of conscious experience? Is it inherently rich and constructed, or sparse and interpreted? Does consciousness include inferences, or are inferences *about* consciousness?
      *   **The Neural Correlates of Consciousness (NCC):** Which brain processes *are* the conscious experience? Processes generating the filled-in content, or processes generating the sparse input that later gets interpreted? Finding the NCC requires knowing *when* the conscious content arises.
      *   **The Reliability of Introspection:** Can we trust our first-person reports about *what we experienced*? If post-phenomenal inference happens seamlessly, our reports might reflect the inference, not the raw experience. This challenges phenomenology as a scientific method.
      *   **The Computational Goal of Perception:** Is perception primarily about constructing a detailed internal model of the world (favoring pre-phenomenal), or about efficiently guiding action based on sparse signals that are interpreted as needed (favoring post-phenomenal)?
      *   **Theoretical Frameworks:** It pits predictive processing/active inference theories (often leaning pre-phenomenal, where prediction *is* perception) against more sensation-based or enactivist approaches (often more compatible with post-phenomenal interpretation).

  4.  **How It Differs from Simple Underdetermination:**
      *   **Specificity:** It's not just *any* two theories making the same predictions. It's a *specific pattern* recurring across diverse illusions (motion, color, filling-in, change blindness, etc.) focused on the *temporal relationship* between neural processing, conscious experience, and report.
      *   **The "Experience" Black Box:** The core unknown is the *subjective experience itself*, which is fundamentally private. We only have access to reports *about* it. This makes the "fork" particularly intractable and philosophically charged compared to debates where the phenomenon is more directly observable (e.g., two theories of gravity predicting planetary motion – we can observe the planets).
      *   **Metacognitive Layer:** It inherently involves questions about how we *know* what we experience, blurring the lines between perception, memory, and belief formation in a way most underdetermined theories do not.

  5.  **Edges and Limitations of the Distinction:**
      *   **Not Always a Strict Dichotomy:** The reality is likely a spectrum or involves multiple stages. Some filling-in might be pre-phenomenal (e.g., basic contour interpolation), while more complex interpretations might be post-phenomenal.
      *   **"Experience" is Slippery:** Defining the precise moment or content of "experience" is notoriously difficult. Does "experience" include fleeting, unattended sensations? The distinction relies on this fuzzy concept.
      *   **Advanced Methods Offer Glimpses:** Techniques like rapid masking, binocular rivalry, high-temporal-resolution neuroimaging (EEG/MEG), and clever response-time paradigms *can* sometimes provide indirect evidence favoring one timing over the other in specific illusions by probing the *latency* or *stability* of the reported effect. For example, if the color change report depends on processing occurring *after* the motion signal would have been generated, it might favor post-phenomenal inference.
      *   **Beyond Illusions:** The fork applies to normal perception too (e.g., do we "see" the whole cat behind the fence, or infer it based on visible parts?). Illusions just make the ambiguity stark.

  **In Summary:**

  You've identified the **Perceptual Reality Monitoring Problem** or the **Time of Illusion Question**, characterized by the **Pre-Phenomenal vs. Post-Phenomenal Completion/Inference** fork. While behavioral evidence is often underdetermined, the stakes are high for understanding consciousness, neural processing, and introspection. Arguments persist because the distinction probes the fundamental nature and timing of subjective experience itself – a "black box" we can only access indirectly through report. It's a specific, recurring pattern in perception science, distinct from general underdetermination due to its focus on the elusive timing and content of conscious awareness relative to neural events and reporting processes.
