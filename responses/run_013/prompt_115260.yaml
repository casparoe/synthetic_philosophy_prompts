prompt: |-
  I'm a third-year undergraduate taking a philosophy of biology module, and I've been set a long essay that has to do something more constructive than adjudicate. For six weeks our seminar has been divided over the two dominant accounts of biological function: the etiological (selected-effects) account, on which a trait's function is fixed by the history of selection that established it, and the causal-role (systemic) account, on which a trait's function is whatever contribution it makes to the capacities of the system containing it. The two camps have been talking past each other in a way I now find tedious. The etiologists complain that the systemic account cannot distinguish a heart's pumping blood from the noise it makes, and cannot explain why a malformed heart is malfunctioning rather than merely differently constituted; the systemic camp replies that the etiological account makes function ascription impossible for any trait without a selection history and smuggles a normative notion of proper function out of purely descriptive facts. My supervisor's suggestion was that I stop taking sides and instead produce the document the two sides would have to sign if they were locked in a room together. So please draft the joint statement of an adversarial collaboration between a committed etiologist and a committed causal-role theorist — a text both could put their names to, with the residual disagreement made as exact as possible.

  I need the following. First, a numbered section of agreed claims: what phenomenon both accept needs explaining, which verdicts on particular cases both accept (a healthy heart, a by-product that contributes nothing to fitness, a trait currently aiding survival but never selected for that role, and a trait whose current contribution differs from the one it was selected for); what each account concedes the other explains well; and what any adequate account must deliver. Second, the disagreements, each given in two forms — a neutral third-person formulation, and then the wording each side would use for its own position, such that neither could reasonably object to how their view has been stated. Third, the cruxes: the sub-questions such that settling one would move at least one side. Please work these cases in as material for the cruxes, since they are the ones our seminar could not resolve: a human gene expressed in a yeast cell that rescues a mutant unable to synthesise a particular metabolite, where the question is whether the human gene has the function of making that metabolite in the yeast and whether it had that function before anyone put it there; a pig heart transplanted into a human recipient, where the type has a selection history of circulating blood but the token organ has no history in that kind of system; a gene that has arisen de novo and now contributes to fitness; and a trait fixed by drift that presently aids survival. For each crux, state a case or argument both sides accept as bearing on it, and record each side's prediction about how it comes out, written down in advance. I would also like you to say whether any part of this dispute is merely verbal — in particular whether the two camps are answering different questions rather than giving rival answers to one — and, if so, which part and why; and what each side would count as evidence or argument against its own account, together with whether there is anything both would agree would actually move the debate, or whether the disagreement is in principle unresolvable given what each takes the explanandum to be. Format it as a numbered agreed-claims section, then a disagreements table with a column for the neutral formulation and a column for each side's own wording, then a crux-by-crux section with the shared case and the two recorded predictions. No bibliography or references are needed — I need the document itself, not a reading list — and please write it in British English.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between an etiological theorist (E) and a causal-role theorist (C). The document must be in British English and structured as follows:

  1. **Agreed Claims**: Numbered list of points both sides accept.
  2. **Disagreements**: A table with three columns: 
     - Neutral third-person formulation.
     - Etiologist's own wording.
     - Causal-role theorist's own wording.
  3. **Cruxes**: For each unresolved case, state:
     - The case description (shared by both).
     - A case or argument both accept as bearing on it.
     - E's and C's recorded predictions.

  Additionally, we address:
  - Whether any part is merely verbal (different questions vs rival answers).
  - What each side would count as evidence against their own account.
  - Whether there is anything both agree would move the debate or if it's unresolvable.

  ---

  **Joint Statement: Adversarial Collaboration on Biological Function**

  **1. Agreed Claims**

  1.1. **The Phenomenon to be Explained**: Both parties agree that the concept of "function" in biology is used to pick out certain causal contributions of traits within organised systems (such as organisms, cells, or ecosystems) and that this concept is central to biological explanation, especially in fields like physiology, evolutionary biology, and medicine. The term "function" is often used normatively (e.g., in assessing malfunction) and descriptively (e.g., in explaining how a system works).

  1.2. **Shared Verdicts on Cases**:
     - **Healthy Heart**: Both agree that in a typical mammal, the heart has the function of pumping blood. E explains this by the heart's selection history; C explains it by the heart's current causal role in circulating blood and sustaining life.
     - **By-product with No Fitness Contribution**: Both agree that a trait like the human chin (often considered a by-product of selection for other facial features) has no function if it contributes nothing to fitness and plays no significant causal role in any system. E would say it has no selected function; C would say it plays no systemic role that is functionally relevant.
     - **Trait Currently Aiding Survival but Never Selected for That Role**: Both agree that if a trait (e.g., a certain feather colour in birds) arises and currently aids survival (e.g., by camouflage) but was not selected for that role (e.g., it arose by drift and the camouflage effect is new due to environmental change), then E would deny it has a function (since no selection history for that effect), while C would ascribe a function based on its current causal contribution. However, both agree that such cases exist and that their accounts yield different verdicts.
     - **Trait with Current Contribution Differing from Historical One**: Both agree that if a trait was selected for one effect (e.g., feathers for thermoregulation) but now contributes to another (e.g., flight), then E would say the function is the historical one (thermoregulation) unless there has been selection for the new effect, while C would say the function is the current one (flight) if it is a key contribution to the system's capacities. Both acknowledge that this is a point of divergence.

  1.3. **Concessions**:
     - E concedes that the causal-role account is superior for analysing functional organisation in systems without a clear selection history (e.g., in artificial life simulations, engineered systems, or during the early stages of evolutionary transitions) and for providing a framework for functional analysis in physiology and biochemistry that does not require historical investigation.
     - C concedes that the etiological account is superior for explaining normativity (e.g., why a malformed heart is malfunctioning) and for grounding function ascriptions in evolutionary history, which is particularly useful in fields like evolutionary biology and paleontology.

  1.4. **Requirements for Any Adequate Account**: Both agree that an adequate account of biological function must:
     - Explain the normative dimension (i.e., the possibility of malfunction).
     - Be applicable to a wide range of biological traits, including molecular, physiological, and behavioural traits.
     - Be consistent with the practices of biological sciences (e.g., not rendering most function ascriptions in physiology or medicine illegitimate).
     - Avoid circularity or triviality (e.g., not making every causal effect a function).

  **2. Disagreements**

  | Neutral Formulation                                                                                                | Etiologist's Own Wording                                                                                                                                 | Causal-Role Theorist's Own Wording                                                                                                                             |
  |--------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | The conditions under which a trait can be said to have a function.                                                 | A trait has a function only if its presence can be explained by the action of natural selection for that function.                                        | A trait has a function if it makes a causal contribution to the capacities or maintenance of a containing system, regardless of its evolutionary history.       |
  | What grounds the normativity of function ascriptions (i.e., the distinction between functioning and malfunctioning). | The normativity of function stems from the trait's evolutionary history: malfunction occurs when the trait fails to perform the activity for which it was selected. | The normativity of function stems from the causal role the trait typically plays in sustaining the organisation of the system: malfunction occurs when the trait fails to perform its typical causal role. |
  | Whether function ascriptions require historical facts.                                                             | Function ascriptions are inherently historical: without a selection history, a trait cannot have a biological function.                                   | Function ascriptions are ahistorical: they depend only on the current causal structure of the system.                                                          |
  | The relationship between function and fitness.                                                                     | A function is an effect that contributed to fitness in the evolutionary past and explains the trait's presence.                                           | A function is an effect that currently contributes to the fitness or persistence of the system, but this contribution need not have been selected for.          |

  **3. Cruxes**

  For each unresolved case, we present the scenario, a shared case/argument both accept as relevant, and the recorded predictions of E and C.

  3.1. **Human Gene in Yeast**
     - **Case**: A human gene is expressed in a yeast cell that has a mutation preventing synthesis of a metabolite. The human gene produces the metabolite, rescuing the mutant yeast. Did the human gene have the function of making that metabolite (a) in the yeast after insertion, and (b) before it was inserted into the yeast?
     - **Shared Argument**: Both agree that the gene's causal role in the yeast system is clear: it produces the metabolite. Both also agree that the human gene, in its original context, may have had a different function (if any) based on human biology.
     - **E's Prediction**: 
       - (a) After insertion: No, because there is no selection history for this gene in yeast. The gene's effect is merely causal and not a function.
       - (b) Before insertion: No, because in humans, this gene was not selected for producing this metabolite in yeast.
     - **C's Prediction**: 
       - (a) After insertion: Yes, because in the yeast system, the gene now plays a causal role in producing the metabolite, which is necessary for the system's viability.
       - (b) Before insertion: No, because before insertion, the gene was not part of a yeast system and did not play that role in any relevant system.

  3.2. **Pig Heart Transplanted into Human**
     - **Case**: A pig heart is transplanted into a human recipient. Pig hearts have a selection history of circulating blood in pigs. The token pig heart has never been part of a pig's circulatory system (e.g., it was grown in vitro) and is now placed in a human.
     - **Shared Argument**: Both agree that the heart is now causally contributing to blood circulation in the human. Both also agree that the heart's type (pig heart) has a selection history in pigs.
     - **E's Prediction**: The heart has the function of circulating blood because it is a token of a type that was selected for that effect in pigs. The token's lack of history in a pig is irrelevant; what matters is that it is an instance of a type with that selection history.
     - **C's Prediction**: The heart has the function of circulating blood in the human system because it is currently playing that causal role. The selection history in pigs is irrelevant to its current function in the human body.

  3.3. **De Novo Gene**
     - **Case**: A gene arises de novo (not from duplication or mutation of an existing gene) and currently contributes to the fitness of the organism (e.g., by producing a protein that enhances survival).
     - **Shared Argument**: Both agree that the gene is new and has no selection history for any effect. Both also agree that it currently has a beneficial effect.
     - **E's Prediction**: The gene does not yet have a function because there has been no selection for the beneficial effect. It may acquire a function in the future if it is selected for that effect.
     - **C's Prediction**: The gene has a function now because it currently plays a causal role in enhancing the organism's fitness or capacities.

  3.4. **Trait Fixed by Drift that Presently Aids Survival**
     - **Case**: A trait (e.g., a particular allele) becomes fixed in a population by genetic drift (not selection). Later, due to environmental change, the trait aids survival (e.g., by conferring resistance to a new pathogen).
     - **Shared Argument**: Both agree that the trait was not selected for its current effect (since it was fixed by drift) and that it currently contributes to fitness.
     - **E's Prediction**: The trait does not have a function because its fixation was not due to selection for any effect. Its current benefit is fortuitous and not a function.
     - **C's Prediction**: The trait has a function because it currently plays a causal role in aiding survival.

  **4. Analysis of the Dispute**

  - **Verbal Dispute?** 
    Part of the dispute is merely verbal: the two camps are, to some extent, answering different questions. The etiological account is primarily concerned with explaining *why a trait exists* (its evolutionary raison d'être), while the causal-role account is concerned with explaining *how a system currently works*. However, the overlap in terminology (both using "function") creates a substantive disagreement about which concept is more fundamental or appropriate for biology. The core disagreement is not merely verbal because the accounts yield conflicting verdicts in cases like the de novo gene or the drifted trait, and they disagree on whether history is essential to the concept.

  - **Evidence Against Their Own Account**:
    - **Etiologist**: Would consider it evidence against their account if it were shown that normativity can be grounded without history (e.g., in a system with no selection history) or if function ascriptions in biology were routinely made without any reference to history (e.g., in synthetic biology). They would also be moved if a clear case of malfunction were found in a trait with no selection history.
    - **Causal-Role Theorist**: Would consider it evidence against their account if it were shown that causal-role function cannot explain malfunction (e.g., if a trait playing a novel beneficial causal role in a damaged system were called malfunctioning) or if it were proven that all coherent function ascriptions in biology implicitly rely on evolutionary history.

  - **Resolvability**:
    Both sides agree that the dispute is not in principle unresolvable. Key evidence would come from:
    - Empirical studies of how biologists use the term "function" (e.g., in genomics or physiology) and whether they invoke history.
    - Conceptual analysis of normativity: whether a purely causal account can ground "ought" (e.g., that a heart ought to pump blood) without history.
    - Cases of novel systems (e.g., artificially created life forms) where selection history is absent but functional language is used.

  However, given the differing explananda (why a trait exists vs. how a system works), complete convergence may be unlikely. The adversarial collaboration might instead clarify the contexts in which each account is appropriate.

  ---
  This document represents a joint statement to which both parties have contributed and agreed, setting out areas of consensus, precise disagreements, and testable predictions for future resolution.
answer: |-
  ### Joint Statement of Adversarial Collaboration:  
  **Etiological (Selected-Effects) and Causal-Role (Systemic) Accounts of Biological Function**

  ---

  #### 1. Agreed Claims  
  Both signatories endorse the following as foundational common ground:  

  1.1. **The Explanandum**:  
  Biological function ascriptions must account for:  
  - The **normative dimension**: Why some traits can be "malfunctioning" (e.g., a diseased heart) rather than merely atypical.  
  - The **explanatory role**: How function statements explain a trait’s presence or maintenance in a system.  
  - The **selectivity problem**: Why only *some* causal effects of a trait are deemed functional (e.g., a heart’s blood-pumping, not its noise).  

  1.2. **Shared Verdicts on Cases**:  
  - **Healthy heart**: Both agree it has the function *to pump blood*.  
  - **Fitness-neutral by-product** (e.g., the human chin as a developmental by-product of jaw evolution): Both agree it has *no function*.  
  - **Exaptation** (e.g., feathers selected for thermoregulation now used for flight): Both agree the *historical function* (thermoregulation) and *current causal contribution* (flight) differ, but dispute which is "the function."  
  - **Newly beneficial trait without selection history** (e.g., a mutation arising post-environmental shift that aids survival): Both agree it currently enhances fitness but dispute whether it has a function *yet*.  

  1.3. **Concessions to the Opposing Account**:  
  - The **etiological account** concedes the causal-role account better explains function in:  
    - Systems lacking clear selection histories (e.g., synthetic biology constructs, ecosystems).  
    - Contexts where trait contribution is analysed synchronically (e.g., physiology, biochemistry).  
  - The **causal-role account** concedes the etiological account better explains:  
    - Normative malfunction (e.g., why a diseased heart is defective).  
    - Cases where historical origins are central (e.g., vestigial traits).  

  1.4. **Requirements for Any Adequate Account**:  
  An acceptable theory must:  
  - Resolve the selectivity problem.  
  - Accommodate normative judgments (malfunction).  
  - Be empirically applicable across biological subfields.  
  - Avoid tautology (e.g., defining function merely as "whatever a trait does").  

  ---

  #### 2. Disagreements  
  The table below formulates disagreements neutrally, followed by each camp’s self-description. Each wording is acceptable to the respective party.  

  | Neutral Formulation | Etiologist’s Own Wording | Causal-Role Theorist’s Own Wording |
  |---------------------|--------------------------|-----------------------------------|
  | **What fixes a trait’s function?** | "A trait’s function is determined solely by the effect for which it was naturally selected in its evolutionary history." | "A trait’s function is determined solely by its current causal contribution to the capacities of the system it inhabits." |
  | **How is normativity grounded?** | "Malfunction is failure to perform the historically selected effect, irrespective of current utility." | "Malfunction is failure to perform a typical causal role in the current system, irrespective of historical origins." |
  | **Is selection history necessary for function?** | "Selection history is necessary: no function exists without a history of selection for that effect." | "Selection history is unnecessary: function arises from current systemic organisation alone." |
  | **Can novel traits have functions?** | "A novel trait acquires a function only after selection acts upon it; current benefits alone are insufficient." | "A novel trait has a function if it currently contributes to system-level capacities; selection history is irrelevant." |

  ---

  #### 3. Cruxes  
  For each unresolved case, both parties accept the *description* of the scenario and the *relevance* of the shared argument. Predictions are recorded in advance.  

  3.1. **Human Gene in Yeast Cell**  
  - **Case**: A human gene inserted into mutant yeast rescues a metabolic deficiency. The gene had no prior interaction with yeast.  
  - **Shared Argument**: Both agree that causal role and history are dissociated here.  
  - **Predictions**:  
    - **Etiologist**: "The gene has *no function* in yeast. Its effect is accidental; no selection history exists for this role. Pre-insertion, it lacked this function."  
    - **Causal-Role Theorist**: "Post-insertion, the gene *has the function* of metabolite synthesis. Pre-insertion, it lacked this function (no causal role in yeast)."  

  3.2. **Pig Heart Transplanted into Human**  
  - **Case**: A pig heart (type selected for blood circulation in pigs) is transplanted into a human. This token heart has no prior history in *any* system (e.g., lab-grown).  
  - **Shared Argument**: Both agree token traits derive function from type history (etiology) or current context (causal role).  
  - **Predictions**:  
    - **Etiologist**: "The heart *retains its function* to circulate blood. Its selection history (as a pig heart) is inherent."  
    - **Causal-Role Theorist**: "The heart *gains the function* to circulate blood. Its current role in the human system overrides type history."  

  3.3. **De Novo Gene Currently Aiding Fitness**  
  - **Case**: A gene arises *de novo* (no prior selection) and immediately enhances survival.  
  - **Shared Argument**: Both agree the trait has no selection history but has current utility.  
  - **Predictions**:  
    - **Etiologist**: "The gene has *no function*. Utility without selection is insufficient."  
    - **Causal-Role Theorist**: "The gene *has a function*; its current contribution suffices."  

  3.4. **Drift-Fixed Trait with Current Benefit**  
  - **Case**: A trait fixed by genetic drift (no selection) later aids survival due to environmental change.  
  - **Shared Argument**: Both agree fixation was non-selective but current effects are beneficial.  
  - **Predictions**:  
    - **Etiologist**: "The trait has *no function*. Drift alone cannot establish function."  
    - **Causal-Role Theorist**: "The trait *has a function*; its current causal role is definitive."  

  ---

  #### 4. Analysis of the Dispute  

  - **Verbal Disagreement?**  
    The dispute is **partially verbal**: the camps address distinct (but overlapping) questions.  
    - **Etiologists** answer: "Why is this trait *here*?" (trait existence).  
    - **Causal-role theorists** answer: "What does this trait *do*?" (systemic operation).  
    This divergence explains why core cases (e.g., exaptation) yield different verdicts. However, the disagreement is **substantive** regarding normativity: whether "proper" function requires history or current contribution.  

  - **Evidence Against Own Account**:  
    - **Etiologist** would reject their account if:  
      - Function ascriptions in ahistorical systems (e.g., synthetic biology) were empirically indispensable *and* non-arbitrary.  
      - Normativity could be grounded without history (e.g., a "malfunctioning" trait with no selection history).  
    - **Causal-Role Theorist** would reject their account if:  
      - The selectivity problem remained unsolved (e.g., if "causal role" cannot distinguish function from accident).  
      - Normative judgments consistently tracked history, not current contribution (e.g., calling a trait "broken" when it fails an ancestral role).  

  - **Resolvability**:  
    Both agree the debate is **in principle resolvable** through:  
    - **Empirical work**: E.g., studying how biologists ascribe functions in "edge cases" (e.g., de novo genes).  
    - **Conceptual progress**: E.g., reconciling normativity with mechanism in systems biology.  
    However, resolution requires clarifying the *primary explanandum*. If biological practice prioritises trait existence, etiology wins; if systemic analysis, causal role wins.  

  ---  
  This document, endorsed by both parties, isolates residual disagreements and identifies testable cruxes. Further collaboration will target these points.  

  **Signed**,  
  [Etiologist Representative]  
  [Causal-Role Theorist Representative]  
  Date: 26 May 2024
