  ### Principle: Risk-Weighted Expected Utility (REU) with Inverse S-Shaped Risk Function

  **Core Principle**:  
  You evaluate gambles using **Risk-Weighted Expected Utility (REU)**, which reweights probabilities via a **risk function** \( r(p) \) applied to cumulative probabilities. The REU of a gamble is calculated by:  
  1. Ordering outcomes from worst to best: \( x_1 \leq x_2 \leq \cdots \leq x_n \).  
  2. Computing cumulative probabilities: \( F_i = \sum_{j=1}^{i} p_j \) (probability of outcome ≤ \( x_i \)).  
  3. Applying the risk function \( r \) to cumulative probabilities, with weights:  
     \[
     w_i = r(F_i) - r(F_{i-1}) \quad (\text{where } F_0 = 0).
     \]  
  4. Summing reweighted utilities:  
     \[
     \text{REU} = \sum_{i=1}^{n} w_i \cdot u(x_i).
     \]  

  **Risk Function \( r(p) \)** (Inverse S-shaped):  
  - \( r(p) = \exp\left(-\beta (-\ln p)^\alpha\right) \) (Prelec function, \(\alpha = 0.65\), \(\beta = 1.0\)).  
  - **Properties**:  
    - **Overweights extreme outcomes**: Small probabilities of very bad (e.g., $0$ in Cases 4,7) or very good outcomes (e.g., $1,000,000$ in Case 3) are amplified.  
    - **Underweights moderate outcomes**: Medium probabilities (e.g., 50% in Cases 1,2) are discounted.  
    - **Sensitivity at boundaries**: The step from 0% to 0.1% matters more than 20% to 20.1% (Case 7).  

  **Utility Function \( u(x) \)** (Mildly concave):  
  - \( u(x) = x^{0.8} \) (moderate diminishing returns).  
  - Ensures consistency with your aversion to large losses (e.g., house in Case 5) and preference for scaling (Case 6).  

  ---

