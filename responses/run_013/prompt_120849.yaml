     - **Verdict kept**: Reject single flip, accept 100 flips.  

  7. **99.99% $10,000 vs. sure $9,900**:  
     - REU(gamble) = \( r(0.0001) \cdot u(0) + [1 - r(0.0001)] \cdot u(10,000) \approx 0.025 \cdot 0 + 0.975 \cdot 10,000^{0.8} \approx 0.975 \cdot 2,511 \approx 2,448 \).  
     - REU(sure) = \( u(9,900) \approx 9,900^{0.8} \approx 2,502 \).  
     - **Verdict kept**: Sure $9,900 preferred since \( 2,502 > 2,448 \).  
     - **Why**: \( r(0.0001) \approx 0.025 > 0.0001 \) overweights the 0.01% chance of $0$.  

  ---

  ### Predictions for New Cases

  **Case A: 20% lose $100, 80% gain $200 vs. 20% lose $100, 40% $0, 40% gain $400**  
  - Identical 20% loss risk and average non-loss gain ($200).  
  - **REU prediction**: Not indifferent. Gambling on $400 is preferred:  
    - Gamble 1: \( r(0.2) \cdot u(-100) + [1 - r(0.2)] \cdot u(200) \approx 0.22 \cdot (-100) + 0.78 \cdot 200^{0.8} \approx -22 + 0.78 \cdot 119 \approx -22 + 93 = 71 \).  
    - Gamble 2: \( r(0.2) \cdot u(-100) + [r(0.6) - r(0.2)] \cdot u(0) + [1 - r(0.6)] \cdot u(400) \approx 0.22 \cdot (-100) + [0.58 - 0.22] \cdot 0 + [1 - 0.58] \cdot 400^{0.8} \approx -22 + 0 + 0.42 \cdot 209 \approx -22 + 88 = 66 \).  
    - **Gamble 1 (71) > Gamble 2 (66)**, so you prefer the $200/$0/$400 gamble.  
  - **Why**: REU overweights the extreme gain ($400) but underweights intermediate outcomes ($0), making the $200/$0/$400 gamble less attractive despite identical averages.  

  **Case B: Two urns with 50 red/50 black balls**  
  - Urn 1: Known red wins. Urn 2: Winning color determined by hidden coin flip.  
  - **REU prediction**: Indifferent (both have 50% win chance).  
  - **Your preference for Urn 1 requires a second device: Ambiguity aversion**.  
    - REU handles only *known* probabilities, but Urn 2 has *ambiguous* probabilities.  
    - **Principle added: Maxmin Expected Utility (MEU)**. You evaluate ambiguous gambles by assuming the worst-case probability:  
      \[
      \text{MEU} = \min_{\text{possible } p} \text{ REU}(p).
      \]  
    - For Urn 2: If you assume the coin flip biased against you (e.g., only 40% win chance), REU drops.  
    - **Result**: You strictly prefer Urn 1 to avoid ambiguity.  

  ---

  ### Summary
  - **Principle**: REU with inverse S-shaped \( r(p) \) and concave \( u(x) \).  
  - **Fits**: Cases 1,2,3,4,6,7 (all except 5).  
  - **Abandons**: Case 5 (indifference requires linear weighting of non-disaster outcomes).  
  - **Predictions**:  
    - Case A: Not indifferent; prefer $200/$0/$400 gamble.  
    - Case B: Indifferent under REU; ambiguity aversion explains urn preference.  
  - **Device for urn case**: Ambiguity aversion (e.g., MEU) supplements REU.  

  This framework captures your focus on certainty, extreme outcomes, and sensitivity to small probabilities, while highlighting where your intuitions (Case 5) diverge from the model.
