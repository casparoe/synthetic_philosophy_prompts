  Specifically, for outcomes ordered from best (x1) to worst (xn), the weight for outcome i is:
  w_i = r( ∑_{j=1}^{i} p_j ) - r( ∑_{j=1}^{i-1} p_j )
  where r is a function (the risk function) from [0,1] to [0,1] that is increasing and satisfies r(0)=0, r(1)=1.

  The REU is then: ∑_{i=1}^{n} w_i * u(x_i)

