  The REU of a gamble is computed as:
  REU = ∫ [d/dp] [u(x)] * r(p) dp
  But more practically, for a discrete gamble with outcomes ordered from worst to best: x1, x2, ... , xn with probabilities p1, p2, ... , pn, we compute the cumulative probabilities. The REU is:
  REU = u(x1) * r(P(X ≤ x1)) + u(x2) * [r(P(X ≤ x2)) - r(P(X ≤ x1))] + ... + u(xn) * [1 - r(P(X ≤ x_{n-1}))]
