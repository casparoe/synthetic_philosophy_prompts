  ### Case: Operation Mistveil  
  **Setting:** A high-intensity urban conflict between the State of Lyriana (just cause: defending against annexation) and the breakaway Caspian Legion (unjust cause: aggressive secession). Both sides use conventional militaries with professional volunteers. No conscription, duress, or ignorance—all combatants understand their role and the war’s stakes.  

  **Incident:**  
  During the battle for Port Haven, two isolated killings occur simultaneously in dense fog:  
  - **Killing 1 (Unjust Killer → Just Victim):** Caspian Sergeant Aris spots Lyrian Corporal Ben through a ruined building. Aris shoots Ben, a combatant actively defending a checkpoint, killing him instantly.  
  - **Killing 2 (Just Killer → Just Victim):** Lyrian Sergeant Leo, 200m away, sees a figure moving through the fog in ambiguous urban camouflage (identical gear used by both sides). Mistaking him for a Caspian infiltrator, Leo shoots, killing Lyrian Private Eli, a combatant returning from a supply run.  

  **Symmetry:**  
  - **Conduct:** Both killings are deliberate rifle shots at identified combatants.  
  - **Threat:** Ben and Eli were armed, in uniform, and operating in contested zones.  
  - **Numbers:** 1 killer, 1 victim per incident.  
  - **Knowledge/Voluntariness:** Aris (unjust), Leo (just), Ben (just), and Eli (just) all joined voluntarily, understood their side’s objectives, and acted autonomously.  
  - **Justice of Cause:** Only variable—Lyrana’s cause is just (self-defense), Caspia’s is unjust (aggression).  

  ---

  ### Bookkeeping: Analysis by Doctrine  
  *(Focus: Killing 2 is the pivot; Killing 1 is control)*  

  | **Question**               | **Orthodox (Walzer)**                                                                 | **Revisionist (McMahan)**                                                                 |  
  |----------------------------|---------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|  
  | **(a) Permissibility of Killing** | **K1 (Unjust→Just):** Permissible—Aris exercises combatant’s privilege. <br> **K2 (Just→Just):** Permissible—Leo exercises combatant’s privilege. | **K1 (Unjust→Just):** Impermissible—Aris contributes to unjust threat. <br> **K2 (Just→Just):** Impermissible—Eli poses no unjust threat. |  
  | **(b) Culpability of Killer**    | **Aris (Unjust):** Not culpable—responsibility lies with Caspian leaders. <br> **Leo (Just):** Not culpable—acting within role. | **Aris (Unjust):** Culpable (but possibly excused by context). <br> **Leo (Just):** Culpable (but possibly excused by fog of war). |  
  | **(c) Victim’s Liability**       | **Ben (Just Victim):** Liable—all combatants are liable by status. <br> **Eli (Just Victim):** Liable—all combatants are liable by status. | **Ben (Just Victim):** Not liable—no contribution to unjust threat. <br> **Eli (Just Victim):** Not liable—no contribution to unjust threat. |  
  | **(d) Victim’s Family’s Complaint** | **Ben’s Family:** Cannot complain *about Aris*—killing was lawful. May only blame Caspian leaders for unjust war. <br> **Eli’s Family:** Cannot complain *about Leo*—killing was lawful. No moral grievance against Leo or Lyriana. | **Ben’s Family:** Can complain that Aris wronged Ben—killing was objectively unjustified. <br> **Eli’s Family:** Can complain that Leo wronged Eli—killing was objectively unjustified. |  

  #### Key Outcome for Victim’s Family:  
  - **Orthodox is harsher on Eli’s family (Killing 2):** They are denied *any* claim that Leo wronged Eli. The doctrine treats Eli’s death as a permissible tragedy of war, silencing familial anger at Leo.  
  - **Revisionist is gentler on Eli’s family (Killing 2):** They retain the moral right to condemn Leo’s act as wrongful, even if excusable, affirming Eli’s non-liability.  

  ---

  ### The Single Feature Doing the Work  
  **Intra-factional killing by a just combatant (Killing 2).**  
  - **Why it works:**  
    - Orthodox ties liability to *role*, not cause. Eli, as a combatant, is liable to be killed by *any* combatant—even his ally. His family cannot demand accountability for Leo’s act.  
    - Revisionist ties liability to *unjust threat contribution*. Eli, serving a just cause, posed no unjust threat. Leo’s killing violates Eli’s rights, giving his family moral standing to protest.  
  - **If feature is removed/reversed:**  
    - **Scenario change:** Make Eli an *unjust* combatant (e.g., Leo kills a Caspian soldier).  
    - **Result:** Orthodox remains unchanged (permissible killing, no complaint). Revisionist *also* permits the killing (Leo eliminates unjust threat). Both views deny Eli’s family a complaint—**standard disagreement collapses**.  
    - **Premise flip:** Revisionist’s verdict shifts from "impermissible" to "permissible" when the victim is unjust, restoring its typical harshness on unjust combatants.  

  ---

  ### Orthodox Defender’s Counterattack  
  **Claim:** "This case smuggles in a misdescription—fratricide (Killing 2) isn’t covered by combatant privilege. Walzer’s moral equality applies only to *enemy* combatants, not intra-force killings. Leo’s act is policeable negligence, not an act of war."  
  - **Cost to Orthodox Defender:**  
    - **Internal inconsistency:** If combatant privilege only immunizes killing *enemies*, then Killing 2 becomes a domestic crime. But Walzer explicitly grounds liability in *role*, not affiliation: "Combatants wear a uniform... and thus become legitimate targets" (*JUW*, Ch. 3). Denying this collapses the distinction between combatant and civilian status.  
    - **Broader cost:** Retreating to "enemy-only" liability invites revisionism. If liability depends on relational factors (e.g., allegiance), not just role, Walzer’s core symmetry weakens—unjust combatants could argue they aren’t "enemies" of just civilians.  

  **Verdict:** The case holds. Orthodox doctrine’s role-based liability harshly denies Eli’s family a grievance, while revisionist liability-by-threat grants it. The defender’s counterattack risks undermining Walzer’s universality.  

  ---  
  **Design Note:** This case isolates orthodox doctrine’s *structural* harshness—by making liability impersonal, it extinguishes personal wrongs even in morally jarring contexts. Revisionism, though stringent on culpability, preserves the victim’s moral standing by tethering liability to threat.
