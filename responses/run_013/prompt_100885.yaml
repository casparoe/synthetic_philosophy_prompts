  - Gains: \(g_A = a - 10\), \(g_B = b - 20\).
  - Equation: \(\frac{a - 10}{70 - 10} = \frac{b - 20}{90 - 20}\) → \(\frac{a - 10}{60} = \frac{b - 20}{70}\).
  - With \(a + b = 100\) → \(b = 100 - a\):
    \[
    \frac{a - 10}{60} = \frac{(100 - a) - 20}{70} \rightarrow a \approx 40.65,  b \approx 59.35.
    \]
  - **Verdict**: A gets ≈ $40.65, B gets ≈ $59.35.

  ---

  ### Conclusion:
  - **Unifying principle**: The Kalai-Smorodinsky solution, as defined, delivers all your verdicts and resolves Case 5 to **$70 for A**.
  - **Case 5 verdict**: You must abandon the $63 intuition. The $70 outcome aligns with surplus division (your Case 2/3 intuition) and the generalized principle.
  - **Why $63 doesn't fit**: The $63 (or $62.50) arises from an *alternative* definition of ideal points (e.g., \(M_A = f_A + S = 100\), \(M_B = f_B + S = 60\)), but this ignores that B's maximum gain is capped by \(P - f_A = 60\) (not \(S = 60\)). Your Case 2/3 verdicts rely on \(M_B = P - f_A = 40\), not \(f_B + S = 40\), confirming Kalai-Smorodinsky is consistent.

  Adopt this principle for a coherent, consistent approach to dividing cooperative gains.
