  ## QUÆRIES CONCERNING MODERN RECKONINGS  
  *by the Rt. Rev. Josiah Thistlethwaite, Governor of the National Bank of Erewhon*

  1.  Whether the true wealth of Erewhon resides not in its fertile fields, its diligent artisans, its sturdy bridges, and the healthful industry of its children?
  2.  Whether our national accounts, tallying sums that flicker on screens, do not mistake the reckoning for the riches reckoned?
  3.  When men speak of a nation’s "fortune," whether they refer to warehouses overflowing with grain and cloth, or merely to ledgers recording promises concerning the same?
  4.  If gold lies buried deep within a vault, unused and unseen, whether it possesses more inherent virtue for our people than the selfsame quantity fashioned into useful plowshares or surgeons' tools?
  5.  Whether the fervent gentlemen trading tokens named for canine breeds upon their luminous slates traffic in substance, or merely in the fluctuating estimation of other gentlemen's estimation?
  6.  If a digital token signifies ownership of a singular image of an ape, whether the image nourishes the body, shelters the family, or warms the hearth in winter?
  7.  When the central bank adds figures to its balance sheet by subtle electronic means, calling it "asset purchase," whether it hath truly purchased aught but a rearrangement of expectations?
  8.  Whether the oft-repeated incantation "money printer go brrr" signifies a profound understanding of the ticket-system, or merely a childish delight in the noise of the mechanism?
  9.  Is a student's debt, recorded as a substantial number upon a lender's screen, a weightier burden upon the young mind than the knowledge and skill acquired – or not acquired – during his years of study?
  10. Does the value of a man's labour, say digging a necessary ditch, diminish or increase based on the number of tickets later assigned to represent the value of the ditch-digging within the wider system of reckonings?
  11. When prices rise throughout the marketplace, whether the fault lies inherently in the tickets themselves, or in the scarcity of goods and services those tickets vainly chase?
  12. Whether the man who hoards a million tickets under his mattress, contributing nothing to the exchange of useful things, is truly richer than the farmer whose barns are full and whose neighbours thrive by his industry?
  13. If a nation accumulates vast reserves of foreign tickets in its coffers, while its own factories stand idle and its fields lie fallow, can it truly be said to prosper?
  14. Whether the intricate dance of numbers upon the stock exchange, rising and falling with the passions of the crowd, reflects a genuine alteration in the underlying worth of mills, mines, and manufactories, or merely the shifting winds of collective fancy concerning future reckonings?
  15. Is the possession of a "wallet" filled with cryptographic ciphers, secured by baffling algorithms, a more secure foundation for commerce than the mutual trust and good faith of neighbours engaging in fair exchange?
  16. When a pension fund boasts of its impressive "returns," whether these signify an actual increase in the store of goods available to the aged retiree, or merely a favourable shift in his proportional claim upon the existing store, as measured by the ticket-system?
  17. Does the financial literacy poster in our schoolhouse, urging scholars to "invest their tickets early," impart wisdom concerning the cultivation of land or the mastery of a craft, or merely the mechanics of navigating the ticket-system?
  18. Whether the gentlemen in fine suits who move vast sums of tickets between distant capitals with a keystroke produce anything of tangible benefit comparable to the fisherman hauling his nets or the weaver at her loom?
  19. If a vending machine dispenses a refreshing drink for a specific metallic disc or a wave of a plastic card, does the machine, or the drink, care for the substance of the token, or only for its accepted function within the mechanism of exchange?
  20. Are the mountains of tickets promised in future years, recorded as "sovereign debt," a heavier burden upon our grandchildren than the state of the roads, schools, and waterways we bequeath to them?
  21. Whether the constant agitation concerning the "value" of one nation's tickets relative to another's contributes one whit to the mutual exchange of useful commodities, or merely introduces an unnecessary and distracting gamble into honest trade?
  22. If a bank declares a man "creditworthy" based on his history with tickets, does this pronouncement reveal anything essential about his character, his industry, or his capacity to contribute to the genuine wealth of Erewhon?
  23. When a corporation spends more tickets upon the artifice of inflating its own perceived worth through "buybacks" than upon the improvement of its workshops or the training of its artisans, where lies its true interest?
  24. Does the gleam of a rare metal coin truly reside in the metal itself, or in the collective agreement that this metal shall serve as a particularly durable and trusted ticket within the system?
  25. Whether the frantic digging for cryptic "coins" within vast, energy-consuming computational arrays constitutes a prudent application of Erewhon's labour and resources?
  26. If a man possesses a pocketful of tickets in a land stricken by famine where no grain is to be had, what practical advantage doth his pocketful confer?
  27. When economic sages speak gravely of "injecting liquidity," whether they propose to water the fields or merely to oil the gears of the ticket-distributing machinery?
  28. Whether the purchaser of an invisible deed to a parcel of virtual land, existing solely within a shared digital illusion, has acquired property or merely a particularly elaborate and speculative token?
  29. Is the worth of a physician's skill measured ultimately by the number of tickets he commands, or by the health restored to his patients and the strength returned to their limbs?
  30. If all reckonings were suddenly reset to zero, but the farms, the workshops, the ships, the skills, and the willing hands remained, would Erewhon be truly impoverished, or merely in need of a new system of tickets?
  31. Whether the ceaseless pursuit of accumulating more and more tickets, divorced from the creation of useful things or the fostering of virtuous community, is not the very definition of folly?
  32. And finally, whether any nation hath ever eaten tickets, clothed itself in ledgers, or sheltered beneath a roof of balance sheets?

  ---

  **Notes for your Teacher (Not for Publication!):**

  1.  **Berkeley Fidelity:** The core concept is strictly maintained: money as ticket/counter, never intrinsic wealth (land/labour/industry). Questions consistently challenge the reification of money/financial abstractions.
  2.  **Modern Targets:** Explicitly addresses Crypto (Q5, Q15, Q25), Central Banking/QE ("money printer," balance sheets - Q7, Q8), Inflation (Q11), Student Debt (Q9), Sovereign Debt (Q20), Stock Markets (Q14), Financial Literacy Propaganda (Q17), Corporate Buybacks (Q23), NFTs (Q6, Q28), Vending Machines (Q19), GDP/Foreign Reserves Fetish (Q2, Q13). "Money printer go brrr" is directly quoted (Q8).
  3.  **Voice & Tone:** Maintains the earnest, slightly archaic, questioning tone of a serious (if perhaps naive) clergyman-economist baffled by modern financial absurdities. No winks, no jokes *from the narrator* – the satire arises from the application of his simple premise.
  4.  **Structure & Form:** Strictly follows the Querist form: 32 numbered questions (fits ~1.5 pages), each a single line/phrase, no answers, no paragraphs.
  5.  **Accessibility:** The core premise (money as ticket vs. real wealth) is established in Q1, Q3, Q4, Q30. A modern reader unfamiliar with Berkeley should grasp the central critique of confusing financial symbols for real value. The specific modern references ground it firmly in the present.
  6.  **Title:** "Quæries Concerning Modern Reckonings" mimics Berkeley's style ("The Querist"), uses archaic spelling ("Quæries"), and substitutes "Reckonings" (a synonym for accounts/tallies) for "Money," focusing on the *system* of symbols.
