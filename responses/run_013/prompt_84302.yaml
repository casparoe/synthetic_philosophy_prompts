  The user has already developed a useful framework - distinguishing structural conventions (which enable collective practices) from expressive ones (which signal social belonging). They want me to: 1) argue that structural conventions create universal moral obligations, 2) reject "when in Rome" as the justification, 3) limit visitors' obligations for expressive norms, 4) address hard cases where conventions conflict, and 5) defend against reductionism (that this is just harm vs. taste in disguise).

  I should build the argument carefully. First, establish why structural conventions matter morally - they prevent tangible harms like chaos at bus stops or traffic collisions. The obligation comes from the functional need for coordination, not cultural preference. A visitor refusing to queue isn't just rude; they're taking others' turn. 

  For expressive norms, I'll argue they only create duties when you've personally engaged someone (like tipping a waiter you've interacted with). The "when in Rome" principle mistakenly applies the same logic to both types. 

  The hard cases need special attention: What if a structural norm excludes someone (like segregated facilities)? Or if an expressive norm conflicts with deep values (like refusing a sexist greeting)? I'll need nuanced positions - perhaps arguing that exclusion voids obligations, while deeply offensive expressions might permit non-participation without rudeness.

  Finally, against the "harm vs. taste" objection: I'll concede overlap but emphasize that structural norms are defined by their function in maintaining practices, not just by causing harm. A badly designed queue still creates moral obligations because coordination itself has value.

  The response should unfold like a philosophical essay - thesis first, then layered arguments anticipating counterpoints. The tone should stay rigorous but accessible, respecting the user's clear familiarity with the subject. Key moves: anchor obligations in concrete human needs rather than cultural authority, give visitors moral agency in hard cases, and defend the structural/expressive distinction as fundamentally about social function rather than subjective impact.
answer: |-
  ## The Moral Architecture of Everyday Life: Why Some Conventions Bind Us All

  The tempting conclusion that local conventions are mere preferences masquerading as morals, and thus impose no obligation on visitors, contains a vital half-truth. Many conventions *are* expressive markers of local belonging, generating only limited duties of courtesy. However, a distinct class – **structural conventions** – creates genuine, universal moral obligations grounded in the fundamental requirements of shared human life. Crucially, this obligation arises not from the convention's *local origin*, but from its *functional role* in enabling essential cooperative practices. "When in Rome" misdiagnoses the source of the duty; it’s not about placating Romans, but about participating justly in practices that depend on coordination for their very existence. While residents often overextend the moral mantle to expressive norms, visitors are indeed bound by structural conventions, though their obligations within expressive ones are far narrower.

  **The Moral Core of Structural Conventions: Justice in Coordination**

  Structural conventions exist precisely to solve coordination problems inherent in navigating shared resources or collective hazards. Their point is not to express taste but to *make possible* a valuable or necessary practice that would collapse, or become dangerously inefficient and unjust, without widespread conformity.

  1.  **Enabling the Practice:** Queueing isn't just "polite"; it's the mechanism that prevents a chaotic scramble for a finite resource (a bus seat, a teller). Keeping to one side of the road isn't just "customary"; it's what prevents mutual destruction. Signaling a turn isn't "good manners"; it's conveying vital information enabling others to navigate safely. Without near-universal conformity, the practice itself – orderly access, safe travel – disintegrates.
  2.  **The Moral Wrong of Defection:** Non-conformity within a structural convention isn't merely offensive; it's *exploitative* and *unjust*. The queue jumper doesn't just annoy; they seize a benefit (priority) that others have collectively forgone by adhering to the rule. They take what the cooperative practice allocates to another, free-riding on the restraint of others. The driver who fails to signal doesn't just show "bad form"; they endanger others by depriving them of information essential for the coordinated practice of shared road use. They expropriate safety from others for their own minor convenience.
  3.  **Obligation Grounded in Function, Not Locale:** This generates a genuine moral obligation for *anyone* participating in the practice, visitor or resident. The obligation stems from the *nature of the cooperative endeavor itself* and the basic requirement not to undermine essential, harm-preventing coordination or unjustly take benefits secured by others' compliance. It's a demand of justice within a shared activity. A visitor refusing to queue isn't violating a Roman preference; they are subverting the very mechanism ensuring fair access to a resource *they themselves seek to use*. Their obligation arises from their participation in the practice, not from deference to local sentiment. "When in Rome" gets it backwards; the duty exists *because* Rome (or London, or Tokyo) has established a necessary structural convention enabling a vital practice.

  **The Limited Reach of Expressive Conventions: Courtesy, Not Coercion**

  Expressive conventions serve different ends: signaling group membership, demonstrating respect, or displaying shared taste. Their function is symbolic, not structural. A single defection doesn't collapse the practice or directly expropriate a tangible benefit secured by others' conformity.

  1.  **Surviving Defection:** If one person doesn't tip where it's customary, the restaurant doesn't collapse. If a visitor offers a bow instead of a handshake, the possibility of future greetings remains intact. The core functions of the restaurant (serving food) or the social interaction (acknowledgment) proceed. No one loses something they were concretely entitled to *by the structure of the practice itself* (though individuals *within* the practice might feel slighted).
  2.  **Obligation Grounded in Engagement, Not Geography:** This lack of structural necessity means expressive conventions cannot generate universal moral obligations binding strangers to a community *as such*. However, they *can* generate obligations of **courtesy** arising from specific, voluntary engagements. If you choose to dine at a restaurant where tipping is the established norm for compensating staff (who rely on it), and you receive service, you incur a limited obligation *to that specific server* based on the implicit expectations of the transaction you entered. Similarly, if you extend your hand for a handshake, you create a specific expectation for the person you engaged. But the tourist walking down the street owes no moral duty *to Rome itself* to master the intricacies of Italian greetings. Their obligation is to avoid deliberate offense *in specific interactions they initiate*, not to embody Roman identity.

  **Navigating the Hard Cases: Collision and Exclusion**

  The distinction faces its toughest tests when conventions conflict or access is denied.

  1.  **Repugnant Expressive Convention (Visitor):** Suppose a visitor finds a local expressive norm deeply offensive (e.g., a mandatory gesture perceived as subservient or linked to a repugnant ideology). Here, the visitor has **no obligation to conform**. Since expressive norms lack the structural necessity grounding universal duties, and conformity would violate the visitor's own deeply held values, the duty of courtesy is overridden or simply non-existent. Opting out is permissible, though minimizing unnecessary offense (e.g., a polite but firm refusal rather than contempt) remains prudent. The key is that the obligation was only ever potential and limited; it doesn't bind against core moral commitments.
  2.  **Exclusion from Structural Convention (Visitor):** What if a visitor is *excluded* from a structural convention's benefits? (E.g., historically segregated facilities, or a resource reserved strictly for citizens). **Exclusion voids the obligation.** The moral force of a structural convention lies in the reciprocal benefits of participation within a shared practice. If the visitor is systematically denied the benefits the convention organizes (fair access, safety), they cannot be morally bound to bear its burdens (conformity). They are effectively excluded from the cooperative endeavor itself. Whether the exclusion is "their own doing" (e.g., violating entry rules) matters: if they fairly excluded themselves through their own actions violating just rules, the obligation *within that specific instance* might persist (e.g., they must still queue if somehow granted access later). But systematic, unjust exclusion based on identity absolves them entirely.
  3.  **Structural Convention with Expressive Overtones:** Some norms blend elements. Consider dress codes in sacred spaces (e.g., covering shoulders). Is this structural (preserving solemnity/order) or expressive (marking respect/membership)? The obligation hinges on the *primary function*. If the code demonstrably prevents disruption essential to the practice (e.g., maintaining focus in a meditation hall), it leans structural and may bind visitors. If primarily symbolic, it leans expressive, generating only a courtesy obligation when choosing to enter. The line can be blurry, demanding context-specific judgment.

  **Addressing the Reductionist Objection: Beyond Harm vs. Taste**

  The charge that structural/expressive merely repackages "harm vs. taste" is insightful but incomplete. While preventing tangible harm is *often* the consequence of structural convention failure, the core distinction is **functional**: does non-conformity *destroy or subvert the cooperative practice itself by violating its essential coordination mechanism*?

  *   **Harm is a Frequent Consequence, Not the Defining Feature:** A badly designed queue might cause frustration (harm) but still function structurally to allocate turns fairly. The moral wrong remains the free-riding expropriation of priority, *even if* no one is physically harmed. Conversely, violating a potent expressive norm (e.g., desecrating a sacred symbol) might cause profound psychological harm, but it doesn't inherently destroy a *coordinated practice* in the way queue-jumping does. The harm stems from the *meaning*, not the collapse of a functional mechanism for shared action.
  *   **The Core is Cooperative Function:** The structural convention is defined by its role as the *enabling rule* for a valuable or necessary collective activity. The moral obligation arises from the requirements of *participation in that specific form of cooperation*. This functional grounding provides a more precise and objective criterion than the subjective experience of "harm" or "offense," which can vary widely and attach to both types of conventions.

  **Conclusion**

  While we rightly chafe at the over-moralizing of local preferences, we must recognize the indispensable role of structural conventions in building a minimally just and functional shared world. These norms generate genuine moral obligations for visitors and residents alike, not out of deference to local sensibilities ("When in Rome..."), but out of the demands of justice within cooperative practices essential for navigating collective life. Non-conformity isn't just rude; it's exploitative or destructive. Expressive conventions, vital for social glue but lacking this functional necessity, bind visitors only through specific engagements, creating limited duties of courtesy rather than universal moral demands. Recognizing this distinction allows us to navigate diverse social landscapes with both moral clarity and cultural sensitivity, respecting genuine obligations where they exist without capitulating to parochial overreach. The visitor's duty isn't to *become* Roman, but to participate justly in the practices that make shared Roman life possible.
