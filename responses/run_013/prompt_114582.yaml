prompt: |-
  ok so this is a work thing but two people now have told me it's basically a philosophy question and I dont know where else to ask it.

  I'm a backend engineer at a mid-size company, about 40 people on the eng side. Design reviews happen in a shared doc: someone posts a proposal, reviewers add comments as they get to it over the course of a week, all of it visible to everyone as it lands. The first person to comment gets a big colored banner at the top that says APPROVE, DISCUSS, or BLOCK, and everybody else's comments sort underneath it. By convention the most senior person on the project reviews first, because they're usually right and we want the review to be fast.

  Here's what's been bugging me. Last three proposals went the same way: senior person approves with a light comment, then every subsequent reviewer approves, mostly within a day, a lot of them with "agreed with [name]" and nothing else. On one of them I had a real concern — I'd found the migration would lock our main table for ~20 minutes in prod — and I sat on it, because I figured if the sharpest person in the room hadn't flagged it, I was probably missing something. I wasnt missing something. We rolled it back.

  So now I'm writing a proposal to change our review process and I want to get the diagnosis right instead of bolting on a "please speak up" line. My manager's fix: everyone writes their review before seeing anyone else's, then we unblind them all at once. My worry is that this doesn't obviously fix anything — by the time I write mine I've already read the proposal, I know who wrote it, I know it's the kind of thing the lead tends to like, and I know my review is going to be read by that person. Also half our reviewers are contractors whose renewals depend on the lead's opinion of them, which seems relevant.

  Whats more, a week after the rollback, the same lead approved the next two proposals faster than ever and nobody's behavior changed at all. That seems like it shouldnt happen if the process was actually self-correcting.

  Stuff I want sorted out:

  1. What's actually going on, in general terms? I keep describing it with bad metaphors. What's the difference between "everyone independently looked at the same evidence and agreed" and "everyone agreed because everyone else agreed," and how would I tell which one happened in a specific review after the fact?
  2. Is my manager's fix a real fix? If not, what's the smallest change that actually puts the missing information back? Randomize the order? Put the senior person last? Make reviews anonymous? Have people write reviews before the doc is even shared? I want to know which of these do work and which are theater.
  3. One teammate says keep it as is, because the lead is right ~80% of the time anyway and the process is fast. I dont have a good answer to this and I'd like one. What exactly are we giving up when it goes right?
  4. Related: someone suggested we just have everyone vote independently and go with the majority. But our reviewers aren't all answering the same question — one person is checking prod safety, another is checking API design, another is checking whether it fits the roadmap. Does majority voting even mean anything here, and if not, what replaces it?
  5. If I wanted to push a bad proposal through on purpose, how would I structure the process to maximize my odds? I figure thinking about it adversarially tells me what to fix.
  6. Is there a name for this pattern? Just the term, not a reading list.

  And if all this is standard econ/psych stuff I'm reinventing, fine, tell me — but then tell me what the standard story gets wrong about my specific setup, because the contractor-renewal part and the fact that the doc is visible to management feel like they change the answer.

  Answer in American English, plain language, no jargon unless you define it, and skip the reassurance — if the fix is "your process is fine and you just need to actually say something," say that.
reasoning: |-
  Okay, let me unpack this engineering design review problem. The user describes a clear pattern where senior approval silences dissent, even when valid concerns exist - evidenced by that production rollback incident. 

  First, diagnosing the core issue: it's classic authority bias combined with social proof. The senior's approval creates psychological safety risks for dissenters, especially contractors whose renewals depend on that lead. The visible approval banner amplifies this - it's not just about technical assessment but about social signaling. 

  The manager's "write reviews blind" solution misses key points: reviewers already know proposal authorship and senior preferences before writing. Contractor power dynamics won't disappear because reviews are simultaneous. And critically - the migration failure example proves the problem isn't just groupthink; it's that the current process actively disincentivizes contradiction of authority.

  For fixes, randomization has merit but doesn't address power asymmetry. Making the senior review last could help, though they might still influence through reputation. Anonymity seems impractical given team size and contractor relationships. 

  The 80% efficiency argument is dangerous - it ignores near-misses and the fact that the 20% failures are likely catastrophic (like production downtime). We sacrifice psychological safety and minority viewpoints. Also, specialized reviewers (prod safety vs API design) mean majority voting is meaningless - each voice has unique weight.

  Adversarial perspective: to push bad code, I'd ensure senior approval first and make the proposal complex enough to discourage scrutiny. The current process practically enables this.

  Standard terms would be "authority bias" and "informational conformity," but the contractor renewal aspect adds unique coercive pressure. Management visibility exacerbates this - public disagreement becomes career-risky.

  Smallest effective fix: mandate pre-commenting (write before seeing others) PLUS rotate first reviewer. But must pair with explicit norms: "Disagreeing with leads is valued" and "Contractor feedback is protected." Process tweaks alone won't work without psychological safety upgrades.

  For the "what's lost when it works" counterargument: we sacrifice learning opportunities, junior growth, and system resilience. Fast approvals create brittle consensus - the rollback proved this.
answer: |-
  Here’s a breakdown of your situation, stripped to essentials:

  ### 1. **What’s actually happening?**  
     - **Authority Bias + Social Proof:** People defer to the senior’s approval (authority) and assume others agree (social proof). Your "waiting because the lead didn’t flag it" is **informational conformity**—you assumed the lead had insights you missed.  
     - **How to tell the difference:**  
       - *Independent agreement:* Reviews have unique, specific reasoning (e.g., "Tested locally; latency under 5ms").  
       - *Conformity:* Reviews are vague ("Agreed with Alex") or ignore clear risks. After the fact, check if concerns were raised privately but not in the doc.  

  ### 2. **Will your manager’s fix work? What’s better?**  
     - **Manager’s fix (write reviews blind):** Helps but is incomplete. You still know the author/context, and contractors fear backlash. **It reduces bandwagoning but not authority bias.**  
     - **Smallest effective changes:**  
       - **Rotate the "first reviewer"** (not always the senior). *Why it works:* Prevents automatic deference to one voice.  
       - **Require concrete reasoning** in all approvals (no "agreed"). *Why it works:* Forces independent thought, exposes lazy consensus.  
       - **Anonymize early reviews** (if possible). *Why it works:* Reduces fear of contradicting seniors.  
     - *Theater:* Randomized order alone (still visible hierarchy), pre-writing without rotation (bias remains).  

  ### 3. **What’s wrong with "the lead is right 80% of the time"?**  
     - **You’re sacrificing resilience:**  
       - False negatives (missed risks like your migration lock) can cause outages, rollbacks, or security holes—costs that dwarf review speed.  
       - Stifles growth: Juniors/contractors don’t learn to spot edge cases if they default to agreement.  
       - Creates a **single point of failure:** If the lead overlooks something, no one catches it.  

  ### 4. **Is majority voting viable?**  
     - **No—it’s mismatched to your process.** Reviewers have distinct responsibilities (prod safety ≠ API design). A "vote" implies interchangeable perspectives.  
     - **Better:** Assign explicit roles (e.g., "Infra Reviewer," "API Reviewer"). Each must sign off on their domain. If Prod Safety reviewer blocks, it overrides others.  

  ### 5. **How to game the system to push bad code?**  
     - **Exactly as-is now:**  
       1. Get the senior to approve first.  
       2. Make the proposal complex (discourages deep scrutiny).  
       3. Use contractors (incentivized to conform).  
     - **Your current process is ideal for this.**  

  ### 6. **What’s this pattern called?**  
     - **Authority bias + informational conformity.** The contractor dynamic adds **power asymmetry**.  

  ---

  ### **The Fix**  
  **Do these three things:**  
  1. **Rotate the "first reviewer"** weekly (e.g., round-robin). Breaks automatic deference.  
  2. **Mandate role-specific feedback:** Each reviewer must comment on their domain (e.g., "Prod Impact: ⚠️ Table lock risk"). No empty "agreed" allowed.  
  3. **Add a "Devil’s Advocate" rule:** One randomly assigned reviewer must propose a counter-argument, even if they approve.  

  ### **Why this works for your setup**  
  - **Contractor safety:** Rotation and anonymity (if feasible) reduce fear of contradicting the lead.  
  - **Management visibility:** Role-specific feedback makes accountability clear.  
  - **Minimal friction:** Keeps the doc-based async process but adds structure to combat bias.  

  **What it doesn’t fix:** Culture. If contractors still fear non-renewal for dissent, they’ll stay silent. Pair this with leadership saying: **"We value disagreements—they prevent disasters."**  
  The migration rollback is your evidence—use it to justify why this matters.
