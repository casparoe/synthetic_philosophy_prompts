  Okay, the user is teaching a grad seminar on longtermism and global governance and faces a recurring issue where students misunderstand the concept of a "singleton." They want a creative teaching tool—a leaked internal memo from an organization in a singleton world—to illustrate the nuances without explicit explanation. 

  Hmm, let's unpack their needs. The core problem is conceptual collapse: students either oversimplify it as world government or reduce it to an engineering problem, missing key aspects like rival prevention, internal factionalism, and value lock-in. The user wants the document to be: 
  - **Pedagogically precise**: Embedding misunderstood elements (e.g., rival absence ≠ single entity, lock-in risks) as bureaucratic minutiae.  
  - **Tonally airtight**: Deadpan corporate-legal language with zero satire cues—the humor must emerge from accuracy.  
  - **Reductio ad absurdum**: A mundane HR clause (exit interviews, termination) that highlights the absurdity of "quitting" a singleton.  

  The user’s deeper intent seems to be provoking epistemic humility. By making the memo feel real, they force students to confront the gap between theoretical singleton models and their lived reality—where legitimacy questions are buried in FAQs and rival prevention is a compliance checkbox.  

  For execution, I’ll avoid naming the org too ominously ("Coordination Authority" feels suitably bland). Key sections:  
  - **§1-2**: Define "top-level authority" via negative space (no rivals, no overruling).  
  - **§3**: Internal disputes as "non-externalizable" to stress factionalism.  
  - **§4**: Rival prevention as procedural compliance.  
  - **§5**: Succession planning → highlight sticky lock-in.  
  - **FAQ**: Sidestep legitimacy with "referenda" hand-waving.  
  - **§7**: Exit interview absurdity (where would you go?).  

  The termination clause (§5.3) is the reductio: treating singleton dissolution like canceling a gym membership. Final touch: a passive-aggressive footnote about "consent thresholds" in the FAQ.  

  ... Did I miss anything? Ah—the memo must *not* explain "singleton." Students should recognize the concept via bureaucratic echoes (Bostrom’s criteria, Ord’s coordination arguments). If it works, they’ll laugh at the HR-speak for rival suppression, then wince realizing *that’s the point*.
