   3. Formative Problem-Spaces: Generations are defined by shared formative experiences (problems, events) that shape them, but without essential traits.
   4. Performative/Looping: The label creates the reality because people believe and act upon it.
   5. Deflationary/Astrology: Generational thinking is just like astrology with better PR (meaningless).
   6. Age-Period-Cohort (APC) Skeptic: What is attributed to generations is really due to age (life stage) or period (historical moment) effects.

