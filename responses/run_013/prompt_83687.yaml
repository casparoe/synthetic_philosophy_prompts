      C) Using a label that doesn't meaningfully apply in both places (because generations are not a global phenomenon).

   5. Marketing label changing behavior:
      "Suppose a marketing campaign successfully labels a group of young people as 'Generation Alpha' and describes them as particularly tech-savvy and environmentally conscious. After the label becomes popular, we observe that these young people become more environmentally conscious. What explains this change?"
