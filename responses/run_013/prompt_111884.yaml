  After exploring several structures, including variations of common consequence effects without sure things and shifts in outcome ranks, I discarded them due to either reliance on Allais-like framing, inability to prevent EU maximization, or lack of realism. The design below uses a shift between gain and loss domains, which inherently changes outcome rankings and blocks EU explanations through a reflection effect.

  **Case (142 words):**  
  A household with $100,000 in savings faces two investment decisions. First, for a vacation fund:  
  - Option A: 70% chance to gain $10,000, 30% chance to gain $0.  
  - Option B: 70% chance to gain $0, 30% chance to gain $30,000.  
  They choose A over B. Later, for emergency savings:  
  - Option C: 70% chance to lose $10,000, 30% chance to lose $0.  
  - Option D: 70% chance to lose $0, 30% chance to lose $30,000.  
  They choose C over D. The outcomes are net wealth changes, and both choices avoid sure things.

  **REU Calculations:**  
  Set \(u(x) = x\) (linear), \(r(p) = p^2\) (convex, risk-averse). Wealth is $100,000.  
  - **First choice (A vs B):**  
    REU(A) = \(100,000 + r(0.7) \times 10,000 = 100,000 + 0.49 \times 10,000 = 104,900\).  
    REU(B) = \(100,000 + r(0.3) \times 30,000 = 100,000 + 0.09 \times 30,000 = 102,700\).  
    REU(A) > REU(B) → Choose A.  
  - **Second choice (C vs D):**  
    REU(C) = \((100,000 - 10,000) + r(0.3) \times 10,000 = 90,000 + 0.09 \times 10,000 = 90,900\).  
    REU(D) = \((100,000 - 30,000) + r(0.7) \times 30,000 = 70,000 + 0.49 \times 30,000 = 84,700\).  
    REU(C) > REU(D) → Choose C.  

  **4(a) EU Violation (Symbolic):**  
  For any utility function \(u\):  
  - **Choice 1:** A ≻ B ⇒ \(0.7[u(w+10,000) - u(w)] > 0.3[u(w+30,000) - u(w)]\).  
  - **Choice 2:** C ≻ D ⇒ \(0.7[u(w) - u(w-10,000)] < 0.3[u(w) - u(w-30,000)]\) (rearranged from \(0.7u(w-10,000) + 0.3u(w) > 0.7u(w) + 0.3u(w-30,000)\)).  
  Define \(a = u(w+10,000) - u(w)\), \(b = u(w+30,000) - u(w)\), \(c = u(w) - u(w-10,000)\), \(d = u(w) - u(w-30,000)\). Then:  
  (1) \(0.7a > 0.3b\)  
  (2) \(0.7c < 0.3d\)  
  For an EU maximizer, (1) implies risk aversion in gains (marginal utility decreasing), while (2) implies risk-seeking in losses (marginal utility increasing). No single \(u\) can be concave in gains and convex in losses at the same wealth level \(w\), as this violates consistent diminishing/improving marginal utility. Hence, no EU maximizer makes both choices.  

  **4(b) Key Feature and Removal:**  
  The load-bearing feature is the domain shift (gains in first choice, losses in second). When removed—e.g., both choices in gains—the reversal vanishes. For instance, if the second choice also involves gains (e.g., C: gain $0 or lose nothing, D: gain $30,000 or lose nothing), both REU and EU consistently choose based on risk attitude.  

  **4(c) Risk-Seeking Variant:**  
  For a risk-seeking REU agent (concave \(r\), e.g., \(r(p) = \sqrt{p}\)):  
  - First choice: REU(B) > REU(A) → Choose B.  
  - Second choice: REU(D) > REU(C) → Choose D.  
  This mirrors risk-seeking reflection but does not alter the impossibility for EU.  

  **5. Adversarial Reply and Block:**  
  Strongest reply: "The agent has a standard utility function that is concave in gains and convex in losses (e.g., S-shaped prospect theory value function), so EU explains this."  
  Rebuttal: The choices are made at the *same wealth level* \(w\). An S-shaped \(u\) has concave and convex regions separated by a reference point, but it cannot be both concave and convex at \(w\) simultaneously. The symbolic conditions (1) and (2) directly conflict for any \(u\) at a single point.  

