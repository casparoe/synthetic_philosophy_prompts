prompt: |-
  I am a novelist, part-way through a book whose central character is a regulator — the sort of person who decides whether something is allowed to happen — and I have reached the scene in which she must give a name to a pattern she has spent her career noticing. I would rather she named the right thing than a plausible near-miss, so before I write the line I want the concept properly sorted out. Please act as a philosopher of decision-making with a working knowledge both of the cognitive-bias literature and of risk regulation. Think carefully and at length; begin by brainstorming the candidates before committing to any of them, and be explicit wherever you are unsure or wherever the field itself is divided.

  Here is the pattern, in the plainest terms I can manage, drawn from the arguments I have been reading and staging.

  - In a dispute about whether to do something — approve a drug, drain a marsh, release an organism, ban a pesticide, intervene in a system currently left alone — the harms of doing it must be proved, case by case, while the harms of leaving it alone are simply the way things are and are entered in no column at all.
  - The asymmetry survives agreement about the numbers: even where everyone concedes the probabilities, the harm of acting is treated as real and the harm of not acting as speculative.
  - When a safeguard is proposed that itself carries a cost — a delay that will cost lives, a prohibition that will push the practice out of sight — the cost of the safeguard is booked as a fresh harm, while the harm it was meant to avert is not booked at all, as though the good intention had cancelled it.
  - The person who wants to act must show that nothing will go wrong; the person who wants to leave things be is asked to show nothing, because leaving things be does not count as a decision.

  A friend in law tells me this is the precautionary principle, and another tells me it is simply omission bias, but neither answer satisfies me. The precautionary principle appears to be a rule about what to do when we do not know enough, whereas my pattern persists when we know perfectly well. Omission bias appears to concern how we judge a person who has done a harm against one who has merely let it happen, whereas my pattern concerns how the harms themselves are counted, by people who are not judging anyone in particular.

  So: does this configuration, taken as a whole, have a name? If an established concept covers part of it, I want to know exactly which part, and what the remainder is. If nothing covers it, please coin a term, define it, and give me its boundary cases along with a case that resembles it but is not it. It would help me to see, side by side, each candidate concept with what it does and does not account for, and to be told which of them are descriptions and which are prescriptions. I am not asking for a reading list or for citations; I am asking for the carving. Finally, in a sentence or two, tell me whether the asymmetry is ever defensible — irreversibility, option value, some such consideration — because I need to know whether I am writing a villain.

  Please answer in British English.
reasoning: |-
  Okay, the user is a novelist working on a book about a regulator character who needs to name a specific decision-making pattern. They've described several key aspects: asymmetrical treatment of action vs. inaction harms, cost accounting biases, and burden of proof imbalances. 

  Hmm, they've already rejected "precautionary principle" and "omission bias" as incomplete fits. Interesting that they specifically mention British English - probably setting-related. The core challenge is finding a precise term for this multi-faceted asymmetry that persists even with known probabilities.

  First, let's mentally dissect their four points: 
  1) Action harms require proof while inaction harms are baseline
  2) Asymmetry survives probabilistic agreement 
  3) Safeguard costs get counted but prevented harms don't 
  4) Action requires proving zero risk while inaction gets default acceptance

  *scratches head* The tricky part is how these reinforce each other. Omission bias explains part 4 but not 2-3. Status quo bias covers the inertia but not the accounting quirks. "Regulatory asymmetry" feels descriptive but not established. 

  Wait - the safeguard paradox (point 3) is particularly telling. It suggests a cognitive accounting error where only visible interventions get scrutinized. Reminds me of loss aversion framing but applied to systemic decisions. 

  *checks mental notes* Ah! The "baseline fallacy" might work - treating inaction as a neutral reference point when it's actually a choice. But is that too academic? "Harm accounting asymmetry" is clunky but precise. 

  For the villain question... *pauses* The asymmetry could be defensible when: 
  - Inaction preserves future options 
  - Action causes irreversible damage 
  - But when probabilities are known, it becomes harder to justify unless there's true uncertainty (not risk). 

  *weighing options* Probably best to present the term candidates as a comparative table so the novelist sees coverage gaps. Should explicitly flag that "precautionary principle" is often misapplied this way in practice even if theorists disagree. 

  Final thought: The coined term needs to sound like something a regulator would say naturally. "Systemic omission bias" perhaps? Combines the cognitive root with structural impact...
answer: |-
  Right then, let's dissect this with the care it deserves. As a philosopher steeped in decision theory, cognitive biases, and regulatory frameworks, I recognise the pattern you're describing as a particularly pernicious and systemic distortion in how harms are perceived and accounted for. It’s not one single, neatly labelled concept, but a *constellation* of biases and structural flaws that reinforce each other. Let’s brainstorm the candidates before settling.

  **Brainstorming Candidates & Their Fit:**

  1.  **Omission Bias (Core Component, but Incomplete):**
      *   **What it accounts for:** The core preference for harms caused by inaction over identical harms caused by action (Points 1, 2, 4). It explains the *moral* or *psychological* weighting asymmetry.
      *   **What it misses:** It doesn't inherently explain the *accounting* flaw – why the harms of inaction aren't "booked" at all, or why the costs of safeguards are counted while the averted harms vanish (Points 1 & 3 specifically). It's primarily a descriptive bias in *judgement*, not necessarily a prescription for *systemic accounting*.
      *   **Boundary:** Omission bias applies to judging *past* actions/inactions or *individual* decisions. Your pattern describes an ongoing *systemic* accounting failure applied to *forward-looking* regulation.

  2.  **Status Quo Bias (Contributing Factor):**
      *   **What it accounts for:** The preference for the current state of affairs (inaction) simply because it is the default. This underpins the inertia and the default "acceptance" of inaction harms (Points 1 & 4).
      *   **What it misses:** Like omission bias, it doesn't explain the *asymmetrical accounting* for harms or the peculiar treatment of safeguard costs. It's a preference, not an accounting rule.
      *   **Boundary:** Status quo bias is a general preference for the familiar. Your pattern specifically distorts how *harms* are counted *relative* to that status quo.

  3.  **Precautionary Principle (Often Misapplied / Perverted into this Pattern):**
      *   **What it *claims* to be:** A prescriptive principle stating that where threats of serious or irreversible damage exist, lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures to prevent environmental degradation (or analogous harm). It aims to *correct* for underweighting uncertain future harms.
      *   **How it *becomes* your pattern:** In practice, it's frequently distorted into the *very asymmetry you describe*. Proponents demand absolute proof of safety for action ("prove nothing will go wrong"), while ignoring the accumulating harms of the status quo, which aren't framed as requiring "precaution" against *them*. Safeguards *against action* are demanded, while safeguards *against inaction* (like proactive monitoring or early intervention) are neglected. The costs of *inaction* precaution vanish.
      *   **What it misses (in its pure form):** The pure principle *should* apply symmetrically to action *and* inaction when both pose threats. Your pattern highlights its *asymmetric application* where only action-related threats trigger precautionary accounting, and inaction-related threats are background noise. It doesn't inherently explain the accounting trick with safeguards (Point 3).
      *   **Boundary:** The *prescriptive* Precautionary Principle (PP) is about uncertainty. Your pattern *describes* an asymmetric accounting practice that persists *even when probabilities are known* and often hijacks the PP's name. A *true* application of the PP would require weighing the risks of action *against* the risks of inaction under uncertainty. Your pattern avoids this weighing by dismissing the risks of inaction.

  4.  **Baseline Fallacy / Reference Point Neglect (Key Insight):**
      *   **What it accounts for:** This is crucial. The pattern treats the *current state* (inaction) as a neutral, cost-free baseline. All harms are then measured *only* as deviations *caused by action*. Harms *inherent in the baseline* (inaction) or harms *averted by changing the baseline* are rendered invisible. This explains Points 1, 2, and 4 fundamentally. Point 3 is an extension: the safeguard changes the baseline *for the worse* (adds cost), so *that* cost is counted, while the harm *prevented* by the safeguard was never part of the baseline cost accounting, so its removal isn't counted as a gain. The "good intention" creates a new, worse baseline against which only *further* changes are judged.
      *   **What it misses:** This is more of a deep-seated cognitive/accounting error than a specific named bias. It provides the *mechanism* but needs combining with omission/status quo bias to explain the *preference* for that flawed baseline.
      *   **Boundary:** This fallacy can occur outside regulatory contexts. Your pattern is a specific, institutionalised manifestation in regulatory decision-making concerning harm.

  5.  **Loss Aversion Framing (Contributing Factor):**
      *   **What it accounts for:** People feel losses from a reference point (the status quo) more acutely than equivalent gains. Framing action as potentially causing a "loss" (from the baseline) makes it subjectively worse than the equivalent "gain" (avoiding a harm of inaction) which feels less urgent. This reinforces the omission bias and the baseline fallacy.
      *   **What it misses:** Doesn't explain the systemic *failure to account* for the baseline harms, only the *weighting* of perceived losses vs. gains.
      *   **Boundary:** A general cognitive bias, not specific to harm accounting in regulation.

  **The Constellation & The Name:**

  Your pattern is **primarily the institutionalisation of Omission Bias, reinforced by Status Quo Bias and Loss Aversion, operating through a profound Baseline Fallacy in harm accounting, frequently masquerading as (or perverting) the Precautionary Principle.**

  *   **Established Concept Covering the Core Mechanism:** The **Baseline Fallacy** or **Reference Point Neglect** is the most accurate description of the *accounting flaw* at the heart of Points 1, 2, 3, and 4. It explains *why* the harms of inaction vanish and why safeguard costs appear but averted harms don't.
  *   **The Driving Force:** **Omission Bias** provides the psychological/moral engine that makes this flawed accounting feel intuitively "right" and acceptable to decision-makers and observers.
  *   **The Common Mislabel:** The distorted application of the **Precautionary Principle** is often the *justification* or *label* used for this pattern in regulatory debates, especially concerning environment/health.

  **Coined Term & Definition:**

  Given that no single term perfectly captures this specific, systemic regulatory phenomenon, I propose coining:  
  **Systemic Omission Accounting Bias (SOAB)**

  *   **Definition:** The systematic tendency in regulatory decision-making to:
      1.  Treat the *status quo* (inaction) as a neutral, cost-free baseline.
      2.  Consequently, only account for potential harms *deviating from this baseline* (i.e., harms caused by *action* or *intervention*).
      3.  Neglect to account for harms inherent in, or perpetuated by, the status quo baseline itself.
      4.  Frame any proposed safeguard *against action* as establishing a *new* baseline from which its costs are measured as losses, while failing to credit the harms its implementation averts (as those harms were never formally accounted for in the original baseline).
      5.  Place the burden of proof exclusively on demonstrating the safety/efficacy of action, while implicitly accepting the risks of inaction as unavoidable background conditions.

  *   **Boundary Cases:**
      *   **Resembles but Isn't:** Genuine **Option Value**. Holding off on an irreversible action *while actively gathering information* to make a better decision later *can* be rational and doesn't necessarily involve ignoring baseline harms. SOAB avoids *any* accounting of baseline harms, regardless of irreversibility or information value.
      *   **Resembles but Isn't:** True **Precautionary Principle** application. A regulator genuinely applying the PP would actively investigate and weigh the *potential severe harms of inaction* against the potential harms of action under uncertainty. SOAB only applies "precaution" against action-related harms.
      *   **Not SOAB:** A regulator, facing *true ambiguity* (unknown unknowns, not quantifiable risks) about *both* action and inaction, who chooses inaction due to the irreversibility of the action. SOAB persists *even when risks are quantifiable and comparable*.

  **Is the Asymmetry Ever Defensible?**

  *   **Potentially, but narrowly:** Defensibility hinges on **irreversibility** and **genuine option value**, *not* on the accounting bias itself.
      *   **Scenario:** An action (e.g., releasing a novel organism) poses a small but non-zero risk of causing large-scale, *irreversible* ecological damage. Inaction (not releasing it) carries known, quantifiable ongoing costs (e.g., lower crop yields). *If* delaying action allows for significant learning that drastically reduces the uncertainty about the irreversible risk *without* incurring prohibitive costs from the delay, then a *temporary* asymmetry in the burden of proof *might* be justifiable. The key is that the *costs of inaction (the foregone benefits)* are explicitly acknowledged, quantified, and weighed against the *value of the information gained* during the delay.
      *   **Why SOAB is Still the Villain:** SOAB occurs when this justification is *misapplied*: when the irreversibility is exaggerated or non-existent, when the costs of inaction/delay are ignored or minimised, when the potential for learning is negligible, or when the asymmetry becomes a permanent feature rather than a temporary pause for learning. SOAB *exploits* these potentially defensible concepts to justify a permanent, unexamined preference for inaction and neglect of baseline harms.

  **In Conclusion for Your Novelist:**

  Your regulator is observing **Systemic Omission Accounting Bias (SOAB)**. It’s the institutional blindness to the costs of the status quo, coupled with an over-attribution of costs to any deviation from it, fuelled by deep-seated psychological biases and often hiding behind the noble cloak of the Precautionary Principle. It *can* be a tool of the villainous, wilfully maintaining harmful systems by making change seem disproportionately risky. However, in rare cases involving true, high-stakes irreversibility and tangible option value, a *carefully justified and temporary* asymmetry might be the lesser evil – though SOAB relentlessly tries to masquerade as this justification. Your character’s task is to name the pervasive, deceptive *bias*, not the rare, defensible exception. "SOAB" cuts to the core of the accounting flaw that makes the exception so easily abused. Now, let her name it, and let the consequences unfold.
