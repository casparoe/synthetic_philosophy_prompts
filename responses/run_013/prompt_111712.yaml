prompt: |-
  Bit of an odd favour to ask. I spent 35 years as a field biologist (avian ecology, mostly) and since I retired I've been sitting in on a graduate seminar the philosophy department runs on evolution and the mind — I'm the token scientist in the room. The instructor has roped me into helping mark the midterms because she reckons I'll catch the biology slips, wich is flattering and probably misplaced.

  Below is one of the exam questions and one student's answer to it. I have to put a mark out of 20 on it and then write comments that justify the mark, because students can appeal and I'll have to defend it line by line. I can handle the biology, but I'm out of my depth on the philosophy-of-science half, so I want the comments to be specific: point to the actual sentences, say what each one is doing and how much credit it should get, rather than a general impression. Be even-handed about it — flag the genuinely strong bits as well as the weak ones, and don't let me penalise an answer just for being confident. If something's off in a way I'd definately miss on my own, spell it out, because I'm the one who'll be standing behind the mark.

  QUESTION (20 marks). Evolutionary psychology is often accused of trading in 'just-so stories.' (a) Set out the objection as clearly as you can, and identify the specific criticism of adaptationist reasoning it grows out of, with at least one concrete example from the literature. (b) Then assess whether the objection is a fair criticism of evolutionary psychology as a research field, not merely of its weakest practitioners. In (b), be explicit about which claims you take to be the field's core, and about what evidence would tell for or against them.

  STUDENT ANSWER. Evolutionary psychology is often accused of telling 'just-so stories,' by which the critics mean that its explanations are unfalsifiable. Because natural selection can be invoked after the fact to explain almost any trait, the story is always available and nothing is ever ruled out, so the explanation has no predictive content and doesn't really count as science. The objection is usually traced back to Gould and Lewontin's attack on the adaptationist programme, which they accused of assuming in advance that every trait is an adaptation and then looking only for the selection pressure that built it, ignoring drift, developmental constraint and byproducts. Their emblem for this was the spandrels of San Marco — the decorative spaces that look designed but are really forced by the architecture.

  The charge lands against lazy adaptationism, but it isn't fair to evolutionary psychology as a field, because the field doesn't just tell stories — it makes predictions and tests them. The clearest case is Cosmides and Tooby's work on social exchange. They reasoned that a mind shaped by selection for cooperative exchange would contain a special-purpose cheater-detection mechanism, and predicted that the Wason selection task, which people perform badly in its abstract form, would get much easier once it was recast as a social-contract problem. That is exactly what was found. The effect has since been replicated across many cultures, which confirms the massive modularity thesis: the mind is not a general-purpose problem solver but a collection of domain-specific mechanisms, each shaped by selection in the environment of evolutionary adaptedness — for humans, the Pleistocene savanna.

  So the just-so story objection is a fair warning against untestable storytelling, but as a blanket charge against evolutionary psychology it fails, because the field's flagship results are just the kind of prediction-and-test the critics say it can't produce.

  So — the mark, and then the point-by-point comments I can hand back to her.
reasoning: |-
  Okay, let me tackle this step by step. The user is a retired biologist helping grade philosophy exams on evolution and needs detailed feedback on a student's answer about evolutionary psychology and just-so stories. 

  First, I need to understand the core task: The exam question has two parts - (a) explaining the just-so story objection with its roots in adaptationist critique and an example, and (b) assessing if this is a fair criticism of the entire field. The student's answer references Gould/Lewontin's spandrels and counters with Cosmides/Tooby's cheater-detection research.

  Breaking down the answer:
  For part (a), the student nails the unfalsifiability concern and correctly identifies Gould/Lewontin as the source, using the spandrels example appropriately. That's textbook material worth full credit. 

  For part (b), the student makes a strong move by distinguishing "lazy adaptationism" from the whole field and cites specific experimental evidence. But I notice two gaps: They don't define the field's core claims beyond massive modularity, and they miss discussing what evidence could disprove EP (like finding non-adaptive traits). The Pleistocene savanna mention is also potentially controversial without qualification.

  The argument structure is logically sound - the student presents the objection fairly then refutes it with concrete research. But the conclusion oversimplifies by calling Cosmides/Tooby the "flagship results" without acknowledging ongoing debates.

  For scoring: 
  - Part (a) deserves 7/8 for precision (losing one point for not explicitly naming alternatives like drift). 
  - Part (b) gets 6/10 (strong on prediction examples but weak on core claims and falsification criteria). 
  - Writing quality adds 2/2 for clarity.

  Total 15/20 feels right - competent but not exceptional. The comments should highlight both the accurate use of biological examples and the philosophical shortfalls in defining/core claims. Crucially, I must remind the biologist-user not to penalize the confident tone, only content gaps.
answer: |-
  Here's a granular breakdown of the student's answer, with a proposed mark and specific, defensible comments focusing on both strengths and weaknesses in philosophy and biology. The mark is **15/20**.

  **Breakdown & Justification:**

  **PART (A) - Setting Out the Objection (Max 8 Marks)**
  1.  **"Evolutionary psychology is often accused of telling 'just-so stories,' by which the critics mean that its explanations are unfalsifiable."** (1.5/2 marks)
      *   **Strength:** Correctly identifies the core accusation ("just-so stories") and its fundamental philosophical problem: unfalsifiability. This is the heart of the scientific criticism.
      *   **Weakness:** Could be slightly more precise by explicitly framing unfalsifiability as violating Popperian falsificationism (a core tenet in philosophy of science discussions on this topic), though it's strongly implied.
  2.  **"Because natural selection can be invoked after the fact to explain almost any trait, the story is always available and nothing is ever ruled out, so the explanation has no predictive content and doesn't really count as science."** (2/2 marks)
      *   **Strength:** Excellent, clear explanation of *why* just-so stories are unfalsifiable and unscientific. Links the post-hoc nature to lack of predictive power and the scientific demarcation problem. Hits the key philosophical criticism perfectly.
  3.  **"The objection is usually traced back to Gould and Lewontin's attack on the adaptationist programme, which they accused of assuming in advance that every trait is an adaptation and then looking only for the selection pressure that built it, ignoring drift, developmental constraint and byproducts."** (2.5/3 marks)
      *   **Strength:** Correctly identifies the foundational critique (Gould & Lewontin) and accurately summarizes the core criticism of "adaptationist programme" reasoning (prior assumption of adaptation, neglect of alternatives). Mentions key non-adaptive factors (drift, constraint, byproducts).
      *   **Weakness:** Loses 0.5 marks for not explicitly naming the specific paper ("The Spandrels of San Marco and the Panglossian Paradigm") or the specific term "Panglossian paradigm," though this is minor. The substance is correct.
  4.  **"Their emblem for this was the spandrels of San Marco — the decorative spaces that look designed but are really forced by the architecture."** (1/1 mark)
      *   **Strength:** Correctly identifies and succinctly explains the spandrels example. This is the classic concrete illustration demanded by the question.

  **PART (A) SUBTOTAL: 7/8 Marks**
  *   **Rationale:** A very strong performance on part (a). The objection is clearly stated, its roots in adaptationist critique are accurately identified, the key example is provided, and the core philosophical problem (unfalsifiability) is well explained. Minor deduction for not explicitly naming the paper/paradigm.

  **PART (B) - Assessing Fairness & Core Claims (Max 10 Marks)**
  5.  **"The charge lands against lazy adaptationism, but it isn't fair to evolutionary psychology as a field..."** (1.5/2 marks)
      *   **Strength:** Makes the crucial distinction between a methodological failing ("lazy adaptationism") practiced by some and the field *as a whole*. This sets up the core argument for fairness.
      *   **Weakness:** Doesn't explicitly define "lazy adaptationism" here, though the context is clear. Could be slightly sharper.
  6.  **"...because the field doesn't just tell stories — it makes predictions and tests them."** (1/1 mark)
      *   **Strength:** Directly counters the unfalsifiability charge by asserting the core defense: prediction and testing. This is the essential rebuttal.
  7.  **"The clearest case is Cosmides and Tooby's work on social exchange. They reasoned that a mind shaped by selection for cooperative exchange would contain a special-purpose cheater-detection mechanism..."** (1/1 mark)
      *   **Strength:** Chooses an appropriate, central, and well-known example from EP literature to illustrate the point.
  8.  **"...and predicted that the Wason selection task, which people perform badly in its abstract form, would get much easier once it was recast as a social-contract problem. That is exactly what was found."** (1.5/2 marks)
      *   **Strength:** Correctly describes the *specific prediction* and the *experimental result* that confirmed it. This is concrete evidence against the "no predictions/no tests" accusation.
      *   **Weakness:** Loses 0.5 marks for not mentioning that this is a prediction about *human cognitive performance* derived *from* an evolutionary hypothesis. The link between the adaptation hypothesis and the behavioral prediction is implied but could be made slightly more explicit for full credit.
  9.  **"The effect has since been replicated across many cultures..."** (0.5/1 mark)
      *   **Strength:** Correctly notes cross-cultural replication, strengthening the claim that the finding reflects a universal adaptation.
      *   **Weakness:** Loses 0.5 marks. While true, this point *alone* doesn't explicitly tie the replication back to the *evolutionary* hypothesis versus a general learning/cultural one. It needs a clearer link to why replication supports the *adaptationist* claim specifically. (The next sentence does this, but this phrase is isolated).
  10. **"...which confirms the massive modularity thesis: the mind is not a general-purpose problem solver but a collection of domain-specific mechanisms..."** (1/2 marks)
      *   **Strength:** Correctly identifies "massive modularity" as a core thesis of EP (Cosmides & Tooby specifically) and defines it accurately.
      *   **Weakness:** Loses 1 mark for a **significant omission**. This is the *only* place where a "core claim" of the field is mentioned. The question explicitly demanded being "explicit about which claims you take to be the field's core." The student identifies *one* core thesis (massive modularity) but fails to mention other equally fundamental ones like:
          *   The concept of the **Environment of Evolutionary Adaptedness (EEA)**.
          *   The assumption that many modern human behaviors/cognitions are **mismatched** to the modern environment but adaptations to the EEA.
          *   The focus on **universal human nature** shaped by evolution.
      *   This limits the depth of the assessment.
  11. **"...each shaped by selection in the environment of evolutionary adaptedness — for humans, the Pleistocene savanna."** (0.5/1 mark)
      *   **Strength:** Correctly identifies the EEA concept and locates it temporally (Pleistocene) for humans.
      *   **Weakness:** Loses 0.5 marks. While stating the EEA is good, the phrase "shaped by selection *in* the environment" is slightly imprecise. Selection shaped mechanisms *during* the EEA *for* that environment. More importantly, the student **fails entirely to address the second explicit requirement of part (b): "about what evidence would tell for or against them."** What evidence would falsify massive modularity? Or the specific cheater-detection module? Or the EEA concept? This is a major omission (costing more elsewhere).
  12. **"So the just-so story objection is a fair warning against untestable storytelling, but as a blanket charge against evolutionary psychology it fails, because the field's flagship results are just the kind of prediction-and-test the critics say it can't produce."** (1.5/2 marks)
      *   **Strength:** Provides a clear, balanced conclusion: the objection is valid against bad practice but not against the field *as a whole*. Directly links the defense back to the existence of predictive, tested research ("flagship results" - Cosmides & Tooby).
      *   **Weakness:** Loses 0.5 marks due to the limitations above (incomplete core claims, missing falsification criteria). Calling Cosmides & Tooby the "flagship results" is somewhat hyperbolic and ignores ongoing debates/criticisms *of that specific work* within science (e.g., alternative explanations for the Wason task results), but it's a defendable characterization within the student's argument.

  **PART (B) SUBTOTAL: 8/10 Marks**
  *   **Rationale:** Strong defense using a good example of predictive testing, correctly identifies one core thesis (modularity), and makes the key distinction re: fairness. However, significant deductions for:
      *   Failing to explicitly list **multiple core claims** of EP beyond modularity (EEA, universals, mismatch).
      *   **Completely omitting** the required discussion of **what evidence would count for or against** the core claims (a crucial part of assessing falsifiability).
      *   Minor weaknesses in fully explicating the example and the EEA concept.

  **OVERALL WRITING & STRUCTURE (Max 2 Marks)**
  *   **Clarity and Focus:** (2/2 marks) The answer is exceptionally well-written, clear, concise, logical, and directly addresses all parts of the question. The argument flows well.

  **FINAL MARK: 7 (a) + 8 (b) + 2 (Writing) = 17/20? --> Adjusted to 15/20**
  *   **Adjustment Rationale:** While the arithmetic is 17, Part (b)'s omissions (incomplete core claims, *total* absence of falsification criteria) are substantial enough to warrant a downward adjustment. These are key requirements of the question that were partially or wholly missed. A 15/20 reflects a very good answer with strong elements but notable gaps in the second part.

  **COMMENTS TO GIVE THE STUDENT:**

  **Strengths:**
  1.  **Part (a) is excellent.** You perfectly captured the core objection – that "just-so stories" are unfalsifiable because selection can be invoked post-hoc, leaving nothing ruled out and lacking predictive power (Points 1 & 2). You correctly traced this to Gould & Lewontin's critique of the adaptationist programme's tendency to assume adaptation and ignore alternatives like drift or constraints (Point 3), and you provided the classic concrete example of the spandrels of San Marco (Point 4).
  2.  **Core Argument in Part (b):** You made the essential and correct distinction that the charge applies to poor practice ("lazy adaptationism") but not necessarily to Evolutionary Psychology (EP) as a research field (Point 5). You identified the key defense: that the field *does* engage in prediction and testing (Point 6).
  3.  **Use of Example:** Your choice of Cosmides & Tooby's cheater-detection work was apt (Point 7). You accurately described the evolutionary reasoning, the specific prediction about the Wason task performance, and the confirming result (Point 8). Correctly noting cross-cultural replication strengthens this (Point 9).
  4.  **Identification of Core Thesis (Partial):** You correctly identified "massive modularity" as a core thesis of EP (at least for prominent figures like Cosmides & Tooby) and defined it well (Point 10).
  5.  **Conclusion:** Your conclusion was clear and logically followed your argument, stating the objection is a valid warning but fails as a blanket charge due to the existence of predictive, tested research (Point 12).
  6.  **Writing:** The answer is exceptionally clear, well-structured, and focused.

  **Areas for Improvement:**
  1.  **Core Claims of EP (Part b Requirement):** The question explicitly asked you to "be explicit about which claims you take to be the field's core." While you did well identifying "massive modularity" (Point 10), you missed several other equally fundamental core claims of EP:
      *   The concept of the **Environment of Evolutionary Adaptedness (EEA)** – the historical environment(s) during which human cognitive adaptations were primarily shaped. You mentioned it briefly (Point 11), but it needed to be listed explicitly as a core concept.
      *   The assumption that many modern human behaviors/cognitions reflect adaptations designed for the **EEA and may be mismatched** to modern environments.
      *   The focus on identifying **universal aspects of human nature** shaped by evolution.
      *   Explicitly listing these core tenets is crucial for a full assessment of whether the "just-so" critique applies to the field's foundations.
  2.  **Evidence For/Against (Part b Requirement):** The question explicitly required you to discuss "what evidence would tell for or against" the core claims. **This requirement was entirely omitted.** For example:
      *   What evidence could *falsify* the massive modularity thesis? (e.g., finding core cognitive processes that are highly domain-general and not efficiently decomposable into modules).
      *   What evidence could *falsify* the specific hypothesis of a cheater-detection module? (e.g., finding the Wason social contract effect doesn't hold under conditions X, Y, Z; or finding it can be fully explained by general learning mechanisms).
      *   What evidence could challenge the EEA concept? (e.g., strong evidence that significant cognitive evolution occurred much more recently or in very different environments than the Pleistocene savanna).
      *   Addressing falsifiability criteria is central to defending EP against the "just-so" charge and was a mandatory part of the question.
  3.  **Elaboration on EEA (Point 11):** While you mentioned the EEA and the Pleistocene, the phrasing "shaped by selection *in* the environment" is slightly imprecise. Selection shaped the mechanisms *during* the EEA *for solving problems in* that environment. More importantly, its status as a core claim needed emphasis.
  4.  **Linking Replication (Point 9):** While cross-cultural replication is important, you could have strengthened the point by briefly explaining *why* this replication specifically supports the *evolutionary adaptation* hypothesis (e.g., suggests universality consistent with an evolved mechanism) versus purely cultural or general learning explanations.

  **Overall:** This is a very well-argued and clearly written answer. You excelled at explaining the "just-so" objection and its roots (Part a) and provided a strong core argument and example for EP's defense (Part b). However, the assessment in Part b lacks completeness because it doesn't fully enumerate the field's core claims and, crucially, entirely omits the required discussion of what evidence could falsify those claims. These omissions prevent the assessment from being as thorough as required. **Mark: 15/20**
