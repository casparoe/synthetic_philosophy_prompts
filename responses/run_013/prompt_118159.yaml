     *(Derived from Node 6A: Totality view, accepts bijection criterion but rejects diagonal argument.)*

  5. **Leaf 5: Potential Infinitism (for Procedures)**  
     - **Awkward commitment:** Treats infinity as shorthand for unending procedures (e.g., "always a larger prime") but denies uncountable sets exist, even though Cantor’s argument is also procedural.  
