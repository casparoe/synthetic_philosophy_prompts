  The user's critique centers on how the classic Condorcet Jury Theorem (CJT) assumes voter competence and independence as fixed properties, while in reality both seem deeply entangled with specific questions and the agenda-setting process. Their phrase "agenda-relative competence" captures this well - voters aren't uniformly competent across all issues, and assemblies control which questions even get voted on. 

  The key tension they're highlighting: CJT promises reliability through scale, but if the agenda systematically selects questions where voters are incompetent or biased, that reliability could unravel. That's a powerful intuition but needs formalization. 

  For the research question, I need to avoid vagueness. Instead of just "does agenda-setting matter?", we should ask how exactly it interacts with CJT's assumptions. The question must allow for a yes/no answer - either agenda effects can undermine CJT under definable conditions, or they're negligible. 

  The user is torn between formal modeling and case studies. Formal approaches would miss real-world institutional nuance, but pure case studies couldn't prove general mechanisms. A hybrid seems best - start with a model to identify critical variables (like agenda control rules or competence distributions), then test those mechanisms in historical cases where we know the outcomes. 

  For a concrete example: imagine a legislature repeatedly voting on complex tax reforms. If agenda-setters (say, finance committee members) strategically bring votes only when their expert faction dominates, majority votes might track expertise rather than raw numbers - contradicting CJT's prediction. 

  The project could fail if agenda effects turn out negligible in practice, or if modeling proves intractable. Should set a 3-month milestone: if I can't operationalize "agenda-relative competence" into variables by then, pivot to pure institutional analysis. 

  Twelve months is tight but workable: months 1-3 for modeling, 4-7 for case development, 8-10 for synthesis, 11-12 for writing. The bailout point is month 3 - if the formalization stalls, redirect energy to comparative case design. 

  This structure makes the unease tractable: question → gap in literature → method → validation plan → exit strategy. The innovation is treating the agenda as an active filter rather than neutral conduit.
answer: |-
  ## Research Proposal: Agenda-Relative Competence and the Epistemic Undermining of Majority Rule

  **Research Question:**  
  *Can the agenda-setting power of a deliberative body systematically generate conditions (specifically, non-independence and heterogeneous/question-specific voter competence) that violate the assumptions of the Condorcet Jury Theorem (CJT), thereby negating its epistemic defense of majority rule for the very decisions the body makes?*

  **The Gap in the Standard Defense (CJT) and Existing Literature:**  
  The CJT provides a powerful *prima facie* epistemic justification for majority rule: under conditions of minimal individual competence (>0.5) and voter independence, larger groups are more likely to reach correct decisions on binary questions. Existing critiques often focus on relaxing independence (e.g., common causes, information cascades) or challenging uniform competence. However, they typically treat the *question being voted on* as an exogenous, fixed input. This proposal identifies a critical, underexplored gap: **the endogeneity of the agenda**.

  The CJT implicitly assumes competence and independence are inherent properties of voters relative to a *given, fixed* question. Yet, in any real assembly:
  1.  **Competence is Agenda-Relative:** A voter's likelihood of being correct is not uniform; it varies drastically across questions (e.g., technical vs. moral, salient vs. obscure).
  2.  **Independence is Agenda-Mediated:** Correlations in error may arise not from shared biases *per se*, but from shared *exposure* to or *focus* on agenda-specific information, framing, or lobbying.
  3.  **The Agenda is Endogenous:** The body itself (or subgroups within it) selects *which* binary questions reach a vote. This selection process is strategic, path-dependent, and influenced by prior votes, power dynamics, and perceived competence distributions.

  The CJT defense may thus be self-undermining: the mechanism promising reliability (pooling many independent, slightly competent judgments) is filtered through an agenda-setting process that systematically selects questions where voters are *not* competent (>0.5) and/or where their judgments are *not* independent. A body could satisfy the *abstract* assumptions of CJT while being unreliable on its *actual* decisions due to its own agenda control.

  **Approach: Formal Modeling with Illustrative Cases (Hybrid)**  
  A purely formal approach is essential to rigorously demonstrate the *possibility* and *mechanisms* of epistemic undermining, but risks abstraction. A purely case-based approach can illustrate the problem but struggles to prove its *necessity* or *generality*. Therefore, this project employs a **hybrid approach**:

  1.  **Formal Modeling (Core - Months 1-6):**
      *   Develop a modified CJT framework where the agenda is explicitly modeled.
      *   Key Variables: Agenda-setter(s) preferences/knowledge; rules for agenda formation; distribution of voter competence *across potential question types* (e.g., easy/hard, salient/technical); mechanisms linking agenda choice to voter competence/independence on the *selected* question.
      *   Analyze conditions under which agenda-setting leads to:
          *   Systematic selection of questions where average competence <0.5.
          *   Systematic selection of questions inducing positive correlation in errors (e.g., due to shared framing or targeted misinformation on salient issues).
          *   Path dependence where early agenda choices lock in competence-undermining trajectories.
      *   Derive convergence results (or lack thereof) for majority correctness under endogenous agendas.

  2.  **Illustrative Case Studies (Validation & Illustration - Months 7-9):**
      *   Select 2-3 historical/contemporary cases where a deliberative body had significant agenda control and made multiple complex binary decisions (e.g., specific legislative committees, constitutional conventions, expert panels).
      *   Analyze whether agenda-setting processes appeared to steer votes towards questions where:
          *   Expertise was unevenly distributed (implying low competence for many).
          *   Issues were highly polarized or emotionally charged (potentially inducing correlated errors).
          *   Outcomes deviated significantly from what a "neutral" agenda might predict.
      *   These cases *do not* "test" the model statistically but illustrate its plausibility, provide concrete examples of agenda-relative competence, and suggest real-world mechanisms omitted from the pure model.

  **What the Other Approach Would Miss:**  
  *   *Pure Formalism:* Would miss the concrete mechanisms of agenda manipulation, the observable impact on decision outcomes, and the practical significance of the theoretical possibility. It risks being dismissed as a mathematical curiosity.
  *   *Pure Case Study:* Could not establish the *general possibility* or *necessary conditions* for epistemic undermining. It might show agenda *matters*, but not *how* it systematically violates CJT assumptions in a way that negates its defense. It could be countered by arguing the cases are idiosyncratic.

  **Plausible Shape of the Result & Concrete Example:**
  *   **Result:** The formal model will likely show that under plausible conditions of strategic agenda-setting (e.g., agenda control by a faction, or selection driven by salience rather than ease), the probability of majority correctness can *decrease* with group size or remain bounded *below certainty* for the questions actually voted on, even if the abstract CJT conditions hold over the *universe* of potential questions. Agenda can induce *de facto* incompetence or dependence.
  *   **Concrete Illustrative Verdict Difference:**
      *   **CJT Prediction (Exogenous Agenda):** A large, diverse city council voting on a randomly selected zoning issue (assumed average competence ~0.55, independence) has a high probability (>0.95) of a correct decision.
      *   **Revised Model Prediction (Endogenous Agenda):** The same council, controlling its agenda, consistently prioritizes highly technical, developer-backed infrastructure bond votes (where only a few members grasp the details, average competence ~0.48) and emotionally charged neighborhood rezoning conflicts (where strong group identities induce correlated errors). The probability of a correct majority vote on these *actual* agenda items remains low (<0.7) despite the council's size. The CJT defense fails for its *actual* decisions.

  **What Would Count as Failure:**
  1.  **Formal Intractability:** If modeling agenda-setting explicitly within a CJT framework proves mathematically intractable or yields only trivial, unrealistic results that don't capture the core concern (Months 1-3).
  2.  **Negligible Impact:** If the model consistently shows that even highly strategic agenda-setting only marginally reduces the convergence speed or asymptotic probability of correctness, leaving the core CJT defense largely intact for practical purposes.
  3.  **Case Disconnect:** If compelling illustrative cases cannot be found where the agenda plausibly induced systematic competence <0.5 or strong dependence *and* led to potentially incorrect outcomes, suggesting the problem is rare or insignificant.

  **Realistic 12-Month Plan:**
  *   **Months 1-3:** Literature deep dive (formal social choice, CJT variants, agenda-setting theory). Develop core formal model framework (defining agenda space, selection mechanisms, competence distributions).
  *   **Months 4-6:** Formal analysis of the model. Derive key results on convergence/undermining under different agenda-setting assumptions. Identify critical parameters/conditions.
  *   **Months 7-8:** Identify and select 2-3 illustrative case studies. Develop criteria for case selection. Begin preliminary case research.
  *   **Month 9:** Conduct focused analysis of case studies, mapping findings onto model mechanisms and parameters.
  *   **Months 10-11:** Synthesize formal and case results. Draft research paper/manuscript sections. Refine argument.
  *   **Month 12:** Complete full draft of research paper for target journal. Prepare presentation of findings.

  **Bailout Point (Month 3):**  
  If, by the end of Month 3, the formal modeling proves intractable despite concerted effort (e.g., cannot define a workable model capturing agenda relativity and competence heterogeneity without collapsing into triviality or excessive complexity), **pivot immediately** to a primarily conceptual/case-based project. The new focus would be: rigorously defining and arguing for "agenda-relative competence" as a necessary concept, documenting its empirical manifestations through detailed case studies of specific bodies, and arguing conceptually why this necessitates a fundamental re-evaluation of the CJT defense, even without a novel convergence result. This ensures a viable, high-quality output within the year.
