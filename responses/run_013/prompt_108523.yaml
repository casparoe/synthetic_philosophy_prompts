  ### Minute-by-Minute Timeline (90 Minutes Total)
  **Slack built in: 10 minutes distributed across activities. Adjust by shortening debrief or skipping third movement if needed.**
  - **0:00–0:04 (4 min): Framing**  
  - **0:04–0:10 (6 min): Trading Game Setup & Example**  
  - **0:10–0:15 (5 min): Stage 1 Trading**  
  - **0:15–0:20 (5 min): Evidence Event**  
  - **0:20–0:25 (5 min): Stage 2 Trading**  
  - **0:25–0:30 (5 min): Loss Calculation & Display**  
  - **0:30–0:40 (10 min): Break Movement (Corrupted Later Self)**  
  - **0:40–0:45 (5 min): Third Movement (Instruction Writing)**  
  - **0:45–1:25 (40 min): Debrief**  
  - **1:25–1:30 (5 min): Final Summary**  

  ---

  ### Materials List & Printed Sheets
  - **Whiteboard and markers** (for rules, calculations, and debrief notes).  
  - **Index cards** (42 total: 14 students × 3 cards each).  
  - **Sealed envelope** (1, prepared before class; contains a slip with "HEADS" or "TAILS" from a prior coin flip).  
  - **Poker chips or tokens** (200 total; 100 for students, 100 for the house).  
    - Give each student 10 tokens at start (140 tokens), house holds 60.  
  - **Biased "evidence" coin** (1, fixed to land heads; e.g., two-headed coin or pre-flipped).  
  - **Regular coin** (1, for optional demonstration; not used in game).  
  - **Printed sheet for whiteboard (rules only)**:  
    > **House Rules**  
    > 1. At each stage, the house may trade with any participant at the price they quote for a ticket on A.  
    > 2. The house chooses which side of the trade to take.  
    > 3. A ticket pays 100 tokens if A is true, 0 if false.  
    > 4. Quotes must be between 1 and 99.  

  ---

  ### Script: Exact Words for Framing, Rules, Transitions, and Activities
  #### **0:00–0:04 (4 min): Framing**  
  *Stand at front, hold tokens and envelope.*  
  "Today, we’re playing a game about beliefs and bets. No real money—just tokens. You start with 10 tokens each. There’s a proposition A: ‘The coin flip sealed in this envelope is heads.’" *Tape envelope to board.* "No one knows A. We’ll have two trading rounds. I’m the house. The rules are simple and on the board. We trade tickets on A. A ticket pays 100 tokens if A is true, nothing otherwise. Your job: quote a price for a ticket that reflects your confidence in A. Write it on cards. Questions? Go."  

  #### **0:04–0:10 (6 min): Trading Game Setup & Example**  
  *Point to rules on board.*  
  "First, understand A and evidence. This evidence coin" *hold it up* "is biased. If A is true, it lands heads 70% of the time. If A is false, heads 30%. So heads supports A. We’ll flip it once. You’ll update your confidence after seeing it. Example: if you’re 50% confident in A now and see heads, recalculate. Math: (50% × 70%) / [(50% × 70%) + (50% × 30%)] = 35 / (35 + 15) = 70%. So you’d update to 70%. Write your initial confidence—called p—between 1 and 99 on a card. You have 2 minutes."  
  *Wait 2 min, collect cards.*  

  #### **0:10–0:15 (5 min): Stage 1 Trading**  
  *Read first card aloud; hold tokens.*  
  "[Name], you quoted p = [number]. I choose to buy a ticket from you at this price. So you owe me 100 tokens if A is true, and I give you [p] tokens now." *Hand student p tokens. Repeat for all 14 students. If a student lacks tokens, use house reserve; no debt.*  
  "Trade done. Hold your tokens."  

  #### **0:15–0:20 (5 min): Evidence Event**  
  *Flip evidence coin (ensure it lands heads), show class.*  
  "It landed heads. Update your confidence in A using the same math as the example. This is your new quote, q. Write q on a new card. You have 2 minutes."  
  *Wait 2 min, collect cards.*  

  #### **0:20–0:25 (5 min): Stage 2 Trading**  
  *Read second card aloud.*  
  "[Name], you quoted q = [number]. I choose to sell a ticket to you at this price. So you pay me [q] tokens now, and I owe you 100 tokens if A is true." *Collect q tokens. Repeat for all.*  
  "Trade done."  

  #### **0:25–0:30 (5 min): Loss Calculation & Display**  
  *Write on board: "Stage 1: You gained p tokens. Stage 2: You paid q tokens. Net: p - q."*  
  "Check your tokens. You started with 10, got p, paid q. Net change: 10 + p - q. Since q > p for everyone, you lost q - p tokens. I gained that. Let’s see:"  
  *For each student, write on board: "[Name]: p=[p], q=[q], loss=[q - p]".*  
  "No need to open the envelope—your tickets canceled out. You owed me 100 if A, I owed you 100 if A. Net zero. Only tokens moved."  

  #### **0:30–0:40 (10 min): Break Movement (Corrupted Later Self)**  
  *Erase board, speak casually.*  
  "Now, imagine after class, you go to a party, get drunk, and lose critical thinking. A stranger asks your confidence in A. Drunk, you’ll say 90%—no matter what. Before the party, what’s your confidence in A now, knowing your drunk self will say 90%? Call this r. Write r on a new card."  
  *Wait 2 min, collect cards. Skim; if not all 90, continue.*  
  "If your r isn’t 90, you’re vulnerable. Suppose you said r=80. Now, I buy a ticket from you at 80. Later, your drunk self (90%) sells me a ticket at 90. I gain 10 tokens, and tickets cancel. Same if r>90—I sell now, buy later. Loss for you. Only r=90 avoids this."  

  #### **0:40–0:45 (5 min): Third Movement (Instruction Writing)**  
  "Write an instruction to your drunk self on a card. Examples: ‘Don’t answer,’ ‘Stick to 50%,’ or ‘Remember sober you.’"  
  *Collect cards immediately.* "We’ll discuss what you wrote in debrief."  

  #### **0:45–1:25 (40 min): Debrief**  
  *Map moments to ideas; write key terms on board.*  
  "First, the trading game. You quoted p, then q after evidence. I profited from your change. Why? **Your inconsistency across time is exploitable**, like inconsistent beliefs now. If you’d quoted the same price both times, no loss. This mirrors how **a current inconsistency between credences can be Dutch-booked**."  

  "Second, why did you update to q? **You treated your future self as better informed**—evidence about A moved you. That’s rational. **Your initial deference intuition was that a better-informed later credence is evidence about A**."  

  "Third, the drunk case. **The very principle that booked you now says you must adopt the corrupted credence in advance**—set r=90%. But that feels absurd. Why? **This shows the limit of the principle**: it assumes your future self is rational and has at least your evidence. Drunk, you’re neither."  

  "Fourth, your instructions. Some said ‘Don’t answer.’ **This highlights the difference between belief and action**. You should *believe* what you expect to believe later (if rational), but you might *act* to prevent irrational beliefs—like avoiding the party."  

  #### **1:25–1:30 (5 min): Final Summary**  
  *Point to board.* "Today, you felt a principle: **your current credence in A, given your future credence will be x, should be x**. It ensures coherence across time. Break it, and you’re exploitable. But it’s not absolute—future you must be rational. We’ll name and formalize this next week."  

  ---

  ### Predictable Failure Modes and Solutions  
  1. **Risk aversion causing unfair quotes (e.g., quoting 40 for true 50% credence)**:  
     - **What happens**: House profit evaporates if quotes misrepresent true credences.  
     - **Solution**: At setup, stress: "Quote the price making you indifferent to buying/selling. Not a hedge." If quotes cluster low, note in debrief: "Risk aversion distorts quotes—today, we assume neutrality."  

  2. **Participant announces the principle early (e.g., "This is Reflection!")**:  
     - **What happens**: Disrupts tension; peers disengage.  
     - **Solution**: Respond: "Hold that insight—write it down. We’ll unpack it later." Move quickly to next activity.  

  3. **Misupdating after evidence (e.g., no change or wrong calculation)**:  
     - **What happens**: Losses small or absent; house profit inconsistent.  
     - **Solution**: During setup, drill the example: "Heads always increases confidence—calculate like this." If errors, use debrief: "Some updates weren’t Bayesian—real life has noise, but the point holds."  

  4. **Token shortage in Stage 2 (e.g., student has 5 tokens but q=70)**:  
     - **What happens**: Trade stalls; student embarrassed.  
     - **Solution**: Give house tokens upfront. If shortage, say: "I’ll cover it—pay what you can." Adjust loss calculation pro-rata.  

  5. **Time overrun (likely in trading or debrief)**:  
     - **What happens**: Rushed debrief; break movement omitted.  
     - **Solution**: Cut third movement at 0:40 if behind. Shorten debrief examples. Protect the first trading game (load-bearing).  

  ---

  ### What the Activity Cannot Reproduce (Frank Paragraph)  
  The activity cannot reproduce the formal justifications and boundary conditions of the Reflection principle. It induces an intuitive feel for diachronic incoherence and the deference intuition, but it does not derive the principle from more basic axioms (e.g., conditionalization or Dutch book theorems), nor does it rigorously define the conditions under which Reflection holds (e.g., rational updating, no loss of evidence, no self-undermining beliefs). You will need to supply: the formal statement (C_t(A | C_{t+Δ}(A) = x) = x), the distinction between belief and action, the connection to Bayesian conditionalization, and the caveats (e.g., inadmissibility when future selves are irrational). The activity creates the "aha" moment; you build the framework around it.

  ---

  \answer{The first trading game, where students see their own quotes (p and q) turn into a calculable loss for them and a margin for the house, does the load-bearing work. Protect this if cutting for time.}
