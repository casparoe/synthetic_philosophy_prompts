  First, I need to outline the core considerations in constitutional design. The critical distinctions include binding one's own future self versus successors, ensuring mechanisms survive weakness of will, and differentiating between procedural shields and mere preferences. These concepts form the foundation of the procedure.

  For the procedure itself, I'll structure it as numbered steps that flow logically. Starting with verifying temporal alignment ensures the current body binds its future iterations. The durability test checks if the constraint addresses a predictable failure mode. The exit valve step prevents creating permanent constraints while allowing reasonable escape routes. The agency test distinguishes between binding oneself versus others, crucial for legitimacy. Finally, evaluating enforcement mechanics ensures the constraint is practically maintainable.

  Applying this to the parkland example: It passes temporal alignment (same city council), durability (prevents rash land sales), and has a clear exit valve (supermajority). The foundation payout freeze might fail on temporal alignment if the board binds future unrelated boards, making it feel imposed rather than self-bound.

  I should include a realistic rejection scenario, like binding successors without continuity. Also, note that value judgments about "how binding is justified" remain with the client's governing body. The procedure flags mechanical viability but can't resolve deeper philosophical disagreements.

  The user's deeper need seems to be avoiding past mistakes where constraints felt arbitrary or were circumvented. By focusing on self-binding legitimacy and practical enforceability, the procedure addresses their frustration with improvisation. Keeping it judgment-aware—explicitly marking where client input is needed—maintains transparency about the advisor's role versus the governing body's authority.
answer: |-
  ## Considerations
  Constitutional self-binding requires the current decision-maker to genuinely constrain its *own future iterations* against predictable, dangerous impulses, not impose rules on distinct successors. Load-bearing distinctions:  
  1. **Temporal Self-Binding vs. Binding Successors**: Binding your *own* future self (e.g., next year's board) is legitimate precommitment; binding an entirely new generation (e.g., after generational turnover) becomes imposition.  
  2. **Failure Mode Specificity**: The constraint must target a specific, predictable weakness of will (reckless sale, short-termism), not just future disagreement.  
  3. **Surviving Weakness vs. Relocating It**: The mechanism must withstand the *very* impulse it guards against. If the constraint can be easily bypassed *by* the weakened future self (or their allies), it fails.  
  4. **Procedural Shield vs. Substantive Entrenchment**: Focus on *how* decisions are made (supermajorities, delays), not immutable outcomes (absolute bans). This respects future agency while raising the bar for change.  

  ## Procedure
  1.  **Temporal Alignment:**  
      *   *Question:* "Is the body being bound *functionally identical* to the body creating the rule? (e.g., current board binds future boards of *this same organization* under *this same mandate*)."  
      *   *Sufficient Answer:* "Yes, the same electorate/governance structure persists; we are binding our *own* future decisions under essentially the same circumstances."  
      *   *Stop If:* "No" (e.g., binding a fundamentally different future entity/society). Proceed if "Yes".
  2.  **Durability Test (Predictable Weakness):**  
      *   *Question:* "What *specific, recurring failure mode* of the future self does this clause guard against? Is this failure a predictable temptation arising *directly* from the entity's core purpose or context?"  
      *   *Sufficient Answer:* A clear description of a foreseeable scenario (e.g., "pressure to sell assets quickly during a fiscal crisis," "temptation to raid endowment for popular short-term projects").  
      *   *Stop If:* Vague ("future stupidity"), purely ideological ("they might disagree with us"), or no identifiable *weakness-of-will* scenario. Proceed if specific failure identified.
  3.  **Exit Valve Assessment:**  
      *   *Question:* "Does the mechanism allow the *legitimate future self* to override it under *extreme, unforeseen circumstances* without destroying the mechanism itself? Is the override procedure *robust* against the predicted weakness?"  
      *   *Sufficient Answer:* "Yes, override is possible but requires a demanding procedure (e.g., supermajority + delay) explicitly designed to be *harder* than acting under the predicted weakness." OR "No override is justified because the scenario protected against *is* the existential threat." (Use sparingly).  
      *   *Stop If:* Override is too easy (simple majority vote) OR impossible (absolute, perpetual entrenchment). Proceed if override exists and is genuinely difficult *in the context of the predicted weakness*.
  4.  **Agency Test (Self-Binding vs. Imposition):**  
      *   *Question:* "Could a *rational, well-intentioned future self*, fully informed and not suffering the predicted weakness, plausibly *want* to change this rule for legitimate reasons unrelated to the failure mode? Is the constraint *only* targeting the predicted bad impulse?"  
      *   *Sufficient Answer:* "Changing the rule outside the failure mode is unlikely or would signal a fundamental shift in mandate/purpose." OR "The constraint is narrow (procedural) enough that it doesn't prevent legitimate adaptation."  
      *   *Stop If:* The rule prevents significant, *legitimate* future adaptation unrelated to the failure mode. Proceed if narrowly tailored.
  5.  **Enforcement Mechanics:**  
      *   *Question:* "Who polices this? Is enforcement insulated from the predicted weakness? What happens if they are complicit or weak?"  
      *   *Sufficient Answer:* "Designated external arbiter (court, defined third party) with clear standing/rules," OR "Self-enforcing procedural hurdle impossible to bypass administratively," OR "Clear public visibility/accountability makes violation politically costly."  
      *   *Stop If:* Relies solely on the goodwill of future actors susceptible to the weakness or lacks a credible enforcement path. Proceed if credible, insulated enforcement exists.

  **Where Judgment Appears:** Steps 2 (defining the specific failure mode), 3 (assessing override robustness *against that specific weakness*), and 4 (distinguishing bad impulse from legitimate adaptation) require significant client context and judgment. The procedure forces explicit justification but doesn't eliminate subjectivity.

  ## Two Applications

  1.  **City Parkland Clause (2/3 vote to sell/rezone):**
      *   **Step 1:** Yes (Binds future city councils of the same city).
      *   **Step 2:** Yes (Predicts rash sale/development pressure during fiscal crises or developer influence).
      *   **Step 3:** Yes (Override possible via demanding supermajority; robust against rash impulses needing quick simple majority).
      *   **Step 4:** Yes (Narrowly targets sale/rezone; legitimate adaptation (e.g., swapping parkland) still possible, just harder).
      *   **Step 5:** Yes (Enforceable via courts; violation requires public vote, creating political cost).
      *   **Verdict:** Likely valid self-binding.

  2.  **Foundation Payout Freeze (Unanimity to raise rate):**
      *   **Step 1:** *Judgment Call* (Depends on board turnover/continuity. If high turnover, risks binding distinct successors).
      *   **Step 2:** Yes (Predicts pressure to spend down endowment for short-term impact).
      *   **Step 3:** *Problem* (Unanimity is extremely hard; may prevent *any* adaptation even to existential threats like mission irrelevance or legal changes).
      *   **Step 4:** *Problem* (Freezing a rate prevents legitimate adaptation to new investment realities or needs; not narrowly procedural).
      *   **Step 5:** Yes (Enforceable by courts/state AG).
      *   **Verdict:** **Likely Reject** (Fails Step 3 & potentially Step 4; unanimity is often *too* strict and targets substance, not just impulse. Suggest supermajority + independent financial review instead).

  ## Where the Procedure Rules Against the Client
  *   **Proposal:** A founding board wants a bylaw requiring 100% board agreement to ever decrease the mandatory annual contribution rate to a pension fund.
  *   **Why Rejected:**
      *   **Step 3 (Exit Valve):** Unanimity offers *no* practical exit valve. If funding becomes genuinely unsustainable due to market collapse or demographic shift, the rule forces insolvency. It doesn't survive the existential threat.
      *   **Step 4 (Agency):** Prevents legitimate, necessary financial management unrelated to the predicted weakness (overspending). It's overly substantive.
      *   **Judgment:** A supermajority (e.g., 80%) + actuarial certification requirement might pass, but 100% fails the robustness and narrow tailoring tests.

  ## What the Procedure Cannot Settle
  *   **Fundamental Value Conflicts:** Whether the *specific predicted failure* justifies binding the future self *this much* is a value judgment for the governing body. The procedure ensures mechanical coherence and legitimacy but doesn't answer "Is protecting parkland *worth* limiting democratic flexibility?" or "How much endowment stability is *worth* reduced spending agility?"
  *   **Ultimate Effectiveness:** Guaranteeing the constraint will *actually* work decades later against determined opponents is impossible. The procedure maximizes *principled design* for survival.
