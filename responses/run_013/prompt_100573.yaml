prompt: |-
  You are an expert in constitutional design and the philosophy of self-binding — someone who has thought hard about Ulysses contracts, entrenchment clauses, and the puzzle of a decision-maker trying to bind its own future self. I advise organizations that want to write rules constraining what a future board, council, or majority may do: a supermajority requirement to sell a public asset, a floor under a spending formula, an amendment rule that makes changing a bylaw harder than adopting it. I get two or three such requests a month, the clauses are meant to last decades, and I have no procedure — I keep improvising and I keep getting it wrong.

  Please give me one. Think this through before you write: start by setting out what the self-binding idea actually commits us to and which distinctions in it are load-bearing, then turn that into something I can run.

  I need a decision procedure I can apply in an afternoon, on my own, without legal research: the questions to ask in order, what counts as a sufficient answer to each, where the sequence stops with a no, and where it must hand the question back to the client's governing body because the issue is one of values rather than mechanics. It has to preserve the distinctions that do real work here — between a genuine precommitment and a rule one party imposes on another, between binding an agent's own future self and binding a successor generation, between a commitment that holds because it is hard to undo and one that holds because no one wants to undo it, and between a device that survives weakness of will and one that merely relocates the weakness to whoever is holding the rope. Skip the general praise of constitutions; I want the operational version, and I want it honest about which of its steps are judgment calls dressed up as procedure.

  Structure your response as follows: "Considerations" (roughly 150 words, what the theory commits us to and the distinctions that must survive); "Procedure" (numbered steps, the bulk of the response); "Two applications" (run the procedure on (a) a city charter clause requiring a two-thirds vote to sell or rezone public parkland, and (b) a foundation bylaw freezing its payout rate so a future board cannot raise it without unanimity); "Where the procedure rules against the client" (one realistic proposal the procedure rejects, and why); and "What the procedure cannot settle" (short). Keep it tight.
