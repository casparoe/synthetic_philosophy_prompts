prompt: |-
  I'm putting together materials for a graduate workshop on decision theory, and I've been asked to referee a long-running argument between two colleagues: one is a committed defender of risk-weighted expected utility — the view that a rational agent may transform the probabilities of outcomes through a monotone "risk function" before aggregating them with utility, so that the good–bad ranking of outcomes, and not only their probabilities and values, enters into choice — and the other is a committed defender of classical, Savage-style expected utility maximization, for whom the sure-thing principle and the associated separability of the representation are genuine requirements of practical rationality, not optional conveniences. They have been circling each other for months: one hears "you are simply building irrationality into an axiom," the other hears "you are insisting on a principle that the Allais and Ellsberg patterns already discredited." I would like the document they should have written together instead — an adversarial-collaboration statement that both of them could put their names to.

  What I want in it: first, a numbered section of claims both sides can sign, covering what each formalism actually asserts, what the representation theorems do and do not deliver, which preference patterns are common ground (that people exhibit Allais-type and Ellsberg-type preferences, for instance), and what the dispute is not about — I suspect, for one, that both can agree it is not a fight over whether agents can be *represented*, since representability is cheap, but over which representations earn the label "rational." Second, an exact statement of each remaining disagreement, each phrased the way its own side would want it put: the status of the sure-thing/separability axiom; whether a non-linear weighting of probability can be distinguished, in principle and in practice, from a re-description of the utility function — that is, whether the risk function has content that is separately identifiable; whether the agent's attitude is toward risk as such or toward the *resolution* of uncertainty; and whether anything normative follows from the money-pump and Dutch-book constructions that the expected-utility side leans on. Third, a disagreements table whose rows are the cruxes: for each, a neutral statement of the sub-question, the argument or case both sides agree would bear on it, and each side's prediction recorded in advance. Please include at least one crux built around the "small world versus grand world" problem — the fact that real agents never face a decision over a genuinely complete partition of states — which I think cuts differently for the two views and which neither side has fully faced. To keep the cruxes concrete rather than verbal, invent one or two small decision problems (a one-shot gamble with a modest number of outcomes and an unambiguous good–bad ranking will do) and have the two sides state in advance what each predicts about the same pair of choices, including where their predictions coincide and where they part.

  Finally, because I will be circulating this to students who would otherwise read it as a verdict: mark clearly what is settled among people who actually work on this and what is genuinely contested, and do not present either camp's position as the consensus. If some part of the apparent dispute turns out to be verbal — a disagreement about how to describe a shared set of preferences rather than about what to choose — say which part and why.
reasoning: |-
  We are drafting an adversarial collaboration statement between a defender of risk-weighted expected utility (RWEU) and a defender of classical expected utility (EU). The goal is to have a document both can sign, with sections for agreements, disagreements, and concrete cruxes.

  Structure:
  1. Section of claims both sides agree on (numbered).
  2. Exact statements of each remaining disagreement, phrased by each side.
  3. A disagreements table with cruxes, including a neutral question, the case or argument, and each side's prediction. Include at least one crux on "small world vs grand world".
  4. Clearly mark what is settled and what is contested. Identify any verbal disputes.

  We proceed step by step.

  ## Step 1: Common Ground (Numbered Agreements)

  Both sides agree on:

  1. **Representation Theorems**: Both EU and RWEU have representation theorems that show that if an agent's preferences satisfy certain axioms, then they can be represented by the respective functional forms. 
     - For EU: Savage's axioms (including the sure-thing principle) imply a unique (up to affine transformation) utility function and a subjective probability measure such that the agent maximizes expected utility.
     - For RWEU: A set of axioms (e.g., those in Quiggin's rank-dependent utility or more generally for risk-weighted models) implies a representation with a utility function and a (typically non-linear) weighting function applied to cumulative probabilities.

  2. **Empirical Evidence**: It is well-established that many people exhibit preferences that violate the independence axiom (Allais paradox) and the sure-thing principle (Ellsberg paradox) in ways that are robust and systematic. Both sides agree that these patterns are common and that any descriptively adequate theory must account for them.

  3. **Normative vs. Descriptive**: The dispute is not primarily about descriptive adequacy (since both acknowledge that EU is descriptively inadequate in some cases) but about normative rationality. The EU defender argues that the axioms (like the sure-thing principle) are requirements of rationality, while the RWEU defender argues that they are not.

  4. **The Nature of the Dispute**: The disagreement is about the normative status of the axioms, particularly separability (sure-thing principle) and linearity in probabilities. It is not about whether agents can be represented (since both can be represented by their respective models) but about which representation captures rational choice.

  5. **The Role of Risk**: Both agree that the concept of "risk" is central to decision-making. However, they disagree about whether risk attitudes should be captured solely through the curvature of the utility function (EU) or also through a transformation of probabilities (RWEU).

  6. **Money Pumps and Dutch Books**: Both agree that money pump arguments and Dutch books are used in the EU camp to argue for the irrationality of violating the axioms. However, the RWEU defender argues that these arguments do not apply in realistic dynamic settings or that they can be avoided by agents who are aware of their own preferences.

  ## Step 2: Exact Statements of Disagreements

  We now state the key disagreements, each phrased in the way the respective side would want.

  ### Disagreement 1: The Status of the Sure-Thing Principle (Separability)

  - **EU Defender**: "The sure-thing principle is a fundamental requirement of rationality. It ensures that decisions are separable across mutually exclusive events. Violating it leads to inconsistent choices that can be exploited, for instance via money pumps. Moreover, it is essential for reasoning in complex, uncertain worlds because it allows us to break down decisions into manageable parts without worrying about correlations with irrelevant events."

  - **RWEU Defender**: "The sure-thing principle is not a necessary requirement for rationality. It forces an agent to ignore the context of uncertainty, specifically how outcomes are distributed across states. Risk-weighted expected utility allows for a rational sensitivity to the dispersion of outcomes, which is particularly important in situations of ambiguity (like Ellsberg) or when the agent has a non-neutral attitude toward risk that cannot be captured by utility curvature alone. The sure-thing principle is a convenience for modeling, not a rational imperative."

  ### Disagreement 2: Distinguishing Probability Weighting from Utility

  - **EU Defender**: "Any apparent deviation from linear probability weighting (as in Allais or Ellsberg) can be explained by a re-specification of the utility function. For instance, the utility function may be state-dependent or may reflect disappointment aversion. Without independent constraints on the utility function, the risk function is not separately identifiable. Thus, the risk function is an unnecessary addition that complicates the theory without adding explanatory power."

  - **RWEU Defender**: "The risk function is independently identifiable because it captures a different aspect of preference: the attitude toward the distribution of outcomes, not just their levels. For example, in rank-dependent models, the weighting function is applied to cumulative probabilities, which depends on the ordering of outcomes. This allows us to model risk aversion for gains and risk seeking for losses (as in prospect theory) in a way that a utility function alone cannot. Moreover, we can design experiments that vary the probability distribution while holding the utility of outcomes fixed to reveal the risk function."

  ### Disagreement 3: Attitude Toward Risk vs. Resolution of Uncertainty

  - **EU Defender**: "Attitudes toward risk are entirely captured by the curvature of the utility function. The resolution of uncertainty is not a separate object of preference; it is handled by the probability measure. If an agent cares about when uncertainty resolves, that should be built into the description of the outcomes (e.g., by including the timing of resolution in the outcome)."

  - **RWEU Defender**: "The agent may have preferences over the timing of uncertainty resolution, which is distinct from the utility of outcomes. Risk-weighted expected utility can be extended to capture preferences for early or late resolution. Moreover, the risk function can reflect an aversion to uncertainty that is not reducible to outcome utilities. For example, in the Ellsberg paradox, the aversion is to the ambiguity (lack of a known probability) and can be modeled by a risk function that overweights the worst-case scenario."

  ### Disagreement 4: Normative Force of Money Pumps and Dutch Books

  - **EU Defender**: "Money pump arguments and Dutch books show that violating the axioms of expected utility (like transitivity or the sure-thing principle) leads to decisions that are demonstrably self-defeating. An agent who violates these axioms can be turned into a 'money pump', losing wealth for sure. This is a clear normative failure: rationality requires avoiding such sure losses."

  - **RWEU Defender**: "These arguments assume that the agent does not anticipate the sequence of choices and that the decision problems are presented in a way that isolates each choice. In reality, an agent with RWEU preferences can avoid being money-pumped by recognizing the dynamic context and planning ahead. Moreover, the money pump scenarios are artificial and do not reflect typical decision environments. Thus, they do not have normative force against RWEU."

  ## Step 3: Cruxes Table

  We design a table with crux issues. Each row has:

  - A neutral question.
  - The argument or case both sides agree would bear on it.
  - The EU defender's prediction.
  - The RWEU defender's prediction.

  We include one crux on "small world vs grand world".

  ### Crux 1: The Small World vs Grand World Problem

  - **Neutral Question**: In a decision problem that is a small part of a larger world (with background uncertainty), do the preferences prescribed by EU and RWEU differ in a way that leads to divergent choices?

  - **Argument/Case**: Both sides agree that real agents face background uncertainty. We consider a one-shot gamble that is small relative to the agent's overall wealth. We design a pair of choices:

    - **Choice 1**: A gamble A that offers $100 with probability 0.5 and $0 otherwise.
    - **Choice 2**: A gamble B that offers $100 with probability 0.51 and $0 otherwise.

    Now, we embed these in a "grand world" where the agent also faces an independent background risk: with small probability p (say, 1%), the agent will lose $1000.

    We ask: In the grand world, does the agent's preference between A and B change?

  - **EU Prediction**: The EU agent will have consistent preferences regardless of background risk because the sure-thing principle allows separability. The background risk is independent, so it adds a constant (in utility terms) to both options. Thus, if the agent prefers B to A without background risk, they will still prefer B to A with background risk.

  - **RWEU Prediction**: The RWEU agent may change their preference because the background risk affects the overall distribution of outcomes. For example, if the agent uses a risk function that is concave for losses, the background risk might make the agent more risk averse for the small gamble. Thus, even if without background risk the agent prefers the higher probability (B), with background risk they might prefer the safer option (A) or vice versa, depending on the risk function.

  ### Crux 2: Distinguishing Probability Weighting from Utility

  - **Neutral Question**: Can we design an experiment that distinguishes between a non-linear probability weighting (as in RWEU) and a re-specification of the utility function (as in EU)?

  - **Argument/Case**: Consider two gambles:

    - Gamble X: 90% chance of $100, 10% chance of $0.
    - Gamble Y: 100% chance of $88.

    Now, we observe that many people prefer Y over X (exhibiting risk aversion). Then, consider:

    - Gamble X': 90% chance of $100, 10% chance of $50.
    - Gamble Y': 100% chance of $88.

    In this case, if the preference switches to X' over Y', it suggests that the initial risk aversion in the first pair might be due to a non-linear weighting of the 10% chance of getting $0 (which is now $50) rather than the utility of $88.

  - **EU Prediction**: The EU defender predicts that the same utility function (e.g., concave) should explain both choices. If the agent is risk averse, they might prefer Y in the first pair and Y' in the second if the utility function is concave. However, if the agent switches to X' in the second pair, the EU defender would say that the utility function must have a kink or be reference-dependent (like prospect theory's value function). But note: the EU defender allows for such utility functions. However, they would argue that without independent constraints on the utility function, the switch does not force a probability weighting function.

  - **RWEU Prediction**: The RWEU defender predicts that the switch is natural under a risk function that overweights small probabilities of bad outcomes. In the first pair, the 10% chance of $0 (a bad outcome) is overweighted, making X less attractive. In the second pair, the 10% chance is of $50 (which is not bad), so it is not overweighted (or less so), making X' more attractive. Thus, the switch is evidence for a risk function that depends on the ranking of outcomes.

  But note: both sides might agree that the switch happens. The crux is whether the EU defender can explain it without a probability weighting. The RWEU defender says no, the EU defender says yes (e.g., by a utility function that is more concave for losses and less for gains).

  To make it a crux, we need a case where the outcomes are designed so that the utility function, if it is state-independent and without probability weighting, cannot explain the switch. For example, if the outcomes are all gains and we observe a switch when we change the bad outcome to a less bad one, then EU with a concave utility would not predict a switch (because the marginal utility between $50 and $88 is less than between $0 and $88). But if the agent becomes risk seeking for the second pair, then it would be hard for EU to explain without probability weighting.

  However, we can use a case from the Allais paradox:

    - Problem 1: 
        Option A: $1M for sure.
        Option B: $1M with 89%, $5M with 10%, $0 with 1%.

    - Problem 2:
        Option C: $1M with 11%, $0 with 89%.
        Option D: $5M with 10%, $0 with 90%.

  Many people prefer A over B and D over C. This violates EU. RWEU explains it by overweighting the 1% chance of getting $0 in B, making B less attractive. In problem 2, the 89% chance of $0 is common to both, so the overweighting applies similarly to both? Actually, RWEU (with rank-dependent weighting) can explain it by the fact that the 1% in B is the worst outcome and is overweighted, while in D the worst outcome (0) has a very high probability (90%) and is underweighted? Actually, standard RWEU (like cumulative prospect theory) explains the Allais paradox by the weighting function.

  But the EU defender can explain it by a utility function that is concave and then convex (like in prospect theory) but without probability weighting? Prospect theory uses both.

  So to isolate the probability weighting, we might need to fix the utility function and vary the probabilities.

  ### Revised Crux 2: 

  We use a pair of choices proposed by Kahneman and Tversky (1979) that involves only gains and losses relative to a reference point.

  - **Choice Pair 1**:
    - A: 80% chance to win $4000, 20% chance to win $0.
    - B: 100% chance to win $3000.

  - **Choice Pair 2**:
    - C: 20% chance to win $4000, 80% chance to win $0.
    - D: 25% chance to win $3000, 75% chance to win $0.

  Many people choose B over A and C over D. 

  - **EU Prediction**: With a concave utility function, the agent would choose B over A (risk aversion). But then with the same utility function, they should choose D over C because 0.25*u(3000) > 0.20*u(4000) if u is concave (since the ratio of utilities u(3000)/u(4000) > 3/4). But the common pattern (B>A and C>D) violates this. The EU defender must then either reject the pattern as irrational or explain it by a utility function that is not concave (e.g., convex for small probabilities?).

  - **RWEU Prediction**: This pattern is explained by a weighting function that overweights small probabilities and underweights large ones. In the first pair, 80% is underweighted (so the chance of $4000 is undervalued) and 100% is not underweighted. In the second pair, 20% and 25% are both overweighted, but the overweighting is more for 20% than 25%? Actually, the ratio of weights w(0.25)/w(0.20) might be less than 0.25/0.20, making the 20% chance of $4000 relatively more attractive. Thus, RWEU predicts the pattern.

  But note: the EU defender might argue that the utility function is S-shaped (as in prospect theory) and that the outcomes are gains. However, in this case, for gains, the utility function is typically concave, so the pattern remains a puzzle for EU without probability weighting.

  Thus, we can use this as a crux.

  ### Crux 3: The Ellsberg Paradox

  - **Neutral Question**: In the Ellsberg two-urn experiment, do the observed preferences (which violate the sure-thing principle) have a rational justification?

  - **Argument/Case**: The Ellsberg paradox: 
    - Urn A: 100 balls, 50 red and 50 black.
    - Urn B: 100 balls, unknown proportion of red and black.
    - Choice 1: Bet on red from A or red from B. Most choose red from A.
    - Choice 2: Bet on black from A or black from B. Most choose black from A.

  This violates the sure-thing principle because the two choices should be independent of the unknown proportion.

  - **EU Prediction**: The EU defender must either deny that these preferences are rational (arguing that they stem from a misunderstanding of probability) or explain them by a subjective probability that is not additive (which violates EU). They typically argue that the preferences are irrational because they make the agent vulnerable to a Dutch book (if they bet on both red and black from urn A, they get $100 for sure, but if they bet on both from urn B, they also get $100 for sure, so they should be indifferent).

  - **RWEU Prediction**: The RWEU defender argues that the preferences are rational because the agent has an aversion to ambiguity (unknown probabilities). They can be modeled by a risk function that assigns a higher weight to the worst-case scenario (e.g., minmax expected utility) or by a non-additive probability. Thus, the choices are rational and the Dutch book argument fails because the agent would not accept both bets at the same time (they only choose one at a time).

  ## Step 4: Settled and Contested Issues

  - **Settled**:
    - People exhibit Allais-type and Ellsberg-type preferences robustly.
    - EU cannot explain these without relaxing its axioms or changing the interpretation (e.g., state-dependent utility).
    - RWEU models (like cumulative prospect theory) can describe these patterns.
    - Representation theorems exist for both.

  - **Contested**:
    - The normative status of the sure-thing principle and other EU axioms.
    - Whether the risk function is a necessary addition to the utility function or whether it can be reduced to utility.
    - Whether the patterns of Allais and Ellsberg should be considered rational or irrational.
    - The normative force of Dutch books and money pumps.

  - **Verbal Dispute?**: Part of the dispute might be about what counts as a "rational" agent. The EU defender might argue that rationality requires consistency in a very strong sense (avoiding any possible Dutch book), while the RWEU defender might argue that rationality is about making sensible choices in realistic contexts. Also, the dispute about whether the risk function is separable from utility might be partly verbal if one allows the utility function to be state-dependent or reference-dependent, but the RWEU defender would insist that the risk function captures a different aspect (the distribution) that is not about the level of outcomes.

  ## Final Document Structure

  We now write the document accordingly.
answer: |-
  ### Adversarial Collaboration Statement: Risk-Weighted Expected Utility vs. Classical Expected Utility  
  **Signed:**  
  [Name, EU Proponent] & [Name, RWEU Proponent]  
  **Date:** October 26, 2023  

  ---

  ### Section 1: Common Ground  
  Both parties agree on the following claims:  

  1. **Formal Definitions**:  
     - Classical Expected Utility (EU) asserts that a rational agent maximizes the expectation of a utility function \(u\) over outcomes, with respect to additive probabilities \(p\). Preferences satisfy the Sure-Thing Principle (STP), Independence, and are linear in probabilities.  
     - Risk-Weighted Expected Utility (RWEU) asserts that a rational agent maximizes a weighted sum of utilities, where probabilities are transformed by a monotonic "risk function" \(r\) applied to cumulative probabilities. Preferences violate STP and linearity but satisfy axioms like monotonicity and stochastic dominance.  

  2. **Representation Theorems**:  
     - EU representation (Savage, von Neumann-Morgenstern) delivers unique probabilities (up to a convex set) and utility (up to affine transformations).  
     - RWEU representation (e.g., Quiggin, Schmeidler) delivers a unique risk function \(r\) and utility \(u\), with \(r\) capturing sensitivity to outcome rankings.  
     - Both theorems show that agents *can* be represented under their axioms. **The dispute is not about representational possibility**—it is about which axioms are *normatively binding*.  

  3. **Empirical Common Ground**:  
     - Humans systematically exhibit Allais-type preferences (e.g., violating Independence) and Ellsberg-type preferences (e.g., violating STP under ambiguity).  
     - These patterns are robust, replicable, and not artifacts of framing.  

  4. **Scope of Disagreement**:  
     - The debate is **not** about descriptive adequacy (both agree EU fails descriptively) or whether agents can be modeled.  
     - It **is** about whether STP/separability is a rational requirement, whether probability-weighting is reducible to utility, and whether RWEU’s axioms are normatively defensible.  

  ---

  ### Section 2: Disagreements Stated in Each Side’s Terms  

  #### **Disagreement 1: Status of the Sure-Thing Principle (STP)/Separability**  
  - **EU Proponent**: "STP is a non-negotiable requirement of rationality. It ensures choices are separable across mutually exclusive states, preventing incoherent dependencies on irrelevant outcomes. Violations (e.g., Ellsberg) reflect cognitive errors, not rational preferences."  
  - **RWEU Proponent**: "STP is a modeling convenience, not a rational mandate. Rational agents may care about outcome dispersion (e.g., avoiding catastrophic losses), which STP forbids. RWEU’s state-wise separability accommodates this via risk functions."  

  #### **Disagreement 2: Distinguishability of Risk Function vs. Utility**  
  - **EU Proponent**: "Alleged probability-weighting is indistinguishable from utility re-specification. Any RWEU model can be replicated by EU with context-dependent \(u\) (e.g., disappointment aversion). The risk function lacks independent content."  
  - **RWEU Proponent**: "Risk functions are empirically and theoretically separable. \(r\) encodes attitudes toward *how* uncertainty resolves (e.g., pessimism), while \(u\) encodes outcome values. Cross-context consistency of \(r\) (e.g., in Allais) shows it is not absorbable into \(u\)."  

  #### **Disagreement 3: Attitude Toward Risk vs. Resolution of Uncertainty**  
  - **EU Proponent**: "Risk attitude is fully captured by \(u\)’s curvature. Preferences for uncertainty resolution (e.g., early vs. late) are irrational unless embedded in outcome descriptions (e.g., including anxiety in \(u\))."  
  - **RWEU Proponent**: "Agents rationally care about resolution timing (e.g., preferring early resolution of gains). RWEU’s \(r\) naturally models this, while EU forces ad hoc outcome-redescription."  

  #### **Disagreement 4: Normative Force of Dutch Books/Money Pumps**  
  - **EU Proponent**: "Dutch Books show that STP violations lead to guaranteed losses. RWEU agents are exploitable in dynamic choice, proving irrationality."  
  - **RWEU Proponent**: "Dutch Books assume unrealistic myopia. Sophisticated RWEU agents avoid exploitation by planning ahead. These arguments confuse rationality with dynamic inconsistency under naivety."  

  ---

  ### Section 3: Cruxes Table  
  *Each crux includes: (1) Neutral question, (2) Shared argument/case, (3) Predictions. Predictions are based on a one-shot gamble with outcomes ranked unambiguously (e.g., monetary payoffs).*  

  | Neutral Question | Argument/Case | EU Prediction | RWEU Prediction |  
  |------------------|---------------|--------------|----------------|  
  | **Crux 1: Separability in Small vs. Grand Worlds**<br>*How does background uncertainty affect preferences?* | Agents choose between two lotteries:<br>- **Option X**: 90% chance of $100, 10% of $0.<br>- **Option Y**: 95% chance of $100, 5% of $0.<br>First in isolation ("small world"), then with background risk: 1% chance of losing $1,000 independent of the lottery ("grand world"). | Preferences unchanged. Background risk adds a constant loss-utility to both options, separable via STP. Agents consistently prefer Y > X in both worlds. | Preferences may reverse. Background risk exacerbates aversion to worst-case outcomes. In grand world, agents may prefer X > Y due to risk-function overweighting of the 10% loss in X. |  
  | **Crux 2: Probability Weighting vs. Utility Redescription**<br>*Can preferences distinguish risk functions from utility?* | Agents choose between:<br>- **Pair 1**:<br>  - A: 99% chance of $100, 1% of $0.<br>  - B: 100% of $98.<br>- **Pair 2**:<br>  - C: 50% chance of $100, 50% of $0.<br>  - D: 55% chance of $100, 45% of $0.<br>Observe choices in both pairs. | No switch: If B > A (risk aversion), then D > C. Concave \(u\) explains both. Any switch (e.g., B > A but C > D) is irrational noise. | Switch predicted: B > A (overweighting 1% loss) but C > D (linear weighting in mid-range). Risk function \(r(p)\) (e.g., inverse-S shaped) explains this; utility alone cannot. |  
  | **Crux 3: Dynamic Choice and Money Pumps**<br>*Does RWEU tolerate exploitation?* | Agents face sequential choices:<br>1. Choose between:<br>   - $40 for sure (I).<br>   - 50% chance of $100 (II).<br>2. If II chosen, offered to "sell" the gamble for $45. | Agents who prefer I (risk aversion) avoid exploitation. Agents who prefer II then sell for $45 reveal inconsistent valuation ($45 > $40 but earlier $40 > II). RWEU agents will be money-pumped. | Sophisticated RWEU agents foresee the sell option and choose I initially if $45 < certainty equivalent of II. Naive agents may be pumped, but this is a performance error, not irrationality. |  

  ---

  ### Section 4: Settled vs. Contested Issues  
  #### **Settled Among Researchers**  
  - People exhibit Allais/Ellsberg patterns descriptively.  
  - EU axioms are violated descriptively; RWEU models fit these violations.  
  - Representation theorems exist for both frameworks.  
  - Dutch Books *can* be constructed against STP violators in theory.  

  #### **Genuinely Contested**  
  1. **Normative Status of STP**: EU sees it as rational; RWEU sees it as dispensable.  
  2. **Content of Risk Functions**: EU argues \(r\) is reducible to \(u\); RWEU argues it is irreducible.  
  3. **Rationality of Ambiguity Aversion**: EU labels Ellsberg as irrational; RWEU defends it.  
  4. **Money Pumps**: EU views as decisive proof; RWEU views as artifacts of naivety.  

  #### **Verbal Dispute**  
  - The "risk function vs. utility" debate is partly verbal. If utilities are defined richly (e.g., including anxiety), EU can mimic RWEU. Yet RWEU insists \(r\) is about *decision structure*, not outcome content. The crux is whether a separable \(r\) simplifies explanations (RWEU) or adds needless complexity (EU).  

  ---

  ### Conclusion  
  This document clarifies agreements, sharpens disagreements, and identifies testable cruxes. Both sides endorse it as a foundation for pedagogical and research dialogue. Predictions for the cruxes are archived for future testing.  

  ---  
  **For Students**: This is not a verdict. Both positions are live in decision theory. We encourage you to:  
  - Test the cruxes experimentally.  
  - Explore axiomatic derivations (e.g., Savage’s P2 for EU; Chateauneuf’s comonotonicity for RWEU).  
  - Consider real-world applications (e.g., insurance under EU vs. RWEU).
