  Now we have 8 leaves.

  Leaves and their awkward commitments:

  1. Pragmatic/Attributor-Relative: It makes epistemic value depend on non-epistemic factors, potentially making epistemology subordinate to practical concerns.
  2. Veritism: It struggles to explain why we care about how we got our true beliefs in specific cases (like the stopped clock) when the true belief is already in hand.
  3. Instrumentalism/Consequentialism: It is vulnerable to the swamping problem: why is a particular true belief from an unreliable process less valuable if it is just as true?
  4. Process Reliabilism: It cannot account for the intuition that understanding or cognitive achievement adds extra value beyond reliability.
  5. Knowledge-First: It refuses to explain why knowledge is more valuable than true belief, taking knowledge as a primitive and thus leaves the value question unanswered.
  6. Virtue/Credit: It may deny full extra value to true beliefs that are not the agent's achievement (e.g., reliable testimony without understanding), even if they are reliable.
  7. Understanding-Based: It might set too high a bar for knowledge, requiring deep understanding for any extra value, which might not be present in ordinary cases.
  8. State-Ginalism/Epistemic State Primacy: It is unclear how a true belief-state can have extra final value without any appeal to process, achievement, or understanding.

  Now, flag any two leaves the tree can't separate:

  - The tree might not separate Veritism and Instrumentalism well because both are instrumental. But Veritism says there is no extra final value and the value of knowledge is only instrumental, while Instrumentalism (as we defined) is in the Yes branch of Node1 and says the extra value is only instrumental. So they are in different parts of the tree.

