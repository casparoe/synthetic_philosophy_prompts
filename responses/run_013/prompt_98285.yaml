  ### Epistemic Value Decision Tree Worksheet  
  **Instructions:** Start at Node 1. Answer each question based on concrete cases, not pre-existing labels. Follow the path until you reach a leaf (named position). Each leaf includes one sentence summarizing its most awkward commitment.  

  ---

  #### **Node 1: Stopped Clock Case**  
  *Alice looks at a broken clock that stopped at 2:00 and believes it is 2:00—and it is. Bob looks at a working clock showing 2:00 and believes it is 2:00. Is Alice’s true belief epistemically worse than Bob’s?*  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 3.  

  #### **Node 2 (from Node 1 "Yes"): Swamping Problem**  
  *If a reliable process (like Bob’s working clock) produces a true belief, does the reliability add any extra non-instrumental value to the belief itself—beyond its tendency to produce more true beliefs later?*  
  - **Yes** → Go to Node 4.  
  - **No** → **Leaf: Instrumentalist Consequentialism**  
    - *Most awkward commitment:* Must accept that a lucky true belief (e.g., Alice’s) is just as valuable as knowledge when it leads to the same future outcomes.  

  #### **Node 3 (from Node 1 "No"): Testimony Case**  
  *Chris believes a true fact solely because a reliable expert said so, but Chris has no idea why the expert is reliable. Denise believes the same fact after careful reasoning. Is Denise’s belief epistemically better than Chris’s?*  
  - **Yes** → Go to Node 5.  
  - **No** → Go to Node 6.  

  #### **Node 4 (from Node 2 "Yes"): Understanding vs. Achievement**  
  *In the testimony case (Chris vs. Denise), is Denise’s true belief better because she understands why it’s true, not just that it’s true?*  
  - **Yes** → **Leaf: Understanding-Based**  
    - *Most awkward commitment:* Risks excluding ordinary knowledge (e.g., simple perceptual beliefs) from having extra value if deep understanding is absent.  
  - **No** → **Leaf: Process Reliabilism**  
    - *Most awkward commitment:* Must deny that understanding/effort adds value if the process is reliable (e.g., Chris’s testimony-based belief is as good as Denise’s).  

  #### **Node 5 (from Node 3 "Yes"): Source of Value**  
  *Is the extra value in Denise’s true belief primarily due to her personal achievement (e.g., effort, skill) in arriving at it?*  
  - **Yes** → **Leaf: Virtue/Credit**  
    - *Most awkward commitment:* Cannot grant full extra value to true beliefs gained passively (e.g., innate knowledge) even if reliable/true.  
  - **No** → **Leaf: State-Ginalism**  
    - *Most awkward commitment:* Struggles to explain why the belief-state itself (not process/agent) has final value without circularity.  

  #### **Node 6 (from Node 3 "No"): Context Dependence**  
  *Does whether knowledge is better than true belief depend on practical consequences (e.g., stakes of being wrong) or social context?*  
  - **Yes** → **Leaf: Pragmatic/Attributor-Relative**  
    - *Most awkward commitment:* Allows epistemic value to shift with non-epistemic factors (e.g., how urgently the belief is needed).  
  - **No** → **Leaf: Veritism**  
    - *Most awkward commitment:* Cannot explain why we intuitively downgrade "lucky" true beliefs (e.g., Alice’s clock) if truth is the only final value.  

  #### **Node 7 (from Node 1 "Yes" → Node 2 "Yes" → Node 4 "No"): Knowledge-First Check**  
  *Can the extra value of knowledge be fully explained by breaking it into components (e.g., truth + reliability)?*  
  - **Yes** → Return to Node 4 (to ensure consistency—no looping, but positions covered).  
  - **No** → **Leaf: Knowledge-First**  
    - *Most awkward commitment:* Refuses to explain why knowledge is better than true belief, treating it as a primitive fact.  

  ---

  ### Leaves (Positions) Summary  
  1. **Instrumentalist Consequentialism**: Extra value is only in promoting future true beliefs/actions.  
     - *Awkward commitment:* See Node 2.  
  2. **Understanding-Based**: Extra value requires grasping reasons/connections.  
     - *Awkward commitment:* See Node 4.  
  3. **Process Reliabilism**: Extra value is in reliable belief-forming processes.  
     - *Awkward commitment:* See Node 4.  
  4. **Virtue/Credit**: Extra value is in the agent’s skill/effort.  
     - *Awkward commitment:* See Node 5.  
  5. **State-Ginalism**: Extra value is intrinsic to the belief-state itself.  
     - *Awkward commitment:* See Node 5.  
  6. **Pragmatic/Attributor-Relative**: Extra value depends on context/stakes.  
     - *Awkward commitment:* See Node 6.  
  7. **Veritism**: Only truth has final value; any "extra" is instrumental.  
     - *Awkward commitment:* See Node 6.  
  8. **Knowledge-First**: Rejects the "extra value" question; knowledge is fundamental.  
     - *Awkward commitment:* See Node 7.  

  ---

  ### Scoring Notes  
  - **Indistinguishable Leaves**:  
    - **Veritism** and **Instrumentalist Consequentialism** can blur. Both deny non-instrumental extra value, but Veritism answers "No" to Node 1, while Instrumentalism answers "Yes" to Node 1 + "No" to Node 2. Cases may not force separation if instrumental value is conflated with final value.  
    - **State-Ginalism** and **Knowledge-First** might overlap. Both resist reduction, but State-Ginalism locates value in the state (Node 5), while Knowledge-First rejects analysis (Node 7).  

  - **Unoccupied Combinations**:  
    - **Node 1 "No" → Node 3 "Yes" → Node 5 "No"** (State-Ginalism): Assumes extra value exists but locates it mysteriously in the state. Rare/unattractive because it ignores process/agent roles.  
    - **Node 1 "Yes" → Node 2 "No"** (Instrumentalist Consequentialism): Asserts extra value is purely instrumental but also admits a difference in cases (Node 1). Unstable due to swamping problem—likely unexplored or incoherent.  

