  ### Taxonomy of Positions on Mental Illness  
  This tree maps the logical space of positions on what makes a condition a mental illness. It starts with fundamental questions, branches based on answers, and assigns positions (named or unnamed) to the leaves. Each leaf includes a one-sentence statement of the position's most awkward commitment. Cases like prolonged grief, valued neurodiversity, accurate misery, and diagnostic reversal by vote are integrated at relevant nodes. The tree separates key views (statistical typicality, natural selection, harmful dysfunction) and includes indexical/social practice views.  

  #### The Tree  
  **1. Is mental illness classification inherently tied to local social practices (e.g., excusing blame, permitting treatment, granting accommodations)?**  
     - **Yes** →  
       - **Position: Social Practice Indexicalism**  
         - *Most awkward commitment*: The same condition (e.g., ADHD) may be an illness when justifying school accommodations but not when discussed in a personal growth context, risking accusations that illness is merely a tool of social control rather than a medical fact.  
     - **No** →  
       - **2. Is mental disorder primarily a descriptive concept (objective facts), an evaluative concept (value judgments), or irreducibly both?**  
         - **Descriptive (only objective facts matter)** →  
           - **3. What objective criterion defines disorder?**  
             - **Statistical abnormality (deviation from species-typical norms)** →  
               - **Position: Statistical Deviance View**  
                 - *Most awkward commitment*: Beneficial but rare traits (e.g., extremely high pain tolerance) count as disorders, while harmful but common conditions (e.g., mild anxiety in urban populations) do not.  
             - **Biological dysfunction (failure of evolved/natural mechanisms)** →  
               - **Position: Evolutionary Function View**  
                 - *Most awkward commitment*: Conditions like wisdom teeth impaction are disorders due to evolutionary mismatch, but distress from systemic injustice (e.g., misery in an abusive marriage) is not, even if severe.  
             - **Unnamed (other descriptive criteria, e.g., neurophysiological lesions)**  
               - *Unoccupied*: Unattractive, as purely descriptive views struggle to exclude harmless biological variations (e.g., benign brain cysts) or include conditions without clear lesions (e.g., grief).  
         - **Evaluative (only values matter)** →  
           - **4. What evaluative criterion defines disorder?**  
             - **Distress to the person** →  
               - **Position: Subjective Distress View**  
                 - *Most awkward commitment*: Conditions like mania or antisocial personality are not disorders if the person feels no distress, even if they cause severe harm to others or impairment.  
             - **Harm to others or society** →  
               - **Position: Social Harm View**  
                 - *Most awkward commitment*: A person with debilitating depression is not ill if they live in isolation and harm no one, but a political dissident in a repressive regime might be classified as ill.  
             - **Functional impairment (inability to perform social/occupational roles)** →  
               - **Position: Role Impairment View**  
                 - *Most awkward commitment*: Neurodevelopmental conditions (e.g., autism) cease to be disorders in accommodating environments, even if underlying traits persist unchanged.  
             - **Cultural undesirability (violation of local norms)** →  
               - **Position: Cultural Normativity View**  
                 - *Most awkward commitment*: Homosexuality was a disorder when culturally condemned, but not after normative shifts, despite identical traits.  
         - **Hybrid (both descriptive and evaluative elements are essential)** →  
           - **5. Is a failure of an internal mechanism necessary for disorder?**  
             - **Yes** →  
               - **6. What defines the internal failure?**  
                 - **Failure of naturally selected functions** →  
                   - **Position: Harmful Dysfunction View (e.g., Wakefield)**  
                     - *Most awkward commitment*: Prolonged grief after profound loss may not qualify as a disorder if it aligns with evolved responses, even if it causes severe harm and impairment.  
                 - **Failure of mechanistic design (not necessarily evolved)** →  
                   - **Unnamed**  
                     - *Unoccupied*: Unexplored, as it is unclear how to define "design" without evolution or social intent, and risks pathologizing benign variations (e.g., circadian rhythm differences).  
             - **No** →  
               - **7. What hybrid criterion defines disorder?**  
                 - **Harm plus statistical abnormality** →  
                   - **Unnamed**  
                     - *Unoccupied*: Unattractive, as it classifies accurate responses to trauma (e.g., misery in an intolerable marriage) as disorders if rare and harmful.  
                 - **Harm plus biological dysfunction (without mechanism failure)** →  
                   - **Position: Harm-Lesion View**  
                     - *Most awkward commitment*: Conditions reversed by professional vote (e.g., homosexuality in DSM history) become disorders overnight without new evidence, reducing medical validity to consensus.  

  #### Key to Cases  
  - **Prolonged grief**: Tests Evolutionary Function (if not evolutionary failure) and Harmful Dysfunction (if no mechanism failure).  
  - **Valued neurodivergence**: Challenges Role Impairment (if accommodated) and Statistical Deviance (if not abnormal in a subgroup).  
  - **Accurate misery**: Contradicts Subjective Distress (if not distressing) and Harmful Dysfunction (if no internal failure).  
  - **Diagnostic reversal by vote**: Supports Social Practice Indexicalism and Cultural Normativity.  

  #### Structural Notes  
  - **Load-bearing branches** (critical for distinguishing major positions):  
    - Root (Q1: Social practice tie-in) – separates indexicalism from all others.  
    - Q2 (Descriptive/Evaluative/Hybrid) – foundational for categorizing all substantive positions.  
    - Q5 (Internal mechanism failure necessary?) – prises apart Harmful Dysfunction from other hybrid views.  
  - **Collapsible branches** (removable without conceptual loss):  
    - Q6 (What defines internal failure?) – Evolutionary vs. Mechanistic could merge without harming the tree, as no named positions occupy mechanistic failure.  
    - Q7 (Hybrid criteria) – The "unnamed" leaves are marginal; collapsing them into a single "other hybrid" node would simplify without omitting key debates.  
  - **Answer forcing redraw**: A "Yes" at Q1 (social practice tie-in) collapses the entire downstream tree, as indexicalism bypasses descriptive/evaluative debates.  
  - **Least confident representation**:  
    - **Social Practice Indexicalism** risks caricature as a "dodge" (as critics argue it evades ontological commitments), but proponents see it as acknowledging context-dependent functions of illness labels. I represent it as critics do, not capturing how defenders frame it as a pragmatic response to real-world complexity.  
    - **Harmful Dysfunction View** may misstate the "failure of evolved function" criterion; defenders emphasize that functions are inferred from cross-cultural data, not strict biology, but I present it as requiring unambiguous evolutionary evidence.  

  This tree yields 12 leaves (7 named positions, 3 unnamed, 2 unoccupied). It isolates Szasz-like views (Social Practice Indexicalism + Social Harm View) and distinguishes the three function-centered views (Statistical Deviance, Evolutionary Function, Harmful Dysfunction) via Q2 and Q5/Q6.
