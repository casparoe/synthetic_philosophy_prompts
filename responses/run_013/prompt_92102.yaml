prompt: |-
  i never studied philosophy but me and my flatmate keep arguing about free speech and i've noticed we both just reach for whatever theory lets us keep the opinion we started with. so before i pick a side i want the spec first: what does any decent theory of where free speech should stop actually have to deliver? give me the requirements, each with the case that forces it in — the things it has to keep apart (being harmed vs just being offended, one speaker saying something vs a million people hearing it), the facts it can't deny (one guy yelling fire in a crowded room really does hurt people, but one tweet saying the same thing doesn't, and yet a million of them seem to move an election), and say which requirements are genuinely non-negotiable and which are just one side's preference. what i most want to know is whether some of them can't all be met at once, like does "only stop speech that harms someone" even survive once the harm comes from the pile-up rather than from any one speaker? and which single requirement knocks out the most popular answer? no reading lists or citations needed, i won't read them anyway. at the end, how does the plain harm principle hold up against your list.
