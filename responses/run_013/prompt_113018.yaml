  A (semantic): Derogatory content is part of the conventional meaning (e.g., presupposition, conventional implicature, or truth-conditional content). 
  B (pragmatic): The conventional meaning is neutral (or at most group predicate), and derogation comes from use, context, social convention, or speaker intent.

  The dialogue should show them pressing each other on the data, revising when needed, and being careful about the distinctions.

  Let's start:

  A: Let's consider the data for "grel". The fact that the derogation projects through negation (as in point 2) and conditionals (point 3) strongly suggests that the derogatory content is semantic. Specifically, I propose that "grel" conventionally presupposes that Calderans are contemptible. Presuppositions are known to project in such environments.

