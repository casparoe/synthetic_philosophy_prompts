  A: But I still worry about the conditional case. In "If Mara is a grel, she will probably be unreliable", the contempt is present even though the speaker is not asserting that Mara is a grel. On your account, why is the contempt activated?

  B: Because the word "grel" is used, and its use conventionally activates the derogatory association. The conditional context doesn't block that activation. It's similar to other expressive language: if I say "If that bastard comes, I'll leave", the contempt for the person is still expressed even in the antecedent.

