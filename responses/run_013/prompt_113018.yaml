  A: I see. We are at an impasse. I think we both can account for the data, but by invoking different mechanisms: you by distinguishing semantic content from social meaning and conventions of use, and me by positing a semantic component that is defeasible in certain contexts.

  B: Precisely. And that's where the debate stands. The choice between the accounts may come down to theoretical parsimony and how we weigh the various data points.

