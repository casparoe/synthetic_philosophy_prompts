  ### Dialogue: Semantic vs. Pragmatic Accounts of "Grel"

  **Setting:** Two philosophers of language, A (semanticist) and B (pragmatist), discuss the fictional slur "grel" over coffee. They reference an artificial dataset (points 1–8) to test their theories.

  ---

  **A:** Let's start with the core datum: "Mara is a grel" is derogatory (point 1). I argue this is because "grel" encodes contempt in its conventional meaning. Specifically, it’s a conventional implicature (CI): "grel" truth-conditionally denotes Calderans but conventionally implicates that Calderans are contemptible. This explains why replacing it with "Calderan" removes the contempt (point 8)—the CI is unique to "grel."

  **B:** But conventional implicatures are supposed to be detachable, right? Point 5 shows "grel" loses its derogation entirely in reclaimed contexts. If contempt were semantically encoded, reclamation would require changing the word’s meaning, which is implausible—it’s the same lexical item. Pragmatically, "grel" has a neutral core meaning (group membership) and acquires derogation through a convention of use: it’s typically employed to express contempt, given its history. Reclamation changes that convention, not the semantics.

  **A:** Fair, but consider projection: in "Mara is not a grel," contempt often survives negation (point 2). CIs project, just like presuppositions. That’s semantic. If it were purely pragmatic, why would the contempt persist when the speaker is denying group membership?

  **B:** Projection isn’t exclusive to semantics. Pragmatic presuppositions—grounded in shared expectations about typical usage—also project. For instance, using "grel" pragmatically presupposes the speaker endorses contempt toward Calderans. In negation, this presupposition can project because the speaker is still activating the derogatory convention, even while denying membership. Point 2 notes variation, though—some speakers don’t feel the contempt survives. That’s easily explained pragmatically: if the context emphasizes the denial (e.g., "Mara is not a grel—she’s respectable!"), the presupposition can be canceled. Semantic CIs shouldn’t vary by speaker intuition that way.

  **A:** What about embedding in conditionals? "If Mara is a grel, she will probably be unreliable" carries contempt (point 3), despite no assertion. Semantic accounts handle this smoothly: CIs project out of antecedents. Your pragmatic presupposition might too, but now look at reporting: "The dean said that the grels are lazy" conveys the dean used or endorsed a slur (point 4). If "grel" is just a neutral predicate, why does embedding it here attribute contempt to the dean?

  **B:** Indirect reports are sensitive to manner, not just content. Using "grel" in the report signals that the dean used this marked term, carrying its derogatory convention. It’s echoic: the reporter isn’t expressing contempt but indicating the dean did. Pragmatically, this relies on "grel" having a social meaning—a history of derogatory use—that’s activated in context. Your CI account struggles with point 6: in linguistics, "the grels are a Calderan subgroup" is purely descriptive. If "grel" semantically encodes contempt, how can it vanish in academic contexts? You’d need ad-hoc mechanisms, like local accommodation.

  **A:** Not ad hoc—semantic content can be overridden. In linguistics, "grel" is mentioned, not used (point 7 shows mention isn’t derogatory). Or better: the CI is suppressed because the context is metalinguistic. But fine, let’s press your view. Suppose a clueless speaker says "Mara is a grel" without intent to derogate (e.g., they learned the term innocently). Contempt still comes across (point 1). Doesn’t that show contempt is tied to the word itself, not speaker intent?

  **B:** No, because conventions of use operate independently of intent. The social meaning of "grel" is that it’s a slur, so hearers interpret it as derogatory by default. Intent matters less than the convention. Reclamation (point 5) proves this: Calderans repurpose the term, creating a new convention where "grel" expresses solidarity. The word’s social meaning shifts, but its semantic content (group membership) doesn’t. Your CI account fractures the lexicon: does "grel" mean one thing in mainstream contexts and another in reclaimed ones? That’s inefficient.

  **A:** I can unify it: "grel" always carries a CI of contempt, but in reclaimed contexts, that CI is neutralized or repurposed via a performative act—like how "queer" was reclaimed. Crucially, point 7 distinguishes use and mention: saying "‘grel’ is a slur" isn’t derogatory because we’re mentioning the word. But in point 6, the linguistics case is a use. Why isn’t it derogatory? Pragmatically, you’d say the academic context suspends the convention. But then why does the contempt project in conditionals? If context can suspend it in linguistics, why not in "if" clauses?

  **B:** Because projection in embeddings is about conventional force, not truth conditions. Using "grel" performs a conventional act of derogation, which isn’t scoped by operators like "if" or "not." It’s like using an expletive: "If that idiot comes, I’ll leave" expresses contempt regardless. But crucially, this act is pragmatic—it relies on norms, not semantics. Point 6 works because academic contexts explicitly reject those norms. Conditionals don’t. Now, point 8: substituting "Calderan" removes contempt. You say this supports semantics. I say it supports me: the contempt comes from "grel"’s social history, not its truth conditions. "Calderan" lacks that history.

  **A:** But social history doesn’t explain the systematicity. Why does contempt project uniformly in conditionals but variably in negation (point 2)? Semantics predicts uniformity; pragmatics allows variation. Yet variation exists, which you embrace. But let’s test embedding further. Consider: "It’s possible that Mara is a grel." Contempt projects here too. How?

  **B:** Pragmatic presuppositions project in modal contexts for the same reason: the conventional act is prioritized. But variation in negation arises because pragmatic inferences are defeasible. If the context emphasizes the speaker’s neutrality (e.g., "Mara is not a grel, and I reject that label"), the contempt can cancel. Your semantic CI is rigid—it shouldn’t vary by context.

  **A:** Not if we model CIs as context-sensitive. Maybe "grel" triggers a presupposition of contempt that’s only active in certain contexts. Reclamation and academic uses are contexts where the presupposition isn’t activated. But now I’m borrowing your pragmatics! Let’s regroup. Point 4: reporting. You attribute contempt to echoic use. But if I say, "The dean believes grels are lazy," contempt still projects, even without a speech act. How?

  **B:** Belief reports inherit the social meaning because "grel" is marked. Using it signals the dean harbors contempt, given the term’s convention. Semantically, if "grel" encodes contempt, shouldn’t "The dean believes grels are lazy" entail the dean believes Calderans are contemptible? But that overgenerates: the dean might use "grel" ignorantly. Pragmatics handles this—the contempt is implicated, not entailed.

  **A:** My CI account doesn’t entail it either; CIs aren’t part of belief content. But I see your point. Conversely, your view struggles with why "grel" is derogatory even when unintended. Conventions of use are powerful, but they feel like semantics in disguise. You’re calling it "social meaning," but isn’t that just semantics broadened?

  **B:** Only if we conflate meaning with use. Semantics is about truth-conditional content; social meaning is about how expressions function in discourse. Point 5–6 show "grel" can have the same truth conditions but different social functions. Your account blurs this by loading everything into conventional meaning. Look at the cost: for semantics, reclamation requires meaning change, academic uses demand suppression, and variation in negation needs contextual ad hocness. I explain it all with one distinction: semantic content (group membership) vs. social meaning (derogation or solidarity, based on context).

  **A:** Yet social meaning doesn’t explain the robustness of projection. And point 3 (conditionals) feels inherently semantic. But I concede: if we admit pragmatic presuppositions with conventional force, your view holds. Still, why call it "pragmatic" if it’s conventionalized?

  **B:** Because conventions of use aren’t part of compositional semantics. They’re norms governing speech acts. Semantics is what "grel" contributes to truth conditions; pragmatics is how it’s used to perform actions. Point 7 proves this: mentioning "grel" references the norm without performing it.

  **A:** Then let’s agree on this: "grel" has a minimal semantic content (Calderan), but its derogatory force arises from a conventional practice of use, which projects in embeddings due to its strength. In reclaimed contexts, a new practice overrides it.

  **B:** Precisely. And for semantics, you’d need a hybrid view: a core truth-conditional element plus a defeasible CI, with context doing heavy lifting. Neither is cost-free. But pragmatics better handles the flexibility—reclamation, descriptive uses, and variation.

  **A:** Perhaps. But I’ll maintain that projection patterns are more elegantly semantic. We’ll need more data—maybe psycholinguistic tests—to resolve this.

  **B:** Agreed. For now, we’ve mapped where each theory spends its resources. That’s progress.

  ---

  ### Summary of Theoretical Expenditures
  - **Semantic Account (A):** 
    - Spends resources on **projection** (points 2–4) by invoking conventional implicatures/presuppositions.
    - **Reclamation and descriptive uses** (points 5–6) require contextual suppression/neutralization of the derogatory component, risking ad hocness.
    - **Variation in negation** (point 2) is problematic for uniformity; must appeal to context-sensitivity.
    - **Mention vs. use** (point 7) is handled cleanly but exposes fragility in non-derogatory uses.
    
  - **Pragmatic Account (B):** 
    - Spends resources on **conventions of use and social meaning** to explain default derogation (point 1) and reclamation (point 5).
    - **Projection** (points 2–4) relies on pragmatic presuppositions or conventional acts, which must explain why they project robustly.
    - **Descriptive uses** (point 6) are handled via context suspending conventions, but **conditionals** (point 3) demand a stable conventional force.
    - **Lack of speaker intent** (implied in point 1) is explained by social conventions overriding individual states.

  Both views accommodate the data but require distinct machinery. The dialogue highlights tensions in embedding, variation, and context-dependence, leaving the debate open—as intended. This can prompt students to evaluate theoretical trade-offs (e.g., elegance vs. flexibility) and consider experimental designs to test predictions.
