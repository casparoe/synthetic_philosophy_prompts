  A: Not necessarily. We can have conventional implicatures that are contextually suspended. But let me try a different approach. What about point 4: the report that the dean said that the grels are lazy. On your view, the report conveys that the dean used a derogatory term. But how? If the word "grel" in the report is just denoting Calderans, why does it convey that the dean used a derogatory term?

  B: Because the word "grel" in the report is used, not mentioned. And since the word has a derogatory social meaning in the reporting context, the report inherits that. But note that the reporter might not be endorsing the contempt. They are just reporting what the dean said, and by using the word, they are also reporting the manner of the dean's utterance.

  A: That seems to require that the word "grel" in the report is doing double duty: denoting the group and indicating that the dean used a derogatory term. How is that encoded? On my view, it's straightforward: the word "grel" in the embedded clause carries its derogatory content, which is then attributed to the dean.

  B: But then how do you explain point 7? When we say, "The word 'grel' is a slur", we are mentioning the word and not using it, so the derogatory content isn't activated. However, in the report, we are using the word. But in the report, we are not necessarily expressing contempt ourselves; we are attributing it to the dean. That's a classic case of what I would call "echoic use". The derogation is not ours but the dean's.

  A: So you are appealing to a notion of echoic use? That sounds like a semantic mechanism. Is that part of the conventional meaning?

  B: Not semantic in the truth-conditional sense, but a matter of pragmatics. The word "grel" has a conventional association with derogatory use. When we use it in indirect speech, we are echoing the original speaker's use, so the derogation is attributed to them. The same word can be used without attribution in direct contexts, but then the derogation is the current speaker's.

