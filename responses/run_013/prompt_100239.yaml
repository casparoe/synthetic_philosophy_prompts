prompt: |-
  I'm a novelist, about two-thirds through a book whose whole engine is a precommitment contract — near-future setup where you can sign what my characters keep calling a "lock-in," a legally enforceable arrangement where you hand another person the power to act against your own future wishes. It's a plot device, but the more I write the more I realize I actually have opinions about when these things should hold, and I can't get them to line up, which is starting to feel like a me problem rather than a character problem. So here's me being embarrassingly honest about my gut verdicts, and I want to know what principle, if any, is quietly generating them.

  Verdicts: (a) a woman in early recovery signs a lock-in giving her brother the right to freeze her accounts and check her into a facility if she uses — I think he should do it, no question, she doesn't get to wriggle out by saying she's changed her mind that week. (b) Same woman, twelve years clean, steady job, wants the thing torn up — I think it should be torn up; the contract did its job and now it's just a cage. (c) Two friends sign a lock-in agreeing neither will let the other quit the band before a set date, with a money penalty — I think that one's faintly ridiculous and shouldn't be enforced, even though structurally it's the same thing as (a). (d) A character signs away, in advance, her right to refuse a specific medical procedure years down the line — I think the later refusal should win, always, she's the one on the table. (e) A country writes something into its constitution so a future majority can't simply undo it — I think that entrenchment should mostly be respected, which seems to flatly contradict (d). My tentative stab at a principle is that a lock-in binds when the later self's wish is itself the symptom the lock-in was meant to treat (addiction, panic, a moment of weakness) and doesn't bind when the later self is just a different, competent person with different values — but (c) breaks that, since the band-quitter's later wish is a symptom of nothing, and (e) breaks it in the other direction, since entrenchment binds even competent later majorities.

  Is there one principle that gets all five, or close? And what does it say about the case I keep circling back to — a character who signs a lock-in about her own end-of-life care before early-onset dementia, then, deep in the fog, wants out? If no single principle saves all five, tell me which of my verdicts I should give up and why, because right now I suspect it's one of the two I feel most sure about, which is annoying. Give it to me as a numbered list of exactly five items, no intro and no wrap-up: the first item is the principle stated as precisely as you can manage, and the other four are the upshots — the case it saves, the case it forces me to abandon, what it predicts for the dementia case, and what it predicts for one more case you make up yourself.
reasoning: |-
  Okay, the user is a novelist struggling with the ethical and legal implications of "lock-in" contracts in their near-future story. They've presented five scenarios where these contracts come into play and their gut reactions to each. They're looking for a unifying principle that explains their judgments or, if that's impossible, guidance on which judgment to reconsider.

  First, I need to unpack each verdict:
  (a) Early recovery addiction contract: Enforceable. The user sees this as protective against self-destructive impulses.
  (b) Same person 12 years later: Should be void. The contract served its purpose and now restricts growth.
  (c) Band commitment contract: Ridiculous and unenforceable. Feels trivial compared to life-altering decisions.
  (d) Medical procedure refusal: Later refusal should override. Bodily autonomy in the moment trumps past consent.
  (e) Constitutional entrenchment: Should bind future majorities. Upholds stability despite changing values.

  The user's proposed principle (binding when later wish is the "symptom" but not when it's competent value change) seems logical but fails on (c) and (e). The band case has no symptom, yet the user rejects enforcement; the constitution binds competent value changes, which contradicts.

  Now I'm considering core tensions:
  - Self-binding vs. others binding you
  - Temporary protection vs. permanent restriction
  - Competence/autonomy shifts over time
  - Scale of consequences (personal vs. societal)

  For a unifying principle, I'm drawn to the idea of "irreducible autonomy boundaries." This would mean:
  1. Any contract restricting core bodily/exit rights has inherent limits
  2. Societal-scale commitments get more deference
  3. Time-limited protections expire when obsolete

  Testing this against the cases:
  (a) Holds - protects against self-harm during impairment
  (b) Holds - impairment ended, so restriction lifts
  (c) Holds - trivial restriction on life choices
  (d) Holds - bodily autonomy is irreducible
  (e) Partial conflict - societal scale justifies binding, but the principle allows this exception

  For the dementia case: The contract should stand until significant cognitive decline, but once the person can't comprehend consequences, their prior competent wishes govern. The "fog" period resistance wouldn't override the precommitment since it's the exact scenario planned for.

  The band case (c) is the outlier in their judgments. If consistency is the goal, they might need to either:
  - Enforce trivial contracts (awkward)
  - Or accept that low-stakes promises don't deserve lock-in enforcement

  Making up a new case: A scientist precommitting to destroy dangerous research if their mental health declines. The principle would enforce this - it's time-limited protection against impairment, respecting their competent prior judgment over possibly compromised later self.

  The hard trade-off is between their strong belief in constitutional entrenchment (e) and medical autonomy (d). If forced to choose, (d) feels more fundamental - bodily sovereignty vs. procedural governance. But their attachment to (e) suggests they value collective stability highly, so maybe reframing "scale" as the distinguisher.
answer: |-
  1. **Principle**: Precommitments bind only when they protect a temporarily impaired or irrational self from permanent self-harm, respecting irreducible autonomy boundaries (bodily integrity, fundamental life choices) and dissolving when the threat passes or competence shifts irreversibly. They lose force when enforcing them would cause greater harm than the original risk, or when they restrict core selfhood without time limits.

  2. **Saves (b)**: The 12-years-clean contract dissolves because the impairment (active addiction) is resolved; enforcing it now *creates* harm (unjust restriction) rather than preventing it. The "treated symptom" logic holds.

  3. **Forces abandonment of (c)**: The band contract must be enforced under this principle. Quitting isn't a symptom of impairment or self-harm (it's a value shift), and the penalty isn't an irreducible autonomy violation. Your verdict contradicts the principle; consistency requires either enforcing trivial precommitments or reclassifying "band loyalty" as non-binding frivolity.

  4. **Dementia case prediction**: The lock-in stands. Early-stage resistance is the *exact* "symptom" it was designed to override (impaired judgment due to disease). Her competent past self's wishes govern—until she loses all comprehension, at which point the contract (and any dissent) becomes meaningless.

  5. **New case prediction**: A climate scientist signs a lock-in authorizing colleagues to destroy her geoengineering data if she exhibits paranoia symptoms. She later resists, claiming breakthrough insights. **Verdict**: Enforce. Paranoia is a defined impairment risk; destroying data prevents permanent harm (disastrous misuse); bodily/fundamental autonomy isn't violated.
