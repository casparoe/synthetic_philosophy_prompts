answer: |-
  ### Conceptual Walkthrough

  #### Choice Objects
  The agents are choosing **programs (source code)** that take the opponent's source code as input and output an action (cooperate/defect). Each program must decide its move based solely on analyzing the opponent's code—*not* by observing the opponent's output (which doesn't exist yet).

  #### Where Dominance Fails
  The classic dominance argument ("defect always gives better payoffs no matter what the opponent does") fails because:  
  - **Actions are interdependent**: Your program's output depends on your opponent's source code, and vice versa. Defecting unconditionally (e.g., a program that ignores input and always defects) *can* be exploited: if your opponent's code detects this, they defect too, forcing mutual defection (worse than mutual cooperation).  
  - **Stability of mutual cooperation**: If both programs conditionally cooperate (e.g., "I cooperate iff you cooperate when given my code"), they create a self-reinforcing loop where mutual cooperation is the best outcome. Switching to defection breaks this loop and yields lower payoffs.  

  Dominance fails because the "always defect" program isn't dominant *against itself*—it only gets the punishment payoff (P), while mutual conditional cooperation yields the reward payoff (R > P).

  #### Why Conditional Cooperation is Well-Founded
  - **Code analysis replaces output dependence**: Programs simulate what the opponent *would do* if given their own code. They don't wait for runtime output.  
  - **Fixed-point resolution**: Programs like FairBot (cooperates iff opponent cooperates when given FairBot's code) use techniques like bounded proof search to avoid infinite loops:  
    - FairBot checks: "Can I prove (within computational limits) that the opponent cooperates when given my code? If yes, cooperate; else, defect."  
    - Against itself, it finds a proof of mutual cooperation and cooperates.  

  #### Preconditions for Cooperation
  1. **Mutual transparency**: Both agents must access each other's source code.  
  2. **Sufficient similarity**: Programs must recognize each other’s logic (e.g., FairBot recognizes another FairBot).  
  3. **Bounded rationality**: Programs must have computational resources to simulate/prove properties about the opponent (e.g., a shared proof system).  
  4. **No hardwired exploitation**: Neither program can be designed to "blindly" cooperate (e.g., CooperateBot) or defect (e.g., DefectBot) without analysis.  

  #### Failure Modes
  - **Against CooperateBot**: FairBot cooperates (since CooperateBot always cooperates), but CooperateBot is exploited by DefectBot (which gets the temptation payoff). **Cooperation rests on avoiding naïveté**.  
  - **Against DefectBot**: FairBot defects (mutual defection).  
  - **Unrecognizable programs**: If programs are too complex/different, mutual analysis fails (e.g., FairBot vs. a modified FairBot it can't prove things about).  
  - **Resource limits**: If simulations/proofs exceed computational bounds, programs default to defection.  

  #### Does This Solve the One-Shot Prisoner's Dilemma?  
  **Qualified, but with a caveat**:  
  - **Yes**: It enables cooperation in a one-shot interaction where players analyze each other's source code.  
  - **No**: It solves a *variant* of the PD (with code access), not the classic PD (where players choose actions directly without code access).  
  - **Key insight**: Cooperation emerges from mutual predictability and self-referential trust, not repetition. But it requires changing the game's structure.  

