  We are discussing Bertrand's paradox and the principle of indifference. The paradox shows that for the same event (a random chord in a circle being longer than the side of an inscribed equilateral triangle) we can get different probabilities: 1/3, 1/2, or 1/4, depending on how we define the "random chord". 

  The two mates, A and B, have different views:

  A argues that the principle of indifference is a sham because it leads to different probabilities for the same event, meaning that "indifference" is just a label for whatever measure you choose arbitrarily.

  B argues that the event is not well-defined until we specify the physical process that picks the chord. Each method (two random endpoints on the circumference, random point on a radius with perpendicular chord, random midpoint in the disk) is a different physical process and hence a different question, so there is no contradiction.

