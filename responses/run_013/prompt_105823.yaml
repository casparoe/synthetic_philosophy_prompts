  - $u(10, \text{none}) = 10$  
  - $u(9, A) = 9 + 1.5 = 10.5$ if $A$ is endowed, but $9 + 1 = 10$ if $A$ is traded for.  
  *Extraction sequence:*  
  1. Counterparty offers: Trade $\\$1$ for good $A$ (agent accepts: $9A$ has utility $10.5 > 10$).  
  2. Counterparty offers: Trade $A$ for $\\$0.50$ (agent accepts: $9.50$ has utility $9.50 > 9$ since $A$'s value drops to $1$ post-trade).  
  Final holdings: $m=9.50$, no goods (initial: $m=10$). Agent ends with less money, same goods.

