  The fictional field officer's quote needs to sting: something about Western staff enjoying hospitality while local partners freeze relationships. And the appendix must contrast trivial Western perks with survival-level exchanges elsewhere.

  Crucially, no real countries or citations—this is pure speculative bureaucracy. The humor should work whether you've read Mauss on the gift or just sense the rules are unfair.

