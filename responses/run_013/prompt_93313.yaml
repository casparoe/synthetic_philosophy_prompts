answer: |-
  Here's a decision tree focused on the nature of the self to navigate positions on self-deception, designed for clarity in a grad seminar handout:

  **Self-Deception: Resolving the Paradox Through the Lens of the Self**

  **Start:** I think self-deception is genuinely possible. How does the self manage this without collapsing into paradox?

  1.  **Does the self-deceived person *literally*, *simultaneously*, and *fully* hold both the true belief (p) and the false belief (not-p) at the very same time?**
      *   **Yes** → Go to 2
      *   **No** → Go to 4

  2.  **Is this simultaneous holding of contradictory beliefs explained by a *partition* within the self (e.g., separate subsystems, modules, or 'parts')?**
      *   **Yes** → Go to 3
      *   **No** → **Leaf 1: Radical Simultaneous Belief (Unnamed/Uncommon)**
          *   *Position:* The single, unified subject simultaneously and fully believes both p and not-p.
          *   *Awkward Commitment:* Directly violates core principles of rational belief (contradiction) and subjective unity without any explanatory mechanism.
          *   *(Note: Generally seen as incoherent/untenable)*

  3.  **Are these partitioned 'parts' best understood as possessing *genuine agency* or being *subpersonal mechanisms*?**
      *   **Genuine Agency (like mini-subjects)** → **Leaf 2: Strong Partitioning (e.g., Freudian, Homuncular)**
          *   *Position:* The self is divided into agent-like sub-selves (e.g., unconscious vs conscious); one part *intentionally* deceives the other.
          *   *Awkward Commitment:* Commits to multiple 'minds' or agent-like structures within one person, raising questions of their origin, interaction, and ultimate unity of the self.
      *   **Subpersonal Mechanisms** → **Leaf 3: Subsystem Partitioning (e.g., Modularity views)**
          *   *Position:* Contradictory beliefs are held simultaneously but in separate, functionally isolated cognitive subsystems (modules); no single subsystem holds both.
          *   *Awkward Commitment:* Requires accepting that functionally isolated subsystems can host full beliefs independently, and explaining how the 'deceived' self-level experience arises from this architecture.

  4.  **Is the key factor *varying degrees of awareness* or *accessibility* of the unwanted belief, rather than literal simultaneous belief?**
      *   **Yes** → Go to 5
      *   **No** → Go to 6

  5.  **Does the self-deceiver *intentionally* (though perhaps not consciously) manage their awareness/access to the unwanted belief?**
      *   **Yes** → **Leaf 4: Strategic Awareness Management (e.g., Intentionalist views)**
          *   *Position:* The self avoids forming the painful belief (not-p) or avoids focusing on it/avoids evidence, *guided by a desire or intention* not to believe p. Belief in not-p isn't fully formed/accessed simultaneously.
          *   *Awkward Commitment:* Requires attributing a complex, potentially unconscious intention to avoid belief/knowledge to the self, raising questions about control and responsibility.
      *   **No** → **Leaf 5: Motivationally Biased Cognition (e.g., Deflationary views à la Mele)**
          *   *Position:* No simultaneous belief; no intention to deceive. Motivation (e.g., desire, emotion) *biases* cognitive processes (attention, evidence gathering, interpretation), leading to the acquisition/sustenance of not-p without the person ever fully believing p.
          *   *Awkward Commitment:* May seem to reduce self-deception to a sophisticated form of wishful thinking or cognitive bias, potentially losing the distinctively *deceptive* and *active* phenomenology.

  6.  **Is the 'deceived' state best characterised as a *belief* at all?**
      *   **Yes** → **Leaf 6: Unnamed Motivation Type Distinction**
          *   *Position:* Self-deception involves forming the false *belief* (not-p), but crucially, the motivation can be to believe something *worse* (e.g., due to guilt, depression) rather than something flattering. (Similar mechanism to Leaf 5, but distinct motivation).
          *   *Awkward Commitment:* Highlights the challenge of explaining how negative motivations (e.g., self-punishment) can produce the same biased belief outcome as positive ones, without invoking partitions or intentions.
          *   *(Note: Relatively unexplored specific combination; often subsumed under Leaf 5)*
      *   **No** → **Leaf 7: Pretence/Imagination (e.g., Gendler, Shen-yi Liao)**
          *   *Position:* The self-deceiver doesn't truly *believe* not-p; they *imagine* it vividly, *behave as if* it's true, or *pretend* to believe it. The 'deception' is behavioural or affective, not doxastic.
          *   *Awkward Commitment:* Must explain the compelling phenomenology of *feeling* deceived and the behavioural inertia of self-deception without attributing genuine contradictory belief.

  **Leaf 8: No Distinct Phenomenon (e.g., Rorty, some eliminativists)**
  *   *Position:* There is no genuine paradox to solve. What's called 'self-deception' is either simple wishful thinking (biased belief formation without active deception), weakness of will (akrasia - knowing p but failing to act on it), or confusion about one's own mental states.
  *   *Awkward Commitment:* Denies the intuitive distinctiveness and active, deceptive character of many paradigmatic cases of self-deception.
  *   *(Reached by answering "No" to the core assumption: "I think self-deception is genuinely possible")*

  **Notes on the Tree:**

  *   **Blurred Pairs:** Leaves 4 (Strategic Awareness Management) and 5 (Motivationally Biased Cognition) can sometimes be difficult to distinguish empirically, hinging on contested notions of 'intention'. Similarly, Leaf 3 (Subsystem Partitioning) and Leaf 5 (Motivationally Biased Cognition) both rely on cognitive mechanisms but differ crucially on whether contradictory *beliefs* are simultaneously held.
  *   **Unoccupied Paths:**
      *   **Leaf 1 (Radical Simultaneous Belief):** Unoccupied because it's widely seen as incoherent.
      *   **Path to Leaf 6 via "No" to Q4 then "Yes" to Q6:** While *some* theorists discuss negative motivations within belief-based accounts (like Leaf 5), explicitly carving out a *distinct* "belief + negative motivation only" leaf (Leaf 6) is largely unexplored territory, likely because the core mechanism seems similar to Leaf 5 regardless of motivation valence. It's unattractive to propose a distinct mechanism *just* for negative cases without strong evidence.
      *   **Path: Q1 (No) → Q4 (No) → Q6 (Yes):** This path (no simultaneity, no awareness tricks, but it *is* a belief) leads directly to Leaf 5 (Motivationally Biased Cognition). Leaf 6 is a specific motivational variant reached only if you answer Q6 ("Is it belief?") as "Yes" *after* taking the "No" branch through Q4 and Q5.
  *   **"Unnamed" Leaf:** Leaf 6 is flagged as unnamed because while negative motivations *within* self-deception are discussed, treating them as defining a *mechanistically distinct* position (separate from standard deflationism like Leaf 5) isn't a common, named stance.
