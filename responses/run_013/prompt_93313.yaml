prompt: |-
  I'm putting together a handout for a grad seminar on self-deception and I want a decision tree that takes someone from 'I think self-deception is possible' to a specific position on what it actually is. The angle I care about is the self: build each branch around what you have to say about the self in self-deception for the paradox to dissolve, rather than around the usual labels. So the nodes should be things like: does the person literally hold both p and not-p at once, and if so is that handled by splitting them into a deceiver and a deceived part (and are those real subjects or just subpersonal mechanisms), or by one subject with varying degrees of awareness; is there an intention to deceive oneself or only motivationally biased belief formation; is the relevant attitude a belief at all, or something more like pretence or imagination; and can the motivation be to believe something worse about oneself rather than something flattering. Make sure one leaf is the view that there's no such thing going on, just wishful thinking or weakness of will. Phrase every node as a question someone could answer without already knowing which position it leads to. Each leaf should carry a name for the position (or 'unnamed' if nobody really defends it) plus one sentence on its most awkward commitment, and flag any pair of leaves the tree can't really separate. Also note which answer-combinations are unoccupied and say whether that's because the view is incoherent, unattractive, or just unexplored. Six to eight nodes is fine. No citations, I'll add those. British English please.
