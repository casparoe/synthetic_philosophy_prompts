prompt: |-
  I'm a cognitive-science PhD student trying to write the joint statement that two camps in the debate over letter identity could actually put their names to. On one side are the essentialists: an 'a' is an 'a' in virtue of some intrinsic structural or generative property — a topology, a stroke grammar, an invariant — that holds independently of any community's habits. On the other are the conventionalists: there is no such essence, and a form is an 'a' only because a community of readers treats it as one, the identity being exhausted by that practice. The two sides have been talking past each other, and I want to force the issue with one specific proposal to serve as common ground: that the identity of a letterform just is the class of forms invariant under the set of admissible stylistic transformations, where characterizing that set is the real work. Draft the adversarial-collaboration document. Begin with a numbered section of claims both sides can sign — about the data the dispute must accommodate (single- versus double-storey 'a' and 'g', handwritten and heavily stylized forms, degraded or partially occluded glyphs, children's letter confusions, and novel typefaces), about what would count as an essence if there were one, and about what the invariance proposal does and does not settle. Then give a disagreements table: each camp's position phrased so its own side would accept the wording; the cruxes — I suspect one is whether the admissible transformations are discovered or stipulated, and another is whether recognitional dispositions can do the work of an essence without circularity — and, for each crux, a case or argument both sides agree bears on it, with each side's prediction recorded in advance. Where the dispute turns out to be merely verbal, say which part and why.
reasoning: |-
  We are drafting an adversarial-collaboration document for two camps in the debate over letter identity: essentialists and conventionalists.

   The goal is to create a joint statement that both sides can sign, followed by a table of disagreements that includes:
     - Each camp's position in their own acceptable wording.
     - The cruxes (key points of disagreement) and for each crux:
          * A case or argument both sides agree bears on it.
          * Each side's prediction recorded in advance.

   Additionally, we note where the dispute is merely verbal.

   Structure:

   I. Joint Statement (numbered claims that both sides can sign)

   II. Disagreements Table:
       A. Essentialist Position (as they would word it)
       B. Conventionalist Position (as they would word it)
       C. Cruxes:
           1. Crux 1: [Question] 
              - Case/Argument: [description of a case or argument both agree is relevant]
              - Essentialist Prediction: 
              - Conventionalist Prediction:
           2. Crux 2: [Question]
              ... (and so on)

   III. Verbal Disputes: If any part of the dispute is merely verbal, explain which part and why.

   Now, let's draft.

   I. Joint Statement:

   We, the undersigned essentialists and conventionalists, agree on the following:

   1. Data to be Accommodated:
      The theory of letter identity must account for the following phenomena:
      a) The existence of multiple, distinct forms that are recognized as the same letter (e.g., the single-storey 'a' (ɑ) and double-storey 'a' (a) in Latin script; the single-storey 'g' (g) and double-storey 'g' (ɡ) in many typefaces).
      b) The recognition of handwritten and heavily stylized forms (e.g., calligraphic variants, graffiti, artistic lettering) as instances of the same letter.
      c) The ability to recognize degraded or partially occluded glyphs as specific letters (e.g., in poor lighting, damaged print, or when part of the letter is hidden).
      d) Patterns of letter confusions in children (and sometimes adults) during reading and writing acquisition (e.g., confusing 'b' and 'd', 'p' and 'q').
      e) The introduction and recognition of novel typefaces that include new stylistic variations of existing letters.

   2. What would count as an essence (if there were one):
      An essence of a letter would be a property (or set of properties) that:
      a) Is intrinsic to the form (i.e., not dependent on external factors such as context or community practice).
      b) Is invariant across all and only the instances of that letter, regardless of stylistic variation, medium, or degradation.
      c) Can be characterized in a way that is independent of any particular reader or community's recognitional dispositions (though it may explain them).

   3. What the invariance proposal does and does not settle:
      We agree to consider the proposal that the identity of a letterform is the class of forms invariant under the set of admissible stylistic transformations. We note that:
      a) This proposal frames the debate in terms of characterizing the set of admissible transformations.
      b) It does not, by itself, resolve the fundamental disagreement about the nature of that set (i.e., whether it is discovered or stipulated, and whether it is grounded in intrinsic properties or social practices).
      c) It provides a common framework for both sides to generate testable predictions about which transformations are admissible and which are not, and to evaluate the role of intrinsic structure versus community practice.

   II. Disagreements Table:

   A. Essentialist Position (as they would word it):
      "The identity of a letter is determined by an intrinsic structural or generative property (such as a topological feature, a stroke grammar, or an invariant) that is independent of any particular community's reading practices. The admissible stylistic transformations are those that preserve this intrinsic property, and they are discovered through analysis of the form, not stipulated by convention."

   B. Conventionalist Position (as they would word it):
      "The identity of a letter is solely determined by the recognitional practices of a community of readers. There is no intrinsic essence; instead, the set of admissible stylistic transformations is defined by what the community (implicitly or explicitly) accepts as the same letter. The invariance observed is a product of shared conventions and social practices."

   C. Cruxes:

   Crux 1: Are the admissible transformations discovered (as the essentialists claim) or stipulated (as the conventionalists claim)?

      - Case/Argument: Consider the development of a novel typeface that introduces a transformation of a letter that has not been seen before (e.g., a radical redesign of the letter 'a'). Both sides agree that if the transformation is accepted by the reading community without explicit instruction (i.e., readers can recognize it as an 'a' without being taught), that would support the essentialist view that there is an underlying invariant that readers are sensitive to. Conversely, if the transformation is rejected until it is taught and becomes conventional, that would support the conventionalist view.

      - Essentialist Prediction: In the case of a novel transformation that preserves the essential structural property, readers will recognize the new form as the same letter without prior exposure or explicit instruction, because the transformation is admissible by virtue of the intrinsic structure.

      - Conventionalist Prediction: Recognition of a novel transformation will depend on the community's prior exposure to similar transformations or explicit instruction. Without such social grounding, recognition will be inconsistent and may require a period of conventionalization.

   Crux 2: Can recognitional dispositions do the work of an essence without circularity?

      - Case/Argument: Consider the phenomenon of letter confusions (e.g., children confusing 'b' and 'd'). Essentialists argue that an intrinsic structural property (like a topological feature or a stroke-based description) can explain why these confusions occur (e.g., because the forms are mirror images and the intrinsic property doesn't distinguish them) without circularity. Conventionalists argue that such confusions are the result of learned conventions and that any appeal to recognitional dispositions (even when they are nearly universal) is ultimately grounded in social practice and does not require an intrinsic essence.

      - Essentialist Prediction: Patterns of letter confusions will be predictable from the intrinsic structural properties of the letters and will be consistent across communities and writing systems that use the same basic forms, regardless of differences in teaching methods.

      - Conventionalist Prediction: Patterns of letter confusions will vary with the community's teaching practices, the frequency of exposure to different forms, and the conventions of the writing system, and they may change over time as conventions evolve.

   III. Verbal Disputes:

      We note that part of the dispute may be verbal in the following way:

      The term "essence" is sometimes used by essentialists to refer to an intrinsic property that is independent of all human practices. Conventionalists, however, might argue that what essentialists call "essence" is actually a pattern of regularity in the community's recognitional practices that has been reified. 

      However, the core disagreement is not merely verbal because it turns on the direction of explanation: 
          - Essentialists claim that the community's recognitional practices are explained by the intrinsic properties of the forms.
          - Conventionalists claim that the apparent regularities in the forms are explained by the community's practices.

      The invariance proposal does not resolve this but provides a framework for testing it.

      Thus, we conclude that the dispute is substantive and not merely verbal.

   This document serves as a starting point for adversarial collaboration, where both sides commit to testing their predictions against the agreed cases and data.
answer: |-
  ### Joint Statement on Letter Identity: Adversarial Collaboration Document  

  **I. Claims Both Sides Endorse**  
  1. **Data to Accommodate**:  
     - The theory must explain:  
       a) Variants treated as identical (e.g., single- vs. double-storey "a" and "g").  
       b) Recognition of handwritten, stylized (e.g., calligraphic), and novel typeface forms (e.g., experimental fonts).  
       c) Robust recognition of degraded or partially occluded glyphs (e.g., smudged text).  
       d) Systematic letter confusions in children (e.g., "b"/"d" reversals) and adults.  
       e) Cross-script invariance (e.g., Cyrillic "т" vs. Latin "T" confusion only when structurally analogous).  

  2. **Criteria for an Essence (If One Exists)**:  
     - An essence must:  
       a) Be *intrinsic*: Independent of specific observers or cultural practices.  
       b) Be *structurally generative*: Define necessary and sufficient conditions for producing all/all and only admissible forms (e.g., stroke-sequence rules for "a").  
       c) *Explain* recognition: Account for patterns in (1) without ad hoc appeals to convention.  

  3. **Invariance Proposal: Scope and Limits**:  
     - We agree that letter identity can be framed as **the class of forms invariant under admissible stylistic transformations**.  
     - This proposal:  
       a) **Clarifies the debate**: Shifts focus to characterizing the set of admissible transformations (e.g., rotations, stroke additions, topological deformations).  
       b) **Does not resolve**: Whether transformations are *discovered* (essentialist) or *stipulated* (conventionalist), or whether invariance presupposes recognitional practices.  
       c) **Neutral ground**: Both sides accept this formalism as a tool for testing hypotheses against data in (1).  

  ---  

  ### II. Disagreements Table  
  | **Aspect** | **Essentialist Position** | **Conventionalist Position** |  
  |------------|---------------------------|------------------------------|  
  | **Core Position** | "A letter’s identity is grounded in an intrinsic structural property (e.g., topology, stroke grammar) that exists independently of recognitional practices. Admissible transformations preserve this property." | "A letter’s identity is constituted solely by communal recognitional practices. What counts as an admissible transformation is defined by these practices, not intrinsic structure." |  
  | **Crux 1: Source of Admissible Transformations** | | |  
  | - **Question**: Are admissible transformations *discovered* (via structural analysis) or *stipulated* (via convention)? |  
  | - **Shared Case**: A novel letterform midway between "a" and "o" (e.g., a closed-top "a" with a curved spine) is introduced in a typeface. |  
  |   - **Essentialist Prediction**: Recognition will correlate with objective structural metrics (e.g., curvature continuity, endpoint relations). Disagreement among readers will resolve to a binary outcome (either "a" or "o") based on violation of transformation rules. |  
  |   - **Conventionalist Prediction**: Recognition will vary by community (e.g., designers vs. novices) and converge only after exposure/negotiation. Ambiguity may persist, reflecting the absence of an essence. |  
  | **Crux 2: Circularity of Recognitional Dispositions** | | |  
  | - **Question**: Can recognitional dispositions explain invariance without presupposing the essence they purport to define? |  
  | - **Shared Case**: Children taught only handwritten "a" (e.g., ɑ) later recognize printed double-storey "a" (a) without instruction. |  
  |   - **Essentialist Prediction**: Success implies sensitivity to an untaught structural invariant (e.g., topology: one enclosed counter). Error patterns (e.g., confusing "a" with "e") will align with structural overlaps. |  
  |   - **Conventionalist Prediction**: Success reflects statistical learning of family-resemblance clusters (e.g., exposure to "a"-like shapes in environmental print). Errors will align with frequency of local conventions (e.g., "a"–"o" confusion if similar in local fonts). |  
  | **Crux 3: Degraded Forms and Occlusion** | | |  
  | - **Question**: Does robust recognition under degradation imply an intrinsic essence? |  
  | - **Shared Case**: A fragmented "B" (e.g., only the top and bottom curves visible) is recognized reliably. |  
  |   - **Essentialist Prediction**: Recognition thresholds depend on preservation of non-accidental properties (e.g., parallelism of curves). Degradation studies will reveal invariant minima (e.g., 40% of strokes suffice). |  
  |   - **Conventionalist Prediction**: Recognition depends on learned priors (e.g., Bayesian inference from context). Thresholds will vary by script familiarity (e.g., worse for unfamiliar fonts) and context (e.g., word predictability). |  

  ---  

  ### III. Merely Verbal Dispute  
  - **The Term "Invariant"**:  
    Essentialists use "invariant" to denote an *objective structural property* (e.g., "an 'a' must have an enclosed counter"). Conventionalists use it to mean *regularities in communal response* (e.g., "readers treat forms with enclosed counters as 'a'").  
  - **Why Verbal**: Both sides agree invariance exists but dispute whether it is *descriptive* (conventionalist) or *explanatory* (essentialist). This masks deeper disagreements about ontology (e.g., whether structure precedes practice).  
  - **Resolution**: We reframe debates as empirically testable (e.g., "Does structural invariance *predict* recognition better than cultural exposure?").  

  ---  
  **Signed**,  
  [Essentialist Signatories]  
  [Conventionalist Signatories]  

  **Next Steps**: Joint experiments on novel letterforms (Crux 1), cross-cultural recognition studies (Crux 2), and degradation thresholds (Crux 3), using the invariance framework to generate competing predictions.
