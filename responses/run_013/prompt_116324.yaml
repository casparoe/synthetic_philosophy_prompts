prompt: |-
  I am an undergraduate taking a course in democratic theory this term, and I run a small weekly discussion group — seven friends from law, statistics and computer science — to work through whatever the course has raised that week. Next week is selection by lot. I have ninety minutes, a whiteboard, and an audience that will not do assigned reading, so please do not give me the explanation itself. Give me a plan for teaching it: the order the ideas have to go in, the example that carries the session, the misconceptions to expect and exactly where to defuse them.

  Two things about the group. They arrive with the Athenian assembly and the criminal jury as their fixed associations with lotteries, and they read both as establishing that selection by lot is fundamentally about impartiality. The statistics people also hold, as a settled intuition, that a random sample is representative of the population it is drawn from; the law people hold that legitimacy comes from accountability. I want them to leave able to say what a lottery is a solution to, and alert to where influence migrates once elections are removed.

  I have a candidate for the carrying example, and I want a verdict on it rather than a substitute chosen in ignorance of it. It is not the familiar proposal to replace a legislature with a randomly chosen citizens' assembly. It is the cousin in which the decision is randomized rather than the deciders: everyone votes as usual, and the outcome is settled by a single randomly drawn voter, or by a small randomly drawn panel of voters, so that the lottery operates on the choice of policy and not on the identity of the officeholder. My reason for proposing it is that it separates the representativeness of a deciding body from the aggregation of preferences, which I expect the group to conflate from the first minute. Tell me whether it can carry the session, or whether it is too strange to do so and belongs at the end as a payoff.

  The plan should have the following sections, in this order and at roughly these lengths.

  1. Order of ideas (about 350 words). What has to be in place before what, and why — including which conception of the problem the session has to settle on before the mechanism stops looking arbitrary. Note where the order would have to change if I settled on a different target problem.

  2. The carrying example (about 350 words). Your verdict on my candidate, and a statement of what the example that carries the session must have and must lack. Say explicitly why not the jury and why not Athens, since those are what they will reach for.

  3. Misconception map (about 450 words). A table with three columns — the misconception, the moment in the sequence when it surfaces, and the move that defuses it — followed by a sentence on each row. Cover at least the sample-size intuition, the confusion of selection by lot with the appointment of experts, the jury analogy, and the assumption that without elections there is no accountability.

  4. Check for understanding (about 150 words). One question to put at the end, and what a good and a poor answer to it would look like.

  5. Left out on purpose (about 150 words). What I should decline to cover at this level, and the sentence I use to decline it.

  No names, no reading lists, no citations, and nothing that assumes the group has heard of a particular theorist. If a concept is needed, define it in the session's own terms.
reasoning: |-
  Okay, the user is an undergraduate running a discussion group on democratic theory, focusing on selection by lot. They have 90 minutes, a whiteboard, and a group of seven friends from law, stats, and CS who won't do assigned reading. The goal is to make them understand what problem lotteries solve and where influence shifts when elections are removed. 

  The group comes in with fixed associations: Athenians and juries, seeing lotteries as about impartiality. Statisticians believe random samples are representative, while law students think legitimacy comes from accountability. The user wants to challenge these intuitions.

  They've proposed a unique example: randomizing the decision (selecting a single voter or small panel to decide the outcome) rather than the deciders. This separates representativeness from preference aggregation. The user wants a verdict on whether this example can carry the session or if it's too strange.

  I need to provide a detailed plan in five sections: order of ideas, verdict on the example, misconception map, check for understanding, and what to leave out.

  For the order of ideas, I'll start by defining the problem elections solve—preference aggregation—and how lotteries solve a different problem: preventing strategic manipulation. Then build up to the user's example. The sequence should challenge their existing intuitions step by step.

  The carrying example is brilliant. It forces the group to confront the core conflict: lotteries aren't about representativeness but about breaking deterministic control. It isolates the "problem of capture" vividly. I'll explain why it's better than Athens/jury examples—those focus on impartial deciders, not the decision mechanism itself.

  For misconceptions, I'll map when each arises and how to defuse them. The stats people's sample-size intuition will surface early; I'll challenge it by showing a single voter can theoretically represent the whole. The law students' accountability concern needs reframing: lotteries shift accountability to the system design, not individuals.

  The check question should test if they grasp influence migration. A good answer identifies how interest groups lose leverage; a poor one fixates on "fairness" or representation.

  I'll leave out sortition's scalability and modern implementations. If asked, I'll say: "That's about application—today we're mapping the core mechanic."

  This plan respects their constraints (no readings, diverse backgrounds) while targeting their key misconceptions. The example is provocative but perfect—it's strange enough to disrupt assumptions but logically sound. I'll structure the session to make the unfamiliar familiar by the end.
answer: |-
  Here’s a focused 90-minute plan targeting your group’s intuitions and leveraging your proposed example:

  ### 1. Order of Ideas (Core Sequence)
  **(~10 min) Start with "What problem do elections solve?"**  
  Whiteboard: Elections aggregate preferences to pick winners reflecting majority/minority interests. Problem: They incentivize strategic behavior (campaign spending, lobbying, polarization) because outcomes are predictable. Influence concentrates on shaping predictable votes.  
  **(~15 min) Introduce "The Problem of Capture":**  
  When outcomes are predictable, resources flow into influencing that prediction. This distorts representation. Elections solve preference aggregation but *create* this vulnerability.  
  **(~20 min) Pose "What if we broke predictability?"**  
  Enter lotteries. Not as impartiality (yet), but as *randomization*. Stress: Randomization isn’t about "who decides" (yet) – it’s about injecting uncertainty into the *outcome*. This undermines investment in influence.  
  **(~30 min) Deploy Your Carrying Example:**  
  "Imagine a referendum. Instead of counting all votes, we randomly pick *one* ballot from all cast. That single vote decides. Or: pick 3 ballots randomly, majority rules. What changes?" Use whiteboard to contrast with normal elections. Key leap: **The lottery shifts focus from *controlling voters* to *accepting chance*.** Influence migrates *away* from lobbying/campaigning (futile against randomness) and toward *ensuring broad participation* (so your ballot is in the hat).  
  **(~15 min) Now Reframe Impartiality & Representativeness:**  
  Athenians/juries used lotteries to *select people* impartially. Your example shows lotteries can *decide outcomes* impartially (no fixed bias). Representativeness (stats intuition) matters less here – it’s about breaking deterministic control. Accountability (law intuition) shifts: Not individuals accountable for decisions, but the *system* accountable for fair random selection and participation access.

  *If target problem changed (e.g., only citizen assemblies):* Start with representative claims vs. expert claims, then introduce lotteries as anti-elitist. Your example forces the "capture" issue better.

  ### 2. Verdict on Your Carrying Example: USE IT. IT’S IDEAL.
  **Why it works:**  
  - **Disrupts Conflation:** Physically separates the "random sample" (stats) from "preference aggregation" (elections) by making sampling *directly* determine the outcome. Forces confrontation: Is representativeness or unpredictability the key?  
  - **Exposes Influence Migration:** Dramatically shows why lobbyists hate this – they can’t game randomness. Highlights participation as the new leverage point.  
  - **Makes "Problem of Capture" Tangible:** Predictability = vulnerability. Randomness = armor.  
  **Why NOT Athens/Jury:**  
  - Athens/Jury focuses on *who judges/rules*, implying lotteries are about selecting *impartial agents*. Your group already defaults here. Your example shows lotteries can be about *impartial mechanisms*, even with all agents voting. It attacks "elections = only path" bias.  
  **Crucial for the Example:**  
  - **MUST:** Contrast with normal voting (predictable outcome). **MUST LACK:** Any discussion of the *panel's* deliberation. This is about raw input → random output. Save deliberation for citizen assemblies later.

  ### 3. Misconception Map

  | Misconception                          | When It Surfaces                   | Defusing Move                                                                 | Sentence                                                                                                |
  | :------------------------------------- | :--------------------------------- | :---------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------ |
  | **Sample Size = Representativeness** (Stats) | Intro of your example ("One vote?!") | Ask: "Does Pepsi lobby *every* consumer in a poll? Why not? What changes if the *decision* is random?" Link to predictability, not sample error. | "It’s not about polling the population accurately; it’s about making the result *uninvestable* for manipulation." |
  | **Lotteries appoint amateurs/experts** | When contrasting with elections     | Clarify: "We’re not picking people *to be experts* here. We’re randomizing the *result*. Expertise is irrelevant to the mechanism."          | "This isn’t about who is qualified. It’s about whether the *path to power* can be gamed."               |
  | **"Like a jury, so it’s about fairness"** (Law) | When introducing lotteries broadly | Distinguish: "Juries use lotteries to pick *impartial people*. Here, we’re using a lottery to *prevent predictable outcomes*, regardless of who votes." | "Fairness in juries is about the decider’s neutrality. Fairness here is about the *system’s* resistance to capture." |
  | **No Elections = No Accountability** (Law) | Post-example discussion            | Shift accountability: "Accountability moves *from the elected official* to *the rules of the lottery and access to participation*. Who ensures the draw is fair? Who ensures everyone can vote?" | "Elections hold *persons* accountable. This holds the *process* accountable. Different focus." |

  ### 4. Check for Understanding
  **Question (Post-discussion):** "If we used the single random vote method for a big infrastructure project, what specific types of political influence (e.g., lobbying, dark ads) become less effective, and why? Where might influence efforts shift instead?"  
  - **Good Answer:** Identifies reduced effectiveness of targeted lobbying/spending (can't sway one random vote predictably) and mass propaganda (no clear majority to manipulate). Notes shift toward efforts to boost universal turnout/access (more ballots in the hat) and ensuring procedural fairness.  
  - **Poor Answer:** Focuses only on "fairness" or "representativeness" of the single vote. Repeats "lobbying bad" without connecting to randomness. Assumes corruption of the vote-draw official is the main flaw.

  ### 5. Left Out on Purpose
  **Do NOT cover:** Practical implementation challenges (sortition body size, compensation, facilitation) or direct comparison of specific modern sortition proposals (e.g., Climate Assembly vs. Parliament). **Reason:** This session is about the *core logic and problem definition*. Implementation distracts from the conceptual shift.  
  **Sentence to decline:** "That’s crucial for making it work in practice, but today we’re just mapping the core idea – *what problem* this mechanic uniquely solves and *how* it reroutes power. Let’s stick to the blueprint before we build the house."
