answer: |-
  ### Why Be Moral? Decision Tree Handout  
  Based on thought experiments to sort ethical positions without prior theory knowledge. Start at Q1 and follow your answers. Positions at leaves include core commitments and awkward implications.  

  **Q1: Classic Ring (invisibility, impunity, no one finds out). Would you take it?**  
  - **Yes** → Go to Q2  
  - **No** → Go to Q3  

  **Q2: (For "Yes" to Q1) Memory-Wipe Ring (you forget using it; no guilt or self-knowledge). Would you use it?**  
  - **Yes** → Go to Q4  
  - **No** → Go to Q5  

  **Q3: (For "No" to Q1) Why not take the classic ring?**  
  - **Fear of being found out/punished** → Go to Q6  
  - **Would feel guilty** → Go to Q7  
  - **Using it is bad for me (no punishment/guilt)** → Go to Q8  

  **Q4: (For "Yes" to Q2) Everyone-Gets-a-Ring (world of universal invisibility). Would you still use yours?**  
  - **Yes** → Go to Q9  
  - **No** → **Hobbesian/Contractarian**  
    - *Core*: Morality depends on mutual advantage; sovereign sanctions enforce it.  
    - *Awkward*: No inherent wrongness—e.g., injustice is fine if you outsmart the system.  

  **Q5: (For "No" to Q2) Why avoid the memory-wipe ring?**  
  - **Inherently wrong, regardless of feelings** → **Kantian/Constructivist**  
    - *Core*: Morality is categorical; unjust acts violate rational duty.  
    - *Awkward*: Duties can conflict with flourishing (e.g., must not lie to a murderer).  
  - **Still bad for me, even without guilt** → Go to Q10  

  **Q6: (For "Fear" to Q3) Memory-Wipe Ring. Would you take it? (No risk of exposure.)**  
  - **Yes** → **Hobbesian/Contractarian** (as above)  
  - **No** → Go to Q8 (reclassify: your objection isn’t just about punishment)  

  **Q7: (For "Guilt" to Q3) Memory-Wipe Ring. Would you take it? (No guilt possible.)**  
  - **Yes** → **Humean Sentimentalism**  
    - *Core*: Morality stems from empathy/sentiments, not reason.  
    - *Awkward*: "Wrongness" vanishes if sentiments change (e.g., psychopaths have no reason to be moral).  
  - **No** → Go to Q8 (your objection isn’t just about feelings)  

  **Q8: (For "Bad for me" to Q3 or redirected here) Memory-Wipe Ring. Would you take it?**  
  - **Yes** → *Incoherent/Unoccupied* (If it’s bad for you, why does memory-wipe change that? Rare.)  
  - **No** → Go to Q10  

  **Q9: (For "Yes" to Q4) Stranger-Only Ring (impunity only for distant strangers). Would you use it?**  
  - **Yes** → **Hypothetical Imperatives**  
    - *Core*: Morality rests on desires (e.g., "be moral if you want social trust").  
    - *Awkward*: No reason to be moral if you lack relevant desires (e.g., a hermit can exploit strangers).  
  - **No** → **Error Theory / Fictionalism / Anti-Theory**  
    - *Core*: Moral facts don’t exist (Error), are useful fictions (Fictionalism), or morality isn’t unified (Anti-Theory).  
    - *Awkward*: Living "as if" moral while believing it’s fake (Fictionalism); no clear "why" answer (Anti-Theory).  

  **Q10: (From Q5/Q8) One-Unjust-Act Ring (do one injustice, then become saintly). Would you use it?**  
  - **Yes** → **Aristotelian Eudaimonism**  
    - *Core*: Morality maximizes flourishing; trade-offs can be rational.  
    - *Awkward*: Justifies minor evils for greater self-improvement (e.g., betray one friend to become a philanthropist).  
  - **No** → **Platonist**  
    - *Core*: Injustice intrinsically damages the soul/harmony.  
    - *Awkward*: Even "victimless" injustice (e.g., stealing from a corporation) corrupts you.  

  ---

  ### Key Notes:  
  1. **Indistinguishable Positions** (Tree can’t separate):  
     - **Kantian vs. Divine Command**: Both reject rings as inherently wrong. Divine Command adds "because God forbids it," but the cases don’t test theology.  
     - **Error Theory vs. Fictionalism vs. Anti-Theory**: All say "yes" to rings when sentiments/punishment vanish (Q4→Q9→No). Cases don’t probe meta-ethics deeply.  
     - *Why?* Cases prioritize psychological responses over metaphysical reasons.  

  2. **Unoccupied/Incoherent Answer Combinations**:  
     - **"No to classic ring out of self-interest (Q3-B3) → Yes to memory-wipe ring (Q8-Yes)"**: Incoherent—if it’s bad for you, forgetting doesn’t fix the harm.  
     - **"Yes to memory-wipe ring (Q2-Yes) → No to everyone-gets-a-ring (Q4-No)" but not Hobbesian**: Unattractive—fear of chaos without sovereign isn’t fear of *personal* punishment.  
     - *Why?* Logic (incoherent) or psychological implausibility (unattractive).  

  3. **Most Critical Node: Q2 (Memory-Wipe Ring)**  
     - Tests if your objection relies on **guilt** (Humean), **self-harm** (Platonist/Aristotelian), or **principle** (Kantian).  
     - *Defend it*: If students say "my answer doesn’t fit," ask: *"Does your reason for avoiding injustice depend on remembering it? If not, why reject the memory-wipe ring?"*  

  ---  
  **Format**: Fit to 1 page. Use in tutorial by having students self-sort via answers, then discuss leaf commitments. Cases italicized for reference (e.g., *Memory-Wipe*).
