answer: |-
  ## Farewell Remarks

  Friends, colleagues, trustees, honoured guests. Nineteen years. Standing here tonight, looking out at faces that have become so deeply familiar, so intertwined with the life and purpose of this remarkable institute, is profoundly moving. My gratitude is immense – for your partnership, your intellect, your unwavering commitment to the difficult, essential work of understanding the world. Thank you.

  Tonight also marks the launch of our new program dedicated to exploring the uses of history in statecraft. This is a vital endeavor, and I bless it absolutely. Understanding the past is not a luxury in our field; it’s a necessity. History provides the texture, the context, the long arc against which the urgent present must be measured. The trustees’ foresight and generosity in funding this program cement its importance to our future. It promises to catalogue, dissect, and illuminate the analogies policymakers inevitably reach for. And it is precisely because this work *is* so important that I feel compelled, in this final formal address, to offer not just praise, but a seasoned practitioner’s caution about the very tool this program will study: the historical analogy itself.

  We must recognize that invoking an analogy is never a neutral act of recalling pure facts. **The source case is always already interpreted.** When we say "This is like Munich," we are not merely referencing September 1938. We are invoking a *particular reading* of Munich – a narrative of appeasement, of disastrous capitulation to aggression. But that reading itself is contested. Was it truly naive appeasement, or a necessary, if ultimately insufficient, buying of time for rearmament? Were the alternatives truly viable? By choosing "Munich" as our analogy, we smuggle in that specific, contested interpretation alongside the warning we intend to convey. The analogy carries its own hidden baggage of historical argument before it even begins its work on the present crisis.

  This leads directly to the second point: **Choosing the comparison is effectively the entire inference.** When a policymaker looks at a rising power and instinctively invokes the "Thucydides Trap," they have already made a profound judgment. They have decided that the dynamics of Athens and Sparta five centuries before Christ are the *most relevant* lens for this modern rivalry. That selection predetermines the range of outcomes considered likely, even possible. The subsequent reasoning – about arms races, alliances, the inevitability of conflict – flows *from* that initial, often intuitive, choice of analogy. Crucially, **this reasoning can never truly test the validity of the analogy itself.** It operates within the framework the analogy imposes. The analogy licenses the reasoning, but the reasoning cannot license the analogy.

  Furthermore, **a single, vivid precedent cannot do the work of a general rule.** History doesn’t repeat; it rarely even rhymes neatly. The power of a story like Vietnam, or Munich, lies in its specificity – its unique constellation of personalities, technologies, ideologies, and sheer happenstance. But policy demands generalizable understanding. The fatal flaw is that **the counterfactual is never available.** We know what happened when Chamberlain met Hitler at Munich. But we can never know, definitively, what would have happened if he had refused, if war had come in 1938 instead of 1939. Was the outcome inevitable, or contingent? Without that counterfactual, the lesson drawn – "never appease" – becomes an absolute, detached from the messy, unrepeatable context that birthed it. We mistake a singular, dramatic event for an iron law.

  This brings me to the asymmetry of risk. **The costs of over-applying and under-applying a precedent are profoundly uneven.** Consider the Munich analogy. Over-applying it – seeing every adversary as Hitler, every negotiation as appeasement – risks unnecessary, catastrophic conflict. We commit to paths of confrontation where diplomacy might have succeeded, blinded by the fear of repeating 1938. Under-applying it – dismissing the analogy entirely when faced with genuine, aggressive expansionism – risks enabling precisely the kind of unchecked aggression it warns against. The literature on "lessons learned" often treats these errors as equivalent, mere intellectual mistakes. They are not. The consequences exist on vastly different scales. The cost of unnecessary war generally dwarfs the cost of a missed opportunity for coercion. Yet our analogies, weighted by the visceral horror of past failures like Munich or Vietnam, often pull us towards over-application.

  So, does this mean our new program catalogues only pitfalls? Absolutely not. Understanding these dangers *is* the path to using history well. Because historical reasoning, deployed wisely, remains indispensable. **Analogies are superb at generating options and diagnosing situations.** Facing a complex crisis, asking "What situations in the past *feel* like this?" forces us to articulate the core dynamics at play. Is it a classic security dilemma? A revolution exporting ideology? An empire overextended? This diagnostic power is immense. It illuminates patterns, potential leverage points, and crucially, *alternative pathways* that might not be immediately obvious. Examining how different actors navigated *seemingly* similar pressures in the past – the Congress of Vienna versus Versailles, deterrence in the Cuban Missile Crisis versus the Able Archer scare – opens the mind to possibilities beyond the most immediately visible choices.

  *(Pause)*

  And here, I must acknowledge the tension. Even as I warn against the seductive dangers of historical analogy, I find myself using one. When I speak of the asymmetry of costs – the vastly greater peril of over-applying a lesson like Munich compared to under-applying it – I am implicitly invoking a framework shaped by observing the trajectories of past conflicts ignited by overreaction versus those where restraint later seemed, perhaps mistakenly, excessive. I am, in this very critique, leaning on a pattern observed across numerous historical cases to support my argument about risk assessment. I do this consciously, hoping the *specific* claim about asymmetric costs stands on its own analytical merits, even as the *form* of the argument illustrates the ever-present pull of analogy. The tool is hard to avoid; the key is to wield it with open eyes.

  Therefore, colleagues, analysts, friends: bless this new program. Engage with it deeply. Catalogue the analogies, dissect their uses and misuses. But let its ultimate lesson be this: **Use history to diagnose the terrain, not to predict the destination. Use it to generate options, not to foreclose them.** Seek not the single, perfect precedent that "tells you what to do," but the constellation of cases that illuminate the *kinds* of forces at work, the *range* of possible outcomes, and the *asymmetric* consequences of getting the historical calibration wrong. Understand that your chosen analogy carries its own hidden history of debate. Challenge its selection as fiercely as you reason within its frame.

  My time leading this beacon of thoughtful analysis has been the privilege of a lifetime. I leave knowing the pursuit of understanding – rigorous, humble, and aware of its own tools' limitations – is in the best possible hands. History is not a crystal ball, but a vast, complex, illuminating library. Our new program ensures we will navigate it not as tourists grabbing postcards, but as scholars seeking genuine, usable light. Thank you, and farewell.

  ---

  **Note on Claims (Not for Delivery):**

  *   **Settled (Broadly Accepted):**
      *   **The source case is already interpreted:** Historians widely agree that historical events are not accessed "raw" but through layers of narrative, interpretation, and historiography. Selecting an analogy inherently selects an interpretation.
      *   **Selection bias/Choice of comparison is crucial:** The recognition that *which* historical case is chosen for comparison heavily shapes the resulting analysis is a foundational critique in the literature on analogical reasoning in IR and history.
      *   **Counterfactuals are unavailable/Problematic:** The inherent difficulty and speculative nature of historical counterfactuals is a standard methodological caution.
      *   **Analogies better for diagnosis/option generation than forecasting:** This is a common practical observation among experienced analysts and historians. Analogies excel at framing problems and suggesting possibilities, but their predictive power is weak.

  *   **Genuinely Contested:**
      *   **The asymmetry of costs (over-application vs. under-application):** While the *idea* of asymmetric risks is discussed, the *specific claim* that the costs of over-applying lessons like Munich are *systematically and significantly greater* than under-applying them is debated. Some argue the costs depend entirely on the specific context (e.g., under-applying Munich to Putin in 2014 might be seen as catastrophic). The speech takes a distinct position here, emphasizing the generally higher cost of unnecessary war.
      *   **Analogy "can never be tested by the reasoning it licenses":** While the selection bias point is settled, the stronger claim that reasoning *within* the analogy's frame provides *no* test of its validity is a point of methodological debate. Some argue that if reasoning within the analogy yields consistently poor predictions or prescriptions, it *does* indirectly challenge the analogy's relevance, though disentangling this is difficult. The speech takes a strong stance on the primacy of the initial selection.

  *   **Taking a Side in Live Disagreement (Specifically Avoiding Consensus):**
      *   **Readings of Munich/Vietnam:** The speech deliberately uses "Munich" as shorthand for an "appeasement leads to disaster" interpretation and "Vietnam" as shorthand for the dangers of quagmire/overreach *without* presenting these as the singular, undisputed meanings. It explicitly notes that interpretations of Munich (e.g., appeasement vs. buying time) are contested and that counterfactuals for Vietnam are unknown. This avoids asserting a false consensus. The speech leverages the *common policy usage* of these analogies ("Munich" = appeasement bad, "Vietnam" = quagmire bad) for its argument about their dangers and asymmetric risks, while quietly acknowledging in the text that these interpretations are themselves the subject of historical debate. It does *not* endorse one specific reading as correct.
