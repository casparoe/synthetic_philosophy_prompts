  We are designing a quiz that distinguishes between several positions in the aesthetics of morally problematic art. The positions we are considering are:

  1. Radical Autonomism: Moral and aesthetic value are entirely separate and never interact.
  2. Moderate Autonomism: Moral defects never make a work worse as art, but they can give non-aesthetic reasons not to engage with it.
  3. Ethicism: Moral defects are aesthetic defects.
  4. Immoralism: Moral defects can sometimes be aesthetic merits (they can enhance the work).
  5. Moralism: Moral value is what ultimately matters, and aesthetic value is secondary or instrumental to it.
  6. Deflationary: The question is malformed because "the work" isn't a stable unit of evaluation.

  Additionally, we want to separate the locus of the moral problem:

  - (1) Content: The work argues for something immoral.
  - (2) Perspective/Attitude: The work invites you to enjoy something immoral.
  - (3) Production: The work was made immorally (e.g., exploited labor, stolen data).
  - (4) Artist's Life: The artist is a terrible person, but this doesn't reflect in the work.

  We also want to include questions about actions (recommend, assign, display) because that's where positions might diverge.

  The quiz will have 8-10 questions, each a concrete case with 2-3 answer options. Each answer option will reflect a particular stance on the locus and the overall position. Then we'll have a scoring key that maps patterns of answers to the named positions.

  We must avoid questions that directly ask about the positions (like "are moral defects aesthetic defects?"). Instead, we present cases and ask for judgments.

