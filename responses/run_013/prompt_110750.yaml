prompt: |-
  I work in the listing unit of a state wildlife agency — we get petitions to protect particular populations, and the whole thing hinges on wether we call the population a species, a subspecies, or a "distinct population segment," because that label is basically what decides whether it gets legal protection at all. I got into a long argument about this with a friend of mine who's a systematist at a university museum; she thinks the way we do it is astrology, since there's no one true species concept and the choice between them is doing a lot of hidden work, and honestly she half-convinced me. But we still have to sign off on these petitions, usually within a couple of weeks, in front of a five-person committee, and nobody on that committee is a taxonomist except her, on loan. We get maybe three or four petitions a year, but each one is a year of somebody's life and a real chunk of management budget, so I don't want to just wave them through on vibes.

  So what I want from you is a decision procedure we could actually run, in order, on a petition: the questions to ask, what counts as a good enough answer to each, where the procedure stops with a clean no, and — this is the part I care most about — where it has to hand the decision to a person because the remaining question is about values rather than about nature (how much divergence is "enough," how much weight we give to preserving the possibility of future evolutionary change, whether we're willing to be splitters or lumpers, whether the label is really a conservation tool rather than a fact about the world). Ground it in whatever the species literature actually establishes — the competing concepts, the difference between a group being diagnosable and its being a separately evolving lineage, the fact that lots of species are paraphyletic with respect to each other — but keep it usable by someone whose last biology class was in college. The cases that break us: a bat that looks identical to a neighboring bat but has a distinct echolocation call and one weird mitochondrial lineage; two salamander populations that meet along a contact zone and hybridize freely right where they meet; and a desert fish that's obviously its own thing morphologically but genetically sits nested inside another, more widespread species. Run the procedure on all three, including whichever one comes out telling me the population I personally want to protect doesn't qualify. Be upfront about what the procedure can't do and where it's most likely to misfire.

  Two things about the answer. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back at me. And tell me what would change your mind: which argument or piece of evidence would push you toward a different procedure or flip one of the three calls, and where your own reasoning is weakest.
reasoning: |-
  Alright, the user works in a state wildlife agency's listing unit. They handle petitions to protect populations, and the classification as species, subspecies, or distinct population segment (DPS) determines legal protection. They had a debate with a systematist friend who criticized their approach as arbitrary, like astrology, since there's no single species concept. The user is half-convinced but needs a practical decision procedure for their committee. They want a step-by-step process grounded in literature but usable by non-experts. The key cases are a bat with distinct calls and mitochondrial lineage, hybridizing salamanders, and a morphologically distinct but genetically nested desert fish.

  First, I need to recall the main species concepts: Biological Species Concept (BSC) focuses on reproductive isolation, Phylogenetic Species Concept (PSC) on monophyly and diagnosability, and others like Evolutionary or Genetic. The user mentioned issues like diagnosability vs. evolving lineage and paraphyly. The challenge is balancing scientific criteria with value-based decisions where science is ambiguous.

  The procedure must be sequential, with clear stopping points. Start with objective criteria, escalate to committee when values come in. Steps should include genetic distinctness, morphological differences, reproductive isolation, ecological divergence, etc. For each step, define thresholds for "no" or "pass to committee."

  Looking at the cases:
  1. The bat: morphologically identical but different echolocation and mitochondrial lineage. Echolocation might indicate pre-mating isolation. Mitochondrial lineage alone doesn't confirm distinctness; could be ancestral polymorphism. Step 1 (genetic distinctness) might not pass, leading to Step 3 (reproductive isolation). If echolocation prevents interbreeding, it might qualify under BSC. But the committee needs to decide if behavioral difference is enough.

  2. Salamanders: hybridize freely in a contact zone. This challenges BSC. If hybridization is extensive, they might not be separate species. But under PSC, if they're diagnosable elsewhere, they could be subspecies. The procedure might flag this for committee, considering if hybridization is natural or threatens integrity.

  3. Desert fish: morphologically distinct but genetically nested. Paraphyly issue. PSC would require monophyly, which isn't met. But if there's ecological divergence or local adaptation, it might be a DPS. Value judgment on conservation importance.

  The procedure needs to handle these cases transparently. Weak points: genetic thresholds (how much divergence is enough), interpreting hybridization, and weighing morphology vs. genetics. Also, committee involvement when criteria conflict.

  For the user's deeper needs: They want legitimacy and defensibility in decisions, avoiding arbitrary labels. They need to justify outcomes to petitioners and the public. The procedure must save time but be thorough. Highlighting where science ends and values begin is crucial for transparency.

  Structure the procedure in steps, each with criteria and outcomes. Start with genetic data, then morphology, reproduction, ecology, etc. Define "no" for clear cases, "pass to committee" for ambiguous ones. After running through cases, identify what evidence could change outcomes, like new genetic data showing monophyly or ecological studies.
answer: |-
  **Bottom Line: Use this sequential decision procedure, grounded in lineage divergence evidence, escalating to committee when criteria involve conservation values or irreconcilable data conflicts.**

  ### Decision Procedure for Population Classification
  **(Run Steps 1-5 Sequentially; Stop at "No" or Escalate to Committee)**

  1.  **Genetic Distinctness (Nuclear DNA):**
      *   **Question:** Does the petitioned population show *nuclear* genetic divergence (e.g., FST, SNPs) significantly greater than background variation within the broader taxon? (Prioritize genome-wide data over mtDNA alone).
      *   **Good Answer:** Population-level analysis (e.g., STRUCTURE, PCA) showing consistent clustering distinct from reference populations. FST significantly >0 (e.g., >0.05-0.1, context-dependent) with low gene flow estimates (Nm < 1).
      *   **Clean No:** No significant nuclear divergence found; genetic variation primarily clinal or panmictic with reference populations.
      *   **Escalate:** Moderate divergence (FST ~0.05-0.15), conflicting markers, or reliance *only* on mtDNA/phylogenetic position. (Science: mtDNA can mislead due to drift, introgression; nuclear data better reflects lineage sorting).

  2.  **Morphological/Diagnosable Distinctness:**
      *   **Question:** Is the population consistently diagnosable by one or more fixed or near-fixed morphological, behavioral, or ecological characters under common conditions?
      *   **Good Answer:** Quantitative analysis (e.g., PCA of morphometrics, call frequency analysis) showing non-overlapping variation or fixed differences in reliable traits (e.g., scale counts, song patterns, stable isotopic niches).
      *   **Clean No:** No statistically supported differentiation; traits show extensive overlap/clinal variation.
      *   **Escalate:** Characters are plastic, show incomplete lineage sorting, or are detectable only with advanced methods (e.g., geometric morphometrics). Differentiation is subtle or based solely on size/color where clines exist. (Science: Diagnosability ≠ evolutionarily significant divergence; plasticity vs. adaptation).

  3.  **Reproductive Isolation Potential:**
      *   **Question:** Is there evidence of *potential* for significant reproductive isolation? (Focus on pre-mating barriers, intrinsic post-mating barriers).
      *   **Good Answer:** Documented pre-mating barriers (e.g., temporal/behavioral isolation like distinct calls, mate choice assays), intrinsic hybrid inviability/sterility in contact zones, or strong genetic evidence of limited gene flow *despite sympatry*. (Treat documented hybridization cautiously - see Step 4).
      *   **Clean No:** Populations interbreed freely and produce fertile offspring wherever they meet naturally; no barriers detected.
      *   **Escalate:** Partial barriers exist (e.g., assortative mating but hybrids fertile), hybridization documented but extent/impact unknown, or populations allopatric with no direct test possible. (Science: BSC vs. PSC conflict zone; isolation is often incomplete/evolving).

  4.  **Evolutionary Independence/Cohesion:**
      *   **Question:** Does the population represent a separately evolving metapopulation lineage? Consider: Unique evolutionary trajectory? Maintains distinctness despite potential for gene flow? Adaptive divergence? Long-term historical separation?
      *   **Good Answer:** Evidence of local adaptation (common garden/transplant experiments), unique selective pressures, demographic independence (coalescent models), or long-term geographic isolation (>10^4 generations). Paraphyly *alone* is not disqualifying if other evidence supports lineage independence.
      *   **Clean No:** Population shows no adaptive divergence, is demonstrably ephemeral (e.g., recent colonization), or gene flow swamps distinctness.
      **Escalate:** Mixed evidence (e.g., some adaptation but high recent gene flow, paraphyly with adaptive divergence). Requires weighing the *significance* of divergence for persistence. (Science: "Evolutionary Significance" is inherently value-laden; conservation seeks to preserve future potential).

  5.  **Discrete Vertebrate Population Segment (DPS) Criteria (ESA Framework):**
      *   **Question:** If not a Species/Subspecies by Steps 1-4, does it qualify as a DPS? (1) Is it *Discrete*? (Significant separation from conspecifics via physical, physiological, ecological, behavioral factors OR international boundaries). AND (2) Is it *Significant* to the taxon? (Persistence in unique habitat, loss of genetic diversity, occupying unusual biogeographic area, differing markedly from other populations).
      *   **Good Answer:** Clear evidence for discreteness (Step 1-4 results often support this) AND strong argument for significance (e.g., unique adaptation, critical genetic reservoir, sole population in a distinct ecoregion).
      *   **Clean No:** Fails either discreteness or significance. No evidence it is biologically or ecologically unique beyond local variation.
      *   **Escalate:** Discreteness met, but "Significance" is debatable (e.g., population is small but not genetically unique, occupies marginal habitat). **This is primarily a VALUE JUDGMENT** about conservation priority within the taxon. Committee must decide.

  ### Applying the Procedure to Your Cases

  1.  **The Bat (Identical look, distinct call, weird mtDNA lineage):**
      *   **Step 1:** *Escalate*. Nuclear DNA? If no significant divergence → *Clean No* (just local mtDNA variant). If *some* nuclear divergence → Escalate (conflict: morphology vs. behavior/genetics).
      *   **Step 2:** *Clean No* (morphologically identical).
      *   **Step 3:** *Escalate*. Distinct call *suggests* pre-mating isolation potential, but needs proof (e.g., sympatry without interbreeding? Mate choice data?). If sympatric without interbreeding → strong evidence. If allopatric → weak evidence.
      *   **Step 4:** *Escalate*. Depends on Steps 1 & 3. If call divergence drives isolation and local adaptation exists (e.g., prey specialization linked to call?), maybe. Otherwise, likely no.
      *   **Step 5 (Likely Path):** If discrete (via call/behavior + mtDNA + possible nuclear data), committee must judge *significance*. Is this call lineage ecologically/evolutionarily unique? **Outcome:** Highly dependent on nuclear data and evidence call prevents gene flow. Likely DPS candidate if discreteness shown, but significance is a committee value call. Species/Subspecies unlikely without stronger divergence.

  2.  **The Hybridizing Salamanders:**
      *   **Step 1:** *Escalate*. What's divergence in allopatry? If high → proceed. If low → *Clean No* (just one species).
      *   **Step 2:** *Escalate*. Diagnosable away from the contact zone? If yes → possible subspecies. If no → *Clean No*.
      *   **Step 3:** *Clean No*. Hybridization is free and fertile in contact zone = no significant reproductive isolation. (BSC: Not separate species).
      *   **Step 4:** *Escalate/No*. If hybridization is extensive and erodes distinctness → *No*. If hybrids are rare/unfit *or* distinctness is maintained away from narrow zone → evidence for lineage independence despite hybridization. Needs strong data.
      *   **Step 5 (Likely Path):** If diagnosable and discrete away from contact zone (Step 2 + geographic separation), then *Discreteness* likely met. Committee must judge *Significance*. **Outcome:** Unlikely species. Possible subspecies or DPS depending on diagnosability and significance judgment. Hybridization zone itself argues against species status under BSC.

  3.  **The Desert Fish (Morph distinct, genetically nested):**
      *   **Step 1:** *Escalate*. Genetically nested (paraphyletic) but morph distinct. Nuclear divergence? If low → *Clean No* for species/ssp (despite morphology). If moderate/high → Escalate (conflict: morphology vs. phylogeny).
      *   **Step 2:** *Good Answer*. Morphologically diagnosable → distinctness supported.
      *   **Step 3:** *Escalate*. Allopatric? If sympatric and interbreeding → *Clean No*. If allopatric → untestable, but morph distinctness suggests potential isolation.
      *   **Step 4:** *Escalate*. Key question: Is morphological divergence adaptive? (e.g., to unique desert spring habitat? Experiments?). If yes → strong evidence for evolutionary independence *despite* paraphyly (incomplete lineage sorting or introgression). If no → weak evidence.
      *   **Step 5 (Likely Path):** *Discreteness* easily met via morphology/allopatry. *Significance* is clear: unique adapted form in a unique, threatened habitat. **Outcome:** Strong DPS candidate. Species/subspecies unlikely due to paraphyly unless strong local adaptation evidence supports evolutionary independence (Step 4). **This is the case you might want to protect that doesn't qualify as a full species under strict monophyly (PSC).** DPS is the appropriate tool.

  ### Limitations & Where it Misfires
  *   **Data Gaps:** Heavily reliant on *existing* genetic/morphological data. Poor sampling or limited markers can force premature escalation or "No".
  *   **Hybridization/Introgression:** Complex dynamics (Step 4) are hard to assess quickly. Often requires detailed genomic studies.
  *   **"Significance" (DPS):** The most value-laden step. Vulnerable to political pressure or shifting priorities.
  *   **Allopatric Populations:** Hard to test reproductive isolation (Step 3) and sometimes evolutionary independence (Step 4).
  *   **Rate of Evolution:** Slow-evolving vs. fast-evolving taxa may hit thresholds differently.
  *   **Paraphyly:** The procedure allows for paraphyletic "species" if other evidence (esp. Step 4) is strong, but this is controversial and committee-dependent.

  ### What Would Change My Mind & Weaknesses
  *   **Change My Mind:** Strong evidence that **adaptive divergence** (Step 4) is *more* critical for conservation than monophyly or strict diagnosability. If shown that preserving adaptive potential trumps phylogenetic structure, I'd weight Step 4 more heavily earlier. A compelling argument that DPS "significance" can be *objectively* defined might restructure Step 5.
  *   **Weakness in Reasoning:** The procedure prioritizes nuclear genetic data (Step 1) but struggles when morphology (Step 2) strongly conflicts with it (common in rapid adaptation). Resolving this (e.g., the Fish case) relies heavily on subjective interpretation of "evolutionary independence" (Step 4). My reliance on FST thresholds is also simplistic; better methods (e.g., coalescent models) exist but may be impractical for your timeline. The biggest weakness is that **"evolutionary independence" is a spectrum, not a binary**, forcing a committee judgment call under time pressure.
