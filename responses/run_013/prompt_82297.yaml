  - A PAP defender might argue that the inability is an excuse because it undermines freedom.
  - A reasons-responsiveness theorist might argue that the mechanism is not moderately responsive because it cannot respond to the strong moral reason in this case.
  - A source libertarian might argue that without an alternative possibility at the time of action, she is not responsible, and that her past character formation does not help because it too lacked alternatives.

