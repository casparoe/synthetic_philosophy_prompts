  We are constructing a thought experiment that meets all the given constraints. The goal is to have an agent who is morally responsible (blameworthy) for what she does, even though she could not have done otherwise, without any counterfactual intervener or backup device, and without any of the standard excusing conditions.

  Constraints:
  1. Realistic, contemporary, ordinary life. No neurosurgeons, chips, demons, brainwashing, or mind-reading. No counterfactual intervener (nothing conditional).
  2. Impossibility is total: no alternative action, decision, intention, or attempt. Must close the door on "she could at least have tried".
  3. Impossibility is not an excusing condition: no coercion, threat, ignorance, false belief, addiction, phobia, compulsion, illness, physical constraint, and not because she cares less about the option she cannot take. She understands everything perfectly.
  4. Inability is a contingent fact about her of a kind a reader could recognize in someone they know, and it is not just stipulated without support.

  We must avoid a bare stipulation of inability. The inability must arise naturally from the setup.

  After constructing the case, we will analyze it with respect to:
  - Principle of Alternative Possibilities (PAP)
  - Frankfurt's actual-sequence answer
  - Mechanism-based reasons-responsiveness (strong vs. weak)
  - Source libertarian (and where they might look for a residual alternative)

  Then we provide a matched control: same scenario but with one feature reversed so that the agent is not responsible.

  Finally, we identify the key feature, what happens if removed, and how a defender of a theory that is challenged might attack the case.

  Given the constraints, this is challenging. We must create a scenario where the agent's inability is due to a deep-seated, non-pathological character trait that makes it impossible for her to even consider an alternative, but without making her less blameworthy.

  Let me propose a scenario:

  **Scenario: The Unshakable Promise**

  Alice is a highly principled person who has made a solemn promise to her dying mother that she will never reveal a certain family secret (say, that Alice's father was not her biological father) to anyone, under any circumstances. The secret is not harmful in itself, but revealing it would break her mother's trust. Alice has internalized this promise so deeply that it has become an unbreakable part of her identity. She is now an adult, and a situation arises in which revealing the secret would prevent a significant harm to another person (e.g., her friend is about to marry someone who is actually her half-sibling, and the secret is that they share the same biological father). Alice knows the secret and understands that revealing it would prevent the harm. She also knows that keeping the promise is not legally required and that her mother is dead, so no one is forcing her. However, due to her character and the depth of her commitment, she cannot even consider breaking the promise. The thought of breaking it does not occur to her as a live option; it is as if her mind is closed to that possibility. She does not feel tempted or struggle with the decision. She simply keeps the secret, and as a result, her friend marries the half-sibling, leading to emotional harm.

  Now, we must check constraints:

  1. Realistic: Yes, in ordinary life. No futuristic or supernatural elements.
  2. Impossibility total: The story must show that she cannot even try. We can say that the promise is so deeply ingrained that the alternative (revealing the secret) is not even in her psychological repertoire. She doesn't decide not to reveal it; she doesn't even form the intention or consider it. The door is closed on trying because the very idea of breaking the promise is unthinkable for her.
