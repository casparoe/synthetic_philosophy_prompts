  But Fischer and Ravizza require that the mechanism is the kind that is regularly receptive and responsive. So if her mechanism is generally responsive, then even if in this particular case it does not respond to a reason to break the promise, she might still be responsible because the mechanism is of a responsible kind. 

  This is a way out: the mechanism (her practical reasoning) is generally reasons-responsive, and in this case, it operates without interference. Therefore, even though she couldn't have done otherwise in this specific situation, she is responsible because the mechanism that produced the action is the same one that in other situations is responsive. 

