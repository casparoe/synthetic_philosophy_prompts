  4. Contingent fact: We can recognize such a trait in people who have unshakeable principles (e.g., some people would never lie, even in extreme situations). It's not stipulated by fiat; it's built by describing her history and character.

  But wait: does this meet the "no residual flicker" condition? A libertarian might argue that she could have tried to break the promise, or at least considered it. We need to make it clear that the alternative is psychologically impossible. We can strengthen the case:

  Alice's promise is so deeply embedded that the idea of revealing the secret is not just something she would reject; it never even crosses her mind as an option. When the situation arises, she automatically acts in accordance with her promise without deliberation. She does not experience any internal conflict because the forbidden action is not a possibility for her.

  However, one might object that this sounds like a compulsion, which is an excusing condition. We must avoid that. So we need to present it as a matter of character, not pathology. We can say that she is a person of exceptional integrity, who has built her life around this promise, and it is now second nature. It's not that she is unable to break the promise because of an irrational fear or obsession; it's because she has a rational commitment that is so strong that it structures her practical reasoning.

  But let's refine the scenario to avoid the compulsion worry and to ensure that the impossibility is total.

  Revised scenario:

  **The Unshakable Promise (final version)**

  Alice made a solemn promise to her dying mother when she was 12 years old that she would never reveal a particular family secret (the identity of her biological father) to anyone. Over the years, Alice has reflected on this promise and has come to see it as a fundamental expression of her integrity and a tribute to her mother. She has reinforced it through her own choices and now, at 35, it is a core part of her identity. She is a person who always keeps her promises, but this one is special — it is non-negotiable. One day, her close friend Beth confides that she is engaged to a man named Charles, and they are deeply in love. Alice then learns (through a DNA test that Beth shows her) that Charles is actually her (Beth's) half-brother, because they share the same biological father — who is, unbeknownst to Beth, Alice's biological father. Thus, the secret Alice holds is directly relevant: if revealed, it would prevent a potentially disastrous marriage. Alice knows that revealing the secret would be the right thing to do to prevent harm, and she cares about Beth. However, the thought of breaking her promise never even occurs to her. It is not that she considers it and rejects it; rather, the possibility of breaking the promise is psychologically unavailable. She does not feel any internal struggle because the option is not present in her mind. She simply does not reveal the secret, and Beth marries Charles, leading to heartbreak when the truth is later revealed by someone else.

