  Same as before, but when Alice was 12, her mother forced her to make the promise under duress (e.g., by threatening to disown her if she didn't promise). Moreover, the mother used emotional manipulation to instill the promise, and Alice has always resented it. She has not internalized the promise; she keeps it only because she feels guilty and fearful. Now, when the situation with Beth arises, Alice again does not reveal the secret. But this time, it is because she is psychologically trapped by the fear and guilt instilled by her mother. She wants to reveal the secret but feels paralyzed by anxiety. She cannot bring herself to do it. 

