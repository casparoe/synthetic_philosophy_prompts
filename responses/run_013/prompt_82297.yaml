  Let me write the case in a tight paragraph.

  **The Thought Experiment**

  Alice, a woman of deep integrity, made a solemn promise to her dying mother at age 12 never to reveal a specific family secret. Over the years, she has reflectively endorsed and internalized this promise as a core part of her identity. Now, at 35, she learns that her friend Beth is engaged to Charles, who, due to the secret (that Alice's father is also Charles's biological father), is Beth's half-brother. Alice knows that revealing the secret would prevent a disastrous marriage and that keeping it will cause harm. She cares about Beth, but the thought of breaking her promise never even occurs to her; it is psychologically impossible for her to consider it. She does not reveal the secret, and Beth marries Charles, leading to emotional trauma. Alice is blameworthy for her inaction.

