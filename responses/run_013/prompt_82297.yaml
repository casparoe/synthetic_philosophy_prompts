  Same as above, but the promise was coerced: Alice's mother emotionally manipulated her into making it, and Alice has never identified with it. She keeps the secret now only due to residual fear and guilt. Alice does not reveal the secret, but she is not blameworthy because the mechanism is not her own (it is the result of coercion).

