  Therefore, the reasons-responsiveness account would hold her responsible.

  **Source libertarian**: The source libertarian requires that the agent is the ultimate source of her actions and that there was an alternative possibility at some point. They might look for a residual alternative, such as the possibility that she could have tried to break the promise, or that she could have formed a different character in the past. In our case, we have blocked the possibility of trying: the option never occurs to her, so she doesn't even try. As for the past, we can say that her character was formed by her own choices (she has reinforced the promise over the years), but the source libertarian might argue that at the time of the action, there is no alternative possibility. However, they might insist that responsibility requires that at the moment of action there must be an alternative. Our case blocks that because there is no alternative at the moment of action. So the source libertarian would deny responsibility. But we are constructing the case to show that she is responsible, so we are challenging the libertarian.

