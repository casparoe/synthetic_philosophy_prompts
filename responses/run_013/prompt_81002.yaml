prompt: |-
  Ok so my friend and I spent like three hours arguing about money pumps last night and I want us to write down the thing we should've written instead of just yelling. She's on the diachronic side: if you can see the pump coming, and you know what you'll do at each step, and you walk in anyway, that's a failure of rationality, and the rational move is to be resolute. I'm on the other side -- I think "rational" at bottom applies to someone's attitudes at a time, and a money pump shows you're exploitable, not that you're incoherent; being pumpable seems more like having a weak password than like believing a contradiction. Neither of us is moving by assertion.

  So draft the joint statement we could both actually sign. I want a numbered list of agreed claims -- about what a money pump is, what exploitability does and doesn't show, and how the pump relates to synchronic Dutch books (we both think that analogy is doing real work, but in opposite directions, so pin down the agreed part exactly without smuggling in either verdict). Then a disagreements table where each side's position is written so the person who holds it would accept the wording as fair -- not a strawman, not so vague it's vacuous.

  Cruxes I'd bet on: (a) whether a rational requirement can be diachronic at all or whether that's a category mistake; (b) whether exploitability is itself a rational defect or just a fact about your environment; (c) whether resolute choice is following the preferences you have or changing them -- I half suspect this one is verbal, so say so if it is. For each crux give at least one case or argument we'd both agree bears on it, with both sides' predictions recorded in advance. Two cases I made up, use them if they help: the free irreversible switch offered before the pump starts, which just deletes your ability to be pumped later without changing your payoffs or preferences -- does rationality require taking it, even if you'd rather keep the option? And the committee case, where you and your future selves share one bank account and each stage votes its own stage's preference, so the committee gets pumped even though every stage votes correctly on its own terms -- is the committee irrational, and does the answer tell us anything about the single-agent case? Keep the whole thing under 800 words, table included.
