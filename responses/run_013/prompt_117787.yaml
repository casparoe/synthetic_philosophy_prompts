prompt: |-
  I'm running a reading group for grad students in philosophy of biology and next month we're doing the what-is-life thing. Every time we do it people just recite whichever definition they heard first and then we argue about viruses for an hour, so this time I want a decision tree instead of a list of definitions. Can you build me one?

  Shape: the internal nodes are questions about concrete cases, the leaves are definitions of life. Seven or eight leaves, no more, and at least a couple of the leaves should be positions that don't usually get a name in the encyclopedia version of this debate.

  Cases that have to show up somewhere on the tree, because these are the ones that actually split people:

  - a mule: alive, sterile, no descendants ever
  - a prion: makes more copies of itself by reshaping other proteins, no metabolism, no nucleic acid anywhere
  - a virion sitting on a bench, versus the same virion's genes running a host cell
  - a bacterial spore: metabolically inert, not growing, can sit for a century and then wake up
  - fire
  - a transposon shuffling copies of itself around a genome
  - a stripped down lab bacterium with a few hundred genes that dies unless you feed it exactly the right medium
  - a lichen, which is two organisms tangled into one thing that behaves like one organism
  - something from a shadow biosphere with a completely different biochemistry

  Some ideas I'd like you to work in, because they cut across the usual textbook axes:

  1. The no-definition-give-me-a-theory move: the thought that any definition we write now is premature, since the whole point of a theory of life is to tell us what to look for, and that we should maybe adopt a neutral placeholder term for whatever the theory eventually picks out instead of fighting about the word life. Which of the cases above does that move refuse to answer, and does refusing count as an answer?

  2. A how-hard-was-this-to-build criterion: count the minimum number of joining steps you'd need to make the molecule out of simple building blocks, and say anything past some threshold is too improbable to have arisen without a long history of selection behind it. Ask what that criterion says about the prion, and about fire, which is presumably very cheap to build.

  3. Teleology: life as the kind of system that maintains itself and for which things can go well or badly, as opposed to something you can describe purely chemically. Fire consumes and spreads. Can fire do well or badly?

  4. The weird fact that bacterial and archaeal membranes are built from mirror-image versions of the same backbone and joined with different linkages, so it's genuinly unclear whether the last common ancestor had a normal membrane, a leaky one, or whether membrane chemistry got invented twice. Use that for the different-biochemistry node if it's useful.

  Rules for the tree:

  - phrase every node as a contrast or a case someone can answer without knowing which leaf it leads to. Bad: do you think viruses are alive? Better: the spore and the virion are both inert and both come back to activity; is the difference that the spore carries its own restart program, that the spore is a stage of something that was already alive, or neither?
  - build it from the logical space first and drop the actual positions into it afterward. Note which combinations of answers end up unoccupied and say whether that's because they're incoherent, unattractive, or just unexplored.
  - flag any leaves your tree can't separate. My suspicion is that the autopoiesis-ish leaf and the plain metabolism leaf won't come apart on any of these cases, but see what you find.
  - each leaf gets a name, or unnamed if nobody defends it, plus one sentence on its most awkward commitment.
  - no citations, no reading list, I don't care who said what.

  Audience is grad students, a few with a bio background, so you can assume they know what a transposon is, but write the node questions so a smart non-biologist could still answer them.
reasoning: |-
  Okay, let me unpack this philosophy of biology problem. The user wants a decision tree for defining life that avoids the usual definition-reciting and virus arguments. They've provided specific cases that must be included and several conceptual angles to incorporate.

  Hmm, the key challenges are:
  First, designing nodes that force concrete choices about edge cases rather than abstract debates. For example, contrasting bacterial spores with bench-sitting virions focuses on revival mechanisms instead of asking "are viruses alive?"
  Second, weaving in their requested themes - like the "how-hard-to-build" criterion for prions vs fire, or membrane chirality implications for shadow biospheres.

  I notice they want unnamed positions too. That's interesting - suggests dissatisfaction with existing categories. The sterile mule case is perfect for exposing definitions that overemphasize reproduction. And lichens could challenge individual-centric views.

  For structure, I'm considering starting with biochemistry since it's foundational. The mirror-image membrane point becomes crucial here - if we accept opposite chirality as life, it blows open the definition. Then moving to complexity thresholds (prions vs fire), then system properties like autonomy.

  The teleology angle needs careful handling. Instead of asking "does fire have goals?", I'll contrast homeostasis in spores vs fire's passive consumption. The stripped bacterium case will test whether dependence invalidates "aliveness".

  For the "no-definition" position, I'll make it a leaf that rejects all binary answers. Its awkwardness? Having to say the sterile mule debate is misplaced - which feels counterintuitive but consistent.

  Let me sketch the node sequence:
  1. Homochirality requirement? (Filters shadow biosphere cases)
  2. Metabolic complexity? (Handles fire/prion distinction)
  3. Autonomy? (Separates lab bacterium from normal cells)
  4. ...and so on

  The unnamed position that recognizes lichens as new individuals might be controversial but logically coherent. Its awkward commitment? Having to call sterile worker ants "not alive" unless we redefine persistence.

  This should create the conceptual tension they want - forcing students to confront tradeoffs rather than citing authorities.
answer: |-
  Here's a decision tree designed to force concrete commitments on edge cases, incorporating your constraints and themes. Nodes are phrased as case-based contrasts; leaves include named positions and "unnamed" options with their awkward implications.

  **Decision Tree: What Counts as Life?**

  1. **Start: Can a system with fundamentally *different biochemistry* (e.g., opposite membrane chirality, novel polymers) still be alive?**
      * **Yes (Accept alternative foundations) → Go to 2**
      * **No (Require familiar biochemistry) → Leaf 1: *Carbon-Chauvinism***
          * *Awkward Commitment:* Must deny life is possible in vast chemical spaces (e.g., hypothetical silicon/ammonia biospheres), even if complex, evolving, and autonomous.

  2. **Does *fire* qualify as alive? (Consider: Self-sustaining reaction, spreads, "consumes" fuel, but no internal organization/repair, identical copies)**
      * **Yes → Leaf 2: *Process-First/Extended Physiology***
          * *Awkward Commitment:* Must accept that spreading, consuming patterns without discrete boundaries or inheritance (like some crystal growth or wildfires) are alive.
      * **No → Go to 3**

  3. **Consider a *prion* (self-replicates by reshaping proteins) and *fire*. Does the prion's specific, template-directed copying make it meaningfully different from fire?**
      * **No (Both just physics/chemistry) → Go to 4**
      * **Yes (Prion shows minimal information transfer) → Leaf 3: *Replication-First (Minimalist)***
          * *Awkward Commitment:* Must accept that crystals with error-prone, selective replication (e.g., some clay minerals) could be alive, while sterile mules are borderline.

  4. **The *virion on the bench* is inert. The *bacterial spore* is inert. What's the key difference?**
      * **The spore carries its own complete restart program/metabolic core; the virion doesn't → Go to 5**
      * **The spore is a dormant *stage* of a continuous lineage; the virion isn't → Go to 6**
      * **No fundamental difference in "aliveness" state → Leaf 4: *Continuous Potentiality***
          * *Awkward Commitment:* A rock isn't alive, but a spore/virion *is* simply because it *could* become active under right conditions.

  5. **Consider the *stripped-down lab bacterium* (dies without precise nutrients). Is its inability to sustain itself autonomously a dealbreaker?**
      * **Yes (Life requires self-sufficiency) → Leaf 5: *Autopoietic Closure***
          * *Awkward Commitment:* Must deny that severely parasitic organisms (requiring specific host factors) or lab-created minimal cells are fully alive.
      * **No (Dependence is contextual) → Leaf 6: *Metabolism + Evolution Combo***
          * *Awkward Commitment:* Accepts the lab bacterium is alive, but struggles to exclude complex, evolving, metabolic tech systems (e.g., self-repairing robots with AI evolution).

  6. **Consider a *mule* (alive, sterile) and a *transposon* (replicates within genome, no independent metabolism). Which better exemplifies a living entity?**
      * **The Mule (Persists, maintains itself, acts teleologically) → Leaf 7: *Teleological Organization***
          * *Awkward Commitment:* Must argue viruses actively infecting a cell *are* alive (doing "well"), while virions on a bench are not ("badly"), making aliveness transient/sporadic.
      * **The Transposon (It replicates heritable information!) → Go to 7**
      * **Neither is the best example; focus on the system → Go to 8**

  7. **A *lichen* (fungus + alga/cyanobacterium). Is it:**
      * **One novel organism → Leaf 8: ***(Unnamed) Emergent Individuality*****
          * *Awkward Commitment:* Must argue that tightly integrated symbioses (like lichens or coral holobionts) are single living entities, while the sterile mule is clearly alive, but sterile ant workers might be disposable parts.
      * **Two distinct organisms cooperating → Leaf 6: *Metabolism + Evolution Combo***
      * **Neither - just an ecosystem → Leaf 3: *Replication-First (Minimalist)* or Leaf 1: *Carbon-Chauvinism* (depending on prior path)**

  8. **The "how-hard-to-build" criterion: A *prion* is complex (many joining steps). *Fire* is simple. Does complexity imply life?**
      * **Yes (Threshold of complexity = signature of selection history) → Leaf 9: *Selection-History Threshold***
          * *Awkward Commitment:* Prions (complex) might qualify, fire doesn't. But a complex crystal formed abiotically (e.g., in a geode) could falsely signal life, while a simple, evolved replicator might not.
      * **No (Complexity ≠ Life) → Leaf 10: *No Definition / Theory First***
          * *Awkward Commitment:* Refuses to classify *any* current case (prion, fire, mule, spore, virion) definitively as "alive" or "not alive" until a predictive theory exists. The debate itself is premature.

  **Logical Space & Notes:**

  *   **Unoccupied/Incoherent Combinations:** "Teleological Organization" combined with "Replication-First" is rare/incoherent (teleology focuses on persistence/goals, replication-first on copying). "No Definition" combined with strong biochemical requirements is unstable (why require biochemistry if you refuse to define?).
  *   **Leaves Your Tree Can't Separate (as predicted):** "Autopoietic Closure" and "Metabolism + Evolution Combo" largely agree on cases *except* the stripped-down bacterium (Node 5). They both exclude fire, prions (as alive), accept mules, spores, and likely accept lichens as systems. The key difference is the *stringency* of metabolic self-sufficiency.
  *   **The "No Definition" Move:** (Leaf 10) Refuses to answer *all* specific classification questions (Is the prion alive? Is the sterile mule alive? Is the virion alive when active?). It argues these are the *wrong questions* until we have a theory explaining life's fundamental principles. Refusing *is* its answer to the debate format.
  *   **Teleology & Fire:** Node 2 forces this. Fire doesn't "do well or badly"; it just burns according to conditions. It lacks an *internal* goal of persistence requiring active maintenance against perturbation (unlike a spore maintaining dormancy or a mule seeking food/water).
  *   **Mirror Membranes/Shadow Biosphere:** Node 1 directly addresses this. Accepting opposite chirality forces a radically open definition of life's chemical basis.
  *   **Unnamed Leaves:** "Emergent Individuality" (Leaf 8) and "Selection-History Threshold" (Leaf 9) capture less common but coherent positions implied by the cases.
