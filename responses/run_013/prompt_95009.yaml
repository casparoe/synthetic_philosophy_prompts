prompt: |-
  Ok so I keep flip-flopping on this and I want you to just write me an essay that takes a side and actually sticks with it. The question is wether pain and pleasure are commensurable -- whether there's one common scale where you can trade suffering against enjoyment -- or whether suffering is in some way lexically prior, meaning no amount of good stuff can ever outweigh certain bad stuff. This is basically the lexical-threshold version of negative utilitarianism, and the bare version of the debate has been beaten to death, so here's the specific thing I actually want you to wrestle with. Suppose we go with a two-tier theory. Tier one is a threshold: any suffering below it is protected, dominated lexically, so no pile of pleasure however gigantic buys it off. Tier two says that above the threshold everything is just ordinary commensurable welfare that we weigh normally, pleasure against pain, person against person. The wrinkle is that the threshold isn't a fixed quantity of some hedonic unit -- it's relative. It's indexed to the baseline the creature is adapted to, or to what it otherwise had reason to expect. So the exact same amount of pain counts as sub-threshold and lexically protected for someone who was doing great, and as humdrum tradeable diswelfare for someone who was already miserable. Is that view coherent, and can it be defended? Give me a verdict. If you think it falls apart, show me precisely where the collapse happens and what you'd put in its place. If you think it holds up, defend it against the obvious attacks -- that it makes the moral line hostage to how easily a creature habituates, that it lets us protect someone by keeping them miserable first, that adaptation is morally arbitrary anyway. And then tell me what the view says about the classic trade-off where you could spare a huge number of people a mild ongoing discomfort by inflicting a small amount of intense agony on a single person. Don't end on the fence.
