  Starting with physical stance: straightforward mapping to microstate models. Design stance is trickier - it's not just any coarse-graining, but one optimized for functional robustness. Here's the first tension: Dennett's "proper function" implies normativity beyond mere predictive accuracy. How to handle that? Maybe as a boundary condition: the model class must preserve input-output mappings under perturbation.

