  I'm a backend engineer with zero formal philosophy background, and I've somehow ended up running the monthly AI reading group at my company. Next month is the symbol grounding thing — the idea that a system can push symbols around flawlessly while none of them actually mean anything, because every symbol only points at other symbols. Everyone in the group has read enough pop-sci to nod along if I just explain it for 20 minutes and then we all go home unchanged. I want them to run into it with their hands instead, before anyone says the name of the problem.

  Logistics: 16 people, one 90-minute block after lunch, one big conference room plus two small breakout rooms, a whiteboard, a table of about ten small physical objects I'll bring from home (mug, tennis ball, rubber duck, padlock, etc.), index cards, masking tape. Assume I'm the only one who knows where this is going.

  What I want to happen: two teams each invent a made-up vocabulary for the objects — nonsense tokens only, no English, no numbers, no pointing or gesturing. They exchange nothing but written token lists across the room divide, build a translation table between their two vocabularies, and then test each other: one team sends a token string, the other has to physically hand over the matching object. This will work, and they'll feel like they've accomplished something real. Then I want the floor to come out from under it.

  Two things I want built in. First, around the halfway mark I want to insert a third party (me) with a full dictionary that is internally perfect — consistent with everything both teams have produced — but systematically permuted, so that every token is swapped with another one. They should be pushed into designing a test that could tell my dictionary apart from theirs, and I want them to hit the wall where no exchange of tokens, however long, could possibly do it. Second, I want a phase where one team is allowed to see and touch the objects and act on them, while the other team is only ever handed tokens. Here's the bit I actually care about and don't know how to stage: once some chunk of the vocabulary is pinned down by actually grabbing stuff, you can define all the remaining words in terms of the pinned ones, and it looks like you get meaning for free just by definition. I want the group to find, by trying it, the point where that chain of definitions stops buying you anything.

  So: rules, materials, roles, a minute-by-minute timeline, and a debrief that maps specific moments in the session onto the parts of the problem. Tell me what will predictably go wrong the first time I run this and how to handle it, and be straight with me about which part of the problem the activity simply cannot reproduce no matter how I run it. Skip the reading list, I don't need papers.

  Last line, exactly: a one-sentence summary of the core mechanic, in the form \answer{...}.
