  ### Workshop Design: Symbol Grounding Experiential Activity  
  **Core Mechanic:** Teams create ungrounded symbol systems, then collide with the impossibility of verifying meaning through symbolic exchange alone, despite initial apparent success.

  ---

  ### **Rules & Roles**  
  1. **Teams & Setup**  
     - Split into **Team A** (8 people) and **Team B** (8 people).  
     - Each team gets:  
       - 10 physical objects (identical sets: mug, tennis ball, rubber duck, padlock, key, spoon, die, toy car, comb, eraser).  
       - Index cards, markers, masking tape.  
       - Private breakout room.  

  2. **Vocabulary Creation (No Grounding)**  
     - **Rules:**  
       - Invent 10 nonsense tokens (e.g., "glorp", "zint")—**no English, numbers, gestures, or references to object properties**.  
       - Write each token on a card. Tape one card per object (e.g., tennis ball = "glorp").  
       - Teams **do not see each other’s objects or process**.  
     - **Deliverable:** Each team creates a **token list** (written on paper: token + object description *for their eyes only*).  

  3. **Translation Phase (Symbol Exchange)**  
     - Teams swap **token lists only** (no object access).  
     - **Task:** Build a bidirectional translation table (e.g., Team A’s "glorp" ↔ Team B’s "zint").  
     - **Constraint:** No physical objects visible. Use only the lists.  

  4. **Testing Phase (False Success)**  
     - Objects placed on a central table.  
     - **Test 1:** Team A sends a token (e.g., "glorp") to Team B. Team B must hand over the *physical object* matching their translated token.  
     - **Test 2:** Reverse roles.  
     - **Outcome:** Works perfectly (tokens map to objects via translation).  

  5. **Third Dictionary Attack (You as Permuted System)**  
     - **Your Role:** Claim you have a "master dictionary" that aligns with all tests.  
     - **Reality:** Swap tokens systematically (e.g., all Team A tokens map to Team B tokens for *different* objects: "glorp" → "zint" for the *mug* instead of the *ball*).  
     - **Challenge Teams:** "Design a test to prove my dictionary is wrong."  
     - **Outcome:** They fail. No token exchange can detect the permutation because symbols only reference symbols.  

  6. **Action Phase (Grounding Attempt)**  
     - **Roles:**  
       - **Team A (Grounded):** Stays with objects. Can touch/act on them (e.g., shake the duck, stack the mug).  
       - **Team B (Symbolic):** In a separate room. Receives only token strings from Team A.  
     - **Task:** Team A defines **new actions** (e.g., "blink" = "put ball in mug") using tokens.  
       - Step 1: Team A grounds 3 tokens via physical demo (e.g., sends "blink" while doing the action).  
       - Step 2: Team A defines *new* tokens using grounded ones (e.g., "kalo" = "blink then shake").  
       - Step 3: Team B must execute "kalo" without seeing the action.  
     - **Outcome:** Initial success, then collapse when definitions require ungrounded primitives (e.g., "shake" was never grounded for Team B).  

  ---

  ### **Timeline (90 Minutes)**  
  | Time     | Phase                          | Activity                                                                 |  
  |----------|--------------------------------|--------------------------------------------------------------------------|  
  | 0:00-0:15 | Intro & Setup                 | Explain rules. Split teams. Distribute objects/cards.                   |  
  | 0:15-0:30 | Vocabulary Creation           | Teams invent tokens in breakout rooms.                                   |  
  | 0:30-0:40 | Translation                   | Teams swap token lists, build translation table in main room.            |  
  | 0:40-0:50 | Testing Phase                 | Teams test translations by sending tokens/handing objects. **Feels successful.** |  
  | 0:50-1:00 | Third Dictionary Attack       | Introduce your permuted dictionary. Teams try/fail to disprove it. **Floor drops.** |  
  | 1:00-1:15 | Action Phase                  | Team A (grounded) defines actions; Team B (symbolic) executes from tokens. **Success → Confusion.** |  
  | 1:15-1:25 | Role Swap & Collapse          | Teams swap roles. Repeat until definitions fail (e.g., "carefully" in "stack carefully"). |  
  | 1:25-1:30 | Debrief                       | Map moments to the problem (see below).                                  |  

  ---

  ### **Debrief Guide**  
  - **Testing Phase Success:** "You thought symbols were grounded because objects moved. But the translation was circular—it only worked because you *assumed* shared meaning."  
  - **Third Dictionary Failure:** "No symbolic test could catch the permutation. Symbols only point to symbols—no ‘ground’ to check against."  
  - **Action Phase Breakdown:** "When Team B executed ‘kalo’, they mimicked the symbol chain but had no access to the physical ‘shake’. Definitions stack, but the bottom layer is empty."  
  - **Core Insight:** "Meaning needs a non-symbolic foundation (sensory/motor experience). Otherwise, it’s self-referential code."  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Problem:** Teams use recognizable tokens (e.g., "quack" for duck).  
     **Fix:** Ban on-the-spot ("Nonsense only! If I understand it, start over.").  

  2. **Problem:** Action Phase stalemate (Team B can’t guess actions).  
     **Fix:** Force Team A to ground 3 basic actions first (e.g., "lift," "put in").  

  3. **Problem:** Teams avoid physical actions, stick to symbols.  
     **Fix:** Require Team A to demo each new action once before sending tokens.  

  4. **Problem:** Third dictionary debate eats time.  
     **Fix:** Cut off after 2 failed tests. Declare: "You’re stuck. Why?"  

  ---

  ### **Limitations of the Activity**  
  - **Cannot Replicate:** The infinite regress problem ("What grounds the ground?") becomes abstract. Teams experience the *symptom* (definitions fail) but not the philosophical depth.  
  - **Missing Nuance:** In AI, statistical patterns (e.g., in LLMs) *simulate* grounding but don’t resolve it. The activity can’t model this.  

  \answer{Teams build circular symbol systems that collapse when tested against physical reality or infinite definition chains.}
