  Also, the emergent properties angle. At higher levels of recursion, the synthesis of answers from multiple paths might produce novel solutions. Even with identical heuristics, combining outputs in new ways could yield results the original agent hadn't considered. Like how a single mathematician might not solve a complex proof in one go but breaking it into lemmas allows connecting dots later.

