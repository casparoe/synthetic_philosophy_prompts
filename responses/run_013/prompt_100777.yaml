prompt: |-
  I'm presenting at a joint session next week — the epistemology reading group has invited the motor-learning lab — and I need a Q&A prep sheet for the position I'll be defending. My thesis is that knowing how to φ is a genuine cognitive achievement but is not a species of propositional knowledge. What it is, I argue, is the possession of a reliable disposition to φ that is guided by a practical representation: a representation whose content is a procedure rather than a fact, and which can be assessed as correct or incorrect — on track or off track — without being true or false. The intellectualist is therefore right that know-how answers to a standard of correctness, and the Rylean is right that it is not a kind of knowing that; both are wrong to think those two claims exhaust the options. My central argument turns on what I call recalcitrant skills: skills that are reason-responsive — they improve when the right piece of advice is given mid-performance, and degrade when the agent tries to follow an explicit rule — yet whose exercise the agent cannot articulate, and in some cases cannot even recognize when it is described back to her afterwards. A surgeon's feel for when tissue is about to tear is my running example: she adjusts to the instruction to go lighter and wait in a way that shows she is tracking something, but no proposition she could entertain captures what she tracks.

  The audience is the problem. The epistemologists are mostly intellectualists of the sort who hold that know-how just is knowledge of a proposition under a practical mode of presentation, and they will treat my practical representation as a proposition wearing a disguise. A couple of them work on the gradability of knowledge and will press on whether know-how comes in degrees and what my view says about that. The lab people are mostly enactivists and embodied-cognition researchers who distrust representation talk on principle, and they will say my practical representation is an explanatory fiction that does no work the bare disposition is not already doing. There is also one person in the room who studies automaticity and will have data on how expert performance actually degrades under verbal instruction; I cannot tell which side she will come down on, and I suspect her question is the dangerous one.

  Give me the prep sheet. I want the objections I will actually get from these people, in their own vocabulary — where the epistemologists and the enactivists are making the same complaint in different words, say so and give me both phrasings. Order them by how much damage they would do, not by how likely they are. For each, give me a reply I can deliver in about two minutes, and an honest note on where that reply is soft. Tell me what I should concede up front rather than defend, which objection I should treat as the one that has to land for the view to survive the session, and the question I am hoping nobody asks.
reasoning: |-
  Okay, the user is presenting at a joint session between an epistemology reading group and a motor-learning lab. Their thesis is that know-how is a cognitive achievement but not propositional knowledge. Instead, it's a reliable disposition guided by practical representations. They need a Q&A prep sheet addressing objections from both groups.

  First, I need to understand the key players. The epistemologists are intellectualists who think know-how is propositional knowledge under a practical mode. They'll likely argue that practical representations are just disguised propositions. The motor-learning lab folks are enactivists who dislike representation talk and think dispositions alone suffice. Then there's the automaticity researcher with data on expert performance degradation under verbal instruction—this could be tricky.

  The user mentioned recalcitrant skills as their central argument. The surgeon example where the skill responds to advice but can't be articulated is crucial. They need to defend against both sides while showing that their view synthesizes the valid points from each.

  For the prep sheet, I should list objections in order of potential damage. The most dangerous one is probably the enactivist's charge that practical representations are redundant. If they can't show that representations add explanatory power beyond dispositions, their view collapses. The automaticity researcher's data might support their point but could also be twisted to challenge the need for representations.

  The intellectualist's objection about practical modes of presentation is another big one. They'll say practical representations are just propositions in disguise. The user needs to emphasize the non-propositional content—procedures vs. facts—and the assessment as on/off track without truth conditions. The surgeon example is key here.

  For the gradability question, they need to explain how know-how comes in degrees through reliability and refinement of practical representations. Conceding that propositional knowledge accompanies know-how in experts could preempt some attacks.

  The user should concede that representations aren't conscious and that propositional knowledge often co-occurs. Their survival depends on defending against the charge that representations are redundant. If they can show that representations explain the guidance and reason-responsiveness of skills, they might sway the enactivists. The automaticity researcher's data on degradation under verbal instruction should be used to support their point about recalcitrant skills.

  The nightmare question might be about computational implementation of practical representations. Since the user hasn't developed that part, they should admit it's a work in progress but argue that the explanatory role is still valid. 

  Overall, structuring the prep sheet with the highest damage objections first, providing concise responses, noting soft spots, and highlighting strategic concessions will prepare the user effectively.
answer: |-
  Here’s your Q&A prep sheet, structured by damage potential (high to low), with objections, replies, vulnerabilities, and strategic notes. Focus on **bolded key phrases** during delivery.

  ---

  ### **Tier 1: Existential Threats**  
  *(Fail to answer → view collapses)*  

  #### **Objection 1: The "Redundant Representation" Charge (Enactivists/Lab)**  
  *Phrasing:*  
  - **Enactivist**: "Your ‘practical representation’ is a ghost in the machine. The disposition’s reliability *is* the skill. Why add a representational layer that does nothing beyond describing behavioral patterns?"  
  - **Lab Cognitive Scientist**: "If the surgeon’s adjustment is explained by sensorimotor coupling and affordance-based action, positing a ‘procedure-representation’ is unmotivated neurobabble. Show us the added explanatory value."  

  **Your Reply (2 min):**  
  "The disposition alone can’t explain *reason-responsive recalcitrance*. When the surgeon hears ‘go lighter,’ she *selectively modulates* her pressure in real-time without conscious inference. A bare disposition is blind to instructions; it’s either triggered or not. The practical representation functions as a **procedural map**: it *guides* by structuring sensorimotor contingencies, making the skill *advice-sensitive* even when non-propositional. Without it, we can’t explain why some inputs refine the skill (*go lighter*) while others don’t (*sing a song*)."  

  **Soft Spot:**  
  You assume guidance *requires* representation. Enactivists may counter that dynamical systems (e.g., perception-action cycles) provide "guidance" without representations.  

  **Strategic Note:**  
  **Concede upfront** that representations aren’t "stored blueprints" but *emergent, action-oriented states*. Stress their role in *discriminative sensitivity* (e.g., distinguishing tissue that’s "about to tear" vs. "normal").  

  ---

  #### **Objection 2: The "Collapsed Distinction" Charge (Intellectualists)**  
  *Phrasing:*  
  - **Intellectualist**: "A ‘practical representation’ is just propositional knowledge under a *practical mode of presentation* (Peacocke). What’s the difference between representing *that tissue tears at pressure P* under a motoric mode vs. your ‘procedure’?"  
  - **Gradability Epistemologist**: "If know-how is graded by reliability, and propositional knowledge can be too (e.g., credences), why isn’t this just knowledge-*that* with a pragmatic tweak?"  

  **Your Reply (2 min):**  
  "Practical representations lack truth-apt content. The surgeon’s skill tracks *how to modulate pressure dynamically*—a **continuous parametric process**, not a fact. Propositions are assessable as *true/false*; practical representations are assessed as *on-track/off-track* relative to a goal. When tissue resists, her adjustment isn’t inferring *that ‘if X, then Y’*; it’s executing a **procedural sequence** calibrated by feedback. Truth conditions don’t apply: there’s no ‘false’ representation here—only *misguided* action."  

  **Soft Spot:**  
  Intellectualists can retort that "on-track" is just *accuracy conditions*—a semantic property akin to truth.  

  **Strategic Note:**  
  **Hammer recalcitrance**: The surgeon *cannot token propositions* for what she tracks. If it were under a "practical mode," she should at least recognize correct descriptions post-hoc—but she doesn’t.  

  ---

  ### **Tier 2: Major Wounds**  
  *(Bad answers weaken credibility; good answers earn respect)*  

  #### **Objection 3: The "Automaticity Data" Bomb (Automaticity Researcher)**  
  *Phrasing:*  
  "Studies show verbal instruction *degrades* expert performance (Beilock 2002). If know-how is guided by representations, why does explicit attention to them impair skill? Shouldn’t accessing the representation *help*?"  

  **Your Reply (2 min):**  
  "Because **practical representations are not deployable consciously**. When the surgeon focuses on ‘rules,’ she *overrides* her procedural map with slow, propositional reasoning. My view *predicts* this: skills degrade when agents shift from practical to propositional guidance. The representation operates optimally when backgrounded—like implicit motor control in dorsal stream processing. Recalcitrant skills work *because* they’re insulated from conscious access, not despite it."  

  **Soft Spot:**  
  If representations are inaccessible, how do they "guide"? Appeal to *subpersonal processing* (e.g., spinal cord circuits adjusting gait), but enactivists will pounce.  

  **Strategic Note:**  
  **This is your critical test**. If you sway the automaticity researcher, her data becomes *support* for your view. Cite the *mid-advice* improvement: brief cues reactivate practical representations without full propositionalization.  

  ---

  #### **Objection 4: The "Degrees Problem" (Gradability Epistemologists)**  
  *Phrasing:**  
  "If know-how comes in degrees (novice vs. expert), and reliability admits degrees, how is this not just *more knowledge-that*? What does your view say about *what* is graded?"  

  **Your Reply (2 min):**  
  "Degrees of know-how track **refinement of the practical representation**. A novice’s representation is coarse: ‘avoid visible tearing.’ An expert’s is finely tuned: ‘apply 0.3N until elastic recoil plateaus.’ This isn’t *more propositions*—it’s richer parametric sensitivity. Propositions don’t gradably improve; they’re true or false. Skills do: the surgeon’s ‘feel’ evolves via *calibration*, not accumulation of facts."  

  **Soft Spot:**  
  Intellectualists argue that "modes of presentation" can be coarse/fine-grained too.  

  ---

  ### **Tier 3: Manageable Bruises**  
  *(Can be deflected without major cost)*  

  #### **Objection 5: The "Why Not Rylean Dispositions?" (Enactivists)**  
  *Phrasing:**  
  "Why isn’t this just Ryle with extra steps? If the disposition is reliable and advice-responsive, why call it *cognitive*? Isn’t it just embodied adaptation?"  

  **Your Reply (2 min):**  
  "Because recalcitrant skills exhibit **agential control**, not reflex. When the surgeon heeds ‘go lighter,’ she *intentionally adjusts*—it’s not a conditioned response. Practical representations explain this *guidance*: they’re the medium through which agents rationally (but non-discursively) regulate action. Rylean dispositions reduce skills to habits; mine are *normatively constrained*."  

  **Soft Spot:**  
  "Agential control" is contested. Enactivists may argue dynamical systems exhibit "self-organization," not control.  

  ---

  ### **Strategic Concessions**  
  **Preemptively concede to disarm critics**:  
  1. "Not all skills involve practical representations" (e.g., some are pure reflexes).  
  2. "Experts often *acquire* propositional knowledge *about* their skills" (e.g., surgeons study anatomy)—but this is *post hoc*, not the know-how itself.  

  ### **The Survival-Dependent Objection**  
  **You MUST nail Objection #3 (Automaticity)**. If the automaticity researcher agrees your view explains degradation *and* mid-advice improvement, you convert a critic into an ally.  

  ### **The Nightmare Question**  
  *"If practical representations aren’t truth-apt, how do they *bear content*? What’s the difference between a ‘procedure-representation’ and a non-representational dynamical attractor?"*  
  **Why it’s deadly**: Forces you into metaphysics of content—a swamp where both sides will attack.  
  **Evasive Maneuver**: "This requires a fuller theory of non-propositional content, but minimally: practical representations are *task-specific*, *endogenously evaluable* (via success/failure), and *modifiable by experience*—unlike attractors. They’re *biosemantic* states."  

  ---

  **Delivery Tip**: Start Q&A by **framing recalcitrant skills** as the keystone: "My view stands or falls on whether it explains skills that *respond to reasons but resist articulation*." Force opponents to engage your core evidence. Good luck!
