  The user might be conflating nihilism with absurdism. Nihilism says nothing matters, so why care? Absurdism acknowledges the void but responds with passion and rebellion. The death penalty is an affront to this rebellion, hence Camus's outrage. Highlighting this distinction is key to resolving their confusion.

