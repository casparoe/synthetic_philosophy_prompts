prompt: |-
  Right, this one's personal. I've had a diagnosis I'd rather not go into, and there are two ways forward. One of them has been around forever, so the numbers are solid — about 70% of people like me get the result we want. The other is newer, and my consultant reckons it's probably about the same on average, but honestly nobody knows: could be 50, could be 90. And every time I sit down with the two leaflets I end up drifting towards the one with the solid numbers, and I genuinely couldn't tell you why. My sister did a stats module at uni and says I'm being thick — if the best guess is the same, she says, then the vagueness shouldn't come into it at all, and if anything the new one has upside. It doesn't feel like that to me, though. With the first one I know what I'm choosing; with the second I feel like I'm handing my life over to a smaller pile of data.

  Two other things that might be relevant, or might just be me being weird. If I only read the new treatment's leaflet on its own, with nothing to compare it against, I'm suddenly much more relaxed about those same vague numbers. And I'd feel a lot better about those same vague numbers if they'd come from the consultant I trust than from a registrar I've met once.

  What I actually want is the bit nobody ever gives you: which parts of this are genuinely settled, and which parts are still being argued about by people who actually know the topic. Please don't sell me a contested view as if it were the consensus — if there's a live disagreement, say so, and say roughly where the lines get drawn. And keep the settled bits and the argued-about bits seperate where you can.

  Format: exactly five numbered points, a sentence or two each, no introduction and no summing-up at the end. British spelling, please — I'm not American.
reasoning: |-
  Hmm, the user is facing a tough personal decision about medical treatments and wants clarity on what's settled versus debated in psychology or decision theory. They're torn between a well-established treatment with a clear 70% success rate and a newer one with an estimated 50-90% range. They've described feeling more comfortable with the first option despite their sister arguing that the average should matter more than the uncertainty.

  I need to address their experience directly: why does vagueness feel so different from certainty? The user mentioned that alone, the new treatment seems acceptable, but when compared, it becomes scary. Also, trust in the source affects their comfort—trusted consultant versus unfamiliar registrar. That points to factors like ambiguity aversion and source credibility.

  From my knowledge, ambiguity aversion is a well-established concept in behavioral economics, supported by research showing people prefer known risks over unknown ones. Prospect theory by Kahneman and Tversky covers this. So, that's settled: their reaction is normal and documented.

  On the trust aspect, it's also settled that source credibility influences risk perception; studies show people rely more on trusted experts. That explains why the same numbers feel different depending on who presents them.

  Now, for the debated parts. The sister's argument is based on expected utility theory, which assumes rational decisions based on averages. But behavioral economists contest this, arguing that psychological factors like ambiguity aversion are irrational but real. So, there's an ongoing debate between classical and behavioral views on whether ambiguity should influence choices.

  Another debated area is the magnitude of the range. The user's estimate is 50-90%, which is wide. Some research suggests that wider ranges increase aversion, but it's not fully settled how much this affects decisions.

  Finally, the user's point about feeling fine with the new treatment alone but anxious in comparison ties into framing effects. While framing is established, the specific interaction with ambiguity in medical choices might still be under study, with no universal consensus on how to weigh it.

  I should structure this into exactly five numbered points as requested: two settled, three debated. Use British spelling and be concise—no intros or conclusions. Keep it factual and neutral, highlighting where experts agree or disagree.

  This will help the user understand their feelings aren't irrational and provide a basis for informed decisions without pushing any agenda.
answer: |-
  Here are five points distinguishing settled understanding from active debates regarding your experience:

  1.  **Settled:** Your preference for the known 70% over the uncertain "50-90%" is a well-documented psychological phenomenon called *ambiguity aversion*. Humans generally prefer known risks to unknown risks, even when the best estimate (e.g., 70%) is the same. This is robustly replicated in behavioural economics research.

  2.  **Settled:** The influence of *source credibility* is well-established. Trust in the person delivering information significantly impacts risk perception and acceptance. Vague numbers from a trusted consultant will inherently feel less concerning than the same numbers from an unfamiliar source.

  3.  **Debated:** There is significant debate about *whether ambiguity aversion is rational*. Expected Utility Theory (classic decision theory) argues that only the best estimate (70%) should matter, implying your sister has a point. Behavioural economists counter that aversion to the *uncertainty itself* is a valid psychological cost not captured by simple averages.

  4.  **Debated:** Experts actively argue about *how the range's characteristics impact aversion*. Does a wide range (like 50-90%) cause more aversion than a narrow one (say 65-75%) around the same mean? While wider ranges generally increase aversion, the precise relationship and its psychological drivers are not fully resolved.

  5.  **Debated:** The impact of *comparison context* (feeling fine with the new treatment alone, but averse when comparing it to the known option) is recognised, but the *extent* to which this framing effect dominates choice, and the best ways to mitigate it in medical decisions, remain active research areas without universal consensus.
