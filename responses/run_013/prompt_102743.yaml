prompt: |-
  I've been trying to get straight on when it's OK to bind your future self, and my gut keeps handing down verdicts I can't turn into a rule. Some of them feel obvious. A guy who knows he'll blow his paycheck on slots and sets it up so his wages get diverted before he can touch them: fine, do it. A friend who asks me to hold her keys when she's been drinking: fine. Someone who writes out, while she's lucid, that if she goes psychotic again she wants to be restrained and medicated and not let out on her own say-so: I think we should honor that, even when the person in the episode is begging us to release her — honoring it is the whole point, that's what she was buying. Ulysses lashed to the mast: obviously fine. Now the ones I resist. A man who signs a contract to work for one employer, no pay, for five years, to clear a loan: I don't think that should be enforceable, even though he signed it sober and clear-headed. A teenager who takes irrevocable vows in a religious order: I feel she should be able to walk away, vows or no vows. A guy who, mid-fight with his father, signs something binding that he'll never speak to him again: no. And a legislature that passes a balanced-budget rule a future legislature can't undo, or a constitution that freezes a specific pension age for a century — against it, though I'm strongly in favor of entrenching a bill of rights, and I'm aware those are structurally the same move. My tentative rule is that you can bind yourself in the service of your own deciding, but not in a way that hands your deciding over to somebody else or cancels it — ropes, not chains. Problem is I can't get the psychiatric directive and the teenage vows onto opposite sides of that line without cheating. In both, a past self overrides a present self who's objecting. Maybe the difference is whether the later objection is the very thing the earlier self was guarding against, but that feels like I'm just picking whichever self I happen to approve of, and the whole point of the directive is that you *can't* trust the later self's judgment. There's also a distinction I keep reaching for and I'm not sure it's real: something that's expensive to undo versus something that can't be undone at all. The savings account has a penalty; the vow has no exit. Does that line do any work, or is it just a price on a dial?

  So — is there a principle, or a short list of them ranked, that gets most of my verdicts, and which one does it make me give up? I'd especially like it run against two cases I haven't listed. First, a friend of mine writes smart contracts, and he's built one where you stake money that gets destroyed if you back out of a commitment — no human being can release you, there's nobody to appeal to, the chain just does it when the deadline passes. Ropes or contract? Second, the mirror image: a precommitment that binds other people rather than yourself, like a founder writing into a company's charter a rule no future board can ever change. And if the honest answer is that nothing single survives all of this, fine, just say which of my verdicts is the one that has to go, and why that one rather than the ones next to it.
reasoning: |-
  Okay, the user is really wrestling with the ethics of binding one's future self. They've laid out clear examples where they feel precommitments are acceptable (like Ulysses contracts or psychiatric directives) versus ones that feel wrong (indentured servitude, irrevocable vows). Their proposed "ropes not chains" distinction isn't holding up when tested against the teenage vows case. 

  Hmm... what's beneath this? They're clearly intellectually honest—admitting when their own framework fails. The religious vows example seems particularly sticky for them. I notice they're implicitly valuing autonomy but struggling with its temporal nature: which version of "you" gets priority? There's also an unspoken tension between individual sovereignty and social consequences—like how enforced poverty from a bad contract harms more than just the signer.

  The smart contracts question is fascinating because it removes human judgment entirely. And the corporate charter example flips the script by binding others. This suggests they're actually probing three layers: 1) self-binding 2) external enforcement mechanisms 3) binding third parties. 

  Wait—their core anguish might be about power differentials. In cases they approve (psychiatric directive), the binder retains agency (choosing the ropes); in bad cases (indentured servitude), power transfers to another entity. But teenage vows complicate this because the "entity" is abstract (the Church/God). 

  For the vows case, the key might be exit costs rather than revocability. The monk isn't physically chained, but social/economic penalties make it functionally binding. Whereas the drunk person's keys are temporarily held with zero permanent consequences. So maybe their instinct about "expensive vs impossible" does work—but only if we consider the totality of burdens, not just legal revocability.

  The smart contract example... oof. If money burns automatically, is that meaningfully different from Ulysses' ropes? I think yes, because the mast doesn't permanently impoverish him. The destruction of resources crosses into coercion. Whereas psychiatric sedation is reversible. 

  Founder entrenching corporate rules feels wrong to them despite approving constitutional rights—likely because constitutions have amendment procedures (however difficult), while their example implies permanence. So "revisability" might be the hidden standard. 

  Ultimately they might need to accept that teenage vows should be revocable—that's the weak link in their initial judgments. The cost isn't just to the teen; enforcing it harms the very institution by trapping unwilling participants. Sometimes letting go *is* honoring the spirit of commitment.
answer: |-
  You've hit on one of the deepest puzzles in practical philosophy—the *temporal self-governance problem*. Your instincts are sharp, and your proposed "ropes, not chains" distinction is elegant, but it fails where you suspect: psychiatric directives and irrevocable vows **both** override a protesting present self. Here's a principle that preserves most of your intuitions, forces one revision, and handles your new cases:

  ### The Core Principle: Binding as Self-Preservation, Not Self-Surrender
  **You may bind your future self only to protect your capacity for meaningful agency against predictable threats to that agency itself.** 

  This requires three conditions:
  1. **Identifiable Threat:** The future state targeted (impulse, psychosis, addiction) must demonstrably impair *rational decision-making*.
  2. **Preservation of Core Agency:** The constraint must restore/enable future agency (e.g., sobriety lets you work; medication restores lucidity).
  3. **Revisability:** Binding must allow future agency to reassert itself under conditions of restored competence. Permanent surrender of exit violates this.

  ### How It Judges Your Cases:
  | Case                          | Verdict      | Why Under Principle                                                                 |
  |-------------------------------|--------------|-------------------------------------------------------------------------------------|
  | Ulysses & the Sirens          | ✅ Legitimate | Protects agency from overwhelming impulse (Threat), preserves life/agency (Preservation), reversible (Revisability). |
  | Savings Account Diversion     | ✅ Legitimate | Protects against impulsivity (Threat), preserves financial agency (Preservation), funds retrievable (Revisability). |
  | Psychiatric Directive         | ✅ Legitimate | Targets psychosis impairing judgment (Threat), aims to restore rational agency (Preservation), directive can be updated when lucid (Revisability). |
  | Indentured Servitude Contract | ❌ Illegitimate | No *impaired agency* at signing; permanently surrenders core freedoms (fails Preservation & Revisability). |
  | Teenage Religious Vows        | ❌ Illegitimate | Adolescence isn't an "impairment," but permanent vows surrender future agency irrevocably (fails Revisability & arguably Preservation). |
  | Angry Pledge to Cut Ties      | ❌ Illegitimate | Emotion isn't equivalent to impaired rationality; permanent surrender of relationship agency (fails Threat & Revisability). |
  | Balanced-Budget Amendment     | ⚠️ Contextual | If it prevents *democratic collapse* (Threat) but allows amendment via supermajority (Revisability), potentially OK. Absolute entrenchment fails. |
  | Entrenched Bill of Rights     | ✅ Legitimate | Protects minority agency against "tyranny of majority" (Threat), preserves core freedoms (Preservation), amendable via arduous process (Revisability). |

  ### The Sacrifice: Teenage Vows
  Your intuition that the teenager should walk away **must prevail**, and your initial "teenage vows = bad" verdict is correct under this principle. Adolescence, while a time of development, isn't an *impairment of rational agency* equivalent to psychosis or addiction. Irrevocable vows surrender the *future capacity* for autonomous life choices – violating **Preservation** and **Revisability**. The cost isn't just "undoing is expensive" – it's *agency annihilation*.

  ### Handling Your New Cases:
  1. **Smart Contract Staking Money:**  
     - **Ropes, not chains?** **Chains.** If destruction of staked funds is absolute and irreversible upon failure, it violates **Revisability**. It doesn't protect *agency*; it *punishes* its exercise. Contrast with Ulysses: ropes restrain impulsivity *temporarily*; destroyed money permanently harms future agency. If the contract allowed recovery with a penalty fee (expensive undo), it might be "ropes." Absolute destruction is chains.  
     
  2. **Founder Entrenching Corporate Rules:**  
     - **Generally Illegitimate** under this framework. Binding *future others* isn't about preserving *their* agency against impairment; it's imposing one generation's will on another's agency. This fails the **Threat** condition (no impairment of future boards' rationality is assumed/preserved against). Like absolute constitutional entrenchment, it denies revisability based on new circumstances or judgments. (Exceptions *might* exist if the rule protects the entity from existential threats that would destroy all stakeholder agency).

  ### Why This Works Where "Ropes/Chains" Fails:
  - **Psychiatric Directive vs. Teen Vows:** The directive targets a specific, profound impairment of agency (psychosis) and seeks to restore it. The vow isn't a defense against impairment; it’s a surrender of agency itself. The "later objection" in psychosis *is the impairment the directive guards against*; the teen’s later objection is *exercising maturing agency*.
  - **Expensive vs. Impossible Undo:** This *is* crucial. **Revisability** doesn't mean "free undo." It means the binding doesn't *permanently extinguish* the future self's capacity to govern its core commitments when competent. Penalties impose costs; absolute prohibitions annihilate choice.

  ### Conclusion
  The principle preserves your core intuitions (Ulysses, savings, psych directive = good; servitude, angry pledge = bad) and forces a consistent verdict on **teenage vows** (should be revocable). It handles the new cases: **destructive smart contracts are chains** (they punish agency, don't preserve it), and **binding future others is generally illegitimate** (it doesn't protect *their* agency from impairment; it overrides it).

  The cost is accepting that deeply held religious vows taken young *should* have an exit path, however difficult socially or spiritually, because human agency over a lifespan is fundamental. The principle draws the line at protecting the *capacity for self-governance*, not enforcing its past surrenders.
