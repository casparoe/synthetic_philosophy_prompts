prompt: |-
  ok so this is gonna sound like a weird combo but: I started volunteering at a food bank a couple months ago and seperately I've been listening to a Buddhist ethics podcast on my commute, and now the two have collided in my head and I can't stop picking at it. The tradition keeps saying something like the weight of an act is set by the intention behind it (there's a line somewhere about intention being what karma is), but then a lot of modern people read Buddhist ethics as basically consequentialist — the whole point being to reduce suffering. Give me one concrete example where those two come apart hard: a case where the intention is unambiguously wholesome but the consequences are genuinely terrible, and where it's not obvious which verdict you'd drop. Bonus points if the causal chain is long and other people's choices sit in the middle, so you can't just wave it away with "well the agent should've known." Walk through what actually happens step by step, then say exactly where the two verdicts split and why neither side gets to just shrug it off. Don't solve it for me, I only want the conflict sharpened. Keep it to one paragraph, 300 words max, and please don't give me the trolley or the lying-to-the-murderer case, I've seen those a million times.
