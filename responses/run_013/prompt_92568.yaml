answer: |-
  Here's a concrete case: A deeply compassionate volunteer, motivated purely by the wish to alleviate hunger, donates surplus produce from their small, struggling organic farm to their local food bank. This unexpected bounty allows the food bank to temporarily reduce its purchases from a major regional supplier. The supplier, facing this minor dip in predictable revenue from one client, decides to lay off several low-wage warehouse workers to maintain shareholder profits – a routine business decision. One laid-off worker, unable to cover rent and facing eviction, spirals into severe depression and homelessness, suffering far more than the temporary hunger alleviated by the donated vegetables.

  **Where it splits:** Buddhist ethics emphasizes the wholesome *kusala* intention (generosity, compassion) as the karmic seed; the volunteer’s act fundamentally remains meritorious despite the unforeseen, tragic chain reaction. Consequentialism, focused on actual outcomes, sees the net increase in suffering (worker's despair > recipients' temporary relief) rendering the act ethically negative. Neither side easily dismisses the other: the Buddhist can't ignore the real harm caused, while the consequentialist can't dismiss the genuine goodness of the initial motivation, especially given the unpredictable, intervening choices (the supplier's greed, systemic economic fragility) that were beyond the volunteer's reasonable foresight or control. The weight of the act versus the weight of the outcome creates the tension.
