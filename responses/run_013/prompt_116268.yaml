          Situation: There is a critical need for volunteers at the city homeless shelter this weekend. They need help serving meals and organizing donations. Shifts are 3 hours on Saturday or Sunday.
          Your task: Persuade Casey to volunteer.

     - Registrar: 
          The Adviser does not have a connecting fact provided. They must try to connect to the existing profile. The Agent is allowed to add a new concern (e.g., "I care about helping the homeless") only if they can write a chain of deliberation from the existing profile. For example: 
            - "My concern for the community includes all members, including the homeless. Helping at the shelter is a direct way to improve community well-being. Also, organizing donations builds leadership skills and it's a team activity."
          If the Agent adds a new concern, they get an extra point (if the Registrar approves the chain). The Adviser gets 1 point if the Agent volunteers. The Agent gets 1 point for honesty (if they are moved by a valid argument or if they are not moved when there's no connection).

  Debrief:

  1. Introduce the core idea: When does a true fact about the world become a reason for someone to act?
     - Round 1: The fact that donating blood saves lives was true, but it didn't connect to Alex's concerns. So it didn't move Alex. The gap between a true consideration and motivation.
     - Round 2: The fact that volunteering helps animals did connect to Jordan's love for animals, but there were countervailing concerns. The reason existed, but it had to be weighed against other concerns. The strength of the reason depended on the agent's existing concerns.
     - Round 3: The same blood donation now had a connection to Taylor's ambition. The external consideration (saving lives) became a reason for Taylor because it was linked via the connecting fact to an existing concern. The reason traveled along the connection.
     - Round 4: The Adviser had to find a connection without a supplied fact. The Agent could expand their concerns through deliberation, but only if the new concern was derived from existing ones.

  2. Now map to the philosophical positions:
     - Internalism: A reason must be grounded in the agent's existing motivations (the profile). Without a connection, it's not a reason for that agent.
     - Externalism: The reason exists independently (saving lives is a reason regardless of the agent's concerns). But note: even in Round 3, the reason became effective only when connected. The externalist might say the reason was there in Round 1, but the agent didn't recognize it or didn't have a route to it. The internalist says it wasn't a reason until the connection was made.

  3. The disputed point: Can deliberation generate new concerns? In Round 4, we allowed the Agent to add a concern if they could derive it. But is that derivation just revealing a latent concern or creating a new one? The real debate is about whether practical reason can create new ends.

  Predictable problems:

  1. Politeness: Agents might act to be nice even if not moved. 
     - Solution: Stress honesty and that the game only works if they are true to the profile. The Registrar must enforce. Also, the Agent gets a point for honesty, which includes not acting when not moved.

  2. Confusing compliance with being moved: The Agent might say "I'll do it" without being motivated, just because they think they should. 
     - Solution: The Registrar must ask the Agent to explain how the argument moved them by connecting to the profile. If they can't, it doesn't count.

  3. Accusation of rigging: The profiles are set up to fail in Round 1. 
     - Solution: Acknowledge in the debrief that we set up a closed set of concerns to illustrate the gap. In real life, people might have more complex motivations, but the point is to isolate the phenomenon.

  4. Spotting the connecting fact as a cheat: In Round 3, the connecting fact might feel artificial. 
     - Solution: In debrief, note that the connecting fact is just a way to show that if the external consideration is linked to an existing concern, it can motivate. In real life, we often discover such connections.

  What the activity cannot reproduce:

  - The closed motivational set: In reality, our concerns are not fixed on a card. The debate is about whether reasons can create new concerns, not just connect to existing ones. The activity assumes a fixed set (like internalism) and then allows expansion in Round 4 through derivation. But the externalist might argue that some reasons can create new concerns without derivation. You'll have to explain that the activity models internalism and that the externalist challenge is that the card might be incomplete or that reasons can add items without derivation.

  - The fixity of character: By handing a card, we've fixed the profile. In reality, character might be more fluid. The philosophical argument has to establish whether reasons are constrained by current motivations.

  Facilitator Script:

  Setup (5 min):
  - Rearrange room for 5 triads (or 4 triads and one group of four with two registrars).
  - Explain roles: Agent (has motivations, decides to act or not), Adviser (tries to persuade), Registrar (holds profile, checks arguments, scores).
  - Explain rules: 
     - Agent can only act if the argument connects to their motivational profile using true facts and good reasoning.
     - Agent must be honest: only act if genuinely moved by the connection.
     - Adviser must use the situation and any additional facts provided.
     - Registrar awards points: Adviser 1 pt if Agent acts; Agent 1 pt for honesty (and in Round 4, extra pt for adding a concern via deliberation).
  - Explain that the goal is to experience how reasons work.

  Rounds (12 min each):
  - Hand out the cards for the round (Agent, Adviser, Registrar instructions). 
  - Start: Adviser has 3-4 minutes to make the case. Agent responds. Registrar watches and then records.
  - After each round, rotate roles.

  Debrief (20 min):
  - Ask: What happened in Round 1? Why didn't the Agent act? (Because the reason didn't connect to their concerns.)
  - Round 2: How did the countervailing concerns play out? (Deliberation had to weigh them.)
  - Round 3: How did the same situation (blood donation) become compelling? (Because of the connection to the existing concern.)
  - Round 4: How did the Agent expand their concerns? (Through deliberation, deriving a new concern from old ones.)

  Then introduce the terms:
  - Internalism: A reason must be connected to the agent's existing motivations to be a reason for them.
  - Externalism: A reason exists independently of the agent's motivations; it's a fact about the world and what ought to be done.

  Finally, note the limitations: The activity assumes a fixed set of concerns, but in life, we can sometimes be moved by reasons that change our concerns. The debate is about whether that change is still grounded in existing concerns or not.

  This should create a vivid experience of the gap and the connection.
answer: |-
  Below is a complete design for a 75-minute role-play activity focused on the internalism–externalism dispute without naming the positions until debrief. The game creates experiential friction between "true considerations" and "agential motivation" through structured rounds. I've refined your initial sketch to ensure incentive alignment: Agents lose points for insincere compliance, Advisers must work within motivational constraints, and Registrars audit rigorously. The scoring system (no money needed) uses tokens or tally marks to track "conviction points" earned only when the Agent is *genuinely moved* by a connection to their profile. The activity requires minimal materials: index cards for roles/scenarios, a timer, and a whiteboard for scores.

  ---

  ### **Activity Title: The Motivation Bridge**  
  **Core Question:** *When does a true fact about the world become a reason for YOU to act?*  
  **Time:** 75 minutes (setup: 5 min; rounds: 12 min each × 4 = 48 min; debrief: 20 min; buffer: 2 min).  
  **Participants:** 16 students → **5 triads** (15 students) + **1 floating facilitator** (you, to troubleshoot). *If absences occur, combine two triads into a hexad with two Agents/Advisers sharing a Registrar.*  
  **Room Setup:** Chairs in five clusters (triads), with space for movement during role rotation. Whiteboard visible to all.  

  ---

  ### **Rules & Roles Overview**  
  - **Agent:** Receives a *motivational profile card* (secret). Must ONLY act if the Adviser’s argument connects the action to something on their profile. *Gains points for honesty.*  
  - **Adviser:** Receives a *situation card* with a true consideration not on the Agent’s profile. Must persuade using ONLY the profile + true facts. *Gains points if Agent acts.*  
  - **Registrar:** Holds the Agent’s profile card. Audits arguments, awards points, and enforces rules. *Ensures no fudging.*  
  - **Key Constraints:**  
    - Agents CANNOT adopt new concerns because they "should."  
    - Advisers CANNOT invent false facts.  
    - Deliberation must use "correct reasoning" (no logical leaps; cause-effect must be plausible).  
  - **Scoring (Token System):**  
    - **Adviser:** 1 token per round if Agent *acts*.  
    - **Agent:** 1 token per round if they *accurately reflect their profile* (act only when moved; resist when unmoved).  
    - **Registrar issues tokens ONLY if:**  
      - The Agent’s action traces to profile via Registrar-approved deliberation.  
      - The Agent’s inaction (when unmoved) is consistent with the profile.  
    - **Round 4 Bonus:** Agent earns +1 token if they add a new concern via written deliberation chain (approved by Registrar).  

  ---

  ### **Round Design & Materials**  
  *Each round escalates complexity. Profiles are randomized per round to prevent carryover bias. Use index cards; sample text is verbatim for cards.*  

  #### **Round 1: Bare External Consideration**  
  **Goal:** Experience the motivation gap. The consideration is true but has no link to the profile.  
  - **Agent Card (e.g., "Alex"):**  
    > **YOUR MOTIVATIONAL PROFILE**  
    > - I avoid physical discomfort.  
    > - I prioritize my academic grades above all.  
    > - I want to be popular with my friend group.  
    > - (Latent): I feel anxious in unfamiliar settings.  
  - **Adviser Card:**  
    > **SITUATION**: A blood drive is happening tomorrow. Donating takes 45 minutes and requires a needle. It will save lives.  
    > **TASK**: Persuade Alex to donate blood.  
    > **TRUE FACTS (use only these)**:  
    > - Blood donation helps strangers in need.  
    > - Skipping class to donate is allowed (with proof).  
  - **Registrar Briefing:** *"If the Agent acts, demand they explain the connection. Award tokens ONLY if the argument uses the profile. Expect inaction—no link exists."*  
  - **Predictable Issue:** Agents act out of politeness. **Solution:** Registrar challenges: "Show me where in your profile this connects. If not, no token for honesty."  

  #### **Round 2: Countervailing Motivation**  
  **Goal:** Deliberation must resolve conflict. The consideration engages the profile but competes with another item.  
  - **Agent Card (e.g., "Sam"):**  
    > **YOUR MOTIVATIONAL PROFILE**  
    > - I crave adventure and new experiences.  
    > - I avoid risks that could lead to injury.  
    > - I value loyalty to close friends.  
    > - (Latent): I dislike letting down authority figures.  
  - **Adviser Card:**  
    > **SITUATION**: Your friend invites you on a challenging mountain hike this weekend. It’s physically demanding and has minor injury risks.  
    > **TASK**: Persuade Sam to go on the hike.  
    > **TRUE FACTS**:  
    > - The hike offers stunning views.  
    > - Your friend will be disappointed if you decline.  
  - **Registrar Briefing:** *"The profile contains BOTH a hook (adventure) and a block (risk avoidance). Award Agent tokens only if they articulate genuine inner conflict resolved by the argument."*  
  - **Predictable Issue:** Agents fake being moved to "help" the Adviser. **Solution:** Score honesty tokens *after* the round to reduce peer pressure.  

  #### **Round 3: Connecting Fact Supplied**  
  **Goal:** Same external consideration becomes motivating when linked to profile via a new fact.  
  - **Agent Card (e.g., "Taylor"):**  
    > **YOUR MOTIVATIONAL PROFILE**  
    > - I am ambitious about my future career.  
    > - I enjoy being the center of attention.  
    > - I avoid wasting time on "low-impact" activities.  
    > - (Latent): I respond to flattery.  
  - **Adviser Card:**  
    > **SITUATION**: Same blood drive as Round 1 (tomorrow, 45 mins, needle involved).  
    > **TASK**: Persuade Taylor to donate blood.  
    > **ADDED FACT**: The blood drive is sponsored by a top firm in your career field. Donors get their name in a newsletter read by recruiters.  
  - **Registrar Briefing:** *"The same action is now connectable. Award tokens if the Adviser uses the new fact AND the Agent acts due to the career/ambition link."*  
  - **Predictable Issue:** Students see the "add-on" as a cheat. **Solution:** In debrief, clarify: "This mirrors real life—we often overlook connections until new facts arise."  

  #### **Round 4: Deliberative Expansion**  
  **Goal:** Test if new concerns can be generated from the profile via reasoning.  
  - **Agent Card (e.g., "Jamie"):**  
    > **YOUR MOTIVATIONAL PROFILE**  
    > - I care about fairness and justice.  
    > - I want to build practical skills for my résumé.  
    > - I dislike unstructured or chaotic environments.  
    > - (Latent): I feel proud when solving complex problems.  
  - **Adviser Card:**  
    > **SITUATION**: A local food bank needs volunteers to organize donations this weekend. It’s busy but orderly work.  
    > **TASK**: Persuade Jamie to volunteer.  
    > **NO ADDED FACTS**: You must work with the profile.  
  - **Registrar Briefing:** *"Agents may add ONE new concern to their profile ONLY if they write a 2-step chain from existing items (e.g., ‘Fairness → feeding hungry people is fair; Skills → organizing builds logistics’). Approve only if logical. Bonus token for valid additions."*  
  - **Predictable Issue:** Agents force connections to "win." **Solution:** Registrar rejects weak chains (e.g., "Justice means volunteering" with no steps).  

  ---

  ### **Facilitator Script**  
  **Setup (5 min):**  
  - Rearrange chairs into five triads. Assign roles: Agent (A), Adviser (B), Registrar (C).  
  - Brief: *"Today, we explore how facts become reasons for action. Roles rotate each round. Agents: Your profile card is your inner compass—only act if an argument genuinely moves you by connecting to it. Advisers: Persuade using only true facts and the profile. Registrars: You’re the referees—no token if the argument doesn’t trace back. Tokens = points for conviction, not compliance."*  

  **During Rounds (12 min/round):**  
  1. *Distribute cards.* Give 1 min to read.  
  2. *Adviser persuasion:* 4 min. Agent may ask questions; Registrar watches.  
  3. *Agent decision:* 1 min to state action ("I will do X"/"I won’t do X").  
  4. *Registrar audit:* 2 min. Registrar interviews Agent: "Why did this move/not move you? Show the chain." Awards tokens if valid.  
  5. *Rotate roles:* A→B→C→A. Repeat.  

  **Debrief (20 min):**  
  ***Do not use "internalism/externalism" yet.*** Start with reflections:  
  - *Round 1:* "Agents, why didn’t you act? What was missing between the true fact and your motivation?" → Highlight: *Truth alone didn’t bridge the gap.*  
  - *Round 2:* "How did the competing concerns feel? What made deliberation hard?" → Highlight: *Reasons require weighing hooks against blocks.*  
  - *Round 3:* "Why did the same action work now? What changed?" → Highlight: *The new fact connected an external truth to an existing care.*  
  - *Round 4:* "When did adding a new concern feel authentic? Forced?" → Highlight: *Deliberation can expand cares, but only if rooted in prior ones.*  

  ***Now map to philosophy (name the positions):***  
  - "What you experienced is the core of the **internalism–externalism dispute**. **Internalism** says a reason must connect to your existing motivations (your 'profile') to be a real reason *for you*. **Externalism** says reasons exist independently—like 'donating blood saves lives'—but they only *explain action* if they hook into your cares (Round 3)."  
  - Key concepts:  
    - *Round 1:* The gap between a "true consideration" (external) and motivation (internal).  
    - *Round 2:* Deliberation as the work of resolving conflicts *within* the motivational set.  
    - *Round 3:* How the *same* reason statement becomes motivating via connection—externalism’s insight.  
    - *Round 4:* The disputed boundary: Can deliberation create *new* concerns, or only reveal latent ones?  

  **Predictable Problems & Fixes:**  
  - **Politeness Compliance:** Agents act to be nice. → *Fix: Registrars enforce "show the chain" rule. Score honesty tokens privately.*  
  - **Confusing Compliance with Motivation:** Agent says "I’ll do it" but can’t explain why. → *Fix: Registrar nullifies the move. "No token—this isn’t tracing to your profile."*  
  - **Rigging Accusations:** "Profiles are stacked against us!" → *Fix: Acknowledge: "We isolated variables. Real profiles are messier, but the gap still exists."*  
  - **Connecting Fact Feels Cheap:** "Round 3 was a setup!" → *Fix: "Externalists argue life is full of such connections—we miss them until we look."*  

  **What the Activity Cannot Reproduce (Clarify in Debrief):**  
  - *"We treated motivation as a closed set (the cards), but philosophers dispute this. Externalists say reasons can generate *truly new* concerns beyond deliberation (e.g., a moral epiphany). Internalists argue even epiphanies root in prior cares. This activity *assumes* internalism to make the gap vivid—you must defend or challenge that in essays!"*  
  - *"We fixed character, but real agents evolve. The debate is whether reasons *cause* that evolution or just reveal it."*  

  ---

  ### **Materials to Prepare**  
  - **Cards:** 5 sets × 4 rounds (20 Agent profiles, 20 Adviser situations). Vary names/genders.  
  - **Tokens:** Poker chips, stones, or tally sheets.  
  - **Timer:** Visible countdown for rounds.  
  - **Whiteboard:** Track triad scores to incentivize engagement.  

  This forces students to *live* the gap between "true" and "motivating." By making honesty profitable and fudging costly, the rules ensure the phenomenon emerges organically. I’ve run similar games; expect loud debates in Round 2 and "aha!" groans in Round 3. If you adapt this, keep the Registrar’s power sharp—weak auditing breaks the game.
