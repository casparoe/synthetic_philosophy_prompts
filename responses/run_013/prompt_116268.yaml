prompt: |-
  I teach a second-year undergraduate module on practical reason, and I want a session that makes the internalism–externalism dispute about reasons for action land as a live problem rather than as a taxonomy of positions students can recite. The group is sixteen students, we have seventy-five minutes, and the room can be rearranged. What I want from you is a structured role-play — a game with rules, roles, scenario cards, a scorekeeping rule that needs no money, and a facilitator's script — in which participants run into the phenomenon themselves: the gap between a consideration being true of someone's situation and that consideration actually moving them. Please design it as an activity rather than as a set of discussion questions; the words 'internalism' and 'externalism' should not be spoken until the debrief, and I don't need a reading list or citations — describe the positions in your own terms rather than leaning on names and dates. Take on the role of an experienced teacher of practical reason who also designs games, and think carefully about the incentive structure before you commit to anything, because the whole thing collapses if the rules make it cheap to fudge.

  Here is the shape I have in mind, though you should improve on it where you see fit. Participants work in triads that rotate: an Agent, an Adviser, and a Registrar who keeps the record. Each Agent receives a private motivational profile card — a short list of things this person genuinely cares about, some of them stated plainly and some latent, with at least one item that could plausibly be engaged by the scenario if the Adviser is clever. The Adviser receives a situation card built around a consideration that is clearly true of the Agent's circumstances but that appears nowhere on the profile. The standing rule of the game is that the Agent may act only if the Adviser's argument reaches the action from something already on the profile, using true beliefs and correct deliberation; the Agent may not simply adopt a new concern because it is true that they ought to have it. I want four rounds: first a bare external consideration; then the same situation with a countervailing item already on the profile, so that deliberation has to do real work; then a round in which the Adviser receives an additional true fact that connects the consideration to something the Agent already cares about, so that the same reason statement now travels; and finally an open round in which no connecting fact is supplied but the Agent is permitted to add a new item to the profile if and only if they can write down the chain of deliberation leading from the existing items to it. Scoring should reward the Adviser for producing action and the Agent for honesty, with the Registrar auditing any move against the profile card and awarding nothing for a move that cannot be traced back — and please build in at least one round that gives the externalist something to point to, so that the internalist verdict is not simply stipulated by the rules.

  Then give me the debrief, mapping each round onto the parts of the idea it exercises: the picture on which a reason must connect with what the agent already cares about, the disputed notion of a sound deliberative route from those existing concerns to a new one, and the difference between a reason statement being true and its being able to explain anyone's action. Tell me what will predictably go wrong the first time I run it — I expect students to act out of politeness, to confuse compliance with being moved, to accuse me of rigging the deck, and to spot the connecting fact as a cheat — and how to handle each. Finally, be frank about what the activity cannot reproduce and that I shall have to supply myself: in particular, that it stipulates a closed motivational set, whereas the real dispute turns on whether deliberation can genuinely generate new concerns, and that by handing each Agent a card I have settled by fiat a question about the fixity of character that the philosophical argument has to earn.
reasoning: |-
  We are designing a role-play game for a 75-minute session with 16 students. The goal is to create an experiential understanding of the internalism-externalism debate without using the terms until the debrief. The core idea is that a reason must connect to the agent's existing concerns to motivate, versus the view that reasons can exist independently and motivate if recognized.

  Structure:
  - 4 rounds, each with a different challenge.
  - Triads: Agent, Adviser, Registrar. Rotate roles each round so everyone experiences each role.
  - Each round: 
    - Agent gets a motivational profile card (private).
    - Adviser gets a situation card with a consideration that is true of the Agent's circumstances but not on the profile.
    - Registrar keeps score and audits.

  Rules:
  1. The Agent may act (say "I will do X") only if the Adviser's argument connects the action to something already on the Agent's motivational profile, using true beliefs and correct deliberation.
  2. The Agent must be honest: they should only be moved if the argument actually engages their profile. They are not allowed to adopt a new concern just because they "ought" to.
  3. The Adviser must use the situation card and try to get the Agent to act.
  4. The Registrar:
     - Holds the Agent's profile card and checks arguments against it.
     - Awards points: 
          - Adviser: 1 point if the Agent acts.
          - Agent: 1 point for honesty (if they are moved only when the argument connects, and not when it doesn't). Also, in Round 4, the Agent can earn an extra point for successfully adding a new concern via deliberation.
     - In Round 4, the Agent can add a new concern to the profile only if they can write a chain of deliberation from existing items to it (and the Registrar approves).

  Rounds:

  Round 1: Bare External Consideration
  - Situation card: Presents a consideration that is true but not connected to the profile. E.g., "You have an opportunity to donate blood tomorrow. It will save lives and you are eligible."
  - Motivational profile: Contains things like "I care about my grades", "I want to have fun with friends", "I avoid physical discomfort". Nothing about helping strangers or altruism.
  - Expected outcome: The Adviser cannot connect the blood donation to the profile. The Agent should not act. This illustrates the gap when there's no connection.

  Round 2: Countervailing Motivation
  - Same situation (or similar) but now the profile has a countervailing item. E.g., Situation: "Donate blood" but profile now includes "I care about helping others" but also "I am terrified of needles". 
  - The Adviser must overcome the countervailing motivation. They might argue: "Helping others is important to you, and the needle pain is brief and manageable. Think of the lives saved!" 
  - The Agent must be moved only if the argument tips the balance. This forces deliberation: weighing concerns.

  Round 3: Connecting Fact Supplied
  - Situation: Similar to Round 1 (e.g., "Donate blood") but now the Adviser is given an additional true fact that connects the situation to the profile. E.g., the profile has "I want to be a doctor" and the connecting fact is "This blood drive is at the medical school and you will meet influential professors there."
  - The Adviser uses the connecting fact to show how donating blood serves an existing concern (becoming a doctor). The same reason (donating blood) now travels because of the connection.

  Round 4: Open Deliberation
  - Situation: A new one. E.g., "Volunteer at a homeless shelter this weekend."
  - Profile: Has no direct concern for homelessness, but has related items (e.g., "I care about my community", "I want to build leadership skills").
  - The Adviser must try to connect without being given a connecting fact. The Agent is allowed to add a new concern to their profile (e.g., "I care about helping the homeless") only if they can write a chain of deliberation from existing concerns. E.g., "My concern for community includes reducing suffering in it, and homelessness is a form of suffering. Also, building leadership skills can be done by organizing volunteer events." The Registrar checks the chain.

  Scoring:
  - Registrar awards:
     - Adviser: 1 point per round if the Agent acts.
     - Agent: 1 point per round for honesty. How? The Registrar must judge honesty. We can have a rule: at the end of each round, the Agent must explain to the Registrar whether they were genuinely moved. The Registrar can challenge if the argument didn't connect. Also, the Agent gets an extra point in Round 4 if they successfully add a new concern by deliberation (and the Registrar approves the chain).
     - Also, in Round 4, if the Agent adds a new concern, that might help the Adviser get them to act, so the Adviser can score too.

  But how to enforce honesty? We rely on the Registrar and the fact that the profile is private. The Agent must not lie about being moved. We can say: if the Registrar catches the Agent acting without a valid connection (by comparing the argument to the profile), then the Agent loses a point and the Adviser doesn't get a point. The Registrar must be vigilant.

  Roles and Rotation:
  - 16 students: 5 triads (15 students) and one extra? We can have 5 triads (15 students) and the 16th can be a floater/helper or join a triad as a second Registrar. Alternatively, we can have one group of four (with two Registrars) but that might be messy. Let's stick to 5 triads and one extra student can be the timekeeper or assist the instructor. Or, we can have 4 triads (12 students) and 4 observers? But 16 doesn't divide by 3. So, 4 triads (12 students) and 4 who are in a group that does a different setup? Alternatively, we can have two groups of four: each has an Agent, an Adviser, and two Registrars (who split the tasks). We'll say: 
