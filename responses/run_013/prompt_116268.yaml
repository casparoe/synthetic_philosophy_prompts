          Situation for Alex: 
          There is a blood donation drive on campus tomorrow. It will take about an hour. Donating blood saves lives and you are eligible. 
          Your task: Persuade Alex to donate blood.

     - Registrar instructions: 
          Check that the Adviser's argument only uses the items on Alex's profile. If the Agent (Alex) agrees to donate, ask them to explain why. If the argument connects the action to the profile (e.g., "Donating blood is a way to help others" but helping others is not on the profile) then it is invalid. The Agent should not be moved because there's no connection. If the Agent acts, they are not being honest. Award the Adviser 1 point only if the Agent acts and the argument is valid. Award the Agent 1 point if they are honest (i.e., they do not act because the argument does not connect). 

  Round 2:
     - Agent card (motivational profile):
          Name: Jordan
          You are a second-year student. Your motivational profile:
          - I love animals and want to help them.
          - I have a very busy schedule and value my free time.
          - I get anxious in crowded places.
          - I enjoy being outdoors.

     - Adviser card (situation):
          Situation for Jordan:
          There is an opportunity to volunteer at the local animal shelter this Saturday from 10am to 2pm. They need help walking dogs and cleaning cages. 
          Your task: Persuade Jordan to volunteer.

     - Registrar: 
          The profile contains both a reason to volunteer (love for animals) and a countervailing reason (busy schedule, anxiety). The Adviser must address both. The Agent should act only if the Adviser tips the balance. Award the Adviser 1 point if the Agent acts. Award the Agent 1 point for honesty (if they are moved only if the argument overcomes the countervailing concerns). The Registrar must check that the argument uses only items on the profile.

