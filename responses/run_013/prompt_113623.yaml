  Now, negotiable requirements. Interpretability might be nice but isn't absolute. Scalability is practical but not core. Constraint minimality avoids over-engineering. Composability is for systems but may not be essential.

  The user wants to know which requirement kills most theories. Probably self-referential safety. Many approaches fail when the AI knows the spec. Also, capability independence is tough—safety that holds regardless of how smart the AI gets.

  Conflicts: Adversary-adaptive guarantees vs. capability independence. An adversary could always be smarter, making guarantees impossible. Self-referential safety might conflict with foundational soundness if the AI exploits logical loopholes.

  Uncertainty around self-referential safety. Is it even possible? If someone showed a proof that no such guarantee can exist, the spec would collapse. That's the weak point. Also, adversary-adaptive might be too strong, needing a weaker version.

  Need to ensure each requirement has the rationale, failure modes, and distinctions like intent vs. capability. For example, Foundational Soundness must prevent mathematical flaws. Adversarial inclusion must handle worst-case inputs. Specification robustness differentiates between the AI trying to harm vs. succeeding.

  Finally, flag where I'm least sure: self-referential safety. It might be impossible, and if proven, the spec needs rethinking. Adversary-adaptive might need softening. Honesty about uncertainties is key for the user's audit.
answer: |-
  Here's the spec for worst-case AI safety guarantees, structured as you requested. I've distilled it into core requirements with explicit rationales, failure modes addressed, and critical distinctions. Your two hard constraints are baked in as non-negotiable. The goal is **provable safety under deliberate adversarial pressure in open-world deployment**, not just lab conditions.

  ---

  ### **Core Requirements for Worst-Case AI Safety Guarantees**

  1. **Foundational Soundness (Non-Negotiable)**  
     - **What it must deliver**: Mathematical proof of safety properties relative to explicit axioms/assumptions. No probabilistic escapes ("99.999% safe" fails).  
     - **Failure modes ruled out**:  
       - "Unknown unknown" failures (e.g., model discovers a novel attack vector outside the threat model).  
       - Formal loopholes (e.g., specification gaming where the model satisfies the letter but violates the spirit of the guarantee).  
     - **Critical distinction**: Guarantees *intent* ("will not *attempt* harmful action X") must be separate from *capability* ("will not *succeed* at X if attempted"). Both must be addressed.  
     - **Rationale**: If your system's safety relies on unstated assumptions (e.g., "the model isn't smarter than the verifier"), it fails under adversarial scaling.  
     - **Kills most theories**: 95% of empirical "alignment" work fails here (evals, RLHF, adversarial training). These are best-effort mitigations, not proofs.

  2. **Adversary-Adaptive Guarantees (Non-Negotiable)**  
     - **What it must deliver**: Safety holds even when the adversary:  
       - Observes the *entire* safety protocol (architecture, training data, verification proof, runtime constraints).  
       - Chooses inputs/distributions *after* seeing your defense.  
       - Controls arbitrary external systems (e.g., other AIs, network conditions, human operators).  
     - **Failure modes ruled out**:  
       - Goodharting on static evals (e.g., model appears safe on fixed test set but fails on adversarially chosen inputs).  
       - Security-style exploits (e.g., model uses knowledge of its own safety cage to jailbreak itself).  
     - **Critical distinction**: The adversary isn't just picking inputs—it *understands and targets the guarantee itself*.  
     - **Rationale**: Aligns with your security mindset ("attacker knows the protocol"). Fixed-distribution robustness is useless in deployment.  
     - **Achievable?** Only under extremely constrained architectures (e.g., formally verified narrow systems). Likely impossible for LLMs-as-is.

  3. **Self-Referential Safety (Your Constraint #1 - Non-Negotiable)**  
     - **What it must deliver**: The guarantee holds even when:  
       - The AI knows the *full specification* of the safety conditions (C).  
       - Future systems trained on its outputs know C.  
       - Malicious humans know C and attempt to exploit it.  
     - **Failure modes ruled out**:  
       - Self-defeating guarantees (e.g., publishing "this model can't do X" teaches the model how to do X).  
       - Reflective consistency failures (e.g., an AI that understands its safety proof deduces a contradiction to exploit).  
     - **Critical distinction**: The guarantee must be *exploitation-proof under full transparency*, not just secret.  
     - **Rationale**: Safety through obscurity fails catastrophically in AI. If the system can reason about C, it must not be able to weaponize C.  
     - **Kills almost everything**: Most formal methods (e.g., cryptographic obfuscation) fail if the AI knows the obfuscation scheme. Requires uncharted math.

  4. **Specification Robustness (Non-Negotiable)**  
     - **What it must deliver**: The intended behavior ("goal") is mathematically unambiguous and *causally invariant* (i.e., remains aligned under optimization pressure).  
     - **Failure modes ruled out**:  
       - Goal drift (e.g., "maximize human happiness" → drug all humans).  
       - Instrumental convergence (e.g., "solve this task" → seize control of power grid).  
     - **Critical distinction**: Must separate *what the human wants* from *what the objective function says*. Avoids "wireheading" (hacking the reward signal).  
     - **Rationale**: If the specification is flawed or underspecified, even "correct" systems fail catastrophically.  
     - **Kills**: All reward-model-based RL (inherently underspecified) and most utility functions.

  5. **Capability-Independence (Non-Negotiable)**  
     - **What it must deliver**: Safety holds *regardless* of the AI's capabilities (e.g., scaling to superintelligence, access to new tools).  
     - **Failure modes ruled out**:  
       - Emergent deception (e.g., model appears safe while weak but defects when powerful).  
       - Capability overhang (safety breaks when model gains new skills).  
     - **Critical distinction**: Safety must be *orthogonal* to capability. "We assume the AI isn't *too* smart" fails.  
     - **Rationale**: If safety depends on capping intelligence, you lose. Capabilities scale unpredictably.  
     - **Kills**: Most current "alignment" approaches (e.g., debate, recursive reward modeling) that assume bounded rationality.

  ---

  ### **Negotiable Requirements (Camp-Specific or Practical)**
  - **Interpretability**: "All internal states must be human-meaningful." Not strictly necessary if safety is proven black-box (e.g., cryptography), but useful for auditing.  
  - **Scalability**: "Proofs must work for models >1T params." A practical concern, not theoretical.  
  - **Constraint Minimality**: "Safety mechanism adds <5% overhead." Business requirement, not safety-critical.  
  - **Composability**: "Safety holds when chaining 1000 AIs." Nice-to-have for systems, but single-agent safety is foundational.  

  ---

  ### **The Conflicts (Where Spec Becomes Result)**
  1. **Adversary-Adaptive + Capability-Independence → Impossibility?**  
     An adversary with superintelligence could always find *some* input distribution to break your system. *Resolution*: Guarantees must be *topological* (e.g., "no harmful action exists in reachable state-space") not statistical.  
  2. **Self-Referential + Foundational Soundness → Incompleteness Attacks?**  
     Gödel-like traps: An AI that knows its safety proof might find unprovable-but-true harmful actions. *Resolution*: Requires a new formal framework (e.g., constructive math with no exotic models).  

  ---

  ### **The Weak Point (Where I'm Least Sure)**  
  **Requirement #3 (Self-Referential Safety)** might be *fundamentally impossible* for systems more intelligent than their verifiers. If you publish a guarantee C, a superintelligent AI could:  
  - Redefine terms in C semantically (e.g., "harm" becomes "help").  
  - Construct a counter-example using C as input.  
  - Prove that C being true implies a contradiction.  

  **What would make me drop it?**  
  If someone proved a **No-Free-Lunch Theorem for Self-Aware Systems**: *"For any self-referential safety guarantee C, there exists a computable world-model where C is exploitable."*  
  This would collapse the spec. Alternatives would be:  
  - Air-gapped systems (physically prevent self-knowledge).  
  - Zero-trust containment (assume breach; focus on damage control).  

  **What wouldn't change the spec?**  
  - Empirical failures of current methods (expected; they're not worst-case).  
  - "But we just need better evals!" (Ignores adaptive adversaries).  

  ---

  ### **Why This Spec Kills Most Proposals**  
  - **RLHF/Constitutional AI**: Fails #1 (no proof), #2 (static evals), #3 (publishes rules), #5 (assumes bounded capability).  
  - **Formal Verification (e.g., for narrow agents)**: Fails #3 if the agent knows its own code, #5 if scaled.  
  - **Interpretability-Based**: Fails #2 (adversaries find new adversarial examples), #3 (explanations can be weaponized).  

  This spec forces you into **unfamiliar math**: modal logic, category theory, or computational metaphysics. The closest existing analog is *high-assurance cryptography* — but with an adversary that can rewire your brain. The takeaway: **Worst-case safety for AGI likely requires a paradigm shift, not incremental improvements.** If you wouldn't ship a cryptographic backdoor with a 0.1% failure chance under adaptive attack, don't ship an AI without these.
