  Starting with the non-negotiable requirements. Foundational soundness is key—math, logic, no hand-waving. Then adversarial inclusion: worst-case must cover adaptive adversaries. Specification robustness: the goal must be unambiguous. Their point about the adversary knowing the defense ties into adaptive adversaries. Maybe call that "Adversary-Adaptive Guarantees."

