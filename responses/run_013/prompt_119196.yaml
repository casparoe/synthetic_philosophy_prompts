answer: |-
  Here’s a structured 2-hour teaching plan targeting conceptual clarity on SSA vs. SIA, designed for your interdisciplinary audience. Components build sequentially, with misconceptions addressed *in situ*. Total time: 115 minutes (allowing 5 min buffer).

  ---

  ### **Order, Timing, and Dependencies**  
  *(Key: [Dependency Reason] + [Misconception Handling])*  

  1.  **Self-Locating Uncertainty as Legitimate Credence (15 min)**  
      *   **Activity:** Introduce a **betting scenario** — "You wake with amnesia in a red or blue room (50/50). Would you pay $50 to win $100 if your room is red?"  
      *   **Why first?** Establishes self-locating belief as actionable probabilistic uncertainty. Avoids abstract philosophy.  
      *   **Kills misconception:** "Not real credence." Shows money pumps/decisions require probabilistic treatment.  

  2.  **Reference Class Problem (Core of SSA) (20 min)**  
      *   **Activity:** **Doomsday Argument (DA) Lite:** "Assume humans exist only on Earth. Total humans born: 100B. You’re the 60Bᵗʰ. If humanity lasts 1T total, your birth rank is typical. If it ends at 200B, your rank is late. Should you shift belief toward doom?"  
      *   **Why now?** SSA *cannot* be defined without a reference class ("humans"? "conscious observers"?). DA’s bite comes from class choice.  
      *   **Placement defense:** Reference class *must* precede SSA/SIA fork. SSA isn’t a single rule but a family parameterized by class. DA fails if class = "all humans who hear DA" or "mammals".  

  3.  **Self-Sampling Assumption (SSA) Defined (15 min)**  
      *   **Definition:** "Given you exist, your observations are a random sample from all observations in your reference class."  
      *   **Activity:** Apply SSA to DA Lite. "Sampling uniformly from all humans, P(high birth rank | doom soon) > P(high birth rank | long future)."  
      *   **Dependency:** Requires reference class (Step 2) to avoid vacuity.  

  4.  **Attack Your Coin-Toss Example (25 min)**  
      *   **Your draft:** "You’re equally likely to be any created person → likely tails."  
      *   **Flaw:** This *is* SIA (uniform over *possible people*), not neutral. SSA (uniform over *actual people*) gives:  
          - Heads: 1 person exists → 100% chance you’re them.  
          - Tails: 1000 exist → 100% chance you’re one of them.  
          → **P(Heads | You exist) = P(Heads) = 50%** (SSA cancels anthropic effect).  
      *   **Repair:** **Cosmology Example (Carrying Example):**  
          > "Two theories: T1 predicts 10¹⁰ observers, T2 predicts 10²⁰. All else equal. You exist. Use SSA: You’re a random observer from *actual* observers. T1 has fewer observers → higher probability you’d be *you* if T1 is true.  
          ∴ **SSA favors T1** (smaller universe).  
          Use SIA: You’re a random observer from *possible* observers under each theory. T2 has more possible slots for you.  
          ∴ **SIA favors T2** (larger universe)."  
      *   **Why this works:** No indexical evidence, cleanly forks SSA (actuals) vs. SIA (possibles), avoids coin-toss’s SIA-smuggling.  

  5.  **Self-Indication Assumption (SIA) Defined (10 min)**  
      *   **Definition:** "Your existence as an observer is more likely in theories predicting more observers."  
      *   **Activity:** Apply to cosmology example. SIA = "Presumptuous Philosopher" enabler.  
      *   **Kills misconception:** "SIA = solipsism." Contrast: SIA weights theories by *your* likelihood, not your importance. "More observers" ≠ "for your sake."  

  6.  **Doomsday Argument Revisited (SSA’s Peril) (15 min)**  
      *   **Activity:** Return to DA Lite. Under SSA + class="all humans", DA works. But:  
          - Is the class right? (Link to Step 2)  
          - SIA *counters DA*: If doom soon, fewer observers → lower P(you exist) under doom.  
      *   **Kills misconception:** "DA is a fallacy." Shows DA is *internally consistent* under SSA + intuitive class.  

  7.  **SSA vs. SIA is NOT Exhaustive (15 min)**  
      *   **Activity:** **Reference-Class Relativity:** "Is a Neanderthal in a human-Neanderthal hybrid part of your reference class? SSA gives different answers if class = 'Homo sapiens' vs. 'sentient beings'."  
      *   **Key point:** SSA/SIA fork ignores that SSA’s output depends entirely on an *arbitrary* class choice. "Full non-indexical conditioning" (Bostrom) or "SSA+SIA" hybrids exist.  
      *   **Kills misconception:** "SSA/SIA are the only options."  

  8.  **Sleeping Beauty: Omit**  
      *   **Why:** Halfer/Thirder ≠ SSA/SIA. Halfers use SSA-like actual awakenings; Thirders use SIA-like centered worlds. But it adds confusion ("Is Beauty’s credence for betting?"), and your audience is primed to dig in. Use cosmology as the workhorse.  

  ---

  ### **Closing Diagnostic & Open Refusals**  
  **Diagnostic Question (5 min):**  
  > "Theory A predicts 1 observer (you). Theory B predicts 1000 observers (including you). Before observing anything else, does SSA, SIA, both, or neither imply you should prefer Theory A?"  
  *Correct grasp:* SSA prefers A (higher prob. of being you in smaller universe). SIA prefers B (more slots for you).  

  **Refusals (Word Carefully):**  
  *   **On consciousness/identity:** "We’re treating 'observer' as a placeholder. Whether it requires consciousness, continuity, or quantum awareness is vital—but today’s math is neutral. Resolving that won’t make SSA’s reference class vanish."  
  *   **On which is "true":** "This isn’t about proof; it’s about coherence. SSA avoids armchair cosmology but invites doomsday. SIA avoids doomsday but invites presumptuousness. You must choose your poison—or invent a new antidote."  
  *   **On probability foundations:** "Whether self-locating beliefs reduce to objective frequencies or require subjective imprecision is unresolved. But today, we’ve shown they demand *some* calculus."  

  **Final Wording for Refusals:**  
  > "We’ve mapped the forks: reference classes for SSA, actuals vs. possibles for SIA. But the jungle grows deeper—philosophy of identity, decision theory, and quantum observers await. Today’s goal wasn’t to clear the whole forest, but to ensure you never confuse the first two signposts."  

  ---
  **Why this sequence works:**  
  - Starts concrete (betting) → builds SSA machinery (reference class) → forks with cosmology (not coin toss) → debunks misconceptions *as they arise*.  
  - DA appears early (intuitive) and late (analyzed), showing SSA’s cost.  
  - Cosmology example carries SSA/SIA contrast *without* pre-supposing either.  
  - Diagnostic question isolates the fork, forcing application over vocabulary.
