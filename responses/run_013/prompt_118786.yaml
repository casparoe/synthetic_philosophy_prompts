  I'm putting together a packet for a reading group on al-Ghazālī and causation, and I want to try an adversarial-collaboration exercise instead of teh usual pro/con debate. You're a philosopher of religion who also knows contemporary metaphysics of causation. Think carefully, and start by brainstorming the actual cruxes before you draft anything.

  Draft the joint statement that two people could both sign after a long good-faith collaboration. The two camps are: first, an occasionalist in the Ghazālī line, who holds that no created thing has genuine causal power, that God directly produces every event, and that the regularities we call laws are habits or decrees rather than necessary connections in things; second, a causal realist in the Aristotelian or dispositionalist line, who holds that finite things really do have powers and dispositions, that causation is more than constant conjunction, and that God may still be the ultimate sustainer without being the only cause. I want the claims they can both sign about causation, regularity, miracles, counterfactuals, and explanation; the exact points where they still disagree, each written in wording its own side would accept; the cruxes, meaning the sub-questions that, if settled one way, would move at least one side; and for each crux, a case or argument both sides agree bears on it, with each side's prediction written down in advance. If part of their dispute is merely verbal, say which part and why.

  To keep this from being a tour of the cotton-and-fire example, I'm inventing a microdomain and I want the whole document to use it as the shared test case. Call it the Kessler lamp: a sealed lamp that lights when you flip a switch, except that in about one in a billion flips it does not, and no physical inspection of the lamp, the switch, the wiring, or the surroundings detects anything different before or after the failure. Both sides agree the lamp exists and the failure rate is real. They do not agree on what the failure shows. Build the cruxes around that: what would each side say is happening in the failed flip? What would each predict about a modified lamp whose failure rate drops to zero after a blessing, or rises after a manufacturing change? What would each count as evidence against its own view? And does the disagreement survive once they distinguish claims about causation from claims about the meaning of cause?

  Dont give me a bibliography, reading list, or citations; I know the texts. Keep it concrete and technical rather than survey-ish. At the end, say how confident you are in the main claims you make and single out the one point you're least sure about.
