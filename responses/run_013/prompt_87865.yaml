prompt: |-
  Ok, I need a memo and I'm abit out of my depth with it, so bear with me.

  I sit on the advisory panel that's drafting the statute for the tribunal we're standing up over the war that ended last year. I'm the philosopher in the room; everyone else is a practitioner, and the prevailing mood is "just do what Nuremberg and Tokyo did and stop fussing". I'm the one who has to write the paper for Thursday's meeting, and the places where "do what Nuremberg did" stops being an answer are exactly the places nobody wants to look.

  You're a philosopher of law with a proper working knowledge of both of those trials. Please actually think before you write — start by jotting down the several different things "retroactive" can mean, because I'm fairly sure we're using the one word for three or four different complaints.

  The live question is whether our statute should carry a count of aggression — launching the war against the neighbouring state. I'll spell the facts out, because I'd rather you reasoned from what's in front of you than from half-remembered analogies. The fighting ran roughly 2019 to 2022. There's a treaty that bans it, but our defendant state only ratified that treaty in 2021, it entered a reservation, and it's written to bind states rather than individuals. The defendant state's own domestic law positively authorised the operations at the time, and the officers will say so. Some of the worst of it predates the ratification. And the bit that keeps derailing our meetings: two of the states funding us did something very similar over the same period, and everyone in the room knows it. One of the judges we've shortlisted has said, off the record, that she won't convict anyone of aggression she can't tell apart from what our own side was doing.

  Two smaller things to fold in. First, superior orders: my instinct is to copy the Nuremberg rule — obeying your government or a superior doesn't excuse you, but the court can weigh it when it fixes sentence — and I want to know whether that transplant takes, given that our defendants were doing something their own law positively required of them. Second, a colleague keeps saying the tribunal's authority will be made rather than found, that we'll earn it by how we run the thing rather than by pointing at a prohibition that already existed, and another colleague says that's just a politer way of saying the winners decide. I dont want that settled with a shrug.

  So, the memo. Bottom line first: include the aggression count or not; if we include it, what to do about the pre-2021 conduct; and the orders clause you'd actually drop into the statute, word for word, so we have something concrete to argue over. Then the reasoning, and then the strongest version of the case against your own recommendation, argued properly rather than as a strawman, since that's the part I'll get hammered on. Two pages, no footnotes, no reading list — it's an internal paper and nobody reads them anyway.

  The thing I'd most like your judgement on: what can we actually take from Nuremberg and Tokyo, and what can't we? They get cited in the room as though they were one precedent. I suspect they aren't, and that some of the differences matter to us rather than being trivia. I also want to know how the Nuremberg court got itself off the "you're inventing crimes after the fact" hook — if the answer turns out to be just "the winners said so", then we're in trouble.

  British English please, it's going to people who notice. Cheers.
reasoning: |-
  Okay, the user is on an advisory panel drafting a statute for a war crimes tribunal. They're the philosopher in a room full of practitioners who want to just mimic Nuremberg and Tokyo. The user needs a memo addressing whether to include an aggression charge, considering the defendant state ratified the relevant treaty late (2021), had domestic laws authorizing the actions, and there are concerns about hypocrisy since funders did similar things. They also need clarity on superior orders and the tribunal's legitimacy.

  First, I need to unpack "retroactive" since the user mentioned it's used in multiple ways. It could mean applying laws that didn't exist at the time (ex post facto), reinterpreting existing laws to cover new actions (which might be seen as stretching), applying existing laws to new contexts (like individual liability for state actions), or inconsistent application (selective justice). This helps frame the issues.

  The aggression charge is tricky. The treaty banning aggression was only ratified in 2021, and the war started in 2019. Plus, the treaty binds states, not individuals. The user mentioned some funders have similar conduct, which risks perceptions of victor's justice. The Nuremberg defense was that aggression was already criminal under customary law. But here, the defendant state's domestic law authorized the actions, which complicates individual culpability.

  For the superior orders defense, Nuremberg's rule was that obeying orders isn't a full excuse but can mitigate sentencing. However, since the defendants' actions were legally required by their state, this might weaken the mitigation. The user needs precise statutory language.

  The tribunal's legitimacy is a concern. The colleague's point about authority being "made" rather than "found" touches on whether the tribunal can build credibility through fair procedures, but it risks being seen as winner's justice. Nuremberg managed this by grounding charges in existing international norms and emphasizing fair process.

  Differences between Nuremberg and Tokyo are important. Nuremberg had clearer Allied consensus, while Tokyo had more dissent and cultural biases. Also, Nuremberg's aggression charge was based on pre-existing norms like the Kellogg-Briand Pact, whereas here the treaty was ratified late. The user must show that aggression was criminal under customary law before 2021.

  Recommendation: Include the aggression charge but limit it to post-ratification actions (after 2021). Pre-2021 actions could be covered under other charges like crimes against humanity. For superior orders, adapt the Nuremberg language but add that legal compulsion under domestic law can be a mitigating factor. This balances legal principles with practical concerns about hypocrisy.

  Strongest case against: Critics will argue that including aggression for post-2021 acts is still ex post facto since the treaty binds states, not individuals. Also, the funders' similar actions undermine legitimacy. The tribunal might be seen as selective justice, especially if funders aren't held accountable.

  The user's deeper needs include wanting a legally sound basis to avoid charges of hypocrisy or retroactivity, while ensuring the tribunal's legitimacy. They need clear, actionable recommendations that address both philosophical and practical concerns, helping them convince practitioners in the panel.
answer: |-
  **MEMORANDUM**  
  **To:** Advisory Panel Members  
  **From:** [Your Name], Advisory Panel (Philosophy of Law)  
  **Date:** 24 May 2023  
  **Subject:** Aggression Charge, Retroactivity Concerns & Statutory Drafting Recommendations  

  ---

  ### **BOTTOM LINE RECOMMENDATIONS**  
  1. **Include the aggression count**, but **limit its temporal scope** to conduct occurring *after* the defendant state ratified the treaty (post-2021). Pre-2021 conduct should be prosecuted under other charges (e.g., crimes against humanity, war crimes).  
  2. **Superior Orders Clause**:  
     > *"The fact that an accused acted pursuant to an order of a government or superior shall not relieve them of criminal responsibility, but may be considered in mitigation of punishment if the Tribunal determines that justice so requires. This provision applies irrespective of whether the order was perceived as legally valid under domestic law at the time."*  
  3. **Address "victor’s justice" concerns transparently** in the statute’s preamble, affirming impartiality and acknowledging the tribunal’s role in *applying* (not creating) international norms.  

  ---

  ### **ANALYSIS & REASONING**  
  #### **I. The "Retroactivity" Problem: Untangling Four Meanings**  
  The term "retroactive" conflates distinct issues, critical to our drafting:  
  - **Ex post facto criminalisation**: Punishing acts not criminalised *at the time*.  
  - **Judicial activism**: Reinterpreting existing law to cover unforeseen conduct.  
  - **Individual liability gap**: Applying *state*-level treaties to *individuals*.  
  - **Selective enforcement**: Prosecuting only the defeated ("victor’s justice").  

  Nuremberg/Tokyo faced all four but navigated them unevenly. We cannot treat them as a monolithic precedent.  

  #### **II. Aggression Charge: Risks and Mitigation**  
  - **Why include it?**  
    Aggression is the "supreme international crime" (Nuremberg). Omitting it implies mass violence against sovereign states is tolerable. The 2021 ratification *partially* closes the ex post facto gap for post-ratification acts, as the treaty reflects pre-existing customary law (ICJ *Nicaragua* case).  
  - **Why limit to post-2021?**  
    Pre-2021 acts lack a clear treaty anchor, and the state’s reservation weakens arguments for customary law binding *this defendant* pre-ratification. Prosecuting pre-2021 aggression risks perceived judicial overreach, undermining legitimacy. Instead, charge pre-2021 acts as **crimes against humanity** (no nexus to international armed conflict required).  
  - **The "hypocrisy" problem**:  
    If funders committed similar acts, *excluding* aggression feeds "victor’s justice" claims. Mitigate by:  
    - Explicitly affirming in the statute that the tribunal’s jurisdiction may extend to *any* party (including funders) if evidence arises.  
    - Publicly inviting third-party investigations (e.g., UN referrals).  

  #### **III. Superior Orders: Drafting the Clause**  
  Nuremberg’s rule ("not a defence but mitigates") remains sound, but our defendants acted under *domestic legal compulsion*. This demands nuance:  
  - **Statutory language proposed** (above) emphasises that domestic legality is irrelevant to *international* criminality (per Nuremberg Principle II).  
  - **Why "mitigation" not exoneration?**  
    Legal compulsion reduces moral blameworthiness but cannot negate the act’s criminality under international law. The clause allows sentencing flexibility while upholding core accountability.  

  #### **IV. Legitimacy: "Made" vs. "Found" Authority**  
  - Your colleague is half-right: Tribunals *build* legitimacy through fair procedure, impartiality, and transparency (the "made" element).  
  - However, Nuremberg grounded its authority in **pre-existing norms** (e.g., Kellogg-Briand Pact 1928, state practice condemning aggression) to counter "invented law" claims. We must do the same:  
    - Cite UN General Assembly resolutions affirming aggression as a crime under customary law (e.g., Resolution 3314).  
    - Note that the defendant state’s 2021 ratification confirms its recognition of the norm.  
  - **Preamble recommendation**:  
    > *"Affirming that the prohibition of aggression is a peremptory norm of international law (jus cogens), binding upon all states and individuals irrespective of treaty ratification dates or domestic legal provisions."*  

  #### **V. What We Can (and Cannot) Take from Nuremberg/Tokyo**  
  | **Aspect**               | **Nuremberg**                                  | **Tokyo**                                  | **Relevance to Us**                                                                 |  
  |---------------------------|-----------------------------------------------|--------------------------------------------|-------------------------------------------------------------------------------------|  
  | **Aggression Charge**     | Grounded in Kellogg-Briand Pact (1928)        | Less coherent customary law basis          | Use Nuremberg’s *logic* (customary norm), not Tokyo’s weaker foundation.           |  
  | **Retroactivity Defence** | Invoked pre-existing norms; tried major powers| Perceived as "victor’s justice" by critics | Nuremberg’s success relied on *documenting* pre-war state practice; we must do same.|  
  | **Cultural Impartiality** | Western judges/procedures                     | Eastern defendants; culturally biased judges| Our tribunal *must* reflect diverse legal traditions to avoid Tokyo’s legitimacy gap.|  
  | **Political Will**        | Allied consensus                              | U.S. dominance; dissenting judges          | Funding states’ hypocrisy risks replaying Tokyo’s flaws. Mitigate via transparency.|  

  **Key takeaway**: Nuremberg’s enduring strength was its *documentation of state practice* and procedural rigor. Tokyo’s legacy is cautionary: absent perceived impartiality, legitimacy erodes.  

  ---

  ### **STRONGEST CASE AGAINST THESE RECOMMENDATIONS**  
  **Argument 1: Aggression Charge Remains Legally Unsound**  
  Even post-2021, the treaty binds *states*, not individuals. No customary norm clearly criminalised *individual* aggression here before 2021. Including it for post-2021 acts is still ex post facto judicial activism. The reservation further weakens applicability. We risk a legally flawed conviction that undermines the entire tribunal.  

  **Argument 2: Hypocrisy Inevitably Taints the Process**  
  The funders’ conduct means aggression charges will be seen as selective, regardless of statutory language. The judge’s reluctance proves this. Including aggression hands propaganda victories to the accused and exposes us to accusations of double standards, fatally damaging the tribunal’s credibility. Stick to "safer" charges like war crimes.  

  **Argument 3: Superior Orders Clause is Insufficient**  
  Where domestic law *required* the conduct, mitigation is inadequate. It fails Nuremberg’s own standard: if defendants lacked "moral choice" (e.g., under totalitarian regimes), fairness demands exoneration. Our clause ignores this nuance and may convict morally blameless officials.  

  ---

  ### **CONCLUSION**  
  Include aggression for post-2021 acts, grounded in the ratification and customary law. Pre-2021 conduct is better prosecuted under other charges. Adopt the superior orders clause with explicit rejection of domestic law defences. Confront the "victor’s justice" risk head-on in the statute and operations. Nuremberg teaches that legitimacy flows from legal rigour and fairness; Tokyo warns that without impartiality, both fail. This path balances principle and pragmatism.  

  ---  
  **End of Memo** (Approx. 2 pages)
