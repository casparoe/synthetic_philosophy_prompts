  Okay, the user is a graduate student grappling with Keynes's concept of "weight of an argument" in his Treatise on Probability. They seem comfortable with the formal apparatus but are struggling to maintain a clear understanding of how weight differs from probability. Their paraphrased summary suggests they grasp the basic distinction: probability measures the balance of evidence, while weight concerns the absolute amount of relevant evidence.  

  The student raises several sharp questions: whether weight is quantitative or qualitative, how to compare weights across unrelated arguments, what weight adds to probability judgments, and whether Keynes's claim about redundant evidence increasing weight is coherent. They also want to know where the distinction might collapse into more familiar concepts (like sample size or reliability) and what philosophical commitments make this distinction non-trivial.  

  Keynes's text is notoriously dense, so I need to be precise about what's explicit versus interpretive. The student wants textual fidelity, not later interpretations. They're clearly doing close reading and suspecting that weight isn't just "more evidence = better" repackaged.  

  Keynes explicitly states weight isn't measurable (Ch.6), so it's comparative, not quantitative. But he does call it a "property" of arguments, implying some structure. For unrelated evidence, weight comparison relies on Keynes's idea of the "absolute amount" of relevant knowledge—a vague but textually grounded notion.  

  The redundant evidence point is tricky but central. Keynes argues that adding evidence already implied by background knowledge increases weight without altering probability because it increases "completeness." This assumes evidence is propositional and that background knowledge has latent implications—distinct from modern Bayesian views where redundant evidence doesn't update beliefs.  

  Where the distinction threatens to collapse: weight could be misread as just sample size or reliability, but Keynes resists this. For him, weight is about the proportion of relevant evidence *considered*, not sample size per se. A large biased sample might have high weight but low reliability—Keynes separates these.  

  The distinction only works if probability is "logical" (degree of rational belief given premises), not subjective or frequentist. In subjective frameworks, more evidence *does* change probabilities via updating. Keynes needs probability to be static relative to fixed premises.  

  I'll flag which claims are reconstructions (e.g., how weight functions practically) versus textual (e.g., weight as comparative, the redundant evidence example). The student needs to see where Keynes's framework pulls against modern assumptions to appreciate why weight feels elusive.  

  They're clearly a careful reader—their skepticism about "redescribing more evidence is better" is spot-on. I'll emphasize that weight's value lies in tracking epistemic security beyond likelihood, which requires Keynes's non-Bayesian, logicist view of probability.
answer: |-
  Let's walk through Keynes's distinction step-by-step, anchored in Chapters 3, 6, and 26 of the *Treatise*, addressing your specific concerns. Keynes's core formulation is:

  > **Probability**: "The degree of rational belief" in a proposition *h* given evidence *a* (written *h/a*). It measures the *balance* or *ratio* of favourable to unfavourable evidence within the known relevant evidence.  
  > **Weight**: "The absolute amount of relevant knowledge" supporting that probability. It measures the *completeness* or *extent* of the evidence considered, relative to the total potentially relevant evidence.

  ### 1. **Is Weight Quantitative or Merely Comparative? (Textual Commitment)**
     Keynes explicitly **rejects weight as a measurable quantity** (Ch. 6, p. 77-78):
     > "As the relevant evidence at our disposal increases, the magnitude of the probability of the argument may either decrease or increase, according as the new knowledge strengthens the unfavourable or the favourable evidence; but *something* seems to have increased in either case,—we have a more substantial basis upon which to rest our conclusion. I express this by saying that an accession of new evidence increases the *weight* of an argument. New evidence will sometimes decrease the probability of an argument, but it will always increase its 'weight'."
     - **Units?** None. Weight is **inherently comparative and qualitative**. We can say Argument A has *greater weight* than Argument B relative to the same conclusion, or that adding evidence *increases* the weight of an argument. There is no cardinal scale.
     - **Comparing Unrelated Arguments?** Keynes is ambiguous here. He suggests weight depends on "the absolute amount of relevant evidence" (Ch. 6, p. 78), implying we might *compare* the sheer "amount" across arguments, but he provides no method. In practice, he focuses on weight comparisons for the *same conclusion under different evidence sets* or *incremental additions* to evidence. *(Reconstruction: Cross-argument weight comparisons likely rely on intuitive judgements about the "completeness" of each evidence set relative to its own potential totality, but this is underdeveloped in the text).*

  ### 2. **What Does Weight Add to Probability? (Textual Commitment & Reconstruction)**
     Knowing the weight tells you **how much confidence to place in the probability *itself***, not the truth of the conclusion. Think of it as **epistemic security**:
     - **Low Weight (Sparse Evidence):** The probability (e.g., 0.7) is a fragile estimate. Small additions of relevant evidence could drastically change it (up or down). The conclusion is weakly grounded, even if the probability appears high.
     - **High Weight (Abundant Evidence):** The probability (e.g., 0.7) is a robust estimate. Substantial new evidence would be needed to shift it significantly. The conclusion is more securely grounded.
     - **Keynes's Analogy (Ch. 6):** Probability is like the *balance* on a pair of scales; Weight is like the *total weight* on the scales. A slight imbalance (probability ≠ 0.5) with a huge total weight (high weight) is more significant/stable than the same slight imbalance with feathers on the scales (low weight).

  ### 3. **The Redundant Evidence Puzzle: Coherence & Commitment**
     Keynes's claim (Ch. 6, p. 78 & Ch. 26, p. 346-348) is explicit and central:
     > "The weight cannot ... be explained in terms of probability. If new evidence is *relevant* but *wholly contained* in our previous evidence, it must leave the probability unchanged, but it will increase the weight."
     - **Example:** You know *a*: "This die is fair." You learn *b*: "This die was manufactured by a reputable company adhering strictly to fair die standards." *b* is logically implied by *a* (if it's fair, its manufacture must ensure fairness). Adding *b* to *a* gives no *new* information affecting the probability of rolling a 6 (still 1/6). Yet, Keynes argues, the *weight* of the argument for rolling a 6 increases.
     - **Coherence?** This **depends critically on Keynes's view of evidence and logic:**
       - **Evidence is Propositional:** Knowledge consists of known propositions and their logical relationships.
       - **"Contained in" means Logical Implication:** *b* is implied by *a* (or by background knowledge). Adding it makes the *explicit* evidence set larger, even if it adds no *new* logical constraint.
       - **Why Increase Weight?** Keynes links weight to the *explicit enumeration* of relevant knowledge. Adding a redundant proposition makes the premises more *complete* or *exhaustive* in explicitly stating what was only implicit. It increases the "sum" of known relevant propositions, even if the logical content is unchanged.
       - **Why Unfashionable?** Modern probability (especially Bayesianism) typically sees redundant evidence as *irrelevant* – it doesn't change beliefs *or* any measure of evidential support. Keynes's view requires a specific, logicist conception where the *explicit logical basis* matters independently of its inferential content.

  ### 4. **Where the Distinction Threatens to Collapse (Critical Reconstruction)**
     A careful reader should resist the conflation of weight with:
     - **Sheer Sample Size (Statistical Evidence):** While a larger sample often increases weight, Keynesian weight is broader. Adding *any* relevant evidence (e.g., theoretical understanding, causal mechanisms, different *types* of data) increases weight, even if the sample size remains fixed. Conversely, adding *irrelevant* data (no matter how voluminous) does *not* increase weight (Ch. 6, p. 79). Weight is about *relevant* evidence, not data volume.
     - **Reliability/Source Credibility:** Keynes separates weight from the *quality* of the evidence source. Low-reliability evidence (e.g., a dubious witness) might be highly relevant and thus increase weight, but it could *decrease* the probability (if the testimony is unfavourable) or leave it unstable. Weight tracks *how much* relevant evidence you have, not *how good* it is intrinsically. Good and bad evidence both add weight.
     - **Vagueness/Indeterminacy:** Weight is distinct from cases where the probability is indeterminate or only partially ordered due to insufficient comparability. Weight applies even when a precise probability exists.

  ### 5. **What Makes the Distinction Genuine (Textual Commitment & Reconstruction)**
     The distinction does **real work** only if:
      1.  **Probability is Logical/Objective:** Keynes's probability is a *logical relation* (like partial entailment) between propositions *h* and *a*, fixed once *a* and *h* are specified. It's not a subjective degree of belief (which constantly updates) or a long-run frequency.
      2.  **Evidence is Incremental & Propositional:** Evidence comes in discrete, relevant propositions that can be added to the premise set *a*, altering the logical relation *h/a* (probability) and/or the completeness of *a* (weight).
      3.  **Rational Action Depends on Both:** Keynes suggests (Ch. 26) that rational decisions under uncertainty consider *both* probability *and* weight. High probability with low weight might warrant caution (e.g., postponing a decision to seek more evidence), while moderate probability with high weight might warrant action. This is distinct from simply preferring "more evidence is better."

  ### Key Textual Passages for Your Scrutiny
  -   **Definition of Probability:** Ch. 1 (p. 3-4), Ch. 3.
  -   **Definition & Properties of Weight:** Ch. 6 (p. 77-80) – *Crucial*.
  -   **Redundant Evidence & Weight:** Ch. 6 (p. 78), Ch. 26 (p. 346-348).
  -   **Weight & Decision Making:** Ch. 26 (p. 347-349).
  -   **Distinction from "Risk" (Vagueness):** Ch. 3 (p. 30), Ch. 6 (p. 79-80).

  **Conclusion:** Keynes's weight is a **comparative, qualitative property** measuring the *completeness* of the explicitly stated relevant evidence underlying a probability relation. It adds information about the *stability* and *epistemic grounding* of that probability. Its coherence relies on his **logicist view of probability** and **propositional theory of evidence**. The distinction collapses if probability is seen as dynamically updated belief (Bayesianism) or if evidence is viewed purely information-theoretically (where redundancy doesn't add support). The claim about redundant evidence increasing weight is the most counterintuitive and uniquely Keynesian point, demanding close reading of Ch. 6 and 26 to see his justification based on the *explicit enumeration* of premises. Resist reading it as sample size or reliability; focus on the "absolute amount of relevant knowledge."
