answer: |-
  ### 1. What I take the dispute to be  
  The standoff is about the *metaphysical category* of know-how. Intellectualists (Stanley, Williamson) claim that knowing how to φ is identical to knowing a proposition (e.g., *that* w is a way to φ) under a practical mode of presentation. Anti-intellectualists (Ryle, Dreyfus) argue it’s a distinct, non-propositional capacity—a disposition to perform skillfully without internal representation of rules. Crucially, both sides accept each other’s data: intellectualists grant that skill often operates without conscious access to propositions; anti-intellectualists grant that know-how can sometimes be verbalized. The deadlock arises because intellectualists treat skills as *implementations* of propositional knowledge (with context-sensitive modes), while anti-intellectualists treat skills as *foundational* abilities that make propositional knowledge possible. The fight isn’t over cases but over what *grounds* skillful action: truth-apt mental states or embodied capacities.

  ### 2. Where the fault lines are  
  - **Verbal Dispute?** Superficially plausible—"knowledge" might be polysemous. But both sides explicitly engage the *same* concept (e.g., "What is *attributed* when we say 'X knows how to ride a bike?'"). They aren’t talking past each other; they’re offering competing accounts of a shared phenomenon. *Cop-out*.  
  - **Different Research Programs?** Partially true. Intellectualists focus on *semantics* ("What do 'know-how' ascriptions mean?"), anti-intellectualists on *phenomenology/psychology* ("How does skill *work*?"). Yet both claim explanatory primacy for their ontology. Stanley argues anti-intellectualism "fails to explain" know-how attributions; Dreyfus argues intellectualism "fails to explain" fluid coping. *Overlap sustains conflict*.  
  - **Different Data?** No—both cite chicken-sexers, grammar rules, and balance. But they *interpret* them oppositely: intellectualists see tacit propositions; anti-intellectualists see non-representational expertise. *Epistemic asymmetry*: each treats their interpretation as the null hypothesis.  
  - **Substantive but Hard?** Yes. The core divide is *ontological*: intellectualists require all knowledge to be truth-apt (propositional attitudes are the "only game in town"); anti-intellectualists demand irreducible capacities to avoid Ryle’s regress. Neither can assimilate the other’s framework without surrendering first principles. **This diagnosis survives**: it explains why granting cases doesn’t resolve anything—the disagreement is about the *nature of cognition itself*.

  ### 3. My hunch, tested  
  Your false-dilemma hypothesis is correct and illuminating. The tact case exposes the crack: it involves *normative guidance* (you "ought" to avoid certain phrasings; criticism is apt) but resists propositional codification (contextual sensitivity, no stable rules). Intellectualists must call this "knowledge of context-dependent facts"—but this stretches "proposition" beyond recognition. Anti-intellectualists must call it a "flexible disposition"—but this can’t explain the normative structure (why *this* phrasing was tactless). **Your case helps**: it demands a category like "implicit practical understanding"—neither brute ability nor fact-stating. You’re echoing Ryle’s "intelligent capacities" but pushing further: Ryle still framed these as dispositions, while tact requires *situated norm-apprehension* without rules. This isn’t reinvention; it’s exposing the dilemma’s inadequacy.

  ### 4. The verdict  
  This is a substantive disagreement rooted in incompatible metaphysical commitments about the mind: intellectualists tie cognition to representational content; anti-intellectualists anchor it in embodied action. The standoff persists because both frameworks are internally coherent but mutually irreducible—like debating whether a photon is a particle or wave using 19th-century concepts. Concessions on cases are superficial; the core axioms (propositionalism vs. embodiment) are non-negotiable without paradigm shifts.

  ### 5. What would move it  
  1. **Cognitive science dissociating tacit structure from propositions**: Evidence that skill implementation (e.g., in basal ganglia) uses information formats *incompatible* with truth-conditional semantics (e.g., stochastic motor schemata). *Why it helps*: Undermines intellectualism’s claim that all know-how reduces to propositional attitudes.  
  2. **A robust account of non-propositional normativity**: Explaining how agents grasp "what ought to be done" in skills like tact *without* truth-apt representations. *Why it helps*: Gives anti-intellectualists resources to answer "guidance" objections.  
  3. **Redescribing the tact case as paradigmatic**: Framing uncodifiable, context-sensitive know-how as the *default* (not the exception). *Why it helps*: Forces intellectualists to stretch "proposition" to breaking point or concede.  
  **Movement is possible but unlikely soon**—the dispute is hardened by disciplinary identities. Intellectualists won’t yield without a cognitive science revolution; anti-intellectualists won’t concede without a semantics for non-propositional knowledge attributions. Your tact case is a battering ram—but the walls are thick.
