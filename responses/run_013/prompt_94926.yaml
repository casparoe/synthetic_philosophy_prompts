prompt: |-
  You're an expert in philosophy of probability who's taught this material many times to non-specialists, so plan the session as someone who knows exactly where it goes wrong in the room.

  I'm a postdoc and next week it's my turn to run our reading group, which is mostly third- and fourth-year philosophy students plus two maths people who've done a real probability course, and one economist who keeps saying probabilities are just long-run frequencies. Seventy-five minutes, whiteboard, no measure theory assumed beyond uniform distribution on an interval. The topic I've been handed is the principle of indifference and Bertrand's paradox. Don't explain it to me — I know the material. Plan how I should explain it. Start by sketching a couple of candidate orderings of the pieces and saying which you'd throw out and why, then commit to one.

  What I want out of the session: they should leave thinking the interesting question isn't which of a third, a quarter, a half is the right answer to the chord problem, but that the phrase at random is doing all the work. And I want them to see that there are really two things called the principle of indifference — one that says spread your credence evenly over the possibilities you've listed, which is fine and unremarkable for a finite list, and one that says your credence function should be invariant under the symmetries of the problem, which is a much stronger demand and only means anything once you've said which transformations count. The punchline I'm after is that the second looks like it rescues the first but really just relocates the problem: now you owe me a justification for the choice of group, and I want them to feel that pinch themselves rather than hear me assert it. There's a well-known line of thought that the chord problem becomes well-posed once you demand invariance under rotations and translations of the plane, after which the answer is a half and the other two methods are simply wrong. Whether you think that's a fix or a swindle is a separate question; plan the session that gets them to the distinction and lets them push back on it.

  So what has to come first, second, third, and why those dependencies and not others — does the frequency-versus-credence business need settling before the paradox bites at all, or does it bite harder if I leave it till later? Then the one case I should build the whole session around. I'd been going to use the chord problem itself, but I'm now wondering wether that's a mistake, because it invites a which-method-is-natural argument that never resolves and eats the clock. Tell me whether to use it, or to make something else carry the weight, and what the carrying case has to have and has to lack to do that job. Then the misconceptions I should expect and exactly where in the sequence to head each one off. My guesses: they'll think the paradox shows probability is subjective; they'll think the resolution is just you have to specify the experiment, i.e. the frequentist point, and that that's the end of it; they'll think the invariance move settles it and a half is simply correct; and they'll never notice that a finite uniform list and a uniform interval are different animals, so the continuum needing a measure at all will go straight past them. Tell me what I've missed, especially the ones this particular audience will have that I won't predict. Then what I should deliberately not do at this level and should say out loud that I'm skipping — I'm thinking the maximum-entropy derivation, the general theory of invariant measures on groups, anything about countable additivity — and which of those cuts would actually break something downstream. Then one question to put to them in the last ten minutes that shows whether the distinction landed rather than whether they can recite it: something where a student who only half got it will answer confidently and wrongly. And if there's a short thing I can put on the board in the first two minutes that they'll still be looking at at the end, tell me what it is.

  Two constraints. First, I want to inject a couple of cases they definately haven't seen so they can't coast on whatever they half-remember. I'm planning to use the wine-and-water case — a glass of wine and water mixed, the wine-to-water ratio somewhere between a half and two, what's the probability it's at most one, which comes out a third or two thirds depending on which way round you take the ratio — and the cube case — a machine turning out cubes with edge lengths somewhere between nought and one, probability the edge is under a half: a half if you're indifferent in the edge, an eighth if you're indifferent in the volume, a quarter if you're indifferent in the face area. Work out where each belongs in the sequence and what each one does that the other doesn't, and tell me honestly whether using both is one too many. Second, write the whole thing as continuous prose. No headings, no numbered lists, no bullet points, no bold, no tables — just paragraphs, the way you'd write it to a colleague in an email. Don't hedge everything either; where you have a view about the best sequence, commit to it.
reasoning: |-
  Okay, I need to plan this philosophy of probability session on the principle of indifference and Bertrand's paradox for a mixed group. The postdoc wants students to grasp that "at random" is doing the heavy lifting and that there are two versions of the principle: one for finite cases and one for symmetry invariance. The key is to make them feel the pinch of justifying the choice of group.

  First, I'll start with a finite case to establish the unproblematic version of the principle. Something like assigning equal probability to three doors in the Monty Hall problem. This shows how spreading credence evenly works when possibilities are discrete and symmetric. Then I'll transition to continuous cases, where things get messy. The wine-water paradox might be better here than Bertrand's chord because it's simpler and avoids the geometric distractions. 

  For the wine-water case, if the ratio is between 1/2 and 2, what's P(ratio ≤1)? If you assume indifference over the ratio itself, you get 2/3. But if you take indifference over the inverse ratio, you get 1/3. This highlights that labeling matters. Then I'd bring in the cube example: edge length, volume, or surface area? Each gives different probabilities for P(edge < 0.5). This drives home that the choice of parameterization isn't neutral.

  After these, I'd introduce Bertrand's chord problem. By now, they should see it as another example of the same issue. The three methods (random endpoints, random midpoint, random radial distance) correspond to different symmetries. The invariance move—demanding rotation and translation invariance—fixes the probability at 1/2. But why prioritize those symmetries? The machine example already challenged that. An economics student might argue for frequentist interpretations, but that doesn't resolve the ambiguity in what "random" means.

  Misconceptions to watch for: thinking probability is subjective, or that specifying the experiment solves everything. The economist might push the frequentist view early, but I'd table that discussion until after showing the paradoxes bite regardless. When someone suggests invariance as the fix, I'd ask: "Why rotations and translations? What if the circle was on a sphere?" 

  I'll skip maximum entropy and measure theory, but mention that uniform distributions need specification. The key question for the last ten minutes: "Suppose we have a factory producing cubes with edge length between 0 and 1. We want P(volume < 0.125). If I tell you the cubes are produced 'randomly,' is that enough?" If they confidently choose 1/8, they've missed the point. 

  On the board, I'll keep: "Uniform over what?" from minute one. By the end, they'll see it's the crux. The wine-water and cube examples are both necessary—one shows labeling dependence, the other unit dependence—and Bertrand ties them to geometric symmetry. Seventy-five minutes is tight, but skipping the frequentist debate early saves time. The pinch is in owing a justification for the group, not in finding the "right" probability.
answer: |-
  Start by writing on the board: **"Uniform over *what*?"** Keep this visible throughout. It’s the anchor.  

  Begin with a finite case: three identical doors, one prize. Ask: "Probability the prize is behind door one?" They’ll say 1/3. This is the **unproblematic principle of indifference**: discrete, symmetric alternatives justify uniform credence. Note: "We all agree because ‘door-ness’ is the only relevant symmetry. No transformation of the setup preserves symmetry while changing labels. This is the first principle—spread credence evenly over *given* possibilities. It’s uncontroversial here."  

  Now shift to the continuum. Introduce the **wine-water paradox**. "A glass contains a mix of wine and water. The ratio of wine to water is between 1/2 and 2. What’s P(ratio ≤ 1)?"  
  - *First parameterization*: Uniform over ratio *r* (wine/water), so *r* ~ Unif[0.5, 2]. Then P(*r* ≤ 1) = (1 - 0.5)/(2 - 0.5) = 1/3.  
  - *Second parameterization*: Uniform over reciprocal ρ = water/wine, ρ ~ Unif[0.5, 2]. Then P(*r* ≤ 1) = P(ρ ≥ 1) = (2 - 1)/(2 - 0.5) = 2/3.  
  Point out: **"Same verbal setup, different answers. Why?"** The economist will interject: "Probabilities require an experiment—how is the mixture generated!" **Acknowledge but defer**: "We’ll return to frequentism, but first: does ‘at random’ specify *anything* here without naming the variable?" This exposes labeling dependence. The first principle fails because "possibilities" aren’t uniquely defined in continuous spaces.  

  Next, the **cube factory**. "Machines produce cubes with edge length *l* ∈ [0, 1]. What’s P(*l* < 0.5)?"  
  - Uniform over *l*: P = 0.5.  
  - Uniform over volume *v* = *l³*: *v* ~ Unif[0,1], so P(*l* < 0.5) = P(*v* < 0.125) = 0.125.  
  - Uniform over face area *a* = 6*l²*: P(*l* < 0.5) = P(*a* < 1.5) ≈ 0.25.  
  **Key move**: Ask, "Which is ‘natural’? Edge length? But what if the factory optimizes material cost? Area might be relevant!" The math students will see the Jacobian; philosophers will see epistemic ambiguity. Stress: **"This isn’t about experiments yet. It’s about what ‘uniform’ even means. Each choice implies a different symmetry."**  

  **Now Bertrand’s chord**. Draw a circle. "Chord ‘at random’. P(length > √3)?"  
  - *Method 1 (endpoints)*: Fix a point, uniform over the circle for the other. P = 1/3.  
  - *Method 2 (midpoints)*: Uniform over radial distance of midpoint. P = 1/4.  
  - *Method 3 (angles)*: Uniform over chord orientation. P = 1/2.  
  **Crucially, do not debate which is ‘correct’.** Say: "Each method respects *a* symmetry: rotational (method 1), radial (method 2), angular (method 3). But none is privileged by the phrase ‘at random’." The economist will again demand an experiment. **Now engage it**: "Fine—suppose we spin a roulette wheel to choose endpoints. Then method 1 is ‘right’. But why that wheel? Why not one selecting midpoints?" The frequentist move **relocates, not resolves**, the problem: specifying an experiment *chooses* a symmetry group.  

  **Pinch point**: Introduce the **invariance principle**: "Your credence should be invariant under the problem’s symmetries." But symmetries of *what*? The circle’s geometry? The description? Demand: **"Justify your group."** For chords, if we demand invariance under *rotations and translations of the plane*, only method 3 (P=1/2) survives. **"Is this a fix? Or a swindle?"** Make them interrogate: Why those symmetries? What if the circle is painted on a sphere? On a warped surface? The invariance principle (second type) **presupposes a choice of structure**. It pushes the ambiguity upstream.  

  **Misconceptions to preempt**:  
  - *Probability is subjective?* (They’ll think this post-paradox): No—the issue is underdetermination, not subjectivity. Objectivity requires *shared* constraints.  
  - *"Specify the experiment" ends it*: But experiments embed symmetry choices (e.g., spinning vs. throwing darts). Frequentism avoids indifference but inherits its ambiguity.  
  - *Invariance settles it*: Rotational invariance feels intuitive, but why not scale-invariance? (Cube P(*l*<0.5) would then be 0 if we demand P(*l*<*c*)→0 as *c*→0, invalidating uniformity).  
  - *Missed distinction finite/continuous*: Stress: "Finite cases have countable symmetries; continua need measures. Uniformity isn’t defined without a metric."  

  **What to skip**: Maximum entropy (adds another layer), invariant measures (too technical), countable additivity (distracts). These won’t break the flow; the key is seeing that **symmetry demands justification**.  

  **Final 10-minute question**: "A factory makes square tiles with perimeter *p* ∈ [0, 1]. What’s P(area < 0.01)?"  
  - *Confidently wrong answer*: "Uniform over *p*, so area *a* = (*p*/4)², P(*a*<0.01) = P(*p*<0.4) = 0.4."  
  - *Why it’s wrong*: They’ll assume uniformity over perimeter. But should it be uniform over side length? Area? The student who half-got it will pick one parameterization. The point: **"Uniform over *what*?"** echoes the board.  

  **Why this sequence**:  
  Finite → wine/water (labeling dependence) → cube (unit dependence) → Bertrand (geometric symmetry). Each step escalates underdetermination. Bertrand comes late to avoid method-fights. Frequentist interruptions are harnessed: they show specification *is* symmetry choice.  

  **Injected cases**: Use both wine-water and cube. Wine-water is quick and exposes labeling; cube shows physical dimensions matter. Bertrand generalizes them geometrically. Not redundant—complementary.  

  **Last glance at the board**: **"Uniform over *what*?"** They’ll now see it as the question beneath the question. The pinch is felt: indifference’s two faces are cleaved—finite uniformity is harmless; symmetry-invariance demands a contested ontology of structure.  

  ---  

  **Time check**:  
  - 0-10 min: Finite case + wine-water  
  - 10-25 min: Cube factory  
  - 25-45 min: Bertrand’s methods (no resolution)  
  - 45-60 min: Invariance "fix" and its circularity  
  - 60-75 min: Tile question + wrap-up
