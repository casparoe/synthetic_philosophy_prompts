prompt: |-
  My friend Marcus has been building his own theory of karma for years. He's read a pile of Buddhist and Hindu stuff but keeps insisting its his own system, so don't answer me with what Buddhism says, answer me with what Marcus says. He's got three words he uses for it: a ledger, when he thinks someone is paying off a debt; a stream, when he thinks an action is just shaping what someone becomes; and a field, when he thinks some larger thing is carrying it.

  His verdicts so far, as best I can reconstruct them:

  - A guy who defrauded a widow and twenty years later dies broke and alone, having completely forgotten her. Marcus: karma, definitely. You don't have to remember a debt for it to be owed.
  - A surgeon who operated drunk and botched it, whose own son then died of an unrelated illness. Marcus: not karma. The son didn't do anything, and you can't pay someone else's debt with your kid. Just a tragedy.
  - A soldier who took part in a massacre because he was ordered to, who was sick about it for the rest of his life and was never punished by anyone. Marcus: karma, and it's still running.
  - A village where every household dumps a little waste and the river downstream turns undrinkable. Marcus: not karma. Nobody decided anything, it just happened. His line is that there's no karma without a chooser.
  - A mob that drags a man out of his house and kills him. Marcus: karma, a lot of it, and he gets annoyed when people say they only did their bit — he says it doesn't get discharged by everyone shrugging.

  The one I actually want to ask him about is a drug company. Board, written policies, an explicit decision to keep selling a painkiller after they knew it was killing people, thirty years of it. No single employee ever intended a death — each one did a small lawful job, and plenty of them privately thought it was wrong. Then the company folds and its people scatter. Does Marcus say there's karma there?

  So: what's his verdict, what rule is he actually running, what other rules fit everything above just as well, and which rule do I have to adopt to get each verdict? Which of his earlier cases is the closest analog, the mob or the village? And what's the one further case that would tell the rules apart — I'm much less interested in the verdict than in the machinery, and if his record genuinely underdetermines this, tell me what principle he'd be signing up for with each answer.
reasoning: |-
  Okay, let me start by unpacking Marcus's karma theory based on the examples provided. He uses three metaphors: ledger, stream, and field. The ledger seems to deal with debts that need paying, regardless of memory. The stream is about how actions shape a person's character. The field involves a larger force carrying karma, but Marcus only applies karma when there's a chooser.

  Looking at the cases: the fraudster who died broke is karma (ledger). The surgeon's son dying isn't karma because the son didn't incur the debt. The soldier feeling guilt is karma (stream). The village pollution isn't karma because no one chose to pollute. The mob killing is karma, and he rejects the idea that individual small actions discharge responsibility.

  Now, the drug company case. The board made a policy decision, employees followed orders without intending harm. The company folds, people scatter. The key question is whether there's a "chooser" here. The board as a collective made a decision, so maybe that qualifies as a chooser. But each employee didn't intend harm, similar to the mob where individuals claimed they only did a small part. Marcus rejected that in the mob case, so maybe the company's karma falls on the collective. But the company no longer exists, so who bears the karma? The individuals who were part of the decision-making? Or is it that the stream applies, shaping the individuals involved even if they didn't intend harm?

  The closest analog is the mob case, where collective action incurs karma. However, in the mob, each member actively participated in the killing. In the company, employees might have been detached from the outcome. But the board explicitly decided to keep selling, so they're the choosers. The employees who followed policies without intent might not have karma, but Marcus might argue that by participating, they're part of the stream, becoming the kind of people who enable harm.

  Further cases to distinguish: What if a CEO orders harm but feels guilty (like the soldier)? Or if a company has a harmful policy but no single decision-maker (like the village)? That would clarify if intent or structure matters more.
answer: |-
  Based on Marcus's established patterns and principles—derived strictly from his prior verdicts—here's how he would analyze the drug company case, the underlying rules, ambiguities, and how to test his logic further. Nothing here assumes Buddhist/Hindu doctrine; it's reverse-engineered from *his* judgments.

  ### Marcus's Likely Verdict on the Drug Company
  **"Karma, absolutely—mostly ledger, but stream too. The board signed the checks."**  
  - **Why?** The board made an *explicit, conscious decision* to prioritize profit over lives after knowing the risks. They are the "choosers" (like the mob members), even if no single employee intended harm. The ledger incurs a debt for the deaths, and the stream shapes the moral decay of those involved. The company folding doesn't discharge the karma—it might even compound it (like the soldier's unpunished guilt).  
  - **Closest Analog: The Mob.** Both involve collective action with a clear harmful outcome, individual participants hiding behind "just following orders/doing my job," and Marcus rejecting diffuse responsibility.  

  ### The Rules Marcus is Actually Running
  From all cases, Marcus operates on three core principles:  
  1. **The Chooser Principle:** Karma requires *conscious agency*. No choice = no karma (e.g., the village's passive pollution).  
  2. **The Non-Transfer Principle:** Karma sticks to the agent(s). You can't incur debt *for* others, nor can others pay *your* debt (e.g., the surgeon's son—innocent, unrelated).  
  3. **The Binding Principle:**  
     - *Ledger:* Debt exists regardless of memory/accounting (fraudster forgot, but paid).  
     - *Stream:* Unresolved guilt or complicity *is* ongoing karma (soldier's torment).  
     - *Field?* Marcus hasn't used it in your examples—likely reserved for impersonal forces (e.g., "societal karma"), but he prioritizes individual/collective choice.  

  ### Alternative Rules That Fit the Same Data (Ambiguities)
  Marcus's system isn't fully defined—two competing interpretations could explain all prior cases equally well:  
  - **Interpretation A (Strict Intent):** Karma requires *personal intent to harm*. Explains the surgeon (accident), soldier (remorse implies intent), mob (intent to kill), fraudster (intent to deceive).  
    - *Drug Company Verdict Under A:* **Not karma.** Employees lacked intent; the board *might* have intended profit, not death (arguably indirect).  
  - **Interpretation B (Collective Foresight):** Karma applies if harmful outcomes were *foreseeable and chosen* by agents. Explains the mob (foreseeable death), fraudster (foreseeable harm), soldier (foreseeable massacre), surgeon (foreseeable risk, but son's death *un*foreseeable).  
    - *Drug Company Verdict Under B:* **Karma.** Board foresaw deaths and chose to act.  

  Marcus's mob verdict ("doesn't get discharged by everyone shrugging") leans toward **B**, but his surgeon verdict (focus on intent, not negligence) leans toward **A**. The drug company case *exposes this tension*.  

  ### Key Test Case to Resolve the Ambiguity
  **Present Marcus with this:**  
  > *A factory manager follows corporate orders to cut costs, disabling a safety feature he knows might fail. It fails, killing a worker. The manager feels guilty but isn’t punished. The worker’s orphaned child later dies in an unrelated accident.*  

  - **If Marcus says:**  
    - *Manager’s guilt is karma (stream), child’s death isn’t:* He’s running **Interpretation B (Foresight)**. The manager *chose* a foreseeable risk, so karma applies to him—but the child’s death is unrelated/transferred.  
    - *Neither is karma:* He’s running **Interpretation A (Strict Intent)**. The manager didn’t *intend* harm, just followed orders.  
    - *Both are karma:* He’s contradicting his surgeon verdict (non-transfer principle).  

  ### How to Get Each Prior Verdict
  - **Fraudster dies broke:** Adopt *Ledger + Chooser*. Debt must be paid by the agent, regardless of memory.  
  - **Surgeon’s son dies:** Adopt *Non-Transfer + Chooser*. The surgeon’s accident was his karma (if any), but the son was not an agent.  
  - **Soldier’s guilt:** Adopt *Stream + Chooser*. His remorse *is* the ongoing karma of his choice.  
  - **Village pollution:** Adopt *No Chooser = No Karma*. No one decided to poison the river.  
  - **Mob killing:** Adopt *Collective Agency + Binding Principle*. No diffusion of responsibility; karma sticks to all choosers.  

  ### Final Note on the Drug Company
  Marcus would likely argue the board embodies the "chooser" (like the mob's collective intent), and employees who *knowingly participated* (despite private doubts) are in the stream—becoming people who enable evil. But if he wavers, press him on the **test case above**. His machinery depends on whether karma requires *active malice* or *conscious complicity in foreseeable harm*—and the drug company sits precisely in that crack.  

  If he calls it karma, he’s prioritizing *foreseeable harm*; if not, he’s demanding *provable intent*. Either way, you’ve nailed his rule.
