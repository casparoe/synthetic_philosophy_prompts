prompt: |-
  I am presenting at a joint session of an economics department's theory group and a philosophy department's practical-reason reading group. My paper defends a deliberately narrow claim: money-pump arguments against cyclic preferences establish something about an agent's decision architecture, not about the cyclic ordering itself. I distinguish the moment-by-moment chooser from what I call the plan-follower — an agent who can select a whole bundle of options in a single act and then execute the parts — and argue that a plan-follower with a strict preference cycle is not pumped. So the argument needs the premise that costless commitment is unavailable; but that is precisely the premise the same literature is happy to deny when it idealises agents elsewhere. Hence the pump proves less than its proponents suppose, and the parallel usually drawn to diachronic Dutch-book arguments for conditionalisation is correspondingly weaker. I call the gap between what the pump shows about a moment-by-moment chooser and what it shows about a plan-follower the binding gap, and I claim it is not a technicality.

  The audience: four or five revealed-preference and behavioural-welfare economists, who treat preferences as whatever choice reveals and will hear "plan-follower" as a euphemism for an agent whose preferences are unusable; two Bratman-style philosophers of action, who think intention and planning are the central phenomena and will say the plan-follower is doing all my work while the interesting case is the agent who revises her plans mid-sequence; one formal decision theorist who knows the pump literature cold and will press the sure-loss line; and one Bayesian who will ask whether I have not simply reinvented the difference between synchronic and diachronic Dutch books, to my cost.

  Draft my Q&A prep sheet. Give me the objections this audience will actually raise, in their own vocabulary and roughly in the order they will come, ordered by how much damage they would do; for each, what I should concede, a reply I can deliver in ninety seconds, and where that reply is soft. Include the question I am hoping nobody asks. Do not give me citations or reading lists — I know the literature; I need what to say back.

  Return it as a single JSON object with exactly these fields:

  - "thesis_in_one_sentence": string.
  - "audience_factions": array of objects with "name" (e.g. "revealed-preference economists"), "what_they_care_about", and "how_they_phrase_objections" (a short sample of their idiom).
  - "objections": array of objects, sorted by descending damage, each with "rank" (integer, 1 = most damaging), "objection" (verbatim as this audience would put it), "source_faction" (which faction raises it), "likelihood" ("high"/"medium"/"low"), "damage" ("high"/"medium"/"low"), "concede" (what to grant immediately), "reply" (at most ~150 words, speakable in ninety seconds), "soft_spot" (where the reply is weakest, stated plainly).
  - "concede_up_front": array of strings — what to give away in my opening remarks to defuse the worst of it.
  - "hold_firm_on": array of strings — the two or three claims I must not surrender.
  - "hoped_nobody_asks": object with "objection", "source_faction", "why_it_hurts", "pre_emptive_move".
  - "one_reply_that_must_land": string — the single reply the paper cannot survive without.
reasoning: |-
  Hmm, the user wants me to create a Q&A prep sheet for their academic presentation. They're presenting to a joint session of economists and philosophers about cyclic preferences and money-pump arguments. Their key thesis is that these arguments reveal something about decision architecture rather than the preferences themselves, and they've introduced this concept of a "plan-follower" who avoids being pumped by selecting whole bundles at once.

  I need to understand their audience factions clearly. There are revealed-preference economists who see preferences as whatever choices reveal and might dismiss "plan-follower" as unusable preferences. Bratman-style philosophers focus on intention and planning, and will likely argue that the interesting case is plan revision during execution. There's a formal decision theorist who knows money-pump arguments thoroughly and will emphasize the sure-loss aspect. And a Bayesian who might connect this to synchronic vs. diachronic Dutch books.

  For the objections section, I need to prioritize by damage potential. The most damaging would likely come from the revealed-preference economists, objecting that "plan-follower" is just circular reasoning - that's high likelihood and high damage. My reply should concede that their view is standard but argue that the architecture distinction remains valid. The soft spot is that the economists might not accept any notion of preferences beyond choices.

  Next, the Bratman philosophers might point out that real agents revise plans mid-sequence. I should concede this happens but maintain that the plan-follower shows pumping isn't inevitable. The soft spot is that their focus on revision might sideline my core argument.

  The formal decision theorist will press the sure-loss line - that cyclic preferences guarantee exploitation. I need to concede that moment-by-moment agents get pumped while arguing that plan-followers avoid this through bundling. The soft spot is that commitment devices might not always be available.

  The Bayesian's objection about synchronic/diachronic Dutch books could be damaging if it undermines my novelty. I should concede the parallel but stress that the binding gap (the core concept) is distinct and important. Soft spot is that I might be reinventing existing ideas.

  For concessions upfront, I should acknowledge that cyclic preferences are problematic in standard frameworks and that the plan-follower is an idealization. But I must hold firm on the binding gap concept and that the pump's target is architecture, not preferences.

  The question I hope nobody asks is whether the binding gap is just about commitment devices, which would trivialize my argument. My pre-emptive move should be to explicitly deny this in my presentation.

  The most crucial reply is to the revealed-preference objection about the plan-follower concept - if I can't defend this, my whole argument collapses. I need a strong response that distinguishes architecture from preference while acknowledging their viewpoint.

  I'll structure this as a JSON object with all these components, using the exact fields requested. The objections should be ordered by descending damage, with careful attention to how each faction phrases their concerns. I'll keep replies concise for the 90-second limit and be honest about soft spots.
