prompt: |-
  Okay, weird situation. I got into it with my brother-in-law over Thanksgiving, he called me dogmatic, and I heard myself say "well I know it's true, so anything you show me against it has to be wrong or misleading" -- he just stared at me. Turns out that move has a name and a literature, and I've been voluntold to run a session on it for my reading group: five people, no philosophers, one retired nurse who's sharper than all of us.

  Don't explain it to me, plan the session. What has to be in place before it even reads as a paradox -- I'm guessing knowledge has to be factive, and they have to already accept that evidence can be misleading without being false; is that the right order, and what am I missing? What one example carries the whole thing, and what does it need -- does it have to be a case where I genuinely know, or is it more honest to use one where I only think I know? Where will they go wrong and when do I head each one off -- I predict they'll hear "so dogmatism is rational," or file it under confirmation bias, or call it a fallacy rather than a paradox. What do I openly leave out at this level? And give me one closing question that shows whether it landed.

  Also, since I will get in over my head: sort what's actually settled (the shape of the argument, what it does and doesn't assume) from what's genuinely contested among people who work on this, and dont sell me a contested reading as the consensus. American English, and no reading list -- I'm not assigning anything.
