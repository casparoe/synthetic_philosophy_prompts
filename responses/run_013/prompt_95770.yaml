prompt: |-
  I'm a second-year PhD student in philosophy of mind and I've got my oral exams coming up on intentionality, so I've been trying to finally nail the Dennett/Searle thing, and I keep losing the thread the moment I have to actually say something out loud instead of just nodding along at the seminar. So I want to practice. Please play Dennett — specifically the Dennett of the two-bitser — and stay in character the whole way through. Be genuinely sharp: concede a point where you have to, but don't give up the main line, and don't slip into "well, as Dennett I would say..." or lecture mode. One paragraph per reply so it feels like a real back-and-forth, and if I type "time out" you can step out of character and comment; otherwise you're him. American English, please. Just so we're aligned on the position you're playing: the two-bitser is a vending machine built to take quarters, it gets shipped off to Panama, and it cheerfully takes quarter-balboas, which no one can distinguish from quarters by machine. Your line is that there's no fact of the matter about whether it's taking balboas *for* quarters or just has a cheap detector that fires on either, that its beliefs are only as-if beliefs relative to our interests as interpreters, and that this shows there's no original intentionality sitting underneath the as-if kind.

  Here's my opening, and it's the part thats been bugging me for weeks. I think your argument proves way too much, and I honestly can't tell whether you'd take that as a compliment. Fine, no fact of the matter about what the wandering two-bitser means. But now take a person who genuinely can't tell a balboa from a quarter — somebody from a place with no coins at all, who's never handled money in her life. If she picks up a balboa believing it's a quarter, is there no fact of the matter about what she believes? It seems like there obviously is: she believes it's a quarter, she's wrong, and that's true of her in a way it isn't true of the machine. And if you tell me the difference is just that she could learn to tell them apart while the machine can't, that doesn't obviously help either, because you could bolt a better sensor onto the two-bitser and then it can tell them apart too. So it looks like a fork: either the difference between her and the machine is just the richness of the whole system, a matter of degree with no line anywhere — in which case say so, and admit that original intentionality was never the thing you were attacking, it's just intentionality you're not noticing yourself ascribing — or there really is a mark that separates her from the machine, and then you owe me that mark, and I can't see what it could be other than "she's one of us." So which is it? And if it's the first horn, why isn't Searle entitled to say you've just changed the subject?
