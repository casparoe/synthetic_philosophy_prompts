  ### Scene: The Harbour Wall

  **Setting:** The harbour wall on a chill, overcast morning. The sea is a roiling grey, flecked with whitecaps that crash against the stone below. Salt spray mists the air, and the wind carries the tang of seaweed and distant rain. Ilse, a woman in her forties with a practical woolen shawl pulled tight, stands with her back to the water, facing Corvin—a lean, restless man in oilskin gear, his eyes scanning the horizon like he’s calculating the day’s catch. Both hold their sealed cards, the stiff parchment damp under their fingers.

  ---

  **ILSE**  
  (Clutching her card like a shield)  
  It’s simple, Corvin. We’re all staring at the same numbers—four hundred households, forty of them clan, forty thousand units to split. And we’re all ordinary folk, same stakes, same knowledge. Whatever I decide, the rest will decide too. So why chase a fool’s gamble? If we all write, we drown: 400 writers means 100 units each, minus the levy—a loss of fifty. If we all leave it blank, we break even: zero’s better than debt. The math’s brutal, but it’s honest. We save ourselves by doing nothing *together*.

  **CORVIN**  
  (Wiping spray from his brow, a wry smile)  
  Save ourselves? Or starve together? You’re building a castle on “what if,” Ilse. My card doesn’t whisper to yours. Jans isn’t peering over my shoulder. We’re alone out here. If I leave my card blank, and the other three hundred fifty-nine do the same—fine, I get nothing. But if even *one* of them writes, I’ve thrown away a chance. Say only the clan writes—forty cards. If I write too, it’s forty-one. I get forty thousand divided by forty-one, minus the levy. That’s 975 minus 150—825 units, Ilse. Free and clear. Why would I ignore that?

  **ILSE**  
  (Stepping closer, her voice tightening)  
  Because if you write for that 825, you’re betting against our sameness. If *you* see that prize, so does Marta, so does Peder. Why wouldn’t they? And if we all see it, we all write. Then it’s not 41 writers—it’s 400. And we all *lose* fifty. Your greed undoes us all. The only way to avoid the trap is to recognise we’re identical—we’ll all reach the same conclusion. So we *must* choose the action that’s best when we all do it. And that’s blank. Every time.

  **CORVIN**  
  (Leaning against the damp stone, eyes sharp)  
  Sameness isn’t magic. It’s a guess. You’re saying because we’re identical, we’ll act identically. Fine. But which action? If we’re identical, we all think like *me*: we all see that if others leave blanks, writing pays 825. So we all write! Your “sameness” pushes us straight into the fire. It’s a circle, Ilse. You can’t assume we’ll all choose blank just because it’s best collectively—not when individually, writing shines if others don’t.  

  **ILSE**  
  (Scoffing, but her knuckles whiten on the card)  
  Then your circle is a noose. If we all think like you, we all write and lose. If we all think like me, we all leave blank and break even. One path is certain zero; the other is certain loss. Why cling to the gamble?  

  **CORVIN**  
  (Straightening up, gesturing at the sea)  
  Because the gamble’s the only real choice we have! I don’t control Marta’s hand. I don’t control yours. All I control is whether *I* write or not. So I have to ask: what do I expect the others to do? If I think most will leave blanks, I write. If I think too many will write, I don’t. It’s not greed—it’s sense. Say I believe... 200 others will write. Then with the clan, that’s 240 writers. If I write, it’s 241. My share is 166 units, minus levy—16 units net. A pittance, but better than zero. If I think 250 others write, I get nothing by writing—or worse, a loss. So I weigh the odds.  

  **ILSE**  
  (Her voice low, urgent)  
  Odds? You’re spinning a private lottery. But we’re not dice, Corvin. We’re people with the same facts. If you “weigh the odds,” so must they—identically. So what’s your number? When does writing pay?  

  **CORVIN**  
  (Calm, methodical)  
  The levy’s 150. The pot’s 40,000. Writing pays if my share tops the levy—so 40,000 divided by total writers exceeds 150. Total writers are the clan’s 40, plus ordinary writers, plus me if I write. Call the other ordinary writers X. If I write, writers are 41 + X. I profit if 40,000 / (41 + X) > 150. Solve it: 40,000 / 150 is about 266.7. So 41 + X must be less than 266.7—meaning X must be less than 225.7. If I believe 225 or fewer others write, I write. Otherwise, I don’t.  

  **ILSE**  
  (A bitter laugh)  
  225? You’ve reduced us to a number. But if we’re all rational and identical, we’ll all land on that same number—225. So we all write if we think X ≤ 225... but X is *us*, Corvin! If we all write, X is 359—far above 225. If we all leave blank, X is 0—and we should all write! Your math chases its tail. It doesn’t settle anything.  

  **CORVIN**  
  (His composure cracks; he rakes a hand through wind-tangled hair)  
  You’re right—it doesn’t settle it. Because without talking, we’re stuck in a hall of mirrors. But your sameness is a ghost. It demands we all act as one, but gives no reason to pick blank over write. At least my way faces the uncertainty: we might end up with some writing, some not. Some win a little, some lose, some break even. It’s messy, but it’s real.  

  **ILSE**  
  (Softly, staring at her card)  
  Real? Or just resigned? If we mix our choices, the *average* payoff is zero—same as all leaving blank. But with risk: some households lose fifty, some gain hundreds. And for what? Because we’re too proud to see we’re better off unified? The clan doesn’t pay the levy—they profit no matter what. We’re the ones who bleed. Your “individual sense” fractures us. It makes winners and losers of equals.  

  **CORVIN**  
  (Quietly, after a pause)  
  And your unity is a story we tell to feel safer. But the cards are sealed. The choices are private. If I leave mine blank, trusting your sameness, and others write... I get nothing while they profit. I can’t unsee that, Ilse. Maybe you’re right—maybe we *should* all leave blanks. But “should” doesn’t bend reality. Without a signal, a pact, a spark... we’re each alone with the wind.  

  **ILSE**  
  (She tucks her card into her coat, shoulders slumping)  
  Then we’re doomed to your lottery. But I won’t call it wisdom. I’ll call it surrender.  

  **CORVIN**  
  (Watching a gull dive into the grey)  
  Call it what you like. I’m writing mine. Because I think fear of the loss will keep writers down. Maybe 200. Maybe 210. So I’ll risk it.  

  **ILSE**  
  (Turning to leave, her voice barely audible over the waves)  
  Or maybe hope will swell that number. And we’ll all drown together.  

  *(Corvin stays at the wall, card in hand. Ilse walks away, her figure receding into the mist. The sea crashes, indifferent.)*  

  ---

  ### Note to the Author  

  The scene leans on contested interpretations of rationality in game theory, not settled truths. Ilse represents a **team-reasoning** perspective: individuals act as a unified "we" to maximize collective payoff, assuming symmetry forces identical choices. Corvin embodies **instrumental rationality**: individuals maximize personal expected payoff given beliefs about others' actions, leading to Nash equilibrium reasoning.  

  The key friction is whether "sameness" (common knowledge of rationality and symmetry) implies coordinated action or just identical decision-making frameworks. Ilse assumes it enables collective optimization (all leave blank). Corvin argues it creates a coordination problem with no pure-strategy equilibrium—only mixed strategies (each writes with probability ~0.63) or reliance on beliefs.  

  The crux that could shift my verdict is **the islanders’ history and social context**. If they have a norm of solidarity (e.g., past successful coordination without communication), Ilse’s focal-point reasoning holds weight. If they’re strangers or have a history of defection, Corvin’s skepticism dominates. Without this, the logic slightly favors Corvin: the game has no pure-strategy Nash equilibrium, making Ilse’s "all blank" unstable. But if your novel’s world emphasizes community bonds, Ilse isn’t foolish—just optimistic.  

  Genuinely open? Yes. To close it, I’d need evidence of precedent: if the islanders coordinated similarly before, Ilse wins; if not, Corvin’s realism prevails. The levy exemption for the clan heightens stakes but doesn’t resolve the core dilemma.  

  *(This scene treats 40,000/41 ≈ 975 and 40,000/150 ≈ 266.7 as rounded for dialogue; precise figures support the logic.)*
