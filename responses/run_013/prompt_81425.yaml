prompt: |-
  ok so I'm in a philosophy of social science seminar this term and my prof has basically one move for ending an argument, which is some version of all models are wrong, but some are useful. Last week a guy in class pointed out that the model on the syllabus assumes every firm is identical and knows everything, and the prof just shrugged and said yeah, of course that's not true, that's what makes it a model — you judge a model by how well it predicts, not by whether the assumptions are realistic, and if you demanded true assumptions you'd never have any theory at all. Somebody called that the F-twist and he definately didn't deny it.

  Here's my problem: I feel like he's using that one sentence to do about four different jobs at once and I can't tell which one he's actually entitled to. Could you give me a menu — all the distinct precise claims that line could be making, sorted from the totally trivial to the radical — and for each one tell me whether it's a platitude, genuinely contentious, or just false? I'd like the readings separated along three axes: what "wrong" is supposed to mean (not literally identical to reality? not approximately true? not even the kind of thing that could be true or false?), what "useful" is supposed to mean (predicts the data? explains? gives understanding? tells you what happens if you intervene?), and useful for whom and in what domain. Also say whether the "but" is doing any work or whether "some are useful" is the whole content.

  Then the part I actually care about: which of those readings really licenses what he does with it, namely waving off the unrealistic-assumptions objection? Which reading does he probably have in mind even if he couldn't state it? And a related thing I can't sort out — is there a real difference between a model that's "wrong" because it was idealized on purpose (he keeps saying "Galilean idealization" and "we can de-idealize later") and a model that's just wrong because an assumption is flat-out mistaken? Is "idealization" a defense, or just a nicer word for the same thing?

  American English please, and put it in a numbered list with your verdict next to each reading so I can bring it to office hours.
