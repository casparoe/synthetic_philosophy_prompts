  I recall Friedman's instrumentalism (the "F-twist") is relevant here. The professor seems to be channeling that view. But the user is right to question whether one slogan can do multiple jobs. 

  Starting with "wrong": it could range from literally incomplete (trivial) to non-representational (radical). For "useful," it might mean predictive accuracy, explanatory power, or pragmatic value. The audience matters too - useful for scientists versus policymakers.

  The key is identifying which combinations actually defend unrealistic assumptions. Strong instrumentalism (Reading 6) does this best, but it's contentious. The professor's "Galilean idealization" comment suggests he sees assumptions as deliberate simplifications, not errors.

  I should also address the "but" - in most readings it's redundant since usefulness is already the point. Only in anti-realist views does it add contrast. 

