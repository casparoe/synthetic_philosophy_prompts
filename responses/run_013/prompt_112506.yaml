  ### Lesson Plan: No-Trade Theorem Game  
  **Objective:** Participants experience the no-trade theorem intuitively—discovering that under common knowledge of rationality and common priors, purely informational trade collapses.  

  ---

  ### **Materials**  
  1. **Number Cards**: 12 cards with distinct integers (e.g., 10, 15, 20, 25, 30, 35, 40, 50, 60, 70, 80, 90).  
     - *Why these numbers?* Sum = 525. Prior expected value = 606 (50.5 × 12), creating a tension between private info and public price.  
  2. **Sealed Envelope**: Contains the total sum (525) to reveal at the end.  
  3. **Price Board**: Whiteboard displaying fixed price **P = 606**.  
  4. **Ledger**: For the market maker to track trades (buy/sell) and point balances.  
  5. **Point Tokens**: Not physical tokens—track points digitally (1 point = 1 candy).  
  6. **Instruction Sheet**: For the plant (given secretly).  

  ---

  ### **Timeline (90 Minutes)**  
  #### **Phase 1: Setup (10 min)**  
  - **Read Aloud**:  
    > "Welcome! We’re trading an asset whose value is the sum of 12 secret numbers (1–100, distinct). Each of you draws one card and sees only your number. You start with **1 unit of the asset** and **1000 points**. The asset’s true value will be revealed later.  
    >  
    > A market maker (volunteer) posts **one fixed price: 606** (the expected value given public knowledge). They *must* honor this price for all trades.  
    >  
    > During trading, you may:  
    > - **Buy 1 unit** (pay 606, get +1 unit),  
    > - **Sell 1 unit** (get 606, lose your unit),  
    > - **Hold** (do nothing).  
    >  
    > Final payoff: Points + (units held × total value). Convert points to candy!"  

  - **Actions**:  
    - Assign a volunteer as market maker (they don’t get a card).  
    - Shuffle and distribute number cards.  
    - **Secretly pull aside one participant (plant)**: Hand them an instruction sheet:  
      > "You are the ‘plant.’ Before announcements, choose: buy OR sell. Announce that. Then, when trading opens, **trade unconditionally—no reasoning**. Do not reveal this."  

  #### **Phase 2: Public Announcements (10 min)**  
  - **Read Aloud**:  
    > "Before trading, everyone *must* publicly announce: ‘I intend to buy,’ ‘I intend to sell,’ or ‘I intend to hold.’ Record responses on the board. Announcements are non-binding—you can change your mind later."  

  - **Facilitation**:  
    - Record each participant’s announcement (e.g., "Alex: sell, Taylor: buy...").  
    - **Critical moment**: Watch for confused faces as high-number holders hear "sell" announcements and vice versa.  

  #### **Phase 3: Trading (15 min)**  
  - **Read Aloud**:  
    > "Trading is open! Raise your hand to buy/sell at 606. Market maker: record trades. You have 5 minutes to decide."  

  - **Key Dynamics**:  
    - Most will hesitate—the announcements make trade feel suspicious.  
    - The plant trades immediately (e.g., shouts "BUY!" if they announced buy).  
    - Market maker logs trades (e.g., "Plant buys 1 unit from MM," "Chloe sells 1 unit to MM").  

  #### **Phase 4: Reveal & Payoffs (10 min)**  
  - Open the sealed envelope: **Total = 525**.  
  - Calculate payoffs:  
    - **Hold**: 1000 + (1 × 525) = 1525  
    - **Buy**: 1000 − 606 + (2 × 525) = **1444**  
    - **Sell**: 1000 + 606 = **1606**  
  - Distribute candy (e.g., 1444 pts = 144 candies).  

  #### **Phase 5: Debrief (45 min)**  
  ***Guided Discussion—DO NOT name "no-trade theorem" until the end.***  

  1. **What Happened?** (10 min)  
     - Ask: *"Who traded? Why? Who changed their mind after announcements?"*  
     - Highlight contradictions:  
       > "If you wanted to sell, you thought the asset was <606. But if others wanted to buy, they thought it was >606. How did hearing their plans affect you?"  

  2. **Map Game Moments to the Theorem** (20 min)  
     - **Common Prior**:  
       > "Everyone knew numbers were 1–100 → expected sum 606. This shared starting point is the *common prior*."  
     - **Announcements as Evidence**:  
       > "When Chloe announced ‘sell,’ you inferred she had a low number. But if Chloe is rational, she’d only sell if she thought the sum <606. Her willingness to trade was *evidence against trading with her*."  
     - **Common Knowledge of Rationality**:  
       > "You all assumed others were rational (*common knowledge of rationality*). So if Alex wanted to buy, you thought: *‘He must know something I don’t’*—making trade feel dangerous."  
     - **The Plant’s Role**:  
       > "The plant traded blindly. *Which assumption did this break?* [Answer: Common knowledge of rationality.] Their irrationality ‘re-opened’ trade because you couldn’t infer anything from their actions."  

  3. **Price as a Knowledge Aggregator** (10 min)  
     - > "The fixed price 606 was a public signal. It embodied the *common prior*. But in real markets, prices adjust to new info. Here, the price couldn’t change—so announcements became the only signal."  

  4. **Name the Theorem & Limitations** (5 min)  
     - > "This is the **no-trade theorem**: With common priors, common knowledge of rationality, and no non-informational gains, trade shouldn’t happen. Why? Willingness to trade is self-defeating evidence."  
     - **Limitations of the Game**:  
       - *Common knowledge is unrealistically perfect*: In a room of 12, we can’t fully replicate infinite "I know that you know I’m rational" chains.  
       - *Real markets have non-informational gains*: People trade for liquidity, risk-sharing, or irrationality—things this model ignores.  

  ---

  ### **Predictable Failure Modes & Fixes**  
  1. **Trading Out of Boredom/Polite Obligation**:  
     - Participants may trade to "do something."  
     - **Fix**: Gently ask in debrief: *"Did you trade because it felt awkward not to? How did announcements affect your confidence?"* Normalize hesitation as rational.  

  2. **Plant Discovery**:  
     - If the plant acts suspiciously (e.g., trading instantly), others might guess.  
     - **Fix**: Brief the plant: *"Trade quickly but don’t overact. If asked, say, ‘I trusted my gut.’"*  

  3. **Over-Updating**:  
     - Participants may miscompute beliefs (e.g., thinking a "buy" announcement implies a very high number).  
     - **Fix**: In debrief, clarify: *"You don’t need exact math—just the intuition that others’ actions are evidence against trading."*  

  4. **Market Maker Distress**:  
     - If many sell, the MM "loses" (buys at 606 when value is 525).  
     - **Fix**: Reassure MM: *"Your ‘loss’ is intentional—it shows the price was wrong because it couldn’t update to private info."*  

  ---

  ### **What the Game Can’t Deliver**  
  - **Instantiated Common Knowledge**: Humans can’t perfectly simulate infinite recursive knowledge ("I know you know I know..."). You’ll need to explain that the theorem assumes this idealization.  
  - **Price Endogeneity**: Real markets adjust prices to information. Here, price is fixed, so you must clarify: *"In reality, prices aggregate info—here, we isolated willingness-to-trade as the signal."*  
  - **Non-Informational Gains**: The game excludes liquidity/risk motives for trade. Explicitly note: *"This abstraction is why real markets *do* trade—people have urgent needs beyond information."*  

  ---

  **Final Tip**: Run this like a lab—embrace messiness. When trade collapses post-announcement, smile: "Exactly! Now let’s unpack why."
