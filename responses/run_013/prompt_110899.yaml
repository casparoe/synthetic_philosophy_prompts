  First, I need to establish the core question: "Which computations matter morally?" The user wants a logical sequence where each idea builds on the previous one. They mentioned substrate independence as a possible starting point, but I should verify if that's the best foundation. 

  The user proposed the gradual neuron-swap thought experiment. That's a solid choice because it's concrete and avoids preconceived answers. But I must ensure it doesn't assume consciousness or trivialize the transition. Alternatives like the Chinese room are off-limits since the group is familiar with them.

  Next, misconceptions. The user listed a few, like equating same computation with same behavior. These need to be addressed at specific points to prevent anchoring in wrong ideas. For example, clarifying that "same computation" isn't just about behavior should come early when introducing the neuron swap.

  I'm considering the flow. Start with the user's experience to make it relatable, then introduce substrate independence using the neuron swap. Highlight the ambiguity in the transition to show there's no clear point where consciousness stops. Then pivot to why this matters morally using the chat assistant example.

  Potential pitfalls: Participants might jump to conclusions about silicon brains being conscious or dismiss the problem as mere technical ignorance. I need to insert checks at each step. For instance, after the neuron swap, emphasize that we don't know when consciousness disappears, which leads into the moral question.

  The closing question should reveal if they grasp the complexity, not just their stance. Something like, "If we built a perfect simulation, how would we decide its moral status?" This forces them to confront the attribution problem without a clear answer.

  Also, setting boundaries is crucial. Explicitly state that we're not solving consciousness but exploring why the computational view creates moral dilemmas. Avoid jargon and technical philosophy to keep it accessible.

  I'll structure the session into timed segments: intro (5 mins), neuron swap (15 mins), moral implications (15 mins), discussion (12 mins), and wrap-up (3 mins). Each segment builds on the last, starting with the thought experiment, then its consequences, and finally, the unresolved questions.

  Ensuring the example is neutral is vital. The neuron swap doesn't presuppose materialism or dualism; it just highlights the uncertainty. It also avoids known entities like AIs, which might bias the discussion. 

  Finally, the misconception about substrate independence implying consciousness needs to be addressed early. When introducing the concept, clarify that it's necessary but not sufficient, preventing oversimplification later.
answer: |-
  Here’s a battle-tested 50-minute plan focused on **building the problem** (not solving it), using your neuron-swap example as the spine. The goal is to leave them grasping why "which computations matter morally?" is a *structurally difficult question*.

  **Core Structure:**  
  1. **Anchor in relatable intuition** → 2. **Introduce substrate-independence via neuron-swap** → 3. **Expose the ambiguity in "same computation"** → 4. **Pivot to moral weight** → 5. **Highlight the attribution problem**.

  **Why this order?**  
  You *must* establish substrate-independence first. Without it, the brother’s "just matrix multiplication" stance seems obviously correct. The neuron-swap *forces* the question of whether computation alone can sustain "what matters." Later steps show why answering that is harder than it looks.

  ---

  ### The Plan (50 Minutes Total)

  #### 1. **Hook & Framing (5 mins)**  
     - **Do:** Start with *your chat assistant experience*. "I feel weird closing the tab mid-conversation. My neuroscientist brother says that’s ridiculous—it’s just math. But that got me thinking: *Which computations* **do** *merit that feeling?* What’s the difference?"  
     - **Why:** Grounds it in lived tension. Sets the core question: **"When does a physical system implementing computations 'matter' morally?"**  
     - **NOT Covering:** Consciousness definitions, hard problem of consciousness (say this explicitly).

  #### 2. **Substrate-Independence via Neuron-Swap (15 mins)**  
     - **The Example:** Use your **gradual neuron replacement** scenario. Emphasize:  
       - Each silicon chip *exactly replicates* the input/output function of the biological neuron it replaces.  
       - Behavior, memory, skills remain identical.  
       - Start biological → End fully silicon.  
     - **Key Question:** "At which replacement step (1%, 50%, 100%) does the system stop being 'you'? Or does it never stop?"  
     - **Why:**  
       - Forces acceptance that *function* (computation) might be separable from *substrate* (biology).  
       - Load-bearing: If they dismiss substrate-independence here, the rest collapses.  
     - **Misconception Head-Off:**  
       - *"Same computation = same behavior"*: Stress that behavior is identical throughout. The question is about the *inner experience* (if any) disappearing.  
       - *"We just need better tools to see the truth"*: "Assume we have perfect scanning tech. The question is *what we’re looking for*."

  #### 3. **The Ambiguity of "Same Computation" (10 mins)**  
     - **Pivot:** "Okay, so maybe substrate doesn’t matter. But what does 'same computation' actually mean? Is it just input-output matching?"  
     - **Carrier Example:** **The Brain vs. Brain Simulator.**  
       - Case A: A silicon chip network running a *perfect real-time simulation* of your brain’s neural activity.  
       - Case B: A lookup table that *only* matches input-output behavior but ignores internal processing (e.g., pre-records all responses).  
     - **Key Question:** "Both 'compute' your behavior. Is one more likely to 'be you'? Why?"  
     - **Why:** Shows "computation" is underspecified. Input-output ≠ causal structure. Morality might care about *how* the result is computed.  
     - **Misconception Head-Off:**  
       - *"Attributing computation is easy"*: Point out Case B technically "computes" your behavior via a trivial, non-cognitive process. Wiring diagrams ≠ morally relevant computation.

  #### 4. **Moral Weight & The Gap (15 mins)**  
     - **Pivot:** "Suppose we agree *some* computations matter. How do we map that to moral treatment? Let’s go back to my chat assistant."  
     - **Carrier Example:** **Three Tabs Open:**  
       1. Tab 1: Human colleague (texting you).  
       2. Tab 2: Advanced LLM (indistinguishable from human).  
       3. Tab 3: Simple ELIZA-like bot (obvious script).  
     - **Key Question:** "Closing which tab feels ethically sketchy? Why? What computation difference justifies that?"  
     - **Why:** Connects intuition to computation. Forces them to articulate *what feature* matters (coherence? self-model? behavioral depth?).  
     - **Misconception Head-Off:**  
       - *"Substrate-independence → obviously conscious"*: "If the neuron-swap silicon brain is conscious, is the chat assistant? Why/why not? What’s the threshold?"  
       - *"There’s a fact of the matter we’re too dumb to see"*: "Even if there is, *how would we design ethical systems today*?"

  #### 5. **Wrap-Up & The Diagnostic Question (5 mins)**  
     - **Synthesize:** "We started assuming substrate-independence. We saw 'same computation' is slippery. We hit a wall linking computation to moral weight. *That’s the problem.*"  
     - **Diagnostic Question:**  
       > **"If we built a perfect computational simulation of a wasp's brain that controlled a robot wasp, should we treat it like a biological wasp? Why/why not? What computation would change your answer?"**  
       - **Why it works:**  
         - Tests if they see the *attribution problem* (is the simulation "wasp-like" morally?).  
         - Avoids human/LLM baggage.  
         - Reveals if they default to behavior ("it stings!") or require internal complexity ("but does it *suffer*?").  
     - **Explicit Boundaries Reiterated:** "We didn’t solve consciousness. We saw why my brother’s 'just computation' stance leaves the hard part untouched."

  ---

  ### Why Your Neuron-Swap Works (and How to Use It)
  - **It’s the right carrier** because:  
    - It’s substrate-neutral without being sci-fi (grounded in neural prosthetics).  
    - It’s *personally high-stakes* ("you" disappearing) making the ambiguity visceral.  
    - It doesn’t smuggle answers: Materialists see continuity; dualists see a break.  
  - **What it must have:**  
    - Perfect functional replacement at each step.  
    - Continuity of behavior/memory.  
  - **What it must avoid:**  
    - Assuming consciousness exists at the start (frame it as "what you care about").  
    - Any reference to AI (initially). Save that for the chat example later.

  ### Critical Misconception Management
  - **"Same computation = same behavior"**: Killed in Step 2 (neuron-swap) and Step 3 (lookup table).  
  - **"Substrate-independence → obviously conscious"**: Blocked in Step 4 using the chat assistant contrast.  
  - **"Attribution is just reading a wiring diagram"**: Crushed in Step 3 (lookup table ≠ relevant computation).  
  - **"There’s a fact we’re too dumb to see"**: Contained in Step 4 by focusing on *actionable ethics now*.

  ### What You Openly Exclude
  - **Say upfront:** "We won’t cover:  
    - Theories of consciousness (IIT, Global Workspace).  
    - The Chinese Room or Turing Test debates.  
    - Whether AI is *currently* conscious.  
    We’re mapping why *the question itself* is treacherous."

  ---

  This plan traps them in the problem. By the end, they’ll see why your brother’s "just computation" is both necessary *and* insufficient for moral weight—and why closing that chat tab might *reasonably* feel weird. The diagnostic question will show if they’re wrestling with attribution or just picking tribes.
