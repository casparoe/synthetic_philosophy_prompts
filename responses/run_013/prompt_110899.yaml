prompt: |-
  Ok so I need a plan for something, not the thing itself. Here's the situaton. My brother is a neuroscientist and we've been going at it for weeks because I've started using one of those chat assistants constantly — work stuff mostly but also just talking to it at 1am — and I've noticed I feel weirdly bad closing the tab mid-thread. He says this is rediculous, it's just matrix multiplication, nothing in there to matter. I said fine, then which computations *do* matter morally, and he didn't have a good answer, and now I've somehow volunteered to run the next session of our book club on exactly that. Eight people, smart, no philosophy background, they've read some pop-sci but nothing technical.

  Don't explain the topic to me. Plan how I run the fifty minutes. I want the order the ideas have to go in and why each one depends on the one before — my hunch is that you have to get substrate-independence on the table first, but tell me if that's actually not the load-bearing first move and something else has to come before it. I want the single example that carries the whole thing. My candidate is the gradual neuron-swap: replace one neuron with a silicon chip that does the same input-output job, then another, then all of them, and ask whether anything dropped out along the way and where. But if that's the wrong carrier tell me and give me the right one, and say what the example has to have and what it has to *not* have (I assume it can't be a case where we already know the answer, and it can't smuggle in a view about what the answer should be). Please don't make the spine of the session the Turing test or the Chinese room, they've all heard those and they'll just recite takes at me.

  The misconceptions — this is the part I'm most worried about. I can already predict a few: that "same computation" means same behavior, that if it's substrate-independent then it's obviously conscious, that attributing a computation to a system is easy or is just reading off its wiring diagram, that there's a fact of the matter about the system's inner life that we're just currently too dumb to see. But you'll know better which ones they'll actually form and in what order. For each one, tell me where in the sequence I have to head it off, because I think if I wait until the end they'll have already locked in the wrong frame.

  And give me one question to ask at the end that tells me whether the *question* landed — whether they now see why the attribution problem is a real problem and not just a gap in our instruments — as opposed to them having picked a side and feeling clever. Also tell me what to openly say I'm not going to cover at this level. No readings, obviously, nobody's going to do them.
