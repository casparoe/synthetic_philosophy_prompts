  Based on your gut reactions to each scenario, I've reverse-engineered the underlying principles you're intuitively applying. Your verdicts don't perfectly align with a single standard theory, but they reveal a **hybrid principle** combining elements of cooperative bargaining and fairness norms. Here's the breakdown:

  ### Your Inferred Principle
  1. **Threat points (walk-away values) are used only if they are *legitimate and ethical***.  
     - A threat point is legitimate if it comes from a credible, above-board option (e.g., a standing offer in Case 2), not from unethical actions (e.g., stealing clients in Case 3).  
     - If a threat point is unethical, it's ignored, and the split defaults to equal division or contribution-based fairness.  
     
  2. **Surplus from cooperation is split equally among partners who created it** (after accounting for legitimate threat points).  
     - Surplus = Total value - Sum of legitimate individual threat points.  
     - Each partner gets their threat value + equal share of surplus.  
     - *Exception*: If work contributions are highly unequal (Case 4), surplus is adjusted toward equal division of the *entire pie*, not just surplus.  

  3. **Coalitions are treated as single units** when calculating marginal gains (Case 5).  
     - The value added by a new member to a coalition is split equally between the member and the coalition.  

  ### How Your Principle Explains Each Case
  - **Case 1**: No threat points → entire $100k is surplus → split equally: **$50k each**.  
  - **Case 2**: Legitimate threat points ($60k for you, $0 for partner). Surplus = $100k - $60k = $40k → split equally: you get $60k + $20k = **$80k**, partner gets $0 + $20k = **$20k**.  
