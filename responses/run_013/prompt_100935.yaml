  ### Decision Tree for Higher-Order Evidence in Epistemic Rationality

  **Starting Point**: An agent has competently reasoned about a first-order question (e.g., a math problem) and then acquires higher-order evidence (HOE) that bears on the reliability of that reasoning without directly bearing on the first-order proposition. Examples include a peer's disagreement, a track record of inaccuracy in the domain, or testimony that a peer is unreliable about the agent's reliability. The HOE suggests the first-order reasoning may be flawed.

  1. **Is higher-order evidence genuinely distinct?** That is, does it provide new information *only* about the agent’s reliability or reasoning process, not about the first-order proposition itself?
     - If **no**, you are at the **Deflationary view**: Denies that HOE is distinct, so must explain cases like peer disagreement as covertly involving first-order evidence, which strains intuitive cases where HOE seems irrelevant to the proposition (e.g., learning you are drugged doesn’t change whether 2+2=4, but should change your confidence).
     - If **yes**, go to question 2.

  2. **Can higher-order evidence directly bear on the first-order proposition?** That is, should HOE be treated as evidence about the truth of the first-order claim itself (e.g., because reliability facts are part of the world the proposition describes), or only as evidence about the agent’s mind or reasoning?
     - If **yes**, go to question 3.
     - If **no**, go to question 4.

  3. **Is the rational response to higher-order evidence uniquely determined?** When HOE suggests unreliability, does rationality specify exactly how much to revise first-order belief, or does it only set bounds on permissible responses?
     - If **yes**, you are at the **Total-evidence view**: Incorporates HOE into the first-order evidence pool, so must explain how facts about oneself (e.g., "I am drugged") directly bear on external propositions (e.g., a math truth), risking over-intellectualization.
     - If **no**, you are at the **Moderate revision view (Unnamed)**: Requires belief revision in response to HOE but allows flexibility in degree, which may seem to leave rationality frustratingly vague or context-dependent.

  4. **Does rationality require revising first-order belief when HOE suggests unreliability?** Must the agent reduce confidence in their first-order belief, or can they "stick to their guns"?
     - If **no**, go to question 5.
     - If **yes**, go to question 6.

  5. **Can it be rational to hold a first-order belief while believing that holding it is irrational?** Is this combination (level-splitting) ever rationally permissible, or is it inherently irrational?
     - If **yes**, you are at the **Level-splitting permission view**: Allows an agent to believe P while simultaneously believing that believing P is irrational, which seems self-undermining or akratic.
     - If **no**, you are at the **Steadfast view**: Requires maintaining first-order belief despite HOE, so must explain why evidence of one’s own unreliability (e.g., a peer’s disagreement) doesn’t compel doubt, risking dogmatism.

  6. **Is the rational response to HOE uniquely determined?** (As in question 3.)
     - If **yes**, you are at the **Equal-weight conciliationism**: Requires precise belief revision (e.g., splitting the difference with a peer), even when first-order evidence is asymmetric or strong, which can force counterintuitive concessions to unreliable sources.
     - If **no**, you are at the **Bounded conciliationism (Unnamed)**: Requires belief revision but allows a range of responses, which may seem to make rationality overly permissive or subjective.

  7. **Is the enkratic requirement (no level-splitting) a demand of rationality?** That is, is it definitionally irrational or impossible to hold a belief while regarding that very belief as irrational, regardless of HOE?
     - If **yes**, you are at the **No-level-splitting view**: Treats level-splitting as irrational by definition, so must explain why agents in HOE dilemmas (e.g., after learning of impairment) cannot rationally "bracket" their self-doubt, potentially over-intellectualizing ordinary reasoning.
     - (Note: This question is only for the path after answering "no" to question 4 and "no" to question 5, but since no one occupies this cell, it is omitted from the main tree for brevity. See diagnostics.)

  **Leaves and Their Paths**:
  - **Deflationary view**: Q1 → no.  
  - **Total-evidence view**: Q1 → yes, Q2 → yes, Q3 → yes.  
  - **Moderate revision view (Unnamed)**: Q1 → yes, Q2 → yes, Q3 → no.  
  - **Level-splitting permission view**: Q1 → yes, Q2 → no, Q4 → no, Q5 → yes.  
  - **Steadfast view**: Q1 → yes, Q2 → no, Q4 → no, Q5 → no.  
  - **Equal-weight conciliationism**: Q1 → yes, Q2 → no, Q4 → yes, Q6 → yes.  
  - **Bounded conciliationism (Unnamed)**: Q1 → yes, Q2 → no, Q4 → yes, Q6 → no.  
  - **No-level-splitting view**: Explicitly placed via Q7 in an unoccupied path (see diagnostics), but not a live leaf in the tree due to no occupancy.

  **Unoccupied Cells and Diagnostics**:
  - **Q1 → yes, Q2 → no, Q4 → no, Q5 → no (Steadfast view)**: Occupied (no gap).  
  - **Q1 → yes, Q2 → yes, Q3 → no (Moderate revision view)**: Occupied but unnamed (not required).  
  - **Q1 → yes, Q2 → no, Q4 → yes, Q6 → no (Bounded conciliationism)**: Occupied but unnamed (not required).  
  - **Unoccupied: Q1 → yes, Q2 → no, Q4 → no, Q5 → yes (Level-splitting permission view) and Q1 → yes, Q2 → no, Q4 → no, Q5 → no (Steadfast view) are occupied, but the path after Q5 → no leads to a potential Q7 branch. However, no one occupies the combination requiring Q7 because:**  
    - **Cell: Q1 → yes, Q2 → no, Q4 → no, Q5 → no, Q7 → yes (No-level-splitting + Steadfast)**: Unexplored. Theorists who reject level-splitting (like steadfast theorists) already embed this commitment in their view, so a standalone "no-level-splitting" leaf without a stance on HOE response is unmotivated and unused.  
