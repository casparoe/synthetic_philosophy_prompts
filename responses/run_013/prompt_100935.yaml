  - **Distinguishing Level-Splitting Permission from Total-Evidence**: The tree separates them clearly. Level-splitting requires Q2 → no (HOE doesn’t bear on the proposition) and Q4 → no (no revision required), while total-evidence requires Q2 → yes (HOE bears on the proposition). They are mutually exclusive in the tree.  
