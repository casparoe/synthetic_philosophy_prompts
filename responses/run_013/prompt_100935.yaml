  Please make sure the following positions appear as leaves, and give each a one-sentence gloss of its most awkward commitment: the equal-weight or conciliatory view; the steadfast or right-reasons view; the total-evidence view on which the higher-order evidence is not independent of the first-order question; a level-splitting permission view that lets the agent believe the first-order proposition while conceding that the belief is not rational; the no-level-splitting view that treats such a combination as impossible or as a failure of rationality by definition; and the deflationary view that there is no such thing as distinctively higher-order evidence in the first place. Aim for six to nine leaves total and flag any pair of leaves your tree cannot actually separate, rather than papering over the gap — I'd especially like to know whether the tree can distinguish the permission view from the total-evidence view, since I suspect it cannot, and whether the still-higher-order case above forces any leaf to split. I don't need any citations or reading suggestions; I need the structure and the diagnostics. Please write it out in prose with the branch questions numbered and the leaves indented under them, and finish with a single last line beginning "Key:" followed by nothing but the leaf positions as a comma-separated list in the order they appear, so I can paste it into the handout's answer grid.
