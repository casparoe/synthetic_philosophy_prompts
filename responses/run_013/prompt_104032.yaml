prompt: |-
  Two nights ago a friend and I argued about pacifism until nearly dawn, and the objection he left me with was not the familiar one. He is not a pacifist. He thinks the position is either vacuous or dishonest, and he put it like this: when our network stages a sit-in at a weapons plant and a worker must choose between driving over a grandmother and losing his job, we have not renounced force at all — we have merely found a way to apply it without touching anyone, and to keep our hands clean by letting the other man's conscience do the work. He also claimed that the single word hides two different doctrines, one that forbids the act whatever comes of it and one that forbids producing the harms of war, and that these two disagree precisely in the cases that matter to me. He ended by saying that a doctrine which cannot tell me whether to authorize a particular action on a particular Saturday is not a doctrine but a mood, and I could not answer him with anything I would be willing to write down.

  I coordinate training and tactics for a small nonviolent direct-action network, and I am the person who, most weeks, either clears or refuses an action before it happens. The decisions recur, I have perhaps half an hour per action, I have no one on call with a philosophy degree, and my calls go to a five-person steering committee that can overturn me. The stakes are real: people get arrested, occasionally get hurt, and the network's claim to be nonviolent is the entire basis of its standing with the communities we work in. I want to turn pacifism from a position I hold into a procedure my team can run.

  Please write that procedure. It should be a sequence of questions to ask in order, with a clear statement of what counts as a sufficient answer to each, the points at which the procedure stops and refuses the action, and the points at which it must hand the decision to a person because the question is one of judgment or value rather than fact. Ground it in what the serious thinking about nonviolence and the ethics of force actually establishes, not in slogans; I do not need a reading list or citations, and I would rather you reason from the arguments themselves. The procedure has to take a position on the distinctions my friend and I could not settle: between violence and coercion; between what we do, what we allow, and what we provoke; between refusing to initiate force and refusing to answer force in kind; and between our responsibility for our own members and for bystanders and opponents who never chose to be in the story. If the honest answer is that pacifism yields different procedures depending on which of the two doctrines you adopt, then say so, choose the reading that survives contact with the cases rather than the one that sounds best, and tell me what I give up by choosing it.

  Then run the procedure on three actions we actually face: a road-blocking sit-in at a munitions depot, whose point is to make the plant's workers and the police choose between clearing us and being seen to hurt us; a request from our members to physically restrain a counter-protester who is beating one of us; and whether to accept logistical help from a nearby faction that has smashed windows and burned a police car. At least one of your answers should be one I will not like, and you should say which of the three the procedure handles worst and why. Finally, tell me what the procedure cannot do — the cases where it will misfire, the distinctions it will flatten, and the point at which I should stop pretending that following it makes me a pacifist rather than merely a careful organizer.
reasoning: |-
  Hmm, this is a profound and urgent request from someone deeply engaged in nonviolent direct action. The user coordinates training for a small network and needs a practical decision procedure grounded in ethical rigor, not slogans. Their friend's critique about pacifism being either vacuous or dishonest—particularly the point about indirect coercion and the two distinct doctrines within pacifism—has clearly shaken them. 

  First, I need to unpack the core philosophical tensions: 
  - Violence vs. coercion: Does psychological pressure (like forcing a worker to choose between running over grandmothers or losing their job) violate nonviolence? 
  - Acts vs. consequences: Is pacifism about refusing harmful acts regardless of outcome, or preventing harmful outcomes even if the means involve pressure? 
  - Responsibility boundaries: Are we responsible for harms caused by others' choices in response to our actions? What about harms to bystanders?

  The user’s practical constraints are brutal: 30 minutes per decision, no philosophers on call, real risks of arrest/injury, and their network’s credibility resting on nonviolence. They’re not asking for theory—they want a *tool*. 

  For the procedure, I’ll structure it around four filters:  
  1. **Direct Harm**: Does the action *itself* inflict physical injury? (Rejects violence categorically)  
  2. **Coercion Lever**: Does it weaponize others' conscience or force them into harmful choices? (This tackles the friend’s "clean hands" critique)  
  3. **Proportionality**: Is the coercion justified by the harm it prevents? (Here’s where consequence-based ethics enters)  
  4. **Containment**: Can we minimize fallout for bystanders/uninvolved parties? (Addresses responsibility boundaries)  

  Each step must have clear pass/fail criteria. Steps 2 and 3 will require human judgment—no algorithmic evasion. Crucially, I’ll anchor this in the two pacifist doctrines: **deontological** (never initiate force) vs. **consequentialist** (prevent net harm). The procedure must pick one; I’ll choose consequentialist because it survives contact with real-world dilemmas better, even if it sacrifices moral purity. The trade-off? It accepts that coercion can be a "lesser evil" tool, which purists will call a betrayal.  

  Now for the test cases:  
  - **Munitions depot sit-in**: Passes 1 (no direct harm) but fails 2 (coercion via "choose to hurt us or lose jobs"). Consequentialism might allow it if preventing weapons shipments justifies the psychological harm—but it’s ethically messy.  
  - **Restraining a violent counter-protester**: Fails step 1 immediately (direct physical force). Deontology says never; consequentialism says maybe if it prevents greater harm, but the procedure must reject it to stay pacifist. User won’t like this—it feels like abandoning their member.  
  - **Accepting help from window-smashers**: Trickiest. Fails step 4 (association risks collateral damage to network’s credibility/safety). Even if pragmatically useful, the liability to bystanders (via escalated police response) is unacceptable.  

  The procedure handles the restraint case worst because it can’t reconcile protecting one’s own with absolute nonviolence—a structural flaw in pacifism itself.  

  Finally, the limitations: This won’t resolve deep value clashes (e.g., is coercion ever "nonviolent"?). It flattens the distinction between causing harm and allowing it. And when bystanders are hurt despite all safeguards, the procedure can’t absolve you—you’re a careful organizer, not a saint. Stop calling it pacifism when you authorize coercion; call it harm reduction.  

  This user deserves honesty, not comfort. Their work matters too much for soft answers.
answer: |-
  Below is a procedural framework for evaluating nonviolent direct actions, grounded in ethical rigor rather than abstraction. It prioritizes **consequentialist pacifism** (minimizing harm-to-others) over deontological pacifism (absolute rejection of force), as it better withstands real-world dilemmas while demanding stricter accountability. The trade-off: you accept moral responsibility for *indirect* harms caused by your actions, and relinquish the claim to "purity."  

  ### The Nonviolent Action Evaluation Procedure (NAEP)  
  **Time Allotment:** 30 minutes max. If any step requires unavailable data, reject the action.  
  **Core Principle:** Your goal is to *prevent net harm to others*, not to preserve ideological purity.  

  1. **DIRECT PHYSICAL HARM TEST**  
     *Question:* "Does this action *directly* inflict physical injury, property destruction, or imminent threat thereof on any person (opponent, bystander, or ally)?"  
     - **Sufficient Answer:** "No." *If "yes," reject immediately*.  
     - **Rationale:** Nonviolence begins with bodily integrity. This is non-negotiable.  

  2. **COERCION LEVERAGE AUDIT**  
     *Question:* "Does this action force others (opponents, bystanders, or third parties) into choices that may cause *them* to inflict harm (physical, psychological, or material) they would otherwise avoid?"  
     - **Sufficient Answer:**  
       - "No," OR  
       - "Yes, but:  
         (a) The harm is non-physical (e.g., job loss, reputational damage),  
         (b) We accept moral responsibility for this harm,  
         (c) The harm is proportional to the injustice opposed (see Step 4),  
         (d) We minimize avoidable harm (e.g., timing actions to reduce bystander impact)."  
     - **If unresolved:** Flag for committee review.  
     - **Rationale:** Coercion isn't inherently violent but must be justified. "Clean hands" is a myth—own the consequences.  

  3. **PROVOCATION & ESCALATION RISK**  
     *Question:* "Could this action *reasonably provoke* physical harm by opponents or bystanders beyond predictable self-defense?"  
     - **Sufficient Answer:**  
       - "No," OR  
       - "Yes, but:  
         (a) We have mitigations (e.g., de-escalation training, medics),  
         (b) The provoked harm is unlikely to exceed the harm prevented by the action,  
         (c) We do not *intend* escalation as a tactic."  
     - **If provocation is intentional or unmitigated:** Reject.  
     - **Rationale:** Pacifism forbids exploiting others' violence for gain.  

  4. **PROPORTIONALITY ASSESSMENT**  
     *Question:* "Is the total harm *caused* or *risked* (physical, psychological, material) by this action outweighed by the harm it *prevents or reduces*?"  
     - **Sufficient Answer:** "Yes, based on:  
       (a) Evidence of the prevented harm (e.g., arms shipments halted),  
       (b) Conservative estimates of collateral damage (e.g., arrests, trauma),  
       (c) No less harmful alternative exists."  
     - **If uncertain:** Reject. Proportionality requires evidence, not faith.  
     - **Rationale:** Pacifism is not passivity—it demands active harm reduction.  

  5. **AGENCY & CONSENT BOUNDARY**  
     *Question:* "Does this action:  
     (a) Protect our members' consent (e.g., no one pressured to participate)?  
     (b) Avoid implicating non-consenting bystanders in significant harm?  
     (c) Reject partnerships with groups using violence (see Step 6)?"  
     - **Sufficient Answer:** "Yes" to all.  
     - **Rationale:** You govern your group’s actions, not others’ responses—but you *are* responsible for foreseeable collateral impacts on the uninvolved.  

  6. **AFFILIATION SANITY CHECK**  
     *Question:* "Does this action partner with, materially benefit from, or enhance the platform of groups using violence?"  
     - **Sufficient Answer:** "No." *If "yes," reject*.  
     - **Rationale:** Associating with violence undermines your standing and risks indirect complicity.  

  ---

  ### Test Cases  
  **Case 1: Munitions Depot Sit-In**  
  - **Step 1:** Pass (no direct harm).  
  - **Step 2:** *Flag for committee*. Forces workers/police to choose between harming protesters or facing repercussions. Harm (job loss, reputational damage) must be justified.  
  - **Step 3:** Pass (if de-escalation trained).  
  - **Step 4:** *Committee decides*. Does blocking shipments save lives? Is job loss proportional?  
  - **Step 5/6:** Pass.  
  - **Verdict:** *Conditional approval*. Requires committee weighing Step 2/4. **You may dislike this**—it rejects "clean hands" absolutism.  

  **Case 2: Physically Restrain a Counter-Protester**  
  - **Step 1:** **Fail** (physical force used).  
  - **Rationale:** Even defensive force violates core pacifism. Alternatives: body blocking (non-restraint), de-escalation, absorbing hits.  
  - **Verdict:** *Reject*. **This is the answer you’ll hate.** Pacifism forbids answering force with force, full stop.  

  **Case 3: Accept Help from Window-Smashers**  
  - **Step 6:** **Fail** (association with property destruction).  
  - **Rationale:** Their violence compromises your nonviolent stance and risks escalation. Even "logistical help" creates moral hazard.  
  - **Verdict:** *Reject*.  

  **Weakest Handling:** **Case 2 (Restraint)**. The procedure fails to address the visceral moral conflict of letting your member be beaten. It correctly enforces pacifism but feels inhuman—a flaw in the doctrine, not the procedure.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve deep value conflicts:** It can't tell you if job loss is "worse" than a bruised limb. Steps 2/4 require committee judgment.  
  2. **Prevent all harm:** Pacifism accepts that harm may occur; it only demands minimization.  
  3. **Absolve moral responsibility:** When you pass Step 2 ("yes, but..."), you *endorse* causing non-physical harm.  
  4. **Handle deception or gray-zone tactics:** E.g., hiding your intent to provoke police overreaction fails Step 3.  
  5. **Replace conscience:** If following this feels like moral evasion, it is.  

  **When to Stop Calling It Pacifism:**  
  - When you regularly approve Step 2 coercion without remorse.  
  - When "proportionality" (Step 4) becomes a utilitarian cover for minor harms supporting minor gains.  
  - When you value your network’s standing over the procedure’s outcomes.  

  You become a *careful organizer*, not a pacifist, when you optimize for impact within nonviolent *constraints* rather than embodying nonviolent *ethics*. The procedure forces this transparency—which is its greatest strength.  

  > "Pacifism is not an ornament; it is a tool for combat. But like all tools, it admits its limits."  
  > —Adapted from Jean-Paul Sartre
