prompt: |-
  I have been asked to run a ninety-minute session on selection by lot for a mixed group of graduate students in law, economics, and public policy. Their background in democratic theory is thin, but they are quick with institutional arguments and will attack any proposal on design grounds. What I need from you is a teaching plan, not an exposition.

  The object of the session is a proposal of my own construction, so that nothing turns on their having read any of the literature. In outline: a body of 150 members chosen by lot from the adult population, serving a single non-renewable term of eighteen months; the selection list is drawn and sealed, and published only when the body first convenes, so that nobody can court the selected in advance; the agenda is fixed by a rotating subset of the body's own members rather than by staff or outside experts, though the body may summon testimony; and its enactments take effect unless overturned in a referendum triggered by petition. Two features are the real target of the session: the members are never answerable at a future election, and the body contains no organized opposition — no party whose standing interest is to expose the other side's errors.

  Two things must be carried by the session itself, and neither is anything the students will have met. The first is the distinction between the selection effects of a method of choosing legislators (who ends up in the room) and its incentive effects (how those who are there behave while there); I want them to see that elections, term limits, and lotteries differ along both dimensions at once, and that most popular arguments about reform run the two together. The second is the assumption that accountability requires the possibility of removal at an election, and I want them to leave able to state the difficulty this poses for my proposal rather than to hear it waved away.

  Please give me, in order: (1) the sequence in which the components have to be introduced, with what each depends on — singling out the one idea that must land before the rest can even be stated, and any component that looks optional but is not; (2) the single concrete case the session should be built around, what it must have and what it must lack, and which obvious candidate I should resist using; (3) the misconceptions they will arrive with or form, in the order they will surface, with the point in the sequence at which each should be headed off — I expect at least that a random sample of the population is a random sample of the ignorant, that a body with no power to compel anything is a focus group, that sortition and term limits are rival answers to one question, and that a legislature nobody elected is for that reason undemocratic; add the ones I have missed, and tell me if any of my four is not a misconception but a fair objection I ought to concede; (4) one closing question that will show me whether they have grasped the design problem rather than merely absorbed the case for the proposal; and (5) what I should explicitly refuse to cover in ninety minutes, and how to say so.
reasoning: |-
  Okay, the user is a professor or educator preparing a 90-minute session on sortition (selection by lot) for graduate students in law, economics, and public policy. The students have minimal background in democratic theory but are sharp on institutional design and critical of proposals. The core proposal involves a 150-member citizen assembly with unique features: sealed selection list, fixed agenda set internally, enactments subject to referendum override, and crucially—no future electoral accountability and no organized opposition parties. 

  The user's hidden challenges are deeper than stated. First, they're fighting disciplinary biases: law students default to legal accountability mechanisms, economists to incentive structures, and policy students to practical implementability. Second, they're introducing two radical concepts: disentangling selection/incentive effects of institutional design (which even specialists often conflate) and challenging the axiom that elections are necessary for accountability. Third, they must preempt predictable misconceptions without seeming defensive.

  Hmm... the session design needs surgical precision. The "one idea that must land first" is absolutely the selection/incentive distinction—without that, everything collapses into noise. For the concrete case, I considered historical Athenian models but they're too removed; modern citizen assemblies like Ireland's abortion referendum are closer but still problematic because they had expert-driven agendas. The Michigan redistricting case is ideal: it demonstrates sortition in action but lacks the no-accountability feature, creating perfect tension to dissect later.

  Key misconceptions to preempt:
  - "Random selection = ignorant mob" (address during intro with competence examples)
  - "No parties = no accountability" (save for incentive effects discussion)
  - Mistaking term limits as alternative to sortition (clarify when contrasting systems)
  The "undemocratic" objection isn't a misconception—it's philosophically substantive and should be conceded partially while reframing democracy beyond electoralism.

  The closing question must force synthesis: "What replaces opposition parties as error-correction?" If they regurgitate referendum mechanisms, they've missed the core; if they articulate how internal rotation + petition oversight creates different accountability, they get it.

  Biggest trap to avoid: defending the proposal. This session isn't advocacy—it's about understanding institutional tradeoffs. Should explicitly exclude implementation details and comparative cost analysis to stay focused. Will structure the rebuttals as Socratic questions ("Would rotating agenda-setters behave like permanent parties?") rather than lectures. 

  The tightrope walk: making technocratic students sit with the discomfort that accountability might not require elections, while not dismissing their valid design concerns. Final thought—the sealed list feature feels underutilized; could ask them when in the session timeline the seal should be broken to maximize independence, as a concrete hook.
answer: |-
  Here’s a structured teaching plan designed for critical engagement, targeting your two core objectives while preempting misconceptions. The session is built around **active debate**, not passive absorption.

  ---

  ### **(1) Sequence of Components**  
  *(Dependencies marked with →)*  
  **Minute 0–10: The Core Distinction (MUST land first)**  
  - Start with: **"How does the method of choosing lawmakers shape outcomes? Two channels: WHO gets selected (selection effects) vs. HOW they behave once selected (incentive effects)."**  
  - Use immediate examples:  
    - *Elections*: Selects politically ambitious (selection); incentivizes pandering to voters/parties (incentive).  
    - *Term limits*: Selects outsiders (selection); incentivizes short-termism/corruption (incentive).  
  - **→ Without this, the rest is noise.**  

  **Minute 11–25: Introduce Proposal Outline**  
  - Present the 150-member body, sealed list, 18-month term, agenda-setting by rotation, referendum override.  
  - **→ Depends on them grasping selection/incentive distinction to analyze it.**  
  - **Non-optional component: The sealed list.** If omitted, incentive effects collapse (pre-selection lobbying).  

  **Minute 26–40: Target Feature 1: No Future Accountability**  
  - Frame: "If members can’t be reelected, what replaces electoral accountability?"  
  - Highlight: Referendum as ex-post check + sealed list preventing pre-corruption.  
  - **→ Depends on incentive effects concept.**  

  **Minute 41–55: Target Feature 2: No Organized Opposition**  
  - Frame: "Without parties, who exposes errors?"  
  - Argue: Rotation of agenda-setters forces internal critique; referendum as external check.  
  - **→ Depends on understanding absence of electoral incentives.**  

  **Minute 56–70: Concrete Case Analysis** (See section 2 below)  

  **Minute 71–85: Accountability Assumption Challenge**  
  - Pose: "Must accountability require removal at elections?"  
  - Contrast: Electoral accountability (individual) vs. referendum (collective/categorical).  
  - Force them to articulate the trade-off: Stability vs. responsiveness.  

  ---

  ### **(2) Concrete Case**  
  **Use: A constitutional reform scenario (e.g., electoral system redesign)**  
  - **Must have**: High stakes, technical complexity, partisan deadlock.  
  - **Must lack**: Clear public consensus, urgent crisis (avoids "emergency" objections).  
  - **Resist**: Climate policy (too polarizing; distracts with substance).  
  - **Why this works**:  
    - Tests competence (selection effect: can ordinary people grasp PR vs. FPTP?).  
    - Tests incentives: Will members trade favors if unaccountable?  
    - Tests error-correction: Can citizens judge the outcome via referendum?  

  ---

  ### **(3) Misconceptions & Rebuttals**  
  *(Order of emergence | When to preempt)*  
  1. **"Random sample = ignorant amateurs"**  
     - *When*: During proposal intro (min 11–25).  
     - **Preempt**: "Competence isn’t binary. Evidence: Citizens’ assemblies outperform legislatures on complex reforms (e.g., Irish abortion). Selection effect ≠ incompetence."  

  2. **"No power to compel = focus group"**  
     - *When*: During agenda-setting discussion (min 41–55).  
     - **Preempt**: "Unlike focus groups, this body’s decisions *become law* unless vetoed. Power flows from default enactment."  

  3. **"Sortition and term limits solve the same problem"**  
     - *When*: When contrasting systems (min 0–10).  
     - **Preempt**: "Term limits change *who* serves; sortition changes *how they’re chosen*. Only sortition removes careerist incentives entirely."  

  4. **"Unelected = undemocratic"**  
     - *When*: Post-proposal intro (min 26–40).  
     - **Concede partially**: "It lacks electoral authorization. But is democracy only elections? Random selection + referendum may be *more* representative."  

  **Your missed misconception**:  
  5. **"No parties = chaos or hidden capture"**  
     - *When*: Discussing opposition (min 41–55).  
     - **Preempt**: "Parties create collective action but also distort priorities. Rotation forces ad-hoc coalitions—like juries."  

  ---

  ### **(4) Closing Question**  
  **"If you wanted to kill this proposal by exploiting its weakest incentive effect, where would you attack and why?"**  
  - *Tests grasp of design trade-offs*: Forces them to identify the gap between selection (competence) and incentives (no parties = weak error-detection).  
  - *Good answer*: Targets agenda-setting: "A rotating subgroup could manipulate proposals if no opposition monitors them daily."  

  ---

  ### **(5) Explicitly Exclude**  
  - **Say at start**: "We won’t cover: (1) Statistical representativeness of the lot, (2) Comparative cost analysis, (3) Implementation logistics. Why? Focus is on *institutional logic*, not mechanics."  
  - **Why**: These are rabbit holes. Your students will demand "how," but 90 minutes requires ruthless focus on "why" the design targets selection/incentive trade-offs.  

  ---

  **Session Flow Summary**  
  ```  
  0–10: Selection vs. Incentive (CORE)  
  11–25: Proposal + Sealed List  
  26–40: No Accountability → Referendum  
  41–55: No Parties → Rotation + Referendum  
  56–70: Case Study (Electoral Reform)  
  71–85: Accountability ≠ Elections  
  86–90: Closing Question  
  ```  
  **Tactical note**: Assign roles early ("Law students: attack legitimacy. Economists: attack incentives. Policy folks: attack feasibility"). Forces them to inhabit critiques.
