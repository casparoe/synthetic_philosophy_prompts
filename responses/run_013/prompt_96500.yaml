prompt: |-
  I have no formal training in philosophy or in economics and no academic affiliation, but I have spent two years reading on my own about procrastination and self-control, and next month I am moderating the audience Q&A after a public lecture by a philosopher-economist whose settled position is that the traditional topic of weakness of will is best handled as time-inconsistent preference — a hyperbolic discount curve that makes the near term weigh more heavily than the far term — and that talk of acting against one's better judgment is a colorful redescription of a preference reversal rather than a phenomenon requiring its own explanation. Treat her as the defender of that position stated in its strongest form; you do not need to know anything about her beyond what I have just said.

  Please take the role of a philosopher working at the intersection of action theory and behavioral economics, and also of a coach preparing someone to conduct a demanding interview. Begin by thinking carefully, in your own notes, about what the strongest version of her position is and where a model built out of preferences over dated outcomes genuinely runs out of resources — I would rather have two or three real pressure points than ten shallow ones — and only then draft the questions.

  Draft eight to ten numbered questions, each followed by a follow-up keyed to the answer she is most likely to give, so that I am not left holding a follow-up that misses. After each question, add one bracketed line telling me what that question is designed to expose. The questions must turn on the content of her view: do not ask her to summarize it, do not ask how she came to it, and do not ask anything that would fit any guest on any topic. Do not give me reading lists, citations, or suggestions for further reading — I have no use for them, and she will supply her own.

  Include at least one question on each of the following, and make them as sharp as the material allows. Some of these will naturally yield more than one question.

  1. The case where preference and judgment agree and the action still fails. Suppose that at eight in the evening she both ranks the work above the television and judges that the work is worth doing, and then watches television anyway. A discount curve has nothing to reverse here, because the near-term option is not preferred. Ask whether her account has any room for this case, and whether it must redescribe it — as a failure to act on a ranking she held, or as a ranking she never really held — in a way that quietly reinstates the very thing she set out to eliminate. Follow up on whichever escape she takes.

  2. A distinction I have come to think matters, which I have not seen put this way. Call it shallow versus deep akrasia. In the shallow case the judgment is stable and loses. In the deep case the judgment itself flips at the moment of action: at eight in the evening she sincerely ranks the television above the work she sincerely ranked above it that morning, and the next morning she regards the previous evening's ranking not merely as different from her own but as corrupted. Ask what work "corrupted" is doing that "different" would not do, and whether her framework can make sense of the thought that one of the two rankings is a mistake rather than simply the other's successor. Follow up by pressing on whether a preference ordering can be criticizable by the very person who has it.

  3. A treatment that leaves the discount curve exactly as it is — the television still feels more attractive at eight in the evening — but removes the tendency to act on the pull, so that she works. Ask whether this person has acquired a stronger will or merely a different preference ordering, and whether her framework can tell those apart at all. Follow up on whichever answer she gives, especially if she says the two descriptions come to the same thing.

  4. Second-order preferences and commitment devices. If she hands her laptop to a neighbor for the evening, is that not evidence that she ranks her own rankings, so that there is a standpoint above the discount curve from which the curve is assessed and found wanting? Ask whether that higher standpoint is just another preference, and if so what stops the regress; then ask whether the person who binds herself is exercising self-control or outsourcing it, and whether her account makes the second look like weakness. Follow up on what she takes the regress point to show.

  5. Exploitability. Suppose someone knows the exact shape of her curve and offers a sequence of trades, each of which she prefers at the moment it is offered, leaving her worse off by her own later reckoning. Ask whether exposure to that counts as a defect of rationality or only as inconsistency, whether she thinks the two come apart in a way that matters, and what she would say about a person whose curve is unusual but perfectly consistent and who nevertheless describes herself as unable to do what she knows she should. Follow up accordingly.

  6. The self that is supposed to be weak. If she models the agent as a sequence of dated selves bargaining with one another, ask whether anything in that picture can be weak-willed as opposed to outvoted, and whether the picture loses the very thing that needs explaining — one agent divided against herself. Follow up on whether she is willing to call the divided-agent language a mere manner of speaking, and what would be lost if it were.

  7. The normative sting. Ask whether her view entails that the procrastinator is merely differently constituted rather than defective, and whether she accepts that consequence for the person who loses out by her own lights. Follow up on whether she thinks the word "defective" can be given any content once the discount curve is treated as just another parameter.

  Finally, tell me which single question you would open with and which you would save for last, and why.
reasoning: |-
  Okay, the user is preparing to moderate a Q&A with a philosopher-economist who views weakness of will as time-inconsistent preferences rather than a distinct phenomenon. They’ve spent two years researching procrastination and want incisive questions targeting conceptual pressure points.  

  First, I need to map their requirements:  
  - **Role**: I’m their philosopher-coach hybrid, sharpening objections while keeping questions interview-ready.  
  - **Constraints**: No summaries, no generic questions, no citations. All questions must surgically engage her stated position.  
  - **The 7 Themes**: Each must be covered, but distilled to 2-3 lethal points rather than scattering shots.  

  Now, dissecting her position’s vulnerabilities:  
  Her core claim is that hyperbolic discounting explains all "weakness" cases via preference reversals. The atomic unit is *preferences over dated outcomes*. Where this fractures:  
  1. **Cases without reversal** (their Point 1): If you act against a *stable* preference/judgment, her model must either deny the stability (smuggling in akrasia) or call it "implementation failure" (which feels like a dodge).  
  2. **Depth of judgment shift** (Point 2): When a past preference feels *corrupted*, not just different, her framework lacks tools to explain why one timestamped self gets normative privilege.  
  3. **Willpower vs. preference shifts** (Point 3): If two people have identical discount curves but one resists temptation, her model can’t distinguish "stronger will" from "altered preferences" without circularity.  
  4. **Regress in commitment** (Point 4): Binding future selves implies a *critic* of the discount curve. Calling this "just another preference" invites infinite regress ("who prefers the preferer?").  
  5. **Exploitability ≠ irrationality?** (Point 5): A consistent but steep discounter can be milked by predators. Her view must either call this rational (absurd) or admit discount curves can be defective independently of consistency.  
  6. **Agency fragmentation** (Point 6): The "sequence of selves" model erases the *single agent* feeling torn. If it’s just bargaining, "weakness" becomes incoherent.  
  7. **Normative emptiness** (Point 7): Reducing all to preferences risks saying the chronic procrastinator isn’t flawed—just "different." This dissolves the sting of self-reproach.  

  **Question Design Strategy**:  
  - Each question traps her in a dilemma: either her model collapses into the akrasia it rejects, or it bends into absurdity.  
  - Follow-ups anticipate her likeliest escape routes (e.g., if she calls evening-TV a "true preference," jump to corruption; if she cites implementation failure, press on what fails).  
  - Opening with **Q1** (agreement without action) is brutal because it’s the cleanest case where her model stumbles out of the gate. Saving **Q7** (normative sting) for last leaves the audience pondering the human cost of her view.  

  **User’s Unspoken Needs**:  
  They’re an autodidact facing an expert. Hidden asks:  
  - *Credibility*: Questions must sound professional without academic jargon.  
  - *Control*: Follow-ups prevent her from dodging.  
  - *Impact*: Expose contradictions that resonate with non-specialists.  
  I’ll avoid theory-deep dives; anchor everything in relatable examples (TV vs. work).  

  **Final Checks**:  
  - No fluff: 8 questions covering all 7 themes, with Q4 doing double duty (regress + commitment).  
  - Follow-ups are her probable replies’ kryptonite.  
  - Opening/closing flagged for tactical advantage.
answer: |-
  Here are 10 tightly constructed questions targeting conceptual pressure points in the time-inconsistent preference model. Each includes a follow-up pre-adapted to her probable response, and a bracketed note on the underlying aim. The questions prioritize depth over breadth, focusing on the core tensions you identified.

  ### Core Questions
  1. **Question:** When an agent stably prefers and judges option A (work) over B (TV) *at the moment of choice*, yet chooses B, your model seems to lack resources—there’s no preference reversal to discount. Must you deny that the preference/judgment was truly held at t=8pm, or treat this as mere "implementation failure"?  
     *Likely Answer:* She’ll assert the preference wasn’t operative at t=8pm or redefine it as a failed "action step."  
     **Follow-up:** If you deny the stable preference, aren’t you smuggling in akrasia—an agent *failing to enact* their own ranking—which your model explicitly rejects? If it’s implementation failure, what fails if not the will?  
     [*Target: Exposes residual akrasia in "stable preference" cases where discounting doesn’t apply.*]

  2. **Question:** In "deep akrasia," the agent at t=8pm *sincerely* ranks TV > work, but at t=8am sees that ranking as "corrupted," not merely different. Can your model explain this normative self-reproach without appealing to a mistake *in the preference itself*?  
     *Likely Answer:* She’ll say preferences are context-dependent, so morning/evening selves simply have different legitimate rankings.  
     **Follow-up:** When the morning self calls the evening preference "corrupted," isn’t she claiming it misrepresents her *enduring values*? If all preferences are just dated outcomes, how can one self *criticize* another’s preference as defective rather than different?  
     [*Target: Tests if preference-time-location can handle normative self-dissociation.*]

  3. **Question:** Suppose two agents have identical hyperbolic discount curves. At t=8pm, both prefer TV > work. Agent A acts on this; Agent B overrides it and works. Does your framework allow that B has stronger willpower, or must you say B’s preferences *changed*?  
     *Likely Answer:* She’ll say B’s action reveals a different effective preference (e.g., via meta-preferences).  
     **Follow-up:** If overriding a discount curve requires altered preferences, doesn’t that collapse the distinction between *resisting* a preference and *not having it*? What then distinguishes willpower from preference flux?  
     [*Target: Challenges conflation of will with preference revision.*]

  4. **Question:** When an agent uses commitment devices (e.g., locking away the TV remote), is this evidence of a second-order preference that *ranks her own discount curve as flawed*?  
     *Likely Answer:* She’ll call it a higher-order preference to avoid future temptations.  
     **Follow-up:** If this higher-order preference is just another entry in the discount curve, what stops an infinite regress? And when she binds her future self, is she exercising self-control or admitting weakness by outsourcing it?  
     [*Target: Presses on whether commitment requires a vantage point outside the curve.*]

  5. **Question:** Consider an agent with steep but consistent hyperbolic discounting. A predator offers a series of trades she prefers at each offer point, leaving her worse off by her own long-term standards. Is this agent irrational or merely consistent?  
     *Likely Answer:* She’ll say "consistent but instrumentally irrational if her long-term goals are undermined."  
     **Follow-up:** If she’s instrumentally irrational despite preference consistency, doesn’t that imply a *defect in the discount curve itself*? How can that defect be captured without referencing a "truer" judgment?  
     [*Target: Forces apart consistency and rationality to expose normative lack.*]

  6. **Question:** You model the agent as time-slices bargaining. In this picture, can any self be "weak-willed," or only outvoted by later selves?  
     *Likely Answer:* She’ll say weakness is just being outvoted by temporally dominant preferences.  
     **Follow-up:** Does this reduce "I betrayed myself" to "my past self lost the vote"? If so, doesn’t it erase the phenomenology of a *single self* divided against itself—precisely what weakness of will explanations try to capture?  
     [*Target: Questions whether fragmented selves can model agential unity/failure.*]

  7. **Question:** Your view implies the chronic procrastinator isn’t defective—just differently discounted. Do you endorse that consequence for someone who repeatedly undermines their own deeply held goals?  
     *Likely Answer:* She’ll say "defective" is relative to goals; if goals change, no defect exists.  
     **Follow-up:** If the agent *endorses* her long-term goals as her "real" ones while lamenting her short-term choices, can your model explain the self-accusation ("I’m flawed") without conceding a non-preferential standard?  
     [*Target: Tests normative bite—can "defect" be more than preference variance?*]

  ### Supplemental Questions (Covering Blinds Spots)
  8. **Question:** In cases of deep akrasia, the agent feels her judgment "flips" under temptation. Can hyperbolic discounting distinguish this from a calm, rational reassessment of options?  
     *Likely Answer:* She’ll say no—both are preference updates.  
     **Follow-up:** When the agent says "I knew it was wrong even as I did it," isn’t she reporting a *concurrent conflict* your model flattens into a unitary preference?  
     [*Target: Highlights absence of simultaneous conflicting attitudes.*]

  9. **Question:** If an agent’s discount curve is shaped by serotonin levels (e.g., depression), is her "preference reversal" meaningfully different from a biochemical glitch?  
     *Likely Answer:* She’ll say all preferences have biological substrates.  
     **Follow-up:** Does this imply that *no* preference can be "distorted"? If so, how do we explain therapeutic efforts to recalibrate discounting?  
     [*Target: Presses on the normative status of biologically altered preferences.*]

  10. **Question:** Can your model distinguish between weakness of will and simple ignorance? (e.g., not working because you underestimate task duration vs. knowing but succumbing).  
      *Likely Answer:* She’ll say both are preference-based; ignorance alters outcome valuation.  
      **Follow-up:** In the knowledge-but-succumbing case, doesn’t the agent feel her *character* is implicated in a way ignorance isn’t? Does your account lose that distinction?  
      [*Target: Exposes potential reduction of character-failure to epistemic/valuational error.*]

  ---

  ### Strategic Sequencing
  - **Open with Question 1 (stable preference/judgment failure)**. It’s the most direct challenge: her model has *no obvious mechanism* for this case. This forces her to reveal her hand early (e.g., "preference wasn’t real" vs. "implementation failure"), setting up later critiques of circularity or residual akrasia. It also grounds the debate in intuitive experience.  
  - **Close with Question 7 (normative sting)**. Ending on whether procrastinators are "merely different" leaves the audience with the human cost of her view. It’s existentially resonant and underscores the core tension: if her model is right, self-reproach is irrational—which feels unsatisfying. This frames the Q&A’s stakes vividly.  

  **Why this works**: Each question isolates a fracture point where preference-redescription either contradicts lived experience, demands circularity, or dissolves normativity. The follow-ups block easy escapes by anticipating her conceptual toolkit. No warm-ups, no biography—just steel-on-steel engagement with the model’s limits.
