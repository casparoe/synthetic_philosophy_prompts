answer: |-
  ## Decision Memo: Grant Allocation for Final FY2024-25 Cycle  
  **To:** Grants Committee  
  **From:** [Your Name], Trustee  
  **Date:** 15 October 2024  
  **Subject:** Recommendation for Final Allocation (£800k) – Proposal A vs. Proposal B  

  ### 1. Context  
  This memo addresses the final grant allocation (£800k available) before our 2026 strategy review. Two proposals remain:  
  - **Proposal A (£400k):** Established public-health programme. Proven track record, robust third-party evaluation, predictable outcomes (e.g., 5,000 QALYs gained). Cost-effectiveness: £80 per QALY.  
  - **Proposal B (£400k):** Early-stage research aiming for "civilisational-scale" impact (e.g., catastrophe aversion, billion-person disease cure). Applicants estimate a 1-in-1-billion chance of success, claiming expected value (EV) vastly exceeds Proposal A’s. Acknowledge significant uncertainty: no mechanism demonstration, subjective probability assessment.  

  Committee division centres on whether to prioritise **mathematical EV (Proposal B)** or **robustness & avoid "mugging" (Proposal A)**.  

  ---

  ### 2. Steelmanning Both Positions  
  *(Presented neutrally for committee deliberation)*  

  **Position 1: Fund Proposal B (Prioritise Expected Value)**  
  - *Core Argument:* Rational allocation requires maximising expected value. If Proposal B’s own estimate (1-in-1-billion chance of outcome worth 1 billion+ QALYs) is accepted, its EV dwarfs Proposal A’s (~1,000 QALYs vs. ~1,000,000,000 QALYs). Ignoring this due to discomfort with large numbers or small probabilities is irrational and negligent.  
  - *Strength:* Formally unimpeachable under standard EV maximisation. Dismissing astronomical stakes because probabilities are small could blind us to genuinely transformative opportunities (e.g., early pandemic warning systems).  
  - *Rebuttal to "Mugging" Concern:* Not all low-p/high-impact claims are equal. Proposal B comes from a credible (though small) research group, not an anonymous crank. A blanket refusal to engage with low-probability/high-impact claims is epistemically closed.  

  **Position 2: Fund Proposal A (Prioritise Robustness & Pragmatism)**  
  - *Core Argument:* Grant-making requires accountable stewardship of finite resources. Proposal B’s probability estimate (1-in-1-billion) is non-falsifiable, unverifiable, and lacks demonstrated mechanism. Accepting it opens the door to "Pascal's Mugging" – where any applicant can demand funding by citing arbitrarily large hypothetical utilities multiplied by arbitrarily small, self-assessed probabilities. This paralyzes effective philanthropy.  
  - *Strength:* Protects against exploitation and misallocation based on speculative numbers. Ensures funding delivers tangible, accountable good. Aligns with our duty to beneficiaries who need help *now*.  
  - *Rebuttal to EV Argument:* Expected Value theory assumes probabilities and utilities are reliable inputs. When probabilities are effectively conjectural (like 1-in-1-billion for an undefined mechanism), the EV calculation is GIGO ("Garbage In, Garbage Out"). True rationality requires epistemic humility about unknowable probabilities.  

  ---

  ### 3. Analysis & Principled Framework  
  The core tension is between **theoretical rationality (EV maximisation)** and **practical rationality (managing epistemic risk and avoiding exploitation)**.  

  * **Why Raw EV Fails Here:** EV is a powerful tool, but it relies on *credible* probability estimates. A probability like 1-in-1-billion for an unprecedented outcome, offered without independent verification or demonstrated feasibility, lacks the necessary epistemic foundation. Treating it as equivalent to a well-established probability (like a clinical trial result) is a category error. *(Confidence: High. Supported by decision theory critiques like Bostrom's "Pascal's Mugging" resolution & Ord's work on cluelessness.)*  

  * **A Defensible Principled Rule (Epistemic Threshold):**  
      > **"The Foundation will not factor in claimed expected value benefits derived from outcome scenarios assigned a self-estimated probability below a minimum threshold of plausibility (e.g., 1-in-10-million *or less*), unless the probability estimate can be independently scrutinised and grounded in demonstrated mechanism or robust, replicable models."**  
      *   **Rationale:** This avoids dismissing high-impact/low-probability claims *a priori* (e.g., credible asteroid deflection research at 1-in-100,000 might pass), while setting a defensible boundary against unfalsifiable speculation. It prioritises **knowability** and **accountability** over raw arithmetic.  
      *   **Why it's not just "refusing arithmetic":** It addresses the *quality* of the probability input. We require probabilities above this threshold to be based on evidence allowing meaningful expert challenge – not just applicant assertion. Proposal B’s 1-in-1-billion estimate, lacking mechanism or independent verification, falls below this threshold. *(Confidence: Moderate-High. This synthesises common sense with philosophical responses to mugging. The *exact* threshold (1-in-10-million?) is the least certain element – see Section 6.)*  

  * **Lexical Priority?** While intuitively appealing ("fund the sure good first"), a strict lexical priority rule is too rigid. It would prevent funding genuinely promising, moderate-probability moonshots (e.g., 5% chance of a transformative clean energy breakthrough). Our Epistemic Threshold rule is superior as it allows engagement with high-impact projects *if* they meet a minimum standard of demonstrable plausibility.  

  ---

  ### 4. Recommendation & Action Plan  
  **Recommendation:** Fund Proposal A in full (£400k). Do not fund Proposal B at this time.  

  *   **Reasoning Applying the Epistemic Threshold:**  
      1.  Proposal A delivers known, significant, accountable good with high certainty.  
      2.  Proposal B’s claimed EV relies entirely on a self-assessed probability (1-in-1-billion) that is:  
          *   Far below our proposed plausibility threshold (1-in-10-million).  
          *   Not independently verifiable.  
          *   Not grounded in a demonstrated mechanism.  
      3.  Therefore, Proposal B’s claimed EV cannot be responsibly factored into our decision calculus. Its funding case rests on speculative potential we lack the means to reliably evaluate. Funding it under these conditions would set an unsustainable precedent.  

  *   **Response to Losing Positions:**  
      *   **To EV Proponents:** We agree EV maximisation is the goal *when probabilities are credible*. Here, the input probability lacks the epistemic robustness necessary for EV calculation. Funding based on such speculative numbers risks diverting resources not just from Proposal A, but from *future* credible high-EV opportunities meeting our Epistemic Threshold. Our duty includes safeguarding the foundation’s process against unfalsifiable claims.  
      *   **To Robustness Proponents:** We agree funding Proposal B as presented risks "mugging". However, we reject a blanket ban on low-p/high-impact proposals. Our Epistemic Threshold rule provides a principled, actionable standard for evaluating future such proposals based on demonstrable plausibility.  

  *   **Concrete Action & Timeline:**  
      1.  **Allocate £400k to Proposal A** (Public Health Programme) immediately upon committee approval (Target: 1 November 2024).  
      2.  **Formally adopt the "Epistemic Threshold Rule"** (as defined in Section 3) as interim guidance for the final 18 months of the current strategy period. Circulate draft wording for committee ratification at the next meeting (Target: November 2024 meeting).  
      3.  **Engage with Proposal B Team:** Inform them of the decision and the new Epistemic Threshold Rule. State that while the current proposal falls below the threshold, we encourage resubmission *if* they can:  
          *   Develop a demonstrable mechanism or prototype.  
          *   Substantiate their probability estimate via peer-reviewed modelling or independent expert assessment.  
          Offer a £10k feasibility grant (from contingency funds) to support this preparatory work for a potential future application. *(Confidence in this offer: Moderate - see Section 6).*  
      4.  **Strategy Review (2026):** Embed and refine the Epistemic Threshold Rule within the new strategy, potentially specifying clearer parameters (e.g., defining "independently scrutinised", refining the threshold value based on experience).  

  ---

  ### 5. Conclusion  
  Proposal A represents responsible stewardship, delivering guaranteed significant benefit. Proposal B, while ambitious, currently relies on probabilities too speculative and unverifiable to meet a defensible standard for grant allocation. Adopting the Epistemic Threshold Rule provides a clear, principled framework for navigating similar high-uncertainty/high-impact proposals in the future, balancing openness to transformation with protection against unfalsifiable claims.  

  ---

  ### 6. Confidence & Uncertainty Assessment  
  *   **High Confidence:**  
      *   Raw EV maximisation fails with unverifiable, extremely low probabilities.  
      *   A rule based on epistemic robustness (like the Epistemic Threshold) is necessary and defensible.  
      *   Funding Proposal A is the correct decision under this framework.  
  *   **Moderate Confidence:**  
      *   The *specific* threshold (1-in-10-million) is pragmatically chosen but somewhat arbitrary. Future refinement is likely. The *principle* (requiring independently scrutable plausibility) is robust.  
      *   The response to the EV proponent (focusing on process protection for future credible EV) is strong.  
  *   **Lower Confidence (Area requiring most judgement):**  
      *   The **£10k feasibility grant offer to Proposal B**. Is it a constructive gesture encouraging better evidence, or does it undermine the core decision by rewarding speculation? I lean towards it being worthwhile engagement (£10k is marginal within £2m/year) that signals our seriousness about the *principle* if evidence improves, but acknowledge the risk it could be seen as a fudge. Committee discussion on this point is crucial.  

  This memo provides a clear, actionable recommendation grounded in decision theory under deep uncertainty, while establishing a replicable framework for future committees. I welcome robust discussion on the Epistemic Threshold Rule and the feasibility grant proposal.  

  **[Your Name]**  
  Trustee, [Foundation Name]
