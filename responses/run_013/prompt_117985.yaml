answer: |-
  Here’s a complete exam package tailored to your specifications:

  **Exam Question:**  
  "Popper initially dismissed Darwinism as 'almost tautological' and unfalsifiable, later recanting this view while still calling it a 'metaphysical research programme'. Analyze what this episode reveals about the *internal consistency* of Popper’s philosophy of science. Specifically:  
  (a) Why was the 'tautology' charge a serious problem *for Popper’s own criteria*, and which aspect of Darwinism was it targeting?  
  (b) Is calling Darwinism 'metaphysical' a criticism in Popper’s framework? Justify your answer.  
  (c) Does Popper’s later solution – testing selection claims via 'situational logic' analysis of an organism’s environment and behaviors – successfully resolve his initial objections, or is it an ad hoc patch? In your response, engage with Popper’s underappreciated claim that organisms’ active preferences can *reshape* their selection pressures."

  ---

  **Model Answer (Strong Student, ~600 words):**  
  Popper’s engagement with Darwinism exposes tensions within falsificationism while clarifying his view of scientific progress. His initial critique targeted *natural selection’s explanatory mechanism*, not evolution’s occurrence. He argued that "survival of the fittest" risked tautology: if "fittest" just means "those who survive," the theory explains nothing. This was devastating *for Popper* because it meant Darwinism couldn’t make risky predictions – core to his demarcation criterion. If any outcome could be post-hoc explained by selection, the theory was immunized against falsification.

  Crucially, Popper *did not* equate "metaphysical" with meaningless or unscientific. For him, metaphysical frameworks (like atomism) could be fruitful and rational, guiding empirical research. Calling Darwinism a "metaphysical research programme" *after* his recantation acknowledged its role in generating testable theories (e.g., specific adaptation hypotheses) without being directly testable itself. This wasn’t a demotion but a recognition of its heuristic power – aligning with his view that science often starts with metaphysical ideas.

  Popper’s "solution" – analyzing selection via *situational logic* – is more than an ad hoc patch; it’s a coherent application of his methodology. He conceded that the *core principle* of selection might be near-tautological when stated universally, but argued that *specific applications* become testable when we model the organism’s "situation": its environment, challenges, existing traits, and crucially, its *active behaviors and preferences*. This shifts the focus to constructing testable models of how specific traits solve specific problems in a defined context. For instance, testing whether finch beak variations confer survival advantages *under observed drought conditions* is falsifiable.

  The most significant, yet overlooked, element is Popper’s insistence that organisms aren’t passive. Their preferences (e.g., habitat choice, mating behaviors) actively modify the selection pressures they face. This isn’t just an addendum; it fundamentally shapes the "situation" being analyzed. A theory predicting selection pressure X might be falsified if organisms migrate to avoid X, altering their selective environment. This introduces genuine testability: models must account for behavioral feedback loops.

  While this resolves the *strict* tautology charge by grounding selection in contingent, analyzable situations, it reveals a deeper tension. Falsificationism emphasizes bold, universal theories, but Popper’s solution makes Darwinism testable only through piecemeal, contextual models. This leans toward Lakatos’ view of research programmes. However, it coheres with Popper’s later emphasis on problem-solving. The episode shows Popper refining falsificationism to accommodate historical sciences, where testing occurs via situational reconstruction, not universal laws. His recantation conceded the testability of *specific* selection mechanisms, not the unfalsifiable status of the *core programme* guiding them.

  ---

  **Marking Scheme (Total: 20 Points):**  
  *(Must-hit points, 4 points each; deductions for major errors)*

  1.  **Accuracy on Tautology Charge & Target (4 pts):**  
      *   **A:** Correctly identifies the target as *natural selection's explanatory mechanism* (specifically "fitness" definition), NOT evolution's facticity. Explains why tautology undermines falsifiability (no risky predictions).  
      *   **Common Error:** Claiming Popper denied evolution happened or that the charge applied to common descent.

  2.  **Analysis of 'Metaphysical' Status (4 pts):**  
      *   **A:** Clearly states it is *not* pejorative for Popper; explains metaphysical programmes as heuristically vital, rational frameworks guiding testable science. Cites his examples (atomism).  
      *   **Common Error:** Equating "metaphysical" with "meaningless," "unscientific," or "pseudoscience" in Popper's system.

  3.  **Scope of Recantation (4 pts):**  
      *   **A:** Distinguishes concession: Darwinism *as a whole programme* remains metaphysical/indirectly testable, BUT *specific selection hypotheses* can be tested (situational logic). It's a refinement, not total surrender.  
      *   **Common Error:** Framing recantation as Popper admitting Darwinism is fully falsifiable like physics, or that he abandoned all criticism.

  4.  **Evaluation of Situational Logic Solution (4 pts):**  
      *   **A:** Assesses it as a *coherent development* (not mere patch) within Popper's philosophy (problem-solving, model-building). Acknowledges tension (shift from universal laws) but argues it provides a falsificationist methodology for historical claims.  
      *   **Common Error:** Dismissing it outright as "ad hoc" without engagement, or uncritically accepting it as a perfect fix.

  5.  **Integration of Organism Activity (4 pts):**  
      *   **A:** Explicitly incorporates Popper's key (underdiscussed) point: organisms' *active preferences/behaviors* (e.g., niche construction) *reshape* the selection pressures, making them part of the "situation" and crucial for testability. Shows how this deepens the analysis.  
      *   **Common Error:** Ignoring this element entirely or mentioning it only superficially without explaining its role in testability.

  **Major Howlers (Automatic Deductions - Apply *once* per type per essay):**  
  *   **-2 pts:** Claiming Popper initially denied evolution occurred or that common descent was unfalsifiable/tautological.  
  *   **-2 pts:** Treating "metaphysical" in Popper's later view as synonymous with "meaningless," "unscientific," or "pseudoscientific" (confusing it with logical positivism).  
  *   **-2 pts:** Stating the recantation was *solely* due to social pressure from biologists, without philosophical argument.

  **Grading Summary:**  
  *   **18-20 (A):** Hits all 5 must-hit points clearly and accurately. Integrates organism activity meaningfully. No howlers. Shows sophisticated understanding of tensions/refinements.  
  *   **16-17 (A-):** Hits all 5 points, but perhaps less developed on one (e.g., organism activity). Or minor inaccuracies. No howlers.  
  *   **14-15 (B+):** Hits 4/5 points well, or hits all 5 but with significant weakness in one area (e.g., superficial on scope of recantation or situational logic). Avoids howlers.  
  *   **12-13 (B):** Hits 3/5 points well. May contain one minor howler (-2) or significant weakness in two areas.  
  *   **10-11 (C+):** Hits 2/5 points. Likely contains a major howler or significant misunderstanding of core concepts (e.g., conflates demarcation targets).  
  *   **<10 (C or below):** Misses most key points, contains major howlers, or fundamentally misrepresents Popper's views.

  ---

  **Why this works for your needs:**  
  1.  **Forces Analysis over Reportage:** The question explicitly asks about Popper's *internal consistency*, demanding evaluation of his moves, not just chronicling them.  
  2.  **Targets Wikipedia Traps:** The "tautology" and "metaphysical" elements are framed to require precise understanding, countering superficial readings.  
  3.  **Elevates the Underdiscussed:** Point (c) and the model answer heavily reward engagement with organismic activity reshaping selection.  
  4.  **Manages Scope:** Focuses on core philosophical moves (tautology, metaphysical status, recantation scope, situational logic solution) achievable in 90 mins.  
  5.  **Clear Grading Rubric:** The 5x4 structure with specified errors and howlers makes marking consistent and efficient, directly rewarding the depth you seek.  
  6.  **No Citation Hassles:** Relies purely on conceptual understanding of positions covered in lectures (Darwin College lecture, autobiography concepts explained).
