prompt: |-
  My cousin rides for a semi-pro cycling team and a couple months ago she got one of those Therapeutic Use Exemption forms approved so she can keep using her asthma inhaler, and honestly it's been bugging me ever since. The way the anti-doping system seems to work is that it bans a substance and then hands out permission slips for the same substance, and the only thing that changes is whether you've got a diagnosis on file — two riders, same inhaler, roughly the same dose, one of them is a patient and the other's a cheat. And once I started noticing that shape I saw it everywhere. Health insurance pays to fix a wrecked knee but not to upgrade a good one. A kid with an ADHD diagnosis gets extra time on the SAT and a kid who just wants extra time gets told no. Sports will let you get laser eye surgery to get to 20/20, but a lens that takes you past 20/20 is cheating. I'm in a medical ethics class right now and we read the standard therapy-versus-enhancement stuff, but the readings always present the line as if everyone already agrees where it sits, and I really don't think they do.

  So here's what I'd like you to do. Take the anti-doping exemption system as the main case (the other examples are just there for comparison) and tell me what philosophical commitments it actually presupposes. Does it need some notion of "normal" or species-typical functioning as the baseline — restoring you to normal is medicine, pushing you past it is doping? If so, whose normal is it: the individual athlete's own pre-treatment level, or a statistical average for humans? Because those come apart badly. Treating an asthmatic can leave her with better lung function than a rival who was never sick, and yet nobody strips the genetically gifted rider of her huge aerobic capacity, so the baseline clearly isn't equal-for-everyone. Is the practice committed to the idea that disease versus enhancement is a biological fact a doctor can just read off the body, or is it a social and normative judgement dressed up in clinical language? And does leaning on a diagnosis as the switch presuppose that medicine has a clean notion of "disorder" — and does it survive the fact that something like asthma is weirdly common among elite endurance athletes, which makes you wonder whether we're treating a disease there or just a body doing exactly what a body is supposed to do under that kind of load?

  Then, please, separate what the system strictly presupposes from what it merely happens to fit comfortably with — it might turn out to be compatible with several different accounts of where the therapy/enhancement line falls, and I want to know which ones and why. And tell me what would actually have to change in the rules if we swapped the presupposed view for a rival one: say a purely welfarist view that only cares whether the athlete is better or worse off, or a flat conventionalist view where "enhancement" just means whatever the rulebook says it means that year. Don't worry about citations, and don't sweat whether I've got every sports detail exactly right — I care about the philosophy, not the paperwork.
reasoning: |-
  Okay, the user is grappling with the philosophical underpinnings of the therapy-enhancement distinction in anti-doping regulations and medical ethics. They're clearly bothered by the arbitrariness of allowing therapeutic exemptions (TUEs) while banning the same substance for non-diagnosed athletes. Their examples—asthma inhalers, knee surgeries, ADHD accommodations, and vision correction—all highlight how the same intervention can be labeled differently based on documentation rather than biological reality. 

  Hmm, their medical ethics class seems to have triggered this frustration. They mention standard readings presenting the therapy/enhancement line as consensus when it's clearly not. That's astute—they've noticed how clinical language masks normative judgments. Their core question is brilliant: What philosophical commitments does this system *actually* rely on, beyond the surface-level "diagnosis = therapy" formula?

  Let me unpack their layered concerns:  
  First, the baseline problem. Anti-doping rules implicitly assume a "normal" functioning standard, but whose? Individual pre-illness state? Human species-typical? Neither works cleanly—treating asthma might leave an athlete *superior* to "healthy" competitors, and genetic advantages are never penalized. That exposes the baseline as unequal by design.  

  Second, the ontology question. Is disease a biological fact or social construct here? The asthma example is killer—its prevalence among elite cyclists suggests "disorder" might just be typical adaptation to extreme stress. Yet the system treats it as pathology because... well, because medicine says so? That's circular.  

  Third, they want to separate logical necessities from comfortable alignments. Smart. The TUE system *requires* a diagnostic gatekeeper role but could theoretically work with different definitions of "therapy" (e.g., welfarist or conventionalist). I should map how swapping philosophies would break or reshape the rules.  

  Their tone is analytically furious—they smell hypocrisy. Rightly so. The system privileges documented disadvantage while ignoring natural inequality. I’ll validate that intuition while dissecting its mechanics. No need for sports-policy nitpicking; they want the philosophy laid bare.  

  Key moves in response:  
  - Admit the baseline is normative, not biological. Cite the genetic advantage double standard.  
  - Show how medicalization becomes the moral laundering device.  
  - Contrast presuppositions with alternatives: welfarism would collapse TUE logic; conventionalism makes doping arbitrary.  
  - Highlight that "disorder" is doing heavy lifting—and buckling under weight like athlete asthma rates.  
  - Offer the performative insight: The system isn't drawing a line, it's *performing* authority through diagnosis.  

  Their examples reveal they're already spotting institutional contradictions. My job is to systematize that insight philosophically without jargon. They’ll appreciate the "moral taxidermy" metaphor—it crystallizes how we stuff messy biology into clean categories.
answer: |-
  You've hit on a profound tension in bioethics and anti-doping philosophy. Let's dissect the commitments of the Therapeutic Use Exemption (TUE) system, using your cycling example as the anchor:

  ### Core Philosophical Presuppositions:
  1. **Species-Typical Functioning as the Baseline**:  
     The system assumes a **normative baseline of "human biological normalcy"** (not statistical averages). Medicine aims to restore function to a *theoretical* species-typical range, while enhancement pushes beyond it. Crucially:  
     - Genetic advantages (e.g., high natural VO₂ max) are accepted as "natural lottery" luck.  
     - Pharmacological interventions that *mimic* those advantages are banned if they exceed baseline restoration.  
     - **Conflict:** Treating asthma *can* result in *above-baseline* function for that individual. The system accepts this asymmetry because it prioritizes *correcting deficit* over equalizing outcomes.

  2. **Medicalization as Moral Gatekeeping**:  
     Diagnosis transforms a substance from "doping" to "therapy." This presupposes:  
     - Disorders are **objective biomedical facts** discernible by medicine.  
     - The clinician's role is **descriptive** (identifying pathology), not **normative** (making value judgments about fairness).  
     - **Problem:** As you note, conditions like exercise-induced asthma blur this. Is it pathology or an expected physiological stress response? The system relies on medical *conventions* about what counts as disease.

  3. **The Moral Primacy of Therapy**:  
     Correcting a "deficit" is ethically imperative; enhancing "normal" function is morally suspect (risks coercion, undermines "human excellence," or alters identity). The TUE system embodies this hierarchy.

  ### What It *Doesn't* Strictly Require (But Leans On):
  - **Individualized Baselines?** No. Restoring *you* to *your* pre-illness state isn't required. An athlete treated for childhood asthma may have lungs superior to a rival with "normal" but mediocre function. The goal is species-typical function, not individual history.  
  - **Statistical Normality?** No. The baseline isn't an average. Many athletes function far above population averages naturally. The line is **normative** (what humans *ought* to be capable of without tech/meds), not statistical.  
  - **Equal Outcomes?** Emphatically no. The system accepts natural inequalities. Its concern is *artifice*, not fairness of distribution.

  ### Tensions and Fault Lines:
  - **The Asthma Paradox**: If elite athletes have higher rates of asthma/EIB, is this pathology or adaptation? The system must medicalize it to justify inhalers, but this medicalization is circular: prevalence in the population justifies diagnosis, which justifies exemptions. This looks like **concept-stretching** to accommodate practical needs.  
  - **"Normal" is a Moving Target**: As tech advances (e.g., gene editing), "therapy" could push far beyond current norms. Is curing muscular dystrophy therapy if it creates a super-athlete? The baseline isn't fixed.  
  - **Diagnosis as Social Ritual**: The TUE process turns a clinical judgment (itself value-laden) into a moral/legal switch. This **medicalizes fairness decisions**, outsourcing ethics to physicians.

  ### Alternative Frameworks & Consequences:
  1. **Welfarist View (Intervention = Good if Net Benefit)**:  
     - **Change:** Abandon TUEs. Allow any substance if it improves health/well-being without significant risk.  
     - **Consequence:** Asthma inhalers allowed for all. But also, ADHD meds for neurotypicals seeking focus, or EPO for altitude training. "Doping" vanishes; safety becomes the only limit. Sport becomes a biotech arms race.  

  2. **Conventionalist View ("Enhancement" = Rulebook Definition)**:  
     - **Change:** TUEs become pure bureaucracy. "Therapy" is whatever the governing body defines annually.  
     - **Consequence:** No appeal to nature/medicine. Asthmatics might lose exemptions if rules change. Doping rules reflect cultural preferences (e.g., banning new tech like neural implants arbitrarily).  

  3. **Human Flourishing View (Enhancement = Distorting "True" Excellence)**:  
     - **Change:** Ban anything that separates achievement from "authentic" effort/talent.  
     - **Consequence:** Laser eye surgery might be banned (as "artificial"), while asthma treatment requires proving it doesn't confer *net advantage* over peers. Subjective debates erupt over what constitutes "authentic" performance.  

  4. **Capabilities Approach (Focus on Enabling Core Functions)**:  
     - **Change:** TUEs allowed only for interventions enabling *basic function* (e.g., competing at all), not competitive advantage.  
     - **Consequence:** Asthmatics get inhalers to breathe normally, but if their treated lung function exceeds non-asthmatic peers, dosage might be capped. Requires quantifying "normal function" thresholds.  

  ### Why the Current System Persists:
  It navigates contradictions by **moral taxidermy**: stuffing the messy reality of biology (variable bodies, adaptive stresses, tech integration) into the preserved form of "naturalness" via diagnosis. The athlete's body is partitioned: "normal" biology (protected from artifice) vs. "diseased" biology (requiring artificial correction). This preserves sport as a **narrative of heroic naturalism** while accommodating medical necessity.

  **In essence**: The TUE system isn't built on coherent philosophy; it's a pragmatic compromise masking unresolved tensions between medicine's restorative ideal, sport's mythology of purity, and the body's refusal to fit neat categories. Your unease is warranted—it reveals the suture lines where biology, ethics, and culture are stitched together uncomfortably.
