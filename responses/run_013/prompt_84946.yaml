answer: |-
  ## The Mechanism's Edge

  The air in Room 4B hung thick and still, tasting of stale coffee and the ozone tang of overtaxed GPUs. Outside the single, high window, Oxford baked under an unseasonable May heatwave, but inside The Chalet – a warren of repurposed college outbuildings housing the Mechanistic Interpretability Group – the struggle was internal. Sam wiped sweat from their temple, staring at the whiteboard that dominated the cramped space. It was too small, crammed with layer diagrams, attention head visualisations, and two circled case numbers that pulsed with unresolved tension: **17** and **29**.

  Four days remained until the funder review. Three, really, considering packing and prep. Their anomaly detector, ‘Watchtower’, had flagged hundreds of episodes across their target model, Chimera-7B. Most were noise, easily dismissed. But 17 and 29 clung on, stubborn and ambiguous.

  "Right," Ben said, tapping the marker impatiently against **17**. "We ship the sprint report with these two as unresolved. Caveats. We say *probable* distinct mechanisms. Move on. We’re circling the drain here." Ben, perpetually pragmatic, had the look of a man contemplating the sweet release of sleep deprivation ending. His coding fingers drummed the table.

  Anya, the evo-devo postdoc who’d joined them six months ago from studying butterfly wing patterns, leaned forward. Her dark eyes were sharp, focused on the board, not Ben. "We ship *what*, Ben? A shrug? The whole *point* of Watchtower is to find the ghosts in the machine, the things that look normal on the surface but aren't under the hood. **17** and **29** *are* that point. If we don’t know what ‘same mechanism’ means, Watchtower is just… an expensive noise machine."

  Sam, the narrator, the third-year PhD student whose months had bled into building Watchtower, felt the knot in their stomach tighten. They’d built the detector to catch the *how*, not just the *what*. Now, the *how* was proving frustratingly slippery to categorise.

  On the board, under **17**: *Probable Copy Circuit Variant. Input: Archaic synonym for "truth". Output: Correct factual statement about Plato. Internal Path: Unusually strong activation in copy-associated heads H-12, H-15, H-18. Context: Rare word, but circuit pattern matches known copying behaviour (ref: Case 3, Case 8), just on unfamiliar input.*

  Under **29**: *Output Coincidence? Input: Ambiguous query re: historical figure birth/death dates. Output: Correct dates (verified). Internal Path: Strong, unexpected co-activation in heads H-7 (date recall) and H-23 (contextual disambiguation). No prior co-activation observed. Output matches H-7 solo performance elsewhere.*

  Leo, their functionalist, finally looked up from his terminal. He’d been running simulations, his brow furrowed. "The output's identical in function," he stated, gesturing vaguely at **29**. "For that input, it *does* the right thing. The *how* is just implementation. If I ablate H-23 in **29**, the output degrades – it gets the century wrong. If I intervene to activate H-23 artificially during a similar query where it’s usually silent, the output improves. Cause and effect. H-23 is *functionally* involved in the mechanism producing that output for that input."

  "Functional involvement isn’t homology," Anya countered sharply. She picked up a dried-out marker and drew two crude diagrams on the board's edge. One resembled a branching tree, the other a flowchart. "Look. **17** – it’s like finding a mouse Pax-6 gene doing its job, directing lens formation, but in a slightly different tissue context because the input cue is weird. The *core regulatory logic* is conserved. It’s the same mechanism, operating under perturbation. **29**? It’s like finding a compound eye achieving focus. The *function* – seeing – is achieved. But the developmental cascade, the underlying genetic switches? Entirely different lineage. H-7 and H-23 aren’t ancestrally linked in this model’s training trajectory for this task; they just *happened* to fire together here. Convergence, not deep homology."

  Sam saw Ben’s eyes glaze over slightly at the biology. "Homology, schmomology. Leo’s test *works*. Ablate, intervene, behaviour changes. That’s mechanism, isn’t it? What more do you want?"

  "What I want," Anya said, her voice tight, "is to know if Watchtower flagged the same underlying *fault line* twice, or two completely different cracks. If it’s homology, like **17**, it tells us something fundamental about how Chimera organises its knowledge retrieval – a core circuit adaptable to edge cases. If it’s convergence, like **29**, it’s just… statistical fluke. Interesting, maybe, but not a systemic anomaly worth prioritising. Watchtower itself needs to know the difference!"

  "Then let’s test it properly," Sam interjected, desperate to break the deadlock. They pointed at the terminal running Chimera’s debug interface. "Let’s patch. For **29**, we have the activations from H-7 and H-23 at the critical moment. We run the **17** input again. But instead of letting Chimera compute its own path, we patch *in* the activations from **29**’s H-7 and H-23 at the equivalent layer. See what happens."

  Leo nodded slowly. "Functional equivalence test. If the patched activations cause **17** to produce its correct output *using those foreign components*, it strongly suggests the mechanisms are functionally interchangeable at that point. A shared functional role."

  Anya looked sceptical. "It might show they *can* be made to fit, like jamming a fly gene into a mouse. It doesn’t mean they *are* the same mechanism in their native context. But… fine. Run it."

  The room held its breath as Sam set up the patching experiment. The fans whined. Lines of code scrolled. The input for **17** – the archaic word for "truth" – was submitted. Midway through the forward pass, Sam intercepted the activations at Layer 12, carefully extracting the saved state from **29**’s H-7 and H-23, and overwrote the corresponding activations in the **17** run. The model churned.

  The output flashed onto the screen: a correct factual statement about Plato. Identical to the original **17** output.

  Ben slapped the table. "There! Functional equivalence! Same output with swapped parts. Case closed. They’re the same *kind* of thing for Watchtower’s purposes."

  Leo smiled thinly. "The intervention on the component (the patched activation) changed the behaviour (ensured correct output), and the desired behaviour (correct output) required that specific intervention. Mechanism confirmed."

  Anya stared at the screen, then at the whiteboard diagrams. "No. This just proves that *for this specific input*, the output can be produced by a completely different *ad hoc* coalition. It tells us nothing about whether the *native* mechanism in **17** – that specific configuration of copy-heads – is homologous to the *native, accidental* coalition in **29**. You’ve forced a functional outcome, but you haven’t touched the homology question. It’s like… like proving you can make a wing by grafting butterfly scales onto a bat, then declaring bats and butterflies have homologous wings! The test presupposes the functional level is the *only* level that matters."

  Sam felt the heat prickle their skin. Anya was right. The patching *had* worked, spectacularly. But it hadn't resolved the core dispute; it had merely illuminated it. The experiment was definitive for Leo and Ben – it satisfied the interventionist criterion for mechanism membership at the output level. For Anya, it was irrelevant to her question about shared developmental or computational ancestry within the model's learned structure.

  "It depends," Sam said quietly, "on where you draw the boundary of the ‘mechanism’. If the mechanism is defined by its output for a specific input, then patching shows functional equivalence. If it’s defined by the specific computational pathway – the ‘developmental cascade’ – then patching is irrelevant, or even misleading."

  Leo frowned. "Boundaries are pragmatic. We draw them where intervention works."

  "And what about next quarter?" Anya pressed, her voice low but intense. "Watchtower flags another episode. Does it look like **17** – a known circuit type acting oddly? Or like **29** – a weird co-activation? If we adopt Leo’s view, **29** becomes a ‘functional anomaly type’, and we’ll prioritise hunting for any co-activation that produces a correct output, regardless of the components. We might drown in statistical noise. If we adopt mine, **17** is the template, and we look for *variants* of known core circuits acting off-distribution. We might miss genuinely novel, convergent solutions that are nonetheless ‘ghosts’."

  The tension wasn't just philosophical; it was logistical. The choice of lens determined the next three months of work – sifting sand or chasing mirages. Ben groaned. "This is why I wanted to ship them as unresolved!"

  Sam looked at the two case numbers on the board. **17** felt like a known soldier stepping slightly out of line. **29** felt like two strangers accidentally saluting at the same time. Watchtower, their own creation, was itself a mechanism – its detection logic a pathway triggered by statistical deviations in activation patterns. Was *it* homologous to their own reasoning, or merely functionally convergent? The thought was dizzying.

  They took a deep breath. The funder deadline loomed, but the deeper deadline was the integrity of their project. "We commit," Sam said, their voice firmer than they felt. "For the sprint report, and for Watchtower’s next phase... we use Anya’s criterion. Deep homology. We define the mechanism boundary by the computational pathway – the identifiable circuit ‘type’, its learned heritage."

  Ben threw his hands up. "So we spend next quarter chasing ghosts of known circuits? What about all the weird one-off convergences?"

  "We classify **29** as ‘Convergent Output’," Sam continued, drawing a new box on the crowded board. "Distinct anomaly class. Lower priority for now. We focus Watchtower’s refinement on spotting deviations in *recognised core pathways*. We report **17** as ‘Variant of Known Mechanism (Copy Circuit)’ and **29** as ‘Novel Output-Convergence’. We explain the distinction. We argue that homology gives us better traction on systemic fragility." They met Anya’s gaze, seeing a flicker of surprised approval. To Leo: "We record the patching result as evidence of potential functional overlap, but not sameness of mechanism."

  Leo sighed, running a hand through his hair. "It’s arbitrary. You’re privileging history over function."

  "No," Sam countered. "We’re privileging the *structure of the computation* over the *singularity of the output*. It’s messy, like Anya’s deep homology. But it’s a line. And it means Watchtower hunts for the mouse eye doing something fly-like, not just *any* light-sensing structure." They gestured at the detector’s code humming on a nearby server. "It makes Watchtower itself a mechanism tuned to a specific kind of history."

  The cost was clear: they might miss future **29**s that signalled truly novel, dangerous internal alignments. They’d chosen a path that prioritised understanding the model’s ingrained structures over its emergent, possibly fluky, solutions. The gain was a sharper, if narrower, lens – and the hope that anomalies like **17** would reveal the fault lines within Chimera’s learned logic, not just its momentary coincidences.

  Ben muttered about extra work. Leo looked unconvinced but began updating the report draft. Anya picked up a fresh marker and started refining the **17** circuit diagram on the board, a hint of grim satisfaction in her posture. The room was still too warm, the whiteboard still too small, the deadline still terrifyingly close. But a decision had been made. The mechanism of their own audit had lurched forward, its internal pathway irrevocably altered by the intervention of a disputed definition. The tension hadn't dissolved; it had simply been given a new shape, one that would now dictate the flow of their work, and the ghosts Watchtower would chase, long into the sweltering summer.
