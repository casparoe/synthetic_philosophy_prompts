prompt: |-
  Hey, I'm a junior and I'm the copy editor for our school's lit mag (we put out an issue every six weeks, like 40 pages, 25 writers, and our faculty advisor signs off but doesnt line edit). I keep having to decide whether to change stuff like 'mankind,' 'the poet ... he,' 'lady doctor,' 'girls' for grown women, and whether a satire gets to use that kind of language on purpose. I read that Hofstadter essay where he does the reverse-racism version of the sexist-language thing -- swaps race terms in for gender terms and suddenly the 'default' sounds insane -- and it made me think we need an actual procedure, not vibes. But I dont want a reading list or citations, I cant use those and I have like 15 minutes per piece.

  Can you turn the idea behind that piece -- default assumptions, marked vs unmarked terms, satire as a swap test -- into a decision procedure I can actually run? I need the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the call to a human because its values not facts. Then run it on three cases: (1) a poem that uses 'mankind' and generic 'he' and the writer says its for meter; (2) a satire piece that uses 'females' as a noun and calls women the fairer sex to mock a men's-rights guy; (3) a quote in an essay from an old document that uses 'men' to mean everyone, and the writer wants to keep it as is. I want you to be committed: make definite calls, dont just say 'it depends' and leave me to pick. If you think my instinct on one of these is wrong, say so.

  Give it to me in this shape and order:
  1. 'The one-paragraph version' (about 100 words).
  2. 'The procedure' (numbered steps, stop rules, handoffs, basically a flowchart in words; about 700 words).
  3. 'Two quick tests' (two sentences I can run before the whole procedure; about 100 words).
  4. 'Worked cases' (all three, about 500 words).
  5. 'Where this breaks' (about 250 words).
  6. 'Your call on the one I'll hate' (about 150 words).
reasoning: |-
  Okay, let me tackle this query step by step. The user is a junior copy editor for a school lit mag facing real-time decisions on gendered language. They need a practical procedure, not theory - and they specifically referenced Hofstadter's race-gender swap concept as their north star. 

  Hmm, the core tension here is between editorial responsibility and creative freedom within tight deadlines. The user's exhausted by "vibes-based" decisions and wants structure. Important nuances: satire gets special treatment, historical quotes need evaluation, and meter matters in poetry. They're clearly frustrated with wishy-washy guidelines.

  First, I should crystallize Hofstadter's insight into actionable filters. The key moves are:
  - Identifying default/marked language (like "lady doctor")
  - Applying the race-swap test for shock value awareness
  - Distinguishing intent from impact
  - Creating off-ramps for satire/history

  For the procedure itself... it needs to be bulletproof against endless debate. Must include:
  1. A quick pre-check to weed out obvious cases
  2. Sequential questions with hard stops (e.g., swap test failure = automatic reject)
  3. Clear handoff points where judgment is unavoidable
  4. Mock rulings on their three cases to prove it works

  Ah, the third case (historical quote) is the landmine - that's probably "the one they'll hate." My instinct is to recommend keeping it raw with an editorial footnote. Authenticity matters more than sanitizing history, but contextualization is non-negotiable. 

  Biggest challenge will be avoiding false positives. Some "marked" terms might be reclaimative in specific contexts - but as a high school publication, erring toward inclusivity seems safer. Also must resist over-engineering; their 15-min per piece constraint means steps must be skimmable.

  Final note to self: When mocking up case rulings, be definitively wrong rather than ambiguously right. They need confidence, not caveats. Even if they disagree with a call, concrete reasoning gives them footing to override.
answer: |-
  Here’s your lit mag copy editing decision protocol, designed for speed and clarity. Based on Hofstadter's core concept: **Default assumptions become visible when swapped with other marked categories (race, disability, etc.), revealing bias.**

  ---

  ### 1. The One-Paragraph Version  
  Use this 3-step test for gendered/biased language:  
  1. **Swap Test**: Replace the contested term with a parallel term from another marginalized group (e.g., "whitekind" for "mankind"). Does it sound absurd or offensive?  
  2. **Intent Check**: Is the term *essential* to artistic goals (meter, satire, historical accuracy)? Satire must clearly mock the bias; history needs contextual truth.  
  3. **Harm Assessment**: Could the term alienate readers or normalize bias? If "yes," reject unless cleared by Steps 1–2.  
  Stop if any step fails; hand off only for satire/history ambiguity.  

  ---

  ### 2. The Procedure  
  **Run these steps in order. Stop at any ❌.**  
  1. **Quick Swap**:  
     - Swap the contested term with a parallel term from a *different* marginalized category (e.g., "mankind" → "whitekind," "lady doctor" → "Christian doctor," "girls" → "Black adults").  
     - ❌ **STOP & CHANGE** if the swap sounds offensive/absurd *and* there’s no clear artistic justification.  
     - ✅ **Proceed** if unproblematic or ambiguous.  

  2. **Creator Intent Interrogation**:  
     - Ask: "Is this term *necessary* for artistic integrity (meter, voice, satire, historical fidelity)?"  
     - For satire: Must prove it *critiques* the bias (e.g., exaggerated MRA tropes).  
     - For meter/history: Must be the *only* viable option.  
     - ❌ **STOP & CHANGE** if the writer’s reason is weak ("sounds better") or the satire is unclear.  
     - ✅ **Proceed** if intent is defensible.  

  3. **Harm & Audience Check**:  
     - Ask: "Could this term reasonably make readers feel excluded, stereotyped, or devalued?"  
     - Consider: School environment, diverse contributors, educational mission.  
     - ❌ **STOP & CHANGE** if potential harm outweighs artistic value (e.g., casual sexism with no critique).  
     - ✅ **Proceed** to Step 4 if unclear.  

  4. **Values Handoff (Human Judgment)**:  
     - **HANDOFF CONDITIONS**:  
       - Satire where mockery is *plausible but not obvious*.  
       - Historical quotes where alteration feels dishonest.  
       - Terms reclaimed by marginalized groups (rare; verify context).  
     - **SOLUTION**: Consult faculty advisor *only* here. Default to inclusion if unresolved.  

  ---

  ### 3. Two Quick Tests  
  **Run these first; if either fails, skip to Procedure Step 1.**  
  - **Swap Shock Test**: "Would swapping this with a race/ability term make the faculty advisor gasp?" If yes, reject.  
  - **Satire Smell Test**: "Is the bigoted character *visibly* the butt of the joke?" If no, reject.  

  ---

  ### 4. Worked Cases  
  **Case 1: Poem with "mankind"/"he" for meter**  
  - Swap Test: "Whitekind," "the poet... she" → "Blackkind," "the poet... they." Absurd/offensive? **Yes.**  
  - Intent Check: Meter is valid, but "humanity"/"they" often works. Not *essential*. ❌ **STOP & CHANGE**. Alter to "humankind" + singular "they." (Your instinct was right.)  

  **Case 2: Satire using "females"/"fairer sex" to mock MRA**  
  - Swap Test: "Blacks are the fairer race." Offensive? **Yes, but satire gets leeway.**  
  - Intent Check: Piece clearly mocks MRA via exaggeration. ✅ **Proceed.**  
  - Harm Check: Mocking the speaker, not women. Low risk if context obvious. ✅ **KEEP AS IS.** (Your instinct was wrong; satire passes.)  

  **Case 3: Historical quote using "men" for everyone**  
  - Swap Test: "All whites are created equal." Offensive? **Yes.**  
  - Intent Check: Historical accuracy valid; altering quotes is unethical. ✅ **Proceed to Handoff.**  
  - Harm Check: High risk of exclusion. ❌ **HANDOFF to advisor w/ solution: Keep quote but add [Editor’s note: "men" here reflects period language, not current policy]**.  

  ---

  ### 5. Where This Breaks  
  - **Reclaimed Language**: E.g., queer women using "girls" affectionately. The swap test misfires (e.g., "Blacks" ≠ equivalent). Handoff to advisor with writer’s explanation.  
  - **Subtle Satire**: If the critique is too nuanced, the procedure may reject valid art. Mitigate with **Intent Check** rigor.  
  - **"Essential" Meter Debates**: Some poets insist archaic terms are irreplaceable. Procedure defaults to inclusivity; override only with advisor consensus.  
  - **False Negatives**: Overly polite bias (e.g., "feisty grandmother") slips through. Use **Harm Check** strictly: "Would this feel belittling?"  

  ---

  ### 6. Your Call on the One You’ll Hate  
  **Case 3 (Historical Quote): KEEP IT, but annotate.**  
  - Why you’ll hate it: It feels gross to print "men" meaning "all."  
  - Why it’s correct: Altering historical documents is unethical. Your lit mag isn’t sanitizing history; it’s showcasing it *with context*. The footnote forces readers to confront the bias instead of erasing it. If the writer refuses the footnote, **kill the quote**. Integrity > their nostalgia.  

  ---  
  **Final note**: This procedure makes you the bias detective, not the thought police. It prioritizes impact over intent, artfulness over laziness, and education over comfort. When in doubt at Step 4, **protect the vulnerable reader**.
