  First, I need to carefully distinguish what the law actually does from what it might imply philosophically. The core asymmetry is stark: courts consistently allow parental recovery for "wrongful birth" while rejecting the child's "wrongful life" claim. To reconstruct the implicit theory charitably, I should consider multiple philosophical angles without prematurely committing to one.

  Hmm... the procreation asymmetry (Benatar's position) seems relevant but possibly overdetermined. The legal practice might rest on more pragmatic concerns like comparators - courts explicitly say nonexistence isn't a comparable state for the child, whereas parents clearly have an alternative (childless existence) that's financially comparable. That's logically distinct from asserting life is always beneficial. 

  I should also examine the duty framework. The law's reluctance to impose "duties not to procreate" might explain rejecting the child's claim without denying severe suffering exists. This fits with how negligence law traditionally operates. 

  Where I'm least confident is whether courts truly presuppose existence is always beneficial, or if they're merely noting practical/jurisdictional limits. Some judicial language suggests the former, but it might be rhetorical overstatement. 

  If procreation asymmetry became explicit law, wrongful life claims might become viable in extreme cases - but courts would still face the metaphysical headache of quantifying "non-existence" as baseline. The parental claims would likely remain unchanged. 

