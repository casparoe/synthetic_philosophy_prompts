answer: |-
  Your query cuts to a profound jurisprudential and philosophical tension. The asymmetry in wrongful birth versus wrongful life claims does indeed rest on implicit assumptions about existence, value, and harm. Let me reconstruct the presupposed theory charitably, distinguishing core commitments from compatible positions, and identify points of underdetermination.

  ### Core Legal Practice & Strict Presuppositions
  1.  **Wrongful Birth (Parental Claim):**
      *   **Recognised Harm:** Courts accept that parents suffer tangible, compensable losses (e.g., extraordinary medical/care costs, loss of earnings, emotional distress) arising from the *duty-breach* (failure to inform/test/advise properly).
      *   **Loss Defined Comparatively:** The "loss" is defined *relative to the parents' expected state without the child or with a healthy child*. The comparator (childless existence or parenting a healthy child) is legally and financially intelligible. The child's existence *causes* these specific, quantifiable burdens *that would not have existed* but for the negligence.
      *   **Strict Presupposition:** **Breach of a duty owed *to the parents* caused them to incur avoidable, foreseeable, and quantifiable financial and emotional burdens associated with raising a severely disabled child.** The value judgment is about *the imposition of burdens on existing persons (parents)*, not a judgment that the child's life itself is a net harm *to the child*.

  2.  **Wrongful Life (Child's Claim):**
      *   **Rejected Harm:** Courts universally reject the child's claim that their own existence, with severe disability, constitutes a compensable injury *to them*.
      *   **Key Judicial Reasoning:**
          *   **Incomparability:** "Non-existence" is not a viable state of being with which "existence with severe impairment" can be meaningfully compared to determine if the child is "worse off." Existence is the precondition for having any interests or suffering any harm at all (*McKay v Essex AHA*).
          *   **Life as Benefit:** Courts frequently state life, even severely impaired, is always a "benefit" or "blessing" compared to non-existence (*Harriton v Stephens*; common in US rulings). Denying this is seen as devaluing disabled lives.
          *   **Absence of Duty:** Courts often hold that a duty of care cannot logically extend to preventing the very existence of the plaintiff (*Curlender v Bio-Science Labs* - though dissenting views exist). The negligence allegedly *caused the child to exist*, not to exist *in a harmed state* from a prior condition.
      *   **Strict Presupposition:** **It is legally impossible to establish that a person has been harmed by being brought into existence because: (a) the only alternative (non-existence) is not a state of being that can constitute a baseline for comparison of harm, and/or (b) existence itself is an essential precondition for having interests and is always, at a minimum, not a net harm *to the person who exists*.**

  ### Implicit Theory of the Value of Coming into Existence
  Charitably reconstructed, the core presupposition is **a strong form of Conditional Comparativism combined with an Existential Benefit Intuition:**

  1.  **Conditional Comparativism:** Harm requires a comparator. For an existing person, harm means being worse off than they *were* or *would have been* in some relevant alternative scenario. For the child in a wrongful life suit:
      *   The *only* alternative to their existence with impairment is *their non-existence*.
      *   **Non-existence is not a state *of the person*.** There is no "they" in non-existence to be better or worse off. Therefore, there is no coherent baseline against which to judge their existence as harmful *to them*. The child cannot be "worse off" than they would have been had they never existed, because "they" would not have been *at all*. (This draws on Parfit and Feinberg).
      *   *This is the strongest and most consistent presupposition across jurisdictions rejecting wrongful life claims.*

  2.  **Existential Benefit Intuition (Often Explicitly Stated):** Courts frequently supplement incomparability with the positive assertion that life, even with profound suffering, is inherently preferable to non-existence. This suggests:
      *   Existence confers a fundamental, non-instrumental benefit: the mere possibility of experience, sentience, or "the human predicament" (*Harriton*). Non-existence has zero value.
      *   Therefore, coming into existence *cannot be* a net harm *to the person who comes to exist*, regardless of the quality of that life. At worst, it might be neutral, but neutrality cannot ground a claim for damages (as damages require being worse off).

  ### Relationship to the Procreation Asymmetry
  *   **The Practice *Fits With* the Asymmetry but Does Not Strictly *Presuppose* It:** The procreation asymmetry (bad to create a life not worth living, but not good to create a life worth living) is *compatible* with the rejection of wrongful life claims. The asymmetry focuses on the *creator's* moral duty (not to inflict a life not worth living). The law's rejection of wrongful life suits focuses on the *created person's* inability to claim harm from their own creation.
  *   **Key Difference:** The procreation asymmetry explicitly acknowledges that bringing a person into a "life not worth living" *is* a harm (to whom? - usually considered a moral harm or wrong *by the creator*). **The legal practice, in rejecting wrongful life claims, implicitly or explicitly *denies* that existence, even with immense suffering, constitutes a harm *to the child*.** It presupposes either incomparability or that existence is always at least neutral/beneficial. The asymmetry, conversely, *requires* that a life not worth living *is* a harm (to the person living it) to ground the "badness" of creating it.
  *   **Where the Practice Fits:** The practice fits the "not good" arm of the asymmetry concerning wrongful *birth*. The parents' claim isn't that the child's life is a net harm *to the child*, but that its existence *with disability* imposes burdens *on them* that they sought to avoid. The law doesn't say conceiving a healthy child is "good" for the parents in a compensable sense; it only recognises that negligence *caused burdens* via the birth of a disabled child.

  ### Philosophical Underdetermination
  The practice is **underdetermined** concerning several key philosophical points:

  1.  **The "Life as Benefit" Assertion:** Does the practice *strictly presuppose* that existence is *always* a benefit? Or is it merely relying on the *incomparability* argument? Courts often cite both, but the incomparability argument is logically sufficient to reject the claim. The "benefit" language may be rhetorical or reflect a deeper metaphysical commitment, but it's not strictly necessary. A theory accepting that some lives *are* net harms for the person (e.g., extreme, unremitting suffering) could *still* reject wrongful life claims solely on incomparability grounds.
  2.  **The Nature of Harm:** Does harm *require* a conscious subject experiencing it? Or can we say a person is harmed by being brought into a life of suffering, even if they cannot compare it to non-existence? The practice presupposes the former (experiential/subject-relative harm), but objectivist views of harm could challenge this.
  3.  **The Scope of "Duty":** The "no duty to prevent existence" argument is common but separable. One could theoretically hold that:
      *   Non-existence *is* comparable (contra presupposition 1).
      *   Existence *can* be a harm.
      *   BUT, there is still no *legal duty* owed *to the potential child* not to bring it into existence (perhaps for policy reasons like slippery slopes). The practice often conflates the harm and duty issues.

  ### Impact of Explicitly Adopting the Procreation Asymmetry
  If the procreation asymmetry became an explicit legal principle:

  1.  **Wrongful Life Claims:** This would be the most significant change. The asymmetry explicitly holds that bringing into existence a person whose life is "not worth living" *is bad* (a wrong/harm). This directly challenges the core legal presupposition that existence cannot be a net harm to the person existing.
      *   **Likely Outcome:** Wrongful life claims *could potentially become viable* in the most extreme cases where a court could be convinced, on balance, that the child's life is one of such unmitigated, severe suffering that it is "not worth living" (e.g., profound cognitive impairment combined with constant, untreatable pain). The court would need a methodology for determining this threshold and for comparing existence with non-existence to quantify damages (an immense philosophical and practical challenge).
      *   **Hurdles Remaining:** The "duty to prevent existence" and causation issues (did the negligence *cause* the life not worth living, or fail to prevent it?) would remain significant barriers, but the fundamental objection based on the non-comparability/non-harm of existence would be removed.
  2.  **Wrongful Birth Claims:** These would likely remain largely unchanged. The asymmetry's "not good" arm aligns with the current basis for wrongful birth: the claim isn't that a healthy child's existence is a *positive good* the parents were denied, but that they were *harmed* by being forced to bear the costs of a disabled child due to negligence. The focus remains on the *parents'* losses caused by the breach of duty.

  **Confidence Assessment:**
  *   **High Confidence:** The strict presupposition of **Conditional Comparativism (Incomparability Argument)** as the core, necessary logical foundation for rejecting wrongful life claims.
  *   **Moderate Confidence:** That the frequent judicial invocation of "life as a benefit" reflects a genuine, widely held **Existential Benefit Intuition** that *supports* but is not *strictly required by* the legal outcome. Judges seem to genuinely believe this.
  *   **Lower Confidence (Point of Least Certainty):** Whether the practice *necessarily presupposes* that existence is **ALWAYS** a benefit/not harmful, or if this is a rhetorical overstatement potentially separable from the core incomparability argument in *some* judicial reasoning. Some rulings lean heavily on benefit, others stress incomparability. The stronger the emphasis on "always a benefit," the more it conflicts with the procreation asymmetry's core premise about lives not worth living.
  *   **High Confidence:** That adopting the procreation asymmetry explicitly would necessitate a fundamental re-evaluation of wrongful life claims, making them potentially viable in extreme cases, while wrongful birth claims would likely persist in their current form.

  In essence, the law's asymmetry rests on the bedrock that one cannot coherently claim to have been harmed *by being born* due to the impossibility of comparing existence with non-existence from the perspective of the person who exists. This shields the legal system from profound metaphysical quandaries about the value of existence itself, but at the potential cost of denying redress in situations where profound suffering is deemed, by some philosophical standards, to constitute a life not worth living.
