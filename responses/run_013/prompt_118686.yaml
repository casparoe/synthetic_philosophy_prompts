prompt: |-
  I am a philosophy PhD student writing a chapter on the wrong-kind-of-reasons problem, and I need a case built to order rather than yet another visit to the usual scenario in which a threat of harm gives one a reason to admire something worthless. My chapter argues that fitting-attitude accounts need an extra clause for directed attitudes — attitudes addressed to a particular target, whose fittingness seems to turn on something about that target rather than merely on the attitude's content. I want a thought experiment that isolates whether the standard two-level diagnosis (one consideration may bear on whether an attitude is fitting; another may bear only on whether having the attitude is good for the agent or others) can accommodate a reason that is wrong-kind for an attitude toward one target and right-kind for the same attitude type toward a different target, with everything else held fixed.

  Please construct the case to these specifications. (i) The attitude must be one of gratitude, resentment, trust, forgiveness, or admiration of a person — not belief or desire. (ii) The two targets must both be ordinary individual human beings who are fully agents and equally responsible for their conduct; the asymmetry must not come from one target being a non-agent, a group, an institution, a fiction, or someone excused by ignorance or duress. (iii) The consideration must be an ordinary reason of the sort people actually weigh — social, emotional, prudential — and must not involve demons, threats of torture, pills, brainwashing, hypnosis, infinite rewards, or any device that causes the attitude directly. (iv) The consideration must not differ in its evidential bearing on the two targets: it must not be evidence that one target acted in a way the other did not. (v) The scenario itself is one paragraph, present tense, contemporary, in a single ordinary setting. (vi) Do not stipulate the asymmetry in the setup; it must fall out of the structure of the case.

  Then do the demonstration. State the verdict that each of the following gives and why: the plain two-level fitting-attitude diagnosis; a target-sensitive view on which fittingness for a directed attitude requires the reason to bear on the target's agency or standing toward the agent; and the deflationary view that treats every such reason as a reason to want to have the attitude, so that the asymmetry dissolves. Identify the single feature of the case doing the work, and say what happens if that feature is removed — in particular, whether the case collapses back into the familiar shape. Finally, say how a defender of the plain diagnosis would attack the case, and whether that defence costs them anything they should care about. The case is for a chapter, so it fails if it stipulates its verdicts instead of generating them: I will check whether each verdict follows from the theory as stated.

  Do not give me citations, a reading list, or attributions; I want the structure and the reasoning only. Take a definite position: tell me whether the case succeeds, which view it favours, and which side you would bet on, giving your reasons. If you think it fails, say so plainly and say where it breaks, rather than laying out the options and leaving the choice to me.
reasoning: |-
  Okay, the user is a philosophy PhD student working on a chapter about the wrong-kind-of-reasons problem. They need a custom thought experiment that meets very specific criteria to challenge fitting-attitude accounts. Let me break down their requirements.

  First, the case must avoid the typical threat-of-harm scenario for admiration. The attitude should be directed—like gratitude or resentment—toward individual human agents. Both targets must be similar in agency and responsibility. The reason provided shouldn't involve supernatural elements or direct causation; it has to be a social or emotional reason. Importantly, the reason shouldn't provide evidence about the targets' actions. The scenario needs to be one paragraph, present tense, contemporary.

  The user wants to test if the same reason can be wrong-kind for one target but right-kind for another. They also need analysis of how different theories would interpret it: the standard two-level view, a target-sensitive view, and a deflationary view. The key is that the case shouldn't stipulate the asymmetry but let it emerge naturally.

  Hmm, the user is likely frustrated with existing literature's limitations. They might be trying to show that directed attitudes require an extra clause in fitting-attitude analyses. Their deeper need could be to establish that the target's relation to the agent matters, not just the attitude's content. They might also want a case that forces theorists to confront relational aspects of reasons.

  Let me think of a scenario. How about resentment? Resentment is directed and relational. The reason could be social harmony—a non-evidential, non-coercive factor. Setting: a workplace where two colleagues cause equal harm. If the agent resents both equally, it disrupts harmony with one (a close collaborator) but not the other (a distant colleague). The reason to suppress resentment applies differently based on the relationship, not the targets' actions.

  Wait, does this meet all criteria? Both targets are agents, same responsibility. The reason is ordinary—prudential/social. No evidence difference. The asymmetry comes from the agent's relationship to each target, which is part of the attitude's directed nature. Perfect.

  Now, the demonstration: the standard view would see the harmony reason as always wrong-kind since it doesn't bear on blameworthiness. The target-sensitive view might differentiate based on the relationship's normative demands. Deflationism collapses the distinction. The key feature is the pre-existing normative relationship. If removed, it reverts to a standard case.

  A standard view defender might argue that relationships don't affect fittingness, only reasons to cultivate attitudes. But this costs them the ability to explain why some reasons are target-relatively right-kind. The case seems successful—it isolates relational context as decisive. I'd bet on the target-sensitive view winning here; it captures nuances the standard view misses.
answer: |-
  Here is the case tailored to your specifications:

  **The Scenario**  
  At a tense team meeting, both Lee and Morgan openly criticize your project proposal with identical harsh and unfair remarks, damaging your reputation equally. You feel appropriate resentment toward each for their unwarranted attack. Afterwards, your manager privately urges you: "For the sake of team cohesion, you should let go of your resentment toward Morgan specifically. Lee is transferring out next week, but Morgan is your assigned long-term collaborator on the next critical phase. If you resent Morgan, your necessary close cooperation will be poisoned and the project will fail. Resenting Lee won’t affect future work." The reason to abandon resentment is solely to preserve essential collaboration with Morgan.

  ---

  ### Demonstration of Asymmetry

  1.  **Plain Two-Level Fitting-Attitude Diagnosis:**
      *   **Verdict:** The collaboration-preservation reason is the *wrong kind* of reason for resentment toward *both* Lee and Morgan.
      *   **Why:** On the standard view, fitting resentment requires evidence that the target wronged you (e.g., acted unfairly, without excuse). The manager's reason bears solely on the *consequences* of *having* the resentment (project failure due to poisoned collaboration with Morgan), not on whether Morgan (or Lee) actually wronged you or the quality of their will. It’s a reason to *not have* or *get rid of* the attitude, not a reason why the attitude *fits* its object. Since the reason doesn't bear on the blameworthiness of the targets' *past actions* (which were identical), it cannot make resentment fitting or unfitting toward either. The asymmetry requested by the case *fails* to emerge; the reason is WKR for both.

  2.  **Target-Sensitive View (Fittingness requires reason bears on target's agency/standing toward agent):**
      *   **Verdict:** The collaboration-preservation reason is the *wrong kind* for resentment toward Lee, but the *right kind* for resentment toward Morgan.
      *   **Why:** This view holds that fitting directed attitudes like resentment depend not just on the past act, but on the *ongoing normative relationship* between agent and target. Resentment is fitting only if sustained by considerations relevant to that relationship. For Lee (the departing colleague), the future collaboration reason is irrelevant to *Lee's* standing or agency toward you – the relationship is effectively over. The reason thus remains purely external, a reason to manage your attitude for pragmatic gain (WKR). For Morgan (your long-term collaborator), however, the *necessity of future cooperation* is directly constitutive of your *ongoing normative relationship*. The reason bears on whether resentment *can be sustained* within the practical demands of that relationship. It speaks to Morgan's *current and future standing* as someone you *must* interact with cooperatively. This makes it a consideration bearing on the *fittingness* of resentment *toward Morgan specifically* within the context of your relationship (RKR). The asymmetry emerges.

  3.  **Deflationary View (All such reasons are reasons to *want* the attitude):**
      *   **Verdict:** The asymmetry *dissolves*. The reason is the *same kind* of reason regarding resentment toward both Lee and Morgan – a reason to *want not to have* resentment.
      *   **Why:** This view denies a fundamental distinction between RKR and WKR for the attitude itself. The collaboration reason is straightforwardly a pragmatic reason why it would be *good for you* (and the project) not to resent *anyone*. The fact that not resenting Morgan is *more urgently beneficial* than not resenting Lee (because you must work with Morgan) doesn't change the *nature* of the reason – it's still just a reason to desire the absence of resentment. It's a stronger *practical* reason concerning Morgan, but not a different *kind* of reason relevant to the fittingness *of* resentment toward its object. The asymmetry in kind disappears.

  **The Single Feature Doing the Work:** The **pre-existing, normatively significant, and *ongoing* practical relationship** (mandatory future collaboration) between the agent and *one* target (Morgan), but not the other (Lee). This relationship creates a context where considerations about the *future practical demands* of that relationship bear directly on the *sustainability* and thus *fittingness* of a reactive attitude like resentment *within that specific relationship*.

  **What Happens if Removed:** If the mandatory future collaboration requirement is removed (e.g., *both* Lee and Morgan are long-term colleagues, or *both* are leaving), the asymmetry collapses. The reason then becomes a purely pragmatic, external reason to abandon resentment toward both (or neither) to avoid *general* awkwardness or conflict – a classic WKR scenario. The case reverts to the familiar shape.

  **Defender of Plain Diagnosis's Attack & Cost:**
  A defender of the plain diagnosis would attack the target-sensitive view's interpretation of the Morgan case. They would argue:
  1.  **The Core Claim:** Resentment is *only* fitting based on the blameworthiness of the *past action*. The future collaboration need doesn't retroactively change whether Morgan's past criticism was unfair or blameworthy. It remains a reason *extrinsic* to the fittingness condition.
  2.  **Conflation Charge:** The target-sensitive view conflates the *fittingness* of resentment (based on past wrong) with *reasons for managing or expressing* resentment (based on future consequences). The pragmatic reason might make it *inappropriate to act on* or *nourish* resentment toward Morgan, but it doesn't make the resentment itself *unfitting*.
  3.  **Cost of Defense:** This defense requires the plain view to **deny that the structure and demands of an ongoing relationship can be constitutive of what makes a directed attitude fitting *toward that specific target***. It must hold that fittingness is determined *solely* by the past act's properties and the target's agential state at that time, entirely independent of the agent-target relationship's future trajectory or practical constraints. This makes the view unable to capture the intuition that resentment *within an ongoing, essential relationship* can become normatively unsustainable (and thus unfitting) *because of* the relationship's demands, even if the past wrong remains unchanged. This cost is significant for an account aiming to analyze interpersonal, relational attitudes like resentment, gratitude, or trust.

  **Success, Verdict, and Position:**

  *   **Success:** The case **succeeds** in generating the requested asymmetry *only* under the target-sensitive view. It satisfies all constraints (i-vi). The asymmetry falls out from the differing relational context (ongoing collaboration vs. ended interaction), not stipulated verdicts, differences in past action, or coercive mechanisms.
  *   **Favored View:** It **favors the target-sensitive view**. This view alone generates the asymmetry (WKR for Lee, RKR for Morgan) by incorporating the relational context into the fittingness conditions for the directed attitude.
  *   **Bet:** I would **bet on the target-sensitive view** winning in this specific domain of directed, relational attitudes (like resentment, gratitude, trust). The plain view's inability to register the normative significance of the ongoing relationship for the fittingness of the attitude feels like a crucial omission. The deflationary view avoids the problem but at the high cost of eliminating the RKR/WKR distinction entirely, which seems counterintuitive for these attitudes. The target-sensitive view offers the most plausible explanation for why the same pragmatic reason feels fundamentally different in its normative relevance to resentment toward Lee vs. Morgan. The cost paid by the plain view (denying relational context affects fittingness) seems greater than the cost paid by the target-sensitive view (expanding the fittingness base beyond the immediate past act).
