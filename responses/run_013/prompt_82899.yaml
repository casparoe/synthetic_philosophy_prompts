answer: |-
  Below is a detailed, step-by-step teaching plan for your 50-minute session on the strategy-stealing argument. The plan is structured to build understanding incrementally, address misconceptions proactively, and isolate monotonicity as the core premise. It uses **Hex** as the primary example (for its accessibility, lack of draws, and clear monotonicity), includes a sabotaged variant to demonstrate fragility, explicitly handles non-constructiveness and the chess objection, and ends with a diagnostic question. The plan assumes a whiteboard and no handouts.

  ---

  ### **Teaching Plan: Strategy-Stealing Argument**  
  **Total Time:** 50 minutes  
  **Objective:** Understand how the strategy-stealing argument proves a player must have a winning strategy in monotone games, why it fails otherwise, and why it doesn’t apply to chess.  
  **Key Insight:** Monotonicity is the substantive premise; the contradiction is "bookkeeping."  

  ---

  #### **1. Introduction: Set the Stage (5 minutes)**  
  - **What to cover:**  
    - State the goal: "We’ll prove that in Hex, the first player has a winning strategy—without showing how to win. The argument relies on a property called monotonicity and is non-constructive."  
    - Define the game properties needed:  
      - Finite (game ends),  
      - Perfect information (no hidden moves),  
      - No draws (must have a winner),  
      - Two players (alternate moves).  
    - **Refuse upfront:** "We won’t cover how to play Hex optimally, why Hex has no draws, or generalizations to infinite games."  
  - **Why:**  
    - Establishes scope and avoids tangents. Philosophers will recognize properties from logic (e.g., finite games resemble bounded quantifiers).  

  ---

  #### **2. Win Conditions and Winning Strategies (10 minutes)**  
  - **What to cover:**  
    - **Winning strategy definition:** "A plan guaranteeing win against any opponent moves. In finite, drawless, perfect-info games, exactly one player has one." Use tic-tac-toe as a familiar example (first player can force draw, but no win). Contrast with Hex: "In Hex, draws are impossible—someone always connects."  
    - **Symmetry in Hex:** Draw a small Hex board (4x4). Note board symmetry: "Swapping players and rotating the board doesn’t change the game."  
  - **Why:**  
    - Prerequisite for the contradiction. Philosophers need "winning strategy" defined rigorously to avoid conflating it with tactics (e.g., chess openings). Economists will tie it to dominant strategies.  
  - **Preempt misconceptions:**  
    - **Pairing/mirror tricks:** "This is not like pairing moves in Nim or retrograde chess analysis. Those are constructive; strategy-stealing is a proof by contradiction." Say this after defining symmetry to distinguish it.  

  ---

  #### **3. Strategy-Stealing in Hex: Contradiction Arc (15 minutes)**  
  - **What to cover:**  
    - **Assume for contradiction:** "Suppose second player (White) has a winning strategy, S."  
    - **First player (Black) 'steals' S:**  
      1. Black plays an arbitrary first move (e.g., anywhere), call it *X*.  
      2. Black now "pretends" to be the second player:  
         - For all subsequent moves, Black uses *S* as if *X* weren’t played.  
         - If *S* says "play at *Y*":  
           - If *Y* is empty, Black plays there.  
           - If *Y* is occupied (by any stone), Black plays randomly.  
    - **Outcome:** Black wins, contradicting the assumption that S guarantees White wins.  
    - **Conclusion:** White cannot have a winning strategy, so Black must.  
  - **Why:**  
    - Hex’s monotonicity makes this work: An extra stone never hurts Black (blocks opponent, never blocks self; more stones only help).  
  - **Preempt misconceptions:**  
    - **"Extra stone blocks Black!"**: After step 2, ask: "Could *X* harm Black?" Elicit answers, then resolve: "In Hex, stones only help—they can’t sabotage your own path. If you ignore *X*, your other stones still form a connection. *X* might even block White."  
    - **"Is this circular?"** Acknowledge: "Yes—it assumes S exists to disprove it. That’s the contradiction."  

  ---

  #### **4. Isolate Monotonicity: Sabotaged Variant (10 minutes)**  
  - **What to cover:**  
    - **Name and define monotonicity:** "A game is monotone if giving a player an extra move (free stone, extra tempo) never harms them."  
    - **Hex holds:** Reiterate why (extra stone always beneficial).  
    - **Sabotaged variant (non-monotone):** "Modify Hex: Add a ‘poison’ cell (e.g., center). If Black ever plays there, they lose instantly."  
      - Run strategy-stealing:  
        - Black plays first move (avoiding poison).  
        - Black uses S. If S ever says "play poison," Black plays randomly—but this may force Black into poison later.  
        - White could lure Black to poison via S. Contradiction fails!  
    - **Key point:** "The argument breaks when monotonicity is violated. The extra move (or stone) becomes a liability."  
  - **Why:**  
    - Forces monotonicity into the open. Hex is familiar, so the sabotage is intuitive. Philosophers will see it as a necessary condition.  
  - **Preempt misconceptions:**  
    - **"But Hex would never have poison!"**: Agree: "Exactly—we’re isolating the premise. Real Hex is monotone; this isn’t."  

  ---

  #### **5. Non-Constructiveness and Chess (5 minutes)**  
  - **What to cover:**  
    - **Non-constructive proof:** "We proved Black has a winning strategy but never found it. Why? We derived a contradiction by assuming S—which we disproved. We can’t extract a concrete strategy from this."  
    - **Chess objection:** "Why doesn’t this prove White wins chess? Two reasons:  
      1. **Draws:** Chess has ties, so neither player may have a winning strategy.  
      2. **Non-monotonicity (zugzwang):** Extra moves can hurt. Example: An endgame where moving loses (e.g., king trapped). If White ‘gives’ Black an extra tempo, Black may be forced into zugzwang and lose."  
  - **Why:**  
    - Addresses your friend’s points explicitly. Zugzwang is the chess analog of the poison cell—concrete and precise.  

  ---

  #### **6. Conclusion and Check Question (5 minutes)**  
  - **Summarize:**  
    - "Strategy-stealing works for finite, drawless, symmetric games where monotonicity holds. The contradiction is mechanical; monotonicity is the substance."  
  - **Diagnostic question:**  
    - **Ask:** "Suppose we try strategy-stealing on a game where an extra move can sometimes hurt the player (non-monotone). At which step does the argument fail, and why?"  
    - **Expected answer:** "It fails when the first player uses the stolen strategy. The extra move might force them into a losing position (e.g., poison or zugzwang), so they can’t guarantee a win."  
  - **Why:**  
    - Tests understanding of monotonicity’s role and the contradiction’s fragility.  

  ---

  ### **Why Hex (Not Chomp) as the Carrying Example**  
  - **Hex is superior here:**  
    - **Familiarity:** Economists/philosophers may know it; this avoids lengthy setup. Chomp (a "poison cookie" game) requires explaining rules, eating squares, and asymmetry.  
    - **Monotonicity clarity:** In Hex, an extra stone is unambiguously beneficial (blocks opponent, never self-blocks). In Chomp, an extra bite *could* force you into the poison square—which muddles monotonicity.  
    - **Sabotage ease:** Hex’s poison variant is intuitive. Chomp’s inherent poison complicates isolating monotonicity.  
  - **What you lose with Hex:**  
    - If the group knows Hex well, they might fixate on board strategy. **Mitigation:** Immediately abstract to "properties" (e.g., "Forget Hex tactics; focus on move-benefit").  

  ---

  ### **How to Handle Common Misconceptions**  
  1. **"This is like pairing strategies!"**  
     - **When:** During symmetry discussion (Step 2).  
     - **Response:** "Pairing is constructive (e.g., map moves 1:1). Strategy-stealing is non-constructive; it doesn’t map moves, it steals the entire plan."  

  2. **"But can’t White adapt to the extra stone?"**  
     - **When:** During the contradiction arc (Step 3).  
     - **Response:** "S is a winning strategy against any play. If S loses when Black has an extra stone, S wasn’t winning—contradiction!"  

  3. **"Chess is symmetric too!"**  
     - **When:** During chess discussion (Step 5).  
     - **Response:** "Chess isn’t symmetric (e.g., White moves first), and crucially, it violates monotonicity and has draws."  

  ---

  ### **Timing Buffer**  
  - **If ahead:** Spend more time on the sabotaged variant (Step 4).  
  - **If behind:** Skimp on tic-tac-toe (Step 2) or chess details (Step 5).  

  This plan ensures monotonicity is the star, isolates your friend’s objections, and leverages Hex’s strengths while avoiding pitfalls. Run it verbatim, and the group will leave with a crystalline grasp of the argument.
