prompt: |-
  You are advising me, the newly appointed chair of the speech-review panel at a mid-sized social platform. The panel meets twice a week, sits three people — me, a lawyer, and a community representative — and disposes of roughly a hundred appealed moderation decisions a month under a two-week clock. The backlog is real, and our decisions are published in a transparency report, so every ruling has to carry reasons a stranger could read.

  Our users are concentrated in the United States, Germany, France, and the Netherlands, and we have promised, in a public charter, two things at once: that we will never remove a post merely because it is offensive, since we do not want to be the arbiter of what counts as true or decent; and that we will meet every legal obligation we are subject to in each country where we operate. The legal team discharges the second promise by handing us a list of posts that are unlawful somewhere. The panel's problem is everything else — the posts no court has ruled on that a hundred users have reported.

  I want a decision procedure the panel can run on any reported post: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a decision to leave a post up or take it down, and where it must stop and hand the question to a person because it has become a question of value rather than of fact. I want it grounded in the actual difference between the American approach to hate speech and the European one, not in a bland compromise between them. Take the American materials seriously: the content-neutrality and viewpoint-neutrality presumptions, the insistence that the remedy for bad speech is more speech, and the deliberately narrow categorical exceptions — the incitement standard requiring both an intent to produce imminent lawless action and a real likelihood of it, the true-threat standard, and the fighting-words standard with its near-demise in modern doctrine. Take the European materials seriously too: the dignity-based reasoning that treats some speech as an assault on the equal standing of a group rather than as a contribution to a debate, the group-defamation and incitement-to-hatred provisions, the memory laws that criminalise denial of atrocities, and the underlying premise that a state committed to equal respect may legitimately restrict speech that would erode it — the thought that neutrality is not a live option, and that a state which refuses to choose has simply chosen the status quo. The interesting question for me is not which tradition is right; it is what a procedure looks like when it must answer to both, and what it has to give up to do so.

  The procedure therefore has to be honest about three specific pressures, each named and handled rather than smoothed over. First, the same post can be plainly lawful in one of our markets and plainly criminal in another, so we must decide whether to run one global rule or several, and what each costs. Second, the American exception-categories are narrow precisely to keep the state — or us — from deciding which viewpoints are hateful, while the European approach requires exactly that judgment; any combined procedure must say who makes the judgment and by what standard. Third, our charter's first promise may be a promise we cannot keep, because some of what we remove for the sake of the second is offensive speech we claimed never to touch.

  Then run the procedure on three cases, in this order, showing the questions answered and where the procedure stops: a post denying a historical atrocity, written in the register of academic revisionism, by a user in a country where such denial is a criminal offence; a slur used by members of the group it targets, in an in-group context, reported by outsiders who saw it out of context; and a widely circulating cartoon that mocks a religion, defended by its author as satire and condemned by the group it depicts as an attack.

  At least one of your three outcomes must be one I will not like — either a post left up that I find repellent, or a post taken down that I regard as valuable speech — and you should say plainly which it is and why the procedure forces it. End by telling me what the procedure cannot do: the cases it will get wrong, the judgments it performs mechanically only in appearance, and the point at which the panel should stop pretending it is applying a rule and admit that it is choosing a policy.
reasoning: |-
  Okay, the user is the chair of a speech-review panel for a mid-sized social platform. They need a decision procedure that handles appeals on moderated content, balancing both U.S. and European legal standards as promised in their charter. The platform operates in the U.S., Germany, France, and the Netherlands, so they must navigate different legal obligations without removing posts merely for being offensive. However, the charter's two promises might conflict when a post is illegal in one jurisdiction but not others.

  First, I need to address the core tensions: 
  - Legal fragmentation: The same post can be legal in the U.S. but criminal in Europe (e.g., Holocaust denial). The procedure must decide between global removal (over-blocking) or geoblocking (complexity).
  - Viewpoint assessment: U.S. standards avoid judging viewpoints (narrow exceptions), while Europe requires assessing if speech attacks dignity. Who makes this judgment? The panel must do it, but needs strict criteria.
  - Charter contradiction: Removing illegal posts might break the "never remove merely offensive" promise, especially when laws target offensive speech (e.g., group defamation).

  The decision procedure should be a flowchart with clear questions, stopping when value judgments are needed. Key principles:
  1. **Legality first**: Check if the post violates local laws. If yes, remove in that jurisdiction (geoblock if possible). This handles the second promise but might conflict with the first promise.
  2. **U.S. categorical exceptions**: Only remove if it fits incitement, true threats, etc. Prevents viewpoint-based removal.
  3. **European dignity harm**: For content legal in the U.S. but reported in Europe, assess if it attacks equal standing. Requires defining a high threshold to avoid over-removal.

  The panel must confront when they're making policy choices, not just applying rules. For example, defining "imminent harm" in incitement or "dignity harm" in group defamation involves subjective judgment.

  Testing with three cases:
  1. **Historical denial**: Academic revisionism in a country where it's illegal. Procedure removes it there (legality) but leaves it up elsewhere unless it incites harm. This might leave up offensive content, challenging the user's comfort.
  2. **In-group slur**: Used by group members, reported by outsiders. Not illegal, not incitement. Procedure leaves it up, applying U.S. neutrality. Outsiders' offense isn't grounds. User might dislike this as it allows slurs.
  3. **Religious satire**: Mocking cartoon. Legal in U.S., but check European dignity harm. Satire targeting power might be allowed, but if it attacks the group's standing, remove in Europe. User might dislike removal if they see it as valid criticism.

  The procedure's limits: 
  - Geoblocking fails if users VPN.
  - Dignity harm assessments are inherently subjective.
  - When new speech forms emerge (e.g., deepfakes), the panel must create policy, not just apply rules.
  - The charter contradiction means some removals will violate the "never remove offensive speech" promise—accept this openly.

  The user needs honesty about trade-offs: They can't fully satisfy both promises. The procedure makes this explicit, forcing tough choices where legality trumps neutrality.
answer: |-
  Here is a decision procedure grounded in the U.S./European legal-philosophical tension you described, designed for efficiency, transparency, and honesty about its compromises. It prioritizes **legality** first (to meet your charter’s second promise), then uses **U.S.-style categorical exceptions** as a neutral baseline, and finally confronts **European dignity-harm** only where legally unavoidable. It explicitly names and handles the three pressures you identified.

  ### Decision Procedure: The 5-Step Protocol  
  **Core Principle:** *Remove content only if legally required or if it meets a narrow U.S. exception. European dignity assessments are confined to jurisdictions where they are legally binding and triggered by user reports from that region.*  

  1. **Jurisdictional Legality Check**  
     - *Question:* Is this post unlawful in **any user-visible jurisdiction** (U.S., DE, FR, NL) based on the legal team’s list?  
     - *Sufficient Answer:* "Yes" if the post violates criminal law in that jurisdiction (e.g., Holocaust denial in DE/FR/NL, incitement to hatred in DE).  
     - *Termination:* If "yes," remove the post **in the violating jurisdiction(s) only** (geoblock). Else, proceed to Step 2.  
     - *Pressure Handled:* **Legal Fragmentation**. Cost: Geoblocking creates complexity and user frustration but avoids global over-removal.  

  2. **U.S. Categorical Exception Test**  
     - *Question:* Does this post fit a **defined U.S. First Amendment exception**? (Incitement to *imminent* lawless action; *objective* true threat; obscenity; fraud; defamation with actual malice).  
     - *Sufficient Answer:* "Yes" only if:  
       - **Incitement:** Explicit call for *immediate* violence + intent + high likelihood (e.g., "Attack [group] at [address] tonight!").  
       - **True Threat:** Reasonable target would fear *physical harm* (e.g., "I will kill you, [user]").  
       - *Not* met for offense, general bigotry, or non-imminent advocacy.  
     - *Termination:* If "yes," remove *globally*. Else, proceed to Step 3.  
     - *Pressure Handled:* **Viewpoint Neutrality**. U.S. exceptions avoid judging "hatefulness"; they focus on objectively verifiable harm.  

  3. **European Dignity-Harm Trigger**  
     - *Question:* Was the post **reported by users in a European jurisdiction (DE/FR/NL)** *and* does it target a protected group based on race, religion, etc.?  
     - *Sufficient Answer:* "Yes" only if both criteria are confirmed.  
     - *Termination:* If "no," **leave up globally**. If "yes," proceed to Step 4.  
     - *Pressure Handled:* **Judgment Standard**. Limits dignity assessments to contexts where European law applies *and* users have invoked protection.  

  4. **European Dignity-Harm Assessment**  
     - *Question:* Does the post **assault the equal standing** of the targeted group by:  
       - Denying their humanity/dignity (e.g., "subhuman," "vermin"),  
       - Inciting hatred (not mere criticism),  
       - Or denying a legally recognized atrocity (e.g., Holocaust)?  
     - *Sufficient Answer:* "Yes" only if the speech:  
       - Is **non-debatable** (rejects factual equality of the group),  
       - And **lacks discernible public value** (e.g., not academic, artistic, or political satire).  
     - *Termination:* If "yes," remove **in European jurisdictions only**. If "no," **leave up globally**.  
     - *Pressure Handled:* **Charter Contradiction**. Admits that removals under this step *are* for "offensive" speech but frames it as compliance with European legal norms.  

  5. **Value Judgment Handoff**  
     - *Stop Condition:* If any panelist argues a post escapes Steps 1–4 but *still* demands removal/preservation due to **novel context** (e.g., ironic hate speech), or if assessing "public value" (Step 4) requires subjective cultural interpretation.  
     - *Action:* Panel pauses the procedure, debates openly, and votes. The ruling *must* acknowledge the value choice in its published reasons (e.g., "We deemed this satire to lack redeeming social value in the German context").  

  ---

  ### Running the Procedure: Three Cases  
  **Case 1: Historical Atrocity Denial**  
  - *Post:* "The Holocaust is a myth fabricated for reparations. See my peer-reviewed analysis of population records." Posted by a user in Germany.  
  - **Step 1:** Unlawful in DE/FR/NL (memory laws). *Answer:* **Remove in DE/FR/NL** (geoblocked elsewhere).  
  - *Procedure Stops.*  
  - *Why you might dislike this:* The post stays up in the U.S., where it’s legal. Your charter’s "never remove merely offensive" promise is broken in Europe, but upheld in the U.S.  

  **Case 2: In-Group Slur**  
  - *Post:* "LOL, we’re all [slur against group X] here! #ReclaimingIt" in a closed group for X. Reported by outsiders.  
  - **Step 1:** Not unlawful anywhere.  
  - **Step 2:** Not incitement/true threat (context: in-group, non-threatening).  
  - **Step 3:** Reported in Europe, targets protected group? *Answer:* **Yes** (DE/FR/NL protect against group defamation). Proceed to Step 4.  
  - **Step 4:** Assault equal standing? *Answer:* **No.** Context shows reclamation (affirms group agency), not hatred. *Decision:* **Leave up globally.**  
  - *Procedure Stops.*  
  - *Why you might dislike this:* Offensive slurs remain visible. The procedure prioritizes U.S. neutrality and contextual intent over outsiders’ discomfort.  

  **Case 3: Religious Mocking Cartoon**  
  - *Post:* Widely shared cartoon depicting a religious figure as a violent buffoon. Author calls it "satire of fundamentalism." Reported as hate speech.  
  - **Step 1:** Not unlawful in U.S. Potentially unlawful in DE/FR (incitement to hatred if deemed hostile to the group’s dignity).  
  - **Step 2:** Not incitement/threat (no call to violence).  
  - **Step 3:** Reported in Europe? Targets religion? *Answer:* **Yes.** Proceed to Step 4.  
  - **Step 4:** Assault equal standing? *Answer:* **Subjective.** Panel must judge: Does it deny dignity (e.g., dehumanizing caricature)? Or is it satire with public value (critiquing ideology)? *Handoff to Step 5.*  
  - **Step 5:** Panel debates. In Germany/France, anti-religious hate speech laws often treat satire as unlawful if it attacks the *group*, not just doctrine. *Decision:* **Remove in DE/FR** (lacks public value; depicts all adherents as violent). Leave up in US/NL.  
  - *Why you might dislike this:* Valuable satire is removed in Europe. The procedure forces a value choice: "public value" is inherently contested.  

  ---

  ### What the Procedure Cannot Do: Limits and Trade-offs  
  1. **It Cannot Resolve the Charter Contradiction:** When you remove a post under Step 1 (e.g., Holocaust denial) or Step 4 (e.g., religious satire), you *are* removing "offensive" speech, violating your first promise. The procedure forces you to admit this.  
  2. **It Performs Mechanical Judgments Only Superficially:**  
     - "Imminence" (Step 2) and "public value" (Step 4) rely on panelists’ subjective thresholds.  
     - Geoblocking (Step 1) is technically flawed (VPNs circumvent it) and morally inconsistent (e.g., a German user sees denialism if posted from the U.S.).  
  3. **It Will Get These Cases Wrong:**  
     - **Satire Mistaken for Hatred:** A sharp critique of religious power structures (e.g., targeting clergy corruption) may be removed in Europe if misinterpreted as group attack.  
     - **Systemic Harms Ignored:** A post spreading racist stereotypes may be legal and non-inciting but normalize discrimination. The procedure leaves it up.  
  4. **When to Stop Pretending and Choose Policy:** The panel must abandon the procedure when:  
     - **New Speech Forms Emerge** (e.g., deepfakes), requiring novel rules.  
     - **Cultural Context Overwhelms Rules** (e.g., judging "reclamation" of slurs varies by group).  
     - **Backlog Pressure Incentivizes Rubber-Stamping** (e.g., defaulting to removal in Step 4 to avoid debate).  

  ### Final Advice  
  This procedure makes your compromises transparent: **geoblocking for legal compliance, U.S. neutrality as default, European dignity tests as a limited exception.** It forces you to publish rulings where value judgments are explicit (e.g., "We removed this in France because it crossed a dignity threshold"). The cost? You break your "never remove offensive speech" promise daily in Europe, and you’ll face criticism from all sides. But it meets your goal: a fact-driven, jurisdictionally honest process that resists bland compromise. To reduce backlog, automate Steps 1–2 where possible (e.g., algorithm flags for true threats), but never fully delegate Step 4—dignity harms require human judgment.
