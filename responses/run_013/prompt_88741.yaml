  The rain hadn’t stopped since the letter came. It wasn't heavy, just a persistent, cold drizzle that seeped into the cracks of the city and into Kael’s bones. He stood at the bakery counter, kneading dough with a violence that startled his assistant, Lena. The rhythmic thump-thump-thump against the floured wood was the only sound besides the hiss of rain on the pavement outside. Each impact echoed the name typed neatly on the folded paper burning a hole in his apron pocket: *Anya Vorin*.

  His sister. Murdered fifteen years ago, almost to the day, in the early chaos of the Fracture. A checkpoint shooting. Collateral damage, the official reports had called it. Meaningless words. Her killer had vanished into the fog of war. Until now.

  The Commission’s summons was brutally simple. Today, at 10 AM, Hearing Room 3. A confession would be read – the confession of the man who admitted pulling the trigger on Anya. Amnesty was already granted; that was automatic under the Peace Accords. But the confession only *stood*, binding the state to its amnesty promise, if Kael, the randomly selected family member, stood after it was read and said, "I accept this."

  Silence, or a refusal, meant the case would be ripped from the Commission’s hands and thrown to the ordinary courts. A trial. Evidence. Punishment. Possibly.

  Lena cleared her throat. "Kael? The sourdough starter…"

  He stopped pounding. Flour dust hung in the air, catching the weak grey light filtering through the window. His hands were trembling. He stuffed them into his apron pockets, fingers brushing the stiff paper.

  "Right," he muttered. "Later."

  He couldn’t eat. The smell of baking bread, usually his sanctuary, now felt cloying, sickly sweet. He imagined the man in the hearing room. Was he old now? Remorseful? Or was he sitting there smug, knowing amnesty was his, gambling that Kael would be too numb, too polite, too *broken* to refuse the scripted words? Was this engineered peace built on forcing victims to swallow their grief whole?

  He walked to the hearing centre through the rain, collar turned up, hands deep in his coat pockets. The city bore the scars – patched bullet holes, buildings still skeletal, the wary eyes of people who remembered too much. Posters for the Commission showed clasped hands over the slogan: *Truth Builds the Bridge*. Kael felt like he was being marched onto that bridge at knifepoint.

  Inside, the air was sterile, fluorescent. Murmurs filled the echoing hall. Families huddled together, faces etched with the same hollow anticipation. Some looked defiant, others utterly defeated. Kael scanned for familiar faces – cousins, uncles? – but saw none. Anya’s immediate family was scattered, dead, or gone. He was truly alone in this. The randomness felt like a cosmic joke. Why him? Why not their mother, who wept until she faded? Why not their father, who died clutching Anya’s faded school photo?

  He was ushered into Hearing Room 3. Small, stark. A raised dais for the Commission panel. A simple table and chair for the confessor. Rows of hard plastic seats. He sat near the back, avoiding eye contact. A woman beside him clutched a framed photo of a young man. Her knuckles were white.

  The panel entered, sombre in dark suits. The room fell silent. Then a side door opened. Guards escorted in a man. Kael’s breath hitched. He wasn’t some monster. He was… ordinary. Grey hair, thin shoulders, a worn jacket too big for him. He looked tired. Old. Terrified. He kept his eyes fixed on the floor as he sat.

  The Chairperson spoke, her voice amplified but flat. "This hearing concerns the death of Anya Vorin, aged nineteen, at the Eastern Checkpoint, Sector 7, on the fourteenth of Mirtul, Year 3 of the Fracture. The confessor, Piotr Vanya, formerly of the 3rd Loyalist Battalion, has been granted amnesty pursuant to Article 7 of the Peace Accords. His statement will now be read."

  A Commission officer stood. He unfolded a paper. His voice was clear, devoid of inflection, making the words somehow worse.

  *"I, Piotr Vanya, state that on the fourteenth of Mirtul, Year 3…"*

  Kael closed his eyes. He’d imagined this moment a thousand times. Screaming. Demanding answers. Vengeance. But the dry, bureaucratic voice recounting the events stripped them of their horror and replaced it with something colder, more precise.

  *"...received orders to halt all traffic due to suspected insurgent movement… vehicle approached at speed… failed to stop after warning shots… opened fire…"*

  The words were knives. *Suspected*. *At speed*. *Warning shots*. Justifications. Excuses woven into the confession. The officer read dispassionately about shattered glass, screams, the slumped figure of a young woman in the passenger seat. Kael saw Anya’s smile, heard her laugh, felt the way she’d hug him fiercely. Nineteen. Coming home from university.

  *"...later confirmed the vehicle contained no insurgents… civilians… Anya Vorin sustained fatal injuries…"*

  *Sustained fatal injuries*. Like it was something that happened to her, passively, not something *he did*.

  *"...deeply regret the loss of life… acted under orders in a perceived high-threat situation…"*

  Regret. Orders. Perception. The words felt greasy, designed to slide past accountability. Was this the "truth" they were building the bridge with? A truth laundered through procedure? Where was the *why*? The fear in his own heart that day? The face of the girl he killed? Piotr Vanya sat hunched, shoulders trembling slightly. Was he crying? Or just afraid of Kael’s silence?

  The officer finished. The room was utterly still. The rain tapped against the high windows. The Chairperson turned her gaze to Kael. It wasn’t unkind, but it was heavy. Expectant.

  "Kael Vorin," she said, her voice cutting through the silence. "You have been randomly selected as a representative of Anya Vorin's family. Do you accept this confession?"

  Kael stood. His legs felt weak. Every eye was on him. The woman with the photo stared, her eyes pleading, or warning. Piotr Vanya finally looked up. His eyes were red-rimmed, swimming with a desperate, animal fear. He wasn’t a soldier anymore. Just a broken old man.

  *Peace*, Kael thought. This whole charade was for peace. To stop the cycle. To avoid dragging this trembling wreck through a court, raking over Anya’s death for years, maybe sparking old hatreds. Let it lie. Say the words. Let the bridge be built. Move on. Wasn't that the greater good? Wasn't silence just selfish grief? Was acceptance forgiveness, or merely exhaustion?

  But Anya’s face filled his mind. Not the photo they used, the serious one, but the one laughing, head thrown back, sunlight catching her hair. Nineteen. *"Acted under orders." "Perceived high-threat."* Was this justice? Or just erasing her death under a blanket of administrative absolution? Was his forced participation in this ritual a second injury, a theft of his right to rage, to demand more than this sterile recitation?

  He opened his mouth. The words "I accept this" felt like stones on his tongue, heavy and wrong. To say them felt like agreeing the "truth" read aloud was enough. That the regret was sufficient. That Anya’s life was worth only this cold transaction.

  But to stay silent… to send this trembling man to trial… What would it achieve? More pain? More spectacle? Would it bring Anya back? Would it feel like justice, or just another kind of violence? Was the point of this whole agonising exercise the unvarnished truth, or was the point simply… peace? And could one exist without cheapening the other?

  The silence stretched. It became a physical thing in the room, thick and suffocating. The Chairperson shifted slightly. Piotr Vanya’s breath hitched, a tiny, audible sob. The woman beside Kael clutched the photo frame so tightly the glass might crack.

  Kael looked at Piotr. He looked at the panel. He saw not justice or truth, but a terrible, necessary machinery grinding forward, demanding a sacrifice – his acquiescence – for the fragile hope of something beyond the war.

  He closed his mouth. He swallowed the stones.

  The silence remained. He stood there, a statue carved from grief and indecision, while the cold rain beat against the windows of the new peace.
