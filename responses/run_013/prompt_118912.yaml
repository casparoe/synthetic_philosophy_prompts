prompt: |-
  You are a philosopher of ethics with expertise in population axiology and the commensurability of pleasure and pain. Think carefully before answering, and brainstorm several candidate cases before settling on one; I would rather have a single airtight case than three vivid ones.

  I am writing a paper defending a view I will call lexical threshold negative utilitarianism (LTNU), and I need a thought experiment built to specification. LTNU has two components. Below an intensity threshold T, suffering is fully commensurable with pleasure at a fixed finite exchange rate, so mild pains can be traded against goods. At or above T, suffering is lexically prior: no amount of pleasure, however large, justifies imposing it.

  The structural problem I want the case to isolate is whether T applies to each individual's experience or to suffering aggregated across individuals. Design one case, with exactly two options, subject to these constraints: realistic rather than science-fictional (no demons, no infinite or unbounded utilities, no exotic physics); populations of modest size, at most a few million; no torture; and nothing in the description may stipulate what any theory says -- every verdict must be generated by the theory rather than written into the setup. Keep the scenario to a single paragraph.

  Then, in order: (1) give LTNU's verdict on each option under the individual-threshold reading and under the aggregate-threshold reading, saying explicitly whether either reading leaves the choice indeterminate rather than merely contested; (2) give the verdicts of classical total utilitarianism and of a purely lexical negative utilitarianism with no threshold, on the same case; (3) identify the single feature of the case that does the work, and show what changes when only that feature is varied; (4) explain what a defender of the aggregate-threshold reading would have to claim in order to escape the difficulty; (5) say what LTNU collapses into when T is set to zero and when T is set to infinity. Flag any point at which your answer depends on a choice I have left open.
