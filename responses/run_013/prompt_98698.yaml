    −1 for vague problem description (e.g., "conflict" without explaining inconsistency).  

  **Part (b) Procedures (6 points)**  
  - **A answer must**:  
    - (i) Premise-based: \( P \) pass + \( Q \) pass → \( R \) pass (2 pts).  
    - (ii) Conclusion-based: Majority on \( R \) = 2 Yes, 3 No → \( R \) fail (2 pts).  
    - (iii) Chair’s sequence:  
      - \( P \) passes (3 Yes) (1 pt).  
      - \( Q \) passes among P-Yes voters (2 Yes, 1 No) → \( R \) pass (1 pt).  
  - **Deduct**:  
    −2 for misidentifying voters in (iii) step 2.  
    −1 per arithmetic error.  

  **Part (c) Chair’s rule (6 points)**  
  - **(i) Order-dependence (3 points)**:  
    - **A answer must**:  
      - State it *is* order-dependent (1 pt).  
      - Provide a **valid profile** (as in model answer) *and* show both orders yield different \( R \) (2 pts).  
    - **Deduct**:  
      −3 for claiming "impossible" or providing invalid profile.  
      −1 for correct statement but incomplete profile/calculations.  
  - **(ii) Properties (3 points)**:  
    - **A answer must**:  
      - Name **two correct satisfied properties** (e.g., anonymity, universal domain) (1 pt).  
      - Name **two correct violated properties** (e.g., neutrality, monotonicity) (1 pt).  
      - **Explain one violation** (e.g., neutrality: asymmetric treatment of P/Q; monotonicity: example where support increase flips R negatively) (1 pt).  
    - **Deduct**:  
      −1 per incorrect/missing property.  
      −1 for unexplained violation.  

  **Part (d) Defense (4 points)**  
  - **A answer must**:  
    - Choose one procedure (0 pts — free).  
    - State a **plausible, strong objection** to it (2 pts).  
    - Give a **reasoned defense** addressing the objection (2 pts).  
  - **Deduct**:  
