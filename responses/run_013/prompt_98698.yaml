answer: |-
  ### Question: The Discursive Dilemma in Tenure Decisions

  A five-person tenure committee votes on three propositions:  
  - **P**: The candidate's research meets our bar.  
  - **Q**: The candidate's teaching meets our bar.  
  - **R**: The candidate should be tenured.  

  Committee rules state: **R** holds *if and only if* **P** and **Q** *both* hold (i.e., tenure requires passing research and teaching). Votes are:  

  | Member | P   | Q   | R   |  
  |--------|-----|-----|-----|  
  | 1      | Yes | Yes | Yes |  
  | 2      | Yes | No  | No  |  
  | 3      | No  | Yes | No  |  
  | 4      | Yes | Yes | Yes |  
  | 5      | No  | No  | No  |  

  **Tasks:**  
  (a) **Majority Voting:** Compute the majority outcome for **P**, **Q**, and **R** independently. Explain the problem with these results given the rule \( R \equiv (P \land Q) \).  
  (b) **Procedures:** Compute **R** under:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) *Premise-based voting*: Majority on **P** and **Q**; **R** is their logical AND.  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) *Conclusion-based voting*: Majority on **R** (ignore **P** and **Q**).  
  &nbsp;&nbsp;&nbsp;&nbsp;(iii) *Chair’s sequence (start with **P**)*:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- Majority vote on **P**. If **P** fails, **R** fails.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- If **P** passes, take a majority vote on **Q** *only among members who voted "Yes" on **P***. If **Q** passes, **R** passes; else **R** fails.  
  (c) **Chair’s Rule Assessment:**  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) Is the rule **order-dependent**? If the chair started with **Q** (then **P** if **Q** passed), could **R** differ? *Either* provide a **5-member voting profile** where starting with **P** vs. **Q** yields different **R** outcomes, *or* argue why this is impossible.  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) Discuss **two standard properties** (e.g., anonymity, monotonicity, neutrality, independence) the chair’s rule satisfies and **two** it violates.  
  (d) **Defend a Procedure:** Choose **one** procedure (majority, premise-based, conclusion-based, or chair’s sequence). State the **strongest objection** to it and defend why it is still justified.  

  ---

  ### Model Answer (≈650 words)  
  **(a) Majority Voting Problem**  
  - **P**: 3 Yes (Members 1,2,4), 2 No → Passes.  
  - **Q**: 3 Yes (Members 1,3,4), 2 No → Passes.  
  - **R**: 2 Yes (Members 1,4), 3 No → Fails.  
  **Problem**: By committee rules, \( R \equiv (P \land Q) \). Since \( P \) and \( Q \) pass, \( R \) should pass. However, majority voting on \( R \) fails, violating logical consistency. This is a *discursive dilemma*: individual rationality conflicts with collective rationality.  

  **(b) Procedure Outcomes**  
  - **(i) Premise-based**:  
    - \( P \) passes (3 Yes), \( Q \) passes (3 Yes) → \( R = \text{Yes} \) (tenure granted).  
  - **(ii) Conclusion-based**:  
    - Majority on \( R \): 2 Yes, 3 No → \( R = \text{No} \) (tenure denied).  
  - **(iii) Chair’s sequence (start with P)**:  
    - Step 1: \( P \) majority: 3 Yes → \( P \) passes.  
    - Step 2: Vote on \( Q \) *only among P-Yes voters* (Members 1,2,4):  
      - \( Q \): 2 Yes (1,4), 1 No (2) → Majority passes → \( R = \text{Yes} \).  

  **(c) Chair’s Rule Assessment**  
  **(i) Order-dependence**: The rule **is order-dependent**. Consider this 5-member profile:  
  | Member | P   | Q   | R   |  
  |--------|-----|-----|-----|  
  | 1      | Yes | No  | No  |  
  | 2      | Yes | No  | No  |  
  | 3      | No  | Yes | No  |  
  | 4      | Yes | Yes | Yes |  
  | 5      | Yes | Yes | Yes |  
  - **Start with P**:  
    - \( P \): 4 Yes → Passes.  
    - \( Q \) among P-Yes voters (1,2,4,5): 2 Yes (4,5), 2 No (1,2) → Tie (no majority) → \( Q \) fails → \( R \) fails.  
  - **Start with Q**:  
    - \( Q \): 3 Yes (3,4,5) → Passes.  
    - \( P \) among Q-Yes voters (3,4,5): 2 Yes (4,5), 1 No (3) → Passes → \( R \) passes.  
  **Result**: \( R \) differs by order (fails if start with P, passes if start with Q).  

  **(ii) Properties**:  
  - **Satisfies**:  
    - *Anonymity*: Permuting voter identities doesn’t change outcomes (votes are aggregated symmetrically).  
    - *Universal domain*: Works for any profile (no restrictions on inputs).  
  - **Violates**:  
    - *Neutrality*: Premises are treated asymmetrically (order of P and Q affects outcomes).  
    - *Monotonicity*: Increasing support for a premise can flip R negatively.  
      - E.g., in the profile above, if Member 3 flips from \( P=\text{No}, Q=\text{Yes} \) to \( P=\text{Yes}, Q=\text{No} \):  
        - Start with P: \( P \) still passes (5 Yes), but \( Q \) now has 1 Yes (4) and 4 No (1,2,3,5) → Fails → \( R \) fails.  
        - Start with Q: \( Q \) now has 2 Yes (4,5), 3 No → Fails → \( R \) fails.  
        - Thus, Member 3’s increased support for \( P \) (flipping No→Yes) changed \( R \) from Pass to Fail when starting with Q, violating monotonicity.  

  **(d) Defense of Premise-Based Voting**  
  I recommend **premise-based voting**.  
  - **Strongest objection**: It ignores voters’ direct judgment on \( R \). Here, 3/5 members voted against tenure (\( R=\text{No} \)), yet premise-based grants tenure. This overrides the "will of the majority" on the conclusion.  
  - **Defense**: The committee’s rule (\( R \equiv P \land Q \)) defines tenure as *contingent on premises*. Premise-based voting respects this structure by ensuring \( R \) is *derived* from independent assessments of research/teaching. Objectors might misapply the rule (e.g., voting No on \( R \) despite supporting both premises) or inject bias. Conclusion-based voting risks tenure being granted when a premise fails (e.g., if \( R \) passes but \( Q \) fails). The chair’s rule is arbitrary (order-dependent) and non-monotonic. Premise-based voting upholds logical integrity and transparency.  

  ---

  ### Marking Scheme (20 points total)  
  **Part (a) Majority voting (4 points)**  
  - **A answer must**:  
    - Correctly compute \( P \) passes (1 pt), \( Q \) passes (1 pt), \( R \) fails (1 pt).  
    - State the problem: Majority on premises implies \( R \) *should* pass, but direct vote on \( R \) fails (logical inconsistency) (1 pt).  
  - **Deduct**:  
