    −2 for defense not engaging with the objection.  
    −1 for procedural choice mismatch (e.g., defending premise-based but objecting to conclusion-based).  

  **Grade boundaries**: A (18–20), B (15–17), C (12–14), D (9–11), F (<9).  
  **Key for A**: Correct computations, valid profile for (c)(i), precise properties, defense engages strongest objection.
