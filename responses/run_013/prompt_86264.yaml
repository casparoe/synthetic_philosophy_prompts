prompt: |-
  Bit of context: I'm a retired biologist — thirty-odd years in ecology and evolution, mostly population genetics, so I think in allele frequencies, selection coefficients, drift, migration, mutation and the odd bit of quantitative genetics. I've recently gotten into philosophy, and I keep running into memes and the Darwinian theory of culture, which everyone assures me is just my old field pointed at ideas instead of genes.

  So here's what I'd like. Take the main claims of that literature — that culture evolves by selection on replicating units, that memes stand to culture roughly as genes stand to biology, that taking the meme's point of view is a genuine explanatory stance and not just a metaphor — and restate them as faithfully as you can in the vocabulary I actually think in: allele frequencies and fitness, selection coefficients, copying error and mutation rate, drift, gene flow, linkage and hitchhiking, the genotype-phenotype map, heritability, and the old units-of-selection fight. Do it as a real translation, not a vibe.

  Then the part I actually care about: the residue report. What in that debate has no counterpart in population genetics at all, and what only fits if you fudge it? I have a few suspicions I'd like you to confirm or shoot down. First, cultural traits seem to blend when they're passed on rather than staying discrete — which I think is basically the objection that nearly sank Darwin before Mendelian particles showed up. Second, transmission looks low-fidelity and reconstructive, more like catching a cold than copying a file, so I'm not sure there's a stable replicator there to be selected on in the first place. Third, I genuinely can't work out what plays the phenotype role in the meme case, and without a phenotype I don't know what fitness is even a property of. Are those real problems or am I just importing my own framework? And when something like the meme's point of view doesn't survive the trip — is that my vocabulary missing something real about culture, or is it a sign the original claim was never as clear as it sounded? I'd like a verdict, not a survey.

  Be straight with me about how confident you are, and where your reasoning is most likely to break down. And concretely: what would change your mind? If some argument or consideration would flip your verdict on whether the translation actually works, tell me what it is.
