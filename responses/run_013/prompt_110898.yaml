  For structure, I'm considering: First, a preamble establishing common ground about the gravity of atrocities. Then numbered agreements covering: 1) why comparison attempts arise, 2) practical necessity in resource allocation, 3) dangers of implicit ranking, 4) distinction between scholarly/political contexts, and 5) rejection of atrocity minimization. 

  The disagreement table should isolate three core conflicts: whether incommensurability is fundamental or circumstantial; whether victim-recognizable dimensions are necessary; and whether justifications must be context-specific. For each, I'll propose test cases like comparing Holodomor and Atlantic slavery (where dimensions diverge) or Armenian genocide funding debates (for context-dependence).

