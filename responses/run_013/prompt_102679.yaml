answer: |-
  Here’s a tailored essay question, model answer, and marking scheme addressing the counterfactual problem in futarchy, designed to push students beyond superficial critiques.

  ---

  ### **Essay Question (120 words)**
  "A city commits in advance to adopt Policy A over Status Quo B if a conditional prediction market estimates higher welfare under A. The market resolves based on observed welfare 5 years post-decision.  
  (a) Precisely what probabilities does this market price, and why are they deemed informative?  
  (b) Despite advance commitment to the decision rule, the welfare estimate for Policy A is never directly validated. Explain why this ‘counterfactual problem’ undermines the scheme’s epistemic foundation.  
  (c) Does this problem invalidate the standard defense that manipulators will be ‘arbitraged away’? Why or why not?  
  (d) What minimal conditions could make such a market informative? Conclude by evaluating whether futarchy remains viable."

  ---

  ### **Model Answer (580 words)**  
  **(a)** The market prices two conditional probabilities: P(W|A) (probability of high welfare *if* A is implemented) and P(W|B) (welfare *if* B continues). Traders bet on which policy maximizes welfare, aggregating dispersed information via prices. This is deemed informative because, under efficient markets hypothesis, prices should reflect all available knowledge about causal policy impacts.

  **(b)** The counterfactual problem arises because only the welfare path of the *chosen* policy (A or B) is observed. If A is adopted, we see W|A but never observe W|B—the counterfactual outcome. Crucially, **advance commitment does not resolve this**. It ensures policy selection aligns with market forecasts, but only validates the estimate for the *selected* policy. The forecast for the *rejected* policy (e.g., P(W|B) if A is chosen) remains unverified. Since futarchy relies on comparing two conditional estimates (ΔW = P(W|A) – P(W|B)), half of the critical input (the unchosen branch) is never tested. This breaks the feedback loop for error correction: traders cannot learn from past miscalibrations of counterfactual forecasts.

  **(c)** The arbitrage defense fails for the counterfactual estimate. Manipulators distorting P(W|A) face no risk if A is rejected, as their bet never resolves. If A is adopted, they profit only if they correctly manipulate the *observed* outcome W|A—but this requires predicting real-world welfare, not the counterfactual. By contrast, bets on the chosen policy can be arbitraged because their resolution provides validation. For the unchosen policy, however, manipulators trade in a market with no eventual truth signal, inviting cheap, risk-free distortion. Thus, while commitment mitigates manipulation of the *decision rule*, it cannot ensure the accuracy of the unchosen conditional estimate.

  **(d)** The market could be informative only if:  
  (i) **External validation** exists for counterfactuals (e.g., via randomized policy trials in similar cities, or natural experiments), though this is rarely feasible for unique policies;  
  (ii) **Repeated iterations** allow indirect validation (e.g., if similar policies are tested elsewhere and traders generalize results); or  
  (iii) **Markets condition on non-manipulable correlates** (e.g., macroeconomic indicators) that are credibly linked to welfare.  

  **Conclusion**: Futarchy is severely compromised by the counterfactual gap. Advance commitment solves the self-reference problem (policy choice affecting expectations) but not the validation problem. Without exogenous counterfactual data, the scheme relies on untestable estimates for unchosen policies, inviting manipulation and epistemic drift. While theoretically elegant, futarchy requires implausibly rich parallel-word data to function as advertised. I am highly confident that the counterfactual issue is fatal in single-decision settings (*least* confident about whether repeated applications with similar policies could partially resolve it via meta-induction).

  ---

  ### **Marking Scheme (20 points)**  
  **A (17–20):**  
  - Clearly identifies P(W|A) and P(W|B) as the market’s objects (1a).  
  - Explains why advance commitment fixes self-reference but not counterfactual validation (2b).  
  - Demonstrates why manipulation of unchosen policy estimates cannot be arbitraged (2c).  
  - Proposes concrete validation conditions (e.g., randomization, natural experiments) (2d).  
  - Distinguishes between observable (chosen policy) vs. unobservable (counterfactual) validation.  
  - Flags epistemic uncertainty (e.g., viability under repetition).  

  **B (13–16):**  
  - Correctly describes market pricing (1a) but vague on why informative.  
  - Recognizes counterfactual gap but conflates it with manipulation or fails to explain why commitment doesn’t fix it (1b).  
  - Notes arbitrage defense weakness but doesn’t tie it to unresolved bets (1c).  
  - Suggests validation fixes (e.g., “better data”) without specificity (1d).  
  - Limited evaluation of futarchy’s viability.  

  **C (10–12):**  
  - Superficial treatment of market pricing (e.g., “predicts welfare”).  
  - Mentions counterfactual problem but doesn’t engage with commitment’s role.  
  - Reverts to generic manipulation/thin market critiques.  
  - No actionable validation proposals.  

  **D/F (<10):**  
  - Misidentifies the market mechanism (e.g., “votes on values”).  
  - Ignores counterfactual issue; focuses on unrelated objections.  
  - No analysis of arbitrage or validation.  

  ---

  ### **Key Differentiators for A vs. B**  
  - **A-grade**: Explicitly notes that commitment validates only the *chosen* policy’s forecast, leaving the counterfactual estimate unscored ("half the input is untested"). Links this to the collapse of the arbitrage defense for unchosen policies.  
  - **B-grade**: Identifies the counterfactual gap but doesn’t explain *why* commitment fails to address it, or vaguely suggests "manipulation is worse" without tying it to validation.  
  - **Critical nuance**: Top answers recognize that *even with honest traders*, the lack of counterfactual data prevents calibration of the critical comparison ΔW = P(W|A) – P(W|B).

