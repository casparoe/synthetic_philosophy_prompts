  We are to consider desiderata for a theory of updating on uncertain evidence. The user has provided a list of intuitive requirements, and we are to analyze which are fundamental, which might be artifacts, which are negotiable, and whether there are conflicts. We are also to check if the standard recipe (Jeffrey conditioning) satisfies the list.

  The user's current method is Jeffrey conditioning: when a sensor reports a probability distribution over a partition, we update by reweighting the prior in each cell of the partition by the reported probability for that cell.

  The user's list of desiderata:

  1. **Collapse to conditionalization**: When the evidence is certain (i.e., one cell in the partition has probability 1), the update should reduce to ordinary Bayesian conditionalization.

  2. **Order independence for independent reports**: For two independent pieces of soft evidence (that are about independent aspects of the world), the order in which they are applied should not matter.

  3. **Refinement consistency**: If we take a coarser partition and then refine it (without adding new information), the update should not change. However, if the finer partition genuinely adds more information (i.e., the report is about the finer partition), then it should change appropriately.

  4. **Idempotence**: Updating twice on the same evidence should not change the belief state beyond the first update.

  5. **No double-counting**: We should not be able to use the same piece of evidence twice (e.g., once as the reading and once as the known accuracy of the sensor).

  6. **Handling conditional evidence**: The update rule should be able to handle evidence that is given as a conditional probability (e.g., "if A then B with probability p").

  7. **Predicting own future belief**: The rule should have a coherent way to update when the evidence is a prediction about the agent's own future belief.

  Additionally, the user suspects that refinement consistency (3) and handling conditional evidence (6) might conflict.

  We will now analyze each requirement.

  ## Analysis of Desiderata

  ### 1. Collapse to conditionalization
  This is a fundamental requirement. When the evidence is certain, we are in the classical Bayesian setting, and the update must agree with conditionalization. Any rule that does not satisfy this is inadequate.

  ### 2. Order independence for independent reports
  This is a desirable property because it reflects the commutativity of evidence when the evidence is independent. However, note that independence in the reports might be tricky. If two reports are independent and pertain to independent aspects of the world, then we would expect the order not to matter. But if the reports are not independent (e.g., the second report might be about the same event but with a different sensor), then order might matter. Therefore, this requirement is conditional on the independence of the evidence. It is negotiable in the absence of independence, but for independent reports, it is a requirement for consistency.

  ### 3. Refinement consistency
  This is also known as the "refinement" or "coarsening" property. The idea is that if we have a partition and we get a report on that partition, then if we later refine the partition (without changing the information), the update on the refined partition should be consistent with the original update. However, if the report is about a finer partition, then it provides more information and should change the belief accordingly. This is a fundamental requirement for consistency under representation changes. Without it, the same evidence would lead to different beliefs depending on how we model the world.

  ### 4. Idempotence
  Updating twice with the same evidence should not change the belief. This is because the first update already incorporates the evidence. Without idempotence, we could drift arbitrarily by repeatedly applying the same evidence. This is a fundamental requirement.

  ### 5. No double-counting
  This is a fundamental requirement for any rational system. Using the same evidence twice would lead to overconfidence and incorrect beliefs.

  ### 6. Handling conditional evidence
  The user points out that sometimes the evidence is not a direct probability but a conditional probability. This is common in real-world scenarios (e.g., "if the door is locked, then the alarm is armed with probability 0.9"). The update rule must be able to incorporate such evidence. This is a requirement for expressiveness.

  ### 7. Predicting own future belief
  This is a more exotic requirement. If the agent receives a report that says "in 10 minutes you will believe X with probability p", then how should the agent update now? This touches on self-referential beliefs and is related to reflective consistency. While it might be a rare case, it is important for a complete system. This requirement might be negotiable in simpler systems, but in an agent that models itself, it becomes important.

  ## Potential Conflicts

  The user suspects a conflict between refinement consistency (3) and handling conditional evidence (6). Let's consider:

  - **Refinement consistency** requires that if we have a partition and we coarsen it, then updating on the same report (which now is about the coarser partition) should yield a consistent belief state.

  - **Conditional evidence** might require updating on a statement that involves multiple cells. For example, a conditional statement "if A then B" might involve two events that are in different parts of the partition.

  In Jeffrey conditioning, the update is defined for a partition. If the evidence is conditional, we might not have a direct partition to update on. One common approach is to use the rule of probability to express the conditional as a constraint and then update accordingly. However, this might require extending the partition to include the relevant events.

  A conflict might arise if the conditional evidence is about events that are not aligned with the current partition. Then, to update, we might need to refine the partition. But the refinement consistency requirement would then say that if we refine the partition and then update with the same conditional evidence, we should get the same result as if we had updated on a coarser partition that already captured the conditional. However, conditional evidence might not be expressible in a coarser partition without loss of information.

  For example, consider a partition {A, not A}. Now we get a conditional: "if A then B with probability 0.8". This conditional evidence cannot be expressed as a probability distribution over the partition {A, not A}. We need to consider a finer partition: {A and B, A and not B, not A}. Then we can update on the constraint P(B|A)=0.8. But if we had updated on the coarser partition first and then refined, we would have to re-update? This seems to break refinement consistency.

  Thus, there is a tension. The requirement for handling conditional evidence might force us to have a more expressive update rule that goes beyond Jeffrey conditioning and might break refinement consistency unless we are careful about the representation.

  ## Which Requirements are Fundamental?

  The fundamental requirements (non-negotiable) are:

  1. Collapse to conditionalization: without this, the rule is not a generalization of Bayesian updating.

  4. Idempotence: without it, updating is unstable.

  5. No double-counting: essential to avoid overconfidence and incoherence.

  The other requirements are important but might be negotiable in certain contexts or might require careful design:

  2. Order independence: This is desirable but might not be achievable in all cases without independence. Also, note that even in standard Bayesian updating with multiple pieces of evidence, order does not matter if the evidence is conditionally independent given the state. So we should aim for it under independence.

  3. Refinement consistency: This is fundamental for representation invariance. However, it might be challenging when incorporating new types of evidence (like conditionals) that require a more detailed representation.

  6. Handling conditional evidence: This is necessary for expressiveness. Without it, the system cannot handle a common form of evidence.

  7. Predicting own future belief: This is more of an advanced feature and might be negotiable in a simple system, but it is important for self-reflective agents.

  ## Conflicts: "Pick Two" Scenario?

  The user suspects that not all requirements can be satisfied simultaneously. Indeed, there is a known conflict between Jeffrey conditioning and refinement consistency when the evidence is not about the entire partition. Jeffrey conditioning requires a partition and updates by reweighting the prior by the reported probability for each cell. If we refine the partition, the same report (which is about the coarser partition) must be applied to the finer partition by distributing the probability appropriately. However, if we have conditional evidence, it might not be about a partition at all.

  Moreover, there is a conflict between the requirement for handling conditional evidence and the requirement for refinement consistency without additional constraints. Specifically:

  - If we have a conditional evidence report and we are working with a coarse partition, we cannot represent the conditional. We must refine the partition. But then, if we update on the conditional evidence in the refined partition, we get one belief state. If we had updated the coarse partition with the same conditional evidence (if we could), we would get a different belief state? But we cannot update the coarse partition because the conditional evidence is not about the coarse events.

  Therefore, we must break refinement consistency in the sense that the update on the coarse partition is not defined for conditional evidence. We have to refine the partition to update. This is acceptable if we interpret refinement consistency as only applying when the evidence is about the same information. But conditional evidence is different information than a direct report on a partition.

  So the conflict is avoidable by noting that conditional evidence is a different type of evidence and requires a different representation. But then we are not updating the same evidence on two different partitions; we are updating with a new type of evidence that requires a finer partition.

  Therefore, the requirement of refinement consistency should be interpreted as: when the evidence is about the same events (i.e., the same partition), then coarsening or refining without changing the meaning should not change the result. Conditional evidence is about a different set of events (it involves a condition) and therefore requires a different partition. So there is no conflict if we allow the update rule to require a partition that matches the evidence.

  However, note that the standard Jeffrey conditioning does not handle conditional evidence. So we need a more general rule.

  ## Does Jeffrey Conditioning Satisfy the List?

  Let's check the standard Jeffrey conditioning against the list:

  1. **Collapse to conditionalization**: Yes, when the reported probability for one cell is 1 and 0 for others, it reduces to conditionalization.

  2. **Order independence for independent reports**: This is not generally satisfied by Jeffrey conditioning. Jeffrey conditioning is defined for a partition. If we have two independent reports on two different partitions, the order might matter because the first update changes the probabilities and the second update is applied on a different probability distribution. However, if the partitions are independent (in the sense that they are for independent random variables) and the reports are independent, then the order should not matter. But note: Jeffrey conditioning does not assume independence and does not necessarily preserve it. So order independence is not guaranteed.

  3. **Refinement consistency**: Jeffrey conditioning does satisfy this in the following sense: if we have a partition and we get a report on it, and then we refine the partition (without any new evidence) by splitting one cell into subcells, then we can use the same report by distributing the probability for the original cell to the subcells in proportion to their prior. Then, if we update the refined partition with the same report (but now the report is about the coarser cells), we get the same result as updating the coarse partition and then refining. However, note that the report must be interpreted as being about the coarse cells. If we have a report about a finer partition, then it is a different report.

  4. **Idempotence**: If we apply Jeffrey conditioning twice with the same report on the same partition, it is idempotent. Because after the first update, the posterior for the partition is exactly the reported distribution. The second update will use the same weights and leave it unchanged.

  5. **No double-counting**: Jeffrey conditioning does not by itself prevent double-counting. It is up to the system to ensure that the same evidence is not used twice. However, the rule does not inherently double-count if applied correctly.

  6. **Handling conditional evidence**: Jeffrey conditioning does not handle conditional evidence directly. It requires a probability distribution over a partition. Conditional evidence would require a different approach.

  7. **Predicting own future belief**: Jeffrey conditioning does not address this.

  Therefore, Jeffrey conditioning satisfies 1, 3 (in the sense described), 4, and 5 (if we are careful about evidence management). It does not satisfy 2 in general, and it fails 6 and 7.

  ## What to Do?

  The user needs a more general update rule. Some possibilities:

  - For conditional evidence, one can use the method of "virtual evidence" (also known as likelihood ratio evidence). This method represents the evidence by a likelihood ratio for the event. For example, the conditional "if A then B with probability 0.8" can be interpreted as a likelihood ratio for B given A and for not B given A. This method updates by multiplying the prior by the likelihood ratio and normalizing. This update is partition-independent (it can be applied to any partition that includes A and B) and satisfies refinement consistency.

  - For order independence, if the evidence is independent, then the virtual evidence method (which is a form of Bayesian update on an auxiliary event) can be applied in any order and will be commutative.

  - For predicting own future belief, this is more complex and might require a model of the agent's own updating process. One approach is to treat the prediction as a constraint on the future belief and then use a reflection principle to set the current belief to match the prediction (if the agent trusts the predictor). However, this is an active area of research.

  ## Summary of Requirements and Conflicts

  Fundamental and non-negotiable: 1, 4, 5.

  Highly desirable but might require careful handling: 2, 3, 6.

  Advanced and negotiable: 7.

  Conflict between 3 and 6? Only if we force conditional evidence to be represented in a coarse partition. But if we allow the update rule to require an appropriate partition, then there is no conflict: conditional evidence requires a partition that includes the relevant events. Then we can apply virtual evidence (which satisfies refinement consistency because it is a linear constraint on the probabilities). However, note that virtual evidence is not Jeffrey conditioning.

  The standard recipe (Jeffrey conditioning) does not meet all the requirements. It fails on 2, 6, and 7.

  ## Recommendations

  1. For direct evidence on a partition, use Jeffrey conditioning.

  2. For conditional evidence (and other forms of evidence that are not a distribution on a partition), use virtual evidence (likelihood ratio update).

  3. For order independence: when using virtual evidence for independent pieces of evidence, the order does not matter because the update is multiplicative and commutative.

  4. For refinement consistency: both Jeffrey conditioning and virtual evidence can be made to satisfy it by ensuring that the evidence is represented appropriately for the partition.

  5. For the advanced case of self-prediction, you may need to implement a reflection principle. However, this is non-trivial and might require more research.

  In summary, the standard recipe is adequate for direct evidence on a partition but not for the other cases. By adopting virtual evidence for non-partition evidence, you can cover more ground.
answer: |-
  ### Desiderata for Belief Update on Uncertain Evidence  
  Below is your spec: the core desiderata any theory of belief update must satisfy to be adequate, with rationale, critical pushback, and conflicts highlighted. I focus on operational principles, not academic debates.  

  #### Non-Negotiable Desiderata (Must-Haves)  
  These are fundamental; violating them breaks rationality or basic coherence.  

  1. **Collapse to Conditionalization**  
     - **What**: When evidence is certain (e.g., sensor reports event \(E\) with \(P(E) = 1\)), update reduces to Bayesian conditionalization: \(P_{\text{new}}(H) = P_{\text{old}}(H | E)\).  
     - **Why**: Core axiom of probability. Violating this contradicts logic when evidence is crisp.  
     - **Status**: Unconditional. Non-negotiable for any theory.  

  2. **Idempotence**  
     - **What**: Updating twice with the **same identical evidence** (same report, same context) yields no further change after the first update.  
     - **Why**: Prevents belief drift from redundant data. Without this, identical sensor rereadings could arbitrarily amplify confidence.  
     - **Status**: Non-negotiable. Evidence is uniquely identified; double-counting is failure.  

  3. **No Double-Counting**  
     - **What**: Evidence used in two roles (e.g., as a direct observation *and* as metadata about sensor reliability) must not be applied twice.  
     - **Why**: Double-counting inflates confidence and corrupts calibration (e.g., using a temperature reading once as "it’s hot" and again as "the sensor is accurate when hot").  
     - **Status**: Non-negotiable. A meta-rule about evidence lifecycle, not update mechanics.  

  4. **Internal Consistency (No Dutch Books)**  
     - **What**: Beliefs must remain coherent (probabilities sum to 1, no sure-loss bets).  
     - **Why**: Prerequisite for rationality. Update rules that violate coherence (e.g., creating \(P(A) + P(\neg A) \neq 1\)) are catastrophically flawed.  
     - **Status**: Non-negotiable. Overrides all else.  

  #### Negotiable Desiderata (Context-Dependent)  
  These are desirable but may conflict or require concessions.  

  5. **Order Independence for Independent Evidence**  
     - **What**: For two *provably independent* reports (e.g., unrelated sensors on disjoint events), order of updates shouldn’t matter.  
     - **Why**: Commutativity simplifies pipelines and avoids hidden order dependencies.  
     - **Pushback**:  
       - **Artifact?** Partially. "Independence" is often unverifiable (e.g., two sensors may share hidden calibration errors).  
       - **Negotiable**: If evidence isn’t independent (common in practice), order *should* matter. Sacrificing this for simplicity is acceptable if sensors are vetted.  
       - **Cost**: Dropping it means pipeline order affects outcomes—requires careful sequencing.  

  6. **Refinement/Coarsening Invariance**  
     - **What**: Booking evidence over a finer/coarser partition shouldn’t change beliefs, **if** the refinement adds no new information.  
     - **Why**: Beliefs should depend on semantics, not syntax (e.g., reporting "rain" vs. "rain & warm" or "rain & cold" with no extra data).  
     - **Pushback**:  
       - **Artifact?** No—this is about model stability. But "no new information" is subtle (e.g., finer partitions may imply latent structure).  
       - **Negotiable**: Only if you allow approximate methods (e.g., ignoring correlations in finer partitions).  
       - **Cost**: Sacrificing this introduces representation dependence—beliefs drift if you redraw cell boundaries.  

  7. **Handling Conditional Evidence**  
     - **What**: Update rules must ingest statements like \(P(B|A) = p\) (e.g., "if door locked, alarm armed with 90% probability").  
     - **Why**: Real sensors often report conditionals (e.g., diagnostics, causal dependencies). Ignoring these forces lossy approximations.  
     - **Pushback**:  
       - **Artifact?** No. But requires extending beyond partition-focused updates.  
       - **Negotiable**: Yes, if you preprocess conditionals into unconditional beliefs (e.g., assume \(A\) is true). Cost: Incorrect if \(A\) is uncertain.  

  8. **Self-Prediction Compatibility**  
     - **What**: If evidence predicts *your future belief* (e.g., "in 10 min, you’ll believe \(P(H) = 0.8\)"), current belief should update.  
     - **Why**: Agents exist in time; ignoring self-predictions leads to epistemic contradictions.  
     - **Pushback**:  
       - **Artifact?** No, but rare in simple systems.  
       - **Negotiable**: Yes. If self-prediction is unreliable or costly to handle, ignore it. Cost: Limits reflective reasoning.  

  ### Conflicts: "Pick Two" Trilemma  
  **Refinement Invariance (6) + Conditional Evidence (7) + Computational Tractability** form a trilemma. You can’t have all three cheaply:  
  - **Conflict**: Conditional evidence (\(P(B|A) = p\)) requires updating *relationships* between cells, not cells in isolation. Refinement invariance demands that coarsening/fining partitions preserves beliefs. But conditionals introduce cross-partition dependencies that break naive reweighting.  
    - **Example**: Suppose you have cells for \(A \wedge B\), \(A \wedge \neg B\), \(\neg A\). Reporting \(P(B|A) = 0.9\) constraints the ratio of \(A \wedge B\) to \(A \wedge \neg B\). If you coarsen to \(\{A, \neg A\}\), this ratio is lost. Updating on \(A\) alone (e.g., \(P(A)\) increases) won’t preserve \(P(B|A)\).  
  - **What Breaks**:  
    - **Choose 6 + 7**: Requires full joint distribution updates (e.g., entropy minimization). Cost: Computationally heavy (exponential in variables).  
    - **Choose 6 + Tractability**: Stick to partition-only updates (à la Jeffrey). Sacrifice 7: Approximate conditionals as unconditional (e.g., assume \(A\) is true). Cost: Errors when \(A\) is uncertain.  
    - **Choose 7 + Tractability**: Use heuristics (e.g., virtual evidence). Sacrifice 6: Beliefs change if you refine partitions. Cost: Model stability issues.  

  ### Does Jeffrey Conditioning Satisfy the Spec?  
  **Short**: It meets *some* must-haves but fails key negotiable ones, especially conditionals and refinement.  
  - **Satisfies**:  
    - Collapses to conditionalization (1).  
    - Idempotent (2) for identical evidence on the same partition.  
    - Avoids double-counting (3) if evidence IDs are tracked.  
    - Coherent (4) by construction.  
  - **Fails**:  
    - **Order Independence (5)**: Not guaranteed. Jeffrey updates on partitions sequentially; order matters if partitions overlap.  
    - **Refinement Invariance (6)**: Only if partitions are *irrelevant* to the evidence. Updating on a coarser partition throws away information.  
    - **Conditional Evidence (7)**: Cannot natively handle \(P(B|A)=p\). Requires hacking (e.g., update as if \(A\) is certain).  
    - **Self-Prediction (8)**: No support.  
  - **Why?** Jeffrey conditioning is partition-dependent. It assumes evidence directly reports probabilities over mutually exclusive cells. If your sensor’s "soft stuff" doesn’t align with these cells (e.g., conditionals, self-reports), it breaks.  

  ### Recommendation  
  - **Stick with Jeffrey for now** if:  
    - Sensors report directly on your partition cells.  
    - Conditionals are rare or preprocessed.  
    - Refinement isn’t dynamic (partition structure is fixed).  
  - **Upgrade if**:  
    - Conditionals or self-predictions are critical → Use **virtual evidence** (likelihood reweighting) for conditionals.  
    - Refinement invariance is essential → Use **minimum cross-entropy** updates (generalizes Jeffrey).  
    - Self-prediction matters → Implement **reflection principles** (e.g., Pauli updates).  

  **Final Reality Check**: Jeffrey is the "standard recipe" because it’s simple and works for direct measurements on predefined variables. But it’s a special case—it behaves only when evidence matches your ontology. When sensors report conditionals, correlations, or self-referential data, it’s inadequate. Define evidence rigorously (what it refers to, how it’s identified), then choose an update rule that fits—even if it costs more compute.
