      With these numbers, the simulation should work.

      Let's write the detailed rules.

      But note: leisure is collected but not used in the mechanics? We are tracking it for the well-being metric.

      At the end, we calculate for each band:
          - Total population (P_total)
          - Total leisure accumulated (sum over rounds of leisure points)
          - Health proxy: for foragers, they had the diverse diet when they foraged -> but we can track a health score as the number of rounds they had diverse diet.

      Or we can have health = sum over rounds of (1 if they had diverse diet that round, 0 otherwise).

      And then we compare bands.

      We also want to show inequality in farming bands? We haven't modeled that within the band. We can skip in-band inequality for simplicity and just show the average well-being.

      Now, what can go wrong:
          - A band might never farm and avoid the trap. That's fine. They will have high leisure and health but lower population.
          - A band might farm from the beginning and grow very fast, but then be trapped and have low leisure and health.
          - Some bands might try to farm occasionally and not become dependent? We said dependency after 3 rounds (cumulative). So if they farm 2 rounds and then forage, they are not dependent.

      We might need to run enough rounds to ensure some bands become dependent.

      Also, we can introduce a climate shock: in round 5, foraging yield is reduced by 50% for one round. This might push bands to farm.

      But to keep it simple, we might not.

      Debrief:
          - Map to reality: 
              - The health and leisure metrics represent the well-being of individuals. Anthropological evidence suggests foragers had more leisure time and a more varied diet.
              - The population metric represents the ability to sustain larger groups, which farming allowed.
              - The seizure represents the emergence of elites and taxation.
              - The dependency represents the loss of foraging skills and the alteration of the environment (or population growth beyond what the wild resources can support).

          - Objections: 
              - Romanticizing foragers: they faced famines too, and agriculture allowed civilization, art, etc.
              - The simulation is simplistic: real decisions were made over generations, and there were many factors (climate change, animal domestication, etc.).
              - Not all farming societies had extreme inequality.

          - What the simulation can't reproduce:
              - The timescale (thousands of years) and the incremental steps.
              - The diversity of hunter-gatherer societies (some were more sedentary and complex).
              - The role of technology and innovation in agriculture.
              - The benefits of settled life beyond calories (e.g., building permanent homes, accumulating goods).

      One-line summary: "Agriculture enabled population growth and storage but at the cost of leisure, diet diversity, and equality, creating a dependency trap that was hard to escape."

      Now, let's write the student instructions and TA guide.
answer: |-
  ### Neolithic Transition Simulation: "The Agriculture Trap"

  **One-line summary:** Students experience how agriculture's calorie surplus enables population growth but creates irreversible dependencies, health costs, and inequality, challenging the myth of linear progress.

  ---

  ### **Game Setup**
  **Time:** 90 minutes (15 min setup, 45 min gameplay, 30 min debrief)  
  **Students:** 20 (divided into 4 bands of 5 students each).  
  **Materials per Band:**  
  - 12 red tokens (wild foods: diverse, perishable)  
  - 20 blue tokens (grain: storable, less nutritious)  
  - 10 green tokens ("leisure/health" points)  
  - 1 population tracker (start at 10 "people")  
  - 1 storage bag (for grain surplus)  
  - 1 decision card (FORAGE or FARM)  

  **TA Materials:**  
  - Timer  
  - Inequality tokens (black chips for "elite seizure")  
  - Dependency tokens (yellow chips, 1 per band)  
  - Whiteboard to track bands’ metrics  

  ---

  ### **Rules & Rounds**  
  **Rounds:** 8 rounds (5 min/round), each representing a generation.  
  **Per-Round Choices:**  
  1. **Decision:** Each band chooses:  
     - **FORAGE:** Gain wild foods + leisure.  
     - **FARM:** Gain grain but lose leisure.  

  2. **Resource Collection:**  
     - **FORAGE Band:**  
       - Gain `1 red token per person` (diverse diet).  
       - Gain `1 green token per 2 people` (leisure/health).  
     - **FARM Band:**  
       - Gain `2 blue tokens per person` (grain surplus).  
       - Gain `0 green tokens` (labor cost).  

  3. **Feeding & Population:**  
     - **All bands** lose `1 token per person` to "feed" population.  
     - **FORAGERS:** Use red tokens. If they have ≥3 red tokens *of different "types"* (simulate diversity), gain +1 green token (health bonus).  
     - **FARMERS:** Use blue tokens. No health bonus.  
     - **Starvation:** If tokens < population, lose excess people (e.g., 12 people but 10 tokens → 2 die).  

  4. **Surplus & Growth:**  
     - **FORAGERS:** Red tokens *vanish* after feeding (perishable). Cannot grow population.  
     - **FARMERS:** Store surplus blue tokens. Use `2 stored tokens → +1 person` (population growth).  

  5. **Inequality Mechanism:**  
     - **Farmers only:** After growth, TA seizes `30% of stored grain` (round down) as "elite tax" (black tokens).  
     - *Effect:* Farmers keep less surplus, forcing more farming to offset losses.  

  6. **Dependency Trap (Key Mechanism):**  
     - After **3+ rounds of farming**, the band gets a yellow "dependency token."  
     - **Dependent bands** that try to FORAGE:  
       - Collect only `0.5 red tokens per person` (degraded skills/environment).  
       - Lose `ALL stored grain` (abandoned granaries).  
       - *Result:* Starvation if they switch back (e.g., 10 people need 10 tokens → get only 5 → 5 die).  

  ---

  ### **Metrics & Winning**  
  - **Calorie Score:** Total population × 10.  
  - **Well-Being Score:** Green tokens + health bonuses.  
  - **No overall "winner"**—highlight tension between metrics.  
    - Farmers lead in calories.  
    - Foragers lead in well-being.  

  ---

  ### **Predicted Issues & Fixes**  
  **Problem:** A band minimizes farming to avoid dependency.  
  - **Why it happens:** Students prioritize short-term well-being.  
  - **Fix:** In Round 3, announce a "climate shock" (wild food scarcity): Foragers lose 30% of red tokens that round. Encourages farming experimentation.  

  **Problem:** A band maximizes calories, ignoring well-being.  
  - **Why it happens:** Students fixate on population "success."  
  - **Fix:** In debrief, contrast their calorie score with skeletal evidence (e.g., farmer remains show more anemia). Ask: "Did ‘more people’ mean ‘better lives’?"  

  **Problem:** Inequality feels abstract.  
  - **Fix:** Let farming bands "elect" a leader who distributes the seized grain (sparking internal conflict).  

  ---

  ### **Debrief Framework**  
  1. **Map Game to Reality:**  
     - **Affluence:** Foragers had diverse diets, leisure (Sahlins' "original affluent society").  
     - **Trap:** Farming raised carrying capacity but locked societies in via population pressure (Diamond's "worst mistake").  
     - **Inequality:** Grain storage enabled elites—archaeology shows wealth gaps in early farming sites (Çatalhöyük).  

  2. **Critical Tensions:**  
     - "Fed more people ≠ better for people": Farmers had shorter lives, more disease (bio anthro evidence).  
     - "Irreversible ≠ bad": Agriculture enabled cities/art—but at costs we didn’t choose collectively.  

  3. **Counterarguments:**  
     - "Romantic nonsense?": Acknowledge forager volatility (famines) but note farmers faced worse inequality.  
     - "Progress inevitable?": Emphasize local agency—people farmed incrementally (e.g., to buffer risk), not knowing long-term effects.  

  ---

  ### **What the Simulation Can’t Capture**  
  - **Timescale:** Real transition took millennia; game compresses it.  
  - **Diversity:** Not all foragers were nomadic (e.g., Pacific Northwest sedentary fishers).  
  - **Ecology:** Game omits soil depletion/pathogens, which made farming unsustainable in some regions.  
  - **Agency:** Real Neolithic people blended foraging/farming (debriefer: "They hedged bets—unlike your either/or choices!").  

  **Supplied in Debrief:** Context on gradual adoption (e.g., millennia of low-level cultivation before dependency) and regional variability (e.g., fertile vs. marginal zones).  

  ---  
  **Final Tip:** Run a test round with a friend to tweak token ratios. Focus the debrief on the "trap" feeling—students should leave unsettled by trade-offs!
