prompt: |-
  Alright, I'm going to try this a second time, because my first attempt at writing it out was a rambling mess.

  Background so you know where I'm coming from: I did experimental work on thin films and phase transitions for about 35 years, retired in 2023, and I've spent most of my retirement reading philosophy of physics. Thermo was always my favorite subject and Maxwell's demon is the thing I can't let go of.

  What I want from you is a number. Specifically: your credence that Landauer's principle is a fundamental law of physics rather than a derived regularity. To be clear what I'm asking — the claim is that their is no physically possible process that erases one bit of logical information and dissipates less than kT ln 2 of heat into a bath at temperature T. No exceptions for clever implementations. It constrains the world the way the second law is supposed to, not the way an engineering rule of thumb does. The denial isn't that erasure usually costs something; it's that the cost is a theorem about certain kinds of memory under certain assumptions, rather than a law, so that there exist devices the bound simply doesn't cover.

  I was taught that the demon gets exorcised by information — that the demon has to pay for its memory somewhere, and that this is the deep lesson. Then I read a philosopher of physics making what I'll call the swindle complaint: he says erasing a bit isn't even a well-defined physical operation until you've fixed the map from physical states to logical 0 and 1, that you're free to pick a map under which the very same physical process does no erasing at all, and that once you see this the whole information-theoretic rescue starts to look like bookkeeping dressed up as physics. I don't know how much of that survives contact with the actual derivations, which is part of why I'm asking you.

  So: give me the number, and then decompose it. The sub-questions I think it rests on, at minimum:

  (a) Is the logical content of a memory well-defined independently of the implementation and the coarse-graining? If it isn't, the principle can't even be stated as a universal law, and that's most of the game.
  (b) Do the standard derivations need auxilliary assumptions that aren't themselves laws (single bath, no initial correlations, reset to a standard state, slow/quasistatic control)? If so, how much does that dent the universality?
  (c) Can the demon dodge erasure entirely by running its memory on reversible operations, so that whatever ends up saving the second law, it isn't the erasure cost?
  (d) How much weight should the bench-top demonstrations of the bound carry? They nail it for particular devices, but do they tell us anything about the universal claim?
  (e) Whatever else you think belongs that I've missed.

  For each, give me a rough probability and one line of justification. Then tell me how they combine into your final number, which of them the number is most sensitive to, and what single result or argument would move you the most. I've been oscillating between about 0.3 and 0.7 myself, which I take to be a sign that I haven't understood something.
