prompt: |-
  You're a medieval philosophy examiner who knows Aquinas's moral and political writings well. I've got a pile of first-year essays to mark and I'm second-guessing myself on this one, so I'd like a second opinion before I commit to a grade. Have a careful think first — sketch what a strong answer to the question would need to cover — then give me your assessment.

  Question: Does Aquinas think it is permissible to overthrow a tyrant? Discuss with reference to his treatment of tyranny and sedition.

  Student's answer: Aquinas's discussion of tyranny is more radical than people expect. In the Summa Theologiae he asks whether sedition is a mortal sin. He defines sedition as discord within a multitude, opposed to the unity of law and the common good, and he says it is always a mortal sin because it attacks the common good. That sounds like a blanket ban on rebellion. But Aquinas goes on to say that a tyrannical government is not just, because it is directed not to the common good but to the private good of the ruler. So disturbing a tyrannical regime is not sedition at all: it is not the kind of discord the prohibition targets. He even treats it as praiseworthy to deliver a people from a tyrannical rule. Of course, he is not naive. He warns that a successful rebel may seize power and become a worse tyrant, and that the upheaval may harm the multitude more than the tyrant did. So the permission is conditional: where a tyrant is genuinely intolerable, the people may depose or kill him, provided the remedy is likely to leave them better off. The only real constraint is that the action must serve the common good rather than private ambition. Aquinas therefore gives us a conditional endorsement of tyrannicide — one that later resistance theorists would develop — and he thinks any citizen who acts for the common good rather than out of private ambition may take part.

  Give me a grade (first, 2:1, 2:2, third, fail — or say which scale you're using) and then point-by-point comments that justify it: what's right, what's wrong, and what's missing. Be explicit about which claims are settled among people who know Aquinas and which are genuinely contested; don't present a contested reading as if it were the consensus. Keep the whole thing under 450 words.
reasoning: |-
  Okay, let me approach this like a medieval philosophy examiner. The student's essay tackles Aquinas on tyranny and sedition - a complex topic where beginners often oversimplify. 

  First, considering what makes a strong answer: It needs precise textual grounding in ST II-II q42 on sedition and De Regno's discussion of tyranny. Key points would cover Aquinas's definition of sedition as sinful discord against just authority, his exception for opposing tyrannical regimes that harm the common good, and the prudential caveats about worse outcomes. Crucially, it should distinguish between Aquinas's theoretical permission and his practical reservations.

  Now evaluating the student's response: They correctly identify the sedition exception and common good focus (strong textual use of ST II-II q42 a2). The conditional permission analysis shows good understanding. But two significant gaps stand out: First, they miss Aquinas's clear hierarchy of authority - he insists rebellion should ideally come from public authority (like nobles), not private citizens. Second, they omit the crucial "intolerability" threshold from De Regno where Aquinas says tyranny must be unbearable and irremediable. 

  The student also slightly overstates by saying "any citizen" can act - Aquinas is more cautious. And while they note prudential concerns, they don't engage Aquinas's deeper worry that rebellion often creates more disorder (a key theological point). 

  For grading: This is a solid 2:1 (B+) - above average but not excellent. Strengths outweigh weaknesses: they grasp the core argument and avoid major errors. The missing elements are important but not fundamental; the citizen-action point is their only clear misinterpretation. With marginal comments adding the hierarchical authority and intolerability points, this would be first-class material.
answer: |-
  ### Grade: **2:1 (Upper Second Class)**  

  ### Comments:  
  **Strengths:**  
  1. **Correct Core Argument:** Accurately identifies Aquinas’s key distinction: opposing a *tyrant* (who subverts the common good) is not sedition, which targets just rulers (ST II-II, q.42, a.2).  
  2. **Contextual Nuance:** Rightly notes Aquinas’s prudential warnings about unintended consequences (e.g., worse tyranny post-rebellion) and the necessity of net benefit to the common good.  
  3. **Textual Grounding:** Properly cites Aquinas’s view that deposing a tyrant is *praiseworthy* when it serves the common good (ST II-II, q.42, a.2 ad 3).  

  **Weaknesses/Missing Elements:**  
  1. **Hierarchy of Authority:** Omits Aquinas’s insistence that rebellion should ideally be led by *public authority* (e.g., nobles, representatives), not private individuals (*De Regno* I.6-7). The claim that "any citizen" may act is **incorrect**; Aquinas fears anarchic violence.  
  2. **Intolerability Threshold:** Fails to mention Aquinas’s stringent criterion: tyranny must be *intolerable and irremediable* by lesser means (e.g., persuasion, legal checks) (*De Regno* I.7).  
  3. **Sedition’s Scope:** Overlooks that Aquinas condemns *all* rebellions against *just* rulers as seditious sin—even if motivated by perceived injustice (ST II-II, q.42, a.2).  

  **Contested/Overstated Claims:**  
  - **"Conditional tyrannicide":** Aquinas *permits* deposition but avoids explicitly endorsing killing (e.g., *De Regno* I.6 ambiguously cites tyrannicide as a "remedy," but stresses its risks). Scholars debate if he condones assassination (consensus: he leans toward deposition over murder).  
  - **"Radical" Reading:** While Aquinas permits resistance, he prioritizes order. Calling this "radical" oversimplifies his conservatism; most agree he is cautiously permissive, not revolutionary.  

  **Conclusion:**  
  A strong grasp of Aquinas’s core exception to sedition, but key nuances (authority hierarchy, intolerability, avoidance of murder) are missing or misstated. The answer exceeds baseline competence but lacks the precision for a First.  

