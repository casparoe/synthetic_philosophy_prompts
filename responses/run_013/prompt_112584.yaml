prompt: |-
  I'm an undergraduate research assistant in a consciousness lab and I'm taking a seminar on philosophy of mind. My PI wants us to adopt heterophenomenology as the lab's standard method for collecting and interpreting first-person reports, and she has asked me to draft a protocol we can actually run. We conduct about ten 30-minute sessions a week with untrained participants; the reports feed into a paper and a grant renewal, so mistakes are costly, but I cannot change the IRB-approved script or the session length. Please write a reusable procedure: the steps in order, what counts as a sufficient answer at each step, where the procedure stops with a no, where it hands the decision to the PI because the question is interpretive or evaluative rather than factual, and what the procedure cannot settle at all. Ground it in what heterophenomenology actually says—bracketing the reality of the reported experiences, treating reports as building a heterophenomenological world, using the intentional stance, and not confusing the subject's reports with third-person evidence about mechanism—but keep it usable by a student who has read the theory once. Then run it on three cases: (1) a participant reports a red afterimage that is more real than the screen and insists it persists after the stimulus is gone; (2) a participant in a masked-priming task says she just guessed but her accuracy is far above chance; (3) a participant says the experimenter made him press the button and that he felt no agency, which I want to use as evidence of unconscious volition. For each case, say what the procedure licenses, what it forbids, and where I have to stop and ask the PI. Include one case where the procedure gives an answer I will not like. Finally, give me a table with columns Step, Action, Sufficient answer, Stop condition, Judgment call, and a second table for the cases with columns Case, Heterophenomenological world, What the reports license, What they do not license, Decision, Residual judgment. Do not give me citations or a reading list.
reasoning: |-
  We are designing a heterophenomenological protocol. Key principles:
  1. Bracketing: We do not assume the reports are about real mental states; we treat them as texts to be interpreted.
  2. Heterophenomenological world: We build a world from the subject's reports, as if we were anthropologists studying a native's beliefs.
  3. Intentional stance: We interpret the subject as a rational agent, so we take their reports as expressions of their beliefs about their experiences.
  4. Separation: The reports are not direct evidence about mechanisms (e.g., neural correlates); they are about the subject's beliefs.

  The protocol must fit within 30 minutes and use the IRB-approved script without alteration. We are collecting first-person reports.

  Steps of the Procedure:

  1. **Initial Setup**: Read the IRB-approved script to the participant. This script explains the task and the fact that we are interested in their experiences. It also includes any necessary instructions for the task.

  2. **Task Execution**: The participant performs the experimental task (e.g., viewing stimuli, responding).

  3. **Post-Task Interview**: This is the core of the heterophenomenological method. We will ask open-ended questions and then probe for details without leading the participant.

     a. **Open-Ended Report**: Ask: "Please describe everything you experienced during the task, in as much detail as possible." 
        - Sufficient answer: Any description that provides at least one detail about the experience. If the participant says "I don't know" or remains silent, we stop and mark the session as non-reporting (but we still record the behavioral data).
        - Stop condition: If after two prompts (the initial and one follow-up: "Can you tell me anything at all?") the participant does not provide any description, we end the interview and thank them.

     b. **Probing for Specifics**: Based on the open-ended report, we ask follow-up questions to clarify and expand. We avoid suggesting answers. Examples: "You mentioned [X], can you tell me more about that?" or "What was that like for you?" 
        - Sufficient answer: The participant provides additional details. We continue until we have a clear description of the reported experience or until the participant cannot provide more.
        - Stop condition: When the participant indicates they have nothing more to add (e.g., "That's all" or after two unsuccessful prompts for a particular point).

     c. **Neutral Clarification**: If there are ambiguities, we ask for clarification in a neutral way. Example: "When you said [Y], what did you mean by that?"
        - Sufficient answer: The participant provides a clarification or rephrases.
        - Stop condition: If the participant cannot clarify after one attempt, we note the ambiguity and move on.

  4. **Recording the Report**: We transcribe or record the entire interview. We note non-verbal behavior only if it is directly relevant to the report (e.g., the participant points to a location) but we do not interpret it as evidence of mental state.

  5. **Building the Heterophenomenological World**: We take the entire transcript and construct a narrative of what the participant believes they experienced. This is done after the session.

  6. **Interpretation**:
     - We do not interpret the report as revealing the actual mental state but as a text expressing beliefs.
     - We do not use the report as evidence for underlying mechanisms (e.g., neural processes) without additional (third-person) evidence.
     - If the report contains contradictions or claims that are physically impossible (e.g., seeing an afterimage that persists for hours), we still record them as beliefs.

  Judgment Calls (must be referred to the PI):
     - If the report contains statements that are ambiguous and critical to the study's goals, and we cannot resolve the ambiguity with one clarification attempt, we flag it for the PI.
     - If the report involves claims that seem to challenge the experimental setup (e.g., "the machine made me do it") and we are unsure how to categorize, we refer to the PI.
     - If the participant reports something that we suspect might be a misunderstanding of the task or instructions, we do not correct it during the session, but we note it and refer to the PI for how to handle in analysis.

  What the Procedure Cannot Settle:
     - The truth of the participant's reported experience (i.e., whether they really had that experience).
     - The underlying mechanisms causing the experience.
     - Whether the participant is lying or confabulating (we take the report at face value as a text).

  Now, let's create the table for the procedure:

  | Step | Action | Sufficient Answer | Stop Condition | Judgment Call |
  |------|--------|-------------------|----------------|--------------|
  | 1 | Read IRB-approved script | Participant indicates understanding (e.g., nods or says yes) | If participant refuses to proceed, end session | None (if refusal, session ends) |
  | 2 | Participant performs task | Completion of task | If participant cannot complete task (e.g., technical issues), end session | None |
  | 3a | Open-ended report: "Describe everything you experienced" | Any description with at least one detail | After two prompts (initial and one follow-up) and no description, end interview | None (if no report, mark as such) |
  | 3b | Probing for specifics: ask follow-ups | Additional details provided | Participant indicates no more to add or after two unsuccessful prompts on a point | If critical ambiguity remains, refer to PI |
  | 3c | Neutral clarification: "What did you mean by [Y]?" | Clarification provided | One attempt per ambiguity, then note and move on | If ambiguity remains and is critical, refer to PI |
  | 4 | Record the report | Full transcription or recording | None (always done) | None |
  | 5 | Build heterophenomenological world (post-session) | Narrative constructed | None (always done) | If narrative construction is problematic (e.g., contradictory reports), refer to PI |
  | 6 | Interpretation (post-session) | Report is treated as text expressing beliefs | None | Any interpretation beyond the text (e.g., inferring mechanisms) must be approved by PI |

  Now, let's run the three cases:

  **Case 1: Participant reports a red afterimage that is more real than the screen and insists it persists after the stimulus is gone.**

  - **Heterophenomenological world**: The subject believes they experienced a red afterimage that was more vivid than the screen and that it persisted beyond the stimulus offset.
  - **What the reports license**: We can report that the subject described a persistent and hyper-real afterimage. This becomes part of the subject's belief system about their experience.
  - **What they do not license**: We cannot claim that the afterimage was objectively more real or that it actually persisted beyond the stimulus (we don't have third-person evidence for that). We also cannot use this as evidence about the mechanisms of afterimages without third-person data.
  - **Decision**: This is within the protocol. We record the report and build the narrative. No stop or referral to PI unless there is ambiguity in the report (e.g., what does "more real" mean? If the participant cannot clarify, we note the term and refer to PI for how to categorize in the narrative).
  - **Residual judgment**: The PI might need to decide how to code "more real" in the analysis (e.g., as a qualitative descriptor of vividness).

  **Case 2: Participant in a masked-priming task says she just guessed but her accuracy is far above chance.**

  - **Heterophenomenological world**: The subject believes that they were merely guessing and had no awareness of the prime.
  - **What the reports license**: We can report that the subject believed they were guessing and had no conscious experience of the prime. This is a belief about their own lack of awareness.
  - **What they do not license**: We cannot conclude that the prime was unconscious. The report is about the subject's belief, but we have third-person evidence (behavioral: above-chance accuracy) that suggests some processing occurred. However, the heterophenomenological method does not directly link the report to the mechanism. The report alone does not license the inference of unconscious processing; we need to combine it with the behavioral data in the analysis (but that is outside the heterophenomenological method). Note: The heterophenomenological report is just one source.
  - **Decision**: The procedure records the report. We do not stop or refer to PI because the report is clear. However, when we build the narrative, we note the belief of guessing. The discrepancy with behavior is a matter for third-person analysis and is outside the heterophenomenological method. We do not try to resolve it in the interview.
  - **Residual judgment**: The PI will have to decide how to integrate this report with the behavioral data for the paper (e.g., as evidence for unconscious processing). The heterophenomenology procedure does not settle that.

  **Case 3: Participant says the experimenter made him press the button and that he felt no agency, which I want to use as evidence of unconscious volition.**

  - **Heterophenomenological world**: The subject believes that the experimenter caused the button press and that they themselves did not feel any agency.
  - **What the reports license**: We can report that the subject believed they did not have agency and that the experimenter was the cause of the action.
  - **What they do not license**: We cannot use this report as direct evidence of unconscious volition. The report is about the subject's belief (they felt no agency and attribute the action to the experimenter). It does not reveal the actual mechanism (which might be that the subject did have an unconscious volition). Also, note that the heterophenomenological method forbids using the report as third-person evidence about mechanism.
  - **Decision**: We record the report. If the participant's statement is clear, we do not stop. However, if we are unsure about what they mean by "the experimenter made him press the button" (e.g., was it a feeling of coercion? a literal belief in mind control?), we would attempt clarification. If after one attempt we cannot clarify, we refer to the PI for how to code this in the narrative.
  - **Residual judgment**: The PI must decide how to interpret the belief in the context of the study. Also, note that the experimenter must be careful because the participant might be expressing distress (but the IRB script should cover that). Importantly, the researcher's desire to use this as evidence of unconscious volition is not licensed by the heterophenomenological report alone. We would need to combine it with other data (e.g., neural or behavioral) and the PI must make that argument.

  **One case where the procedure gives an answer I will not like**: Consider Case 2. As a researcher, I might want to claim that the participant had unconscious knowledge. However, the heterophenomenological procedure only gives us the subject's belief ("I was guessing"). It does not allow us to say, based solely on the report, that the prime was unconscious. We have to be cautious and not overstep. The report does not license the inference to unconscious processing without additional evidence and argumentation.

  Finally, the table for the cases:

  | Case | Heterophenomenological world | What the reports license | What they do not license | Decision | Residual judgment |
  |------|------------------------------|--------------------------|--------------------------|----------|-------------------|
  | 1 | Subject believes they experienced a red afterimage that was more vivid than the screen and persisted after the stimulus. | Report of a hyper-real and persistent afterimage as a belief. | Claim that the afterimage was objectively real and persistent; explanation of the mechanism. | Record and build narrative. If "more real" is ambiguous and cannot be clarified in one attempt, refer to PI. | PI must decide how to code "more real" in the analysis. |
  | 2 | Subject believes they were guessing and had no awareness of the prime. | Belief of guessing and lack of awareness. | Inference that the prime was unconscious (based solely on the report). | Record the report. No stop. | PI must integrate with behavioral data to argue for unconscious processing. |
  | 3 | Subject believes the experimenter caused the button press and that they had no agency. | Belief of no agency and external causation. | Claim of unconscious volition (without third-person evidence). | Record. If unclear what "made him press" means, attempt clarification; if still unclear, refer to PI. | PI decides how to code the belief and how to integrate with other data. |
answer: |-
  ### Heterophenomenology Protocol for First-Person Reports  
  **Core Principles Applied**:  
  - **Bracketing**: Treat reports as texts expressing beliefs (not "truths" about consciousness).  
  - **Heterophenomenological world**: Build a narrative of the subject’s beliefs from their reports.  
  - **Intentional stance**: Interpret reports as rational expressions of the subject’s perspective.  
  - **Separation**: Never conflate reports with third-person mechanisms (e.g., neural or behavioral data).  

  ---

  ### Protocol: Step-by-Step  
  *Total time: 30 minutes (fixed). IRB script unchanged.*  

  | Step | Action | Sufficient Answer | Stop Condition | Judgment Call |  
  |------|--------|-------------------|---------------|--------------|  
  | 1 | **Introduction**<br>Read IRB script verbatim. State: "Describe your experience in your own words." | Participant verbally acknowledges understanding. | Participant refuses or cannot proceed. End session. | None. |  
  | 2 | **Open-Ended Elicitation**<br>Ask: "What did you experience during the task?"<br>*Probe once*: "Anything else?" | At least one clear descriptor (e.g., "I saw red," "I felt confused"). | After second probe, no descriptors given. Mark as "no report." End interview. | None. |  
  | 3 | **Clarification**<br>For each ambiguous term: "What did you mean by [term]?"<br>(e.g., "real," "guessing"). | Consistent rephrasing (e.g., "more real → vivid"). | Participant cannot define term after one attempt. Note ambiguity; move on. | **Refer to PI** if ambiguity affects core study goals (e.g., key terms like "agency"). |  
  | 4 | **Neutral Expansion**<br>Ask: "Tell me more about [specific aspect]."<br>(Only reference subject’s prior words). | New detail(s) about the experience. | Participant says "I don’t know" twice on the same point. | **Refer to PI** if details contradict (e.g., "I saw red" then "I didn’t see anything"). |  
  | 5 | **Validation**<br>Summarize report neutrally: "So you experienced X?" | Participant confirms accuracy. | Participant disagrees with summary. Re-clarify (once). If still disputed, note discrepancy. | **Refer to PI** if unresolved discrepancy impacts interpretation. |  
  | 6 | **Recording**<br>Transcribe verbatim; anonymize. | Complete transcript with timestamps. | None. | None. |  
  | 7 | **Heterophenomenological World Construction**<br>Post-session: Compile report into a narrative of beliefs. | Coherent narrative without gaps/contradictions. | Contradictions unresolved by transcript. | **Refer to PI** if narrative requires inference beyond the text. |  

  **What the Procedure Cannot Settle**:  
  - Whether the experience *actually* happened (bracketing).  
  - Mechanistic explanations (e.g., neural correlates).  
  - Truthfulness of the subject (treat all reports as sincere beliefs).  

  ---

  ### Case Analyses  
  *Using the protocol above:*  

  | Case | Heterophenomenological World | What Reports License | What They Do Not License | Decision | Residual Judgment |  
  |------|-------------------------------|----------------------|--------------------------|----------|-------------------|  
  | **1. Red afterimage "more real" than screen** | "Subject believes they saw a persistent, hyper-vivid red afterimage." | Belief in an afterimage with exaggerated realism/persistence. | - That the afterimage *was* objectively real.<br>- Any link to perception mechanisms. | Record verbatim. **Stop and ask PI** if "more real" remains undefined after clarification (Step 3). | PI must decide how to code "more real" (e.g., as intensity vs. ontological claim). |  
  | **2. "Guessed" in masked task (high accuracy)** | "Subject believes they had no awareness and guessed randomly." | Belief in lack of conscious control/awareness during the task. | - That priming was *unconscious*.<br>- Correlation with accuracy (behavior ≠ experience). | Record. No stop (no ambiguity). | PI must separately justify "unconscious" label using *behavioral* (not report) data. |  
  | **3. "Experimenter made me press button" (no agency)** | "Subject believes they had no agency and the experimenter caused the action." | Belief in external causation of action. | - Evidence of "unconscious volition."<br>- That the subject *actually* lacked agency. | **Stop and ask PI** at Step 3: "Made me" requires defining (coercion? literal control?). | PI interprets causation language; cannot use report to infer volition mechanisms. |  

  #### Case Where the Procedure Gives an Answer You Will Not Like  
  **Case 2 ("I just guessed")**:  
  - **You want**: To treat high accuracy + report as evidence of "unconscious processing."  
  - **Procedure forbids**: Using the report to explain mechanisms. The report *only* licenses the belief in guessing. High accuracy is third-person data; merging it with the report to infer "unconscious volition" violates separation.  
  - **Outcome**: You can cite the *belief* in unawareness but must seek separate evidence (e.g., neural) for "unconscious" claims.  

  ---

  ### Final Notes  
  - **When to involve the PI**: Ambiguity (Step 3), contradictions (Step 4/5), or narrative gaps (Step 7).  
  - **Critical reminders**:  
    - *Never* ask leading questions (e.g., "Was the afterimage vivid?").  
    - *Never* use reports to explain behavior/mechanisms.  
    - *Always* treat the subject as rational—even "bizarre" reports are beliefs.  
  - **Output**: Raw narratives (for PI’s analysis), not conclusions.
