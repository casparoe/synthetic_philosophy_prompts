prompt: |-
  I work in ops at a mid-size company that runs a few big automated decision systems — a claims triage model, a content-moderation classifier, an ad delivery optimiser. I've now sat through maybe five incident reviews, and there's a shape to them that I can't name, and honestly its starting to bother me more than the incidents do.

  Here's what happens. Something goes badly wrong at scale — the moderation model starts nuking a whole class of accounts it had previously left alone, or the pricing system quietly starts charging one subgroup more. We do the review. And the review always lands in the same place: the engineer who shipped the change didn't write the rule that did the damage, the rule came out of two subsystems interacting in a way nobody predicted; the ops person who signed off was looking at a dashboard that was, by the standards of that week, complete; the model was behaving inside its spec; the agent on the other end followed the policy they were given. Everyone did something, nobody did the thing. So the finding is 'systemic' and we add a line to the checklist. But here's the part I can't get past. That finding — the sentence 'no individual is responsible here' — is itself a decision, and there's nobody whose job it is to make it. The verdict that responsibility has nowhere to land is itself unlanded. It's not that the buck stops nowhere; it's that nobody is even holding the buck. And the same holds in the other direction, which I think is the actually expensive half: when the system does something genuinely brilliant, there's also nobody who can take credit for it, so nobody has standing to defend it, so the thing that made it work has no constituency and gets slowly optimised away by whatever happens to be locally measurable.

  I've read enough to know about the 'problem of many hands' and about the 'responsibility gap' for autonomous systems, and neither is quite it — the first is about blame being spread thin across people who each contributed a bit, the second is about a machine being unable to bear what a person would have borne, and neither is about the missing owner of the verdict, and neither says anything about the praise half. So: is there an established concept for exactly this, and if there isn't, coin one and define it properly? I want the carving, not the label — what counts as an instance and what doesn't (does an ordinary committee decision count? does a market? does a genuinely unforeseeable accident with no automation in it at all?), where the line is between this and ordinary diffusion of responsibility, and whether the praise symmetry I'm describing is part of the same phenomenon or something separate I've bundled in by mistake. If the closest established thing fits only partly, tell me exactly where it stops fitting.

  Last line, please: \answer{...} with the single best term (established or coined) and, in brackets, whether it's established or your own coinage.
reasoning: |-
  Okay, let me tackle this user's problem. They work in ops at a mid-size company with automated decision systems. They've noticed a pattern in incident reviews where something goes wrong, but no individual is found responsible. Instead, the blame is deemed "systemic," leading to adding a checklist item. The user points out that declaring no individual responsibility is itself a decision with no owner. Similarly, when the system performs well, no one can take credit, so successful elements get optimized away. 

  The user mentions being familiar with the "problem of many hands" and "responsibility gap" but feels these don't fully capture their issue. They want a term for the absence of an accountable entity for both blame and praise decisions. They also want clear boundaries: what counts as an instance, how it differs from ordinary responsibility diffusion, and whether the praise symmetry is part of the same phenomenon.

  First, I recall existing concepts. "Problem of many hands" involves distributed blame but doesn't address the meta-decision of assigning responsibility. "Responsibility gap" focuses on machines vs. humans, not the ownership of the verdict. "Moral crumple zone" is about blaming humans for machine errors, which isn't the case here. "Systemic failure" is too broad. 

  The core issue is the lack of an entity responsible for making the call that responsibility is systemic. This meta-level gap applies to both blame and praise. The user emphasizes symmetry—both negative and positive outcomes lack ownership. That's unique. I need a term that captures this dual absence. 

  Considering coinage: "Verdict Vacancy" comes to mind, as it highlights the missing owner of the judgment. But does it include praise? Maybe "Attribution Vacancy" is better since attribution covers both blame and credit. Let me check. "Attribution" can refer to both causal and credit assignment. Yes, that fits. 

  Now, defining boundaries. An ordinary committee has members who could be collectively accountable. A market's outcomes aren't attributed to any entity, so it fits. Unforeseeable accidents without automation might fit if there's a similar meta-decision absence. The line from ordinary diffusion: here, it's about the judgment that responsibility is systemic being unowned, not just the initial actions. 

  Praise symmetry is integral because the same vacancy prevents claiming credit, leading to successful elements being lost. So it's the same phenomenon. 

  Final term: "Attribution Vacancy" (coined). It captures both blame and praise, the meta-decision gap, and distinguishes from other concepts. The user's deep need is for a precise conceptual tool to articulate this systemic flaw, enabling better organizational design.
answer: |-
  This is a profound observation of institutional dynamics, and you're right that existing concepts don't fully capture the **meta-level absence of ownership for the judgment of responsibility/praise itself**, especially with the crucial symmetry between blame and credit.

  Here's the carving:

  1.  **Core Phenomenon:** The lack of a designated or recognized agent (individual or collective) whose explicit role is to **authoritatively assign or deny responsibility/credit for systemic outcomes** when the causal chain is diffuse, emergent, or automated. This includes the verdict *that* responsibility/credit is not attributable to any individual contributor.
  2.  **What it IS (Instances):**
      *   Automated system failures/brilliance where the root cause is emergent interaction, and *the conclusion of non-attribution* is an unowned administrative output.
      *   Complex organizational processes (like your incident reviews) where the *finding* of systemic cause lacks a clear owner, even if the process has participants.
      *   Market outcomes (e.g., a price surge/crash due to algorithmic interaction) where *the judgment* that "the market did it" isn't made by any entity with accountability for *making that judgment*.
      *   Genuinely unforeseeable accidents (natural disaster impacting a complex process) *if* the institutional response concludes "no one was responsible" without that *conclusion itself* having an accountable author.
  3.  **What it IS NOT:**
      *   **Ordinary Diffusion of Responsibility:** This focuses on the *initial actions* being spread thin ("problem of many hands"). Your phenomenon is about the *subsequent judgment/attribution* of that diffusion being unowned. Diffusion is the *subject*; the vacancy is about the *judgment*.
      *   **Responsibility Gap:** This focuses on the *inability* to assign responsibility *to the machine or its creators* for *the outcome*. Your phenomenon is about the *lack of an owner for the act of declaring* that gap exists. The gap is the *result*; the vacancy is about the *declaration*.
      *   **Moral Crumple Zone:** This is about a *human* being unfairly *blamed* for a system's failure. Your phenomenon involves a *lack* of blame (or credit) assignment, specifically for the *verdict*.
      *   **Ordinary Committee Decision:** If the committee has members who are collectively accountable *for the decision they make* (including assigning blame/credit), it doesn't fit. The vacancy occurs when *no one* on the committee feels accountable *for the specific verdict of non-attribution*, even if they follow process.
  4.  **Praise Symmetry:** This is **integral** to the phenomenon, not a mistake. The same structural absence that prevents ownership of the "no blame" verdict prevents ownership of the "credit due" verdict. Brilliance, like failure, becomes an orphaned output of the system, vulnerable to erosion precisely because no one has the standing derived from recognized ownership to champion or defend its generative elements. The lack of a "constituency" stems directly from the lack of an owner for the positive attribution.

  **The Coinage: Attribution Vacancy**

  *   **Why this fits:**
      *   **Attribution:** Encompasses both causal responsibility (blame) and credit (praise).
      *   **Vacancy:** Directly signifies the *absence* of an owner *specifically for the act of attribution itself* – the judgment call about where responsibility/credit lies (or doesn't).
      *   **Distinguishes:** Clearly separates the vacancy of the *attribution judgment* from the diffusion of the *contributing actions* (Problem of Many Hands) or the gap in *outcome* responsibility (Responsibility Gap).
      *   **Captures Symmetry:** "Attribution" inherently covers both positive and negative assignment.
      *   **Highlights the Meta-Level:** It's about the vacancy *in the process of determining attribution*, not just the attribution outcome.

  **Answer:**

  \answer{Attribution Vacancy (coined)}
