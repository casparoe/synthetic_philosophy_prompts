  ### Address: "The Life That Lives On"

  Good evening. It’s an honor to stand before you at the annual dinner of the Dr. James Allen Foundation—among family, friends, colleagues, and supporters who keep his legacy alive. I’ve spent four years living alongside a man most of you know as a symbol: the physician who never turned anyone away in a mining valley clinic. But tonight, I want to talk about the man behind that symbol—not to diminish him, but to deepen why he matters.  

  I’ve held his clinic ledger in my hands. Page after page of cramped handwriting: names, dates, treatments scrawled in ink that faded as the years wore on. Thirty years in two rooms, with a coal-dusted window looking out on a valley that depended on him. He was a man of routine—morning rounds, evening emergencies, the weight of a community’s pain carried in a ledger that recorded everything but himself.  

  We all know the stories. How he’d treat miners after collapses, or sit with children through fevers long past midnight. But lives aren’t lived in highlights. They’re lived in the grit between the pages. I’ve read the accounts of those who worked beside him—how he could be stubborn as winter ice, how he’d sometimes snap under the strain, how he wasn’t always gentle with those who loved him most. He had flaws. He made mistakes. There were years when the darkness crept in, and he should have stepped away but didn’t. Yet here’s what I’ve learned: those flaws aren’t cracks in his legacy. They’re proof of its humanity.  

  Because a life doesn’t end when a person is gone. It splits in two. There’s the first life—the one we stumble through, full of missteps and regrets. And then there’s the second life—the one that begins in the hearts of others after we’re gone. That second life isn’t a fairy tale. It’s a choice. It asks: What do we hold onto? What do we forgive? What do we let teach us?  

  For thirty years, Dr. Allen showed up. Not as a saint, but as a man. He faced addiction, exhaustion, his own limits—and still, he showed up. When he forgot a name, he checked the ledger. When he faltered, he leaned on the nurse who chronicled it all with unflinching honesty. She’s here tonight. She knew his rough edges better than anyone, and she stayed. Why? Because she saw what we see now: that a life’s worth isn’t measured in its perfect moments, but in the sum of its choices.  

  That’s the second life calling to us now. It’s not a polished statue. It’s a compass. It points to what he stood for: care without conditions, dignity for the forgotten, the courage to keep going when every instinct says quit. The James Allen Foundation isn’t preserving a myth. It’s extending a hand—just as he did. To families who can’t afford medicine. To communities overlooked. To the next generation of healers.  

  So tonight, I ask you: Carry forward that second life. Not because he was perfect, but because he was human. Because his first life—messy, relentless, real—demands that we answer with our own. Give generously. Not for his sake, but for ours. For every person still waiting in a two-room clinic, hoping someone won’t turn them away.  

  Thank you.  

