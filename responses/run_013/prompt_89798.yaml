prompt: |-
  I sit on the governance committee of a mid-sized mutual — a member-owned savings and lending institution — and I have no academic training in philosophy or political theory. Over the past year, though, I have been reading on my own about the idea that votes ought to carry different weights depending on the voter's competence, which I gather is sometimes called epistocracy, and I have reached the point where I have to take a position in writing.

  Our committee must decide whether to recommend a change to our rules of governance, and I have to circulate a written opinion before the meeting. Please act as an expert in democratic theory and institutional design, and think carefully before you write anything. Begin by working out for yourself, in your own words, the strongest version of the proposal and the strongest version of the case against it; then produce the memo itself. I would rather have a well-reasoned recommendation I can defend in the room than a survey of the literature, and I do not need a reading list or citations — a model without access to a library should be able to answer this from reasoning alone.

  The proposal before us, in brief. Every member would keep one vote. Any member who passes a short written examination on the institution's finances would receive two additional votes, but only on resolutions that our rules designate as 'actuarial' — questions of reserve ratios, capital adequacy, lending limits and the like — and not on resolutions the rules call 'constitutive', such as changing the membership rules or electing the board. The total weight created by these additional votes is capped, so that the examined bloc can never outvote the unexamined membership on any resolution. The examination would be written and marked by the board itself, which also sets the reserve policy the examination is about; it can be retaken without limit, and a short study guide would be published. There is also a sunset clause: the scheme lapses after six years unless the membership votes to renew it.

  The immediate case that has forced the issue is a resolution to merge with a much larger bank. The board has classified the merger as actuarial, on the grounds that the decisive question is whether our capital position can survive alone. Several members who intend to vote against the merger argue that it is really constitutive, because a merger would change what kind of institution we are and would dissolve the membership as we know it, and that the classification has been arranged so that the examined bloc decides it. I am genuinely unsure whether they are right, and I do not want the memo to assume an answer.

  Your memo should: recommend a concrete course of action for the committee — adopt the scheme, reject it, or adopt it with specific amendments — and say what we should do at this meeting and by when; explain the reasoning in a way that a member with no background in this area could follow; give an honest and serious treatment of the strongest consideration on the side you come out against, not a straw man; and say explicitly what the proposal gets right about the worry that motivates it. Address directly the two features I find most troubling — that the examiners set the exam on the policy they also decide, and that competence at questions about our own accounts may be little more than familiarity with the institution, which selects for long-standing and better-off members — and say whether either is fatal, and why.

  Format it as a formal committee memo, roughly 1,000 to 1,500 words, with a clear recommendation stated at the top as well as in the body. Write in British English throughout, in spelling and idiom. At the end, state how confident you are in the recommendation and what new information would change it.
reasoning: |-
  Okay, the user is on the governance committee of a mutual institution and needs to write a memo recommending whether to adopt an epistocracy-inspired voting scheme. They've described a specific proposal where members can earn extra votes on "actuarial" resolutions by passing an exam, with safeguards like vote weighting caps and sunset clauses. 

  First, let's unpack what's really at stake here. The immediate trigger is a contentious merger vote where the classification of the issue (actuarial vs constitutive) is disputed. But deeper down, this seems like a crisis of institutional identity - a member-owned mutual trying to balance technical competence with democratic legitimacy. The user is clearly troubled by potential circularity (the board setting exams for policies they control) and bias toward entrenched members.

  Hmm... the strongest case FOR the proposal would be: In complex financial decisions like capital adequacy, uninformed votes could literally sink the institution. Giving weight to those who understand the mechanics protects all members' savings. The exam retakes and study guide mitigate elitism concerns. The sunset clause allows experimentation.

  The strongest case AGAINST is more philosophical: Voting isn't just about correct outcomes but shared ownership. Letting a board-defined "expert" class override others on what counts as "technical" (especially when classifications are disputed) risks tyranny of the competent. And yes - the circularity issue smells bad.

  *scribbles mentally* The memo must:
  - Recommend concrete action (I'm leaning toward rejection with an alternative)
  - Explain accessibly without academic jargon
  - Steelman the opposition
  - Address the two big worries head-on
  - Follow formal British English memo format

  Right, rejection feels right but needs nuance. The current proposal's fatal flaw is letting the board control both exam content AND policy classification - that's like letting players referee their own game. Even with caps, it creates perverse incentives. And while financial literacy matters, testing "our specific accounts" favors insiders over actual competence.

  Better path: Keep one-member-one-vote but invest in REAL financial education - mandatory briefings before complex votes, independent experts drafting plain-English guides. Maybe even non-binding expert polls displayed alongside ballots. That addresses the knowledge gap without fracturing equality.

  *checks word count* Keep it tight. State recommendation upfront, then unpack. Save the merger issue for last as illustration - don't pre-judge it. Confidence level? Medium-high - new info about member sentiment or alternative proposals could sway me.

  Final touch: British spelling throughout. "Favours" not "favors", "centre" not "center". Done.
answer: |-
  **MEMORANDUM**  
  **To:** Governance Committee Members  
  **From:** [Your Name], Committee Member  
  **Date:** 15 October 2023  
  **Subject:** Recommendation on Proposed Weighted Voting Scheme  

  **Recommendation:** Reject the proposed weighted voting scheme in its current form. Instead, establish a working group (including critics of the proposal) to develop enhanced financial literacy initiatives and non-binding expert advisory mechanisms, reporting back within six months. At this meeting, vote against adoption and mandate the formation of this working group by year-end.  

  ---

  ### I. Introduction  
  This memo addresses the proposal to grant two additional votes to members passing an examination on the institution’s finances for "actuarial" resolutions (e.g., capital adequacy, lending limits), while retaining one vote for all members on "constitutive" matters (e.g., governance changes). Key safeguards include: a cap preventing examined members from outvoting others; board control of exam design and marking; unlimited retakes; and a six-year sunset clause.  

  I have evaluated this through two lenses:  
  1. **The Strongest Case For:** Protects members from uninformed decisions on complex financial issues that could threaten the mutual’s solvency.  
  2. **The Strongest Case Against:** Undermines the mutual’s foundational principle of equal ownership, risking division and elite capture.  

  My analysis concludes that while the *motivation* is sound, the proposal’s design flaws are irreparable.  

  ---

  ### II. What the Proposal Gets Right  
  The core concern driving this scheme is valid: **Technical financial decisions require specialised knowledge to avoid catastrophic errors.** Reserves, liquidity, and capital adequacy are not matters of opinion but arithmetic realities. An uninformed membership could inadvertently vote the mutual into insolvency (e.g., by demanding unsustainable dividend payouts or under-priced loans). The proposal rightly:  
  - Targets extra influence only to technical areas where expertise matters most.  
  - Avoids disenfranchisement (all retain one vote).  
  - Builds in safeguards (vote caps, sunset clause).  
  - Encourages engagement through study materials and retakes.  

  This acknowledges a real tension in member-owned institutions: *ownership rights* versus *stewardship responsibilities*.  

  ---

  ### III. The Strongest Case Against the Proposal  
  **Equal voting rights are not merely practical tools but the bedrock of mutual ownership.** They symbolise that each member’s stake—whether £10 or £10,000—carries equal weight in shaping the institution. Introducing tiers fractures this solidarity. Crucially:  
  - **Competence is not neutral:** The board (which sets policy) also designs the exam on that policy. This creates self-referential expertise: success means agreeing with the board’s approach.  
  - **Familiarity ≠ Expertise:** The exam tests knowledge of *this institution’s* accounts and policies. This favours long-standing, financially literate members (e.g., retirees, accountants, board allies) over newer or time-poor members—correlating with wealth/status and entrenching privilege.  
  - **The Classification Problem:** As the merger debate shows, "actuarial" vs. "constitutive" is often blurred. Is capital adequacy purely technical when it dictates mergers? Classifying resolutions concentrates power in the board, inviting distrust.  

  **In essence: The scheme risks replacing collective ownership with a self-appointed technocracy, undermining the mutual’s legitimacy without guaranteeing better outcomes.**  

  ---

  ### IV. Addressing the Core Flaws  
  #### A. *The Board as Examiner and Policy-Setter*  
  This circularity is **fatal**. The board cannot impartially test "competence" on policies it creates. Example: If the board favours high reserves, the exam could reward those who parrot that view, not those who grasp alternatives. Competence assessments must be independent to be credible. The proposal’s retakes and study guides do not fix this; they merely facilitate assimilation into the board’s viewpoint.  

  #### B. *Familiarity vs. Competence*  
  Testing institution-specific knowledge confuses **understanding our rules** with **financial acumen**. A new CFO member might outperform a decades-long member on financial principles yet fail an exam focused on local quirks. This selects for institutional insiders, not competence. While the scheme avoids formal disenfranchisement, it devalues the votes of those less embedded—often younger, working-class, or newer members. This corrodes the mutual’s inclusivity.  

  **Neither flaw is mitigated by the sunset clause or vote cap.** The cap prevents examined members from outright domination but still grants them pivotal influence (e.g., 49% voting weight). The sunset clause merely postpones democratic erosion.  

  ---

  ### V. A Better Path Forward  
  The goal—informed decisions on technical matters—is vital. But weighted voting is a corrosive solution. Instead:  
  1. **Mandatory Financial Briefings:** Require the board to provide plain-English, independent expert briefings before all votes on actuarial matters, clarifying risks, options, and industry context.  
  2. **Non-Binding Expert Advisory Votes:** Allow members to *voluntarily* take a simplified exam. Those who pass form an advisory panel publishing recommendations (e.g., "79% of panellists support Option A"). This educates voters without altering vote weights.  
  3. **Independent Exam Design:** If competence testing is pursued, outsource exam drafting to a consortium (e.g., credit unions, universities, regulators) to ensure neutrality and genuine expertise measurement.  

  **Immediate Steps:**  
  - **Reject the current scheme.**  
  - **Establish a working group** (3 proponents, 3 critics, 1 neutral chair) to develop the above alternatives, reporting in six months.  
  - **Clarify classification rules now:** Define "actuarial" vs. "constitutive" via member referendum to resolve the merger dispute fairly.  

  ---

  ### VI. Conclusion: Upholding the Mutual Ethos  
  Mutuals exist because equality of voice fosters trust and resilience. The weighted vote scheme, however well-intentioned, mistakes a symptom (knowledge gaps) for the disease (engagement deficits). By investing in *shared* enlightenment—not tiered influence—we honour our ethos while safeguarding solvency.  

  **Confidence in Recommendation:** High (8/10).  
  **What Could Change It:**  
  - Evidence that >70% of members support weighted voting in principle.  
  - A revised proposal with fully independent exam design and broader competence criteria (e.g., general financial literacy).  

  ---  
  **Submitted by:**  
  [Your Name]  
  Governance Committee Member
