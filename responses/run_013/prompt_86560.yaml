prompt: |-
  Hey, I'm not a philosopher, just someone whos been reading a lot of pop-philosophy and trying to figure out what Ayer actually thought about life after death. I've read a few summarys and one of them is nagging at me. Could you act like a philosopher who really knows Ayer's work — someone who's read Language, Truth and Logic closely and also the later stuff — and help me audit it? Please think carefully and maybe start by brainstorming, in your own words, what Ayer's actual position on survival and the afterlife was, before you judge the summary. Don't just give me the standard textbook line; I want the nuances.

  The summary is from a blog post I can't find again, so I'm paraphrasing from memory, but it went something like this:

  'Ayer was the arch logical positivist. His core idea was that a statement is only meaningful if it's either true by definition or empirically verifiable. He applied this to religion and concluded that talk of God is literally meaningless — not false, but not even the kind of thing that can be true or false. He took the same line on life after death: since we can't observe what happens after we die, the question of whether we survive is a pseudo-problem, and the only intellectually respectable attitude is to dismiss it. He did have one wobble late in life. In 1988 he had a near-death experience after his heart stopped, and he wrote about seeing a red light and some kind of beings. He admitted the experience had shaken his confidence that death is the end, and some people say this shows that even the hardest skeptic can't keep up their skepticism when they're confronted with the thing itself.'

  I suspect this is mostly right but too neat. I'm inclined to think the last bit is exaggerated, because I remember hearing that Ayer stayed an atheist and thought the experience could just be his brain doing weird things. But I don't know enough to say where the line is between the accurate parts and the distortions. Can you go through it sentence by sentence and tell me what a specialist would accept, what they'd wince at, and what's flat-out wrong? In particular: did Ayer really think survival claims were meaningless in the same way as talk of God, or is that a conflation? What was his actual considered view — did he think the question was meaningful but unsupported, or something else? And what did he actually say after the near-death experience — did it change his mind, or just nudge him slightly, and did he take it as evidence for survival? Finally, does the summary's moral — that skeptics cave when it happens to them — actually follow from what happened, or is that a separate claim? Please be specific and don't let me get away with a vague answer.
