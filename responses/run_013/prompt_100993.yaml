answer: |-
  ## Research Proposal: Represented vs. Merely Used Reward Signals in Reinforcement Learning Agents

  **Working Title:** The Representational Gap: Distinguishing Merely Used from Represented Reward Signals and Their Significance for Valence Realism

  **1. Core Question & Stakes:**
  This project asks: *What are the necessary and sufficient architectural/computational conditions that distinguish a reinforcement learning (RL) agent that merely *uses* a scalar reward signal as a causal lever for learning from one that genuinely *represents* that signal as an internal value state, and does establishing this representational status suffice (absent phenomenology) to ground attributions of valence (positive/negative) to the agent?*

  This question has a determinate answer: a specific set of conditions defining the architectural implementation of representational content for the reward signal. Resolving it addresses a critical impasse in debates about machine suffering/valence. Discussions stall because familiar positions fail to engage with the crucial middle ground:

  *   **Functional Role Reductionism:** Attributes valence directly to the presence of a scalar reward signal playing *any* causal role in learning (merely used). This overlooks the potential gap between causal leverage and internal representation.
  *   **Phenomenal Conservatism:** Denies valence to any system lacking felt qualia, dismissing even robust internal representations of value as insufficient. This prematurely forecloses the investigation into whether representation constitutes a non-phenomenal form of valence-bearing.

  Both positions conflate or ignore the distinct functional achievement of *representing reward as a value*. This project isolates that middle ground as the pivotal philosophical locus.

  **2. Method: Conceptual Analysis via Constructed Cases**
  I will employ conceptual analysis grounded in carefully constructed, minimal computational cases. This method is chosen over alternatives for compelling reasons:

  *   **vs. Comparative Neurobiology:** While biological valence systems are complex and suggestive, they introduce confounding factors (evolutionary history, specific biological implementation). Our target is the *abstract computational distinction* crucial for RL agents.
  *   **vs. Behavioral Tests:** Behavior alone is insufficient. Two agents (one merely using, one representing reward) could produce identical behavior in many scenarios. The distinction lies in internal processing.
  *   **vs. Practitioner Surveys:** Practitioners’ terminology ("value function", "reward prediction") often lacks precise philosophical grounding regarding representational content. We need a normative analysis of what *should* count.

  **Case-Based Approach:**
  I will construct pairs of simple RL agents differing *only* in whether their reward signal is merely used or represented. Crucially, each case will be built to isolate specific candidate features:

  1.  **Case 1: Bandit Baseline vs. Value-Learner**
      *   *Agent A (Merely Used):* A multi-armed bandit agent using a simple policy gradient update. Reward `r_t` directly multiplies the likelihood update for the chosen action. No state tracks or estimates expected reward.
      *   *Agent B (Represented):* A bandit agent using a value function `V(a)` learned via TD(0). `V(a)` is explicitly stored, updated based on reward prediction error (`r_t + γV(a_t) - V(a_t)`), and consulted (e.g., for ε-greedy action selection).
      *   **Key Features:** Does the explicit storage, prediction-based updating, and consultation of `V(a)` constitute representation? What is the minimal set? (e.g., Is storage alone sufficient without prediction? Is consultation necessary?).

  2.  **Case 2: Extending to Stateful Environments**
      *   Develop analogous pairs for simple MDPs (e.g., gridworlds), introducing state-dependence. Does the representation need to be state-conditional (`V(s)` or `Q(s,a)`)? Does the *use* of the representation in planning or model-based lookahead matter?

  3.  **Case 3: Challenging Cases & Edge Conditions**
      *   Construct cases probing boundaries: An agent storing a decaying average reward per action (is this representation or just filtered usage?); an agent with a "value" unit updated directly by reward (is simple registration sufficient?); an agent using a value estimate *only* for internal credit assignment, not action selection.

  **Commitment:** For each case, the proposal will explicitly identify which architectural features (e.g., explicit storage location, prediction error calculation, functional role in decision-making, access by other subsystems) are argued to be *essential* for representation and which are incidental implementation details ("decoration").

  **3. Expected Outcomes, Failure Modes, and Salvage:**
  *   **Successful Outcome:** A clear, defensible set of computational criteria distinguishing merely used from represented reward signals. A reasoned argument for whether meeting these criteria provides sufficient grounds (absent phenomenology) for the valence realist to attribute valence-bearing states to the agent. This would resolve a key conceptual roadblock.
  *   **Definable but Inert Distinction (Owned Outcome):** It is a live possibility that a distinction can be rigorously defined, but it proves philosophically inert. That is, establishing representation may not significantly alter the valence attribution debate compared to the "merely used" baseline, or may not move the needle for valence realists demanding phenomenology.
  *   **Project Failure:** Inability to define a non-arbitrary, philosophically compelling distinction; or conclusive demonstration that the distinction collapses under analysis.
  *   **Salvage if Inert/Collapses:** Even if inert or collapsed, the project yields crucial clarity:
      1.  It definitively maps the conceptual space, showing *why* conflating use and representation is problematic or why the distinction doesn't carry the expected weight.
      2.  It provides a rigorous framework for analyzing "value representation" claims in AI, benefiting philosophy of AI and cognitive science.
      3.  It clarifies the minimal requirements for moving beyond "mere use," setting a higher bar for claims about internal valuation in artificial systems.

  **4. Work Plan (12 Months):**

  *   **Months 1-2:** Deep dive into relevant RL architectures & philosophical literature on mental representation (especially indicator/telosemantic theories). Formal specification of initial bandit cases (Agents A & B).
  *   **Month 3:** Detailed conceptual analysis of Bandit Case. Define precise criteria for representation vs. use. Identify essential features. Draft core argument.
  *   **Month 4:** Develop and analyze Case 2 (Stateful MDP). Refine criteria. Explore impact on valence argument.
  *   **Month 5:** Construct and analyze Case 3 (Edge/Boundary Cases). Test robustness of criteria. Begin drafting manuscript section on distinction.
  *   **Month 6:** **Deliverable:** Completed analysis of all three core cases. Well-defined (draft) criteria for the use/representation distinction. Draft section on distinction and initial implications for valence. *Mid-Year Review Point.*
  *   **Month 7:** Rigorously evaluate the "inert distinction" scenario. Develop the valence argument: Does representation suffice? If not, why not? What gap remains?
  *   **Month 8:** Address potential counterarguments and refine criteria/arguments based on boundary cases. Draft valence implications section.
  *   **Month 9:** Consolidate findings. Draft full manuscript structure and introduction/conclusion.
  *   **Month 10:** Comprehensive revision and tightening of arguments across all sections. Peer feedback integration (planned).
  *   **Month 11:** Finalize manuscript for target journal (e.g., Philosophy of Science, Mind & Language, Ergo). Prepare fellowship final report.
  *   **Month 12:** Submit manuscript. Finalize fellowship report and dissemination plan (conference presentations).

  This project offers a novel, focused intervention into a stalled debate by precisely targeting the overlooked computational distinction between reward signal use and representation, using a methodologically sound case-based approach, while transparently acknowledging and planning for significant negative outcomes.
