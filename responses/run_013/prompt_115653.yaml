     - "Outside" is relative: we moved to a richer system (math), but one where the invariant is checkable. Jootsing means shifting to a meta-level.  
  4. Contrast with staying "inside": e.g., exhaustive search fails because infinite strings.  

  Marking scheme (20 points):  
  - I-count explanation (4 pts): for baseline, but capped so it can't score high alone.  
  - Why "outside" (6 pts): must mention semantic vs syntactic, non-derivability of invariant.  
  - Circularity argument (5 pts): why adding axiom isn't enough.  
