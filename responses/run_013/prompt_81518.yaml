prompt: |-
  I have no training in philosophy, but for the better part of a year I have been keeping a notebook of moral disagreements between different cultures, and I have had to admit that the notebook is worthless as it stands. Every entry reads the same way — they think this is wrong, we think it is fine — and what set me off in the first place was reading that the moral intuitions psychologists actually study come mostly from a narrow, educated, Western slice of the world. What I really want to record is not the bare fact of a difference but the conceptual problem underneath it: a feature of a particular case that makes it unclear what, if anything, the two sides are even disagreeing about, or unclear whether the difference counts as evidence that morality is more like a local language than like arithmetic. For example, I noticed that in some places whether a person deserves blame for a bad outcome turns almost entirely on what they meant to do, while elsewhere it turns on what they actually brought about, so that someone who intended harm and failed is judged worse than someone who caused harm by accident; the conceptual problem there is that one community seems to be ranking agents while the other is ranking outcomes, and it is not obvious that they are answering the same question at all. That is the sort of entry I am after: not they differ about X, but here is why, in this case, the difference resists being classified either as agreement or as disagreement.

  Please give me five such entries. Each should be a short, self-contained case, invented or drawn from ordinary life, in which two communities answer a moral question differently, followed by a clause naming the specific conceptual issue the case raises; the five issues should be as unlike one another as you can make them, since I would rather have five genuinely distinct problems than five variations on the thought that one side is simply mistaken. I would also like each case stated in full, with whatever background a reader needs to follow it, and I would rather you not cite studies or authors at all, so that the cases stand on their own. Finally, please avoid the examples everyone has already heard; no trolleys and no arranged marriages, unless you can give one of them a genuinely unfamiliar angle.

  Give the answer as a numbered list of exactly five items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Okay, the user has spent a year compiling moral disagreements but finds their notebook repetitive and superficial—just "they think X is wrong, we think it's fine." They want deeper conceptual puzzles that challenge whether cultures are even answering the same moral question. No trolley problems or clichés; they crave originality and philosophical tension.  

  Hmm, their example about blame (intent vs. outcome) is key: it’s not disagreement but *incommensurability*. They want cases where differences resist categorization as mere "disagreement," revealing structural rifts in how morality is framed.  

  So, five distinct conceptual issues:  
  1. **Scale of moral concern**: A village prioritizes group survival over individual sacrifice. Is the unit of value the individual or the collective?  
  2. **Moral ontology**: An artifact’s sacredness hinges on its origin story versus material history. Is morality grounded in narrative or objective properties?  
  3. **Temporality**: Restoring past glory versus current utility pits moral weight on history versus present/future.  
  4. **Responsibility scope**: Aiding a stranger might create infinite obligation—does morality demand bounded or limitless care?  
  5. **Agency attribution**: Blaming a storm as "punishing" versus natural event questions whether morality applies only to human actors.  

  Each case avoids familiar debates (no cannibalism or foot-binding) and isolates a unique philosophical fissure. The goal isn’t resolution but exposing irreducible frameworks.
answer: |-
  1.  In one culture, a villager allows his critically ill child to die, believing a difficult journey for medicine would doom the entire village by depleting shared resources; another culture judges this as monstrous neglect, prioritizing the child’s immediate survival above long-term group risk — the conceptual problem is whether the fundamental unit of moral concern is the individual life or the survival of the group as a whole.
  2.  One community demands the destruction of a revered artifact upon discovering it was crafted long ago using materials obtained through violence, while another insists the artifact’s current meaning and beauty transcend its origins — the conceptual problem is whether moral properties like "sacredness" or "taint" are inherent in an object’s history or emergent from its present role and perception.
  3.  Residents of a flood-prone valley fiercely resist relocation to safer highlands offered by outsiders, valuing the ancestral connection to their land above physical safety, while the outsiders see this as irrational endangerment — the conceptual problem is whether the moral weight of preserving a historical continuity and identity can outweigh the imperative to prevent future harm.
  4.  A traveler from one culture gives all his food to a single starving stranger, leaving others unaided, believing he fulfilled his duty by helping one person completely; another culture condemns this as deeply unfair, insisting aid must be distributed thinly to cover more needs, even if partially — the conceptual problem is whether moral responsibility is discharged by maximizing benefit to one recipient or by attempting a wider, though diluted, distribution of care.
  5.  After a natural disaster, one group attributes moral blame to the community itself, believing the event was divine punishment for collective sin, while an external aid group sees only tragic misfortune requiring practical response — the conceptual problem is whether morality fundamentally concerns only the evaluation of *human* actions and character, or whether events themselves can possess inherent moral meaning requiring interpretive judgment.
