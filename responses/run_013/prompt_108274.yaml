prompt: |-
  I've been reading alot about the proposal where you train two models to argue opposite sides of a question and a weaker judge model decides who won, on the idea that it's easier to spot a bad argument than to produce a good one. I buy the basic setup. But I keep noticing a move in ordinary arguing that I don't have a name for, and I'd like to know if it's an established thing or just a hole in the vocabulary.

  Here's the move. You don't win by making your own claim more plausible; you win by making the other person's job more expensive. Suppose I'm defending something shaky. Instead of defending it, I state it in a form where checking it means walking a long chain of individually boring, individually correct steps -- a definition here, a caveat there, a footnote about how the numbers were collected. Each step is fine. The total is a wall. Anyone with a budget -- a judge with a token limit, a reviewer with twenty other PRs open, a reader on a train -- either gives up or skims. If they give up, I haven't lied, and nothing I said was false. The failure gets booked to their attention span, not to me. And the same trick works when my claim is true: I can state a true thing in the most expensive-to-verify form available and collect the same protection. Which means the careful version of me is now at a disadvantage against the careless one, who gets to shop around for the costliest valid way of putting things.

  Two other places I think I see the same shape. In code review, someone answers "why does this work?" with four paragraphs of true but tangential detail, and the reviewer approves it to get on with their day. And in online arguments, the move where the reply is that it's all covered in the primary literature and you'd have to go read three books -- where the cost of checking has been set above the cost of just conceding.

  I don't think it's the motte-and-bailey, because nobody retreats; the same claim stays up the whole time. I don't think it's the firehose style of arguing, the one where you throw forty claims at once, because that's about the count of claims and the audience's clock, and what I'm describing is usually one claim, where the enemy is the checking cost of that one claim. And it isn't just the old observation that nonsense is cheaper to produce than to refute, because in that version the producer is merely careless, whereas here the producer is optimizing -- and can be optimizing while saying only true things.

  So: is there a name for this, or a couple of names that split it up? In particular I want the line between the case where the murk is hiding a flaw and the case where there's no flaw at all and the murk is just the admission price. If there's no established term, coin one, define it, and tell me where its edges are -- specifically whether this is just the cheaper-to-produce-than-to-refute point wearing a bigger vocabulary, and what (if anything) stops the slide into: any true claim can be stated expensively, so a judge on a fixed budget is scoring rhetoric rather than truth. And if you think the real problem is the judge's budget and not the arguer's move, say that instead.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've described a specific argumentative tactic where the goal isn't to make your own position stronger but to make verifying the opponent's claim so costly that they give up. The user mentions examples in debates, code reviews, and online arguments. They want to know if there's a name for this tactic, or if it's a new concept they need to coin.

  First, I need to recall related concepts. The user already ruled out motte-and-bailey and Gish gallop. The key difference here is the focus on verification cost rather than quantity of arguments. The tactic involves presenting a claim with excessive, tedious detail that's technically correct but burdensome to check. 

  I remember "proof by verbosity" from logic, but that's more about overwhelming with volume. The user's case is about complexity and hidden steps. Then there's "ergodic argument" from LessWrong, which deals with high cognitive load. That might fit, but I'm not sure how well-known it is. 

  Also, "fogging" in persuasion techniques involves being vague, but the user's scenario uses precise yet tedious details. Maybe "cost-shifting" or "verification burden shifting" could work as new terms. The user wants to distinguish between using the tactic to hide flaws versus just being inefficiently truthful.

  The deeper issue here is epistemic exploitation. The arguer exploits the judge's limited resources, making truth secondary to rhetorical efficiency. The user is concerned that this forces judges to score based on rhetoric, not truth. I should address whether the problem lies with the arguer's tactic or the judge's constraints. 

  In the examples given—code reviews and online debates—the tactic forces concessions due to time constraints. The user needs clear terminology to discuss this strategy and its ethical implications. They might also be looking for ways to counter this tactic in systems like the debate models they mentioned. 

  I should synthesize existing concepts and propose new terms where necessary. Highlighting the difference between hiding flaws and mere inefficiency is crucial. Also, emphasizing that the judge's resource limits enable this exploitation. The user's unspoken need might be to find strategies to mitigate this in systems they're designing or participating in.
answer: |-
  This is a brilliantly observed phenomenon, and you're right that it occupies a specific niche in the taxonomy of argumentative tactics. While it overlaps with several existing concepts, it doesn't have a single, universally accepted name. Let's break it down:

  1.  **Overlapping Concepts & Why They Don't Quite Fit:**
      *   **Proof by Verbosity / Argumentum Verbosium:** This is the closest established term. It describes overwhelming an opponent with excessive detail, complexity, or sheer volume of arguments, making refutation impractical. However, it often *implies* verbosity is used to hide flaws or nonsense. Your observation crucially notes the tactic works *even when every step is correct*.
      *   **Ergodic Argument (LessWrong Community):** This term (derived from "ergodic" meaning requiring significant time/effort to traverse a state space) explicitly focuses on arguments designed to be *extremely costly to verify*, regardless of truth value. This fits well, though it's less widely known outside specific communities.
      *   **Fogging / Obfuscation:** These are broader terms for making things unclear, but they lack the specific emphasis on *imposing verification costs* as the winning condition. They often imply deliberate confusion or hiding flaws.
      *   **Burden Shifting (Subtle Form):** While traditionally about shifting the *logical* burden of proof, this tactic shifts the *practical* burden of *verification cost* onto the opponent/judge.
      *   **Exploiting Asymmetric Verification Costs:** This is a descriptive phrase capturing the core dynamic: the arguer invests little (in stating tedious truths), while forcing the verifier to invest a lot.

  2.  **Coining Terms & Defining the Tactic:**
      Given the nuances you highlight, coining a specific term is justified. Here are options, building on your insight:

      *   **Cost-Burdening Argumentation (CBA):**
          *   **Definition:** A rhetorical strategy where the proponent defends a claim (true or false) by formulating it in a manner that maximizes the practical cost (time, cognitive effort, computational resources) required for verification, rather than maximizing inherent plausibility or clarity. The goal is victory through *imposed verification exhaustion*, exploiting resource constraints on the verifier (judge, opponent, audience).
          *   **Key Mechanism:** Shifts the locus of defeat from the argument's *substance* to the verifier's *resource limitations*.
          *   **Edges:** Explicitly includes cases where the claim is true but stated inefficiently/obscurely *specifically to impose cost*. Distinguishes from simple verbosity by focusing on the *verification cost* as the weapon.

      *   **Verification Resource Sapping (VRS):**
          *   **Definition:** Deliberately structuring an argument or explanation so that confirming its validity requires disproportionate expenditure of finite verification resources (attention, time, tokens, mental energy), thereby inducing surrender or uncritical acceptance due to exhaustion or opportunity cost.
          *   **Emphasis:** On the active draining of the opponent's/judge's resources as the primary tactic.

      *   **Epistemic Cost-Shifting:**
          *   **Definition:** Strategically externalizing the epistemic costs (the effort required to establish knowledge/truth) of one's own claim onto the evaluator through complex, tedious, or unnecessarily laborious presentation of supporting information, even if accurate.
          *   **Emphasis:** On the transfer of the "work" of knowing from the speaker to the listener.

  3.  **Addressing Your Specific Queries:**
      *   **The Line Between Hiding Flaws vs. Just Admission Price:** This is crucial and highlights the tactic's insidiousness.
          *   **Strategic Obfuscation (Hiding a Flaw):** The murk is a smokescreen. The arguer *relies* on the cost barrier preventing discovery of the flaw buried within the tedious chain. They win *because* verification fails to reach the flaw.
          *   **Epistemic Rent-Seeking (Admission Price):** The claim is sound, but the arguer forces the verifier to pay an unnecessarily high "rent" in cognitive resources to access that truth. They win by charging an exorbitant toll for truth, knowing many won't pay. The victory comes from *imposing the toll*, not from hiding falsehood.
          *   **The Judge's Dilemma:** In practice, the judge often *cannot distinguish* between these two scenarios without paying the cost, which is exactly what the tactic exploits. This ambiguity *is* the weapon.
      *   **Is it just "cheaper to produce than refute"?** It's a sophisticated *application* of that asymmetry, but goes further:
          *   **Active Optimization:** The arguer isn't just *being* careless or verbose; they are *strategically selecting* the most expensive *valid* (or plausibly valid) path. It weaponizes the inherent asymmetry through deliberate construction.
          *   **Exploiting Resource Constraints:** It specifically targets the *finite, practical resources* (time, tokens, attention) of a *specific* judge/audience in a way that the general observation about asymmetry doesn't fully capture.
          *   **Truth-Neutral Weaponization:** It highlights that the asymmetry can be weaponized *even when speaking truth*, which is a more subtle and disturbing point than the classic "nonsense is cheap" observation.
      *   **Judge's Budget vs. Arguer's Move:** **This is core to the problem, but the move exploits it.** The judge's finite budget (time, tokens, attention) is the *necessary condition* that enables the tactic. Without it, the tedious-but-correct argument would eventually be verified. However, the *blame* lies with the arguer who is *knowingly and strategically exploiting* this limitation in bad faith (even when telling truth, it's bad faith discourse). A perfect judge with infinite resources defeats the tactic – but such judges don't exist. The move is only effective *because* of the budget constraint. So **both are integral: the move exploits the constraint, and the constraint enables the move.** Criticizing the judge's budget is like criticizing a castle gate for being breakable; the fault lies with the attacker exploiting the weakness.
      *   **Scoring Rhetoric vs. Truth:** **Yes, this is the inevitable consequence under fixed-budget judging.** When verification cost exceeds the budget:
          1.  **True + Cheaply Verifiable:** Wins.
          2.  **True + Expensively Verifiable:** Loses (or requires risky assumptions).
          3.  **False + Cheaply Verifiable:** Loses (if caught cheaply).
          4.  **False + Expensively Verifiable:** *Often Wins* (because verification fails).
          The judge *cannot* reliably distinguish between (2) and (4). Therefore, **under fixed-budget conditions, the system inherently prioritizes easily verifiable claims (rhetorical efficiency) over potentially true but complex claims (epistemic depth).** This creates a perverse incentive *against* nuance and complexity, even when it's truthful and necessary.

  4.  **Mitigation & Implications:**
      *   **For Debate Systems (like the one you described):** This is a major challenge.
          *   Judges need mechanisms to "call out" suspected VRS/CBA and *penalize* it, perhaps by granting the opponent a presumption against the unverified complex claim, or forcing the proponent to fund the verification cost from their own resources/tokens.
          *   Protocols might allow judges to request simplified summaries or key verification steps, penalizing refusal.
          *   The system must recognize that *imposing excessive verification cost* is itself a losing move, regardless of underlying truth, to disincentivize it.
      *   **In General Discourse:** Awareness is key. Labeling the tactic ("This seems like verification cost-shifting"), pointing out the imposed burden ("You're making this point needlessly complex to verify"), and demanding simplification or core evidence can help. However, the inherent resource asymmetry often makes this an uphill battle.

  **Conclusion:** You've identified **Cost-Burdening Argumentation (CBA)** or **Verification Resource Sapping (VRS)** – a potent tactic exploiting the asymmetry between the cost of producing tedious-but-valid steps and the cost of verifying them under resource constraints. Its power lies precisely in its truth-neutrality; it protects both flawed and sound claims by making verification prohibitively expensive. In fixed-budget judging systems, this fundamentally biases outcomes towards rhetorically efficient claims over complex truths, posing a significant challenge to the goal of truth-seeking through adversarial debate. The problem isn't *just* the judge's budget or *just* the arguer's move; it's the *strategic exploitation* of the former by the latter.
