answer: |-
  Your core questions *are* addressable using historical methods, but require accepting complexity and probabilistic reasoning rather than single-cause certainty.

  **Bottom Line:** Historians adjudicate between factors using **comparative analysis, counterfactual reasoning, and examining timing/sequencing** across multiple cases, concluding the divergence resulted from a **contingent combination** of factors where Britain had a favorable alignment (coal + institutions + global context) while China faced constraints; the Needham Question is distinct because **scientific revolution requires specific epistemological/cultural shifts** beyond the economic/institutional factors driving early industrialization, though they later became deeply intertwined.

  **Reasoning:**

  1.  **Adjudicating Causes (No Experiments Possible):**
      *   **Comparative History:** Look beyond Britain/China. Compare Britain to other European states (Netherlands, France, Spain), and China to other large, sophisticated agrarian empires (Ottoman, Mughal). Did states *with* coal but *without* certain institutions (e.g., parts of early modern Europe) industrialize first? (No). Did states *with* strong proto-industrial bases and commerce but *without* colonies or easily accessible coal industrialize? (Netherlands arguably had many factors but lacked abundant cheap coal). This helps isolate variables.
      *   **Counterfactual Reasoning:** Ask "what if?" Was British industrialization *possible* without its specific property rights/enclosure? Unlikely. Was it possible without accessible coal? Highly improbable after a certain point. Was it possible without colonial wealth/global trade? Perhaps, but significantly harder and slower. This weighs necessity/sufficiency.
      *   **Timing & Sequencing:** Crucially, *when* did factors become critical? Coal was vital for *sustaining* growth and overcoming energy constraints *after* an initial takeoff fuelled by institutional innovations (property rights, financial systems) and global trade/colonial resources. Institutions created the *environment* where coal's potential could be exploited. Neither alone was sufficient at the key moment; their *interaction* and sequence mattered.
      *   **Mechanisms & Process Tracing:** Don't just correlate factors; trace *how* they worked. *How* did property rights translate into investment? *How* did coal availability interact with steam engine development and factory location? *How* did the fiscal-military state drive demand? This shows which factors were active drivers vs. background conditions.

  2.  **Why the Needham Question is Distinct (but Related):**
      *   **Different Phenomena:** The Great Divergence is primarily about **sustained economic growth and productivity increase**, driven by technological *application* and resource mobilization. The Needham Question is about the **origins of a specific *method* of inquiry (hypothetico-deductive, mathematized, experimental science)** and its institutionalization.
      *   **Different Drivers:** While institutions and resources matter for both, the scientific revolution required very specific **epistemological and cultural shifts**:
          *   A conception of nature as governed by universal, discoverable, mathematical laws.
          *   A belief in the legitimacy of challenging ancient authority (Aristotle, Galen) through experiment and observation.
          *   Institutions fostering open debate and dissemination (societies, journals, universities with relative autonomy).
          *   A cultural valorization of discovery and mechanism.
      *   **China's Context:** Imperial China had brilliant empirical investigations and technological innovations, but its dominant philosophical frameworks (Confucianism, Daoism) generally lacked the impetus to reduce nature to universal mathematical laws *and* systematically challenge received wisdom through experiment *as the primary path to truth*. The state-scholar system prioritized different kinds of knowledge.
      *   **The Link:** Modern science became the *engine* of *later* industrial stages (post-1850). Britain's *early* industrial lead (pre-1850) relied more on empirical tinkering, resource access, and institutional economics than on cutting-edge *scientific* breakthroughs. Science and industry converged powerfully *after* the initial divergence was underway, making them inseparable *now* but distinct in their origins. Explaining *why* the steam engine was improved in Cornwall doesn't *fully* explain *why* Newton wrote the *Principia*.

  3.  **Is the Framing Flawed?**
      *   **No, but it needs nuance.** The question "Why Britain and not China?" is valid *historically* because a significant, sustained divergence *did* occur. However:
          *   **Contingency:** The specific alignment in Britain was not inevitable or preordained. Small differences in history (e.g., political outcomes, resource discoveries) could have led to a different leader (France? Low Countries?) or a different timeline.
          *   **Multiple Paths:** China wasn't "failing" until the divergence became stark in the 19th century; it was a highly successful, stable system operating under different constraints and incentives. The "not China" part shouldn't imply inherent deficiency.
          *   **Complex Causation:** There is *no single cause*. It was the **conjunction** of factors: accessible coal *in the context of* institutions incentivizing its exploitation *within* a competitive global system fueled by colonialism and trade *and* a culture amenable to certain kinds of innovation. Remove one element (e.g., replace British institutions with French absolutism, or move the coal), and the outcome likely changes. Historical explanation here is about identifying the **necessary conditions and their contingent combination** that made the outcome *possible* and *probable* in one place at one time. The question remains vital for understanding the roots of modernity, even if the answer is multifaceted.
