answer: |-
  The practice you describe reveals a nuanced relationship between formal systems and mathematical truth, centered on **relative justification** rather than absolute foundation. Let's reconstruct the implicit view, separate necessities from accommodations, and explore the consequences of eliminating any "outside" standpoint.

  ### Core Presuppositions
  1. **Truth as Relative Consistency**:  
     The practice presupposes that mathematical truth is captured *relationally*: a statement is "true" within a formal system if it is consistent with the system's axioms, and "true" in an intuitive sense if it holds across systems that model the intended domain. The MU-puzzle argument (relying on invariants) isn't an absolute "outside" but a shift to a *meta-system* (e.g., arithmetic) to prove properties of the original system (MIU-theory).

  2. **Bootstrapping Trust**:  
     Every formal system requires a **trusted kernel** (axioms, inference rules, or verified components). This kernel is not justified within the system but is assumed consistent based on:  
     - Empirical validation (decades of use without contradiction).  
     - Simplicity (e.g., the Lean kernel is small enough to audit).  
     - Mutual reinforcement (multiple systems converge on similar kernels).  

  3. **Meta-Systems as Deferred Foundations**:  
     The "outside" standpoint is always another formal system. The MU-puzzle argument uses elementary number theory to reason about MIU-theory. This doesn't collapse the distinction but **relocates trust** to the meta-system. The chain of justification terminates in a system accepted as reliable.  

  ### What the Practice Strictly Requires
  1. **A Trusted Base**:  
     A minimal set of axioms/rules must be taken as given. Without this, infinite regress prevents any derivation.  

  2. **Explicit Tracking of Assumptions**:  
     Proof assistants distinguish:  
     - `theorem` (kernel-verified),  
     - `axiom` (trusted base),  
     - `sorry`/`admit` (explicitly untrusted gaps).  
     This enforces honesty about dependencies.  

  3. **Conservation of Justification**:  
     If theorem `T` is proved from lemma `L` (which is admitted), `T` inherits `L`'s assumptions. Reporting `T` as "proved" requires disclosing this reliance.  

  ### What It Merely Accommodates
  1. **Meta-Reasoning**:  
     Arguments like the MU-puzzle are useful but replaceable. One could derive `MU`-underivability within MIU-theory by enumerating all strings up to a length—inefficient but internal.  

  2. **Stronger Assumptions in Theorems**:  
     Using a stronger lemma (`L'`) to prove `T` is acceptable if:  
     - `L'` is later verified, or  
     - `T` remains valuable conditional on `L'`.  
     This is pragmatic, not foundational.  

  3. **Multiple Foundational Systems**:  
     The practice accommodates switching between systems (e.g., ZFC vs. HoTT). Truth is relativized to the system, but consistency across systems boosts confidence.  

  ### If No "Outside Standpoint" Existed
  Suppose we could never step outside *any* formal system—no meta-perspective, not even deferred. This would entail:  

  1. **Collapse of Meta-Theoretic Arguments**:  
     Results like Gödel's incompleteness theorems or the MU-puzzle invariance could not be formulated. Every claim would require explicit derivation within one system.  

  2. **No Relative Consistency Proofs**:  
     Mathematicians couldn't argue that "if ZFC is consistent, then Riemann Hypothesis is true." All reasoning would be absolute and intra-system.  

  3. **Truth as Syntactic Derivation**:  
     "Truth" would reduce to formal provability within a single system. Undecidable statements (e.g., Continuum Hypothesis) would have no truth value.  

  4. **Erosion of Trust**:  
     Without external checks (e.g., verifying the kernel via compilation to binary), proof assistants could only self-verify, risking inconsistency loops (e.g., a compromised kernel "proving" its own consistency).  

  ### Conclusion
  The practice presupposes that **formal systems are tools for modeling mathematical intuition**, not self-contained truth generators. It requires a **minimal trusted base** and **explicit assumption tracking**, but accommodates meta-reasoning and deferred foundations. The "outside" is always another system, creating a chain of justification that ends in communal acceptance.  

  Without any outside standpoint, mathematics would lose its ability to generalize across systems, verify its foundations, or distinguish between syntactic games and meaningful truth. The MU-puzzle argument exemplifies this: it uses a meta-system (arithmetic) to efficiently resolve a question in MIU-theory, demonstrating that **formal systems gain power through controlled reference beyond themselves**. The distinction isn't collapsed—it's layered, with each layer providing leverage on the next.
