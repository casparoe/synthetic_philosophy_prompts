prompt: |-
  In most American states an employer may fire a worker for any reason or for none, and courts will not enforce an employer's promise of long-term job security; yet the same courts enforce a non-compete clause by injunction, barring the former employee from working in her field for a year or more, and enforce arbitration clauses that keep her claims out of court. The law also treats the worker as free so long as no one actually interferes with her: her health insurance, her retirement savings, and in some cases her right to remain in the country all depend on one employer's continued goodwill, but a worker whose employer happens not to act against her suffers no interference and therefore no loss of liberty. Against this, the Thirteenth Amendment forbids involuntary servitude, permitting it only as punishment for a crime.

  What conception of freedom does this arrangement presuppose? Reconstruct the implicit view — what must be true about freedom, coercion, and the difference between state action and private power for these practices to hang together — and then say which parts of the practice that view strictly requires and which it merely fits. Is the practice internally consistent, or does it need two different conceptions, one for the state and one for the employer? Where is it underdetermined, in that more than one conception of freedom would license the same rules? Finally, take the rival view on which freedom is the absence of domination, so that subjection to another's arbitrary, unchecked power is unfreedom even if that power is never exercised: what in current law survives on that view, and what would have to change — in the at-will default, in the enforcement of non-competes and arbitration clauses, and in the tying of benefits to employment? Answer in American English.
