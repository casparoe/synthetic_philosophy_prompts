answer: |-
  The American employment system you describe rests on a **classical liberal conception of freedom as non-interference**, derived from thinkers like Hobbes and Locke. This view holds:

  1.  **Freedom as Non-Interference:** An individual is free insofar as no one *actively interferes* with her choices using force, threats, or fraud. Mere vulnerability to interference isn't unfreedom.
  2.  **Coercion as Direct Intervention:** Coercion occurs only when an actor (especially the state) *directly prevents* someone from acting. Private power imbalances or the threat of future harm generally don't count.
  3.  **Sharp State/Private Distinction:** The state is the primary potential source of *illegitimate* coercion. Private actors (employers) are generally free to act as they wish within the law. State action (like enforcing contracts) facilitates private ordering, not coercion.
  4.  **Formal Equality & Contract:** Individuals are formally equal before the law. Voluntary agreements (even under pressure) are sacrosanct. Courts enforce contracts as written, not based on underlying power disparities.

  **How This View Explains the Practices:**

  *   **At-Will Employment:** The employer's act of firing is a private choice, not state coercion. The worker isn't *physically prevented* from seeking other work. Her vulnerability to dismissal doesn't constitute state interference with her liberty.
  *   **Enforcing Non-Competes/Arbitration:** Courts enforce these *private contracts* (non-interference by the state with the agreement). The injunction *is* state action, but it's framed as upholding the worker's prior voluntary commitment (freedom of contract), not coercing her.
  *   **Tying Benefits to Employment:** The employer's choice to offer (or withdraw) benefits is a private act. As long as no law *forces* the employer to act against the worker, and the worker isn't physically prevented from leaving, there's no state interference and thus no loss of liberty. Her dependence is a private misfortune, not a state-created unfreedom.
  *   **Thirteenth Amendment Exception:** Involuntary servitude involves *direct physical restraint or compulsion* – the paradigm case of active interference/coercion the amendment forbids. It sets a bright line against *that specific form* of unfreedom.

  **What the View Strictly Requires vs. What it Merely Fits:**

  *   **Strictly Requires:** The sharp state/private action distinction and the core definition of coercion as direct intervention. The state *cannot* directly force someone to work for a specific employer outside punishment (13th Amendment). It *must* enforce valid private contracts (like non-competes/arbitration clauses) as a matter of upholding voluntary agreements.
  *   **Merely Fits:** The specific *scope* of at-will employment, the *enforceability* of very broad non-competes, and the *extent* to which benefits are tied to a single employer. The view permits but does not *demand* these extremes. A society adhering to non-interference could, in theory, legislate worker protections or limit non-competes if it deemed the resulting private agreements *truly* coercive or against public policy, though its inherent bias makes this unlikely.

  **Internal Consistency?** The arrangement is **internally consistent *only if* one strictly maintains the state/private distinction and defines coercion narrowly as direct intervention.** From this perspective:
  *   The state doesn't coerce workers by allowing at-will firing (private act).
  *   The state *does* coerce via injunctions, but this is justified as enforcing the worker's own promise (contract).
  *   The state doesn't coerce by failing to mandate benefits or job security (inaction).
  The 13th Amendment forbids only the most extreme, direct state (or private) coercion – slavery.

  However, **it appears inconsistent if one questions the state/private distinction's rigidity.** The state *actively chooses* the legal framework: it mandates at-will employment as the default *and* actively enforces employer-friendly contracts via injunctions, while *refusing* to enforce promises of job security. This isn't passive neutrality; it's an active legal structure favoring employer power. The "private" acts of firing or demanding a non-compete only exist within this state-created framework.

  **Where is it Underdetermined?** The non-interference view underdetermines:
  1.  **The Default Rule:** It permits at-will employment but could also permit a default "just cause" requirement if society viewed wrongful termination as a form of private coercion needing remedy.
  2.  **Contract Limits:** It permits enforcing non-competes but could justify stricter scrutiny or bans if certain terms were deemed inherently coercive or against public policy (e.g., for low-wage workers).
  3.  **Benefit Structures:** It permits tying benefits to employment but doesn't forbid creating portable, universal systems (like Social Security for retirement) that reduce dependence.

  **The Non-Domination View (e.g., Philip Pettit):**

  This view defines freedom as the **absence of domination** – the absence of subjection to another's *arbitrary* power (power unchecked by rules or recourse, exercisable at will). Unfreedom exists when someone *can* interfere arbitrarily in your choices, even if they *don't*.

  **Analysis Under Non-Domination:**

  1.  **At-Will Employment:** This *is* domination. The employer holds arbitrary, unchecked power to fire the worker for any reason (good, bad, or none). The worker lives at the mercy of the employer's will, regardless of actual firing. This constitutes unfreedom.
  2.  **Non-Compete Clauses:** Enforcement via injunction *could* be non-dominating *only if* the clause is narrowly tailored, necessary to protect a legitimate interest (like trade secrets), and doesn't grant the employer arbitrary power to veto future employment broadly. Overly broad non-competes function as instruments of domination, allowing the employer to arbitrarily control the worker's career path even after employment ends.
  3.  **Arbitration Clauses:** Mandatory arbitration *can* be dominating if it effectively shields the employer from accountability and denies the worker a fair, independent forum to challenge the employer's arbitrary actions (like wrongful termination or discrimination). It becomes a tool for unchecked power.
  4.  **Tying Benefits to Employment:** This *intensifies domination*. The employer's arbitrary power extends beyond the job to essential aspects of life (health, retirement, residency). The worker's vulnerability is extreme, as losing the job means losing far more than income. This deep subjection to another's arbitrary will is a profound unfreedom.
  5.  **Thirteenth Amendment:** This fits perfectly, as chattel slavery is the ultimate, explicit domination. But the non-domination view sees a *continuum* of unfreedom, where modern workplace subjection, while less extreme, shares the structural feature of arbitrary power.

  **What Survives? What Changes? (Under Non-Domination)**

  *   **Survives:**
      *   The core principle against slavery/involuntary servitude (13th Amendment).
      *   The general enforceability of *some* contracts.
      *   The employer's need to protect legitimate business interests (like trade secrets).
      *   *Potentially* some forms of arbitration if truly fair and accessible.
  *   **Requires Change:**
      1.  **At-Will Default:** Would need fundamental revision. A default requiring "just cause" for termination (or robust statutory protections against unfair dismissal) is necessary to remove the employer's *arbitrary* power to fire. Freedom requires security against capricious interference.
      2.  **Non-Compete Clauses:** Strictly limited and scrutinized. Only enforceable if:
          *   Truly necessary to protect a *specific, legitimate* business interest (not just general competition).
          *   Limited in duration, geographic scope, and job function to what's absolutely necessary.
          *   Preserving the worker's ability to earn a livelihood in her field. Broad bans would likely be prohibited as instruments of domination. Many states are already moving in this direction.
      3.  **Arbitration Clauses:** Cannot be mandatory or effectively shield the employer from accountability. Workers must have access to fair, independent tribunals (like public courts) to challenge arbitrary exercises of employer power. Pre-dispute mandatory arbitration for core employment claims would likely be seen as facilitating domination.
      4.  **Tying Benefits to Employment:** Requires decoupling essential benefits from any single employer. Universal or portable systems for health insurance, retirement savings (strengthening beyond 401(k)s), and residency security are necessary to reduce the worker's subjection to the employer's arbitrary will. This removes a key lever of domination.

  **In essence:** The current system presupposes freedom is simply not being actively pushed around. The non-domination view argues true freedom requires not living under the constant threat of being arbitrarily pushed around by those who hold unchecked power over you. Adopting this view would necessitate a radical restructuring of American employment law to ensure workers are not subject to the arbitrary power of their employers.
