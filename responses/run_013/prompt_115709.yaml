  The tricky part is showing where this view is inconsistent. Like how the state actively enforces employer-friendly contracts (injunctions for non-competes) but stays passive on worker protections. That's not neutrality - it's taking sides while pretending not to. The user's hint about the 13th Amendment is spot-on: the law treats literal enslavement as unfreedom but ignores structural domination.

  For the non-domination analysis... *scribbles mentally* If we applied Pettit's view, at-will employment itself becomes problematic because the employer holds arbitrary power. Non-competes would need strict proportionality tests. And tying benefits? That's pure domination - your healthcare shouldn't depend on a boss's whim. 

