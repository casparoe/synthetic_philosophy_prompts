prompt: |-
  ok so for my ethics class final i have to do a creative response to our unit on supererogation (acts that go beyond the call of duty) and i'm definately overthinking it, but my idea is to write it as a chunk of an employee handbook from a big tech-ish company that has basically decided that going above and beyond is just... the job. the handbook keeps sliding between "we're proud that our people do more than they have to" and "doing more than you have to is a core expectation," and nobody at the company ever notices the slide. by the end it should have gone all the way: the company has quietly abolished the difference between what you owe and what's extra, which i think means there's nothing left to praise anyone for, and the handbook is somehow fine with that. they're also weirdly confident about a philosophical claim -- something like "if an act is the best thing you could possibly do, then it was never optional" -- and they treat that as an HR policy rather than a moral theory.

  can you write it? around 650 words, deadpan, no winking, formatted as numbered handbook sections with a few headers, and then a short FAQ at the end from the Office of Duty Compliance. give them some internal system they've invented -- i was thinking an internal market where employees trade credits for acts of heroism, and the joke is the credits keep losing value as the company makes more and more of those acts mandatory, but the company keeps trying to prop the price up. it should be funny to someone who's actually read about supererogation (the puzzle about whether the best act can really be optional, whether heroes are doing anything extra at all, the demandingness stuff) but my friends who haven't read any of it should still get the joke. dont have anyone in the piece explain the philosophy or name the paradox -- the reader should be able to work out what's being made fun of. the FAQ could answer things like whether you can opt out of the heroism tier, deadpan.

  and please just start with the handbook itself, first line, no intro or explanation before it.
reasoning: |-
  Okay, the user is working on a creative ethics final about supererogation—acts that go beyond duty. They want me to write a satirical employee handbook for a tech company that blurs the line between duty and extra effort until there's no distinction. I need to create something around 650 words, formatted with numbered sections and an FAQ, all deadpan and subtle. 

  First, I'll outline the core irony: the company claims to value going above and beyond while making it mandatory, erasing any real praise. Key elements include the internal "heroism credit" system devaluing as acts become compulsory, and philosophical undertones like "the best act can't be optional" presented as HR policy. 

  For structure, I'll start with the handbook text immediately (no intro). Sections should escalate the absurdity: 
  1. Core Values (early hints of the slide) 
  2. Duty Framework (defining "baseline" vs. "heroic" while undermining it) 
  3. Heroic Contribution Credit System (HCC) with mechanics 
  4. Performance Expectations (explicitly folding heroism into job duties) 
  5. FAQ from "Office of Duty Compliance" (darkly bureaucratic) 

  The humor must work on two levels: 
  - Ethics students will spot the supererogation paradoxes (demandingness, praise erosion) 
  - Lay readers will laugh at corporate doublespeak and credit system collapse 

  Wordplay ideas: 
  - "Spontaneous Heroism" as a required KPI 
  - HCC market crashing due to "policy refinements" 
  - FAQ denying opt-outs with circular logic ("heroic tier is foundational") 

  Tone is crucial—zero irony from the narrator. Let the contradictions speak for themselves. FAQ answers should sound like a DMV crossed with a dystopian HR department. 

  Internal checks: 
  - Credits start tradable but end worthless (mirrors moral value depletion) 
  - Final FAQ reveals mandatory heroism is unrewarded ("compensation is in the act itself") 
  - Never name philosophical terms; imply through corporate jargon 

  I'll wrap with the system's total failure: HCCs now "symbolic" due to universal mandates, yet the company insists it's working. Perfect for the user's "unnoticed slide" concept.
answer: |-
  **Veridian Dynamics Employee Handbook v.7.3**  
  *Section 4: Duty, Contribution & Voluntary Excellence*

  **1. Our Ethos: Beyond the Baseline**  
  At Veridian Dynamics, we don't just meet expectations; we redefine them. Our culture is built on individuals consistently choosing to exceed the minimum requirements of their roles. This spirit of *going further* is what distinguishes Veridian from the ordinary.

  **2. The Veridian Duty Framework**  
  All roles possess defined **Baseline Obligations (BO)** – essential tasks necessary for function. Veridian also recognizes **Heroic Contributions (HC)** – actions demonstrably exceeding BOs, generating exceptional value for colleagues, clients, or the company mission. While BOs constitute your core responsibility, HC represents the Veridian ideal.

  **3. The Heroic Contribution Credit (HCC) System**  
  To foster and recognize the spirit of HC, Veridian operates the internal HCC market.  
  *   Employees earn HCCs through verified HC acts (e.g., debugging critical systems off-cycle, mentoring beyond required scope, pioneering unsolicited efficiency gains).  
  *   HCCs are tradable on the internal Veridian Exchange (VEX) platform for perks (e.g., priority scheduling, reserved collaboration pods, limited-edition company merch).  
  *   HCC balances are visible (anonymized) on team dashboards, fostering healthy aspiration.  
  *   *Note:* Accumulation of HCCs is a positive indicator of cultural alignment.

  **4. Performance Expectations & the Veridian Standard**  
  Your annual review assesses both BO fulfillment and HC demonstration.  
  *   **Meets Expectations:** Consistently fulfills all BOs.  
  *   **Exceeds Expectations:** Fulfills all BOs *and* demonstrates consistent HC activity, reflected in tangible HCC accrual. This is the **Veridian Standard**.  
  *   **Role Model:** Significantly surpasses the Veridian Standard through exceptional HC volume and impact.  

  Achieving "Exceeds Expectations" (the Veridian Standard) is the benchmark for career progression and full participation in the Veridian community. "Meets Expectations" indicates development areas regarding our cultural commitment to exceeding baseline obligations.

  **5. The Logic of Maximum Contribution**  
  Veridian operates on a simple, powerful principle: **The Optimal Action is the Required Action.** If an act represents the objectively best possible contribution in a given context – yielding maximum positive impact for the company, its people, and its mission – then, by definition, it falls within the scope of reasonable expectation for a Veridian employee. True optionality only exists where multiple actions yield equivalent, sub-optimal outcomes. Choosing the *best* isn't extra; it's core.

  **6. Sustaining the Culture**  
  Spontaneous HC is vital. Managers are trained to identify and encourage opportunities for employees to demonstrate HC within their workflow. Remember: HC isn't about *extra* hours (though dedication is appreciated), but about *elevated* action within the scope of one's role and resources. Proactively seeking HC opportunities is a hallmark of the Veridian mindset.

  ---

  **FREQUENTLY ASKED QUESTIONS**  
  *Office of Duty Compliance (ODC)*

  **Q1: Is achieving "Exceeds Expectations" (the Veridian Standard) genuinely mandatory?**  
  A1: "Exceeds Expectations" reflects the successful integration of HC demonstration into standard role performance. Fulfilling BOs alone ("Meets Expectations") indicates a performance gap relative to our cultural norm and operational needs. Consistent "Meets Expectations" ratings trigger supportive performance development plans aimed at achieving the Veridian Standard.

  **Q2: Can I opt out of the "heroism tier" and just focus on my Baseline Obligations?**  
  A2: The distinction between BO and HC is primarily for operational clarity within the Duty Framework. The Veridian Standard integrates the *demonstration* of HC into expected role performance. Focusing solely on BOs neglects the integrated expectation of contribution beyond the baseline, which is fundamental to our culture and success. There is no formal "opt-out" for the Veridian Standard expectation.

  **Q3: Why has the HCC value on VEX dropped significantly? Perks cost many more credits now.**  
  A3: Fluctuations in the HCC market reflect evolving employee engagement and policy refinements. Increased participation in HC activities naturally impacts credit valuation. The ODC, in conjunction with Culture & Engagement, periodically reviews the HCC-perk exchange ratios to maintain aspirational value. Focus remains on the intrinsic reward of contribution.

  **Q4: My manager logged my weekend crisis intervention as an HC. It felt like my job. Why didn't it count towards my BO?**  
  A4: The Duty Framework Assessment Tool (DFAT) objectively categorizes actions based on predefined parameters relative to core role definitions. While addressing crises is valued, the *specific timing, impact, and unscheduled nature* of your intervention met HC thresholds. Your BOs cover expected response protocols during designated hours. Your action exceeded that baseline.

  **Q5: If the best action is always required, does that mean true "going above and beyond" doesn't exist at Veridian?**  
  A5: The concept of "above and beyond" implies a realm of action exceeding reasonable expectation. At Veridian, we recognize that the *objectively optimal action* is always within the realm of reasonable expectation for a committed employee. Therefore, performing the optimal action fulfills a fundamental expectation. Praise is directed towards consistent demonstration of this standard, embodying the Veridian ethos. The compensation *is* the act itself, aligned with our collective peak potential.
