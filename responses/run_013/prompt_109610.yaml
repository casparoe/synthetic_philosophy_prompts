  Here is a diagnostic decision tree that categorizes positions on the Anthropocene based on **conceptions of Earth-history boundaries** and **attributions of authority**, rather than preferred start dates. It isolates why formal recognition failed and why the term persists. The tree has 12 nodes and 8 leaf positions, with empty cells indicating logical gaps. Nodes use concrete cases, not jargon.

  ---

  ### **DECISION TREE: THE ANTHROPOCENE TANGLE**  
  *Follow the paths to find your position—and its thorniest implication.*

  #### **Q1: When you hear "Anthropocene," does Crawford Lake’s plutonium layer (the proposed 1950s marker) feel like:**  
  **A) A decisive geological clue**—like iridium proving an asteroid killed the dinosaurs.  
  *→ Go to Q2 (Stratigraphic Path)*  
  **B) A scientific distraction**—the real issue is when humans *became* a planetary force.  
  *→ Go to Q6 (Human-History Path)*  

  ---

  ### **STRATIGRAPHIC PATH**  
  *(Focus: Boundaries require physical evidence in rock/ice)*  

  #### **Q2: Should a global geological marker be:**  
  **A) Near-simultaneous worldwide**—like plutonium fallout in 1952.  
  *→ Go to Q3*  
  **B) Detectable even if time-transgressive**—like farming’s slow spread altering soils.  
  *→ Leaf: **EARLY ANTHROPOCENE (NEOLITHIC)***  
   *Awkward: Cannot be pinned to one global moment; undermines formal epoch criteria.*  

  #### **Q3: Must the marker be preserved in a *single* reference section (e.g., Crawford Lake)?**  
  **A) Yes**—a "golden spike" site is non-negotiable.  
  *→ Go to Q4*  
  **B) No**—multiple sections can collectively define it.  
  *→ **EMPTY CELL**  
   *Diagnosis: Unattractive—stratigraphic rules require one reference site. No movement supports this.*  

  #### **Q4: Should the marker coincide with a fundamental Earth-system shift (e.g., climate/biodiversity changes)?**  
  **A) Yes**—it must reflect more than just human activity.  
  *→ Go to Q5*  
  **B) No**—a unique human-made signal (e.g., plutonium) suffices.  
  *→ Leaf: **GREAT ACCELERATION (1950s)***  
   *Awkward: Ignores centuries of pre-1950 human impacts.*  

  #### **Q5: Can the marker be a *shift* in natural systems (e.g., CO₂ surge), or must it be a *novel* human artifact (e.g., plastic)?**  
  **A) Novel artifact**—only unprecedented techno-signatures count.  
  *→ Leaf: **GREAT ACCELERATION (1950s)***  
  **B) Shift in natural systems**—e.g., CO₂ spikes from industry.  
  *→ Leaf: **ORBIS SPIKE (1610)***  
   *Awkward: Ties geological validity to colonial genocide and a temporary CO₂ dip.*  

  ---

  ### **HUMAN-HISTORY PATH**  
  *(Focus: Boundaries reflect societal values, not just rocks)*  

  #### **Q6: What *kind* of human threshold matters most?**  
  **A) Onset of a causal system**—e.g., capitalism, industrialization.  
  *→ Leaf: **CAPITALOCENE***  
   *Awkward: Cannot be dated precisely; rejects "Anthropos" as misleading.*  
  **B) Measurable global impacts**—e.g., species extinction, climate change.  
  *→ Go to Q7*  
  **C) Humans gaining awareness/responsibility**—e.g., post-Hiroshima.  
  *→ Leaf: **ANTHROPOCENE AS RESPONSIBILITY***  
   *Awkward: Absolves pre-scientific societies of planetary harm.*  

  #### **Q7: When did impacts become irreversible and global?**  
  **A) 1800s**—steam engines, coal, and colonialism.  
  *→ Leaf: **INDUSTRIAL REVOLUTION***  
   *Awkward: Eurocentric; overlooks pre-industrial land use.*  
  **B) 1950s**—nuclear/plastic age and population boom.  
  *→ Leaf: **GREAT ACCELERATION (1950s)***  
  **C) Centuries ago**—e.g., farming or metallurgy.  
  *→ Leaf: **EARLY ANTHROPOCENE (NEOLITHIC)***  

  ---

  ### **WHO DECIDES?**  
  *(Applies to ALL paths above)*  

  #### **Q8: Who should formalize the boundary?**  
  **A) Stratigraphic bodies (ICS/IUGS)**—existing geological authorities.  
  *→ Leaf: **STRATIGRAPHIC FORMALISM***  
   *Awkward: Privileges slow-moving committees over new science.*  
  **B) Earth-system scientists**—climatologists, ecologists, etc.  
  *→ Leaf: **EARTH-SYSTEM AUTHORITY***  
   *Awkward: May sideline traditional geology’s expertise.*  
  **C) No one**—it’s a cultural term, not a geological unit.  
  *→ Leaf: **INFORMAL DESCRIPTOR***  
   *Awkward: Allows contradictory usages to proliferate.*  
  **D) Society/politics**—geologists shouldn’t own this.  
  *→ Leaf: **POLITICAL ETHICS***  
   *Awkward: Risks divorcing the term from empirical science.*  

  ---

  ### **KEY LEAVES & AWKWARD COMMITMENTS**  
  1. **Great Acceleration (1950s)**: Proposes a sharp geological break but sidelines deeper human history.  
  2. **Orbis Spike (1610)**: Treats colonialism as a geological event—ethically fraught and stratigraphically debatable.  
  3. **Industrial Revolution**: Uses Euroindustrialism as a planetary benchmark.  
  4. **Early Anthropocene (Neolithic)**: Overwhelms geology with gradual, patchy evidence.  
  5. **Capitalocene**: Rejects "humanity" as the cause but lacks a clear stratigraphic expression.  
  6. **Anthropocene as Responsibility**: Makes ethics, not geology, the foundation—but ethics shift.  
  7. **Informal Descriptor**: Accepts usefulness while denying scientific legitimacy.  
  8. **Stratigraphic Formalism**: Trusts bureaucratic processes amid Earth-system crises.  

  ---

  ### **LIMITATIONS & EMPTY CELLS**  
  - **Stratigraphic-Human Hybrids**: Positions like the *Orbis Spike* (1610) straddle both paths—their advocates see the CO₂ dip as *both* a geological marker and a colonial legacy. The tree forces a choice, but reality is messy.  
  - **Unoccupied Logical Space**:  
    - A *strict formalist backing an agricultural start* (Q2B + Q3A) is **empty**—stratigraphers require synchronous markers, which early farming lacks.  
    - *Demanding a precise date while denying any authority to set it* (Q8C + any specific marker) is **incoherent**—dating requires institutional agreement.  
  - **"Event" vs. "Epoch"**: The tree defaults to epoch-seeking views. If you reject *all* start dates, you likely see the Anthropocene as an **event** (no single base)—but this view is reachable from any human-history path by rejecting periodization altogether.  

  This instrument reveals the Anthropocene’s core tension: **Geology demands globally synchronous, apolitical markers; human history sees boundaries as value-laden and process-driven.** The 2024 vote failed because these frameworks talk past each other—yet both agree humans reshape Earth.
