  Retired geologist here — 35 years on sediment transport before I caught the philosophy bug, so apoligies in advance if I mangle the vocabulary. I keep coming back to Dennett's cranes and skyhooks, and there's something that won't sit right with me: you can only tell an unbuilt crane from a skyhook once the crane has actually been built, which means the distinction seems to do no work at the exact moment you'd want it — when you're staring at some supposedly irreducible phenomenon and trying to decide whether to keep digging or call it basic. What are the most important implications of the crane/skyhook distinction for how a working scientist should treat emergence and irreducibility claims, and is greedy reductionism a genuinely distinct error, or just a name for stopping the explanation earlier than someone else would like? Lead with your bottom line in the first sentence, then the reasoning, no preamble and don't restate my question. Also tell me what would change your mind — which argument or case would push you to a different verdict, or where your reasoning is most likely to fail.
