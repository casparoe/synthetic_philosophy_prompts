answer: |-
  ### Joint Statement: Agreed Claims on the Four-Rung Ladder

  1. **Darwinian Rung**: Competence is genetically fixed by natural selection. Costs of error are paid intergenerationally; no individual learning occurs.  
  2. **Modes, Not Species**: Rungs represent cognitive modes, not species-level categories. Single organisms may exhibit multiple modes contextually (e.g., Skinnerian habits alongside Popperian planning).  
  3. **Multiple Realizability**: Identical behavioral profiles (e.g., planning) can arise from distinct mechanisms. Behavioral tests alone cannot conclusively identify the operative mode.  
  4. **Ascending the Ladder**: The primary increase is in *decoupling*—action selection becomes progressively divorced from direct physical/temporal consequences of actions.  
  5. **Ladder’s Limits**: This framework is not a theory of consciousness, neural implementation, emotion, or non-cognitive traits (e.g., perception). It addresses competence amplification only.  

  ### Residual Disagreements: Framework for Ongoing Inquiry  
  The table below catalogs unresolved questions. For each, we specify:  
  - **Question at Issue**: Core dispute.  
  - **Formulation**: Neutral framing acceptable to both positions.  
  - **Crux**: Sub-question that, if resolved, would shift at least one position.  
  - **Test/Case**: Mutually agreed evaluative method.  
  - **Predictions**: Anticipated outcomes per position.  

  | Question at Issue                 | Formulation (A vs. B)                                                                                                                                 | Crux                                                                 | Test/Case                                                                                                                                                                | Predictions                                                                                                                                                                       |
  |-----------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Skinnerian–Popperian: Discontinuity in Mechanism?** | **A**: Does the transition require a distinct "inner environment" mechanism (e.g., simulation), absent in Skinnerian cognition? **B**: Does it reflect quantitative decoupling via associative machinery alone? | Is an inner environment *necessary* for Popperian cognition?         | **Disposition-table thought experiment**: A creature with no inner environment but exhaustive reinforcement history matches Popperian performance (planning/transfer/revaluation). | **A**: Shows only *simulated* Popperian behavior; no true hypothesis-testing. **B**: Demonstrates Popperian cognition; decoupling suffices regardless of mechanism.                |
  | **Popperian Transfer: Mechanism or Scaling?** | **A**: Does one-shot transfer to novel problems require an inner environment? **B**: Can associative systems achieve it through decoupled generalization? | Can pure associative scaling explain transfer without an inner model? | Test organisms on novel problems after limited exposure. Compare associative systems (e.g., deep RL) with model-based systems. Measure error rates/adaptation speed.      | **A**: Model-based systems outperform; transfer fails in scaled associative systems. **B**: Scaled associative systems achieve parity if decoupled from consequences.              |
  | **Gregorian Tools: Internalized Competence?** | **A**: Do tools rewire cognition, leaving internalized competence? **B**: Are tools external scaffolds, with competence dependent on their presence? | Does tool removal reveal internalization or scaffold loss?           | Train subjects on a task requiring a tool (e.g., symbolic notation). Remove tool and test: (1) baseline competence retention, (2) novel adaptations, (3) time/effort costs. | **A**: Competence persists; loss reflects retrieval cost. **B**: Competence degrades; loss indicates computational reliance on the tool.                                           |
  | **Gregorian Amplification: Computation or Access?** | **A**: Are tools cognitive extensions that transform computation? **B**: Do tools merely reduce retrieval costs for existing capacities? | Does tool use alter the *nature* of computation?                     | Test if tool-aided learning enables solutions to problems previously unsolvable without it (e.g., abstract math). Contrast with tool-free baselines.                      | **A**: Novel computational capacities emerge only with tools. **B**: Tools accelerate access to latent capacities; no new computation is added.                                    |
  | **Decoupling Axis: Unified or Multidimensional?** | **A**: Is decoupling from consequences achievable only via multiple mechanisms (e.g., inner environment + culture)? **B**: Is it a single continuum mediated by associative scaling? | Is decoupling unitary or mechanistically plural?                     | Measure decoupling in Skinnerian/Popperian tasks (e.g., delayed reward) and Gregorian tasks (e.g., symbolic planning). Correlate performance across domains.             | **A**: Low correlations; decoupling mechanisms are domain-specific. **B**: High correlations; decoupling is a general associative capacity.                                       |

  #### Notes on Disagreements  
  - **Row 1 (Disposition Table)**: Substantive. Turns on whether cognition is defined mechanistically (A) or functionally (B).  
  - **Row 3 (Gregorian Tool Removal)**: Test distinguishes internalization (retrieval cost) from scaffolding (competence loss) via granular performance metrics.  
  - **Row 4 (Verbal)**: Disagreement hinges on "computation" (A: process-altering; B: output-optimizing). Clarifying this term may resolve it.  

