prompt: |-
  I am a fourth-year graduate student in a systems neuroscience lab, and I have been thinking about an unspoken rule that governs how we treat claims made by other scientists. The rule is roughly this: when a member of our own lab reports a result -- say, that a particular cell type responds to a particular stimulus -- we take the report at face value for the purposes of designing follow-up experiments and building models, unless someone has a specific reason to suspect error or misconduct. We do not demand that the person reproduce the effect before we rely on it, and we treat their testimony as a default source of justification. By contrast, when a result is reported by a lab we do not know, or by a group working in a different tradition, we treat the report as merely a hypothesis until it has been independently replicated, ideally by us, and we are reluctant to build on it in grant applications or in our own theoretical work. The asymmetry is striking: the same kind of testimonial act -- a scientist reporting an experimental result -- is treated as epistemically self-sufficient in one case and as epistemically inert until corroborated in the other. My PI insists this is just ordinary scientific common sense, but a friend in the philosophy department says it is a textbook case of inconsistent epistemic norms, and I cannot tell whether she is right. I want you to reconstruct the theory of testimonial knowledge and justification that this practice presupposes. Does the in-group rule presuppose anti-reductionism, according to which testimony is a basic source of knowledge and the hearer is entitled to accept it absent defeaters? Does the out-group rule presuppose reductionism, according to which testimonial evidence must be backed by non-testimonial evidence such as independent replication? Or is the practice better explained by a single theory -- say, a reliabilist or assurance-based account -- that treats the two cases as differing only in the background evidence about the speaker's reliability? I would like you to distinguish what the practice strictly presupposes from what it merely fits well with, say whether the two halves of the practice are philosophically consistent, and identify which rival theories of testimony would license the same policy. Finally, tell me what would have to change in the lab's practice if it adopted a thoroughgoing reductionism, on the one hand, or a thoroughgoing anti-reductionism, on the other, and whether the current practice is underdetermined between those alternatives.

  Please answer in the form of a JSON object with the following fields: practice_summary, a concise statement of the practice and its two halves; presupposed_thesis, the theory of testimony the practice most plausibly presupposes, stated as a proposition; reductionist_anti_reductionist_or_other, one of reductionist, anti_reductionist, mixed, or underdetermined, with a one-sentence justification; strict_vs_fitting, an explanation of which elements the practice strictly presupposes and which it merely fits well with; ruled_out_rivals, an array of rival views that the practice, if taken at face value, cannot comfortably accommodate, each with a brief explanation; internal_consistency, an assessment of whether the in-group and out-group rules presuppose a single coherent view or whether they are in tension; underdetermination, an explanation of which parts of the practice are philosophically underdetermined and what additional assumptions would be needed to settle them; counterfactual_reductionism, what would have to change in the lab's practice if a thoroughgoing reductionism about testimony were adopted; counterfactual_anti_reductionism, what would have to change if a thoroughgoing anti-reductionism were adopted; verdict_on_asymmetry, a direct answer to whether the asymmetry is defensible or incoherent; and confidence, a number from 0 to 1 indicating your confidence in the overall reconstruction, with a one-sentence caveat. Do not cite or discuss specific books, articles, or authors; I am interested in the conceptual reconstruction, not the literature.
reasoning: |-
  Hmm, the user is a fourth-year graduate student in systems neuroscience, grappling with an unspoken rule in their lab about how scientific claims are treated differently based on whether they come from their own group or outsiders. They're questioning whether this asymmetry is justified or inconsistent. They want me to reconstruct the underlying theory of testimonial knowledge and justification that explains this practice.

  The user has provided a very detailed query and asks for a response in a specific JSON format with multiple fields. This requires careful conceptual analysis without referencing literature or authors.

  The core issue is epistemic asymmetry: in-group testimony (from the same lab) is accepted as reliable by default, while out-group testimony (from other labs) requires independent replication before being trusted. The PI calls this "scientific common sense" while a philosopher friend sees it as inconsistent epistemic norms.

  I need to reconstruct the testimonial knowledge theory behind this practice. Key theories involved are:
  - Reductionism: Testimony isn't a basic source of knowledge; it must be backed by other evidence.
  - Anti-reductionism: Testimony is a basic source of knowledge; we're entitled to trust it unless defeated.
  - Reliabilism/Assurance views: Focus on the speaker's reliability and context.

  For the practice_summary field, I'll concisely state: in-group reports are treated as justified without replication, while out-group reports require independent verification.

  For presupposed_thesis, the practice seems to fit best with a reliabilist or assurance-based account. The lab trusts its own members because of familiarity with their reliability, while distrusting outsiders due to uncertainty. This isn't strictly reductionist or anti-reductionist but contextual.

  For reductionist_anti_reductionist_or_other, I'll choose "mixed" with justification that the in-group side resembles anti-reductionism (accepting testimony by default) while the out-group side resembles reductionism (demanding corroboration).

  In strict_vs_fitting, I'll explain that the practice strictly presupposes contextual factors matter, but only fits with specific theories rather than committing to them fully.

  For ruled_out_rivals, I'll identify theories that can't accommodate the asymmetry well:
  - Global reductionism: Would require verification for in-group claims too
  - Global anti-reductionism: Would demand trusting out-group claims by default
  - Strong egalitarian views: Would reject the asymmetry entirely

  For internal_consistency, I'll note that while the practice can be made coherent through contextual reliability, it appears inconsistent at first glance due to different standards for similar acts.

  Underdetermination will cover how the practice doesn't specify why contextual reliability matters - whether it's about competence or sincerity - leaving philosophical questions open.

  For counterfactual scenarios:
  - Under thorough reductionism: The lab would need to verify even in-group claims with evidence
  - Under thorough anti-reductionism: The lab would have to accept out-group claims by default

  The verdict_on_asymmetry will acknowledge that the asymmetry is defensible pragmatically but philosophically problematic without justification of the reliability difference.

  I'll set confidence at 0.8 with the caveat that practices often have multiple motivations.

  This comprehensive approach should address all parts of the query while maintaining the required JSON structure and conceptual focus.
