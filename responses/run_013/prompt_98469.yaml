answer: |-
  The established term for the phenomenon you describe is **non-projectibility**.

  ### How Non-Projectibility Differs from Underdetermination and Grue-Style Cases  
  1. **Vs. Underdetermination**:  
     Underdetermination asserts that multiple rules fit the data, but it is neutral on *why* one rule is preferred. Non-projectibility identifies *specific epistemic flaws* that make a rule unsuitable for generalization, even when it fits existing data. Your contrived rules are non-projectible because they:  
     - Are disjunctive (e.g., "odd number of closed regions OR exactly one dot in the upper half but not both").  
     - Rely on arbitrary thresholds (e.g., "upper half") or ad hoc conditions.  
     - Lack unity (e.g., bolting unrelated geometric properties).  
     Underdetermination alone cannot explain why these features make the rule "worse."  

  2. **Vs. Grue-Style Predicates**:  
     Grue (green before time *t*, blue after) is a *projectible* predicate under a different description, and its rivalry with "green" hinges on symmetry in simplicity and entrenchment. Non-projectible rules, by contrast, are **objectively inferior for induction** due to:  
     - **Complexity**: They are longer, less elegant, or require more computational resources to state (e.g., your disjunctive rule vs. simple containment).  
     - **Fragility**: They break on small perturbations (e.g., a convex shape with your "wrong" side count would falsify your rule).  
     - **Lack of explanatory coherence**: They fail to align with background knowledge (e.g., convexity is a fundamental geometric property; side-count rules are derivative).  

  ### Defining Non-Projectibility  
  A rule is **non-projectible** if it fits all observed instances but:  
  - **(a)** Is syntactically complex (e.g., disjunctive, highly parameterized, or with unmotivated constants).  
  - **(b)** Lacks robustness (fails on intuitively valid new instances).  
  - **(c)** Does not reflect a unified, causal, or ontologically basic property in the domain.  

  **Boundary Cases**:  
  - A rule is **merely underdetermined** (not non-projectible) if alternatives are equally simple, robust, and coherent (e.g., "convex" vs. "no internal angles >180°" in polygons).  
  - A rule is **grue-like** only if rivals are symmetric in simplicity/entrenchment; non-projectible rules are asymmetric losers.  

  ### Literature and Basis  
  Non-projectibility originates from Goodman’s *Fact, Fiction, and Forecast* (1954) but extends beyond grue to rules that are inductively defective *by design*. Key references:  
  - Schurz (2021): Distinguishes "projectible" predicates (unified, lawlike) from "non-projectible" (gerrymandered, disjunctive).  
  - Quine (1969): Ties projectibility to "natural kinds" – categories with shared causal powers.  
  - In Bongard problems, the intended solution is typically projectible: it maximizes perceptual salience, geometric invariance, and minimal description length (Chater & Vitányi, 2003).  

  ### Why This Fits Your Cases  
  - Your "dot position" rule was disjunctive and invoked arbitrary spatial divisions ("upper half"), violating (a) and (c).  
  - Your "convexity" alternative relied on a contingent feature (side count) not inherent to convexity, violating (b) and (c).  
  The "felt wrongness" arises because projectible rules align with cognitive biases for simplicity, unity, and generalizability. Non-projectible rules are poor hypotheses, not just alternatives.
