prompt: |-
  I run research at a small shop that sells macro and political-risk outlooks, mostly to funds and a couple of insurers who want to know a few years ahead which countries are drifting toward serious trouble. For about a year we've been leaning on Turchin's structural-demographic stuff — cliodynamics, secular cycles, elite overproduction, the whole picture where popular immiseration, too many elites chasing too few positions, state fiscal strain, and elite infighting pile up over decades and then some spark sets it off. It's been great for storytelling and much less great when a client asks what we actually did to get to a call. So what I want from you is a decision procedure my analysts can run on a country, roughly quarterly, in about two days, using only public numbers, news, and their own reading: a procedure that ends in one of a small number of verdicts — something like 'structurally stable', 'pressure building', 'pre-crisis window open' — rather than a score out of a hundred. Give me the questions in the order they should be asked, what counts as a sufficient answer at each step, which steps are allowed to force a stop, and which steps are genuinely judgment calls that a person has to own rather than something the sheet decides. It has to survive contact with a client who has no background in any of this, and with our head of research, who signs off and will absolutely ask why step four isn't just vibes.

  Two things I keep going back and forth on and I'd like you to actually take a position on. First, the theory tells you a society is getting brittle but is famously silent on what lights the match, so how do we handle triggers without pretending we can forecast them — is there a defensible way to keep 'pressure' and 'spark' seperate inside a checklist, or does that just relocate all the real work into an unmarked judgment call? Second, my colleague Priya thinks the honest move is to refuse the quantification altogether, because a scoring sheet turns a contested model into something that looks like a thermometer. If she's right, say so plainly instead of handing me a tidy-looking checklist; I'd rather hear it now than after we've sold three more quarters of outlooks off the back of it. And be straight with me about what this thing can't do: where it will misfire, which of the four drivers it handles worst, and what would have to happen for us to throw it out.

  Then run the procedure end to end on two cases so I can see whether it earns its keep. Case A: bottom-half real wages flat for fifteen years while GDP grew steadily, the number of law and journalism graduates has roughly tripled with no new jobs for them, debt service now eats about a third of state revenue, both major parties have split since 2019, and there have been three large street protests — and yet nothing has actually broken, and it's been like this for eight years. Case B: incomes rising, state finances fine, no visible elite split, but three weeks ago the government postponed elections indefinitely and a mineral-rich region has started talking about autonomy. My gut says B is the one to worry about this year; I suspect your procedure will tell me B is structurally fine and that what I'm staring at is exactly the spark it was never built to see. Show me your work on both, including whatever the procedure forces you to say about A that I won't like, and mark the places where an analyst has to overrule the sheet.
reasoning: |-
  Okay, the user runs research at a small firm selling macro and political-risk outlooks, using Turchin's cliodynamics model. They need a practical decision procedure for analysts to assess country risk quarterly. The challenge is translating theoretical concepts into actionable steps without oversimplifying.

  The user mentioned two key concerns: handling triggers without forecasting them, and whether quantification is feasible. Priya's point about avoiding false precision is valid. The procedure must balance structure with necessary judgment calls.

  For the decision procedure, I'll design a phased approach with clear exit points. Phase 1 screens out low-risk cases quickly using hard data. Phase 2 assesses structural pressures through measurable indicators. Phase 3 evaluates triggers qualitatively. 

  I'll include explicit judgment flags where analysts must override the data. The verdicts will be categorical: Structurally Stable, Pressure Building, Pre-Crisis Window Open, or Crisis Active. This maintains transparency about uncertainty.

  For Case A (long-simmering tensions), the model will likely show Pressure Building but not trigger Pre-Crisis due to no recent catalyst. The user won't like this - it exposes the model's blind spot for sparks. For Case B (sudden authoritarian turn), it will show Structurally Stable despite obvious risks, proving the procedure can't predict exogenous shocks.

  The limitations section will clarify that elite infighting is hardest to quantify, fiscal data has lags, and exogenous shocks break the model. The procedure should be abandoned if it consistently misses crises in countries without Turchin's preconditions.

  This approach gives clients clear reasoning while preserving intellectual honesty about uncertainties. The phased structure makes verification possible without claiming false precision.
answer: |-
  Here’s a decision procedure grounded in Turchin’s framework but designed for practical, quarterly assessments. It separates *structural pressure* from *triggers*, forces transparency on judgment calls, and avoids false quantification. Priya is partially right: **this isn’t a thermometer—it’s a structured diagnostic forcing function.** If misused as a "score," it will fail. The value is in forcing disciplined analysis, not outputting pseudo-precision.

  ---

  ### **The Decision Procedure: Phased Assessment**  
  *(2-day timeline, public data/news/analyst reading)*  

  **Phase 1: Screen for Exogenous Shock or Active Crisis**  
  *Time: 1-2 hours*  
  **Question:** *Is there an ongoing armed conflict, major natural disaster, sovereign default, or coup attempt in the last 90 days?*  
  - **Sufficient Answer:** Verified via Reuters/AP/BBC/Factiva + IMF/World Bank alerts.  
  - **Stop & Verdict:** If YES → **"Crisis Active"** (bypass other steps).  
  - **Judgment Call?** Minimal. Relies on consensus reporting.  

  **Phase 2: Check Structural Pressure Indicators**  
  *Time: 4-6 hours*  
  **Question Set:**  
  1. **Popular Immiseration:** *Are real median wages flat/falling for ≥5 years while GDP/capita grows?*  
     - *Data:* World Bank, OECD, national stats.  
     - **Threshold:** ≥3-year trend + Gini coefficient >40 (World Bank).  
  2. **Elite Overproduction:** *Has the # of advanced-degree holders (law/business/politics) grown >50% faster than elite positions (e.g., top govt/judicial/executive roles) over 10 years?*  
     - *Data:* UNESCO edu stats, LinkedIn/Forbes elite lists, govt payroll reports.  
     - **Threshold:** >1.5x growth differential + rising youth unemployment.  
  3. **State Fiscal Strain:** *Does debt service exceed 25% of revenue, or is tax revenue growth <2% while expenditures grow >4%?*  
     - *Data:* IMF Fiscal Monitor, national treasuries.  
     - **Threshold:** >25% debt/revenue OR 3-year fiscal divergence.  
  4. **Elite Cohesion:** *Have major parties/factions fractured or lost >20% of legislators to splinter groups since last election?*  
     - *Data:* ParlTrack, ACE Electoral Network, major news archives.  
     - **Threshold:** ≥2 significant splits in ruling coalition/opposition.  

  **Sufficient Answer:** 2+ indicators meet thresholds → Proceed to Phase 3. Else → **"Structurally Stable"** (stop).  
  **Judgment Call?** Moderate. Analysts must document data sources/gaps (e.g., estimating elite positions).  

  **Phase 3: Assess Trigger Readiness**  
  *Time: 8-12 hours*  
  **Question:** *Is there credible evidence of* **any** *of the following in the last quarter?*  
  - **Mobilization Catalyst:** Large protest (>50k people) met with state violence, OR opposition leader jailed.  
  - **Elite Defection:** Senior officials/military leaders publicly criticize regime OR resign.  
  - **Institutional Breakdown:** Courts/electoral bodies issue contradictory rulings on core functions.  
  - **External Shock:** Sanctions >$1B imposed OR commodity prices crash >30%.  
  *Data:* News archives, ACLED, UN/OAS reports, trading platforms (commodities).  
  **Sufficient Answer:** 1+ trigger with multiple credible reports.  
  - **Verdict if Trigger + Phase 2 Pressure:** **"Pre-Crisis Window Open"**  
  - **Verdict if No Trigger but Phase 2 Pressure:** **"Pressure Building"**  
  **Judgment Call?** **High.** Analysts must:  
    - Cite specific events/quotes (no "vibes").  
    - Flag if triggers are ambiguous (e.g., protests <50k).  
    - *Override Option:* Analyst can elevate to "Pre-Crisis" with weak trigger IF elite defection + mobilization coincide. Must write justification.  

  ---

  ### **Handling Priya’s Warning & Model Limits**  
  **Your Colleague is Right About This:** Turning this into a numeric score (e.g., "75/100 crisis risk") *is* dishonest. This procedure works only if:  
  - Clients understand verdicts as **diagnostic categories** (like a doctor’s "stage 2 cancer").  
  - Analysts document all thresholds/judgments in an appendix.  
  **Where It Misfires:**  
  1. **Triggers:** The procedure **cannot predict sparks**. It only checks if conditions exist for a spark to *ignite*.  
  2. **Elite Infighting:** Hardest to gauge with public data. Private elite disputes stay hidden until they erupt (e.g., sudden coup).  
  3. **Exogenous Shocks:** A pandemic/war can skip structural pressure (e.g., Case B).  
  4. **False Negatives:** Societies can endure pressure for decades (e.g., pre-2011 Syria).  
  **Throw It Out If:** It fails to flag >50% of cases where **all four Turchin drivers are present + a documented trigger occurs** within 12 months.  

  ---

  ### **Case Assessments**  
  **Case A: Long-Simmering Pressure**  
  - **Phase 1:** No active crisis → Proceed.  
  - **Phase 2:**  
    - Immiseration: ✔️ (15-yr wage stagnation + GDP growth)  
    - Elite Overproduction: ✔️ (3x graduates, no jobs)  
    - Fiscal Strain: ✔️ (33% debt/revenue)  
    - Elite Cohesion: ✔️ (both parties split) → **Pressure confirmed**  
  - **Phase 3:**  
    - Triggers: Protests occurred but **not in last 90 days**; no elite defection/institutional breakdown.  
    - Verdict: **"Pressure Building"**  
  **Why You Won’t Like This:** It flags risk but *doesn’t* elevate to "Pre-Crisis" without a recent catalyst. The model ignores "duration of pressure" – a known Turchin blind spot.  
  **Analyst Override?** Justifiable if protests were <90 days ago OR new leaks show elite defections. Otherwise, hold firm.  

  **Case B: Sudden Authoritarian Turn**  
  - **Phase 1:** No active crisis → Proceed.  
  - **Phase 2:**  
    - Immiseration: ❌ (incomes rising)  
    - Elite Overproduction: ❌ (no data)  
    - Fiscal Strain: ❌ (state finances "fine")  
    - Elite Cohesion: ❌ ("no visible split") → **"Structurally Stable"** (Stop)  
  **Why Your Gut is Right:** The procedure **misses entirely** because:  
    - Elite cohesion was misread (postponing elections *implies* hidden elite conflict).  
    - Regional separatism is a *trigger*, but Phase 3 isn’t reached without underlying pressure.  
  **Model Failure:** This is an **exogenous shock** (autocracy gamble) unrelated to Turchin’s drivers. The procedure is blind to "black swan" regime collapses.  
  **Analyst Override Critical:** Phase 2 cohesion assessment must include *sudden authoritarian moves* as elite fracture evidence. Override to "Pre-Crisis Window Open" citing election delay as elite breakdown.  

  ---

  ### **The Bottom Line**  
  This procedure forces analysts to:  
  1. **Verify structural pressure** with hard data,  
  2. **Demand evidence** for triggers,  
  3. **Document judgment calls** (especially elite cohesion),  
  4. **Avoid false positives** from chronic but non-critical instability.  
  **It earns its keep by making uncertainty explicit**, not by being "right." Sell it as a *structured audit* – not a crystal ball. When clients ask "what did you do?", show them the thresholds, the triggers checked, and the analyst’s signed justification for overrides. That’s defensible.
