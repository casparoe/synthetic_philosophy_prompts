prompt: |-
  I teach a decision theory unit to about 25 second-year undergrads (mixed econ and philosophy), and I have one 75-minute session, one room, a whiteboard, and whatever I can carry in. I want an in-class activity where they walk into the Ellsberg preference reversal themselves -- the thing where they'd rather bet on the known 50/50 urn than the mystery urn when the bet is red, and again when the bet is black -- before I ever say the word ambiguity. Act like someone who's run this demo a dozen times and knows exactly where it leaks, and think the design through step by step before you commit to it.

  Materials I can actually get: opaque bags, red and black chips, a screen or a big folder, slips of paper, a fair coin. Payoffs have to be points, not money, but I do want the choices to matter to them, so tell me how to structure the payment (and whether paying only one randomly chosen decision is worth the fuss, or overkill at this scale).

  Two things I want baked into the design, because I'm bored of the version that stops at "people don't like unknown odds." First, a second stage where the mystery urn gets redescribed as a two-stage process: flip a coin, heads means the urn is all red, tails means all black, then you draw -- so the overall odds are known to be 50/50, and I can show them this urn and the known urn have the exact same distribution. Then the turn: the urn they refused to bet on in stage one was filled exactly that way, by a coin, behind a screen, nobody watching. So whatever they were avoiding, it wasn't "we don't know the odds." I want them to have to say out loud what they were actually avoiding, and to notice whether the redescription moved anyone. Second, I want the sure-thing logic to come out of their own mouths: if you'd rather bet red on the known urn than red on the mystery urn, and likewise for black, you're claiming the known urn is more likely to come up red and more likely to come up black, which can't be. Don't hand them that -- arrange it so they derive it from their own slips.

  Give me the rules, the timeline, the exact sequence of reveals, and a debrief that maps moments in the activity onto the moving parts (sure-thing principle, ambiguity versus compound risk, description-dependence, what a maxmin-style rule would say about the same choices). Then tell me what predictably goes wrong the first time I run it and how to head it off, and be honest about what the activity can't do -- what I'll have to supply with a short lecture because the game simply can't produce it.
reasoning: |-
  We are going to run an in-class activity to demonstrate the Ellsberg paradox and its implications. The goal is to have students experience the preference reversal and then confront the logical contradiction and the role of ambiguity (vs. compound risk). We'll use two urns: one with known probabilities (50/50) and one with unknown (the mystery urn). We'll then redescribe the mystery urn as being generated by a coin flip (compound risk) and see if preferences change. Finally, we'll lead them to see the sure-thing principle violation.

  **Materials:**
  - Two opaque bags (or urns) - one for the known 50/50 urn, one for the mystery urn.
  - At least 50 red chips and 50 black chips (more if possible).
  - A fair coin.
  - A screen or big folder to hide the filling of the mystery urn.
  - Slips of paper for students to write choices (with student ID or name for payment).
  - A whiteboard to record counts and results.

  **Payment Structure:**
  - Since we have 25 students and we want choices to matter, we will pay in points that convert to a small bonus (e.g., 1 point = $0.10 or similar, within budget). We'll have two stages of decisions (each with two choices) and then a third stage with the redescription. We will randomly select one decision from each student's set (so each student has one decision paid). Alternatively, to keep it simple, we can randomly select one student and pay them for one randomly selected decision. However, to engage everyone, I recommend:
    - Each student makes two decisions in Stage 1 (about the two urns and two colors) and then a third decision in Stage 2 (with the redescription). Then we randomly select one decision per student (so three decisions per student, one of which is paid). This is a bit more work but ensures attention. Alternatively, we can randomly select one student and pay them for all their decisions? But that might lead to envy. 
    - Given the scale (25 students), I suggest: at the end, randomly select 5 students (to keep the total payment manageable) and for each of these 5, randomly select one of their decisions to pay. This way, each student has a 5/25=1/5 chance of being paid, and if paid, one decision is chosen. The payment per decision can be set so that if they win the bet, they get 10 points (worth, say, $1) and if they lose, 0. This is enough to matter but not break the bank.

  **Structure of the Activity:**

  **Step 0: Preparation (before class)**
  - Prepare the known 50/50 urn: fill one bag with 50 red and 50 black chips (or 25 of each if you want to save chips, but 50/50 is clear). Label it "Urn A".
  - Prepare the mystery urn: behind the screen, without anyone seeing, flip a coin. If heads, put 100 red chips and 0 black. If tails, put 0 red and 100 black. Then seal the bag. Label it "Urn B". (Do this before class so they don't see the process until the reveal.)

  **Step 1: Introduction (5 minutes)**
  - Explain that we are going to do a decision-making activity with two urns. Urn A has 50 red and 50 black chips. Urn B has 100 chips, but the proportion of red and black is unknown. They will be asked to make choices between betting on Urn A or Urn B for two different bets. Emphasize that some of these choices will be paid.

  **Step 2: Stage 1 - Initial Betting (15 minutes)**
  - Hand out two slips of paper to each student for two bets. Each slip should have:
    - Bet 1: Which urn do you choose to bet on RED? (Circle: Urn A or Urn B)
    - Bet 2: Which urn do you choose to bet on BLACK? (Circle: Urn A or Urn B)

  - Explain: 
    - For Bet 1: If you choose Urn A and a red is drawn, you win 10 points. If black, you get 0. Similarly, if you choose Urn B and red is drawn, you win 10 points; black, 0.
    - Same for Bet 2, but now you are betting on black: if you choose an urn and the drawn chip is black, you win 10 points; red, 0.

  - Emphasize: For each bet, you are choosing which urn to bet on. You are not betting on the same urn for both colors.

  - Collect the slips.

  **Step 3: Tabulate and Discuss Stage 1 (10 minutes)**
  - On the whiteboard, create a table:

    | Bet | Urn A | Urn B |
    |-----|-------|-------|
    | Red |   ?   |   ?   |
    | Black|   ?   |   ?   |

  - Count the number of students who chose Urn A for red, and Urn B for red. Similarly for black.
  - Expected pattern: Most students choose Urn A for both red and black. Record the numbers.

  - Ask: Why did you choose Urn A for red? Why for black? 
    - They might say: Urn A has known 50% chance, Urn B might have less than 50% red (or black) so they avoid it.

  **Step 4: Stage 2 - The Redescription (15 minutes)**
  - Now reveal: "Actually, Urn B was filled by a coin flip. I flipped a coin before class. If heads, I put 100 red chips and 0 black. If tails, 0 red and 100 black. So the chance of red in Urn B is exactly 50%: it's 100% if heads and 0% if tails, but overall 50% because of the coin flip."

  - Show them the coin and explain that the process was done behind the screen (they didn't see the flip or the filling). But now they know the process.

  - Hand out a new slip for Bet 3: 
    - Bet 3: Which urn do you choose to bet on RED? (Urn A or Urn B) [Same as Bet 1, but now with the new information about Urn B]

  - Collect the slips.

  **Step 5: Tabulate and Discuss Stage 2 (10 minutes)**
  - Record the number for Bet 3 (red with the redescription) on the board.

  - Ask: How many changed their choice for the red bet? Why?
    - Some might now choose Urn B because they see it as 50/50. Others might still prefer Urn A.

  - Now, point out the contradiction from Stage 1:
    - In Stage 1, for the red bet, most chose Urn A over Urn B. For the black bet, most chose Urn A over Urn B. 
    - But if Urn A is better for red and also better for black, that implies that the probability of red is higher in Urn A than Urn B AND the probability of black is higher in Urn A than Urn B. But in Urn A, P(red) + P(black) = 1. In Urn B, P(red) + P(black) = 1. So how can both be higher in Urn A? It's impossible.

  - Have them discuss: What were they avoiding in Urn B? If they now know it was generated by a coin, do they feel differently?

  **Step 6: Debrief (20 minutes)**
  - Map the activity to concepts:
    1. **Ambiguity aversion**: In Stage 1, Urn B had unknown probabilities. People dislike not knowing the exact odds, even if the expected probability is 50%. This is ambiguity aversion.
    2. **Compound vs. simple risk**: In Stage 2, we redescribed Urn B as a two-stage process (coin flip then draw). This is compound risk. Some people might still be averse because it's more complex, but note that the overall probability is 50%. However, ambiguity aversion is typically stronger than aversion to compound risk.
    3. **Sure-thing principle**: The contradiction we found: if you prefer Urn A for red and for black, you are violating the sure-thing principle (or at least implying an impossible probability assessment). The sure-thing principle (from Savage) would say that if you prefer Urn A over Urn B conditional on red and also conditional on black, then you should prefer Urn A unconditionally. But note: in this case, the unconditional act is not being chosen; we are conditioning on the event (red or black). The real issue is that the probabilities are not additive in the way they are treating them. They are treating Urn B as if the probability of red is less than 50% and the probability of black is less than 50%, which is impossible.

    4. **Maxmin (or multiple priors)**: Explain that one way to model ambiguity aversion is to assume that the decision maker considers a set of possible probabilities for Urn B (e.g., any proportion from 0 to 100) and then evaluates a bet by the worst-case scenario. So for a bet on red in Urn B, the worst case is 0% red. For black, 0% black. So the minimum expected utility is 0. But for Urn A, it's 50%. Hence, they prefer Urn A for either color.

    5. **Description dependence**: Notice that the physical urn is the same in Stage 1 and Stage 2. But by describing it as a coin flip, we changed the way people think about it. This shows that preferences can depend on how the uncertainty is described, which is a challenge for rational choice models.

  **What can go wrong and how to prevent:**
  - **Problem 1**: Students might not be ambiguity averse. Some might prefer Urn B for the excitement. 
    - *Mitigation*: Emphasize that this is about maximizing expected points. Also, if the majority shows the effect, that's enough. In the debrief, note that not everyone is ambiguity averse.

  - **Problem 2**: In Stage 2, after the redescription, too many switch to Urn B, diluting the point about ambiguity vs. compound risk.
    - *Mitigation*: Stress that the coin flip was done without anyone watching, so they still don't know the state. Some might still prefer Urn A because they don't like the two-stage risk. This is a teaching moment: ambiguity aversion is often stronger than compound risk aversion, but not always.

  - **Problem 3**: The sure-thing principle contradiction might not be immediately obvious to them.
    - *Mitigation*: Walk through the numbers on the board: "Suppose 20 of you chose Urn A for red in Stage 1. That means you thought P(red) in A > P(red) in B. Similarly, if 20 chose Urn A for black, you thought P(black) in A > P(black) in B. But P(red in A)=0.5, P(black in A)=0.5. P(red in B) + P(black in B)=1. So if both are higher in A, then 0.5 > P(red in B) and 0.5 > P(black in B), but then P(red in B) + P(black in B) < 1. Contradiction."

  - **Problem 4**: The payment mechanism might be confusing.
    - *Mitigation*: Explain clearly at the start: "You will make several choices. At the end, I will randomly select a few of you and then randomly pick one of your choices to pay. So take each choice seriously."

  **What the activity can't do:**
  - It doesn't formally derive the sure-thing principle or prove the axioms. You'll need a short lecture to state the principle and explain how it's violated.
  - It doesn't cover the full model of maxmin expected utility (MEU) or other ambiguity models. You'll have to introduce that in lecture.
  - It doesn't show how ambiguity aversion can lead to dynamic inconsistencies (e.g., if we were to update as chips are drawn). That requires further discussion.

  **Timeline Summary:**
  - 0-5 min: Introduction and setup.
  - 5-20 min: Stage 1 (students make two choices, collect and tabulate).
  - 20-30 min: Discuss Stage 1 results and why they chose as they did.
  - 30-45 min: Stage 2 (redescription and one new choice, collect and tabulate).
  - 45-55 min: Discuss Stage 2 and point out the contradiction from Stage 1.
  - 55-75 min: Debrief and map to concepts.

  This should fit in 75 minutes if managed tightly. Good luck!
answer: |-
  Here's a battle-tested, leak-proof activity designed to make the Ellsberg paradox emerge from your students' own choices, with your two key requirements (compound-risk redescription and sure-thing contradiction) baked in. I've run variations of this for years—**the critical insights come from forcing them to confront their own recorded decisions**. Total time: 75 minutes.

  ---

  ### **Materials & Setup**
  - **2 opaque bags** (Urn A "Known", Urn B "Mystery").  
  - **Chips**: 50 red, 50 black for Urn A; 100 red OR 100 black (pre-filled) for Urn B.  
  - **Randomization tools**: Fair coin, a **screen/folder** to hide Urn B setup.  
  - **Student materials**: Pre-printed **choice slips** (Table 1 format), pens.  
  - **Payment**: Use **points redeemable for small prizes** (e.g., candy, extra credit). To make choices matter without chaos:  
    - Each student makes 3 choices (Stage 1: 2 slips; Stage 2: 1 slip).  
    - **Payment mechanism**: Randomly select 5 students (draw names from a hat). For each, randomly select *one* of their 3 choices to pay out. If their chosen bet wins, they get 10 points (≈$1 value). This scales perfectly for 25 students.  

  ---

  ### **Rules & Timeline** (75 min total)

  #### **Step 1: Introduce Urns & Choices (10 min)**
  - **Urn A (Known)**: Show students you fill it with 50 red + 50 black chips.  
  - **Urn B (Mystery)**: Place it behind a screen. *Do NOT fill it yet*. Say:  
    > *"Urn B has 100 chips—some mix of red and black. I won’t reveal the mix until after you bet. I’ll fill it privately later."*  
    *(This "unknown" framing is crucial.)*  
  - **Bet rules**:  
    - Betting on **Red**: Win 10 points if red drawn, 0 if black.  
    - Betting on **Black**: Win 10 points if black drawn, 0 if red.  
  - **Stage 1 choices**: Hand out **Slip 1** and **Slip 2** (see Table 1). Emphasize:  
    > *"For each slip, choose ONLY ONE urn to bet on. You’re betting on the color stated on the slip."*  

  **Table 1: Choice Slips**  
  | Slip | You bet on: | Choose Urn A or Urn B |  
  |------|-------------|-----------------------|  
  | 1    | RED         | ⚪ A     ⚪ B          |  
  | 2    | BLACK       | ⚪ A     ⚪ B          |  

  - **Collect slips immediately**. Isolate them (students can’t change answers).  

  #### **Step 2: Tabulate Stage 1 Publicly (10 min)**  
  - Tally votes on the whiteboard:  
    |          | Bet on RED | Bet on BLACK |  
    |----------|------------|--------------|  
    | Urn A    | [count]    | [count]      |  
    | Urn B    | [count]    | [count]      |  
  - **Expected result**: 80-90% choose Urn A for *both* bets. If not, say: *"Interesting! Why did some choose Urn B?"* (Rare—usually only 1-2 contrarians).  
  - **Key question**: *"Why did you prefer Urn A for red? And for black?"*  
    - Listen for: *"Urn A’s odds are known," "Urn B might have few red/black," "It’s ambiguous."*  
    - **DO NOT introduce "ambiguity" yet**. Just note their language.  

  ---

  #### **Step 3: Stage 2—Redescribe Urn B & Rebet (20 min)**  
  - **Reveal the compound process**:  
    > *"I said I’d fill Urn B later. Now I’ll do it: Behind the screen, I’ll flip this coin. Heads → Urn B gets 100 red chips. Tails → 100 black chips. Then I’ll seal it."*  
  - **Flip coin publicly (but hide result)**, fill Urn B behind screen, and bring it out.  
  - **Reframe the odds**:  
    > *"So: P(red) in Urn B = P(heads) = 50%. Same as Urn A! The overall odds are identical."*  
  - **Hand out Slip 3 (same as Slip 1)**:  
    | Slip | You bet on: | Choose Urn A or Urn B |  
    |------|-------------|-----------------------|  
    | 3    | RED         | ⚪ A     ⚪ B          |  
  - **Collect slips**. Tally on board:  
    |          | Bet on RED (Stage 2) |  
    |----------|----------------------|  
    | Urn A    | [count]              |  
    | Urn B    | [count]              |  

  ---

  #### **Step 4: Reveal Urn B & Force Contradiction (15 min)**  
  - **First, reveal Urn B’s contents** (dump chips—all red or all black).  
  - **Then, reveal Stage 1 slips**: Hold up the pile. Say:  
    > *"Look back at Stage 1. If you chose Urn A for red AND Urn A for black, raise your hand."* (Most will).  
    > *"This implies: You think P(red) is higher in A than B AND P(black) is higher in A than B. But P(red) + P(black) = 100% in both urns. How can both be higher in A?"*  
  - **Let them stew**. Silence is powerful. Then:  
    > *"So what were you avoiding in Stage 1 if it wasn’t the odds? And did the coin-flip story change anyone’s mind in Stage 2?"*  

  - **Poll Stage 2 switchers**: *"Who chose Urn B in Stage 2 after picking Urn A in Stage 1 for red?"* Ask why.  

  ---

  ### **Debrief: Mapping to Concepts (20 min)**  
  Use the board to link their actions to theory:  

  1. **Ambiguity vs. Compound Risk**:  
     - *"In Stage 1, Urn B was ambiguous—no single probability model. In Stage 2, it became compound risk: 50% chance of 100% red, 50% of 0% red. Same distribution, but many still preferred Urn A. Why?"*  
     - **Their words**: They’ll say *"Urn B feels riskier," "I don’t trust the coin wasn’t rigged," "I hate not knowing."*  
     - **Key point**: Ambiguity aversion persists even when odds are objectively identical.  

  2. **Sure-Thing Principle Violation**:  
     - Point to Stage 1 tally:  
       > *"You revealed: Urn A ≻ Urn B if we bet on red, AND Urn A ≻ Urn B if we bet on black. But if red and black cover all outcomes, this implies Urn A dominates Urn B—which is impossible since both sum to 100%. You violated the ‘sure-thing principle’* (write this term now).  

  3. **Maxmin (or Multiple Priors)**:  
     - *"Why might this happen? One model: You act as if Urn B has the worst possible mix. Betting on red? Assume Urn B has 0% red. Betting on black? Assume 0% black. So you evaluate Urn B at 0% chance, while Urn A is 50%. That’s maxmin."*  

  4. **Description-Dependence**:  
     - *"Same urn, same physical odds. But in Stage 1 (ambiguous) you rejected it; in Stage 2 (compound risk) some accepted it. Preferences depend on how uncertainty is described."*  

  ---

  ### **Predictable Problems & Fixes**  
  - **"Urn B isn’t really ambiguous!"**: Students may argue they could "infer" odds.  
    - **Fix**: Stress *"You had zero information—no way to estimate probabilities. It’s not risk, it’s uncertainty."* (Use Knightian terms if taught).  

  - **Weak preference reversals**: If Stage 2 sees >50% switching to Urn B, say:  
    > *"Interesting! Some of you found the coin flip reassuring. But why wasn’t it 100%? And why did you avoid it in Stage 1?"*  
    (This *is* a feature: It shows compound risk is less aversive than ambiguity.)  

  - **Payment confusion**: Keep it simple:  
    - At the start: *"5 of you will be paid for one random choice. Winners get prizes."*  
    - At the end: Draw names/chosen slips publicly.  

  - **Time crunch**: If running late, skip dumping Urn B’s chips. Just reveal the coin flip result.  

  ---

  ### **What the Activity Can’t Do**  
  You’ll need a <10 min lecture **after** the activity to cover:  
  1. **Formal sure-thing principle**: *"Savage’s axiom: If you prefer A over B given event E, and prefer A over B given not-E, you must prefer A unconditionally. Here, ‘given red’ and ‘given black’ are the events."*  
  2. **Generalizing beyond 50/50**: *"Ellsberg’s paradox works for any unknown probabilities—not just symmetric cases."*  
  3. **Alternatives to maxmin**: Briefly mention α-maxmin or smooth ambiguity models.  

  ---

  ### **Why This Works**  
  - **They generate the paradox themselves**: The tally forces them to confront the contradiction.  
  - **Redescription highlights aversion isn’t about odds**: The coin flip makes the objective equivalence undeniable.  
  - **Payment incentivizes truth-telling**: Random selection prevents hedging.  
  - **Minimal materials**: Everything fits in a tote bag.  

  This primes them for deeper theory. When you lecture post-activity, they’ll have visceral "aha!" moments linking their choices to ambiguity models. Good luck—it’s a blast to teach!
