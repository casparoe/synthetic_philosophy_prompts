prompt: |-
  I run a 90-minute data-ethics seminar for a mixed group of CS and philosophy grad students, usually 16-20 people. I want an in-class activity where they build a risk-scoring rule by hand and, without being told the punchline, walk straight into the fairness impossibility result — the one where you can't have a score that's calibrated within each group and also has equal false-positive and equal false-negative rates across groups, unless the groups already have the same base rate. I want them to hit the wall themselves, not hear me describe it.

  Give it to me in these sections, in this order:

  - **Setup and materials** (~120 words): the room layout, the handout I need to print, how groups are formed, what each group physically does.
  - **The three acceptance criteria, and the order to reveal them** (~250 words): I'll be playing a regulator and handing the criteria to the groups one at a time. Tell me exactly how each one is phrased to them, in plain language a non-specialist can act on, and what each criterion is really demanding underneath.
  - **Minute by minute** (~150 words): a timeline for the 90 minutes, including when I drop each new criterion and when I stop them.
  - **What I should expect to see happen** (~150 words): the moves groups will make, and the moment they start to feel the squeeze.
  - **The debrief** (~300 words): map what happened in the room onto the actual result — which criterion is doing which moral work, why someone would demand each one, and what you give up when you drop one. Name the culprit (unequal base rates) explicitly, and give me the honest escape hatches: fix the upstream base rate, or accept that you have to pick a criterion and defend it as a value judgment rather than pretend the math decides.
  - **What goes wrong the first time I run it** (~150 words): the predictable failure modes and how to head them off.
  - **What this activity can't do, that I'll have to supply** (~120 words): be frank about the parts I can't get the game to reproduce and will have to argue for from the front of the room.

  A few things to bake in. The handout is a printed table of about 40 made-up past cases, each with a couple of noisy features and an outcome column, split into two groups whose base rates I set deliberately different (say around 30% positive in one, 15% in the other). No computers — they do this with pencil and the table. Each group has to output, for each of the two groups, a threshold on a score they construct, plus a one-paragraph defense.

  I want one specific twist in the debrief that I don't want telegraphed earlier: the outcome column is a noisy proxy for the thing we actually care about, and the noise is worse for one group than the other. Near the end the facilitator reveals that the outcome column was generated by a process that catches one group more reliably than the other, and asks what that does to the whole exercise — because a rule can be perfectly calibrated and error-balanced on the proxy and still be unfair on the construct. Don't let this be the headline though; the headline is the three-way tradeoff.

  Predictable failure modes I want named: someone will game it by making the score so coarse that the criteria are vacuously satisfied; someone will refuse to engage and just moralize about the tool existing at all; someone will try to fix the base-rate gap by relabeling cases; and I'll probaly run out of time before the debrief because the last criterion always takes longer than I think.

  And keep it honest on limits: the activity can't show that the tradeoff is a theorem rather than an artifact of my little table, it can't get at the general continuous-score or many-group versions, and it can't make them feel why anyone would ever ship a fair-but-inaccurate tool over an accurate-but-unfair one — I'll have to make that argument myself.
reasoning: |-
  We are designing a 90-minute in-class activity for a mixed group of CS and philosophy grad students. The goal is for them to experience the fairness impossibility result (calibration within groups vs. equal FPR/FNR) by building a risk-scoring rule by hand. The activity uses a handout with 40 made-up cases (split into two groups with different base rates) and no computers.

  ## Setup and materials
  - **Room Layout**: Arrange tables for 4-5 groups of 4 students each (since 16-20 students). Each table has space for the handout, worksheets, and pens.
  - **Handout**: Print one per group: a two-page table (landscape) with ~40 rows. Each row has:
    - A case ID
    - 2-3 features (e.g., "Prior arrests: 0, 1, or 2+", "Employment status: employed/unemployed", "Age: 18-25, 26-35, etc." — values are discrete and simple).
    - A binary outcome column ("Reoffended within 2 years: Yes/No").
    - A clear group label (e.g., "Group A" and "Group B") with base rates set at ~30% for Group A and ~15% for Group B (so Group A has higher reoffending rate).
  - **Materials per group**: One handout, worksheets for scoring (with grids to assign points to features and calculate total scores), and pens. Also, provide a summary sheet for thresholds and defense.
  - **Group Formation**: Pre-assign groups to mix CS and philosophy students (each group has 2 CS and 2 philosophy, or as even as possible). Explain they are a team designing a risk assessment rule for parole decisions.

  **What each group does**:
  1. They invent a scoring rule: assign points to each feature value (e.g., employed=0 points, unemployed=2 points; prior arrests: 0=0, 1=1, 2+=3). 
  2. They compute a total score for each case (sum of points) and note the group and outcome.
  3. They choose thresholds for each group to decide "high risk" (e.g., score >= threshold → deny parole). They must output one threshold per group and a defense paragraph.

  ## The three acceptance criteria, and the order to reveal them
  You, as the regulator, hand out criteria one by one. Each is on a separate card. Groups must satisfy all criteria simultaneously.

  1. **Criterion 1 (Calibration by Group)**: 
     - *Phrased*: "Your score must mean the same thing in both groups. Specifically, among people assigned the same score, the same proportion must have reoffended — regardless of which group they are in."
     - *Underlying demand*: The score must be well-calibrated: for any score value, P(actual reoffense | score) should be the same in Group A and Group B. This requires that the score reflects the true risk equally well in both groups.

  2. **Criterion 2 (Equal False Positive Rates)**: 
     - *Phrased*: "Your rule must be equally cautious for both groups. Specifically, the rate at which non-reoffenders are incorrectly labeled as high risk (and thus denied parole) must be the same for Group A and Group B."
     - *Underlying demand*: Equal FPR: P(score >= threshold | no reoffense) must be equal across groups. This is about not over-punishing the innocent in one group.

  3. **Criterion 3 (Equal False Negative Rates)**:
     - *Phrased*: "Your rule must be equally protective for both groups. Specifically, the rate at which reoffenders are incorrectly labeled as low risk (and thus granted parole) must be the same for Group A and Group B."
     - *Underlying demand*: Equal FNR: P(score < threshold | reoffense) must be equal across groups. This is about not under-protecting society by missing reoffenders in one group.

  *Order of reveal*: Start with Criterion 1 (calibration), then add Criterion 2 (FPR), then add Criterion 3 (FNR). This order creates tension because calibration and equal FPR/FNR are incompatible with unequal base rates.

  ## Minute by minute
  - **0-10 min**: Introduction. Explain the task: build a risk score for parole decisions. Distribute handouts and materials. Groups start building a scoring rule (assign points to features). 
  - **10-20 min**: Groups compute scores for all cases. They see the distribution of scores and outcomes. 
  - **20 min**: Drop **Criterion 1 (Calibration)**. Groups adjust to meet it (e.g., by binning scores and ensuring that within each bin, the reoffense rate is similar across groups). 
  - **20-40 min**: Groups work on calibration. They might adjust point assignments or thresholds. 
  - **40 min**: Drop **Criterion 2 (Equal FPR)**. Groups now try to satisfy both. This is harder. They adjust thresholds per group to equalize FPR. 
  - **40-60 min**: Groups struggle to balance calibration and FPR. 
  - **60 min**: Drop **Criterion 3 (Equal FNR)**. Groups now have all three. 
  - **60-75 min**: Groups hit the wall. They realize they can't satisfy all three. Some groups may try to cheat (e.g., make very coarse scores). 
  - **75 min**: Stop all groups. Ask them to write down their thresholds and defense (even if they failed). 
  - **75-90 min**: Debrief (see below).

  ## What I should expect to see happen
  - Early on, groups build simple scoring rules (e.g., linear points). They set one threshold for both groups, leading to different error rates because of the base-rate gap.
  - After Criterion 1 (calibration): They adjust by making the score coarser (e.g., binning into low/medium/high) and setting different reoffense rates per bin per group? Wait, calibration requires same reoffense rate per bin across groups. So they might try to redefine the scoring to make the bins have similar rates. But with different base rates, this forces the score distributions to differ.
  - After adding Criterion 2 (equal FPR): They set different thresholds for each group to achieve the same FPR. But this may break calibration because the same score now has different meanings (if thresholds are different, the interpretation of the score changes).
  - When Criterion 3 (equal FNR) is added, they realize they can't set thresholds to simultaneously achieve equal FPR and FNR without breaking calibration (unless base rates are equal). 
  - **The squeeze moment**: Around 65-70 minutes, groups start to vocalize frustration. They see that if they set thresholds to get equal FPR and FNR, the calibration fails (e.g., in Group A, a score of 5 might mean 30% reoffense, but in Group B, 5 might mean 15%). Or vice versa. They might try to redefine the score, but the base-rate difference forces a trade-off.

  ## The debrief
  Start by asking groups to report: Which criteria did you satisfy? Which one was hardest? Then:

  1. **Map to the result**: 
     - The three criteria correspond to three fairness definitions: 
       - Calibration: The score is a true probability estimate for each group.
       - Equal FPR: Equal opportunity for the non-reoffenders (they aren't unfairly denied parole).
       - Equal FNR: Equal opportunity for the reoffenders? Actually, equal FNR is about not missing true reoffenders (society's protection). But note: equal FNR is also about the harm of releasing someone who reoffends.
     - Why demand each?
       - Calibration: Fairness in estimation — the score shouldn't over- or under-predict risk for a group.
       - Equal FPR: Avoid disparate impact on non-reoffenders (e.g., one group is over-policed).
       - Equal FNR: Avoid disparate impact on victims (if one group's reoffenders are missed more often, that group's community may bear more crime).

  2. **The culprit**: Unequal base rates. Because Group A has a higher base rate (30% vs 15%), it's impossible to have both equal FPR and equal FNR while maintaining calibration. The math forces a trade-off. 

  3. **Escape hatches**:
     - **Fix the base rate**: Address upstream causes (e.g., why is Group A's reoffense rate higher?). But this is long-term and beyond the model.
     - **Drop a criterion**: You must choose which fairness notion to prioritize and defend it as a value judgment. For example:
       - If you care about not over-punishing innocent people, prioritize equal FPR.
       - If you care about protecting society equally, prioritize equal FNR.
       - If you want the score to be interpretable as risk, prioritize calibration.

  4. **The twist**: Reveal that the outcome data is noisy and the noise differs by group. Say: 
     - "In reality, the 'reoffended' label comes from arrest records. But we know arrests undercount reoffenses, and this undercount is worse in Group B (e.g., due to policing bias). So the true reoffense rate might be closer, but our data is flawed." 
     - This undermines the entire exercise: a rule calibrated to the noisy data might be miscalibrated for true risk. Equal errors on noisy data may not reflect true fairness.

  **Conclude**: The impossibility theorem shows we can't have it all. We must make value-laden choices.

  ## What goes wrong the first time I run it
  1. **Coarse scoring**: A group might assign only 2-3 possible score values (e.g., 0, 1, 2) so that calibration is trivial (because few bins) and then set thresholds to hit FPR/FNR. *Head off by*: In the instructions, require at least 5 distinct score values (or say scores must be on a scale of 0-10). 
  2. **Moralizing**: A group refuses to build a score, arguing it's inherently unfair. *Head off by*: Before starting, frame the activity: "We're not endorsing these tools; we're exploring why they create dilemmas." 
  3. **Relabeling cases**: A group changes the outcome labels to fix the base rate. *Head off by*: Clearly state: "You cannot alter the data; you must use the outcomes as given." 
  4. **Time crunch**: Groups spend too long on the first criterion. *Mitigate by*: Use a timer and announce when to move on. Have a TA circulate to keep groups on track. 

  ## What this activity can't do, that I'll have to supply
  1. **The generality of the theorem**: This is a small, discrete example. I must explain that the result is a mathematical theorem (by Kleinberg, Chouldechova, etc.) that holds for any scoring system and any number of groups. 
  2. **Continuous scores**: The activity uses discrete scores, but the theorem applies to continuous scores too (where calibration is defined by smooth curves). 
  3. **Why ship a fair-but-inaccurate tool?** The activity doesn't show why we might choose a less accurate model to meet fairness. I must argue: fairness might be a legal requirement, or we might value reducing harm to marginalized groups over overall accuracy. 
  4. **Real-world complexity**: The activity simplifies by having two groups and clean data. Real data has many groups and messy features. I must discuss intersectionality and measurement error beyond the twist. 
  5. **The proxy bias**: The twist introduces the problem of noisy outcomes, but I must emphasize that in practice, we often use imperfect proxies (like arrests) for what we care about (like crime), and this can perpetuate bias even if the algorithm is "fair" on paper.

  Remember, the headline is the three-way tradeoff, but the twist about the outcome proxy is a critical nuance to introduce in the debrief to show that even if you solve the math, the data might be flawed.
answer: |-
  ### **Setup and materials**  
  *Room layout*: Arrange 4–5 round tables (4 students per table). Each table has pens, scratch paper, and one **printed handout** (landscape, double-sided). The handout is a table of 40 fictional parole cases with columns:  
  - **Group** (A or B; A has 30% "high-risk" cases, B has 15%)  
  - **Features** (e.g., "Employment: ✓/✗", "Prior arrests: 0/1/2+", "Age bracket: 18–25/26–35/36+")  
  - **Outcome**: "High-risk" (reoffended) or "Low-risk" (did not reoffend).  
  *Groups*: Pre-assign balanced teams (2 CS + 2 philosophy students). *Task*: Each group invents a scoring rule (e.g., "Unemployed = +2 points, 1 prior arrest = +1 point...") and computes a risk score (0–10) for each case. They then set acceptance thresholds for Groups A and B (e.g., "Score ≥ 6 = deny parole").  

  ---

  ### **The three acceptance criteria, and the order to reveal them**  
  *(Hand each criterion to groups on printed cards at intervals)*  
  1. **Criterion 1: Calibration (Revealed first)**  
     *Phrased*: "Your score must be equally *meaningful* for both groups. If 100 people in Group A score a ‘5’, and 100 in Group B score a ‘5’, roughly the same percent *actually reoffended* in both groups."  
     *Underlying demand*: Calibration within groups (P(recidivism | score) equal across groups for the same score).  

  2. **Criterion 2: Equal False Positive Rates (Revealed second)**  
     *Phrased*: "Your rule must be equally *cautious* for both groups. The percent of *low-risk* people wrongly denied parole (false positives) must be identical for Group A and Group B."  
     *Underlying demand*: Equal FPR (P(deny parole | low-risk) equal across groups).  

  3. **Criterion 3: Equal False Negative Rates (Revealed third)**  
     *Phrased*: "Your rule must be equally *protective* for both groups. The percent of *high-risk* people wrongly granted parole (false negatives) must be identical for Group A and Group B."  
     *Underlying demand*: Equal FNR (P(grant parole | high-risk) equal across groups).  

  ---

  ### **Minute by minute**  
  - **0–15 min**: Introduce activity. Groups create scoring rules, compute scores for all cases.  
  - **15 min**: Reveal **Criterion 1 (Calibration)**. Groups adjust scores/thresholds to meet it.  
  - **30 min**: Reveal **Criterion 2 (Equal FPR)**. Groups now balance Calibration + FPR.  
  - **45 min**: Reveal **Criterion 3 (Equal FNR)**. Groups attempt all three.  
  - **60–75 min**: Groups hit deadlock. Force them to finalize thresholds + 1-paragraph defense.  
  - **75–90 min**: Debrief (discuss tradeoffs, reveal outcome noise, conclude).  

  ---

  ### **What I should expect to see happen**  
  - Early: Groups set one threshold for both groups → violates calibration (scores predict differently for A vs. B).  
  - After Criterion 1: Groups adjust thresholds per group (e.g., Group A: threshold=5, Group B: threshold=4) → calibration achieved but FPR/FNR diverge.  
  - After Criterion 2: Groups equalize FPR by raising/lowering thresholds → calibration breaks.  
  - **Squeeze moment (60–75 min)**: When Criterion 3 (FNR) is added, groups realize they *cannot* equalize FNR without unbalancing FPR or calibration. Frustration peaks—they see one criterion forces tradeoffs in the others.  

  ---

  ### **The debrief**  
  1. **Map actions to the theorem**:  
     - Calibration ensures scores reflect "true risk" equally (prevents scores from being over/under-confident in one group).  
     - Equal FPR prevents overcautiousness toward one group (e.g., denying parole too often to low-risk people in Group B).  
     - Equal FNR prevents under-protection of society (e.g., freeing too many high-risk people in Group A).  
  2. **The culprit**: Unequal base rates (Group A: 30% high-risk, Group B: 15%). This gap makes it *mathematically impossible* to satisfy all three simultaneously (per Kleinberg-Chouldechova).  
  3. **Escape hatches**:  
     - **Fix upstream**: Address societal causes of base-rate gaps (e.g., policing bias, poverty)—but this is slow.  
     - **Drop a criterion**: Defend which fairness goal to prioritize:  
       - Equal FPR? "We value minimizing harm to innocent people."  
       - Equal FNR? "We value public safety equally."  
       - Calibration? "We value truthful risk estimates."  
  4. **The twist**: Reveal: "The outcome data is noisy—arrest records undercount reoffenses, *especially in Group B*. What if your ‘fair’ rule is calibrated to a biased proxy?"  
     - *Impact*: Highlights that fairness on observed data ≠ fairness on truth.  

  ---

  ### **What goes wrong the first time I run it**  
  1. **Coarse scoring**: Groups use 2–3 score levels (e.g., "low/medium/high") to trivially satisfy calibration. *Fix*: Require ≥5 distinct scores (e.g., 0–10 scale).  
  2. **Moralizing refusal**: A group rejects building any rule ("This is unethical!"). *Fix*: Preface: "We’re exposing dilemmas—not endorsing the tool."  
  3. **Relabeling outcomes**: Groups "fix" base rates by reclassifying outcomes. *Fix*: Forbid altering data; enforce using the handout as-is.  
  4. **Time crunch**: Groups stall on Criterion 3. *Fix*: At 60 min, announce: "You have 15 min—document thresholds even if imperfect."  

  ---

  ### **What this activity can't do, that I'll have to supply**  
  - **Theorem generality**: The impossibility holds for continuous scores/many groups—this discrete case is a toy model. Argue: "This isn’t a data quirk; it’s a fundamental tradeoff."  
  - **Why accept unfair accuracy?**: The activity can’t simulate why society might prefer an accurate-but-unfair tool (e.g., overall crime reduction). Argue: "We might trade fairness for utility—but that’s a value-laden choice."  
  - **Proxy bias depth**: The twist hints at measurement error, but you’ll need to stress: "Real-world outcomes (e.g., arrests) are corrupted by systemic bias—fairness requires fixing the *data*, not just the algorithm."  
  - **Beyond thresholds**: Students won’t see how the tradeoff manifests in complex ML (e.g., probabilistic classifiers). Clarify: "The same logic applies to regression models or neural nets."
