  **MEMORANDUM**  
  To: Critical Care Triage Committee  
  From: [Your Name], Committee Member  
  Date: [Current Date]  
  Subject: Recommendation for Revised Ventilator Allocation Protocol  

  ### Background and Context  
  We are revising our pandemic ventilator allocation protocol amid two competing proposals:  
  1. **Current Draft**: A tripartite scoring system combining:  
     - **Life-years score** (maximising survival duration post-treatment).  
     - **Fair-innings adjustment** (modest priority to younger patients to address unequal life opportunities).  
     - **Reciprocity weight** (recognition for frontline staff accepting heightened risks).  
  2. **Rival Proposal**: A lottery among patients medically expected to survive to discharge, rejecting "discriminatory" criteria.  

  Dr A argues that Harsanyi’s aggregation theorem—applied via a veil of ignorance—compels maximising average expected life-years with equal weights. Dr B counters that Harsanyi permits weighted utilities and that risk-neutrality is an ethical choice, not a logical necessity. An internal veil-of-ignorance exercise revealed staff preference for prioritising the worst-off, which Dr A attributes to irrational risk-aversion.  

  ### Assessment of Key Arguments  
  **Harsanyi’s Theorem**:  
  - Dr A’s interpretation has merit but overreaches. Harsanyi’s theorem does show that impartial social rules under uncertainty require aggregating individual utilities. However, it does not mandate:  
    - **Equal weights**: The theorem allows differential weighting (e.g., for disadvantage).  
    - **Life-years as utility**: Utilities can incorporate factors beyond survival duration (e.g., fairness).  
    - **Risk-neutrality**: Assuming individuals behind the veil are risk-neutral is an ethical stance, not a theorem. Risk-aversion (e.g., prioritising the worst-off) remains rationally defensible.  
  - **Verdict**: Dr A’s argument is **partly sound** but conflates technical axioms with normative choices. The theorem supports aggregation, but not exclusively equal-weight life-year maximisation.  

  **Veil-of-Ignorance Exercise**:  
  - The exercise is **highly relevant as evidence of our collective values**. It reveals that impartial decision-makers in our trust prioritise mitigating severe disadvantage (e.g., shorter lived lives). This aligns with the fair-innings rationale. Dismissing this as "irrational" ignores that risk-aversion in life-or-death contexts is both rational and ethically valid.  

  ### Ethical and Practical Considerations  
  - **Lottery Proposal**: While non-discriminatory, it ignores morally relevant factors:  
    - It fails to address intergenerational equity (fair innings) or societal reciprocity.  
    - Random selection among survivors may exacerbate perceived injustices (e.g., a young essential worker losing to a retiree).  
  - **Current Draft**: Balances efficiency (life-years), equity (fair innings), and solidarity (reciprocity). The modest fair-innings boost aligns with our staff’s impartial preferences.  

  ### Recommendation  
  **Adopt the current draft protocol** with minor clarifications to weighting mechanisms and scheduled review:  
  - **Protocol Name**: **Modified Clinical Ethics Framework (MCEF)**.  
  - **Justification**:  
    - Incorporates pluralistic values (efficiency, equity, solidarity) missing in the lottery.  
    - Fair-innings adjustment addresses the worst-off priority revealed in our veil exercise.  
    - Harsanyi’s theorem supports utility aggregation but does not invalidate this approach.  
  - **Adjustments**: Specify that:  
    - Fair-innings weighting is capped (e.g., +20% max for youngest adults).  
    - Reciprocity applies only to active pandemic frontline roles (e.g., ICU staff, EMTs).  

  ### Implementation and Review  
  - **Implementation Deadline**: **10 days** (sufficient for final edits and briefings).  
  - **Review Trigger**: **First major pandemic surge post-implementation** (e.g., ≥80% ventilator occupancy for 14 days). This tests real-world impact.  

  ### Strongest Objection  
  A lottery avoids explicit discrimination, while the current protocol may disadvantage older patients or non-frontline workers despite clinical survivability, violating equal moral concern.  

