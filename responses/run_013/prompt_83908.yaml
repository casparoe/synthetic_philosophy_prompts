  ### No-Trade Theorem Classroom Activity  
  **Objective**: Students experience speculative trade unraveling under common prior, observable willingness to trade, and common knowledge of order flow.  

  ---

  #### **Rules & Materials**  
  **Asset**: A binary security paying **100 points** if state is **Heads** (H), **0** if **Tails** (T). Prior: P(H) = P(T) = 0.5.  
  **Signals**:  
  - If H: Signals {3,4,5,6} with P(6|H)=0.4, P(5|H)=0.3, P(4|H)=0.2, P(3|H)=0.1.  
  - If T: Signals {1,2,3,4} with P(1|T)=0.4, P(2|T)=0.3, P(3|T)=0.2, P(4|T)=0.1.  
  **Trading**: Each student submits one **bid** (max price to buy) or **ask** (min price to sell). Orders matched if bid ≥ ask at midpoint price. Unmatched orders discarded.  
  **Scoring**:  
  - Buyer pays `P`, receives `100` if H/`0` if T → Profit = `(100 - P)` if H, `-P` if T.  
  - Seller receives `P`, pays `100` if H/`0` if T → Profit = `(P - 100)` if H, `P` if T.  
  - No trade: 0 points.  
  **Materials**: Coin (state), signal generator (app/script), scorecards, public order book (projector).  

  ---

  #### **Timeline (90 Min)**  
  1. **Intro (10 min)**: Explain asset, signals, Bayes’ updates, and trading rules. Emphasize: *Common prior*, *no initial info asymmetry*.  
  2. **Round 1: Hidden Order Flow (15 min)**  
     - Draw state (H/T), generate + distribute private signals.  
     - Students submit bids/asks *privately* (no one sees others’ orders).  
     - Match trades, record outcomes (but hide order book).  
     - *State not revealed yet*.  
  3. **Round 2: Mutual Knowledge of Order Flow (15 min)**  
     - New state/signals. Submit orders privately.  
     - **Reveal full order book via handout** (everyone sees it, but *not* told others see it → mutual knowledge).  
     - Allow order revisions (2 min). Re-match trades.  
  4. **Round 3: Common Knowledge of Order Flow (15 min)**  
     - New state/signals. Submit orders.  
     - **Project order book + announce**: "Everyone sees this; everyone knows you all see it" → common knowledge.  
     - Allow revisions (2 min). Re-match.  
  5. **Control Round: Heterogeneous Risk Tolerance (15 min)**  
     - **No private signals**. Asset pays 50 points *for sure*.  
     - Assign types: Half "High Value" (value asset at 60), half "Low Value" (value at 40).  
     - Submit bids/asks (hidden order flow). Match trades.  
  6. **Reveal States + Scores (10 min)**: Announce H/T for Rounds 1–3. Students calculate profits.  
  7. **Debrief (10 min)**: Discuss outcomes and map to theorem.  

  ---

  #### **Debrief & Theorem Mapping**  
  | **Activity Moment**           | **Theorem Assumption**                          |  
  |-------------------------------|------------------------------------------------|  
  | Common prior (all rounds)     | Shared prior over states                       |  
  | Hidden order flow (Round 1)  | No observable willingness to trade → trade occurs on belief differences |  
  | Mutual knowledge (Round 2)   | Order flow visible, but not common knowledge → partial unraveling |  
  | Common knowledge (Round 3)   | Common knowledge of order flow → no speculative trade |  
  | Control round (risk sharing) | Trade persists with heterogeneous risk tolerance |  

  **Predictable Issues & Fixes**:  
  - **Problem**: Students in Round 3 may still trade (bounded rationality).  
    **Fix**: Highlight in debrief: Real-world traders don’t achieve infinite common knowledge.  
  - **Problem**: Poor Bayes’ updates from order flow.  
    **Fix**: Provide example pre-activity (e.g., "Low ask suggests seller’s low signal").  
  - **Problem**: Time crunch in revisions.  
    **Fix**: Use countdown timer; limit revision to 2 min.  

  **Limitation of Activity**:  
  The theorem assumes an **efficient equilibrium** where prices reflect all *existing* information. This activity starts from naive trading, not equilibrium. *You must clarify*: "In reality, markets are rarely in this state—trade occurs when new info arrives or beliefs aren’t common knowledge."  

  ---

  **Why This Works**:  
  - Round 1: Trade happens (hidden orders mask counterparty info).  
  - Round 2: Fewer trades (mutual knowledge triggers doubt; e.g., "Why is she selling at $30?").  
  - Round 3: Near-zero trade (common knowledge unravels speculation).  
  - Control: Trade holds (risk-sharing motive survives).  
  Students *feel* the theorem: Observable willingness to trade becomes evidence against trading.
