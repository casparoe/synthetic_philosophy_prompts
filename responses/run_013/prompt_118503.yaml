answer: |-
  ## Pantoum of the Shifting Stance

  *Why did you see me and not see me?*  
  The glass you shattered gleams like accusation.  
  Your eyes glaze over, distant, suddenly free.  
  The shard reflects my fractured expectation.  

  The glass you shattered gleams like accusation —  
  It was the tremor, not the will, they’d say.  
  The shard reflects my fractured expectation.  
  *Why did you see me and not see me?*  

  It was the tremor, not the will, they’d say.  
  A clinical detachment cools the air.  
  *Why did you see me and not see me?*  
  This careful distance feels like not being there.  

  A clinical detachment cools the air.  
  *Let me help you to the chair,* I soothe.  
  This careful distance feels like not being there.  
  Is kindness now a kind of uncaring truth?  

  *Let me help you to the chair,* I soothe.  
  A necessary posture, calm and planned.  
  Is kindness now a kind of uncaring truth?  
  Your hand in mine feels like shifting sand.  

  A necessary posture, calm and planned —  
  The eyes glaze over, distant, suddenly free.  
  Your hand in mine feels like shifting sand.  
  *What is it to be? What is it to be?*  

  The eyes glaze over, distant, suddenly free.  
  *Why did you see me and not see me?*  
  *What is it to be? What is it to be?*  
  The glass you shattered gleams like accusation.  

  ---

  **Notes for You:**  
  The core repeated line is **"Why did you see me and not see me?"** Its iterations drive the shift: first as raw, participant-stance hurt ("gleams like accusation"); second as an echoing, analytical question within the objective framing ("they'd say"); third as a clinical observation stripped of direct address ("The eyes glaze over..."); finally, returning almost obsessively, blurring the stances ("gleams like accusation"). The exemption occurs at "Your eyes glaze over, distant, *suddenly free*" – the shift releasing the actor from the reactive web. I deliberately left unresolved whether the final return to "accusation" signifies the participant stance's inevitable resurgence or merely its haunting echo within the therapeutic frame. The closing question ("What is it to be?") holds both stances in tension without synthesis.
