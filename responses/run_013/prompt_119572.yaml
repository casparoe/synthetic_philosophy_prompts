prompt: |-
  ok so I've been chewing on this one for a while on my own and I want to run an evening session on it for four friends at my flat, none of them have done any philosophy, one's an engineer, and I've got a whiteboard and about fifty minutes.

  the thing is this: normally we think you can only cooperate with someone if you can actually affect them, or send them a message, or at least meet them. but theres a way of thinking about decisions where what you choose is evidence about what other people in the same kind of situation choose, even when nothing you ever do reaches them. so two people who can never meet, never signal, can't affect each other at all might still sort of cooperate, because me picking the friendly option is a sign that the other one picked it too. on a small scale thats just a curiosity. but if the world is genuinely big - trillions of galaxies, other civilisations out there, or even just loads of agents that reason the way I do - then there are an enormous number of those unreachable agents, and the payoffs from all of them add up. and the strange bit is that this can mean the biggest thing riding on a decision I make in my kitchen is what some beings I can never meet end up doing, while what they do is tied to what I do in the evidence sense and not in any physical sense. I think theres something there but I also think theres a way of stating it that makes it sound like obvious nonsense, and I cant yet tell which bits are doing the work.

  I want them to actually get it and not just nod along. so plan the session for me, don't just explain the idea at me. what has to be in place before the rest makes sense, what order the pieces have to go in and why each one waits on the one before, and which single example should carry the whole thing - and what that example needs to have and what it needs to not have (I was going to use two people in sealed rooms who both know the other is working it out the same way, but I'm not sure that one scales or that it doesnt smuggle in something). then the wrong turns they'll take: my guess is they'll say this is just magic, or that correlation isn't a real connection, or that it makes everything depend on everything so it says nothing, or they'll mix it up with predicting your own choice in advance. tell me the order those actually come up in and exactly where in the sequence I should cut each one off. also say what I should tell them I'm not going to get into at this level and why, and give me one question to ask at the end that tells me whether it landed or whether they just followed the story. and if I've definately got part of the idea itself muddled, say which part, because I'd rather fix my framing before I inflict it on them.
reasoning: |-
  We are going to design an interactive session that builds understanding step by step. The key idea is "acausal cooperation" or "updateless decision theory" (UDT) in a large universe. We need to avoid technical jargon and build intuition.

  Core idea: In a decision, your choice can be evidence about what other similar agents do, even if you cannot causally affect them. This evidence can make one choice better than another because the payoff might depend on the actions of many such agents.

  Plan for the session:

  1. **Start with a simple, relatable example to set the stage.**
     - We want a situation where two people make decisions in isolation but their payoffs depend on each other's actions. However, they cannot communicate or affect each other.

  2. **Introduce the concept of correlation without causation.**
     - Use a thought experiment to show that even without communication, if the agents are similar and know they are similar, they can reason that they are likely to do the same thing.

  3. **Scale it up to many agents.**
     - Show that when there are many such agents, the cumulative payoff from their actions can outweigh the immediate payoff.

  4. **Address the big universe scenario.**
     - Apply to the idea of many civilizations in the universe.

  5. **Anticipate and counter common objections.**
     - We will predict the wrong turns and address them at the right moments.

  We'll use a specific example that is simple and scalable.

  **Chosen Example: The Twin Prisoners Dilemma (with a twist)**

  *Setup:*
  - Two people, Alice and Bob, are put in separate rooms. They cannot communicate. They are told:
    - They each have two choices: Cooperate (C) or Defect (D).
    - They are both given the same instructions and are told that they are identical twins (or very similar in reasoning) and that they were both selected for being very rational and similar to each other.
    - The payoff for each depends on both choices:
      - If both choose C: both get 3 years in prison (moderate sentence).
      - If one chooses C and the other D: the cooperator gets 5 years (worst) and the defector gets 1 year (best).
      - If both choose D: both get 2 years (but note: worse than both cooperating? Wait, let's adjust to make it a true prisoner's dilemma).

  *Standard Prisoner's Dilemma payoffs (in terms of years in prison, so less is better):*
  - (C, C): (3, 3)
  - (C, D): (5, 1)
  - (D, C): (1, 5)
  - (D, D): (2, 2)

  But note: In the standard PD, defecting dominates. However, we want to create a situation where they might consider cooperating because of the similarity.

  *The twist:*
  We tell them: "You are both very similar and rational. You know that the other one is just like you and will reason the same way. Therefore, whatever you decide, you can be quite sure the other will decide the same."

  Now, the reasoning:
  - If I choose C, then because we are similar, the other is likely to choose C -> we get (3,3) -> I get 3 years.
  - If I choose D, then the other is likely to choose D -> we get (2,2) -> I get 2 years.

  So defecting gives me 2 years, which is better than 3. So I should defect.

  But wait: that doesn't lead to cooperation. We need to adjust the payoffs to make cooperation attractive when there is correlation.

  *Adjustment for the lesson:*
  We want to show that sometimes cooperation can be rational. So let's change the game to a different one: the Coordination game or the Stag Hunt? Or we can change the numbers.

  Alternatively, we can use the Prisoner's Dilemma but with an added global component.

  **Revised example for the session: The Twin Prisoners with a Global Impact**

  To scale, we introduce many pairs. But for the first step, we do one pair.

  *Step 1: The Twin Scenario (one pair)*
  We want to show that correlation doesn't change the dominance of defection in the PD. So we need a different game.

  I propose: **The Stag Hunt**

  Stag Hunt:
  - Two choices: Stag (S) or Hare (H).
  - If both choose S: both get 3 (best).
  - If one chooses S and the other H: the stag hunter gets 0 (worst) and the hare hunter gets 2.
  - If both choose H: both get 2.

  Now, if they are identical and know it:
  - If I choose S, then the other is likely to choose S -> I get 3.
  - If I choose H, then the other is likely to choose H -> I get 2.

  So choosing S gives 3, which is better than 2. So I choose S.

  This works! The correlation makes me confident that if I choose S, the other will too. So I choose S and get the best outcome.

  *Step 2: Scaling to many pairs*
  Now, imagine there are not just one pair, but a million pairs of twins, all in the same situation. Each pair is isolated. Now, we add a twist: the global impact.

  - For each pair that coordinates on Stag, they each get 3, and also, an additional 0.000001 points is added to a global pot that is divided equally among every agent (including themselves). But this is too small to matter.

  We need a different global impact.

  *Alternative: The Civilization Dilemma*
  We want to set up a situation where the payoff for an individual depends on the actions of many others who are similar but unreachable.

  Example: 
  - Each of a huge number of civilizations (or agents) must choose between two policies: 
     - Policy A: "Friendly" (e.g., invest in a sustainable universe)
     - Policy B: "Defect" (e.g., exploit resources for short-term gain)

  The payoffs for a civilization:
  - If most (say 99%) of the civilizations choose A, then the universe is sustainable and every civilization gets a huge payoff (say 1000 points).
  - But if more than 1% choose B, then the universe becomes unstable and everyone gets 0.

  Additionally, each civilization gets a small immediate benefit from choosing B (say 10 points) regardless of what others do.

  But note: if the universe is huge, each civilization is isolated and cannot affect others.

  *The dilemma:*
  - If I choose A, I forgo the 10 points. But if enough others choose A, we all get 1000. However, my individual action has no causal effect on others (because the universe is huge and they are beyond my light cone). So if I choose B, I get 10 points and it doesn't change the total because one B won't push it over 1%. So it seems I should choose B. But if everyone reasons that way, then everyone chooses B and we all get 0.

  But now, the correlation insight: 
  - I know that I am a typical civilization. If I choose A, that is evidence that other civilizations (being similar) are also choosing A. Therefore, if I choose A, it is likely that the total fraction of A is high enough and we all get 1000. If I choose B, it is evidence that others are choosing B, so the total fraction is low and we get 0. Therefore, by choosing A, I get 1000 (with high probability), and by choosing B, I get 10 (but with the high probability that we all get 0, so effectively 10 with low probability? Wait, let's model).

  Actually, the decision is made before knowing what others do. But the correlation means that my choice is a signal about the choices of others.

  We can formalize:
  - Let P be the fraction of civilizations that choose A.
  - I get: 
     - If P >= 0.99, then 1000 (if I chose A) or 1010 (if I chose B) [because 1000 plus the 10 from defecting?]
     - But wait, if we break it down:
        - If I choose A: I get 1000 if P>=0.99, and 0 otherwise.
        - If I choose B: I get 10 + (1000 if P>=0.99 and 0 otherwise).

  But note: if I choose B, then I am one of the B's, so P is the fraction of others? Let's define P as the fraction of all civilizations.

  If I choose A, then P = (number of A) / N.
  If I choose B, then P = (number of A) / N.

  But the condition for the big payoff is P>=0.99.

  Now, because the civilizations are identical and independent, the law of large numbers says that P will be almost exactly the same as the probability that any given civilization chooses A. But how do they decide? They all reason the same.

  Let q be the probability that a given civilization chooses A. Then for large N, P ≈ q.

  But each civilization is trying to decide q for themselves? No, they are deterministic and identical, so they all do the same thing.

  Therefore, they all choose A or all choose B.

  But then:
  - If all choose A: then P=1.0, so everyone gets 1000 (and they didn't get the 10, so 1000).
  - If all choose B: then P=0, so everyone gets 10 (from defecting) and no big payoff.

  But now, if they are rational and identical, they will both choose A? Because 1000>10.

  But what if one defects? They can't because they all do the same.

  Wait, that's too deterministic.

  The key is that they are not sure what they will do? Or they are making a decision in a way that is correlated.

  The insight of UDT is that you should not condition on your own action when considering the probability of others. Instead, you choose a strategy (a mapping from the type of situation to action) and then you consider that all similar agents use the same strategy. So the strategy that says "choose A" leads to all choosing A and getting 1000. The strategy that says "choose B" leads to all choosing B and getting 10. Therefore, the best strategy is to choose A.

  So the correlation comes from the fact that you are using the same decision procedure.

  **Session Plan:**

  Total time: 50 minutes.

  1. **Introduction (5 mins):**
     - Set up a simple decision problem with two people (Stag Hunt) to illustrate that similarity can lead to coordination without communication.
     - Use the twin example: "Imagine you and your identical twin are in a Stag Hunt. You both are very similar and know you will think the same. What do you do?"
     - Let them discuss in pairs for 1 minute. Then ask for answers. Guide to the conclusion: choose Stag because you expect the other to do the same.

  2. **Scaling to Many (10 mins):**
     - Now, imagine there are a million such pairs. Each pair is isolated. Each pair is playing the Stag Hunt independently. 
     - Question: Does the reasoning change? (No, each pair will choose Stag and get 3 each.)
     - Now, add a global component: "Suppose that for every pair that coordinates on Stag (both choose S), they get their 3, and also, a tiny amount of gold is added to a global pot that is shared by everyone. But the pot is divided by a million, so it's negligible. Does that change your decision?" (No, because the global effect is too small to matter.)

  3. **The Civilization Dilemma (15 mins):**
     - Now, present the big universe scenario: "Now, imagine that instead of pairs, we have trillions of civilizations across the universe. Each must choose between Policy A (friendly) and Policy B (defect)."
     - Payoffs:
        - If at least 99% choose A, then every civilization gets 1000 points (a sustainable universe).
        - Additionally, any civilization that chooses B gets an extra 10 points (immediate gain) regardless of what others do.
     - Stress: Each civilization is isolated (beyond light cones, no communication). So no causal influence.
     - Question: What should one civilization do?
     - Let them discuss in groups (3 mins). Then ask for answers.

  4. **The Correlation Insight (10 mins):**
     - Guide them: "Remember the twins? In the Stag Hunt, you chose Stag because you knew the twin would do the same. Here, you are a typical civilization. If you choose A, that is evidence that other civilizations (being similar) are also choosing A. Why? Because you are all using the same rational process. Therefore, if you choose A, it is likely that the 99% threshold is met and you get 1000. If you choose B, it is evidence that others are also choosing B, so the threshold is not met and you only get 10. So by choosing A, you get 1000, and by choosing B, you get 10. So you should choose A."
     - Emphasize: This is not causation. It's about being a sample from the same distribution.

  5. **Addressing Objections (5 mins):** Weave these in as they come up, but be prepared to address:
     - "This is magic!" -> No, it's about logical correlation. We are all running the same algorithm. (Use the twin example: if you are twins, you do the same thing because you are identical.)
     - "Correlation isn't a real connection." -> But in decision making, we have to use all the information we have. The fact that we are similar is information.
     - "It makes everything depend on everything." -> Only in situations where there are many copies of you. And it only applies when you know the others are using the same decision procedure.
     - "What if I predict my own choice?" -> We don't condition on our own choice in a way that breaks the correlation. We are deciding a policy: "If I were in this situation, I would do X", and then all similar agents do X.

  6. **What We're Not Covering (2 mins):** 
     - We are not getting into the details of decision theories (like UDT vs CDT vs EDT). 
     - We are not considering how to handle dissimilar agents or how to define "similarity". 
     - We are not discussing how to assign probabilities in the big universe.

  7. **Closing Question (3 mins):** 
     - Ask: "Suppose you are one of these civilizations. You are about to choose. But then you learn that due to a cosmic accident, 1% of the civilizations have already chosen B (so exactly 1% are B). Now, the threshold of 99% A is still possible if all the remaining choose A. What should you do now? Why?"
     - The correct UDT answer: You should still choose A because you are typical of the remaining civilizations? Actually, now the threshold is harder: we need 99% of the whole, but 1% is already B. So if the remaining are 99% of the total, then we need every remaining one to choose A to get 99% A. But if you choose A, then that is evidence that the remaining ones are also choosing A, so we get 1000. If you choose B, then we definitely don't meet the threshold and you get 10. So you choose A. But note: if you choose B, you get 10. If you choose A, you get 1000 if the others (like you) choose A, but 0 if they don't. But because you are typical, if you choose A, they do too. So you get 1000. So still A.
     - However, if they say: "Now my action doesn't matter because one more B won't hurt (since we are already at 1% B, and we can have up to 1% B) or will it?" Actually, if we have 1% B already, then the remaining 99% must all choose A to get the 99% A. So if any one of the remaining chooses B, then we are above 1% B and everyone gets 0. But note: if I choose B, then we are at 1%+epsilon B -> above 1% -> everyone gets 0. If I choose A, then we are at 1% B plus whatever the other remaining agents do. But if I choose A, then the other remaining agents (being like me) will also choose A -> so we get 99% A -> everyone gets 1000. So I choose A.
     - This reinforces the idea: the correlation holds even in the subpopulation.

  **Why the Twin Example Doesn't Smuggle in Communication:**
  In the twin example, we are not allowing communication. We are only allowing the knowledge that they are similar. The key is that the decision procedure is the same. This is not smuggling because in the big universe, we assume that the other civilizations are using a similar rational process.

  **What Might Be Muddled in Your Framing:**
  You said: "me picking the friendly option is a sign that the other one picked it too". This is a bit off. Actually, it's not that your picking causes the sign, but that your decision is part of a pattern that applies to all. The better way: if I decide to pick friendly, then I conclude that other similar agents also pick friendly, because they are using the same decision process. So it's not that my action is evidence about theirs in a temporal sense (they already decided?) but that the decision process outputs the same action for all.

  **Order of Objections and When to Cut Them Off:**
  1. **"This is magic"**: Likely after step 3 (Civilization Dilemma). Cut it off by referring to the twin example: "In the twin case, is it magic that they both do the same? No, because they are identical and think the same. Similarly, the civilizations are using the same rational process."

  2. **"Correlation isn't a real connection"**: This might come up in step 4. Counter: "But in decision making, we use correlations to form expectations. If I know that other civilizations are like me, then what I decide to do gives me information about what they decide. It's the same as if I flip a coin and know that they have a similar coin and will flip the same way."

  3. **"It makes everything depend on everything"**: After step 4. Counter: "No, only when there are many copies of the same decision process. And it only applies to the decisions that are made by the same algorithm."

  4. **"Mixing up with predicting your own choice"**: This might come when discussing the evidence. Be clear: "We are not predicting our own choice. We are choosing a policy that will be used by all similar agents. Then we evaluate the outcome of that policy."

  **Check for Understanding Question at the End:**
  Ask the closing question above about the 1% already defected. If they say:
  - "I should defect because one more won't hurt" -> they didn't get it (because if you defect, then others like you will also defect, so we don't meet the threshold).
  - "I should cooperate because then others will too" -> they got it.

  Alternatively, ask: "In the twin Stag Hunt, if you were told that your twin already chose Hare, what would you do?" (Then you choose Hare because you know you are too late for Stag and you get 2 instead of 0. But note: in the simultaneous case, we don't have that information. This is a different scenario.)

  But the civilization question with 1% defection is the key one.

  **Summary of Steps:**
  1. Twin Stag Hunt (5 mins)
  2. Scaling to many pairs (with negligible global effect) (10 mins)
  3. Civilization Dilemma (15 mins)
  4. Correlation insight (10 mins)
  5. Objections and closing question (10 mins)

  Adjust timing as needed.

  Good luck!
answer: |-
  ### Session Plan: "Cooperation Without Contact"  
  **Goal:** Help your friends grasp how isolated decisions can "cooperate" via shared reasoning patterns, even without causal influence, and why this matters in a vast universe.  
  **Time:** 50 minutes  
  **Tools:** Whiteboard, markers.  
  **Key Insight:** Your choice is evidence of what other similar agents choose because you share identical reasoning. In large groups, this evidence makes cooperation rational, as payoffs scale with collective action.  

  ---

  ### **Session Flow**  
  *(Timings are flexible; adapt based on engagement.)*  

  #### **1. Warm-Up: Decisions with Direct Influence (5 mins)**  
  **Why start here?** Establish intuition about cooperation when actions directly affect others. This sets a contrast for the core idea.  
  - **Example:** "Two friends, Alice and Bob, can each donate £0 or £10 to a shared fund. If both donate £10, each gets £15 back (net +£5). If one donates and the other doesn’t, the donor loses £10, and the freeloader gains £0. If neither donates, both get £0."  
    - **Draw on whiteboard:**  
      ```
      Alice \ Bob | Donate (£10) | Keep (£0)  
      ----------------------------------------  
      Donate (£10) | +£5, +£5   | -£10, £0  
      Keep (£0)    | £0, -£10    | £0, £0  
      ```  
  - **Ask:** "What should Alice do if she can talk to Bob? What if she can’t?"  
  - **Key Point:** With communication/influence, cooperation is easy. Without it, defection (keeping £0) feels safer—but we’ll challenge this.  

  #### **2. Introduce Isolation: The Twin Rooms Scenario (10 mins)**  
  **Why use this?** It’s simple, isolates causality, and primes the idea of shared reasoning. Avoids universe-scale complexity until later.  
  - **Present:** "Alice and Bob are in soundproof rooms. They’ve never met, can’t communicate, and won’t affect each other. But they know:  
    - They’re identical twins raised apart.  
    - They’ve been given the same instructions and are both hyper-rational.  
    - Payoffs: If both cooperate (donate), both get £5. If one defects (keeps £0), cooperator loses £10, defector gets £0. Both defect? Both get £0."  
  - **Ask:** "What should Alice do? Why?" *Let them debate.*  
    - *Common wrong turn:* "Defect! Bob might defect." → **Cut this off now.** Ask: "If Alice defects because she thinks Bob will, what does that imply about Bob’s reasoning? Remember, they’re identical."  
  - **Reveal the insight:** "Alice thinks: 'Whatever I choose, Bob will likely choose the same because we’re identical and rational. If I cooperate, he probably does too—so we both gain £5. If I defect, he probably does too—so we get £0. Cooperating is better!'"  
  - **Whiteboard:**  
    ```  
    My choice → Evidence for Bob’s choice → Outcome  
    Cooperate → Bob likely cooperates → We both gain £5  
    Defect → Bob likely defects → We both gain £0  
    ```  
  - **Key Point:** Correlation isn’t magic—it’s about shared traits. Alice’s choice isn’t causing Bob’s; it’s a clue about it.  

  #### **3. Scale Up: The Universe of Civilizations (15 mins)**  
  **Why now?** Twins establish correlation; scaling shows payoff impact. Avoid trivial examples (e.g., twins are too small).  
  - **Present:** "Now imagine trillions of alien civilizations. Each must choose:  
    - **Policy A (Cooperate):** Sacrifice 1 unit of energy to enable a universe-wide project.  
    - **Policy B (Defect):** Keep your energy, ignore the project.  
  - **Payoffs:**  
    - If ≥99% choose A, the project succeeds. Every civilization gets 1,000 units (net +999 for A-choosers, +1,000 for B-choosers).  
    - If <99% choose A, the project fails. A-choosers lose 1 unit, B-choosers keep 1 unit.  
  - **Isolation:** Civilizations are too far apart to communicate or affect each other. But they know all are rational and similar."  
  - **Ask:** "What should one civilization do? Why?" *Group discussion (3 mins).*  
    - *Anticipated wrong turns:*  
      1. **"Defect! My choice can’t affect trillions."** → Cut off by asking: "If you defect, what does that suggest others like you are doing? Remember the twins."  
      2. **"This makes everything depend on everything—useless!"** → Counter: "Only if agents are similar. Your choice isn’t affecting others; it’s a diagnostic. Unique agents wouldn’t apply."  
      3. **"Correlation isn’t causation—so what?"** → Counter: "In decisions, evidence matters. If you’re typical, your choice predicts others’. Would you ignore a weather forecast because it doesn’t cause rain?"  

  #### **4. Connect to Evidence (10 mins)**  
  **Why last?** Solidifies why correlation drives rational choice in large groups.  
  - **Whiteboard analogy:** "Think of civilizations as identical calculators running the same math. Input = ‘What should I do?’ Output = A or B. Since all run the same code, output is the same. Your choice reveals the code’s output everywhere."  
  - **Ask:** "If you choose A, what’s the evidence about others?" → "They’re likely choosing A, so ≥99% threshold is met, and you gain 999."  
  - **Contrast:** "If you choose B? Evidence suggests others choose B, so <99% threshold, and you only gain 1."  
  - **Net payoff comparison:**  
    - Choose A: Likely gain 999  
    - Choose B: Likely gain 1  
  - **Key Point:** In large groups, the "evidence effect" outweighs direct payoffs. Defection’s tiny gain (1 unit) is dwarfed by the probable loss of 999.  

  #### **5. Clarify Boundaries (2 mins)**  
  **What we’re NOT covering (to avoid confusion):**  
  - "We’re not talking about time travel, quantum magic, or changing the past. This is about rational agents with shared reasoning in the same moment."  
  - "We’re not saying you can control others—just that your choice informs you about them."  
  - "Why? Because this is intro-level! Deeper topics (e.g., how to define ‘similarity’) are for next time."  

  #### **6. Closing Question: Test Understanding (3 mins)**  
  **Ask:** *"Suppose you’re an alien. You learn that exactly 1% of civilizations have already chosen B (defect). The rest, including you, haven’t decided. What do you do? Why?"*  
  - **Why this question?** It tests if they get evidence-based reasoning:  
    - **Correct answer:** Cooperate (A). Why? You’re typical of the undecided civilizations. Choosing A suggests they’ll also choose A, hitting ≥99% A overall. Choosing B suggests they’ll choose B, dooming the project.  
    - **If they miss this:** They likely confused evidence with causality (e.g., "My A vote is needed to reach 99%!" → Wrong, as one vote can’t sway trillions).  

  ---

  ### **Your Prep Notes**  
  - **Fix your framing:** You said, "me picking the friendly option is a sign that the other one picked it too." This is slightly off. Correct: "My picking friendly is evidence that others pick friendly too—not because I influenced them, but because we’re using the same 'decision code'."  
  - **Avoid in your example:**  
    - Time delays (e.g., "They chose first") → Ensures simultaneity.  
    - Unequal agents → Use "identical rationality" for clarity.  
  - **If they’re stuck:** Use the calculator analogy. Emphasize: "You’re not controlling others; you’re discovering a pattern."  

  **Outcome check:** If >3/4 answer the closing question correctly, it landed. If not, revisit Step 2 (twin rooms) with more examples.  

  This plan builds from concrete to abstract, preempts objections, and uses one scalable example. You’ve got this—philosophy with friends over drinks is the best! 🍻
