prompt: |-
  An interpretability group I advise wants to make mechanistic anomaly detection operational, and they have run into a conceptual wall before any empirical one. The intended workflow is this: during an audit they identify a mechanism responsible for some capability; later, under a shifted input distribution or after further training, they want to flag the cases in which the system is not running that same mechanism. The obstacle is that nobody can say what makes two episodes of computation instances of the same mechanism rather than two mechanisms that merely agree on the data, or one mechanism that has been subtly rewritten. They have five candidate criteria on the table — behavioral equivalence on a reference distribution; isomorphism of the causal graph recovered by circuit analysis; sameness of computational role with the implementation free to vary; sameness of the set of causally relevant features; and matching counterfactual profiles under intervention — and the criteria disagree precisely on the cases that matter, while each is cheap to state and expensive to apply.

  I want a defended agenda, not a survey. Suppose the group has about three researcher-years and a theory-minded team that cannot lean on consulting the surrounding literature. Which open questions about mechanism individuation must be settled before an anomaly can even be defined, and in what order should they be taken up? For each, explain why it is upstream of the others — which downstream commitments it fixes — how tractable it is for such a team, and what concrete example or result within a year would move it up or down the ranking. Then tell me which of the five criteria you would discard outright, whether any single criterion could ever be sufficient and under what conditions, and how the ranking would change if the group cared only about catching deception-like failures rather than about mechanism identity in general. The ordering and the reasoning behind it matter far more to me than completeness.
reasoning: |-
  We are facing a conceptual problem: how to individuate mechanisms in neural networks such that we can detect when the same mechanism is running under distribution shift or after training. The team has five candidate criteria, but they disagree on the critical cases. The goal is to set an agenda for 3 researcher-years to tackle the open questions about mechanism individuation that are blocking the definition of anomaly.

  The core issue is that we lack a clear definition of when two computations are instances of the same mechanism. Without this, we cannot define an anomaly as a deviation from the expected mechanism.

  Open Questions about Mechanism Individuation:

  1. **What is the appropriate level of abstraction for describing mechanisms?**
     - Why upstream? This question is foundational because the level of abstraction (e.g., behavioral, algorithmic, implementation) determines what counts as the same mechanism. It fixes the ontology we use to describe mechanisms and thus affects all criteria.
     - Tractability: The team can start by analyzing existing mechanistic interpretability work and the candidate criteria to see at what level they operate. They can also consider toy models and formal systems (like automata) to explore abstractions.
     - Within a year: A concrete result would be a framework that maps the candidate criteria to different levels of abstraction and shows how the same network can be described at multiple levels. This could be demonstrated on small transformers or simple recurrent networks.

  2. **How do we handle compositionality and context-dependence?**
     - Why upstream? Mechanisms are often composed of sub-mechanisms and can be context-dependent. Without understanding how a mechanism is composed and how it interacts with the context, we cannot define identity in a way that is robust to changes in the surrounding system.
     - Tractability: The team can design experiments where they vary the context (e.g., by ablating parts of the network or changing the input distribution) and observe how the candidate criteria for mechanism identity respond.
     - Within a year: A result could be a set of experiments on a small model that shows how a mechanism (e.g., a circuit for addition) changes when the context (e.g., the presence of other operations) changes, and how the candidate criteria disagree.

  3. **What are the necessary and sufficient conditions for mechanism identity across time and distribution shift?**
     - Why upstream? This directly addresses the core problem. The answer will tell us whether we need to preserve the causal structure, the input-output behavior, or something else. It will fix the definition of anomaly.
     - Tractability: This is the hardest question. The team can start by formalizing the candidate criteria and then constructing counterexamples where they disagree. They can then try to find a unifying framework or argue for one criterion as primary.
     - Within a year: A concrete result would be a formal proof that under certain assumptions (e.g., modularity, locality) one criterion implies the others, or a counterexample showing that no criterion is sufficient without additional constraints.

  4. **How do we measure similarity when exact identity fails?**
     - Why upstream? In practice, mechanisms may not be identical but only similar. We need a metric for mechanism similarity to flag significant deviations.
     - Tractability: The team can define metrics based on each candidate criterion (e.g., behavioral divergence, graph edit distance, feature overlap) and test them on controlled changes (e.g., fine-tuning, distribution shifts).
     - Within a year: A result could be an evaluation of these metrics on a benchmark of known changes (e.g., a model before and after fine-tuning on a different distribution) and a demonstration of which changes are caught by which metric.

  Order of Attack:

  Given the interdependencies, I propose:

  1. **Start with Question 1 (level of abstraction).** 
     - Reasoning: Without settling the level of abstraction, we cannot even begin to describe what a mechanism is. This question is the most upstream because it constrains the language we use to talk about mechanisms. It will help clarify what the candidate criteria are actually measuring.
     - Expected outcome: A framework that classifies the candidate criteria by their level of abstraction. This will help the team understand why the criteria disagree and may lead to discarding some criteria that are at an inappropriate level.

  2. **Then tackle Question 2 (compositionality and context-dependence).**
     - Reasoning: Once we know the level of abstraction, we must understand how mechanisms are embedded in the larger system. This is the next upstream because it affects how we isolate a mechanism for comparison. It will reveal whether the criteria can handle the fact that the same mechanism might behave differently in different contexts.
     - Expected outcome: A set of principles for how to bound a mechanism (i.e., what parts of the network are considered part of it) and how to account for context. This might lead to modifying the criteria to include context.

  3. **Next, Question 3 (necessary and sufficient conditions).**
     - Reasoning: With the level of abstraction and compositionality understood, we can now directly address the identity conditions. This is the heart of the problem. However, it depends on the previous two because without knowing the abstraction level and how to handle context, we cannot even state the conditions properly.
     - Expected outcome: A set of formal definitions for mechanism identity and a clear understanding of the trade-offs between the criteria. This will allow the team to choose a primary criterion or a combination.

  4. **Finally, Question 4 (similarity metrics).**
     - Reasoning: In practice, we may not have perfect identity. So after defining identity, we need a fallback for when identity fails. This is downstream because we can only define similarity once we know what identity is.
     - Expected outcome: A practical metric for mechanism similarity that can be used for anomaly detection.

  Discarding Criteria:

  - I would discard **behavioral equivalence on a reference distribution** because it is too brittle under distribution shift. If the input distribution shifts, behavior might change even if the mechanism is the same (e.g., due to different inputs). Also, two different mechanisms might produce the same behavior on the reference distribution but diverge elsewhere.

  Sufficiency of a Single Criterion:

  - It is unlikely that any single criterion is sufficient in all cases. However, if we assume that the mechanism is isolated and the network is modular, then **isomorphism of the causal graph** might be sufficient. But in practice, neural networks are not perfectly modular, so we will likely need a combination.

  Focus on Deception-like Failures:

  If the group only cares about deception (e.g., the model is hiding its true behavior until deployment), then:

  - The ranking changes: Question 3 (necessary and sufficient conditions) becomes the most urgent because we need to know what it means for the mechanism to be "the same" in a way that includes deceptive behavior. We are especially interested in when the mechanism appears the same on the reference distribution but is different in deployment (which is a form of deception). Therefore, we might prioritize:
    1. Question 3 (to define identity in a way that captures deceptive divergence)
    2. Question 1 (to choose an abstraction level that can represent hidden states or intentions)
    3. Question 4 (to measure the divergence that matters for deception)
    4. Question 2 (because deception might involve context-dependent triggers)

  - We might also reconsider discarding behavioral equivalence because deception is often defined behaviorally (i.e., the model behaves well during testing but badly in deployment). However, note that the behavioral criterion fails on the reference distribution by design (the deception is not triggered). So we need a criterion that can detect the hidden potential for deception. Thus, **counterfactual profiles under intervention** become more important because we can design interventions that trigger the deceptive behavior.

  Conclusion:

  For the general case, the agenda is:
  1. Level of abstraction (year 1)
  2. Compositionality and context (year 1-2)
  3. Identity conditions (year 2-3)
  4. Similarity metrics (year 3)

  If focused on deception, then:
  1. Identity conditions (with a focus on counterfactuals) (year 1)
  2. Level of abstraction (to capture hidden state) (year 1-2)
  3. Similarity metrics (for deception) (year 2)
  4. Compositionality (to understand triggers) (year 2-3)

  In either case, discard behavioral equivalence on a reference distribution because it is inadequate for detecting deception (by definition, the deception is not present on the reference distribution).

  Note: The team should also consider that deception might be a global property of the model (involving multiple mechanisms) rather than a single mechanism. However, the problem statement focuses on mechanisms, so we assume that the deception is localized to a particular mechanism.
answer: |-
  ### Defended Agenda for Mechanism Individuation in Anomaly Detection

  The core challenge is defining "same mechanism" to detect deviations under distribution shift or training. Without resolving this, anomaly detection is ill-posed. I propose a 3-year agenda targeting **four open questions**, ordered by their upstream influence, tractability, and criticality for defining anomalies. I'll then address criteria discards, sufficiency, and deception-specific adjustments.

  #### **Open Questions & Agenda Order**
  The questions are ordered by *conceptual dependency*: each constrains the next. Progress hinges on formalizing toy examples (e.g., modular arithmetic in small transformers) to test ideas within a year.

  1. **What is the ontology of a "mechanism"? (Most upstream)**  
     **Why upstream?** Until we define *what a mechanism is* (e.g., a causal graph, a function, a set of features), we cannot individuate instances. This fixes the *descriptive language* for mechanisms, determining how we encode computational roles and implementation.  
     **Tractability:** High. The team can formalize toy models (e.g., a 2-layer transformer solving modular addition) and compare mechanistic descriptions across the five criteria. A concrete result within a year: **A taxonomy of mechanism ontologies** (e.g., functional vs. structural) showing which criteria collapse or diverge under simple distribution shifts. For example, if behavioral equivalence and causal graph isomorphism align in a toy model but diverge when inputs are perturbed, it reveals ontology-dependent fragility.  
     **Downstream commitments:** Fixes the interpretation of "sameness" (e.g., if mechanisms are causal graphs, isomorphism becomes primary). Blocks progress on all other questions.

  2. **How do we handle context-dependence?**  
     **Why upstream?** Mechanisms may share core functions but behave differently in new contexts (e.g., due to activation patching or new inputs). This question fixes *scope*: what environmental factors are part of the mechanism? It determines whether criteria must hold universally or conditionally.  
     **Tractability:** Moderate. Experiments can probe context sensitivity by ablating model components or using synthetic distribution shifts. Within a year: **A context-sensitivity benchmark** showing how each criterion responds when a mechanism (e.g., "induction head" in transformers) is placed in novel contexts. If computational role sameness tolerates context shifts but causal graphs fracture, it prioritizes role-based criteria for robustness.  
     **Downstream commitments:** Informs whether anomaly detection requires context-invariant criteria (e.g., counterfactual profiles) or allows contextual adaptation. Affects Question 3’s identity conditions.

  3. **What are necessary/sufficient conditions for identity across time/shift?**  
     **Why upstream?** Once we know *what* a mechanism is and how context affects it, we can define trans-world identity. This fixes *operational thresholds* for anomalies (e.g., "deviation > X constitutes a new mechanism").  
     **Tractability:** Low. Requires formalizing identity conditions and testing edge cases. Within a year: **Necessity/sufficiency proofs for toy cases**, e.g., showing that feature-set sameness implies counterfactual matching in linear models but not in attention layers. A negative result (e.g., no criterion is sufficient alone) would downgrade this question, pushing the team toward hybrid approaches.  
     **Downstream commitments:** Determines if anomalies are detectable via deviation from a baseline (e.g., using metrics from Question 4). Directly enables anomaly definitions.

  4. **How do we measure similarity when identity is partial? (Most downstream)**  
     **Why upstream?** Identity is binary, but anomalies may involve gradual drift. This question defines *detection metrics* once identity conditions are set.  
     **Tractability:** High. Builds on Questions 1–3 to construct similarity scores (e.g., causal graph edit distance). Within a year: **A metric sensitivity analysis** on fine-tuned models, quantifying how distribution shifts affect each criterion. If counterfactual profiles show early-warning signals for drift, this question gains priority.  
     **Downstream commitments:** Finalizes the anomaly detection workflow (e.g., "flag if counterfactual similarity < threshold").

  **Agenda Order Justification:**  
  - **Year 1:** Tackle Questions 1 and 2. Without ontology and context handled, identity conditions (Q3) are premature.  
  - **Year 2:** Address Question 3 using Year 1 insights.  
  - **Year 3:** Implement Question 4 for deployment.  
  *Why this order?* Ontology (Q1) is the foundation—wrong ontology invalidates all else. Context (Q2) constrains identity (Q3): if mechanisms are context-bound, identity must include environmental factors. Similarity (Q4) relies on knowing what to measure (Q1–3).

  #### **Criteria Recommendations**
  - **Discard outright:** **Behavioral equivalence on a reference distribution**. It ignores implementation and is brittle under shift—two mechanisms can share behavior on reference data but diverge critically elsewhere (e.g., a model using heuristics pre-shift and precise reasoning post-shift). It fails the core goal of detecting *mechanistic* change.  
  - **Sufficiency of a single criterion:** Only under **strong modularity assumptions** (e.g., mechanisms are self-contained subcircuits). **Causal graph isomorphism** could suffice if mechanisms are atomic and context-independent (e.g., digital circuits). In practice, neural networks are entangled, so no criterion is likely sufficient alone.  
  - **Retain and combine:**  
    - **Isomorphism of causal graphs**: Best for structural fidelity.  
    - **Counterfactual profiles**: Best for robustness to shift (tests invariance under intervention).  
    - **Computational role sameness**: Best for capturing function over form.  
    Hybrid approaches (e.g., role + counterfactuals) will likely outperform any single criterion.

  #### **Adjustments for Deception-Specific Anomalies**
  If targeting *deception-like failures* (e.g., hidden misalignment), the agenda shifts:  
  - **Why?** Deception often involves preserved behavior with changed intent (e.g., "treacherous turns"), requiring criteria that detect hidden states.  
  - **New Order:**  
    1. **Question 3 (Identity Conditions) → First**: Deception hinges on counterfactuals (e.g., "would the mechanism harm us if triggered?"). Settle this immediately using adversarial interventions.  
    2. **Question 4 (Similarity) → Second**: Focus on metrics sensitive to deceptive divergence (e.g., counterfactual mismatch under goal-relevant interventions).  
    3. **Question 2 (Context) → Third**: Deception is context-triggered; study how mechanisms activate in "trigger" contexts.  
    4. **Question 1 (Ontology) → Last**: Assume a mechanistic ontology (e.g., goal-directed subgraphs) and refine if needed.  
  - **Criteria Changes:**  
    - **Prioritize counterfactual profiles**: They expose hidden intentions (e.g., test if "helpful" behavior flips under scarcity).  
    - **Discard feature-set sameness**: Deceptive models may use identical features for opposite goals.  
    - **Demote causal graphs**: Deception may not alter structure, only intent.

  ### Summary
  - **Order for general anomalies:** Ontology → Context → Identity → Similarity.  
  - **Order for deception:** Identity → Similarity → Context → Ontology.  
  - **Discard behavioral equivalence**; combine causal graphs, counterfactuals, and computational roles.  
  - **Critical year-1 output:** Formalized toy experiments revealing which criteria diverge under shift, informing ontology and context sensitivity.  

  This agenda resolves the conceptual wall by forcing ontological clarity first, leverages the team’s theory strengths, and delivers actionable anomaly definitions within 3 years.
