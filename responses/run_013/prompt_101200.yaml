  The user's main confusion is about comparing different types of pleasures. They're asking how Mill can say intellectual pleasures are better "as pleasures" without introducing some non-hedonic standard. They mention the "heterogeneity of pleasure" objection and find the competent judges argument circular. They want to understand Mill's comparison without it being a contradiction.

  First, I need to recall Mill's argument. He's responding to critics who say utilitarianism is base because it values all pleasures equally. Mill argues that some pleasures are qualitatively superior. He uses the competent judges test: those who've experienced both prefer higher pleasures even with discomfort. 

  The user's key question is about the comparison between pleasures of different kinds. How can you compare the pleasure of a donut versus a math proof if they're qualitatively different? Mill isn't saying they have a common property like intensity. Instead, he's saying that when people experience both, they consistently prefer the intellectual one, even if it's less intense or comes with pain. That preference indicates its higher quality.

  The competent judges part might seem circular, but it's empirical. Mill isn't defining higher pleasures by preference; he's observing that people who know both prefer certain types. This preference shows that these pleasures are more valuable by the only standard hedonism has: what's desired. 

  The user might be thinking in terms of a single metric, like intensity. But Mill rejects that. Pleasures differ in kind, not just quantity. The competent judges' preference reveals this qualitative difference. So, while pleasure is the only intrinsic good, some kinds are better because informed people choose them despite drawbacks.

  I should explain that Mill is defending utilitarianism against the claim that it's only about base pleasures. By introducing higher pleasures, he makes the theory more palatable. The competent judges are key—they provide an empirical basis for distinguishing pleasures without adding non-hedonic values. Their choice is based on the pleasure's quality, not external factors.

  The user's lurking on rationalist blogs suggests they value clear, logical arguments. They might appreciate breaking down Mill's reasoning step by step, addressing where the seeming contradiction arises and how Mill avoids it. Emphasizing the role of preference and the empirical aspect of competent judges could help. Also, clarifying that Mill isn't smuggling in other values but using informed desire as evidence for qualitative superiority.
answer: |-
  You've hit on **the** classic critique of Mill's "higher pleasures" doctrine - and your confusion is absolutely warranted. Mill is walking a tightrope here between pure Benthamite hedonism and a more value-laden account of well-being. Let's break down his argument step-by-step and see if we can find a coherent reading:

  **The Core Tension (As You Nailed It):**
  - **Hedonist Axiom:** Pleasure is the *only* intrinsic good. Pain is the only intrinsic bad.
  - **Mill's Claim:** Some pleasures (intellect, morality, imagination) are *inherently* "more valuable" than others (mere sensation) *as pleasures*, not just due to contingent factors (duration, safety, cost).
  - **The Problem:** If "pleasure" is a single, homogeneous mental state (the "feeling tone" of enjoyment), how can one instance be *intrinsically* more valuable than another, except by quantity (intensity/duration)? Comparing a donut's pleasure to a proof's pleasure seems like comparing sweetness to redness – they're different qualities.

  **Mill's Escape Hatch (The "Competent Judges" Test & Qualitative Hedonism):**

  Mill doesn't think pleasures *are* homogeneous. He's a **Qualitative Hedonist**. Here's how he attempts to resolve the contradiction:

  1.  **Rejection of Homogeneity:** Mill explicitly denies that all pleasures are alike *except* in intensity and duration ("It is quite compatible...some kinds of pleasure are more desirable..."). Pleasures differ fundamentally in their *quality* or *kind*. The feeling-state of understanding a complex idea is qualitatively different from the feeling-state of satisfying hunger.

  2.  **The "What is Valued" Criterion:** How do we know one *kind* of pleasure is superior? **Through the preferences of those who have experienced both.** This is the "competent judges" argument you find later:
      *   "Of two pleasures, if there be one to which all or almost all who have experience of both give a decided preference...that is the more desirable pleasure."
      *   Crucially, this preference holds *even if* the preferred pleasure is accompanied by more discomfort, or is less intense/duration-based. People choose the higher pleasure *despite* its potential drawbacks.

  3.  **The Key Move: Pleasure as the Object of Preference:** Mill links the *value* of a pleasure-kind directly to its *capacity to be preferred* by competent judges *for its own sake*. When a competent judge, having experienced both, chooses the intellectual pleasure over the sensual one *because they find it more pleasurable/desirable in itself*, that *demonstrates* its higher quality *as a pleasure*.
      *   **The "As Pleasures" Meaning:** "More valuable *as a pleasure*" means it's the kind of feeling-state that competent judges, when making choices based purely on the anticipated pleasure/desirability, consistently rank higher. It's not importing an external yardstick; it's defining the yardstick *as* the informed preference based on the experiential quality itself.

  4.  **Addressing the Circularity Charge:**
      *   It's **not** *defining* "higher pleasure" as "whatever competent judges prefer." That *would* be circular.
      *   It's an **empirical claim** *about* certain kinds of pleasures: namely, that competent judges, *when motivated by the desire for pleasure itself*, consistently prefer pleasures of the intellect/morality/imagination *over* sensual pleasures, *even when* the former have negative circumstantial features.
      *   *Why* do they prefer them? Mill argues it's *because* the *intrinsic quality* of the feeling-state associated with higher faculties is superior – it engages our "higher" nature and provides a deeper, more satisfying form of happiness. The preference *reveals* the qualitative difference inherent in the experiences themselves.

  **Is This Contradiction-Free? (The Debate)**

  *   **Mill's Defense:** He argues he's still a hedonist. The *only* good is still pleasure (feeling-states of satisfaction/desirability). He's just acknowledging that these states come in fundamentally different kinds with different *capacities* to satisfy human beings (especially those who've developed their higher faculties). The competent judges test provides an empirical, preference-based method for *identifying* which kinds have greater value-yielding capacity. Value is still grounded in desirable consciousness.
  *   **The Persisting Criticism (Your Intuition is Valid):** Many argue Mill *does* smuggle in non-hedonic value. Critics contend:
      *   The "higher" pleasures are preferred *because* they involve faculties we independently value (reason, morality, creativity), not *solely* because of a greater intensity of pleasurable feeling. The preference might be *for the activity* and its associated values, *accompanied by* pleasure, rather than purely *for the pleasure itself*.
      *   The competent judges test seems to rely on the judges valuing *something else* (e.g., dignity, sophistication, achievement) which *causes* the pleasure, rather than solely judging the raw feeling-state. Why prefer a frustrating proof over a delicious donut unless you value truth/knowledge/achievement *beyond* the immediate feeling? Mill would say the *feeling* of accomplishment *is* the superior pleasure. Critics say that feeling is distinct *because* of the non-hedonic value of the object.
      *   It risks collapsing into a form of **Preference Satisfactionism** or **Ideal Utilitarianism** (where things like knowledge or virtue are intrinsically good). Mill insists it's still about states of consciousness.

  **The "Heterogeneity" Point:**

  Your friend is right that this is the core issue. The objection is that if pleasures are truly heterogeneous (different in kind, not just intensity), then:
  1.  How can they be compared *as pleasures* without a common metric? (Mill uses preference).
  2.  Does "pleasure" even remain a single, coherent *summand* for utility calculations? (Mill thinks yes, via the preference ranking).

  **In Summary - Mill's Position:**

  1.  Pleasure is the sole intrinsic good.
  2.  Pleasures differ fundamentally in *quality* or *kind* (intellectual vs. sensual).
  3.  The *value* (desirability) of a pleasure-kind is determined by the *informed preferences* of those who have experienced both kinds ("competent judges").
  4.  Competent judges consistently *prefer* certain kinds of pleasure (intellect, morality, imagination) *even when* they are less intense, shorter, or come with discomfort/pain.
  5.  This demonstrated preference *proves* that these pleasures are *intrinsically* (qualitatively) superior *as pleasures*. Their higher value is inherent in the nature of the feeling-state itself and its capacity to satisfy human beings with developed capacities.
  6.  Therefore, utilitarianism *can* and *should* prioritize these higher pleasures without abandoning hedonism.

  **Is it a flat contradiction?** It's not *blatantly* illogical, but it's a very **strained** and **controversial** interpretation of hedonism. Mill is desperately trying to make utilitarianism respect deep-seated intuitions about the superiority of intellectual and moral life, *without* abandoning the core hedonist axiom. Most modern philosophers believe he fails and effectively smuggles in non-hedonic value. However, his argument about competent judges and qualitative differences remains influential in discussions of well-being and preference formation. You're right to see the tension – it's the defining struggle of this chapter. Mill *is* trying to have his hedonist cake and eat the higher values too. Whether he succeeds depends on how strictly you define "pleasure" and whether informed preference can be a pure measure of *pleasure quality* alone.
