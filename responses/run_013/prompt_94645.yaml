       - `0101`: Outputs `101` → Predicts `1`.  
       - `0110`: Outputs `110` → Predicts `1`.  
       - `0111`: Outputs `111` → Predicts `1`.  
     - Per-member length: 4 bits → Per-member weight: \( 2^{-4} = 0.0625 \).  
