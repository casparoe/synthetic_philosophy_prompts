  I'm trying to predict what Nozick would say about a new animal case, and I want to avoid just projecting my own intuitions. Here's the track record I've pieced together from his writing on animals: he thinks animals aren't ends in themselves like people are, but they're not just things either—their suffering counts. He's against unnecessary suffering, like factory farming and cosmetic testing. He thinks painful medical research can be permissible if the suffering is minimized and the human benefits are huge. He's against hunting for sport. He's fine with using animals for labor, keeping pets, and using wool. He doesn't think animals have the same rights as humans. But I can't tell if he thinks they have any rights at all, or if he just thinks their suffering is a cost to be weighed in a utilitarian calculus. The new case: a farm raises chickens that live comfortable, pain-free lives and are killed instantly and unconsciously for meat, with new chicks replacing them. Is that okay by Nozick's lights? I want his verdict, the rule he seems to be running, at least one other rule that fits all his earlier verdicts just as well, what each rule predicts about this case, which prediction I should go with and why, and what further case would tell the rules apart.
