answer: |-
  1.  You confuse the single animal standing before us with what it is *as* named: when led as a horse, it answers for its shape; when led as a white horse, it answers for both shape and colour together.  
  2.  Observe the marketplace: if you request a horse, the groom may bring yellow or black; if you demand a white horse, he rightly refuses those and brings only white.  
  3.  The animal you lead changes in its answering nature: under the name 'horse', colour is irrelevant; under 'white horse', colour is essential.  How can one identical thing have contradictory properties?  
  4.  That both names apply to this beast shows only that the beast possesses both features, not that the names name the same thing.  'Horse' names shape alone; 'white horse' names shape-and-colour united.  
  5.  You mistake the undivided hide and bones for the thing named.  What answers to 'horse' is not what answers to 'white horse', though both inhere in the same beast.  Therefore, a white horse is not a horse.
