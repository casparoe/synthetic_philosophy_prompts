prompt: |-
  ok so the IAU vote in 2006 that demoted Pluto — the Prague general assembly, the "cleared the neighbourhood of its orbit" clause, Eris showing up the year before and forcing the issue, all that — i want to use that whole mess as a test case for theories of natural kinds. heres the setup i want you to actually work with, since you cant look it up: the 2006 definition says a planet (a) orbits the Sun, (b) is massive enough to be roughly round under its own gravity, and (c) has cleared the neighbourhood around its orbit. Pluto fails (c), so it gets relabelled a dwarf planet, which is a brand new category invented in the same resolution. A lot of planetary scientists basically ignore the whole thing and keep calling round non-stellar bodies planets anyway.

  Now the lens. I want three accounts in play. First, Boyd's homeostatic property cluster view — a real kind is a cluster of properties that reliably co-occur because some causal mechanism holds them together, and thats what makes the kind explanatory rather than just a label. Second, Dupre's promiscuous realism — nature doesnt come pre-carved along one privileged set of lines, lots of different classifications can be equally legitimate, and theres no fact of the matter about which one is "the" joint. Third, the Locke-ish real vs nominal essence distinction, plus Hacking's stuff about us making up categories that then loop back on the things they classify.

  So: run the Pluto episode through these. Was "planet" ever a natural kind at all, or was it always a nominal kind / a convenience category that got mistaken for something deeper? Is the 2006 definition a discovery — scientists finally locating a joint — or a decision, a line drawn at a general assembly by people who wanted to stop adding planets? Does "cleared the neighbourhood" do any causal work? I think theres a reading where that criterion tracks something real, gravitational dominance of an orbital zone, some quantitative measure of who actually runs the neighbourhood — if so does that rescue the new category as a Boyd-style real kind, or is it a post hoc rationalization for a boundary someone wanted? And the definition only covers bodies orbiting *our* Sun, so it cant even travel to exoplanets — can a definition that local be aiming at a natural kind, or does that give the game away?

  Then flip it. What does the episode show about the theories? Does the lobbying, the backlash, the "Pluto is still a planet to me" stickers and the fact that working scientists just keep using the old word count for Dupre-style pluralism, or is that all just sociology and the astronomy is fine? Where are these accounts silent — e.g. what does any of them say about a kind being settled by a vote? Does the case help kind-realism, hurt it, or reveal the debate was never really about cases like this?

  No citations, no reading list, i dont care who said what first — just do the mapping honestly and say where each theory runs out of gas.
reasoning: |-
  Okay, the user is using the Pluto reclassification as a case study to test three philosophical theories of natural kinds: Boyd's HPC, Dupré's promiscuous realism, and Locke/Hacking's nominal essences. They want to see how each theory handles this real-world scientific controversy. 

  Hmm, interesting challenge. The user clearly knows their philosophy of science - they're not asking for basics but for a nuanced application. They're skeptical about whether "planet" was ever a natural kind, and whether the IAU definition captures something real or is just bureaucratic boundary-drawing. 

  First, Boyd's HPC view. The traditional "planet" concept does seem like a property cluster: roundness, solar orbit, orbital dominance. But the cluster was fuzzy - Pluto always strained it. The 2006 definition tries to make "cleared orbit" the homeostatic mechanism, but does gravitational dominance really cause roundness? Unclear. And the sun-centric limitation makes it non-generalizable. Boyd might say the IAU forced an artificial precision onto a messy cluster.

  Then Dupré's pluralism. This fits like a glove! Planetary scientists ignoring the IAU? Perfect example of legitimate alternative classifications. The vote wasn't discovering joints but choosing a useful cut for cataloging. The "Pluto is still a planet" stickers embody promiscuous realism - different purposes, different categories.

  Locke and Hacking are the killjoys here. Locke would say "planet" never had a real essence - we thought it was about roundness+orbit, but that was nominal. Hacking nails the looping: the IAU vote changed how we see Pluto, which changed Pluto's cultural role (hence the stickers). But neither thinks the new definition captures deeper reality.

  The user's sharpest insight is about locality: a sun-only definition can't be about natural kinds. That sinks Boyd and supports Dupré/Hacking. And the vote itself - how can a natural kind be decided by show of hands? That's social, not scientific.

  Where theories struggle: Boyd can't explain why scientists reject his "improved" kind. Dupré can't say if some classifications are better. Locke/Hacking make all categories seem equally arbitrary. 

  Ultimately this case doesn't settle realism vs anti-realism but shows scientific categories are human tools. The user seems to lean that way too - note their phrasing "convenience category mistaken for something deeper." Smart framing.
answer: |-
  Here's how the Pluto episode maps onto each theory, highlighting tensions and insights:

  ### 1. **Boyd's Homeostatic Property Cluster (HPC) View**  
     - **Pre-2006 "Planet"**: Fits imperfectly. Roundness (hydrostatic equilibrium) and solar orbit co-occurred, but *why*? No clear shared causal mechanism linking, say, Mercury's roundness and Pluto's. The cluster felt explanatory (e.g., predicting geology) but Pluto’s composition and orbit (highly eccentric, crossing Neptune’s) strained coherence.  
     - **2006 Definition**: "Cleared the neighbourhood" (gravitational dominance) *attempts* to supply a causal mechanism: massive bodies dynamically sculpt their orbits over time, linking mass, roundness, and orbital isolation. **But problems arise**:  
       - Does gravitational dominance *cause* roundness? No—roundness is from self-gravity; dominance is a byproduct of mass/position.  
       - The criterion is binary (cleared/not cleared), but dominance is a continuum (Pluto clears ~7% of its zone; Earth ~100%).  
       - Sun-centric scope undermines universality—exoplanets can’t be "planets" under this definition.  
     - **Verdict**: Boyd might see the new definition as a *failed* HPC. It imposes a post-hoc causal story (dominance) that doesn’t unify properties cohesively. The backlash from scientists suggests it lacks explanatory traction for their work (e.g., studying geophysics of round bodies).  

  ### 2. **Dupré’s Promiscuous Realism**  
     - **Perfect fit**. The controversy *exposes* multiple legitimate ways to carve "planets":  
       - **Dynamicists** (favoring 2006 definition): Care about orbital mechanics. "Cleared orbit" matters for solar system architecture.  
       - **Planetary geologists**: Care about physical processes (volcanism, tectonics). Roundness signals complex geology, so Pluto/Ceres/Eris are "planets."  
       - **Cultural/Public**: "Planet" as a cultural icon (Pluto’s sentimental status).  
     - The IAU vote isn’t "discovery" but a *pragmatic choice* for cataloging. Scientists ignoring it aren’t wrong—they’re using a classification fit for their domain (geology over dynamics).  
     - **Weakness**: Doesn’t judge if one classification is *better*—just that multiple work. But the vote’s arbitrary elements (e.g., excluding exoplanets, vague "neighbourhood" metric) highlight human interests, not pure ontology.  

  ### 3. **Locke + Hacking (Nominal Essences & Looping Effects)**  
     - **Pre-2006**: "Planet" was always nominal. Historical "essence" (wandering star → solar orbiter) shifted with technology. No discovery of a fixed kind—just utility in grouping.  
     - **2006 as Social Action**: The vote *created* a new nominal essence ("cleared orbit") to solve a practical problem: too many planets. Pluto’s demotion was a *decision*, not a discovery.  
     - **Hacking’s Looping**:  
       - **Labeling → Reaction**: "Dwarf planet" redefines Pluto as "failed planet," triggering public mourning ("Pluto is still a planet" stickers) and scientific defiance.  
       - **Feedback into Science**: New Horizons mission (launched pre-2006) found Pluto geologically complex—reinforcing geologists’ rejection of the IAU’s dynamicist label.  
     - **Verdict**: Exposes "planet" as a human tool. The sun-only clause confirms it’s not about universal kinds—it’s a local fix.  

  ### **What the Episode Reveals About the Theories**  
  - **Hurt Kind-Realism?** Yes, for rigid Boyd-style kinds. If "planet" were a natural kind, a vote wouldn’t settle it, and scientists wouldn’t split.  
  - **Helps Pluralism/Dynamic Nominalism**: Dupré and Hacking thrive here. Competing uses of "planet" persist because they serve different purposes—no "joint" to find.  
  - **Silences/Shortcomings**:  
    - **Boyd**: Can’t explain why a "better" causal criterion (gravitational dominance) is rejected by experts.  
    - **Dupré**: Doesn’t address *power*—IAU’s definition sticks in textbooks despite dissent.  
    - **Locke/Hacking**: Doesn’t explain why some categories (e.g., "star") feel more stable than others.  

  ### **The Core Tension**:  
  The vote tried to force a Boyd-like causal essence ("cleared orbit") onto a category that was always nominal/promiscuous. **Result**: It satisfied nobody because:  
  - Realists saw a contrived mechanism (dominance ≠ roundness cause).  
  - Pluralists saw unnecessary exclusion.  
  - Nominalists saw proof categories are made, not found.  

  **Conclusion**: The Pluto affair doesn’t *refute* natural kinds broadly (e.g., "water = H₂O" holds). But it shows that in complex, historical domains like astronomy, kinds are often **negotiated tools**, not discovered joints. The debate wasn’t about Pluto’s nature—it was about who gets to define words and why.
