  We are given a task to help a postdoctoral researcher turn a half-formed worry into a pilot grant proposal. The worry is about the criteria for individuating mechanisms in the context of anomaly detection in mechanistic interpretability in machine learning. The lab uses terms like "same mechanism", "same circuit", and "new mechanism" interchangeably, but these might rely on different criteria of sameness, which affects what claims they can make when an anomaly occurs.

  The proposal must:
  - Start with a brainstorming section (3-4 candidate ways of individuating mechanisms, each with a concrete anomaly example).
  - Converge on one criterion to build the project around.
  - Write the proposal in first person plural (we) for a panel of one philosopher of science and one ML engineer.
  - Be about 1,800 words.

  Structure of the proposal:
  1. **Brainstorming Section**: 3-4 candidate criteria for mechanism individuation, each stated in 1-2 sentences and applied to a concrete anomaly example.
  2. **Research Question**: Stated so it has a determinate answer.
  3. **Why Existing Answers Leave the Question Open**: Describe positions by arguments, not provenance; no citations.
  4. **Method**: Week-by-week plan for six months, defended against alternatives (survey, benchmark, formal causal graphs).
  5. **Worked Anomaly Case**: Concrete or schematic, clearly labeled if schematic.
  6. **Deliverable**: What a successful result looks like (decision procedure, taxonomy, checklist) and what failure looks like.
  7. **Evidence that Would Force a Change of Mind**: What would falsify the approach?
  8. **Honest Assessment**: What could make it too big and what to cut.

  Brainstorming Section (3-4 candidates):

  Candidate 1: **Sameness of component parts and their activities**  
  - A mechanism is the same if it involves the same set of components (e.g., neurons or attention heads) and the same activities (e.g., activation patterns) in the same organizational structure.  
  - *Anomaly example*: Consider an image classifier that correctly identifies dogs but misclassifies a dog with a blue hat as a cat. If the same neurons fire in the same way as when it correctly classifies dogs without hats, then it's the same mechanism under new conditions. If the activation pattern is different, it's a new mechanism.

  Candidate 2: **Sameness of causal role or input-output profile**  
  - A mechanism is the same if it plays the same causal role in the system, i.e., it maps the same inputs to the same outputs, regardless of the internal parts.  
  - *Anomaly example*: In a language model, a circuit that normally maps questions about physics to correct answers now maps questions about physics to gibberish when asked in a certain dialect. If the input-output mapping for the same set of questions is the same in the new dialect as in the standard one (even if internal activations differ), then it's the same mechanism. But if the mapping changes, it's a different mechanism.

  Candidate 3: **Sameness under a stated equivalence of interventions**  
  - A mechanism is the same if it responds equivalently to the same set of interventions (e.g., ablations, perturbations) in terms of its output behavior.  
  - *Anomaly example*: A circuit in a self-driving car model that normally avoids pedestrians fails in rainy conditions. If ablating the same set of neurons in both sunny and rainy conditions leads to the same change in behavior (e.g., increased collisions), then it's the same mechanism. If the ablation has a different effect, it's a different mechanism.

  Candidate 4: **Sameness of explanatory function for a stated audience**  
  - A mechanism is the same if it serves the same explanatory purpose for the intended audience (e.g., the lab researchers).  
  - *Anomaly example*: A model that generates toxic content in a new context. If the explanation for why the toxic content was generated (e.g., a particular bias in the training data) is the same as in previous cases, then it's the same mechanism. If a new explanation is required (e.g., a new bias or a different circuit), then it's a new mechanism.

  These candidates can come apart in the anomaly case because:
  - The same components might be active but produce a different output (candidate 1 vs 2).
  - The same input-output profile might be achieved by different internal structures (candidate 2 vs 1).
  - The same intervention might have different effects under different conditions (candidate 3 vs 1 and 2).
  - The explanatory needs might change even if the mechanism is the same (candidate 4 vs others).

  Converge on one criterion: We choose **sameness under a stated equivalence of interventions** because it is operationalizable in the ML context (interventions are common in interpretability) and it directly addresses the anomaly detection question by testing how the mechanism responds to changes.

  Now, the proposal:

  ---

  **Proposal: Individuating Mechanisms for Anomaly Detection in Machine Learning**

  **Brainstorming: Candidate Criteria for Mechanism Individuation**

  In our lab, we often speak of mechanisms being "the same" without a fixed criterion. We brainstorm four candidate ways to individuate mechanisms, each illustrated with a concrete anomaly:

  1. **Component Sameness**: A mechanism is the same if it involves the same parts (e.g., specific neurons or layers) and their activities (e.g., activation patterns). *Anomaly Example*: A vision transformer correctly identifies animals in natural images but fails on cartoon animals. If the same neurons activate in the same way for both natural and cartoon images (even if the output is wrong for cartoons), then the same mechanism is at work under new conditions. If the activation patterns differ, it's a new mechanism.

  2. **Causal Role Sameness**: A mechanism is the same if it plays the same causal role, i.e., it has the same input-output mapping. *Anomaly Example*: A language model generates coherent text in English but produces nonsensical output in code-switched sentences. If the same inputs (e.g., prompts with the same intent) lead to the same outputs regardless of code-switching, then it's the same mechanism. If the mapping changes, it's a different mechanism.

  3. **Interventional Sameness**: A mechanism is the same if it responds equivalently to a set of interventions (e.g., ablations, perturbations, or counterfactual inputs). *Anomaly Example*: A medical diagnosis model that works well on adult patients fails on pediatric cases. If ablating the same circuit has the same effect on performance for both adult and pediatric cases (e.g., a similar drop in accuracy), then it's the same mechanism. If the ablation has a different effect (e.g., no effect on pediatric cases), it's a new mechanism.

  4. **Explanatory Sameness**: A mechanism is the same if it serves the same explanatory purpose for the intended audience. *Anomaly Example*: A recommendation system that suddenly promotes extremist content. If the explanation (e.g., the system learned to maximize engagement by exploiting outrage) is the same as for previous cases of problematic recommendations, then it's the same mechanism. If a new explanation is needed (e.g., a new vulnerability to adversarial manipulation), it's a new mechanism.

  These criteria can conflict. For instance, in the vision transformer example, the same components might be active (candidate 1) but the input-output mapping might change (candidate 2). In the medical diagnosis example, the same intervention might have different effects, revealing a different mechanism (candidate 3). We converge on **Interventional Sameness** as the criterion to build this project around because it is both testable (via experiments) and directly relevant to anomaly detection, where we want to know if a known mechanism is behaving differently or if a new one is at play.

  **Research Question**

  When an AI system produces an anomalous output, under what conditions should we attribute it to a known mechanism operating under new conditions versus a genuinely different mechanism? We operationalize this by asking: **Does the mechanism respond equivalently to a set of interventions across the normal and anomalous contexts?** This question has a determinate answer: we can run interventions (e.g., ablations, perturbations) on the system in both contexts and compare the effects. If the effect of the intervention is the same (within a defined tolerance), then it is the same mechanism; otherwise, it is different.

  **Why Existing Answers Leave This Question Open**

  The philosophy of science literature on mechanistic explanation offers several criteria for individuating mechanisms, but they are not designed for the anomaly detection problem in complex, learned systems. For instance, the component sameness criterion is often tied to structural continuity, but in neural networks, the same structure can be repurposed for different functions. The causal role criterion focuses on input-output mappings, but it doesn't account for how the mechanism might fail under interventions. The explanatory criterion is pragmatic but subjective and context-dependent. Meanwhile, in mechanistic interpretability, the focus has been on reverse-engineering circuits in normal conditions, not on how to re-identify them under anomalies. Thus, the narrower question of when to attribute an anomaly to a known mechanism versus a new one remains open because:
  - Existing philosophical criteria do not specify how to handle distribution shifts or novel inputs.
  - Interpretability methods lack a clear standard for mechanism identity under interventions.

  **Method**

  We propose a six-month pilot project with the following week-by-week plan:

  **Months 1-2: Conceptual Groundwork and Case Selection**
  - Weeks 1-4: Analyze lab discourse. We will collect and categorize instances where lab members use terms like "same mechanism" or "new mechanism" in meetings, papers, and internal documents, without assuming these are consistent. This will reveal the implicit criteria currently in use.
  - Weeks 5-8: Select and document three concrete anomaly cases from our lab's work or the literature. At least one will be a schematic case to ensure generality. We will choose cases where the candidate criteria (brainstormed above) might conflict.

  **Month 3: Develop Intervention Protocol**
  - Weeks 9-12: Define a set of interventions for each case. For a neural network, interventions could include: ablating neurons, adding noise to activations, or using activation steering. We will define "equivalence of response" by comparing output changes (e.g., using KL divergence for outputs or accuracy drops for classifiers).

  **Month 4: Experimental Testing**
  - Weeks 13-16: Apply interventions to the selected cases in both normal and anomalous contexts. For example, in a schematic case of a language model failing on negation, we would ablate the same circuit in normal and negated prompts and compare the effects.

  **Month 5: Analysis and Criterion Refinement**
  - Weeks 17-20: Analyze whether the intervention responses are equivalent. We will use statistical tests to determine if differences are significant. Based on this, we will refine the interventional sameness criterion (e.g., what tolerance level is acceptable?).

  **Month 6: Deliverable Development and Validation**
  - Weeks 21-24: Develop a practical decision procedure (e.g., a checklist or flow-chart) for the lab to use when faced with anomalies. We will validate it by applying it to one new anomaly case and comparing lab members' judgments with and without the procedure.

  **Defense of Method Against Alternatives**

  - *Survey of Practitioners*: A survey could capture current practices but would not resolve the normative question of which criterion is best. We avoid this because our goal is not to document confusion but to provide clarity.
  - *Benchmark*: Creating a benchmark dataset for anomalies would be useful but is too time-consuming for six months and doesn't address the individuation question directly.
  - *Formal Treatment of Causal Graphs*: While causal models are powerful, they require a known causal structure, which is often what we're trying to discover in interpretability. Our method uses interventions to test identity without assuming a full causal graph.

  Our interventional approach is chosen because it is:
  1. Actionable: Interventions are already tools in interpretability.
  2. Objective: Responses to interventions can be measured.
  3. Directly relevant to anomalies: It tests how the mechanism behaves when perturbed.

  **Worked Anomaly Case**

  We present a schematic anomaly case based on common challenges in language models:

  *Case: Negation Failure in a Language Model*
  - **Normal Context**: The model correctly answers questions like "What is the capital of France?" → "Paris".
  - **Anomaly Context**: The model fails on negated questions like "What is not the capital of France?" → Incorrectly outputs "Paris" or random cities.
  - **Candidate Mechanism**: A "fact retrieval" circuit involving specific attention heads and MLP layers.

  We apply the interventional sameness criterion:
  1. **Intervention**: Ablate the suspected fact retrieval circuit.
  2. **Normal Context Response**: Ablation causes the model to output random answers for normal questions (e.g., accuracy drops from 90% to 10%).
  3. **Anomaly Context Response**: Ablation in negated questions: if the accuracy for negated questions remains near 0% (no change) or improves, then the intervention has a different effect, suggesting a different mechanism is at play for negation. If the accuracy drops similarly (e.g., to 5%), then it's the same mechanism.

  This case will be used to test our criterion and refine what counts as "equivalent response".

  **Deliverable and Success/Failure Conditions**

  - **Successful Result**: A decision procedure for the lab in the form of a checklist. The checklist would guide researchers through steps to:
    1. Identify the candidate mechanism for the normal case.
    2. Define a set of interventions.
    3. Measure responses in normal and anomalous contexts.
    4. Compare responses using a defined metric and tolerance.
    5. Conclude same mechanism (if equivalent) or new mechanism (if not).

  We will also provide a taxonomy of anomaly types with worked examples to illustrate common scenarios.

  - **Project Failure**: The project fails if:
    - We cannot define a tolerance level for "equivalent response" that is both practical and philosophically sound.
    - The decision procedure does not resolve ambiguities in real cases (e.g., if interventions are inconclusive).
    - The lab finds the procedure too cumbersome to adopt.

  **Evidence that Would Force a Change of Mind**

  We would abandon the interventional criterion if:
  1. Interventions are shown to be infeasible or too destructive for typical models (e.g., in large language models, ablation might not be tractable).
  2. In all test cases, intervention responses are equally sensitive to irrelevant factors (e.g., random seed), making the criterion unreliable.
  3. A better criterion (e.g., based on causal roles) emerges from the case studies and proves more robust.

  **Honest Assessment of Scope and Cuts**

  This project is ambitious for six months. What could make it too big:
  - **Case Complexity**: Real-world anomalies might involve multiple interacting mechanisms, making interventions hard to isolate.
  - **Generalization**: Extending the method beyond supervised classification to generative tasks or reinforcement learning might require additional work.

  If time runs short, we would:
  1. Cut the number of cases from three to two (one real, one schematic).
  2. Skip the validation step (Month 6) and deliver an unvalidated decision procedure with the understanding that it is provisional.

  We believe the pilot will still provide value by clarifying the criteria we use and establishing a foundation for future work.

  **Conclusion**

  By focusing on interventional sameness, we address a pressing problem in our lab: how to attribute anomalies to known or new mechanisms. The output will be a practical tool that improves our interpretability research, with implications for AI safety and reliability. We welcome feedback from the panel on our approach.
answer: |-
  ### Brainstorming: Candidate Criteria for Mechanism Individuation  
  We begin by outlining four candidate criteria for individuating mechanisms, each applied to a concrete anomaly example. These criteria are derived from philosophical foundations but operationalized for ML interpretability contexts.  

  1. **Sameness of Component Parts and Activities**:  
     A mechanism is individuated by the identity of its physical or computational parts (e.g., specific neurons, layers) and their activities (e.g., activation patterns). *Anomaly Example*: A vision transformer correctly classifies animals in natural images but misclassifies the same animals when rendered as cartoons. If the same neurons activate identically in both cases (despite the output error), it is the "same mechanism failing under new conditions." If activations differ, it is a "new mechanism."  

  2. **Sameness of Causal Role or Input-Output Profile**:  
     A mechanism is individuated by its functional role—mapping specific inputs to outputs—regardless of internal implementation. *Anomaly Example*: A language model answers factual queries correctly in English but fails identically structured queries in low-resource dialects. If the input-output error pattern is identical (e.g., consistently wrong answers for "capital of X" questions), it is the "same mechanism." If the error profile differs (e.g., nonsense outputs), it is a "new mechanism."  

  3. **Sameness Under Stated Interventions**:  
     A mechanism is individuated by invariant responses to experimental interventions (e.g., ablations, perturbations). *Anomaly Example*: A medical diagnosis model works for adult patients but fails for pediatric cases. If ablating a "symptom-analysis circuit" degrades performance equally in both groups, it is the "same mechanism." If ablation affects only one group, it is a "different mechanism."  

  4. **Sameness of Explanatory Function for an Audience**:  
     A mechanism is individuated by its utility in explaining phenomena to a specific audience (e.g., researchers). *Anomaly Example*: A recommendation system amplifies conspiracy theories after a software update. If the explanation ("engagement-maximization bias") remains unchanged, it is the "same mechanism." If a new explanation is needed (e.g., "adversarial manipulation"), it is a "new mechanism."  

  **Convergence**: We select **sameness under stated interventions** as our focal criterion. It is empirically testable, aligns with mechanistic interpretability tools (e.g., circuit ablation), and directly addresses anomalies by probing causal robustness. The other criteria either ignore functional resilience (component sameness), mask internal changes (causal role), or rely on subjective pragmatics (explanatory function).  

  ---  
  ### Proposal: Interventional Individuation of Mechanisms for Anomaly Detection in Machine Learning  

  **Research Question**  
  When an AI system produces an anomalous output, under what conditions do interventions—such as ablating components or perturbing inputs—demonstrate that the anomaly arises from a *known mechanism operating under novel conditions* versus a *genuinely distinct mechanism*? Specifically: **Does the mechanism exhibit invariant response profiles to a defined set of interventions across both normal and anomalous contexts?** This question has a determinate answer: equivalence is settled by statistically comparing intervention outcomes (e.g., output distributions, error rates) in both contexts.  

  **Why Existing Answers Leave This Question Open**  
  Philosophical accounts of mechanism individuation provide broad principles but lack operational specificity for anomaly detection. For instance:  
  - **Component-based views** prioritize structural continuity but struggle when anomalies reveal redundant or multifunctional components (e.g., a "circuit" may reuse neurons for multiple roles). They cannot distinguish between a mechanism failing versus being replaced without intervention data.  
  - **Causal-role views** focus on input-output stability but ignore how internal causal pathways decompose under stress. A consistent error profile could mask compensatory mechanisms (e.g., backup circuits activating), misattributing novelty.  
  - **Pragmatic views** tie individuation to explanatory goals but offer no objective test. This risks conflating epistemic limitations (e.g., incomplete analysis) with ontological distinctions (e.g., new mechanisms).  

  Meanwhile, ML interpretability methods implicitly use mixed criteria: "circuit" analyses often assume component sameness, while "failure mode" studies emphasize causal roles. Neither systematically tests invariance across contexts. Consequently, the anomaly-specific question—*when to reapply existing explanations versus seek new ones*—remains unresolved. Our interventionist criterion bridges this gap by demanding reproducible causal tests.  

  **Method: Six-Month Work Plan**  
  *Weeks 1–4: Taxonomy Development and Lab Discourse Analysis*  
  We will audit our lab’s usage of "same mechanism" claims in past projects (e.g., meeting notes, papers) to catalog implicit criteria. Concurrently, we will build a taxonomy of anomaly types (e.g., distribution shifts, adversarial inputs) and interventions (e.g., neuron ablations, activation patching). *Deliverable: A lab-specific glossary of "mechanism" usage and anomaly categories.*  

  *Weeks 5–8: Case Selection and Schematic Anomaly Construction*  
  We will select two real-world anomalies from our lab’s work (e.g., a language model failing on negation queries) and construct one *schematic anomaly* for controlled testing. For illustration:  
  - **Schematic Case**: A CNN classifier for satellite images correctly identifies "forests" but mislabels drought-affected forests as "deserts." The candidate mechanism is a "texture-detection circuit" (known from normal cases).  

  *Weeks 9–12: Intervention Protocol Design*  
  For each case, we define:  
  - *Intervention set*: Ablating texture-detection neurons; perturbing input textures.  
  - *Invariance metric*: Output distribution similarity (e.g., KL divergence) before/after intervention in normal (forests) vs. anomalous (drought-affected forests) contexts.  
  - *Tolerance threshold*: Quantitative bounds for "equivalence" (e.g., <5% divergence).  
  *Deliverable: Standardized intervention procedures for each case.*  

  *Weeks 13–16: Experimental Testing*  
  We run interventions on both real and schematic models, comparing responses:  
  - If drought anomalies show identical degradation *patterns* to normal forests under ablation (e.g., accuracy drops by 20% in both), the anomaly stems from the known mechanism.  
  - If responses diverge (e.g., ablation *improves* drought accuracy), a distinct mechanism is implicated.  

  *Weeks 17–20: Analysis and Iteration*  
  We evaluate statistical equivalence (e.g., t-tests on divergence scores) and refine thresholds. Conflicting cases (e.g., interventions that satisfy one tolerance but not another) will stress-test our criterion.  

  *Weeks 21–24: Deliverable Refinement and Validation*  
  We develop a **decision procedure checklist** (e.g., "Step 1: Apply baseline interventions to normal context... Step 3: Compare response delta to anomaly context..."). This will be validated via lab-member trials on one held-out anomaly.  

  **Defense of Method Against Alternatives**  
  - *Practitioner Surveys*: Better for documenting *current* beliefs but cannot resolve normative disagreements. We prioritize prescriptive guidance over descriptive analysis.  
  - *Benchmark Creation*: More scalable for engineering but assumes individuation criteria are settled. Our method *tests* criteria against anomalies, avoiding circularity.  
  - *Formal Causal Graphs*: Useful for abstraction but requires full causal specification, which is often intractable in deep learning. Interventions are empirically accessible without exhaustive modeling.  

  Our approach balances philosophical rigor (interventions test causal invariance) and ML practicality (using existing interpretability tools). It is the only alternative that directly addresses "sameness" in failure modes.  

  **Worked Anomaly Case: Schematic Language Model Negation Failure**  
  - **Normal Context**: A transformer LM answers "Where is water not found?" correctly (e.g., "in a vacuum") using a known "negation-handling circuit" (components: attention heads H1, H2).  
  - **Anomaly Context**: The LM fails on structurally identical queries using scientific jargon ("Where is H₂O not found?"), outputting illogical answers (e.g., "in oceans").  
  - **Intervention**: Ablate H1 and H2; measure accuracy drop.  
  - **Analysis**:  
    - If accuracy drops similarly in both contexts (e.g., –40% normal, –35% anomaly), the anomaly is the *same mechanism* under new conditions.  
    - If accuracy drops only in normal contexts (e.g., –40% vs. –5%), a *new mechanism* (e.g., jargon-sensitive pathway) causes the anomaly.  
  This case clarifies how intervention responses disentangle component reuse from mechanistic novelty.  

  **Deliverable and Success/Failure Conditions**  
  - **Successful Deliverable**: A **checklist for mechanism individuation in anomalies**, including:  
    - Step-by-step intervention protocols.  
    - Tolerance thresholds for response equivalence.  
    - Flowchart for "same vs. new mechanism" decisions.  
    Valued for its direct applicability to lab workflows.  
  - **Success**: The checklist resolves ambiguities in ≥80% of trial cases; lab members report improved confidence in anomaly attribution.  
  - **Failure**: The procedure yields inconsistent results (e.g., interventions misclassify the same case across trials) or is deemed unusable due to complexity.  

  **Evidence Forcing Change of Mind**  
  We would abandon the interventionist criterion if:  
  1. Experiments show intervention responses are inherently unstable (e.g., variance exceeds tolerance across random seeds).  
  2. No tolerance threshold achieves >70% consensus in lab validation.  
  3. A simpler criterion (e.g., causal-role equivalence) consistently outperforms it in anomaly classification.  

  **Honest Scope Assessment and Contingencies**  
  - **Risks**:  
    - *Model/Data Constraints*: Training models for schematic cases may delay experiments.  
    - *Intervention Complexity*: Some mechanisms (e.g., distributed circuits) may resist clean ablation.  
  - **Mitigations**:  
    - Use pre-trained models (e.g., Hugging Face) for schematic cases to save time.  
    - Prioritize high-impact, localized mechanisms (e.g., attention heads over MLP layers).  
  - **If Overwhelmed**: We will cut the discourse analysis phase (Weeks 1–4) and rely on published lab materials. This preserves core experimental work but reduces contextual nuance.  

  **Conclusion**  
  Our interventionist approach transforms vague "mechanism sameness" claims into testable procedures for anomaly detection. It integrates philosophical insights (causal invariance) with ML practice (mechanistic interpretability tools), addressing a critical gap in how our lab reasons about failures. The pilot delivers immediate value—a decision checklist—while laying groundwork for broader standards in AI safety and reliability. We welcome the panel’s guidance on refining our intervention protocols for real-world scalability.  

  ---  
  **Word Count**: ~1,800
