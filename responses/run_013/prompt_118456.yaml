answer: |-
  Here's the requirements list for a theory of convention, derived from your cases and constraints, followed by the core tensions and a quick assessment of standard approaches:

  **The Requirements List (What the Theory Must Deliver):**

  1.  **Arbitrariness (Symmetry of Alternatives):** *Must explain why multiple solutions could work equally well for the coordination problem.*
      *   *Case:* Driving on left vs. right. Both sides solve the coordination problem of avoiding collisions equally effectively. The specific choice is arbitrary. Similarly, "fork" vs. "spoon" for a sound meaning, or meters vs. feet.

  2.  **Bindingness (Practical Non-Optionality):** *Must explain why individuals cannot unilaterally deviate without significant cost or failure, even if they prefer an alternative. Conformity becomes practically obligatory.*
      *   *Case:* Driving on the "wrong" side is disastrous. Using "money" that no one else accepts is useless. Ignoring queue order provokes sanctions. Deviating from word meanings causes communication breakdown.

  3.  **Emergence without Agreement/Decree:** *Must explain how the convention arises and stabilizes without requiring explicit collective agreement, central decree, or written codification.*
      *   *Case:* Meanings of words, queuing norms, deference norms. These typically emerge organically through repeated interaction, not formal pacts.

  4.  **Distinction from Mere Regularity/Custom/Fashion:** *Must explain why conventions differ from simple habits ("people often drink coffee in the morning"), customs ("wearing black at funerals" - often laden with tradition/sentiment), or fleeting fads.*
      *   *Case:* Driving side isn't just a habit; deviating causes tangible harm to coordination. Money isn't a custom; its value *depends* on the convention. Units of measurement aren't fashion; switching unilaterally is incoherent. Conventions solve coordination problems.

  5.  **Dynamics (Origin, Persistence, Change, Death):** *Must explain:*
      *   *Origin:* How a convention emerges from a state lacking it (e.g., spontaneous queue formation).
      *   *Persistence:* Why it sticks even if arbitrary and after original rationale is forgotten (e.g., QWERTY keyboard).
      *   *Change/Flip:* How large-scale coordinated shifts happen, often painfully (e.g., Sweden switching driving side, metrication).
      *   *Death:* When and why a convention ceases to function (e.g., obsolete units, dead words).

  6.  **Normative Force (Reason to Conform):** *Must explain the *kind* of reason individuals have to conform, even privately disliking it, and where this reason originates. Crucially, this reason must *not* primarily stem from the intrinsic goodness of the specific action, but from the convention itself.*
      *   *Case:* You use the "wrong" fork not because it's morally better, but because deviating causes social friction/confusion. You drive on the left *because that's what others expect and do*, avoiding a crash. The reason is conditional on others' expected behavior.

  7.  **Criticizability from Outside:** *Must allow for the rational criticism of a convention's fairness, efficiency, or moral implications *without* denying its status as a functioning convention or implying irrationality for those following it.*
      *   *Case:* Criticizing exploitative deference norms ("Why does *he* always get to interrupt?") while acknowledging the current norm exists and participants feel pressure to comply. Criticizing imperial units for inefficiency while using them.

  8.  **Accommodation of Potential Exploitation/Asymmetry:** *Must explain how conventions *can* arise and persist that seem to benefit one group disproportionately (e.g., deference norms), without assuming universal benefit or explicit coercion.*
      *   *Case:* Norms granting certain people automatic priority or interrupting rights. The convention coordinates (defines "who speaks when"), but the *content* favors one party. Adherents might privately resent it but follow due to expectations.

  9.  **Generality (Inclusion of AI Case?):** *Must define convention sufficiently broadly to potentially include phenomena like the AI signaling protocol, *or* provide a clear reason why it should be excluded.*
      *   *Case:* Two AI agents develop a unique, functional signaling system through interaction to solve a coordination task, unreadable by humans. Does this lack something essential (e.g., normative force, potential for criticism)?

  **The Core Tensions & Trade-offs:**

  1.  **Arbitrariness vs. Bindingness (The "Why Bother?" Problem):** This is the *most fundamental tension*. If alternative X is truly just as good as Y (Arbitrariness), why does it feel *obligatory* to do X (Bindingness)? If the left side is as good as the right, why *must* I drive on the left here? The theory must bridge this gap without resorting to "just because" or collapsing into intrinsic value.
      *   **Knockout Requirement:** **#6 (Normative Force).** Explaining the *source* and *nature* of the binding reason to conform to an arbitrary rule is the single hardest requirement. Many theories founder here, either smuggling in intrinsic value, failing to distinguish from mere habit, or ignoring the "private dislike" aspect.

  2.  **No Agreement vs. Obligation (The "Who Says?" Problem):** If no one agreed or decreed it (#3), how can it create a genuine obligation or reason for action (#6)? How does "what people happen to do" become "what one *should* do"? This directly challenges Requirement #6.

  3.  **Functionality vs. Criticizability:** The theory must explain how a convention *works* to solve a coordination problem (#2, #4), while simultaneously allowing us to say it solves it *badly*, *unfairly*, or *unnecessarily* (#7). It must avoid implying that persistence equals justification.

  4.  **Generality vs. Human-Centric Normativity (The AI Problem):** Including the AI case (#9) likely requires stretching concepts like "expectation," "reason," or "criticism" beyond their typical human-social context. Excluding it risks making the theory parochial. Can normative force exist without human-like cognition?

  **How Standard Pictures Fare (Briefly):**

  1.  **Lewisian Coordination + Mutual Expectations (David Lewis):**
      *   *Strengths:* Excellent on #1 (Arbitrariness), #2 (Bindingness via expectations), #3 (Emergence), #4 (Distinction), #5 (Persistence/Change via salience/expectations), #9 (AI fits well - mutual expectations stabilize signaling).
      *   *Weaknesses:* Struggles severely with **#6 (Normative Force).** Why *should* I follow the expectation? It often reduces to mere prudence/avoiding coordination failure, which feels thin for "obligation." Weak on #7 (Criticizability - why criticize a successful coordination?) and #8 (Asymmetry - struggles to explain why exploitative equilibria form/stick beyond salience).

  2.  **Game-Theoretic / Evolutionary (Repeated Play / Evolutionary Stable Strategies):**
      *   *Strengths:* Strong on #1, #2 (Cost of deviation), #3, #4, #5 (Dynamics via selection/payoffs), #8 (Can model asymmetric payoffs), #9 (AI fits naturally).
      *   *Weaknesses:* Also struggles with **#6 (Normative Force).** Conformity is explained as payoff-driven self-interest, not obligation. This struggles to explain *private resentment* combined with conformity (#8). Weak on #7 (Criticizability - the equilibrium is just "what pays," criticism seems irrational). Can be overly mechanical, missing the social "ought" feel.

  3.  **Norm-Based (Conventions as Social Norms):**
      *   *Strengths:* Best shot at **#6 (Normative Force)** - norms carry intrinsic "oughtness" (internalization, sense of obligation, potential sanctions). Handles #7 (Criticizability - norms *can* be bad) and #8 (Asymmetry - norms can encode power) well. Good on #2 (Bindingness via sanction/approval).
      *   *Weaknesses:* Risks collapsing #4 (Distinction from Custom/Norm). Struggles with #1 (Arbitrariness) - why would a powerful *norm* arise for something arbitrary? Why flip painful norms if they carry normative weight? Weakest on #3 (Emergence without agreement - norms often imply shared understanding/agreement) and #9 (AI - lacking norm psychology). Can over-moralize conventions.

  **The Unsatisfiable Core?**
  The tension between **Arbitrariness (#1)** and genuine **Normative Force (#6)** is likely the hardest nut to crack. Theories that nail Arbitrariness & Emergence (Lewis, Game Theory) struggle to explain the "ought" beyond self-interest. Theories that capture Normative Force (Norm-Based) struggle with pure Arbitrariness and Emergence without agreement-like foundations. **Requirement #6 (Normative Force) is the primary bottleneck.** Any theory must either:
  *   Reduce normativity to enlightened self-interest/prudence (weakens "obligation").
  *   Introduce a sui generis "conventional obligation" (mysterious).
  *   Smuggle in normative elements from elsewhere (e.g., implicit agreement, social morality).
  *   Accept that the binding "force" is *only* the practical cost of deviation, not a distinct normative reason.

  The AI case (#9) highlights this: Do the AIs feel "obliged"? Or are they just optimally coordinating? Including them suggests ditching strong normativity. Excluding them suggests normativity is essential, making Requirement #6 even harder. Your suspicion about the central tension is correct. A robust theory must confront this head-on.
