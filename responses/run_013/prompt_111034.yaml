prompt: |-
  i've been argueing with a friend for weeks and i need you to actually put a number on it. The claim: the facts about how mental states are realized in the actual world — different species, different architectures, whatever — give substantial support to functionalism about mental states over type physicalism. By "substantial" i mean: learning those facts should move a reasonable person's credence in functionalism a lot, not just give it a nudge. I'm at about 0.7 on that, she's at about 0.15, and i want to know where the gap actually lives.

  So give me your number for the whole claim, then the decomposition, with a rough probability for each piece and a line of reasoning for each:

  (a) that mental kinds are genuinely realized by physically heterogenously kinds in the actual world — and be careful here, because at a fine enough grain of description everything looks heterogeneously realized (two twins' brains aren't atom-for-atom identical) and at a coarse enough grain everything looks the same (it's all "brain stuff"). So tell me what grain you're using, and why that grain isn't just gerrymandered to deliver MR.

  (b) the disjunction problem: if pain is realized by physical kind A in us and physical kind B in octopuses, why doesn't "A or B" just count as the physical kind that pain is identical to? If that move works, MR comes out true and does no work at all. How likely is it that the move works, or that it fails for some principled reason?

  (c) role functionalism vs realizer functionalism. Role functionalism seems to get MR almost for free; realizer functionalism arguably doesn't. Which one is "functionalism" in the claim above, and how much does your number swing between them?

  (d) one more thing i want in the mix: there's an idea kicking around systems biology about "degeneracy" — many structurally different mechanisms doing the same job within the same organism, not just across species. That strikes me as a cleaner argument for MR than cross-species comparisons, since it doesn't require lining up octopus eyes against human ones. But i suspect it relocates the same problem rather than solving it. Where do you land, and does it move the main number?

  Then: which single term is your final number most sensitive to, and what kind of empirical result would move it the most — something like a creature with no neurons at all but clear mental states, or a case where the same mental state shows up with demonstrably different causal profiles? No reading list, just tell me what the evidence would have to look like.
