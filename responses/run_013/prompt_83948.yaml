prompt: |-
  I dont have any kind of philosophy background, I just read alot about this stuff on my own and argue about it with people, so forgive me if I get a word wrong. My film club keeps going round in circles: somebody says "everyone says it's amazing" about a film they skipped, somebody else says you can't actually think a film is good unless you've watched it, and I can never tell if that's a real point or just a polite way of saying "I saw it and you didn't." I want to build one of those flowchart quiz things that sorts people into boxes by asking about concrete cases, so we can find out what we actually disagree about instead of trading examples.

  Please build it as a numbered list of exactly five items, one question per item, each item a sentence or two, no intro and no wrap-up at the end. Name the boxes where there's a name for them, but the questions have to do the sorting, so phrase each one so a person can answer it without knowing which box it lands them in. No reading lists and no "go look up so-and-so" — I won't, and I don't care who said what.

  The boxes I need it to keep apart: (a) there's nothing to know anyway, it's just your own reaction, or taste is relative; (b) you have to have seen it yourself, no pile of other people's say-so gets you there; (c) you can lean on a good critic the way you lean on a good mechanic, it's just evidence like anything else; (d) the one I only came across recently, that you can know it's good without ever getting what's good about it; and (e) whatever view says the fight is really about something else — not what you can believe, but what you're allowed to say out loud, or whether the thing actually moves you. If two of those end up in the same box, say so in the item where it happens instead of pretending they came apart, and if there's a combination of answers nobody seems to hold, say so and say whether the box is empty because it's incoherent, because it's just unattractive, or because nobody's looked.

  Use cases like these: a film you skipped that everyone you trust loves; a dish you've never tasted; music where a friend's taste has matched yours for years and then suddenly doesn't; a review by a critic you've never heard of; a film every person you trust says is a masterpiece and you watched it and hated it; something you loved first and only later found out it's supposed to be great. Start with whichever question splits the room hardest, and if a question only makes sense for some people, say that in the item rather than asking it to everybody.
reasoning: |-
  Okay, the user wants a philosophy flowchart for their film club debates about whether you can know a film is good without seeing it. They're frustrated with circular arguments and want concrete questions to reveal underlying disagreements. 

  Hmm, they listed five positions: (a) subjective taste, (b) firsthand experience required, (c) trusting experts, (d) knowing without understanding, and (e) meta-arguments about social permission. Clever that they included edge cases like universally praised films you hate.

  Noticing they specifically requested no academic jargon - good, their film club sounds like passionate amateurs. The "no reading lists" demand suggests past frustrations with philosophy bros name-dropping Kant. Must keep this practical.

  Let me structure the flowchart to first isolate the relativists (position a) with the "everyone loves it but you hate it" scenario - that's the nuclear option that splits crowds fastest. Then progressively filter through: 
  - Trusting friends vs critics (positions b/c) 
  - That weird "knowing without understanding" stance (d) 
  - Finally surface the meta-arguments (e) about social performance rather than actual belief.

  Ah, tricky part is position d - it's rare and might overlap with c. I'll flag that in Q3 where they converge. Also position e isn't a belief about art but about social games, so it needs separate handling in Q5 with the "supposed to say" language.

  The dish analogy in Q2 works well - makes abstract concepts tactile. And ending with the "loved before knowing it's acclaimed" case perfectly teases out whether praise retroactively alters experience for them.

  ...Double-checking: all five boxes addressed? Yes. Each question forces concrete choices. No philosophy homework required. Perfect for beer-fueled film debates.
answer: |-
  Here are the five flowchart questions, designed to isolate the core disagreements using your cases:

  1.  **When a film you skipped is loved by everyone you trust, do you believe this *makes* the film objectively good, is it just evidence about their tastes, or does it tell you nothing meaningful about the film's quality itself?** (Splits hard: isolates "a" taste is relative vs. others)
  2.  **If a trusted friend raves about a dish you've never tasted, does this mean you *know* the dish is delicious, does it only mean *they* find it delicious, or is it strong evidence you *probably* will too?** (Distinguishes "b" must experience firsthand vs. "c" expert evidence vs. "a" it's just their taste)
  3.  **A critic you've never heard of writes a rave review for a film. If their arguments seem logically sound based on the film's description, does this give you good reason to believe the film *is* good, even if you haven't seen it?** (Identifies "c" leaning on critic evidence vs. "b" needing firsthand experience; "d" knowing without understanding *might* overlap here if sound logic implies knowing, but they are distinct concepts - consider them together for now).
  4.  **You watch a film widely considered a masterpiece by everyone you trust, but you personally hated it. Does this mean the film *isn't actually good* (despite the consensus), that your personal reaction is just different, or that you might be missing something about its quality?** (Distinguishes "a" taste is relative/personal vs. "b" your experience is definitive vs. "d" knowing it's good despite not getting it/hating it)
  5.  **When discussing a film you loved before knowing it was acclaimed, does arguing *for* its quality feel like defending your genuine reaction, or more like justifying why you're *supposed* to like it?** (Identifies "e" - the fight is about social permission/performance, not belief in quality - vs. views focused on actual belief/experience "a", "b", "c", "d").
