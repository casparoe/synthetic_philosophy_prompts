prompt: |-
  Before my graduate seminar takes up any particular account of probability in the Everettian interpretation, I want the specification of the problem itself worked out, so that we are not evaluating contenders against a moving target. Write the desiderata: what any adequate account of probability in a no-collapse, branching universe must deliver. Include the cases it has to get right, with the consideration behind each — equal-amplitude branchings, unequal amplitudes where no finite counting of branches can reproduce the ratio, a measurement with a continuum of outcomes, and a branching that is later undone by recoherence, where we need to know whether the probability is refunded. Include the distinctions it may not collapse — objective branch weight versus an agent's credence, the probability of an outcome versus its relative frequency in any single world, and the many-worlds reading versus a hidden-variable reading that merely looks branching. Include the formal results it must respect: that the squared-amplitude measure is not negotiable, that any measure over outcomes is constrained by Gleason-type considerations, and that the preferred-basis problem undercuts any naive counting of branches. For each requirement, mark whether it is non-negotiable or merely a commitment of one camp — decision-theoretic derivations, envariance arguments, and self-locating-uncertainty accounts each load the list differently. Then tell me which single requirement, if enforced, would eliminate the most of the live positions, and whether any pair in your list looks jointly unsatisfiable. I care far more about the criteria than the scoring. Above all, I want the requirement that probability not be quietly redefined as an agent's ignorance about which branch he occupies, since that is the move on which several otherwise attractive accounts depend.
reasoning: |-
  Okay, the user is a graduate seminar instructor preparing to discuss probability in the Everettian (Many-Worlds) interpretation of quantum mechanics. They want a solid foundation before evaluating different theories—no moving targets. Let me unpack their request.

  First, they need desiderata: what any adequate account must deliver. The cases mentioned are crucial. Equal-amplitude branching is straightforward but foundational. Unequal amplitudes where branch counting fails—that's important because naive counting doesn't work. Continuum outcomes challenge discrete approaches. Recoherence ("refunding" probability) is tricky and often overlooked. 

  The distinctions section is critical. They emphasize avoiding collapsing objective weight vs. credence. Probability isn't just about ignorance—many theories sneak that in, which the user explicitly rejects. Also, outcome probability vs. relative frequency (since each world sees only one outcome), and Many-Worlds vs. hidden-variable readings. 

  Formal results are non-negotiable. Squared amplitudes must be respected—no alternative measures. Gleason-type theorems justify this. Preferred-basis problem undermines branch counting. 

  Now, tagging each requirement as non-negotiable or camp-specific. The user wants clarity on where positions diverge. Decision-theoretic approaches (e.g., Deutsch/Wallace) treat probability as rational credence, while envariance (Zurek) and self-locating uncertainty (Vaidman) have different emphases. 

  Identifying which requirement eliminates most positions: the no-epistemic-ignorance rule. If enforced, it knocks out Vaidman-style self-locating uncertainty and potentially others. Also, checking if any pair is jointly unsatisfiable—squared-amplitude uniqueness and recoherence probability refunding might conflict if recoherence erases the "past." 

  The user's core concern is preventing probability from being redefined as agent ignorance. That's the red line. They want objective branch weights, not subjective uncertainty. I should ensure this is front and center. 

  I'll structure the response by grouping into cases, distinctions, formal constraints, and categorize negotiability. Highlight the ignorance prohibition and the key conflict. Need to be precise but accessible for grad students. The analysis should empower them to critically assess theories without preconceptions.
answer: |-
  Here is a specification of the problem, distilled into core desiderata for a theory of probability in Everettian quantum mechanics, categorized and annotated for your seminar:

  **I. Essential Functional Requirements (Cases to Get Right):**

  1.  **Equal-Amplitude Branching:** The account must yield probability ~1/2 for each outcome in a symmetric branching (e.g., spin-1/2 measurement in z-basis of |x+> state). *Rationale: Basic empirical adequacy for standard QM predictions.* **Non-Negotiable.**
  2.  **Unequal-Amplitude Branching:** The account must yield probabilities proportional to the *squared amplitude* (e.g., ~1/3 vs. ~2/3) even when no finite branch count reproduces the ratio (e.g., an irrational amplitude ratio). *Rationale: Empirical adequacy for the vast majority of quantum measurements; branch counting is impossible/meaningless.* **Non-Negotiable.**
  3.  **Continuum of Outcomes:** The account must yield a probability *density* over a continuous spectrum of outcomes matching the Born Rule (e.g., position measurement). *Rationale: Empirical adequacy for fundamental continuous observables.* **Non-Negotiable.**
  4.  **Probability Under Recoherence ("Refunding"):** If a branching event is subsequently *undone* by recoherence (interference), the account must specify what happens to the "probability" assigned to the now-vanished branches. Is it "refunded"? Does it become 0? Does the concept become undefined? *Rationale: Tests temporal consistency, the reality/transience of branching, and the connection between probability and physical structure.* **Non-Negotiable (though specific resolution may vary by account).**

  **II. Critical Conceptual Distinctions (Must Not Collapse):**

  5.  **Objective Branch Weight vs. Agent's Credence:** The account must clearly distinguish (though potentially relate) an *objective physical measure* associated with a branch (or set of branches) from an *agent's rational degree of belief* (credence) about future experience. *Rationale: Preserving objectivity of quantum predictions vs. subjective belief; avoiding smuggling in epistemic probability by fiat.* **Non-Negotiable** (Your explicit concern is paramount here).
  6.  **Probability of Outcome vs. Relative Frequency in a World:** The account must explain why an agent should care about the *pre-branching probability assignment* to an outcome, given that *after* branching, in any *single* surviving world/branch, the relative frequency of that specific outcome occurring *in that world's history* is always 1 (it happened). *Rationale: Connects pre-measurement uncertainty to post-measurement experience; addresses the "epistemic problem" head-on.* **Non-Negotiable.**
  7.  **Many-Worlds vs. Hidden-Variable Branching:** The account must be compatible with the core Everettian claim that *all branches are equally real* and that the wavefunction is complete (no hidden variables selecting one branch). It cannot implicitly rely on a hidden variable making only one branch "actual". *Rationale: Faithfulness to no-collapse, unitary-only QM.* **Non-Negotiable.**

  **III. Formal & Structural Constraints:**

  8.  **Squared-Amplitude Measure Non-Negotiable:** The quantitative measure over future branches/histories *must be given by the squared amplitude* (or equivalent, like the norm). This is the quantitative core of the Born Rule. *Rationale: Empirical adequacy; mathematical consistency with QM formalism.* **Non-Negotiable.**
  9.  **Gleason-Type Theorem Constraint:** The derivation or justification of the measure must be consistent with, or explain why, Gleason-type theorems (showing the Born Rule measure is the only consistent probability measure for Hilbert spaces of dimension >2) apply in the branching context. *Rationale: Demonstrates uniqueness and necessity of the Born Rule measure within the formalism.* **Non-Negotiable.**
  10. **Preferred Basis Problem Undercuts Naive Branch Counting:** The account cannot rely on a pre-existing, unambiguous, countable set of "branches" independent of the decoherence process and the observable. *Rationale: Branch count depends on the choice of basis, which is only physically defined via decoherence relative to an environment; naive counting is basis-dependent and ill-defined.* **Non-Negotiable.**

  **Annotation of Negotiability & Camp Commitments:**

  *   **Non-Negotiable (NN):** 1, 2, 3, 5, 6, 7, 8, 9, 10. These are required for empirical adequacy, formal consistency, and adherence to core Everettian principles. Failure on any likely dooms the account.
  *   **Contingent on Approach (CoA):**
      *   **4 (Refunding):** Resolution is crucial but *how* it's resolved depends on the account's ontology/temporality. Some (e.g., "many-instants") might see probability vanish; others (e.g., decision-theoretic) might see the bet canceled; some might deny meaningful probability assignment pre-decoherence.
      *   **Decision-Theoretic (Deutsch-Wallace):** Emphasizes 5 (credence derived from rationality) & 6 (caring due to anticipated experience), potentially downplays 4's significance (focuses on betting *pre*\-measurement).
      *   **Envariance (Zurek):** Emphasizes 8 & 9 (deriving measure from symmetries), downplays ontology of branching (5, 7 slightly less central *in derivation*).
      *   **Self-Locating Uncertainty (SLU - Vaidman, others):** Emphasizes 5 & 6 (credence arises from ignorance of location), makes 4 particularly tricky (does uncertainty vanish?), directly conflicts with the prohibition on epistemic ignorance if not carefully formulated.

  **Your Core Concern - The Red Line:**

  *   **Explicit Prohibition:** "The account **must not** rely on or reduce probability to an *agent's ignorance about which branch they will occupy or 'find themselves in' after branching.* Probability must be grounded in objective features of the wavefunction/decoherence event *prior* to the branching." *Rationale: Preserves the objectivity of probability; avoids circularity (ignorance presupposes probability); prevents Everett from collapsing into a de facto hidden-variable theory where probability quantifies ignorance about a pre-existing outcome.* **Non-Negotiable.** This explicitly targets the foundational move of strong SLU accounts and some naive readings.

  **Analysis of Impact and Tensions:**

  1.  **Single Requirement Eliminating Most Positions:** The **Explicit Prohibition (No Epistemic Ignorance)** likely eliminates the strongest forms of **Self-Locating Uncertainty (SLU)** accounts (e.g., Vaidman's "caring measure" based purely on post-branching ignorance) and potentially undermines naive "branch counting + ignorance" approaches. It forces accounts to ground probability objectively *before* the branching is complete.
  2.  **Potentially Jointly Unsatisfiable Pair:** While all requirements impose strong constraints, the most significant tension exists between:
      *   **4 (Refunding):** Requiring a coherent account of what happens to probability upon recoherence.
      *   **The Non-Negotiable Core (especially 5, 6, 8) + Explicit Prohibition:** If probability is an *objective weight* assigned *to a future branch* based on its amplitude *at the decoherence event*, what happens when that branch is later erased? Does the objective weight "disappear"? Was it never "real" in the first place? If probability is tied to rational pre-measurement decision-making (Decision-Theoretic), recoherence might simply mean the bet is off. However, if probability is an inherent property of the branch *itself* (a harder view to maintain), recoherence poses a deep problem. This tension highlights the difficulty in defining the *temporal location* and *ontological status* of probability in a unitary universe. Resolving this coherently is a major challenge for any account aiming for strong objectivity.

  **Conclusion:**

  This list provides a fixed target. Any contender must:
  *   **Empirically Deliver:** Born Rule probabilities correctly for discrete/equal, discrete/unequal, and continuous cases (1, 2, 3).
  *   **Conceptually Respect:** The objectivity of the measure vs. credence, the pre-branching nature of probability vs. post-branching certainty, and the reality of all branches (5, 6, 7).
  *   **Formally Obey:** The necessity of squared amplitudes, Gleason constraints, and the dependence of branching on decoherence (8, 9, 10).
  *   **Grapple With:** The recoherence challenge (4).
  *   **Crucially Avoid:** Grounding probability in post-branching ignorance (Your Red Line).

  The tension around recoherence (4) and the prohibition on epistemic ignorance are likely the most significant filters and sources of disagreement among viable approaches. This framework should ensure your seminar evaluates contenders against the core challenges of Everettian probability, not shifting desiderata.
