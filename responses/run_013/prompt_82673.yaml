prompt: |-
  I am a third-year philosophy student in a metaphysics seminar on dispositions, and I also sit on my university's student conduct board. After we find that an incident occurred, we decide whether it was out of character — a one-off under pressure — or whether it reveals something durable about the person, and that decision drives the sanction. I cannot state the rule we are actually applying, and for my final paper I want to argue that the practice presupposes a theory of dispositions. What has to be true of a character trait for one incident, or for a clean record, to count as evidence of it? Does our practice need the simple conditional analysis — a person has the trait just in case they would act that way were the situation to arise — or does it need the finkish and masked cases, in which the trait is present but its manifestation is blocked, or is destroyed by the very circumstances that would call it out? I suspect we conflate at least three different excuses (the trait was never there, it was there but masked, it was there and then lost), and I want to know which of them the practice can actually accommodate. The clean-record cases puzzle me most: reading the absence of misconduct as evidence of good character seems to assume that the relevant temptations arose and were resisted, and I cannot see how we would know that. Also tell me whether the practice requires traits to be intrinsic to the person, or whether it survives the thought that some dispositions are partly constituted by their circumstances — and what the board would have to stop doing if we took masking and finking seriously.
reasoning: |-
  Okay, let me start by unpacking this philosophy student's query. They're in a metaphysics seminar on dispositions and also serve on a student conduct board. The board decides sanctions based on whether an incident is out of character or reveals a durable trait. The student wants to argue that this practice presupposes a theory of dispositions and is confused about several aspects.

  First, I need to understand the core question: what must be true of character traits for one incident or a clean record to count as evidence? They mention the Simple Conditional Analysis (SCA) and ask if finkish or masked dispositions are relevant. They suspect three excuses are conflated: the trait was never there, it was masked, or it was lost. Clean records puzzle them because absence of misconduct is seen as evidence of good character, but how do we know temptations arose and were resisted?

  I should start by breaking down how the conduct board's practice relates to dispositional theories. The board uses past behavior (single incident or clean record) to infer a durable trait. This directly ties to dispositional metaphysics. The SCA says a disposition exists iff it manifests when conditions are met. But problems like finks and masks show SCA's limitations—dispositions might not manifest even if present. 

  For the student's three excuses: "trait never there" aligns with SCA failing. "Masked" means the trait exists but is blocked. "Lost" suggests the trait was present but disappeared. The board likely conflates these because distinguishing them requires counterfactual scenarios that are impractical in hearings. For example, proving a trait was masked versus absent is hard without triggering conditions.

  Clean records are tricky. Assuming a clean record implies good character assumes that triggering conditions occurred and were resisted. But maybe the triggers never happened. This is like a finkish case—disposition exists but circumstances prevent manifestation. The board might need evidence that temptations were present to infer good character, but they don't have that data. This challenges the inference from absence of behavior to disposition.

  Intrinsic vs. extrinsic traits matter too. If dispositions are intrinsic, the person's nature is key. But situational factors (like masks) show that context affects manifestation. The board's practice might assume intrinsic traits, but real dispositions are often extrinsic. If they acknowledged masking, they'd need to consider situational blockers, complicating decisions.

  If the board took finks and masks seriously, they'd have to stop assuming that one incident or clean record is clear evidence. They'd need more context about triggering conditions and potential blockers. This could make sanctions more nuanced but also more complex. For example, a one-off might be due to temporary blockers (masking) rather than lack of disposition.

  In summary, the student's argument could show that the board relies on a naive SCA, but real dispositional complexity challenges their inferences. The practice conflates excuses because distinguishing them isn't feasible. Clean records as evidence require unmet assumptions about triggers. Acknowledging extrinsic factors would make the board assess contexts more deeply, which they might not be equipped to do.
answer: |-
  Your conduct board's practice is a fascinating case study in applied dispositional metaphysics. You're right that it presupposes a theory of dispositions (likely an implicit folk theory), and unpacking this reveals tensions with sophisticated philosophical accounts. Let's break this down:

  ### 1. **What Must Be True of Character Traits for Evidence to Count?**
     - **Single Incident as Evidence of a Disposition:** For one incident to reliably indicate a durable trait, the board must assume:
       - **Manifestation Conditions Were Met:** The situation must genuinely trigger the relevant disposition (e.g., temptation for dishonesty, pressure for aggression).
       - **No Masking/Finking:** The disposition must manifest *unless* genuinely absent (i.e., no external blockers or intrinsic finks).
       - **Stability:** The trait must be a *standing property*, not a transient state. A "one-off under pressure" implies the pressure *altered* the agent's normal dispositions temporarily.
     - **Clean Record as Evidence of Good Character:** This requires stronger assumptions:
       - **Triggering Conditions Occurred:** Temptations *must have arisen* and been resisted. If no temptations occurred, the record is evidentially inert (a "finkish absence").
       - **No Mimicking:** The absence of misconduct isn't due to external constraints (e.g., surveillance, lack of opportunity) masking a bad trait.
       - **Dispositional Strength:** The trait must be *robust* enough to manifest across varied (but relevant) circumstances.

  ### 2. **Does the Practice Need SCA, Masking, or Finking?**
     - **Simple Conditional Analysis (SCA)** is the board's *default framework*: "X has a dishonest disposition iff X would lie when tempted." This underpins inferring traits from single acts or clean records.
     - **But Masking/Finking Undermines SCA in Practice:**
       - **Masked Dispositions:** A student with a dishonest trait might not cheat because a friend intervened (masker). The board might misclassify this as "no dishonest disposition."
       - **Finkish Dispositions:** A student might lose their courage precisely when danger arises (fink). The board might see their inaction as "no courageous disposition," even if it existed moments before.
       - **Your Three Excuses Conflated:** The board *does* conflate them because:
         - "Trait never there" (no disposition) and "masked" (disposition present but blocked) are indistinguishable *without counterfactual testing*.
         - "Trait lost" (e.g., due to stress) is treated as "out of character," but metaphysically, it could be a finkish loss of the disposition itself.
       - **Accommodation Limit:** The practice can *only directly accommodate "trait never there."* "Masked" and "trait lost" require counterfactual evidence (e.g., "Would they have done it without intervention?" or "Would they act this way without stress?"), which hearings rarely capture.

  ### 3. **The Clean Record Puzzle**
     - **The Inference Problem:** Reading a clean record as "good character" assumes triggering conditions occurred and were resisted (SCA). But as you note, the board rarely *knows* if temptations arose.
     - **Possible Resolutions in Practice:**
       - **Default Assumption:** The board likely assumes university life *routinely presents relevant triggers* (e.g., academic pressure, social conflict). This is pragmatic but metaphysically shaky.
       - **Burden Shift:** A clean record shifts the burden of proof — misconduct now needs *stronger evidence* to indicate a trait, as it contradicts prior pattern.
       - **Risk of Masking:** A clean record could mean the student is *effectively masked* (e.g., by strict parenting or fear of consequences), not that they lack bad dispositions.

  ### 4. **Intrinsic vs. Extrinsic Dispositions**
     - **Practice Assumes Intrinsicality:** The board treats traits as intrinsic properties of the person (e.g., "they *are* dishonest"). Sanctions aim to *change the person* (e.g., via education or probation).
     - **But Dispositions Are Often Extrinsic:** Many traits depend on circumstances (e.g., "honest when monitored" vs. "honest when alone"). If dispositions are extrinsic:
       - **Sanctions Might Target Circumstances:** Expulsion could remove a "trigger" rather than "fix" the person. Probation might *mask* bad traits via supervision.
       - **Evidence Becomes Relational:** A clean record only indicates good character *in past contexts*. New environments (e.g., unsupervised exams) might reveal different dispositions.
     - **Does the Practice Survive?** Only if it acknowledges that *traits are environment-relative*. A student may be "disciplined" in library settings but "impulsive" at parties. The board rarely probes this.

  ### 5. **What Would Change if Masking/Finking Were Taken Seriously?**
     The board would need to stop:
     - **Assuming Linearity:** Treating one incident → bad trait, or clean record → good trait, without examining:
       - Whether triggering conditions *ever* occurred (for clean records).
       - Whether blockers were present (for single incidents).
     - **Ignoring Contextual Shifts:** Failing to ask if the incident occurred under *abnormal conditions* (e.g., trauma, intoxication) that finked or masked traits.
     - **Overlooking Mimickers:** Not considering if good behavior stems from external constraints (e.g., a student is peaceful only because their aggressive friend graduated).
     - **Sanctioning Naively:** Punishments aimed at "changing character" might be ineffective if traits are extrinsic or finks/masks persist.

  ### Conclusion: What Your Practice Presupposes
  Your board implicitly relies on a **naïve SCA-based folk metaphysics**:
  - Traits are intrinsic and stable.
  - Single acts *reveal* dispositions (if triggers are present).
  - Clean records *reflect* good traits (if triggers are assumed).
  - Excuses are binary: "trait present" (sanction) vs. "trait absent" (leniency).

  **But to function justly,** it needs a **sophisticated dispositional theory**:
  - Evidence requires assessing *triggering conditions* and *potential masks*.
  - "One-off under pressure" may mean a *finkish loss* of a good trait or a *masked* bad trait.
  - Clean records are only evidence if triggers *plausibly occurred*.
  - Sanctions should consider *extrinsic factors* (e.g., changing environments).

  **For your paper:** Argue that the practice *requires* dispositions but *fails* under counterexamples (finks/masks). This creates epistemic injustice—students may be misjudged because metaphysics isn't explicitly debated. Recommend reforms: (1) Probe *why* triggers did/didn’t manifest, (2) Treat traits as context-sensitive, (3) Distinguish "trait absent" from "trait masked/lost" in deliberations. This bridges metaphysics and ethics—highlighting how unexamined assumptions shape real-life outcomes.
