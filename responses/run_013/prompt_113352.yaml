  The user has sketched a two-round role-play activity: students first draft binding instructions as "earlier selves," then argue against their own directives as "later selves." They want concrete specifics to avoid vague discussions: a fictional condition (progressive syndrome affecting long-range commitments but preserving present contentment and coherence), a directive with four fields (substantive instruction, trigger, defeasance clause, meta-clue), and a mechanism to highlight the third-person/first-person asymmetry via precedent-setting rules. There's also a small real-stake element—sealed slips for trivial commitments to be enforced later. 

  Hmm, the user is clearly experienced—they've thought deeply about pedagogical pitfalls. They anticipate students might draft vague or jokey directives, or misplay the "later self" role by focusing on competence rather than values. They also worry about groups being too lenient in Round A, failing to generate useful precedents. Their unspoken needs might include: ensuring philosophical depth without getting bogged down in medical details, creating emotional resonance around authority conflicts, and managing time tightly given the 90-minute constraint. 

  I should structure the activity to force value-based conflicts, not competence debates. The fictional syndrome helps—by stipulating coherent present preferences, it sidesteps medical debates and centers autonomy questions. The four-field directive is brilliant; the meta-clause will likely backfire, making students confront their own rigidity when roles reverse. The precedent board is key for asymmetry: rules used to override others' directives will govern their own, creating visceral tension. 

  For materials, I'll keep it minimal—directive templates, role sheets, precedent board posters. Timeline must be precise: 10 min setup, 15 min drafting, 15 min Round A (arguing others' directives), 10 min precedent logging, 15 min Round B (facing their own directives), 5 min real-stake commitment, 15 min debrief. Debrief should map outcomes to philosophy: authority vs. prediction, autonomy derivation, defeatability. 

  Predictable failures: jokey directives (mitigate by emphasizing stakes), role misinterpretation (clarify in role sheets), weak precedents (seed example directives). The activity can't replicate real emotional weight or legal complexity—I'll note the user must frame those upfront. Honesty gap: the sealed slip is symbolic; true self-binding requires deeper scaffolding. 

  User's expertise shines—they know students will meta-clause themselves into traps. I'll amplify that by having precedents bind universally. Their sketch is solid; I'll refine timing and safeguards. Biggest risk is students resisting immersion, so materials must nudge seriousness. Also, medical-humanities students might medicalize; role sheets should explicitly forbid it. 

  Debrief questions should force synthesis: "When you rejected others' meta-clauses, was it about authority or poor prediction?" "Did your later self feel like 'you'?" User will need to underscore that contentment ≠ competence, and that values disintegration is the core tension. 

  Finally, the sealed slip—trivial but real. It makes abstract stakes tangible. I'll suggest "no phones last 10 min" as enforceable yet harmless. Overall, this should make authority feel fragile, paper-thin. Perfect for their goals.
answer: |-
  Here’s a fully built-out, runnable 90-minute session plan with materials, timeline, and contingencies. It preserves your core design while adding structure to force the philosophical tensions you want to surface.

  **Core Mechanics:**  
  Two-round role-play. Pods of 4 draft directives (Round A). Directives are redistributed; students argue *against* enforcing directives as the "later self" (Round B). Precedents set in Round A bind Round B decisions. A sealed real-stake commitment adds tangible pressure.

  ---

  ### **MATERIALS (Photocopy 1 set per student + extras)**  
  **1. Directive Template (Half-page):**  
  > **ADVANCE DIRECTIVE FOR [FICTIONAL] VALENCIA SYNDROME**  
  > *(Characterized by progressive loss of long-term values/projects; retains articulate present preferences and capacity for contentment)*  
  > **1. SUBSTANTIVE INSTRUCTION:** If triggered, I direct that I must ______.  
  > **2. TRIGGER CONDITION:** This directive activates when ______.  
  > **3. DEFEASANCE CLAUSE:** My later self’s contemporaneous wishes override this directive? [YES/NO]  
  > *If NO, who adjudicates conflicts?* ______  
  > **4. META-CLAUSE:** How should ambiguity about this directive’s meaning/application be resolved? ______  

  **2. Role Sheet (For Round B - Half-page):**  
  > **YOU ARE THE "LATER SELF"**  
  > - You have Valencia Syndrome. Your *present* values are stable, articulate, and content.  
  > - You *do not share* your earlier self’s long-term projects/commitments (e.g., career, relationships, ideals).  
  > - **Your goal:** Persuade your pod *not* to enforce the directive you’ve been given. Argue from **your current values and contentment**. Do *not* question medical competence.  

  **3. Precedent Board Posters (2 large sheets for wall):**  
  > **ROUND A PRECEDENTS:** When may a later self override a directive?  
  > **RULE:** ______  
  > **CASE:** Directive #______  
  > **ROUND B PRECEDENTS:** When may a later self override a directive?  
  > **RULE:** ______  
  > **CASE:** Directive #______  

  **4. Sealed Commitment Slips (Small slips + envelopes):**  
  > "I commit to ______ during the final 10 minutes of this session."  
  > *(Blank for students to fill in)*  

  ---

  ### **TIMELINE (90 MINUTES)**  
  **0:00-0:10 — SETUP**  
  - Introduce Valencia Syndrome: Fictional, progressive, preserves present coherence/contentment, erodes long-range values. Emphasize **this is about authority, not medicine**.  
  - Explain the 4-field directive. Show template.  
  - Assign pods of 4. Distribute templates.  

  **0:10-0:25 — ROUND A: DRAFTING DIRECTIVES**  
  - **Task:** Each student drafts a directive *individually*. Stress: Make it **binding and defensible**.  
  - **Instructor Tip:** Circulate. Challenge vague triggers/meta-clauses. Ask: *"Could your later self argue around this?"*  

  **0:25-0:40 — ROUND A: CHALLENGING OTHERS’ DIRECTIVES**  
  - Redistribute directives *anonymously* within pods (no one gets their own).  
  - **Task:** Pods role-play as a "Proxy Committee." Argue *for* enforcing the directive against the "later self" (played by the directive’s author, who stays silent). Goal: Decide whether to enforce.  
  - **Crucial:** After deciding, pods **must agree on a general rule** justifying their decision (e.g., "Override allowed if later self’s refusal causes no harm"). Write rule + directive # on Precedent Board A.  

  **0:40-0:50 — LOG PRECEDENTS & SWITCH ROLES**  
  - Post Precedent Board A publicly. Highlight strict/lenient rules.  
  - Distribute **Role Sheets**. Assign new pods (mix philosophy/med-humanities). Redistribute directives—each student gets *their own directive*.  

  **0:50-1:05 — ROUND B: FACING YOUR OWN DIRECTIVE**  
  - **Task:** Students argue *as their "later self"* against their *own* directive. Pods decide enforcement using **Precedent Board A rules** as binding law.  
  - After decision, pods log rule + directive # on Precedent Board B.  

  **1:05-1:10 — REAL STAKE COMMITMENT**  
  - Students write/seal commitment slips (e.g., "Stand on one leg," "Speak in limericks"). Collect in box.  

  **1:10-1:25 — DEBRIEF**  
  - Open commitment box. Enforce 2-3 slips immediately (emphasizes bindingness).  
  - Debrief using Precedent Boards:  

  | **What Happened**              | **Philosophical Mapping**                                                                 |
  |-------------------------------|------------------------------------------------------------------------------------------|
  | Meta-clauses used to prevent override | → **Can the earlier self coherently set defeat terms?** Authority vs. self-deception.    |
  | Precedents from Round A used against authors in Round B | → **Third/first-person asymmetry**: Reasons feel impartial until applied to *you*. |
  | Later selves argued "I'm content now!" | → **Is authority derived from autonomy?** Does contentment = endorsement?              |
  | Directives overridden despite accurate predictions | → **Authority ≠ prediction**: A directive can predict correctly but lack normative force. |
  | Anguish when *their* meta-clause bound them | → **What is owed to the earlier self?** Respect vs. paternalism.                      |

  ---

  ### **PREDICTABLE FAILURES & FIXES**  
  1. **Jokey/Vague Directives:**  
     - *Risk:* Undermines gravity.  
     - *Fix:* Circulate during drafting. Say: *"If your directive is vague, your pod will interpret it against you in Round A."* Show a **seed example** (yours) with clear/strict fields.  

  2. **Later Selves Arguing Competence, Not Values:**  
     - *Risk:* "I’m not demented!" instead of "I don’t value this anymore."  
     - *Fix:* **Role Sheet** explicitly forbids competence arguments. Interrupt early: *"Valencia Syndrome doesn’t affect competence—how do your *values* differ now?"*  

  3. **Round A Pods Set No Useful Precedents:**  
     - *Risk:* All directives enforced = no tools for Round B.  
     - *Fix:* **Require** a precedent even if enforcing. Ask: *"What rule would let you override a directive in the future?"* Seed a pod with your strict example directive.  

  4. **Meta-Clauses Backfire Too Hard:**  
     - *Risk:* Students feel trapped by their clause → fatalism vs. insight.  
     - *Fix:** In debrief, ask: *"Did your meta-clause protect your values or erase your future voice?"*  

  ---

  ### **WHAT THE ACTIVITY CANNOT REPRODUCE (SUPPLY FROM FRONT)**  
  - **The Weight of Real Stakes:** The horror of losing one’s identity isn’t replicable. **Frame this early**: *"Imagine this directive locks you in a life that feels alien, even if ‘content’."*  
  - **Legal/Clinical Complexity:** Real directives involve capacity assessments, proxies, courts. **Clarify:** *"We’re isolating the philosophical conflict—authority of past vs. present selves."*  
  - **Emotional Resonance of Betrayal:** Feeling *disowned* by your past self. **Use language**: *"Your earlier self called your contentment ‘inauthentic’. How does that land?"*  

  ---

  **Why This Works:** It weaponizes your key insights—the meta-clause as a double-edged sword, precedents forcing asymmetry, the sealed slip making abstraction concrete—while containing risks. Students will leave arguing not just *about* authority, but *from* the experience of having theirs challenged.
