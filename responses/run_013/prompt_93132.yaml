answer: |-
  ## Term Paper Proposal: Coherence, Exploitability, and the Bounded Agent

  **Title:** Pumping the Bounded: Can Resource-Constrained Agents Escape the Coherence Trap?

  ### 1. Core Question & Candidate Answers
  **Precise Question:** Given an agent with strictly bounded computational resources (finite memory, finite runtime per decision, inability to represent or evaluate arbitrarily complex compound lotteries) and facing only adversaries possessing *equivalent or lesser* computational resources (finite time/sequence length for the pump, inability to generate or evaluate gambles the agent cannot), does there exist a *principled class* of agents that violate Expected Utility (EU) theory (e.g., exhibit strict preference cycles, violate Independence, or have non-linear probability weighting) yet are *provably immune* to being exploited ("money-pumped") by *any* such resource-matched adversary?

  **Candidate Answers:**
  1.  **Strong Coherence Holds:** No. For any bounded agent violating EU maximization, there exists *some* resource-matched adversary capable of constructing a finite, computationally feasible pump sequence that exploits it. EU maximization remains necessary for coherence even under strict resource bounds.
  2.  **Bounded Coherence Gap:** Yes, but only for specific violations or adversary classes. Certain EU violations (e.g., specific forms of intransitivity or probability weighting) become unexploitable when agent/adversary resources are sufficiently bounded, while others (e.g., core Independence violations) remain vulnerable even under tight bounds. The "gap" is structured by the *type* of violation and the *specific* resource constraints.
  3.  **Exploitability Dissolves:** Yes, broadly. Once agent and adversary are symmetrically bounded (especially regarding time/sequence length and computational complexity of gambles), the coherence argument fundamentally collapses. Non-EU agents satisfying plausible constraints (e.g., local transitivity, satisficing, heuristics) can be constructed that are provably unexploitable by any equally bounded adversary. Coherence arguments primarily reveal vulnerability to superhuman adversaries, not inherent irrationality.

  ### 2. Why Standard Positions Leave This Open
  The canonical coherence arguments rely on crucial idealizations often treated as inconsequential:
  *   **Infinite Sequences/Power:** Dutch books and money pumps frequently invoke infinite sequences or require the adversary to construct arbitrarily complex compound gambles (VNM) or wait indefinitely (dynamic pumps). This presumes unbounded time and computational power for *both* agent and adversary, an assumption clearly violated by physical agents.
  *   **Fixed, Complete Preferences:** These arguments model the agent as possessing a *single*, *stable*, *complete*, and *fully accessible* preference ordering over all conceivable gambles (including infinitely complex ones). This ignores the cognitive cost of preference formation, stability under computation, and the agent's inability to represent the very options presented in the idealized pump.
  *   **Omniscient Adversary:** The "adversary" is implicitly granted perfect knowledge of the agent's preferences and unbounded computational power to design the optimal exploitative sequence. This bears no resemblance to interactions between realistically bounded entities.
  *   **Dodging Resources:** Standard defenses often treat resource constraints as mere "practical limitations" separable from the "theoretical" core of rationality defined by coherence. The question is whether this separation holds *in principle* for bounded agents – does the *ideal* norm actually apply to the *real* agent, or does it mischaracterize the relevant notion of "exploitable irrationality"?

  ### 3. Method: Modeling Bounded Agents & Adversaries
  The core method is constructing formal models of agent/adversary pairs with explicit resource constraints and analyzing exploitability. The focus is on *finite* interactions.

  *   **Month 1: Foundation & Simple Models**
      *   Precisely define resource constraints: Finite state space / memory (`M` bits), maximum runtime per decision step (`T` computation steps), maximum length of any pump sequence (`S` steps), inability to represent/evaluate lotteries beyond complexity `C`.
      *   Define a simple **Agent Class (A0):** Fixed, complete preference relation over a finite set of *simple* outcomes and small gambles (complexity << `C`). Non-EU by design (e.g., cyclic preferences over 3 outcomes).
      *   Define simple **Adversary Classes:**
          *   **Adv1 (Commit):** Must specify the *entire* pump sequence (offers 1...S) in advance, before any interaction, subject to resource constraints `M, T, C`.
          *   **Adv2 (Adaptive - Limited Memory):** Can choose each offer based on the agent's previous choice(s), but with its own memory `M` and runtime `T`.
      *   **Analysis Goal:** For (A0 + Adv1) and (A0 + Adv2), determine if *any* pump sequence exists within bounds (`S`, `M`, `T`, `C`) that forces the agent to accept a net loss on *some* initial endowment. Formalize "net loss" relative to initial holdings.

  *   **Month 2: Increasing Complexity - Mutable Agents & Stronger Foes**
      *   **Agent Class (A1 - Mutable State):** Preferences are not fixed but depend on internal state (e.g., current holdings, recent history - bounded by `M`). Decisions are computed by an explicit algorithm (runtime `T`). Violates EU (e.g., uses a regret-minimizing heuristic, prospect theory weighting).
      *   **Adversary Class (Adv3 - Adaptive w/ Learning):** Can adapt offers based on history, *and* has a model of A1's algorithm or can learn aspects of it within runtime `T` and memory `M`. Still resource-matched.
      *   **Analysis Goal:** Can Adv3 find an exploitative sequence (`S` steps) against A1? Can A1 be designed such that *no* Adv3 algorithm (within `M`, `T`) exists that can reliably exploit it? Explore dependence on `S` vs. `M`, `T`.

  *   **Month 3: Synthesis, Generalization & Result Formulation**
      *   Synthesize findings: Under which combinations of constraints (low `S`, low `M`, low `T`, specific `C`) do non-EU agents (A0, A1) become unexploitable by Adv1/Adv2/Adv3?
      *   Identify the *minimal* adversary capability (e.g., adaptive vs. commit, learning vs. no learning) required to pump *specific* EU violations under bounded resources.
      *   Formalize the "principled gap": Characterize the class(es) of non-EU agents and resource constraints (`S`, `M`, `T`, `C`) for which exploitability by resource-matched adversaries is provably impossible.
      *   Contrast with idealized results: Precisely pinpoint where the bounded model diverges from the VNM/Dutch Book conclusions.

  **Why this method?** This approach directly operationalizes "resource-boundedness" and "equal power" in a computationally grounded way. Using toy models allows rigorous proof and characterization of exploitability boundaries, moving beyond hand-waving about "practical limitations." Game-theoretic analysis and automata theory are natural tools. Alternative approaches (e.g., purely conceptual, asymptotic complexity) risk vagueness or failing to capture the finite, immediate nature of the problem.

  ### 4. Result & Failure Conditions
  *   **Successful Result:** A clear characterization demonstrating *either*:
      *   **(Answer 1)** A constructive proof showing how to build a resource-matched adversary (specifying Adv class and required `S`, `M`, `T`, `C` relative to agent constraints) for *any* given bounded non-EU agent specification.
      *   **(Answer 2)** A proof identifying specific EU violations (e.g., cycles of length > K) that are unexploitable when `S < K` or `M` too small to represent `K` options, while violations (e.g., Independence) remain exploitable even with small `S`.
      *   **(Answer 3)** A constructive proof of a bounded non-EU agent (specifying its algorithm and constraints `M`, `T`) alongside a proof that *no* adversary algorithm (within identical `M`, `T` constraints and finite `S`) can guarantee exploitation.
  *   **Project Failure:** The project fails if:
      1.  **No Discernible Pattern:** Analysis shows exploitability depends chaotically on specific parameters without yielding a generalizable principle about the gap.
      2.  **Trivial EU Survival:** The only unexploitable non-EU agents found are trivially "rational" by other compelling standards (e.g., effectively EU-maximizing on the feasible set), failing to establish a *principled* non-EU alternative.
      3.  **Idealization Reasserts:** Analysis reveals that even under tight bounds, *all* constructed non-EU agents remain vulnerable to *some* resource-matched adversary, effectively vindicating the idealized argument's necessity claim for bounded agents.
      4.  **Formalization Collapse:** The formal models prove intractable or impossible to analyze rigorously within the timeframe, preventing clear conclusions.

  ### 5. Scope Check: Semester vs. Dissertation
  *   **Semester-Feasible (If Focused):** This is ambitious but achievable for a semester *if* the scope is tightly controlled:
      *   **Restrict Agent Types:** Focus on 1-2 clear, well-defined non-EU violations (e.g., strict preference cycles over 3-4 outcomes; a simple non-linear probability weighting). Avoid attempting comprehensive coverage of all EU axioms or complex human-like heuristics.
      *   **Restrict Adversary Power:** Start with Adv1 (Commit) and Adv2 (Adaptive w/o Learning). Only introduce Adv3 (Learning) if time permits and results warrant it. Keep sequence length `S` small (e.g., 2-5 steps).
      *   **Simple Complexity:** Define `C` simply (e.g., max depth of lottery nesting = 1 or 2). Define `M` and `T` abstractly (e.g., number of states/computation steps) without low-level implementation.
      *   **Prioritize Proofs over Simulations:** Focus on analytical results for small, tractable models. Avoid complex simulations requiring extensive coding/validation.
  *   **Dissertation Territory (If Expanded):** Expanding to cover multiple EU violations comprehensively, deeply exploring learning adversaries (Adv3), analyzing asymptotic behavior, incorporating richer cognitive models (e.g., metareasoning costs), or conducting extensive simulations would push this into PhD work. The key for the semester is *characterizing the gap* under *minimal, illustrative* bounded conditions, not mapping its entire landscape.

  ### Conclusion
  This proposal directly challenges the interpretation of coherence arguments as demonstrating the *necessary irrationality* of non-EU maximization for physically realistic agents. By rigorously modeling resource-bounded agents facing equally bounded adversaries within finite interactions, it seeks to determine if a principled "coherence gap" emerges where exploitability vanishes. The method leverages formal, computationally grounded models to isolate the impact of key idealizations (infinite power, fixed preferences, omniscient adversary). Success will yield a clear answer to the central question and a characterization of the conditions under which non-EU agents can be considered "bounded-coherent." Failure will provide strong evidence that the coherence arguments retain significant force even under strict resource constraints. This project lies squarely within philosophy of action, decision theory, and bounded rationality, offering a concrete critique of idealized norms.
