answer: |-
  ### Final Examination Question: Decision Theory Seminar  
  **Time Allowed:** 90 minutes  
  **Marks:** 25  

  **Question:**  
  The Pasadena game is played by tossing a fair coin until the first heads appears on toss *n*. The payoff is \((-1)^n \cdot \frac{2^n}{n}\).  
  1. Calculate the expected value of the Pasadena game *in its natural order of outcomes* (i.e., ordered by *n* = 1, 2, 3, ...).  
  2. Explain why this expectation fails to be *well-defined* for expected value maximization (EVM), despite your calculation in (1). Contrast this with the St. Petersburg paradox (where expectation is infinite but defined).  
  3. The Altadena variant adds a constant \(C > 0\) to every payoff of the Pasadena game. Argue informally why this variant *appears* to dominate the original game. Why does this dominance pose a problem for EVM?  
  4. One proposed solution truncates the game after *N* tosses, computes the expectation, and takes the limit as \(N \to \infty\). Is this a satisfactory resolution for EVM? Justify your view.  
  5. Ultimately, does the Pasadena game reveal a *fundamental flaw* in EVM as a theory of rational choice, or merely a technical limitation? Defend your position.  

  ---

  ### Model Answer (≈750 words)  

  #### 1. Expected Value in Natural Order  
  The expected value of the Pasadena game, when outcomes are ordered by the toss number *n* (i.e., *n* = 1, 2, 3, ...), is given by the series:  
  \[
  \sum_{n=1}^{\infty} \Pr(\text{heads on toss } n) \cdot \text{Payoff}(n) = \sum_{n=1}^{\infty} \left( \frac{1}{2^n} \right) \cdot \left( (-1)^n \frac{2^n}{n} \right) = \sum_{n=1}^{\infty} (-1)^n \frac{1}{n}.
  \]  
  This is the alternating harmonic series, which converges to \(-\ln(2) \approx -0.693\).  

  #### 2. Why the Expectation Is Undefined (vs. St. Petersburg)  
  Though the series sums to \(-\ln(2)\) in this order, expectation is **undefined** for EVM. The issue is **conditional convergence**: the series converges *only* when terms are summed in the specific order *n* = 1, 2, 3, ... . By the Riemann rearrangement theorem, reordering the terms can make the series converge to *any real number* or diverge. For example:  
  - Grouping positive terms (\(n\) even) before negative terms (\(n\) odd) produces divergence to \(+\infty\).  
  - Alternating signs differently could yield sums of 10, -5, or no limit.  
  Since probabilities do not impose an intrinsic order on outcomes (all toss sequences are mutually exclusive), EVM requires the expectation to be **independent of summation order**—i.e., absolutely convergent. This fails here.  

  **Contrast with St. Petersburg:**  
  The St. Petersburg paradox has an expectation that *diverges to* \(+\infty\). While this challenges realism (e.g., infinite resources), the expectation is **defined** (as a divergent infinite value). EVM still "gives an answer," even if impractical. The Pasadena game, however, has **no unique expectation**—no single value can be assigned. EVM is *silent*, not merely impractical.  

  #### 3. The Altadena Variant and Dominance  
  The Altadena game adds \(C > 0\) to every Pasadena payoff, so its payoff is \((-1)^n \frac{2^n}{n} + C\). Intuitively, Altadena dominates Pasadena: for every outcome (each *n*), Altadena’s payoff is higher by exactly \(C\). Rational agents should prefer it.  

  This dominance **exacerbates EVM’s problem**:  
  - If Pasadena has no well-defined expectation, Altadena’s expectation is likewise undefined (adding \(C\) preserves conditional convergence).  
  - EVM cannot justify preferring Altadena, since neither game has an expected value to compare. This violates **stochastic dominance**: if one option is always better in every state, it should be preferred. EVM’s silence here suggests a deeper incoherence.  

  #### 4. Truncation: A Repair or Evasion?  
  The truncation proposal computes the expectation for the game stopped after *N* tosses (with payoff 0 if no heads by toss *N*), yielding:  
  \[
  \sum_{n=1}^{N} (-1)^n \frac{1}{n} + \Pr(\text{no heads by } N) \cdot 0 \quad \xrightarrow{N \to \infty} \quad -\ln(2).
  \]  
  This converges to \(-\ln(2)\), but it is **not a resolution for EVM**. It changes the object of evaluation:  
  - We are no longer computing the expectation of the *original game* but of a *sequence of finite games*.  
  - EVM evaluates acts based on their *full* probability space. Truncation substitutes a safer approximation, sidestepping the undefined expectation. While pragmatically useful, this abandons EVM’s core commitment to maximizing over the actual gambles faced. It is a **change of subject**, not a repair.  

  #### 5. A Flaw in EVM or a Technicality?  
  The Pasadena game reveals a **fundamental limitation of EVM**, not merely a technical oversight. EVM fails in two ways:  
  - **Descriptive inadequacy**: It cannot distinguish Altadena from Pasadena, violating dominance.  
  - **Normative incompleteness**: It offers no guidance when expectations are undefined, even for theoretically precise gambles.  

  This is distinct from St. Petersburg’s "resource" or "utility" critiques. Those address *applicability*; Pasadena challenges EVM’s *internal coherence*. A theory of rational choice must handle dominance and undefined expectations robustly. While EVM works for finite or absolutely convergent cases, its breakdown in conditionally convergent scenarios shows it is **incomplete**. Rational agents need supplemental principles (e.g., dominance, truncation limits) for such cases—but these are external to EVM itself. Thus, Pasadena shows EVM is not universally sufficient for rationality.  

  ---

  ### Marking Scheme (25 marks total)  
  **Must-hit points** (5 points × 5 = 25 marks):  

  | **Points**                                                                 | **Marks** | **Common Errors**                                                                 |
  |----------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------|
  | **1. Correctly computes \(-\ln(2)\) for natural order**                    | 5         | Omits signs, miscounts probabilities, or conflates with St. Petersburg.          |
  | **2. Explains undefined EV via conditional convergence (vs. St. Pete)**    | 5         | Calls EV "infinite"; fails to cite rearrangement; misses absolute vs. conditional convergence. |
  | **3. States Altadena dominance & why it challenges EVM**                   | 5         | Claims Altadena has EV = \(-\ln(2) + C\); ignores stochastic dominance.         |
  | **4. Critiques truncation as non-EVM solution**                            | 5         | Assumes truncation "fixes" EVM; doesn’t distinguish limit of EVs from true EV.  |
  | **5. Takes a stance: EVM is incomplete/flawed (not just technical)**       | 5         | Undecided; only lists options; confuses with risk aversion or utility curvature. |  

  ---  
  **Exam Design Notes:**  
  - The question isolates Pasadena’s unique challenge (undefined EV) by requiring explicit contrast with St. Petersburg (infinite EV).  
  - Forces engagement with conditional convergence via rearrangement (not just divergence).  
  - Altadena ensures dominance arguments are central, preventing retreats to "no real-world problem."  
  - The truncation and "flaw vs. technicality" sections demand critical synthesis beyond description.  
  - Students relying *only* on St. Petersburg tropes (utility, resources) will fail points 2 and 5.
