prompt: |-
  I'm closing out a seminar on cyclical vs linear views of history and I'd rather end on a poem than a summary, so: write me a pantoum — the form where lines two and four of each stanza come back as lines one and three of the next, and the last stanza folds its repeats back into the opening. That return is the whole point of using it. The repeated lines should carry the wheel reading (same events, same mistakes coming round again), but the lines you wrap around them should drift enough that by the final stanza the returning line means something different than it did at the start — so the poem also reads as a spiral, not a closed circle. I want it to be about someone living through what feels like a repeat of an earlier crisis and unable to tell whether they're on a wheel or a spiral: could be a ruler watching a familiar dynastic decay play out (group solidarity thinning out over a few generations the way the classic cycles describe, or a constitution curdling into its own corrupt double), could just be a person noticing the same argument arrive back on schedule. Please don't let it land on either "it's all a loop" or "no, we're always moving forward" — I want the reader stuck in between, which is honestly where our discussion ended up. After the poem, add a short note on where it takes liberties with the actual cyclical theories and where the reading it leans on is contested by people who study them, instead of passing off one interpretation as the settled consensus.
reasoning: |-
  Okay, the user wants a pantoum poem to conclude their seminar on cyclical vs linear views of history. They need a poem that captures the tension between repetition and change, using the pantoum's structure to embody both circularity and progression. The repeated lines should signify recurring events, while the variations should suggest evolution, leaving the reader in an ambiguous space—neither pure cycle nor clear progress. 

  The user's deeper request seems to be for an artistic encapsulation of the seminar's unresolved debate. They want the poem to mirror the "stuck in between" feeling their discussion ended with. The historical examples mentioned (dynastic decay, constitutional corrosion, personal arguments) suggest they value concrete metaphors for abstract theories. 

  For the poem, I'll focus on a ruler watching societal collapse recur, using images like "fractured crown" and "fissures spread" to convey structural decay. The shifting context around repeated lines will show subtle changes—"I know this pattern" transforms from observation to resignation. The final stanza must loop back to the first lines but with new weight, avoiding resolution. 

  The follow-up note needs academic nuance: cyclical theories (Polybius, Ibn Khaldun) emphasize predictable recurrence, but critics note each "cycle" has unique contingencies. I'll clarify the poem takes liberties by implying consciousness of repetition (real actors rarely see cycles so clearly) and by blending personal/internal cycles with systemic ones—most theories focus on structures, not individual deja vu. The spiral metaphor itself is contested; some scholars see it as linear bias sneaking in. 

  Key challenge: balancing poetic ambiguity with historical accuracy in the note. Must avoid framing cyclical theories as monolithic while keeping the explanation concise for a seminar wrap-up.
answer: |-
  Here is a pantoum designed to capture the tension between cyclical and spiral views of history, leaving the reader suspended in the uncertainty you described:

  **Pantoum: Watching the Wall**

  **First Stanza:**  
  The stones are shifting, mortar turning grey.  
  **I know this pattern from an older wall.**  
  The fissures spread the same familiar way.  
  **I saw this fracture, witnessed the first fall.**

  **Second Stanza:**  
  **I know this pattern from an older wall.**  
  The cries sound thin, like echoes down a well.  
  **I saw this fracture, witnessed the first fall.**  
  New banners fly, but chant the same old spell.

  **Third Stanza:**  
  The cries sound thin, like echoes down a well.  
  **This crumbling feels like something I have known.**  
  New banners fly, but chant the same old spell.  
  **The seeds of discord, once again, are sown.**

  **Fourth Stanza:**  
  **This crumbling feels like something I have known.**  
  The cold wind bites where once the hearth burned bright.  
  **The seeds of discord, once again, are sown.**  
  Is this recurrence, or a different fight?

  **Fifth Stanza:**  
  The cold wind bites where once the hearth burned bright.  
  A different face stares from the fractured crown.  
  Is this recurrence, or a different fight?  
  The stones are shifting, mortar turning brown.

  **Sixth Stanza:**  
  A different face stares from the fractured crown.  
  The fissures spread the same familiar way.  
  The stones are shifting, mortar turning brown.  
  **I saw this fracture, witnessed the first fall.**

  **Final Stanza:**  
  The fissures spread the same familiar way.  
  **I know this pattern from an older wall.**  
  **I saw this fracture, witnessed the first fall.**  
  *The stones are shifting, mortar turning grey.*

  ---

  **Notes on Cyclical Theories & Liberties Taken:**

  1.  **Consciousness of Repetition:** The poem centers on an individual *aware* they are witnessing a potential recurrence ("I know this pattern"). Most cyclical theorists (like Polybius on *anacyclosis*, Ibn Khaldun on *asabiyyah*, or Spengler/Toynbee on civilizational decline) describe patterns observable *by historians* looking back. Individuals *within* the cycle often lack this meta-awareness; they experience events as novel crises or inevitable progress/decline, not as a conscious replay. The poem personalizes the historian's perspective onto the actor.

  2.  **Ambiguity of Agency & Scale:** The poem blends personal experience ("cold wind bites where once the hearth burned bright") with systemic/political decay ("fractured crown," "banners," "seeds of discord"). Classic cyclical theories primarily operate on macro scales (states, dynasties, civilizations), focusing on structural forces like institutional decay, loss of group cohesion, economic strain, or generational change. The poem suggests these large cycles might manifest *as* intensely personal feelings of déjà vu and powerlessness, which is more evocative than strictly historical.

  3.  **The "Spiral" Question:** The poem leans into the *uncertainty* of whether change is occurring ("Is this recurrence, or a different fight?", "mortar turning brown" vs. "grey"). This ambiguity is central to your request. However, it subtly implies the *possibility* of a spiral through minor differences ("different face," "brown" mortar). Critics of strict cyclical theories (like many modernist and postmodern historians) argue that history is contingent, unique, and non-repeating. They would contend that apparent "cycles" are superficial resemblances masking fundamental differences in context, technology, ideas, and agency. The spiral metaphor itself is often seen by strict cyclical theorists as a concession to linear progress/decline narratives disguised as repetition-with-difference.

  4.  **Predictability vs. Pattern Recognition:** The poem depicts a pattern ("same familiar way") recognized by the observer. Cyclical theories often propose identifiable phases and predictable sequences (e.g., monarchy -> tyranny -> aristocracy -> oligarchy -> democracy -> mob rule -> monarchy). Historians contest the *rigidity* and *predictability* of these cycles. While broad patterns of rise, consolidation, stagnation, and fragmentation may recur, the specific triggers, durations, and outcomes are heavily debated. The poem captures the *feeling* of inevitability ("seeds... once again are sown") that cyclical theories inspire, even if actual historical events are messier and less deterministic.

  5.  **Internal vs. External Decline:** Many cyclical theories emphasize external pressures or systemic logic. The poem hints at an internal, almost psychological dimension ("cries sound thin," "chant the same old spell") – a loss of vitality or conviction *within* the society/relationship. While theorists like Toynbee discussed a "failure of creative response," the poem renders this more intimately than most macro-historical models.

  This pantoum uses the form's inherent recursion to embody the cyclical feeling, while the subtle shifts in context and the unresolved final question strive to leave the reader, like your seminar participants, suspended between wheel and spiral.
