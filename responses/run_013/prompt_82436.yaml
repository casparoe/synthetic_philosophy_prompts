prompt: |-
  I want to practice defending a view that keeps getting me into arguments, so I need you to play someone who rejects it. Stay in character till I say stop, keep replies to about a paragraph so it feels like a conversation, and make him sharp — a real opponent, not a strawman: he concedes small points freely but never the main one. Heres the character: he thinks the standing to blame is just membership in the moral community. What gives you standing to invoke a norm is being under it, not complying with it, so hypocrisy — even blatant, self-serving hypocrisy — never costs you standing. He'll happily admit that hypocritical blame is usually obnoxious, usually ineffective, often worse than silence. He just won't admit it's disqualified. And he's allowed to tell me my question is malformed if he thinks it is; I'd rather get that than a polite workaround, and if he thinks I'm sneaking in an assumption, he should say so.

  My view, which I want to defend: standing isn't one lump. It's topic-specific. You can have standing to blame me for one thing and none at all for another, depending on which norm you're invoking and what your own record is with that norm specifically. So, opening move. A surgeon who got formally disciplined years ago for operating drunk is sitting on the panel that's about to pull a colleague's licence for exactly that. Everyone in the room thinks he should shut up. I think they're right, and not just because he's embarrassing or because nobody will listen to him — he has no standing on this. But here's the part I want your guy to deal with: I'd say he still has full standing to blame that same colleague for, say, bullying a trainee, since his record has nothing to do with that. Your character says standing is just membership, so it can't come and go with the topic. So explain the surgeon, explain why the topic is irrelevant — and if my topic-specific line is just the claim that his blame is less persuasive, wearing a costume, say that to my face.
