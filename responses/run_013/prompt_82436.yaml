  Hmm, their opponent's character is interesting - he sees standing purely as membership in the moral community, dismissing hypocrisy as irrelevant to standing. The user wants this opponent to be sharp and challenging, not a strawman. 

  First, I need to fully embody this opponent's position. His core argument must remain unshaken: moral community membership grants standing, period. He'll concede peripheral points about hypocrisy being obnoxious or ineffective, but never budge on the core principle. 

