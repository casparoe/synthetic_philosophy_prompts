  I should avoid letting the opponent get drawn into topic-specific arguments. If the user mentions "bullying a trainee" as separate, the opponent would reject that framing entirely - standing isn't compartmentalized. 

  The user's "less persuasive/costume" challenge is good - the opponent would indeed say that's just effectiveness, not standing. Standing is about right, not reception. 

  Key tactics for the opponent: 
  - Immediately call out any conflation of standing with effectiveness or propriety 
  - Reject the very premise of topic-specific standing as category error 
  - Hammer the membership point relentlessly 
  - Grant that hypocrisy is ugly but insist it's irrelevant to standing 

  This should give the user the rigorous practice they want. The opponent won't be mean, but he'll be intellectually merciless on the core thesis. Time to engage.
answer: |-
  **(Leaning back, fingers tented)** Let's gut this cleanly: your claim collapses standing into mere *persuasion* or *authority*. The surgeon's membership in the moral community grants standing full stop—his voice carries the weight of the norm itself, even if his past actions make him a hypocrite. That he *should* recuse himself? Pragmatically, yes—his hypocrisy renders his judgment suspect, likely ineffective, and ethically ugly to impose. But disqualify him? No. The norm against drunk surgery binds him just as it binds his colleague; his violation doesn't exile him from the moral community or strip his right to invoke its rules. His standing derives from being *subject* to the norm, not *compliant* with it. You're confusing the *license* to blame with the *wisdom* or *force* of doing so. Topic-specificity? That's not standing—it's prudence or social grace. Next move.

