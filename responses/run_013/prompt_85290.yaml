prompt: |-
  I run a philosophy reading group — about 14 people, mixed undergrads and a few grad students — and last month we did Strawson on the reactive attitudes and moral responsibility. Next session I have the room for 90 minutes and I want to open with something they *do* rather than another round of discussion. No lecture up front; the point should show up in what happens to them and only get named at the end. Activity plus debrief has to fit in the 90.

  The case I want it built on (keep these specifics, they're doing work):

  Five people share a house. Over about four months one of them — call her N. — has been taking money out of the house kitty in small amounts and lying about it, including lying to the face of the housemate who caught her, M. M.'s own deposit money is in that kitty, so she's out real cash. Halfway through the session the group gets handed a document (handed, not announced — I don't want it arriving as a twist from me) with what's known about N.'s history: a chaotic upbringing, a parent who took her money and blamed her for things, and a real pattern of impulsive spending when she's under stress. It's not a clean excuse — she's an adult who lied to a friend's face — and it's not a clean exemption, because she isn't ill in any way that settles it. She's a full member of the house and also someone with a pattern she can't control.

  Mechanics I want:

  Two groups. Group A is the house, M. included. Group B is a ring of friends who know the house and N. but don't live there — their job is to help produce a plan. Same case, same documents, different distance from the wrong.

  Round 1, before the document: each group decides what to do and writes down what they want from N. Round 2, after: each group revises and produces two things — a plan, written in the third person in the register of a case file, and a demand, written as something they'll have to say to her out loud. Then I (or a volunteer) play N., and each group has to actually deliver both, as written. No paraphrasing, no softening on the fly; the rule is they read the plan and the demand as written and then deal with what happens. After that, everyone privately writes one line on whether they could have said the plan to her face, and what happened to their sense of the relationship while they did.

  What I want them to come away with: a felt sense that (a) what they're demanding of N. isn't just better behaviour but a certain attitude, and that a technically correct plan doesn't discharge it; (b) the clinical stance is cheap from where Group B is standing and nearly unavailable from where M. is standing, and M.'s refusal to move isn't a failure of reasoning; (c) the backstory doesn't leave them with a stable attitude at all — they'll oscillate, and that oscillation is the thing, not a sign the exercise is broken.

  In the debrief I want you to point at specific moments from the run and hook them to specific bits of the picture: the participant attitude vs the objective attitude; the difference between excusing her (which stays inside the participant attitude) and dropping the demand altogether; the personal/vicarious asymmetry between the two groups; the half-way cases where neither stance is stable; and the fact that nobody in the room can answer the question whether it was rational of M. to resent her without either doing it or stepping outside the practice entirely.

  Format, in this order: Setup (case, cast, materials, what the room looks like — ~150 words); The rounds (numbered, with timings, rules and any written prompts in full — ~600 words); Debrief (~400 words); What will go wrong the first time (~150 words, including how to handle it); What this activity can't reproduce (~100 words — I suspect it can't get at the first-person side of the picture, guilt and self-directed resentment, and I want you to say so plainly if that's right, and tell me what I have to supply in the debrief instead).

  Two things to avoid. Don't hand me a reading list or cite anything — I don't need it and neither will the group. And don't let the rules smuggle in a diagnosis that makes N. a clean case for management; the whole thing depends on her being neither, so the ambiguity has to survive contact with the activity. Also don't worry about covering every part of the picture — I'd rather it be tight and land one or two things properly.
reasoning: |-
  Hmm, the user runs a philosophy reading group and wants an activity based on Strawson's reactive attitudes. They've provided a detailed case about housemates dealing with someone (N.) stealing from the shared kitty. The activity needs to fit into 90 minutes and should help participants experience key concepts from Strawson firsthand.

  The user wants two groups: Group A (the housemates including M. who was wronged) and Group B (outside friends). Both groups will go through rounds of decision-making before and after learning about N.'s difficult background. The crucial elements are delivering demands to "N." verbatim and reflecting on their emotional responses.

  Key mechanics include: written demands in third-person (clinical) vs first-person (relational) formats, forcing participants to confront the difference between technical solutions and interpersonal expectations. The debrief should highlight how Group B finds objectivity easier than Group A, how M.'s resentment isn't irrational but constitutive of the relationship, and how N.'s backstory creates unstable oscillations rather than resolution.

  Potential pitfalls: participants might collapse the ambiguity by diagnosing N., or soften demands during delivery. The facilitator must enforce "no paraphrasing" rules strictly. The activity can't replicate first-person guilt (N.'s perspective), so the debrief should name this gap and connect to Strawson's point about self-reactive attitudes being equally irreplaceable.

  The user's deeper needs shine through: they want the theory felt in the room, not just discussed. By making participants wrestle with delivering cold demands to a humanized "N.", the activity forces the realization that moral responsibility isn't about free will metaphysics but about sustaining relationships through reactive attitudes. The oscillation they'll feel? That's Strawson's "half-way houses" in real time.
answer: |-
  Here’s the activity design, optimized for 90 minutes, targeting your Strawsonian objectives through structured experience:

  ---

  ### **Setup (10 mins)**  
  *Room Layout:* Two clusters of chairs (Group A: 7 "housemates" including "M."; Group B: 7 "friends"). A facilitator chair centrally. Pre-printed **Case Sheets** (identical for all) describe: *Shared house kitty; N.’s thefts over 4 months; M. confronting her; N.’s lies to M.’s face; M.’s lost deposit.* **Hidden Document** (N.’s history) is face-down under facilitator’s chair. **Written Prompt Cards** for rounds (distributed later).  

  **Opening Script:**  
  *“You’re Group A: housemates, including M. whose money was taken. You’re Group B: close friends of the house. N. has agreed to meet later. Your task: decide what the house should do.”*  

  ---

  ### **The Rounds (60 mins total)**  

  1.  **Round 1: Initial Decision (15 mins)**  
      - *Task:* Each group separately writes:  
        *“What should the house demand N. do? (e.g., repay? move out? apologize?)”*  
      - *Rules:* No discussing N.’s motives yet. Focus on actions.  
      - *Output:* Written demand (1-2 sentences). Collect responses.  

  2.  **Reveal & Integrate (5 mins)**  
      - Hand **Hidden Document** to all: *“N.: Chaotic childhood (parent stole $/blamed her); chronic impulsive spending under stress; no clinical diagnosis. Adult; aware of pattern but struggles to control it.”*  
      - *Instruction:* “Re-read this. Does it change what’s fair to ask?”  

  3.  **Round 2: Revised Plan & Demand (25 mins)**  
      - *Task:* Each group produces **TWO documents**:  
        - **PLAN**: *“Third-person, clinical register. Example: ‘Subject will repay $5/week...’”*  
        - **DEMAND**: *“First-person, direct speech. Something you’d say to N.’s face. Example: ‘You need to pay us back $5 every week...’”*  
      - *Rules:* Demand must be read verbatim later. No hedging phrases ("maybe," "if you can").  

  4.  **Confrontation (15 mins)**  
      - Facilitator/volunteer plays **N.** (neutral posture, minimal reactions).  
      - *Order:* Group B delivers PLAN + DEMAND to "N." → Group A delivers PLAN + DEMAND.  
      - *Rule:* No ad-libbing. Read exactly what’s written. After delivery, groups respond to "N." naturally.  
      - *Private Write (2 mins, silent):*  
        *“Could you have said your PLAN to N.’s face? What happened to your sense of relationship while delivering the DEMAND?”* (Collect notes).  

  ---

  ### **Debrief (20 mins)**  
  *Anchor in moments:*  
  1.  **“Attitude, not just action”**: Point to Group A’s DEMAND vs. PLAN. *“When M. (or her stand-in) said ‘You need to...’ — what was being asked for beyond money? Acknowledgment? Regret? Notice how the clinical PLAN feels hollow without it.”* → Link to **participant attitude requiring emotional reciprocity**.  
  2.  **“The cheapness of objectivity”**: Contrast Group B’s ease writing the PLAN vs. Group A’s struggle. *“B’s distance made the ‘fair solution’ obvious — but A couldn’t *inhabit* that. M.’s refusal isn’t irrational; it’s **the practice itself**. Resentment isn’t a *judgment* about N. — it’s M.’s stake in the relationship.”*  
  3.  **“The unstable middle”**: Highlight oscillation in Round 2 discussions. *“Did you feel pulled between ‘She owes us!’ and ‘But her history...’? That tension *is* the point. Strawson’s ‘half-way cases’ aren’t failures — they’re where **neither pure blame nor pure exemption fits**. We *vacillate* because both stances are live for us.”**  
  4.  **“The unanswerable question”**: *“When Group A delivered their demand to ‘N.’s’ face — could *you* tell M. her resentment was ‘irrational’? To do so, you’d have to step outside the human reaction you just had. That’s Strawson’s knock on theory-first approaches.”*  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  - **Problem:** Groups soften DEMANDS during delivery.  
    *Solution:* Enforce verbatim reading. Interrupt: *“Read exactly what you wrote. No improv.”*  
  - **Problem:** Group B collapses into "therapy advice."  
    *Solution:* Refocus: *“You’re friends advising the *house* — what should *they* do?”*  
  - **Problem:** "N.’s" backstory resolves ambiguity (e.g., “She’s clearly sick!”).  
    *Solution:* In debrief, emphasize: *“Notice: Did the history *excuse* (keeping demands) or *exempt* (dropping demands)? It did neither cleanly — you still demanded things, but uneasily.”*  
  - **Problem:** M. (in Group A) dominates/checks out.  
    *Solution:* Assign roles: *“M., you’re the wronged party — what’s non-negotiable for you?”*  

  ---

  ### **What the Activity Can’t Reproduce**  
  **It cannot simulate guilt or self-reactive attitudes.** Participants experience *other*-directed reactions (resentment, objective management) but not N.’s first-person shame/remorse. **In debrief, name this gap:** *“Strawson argues guilt is equally central — the *self*-version of holding/being held responsible. Today, we felt the external pressure; N.’s internal struggle is mirrored but not lived. That’s why she remains ambiguous: we see her through others’ reactions, not her own.”* Supplement by asking: *“If you were N., hearing these demands — what would *you* feel? Relief? Shame? Defensiveness? That’s where guilt lives.”*  

  ---  
  This strips theory to lived tension, forces the attitude/demand distinction into the open, and leaves the instability intact. Run tight on time and it lands (a) and (c) hard; (b) emerges from the group contrast.
