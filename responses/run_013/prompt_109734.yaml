prompt: |-
  Second-year PhD in philosophy, mostly language and formal epistemology, and I keep running into the same one-liner: you can't put a probability on an indicative conditional. Last week in a reading group someone deployed it twice in ten minutes — first to argue that any betting-style story about conditionals is a non-starter, then to say that a paper I actually like, which assigns credences to conditionals, is just confused about what conditionals are. My gut says the line is doing sevral different jobs at once and that at least one of them is being done badly, but every time I try to say what's wrong I end up gesturing at Lewis's triviality proofs and trailing off.

  What I want from you is a menu rather than a verdict: the distinct precise theses that sentence could be expressing, ordered roughly from the boring/terminological up to the ambitious, with a verdict on each — trivially true, true but weaker than it sounds, genuinely contentious, or false. Is it (a) that indicative conditionals have no truth conditions at all, so there's simply nothing for a probability to attach to; (b) that they do have truth conditions, but the probability of one just isn't the conditional probability of the consequent given the antecedent, so the tidy equation everyone reaches for fails; (c) that you can have credences in them, but those credences aren't probabilities in the standard sense — they don't obey the axioms, or they come out undefined or 0/1 exactly in the interesting cases; (d) something purely about assertion or rational degrees of belief, i.e. the old test of hypothetically adding the antecedent to your beliefs and asking whether you'd then accept the consequent; (e) something about the semantics of the language rather than about what a particular agent happens to believe? And then tell me which of those readings would actually license the two uses from the reading group, and which one I should have in mind when I cite the triviality results back at them — because if the proofs show something narrower than "conditionals have no probabilities," I'd like to know exactly how narrow. If some of these readings are really just different vocabularies for the same underlying claim, say so too, since half my confusion is that people seem to switch between them mid-sentance.
reasoning: |-
  Okay, the user is a second-year PhD student in philosophy, focusing on language and formal epistemology. They keep encountering the claim that you can't assign probabilities to indicative conditionals. In a recent reading group, someone used this line twice: first to dismiss betting-style interpretations of conditionals, and second to criticize a paper that assigns credences to conditionals. The user suspects this claim is doing multiple jobs and wants a breakdown of possible interpretations.

  First, I need to unpack the different meanings behind "you can't put a probability on an indicative conditional." The user provided options (a) through (e), so I should address each. Let me start with (a): no truth conditions. This is radical and associated with expressivists like Gibbard. If conditionals don't have truth values, then probabilities in the standard sense don't apply. But this isn't universally accepted; truth-conditional theorists would disagree. So this is contentious.

  Next, (b): truth conditions exist, but probability isn't conditional probability. Lewis's triviality results show that if you equate P(if A then C) with P(C|A), it leads to contradictions under certain assumptions. Adams's thesis might hold pragmatically but not semantically. This is a key point and directly relates to the triviality proofs the user mentioned. The reading group's dismissal of betting approaches might rely on this, but it doesn't mean no probability at all—just not conditional probability.

  Then (c): credences exist but aren't standard probabilities. Maybe they violate additivity or are undefined in some cases. This is possible under some theories, but it's not the mainstream interpretation. Triviality proofs assume standard probability, so if conditionals require a different system, that's a way out. However, this is more of a niche view.

  For (d), it's about the Ramsey test: asserting a conditional is like hypothetical belief revision. This is about assertion and acceptance rather than truth-conditional probability. The user's liked paper might use this approach, so the critic might conflate truth conditions with acceptance conditions. If the critic is insisting that conditionals can only be assessed via Ramsey, that's a different claim.

  Lastly, (e) is about semantics vs. pragmatics. Is the inability to assign probability a linguistic fact or about agents' beliefs? Triviality proofs are semantic, showing that in a formal system, equating probability with conditional probability leads to issues. But pragmatically, people do assign credences. The critic might be mixing these levels.

  Now, connecting to the reading group's points. The first use was against betting stories. Betting interpretations often assume Adams's thesis, so if triviality shows that P(if A then C) can't be P(C|A), that undermines such approaches. But it doesn't rule out all probabilistic treatments—just those relying on that equation. The second criticism targets a paper assigning credences. If the paper treats conditionals as having truth conditions and probabilities, triviality proofs are a direct challenge. However, if the paper uses a non-truth-conditional approach, it might be valid.

  The user needs to know which interpretation licenses these criticisms. For the betting-story dismissal, (b) is key: if probability can't equal conditional probability, betting frameworks based on that fail. For the paper critique, if the paper assumes truth conditions and equates probabilities, (b) applies. But if the paper avoids that, maybe (a) or (d) is relevant. The user should cite triviality proofs in the context of (b)—they show that under standard assumptions, you can't have both truth conditions and Adams's thesis without triviality.

  Underlying all this might be a conflation of different claims. The critic might be switching between (a), (b), and (d). Clarifying which one they mean is crucial. The user's gut feeling about multiple jobs is spot-on. Highlighting that triviality proofs target (b) specifically, not the broader claim that conditionals have no probabilities, is important. Also, noting that (d) allows for credences via Ramsey test, even without truth values, could defend the paper they like.
answer: |-
  Here's a menu of distinct theses behind "you can't put a probability on an indicative conditional," ordered from least to most ambitious, with verdicts and clarifications. The key is recognizing that this slogan often **conflates semantic, epistemic, and metaphysical claims**, allowing critics to switch meanings mid-argument. Lewis's triviality proofs target a specific, narrow claim—not the broad slogan.

  ### The Menu of Interpretations
  1. **Boring/Terminological: "Probability" requires truth-aptness**  
     *Thesis*: To assign *standard* probability (credence as degree of belief in a proposition), the conditional must express a proposition with a truth value. If indicative conditionals aren't truth-apt, they can't have probabilities in this sense.  
     *Verdict*: **Trivially true** (by definition), but only if you *already accept non-truth-aptness*.  
     *Scope*: Purely semantic. Doesn't preclude non-probabilist accounts (e.g., acceptability conditions).  
     *Who holds this*? Expressivists (e.g., Gibbard), some suppositionalists.

  2. **Moderate Semantic: Conditionals have truth conditions, but P(if A, C) ≠ P(C|A)**  
     *Thesis*: Indicative conditionals express propositions, but their probability *cannot systematically equal* the conditional probability of C given A (Adams' thesis fails as a semantic truth). Lewis's triviality proofs show this under modest assumptions (e.g., non-dogmatism, probability as a function on propositions).  
     *Verdict*: **True and significant** (Lewis proved this). This is the *core technical result*.  
     *Scope*: Semantic/epistemic. Doesn't deny that conditionals *have* probabilities—it denies the *equation* with conditional probability.  
     *Who holds this*? Lewis, Hájek, most formal epistemologists.

  3. **Epistemic Constraint: Credences in conditionals aren't standard probabilities**  
     *Thesis*: We can have degrees of belief in conditionals, but they violate Kolmogorov axioms (e.g., non-additivity) or are undefined/0/1 in critical cases (e.g., when P(A)=0).  
     *Verdict*: **Contentious**. Triviality proofs *assume* standard probability, so this is a *revisionist escape route*. Possible, but requires rejecting standard Bayesianism.  
     *Scope*: Epistemic. Compatible with truth-aptness.  
     *Who holds this*? Schay (1968), some non-classical probability theorists.

  4. **Assertion/Acceptance Primacy: The Ramsey test is primary, not credence**  
     *Thesis*: Rational evaluation of conditionals is *defined* by the Ramsey test (hypothetically add A, evaluate C). "Credence" in a conditional isn't a belief in a proposition but a disposition to infer C under A-supposition.  
     *Verdict*: **True but weaker than it sounds**. Doesn't preclude *modeling* this disposition probabilistically (e.g., P(C|A)). It rejects truth conditions but allows "probability-like" attitudes.  
     *Scope*: Pragmatic/epistemic. Adams' "probabilities of conditionals" are *acceptance degrees*, not credences.  
     *Who holds this*? Adams, Edgington.

  5. **Radical Non-Propositionalism: Conditionals have no truth conditions**  
     *Thesis*: Indicative conditionals don't express propositions at all—they're speech acts (e.g., conditional assertions, epistemic modulations). Thus, no *proposition* exists for credence to target.  
     *Verdict*: **Contentious** (and the strongest reading). Supported by triviality + deflationism about truth, but denied by truth-conditional approaches (e.g., Jackson, Stalnaker).  
     *Scope*: Semantic/metaphysical. Implies (1), but goes further by denying truth-aptness.  
     *Who holds this*? Appiah, Bennett (early), some dynamic semanticists.

  ---

  ### Applying to Your Reading Group
  - **First use (against betting stories)**: Likely invokes **(2) or (4)**.  
    - Betting arguments (e.g., Dutch books) typically assume Adams' thesis (P(if A,C) = P(C|A)). Lewis showed this *must fail* if conditionals are propositions. So betting *based on that equation* is a non-starter **(2)**.  
    - Alternatively, if "betting" requires a proposition to wager on, and conditionals aren't truth-apt **(1 or 5)**, betting is incoherent.  
    *What licenses this?* **(2)** suffices—no need for radical non-propositionalism.

  - **Second use (against your paper)**: Likely invokes **(5) or (2)**, conflated.  
    - If the paper assigns *truth-conditional credences* to conditionals, triviality **(2)** shows it *must* violate Adams' thesis or standard probability. The paper might be "confused" if it ignores this.  
    - If the paper treats conditionals as non-truth-apt but still assigns "probabilities" (e.g., Adams' acceptability), the critic may insist this isn't "real" probability **(1 or 4)**.  
    *What licenses this?* Only **(5)** or strict **(1)** *directly* condemn the paper, but **(2)** undermines truth-conditional + Adams-thesis approaches.

  ---

  ### What to Cite from Lewis
  - **Cite triviality proofs for (2)**: They show that **if** indicative conditionals express propositions with truth conditions, **and** we accept standard probability theory, **then** P(if A,C) = P(C|A) cannot hold universally.  
  - **Crucial nuance**: This does *not* prove conditionals lack probabilities (they might be propositions with non-conditional probabilities), nor does it prove non-truth-aptness. It *only* refutes the *equation* of P(if A,C) with P(C|A) for truth-apt conditionals.

  ---

  ### Strategic Recommendations
  1. **When you hear the slogan, demand disambiguation**: Ask which thesis they mean—truth-aptness? Adams' thesis? Ramsey-test primacy?  
  2. **For the betting critique**: Concede that triviality **(2)** blocks *naive* betting based on P(if A,C) = P(C|A), but note that *non*-truth-conditional accounts (e.g., Adams) can still use "probabilities" operationally.  
  3. **To defend your paper**: If it uses Ramsey-test credences (e.g., P(C|A)), argue it avoids **(2)** by rejecting truth-aptness—so the critic needs to engage **(5)** directly. If it treats conditionals as propositions, show how it evades triviality (e.g., via context-dependence).  
  4. **End the trailing off**: Cite Lewis for **(2)**, then say: "This only shows we can't *equate* P(if A,C) with P(C|A) for truth-apt conditionals. It doesn't show conditionals can't be probable, or that we can't use P(C|A) as an acceptance degree."

  **Underlying confusion**: The slogan often conflates **(2)** (technical result) with **(5)** (metaphysical claim). Your critic likely slides from "probabilities of conditionals aren't conditional probabilities" **(2)** to "conditionals can't have probabilities" **(1/5)**. Lewis only supports the first move—the second requires extra argumentation.
