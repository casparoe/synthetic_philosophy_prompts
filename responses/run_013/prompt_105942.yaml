prompt: |-
  I am a novelist, and I have reached the point in a manuscript where I can no longer afford to be casual about a distinction the whole book rests on. My protagonist is a woman of generous temper who is never once, across three hundred pages, placed in a position to give anything away. The novel requires that she be generous — that the judgment be true of her and not merely a fondness of mine — while granting that nothing she does shows it. A friend who teaches philosophy tells me I am asking about dispositions, that the problems I keep stumbling into have been given names in the literature (finks, masks, mimics), and that the debate has largely concerned what a dispositional property is rather than whether my sentence about her is true.

  Before I read any further into that literature, I want its specification. Set out the desiderata any adequate theory of dispositional properties must meet — the cases it has to get right, the distinctions it must not collapse, the results it cannot contradict — each with the consideration that makes it a requirement rather than a preference.

  The cases I need it to handle are these. First the ordinary ones: the glass that is fragile before it is ever struck, the salt soluble in water it will never meet. Then the interferences, and here I will use my manuscript's own instances, since they are the ones I care about. (a) A man of steady courage who, at the moment danger actually arrives, undergoes a physical change that makes him timid — the arrival of the very circumstance that would have displayed the trait abolishes it. (b) A woman whose kindness is intact but whose circumstances are such that it can never issue in an act; nothing in her is altered, only the world around her. (c) Two characters who behave identically throughout, one cruel by temper and one merely obedient. (d) My protagonist herself, whose trait is never exercised because no occasion ever arises. Tell me what a theory must say about each, and why the natural reading of a disposition ascription — that a thing is disposed to a manifestation just in case it would manifest it were the trigger present — cannot survive (a) and (b).

  Then the further requirements, with the reason behind each. Whether the theory must treat a disposition as intrinsic to its bearer even though no manifestation is possible without the cooperation of the surroundings, and whether it can. Whether it must distinguish a disposition from its categorical basis, and what it must then say about which of the two does the causal work. What makes the associated counterfactual true, and whether that can be said without circularity. Whether traits that show themselves in many different behaviours, and in degrees, must be accommodated. And what the theory owes my protagonist: it must be able to call her generous although nothing in the world ever called it out, and it must not make that truth depend on how the world happens to be arranged.

  Flag the pairs of desiderata you suspect cannot be jointly satisfied — I would rather have one such conflict stated precisely than a long list of uncontroversial requirements — and tell me which single requirement does the most to eliminate candidate theories, and which items on your list are not requirements at all but the prejudices of a particular camp. Close with two or three lines on each of the broad families of view (the reduction of dispositions to their categorical bases, irreducible powers, and any conditional or regularity account), saying only which requirement each one fails. The list is what I need; the scorecard can be brief.
reasoning: |-
  Okay, the user is a novelist grappling with a philosophical problem about dispositions. Their protagonist is described as generous, but the narrative never shows her performing a generous act. They need to understand how to portray a disposition that isn't manifested. 

  The user's friend mentioned philosophical concepts like finks and masks, so they want a clear breakdown of disposition theory requirements. They provided specific cases from their manuscript: a courageous man who becomes timid when danger appears (finkish), a kind woman blocked by circumstances (mask), two characters with identical behaviors but different dispositions, and their unmanifested generous protagonist.

  Hmm, the core tension is between needing dispositions to be intrinsic yet dependent on external triggers. The user wants their protagonist's generosity to be true regardless of circumstances. But traditional counterfactual accounts fail with finks and masks. 

  The hardest requirement seems to be intrinsicity + non-manifestation. Most theories sacrifice one or the other. Powers-based views might work but feel metaphysically heavy. The conditional analysis fails spectacularly on their cases (a) and (b). 

  Also noting the user probably cares more about narrative truth than philosophical purity. Their closing request for a "scorecard" suggests they want practical takeaways, not debates. Should emphasize which theories preserve their protagonist's generosity without manifestation.

  ...And I must flag that no theory perfectly solves all cases. The fink/mask problem is notoriously stubborn. But for their writing purpose, a powers-based view or sophisticated conditional might serve best, despite flaws.
answer: |-
  Here is the specification of desiderata for a dispositional property theory, structured to address your core concerns and manuscript cases, with the rationale for each requirement and critical conflicts highlighted. The most demanding requirements are **bolded**.

  ---

  ### **I. Core Cases & What a Theory Must Say**
  1. **Ordinary Unexercised Dispositions (Fragile Glass, Soluble Salt)**  
     *Requirement:* The theory must affirm these dispositions exist *prior* to manifestation.  
     *Rationale:* Dispositions are properties an object *has*, not merely descriptions of future events.  

  2. **(a) The "Finkish" Man (Courage abolished by danger)**  
     *Requirement:* The theory must affirm he *was* courageous *before* danger triggered the change.  
     *Rationale:* The disposition existed stably but was destroyed by its own triggering condition.  
     *Problem for Conditionals:* "He would be brave if in danger" is false (he flees). Yet intuitively, he *was* brave.  

  3. **(b) The "Masked" Woman (Kindness blocked by circumstances)**  
     *Requirement:* The theory must affirm her kindness persists despite external obstruction.  
     *Rationale:* The disposition is intact; the environment prevents manifestation.  
     *Problem for Conditionals:* "She would act kindly if opportunity arose" may be false (she never acts). Yet she *is* kind.  

  4. **(c) Identical Behavior, Different Traits (Cruelty vs. Obedience)**  
     *Requirement:* The theory must distinguish dispositions from mere behavior.  
     *Rationale:* Dispositions ground *why* behavior occurs; identical acts can have different causal bases.  

  5. **(d) Your Protagonist (Generosity never triggered)**  
     *Requirement:* The theory must affirm her generosity exists *without* manifestation.  
     *Rationale:* Generosity is a trait she possesses, not contingent on external triggers occurring.  

  ---

  ### **II. Foundational Desiderata & Rationales**
  6. **Intrinsicity**  
     *Requirement:* Dispositions must be intrinsic properties of their bearers.  
     *Rationale:* Traits like courage/kindness belong to the *agent*, not the environment.  
     *Tension:* Dispositions *require* external triggers for manifestation, but the *property itself* must not depend on external contingencies.  

  7. **Distinction from Categorical Basis**  
     *Requirement:* A disposition ≠ its physical basis (e.g., neural structure).  
     *Rationale:* The same disposition (e.g., courage) could be realized by different physical states; different dispositions (e.g., courage vs. recklessness) could share a basis.  

  8. **Causal Efficacy**  
     *Requirement:* Dispositions (not just their bases) must play causal roles.  
     *Rationale:* We explain behavior by citing traits ("she helped because she’s kind").  

  9. **Truthmaker for Counterfactuals**  
     *Requirement:* What makes "if triggered, it would manifest" true *without circularity*.  
     *Rationale:* Dispositions can’t be *defined* by conditionals if conditionals depend on dispositions.  

  10. **Multi-Track & Gradable Traits**  
      *Requirement:* Accommodate dispositions that manifest in varied ways/degrees (e.g., kindness via patience, gifts, or forgiveness).  
      *Rationale:* Real traits (like generosity) aren’t single-response mechanisms.  

  11. **Non-Manifestation Independence (Your Protagonist)**  
      ***Requirement:*** A disposition’s existence must not depend on actual external conditions enabling manifestation.  
      ***Rationale:*** Your protagonist is generous *even if* the world never provides an opportunity. The truth of the ascription must be *world-independent*.  

  ---

  ### **III. Key Conflicts & Eliminating Factors**
  - **Unresolvable Tension:**  
    **Intrinsicity (6) + Non-Manifestation Independence (11) vs. Truthmaker for Counterfactuals (9)**  
    - *Conflict:* If dispositions are intrinsic (6) and exist independently of the world (11), what *grounds* the truth of counterfactuals like "if asked, she would give"? The "possible worlds" needed may require contingent environmental facts.  

  - **Most Eliminative Requirement:**  
    **Non-Manifestation Independence (11)** eliminates theories that tie dispositions to actual or possible manifestations (e.g., simple conditional analyses).  

  - **Non-Requirements (Mere Preferences):**  
    - *Reductionism:* Dispositions need not reduce to categorical bases (some view them as irreducible).  
    - *Determinism:* Dispositions can be probabilistic (e.g., "prone to anger" without always manifesting).  

  ---

  ### **IV. Theory Families & Fatal Flaws**  
  | **Theory**               | **Core Idea**                           | **Key Failure**                                  |  
  |--------------------------|-----------------------------------------|--------------------------------------------------|  
  | **Reduction to Bases**   | Dispositions = categorical structures (e.g., atomic bonds). | Fails (c): Same basis could underlie distinct dispositions. Ignores multi-track traits (10). |  
  | **Conditional/Regularity** | Disposition = "would manifest if triggered" (Lewis) or past regularities. | Fails (a), (b): Finks and masks falsify the conditional. Circularity (9). |  
  | **Irreducible Powers**   | Dispositions are fundamental causal powers (e.g., Shoemaker, Mumford). | Struggles with (9): Truthmakers for counterfactuals may require dubious metaphysics. |  

  ---

  ### **V. What This Means for Your Protagonist**  
  No theory perfectly satisfies all desiderata, but **irreducible powers** best uphold her generosity as an intrinsic, world-independent property (meeting 6 & 11). **Sophisticated conditionals** (with "fink-proof" clauses) might salvage truth but risk making the disposition extrinsic. **Reductive views** reduce her generosity to brain states, which may feel artistically hollow.  

  **Final Note:** The hardest requirement—**Non-Manifestation Independence**—is your novel’s cornerstone. Defend it ruthlessly: her generosity is a truth *about her*, not the plot’s possibilities.
