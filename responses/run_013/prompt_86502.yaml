  ## Speech: Centennial Reflections

  Good evening. It’s an honour to stand here tonight. Honest. My dad spent thirty-one years on that floor. He’d be… well, he’d be surprised to see me up here talking to you all, instead of him swapping stories at Table Four. But here we are. A hundred years. That’s worth marking.

  We mark it in a building that tells its own story. The foundations under our feet held up the mill – the noise, the heat, the sheer *force* of it. Men and women knew metal there. They felt it. They listened to the machines like you’d listen to a living thing, knew when a gear was singing wrong or a cut was running true. Skill wasn’t just in the hands; it was in the ear, the eye, the gut. It was *in* you.

  Now, look around. The toolroom’s quiet. The force isn’t steel under pressure; it’s… information. Flowing. And sixty of our own are in there now, not shaping metal, but shaping something else. Grading answers. Feeding judgments into a system. “Skills Transfer,” they call it. Knowledge Contributors, says the plaque. It’s work. Necessary work. Work that keeps paychecks coming in. Leadership fought for that, saw an opportunity where others saw only an ending. And some of you… some of you look at that plaque and wonder what exactly was transferred, and at what cost. That tension’s in the room tonight. It’s real. We all feel it. Families feel it. Old hands feel it. The folks at the new consoles feel it.

  So what do we make of this? What story does *this* chapter tell?

  Here’s a hard truth about tools and the people who use them. When a simple tool becomes a complex machine, something shifts. It’s not that the skill vanishes. Not exactly. It’s like… the knowing how, the deep understanding of the work? It gets pulled out. It gets built *into* the machine itself. It becomes part of the apparatus. And the worker? The worker is left *with* the machine. Tending it. Feeding it. Watching its rhythms, but maybe not feeling them in the same old way. The knowing belongs to the thing now, and the thing belongs to someone else. You’re still essential. The machine doesn’t run without you. But your job changes. It becomes… different. Maybe narrower. Maybe just watching the lights blink where the sparks used to fly.

  And what’s that machine *for*? Is it there to make the work lighter? To give you more time? Or is it there to make the *cost* of the work lighter? To get more done, faster, cheaper? Too often, the promise of ease just means the work stretches longer, pushes harder. The machine demands its pace. The goal isn’t relief; the goal is output. Efficiency. Value extracted. That’s the engine driving it.

  But here’s the twist, the thing that makes this moment so strange, so unsettling, maybe even… significant. That machine running in there now? The whole vast system it feeds? It doesn’t run on coal, or steam, or even just electricity. It runs on knowledge. Not just *your* knowledge as you sit there grading answers. It runs on the accumulated knowing of generations. The math, the logic, the patterns, the sheer collected cleverness of humanity – that’s the fuel. It’s all stored up, built in. Social knowledge. Common wealth.

  And when *that* becomes the real powerhouse, the real source of wealth… what happens to the old measure? What happens to the idea that the value of something comes simply from the hours someone spent making it? It starts to crack. It doesn’t quite fit anymore. The sheer power generated by that stored-up intellect dwarfs the hours spent tending the machine that uses it. That’s a fundamental shift. A tremor in the foundation of how we’ve always thought about work and worth. It leaves the owners of the machines scrambling, trying to fit this new power into their old boxes. And it leaves the rest of us… well, it leaves us standing where we are now, in this repurposed hall, wondering what comes next.

  So where’s the hope in that? Where’s the reason for us, tonight?

  It’s not in pretending the transfer didn’t happen. The knowledge *did* move. The work *is* different. It’s not in pretending that sitting there, judging answers all day, is the same as running a lathe. It isn’t. And it’s certainly not in some vague promise that ‘retraining’ fixes everything, especially when the ‘retraining’ sometimes feels like handing over, piece by piece, the very judgment that made you valuable before, so the machine can learn to do without *that* too.

  The hope, the reason we’re here together tonight, is something simpler. Something older than the mill, older than the data centre. It’s in *us*.

  It’s in the fact that the union fought to keep sixty people working *here*, in *this* town, when the mill shut down. Leadership saw a thread, grabbed it.
  It’s in the fact that those sixty people – former machine operators – bring their own history, their own ingrained sense of quality, their own damn *standards* to that work. They’re not just clicking buttons. They’re applying judgment, hard-won judgment, even if the application feels strange. That judgment matters. It shapes the thing being built.
  It’s in the fact that a minority stood up and said, “Hold on. What are we trading here? Is this dignity?” That question matters. It keeps everyone honest.
  It’s in the families here, supporting their people through wrenching change.
  It’s in the old hands, my father’s friends, who remember the heat, the camaraderie, the pride in a job done right with your own skill – and who haven’t stopped caring about what happens in this building, to these people.
  It’s in the sheer, stubborn fact of this centennial: One hundred years of sticking together. One hundred years of looking out for each other. One hundred years of arguing, yes, sometimes fiercely, about what’s best for the members, but always *as members*. As a *we*.

  The machine changes. The knowledge moves. The work transforms. That’s the relentless tide.

  But the value? The real, enduring value? It isn’t just stored in the machine, or the data, or the system. It’s stored *here*. In this room. In the shared history. In the solidarity. In the willingness to adapt *and* the courage to question. In the judgment you carry, whether you’re grading model answers or remembering the hum of a perfectly tuned press.

  The plaque in the lobby says “Knowledge Contributors.” Okay. But the deeper contribution, the one that truly lasts, isn’t just the data points you feed the system today. It’s the community you sustain. It’s the union you keep alive. It’s the fact that, through a century of upheaval, you’ve held onto the idea that working people deserve a say, deserve respect, deserve to stick together.

  That’s the transfer that matters. That’s the skill no machine can replicate or own. That’s why we’re here tonight. To honour a hundred years of *us*. And whatever comes next for this building, for this work… that ‘us’ is the foundation we build on.

  Thank you. Enjoy the rest of the evening.
