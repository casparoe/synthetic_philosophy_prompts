answer: |-
  ## An Open Letter to the Practitioners of the Reckoning Arts, Concerning Certain Obstinacies

  Gentlemen,

  It has come to my attention, through channels both direct and circuitous, that my demonstrations concerning the quadrature of the circle continue to be met with a singular, and frankly perplexing, resistance from certain quarters nominally dedicated to mathematical rigour. I write not to plead, but to clarify the grounds upon which true understanding must proceed, and to expose the infirmity of the objections raised against me.

  You persist in declaring my constructions faulty. Yet, I must observe that your rejections often partake more of *assertion* than *demonstration*. Recall, if your memories serve (though I begin to doubt their service in this matter), the fundamental principle: **True science is the knowledge of the causes of things, and this knowledge is only possible where we ourselves are the makers.** Geometry is the preeminent science *precisely* because we construct the figures with which we reason; their properties flow necessarily from the generative act, as the effect from the cause. We *make* the line, the circle, the angle; therefore, we can *know* them with absolute certainty.

  Examine my latest construction. Does it not proceed step by step from the agreed definitions of point, line, and motion? Does it not assemble the figure before the mind's eye, as a craftsman assembles a mechanism? The cause of the equality I demonstrate lies manifest in the very act of construction. What more can be required of a demonstration? It possesses the clarity and necessity inherent in the true synthetic method.

  Contrast this with the increasingly fashionable practice of manipulating abstract symbols – this "Algebra," as it is styled. What is it but a kind of *computation*? Symbols shuffled according to rules, divorced from the clear generation of figures. One arrives at a result, perhaps, but *where is the cause revealed*? It is reckoning of consequences, not knowledge of generation. It yields calculation, not science. To rely upon such methods to judge a *geometric* demonstration is to employ a blind man to critique a painting.

  Your objections, sirs, frequently boil down to this: that my construction does not yield the result *you expect*, based upon *your* reckonings. But expectation, however reinforced by symbol-pushing, is not proof. If my construction is clear, if it follows undeniably from first principles concerning generation by motion, and yields a specific proportion, then that proportion *is* the quadrature. To deny it because it contradicts a chain of algebraic manipulations is to elevate computation above genuine causal knowledge. It is to prefer the shadow to the substance.

  I have, in light of certain *persistent misunderstandings* (though not, I stress, any flaw inherent in the principle), refined the construction. The newer method, I submit, renders the equality even more perspicuous, leaving less room for the misapprehensions that seem to plague your examinations. Its cause is yet clearer. I anticipate, though experience tempers optimism, that this will finally settle the matter for those whose eyes are open to the nature of true demonstration.

  Let us be clear on the stakes, which transcend mere lines and circles. My aim in Natural Philosophy, and crucially in Civil Philosophy, is to establish truths with the same indubitable certainty as exists in geometry. The commonwealth, too, is an artefact, made by the consent and covenant of men. To understand its causes, its generation, and thus to possess true *scientia* of its operation and preservation, requires the same method: synthetic demonstration from clear principles of human motion and generation. If the very mathematicians, whose domain is the purest making, cannot recognise a true demonstration when it is presented – if they prefer the obscure reckonings of symbols to the clear light of generative cause – what hope is there for establishing peace upon foundations of reason? How can we demand assent to the necessary truths of sovereignty if the geometers themselves reject necessity when it appears in a form unfamiliar to their computations?

  I therefore challenge you, gentlemen: Refute my construction. But refute it *geometrically*. Show me the flaw *in the generation*. Point to the step where the cause fails, where the motion prescribed contradicts the definitions. Do not hide behind your symbols or appeal to authorities beyond the clear principles of figure-making. Demonstrate, as I have demonstrated, from the cause.

  If you cannot do this – and I suspect the silence, or the continued resort to algebraic murmurings, will prove you cannot – then you must concede the point, or confess that your resistance stems not from reason, but from some other cause. Perhaps the allure of novelty? The vested interest in a method that requires years of obscure study to master? Or perchance, a distaste for the implications such geometric certainty, once established, might hold for philosophies built on less solid ground? I leave you to consider it.

  Your obstinate, yet ever reasonable, servant,

  [T. H.]
  Malmesbury

  ---

  **Notes on achieving the effect:**

  1.  **Deadpan Delivery:** The tone is formal, slightly aggrieved, supremely confident, and utterly serious. The humour lies in the *reader* seeing the gap between Hobbes's ironclad (but flawed) epistemology and the mathematical reality. He never cracks a smile.
  2.  **Hobbesian Doctrine Embedded:**
      *   "knowledge of the causes" / "makers" / "generative act" / "effect from the cause" explicitly state his core view of science.
      *   "construct the figures" / "assemble the figure" / "generation by motion" emphasize geometry as *making*.
      *   "Algebra... computation... symbols shuffled... reckoning of consequences, not knowledge of generation... shadow to the substance" drips with his contempt for non-generative math.
      *   "commonwealth... artefact... synthetic demonstration... clear principles of human motion" explicitly links the math struggle to his political project.
  3.  **Never Concedes:**
      *   Rejections are "perplexing," "assertion," "misunderstandings," "misapprehensions."
      *   Critics have "memories" that might "doubt their service," eyes that might not be "open."
      *   The "newer method" isn't an admission the old was wrong, but a clarification for *their* benefit due to *their* failings.
      *   The challenge ("Refute it *geometrically*") sets impossible terms *he* accepts, framing *their* failure to meet them as *their* fault or bad faith.
  4.  **The Jokes (Structural Irony):**
      *   **Epistemology vs. Theorem:** The core joke is applying his *philosophical* theory of knowledge (which *is* coherent) to demand acceptance of a specific *mathematical result* it cannot actually produce. "My method guarantees truth; therefore, my result *is* true. Your symbol-method is inferior; therefore, your rejection is invalid." The structure *is* the joke.
      *   **Moving Goalposts:** "Your proof doesn't convince me" subtly becomes "Your proof isn't a proof" because it's not *his* kind of proof (geometric generation). He dismisses *their* methods as invalid for judging *his*.
      *   **The Suspicion:** The veiled accusation about "vested interest," "novelty," "obscure study," and implications for "philosophies built on less solid ground" points fingers at Wallis (Oxford Professor) and the Royal Society (experimentalists) without naming them, implying their motives aren't pure math. This reflects Hobbes's real paranoia.
      *   **The Quiet Switch:** "refined the construction... newer method... renders equality even more perspicuous" – the perfect deadpan dodge. He doesn't say the old was wrong; it just needed *refining* because *they* were confused. Classic Hobbesian stubbornness.
  5.  **Stakes Clear:** The final paragraph explicitly connects the mathematical certainty he demands for his circle to the political certainty he needs for his Leviathan. The reader sees that for Hobbes, this isn't *just* about math; the validity of his entire philosophical system feels contingent on winning *this* argument *on his terms*.
  6.  **Voice:** Archaic but not impenetrable ("perchance," "sirs," "reckoning"). Confident, combative ("I challenge you," "I leave you to consider it"), slightly paranoid ("some other cause"), and utterly convinced of his own rational superiority ("ever reasonable"). It *feels* like Hobbes arguing.
