prompt: |-
  I'm a graduate student in a philosophy of science seminar, and the thing I cannot stop turning over is how my university actually sorts the scientific from the unscientific in practice, as opposed to in the textbook story. Our state's science curriculum standards say a topic earns a place in the science classroom only if it issues in testable predictions that could in principle be shown false, and that is the stated reason a set of religiously motivated biological claims are kept out of biology class; the same reasoning is invoked in the editorials whenever a school board fights over it. But in my own department, people cheerfully work on models that, so far as I can tell, no observation could refute -- string-theoretic constructions, certain many-worlds readings, some optimality models in biology -- and when I press them they say those are fruitful, or unifying, or progressive, or that they are just not yet developed enough to be tested, and that this is entirely different from pseudoscience. Meanwhile a friend in the psychology department says her entire methods grade turned on pre-registering a directional, falsifiable hypothesis before touching data, and that anything she finds by exploration is dismissed as merely descriptive and unworthy of publication. When I try to state the rule we are all following, I get three different answers in one afternoon: it is falsifiability, except when it is novel prediction, except when it is fruitfulness over the long run. I would like you to treat this whole cluster -- the curriculum rule, the reviewer's demand for a refutable claim, the tolerance for the unfalsifiable-but-fruitful, and the demotion of the merely exploratory -- as a single existing practice and tell me what it presupposes.

  Please reconstruct the implicit theory of science this practice commits us to: what it assumes about the relation between a theory and experience, about what makes a claim answerable to evidence, and about whether the difference between science and pseudoscience is a sharp line or a matter of degree. Then separate what the practice strictly presupposes from what it merely fits comfortably with -- I suspect the curriculum rule and the lab bench are running on incompatible pictures and that at least one of them is doing rhetorical rather than philosophical work -- and tell me where the practice is philosophically underdetermined, so that several rival accounts of science would license the very same behavior. Consider, as candidates for the presupposed view, a strict falsificationism on which a claim is scientific only if it forbids some possible observation, a view on which what matters is the long-run fruitfulness or progressiveness of a research program rather than any single test, and a view on which scientific status is really about method, community, or inference to the best explanation rather than about logic. Say which of these the practice can actually get by with, which it quietly rules out, and whether any part of it is internally inconsistent. Finally, tell me what would visibly change -- in the curriculum standard, in the referee report, in the methods course -- if we swapped the presupposed view for one of the rivals, and whether anything we care about would be lost.

  Close with a single line in exactly this form, naming the one criterion the practice cannot do without and stating whether the practice strictly presupposes it or merely fits it: Verdict: <criterion> -- <strictly presupposed | merely fits>.
reasoning: |-
  Hmm, the user is a graduate student in philosophy of science who's grappling with how their university distinguishes science from non-science in practice. They've observed contradictions between textbook falsificationism and actual academic practices across different departments. Biology classes exclude religious claims based on falsifiability standards, while physics embraces untestable string theory models for their "fruitfulness." Psychology requires strict pre-registration of falsifiable hypotheses but dismisses exploratory research. The user wants me to reconstruct the implicit theory of science behind these practices.

  I need to analyze this cluster of practices as a whole. The key elements are: 1) curriculum standards using falsifiability as boundary work against pseudoscience, 2) tolerance for unfalsifiable but "fruitful" theories in physics, 3) psychology's demand for pre-registered falsifiable hypotheses, and 4) dismissal of exploratory research as "merely descriptive."

  The apparent contradictions are fascinating. Falsifiability functions as a gatekeeper against pseudoscience in biology education, yet becomes flexible when dealing with cutting-edge physics. Psychology enforces it rigidly at the hypothesis level, but only for publication-worthiness, not for excluding entire fields. This suggests falsifiability serves different purposes: as a demarcation criterion against perceived threats in public education, but as a methodological norm within established sciences.

  What does this practice collectively presuppose? At minimum, it assumes: 1) Empirical accountability matters (though the mechanism is flexible), 2) Science is dynamic (allowing untested but promising ideas), 3) There are epistemic hierarchies (with falsifiable claims ranking higher), and 4) Community judgment is essential (fruitfulness is a social determination).

  The practice quietly rules out strict falsificationism by accommodating unfalsifiable theories. It also conflicts with radical pluralism by dismissing exploratory research. Yet it can't embrace full-blown Lakatosianism either, since the curriculum standards present falsifiability as a bright-line rule.

  The core tension is between falsifiability as a philosophical criterion and as a rhetorical tool. In curriculum battles, it's deployed as a sharp demarcation, while in physics departments it functions more as a regulative ideal. Psychology's version is pragmatic - a quality control measure rather than a definition of science.

  If we swapped presuppositions, interesting changes would occur: Adopting strict falsificationism would purge untestable theories from physics. Embracing Lakatos fully would make the curriculum standard incoherent. Shifting to inference-centered views might rehabilitate exploratory research in psychology.

  The irreplaceable element seems to be the expectation of eventual empirical accountability. The practice can tolerate temporary unfalsifiability but not permanent insulation from evidence. This appears to be strictly presupposed - the moment a field abandons even the promise of testability (like creationism), it gets excluded.

  The verdict should capture this: while falsifiability isn't consistently applied, the commitment to eventual empirical testability is non-negotiable across all cases.
answer: |-
  Your observations reveal a sophisticated tension between the *rhetorical* demarcation criterion used in public discourse (falsifiability as a bright-line rule) and the *pragmatic* criteria governing actual scientific practice (which are pluralistic and context-dependent). The implicit theory of science underlying this practice is a hybrid, presupposing **empirical accountability as a regulative ideal** while accommodating **methodological pluralism** in the short term. Below is a systematic reconstruction.

  ---

  ### **Core Presuppositions of the Practice**
  1. **Empirical Accountability as Non-Negotiable**:  
     The practice strictly presupposes that scientific claims *must answer, in principle, to empirical evidence*. This is not necessarily *falsification* (Popper), but a broader commitment that theories must constrain possible experiences. Unfalsifiable string theory is tolerated only because it *promises* future empirical contact (e.g., via cosmology or particle physics).  
     
  2. **Science as a Dynamic, Temporal Process**:  
     It assumes that scientific work exists on a continuum of maturity. "Fruitfulness" (Lakatos) or "progressiveness" (Laudan) buys time for untestable theories, while exploratory research is seen as *preliminary* to testable hypotheses. The curriculum rule targets *mature* claims (e.g., evolution vs. creationism), not nascent research programs.  

  3. **Hierarchy of Epistemic Values**:  
     Falsifiability is prioritized in *applied* contexts (e.g., hypothesis testing, public education), but in *theoretical* domains, unifying power or mathematical coherence may temporarily override testability. This presupposes that science has multiple aims (explanation, prediction, unification) that trade off against each other.  

  4. **Community Judgment as Final Arbiter**:  
     What counts as "fruitful" or "progressive" is determined by peer consensus, not logical criteria alone. String theory is accepted because physicists deem it productive; exploratory psychology is dismissed because the community values causal inference over description.  

  ---

  ### **What the Practice Merely Fits (But Does Not Strictly Presuppose)**
  - **Strict Falsificationism**: Invoked rhetorically (e.g., in curriculum standards) but violated in practice (e.g., string theory).  
  - **Lakatosian "Research Programmes"**: Fits the tolerance for unfalsifiable-but-fruitful theories but conflicts with the dismissal of exploratory work (which Lakatos might see as early-stage "positive heuristics").  
  - **Inference to the Best Explanation (IBE)**: Aligns with valuing unifying theories but clashes with psychology’s demand for pre-registered falsifiable hypotheses.  
  - **Methodological Naturalism**: Assumed in excluding religious claims but not explicitly governing theoretical work.  

  ---

  ### **Internal Tensions and Underdetermination**
  - **Tension 1**: The curriculum standard treats demarcation as binary (falsifiable = science), while research practice treats it as gradational (e.g., string theory is "more scientific" than astrology but less than quantum electrodynamics).  
  - **Tension 2**: Psychology’s rejection of exploratory work contradicts biology’s use of observational ecology or astronomy—fields where "mere description" is valued.  
  - **Underdetermination**: The practice is compatible with:  
    - **Lakatosianism** (if "fruitfulness" includes heuristic progress),  
    - **Pragmatic Bayesianism** (if "testability" means ability to update credences),  
    - **Sociological views** (e.g., claims become scientific when endorsed by a community).  
    But it **rules out**:  
    - Strict Popperianism (falsifiability is negotiable),  
    - Radical Feyerabendian pluralism (exploratory work is demoted),  
    - Logical positivism (unobservables like strings are tolerated).  

  ---

  ### **Consequences of Swapping Presupposed Views**
  | **Rival View**          | **Change in Curriculum**                          | **Change in Refereeing**                          | **Change in Methods**                             | **Loss**                                  |  
  |-------------------------|--------------------------------------------------|--------------------------------------------------|--------------------------------------------------|------------------------------------------|  
  | **Strict Falsificationism** | Creationism excluded *and* string theory purged  | All unfalsifiable models rejected; exploratory work banned | Only pre-registered hypotheses taught          | Theoretical physics deemed unscientific |  
  | **Full Lakatosianism**     | Standards focus on "progressive" vs. "degenerating" programs | Unfalsifiable-but-fruitful work encouraged; exploratory research valued | Emphasis on long-term program coherence | Clear boundary against pseudoscience lost |  
  | **IBE-Centered View**      | Religious claims excluded as "inferior explanations" | Novel predictions less vital than explanatory breadth | Exploratory work accepted as hypothesis-generating | Falsification as gold standard abandoned |  

  ---

  ### **Verdict: The One Irreplaceable Criterion**
  The practice cannot function without **empirical accountability**—the expectation that claims *must*, eventually, constrain possible experiences. Falsifiability is a *tool* for this, but not the only one. Fruitfulness and unification are tolerated precisely because they are seen as *proxies* for future empirical success. 

  **Verdict: Empirical accountability — strictly presupposed.**  

  ---

  ### **Why This Verdict?**
  - **Curriculum**: Excludes claims that *principally* evade evidence (e.g., creationism).  
  - **Physics**: Untestable theories are defended via promissory notes about *future* tests.  
  - **Psychology**: Pre-registration ensures hypotheses are *answerable* to data, not just descriptive.  
  - **Exploratory Work**: Demoted because it lacks *deductive* empirical constraints—but if it generates testable hypotheses, it’s redeemed.  

  The practice is philosophically messy but pragmatically coherent: it preserves science’s empirical core while allowing flexibility in *how* and *when* that core is engaged. The "rhetorical" use of falsifiability in public debates masks a deeper, more resilient commitment to evidence as the ultimate arbiter.
