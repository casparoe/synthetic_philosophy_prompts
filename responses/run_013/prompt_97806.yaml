prompt: |-
  Hi — I'm a fourth-year PhD student in comparative politics, my dissertation is on the measurement side of backsliding indices rather than the case studies, and I need one satirical piece for a grad blog / concept-clinic thing my department runs. Take the role of someone who's done both this kind of concept work and this kind of institutional copy — a comparativist with a methodology habit and a copywriter's ear. Think through the structure before you write: sketch the questions a client government would actually ask, and the order it would ask them in, then write it. Don't explain the concept to me, don't define terms in a preface, just write the piece.

  What I want is an FAQ from a fake institution. Call it the Office for the Certification of Democratic Backsliding, or a name you like better, but the premise is that backsliding has become something a country can be certified as having, the way you get an ISO standard — auditors, tiers, an appeals process, a fee schedule, a renewal cycle. Deadpan all the way; no winking, no nudging the reader, no "as you can see". If a comparativist reads it and doesn't laugh, I've wasted the slot.

  The jokes have to come out of the actual concept-formation problems, not out of partisan point-scoring. So: whether backsliding has a necessary-and-sufficient core (free and fair elections as the sine qua non) or is a radial, family-resemblance thing with a prototype and a bunch of peripheral members — and what the certification standards would have to look like under each answer. The ladder-of-abstraction worry, Sartori's old one: climb high enough to cover everything and you've stretched the concept until it means nothing, so our standards should say something about which rungs we certify at and which we refuse. The classical-vs-diminished subtype business from Collier and Mahon: a country that does the full backslide and then holds one clean election and recovers — lapsed, recovered, diminished subtype? Do we retro-certify, revoke, or just quietly stop returning its calls. Bermeo's split between backsliding and outright breakdown, which is the one that actually matters for the appeals process: we certify decline, we don't certify collapse, and there should be a tense paragraph about what happens when a client collapses mid-audit and the fee is non-refundable. The two-turnover test — our standards either lean on it or refuse to, and either way that should be a visible fight inside the text. And the who-decides problem: expert coders, a peer panel made up of other certified states, or the electorate itself, with the obvious rejoinder that the certified backslider's voters just re-elected him — the FAQ should answer that without ever sounding like it takes a side.

  Then the partisan-label objection, since that's the one aimed at the real indices. Someone — a client, or our external methodological reviewer — says we only ever certify the governments our funders don't like. Have the institution answer it in the least reassuring way possible, the way real methodologists actually answer it, which is essentially "we're transparent about our coding". You can invent that reviewer and quote them, just don't use a real person's name. And don't lean on real countries in a way that turns the thing into a fact-check; keep the cases generic or plainly hypothetical. No citations, no bibliography, no lit review — you're writing in character.

  About 800 words. Please keep it as continuous prose: no headings, no bullet points, no bold, no tables, no numbered Q's. Fold the questions into the sentences so it reads like an email from a director, since thats the house style for this blog and i can't format anything once it's up anyway. Thanks — this is the last thing on my plate before the deadline.
