prompt: |-
  I'm a philosophy prof and next week I'm running a 90-minute grad seminar on weakness of will and hyperbolic discounting for a mixed room -- half philosophers, half behavioral econ students. I dont need you to explain akrasia to me. I need you to plan the explanation. You're a philosopher who teaches this stuff and also knows the econ side cold, so think carefully about the dependency order before you start writing. Maybe brainstorm the order first, then give me the plan.

  Heres the thing: I want to build the whole session around a distinction I've been calling the 'moment self' vs the 'calendar self' -- not a standard term, just my pedagogical crutch. The moment self chooses now under whatever is salient; the calendar self makes plans for a future that keeps arriving. I want the seminar to show that a lot of what gets called akrasia is actually a clash between these two, and that hyperbolic discounting is one formal way of making that clash precise, but not the only one and maybe not the right one.

  So: what has to come first for that distinction to land? Give me the order of ideas and say what depends on what. Whats the carrying example? I was thinking of the Sunday-night-plan, Monday-night-scroll thing but it feels tired, so either fix it or replace it with something that does the work -- it needs to be concrete enough that the econ students can write a discount function for it and the philosophers can argue about whether its really a failure of will. Tell me what the example has to have and what it must not have. Which misconceptions should I expect, and where exactly in the sequence should I head each off? I'm expecting: akrasia is just impatience; hyperbolic discounting explains all weakness of will; present bias is automatically irrational; the 'two selves' picture is literal; and that if preferences reverse, the later preference is the 'real' one. Tell me if I'm missing any. Also give me one question to ask at the end that would tell me whether they've got the distinction rather than just memorized the discounting formalism. And what should I openly refuse to explain at this level, and say so? Dont give me readings or citations. I just want the teaching plan.
reasoning: |-
  Okay, let me start by unpacking the professor's request. They're a philosophy professor preparing a 90-minute grad seminar on weakness of will and hyperbolic discounting for a mixed group of philosophers and behavioral econ students. The core idea is to frame the discussion around the 'moment self' vs. 'calendar self' distinction. 

  First, I need to consider the dependency order. The key is making sure the moment/calendar distinction lands before introducing technical models. If we jump into hyperbolic discounting too early, the econ students might fixate on the math while philosophers get alienated. The distinction must feel intuitive first - like a human experience everyone recognizes.

  Hmm, the Sunday-night-plan/Monday-night-scroll example feels tired as they said. What alternative creates the same tension but feels fresher? Maybe... a daily writing commitment? Where the calendar self plans 500 words/day but the moment self keeps choosing urgent emails over writing. That's concrete for discount functions (econ can model the choice delay) but also rich for philosophical debate (is this really "weakness"?).

  Important traps to avoid in examples: no addiction framing (too pathological), no trivial choices (like snacks vs. kale). Must show non-pathological, high-stakes conflict where both selves have rational claims. The writing example works - urgent tasks feel legitimately pressing in the moment.

  Now misconceptions. They listed five, but I'd add one more: that resolving conflict means "fixing" the moment self. The professor might want to emphasize that calendar self isn't inherently wiser. Also, philosophers might push back on reifying "selves" - need to clarify it's metaphorical early on.

  For the structure, I'm thinking:
  1. Start with raw phenomenology - make them feel the clash first. Have students share personal examples (but brief!).
  2. Then introduce moment/calendar as descriptive labels for that experience. 
  3. Only after that, show how exponential discounting fails this, then introduce hyperbolic as one modeling approach. 
  4. Crucially, discuss alternatives like preference reversals without commitment to multiple selves.

  Ah, and the closing question should test if they distinguish the model from the phenomenon. Maybe: "If we found neural evidence of hyperbolic discounting, would that prove the moment/calendar self exists?" That forces them to separate mechanism from metaphor.

  Finally, boundaries: we won't solve normative debates about rationality or discuss therapeutic interventions. Just map the conceptual territory. 

  The pacing seems tight but doable: 15min phenomenology, 20min distinction, 25min modeling, 20min limitations, 10min discussion. Econ students might chafe at delaying math, but it'll pay off when they see the models grounded in lived experience.
answer: |-
  Here’s a battle-tested seminar plan centered on your "moment self" vs. "calendar self" framework, designed to force the distinction to land while preempting misconceptions. The sequence ensures each concept builds on the prior step, with the example engineered for dual analysis.

  **Core Sequence & Dependencies:**  
  *(Total: 90 min = Intro 5m + Parts 1-4: 70m + Synthesis 15m)*  

  **Part 1: The Phenomenology First (15 min)**  
  *Why start here?* Without a visceral grip on the conflict, "moment/calendar self" is jargon. Philosophers need the lived tension; econ students need the anomaly to model.  
  - **Open:** "Describe a time you *deliberately* broke a plan you still endorse. Not moral weakness, but a 'why did future-me sabotage past-me?' moment." (Share brief stories → whiteboard patterns).  
  - **Introduce Your Distinction:**  
    - **Moment self:** Chooses *now* under the spotlight of salient cues (fatigue, convenience, temptation).  
    - **Calendar self:** Plans *across time* for a "future now" that keeps arriving (coherent goals, delayed rewards).  
    - *Key: Emphasize both are "you" – it’s a conflict of context, not homunculi.*  
  - **Head Off Misconception:** "This isn’t literal multiple selves. It’s a metaphor for how agency fractures *temporally*."  

  **Part 2: The Carrier Example – "The Dissertation Hour" (20 min)**  
  *Why this works:*  
  - **Concrete:** Calendar self plans: "Every day 9-10 AM = write, no exceptions." Moment self (on day 3) hits snooze, then "quickly" checks email → trapped in inbox.  
  - **Model-Ready:** Econ students can sketch utility: U(writing) is high long-term but costs effort *now*; U(email) is low-reward but zero effort *now*.  
  - **Philosophically Rich:** Is this "weakness"? Intentions were sincere, action intentional. But coherence failed.  
  *What it avoids:* Pathologizing (no addiction), triviality (high stakes), and implies *repeated* conflict (not one-off).  
  - **Activity:** Philosophers argue: "Is this akrasia if both choices are intentional?" Econ students sketch discount curves qualitatively.  

  **Part 3: Formalizing the Clash – Hyperbolic Discounting as *One* Lens (20 min)**  
  *Dependency:* Now that the conflict feels real, show how models try to capture it.  
  - **Contrast with Exponential Discounting:**  
    - Calendar self ≈ exponential discounter (consistent patience).  
    - Moment self’s "present bias" breaks consistency. Show: *"I’ll skip today but write tomorrow" becomes "I’ll skip now" when tomorrow arrives.*  
  - **Hyperbolic Discounting:** Demonstrate steep drop in discount factor for immediate rewards vs. future. Use the example: *Delaying writing by 1 hour feels trivial when planned tonight (low cost), but unbearable when the alarm rings (high cost).*  
  - **Head Off Misconceptions:**  
    - "This is *not* just impatience. Impatience is stable. This is *time-inconsistent* preference reversal."  
    - "Hyperbolic discounting *describes* the clash; it doesn’t *explain all* weakness of will (e.g., value incommensurability isn’t captured)."  
    - "Present bias isn’t *automatically irrational* – it may reflect rational attention to urgent cues (e.g., exhaustion)."  

  **Part 4: Beyond the Model – Limits & Alternatives (15 min)**  
  *Why here?* Prevent reductionism. Show the model’s insufficiency for the full philosophical puzzle.  
  - **Limits of Hyperbolic Discounting:**  
    - Fails if preferences reverse *without* proximity (e.g., sudden mood shift unrelated to time).  
    - Doesn’t address *why* the calendar self’s plan should be privileged ("Later ≠ realer!").  
  - **Alternatives:** Briefly note philosophical accounts (e.g., Davidson’s all-things-considered judgments) that don’t require discount functions.  
  - **Head Off Misconceptions:**  
    - "The calendar self’s plan isn’t inherently ‘truer’ – it might be rigid or misinformed."  
    - "Preferences can reverse for reasons beyond discounting (e.g., framing, new information)."  

  **Synthesis & Your Closing Question (15 min)**  
  - **Reframe:** "Akrasia often isn’t ‘weakness’ but a *tug-of-war* between moment self (responding to now’s salience) and calendar self (defending cross-temporal integrity)."  
  - **The Revealing Question:**  
    *"Suppose someone reliably follows their calendar self’s plans. Does this prove they lack moment-self conflict, or could it reflect something else?"*  
    *(Answer: Could be suppression (e.g., fear), not integration. Tests if they see the distinction as structural, not behavioral.)*  
  - **Openly Refuse To Explain (Upfront):**  
    - Normative resolutions ("Which self *should* win?").  
    - The neuroscience of self-control.  
    - Full critiques of hyperbolic discounting (e.g., utility isolation paradox).  
    *Say: "Today is about mapping the terrain, not solving it."*  

  **Why This Order Works:**  
  1. **Phenomenology anchors abstraction.** Students *feel* the conflict before labeling it.  
  2. **Example before formalism** keeps econ students from reducing philosophy to math and philosophers from dismissing math as irrelevant.  
  3. **Modeling comes after distinction** so hyperbolic discounting is seen as *a tool for one aspect* (temporal inconsistency), not the whole story.  
  4. **Limitations section** prevents premature closure – econ sees philosophy’s value; philosophy sees modeling’s bounds.  

  **Expected Turbulence & Where to Quash It:**  
  - When introducing the example, an econ student might say, "This is just present bias!" → *"Hold that thought – let’s see if the model fully captures why it *feels* like self-betrayal."*  
  - A philosopher might object, "This denies responsibility!" → *"Does it? The moment self is still you acting intentionally. We’re diagnosing a *structure* of conflict, not excusing it."*  
  - "Isn’t the calendar self rational by definition?" → *"Is it? What if it ignores real-time resources (e.g., needing rest)?"*  

  This plan forces both disciplines to engage the gap between lived conflict and formal accounts, leaving them with your distinction as the key to the territory—not the map.
