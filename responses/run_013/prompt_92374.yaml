  ### The Fixed Fraction

  Rain lashed against the leaded windows of the Society of the Reach’s records room. Eleanor Vance traced a finger down the ledger’s vellum page, the ink brown and brittle. Three centuries of wealth, distilled into columns: *Member. Stake Fraction. Estate Year 100. Estate Year 101.* The tercentenary ledger was a beast—twelve volumes, each thicker than her wrist. Her task was reconciliation: verify the lineage of every estate against the Society’s charter. 

  The charter was simple, brutal. On joining, a member named a single fraction of their estate—one number, fixed for life—to be staked each year in the Society’s venture. The terms? Announced at dawn on staking day. Unpredictable. But two patterns recurred in the fragmented records of the last hundred years. One venture returned half again the stake on a fair coin’s toss, or sixty percent on the other. The other doubled the stake or erased it entirely, the odds favoring three in five. 

  Eleanor’s finger stopped. She flipped back to the first page of Volume I, then to the last of Volume XII. A chill spread through her, unrelated to the damp. The *mean* estate had ballooned: from 10,000 units at the century’s start to over 200,000 now. Twenty-fold growth. But the *median* had withered: 8,000 units down to 600. She cross-referenced the names. Five families—Reed, Chen, and three others—held estates above 500,000. The rest? A graveyard of zeros and pennies. The mean was a lighthouse beam, blinding and narrow; the median, a guttering candle. 

  She closed the ledger. Through the window, Halloway Reach hunched under the storm: granite cottages, fishing boats tugging at moorings, the grey swell of the sea. The Society’s wealth built this town, but the ledger whispered of rot. 

  ---

  “They *survived*,” said Silas Thorne. His voice, like his hands, was knotted and dry. The great hall’s hearth-fire painted shadows on his face. “The Thornes staked nothing. *Nothing*. For ninety years. Are we rich?” He shrugged. “We are here.” 

  Around the oak table sat the Society’s steering committee: Silas, Marcus Reed, Dr. Lila Chen, Arthur Lowell. Eleanor stood at the side, ledger open. The syndicate’s offer lay before them—a fixed sum, unrepeatable, for the Society’s entire endowment. Enough to rebuild the harbor twice over. 

  Marcus Reed laughed. He was broad-shouldered, smelling of salt and hemp. “Survived? Is that the Reach’s ambition? Look.” He jabbed a finger at Eleanor’s ledger. “The mean tells the tale. Twenty times! The Reeds staked everything. Always. We *built*.” 

  “And how many Reed branches are left?” Silas asked softly. “Two? The rest burned to ash.” 

  “Ash fertilizes,” Marcus said. “You stake nothing, you get nothing. The syndicate offer? A pittance against what we’ll grow.” 

  Dr. Lila Chen stirred. She was precise, her eyes sharp behind wire-rimmed glasses. “There’s a middle path. Not zero. Not everything. A fraction that… compounds.” She drew a sheet of paper, her pen scratching numbers. “The ventures differ. One favors a fourth. The other, a fifth. But if we must pick *one* fraction, unknown future…” She paused, calculating. “Stake 0.21. It’s not perfect for either, but it grows. Steadily.” 

  Arthur Lowell leaned forward. His face was pragmatic, weathered by trade winds. “Lila, your fraction is for a thousand years. What about *once*? The syndicate offer is a single wager. No repeats. Long-run theorems don’t apply. We should maximize expected wealth—or consider risk, but not worship a logarithm.” 

  Eleanor watched them. Marcus’s certainty. Silas’s caution. Lila’s equations. Arthur’s impatience. The ledger’s numbers hung between them: the soaring mean, the withered median. 

  “Show me,” Marcus said to Lila. “How your fraction ‘compounds’.” 

  Lila turned her paper. “Venture One: half chance your stake grows by fifty percent, half chance it shrinks by forty. If you stake *f*, wealth becomes 1 + 0.5*f* on a win, or 1 - 0.4*f* on a loss. The growth rate is the expected log.” She wrote:  

  > (1/2) × ln(1 + 0.5f) + (1/2) × ln(1 - 0.4f)  

  “Maximize this. The derivative…” She sketched calculus, then stopped. “Trial is clearer. Try f=0.25.” She computed:  

  > Win: 1 + 0.5×0.25 = 1.125 → ln(1.125) ≈ 0.1178  
  > Loss: 1 - 0.4×0.25 = 0.9 → ln(0.9) ≈ -0.1054  
  > Average: (0.1178 - 0.1054)/2 = 0.0062  

  “Now f=0.20: Win ln(1.10)≈0.0953, Loss ln(0.92)≈-0.0834. Average (0.0953-0.0834)/2=0.00595. Worse.” She nodded. “0.25 is best for Venture One.” 

  “Venture Two,” she continued, “sixty percent chance to double the stake, forty percent to lose it. Wealth: 1 + f on win, 1 - f on loss.” 

  > (0.6) × ln(1+f) + (0.4) × ln(1-f)  

  “Maximize. Try f=0.20: Win ln(1.2)≈0.1823, Loss ln(0.8)≈-0.2231. Average 0.6×0.1823 + 0.4×(-0.2231) = 0.1094 - 0.0892 = 0.0202.”  

  “f=0.25: Win ln(1.25)≈0.2231, Loss ln(0.75)≈-0.2877. Average 0.6×0.2231 + 0.4×(-0.2877) = 0.1339 - 0.1151 = 0.0188. Worse.” 

  Marcus snorted. “Numbers. I stake 1.0. Venture Two? Sixty percent chance to double my wealth. Expected value: 0.6×2 + 0.4×0 = 1.2. Twenty percent growth in one go! Your fraction? 0.0202 log-units—a snail’s pace.” 

  “And if you lose?” Silas asked. 

  Marcus grinned. “Then I’m done. But the *average* across many like me? It soars.” 

  Lila held up a hand. “But we don’t know the venture type in advance. So I blend them. Assume equal likelihood. Find f that maximizes the average of the two growth rates.” She tried values: f=0.20, f=0.21, f=0.22. “f=0.21 gives near the peak. Average growth ≈0.013 per year. Safe. Sustainable.” 

  Arthur shook his head. “For a sequence, yes. But for the syndicate offer—a one-time choice? Your log is irrelevant. We should compare the sure sum to the expected future value of continuing. But that’s unknowable. So we judge risk: the offer is certain. Our ventures? A gamble.” 

  Eleanor spoke for the first time. “The ledger… the median estate collapsed. Most members dwindled to nothing. A few won hugely.” 

  Silas nodded. “Prudence preserves. The syndicate offer secures us all.” 

  “Mediocrity!” Marcus said. 

  The argument spiraled, unresolved. They adjourned at midnight. 

  ---

  Dawn on staking day. The Reach huddled under a pewter sky, the air thick with salt and anticipation. The Society’s steward stood on the steps of the hall, a brass horn in hand. 

  “Venture Two!” he called. “Stake returned twofold on success, lost entirely on failure. Success in three of five tosses!” 

  A murmur ran through the crowd. Marcus Reed clapped Silas Thorne on the shoulder. “Double or nothing! Today, Reed wealth doubles.” He strode to the clerk, declared his stake: 1.0. All. 

  Mr. Carver, a barrel-chested net-mender, followed. “Half,” he said firmly. “Middle way.” 

  Lila Chen stepped forward. “0.21.” Her voice was calm. 

  Silas: “Zero.” 

  Arthur Lowell: “0.10. Not for growth. For… balance.” 

  The stakes recorded, the Society moved to the harbor. A coin-toss stage stood on the quay. The sea churned, slate-grey. 

  Marcus watched, arms folded. “Watch,” he said to Eleanor. “Boldness rewarded.” 

  The steward tossed a weighted die. Three throws to settle the venture. 

  *First throw:* Six. Success. Marcus’s wealth would double—if the next throws held. 

  *Second throw:* Four. Failure. 

  Marcus’s smile faltered. 

  *Third throw:* Two. Failure. 

  Silence. The venture lost. 

  Marcus stood rigid. His entire stake—gone. One hundred years of Reed accumulation, erased in three throws. He turned, face ashen, and walked away without a word. 

  Mr. Carver’s outcome: two successes, one failure. His stake of 0.5: doubled twice (×2, ×2), lost once (×0). Wealth became:  
  Start: 1.  
  After first win: 1 - 0.5 + 2×0.5 = 1.5  
  After second win: 1.5 - 0.5 + 2×0.5 = 1.5 (net gain 0.5, but stake is fixed fraction of *current* wealth)  
  *Clarification: The stake is a fraction of the estate at the start of each year. So for Carver:*  
  - Pre-venture wealth: W.  
  - Stakes 0.5W.  
  - Venture loses: returned amount is 0.  
  - Post-venture wealth: W - 0.5W = 0.5W.  
  *With two wins, one loss:*  
  Win 1: Wealth = W - 0.5W + 2×0.5W = W(1 - 0.5 + 1) = 1.5W  
  Win 2: Stake 0.5 × 1.5W = 0.75W  
  Wealth = 1.5W - 0.75W + 2×0.75W = 1.5W(1 - 0.5 + 1) wait—*simpler:*  
  After win: wealth = current wealth × (1 - f) + 2f × current wealth = current wealth × (1 + f)  
  So after two wins: W × (1.5) × (1.5) = W × 2.25?  
  *Mistake. Correct:*  
  Each venture: wealth_new = wealth_old × [1 + f] on win, [1 - f] on loss.  
  Carver’s fraction f=0.5 fixed.  
  Sequence: win, win, loss.  
  Wealth: Start W.  
  After win1: W × (1 + 0.5) = 1.5W  
  After win2: 1.5W × (1 + 0.5) = 2.25W  
  After loss: 2.25W × (1 - 0.5) = 1.125W  
  *But Venture 2: on win, stake returned twofold → net gain equals stake (100% gain). Wealth multiplier: 1 + f = 1.5 for win. On loss, stake lost → multiplier 1 - f = 0.5. Yes.*  
  So Carver ends at 1.125W—a gain. But Lila’s warning: *expected log* is negative for f=0.5 in V2. His actual outcome was favorable (two wins, one loss), but the fraction is dangerous. Had the loss come first:  
  Loss: W × 0.5 = 0.5W  
  Win: 0.5W × 1.5 = 0.75W  
  Win: 0.75W × 1.5 = 1.125W  
  Same endpoint? *No: sequence doesn’t matter for multiplicative growth.* Order is irrelevant: win,win,loss: 1.5×1.5×0.5=1.125. Loss,win,win: 0.5×1.5×1.5=1.125.  
  But in this venture, *only one loss occurred*, so he gained 12.5%. But Lila’s point is *expectation*:  
  E[log] = 0.6×ln(1.5) + 0.4×ln(0.5) ≈ 0.6×0.4055 + 0.4×(-0.6931) = 0.2433 - 0.27724 = -0.0339 < 0.  
  Over time, repeated, this fraction *erodes* wealth. But today, Carver won. 

  Lila Chen’s outcome: one win, two losses.  
  Start: W.  
  Stake: 0.21W.  
  Wealth multipliers: loss: 1 - 0.21 = 0.79; win: 1 + 0.21 = 1.21.  
  Sequence: loss, loss, win.  
  Wealth: W × 0.79 × 0.79 × 1.21 ≈ W × 0.754. Loss of 24.6%.  
  But her fraction’s *expected* log in V2: 0.6×ln(1.21) + 0.4×ln(0.79) ≈ 0.6×0.1906 + 0.4×(-0.2357) = 0.11436 - 0.09428 = 0.02008 > 0. Favorable long-term, but today she lost. 

  Silas: unchanged. 

  The crowd dispersed, buzzing. Marcus’s ruin was the talk of the Reach. 

  ---

  That evening, the committee reconvened. The syndicate offer lay between them, its ink stark against parchment. 

  “One unrepeatable wager,” Arthur said. “Marcus bet his all on *this* venture. He lost. Had he taken the syndicate sum, he’d still be rich.” 

  “Had he won,” Silas countered, “he’d be richer. But he didn’t. We must be like the Thornes. Secure the foundation.” 

  Lila touched Eleanor’s ledger. “The fraction must be resilient. Marcus’s 1.0 is ruinous in Venture Two. Silas’s zero grows nothing. My 0.21 works over time—but Arthur is right. For a single choice? The logarithm is… silent.” 

  “The ledger,” Eleanor said softly. “The mean grew on the backs of a few. The median died. If we take the syndicate offer, every member gets a share. Equal. Secure.” 

  “And we surrender the future,” Marcus said from the doorway. He looked hollow, his boldness ash. “I lost. But the average Reed? We built this town. Without us, it’s…” He gestured at the window, where the first stars pierced the gloom. “Just another fishing village.” 

  Arthur picked up the syndicate’s parchment. “We vote.” 

  But no one moved. The fire crackled. The sea sighed against the stones of Halloway Reach. 

  Outside, the fixed fraction ruled: some grew, some shrank, some vanished. Inside, the decision hung—unresolved, unresolvable—between the lure of the mean and the fate of the median, between the bold and the safe, between the long run and the now. 

  Eleanor closed the ledger. The numbers, for tonight, were done.
