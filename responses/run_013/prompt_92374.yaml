  ### Planning Notes

  **Characters and Positions:**
  - **Eleanor Vance**: Young clerk discovering the ledger's story. Embodies the observer, the catalyst for questioning.
  - **Silas Thorne**: Elderly member, stakes nothing (f=0). Position: Risk avoidance preserves capital; survival over growth.
  - **Marcus Reed**: Mid-life member, stakes everything (f=1). Position: Maximize expected value; wealth is built on boldness, not caution.
  - **Dr. Lila Chen**: Mathematician, stakes a calculated fraction (f=0.21). Position: Maximize expected logarithmic growth (Kelly) for long-term compounding, regardless of venture type.
  - **Arthur Lowell**: Pragmatic member, opposes Kelly for single decisions. Position: Long-run asymptotics don’t apply to one-off choices; focus on context and expected wealth.
  - **Mr. Carver**: Minor character, stakes half (f=0.5). Illustrates a fraction absurd in Venture 2.

  **Scenes:**
  1. **Records Room**: Eleanor uncovers the century-old ledger showing soaring mean but collapsing median wealth.
  2. **Society Meeting**: Debate on the syndicate offer. Silas, Marcus, Lila, and Arthur state positions.
  3. **Staking Morning**: Venture 2 terms announced. Members apply fixed fractions—Marcus’s all-in, Carver’s half-stake—against Venture 2’s odds.
  4. **Aftermath**: Reed’s near-ruin, Carver’s loss. Syndicate offer revisited, but no resolution.

  **Venture Calculations (to 2 decimal places):**
  - **Venture 1**: Half gain 50% (×1.5), half lose 40% (×0.6), p=0.5 each.  
    Optimal fraction: f=0.25.  
    Growth rate: 0.5×ln(1 + 0.5×0.25) + 0.5×ln(1 - 0.4×0.25) = 0.5×ln(1.125) + 0.5×ln(0.9) ≈ 0.5×0.1178 + 0.5×(-0.1054) = 0.0062.  
  - **Venture 2**: 60% chance gain 100% (×2), 40% chance lose 100% (×0), p=0.6/0.4.  
    Optimal fraction: f=0.20.  
    Growth rate: 0.6×ln(1+0.20) + 0.4×ln(1-0.20) = 0.6×ln(1.2) + 0.4×ln(0.8) ≈ 0.6×0.1823 + 0.4×(-0.2231) = 0.0201.  
  - **Compromise Fraction (for unknown ventures)**: f=0.21.  
    Average growth if ventures equally likely: [0.5×ln(1+0.5×0.21) + 0.5×ln(1-0.4×0.21) + 0.6×ln(1+0.21) + 0.4×ln(1-0.21)] / 2 ≈ [0.0061 + 0.0198]/2 = 0.01295.

  **Key Numbers in Story:**
  - Reed’s stake: 1.0 (all-in). In Venture 2: 60% chance ×2 wealth, 40% chance ×0.
  - Carver’s stake: 0.5. In Venture 2: 60% chance ×1.5, 40% chance ×0.5. Expected log: 0.6×ln(1.5) + 0.4×ln(0.5) ≈ -0.0339 (negative growth).
  - Chen’s derivation: Shown via trial of f=0.20, f=0.25, settling near f=0.21.

