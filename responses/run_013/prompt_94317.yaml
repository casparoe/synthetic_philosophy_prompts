prompt: |-
  I'm a second-year PhD student in philosophy, and this past spring I sat in on a hospital ethics consultation as the lay member of the committee while my uncle was on a transplant list at the same hospital — an arrangement I would not recommend to anyone. Ever since, I've been arguing with friends about what may and may not be bought, and my verdicts refuse to line up. Paying plasma donors seems fine to me, and I would defend a regulated market in eggs for IVF; but I think it should be a crime for a stranger to buy a kidney from a willing adult, and I cannot give a principled reason why, since both involve money for a bodily intervention and the kidney donor stands to gain far more. A hardware store that triples the price of generators during a flood is doing something wrong and ought to be stopped, whereas surge pricing after a ballgame is fine and paying a snow-shoveler double is fine; surge pricing during an evacuation, though, feels like the generators. Paying someone to hold your place in line for a concert or a committee hearing seems fine; paying to jump a visa queue or to buy into a better school district does not, and I suspect those are two different objections wearing the same coat. Selling a vote is never acceptable, even when the buyer's platform would plainly help the seller more than an honest vote would. And paying a child per book read is fine while paying per A is not, which I cannot defend at all.

  The tentative principle I have been working with is this: money is objectionable only when the good being priced is one whose value consists in its being shared and non-optional — a vote, a place in a common queue, an impartial hearing — rather than a private benefit the seller can refuse and walk away from. On that view plasma is private and a vote is shared, so some of my verdicts fall out neatly; but it makes my kidney verdict and my per-A verdict look like mere squeamishness, and it may not survive the generator case, where the thing being sold is a generator and not a flood. What I want is the best principle, or small set of competing principles, that actually fits the pattern, precise enough that I can see which clause each verdict depends on and what each one costs me.

  Please answer as exactly five numbered items, one or two sentences each, with no introduction and no conclusion. Cover, in turn: the principle or principles you would defend; how they handle the cases I find hardest to reconcile; which of my verdicts they force me to abandon; what they predict about a case I have not mentioned; and finally where your reasoning is most likely to fail and what argument or piece of evidence would change your verdict.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from a philosophy PhD student. They're grappling with inconsistencies in their moral intuitions about commodification - why some things feel wrong to sell even when others seem perfectly fine. The cases range from organ sales to surge pricing to paying for grades.

  I need to provide exactly five numbered responses as requested, covering principles, hard cases, abandoned verdicts, new predictions, and weaknesses. The user wants surgical precision - no fluff, just analytical rigor.

  First, the core tension: they accept paid plasma and IVF eggs but reject kidney markets, accept some surge pricing but not others. Their tentative "shared vs private" principle doesn't fully hold. I notice three deeper threads: vulnerability exploitation (flood generators), institutional corruption (votes), and intrinsic worth degradation (child's education).

  For principles, I'll propose: 1) Vulnerability prohibition (no profiting from essential goods during crises), 2) Institutional corruption prohibition (no undermining fair procedures), 3) Non-commodification of constitutive goods (no pricing things central to human identity). This tripartite framework explains most cases.

  The kidney case is hardest - it violates all three principles simultaneously (vulnerable sellers, corrupts transplant systems, degrades bodily integrity). Their plasma exception holds because plasma regenerates and lacks equivalent systemic risks. 

  This forces abandoning their "per-A grade payment" verdict - if grades aren't constitutive goods, prohibiting payment becomes inconsistent. The visa queue case clearly violates institutional integrity, while concert line-holding doesn't corrupt anything essential.

  For a new prediction: paid surrogacy should be prohibited under these principles (vulnerability + constitutive good concerns), though regulated egg donation might pass.

  The biggest weakness? Defining "constitutive goods" risks circularity. Empirical evidence about whether organ markets actually harm dignity could force revision - if data showed no degradation, principle 3 might collapse for kidneys but hold for votes.

  The hospital ethics experience clearly haunts them - that personal connection to the kidney case makes it visceral. I'll keep the tone clinical but acknowledge the emotional weight through precise analysis.
answer: |-
  1.  Defend three principles: (A) Prohibition against exploiting essential vulnerability during crises (generators in flood); (B) Prohibition against monetizing core constitutive goods fundamental to identity or dignity (kidney, vote); (C) Prohibition against monetization that corrupts essential procedural fairness of institutions (vote, visa queue, impartial hearing).
  2.  Kidney sale violates (B) as a constitutive good and (C) by corrupting equitable allocation; plasma lacks this constitutive status and avoids (C) via regulated systems. Paying per A violates (B) by commodifying intrinsic educational worth, unlike paying per book read which incentivizes a specific, non-constitutive activity.
  3.  These principles force abandoning your verdict against paying a snow-shoveler double (no essential vulnerability crisis or institutional corruption) and likely your verdict against paying to jump a concert line (no essential procedural fairness corrupted).
  4.  They predict paid surrogacy violates (B) as a constitutive good involving profound bodily and relational integrity, contrasting with regulated egg donation which involves gametes, not gestation.
  5.  Reasoning most likely fails in precisely defining "constitutive good" (B), risking arbitrariness; compelling evidence that kidney markets demonstrably *enhance* donor autonomy/dignity without corrupting allocation could force revision for that case alone.
