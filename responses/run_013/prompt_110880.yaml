answer: |-
  ## The Ledger Keeper

  The air in the Assessment Bay hummed with the low thrum of climate control and the weary sigh of outdated processors. Outside the reinforced plexi-window, London sprawled under a perpetual autumn drizzle, the chrome and carbon fibre softened by grime and damp. Inside, Assessor Evelyn Thorne adjusted her headset, the familiar weight settling into the groove worn by thirty years of Ministry service. Thirty years adjudicating the most fundamental of permissions: the right to conceive.

  Her screen glowed, displaying Case File # Zeta-7891-K. Standard preamble. Applicants: Marcus & Priya Sharma. Genetic compatibility: Acceptable. Resource Allocation Index: Borderline Tertiary (Probable State Dependence). Standard risk factors flagged: minor hereditary predisposition to osteopenia, environmental pollutant load within projected tolerance. The usual tapestry of potential woes and modest joys, waiting to be unpicked by the Asymmetry.

  Evelyn’s fingers moved automatically across the keypad, calling up the Mandatory Assessment Framework. Four boxes, stark and unyielding, governed her universe:

  1.  **Presence of Pain (Bad):** Projected instances requiring intervention: dental caries (probable), childhood viral infections (assured), potential for musculoskeletal strain (moderate probability), psychological distress events (estimated 20-30 occurrences threshold significant). *Aggregate Bad: Moderate-High.*
  2.  **Presence of Pleasure (Good):** Experiential positives: parental bonding (assumed), sensory satisfaction (e.g., taste, warmth), intellectual stimulation (dependent on educational access), social connection (variable probability). *Aggregate Good: Moderate.*
  3.  **Absence of Pain (Good):** Unclaimed benefit of non-existence: Avoidance of all projected caries, infections, strain, distress. *Aggregate Good: High.*
  4.  **Absence of Pleasure (Bad):** Deprivation: Only applicable *if* existence occurs. Therefore, non-existent entity experiences *no deprivation*. *Aggregate Bad: Null.*

  The formula was clear. The unclaimed, absolute good of avoiding pain (#3) outweighed the potential, contingent good of experiencing pleasure (#2), especially when juxtaposed with the assured bad of experienced pain (#1). The non-existent suffered no deprivation (#4). Case # Zeta-7891-K, like thousands before it, practically adjudicated itself. Evelyn ticked the boxes, her stylus hovering over the final decision field: **APPLICATION DENIED. Grounds: Asymmetrical Deficit (Net Negative Valuation).** She paused, not out of doubt for this case, but because the familiar rhythm had been disrupted. Her gaze kept flicking to the secondary tab, flagged urgent and anomalous: **Referral: Case Omega-Alpha-001.**

  Omega-Alpha. The designation alone felt wrong. Alpha was conception. Omega was… termination? But not pre-conception. Post. Existing.

  She minimised Zeta-7891-K, its denial pending only her digital signature, and opened the abyss.

  **CASE OMEGA-ALPHA-001**
  **SUBJECT: ARJUN SHARMA (DOB: 15/05/2048)**
  **REFERRING AGENCY: FAMILY SUPPORT UNIT (REGION 7-SOUTH)**
  **REASON FOR REFERRAL: EXISTENTIAL COST-BENEFIT RE-ASSESSMENT REQUESTED UNDER CLAUSE 7b (EXTREME HARDSHIP).**

  Arjun Sharma. Eight years old. Already born. Already *here*. Evelyn felt an unfamiliar jolt, like static discharge on dry skin. Her entire career was built on evaluating phantoms, probabilities dancing in the void. Arjun was solid. He had a birth certificate, a National Health ID, likely drawings pinned to a fridge somewhere.

  She drilled down. Medical history: Severe, non-verbal autism spectrum disorder. Chronic, treatment-resistant gastrointestinal complications. Multiple hospitalisations. Prognosis: Lifelong, high-dependency care. Developmental plateau reached. Parental capacity: Assessed as severely strained (Marcus Sharma: employed, Priya Sharma: primary carer, exhibiting signs of clinical depression). State resource allocation: Currently utilising maximum permissible home-support package. Further escalation requires institutionalisation or… re-assessment.

  The referral note was clipped, bureaucratic: "Parents petitioning for consideration under Clause 7b (Extreme Hardship). Seeking formal valuation to determine if continued existence constitutes a net negative burden exceeding permissible thresholds, warranting state-sanctioned compassionate termination."

  Evelyn’s tea, stewed beside her terminal, cooled untouched. Compassionate termination. They meant ending Arjun’s life. Because the Asymmetry, designed solely to prevent *new* suffering by preventing *new* life, was being forced onto an existing one. The Ministry, bound by its own rigid protocols and the foundational philosophy, had nowhere else to shunt such an impossible request.

  Her hands, usually steady as a surgeon’s over the keyboard, trembled slightly. She opened the Mandatory Assessment Framework. The familiar four boxes stared back, utterly inadequate.

  1.  **Presence of Pain (Bad):** *Aggregate Bad: High.* This was undeniable. Medical reports detailed Arjun’s agonising gut spasms, his inability to communicate distress beyond raw screams, the constant medical interventions, the profound frustration and fear his condition engendered. The *Bad* was visceral, documented, ongoing. Evelyn could practically hear the echoes of his cries in the dry clinical language.
  2.  **Presence of Pleasure (Good):** *Aggregate Good: Low.* The reports were sparse here. Moments of calm observed during sensory sessions (weighted blanket, specific light patterns). Episodes of quiet focus. A noted positive response to a particular caregiver’s voice. But weighed against the constant storm of his discomfort, the ledger tilted heavily. Could simple cessation of pain *be* his pleasure? The framework had no category for that. It demanded positive experiences. His were scarce, fleeting, overshadowed. *Low.*
  3.  **Absence of Pain (Good):** Here, the gears of logic ground horribly. The *unclaimed good* of non-existence. If Arjun ceased to exist, an immense amount of projected, agonising pain would be avoided. Decades of suffering, foregone. The framework demanded this be counted. It was, by its own cold calculus, an **Aggregate Good: Very High.** A positive outcome achieved through non-being. Evelyn stared at the box. It was meant to represent a blessing *not bestowed*, a void where suffering *would have been*. Applied to Arjun, it became a justification for creating that void. Now. Deliberately.
  4.  **Absence of Pleasure (Bad):** *Aggregate Bad: Null.* This was the cruelest twist. The framework insisted: *Only applicable if existence occurs.* If Arjun ceased to exist, he would experience *no deprivation* of pleasure. The quiet moments, the familiar voice, the cessation of pain itself – he wouldn’t miss them. He wouldn’t be *deprived*. Therefore, according to the sacred asymmetry, this box remained **Null**. No bad accrued from terminating potential future pleasure for an entity that would no longer exist to be deprived of it.

  The formula, applied blindly, mechanically, yielded its result. The *Presence of Pain (High Bad)* and the *Absence of Pain (Very High Good)* dominated. The *Presence of Pleasure (Low Good)* was insufficient counterweight. The *Absence of Pleasure (Null Bad)* offered no counter-argument. Net Negative Valuation.

  The system prompted: **RECOMMENDATION: TERMINATION APPROVED UNDER CLAUSE 7b.**

  Evelyn recoiled. The words burned on the screen. Her hand flew to the stylus, not to sign, but to push the terminal away. She saw not just boxes, but Arjun. A boy who knew the smell of his mother’s hair, even if he couldn’t say it. Who might find a profound, inarticulate peace in the warmth of sunlight on his skin, a peace inaccessible to her ledger. Who existed.

  The Asymmetry never asked about *this*. It was brilliant, watertight, for preventing the entry of new souls into a world guaranteed to hurt them. It measured the unclaimed good of avoiding suffering against the hypothetical good of uncreated lives. It was silent on the value of a life already being lived, however harrowed. Silent on the sheer, irreducible *fact* of existence. It had no metric for the spark already ignited, only for the sparks not struck.

  She pulled up the parents' petition statement, attached as Appendix Gamma. Priya Sharma’s handwritten note, scanned in, was smudged: *"Every day I watch him fight, every day he hurts. We are breaking. The system is breaking us. We love him, God knows we do, but is this life? For him? For us? Please… we just need help, or… or an end to the pain. For everyone."*

  ‘An end to the pain.’ The absence of pain. A *good*.

  Evelyn looked back at Box 3: **Absence of Pain (Good): Very High.** The framework agreed with Priya. Vehemently. It quantified the *good* of Arjun's non-existence, the immense suffering avoided. It validated her despair in the coldest terms imaginable.

  But Box 4 mocked her: **Absence of Pleasure (Bad): Null.** As if Arjun’s potential future moments of peace, however few, however defined, held no weight. As if extinguishing him negated any loss. The asymmetry treated the absence of future pleasure as irrelevant *only because* he wouldn’t exist to feel its lack. Applied here, it wasn't philosophy; it was a chilling absolution for ending him.

  Her terminal pinged softly. A reminder: Case Zeta-7891-K awaited her signature. The phantom child, the *potential* Sharma, neatly denied existence based on the same logic that now demanded the end of Arjun. Potential pain avoided: *Good*. Potential pleasure forgone: *Irrelevant*. The symmetry was horrifying.

  She opened Arjun’s file again. A photo, mandatory for termination proceedings. He looked small in a hospital chair, tubes discreetly taped, gazing somewhere beyond the camera. Not smiling. Not crying. Just… present. Existing.

  The framework demanded her recommendation. The logic was appallingly clear. Sign. Recommend termination. Affirm the unclaimed good of pain avoided. Dismiss the null value of pleasure’s absence.

  But her hand wouldn’t move. Decades of faithfully applying the clauses, brick by logical brick, had built a structure that now felt like a prison. The gap between the question the Asymmetry answered – *Should this potential suffering begin?* – and the question forced upon her – *Should this existing suffering cease?* – yawned like a chasm. One was about prevention, the other about annihilation. The ledger couldn’t bridge it. The four clauses, her lifelong compass, pointed unwaveringly towards an abyss she couldn’t sanction.

  She couldn’t sign the recommendation. The thought of reducing Arjun’s existence, his *being-here*, to a Net Negative Valuation felt like a profound desecration, a failure of understanding far deeper than any bureaucratic error.

  But neither could she deny it. The pain was real, immense, documented. The *good* of its absence, according to the only metric she was authorised to use, was overwhelming. Priya Sharma’s plea echoed the framework’s cold conclusion. To recommend *against* termination felt like condemning Arjun, his parents, to continued, unrelenting agony – an agony the Ministry’s own doctrine quantified as an unnecessary, preventable bad.

  Evelyn Thorne sat back. The hum of the climate control was suddenly deafening. The rain streaked the plexi-window, blurring the grey city beyond. On her screen, Case Omega-Alpha-001 remained open, the **RECOMMENDATION** field glaringly blank. The denial for Zeta-7891-K also waited, unsigned. Two decisions, one routine, one monstrous, both paralysed by the same rigid logic hitting its absolute limit.

  She reached not for the stylus, but for her cold tea. The cup rattled slightly in its saucer. The ledger was complete, the calculation run. The answer, according to Benatar, according to the Ministry, according to thirty years of her life, was clear.

  And yet.

  She stared at the photo of Arjun Sharma. Existing. The four clauses offered no language for the simple, terrifying weight of that word. The forms had no box for ‘is’. Only ‘might be’ and ‘should cease’. The pressure of the particular case, a real boy lost in a system built for hypotheticals, pressed down on her, silencing the hum of logic, leaving only the drumming rain and the echoing silence of a question the asymmetry was never built to answer, hanging unresolved in the sterile air of the Assessment Bay. She would sit there, caught in the impossible gap, until the system timed out, or the world outside the plexiglass demanded an answer she could not, would not, give.
