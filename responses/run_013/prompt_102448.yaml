          Then take a vote between A and B: A wins (1 and 3 prefer A over B: 2-1).
          Between B and C: B wins (1 and 2: 2-1).
          Between C and A: C wins (2 and 3: 2-1).

          So we have A>B, B>C, and C>A -> a cycle.

          We can have three participants take the roles and vote. Then we see the cycle.

          And then we say: "This shows that even if every individual has a consistent ranking, the group might not. So majority rule can be incoherent when there are more than two options. But note: this doesn't mean that the jury theorem is wrong. The jury theorem is about true-or-false questions, not about ranking options."

     **What will predictably go wrong**:

     - Time: Each round might take longer than 4 minutes. Especially passing the hat and collecting votes. With 20 participants, passing the hat might take 2 minutes. Then writing the vote and collecting might take 2 minutes. So we might run over.

          How to handle: Have the hat passed quickly. Have pre-printed voting slips? Or have them raise their hand for A or B? But then they see others' votes. We want independence, so they must not see others' votes. So we need secret ballots. We can have them write on a piece of paper and fold it, and then collect quickly.

     - Tie: If we have an even number of voters and they split evenly, then we have a tie. We can break the tie arbitrarily? Or we can note that the majority is not defined and skip that round? But then we lose data. We can plan for an odd number: if we have an even number of participants, ask one to sit out for a round? Rotate who sits out. But that might be awkward. Alternatively, we can let the facilitator vote? But the facilitator knows the truth. That would break the independence and be unfair. Alternatively, we can flip a coin to break the tie? But that adds time. I suggest: if tie, then the majority is not correct. So record as "tie" and incorrect because the majority vote (which doesn't exist) didn't match the truth.

     - Participants might not understand the voting: They might vote what they think rather than what the slip says. Emphasize: "You must vote exactly what the slip says. Even if you think it might be wrong, you are following the signal."

     - The shared signal condition: when we draw one slip and show it, they might not all vote because they think it's obvious? Emphasize that everyone must vote.

     - The low competence condition: participants might get frustrated because they are often wrong. Explain that it's part of the experiment.

     **What the activity cannot reproduce**:

     - We cannot show the asymptotic behavior (as the group grows) because we have a fixed group size. We can only show one group size. We can mention that in theory, for larger groups, the effect is stronger.

     - We are using a fixed competence level (60% and 40%) and we are not varying the group size. So we cannot show that the accuracy increases with group size. We can mention that in the debrief.

     - The independence assumption is broken in the shared signal condition, but there are other ways to break independence (like discussion) that we did not fully simulate. We only showed one way (shared signal). We can mention that discussion can lead to herding or shared biases.

     - The Condorcet paradox is not integrated and might be skipped for time.

     Given the constraints, this design should work.

     **Materials list**:

     - Coin
     - Hat or bag
     - Envelopes: 
          5 for High A: each with 6 A slips and 4 B slips (total 30 A and 20 B)
          5 for High B: each with 6 B slips and 4 A slips (total 30 B and 20 A)
          5 for Low A: each with 4 A slips and 6 B slips (total 20 A and 30 B)
          5 for Low B: each with 4 B slips and 6 A slips (total 20 B and 30 A)
     - Index cards or small papers for voting (one per participant per round) - but they can use their own paper?
     - Marker and board to record the results.

     We can prepare the envelopes in advance.

     Let's write the exact sequence with timings:

     Total: 50 minutes

     - 0-5 min: Introduction. Explain the rules. Emphasize: "In each round, I will flip a coin to set the truth. Then, I will load the hat with slips. You will each draw one slip (except in the last two rounds, which we'll explain then). You must vote what the slip says. We will then count the votes and see what the majority decided, and then I'll reveal the truth."

     - 5-29 min: Run rounds 1 to 6.

          Round 1: High independent
            - Flip coin: if heads, use a High A envelope; if tails, High B.
            - Load the hat.
            - Pass the hat. Each participant draws one slip, reads it secretly, and writes their vote on a piece of paper. Collect votes.
            - Count votes and record on the board: 
                  Round 1: Truth = [A or B], Votes: A=..., B=..., Majority=..., Correct?=...
            [Time: 4 min]

          Round 2: High independent (same) [4 min]

          Round 3: Low independent
            - Flip coin: if heads, use a Low A envelope; if tails, Low B.
            - ... same as above [4 min]

          Round 4: Low independent [4 min]

          Round 5: High shared
            - Flip coin: if heads, use a High A envelope; if tails, High B.
            - Load the hat.
            - Draw ONE slip and show it to the entire group.
            - Tell everyone: "This is the signal for everyone. Please write your vote as what this slip says."
            - Collect votes (they should all be the same).
            - Count and record. [3 min? because no passing hat]

          Round 6: High shared [3 min]

          Total: 4*4 + 2*3 = 16+6 = 22 minutes (rounds: 5-27 minutes)

     - 29-45 min: Debrief.

          Show the table of results. Ask:

            "In rounds 1 and 2, each of you had a 60% chance of being correct. How many of you were correct in each round? (They can look at their slips and see.) But we care about the group. In both rounds, did the majority get it right? ... 

            In rounds 3 and 4, each of you had a 40% chance. How did the majority do? ...

            In rounds 5 and 6, we all saw the same signal. So we all voted the same. How did the group do? ... 

            What does this tell us?"

          Then explain Condorcet's jury theorem and the conditions.

          If we saw that in the high independent condition the majority was correct both times, and in low independent it was wrong both times, and in high shared it was correct one time and wrong one time, that would be ideal. But even if not, we can explain the theory.

     - 45-50 min: Condorcet paradox (if time)

          Quickly: "Now, what if we have more than two options? Condorcet also discovered a problem. Imagine three options: A, B, C. And three voters:

            Voter 1: A best, B middle, C worst.
            Voter 2: B best, C middle, A worst.
            Voter 3: C best, A middle, B worst.

          Now, let's vote between A and B: who prefers A over B? (Voter 1 and 3) so 2 votes for A. B over A? (Voter 2) so 1 vote. A wins.
          Between B and C: B over C: Voter 1 and 2 -> 2 votes. C over B: Voter 3 -> 1 vote. B wins.
          Between C and A: C over A: Voter 2 and 3 -> 2 votes. A over C: Voter 1 -> 1 vote. C wins.

          So A beats B, B beats C, and C beats A. That's a cycle. The group's preferences are not coherent. So majority rule doesn't always produce a clear winner."

          Then: "This doesn't refute the jury theorem, which is about true-or-false questions. But it shows that majority rule can have problems when there are multiple options."

     - End.

     **Handling failures**:

     - If a round takes too long, skip the last one or two rounds. It's better to have time for debrief.

     - If the group size changes, note that it might affect the results. Try to keep the same group size.

     - If a participant reveals their signal, remind them not to.

     - If the shared signal round, the vote is not unanimous, explain that it should be and then correct.

     - If the results don't match expectations (e.g., in high independent, the majority is wrong both times), explain that it's possible by chance and that the theorem is about probability. We did only two rounds, so we might not see the pattern. But in theory, it should be more often right.

     This design meets the goals and constraints.
answer: |-
  Below is a fully designed activity based on your goals, constraints, and the insights from Condorcet's jury theorem. I've prioritized **discovery before naming**, ensured **better-than-chance competence** with verifiable ground truth, and used **cheap, non-digital materials**. The activity focuses on the theorem's core: the "inversion" (majority accuracy flips when competence is below 0.5) and the **critical role of independence**. The Condorcet paradox is omitted due to time constraints (it requires a separate setup and would rush the core lesson), but I’ll suggest a quick workaround if you have extra minutes.

  ---

  ### **Brainstorming and Design Choice**
  I considered three mechanics:
  1. **Dice/Coin Flips with Biased Signals**: Participants roll dice to generate signals, but this risks competence drifting from the target (e.g., dice rolls vary).  
  2. **Pre-Printed Cards with Fixed Truth**: Cards simulate signals, but shuffling/updating for rounds is time-consuming.  
  3. **Colored Beads in Hidden Bags (Chosen)**:  
     - **Why**: Beads in concealed bags let you **control competence** (e.g., 60% red beads = 60% chance of correct signal). Ground truth is set by bag choice (verifiable), independence is enforced by private draws, and dependence is simulated by a shared bag. Materials cost <$10. It’s visual, quick, and reliably hits p=0.6 or 0.4.

  ---

  ### **Full Activity Design: "The Bead Jar Challenge"**
  **Concept**: Groups predict a hidden color (Red/Blue) using signals (beads). They experience:  
  - **Aggregation Miracle**: Majority beats individual accuracy at p=0.6.  
  - **Inversion**: Majority does *worse* than individuals at p=0.4.  
  - **Independence Breakdown**: Shared signals destroy collective wisdom.  

  **Group Size**: 15–20 students. Split into two teams (Team Red, Team Blue) for scoring.  
  **Time**: 50 minutes total.  
  **Materials**:  
  - 4 opaque bags/jars (label hidden: Bag A, Bag B, Bag C, Bag D).  
  - 100 red beads, 100 blue beads (or paper squares).  
  - 20 small cups (for private bead draws).  
  - 1 coin (for ground truth).  
  - Scoreboard (whiteboard or poster).  
  - Index cards for voting.  

  **Prep (Before Session)**:  
  - Fill bags:  
    - **Bag A (Truth=Red)**: 60% red, 40% blue (e.g., 12 red, 8 blue for 20 students).  
    - **Bag B (Truth=Blue)**: 60% blue, 40% red.  
    - **Bag C (Truth=Red)**: 40% red, 60% blue (inversion).  
    - **Bag D (Truth=Blue)**: 40% blue, 60% red.  
  - Place bags in a box so students can’t see labels.  

  ---

  ### **Activity Sequence (45 Minutes)**  
  **Step 1: Setup (5 min)**  
  - **Goal**: Frame the challenge.  
  - **Script**: *“Today, we’re detectives predicting a hidden color—Red or Blue—using clues. Each of you gets a bead from a mystery jar. Your bead is a clue about the truth. Vote based on your bead: red bead = vote Red, blue bead = vote Blue. We’ll tally votes and see if the majority is right.”*  
  - **Rules**:  
    - No talking during voting (ensures independence).  
    - Truth is set by coin flip (Heads=Red, Tails=Blue).  
    - Teams earn points for correct majorities (no prizes—just glory).  

  **Step 2: Round 1 – High Competence (p=0.6), Independent (8 min)**  
  - Flip coin (e.g., Heads → Truth=Red).  
  - Pull Bag A (Truth=Red) from box (students don’t see bag label).  
  - Pass bag around; each student draws one bead into their cup (keeps it hidden).  
  - Students vote via index card: “Red” or “Blue” (based on bead).  
  - Collect votes, tally publicly. Record:  
    - Truth = Red  
    - Votes: #Red vs. #Blue  
    - Majority correct? (Yes/No)  
  - **Expected Result**: Majority correct ~80% of the time for n=15–20.  

  **Step 3: Round 2 – Low Competence (p=0.4), Independent (8 min)**  
  - Flip coin (e.g., Tails → Truth=Blue).  
  - Pull Bag D (Truth=Blue) from box.  
  - Repeat voting. Record:  
    - Truth = Blue  
    - Votes: #Red vs. #Blue  
    - Majority correct?  
  - **Expected Result**: Majority correct <20% of the time (inversion).  

  **Step 4: Round 3 – High Competence (p=0.6), Dependent (8 min)**  
  - Flip coin (e.g., Heads → Truth=Red).  
  - Pull Bag A (Truth=Red) from box.  
  - **Break independence**: Draw *one bead* and show entire group. *“Everyone gets the SAME clue this time. Vote based on this bead.”*  
  - All vote (will vote identically). Tally and record.  
  - **Expected Result**: Majority accuracy drops to 60% (no aggregation benefit).  

  **Step 5: Scoring & Initial Reactions (5 min)**  
  - Announce team points (1 pt per correct majority).  
  - Ask:  
    - *“When did the group do best? Worst?”*  
    - *“Why did everyone vote the same in Round 3? Did that help?”*  
  - **Don’t explain yet**—just listen.  

  **Step 6: Debrief (11 min)**  
  - **Reveal the mechanics**: Show bags and bead compositions.  
  - **Map to Condorcet’s Theorem**:  

    | **Activity Moment**          | **Theorem Concept**                                  | **Key Question for Students**                                                                 |  
    |------------------------------|-----------------------------------------------------|----------------------------------------------------------------------------------------------|  
    | Round 1 (p=0.6, independent) | Majority > individual accuracy                      | *“Why did 15 people at 60% beat one person? How is this like a ‘miracle’?”*                  |  
    | Round 2 (p=0.4, independent) | Inversion (majority < individual accuracy)          | *“Why did the group do WORSE than a single person here? What flipped?”*                      |  
    | Round 3 (p=0.6, dependent)   | Independence failure (shared error)                 | *“Why did high competence fail here? What does this say about group discussions or leaders?”* |  

  - **Emphasize**:  
    - The theorem isn’t “crowds are wise”—it’s conditional. If p>0.5 and independent, groups amplify truth. If p<0.5, they amplify error.  
    - Real-world failures: Classrooms, jury rooms, or social media break independence via groupthink, shared biases, or influencers.  
  - **Connect to Your Goals**:  
    - **Inversion felt**: Round 2’s “worst” outcome shows the condition matters (p>0.5 isn’t just flattery).  
    - **Independence critical**: Round 3’s failure mirrors how pre-vote discussions corrupt the theorem.  

  **Step 7: Condorcet Paradox Teaser (If Time, ≤4 min)**  
  - *“Condorcet also found a paradox: Majorities can be irrational with 3+ choices. Quick example…”*  
  - **Activity**: Three students rank options (Pizza > Burgers > Tacos, Burgers > Tacos > Pizza, Tacos > Pizza > Burgers). Vote pairs: Pizza>Burgers? Burgers>Tacos? Tacos>Pizza? Majority cycles emerge.  
  - *“This doesn’t break the jury theorem—it shows majority ‘truth’ only works for yes/no questions.”*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Time Runs Short**:  
     - **Fix**: Cut Round 3 (dependence) if behind. Prioritize Rounds 1–2 (inversion is the core insight). Debrief with hypotheticals: *“What if we all saw the same clue?”*  

  2. **Inversion Not Observed**:  
     - **Risk**: In Round 2 (p=0.4), the majority might randomly be right (probability ~20%).  
     - **Fix**: Pre-run simulations to confirm low p=0.4 majority accuracy. In debrief, stress: *“This usually fails—today was a rare win. Math says 20 people at 40% are right <20% of the time.”*  

  3. **Competence Drift**:  
     - **Risk**: Beads not perfectly mixed → competence ≠ 0.6/0.4.  
     - **Fix**: Count beads aloud while bag-filling. Use student volunteers for mixing.  

  4. **Independence Broken**:  
     - **Risk**: Students peek at others’ beads.  
     - **Fix**: Enforce “cup covers” and no talking. Assign a student as “Silence Enforcer.”  

  5. **Boredom During Draws**:  
     - **Fix**: Use team competition. Have a “Vote Counter” student tally publicly.  

  ---

  ### **What the Activity Can’t Show (Must State Yourself)**  
  - **Asymptotic Certainty**: The theorem says majority accuracy → 100% as group size grows. With fixed n=15–20, you must say: *“If we added 1,000 people at p=0.6, the majority would be near-perfect.”*  
  - **Non-Binary Worlds**: The theorem assumes two options (Red/Blue). In life, “truth” is rarely binary—state this during debrief.  
  - **Competence Asymmetry**: Real competence varies per person. We simplify to fixed p for clarity.  

  ---

  ### **Why This Works**  
  - **Competence Guaranteed**: Bead ratios ensure p=0.6 or 0.4—no coin-flip chance. Ground truth is verifiable via bag contents.  
  - **Discovery Before Naming**: Students see aggregation succeed/fail before learning “Condorcet.” The inversion (Round 2) is visceral.  
  - **Independence Visible**: Round 3’s shared bead mirrors how classrooms/juries break the theorem.  
  - **Cost**: Beads + bags + cups = ~$10 (use paper if beads unavailable).  

  Run this as-is, and your group will leave feeling the theorem’s power and fragility—not just hearing about it. If you test it beforehand, tweak bead counts to fit your exact group size. Good luck!
