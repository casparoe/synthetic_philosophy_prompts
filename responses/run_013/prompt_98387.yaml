prompt: |-
  Bit of an odd request, hope you can help. I'm a research engineer on an evals team and I've somehow ended up moderating a long-running arguement in our reading group between two people I'll call the pessimist and the pragmatist. The pessimist thinks there's a real, deep law here — roughly, that any optimiser strong enough and run long enough against a proxy that isn't the thing you actually care about will eventually sever the link between proxy and target, so that it's a structural feature of optimisation and selection rather than a bug you can engineer away; they'd say "specification gaming" isn't a failure mode of badly chosen objectives, it's what optimisation *is* when the objective is always a compression of your values. The pragmatist thinks that's mysticism dressed up as a theorem: they say that once you've properly specified the environment, the reward channel, the population of agents and the horizon, every alleged case of Goodharting turns out to be one of a few mundane things — a proxy that was only ever correlated under the training distribution, or agents that are literally optimising the measure you handed them because it's the measure you handed them — and that there's no interesting residual once you've said that. They've been going round in circles for months and I want to force them to write the document they should have written together.

  So: take on the role of a methodical philosopher of science who is also genuinely at home on the ML/RL side, and draft the joint statement of an adversarial collaboration between these two camps. Before you write anything, spend a few lines brainstorming what the live cruxes might actually be — I have a hunch there are at least two: (a) whether "Goodharting" picks out a single mechanism or a disjunction of unrelated ones, and (b) whether there's any principled difference between a metric failing because the world changed underneath it and a metric failing because agents noticed it, or whether that distinction is just bookkeeping. I'd also like you to test a distinction I've been toying with against both camps and see if either will bite: call it the *lag* hypothesis — the idea that a metric's safety is really just a function of the gap between how fast the metric can be optimised and how fast the target can drift, so that Goodhart's law is less a law than a rate, in that every proxy is fine for long enough and none is fine forever, and the interesting quantity is the time constant.

  The document itself should be something both of them could actually put their names to, so watch the wording: an agreed-claims section (numbered) covering what both accept about proxies, optimisation, selection and the stock cases, phrased so that neither feels they've quietly conceded; then a disagreements table where each row is a crux, with columns for the neutral statement of the question, the pessimist's position in wording they'd accept, and the pragmatist's in wording they'd accept — and then, for each crux, a short note on the test, argument or concrete case that both sides agree would bear on it, with each side's prediction recorded in advance (they should both be willing to turn out wrong). If any part of their dispute turns out to be verbal — the same claim in different vocabularies — say so explicitly and say which part. Please don't pad it out with citations or reading lists; we both know the literature and I want the actual content. Use British English throughout, and be careful not to smuggle the pessimist's framing in as though it were the neutral one. Aim for something substantial but tight — no more than a couple of thousand words.
