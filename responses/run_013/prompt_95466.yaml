prompt: |-
  I sit on the rules committee of the tribunal we set up after the war, and I have to circulate a written opinion before Friday's plenary, so I could really use a hand drafting it. Here's the mess. Our founding statute — which we wrote ourselves, about six weeks after the fighting stopped — has four counts: genocide, crimes against humanity, war crimes, and, over the objection of two of the convening powers, a count of crimes against peace, meaning planning and waging an aggressive war. The defence has filed a preliminary motion saying aggression wasn't a crime under anything our state had signed when the invasion happened, that the statute is therefore retroactive, and that this is just the winners judging the losers. They've also pointed out, and I'm afraid they're right, that one of the convening powers' own generals ordered a pretty comparable incursion into a neighbouring state a few years earlier and nobody is drafting an indictment for him.

  Half the committee wants to strike the aggression count and keep the other three, on the theory that reaching for the most politically charged charge discredits everything else we do. The other half says if we drop it we've conceded that might makes right — the only reason it wasn't a crime is that nobody had the power to criminalize it beforehand. Then our legal adviser floated something she calls a reciprocity trigger: keep the count, but add a clause saying it lapses automatically unless every convening power agrees within twelve months to let the tribunal's jurisdiction reach its own commanders for the same conduct. Nobody can decide whether that's a principled safeguard or a poison pill that lets the guilty walk, and there's alot riding on getting this right.

  So please draft the opinion I'll recieve and circulate: a clear recommendation — strike the count, keep it, or keep it with the trigger — plus the reasoning, plus an honest run at the strongest thing the losing side has. I don't think the retroactivity objection is as silly as some of my colleagues do, so don't just wave it away. I also don't need a history of Nuremberg or Tokyo, I know the broad strokes; what I actually need is whether the analogies everyone keeps drawing to them settle anything here or are just doing rhetorical work. Give me a concrete procedural next step with a deadline, and keep it to roughly a page.
reasoning: |-
  Okay, the user is part of a tribunal rules committee dealing with a complex legal and ethical dilemma post-war. They need a drafted opinion by Friday on whether to include a "crimes against peace" charge despite retroactivity objections and hypocrisy concerns. 

  First, let's unpack the core tensions: the defense claims retroactive criminalization ("winners judging losers") while pointing to a convening power's similar past action. The committee is split between dropping the charge entirely (to preserve credibility) or keeping it (to reject "might makes right"). The legal advisor's "reciprocity trigger" compromise adds another layer—conditioning the charge on convening powers submitting their own commanders to jurisdiction.

  Hmm... the user's deeper needs emerge here. They're not just asking for legal analysis; they're navigating political minefields while trying to uphold legitimacy. Their explicit request for "honest engagement with the losing side's arguments" suggests they fear superficial rulings could undermine the tribunal's moral authority. The unspoken pressure? This decision could set precedents for future accountability mechanisms.

  The Nuremberg analogies floating in committee debates need careful handling. While Nuremberg established aggression as a crime, its context differed—occupation gave the Allies control, whereas here convening powers include states with potential culpability. The user knows this history but needs to know whether it resolves *this* dilemma. Answer: it doesn't, because the hypocrisy angle (one convening power's past incursion) makes Nuremberg's "victor's justice" critique sharper here.

  On retroactivity: the defense has a point. Criminal law principles (nullum crimen sine lege) matter, but the user already suspects this objection isn't frivolous. The strongest counter isn't legal but moral: if aggression causes mass suffering, failing to address it perpetuates impunity. Still, the rule of law requires guarding against pure retroactivity. 

  The reciprocity trigger is clever but risky. It pressures convening powers to commit to impartial justice, potentially strengthening the tribunal's legitimacy long-term. But if any power blocks self-referral (likely, given past conduct), the charge vanishes—rewarding obstruction. It could look like a cynical escape hatch rather than a principled stand.

  Recommendation: keep the charge with the trigger. Why? 
  - Dropping it concedes too much to realpolitik ("might makes right"). 
  - Keeping it unconditionally ignores valid retroactivity concerns and hypocrisy charges, risking perceived illegitimacy. 
  - The trigger forces convening powers to *choose*: either endorse consistent standards (lifting the tribunal's credibility) or expose double standards (which the tribunal can then note in its rulings). 

  Procedurally, the next step—circulating a draft statute amendment—must happen fast (Thursday deadline) to allow plenary debate. The user needs this actionable step to break committee deadlock.

  Finally, tone matters. The opinion must balance legal rigor with moral clarity, acknowledging the defense's arguments without conceding to them. Phrases like "this tribunal's legitimacy hangs in the balance" and "a conditional charge is preferable to an unconditional retreat" frame the compromise as steadfast, not weak.
answer: |-
  ## Memorandum: Recommendation on Aggression Charge  
  **To:** Rules Committee Members  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Proposed Resolution re: Crimes Against Peace Count (Statute Art. 4(d))  

  ### I. RECOMMENDATION  
  **Adopt the "Reciprocity Trigger" amendment to the crimes against peace count.** Retain Article 4(d) (aggression) but amend the statute to include the following clause:  

  > "Jurisdiction under Article 4(d) shall lapse automatically unless all convening powers formally submit to the Tribunal’s jurisdiction for equivalent conduct by their nationals, including prior incursions, by [Date 12 Months from Statute Amendment]. Indictments under Article 4(d) may be filed provisionally but shall be void if the condition is unmet."  

  ### II. REASONING  
  **A. Why Not Strike the Charge?**  
  Dropping aggression entirely surrenders to the "might makes right" critique. It signals that strategic power, not principle, shields violators. The charge embodies our foundational rejection of unlawful war as a tool of policy—a norm now recognized under customary international law (see UNGA Resolution 3314). Erasing it undermines the Tribunal’s moral authority and the post-war order we seek to build.  

  **B. Why Not Keep the Charge Unconditionally?**  
  The retroactivity objection has merit. While aggression was condemned *in principle* pre-invasion (e.g., Nuremberg, Kellogg-Briand Pact), its status as an *individual crime* with defined penalties was unsettled in our jurisdiction. Prosecuting it risks perceived victor’s justice, especially given the unresolved incursion by a convening power’s general. This hypocrisy fuels the defense’s narrative and could taint convictions on other counts.  

  **C. Why the Reciprocity Trigger Resolves the Impasse**  
  1. **Addresses Retroactivity Legitimacy Concern:**  
     The trigger transforms aggression jurisdiction from retroactive to *prospective*. Convening powers must *affirmatively accept* liability for future/past conduct, grounding the charge in contemporary consent. This satisfies *nullum crimen sine lege* (no crime without law) by making jurisdiction conditional on current state agreement.  

  2. **Neutralizes the Hypocrisy Critique:**  
     It forces convening powers to "stand in the dock" for equivalent acts or forfeit the charge. Either outcome strengthens the Tribunal:  
     - **If powers comply:** Universalizes accountability, proving the charge is principled, not punitive.  
     - **If a power blocks:** Exposes bad faith, allowing the Tribunal to note this in its judgment while dismissing the tainted charge. The remaining genocide/war crimes charges proceed untarnished.  

  3. **Practical Safeguard Against Abuse:**  
     The 12-month sunset prevents indefinite limbo. Provisional indictments maintain prosecutorial leverage while the trigger incentivizes cooperation.  

  ### III. ENGAGING THE STRONGEST COUNTERARGUMENT  
  **Defense Core Objection:** "This Tribunal criminalizes aggression retroactively while ignoring identical acts by the victors, rendering it a political show trial."  

  - **Our Response:** The reciprocity trigger directly confronts this. It acknowledges that victors cannot impose one-sided justice. By conditioning jurisdiction on the conveners’ submission to the same standard, we reject double standards. If victors exempt themselves, the charge self-extinguishes—denying them a "win" on aggression while preserving the Tribunal’s integrity on other counts. The retroactivity gap is bridged by requiring *present consent* to jurisdiction, aligning with emerging *jus cogens* norms against aggressive war.  

  ### IV. NUREMBERG/TOKYO ANALOGIES: LIMITED UTILITY  
  Invoking Nuremberg settles nothing here. Unlike 1945, convening powers include states whose own conduct could trigger aggression charges. Nuremberg’s victors judged defeated aggressors; here, conveners must potentially judge *themselves*. This unique dynamic demands a novel solution—hence the trigger.  

  ### V. PROCEDURAL NEXT STEP  
  **Action:** Circulate draft statute amendment incorporating the reciprocity trigger clause by **Thursday, [Date]** at 5:00 PM.  
  **Deadline:** Committee vote Friday AM ahead of plenary session.  

  ---  
  **Bottom Line:** The trigger transforms aggression from a retroactive weapon into a test of the conveners’ commitment to equal justice. It offers a principled path forward: accountability without hypocrisy, or transparency if hypocrisy prevails.  

  // End //
