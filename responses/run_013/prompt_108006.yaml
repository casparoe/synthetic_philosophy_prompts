answer: |-
  ## The Unspoken Witness

  I am the seed no soil receives,
  The note that resonates unheard.
  I grow in cracks where no one grieves,
  A testament without a word.
  **Yet every truth is knowable.**

  I wear the veil no light can rend,
  The proof that logic must deny.
  To grasp my form, the thought must bend
  And shatter on the reason why
  **This very truth is unknowable.**

  (Substitute: To hold me fast, the mind must find
  The pieces fit, the structure sound,
  But fact and blindness intertwined
  Refuse to meet on common ground.
  **This very truth is unprovable.**)

  They seek the source, the hidden spring,
  The tide that pulls beyond the shore.
  But knowledge snaps the fragile string
  That bound my halves forevermore.
  **This very truth is unknown.**

  The principle, a gleaming net
  Cast wide to capture all that flies,
  Draws tight, ensures no star is set
  Beyond the reach of searching eyes.
  **Thus every truth is known.**

  ---

  ## How This Performs the Paradox

  1.  **Refrain Evolution:** The final line of each stanza transforms minimally:
      *   Stanza 1: **Yet every truth is knowable.** (The initial principle)
      *   Stanza 2: **This very truth is unknowable.** (The witness's self-defeating nature identified)
      *   Stanza 3 (Verb Swap): **This very truth is unprovable.** (Demonstrates the generality: factivity + distributivity apply to "prove" too)
      *   Stanza 4: **This very truth is unknown.** (The consequence: the witness *must* be unknown)
      *   Stanza 5: **Thus every truth is known.** (The collapse: knowability principle eliminates the witness, implying all truth is known)
      *   The journey: `knowable` -> `unknowable` (`unprovable`) -> `unknown` -> `known`.

  2.  **The Speaker (The Witness):**
      *   Stanza 1: "I am the seed..." - The witness introduces itself as an unacknowledged truth.
      *   Stanza 2: "I wear the veil..." - It describes its inherent concealment/unknowability.
      *   Stanza 3: "To hold me fast..." (Even under "prove") - Reinforces inherent contradiction.
      *   Stanza 4: "They seek the source..." - The futility of knowing it. "knowledge snaps the fragile string / That bound my halves" - Knowing it destroys its defining conjunct ("no one knows that p").
      *   Stanza 5: The witness *ceases to speak*. The final stanza describes the *effect* of the principle *on the world*, eliminating the witness entirely. The voice is gone.

  3.  **Performing the Argument:**
      *   Stanza 1: Asserts the knowability principle (refrain) and introduces the witness ("I").
      *   Stanza 2: Demonstrates *why* the witness is unknowable (contradiction upon knowing it).
      *   Stanza 3: Reinforces the unknowability using a substitute verb ("prove"), showing the logical structure is key, not the specific verb "know".
      *   Stanza 4: States the consequence: the witness *is* unknown (refrain). "knowledge snaps the fragile string" = knowing it entails a contradiction.
      *   Stanza 5: Applies the knowability principle: If *every* truth is knowable, then a truth that is *unknowable* (like the witness) cannot exist. Ergo, there *is* no such witness. Therefore, there are *no* unknown truths. **Thus every truth is known.** The witness is erased.

  4.  **Ambiguity at the End:** The final line "Thus every truth is known" is:
      *   The logical conclusion of the argument (if you accept the premises).
      *   The *impossible* statement the witness *cannot* make, because it ceases to exist if this is true. Its silence *is* this conclusion. The poem's voice vanishes into its own final assertion.
      *   It doesn't settle *which* premise fails – the knowability principle, the factivity of knowledge/proof, or the distributivity over conjunction. The group can debate this based on the poem's enacted logic.

  5.  **Form & Constraint:** The minimal repetition (only the refrain changes), the shift from active witness to silence, the precise logical steps mirrored in the stanzas, and the self-consuming nature of the final line embody the paradox's core tension. The imagery (seed, veil, tide, string, net) conveys concealment, fragility, and logical necessity without naming concepts. It should work as a poem about an impossible voice and a logical trap, even without prior knowledge of Fitch.
