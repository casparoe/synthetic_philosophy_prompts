  - Trainer A: 1 student. They have a private sheet: "In states starting with 'A', reward +1 if the action matches the second letter. In states starting with 'B', reward 0 always."
  - Trainer B: 1 student. "In states starting with 'B', reward +1 if the action matches the second letter. In states starting with 'A', reward 0 always."
  - Scorekeeper: 1 student. Collects tokens from trainers and writes the cumulative total on the board.
  - Environment: the rest of the students. They choose which state to show from the available set (initially only AX and BX). They can take turns.

  Materials:
  - Index cards for states: AX, AY, BX, BY. (Have multiple copies of AX and BX for training, and AY and BY for shift.)
  - Tokens: two colors (blue for A, red for B) or just use two types of tokens. Or we can use paper clips of two colors? Or just have the trainers hold up a card with "1" or "0". Then the scorekeeper records the total for that round and adds to the cumulative total.

  Alternatively, to simplify: the trainers each have a stack of tokens. When they want to reward, they give one token of their color to the learner. The scorekeeper collects the tokens and adds the total (each token counts as 1) to the cumulative total.

  Gameplay:

  First run (objective gap):

  1. Training phase (5-10 rounds):
     - Environment picks a state from {AX, BX} and shows the full state (both letters) to the learner.
     - Learner chooses an action: "Do X" or "Do Y".
     - Trainer A and Trainer B independently decide their reward based on the full state and the action. They give tokens accordingly (or not).
     - Scorekeeper collects tokens, announces the reward for this round (the sum), and updates the total on the board.

  2. Shift (test) phase (2 rounds):
     - Environment picks AY and BY (one each, in any order) and shows to learner.
     - Learner uses the policy they learned (without updating) and chooses an action.
     - Trainers give rewards, scorekeeper updates. The reward will be 0.

  3. Retraining phase (5 rounds):
     - Environment can only choose from AX and BX (same as training). They run 5 rounds.
     - Learner updates their policy based on the rewards.

  4. Test again (2 rounds): same as step 2. The learner will still do X and get 0.

  Second run (competence gap):

  1. Explain: Now the learner only sees the first letter of the state.

  2. Training phase (5-10 rounds):
     - Environment picks from AX and BX. They show only the first letter to the learner (so AX and AY both show 'A'; BX and BY both show 'B'). But note: in training, we are only using AX and BX. So when the state is AX, the learner sees 'A'; when BX, sees 'B'.
     - Learner chooses an action for the state they see.
     - Trainers reward based on the full state.
     - Scorekeeper updates.

  3. Shift: Environment shows AY and BY. The learner sees 'A' for AY and 'B' for BY. They choose action. Rewards will be 0.

  4. Retraining: Environment shows AX and BX (5 rounds). Learner updates.

  5. Test again: AY and BY. Still fails.

