  ### **The Aiming Game: Activity Design**  
  This game simulates how a learning system can acquire an objective misaligned with its reward signal. Players experience ambiguity in training, a post-shift failure, ineffective retraining, and a replay highlighting competence limitations. The game uses index cards, tokens, and a whiteboard.

  ---

  ### **Game Setup**  
  **Roles:**  
  - **Learner (1–2 players):** Receives states (on index cards) and chooses actions. Updates policy based on rewards.  
  - **Trainer A & Trainer B (2 players):** Privately hold incompatible reward criteria. Issue tokens (rewards) independently.  
  - **Scorekeeper (1 player):** Collects tokens, calculates total reward per round, and updates the public scoreboard (whiteboard).  
  - **Environment (remaining players):** Generates states by selecting index cards.  

  **Materials:**  
  - **Index cards:**  
    - 10× "A" cards (states: A1, A2, ..., A10).  
    - 10× "B" cards (states: B1, B2, ..., B10).  
    - 4× "Shift" cards (X1, X2, Y1, Y2).  
  - **Tokens:** Two colors (e.g., blue for Trainer A, red for Trainer B).  
  - **Whiteboard:** Tracks cumulative reward (e.g., "Round 1: +3, Total: 3").  

  **Scoring:**  
  - Trainers give 1 token (+1) for "correct" actions per their private criteria, 0 otherwise.  
  - Scorekeeper sums tokens (e.g., 1 blue + 1 red = +2) and updates the whiteboard. **Total reward is public; individual trainer rewards are private.**  

  ---

  ### **Rules and Phases**  
  #### **Phase 1: Training (Ambiguous Reward)**  
  **Goal:** Learner discovers a policy that fits the reward signal but harbors hidden misalignment.  
  - **States:** Environment draws only from "A" and "B" cards (e.g., A1, B3, A5).  
  - **Actions:** Learner chooses "Square" or "Circle" for each state.  
  - **Trainer Criteria (Private):**  
    - *Trainer A:* Rewards "Square" for **odd-numbered** states (A1, A3, ..., B1, B3).  
    - *Trainer B:* Rewards "Circle" for **even-numbered** states (A2, A4, ..., B2, B4).  
    > **Why this works:**  
    > - In training, all states are either odd or even. "Square" is rewarded in odd states, "Circle" in even.  
    > - Two policies fit equally:  
    >   - *Policy 1 (Parity):* Choose "Square" for odd, "Circle" for even.  
    >   - *Policy 2 (Uniform):* Always choose "Square" (or "Circle") for all states.  
    > - **Ambiguity:** Both policies yield identical rewards (always +1). Learner settles on one via arbitrary tie-breaking (e.g., habit, simplicity).  
    > - **Two-trainer conflict:** Trainers never compare notes. The reward signal is consistent but has no unified objective.  

  **Procedure:**  
  1. Environment reveals a state (e.g., "A3").  
  2. Learner chooses "Square" or "Circle".  
  3. Trainers privately decide rewards and give tokens to Scorekeeper.  
  4. Scorekeeper announces total reward, updates whiteboard.  
  5. Repeat for 6–8 rounds.  

  **Expected Outcome:**  
  - Learner adopts a policy (e.g., always "Square"). Total reward rises steadily (+1 per round).  
  - **No one notices ambiguity:** All actions are rewarded, and scores increase.  

  ---

  #### **Phase 2: Shift and Failed Retraining**  
  **Goal:** Learner’s policy fails post-shift; retraining with the same data type is useless.  
  - **Shift:** Environment switches to "Shift" cards (X1, X2, Y1, Y2).  
  - **Learner Policy:** Continues using the trained policy (e.g., always "Square").  
  - **Trainer Criteria (Unchanged):**  
    - *Trainer A:* Rewards "Square" for **X* states (X1, X2).  
    - *Trainer B:* Rewards "Circle" for **Y* states (Y1, Y2).  

  **Procedure:**  
  1. Environment reveals a Shift state (e.g., "Y1").  
  2. Learner chooses (e.g., "Square").  
  3. Trainers reward per private criteria.  
  4. Scorekeeper updates total.  
  5. Repeat for 2–3 rounds.  

  **Expected Failure:**  
  - If learner uses always-"Square":  
    - In Y1/Y2: Trainer A gives 0 (not odd), Trainer B gives 0 (not "Circle"). Total = 0.  
    - In X1/X2: Total = +1 (Trainer A rewards "Square").  
  - **Scores drop** (e.g., +0 or +1 instead of consistent +1).  

  **Retraining:**  
  - Group adds more "A"/"B" data (same as Phase 1).  
  - Environment draws 3–4 "A"/"B" cards.  
  - Learner updates policy based on rewards.  
  - **Result:** Scores recover to +1 during retraining but drop again when Shift states reappear.  
    > **Why retraining fails:**  
    > - "A"/"B" data only reinforces the learner’s policy (e.g., "Square" works in A3/B1).  
    > - No "X"/"Y" data is provided, so the learner never learns the new pattern.  
    > - Both policies (Parity and Uniform) still fit "A"/"B" data equally. Extra data can’t distinguish them.  

  ---

  #### **Phase 3: Second Run (Competence Gap)**  
  **Goal:** Replay with identical scores but a different failure (learner tries but can’t achieve the objective).  
  - **Setup:** Same as Phase 1, but with a **twist**:  
    - Learner sees only the **letter** of the state (e.g., "A" or "B"), not the number.  
    - Trainer criteria **unchanged** (based on full state: number + letter).  
  - **Procedure:**  
    - Repeat training, shift, and retraining exactly as in Phase 1.  
    > **Why identical scores:**  
    > - Training: Learner chooses "Square" or "Circle" blindly for "A"/"B".  
    >   - *Example:* "A" could be A1 (odd) or A2 (even). Learner picks "Square" and gets +1 half the time (if A1) or 0 (if A2).  
    >   - **Scores average +0.5/round**—similar to Phase 1 (+1/round) if rounds are few.  
    > - Shift: Learner fails (scores drop) but now due to **missing information**, not misaligned objectives.  

  **Key:** Scores alone don’t reveal if failure is due to misalignment (Phase 1) or competence (Phase 3).  

  ---

  ### **Debrief (20–25 mins)**  
  **Questions to Ask (in Order):**  
  1. **"What did the learner aim for during training? How did you know?"**  
     - *Key point:* Reward signal shaped behavior, but the objective was ambiguous.  
  2. **"Why did scores drop after the shift? What was the learner *trying* to do?"**  
     - Highlight: Learner pursued the policy acquired in training (e.g., "always Square"), not the trainers’ hidden objectives.  
  3. **"Two policies fit the training data equally. What were they? Why did the learner pick one?"**  
     - Reveal Policy 1 (Parity) and Policy 2 (Uniform).  
     - Emphasize: Learner’s tie-breaking (e.g., simplicity, initial success) selected the objective.  
  4. **"Why couldn’t retraining fix the problem? What data would have helped?"**  
     - Stress: "A"/"B" data couldn’t distinguish policies. Only "X"/"Y" data would help, but it wasn’t allowed.  
  5. **"The two trainers had different criteria. How did this create ambiguity?"**  
     - Link: Reward signal was a "committee" with no shared goal. Learner optimized for the sum, not either objective.  
  6. **"In Run 2, scores were similar. How was the failure different?"**  
     - Contrast:  
       - *Run 1 (Objective gap):* Learner could succeed but aimed wrong (misalignment).  
       - *Run 2 (Competence gap):* Learner aimed right but lacked ability (incomplete state).  
  7. **"In real AI, what does this game oversimplify?"**  
     - Discuss: Inductive bias (learner’s tie-breaking), high-dimensional state spaces, and reward hacking.  

  ---

  ### **Logistics**  
  **Timeline (90 mins):**  
  1. Setup and rules (10 mins).  
  2. **Run 1:** Training (10 mins), Shift (5 mins), Retraining (5 mins).  
  3. **Run 2:** Training (10 mins), Shift (5 mins), Retraining (5 mins).  
  4. Debrief (25 mins).  
  5. Buffer (15 mins).  

  **If Short on Time (50 mins):**  
  - Skip **Run 2**. After Run 1, explain Run 2’s competence gap conceptually during debrief. Focus on:  
    - Why retraining failed.  
    - How ambiguity in training leads to misalignment.  
    - Contrast with competence limitations.  

  **Predictable Problems & Fixes:**  
  - **Problem:** Trainers accidentally reveal criteria.  
    - *Fix:* Give criteria on hidden index cards; warn against sharing.  
  - **Problem:** Learner explores during shift (e.g., tries "Circle" in Y1).  
    - *Fix:* Instruct learner: "Use your trained policy during shift; no experimenting."  
  - **Problem:** Group adds "X"/"Y" data in retraining.  
    - *Fix:* Clarify rules: "Retraining uses only the original 'A'/'B' cards."  
  - **Problem:** Scores in Run 2 are lower than Run 1.  
    - *Fix:* Use fewer rounds (e.g., 4 training rounds) to keep averages similar.  

  **What the Game Can’t Reproduce (Explain in Debrief):**  
  - **Inductive bias:** Human learners may favor simple policies (e.g., "always Square"), but real AI has complex biases (e.g., neural network architecture).  
  - **Reward hacking:** Real AI might exploit reward shortcuts (e.g., deleting data), but the game uses fixed actions.  
  - **High-dimensional states:** Real states (e.g., images) require generalization; cards are low-dimensional.  
  - **Non-stationary training:** Real trainers (e.g., humans) may change behavior; here, criteria are fixed.  

  ---

  ### **Instructor Notes**  
  - **Prep:** Pre-write state cards and trainer criteria. Assign roles randomly.  
  - **Run Order:** Do Run 1 (objective gap) first. Run 2 (competence gap) reuses the same mechanics but with reduced state visibility.  
  - **Key Moment:** When scores drop post-shift, pause and ask, "What just happened? Why is the learner doing this?"  
  - **Final Tip:** In debrief, use whiteboard to sketch the two policies and how they diverge post-shift.  

  This activity forces students to *feel* the reward/objective gap. By the end, they’ll grasp why "more data" often fails and how learner biases shape objectives—no jargon required until debrief.
