  But the owner's reaction is needed.

  Perhaps the facilitator can play the owner consistently: the owner always acts to maximize profit.

  But then the responses are played, and then we have a round 4 with those responses.

  Example round 4 with responses:

  - Suppose some workers choose strike: then if any strike card is played, no one works. 
  - But that might be extreme. 
  - Alternatively, only the workers who choose strike don't work. 
  - But then the owner can hire replacements? We don't have that. 
  - This is complicated.

  Given the time, I propose a simpler worker response phase without a full round, but with immediate consequences.

  But the design requires them to feel the consequences.

  Alternatively, the response phase is a separate round where workers choose, and then we see the outcome.

  Let's design the worker response round as round 4.

  Materials for worker responses:
  - Each worker has a set of cards: 
    - Accept (green) 
    - Strike (red) 
    - Sabotage (black) 
    - Pool (blue) 
    - Shorter hours (yellow) 
  - They choose one in secret and hand to facilitator.

  Rules for round 4 (response round):
  - The owner will try to hire as many workers as needed for production, but the workers' choices affect this.
  - The owner's plan: to produce 20 goods (to keep price at $15) with as little labor cost as possible.
    - With three devices, they need: 3 device workers (for 6 goods) and 14 non-device workers (for 14 goods) -> total 17 workers.
    - So the owner will hire 17 workers.
  - But the workers' choices:
    - If a worker chooses "accept", they are willing to work 10 units for $10.
    - If "strike", they refuse to work even if hired.
    - If "sabotage", they destroy one device (but only if they are hired? or anytime? Let's say: if they are not hired, they can still sabotage? But then they might be caught and penalized? We don't want that complexity.
      - Better: sabotage happens during work, so only if hired. But in this round, the owner is hiring only 17, so some are not hired. 
      - Perhaps: any worker who chooses sabotage will, if hired, destroy one device during the shift. If not hired, they cannot.
    - If "pool", they contribute $5 to a collective fund (only if they have $5). The fund is public. If it reaches $10, a device is bought and added to the pool. This device can be used by the workers in the next round, but not in this round.
    - If "shorter hours", they will work only 5 units for $10. The owner may choose not to hire them.

  Resolution:
  1. First, the owner hires 17 workers. How? The owner would prefer to hire workers who are not demanding. But the owner doesn't know the choices. 
     - We can have the owner hire randomly or based on some rule. 
     - To simplify, the facilitator can have the owner hire 17 workers at random from the 18. 
  2. Then, reveal the choices of the hired workers. 
  3. Consequences:
     - For each hired worker:
       - If they chose "accept": they work 10 units, are paid $10.
       - If "strike": they don't work, and are not paid. But the owner might not get the planned production.
       - If "sabotage": they work normally but destroy one device at the end of the shift. Production happens, but one device is removed for future rounds.
       - If "pool": they work normally (10 units for $10) and contribute $5 to the fund.
       - If "shorter hours": they work only 5 units. The owner gets only half the production from them. But the owner must pay $10? The demand is for $10 for 5 units. The owner might fire them on the spot if they reveal this? 
         - This is messy.

  Given the complexity, I propose to simplify the worker response to be a collective discussion and decision. But then we lose the individual rationality.

  Alternatively, have the workers discuss and then each vote on what to do, with the majority determining the response. But then it's collective.

  The activity is to show that individually each response is rational but collectively self-defeating. So it must be individual.

   Let's try a different approach for the response round:

  - After round 3, the workers have seen unemployment.
  - Each worker has response cards. They choose one in secret.
  - The responses have the following immediate effects (without a production round):
    - Accept: No action.
    - Strike: The worker withholds labor. If enough workers strike, production halts. But we need a threshold. Say if more than X workers strike, then the owner cannot produce.
    - Sabotage: If chosen by at least one worker, one device is destroyed.
    - Pool: The worker pledges $5 to the collective fund. If the fund reaches $10, the workers own one device.
    - Shorter hours: The worker will only work 5 hours in the next round.

  Then, after the responses, we have a round 4 with production.

  But the owner's behavior is fixed: always maximize profit.

  Example:

  - Workers choose responses in secret.
  - Facilitator collects and announces:
    - Number of accepts, strikes, sabotages, pools, shorter hours.
  - Resolve:
    - If sabotage >0, remove one device.
    - If strike >=9 (half), then no production in round 4. 
    - Pool: count the number of pool responses. Each pool response donates $5. If total >=$10, buy one device for the workers.
    - Shorter hours: these workers will only work 5 hours next round.
  - Then round 4:
    - Owner has remaining devices (after sabotage).
    - Owner plans production to maximize profit.
    - The workers who chose shorter hours will only work 5 hours if hired.
    - The owner hires workers. The owner knows who chose shorter hours? We can assume the owner knows the shorter hours workers will only produce half.
    - The owner may choose to hire fewer workers.

  This is very complex.

  Given the time constraints, I will design the activity with fewer rounds and simpler mechanics.

  Final design:

  Materials:
  - Whiteboard with demand curve: 
    - 0-10 units: $20 
    - 11-20: $15 
    - 21-30: $10 
    - 31-40: $5 
  - Tokens for money (or just keep score on whiteboard).
  - Device cards: 6 cards, each says "Halves the labor for one task. Cost: $10".
  - Response cards: For each worker, a set of five cards: 
    - Accept 
    - Strike 
    - Sabotage 
    - Pool savings 
    - Shorter hours 
  - Role cards: 1 owner, 17 workers (for 18 students).

  Setup (15 min):
  - Explain roles: 
    - Workers: Each can work up to 10 labor units. If hired, they are paid $1 per labor unit worked. 
    - Owner: Decides how many workers to hire and whether to buy devices. 
  - Demand curve: Price per unit depends on total units produced (by this firm, as there is no competition in the simulation). 
  - Scoring: 
    - Workers: Want to maximize money earned. 
    - Owner: Want to maximize profit (revenue minus wages minus device costs). 
  - Initial owner capital: $20. 
  - Tasks: Each worker has the same task: 10 labor units produce 1 good. 
  - Devices: If a worker uses a device, then 10 labor units produce 2 goods. 

  Rounds:

  Round 1 (5 min):
  - Owner hires 17 workers (all available) for 10 units each. 
    - Why 17? 18 students: 1 owner + 17 workers. 
  - Production: 17 goods. 
  - Price: $15 (11-20 bracket). 
  - Revenue: 17*15=255. 
  - Wages: 17*10=170. 
  - Profit: 255-170=85. 
  - Owner capital: 20+85=105. 

  Round 2 (5 min):
  - Owner can buy a device for $10. 
  - Owner buys one device. Capital: 105-10=95. 
  - Owner hires 17 workers again. 
  - Assign the device to one worker. 
  - Production: 
    - One worker: 2 goods. 
    - 16 workers: 16 goods. 
    - Total: 18 goods. 
  - Price: $15 (18 in 11-20). 
  - Revenue: 18*15=270. 
  - Wages: 170. 
  - Profit: 100. 
  - Owner capital: 95+100=195. 

  Round 3 (10 min):
  - Owner can buy more devices. 
  - Owner buys two more devices (cost $20), capital: 195-20=175. 
  - Now has three devices. 
  - Owner can hire 17 workers: 
    - Three with devices: 6 goods. 
    - 14 without: 14 goods. 
    - Total: 20 goods. 
    - Price: $15 (20 in 11-20) -> revenue=300. 
    - Wages: 17*10=170. 
    - Profit: 130. 
    - Owner capital: 175+130=305. 
  - But note: 20 goods exactly at the upper limit of $15. 
  - Unemployment: 0 because there are 17 workers and 17 are hired. 

  Wait, we have 17 workers, all are hired. No unemployment yet.

   To have unemployment, reduce the number of workers hired.

   But with 17 workers and three devices, if the owner wants to produce only 20 goods, they can do it with 17 workers (3*2+14=20). 

   To have unemployment, we need more than 17 workers? We have exactly 17 workers.

   We can have the owner decide to produce more to make more profit, but then price falls.

   Round 3 alternative:
  - Owner with three devices can produce more than 20.
  - If they produce 21 goods: 
    - Need: 3 device workers (6 goods) and 15 non-device workers (15 goods) -> 21 goods. 
    - But they only have 17 workers, so they can have: 3 device workers and 14 non-device -> 20 goods. 
    - To produce 21, they would need 18 workers, but they only have 17. 
  - So they cannot. 
  - So they produce 20 goods. 
  - All 17 workers are hired. 

   To create unemployment, we need either more workers or the owner to restrict output below what is possible with the workforce.

   Perhaps in round 4, the owner buys more devices and then can produce the same with fewer workers.

   Round 4: 
  - Owner buys three more devices, now has six devices. Cost: $30. Capital: 305-30=275. 
  - Now, to produce 20 goods: 
    - Six device workers: 12 goods. 
    - Need 8 more goods: from non-device workers, 8 goods require 8 workers. 
    - Total workers needed: 6+8=14. 
  - So owner hires 14 workers. 
  - Production: 12+8=20 goods. 
  - Price: $15 -> revenue=300. 
  - Wages: 14*10=140. 
  - Profit: 160. 
  - Owner capital: 275+160=435. 
  - Unemployment: 3 workers (17-14=3) get $0. 

  Now, the threat is clear: unemployment.

  Worker response phase (15 min):
  - Each worker (including the unemployed) chooses one response card in secret. 
  - Facilitator collects and announces the number for each response. 
  - Consequences: 
    - If at least one "sabotage": destroy one device (remove one device card). 
    - If "strike" >=9 (majority), then the workers go on strike: no production in round 5. 
    - "Pool savings": each worker who chose this donates $5 to a collective fund. If the fund reaches $10, the workers buy one device. 
    - "Shorter hours": workers who chose this will only work 5 hours in the next round. 
    - "Accept": no immediate action. 
  - Then, round 5 happens.

  Round 5 (5 min):
  - If strike happened, no production, no wages, owner's capital remains. Skip to debrief. 
  - If no strike, owner can produce. 
  - The owner knows how many workers are shorter-hours and how many devices are left. 
  - The owner decides how many to hire. 
  - production happens. 

  But this is very complex for 90 minutes.

  Given the time, we might end the simulation after the worker response phase and then debrief.

  Debrief (30 min):
  - Start by asking participants what they felt at each stage. 
  - Then map to Marx's ideas: 
    - Round 2: The device is productive (more output with same labor). 
    - Round 4: Under capitalism, this leads to unemployment and overproduction (the owner could produce more but restricts to keep price up). 
    - Worker responses: 
      - Sabotage: understandable but destroys the productive force. 
      - Strike: collective action, but might not win and causes immediate loss. 
      - Pool savings: workers try to become owners, but it's hard to save and they only get one device, while the owner has many. 
      - shorter hours: this is the alternative: take the gain in free time. But the owner won't hire them for shorter hours at the same pay because it reduces production. 
    - The scoring rule (profit maximization) is the villain. 
  - Concepts: 
    - Machinery as such is productive, but under capitalism, it becomes a means to displace workers and intensify exploitation. 
    - Transfer of skill: the device embodies the knowledge, so the worker's skill is less required. 
    - Displaced workers are not automatically compensated: they are unemployed. 
    - Fully automated workshop: if machines do everything, where does the value come from? Marx says only labor creates value, so this is a contradiction. 
  - End with the Grundrisse quote: "The theft of alien labour time, on which the present wealth is based, appears a miserable foundation in face of this new one, created by large-scale industry itself. As soon as labour in the direct form has ceased to be the great well-spring of wealth, labour time ceases and must cease to be its measure, and hence exchange value [must cease to be the measure] of use value. The surplus labour of the mass has ceased to be the condition for the development of general wealth, just as the non-labour of the few, for the development of the general powers of the human head. With that, production based on exchange value breaks down, and the direct, material production process is stripped of the form of penury and antithesis. The free development of individualities, and hence not the reduction of necessary labour time so as to posen surplus labour, but rather the general reduction of the necessary labour of society to a minimum, which then corresponds to the artistic, scientific etc. development of the individuals in the time set free, and with the means created, for all of them."

  What will go wrong:
  - The demand curve might be confusing. Solution: draw it clearly and do the arithmetic step by step.
  - The owner might not buy devices or might not restrict output. Solution: the facilitator can whisper to the owner to maximize profit, and if they don't restrict, show the lower profit.
  - Worker responses might not be varied. Solution: remind them to choose based on their interest.
  - Time might run out. Solution: be strict on time.

  What the activity cannot reproduce:
  - The activity assumes a single firm and doesn't show the systemic competition that forces the price down. Marx's analysis is at the level of the whole economy. The facilitator should explain that in capitalism, competition between firms forces each to adopt machinery and expand production, leading to a general fall in prices and the reserve army of labor.

  Gist: The productivity gain from machinery under capitalism becomes a threat to workers because the rules of the game force the owner to convert that gain into either unemployment or overproduction, and the way out—taking the gain as free time—is blocked by the very structure of wage labor.
answer: |-
  ### Simulation Design: Machinery and the Capitalist Dynamic  
  **Target Idea:** To experientially reveal how labor-saving machinery under capitalism transforms a productivity gain into a threat to workers, how rational individual responses exacerbate collective insecurity, and how the structural rules block the conversion of productivity gains into free time.  

  ---

  ### Materials  
  1. **Tokens:**  
     - 200 red chips (represent $1 each).  
     - 100 blue chips (represent units of output; 1 chip = 1 good).  
  2. **Index Cards:**  
     - **Role Cards:** 1 "Owner" card, 17 "Worker" cards.  
     - **Device Cards (5):** Each states: "Halves labor for one task. Cost: $10."  
     - **Worker Response Cards (5 per worker):**  
       - "Accept new conditions."  
       - "Strike for old wages."  
       - "Sabotage the machine."  
       - "Pool savings to buy a device."  
       - "Demand shorter hours at same pay."  
  3. **Whiteboard:** Track demand curve, production, wages, unsold goods, and owner capital.  
  4. **Demand Curve Setup:**  
     | Total Output | Price per Unit |  
     |--------------|---------------|  
     | 0–10         | $10           |  
     | 11–20        | $9            |  
     | 21–30        | $8            |  
     | 31–40        | $7            |  
     | 41–50        | $6            |  

  ---

  ### Roles and Payoff Scheme  
  - **Owner:**  
    - Starts with $50 capital.  
    - Receives all revenue from sales.  
    - Pays wages ($1 per labor unit).  
    - Goal: Maximize profit (revenue – wages – device costs).  
  - **Workers:**  
    - Each can work up to 10 labor units per round.  
    - Paid $1 per labor unit worked.  
    - Unhired workers earn $0.  
    - Goal: Maximize income (wages).  
  - **Labor-to-Output Rules:**  
    - Without device: 10 labor units → 1 good.  
    - With device: 10 labor units → 2 goods.  

  ---

  ### Timeline (90 Minutes Total)  
  #### **Setup (15 min)**  
  1. Assign roles via lottery: 1 owner, 17 workers.  
  2. Explain rules:  
     - Workers perform tasks to produce goods.  
     - Owner hires workers, buys devices, and sells goods.  
     - Price falls as total output rises (point to demand curve).  
     - Workers paid per labor unit worked; unhired earn $0.  
  3. Distribute response cards (workers keep these private).  
  4. Initial state:  
     - Owner capital: $50.  
     - Workers: No devices.  

  #### **Round 1: Baseline Production (10 min)**  
  - **Owner action:** Hires all 17 workers. Each works 10 labor units.  
  - **Production:** 17 goods (17 workers × 1 good).  
  - **Price:** $9 (output = 17 → falls in 11–20 bracket).  
  - **Revenue:** 17 × $9 = $153.  
  - **Wages:** 17 workers × 10 labor units × $1 = $170.  
  - **Owner profit:** $153 – $170 = –$17. Owner capital: $50 – $17 = $33.  
  - **Unsold goods:** 0 (all output sold).  
  - **Whiteboard Update:**  
    ```  
    Output: 17 | Price: $9 | Revenue: $153 | Wages: $170 | Owner Capital: $33 | Unsold: 0  
    ```  
  - **Worker income:** $10 each.  

  #### **Round 2: Introduce Device (15 min)**  
  1. **Owner action:** Buys 1 device for $10. Capital now $23. Assigns device to one worker.  
  2. **Production:**  
     - Device worker: 10 labor units → 2 goods.  
     - Other 16 workers: 10 labor units → 1 good each.  
     - Total output: 18 goods.  
  3. **Price:** $9 (output = 18 → still 11–20 bracket).  
  4. **Revenue:** 18 × $9 = $162.  
  5. **Wages:** 17 workers × 10 labor units × $1 = $170.  
  6. **Owner profit:** $162 – $170 = –$8. Capital: $23 – $8 = $15.  
  7. **Unsold goods:** 0.  
  8. **Whiteboard Update:**  
     ```  
     Output: 18 | Price: $9 | Revenue: $162 | Wages: $170 | Owner Capital: $15 | Unsold: 0  
     ```  
  9. **Worker income:** $10 each.  
  - **Key moment:** Output rose, but owner capital fell. Workers see no gain.  

  #### **Round 3: Threat Emerges (20 min)**  
  1. **Owner action:**  
     - Buys 2 more devices ($20). Capital now $15 – $20 = –$5 (owner takes a $5 loan from facilitator; debt must be repaid).  
     - Assigns devices to 2 more workers (3 device workers total).  
     - To restore profitability, hires only 15 workers (lays off 2).  
  2. **Production:**  
     - 3 device workers: 10 labor units → 6 goods.  
     - 12 non-device workers: 10 labor units → 12 goods.  
     - Total output: 18 goods.  
  3. **Price:** $9 (output = 18 → 11–20 bracket).  
  4. **Revenue:** 18 × $9 = $162.  
  5. **Wages:** 15 workers × 10 labor units × $1 = $150.  
  6. **Owner profit:** $162 – $150 = $12. Capital: –$5 + $12 = $7.  
  7. **Unsold goods:** 0.  
  8. **Whiteboard Update:**  
     ```  
     Output: 18 | Price: $9 | Revenue: $162 | Wages: $150 | Owner Capital: $7 | Unsold: 0  
     ```  
  9. **Worker income:**  
     - Hired workers: $10 each.  
     - Unhired workers: $0.  
  - **Key moment:** Productivity gain manifests as unemployment. Shelves remain full, but wages fall for some.  

  #### **Worker Response Phase (15 min)**  
  1. **Facilitator:** "The owner has laid off workers. Workers, choose a response card in secret. You have 3 minutes."  
  2. **Collect and reveal responses.**  
  3. **Consequences:**  
     - **Accept:** No change.  
     - **Strike:** If ≥6 workers chose this, production halts for the round. All workers earn $0; owner earns $0.  
     - **Sabotage:** If chosen, one random device is destroyed (remove card). Production occurs as planned.  
     - **Pool savings:** Each choosing worker contributes $5. If total ≥$10, workers buy one device (to be used in debrief).  
     - **Shorter hours:** If a hired worker chose this, they work 5 labor units but demand $10. Owner may fire them (replacement hired only if others are unemployed).  
  4. **Predictable outcome:**  
     - Sabotage/strike likely chosen (immediate relief).  
     - Pooling rarely funded (workers lack savings; requires coordination).  
     - Shorter hours often leads to firing (owner refuses to pay $10 for half labor).  

  #### **Debrief (30 min)**  
  **Guided Discussion:**  
  1. **Productivity Gain (5 min):**  
     - "In Round 2, what happened to output when the device was introduced? Why didn’t workers benefit?"  
     - **Map to Marx:** Machinery is productive (output ↑), but under capitalism, gains are captured as profit or lower prices, not worker welfare. Skill transfers to the machine.  

  2. **Threat Emerges (5 min):**  
     - "In Round 3, why did layoffs happen? What happened to wages and unsold goods?"  
     - **Map to Marx:** Competition forces cost-cutting → unemployment ("reserve army"). Displaced workers are not compensated; overproduction looms.  

  3. **Responses and Irony (10 min):**  
     - "Which responses felt rational in the moment? Why were they self-defeating collectively?"  
     - **Map to Marx:** Striking/sabotage defends short-term interests but destroys productive forces. Pooling is structurally hard under wage labor.  

  4. **The Blocked Alternative (5 min):**  
     - "What if workers demanded shorter hours at the same pay? Why didn’t the owner allow it?"  
     - **Map to Marx:** Profit depends on labor time extraction. The scoring rule (wages tied to labor units) blocks free time gains.  

  5. **The Bigger Picture (5 min):**  
     - "What would happen if machines did all the work? Where would value come from?"  
     - **Candid note:** Marx’s "value from labor" creates a paradox in automation (interpretive dispute).  
     - **Closing Quote:** Display on whiteboard:  
       > *"Large industry reveals the monstrous disproportion between the labour time applied, and its product."* —Grundrisse.  
     - "You saw this disproportion. The system can’t convert it into freedom because the rules prioritize output over life."  

  ---

  ### Predictable Failures and Fixes  
  1. **Owner Doesn’t Buy Devices:**  
     - Whisper: "Maximize profit. Devices cut labor costs long-term." Show demand curve to incentivize output expansion.  
  2. **Workers Revolt Early:**  
     - If strikes/sabotage dominate Round 2, proceed. Highlight: "Your response was rational, but did it address the root cause?"  
  3. **Pooling Succeeds:**  
     - Rare. If funded, let workers use the device in a hypothetical Round 4. Ask: "Could this scale? What stops it?"  
  4. **Arithmetic Errors:**  
     - Assign a student as "banker" to assist. Use whole numbers only.  

  ---

  ### Theoretical Fidelity vs. Pedagogical Realism  
  - **Fidelity Sacrifice:** Simplified demand curve (one firm, not economy-wide). **Why?** Time constraints; systemic competition is inferred in debrief.  
  - **Realism Sacrifice:** No inter-firm competition. **Why?** Focus on firm-worker dynamics; avoids overcomplication.  

  ---

  ### What the Activity Cannot Reproduce  
  **The Systemic Dimension:**  
  Marx’s analysis operates at the macro level (e.g., global reserve army, inter-capitalist competition). The simulation abstracts to a single firm.  

  **How to Supply It:**  
  During debrief, say:  
  > "In reality, your firm competes with others. If one owner cuts costs via machines, others must follow or fail. This race forces widespread automation, expanding the reserve army globally. Your individual actions—even if all firms did this—are constrained by this systemic logic. Capitalism’s rules turn progress into collective insecurity."  

  ---

  **Gist:** Participants feel how capitalism’s rules force a productivity gain to become a shared threat, trapping everyone in a game where rational choices breed collective ruin, and freedom is buried in plain sight.
