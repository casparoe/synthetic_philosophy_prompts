     - The coin is fair; P(heads) = P(tails) = 1/2 on Sunday.  
     - If the experiment were modified to eliminate amnesia and multiple awakenings (e.g., awaken only on Monday regardless of the coin), credence upon awakening would be 1/2.  
     - If Beauty were never amnesiac and awakened twice on tails, her credence on Tuesday would be 0.  
  6. **Variable Awakenings Variant Setup**:  
     - A fair coin (Coin 1) is flipped. If heads, Beauty is awakened once (Monday).  
     - If tails, a second fair coin (Coin 2) is flipped:  
       - If Coin 2 heads, Beauty is awakened twice (Monday, Tuesday).  
       - If Coin 2 tails, Beauty is awakened three times (Monday, Tuesday, Wednesday).  
     - Amnesia is administered after each awakening. Upon each awakening, she is asked for her credence that Coin 1 landed heads.  
  7. **Betting in Variant**: On each awakening, Beauty is offered a bet on Coin 1 being heads at 2:1 odds (win $2 if heads; lose $1 if tails). She must decide whether to accept, knowing her total payoff is the sum of all accepted bets. Beauty aims to maximize expected payoff.  

  #### 2. Disagreements  
  The table below summarizes key disagreements, with each side's position in their own words.  

  | Issue | Halfer Formulation | Thirder Formulation | Crux | Halfer Prediction for Crux | Thirder Prediction for Crux |  
  |-------|-------------------|---------------------|------|----------------------------|----------------------------|  
  | **A. Standard Credence**: Beauty’s credence in heads upon awakening. | "Beauty’s credence in heads should be 1/2. The coin flip is fair and amnesia does not provide new evidence to alter this probability." | "Beauty’s credence in heads should be 1/3. Amnesia forces her to weight awakenings equally, making tails twice as likely as heads." | **Extreme Awakenings Test**: Suppose heads yields 1 awakening, tails yields 1,000,000 awakenings. What is Beauty’s credence in heads upon awakening? | Halfer: 1/2 (no change from base probability). | Thirder: ≈1/1,000,001 (inversely proportional to total awakenings). |  
  | **B. Variant Credence**: Beauty’s credence in Coin 1 being heads upon awakening. | "Beauty’s credence in Coin 1 being heads should be 1/2. Coin 1’s fairness is unaffected by Coin 2 or awakenings." | "Beauty’s credence in Coin 1 being heads should be 2/7 (≈0.286). Credence is proportional to Coin 1’s probability multiplied by its awakening count, normalized over all possible awakenings." | **Modified Variant Test**: Suppose tails always yields N awakenings (ignore Coin 2). What is credence in heads? | Halfer: 1/2 (Coin 1’s probability is independent). | Thirder: 1/(1 + N) (credence decreases as N increases). |  
  | **C. Betting in Variant**: Should Beauty accept the 2:1 bet on each awakening? | "Beauty should accept the bet. Her credence for heads is 1/2, so expected value (EV) per bet is positive: (1/2)·2 + (1/2)·(−1) = $0.50." | "Beauty should reject the bet. Her credence for heads is 2/7, so EV per bet is negative: (2/7)·2 + (5/7)·(−1) ≈ −$0.14." | **Long-Run Payoff Test**: If Beauty always accepts, what is the expected total payoff per experiment? (Both agree on the calculation method.) | Halfer: −$0.25 (but per-bet EV justifies acceptance). | Thirder: −$0.25 (and per-bet EV confirms rejection). |  

  #### 3. Cruxes  
  Each crux is a sub-question where settling it would change at least one side’s position. Both parties agree on the test for each crux and provide advance predictions.  
  - **Crux for A (Standard Credence)**: The *Extreme Awakenings Test* (1 vs. 1,000,000 awakenings). The halfer predicts credence remains 1/2; the thirder predicts it approaches 0. If empirical evidence showed credence approaches 0, the halfer would reconsider their position.  
  - **Crux for B (Variant Credence)**: The *Modified Variant Test* (tails yields N awakenings). The halfer predicts credence remains 1/2; the thirder predicts 1/(1 + N). If N is large and credence approaches 0, the halfer would reassess.  
  - **Crux for C (Betting)**: The *Long-Run Payoff Test*. Both agree the expected total payoff for always accepting is −$0.25 per experiment. The halfer predicts per-bet EV ($0.50) justifies acceptance; the thirder predicts per-bet EV (−$0.14) justifies rejection. If Beauty loses money in repeated trials, the halfer would need to reconcile per-bet reasoning with aggregate outcomes.  

  #### 4. Verbal Dispute  
  The core disagreement is partially verbal, centering on the **definition of evidence**. Both agree Beauty gains no *new informational content* upon awakening (she knew she would be awakened). However:  
  - The **halfer** defines "evidence" as *new informational content*. Since Beauty learns nothing beyond Sunday’s knowledge, her credence should not update (remains 1/2).  
  - The **thirder** defines "evidence" as *the observer’s current state of awareness*. Awakening is a state that occurs more frequently under tails, so it must update credence (to 1/3 or 2/7).  
  This reduces to: Is "I am awake now" evidentially relevant? The halfer says no (it was guaranteed); the thirder says yes (its likelihood differs per outcome). The dispute is verbal because both descriptions are consistent internally; it hinges on whether one conditions on *the fact of awakening* or *the experiment’s initial conditions*.  

