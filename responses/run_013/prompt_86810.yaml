prompt: |-
  I host a small metaphysics podcast and next weeks guest is a philosopher who's been defending a stubborn line on the statue-and-the-clay for years. Her view: the statue and the lump of clay are two numerically distinct things occupying the same place at the same time, and the reason they differ modally (the lump survives being squashed, the statue doesn't) isn't grounded in any difference in their material or in any other fact about them -- she thinks modal properties are only ever had relative to a sort of thing, so the lump can survive squashing as a lump and the statue can't survive it as a statue, and there's no further fact that determines which sortal each one falls under. I want 8-10 interview questions that stop her from just restating this. At minimum I need one on the grounding/explanatory worry (what makes it the case that a given thing counts as a lump rather than a statue, if nothing intrinsic does), one on counting (how many things are on the pedestal, and is she going to say the question is ill-formed?), one on whether making modality sortal-relative makes it conventional or mind-dependent (would there be no statues in a world with no thinkers, and is that a cost?), one on how her line differs from the older moves that say the two are identical but only contingently, or that identity itself is sortal-relative, and why hers is better, and one on whether a deflationist who calls the whole thing a verbal dispute has a point. Give a one-line follow-up to each question, keyed to the answer she'd most likely give.
reasoning: |-
  Okay, the user hosts a metaphysics podcast and has a philosopher guest with a unique take on the statue-and-clay problem. She believes the statue and clay are distinct, co-located objects whose modal properties depend on sortals without any intrinsic grounding. The user wants interview questions that push beyond restatements, targeting specific weaknesses.

  Hmm, the user clearly knows their stuff—they've pinpointed key metaphysical pressure points: grounding, counting, mind-dependence, and deflationism. Their phrasing ("stubborn line") suggests they want to challenge the guest rigorously but fairly. Probably aiming for listener engagement through dialectical tension.

  First, the grounding question is essential. If nothing intrinsic determines sortal membership, what does? The guest might dodge by calling it primitive, but the follow-up must press that cost. I'll frame it as "what facts constitute sortal assignment" to force specificity.

  Next, counting. Dualists often say "how many" is ill-formed without sortals. The follow-up should highlight how this clashes with ordinary object quantification—listeners will relate to that. Maybe mention the pedestal example for concreteness.

  Mind-dependence is juicy. If sortals require thinkers, does that make statues disappear if consciousness vanishes? The guest might bite the bullet, but the follow-up can underscore the anti-realist implications. Podcast audiences love radical consequences.

  Contrasting with older moves (contingent identity/sortal-relative identity) needs care. The guest likely rejects them for conflating numerical identity with modality. Follow-up should probe why her "two objects" view avoids their pitfalls better—maybe spotlight persistence conditions.

  Deflationism is the closer. If she dismisses it as "trivial verbal," the follow-up can question why metaphysical debates persist among experts. That’ll resonate with podcasters facing "why does this matter?" critiques.

  ...Wait, should I add causation? If two objects occupy the same space, why don’t they causally interfere? But the user didn’t request it—stick to their list. They’ve clearly prepped this interrogation.

  Structure: 8 questions total. Lead with grounding (most fundamental), end with deflationism (punchy). Slot counting early since it’s intuitive. Mind-dependence and comparative questions in the middle. Follow-ups must be surgical—no open-ended waffle room.
answer: |-
  Here are 8 targeted interview questions designed to push beyond restatement, with focused follow-ups anticipating her likely answers:

  1.  **Question (Grounding):** "You argue that *nothing intrinsic* about the matter or its arrangement determines whether a particular portion of reality counts as a *lump* or as a *statue*. If it's not intrinsic properties, what *does* constitute the fact that *this* thing here is a lump, while *that* co-located thing is a statue? What are the truthmakers for sortal ascriptions?"
      *   *Likely Answer:* Sortal concepts are fundamental/primitive, or their application isn't grounded in deeper non-sortal facts; it's just a brute fact about how we conceptualize reality.
      *   **Follow-Up:** "So, if it's brute or primitive, doesn't that mean there's ultimately *no explanation* for why *this* parcel of clay instantiates the 'lump' sortal rather than, say, the 'statue' sortal at this moment, other than our conceptual scheme?"

  2.  **Question (Counting):** "On your view, how many *material objects* are currently sitting on the pedestal where the statue/lump is? Is it one object (the matter), two objects (statue + lump), or something else? How do you answer the literal question: 'How many things are on the pedestal?'"
      *   *Likely Answer:* The question "How many things?" is fundamentally ill-formed or ambiguous *without* specifying a sortal. Under the 'lump' sortal, there's one thing; under the 'statue' sortal, there's one thing; but there isn't a privileged sortal-independent count.
      *   **Follow-Up:** "But doesn't this make ordinary quantification ('There are three chairs in the room') systematically ambiguous or incomplete in a way that seems counterintuitive? Are we *always* tacitly specifying a sortal when counting?"

  3.  **Question (Mind-Dependence/Conventionalism):** "If modal properties (like survival conditions) are only had relative to sortals, and sortal ascriptions aren't grounded in intrinsic features, does this imply that in a universe devoid of any conscious beings or concepts, there *are no statues, no lumps, no artifacts* – just undifferentiated matter?"
      *   *Likely Answer:* Yes, sortal concepts (and thus the objects individuated by them, like statues or lumps *as such*) depend on minds or conceptual frameworks; without minds, there's just matter arranged statue-wise or lump-wise, but no statue or lump *object*.
      *   **Follow-Up:** "So, accepting that cost, does this mean the existence of distinct, co-located objects like the statue and the lump is ultimately *mind-dependent* or a feature of our conceptual scheme, rather than a fundamental feature of reality itself?"

  4.  **Question (Contrast w/ Contingent Identity):** "How does your view differ fundamentally from the older position that the statue and the lump are *identical*, but only *contingently* so (i.e., they are one thing, but that one thing could have been a statue without being a lump, or vice versa)? Why is positing two distinct things better than contingent identity?"
      *   *Likely Answer:* Contingent identity violates Leibniz's Law (the indiscernibility of identicals) because the statue and lump have different modal properties *even at the same time* (one survives squashing, the other doesn't). Positing two things avoids attributing incompatible properties to one thing.
      *   **Follow-Up:** "But doesn't the contingent identity theorist simply deny that persistence conditions are genuine properties had *at a time*? They might say 'could survive squashing' isn't a property of the object *now*, but a fact about its future potential under counterfactuals. Why is your interpretation of modal properties as sortal-relative properties had *at a time* more compelling?"

  5.  **Question (Contrast w/ Sortal-Relative Identity):** "How does your view differ from 'sortal-relative identity' (Geach), which says identity itself is relative to a sortal (so 'x is the same lump as y' can be true while 'x is the same statue as y' is false)? Why is numerical distinctness + co-location preferable to relative identity?"
      *   *Likely Answer:* Sortal-relative identity introduces massive ambiguity into the fundamental relation of identity itself and makes transitivity fail, leading to paradoxes. My view retains classical, absolute numerical identity/difference; it just allows multiple things to coincide.
      *   **Follow-Up:** "But doesn't your view also face a proliferation problem? If we need distinct objects for every distinct set of persistence conditions tied to a sortal (e.g., 'lump', 'statue', 'paperweight', 'work of art'), doesn't this lead to an explosion of co-located objects in one place?"

  6.  **Question (Explanatory Power):** "What specific problem or paradox does your view solve *better* than its main rivals (like the one-object dominant sortal view, or constitution without identity, or deflationism)? What's the key advantage that outweighs the costs of co-location and primitive sortals?"
      *   *Likely Answer:* It cleanly solves the modal argument without violating Leibniz's Law, without making identity relative or contingent, and without denying the intuitive distinctness of the statue's fate vs. the lump's fate.
      *   **Follow-Up:** "But does this 'clean' solution come at the expense of making the *individuation* of objects (what makes something *one* lump or *one* statue) inexplicable and potentially arbitrary, resting solely on primitive sortal concepts?"

  7.  **Question (Causal Exclusion/Overdetermination):** "If the statue and the lump are two distinct objects in the same place at the same time, made of the same matter, why doesn't every causal interaction involving that matter involve massive causal overdetermination? For instance, if the statue is moved, is the lump also moved? Are there two distinct but perfectly coinciding causal events?"
      *   *Likely Answer:* No, there's only one causal process involving the matter; the statue and the lump don't causally compete because they are materially coincident. The effects (e.g., the pedestal being dented) are caused by the matter, and both objects are constituted by that matter.
      *   **Follow-Up:** "But if both objects are distinct and constituted by the same matter, and the matter causes the dent, doesn't that mean the dent is *overdetermined* by the statue *and* the lump? Or does this force us to say only the matter is causally efficacious, making the statue and lump epiphenomenal?"

  8.  **Question (Deflationism/Verbal Dispute):** "A deflationist might argue that all this debate about 'one thing or two' is merely a verbal dispute about how we apply the concepts 'statue' and 'lump of clay' to a single portion of reality. How do you respond to the charge that your view, by relying so heavily on primitive sortals, essentially concedes the core point to the deflationist?"
      *   *Likely Answer:* The modal differences (what survives what) are robust, objective features of reality that need explaining; deflationism trivializes a genuine metaphysical puzzle by dismissing the underlying reality of persistence conditions and objecthood.
      *   **Follow-Up:** "But if the *ground* for those modal differences is ultimately just our conceptual scheme (the primitive sortals), doesn't the deflationist have a point that the 'robustness' is an illusion generated by language, not discovered in the world?"

  These questions directly target the core commitments and perceived weaknesses of her view (primitiveness of sortals, co-location, mind-dependence, proliferation, explanatory gaps) while contrasting it with alternatives. The follow-ups are designed to prevent easy restatements and push for clarification of the implications or costs of her position. Good luck with the interview!
