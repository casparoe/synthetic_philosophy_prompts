  Subject: The Principle Behind Your Gut Verdicts  

  I've spent some time with your decision cases, and I think I've pinpointed the principle guiding your instincts. It’s subtle and hinges on whether the prediction is fundamentally about the *actual* choice you’re making in the world you inhabit, or about a *counterfactual* version of you in a world that doesn’t exist. The key is that you only respect predictive reasoning when the outcome is determined by the very act you’re performing right now. If the prediction is about what you’d do in a different scenario—even if it feels linked—you default to causal realism: acting as if your choice only affects downstream events, not the prediction itself.  

  Here’s the principle formalized:  
  **You act to maximize outcome based on predictions when (a) the prediction is directly about your current action in the actual world, and (b) the outcome is still causally unset by your decision. Otherwise, you act on immediate causal consequences.**  

  Now, let’s apply it to your cases:  
  - **Sealed Box**: You take only the sealed box. The simulation predicts *this exact choice*: whether you take one box or both. The money’s presence depends on the act you’re performing now, so you lean into the prediction. Condition (a) and (b) are met—your act is the one being predicted, and the money isn’t causally "fixed" yet (you could still take both and override the prediction).  
  - **Gene/Food**: You eat the food. The gene is a correlative marker, not a cause. Your choice doesn’t affect disease risk, so you ignore the prediction-like link and act on direct causality (enjoyment now). Here, (a) fails—the "prediction" (disease risk) isn’t about your *action* at all.  
  - **Coin Flip**: You don’t pay. The simulation predicted what you’d do *if this scenario occurred*, but the outcome (the $10K) exists only in the counterfactual tails world, which didn’t happen. In the actual world (heads), paying $100 gains nothing and loses money. Condition (a) fails—the prediction isn’t about *this specific choice*; it’s about a hypothetical "you" in a world that’s now impossible. You default to causal cost (losing $100).  
  - **Desert Driver**: You pay. The driver predicted your *actual end-of-trip payment decision* based on your character. Paying fulfills the prediction he relied on, and though the ride is past, the outcome (your reputation, future trust) is still influenced by acting consistently. Conditions (a) and (b) hold—your act *is* the one predicted, and the outcome (e.g., whether the driver regrets picking you) isn’t fixed until you choose.  
  - **Weak Predictor**: You two-box. If the predictor is unreliable, your action *causally overrides* the prediction (taking both likely gets you something regardless of the sim). Here, (b) is violated—the prediction is so weak that your choice causally determines the outcome more than the sim does.  

  The coin flip and sealed box felt contradictory, but the difference is in the *target* of the prediction. In the sealed box, it’s about your literal movement: taking one box or two. In the coin flip, it’s about what you’d do in a *different* universe (tails), so you reject it as irrelevant to your actual situation. The desert driver works because the prediction was about *this payment*, not a hypothetical one—even though the ride is past, the payment decision is still "live" and identity-defining.  

  Now, a new case to test the principle:  
  **The Charity Predictor**. A foundation has simulated you. If they predicted you’d *donate $50* today, they’ve already added $10,000 to a fund for a cause you support. If not, they added nothing. You’re deciding now whether to donate $50. Their prediction is locked in, and your donation doesn’t affect their funds—only their prediction does.  

  Your principle’s verdict: **Donate the $50**. The prediction is directly about *this donation choice* in the actual world (condition a), and the outcome ($10K added or not) depends on it (condition b). Even though the funds are "set," acting as predicted ensures you were the kind of person who triggered the $10K. If the prediction were about whether you’d donate *if a volcano erupted tomorrow* (a counterfactual), you’d keep your $50—since it wouldn’t relate to your actual choice.  

  What must be thrown out? Your principle holds *all five* of your gut verdicts. The tension between sealed box and coin flip resolves because one predicts the actual choice, the other a counterfactual. The desert driver fits cleanly when seen as a prediction about the payment itself. Where you might feel unease is in the coin flip: some decision theories (like updateless) argue you should pay to "be the type" who gets $10K in tails worlds. Your instinct rejects that—prioritizing actual causality over counterfactual identity—and the principle honors that.  

  In short, you’re not inconsistent; you’re distinguishing predictions that mirror your reality from those that don’t. It’s a hybrid of evidential thinking (when the prediction aligns with your actual choice) and causal pragmatism (when it doesn’t). If this rings true, it might explain why none of the textbook decision theories captured all five—they often force a universal rule, but your intuition is contextually nuanced.  

  Let me know if this clarifies things or if you’d like to stress-test it further.  

  Best,  
  [Your Name]
