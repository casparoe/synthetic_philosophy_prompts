prompt: |-
  Over the past few months I have found myself in a small tenants' collective where the same argument keeps resurfacing. Several of us think that in a one-shot standoff with our landlord each of us should act on the assumption that the others will arrive at the same decision we do — that 'we all hold out' can be rational even though holding out pays only if the others do too, and defecting pays best if they hold out. A friend with an economics background insists this is wishful thinking in formal dress, since my decision does not causally influence anyone else's. I take this to be the dispute that has run for decades under the name of superrationality, and it has the same inert quality: the sides agree about the payoffs and about the causal structure, and still nothing moves.

  I would like a diagnosis rather than a verdict. Is this a substantive disagreement, or are the two sides answering different questions under one name — one asking what an agent should do given the causal facts, the other asking what an agent should do given that it is one of several instances of the same reasoning process? My working hypothesis is that the impasse rests on an unstated disagreement about what individuates a decision problem: whether a problem is fixed by the physical situation or by the agent's algorithm and evidence, so that 'the same problem' means something different on each side. If that is right, is superrationality even a claim that can be true or false until that prior question is settled? And if the disagreement is more than verbal, what would count as progress here — a distinction, a formal result, or a change of question?
reasoning: |-
  Okay, let me try to unpack this user's query. They're part of a tenants' collective stuck in a recurring argument about whether it's rational to hold out against the landlord in a one-shot standoff. Some believe that assuming others will do the same makes collective action rational, while the economics-minded friend argues that's wishful thinking since one's decision doesn't causally affect others. The user sees this as the superrationality debate and wants a diagnosis, not a verdict.

  Hmm, the user is clearly well-versed in the philosophical and game theory aspects here. They mention superrationality, which refers to Douglas Hofstadter's idea where identical rational agents might cooperate in prisoner's dilemmas. The user suspects the core disagreement is about how to individuate decision problems—whether it's based on physical situation or the agent's algorithm and evidence. That's a sharp insight. 

  I should start by mapping both positions clearly. The economics perspective (causal decision theory) says: your action doesn't affect others, so defect is dominant. The superrationality view (logical/reflective decision theory) says: if all agents use identical reasoning, then "we all cooperate" can be a fixed point. 

  The user's hypothesis about individuation seems spot-on. If "same decision problem" means identical causal setups, defection is rational. If it means identical reasoning processes, cooperation becomes conceivable. This isn't just verbal—it's about what counts as a "solution" to a game. 

  Important to note: neither side denies the other's premises. They're applying different rationality criteria. The user asks if superrationality can even be true/false without settling this prior. I think that's right—it's meta-rationality. 

  For progress? Distinctions matter most. Formal results (like Hofstadter's clustering in PD tournaments) show cooperation can emerge under specific conditions, but they don't resolve the normative question. The deepest progress might be recognizing that rationality isn't monolithic—it depends on what we mean by "should" in "what should I do?" 

  User seems frustrated by the debate's inertness. They'd benefit from framing it as two valid but incompatible lenses: one optimizing causal consequences, the other logical coherence among identical reasoners. No knockdown argument exists; the real progress is in clarifying the divergence. 

  Also worth mentioning: in real tenant scenarios, repeated interactions or communication might break the deadlock, but user explicitly wants the one-shot analysis. Their meta-focus is impressive—they're not seeking ammunition for their side but diagnosing the stalemate. That deserves a nuanced response.
answer: |-
  Your diagnosis is perceptive: this is a **substantive disagreement rooted in divergent conceptions of what constitutes a "decision problem" and what rationality demands**. The impasse arises because both sides are answering *different normative questions* under the same label of "rational choice." Here's a breakdown:

  ---

  ### 1. **The Core Disagreement: What Individuates a Rational Decision?**
  Your hypothesis is correct. The two positions rely on distinct frameworks for defining a decision problem:
  - **Causal Decision Theory (CDT - Economics View):**  
    A problem is defined by **physical causality and counterfactual dependence**. Your action has no causal effect on others' actions (they decide independently). Rationality requires maximizing *your* payoff given the *fixed* strategies of others. Since defecting dominates regardless of others' choices ("hold out" pays best if others defect; defecting pays best if they hold out), CDT demands defection.  
    *Problem Individuation:* Fixed by the physical setup (payoffs, information, causal independence).

  - **Reflective/Logical Decision Theory (Superrationality View):**  
    A problem is defined by **logical symmetries and shared reasoning processes**. If all agents are identical rational entities facing identical problems, your decision *logically implies* what theirs must be (since they reason identically). Rationality requires choosing a strategy that is consistent when *universally adopted*. "All hold out" becomes rational if it's the only symmetric Nash equilibrium or a "fixed point" of rational deliberation.  
    *Problem Individuation:* Fixed by the agent's algorithm, evidence, and the logical unity of the decision context.

  ---

  ### 2. **Is Superrationality "True or False"? A Misplaced Question**
  Superrationality isn't a factual claim to be verified—it’s a **competing normative framework**. Its validity depends on prior commitments:
  - If rationality is **causal-utilitarian** (CDT), superrationality appears incoherent (your choice doesn’t *cause* others to cooperate).  
  - If rationality is **logically consistent** across identical agents (e.g., Hofstadter's "superrationality" or Gauthier’s "constrained maximization"), it becomes compelling.  

  **Neither framework is "wrong"**; they optimize different values:  
  - CDT maximizes *individual causal expected utility*.  
  - Superrationality maximizes *collective/logical coherence* among symmetric agents.  

  ---

  ### 3. **The Substance Beneath the Verbal Dispute**
  The disagreement is more than verbal because it reveals **competing intuitions about agency and interdependence**:
  - **CDT** treats agents as **causally isolated** in a one-shot game.  
  - **Superrationality** treats agents as **logically entangled** by shared rationality.  

  This mirrors philosophical splits:
  - **Humean vs. Kantian Rationality:** CDT is instrumental (means-end efficiency); superrationality is universalizing (what if everyone did this?).  
  - **Physics vs. Logic:** CDT is grounded in empirical causality; superrationality in logical necessity among identical reasoners.  

  ---

  ### 4. **Paths to Progress**
  Resolution requires clarifying the *context of inquiry*, not declaring a winner:
  - **Distinction:** Explicitly separate the questions:  
    - *Q₁ (CDT):* "What should I do given my action has no causal influence on others?"  
      → **Defect.**  
    - *Q₂ (Superrationality):* "What should identical agents facing identical problems do, knowing their decisions must be logically aligned?"  
      → **Cooperate.**  

  - **Formal Result:** Show the *conditions* under which each applies:  
    - Superrationality requires **symmetric knowledge of identical reasoning** (all know all are rational clones).  
    - CDT applies when agents are **causally independent or epistemically distinct**.  
    *(Example:* In Hofstadter’s "Prisoner’s Dilemma Tournament," identical programs achieve mutual cooperation; diverse programs defect.)  

  - **Change of Question:** Shift from *"Which is rational?"* to *"What do we value?"*:  
    - If you value **individual payoff security**, CDT wins.  
    - If you value **collective optimization under symmetry**, superrationality wins.  

  - **Empirical/Pragmatic Test:** In real tenant negotiations:  
    - If tenants can **communicate/build trust** (breaking symmetry), cooperation emerges.  
    - If they’re **strangers with no coordination**, defection dominates.  
    *(Superrationality works best in highly idealized, recursive settings—e.g., AI agents with shared code.)*  

  ---

  ### Final Diagnosis
  The impasse reflects **two valid but incompatible notions of rationality**, each answering a different question:
  - **CDT** answers: *"What maximizes my payoff in a causally disconnected world?"*  
  - **Superrationality** answers: *"What would identical versions of me choose if our choices are logically interdependent?"*  

  Progress lies in **mapping the boundaries** between these frameworks—not in a verdict. Your collective’s stalemate persists because tenants are intuitively appealing to logical interdependence ("we’re all in the same boat!"), while your economist friend insists on causal independence ("your signature doesn’t control theirs"). Both are "right" within their domains. To move forward, acknowledge the duality: in a **perfectly symmetric group with shared rationality**, holding out *is* rational; in a **heterogeneous or distrustful group**, it’s not. The solution isn’t debate—it’s building enough symmetry (via communication, norms, or repeated interaction) to make superrationality applicable.
