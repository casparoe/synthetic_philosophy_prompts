answer: |-
  Below is a decision tree designed to navigate the logical space of moral judgment theories, based on your specified axes and requirements. The tree uses concrete questions (grounded in your examples) to guide the user to a named position without presupposing labels. Each branch node is a question answerable without knowing the destination, and the leaves include both named positions and vacancies (unoccupied grid points). I'll first outline the tree's structure, then populate it with positions, and finally address vacancies and inseparabilities.

  ### **Decision Tree: Moral Judgment Theories**
  **Start with Axis 1 (Holism/Atomism):**  
  **Q1.** Consider a lie told to protect someone (e.g., misleading an intruder to save a friend). Is the fact that an act is a lie *always* a reason against doing it (even if outweighed by other reasons), or could it be *no reason at all* (or even a reason *in favor*) in some situations?  
  - **A. Always a reason against (atomism)** → Proceed to Q2.  
  - **B. Not always; context can negate or reverse it (holism)** → Proceed to Q5.  

  **Branch A: Atomism (Reasons are invariant)**  
  **Q2.** Are there true universal moral generalizations (e.g., "Lying is always pro tanto wrong")?  
  - **A. Yes** → Proceed to Q3.  
  - **B. No** → **Vacancy 1 (Incoherent)**. *Why?* Atomism requires reasons to be invariant, so denying universal generalizations (which codify this invariance) is contradictory.  

  **Q3 (If generalizations exist).** When a well-judging person condemns a cruel act that gives the agent pleasure (e.g., bullying for enjoyment), must they appeal to a general principle (e.g., "Pleasure in cruelty never counts in favor"), or can they know it’s wrong without such principles?  
  - **A. Must appeal (principles are operationally necessary)** → Proceed to Q4.  
  - **B. Can know without appeal (principles are idle)** → **Leaf: Principles as Reminders**.  
    - *Metaphysics:* Principles exist but do not ground rightness (e.g., they supervene on particular reasons).  
    - *Epistemology:* Principles are mnemonics, not justificatory premises.  

  **Q4.** Can a complete, usable set of principles resolve all cases without residue (e.g., specify exactly when lying is permitted)?  
  - **A. Yes** → **Leaf: Codifiability**.  
    - *Metaphysics:* Principles ground rightness (e.g., Kantian rules).  
    - *Epistemology:* Principles are necessary and sufficient for knowledge.  
  - **B. No** → **Leaf: Pro Tanto Principles**.  
    - *Metaphysics:* Principles identify pro tanto reasons (e.g., Rossian duties).  
    - *Epistemology:* Principles guide but require weighing (judgment is irreducible).  

  **Branch B: Holism (Reasons are context-sensitive)**  
  **Q5.** Are there true universal moral generalizations?  
  - **A. Yes** → Proceed to Q6.  
  - **B. No** → Proceed to Q10.  

  **Q6 (If generalizations exist).** When judging a cruel act that gives the agent pleasure, must a well-judging person appeal to a general principle?  
  - **A. Yes** → Proceed to Q7.  
  - **B. No** → **Leaf: Principles as Reminders** (same as above).  

  **Q7 (If principles are operationally necessary).** Consider an excuse for breaking a promise (e.g., "I had to help an accident victim"). If that excuse is challenged (e.g., "The victim was a criminal"), can we list *all* valid defeaters in advance, or is each case open to new exceptions?  
  - **A. Finite, specifiable list (closed exceptions)** → **Vacancy 2 (Unattractive)**. *Why?* Holism’s context-sensitivity makes fixed lists implausible; this view is rare and unstable.  
  - **B. No closed list; new exceptions possible (open exceptions)** → Proceed to Q8.  

  **Q8.** Is an exception (e.g., "Break promises for emergencies") best seen as:  
  - **A. Part of the rule itself (refined specification)** → **Leaf: Progressive Specification**.  
    - *Metaphysics:* Norms are context-specific and evolve (e.g., Nussbaum’s capabilities).  
    - *Epistemology:* Judgment refines rules via new cases (no fixed principles).  
  - **B. A rival rule that overrides the default (defeater hierarchy)** → Proceed to Q9.  

  **Q9.** If an excuse (e.g., "emergency") is challenged, can its defeater (e.g., "emergency was fake") itself be defeated (e.g., "fake emergency was staged for good reason")?  
  - **A. Yes** → **Leaf: Default-like Generalizations**.  
    - *Metaphysics:* Rules hold by default but are defeasible (e.g., Pritchard’s defeasibility).  
    - *Epistemology:* Principles apply unless defeated; defeaters are recursive.  
  - **B. No** → **Vacancy 3 (Unexplored)**. *Why?* Hierarchies without recursion are theoretically possible but underexamined.  

  **Q10 (If no generalizations).** How is moral knowledge acquired?  
  - **A. By analogy to paradigm cases (e.g., "This lie is like the paradigm lie, but...")** → **Leaf: Analogical Reasoning**.  
    - *Metaphysics:* No principles; rightness emerges from case relations.  
    - *Epistemology:* Judgment uses analogies, not rules (e.g., casuistry).  
  - **B. By direct perception of particulars (no analogies)** → Proceed to Q11.  

  **Q11.** Are principles useful as memory aids for recurring features?  
  - **A. Yes** → **Leaf: Principles as Reminders** (same as above).  
  - **B. No** → **Leaf: Thoroughgoing Particularism**.  
    - *Metaphysics:* No principles; rightness is radically context-dependent (e.g., Dancy’s particularism).  
    - *Epistemology:* Judgment requires no principles, even as aids (moral perception suffices).  

  ---

  ### **Populated Logical Space**
  The tree uses three core axes to divide the grid:  
  1. **Holism vs. Atomism** (Q1).  
  2. **Existence of Universal Generalizations** (Q2/Q5).  
  3. **Operational Necessity of Principles** (Q3/Q6).  

  Axis 4 (exceptions) and Axis 5 (metaphysics/epistemology) are embedded in the questions and leaf descriptions. The named positions map to the leaves as follows:  

  | Leaf Position                     | Path in Tree                     | Key Features (Metaphysics/Epistemology) |
  |-----------------------------------|----------------------------------|-----------------------------------------|
  | **Codifiability**                 | Atomism → Gen. exist → Op. nec. → Complete | Principles are complete and sufficient for rightness/knowledge. |
  | **Pro Tanto Principles**          | Atomism → Gen. exist → Op. nec. → Incomplete | Principles give pro tanto reasons; weighing required for judgment. |
  | **Principles as Reminders**       | Atomism/Holism → Idle principles | Principles exist (or not) but are justificatorily idle; used only mnemonically. |
  | **Default-like Generalizations**  | Holism → Gen. exist → Op. nec. → Open exc. → Defeater recursion | Principles hold by default; defeaters can be recursively defeated. |
  | **Progressive Specification**     | Holism → Gen. exist → Op. nec. → Open exc. → Rule refinement | Norms evolve; exceptions refine rules (no fixed hierarchy). |
  | **Analogical Reasoning**          | Holism → No gen. → Analogy       | No principles; judgment by paradigm cases and resemblances. |
  | **Thoroughgoing Particularism**   | Holism → No gen. → Direct perception → No reminders | No principles; judgment is purely perceptual and particular. |
  | **Vacancy 1**                     | Atomism → No gen.                | Incoherent (atomism requires invariant reasons). |
  | **Vacancy 2**                     | Holism → Gen. exist → Op. nec. → Closed exc. | Unattractive (holism conflicts with fixed exceptions). |
  | **Vacancy 3**                     | Holism → Gen. exist → Op. nec. → No defeater recursion | Unexplored (possible but undefended). |

  ---

  ### **Inseparabilities and Vacancies**
  - **Inseparabilities (by your request):**  
    - **Progressive Specification vs. Default-like Generalizations:** Separated by Q9 (defeater recursion). If recursion is possible, it’s default-like; if not, it’s specification.  
    - **Thoroughgoing Particularism vs. Moral Perception:** Not separated. Both use direct perception (Q10B), but "moral perception" is a subset of thoroughgoing particularism (all particularists endorse perception, but not all reduce epistemology to it). The tree cannot split them without a question like "Is perception the only epistemic source?" which is too abstract.  
    - **Principles as Reminders vs. Analogical Reasoning:** Separated by Q10 (if principles are mnemonics but analogies are primary, it’s analogical reasoning; if principles are mnemonics without analogies, it’s reminders).  

  - **Vacancies (Unoccupied Grid Points):**  
    1. **Atomism without Generalizations (Q2B):** Incoherent (as explained).  
    2. **Holism with Closed Exceptions (Q7A):** Unattractive (context-sensitivity clashes with fixed lists).  
    3. **Holism without Defeater Recursion (Q9B):** Unexplored (no major theory denies recursion in defeasible rules).  

  ---

  ### **Support for Your Suspicion**
  Your hypothesis—that holism/atomism (Axis 1) does the most diagnostic work—is **strongly supported**. The tree shows:  
  - Atomism leads to codifiability/pro tanto (requiring universal generalizations).  
  - Holism branches into all other views (including analogical reasoning and particularism), with Axis 2/3 largely downstream. For example:  
    - Holism + generalizations → Default-like or Progressive Specification (depending on Axis 4).  
    - Holism + no generalizations → Analogical or Particularism (depending on epistemology).  
  This confirms Axis 1 as the primary divider, while Axes 2/3 refine positions within branches.  

  The tree isolates your listed positions and flags vacancies, with concrete questions preventing label-focused disputes. For unresolved pairs (e.g., particularism vs. perception), the issue is not the tree but the positions' overlapping commitments.
