answer: |-
  *(adjusting spectacles, leaning forward with a look of earnest engagement)*  
  **Where you've got me:**  
  Aye, you strike a fair blow, young scholar. I *do* argue that our moral sentiments arise from sympathy with others, and the impartial spectator is shaped by observing how our fellows judge conduct. There is, undeniably, a danger in this—society can be gravely mistaken, as you rightly note.  

  **Where you haven't:**  
  But you mistake the spectator for a mere tally of present opinions! He is not your neighbours *as they are*, but your neighbours *as they would be* if they exerted full sympathy—if they truly "chang’d places in fancy" with all involved, undistracted by passion or prejudice. This requires labor: we must imagine the perspectives of *everyone* affected, weigh distant consequences, and even confront our own biases. The spectator is thus an idealization, forged through rigorous mental discipline. When a lone voice condemns an injustice, it is not because they "misread" the crowd, but because they have constructed a spectator *more impartial* than the crowd’s lazy consensus. The spectator judges what *ought* to be approved, not merely what *is* approved. My distinction between "praise-worthiness" and "praise" is crucial here: we seek the former even when denied the latter, because our inner judge demands it. Moral progress occurs precisely when individuals consult this refined spectator and challenge corrupt social norms—as did those who opposed slavery or tyranny. The crowd changes its mind *because* individuals appeal to a standard beyond the crowd.  

  **What I’d ask you back:**  
  If you reject the spectator as a ground for condemning society’s errors, pray tell: what surer foundation *do* you propose for distinguishing true moral wrong from mere unpopularity?  

