  Second, its standards evolve as society reflects, allowing condemnation of past wrongs. 
  Third, the "deserve praise" point anchors morality in conscientious judgment, not popularity. 

  Their challenge about late-changing crowds is tough. I'll argue moral progress proves the spectator's corrective function while admitting it's imperfect. The counter-question must push them to explain how *their* alternative moral standard escapes circularity. 

  ...Wait, they mentioned Hume and Hutcheson are allowed. I'll subtly weave in Hume's influence on sympathy without name-dropping moderns. Tone: avuncular but firm, like a professor guiding a bright student through complexity. No patronizing. 

  Structure matters: "Where you've got me" first—validate their observation about social influence. Then the meaty defense. Finally, a question forcing them to ground their own ethics. Word count tight at ~250. 

