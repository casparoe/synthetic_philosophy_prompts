  Okay, the user wants to role-play a debate with Adam Smith for a school project, specifically focusing on his theory of the impartial spectator. They're clearly familiar with Smith's work beyond the usual "invisible hand" references—they've read about sympathy and moral judgment. 

  Hmm, they're sharp—their critique hits a genuine tension in Smith's theory: if the impartial spectator is constructed from social consensus, how can it critique that same consensus? They even referenced Smith's distinction between "deserving praise" versus "receiving praise," showing they've done close reading. 

  Right, I need to channel 18th-century Smith: no lectures, no modern terms, and crucially, no dumping quotes. They want living thought, not recitation. Their frustration with "neighbors with better information" is fair—I should concede that social bias exists but defend the spectator's aspirational nature. 

  Key defenses: 
