      P_2(s_2) &= 0.5714 \times 0.3 \approx 0.171, \\
      P_2(s_4) &= 0.4286 \times 0.3 \approx 0.129.
      \end{align*}
      \]  
    Final: \(Q_{A \to B} \approx (0.622, 0.171, 0.078, 0.129)\).  

  **ii. Update B then A (4 points):**  
