prompt: |-
  I am a torts practitioner. I have a working command of negligence doctrine — misfeasance and nonfeasance, the general absence of a duty to rescue and its recognised exceptions, breach, but-for and proximate causation — but no formal training in moral philosophy. I want to understand the philosophical debate about the doing/allowing distinction, and specifically the cluster of questions about killing versus letting die and acts versus omissions, by having it restated in the vocabulary I actually use.

  Take the principal families of position in that debate one at a time: first, the view that the distinction between doing and allowing marks a morally basic difference; second, the view that it marks no intrinsic moral difference at all and that our reactions to it are explained by something else; and third, the intermediate view that the distinction is real but derivative — that it matters only because of what it tracks, such as intention, the violation of a right, or the alteration of a course of events that would otherwise have run its course. Translate each of these as faithfully as you can into the doctrinal categories of tort: the act that triggers a duty versus the omission that does not, the special-relationship, undertaking, creation-of-risk and reliance exceptions to the no-duty-to-rescue rule, the line between breach and a mere failure to confer a benefit, and the causal apparatus of but-for and proximate cause. Do not assume in advance that the philosophers are really talking about legal duty; where a position resists the translation, resist it visibly rather than bending it into doctrine.

  Then give me the residue report. Which claims carry over cleanly, which survive only in a distorted form, and which cannot be expressed in my vocabulary at all? I am most interested in three questions. First, whether the philosophers' distinction corresponds to anything more than the law's distinction between an act that creates a duty and an omission that leaves the pre-existing state of affairs alone — or whether, once the translation is done, the moral asymmetry turns out to be doing no work beyond the conventional allocation of duties. Second, what becomes of the clinical case in which a treatment already begun is withdrawn rather than never initiated: the doctrinal ideas of undertaking, reliance and creation of risk seem to make the withdrawal the graver of the two, whereas the clinical consensus, as I understand it, treats them as morally equivalent, and I want to know whether that equivalence can be stated in my vocabulary or only denied in it. Third, whether the residue is best read as a defect of the doctrinal framework — something it cannot see — or as evidence that the philosophical distinction is less determinate than it presents itself as being.

  I do not need citations or a reading list; what I need is the mapping and, more importantly, the places where the mapping fails. And do not let the doctrinal categories quietly settle the philosophical question: if a translation succeeds only by presupposing that duties are conventional, say so explicitly.
reasoning: |-
  Okay, the user is a torts practitioner with a solid grasp of negligence doctrine but no formal background in moral philosophy. They want to understand the doing/allowing distinction in philosophy—specifically killing vs. letting die and acts vs. omissions—using tort law vocabulary. They’ve laid out three main philosophical positions and want each translated into tort concepts like duty, breach, causation, and exceptions to rescue duties.  

  First, the user’s core request is a translation exercise. But their deeper interest seems to be testing whether moral distinctions hold up when forced into legal categories—especially whether tort law’s framework reveals philosophical gaps or vice versa. They’re skeptical about conventions (e.g., whether duties are just arbitrary allocations) and focused on hard cases like withdrawing treatment.  

  I need to map each philosophical position faithfully:  
  1. **Basic Moral Difference**: Translates cleanly into tort’s act/omission divide and no-duty-to-rescue default. The "creation of risk" doctrine mirrors the moral emphasis on altering status quo. But tort’s bright lines feel conventional here—e.g., why is injecting poison (act) worse than withholding food (omission) when both cause death? The law assumes the distinction is fundamental, but doesn’t justify it philosophically.  
  2. **No Intrinsic Difference**: This clashes with tort doctrine. Philosophers here might see withholding treatment as equivalent to active killing if intent and outcome are identical. But tort law can’t express this—omissions only breach duty under specific exceptions (e.g., undertaking). The translation distorts the position by forcing it into duty-based boxes.  
  3. **Derivative Difference**: Fits tort’s "tracking" mechanisms well—e.g., undertaking/rescue exceptions that turn omissions into duties based on reliance or risk creation. Withdrawing treatment is graver in tort due to "undertaking," but philosophers see withdrawal/non-initiation as equivalent. Tort can’t capture this without smuggling in moral assumptions.  

  **Residue Report**:  
  - **Clean carry-over**: Tort’s act/omission framework maps neatly onto the "basic difference" view. Causation (but-for vs. proximate) also aligns with philosophers’ "altering the course" arguments.  
  - **Distorted survival**: The "no difference" view gets mangled—tort’s duty rules can’t express moral symmetry. The derivative view’s tracking works until it hits cases like treatment withdrawal, where tort insists on "undertaking" as a duty-trigger, but philosophers see no moral gap.  
  - **Inexpressible**: The core moral intuition that harm equivalence (e.g., identical outcomes) might nullify act/omission distinctions. Tort’s duty structure can’t model this—it’s built on the distinction.  

  **User’s Three Questions**:  
  1. **Moral asymmetry vs. conventional duties**: The translation shows tort’s distinction *is* conventional. Philosophers’ "basic difference" view survives only if we accept duty allocations as morally foundational—but tort doesn’t argue for that; it assumes it.  
  2. **Treatment withdrawal**: Tort doctrine (via "undertaking") makes withdrawal a breach but not initiating mere nonfeasance. To express moral equivalence, you’d need to ignore reliance/risk creation—which tort can’t do. This suggests tort’s categories *create* the asymmetry philosophers question.  
  3. **Residue as defect**: The inexpressible elements (e.g., outcome equivalence) hint that tort’s framework is limited—it can’t "see" moral symmetry. But it also exposes philosophy’s indeterminacy: if tort’s conventional rules handle real cases better than abstract principles, maybe the distinction *needs* institutional shaping.  

  **Key Insight**: The friction arises because tort is prescriptive (what we owe) while philosophy is evaluative (what matters). Tort’s vocabulary can describe *how* we distinguish acts/omissions but not *whether* we should—that’s where the residue leaks.
answer: |-
  Below is a strict translation of the three philosophical positions into tort doctrine vocabulary, followed by a residue analysis addressing your three focal questions. I preserve tort's conceptual boundaries: **duty** (including special relationships, undertakings, risk creation), **breach** (act vs. omission), and **causation** (but-for/proximate cause). Where philosophy cannot be forced into these categories without distortion, I note the failure.

  ---

  ### **1. The "Basic Moral Difference" View Translated**  
  *Philosophy's claim:* Doing harm (e.g., killing) is intrinsically worse than allowing harm (e.g., letting die), regardless of consequences or intent.  

  **Torts translation:**  
  - **Acts** (doing) trigger *prima facie* duties of care. Any affirmative act creating foreseeable risk establishes a duty to avoid unreasonable harm.  
  - **Omissions** (allowing) impose no duty unless a recognized exception applies:  
    - *Special relationship* (parent/child, innkeeper/guest),  
    - *Undertaking* (voluntary assumption of aid),  
    - *Creation of risk* (your conduct increased the peril), or  
    - *Reliance* (another reasonably depended on your intervention).  
  - **Causation:** Acts are *but-for causes* that *proximately* alter the status quo. Omissions are mere failures to alter an *independent causal sequence* already in motion.  

  *Doctrinal fit:* Clean. Tort law's core structure assumes this asymmetry: Acts create duties; omissions are "non-events" unless an exception converts them into "duty-triggers."  

  ---

  ### **2. The "No Intrinsic Difference" View Translated**  
  *Philosophy's claim:* Doing/allowing is morally neutral. What matters are consequences, intentions, or rights violations. The distinction is epiphenomenal.  

  **Torts translation attempt:**  
  - **Duty:** No inherent difference between acts/omissions. If harm occurs, a duty arises *whenever the defendant was best placed to prevent it*—regardless of act/omission.  
  - **Breach:** Failing to rescue is as culpable as creating risk if the harm is identical and preventable.  
  - **Causation:** *But-for* cause applies symmetrically: "But for the defendant's act *or omission*, the harm would not have occurred." *Proximate cause* collapses; omissions are direct causes.  
  - **Exceptions abolished:** Special relationships/undertakings are redundant—duty arises from capacity to prevent harm.  

  *Doctrinal distortion:*  
  - **Failure point:** Tort doctrine *cannot* express this. The no-duty-to-rescue rule is foundational. To equate omissions with acts, you must:  
    - Redefine "duty" as *generalized obligation to prevent all foreseeable harm* (rejected in tort law).  
    - Ignore causation doctrine (omissions lack but-for causation unless a pre-existing duty existed).  
  - **Result:** The view survives only by rejecting tort's architecture. It implies duties are *not* conventional but arise from moral capacity—a claim tort doctrine explicitly denies.  

  ---

  ### **3. The "Derivative Difference" View Translated**  
  *Philosophy's claim:* Doing/allowing matters only because it correlates with morally salient factors (e.g., intent, rights violations, causal responsibility).  

  **Torts translation:**  
  - **Duty:** The distinction tracks *when a duty is imposed*, but exceptions reveal the underlying factors:  
    - *Creation of risk* → Defendant altered the status quo (causal responsibility),  
    - *Undertaking* → Defendant assumed an obligation (volition/rights),  
    - *Reliance* → Defendant induced dependence (fault via inducement).  
  - **Breach:** An omission breaches only if it violates a duty triggered by the above factors.  
  - **Causation:** *Proximate cause* does the heavy lifting—acts are more likely "proximate" because they introduce new forces; omissions rarely break causal chains.  

  *Doctrinal fit:* Mostly clean. Tort's exceptions explicitly link omissions to factors like risk creation or inducement. The distinction is derivative because omissions only breach when they track these elements.  

  ---

  ### **RESIDUE REPORT: Your Three Questions**  

  #### **1. Does the moral asymmetry reduce to conventional duty allocations?**  
  - **Translation verdict:** Yes, entirely.  
  - **Analysis:**  
    - The "basic difference" view maps perfectly to tort's act/omission dichotomy because tort *institutionalizes* that distinction as a convention.  
    - Philosophers treat "doing" as inherently wrongful; torts treats it as *duty-generating*. The moral asymmetry "does no work" beyond tort's existing framework.  
    - **Residue:** Tort doctrine cannot explain *why* acts trigger duties while omissions don't—it presupposes this as a normative starting point. Philosophy's "basic" view is absorbed into the convention.  

  #### **2. Can tort doctrine express the moral equivalence of withdrawing vs. not initiating treatment?**  
  - **Doctrinal answer:** No. Tort logic makes withdrawal *worse*.  
  - **Analysis:**  
    - **Withdrawal = Act/Omission Hybrid:**  
      - *Doctrinally*, stopping treatment is an "omission" *unless* an exception applies.  
      - *Undertaking*: If treatment began, the clinician assumed a duty. Withdrawal breaches it; not initiating does not.  
      - *Reliance*: Patient relied on continued care; withdrawal exploits this dependence.  
      - *Creation of risk*: Withdrawal may be seen as "active" if it directly causes decline (e.g., removing a ventilator).  
    - **Result:** Withdrawal breaches a duty; not initiating typically doesn’t. Tort doctrine *cannot* frame them as equivalent—it legally distinguishes them via "undertaking."  
    - **Residue:** Philosophers' equivalence claim requires ignoring tort's reliance/undertaking exceptions. It only fits the "no intrinsic difference" view, which tort rejects.  

  #### **3. Is the residue a defect of tort doctrine or philosophy's indeterminacy?**  
  - **Verdict:** Both reveal limitations.  
  - **Analysis:**  
    - **Tort's blind spot:** It cannot model:  
      - Moral symmetry between identical outcomes (e.g., killing vs. letting die with same intent/harm).  
      - "No difference" views (it lacks a generalized duty to aid).  
      - The equivalence of withdrawal/non-initiation (due to its "undertaking" formalism).  
    - **Philosophy's indeterminacy:**  
      - "Doing/allowing" is underdetermined in edge cases (e.g., is flipping a switch to stop life support "doing" or "allowing"?). Tort resolves this procedurally (via duty rules); philosophy debates it abstractly.  
      - Tort's "causal" framing (altering status quo vs. non-interference) exposes philosophy's reliance on contested causal metaphysics.  
    - **Synthesis:** The residue shows tort doctrine is *institutionally determinate* (it decides cases) but *conceptually rigid*. Philosophy's distinctions are more nuanced but fail to provide actionable rules—they rely on tort-like constructs (rights, causation) without admitting it.  

  ---

  ### **SUMMARY OF MAPPING FAILURES**  
  | **Philosophical View** | **Clean Translation?** | **Distorted Survival** | **Inexpressible in Torts** |  
  |------------------------|------------------------|------------------------|----------------------------|  
  | **Basic Difference**   | Yes: Duty/breach split | None | Why acts *should* trigger duties |  
  | **No Difference**      | No | Only by rejecting no-duty rule | Generalized duty to prevent harm |  
  | **Derivative Difference** | Yes: Duty exceptions | Withdrawal/non-initiation equivalence | Moral weight of "undertaking" vs. capacity to aid |  

  **Final Note:** Tort doctrine's vocabulary is *descriptive of social conventions* (e.g., duties reflect policy choices). Philosophy seeks *normative justifications*. Where they diverge (e.g., treatment withdrawal), tort reveals philosophy's reliance on unstated conventions—but philosophy exposes tort's moral arbitrariness in edge cases. The mapping fails most sharply when philosophy demands symmetry torts cannot recognize.
