prompt: |-
  I'm a novelist — fourth book, and this one's about a string quartet that falls apart, so there's music on nearly every other page and I've realised I have absolutely no method for it. At the moment I either over-explain (two paragraphs on what the second movement is doing harmonically) or I cop out with something like 'she played, and everyone in the room felt the same thing at once', which I know its rubbish.

  A friend who did philosophy told me Schopenhauer has the strangest and possibly most useful account of music going: that music isn't a picture of anything in the world the way painting is, that it doesn't copy the ideas of things but goes straight at the inner nature of the world itself — the will, or whatever you want to call it — and that what it gives you is the essence of feeling rather than this or that particular feeling, which is why it can wreck you without your being able to say what it's about. I half believe this and I want to use it, but I've no idea how to turn it into something I can actually do at the desk at eleven at night.

  So: write me a procedure. Something I can run every time a scene has music in it — the questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says no, and where it has to hand the decision back to me because it's a judgment call rather than something the theory settles. It needs to be about authorial choices: what gets described (the notes? the players' bodies? the room? the listener's memories?), how much the narrator is allowed to interpret, whether characters get to say what the music means and whether I should trust them when they do, when to name the piece and when to keep it abstract, how long the passage should be. Ground it in what Schopenhauer actually says in The World as Will and Idea rather than the vibe of what he says — if the theory really does hold that music doesn't express particular emotions, I need the procedure to tell me what to do with the scene where I need the reader to know that the cellist is grieving.

  Then run it on three of my scenes: (1) the quartet rehearsing late at night, one of them starts crying, nobody stops playing; (2) a funeral where a phone goes off during the music and it's almost funny; (3) a character who knows nothing about music hears something on a car radio and it ruins his day, and at the moment I have the narrator explain to the reader what the piece 'means', which even I think is cheating.

  Be honest about where it will misfire — where the Schopenhauerian move produces a scene nobody wants to read, or where it tells me to do the opposite of what I want. And if one of the scenes comes out with an answer I won't like, don't soften it; I'd rather know. I've got a fortnight and no intention of becoming a Schopenhauer person, so it has to be usable without that.

  Write it in British English, please — my copy-editor is strict and I'm tired of the arguments.
reasoning: |-
  Okay, the user is a novelist working on their fourth book about a string quartet falling apart. They're struggling with writing music scenes—either over-explaining technical details or using vague, emotional clichés. They mentioned Schopenhauer's philosophy of music as being potentially useful but need a practical method to apply it. Their main request is for a step-by-step procedure grounded in Schopenhauer's actual ideas from *The World as Will and Representation*, not just the vibe.

  First, I need to recall Schopenhauer's key points about music. He saw music as directly expressing the Will, the inner essence of reality, rather than representing specific objects or emotions like other arts. Music bypasses ideas and Platonic Forms to convey pure feeling itself. This is crucial because the user needs to avoid both technical jargon and vague emotionalism. 

  The user's specific scenes involve: a rehearsal where someone cries during playing, a funeral with a disruptive phone ring, and a character affected by car radio music. Each presents different challenges. For the rehearsal scene, Schopenhauer's view suggests focusing on the unity of the players and the music's embodiment of shared struggle, not individual grief. The funeral scene's interruption could highlight music's contrast with worldly distractions—the Will versus the Representation. The car radio scene needs to show music's direct impact without explaining its meaning, perhaps through physical or existential reactions.

  The user wants a procedure with clear questions to ask for each scene, decisions on what to describe, and limits on interpretation. They also need honesty about where Schopenhauer's approach might misfire, like when specific narrative context is essential. For example, in the grieving cellist scene, the theory might conflict with the need to convey a particular emotion. I should acknowledge that and suggest workarounds, like focusing on how the music manifests the Will's turmoil, which the character then interprets as grief.

  British English is required, so I'll ensure all terms like "judgement" and "amongst" follow UK conventions. The procedure must be practical—usable at 11 PM without deep philosophical commitment. Steps should include checking for technical over-description, ensuring music affects characters physically or existentially, and avoiding named emotions. 

  For the three scenes, applying the procedure: in rehearsal, describe the physical effort and unity, not the crying's cause. The funeral scene should contrast the music's depth with the phone's trivial interruption. The car radio scene needs sensory overload and disorientation, no narrator explanation. I must flag where this might feel too abstract, like in the funeral where humor could clash with solemnity, and suggest tweaks without violating core principles.

  Finally, emphasize that the procedure is a tool, not a rulebook. Where it conflicts with narrative needs, the author should override it, especially for character-driven moments. The goal is to harness Schopenhauer for depth without losing storytelling clarity.
answer: |-
  Right. Let's get you a **Schopenhauerian Music Scene Procedure (SMSP)** – grounded in Book III of *The World as Will and Representation* – that you can run like a diagnostic at your desk. No fluff, no conversion required.

  **Core Schopenhauerian Principles (Your Ground Rules):**

  1.  **Music ≠ Representation:** Music *isn't* a copy of the world (like painting) or concepts (like poetry). It doesn't depict sunsets, battles, or *specific* emotions like "grief for a lost dog."
  2.  **Music = Will Itself:** Music is a *direct objectification of the Will* – the blind, striving, underlying force of reality. It bypasses the world of Ideas (Platonic forms) entirely.
  3.  **Essence, Not Instance:** Music expresses the *pure essence* of feeling – the *striving, satisfaction, torment, triumph* inherent in the Will itself – *before* it gets filtered into specific emotions tied to objects or events ("grief over X," "joy about Y").
  4.  **Universal Resonance:** Because it hits the Will, music resonates directly with the listener's *own* inner Will, bypassing intellect. This is why it affects us so profoundly and universally, yet often wordlessly.
  5.  **Form is Feeling:** The structure of music (melody, harmony, rhythm, dynamics) *is* the direct manifestation of the Will's movements – conflict, resolution, tension, release, longing, fulfilment.

  **The SMSP Procedure (British English Edition):**

  Run this sequence *every* time music plays a significant role in a scene. Answer each question honestly. **Stop/Hand Back** points are crucial.

  1.  **QUESTION 1: Am I describing the music as if it *represents* something specific (an emotion, a story, a scene)?**
      *   **Good Enough Answer:** "No. Or, if yes, I'm stopping that now." (Schopenhauer says this is fundamentally wrong).
      *   **Stop/Hand Back:** If you *must* have a character *mistakenly* interpret it representationally (e.g., "This sounds like a storm!") for plot/character reasons, flag it. Proceed cautiously. **Otherwise, STOP and rewrite.** This is the core rule.
      *   **Authorial Choice Impact:** Dictates *what not to do*. Avoid metaphors linking music to external events/objects/specific named emotions triggered *by* an object. Avoid programmatic descriptions unless a character is being naive or pretentious.

  2.  **QUESTION 2: Can I focus on the *physical manifestation* of the Will (the music) and its *physical impact*?**
      *   **Good Enough Answer:** Describe the *sound itself* (not what it represents): timbre (gritty, silken, shrieking, throbbing), dynamics (swelling, whispering, crashing), rhythm (driving, stumbling, suspended), harmony (dissonant clusters, serene open intervals, grinding resolution). Describe the *physical effort* of playing (bowed *fiercely*, fingers *stumbling*, breath *caught*, spine *rigid* with concentration). Describe the *immediate, somatic effect* on listeners (gooseflesh, a tightening in the chest, a involuntary sigh, tears *welling without conscious thought of loss*, foot tapping, a feeling of weightlessness, a sudden chill).
      *   **Stop/Hand Back:** If the scene *absolutely requires* linking the music to a *specific* past event or memory *for narrative cohesion*, proceed to Q3 cautiously. Otherwise, STOP and focus here. This is your primary descriptive toolbox.
      *   **Authorial Choice Impact:** Directs you to describe **sound, bodies in motion, and immediate physical sensations.** The narrator can describe these objectively. Avoid interpreting *why* the body reacts ("because it reminded her of her father's death" – NO; "tears tracked down her cheeks, her bow never faltering" – YES).

  3.  **QUESTION 3: Can I describe the music's effect as tapping into a *universal state of the Will*?**
      *   **Good Enough Answer:** Use abstract terms for the Will's movements: *striving, yearning, conflict, resolution, turmoil, ecstasy, weight, release, inevitability, blind force, pure longing, essential sorrow, the thrill of resistance.* Describe the music's *structure* implying these: "the melody strained upwards, perpetually unresolved"; "the bass line was a relentless, tectonic pulse"; "dissonances clashed like opposing forces before collapsing into exhausted harmony"; "a single, pure note hung in the air, a moment of suspended will."
      *   **Stop/Hand Back:** This is the *interpretative limit* for the narrator/author. If you find yourself wanting to say "this music *means* grief" or "expresses the cellist's sorrow," **STOP. HARD STOP.** You can describe the music *as* turmoil/striving/sorrow (essence), and *show* the cellist grieving, but *don't* narratively link them as cause/effect representation. The music manifests Will-state; the character *experiences* their Will resonating and *their mind* might label it grief. **This is a critical judgement call.** If the narrative *demands* a specific emotional context (like the grieving cellist), see **Misfire Section**.
      *   **Authorial Choice Impact:** Allows narrator interpretation *only* at the level of universal Will-states. Characters can *say* what they *think* it means, but the narrative shouldn't endorse it as the music's *true* representational meaning. Trust characters only as far as their subjective experience goes; their *interpretation* might be flawed representationally, but their *feeling* (resonance of Will) is real. Naming the piece is fine (it's data), but doesn't change the procedure – focus on *how it sounds in this moment*.

  4.  **QUESTION 4: Is the music acting as the *primary reality* in the scene, making the "real world" secondary (Representation)?**
      *   **Good Enough Answer:** During the music, the external world (the room, other sounds, even specific thoughts) should fade or become distorted. Focus shifts *inward* for characters. Time might feel altered. Mundane details become intrusions *because* they belong to the world of Representation, while music is pure Will.
      *   **Stop/Hand Back:** If the plot *requires* the "real world" to forcefully intrude *as an equal force* (e.g., the phone ringing at the funeral), proceed – this creates a Schopenhauerian *conflict* (Will vs. Representation). Otherwise, use this to intensify focus on the music's immersive power. **Hand Back for pacing/emphasis.**
      *   **Authorial Choice Impact:** Guides how much "scene setting" happens *during* the music. Less is often more. The music passage length should be proportionate to its narrative weight as an embodiment of Will, not to plot advancement. It can be very short if the impact is sudden and profound.

  **Where it Misfires (Be Honest):**

  1.  **The Specific Emotion Problem (Grieving Cellist):** Schopenhauer *denies* music expresses *particular* emotions tied to objects. Your procedure will scream "NO!" to narratively stating "the music expressed her grief." **Misfire:** A strictly Schopenhauerian scene might show her playing with intense physical effort/ferocity/weight (manifesting Will-turmoil), tears streaming (physical impact), and the *narrator* describing the music as embodying "essential sorrow" or "the weight of existence." The *reader* infers her grief *from context* (we know she's grieving) + her physical state + the *character* of the music (essence of sorrow), *not* because the narrator says the music *represents* her grief. **Is this enough for your scene?** It might feel too indirect. You might *need* to cheat slightly for clarity, but the SMSP forces you to minimise this.
  2.  **Humor & Bathos (Funeral Phone):** Schopenhauer is deadly serious. The phone ringing is a perfect Schopenhauerian *intrusion* of the noisy world of Representation (trivial, jarring) into the world of Will (profound music). **Misfire:** The strict procedure might make the moment *too* jarringly philosophical, potentially draining the dark humour you want. It will tell you to emphasise the *profound disconnect* between the two realms. If you want the humour, you might need to slightly over-write the intrusion's banality *against* the music's depth.
  3.  **Abstraction Overload:** Relentless focus on "the Will's striving" and somatic effects can become repetitive or alienating if overused. It risks feeling cold or pretentious. **The procedure won't warn you about this** – it’s a tool, not a style guide. You need to vary the *application* (sometimes more sound description, sometimes more physical reaction, sometimes a brief Will-state).
  4.  **Character Development vs. Music:** If a character's *specific* emotional journey *is* the plot, and music is just a trigger, the SMSP can feel restrictive. It prioritises the music's *universal* power over its *specific* narrative function for an individual.

  **Running the SMSP on Your Scenes:**

  **Scene 1: Quartet rehearsing late, one cries, nobody stops.**

  *   **Q1:** NO representation. Don't say the music *is* sad or *about* her loss.
  *   **Q2:** **FOCUS HERE.**
      *   *Sound:* The scrape of bows, the intense vibrato, the close harmony feeling claustrophobic, a particularly aching suspension in the phrase.
      *   *Bodies:* Her shoulders shaking, a tear hitting the varnish of her cello, her jaw clenched tight, the others staring fixedly at their music/into middle distance, playing with robotic precision or fierce concentration, the shared physical exhaustion of late hours.
      *   *Somatic Impact:* The sound vibrating in their chests, a collective holding of breath *despite* playing, the warmth of the room feeling oppressive, the tear as a purely physical release.
  *   **Q3:** Music embodies *shared struggle, relentless striving, inevitable burden*. Narrator: "The music wasn't sorrow; it was the grinding weight of persistence itself, the friction of four wills bound together." Character might *later* think "It felt like everything pressing down," but not during.
  *   **Q4:** The rehearsal room shrinks. Only the score, the instruments, the shared sound exist. The crying is another sound *within* the musical space, not an external event stopping it. The music *is* the reality.
  *   **Misfire Check:** Works well. The power comes from the *continuation* – the music (Will) is the dominant force, absorbing the individual's distress (itself a manifestation of Will) into its own striving. The reader infers *her* grief from context + physicality.

  **Scene 2: Funeral, phone goes off during music, almost funny.**

  *   **Q1:** NO representation of the music *as* grief. Avoid "the sad adagio".
  *   **Q2:**
      *   *Sound:* Deep, resonant chords filling the chapel; a slow, inevitable melody; profound silence between phrases.
      *   *Bodies:* The quartet playing with solemn focus; mourners sitting utterly still, heads bowed; closed eyes.
      *   *Somatic Impact:* A collective intake of breath; the sound vibrating in the bones; a feeling of suspension.
      *   **INTRUSION:** The cheap, tinny ringtone (describe its vulgarity – a pop song snippet, an alarm); a fumbling in a pocket; a gasp; heads snapping up; the quartet flinching, a bow skidding.
  *   **Q3:** Music embodies *profound stillness, the essence of finality, the slow turning of the world*. Narrator: "It wasn't mourning; it was the sound of the abyss, vast and quiet." Phone is pure *distraction*, the chattering chaos of the everyday world (Representation) violently interrupting the world of Will/essence.
  *   **Q4:** The music *was* the reality – the chapel, the mourners, death itself dissolved into pure sound. The phone *shatters* that reality, yanking everyone back into the noisy, awkward, specific world of jackets, pockets, embarrassment, social norms (Representation). The humour comes from the sheer violence of this collision.
  *   **Misfire Check:** Works perfectly for Schopenhauer. The "almost funny" element *is* the profound disconnect. Lean into the *jarring banality* of the phone against the *depth* of the music. Don't soften it. The procedure helps nail the contrast.

  **Scene 3: Character clueless about music, car radio ruins day.**

  *   **Q1:** **STOP!** You currently have the narrator explaining meaning. Delete that.
  *   **Q2:** **FOCUS HERE.**
      *   *Sound:* A sudden blast of sound (or an insidious melody); jarring dissonance; an overwhelming wall of noise; a repetitive, grating rhythm; a piercing high note.
      *   *Bodies:* Him jolting in his seat; hand slipping on the wheel; head snapping towards the radio; knuckles white on the wheel; jaw tightening; maybe frantically turning it off or volume down.
      *   *Somatic Impact:* A lurch in the stomach; a spike of adrenaline; a headache forming instantly; a feeling of being invaded; sudden inexplicable rage or despair; a cold sweat; disorientation.
  *   **Q3:** Music embodies *sudden chaos, existential dread, meaningless drive, abrasive friction*. Narrator: "It wasn't anger or sadness; it was pure, undirected sonic assault on the core of him." *His* mind might scramble for reasons ("Bloody awful noise!"), but the narrator doesn't explain *what* the piece "meant".
  *   **Q4:** The car interior vanishes. The road ahead blurs. For those moments, there is only the sound and its violent resonance within him – the Will within him clashing with the Will objectified in the music. The banality of the car radio makes the profound effect *more* Schopenhauerian – proof it bypasses intellect/culture.
  *   **Misfire Check:** Fixes your cheating narrator. The power comes from the *direct, inexplicable assault* on his being. The lack of explanation *is* the point. It ruined his day *because* it resonated with the turmoil of the Will itself within him, not because it "meant" something specific he understood.

  **Final Note:** This isn't about becoming a Schopenhauer disciple. It's a **filter** to purge representational clichés and technical over-explanation, forcing you to find visceral, physical, and existentially resonant ways to write about music's power. Use it rigorously when you're stuck, then feel free to bend it where *narrative clarity for your specific story* absolutely demands it – just know you're bending it. Now go – the desk awaits, and it's nearly eleven. Good luck with the quartet.
