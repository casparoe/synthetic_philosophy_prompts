answer: |-
  You've put your finger on a profound and fascinating issue in philosophy of science. Let's break down the 1974 result and its implications for your article, addressing your core question directly.

  **1. What the 1974 Result Destroyed (Precisely):**

  *   **Target:** The result destroyed **Popper's specific, formal logical definition** of verisimilitude (truthlikeness) as presented in his 1963 *Conjectures and Refutations*.
  *   **Popper's Definition (Simplified):** Popper proposed that for two theories A and B, both false:
      *   A has *higher verisimilitude* than B if:
          1.  The *true consequences* of A include all the true consequences of B (A says at least as many true things as B).
          2.  The *false consequences* of B include all the false consequences of A (B says at least as many false things as A).
      *   In essence: A has *more truth* and *less falsity* than B relative to the complete truth.
  *   **The Refutation (Tichý 1974, Miller 1974, independently):** They proved a devastating logical flaw in Popper's definition:
      *   **The Impossibility Theorem:** If two theories A and B are both false, it is **logically impossible** for A to satisfy both conditions of Popper's definition relative to B.
      *   **Why?** The key insight is that if A has *all* of B's true consequences (condition 1), then any *additional* true consequence A might possess *beyond* B's must logically entail that A also possesses *additional false consequences* not present in B. Conversely, if A avoids *all* of B's false consequences (implied by condition 2), it must also *lack* some of B's true consequences. You simply cannot simultaneously gain only truths and shed only falsehoods when comparing *any* two false theories under this logical scheme.
      *   **Consequence:** According to Popper's *own definition*, no false theory can *ever* have higher verisimilitude than any other false theory. Flat-Earth theory and Newtonian Gravitation are indeed declared *exactly equal* in truthlikeness by this specific measure, which is clearly absurd and contrary to scientific intuition and practice.

  **2. Does this mean "closer to the truth" is not respectable and realists are just using a metaphor?**

  **No, that is an overstatement and does not reflect the state of philosophy of science.**

  Here's why:

  *   **The Target Was Specific:** The 1974 result destroyed *one specific, ambitious formal logical definition* (Popper's). It did not destroy *the general idea* that science progresses towards truth or that some theories are better approximations than others. Philosophers recognized this as a failure of *that particular attempt* at formalization, not a proof that the concept itself is incoherent or meaningless.
  *   **Alternative Accounts Emerged:** Philosophers didn't abandon the concept; they developed *different* ways to understand verisimilitude:
      *   **Approximate Truth:** This focuses on how well a theory *corresponds* to reality *within specific domains or limits*. Newtonian gravity *is* approximately true for objects at low speeds and weak gravitational fields compared to light speed. It gets the *structure* of many phenomena remarkably right within its domain, even if its fundamental ontology (absolute space/time, gravity as force) is incorrect. This isn't just a metaphor; it's an analysis of how theories *model* aspects of the world successfully. (Key figures: Hilary Putnam early on, later refined by others like Jarrett Leplin).
      *   **Structural Realism:** This argues that while our *theoretical entities* might change (e.g., from caloric fluid to kinetic energy, from ether to spacetime curvature), the *mathematical structure* of successful theories is often *retained* or *preserved* in their successors. Newton's gravitational *equations* work perfectly well as an approximation of Einstein's GR in most contexts. The *structure* of the relationships described survives. This preserved structure is seen as capturing something genuinely true about the world's relations. (Key figures: John Worrall, Elie Zahar).
      *   **Refined Logical Definitions:** Later philosophers (like Ilkka Niiniluoto, Graham Oddie) developed more sophisticated and nuanced *logical* definitions of verisimilitude trying to overcome the Tichý/Miller problem, often using concepts like similarity between possible worlds or probabilistic measures. While complex and debated, these show the concept wasn't simply abandoned.
  *   **Scientific Practice Demands It:** Scientists constantly act *as if* newer theories are better approximations. We use Newton for spacecraft navigation near Earth *because it's good enough* (approximately true) and simpler than GR. We develop quantum field theory because it provides a more accurate (closer to true) description than non-relativistic quantum mechanics for high-energy phenomena. This practical success strongly suggests *something* is being captured better over time.
  *   **Realism Isn't Dead:** Scientific realism (the view that our best scientific theories are approximately true descriptions of a mind-independent world) remains a major, viable position in philosophy of science. Realists argue that the *only* convincing explanation for the unprecedented instrumental success and predictive power of science (especially novel predictions) is that our best theories are genuinely latching onto the way the world actually is, even if imperfectly. They see "approximate truth" as a substantive concept explaining progress, not just a dressed-up metaphor.

  **3. Can you tell your editor the idea of approaching truth has been "quietly abandoned"?**

  **Emphatically No. That would be misleading and inaccurate.**

  Here's what you *can* (and should) tell your editor and your readers:

  *   **Popper's Formal Dream Was Shattered:** Popper's specific, ambitious attempt to rigorously *define* "closeness to truth" using pure logic failed spectacularly in 1974. His definition proved unworkable and led to absurd conclusions.
  *   **The Concept Endures, but Evolved:** Philosophers of science did *not* abandon the idea that science makes progress towards a truer understanding of the world. Instead, they recognized the need for more nuanced, sophisticated, and often less purely formal accounts of what this progress means.
  *   **Focus Shifted:** The discussion moved away from seeking a single, simple logical formula towards analyzing concepts like **approximate truth** (how well a theory works in its domain), **structural continuity** (what mathematical relationships survive theory change), and **explanatory success** (how well a theory explains diverse phenomena, especially novel predictions).
  *   **Debate Continues:** While there's broad agreement that science makes progress, there is *ongoing, vigorous debate* among philosophers about *how exactly* to characterize this progress (truthlikeness? problem-solving ability? empirical adequacy?) and how confident we can be that current theories are genuinely tracking reality (realism vs. anti-realism/constructive empiricism).
  *   **Scientists Act *As If*:** Regardless of the philosophical complexities, the practice and history of science strongly suggest a cumulative refinement of understanding. Newton improves on Kepler, Einstein improves on Newton in broader domains – this pattern demands an explanation, and "getting closer to the truth" remains a powerful contender.

  **Conclusion for Your Article:**

  You can confidently write: **"While Karl Popper's bold attempt to rigorously define 'closeness to truth' collapsed in 1974 under logical scrutiny, philosophers of science have not abandoned the idea that science progresses towards a more accurate understanding of reality. Instead, they have developed richer concepts like 'approximate truth' and 'structural realism' to explain the undeniable pattern of improvement in scientific theories, from Newton to Einstein and beyond. The *how* of scientific progress remains deeply debated, but the *fact* of progress, interpreted by many as getting closer to the truth, is a cornerstone of the scientific endeavor."**

  This accurately reflects the historical event (1974 refutation) while capturing the ongoing vitality and importance of the core idea in understanding science.
