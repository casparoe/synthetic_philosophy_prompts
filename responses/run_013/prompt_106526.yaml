answer: |-
  ## The Uncompromising Case for Interpretative Intention

  Forget institutions, emotions, and aesthetics. Art’s core isn't *what* it is or *where* it hangs, but *why* it exists as it does. **Art is defined solely by the maker’s (or selector’s) intention that the object’s specific features provide reasons for supporting or rejecting interpretations of it.** This is the *constitutive rule* of art: its very existence as art demands we interrogate its form as meaningful choices demanding justification.

  **Why this beats the rivals:**

  1.  **Institutional Theory:** Museums declare urinals art? Fine. But *why* did Duchamp select *this* urinal? Precisely to provoke interpretation of its form, context, and rejection of convention. The institution merely recognizes the prior intentional act; it doesn't *create* the art-status. A shovel declared art without interpretative intent behind its selection is just a misplaced tool.
  2.  **Expressionism:** Does art express emotion? Often. But *essential*? No. Abstract patterns or conceptual pieces might express nothing personal. The key is that the artist *intends* the work's features (color, line, material, arrangement) to be *reasons* for interpreting meaning or effect – even if that meaning is purely formal or intellectual, not emotional.
  3.  **Aesthetic Formalism:** Beauty or significant form? Irrelevant. A visually stunning sunset isn't art; a deliberately ugly, jarring composition *is* art if its ugliness is intended as a reason for interpreting its critique or dissonance. Aesthetic properties are *tools* for interpretation under this thesis, not the definition.
  4.  **Anti-Definition (Wittgensteinian):** The claim that art is an open concept fails. While art *takes* wildly diverse forms, *all* art shares the essential function of being an object intentionally designed for interpretative justification. This *is* the common thread beneath the variety.

  **Crushing the Hard Cases:**

  *   **Readymades (Duchamp's Fountain):** Selected *precisely* to force interpretation of its form, context, and the act of selection itself as reasons challenging art’s definition. The selector's intention *is* the artistic act.
  *   **Forgeries:** A perfect fake lacks the *original artist's* intention for its features to be reasons for interpretation. It parasitically mimics the *result* of that intention. It's a counterfeit *artwork*, not genuine art *qua* its own creation.
  *   **Purely Decorative Objects:** A well-designed but mass-produced wallpaper pattern is made for pleasing effect, *not* for its specific features to be treated as reasons supporting deeper interpretations. It’s design, not art.
  *   **Animal "Paintings":** An elephant smearing paint might produce an interesting pattern, but there’s no intention behind the elephant that its *specific* features (this stroke, that color) should be interpreted as meaningful choices. It’s a biological artifact, not art.
  *   **Unseen AI Images:** Images generated and cataloged by an AI, *never* intended by anyone (programmer or system) for human interpretation of their features as significant choices, are mere data outputs. They become art only if a human *selects* one *with* the intent that *its* features be interpreted.

  **The Falsification Test:**

  This thesis is falsified **only if we find an object universally acknowledged as paradigmatic art, demonstrably created or selected *without any trace of intention* that its specific features be treated as reasons for or against interpretations.**

  Imagine a naturally formed, stunningly beautiful crystal. If placed in a museum *solely* because of its beauty or rarity, with *no* curator intending its striations or shape to be interpreted as meaningful choices (just admired aesthetically or geologically), it remains a natural object, not art. If, however, a curator *selects it specifically* to frame those features as reasons for interpreting geological time, humanity's relationship to nature, etc., *then* it becomes art via selection + interpretative intent. The *absence of that specific framing intent* for an object otherwise treated as art would sink this thesis. We haven't found that case.
