prompt: |-
  I am designing a pre-mortem protocol that a regulator or a research funder could run before adopting a performance target, and I have concluded that I cannot write the protocol until I know what a theory of proxy corruption would have to deliver. Please write the desiderata: the requirements any adequate account of the phenomenon usually filed under Goodhart's law has to satisfy, with the case or consideration behind each requirement, and with a verdict on which requirements are genuine and which are artifacts of a particular camp's interests. Do not give me a reading list or attribute views to authors; I want the argument in your own terms.

  Set the list against at least the following cases, which I have been collecting. Several are constructed rather than reported, so treat them as stipulations, and say so if one is incoherent or already presupposes an answer.

  1. The straightforward case: a proxy is a stable correlate of the goal while unoptimized, and the correlation breaks once agents are rewarded for moving the proxy, because there are ways to move the proxy that leave the goal untouched.

  2. The counting effect: nothing about the underlying phenomenon changes, but making it a target improves its measurement, so the number rises. Here a rising number is equally consistent with corruption and with success, and the account owes some way of telling them apart.

  3. The decoy: a metric that everyone, including its designers, regards as a crude stand-in is nonetheless published as a target, is used mainly to coordinate effort, and improves the goal precisely because nobody treats it as a description of the goal. An account that identifies targeting with corruption must explain why this is not a counterexample, or concede that it is.

  4. The inverse proxy: a cheap metric negatively correlated with the goal over the relevant range. Targeting it reliably makes things worse, and it is not obvious that this is the same phenomenon rather than ordinary bad measurement.

  5. Metric monoculture: a single statistic is adopted across many institutions for many purposes and becomes unusable for all of them, not because any one agent games it, but because the aggregate weight of optimization on it exceeds what its measurement channel can bear. Corruption here is a congestion externality on a shared resource, and no one need intend it.

  6. No independent goal: a target that constitutes the goal rather than representing it, so there is nothing for the metric to have been a good proxy of. The account must say whether it applies at all, and what would count as gaming.

  Beyond the cases, I want the list to include the requirements usually smuggled in without argument: that the account distinguish deliberate gaming from non-intentional distributional drift; that it distinguish the metric's ceasing to track the goal from the institution's substituting the metric for the goal; that it be predictive rather than diagnostic, able to say before the fact which targets will degrade; that it not be refuted by the many cases in which targeting a proxy works fine; and that it respect the difference between a proxy's error being random and its error being selected by the optimization itself. Add whatever else you think belongs, and cut whatever you think is a prejudice dressed as a requirement.

  Two things I most want from you. First, whether some subset of the requirements is jointly unsatisfiable. In particular, I suspect that demanding prediction from features of the proxy-goal relation alone, while also demanding a principled distinction between corruption and legitimate redefinition of a goal, cannot both be had; if that is right, say which has to go and what is lost. Second, which single requirement does the most work in excluding candidate accounts, and what it excludes.

  The purpose fixes the bar: this is a tool for an auditor who must decide, before a target is adopted, whether to expect degradation, and who will not have access to the agents' intentions. Weight the list toward what such a user needs.
reasoning: |-
  Hmm, the user is designing a pre-mortem protocol for regulators or research funders to assess performance targets before adoption, and needs a robust set of desiderata for any theory of proxy corruption (Goodhart's Law). They've provided six specific cases and additional requirements, and want clarity on potential conflicts between desiderata and which requirement is most constraining.

  The user's core challenge seems to be balancing predictive power with conceptual precision. They want an operational theory that can anticipate degradation without reading agents' minds, while avoiding false positives from legitimate metric improvements. Their listed cases cover classic Goodhart scenarios but also edge cases like decoy metrics and metric monoculture that test boundaries.

  The key tension I notice is between predictive feasibility and conceptual purity. The auditor needs to flag risks based solely on observable proxy-goal relationships before implementation, but several desiderata require counterfactual or intentional distinctions (e.g., distinguishing measurement improvement from gaming). The strongest conflict arises between "must predict degradation pre-implementation" and "must distinguish metric-target substitution from proxy corruption" - the former requires observable signals while the latter requires insight into institutional psychology.

  The most constraining single requirement is likely "must handle no-independent-goal cases". This immediately eliminates theories that assume goal-metric separation, which many accounts rely on. It forces the theory to explain why targeting a constitutive metric (e.g., GDP as goal-not-proxy) could still degrade, or concede such cases are immune to corruption - both problematic for the auditor.

  For the desiderata list, I'll structure it with: (1) case-based requirements from their six examples, (2) supplemental requirements they mentioned, and (3) any critical additions. Each will include the rationale and whether it's genuine or biased. The decoy case reveals a common bias: assuming optimization always corrupts, when sometimes it's precisely the public targeting that coordinates benign effort. This shows some "requirements" are actually ideological assumptions.

  For the verdict on conflicts: the prediction/redefinition dilemma is real. Prediction requires focusing on measurable proxy-goal properties, while detecting goal-substitution requires observing institutional behavior post-implementation. The auditor must sacrifice some conceptual precision for predictability - perhaps treating goal-substitution as a separate failure mode. What's lost is a unified theory of all metric degradation.

  The monoculture case suggests adding a requirement about scalability: the theory should address how optimization pressure density affects degradation risk. This isn't captured in their existing list but is crucial for funders setting system-wide targets.
answer: |-
  Below is a structured set of desiderata for a theory of proxy corruption (Goodhart's Law), derived from your cases and requirements. I've categorized them by origin (case-derived vs. supplemental), provided the rationale, classified them as genuine or biased, and addressed your core questions. The list prioritizes an auditor's needs: pre-implementation predictability and intention-agnostic assessment.

  ---

  ### **I. Case-Derived Desiderata**
  1. **Requirement: Explain vulnerability to strategic manipulation**  
     *Case*: Straightforward case (1)  
     *Rationale*: Must show why optimizing a previously reliable proxy severs correlation via actions that move the proxy without affecting the goal.  
     *Genuine?* **Yes**. Core to the phenomenon; distinguishes corruption from simple measurement error.

  2. **Requirement: Distinguish measurement artifact from true degradation**  
     *Case*: Counting effect (2)  
     *Rationale*: A rising metric could reflect better measurement (e.g., reduced underreporting) or true progress. The theory must differentiate without relying on intent.  
     *Genuine?* **Yes**. Essential for auditors to avoid false positives.

  3. **Requirement: Accommodate non-corruptive targeting**  
     *Case*: Decoy (3)  
     *Rationale*: Accounts that equate targeting with corruption must explain why some proxies (e.g., crude KPIs used for coordination) improve the goal precisely *because* they aren’t treated as literal targets.  
     *Genuine?* **Yes**. Exposes oversimplification; not all targeting is naively literal.

  4. **Requirement: Explain negative-correlation degradation**  
     *Case*: Inverse proxy (4)  
     *Rationale*: Must clarify why optimizing a negatively correlated proxy worsens outcomes and whether this is distinct from "bad measurement."  
     *Genuine?* **Yes**. Tests generality beyond positive correlations.

  5. **Requirement: Model emergent system-level failure**  
     *Case*: Metric monoculture (5)  
     *Rationale*: Must explain degradation from diffuse optimization pressure (e.g., congestion), absent individual gaming.  
     *Genuine?* **Yes**. Captures institutional-scale risks without intent.

  6. **Requirement: Address goal-constructive metrics**  
     *Case*: No independent goal (6)  
     *Rationale*: Must clarify if "corruption" applies when the metric *defines* the goal (e.g., GDP). If so, define "gaming" absent a hidden true goal.  
     *Genuine?* **Yes**. Challenges theories assuming pre-existing goals.

  ---

  ### **II. Supplemental Desiderata**
  7. **Requirement: Intent-agnostic degradation diagnosis**  
     *Rationale*: Auditors can’t access intentions. Must distinguish deliberate gaming (e.g., surgeons cherry-picking patients) from non-intentional drift (e.g., teaching-to-the-test narrowing curriculum).  
     *Genuine?* **Yes**. Necessary for operational use by regulators.

  8. **Requirement: Separate proxy-goal decoupling from goal-substitution**  
     *Rationale*: Degradation occurs if the metric ceases tracking the goal *or* if the institution replaces the goal with the metric. These have different remedies.  
     *Genuine?* **Yes**. Critical for designing interventions.

  9. **Requirement: Pre-implementation predictability**  
     *Rationale*: Auditors need features that predict degradation *before* adoption (e.g., metric flexibility, goal observability).  
     *Genuine?* **Yes**, but with caveats: Perfect prediction is impossible, but risk factors must be identifiable.  

  10. **Requirement: Generalize beyond failure cases**  
      *Rationale*: Must explain why some proxies (e.g., quarterly revenue targets) work stably, avoiding "all metrics corrupt" fatalism.  
      *Genuine?* **Yes**. Avoids selection bias; explains robustness.  

  11. **Requirement: Distinguish optimization-selected error from random noise**  
      *Rationale*: Random error (e.g., noisy sensors) is less catastrophic than errors *systematically exploited* by optimization (e.g., rewarding code churn over software quality).  
      *Genuine?* **Yes**. Core to Goodhart’s mechanism.  

  12. **Requirement: Exclude normative goal disputes**  
      *Rationale*: Degradation should not hinge on whether the goal is "good" (e.g., "increased arrests" as a proxy for public safety). Focus on whether the proxy tracks the stated goal.  
      *Genuine?* **Yes**. Prevents theory from overreaching into ethics.  

  ---

  ### **III. Critical Additions & Exclusions**
  - **Added**: **Scalability under optimization pressure**  
    *Rationale*: Must assess how metric robustness degrades with increasing optimization intensity (monoculture case). Genuine.  
  - **Added**: **Path-dependence awareness**  
    *Rationale*: Degradation risk may depend on *how* the proxy is optimized (e.g., gradual vs. abrupt). Genuine.  
  - **Excluded**: **Requiring intent-based explanations**  
    *Rationale*: Conflicts with auditor’s need for behaviorist assessment. Biased toward legalistic frameworks.  
  - **Excluded**: **Demanding perfect prediction**  
    *Rationale*: Overfits to contrived cases; genuine accounts admit uncertainty.  

  ---

  ### **Key Conflicts & Tradeoffs**
  #### **Unsatisifiable Pair: Prediction vs. Goal-Substitution Distinction**  
  - **Conflict**: Pre-implementation prediction (**Req 9**) relies on observable proxy-goal properties (e.g., correlation stability, manipulability). Distinguishing proxy corruption from goal-substitution (**Req 8**) requires observing institutional behavior *post*-implementation (e.g., whether the goal is silently redefined).  
  - **Verdict**: **Prediction must be prioritized; goal-substitution distinction relaxed**.  
    - *Why*: Auditors act *before* adoption. They can predict "risk of degradation" but can’t preemptively diagnose if an institution will later redefine its goal.  
    - *Loss*: Theory cannot formally separate "metric no longer tracks goal" from "goal changed to match metric." But auditors can mitigate this by requiring explicit goal documentation.  

  #### **Most Constraining Requirement: Handling No-Independent-Goal Cases (Req 6)**  
  - **Why it excludes accounts**: Many theories assume a hidden "true goal" (e.g., in reinforcement learning). These fail when the metric *is* the goal (e.g., a funder defining "success" as publication count). Accounts must either:  
    (a) Argue that constitutive metrics can still be "gamed" (e.g., via actions that inflate the metric without creating real value), or  
    (b) Admit the theory doesn’t apply, limiting scope.  
  - **Impact**: Rejects theories that rely on goal-proxy separation as a necessity. Forces engagement with social construction of goals.  

  ---

  ### **Verdict on Your Cases**
  - **All cases coherent**; none presuppose an answer. The decoy case (3) is particularly valuable for exposing normative biases in theories that assume all optimization is corruptive.  
  - **Inverse proxy (4)** is the same phenomenon: optimization exploits the negative correlation, actively worsening outcomes. "Bad measurement" alone doesn’t capture the adversarial dynamic.  

  ---

  ### **Summary for the Auditor**
  Adequate accounts must:  
  1. **Predict risk** using pre-adoption features (e.g., high manipulability, low goal observability).  
  2. **Explain degradation** without intent or post-hoc goal redefinition.  
  3. **Handle edge cases** (decoy, monoculture, goal-constructive metrics).  
  4. **Avoid overgeneralization** by acknowledging robust proxies exist.  

  **Sacrifice**: Distinguishing proxy drift from goal-substitution *pre-implementation*. Mitigate by requiring explicit, immutable goal definitions in the target-adoption process.  

  **Strongest Filter**: If the account cannot address cases where the metric *constitutes* the goal (Req 6), it fails for institutional use—where goals are often socially constructed.
