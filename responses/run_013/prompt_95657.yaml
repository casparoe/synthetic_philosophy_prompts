prompt: |-
  I run a 90-minute session on evolution and behavior for about 20 undergrads in a philosophy-of-biology-adjacent course, and I want to run a game that makes them actually feel the units-of-selection problem in their gut rather than hearing the phrases "gene's-eye view" and "group selection" and nodding along. Design the whole thing for me.

  The kind of thing I'm after: I want them to end up in a situation where selfish behavior keeps winning inside every little group, and yet the groups made of selfish individuals keep losing to the groups with a few self-sacrificers in them, so the self-sacrificers hang on and even spread -- and then, crucially, I want them to watch that same run of numbers get re-described by a second person who keeps score purely at the level of individual bodies (or the bits of hereditary material those bodies carry), and reproduce the exact same trajectory without ever mentioning groups as a cause of anything. The punch I want them to feel is that both accounts can fit the identical data, so the fight between "the group is doing real work here" and "the group is just a bookkeeping convenience" is not settled by the numbers. It's a fight about what counts as a cause.

  Please invent a made-up critter and a made-up trait so nobody can fall back on a story they've already heard (some kind of communal alarm-caller or food-sharer in a fake burrowing animal, whatever you like -- just make the biology self-consistent and simple enough to run in a room). Give me:

  - the setup and roles, and a way to hand out a small number of secret cards so that some players are "carriers" of the cooperative trait and some aren't, and so the population can be split into groups that mix with each other only sometimes
  - the rules for a few rounds, the numbers that make within-group defection pay off while between-group survival rewards the cooperative groups, and a payoff scheme that needs nothing but points on a whiteboard (no real money)
  - a timeline that fits 90 minutes including setup and a decent debrief
  - a second "scorekeeper" role or second pass where the whole run gets re-tallied at the lower level, with instructions for how to present that so it lands
  - a debrief that maps specific moments in the game onto the parts of the disagreement, and that ends by asking them which account they now think is the "real" one and whether that question even has an answer
  - a frank note on what this activity can't reproduce and what I'll have to just tell them

  Also tell me what will predictably go wrong the first time I run it -- I've had groups where one loud person just bullies the room into a strategy and the whole thing flattens out, and I'd like to know how to handle that plus whatever else you think will trip it up.

  Write it all in American English, and please be concrete -- I'll be running this cold in front of students, so I need to be able to just read it and go.
reasoning: |-
  Okay, the user is teaching a philosophy of biology adjacent course and wants a 90-minute session to make students viscerally understand the units-of-selection problem. They need a game where students experience how both group-level and individual-level explanations can fit the same data. 

  Hmm, the core challenge is designing a simulation where:
  - Selfish behavior dominates within groups
  - Groups with cooperators outperform others
  - The same outcomes must be explainable through individual accounting
  - All within 90 minutes including debrief

  The user explicitly wants to avoid pre-known examples (like alarm calls) so students can't rely on existing narratives. They also anticipate problems like dominant personalities hijacking the experiment. 

  First, I need a fictional species - something simple with binary traits. Burrowing herbivores make sense since tunneling allows natural group segregation. "Tunnelers" with "root-sharing" vs "hoarding" behaviors could work. 

  For mechanics:
  - Cards can secretly assign traits (Circle = sharer, Triangle = hoarder)
  - Groups of 4-5 students simulate colonies
  - Each round has two phases: 
    1) Individual feeding (hoarders gain more within group)
    2) Winter survival (groups with more sharers have better survival odds)
  - Groups dissolve/reform periodically to simulate migration

  The scoring twist: After the group-level game, replay the identical sequence but track only individual reproductive success. Each player's offspring inherit their trait. The survival rates that were previously framed as "group success" now become individual survival probabilities. 

  Key pain points to anticipate:
  - Loud students dictating strategies → assign fixed traits secretly
  - Math slowing things down → pre-calculate probabilities
  - Migration confusion → physically move students between groups
  - Time crunch → strict 3-round limit

  Debrief should highlight:
  - How the same data produced both narratives
  - Why neither account is "false"
  - The causal interpretation difference
  - What real-world complexities are missing (e.g., trait linkage)

  The user's deep need here is epistemological - they want students to feel how scientific explanations layer onto phenomena. The game must make the philosophical tension tangible before dissecting it.
answer: |-
  Here’s a complete, ready-to-run 90-minute session using fictional **Tunnelers** (burrowing herbivores) and a cooperative **Root-Sharing** trait. The game forces tension between within-group selfish advantage and between-group competition, then reinterprets *identical outcomes* via individual fitness.

  ---

  ### **Game Setup** (15 mins)
  **1. Assign Traits & Groups:**  
  - Hand each student a secret card:  
    - 🔵 **Blue Card (Root-Sharer)**: Sacrifices personal energy to share food.  
    - 🔺 **Red Card (Hoarder)**: Keeps all food for self.  
    *(Distribute 25% Blue, 75% Red initially. E.g., 5 Blues, 15 Reds for 20 students)*  
  - Split students into **4 groups of 5** (mixed randomly).  
  - **Introduce Tunnelers:**  
    > *"You’re colonies of burrowing mammals. Each winter, groups compete for survival. During summer, individuals gather roots. Hoarders (🔺) keep every root they find. Sharers (🔵) use energy to split roots with others in their group—but this costs them personally."*

  **2. Display Payoffs:**  
  | **Action**                | **Energy Points Gained** |  
  |---------------------------|--------------------------|  
  | Hoarder (🔺) gathers roots | +3 (to self)             |  
  | Sharer (🔵) gathers roots  | +1 (to self) + Give +2 to **one random group member** |  

  **3. Survival Rules:**  
  - Groups survive winter if **total group energy ≥ 10 × group size**.  
  - Surviving groups contribute offspring to the next generation.  
  - **Winter penalty**: Groups failing survival lose 50% of members (randomly).  

  **4. Whiteboard Tracking:**  
  - Create a table:  
    | Group | Sharers (🔵) | Hoarders (🔺) | Total Energy | Survived Winter? |  
    |-------|--------------|--------------|-------------|-------------------|  

  ---

  ### **Gameplay: 3 Rounds** (45 mins total, 15 mins/round)  
  **Each Round = 1 Year (Summer + Winter):**  

  1. **SUMMER (Resource Gathering - 5 mins):**  
     - Students privately decide: **Gather roots?** (Yes/No).  
     - **Hoarders (🔺)**: If "Yes," gain **+3 energy**.  
     - **Sharers (🔵)**: If "Yes," gain **+1 energy** and give **+2 energy** to *one random group member* (write recipient’s name on a slip).  
     - *Note: Not gathering = 0 energy.*  

  2. **Calculate Group Energy (5 mins):**  
     - Groups sum energy. Record on whiteboard.  
     - **Key tension**: Hoarders always outgain Sharers *within* a group. Example:  
       - *Group A: 1🔵 (+1) + 4🔺 (4×3=12) = 13 energy*  
       - *Sharers get less, but boost others.*  

  3. **WINTER (Group Survival - 5 mins):**  
     - Check if group energy ≥ 10 × size (e.g., 50 for 5 players).  
     - **Surviving groups**: All members "reproduce" (each produces 1 identical offspring).  
     - **Failing groups**: 50% die (remove randomly). Survivors migrate (see below).  

  4. **MIGRATION (Reshuffle - 2 mins):**  
     - After winter, dissolve **all groups**.  
     - **Survivors** form new groups of 5 (randomly).  
     - **Sharers (🔵) stay Sharers; Hoarders (🔺) stay Hoarders.**  

  ---

  ### **Sample Trajectory** (Typical Outcome)  
  | Year | Group | Sharers | Hoarders | Energy | Survival? |  
  |------|-------|---------|----------|--------|-----------|  
  | 1    | A     | 1       | 4        | 13     | ❌ (13<50) |  
  |      | B     | 2       | 3        | 26     | ❌ (26<50) |  
  |      | C     | 1       | 4        | 13     | ❌ (13<50) |  
  |      | D     | 1       | 4        | 13     | ❌ (13<50) |  
  ➔ *All groups fail! 50% die. Migrate → New groups have more Sharers by chance?*  
  | 2    | A     | 3       | 2        | 39     | ❌ (39<50) |  
  |      | B     | 2       | 3        | 26     | ❌ (26<50) |  
  |      | C     | 1       | 4        | 13     | ❌ (13<50) |  
  ➔ *Sharers now 30% of population. Groups still fail, but higher energy.*  
  | 3    | A     | 3       | 2        | 39     | ❌ (39<50) |  
  |      | B     | 4       | 1        | 52     | ✅ (52≥50)! |  
  ➔ **Group B survives → 5 offspring (3🔵,2🔺). Sharers increase to 40%!**  

  **Why this works:**  
  - Hoarders *always* beat Sharers within a group.  
  - But groups with ≥3 Sharers generate enough energy to survive winters.  
  - After reshuffling, groups with critical mass of Sharers outcompete others.  

  ---

  ### **The Pivot: Individual Scorekeeper** (10 mins)  
  > *"Forget groups. Let’s reframe everything by tracking genes in individual bodies."*  

  1. **Replay the same 3 rounds using ONLY:**  
     - **Individual fitness**: Points = personal energy gained.  
     - **Reproduction**: Anyone surviving winter produces 1 offspring (inherit parent’s trait).  
     - **Death**: If your group fails winter, 50% chance you die.  

  2. **Whiteboard Re-tally:**  
     Track two "genes":  
     | **Trait** | **Total Carriers (Year 1)** | **Avg. Energy** | **Deaths** | **Offspring** | **Total (Year 2)** |  
     |-----------|----------------------------|----------------|------------|---------------|-------------------|  
     | Sharer (🔵) | 5                          | +1             | 3 died     | 2 born        | 4                 |  
     | Hoarder (🔺) | 15                         | +3             | 7 died     | 8 born        | 16                |  
     *(Adjust numbers to match your actual game)*  

  3. **Key Insight:**  
     The **same population trajectory** (e.g., Sharers increasing) now appears because:  
     - Sharers die less often (they disproportionately survive in high-Sharer groups).  
     - **No groups mentioned:** Survival is probabilistic; Sharers hitchhike on group success.  

  ---

  ### **Debrief** (20 mins)  
  1. **Map the Tension:**  
     - *Within groups*: "Hoarders won every interaction. Why didn’t they take over?"  
     - *Between groups*: "Groups with Sharers outsurvived others. Did groups *cause* Sharers to spread?"  
     - *Scorekeeper shift*: "Same outcome, no groups. Did we explain it differently?"  

  2. **Core Question:**  
     > *"Both stories fit the data. Is the group a **real cause** of Sharers spreading, or just a **bookkeeping tool**? What’s at stake in this fight?"*  

  3. **Highlight Philosophical Divide:**  
     - **Group Selectionist**: "Groups with Sharers reproduced *as units*. The group is a causal actor."  
     - **Gene-Centrist**: "Sharers had higher *individual* fitness because they clustered in winning groups. Groups are emergent."  

  4. **Final Punch:**  
     > *"The math doesn’t settle this. It’s about **what you designate as a ‘unit’ of causation**. Does natural selection see groups, or just genes riding in bodies?"*  

  ---

  ### **What This Can’t Simulate (Tell Them)**  
  1. **Real-world complexity**: Traits aren’t binary; environment isn’t static.  
  2. **Inheritance mechanisms**: No linkage, drift, or mutation.  
  3. **Multi-level feedback**: Groups don’t evolve adaptations.  
  4. **Human empathy**: Real organisms don’t "decide" to cooperate.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Loud Dominator:**  
     - **Fix**: Assign traits/roles *secretly*. Remind them: "You’re a gene, not a strategist."  
  2. **Math Confusion:**  
     - **Fix**: Pre-calculate examples. Appoint a student "calculator" per group.  
  3. **Migration Chaos:**  
     - **Fix**: Physically move students to new tables. Use name tags.  
  4. **Sharers Opting Out:**  
     - **Fix**: Emphasize: *Not* gathering = certain death. Most will participate.  
  5. **Time Overrun:**  
     - **Fix**: Run 2 rounds instead of 3. Prioritize debrief.  

  ---

  **Materials Needed:**  
  - 🔵 Blue + 🔺 Red cards (paper)  
  - Whiteboard + markers  
  - Randomizer app (for Sharer donations)  
  - Timer  

  **Why It Works:** Students *feel* the frustration of within-group loss and the shock of group-driven success. The pivot to individual scoring forces the "gut punch" realization: **Causality is in the eye of the theorist.** Run it cold—it’s designed for maximum clarity with minimal prep.
