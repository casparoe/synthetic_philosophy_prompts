  The physicist angle lets me say, "Like in my lab, good design mitigates uncertainty"—that’ll resonate. For residents, concrete examples matter: "Your neighbor could be next" makes rotation tangible. Scholars will want nuance on the veto, so I’ll cite the charter explicitly to show it’s bounded. 

