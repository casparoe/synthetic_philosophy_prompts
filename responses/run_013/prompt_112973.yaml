  Here’s a draft for your remarks. I’ve kept it conversational, grounded in your measurement background, and framed your philosophical concerns as open questions—not conclusions. The tone is direct but humble, and it ends by inviting debate at the reception. Spell-checked and ready to read.

  ---

  **Opening Remarks: City Futarchy Pilot Launch**  
  *(7-8 minutes)*  

  Good morning. I’m [Your Name]. Retired chemist. Spent 35 years building instruments that measure things—pressure, temperature, toxicity—and obsessing over whether they were *right*. Calibrated them against fixed points: triple points of water, known quantities. If my gadget said “100 degrees,” I could dunk it in boiling water and *know*.  

  Today, we’re here for a different kind of instrument: a futarchy pilot. For those new to this, here’s the skinny. We’ve all agreed we want fewer traffic deaths. That’s our “what.” Now, two proposals are on the table: one’s a street redesign—narrower lanes, lower speeds. The other’s a tech plan—cameras, speed governors. Instead of voting on which *plan* we like, we’ll run two prediction markets. One asks: “If we do the redesign, how many traffic deaths in three years?” The other: “If we do the tech plan, what’s that number?” Whichever market predicts fewer deaths, that’s the plan we run with.  

  Simple? Maybe. But here’s where my old calibration habits itch.  

  First, the measurement problem. With my thermometers, I could test them. Boil water, check the reading. But these prediction markets? Once we pick a plan—say, the redesign—we’ll never know if the tech plan *would’ve* saved more lives. The losing branch vanishes. So how do we calibrate this instrument? How do we know it’s not drifting? The forecasters in the room might say, “That’s the cost of counterfactuals—we live in one timeline.” True. But it means we’re trusting a tool we can’t falsify. That’s not wrong—but it’s real.  

  Second, gaming the metric. We’re measuring *traffic deaths*. That’s fixed. But what if one plan cuts deaths by making streets feel like prison corridors? Or by shifting risk onto cyclists? The metric won’t blink. It just counts bodies. So we might “win” on the number but lose something we can’t quantify—like trust, or joy, or fairness.  

  Which brings me to the deepest itch. This whole setup pretends we can cleanly split “what we want” from “how to get it.” But picking “traffic deaths” as the target? That’s already a value judgment. Some folks here—cyclists, urbanists—might say the real goal isn’t just fewer deaths. It’s quieter streets, or kids playing outside, or ditching car culture altogether. Those things don’t fit in our death-count box. So did we decide the *goal*? Or did we bake in the *method*?  

  Look, I’m not here to sink this pilot. Prediction markets are clever. They aggregate knowledge, force specificity, and—frankly—they’re more honest than most politics. But as a guy who spent his life testing tools against reality, I’ll say this: we’re building an instrument that can’t be checked. We’re betting lives on a ruler with no marks.  

  So let’s not pretend otherwise. The forecasters know this tension. The skeptics feel it. That’s fine. Good science stares at uncertainty.  

  Here’s what I hope we do tonight: argue. Not about whether markets beat voting—but about the thing we’re measuring. When we chose “traffic deaths,” what did we leave out? What *can’t* this number capture?  

  Because that’s the ghost in the machine:  
  The metric isn’t neutral. It’s a choice.  

  Thanks. I’ll see you at the reception.  

  ---

  **Why this works for your goals:**  
  - **Balances expertise & skepticism**: Forecasters hear you grasp unfalsifiability (nodding at their world). Skeptics hear their fears voiced—metric gaming, values buried in numbers.  
  - **Philosophy does heavy lifting**: Uses calibration as a metaphor to frame the "uncheckable instrument" problem. Targets value-belief entanglement head-on ("The metric isn’t neutral. It’s a choice.").  
  - **Ends on the question you want**: Explicitly points debate toward "What did we leave out of the metric?" at the reception.  
  - **Casual but precise**: Phrases like "Here’s the skinny," "itch," "ghost in the machine" keep it human. No citations, no jargon.  
  - **Acknowledges the unsolvable**: Doesn’t pretend to answer calibration/gaming/value issues—just puts them on the table as tensions to respect.  

  **Delivery tip:** Pause before "So let’s not pretend otherwise." Makes it feel like a confession, not a critique. Good luck—this is a philosopher’s playground.
