prompt: |-
  I'm a second-year MA student in one of those interdisciplinary programs that's half philosophy, half museum studies, and I have to hand in a prospectus in about six weeks where I commit to one research question and defend why it's worth three years. The area is fakes and forgeries, but I don't want to write about the thing everyone writes about — whether a perfect forgery is as good as the original, aura, all that. My advisor keeps saying my job is to pick the questions that other questions hang off of, and to be honest with myself about which ones a philosopher can actually make progress on without a lab or a museum's cooperation. So what I really want from you is a defended agenda for this area: which open questions matter most, in what order, and why — not a survey of positions, and please don't give me a reading list, I can't get to the library till next month and I'd rather have the reasoning anyway.

  Where I'm at right now is mostly downstream of an argument a friend in the program keeps making. She used to be a conservator, so she's coming at this from the bench rather than from the literature, and she insists we should stop using "authenticity" as one thing and split it into (a) ontological authenticity — the object is what it purports to be, same maker, same materials, same date — and (b) biographical authenticity — the object has had the history it purports to have, the right chain of hands, the right trajectory through the world. Her view is that once you seperate them, most of the disputes people have about originals are really disputes about (b) dressed up as disputes about (a), and that this shows up most clearly in three cases she lumps together as one problem: restoration (the object is still the thing, but the history has been interrupted), museum replicas of repatriated or fragile objects — including the 3D-printed stand-ins that are now good enough to fool almost anyone — and generated images, where there's no interesting causal chain to the depicted scene at all. She also has a stronger claim I'm not sure I buy, which is that "the original" isn't a natural kind at all but an institutional role, and that the market, art history and the law assign that role by completely different criteria, so most of the philosophical literature is quietly assuming one unified role that doesn't exist. That last bit feels either really important or like a verbal trick and I can't tell which. (For what it's worth, the case that got me into this is the WWII-era Dutch forger who sold a fake Vermeer to Göring and was only caught because of the sale — the interesting part isn't the deception, it's that everyone's valuation of the object flipped overnight without the object changing at all.)

  Given that, I'd like you to rank the open questions in this area — say the five or six that actually matter, then put them in order — along three axes: how many other questions depend on this one being settled, how tractable it is for a philosopher working alone over about three years, and whether an answer would change what museums, courts, insurers or collectors actually do. Tell me explicitly what would move something up or down that ordering, and which of the questions I'd be better off ignoring even though they're fun. And be straight with me about whether the (a)/(b) split is even coherent — if the whole framing is confused, or if it's just a relabeling of distinctions that are already standard, say so instead of building on it to be helpful. Please also tell me how confident you are in each thing you claim, and single out the one point you're least sure about.
reasoning: |-
  Okay, let me unpack this MA student's request. They're in an interdisciplinary program combining philosophy and museum studies, facing a tight deadline for their research prospectus on fakes and forgeries. They explicitly reject the well-trodden paths (aura, perfect forgery debates) and want a prioritized agenda - not literature, but a reasoned framework for impactful questions.

  Hmm, the core seems to be evaluating their conservator friend's conceptual split: ontological vs biographical authenticity. The student is drawn to this but wary it might be either groundbreaking or trivial. That WWII Vermeer forgery case they mention is particularly telling - it demonstrates how valuation collapses when biographical narrative fails, even if the object remains physically unchanged.

  Three key constraints from their advisor are crucial here: questions should be foundational (others "hang off" them), feasible for solo philosophical work, and capable of influencing real-world practice. The student also wants explicit ranking criteria and honesty about blind spots.

  Right, first I need to test the coherence of the (a)/(b) distinction itself. Let me mentally run through counterexamples: 
  - A meticulously restored artifact might retain ontological authenticity (same maker/materials) but lose biographical continuity through intervention. 
  - A 3D-printed museum replica has perfect biographical documentation but zero ontological links to the original. 
  - That Göring Vermeer - physically unchanged but biographically shattered. 

  This holds up. The distinction isn't entirely new (similar to Goodman's autographic/allographic, or Peircean indexicality), but reframing it as competing authenticity modes feels fresh. The friend's "institutional role" claim about originals is more provocative though - that's the hinge point where things get philosophically juicy or messy.

  Now for question prioritization. Top contenders would be:
  1. The institutional role of "original" - if this holds, it rewrites the rulebook for museums/law/markets. High impact but needs careful philosophical grounding. 
  2. Hierarchy of authenticity types - which one dominates when they conflict? Directly applicable to restoration debates. 
  3. Authenticity transfer - can replicas inherit status? Critical for digital repatriation policies. 
  4. Material persistence thresholds - when does restoration void ontological authenticity? Affects conservation ethics. 

  I'd deprioritize purely metaphysical debates about forgery value - intellectually fun but less actionable for museums. The biographical authenticity question seems most tractable for solo research too; lots of case studies available publicly.

  Biggest uncertainty? Whether the institutional role argument survives edge cases like AI-generated art. But that's exactly why it's worth placing first - if it works, it changes everything; if not, it fails productively. Should flag this risk explicitly in the response.

  For structure, I'll justify the ranking along their three axes: dependency (how many other questions rely on this), tractability (solo research feasibility), and real-world impact. The Vermeer case will anchor the argument - it perfectly illustrates biographical authentication's power over valuation.
answer: |-
  Here’s a defended agenda for your research, prioritizing open questions in fakes/forgeries based on your constraints. I’ve evaluated questions along your three axes: **foundational significance** (how many other questions depend on it), **tractability** (feasibility for a solo philosopher), and **real-world impact** (potential to change institutional practices). I’ll explicitly state why each question ranks where it does and flag uncertainties.  

  **Core Framework Assessment**  
  Your friend’s (a)/(b) split (**ontological** vs. **biographical authenticity**) is coherent and valuable (85% confidence). It’s not merely relabeling: it disentangles *material genesis* from *social trajectory* in a way that clarifies institutional conflicts (e.g., museums prioritizing (b) for provenance, conservators (a) for material integrity). The "original as institutional role" claim is the most radical and promising part—but also the riskiest (50% confidence). If defensible, it reframes the entire field.  

  **Ranked Questions** (1 = Highest Priority)  

  1. **Is "the original" an institutional role rather than a metaphysical category?**  
     - *Why it matters*: This underpins *every* dispute about authenticity. If "original" is a context-dependent status (e.g., market: provenance-heavy; law: authorship-focused; museums: material + narrative), it explains why valuations flip overnight (as with your Göring Vermeer case) without physical change.  
     - *Foundational*: All other questions (restoration ethics, replica legitimacy, etc.) depend on this.  
     - *Tractability*: High. Requires analyzing institutional criteria (auction records, legal cases, museum policies) publicly available online. No lab needed.  
     - *Impact*: Would force museums/insurers/courts to explicitly defend their criteria for "originality," potentially standardizing practices.  
     - *Move up/down*: Up if you find consistent institutional patterns; down if roles overlap chaotically.  
     - *Ignorable?* No—this is the keystone.  

  2. **When ontological and biographical authenticity conflict, which *should* dominate—and why?**  
     - *Why it matters*: Your friend’s three cases (restoration, replicas, AI images) hinge on this. Ex: A 3D-printed replica has perfect (b) but no (a); an over-restored artifact has compromised (b) but intact (a).  
     - *Foundational*: Resolving this dictates how institutions handle reparations, conservation, and digital access.  
     - *Tractability*: High. Builds on Q1 by applying the framework to case studies (e.g., debates over the Nefertiti Bust replica or AI "Van Goghs").  
     - *Impact*: Directly informs museum replication policies, conservation ethics, and copyright law.  
     - *Move up/down*: Up if Q1 is resolved; down if institutions show no consistency in conflicts.  
     - *Ignorable?* No—this is where theory meets practice.  

  3. **Can biographical authenticity "transfer" to replicas?**  
     - *Why it matters*: Repatriation demands (e.g., Benin Bronzes) rely on replicas as stand-ins. If replicas inherit the original’s biography (e.g., 3D scans of looted objects), do they become "authentic" in a new way?  
     - *Foundational*: Tests the limits of the (a)/(b) split.  
     - *Tractability*: Medium. Requires conceptual analysis of "transfer" (e.g., is it narrative grafting? symbolic inheritance?) but needs no new data.  
     - *Impact*: Could revolutionize repatriation practices and digital archiving.  
     - *Move up/down*: Up if Q2 shows (b) can dominate; down if transfer is deemed incoherent.  
     - *Ignorable?* Tempting but critical for contemporary issues.  

  4. **What threshold of material change voids ontological authenticity?**  
     - *Why it matters*: Conservation constantly faces this (e.g., Ship of Theseus-style restorations). Is 90% original material still "ontologically authentic"?  
     - *Foundational*: Clarifies the boundaries of (a), affecting how we define forgeries vs. altered originals.  
     - *Tractability*: Medium. Philosophical heavy lifting (metaphysics of persistence) but anchored in real cases (e.g., cleaned Renaissance paintings).  
     - *Impact*: Guides conservators and insurers on intervention limits.  
     - *Move up/down*: Up if material science data is avoidable; down if empirical thresholds are unavoidable.  
     - *Ignorable?* Yes if over-restoration cases are rare—but they’re not.  

  5. **Is biographical authenticity possible for generated images?**  
     - *Why it matters*: AI art has no "maker" or causal chain to a scene. If (b) requires human/object entanglement, does AI negate authenticity entirely?  
     - *Foundational*: Tests whether (b) is universally applicable or culturally specific.  
     - *Tractability*: Low-Medium. May require engaging with AI ethics (outside pure philosophy).  
     - *Impact*: Shapes how museums collect digital art and courts handle AI copyright.  
     - *Move up/down*: Down if AI is deemed a non-issue for traditional authenticity debates.  
     - *Ignorable?* **Yes**—for now. AI is evolving fast; prioritize stable problems.  

  **Explicit Ranking Logic**  
  - **Dependency**: Q1 anchors all others (if "original" isn’t a natural kind, everything changes).  
  - **Tractability**: Avoids empirical gaps (e.g., lab analysis) or murky AI debates.  
  - **Impact**: Targets institutions’ operational pain points (replicas, repatriation, restoration).  

  **What to Ignore (Even If Fun)**  
  - "Is a perfect forgery artistically equal?" (Rehashed, low real-world impact).  
  - "Can fakes have aura?" (Speculative, depends on contested metaphysics).  
  - Historical surveys of forgery (You’re doing philosophy, not art history).  

  **Weakest Point**  
  The claim that **"original" is purely an institutional role** (Q1) is my least confident point (50%). It could be a verbal trick if institutions secretly share core criteria—but your Göring case suggests otherwise. *Test this first*: If it collapses, refocus on Q2 as your centerpiece.  

  **Why This Agenda Works**  
  1. **Leverages your friend’s insight** without requiring her stronger claims to be true.  
  2. **Meets advisor’s demands**: Questions are foundational (Q1-2), tractable (publicly verifiable cases), and actionable (Q2-4 impact museums/law).  
  3. **Uses your Vermeer case**: The valuation flip exemplifies biographical authenticity’s power—perfect for opening your prospectus.  

  **Next Step**: Draft Q1 as your core question. If evidence weakens it, pivot to Q2 as the anchor. Either way, you’re hacking at the root—not the branches.
