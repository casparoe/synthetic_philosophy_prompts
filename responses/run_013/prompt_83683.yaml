prompt: |-
  I work with population statistics for a living, which means I spend my days making generalisations about groups of people, and I have been trying to work out where my own line actually falls. What I want from you is the principle, or the best small set of competing principles, behind the verdicts below: which clause of the principle each verdict is doing the work for, what it predicts about cases I have not listed, and an honest account of which of my verdicts it cannot save. Take the factual content of the cases as stipulated — I am asking about what may be said, not about what the evidence shows.

  - 'Norwegian men are on average taller than Guatemalan men.' Fine, no hesitation; I would put it in a report without thinking.
  - 'Danes are more likely to cycle to work than Britons.' Fine.
  - 'Men are more likely to die by suicide than women.' Fine, and I do write it.
  - 'Men are violent.' Not fine. It is close to the same information.
  - 'The Japanese are more group-oriented than Americans.' Fine if I hedge it — 'tend to be', 'on average'. Unhedged, I feel I have started claiming something about Japanese character, and I do not want to.
  - 'Brazilians are warm.' Fine — and notice that I have dropped the hedge altogether; there is no 'on average' anywhere in it. It also feels like a compliment, and I suspect that is doing some of the work.
  - 'Germans are humourless.' Not fine, and I cannot see that the form is any different from the Brazilian case.
  - 'The French are rude.' Not fine. 'Parisian waiters are rude' — fine, or at least I say it without wincing.
  - 'The Irish are good talkers.' Fine. 'The Irish are drunks.' Not fine, and as far as I know the second is not even the more common trait, so accuracy does not seem to be what is at stake.
  - I am a Scot, and I say 'we Scots are dour' without a qualm. When my English colleague says 'Scots are dour' — the same proposition — I bristle. I cannot explain this by the content, because the content is identical.
  - 'He was late because he is Brazilian.' Not fine. 'She is blunt because she is Dutch.' Fine, or nearly so.
  - The one I keep going back and forth on: 'Nigerians are entrepreneurial.' I say it, I think it is fine, and then I catch myself wondering whether it is the same move as 'the Irish are drunks' with a friendlier adjective — and, if it is, whether the friendliness is the problem or the excuse.

  Two things beyond the principle itself. First, I would like to know whether the account you give is about the content of what is said, about the speaker, about the audience, or about the effects; my suspicion is that my verdicts are tracking several different things at once and that I have been treating them as though they were one. Second, I would like to know what, if anything, survives of the idea of national character. If the best account of my verdicts leaves only distributions of traits, with no sense in which a people has a character, then I want that said plainly; if some notion of character survives, I want to know what work it does that a distribution cannot.

  As a test of whatever you settle on, give me one case it permits and one it forbids that are as close together as you can make them. I am not asking for a survey of the literature or a reading list; I want the principle, the cases it turns on, and, if no single principle fits, a straight answer about which of my verdicts I should give up and why.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work with population statistics and are struggling with when it's acceptable to make generalizations about groups. They provided several examples where they feel comfortable or uncomfortable making such statements, and they want a principle that explains their judgments.

  First, I need to analyze their examples to identify patterns. The acceptable statements like "Norwegian men are taller on average" or "men are more likely to die by suicide" all include explicit or implicit statistical markers ("on average," "more likely"). The problematic ones like "Men are violent" or "Germans are humourless" are blanket statements without such qualifiers. But then there are exceptions: "Brazilians are warm" is accepted without a hedge, while similar forms like the German example are rejected. Also, the user's personal identity affects their judgment, as seen in the Scottish example.

  The user mentions that compliments ("Brazilians are warm") seem more acceptable, which suggests that valence (positive vs. negative) plays a role. But that doesn't fully explain why "the Irish are drunks" is bad while "good talkers" is okay. Maybe it's not just positivity but also harmful stereotypes. The Nigerian entrepreneurial example is tricky because it's positive but might still be a stereotype. The user is aware of this tension and questions if the adjective's friendliness is masking the same problematic generalization.

  Another angle is the specificity of the group. "Parisian waiters are rude" is acceptable compared to "the French are rude," indicating that narrowing the group might make it feel more precise. But is that statistically valid? Maybe in the user's experience, Parisian waiters have a higher incidence of rudeness, but without data, it's anecdotal. The user wants to know if the principle is about content, speaker, audience, or effects. Their examples show it's a mix. For instance, when they as a Scot say "we are dour," it's self-description, which feels different than an outsider saying it. So speaker identity matters.

  The effects part is crucial too. Saying a group is violent can perpetuate harmful stereotypes, leading to discrimination. Even positive traits like "entrepreneurial" might pressure individuals or ignore diversity within the group. The user needs to consider the real-world impact of their statements in reports. 

  Then there's national character. The user questions if such a concept survives or if it's just trait distributions. From a statistical perspective, distributions are measurable, but "character" implies something inherent and static, which isn't supported by data. Traits can change over time due to social, economic factors. So maybe the principle should reject national character as essentialist, sticking to probabilistic statements based on current data.

  Putting it together: the core principle might be that generalizations must be probabilistic, specific, non-harmful, and consider speaker/audience context. But applying this to their Nigerian example: if "Nigerians are entrepreneurial" is based on data (e.g., high business startup rates), is it okay? But without a hedge, it risks implying it's inherent. Adding "on average" or "tend to be" could help. However, the user noted they dropped the hedge for Brazilians being warm. So maybe the valence and lack of harm make it acceptable, but that's subjective. Consistency would require either hedging both or neither, but the user's reactions differ. 

  The user's internal conflict suggests they need a clear guideline. Perhaps the solution is to always use hedges for group generalizations unless it's a self-description or non-harmful compliment. But even compliments can be reductive. The test cases they want should highlight the boundary. For example, "Swedes are egalitarian" might be acceptable with data and a hedge, but "Swedes are cold" without a hedge is not, due to negative valence and potential harm.

  Ultimately, the user might need to sacrifice some of their current judgments for consistency. For instance, accepting "Brazilians are warm" only with a hedge, or rejecting "the Irish are good talkers" without one. But their discomfort with "Nigerians are entrepreneurial" indicates awareness that even positive traits need caution. Admitting that national character is a myth and sticking to distributions could resolve some issues, but the user's examples show cultural perceptions are hard to avoid. 

  In conclusion, the principles are: 1) Use statistical language, 2) Avoid harmful stereotypes, 3) Consider in-group vs. out-group context, 4) Be aware of valence and its effects. The user should give up unhedged positive generalizations like "Brazilians are warm" to maintain consistency, as they're structurally similar to negative ones. National character doesn't survive as a useful concept beyond measurable distributions.
answer: |-
  Based on your verdicts and analysis, the core principle governing your judgments is **Probabilistic vs. Essentialist Attribution**, moderated by **Harm Potential** and **Speaker-Group Relationship**. This principle has three interconnected clauses:

  1.  **Statistical Framing:** Generalizations must be explicitly or implicitly framed as probabilistic trends (e.g., "more likely," "on average," "tend to") rather than universal or inherent properties. This acknowledges distribution and variation.
  2.  **Harm Mitigation:** Generalizations perceived as negative, potentially harmful, or reinforcing damaging stereotypes trigger stricter scrutiny, demanding stronger statistical framing or narrower scope to avoid essentialism.
  3.  **In-Group Privilege:** Speakers enjoy greater latitude when generalizing about their *own* perceived in-group ("we"). Outsiders generalizing about a group ("they") face a higher bar, especially for neutral or negative traits.

  **How it Explains Your Verdicts:**

  *   **Fine (Probabilistic Framing):**
      *   *"Norwegian men are on average taller..." / "Danes are more likely to cycle..." / "Men are more likely to die by suicide..."*: Explicit probabilistic framing (Clause 1). Accuracy is supported by data.
      *   *"The Japanese are more group-oriented than Americans." (Hedged)*: Hedges ("tend to be") provide probabilistic framing (Clause 1).
      *   *"Parisian waiters are rude."*: Narrowly scoped group, implying a situational/cultural pattern rather than essential French nature. Easier to frame probabilistically (Clause 1), less harmful than "The French" (Clause 2).
      *   *"The Irish are good talkers."*: Positive valence reduces perceived harm (Clause 2), allowing weaker probabilistic framing (though ideally still implied). Accuracy/mythology might play a subtle role.
      *   *"Brazilians are warm."*: Positive valence significantly mitigates harm potential (Clause 2), allowing the probabilistic framing to become entirely implicit. The compliment factor reduces scrutiny.
      *   *"She is blunt because she is Dutch."*: Neutral/mildly negative trait, but often culturally acknowledged stereotype with less severe harm potential than "violent" or "drunk" (Clause 2). Probabilistic link ("Dutch directness") is culturally understood.
      *   *"We Scots are dour."*: In-group privilege (Clause 3). You can invoke a shared cultural trope (even negative) without implying essentialism or harm to the same degree.

  *   **Not Fine (Essentialist Attribution/Harm):**
      *   *"Men are violent."*: Lacks probabilistic framing, implies inherent property (violates Clause 1). High harm potential (reinforces dangerous stereotype) (Clause 2).
      *   *"Germans are humourless."*: Structurally similar to "Brazilians are warm" but negative valence triggers harm assessment (Clause 2), demanding stronger probabilistic framing (Clause 1), which is absent.
      *   *"The French are rude."*: Broad group, negative, lacks probabilistic framing (Violates Clause 1 & 2). Contrasts sharply with the acceptable "Parisian waiters" due to scope and implied essentialism.
      *   *"The Irish are drunks."*: Negative, highly harmful stereotype (Clause 2), lacks probabilistic framing (Clause 1). Accuracy doesn't save it because the harm stems from the *type* of claim, not its truth value.
      *   *"He was late because he is Brazilian."*: Attributes individual behavior *directly* and solely to national membership. Ignores individual agency/context, implying inherent trait (Violates Clause 1). Harm potential (laziness stereotype) (Clause 2).
      *   *"Scots are dour." (Said by English colleague)*: Same content as your self-statement, but violates Clause 3 (Outsider attribution). Feels like an imposition or stereotype, raising harm potential (Clause 2) due to the speaker-group relationship.

  *   **Ambiguous ("Nigerians are entrepreneurial"):**
      *   Positive valence reduces harm potential (Clause 2), similar to "Brazilians are warm." However, it still lacks explicit probabilistic framing (Clause 1). The concern is that it *is* structurally identical to "The Irish are drunks" – a blanket attribution. The "friendliness" masks the essentialist potential. Does it imply an inherent national character? Could it create pressure on individuals? Your discomfort suggests it flirts with violating Clause 1, saved primarily by Clause 2 (low perceived harm).

  **Predictions for Unlisted Cases:**

  *   *Permitted:* "Senegalese wrestlers are exceptionally strong." (Narrow scope, probabilistic implied).
  *   *Permitted:* "Canadians are generally perceived as polite." (Hedged, low harm).
  *   *Permitted:* "We Australians love the beach." (In-group, positive, probabilistic implied).
  *   *Forbidden:* "Accountants are boring." (Broad group, negative, essentialist, harmful).
  *   *Forbidden:* "She got the promotion because she's Asian." (Attribute individual outcome solely to group, essentialist, harmful).
  *   *Ambiguous:* "Italians are passionate." (Positive valence helps, but still broad and essentialist without framing).

  **What Doesn't Fit & What to Give Up:**

  The principle struggles most with **"Brazilians are warm"**. It violates strict Clause 1 (no probabilistic framing) and relies heavily on Clause 2 (low harm due to positivity). To be consistent with your rejection of structurally similar negative statements ("Germans are humourless"), you should **give up making unhedged positive attributions like "Brazilians are warm"**. It *is* the same move as "the Irish are drunks" with a friendlier adjective. The "friendliness" *is* the excuse, masking the essentialism. Replace it with "Brazilians are often described as warm" or "Cultural norms in Brazil often emphasize warmth."

  **Nature of the Account:**

  Your verdicts track **all four elements simultaneously**:
  1.  **Content:** The presence/absence of probabilistic framing, scope (national vs. subgroup), valence (positive/negative).
  2.  **Speaker:** In-group vs. out-group status (Clause 3).
  3.  **Audience:** Perception of harm or offense potential (Clause 2).
  4.  **Effects:** The potential to reinforce stereotypes, justify discrimination, or erase individuality (underpins Clause 2).

  **The Fate of "National Character":**

  **The concept of "national character" as an inherent, essential, defining psychic unity of a people does not survive.** What survives are:
  1.  **Measurable Distributions:** Documented statistical differences in the prevalence of behaviors, attitudes, or traits between populations (e.g., higher average agreeableness scores in Culture A vs. B).
  2.  **Descriptive Cultural Patterns:** Observable, often socially reinforced, norms, values, communication styles, or behavioral tendencies common within a group (e.g., norms around punctuality, directness in communication, importance of family vs. individualism).
  3.  **Shared Narratives & Stereotypes:** The stories groups tell about themselves ("we are resilient") and others ("they are efficient"), which influence behavior and perception but are not inherent "character."

  **The work "character" does (that distributions alone don't) is largely illusory or harmful:** It implies immutability, homogeneity, and inherent causality ("they do X *because* they are Y people"). Distributions describe *what is*, not *why* or *what they inherently are*. Cultural patterns explain *how* shared norms influence behavior without resorting to inherent essence. Attributing outcomes to "national character" hinders understanding the complex social, economic, historical, and institutional factors shaping distributions and patterns. Your discomfort with unhedged attributions, especially by outsiders about groups, stems from the ghost of "national character" lurking within them.

  **Test Cases (As Close as Possible):**

  *   **Permitted by the Principle:** "Studies suggest Finns report higher levels of introversion on personality inventories than Spaniards, on average." (Explicit probabilistic framing (Clause 1), neutral/low harm (Clause 2), descriptive).
  *   **Forbidden by the Principle:** "Finns are introverts." (Lacks probabilistic framing, implies essentialism (Violates Clause 1), potential harm via oversimplification (Clause 2)).

  The difference hinges entirely on the framing acknowledging distribution and avoiding essentialist claims about inherent character.
