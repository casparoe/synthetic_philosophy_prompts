prompt: |-
  So I've somehow volunteered to run the is/ought gap for our cross-departmental reading group next month — it's a mixed bag: two economists, a biologist, a historian and a lawyer, no philosophers, and they'll have done no prep. Sixty minutes, whiteboard. I want to actually teach the thing rather than just say the slogan at them, so don't explain the gap to me, I've got that; plan the session for me.

  What I need from you:

  **The order.** What has to be in place before the question even means anything to them — my instinct is that they need the notion of a valid argument, and the difference between a premise being true and a conclusion following from it, before "you can't get an ought from an is" can be anything other than noise, but tell me if that's the right first move or whether something else has to come before it. Then say where the naturalistic fallacy and the appeal-to-nature thing slot in — before the gap, after it, or never at this level — and why. Be explicit about what depends on what, because I'm fairly sure the whole hour collapses if I get the first ten minutes wrong.

  **The carrying example.** My plan was to open with "eating meat is natural, therefore it's fine" (or the vegan version, whichever lands harder), but I've got a nagging feeling that's the wrong example, because it seems to smuggle in two mistakes at once — natural therefore good, and unnatural therefore bad — and neither of them is actually the is/ought point. If it's the wrong one, say so and give me the right one: something where the slide from description to prescription is invisible on first hearing, where the hidden premise is genuinely tempting, and where the diagnosis generalises. And tell me what the example must not be, i.e. what it would teach them if I got it wrong.

  **The misconceptions, in the order they'll actually turn up.** What I'm expecting: the economists do cost-benefit analysis for a living and will be convinced they derive oughts from ises all day, so I need something ready for "but we do this every Tuesday"; someone will conclude that if the gap is real then morality is just made up and anything goes; someone else will over-correct and decide that facts are simply irrelevant to ethics, which I'm fairly sure is wrong and definately not what Hume was on about; and most of them will assume the gap runs both ways — that you can't get an is out of an ought either — which I think is plainly false ("you ought to go and help him" gets you "there's someone who needs help"). Where do I head each of these off, and which one should I let them walk into and then take apart rather than pre-empting?

  **The thing I've never known what to do with.** Years ago someone showed me a smart-arse proof that looks like it gets an ought out of an is and seems completely valid — roughly: he's a sea captain, so he ought to do whatever a sea captain ought to do. There's a wierd cousin of it involving tea and the English, and another where a moral claim pops out of a purely descriptive premise just by being tacked onto the end of an "or". I don't know whether these are real counterexamples to the gap, tricks with the word "ought" getting carried along inside the conclusion, or just sophistry — and I'd rather not have the lawyer produce one cold. Where do they belong in the session, and what's the honest thing to say about them?

  **The check at the end.** One question or one task that would show me whether they've got the gap rather than just been able to repeat it back — ideally something where the right answer and the slogan answer come apart.

  **And what to cut.** I'm already planning to refuse the whole metaethical zoo (non-cognitivism, error theory, the various realisms), and the question of whether the gap is a theorem of logic or just a methodological warning, since I'm honestly not sure myself and don't want to bluff in front of the lawyer. Tell me what else to leave out and where in the session I should say out loud that I'm leaving it out, so nobody goes home thinking I skipped something embarrassing.

  No reading lists, please — they won't do them, and the ones who do will just look up the titles.
reasoning: |-
  Okay, the user needs to plan a session on the is/ought gap for a mixed group of professionals with no philosophy background. They've got specific concerns about structure, examples, misconceptions, and tricky counterarguments. 

  First, understanding the group dynamic is crucial. Two economists might resist the gap because their work involves deriving policy "oughts" from economic data. The biologist could conflate natural with good. The historian might see moral claims as culturally contingent facts. The lawyer will likely pounce on logical loopholes. None will have pre-read, so clarity is paramount.

  The core challenge is sequencing. The user's instinct about starting with argument validity is spot-on - without understanding how premises support conclusions, "can't derive ought from is" sounds arbitrary. But that foundation needs to be laid fast: maybe 10 minutes max using concrete examples. 

  For the carrying example, their meat/naturalness example is indeed problematic - it smuggles in the naturalistic fallacy, which isn't the same as the is/ought gap. Better to use a neutral example where the evaluative leap is subtle but undeniable, like health claims implying obligations. Must avoid examples where "ought" is definitional (like roles) or where social norms are misconstrued as facts.

  The misconceptions are predictable. Economists' "we do this Tuesday" objection should be addressed early by distinguishing instrumental from moral oughts. The "morality is subjective" panic needs careful handling - acknowledge it's a live debate but stress Hume wasn't saying that. The bidirectional confusion (can't get is from ought) is useful to expose then correct. 

  Those tricky "proofs" are semantic sleight-of-hand. The sea captain example equivocates between descriptive roles and normative duties. Best to flag these as wordplay when discussing what "ought" means, showing how they don't bridge the substantive gap.

  For the checkpoint, the user's idea of contrasting valid/invalid arguments is strong. Better yet: give them a deliberately sneaky example where descriptive premises seem to imply a moral conclusion unless you spot the hidden evaluative premise. 

  Cutting content is wise. No metaethics rabbit holes. Explicitly state exclusions upfront: "We're focusing on Hume's logical point, not whether morality exists." The biologist's naturalistic fallacy gets a brief nod but isn't the main event. 

  Biggest risk is the lawyer springing the sea captain "counterexample." Have that rebuttal ready: "Notice how the 'ought' was already baked into the meaning of 'captain'? That's cheating." Make it a teaching moment about unpacking concepts.
answer: |-
  Here’s a battle-tested session plan designed for your group. It prioritizes conceptual clarity over philosophical exhaustiveness, with built-in traps for common misconceptions. **Total time: 58 minutes.**

  ---

  ### **The Order & Timing (50 mins)**
  **Goal:** Make "you can’t get an *ought* from an *is*" feel like an obvious rule of reasoning, not just a slogan.

  1.  **Groundwork: What is an Argument? (8 mins)**
      *   **Why first?** Without this, "gap" means nothing. *Skip formal logic symbols.*
      *   **Do:** Draw a simple syllogism on the board:
          *   *Premise 1:* All humans need water to survive. *(Descriptive - "is")*
          *   *Premise 2:* Socrates is human. *(Descriptive - "is")*
          *   *Conclusion:* Socrates needs water to survive. *(Descriptive - "is")*
      *   **Explain:** "This is *valid*: *If* the premises are true, the conclusion *must* be true. The conclusion *follows*." Emphasize "follows" vs. "is true".
      *   **Contrast:** Draw an *invalid* argument:
          *   *P1:* Socrates is human.
          *   *P2:* Plato is human.
          *   *C:* Socrates is Plato. *(Obviously false conclusion, invalid structure)*
      *   **Key Point:** Validity ≠ Truth. Truth is about the *premises*. Validity is about the *structure*.

  2.  **Introducing "Ought" & The Gap (12 mins)**
      *   **Do:** Write Hume’s core point: **"No *ought* from an *is*."** Define:
          *   **"Is" = Descriptive statements** (facts, observations, what *is* the case).
          *   **"Ought" = Prescriptive statements** (values, obligations, what *should* be done).
      *   **The Carrying Example (USE THIS):**
          *   *P1:* Carrying heavy boxes causes back pain for many people. *(Is)*
          *   *P2:* Back pain is harmful. *(Is - sneaky? See below)*
          *   *C:* Therefore, you *ought* to help colleagues carry heavy boxes. *(Ought)*
      *   **Why this works:**
          *   **Feels plausible:** The slide *seems* natural.
          *   **Hidden Premise Exposed:** Ask: "Does C *logically follow* from P1 and P2 alone? What's missing?" *Draw the missing premise:* **"You ought to prevent harm to others where easily possible."** *(Ought!)* Highlight it in red.
          *   **Diagnosis:** The conclusion only follows *if* you add an *ought* premise. You can't *derive* the "ought" purely from the "ises".
      *   **What it MUST NOT be:** Avoid "natural = good" examples (e.g., eating meat). They conflate the *is/ought gap* with the *naturalistic fallacy* (a distinct error). Save that for contrast later.

  3.  **Naturalistic Fallacy / Appeal to Nature (5 mins)**
      *   **Slot In:** *After* establishing the gap.
      *   **Why here?** It's a *common mistake* people make *when trying to bridge the gap*, not the gap itself.
      *   **Do:** Contrast with the carrying example:
          *   "Eating meat is natural. Therefore, eating meat is morally good." *Ask: "Is this committing the is/ought gap? How is it different?"*
          *   **Explain:** "This *is* trying to get an 'ought' (good) from an 'is' (natural). But it's a *specific bad way* of doing it – assuming 'natural' *means* 'good'. That's the *naturalistic fallacy*. The is/ought gap is the *general rule* that *any* attempt to get 'ought' solely from 'is' fails logically. The fallacy is one flawed *attempt* to break the rule."

  4.  **Tackling Misconceptions (15 mins - Interweave as they arise, but plan for these):**
      *   **Economists ("We do this every Tuesday!"):**
          *   **When:** Likely after introducing the gap.
          *   **Response:** "Absolutely! Cost-benefit analysis *looks* like deriving 'ought' (optimal policy) from 'is' (costs/benefits). But look closer: What's the *first* 'ought'?" Draw:
              *   *P1:* Policy A has higher net benefit than Policy B. *(Is)*
              *   *C:* Therefore, we *ought* to choose Policy A. *(Ought)*
          *   **Missing Premise:** "**We ought to maximize net benefit.**" *(Ought!)* "Economists *start* with this value premise (efficiency, welfare maximization). The analysis shows *how* to achieve that 'ought' given the 'ises'. It doesn't *create* the foundational 'ought'."
      *   **"So morality is just made up / subjective?" (Likely after gap feels solid):**
          *   **Head off:** Briefly! Say: "Hume points out a *logical gap*, not that morality is nonsense. He *was* a moralist! He thought morality was based in human sentiment (feelings like sympathy). The gap means you can't *prove* moral rules *only* with science or logic. Where they *come from* is a different, huge question. We're *only* looking at the logic today. **Cut:** Full metaethics."
      *   **"Facts are irrelevant to ethics?" (Over-correction):**
          *   **Head off:** Emphatically! "**No!** Facts are *crucial* for *applying* moral principles. If I say 'You ought to help those in need', I *need* the 'is' fact *that* someone is drowning to know I ought to jump in. The gap means the *principle itself* ('help those in need') isn't *proven* by facts alone. Facts tell us *when and how* the 'ought' applies."
      *   **"Can't get an 'is' from an 'ought' either?" (Let them walk into it):**
          *   **Do:** Let someone voice this. Then ask: "If I know 'You ought to help that person drowning', what 'is' fact must *at least possibly* be true?" (Someone is drowning and needs help). "If 'You ought not steal', what 'is' fact is implied?" (Stealing is possible). **Point:** "Oughts *presuppose* certain 'ises' (possibilities, needs, vulnerabilities). The gap runs *one way*: You can't *logically derive* the *prescriptive force* of the 'ought' purely from descriptive 'ises'. But 'oughts' often *entail* or *suggest* descriptive facts."

  5.  **The "Smart-Arse Proofs" (Sea Captain, Tea, "Or") (8 mins)**
      *   **Slot In:** When discussing *what "ought" means* or when someone brings it up (likely the lawyer).
      *   **The Examples:**
          *   *Sea Captain:* "He is a sea captain. Therefore, he ought to do what a sea captain ought to do." (Tautology!)
          *   *Tea:* "She is English. Therefore, she ought to like tea." (Hidden premise: "All English ought to like tea" - an *ought* disguised as a definition or norm).
          *   *"Or" Trick:* "Either it's raining, or you ought to water the plants. It's not raining. Therefore, you ought to water the plants." (The "or" statement smuggles in the "ought" as a *disjunct*).
      *   **The Honest Take:** "These are **logical sleight-of-hand, not counterexamples.** They either:
          1.  **Tautologies:** The 'ought' is just repeated in the conclusion (Sea Captain).
          2.  **Smuggle in an 'ought':** The premise *looks* descriptive but hides a normative claim (Tea - "English" implies norms).
          3.  **Assume the 'ought' in the premises:** The disjunction includes the 'ought' as a starting point ("Or" trick).
      They *don't* derive a *substantive, new moral obligation* purely from non-moral facts. They manipulate language or definitions."

  6.  **Check at the End (5 mins)**
      *   **The Task:** Put this on the board:
          *   *P1:* This new drug significantly reduces suffering in patients with Disease X. *(Is)*
          *   *P2:* Reducing suffering is a primary goal of medicine. *(Is or Ought?)*
          *   *C:* Therefore, doctors *ought* to prescribe this drug for Disease X. *(Ought)*
      *   **The Question:** "Does this conclusion *logically follow* from P1 and P2 *alone*? Why or why not? If not, what's missing?"
      *   **Why it works:**
          *   **Slogan Answer:** "No 'ought' from 'is'!" (Superficially correct).
          *   **Right Answer:** "P2 *looks* like an 'is' (a description of medicine's goal), but it's actually a *disguised 'ought'* ('Medicine *ought* to prioritize reducing suffering'). If P2 is purely descriptive ("Historically, doctors *have aimed* to reduce suffering"), then the 'ought' conclusion doesn't follow – you'd need an explicit 'ought' premise ("Doctors *ought* to pursue the primary historical goals of medicine"). If P2 is normative, then the 'ought' is already present. The gap highlights the need to identify the *source* of the normativity."

  ---

  ### **What to Cut & How to Say It (2 mins)**
  *   **Metaethics Zoo (Non-cognitivism, Error Theory, Realism):** "We're focusing on Hume's core *logical* point about arguments, not the deep philosophical debates about *what morality itself is* or whether moral facts exist. That's a whole other seminar!" **(Say this when the "morality is subjective?" point comes up).**
  *   **Gap as Logic Theorem vs. Methodological Warning:** "Hume presented it as an observation about reasoning. Whether it's a strict *logical* theorem or a broader warning about justification is debated by philosophers. Today, we're treating it as a powerful rule of thumb for spotting weak arguments." **(Say this when stating the gap).**
  *   **Detailed History:** Mention Hume, but skip exegesis of the Treatise.
  *   **Attempts to Bridge the Gap (e.g., Foot, Searle):** "Philosophers have proposed ways to soften or bridge the gap (e.g., through 'thick' ethical concepts, institutional facts). These are fascinating but complex – for today, mastering the basic rule is key." **(Mention only if someone asks "Can it EVER be bridged?").**

  ---

  **Why this order works:** It builds from uncontroversial logic (valid arguments) to introducing the normative, isolates the gap with a clean example, addresses the most likely confusions head-on (especially the economists'), defuses the "smart-arse" tricks, and ends with a check that forces them to apply the concept, not just parrot it. By explicitly stating cuts, you preempt frustration and keep focus. Good luck!
