  | Component           | Credence | Key Justification                                  |
  |---------------------|----------|---------------------------------------------------|
  | **1. Descriptive**  | 0.80     | Replicated factor structure, item-level issues    |
  | **2. Non-tracking** | 0.65     | Coalitional > truth-tracking explanations         |
  | **3. Debunking**    | 0.55     | Metaethical fragility; no consensus               |
  | **4. Asymmetry**    | 0.40     | Liberal foundations also signal identity          |
  | **5. Taxonomy**     | 0.60     | Core divergence persists in rival models          |
  | **(D-weak)**        | 0.65     | Weak LR ≠1, but asymmetry & debunking uncertain   |
