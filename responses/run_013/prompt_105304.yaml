  The conlang example is tricky. I need to show how "unmarked" forms privilege certain groups, with options ranging from linguistic relativism to recognizing embedded power structures. For grammatical gender translation, the tension is between fidelity and adaptation - should we preserve source-text hierarchies or adjust for target-language sensitivities?

  I'm noticing some positions might overlap in practice. Semantic neutralists and craft-first folks could converge on prioritizing clarity over ideology, while pragmatic defaultists and language-skeptics might both downplay linguistic impact. The quiz design must tease these apart through careful answer combinations.

  Scoring requires identifying which patterns cluster together. For instance, consistently choosing options that challenge defaults likely indicates reformist or mirror-satirist leanings. The "no pronouns" view should emerge from answers rejecting gender marking altogether. I'll need to flag where distinctions blur - like between neutralists who believe language is inherently neutral and skeptics who think it simply doesn't matter.

