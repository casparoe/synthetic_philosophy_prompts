answer: |-
  Here’s the quiz designed to reveal underlying beliefs about language, gender, and bias through concrete examples, without relying on labels. It includes the ten requested cases, three answer options per question, a scoring key mapping to the specified positions, and analysis of limitations.

  **The Unmarked Defaults Quiz**

  **Instructions:** For each scenario below, choose the answer (A, B, or C) that best reflects your gut reaction or belief about the *language use* described. There are no right or wrong answers; this is about uncovering your implicit stance.

  1.  **Grammar Book Rule:** An old grammar book states: "The word 'man' embraces 'woman'; hence, sentences like 'All men are created equal' are correct and inclusive."
      *   A) This is simply descriptive of how English evolved; it reflects historical usage, not malice.
      *   B) This rule actively erases women linguistically and reinforces male-as-default thinking.
      *   C) The meaning is clear enough in context; arguing over it distracts from more important issues.

  2.  **Medical Professionals:** In a contemporary novel, every doctor is referred to with "he/him" pronouns, and every nurse with "she/her" pronouns.
      *   A) This is statistically probable shorthand; readers understand the roles quickly.
      *   B) This perpetuates harmful stereotypes and subtly tells readers who "belongs" in each role.
      *   C) The author should mix it up more for realism and to avoid predictable patterns, regardless of politics.

  3.  **Conlang Landowner Pronoun:** You're building a conlang (constructed language) where the default, unmarked pronoun (used for "a person," "someone," etc.) is specifically the pronoun also used for landowners. Non-landowners have distinct pronouns.
      *   A) This is a fascinating linguistic feature reflecting the society's power structure.
      *   B) This embeds privilege directly into the grammar, making bias invisible and systemic.
      *   C) As long as it's consistent within the worldbuilding, it's a valid artistic choice.

  4.  **Translating Grammatical Gender:** Translating a sentence from a language with grammatical gender (e.g., German "Lehrer" (masc) / "Lehrerin" (fem) for teacher). The original uses the masculine form generically for a mixed group.
      *   A) The translation should use "he" or "he or she" to accurately reflect the source language's structure.
      *   B) The translation should use "they" or rephrase to avoid gendered language in English.
      *   C) Choose the pronoun that flows best in English for the target audience; fidelity is less important than readability.

  5.  **Style Guide Ban:** A publishing house style guide strictly bans the singular "they" (e.g., "A writer must hone their craft"), insisting on "he or she" or recasting sentences.
      *   A) This upholds grammatical clarity and precision; singular "they" is confusing.
      *   B) This is pedantic and exclusionary, forcing awkward language or binary choices where "they" is natural and inclusive.
      *   C) Style guides exist for consistency; just follow the rule for this publisher, even if it's clunky.

  6.  **Unstated Character Gender:** A protagonist's gender is never explicitly stated or revealed via pronouns or strongly gendered terms. A reader says, "I just naturally pictured them as male the whole time."
      *   A) That's a common and understandable default assumption; it doesn't mean much.
      *   B) This reveals how deeply ingrained the male default is, even when the text gives no cue.
      *   C) The author failed if the reader made a strong assumption contrary to their intent; clarify the character.

  7.  **Satire Swapping Privilege:** A satirical article exposes sexist language patterns by meticulously substituting "race" for "gender" throughout (e.g., changing "fireman" to "fire-white," generic "he" to generic "white person").
      *   A) This analogy feels forced and offensive; race and gender dynamics aren't identical.
      *   B) This effectively highlights how absurd and exclusionary the original gendered defaults are.
      *   C) Satire is powerful, but this tactic might alienate the people who most need to see the point.

  8.  **Reader's Mental Image:** A reader of a story using "he" generically (e.g., "When a scientist makes a discovery, he must publish") comments, "I always pictured the scientist as a man."
      *   A) That's the point of using 'he' generically – it signals a masculine mental image efficiently.
      *   B) This proves the generic 'he' doesn't work; it fails to be truly generic and reinforces bias.
      *   C) Readers bring their own biases; the author can't control every mental image.

  9.  **"Changing Pronouns is Cosmetic":** A writer argues: "Fussing over pronouns is just surface-level. Real sexism lives in institutions, laws, and economic power, not grammar. Changing 'he' to 'they' doesn't fix pay gaps."
      *   A) Exactly; language reflects power, it doesn't create it. Focus energy on material change.
      *   B) Language shapes perception and reinforces power structures; changing it is a necessary *part* of the fight.
      *   C) Both matter, but arguing endlessly about words within the group wastes time better spent writing or acting.

  10. **Description Disparity:** In a scene, a female character is introduced primarily by her appearance ("the beautiful brunette"), while a male character in the same scene is introduced by his action and role ("the detective examining the scene").
      *   A) This might be a character choice or focalization; not inherently wrong if it serves the story.
      *   B) This is a classic, lazy trope that reduces women to their looks and men to their deeds.
      *   C) The author needs sharper description skills overall; both descriptions feel flat.

  ---

  **Scoring Key & Position Mapping**

  Tally how many times you chose A, B, and C. Then, see which **Position Descriptions** best match your *pattern* of answers. Most people will have a primary and secondary tendency. **Awkward Commitments** highlight a potential downside or challenge inherent to each view.

  1.  **Semantic Neutralist (Mostly A's):** Believes words themselves are neutral vessels; meaning and bias come solely from context and intent. *Awkward Commitment:* Must dismiss strong evidence that default word choices consistently shape perception and exclusion, even without "malicious" intent.
  2.  **Pragmatic Defaultist (Mix of A's & C's, esp. Q1,2,4,5,6,8):** Accepts common usage and defaults as practical tools for clarity and efficiency, prioritizing communication flow or established rules. Sees critique as often nitpicky. *Awkward Commitment:* Risks perpetuating the status quo and its embedded biases by prioritizing convenience or tradition over critical examination.
  3.  **Reformist (Mostly B's):** Believes current language conventions are often biased (especially male-default) and actively advocates for change (singular they, gender-neutral terms, avoiding stereotypes) to create a more inclusive language. *Awkward Commitment:* Can be accused of prioritizing linguistic policing over other forms of activism or seen as imposing new, awkward rules.
  4.  **Mirror-Satirist (Strong B on Q7, likely B's elsewhere):** Particularly convinced by tactics like Hofstadter's (or the race-swap satire). Believes exposing the default by swapping in another axis of privilege is the most powerful way to reveal its inherent absurdity and bias. *Awkward Commitment:* The satire might not land effectively with the intended audience or could be seen as trivializing the other axis of privilege used in the swap.
  5.  **Language-Skeptic (Strong C on Q9, Mix of A's/C's, esp. Q3,5,9):** Doubts the significant causal power of language change to address deep-seated social problems like sexism. Sees focus on pronouns/etc. as distracting from "real" institutional change or even counterproductive infighting. *Awkward Commitment:* Underestimates how language shapes thought, reinforces norms, and can *be* an institution itself, making material change harder.
  6.  **Craft-First (Mostly C's, esp. Q1,3,5,6,10):** Focuses primarily on clarity, flow, stylistic effectiveness, and consistency within the story world or authorial voice. Views ideological debates as secondary to strong writing technique and narrative coherence. *Awkward Commitment:* Might unintentionally replicate harmful tropes or exclude readers by not considering the broader impact of default choices, seeing it as "just craft."
  7.  **No-Gendered-Pronouns (Strong B on Q4 & Q8, likely B's on Q1,2,5,7):** Believes gendered pronouns in reference to people are inherently problematic and advocates for eliminating them entirely (using "they/them" universally, neopronouns, or name repetition). *Awkward Commitment:* Faces significant practical challenges in implementation within current English usage and potential resistance or misunderstanding from readers.

  ---

  **Limitations & Empty Chairs:**

  *   **Hard to Separate:**
      *   **Semantic Neutralist vs. Language-Skeptic:** Both downplay language's active role. Neutralists focus on word innocence, Skeptics on societal impact irrelevance. They might choose similar answers (A/C) but for slightly different reasons (word neutrality vs. societal change priority). Q9 might tease them apart (Skeptic strong C, Neutralist perhaps A or C).
      *   **Pragmatic Defaultist vs. Craft-First:** Both prioritize function over ideology. Defaultists lean on established norms for ease, Craft-First on artistic choices for effect. Patterns might overlap significantly (A/C mixes). The *emphasis* (tradition/convenience vs. narrative effectiveness) is the subtle difference.
      *   **Reformist vs. Mirror-Satirist:** Satirists are often a subset of Reformists who find the mirror tactic especially compelling. A strong B on Q7 paired with other B's signals Mirror-Satirist. Reformists might agree with the satire (B) but not see it as the *primary* tool. Consistent B's without specific zeal for Q7 is core Reformist.

  *   **Empty Chairs (Likely Unchosen/Incoherent Patterns):**
      *   **Strongly B *except* Q9 (C):** Believes language is deeply biased and needs reform *except* when it's dismissed as cosmetic? This seems incoherent. Reformists/Mirror-Satirists would likely pick B on Q9. Someone picking B everywhere *except* C on Q9 is probably a conflicted Reformist/Language-Skeptic hybrid, seeing language's power but doubting its priority.
      *   **Strongly C *except* Q7 (B):** Prioritizes craft/avoiding argument above all *except* strongly endorsing the potentially alienating satire tactic? Unlikely. Craft-First might appreciate the satire *as craft* (C) rather than endorse its political message (B).
      *   **Consistent Strong A + Strong B on Q10:** Believes words are neutral *and* that the description disparity is a harmful trope? Difficult to reconcile. A Neutralist would likely pick A or C on Q10. Someone picking A's generally but B on Q10 might be a Neutralist sensitive to *very* obvious tropes, but it's a tension.
      *   **No-Gendered-Pronouns + Strong A on Q4/Q5:** Advocates eliminating gendered pronouns but prefers translations that use "he" generically or supports banning singular "they"? Incoherent. The No-Gendered-Pronouns view necessitates B on Q4 and Q5.

  This quiz provides concrete examples to move beyond labels and reveal the underlying assumptions within your writers' group, fostering a more nuanced discussion based on revealed preferences rather than declared identities. Good luck!
