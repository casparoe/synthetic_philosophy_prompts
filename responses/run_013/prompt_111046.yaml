  We can spend more time on each auction and debrief.

  - Introduction: 5 min
  - Variant A: 10 min (4 min auction, 6 min debrief)
  - Variant B: 15 min (5 min for auction including envelope distribution, 10 min debrief)
  - Variant C: 15 min (5 min auction, 10 min debrief)
  - Overall debrief: 15 min
  - Wrap-up: 5 min

  Total: 5+10+15+15+15+5 = 65 minutes. Leaves 10 minutes buffer.

  Alternatively, we can do:

  - Introduction: 5 min
  - Variant A: 8 min (3 min auction, 5 min debrief)
  - Variant B: 12 min (3 min auction, 1 min for envelopes, 8 min debrief)
  - Variant C: 12 min (4 min auction, 8 min debrief)
  - Overall debrief: 15 min
  - Wrap-up: 3 min
  - Buffer: 10 min

  Total: 5+8+12+12+15+3 = 55, plus 10 buffer = 65.

  We'll go with the latter to be safe.

  **Materials List:**
  - Tokens: Not physical, but record keeping. Use a spreadsheet or paper to track each player's token balance per auction and total.
  - Envelopes for Variant B (24 envelopes: 8 with "Budget Ceiling: 100", 16 with "Budget Ceiling: 200").
  - Whiteboard and markers.
  - Timer.
  - Prizes for the raffle (one or more).
  - Raffle box.

  **Facilitator Script Outline:**

  Introduction:
    "Welcome to this methods workshop. We are going to run three short auction games. In each, you will start with 200 tokens. At the end of the three games, the tokens you have will be converted into raffle tickets for this prize [show prize]. So the more tokens you have, the higher your chance of winning. Remember, the goal is to maximize your tokens. We'll play three variants. I'll explain the rules before each. Let's start with the first one."

  Variant A:
    "First auction: I am auctioning a prize worth 100 tokens. The highest bidder wins the prize. Both the highest bidder and the second-highest bidder pay their bids. Bidding starts at 10 tokens, and each new bid must be at least 10 tokens higher than the current highest bid. You must have enough tokens to cover your bid. The auction will run for 3 minutes, but if there is no bid for 10 seconds, it ends early. You start with 200 tokens. Let's begin. First bid: 10. Who will bid 20?"

  Variant B:
    "Second auction: same rules as the first, but now each of you has a private budget ceiling. This is the maximum you can bid. You will receive an envelope with your ceiling. Do not reveal it to anyone. If the next bid required is above your ceiling, you are out and cannot bid again. Open your envelopes now. [Wait] Remember, do not reveal. We start at 10. Who bids 20?"

  Variant C:
    "Third auction: same as the first, but with an additional rule. Once the current high bid goes above 100, either of the two current leaders (the highest and second-highest) can call 'armistice'. If called, the auction stops immediately. No one gets the prize. Each of the two leaders pays half of their own current bid, and the one who called pays an extra 10 tokens. We start at 10. Who bids 20?"

  After each auction, record the payments and update token balances (privately, or have assistants). 

  **Final Note:**
  This design should work to illustrate the escalation of commitment trap. The key is in the debriefing to draw out the insights. Be candid about what the activity does and does not capture.

  Good luck with the workshop!
answer: |-
  Below is a fully specified design for your workshop, incorporating your constraints and objectives. The structure emphasizes experiential learning, with three variants that highlight different facets of escalation while maintaining simplicity. I've refined your proposals for clarity, incentive strength, and pedagogical impact, and addressed your concerns about realism, timing, and potential pitfalls.

  ---

  ### **Core Mechanics & Incentives**
  - **Tokens & Raffle**: Each participant starts with **200 tokens** per variant. Tokens convert 1:1 into raffle tickets for a **single tangible prize** (e.g., a $20–$30 book or gift card).  
    - **Why this works**: A single high-value prize (not split) ensures the raffle conversion bites. With 24 players, the expected value of tokens is clear: saving 100 tokens could double a player's odds vs. the median. If you suspect weak engagement, double the stakes (e.g., two prizes) or frame the prize as a "bonus" to academic pride (e.g., "Workshop MVP" certificate).  
  - **No Negative Balances**: Players cannot bid beyond their token count. Balances cap at 0.  
  - **Stakes Simplicity**: "You pay your bid if you're top two. The winner gets a 100-token prize. Bid in 10-token jumps."  

  ---

  ### **Variant A: Baseline (Escalation Trap)**  
  **Rules**  
  - Prize: 100 tokens to the highest bidder.  
  - Payments: **Both** highest and second-highest pay **full bids**.  
  - Bidding: Open outcry, minimum increment of 10 tokens. Start at 10.  
  - Time: 3-minute hard stop. If no new bid in **5 seconds**, pause and prompt once ("Going once?"), then end if no bid.  
  - Tokens: Players start with 200 tokens.  

  **Facilitator Script**  
  > "We start now. Prize is 100 tokens. Highest bidder wins it. **Both the top two bidders pay their bids.** Bids start at 10 tokens, in 10-token jumps. If you bid, you must cover it with tokens. Time: 3 minutes. Bid by raising your hand and stating your bid. I’ll acknowledge and update the board. Begin: 10 tokens. Who bids 20?"  

  **Materials**  
  - Whiteboard:  
    ```  
    Current high: [Bid] by [Player]  
    Second high: [Bid] by [Player]  
    Time remaining: [MM:SS]  
    ```  

  **Bidding Cadence**  
  - **Pace aggressively**: After a bid, immediately ask for "+10" (e.g., "70 now. 80? Do I see 80?"). Allow **jump bids** (e.g., "100!" skips 80–90).  
  - **Target escalation**: Bids should hit 100+ within 90 seconds. At 100–130, verbally note, "Prize value is 100. High is [X]."  

  **Clean Result**  
  - Bids exceed 100 (ideally 150+). Winner nets negative (e.g., wins 100 but paid 150 → net -50). Second-highest pays full bid (e.g., 140 → net -140).  

  **Handling Issues**  
  - **Collusion**: Public bids deter it. If suspected, state: "Bids are independent. No communication."  
  - **Non-bidders**: Natural outcome. Debrief: "Why did some avoid bidding?"  
  - **Wild bids**: Validate tokens ("Can you cover [bid]?"). If invalid, reject. If valid but irrational, allow it (reveals desperation).  
  - **Floor at 0**: Keep it. It mirrors real-world limited liability and **does not dampen escalation**—players still escalate to their limit.  

  ---

  ### **Variant B: Private Ceilings (Information Asymmetry)**  
  **Rules**  
  - Identical to Variant A, except:  
    - Each player draws a random **private budget ceiling**: 8 players get "Low (100)", 16 get "High (200)".  
    - Ceilings are secret. Players drop out if next bid exceeds their ceiling.  

  **Facilitator Script**  
  > "Same rules: 100-token prize, top two pay bids, 10-token jumps. **New twist:** Each has a private budget cap. If you can’t cover the next bid, you’re out. Caps are in envelopes—open now but **keep secret**. If your cap is exceeded, say ‘out’ and stop bidding. Start: 10 tokens. Who bids 20?"  

  **Materials**  
  - Envelopes: 8 labeled "Ceiling: 100 tokens", 16 labeled "Ceiling: 200 tokens".  
  - Whiteboard: Same as Variant A.  

  **Bidding Cadence**  
  - Same as A. After bids hit 100, expect dropouts (low-ceiling players exit). Escalation continues among high-ceiling players.  

  **Clean Result**  
  - Low-ceiling players drop by 100–110. Bids escalate to 150–200 among high-ceiling players. Group sees that **unknown ceilings** fueled escalation.  

  **Handling Issues**  
  - **Revealed ceilings**: If a player leaks, say: "Assume others may bluff. Play on."  
  - **Early dropout**: Natural. Debrief: "How did unknowns affect your bidding?"  

  ---

  ### **Variant C: Armistice (Coordination Failure)**  
  **Rules**  
  - Identical to Variant A, except:  
    - When bid >100, **either leader** (1st or 2nd) can call "Armistice."  
    - If called: Auction ends. Prize void. Leaders pay **half their current bids**. Caller pays **+10 penalty**.  
    - No mutual consent required (asymmetric incentives are the point).  

  **Your Arithmetic Check**  
  - At bids (110, 100):  
    - **Leader (110)**:  
      - Continue: If wins next bid (120), nets 100–120 = **-20**.  
      - Armistice: Pays 55 + 10 = **-65** → Prefers to continue.  
    - **Trailer (100)**:  
      - Continue: If outbid, pays 100 → **-100**.  
      - Armistice: Pays 50 → **-50** → Gains 50 by calling.  
  - Leader only prefers armistice when bids >200 (e.g., at 210: armistice = -115, winning nets ≤ -110).  

  **Facilitator Script**  
  > "Same rules: 100 prize, top two pay. **New twist:** When bid exceeds 100, either leader can call ‘Armistice’ to stop. If called, prize is canceled, both pay **half their bids**, caller pays a **10-token penalty**. Start: 10 tokens. Who bids 20?"  
  - **At first bid >100**: Announce, "Armistice is now available."  

  **Materials**  
  - Whiteboard: Same as A. Add "ARMISTICE ACTIVE" when bid >100.  

  **Bidding Cadence**  
  - Same as A. After 100, pause 1–2 seconds after each bid to allow calls.  

  **Clean Result**  
  - Trailing bidder calls armistice early (e.g., at 110/100). If not, bids escalate to 150+. Leader may resent caller.  

  **Handling Issues**  
  - **Armistice call**: Validate caller is top two. If not, ignore.  
  - **Mutual consent?**: Your asymmetric rule is sound. Mutual consent would stall coordination (e.g., leader refuses, fearing exploitation), which dilutes the lesson.  

  ---

  ### **Timing & Flow (75 Minutes Total)**  
  1. **Intro (5 min)**: Explain tokens, raffle, and rules. Emphasize: "Tokens = raffle tickets. Goal: Maximize tokens."  
  2. **Variant A (20 min)**: 3 min auction, 7 min debrief (see below).  
  3. **Variant B (20 min)**: 1 min to distribute envelopes, 3 min auction, 8 min debrief.  
  4. **Variant C (20 min)**: 3 min auction, 8 min debrief.  
  5. **Final Debrief (10 min)**: Synthesize themes.  

  ---

  ### **Debrief Structure**  
  **Goal**: Guide participants to self-identify escalation mechanics. Avoid jargon until they name concepts.  

  **Per-Variant Questions**  
  - **After A**:  
    - "How high did bids go? Why didn’t you stop earlier?"  
    - "Winner: How do you feel? Second-highest: How do you feel?"  
    - **Key Points**:  
      - Sunk costs vs. active traps: "That 100-token bid isn’t sunk—it’s a *pending loss* if you quit. Bidding more feels like avoiding it."  
      - Collective failure: "Neither player made a ‘mistake’ on the next bid, but both ended worse off."  
      - Loser’s burden: "Second-highest pays for nothing—winning becomes about minimizing losses."  

  - **After B**:  
    - "Did unknowns change behavior? What if ceilings were public?"  
    - **Key Points**:  
      - Backward induction collapse: "If all knew ceilings, you’d realize bidding war ends at 200. Would you even start? Private caps prevented this foresight."  

  - **After C**:  
    - "Was armistice called? By whom? How did leaders react?"  
    - **Key Points**:  
      - Settlement problem: "Armistice was mutually beneficial but required one to ‘lose face’ (and pay extra). It’s not generosity—it’s coordination under rivalry."  
      - Asymmetry: "Trailing bidder wanted out early; leader clung to hope until bids >200."  

  **Final Synthesis (10 min)**  
  - "What did all three share? What trap did you experience?"  
  - **Map to Escalation**:  
    - Structure > Rationality: "No one was ‘irrational’—each bid was locally optimal given the rules."  
    - Hidden information (B) and coordination (C) as escalation drivers.  
    - Sunk cost fallacy vs. rational escalation: "It’s not past costs trapping you—it’s the *threat of imminent loss* if you quit."  
  - **Concede Limitations**:  
    - "This captures the *structural trap* but not long-term drivers. Real-world escalation involves self-justification (‘I’ve invested too much to quit’), audience effects (‘my peers expect victory’), and slow burns. A 3-minute game can’t replicate that emotional gravity."  

  ---

  ### **Predictable Failures & Fixes**  
  1. **"Treat as a Joke" / Weak Incentives**  
     - **Risk**: Students bid randomly; no escalation.  
     - **Fix**: Boost raffle stakes (e.g., prize visible on desk). Start bidding fast ("10! 20! 30!") to set competitive tone. If apathy persists, cold-call: "[Name], will you bid 40?"  

  2. **Slow Clock / No Escalation**  
     - **Risk**: Bids stall below 100.  
     - **Fix**: Force pace: "50 now! 60 in 3 seconds or I end it... 60 to [player]! 70?" In Variant A, allow jump bids ("Anyone to 100?"). Start at 50 if needed.  

  3. **Facilitator Leaks Information**  
     - **Risk**: Reacting to bids (e.g., gasping at 150) hints at "irrationality."  
     - **Fix**: Use a timer app for audible 10-second intervals. Wear a poker face. Script all phrases (e.g., "Bid recorded. Next is [X].").  

  4. **Armistice Not Called (Variant C)**  
     - **Risk**: Trailing bidder hesitates (fear of penalty, hope to win).  
     - **Fix**: Remind at 110: "Armistice can be called by either leader." If not called, debrief: "Why didn’t the trailer call? Was avoiding the penalty worth risking -100?"  

  5. **Token Confusion**  
     - **Risk**: Players lose track of balances.  
     - **Fix**: Assign assistants to track tokens visibly (e.g., spreadsheet projected). Summarize after each variant: "Remaining tokens: Avg. 180, High 200, Low 50."  

  ---

  ### **Why This Design Works**  
  - **Pedagogy**: Participants *feel* escalation via competitive auctions. Variants contrast private info (B) vs. exit options (C).  
  - **Realism**: Auctions mirror real escalation (e.g., bidding wars, R&D races). Limited liability and raffle tickets preserve experimental control.  
  - **Pacing**: Three variants fit in 60 minutes; short debriefs reinforce lessons without lecturing.  

  **First Run Advice**: Expect chaos—e.g., someone bids 500 "for fun," ceilings leak, or armistice is ignored. Embrace it. Debrief honestly: "In trial runs, groups escalated higher/faster. Why did we differ?" This sparks reflection. The goal isn’t perfect data but sparking insight.  

  Adjust as needed, but this structure ensures they viscerally grasp escalation as a systemic trap, not a flaw in reasoning. Let me know if you need refinements!
