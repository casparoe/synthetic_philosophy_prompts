  The user presents their hypothesis: the two sides are answering different questions. Revisionists focus on individual permissions assuming knowledge of the war's injustice, while traditionalists consider the institutional rules given epistemic limitations. They also mention alternative diagnoses like liability vs. blameworthiness, normative disagreements, or empirical issues about soldiers' knowledge.

  First, I need to assess the user's main hypothesis. They suggest the dispute stems from conflating individual morality with institutional rules. Let me verify this against both positions. Revisionists like McMahan emphasize individual liability based on objective justice. If a soldier knows their cause is unjust, killing is morally impermissible. Traditionalists, however, argue that in practice, soldiers can't reliably know their cause's justice, so the rules must treat them equally to maintain order and prevent chaos. 

  The user points out that revisionists often concede the law shouldn't change, and traditionalists admit unjust combatants act wrongly but are excused. This supports the idea that they're operating on different levels: one deontological, the other pragmatic. So the user's hypothesis seems strong here.

  Next, the rival diagnosis about liability vs. blameworthiness. Traditionalists might say a conscript isn't blameworthy due to ignorance or coercion, but revisionists maintain they're still liable to be killed because they pose a threat. This distinction could explain why "equality" is ambiguous—equality in blame vs. liability. However, this might be a subset of the broader framework vs. individual morality divide the user proposed.

  Normative disagreements about grounds for killing (liability, necessity, convention) could be another angle. Revisionists root permissions in liability, while traditionalists might emphasize necessity or convention. But again, this ties into the institutional vs. individual split. The empirical question about soldiers' knowledge is crucial for traditionalists but less so for revisionists, who focus on objective morality.

  The user, being a historian, likely seeks the structural underpinnings of the debate rather than theoretical summaries. They want to understand why the discourse is stagnant. Progress might involve clarifying the question's scope—individual vs. institutional. Distinguishing liability from blame could help, but the core is separating the moral framework levels. Empirical research on soldiers' epistemic access might inform the traditionalist stance but doesn't resolve the revisionists' principled view. Ultimately, recognizing the debate's two-tiered nature could move discussions forward, accepting that both perspectives address valid but distinct concerns.
answer: |-
  You've diagnosed the impasse with remarkable clarity. Your hypothesis isn't just plausible; it's fundamentally correct, and it explains why the debate feels both intractable and strangely unsatisfying. The rival diagnoses you mention are important facets, but they operate *within* the larger structural split you identified. Here's the breakdown:

  1.  **Your Core Hypothesis is Spot-On: The Question is Different**
      *   **Revisionists:** Ask a **decontextualized, individual moral question**: "Given objective knowledge of the justice/injustice of the cause, what moral permissions and liabilities does an individual combatant have?" Their answer is stark: Unjust combatants have *no permission* to kill just combatants (who are innocent threats or defenders) and are *liable* to be killed by them. Just combatants have permission to kill unjust combatants (who are culpable threats) and are *not liable* to be killed by them. Moral equality is false. This is a question about fundamental morality.
      *   **Traditionalists:** Ask a **contextualized, institutional/practical question**: "Given the realities of war – pervasive uncertainty about the justice of the cause, the fog of war, political indoctrination, the necessity of coordinated action under authority, and the need for functional rules to limit harm – what *rules and conventions* should govern combatants *as participants in this institutional practice*?" Their answer is functional: To prevent chaos, excessive violence against surrendered enemies, and the complete breakdown of restraint, the rules *must* treat combatants symmetrically. This is a question about the morality *of the practice and its rules*, not the fundamental morality of individuals acting in isolation.

  2.  **How the Rival Diagnoses Fit In:**
      *   **Liability vs. Blame/Culpability:** This is a crucial *tool* used *within* the debate, especially by the revisionists, but it doesn't *explain* the impasse itself. The revisionist uses it to sharpen the individual moral claim: an unjust combatant can be *liable* (making killing them permissible) without being *culpable* (fully blameworthy) due to ignorance or duress. The traditionalist might *concede* this individual liability point in the abstract but argues that the *practical rules of war* cannot and should not hinge on adjudicating individual culpability or precise liability in the fog of war. The "equality" slide often happens when traditionalists defend the *functional symmetry of the rules* (which ignores liability/culpability distinctions for practical reasons) and revisionists attack the *individual moral symmetry* (which hinges precisely on liability).
      *   **Normative Disagreement (Grounds for Killing):** This is a *consequence* of the different questions. Revisionists, focusing on the individual level, naturally ground permission/liability in individualized judgments about *liability* (based on responsibility for an unjust threat). Traditionalists, focusing on the practice, ground permission in *convention* and *reciprocity* within the war convention, justified by *necessity* (the necessity of having *some* workable rules to limit the horror). They see liability as too unstable a foundation for battlefield rules.
      *   **Empirical Question (What Soldiers Know):** This is the **Achilles' Heel of the Traditionalist Position** *if* the debate is forced onto the revisionist's individual-morality turf. If soldiers *could* reliably know their cause was unjust, the traditionalist functional arguments weaken considerably. However, traditionalists rightly insist this is almost never the case. Revisionists often downplay this epistemic murkiness in their core argument, treating "unjust combatant" as a clear category. This empirical uncertainty is the *primary justification* the traditionalist offers for why the practical rules must diverge from the ideal individual morality. It's the bridge *between* the two questions, but it doesn't collapse the distinction.

  3.  **Verbal vs. Substantive:**
      *   **Substantive Core:** There is a deep, substantive disagreement about the *primary locus of moral concern* in war: Is it the fundamental moral relations between individuals, or the morally constrained structure of a horrific but deeply embedded social practice? This leads to different priorities: individual justice vs. systemic restraint and manageability.
      *   **Verbal/Conceptual Confusion:** The impasse *manifests* as verbal/conceptual confusion because both sides often talk past each other using the same terms ("permission," "liability," "equality") but implicitly referencing different frameworks (individual morality vs. institutional practice). The phrase "moral equality of combatants" is the prime culprit, being claimed by traditionalists as a *practical/conventional norm* and denied by revisionists as an *individual moral truth*. The "concessions" you noted (revisionists keeping the laws, traditionalists admitting wrongdoing) highlight this: Revisionists concede the *practical necessity* of symmetric laws *despite* individual moral asymmetry; Traditionalists concede an *abstract individual wrong* but defend the *practical justification/excuse* and the *functional norm* of symmetry.

  4.  **What Counts as Progress:**
      *   **Clarifying the Question:** The *most crucial* step is explicitly recognizing which question is being asked in any given point of the debate: "Are we discussing the fundamental individual morality, assuming knowledge?" or "Are we discussing the morally optimal rules for the practice, given epistemic and practical constraints?" Progress happens when participants explicitly frame their arguments within one domain or acknowledge when they are bridging to the other.
      *   **Embracing the Distinction:** Acknowledge that both questions are valid and necessary for a complete picture of the ethics of war. The goal isn't to make one "win," but to understand the *relationship* between ideal individual morality and the morally best possible institutional practice under non-ideal conditions. This means accepting that the best practical rules might *justifiably* diverge from the ideal individual morality.
      *   **Sharpening the Tools:** Distinguishing liability, culpability, blame, and excuse *within* each framework remains vital, but progress requires using these tools *after* clarifying the underlying question.
      *   **Empirical Work:** Rigorous research into soldiers' *actual* beliefs, sources of information, levels of indoctrination, and capacity for critical assessment *during* conflicts is invaluable. It strengthens the traditionalist case for the necessity of symmetric rules by grounding their epistemic pessimism, or forces them to refine it if soldiers are found to have more critical awareness than assumed. It doesn't resolve the core normative split but informs the practical side significantly.
      *   **"Bedrock"?** While the core normative priorities (individual justice vs. systemic function) might be fundamental, recognizing the distinction isn't hitting bedrock futility – it's finding the map that shows *why* the paths diverged. The debate isn't stuck on a single question with incompatible answers; it's stuck because the questions themselves are different. Recognizing that *is* progress.

  **Conclusion:** Your hypothesis is correct. The axis of the disagreement is **fundamental individual morality (assuming knowledge) vs. morally constrained institutional practice (assuming pervasive uncertainty and practical necessity)**. The rival diagnoses are important subsidiary arguments *within* these frameworks or attempts (often confused) to bridge them. The impasse persists because proponents often argue from one framework while their opponents' points resonate from the other. Progress lies not in declaring a winner, but in rigorously distinguishing the questions, acknowledging the validity and interplay of both perspectives, and focusing arguments on the appropriate domain. You've already grasped the essential structure – that *is* the key insight needed to move beyond the grinding repetition.
