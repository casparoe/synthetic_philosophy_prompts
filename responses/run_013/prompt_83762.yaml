prompt: |-
  I'm a backend engineer at a forty-person startup and through a series of bad luck I now own the little bot that tags our post-incident write-ups. The CTO wants every incident tagged either "individual slip" or "team failure", because the fix is different: an individual slip means coaching or a checklist for one person, a team failure means we change the process, the interface, or the on-call rota. I have to put the tag in within 24 hours of the incident call, and the incident lead can overrule me but has to write down why. It comes up maybe two or three times a month. Stakes are moderate — nobody dies, but people get pretty upset when the tag lands on them personally.

  My problem is that I can't actually tell when something was genuinly done together by a group, versus several people each doing their own thing that happened to combine into a mess. I've read bits of the philosophy on this — shared intentions, each person doing their bit, everyone knowing everyone else is in on it, that sort of thing — but I can't remember the names and half of it I don't understand. One of our PMs keeps calling anything where the whole team voted the same way a "group decision", which I'm fairly sure isn't the same thing at all.

  Can you turn the actual philosophy of joint action into a decision procedure I can run? I need the questions in order, what counts as a good enough answer to each, where it stops and says individual, where it stops and says joint, and where it has to hand the decision to a human because it's a values call rather than a fact. Then run it on three cases and tell me honestly where it'll misfire:

  1. Two engineers each independently edit the same shared config file on the same afternoon, neither knows the other is touching it, and together they take down checkout.
  2. An on-call team follows the written runbook exactly, everyone does their bit, and the runbook itself is wrong so the outage gets worse.
  3. I deploy to prod on a Friday without telling anyone and it breaks. I'd quite like the procedure to call this a team failure, since the company decided anyone can deploy to prod, but I suspect it won't.

  Keep it something an engineer with no philosophy background can actually run in fifteen minutes, and be upfront about the bits that are just me making a judgement call dressed up as a test.
reasoning: |-
  We are going to build a decision procedure based on philosophical theories of joint action, particularly drawing from Bratman, Gilbert, and others who discuss shared intentions, mutual obligations, and collective responsibility. The key elements we'll use are:

  1. **Shared Intention**: Are the individuals acting with a shared goal and awareness of each other's roles?
  2. **Mutual Obligation**: Did the individuals have a mutual commitment to the joint activity?
  3. **Common Knowledge**: Was it known to all that they were acting together?
  4. **Interdependence**: Were the actions of each dependent on the others?

  However, note that in an incident context, we are often dealing with failures that occur in the course of work, which might not be explicitly coordinated. We are trying to distinguish between:
  - **Individual Slip**: One or more individuals made errors independently, and the errors happened to coincide.
  - **Team Failure**: There was a collective activity (even if not perfectly coordinated) and the failure arose from the way the team acted together or from systemic issues.

  We'll design a flowchart with a series of questions. Each question must have clear criteria for "yes" or "no", and we'll stop as soon as we can assign a tag or hand off to a human.

  ### Decision Procedure

  1. **Was the incident caused by an action that was explicitly a coordinated group activity?**
     - **Yes**: Go to step 2.
     - **No**: Go to step 3.
     - *Example of coordinated group activity*: A planned deployment with multiple people having assigned roles, a team meeting where a decision was made, etc.

  2. **In the coordinated group activity, was there a shared plan to which all participants were committed?**
     - **Yes**: Then it's a team failure. (Because even if an individual made a mistake, the team was acting together and the system should have caught it.)
     - **No**: Go to step 3.

  3. **Did the incident result from the interaction of actions by multiple people?**
     - **No**: Then it's an individual slip (unless the action was taken in a team context, but we'll cover that in step 4). 
     - **Yes**: Go to step 4.

  4. **Were the actions of the individuals interdependent? (i.e., did one person's action rely on another's, or were they part of a common process?)**
     - **Yes**: Then go to step 5.
     - **No**: Then it's an individual slip (because it's just coincidental that multiple slips happened at once).

  5. **Was there a shared understanding among the individuals that they were participating in a common activity?**
     - **Yes**: Then it's a team failure.
     - **No**: Go to step 6.

  6. **Could the incident have been prevented by a reasonable team-level safeguard (e.g., a process, a tool, a communication channel)?**
     - **Yes**: Then it's a team failure (because the system failed to provide the safeguard).
     - **No**: Then it's an individual slip (because the individuals acted independently and the team had no reasonable way to prevent it).

  At any step, if the answer is ambiguous or requires a values judgment (e.g., what is a "reasonable safeguard"?), we hand it off to a human (the incident lead) with a note about the ambiguity.

  Now, let's run through the three cases:

  ### Case 1: Two engineers each independently edit the same shared config file on the same afternoon, neither knows the other is touching it, and together they take down checkout.

  1. **Explicitly coordinated?** No. (They didn't know about each other.) → Go to step 3.
  2. **Result of multiple people?** Yes. → Go to step 4.
  3. **Interdependent?** No. (Each was acting independently; neither relied on the other.) → **Individual slip**. (But note: the procedure stops here and says individual.)

  However, note that the company might have a system that allows this to happen (e.g., lack of locking, lack of communication). So in step 6, we might reconsider. But step 4 says no to interdependence, so we don't get to step 6. Therefore, the procedure calls it an individual slip.

  But wait: is there a team failure in the system design? The procedure above is focused on the actions, not the system. We have step 6 for that, but we only get to step 6 if we pass step 5 (which we didn't). So we might adjust the procedure to account for systemic factors earlier? Let's stick to the procedure as written.

  Alternatively, we might note that step 6 is a catch-all for when we don't have a clear joint action but the team could have prevented it. We didn't get to step 6 because step 4 said no. So the procedure would say "individual slip".

  But note: the CTO wants to fix the system for team failures. In this case, the fix is a system change (e.g., locking config files, better notification). So we might want to call it a team failure. However, the procedure as designed doesn't capture that because the actions weren't interdependent and there was no shared understanding.

  Therefore, we might adjust the procedure to include a step about systemic factors even in independent actions? But that would make almost everything a team failure. Alternatively, we can note that step 6 is only reached after step 5 (which requires step 4). So we don't get there.

  Alternatively, we can reframe step 4: Interdependence might be interpreted as the actions affecting the same system, thus being interdependent in effect? But that's not the philosophical definition. We'll stick to the original.

  So for case 1: **individual slip** by the procedure. But note: the incident lead might overrule because the system should have prevented two simultaneous edits.

  ### Case 2: An on-call team follows the written runbook exactly, everyone does their bit, and the runbook itself is wrong so the outage gets worse.

  1. **Explicitly coordinated?** Yes (they are following a runbook as a team). → Go to step 2.
  2. **Shared plan?** Yes (the runbook is the shared plan). → **Team failure**.

  This seems straightforward. The failure is in the runbook (a team artifact) and the team acted together.

  ### Case 3: I deploy to prod on a Friday without telling anyone and it breaks.

  1. **Explicitly coordinated?** No (I did it alone). → Go to step 3.
  2. **Result of multiple people?** No (only one person). → **Individual slip**.

  But note: the company policy allows anyone to deploy. So is the system at fault? We don't get to step 6 because step 3 says no (only one person). So the procedure says individual slip.

  However, if we argue that the policy (allowing Friday deployments without safeguards) is a team issue, then we might want to call it a team failure. The procedure doesn't capture that because it's focused on the actions that directly caused the incident.

  So the procedure as designed would call this an individual slip.

  ### Adjustments to the Procedure

  The current procedure might be too focused on the immediate actors and not enough on the system. We might add:

  After step 3 (if the answer to step 3 is "no", meaning only one person was directly involved), we can ask:

  **Could the incident have been prevented by a reasonable team-level safeguard?**
  - **Yes**: Team failure.
  - **No**: Individual slip.

  But note: this would make any individual slip that could have been prevented by a team safeguard a team failure. That might be what the CTO wants because then the fix is a team-level change.

  Alternatively, we can restructure the entire procedure to focus on the root cause:

  - If the root cause is an individual mistake that a reasonable team process could not have prevented → individual slip.
  - Otherwise → team failure.

  But that's too vague.

  Let's try a revised procedure that incorporates systemic factors more directly:

  ### Revised Decision Procedure

  1. **Was the incident caused by an action taken by a group acting together in a coordinated manner?**
     - **Yes**: Then go to step 2.
     - **No**: Then go to step 3.

  2. **In the coordinated activity, was there a shared plan?** (This includes following a runbook, a meeting, a deployment plan, etc.)
     - **Yes**: Team failure (because the group was acting jointly and the plan failed).
     - **No**: Go to step 3. (This is rare because coordination usually implies a plan.)

  3. **Did the incident result from the interaction of actions by multiple people?**
     - **Yes**: Go to step 4.
     - **No** (i.e., one person acting alone): Go to step 5.

  4. **Were the actions of the individuals interdependent?** (i.e., did they rely on each other or were they part of a common process?)
     - **Yes**: Go to step 6.
     - **No**: Go to step 5.

  5. **Could the incident have been prevented by a reasonable team-level safeguard?** (e.g., a process, a tool, a communication requirement, training)
     - **Yes**: Team failure.
     - **No**: Individual slip.

  6. **Was there a shared understanding that they were participating in a common activity?**
     - **Yes**: Team failure.
     - **No**: Go to step 5.

  Now, let's rerun the cases:

  ### Case 1 (two independent editors):
  1. Coordinated? No → step 3.
  2. Multiple people? Yes → step 4.
  3. Interdependent? No → step 5.
  4. Preventable by team safeguard? Yes (e.g., locking, notifications) → **Team failure**.

  ### Case 2 (wrong runbook):
  1. Coordinated? Yes → step 2.
  2. Shared plan? Yes → **Team failure**.

  ### Case 3 (solo Friday deploy):
  1. Coordinated? No → step 3.
  2. Multiple people? No → step 5.
  3. Preventable by team safeguard? Yes (e.g., blocking Friday deploys, requiring a second pair of eyes) → **Team failure**.

  This revised procedure now produces the desired outcome for case 3 and case 1, and still works for case 2.

  However, note that in case 3, the individual intentionally deployed on Friday without telling anyone. The procedure still calls it a team failure because it could have been prevented by a safeguard. This might be controversial because the individual was reckless. But the CTO's goal is to fix the system: if the system allowed it, then it's a team failure.

  Similarly, in case 1, the engineers were acting independently, but the system allowed two simultaneous edits without safeguards.

  ### Potential Misfires

  - **Over-classifying as team failure**: Almost any incident could be argued to be preventable by some team safeguard. We must be reasonable. Step 5 uses "reasonable" which is subjective. This is a judgment call and might require the incident lead to step in if there's disagreement.

  - **Under-classifying as individual slip**: If an individual makes a mistake in a context where no safeguard is reasonable (e.g., a completely novel situation), then it's individual. But what if the team should have trained for novel situations? Again, judgment.

  ### Final Procedure for the Engineer

  **Step 1:** Was the incident caused by a group acting together in a coordinated manner? (e.g., a planned deployment, a meeting, following a runbook as a team)
  - **Yes** → Go to Step 2.
  - **No** → Go to Step 3.

  **Step 2:** Was there a shared plan? (e.g., a runbook, a playbook, an agreed procedure)
  - **Yes** → **Team failure**.
  - **No** → Go to Step 3.

  **Step 3:** Did the incident involve actions by more than one person? (Note: if one person caused it but others failed to catch it, that's multiple people)
  - **Yes** → Go to Step 4.
  - **No** (one person acting alone) → Go to Step 5.

  **Step 4:** Were the actions interdependent? (i.e., did one person's action rely on another's, or were they part of a common process? e.g., if two people are following steps in the same procedure, or if one person's output is another's input)
  - **Yes** → Go to Step 6.
  - **No** → Go to Step 5.

  **Step 5:** Could a reasonable team-level safeguard have prevented the incident? (e.g., a checklist, a tool that blocks bad actions, a required review step, better training, a policy change)
  - **Yes** → **Team failure**.
  - **No** → **Individual slip**.

  **Step 6:** Was there a shared understanding among the involved individuals that they were participating in a common activity? (e.g., they knew they were on the same on-call shift and expected to work together, or they were in a chat room discussing the incident)
  - **Yes** → **Team failure**.
  - **No** → Go to Step 5.

  ### When to hand off to a human

  - If at any step the answer is unclear or there is disagreement about the facts, hand off to the incident lead with a note about the ambiguity.
  - Step 5 is particularly subjective ("reasonable safeguard"). If you're unsure, hand it off.

  This procedure should be runnable in 15 minutes. The key is to focus on the facts of the incident and not get bogged down in philosophical nuances. The goal is pragmatic: to drive the right kind of fix.

  Now, honestly: 
  - Case 1: Team failure (via step 5).
  - Case 2: Team failure (via step 2).
  - Case 3: Team failure (via step 5).

  But note that in case 3, if the company policy is "anyone can deploy on Friday without safeguards", then step 5 might be "no" if you consider that no reasonable safeguard was missing (because the policy intentionally allows it). But then it would be an individual slip. However, if the incident shows that the policy is flawed, then step 5 is "yes". So it's a judgment call.

  In practice, if you (the engineer) feel that a safeguard should exist, you can mark it as team failure and let the incident lead overrule if they think the policy is fine as is.

  This procedure is more likely to classify incidents as team failures, which might be what the CTO wants because it drives systemic fixes. But it might also lead to individuals feeling less accountable. However, the incident lead can overrule.
answer: |-
  Here's a decision procedure based on philosophical frameworks of joint action (primarily drawing on Michael Bratman's *shared cooperative activity* and Margaret Gilbert's *joint commitment*), simplified for an engineer to run in 15 minutes. I'll give you the procedure first, then apply it to your cases, and finally highlight where it might misfire.

  ---

  ### **Decision Procedure: "Individual Slip" vs. "Team Failure"**
  **Core Idea**: A "team failure" requires **shared agency**—not just multiple people, but coordinated action toward a common goal. If actions are uncoordinated (even if concurrent), it leans individual. Systemic flaws (e.g., bad process) push toward team failure.  
  **Timebox**: Answer these questions in order. Stop at the first definitive tag. If stuck at a judgment call, escalate to the incident lead.

  1. **Was there a *pre-agreed plan* involving multiple people?**  
     - *Example*: A runbook, deployment checklist, or incident response protocol.  
     - **Yes** → Tag as **team failure** (the team owns the plan, even if individuals executed it).  
     - **No** → Go to Q2.  

  2. **Did the people involved *knowingly interact* to achieve a shared goal?**  
     - *Key tests*:  
       - Did they communicate during the action? (e.g., Slack, meeting)  
       - Did they rely on each other’s roles? (e.g., "Alice handled X so I could do Y")  
       - Did they share real-time awareness of the joint activity?  
     - **Yes** → Tag as **team failure** (this meets Bratman’s "shared cooperative activity").  
     - **No** → Go to Q3.  

  3. **Could a *reasonable systemic safeguard* have prevented the incident?**  
     - *Examples*:  
       - Automated checks (e.g., CI/CD gates).  
       - Process rules (e.g., "no Friday deploys").  
       - Communication tools (e.g., deployment calendar).  
     - **Yes** → Tag as **team failure** (the system failed, not just individuals).  
     - **No** → Tag as **individual slip** (genuine human error with no systemic fix).  

  **Where to escalate**:  
  - Q2 if "shared awareness" is ambiguous (e.g., vague communication).  
  - Q3 if "reasonable safeguard" is debatable (e.g., "Should we have anticipated this?").  

  ---

  ### **Applied to Your Cases**
  #### **Case 1: Two engineers independently edit a shared config file**  
  - **Q1**: No pre-agreed plan (no coordination). → **Q2**.  
  - **Q2**: No interaction/awareness (neither knew the other was editing). → **Q3**.  
  - **Q3**: **Yes**—a safeguard could exist (e.g., file-locking, change alerts). → **Team failure**.  
  *Why?* The system allowed uncoordinated edits. Fix: tooling/process change.  

  #### **Case 2: Team follows a wrong runbook**  
  - **Q1**: **Yes**—explicit pre-agreed plan (the runbook). → **Team failure**.  
  *Why?* The team collectively relied on a flawed artifact. Fix: update the runbook.  

  #### **Case 3: You deploy solo on Friday, break prod**  
  - **Q1**: No plan (you acted alone). → **Q2**.  
  - **Q2**: No interaction (no one else involved). → **Q3**.  
  - **Q3**: **Yes**—a safeguard could exist (e.g., Friday deploy block, peer review). → **Team failure**.  
  *Why?* The system enabled unsupervised action. Fix: policy/tooling change.  
  *(You got your wish! But note: this assumes safeguards are "reasonable." If the CTO insists on unrestricted deploys, the incident lead may overrule.)*  

  ---

  ### **Where It Misfires (and Why)**
  1. **Case 1 (Config edits)**:  
     - **Misfire risk**: Philosophy purists might argue this is *not* joint action (no shared intention).  
     - **Why we overruled**: Q3 focuses on *systemic fixes*. Pragmatically, the company needs to prevent uncoordinated edits, so tagging "team failure" drives that.  
     - **Edge**: If the file was obscure/no prior incidents, Q3 could be "no safeguard needed" → "individual slip." Judgment call!  

  2. **Case 2 (Wrong runbook)**:  
     - **Misfire risk**: If the runbook was sabotaged by one person, it *should* be an individual slip. But the procedure assumes good faith.  
     - **Mitigation**: Incident lead can overrule if malice/individual negligence is found.  

  3. **Case 3 (Solo Friday deploy)**:  
     - **Misfire risk**: If your company culture glorifies "move fast," Q3 ("reasonable safeguard") becomes subjective. An incident lead might call this "individual slip" to assign accountability.  
     - **Reality check**: Engineers might game this—claiming "the system failed me" to avoid blame.  

  ---

  ### **Practical Notes**  
  - **What’s dressed-up judgment?**:  
    - Q2 ("knowingly interact") relies on *your interpretation* of logs/Slack. Bias risk!  
    - Q3 ("reasonable safeguard") is values-driven. If your CTO thinks "process = overhead," they’ll overrule team failures.  
  - **Time saver**: Focus on artifacts (runbooks, PRs, alerts) over intent. They’re easier to audit.  
  - **Philosophy cheat sheet**:  
    - **Bratman**: Joint action = shared goal + commitment to mutual support.  
    - **Gilbert**: Joint commitment = mutual agreement to act as a body.  
    - **Not relevant**: Group decisions (e.g., voting)—that’s about democracy, not coordination.  

  This balances philosophy with startup pragmatism. When in doubt, ask: *"Will the fix require changing one person’s habits (individual) or a system/process (team)?"* Tag accordingly and let the incident lead argue.
