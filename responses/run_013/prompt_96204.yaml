prompt: |-
  Not sure this is the sort of thing you take questions on, but here goes. I retired a few years back from field biology — I spent most of my working life doing population surveys of beetles across dry savanna, which is about as far from moral philosophy as you can get — and since then I've been sitting in on a seminar on transitional justice run by a couple of law people and a historian at the local university. Every few weeks we do a moot amnesty hearing: one of us plays the amnesty board of an invented commission (we model it loosely on real ones but change every name and detail), and we're handed the board's past rulings plus a fresh case, and we have to decide the fresh case the way that board would, using only its own record. This week it's my turn and I'm stuck, so I'm taking a shortcut and asking you.

  Here's the board's record as we've got it. A teenage conscript who beat detainees at a checkpoint, testified fully and named his sergeant: amnesty granted. A captain who ran a small prison and ordered the beatings, testified fully and named his colonel and the minister above him — the victims' families objected and the board granted it anyway. An interior minister who signed the detention decrees, testified but refused to name the council members who directed him, and kept invoking state necessity: denied and referred for prosecution. A colonel who ordered a village massacre, then destroyed the records and gave shifting, evasive testimony: denied. A military doctor who falsified the death certificates of prisoners who died under torture, testified fully and named his commander: granted. Now the case I actually have to decide. A woman who was a mid-ranking intelligence officer in charge of an interrogation unit where torture was routine. She has testified fully and — this is the odd part — she named not only her own chain of command but the foreign intelligence service that was paying and directing her unit. Two things muddy it, though: while she was running the unit she also pocketed money and jewelry taken off detainees, so some of what she did looks like ordinary theft dressed up as political work; and several of the victims' families have announced they'll refuse any amnesty for her.

  I suspect the board is running one of a few different rules and I definately can't tell which. What would it do with her, and why — and more than the verdict, which rule do you think it's really been following, what are the other rules its past rulings fit just as well, and what single new case would tell those rules apart? I keep flip-flopping between "she told them everything, so she gets amnesty like the conscript and the captain" and "she ran the unit and she was lining her own pockets, so she goes the way of the minister and the colonel."
reasoning: |-
  Okay, let's tackle this user's problem. They're a retired field biologist now participating in a seminar on transitional justice. They're stuck on a moot amnesty hearing case and need help figuring out the board's underlying rule based on past rulings. 

  First, I need to understand the board's precedents. There are five prior cases: a conscript, a captain, an interior minister, a colonel, and a military doctor. The key factors seem to be rank, testimony quality, naming superiors, and personal gain. The conscript and captain both got amnesty despite their roles because they testified fully and named names. The minister was denied for refusing to name others, and the colonel was denied for evasive testimony and destroying evidence. The doctor got amnesty even though he falsified death certificates because he testified fully.

  Now the current case: a mid-ranking intelligence officer who ran a torture unit. She testified fully and named her chain of command plus a foreign intelligence service. But she also stole money and jewelry from detainees, which adds a personal gain element. Victim families oppose her amnesty.

  The user is torn between two interpretations: full testimony should grant amnesty versus her role and theft should deny it. I need to identify possible rules the board follows and find which fits best.

  Looking at the precedents, the consistent factor for amnesty seems to be full cooperation—truthful testimony and naming superiors. Denials happened when there was evasion, refusal to name others, or evidence destruction. Personal gain wasn't a factor in past cases. The captain ordered beatings but still got amnesty, suggesting the board prioritizes information over the act's severity. The minister's refusal to name others led to denial, emphasizing the need for full disclosure.

  The intelligence officer's theft complicates things. But since the board didn't consider personal gain before (like the captain who might have benefited but wasn't mentioned), maybe it's irrelevant. Her full testimony and naming foreign involvement likely meet the board's criteria. The victims' families' opposition didn't stop the captain's amnesty, so that might not be decisive.

  The user might worry that theft makes her actions non-political, but the board's focus seems on cooperation, not the nature of the acts. To confirm which rule applies, a test case could be someone who fully cooperates but had significant personal gain. If amnesty is denied, then personal gain matters; if granted, cooperation is key.

  So, the board's rule is likely about full disclosure for amnesty, regardless of rank or personal motives. The officer should get amnesty. The user's deeper need is understanding how to derive consistent principles from precedents, which is crucial in legal contexts. They might also want to grasp how transitional justice balances truth-telling against accountability, especially when personal crimes intersect with political acts.
answer: |-
  Based on the board's record, I believe the board would **grant amnesty** to the mid-ranking intelligence officer. Here's the breakdown, including the likely rule, alternative interpretations, and a test case:

  **The Board's Likely Rule:**
  The board prioritizes **instrumental truth-recovery for systemic accountability** above all else. Amnesty is granted *if and only if* the applicant provides **full, credible testimony revealing the chain of command and operational context of politically motivated violations**, regardless of rank or the specific acts committed (within the scope of the conflict). Denial occurs when testimony is evasive, incomplete, or fails to advance the commission's understanding of the systemic structure.

  **Applied to the Current Case:**
  1.  **Full Testimony & Naming:** She testified fully and named *both* her domestic chain of command *and* the critical external actor (the foreign intelligence service). This is the *strongest* disclosure in the record, likely revealing new systemic dimensions.
  2.  **The Theft Issue:** While morally repugnant and suggesting mixed motives, the board's precedent (Captain, Doctor) shows they separate the *political act* (torture, running the unit) from *personal corruption* when assessing amnesty *eligibility*. The political act qualified for amnesty (as per the Act); the theft is a separate crime, irrelevant to the amnesty criteria based on past grants. The board likely views it as "opportunism within the political crime," not negating the political nature of the unit's core function.
  3.  **Victims' Families' Opposition:** The board explicitly overruled this in the Captain's case. It's not a determining factor.
  4.  **Rank:** Mid-ranking (like the Captain and Doctor who were granted) falls within the range where amnesty is possible with full cooperation. Higher ranks (Minister) are denied only for *non-cooperation*, not rank alone.

  **Alternative Rules (and Why They Don't Fit as Well):**

  1.  **"Full Cooperation Mitigates Culpability" (Focus on Individual Remorse/Rank):**
      *   **Fit:** Explains grants for Conscript (lowest rank, coercion implied) and Captain/Doctor (cooperation). Explains denial for Minister (non-cooperation) and Colonel (non-cooperation/obstruction).
      *   **Failure:** Doesn't explain why the *Captain* (who ordered beatings) was granted despite higher culpability than the Conscript, while the *Minister* (arguably less direct, but higher rank) was denied solely for non-cooperation. The Doctor's falsification was direct harm, yet granted. The rule here is fundamentally about *information provision*, not mitigating individual guilt based on rank or role per se. The Colonel's denial was due to obstruction, not his rank/role alone.

  2.  **"Amnesty Only for Following Orders / Lower Ranks":**
      *   **Fit:** Explains Conscript grant. *Seems* to explain Minister/Colonel denials (higher ranks).
      *   **Failure:** Utterly fails to explain the grants for the *Captain* (who gave orders) and the *Doctor* (who actively falsified records). The Captain explicitly "ordered the beatings."

  3.  **"Political Motive Must Be Pure":**
      *   **Fit:** *Might* explain denying the intelligence officer due to the theft ("dressed up as political work").
      *   **Failure:** Contradicted by the *Captain* and *Doctor*. The Captain ran a prison where beatings were ordered – was his motive pure? The Doctor falsified death certificates – pure motive? The board granted them based on *cooperation*, not assessing the purity of their political motives during the acts. The Minister was denied for non-cooperation, not because "state necessity" was an impure motive.

  **Why the "Full Cooperation for Systemic Truth" Rule Fits Best:**
  *   **Conscript:** Named superior (provided systemic link).
  *   **Captain:** Named superiors *above him* (provided crucial systemic links upward), despite objections.
  *   **Minister:** **Refused** to name superiors (withheld systemic links).
  *   **Colonel:** Destroyed records, evasive testimony (actively obscured systemic truth).
  *   **Doctor:** Named commander (provided systemic link).
  *   **Intelligence Officer:** Named chain of command *and* critical external actor (provided the *most* significant systemic links).

  The consistent thread is the *exchange*: amnesty is the *quid pro quo* for information that maps the system. Personal gain, victim opposition, and even the specific horror of the acts (beating vs. massacre vs. falsifying death) are secondary to this core function. The theft in the current case is personally criminal but doesn't negate the political nature of the unit's core function *for which amnesty is sought*, nor does it prevent her from revealing the system.

  **The Test Case to Distinguish the Rules:**

  Present a case involving a **low-level perpetrator (like a guard) who committed a politically motivated act (e.g., beating a detainee) *and* simultaneously committed a purely criminal act for personal gain during the same incident (e.g., stole the detainee's wallet), but who testifies fully and names their superior.**

  *   **Under "Full Cooperation for Systemic Truth" Rule:** Amnesty is **granted**. The theft is irrelevant to the amnesty criteria for the political act; the testimony provides the required systemic link.
  *   **Under "Full Cooperation Mitigates Culpability":** Amnesty is **likely granted**, but the rule is fuzzier on mixed motives. The emphasis is still on cooperation mitigating the *political* crime.
  *   **Under "Amnesty Only for Following Orders / Lower Ranks":** Amnesty is **granted** (fits the low rank).
  *   **Under "Political Motive Must Be Pure":** Amnesty is **denied**. The personal theft contaminates the political motive.

  **This test case directly probes the board's tolerance for personal gain/criminality intertwined with political acts when full cooperation is provided.** The current board's record strongly suggests they would grant it (as per "Systemic Truth" or "Mitigates Culpability"), rejecting the "Pure Motive" rule. The denial of the intelligence officer under the "Pure Motive" rule would be an outlier compared to the Captain and Doctor grants.

  **Conclusion for Your Case:** Grant amnesty. The board prioritizes the revelation of the systemic truth – especially the explosive revelation of foreign involvement – over the morally reprehensible but legally separate issue of personal theft. Her testimony fulfills the core requirement established by the grants to the Conscript, Captain, and Doctor: full disclosure of the chain of command and operational context for politically motivated acts. The victims' families' objections and the self-enrichment, while significant, do not appear to be disqualifying factors based on the board's consistent precedent of valuing information above all else.
