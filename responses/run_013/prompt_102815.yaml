prompt: |-
  I teach an upper-level seminar, cross-listed between the law faculty and the philosophy department, on rules that govern their own revision — the kind of self-amending machinery you meet in the game Nomic, in constitutional entrenchment clauses, and in the literature on paradoxes of legal self-reference. For the take-home final I want one essay question that a student cannot answer by reciting the familiar "paradox of self-amendment" (the stock observation that a rule authorising its own amendment seems to pull itself up by its own bootstraps), and cannot answer by listing the names of the usual positions. I want them to work through a concrete code, to tell a merely intricate conflict of provisions apart from a genuine self-referential loop, and to commit to a verdict. Please build the question around the following invented code, which I will reproduce on the exam paper as an appendix; do not ask students for any citations, reading, or external authorities — they sit the exam closed-book with nothing to consult.

  The Code of the Lodestar Association:
  - Article 1. The Code may be amended only by a resolution passed at a general meeting of the Association.
  - Article 2. A resolution that amends the Code requires the affirmative vote of two-thirds of the members present and voting.
  - Article 3. Article 2 may be amended or repealed only by the affirmative vote of three-quarters of the members present and voting; and this Article 3 may be amended or repealed only by the unanimous vote of all the members of the Association.
  - Article 4. The vote required for the adoption of a resolution is the vote required by the Code as it stood at the opening of the meeting at which the resolution is put.
  - Article 5. Where two provisions of the Code conflict, the provision that addresses the matter more specifically prevails; where neither is more specific, the provision adopted later prevails.
  - Article 6. A resolution is void if its operative effect includes lowering the vote required for its own adoption; and no resolution is valid by virtue of a provision that the resolution itself enacts.

  At a general meeting the following resolution is moved: "Article 3 is repealed; Article 2 is amended so that amendment of the Code requires only a simple majority of the members present and voting; Article 6 is repealed; and this resolution takes effect immediately upon its adoption." Seventy per cent of the members present and voting vote in favour; the remainder vote against; no one abstains. The question should ask whether the resolution is valid, and should require the student to state what vote the resolution in fact required and why, to say whether a resolution of this kind can be valid in part or only as a whole, to work out how Articles 3, 4, 5 and 6 interact, and — the part I care about most — to decide whether the Code contains a genuine paradox of self-reference or only an unresolved conflict, and to identify the smallest single amendment that would dissolve whatever puzzle remains.

  Deliver your response in exactly these three named sections, in this order. (1) "The question": the exam question precisely as the students will read it, 120–180 words, fully self-contained, naming the appendix code and the facts of the vote. (2) "Model answer": about 800 words, written in the voice of an outstanding candidate who reaches a definite verdict rather than surveying options, and who shows where the "it's a paradox" reflex is too quick and where a real loop does or does not arise. (3) "Marking scheme": six must-hit points worth a total of 20 marks, each with its mark value and a one-line note naming the specific error that should cost a candidate that point.
reasoning: |-
  Hmm, the user is designing an exam question for an upper-level seminar on self-amending rules, crossing law and philosophy. They want a concrete question based on an invented code that tests deep understanding beyond textbook paradoxes. The key challenge is to distinguish genuine self-reference from mere conflicts.

  The user's unspoken needs seem to be: ensuring students can't default to superficial "paradox" claims, forcing engagement with layered provisions (Articles 3-6), and requiring commitment to one solution. They also want the question to test part-whole validity analysis and practical amendment skills.

  The Lodestar Code's trickiest aspects are:
  - Article 3's dual entrenchment (3/4 for Art2 repeal, unanimity for Art3 repeal)
  - Article 4's temporal fixity (rules at meeting opening govern)
  - Article 6's anti-bootstrapping rule (no self-lowering votes)
  - Article 5's conflict rules

  The proposed resolution attempts to tear down all safeguards: repealing Art3/Art6 while lowering Art2's threshold. With 70% approval, it sits between Art2's 2/3 (66.6%) and Art3's 3/4 (75%) requirements.

  For the model answer, I'll structure it to:
  1. Calculate required votes under Art4 (Art2's 2/3 at meeting start)
  2. Analyze validity holistically due to interconnected changes
  3. Dissect the Art6 violation (self-lowering via Art2 amendment)
  4. Show why Art3 repeal fails (unanimity not met)
  5. Distinguish conflict (Art5) from true paradox (no self-enabling loop exists)
  6. Propose minimal fix (e.g., delete Art6's second clause)

  The marking scheme must penalize:
  - Missing vote calculation
  - Part-validity assumptions
  - Overlooking Art6's bootstrapping
  - Misapplying Art3's unanimity
  - Confusing conflict with paradox
  - Omitting amendment proposal

  The question wording must force concrete engagement: "state required vote", "assess entire resolution", "specify smallest amendment". No wriggle room for "it's complicated" answers.
answer: |-
  ### (1) The Question  
  **Exam Question: Validity of Resolution LS-01**  
  The Lodestar Association’s Code (Appendix) governs its amendment. At a general meeting, Resolution LS-01 is moved: "Article 3 is repealed; Article 2 is amended to require only a simple majority for Code amendments; Article 6 is repealed; and this resolution takes effect immediately upon adoption." Seventy percent (70%) of members present and voting approve it; no abstentions occur.  

  1.  **State and justify** the vote percentage LS-01 required for validity under the Code.  
  2.  **Determine** whether LS-01 is valid *in whole or in part*. Explain why partial validity is or is not possible.  
  3.  **Analyze** how Articles 3, 4, 5, and 6 interact in this scenario. Does Article 6’s anti-self-amendment rule create a genuine *self-referential paradox* (e.g., bootstrapping), or is this merely an *unresolved conflict* between provisions? Justify your verdict.  
  4.  **Propose** the smallest *single amendment* to the Code (specify wording) that would resolve any indeterminacy or paradox you identify.  

  *(Base answers solely on the Code and facts above; no external sources.)*  

  ---

  ### (2) Model Answer  
  **1. Required Vote for LS-01**  
  Resolution LS-01 required a **two-thirds (≈66.7%) majority** of members present and voting. Article 4 mandates that the vote threshold is fixed at the meeting’s opening. At that time, Article 2 (requiring 2/3) governed *general* amendments. While LS-01 attempts to repeal Article 3 (which protects Article 2), Article 3 itself stipulates that *its* repeal demands unanimity (100%). However, Article 4’s temporal rule means we assess the *amendment mechanism* as it existed when the meeting began—before LS-01’s potential changes. Thus, Article 2’s 2/3 rule applies. Seventy percent exceeds this, satisfying the threshold *procedurally*.  

  **2. Validity In Whole or Part?**  
  LS-01 is **wholly invalid**. It cannot be valid in part because its components are interdependent and self-referential. The resolution: (a) repeals Article 3 (which shields Article 2), (b) amends Article 2 to lower its threshold, and (c) repeals Article 6 (which voids self-lowering amendments). Each change enables the others: repealing Article 6 "clears the path" for the Article 2 amendment, while amending Article 2 retroactively justifies the lower vote for the whole resolution. These acts are a single, circular scheme. Article 6 explicitly voids resolutions whose "operative effect" includes self-lowering votes, which LS-01 attempts via (b) and (c). Accepting *any* part would trigger the bootstrapping Article 6 forbids.  

  **3. Interaction of Articles 3, 4, 5, 6 & Paradox vs. Conflict**  
  - **Article 4** fixes the voting rule at the meeting’s start (Article 2’s 2/3).  
  - **Article 3** entrenches itself (unanimity) and Article 2 (3/4). LS-01’s repeal of Article 3 fails because 70% < 100%.  
  - **Article 6** invalidates LS-01 entirely because its amendment to Article 2 *lowers the vote required for its own adoption* (from 2/3 to a majority). Article 6 also nullifies any validity drawn from rules LS-01 *itself* enacts (e.g., it cannot use the new simple-majority rule to self-validate).  
  - **Article 5** (conflict resolution) is **irrelevant** here. No "conflict" exists between independent provisions; instead, LS-01 creates a *self-referential loop*: it tries to destroy the rules governing its own validity.  

  This is **not a genuine paradox** but an **unresolved conflict** engineered by LS-01’s overreach. A paradox would arise if the Code *required* an impossible self-application (e.g., "This sentence is false"). Here, Articles 3 and 6 *prohibit* LS-01’s self-subversion, creating no logical inconsistency—only a factual one (the resolution’s failure). The loop is broken by Article 6’s external invalidation rule, which decisively voids LS-01. The "paradox" reflex mistakes Article 6’s *preemptive block* for an inescapable contradiction.  

  **4. Smallest Amendment to Dissolve the Puzzle**  
  Amend **Article 6** by deleting its second clause:  
  > *"and no resolution is valid by virtue of a provision that the resolution itself enacts."*  

  This targets the core issue: LS-01’s reliance on self-enacted rules to validate its lower threshold. Removing this clause would preserve Article 6’s ban on *direct* self-lowering (first clause) while allowing amendments to succeed if they comply with *preexisting* voting rules (per Article 4). This eliminates the self-referential "bootstrapping" risk without creating new conflicts.  

  ---

  ### (3) Marking Scheme  
  *(Total: 20 marks. Award partial marks for partial answers.)*  

  1.  **Correct vote % + justification (Art. 4 + Art. 2)** (4 marks)  
      *Error: Wrong threshold or fails to cite Art. 4’s temporal rule.*  
  2.  **Verdict on partial validity + interdependency reasoning** (3 marks)  
      *Error: Asserts partial validity without addressing circularity.*  
  3.  **Art. 6’s application to void LS-01 (self-lowering effect)** (4 marks)  
      *Error: Overlooks Art. 6’s first clause banning self-lowering.*  
  4.  **Art. 3 repeal failure (unanimity not met)** (2 marks)  
      *Error: Claims Art. 3 repeal succeeds despite 70% < 100% requirement.*  
  5. **Distinguishes conflict (Art. 5 irrelevant) vs. self-reference (Art. 6’s block)** (4 marks)  
      *Error: Calls it a "paradox" or invokes Art. 5 unnecessarily.*  
  6. **Viable single amendment targeting Art. 6’s self-enactment clause** (3 marks)  
      *Error: Proposes irrelevant/multi-part edits or misses Art. 6’s second clause.*
