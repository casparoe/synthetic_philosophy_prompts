  We are designing an in-class activity to teach the concept of updating on uncertain evidence (Jeffrey conditionalization) without initially revealing the formal method. The setup involves a hidden jar that is either mostly red (70 red, 30 blue) or mostly blue (30 red, 70 blue), with a prior of 50% for each. A student (the "looker") draws a bead and views it through a frosted tube, making them about 70% sure the bead is red. The goal is for all students (including the looker) to update their credences about the jar being mostly red, without treating the bead color as certain.

  The plan:
  1. Pre-draw: The class computes the conditional probabilities for the jar being mostly red given that the bead is red (or blue) with certainty.
  2. The looker draws a bead and, due to the frosted tube, becomes 70% sure it's red. They announce this 70% to the class.
  3. All students (including the looker) write down two numbers:
     a. Their credence that the bead is red (should be 70% for everyone? But note: the looker has the experience, others only hear the 70%).
     b. Their credence that the jar is mostly red.
  4. A bookie (a designated student) offers to buy and sell tickets on the jar's composition at prices set by the conditional credences. The bookie will try to exploit any student whose jar credence is not the correct mixture (0.7 * P(jar-red|bead-red) + 0.3 * P(jar-red|bead-blue)).
  5. The activity is repeated with different lookers and different levels of certainty (e.g., 60%, 90%).
  6. Debrief: Map the activity to the formal concept, explaining why conditionalizing on the proposition as certain is wrong and why the mixture is correct.

  Key insights to emerge:
  - Convergence: After the looker announces their 70%, everyone (including the looker) should have the same credence about the jar. The looker's private experience is fully captured by the 70%.
  - The credence about the jar must be a weighted average of the two conditional credences (conditioned on bead being red or blue) with weights 0.7 and 0.3.

  Potential pitfalls and how to handle them:
  1. Some students might conditionalize on "the bead is red" as if it were certain (ignoring the uncertainty). They will have a jar credence of P(jar-red|bead-red) and be overconfident.
  2. Some might mix with 50/50 weights (the prior) instead of 0.7/0.3.
  3. A student might refuse to give a number because the evidence is vague. We can encourage them to quantify their best judgment.

  How to run without lecturing: Let the bookie expose the mistakes by offering trades that lead to a sure loss for the mistaken student. This will prompt discussion and self-correction.

  What the activity can't do:
  - It only handles a two-cell partition (jar mostly red or blue). The general rule for finer partitions isn't shown.
  - It doesn't address the objection that one should conditionalize on the experience (which is certain) rather than the bead color. For that, we may need to note that the experience is captured by the 70% and then the update is done by Jeffrey conditionalization.

