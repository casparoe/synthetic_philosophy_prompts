prompt: |-
  Ok so I'm redoing my acts-and-omissions seminar handout and I'm bored of trolley cases. What I want to get at is a kind of case I've been calling a "distributed omission" in my notes — where nobody actually lets someone die in the moment. Instead, some person, committee, or bit of software sets a default at some earlier point, and then whoever's on the scene just doesn't override it. The ventilator with the auto-wean setting, the triage tool that quietly deprioritizes a patient, the formulary that never covers the drug. The reason it's a mess is that you can pin the "doing" on whoever wrote the default and the "allowing" on whoever stood there and did nothing, and neither of them really owns the outcome — and sometimes its the same person at two different times, or nobody at all, because the default drifted out of some optimization process nobody signed off on. Give me five examples of conceptual issues this kind of case raises — exactly five, numbered, a sentence or two each, no intro and no wrap-up paragraph.
reasoning: |-
  Okay, the user is redoing a handout for an "acts and omissions" seminar and is tired of trolley problems. They want examples of "distributed omissions"—where harm comes from defaults set earlier, not direct actions. The key points are that no one directly allows the harm at the moment; it's about defaults leading to inaction, and responsibility is fuzzy.

  The user describes scenarios like a ventilator's auto-wean setting, a triage tool deprioritizing patients, or a formulary not covering a drug. The problem is splitting responsibility between the default-setter and the person who didn't override it, which can get messy with time lags or automated systems. 

