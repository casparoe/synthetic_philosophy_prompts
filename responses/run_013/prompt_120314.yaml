answer: |-
  Here’s a thought experiment tailored to your specifications, designed to isolate psychological continuity within a karma-based theory of moral desert. The scenario is mundane, and all non-target variables (wrong, suffering, causal link) are fixed. Each version is concise for seminar delivery.

  ---

  ### **The Case: "The Baker's Ledger"**
  **Setup:** Sam owns a small bakery. For years, Sam systematically overcharges vulnerable customers (e.g., elderly regulars) by falsifying prices, amassing secret savings. This act is stipulated as a serious moral wrong. Later, Sam’s bakery faces financial ruin due to a sudden, unforeseeable market collapse (stipulated as proportionate suffering). The collapse is karmically caused by the past overcharging (stipulated causal chain).  

  #### **Version 1 (V1): Full Continuity**  
  Sam remembers overcharging, feels lingering guilt, and retains the same opportunistic traits. As the bakery fails, Sam thinks, *"This is because I cheated them."*  

  #### **Version 2 (V2): Traits Without Memory**  
  A neurological event (e.g., concussion) erases Sam’s memory of overcharging, but Sam’s core traits remain: opportunistic, shrewd, and self-serving. Facing ruin, Sam is baffled but instinctively seeks new loopholes to exploit.  

  #### **Version 3 (V3): No Memory, Opposite Character**  
  After the concussion, Sam’s personality radically shifts. Formerly selfish Sam becomes scrupulously honest, volunteering at anti-fraud nonprofits and donating excess income. Sam has no memory of overcharging and actively condemns such acts. The bakery’s collapse funds Sam’s charity work.  

  ---

  ### **Theoretical Verdicts**  
  *(Derived from each theory’s core principles)*  

  | **Theory**                  | **V1: Full Continuity** | **V2: Traits, No Memory** | **V3: Opposite Character** |  
  |-----------------------------|-------------------------|---------------------------|----------------------------|  
  | **Karma Theory**            | **Deserved.** Suffering is the ripening of Sam’s act; the causal chain transcends memory/character. | **Deserved.** The causal link defines desert, not psychological states. | **Deserved.** Identity is irrelevant; the act’s karmic residue matures in the life-stream. |  
  | **Retributivism** (Psychological Continuity) | **Deserved.** Sam is the same person: memories + character intact. | **Debatable.** Traits suggest continuity, but no memory weakens identity. *(Often: not deserved)* | **Not deserved.** No psychological connection to the wrongdoer. |  
  | **Retributivism** (Bare Subject) | **Deserved.** The enduring "self" committed the act. | **Deserved.** The same bare subject persists. | **Deserved.** The metaphysical self is unchanged. |  
  | **Consequentialism**        | **Desert irrelevant.** Suffering is bad unless it deters future harm (e.g., Sam’s downfall warns others). | **Identical to V1.** Only consequences matter, not identity. | **Identical.** If suffering reduces net pain (e.g., funds charity), it’s good. |  

  ---

  ### **Closing Analysis**  
  1. **Which variable matters?**  
     The divergence hinges **solely on psychological continuity**. Altering the wrong’s severity (e.g., stealing $10 vs. $10,000) or suffering’s proportionality (e.g., bankruptcy vs. stubbed toe) would shift all theories’ verdicts *uniformly* (e.g., all reject wildly disproportionate suffering). The V1–V3 psychological gradient preserves the core conflict.  

  2. **Dial turned down: No continuity**  
     If the karmic suffering afflicts a **stranger** (e.g., a random pedestrian injured in Sam’s stress-induced car crash) or a **community** (e.g., the bakery’s collapse devastates the town):  
     - **Karma:** Still *deserved*—the causal chain justifies desert.  
     - **Retributivism:** *Not deserved*—no identity link (even bare-subject theories require a *specific* persisting subject).  
     - **Consequentialism:** Unchanged—evaluates outcomes only.  

  3. **The "Life-Stream" Defence**  
     If karma defenders appeal to a **causal life-stream** (not an enduring person):  
     - **Does the case bite?** Yes. It reveals karma *abandons personal desert*: suffering is "deserved" by a process, not a moral agent.  
     - **Is it still desert?** Arguably **no**. Moral desert requires a *subject* who merits reward/punishment (e.g., "Sam deserves this"). If karma reduces to causation + moral labels ("ripening"), it becomes a **cosmic balancing mechanism**, not a theory of *desert* as philosophically understood.  

  ---

  ### **Constraint Check**  
  - **Is V3 rigged against retributivism?**  
    Yes—but *correctly*. V3 is designed to break psychological-continuity accounts of identity, which retributivism often relies on. To "un-rig" it:  
    1. **For psychological retributivists:** Add a *minimal* identity link (e.g., Sam vaguely recalls the overcharging as "a bad dream").  
    2. **For bare-subject retributivists:** Emphasize that *no* theory denies biological continuity (e.g., Sam’s body persists).  
    Even un-rigged, the V3 verdicts diverge sharply between karma and retributivism.  

  ---

  **Seminar-ready length:** Each version is 2–3 sentences; verdicts are table-formatted for clarity; analysis is bullet-pointed. Total reading time: ~90 seconds.
