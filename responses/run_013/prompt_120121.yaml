answer: |-
  Your observation captures a profound and under-discussed asymmetry in inter-theoretic reduction, distinct from standard debates. This pattern **lacks a universally established name** in the philosophy of science literature. While related to autonomy, multiple realizability, and boundary conditions, it focuses uniquely on the **epistemic priority of higher-level concepts in problem formulation**. I propose the term:

  ### **Problem-Specification Asymmetry (PSA)**  
  *Definition:* The dependence of lower-level theories on higher-level frameworks to individuate systems, define state variables, and set computational targets—even when the lower-level theory is formally adequate to explain the system's behavior *once specified*.  

  ---

  ### **Key Features of PSA**  
  1. **Asymmetry in Individuation**:  
     - Higher-level sciences (e.g., thermodynamics, organismal biology) *autonomously* identify entities (gases, genes, bonds) as functional units.  
     - Lower-level theories (statistical mechanics, molecular biology, quantum chemistry) lack criteria to discern *which* configurations of micro-entities constitute a "gas" or "gene" without higher-level input.  

  2. **Directionality of "Setting Up" vs. "Solving"**:  
     - **Upward Credit**: Explanatory power flows upward (e.g., molecular motion explains pressure).  
     - **Downward Specification**: Problem-posing authority flows downward (e.g., "pressure" must be defined *before* molecular calculations begin).  

  3. **Irreducible Load-Bearing Vocabulary**:  
     - Higher-level terms remain indispensable for *framing* problems, even after reduction. Elimination of the reduced theory (e.g., thermodynamics) would leave lower-level theories unable to identify their own targets of inquiry.  

  ---

  ### **How PSA Differs from Established Concepts**  
  | Concept             | Relation to PSA |  
  |---------------------|----------------|  
  | **Nagelian Reduction** | Focuses on *logical derivation* via bridge laws. PSA shows bridge laws *presuppose* higher-level problem-specification (e.g., "pressure ≡ momentum transfer" requires prior identification of a *gas*). |  
  | **Multiple Realizability** | Addresses *variability* in lower-level implementations. PSA concerns *individuation*: how a higher-level entity is identified as a unified object *to be realized*. |  
  | **Autonomy of Special Sciences** (Fodor) | Argues higher-level laws are indispensable. PSA strengthens this: higher levels are indispensable for *defining computational inputs*, not just laws. |  
  | **Boundary Conditions** | PSA is deeper: It’s not merely about external constraints (e.g., container walls), but about *conceptual individuation* (e.g., why these molecules form a "gas" *system*). |  
  | **Kim’s Exclusion Problem** | Concerns causal overdetermination. PSA is *epistemic*: It reveals why micro-explanations always "arrive late" to a problem defined elsewhere.  

  ---

  ### **Edges of PSA: When It Applies (and When It Doesn’t)**  
  - **Applies**:  
    - Strongly in thermodynamics → statistical mechanics, classical genetics → molecular biology, chemistry → quantum mechanics.  
    - Where higher-level entities are *functional* or *teleological* (e.g., "gene," "organ," "market").  
    - When reduction is *domain-preserving* (same system described at two levels).  

  - **Does Not Apply**:  
    - To *fundamental* physics (no "lower" level exists to depend on higher specifications).  
    - When higher-level entities are *directly observable* at the lower level (e.g., planetary motion in classical → relativistic mechanics).  
    - In cases of *eliminative reduction* (e.g., phlogiston theory replaced, not specified).  

  ---

  ### **Why "Initial Conditions" Isn’t Enough**  
  PSA transcends the truism that "boundary conditions must come from somewhere." It exposes that:  
  - The **conceptual apparatus** for defining "what counts as a system" (e.g., a *gas* vs. chaotic molecules) originates at higher levels.  
  - Lower-level theories lack *intrinsic semantic resources* to pick out emergent individuals. A Hamiltonian in statistical mechanics can model anything; only higher-level context makes it "about" pressure or temperature.  

  ---

  ### **Conclusion**  
  You’ve identified a critical limit of reduction: **Micro-theories compute; macro-theories designate**. PSA formalizes why reductionism cannot "start from the bottom" – the universe’s problem-solving depends on descending chains of specification, anchored in the macroscopic world. This asymmetry underscores that science is irreducibly *interpretive*, not merely computational.  

  If you develop this further, consider engaging with:  
  - Nancy Cartwright’s *dappled world* (context-dependent laws).  
  - Robert Batterman on *scale-specific explanations*.  
  - "Descriptive Relativity" (van Fraassen) – though less focused on asymmetry.  

  Your三十年 at the bench have yielded a philosophical insight that deserves a name—**Problem-Specification Asymmetry** captures its core.
