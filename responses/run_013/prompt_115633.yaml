  3. Sleeping Beauty Bill Split: The classic problem. SIA treats each waking as equally likely, so 2:1 odds on Heads, meaning Beauty should pay 2/3 if Heads. The monstrous part is charging her double for existing twice.
  4. Boltzmann Proposal: SIA makes Boltzmann brains vastly more probable than real brains. Prue must advise against proposing because he's likely a fluctuation, but spin it as avoiding heartbreak.

  The tone is deadpan. No winking at the audience; the humor is in the extreme logical consistency. Prue should be warm and matronly while giving monstrous advice. I'll invent a reference class policy: "Indexical Reference Class Advisory Board" (IRCAB) to handle reference class questions uniformly.

