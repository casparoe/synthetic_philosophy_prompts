prompt: |-
  So I've been running a small rationality meetup for about four years — twenty-odd people, we do a double crux night twice a month — and somewhere along the way I became the guy people ask to sit in when two members have a disagreement they can't shake. Twice now it's been two people about to go into business together, which means real money, and last month it was a couple disagreeing about whether one of them should quit his job. So the stakes are occasionally high, I get 45 minutes and a whiteboard, and nobody in the room is going to compute anything.

  What I want from you is a procedure I can actually run in the room, built on the Aumann agreeing-to-disagree stuff and the common prior assumption underneath it. Not an explanation of the theorem — I've read the Sequences twice, I think I get it. A procedure. The questions I ask in what order, what a sufficient answer to each one looks like, the point where the procedure stops and says "you two just disagree, go home", and — this is the part I care about most — where the procedure stops being math and starts being me making a judgment call, so I can say that out loud instead of laundering my gut through a theorem.

  Some things it has to handle, because these are the ones that actually come up:

  - Half the time what people bring me isn't a disagreement about credences at all. It's about what to do, or about values, and I don't think the theorem has anything to say about that. The procedure needs to catch that early and hand it back, not grind on it.
  - The gap between two people's numbers is usually a pointer to private information. I want the procedure to treat it that way, with actual questions for digging it out, rather than just "state your reasons."
  - Different priors. If they don't share a prior, the whole thing is void, and I need to know how to tell whether that's what's happening and what's left to do at that point.
  - Nobody in that room is an ideal Bayesian and none of us can compute. So a small gap should probably be treated as noise and the procedure should say when to stop fussing.
  - People can lie about their numbers, or anchor each other, or be wrong about their own credences. Build in whatever ordering avoids that.
  - And under no circumstances should the output be "Aumann says we have to agree, so you're being irrational." I've seen that move used as a club and it's the worst thing to come out of this literature. If the procedure's honest conclusion is that one of us is probably making an error, it should say so plainly rather than dress it up.

  Then run it on two cases, worked all the way through the steps, and make the third one a case where I'm a party and not the facilitator — where the procedure tells me to move most of the way to the other person's number and I hate it. If the honest answer there is "there's no way to tell who's right, so move anyway," I want that said plainly, and I want you to say whether that's actually what the theorem licenses or whether you're just being diplomatic.

  Structure it like this:

  **What the theorem buys you** — about 150 words, the minimum I need in my head to run the rest, and specifically what it does not license.

  **The procedure** — the bulk of it. Numbered steps in the order I'd actually ask them, with what counts as a sufficient answer at each step, where the procedure halts, and where I'm the one deciding. Keep the questions short enough that I can ask them out loud without sounding like a seminar.

  **Two dry runs** — two disagreements taken through the steps end to end, including the third one where I'm a party. Show me what the procedure does to me.

  **Where the math stops and I start** — a short list of the steps that are judgment calls wearing a lab coat, and what I should say out loud when I hit one so the other person knows it's me talking and not the theorem.

  **What this can't do** — short. The kinds of disagreement this procedure will quietly fail on, and how I'd know I'm in one.
reasoning: |-
  We are going to design a procedure based on the Aumann agreement theorem that is practical for real-world disputes. The theorem states that if two people have the same prior and their posteriors are common knowledge, then they must have the same posterior. But note: the real world is messy. We don't have common knowledge, we have cognitive biases, and we aren't perfect Bayesians. So the procedure must be robust to these issues.

  What the theorem buys you:
  The theorem says that if two rational agents with a common prior update on different information, once they fully share all relevant information (so that their information sets are common knowledge) they must agree. However, it does not say how to share that information, and it assumes rationality (which we don't have). It does not apply to disagreements about values or actions (only about beliefs). It also does not handle cases without a common prior. The procedure we build will use the theorem as a guide to share information until agreement is reached or until we hit a barrier (like different priors or non-belief issues).

  The procedure:
  We are going to structure the procedure as a series of steps. The goal is to identify the source of the disagreement: is it about beliefs? If so, can we reconcile by sharing information? If not, we stop and hand back the problem. We are also going to be cautious about cognitive biases and the fact that people aren't perfect.

  Steps:

  1. **Frame the Disagreement**: 
     - Ask each party: "What is the specific belief you disagree about? Please state it as a proposition that can be assigned a probability."
     - Sufficient answer: A clear statement of a proposition (e.g., "The probability that this business will be profitable in the first year" or "The probability that quitting the job will lead to a better career outcome within two years"). 
     - If they cannot state a proposition, then the disagreement is likely about values or actions. Halt and say: "This seems to be about what to do or what you value, not about a factual belief. The procedure is for beliefs. You may need a different method."
     - Judgment call: You decide if the proposition is clear and factual.

  2. **State Current Beliefs**:
     - Ask each party: "What probability do you assign to this proposition right now? Please give a number between 0 and 100."
     - Sufficient answer: Two numbers (e.g., 30% and 70%).
     - If the numbers are very close (say within 5-10 percentage points), halt and say: "The difference is small enough that it might be noise. You can proceed with caution without further reconciliation."
     - If one or both refuse to give a number, halt and say: "Without a probability, we can't apply the procedure. Try to reframe as a belief or accept that this might not be about beliefs."

  3. **Check for Common Prior**:
     - Ask: "If you both had known nothing about this specific situation, but only general background knowledge, would you have agreed on a prior probability?"
     - Sufficient answer: They both say yes (or no). 
     - If they say no, then halt and say: "You don't have a common prior. The theorem doesn't apply. You might have fundamentally different starting points. You'll need to discuss why your starting points differ, but that's beyond this procedure."
     - Judgment call: You might need to probe if they are just saying yes to be polite. If you suspect they don't have a common prior, you can note that and halt.

  4. **Identify Private Information**:
     - Ask each: "What information do you have that the other doesn't? Think about experiences, data, or reasons that led you to your current belief."
     - Sufficient answer: Each party lists one or more pieces of information they think are private and relevant.
     - If they can't think of any, go to step 5 (exchange reasons) but note that without private information, the theorem suggests they should already agree.

  5. **Exchange Reasons**:
     - Have each party share one piece of their private information (from step 4) or one key reason for their belief.
     - After each reason, ask both: "Hearing that, does your probability change? If so, to what?"
     - Sufficient answer: They update their probabilities (or not) and state the new number.
     - Continue until they run out of reasons or until the probabilities converge (or stop changing).
     - If they converge (within 5-10 points), halt and note agreement.
     - If they run out of reasons and still disagree, go to step 6.

  6. **Identify Remaining Disagreement**:
     - Ask: "What is the main reason you still disagree? What piece of information, if you had it, would make your probabilities equal?"
     - Sufficient answer: Each party states what they think the other is missing.
     - Then, ask: "Can you share that information now? If not, why?"
     - If they can and do, then update probabilities again. If they converge, halt. If not, or if they can't share (e.g., it's a gut feeling), go to step 7.

  7. **Halt with Judgment**:
     - If the disagreement persists, say: "We've shared what we can. The remaining disagreement may be due to: 
          - Non-shared prior (even if you thought you had one, maybe you didn't)
          - Cognitive biases (like anchoring or overconfidence)
          - Non-belief issues (values or preferences affecting your beliefs) 
          - Or, you just have different weights on the same information.
       - Since we can't resolve it by sharing more, you'll have to decide how to proceed knowing that."

  Additional notes:
  - To avoid anchoring and lying about numbers: 
     In step 2, have them write their probabilities privately and reveal at the same time. 
     In step 5, when updating, they should update privately and then reveal.
  - To avoid grinding on non-belief issues: Step 1 is critical. If they reframe the action as a belief (e.g., "I believe quitting the job will lead to a better outcome"), that's acceptable. But if they are arguing about what "better" means, then it's values.

  Two dry runs:

  **Dry Run 1: Business Partners Disagree on Profitability**
  - Step 1: They state the proposition: "The business will be profitable in the first year."
  - Step 2: Partner A: 20%, Partner B: 60%. (Big gap, proceed)
  - Step 3: They agree they would have both said 40% if they knew nothing else. (Common prior exists)
  - Step 4: 
     A: "I've seen that our main supplier might raise prices, and I've seen data that similar businesses in the area fail at a high rate."
     B: "I've been talking to potential customers and they are very excited, and I've done a detailed financial projection that shows profitability."
  - Step 5: 
     - A shares supplier concern. B updates from 60% to 50%. 
     - B shares customer excitement and projections. A updates from 20% to 35%.
     - Now at 35% and 50%. 
     - They share more: A shares the failure rate data. B updates to 45%. 
     - B shares more details of the projections. A updates to 40%. 
     - Now at 40% and 45% (within 5 points). Halt: close enough.

  **Dry Run 2: Couple on Quitting Job (You are one of them)**
  - You are the one considering quitting. Your partner wants you to quit, but you are hesitant.
  - Step 1: Proposition: "Quitting the job will lead to a better career outcome within two years." (Note: This might be tricky because "better" could be value-laden, but we treat it as a factual prediction.)
  - Step 2: 
     - You (the job holder): 30% 
     - Your partner: 80%
  - Step 3: Common prior? You both agree that without any specific information, you would have said 50% (so common prior exists).
  - Step 4:
     - You: "I have private information: my boss has hinted at a promotion soon, and I know my industry is in a downturn so finding a new job is hard."
     - Partner: "I have private information: I've seen how stressed you are, and I know about a specific job opening that would be perfect for you."
  - Step 5:
     - You share your boss hint and industry view. Partner updates to 65%.
     - Partner shares the stress observation and job opening. You update to 40%.
     - Next round:
          You: "I also know that I have a skills gap for that perfect job." Partner updates to 55%.
          Partner: "I know you've been networking and have connections that could help." You update to 45%.
     - Now at 45% and 55%. 
     - Step 6: The remaining disagreement? 
          You: "I think my partner is underestimating the risk of being unemployed for a long time."
          Partner: "I think you are overestimating the promotion chance and underestimating the health toll."
     - But neither has new information to share. It's a difference in weighting.
  - Step 7: Halt. The procedure says you've shared what you can. The gap is 10 points. You might decide it's noise or you might note that the theorem says you should agree, but in practice, you don't. Since you are the job holder, you have to make the call. The procedure doesn't force agreement. It says: you've updated as much as you can, so now decide. The honest answer: there's no way to tell who's right, so you might average (50%) and then make a decision based on risk tolerance (which is a value). But note: the theorem doesn't say you must agree, because we haven't achieved common knowledge (and we aren't perfect). So it's okay to have a residual disagreement.

  Where the math stops and I start:
  - Step 1: Deciding if the proposition is about a belief or about values/action.
  - Step 2: Deciding what counts as a "small" gap (e.g., 5%? 10%?).
  - Step 3: Judging whether they really have a common prior (they might say yes but you suspect no).
  - Step 5: Deciding when to stop the exchange of reasons (if they are going in circles).
  - Step 7: Diagnosing the cause of the remaining disagreement (bias? values?).

  At each of these points, say out loud: "This is my judgment call: ..."

  What this can't do:
  - Disagreements about values or preferences (caught in step 1).
  - Cases where one party is lying or unwilling to share (the procedure assumes honesty).
  - Deeply held irrational beliefs (e.g., conspiracy theories) that won't update with evidence.
  - When the common prior is absent and the parties are not aware (step 3 might fail to catch it).
  - Disagreements that are too complex to break down in 45 minutes.

  You'll know you're in one of these if:
  - Step 1 fails (they can't state a proposition).
  - Step 3 fails (they don't have a common prior and won't discuss why).
  - The numbers don't move at all during step 5 (they are entrenched).
  - They get stuck in a loop of arguing without updating.

  This procedure is a tool to facilitate sharing of information and updating. It won't always produce agreement, but it will often narrow the gap and clarify the sources of disagreement.
answer: |-
  ### Dispute Resolution Procedure Based on Aumann's Agreement Theorem  
  **Designed for real-world constraints: 45 minutes, a whiteboard, no computation, and non-ideal humans.**

  ---

  #### **What the Theorem Buys You (150 Words)**  
  Aumann’s theorem says: If two rational agents share a common prior (same initial beliefs before private information) and their beliefs become common knowledge, they *must* agree. It does **not** force agreement if priors differ, information isn’t fully shared, or agents are irrational. It **only** applies to factual beliefs (credences), not values or actions. The theorem is a compass—not a club—for finding hidden information. If disagreement persists after sharing, possible causes are: different priors, unshared information, biases, or non-belief issues. The procedure uses this to structure information exchange. **It does NOT** prove irrationality, resolve value conflicts, or guarantee agreement.  

  ---

  #### **The Procedure**  
  **Ordered steps with questions you ask aloud. Timebox each step (2–7 min).**  
  **Goal:** Resolve disagreements about *facts*. If values/actions arise, exit early.  

  1. **Is this about beliefs or values?**  
     - Ask both: *"What specific future event or fact are you disagreeing about? Phrase it as ‘The probability that X happens’."*  
     - **Sufficient answer:** A clear proposition (e.g., "The probability our business is profitable by 2025"). If they describe actions (e.g., "Should I quit my job?") or values (e.g., "Is risk worth it?"), halt.  
     - **Halt if:** Proposition isn’t factual. Say: *"This isn't about beliefs. The math doesn’t apply. Discuss your values separately."*  
     - **Your judgment:** Decide if the proposition is truly about beliefs. If vague, reframe it together.  

  2. **State probabilities privately.**  
     - Ask both: *"Write down your probability for X (0–100%), without sharing yet. No explanations."*  
     - Have them reveal numbers simultaneously (avoids anchoring).  
     - **Sufficient answer:** Two numbers (e.g., 20% and 80%).  
     - **Halt if:** Gap is ≤10 points. Say: *"This gap is small. Treat it as noise and move on."*  
     - **Halt if:** One refuses a number. Say: *"If you can’t quantify this, it might not be about beliefs."*  
     - **Your judgment:** Decide if the gap is "small" (use 10% as a rule of thumb).  

  3. **Do you share a common prior?**  
     - Ask both: *"Before any private info, would you have agreed on a starting probability for X? What was it?"*  
     - **Sufficient answer:** A shared prior (e.g., "We both said 50% last year"). If they disagree, probe: *"Why did your starting points differ?"*  
     - **Halt if:** No common prior (e.g., one says 10%, the other 90%). Say: *"Your priors differ. The theorem doesn’t apply. Discuss why your baselines split."*  
     - **Your judgment:** Assess if their prior disagreement is resolvable (e.g., one misremembers). If intractable, halt.  

  4. **What private information explains your number?**  
     - Ask each: *"What evidence, data, or experiences led you from the prior to your current number? List 1–3 key pieces the other hasn’t fully seen."*  
     - **Sufficient answer:** Concrete, shareable items (e.g., "I saw sales data from March" or "I spoke to a failed founder").  
     - **Halt if:** No private info (e.g., "It’s a gut feeling"). Say: *"If no private info, you should agree. Revisit your reasoning."*  
     - **Your judgment:** Filter out non-informational answers (e.g., "I’m optimistic"). Demand specifics.  

  5. **Exchange and update.**  
     - For each piece of private info:  
       - Owner shares it fully (e.g., show data, describe experience).  
       - Ask both: *"Hearing this, does your probability change? Write privately, then share."*  
     - Repeat until probabilities converge or no new info.  
     - **Sufficient answer:** Updated numbers after each exchange (e.g., "Now I’m at 40%" → "Now I’m at 55%").  
     - **Halt if:** Gap closes to ≤10 points. Say: *"You’re close enough. Proceed with caution."*  
     - **Halt if:** Updates stall (e.g., numbers stop changing after 2 rounds).  
     - **Your judgment:** Stop if exchanges become repetitive or emotional.  

  6. **Diagnose residual disagreement (if gap >10 points).**  
     - Ask both: *"What critical piece is still missing or weighed differently? Is it knowable now?"*  
     - **Sufficient answer:** Specific unresolved factors (e.g., "We disagree on how reliable the data is").  
     - **Halt if:** They identify irreconcilable differences (e.g., trust in sources).  
     - **Final output:**  
       - If gap shrinks but persists: *"You’ve shared what you can. The rest might be biases, different weights, or unknown unknowns. Decide jointly, acknowledging uncertainty."*  
       - If no progress: *"This disagreement can’t be resolved by sharing info. It may stem from priors, values, or biases."*  
     - **Your judgment:** Decide if residual disagreement is rational (e.g., ambiguous info) or biased (e.g., stubbornness). Say this aloud.  

  **Key safeguards:**  
  - **Against lying/anchoring:** Private writes in Steps 2 and 5.  
  - **Against non-beliefs:** Early halt in Step 1.  
  - **Against "Aumann as club":** Never say "You must agree." Say: *"The theorem suggests hidden info—now we’ve shared it, and you still disagree. That’s human."*  

  ---

  #### **Two Dry Runs**  
  **Case 1: Business Partners (Factual Disagreement)**  
  - **Step 1:** Proposition: *"Probability our startup is cash-flow positive in 12 months."* (Factual → proceed).  
  - **Step 2:** Partner A (pessimist): 20%. Partner B (optimist): 80%. (Gap >10 → proceed).  
  - **Step 3:** Prior: Both say 50% pre-data (common prior → proceed).  
  - **Step 4:**  
    - A’s private info: *"Data shows 80% of local startups fail."*  
    - B’s private info: *"We have a committed client covering 50% of costs."*  
  - **Step 5:**  
    - B shares client info → A updates to 40%.  
    - A shares failure data → B updates to 65%.  
    - A adds: *"Our accountant warned about high burn rate."* → B updates to 55%.  
    - B adds: *"Client referred two others."* → A updates to 45%.  
  - **Step 6:** Gap now 45% vs. 55% (≤10 points). Halt: *"Close enough. Proceed, but monitor cash weekly."*  

  **Case 2: Your Job-Quit Decision (You’re Involved)**  
  *(You’re the one considering quitting; your partner thinks you should.)*  
  - **Step 1:** Proposition: *"Probability I find a job I like better within 6 months if I quit."* (Factual → proceed).  
  - **Step 2:** You: 30%. Partner: 85%. (Gap >10 → proceed).  
  - **Step 3:** Prior: Both agree it was 50% before job-specific info (common prior → proceed).  
  - **Step 4:**  
    - Your private info: *"Three peers quit and are still jobless; my industry is hiring slowly."*  
    - Partner’s private info: *"I’ve seen your burnout symptoms; my network has unposted roles in your field."*  
  - **Step 5:**  
    - Partner shares burnout observation → You update to 40%.  
    - You share peer job data → Partner updates to 70%.  
    - Partner shares network leads → You update to 50%.  
    - You add: *"I lack certifications those roles require."* → Partner updates to 60%.  
  - **Step 6:** Now 50% vs. 60%. Gap >10 but narrowing. Partner says: *"You’re ignoring my network’s power."* You say: *"You’re downplaying certification gaps."*  
  - **Halt:** *"We’ve shared key info. Residual gap may be from different weights on networks/certs. Given the stakes, I should move toward your view (up to 50%) but not fully. Why? The theorem says hidden info should be resolved—but we did that. The rest isn’t math. I might be biased toward caution; you might be overoptimistic. Since we can’t tell, we’ll use my 50% for decisions."*  
    - **Honest conclusion:** The theorem licenses moving if information was asymmetric. Here, it was shared, but weights differ. Moving partially is pragmatic, not Bayesian. Say plainly: *"No way to tell who’s right. I’ll compromise to 50% because the update was real, but I won’t ignore my doubts."*  

  ---

  #### **Where Math Stops and You Start**  
  **Judgment calls to announce aloud:**  
  1. **Step 1:** *"I’m judging this is about values/actions, not beliefs. Math can’t help."*  
  2. **Step 2:** *"I’m calling this gap ‘small’ (≤10%). That’s my threshold, not a theorem."*  
  3. **Step 3:** *"I think your prior disagreement is fundamental, even if you don’t. Halt."*  
  4. **Step 5:** *"I’m stopping updates—you’re repeating or stuck. This isn’t working."*  
  5. **Step 6:** *"I suspect bias (e.g., overconfidence) is blocking agreement. Address that."*  

  **Always say:** *"This is my call as facilitator—not the theorem."*  

  ---

  #### **What This Can’t Do**  
  **Quiet failures (how to spot them):**  
  - **Values masquerading as beliefs:** E.g., "Probability quitting is *right* for me" (implies values). Caught in Step 1 if probed.  
  - **Different priors disguised:** If they "agree" on a prior superficially but it’s inconsistent. Spot if updates in Step 5 are chaotic or resist convergence.  
  - **Biases too strong:** E.g., one ignores shared info (updates <5 points in Step 5). Shows as stubbornness.  
  - **Intractable uncertainty:** Missing info is unattainable (e.g., future events). Spot if Step 6 factors are unknowable.  
  - **Lying/defensiveness:** If answers are vague or probabilities don’t shift logically.  

  **Exit early if:** Step 1–4 reveal values, no common prior, or no private info. Say: *"This isn’t a factual disagreement. Try negotiation or therapy instead."*  

  **Final note:** This procedure won’t resolve all disputes. It surfaces information and clarifies where humans diverge. Use it to enable better decisions—not as a rationality test.
