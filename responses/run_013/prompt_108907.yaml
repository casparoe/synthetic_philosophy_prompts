prompt: |-
  I just moved into a data science role and I keep hitting the same wall: I genuinely have no information about some parameter, so I slap a uniform prior on whatever scale I happen to be working in, and then a coworker writes the exact same model in terms of a different parameter and we get different answers. Last week it was a toy thing a friend sent me -- a machine makes rectangles of perimeter 2, whats the chance the area comes out under 0.1? Uniform on the width gives me one number, uniform on the area gives me another, and the aspect-ratio version apparently disagrees with both. Same deal as the old random-chord puzzle giving you three answers depending on how you build the chord.

  Before I just pick a convention and stop thinking about it, I want the spec. What does any account of priors-from-ignorance -- indifference and symmetry, invariance arguments, max entropy, imprecise or interval-valued probabilities, whatever else is in play -- have to deliver to count as usable by someone who has to actually commit to a prior and defend it? Give me the requirements list: the cases it has to get right, the invariances it can't violate, the distinctions it can't collapse (no information vs symmetric information; a prior being undefined vs vague vs improper), and what it has to be consistent with -- coherence, conditioning, countable additivity, if you think those are requirements. For each requirement, the case or consideration that forces it, and a note on which ones are non-negotiable and which are just house preferences of whichever camp invented them.

  The bit I most want: which of these can't be had together. If "invariant under any reparameterization" and "always returns a definite number" are jointly unsatisfiable, spell that out as the result rather than glossing it. And tell me which single requirement rules out the most otherwise attractive option -- I'm betting it's the reparameterization one killing the plain uniform prior, but tell me if I'm wrong. Skip names and citations, I don't need the literature, just the criteria and where they conflict.
reasoning: |-
  Okay, the user is a data scientist who's struggling with choosing priors when they have no information. They're hitting the classic problem of getting different answers based on how they parameterize the same model. They mention the rectangle area problem and the random chord puzzle as examples. Their main request is for a clear set of requirements that any ignorance prior should meet, along with conflicts between these requirements.

  First, I need to break down the core issue: uniform priors aren't invariant under reparameterization. That's why changing parameters gives different results. The user wants to know what criteria a good ignorance prior should satisfy and where these criteria clash.

  The key requirements would include internal coherence (avoiding Dutch books), ability to update with data, handling improper priors correctly, and most importantly, invariance under reparameterization. But invariance is tricky because it's impossible for proper priors on unbounded spaces. That's why Jeffreys prior comes up - it's designed to be invariant under reparameterization by using the Fisher information metric.

  But Jeffreys prior has its own problems. It might not be normalizable, and it can violate the Likelihood Principle. Also, for multidimensional parameters, it can have poor performance. MaxEnt is another approach, but it depends on the chosen constraints and base measure, which brings back the parameterization issue.

  The user also needs to distinguish between no information and symmetric information. If there's symmetry, like in the rectangle example, a uniform prior on a particular parameter might be justified, but without symmetry, it's arbitrary. They also need to know the difference between improper priors (which can be useful but require care) and vague priors (which are proper but diffuse).

  The big conflict is between reparameterization invariance and having a proper prior. You can't have both unless the parameter space is bounded. So in practice, for unbounded spaces, Jeffreys prior is used but it's improper. The user needs to understand that no single method satisfies all criteria, so the choice depends on the problem context.

  The user's deeper need is probably to defend their choice of prior to coworkers. So providing clear rationale based on problem-specific symmetries or information geometry would help. Emphasizing that sometimes a diffuse proper prior is better for computation, even if it's not perfectly invariant.

  Also, explaining that for the rectangle problem, different priors arise from different symmetry assumptions. Uniform on width assumes symmetry in width, uniform on area assumes symmetry in area, but these imply different distributions. The "correct" prior depends on the actual data-generating process, which might not be known.

  In conclusion, the response should outline the requirements, highlight the conflicts, and give practical advice: use Jeffreys when invariance is critical, accept that proper priors aren't invariant, and justify based on problem context rather than defaulting to uniform.
answer: |-
  Here's a requirements list for "ignorance priors," distilled to core principles, conflicts, and practical necessities, based on the fundamental challenges you're facing:

  ### Core Requirements
  1.  **Coherence (Non-Negotiable):** The prior must lead to probability assignments that avoid sure-loss ("Dutch book") scenarios. Probability calculus must hold.
      *   *Why:* Foundational to probability theory. Violations make the prior internally inconsistent and indefensible.
      *   *Forces:* Countable additivity is usually required (prevents paradoxes like assigning P(even) = P(odd) = 1/2 on integers while P(specific integer) = 0). Improper priors are allowed *only if* posterior becomes proper with data.

  2.  **Conditional Compatibility (Non-Negotiable):** The prior must allow for consistent updating via Bayes' theorem upon observing data. The posterior must be well-defined.
      *   *Why:* The core operation of Bayesian analysis. If conditioning breaks, the prior is useless for learning.
      *   *Forces:* See coherence on improper priors. The prior cannot assign probability 1 to sets that data could logically contradict without infinite density (requires careful handling of boundaries).

  3.  **Distinction Preservation (Highly Desirable):**
      *   **No Information vs. Symmetric Information:** Must distinguish "I know nothing" from "I know all possibilities are equally probable *in a specific, meaningful sense*." The rectangle perimeter is symmetric information about the constraint, *not* inherent ignorance about width/area/etc.
      *   **Undefined vs. Vague vs. Improper:** Must acknowledge when a prior truly cannot be defined ("undefined"), when it represents weak but genuine information ("vague" - proper but diffuse), and when it's a computational tool representing infinite variance ("improper" - integrates to infinity).
      *   *Why:* Prevents misapplication. Slapping uniform on width *assumes* symmetry on the width scale is the relevant symmetry. Your rectangle problem shows this isn't inherent ignorance.

  4.  **Justification by Information State (Non-Negotiable):** The form of the prior must be justifiable *solely* by the stated lack of information/symmetry, not by convenience. The justification must survive scrutiny of "Why *this* parameterization?"
      *   *Why:* Defense requirement. "I put uniform where I happened to write the equation" is indefensible. "I used Jeffreys prior because the problem is invariant under reparameterization of the model" is a justification.

  5.  **Practical Computability (Contextual):** The prior should allow feasible computation of posteriors and predictions.
      *   *Why:* You need to *use* it. Highly complex or intractable priors are often impractical.

  ### The Killer Conflict: Invariance vs. Definiteness
  *   **Requirement A (Desirable: Invariance/Reparameterization):** The prior should induce equivalent probabilistic conclusions regardless of how the underlying model parameter is mathematically represented (e.g., width `w`, area `a = w(1-w)`, aspect ratio `r = w/(1-w)`). Formally, `P(A) = P(T(A))` for relevant transformations `T`.
  *   **Requirement B (Desirable: Definiteness/Properness):** The prior should be a proper probability distribution (`∫ prior(θ) dθ = 1`).

  **The Conflict:** **You cannot have both A and B for unbounded continuous parameters.** This is the core of your rectangle and random chord frustrations.

  *   **Why Conflict?**
      1.  **Uniform on Width (`w`):** `P(w) dw = dw` (0 < w < 1). Implies `P(area < 0.1) = P(w(1-w) < 0.1)`. Solving `w(1-w)=0.1` gives `w ≈ 0.1127, 0.8873`. So `P(area < 0.1) = ∫_{0.1127}^{0.8873} dw ≈ 0.7746`.
      2.  **Uniform on Area (`a`):** `a = w(1-w)`. The transformation has a singularity at `w=0.5` (da/dw=0). Jacobian is `|da/dw| = |1 - 2w|`. So `P(a) da = P(w) * |dw/da| da = dw * |1/(1-2w)| da`. Since we want uniform on `a`, `P(a) = constant`, implying `P(w) dw ∝ |1-2w| dw`. `P(area < 0.1) = P(a < 0.1) = ∫_{0}^{0.1} da / ∫_{0}^{0.25} da = 0.1 / 0.25 = 0.4` (since max area=0.25 at w=0.5).
      3.  **Uniform on Aspect Ratio (`r = w/(1-w)`):** `r` ranges (0, ∞). `w = r/(1+r)`, Jacobian `|dw/dr| = 1/(1+r)^2`. Uniform on `r`: `P(r) dr = dr`. Implies `P(w) dw = P(r) * |dr/dw| dw = 1 * (1+r)^2 dw`. Substitute `r=w/(1-w)`: `P(w) dw ∝ [1 + w/(1-w)]^2 dw = 1/(1-w)^4 dw`? Wait... `[1 + w/(1-w)] = 1/(1-w)`, so `[1/(1-w)]^2 dw = 1/(1-w)^2 dw`. This prior blows up as `w->1`. `P(area < 0.1)` requires integrating this complex density over w where w(1-w)<0.1, resulting in yet another different value.
  *   **The Result:** Uniform priors on different, but mathematically equivalent, parameterizations (`w`, `a`, `r`) lead to *different* answers for `P(area < 0.1)` (≈0.77, 0.40, and something else). Invariance (A) is violated. Making any of these priors proper (B) (e.g., uniform on `w` over [ε, 1-ε]) doesn't fix the *disagreement* between the approaches; it just makes each answer finite. The core problem is the *disagreement*, not the impropriety.

  ### Which Requirement Rules Out the Most? (You're Right)
  *   **Reparameterization Invariance (A)** is the killer. It rules out:
      *   **Naive Uniform Priors:** As your examples show, they only work if you *know* the "correct" fundamental scale (which you rarely do for ignorance).
      *   **Many MaxEnt Priors:** MaxEnt depends crucially on the *choice of constraints* and the *underlying measure* (discrete, uniform on `x`, uniform on `log x`?). Maximizing entropy is not invariant to reparameterization. Uniform on `x` is maxent for location under variance constraint, but uniform on `log x` is maxent for scale under log-variance constraint.
      *   **Simplicity/Convention:** Picking a convention doesn't solve the invariance problem; it just hides it.

  ### What (Sort Of) Works & Its Trade-offs
  The most common attempt to satisfy Invariance (A) is:

  *   **Jeffreys Prior:** Defined as `π(θ) ∝ sqrt[det I(θ)]`, where `I(θ)` is the Fisher Information Matrix of the sampling model `p(x|θ)`.
      *   *Delivers Invariance (A):* By construction, invariant under smooth 1-to-1 reparameterization. Uses the *model's information geometry* (how data informs θ) to define the "natural" scale.
      *   *Satisfies:* Coherence (if posterior proper), Conditional Compatibility, Justification by Info State (arguably, based on data sensitivity), Distinction Preservation (can be improper/vague).
      *   *Violates:* Definiteness/Properness (B) (often improper, e.g., location parameters, scale parameters over (0, ∞)). Can be computationally awkward. Can violate the Likelihood Principle in multi-parameter settings. Poor performance in high dimensions or with non-iid data is common. Doesn't directly address "no information" outside the specified model.
      *   *For Rectangle:* Jeffreys prior for Binomial(`n`, `p`) (which models `w` if you think of the machine "choosing" width independently) is `π(p) ∝ 1/sqrt[p(1-p)]` (Beta(1/2, 1/2)). `P(area < 0.1) = P(p(1-p) < 0.1)` using *this* prior yields yet another distinct answer (≈0.61), but it's the *same* answer whether you parameterize in `p`, `a`, or `r`! The answer changes because the justification changed (data sensitivity of a Binomial model), but it's invariant *under that model's parameterization*.

  ### Summary & Practical Advice

  1.  **No Free Lunch:** There is **no universal, strictly "uninformative" prior** satisfying all desirable properties (especially Invariance + Properness) for general continuous parameters. Accept this.
  2.  **"Ignorance" is Contextual:** True ignorance priors don't really exist. Priors should reflect *known symmetries* or *model information structure* (like Jeffreys), *not* an absence of thought. Ask: "What symmetry or invariance property *am I actually assuming?*" (e.g., "I assume all *locations* are equally probable" justifies uniform on location).
  3.  **Jeffreys is the Default Attempt for Invariance:** When reparameterization invariance under the specified model is the primary concern and you need *a* default, use Jeffreys prior. Understand it's often improper and its justification stems from the data model, not pure ignorance.
  4.  **Vague Proper Priors are Often Pragmatic:** When computation or impropriety is a major concern, use proper priors that are *diffuse relative to the expected information in the data* (e.g., Normal(0, large_sd) for location, Gamma(small, small) for precision). Acknowledge they are *weakly informative*, not truly ignorant, and choice of scale matters. Sensitivity analysis is crucial.
  5.  **Defend Symmetry, Not Uniformity:** If you use a uniform prior, justify why *symmetry holds on that specific scale*. "I know nothing" isn't justification. "The problem is symmetric in `log(θ)`" justifies `π(θ) ∝ 1/θ`.
  6.  **Embrace the Rectangle:** Your toy problem isn't a flaw; it's the core lesson. Different "uniform" assumptions imply different physical mechanisms for generating rectangles. The prior encodes assumptions about the *data-generating process*. Specify that process to choose the prior. If you *truly* know nothing about the process *except* perimeter=2, then an ignorance prior is fundamentally undefined. You *need* more context (e.g., "width is chosen uniformly" vs. "area is chosen uniformly").

  **The Bottom Line:** Stop trying to represent "no information." Instead, identify the *minimal, defensible symmetry or structure* implied by the context or the model itself (like data sensitivity), and use a prior respecting *that* (Jeffreys is often the formalization of this). Be transparent about the assumptions embedded in your prior choice and conduct sensitivity analyses. "Uniform by default" is almost always indefensible.
