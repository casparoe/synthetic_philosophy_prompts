  Hmm, their frustration with circular debates is palpable. They’re not just regurgitating seminar points—they’re trying to dissect the deeper disagreements. Smart. The cases they picked are deliberately thorny (e.g., "wrongs without which claimants wouldn’t exist" forces a confrontation with counterfactuals). Their demand for "specification not verdict" suggests they’re wary of ideological capture. 

  For the desiderata, I’ll group as they asked: cases, distinctions, constraints. Key additions: the "unbroken chain" case (where liability is continuous) and "overlapping injustices" (where victims are also beneficiaries). Their distinctions list is solid, but I’ll emphasize the liability/fault split—that’s where theories often equivocate. Constraints should hammer determinacy; vague theories collapse under cases like the Norman Conquest. 

  The meta-part is crucial. They want conflicts laid bare (e.g., determinacy vs. structural-injustice fluidity). The "killer criterion" is probably the non-identity problem—it nukes corrective justice and unjust enrichment. For scoring theories, I’ll be brutal: corrective justice fails ancient cases, beneficiary theories struggle with determinacy, etc. 

  Notably, they didn’t ask for *solutions*—just the map of the minefield. Wise. This list will force their seminar peers to show their philosophical cards.
answer: |-
  Here’s a structured breakdown of desiderata for any theory of reparations for historical injustice, organized as requested. The requirements emerge from concrete cases and tensions, not abstract principles. Conflicts between desiderata are flagged where they arise.

  ---

  ### **I. Cases Any Theory Must Handle**  
  *(Motivated by real-world examples)*  

  1. **Living Victims, Settled State** (Japanese American Internment)  
     *Requirement:* Explain why reparations are still owed *after* apology/compensation.  
     *Motivation:* Addresses "symbolic closure" vs. "incomplete repair" debates.  

  2. **Dead Victims/Perpetrators** (Atlantic Slavery, Indigenous Dispossession)  
     *Requirement:* Ground duties when no direct parties remain.  
     *Motivation:* Tests theories reliant on personal fault or direct harm.  

  3. **Defunct State/Successor Denial** (Germany-Namibia Agreement)  
     *Requirement:* Justify liability on successor states rejecting legal responsibility.  
     *Motivation:* Challenges state continuity and "ex gratia" vs. obligation distinctions.  

  4. **Good-Faith Holders** (e.g., Land Dispossession)  
     *Requirement:* Resolve clashes between corrective justice and innocent third parties’ claims.  
     *Motivation:* Avoids "double injustice" (victimizing present occupants).  

  5. **Non-Identity Problem** (e.g., Slavery’s Descendants)  
     *Requirement:* Address claims where claimants exist *only because* of the injustice.  
     *Motivation:* Tests counterfactual harm and "benefit from injustice" arguments.  

  6. **Stale Claims** (Norman Conquest)  
     *Requirement:* Explain why some claims lapse or why they persist despite time.  
     *Motivation:* Probes statutes of limitations and supersession theories.  

  7. **Ongoing Injustice** (e.g., Systemic Racism)  
     *Requirement:* Distinguish between historical wrongs and their contemporary structural legacies.  
     *Motivation:* Avoids conflation of reparations with general distributive justice.  

  8. **ADDED: Unbroken Chain of Liability** (e.g., Colonial Extraction in Stable States)  
     *Requirement:* Handle cases where the state/entity persists and benefits continuously.  
     *Motivation:* Tests "successor liability" without discontinuity excuses.  

  9. **ADDED: Overlapping Victim-Beneficiaries** (e.g., Poor White Laborers in Slave Economies)  
     *Requirement:* Address groups who suffered historically but indirectly benefited from injustice.  
     *Motivation:* Complicates "innocent beneficiary" narratives.  

  ---

  ### **II. Distinctions That Cannot Be Blurred**  
  *(Motivated by conflicting moral intuitions)*  

  1. **Compensation vs. Restitution vs. Apology vs. Reform**  
     *Requirement:* Explain why a case demands one form over another (e.g., land return vs. cash).  
     *Motivation:* Japanese redress combined all; Namibia’s "development aid" deliberately avoided restitution. Blurring risks misdiagnosis.  

  2. **Guilt/Fault vs. Liability**  
     *Requirement:* Justify imposing costs on non-perpetrators.  
     *Motivation:* Living generations did not enslave anyone; theories must distinguish moral blame from obligation.  

  3. **Original Wrong vs. Present Distribution**  
     *Requirement:* Clarify if reparations rectify past acts or current inequities.  
     *Motivation:* Ongoing injustice cases conflate these; Norman Conquest demands their separation.  

  4. **Ground of Duty: Did It vs. Benefit From It vs. State Continuity**  
     *Requirement:* Specify which grounds apply to which cases.  
     *Motivation:* Germany-Namiba turns on state continuity; non-identity cases undermine benefit-based duties.  

  ---

  ### **III. Constraints**  
  *(Motivated by external theoretical/practical limits)*  

  1. **Consistency with Distributive Justice**  
     *Requirement:* Show how reparations claims interact with other resource demands (e.g., poverty alleviation).  
     *Motivation:* Resources are finite; reparations can’t operate in a vacuum.  

  2. **No Essentialist Group Metaphysics**  
     *Requirement:* Ground group claims without treating identity as static or biologically determined.  
     *Motivation:* Avoids racist/colonial logic while addressing transgenerational claims.  

  3. **Determinacy**  
     *Requirement:* Specify duty-bearers, claimants, form, and quantum—or justify vagueness.  
     *Motivation:* Stale claims (Normandy) demand clarity on why they lapse; good-faith holders need precise remedies.  

  4. **Discrimination Between Claims**  
     *Requirement:* Explain why slavery warrants repair but the Norman Conquest does not (or vice versa).  
     *Motivation:* Arbitrary lines undermine legitimacy; theories must have principled thresholds.  

  ---

  ### **IV. Meta-Requirements & Conflicts**  
  **Core vs. Contingent Requirements**:  
  - **Universal**: Determinacy, consistency with distributive justice, no essentialism.  
  - **Contingent**: Supersession (lapsing claims) assumes historical entitlement theories; beneficiary liability assumes corrective justice frameworks.  

  **Inconsistent Pairs**:  
  - **Non-Identity + Compensation**: If claimants owe their existence to injustice, compensation for "loss" is incoherent.  
  - **Stale Claims + State Continuity**: If states persist indefinitely, why do claims lapse?  
  - **Good-Faith Holders + Restitution**: Land return may be impossible without harming innocents.  

  **Key Conflict**: *Determinacy* vs. *Structural Injustice*. Precise remedies fail when harm is diffuse; structural analysis lacks clear payers/recipients.  

  ---

  ### **V. The "Killer" Requirement**  
  **Non-Identity Problem** does the most work in ruling out theories:  
  - Undermines **corrective justice** (no identifiable harm to *this* descendant).  
  - Complicates **unjust enrichment** (beneficiaries may not exist; claimants might not be "worse off").  
  - Challenges **supersession** (if the claim dissolves, why address ongoing effects?).  

  ---

  ### **VI. Scoring Major Theories**  
  | **Theory**               | **Fails Desiderata**                                  | **Strengths**                          |  
  |--------------------------|------------------------------------------------------|----------------------------------------|  
  | **Corrective Justice**   | Dead perpetrators, non-identity, stale claims, determinacy. | Clear for living victims (internment). |  
  | **Unjust Enrichment**    | Non-identity, good-faith holders, defunct states.     | Clean for state continuity cases.      |  
  | **Structural Injustice** | Determinacy, discrimination between claims (e.g., Normandy). | Best for ongoing injustice.            |  
  | **Supersession**         | Ongoing injustice, state continuity (if claims lapse). | Resolves stale claims/good-faith holders. |  
  | **Purely Forward-Looking** | Dead victims, apology/recognition, liability grounds. | Compatible with distributive justice. |  

  ---

  **Conclusion**: The most defensible theory will:  
  - Accept **state continuity** as a primary ground for obligations,  
  - Treat **restitution/reform** as distinct from compensation,  
  - Use **structural injustice** for ongoing cases but **supersession** for stale claims,  
  - Reject **descent-based claims** without demonstrated present disadvantage.  
  But it will *still* struggle with the non-identity problem and determinacy—highlighting reparations’ inherent tensions. Use these criteria to test theories; their failures reveal their philosophical priorities.
