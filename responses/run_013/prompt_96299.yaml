  We are creating a decision procedure for evaluating evolutionary explanations of human traits. The procedure must be runnable in under an hour, by someone with basic knowledge (understands selection vs. drift but not a model-builder). It must address three key issues: 
    1. Difference between heritability and selection.
    2. Handling cross-cultural universality when that's the only evidence.
    3. Whether current fitness enhancement implies adaptation.

  The procedure will be a numbered sequence of steps. Each step has a question and what counts as a sufficient answer. We will then identify failure modes (where it misfires and what to do). Finally, we apply it to three claims.

  Procedure:

  1. **Is the trait clearly defined and measurable?**
     - Sufficient answer: The trait is described in a way that allows for consistent identification and measurement across individuals and contexts. If not, stop: do not publish as an evolutionary claim (or hand to human for clarification).

  2. **Is there evidence that the trait is heritable?**
     - Sufficient answer: There is at least one study (even if limited) that shows the trait has a genetic component (e.g., twin studies, family studies). Note: This does not prove adaptation, but without it, the trait cannot be an adaptation by natural selection (it could be a byproduct of something heritable, or cultural). If no evidence of heritability, then the trait might be entirely cultural or environmental. Proceed to step 3, but note that without heritability, the claim cannot be an adaptation by natural selection.

  3. **Is the trait currently fitness-enhancing?**
     - Sufficient answer: There is evidence that possessing the trait in the current environment leads to higher reproductive success (or at least, did in the past when the trait evolved). But note: current fitness enhancement does not necessarily mean it was selected for (it could be a recent coincidence). Also, a trait that is currently fitness-reducing might have been adaptive in the past. This step is not decisive but informs step 4.

  4. **Is there evidence of cross-cultural universality?**
     - Sufficient answer: The trait has been observed in multiple, diverse human cultures (especially including hunter-gatherer societies) and is not easily explained by cultural diffusion. If the only evidence is cross-cultural universality, then we have weak evidence for an evolved trait (but it could also be a cultural universal). However, without heritability (from step 2), universality does not imply genetic adaptation.

  5. **What is the evidence that the trait was selected for (as opposed to being a byproduct or drift)?**
     - We are looking for:
          a. Evidence of design: The trait shows complexity and specificity for a function that would have enhanced fitness in the ancestral environment.
          b. Comparative evidence: The trait is present in related species and has been linked to fitness in those species or shows a phylogenetic pattern consistent with selection.
          c. Population genetic evidence: Signatures of selection in the genes associated with the trait (e.g., from genome-wide scans).
          d. Experimental evidence: Manipulation of the trait affects fitness in a predicted way (rare for human traits).
     - Sufficient answer: At least one line of evidence from a-d. If none, then the trait might be a byproduct or due to drift.

  6. **Are there alternative explanations that are equally or more plausible?**
     - Consider:
          - Byproduct (spandrel): The trait is a side effect of an adaptation for another purpose.
          - Genetic drift: The trait is neutral and fixed by chance.
          - Cultural evolution: The trait is transmitted culturally and may not have a genetic basis.
          - Recent environmental change: The trait is currently adaptive but was not in the past (so not an adaptation by natural selection).
     - Sufficient answer: If one or more alternatives are well-supported by evidence (or even if they are just as plausible given the lack of evidence for selection), then the evolutionary claim is weak.

  7. **Synthesis: Making the ruling**
     - If the trait is not heritable (step 2) and the claim is about genetic adaptation: reject as an evolutionary claim (by natural selection). It might be a cultural adaptation, but that's outside our scope for an evolutionary claim by natural selection.
     - If there is no evidence for selection (step 5) and alternatives (step 6) are plausible, then the claim is weak.
     - If the only evidence is cross-cultural universality (step 4) and no heritability (step 2) or selection (step 5), then the claim is weak.

  We will have three verdicts:
     - "publish as a live hypothesis": Strong evidence for adaptation, with no major alternative that is more plausible.
     - "publish only with the alternatives stated": Some evidence for adaptation, but alternatives are also plausible and must be mentioned.
     - "do not publish as an evolutionary claim": The evidence for adaptation is too weak (e.g., no heritability, no evidence of selection, or a more plausible alternative).

  Additionally, we note that at certain points we might need a human call (e.g., when the evidence is ambiguous and the editor must decide on grounds of taste).

  Failure modes (as a table):

  | Step | How it misfires | What to do about it |
  |------|-----------------|---------------------|
  | 1    | The trait is defined in a circular way (e.g., "beauty is what we find beautiful") making it impossible to measure. | Stop and do not publish as an evolutionary claim (or hand to human if the editor thinks it's worth redefining). |
  | 2    | Heritability might be overestimated by studies with poor designs (e.g., twin studies that don't account for shared environment). | Note the limitation and proceed, but flag that the evidence is weak. In the verdict, require stating alternatives. |
  | 3    | Current fitness enhancement might be due to a novel environment, so not evidence of past selection. | This step is only informative. Do not rely on it alone. Always require step 5. |
  | 4    | Universality might be due to shared cultural history, not evolution. | If universality is the only evidence and there's no heritability (step 2) or selection (step 5), then the claim is weak. |
  | 5    | Evidence of selection might be misapplied (e.g., a genetic signature of selection might be for a different trait). | This step requires careful reading. If the evidence is ambiguous, then step 6 (alternatives) becomes more important. In case of ambiguity, the verdict should be "publish only with alternatives stated". |
  | 6    | Some alternatives might be overlooked because they are not well-known. | This step is inherently subjective. If the editor feels uncertain, make a human call (and in the procedure, require that when in doubt, state alternatives). |

  The procedure cannot adjudicate claims that are purely about cultural evolution (without a genetic component) or claims that are not testable (e.g., "this trait evolved because of group selection" without any way to test against individual selection). Also, it might misfire when the evidence is mixed and the editor must use judgment.

