answer: |-
  ### Decision Procedure for Evaluating Evolutionary Claims

  **Procedure Steps**  
  1. **Trait Definition**: Is the trait unambiguously defined and measurable?  
     *Sufficient answer*: Clear operational definition exists (e.g., physiological, behavioral, or psychological criteria).  
  2. **Heritability**: Is there evidence the trait is heritable?  
     *Sufficient answer*: At least one published study (e.g., twin, family, or GWAS) indicating genetic influence (not necessarily >0% heritability).  
  3. **Current Fitness Link**: Does the trait currently correlate with reproductive success?  
     *Sufficient answer*: Data (even observational) linking trait expression to survival/reproduction in at least one population.  
  4. **Universality**: Is the trait cross-culturally universal?  
     *Sufficient answer*: Documented in ≥3 distinct cultures (including hunter-gatherers if possible).  
  5. **Adaptation vs. Byproduct**: Is there evidence the trait was *selected for* (not a byproduct)?  
     *Sufficient answer*: ≥1 of:  
     - (a) **Design evidence**: Trait complexity/specificity matches a fitness problem in ancestral environments.  
     - (b) **Phylogenetic evidence**: Trait absent in closely related species without the proposed selective pressure.  
     - (c) **Genetic signature**: Population genetics data (e.g., selective sweep, dN/dS ratio) supporting recent selection.  
  6. **Alternative Plausibility**: Are non-adaptive alternatives equally/more plausible?  
     *Sufficient answer*: Alternatives (e.g., drift, byproduct of general adaptation, cultural transmission) supported by published evidence or mechanistic reasoning.  

  **Synthesis Rules**  
  - **Publish as live hypothesis**: Passes Steps 1–2 and 5; fails Step 6.  
  - **Publish with alternatives stated**: Fails Step 5 OR passes Step 6.  
  - **Do not publish as evolutionary claim**: Fails Step 1 OR (fails Step 2 AND universality is only evidence) OR no published evidence exists.  
  - **Human call required**: Ambiguity in defining trait (Step 1) or weighing alternatives (Step 6).  

  **Failure Modes**  
  | Step | How It Misfires | Mitigation |  
  |------|-----------------|------------|  
  | 2 | Confuses heritability with selection. Heritability ≠ adaptation. | Proceed to Step 5; never use alone to confirm adaptation. |  
  | 4 | Universality misattributed to genetics (e.g., cultural diffusion). | Without Step 2/5, universality is weak evidence; default to "publish with alternatives". |  
  | 5 | Overlooks byproducts (e.g., assumes current utility implies past selection). | Require direct evidence (5a–c); if absent, favor alternatives. |  
  | 6 | Misses subtle alternatives (e.g., exaptation, developmental constraints). | If alternatives exist in literature, cite them regardless of strength. |  

  **Unadjudicable Claims**  
  - Group selection arguments without individual-level evidence.  
  - Traits with no testable predictions (e.g., "evolved for spiritual fulfillment").  
  - Claims relying solely on fossil/archaeological data with no genetic or comparative support.  

