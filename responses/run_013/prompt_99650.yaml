prompt: |-
  I am leading a single session of a graduate reading group in philosophy. My readers have no biology beyond school, but all of them have absorbed the popular gene-centred framing of evolution and assume that the units-of-selection debate is a contest in which one must decide whether selection really acts on genes, on individuals, or on groups. I want a plan for teaching them otherwise — not an explanation of the debate itself. Set out the order in which the ideas have to come, and say what depends on what: I take it that some account of heritable variation in fitness-relevant traits, and of selection being partitioned into a within-group and a between-group component, must precede any talk of units, and that the notion of a unit of selection has to be prised apart from that of a replicator. Nominate the one concrete case that should carry the session; say what it must contain (opposing selection at two levels, so that the gene-centred and multilevel framings can be seen as reformulations of one another rather than rivals) and what it must avoid. Set out the misconceptions I should expect — that group selection was refuted and is therefore unscientific, that it amounts to selection for the good of the species, that the gene-centred view denies the reality of organisms, that kin selection and group selection are competing theories — and say at exactly which point in the sequence each should be headed off. Finally, give me one question to put at the end that would reveal whether they have understood the debate rather than merely learned its slogans, and tell me what I should openly refuse to cover at this level. Please write your answer in British English.
reasoning: |-
  Okay, let me approach this philosophy reading group leader's request methodically. They need a structured session plan to disentangle misconceptions about units of selection, particularly the false dichotomy between gene-centered and group selection views. 

  First, I should recognise the audience's background: philosophy graduates with basic biology but immersed in pop-science gene narratives. Their key misunderstandings seem to be: treating units of selection as mutually exclusive options, conflating replicators with vehicles, and viewing group selection as disproven or synonymous with "species good".

  The core challenge is epistemological - they need to understand multilevel selection as a partitioning method rather than a contest between entities. This requires establishing foundational concepts in sequence:
  1. Heritable variation in fitness traits as the bare minimum for any selection
  2. Selection acting simultaneously at multiple levels
  3. The replicator/vehicle distinction (Dawkins vs Hull)
  4. How group selection cases actually manifest (not species welfare)

  The concrete case study must be carefully chosen. Stickleback fish work well: ancestral marine form (high aggression) vs derived freshwater form (low aggression). Key features needed: 
  - Clear within-group disadvantage (less aggressive fish lose food)
  - Clear between-group advantage (less aggressive groups produce more migrants)
  - Avoids kin selection complications
  - Demonstrates how gene/individual/group framings describe the same process

  Timing misconceptions is crucial:
  - When introducing multilevel selection, immediately distinguish from "species good" claims
  - When presenting the case study, preempt the "group selection was refuted" objection by noting modern reformulations
  - During replicator discussion, clarify that gene-centrism doesn't deny organism reality
  - Explicitly state kin/group complementarity when comparing frameworks

  The diagnostic question should test conceptual synthesis: "If we eliminated all between-group variation in this case, would group selection disappear? What would happen to the frequency of the 'low aggression' allele?" Correct answers require understanding partition dependencies. 

  Must firmly exclude: Price equation mathematics, extended inheritance systems, cultural evolution applications. This keeps focus on conceptual foundations.

  Session flow should be:
  Conceptual foundations → Replicator/vehicle distinction → Case study with multilevel partition → Comparison of frameworks → Misconception clarifications → Diagnostic question

  The outcome should be recognising that "units of selection" debates often reflect explanatory preferences rather than ontological disputes.
answer: |-
  Here’s a structured plan for your session, prioritising conceptual sequencing, a concrete case study, and targeted misconception-busting. The goal is to reframe the debate from a "contest" to a matter of **descriptive perspective** and **partitioning of selection pressures**.

  **Core Sequence of Ideas**  
  *(Each step builds on the previous)*  
  1. **Heritable Variation & Fitness Differences**  
     - *Foundation*: Natural selection requires (a) variation in traits, (b) heritability, (c) differential fitness.  
     - *Emphasise*: Selection acts on *phenotypes* (observable traits), not directly on genes/organisms/groups.  
     - *Key dependency*: Without this, no selection at *any* level exists.  

  2. **Selection Can Operate at Multiple Levels Simultaneously**  
     - *Illustration*: A trait can increase an individual’s fitness *within* a group but decrease the group’s overall productivity (e.g., over-aggression).  
     - *Dependency*: Requires understanding that fitness is context-dependent (e.g., an individual’s success depends on group survival).  

  3. **Partitioning Selection: Within-Group vs. Between-Group Components**  
     - *Core Insight*: Total evolutionary change = change due to individual competition *within* groups **plus** change due to competition *between* groups.  
     - *Analogy*: Like calculating national GDP growth by averaging regional growth *and* accounting for population shifts between regions.  
     - *Dependency*: Steps 1–2 must be clear first.  

  4. **"Units of Selection" ≠ "Replicators"**  
     - *Define terms*:  
       - **Replicator** (Dawkins): Entity that copies itself (e.g., genes).  
       - **Vehicle** (Dawkins/Hull): Entity that interacts with environment (e.g., organism, group).  
       - **Unit of selection** (MLS theory): Level at which fitness differences are measured (gene, individual, group).  
     - *Crucial distinction*: Genes are replicators; groups/individuals are *vehicles* or *levels of selection*. They aren’t rivals.  

  ---

  **Concrete Case Study: Stickleback Fish Aggression**  
  *(After Williams 1992; avoids kin selection complications)*  
  - **Scenario**: Marine sticklebacks colonise freshwater lakes.  
    - *High-aggression allele*: Favoured **within** groups (aggressive fish steal food).  
    - *Low-aggression allele*: Favoured **between** groups (groups with fewer aggressive fish produce more migrant offspring due to less infighting).  
  - **What it achieves**:  
    - Shows opposing selection at two levels (within vs. between groups).  
    - Gene-centred view ("selfish gene" for aggression) and multilevel view (group benefit of low aggression) describe the *same process*.  
  - **What it avoids**:  
    - Kin selection (groups are not necessarily related).  
    - "Good of the species" (selection is localised, not species-wide).  
    - Anthropomorphism (no "altruism" required).  

  ---

  **Misconceptions & When to Address Them**  
  1. **"Group selection was refuted"**  
     - *When*: During partitioning discussion (Step 3).  
     - *Response*: Early critiques (e.g., Williams 1966) rejected **naïve group selection** (e.g., "for the species"). Modern multilevel selection (MLS) is mathematically rigorous (Price equation) and empirically validated.  

  2. **"Group selection = selection for the good of the species"**  
     - *When*: Introducing the case study.  
     - *Response*: MLS involves competition among *local groups*, not species-wide benefits. Use the stickleback example: low-aggression groups outcompete *other groups*, not "benefit the species".  

  3. **"Gene-centred view denies organisms’ reality"**  
     - *When*: Discussing replicators vs. vehicles (Step 4).  
     - *Response*: Gene-centrism explains *why* traits evolve but doesn’t claim organisms are "unreal". Organisms are the primary *vehicles* of selection.  

  4. **"Kin selection and group selection are rivals"**  
     - *When*: After presenting the case study.  
     - *Response*: Kin selection is a *mechanism* that can strengthen group selection (via relatedness) but isn’t necessary. MLS applies regardless of kinship.  

  ---

  **Diagnostic Question**  
  > **"In the stickleback case, if we eliminated all variation *between* groups (e.g., by constantly mixing populations), would the low-aggression allele still be eliminated? Why?"**  
  - **Tests understanding**: Reveals if they grasp that:  
    - Within-group selection alone favours high aggression.  
    - Between-group variation is essential for group selection to act.  
    - The allele’s fate depends on how we partition selection.  

  **What to Refuse to Cover**  
  - **Price Equation mathematics**: Acknowledge its existence but defer as "beyond scope".  
  - **Cultural evolution or human examples**: Introduces confounding variables (e.g., intentionality).  
  - **Extended replicators (e.g., memes)**: Diverts focus from core biological debate.  

  **Session Flow Summary**  
  1. Foundations: Heritability, variation, fitness (10 mins).  
  2. Selection at multiple levels + partitioning (15 mins).  
  3. Stickleback case study (15 mins).  
  4. Replicator vs. vehicle distinction (10 mins).  
  5. Misconception busting integrated throughout.  
  6. Diagnostic question + wrap-up (10 mins).  

  This approach disentangles levels of analysis from ontological commitments, showing that "gene-centred" and "multilevel" are complementary frameworks—not warring paradigms. The stickleback case makes the abstract concrete while avoiding red herrings like kinship or species welfare.
