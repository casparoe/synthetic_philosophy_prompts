prompt: |-
  So I run a small interview podcast about epistemology — basically me and whoever I can convince to come on — and next week's guest is a philosopher whose new book makes a claim I keep turning over. Her line is that the accuracy-first program gets the order of explanation backwards. By accuracy-first I mean the package where credences get assessed by how accurate they are, accuracy is measured by a scoring rule like the Brier score (the proper ones being the ones that reward you for saying what you actually think rather than for hedging), and the governing norm is to pick the credence function with the highest expected accuracy — which is what's supposed to get you probabilism out of a dominance argument and conditionalization out of expected accuracy. She thinks accuracy isn't valuable in itself and then used to justify the norms; she thinks the norm comes first, and the claim that accuracy is epistemically good is something we install by convention — a rule the epistemic community adopts and passes along, which is why it feels like it has authority even though nothing more basic backs it up. She also argues thats a feature rather than a bug: it explains why an accuracy-firster can't answer the question of why anyone should care about accuracy without begging it.

  I want to press her on this without letting her just restate the book. Give me nine or ten questions, and for each one that's likely to draw a stock reply, add a one-line follow-up keyed to that reply. Please make sure there's at least one question each on: (1) the order-of-explanation reversal and whether it's circular — if norms come first and the norms are conventions, where does the first convention get its authority; (2) the structural vs. substantive issue, i.e. whether on her view a perfectly coherent agent with absurd priors is doing anything epistemically wrong at all, and what she says to people who think that's the only thing we wanted a theory of credence to deliver; and (3) self-application — what credence her own view says she should have in her own view, and whether a theory whose norms are local conventions can claim to be telling anyone else what to believe.

  One more thing I'd like somewhere in there: a concrete case. There's a forecasting lab whose internal scoring convention rewards decisiveness, so a member who says 0.5 about a genuinely chancy event gets marked down for hedging. I want a question that forces her to say whether that member is being epistemically irrational or just living under a different convention, plus a follow-up for whichever way she goes. And if you can fit it in, one question on whether any of this survives when the credences are imprecise rather than precise.

  She's sharp and a bit combative, so questions that leave her an obvious exit aren't much use to me.
reasoning: |-
  Okay, let me start by unpacking what the user needs. They host a podcast on epistemology and have an upcoming guest who challenges the accuracy-first program. The guest argues that norms come before accuracy, which is a convention adopted by the epistemic community. The user wants pointed questions to challenge this view without letting the guest fall back on rehearsed answers.

  First, I need to cover the three main areas specified: order of explanation, structural vs. substantive norms, and self-application. Also, the concrete case about the forecasting lab and imprecise credences. The user mentioned the guest is combative, so questions need to block obvious exits.

  For the order of explanation, the key is circularity. If norms are conventions, where does the authority come from? The follow-up should address whether appealing to community acceptance just pushes the problem back. The user wants to avoid the guest restating her book, so the follow-up needs to cut off that escape route.

  Next, structural vs. substantive. If an agent has coherent but absurd priors, is that epistemically wrong? The follow-up here should challenge whether her view reduces to "anything goes" if coherence is all that matters. This hits the core of what epistemology should deliver—more than just consistency.

  Self-application is tricky. The guest must apply her own norms to her view. The follow-up needs to question whether her meta-belief about the convention undermines her commitment. If the norm is local, how can it prescribe to others? The follow-up should press on whether this leads to relativism.

  The forecasting lab case is a concrete test. If the lab values decisiveness over accuracy, is that irrational or just different? The follow-up should force her to either bite the bullet (all conventions are equal) or concede that some norms are better, which might contradict her view.

  Imprecise credences add complexity. How does her convention-based approach handle them? The follow-up should challenge if this leads to fragmentation, questioning the stability of conventions without precise measures.

  I also need to consider deeper needs. The user likely wants to expose weaknesses in the guest's argument, pushing her to defend against accusations of relativism or circularity. They might want content that engages listeners by highlighting contentious points. Ensuring questions are concise yet layered with follow-ups that prevent evasion is key. Balancing depth with clarity so the audience can follow without losing rigor. Including a mix of theoretical and concrete questions keeps the discussion grounded. Finally, ensuring each question tightens the dialectic, leaving the guest no easy outs.
answer: |-
  Here are 10 targeted questions designed to press her core claims, prevent restatements, and address your specific requirements, including follow-ups for likely stock replies. They are ordered for a logical flow but designed to be interjected as needed.

  1.  **Core Challenge - Origin of Authority:** "You argue epistemic norms are conventional, installed by the community *before* we value accuracy. But where does the *first* convention get its *authority*? What makes an agent, before being enculturated into *any* epistemic community, recognize or feel bound by the proto-norm 'adopt the community's scoring rules'?"
      *   *If she replies it's innate/socially transmitted/just how we start:* "But doesn't that just push the question back? Why *should* an innate impulse or social pressure to adopt *this specific convention* (accuracy-seeking) count as *epistemic* authority rather than mere biological or social conditioning?"

  2.  **Circularity Charge:** "Isn't there a vicious circle? We adopt a norm (e.g., maximize expected accuracy) by convention. We then say accuracy (defined by the scoring rule tied to that norm) is epistemically valuable *because* it satisfies the norm. But the norm only exists *because* we conventionally adopted it to value accuracy. Where's the non-circular explanatory purchase?"
      *   *If she says the convention breaks the circle/is the foundation:* "But doesn't calling it a 'convention' simply name the circle rather than dissolve it? How does labeling it 'conventional' explain *why* that specific convention (accuracy-seeking) gains traction and feels authoritative, rather than, say, a convention rewarding decisiveness?"

  3.  **Structural vs. Substantive - The Coherent Absurdist:** "Take an agent with perfectly probabilistically coherent credences based on utterly absurd priors (e.g., 0.999 that the moon is cheese, updated correctly on all evidence). On your view, since they follow the 'local convention' of coherence (a structural norm), are they doing *anything epistemically wrong* at all? Or is epistemic evaluation *solely* about internal rule-following?"
      *   *If she says they are structurally fine/only wrong by external standards:* "Doesn't this concede that your account *cannot* capture what many see as the core epistemic failure – believing crazy things for bad reasons? Isn't 'avoiding blatant falsehood' a more fundamental epistemic aim than mere coherence-by-convention?"

  4.  **The Forecasting Lab Case - Convention vs. "Irrationality":** "Imagine a forecasting lab whose internal scoring rule harshly penalizes credences near 0.5 for genuinely chancy events, rewarding extreme confidence (0 or 1) instead. A member assigns 0.5 to a fair coin flip and gets marked down. By your view, is this member being *epistemically irrational*, or are they simply violating a different local convention (decisiveness over accuracy)?"
      *   *If she says it's just a different convention:* "So, on your view, there's *no epistemic basis* to say the accuracy-scoring lab is doing something *epistemically better* than the decisiveness-scoring lab? They are just different games?"
      *   *If she hints accuracy is somehow special:* "What, beyond *our* convention, makes accuracy special? Doesn't appealing to its specialness here undermine the claim that *all* value flows *from* the convention?"

  5.  **The Point of Epistemology:** "If, as your view implies, the *only* thing epistemology can demand is internal coherence according to locally adopted rules (even with absurd priors), what substantive work is left for a *theory of credence* to do? Isn't the demand for more – for a connection to truth/accuracy/reality – precisely what motivated accuracy-first in the first place?"
      *   *If she says epistemology only governs structure/rules:* "Then why call it *epistemology* (study of knowledge/justification) rather than just 'logic of belief systems'? Doesn't this drain the field of its traditional normative force regarding *what* we should believe about the world?"

  6.  **Self-Application - Credence in the View:** "What credence does your *own* view prescribe that you should have *in your own view*? Given that your view claims epistemic norms are conventional, doesn't it imply that your belief in this view itself is only justified relative to *our* current epistemic conventions? Doesn't this radically undermine its claim to universal truth?"
      *   *If she says she has high credence based on current norms:* "But since your theory says those norms lack deeper justification, doesn't this mean your high credence is, by your own lights, ultimately groundless – just playing by the current rules? Why should anyone *else* adopt those rules based on this argument?"

  7.  **Prescriptive Reach Beyond the Convention:** "If norms are local conventions, how can your theory *prescribe* anything to someone outside the convention (e.g., a skeptic, an agent in a different epistemic community, or our forecasting lab member)? Isn't saying 'you *should* follow *our* accuracy norms' just saying 'you should play *our* game', which has no force if they don't want to play?"
      *   *If she says it only applies within the community:* "Then how is this *epistemology* rather than sociology? What resources does it offer to *persuade* someone to join *our* epistemic game rather than another?"

  8.  **Imprecise Credences:** "How does your conventionalist view handle imprecise credences (sets of probabilities)? Accuracy-first struggles to define 'scoring' here. If the 'accuracy norm' is just a convention we install, could a convention *routinely* prescribing imprecision (e.g., always assign [0.3, 0.7] to unknowns) be epistemically legitimate? Or does the conventional nature *require* precise measures like Brier to function?"
      *   *If she says imprecision is compatible/requires different conventions:* "Doesn't this lead to radical fragmentation? If *any* rule can be conventionally installed (precision, imprecision rules, decisiveness rules), how do we even identify a *coherent* set of 'epistemic' conventions distinct from arbitrary social rules?"

  9.  **Motivation & Bootstrapping:** "Accuracy-first aims to *justify* why we should care about coherence and updating by linking them to accuracy. You say accuracy's value is installed *by* the norms. How does this convention *motivate* an agent to adopt the norms in the first place? Isn't it bootstrapping: 'Adopt these rules because they are the rules, and we'll define value as following them'?"
      *   *If she says motivation comes from enculturation/social pressure:* "But then isn't the ultimate 'reason' to be epistemic (by our standards) just 'because society says so'? Doesn't this reduce epistemic rationality to social conformity in a way that seems deeply unsatisfying for a *philosophical* account?"

  10. **The "Feature, Not Bug" Claim - Begging the Question:** "You argue it's a *feature* that your view can't non-circularly say why we should care about accuracy – because it exposes the conventional base. But doesn't this simply *embrace* the very circularity/regress that accuracy-first was trying to *solve*? If the best we can do is point to our convention, haven't we abandoned the project of *epistemic justification* altogether?"
      *   *If she says justification is always internal to a practice/convention:* "Then why call it 'epistemic' justification? Doesn't this collapse the distinction between being epistemically justified and merely following the locally accepted procedure, however arbitrary?"

  **Key Tactics Embedded:**

  *   **Blocks Restatement:** Questions force engagement with implications (absurd priors, self-application, other conventions) rather than rehashing the book's core thesis.
  *   **Forces Choices:** The forecasting lab question makes her choose: epistemic relativism or concede accuracy's special status. Both choices create tension with her view.
  *   **Targets Weak Points:** Focuses relentlessly on the origin of authority, the threat of relativism/arbitrariness, self-undermining, and the inability to capture substantive epistemic failure.
  *   **Follow-ups Pre-empted:** Anticipates common deflections ("it's conventional," "it's how we start," "only structural norms matter") and immediately challenges them.
  *   **Combative Edge:** Questions are phrased to highlight tensions and potential contradictions within her view, leaving little room for comfortable evasion. They demand she explain *why* her view isn't arbitrary, relativist, or self-defeating.

  Use these as a toolkit – jump in where the conversation flows, but be ready with the follow-ups when she gives the predicted responses. Good luck with the interview!
