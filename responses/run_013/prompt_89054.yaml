prompt: |-
  I've been asked to run a ninety-minute session — whiteboard, no slides — on the naturalism-versus-normativism debate about health and disease, in a medical humanities elective that's open to the whole university. The room is about a third clinical students and two-thirds humanities students, almost none of whom have read any philosophy of medicine, and they arrive holding opposite dogmas: the clinicians think a disease is a fact about a body that a pathologist could in principle settle, the humanists think calling something a disease is obviously a social judgment, and each side reads the other as either naive or sentimental. I don't want the explanation itself; I want a plan for teaching it. What has to be in place before the question even looks like a real question rather than a fight about words? Which pieces depend on which — specifically, when the notion of a species-typical function has to arrive, whether the evaluative element in harm can be introduced before the naturalist position has been stated at full strength or only after it has, and where the hybrid positions (the ones that keep a biological dysfunction condition and add a harm condition) belong in the arc: before the students have felt the pull of either pure position, or after, and what each ordering buys me? And what should I openly refuse to cover at this level, saying so out loud?

  For the case that carries the session, my sister, who is a GP, has given me one, and I need you to tell me honestly whether it can bear the weight. Two men in their early fifties come in during the same week; both had a scan for an unrelated complaint, and both turn out to have the same incidental structural anomaly in the heart muscle; both are asymptomatic, both sail through an exercise test, both have the same numbers on every measure of how their bodies currently perform. The only difference is that one of them has a relative who dropped dead at thirty, and the other does not. My sister says the two men leave with the same sentence in their charts and utterly different standing as patients: one is now a cardiac patient for life, the other is a man with an interesting variant. Nothing in either body distinguishes them. Is this the right carrying case — what does it have to have, and what must it conspicuously lack, for the group to feel the naturalist's discomfort and the normativist's temptation without my having rigged it? Does it smuggle in the verdict by calling the finding an anomaly in the first place? And what second case should I pair it with, so that the naturalist isn't left looking like a straw man by the end of the hour?

  I expect at least these misconceptions and want to know which are genuine misconceptions rather than defensible readings: that normativism means any condition a society dislikes is thereby a disease; that naturalism is the safe view because it merely reports the biology and leaves values out; that value-laden means arbitrary; and that disease and illness are interchangeable. Tell me where in the sequence each will form, which one I should let stand for a while rather than correct on the spot, and which will be manufactured by my own framing rather than by the students. I also want to hand the room a two-question test to apply to any candidate disease — is some bodily process going wrong by the standards of how bodies of this kind work, and is that going wrong a misfortune for the person living this life — and I suspect that scaffold quietly leans normativist; tell me whether it begs the question against the naturalist by assuming the two questions can come apart, and if it does, what to replace it with. Finish with the question I should put to the room in the last ten minutes that would reveal whether they've grasped the structure of the dispute rather than memorized a side, and say what a good answer to it would and would not contain. No readings, please — I want the teaching plan.
reasoning: |-
  Okay, let me unpack this complex teaching request. The user is preparing a 90-minute medical humanities session on the naturalism vs. normativism debate about health and disease, facing a mixed audience of clinical and humanities students with opposing preconceptions. They need a structured teaching plan that avoids slides, uses whiteboarding, and carefully sequences concepts to make the philosophical dilemma feel real rather than semantic.

  First, considering the audience dynamics: clinicians likely hold biological-reductionist views while humanists lean toward social-constructionist perspectives. The core challenge is making both sides feel their position is being fairly represented before exposing its limitations. The user's sister's cardiac anomaly case seems promising but requires scrutiny - does calling it "anomaly" bias the premise? 

  For the session architecture, I'm considering a three-act structure: 
  1) Surface intuitions through cases to establish the dilemma's visceral reality 
  2) Build conceptual frameworks gradually ("species-typical function" must arrive after demonstrating why simple biological definitions fail) 
  3) Pressure-test positions with counterexamples. The cardiac case works well precisely because the identical physical findings get different medical interpretations based on harm potential - this makes normativism tempting while letting naturalists feel the biological equivalence. But it needs pairing with a clear biological dysfunction case (like untreated diabetes) to prevent naturalism from becoming a straw man.

  Key pedagogical moves: 
  - Withhold definitions initially to avoid semantic boxing 
  - Let misconceptions like "naturalism=value-free" emerge organically during case discussions 
  - Delay correcting "disease=illness" confusion until harm condition is introduced 
  - Frame the two-question test (dysfunction + harm) as a hybrid solution, acknowledging it privileges neither position 

  For the finale, a synthesizing question like "Could we have diseases without sufferers or suffering without diseases?" would test structural understanding. A good answer would reference the cardiac case (same dysfunction, different harm) and diabetes (dysfunction causing harm) to show grasp of the distinction.

  The user's awareness of potential misconceptions is impressive - particularly their suspicion that their scaffold might beg questions against naturalism. I'll suggest presenting the two questions separately before exploring hybrids, maintaining neutrality.

  What to exclude: categorical debates (is addiction a disease?), historical constructivism, and Boorse's biostatistical theory nuances. Stating these limits upfront maintains focus.

  This plan balances conceptual rigor with accessibility for non-philosophers, using cases as the engine to drive revelation rather than declaration.
answer: |-
  Here’s a structured 90-minute teaching plan focusing on *pedagogical sequencing* and *conceptual scaffolding*, designed to make the debate visceral and avoid polarization:

  ---

  ### **Phase 1: Ignite the Tension (15 min)**
  - **Opening Gambit:** Put the cardiac case on the board. *Don’t label it as "anomaly" yet.*  
    - *Frame neutrally:* "Two patients, identical scans/exams, one has a family history of sudden death."  
    - Ask: *"Should these two men receive the same medical diagnosis? Why/why not?"*  
    - **Goal:** Surface pre-existing intuitions. Clinicians will focus on identical biology; humanists on differing risk/harm.  
    - **Why it works:** The case lacks measurable dysfunction *now* but implies future harm. It *forces* the question: Is disease defined by *current* biology or *potential* consequence? Avoids smuggling by not naming it "disease" upfront.  

  - **Pair with a Counter-Case (5 min):**  
    - **Untreated Type 1 Diabetes:** A patient with hyperglycemia, ketosis, organ damage.  
    - Ask: *"Is this a disease? What makes it different from the heart case?"*  
    - **Goal:** Anchors naturalist intuitions. Biology is *undeniably* malfunctioning.  

  ---

  ### **Phase 2: Build Frameworks (40 min)**  
  *(Whiteboard: Two columns—Naturalist / Normativist—leaving space for hybrid later)*  

  1. **Introduce Naturalism Full-Strength (15 min):**  
     - Define: "Disease = biological dysfunction in species-typical function."  
     - Use diabetes case to illustrate: Pancreas *isn’t functioning as human bodies typically do*.  
     - **Crucial move:** Ask *"What counts as 'species-typical function'?"* Have students brainstorm examples (heart pumping blood, kidneys filtering). Whiteboard their ideas.  
     - **Delay harm:** *Don’t mention values yet.* Let naturalism feel robust.  

  2. **Pressure Naturalism with Cardiac Case (10 min):**  
     - *"Both hearts are functioning identically now. Is there dysfunction?*  
     - Clinicians will note the structural difference; humanists will say "But it might kill him!"  
     - **Pivot:** "If biology is identical, why treat them differently? Is 'risk' biological?"  
     - **Plant the seed:** "Does naturalism need to account for *potential* harm?"  

  3. **Introduce Normativism (15 min):**  
     - Define: "Disease = a *harmful* deviation."  
     - Use cardiac case: Harm is *socially contextual* (family history changes risk perception).  
     - **Key nuance:** Distinguish **harm** (objective disadvantage) from **values** (subjective judgments).  
     - Example: "Blindness is harmful in a sight-reliant society, not in a echolocating species."  
     - **Prevent caricature:** Stress normativists *don’t* claim "society dislikes it = disease."  

  ---

  ### **Phase 3: Hybrids & Misconceptions (25 min)**  
  1. **Introduce the Two-Question Test (10 min):**  
     - Q1: Is there biological dysfunction?  
     Q2: Is it a harm?  
     - Apply to cases:  
       - *Diabetes:* Yes/Yes → Disease.  
       - *Cardiac variant with family history:* ?/Yes → Diagnosis.  
       - *Cardiac variant without history:* ?/No → No diagnosis.  
     - **Does it beg against naturalism?** Yes, subtly. *Fix:* Acknowledge naturalists see Q1 as *sufficient*. But the cardiac case shows Q1 isn’t *necessary* for diagnosis.  

  2. **Tackle Misconceptions (10 min):**  
     - Let these emerge organically, then correct:  
       - ❌ "Normativism = arbitrary": Clarify harm is often *objective* (pain, death) even if context-dependent.  
       - ❌ "Naturalism is value-free": Stress that selecting *which functions matter* (e.g., fertility) involves values.  
       - ❌ "Disease = Illness": Define *disease* (biological dysfunction) vs. *illness* (subjective experience of suffering).  
     - **Delay correcting:** Let "naturalism = value-free" stand initially—it’ll collapse when discussing "species-typical function."  

  3. **Hybrid Position (5 min):**  
     - "Most modern positions are hybrids: Dysfunction *plus* harm."  
     - Place between columns: "Disease = harmful dysfunction."  
     - Ask: *"Does this resolve the cardiac case? What problems remain?"*  

  ---

  ### **Phase 4: Synthesis & Close (10 min)**  
  - **Final Reveal Question:**  
    *"Can something be a biological dysfunction without being harmful? Can something be harmful without being a dysfunction?"*  
    - **Good answer:**  
      - Mentions *asymptomatic conditions* (dysfunction without harm) and *socially disvalued traits* (harm without dysfunction, e.g., homosexuality historically).  
      - References the cardiac case: Identical biology, differing harm → diagnosis hinges on normativity.  
    - **Bad answer:** Repeats dogma without using cases.  

  - **What to Refuse Coverage (Say Aloud):**  
    - "We won’t resolve the debate today. We also won’t dive into specific theories (e.g., Boorse vs. Wakefield) or historical constructs (e.g., drapetomania). Focus is on the *structure* of the disagreement."  

  ---

  ### **Why This Sequencing Works**  
  - **Species-typical function** arrives *early* to give naturalism weight, but its implicit normativity is revealed *later*.  
  - **Harm** enters *after* naturalism is pressured—forcing students to see its necessity.  
  - **Hybrids** come *last*: Students must feel the pull of both extremes first.  
  - **Cardiac case** is ideal: It lacks *current* dysfunction but has *future* harm potential, exposing the gap between biology and medical practice.  
  - **Diabetes case** protects naturalism from straw-manning.  

  ### **Scaffold Adjustments**  
  - Replace the two-question test with:  
    *"When we call something a disease, are we making a claim about bodies, about suffering, or both?"*  
    This avoids assuming separability while highlighting the dual dimensions.  

  This plan forces students to confront the *empirical inadequacy* of pure positions using cases they can’t dismiss. The cardiac case’s power lies in its clinical realism and irreducibility to biology alone—making normativism feel unavoidable without caricature.

  ---
  *You’ve engineered a session where the debate emerges from lived clinical ambiguity, not textbooks. The whiteboard will show the collision of worldviews; your job is to ensure both sides see their reflection in it. When the humanists cheer the cardiac case, hit them with diabetes. When the clinicians cite biology, ask why the healthy man with the family history gets a diagnosis. By the end, "disease" will feel stranger—and richer—than anyone expected.*
