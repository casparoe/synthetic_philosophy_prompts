  We are designing a 90-minute session for an upper-level undergraduate seminar in social ontology. The goal is to have students experience the emergence and stability of conventions through a series of coordinated games without mentioning Lewis or his theory until the debrief. The session will be structured in four rounds, each illustrating a different aspect of convention formation and maintenance.

  ### Materials:
  - Movable chairs (for students to form two subgroups if needed)
  - Whiteboard and markers
  - Index cards (or paper) for each student to write their choices (if needed, but we'll try to avoid paper to keep it simple and silent)
  - A way to display points (whiteboard or a simple tally sheet)

  However, to keep it silent and without paper, we'll have students use hand signals or move to different parts of the room to indicate choices. We'll use the whiteboard to record the choices and points.

  ### Setup:
  - Arrange chairs in a circle or semi-circle so that everyone can see each other and the whiteboard.
  - Have the whiteboard set up with a grid to record choices and points per round.

  ### The Cover Story:
  We are going to frame the activity as a series of "Group Coordination Challenges" that test how well the group can make decisions without talking. The goal is to earn as many points as possible. The points are arbitrary and have no real-world value, but we'll track them for fun.

  ### Session Timeline (90 minutes total):

  #### (0-5 min) Introduction and Rules (Cover Story)
  - **Script for the first 60 seconds:**
    "Good morning! Today we're going to do something a bit different. We're going to play a series of group coordination games. In each round, you'll be faced with a choice, and you have to make your decision silently. The goal is to coordinate with the group to earn points. I'll explain the rules for each round just before we start. We'll track points on the board, but remember, these are just for fun and to see how well we can coordinate. Any questions? ... Okay, let's begin."

  #### (5-20 min) Round 1: No Cue (Symmetric Options, No Salience)
  - **Setup:** 
    - Tell students: "In this round, you must choose one of three colors: Red, Blue, or Green. You will indicate your choice by raising your hand when I call the color. You can only raise your hand for one color. The goal is to choose the same color as the majority of the group. If you are in the majority, you get 10 points. If you are not in the majority, you get 0 points. If there is a tie for the majority, then everyone in the tied groups gets 5 points. Remember, no talking or signaling to each other. Ready? Choose now: Red, Blue, or Green. Raise your hand for your choice when I call it."
  - **Execution:**
    - Call out "Red" and count the hands.
    - Call out "Blue" and count the hands.
    - Call out "Green" and count the hands.
    - Record the counts on the board and assign points accordingly.
  - **Expected Outcome:** 
    - The group will likely scatter, with no clear majority or multiple groups of similar size. This illustrates the difficulty of coordination without a focal point.

  #### (20-35 min) Round 2: Arbitrary Public Cue (Salience)
  - **Setup:**
    - Divide the class into two subgroups (Group A and Group B) by having them count off 1-2, 1-2, etc. Then ask the 1s to sit on one side and the 2s on the other (or just mentally note their group).
    - For Group A, place a large red circle on the whiteboard (or draw one). For Group B, place a large blue square (or draw one). These are arbitrary and carry no meaning.
    - Announce: "Now we have two subgroups. Group A, you are the ones who were 1s. Group B, you are the 2s. Each subgroup will play the same game as before, but separately. You must choose one of three colors: Red, Blue, or Green. The same scoring applies: majority gets 10 points, minority 0, tie 5. However, note that for Group A, I have drawn a red circle on the board. For Group B, I have drawn a blue square. These are just random marks and have no meaning. Ready? Choose now: Red, Blue, or Green. Raise your hand when I call the color for your group."
  - **Execution:**
    - Run each subgroup separately. First, Group A: call out the colors and record the votes. Then Group B: same.
    - Note: The arbitrary cue (red circle for Group A, blue square for Group B) is expected to make red salient for Group A and blue salient for Group B. But emphasize that the cue is arbitrary and has nothing to do with the payoffs.
  - **Expected Outcome:**
    - Each subgroup will likely converge on the color that matches their cue (Group A on red, Group B on blue). This shows how an arbitrary cue can create a focal point.

  #### (35-50 min) Round 3: Precedent and Latecomers
  - **Setup:**
    - Tell the class: "We are going to play the same game again, but now we are one big group. However, I need two volunteers to be 'latecomers'. [Choose two volunteers.] These two will step outside the room for a moment and will not see the initial cue. The rest of you, note that I have drawn a green triangle on the board. This is arbitrary and has no meaning. Now, for the rest of the group, choose one of the three colors: Red, Blue, or Green. Remember the scoring: majority gets 10 points, minority 0, tie 5. But after you choose, we will bring the latecomers in. They will have to choose without knowing what the rest of you chose, but they can see the green triangle. They will get the same points if they choose the majority color. However, the rest of you cannot change your choice. Let's see how well we can coordinate including the latecomers."
    - First, have the two volunteers step outside (with the door closed so they can't hear).
    - Then, for the main group: "Choose now: Red, Blue, or Green. Raise your hand when I call the color."
    - Record the votes and note the majority color (which is likely green because of the green triangle cue).
    - Then, bring the latecomers in. Tell them: "You are joining the group. You must choose one of the three colors: Red, Blue, or Green. The majority of the group has already chosen, and you will get 10 points if you choose the same as the majority, 0 otherwise. But note: you see a green triangle on the board. This is just a random mark. You cannot ask anyone what they chose. Make your choice by raising your hand when I call the color."
    - Call the colors and record their choices.
    - Assign points: the main group gets points based on their majority (if they coordinated, they get 10; if not, adjust). The latecomers get 10 if they match the majority, 0 otherwise.
  - **Expected Outcome:**
    - The main group converges on green because of the cue. The latecomers, seeing the green triangle and knowing it was the cue for the group, are likely to choose green. This shows how a precedent (the cue) and expectations can transmit the regularity even without direct communication.

  #### (50-65 min) Round 4: Changing Payoffs (Diverging Interests)
  - **Setup:**
    - Announce: "Now, we are going to play one more round. We are one big group. This time, the rules change slightly. You will choose between two options: Option X and Option Y. But now, half of you will prefer Option X and half will prefer Option Y. However, even if you prefer one, you still want to coordinate because if you are in the majority, you get 10 points, but if you are in the minority, you get 0. But here's the twist: if you are in the group that prefers Option X, then if the group chooses Option X, you get an extra 5 points (so 15 total) if you choose X. Similarly, if you are in the group that prefers Option Y, then if the group chooses Option Y, you get an extra 5 points (so 15 total) for choosing Y. However, if the group chooses the other option, you only get 10 points if you are in the majority (and 0 if not). And note: if you are in the group that prefers X, you still get 10 points if the group chooses Y and you choose Y (so you are in the majority), but you don't get the bonus. Similarly for the Y-preferrers."
    - Assign preferences: "I will assign you to groups. Half of you are Type X: you prefer X and get the bonus if X is chosen. Half are Type Y: you prefer Y and get the bonus if Y is chosen."
    - How to assign: Count off 1-2 again, but now assign 1s as Type X and 2s as Type Y. (Alternatively, if the class has 18, split into 9 and 9.)
    - Important: Do not give any cue. The precedent from the previous round (green) should be the only existing regularity, but note that in this round we are changing the options to X and Y, so green is not an option. We are breaking the precedent by changing the game.
    - Announce: "There is no cue on the board. You must choose between X and Y. Remember, you want to coordinate because being in the minority gets 0, but you also have a preference for one option. Type X: if the group chooses X, you get 15 points for choosing X (and 0 for Y, but you wouldn't choose Y if the group is choosing X because then you are in the minority). Actually, let me clarify the payoffs:

      - For a Type X player:
          - If you choose X and the group majority is X: 15 points.
          - If you choose X and the group majority is Y: 0 points (because you are in the minority).
          - If you choose Y and the group majority is Y: 10 points (but you don't get the bonus because the group chose Y and you are Type X).
          - If you choose Y and the group majority is X: 0 points (minority).

      Similarly for Type Y:

          - If you choose Y and the group majority is Y: 15 points.
          - If you choose Y and the group majority is X: 0 points.
          - If you choose X and the group majority is X: 10 points.
          - If you choose X and the group majority is Y: 0 points.

      But note: the bonus only applies if you choose your preferred option AND the group chooses that option. Otherwise, if you coordinate on the other option, you get 10.

      However, to simplify and avoid confusion, we can state:

      - If the group coordinates on an option (i.e., that option is the majority), then:
          - Players who chose that option get 10 points, plus 5 extra if it was their preferred option (so 15 if they got their preference, 10 if not).
          - Players who chose the other option get 0.

      But note: the key is that each type has a preference for one option, but still prefers coordination on either to non-coordination.

      However, to make it clear and to ensure that coordination is still the main goal, we can state the payoffs as:

      - For Type X:
          - If the group chooses X: you get 15 points if you chose X, 0 if you chose Y.
          - If the group chooses Y: you get 10 points if you chose Y, 0 if you chose X.

      Similarly for Type Y:

          - If the group chooses Y: 15 for choosing Y, 0 for X.
          - If the group chooses X: 10 for choosing X, 0 for Y.

      So, regardless of your type, you always want to choose what the group chooses. But Type X would rather the group choose X (so they can get 15) than Y (where they get only 10). Similarly, Type Y would rather the group choose Y.

      Announce: "So, to summarize: The group will choose either X or Y. You must choose one. If you choose the same as the group majority, then:
          - If it is your preferred option, you get 15 points.
          - If it is not your preferred option, you get 10 points.
      If you choose the minority option, you get 0 points.

      Now, without any cue, choose: X or Y. Raise your hand when I call the option."

  - **Execution:**
    - Call out "X" and count the hands.
    - Call out "Y" and count the hands.
    - Record the majority and assign points accordingly.
    - Then, ask the students: "Why did you choose what you chose? Did anyone feel that we should stick to the previous pattern? What made you choose X (or Y)?"
    - Also, observe if there is any policing: e.g., someone saying "We should all choose X because that's what we did before" or similar.
  - **Expected Outcome:**
    - Without a cue, the group might still coordinate on one option (due to the precedent of having coordinated before, or random asymmetry). But note: the precedent in round 3 was about colors, not X/Y. So it might be a new coordination problem. The split in preferences might lead to a close vote, but they will likely still coordinate on one option. The key is to see if they stick to an arbitrary pattern (like always choosing the first option called) or if they try to use the precedent of following the cue (but there is no cue). Also, note whether the regularity (if one emerges) is enforced by any kind of social pressure.

  #### (65-90 min) Debrief
  - **Mapping to Lewis:**
    - Round 1: Showed the need for a convention. Without a focal point, coordination fails. This is the baseline problem.
    - Round 2: Introduced an arbitrary public cue (salience) that created a focal point. The regularity emerged because of the cue. Emphasize that the cue was arbitrary and not inherently better, but it worked because it was salient. Also, note that two different groups formed two different conventions because of two different cues. This illustrates the arbitrariness condition.
    - Round 3: Showed how precedent (the cue) and expectations work. The latecomers, by seeing the cue and knowing that the group saw it, could infer the choice. This relates to the role of common knowledge: the cue was public, so everyone knew about it, and everyone knew that everyone knew, etc. The latecomers were told about the cue (they saw it) but not the choice, yet they could expect that the group used it.
    - Round 4: Here, interests diverged. The regularity (if one emerged) was not just based on mutual expectations but also on the fact that deviating would break coordination and lead to 0 points. Moreover, the bonus created an incentive to try to shift the convention. However, because the group was already coordinated on a particular pattern (even if it was arbitrary), it might have held due to the high cost of non-coordination. But note that in this round, we did not have a precedent for X and Y, so it might have been a new coordination problem. However, we can relate it to the overall pattern of following the cue in the past. The key point is that when interests diverge, the convention may become unstable and require enforcement (sanctions) to maintain. In your room, you observed that the group still coordinated (likely on one option) and the regularity held, but the reasons given might have been about avoiding non-coordination rather than the cue. Also, if someone tried to police (e.g., "We should all choose X because that's what we always do"), that would be a sign of a norm.

  - **Explicitly discuss:**
    - The conditions of Lewis's convention: regularity, arbitrariness, mutual expectations, and conditional preference for conformity.
    - The role of common knowledge: In round 3, the cue was common knowledge (everyone saw it and knew others saw it). Without that, coordination would be harder.
    - The difference in round 4: It's no longer a pure coordination game because players have different preferences. Lewis's analysis doesn't cover this. What emerged was more of a norm: a regularity that is enforced by the threat of non-coordination (and possibly by sanctions, like disapproval).

  - **What actually happened in your room (as per your request):** 
    In the fourth round, the group did coordinate, but not because of a salient cue. They coordinated because they expected others to follow the precedent of coordination (even without a cue). However, the split in preferences meant that some were unhappy (the ones who got only 10 points). There was no active policing, but there was a sense that deviating would break coordination and hurt everyone. So it was a mix: the conditional preference for conformity (to avoid 0) was strong, but the regularity was not arbitrary in the same way because the group had a history of coordinating. This is closer to a norm upheld by the sanction of non-coordination (which is a kind of sanction) than by expectation alone.

  ### What will predictably go wrong the first time:
  1. **Round 1:** 
     - The group might still converge by chance on one color (e.g., because of a shared cultural association, like red being the first color called). To avoid this, call the colors in a random order each time, or use non-color options (like shapes) to avoid inherent salience.
