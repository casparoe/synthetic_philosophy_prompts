     However, if we run Group A first and then Group B, and Group B sees the result, they might be influenced. So we must run them simultaneously without seeing each other. That might require paper. Let's use paper for this round only.

  3. **Round 3:**
     - The latecomers might guess the majority color by the behavior of the group (e.g., everyone looking at the green triangle). We must instruct the group to remain neutral and not look at the triangle or signal.
