answer: |-
  ### Session Design: "Group Coordination Challenge"  
  **Core Idea:** Students experience convention formation through silent, simultaneous choices in coordination games with points. The sequence mirrors Lewis's conditions without naming them, culminating in a debrief on social ontology.

  ---

  ### **Materials**  
  - **Whiteboard:** Track points per round (simple tally).  
  - **Index Cards (18):** Pre-printed with options for each round (minimize verbal cues).  
  - **Two Large Signs:** Arbitrary cues for Round 2 (e.g., "△" and "☐" on cardboard).  
  - **Timer:** For enforcing silence/choice periods.  

  ---

  ### **Script: Opening 60 Seconds (Cover Story)**  
  *Stand at the front, holding index cards. Speak neutrally.*  
  "Good morning. Today we’re running a ‘Group Coordination Challenge’—think of it as a behavioral experiment. Each round, you’ll choose an option silently to earn points. Your goal is simple: maximize personal points. I’ll hand out cards with options; circle your choice and pass it back. No talking, gestures, or shared signals. Points are abstract—no prizes, just bragging rights. Ready? Let’s begin."  

  ---

  ### **Round Sequence & Payoff Announcements**  
  **Total: 65 minutes (Debrief: 25 minutes)**  

  #### **(5–20 min) Round 1: No Cue → Scattered Choices**  
  - **Setup:** Hand out cards: "Choose ONE: ♠ / ♣ / ♥" (options symmetric in payoff).  
  - **Payoff Announcement:**  
    *"Scoring: If your choice matches the *plurality* of the group, you get 10 points. If not, 0 points. If multiple options tie for plurality, all in those groups get 5 points. You have 30 seconds—circle and pass back."*  
  - **Execution:**  
    - Collect cards, tally votes on board.  
    - **Predictable Issue:** Group splinters (no majority). Point out dispersion: "♠:6, ♣:5, ♥:7—no one got 10 points."  
  - **Why:** Demonstrates coordination failure without salience.  

  ---

  #### **(20–35 min) Round 2: Arbitrary Cue → Salience-Driven Convention**  
  - **Setup:** Split class into Group A (9) and Group B (9). Place "△" sign near A, "☐" near B. Hand out cards: "Choose ONE: Red / Blue / Green."  
  - **Payoff Announcement (identical for both groups):**  
    *"Same scoring: Match plurality = 10 points. Note the symbol near your group—it’s decorative, no meaning. 30 seconds—choose and pass back."*  
  - **Execution:**  
    - Tally separately. Group A converges on Red (△=red?), Group B on Blue (☐=blue?).  
    - **Predictable Issue:** Cues accidentally hint at colors (e.g., △→"red" if drawn in red marker). **Mitigation:** Use black/white symbols. If bias occurs, note it in debrief as "accidental salience."  
  - **Why:** Shows conventions form around arbitrary but public cues.  

  ---

  #### **(35–50 min) Round 3: Precedent & Latecomers → Transmission by Expectation**  
  - **Setup:** Remove signs. Send 2 volunteers ("latecomers") outside. Hand cards to remaining 16: "Choose ONE: Circle / Square / Triangle." Display a new cue: "⚠" on board.  
  - **Payoff Announcement:**  
    *"Same scoring. Latecomers will join after you choose. They won’t see your votes but will see the board cue. 30 seconds—choose."*  
  - **Latecomer Phase:**  
    - Bring latecomers in. Hand them cards: "Choose ONE: Circle / Square / Triangle."  
    *"Latecomers: Match the plurality = 10 points. The symbol ⚠ is decorative. Choose now."*  
  - **Execution:**  
    - Main group converges on Triangle (⚠→triangle?). Latecomers likely pick Triangle, expecting alignment.  
    - **Predictable Issue:** Latecomers infer choice from peers’ body language. **Mitigation:** Instruct class to avoid eye contact/staring at cues.  

  ---

  #### **(50–65 min) Round 4: Altered Payoffs → Convention vs. Preference Conflict**  
  - **Setup:** Hand out cards: "Choose ONE: X / Y." Assign hidden preferences: First 9 students are "Type X," last 9 "Type Y" (write privately on their cards).  
  - **Payoff Announcement:**  
    *"New scoring:  
    - If you coordinate (match plurality), Type X gets 15 points for X, 5 for Y. Type Y gets 15 for Y, 5 for X.  
    - If you mismatch (minority choice), 0 points.  
    Your type is on your card—do not share it."*  
  - **Execution:**  
    - Tally votes. Observe if they stick to precedent (e.g., Triangle→X?) or fracture.  
    - **Prompt Discussion:** *"Why did you choose X/Y? Should we enforce one option?"* Note policing remarks (e.g., "We always pick first!").  
  - **Predictable Issue:** Preferences leak via groans/expressions. **Mitigation:** Strict silence; remind "no reactions."  

  ---

  ### **Debrief (65–90 min): Mapping to Lewis & Beyond**  
  *(Reveal Lewis’s name/book now. Whiteboard: Conditions table.)*  

  1. **Map Rounds to Lewis:**  
     - **Round 1:** *Regularity* fails without salience → Coordination requires focal points.  
     - **Round 2:** *Arbitrariness* (△/☐ cues) + *Mutual expectation* → Conventions emerge from public salience.  
     - **Round 3:** *Precedent* + *Common knowledge* (⚠ cue visible to all) → Latecomers infer via expectations, not rules.  
     - **Round 4:** *Conditional preference* ("I conform if others do") clashes with divergent interests → Not pure convention.  

  2. **Key Distinction:**  
     - **"Everyone knows" ≠ "Common knowledge":** In Round 3, latecomers knew about ⚠ but not that others used it. True convention requires *recursive* knowledge ("I know you know I know...").  

  3. **Push Past Lewis:**  
     - **Round 4 Outcome:** *"In my room, the group fractured. Type Y players argued to switch to Y for ‘fairness.’ When X won, a Type Y player sighed, ‘Fine, but next time we flip.’ No policing—just grudging conformity to avoid 0 points. This isn’t Lewisian convention; it’s a proto-norm, where sanctions (lost points) enforce compliance despite preference conflicts."*  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  - **Accidental Cues:**  
    - Room layout/your position biases choices (e.g., students near window pick "Green"). **Fix:** Stand centrally; use neutral options (♠/♣/♥).  
  - **Silence Breaches:**  
    - Whispering/laughing during choices. **Fix:** Pause, restart: "Remember, silence is part of the challenge."  
  - **Round 4 Confusion:**  
    - Misunderstanding payoffs. **Fix:** Pre-write payoff rules on board; use examples ("If you’re Type X and pick X...").  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Absence of Common Knowledge:**  
     - Co-present groups inherently share baseline common knowledge (e.g., "we’re in a seminar"). Simulating its absence (e.g., private cues) feels artificial. *Alternative:* Discuss hypotheticals ("Imagine if only half saw the cue...").  
  2. **Long-Run Convention Selection:**  
     - Staging repeated interactions (e.g., 10 rounds) is time-prohibitive. *Solution:* Describe historical examples in debrief (e.g., QWERTY vs. Dvorak keyboards).  
  3. **Deep Norm Internalization:**  
     - Sanctions here are points-based. Real norms involve shame/approval—beyond 90 minutes. *Bridge:* Contrast Round 4’s "sanction" with social punishment.  

  ---

  ### **Final Notes**  
  - **Strengths:** Students *feel* arbitrariness (Round 2) and conditional rationality (Round 4). The "cover story" prevents theory contamination.  
  - **Weaknesses:** Latecomers (Round 3) may still intuit choices; long-run dynamics remain abstract.  
  - **Tip:** Track points dramatically ("Group A, you scored 90! Group B, 30!")—leveraging rivalry amplifies engagement.  

  This design mirrors your reading group’s "unspoken rules," making Lewis tangible. When interests diverge, the shift to norm-like enforcement emerges organically—no assertion needed.
