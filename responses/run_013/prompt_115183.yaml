      - Side A: Predicts a contradiction (admiration conflicts with semantic derogation). If no contradiction, counts against.
      - Side B: Predicts no contradiction (the slur is descriptive; admiration is added). If a contradiction is perceived, it challenges Side B.

  #### Case (g): Metalinguistic: "'Kesty' is a slur."
  - **Side A**: Predicts this is true and non-derogatory (it describes the word's status). If it is seen as derogatory, it counts against.
  - **Side B**: Predicts this is true and non-derogatory. If it is seen as derogatory, it counts against (both sides agree this case is non-derogatory).

