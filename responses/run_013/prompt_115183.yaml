  We are drafting a joint statement for an adversarial collaboration on the semantics and pragmatics of slurs, using the invented case of "Kestian" (neutral) and "Kesty" (slur). The goal is to produce a document that both parties can sign, outlining agreements, disagreements, cruxes, and predictions for specific test cases.

