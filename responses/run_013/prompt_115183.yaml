  **Joint Statement on the Semantics and Pragmatics of Slurs: The Case of "Kesty"**

  This document represents a collaborative effort between two opposing theoretical viewpoints on the nature of slurs, using the invented slur "Kesty" (for the group "Kestians") as a shared test case. We aim to clarify points of agreement and disagreement, identify empirical cruxes, and make testable predictions for specific linguistic contexts. We acknowledge that real-world slurs may involve additional complexities (e.g., historical weight, reclamation), but we focus on the invented case to isolate theoretical mechanisms.

  ### 1. Agreed Claims

  Both parties endorse the following claims:

  1. The term "Kesty" is derogatory when used by out-group members (non-Kestians) in typical contexts. It is widely recognized as a slur and its use can cause offense and harm.
  2. The neutral counterpart "Kestian" lacks inherent derogatory content and is the appropriate term for neutral reference.
  3. The derogatory effect of "Kesty" is not merely a matter of individual speaker intention; it is systematically tied to the term's conventional use.
  4. Any adequate theory of slurs must explain the following phenomena:
     a. The derogatory force of "Kesty" in straightforward assertions (e.g., "He is a Kesty").
     b. The behavior of the derogatory content under embedding: negation ("He isn't a Kesty"), questions ("Is she a Kesty?"), conditionals ("If he's a Kesty, ..."), and reported speech ("They called her a Kesty").
     c. The potential for in-group use (by Kestians) to lack derogatory force or even express solidarity.
     d. The possibility of non-derogatory use by out-group members in special contexts (e.g., as an in-group code without animus).
     e. The projection behavior of derogation (i.e., whether it survives in embeddings similarly to presuppositions or conventional implicatures).
     f. The status of metalinguistic uses (e.g., "'Kesty' is a slur").
  5. The following observations alone do not settle the semantic-pragmatic dispute:
     a. The existence of reclamation (in-group use) does not inherently favor either view, as both theories must account for it.
     b. The offensiveness of the term in most contexts is acknowledged by both sides and does not decide whether the derogation is semantic or pragmatic.
     c. The fact that a speaker might use "Kesty" without derogatory intent (e.g., in ignorance or as a code) does not by itself resolve the debate, as both theories must explain how such uses can sometimes lack derogatory force.
     d. The projection pattern (e.g., under negation) is a key test, but both theories can offer accounts of projection (e.g., via semantic mechanisms for Side A, or pragmatic reasoning for Side B); thus, projection patterns require careful interpretation and are not automatically decisive.

  ### 2. Disagreements

  For each point of disagreement, we state each side's position in their own terms.

  #### (i) Literal Truth-Conditions
  - **Side A (Semantic View)**: The sentence "He is a Kesty" is not truth-conditionally equivalent to "He is a Kestian". The word "Kesty" encodes both descriptive content (being a Kestian) and derogatory content. Thus, if the individual is a Kestian, "He is a Kesty" is literally true only if the derogatory content is appropriately applied (e.g., in contexts where the speaker endorses the derogation). However, in typical contexts, the derogation is part of the asserted content or a conventional implicature, making the sentence non-neutral and not purely descriptive.
  - **Side B (Pragmatic View)**: The sentence "He is a Kesty" is truth-conditionally equivalent to "He is a Kestian". The word "Kesty" has the same descriptive content as "Kestian". The derogation is entirely pragmatic, arising from the violation of a norm against using slurs and/or from the expressive function of the term. Thus, the sentence can be literally true or false solely based on whether the referent is a Kestian, regardless of the derogatory effect.

  #### (ii) Projection Behavior
  - **Side A (Semantic View)**: The derogatory content of "Kesty" projects (i.e., remains present) in embeddings such as negation, questions, conditionals, and reported speech, similarly to presuppositions or conventional implicatures. For example, in "He isn't a Kesty", the negation targets the descriptive content (that he is a Kestian), but the derogatory content (that Kestians are contemptible) is still conveyed. This projection is a core feature of the semantic encoding.
  - **Side B (Pragmatic View)**: The derogatory content does not inherently project in embeddings. Any observed projection effects are due to pragmatic reasoning: hearers infer that the speaker is using a slur (violating a norm) even in embedded contexts, and this triggers an implicature of derogation. The projection is not obligatory and can be canceled or contextually suspended. For instance, in "He isn't a Kesty", the use of the slur might still signal the speaker's derogatory attitude, but this is not a semantic property of the word itself.

  #### (iii) In-Group/Reclaimed Use
  - **Side A (Semantic View)**: In reclaimed use (e.g., by Kestians), the derogatory content is still semantically present but is "reclaimed" or revalued by the speakers, often to express solidarity or defiance. The semantic derogation is not erased; rather, it is repurposed. However, in some contexts, the reclaimed use may become conventionalized to the point that the derogatory content is no longer activated, suggesting a shift in the word's semantics over time.
  - **Side B (Pragmatic View)**: In reclaimed use, the pragmatic norm violation does not occur (since the in-group is permitted to use the term), so the derogatory effect is absent. The word "Kesty" in such contexts is used descriptively (to denote group membership) and expressively (to signal in-group solidarity), with no derogatory content. The term remains descriptively equivalent to "Kestian", and the absence of derogation is due to the change in pragmatic context.

  #### (iv) Use as an In-Group Code by Non-Kestians
  - **Side A (Semantic View)**: Even if a non-Kestian uses "Kesty" purely as an in-group code without animus (case c), the derogatory content is still semantically present and can cause offense. The speaker might intend no harm, but the conventional meaning of the word includes derogation, so the use remains problematic and may still convey derogation to hearers.
  - **Side B (Pragmatic View)**: In this context, the use of "Kesty" does not violate a norm (if it is accepted within the in-group as a code) and the speaker lacks derogatory intent. Thus, the derogatory effect does not arise. The word functions descriptively (to denote Kestians) and as a group marker, without derogation. However, this use might still be risky because of the potential for misunderstanding or the word's history.

  ### 3. Cruxes

  We identify key empirical questions (cruxes) that could help resolve the dispute. For each crux, we state the shared evidence (test case or argument) and each side's prediction. A result that aligns with one prediction and not the other would challenge the opposing view.

  | Disagreement | Wording Each Side Accepts | Crux | Shared Evidence | Prediction of Side A (Semantic) | Prediction of Side B (Pragmatic) |
  |--------------|---------------------------|------|-----------------|----------------------------------|----------------------------------|
  | **Projection under negation** | Side A: The derogation projects and is not canceled by negation. Side B: The derogation does not project as a semantic necessity; it can be absent in context. | In the utterance "He isn't a Kesty" (case d), does the derogatory content (contempt for Kestians) necessarily persist? | We examine whether competent speakers perceive the utterance as still conveying derogation toward Kestians, even when the speaker is denying group membership. | Yes: The derogation projects similarly to a presupposition or conventional implicature. The utterance still conveys that being a Kesty is bad, even if the individual isn't one. A failure to project would be evidence against Side A. | No: The derogation may or may not be present, depending on context and speaker intent. In some contexts (e.g., a discussion about slurs), it might be neutral. If the derogation always persists, it would challenge Side B's view that it is purely pragmatic. |
  | **Truth-conditional equivalence** | Side A: "Kesty" and "Kestian" are not truth-conditionally equivalent. Side B: They are truth-conditionally equivalent. | Can "He is a Kesty" be true in a scenario where the referent is a Kestian, without the speaker endorsing derogation? (E.g., in reclaimed use by Kestians or in-group code use by non-Kestians) | We consider case (b): Two Kestians using "Kesty" affectionately. If one says "He is a Kesty" about a fellow Kestian, is this true? | No: The sentence "He is a Kesty" is only true if the derogatory content is satisfied, which it isn't in reclaimed use. Thus, in this context, the utterance might be seen as non-literal or as involving a semantic shift. | Yes: The sentence is true because the referent is a Kestian. The derogation is absent due to the pragmatic context, but the truth conditions are unchanged. If the sentence is judged false in this context, it would challenge Side B. |
  | **Derogation in reported speech** | Side A: The derogation projects in reported speech as part of the word's meaning. Side B: The derogation in reported speech is pragmatic, reflecting the reporter's attitude or the original speaker's intention. | In case (e): "The boss called her a Kesty" — does this report necessarily convey derogation toward her (even if the reporter disapproves)? | We test whether the report is seen as offensive or derogatory even when the reporter distances themselves (e.g., "The boss called her a Kesty, which was awful"). | Yes: The derogation is triggered by the word itself, so the report will convey derogation regardless of the reporter's intent. If the report can be neutral (e.g., in a linguistic discussion), it would count against Side A. | No: The derogation depends on how the report is used. The reporter might use the slur to report the boss's attitude without endorsing it, and the offense might stem from the boss's action, not the word's semantics. If the derogation is always present, it would challenge Side B. |
  | **Purely descriptive use** | Side A: There is no context where "Kesty" is used purely descriptively without derogatory content. Side B: "Kesty" can be used purely descriptively in special contexts (e.g., in-group code). | In case (c): A non-Kestian uses "Kesty" to another non-Kestian purely as an in-group code, with no animus. Does this use convey any derogation? | We examine whether competent listeners perceive derogation in this use, or if it can be neutral. | Yes: The derogation is inherent to the word, so even in this context, the use may be offensive or convey contempt. If listeners perceive no derogation, it would challenge Side A. | No: The derogation is absent because the norm violation is suspended (the in-group code overrides the usual prohibition) and there is no derogatory intent. If derogation is still perceived, it would challenge Side B. |

  ### 4. Verbal Disputes

  We note points where the disagreement may be partly verbal:

  - **"Meaning" vs. "Content"**: Some disputes might arise from different uses of "meaning". Side A equates "meaning" with encoded linguistic content (including conventional implicatures), while Side B reserves "meaning" for truth-conditional content and treats derogation as pragmatic. This is not a substantive disagreement but a terminological one. Both sides agree that the derogation is conventional (not conversational), but differ on whether it is part of the word's semantic contribution to truth conditions and projection.
  - **"Literal truth"**: The dispute over whether "He is a Kesty" can be literally true in reclaimed use might hinge on whether "literal truth" includes expressive content. Side A sees the derogation as part of the literal meaning, so the utterance isn't purely descriptive. Side B sees literal truth as purely descriptive. This reflects a deeper theoretical divide, but the term "literal" might cause confusion.

  ### 5. Predictions for Test Cases

  For each test case (a-g), both sides state their predictions and what would count as evidence against their view.

  #### Case (a): Plain use, target is Kestian: "He's a Kesty."
  - **Side A**: Predicts the utterance conveys derogation. If no derogation is perceived in a typical context, it would count against this view.
  - **Side B**: Predicts the utterance conveys derogation due to norm violation. If it is used without derogation in a typical context (which Side B does not expect), it would be problematic.

  #### Case (b): Two Kestians using 'Kesty' with each other affectionately.
  - **Side A**: Predicts the utterance still carries semantic derogation, but it may be reinterpreted positively. If listeners perceive no derogation at all (even as a reclaimed term), it might challenge the view that derogation is always semantic.
  - **Side B**: Predicts no derogation is conveyed. If derogation is perceived by the in-group members, it would count against this view.

  #### Case (c): A non-Kestian using 'Kesty' to another non-Kestian purely as an in-group code, with no animus toward Kestians at all.
  - **Side A**: Predicts derogation is still conveyed. If the use is genuinely non-derogatory and accepted as such, it would challenge this view.
  - **Side B**: Predicts no derogation is conveyed. If derogation is still perceived (e.g., by Kestians or others), it would challenge this view.

  #### Case (d): Embedded cases.
    - **Conditional**: "If he's a Kesty, they probably won't hire him."
      - Side A: Derogation projects (the conditional assumes that being a Kesty is a negative trait). If no derogation is perceived, it counts against.
      - Side B: Derogation may be present as an implicature but can be absent (e.g., in a context discussing discrimination). If derogation always projects, it challenges Side B.
    - **Question**: "Is she a Kesty?"
      - Side A: Derogation projects (the question carries the assumption that being a Kesty is derogatory). If neutral, it counts against.
      - Side B: Derogation may be present but is not inherent. If it always projects, it challenges Side B.
    - **Negation**: "He isn't a Kesty."
      - Side A: Derogation projects (the utterance implies that being a Kesty is bad, even if he isn't one). If no derogation, counts against.
      - Side B: Derogation may be absent (e.g., if the speaker is correcting misinformation). If always present, challenges Side B.

  #### Case (e): Reported speech: "The boss called her a Kesty."
  - **Side A**: Predicts the report conveys derogation (due to the word's semantics). If the report can be neutral (e.g., in a linguistic example), it counts against.
  - **Side B**: Predicts the derogation depends on context (the report might convey the boss's attitude without endorsing it). If derogation is always present, it challenges Side B.

  #### Case (f): Conjoined with praise.
