answer: |-
  ### Joint Statement on the Semantics and Pragmatics of "Kesty": An Adversarial Collaboration  

  **Preamble**  
  We, the undersigned, acknowledge a substantive disagreement regarding the nature of slurs but commit to:  
  1. Using the invented case ("Kestian" = neutral; "Kesty" = slur) to bypass entrenched disputes about real-world examples.  
  2. Distinguishing empirical predictions from terminological differences.  
  3. Identifying testable cruxes where data could resolve or clarify our disagreement.  
  4. Recognizing that real-world slurs may involve historical/cultural dimensions absent here; gaps in the "Kesty" case are theoretically informative.  

  ---

  ### 1. Agreed-Upon Claims  
  Both parties endorse the following statements:  

  1. **Core Data**:  
     - (a) "He’s a Kesty" (said by an out-group member) is typically derogatory.  
     - (b) In-group use (Kestian→Kestian) can lack derogation (e.g., affectionate reclamation).  
     - (c) Non-Kestian in-group code use *may* lack animus but remains norm-violating.  
     - (d)–(g) Embedding, negation, and reporting behaviors require systematic explanation.  

  2. **Theoretical Requirements**:  
     - Any theory must explain:  
       - The *stability* of derogation across contexts (e.g., plain assertions).  
       - The *variability* of derogation (e.g., in-group vs. out-group use).  
       - Projection patterns under logical operators (negation, conditionals, questions).  
       - The status of metalinguistic and reported uses.  

  3. **Non-Deciders**:  
     - The following phenomena *do not* inherently favor either theory:  
       - Offensiveness in isolation (both agree "Kesty" is offensive when misused).  
       - Reclamation (both must account for loss of derogation in-group).  
       - Speaker intention (both agree intentions can modulate but not erase conventional effects).  
       - Norm violation (both agree "Kesty" violates expressive norms).  

  ---

  ### 2. Disagreements  
  Each side’s position is stated neutrally and without caricature.  

  | Issue | Side A (Semantic View) | Side B (Pragmatic View) |  
  |-------|-------------------------|--------------------------|  
  | **Literal truth/falsity of "He’s a Kesty"** | "The word ‘Kesty’ encodes derogation as part of its conventional meaning. Thus, ‘He’s a Kesty’ cannot be literally true/false *solely* based on descriptive content; its truth-conditions include an expressive component that predicates contempt." | "The word ‘Kesty’ is truth-conditionally identical to ‘Kestian’. Thus, ‘He’s a Kesty’ is literally true if the referent is Kestian, and false otherwise. Derogation arises from pragmatics (norm violation, speaker attitude), not semantics." |  
  | **Projection under embedding** | "Derogation projects universally (like presupposition/conventional implicature): it survives embedding in negation, questions, conditionals, and reported speech because it is lexically encoded. Example: ‘Is she a Kesty?’ still presupposes contempt for Kestians." | "Derogation does not inherently project. Apparent projection is epiphenomenal: it stems from pragmatic reasoning about speaker commitment or context. Example: ‘Is she a Kesty?’ need not convey contempt if context neutralizes norm violation (e.g., academic discussion)." |  
  | **In-group/reclaimed use** | "In reclaimed use, derogation is semantically present but *cancelled* or *retrieved* by pragmatic processes (e.g., speaker identity flips the expressive valence). The semantic content does not disappear." | "In reclaimed use, derogation vanishes because the pragmatic triggers (norm violation, out-group signaling) are absent. ‘Kesty’ becomes descriptively equivalent to ‘Kestian’ with added in-group solidarity." |  
  | **Non-derogatory out-group code use (case c)** | "Derogation persists semantically even if the speaker lacks animus. Conventional meaning overrides intention, making this use derogatory (though potentially ambiguous)." | "Derogation is absent here. The speaker’s lack of animus and in-group signaling prevent pragmatic derogatory effects, rendering ‘Kesty’ purely descriptive + identity-marking." |  

  ---

  ### 3. Cruxes  
  Empirical tests where predictions diverge. Shared evidence = the "Kesty" cases.  

  | Disagreement | Wording Accepted by Side A | Wording Accepted by Side B | Crux | Shared Evidence | Prediction of Side A | Prediction of Side B |  
  |--------------|----------------------------|----------------------------|------|-----------------|----------------------|----------------------|  
  | **Truth-conditional equivalence** | "‘Kesty’ adds non-truth-conditional content to ‘Kestian’." | "‘Kesty’ and ‘Kestian’ share truth conditions; differences are pragmatic." | Can "He’s a Kesty" be true *without* derogation? | Case (b): Kestian→Kestian affectionately says "She’s a Kesty" (referent is Kestian). | **No**: Truth requires both descriptive *and* expressive conditions. Utterance is infelicitous or non-literal. *Against A if judged true.* | **Yes**: Truth depends only on group membership. Derogation is absent pragmatically. *Against B if judged false.* |  
  | **Projection under negation** | "Derogation projects obligatorily in negation." | "Derogation under negation is context-dependent." | Does "He isn’t a Kesty" *always* convey contempt for Kestians? | Case (d): Uttered as a denial (e.g., defending someone misidentified as Kesty). | **Yes**: Contempt projects ("even if not one, they’re contemptible"). *Against A if no contempt conveyed.* | **No**: Contempt may disappear (e.g., if negation cancels norm violation). *Against B if contempt persists invariably.* |  
  | **Derogation in reported speech** | "Reported speech preserves the slur’s semantic derogation." | "Reported speech conveys the *original speaker’s* attitude pragmatically." | Does "The boss called her a Kesty" *necessarily* attribute derogation to the boss? | Case (e): Reporter is anti-derogation (e.g., "The boss called her a Kesty—it was disgusting"). | **Yes**: The word "Kesty" semantically encodes derogation, so reporting it attributes contempt. *Against A if no derogation inferred.* | **No**: Derogation depends on context (e.g., reporter’s tone). Could be neutral if reporting descriptively. *Against B if derogation always attributed.* |  
  | **Pragmatic cancellability** | "Derogation is non-cancellable; it’s conventional." | "Derogation is cancellable via context/speaker intent." | Can case (c) (code use) *fully* lack derogation? | Non-Kestian to ally: "Lena’s a Kesty" (agreed code, no animus). | **No**: Semantic derogation persists. Listeners will detect contempt. *Against A if use is non-derogatory.* | **Yes**: No norm violation or animus → no derogation. *Against B if derogation is consistently perceived.* |  

  ---

  ### 4. Verbal Disputes  
  We flag two non-substantive disagreements:  
  - **"Meaning" vs. "Use"**: Side A uses "meaning" to include conventional/non-truth-conditional content; Side B restricts "meaning" to truth-conditional content and labels non-truth-conditional effects "pragmatic." This is a terminological split about the semantics/pragmatics boundary.  
  - **"Derogation" as process vs. content**: Side B’s "derogation" refers to a *pragmatic effect* (like offense-taking); Side A’s "derogation" is *lexical content*. We agree the *effect* (offense) is real but dispute its source.  

  ---

  ### 5. Predictions for Cases (a)–(g)  
  Both sides specify predictions and what would falsify their view.  

  #### (a) Plain use: "He’s a Kesty." (target is Kestian)  
  - **Side A**: Predicts derogation. *Falsified if* no derogation detected in default contexts.  
  - **Side B**: Predicts derogation (via norm violation). *Falsified if* derogation persists despite context neutralizing norms.  

  #### (b) In-group affectionate: "She’s a Kesty." (Kestian→Kestian)  
  - **Side A**: Predicts *no derogation* (pragmatic cancellation). *Falsified if* derogation perceived.  
  - **Side B**: Predicts *no derogation* (pragmatic triggers absent). *Falsified if* derogation perceived.  

  #### (c) Out-group code use: "Lena’s a Kesty." (non-Kestian→non-Kestian, no animus)  
  - **Side A**: Predicts derogation (conventional meaning). *Falsified if* use is consistently non-derogatory.  
  - **Side B**: Predicts *no derogation* (context suspends norms). *Falsified if* derogation perceived.  

  #### (d) Embedded:  
  - *Conditional*: "If he’s a Kesty, they won’t hire him."  
    - **Side A**: Derogation projects (contempt assumed). *Falsified if* no derogation.  
    - **Side B**: Derogation may not project (e.g., conditional neutralizes norm violation). *Falsified if* derogation always persists.  
  - *Question*: "Is she a Kesty?"  
    - **Side A**: Projects contempt (presupposed). *Falsified if* neutral.  
    - **Side B**: No inherent projection. *Falsified if* invariably contemptuous.  
  - *Negation*: "He isn’t a Kesty."  
    - **Side A**: Projects contempt for Kestians. *Falsified if* no contempt.  
    - **Side B**: Contempt context-dependent. *Falsified if* contempt obligatory.  

  #### (e) Reported speech: "The boss called her a Kesty."  
  - **Side A**: Attributes derogation to the boss. *Falsified if* no derogation inferred.  
  - **Side B**: Derogation depends on reporter’s framing. *Falsified if* derogation always attributed.  

  #### (f) Conjoined with praise:  
  - "She’s a Kesty and a brilliant surgeon."  
