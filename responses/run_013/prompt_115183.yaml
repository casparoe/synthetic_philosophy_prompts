  1. **Agreed Claims**: A numbered list of claims both sides endorse.
  2. **Disagreements**: For each point of disagreement, we state each side's position in their own terms.
  3. **Cruxes**: A table of key sub-questions (cruxes) that could resolve the dispute, with each side's predictions for shared evidence.
