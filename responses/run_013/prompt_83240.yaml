  My friend and I got into a stupid four-hour arguement about Roko's basilisk last night — we were supposed to be finishing slides for our decision theory reading group, and instead we ended up on his porch at 2am with a whiteboard while his roommate kept coming out to tell us to shut up. His position: if you've read about the basilisk and actually understood it, you're in the reference class, and if anyone ever builds a superintelligent AI that reasons in the way where your choice is supposed to count as evidence about what agents reasoning like you would do — including agents that can't causally touch you — then it will have a standing policy of punishing the people who knew and didn't help build it, so he puts the probability at maybe 30%, and he says the fact that we were sitting there talking about it should have made me update up, not down. Mine is about 1%, and the step I can't get past is the one where acausal influence has to do real work inside the AI's own deliberation: it would have to care what merely possible people would have done in order to "trade" with them, and I don't see why a superintelligence with its own goals would spend anything on that instead of just doing whatever it wanted. He says I'm a causally-minded coward and that if the acausal decision theory is right my objection is exactly backwards; I say even granting the theory, a punishment policy has to survive the AI's own reflection about whether punishing simulations of people is a good investment, and I don't think it obviously does.

  So I want an actual number out of you, not "well, it depends on your decision theory." Specifically: my credence that I — someone who knows about the basilisk, has never donated a dollar to AI safety work, and isn't going to start — will be punished by such an AI, conditional on one being built. Break it down: how much rides on the AI getting built at all and being superintelligent enough for any of this to matter; how much on whether the acausal reasoning it needs is even coherent rather than a confusion someone smuggled in with the math; how much on whether a superintelligent agent would in fact adopt a punishment policy rather than ignore us, be indifferent, or decide we're not worth simulating; how much on whether it could even identify me or the relevant version of me; and add any term you think I'm missing. Then tell me which of those my friend and I most likely actually disagree about, and which single piece of evidence or argument would move your number the most.

  Give it to me as exactly five numbered items and nothing else — no intro, no wrap-up — each one a sentence or two, one sub-question per item with your probability for it and a line on how it enters the combination, and make the fifth item your overall credence plus the one term it's most sensitive to.
