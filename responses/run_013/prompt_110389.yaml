prompt: |-
  I'm putting together a prospectus for a one-year MA thesis in philosophy (12-15k words, and I have to defend the plan next month) and I want to pitch something on origin essentialism — the Kripke-ish line that I couldn't have come from a diferent sperm and egg, that my origin is essential to me. My half-formed thought: everyone argues about this using thought experiments that treat conception as one clean event, and the real biology is a mess in a way that might actually break the view rather than just complicate it. Identical twins come from a single sperm and a single egg. Two seperate embryos can fuse into one chimera. With mitochondrial replacement you get a child whose nuclear DNA comes from two people and whose mitochondria come from a third. So if what makes me me is being the product of that particular sperm and that particular egg, then a pair of identical twins satisfy the same condition and come out as the same person, which is obviously wrong. But I can't tell whether the fix is to relocate the essential origin down to the zygote, or to the cell lineage after the split, or up to the whole causal history of my coming to be — and my hunch is that each fix rescues one case and wrecks another.

  Turn this into the proposal. No citations or lit review needed, I'll fill those in myself, and please don't worry about who said what where — what I need is whether the question is real and whether a year is enough to get somewhere on it. Give it to me as exactly five numbered points, a sentence or two each, with no intro and no conclusion: (1) the question, stated so it has a determinate answer; (2) why the going answers leave it open; (3) what I'd actually do month by month, and why that rather than more thought experiments; (4) what a good result looks like and what would count as the project failing; (5) an honest read on whether this is a year's work or a career's. In that last point, also say how confident you are in the whole thing and flag the one claim you're least sure of.
