prompt: |-
  I'm a backend engineer with no philosophy background, and somehow I've ended up being the one who writes the guidance note for a section of our internal complaints policy. We're about forty people, so "policy" means a Google Doc that three of us have edit access to.

  The section is the one about getting waved off — you raise something and it's dismissed not because it's wrong but because of who's saying it. I'm told the wording came out of a book by a philosopher called Miranda Fricker, and that the term for it is testimonial injustice, though I've only read the summary. Priya, our ops lead, is the one who actually hears these and she's been ruling on them for about eighteen months. Her write-ups are terse and usually she doesn't say why, which is exactly my problem: I have to write the guidance note and I don't know what rule she's really running. Her rulings so far:

  1. A blind engineer in our accessibility group said a new component library would be unusable with her screen reader. The product lead said she couldn't really judge the visual side of it and moved the ticket to the backlog. It shipped, it broke for screen reader users, took three weeks to sort out. Upheld. Her note mentions that three other people in the accessibility group had hit the same wall that quarter.

  2. One of our test engineers has raised about five alarms over two years about the same flaky service, and every one turned out to be nothing. His fifth was triaged as low priority and it was nothing again. He complained. Not upheld. Her note says the call was about his record on that service.

  3. A QA engineer raised a data-loss risk in three consecutive sprint reviews; the first two times she was told it wasn't really a risk. Then a bloke on the platform team said nearly the same thing and it was a P1 by lunchtime, and we were about an hour away from losing a day's writes. Upheld. Her note just says: same concern, different response.

  4. Someone complained their pull request comments got ignored. The comments turned out to be wrong. Not upheld.

  5. A night-shift support person kept saying that a particular error message was making customers do the wrong thing. Everyone believed her about the message, but nobody treated the customers-doing-the-wrong-thing part as a bug, because we didn't have a category for it. She filed under this section and Priya didn't uphold — said it was a real problem but not this one, and pushed it to product.

  So that's two upheld and three not, and I can fit at least two different rules to all five of them, which is why I'm stuck.

  Now next week there's a new one and I have to pre-write the guidance around it. We've just switched on an automated triage bot for incident reports — it scores each report and routes it, and it was trained on our own past triage decisions. A fairly senior backend dev filed a report about a permissions bug that could have let one tenant read another tenant's data. He didn't fill in the repro-steps field; he recorded a two-minute screen capture and linked that instead. The bot scored the report as low quality because the field was empty, so it sat in a low-priority queue for eleven days. Nothing came of it in the end: someone else found the same bug independently, and he only realised his report had been sat on when he went looking. Nobody thinks the bot has it in for anyone, and the bloke who wrote it is not the sort of person who usually gets ignored. It's definately the first complaint about the bot as far as we know, though we've no idea how many other reports it's quietly deprioritised.

  Will she uphold it? And more to the point, what's the rule she seems to be running, and what are the other rules that fit all five of her earlier rulings just as well? For each of those, say what it predicts for the bot case, then give me your actual best guess about which one she's running and why. Then tell me which single further case would best tell the rules apart — I'll take it to her. And if it genuinely comes down to a coin flip, tell me what we'd be committing ourselves to in the guidance note either way.

  One request: don't just give me the labels for the rules, I need to see how each one gets from her five rulings to a verdict on the sixth, because that reasoning is the bit I have to write up.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a backend engineer tasked with writing a guidance note on testimonial injustice for their internal complaints policy. They've provided five prior rulings by Priya and need to predict the outcome of a new case involving an automated triage bot. The core challenge is reverse-engineering Priya's implicit rule from patterns in her decisions.

  First, I need to analyze all five cases to identify consistent principles. The upheld cases (1 and 3) both involve credible warnings being dismissed due to the speaker's identity (blind engineer, female QA), leading to actual harm. The rejected cases show different patterns: case 2 had a track record of false alarms, case 4 involved factually incorrect input, and case 5 was misclassified rather than dismissed. This suggests Priya focuses on identity-based credibility deficits causing preventable harm.

  For the bot case, I consider how different rules would apply. A strict identity-based rule wouldn't uphold since the bot isn't biased against individuals. A track-record rule might uphold if the bot's pattern resembles case 1's systemic dismissal. But Priya's pattern seems to require human prejudice - she dismissed case 5 because the issue was procedural, not credibility-based. The bot's behavior is more like case 5: a system flaw rather than testimonial injustice.

  To test this, I'd propose a hypothetical where a junior woman's report is downgraded while an identical report from a senior man isn't - the classic Fricker test. If Priya upholds that, it confirms identity focus. If not, her rule is likely broader. The guidance note's wording must clarify whether systemic biases like algorithmic filtering qualify, as this determines future policy scope. The stakes are high - getting this wrong could either overlook subtle biases or dilute the policy's purpose.
answer: |-
  Based on Priya's pattern, the core rule she's applying isn't just *any* dismissal due to identity, but specifically **dismissal stemming from a *prejudicial credibility deficit* tied to a *systemically marginalized characteristic* that leads to *preventable harm*.** Let's break down the competing rules and their predictions for the bot case:

  **Competing Rules Fitting All Five Cases:**

  1.  **Rule A (Identity-Based Credibility Deficit - Priya's Likely Rule):**
      *   **Core:** Was the dismissal primarily caused by the *speaker's identity* (e.g., gender, race, disability, tenure, role) leading the listener to assign *less credibility* than deserved, resulting in preventable harm?
      *   **Case 1 (Blind Engineer):** Upheld. Identity (blindness/disability) led to credibility deficit ("can't judge visual side") despite expertise. Preventable harm occurred.
      *   **Case 2 (Test Engineer):** Not Upheld. Dismissal based on *track record* (low credibility *for this specific issue*), not inherent identity/prejudice. No harm occurred.
      *   **Case 3 (QA Engineer):** Upheld. Identity (gender/role?) led to credibility deficit vs. male platform engineer. Same concern, different response. Preventable harm nearly occurred.
      *   **Case 4 (PR Comments):** Not Upheld. Dismissal based on *content being wrong*, not the speaker's identity. No harm occurred (wrong comments ignored).
      *   **Case 5 (Support Person):** Not Upheld. Credibility *granted* about the message ("Everyone believed her"), but the *categorization/system* failed her *concern*, not her identity as the speaker. Harm likely occurred, but mechanism wasn't identity-based credibility deficit.
      *   **Prediction for Bot Case:** **Not Upheld.** The dismissal was caused by:
          *   The *submitter's action* (not filling repro steps).
          *   The *bot's design/rules* (scoring heavily on empty fields).
          *   The *submitter's identity* is irrelevant (senior, not marginalized, bot isn't "prejudiced" against *him*). No evidence the bot treats *types of people* differently based on identity. Harm was *possible* but didn't occur, and wasn't caused by an identity-based credibility deficit. This mirrors Case 5 (system failure, not identity prejudice).

  2.  **Rule B (Track Record / Pattern of Dismissal):**
      *   **Core:** Was the dismissal part of a *pattern* where this person/group is consistently ignored or dismissed on similar issues, regardless of the *reason* for the dismissal or the speaker's identity?
      *   **Case 1:** Upheld. Pattern mentioned (3 others in group hit wall). Pattern exists.
      *   **Case 2:** Not Upheld. Pattern *of false alarms* is the *reason* for dismissal, not a pattern *of being dismissed unfairly*. Pattern not relevant to *unjust* dismissal.
      *   **Case 3:** Upheld. Pattern of dismissal for the *speaker* (raised 3 times, ignored until a man spoke). Pattern exists.
      *   **Case 4:** Not Upheld. No pattern mentioned; isolated incident based on merit. No pattern.
      *   **Case 5:** Not Upheld? Unclear pattern. The *issue* wasn't categorized, but no pattern of *the speaker* being dismissed unfairly stated. Could argue *support role* often dismissed, but Priya didn't uphold, suggesting she didn't see this pattern as defining. Pattern not established as systemic *for the speaker/group*.
      *   **Prediction for Bot Case:** **Unknown/Leans Not Upheld.** This is the *first* complaint about the bot deprioritizing *this person*. No established pattern *against him*. If Priya sees the bot's *general* deprioritization of reports lacking fields (regardless of submitter) as a problematic "pattern," she *might* uphold, but her Case 5 ruling suggests she distinguishes pattern *against a person/group* (Cases 1 & 3) from general system flaws (Case 5). Likely **Not Upheld** as no pattern *against this submitter* is shown.

  3.  **Rule C (Preventable Harm from Dismissal):**
      *   **Core:** Was the dismissal unreasonable and did it lead to *preventable harm*?
      *   **Case 1:** Upheld. Harm occurred (broke for users).
      *   **Case 2:** Not Upheld. *No harm* occurred (it was nothing). Dismissal was arguably reasonable based on history.
      *   **Case 3:** Upheld. Near-harm occurred (almost lost data).
      *   **Case 4:** Not Upheld. *No harm* occurred (comments were wrong). Dismissal was reasonable.
      *   **Case 5:** **Contradiction?** Harm *did* likely occur (customers kept doing wrong thing). Priya *didn't* uphold. This breaks Rule C. Priya explicitly said "real problem but not this one," meaning the harm wasn't sufficient *for this specific complaint category* (testimonial injustice). Harm alone isn't enough; the *mechanism* (identity-based credibility deficit) matters.
      *   **Prediction for Bot Case:** **Leans Upheld.** Harm was *possible* (serious permissions bug), dismissal was arguably unreasonable (using a video for repro *should* be acceptable), and it *could* have led to harm if not found by someone else. **BUT** - Priya's ruling on Case 5 (where harm occurred but not via identity prejudice) suggests she *wouldn't* uphold under Rule C alone. Case 5 breaks this rule.

  **Analysis & Best Guess:**

  *   **Rule A (Identity-Based Credibility Deficit)** fits *all five* rulings cleanly without contradiction. Case 5 is the key differentiator: the harm was real, but the *mechanism* wasn't an identity-based credibility deficit; it was a system categorization failure. Priya explicitly separated this.
  *   **Rule B (Pattern)** fits reasonably well but is weaker on Case 5 (no pattern established) and less clearly articulated in Priya's notes than the identity/credibility aspect in Cases 1 & 3.
  *   **Rule C (Harm)** is **contradicted** by Case 5. Harm occurred, but Priya didn't uphold the *testimonial injustice* complaint because the mechanism was wrong.

  **Best Guess for Priya's Rule & Bot Case Prediction:**

  *   **Priya's Rule:** "Testimonial injustice occurs when a concern is dismissed primarily because the listener assigns the speaker less credibility due to prejudice related to a systemically marginalized characteristic (e.g., disability, gender, race, role), and this dismissal leads to preventable harm or significant risk."
  *   **Prediction for Bot Case:** **Not Upheld.** The dismissal was due to:
      1.  **Action, not Identity:** The submitter didn't follow the expected process (fill repro steps), triggering the bot's rule.
      2.  **System Flaw, not Prejudice:** The bot's scoring mechanism is flawed (over-penalizing missing fields despite alternatives). It's a system design issue, not a prejudice against the *speaker's identity*. The senior dev isn't marginalized, and the bot isn't making identity-based judgments.
      3.  **Mechanism Mismatch:** This mirrors Case 5 (system categorization failure) more than Cases 1 or 3 (identity-based credibility deficit). Harm was possible, but the *cause* of dismissal wasn't identity prejudice.

  **The Crucial Test Case to Distinguish Rules:**

  Propose this scenario to Priya:

  > "A junior female engineer from a non-core team (e.g., QA or Support) repeatedly raises concerns about a specific security vulnerability in the infrastructure, providing clear technical details each time. Her tickets are consistently deprioritized or closed with comments like 'needs more senior review' or 'likely low impact'. A few months later, a senior male engineer from the Platform team raises the *exact same vulnerability* with the *same level of detail*. His ticket is immediately prioritized as P0 and fixed within a day. No prior pattern of false alarms exists for either engineer."

  *   **Rule A (Identity-Based Deficit):** **Upheld.** Clear case: identity (junior, female, non-core role) led to credibility deficit. Same concern, different response based on speaker identity. Preventable risk existed.
  *   **Rule B (Pattern):** **Upheld.** Clear pattern of dismissal *for this speaker* on this issue, contrasted with immediate acceptance when raised by a different identity.
  *   **Rule C (Harm):** **Upheld.** Preventable risk existed due to unreasonable dismissal.
  *   **Priya's Likely Ruling:** **Upheld.** This *perfectly* fits the mechanism of identity-based credibility deficit (like Case 3, amplified) and distinguishes from Case 5 (system flaw, not identity prejudice) and Case 2 (history of inaccuracy).

  **What the Guidance Note Commits To (If Rule A):**

  1.  **Core Principle:** Focuses squarely on **prejudice impacting perceived credibility** tied to **protected characteristics or systemically marginalized statuses** (disability, gender, race, tenure, role perception).
  2.  **Not Covered:**
      *   Dismissals due to *proven* poor track record on a *specific issue* (Case 2).
      *   Dismissals due to *factual inaccuracy* of the *content* (Case 4).
      *   Dismissals due to *procedural errors* by the submitter (Bot Case).
      *   Dismissals due to *system limitations/categorization failures* (Case 5), even if harm occurs.
      *   Dismissals based on personality conflicts *unless* tied to a protected characteristic.
  3.  **Evidence:** Requires showing a link between identity and credibility deficit, often through comparators (Case 3) or known biases (Case 1). Pattern helps evidence systemic bias.
  4.  **Harm:** Must show *significant preventable harm or risk* resulted *because* of the credibility deficit. Near-misses count (Case 3).

  **Writing Your Guidance Note:**

  *   **Define Clearly:** "Testimonial injustice occurs when a person's concern is not believed or acted upon *because* the listener makes a prejudiced judgment about the speaker's credibility, based on characteristics like disability, gender, race, perceived experience level, or team role. This must lead to significant harm or risk that could have been prevented."
  *   **Examples from Rulings:** Briefly reference Case 1 (disability/role leading to dismissal of expertise, harm occurred) and Case 3 (gender/role leading to dismissal, same concern believed when raised by others, near-harm).
  *   **Counter-Examples:** Briefly reference Case 2 (dismissal based on specific history, not prejudice), Case 4 (dismissal based on content being wrong), Case 5 (system couldn't categorize the *concern*, not prejudice against the *speaker*).
  *   **Key Test:** "Would the concern have been believed and acted upon if raised by someone perceived as having higher credibility, *without* a change in the substance of the concern or evidence provided?"
  *   **Process:** Focus Priya's notes on explaining *whether* an identity-based credibility deficit occurred and *how* it caused harm/risk. Terseness is ok, but the "why" must address the credibility link.

  Priya's rulings show a consistent, philosophically-aligned application of Fricker's core concept. The bot case doesn't fit that mechanism. Use the proposed test case to confirm her reasoning – if she upholds it, your guidance is crystal clear. If not, you need a deeper discussion about her interpretation of "identity" and "prejudice" in your context. Good luck!
