prompt: |-
  I sit on the board of a housing cooperative — 214 units across three buildings, governed by a one-unit-one-vote general meeting — and we are preparing to vote on whether to absorb the 38-unit building next door, currently a separate cooperative in financial difficulty. Our solicitor's advice is crisp: only our own members may vote, because the question is whether we take on the debt. A residents' group in the neighbouring building has begun arguing the opposite, namely that they are the ones whose homes, rents and community would be most affected, and that a vote taken without them is not a decision about them but a decision over them. In the middle of this I have been reading about what political theorists call the boundary problem: roughly, that no democratic procedure can by itself determine who the demos is, because every procedure presupposes an already-constituted electorate, and any attempt to settle membership democratically merely pushes the question back one level — who votes on who votes? I would like you to set out the most important implications of that problem for our situation, treating it as a structural feature of the decision rather than as a debating point to be waved away.

  Please be concrete, and distinguish the levels at which the problem bites. In particular: what follows for the legitimacy of a vote from which the neighbouring residents are excluded, and does the answer change if the merger would leave them materially worse off as opposed to merely differently off; whether the familiar all-affected-interests test can do any real work here, given that it threatens to expand the electorate without limit (our suppliers, our lender, the city's tax base, the neighbours' children who might one day want a flat), and how it compares with the narrower thought that only those subjected to a decision's coercive enforcement have a claim to a say; whether the fact that we are ourselves a demos nested inside a larger one — a cooperative inside a municipality inside a state — makes the boundary problem easier or harder to live with; and what the problem implies about exit and voice, that is, whether a right to leave does any of the legitimating work that a right to vote cannot.

  Finally, we floated one proposal that I would like you to assess as an implication rather than as a design: an affectedness weighting, under which non-members who would bear a material share of the consequences receive a fractional vote, capped so that the existing membership can never be outvoted on the transfer of its own assets. Does the boundary problem show this to be a principled compromise, a fudge that gets the worst of both principles, or an honest acknowledgment that every demos is drawn by a decision that cannot be democratic all the way down? I am less interested in a survey of positions than in what the problem actually forces us to concede, and what it does not.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're on the board of a housing cooperative facing a merger vote with a neighboring 38-unit building in financial trouble. The solicitor says only their members can vote since they're taking on debt. But the neighbors argue they're the most affected and should have a say. The user brings up the boundary problem in democratic theory—who gets to decide who the voters are?

  First, I need to address the concrete implications of this problem for their vote. The legitimacy question is key. If the neighbors are excluded, the decision might seem illegitimate to them, especially if they end up worse off. But legally, the cooperative's rules probably support the solicitor's view. So there's a tension between formal legitimacy (following existing rules) and perceived legitimacy (those affected feeling the process was fair). If the merger harms the neighbors, this tension worsens. They might resist or challenge the decision, leading to conflict even if it's legally sound.

  Next, the all-affected-interests test. The user mentions it could expand the electorate endlessly. I should explain why it's not practical here. For example, suppliers, lenders, the city—all are affected, but including them isn't feasible. The coercive enforcement alternative is narrower. If the merger forces changes on the neighbors, like rent hikes or evictions, they have a stronger claim. But if the change is more about ownership structure without immediate coercion, it's weaker. The key is whether the decision directly imposes binding rules on them.

  Then, the nested demos point. Being part of a larger municipality means there's a higher authority, but that doesn't resolve the boundary issue. The city's laws might not cover this specific merger, so the cooperative has to decide internally. This actually highlights the problem more because the existing rules don't address who decides in such cases. Higher-level frameworks might provide some recourse but not solve the legitimacy gap locally.

  Exit vs. voice: Can the neighbors' right to leave legitimize excluding their vote? If leaving is feasible—selling their units at fair value—it might reduce the harm. But in a housing cooperative, leaving isn't always practical, especially if the merger devalues their property. So exit doesn't fully compensate for lack of voice, especially for vulnerable residents.

  The affectedness weighting proposal: Giving neighbors fractional votes. This tries to balance both principles but has issues. The boundary problem shows that setting the fraction is arbitrary—why 0.3 votes? It's a pragmatic fudge but doesn't resolve the deeper legitimacy question. However, it might be seen as an honest acknowledgment that perfect democracy isn't possible here, and it's better than total exclusion.

  Underlying needs: The user might be looking for a way to make the decision feel fair to the neighbors while protecting their cooperative's interests. They might also need practical solutions that minimize conflict and legal risks. The unspoken need could be maintaining community harmony and avoiding resentment post-merger, which is crucial for a cooperative's long-term health. They might also want theoretical grounding to present to both sides, showing that while no solution is perfect, some options are more principled than others.
answer: |-
  The boundary problem exposes fundamental tensions in your situation that cannot be fully resolved, only navigated with clear-eyed recognition of the trade-offs. Here’s how its implications cascade through your specific questions:

  ### 1. Legitimacy of the Excluded Vote
  - **Formal vs. Substantive Legitimacy**:  
    Your solicitor is correct on *formal* legitimacy: your cooperative's rules and property rights define the electorate. A vote excluding neighbors is legally valid and binding **within your existing constitutional framework**.  
    However, *substantive* legitimacy is eroded because the decision profoundly alters neighbors' lives (tenure security, rent, community). If the merger leaves them **materially worse off** (e.g., evictions, unaffordable charges), the legitimacy deficit becomes acute. They experience the decision as **imposition**, not collective choice. If outcomes are merely "different" (e.g., new management but comparable costs), the deficit is less severe but persists structurally.  
    **Implication**: The vote can proceed legally, but its moral authority and long-term stability depend on mitigating harm to neighbors. Their exclusion guarantees procedural conflict regardless of outcome.

  ### 2. The All-Affected-Interests Test & Its Limits
  - **Expansion Problem**:  
    Yes, "all affected" is paralyzing here. Suppliers, lenders, and future generations are causally affected, but including them dissolves coherent decision-making. This test **fails as a practical electorate-defining tool** precisely because it has no boundary mechanism.  
  - **Coercive Enforcement Alternative**:  
    Narrowing the electorate to those *subject to new coercive rules* (e.g., neighbors bound by merged co-op bylaws, facing eviction) is more defensible. **If the merger imposes binding obligations/penalties on neighbors, their exclusion is harder to justify**. If your co-op merely assumes debt without altering neighbors' legal status (unlikely), coercion is weaker.  
    **Implication**: Focus on whether neighbors become *subject to your co-op’s authority*. If yes, the coercion principle strengthens their claim. "Affectedness" alone is too vague; *subjection* provides a sharper (though still imperfect) criterion.

  ### 3. Nested Demoi: A False Comfort?  
  - Higher-level demoi (municipality, state) provide:  
    - **External Constraints**: Legal frameworks for mergers, tenant protections, fair housing laws.  
    - **Ultimate Recourse**: Courts or city agencies may review for procedural fairness or rights violations.  
    **But**:  
    - They **do not resolve the internal boundary problem**. The state delegates authority to co-ops precisely to manage local self-governance.  
    - Appeals to higher authority *post*-decision are costly and reactive; they don’t legitimize *ex ante* exclusion.  
    **Implication**: Nesting offers legal backstops but **heightens the dilemma**—your co-op embodies democratic self-determination yet faces a choice that exposes its arbitrary boundaries.

  ### 4. Exit as Imperfect Substitute for Voice  
  - A meaningful right to exit (e.g., selling units at fair value post-merger) **reduces but does not eliminate** the legitimacy gap.  
    - **Why?** Housing is not a fungible commodity. Exit costs are high (financial loss, community ties, scarcity of alternatives). For vulnerable residents, "exit" may equal displacement.  
    - **Voice** addresses collective self-determination; **exit** is an individual remedy. They are not interchangeable.  
    **Implication**: Facilitating fair exit (e.g., guaranteeing buyout terms) can *soften* exclusion but cannot legitimize it. Exit works best when voice is first exhausted.

  ### 5. Assessing Affectedness Weighting  
  The fractional vote proposal is a **principled fudge** that reveals the boundary problem’s inevitability:  
  - **What It Concedes**:  
    - That neighbors’ stakes merit formal recognition.  
    - That pure membership boundaries are morally inadequate when consequences spill over.  
    - That democracy requires compromise when foundational principles conflict.  
  - **What It Fails to Resolve**:  
    - **Arbitrariness**: Why 0.3 votes per neighbor? Why cap at 50%? The weights/caps are not derived democratically.  
    - **Hybrid Illegitimacy**: Neighbors still lack equal voice; members resent diluted control. Both sides may feel unrepresented.  
    - **Boundary Problem Endures**: It presupposes your co-op has authority to grant fractional votes—begging the question of who defines the rules.  
    **Implication**: This is an **honest acknowledgment that demoi are constituted by undemocratic decisions**. It pragmatically balances interests but masks its own contingency. It may be the least unjust option if:  
    - Weights reflect relative harm/benefit (e.g., neighbors get votes proportional to projected rent increases).  
    - It prevents destabilizing outcomes (e.g., neighbor bloc vetoing merger despite needing rescue).

  ### What the Boundary Problem Forces You to Concede
  1. **No Perfectly Democratic Solution**: Every electorate definition (including status quo) privileges some interests arbitrarily.  
  2. **Legitimacy is Multi-Dimensional**: Legal validity (solicitor’s view) ≠ moral acceptance (neighbors’ view) ≠ stability (post-merger cooperation).  
  3. **Harm Matters**: Excluding those made *worse off* is harder to justify than excluding those neutrally affected. Mitigation is essential.  
  4. **Constitutive Violence**: Drawing boundaries *always* involves power—here, your co-op’s power to absorb others without consent.  

  ### What It Does *Not* Force You to Concede
  - **That Any Decision Is Equally Valid**: Process matters. A vote with consultation, impact studies, and exit guarantees is more defensible than a raw majority.  
  - **That Principles Are Useless**: Coercion/subjection tests provide reasoned (though incomplete) guidance.  
  - **That Pragmatism Is Unprincipled**: Fractional votes or contingent agreements (e.g., "merge now, full incorporation vote in 2 years") can express respect even within constraints.  

  ### Conclusion
  The boundary problem condemns you to choose between:  
  - **Formal Legitimacy** (members-only vote), risking resentment and instability if neighbors are harmed.  
  - **Substantive Inclusion** (e.g., fractional votes), sacrificing procedural purity for perceived fairness.  

  **Recommendation**: Use the fractional vote model **only if** paired with:  
  - Independent assessment of harm to neighbors (informing vote weights).  
  - Sunset clauses (e.g., neighbors earn full membership after debt milestones).  
  - Transparent acknowledgment that this is a best-effort compromise, not ideal justice.  

  This admits the undemocratic foundation of the demos while striving to minimize domination. Without such concessions, the vote’s legality may hold, but its moral and communal costs could corrode the merged cooperative from within.
