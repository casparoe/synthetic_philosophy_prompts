   We have two cases (a and c) that come out against what the unit might like (because they want more evidence) and one (b) that is against.

   Important: The procedure is not perfect. Steps that are judgment calls:
     - Step 1: What counts as a flip? Requires a model and utilities. If utilities are vague, we hand off.
     - Step 2: Bounding VPI. Without a model, we use crude estimates that might be too high or too low.
     - Step 3: Estimating P(flip) and G. Without simulation, we rely on approximations.
     - Step 4: Assessing non-ignorability and side effects: requires expert judgment and is subjective.

   What the procedure cannot do:
     - It cannot handle deep uncertainty (e.g., when probabilities are not known).
     - It cannot resolve group disagreements about utilities or probabilities.
     - It cannot account for strategic behavior by the importer (game theory) beyond the simple side effect in Step 4.

