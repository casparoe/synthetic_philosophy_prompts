prompt: |-
  You are an expert in Bayesian decision theory and in value-of-information analysis, with enough exposure to regulatory practice to know what survives contact with a deadline. Before you write anything, think on paper: begin by setting out in a few sentences what the result I describe below does and does not establish, and what conditions it needs, and only then build the procedure. I would rather see your working, including the parts you are unsure about, than a polished answer that hides the joints.

  My situation. I head the risk-analysis unit at a national product-safety regulator. A few dozen times a year a hazard signal reaches us — a cluster of incident reports, a foreign regulator's alert, a supplier's disclosure, an industry study — and within a fixed statutory window (usually about eight weeks) our board must choose between ordering a recall, requiring a design change or warning label, and taking no action. My unit writes the briefing the board votes on. I have two analysts, no decision authority of my own, and no power to extend the window. Every briefing contains the same argument: someone says we should commission more evidence before the board votes, and someone else says there is no time. I need a procedure that settles that argument rather than restaging it.

  The result I want operationalised is the one usually credited to I. J. Good: for a decision-maker who is about to choose an act, the expected value of a free look at the evidence before choosing is never negative, and is exactly zero only when no possible finding would change which act is chosen. The standard justification is that you can always ignore what you learn. I believe that settles nothing in my world, because nothing here is free, we are not one person, and some findings cannot be ignored once they exist.

  Write me the procedure, not an essay on the theorem. Requirements:

  1. A staged sequence of questions in the order an analyst should ask them, with what counts as a sufficient answer at each stage, the point at which the procedure stops with a no, and the points at which it must hand the question to a human because the question is about values or governance rather than about facts. Assume an analyst with one week, a spreadsheet, no simulation software, and no outside consultants.
  2. Keep the conditions of the result visible rather than buried. Test each condition in turn, and say plainly what is and is not licensed when a condition fails.
  3. Give me a screen that needs no computation. Value of information on a study can never exceed the value of perfect information, so if the delay and the study together cost more than perfect information about the hazard is worth, stop there. Tell me how to get a crude bound on that when we cannot compute one.
  4. Make the flip test an explicit step: information that cannot change which act we choose is worth exactly zero, however interesting it is, and however much a board member wants it.
  5. Say what to do when the answer is not a number and no one can supply a probability.
  6. Handle the question of who the we is. The result is about a single agent with one probability function and one utility function. My board has five members, our general counsel, and a public that bears the harm.
  7. Handle the ways a finding stops being something we can ignore: a study whose launch is public and prompts the importer to reformulate before we can act on the result; a measurement that is itself an intervention, such as publishing a hazard ranking; a proxy measure whose relation to the actual harm is contested.
  8. Handle the distinction between the expectation before the draw and the outcome after it. Collecting evidence and then learning nothing decision-relevant, or learning something that makes us look foolish, is not evidence that collecting it was a mistake, and my analysts need a way to say this that a hostile post-mortem will accept.
  9. Two studies are not worth the sum of their separate values; value them in sequence, incorporating the first before pricing the second. Build this in.
  10. Do not let the procedure degrade into always gather more.

  Then run it on three cases: (a) a chemical in a children's product, forty incident reports of a rash, a plausible mechanism, and a proposed twelve-week sensitisation study in a contract laboratory, with the board voting in eight weeks; (b) a proposed consumer-attitude survey about a hazard that no act in our repertoire is sensitive to; (c) a study whose launch would be publicly visible and would give the importer time to reformulate the product before we could act on the results. At least one of the three should come out against what my unit would like to do, and you should say so directly.

  Do not give me citations, a reading list, or references to the literature; I cannot check them and I do not need them. Give me the procedure, and flag any step that is a judgment call dressed up as procedure, any step that will misfire, and anything the procedure cannot do at all.

  Finally, throughout, separate what is settled among people who know this material from what is genuinely contested. If the extension of the result to institutions, to groups with conflicting priors, or to agents who are not expected-utility maximisers is contested, say that it is contested and do not present your own resolution as the consensus. If the way I have stated the result above is not the way it is actually established, correct me before building on it.
reasoning: |-
  We are operationalizing Good's Expected Value of Sample Information (EVSI) for a regulatory context with constraints.
   The theorem: For a single decision-maker with fixed utility function and prior probabilities, the expected value of free (costless, instantaneous) information is non-negative, and zero only if no possible outcome would change the optimal action.

   However, in practice:
     - Information is not free: it costs time and money.
     - We are an institution: multiple stakeholders, multiple decision-makers, and public visibility.
     - Some information may have side effects (e.g., prompting action by others).

   The procedure must account for:
     - The fixed deadline (8 weeks): if a study takes longer than the remaining time, it cannot be used.
     - The cost of the study (including time delay) and the fact that the value of the study must exceed its cost.
     - The possibility that the study might not change the decision (the "flip test").
     - The fact that the information might not be ignorable (because of public pressure, legal obligations, etc.).

   We break the procedure into stages. At each stage, we test a condition. If the condition fails, we stop and do not commission the study.

   Stage 0: Preconditions
     - The study must be feasible within the time and resources we have. If the study cannot be completed and analyzed by the time the board votes (e.g., 12-week study but only 8 weeks until vote), then stop: the study is not possible. [This is a hard constraint.]

   Stage 1: The Flip Test (also known as the "sufficient statistic" test or the "can it change the decision?" test)
     - Question: Is there any possible outcome of the study that would change the board's decision? 
     - How to answer: The analyst must consider the set of possible outcomes and, for each, determine if the optimal action might change. This requires:
          a. The set of actions: recall, design change/warning, no action.
          b. The prior beliefs about the state of the world (e.g., the true harm level) expressed as a probability distribution.
          c. The consequences (utilities) of each action in each state.
          d. The likelihood function: how the study outcome relates to the state.
       Without simulation, we can do this crudely by considering extreme outcomes. For example, for a study that measures harm level H (continuous), consider:
          - What if H is very high (above a threshold where recall is optimal)?
          - What if H is very low (below a threshold where no action is optimal)?
          - If there is an outcome in the middle that might change the decision? 
       If the analyst can identify at least one outcome that would flip the decision, then the study has potential value. Otherwise, the expected value of the study is zero and we stop: do not commission.

     - Note: This step requires the analyst to have a model of the decision. If the utilities or probabilities are too vague, we must hand off to a human (e.g., the board or a designated expert) for a judgment on whether any outcome could change the decision.

   Stage 2: The Bound Test (using the value of perfect information, VPI)
     - The value of the study (EVSI) cannot exceed the value of perfect information (VPI) about the state of the world (the harm). 
     - VPI is the expected value of knowing the true state and choosing the best action for that state, minus the expected value of the best action without that information.
          VPI = E[max_a U(a, state)] - max_a E[U(a, state)]
     - We need a crude bound on VPI. Without simulation, we can use:
          a. Identify the two most likely states (or a worst-case and best-case) that would lead to different actions.
          b. Compute the expected loss of choosing the wrong action in those states, weighted by the probability of being in that state and the chance of choosing the wrong action without perfect information.
       However, a simpler bound: 
          VPI <= (max utility - min utility) * (probability that the decision is not already clear)
       But this is too loose.

       Alternative: 
          Let p be the probability that the state is such that the best action is not the one we would choose without perfect information. 
          Then VPI <= p * (max loss from choosing the wrong action in that state)

       How to bound p? The analyst must ask: what is the probability that the true harm level is in the region where the optimal action is different from the current best action? Without a full model, we can use:
          - If the prior is concentrated on one action being best, then p is small.
          - If the prior is spread over the threshold, then p might be as high as 0.5.

       The max loss: what is the biggest utility difference between the best action and the second best in the problematic state? 

       Example: 
          Suppose without the study we would choose "no action". The state where "recall" is needed: if we don't recall, we incur a large harm. The loss in that state is the harm avoided by recall minus the cost of recall. 

       Without precise utilities, we can use monetary equivalents (if available) or a qualitative scale (but then we need a conversion).

     - Now, the cost of the study: 
          - Direct cost: money, analyst time (convert to a common unit?).
          - Delay cost: if we wait for the study, we are delaying the decision. During the delay, we are stuck with the current situation (which might be harmful). 
          - Opportunity cost: the resources could be used elsewhere.

     - If the direct cost + delay cost > VPI (crudely bounded as above), then the study is not worth it. Stop.

     - Note: This step requires judgment. If the analyst cannot bound VPI, then we must hand off to a human.

   Stage 3: The Expected Net Value of the Study (if we pass the first two stages)
     - Now we need a more precise estimate of EVSI and subtract the cost. But without simulation, this is hard.

     Alternative: 
          We can use a break-even analysis. What is the minimum probability of a flip (i.e., the study changing the decision) that would justify the cost? 
          Let C = total cost (direct + delay)
          Let G = the expected gain if the study flips the decision to the correct one (i.e., the expected loss avoided by changing the decision when it is wrong).

          Then we require: 
              EVSI >= C
              But EVSI = P(flip) * G

          So we require: P(flip) >= C / G

          How to get P(flip)? The analyst must estimate the probability that the study outcome will fall in the region that would change the decision. This requires:
              - The prior distribution of the state.
              - The likelihood of the study outcomes.

          Without simulation, we can use:
              - Consider the prior probability that the state is near the decision threshold. 
              - Consider the precision of the study: if the study is very noisy, it might not move the posterior enough to flip.

          Example: if the prior probability that the state is above the threshold is p0, and the study is designed to measure the state, then the flip probability is the probability that the study outcome is on the other side of the threshold? Not exactly: because of noise, we might get an outcome that pushes the posterior across the threshold even if the true state is not near it.

          This step is the most demanding. Without simulation, we can use a normal approximation or a simple scenario approach.

          Alternatively, we can hand off to a human for a judgment on P(flip) and G.

     - If we can compute or estimate EVSI and it is greater than or equal to the cost, then we commission the study. Otherwise, we do not.

     - However, note: if we cannot do this step, we might have to rely on the bound from Stage 2. But if the bound was too loose, we might commission a study that is not worth it. So we must be cautious.

   Stage 4: Non-ignorability and Side Effects
     - We must consider:
          a. Public visibility: if the study is launched, will it trigger actions by others (e.g., the importer reformulating)? If so, then the decision context changes. We might not get the benefit of the information because the product changes. Then the study might be worthless (or even harmful if it causes a reformulation that is inadequate).
          b. The study itself as an intervention: e.g., publishing a hazard ranking might cause public panic or market shifts. Then the study has a cost beyond the direct cost.
          c. Proxy measures: if the study measures a proxy that is contested, then even if the study is done, it might not resolve the uncertainty about the harm. Then the value is reduced.

     - How to handle: The analyst must ask: 
          - "If we commission this study, will the importer or others likely act before we can?" 
          - "Could the study itself cause harm (e.g., by revealing a hazard without providing a solution)?" 
          - "Is there a risk that the study result, even if obtained, will not be accepted as resolving the uncertainty?" 

          If the answer to any of these is yes, then the expected value of the study is reduced or even negative. We must discount the EVSI accordingly. This is a judgment call. If the discount is too severe, we stop.

     - This step requires input from experts familiar with the industry and the legal context. The analyst cannot do this alone.

   Stage 5: Multiple Studies
     - If multiple studies are proposed, we value them sequentially. We start with the most promising one (by the above procedure). If we commission the first, then we update our beliefs and then re-run the procedure for the next study with the updated beliefs and the remaining time.

     - However, note: the board must vote in 8 weeks. If the first study takes 4 weeks, then the second must be feasible in 4 weeks. And we must account for the cost of both.

     - But the procedure above is for one study. We do not allow two studies to be considered simultaneously unless they are independent and we can do them in parallel. The value of the second study depends on the outcome of the first.

     - Therefore: consider studies one at a time, in the order of their perceived value (e.g., cost, time, or expected benefit). After evaluating the first, if we commission it, then we update and evaluate the next.

     - However, if two studies are mutually exclusive (due to time or resources), we choose the one with the highest expected net value.

   Special note on group decision-making:
     - The theorem assumes a single decision-maker. We have a board. 
          - We can model the board as having a collective utility function? (But this is contested.)
          - Alternatively, we can use the probabilities and utilities of the risk-analysis unit (as the briefing unit) but then we must align with the board.

     - How to handle:
          - The analyst must use the board's revealed preferences or stated preferences for utilities. If the board has not provided these, we must get them (but that takes time). 
          - In practice, we use the best estimate of the board's utility function from past decisions or from guidelines.

     - If there is disagreement among the board members, then the flip test must be done for the majority. But note: the study might change the mind of a pivotal voter. This is very complex and beyond the procedure. We hand off to a human.

     - We note that the extension to groups is contested.

   Procedure Steps:

   Step 0: Feasibility Check
     - Can the study be completed and analyzed by the board vote? (Time constraint)
          If not: stop, do not commission.
     - Are the resources (money, personnel) available? 
          If not: stop.

   Step 1: The Flip Test
     - Based on the current prior and the decision model, is there any outcome of the study that could change the optimal action? 
          - If no: stop (value = 0).
          - If yes: proceed.
     - If the decision model (utilities or probabilities) is too vague, hand off to the board or designated expert to answer the flip question.

   Step 2: Bound Test
     - Compute a crude bound on the Value of Perfect Information (VPI) about the state of the world.
          - Identify the current best action without the study.
          - Identify the states where that action is not optimal. 
          - Let p = the prior probability of those states (or an upper bound).
          - Let L = the maximum loss (in utility) of taking the current best action in those states (compared to the best action in that state).
          - Then VPI_bound = p * L   [This is an upper bound on VPI? Actually, VPI is the expectation of the loss avoided, so it is <= max_loss * p, but also <= the entire range of utility differences. But we want an upper bound for the study value.]

     - Compare: 
          Total cost of the study = direct cost + delay cost.
          If total cost > VPI_bound, then stop: even perfect information is not worth the cost of the study.

     - If the bound is too loose (or we cannot compute it) and the cost is high, we might stop. Otherwise, proceed.

   Step 3: Expected Net Value Estimation
     - Estimate the expected value of sample information (EVSI) and subtract the cost.
          EVSI = P(flip) * G
          where:
              P(flip) = probability that the study outcome will lead to a different action than the current best.
              G = the expected gain from flipping (when flipping is beneficial). 

          Without simulation, we can:
              a. Use a scenario approach: 
                  - Consider a few scenarios (e.g., study outcome high, medium, low) and compute the decision and the gain in each.
                  - Weight by the probability of each scenario.

              b. Use a normal approximation for the posterior and compute the probability that the posterior expected utility of the current best action falls below that of another action.

          If we cannot compute, we can do:
              - Ask: what is the minimum P(flip) that would be required to break even? 
                  min_P = total_cost / G
              Then judge if P(flip) is at least min_P.

          But note: G is the expected gain conditional on flipping. Without a model, we can use the average loss avoided when we are in the wrong state. 

          Alternatively, we can use the VPI_bound as an upper bound for G? Actually, G is conditional on flipping, so it might be less than the max loss.

     - If we can establish that EVSI >= total cost, then proceed. Otherwise, stop.

   Step 4: Non-ignorability and Side Effects
     - Assess the risk that the study will become non-ignorable due to:
          a. Prompting others to act (e.g., importer reformulates) -> then we might not get to use the information.
          b. The study itself being an intervention (e.g., causing panic) -> adds cost.
          c. The study result being contested (proxy measure) -> reduces the value.

          If any of these are significant, we discount the EVSI by a factor (or subtract a cost). Then if the discounted EVSI is still greater than the cost, proceed. Otherwise, stop.

     - This step requires expert judgment. The analyst must consult with the general counsel and industry experts. If the risk is high, we might stop.

   Step 5: Multiple Studies
     - If multiple studies are proposed, we consider them one at a time, in the order of:
          a. Feasibility (time and resources)
          b. Expected net value (if we can estimate)
          c. Simplicity

          We run the procedure for the first. If we commission it, then after we get the results, we update and run the procedure for the next study (if time and resources remain).

     - If two studies are independent and can be done in parallel, we run the procedure for each separately and then check if the combined cost is less than the combined value (but note: the value of two studies is not additive because they might provide overlapping information). Without simulation, we might overestimate. So we are cautious: we only commission one at a time unless the first is clearly insufficient.

     - We do not let the procedure become "always gather more" because at each step we require the study to pass the tests.

   Now, run on three cases:

   Case (a): Chemical in children's product, 40 incident reports of rash, plausible mechanism, proposed 12-week sensitization study, board votes in 8 weeks.

     Step 0: Feasibility. The study takes 12 weeks but we have 8 weeks -> not feasible. Stop. Do not commission.

     (Note: We would like to do the study, but it fails the feasibility test.)

   Case (b): Proposed consumer-attitude survey about a hazard that no act in our repertoire is sensitive to.

