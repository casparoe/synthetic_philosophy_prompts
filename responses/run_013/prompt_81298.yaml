          However, if the act depends on consumer attitudes? For instance, if the harm is only if consumers are unaware and we are considering a warning label, then attitudes might matter. But the problem states: "no act in our repertoire is sensitive to" the hazard. 
          Actually, the hazard is the underlying harm. The survey is about attitudes. The problem says the hazard is not sensitive to the act? Or the act is not sensitive to the attitudes? 

          Clarification: the problem says the hazard is not sensitive to the act? But the hazard is the underlying physical harm. The acts are about mitigating it. The survey is about attitudes. 

          The key: do the attitudes affect the utility of the acts? 
            - If we issue a warning, and consumers are already aware, then the warning might not reduce harm but might cause unnecessary anxiety. Then the utility of a warning depends on attitudes.
            - But the problem states: "a hazard that no act in our repertoire is sensitive to". This is ambiguous. 

          We interpret: the hazard (the physical harm) is not affected by any of our acts? That doesn't make sense because a recall would remove the product. 

          Alternatively: the proposed survey is about a hazard that is not actionable? For example, the hazard might be unavoidable and we have no power to remove the product? Then the acts are equally powerless? 

          But then why a survey? 

          We take the problem at face value: no act we can take changes the hazard. Then the survey about attitudes might still be relevant if it affects the utility of the acts. 

          However, the problem says: "no act in our repertoire is sensitive to". This might mean that the hazard level is fixed and our acts don't change it? Then the utility of the acts might still depend on the hazard level. But the survey is about attitudes, not the hazard level. 

          We must check: if the survey outcome would change the decision? 

          Example: 
            - If we are considering a warning label, and the survey shows that consumers are already aware, then we might choose no action. If they are not, we might choose a warning. 
            - But the problem says the hazard is such that no act is sensitive to it. This is confusing.

          Let us assume that the problem means: the hazard is fixed and our acts cannot change it. Then the best act is fixed (because the utility of each act is fixed). Then the survey cannot change the act. 

          Therefore, Step 1: Flip test fails. The study has zero value. Stop.

     So we do not commission.

   Case (c): Study whose launch would be publicly visible and would give the importer time to reformulate before we can act.

     Step 0: Feasibility: the study can be done in time? (Assume it can.)

     Step 1: Flip test: assume there are outcomes that would change the decision.

     Step 2: Bound test: we compute VPI_bound and compare to the cost. Assume the cost is less than VPI_bound.

     Step 3: We estimate EVSI. But then:

