   We have built the procedure accordingly.

   Procedure Summary:

     Step 0: Feasibility
          - Time: can the study be completed and analyzed by the vote? (If not: stop, no)
          - Resources: are the resources available? (If not: stop, no)

     Step 1: Flip Test
          - Is there any outcome of the study that would change the optimal action? 
          - If no: stop, do not commission.
          - If the model is too vague: hand off to human (board or expert). If the human says no flip: stop.

     Step 2: Bound Test
          - Estimate VPI_bound = (probability that the current best action is not optimal) * (max loss from taking the current best action in that state)
          - Total cost = direct cost + delay cost (converted to utility units)
          - If total cost > VPI_bound: stop, do not commission.
          - If we cannot compute VPI_bound but the cost is high and the decision is not critical, stop.

     Step 3: Expected Net Value
          - Estimate EVSI (using a method within the analyst's capability, e.g., scenario analysis).
          - If EVSI >= total cost: proceed to next step.
          - If not: stop.
          - If we cannot compute: 
               - Estimate the minimum flip probability needed: min_P = total_cost / G, where G is the expected gain when flipping (average loss avoided).
               - Judge if P(flip) is at least min_P. If yes, proceed. If no, stop.

     Step 4: Non-ignorability and Side Effects
          - Assess the risk that the study will be non-ignorable due to:
               a. Prompting others to act (e.g., reformulation) -> reduces value (set value to zero if reformulation makes it obsolete).
               b. The study itself being an intervention (e.g., causing panic) -> add cost.
               c. Proxy measure contested -> reduces the value (discount by a factor).
          - If the adjusted EVSI is still >= total cost: commission the study.
          - Otherwise: stop.

     Step 5: Multiple Studies
          - Consider one study at a time (in order of priority). After evaluating the first, if commissioned and we get results, update and then evaluate the next with the updated prior and remaining time.

     At any step, if the question is about values or governance (e.g., what is the utility of a recall? what is the board's risk tolerance?) and we do not have that information, hand off to the board or designated expert.

     We do not commission if any step fails.

     We do not let the procedure always say "gather more" because we require the study to pass each test.
answer: |-
  ### Operationalizing Good's Result: A Structured Procedure for Evidence Commissioning Decisions

  Below is a step-by-step procedure for your analysts, designed to resolve the "gather more evidence vs. no time" debate. The core theorem (Good's expected value of information) holds only under **three conditions**:  
  1. **Single-agent rationality**: One decision-maker with coherent utilities and probabilities.  
  2. **Costless information**: No resource costs or delays.  
  3. **Ignorability**: Findings don’t force actions or change the decision context.  

  **What the theorem settles**:  
  - If *all conditions hold*, EVSI ≥ 0, and =0 iff no finding changes the optimal act.  
  **What it does NOT settle**:  
  - Group decisions, costly/delayed information, non-ignorable findings, or ambiguous probabilities/utilities.  

  The procedure tests these conditions explicitly. If any fail, the theorem’s guarantee evaporates, and commissioning may be harmful. **Stop and reject the study** at any step where a condition fails irreparably.  

  ---

  ### The Procedure: 8-Step Decision Tree  
  *Assumptions: 1 analyst, 1 week, spreadsheet only. Hand off to human (H) when values/governance questions arise.*  

  #### **Step 0: Feasibility Gate**  
  - **Question**: Can the study complete *and* be analyzed before the board’s vote?  
  - **Sufficient answer**: "No" if study duration > remaining time (e.g., 12-week study with 8-week deadline).  
  - **If stop**: Study impossible → **Reject**.  
  - **Judgment call**: Definition of "analysis time" (be conservative).  

  #### **Step 1: The Flip Test (Core Condition: Can information change the act?)**  
  - **Question**: Is there *any possible study result* that would change the board’s optimal action?  
  - **Sufficient answer**:  
    - "Yes" if:  
      - Current evidence suggests a close call (e.g., 40 rashes + mechanism makes "recall" vs. "warning" ambiguous).  
      - Study measures a decisive variable (e.g., sensitization rate).  
    - "No" if actions are *insensitive* to the study (e.g., consumer survey when harm is non-actionable).  
  - **If stop**: EVSI = 0 → **Reject**.  
  - **Hand off (H)**: If utilities are undefined (e.g., "How much harm does a rash justify?") or probabilities are missing (e.g., no prior for sensitization rate).  

  #### **Step 2: Value of Perfect Information (VPI) Bound**  
  - **Question**: Is the study’s total cost (direct cost + delay cost) ≤ crude upper bound for VPI?  
  - **Sufficient answer**:  
    - **Crude VPI bound** = (Max loss from wrong decision) × (Probability decision is wrong).  
      - *Max loss*: Worst-case utility difference between best/worst acts (e.g., recall cost vs. child hospitalizations). Convert to dollars using agency thresholds if available.  
      - *P(wrong)*: Analyst’s best guess (use 0.5 if uncertain).  
    - **Estimate delay cost**: Harm accrued during study (e.g., expected rashes/week × 8 weeks).  
  - **If stop**: Total cost > VPI bound → **Reject** (study cannot justify cost).  
  - **Misfires**: Overly optimistic VPI if max loss is underestimated.  

  #### **Step 3: Non-Ignorability Check (Core Condition: Can we ignore findings?)**  
  - **Question**: Could the study itself alter the decision context?  
  - **Sufficient answer**:  
    - "Yes" if:  
      - Study launch prompts industry action (e.g., reformulation before results).  
      - Study is an intervention (e.g., hazard ranking publication).  
      - Findings are non-actionable proxies (e.g., contested biomarker).  
    - "No" if confined to a contract lab and not public.  
  - **If stop**: Study invalidates itself → **Reject** (EVSI may be negative).  
  - **Hand off (H)**: Legal/political assessment (e.g., "Will this trigger lawsuits?").  

  #### **Step 4: Group Alignment (Core Condition: Single agent?)**  
  - **Question**: Is there board consensus on utilities?  
  - **Sufficient answer**:  
    - "Yes" if past votes show consistent tradeoffs (e.g., cost vs. harm).  
    - "No" if members publicly disagree (e.g., industry vs. consumer reps).  
  - **If stop**: Irreconcilable conflicts → **Reject** (EVSI undefined).  
  - **Hand off (H)**: Chair must resolve utility disagreements *before* proceeding.  

  #### **Step 5: EVSI Estimation**  
  - **Question**: Is expected net gain (EVSI - cost) > 0?  
  - **Sufficient answer (no simulation)**:  
    - Use **scenario method**:  
      1. Define 3 study outcomes (pessimistic, baseline, optimistic).  
      2. Estimate probabilities (e.g., 30%/40%/30%).  
      3. Compute posterior act for each outcome (spreadsheet).  
      4. Calculate gain vs. baseline decision (flip probability × utility gain).  
    - **Abort if**: Flip probability < break-even threshold (cost / max gain).  
  - **Hand off (H)**: If probabilities are too vague (e.g., no prior for novel hazard).  

  #### **Step 6: Sequential Test (For multiple studies)**  
  - **Question**: Is this the *first* study in sequence?  
  - **Sufficient answer**:  
    - If no, re-run Steps 1–5 with *updated beliefs* from prior studies.  
    - **Never add EVSI values**: Later studies may be redundant.  

  #### **Step 7: Sunk Cost Check**  
  - **Question**: If we learn nothing decision-relevant, will it *still* have been worth the cost?  
  - **Sufficient answer**: "Yes" only if EVSI > cost *ex ante*. Document this.  

  #### **Step 8: Final Decision**  
  - **Commission study** only if all steps are passed.  
  - **Reject** if any step fails.  

  ---

  ### Case Applications  
  **Case (a): Chemical sensitization study (12-week study, 8-week window)**  
  - Step 0: **Stop → Reject** (study duration > 8 weeks).  
  - Outcome: Against your unit (study impossible).  

  **Case (b): Consumer-attitude survey (hazard insensitive to acts)**  
  - Step 1: **Stop → Reject** (no outcome changes action; e.g., recall required regardless of attitudes).  
  - Outcome: Against survey proponents.  

  **Case (c): Public study prompting reformulation**  
  - Step 0: Assume feasible.  
  - Step 1: Assume flip possible.  
  - Step 2: Assume cost < VPI bound.  
  - Step 3: **Stop → Reject** (study triggers reformulation, making results irrelevant).  
  - Outcome: Against your unit (non-ignorable).  

  ---

  ### Limitations and Contested Extensions  
  - **Settled among experts**:  
    - Good’s theorem for single-agent, expected-utility maximizers.  
    - VPI as an upper bound for EVSI.  
  - **Genuinely contested**:  
    - **Group decisions**: No consensus on aggregating utilities/priors. (We require alignment in Step 4.)  
    - **Non-expected-utility agents**: Behavioral biases violate theorem conditions.  
    - **Ambiguous probabilities**: The theorem requires sharp priors; your procedure hands off ambiguity.  
  - **What the procedure cannot do**:  
    - Handle game-theoretic dynamics (e.g., importer preemption).  
    - Resolve utility conflicts without board input.  
    - Value "exploratory" evidence unrelated to actions.  

  **Critical judgment calls**:  
  - VPI bound estimation (Step 2) can be gamed by optimistic probabilities.  
  - Non-ignorability (Step 3) relies on speculative industry intel.  
  - Flip test (Step 1) assumes stable utilities; board panic may override.  

  **Final note**: This procedure forces *explicit* failure points. It rejects studies by design when conditions are violated, preventing "always gather more."
