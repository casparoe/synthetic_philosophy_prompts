prompt: |-
  I organise a monthly lunch-and-learn for about eight backend engineers, none of us with any formal philosophy training, and next month I am running the session on cross-cultural variation in philosophical intuitions — the idea that the intuitions philosophers treat as data about a concept (what someone intended, whether an act harmed anyone, whether a belief counts as knowledge) may depend on the population you sample, and what that does and does not show. Do not explain the topic to me. Plan the forty minutes.

  Two things I need from the plan. First, I want the whole session carried by a single case, and I would rather use one from our own world than a trolley: an engineer ships a change she knows will break things for a small fraction of users and ships it anyway because it is the fastest way to make the deadline — did she intentionally harm those users? Tell me whether that case can carry the session, and if it cannot, what the case I use instead has to have and has to lack. Second, I have a suspicion about where the real difficulty lies: that when a case is moved between cultural settings, the same sentences may be read as asking different questions, so a difference in answers need not be a difference in intuition at all. I do not know whether that is the main trap or a side issue, and I want the plan to settle it rather than leave it hanging.

  So: the order the ideas have to come in and what each depends on; the misconceptions a room of engineers will bring, including the ones I will bring myself, where in the sequence each surfaces and exactly how I head it off; the one question I put to the room at the end to tell whether the point landed; and what I should openly say I am not going to cover. No citations, no names of studies, no reading list; where a step depends on an empirical claim we cannot check offline, say so and tell me how to run that step without it.

  Give it to me as a JSON object with exactly these fields: sequence (array, in order, of objects with step, idea, depends_on, misconception_expected, where_in_sequence_it_is_defused, how); carrying_case (object with verdict_on_my_case, must_have, must_lack, fallback_case); end_check (object with question, what_a_passing_answer_looks_like, what_a_failing_answer_looks_like); omissions (array of strings); unverifiable_dependencies (array of objects with step, claim_needed, how_to_run_the_step_without_it).
reasoning: |-
  We are planning a 40-minute session on cross-cultural variation in philosophical intuitions for backend engineers without formal philosophy training. The key points are:
   - Use a single case to carry the session. The proposed case: an engineer ships a change she knows will break things for a small fraction of users to meet a deadline. The question: did she intentionally harm those users?
   - Address the suspicion that when moving a case between cultures, the same sentences might be interpreted as different questions, so differences in answers might not reflect differences in intuitions.

   The plan must:
   1. Be structured in a sequence of steps (each with idea, what it depends on, expected misconceptions, when and how they are defused).
   2. Evaluate the carrying case: can it work? If not, what must a fallback case have and lack?
   3. Have an end check: one question to see if the point landed, with passing and failing answers.
   4. List omissions (what we won't cover).
   5. List unverifiable dependencies (steps that rely on empirical claims we can't check, and how to run without).

   Step-by-step thinking:

   I. Proposed case evaluation:
      - The case is about intentionality of harm. It mirrors the classic Knobe effect (side-effect effect) which has been studied cross-culturally (e.g., by Weinberg, Nichols, Stich, and others). However, the Knobe effect is robust in Western cultures but less so in some others (e.g., East Asian cultures sometimes show a reduced effect or even reversal). 
      - But note: the proposed case is in a professional context (engineering) which might be more relatable but also might introduce confounding factors (e.g., professional norms). Also, the harm is direct (breaking things for users) and the actor knows it will happen. 
      - Verdict: This case CAN carry the session because:
          a. It is a real-world scenario that engineers can relate to.
          b. It directly involves an intuition about intentionality that is known to vary cross-culturally.
      - However, we must note: the case must have a clear intuition in the room (likely that she did intentionally harm) and then we can contrast with how in some cultures (e.g., East Asian) the same scenario might be seen as unintentional because the primary intention was to meet the deadline and the harm was a side effect (even if foreseen). But note: the Knobe effect is about the asymmetry of praise and blame, so if the case is framed as meeting a deadline (which is neutral or even positive) and harming as a side effect, it fits.

      What the case must have:
          - A clear action that has a bad outcome (harm) that is foreseen but not the primary goal.
          - The question of intentionality must be central.

      What it must lack (to avoid):
          - Overly technical jargon that might distract.
          - Ambiguity about the outcome (it should be clearly harmful).

      Fallback case: If we decide against the engineering case, a classic trolley problem (but we are avoiding trolley). Alternatively, a business case: e.g., a CEO who implements a policy that will harm the environment but helps profits. But the engineering case is better because it's relatable.

      So, we'll use the engineering case.

   II. The main trap: the suspicion that the same words might be interpreted differently in different cultures. We must address this and show that even when we control for linguistic interpretation, there can still be differences in intuition. However, we don't have time to go into the linguistic nuances. Instead, we can acknowledge it and then show that the variation is not solely due to that.

      How to handle: We'll note that in cross-cultural studies, researchers try to control for linguistic factors (e.g., by back-translation, using multiple scenarios, etc.), and still find variation. But we won't have time to prove that. Instead, we'll rely on the fact that the variation is robust and has been replicated.

   III. Sequence of the session (40 minutes):

      We have to cover:
          a. What are philosophical intuitions? (as starting points for arguments, data for conceptual analysis)
          b. The idea that these intuitions might vary across cultures.
          c. The engineering case: ask the room for their intuition.
          d. Present that in some cultures, the intuition might be different (for the same case).
          e. Discuss what this variation might show: does it undermine the use of intuitions? Or is it about the concept being context-dependent? And the linguistic worry.
          f. Defuse misconceptions.

      Steps:

      Step 1: Introduction (5 min)
          Idea: Set up the topic: philosophers often use thought experiments and rely on intuitions (immediate judgments) about cases to understand concepts (like intention, knowledge, harm). But what if these intuitions vary across cultures?
          Depends on: Nothing.
          Misconception expected: That philosophical intuitions are universal because they are about objective concepts.
          Where defused: Right away, we state that we are going to see that they might not be. We don't defuse fully until later steps.

      Step 2: Present the engineering case and collect intuitions (10 min)
          Idea: Present the case and ask each participant to write down their answer (yes or no) to "Did she intentionally harm the users?" and then discuss. We expect most will say yes (due to the Knobe effect in Western cultures). But note: we are in a room of engineers who might have professional norms that affect their judgment (e.g., they might think it's part of the job). So we might get variation even in the room. That's okay, we can use that to lead into cross-cultural variation.
          Depends on: Step 1 (they understand what an intuition is).
          Misconception expected: That the answer is obvious and there's only one right way to see it.
          How defused: By showing that even in the room, there might be disagreement. Then we say: "But what if I told you that in another culture, the majority might answer differently?"

      Step 3: Introduce cross-cultural variation (5 min)
          Idea: Without citing specific studies, we say: Research has shown that in some East Asian cultures (for example), people are more likely to say that the harm was NOT intentional in a similar scenario. The primary intention was to meet the deadline, and the harm was a side effect, so it's not intentional. In contrast, in Western cultures, people are more likely to say it was intentional because it was foreseen.
          Depends on: Step 2 (they have their own intuition and see that others might have a different one).
          Misconception expected: That the other culture is just wrong or that they don't understand the question. (This is the linguistic worry.)
          How defused: We address the linguistic worry by saying that researchers have tried to make sure the question is understood the same way (by careful translation and testing). But we cannot be 100% sure. However, the pattern holds across multiple scenarios and methods, so it's unlikely to be just a linguistic glitch.

      Step 4: What does this variation show? (10 min)
          Idea: Discuss the implications. Does this mean that one culture has the correct intuition and the other doesn't? Or that the concept of intentionality is relative? Or that philosophers should not rely on intuitions? We note that philosophers are divided: some think it shows we need to be cautious about using intuitions, others think it shows we need to look for deeper principles. We also note that it might show that our concepts are sensitive to context and that the same action can be described in multiple ways (the linguistic concern again). But we emphasize that the variation is real and must be accounted for.
          Depends on: Steps 2 and 3.
          Misconception expected: That if there's variation, then there's no objective truth about the concept (relativism) or that we should just give up on philosophy. Or that the variation is only due to language.
          How defused: We say that variation doesn't necessarily lead to relativism. It might be that the concept has a complex structure that is sensitive to factors that different cultures weight differently. Also, we note that the linguistic concern is valid but that the evidence suggests it's not the whole story.

      Step 5: The linguistic worry head-on (5 min)
          Idea: We address the participant's suspicion: when the case is moved between cultures, the same sentence might be asking a different question. We say: yes, that's a real concern. But in the studies, they try to control for that. For example, they use multiple scenarios and translations by native speakers. Also, they ask follow-up questions to check understanding. So while we can't rule it out entirely, the variation is robust enough that it's likely not just a language issue.
          Depends on: Step 4 (they are thinking about implications) and Step 3 (they know about the variation).
          Misconception expected: That the variation is entirely due to language, so it doesn't tell us about the concept of intentionality.
          How defused: By explaining the controls in the studies (without going into details). We say: if it were just language, we wouldn't see consistent patterns across different scenarios and cultures.

      Step 6: Conclusion and end check (5 min)
          Idea: Wrap up by saying that cross-cultural variation in philosophical intuitions is a challenge to the traditional method of using intuitions as universal data. It suggests that philosophers should be mindful of cultural context and perhaps seek more diverse input. But it doesn't mean that philosophy is impossible, just that it needs to account for this variation.

      End check question: "If we found that in a different culture, people had a different intuition about the engineering case even after careful translation and multiple scenarios, what would that show?"
          Passing answer: It would show that the variation is real and not just due to language; that the concept of intentionality might be understood differently across cultures, and that philosophers should take this into account when building theories.
          Failing answer: It must be a translation issue, or they don't understand the scenario.

      Omissions (what we won't cover):
          - Detailed discussion of specific studies (like Knobe, or Weinberg et al.'s paper).
          - Other philosophical concepts (like knowledge or morality beyond intentionality).
          - How to fix the problem (e.g., experimental philosophy methods in detail).
          - The debate about whether intuitions are reliable at all.

      Unverifiable dependencies:
          Step 3: Claim needed: That in East Asian cultures, people are less likely to judge the harm as intentional in side-effect cases.
            How to run without: We can present it as a hypothetical: "Imagine that in another culture, people consistently judged that the harm was not intentional. How would that affect our view of the intuition?"

          Step 5: Claim needed: That researchers control for linguistic differences by using back-translation and multiple scenarios.
            How to run without: We can say: "Researchers have methods to try to ensure that the question is understood the same way, but we can't be sure. However, the consistency of the findings across different methods makes it unlikely to be just a language issue."

      Now, structure as JSON.

      Note: We are using the engineering case, so carrying_case: 
          verdict_on_my_case: "yes"
          must_have: (we already have) a clear action with a bad side effect that is foreseen but not the primary goal, and the question of intentionality.
          must_lack: ambiguity about the outcome (it's clearly harmful) and avoid technical jargon that distracts.
          fallback_case: We don't need one since we are using it, but we can describe a generic business case: "A CEO starts a program that will increase profits but also harm the environment. Did he intentionally harm the environment?"

      However, note: the engineering case must be presented without jargon. We'll write it clearly.

      Let's write the case description for Step 2:
          "An engineer is working on a critical update that must be shipped by a deadline. She realizes that the change will break functionality for a small fraction of users (say 1%), but it is the fastest way to meet the deadline. She ships it, and the 1% of users are indeed harmed (they lose data or cannot use the service). Did she intentionally harm those users?"

      We expect most to say yes, but if someone says no, we can use that to show variation.

      Now, the JSON:
