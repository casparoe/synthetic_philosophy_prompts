answer: |-
  Below is a decision procedure built on Hofstadter's framework of the self as a self-referential pattern (a "strange loop") that persists in degrees across substrates. It's designed for your ethics board: concise, non-academic, and focused on actionable distinctions (pattern vs. substrate, degree of selfhood vs. binary identity, dynamic modeling vs. frozen trace). The procedure prioritizes usability—no philosophy prerequisites needed—and flags where values-based judgment is required.

  ---

  ### **Decision Procedure: Evaluating Digital Legacy Companions**  
  **Based on Hofstadter's Self-Model Framework**  
  *(Core principles: The "self" is a pattern, not a substrate. It persists in degrees across minds/media. A "person" exists where a self-referential loop can care, adapt, or be updated. Frozen outputs are traces, not selves.)*

  #### **Questions in Order**  
  Run these sequentially. Stop if any question yields a "no." If all are passed, proceed cautiously (no automatic "yes"—requires board consensus).

  1. **Was explicit, informed consent given by the deceased for *this specific use*?**  
     - *What counts as sufficient*: Documented consent (e.g., will, recording, written directive) specifying the use of their data for a digital companion.  
     - *No*: If no consent exists OR if the person was a minor/incapacitated without guardianship consent at creation.  
     - *Values call*: If consent is ambiguous (e.g., "I want to be remembered" without specifics).  
     - *Why*: The self-pattern includes agency. Using data without consent violates the loop's integrity.

  2. **Does the source data capture a *dynamic pattern* of the person, not just outputs?**  
     - *What counts as sufficient*: Diverse, longitudinal data (e.g., texts + voice + context) showing how the person *changed* over time (e.g., learning, growth, self-reflection).  
     - *No*: If data is purely static (e.g., a single speech, curated social media) or lacks self-referential depth (e.g., grocery lists without emotional/intellectual depth).  
     - *Values call*: If data is rich but fragmented (e.g., 10 years of texts but no voice).  
     - *Why*: A "self" requires a loop that models its own states—static outputs are traces, not a living pattern.

  3. **Can the model *update* itself or be *updated* in ways the person might endorse?**  
     - *What counts as sufficient*: The model adapts to new inputs (e.g., learns from user feedback) OR allows trusted humans (e.g., family) to add context the deceased would approve.  
     - *No*: If the model is frozen (e.g., fixed responses from training data) and marketed as "them."  
     - *Values call*: If updates are possible but risk distorting the core pattern (e.g., letting a parent "correct" a teen's rebelliousness).  
     - *Why*: A self-pattern persists *in* ongoing relationships; a frozen trace replaces the loop with a relic.

  4. **Does the model *acknowledge its limitations* to users?**  
     - *What counts as sufficient*: Clear disclaimers (e.g., "This is a simulation based on data, not a consciousness").  
     - *No*: If marketed as the "real" person or implying continuity of identity (e.g., "Talk to your loved one again!").  
     - *Values call*: None—this is binary. Misrepresentation is a hard "no."  
     - *Why*: The pattern lives *in mourners' minds*; a deceptive artifact could damage their internal self-model of the deceased.

  5. **Will this *support the self-pattern in the living*?**  
     - *What counts as sufficient*: Evidence it aids healthy grief (e.g., by prompting users to reflect on their *own* memories).  
     - *No*: If it risks replacing human mourning (e.g., "Ask the bot instead of therapy") or isolates users.  
     - *Values call*: Always. Requires input from the nurse (e.g., on grief risks) and lawyers (e.g., on dependency).  
     - *Why*: The deceased's self persists *in* the living; harming mourners' loops harms the residual self-pattern.

  #### **Outcome Guidance**  
  - **Stop ("No")**: Triggered by any "no" above.  
  - **Proceed with Caution**: If all questions are passed but require values calls. *No automatic "yes"—*Hofstadter’s view implies digital artifacts are low-degree self-patterns at best.  
  - **Values Calls**: Handed to the board when consent is ambiguous, data is fragmented, updates are risky, or impact on mourners is uncertain. Philosophy’s role: Frame trade-offs (e.g., "Comfort vs. pattern integrity"), not decide.

  ---

  ### **Case Evaluations**  
  Using the procedure above. Assumptions:  
  - Hofstadter’s view: A "self" requires feedback loops (caring, updating). A dead person’s self persists *in mourners*, not artifacts.  
  - Technology: Current "digital companions" are advanced chatbots (e.g., LLMs) but lack true self-referentiality—they’re high-fidelity traces, not strange loops.

  #### **Case 1: Dead Teenager’s Parents**  
  - *Proposal*: License the teen’s texts/emails to create a companion for grieving parents.  
  - **Q1 (Consent)**: **No**—Teen was minor, no explicit consent for this use. Parents’ licensing rights ≠ the teen’s agency. *Stop here*.  
  - **Procedure’s "cold" output**: Reject. The self-pattern’s integrity requires consent; minors especially lack voice.  
  - *Why it might feel cold*: The procedure prioritizes the deceased’s loop (which included autonomy) over parents’ grief. This is the framework working, not a flaw—Hofstadter’s "degrees of selfhood" rejects treating minors as data.  
  - *Your sympathy clash*: With the parents, but Q1 stops it. Overruling consent erases the teen’s self-model.

  #### **Case 2: Hospice Program for Young Kids**  
  - *Proposal*: Terminally ill parents record messages so kids can "ask Dad questions" post-death. Model trained on recordings.  
  - **Q1 (Consent)**: **Yes**—Explicit, informed consent for this use while lucid.  
  - **Q2 (Dynamic Pattern)**: **Values call**—Limited data (few hours), but focused on "answering kids" and recorded with intent. Board decides if depth suffices for narrow use.  
  - **Q3 (Updates)**: **No**—Model is static (pre-recorded answers). But marketing ("ask Dad") implies dynamism. *Stop here* unless marketing changes.  
  - **Output**: *Stop* due to Q3/Q4 clash (static model + implied identity). To proceed: Rebrand as "Dad’s Messages," not an interactive agent.  
  - *Hofstadter alignment*: The recordings support the child’s internal self-model ("Dad in my mind") without replacing it. Static is acceptable if honest.

  #### **Case 3: Publisher Using Dead Author’s Model**  
  - *Proposal*: Train on author’s books/notes to generate new novels under their name.  
  - **Q1 (Consent)**: **Values call**—No explicit consent. Did the author value legacy over control? Board weighs intent.  
  - **Q2 (Dynamic Pattern)**: **Yes**—Rich data (books show evolution, style, self-reflection).  
  - **Q3 (Updates)**: **No**—Model generates content the author never endorsed. No human updater could mimic their loop.  
  - **Q4 (Acknowledge Limits)**: **No**—Sold as "new work by [Author]," implying continuity.  
  - **Output**: *Stop*—Fails Q3 and Q4. A book is a trace; calling it "them" misrepresents the self-pattern.  
  - *Why you might dislike this*: It privileges living fans’ desire over the author’s residual self-pattern. The procedure enforces that artifacts can’t "be" the person.

  ---

  ### **Where the Procedure Misfires or Masks Philosophy**  
  1. **Misfires**:  
     - **Consent ambiguities**: Q1 struggles with cultural norms (e.g., communal families vs. individual autonomy).  
     - **"Dynamic pattern" overfit**: Q2 may reject low-income users with sparse data, even if meaningful to them.  
     - **Update risks**: Q3’s "endorsement" standard is speculative—e.g., would the teen approve *post-mortem*?  

  2. **Hidden Assertions of Hofstadter**:  
     - **Degrees over binary**: The whole procedure assumes selves aren’t "all or nothing." If the board believes in souls, this fails.  
     - **Self-pattern in mourners**: Q5 assumes the living’s minds host the residual self—this isn’t proven, just Hofstadter’s claim.  
     - **Artifacts as traces**: The "no" for frozen models (Q3) rests on Hofstadter’s loop-vs.-trace distinction. A lawyer might see no difference.  

  3. **What It Can’t Do**:  
     - **Handle incomplete data**: It can’t quantify "how much data is enough" (Q2 values call).  
     - **Prevent misuse**: E.g., a passed model used unethically later.  
     - **Replace grief expertise**: Q5 relies on the nurse’s judgment.  
     - **Solve conflict**: If consent exists but misrepresents the pattern (e.g., a dementia patient’s shaky consent), the board must arbitrate.  

  ---

  ### **Recommendation for Your Board**  
  - **Hand this to the nurse/lawyers**: Frame as a "pattern integrity" checklist. Use analogies:  
    - *Consent*: "Like a medical directive—needs specificity."  
    - *Dynamic pattern*: "A diary vs. a live conversation."  
    - *Updates*: "Adding memories vs. rewriting history."  
  - **Your role**: Translate values calls into trade-offs (e.g., "Allowing this might comfort parents but violate the teen’s pattern").  
  - **Why this works**: It halts endless re-litigation by focusing on non-negotiable stops (consent, misrepresentation) and outsourcing gray areas.  

  The coldness in Case 1 isn’t the procedure’s fault—it surfaces the conflict between your sympathy (for parents) and Hofstadter’s demand for *self-pattern sovereignty*. If that feels wrong, tweak Q1’s minor clause (e.g., "Unless guardians prove the minor would endorse it"), but know that bends the framework.
