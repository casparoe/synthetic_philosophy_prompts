  For item 4, I'll note unstated assumptions - the friend likely holds a replicator essentialism, while the user prioritizes functional equivalence. This suggests the question might be ill-posed without specifying "for what purpose." 

  Finally, item 5 proposes progress through: distinguishing micro-mechanisms from macro-dynamics, quantifying fidelity/selection strength in systems, and reframing to "what aspects of cultural change benefit from which modeling toolkit." The why: it bypasses definitional traps while enabling collaboration.

  Throughout, I'll maintain neutrality, use their terminology ("fidelity," "attractors"), and keep each item to 1-2 sentences as requested. The challenge is balancing precision with concision while honoring their meta-cognitive request to diagnose rather than resolve.
answer: |-
  1.  Your verbal hypothesis captures much: reframing in neutral terms (variation, heritable transmission, differential retention) likely resolves the "Darwinian" label dispute, leaving the core empirical disagreement about the *degree and nature* of fidelity (high-fidelity replication vs. moderate-fidelity reconstruction) in cultural transmission.
  2.  The fidelity threshold *is* partly a modeling choice (how much fidelity is "enough" depends on selection strength and model purpose), but its applicability to real cultural systems *is* empirical; measuring variant persistence timescales versus cognitive bias strength in controlled transmission chains could clarify.
  3.  You *are* answering distinct questions: he focuses on the cognitive *mechanism* of transmission (how a mind acquires/rebuilds representations), while you focus on the population *outcome* (distribution shifts); treating these as mutually exclusive causes the impasse.
  4.  Your friend implicitly relies on "replicator essentialism" (a Darwinian process *must* have discrete, high-fidelity replicators), while you implicitly prioritize functional equivalence (any process generating cumulative adaptation via VSR); the impasse suggests the core question ("Is culture Darwinian?") is ill-posed without specifying "in what precise aspects/for which phenomena?"
  5.  Progress would involve distinguishing mechanistic fidelity requirements from population-level outcome requirements, empirically quantifying fidelity/attractor strength in specific systems, and reframing to "which aspects of cultural change are best modeled *as if* selection acts on replicators versus as recurrent biases?" to avoid definitional traps.
