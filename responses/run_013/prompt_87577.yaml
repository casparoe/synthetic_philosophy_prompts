prompt: |-
  I teach a large introductory astronomy course and, with four teaching assistants, mark roughly two hundred short-answer explanations per assignment; the marks feed a curve that decides who stays in the major. Our key is a three-tier rubric — correct, partly correct, wrong — and it is failing in a specific way: the answers students actually write are rarely simply wrong, they are simplifications, and several of the simplifications in our own model answers are, read literally, false. I want a marking procedure that ranks an answer by how close it comes to the truth rather than by how closely it matches the key.

  Ground the procedure in the philosophical problem of verisimilitude — the idea, from Popper onward, that the aim of inquiry is not truth but getting nearer to it — and make it encode the lessons I have been reading about and want to take seriously:

  (i) Closeness has two dimensions that can pull in opposite directions: how much of what an answer says is true, and how much it says at all. A vague answer is not automatically safe; a detailed one is not automatically better.

  (ii) The obvious scoring rule — count the true claims and subtract the false ones — is disqualified. An answer that says almost nothing ("it is a combination of several effects") has only true consequences and would score perfectly under that rule, and a student can raise their score by padding with hedges and disjunctions. Only claims that bear on the question asked should count, and even then the exchange rate between the two dimensions has to be set out in the open rather than smuggled in.

  (iii) Closeness can be compared only relative to a fixed question and a fixed vocabulary. Two answers that are each right in their own framework, and answers that are metaphors or category mistakes rather than candidates for truth, cannot be ranked by any such procedure. I want those routed to me unscored rather than guessed at.

  Give me a numbered procedure that four TAs with no philosophy training can run in about thirty seconds per answer and reach the same verdict on: the tests in order, what counts as passing each, where it stops with a zero, and where it hands the answer to a person. Grades are appealable, so a step that cannot be shown to a student is not worth having.

  Then run it on the three answers below to "Why is the sky blue?" and say plainly which of the verdicts I will not like — our TAs' instinct is to reward effort and to give credit for anything that is not false — and why the procedure is right anyway.

  (a) Sunlight contains every colour. Air molecules scatter short wavelengths more strongly than long ones, so blue light is redirected toward our eyes from every direction; that is also why sunsets look red.
  (b) The atmosphere absorbs blue light from the Sun and then re-emits it in every direction, so we see blue all around us.
  (c) The sky is blue because of the way the air affects light.

  Finally, tell me how the procedure handles an answer that is not a candidate for truth at all — "The sky is blue because the air is jealous of the sea" — and what the procedure cannot do: which marking disputes it will never settle, and which of its steps are judgment wearing the costume of a procedure. Answer in no more than 800 words, beginning with the one sentence a TA should keep in mind when the numbered steps run out.
reasoning: |-
  Hmm, the user teaches a large astronomy course and needs a better way to grade short-answer explanations. The current three-tier rubric isn't working because student answers are often simplifications or contain technically false statements that are conceptually close to correct. They want a procedure grounded in Popper's verisimilitude concept that addresses three key lessons: balancing truth content and specificity, avoiding naive true/false counting, and only comparing answers within the same framework.

  The user has clearly thought deeply about this - they recognize problems like students gaming the system with vague answers and want to reward genuine understanding over rote memorization. Their frustration with "partly correct" being too broad is palpable. I need to create something practical for TAs while honoring the philosophical depth they're requesting.

  Key challenges: The procedure must be executable in 30 seconds per answer by non-philosophers, generate consistent results across TAs, handle non-literal answers appropriately, and withstand student appeals. The sample answers about "Why is the sky blue?" perfectly illustrate their dilemma - (a) is mostly right but oversimplifies scattering, (b) is fundamentally wrong about absorption, (c) is too vague to be useful.

  For the core procedure, I'll adapt the "truthlikeness" concept through three filters: relevance (claims must address the question), truth evaluation (absolute pass/fail on critical points), then specificity scoring. The 1-2-3 flow mirrors how experts naturally evaluate explanations. Crucially, it forces TAs to identify the non-negotiable elements upfront - this addresses their complaint about "partly correct" being a catch-all.

  The sample answers demonstrate why this works: (a) passes the gatekeeper step despite minor inaccuracies because it gets the core mechanism right; (b) fatally misstates absorption; (c) gets stuck at Step 2 for vagueness. I'll explicitly call out that the user won't like how (c) gets penalized - their TAs would reward the "effort," but the procedure correctly identifies it as non-explanatory.

  For non-candidates like the "jealous air" example, Step 1 catches them immediately - they contain no relevant claims. This satisfies their requirement to flag such answers for human review rather than forcing a score.

  Finally, I'll acknowledge the unavoidable judgments: defining "critical" claims requires instructor discretion, and Step 3's specificity scoring has inherent subjectivity. But by making these explicit in the rubric rather than hiding them, it actually strengthens appealability - the tradeoffs are transparent.

  The opening mantra ("Not truth, but closer than before") encapsulates Popper while guiding TAs when rules get fuzzy. Keeping everything to 800 words means ruthless editing - every step must justify its existence in operational terms.
answer: |-
  Here is a marking procedure grounded in verisimilitude, designed for speed, consistency, and transparency, addressing your core requirements:

  **Core Principle (TA Mantra):** "Not truth, but closer than before: Reward answers that say *more relevant true things* without adding significant falsehoods."

  **Procedure:**

  1.  **Relevance Check (5 sec):** Scan the answer *only* for claims directly attempting to explain the phenomenon asked about (e.g., "Why is the sky blue?"). Ignore extraneous info.
      *   **If NO relevant claims:** Mark **"0 - Non-Responsive"** (Route to instructor). *Stop.* (e.g., "The sky is blue because the air is jealous of the sea")
      *   **If ANY relevant claims:** Proceed to Step 2.

  2.  **Gatekeeper Truth (Critical Error Check) (10 sec):** Identify if the answer contains **any clearly false claim that is *central* to explaining the core phenomenon.** Refer to a short pre-defined list of *critical misconceptions* for the question (e.g., for blue sky: "Light is absorbed and re-emitted by air molecules" is critical; "Scattering strength varies with wavelength" is core truth).
      *   **If YES, a Critical False Claim is present:** Mark **"0 - Critical Error"**. *Stop.*
      *   **If NO Critical False Claims:** Proceed to Step 3.

  3.  **Specificity & Truth Scoring (15 sec):** Identify **all distinct, relevant claims** made in the answer. Compare each to the "Ideal Answer Elements" (pre-defined list for the question, e.g., for blue sky: 1. Sunlight contains all colors. 2. Air molecules scatter light. 3. Scattering strength depends on wavelength (shorter = stronger). 4. Blue scatters more/is redirected. 5. This scattered light comes from all directions. (Bonus: Sunset explanation)). Score:
      *   **+1 Point:** For each *distinct, relevant Ideal Answer Element* **correctly** stated or *validly approximated* (allow for standard simplifications used in teaching).
      *   **+0 Points:** For vague statements that don't capture a distinct element ("light interacts with air").
      *   **-1 Point:** For each *distinct, relevant claim* that is **clearly false** (not mere simplification, not critical enough for Step 2). *Hedges ("maybe", "could be") or irrelevant truths add nothing and score 0.*
      *   **Final Score = (Positive Points) + (Negative Points)**. Minimum score is 0.
      *   **Grade:** Map the Final Score to your curve (e.g., 3+ = Correct, 1-2 = Partly Correct, 0 = Wrong).

  **Why it works for your requirements:**
  *   **Verisimilitude:** Focuses on increasing true, relevant content (Step 3 +Points) while penalizing significant false content (Step 3 -Points, Step 2 filters catastrophic errors). Balances content (specificity) and truthfulness.
  *   **Anti-Gaming:** Step 1 filters non-answers. Vague statements score 0 in Step 3. Padding with hedges or irrelevant truths scores 0. Only *distinct, relevant* claims count.
  *   **Framework-Bound:** Step 1 routes non-candidates (metaphors, category errors). Requires pre-defined "Critical Errors" and "Ideal Elements" per question.
  *   **Speed & Consistency:** Uses clear, pre-defined lists (Critical Errors, Ideal Elements) for the specific question. Steps are sequential checks/scoring.
  *   **Appealable:** Every step is objective or based on pre-defined criteria shown to students (the Critical Error list, Ideal Elements list, scoring rules). The TA's judgment is in *applying* these lists, not inventing criteria.

  **Analysis of Sample Answers (Blue Sky):**

  *   **(a) Sunlight contains every colour. Air molecules scatter short wavelengths more strongly than long ones, so blue light is redirected toward our eyes from every direction; that is also why sunsets look red.**
      *   *Step 1:* Relevant claims present.
      *   *Step 2:* No Critical False Claim (Absorption/re-emission is the critical error; scattering is correct).
      *   *Step 3:* Identifiable Claims & Score:
          *   Sunlight contains all colours: +1 (Ideal Element 1)
          *   Air molecules scatter light: +1 (Ideal Element 2 - implied by context)
          *   Scattering strength depends on wavelength (short > long): +1 (Ideal Element 3)
          *   Blue scatters more/is redirected: +1 (Ideal Element 4)
          *   Scattered light comes from all directions: +1 (Ideal Element 5)
          *   Sunset explanation: +0 (Bonus, not core)
          *   *False Claims:* None distinct and relevant enough for -1. ("Redirected" is a simplification, not false).
          *   **Final Score: 5.** Grade: Correct.
      *   *Verdict:* You'll like this. Rewards comprehensive, largely correct explanation.

  *   **(b) The atmosphere absorbs blue light from the Sun and then re-emits it in every direction, so we see blue all around us.**
      *   *Step 1:* Relevant claims present.
      *   *Step 2:* **CRITICAL FALSE CLAIM PRESENT:** "Absorbs blue light and then re-emits it" (This describes fluorescence/emission, not Rayleigh scattering. It's fundamentally wrong about the core mechanism). **Mark: 0 - Critical Error.**
      *   *Verdict:* You'll *like* this strictness. Catches the fundamental misconception despite seeming effort. Your TAs' instinct to reward non-false effort would wrongly give this partial credit. The procedure is right: it fatally misidentifies the *mechanism*.

  *   **(c) The sky is blue because of the way the air affects light.**
      *   *Step 1:* Relevant claims present (vague, but attempts explanation).
      *   *Step 2:* No Critical False Claim identified (it's too vague to be critically false).
      *   *Step 3:* Identifiable Claims & Score:
          *   "the way the air affects light": This is too vague to match any distinct *Ideal Answer Element* (1-5). It doesn't specify *how* (scattering? refraction? absorption?). Scores **0 points**.
          *   No false claims identifiable (too vague).
          *   **Final Score: 0.** Grade: Wrong.
      *   *Verdict:* **You will NOT like this.** Your TAs' instinct is to give credit ("it's not false!"). The procedure correctly gives 0: it provides *no specific true content* relevant to the explanation. It's equivalent to saying "because of physics". Effort without substantive, relevant truth earns nothing. This enforces the need for specificity.

  **Handling Non-Candidates & Limitations:**

  *   **Non-Candidate ("Jealous air"):** Fails Step 1 instantly (**"0 - Non-Responsive"**). Contains no relevant claims attempting a scientific explanation. Routed to you.
  *   **What it Cannot Do / Inherent Judgment:**
      *   **Defining "Critical Errors" & "Ideal Elements":** This requires *your* expert judgment upfront. Disputes about whether an error is truly "critical" or whether an element is essential require instructor review. This is judgment in procedure's clothing, but it's explicit and pre-defined.
      *   **Step 3 Scoring Nuance:** Judging if a student's phrasing *validly approximates* an Ideal Element, or if a false claim is distinct and relevant enough for -1, involves some TA discretion. Training with examples is crucial. Disputes here might arise but are constrained by the pre-defined lists and rules.
      *   **Comparing Radically Different Frameworks:** It won't rank a correct poetic metaphor against a correct scientific answer. Step 1 routes non-scientific attempts out. It only ranks answers *within* the expected scientific explanatory framework.
      *   **Perfect Verisimilitude:** It's a pragmatic approximation. A deeply insightful but unconventional correct answer *might* score lower than a rote "ideal" one if it uses different phrasing not on the list. The pre-defined elements anchor the framework.
