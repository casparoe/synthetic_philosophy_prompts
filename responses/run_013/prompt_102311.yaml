prompt: |-
  I run trust and safety for a mid-sized online community — thirty-odd flagged cases a week, I'm the one who signs off whenever a case ends in a ban or a removal, and the moderators who do the first pass are volunteers with no training in any of this. My problem is the rulebook. Half of it is arbitrary (we have a 'no links to competitor sites' rule that exists because of one argument three years ago and nobody can actually justify it), and I've got two seperate failure modes that both look bad. If I apply a rule literally to someone the community likes, I look like a tyrant. If I wave it through because 'it's only a convention anyway', the rule quietly dies and the next moderator inherits the mess. I've been reading the bits in Pascal's Pensées about justice and force — justice without force being powerless, force without justice being tyranny, and the darker point underneath, that justice is the thing everyone argues about while force is the thing everyone can see, so we end up treating whatever is established as just, and the authority of the rule comes from its being established rather than from any reason we could give for it. I want to turn that into something my moderators can actually run on a case in ten minutes.

  Please write me a decision procedure — the questions to ask in order, what counts as a sufficient answer to each, where it stops with 'enforce' or 'let it go', and where it hands the decision back to me because it's a values question dressed up as a factual one. Two things I care about. First, don't let it collapse into a bland 'weigh the rule against the harm' test; the whole point of the view is that the rule's authority is its establishment and not its justifiability, so the procedure has to say something about when it is and isn't appropriate to litigate the rule's rationale at all — and it has to be honest that Pascal isn't handing us a way to make arbitrary rules just, only a way of living with them. Second, keep what's genuinely Pascal in it and drop what won't survive the trip to a volunteer moderator.

  Then run it on three cases: (a) the long-standing arbitrary rule, applied to a first-time offender who is otherwise the most helpful person in the community; (b) something genuinely awful that no rule covers, where everyone is demanding we do something; (c) a rule that's plainly just, that we have no power to enforce against a user who will simply make a new account.

  Give it to me as structured data. Table one, the procedure, with columns: step number | the question | what counts as a sufficient answer | what to do if the answer is no | who decides (moderator or me). Table two, the three cases, with columns: case | verdict the procedure gives | which step is doing the work | where it nearly misfires | what it leaves unsettled. Table three, the limits, with columns: limitation | why it can't be fixed | what to do instead. Keep the prose to a couple of sentences above each table and nothing else.
reasoning: |-
  We are creating a decision procedure based on Pascal's insights about justice and force. Key points:
   - Justice without force is powerless; force without justice is tyranny.
   - Established rules gain authority from being established, even if their original justification is unclear.
   - We must balance between arbitrary enforcement (tyranny) and undermining rules (powerless justice).

   The procedure should:
   1. Acknowledge that rules gain authority from being established, so we start by respecting the rule as written.
   2. But also allow for exceptions when the rule's application in a case would be so absurd or harmful that it undermines the community's trust in the system.
   3. Distinguish between cases where the rule is being challenged (which we don't allow in the moment) and cases where the rule itself might need reconsideration (but not during enforcement).

   Steps:

   We design a flowchart-like procedure with questions. The steps:

   Step 1: Is there a clear rule that applies to this case? (If not, we jump to a different path for unruled cases.)
   Step 2: Is the rule being applied in a way that is consistent with past enforcement? (Avoids arbitrary enforcement and ensures stability.)
   Step 3: Is the violation so minor and the user so valuable that enforcing the rule would do more harm than good? (This is the exception, to be used sparingly, because otherwise the rule dies.)
   Step 4: If we are going to enforce, do we have the force (practical power) to enforce effectively? (If not, we risk powerless justice.)

   However, we must avoid turning Step 3 into a simple harm test. We must protect the rule's authority. So Step 3 should be very high bar.

   Also, for unruled cases (Step 1: no), we have:

   Step A: Is the behavior causing clear and significant harm to the community? (If not, we let it go because we have no rule.)
   Step B: If it is causing harm, can we use an existing rule by analogy? (But we must be cautious not to stretch rules arbitrarily.)
   Step C: If not, then we need to create a new rule? But that's a policy decision and should go to the trust and safety lead (me) and not be done on the fly.

   But note: the procedure must be runnable in 10 minutes. So we cannot create new rules in the moment. We can only act in unruled cases if the harm is extreme and there's a clear analogy to an existing rule (and then we note the gap for later rule-making).

   Also, we have the problem of rules that are just but unenforceable (like banning a user who makes new accounts). We handle that in Step 4.

   Proposed steps:

   Step 1: Rule Applicability
     Question: Does the reported behavior clearly violate a written rule?
     Sufficient answer: Yes (if the behavior falls within the literal wording of a rule) OR No (if it does not).
     If no: Go to Step 5 (Unruled Case Path).

   Step 2: Consistency Check
     Question: Has this rule been consistently enforced in similar past cases?
     Sufficient answer: Yes (if there are past cases that are substantially similar and resulted in enforcement) OR No (if the rule has not been enforced in similar cases, or if there are inconsistent precedents).
     If no: This is a red flag. The moderator should note the inconsistency and hand the case to me (trust and safety lead) because inconsistent enforcement undermines the system.

   Step 3: Exceptional Circumstances (High Bar)
     Question: Despite the violation, is the harm from enforcing the rule (to the community or the user) so overwhelmingly greater than the harm of the violation that it would be catastrophic to enforce? (Note: This is not about how minor the violation is, but about catastrophic consequences of enforcement. Example: banning the only doctor in a pandemic for a minor rule violation.)
     Sufficient answer: Yes (only in extreme cases) OR No (in the vast majority of cases).
     If yes: Let it go with a warning and document the exception. Also, this must be reported to me for review because it might indicate a rule that needs changing.
     If no: Proceed to Step 4.

   Step 4: Enforceability
     Question: Can we enforce the rule effectively? (i.e., can we impose the prescribed consequence without it being easily circumvented or ignored, and without disproportionate effort?)
     Sufficient answer: Yes (if the enforcement action is practically feasible and will likely achieve its goal) OR No (if the user can trivially bypass the action, or if it would require excessive resources).
     If no: Hand the case to me (trust and safety lead) to decide on an alternative approach (which might include changing the rule, or escalating to technical measures, etc.).
     If yes: Enforce the rule.

   For unruled cases (Step 1: no):

   Step 5: Harm Assessment
     Question: Is the behavior causing clear and significant harm to the community? (Harm defined as: threatening the safety, functionality, or cohesion of the community.)
     Sufficient answer: Yes (if the harm is obvious and severe) OR No (if it is minor, ambiguous, or merely annoying).
     If no: Let it go and document the incident for possible future rule-making.
     If yes: Go to Step 6.

   Step 6: Rule by Analogy
     Question: Can the behavior be reasonably treated as a violation under an existing rule by a clear and straightforward analogy? (Note: Avoid stretching rules arbitrarily. The analogy must be one that the community would readily accept.)
     Sufficient answer: Yes (if the analogy is strong and obvious) OR No (if it is a stretch or unclear).
     If yes: Treat it as a ruled case and go to Step 2 (Consistency Check) but note that it's an analogical application and report to me for review.
     If no: Hand the case to me (trust and safety lead) because it requires a policy decision (creating a new rule or taking an extraordinary action).

   Now, we must assign who decides at each step. The procedure is for moderators (volunteers) to run, but they hand off to me in several places.

   Steps 1, 3, 5, 6: Moderator can decide (with Step 3 being a high bar and Step 6 requiring caution).
   Step 2: If the answer is yes, moderator proceeds. If no, hand to me.
   Step 4: If the answer is yes, moderator enforces. If no, hand to me.

   But note: Step 3 if yes, the moderator lets it go but reports to me. Step 6 if yes, the moderator proceeds to Step 2 but also reports to me.

   Now, let's structure the table.

   Table 1: The Procedure

   Step | Question | Sufficient Answer | What to do if the answer is no | Who Decides
  ------|----------|-------------------|--------------------------------|-------------
  1 | Does the reported behavior clearly violate a written rule? | Yes: Proceed to Step 2. No: Proceed to Step 5. | N/A (it's a branch) | Moderator
  2 | Has this rule been consistently enforced in similar past cases? | Yes: Proceed to Step 3. No: Hand the case to the trust and safety lead. | Hand the case to the trust and safety lead. | Moderator (but if no, hands to lead)
  3 | Despite the violation, is the harm from enforcing the rule (to the community or the user) so overwhelmingly greater than the harm of the violation that it would be catastrophic to enforce? | Yes: Let it go with a warning, document the exception, and report to the trust and safety lead. No: Proceed to Step 4. | Proceed to Step 4. | Moderator
  4 | Can we enforce the rule effectively? | Yes: Enforce the rule. No: Hand the case to the trust and safety lead. | Hand the case to the trust and safety lead. | Moderator (but if no, hands to lead)
  5 | Is the behavior causing clear and significant harm to the community? | Yes: Proceed to Step 6. No: Let it go and document the incident for possible future rule-making. | Let it go and document. | Moderator
  6 | Can the behavior be reasonably treated as a violation under an existing rule by a clear and straightforward analogy? | Yes: Note the analogical application, report to the trust and safety lead, and proceed to Step 2. No: Hand the case to the trust and safety lead. | Hand the case to the trust and safety lead. | Moderator

   Now, we run the three cases.

   Case (a): The long-standing arbitrary rule, applied to a first-time offender who is otherwise the most helpful person in the community.

   Steps:
   1: Yes, the rule exists and the behavior violates it (even if arbitrary).
   2: We assume the rule has been enforced consistently in the past? Let's say yes (it's long-standing and arbitrary, but consistent). So proceed to Step 3.
   3: Is enforcing the rule against this helpful person catastrophic? The harm of enforcement: we lose a valuable member for a minor, arbitrary violation. The harm of the violation: minimal (one link to a competitor). But is it catastrophic? It might cause community uproar and loss of trust. However, the rule's authority is at stake. We set a high bar: if the member is so critical that the community would collapse without them, then yes. But typically, no. So let's say no. Then Step 4.
   4: Can we enforce? Yes, we can ban or remove the link. So we enforce.

   But note: Step 3 is the critical step. If we decide that the harm of enforcement is catastrophic (e.g., this user is the backbone of the community and the violation is trivial), then we let it go. But that's the exception.

   Verdict: Enforce the rule. Step 3 is doing the work by setting a high bar and in this case the bar isn't met. However, it nearly misfires because the moderator might be tempted to set the bar too low and let it go. What's unsettled: the arbitrariness of the rule isn't addressed. The procedure doesn't allow challenging the rule during enforcement.

   Case (b): Something genuinely awful that no rule covers, where everyone is demanding we do something.

   Steps:
   1: No (no rule covers it) -> Step 5.
   5: Is it causing clear and significant harm? Yes (everyone is upset, so clearly yes) -> Step 6.
   6: Can we use an existing rule by analogy? Example: if the awful thing is hate speech but we only have a rule against personal attacks, we might analogize. If the analogy is clear and straightforward, then yes. But if it's a new kind of harm (like doxxing and we have no rule), then maybe not. Let's assume we can't find a clear analogy. Then hand to me.

   Verdict: Hand to trust and safety lead. Step 6 is doing the work. It nearly misfires if the moderator tries to force an analogy that isn't straightforward. What's unsettled: the community expects action, but we have no rule. We must act, but the procedure says hand to lead.

   Case (c): A rule that's plainly just, that we have no power to enforce against a user who will simply make a new account.

   Example: A user is spamming, we ban, but they make new accounts.

   Steps:
   1: Yes, violates rule (spam).
   2: Assume consistent enforcement -> Step 3.
   3: Is it catastrophic to enforce? No, we want to stop spam -> Step 4.
   4: Can we enforce effectively? Banning the account is easy, but if they make new accounts, then the enforcement is ineffective. So no. Hand to trust and safety lead.

   Verdict: Hand to trust and safety lead. Step 4 is doing the work. It nearly misfires if the moderator doesn't consider the ease of circumvention. What's unsettled: the rule is just but we lack the force. We need technical measures (like IP ban) or to live with powerless justice? The lead must decide.

   Table 2: The Three Cases

   Case | Verdict | Which step is doing the work | Where it nearly misfires | What it leaves unsettled
  ------|---------|------------------------------|--------------------------|-------------------------
  (a) Arbitrary rule against a helpful user | Enforce the rule | Step 3 (because the exception bar is high and not met) | If the moderator misjudges the harm of enforcement as catastrophic when it isn't, they might let it go and undermine the rule. | The rule's arbitrariness; the community may still see it as unjust.
  (b) Awful behavior with no rule | Hand to trust and safety lead | Step 6 (because no clear analogy exists) | If the moderator forces an analogy, they might apply a rule arbitrarily. If they don't, they leave the community without immediate action. | How to handle the community's demand for immediate action when the rules don't cover it.
  (c) Just rule but unenforceable | Hand to trust and safety lead | Step 4 (because enforcement is ineffective) | If the moderator enforces anyway (by banning the account) and doesn't consider the ineffectiveness, they waste time and the problem persists. | The gap between having a just rule and having the force to back it.

   Table 3: The Limits

   Limitation | Why it can't be fixed | What to do instead
  ------------|----------------------|-------------------
  The procedure cannot make arbitrary rules just. | As per Pascal, the authority of a rule comes from its establishment, not its inherent justice. Arbitrary rules remain arbitrary. | Periodically review rules (outside of enforcement) to remove or justify arbitrary ones. But during enforcement, respect the rule to avoid undermining the system.
  The procedure requires moderators to make difficult judgments (e.g., catastrophic harm in Step 3). | Volunteers have no training and limited time. We cannot remove all judgment without making the procedure too rigid. | Provide clear examples and thresholds for Step 3 (e.g., "catastrophic harm" means the community would suffer irreversible damage). Document exceptions and review them regularly.
  The procedure may lead to under-enforcement in unruled cases (Step 5: if harm is not clear and significant, we let it go). | We don't want to create rules for every minor issue, but harmful behaviors might slip through until a rule is made. | Encourage moderators to document all unruled incidents and review them periodically to identify patterns and create new rules proactively.
  The procedure cannot solve the force problem (Step 4: unenforceable rules). | Technical limitations or user persistence may make enforcement impossible. | The trust and safety lead must work on technical or systemic solutions (e.g., better account verification, IP bans, rate limiting) but that's outside the moderation procedure.

   Now, we write the structured data as requested.

   Note: Above each table, we have a couple of sentences.

   Let's write.
answer: |-
  ### Decision Procedure Based on Pascal's Framework  
  Pascal’s insight: Rules derive authority from establishment (force), not inherent justice. Moderators must balance consistency (force) with catastrophic harm (where enforcement undermines the community). The procedure prioritizes stability but allows rare exceptions when enforcement would collapse trust. Volunteers apply steps 1–6; steps marked "Lead" escalate to you.

  **Table 1: Decision Procedure**  

  | Step | Question | Sufficient Answer | If "No" | Who Decides |  
  |------|----------|-------------------|---------|-------------|  
  | 1 | Does the behavior clearly violate a written rule? | Yes: Proceed to Step 2. No: Proceed to Step 5. | N/A (branching) | Moderator |  
  | 2 | Is the rule consistently enforced (per precedent)? | Yes: Proceed to Step 3. No: Inconsistent enforcement risks arbitrariness. | Escalate to Lead | Moderator |  
  | 3 | Would enforcement cause catastrophic harm (e.g., mass exodus, collapse of trust)? | Yes: Exceptionally let it go; document and alert Lead. No: Proceed to Step 4. | Proceed to Step 4 | Moderator |  
  | 4 | Can we enforce effectively (user can’t easily evade)? | Yes: Enforce the rule. No: Enforcement is powerless. | Escalate to Lead | Moderator |  
  | 5 | Is the behavior causing severe, immediate harm (e.g., safety risk)? | Yes: Proceed to Step 6. No: Let it go; document for review. | Let it go | Moderator |  
  | 6 | Can we analogize to an existing rule without stretching? | Yes: Apply analogized rule; alert Lead. No: New rules can’t be made ad hoc. | Escalate to Lead | Moderator |  

  ---

  ### Case Applications  
  The procedure enforces established rules rigidly unless force is impotent (Step 4) or enforcement is catastrophic (Step 3). Unruled harm requires analogy (Step 6) or escalation.  

  **Table 2: Case Analysis**  

  | Case | Verdict | Key Step | Near Misfire | Unsettled Issue |  
  |------|---------|----------|--------------|----------------|  
  | (a) Arbitrary rule against helpful user | Enforce the rule | Step 3 (catastrophic harm not met) | Moderator might overestimate "harm" and ignore the rule’s authority. | Rule’s arbitrariness remains unchallenged; community resents rigidity. |  
  | (b) Awful unruled behavior (e.g., grooming) | Escalate to Lead | Step 6 (no safe analogy) | Moderator might force a weak analogy, creating arbitrary precedent. | Community demands action; delay fuels perception of powerlessness. |  
  | (c) Just but unenforceable rule (e.g., ban evader) | Escalate to Lead | Step 4 (force ineffective) | Moderator enforces futilely, wasting time and exposing weakness. | Justice requires force; lacking it, the rule becomes symbolic. |  

  ---

  ### Inherent Limitations  
  Pascal’s dilemma: Rules gain authority through establishment, not fairness. Moderators can’t resolve systemic gaps mid-case.  

  **Table 3: Limitations**  

  | Limitation | Why Unfixable | Mitigation |  
  |------------|---------------|------------|  
  | Arbitrary rules stay arbitrary | Authority comes from force (establishment), not justice. Litigating mid-enforcement undermines stability. | Review rules quarterly; sunset unused ones. But enforce as-is during cases. |  
  | Volunteers judge "catastrophic harm" (Step 3) | No objective threshold; depends on context. Overuse erodes rules. | Train with examples: "Catastrophic = 50+ users revolt or critical contributor lost." Document all exceptions. |  
  | Unruled harm relies on analogy (Step 6) | Analogies stretch rules arbitrarily. Volunteers lack policy authority. | Lead reviews all analogies; add precedent to rulebook if repeated. Reject weak analogies. |  
  | Escalation bottlenecks (Steps 2/4/6) | Lead time constraints delay justice. Volunteers can’t resolve force gaps. | Automate referrals; use templated responses. For force gaps (e.g., ban evaders), invest in tech (IP/device bans). |
