prompt: |-
  My friend Dana is a retired actuary and she will not shut up about Keynes on probability — the thing where two arguments can hand you the exact same probability and still not be the same argument, because one of them has more weight sitting underneath it, meaning more relevant evidence actually piled up behind the number. More evidence can even lower the probability and still raise the weight, she says. She also insists this is a seperate idea from being scared of unknown odds and that everyone keeps collapsing the two. Fine. But I want to know what rule she's actually running, so here's her record, and then a new case I want to spring on her.

  Her record: anything with a huge documented history behind it — millions of observations, odds you could look up in a table — she takes a small edge on without blinking. She'll also take a 1-in-50 longshot when the payout is a bit better than the long odds justify, as long as the machine generating it has thousands of logged runs. So it's not just that she's scared of losing money. And then a one-off thing where the only basis was an analogy to four vaguely similar cases, and where the people who'd actually know ranged from 5% to 60% and wouldnt commit to a number: she passed, and said something rude about the odds being mush.

  The new case: a newly designed building component. The engineers put the chance of a particular failure next year at 1 in 500, and they'll defend that number to the death — but it comes out of a physics model, not data. The design has never actually been fielded, so the track record is literally zero. I can offer Dana a bet at odds where 1 in 500 makes it a clearly good deal, stakes are a few hundred quid.

  Predict what she does, and give it to me as exactly five numbered items, a sentence or two each, no intro and no conclusion: the candidate rules that fit her record so far; what each of those rules predicts for the component bet; your best guess and why; the other case I should put to her that would actually seperate those rules, plus what each combination of answers would tell me; and finally whether her record adds up to one coherent position at all — is the Keynes thing really a different idea from plain aversion to unknown odds, and would Keynes himself even sign off on whatever rule she turns out to be running.
reasoning: |-
  Okay, let me tackle this step by step. Dana's friend is fascinated by Keynes' concept of weight of evidence in probability. The key point is that two arguments can assign the same probability but differ in the weight of evidence supporting them. Dana's behavior shows she values high weight — extensive data or documented history — over merely favorable odds. 

  First, I need to identify candidate rules from her record. She bets confidently on outcomes with massive historical data (millions of observations) or well-documented machine logs (thousands of runs), even if the edge is small or it's a longshot. But she avoids cases based on weak evidence like a vague analogy with only four similar cases and unreliable expert estimates. This suggests two possible rules: one prioritizes weight of evidence based on data quantity, while the other focuses on the reliability of the evidence source.

  For the new case—a building component with a 1 in 500 failure rate from a physics model but zero real-world data—each rule predicts differently. Rule 1 (weight focused) would reject the bet due to insufficient evidence weight. Rule 2 (source reliability) might accept if she trusts engineering models. My best guess is rejection because Dana has shown aversion to untested models before, and the physics model lacks empirical backing.

  To differentiate between the rules, I consider a test case: a machine with 10,000 documented runs showing 1 in 300 failure odds versus expert consensus of 1 in 500 without data. If she accepts the first but rejects the second, it confirms Rule 1. Accepting both would support Rule 2. 

  On coherence: Dana's position aligns with Keynes' weight of evidence concept, distinct from standard risk aversion. She's comfortable with known longshots if well-documented but avoids low-evidence scenarios even with seemingly favorable odds. Keynes would likely endorse this emphasis on evidence quality over mere probability calculations.
answer: |-
  Here are the five numbered items as requested:

  1.  **Candidate Rules:** Two rules fit her record:
      *   **Rule 1 (Weight Threshold):** Accept bets only when the probability estimate is supported by a *sufficiently high "weight of evidence"* (extensive documented data/history), regardless of the specific probability value if that threshold is met. Reject if evidence is sparse or qualitative.
      *   **Rule 2 (Source Reliability):** Accept bets when the probability estimate comes from a *highly reliable, objective source* (actuarial tables, documented machine logs) generating frequent outcomes. Reject if the source is subjective, analogical, or expert opinion without robust data backing.

  2.  **Prediction for Component Bet:**
      *   **Rule 1 (Weight Threshold):** Predicts **REJECTION**. The physics model, despite engineer confidence, lacks *any* empirical evidence (track record = zero), resulting in very low weight.
      *   **Rule 2 (Source Reliability):** Predicts **REJECTION**. The source is a theoretical physics model applied to a novel, untested design, lacking the objective, data-generating reliability of tables or logged machine runs. Expert confidence alone isn't sufficient.

  3.  **Best Guess & Why:** **REJECTION.** Dana's rude dismissal of the analogy-based case and comfort only with extensive documented history or machine logs strongly indicates she requires a substantial empirical foundation ("weight") or objective data source. A novel component relying solely on an unvalidated model, despite precise odds and high confidence, lacks this foundation. Her focus is on the *quality and quantity of evidence behind the number*, not just the number itself.

  4.  **Differentiating Case & Interpretation:** **A bet on a *well-understood* natural event with vast historical data (e.g., regional rainfall exceeding 50mm in April) vs. a similar bet based *only* on a highly sophisticated, trusted climate model predicting the same odds *without* specific historical precedent for the exact conditions.**
      *   **If she ACCEPTS the historical bet but REJECTS the model bet:** Confirms **Rule 1 (Weight Threshold)** - evidence quantity/empirical history is key.
      *   **If she ACCEPTS BOTH:** Supports **Rule 2 (Source Reliability)** - she trusts the sophisticated model source as sufficiently objective/reliable, even without specific history.
      *   **If she REJECTS BOTH:** Suggests an even stricter requirement or aversion beyond these rules.

  5.  **Coherence & Keynesian Alignment:** **Yes, her record adds up to one coherent position distinct from unknown odds aversion.** She takes *known* longshots (1-in-50) with documented runs and rejects low-evidence cases even with seemingly favorable odds. This prioritizes the *robustness* of the probability estimate (Keynes's "weight") over the estimate's *value* or simple familiarity. Keynes would likely endorse her emphasis on weight as distinct from probability value and her skepticism of ungrounded precise numbers. Her rule is fundamentally about the *evidential basis* ("weight"), which is indeed separate from risk aversion over unknown probabilities.
