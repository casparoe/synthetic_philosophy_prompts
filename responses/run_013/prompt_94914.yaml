prompt: |-
  I'm giving a talk at our joint session next month — it's the gravity group from physics, plus the two Kant people from philosophy, plus a historian who's been in the archives working on Gödel's later years — and I'm defending a line I don't think anyone in the room will like: that Gödel's rotating universe doesn't show that time is unreal, it shows that that universe has no global time function and no Cauchy surfaces, which is a fact about simultaneity structure and not about the passage of time. As I read him, the argument runs: if there were an objective lapse of time there'd have to be a global now that comes into being and passes away, and the relativity of simultaneity kills that; and his solution is meant to be the stronger case, because in it you can fly a rocket back into your own past, so the standard "simultaneity is just a convention of clock synchronisation" escape hatch isn't available.

  So write me my Q&A prep sheet. The objections I'll actualy get in that room, not the ones I'd get on the internet. Order them by how much damage they'd do. Phrase each one the way that particular person would phrase it — the relativists have their own vocabulary (initial value formulation, global hyperbolicity, is this even a stable model or is it a toy that nobody thinks is a live possibility for our universe?), the Kant people will want to know whether Gödel is a transcendental idealist about time or just a guy saying becoming is an illusion, and the historian will probably say I'm attacking a version of the argument nobody holds. Give me a two-minute reply for each, and flag honestly where my reply is soft. And include the one I'm hoping nobody asks.

  A couple of things I'd like you to take seriously rather than skate past: the possibility that the lack of global slices is irrelevant because you can still define becoming locally, along a worldline, with proper time and the local light cones — if that's right, what's left of Gödel's argument? And the worry that the whole thing rests on a premise about what has to be true for time to be "real" that we have no independent reason to accept. I don't want a defense of my view, I want the ambush.
