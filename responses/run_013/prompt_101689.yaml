  ### Decision Tree: Positions on the Justification of Induction  

  **Starting Commitment:** You accept the no-free-lunch (NFL) results (uniformly averaged over all possible input-output mappings, no learning rule outperforms any other off-training) and see them as relevant to the classical problem of induction.  

  ---

  #### **Decision Tree**  
  1. **Do the NFL results add a *novel* challenge to the classical problem of induction, or merely restate it in formal terms?**  
     - **Adds novelty** → Proceed to 2.  
     - **Merely restates** → Proceed to 3.  

  2. **Is a uniform prior over *all possible functions* coherent?**  
     - **Yes** → Proceed to 4.  
     - **No** → Proceed to 5.  

  3. **What is the core complaint in the classical skeptical argument?**  
     - **Our inductive inferences lack justification** → Proceed to 6.  
     - **No rule *could* be justified on the skeptic’s terms** → Proceed to 7.  

  4. **What is the lesson of NFL?**  
     - **Inductive rules are unjustified** → **Leaf: NFL-Skepticism** (Formal skepticism).  
     - **The skeptic’s universal-demand is impossible** → Proceed to 7.  

  5. **Where is justification located?**  
     - **Prior over hypotheses** → **Leaf: Objective Bayesianism** (e.g., Solomonoff induction).  
     - **Reliability of the process** → **Leaf: Actual-World Reliabilism**.  
     - **Fit between rule and domain structure** → **Leaf: Structural Realism**.  
     - **Pragmatic success** → **Leaf: Pragmatic Vindication**.  

  6. **Where is justification located?**  
     - **Prior over hypotheses** → Proceed to 8.  
     - **Reliability of the process** → **Leaf: Formal Learning Optimism** (e.g., convergence in the limit).  
     - **Fit between rule and domain structure** → **Leaf: Structural Realism**.  
     - **Pragmatic success** → **Leaf: Pragmatic Vindication**.  

  7. **Where is justification located?**  
     - **Prior over hypotheses** → Proceed to 8.  
     - **Reliability of the process** → **Leaf: Actual-World Reliabilism**.  
     - **Fit between rule and domain structure** → **Leaf: Structural Realism**.  
     - **Pragmatic success** → **Leaf: Pragmatic Vindication**.  

  8. **What is the status of “the future resembles the past”?**  
     - **Substantive claim** → **Leaf: Objective Bayesianism**.  
     - **Definition** → **Leaf: Subjective Bayesianism**.  
     - **Regulative maxim** → **Leaf: Kantian Regulativism**.  
     - **Practical commitment** → **Leaf: Pragmatic Vindication**.  

  ---

  #### **Leaves (8 Named, 1 Unnamed)**  
  1. **NFL-Skepticism** (Named):  
     - NFL reveals a new, formal barrier to induction. Justification fails because no rule dominates universally.  

  2. **Objective Bayesianism** (Named):  
     - Justification via a non-uniform prior (e.g., simplicity-weighted). Resemblance is a *substantive claim* about the world’s structure.  

  3. **Subjective Bayesianism** (Named):  
     - Justification via coherent priors, but resemblance is a *definition* of rationality (e.g., exchangeability as a modeling choice).  

  4. **Formal Learning Optimism** (Named):  
     - Justification via long-run reliability (e.g., truth-convergence). Resemblance is implicit in convergence proofs.  

  5. **Actual-World Reliabilism** (Named):  
     - Justification via the process’s reliability *in the actual world*. Resemblance is a *substantive claim* (the world is stable).  

  6. **Structural Realism** (Named):  
     - Justification via the *fit* between inductive rules and domain structure (e.g., natural laws). Resemblance is a *substantive claim*.  

  7. **Pragmatic Vindication** (Named):  
     - Justification via practical success (e.g., “induction works”). Resemblance is a *practical commitment* for agents.  

  8. **Kantian Regulativism** (Named):  
     - Resemblance is a *regulative maxim* (necessary for inquiry). Justification via prior + regulative role.  

  9. **Classical Skepticism** (Named):  
     - (From 3→6: No justification possible. NFL restates Hume’s core argument.)  

  ---

  #### **Notes on Empty Slots**  
  - **Unnamed Positions**:  
    - **Slot 1**: *Justification via fit* + *Resemblance as regulative maxim*.  
      - **Status**: Unexplored. Rarely argued (combines metaphysical structure with transcendental pragmatism).  
    - **Slot 2**: *Justification via reliability* + *Resemblance as definition*.  
      - **Status**: Incoherent. Reliability requires a contingent world, but definitions are non-empirical.  
    - **Slot 3**: *Justification via pragmatic success* + *Resemblance as regulative maxim*.  
      - **Status**: Unattractive. Combines instrumentalism with non-pragmatic necessity; no clear proponents.  

  - **Indistinguishable Leaves** (tree cannot separate):  
    1. **Objective Bayesianism** (from 5 or 8) and **Structural Realism** (from 5, 6, or 7):  
       - Both appeal to domain structure. Distinction hinges on whether "structure" is encoded in priors (Bayesian) or rules (realism).  
    2. **Pragmatic Vindication** (from 5, 6, or 7) and **Kantian Regulativism** (from 8):  
       - Both emphasize practical agency. Tree cannot split "pragmatic commitment" (action-oriented) vs. "regulative maxim" (reason-oriented).  

  - **Why No More Leaves?**  
    - The tree covers major extant positions. Empty slots arise from tensions: e.g., *reliability* + *definition* ignores the empirical basis of reliability, while *fit* + *regulative* lacks a clear mechanism linking structure to necessity.  
    - **Classical Skepticism** (leaf 9) is included for symmetry with NFL-skepticism, though it occupies a distinct historical niche.  

  This tree isolates core tensions: NFL’s novelty, the coherence of universality, the skeptic’s demands, and the locus/status of justification. It avoids proper names to emphasize logical structure.
