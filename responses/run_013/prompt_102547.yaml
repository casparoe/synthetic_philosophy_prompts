  I recall how their field uses "reference intervals" - those appear objective but hid normative judgments (like race coefficients). And their expertise in set points shows biological norms are context-dependent, not absolute. 

  The key tension: Naturalists like Boorse treat statistical dysfunction as value-free facts, while normativists argue calling something "disease" always implies undesirability. But the user's dual-norm framework reveals both are partly right - naturalists describe criterion norms, normativists observe how sampling norms drive medical decisions.

  Progress would require disentangling these concepts. We could distinguish "dysfunction" (criterion norm) from "pathology" (dysfunction + harm) and "medicalized condition" (sampling norm + intervention trigger). For contested cases (aging, fever), we'd ask: Is there dysfunction? Does it cause harm? Should we intervene? 

  The user's background suggests they'll appreciate concrete examples. I'll use their renal expertise: Is low GFR in aging a disease? By criterion norms - yes (functional decline); by harm assessment - depends on symptoms; by medicalization - only if treatment benefits outweigh burdens.

  This reframing makes the philosophical stalemate productive. Instead of fighting over "disease," we clarify what work the concept should do in specific contexts - much like adjusting set points based on physiological demands.
answer: |-
  Your diagnosis of the dispute is remarkably astute. The naturalism-normativism impasse isn't primarily about biological facts or values *in isolation*, but about **the conflation of two distinct normative projects** under the single label "disease," compounded by medicine's practical need for a monolithic concept. Here’s a concrete diagnosis and what progress entails:

  ### 1. **The Core Problem: Two Kinds of "Norm" Doing Different Work**
     - **Criterion Norm (Functional Norm):**  
       What a biological part is *optimized by evolution to do* (e.g., nephron filtration efficiency under ideal conditions). Naturalists (like Boorse) implicitly appeal to this. It’s a *theoretical ideal* derived from physiology/evolution.  
     - **Sampling Norm (Statistical/Clinical Norm):**  
       What is statistically common *in a reference population* (e.g., age-adjusted GFR). Normativists point to how medicine *actually uses* this plus evaluative judgments (e.g., "is this GFR level *harmful* for *this* patient?").  

     **Conflict:** Naturalists claim criterion norms are objective and value-free. Normativists retort that *applying* "disease" requires judging statistical deviations as *harmful*, which is value-laden. **But you're right: they’re often talking about different norms.**  

  ### 2. **Why the Dispute Stalls: A Monolithic Concept vs. Plural Functions**
     Both sides assume "disease" must be a unified concept serving all medical/social roles:  
     - **Classifying biological dysfunction** (criterion norm)  
     - **Triggering treatment** (sampling norm + harm evaluation)  
     - **Allocating resources/assigning blame** (social negotiation)  
     
     **Example:** Aging kidneys.  
     - *Criterion norm:* Glomerular filtration *is* impaired relative to peak function.  
     - *Sampling norm:* Low GFR is statistically expected for age → not labeled "disease."  
     - *Normative layer:* We *choose* not to medicalize aging because intervention may cause more harm than good.  

     Naturalists focus on the criterion dysfunction (it *is* impaired). Normativists focus on the practical outcome (we don’t *call* it a disease). **The dispute persists because both claim their "norm" defines disease.**  

  ### 3. **The Hidden Empirical Problem: Criterion Norms Are Often Indeterminate**  
     Physiology alone *cannot* settle contested cases because functional norms are:  
     - **Context-dependent:** Fever or insulin resistance may be adaptive responses.  
     - **Plastic:** Set points shift (e.g., blood pressure "norms" across lifetimes).  
     - **Evolutionarily contingent:** Traits are compromises, not optima (e.g., human pelvises are "poorly designed" for bipedalism + childbirth).  
     
     **Result:** When criterion norms are fuzzy (e.g., "What is the *ideal* GFR for a 78-year-old?"), medicine defaults to sampling norms + harm assessments. Normativists see this as proof that values are inescapable; naturalists see it as epistemic limitation.  

  ### 4. **What Progress Looks Like: Splitting the Concept**  
     The solution isn’t choosing a side but **disambiguating the work "disease" does**:  
     | **Concept**          | **Definition**                          | **Role**                                  | **Example (Renal)**                     |  
     |----------------------|----------------------------------------|-------------------------------------------|-----------------------------------------|  
     | **Dysfunction**      | Deviation from *criterion norm* (evolutionary function) | Biological description                   | ↓GFR relative to peak capacity          |  
     | **Pathology**        | Dysfunction + *harm* (to goals/values) | Clinical/personal relevance              | ↓GFR causing symptomatic uremia         |  
     | **Medical Condition**| Pathology + *treatability*             | Healthcare system action                 | CKD stage requiring dialysis            |  

     **Why this resolves the dispute:**  
     - Naturalists win on **dysfunction**: Physiology *can* identify impaired function (e.g., nephron failure) objectively.  
     - Normativists win on **pathology/medical condition**: Harm, treatability, and resource allocation *require* values.  
     - **Aging kidneys:** Dysfunctional? Yes. Pathological? Only if harmful. Medical condition? Only if treatment is beneficial/feasible.  

  ### 5. **Testing Your Suspicion**  
     You suspected both sides conflate norms because medicine demands a monolithic concept. **This is correct.** Progress comes from showing:  
     - Naturalists’ "dysfunction" is necessary but insufficient for medical practice (needs harm/treatability).  
     - Normativists’ emphasis on values presupposes a baseline of dysfunction (you don’t label happiness a "disease," even if statistically deviant).  

     **Contested Case (Fever):**  
     - *Dysfunction?* Thermoregulation set-point altered → criterion norm deviation.  
     - *Pathology?* Context-dependent: Harmful if extreme/septic; adaptive if fighting infection.  
     - *Medical condition?* Only if antipyretics/antibiotics are warranted.  

  ### Conclusion: Toward Progress  
  **Progress is conceptual disentanglement.** The dispute is substantive *only* if we insist "disease" must be one thing. By splitting the concept:  
  - Philosophers clarify what each camp captures (dysfunction vs. pathology).  
  - Clinicians gain precision: A statin might treat "medicalized dyslipidemia" without implying "dysfunction" in a hunter-gatherer context.  
  - Your renal expertise shows the way: Reference intervals (sampling norms) guide treatment thresholds, but tubular transport mechanisms (criterion norms) explain *why* a solute is dysregulated.  

  **What to do next:** Investigate *multidimensional* accounts of disease (e.g., Wakefield’s "harmful dysfunction" hybrid). Your physiological realism exposes why pure naturalism is incomplete, while your pragmatism shows why normativism isn’t unmoored from biology. The impasse dissolves when we stop asking "What is *disease*?" and ask instead: "**Dysfunctional *for what purpose*? Harmful *to whom*? Actionable *under which constraints*?**"
