  The hardest counterargument is that we must compare to allocate reparations fairly. I'll grant this but insist SHWI's framework is wrong for that purpose - we need contextual justice, not scores. Final verdict: the index is conceptually flawed and morally hazardous, though not wholly "obscene" if used with extreme caveats.

