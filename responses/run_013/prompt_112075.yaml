  For structure: I'll start by mapping the conceptual landscape - possibilities range from full comparability to radical incommensurability. Then commit to a modified incommensurability position: comparison is possible in limited ways but the SHWI fails because it forces false precision. The ordinal/cardinal distinction won't save it because the dimensions themselves embed contested value judgments.

