  Okay, the user is grappling with a philosophical and methodological issue in debates about violence trends. They describe three common positions: one focusing on per-capita homicide decline, another expanding to absolute war deaths and structural factors, and a third rejecting trend claims entirely due to category fluidity. The core problem seems to be that these aren't factual disputes but metalinguistic disagreements about whether "violence" can even support trend analysis.

  The user wants this phenomenon properly carved out - distinguishing it from simple definitional quarrels or reference class problems. They're likely an intellectually rigorous person frustrated by circular debates, possibly in academia or policy circles. Their deeper need might be for conceptual tools to either resolve such disputes or recognize when they're fundamentally unresolvable.

  I recall similar patterns in other contested categories: "terrorism" definitions that exclude state actions, "poverty" measures ignoring non-monetary deprivation. The key is that boundary-setting isn't preparatory but constitutive of the answer. This seems closest to what philosophers call "essentially contested concepts" (Gallie), but needs augmentation since Gallie focused on normative disputes whereas here the contestation blocks empirical assessment.

  The user's observation about boundary-setting being "argumentatively load-bearing" is acute. We could call this "constitutive boundary contestation" - where disagreement over category membership isn't noise but the signal. Unlike fuzzy concepts where operational definitions suffice (e.g., defining "mountain" at 1000ft), here every boundary proposal carries implicit worldviews. 

  For violence specifically, the evaluative dimension makes it worse: counting "structural violence" requires moral judgments about responsibility. But even descriptive concepts like "recession" show similar issues when technical definitions (e.g., two-quarter GDP decline) clash with public understanding. The key difference from natural kinds is that violence lacks objective demarcation - it's more like "weed" than "water."

  Importantly, once boundaries are fixed, trend measurement becomes empirical - but fixing boundaries is precisely where politics and values operate. So the "fact of the matter" exists only conditionally. This explains why such debates never conclude: opponents are playing different language games. The user might benefit from Walter Bryce Gallie's work supplemented by Sally Haslanger on discursive vs manifest concepts.
answer: |-
  This phenomenon is both profound and pervasive, and it deserves a precise name: **Constitutive Boundary Contestation (CBC)**. It's not merely a definitional quarrel or a reference class problem – it's a deeper metalinguistic conflict about the *nature* of the predicate itself and its suitability for trend analysis.

  **Carving the Phenomenon:**

  1.  **The Core:** CBC occurs when:
      *   A group attempts to assert a historical *trend* (increase/decrease/stasis) for a complex, socially embedded concept (e.g., violence, poverty, justice, health, democracy).
      *   The disagreement fundamentally centers **not on the empirical data *within* a shared definition**, but on **whether the concept itself possesses a stable, objective, and non-arbitrary boundary** that allows meaningful aggregation and comparison over time/space.
      *   Crucially, **shifting the boundary *is* the argumentative move** that determines the perceived trend. Each boundary proposal is internally coherent and defensible based on specific values, perspectives, or theoretical commitments.
      *   The dispute is **inherently unresolvable by purely empirical means** because the disagreement operates at the level of *what counts as an instance* of the concept, prior to measurement.

  2.  **Distinguishing from Near Misses:**
      *   **Plain Definitional Quarrel:** This is about choosing *which* precise operational definition to use *for practical purposes* (e.g., "Should 'poverty' use $1.90/day or $5.50/day?"). CBC disputes the *possibility* or *meaningfulness* of *any* stable operational definition for trend analysis, arguing the concept's essence is inherently contested and boundary-shifting.
      *   **Reference Class Problem:** This concerns *which specific group* a statistic applies to (e.g., "Does the homicide rate refer to all humans, adults, or citizens?"). CBC is more fundamental: it questions whether the *category itself* ("violence," "war death") has a coherent membership *regardless* of the reference class. It challenges the unity of the category.
      *   **Fuzzy Boundaries/Vagueness:** While CBC concepts are fuzzy, the key difference is that **the fuzziness is *constitutive* and *argumentatively load-bearing*.** In a merely fuzzy concept (e.g., "tall"), boundary disputes are nuisances to be managed (e.g., set a cutoff at 6'0"). In CBC, the boundary dispute *is* the substantive disagreement about the world (e.g., "Is malnutrition caused by state policy 'violence'?"). Resolving the fuzziness *by definition* resolves the substantive question.
      *   **Failed Natural Kind:** This is close, but CBC concepts often aren't *mistakenly believed* to be natural kinds (like phlogiston). Instead, they are *recognized* as socially constructed, yet parties disagree on *how* they should be constructed for the purpose of historical analysis. The contestation *is* the process of construction.

  3.  **Is it Specific to Violence or Evaluative Concepts?**
      *   **Not Exclusive:** CBC arises most intensely with **thick ethical concepts** (like violence, justice, oppression, freedom) where description and evaluation are inseparable. Deciding what counts as "violence" inherently involves moral/political judgment (e.g., structural violence vs. direct physical harm).
      *   **Broader Scope:** However, CBC can plague any concept where:
          *   Social norms and definitions change significantly over time (e.g., "literacy" in a digital age, "disease" including mental health).
          *   Measurement depends on institutional capacity and priorities (e.g., "crime," "unemployment").
          *   The concept aggregates diverse phenomena whose unity is contested (e.g., "war" vs. low-intensity conflict, "terrorism").
          *   Examples: Poverty (monetary vs. capability deprivation), Intelligence (IQ vs. multiple intelligences), Democracy (electoral vs. liberal vs. substantive), Health (absence of disease vs. wellbeing), Recession (technical GDP definition vs. lived experience).

  4.  **The Status of "Facts" and the Contested Step:**
      *   **Conditional Facts:** *Once* a specific boundary definition (and measurement protocol) is *fully fixed and agreed upon*, then, *relative to that definition*, there is an empirical fact of the matter about the trend. E.g., "Using definition X for 'war death', the absolute number trended upwards from 1990-2010."
      *   **The Core Contestation:** The unresolvable disagreement lies precisely in **which boundary definition *should* be used for meaningful historical trend analysis.** This choice is:
          *   **Value-Laden:** It reflects priorities (e.g., individual bodily harm vs. systemic deprivation), theories of causation (e.g., is neglect "violence"?), and worldviews.
          *   **Non-Arbitrary but Disputable:** Each proposed boundary isn't random; it's argued based on coherence, moral weight, theoretical utility, or historical context. But no single boundary is demonstrably *the* correct one for all purposes.
          *   **The Decisive Move:** Accepting one boundary proposal inherently yields one trend narrative; accepting another yields a different or even opposite narrative. The boundary *fixes* the answer.

  **Edges of the Phenomenon:**

  *   **Not All Contested Concepts Exhibit CBC:** Simple disagreements over definitions (e.g., "Is a hotdog a sandwich?") usually don't involve claims about historical *trends*. CBC is specific to trend claims.
  *   **Degree Matters:** Some concepts are more prone to CBC than others. "Temperature" is highly resistant; "wellbeing" is highly susceptible. CBC intensity increases with:
      *   The evaluative/normative loading of the concept.
      *   The heterogeneity of phenomena potentially included.
      *   The magnitude of historical change in social understandings and recording practices.
  *   **Termination:** CBC debates don't terminate empirically because they are ultimately about values and frameworks. They can only be resolved by:
      1.  Explicitly agreeing on a specific, narrow operational definition *for a specific purpose* (acknowledging its limitations).
      2.  Shifting the conversation away from a singular "trend" to analyzing *multiple* trends under *different* plausible definitions.
      3.  Abandoning the quest for a monolithic trend altogether and focusing on the underlying phenomena and the reasons for boundary disputes.

  **In Summary:**

  **Constitutive Boundary Contestation (CBC)** is the metalinguistic disagreement about whether a complex, socially embedded, often evaluative concept possesses a sufficiently stable and objective boundary to support meaningful claims about its historical trend. The dispute centers on the *constitutive rules* for what counts as an instance of the concept, recognizing that shifting these rules *is* the argumentative move that determines the perceived trend. Each rule-set is coherent and defensible, making the debate unresolvable by empirical data alone, as the choice of boundary inherently reflects value judgments and theoretical commitments about the concept's core meaning and significance. While empirical facts exist *within* a fixed boundary, fixing the boundary itself is the contested and value-laden step that precedes and determines the empirical answer. It is endemic to trend claims about thick ethical concepts and other socially constructed aggregates where definitions are inherently fluid and contested.
