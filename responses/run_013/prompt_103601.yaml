  For binding future players: your rule succeeds. It imposes stricter amendment requirements (unanimous consent of all current and future players) and voids conflicting future actions. Since it is immutable, it prevails over the initial mutable rules (including Rule (1)) under Rule (4). Future players are bound by this immutable rule unless amended per its own terms, as the ruleset now includes its provisions.  

