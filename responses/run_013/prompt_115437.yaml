          - Relative: Affordance view [Awkward: Must allow that the same function can always be achieved with a redesigned artifact having different political biases, which may not be true for all artifacts.]

  Branch B (not primarily in material form):
     Q2: Is the politics located solely in how the artifact is used? 
          - Yes: Instrumentalism [Awkward: Must deny that design features like a low bridge have any political meaning until used, even if designed for exclusion.]
          - No: Go to Q3

     Q3: Is the political effect located in the whole sociotechnical assemblage (inseparable) or in the wider sociotechnical system (with the artifact as a distinct part)? 
          - Whole assemblage: Assemblage view [Awkward: The same artifact (e.g., a gun) has no stable politics; it depends on the whole assemblage (e.g., in a police station vs. a crime scene).]
          - Wider system: Go to Q4

     Q4: Is the political character settled during the artifact's development by social negotiations? 
          - Yes: Social constructivism [Awkward: After stabilization, the artifact's politics is fixed and not influenced by new contexts or uses.]
          - No: Weak technological determinism [Awkward: The system's operation drives social change, but the artifact itself could be redesigned without changing the system's effect, which may not be possible.]

  Unoccupied position: 
     - In Branch B, after answering "Wider system" at Q3 and then at Q4, if one answers neither "yes" (social constructivism) nor "no" (weak determinism), there is no leaf. But we have only these two options. We can imagine a view that the system's politics is static and inherent, but not settled in development and not driving change in operation. This combination is unoccupied. Reason: It is likely incoherent because a system's politics must come from somewhere (design or operation), or unexplored.

  Additionally, note that in Branch A, we did not have a leaf for a view that the artifact has politics in its form, does not determine, and the effect is intended but not delegated (like the designer intended but not by encoding rules). But we might consider that as delegation. So it is covered.

  Cases:

  - Low overpasses: The tree's classification depends on contested facts about intent. If the low height was intended to exclude buses, then it might be delegation (if we think the effect is in the material form and intended). But if unintended, it could be affordance or inherent. Without knowing intent, we cannot traverse the tree unambiguously.

  - Tomato harvester: Was the displacement of workers an intended or unintended consequence? If unintended, then in Branch A, independent of intentions, and then we ask if the same function (harvesting tomatoes) could be achieved without displacing workers? If yes, then affordance; if no, then inherently political.

  - Voting system: The built-in categories encode prior decisions. This is likely delegation (intended) or social constructivism (if settled by negotiations during development). Depending on the view.

  - Seat belt: Instrumentalism would say the politics is only in use (if used, saves lives; if not, doesn't). But if we think the design of the seat belt (e.g., its comfort) influences usage, then it might be affordance.

  Finally, the largest revision: If we accept that the material form and the system are inseparable, then we would start with a different root, perhaps asking about the assemblage from the beginning.

  Mistakes:
  1. The placement of weak technological determinism under the system branch might be contested. Weak determinism is typically about the artifact, not the system. We might have mislabeled it. Instead, we could have had a separate branch for artifact-driven-but-not-determining, but we put that in affordance.
  2. The distinction between intrinsic and relative (Q4 in Branch A) might collapse: making an option cheaper can be seen as settling the question by default. So the two leaves might not be as distinct as the tree suggests.
answer: |-
  Below is a decision tree structured to expose the logical space of the "do artifacts have politics?" debate, designed to prevent collapsing into a binary opposition. The tree starts with foundational questions that divide positions, ordered to be answerable without knowing downstream outcomes. Positions appear at the leaves, with each branch labeled by the claim or question that splits the subtree. Cases (e.g., low overpasses, tomato harvesters) are referenced where they illuminate distinctions.  

  ### **Decision Tree: Do Artifacts Have Politics?**  
  *(Branches are mutually exclusive; answer left-to-right)*  

  #### **Level 1: Root Question**  
  **Q1: Does the artifact's *material form* (e.g., physical design, code) generate political effects independently of human intent?**  
  - *If YES → Go to Level 2A (Artifact-centric effects)*  
  - *If NO → Go to Level 2B (Beyond material form)*  

  ---

  #### **Level 2A: Artifact-centric effects (Material form has independent power)**  
  **Q2A: Does the artifact *determine* social outcomes, or merely *bias* them?**  
  - *If DETERMINES (outcomes inevitable given the artifact) → Go to Level 3A*  
  - *If BIASES (outcomes probable but avoidable) → Go to Level 3B*  

  #### **Level 2B: Beyond material form (Politics resides elsewhere)**  
  **Q2B: Is the politics located *only in human use*, or in the *sociotechnical system* (e.g., infrastructure, standards, ownership)?**  
  - *If ONLY IN USE → Instrumentalism (Leaf 1)*  
  - *If SOCIOTECHNICAL SYSTEM → Go to Level 3C*  

  ---

  #### **Level 3A: Artifact determines outcomes**  
  **Q3A: Is the political effect *intrinsic* (settles a contested question) or *extrinsic* (merely enables efficiency)?**  
  - *If INTRINSIC → Strong technological determinism (Leaf 2)*  
  - *If EXTRINSIC → Unnamed: Functional inevitability (Leaf 3)*  

  #### **Level 3B: Artifact biases outcomes**  
  **Q3B: Is the bias *independent of designers' intentions*?**  
  - *If YES → Affordance/design-based view (Leaf 4)*  
  - *If NO → Delegation to artifacts (Leaf 5)*  

  #### **Level 3C: Politics in sociotechnical system**  
  **Q3C: Is the artifact's political character *settled during development* (e.g., by negotiations) or in *ongoing operation*?**  
  - *If SETTLED DURING DEVELOPMENT → Social constructivism (Leaf 6)*  
  - *If ONGOING OPERATION → Go to Level 4*  

  ---

  #### **Level 4: Politics in system operation**  
  **Q4: Does the system *require* a specific social arrangement, or is it *contingent*?**  
  - *If REQUIRES → Inherently political technologies (Leaf 7)*  
  - *If CONTINGENT → Assemblage view (Leaf 8)*  

  ---

  ### **Leaves (Positions)**  
  1. **Instrumentalism**  
     - *Politics resides solely in use* (e.g., seat belts save lives only if used).  
     - **Awkward commitment**: A low bridge designed to exclude buses has no politics until someone drives a bus beneath it.  
  2. **Strong technological determinism**  
     - *Artifacts autonomously drive inevitable social change* (e.g., factory robots *cause* job loss).  
     - **Awkward commitment**: The tomato harvester *must* displace workers, regardless of labor laws or subsidies.  
  3. **Unnamed: Functional inevitability**  
     - *Artifacts determine outcomes extrinsically by optimizing efficiency, not values* (e.g., credit algorithms demand standardized data).  
     - **Awkward commitment**: No technology can achieve efficiency without oppressive standardization (unoccupied, see note).  
  4. **Affordance/design-based view**  
     - *Artifacts bias behavior via design but don’t determine outcomes* (e.g., voting machines favor two-party systems).  
     - **Awkward commitment**: Biases can always be subverted (e.g., low overpasses hacked by removing bus roofs).  
  5. **Delegation to artifacts**  
     - *Artifacts enforce rules as "quasi-agents" of designers* (e.g., low overpasses encode racial exclusion).  
     - **Awkward commitment**: All effects are traceable to intentional design (ignores maintenance failures).  
  6. **Social constructivism**  
     - *Politics is fixed by social negotiations before stabilization* (e.g., credit score categories reflect elite bargaining).  
     - **Awkward commitment**: An artifact’s politics cannot change post-adoption (e.g., repurposed military tech).  
  7. **Inherently political technologies**  
     - *Some systems require specific social orders* (e.g., nuclear power demands authoritarian control).  
     - **Awkward commitment**: No alternative designs exist (e.g., decentralized solar invalidates nuclear’s "requirement").  
  8. **Assemblage view**  
     - *Only dynamic wholes (artifact + systems + use) have politics* (e.g., tomato harvesters + labor markets + trade policies).  
     - **Awkward commitment**: The same artifact has no stable politics (e.g., a gun’s meaning shifts with context).  

  ---

  ### **Annotations**  
  - **Unoccupied position**: Leaf 3 ("Functional inevitability") is unattractive and unexplored. It accepts determinism but denies intrinsic politics, implying efficiency is apolitical—yet efficiency always privileges some groups (e.g., tomato harvesters benefit agribusiness, not small farmers).  
  - **Indistinguishable positions**:  
    - *Strong determinism (Leaf 2)* and *inherently political technologies (Leaf 7)* both answer Q1→YES, Q2A→DETERMINES, but diverge on *why*. Strong determinism sees politics in causal power (e.g., "cars cause suburbs"), while inherent politics sees necessity (e.g., "cars *require* highways"). They collapse if "cause" and "require" are conflated.  
  - **Case-dependent ambiguity**:  
    - Low overpasses: If historical intent is contested (e.g., "cost-saving vs. exclusion"), the tree diverges. Proved intent → *Delegation (Leaf 5)*; unintended → *Affordance (Leaf 4)*.  
  - **Critical revision**: Accepting that *all artifacts are inseparable from systems* (rejecting Q1) collapses Branch 2A (artifacts never act alone). This forces merging of artifact-centric views (e.g., affordance, delegation) into assemblage or constructivism.  
  - **Weaknesses**:  
    1. **Delegation vs. affordance**: The tree assumes intent is binary (Q3B), but artifacts often mix intended/unintended effects (e.g., tomato harvesters intended to cut costs but unintendedly displaced workers).  
    2. **Social constructivism**: Positioned in system branch, but some argue negotiations *include* material form (blurs Q1).  
    3. **Weak technological determinism**: Omitted for brevity (folds into affordance view: biases can be strong).  

  **Total leaves**: 8 (within target).  
  **Key takeaway**: The tree forces distinctions between *location* (material, system, use), *causality* (determines, biases, co-produced), and *necessity* (intrinsic, contingent)—revealing nuances flattened in the "determinism vs. construction" binary.
