prompt: |-
  I'm building a case-study section for a reading group on epistemic game theory and I'd rather you write the analysis than me, since I keep sliding into the textbook version. The episode is the run on Northern Rock in September 2007 — the first run on a British bank in a century and a half, and a good one for this because it happened in public and in about four days.

  Here's the whole story, so we dont have to argue about facts: the bank had grown fast by borrowing short in the wholesale markets and lending long on mortgages; those markets seized up in August 2007; it went to the Bank of England for a liquidity facility; the BBC got the story and ran it on the evening of Thursday 13 September; by Friday morning there were queues outside branches; the queues were on every front page and every news bulletin, so by Friday afternoon everyone could see everyone else queuing; and the Chancellor announced a guarantee of existing deposits the following Monday, which stopped it. That's all I need from you on the history — don't go looking for more, and don't give me a bibliography.

  What I want is the case run through the machinery. Two things I want kept apart, because I think the standard telling fudges them: (1) common knowledge of the payoffs, or of the bank's soundness — everyone knows, everyone knows everyone knows, and so on up the hierarchy; and (2) common knowledge of rationality, in the sense the backward-induction literature cares about — everyone knows everyone is rational, everyone knows everyone knows it, and so on. Say what each of those is actually doing in a bank-run story, and whether the run even needs the second one at all, or whether plain best-response-to-beliefs gets you there without it.

  Then the piece of kit I want you to introduce and explain as you go, because I don't want to assume the reader already has it: almost common knowledge, i.e. common p-belief — each depositor assigns at least probability p to the run happening, at least p to every other depositor assigning at least p, and so on up the hierarchy. The point of the notion, and this is the bit I find interesting, is that you can be arbitrarily close to common knowledge and still lose the coordination equilibrium. Use it. What does it predict about the threshold at which queuing becomes self-sustaining, and does the Thursday broadcast plus the Friday queue actually map onto it?

  Then the part I really care about: where the theory breaks. Things I want taken seriously — a lot of the money left by phone and over the internet rather than through the doors, so why did the visible queue matter so much more than the headline; deposit protection at the time was only partial, so was the run irrational, or was it a correct response to a genuinely uncertain guarantee; the lender-of-last-resort facility was itself public knowledge and that arguably made things worse rather than better; and the run made the bank's position worse, so the belief that the bank was in trouble became partly true as a result of people acting on it — a reflexive loop the standard two-equilibrium story doesn't have a slot for. Also, why that bank and not the ones in comparable trouble — does anything in the machinery do the work of salience, or is that simply outside it?

  Finish by running it back the other way: does the episode confirm the coordination account, is it an anomaly the account has to swallow (an insured run, a run in a system with a central bank), or is it a case the theory never anticipated? And say plainly where the theory is silent rather than making it speak. I'd much rather have an honest gap than a forced fit.
reasoning: |-
  We are analyzing the Northern Rock bank run of September 2007 through the lens of epistemic game theory. We will break down the analysis into the following parts:

  1. **Common knowledge of payoffs (or bank soundness)**: 
     - This refers to the idea that every depositor knows the bank's fundamental state (solvent or insolvent), and this knowledge is common (everyone knows, everyone knows everyone knows, etc.). 
     - In a bank-run model, if there is common knowledge that the bank is fundamentally sound, then in a coordination game with multiple equilibria (no-run and run), the no-run equilibrium should be selected if we also assume common knowledge of rationality (as per standard backward induction in a complete information setting). However, without common knowledge of the bank's soundness, even a fundamentally sound bank might face a run.

  2. **Common knowledge of rationality**:
     - This means that every depositor is rational (i.e., maximizes their expected payoff given their beliefs) and this is common knowledge. 
     - The standard backward-induction argument in a complete information coordination game (like the bank-run game) with common knowledge of rationality and payoffs would lead to the no-run equilibrium if the bank is sound. However, if common knowledge of the bank's soundness is absent, then even with common knowledge of rationality, a run might occur.

  3. **The role of almost common knowledge (common p-belief)**:
     - We introduce the concept of common p-belief: each depositor assigns at least probability p to the event of a run, at least p to every other depositor assigning at least p, and so on. 
     - The key insight is that when p is high but less than 1 (so almost common knowledge of the run), the no-run equilibrium can collapse. In fact, for p above a certain threshold, the run becomes the only equilibrium.

  4. **Applying the model to Northern Rock**:
     - We map the events (Thursday BBC broadcast, Friday queues) to the formation of common p-belief. The broadcast started the process by making the bank's troubles public. The Friday queues then provided a public signal that others were running, which likely increased p for many depositors to a level above the threshold required for a run to be the dominant strategy.

  5. **Where the theory breaks**:
     - We address the anomalies: 
       a. Withdrawals by phone/internet vs. physical queues: why did the visible queue matter?
       b. Partial deposit insurance: was the run irrational?
       c. The public announcement of the liquidity facility: did it backfire?
       d. Reflexivity: the run worsened the bank's position.
       e. Why Northern Rock and not others? (salience)

  6. **Conclusion**: 
     - Does the episode confirm the coordination account? Is it an anomaly? Where is the theory silent?

  Let's proceed step by step.

  ### 1. Common Knowledge of Payoffs and Rationality

  In the standard bank-run model (like Diamond-Dybvig), there are two equilibria: 
  - The good equilibrium: only those with immediate liquidity needs withdraw.
  - The bad equilibrium (run): everyone runs, forcing the bank to liquidate assets at a loss, making the run self-fulfilling.

  **Common knowledge of payoffs** (the bank's soundness) is critical. If it is common knowledge that the bank is fundamentally sound (i.e., can meet all withdrawals if only the impatient withdraw), then the no-run equilibrium is sustainable. However, if there is any doubt (i.e., not common knowledge), then a run can occur.

  **Common knowledge of rationality** is also typically assumed. This means that every depositor knows that others are rational and will run if they believe it is in their best interest. The backward-induction argument in a complete information game would require common knowledge of both payoffs and rationality to select the no-run equilibrium. 

  But note: the run can occur without common knowledge of rationality. If depositors are best-responding to their beliefs (which may be formed under incomplete information), then a run can happen even if rationality is not common knowledge. The key is that each depositor, acting rationally, may run if they believe enough others will run. The common knowledge of rationality is not strictly necessary for a run to occur; it is the structure of beliefs about others' actions (and the bank's state) that matters.

  In Northern Rock, the bank was initially solvent (as per the subsequent government bailout). However, the fact that the wholesale markets had seized up was not common knowledge until the BBC broadcast. After the broadcast, the troubles became public, but the bank's fundamental state (solvent or not) was not common knowledge because the public did not have full information on the bank's books. 

  Moreover, the run did not require common knowledge of rationality. It only required that depositors believed that others might run (which the broadcast and then the queues made evident) and that running was a best response to that belief.

  ### 2. Almost Common Knowledge (Common p-Belief)

  The concept of common p-belief (Monderer and Samet, 1989) is used to model situations that are "almost" common knowledge. 

  - An event E is common p-belief if:
    1. Every depositor assigns at least probability p to E.
    2. Every depositor assigns at least p to every other depositor assigning at least p to E.
    3. And so on for every finite level.

  In the bank-run context, E could be the event that "a run is occurring" or "the bank is in trouble".

  The critical point is that even if p is very high (say 0.99), if it is not common 1-belief (i.e., common knowledge), then the outcome can be very different. In particular, for a bank-run game, there exists a threshold p* such that if the event "the bank is insolvent" (or "a run is happening") is common p-belief for p > p*, then the run is the unique equilibrium. If p < p*, then the no-run equilibrium is possible.

  In Northern Rock:

  - The BBC broadcast on Thursday evening made the bank's troubles public. This started the formation of common p-belief. After the broadcast, each depositor knew that others had heard the news (since it was on the BBC) and thus assigned a high probability that others knew. However, it might not have been common knowledge because some might have doubted that others had heard or believed the news.

  - The physical queues on Friday morning were a public signal. Seeing the queues (and then the news coverage of the queues) made it common p-belief with a very high p. The queues provided a clear, visible signal that others were running. This likely pushed p above the threshold p* for many depositors, making the run self-sustaining.

  The threshold p* depends on the specific payoffs. In a typical model, p* is determined by the cost of running (e.g., time spent queuing) versus the benefit of avoiding a loss if the bank fails. In Northern Rock, the deposit insurance was only partial (up to £2000 fully covered and then 90% up to £35,000), so the cost of not running if the bank failed was high for deposits above the insured amount. This would lower the threshold p* (i.e., even a moderate belief that others might run could make running rational). 

  ### 3. Where the Theory Breaks

  a. **Withdrawals by phone/internet vs. physical queues**:
     - The theory of common p-belief emphasizes public signals. The physical queues were a public signal because they were visible and then broadcast. This made the run common p-belief. Withdrawals by phone or internet, while substantial, were private and not observable. Thus, they did not contribute to the common p-belief. Without the queues, the run might not have escalated because depositors would not have known the extent of others' withdrawals.

  b. **Partial deposit insurance**:
     - At the time, deposit insurance was only partial. This means that even if the bank was fundamentally sound, if a run forced it to liquidate at a loss, depositors might not get their full money back. Therefore, running was a rational response for those with large deposits. The theory accounts for this: the payoff structure (including the insurance) is part of the game. The run was not irrational; it was a best response to the belief that others were running and the bank might fail, especially for uninsured deposits.

  c. **Public announcement of the liquidity facility**:
     - The Bank of England's announcement of the liquidity facility was intended to reassure. However, it publicly revealed that Northern Rock was in trouble. This made the bank's distress common knowledge (or at least common p-belief with high p) and might have triggered the run. The theory of coordination games can account for this: the announcement was a public signal that increased p. However, the standard model might not have a built-in mechanism for how the provision of a liquidity facility (which should help) can backfire by revealing negative information. This is a gap: the signaling effect of a LOLR announcement.

  d. **Reflexivity**:
     - The run itself worsened the bank's position. In the standard Diamond-Dybvig model, the run is self-fulfilling because the bank must liquidate long-term assets at a loss. This is built into the model. However, the model assumes that the bank's fundamental state (if no run) is fixed. In reality, the run might have turned a liquidity problem into a solvency problem. The standard model does not have a dynamic where the run causes the insolvency (it only causes the liquidation losses). But in this case, the run might have made the bank insolvent by destroying its reputation and business model. This is an extension: the game might be better modeled as one with endogenous fundamentals.

  e. **Why Northern Rock and not others?**:
     - The theory of coordination games does not inherently explain salience (why one bank over another). Salience is often explained by focal points (Schelling). The BBC broadcast made Northern Rock the focal point. The theory of common p-belief requires a public signal to coordinate on. The broadcast provided that signal for Northern Rock but not for other banks. The theory does not predict which bank becomes salient; it only explains how, once a bank is salient and a public signal occurs, a run can follow.

  ### 4. Conclusion: Does the Episode Confirm the Theory?

  The Northern Rock run largely fits the coordination-based account of bank runs. The episode illustrates:

  - The role of common p-belief: The BBC broadcast and then the queues created common p-belief of the bank's distress and the run, leading to a coordination failure.
  - The run was rational for depositors given the partial insurance and the belief that others were running.

  However, there are anomalies:

  - **Insured run**: Even though there was partial insurance, the run occurred. This is not a problem for the theory because the insurance was partial and the run was rational for those with large deposits. Moreover, the guarantee announced on Monday (full insurance) stopped the run, which aligns with the theory.

  - **Run in a system with a central bank**: The theory does not preclude a run even with a central bank. The LOLR facility was announced, but the announcement itself served as a negative signal. The theory does not explicitly model the signaling effect of LOLR announcements.

  - **Reflexivity**: The run made the bank's position worse. The standard model has self-fulfilling runs via liquidation, but it does not account for the reputational damage and the impact on the bank's long-term viability. This is an extension.

  - **Salience**: The theory does not explain why Northern Rock was targeted and not others. This is outside the standard coordination model and requires a theory of focal points.

  In summary, the episode is largely consistent with the coordination account but highlights some gaps:

  1. The signaling effect of LOLR announcements (which can trigger runs).
  2. The role of public signals (like queues) in creating common p-belief.
  3. The need to model reflexivity beyond liquidation losses (reputational effects).
  4. The explanation of salience (why a particular bank becomes the focal point of a run).

  The theory is silent on how salience is formed and on the dynamic feedback from the run to the bank's fundamental solvency beyond the immediate liquidation. These gaps do not invalidate the model but suggest areas for extension.

  Thus, the Northern Rock run is a case that the theory anticipated in its broad strokes (coordination failure due to common p-belief) but also one that reveals nuances (signaling, reflexivity, salience) that the standard model does not fully capture.
answer: |-
  Below is a case-study analysis of the Northern Rock bank run (September 2007) through the lens of epistemic game theory. I'll address your requirements systematically, separating the roles of common knowledge of payoffs, common knowledge of rationality, and the concept of *common p-belief*. I'll explicitly highlight where the theory struggles with real-world anomalies and where it remains silent. The goal is an honest fit—no forced conclusions.

  ---

  ### **1. Core Machinery: Common Knowledge vs. Rationality**
  #### **a) Common Knowledge of Payoffs (Bank Soundness)**  
  In bank-run models (e.g., Diamond-Dybvig), common knowledge of payoffs means:  
  - **Everyone knows the bank is solvent** (i.e., if only impatient depositors withdraw, the bank survives).  
  - **Everyone knows everyone knows this**, ad infinitum.  

  In Northern Rock:  
  - The bank *was* solvent pre-run (confirmed by later bailouts), but this was **not common knowledge**. Wholesale market seizures created doubt, and the BBC broadcast made this doubt *public* but **not universal**. Depositors knew the bank was struggling, but crucially, they didn’t know if *others* knew or how *others* would act. Without common knowledge of solvency, the "no-run" equilibrium is fragile.  

  #### **b) Common Knowledge of Rationality (CKR)**  
  CKR implies:  
  - **Everyone is rational** (i.e., acts to maximize their payoff).  
  - **Everyone knows everyone is rational**, and so on.  

  In backward-induction models (e.g., global games), CKR ensures depositors coordinate on the "best" equilibrium if payoffs are common knowledge. But Northern Rock shows:  
  - **CKR is unnecessary for the run**. Depositors need only **best-respond to beliefs** about others’ actions. If Alice believes others will run, running is rational *regardless* of whether she believes others are rational. The physical queues provided direct evidence of others’ actions—no higher-order beliefs needed.  
  - **Verdict**: The run was driven by best-response logic (beliefs about others’ behavior), not CKR. CKR’s role is overstated in textbook models; real-world runs can emerge from first-order beliefs alone.  

  ---

  ### **2. Introducing Common p-Belief (Almost Common Knowledge)**  
  #### **a) The Concept**  
  - **Common p-belief**: Each depositor assigns *at least probability p* to the event "a run will occur," *at least p* to others assigning *at least p*, and so on up the hierarchy. It’s "almost" common knowledge when *p* is high but <1.  
  - **Key insight**: Even if *p* = 0.99 (arbitrarily close to certainty), the **no-run equilibrium can collapse** if *p* exceeds a critical threshold *p\**. Below *p\**, coordination on "no run" is possible; above it, the run becomes the only rational response.  

  #### **b) Mapping to Northern Rock**  
  - **Thursday (BBC broadcast)**: Created **moderate p-belief**. Depositors learned the bank was in trouble, but not how *others* would react. *p* was likely < *p\*** (threshold for run dominance).  
  - **Friday (queues + media coverage)**: Generated **high p-belief**. Seeing queues made it common knowledge that others saw queues—escalating *p* rapidly.  
    - **Why queues mattered more than internet withdrawals**: Physical queues were a **public signal**, making it easy to verify others’ actions. Internet withdrawals were private, so they couldn’t propagate higher-order beliefs ("I know you know I know..."). The queues pushed *p* above *p\***, triggering a self-sustaining run.  
  - **Threshold logic**:  
    - *p\*** depends on **payoff asymmetry**. With partial deposit insurance (£35k cap), losses from bank failure were high for large depositors. This lowered *p\***, making runs easier to trigger.  
    - The queues likely pushed *p* > *p\*** for marginal depositors, turning the run into the dominant equilibrium.  

  ---

  ### **3. Where the Theory Breaks: Anomalies**  
  #### **a) Partial Deposit Insurance & "Irrationally Rational" Runs**  
  - **Theory gap**: Standard models assume runs are irrational if deposits are insured. Northern Rock had partial insurance (only 100% for first £2k, 90% next £33k), so running was **rational for large depositors** (>£35k).  
  - **Reality**: Even small depositors ran. Why?  
    - **Uncertainty about the guarantee**: The Chancellor’s guarantee came *after* the run started. Pre-guarantee, depositors couldn’t be sure if insurance would be honored (historical precedent was weak).  
    - **Verdict**: The run was rational under **Knightian uncertainty** (unquantifiable risk). The theory assumes known payoffs; it breaks when real-world uncertainty dominates.  

  #### **b) Lender-of-Last-Resort (LOLR) Backfiring**  
  - **Theory**: LOLR facilities should *prevent* runs by assuring liquidity.  
  - **Reality**: Announcing Northern Rock needed LOLR support **signaled weakness**, amplifying doubts.  
  - **Why?**: The announcement created **common p-belief of fragility**. Depositors updated: "If the BoE is intervening, things are bad." This isn’t captured in standard models, where LOLR is treated as a non-strategic backstop.  

  #### **c) Reflexivity: The Run Worsened the Bank**  
  - **Theory gap**: Bank-run models have two equilibria (run/no run), but fundamentals are static. Northern Rock’s run **altered fundamentals**:  
    - Retail withdrawals drained liquidity.  
    - Wholesale lenders refused rollovers.  
    - Share prices collapsed, eroding capital.  
  - **Result**: A **self-fulfilling prophecy** where the run *created* insolvency. Epistemic game theory lacks tools for dynamic feedback loops.  

  #### **d) Why Northern Rock? The Salience Problem**  
  - **Theory silence**: Models don’t explain why *this* bank faced a run when others (e.g., HBOS) had similar exposure.  
  - **Reality**: The BBC broadcast made Northern Rock **salient**—a focal point for coordination. Salience isn’t modeled in epistemic game theory; it’s borrowed from Schelling (1960).  
  - **Verdict**: The machinery can’t predict which bank becomes salient; it only explains coordination *once salience exists*.  

  ---

  ### **4. Conclusion: Does the Episode Validate the Theory?**  
  - **Confirms**:  
    - The run was a **coordination failure** driven by common p-belief. The queues provided a public signal that pushed *p* above the critical threshold.  
    - **Best-response logic** (not CKR) was sufficient to explain behavior.  
  - **Anomalies**:  
    - **Insured run**: Partial insurance should’ve dampened the run but didn’t—due to uncertainty about guarantees.  
    - **LOLR backfire**: Public liquidity requests can *trigger* runs by signaling weakness.  
    - **Reflexivity**: The run itself degraded fundamentals, a dynamic not captured in static models.  
  - **Gaps in the theory**:  
    1. **Salience**: No mechanism to explain why Northern Rock was targeted.  
    2. **Dynamic fundamentals**: The theory treats bank health as exogenous, not endogenous to beliefs.  
    3. **Uncertainty vs. risk**: Models assume known probabilities; real actors face ambiguity (e.g., "Will the government honor insurance?").  
  - **Verdict**: Northern Rock is **both a confirmation and an anomaly**. It validates the coordination logic of epistemic game theory but exposes its limits in handling:  
    - Public signals that alter fundamentals (LOLR announcements),  
    - Knightian uncertainty,  
    - Endogenous salience.  
    The theory is **silent** on how focal points emerge and how beliefs reshape reality. Forcing it to explain these would be dishonest; they require complementary frameworks (e.g., behavioral game theory or network effects).  

  This case doesn’t break the machinery—it shows where you need to add new tools.  

  ---  
  **Final note**: The Northern Rock run is a masterclass in how **public information** (BBC, queues) transforms private doubts into common p-belief, but also how real-world messiness—partial insurance, political uncertainty, reflexivity—defies clean modeling. The theory explains the coordination; the anomalies explain why we still need case studies.
