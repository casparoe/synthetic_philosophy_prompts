prompt: |-
  I host a small decision theory podcast — credences, imprecise probability, that sort of thing — and next week's guest has spent about ten years defending imprecise probabilities. Her line, roughly: rational credal states are often genuinely imprecise rather than vague-but-secretly-precise; the right decision rule for an imprecise agent is maximality, not maximin; dilation is a feature and not a bug; and (her new book's slogan) an imprecise agent is never rationally worse off for learning something. The book also draws a distinction I haven't seen anywhere else: "evidential imprecision," where the evidence itself fails to pin down a unique distribution, versus "resolution imprecision," where the evidence does determine a distribution but the agent hasn't done the work of resolving it — and she's pretty insistant that both count as rational states for someone to be in.

  Draft me eight to ten interview questions. I want them aimed at the machinery, not at "so what is imprecise probability." Specifically: at least one has to be about dilation — the standard case where learning that two coins landed the same way widens your interval for the first coin — with a follow-up for the answer she's definately going to give, which is that the wider interval is right and our pre-theoretic intuition is the thing that's broken. At least one has to be about maximality, since it lets you pick anything that isn't dominated; press on whether that makes "rational" too cheap, and have the follow-up ready for when she retreats to "the agent can adopt a plan." I also want one that puts the "never worse off for learning" slogan up against the usual complaint that imprecise agents can be information-averse, and one that makes her say what resolution imprecision buys her that precise second-order uncertainty couldn't — including what happens when somebody in that state gets offered a bet. Work in something about the diachronic betting / sure-loss arguments, and something about whether her view can really distinguish suspending judgment from having a middling credence. If she's the type to keep saying "that's a feature, not a bug," I want the sequence to make that harder to keep saying. Order them the way I'd actually ask them, follow-up right under each question. American English, please.
reasoning: |-
  Okay, the user hosts a decision theory podcast and is preparing for an interview with a guest who's a long-time defender of imprecise probabilities. The guest has a new book with distinctive positions: evidential vs. resolution imprecision, maximality as the right decision rule, dilation as a feature, and the strong claim that learning never makes an imprecise agent worse off. 

  The user wants technically sharp questions targeting specific pain points in the guest's framework. They're clearly deeply familiar with the literature and want to avoid softball "what is imprecise prob" territory. There's an adversarial edge here—they want follow-ups that prevent the guest from retreating to "feature not bug" deflections. 

  Hmm, the dilation question needs special handling. The guest will definitely defend the widened interval as correct, so the follow-up must challenge whether this violates basic epistemic rationality. For maximality, the key is pressing on how "undominated" might be too weak—hence the insurance example and retreat-to-plan follow-up. 

  The evidential/resolution distinction is novel. Need to force clarity on why resolution imprecision isn't just second-order uncertainty with extra steps. The betting scenario (coin flip with ambiguous source) should expose whether this distinction does real work. 

  "Never worse off" is the boldest claim. Must confront it with Elga's info-aversion cases. The follow-up about practical vs. epistemic rationality could corner the guest if they try to dodge. 

  Synchronic sure-loss arguments are well-trodden, but diachronic loss is juicier—especially if we frame it as the guest's rules forcing irrational choices. And the suspension vs. middling credence question needs concrete stakes (betting or assertion) to avoid handwaving. 

  Structure matters: opening with dilation sets a confrontational tone, maximality next piles on decision-theoretic pressure, then the learning claim and imprecision types soften slightly before hitting diachronic bets and suspension judgment to close. Each follow-up is a scalpel—no letting wiggle room.
answer: |-
  Here are eight interview questions designed to engage your guest deeply on the machinery of her view, incorporating your specific requests and ordering them for a logical flow that builds pressure on key claims. Follow-ups are indented.

  1.  **Dilation as Feature:** You argue that dilation – like the classic case where learning two coins landed the same way *widens* your interval for the first coin – is a rational response, not a bug. Could you walk us through why the *wider* interval is actually epistemically correct in that case, and specifically, why our intuition that learning they landed the same way *should* tell us something useful about each coin individually is mistaken?
      *   *Follow-up: Doesn't this suggest that imprecise probabilities can sometimes make an agent *less* informed or *more* uncertain about a specific proposition *after* receiving seemingly relevant evidence? How is that compatible with the goal of an epistemic state tracking the evidence?*

  2.  **Maximality & Rationality "Cheap"?** Your preferred decision rule for imprecise agents is maximality: choose any option not strongly dominated. Critics argue this makes "rationality" too cheap, allowing choices that seem intuitively reckless or overly cautious within the same set of permissible options. For example, an agent with a very wide interval for rain might permissibly choose *either* a cheap umbrella *or* an expensive raincoat under maximality. How do you respond to the charge that maximality fails to capture substantive rationality?
      *   *Follow-up: You've suggested agents can "adopt a plan" to narrow choices. But doesn't this effectively push the core normative work *outside* the imprecise credal state and decision rule itself, onto some other (precise?) commitment? What justifies the agent in adopting *that specific plan* if maximality alone doesn't guide them?*

  3.  **"Never Worse Off" vs. Information Aversion:** Your book's slogan is "an imprecise agent is never rationally worse off for learning something." Yet, standard objections (like those inspired by Elga) show imprecise agents can be *information-averse* – rationally preferring *not* to learn cost-free information because it might force them into a dominated choice later. How do you reconcile your slogan with these cases of rational information aversion?
      *   *Follow-up: If the agent rationally avoids learning something *because* learning it would put them in a position where they might make a dominated choice later, isn't there a clear sense in which they *are* rationally worse off *if* they *do* learn it? Doesn't the aversion itself signal potential worsening?*

  4.  **Resolution Imprecision vs. Precise Higher-Order:** You distinguish "evidential imprecision" (evidence underdetermines a unique dist.) from "resolution imprecision" (evidence *does* determine one, but the agent hasn't resolved it). What does resolution imprecision *buy* us theoretically that simply modeling an agent with a *precise* credence *about which precise distribution is correct* (i.e., precise higher-order uncertainty) cannot capture?
      *   *Follow-up: Imagine an agent in a state of resolution imprecision about a fair coin flip (they know it's fair but haven't "resolved" it into 0.5). If offered a bet on Heads at even odds *right now*, how does their permissible behavior differ from an agent with a precise 0.5 credence, or an agent with a precise credence over possible biases (e.g., 0.4-0.6)?*

  5.  **Diachronic Sure Loss & Coherence:** Critics argue imprecise probabilities open agents up to diachronic Dutch books or sure losses over time, even if they avoid synchronic books. How does your framework (combining imprecise credences with maximality and perhaps plans) guarantee diachronic coherence and avoid these arguments? Does maximality shield the agent, or do you reject the coherence standard itself in diachronic settings?

  6.  **Suspension vs. Middling Credence:** How does your view distinguish a state of genuinely *suspending judgment* about P (represented by a wide interval, say [0.2, 0.8]) from an agent who simply has a *precise but uncertain* middling credence of 0.5? What observable difference in rational behavior, belief, or assertion does this distinction make?
      *   *Follow-up: Take assertion. Would both the suspending agent (imp [0.2,0.8]) and the middling-precise agent (0.5) be equally rational in asserting "P is about as likely as not"? If not, why not? If so, doesn't that blur the distinction?*

  7.  **Evidential Imprecision & Underdetermination:** For evidential imprecision, you argue the evidence itself fails to pin down a unique distribution. What's the *threshold* for when evidence justifies a precise point versus an interval? Is it simply any case of non-degenerate statistical evidence? And how does this avoid collapsing into a demand for *logical* certainty before assigning precision?

  8.  **The "Feature, Not Bug" Defense:** Throughout your work, you frame many counterintuitive consequences of imprecise probabilities (dilation, information aversion under some rules, permissiveness under maximality) as "features, not bugs." Stepping back, is there *any* conceivable consequence or implication of your specific version of imprecise probabilism that *would* make you reconsider the framework? What would count as a genuine "bug" for you?

  **Why this order & structure:**

  1.  **Starts with Dilation:** Hits a core, counterintuitive "feature" head-on, setting the stage for challenging intuitions.
  2.  **Moves to Decision Rules:** Links the epistemology to practical rationality with maximality, pressing the "cheap rationality" angle hard.
  3.  **Challenges the Slogan:** Directly confronts the bold "never worse off" claim with the strongest objection (info aversion).
  4.  **Probes a Key Distinction:** Forces clarity on the novel evidential/resolution split, using a concrete betting scenario.
  5.  **Diachronic Coherence:** Addresses a major technical criticism (diachronic books) often leveled against imprecise views.
  6.  **Conceptual Grounding:** Tests the core distinction between imprecision and uncertainty, moving to doxastic attitudes like assertion.
  7.  **Foundations:** Pushes on the justification for evidential imprecision itself.
  8.  **Meta-Reflection:** Ends by directly challenging the "feature not bug" stance, asking for falsifiability.

  **Follow-up Strategy:** Each follow-up is designed to anticipate common defenses and push further, specifically aiming to make "feature not bug" harder to invoke glibly by demanding explanations for *why* it's a feature in that specific context or exposing potential internal tensions. The questions focus on observable consequences (behavior in bets, assertions, information-seeking) to ground the discussion. Good luck with the interview!
