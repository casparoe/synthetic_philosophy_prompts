  }
  ```

  **Critical Implementation Notes:**

  1. **Controversial Action Setup**: Plant the "Deface factory farm ad" action card visibly on the table. Quietly cue an Animal Advocate pre-game to aggressively seek this trade.
  2. **Scoring Demo**: Pre-calculate two example scores (e.g., Health Maximizer vs. Local Patriot) for the same trade to show subjective gains during debrief.
  3. **Token Economy**: Start each player with 20 chips (prevents liquidity crunch). Action costs are high (5-8 chips) to force trading necessity.
  4. **Guaranteed Conflicts**: Profile design ensures:
     - Animal Advocate will undervalue HEALTH actions
     - Health Maximizer will undervalue LOCAL actions
     - Climate Guardians/Local Patriots will reject illegal ANIMAL action

  **Why This Works**: The illegal action forces a visceral dilemma, token trading reveals hidden commensuration, and scoring discrepancies undermine impartial gains—all through experience rather than lecture. The debrief ties emergent behaviors to theory using students' own reactions as data.
