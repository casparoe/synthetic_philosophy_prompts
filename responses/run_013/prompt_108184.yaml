prompt: |-
  I'm helping a state wildlife agency redraft the definition section of an endangered-lineages bill, and they've asked me to recommend which species concept to hard-code into the statute. Rank the usual suspects (biological, morphological, phylogenetic/monophyletic, ecological, evolutionary lineage, genotypic cluster, and anything else you think deserves a slot) from best to worst for that job, one or two sentences on why each lands where it does.

  Three things about the law pull against each other, so factor them in: field officers have to make a call on the spot with a phone photo and a cheek swab, not a breeding experiment; a listing needs to survive the next twenty years of taxonomic revision without getting automatically voided every time somebody redraws a tree; and the whole point is to catch the weird cases, i.e. hybrids, ring species whose ends have finally met, lineages that traded genes sideways, and parthenogens.

  Also tell me which one you think gets a bad rap in these debates and should really rank higher than its reputation suggests.
reasoning: |-
  Okay, the user is helping a state wildlife agency with an endangered species bill and needs to rank species concepts for legal use. They mentioned three key constraints: field officers need quick decisions with photos and cheek swabs, the definition must withstand taxonomic changes over 20 years, and it should cover edge cases like hybrids or ring species.

  First, I recall the common species concepts: Biological, Morphological, Phylogenetic, Ecological, Evolutionary Lineage, Genotypic Cluster. Each has pros and cons. The legal context means practicality and stability are crucial. Field officers can't do breeding experiments, so concepts requiring those are out. Taxonomic revisions shouldn't void listings, so tree-based concepts might be risky.

  The user wants to protect weird cases: hybrids, ring species, horizontal gene transfer, parthenogens. Biological Species Concept (BSC) fails here because it relies on interbreeding. Morphological is easy for field ID but subjective and misses cryptic species. Phylogenetic is precise but changes with new data, risking legal stability. 

  Evolutionary Lineage seems best because it focuses on independent evolution, accommodating non-standard cases and avoiding taxonomic instability. Genotypic Cluster could work with DNA data from cheek swabs, practical for field use. Ecological might handle niche-based distinctions but could be too fluid. 

  Considering the bad rap, Morphological is often criticized as outdated but its practicality for quick field ID is underrated. It's accessible and avoids lab dependency. 

  Ranking: Evolutionary Lineage first for flexibility and stability. Genotypic Cluster second for DNA practicality. Ecological third for niche focus but vague. Morphological fourth for field use despite flaws. Phylogenetic fifth due to instability. Biological last for excluding key cases. 

  Highlighting Morphological's underestimated value makes sense. It's not perfect but suits immediate field needs when combined with other data. The recommendation balances legal durability, field practicality, and edge case coverage.
answer: |-
  Based on your constraints (field practicality, taxonomic stability over 20+ years, coverage of edge cases), here's the ranking of species concepts for codifying "species" in endangered *lineage* legislation, from best to worst:

  1.  **Evolutionary Lineage Concept (ELC):** Focuses on segments of population-level lineages evolving independently. **Why best?** It directly targets lineages (the bill's focus), accommodates hybrids/ring species/parthenogens as valid lineages if evolving independently, and isn't automatically voided by minor tree tweaks or gene flow – it asks *"Is this a distinct evolutionary trajectory?"* **Stability:** High (focuses on process, not snapshot classification).
  2.  **Genotypic Cluster Concept (GCC):** Defines species as distinct clusters of genotypes with few intermediates. **Why?** Highly practical for field officers using cheek swabs (DNA barcoding/SNP chips), objectively identifies clusters even in complex cases (hybrids, recent divergence), and doesn't rely on interbreeding or niche. **Stability:** Moderate-High (clusters persist despite taxonomic opinions).
  3.  **Ecological Species Concept (ESC):** Defines species by occupying a unique adaptive zone/niche. **Why?** Captures lineages diverging ecologically (key for conservation), applicable to asexuals and some hybrids if niche-distinct. **Stability:** Moderate (niches can be fluid, assessment can be subjective).
  4.  **Morphological Species Concept (MSC):** Defines species by measurable physical differences. **Why?** Most practical for initial field ID with photos, historically dominant. **BUT:** Poor for cryptic species, hybrids, ring species, and highly subjective/vulnerable to revision.
  5.  **Phylogenetic Species Concept (PSC - Monophyletic):** Defines species as the smallest monophyletic group of common ancestry. **Why?** Precise and theoretically sound. **BUT Worst for your needs:** Highly vulnerable to taxonomic revision (new data constantly redraws trees), often splits taxa excessively, struggles practically in the field, and poorly handles hybrids/gene flow/paraphyly in ring species. **Stability:** Very Low.
  6.  **Biological Species Concept (BSC):** Defines species by reproductive isolation. **Why Worst?** Utterly fails your edge cases (hybrids, ring species, asexuals are excluded), requires impossible breeding tests for field officers, and gene flow definitions are constantly debated. **Stability:** Low-Medium (but irrelevant as it excludes key targets).

  **The Underrated Concept: Morphological Species Concept (MSC).** While flawed, its **practicality for rapid field assessment is unmatched.** It shouldn't be the *sole* definition, but its accessibility makes it crucial for *initial identification triggers*. Combined with authority to use genetic/ecological data later (as evidence a *lineage* is distinct per ELC/GCC), it provides the vital first step for officers in the field. Critics dismiss it as "old-fashioned," but for boots-on-the-ground enforcement needing a quick visual cue, it's often the only feasible starting point.

  **Recommendation for Statute Drafting:** **Hard-code the Evolutionary Lineage Concept (ELC) as the primary definition** for its stability and focus on independent evolution. Explicitly **complement it with the Genotypic Cluster Concept (GCC)** as admissible evidence readily obtained from field samples (cheek swabs). Include language empowering agencies to use morphology and ecology *as indicators* of lineage distinctness, acknowledging the MSC's field role without making it the sole criterion. Crucially, define "lineage" explicitly as a metapopulation evolving separately over time, regardless of reproductive mode or occasional gene flow. This provides the necessary legal durability, practical enforcement pathway, and coverage for the "weird cases" central to the bill's purpose.
