answer: |-
  ### Bottom Line on Residue  
  Tort doctrines map surprisingly well to core debates, exposing where philosophical claims rely on contested causal models or collective agency. The "harm" framing often obscures attenuated causation that wouldn't satisfy *but-for* tests; market-share analogies partially work but fail on defining the "market" and fungible harm. Residue arises where philosophy treats structures as agents or demands non-corrective remedies—gaps tort can't bridge without distorting its concepts.  

  ---

  ### Translations into Tort Vocabulary  

  1. **Pogge’s Structural Harm Argument**  
     *Duty*: Rich states/corporations owe a negative duty not to impose unjust systems.  
     *Breach*: Designing/upkeeping global order (trade rules, debt architecture) that foreseeably deprives the poor of essentials.  
     *Causation*: *But-for* the imposed order, harm wouldn’t occur at this scale (system as necessary condition); *proximate cause* met as harm is direct, foreseeable outcome of rules.  
     *Liability*: **Joint and several liability** for all imposing actors (states, IFIs) as their combined acts create **indivisible harm** (poverty as single injury).  
     *Remedy*: Structural injunction + restitution for unjust enrichment.  

  2. **Singer’s Failure-to-Rescue**  
     *Duty*: Positive duty to aid based on capacity to prevent severe harm at minimal cost.  
     *Breach*: Omission to provide aid when feasible.  
     *Causation*: *But-for* the omission, specific harms (e.g., famine deaths) would not occur. *Proximate cause* weak—inaction isn’t causal force; harm arises from independent forces (drought, corruption).  
     *Liability*: **Several liability only**—each state liable for its share of unremedied harm. No joint liability (omissions aren’t concerted action).  
     *Remedy*: Compensatory damages for preventable harms.  

  3. **Skeptical/Non-Enforceable Duty View**  
     *Duty*: At most imperfect political duties, not enforceable moral/legal obligations.  
     *Breach*: None—failure to aid is non-justiciable policy choice.  
     *Causation*: No *but-for* link between any rich state and specific harm; poverty is overdetermined.  
     *Liability*: **No liability**—states are non-tortfeasors. Apportionment doctrines inapplicable.  
     *Remedy*: Charity or politics, not courts.  

  ---

  ### Residue Breakdown per Position  

  **1. Pogge Translation**  
  - *Clean Fit*: Joint liability for indivisible harm captures shared responsibility; proximate cause handles systemic outcomes.  
  - *Bent*: "Imposing" the global order is framed as an *act* (like toxic discharge), not omission—downplays that "order" emerges from state choices + inaction.  
  - *No Tort Counterpart*: Treating *structures* (WTO, debt systems) as agents. Tort requires identifiable actors. "Unjust enrichment" remedy lacks precise accounting.  
  - *Residue Insight*: Tort demands *specific acts*; Pogge’s "harm" relies on collective causation tort can’t trace to *but-for* inputs.  

  **2. Singer Translation**  
  - *Clean Fit*: Duty/breach for omissions mirrors rescue cases; several liability fits distinct contributions.  
  - *Bent*: Forcing *but-for* causation onto omissions is artificial—did Singer’s *inaction* cause famine, or local corruption? Tort typically rejects causal links for non-feasance.  
  - *No Tort Counterpart*: Positive duties beyond special relationships. Tort’s "no duty to rescue" rule clashes here.  
  - *Residue Insight*: Philosophy’s "failure to rescue" masks causal vagueness—tort exposes it.  

  **3. Skeptical View Translation**  
  - *Clean Fit*: No liability without proven breach/direct causation aligns with tort’s default.  
  - *Bent*: None—skepticism fits tort’s reluctance to expand duty.  
  - *No Tort Counterpart*: Distinguishing "political" from "moral" duties—tort is binary (duty exists or not).  
  - *Residue Insight*: Philosophy’s "politics not morality" claim highlights tort’s institutional limits, not conceptual gaps.  

  ---

  ### Specific Queries Addressed  

  **1. Is "Harm" Just Causation in Disguise?**  
  Yes. Pogge’s "harm" requires proving the global order is *but-for cause* of specific deprivations—which fails against overdetermined poverty (corruption, climate). Proximate cause can stretch (foreseeability), but tort’s aversion to remote liability exposes philosophy’s causal looseness.  

  **2. Apportionment Doctrines & Their Limits**  
  - **Market-Share Liability**: *Partially* fits. Rich states could be liable *pro rata* for harms traceable to their "share" of emissions/trade harms—if harms are fungible (e.g., climate impacts).  
  - **Limits**:  
    - *Fungibility*: Poverty isn’t fungible like DES injuries—can’t pool harms.  
    - *Market Definition*: What’s the denominator? (GDP? Historic emissions?) Tort requires a defined risk pool.  
    - *Causal Link*: Market-share still requires *but-for* the *group’s* actions—hard for diffuse harms.  
  - **Joint Liability**: Fails—states aren’t acting in concert like asbestos conspirators.  

  **Verdict**: Market-share analogies work only for *specific* harms (e.g., climate) with quantifiable contributions. For systemic poverty, tort’s insistence on traceable causation reveals philosophy’s agency/causation gaps.
