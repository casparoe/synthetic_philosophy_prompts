prompt: |-
  I keep running into a puzzle when I try to judge whether someone made a mistake, and I cant tell if it has a name. Here's the shape of it. A doctor at a tiny rural clinic gives a patient a drug that later turns out to be dangerous -- the study that would have flagged it hadn't reached her yet. Everyone says she did the best she could with what she had. Fine. But it's not just that she had a wrong belief about the drug. The two situations, drug-is-safe and drug-is-harmful, were completely indistinguishable to her; from where she stood there was one situation, not two. So when I grade her choice, am I grading it against my world, where those are two separate states, or hers, where there's just one? And the verdicts come out differently: against my world she was reckless, against hers she was fine.

  Same shape with an old video game where a guard reacts to you identically whether or not you're carrying a hidden weapon, because the guard's code never tracks the weapon. Did the guard face my decision problem with worse information, or a genuinely simpler problem?

  What I'm after is a name, if one exists, for this specific thing: the disagreement isn't about what someone believes but about what counts as a distinct possibility in the first place, so the evaluator and the agent aren't even carving the world up the same way. I know the usual objective-vs-subjective-ought distinction, and the idea that you can only be blamed for what you could have known, but both of those seem to keep the set of possibilities fixed and just change what the person knows about them. Here the set of possibilities itself shrinks. Does that have a name, or a cluster of near names? And if nothing fits cleanly, can you name it and say how it differs from the objective/subjective thing and from plain ignorance? I care less about the label than about where the line falls -- when is it a false belief, and when is it a different world?
reasoning: |-
  Okay, the user is grappling with a philosophical puzzle about moral judgment in cases where an agent's epistemic state collapses distinct possible worlds into one. They've provided two clear examples: a doctor prescribing a drug without access to safety data, and a video game guard who can't detect hidden weapons. The core tension is whether we evaluate actions based on the agent's simplified reality model or the evaluator's more complex one.

  Hmm, this is fascinating because it challenges the standard subjective/objective ought distinction. The user already understands that framework but correctly points out its limitation - in traditional models, the possibility space remains fixed while knowledge varies. Here, the very ontology differs. The doctor doesn't merely lack data about two pre-existing states; her conceptual framework has no room for the distinction at all.

  The examples suggest the user might be working in ethics or game design. The video game example is particularly clever because it exposes how system design creates epistemic boundaries - the guard isn't "ignorant" of weapons in any meaningful sense; weapons simply don't exist in its decision universe. This feels adjacent to Wittgenstein's form-of-life concept, where meaning is framework-dependent.

  I recall Searle's Chinese Room thought experiment has similar epistemic isolation, but the user seems more focused on moral evaluation than consciousness. Perhaps Frankfurt's concept of "alternative possibilities" could help - if the agent couldn't have conceived of the risk, can we say they "chose" recklessly? 

  The user's frustration with existing terminology is palpable. They want to know when epistemic limitations become ontological differences. This reminds me of debates in AI ethics about "brittle" systems that fail in unmodeled scenarios. The key distinction might be whether the agent could have reasonably expanded their possibility space - but in the rural clinic case, the doctor couldn't.

  I should emphasize that this isn't just about ignorance but about inaccessibility of distinctions. The video game guard example perfectly demonstrates constitutive (rather than contingent) ignorance. Maybe "epistemically constrained agency" or "contextually bounded rationality" could work as terms, though neither is standard. 

  The deepest issue here might be about moral luck - we judge the doctor differently based on outcomes she couldn't foresee because her model couldn't represent them. Nagel's moral luck framework might actually be the closest fit, though it doesn't directly address the ontology question. 

  Ultimately the user seems to want both a conceptual label and a decision rule for when to apply which evaluation standard. The answer probably lies in whether the agent should have maintained a more complex model - but that just pushes the question back to what counts as "should have."
answer: |-
  This is a profound puzzle that cuts to the heart of moral epistemology and decision theory. You've identified a genuine gap in standard frameworks! Here's a breakdown of the concept, potential names, and how it differs:

  ### Your Core Insight: "Collapsed Epistemic State" or "Inaccessible Distinction"
  The key is that the agent operates in an **epistemically constrained world** where two objectively distinct states (drug-safe/drug-harmful; weapon-present/weapon-absent) are **causally and informationally indistinguishable**. For the agent, these states are not just unknown – they are *ontologically merged* within their accessible reality. The evaluator, possessing broader knowledge, sees a branching point the agent could not perceive.

  ### Why Standard Frameworks Don't Fully Capture It
  1.  **Objective vs. Subjective "Ought":**
      *   **Objective Ought:** "Given the *actual* state of the world (drug harmful), she shouldn't have prescribed it." (She was reckless).
      *   **Subjective Ought:** "Given her *beliefs* (drug is safe), prescribing it was correct." (She was fine).
      *   **The Gap:** Both frameworks assume the *same set of possible states* exists for both agent and evaluator. The evaluator knows which state is actual; the agent has beliefs (perhaps wrong, perhaps probabilistic) over that *same* set. Your cases involve the agent having a fundamentally *coarser-grained* state space.

  2.  **Ignorance/Mistaken Belief:**
      *   Standard ignorance implies the agent *could have known* or *should have considered* the distinction but failed to. Your doctor *couldn't* have known; the game guard *couldn't* even conceptualize the weapon state within its programmed logic. The distinction wasn't just unknown; it was inaccessible.

  ### Names and Near Neighbors
  There isn't one universally accepted term, but here are strong candidates and related concepts:

  1.  **"Epistemically Possible Worlds" Collapse:** (Best Descriptive Fit)
      *   This explicitly frames the agent as operating within a set of possible worlds *defined by their accessible information*. Worlds that are distinct in the evaluator's broader model but indistinguishable given the agent's epistemic access are *collapsed into a single "state" or "world"* in the agent's model. Your evaluation question becomes: "Do we evaluate the action relative to the agent's coarse-grained possible worlds model or the evaluator's fine-grained one?"

  2.  **"Indistinguishable States" Problem / "Coarse-Graining" of State Space:** (Decision Theory/Info Theory)
      *   This borrows from decision theory and information theory. The agent's information forces them to *coarse-grain* the state space. States that yield identical observable signals are grouped together. Evaluation depends on whether we hold the agent responsible for distinctions lost in this necessary coarse-graining.

  3.  **"Franklin's Rule" / "Ought Implies Can Know the Distinction":** (Moral Philosophy - Less Common)
      *   A stronger principle than "ought implies can" – an agent cannot be obligated to act differently based on a distinction they *could not possibly have known or perceived*. This directly addresses the core of your doctor/game guard cases.

  4.  **Near Neighbors (Important Distinctions):**
      *   **Moral Luck (Outcome Luck):** (Nagel/Williams) This is close, especially in the doctor case. The bad outcome was outside her control *given her knowledge*. However, Moral Luck often focuses on the *outcome* of an action taken under risk, while your puzzle focuses on the *fundamental structure of the decision problem itself* being different for the agent vs. evaluator.
      *   **Bounded Rationality:** (Simon) Acknowledges cognitive/informational limits but usually assumes agents still strive to act optimally *within* those limits using heuristics. Your puzzle highlights the *structural* consequence of those limits on the state space.
      *   **Requisite Variety:** (Ashby - Cybernetics) A system can only control or respond to distinctions it can make. The guard lacks the "requisite variety" to distinguish weapon/no-weapon states. His "world" inherently lacks that distinction.
      *   **Situationism (vs. Dispositionism):** (Psychology) Emphasizes how behavior is shaped by the *perceived situation*. Your puzzle pushes this further: the *definition* of the situation itself differs.

  ### Drawing the Line: False Belief vs. Different World

  *   **False Belief:** The agent *recognizes distinct possibilities* but holds an incorrect belief about which one is actual or their probabilities.
      *   *Example:* The doctor knows a *new study is pending* and believes "the drug is *probably* safe" but prescribes it anyway. She considered the harmful state, assigned it low probability, and acted. (Subjective vs. Objective applies cleanly).
  *   **Different World (Collapsed State):** The agent *lacks the conceptual or informational framework to even represent the distinction* between the two states. The states are *functionally identical* from their perspective.
      *   *Example:* Your doctor had *no signal, no pending study, no conceptual reason* to doubt the drug's safety based on *all information accessible to her position*. The "harmful" state wasn't a live option; it simply wasn't part of her decision landscape. The guard's code *lacks a variable* for "hidden weapon".

  ### Conclusion: Naming and Framing

  *   **The Core Concept:** The divergence arises because the **epistemic access of the agent necessitates a coarse-grained model of the world where distinctions objectively present are collapsed into a single indistinguishable state.**
  *   **Best Name:** **"Epistemically Indistinguishable States Problem"** or **"Collapsed State Evaluation Dilemma"**. These capture the core issue: evaluating actions when the agent's necessary state representation merges states the evaluator can distinguish.
  *   **How it Differs:** It moves beyond ignorance *within* a shared state space to a fundamental difference *in the structure of the state space itself* between agent and evaluator. The agent isn't just wrong about the world; their accessible world is ontologically simpler.
  *   **When it's a Different World:** When the distinction between the two states is **causally inert, informationally inaccessible, or conceptually unavailable** to the agent *given their position and capabilities*. They lack any mechanism (sensory, cognitive, informational access) to perceive or represent the difference. Their decision problem genuinely lacks that branching point. **Evaluation should be relative to *their* coarse-grained world model.**

  This is a deep and important puzzle in philosophy of action, ethics, and AI safety. While lacking a single universally agreed-upon name, framing it in terms of **epistemically indistinguishable states** or **coarse-grained vs. fine-grained world models** provides a powerful lens for understanding the core disagreement in evaluation.
