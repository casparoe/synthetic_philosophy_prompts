answer: |-
  Here’s a concise, criteria-focused list of desiderata for theories of diachronic rationality, designed for seminar use. Theories must satisfy **all** core requirements, respect key distinctions, and avoid forbidden results. Tensions and the "strictest test" are flagged.

  ---

  ### **Core Requirements (Cases to Get Right)**
  1. **Block Money Pumps**: Must explain irrationality in standard money pump cycles (e.g., paying to swap A for B, B for C, C for A, ending with A but poorer).  
  2. **Resolve the Self-Torturer**: Must condemn sequences where marginal *local* gains (e.g., slight pain increase for money) lead to catastrophic *global* outcomes (unbearable pain), even if no single step is irrational synchronically.  
  3. **Handle Resolute vs. Sophisticated Choice**:  
     - *Resolute*: Commitment to a prior plan (e.g., sticking to a diet despite changing cravings).  
     - *Sophisticated*: Anticipating future choices and constraining current options (e.g., avoiding buying snacks if you’ll eat them later).  
     Must permit one (or both) as rational without contradiction.  

  ### **Critical Distinctions (Must Not Collapse)**
  4. **Synchronic vs. Diachronic Coherence**:  
     - Synchronic: Rationality *at a single time* (e.g., transitive preferences now).  
     - Diachronic: Rationality *across time* (e.g., not abandoning plans without new information).  
     → A theory cannot reduce diachronic rationality to mere synchronic coherence.  
  5. **Genuine Preference Cycles vs. Shifting Preferences**:  
     - Condemn cycles from *fixed but intransitive* preferences (true money pumps).  
     - Allow for preference *shifts* based on rational learning or context (e.g., preferring tea over coffee only in the morning).  
  6. **Local vs. Global Welfare**:  
     - Must distinguish “worse off *at some time*” (e.g., excruciating pain in self-torturer) from “worse off *only on the whole*” (e.g., marginally less happy each day but never miserable).  

  ### **Forbidden Results (Cannot Contradict)**
  7. **No Forced Myopia**: Cannot demand agents *always* maximize immediate utility if this guarantees long-term exploitation (e.g., sophisticated choosers who lose resolute benefits).  
  8. **No Paternalism by Default**: Cannot declare agents irrational *solely* for having time-inconsistent preferences (e.g., hyperbolic discounting).  

  ---

  ### **Key Tensions & Trade-offs**
  - **The Central Tension**:  
    *(a) Letting present preferences define "good for her now"* vs.  
    *(b) Claiming a money pump makes her "worse off overall"*.  
    → **Conflict**: If (a) is strict, each step in a pump is rational (she gets what she wants then). But (b) demands diachronic harm. *Resolution requires either*:  
    - Rejecting (a): Some preferences are "tainted" (e.g., by foresight of exploitation).  
    - Rejecting atomism: "Worse off" is defined over lifetimes, not moments.  
    → **Most theories sacrifice strict adherence to (a)**.  

  ---

  ### **Strictest Test: The Self-Torturer**  
  - **Why?** No synchronic failure (each step is utility-increasing), no clear global preference violation (no cycle), and no time-slice is worse off. Failing here often dooms a theory.  

  ---

  ### **Your Added Case: The Patient Trader Exploitation**
  - **Setup**: Agent has *acyclic preferences at every moment* but is exploited by a trader who induces preference shifts (e.g., offers minor rewards to adopt preferences that lead to draining resources over time).  
  - **Desideratum**:  
    9. **Block Non-Cyclic Exploitation**: Must condemn agents who are *predictably manipulated* due to diachronic incoherence (e.g., failing to anticipate how current choices enable future exploitation), even without fixed cyclic preferences.  
    → **Irrationality lies in**:  
    - Lack of *diachronic coordination* (failing to constrain future selves/trades).  
    - *Vulnerability to foresight-dependent exploitation* (the trader’s strategy relies on predicting preference shifts).  
    → *A theory that allows this fails Requirement 9 and likely Requirement 1 (if extended to non-cyclic cases)*.  

  ---

  ### **Scoring Shortlist for Theories**
  | **Requirement**         | **Pass/Fail** | **Notes**                              |
  |-------------------------|--------------|----------------------------------------|
  | 1. Blocks Money Pumps   |              | Core exploitability test               |
  | 2. Self-Torturer        |              | Strictest test; fails often            |
  | 3. Resolute/Sophisticated |              | Must permit rational commitment/planning |
  | 4. Synchronic ≠ Diachronic |              | No collapse                            |
  | 7. No Forced Myopia     |              | Avoids self-sabotage                   |
  | 9. Blocks Patient Trader|              | Your case; acyclic exploitation        |

  **Key Tension Check**: Does the theory resolve (a) vs. (b) without ad-hoc moves?  

  ---

  **Why this works**:  
  - Focuses on *procedural failures* (exploitability, incoherent planning) over substantive preferences.  
  - Forces theories to explain *what’s irrational* in non-cyclic exploitation (Requirement 9).  
  - Highlights where compromises are unavoidable (e.g., weakening present-preference sovereignty).  
  - Short enough for in-class theory testing.  

  Run theories against Requirement 2 (Self-Torturer) first—it’s the litmus test for diachronic viability.
