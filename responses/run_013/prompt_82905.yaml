prompt: |-
  I have been arguing with a close friend about a distinction I can feel but cannot draw, and what I want from you is a number rather than a survey. The case is this. I direct a substantial share of my charitable giving to organizations working in my own country, and when I try to imagine sending the same money to strangers abroad whose needs are at least as urgent, the prospect produces a resistance I have never managed to argue myself out of. I have looked hard at the attitude's causal history (I grew up here, the images are familiar, the faces resemble mine), I can see that it is sensitive to features I would not, on reflection, want to call morally relevant, and I still endorse it rather than disavow it. My friend says this is in-group bias wearing the costume of a preference, and that my inability to repudiate it is precisely what bias looks like from the inside. I am about 0.3 that she is right; she is about 0.75. Give me your own credence that the attitude is a bias rather than a permissible preference, and then show me the machinery.

  Please make the decomposition explicit rather than gestural. Among the terms I would want to see: the probability that the correct account of what makes an attitude a bias is an error account (the attitude rests on a false belief about the case), a distortion account (the attitude is responsive to normatively irrelevant features, so its sensitivity profile is the defect), or a laundering account (an attitude is a bias when the agent would disavow it upon understanding its social function, so that non-disavowal is neither necessary nor sufficient); your probability for each account being the right one; your probability that the attitude is a bias conditional on each; and how those combine into your final figure. I would also like your probability that sincere, stable, reflective non-disavowal is dispositive — that an attitude the agent cannot bring herself to repudiate is for that reason alone not a bias — and your judgment about whether that claim, rather than anything about the attitude itself, is where the disagreement between my friend and me actually lives. Finally, tell me which single term your number is most sensitive to, how far that term would have to move to flip your verdict, and what evidence or argument — something I could actually go out and get, not a reading list — would move it most.
