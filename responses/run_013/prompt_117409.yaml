answer: |-
  The practice of humanitarian intervention under the Responsibility to Protect (R2P) doctrine presupposes a complex, often contradictory **implicit theory** that can be reconstructed as follows:

  ### I. Implicit Theories Presupposed by Practice  
  **1. Sovereignty & Its Forfeiture:**  
  - Sovereignty is **conditional** on a state fulfilling its "responsibility to protect" its population.  
  - Forfeiture occurs when a state:  
    - *Fails* to prevent mass atrocities (Rwanda 1994), or  
    - *Is the perpetrator* of atrocities (Libya 2011, Kosovo 1999).  
  - **Trigger for forfeiture:** Large-scale violence against civilians (genocide, crimes against humanity) that the state cannot or will not stop.  

  **2. Residual Responsibility:**  
  - **Nature:** A *collective duty* of the "international community" (primarily powerful states/Security Council members), activated when the sovereign state defaults.  
  - **Holder:** The UN Security Council (ideally), but *de facto* NATO or coalitions of willing states when the Council is deadlocked (e.g., Kosovo).  
  - **Trigger:** Security Council authorization (Libya) OR moral imperative overriding legality (Kosovo).  
  - **Discharge:** Successful intervention is measured by:  
    - Regime removal (Libya, Kosovo),  
    - Installation of a new government,  
    - *Not* merely civilian safety (as seen in Syria’s stalemate).  

  **3. Political Authority in Trusteeship:**  
  - Interveners act as **temporary trustees** for the population, claiming authority to:  
    - Use force ("protection"),  
    - Impose laws (occupation legislation),  
    - Reconfigure governance (regime change).  
  - **Basis of authority:** Asserted "trusteeship" justifies overriding sovereignty for the population’s "own good."  
  - **Duration:** Authority lapses only when a "legitimate" government is installed—*not* when civilians are safe.  

  ---

  ### II. What Practice Presupposes vs. What It Merely Suits  
  | **Element**               | **Strictly Presupposed**                                  | **Merely Suited to Power**                          |  
  |----------------------------|-----------------------------------------------------------|-----------------------------------------------------|  
  | **Sovereignty Forfeiture** | Atrocities nullify sovereignty.                           | Only *weak/unallied* states forfeit sovereignty (e.g., not Saudi Arabia/Yemen). |  
  | **Residual Responsibility**| Security Council should authorize force.                  | NATO bypasses the Council when interests align (Kosovo). |  
  | **Political Authority**    | Interveners hold authority in trust for the population.   | "Trusteeship" masks self-interested regime change (Libya). |  

  **Underdetermined Aspects:**  
  - **Who holds residual duty?** Practice allows either UN-sanctioned coalitions *or* unilateral actors (NATO).  
  - **What discharges responsibility?** Regime change (Libya) vs. civilian protection (Rwanda ignored).  
  - **Scope of trusteeship:** Legislation during occupation (Iraq) exceeds protection mandates.  
  Multiple theories fit: *Liberal internationalism* (spreading democracy), *realpolitik* (power projection), or *paternalist humanitarianism*.  

  ---

  ### III. Resolving the Inconsistency: Safety vs. Self-Government  
  The guardianship analogy reveals a core contradiction:  
  - **Domestic guardianship:** Authority is *temporary*, strictly for the ward’s safety, and *accountable* to courts. Lapses when the ward can self-govern.  
  - **R2P practice:** Authority is *not structured this way*. Interveners:  
    - Prioritize regime removal over immediate safety (e.g., Libya’s collapse into chaos),  
    - Impose laws without accountability to the population,  
    - "Conclude" by installing preferred governments, not restoring self-determination.  

  **What This Reveals:**  
  The practice’s *true point* is **political order transformation**, not individual protection. Safety is the *justification*; regime change is the *objective*. The disconnect exposes that R2P presupposes **liberal states as the sole legitimate political form**. Populations are "saved" only when governed by Western-approved regimes.  

  ---

  ### IV. The Single Premise for Coherence  
  **"State personhood"** is the keystone premise:  
  - **Premise:** *States are analogous to moral agents capable of forfeiting rights through misconduct.*  
  - **If false:** If states are merely administrative units (not "persons"), sovereignty forfeiture becomes incoherent. Residual responsibility would lack a clear subject, and trusteeship authority collapses into imperialism.  

  **Required Changes if Premise Replaced:**  
  1. **Law:** Replace R2P with a **civilian-centric model**—intervention mandates limited to direct protection (no regime change), enforceable by regional bodies.  
  2. **Institutions:** Create an **independent UN atrocity-response force** (bypassing Security Council vetoes) and **international trusteeship courts** to audit interventions and end mandates when civilians are secure.  
  3. **Authority:** Shift from "trusteeship" to **delegated agency**—local actors design post-intervention governance, with interveners as temporary protectors.  

  Without this, R2P remains a selective tool for power—invoked for Libya but ignored for Palestine or Xinjiang—masking hegemony as humanitarianism.
