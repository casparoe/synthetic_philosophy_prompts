answer: |-
  ### First: Species Concept Applications to Your Weevil Complex  

  1. **Biological Species Concept (Mayr):**  
     - Delimits species based on **reproductive isolation**.  
     - *In this case:* The two sympatric, non-interbreeding lineages on the same island are separate species. Hybridizing northern forms are one species (stable hybrid zone implies gene flow). The parthenogenetic lineage is a distinct species (no sexual reproduction). Intergrading forms on the middle island are one species. Ignores molecular/morphological discordance.  

  2. **Ecological Species Concept (Van Valen):**  
     - Delimits species based on **shared ecological niche/adaptive zone**.  
     - *In this case:* The parthenogenetic lineage (distinct host plant) is a separate species. Sympatric non-interbreeding lineages *might* be one species if ecologically identical, or split if niches differ. Ignores reproductive compatibility and clinal variation if ecology is stable.  

  3. **Diagnosable Phylogenetic Species Concept (Cracraft):**  
     - Delimits species as the **smallest diagnosable monophyletic groups**.  
     - *In this case:* All seven molecular lineages are species (each is diagnosable via DNA). Morphologically indistinguishable lineages split based on genetics. Parthenogenetic lineage is separate. Ignores gene flow (e.g., hybrid zone).  

  4. **Cohesion Species Concept (Templeton):**  
     - Delimits species based on **cohesive mechanisms** (gene flow *or* shared evolutionary constraints).  
     - *In this case:* Hybridizing northern forms are one species (gene flow cohesion). Sympatric non-interbreeding lineages are separate (no cohesion). Parthenogenetic lineage is distinct (ecological/developmental cohesion). Intergrading clinal forms are one species.  

  5. **Evolutionary Species Concept (Simpson/Wiley):**  
     - Delimits species as a **single lineage with a shared evolutionary fate**.  
     - *In this case:* Divergent molecular lineages (especially non-interbreeding sympatric pairs) are separate species. Clinal intergradation and stable hybrid zones represent single lineages. Parthenogenetic lineage is distinct.  

  6. **General Lineage Concept (de Queiroz):**  
     - Species are **metapopulation lineages evolving separately**, with other criteria (reproduction, ecology, etc.) as *secondary* lines of evidence.  
     - *In this case:* All seven molecular lineages are incipient species. Hybrid zones and clinal variation represent lineage divergence "in process." Parthenogenetic offshoot is a distinct lineage.  

  7. **Morphological Species Concept:**  
     - Delimits species based on **diagnosable phenotypic differences**.  
     - *In this case:* Only morphologically distinct named forms are species. Cryptic molecular lineages are lumped. Intergrading forms are one species. Parthenogenetic lineage is split based on morphology.  

  ---

  ### Second: Tiered Ranking by the Fifty-Year Test  
  *(Tier 1: Most defensible in 2075; Tier 3: Least defensible)*  

  **Tier 1 (Lineage-First Concepts):**  
  - **General Lineage Concept (de Queiroz)**  
    *Why:* Genomic data will refine lineage boundaries but won’t invalidate lineage-based thinking. Accommodates all data types.  
  - **Evolutionary Species Concept (Simpson/Wiley)**  
    *Why:* Focus on evolutionary trajectories aligns with genomics. Stable hybrid zones and divergence are testable.  

  **Tier 2 (Process-Specific Concepts):**  
  - **Cohesion Species Concept (Templeton)**  
    *Why:* Genomic data will better characterize cohesion mechanisms (gene flow/selection), but operationalization remains subjective.  
  - **Biological Species Concept (Mayr)**  
    *Why:* Reproductive isolation is testable with genomic tools (e.g., gene flow quantification), but fails for asexuals/clines.  
  - **Ecological Species Concept (Van Valen)**  
    *Why:* Genomic + environmental data can validate niche divergence, but may not resolve non-adaptive divergence.  

  **Tier 3 (Phenotype-Only or Rigid Concepts):**  
  - **Diagnosable Phylogenetic Species Concept (Cracraft)**  
    *Why:* Genomic data may reveal rampant paraphyly or gene flow, making strict diagnosability/monophyly untenable.  
  - **Morphological Species Concept**  
    *Why:* Genomic data will expose cryptic diversity, rendering morphology-only delimitation arbitrary.  

  ---

  ### Third: My Commitment  
  **Adopt the General Lineage Concept (de Queiroz)**, supplemented by *explicit operational criteria* for lineage divergence. This requires conceding that:  
  - **Several named forms are not species.** Morphologically identical but non-interbreeding lineages are separate species.  
  - **Some named forms are conspecific** (e.g., intergrading clinal variants).  
  - **The parthenogenetic lineage is a distinct species** (separate evolutionary trajectory).  

  #### Explicit Policy for Combining Evidence:  
  1. **Primary criterion:** Genomic evidence of divergent lineages (e.g., nuclear gene trees, demographic isolation).  
  2. **Secondary criteria:**  
     - Reproductive isolation where testable (sympatric non-interbreeding = species).  
     - Ecological divergence (e.g., host shift in parthenogen).  
     - Stabilized hybrid zones = single species; narrow hybrid zones = provisional species.  
  3. **Reject morphology as decisive**—use it only for initial hypotheses.  

  #### Implications for Your Named Forms:  
  - **Split:** Cryptic sympatric lineages (species despite morphological identity).  
  - **Lump:** Clinal variants intergrading on the middle island (one species).  
  - **Recognize:** Parthenogenetic lineage as a species.  
  - **Revise Relationships:** Non-sister "species" under morphology are not valid; follow molecular phylogeny.  

  #### Why Not Pluralism?  
  The case *is* complex, but the General Lineage Concept is a **unifying framework**, not pluralism. It treats species as lineages and uses other concepts as *operational tools*—avoiding the "it depends" trap. In 2075, genomic data will resolve lineage splits more precisely, but lineage-based thinking will persist. Morphological distinctions alone will be seen as incomplete snapshots of a dynamic process.  

  **In short:** Your weevil complex comprises **at least seven species** (aligned with molecular lineages), with some named forms synonymized and others split. The hybrid zone and cline represent lineage divergence in progress—not "failed" species. This is defensible, testable, and future-proof.
