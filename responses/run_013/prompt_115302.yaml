prompt: |-
  I coordinate the listing programme in the biodiversity branch of a national environmental agency. Our statute directs us to protect 'species' and, in certain circumstances, to extend protection to recognised subspecies and other units below the species level, but it defines none of these terms. The petitions that reach us increasingly turn on exactly the cases where the biological community is itself divided. Over the next two years my unit will have to reach a recommendation on roughly one contested petition a month, among them: a geographically isolated population of a widespread songbird that some specialists treat as a subspecies and others as an artefact of sampling; a parthenogenetic lineage of lizards that reproduces without males; a group of fish that interbreeds freely with a neighbouring form along a hybrid zone; and a captive-bred line whose wild ancestor is extinct. Each recommendation is consequential — it can trigger land-use restrictions and unlock or divert funding — and each is produced under time pressure by staff trained as ecologists rather than as philosophers, reviewed by a legal office, and signed off by a director who wants the reasoning to survive a court challenge.

  The philosophy of biology has spent decades on what looks like our exact problem, and has if anything sharpened it: it has shown that 'species' is asked to do several incompatible jobs at once, that the leading criteria for drawing species boundaries — interbreeding, shared ancestry, ecological niche, overall similarity — can disagree about the very same organisms, and that some philosophers conclude there is no single correct answer to be found. I want that literature turned into something my staff can actually run.

  Please write that procedure. Begin by giving us a compact, usable version of the underlying conceptual apparatus — in particular the difference between the species category and particular species taxa, the idea that species might be individuals rather than kinds, and the pluralist claim that no one species concept is uniquely correct — but translate it rather than lecture; assume the reader has had one undergraduate evolution course and no philosophy. Then set out the procedure itself as an ordered sequence of questions, indicating for each what would count as a sufficient answer and who on the team is competent to supply it.

  I would like you to build the procedure around a distinction I have found useful and want you to develop: the difference between (i) delimitation, the question of where to draw boundaries in a continuous genealogy; (ii) ranking, the question of at what level of the hierarchy a boundary so drawn should count as a species rather than a subspecies or a mere local variant; and (iii) evaluation, the question of what legal and moral status the group so identified deserves. The procedure should make clear that evidence bearing on (i) and (ii) does not settle (iii), and it should mark the point at which the decision stops being a scientific one and becomes one of policy, so that my staff can record that in writing rather than smuggling a value judgment into the choice of a species concept.

  Then run the procedure on three of the petitions above — the songbird population, the parthenogenetic lizards, and the hybridising fish — taking the facts as I have sketched them and supplying detail only where it does not change the outcome. At least one of the three should come out in a way my staff will not like; do not smooth that over. Close with an honest account of what the procedure cannot do: which cases it will misclassify, where it will merely launder a political choice as a taxonomic one, and what it would need from the science that the science may never provide.

  I do not need citations or a reading list; I know the literature well enough to fill those in myself, and my staff will never read it. What I need is the procedure, in a form I can hand to them on Monday.
reasoning: |-
  We are designing a procedure for the biodiversity listing programme to handle contested petitions about whether to extend protection to entities below the species level. The procedure is structured around three distinct steps: 
  1. **Delimitation**: Where to draw boundaries in the continuous genealogy? (This is about identifying distinct evolutionary lineages.)
  2. **Ranking**: At what level (species, subspecies, etc.) should the delimited group be classified?
  3. **Evaluation**: What legal and moral status does the group deserve? (This step is policy-driven, not scientific.)

  The procedure must clearly separate the scientific steps (delimitation and ranking) from the policy step (evaluation). 

  ### Conceptual Background (Compact and Usable)

  1. **Species Category vs. Species Taxa**:
     - The **species category** is a rank in the biological classification system (like genus, family) that we assign to groups we call species.
     - **Species taxa** are the actual groups of organisms that we place in that category (e.g., *Homo sapiens*). The same group might be considered a species by one definition and a subspecies by another.

  2. **Species as Individuals, Not Kinds**:
     - Traditionally, species were thought of as natural kinds (like chemical elements) with essential properties. 
     - Modern view: A species is more like an individual — a particular, historically connected lineage that evolves and has a beginning and end. This means:
       - Variation within a species is normal (like parts of an individual).
       - The boundaries of a species are set by historical events (e.g., speciation) and may be fuzzy.

  3. **Pluralism in Species Concepts**:
     - There is no single "correct" way to define a species because different concepts (e.g., Biological Species Concept, Phylogenetic Species Concept) emphasize different criteria (interbreeding, shared ancestry, etc.).
     - These concepts can conflict. Therefore, we must be explicit about which concept(s) we are using and why.

  ### The Procedure: A Sequence of Questions

  **Step 1: Delimitation (Identifying Lineages)**
     *Goal: Identify evolutionarily distinct lineages in the group under petition.*
     - **Question 1A**: Is the petitioned group reproductively isolated from other groups? (Biological Species Concept)
       - *Competent Staff*: Population geneticist or ecologist with expertise in the taxon.
       - *Sufficient Answer*: Evidence of lack of gene flow (e.g., genetic differentiation, behavioral isolation) OR evidence of gene flow (e.g., hybrid zones, genetic admixture). If there is gene flow, how extensive? (e.g., hybrid zone width, frequency of hybrids)
     - **Question 1B**: Does the petitioned group form a monophyletic clade? (Phylogenetic Species Concept)
       - *Competent Staff*: Phylogeneticist or systematist.
       - *Sufficient Answer*: A well-supported phylogenetic tree (based on genetic/morphological data) showing that the group shares a recent common ancestor not shared with others. If the group is not monophyletic, then it is part of a larger lineage.
     - **Question 1C**: Does the petitioned group occupy a distinct ecological niche? (Ecological Species Concept)
       - *Competent Staff*: Ecologist.
       - *Sufficient Answer*: Evidence of distinct habitat use, diet, behavior, or other ecological factors that are consistent and adaptive. If the group is ecologically interchangeable with others, then it may not be distinct.
     - **Question 1D**: Is the petitioned group morphologically or phenotypically distinct? (Morphological Species Concept)
       - *Competent Staff*: Taxonomist or morphologist.
       - *Sufficient Answer*: Statistical evidence of consistent differences in measurable traits (size, color, etc.) that are not due to environmental plasticity.

     **Delimitation Conclusion**:
     - If multiple lines of evidence (from 1A-1D) converge on a distinct lineage, then the group is delimited as a candidate for ranking. 
     - If evidence conflicts (e.g., genetically distinct but ecologically similar), note the conflict and proceed to ranking with the understanding that the lineage's distinctness is partial.

  **Step 2: Ranking (Assigning Taxonomic Level)**
     *Goal: Decide if the delimited lineage should be ranked as a species, subspecies, or lower.*
     - **Question 2A**: How much evolutionary independence does the lineage have? 
       - Consider: 
          - Degree of reproductive isolation (from Step 1A): High isolation suggests species rank.
          - Age of divergence (if known): Older divergence suggests species rank.
          - Strength of evidence for monophyly (from Step 1B): Strong monophyly suggests species rank.
       - *Competent Staff*: Evolutionary biologist or systematist.
       - *Sufficient Answer*: A qualitative summary (e.g., "moderate isolation in a narrow hybrid zone" or "recent divergence with incomplete lineage sorting") that allows placing the lineage on a spectrum from full independence (species) to partial independence (subspecies).

     - **Question 2B**: What is the current taxonomic consensus for the group? 
       - *Competent Staff*: Taxonomist familiar with the group.
       - *Sufficient Answer*: Review of recent literature and major taxonomic authorities (e.g., IOC for birds, IUCN for conservation). If there is disagreement, note the range of opinions.

     - **Question 2C**: Would ranking this lineage as a species create non-monophyletic taxa? (i.e., would it require splitting a well-established monophyletic group into multiple species that are not reciprocally monophyletic?)
       - *Competent Staff*: Phylogeneticist.
       - *Sufficient Answer*: If the lineage is nested within a larger group that is considered one species and splitting would create non-monophyletic species, then subspecies rank may be more appropriate.

     **Ranking Conclusion**:
     - The default is to follow the current taxonomic consensus (2B) unless there is strong new evidence. 
     - If consensus is absent, then base ranking on evolutionary independence (2A) and monophyly (2C). 
     - The outcome is a recommendation for rank: species, subspecies, or population (no formal rank).

  **Step 3: Evaluation (Policy Decision)**
     *Goal: Decide if the group (at the assigned rank) deserves legal protection under the statute.*
     - **Note**: This step is not scientific. It involves legal interpretation and values.
     - **Question 3A**: Does the statute allow protection for the assigned rank? (e.g., does it cover subspecies? populations?)
       - *Competent Staff*: Legal officer.
       - *Sufficient Answer*: Interpretation of the statute and precedent.

     - **Question 3B**: What is the conservation status of the group? (e.g., endangered, threatened)
       - *Competent Staff*: Conservation biologist.
       - *Sufficient Answer*: Assessment of population size, trends, threats, etc.

     - **Question 3C**: What are the consequences of protection? (e.g., land-use restrictions, funding implications)
       - *Competent Staff*: Policy analyst, economist, social scientist (if human impacts).

     - **Question 3D**: Are there ethical considerations? (e.g., intrinsic value, cultural significance)
       - *Competent Staff*: Ethicist (if available) or advisory panel.

     **Evaluation Conclusion**:
     - Based on the answers, make a policy recommendation. The scientific steps (1 and 2) have provided the taxonomic identity and rank. Now, the decision to protect is separate.

  **Recording the Separation**:
     - The report must clearly state:
       - The delimitation and ranking conclusions (scientific, based on evidence).
       - The evaluation (policy, based on statute and values) as a separate section.
     - Example: "Based on the evidence, we delimit the group as a distinct lineage and rank it as a subspecies. Although the statute allows protection of subspecies, we recommend against listing because the population is stable and the economic costs are prohibitive."

  ### Applying the Procedure to Three Cases

  **Case 1: Geographically Isolated Songbird Population**
     - *Facts*: Some specialists treat it as a subspecies, others as an artefact of sampling (i.e., not real). It is geographically isolated from the main population.

     - **Delimitation**:
       - 1A: Is there gene flow? No current gene flow due to isolation. But historical gene flow? (Unknown, but isolation is recent.) → Moderate support for distinct lineage.
       - 1B: Monophyly? Genetic data may show some divergence but not complete lineage sorting (due to recent isolation). → Weak support.
       - 1C: Ecological niche? Probably similar to main population. → Weak support.
       - 1D: Morphology? May show differences, but could be due to environmental plasticity. → Weak to moderate support.
       - *Conclusion*: Weak evidence for a distinct lineage. It may be a local variant, not a separate lineage.

     - **Ranking**:
       - 2A: Low evolutionary independence (recent isolation).
       - 2B: Taxonomic consensus is divided. Some say subspecies, some say not.
       - 2C: If ranked as a species, it would make the rest of the species non-monophyletic? Possibly, because the main population is paraphyletic with respect to this isolate.
       - *Conclusion*: Rank as a subspecies is the highest justifiable. But given the weak evidence, even that is questionable. We might rank it as a "population" without formal taxonomic rank.

     - **Evaluation**:
       - 3A: Statute may allow protection of subspecies or populations? (Assume it does for subspecies, but not for populations without rank.)
       - 3B: Conservation status? (Not provided, but assume it's declining.)
       - 3C: Consequences? Land-use restrictions might be significant.
       - *Policy Decision*: Because of weak scientific evidence for a distinct lineage, and the high costs, we do not recommend listing. (Note: Staff might not like this because they want to protect the population.)

  **Case 2: Parthenogenetic Lizard Lineage**
     - *Facts*: Reproduces without males (asexual). May have originated from a hybridization event.

     - **Delimitation**:
       - 1A: Reproductive isolation? Complete, because it does not interbreed with sexual relatives. → Strong support.
       - 1B: Monophyly? The lineage is a single clone (or set of clones) that share a recent common ancestor. Likely monophyletic. → Strong support.
       - 1C: Ecological niche? May be similar to sexual relatives, but could have expanded. (Assume similar.) → Weak support.
       - 1D: Morphology? Probably very similar to the parent species. → Weak support.
       - *Conclusion*: Strong evidence for a distinct lineage due to reproductive isolation and clonality.

     - **Ranking**:
       - 2A: High evolutionary independence (no gene flow).
       - 2B: Taxonomic consensus? Asexual lineages are sometimes ranked as species (e.g., *Aspidoscelis neomexicana*), sometimes not. 
       - 2C: If we rank it as a species, it is monophyletic? Yes. However, it might be nested within a sexual species complex. If the sexual species is paraphyletic without it, then splitting might create non-monophyletic taxa? (This depends on the tree. Assume the asexual lineage is sister to a sexual species, so it can be a species without breaking monophyly of the sexual one.)
       - *Conclusion*: Rank as a species is appropriate.

     - **Evaluation**:
       - 3A: Statute protects species → yes.
       - 3B: Conservation status? (Assume it is rare and threatened.)
       - 3C: Consequences? May unlock funding for habitat protection.
       - *Policy Decision*: Recommend listing as a protected species.

  **Case 3: Hybridizing Fish**
     - *Facts*: Interbreeds freely with a neighbouring form along a hybrid zone.

     - **Delimitation**:
       - 1A: Reproductive isolation? Low. There is a hybrid zone with extensive gene flow. → Evidence against distinct lineage.
       - 1B: Monophyly? Unlikely. The two groups are probably not reciprocally monophyletic due to gene flow. → Weak support.
       - 1C: Ecological niche? Maybe distinct at the ends of the cline, but in the hybrid zone, intermediate. → Weak support.
       - 1D: Morphology? May show a cline (gradual change) → not distinct.
       - *Conclusion*: Weak evidence for distinct lineages. The two forms are parts of a single, continuous population.

     - **Ranking**:
       - 2A: Low evolutionary independence (high gene flow).
       - 2B: Taxonomic consensus? Some may call them subspecies, others one species. 
       - 2C: If ranked as two species, they would not be monophyletic and would have a hybrid zone → taxonomically messy.
       - *Conclusion*: Rank as one species with two subspecies (if morphological differences are consistent) or as one species without subspecies.

     - **Evaluation**:
       - 3A: Statute may protect subspecies? (Assume it does.) But we did not rank them as subspecies? (We might have, if there are consistent differences at the ends.)
       - However, the scientific conclusion is that they are one species. The petitioned group (one of the forms) is not a distinct lineage. Therefore, it is not even a subspecies.
       - *Policy Decision*: Do not list. (Staff might not like this because they want to protect one form that is declining.)

  ### What the Procedure Cannot Do

  1. **Resolve Fundamental Conflicts**: When evidence for delimitation is contradictory (e.g., strong ecological differentiation but no genetic differentiation), the procedure will not magically solve it. It will only make the conflict explicit. The team must then make a judgment call, and that call may be arbitrary.

  2. **Avoid Value Judgments in Science**: Even in delimitation and ranking, choices of which species concept to prioritize (e.g., when to use monophyly over interbreeding) may be influenced by conservation goals. The procedure requires being explicit about the criteria used, but it cannot eliminate bias.

  3. **Handle Temporal Dynamics**: Species are dynamic. A group that is a subspecies today may become a species in the future. The procedure uses current evidence and may misclassify groups in transition.

  4. **Deal with Hybrid Taxa**: Some groups (like the parthenogenetic lizards) are of hybrid origin. The procedure might rank them as species, but the statute might not have considered such cases.

  5. **Provide Definitive Answers in Policy**: The evaluation step is inherently political. The procedure only ensures that the science is not used to hide the policy choice.

  6. **Work Without Data**: If critical data (e.g., genetic, ecological) are missing, the procedure will have to rely on expert opinion, which may be disputed.

  7. **Satisfy Everyone**: At least one case (the songbird or the fish) will likely be denied protection, which may be unpopular.

  **Final Note**: This procedure is a tool to structure the decision, not a substitute for judgment. It forces transparency and separates science from policy. But in the hardest cases, the decision will still be contested and may end up in court. The hope is that by documenting each step, the reasoning will survive scrutiny.
answer: |-
  Below is a practical procedure for evaluating contested petitions, designed for your staff. It distills key philosophy of biology concepts into actionable steps and strictly separates scientific delimitation/ranking from policy evaluation. The procedure is structured as a sequence of questions, assigned roles, and decision thresholds. It assumes staff have basic evolutionary biology knowledge but no philosophy background.

  ### Core Concepts (Translated for Practical Use)
  1. **Species Category vs. Species Taxa**  
     - **Species taxa**: Actual groups of organisms (e.g., "bald eagles" or "African elephants"). These are the entities we evaluate.  
     - **Species category**: The rank we assign to a taxon (e.g., calling a group a "species" vs. "subspecies"). Confusion arises because the same taxon might be ranked differently by different experts.  
     - *Why it matters*: Your statute protects "species," but we must decide whether a petitioned group qualifies as a species-level taxon or a lower rank (e.g., subspecies).  

  2. **Species as Individuals, Not Kinds**  
     - Species are not fixed "types" (like "gold" or "water") but evolving lineages with blurred boundaries. Think of them as branches on a tree of life that split and change over time.  
     - *Why it matters*: Boundaries between groups are often fuzzy (e.g., hybrid zones). We’re looking for evolutionarily distinct lineages, not perfect categories.  

  3. **Pluralism: No One "Right" Species Concept**  
     - Biologists use multiple criteria to define species (interbreeding, genetics, ecology, etc.). These often conflict, and no single concept works for all cases.  
     - *Why it matters*: Your staff must use multiple lines of evidence and acknowledge when criteria disagree. **This doesn’t mean "anything goes"—it means we synthesize evidence transparently**.  

  ---

  ### The Procedure: 3 Steps (Delimitation, Ranking, Evaluation)  
  **Key Rules**:  
  - Steps 1–2 (Delimitation/Ranking) are **scientific**. They require biological evidence.  
  - Step 3 (Evaluation) is **policy**. It considers legal, social, and economic factors.  
  - **Document the transition**: Once Step 2 is complete, staff must state: *"The scientific assessment ends here. The following evaluation is a policy decision based on statutory goals."*  

  #### **Step 1: Delimitation**  
  *Goal: Is the petitioned group a distinct evolutionary lineage?*  
  Focus: **Boundary-drawing in the genealogy**. Ignore legal terms like "species" here.  
  **Questions and Decision Thresholds**:  

  1. **Is there evidence of restricted gene flow?**  
     - *Competent staff*: Population geneticist or molecular ecologist.  
     - *Sufficient answer*: Genetic data (e.g., Fst, AMOVA) showing significant differentiation from other groups. **Threshold**: Fst ≥ 0.15 or equivalent statistical support (p < 0.05). If gene flow is high (e.g., Fst < 0.05), the group is **not distinct**.  
     - *Note*: For asexual groups (e.g., parthenogens), use mutation accumulation or genomic divergence.  

  2. **Is there evidence of divergent adaptation?**  
     - *Competent staff*: Ecologist or behavioral biologist.  
     - *Sufficient answer*: Data showing unique traits with fitness consequences (e.g., diet specialization, habitat use, phenology). **Threshold**: Traits are fixed or nearly fixed (>90% of the group) and linked to survival/reproduction. If traits are plastic (e.g., vary with environment), the group is **not distinct**.  

  3. **Is the group diagnosable?**  
     - *Competent staff*: Taxonomist or morphologist.  
     - *Sufficient answer*: Consistent, measurable differences (e.g., morphology, calls, chemical markers). **Threshold**: >95% of individuals can be correctly ID’d using these traits. If overlap is high (>20% misassignment), the group is **not distinct**.  

  **Delimitation Conclusion** (Combined by lead biologist):  
  - **Distinct lineage**: Supported if ≥2 questions answer "yes" and meet thresholds.  
  - **Not distinct**: If ≤1 question answers "yes" or thresholds unmet.  
  - **Inconclusive**: If evidence conflicts (e.g., genetics "yes" but ecology "no"). *Next step*: Flag conflict and proceed to ranking—but note uncertainty.  

  ---

  #### **Step 2: Ranking**  
  *Goal: Should this lineage be ranked as a species, subspecies, or lower?*  
  Focus: **Hierarchical placement**. Use evidence from Step 1, but consider magnitude of divergence.  
  **Questions and Decision Thresholds**:  

  1. **How strong is evolutionary independence?**  
     - *Competent staff*: Evolutionary biologist.  
     - *Sufficient answer*: Qualitatively scored as:  
       - **High** (species-level): Long-term isolation (>10% of species' history), no recent gene flow, or irreversible reproductive barriers (e.g., chromosome mismatches).  
       - **Moderate** (subspecies-level): Recent isolation with some gene flow, or partial reproductive barriers.  
       - **Low** (variant-level): No barriers, or divergence is ephemeral.  

  2. **What is the taxonomic consensus?**  
     - *Competent staff*: Systematic biologist (review literature/IUCN/ITIS).  
     - *Sufficient answer*: Categorized as:  
       - **Broad consensus** (e.g., >75% of recent papers support one rank).  
       - **Divided** (e.g., 40–60% support species status).  
       - **No consensus** (e.g., <25% support any rank).  

  3. **Would ranking this as a species create non-monophyletic groups?**  
     - *Competent staff*: Phylogeneticist.  
     - *Sufficient answer*: If the group is nested within another taxon without exclusive ancestry, ranking it as a species "breaks" accepted taxonomy. **Threshold**: Avoid creating non-monophyletic species unless divergence is extreme (e.g., >5% genetic distance).  

  **Ranking Conclusion** (Combined by lead biologist):  
  - **Species rank**: Supported if (1) Evolutionary independence = *High* AND (2) Consensus not opposed AND (3) No non-monophyly.  
  - **Subspecies rank**: If (1) Independence = *Moderate* OR (2) Consensus favors subspecies OR (3) Non-monophyly risk.  
  - **No rank**: If (1) Independence = *Low* OR (2) Consensus rejects formal rank.  

  ---

  #### **Step 3: Evaluation**  
  *Goal: Does the ranked group deserve protection?*  
  Focus: **Legal/social merit**. Science ends at Step 2.  
  **Questions and Decision Thresholds**:  

  1. **Does the statute cover this rank?**  
     - *Competent staff*: Legal officer.  
     - *Sufficient answer*: Interpretation of statute (e.g., "subspecies" protected? "Populations"?).  
     - *Note*: If statute excludes the rank (e.g., no subspecies protection), stop—no protection.  

  2. **What is the conservation status?**  
     - *Competent staff*: Conservation biologist.  
     - *Sufficient answer*: IUCN criteria (e.g., Endangered, Vulnerable) or quantitative risk assessment.  

  3. **What are the consequences of protection?**  
     - *Competent staff*: Policy analyst.  
     - *Sufficient answer*: Cost-benefit analysis (e.g., habitat area affected, economic impacts).  

  **Evaluation Conclusion** (Combined by director/policy lead):  
  - **Recommend protection** if: Statute covers rank + Conservation status threatened + Benefits > Costs.  
  - **Do not recommend** if any criterion unmet.  
  - **Document**: Explicitly state that policy factors drove this outcome (e.g., "Despite subspecies ranking, protection denied due to economic costs").  

  ---

  ### Procedure in Action: Three Cases  
  *Assumptions*: Facts as provided; staff roles abbreviated for clarity.  

  #### **Case 1: Songbird Population**  
  - *Facts*: Geographically isolated; some call it a subspecies, others an artifact.  
    - **Step 1: Delimitation**  
      - Gene flow: Genetic data show moderate differentiation (Fst = 0.12). *Answer*: **No** (threshold unmet).  
      - Divergent adaptation: No data on unique traits. *Answer*: **No**.  
      - Diagnosability: Minor color variation, but 30% misassignment rate. *Answer*: **No**.  
      - **Conclusion**: Not distinct.  
    - **Step 2: Ranking** (if proceeding despite Step 1):  
      - Independence: Low (recent isolation, gene flow likely). Consensus divided. Non-monophyly risk high.  
      - **Conclusion**: No rank (or local variant).  
    - **Step 3: Evaluation**  
      - Statute may not cover variants. Conservation status unknown.  
      - **Outcome**: No protection.  
  - **Staff takeaway**: Unhappy but defensible. Science shows no distinct lineage.  

  #### **Case 2: Parthenogenetic Lizards**  
  - *Facts*: Asexual lineage; no males.  
    - **Step 1: Delimitation**  
      - Gene flow: None (asexual). *Answer*: **Yes**.  
      - Divergent adaptation: Same niche as sexual relatives. *Answer*: **No**.  
      - Diagnosability: Genetically unique clones. *Answer*: **Yes**.  
      - **Conclusion**: Distinct lineage.  
    - **Step 2: Ranking**  
      - Independence: High (no gene flow, irreversible). Consensus divided (asexuals often ranked as species). Non-monophyly risk low (separate branch).  
      - **Conclusion**: Species rank justified.  
    - **Step 3: Evaluation**  
      - Statute covers species. Conservation status likely threatened (small population).  
      - **Outcome**: Recommend protection.  
  - **Staff takeaway**: Straightforward; science supports species status.  

  #### **Case 3: Hybridizing Fish**  
  - *Facts*: Interbreeds freely in hybrid zone.  
    - **Step 1: Delimitation**  
      - Gene flow: High (Fst = 0.03 in hybrid zone). *Answer*: **No**.  
      - Divergent adaptation: None; shared niche. *Answer*: **No**.  
      - Diagnosability: Traits clinal (grade into neighbors). *Answer*: **No**.  
      - **Conclusion**: Not distinct.  
    - **Step 2: Ranking**  
      - Independence: Low (gene flow high). Consensus may treat as subspecies. Non-monophyly risk high.  
      - **Conclusion**: Subspecies at best.  
    - **Step 3: Evaluation**  
      - Statute protects subspecies? If yes, and if conservation status poor, protection possible.  
      - **Outcome**: *If* statute covers subspecies, evaluation may support protection—but science says lineage isn’t distinct, making this vulnerable to legal challenge.  
  - **Staff takeaway**: Unhappy if they value the group. Science is clear, but policy could override (risky).  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve fundamental biological ambiguities**: When evidence conflicts (e.g., songbird genetics vs. morphology), the procedure flags it but won’t yield a "right" answer. Staff must make a best call.  
  2. **Prevent policy-driven "taxonomic laundering"**: If a group is scientifically weak (e.g., fish) but politically valued, evaluation (Step 3) could still protect it by exploiting rank flexibility (e.g., calling it a subspecies). The procedure exposes this but can’t stop it.  
  3. **Handle non-standard units**: Captive-bred lines (like your fourth case) or hybrid taxa may not fit lineage-based concepts. The procedure might misclassify them as "not distinct" despite cultural value.  
  4. **Fix data gaps**: If critical evidence is missing (e.g., no genetic data for songbirds), the procedure defaults to "inconclusive," inviting disputes. Biology may never resolve this (e.g., sampling artifacts).  
  5. **Replace judgment**: In close calls (e.g., lizards), staff’s choice of "evolutionary independence" threshold may sway outcomes. Transparency is key, but subjectivity remains.  

  ### Final Output  
  This procedure provides a clear, auditable workflow. Staff document evidence at each step, separate science from policy, and justify outcomes. It won’t make controversies disappear—but it will ensure they’re managed rigorously and survive legal scrutiny.  

  **Document Template**:  
  ```  
  1. DELIMITATION (Science)  
     - Gene flow: [Data/threshold met?]  
     - Divergent adaptation: [Data/threshold met?]  
     - Diagnosability: [Data/threshold met?]  
     - Conclusion: [Distinct/Not/Inconclusive]  

  2. RANKING (Science)  
     - Evolutionary independence: [High/Moderate/Low]  
     - Taxonomic consensus: [Summary]  
     - Monophyly risk: [Yes/No]  
     - Conclusion: [Species/Subspecies/No rank]  

  3. EVALUATION (Policy)  
     - Statutory coverage: [Yes/No]  
     - Conservation status: [e.g., Endangered]  
     - Consequences: [e.g., High cost, habitat protected]  
     - Final Recommendation: [Protect/Do not protect]  
     - POLICY RATIONALE: [Explicit statement of values/criteria]  
  ```  

  Use this on Monday. I’ve avoided philosophy jargon; it’s built on Mayr, de Queiroz, and Mishler, but your staff won’t need citations.
