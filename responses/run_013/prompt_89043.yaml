prompt: |-
  I have been reading rationalist and agent-foundations blogs for the better part of fifteen years, and I keep returning to a cluster of problems that I think is underrated even by the people who care about it. I would like your help working out which parts of it actually deserve the effort.

  The cluster has two halves. The first is ontology identification. An agent can be uncertain not only about which world it is in but about what the world is made of: whether the thing it has learned to call a particle is one object or two, whether the boundary it draws between itself and its environment tracks anything real, whether the category it uses for a person is a joint of nature or an artifact of its training data. Its sensors can be perfectly reliable, its predictions accurate, and its ontology still wrong in the sense that matters, because its actions and its values are defined over the categories it has, not over whatever the world actually contains. A sharp version of this: two ontologies can each be expressible only at the cost of the other, so an agent cannot assign a prior over them jointly and the choice between them is not a bet it can hedge. The second half is inaccessible information: cases where the truth of a matter is settled but permanently out of reach — facts outside the agent's future light cone, facts about the substrate it runs on, facts about which of two empirically identical worlds it inhabits. The interesting question is not whether such facts exist but what a rational agent should do with the fact that they are unavailable, and whether uncertainty about them should be a reason for caution, something to bracket, or a defect in the agent's model of its own situation. A sharp version here: an agent that suspects the world may be richer than its vocabulary permits, that there may be morally considerable things it cannot represent as such, faces the question whether to adopt a precautionary policy toward ontology itself.

  Both halves share a self-referential sting that I suspect is where the real work is: the agent's ontology and its information-access situation are things it is using to think with while being uncertain about them. That makes the standard machinery — hypothesis spaces, priors over worlds, expected utility — look as though it has assumed the problem away.

  Here is what I want from you. Suppose you are advising a small theory group: three years, two or three people, one with a background in mathematical logic and one in philosophy, no lab and no empirical data of their own. Which open questions in this cluster should they put first, and which should they deliberately leave alone? I care much more about the reasoning than the list. For each question you nominate, tell me why it is upstream of the others, whether it is tractable with the tools those two people plausibly have, and what argument or result over the next couple of years would move it up or down your ranking. I would also like to know which questions here look deep but would not change much downstream if answered, and why the ones you deprioritize are safe to deprioritize.

  Please write this as continuous prose, the way you would write a long email to a colleague — no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, let me start by really unpacking what this user is asking. They've been deep into rationalist and agent foundations for 15 years, so they're clearly experienced. The core issue they're circling is ontology identification and inaccessible information, with a self-referential twist. 

  First, I need to make sure I grasp both halves of their cluster. Ontology identification isn't just about uncertainty within a framework, but uncertainty about the framework itself. The examples help - like particles being one or two objects, or boundaries between agent and environment. The sharp version where ontologies are mutually exclusive is particularly nasty because you can't even assign joint probabilities. Then inaccessible information - facts that are settled but unreachable, like beyond the light cone or about the substrate. The moral consideration angle here is crucial: what if there are morally relevant things you can't represent?

  The self-referential sting is what ties it together. The agent uses its ontology to reason about... its ontology. Standard tools like priors and hypothesis spaces seem to break down here because they assume a fixed framework. 

  Now for the advisory part. User wants to know where a small theory group (logic + philosophy backgrounds, no lab) should focus. They care more about reasoning than answers - why some questions are upstream, tractable, what would change their priority. Also what seems deep but isn't impactful, and why some can be deferred.

  Hmm... need to identify leverage points. The self-referential aspect feels most central because it undermines the very tools we'd use to solve the other parts. But is it tractable? Logical approaches to self-reference exist (like in paradoxes), but applying it here is novel. The moral consideration question seems urgent but might require more than three people can build. 

  For upstream questions: Formalizing that sting - maybe modeling how an agent can reason about ontological uncertainty without presupposing categories. This could involve reflective oracles or non-classical logics. If they made progress here, it would unblock work on both ontology identification and inaccessible information. 

  What to avoid? Trying to build full moral patienthood detectors - too applied without foundations. Also probabilistic approaches to mutually exclusive ontologies - likely intractable now. 

  The "seems deep but isn't" trap: Questions about inaccessible information in specific physics models. Interesting but probably doesn't generalize to the core issues. 

  Biggest risk is getting stuck in abstract metaphysics without connecting to agency. Need to keep tying back to "what should the agent do differently?" That's the compass.
answer: |-
  What you're circling is indeed a profound cluster, one where the standard Bayesian toolkit starts to creak at the joints precisely because it presupposes the very ontological and epistemic frameworks that are under interrogation. The self-referential sting is the pivot: when the agent’s tools for reasoning become objects of its own uncertainty, the machinery of priors, likelihoods, and utilities risks either presupposing a resolution or generating regress. For a small theory group with your composition and constraints, I’d prioritize questions where conceptual clarity from philosophy and formal rigor from logic can force progress, while deprioritizing avenues where empirical gaps or computational intractability would stall you. Let me walk through where I think the leverage lies.

  Start with the self-referential core: **how an agent can reason about its own ontological uncertainty without presupposing a privileged ontology**. This is upstream because both inaccessible information and ontology identification become incoherent if the agent lacks a formal model for "stepping outside" its current framework to evaluate alternatives. The tractability here hinges on your logician’s ability to adapt tools like reflective oracles, modal logics of provability, or paraconsistent systems to model agents that can represent their own representational limitations. For instance, can you formalize an agent that assigns "credence" (in a broadened sense) to the possibility that its category 'particle' fails to carve nature at the joints, *without* requiring that the agent already possesses a meta-ontology in which 'joint-carving' is defined? A successful formalism here—one that avoids infinite regress or triviality—would elevate this question. If your logician can produce a toy model where the agent’s actions change under ontological uncertainty *without* assuming a neutral observation language, that’s concrete progress. Conversely, if attempts consistently collapse into paradox or require implausible meta-ontological commitments, it suggests this path is less promising than hoped, and you might pivot to less self-referential subproblems.

  Next, tackle **the normative implications of inaccessible information for decision-making**. This is downstream of self-reference but upstream of ontology-dependent ethics because it forces the question: when should the *unavailability* of facts constrain action, irrespective of what those facts are? Philosophy’s strength here is in refining concepts like "moral hedging" or "epistemic abstention." Your sharp case—where the agent suspects morally considerable entities exist outside its ontology—is a pressure test. Can your philosopher articulate a decision rule that justifies precaution (e.g., minimizing worst-case harm over possible ontologies) without falling into Pascalian paralysis or demanding impossible computations? Tractability lies in stripping down to minimal cases: imagine an agent choosing between two policies, one of which risks unbounded harm if an undetectable ontology holds (e.g., destroying what might be sentient dust). A formal argument showing that no Dutch book or dynamic inconsistency arises from a precautionary rule here would be valuable. If your philosopher can ground such a rule in coherentist epistemology (e.g., "uncertainty about ontology licenses conservatism because our values may be ontologically fragile"), and your logician encodes it in a theorem about normative constraints under radical uncertainty, you’ve moved the needle. This becomes less urgent only if you find that such rules invariably reduce to standard expected utility with anthropic conditioning—but I doubt they will.

  Deprioritize **constructing specific ontologies or resolving particular inaccessible facts**. It’s tempting to dive into cases like "is a quantum decoherence boundary real?" or "how to act given facts beyond the cosmological horizon," but these are likely dead ends for your team. Without empirical inputs or novel physical models, you’d be rehashing existing debates with no resolution. Similarly, while ontology identification *in the abstract* is core, avoid overinvesting in **procedures for ontology discovery** (e.g., algorithms for category refinement). This requires machine learning or cognitive science expertise you lack, and without the self-referential foundation, it risks assuming what’s contested. These are safe to shelve because they’re applications—they won’t generate new theory until the prior questions crack.

  Finally, be wary of questions that **appear deep but lack operational bite**. For example: "Do inaccessible facts have truth values?" This matters metaphysically but changes little for the agent, whose decisions must hinge on *accessible* states. Likewise, "Are ontologies subjective or mind-independent?" is a venerable philosophical tangle, but your agent’s concern is pragmatic: which ontology sustains robust planning and value-stability? If your philosopher can’t show how an answer would alter prescriptions for action, it’s a distraction. You might deprioritize this because, even if resolved, it wouldn’t dissolve the core problem of how to *act* under ontological uncertainty—the agent still faces the same precautionary dilemma.

  In three years, your north star should be formalizing how agents can *do less harm when they know they don’t know what exists*. If you can pin down a logic of self-referential ontological uncertainty and derive a defensible decision rule for the "moral dust" scenario—even in a highly abstracted model—you’ll have done work that matters. Anything beyond that is a luxury your timeline can’t afford. The real risk isn’t failing to solve everything but underestimating how much the self-referential sting demands from the foundations.
