     If state A, signal is "a" with probability 2/3, "b" with probability 1/3.
     If state B, signal is "b" with probability 2/3, "a" with probability 1/3.

   Now, if you get the signal "a", you update:

     P(A|"a") = [P("a"|A)*P(A)] / [P("a"|A)*P(A) + P("a"|B)*P(B)]
                = (2/3 * 1/2) / (2/3 * 1/2 + 1/3 * 1/2) = (1/3) / (1/3 + 1/6) = (1/3)/(1/2) = 2/3.

     Similarly, P(B|"a") = 1/3.

     So if you see "a", you should choose action X (because it gives 10 with prob 2/3 and 0 with prob 1/3, expected 20/3 ≈ 6.67, while Y gives 0 with prob 2/3 and 10 with prob 1/3, expected 10/3 ≈ 3.33).

     Similarly, if you see "b", you choose Y (expected 20/3).

   Now, what is the expected value if you look?

     With probability 1/2 the state is A, then with prob 2/3 you see "a" and choose X: get 10.
                     with prob 1/3 you see "b" and choose Y: get 0.

     Similarly, in state B: with prob 2/3 you see "b" and choose Y: get 10.
                     with prob 1/3 you see "a" and choose X: get 0.

