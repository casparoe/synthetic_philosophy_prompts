  ### Game Design: Illustrating Good's Theorem

  #### **Objective**:  
  Demonstrate that free information (with no cost) cannot lower expected payoff when acting optimally, even though specific outcomes might be worse than not having the information. Participants experience scenarios where looking sometimes backfires, but the *average* payoff is higher for those who look.

  ---

  ### **Rules and Materials**
  - **Players**: 10-12 (individual play, not teams).
  - **Materials**: 
    - **Dice**: One 6-sided die per player (or shared). Use dice rolls to simulate randomness.
    - **Payoff Table Handout** (distribute at start):
      ```
      MAIN ROUNDS (Rounds 1-5):  
      - States: A (50%), B (50%)
      - Payoffs:
            |       | State A | State B |
            |-------|---------|---------|
            | Action X |   10   |    4    |
            | Action Y |    0   |   10    |

      EXTREME ROUND (Round 6):  
      - States: A (90%), B (10%)
      - Payoffs:
            |       | State A | State B |
            |-------|---------|---------|
            | Action X |   10   |    0    |
            | Action Y |    0   |   10    |
      ```
    - **Recording Sheet** (per player):
      | Round | State (A/B) | Looked? (Y/N) | Signal (a/b) | Action (X/Y) | Payoff |
      |-------|-------------|---------------|--------------|--------------|--------|
      | 1     |             |               |              |              |        |
      | 2     |             |               |              |              |        |
      | ...   |             |               |              |              |        |
      | 6     |             |               |              |              |        |

  - **Signal Rules** (explain verbally and on handout):  
    - If you **look**, you see a signal about the state (no cost).  
    - Signal accuracy:  
      - If true state is **A**: Signal = `a` (66.7%), `b` (33.3%).  
      - If true state is **B**: Signal = `b` (66.7%), `a` (33.3%).  
    - **Optimal actions after signal** (critical!):  
      - In **Main Rounds (1-5)**:  
        - Signal `a` → **Choose X** (expected payoff: 8.0)  
        - Signal `b` → **Choose Y** (expected payoff: 6.67)  
      - In **Extreme Round (6)**:  
        - **Always choose X** (signal doesn’t change optimal action).  
    - If you **don’t look**:  
      - In **Main Rounds**: **Always choose X** (expected payoff: 7.0).  
      - In **Extreme Round**: **Always choose X** (expected payoff: 9.0).  

  ---

  ### **Stage-by-Stage Script** (Total: 75 min)

  #### **Stage 1: Introduction (5 min)**  
  - **Say**: "Today we’ll play a game about the value of information. A theorem called **Good’s theorem** says: *Free information can’t hurt your average payoff if you act optimally afterward*. But sometimes, after seeing information, you end up worse off than if you hadn’t looked. We’ll see why you’d still take the free look every time."  
  - **Distribute** payoff tables and recording sheets.  
  - **Explain**:  
    - "In each round, a hidden **state (A or B)** is randomly determined. You pick an **action (X or Y)** to earn points.  
    - Before choosing, you can **look** at a free signal hinting at the state. The signal is noisy—it’s right 2/3 of the time.  
    - After seeing the signal (or not), you act to maximize your payoff."  
  - **Emphasize**: "You **must follow the optimal actions** on your handout after seeing the signal. Otherwise, the theorem doesn’t hold!"

  #### **Stage 2: Main Rounds 1–5 (20 min)**  
  - **Say**: "We’ll play 5 rounds with 50/50 odds of state A or B. In each round:  
    1. **Roll for state**:  
       - Roll die: 1–3 = State A, 4–6 = State B. Record the state.  
    2. **Decide to look or not**:  
       - If **look**: Roll again for signal:  
         - *State A*: 1–4 = `a`, 5–6 = `b`  
         - *State B*: 1–4 = `b`, 5–6 = `a`  
         - Record signal, then **choose the optimal action** (X for `a`, Y for `b`).  
       - If **don’t look**: **Choose X**.  
    3. **Calculate payoff** using the table. Record all data.  
    - *Example*:  
      - State A (rolled 2) → Look → Signal `b` (rolled 5) → Choose Y → Payoff = 0.  
      - State B (rolled 5) → Don’t look → Choose X → Payoff = 4."  
  - **Facilitate**:  
    - Walk around, enforce optimal actions.  
    - After each round, ask: *"Any regrets? Did looking backfire for anyone?"* (Some will have low payoffs after looking).

  #### **Stage 3: Extreme Round 6 (10 min)**  
  - **Say**: "New round! State A is now 90% likely, B 10%. Roll for state:  
    - **1–5 = A** (≈83%, close to 90% for simplicity), **6 = B**.  
    - Optimal action: **Always choose X**—whether you look or not. The signal won’t change your decision. Why? Because A is so likely, X is best no matter what."  
  - **Play**: Same as before, but all choose X regardless of signal.  
  - **Clarify**: "If you look and see `b`, you might *want* to choose Y—but don’t! The math says X is still better."

  #### **Stage 4: Data Collection (10 min)**  
  - **Aggregate results on a whiteboard**:  
    - **Main Rounds (1–5)**:  
      - For **look** plays: Total payoffs ÷ number of look plays.  
      - For **no-look** plays: Total payoffs ÷ number of no-look plays.  
    - **Extreme Round (6)**: Average payoff for look vs. no-look.  
  - **Expected Averages**:  
    - Main Rounds: Lookers ≈ 7.33, Non-lookers ≈ 7.0.  
    - Extreme Round: Both ≈ 8.33 (since 5/6 of A pays 10, 1/6 of B pays 0).  
  - **Reveal**: "Lookers did better on average in Rounds 1–5! But in Round 6, looking didn’t help."

  #### **Stage 5: Debrief (30 min)**  
  1. **Key Observations**:  
     - *In Main Rounds*:  
       - Some lookers got **0** in State A (signal `b` → Y) while non-lookers got **10** (they chose X).  
       - But lookers also got **10** in State B (signal `b` → Y) while non-lookers got **4** (X).  
       - *Result*: Lookers’ *average* was higher.  
     - *In Extreme Round*: Signal didn’t change actions → same average for all.  

  2. **The Theorem’s Assumptions**:  
     - **Free info**: No cost to look. *If costly, you might skip it*.  
     - **Act optimally**: You must follow the signal’s best action. *If you ignore it (e.g., choose X after `b`), your payoff drops*.  
     - **No unlearning**: You can’t “forget” the signal. *If you could, you might revert to no-info decisions*.  
     - **Private info**: Your choice doesn’t affect others. *If others see your signal, they might exploit you*.  

  3. **Why It Works**:  
     - **Ex ante (before seeing signal)**: Looking raises *expected* payoff (from 7.0 → 7.33). You’d always take the free look.  
     - **Ex post (after seeing signal)**: Sometimes you regret it (e.g., signal `b` in State A → 0 vs. 10). But that’s hindsight! *Before* you see the signal, the bet is worth it.  

  4. **When It Fails**:  
     - **Costly info**: If looking costs 2 points, non-lookers might beat lookers.  
     - **Suboptimal actions**: E.g., in Main Rounds, if you choose X after `b`, your expected payoff drops to 6.0 (worse than not looking!).  
     - **Info leakage**: If others see your signal, they might adjust and hurt you.  
     - **No decision flexibility**: In Round 6, no action changes → info has no value.  

  5. **Real-World Insight**:  
     - "Good’s theorem explains why we seek free info (e.g., weather forecasts, medical tests). Sometimes it backfires (e.g., false alarm causes stress), but *on average*, it’s better to know."  

  ---

  ### **Predictable Challenges & Limitations**  
  1. **First-Run Issues**:  
     - **Players ignore optimal actions**: Some may choose Y after `a` or X after `b` in Main Rounds "just to see." *Solution*: Enforce rules strictly.  
     - **Small-sample distortion**: In 5 rounds, a player might get unlucky (e.g., 3 bad signals) and swear looking hurts. *Solution*: Aggregate all players’ data to show averages.  
     - **Extreme round confusion**: Players may think signal `b` means "choose Y." *Solution*: Stress: "X is always better here—trust the math!"  

  2. **What the Game Can’t Replicate**:  
     - **Risk aversion**: The game assumes players maximize *expected points*. Real people may avoid risks (e.g., prefer a sure 7 over a gamble averaging 7.33).  
     - **Complex beliefs**: Players might doubt the dice probabilities ("I never roll A!"). The theorem assumes rational belief in the odds.  
     - **Emotional regret**: The game can’t capture the *feeling* of regret when looking backfires. You must explain: "Rationality is about expectations, not hindsight."  

  **Final Note**: Use the dice rolls to make probabilities tangible. If players question the 83% in Round 6 (vs. 90%), clarify it’s a simplification—the lesson holds. Emphasize that Good’s theorem is foundational in decision theory, showing why free information is (almost) always valuable!
