     - **Fits verdicts**: Explains ant colonies (stigmergy) vs. starlings (no integration). Corporations fail because information flow is hierarchical, not emergent.  
     - **Limitation**: Doesn't explain why slime mould (which uses trails) has no mind—likely because it lacks interactivity.  
     - **Prediction for swarm**: **Mind** (if robots use ant-like stigmergy, e.g., environmental markers).

  3. **Complexity threshold rule**:  
     - "A collective has a mind if it exhibits multiple, context-sensitive behaviors (e.g., foraging, fighting, building) that can't be predicted from local rules alone."  
     - **Fits verdicts**: Ant colonies and brains pass; starlings and slime mould (single-behavior systems) fail.  
