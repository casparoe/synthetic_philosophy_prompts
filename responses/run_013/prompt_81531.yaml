prompt: |-
  Been messing around with interpretabillity on small open models, and there's a pattern I keep hitting that I dont have a word for. I train a linear probe on a middle layer for some property -- whether the current token sits inside a string literal, whether the sentence so far contains an odd number of negations, something like that -- and it comes out at 95%+. But then I ablate that direction, or steer along it, and the model's behaviour barely moves. The information is plainly legible to the probe, but the rest of the network doesn't seem to be using it. Then the mirror image happens too: I patch a single activation or swap a direction and the whole output flips, yet no probe I can train at that layer predicts the property at all. So "the network has it" and "the network uses it" come apart in both directions, and I'm no longer sure those are even the same axis. Is there an established name for this, or a name for each half of it, and if the field only has a word for one of the two, what would you call the other? I don't really care about the label, I care about where the line falls. When is a probe reading a representation the model actually has, versus decoding a correlation that only exists because the probe gets to look at the whole layer at once -- and how would I ever tell those apart from the outside? And in the unused case, is there any sense in which the model represents the property at all, or is that just a fact about my probe?
reasoning: |-
  Okay, the user is working on interpretability with small open models and has encountered a recurring issue. They train linear probes that achieve high accuracy on specific properties like string literal detection or negation counts, but ablating or steering those directions doesn't affect model behavior. Conversely, sometimes tweaking a single activation flips outputs, yet no probe can predict the relevant property. They want to know if there's terminology for this decoupling and how to distinguish between genuine representation and probe artifacts.

  First, I need to break down their problem. The core issue is the dissociation between what the probe detects and what the model actually uses. The user mentions two scenarios: high-probe accuracy without behavioral impact (unused information), and behavioral changes without corresponding probe detection (unused computation). 

  For terminology, "representational vs. functional presence" comes to mind. The probe measures representational presence—information exists in activations. Functional presence is whether the model uses it for outputs. Established terms might include "superposition" for multiple features in a layer or "causal scrubbing" for testing necessity. 

  The user's deeper needs involve distinguishing real representations from probe-induced artifacts. They might be concerned about the validity of their probes. Also, they might want reliable methods to identify if a feature is utilized by the model, which is crucial for debugging or improving models. 

  To address this, I should cover why probes can be misleading. Probes can exploit correlations rather than causal features. For example, the probe might use indirect cues that aren't part of the model's computation. Techniques like causal interventions (ablation, steering) are necessary to test functionality. 

  For the unused case, the information might be present but not necessary for the task, or used differently. The user questions if the model truly "represents" the property if it's unused. This touches on philosophical aspects of representation in AI. 

  Suggestions for distinguishing include using multiple probes, causal methods, and analyzing downstream effects. The user needs practical approaches, so emphasizing methods like path patching or activation editing would help. Also, considering the layer's role—residual streams might hold information for later layers, explaining unused features. 

  I should ensure the response clarifies the difference between correlation and causation in probes, validates the user's observations with existing concepts, and provides actionable solutions. Highlighting terms like "superposition" and "causal mediation" can frame their issues within established literature, helping them communicate findings effectively.
answer: |-
  What you're describing is a **fundamental and widely recognized challenge in mechanistic interpretability**. The field doesn't have universally agreed-upon *single* terms for each half, but there are established concepts and phrases used to discuss this exact decoupling. Here's the breakdown:

  1.  **The "Information is Legible but Unused" Case (Probe finds it, ablation/steering does nothing):**
      *   **Established Concepts/Phrases:**
          *   **"Superfluous Representation" / "Non-Functional Information":** The information is encoded in the activations but isn't causally necessary for the model's output on the task you're probing *or* the tasks you're testing behavior on. It might be a side effect of the computation, correlated information, or used for a different task entirely.
          *   **"Representational Presence vs. Functional Relevance":** The representation *exists* (presence), but it lacks *relevance* for the specific computation leading to the output you're observing (function).
          *   **"Probe-Decodable but Not Causal":** Highlights the core issue: decodability doesn't imply causality.
          *   **"Superposition Artifact":** In models using superposition, features can be represented in directions that aren't the primary driver for downstream computations. The probe finds the *direction* holding the information, but that direction isn't the one strongly read out by later layers for the task.
          *   **"Residual Information":** Information left over from earlier computations that hasn't been "cleaned up" and isn't actively used by subsequent layers for the primary output path.

  2.  **The "Information is Used but Not Legible" Case (Patching flips output, probe can't find it):**
      *   **Established Concepts/Phrases:**
          *   **"Distributed Computation" / "Non-Linear Dependence":** The property isn't cleanly encoded in a single direction or a small set of easily separable directions. It emerges non-linearly from the interaction of many features. Linear probes are fundamentally limited here.
          *   **"Probe-Opaque Feature":** The feature is causally relevant, but its representation isn't linearly separable from other features in the activation space at that layer.
          *   **"Mechanism not State":** The critical thing being patched might be a specific *computation* happening at that point, not a static representation of a semantic property. You're interfering with the *process*, not reading a *fact*.
          *   **"Superposition Masking":** The causal feature is represented, but it's entangled with other features in the same directions via superposition, making it difficult for a linear probe (which looks for a *single* direction) to isolate.
          *   **"Causal Mediation without Linear Encoding":** The activation vector at that point plays a causal role in mediating the output flip, but the mediating factor isn't a simple linear encoding of the high-level property you're interested in.

  **The Core Distinction & How to Frame It:**

  The fundamental line you're grappling with is:

  *   **Representational Presence:** *Is information about property X linearly decodable from activation vector A?* (What your probe measures.)
  *   **Causal/Functional Relevance:** *Does the information about property X encoded in (or passing through) activation vector A play a causal role in determining the model's output Y for the task(s) of interest?* (What ablation/patching/steering measures.)

  **Your Key Questions Answered:**

  1.  **"When is a probe reading a representation the model actually has, versus decoding a correlation?"**
      *   **The Model "Has" It (Representationally):** If a *simple* probe (like linear) can decode it significantly above chance *across diverse, held-out inputs* covering the relevant distribution. This indicates the information is reliably present in a way accessible to *some* readout mechanism. However, this **does not** guarantee it's being used causally by *this specific model* for *this specific output*.
      *   **Decoding a Correlation:** This is likely if the probe accuracy is high but:
          *   **Fails under Causal Intervention:** Ablation/steering doesn't change the relevant output behavior.
          *   **Relies on Input Correlates:** The probe might be latching onto features strongly correlated with X in the *training data* but not actually computed/used by the model internally (e.g., the probe learns parts of the input encoding correlated with X, not a computation *result*).
          *   **Is Fragile/Non-Robust:** Accuracy drops significantly on slightly different distributions or adversarial examples crafted against the probe.

  2.  **"How would I ever tell those apart from the outside?"**
      *   **The Gold Standard is Causal Intervention:** Probe accuracy tells you about *presence*. **You *must* use techniques like activation patching, path patching, causal scrubbing, steering, or directional ablation to test *causal relevance*.** If changing the representation (e.g., ablating the probe direction, overwriting it, patching in counterfactual values) *does not* reliably change the specific model behavior you associate with X (e.g., predicting string tokens correctly, handling negation correctly), then the information, while present, isn't causally necessary *for that behavior*.
      *   **Look for Specificity:** Does steering the probe direction *only* affect behaviors logically tied to X? If steering "inside string" makes the model output more string-like tokens *and only in contexts where it should*, that's evidence for causal relevance. If it causes nonsensical changes everywhere, it might be disrupting something else.
      *   **Probe Downstream Layers:** Train probes for X on *later* layers. If the information *disappears* or becomes less linearly separable downstream, it suggests it wasn't functionally important and wasn't preserved. If it becomes *more* linearly separable, that's evidence it *is* being used and refined.
      *   **Check for "Cleaning":** Does the model actively remove this information later if it's not needed? (This is harder to detect).

  3.  **"In the unused case, is there any sense in which the model represents the property at all, or is that just a fact about my probe?"**
      *   **Yes, it represents it (Representationally).** The probe result isn't *just* a fact about the probe. The high accuracy demonstrates that the *information necessary to compute X* is reliably present in the activations at that layer. The model computed *something* that contains that information. However, **it doesn't represent it *for the purpose* of influencing the specific output Y you care about.** It might be:
          *   A byproduct of computation needed for something else.
          *   Information computed early but discarded later.
          *   Information used for a different task or output head entirely.
          *   Encoded in a way not conducive to linear readout by the *model's own* subsequent weights (e.g., trapped in superposition directions the model doesn't amplify).

  **In Summary:**

  *   **Your Probe Finds It, But Ablation Does Nothing:** You've found **Non-Functional Information** or a **Superfluous Representation**. The model computes it (represents it), but doesn't *use* it for the output you're testing.
  *   **Patching Flips Output, But Probe Can't Find It:** You've found a **Causally Relevant but Probe-Opaque Feature** or a **Distributed Computation**. The model *uses* the state of that activation vector critically, but the high-level property you care about isn't linearly encoded there; it's either computed non-linearly from many features or the vector mediates the computation in a way not captured by a linear projection of your property.

  **The field is actively grappling with this decoupling.** Your observations highlight the limitations of linear probes alone and underscore the absolute necessity of **combining representation analysis (probes) with causal intervention techniques (patching, ablation, steering)** to understand what information is truly *used* by the model's computation, not just what information *exists* in its activations. The line falls precisely at the point where intervention changes the output behavior in a specific, predictable way tied to the property.
