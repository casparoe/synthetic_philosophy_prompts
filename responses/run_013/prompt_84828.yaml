  We are building a procedure based on Gricean pragmatics to analyze utterances in workplace conduct cases. The goal is to determine whether an utterance carried meanings beyond the literal words, and to classify those meanings into one of the categories: literal meaning, impliciture/explicature, conversational implicature, or conventional implicature. We must respect the intention condition and avoid relying on the speaker's inner state (only public evidence).

  The procedure must be step-by-step, use only public evidence (what was said, to whom, where, history), and return one of a fixed set of verdicts. We must also identify steps that require judgment and have a default when evidence is thin.

  Fixed set of verdicts (to be used in the report or as background):
  1. Literal meaning only: no additional meaning beyond the literal words.
  2. Impliciture/Explicature: content that is not literally encoded but is part of what is asserted (cannot be withdrawn without contradiction).
  3. Conversational implicature: meaning that is calculable from the context, cancellable, and either detachable or not.
  4. Conventional implicature: meaning carried by specific words (like "but", "even") that survives denial and embedding.
  5. No meaning beyond literal: when the case does not meet the criteria for any of the above.

  Additionally, we might have:
  - Background: Ambiguous (when there is evidence for and against, but not sufficient to decide) - this would not be a finding but background for the investigator.
  - Background: Insufficient evidence (when there isn't enough public context to decide) - similarly, not a finding.

  We must also handle the case of a remark that is designed to be recognized only by some (the "esoteric" case) and the speaker denies intent.

  Procedure Steps:

  1. **Record the literal meaning**: Write down the exact words and their literal semantic content. This is the baseline.

  2. **Check for conventional implicature**: Look for words that conventionally carry additional meaning (e.g., "but", "even", "therefore"). If present, note the conventional implicature. This is non-cancellable and non-detachable (it comes with the word regardless of context).

  3. **Determine the context**: Gather public context: who was present, the relationship between speaker and hearer(s), the physical setting, the history of interactions (documented and known in the group), and the immediate conversational context (what was said before/after). This must be based on evidence: emails, past incidents, known team practices, etc.

  4. **Identify what was asserted (impliciture/explicature)**: Consider what a competent speaker in that context would take as being asserted (even if not literally encoded). This is the explicature. To test: if the speaker were to deny this content, would it contradict the original utterance? If yes, then it's explicature. This step relies on context and general linguistic competence.

  5. **Check for conversational implicature**:
     a. **Calculability**: Using Grice's maxims (Quality, Quantity, Relation, Manner), can we derive an implicature from the literal meaning and the context? The derivation must follow the pattern: the speaker said P; there is no reason to think the speaker is not observing the maxims; the speaker must think Q to maintain the assumption of cooperation; and the speaker must expect the hearer to work out that Q is intended.
     b. **Cancellability**: If the speaker denies the implicature, does it create a contradiction? If not (i.e., if the denial is consistent with the original utterance), then it is cancellable and hence a candidate for conversational implicature.
     c. **Detachability**: If we change the words (without changing the literal meaning) and the implicature disappears, then it is detachable. Note: this step is less critical for our purpose but can help.

     However, note that the intention condition is key: the speaker must have intended the hearer to infer the implicature and for that inference to be based on the recognition of the intention.

  6. **Intention condition**: We must determine if the speaker intended the audience to recognize the intended meaning (if any). But we cannot ask the speaker or rely on their denial. Instead, we use public evidence to assess whether the meaning was recognizable to the audience (or a subset). If the meaning was recognizable (even if not actually recognized) then the intention condition is satisfied (because we assume a rational cooperative speaker would only say something if they intended the meaning to be recognized). However, if the context does not support the recognizability, then we cannot attribute the implicature.

     How to assess recognizability? We look at the context (step 3) and ask: would a reasonable member of the audience (with the knowledge of the context) have recognized the intended meaning?

     Important: The hearer's private inference without recognizability by the context does not count. Also, if the remark was designed so that only some (with special knowledge) would recognize it, that is still an implicature for that subgroup if the context makes that knowledge available to them.

     However, if the speaker denies intent, we ignore that denial (as per the requirement) and rely solely on public evidence.

  7. **Special case: Esoteric remark (some get it, some don't)**: If the remark is such that in the context, a subgroup (with specific history or knowledge) would recognize the implicature and others would not, then we must consider the intended audience. If the remark was directed to the subgroup (or the context makes it clear that the subgroup is the intended audience) then the implicature is present for them. But note: the speaker's intent is judged by what a reasonable speaker would intend in that context. If the context includes the subgroup's shared history, then the implicature is recognizable to them and we can attribute it.

  8. **Judgment calls and defaults**:
     - Step 4 (explicature) and step 5a (calculability) require judgment. We must rely on what a competent speaker in that context would understand. If there is ambiguity or insufficient evidence, we fall back to the literal meaning.
     - Step 6 (intention condition via recognizability) is also a judgment call. The default: if the evidence for recognizability is thin (e.g., no shared history, no contextual clues), then we cannot attribute an implicature.

     Default when evidence is thin: We return "Literal meaning only" or "Insufficient evidence" (if the context is unclear). But note: we are to return one of the fixed set. So:
        - If the context is insufficient to determine explicature or implicature, then we return "Literal meaning only" and note in the background that context was insufficient to establish further meaning.
        - If there is evidence but it is ambiguous, we might return "Ambiguous" as background (but not as a finding). For the report, we would state that no implicature (or explicature) was established.

