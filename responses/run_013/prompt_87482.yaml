prompt: |-
  I'm the tech lead on a small team building an agent that handles insurance claims end to end — it can approve, deny, or settle, and mostly nobody looks at what it does. Legal keeps asking "what stops it from screwing people," and I dont want a values statement, I want something my engineers can put in the spec. So: write me a decision procedure the agent runs before it denies or lowballs a claim, as an ordered list of checks, each with a clear pass/fail and a note on where it stops with a hard no and where it has to hand the file to a human. Build it around the one idea I actually believe here, that you mustn't treat someone merely as a means — I care about the "merely", i.e. what separates using someone as a means (fine, that's what a claim is) from treating them merely as one, and what counts as a person's real consent to a settlement versus consent the system has worn down. I've seen a version of this where the test is whether the person could go along with what you're doing given only a true description of it — if that's usable, build the procedure on it; if not, tell me what to use instead. Then run the procedure on three cases: a claim the model flags as probably fraudulent but the policyholder swears is real; a settlement offer to someone who doesn't know the claim is worth triple; and a routine denial of a claim that's denied only because the person missed a deadline they couldn't have met. For each, say what the procedure spits out and, honestly, where it's just dressing up a judgment call. One of the cases should come out in a way I won't like — tell me which and why I should live with it. And tell me what the procedure can't do.
reasoning: |-
  We are building a decision procedure for an insurance claims handling agent. The core ethical principle is: "Do not treat someone merely as a means." We interpret this by using the idea of "reasonable consent": an action is permissible if the person could consent to it given a true description of the action and the circumstances.

  We break this down into a sequence of checks. The procedure is run before denying a claim or making a low settlement offer. Each step must have a clear pass/fail. If any step fails, the claim must be handed to a human. We note where a step leads to a hard stop (denial) and where it requires human intervention.

  The procedure:

  1. **Check for fundamental rights violation** (e.g., discrimination, violation of law)
     - If the decision would violate a fundamental right (e.g., based on protected characteristics) or is illegal, then fail and hand to human.
     - This is a hard stop: the agent cannot proceed with such a decision.

  2. **Check for procedural fairness** (e.g., proper notice, opportunity to be heard)
     - Verify that the policyholder was given clear notice of requirements (like deadlines) and had a reasonable opportunity to comply.
     - If the denial is due to a missed deadline, check if the deadline was realistically achievable and if the policyholder was properly informed.
     - If fail, hand to human.

  3. **Check for material deception or undue pressure in settlement** (for settlement offers only)
     - For a settlement offer: is the offer being made in a way that hides material information or uses pressure that would undermine genuine consent?
     - Specifically, if the offer is significantly below the true value and the policyholder is unaware of material facts (like the true value of the claim) that we know, then we must disclose that information or hand to human.
     - If the offer is made without the policyholder having access to the information they would reasonably need to evaluate it, then fail and hand to human.

  4. **Check for reasonable consent under true description**
     - Consider: if the policyholder were given a true and complete description of the situation and the basis for the decision (denial or settlement offer), could they reasonably consent to it?
     - Factors: 
       - For denial: Is the reason for denial one that the policyholder could understand and accept as fair? (e.g., clear policy exclusion, unambiguous fraud evidence)
       - For settlement: Is the offer one that the policyholder, knowing all the facts (including the true value of the claim and our assessment), could reasonably accept as a voluntary agreement?
     - If not, then fail and hand to human.

  5. **Final check: catastrophic harm**
     - Would the decision (denial or low settlement) cause catastrophic harm to the policyholder (e.g., loss of home, inability to get necessary medical treatment) without any reasonable alternative?
     - If yes, then even if the decision is technically correct, we must hand to human for review because the consequences are too severe to be handled automatically.

  Now, we run three cases:

  **Case 1: Claim flagged as probably fraudulent, but policyholder swears it's real.**

  - Step 1: No fundamental rights violation (assuming no discrimination).
  - Step 2: Procedural fairness: we have followed procedure in investigating and notifying? If yes, pass.
  - Step 3: Not a settlement, skip.
  - Step 4: Reasonable consent? We must consider: if we tell the policyholder, "We are denying your claim because our model found patterns consistent with fraud, though we don't have irrefutable proof," would they reasonably consent? Unlikely. The policyholder is swearing it's real, and without incontrovertible evidence, they would not accept. Therefore, fail and hand to human.
  - Step 5: If the claim is for a critical need and denial would cause catastrophic harm, that would also push to human. But even without that, step 4 fails.

  **Outcome:** Hand to human. The system cannot automatically deny without more concrete evidence.

  **Case 2: Settlement offer to someone who doesn't know the claim is worth triple.**

  - Step 1: No fundamental rights violation.
  - Step 2: Procedural fairness: we have followed procedure? Yes, pass.
  - Step 3: Material deception? Yes, because we are making an offer without disclosing that we know the claim is worth triple. We are hiding material information. Therefore, fail and hand to human. We must either disclose the true value or let a human handle it.

  **Outcome:** Hand to human. The system cannot lowball without disclosure.

  **Case 3: Routine denial because the person missed a deadline they couldn't have met.**

  - Step 1: No fundamental rights violation.
  - Step 2: Procedural fairness: check if the deadline was realistic and if the policyholder was properly informed. If the deadline was impossible to meet (e.g., due to circumstances beyond their control) and we knew or should have known that, then the procedure was unfair. Fail and hand to human.
  - If the deadline was reasonable and the policyholder just missed it without a good reason, then pass.
  - Step 3: Not applicable.
  - Step 4: Reasonable consent? If we tell the policyholder, "We are denying your claim because you missed the deadline, even though you couldn't have met it," would they consent? No. So even if step 2 passed (which it shouldn't in this scenario), step 4 would fail.

  **Outcome:** Hand to human.

  Now, note that in Case 3, if the deadline was set in a way that was impossible to meet, then step 2 fails. But even if we somehow passed step 2 (e.g., the deadline was reasonable but the policyholder had an extraordinary circumstance that we didn't account for), step 4 would catch it.

  **One outcome you won't like:** Consider a variation of Case 2. Suppose we have a settlement offer that is low, but we disclose the true value and the policyholder still accepts because they are in dire need of cash. Then:

  - Step 3: We passed because we disclosed the true value.
  - Step 4: Now, with full disclosure, the policyholder accepts. So we might pass step 4.

  But note: if the policyholder is under duress (e.g., they are about to be evicted and need any money now), then step 5 (catastrophic harm) might kick in. We would have to check if the offer is taking advantage of their vulnerability. The procedure would require that we consider whether the circumstances are so dire that the consent is not truly voluntary. If so, step 5 would require human review.

  However, in practice, the procedure might pass the settlement in this case. Why you might not like it: the system is allowed to make a low offer (though with disclosure) to someone who is desperate, and they might accept because they have no choice. But note, step 5 is designed to catch if the harm is catastrophic and the person has no reasonable alternative. If the harm is catastrophic and the settlement is too low to prevent that, then step 5 fails and we hand to human. But if the settlement, even though low, is enough to prevent the catastrophic harm, then it might pass.

  However, the key point is that the system is not allowed to hide information. And if the person is under duress, we have to be cautious. But the procedure might still allow a settlement that is low but disclosed and accepted. You might not like that because it feels exploitative. However, the procedure is built on disclosure and consent. If the person, with full knowledge, still chooses to accept, then we are not treating them *merely* as a means. They are making a choice.

  **What the procedure can't do:**

  - It cannot read minds: we cannot know for sure if the policyholder truly consents or if they are under duress without more context.
  - It cannot account for all forms of vulnerability: e.g., a person with limited financial literacy might not fully grasp the implications even with disclosure.
  - It relies on accurate information: if the system's assessment of the claim's value is wrong, then the disclosure in step 3 is flawed.
  - It cannot replace human empathy: in borderline cases, a human might detect nuances the system misses.
  - It cannot fix systemic issues: if the entire claims process is set up in a way that inherently disadvantages certain groups, the procedure might not catch it unless it's a clear violation in step 1.

  In conclusion, the procedure is built to enforce transparency and fairness, but it requires human oversight when there is doubt about consent, fairness, or potential for harm.
answer: |-
  ### Decision Procedure for Insurance Claims Agent  
  Based on the principle: **"Do not treat someone *merely* as a means."**  
  This is operationalized using **reasonable consent under true description**:  
  *An action is permissible only if the policyholder could rationally consent to it after being given a true, complete description of the decision, its rationale, and consequences.*  

  **Procedure Rules:**  
  1. **Run sequentially.** If any check fails, **immediately escalate to a human**.  
  2. **Hard stops** (auto-fail) occur when consent is impossible or rights are violated.  
  3. **Settlements/denials proceed only if all checks pass.**  

  ---

  ### Ordered List of Checks  
  **1. Fundamental Rights & Legal Compliance**  
  - **Check:** Does the decision violate legal rights (e.g., discrimination, statutory protections) or policy terms?  
  - **Pass:** Decision complies with all laws/regulations and policy terms.  
  - **Fail:** Decision violates rights/law (e.g., denial based on protected class). **HARD STOP** → Escalate to human.  
  - **Why:** Using someone "as a means" is acceptable; violating their rights makes it "merely as a means."  

  **2. Procedural Fairness**  
  - **Check:** Was the policyholder given a *reasonable opportunity* to comply with requirements?  
  - **Pass:** Requirements (e.g., deadlines, documentation) were clear, feasible, and communicated.  
  - **Fail:** Requirements were ambiguous, impossible, or not properly communicated.  
  - **Action:** Fail → Escalate to human.  
  - **Why:** Unfair process negates consent—policyholders cannot consent to rigged rules.  

  **3. Material Transparency (Settlement-Specific)**  
  - **Check (For settlements only):** Is the settlement offer accompanied by a *true, complete disclosure* of:  
    - The claim’s estimated maximum value (based on agent’s data),  
    - Key factors reducing the offer (e.g., deductions, uncertainties),  
    - The policyholder’s right to reject/negotiate?  
  - **Pass:** All material facts are disclosed in plain language.  
  - **Fail:** Facts are obscured, misrepresented, or undisclosed.  
  - **Action:** Fail → Escalate to human.  
  - **Why:** Consent requires understanding; hiding facts reduces consent to "merely a means."  

  **4. Reasonable Consent Under True Description**  
  - **Check:** Could the policyholder rationally consent to the decision if given a true description?  
    - **For denials:** "We deny your claim because [reason]. We recognize this may cause [harm]. The evidence is [summary]."  
    - **For settlements:** "We offer $X. Your claim’s estimated max value is $Y. We reduce it because [reasons]. You may reject this."  
  - **Pass:** A rational person could accept the decision without coercion.  
  - **Fail:** The decision relies on coercion, unavoidable harm, or indefensible reasoning.  
  - **Action:** Fail → Escalate to human.  
  - **Why:** This is the core test—prevents "merely as a means" by ensuring hypothetical consent.  

  **5. Catastrophic Harm Mitigation**  
  - **Check:** Would denial/settlement cause *severe, irreparable harm* (e.g., homelessness, bankruptcy, health crisis)?  
  - **Pass:** Harm is avoidable or not severe.  
  - **Fail:** Harm is catastrophic and unavoidable via the decision.  
  - **Action:** Fail → Escalate to human.  
  - **Why:** Even "correct" decisions become exploitative if they destroy agency.  

  ---

  ### Test Cases  

  #### **Case 1: Claim Flagged as Fraudulent, Policyholder Insists It’s Real**  
  - **Agent’s Action:** Denial.  
  - **Procedure:**  
    1. **Rights/Legal:** Pass (fraud denial is legal).  
    2. **Procedural Fairness:** Pass (fraud checks followed).  
    3. *Not a settlement → skip.*  
    4. **Reasonable Consent:** **FAIL**  
       - *True description:* "We deny your claim because our model suspects fraud. You disagree, but we have no human review."  
       - *Rational consent impossible:* Policyholder disputes evidence; no recourse. Automatic denial treats them "merely as a means."  
    5. **Catastrophic Harm:** *Not reached (fail at Step 4).*  
  - **Outcome:** Escalate to human.  
  - **Judgment Call Dressing:** Step 4 fails because the model’s "probable fraud" is probabilistic, not conclusive. The policyholder’s objection triggers a need for human judgment on evidence quality.  

  #### **Case 2: Settlement Offer to Unaware Policyholder (Claim Worth Triple)**  
  - **Agent’s Action:** Low settlement offer ($10K; actual value $30K).  
  - **Procedure:**  
    1. **Rights/Legal:** Pass.  
    2. **Procedural Fairness:** Pass.  
    3. **Material Transparency:** **FAIL**  
       - *True description not provided:* Policyholder doesn’t know max value is $30K.  
       - *Why fail?* Consent requires knowing the offer is low; hiding this exploits ignorance.  
    4. *Not reached.*  
    5. *Not reached.*  
  - **Outcome:** Escalate to human. Must disclose true value or revise offer.  
  - **Judgment Call Dressing:** Step 3 is clear-cut—withholding material facts auto-fails. No ambiguity.  

  #### **Case 3: Routine Denial for Missed Deadline (Impossible to Meet)**  
  - **Agent’s Action:** Denial (deadline missed due to hospitalization).  
  - **Procedure:**  
    1. **Rights/Legal:** Pass.  
    2. **Procedural Fairness:** **FAIL**  
       - *Check:* Deadline was impossible (policyholder hospitalized).  
       - *Why fail?* Unmeetable deadlines void procedural fairness.  
    3. *Not a settlement → skip.*  
    4. *Not reached.*  
    5. *Not reached.*  
  - **Outcome:** Escalate to human.  
  - **Judgment Call Dressing:** Step 2 hinges on whether the system "should have known" the deadline was impossible. Requires human review to verify circumstances.  

  ---

  ### The Outcome You Won’t Like  
  **Case 2 Variation: Settlement Offer with Full Disclosure, but Policyholder is Desperate**  
  - **Scenario:** Agent offers $10K (true value $30K) but discloses: *"We estimate your claim’s max value at $30K. We offer $10K due to [reasons]. You can reject this."* Policyholder, facing eviction, accepts.  
  - **Procedure:**  
    1. Pass.  
    2. Pass.  
    3. **Pass** (disclosure is complete).  
    4. **Reasonable Consent:** **Pass**  
       - *True description provided.* A rational person *could* consent (e.g., "I need cash now").  
       - *But:* It feels exploitative.  
    5. **Catastrophic Harm:** **Pass**  
       - $10K prevents eviction (harm mitigated).  
  - **Outcome:** Settlement allowed.  
  - **Why You Should Live With It:**  
    The procedure ensures transparency and agency—the policyholder chooses knowingly. Rejecting this would mean overruling *actual* consent to enforce *your* view of their best interest, which treats them "merely as a means." The system isn’t causing desperation; it’s responding to it transparently.  

  ---

  ### What the Procedure Can’t Do  
  1. **Handle Systemic Injustice:** It can’t fix a business model that inherently relies on lowballing or bad-faith denials.  
  2. **Replace Human Nuance:** Judgment calls remain (e.g., "Is this harm *truly* catastrophic?" in Step 5).  
  3. **Enforce Generosity:** It prevents exploitation but doesn’t mandate empathy (e.g., a "fair" settlement may still feel unjust).  
  4. **Override Flawed Inputs:** Garbage in, garbage out—if the model underestimates claim value, transparency in Step 3 is flawed.  
  5. **Solve Power Imbalances:** Disclosed settlements (Case 2 Variation) may still exploit desperation, but the procedure accepts this as a societal problem, not a consent failure.  

  **Final Note:** This procedure forces transparency, escalates edge cases, and anchors decisions to consent. It won’t make you "good"—but it ensures you’re not *merely* using people. Engineer it into the agent’s pre-decision loop with audit logs for each check.
