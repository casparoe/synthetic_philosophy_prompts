prompt: |-
  Hi, I'm a high school student and I'm in this philosphy club where we read old essays. This week it's Frank Ramsey and I'm definately stuck on this bit. Here's the passage from our handout:

  "But before we proceed further with the analysis of judgment, it is necessary to say something about truth and falsehood, in order to show that there is really no separate problem of truth but merely a linguistic muddle. ... Suppose first that it is explicitly given; then it is evident that 'It is true that Caesar was murdered' means no more than that Caesar was murdered, and 'It is false that Caesar was murdered' means that Caesar was not murdered. ... In the second case in which the proposition is described and not given explicitly we have perhaps more of a problem, for we get statements from which we cannot in ordinary language eliminate the words 'true' and 'false'."

  I don't get how "It is true that Caesar was murdered" can mean *no more* than "Caesar was murdered." The second one doesn't say anything about truth at all, so it seems like the first one is adding something, namely that the claim is true. And if "true" really adds nothing, why do we even have the word? Like when someone says "everything he says is true," you can't just delete "true" and get a sentence that works. So what is Ramsey actually claiming here, and what's the "linguistic muddle" he says truth is? I feel like I'm missing something obvious.

  Also, please tell me what would change your mind about your reading of the passage, and where your interpretation is most likely to be wrong.
