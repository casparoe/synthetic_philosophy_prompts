prompt: |-
  Ok so I'm in this "life in the universe" module thats cross-listed with philosophy of biology and our essay is basically "what would a definition of life have to get right." I dont want another definition though, I want the spec first — like, before I pick a side, tell me what the thing has to deliver.

  So: the desiderata list, and for each one, the case that forces it. Viruses are the obvious one but I want the actually awkward ones: viroids (just a naked RNA loop and nothing else), prions (infectious protein, no nucleic acid anywhere), mules (unmistakably alive, can't reproduce), red blood cells (no nucleus, don't divide), mitochondria (own genome, divide on their own, can't live free), spores (metabolically dead for millennia and then fine), lichens (like two or three organisms pretending to be one). And the cases where the answer flips depending on where you draw the line — a virus sitting on a table is inert, the same virus inside a cell is part of something that reproduces, so is the question about the entity or about the system?

  Also we got two made-up cases in class and I genuinely can't tell if they're meant to break definitions or not: (1) a self-sustaining reaction network in a beaker that keeps itself going indefinitely but never reproduces or evolves, and (2) a lab molecule that copies itself and mutates but has no metabolism at all. I'd like the list to say what a definition has to do with those two.

  Things I think are requirements but could be wrong: it can't be circular (no defining life via evolution if fitness then gets defined via reproduction); it has to either say something about non-carbon/non-water life or admit it can't; it should be usable by a rover that has to call "life detected" with no human in the loop; and it should track the ordinary concept at least somewhat, or else explain why we're allowed to ignore it.

  Which of those are real requirements and which are just one camp's prejudice? Which pair can't both be met — I suspect "general enough for alien life" vs "specific enough to be useful," but tell me if thats wrong. Which single requirement knocks out the most candidate definitions? And if the answer is "it depends what the definition is for," then say what the different for's are and which desiderata come and go with each — also, someone in seminar said it's all a family-resemblance concept and we should stop asking; is that a way of satisfying the list or just refusing to write one? Table is fine if thats easier.
reasoning: |-
  Okay, let me unpack this user's query. They're tackling a philosophy of biology essay on defining life, but they don't want definitions—they want the criteria those definitions must satisfy. The user is clearly frustrated with superficial approaches and wants to dig into the hard cases: viroids, prions, mules, RBCs, mitochondria, spores, lichens. Plus those tricky hypotheticals from class. 

  Hmm, interesting how they're framing this as "specs before implementation"—like an engineer designing against requirements. Smart angle. They also explicitly want to know which requirements are legit versus ideological, and where trade-offs exist (e.g., alien-life generality vs. rover-deployable specificity). 

  First, I should map all their edge cases to potential desiderata. Viruses are the gateway drug, but they want weirder stuff: 
  - Viroids force the question: Can something with zero machinery besides replicating RNA be alive? 
  - Prions break the "nucleic acid essentialism" in definitions. 
  - Mules challenge reproduction as non-negotiable. 
  - RBCs test whether metabolism alone suffices. 
  - Mitochondria are organelle-or-organism paradoxes. 
  - Spores ask how suspended animation fits. 
  - Lichens force us to decide: Is "life" a property of individuals or systems? 

  Then those synthetic cases: 
  - The perpetual chemical network tests whether evolution is necessary. 
  - The replicating molecule asks if replication without metabolism counts. 

  User also lists implicit requirements: non-circularity, non-Earth-centrism, rover-compatibility, and ordinary-language alignment. But they're suspicious these might be partisan preferences. Absolutely—philosophers love smuggling assumptions into criteria! 

  Biggest tension I see: A definition broad enough to handle aliens might be useless for a rover (e.g., "autopoietic systems" can't be detected by sensors). Whereas a NASA-friendly metabolic signature might miss silicon-based life. Trade-off city. 

  Also, circularity is a silent killer. Many definitions use "reproduction" to define "life" but then define "fitness" via reproduction—tautology wrapped in jargon. User’s right to flag that. 

  The family-resemblance suggestion? Could be a cop-out, but Wittgenstein might argue it’s honest: Life might be a cluster of features (metabolism, evolution, etc.) where no single feature is essential, like "games" having no universal rule but overlapping similarities. Useful for taxonomy, maybe useless for rovers. 

  Different purposes matter too: 
  - A rover needs operational markers (biosignatures). 
  - A philosopher wants conceptual coherence. 
  - An astrobiologist cares about detectability across planets. 
  Each prioritizes different desiderata. 

  User’s deepest need? Probably: "Give me the framework to dissect definitions critically." They want ammunition to evaluate existing proposals, not just another candidate. So the response should equip them with: 
  1. The full spectrum of edge cases and what they test. 
  2. Which requirements are universally agreed vs. contested. 
  3. Where unavoidable trade-offs live. 
  4. How purpose shapes the definition. 
  ...all without pushing a specific agenda. 

  Noticing they’re allergic to dogma—good instinct. This field is a minefield of hidden assumptions. I’ll avoid declaring "life is X" and focus on mapping the battlefield.
answer: |-
  Here's a structured breakdown of the **desiderata** (requirements) for a definition of life, the **edge cases** that force each requirement, and analysis of tensions/purpose-dependence. This treats the definition as a "specification" before proposing solutions.

  ---

  ### **Core Desiderata & Their Forcing Cases**
  | Desideratum                          | Why It's Required                                                                 | Edge Cases Forcing This                                                                                                  |
  |--------------------------------------|-----------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|
  | **1. Handle Reproduction/Evolution Ambiguity** | Must clarify if reproduction is essential, or if evolution suffices.              | **Mules** (alive, infertile), **Spores** (dormant, no repro for eons), **RBCs** (no repro/dividing). Shows repro isn't always *individual*-level. |
  | **2. Metabolism/Energy Processing**  | Must address whether ongoing energy use is necessary.                             | **Spores** (zero metabolism when dormant), **Self-Sustaining Network** (metabolism without repro/evolution), **RBCs** (metabolic but no repro/nucleus). |
  | **3. Distinguish Entity vs. System** | Must specify if "life" applies to parts, wholes, or systems.                     | **Viruses** (inert particle vs. active in host), **Mitochondria** (autonomous in cell, dead outside), **Lichens** (symbiotic system vs. individual organisms). |
  | **4. Nucleic Acid Independence**     | Must account for non-RNA/DNA-based candidates.                                    | **Prions** (no nucleic acid, infectious), **Self-Replicating Lab Molecule** (non-organic replicator?). Challenges carbon/water assumptions. |
  | **5. Minimal Complexity Threshold**  | Must define how simple an entity can be and still qualify.                        | **Viroids** (naked RNA, no proteins), **Prions** (single protein), **Self-Replicating Molecule** (no metabolism). Is "parasitic simplicity" life? |
  | **6. Dormancy/Continuity of Identity** | Must explain how "paused" entities retain life-status.                            | **Spores** (revivable after millennia), **Frozen Organisms**. Challenges metabolism-centric definitions.                 |
  | **7. Avoid Circularity**             | Cannot define life via evolution if evolution presupposes life.                   | Definitions using "natural selection" often implicitly require repro → fitness → selection → *circular*.                |
  | **8. Non-Earth-Centric Scope**       | Must not preclude life based on unfamiliar biochemistry.                          | **Self-Sustaining Network** (non-organic?), **Alien Hypotheticals** (silicon-based, ammonia solvents).                  |
  | **9. Rover-Operational Detectability** | Must be testable with sensors (no human judgment).                                | **Spores** (appear inert), **Prions/Viroids** (hard to distinguish from non-living molecules). Needs measurable biosignatures. |
  | **10. Match Intuitive Boundaries**   | Shouldn't massively contradict common sense (or justify why it must).             | **Mules** (clearly alive), **Corpses** (clearly not). Avoids defining fire/crystals as "alive".                         |

  ---

  ### **Analysis of Tensions & Trade-offs**
  1. **"Alien-Generality" vs. "Rover-Usability"**  
     - **Tension:** A definition broad enough to include exotic life (e.g., silicon replicators) might lack detectable signatures (failing rover-operability). A rover-focused definition (e.g., "liquid water + organic molecules + metabolism") could miss non-terrestrial life.  
     - **Resolution?** Depends on purpose: Astrobiology prioritizes generality; Mars missions prioritize detectability.

  2. **"Non-Circularity" vs. "Evolutionary Essence"**  
     - Evolutionary definitions (e.g., "units of natural selection") often rely on reproduction → circular. But excluding evolution ignores biology's core theory.  
     - **Forcing Case:** The **Self-Replicating Molecule** evolves but lacks metabolism. Is it "alive" without being a *unit* of selection?

  3. **"Metabolism Required" vs. "Reproduction Required"**  
     - **Self-Sustaining Network** has metabolism but no repro → kills repro-essential definitions.  
     - **Self-Replicating Molecule** has repro but no metabolism → kills metabolism-essential definitions.  
     - *Trade-off:* Prioritize one? Reject both? Admit a spectrum?

  ---

  ### **Which Requirement Knocks Out Most Definitions?**  
  **Entity vs. System Ambiguity** (Desideratum 3).  
  - Most definitions fail to specify scale:  
    - Is a **mitochondrion** alive? A **virus**? A **lichens**?  
    - Definitions focused on *organisms* (e.g., NASA's "self-sustaining chemical system") exclude symbionts; definitions focused on *systems* (e.g., autopoiesis) struggle with rovers.

  ---

  ### **Purpose-Dependence: What the Definition is "For"**
  | Purpose                           | Key Desiderata                              | Sacrificed Desiderata               |
  |-----------------------------------|---------------------------------------------|-------------------------------------|
  | **Astrobiology (Alien Detection)** | Non-Earth-centric, Entity/System clarity    | Rover-operability, Intuitive match  |
  | **Robotic Exploration (Rover)**   | Rover-operability, Minimal complexity       | Alien-generality, System-level life |
  | **Theoretical Biology**           | Non-circularity, Evolution/repro handling   | Rover-operability                  |
  | **Philosophical Coherence**       | Edge-case coverage, Intuitive boundaries    | Rover-operability, Non-circularity? |
  | **Legal/Medical Policy**          | Intuitive boundaries, Reproduction clarity  | Alien-generality, System ambiguity  |

  ---

  ### **Family-Resemblance: Cop-Out or Solution?**  
  - **What it is:** Life has no strict definition but overlapping features (e.g., repro, metabolism, evolution, complexity). No single feature is essential.  
  - **Satisfies:** Desiderata 1,2,4,5,6,10 (avoids hard boundaries).  
  - **Fails:** Desiderata 3 (still ambiguous), 7 (circularity risk), 8 (alien applicability unclear), 9 (useless for rovers).  
  - **Verdict:** Useful for taxonomy/philosophy but **refuses operational definitions**. Doesn't satisfy rover or astrobiology needs.

  ---

  ### **Summary: The "Must-Haves" vs. "Negotiables"**
  - **Non-Negotiable:** Avoid circularity, address entity/system scope, handle repro/metabolism edge cases.  
  - **Tension Zones:** Generality vs. usability, intuition vs. theory.  
  - **Your Synthetic Cases:**  
    - **Self-Sustaining Network**: Forces metabolism without repro/evolution → repro/evolution can't be essential.  
    - **Self-Replicating Molecule**: Forces repro without metabolism → metabolism can't be essential.  
    - *Both* break classical definitions but *don't break* family-resemblance or system-based approaches.

  **Bottom Line**: A definition must explicitly prioritize desiderata based on *purpose* (e.g., rover vs. theory). No definition satisfies all cases—your essay should evaluate trade-offs, not just propose "the answer."
