prompt: |-
  ok so I'm putting together a handout for a grad ethics seminar on the paradox of deontology, and I want it to double as a sorting tool — the reader works through a bunch of diagnostic questions about what they actually think and lands on a named position, instead of just grabbing whatever label they already like. You're a philosopher of ethics who knows this literature cold, so take your time and think carefully before you write anything.

  Here's the setup you're working from, roughly: a deontological constraint — the one against killing, say — can tell you not to kill one person even when killing him would stop five other killings. So the theory looks like it's steering you toward a course of action that produces more of the exact thing the constraint is supposed to protect against. The question the taxonomy has to sort people on is: what do you do about that?

  Before the tree itself, give me a short brainstorm section where you map out the logical space — all the independent questions you could ask a reader, and which combinations of answers are even coherent. Then turn that into the taxonomy.

  Every branch should be a question that genuinely splits the positions, phrased so a reader can answer it without already knowing where it leads. Some axes I want on the tree, though add your own if the space needs them:
  - is the value behind the constraint the kind of thing you're supposed to promote/minimize, or is the constraint meant to be non-minimizing from the start?
  - are the reasons the constraint hands you agent-relative or agent-neutral?
  - is there a threshold past which the constraint gives way, and if so, what sets it?
  - does the theory actually get evaluated by its outcomes at all, or is that assumption the thing doing all the work in the "paradox"?

  Leaves should be named positions wherever there's a name in common use, and "unnamed" where there isn't. Each leaf gets one sentence on its most awkward commitment. Flag any two leaves your tree can't really pull apart, and for the answer-combinations nobody occupies, say briefly whether that's because the view is incoherent, just unattractive, or merely unexplored.

  Aim for something like 8 to 12 leaves so it fits on a seminar handout. Write it in American English. And please — no citations, no reading lists, no bibliography. I don't want a literature review, I want the instrument.
reasoning: |-
  Okay, the user is putting together a handout for a grad ethics seminar focused on the paradox of deontology. They want a sorting tool that guides readers through diagnostic questions to land on a named position, rather than just picking a label. This needs to be a taxonomy based on key axes like promoting vs. non-minimizing constraints, agent-relative vs. neutral reasons, thresholds, and outcome evaluation.

  First, I need to map the logical space. The paradox arises because deontological constraints forbid actions (like killing one) even to prevent worse outcomes (more killings). The core tension is between following the constraint and minimizing violations. 

  Key questions to ask:
  - Is the constraint's purpose to minimize violations? If yes, then the constraint seems self-defeating. If no, what's its basis?
  - Are the reasons agent-relative (binding only to the agent) or agent-neutral (universal)? This affects whether others can demand you violate the constraint.
  - Does the constraint have thresholds? If so, what determines them (e.g., numbers, catastrophe avoidance)?
  - Is the theory outcome-focused? If not, the paradox might rest on a mistaken assumption.

  Combining answers: 
  - If constraints are minimizing, they collapse into consequentialism. So non-minimizing is essential for deontology.
  - Agent-relative reasons explain why you can't violate even to prevent others' violations.
  - Thresholds allow for extreme cases but need a principled basis.
  - Rejecting outcome evaluation avoids the paradox but must justify how constraints arise.

  Position branches:
  1. Minimizing constraint? If yes, it's Act Consequentialism (awkward: must violate constraints to minimize violations).
  2. If no, then ask about agent-relativity. 
     - Agent-neutral: Threshold Deontology or Scalar Consequentialism. 
     - Agent-relative: then ask about thresholds.
        - With thresholds: Moderate Deontology (awkward: setting threshold levels).
        - Without: Absolutist Deontology (awkward: no exceptions even in catastrophes).
     - If agent-neutral without thresholds: Scalar Consequentialism (awkward: no prohibitions, just better/worse).
  3. If rejecting outcome evaluation, ask if constraints are agent-relative. 
     - Yes: Agent-Centered Prerogatives (awkward: allows causing harm to avoid personal wrongdoing).
     - No: Kantian Constructivism (awkward: abstract justification in crises).
     - If constraints aren't fundamental: Divine Command Theory or Cultural Relativism (awkward: reliance on external authority/subjective norms).

  Unoccupied combinations:
  - Minimizing + agent-relative: Incoherent because minimizing requires agent-neutral promotion.
  - Non-minimizing + agent-neutral + no thresholds: Unattractive as it forbids minimizing violations without a rationale, leading to Scalar Consequentialism by default.

  I need to ensure the tree has 8-12 leaves. The questions must split positions clearly without leading the reader. Phrasing questions accessibly is key. Each leaf's awkward commitment should highlight the position's main challenge. The taxonomy should help students discover their stance through introspection, making the handout engaging for the seminar.
answer: |-
  Here's a sorting taxonomy for the paradox of deontology, designed as a diagnostic tool. It maps the logical space first, then provides the decision tree.

  **Logical Space Brainstorm: Core Axes & Combinations**

  The paradox forces choices on these independent dimensions:

  1.  **Minimizing vs. Non-Minimizing:** Is the fundamental value behind the constraint (e.g., "don't kill") something we are required to *promote/minimize instances of*? Or is the constraint fundamentally about *not performing* a specific type of act, regardless of whether violating it minimizes total violations?
  2.  **Agent-Relativity vs. Agent-Neutrality:** Are the reasons provided by the constraint essentially tied to the *agent* (e.g., "*I* must not kill")? Or are they neutral, applying equally to all perspectives (e.g., "killing must be minimized")?
  3.  **Thresholds:** Does the constraint hold absolutely, or does it give way under extreme circumstances? If it gives way:
      *   *What triggers it?* Numbers of lives saved? Preventing catastrophe? Avoiding personal moral corruption?
      *   *Is the threshold sharp or fuzzy?*
  4.  **Role of Outcomes:** Is the moral theory fundamentally evaluated by the states of affairs it produces, or is right action defined independently of outcomes? Does the paradox itself mistakenly assume outcome-evaluation is primary?
  5.  **Fundamental Basis:** Are constraints foundational moral facts, derived from rationality/agency, or grounded in something external (e.g., divine command, cultural norms)?

  **Coherent Combinations & Gaps:**

  *   **Minimizing + Agent-Relative:** Incoherent. Minimizing requires agent-neutral promotion ("prevent killings, whoever does it"). Agent-relativity focuses on my *own* acts.
  *   **Non-Minimizing + Agent-Neutral:** Coherent but unstable. If reasons are neutral but not about minimizing, what *is* the neutral reason for *me* not to kill one to save five? Often collapses into minimizing or requires agent-relativity.
  *   **Non-Minimizing + Agent-Relative + No Thresholds:** Coherent (Absolutism).
  *   **Non-Minimizing + Agent-Relative + Thresholds:** Coherent (Moderate Deontology).
  *   **Minimizing + Agent-Neutral + No Thresholds:** Coherent (Act Consequentialism).
  *   **Minimizing + Agent-Neutral + Thresholds:** Coherent but unusual (Rule Consequentialism/Threshold Utilitarianism - though thresholds often feel ad hoc here).
  *   **Reject Outcome-Evaluation + Agent-Relative:** Coherent (Agent-Centered Prerogatives, Kantian Constructivism).
  *   **Reject Outcome-Evaluation + Agent-Neutral:** Difficult. If outcomes don't matter and reasons are neutral, what grounds the constraint? Maybe Kantian Universalizability, but it often smuggles in agency/relativity.
  *   **Constraints Not Fundamental:** Coherent (Divine Command, Cultural Relativism) but sidesteps the paradox's core philosophical tension.

  **Unoccupied Views:**
  *   **Minimizing + Agent-Relative:** Incoherent (as above).
  *   **Non-Minimizing + Agent-Neutral + No Thresholds:** Unattractive/Unexplored. Leads to forbidding minimization without a clear rationale, often defaults to Scalar Consequentialism ("less killing is better, but not required").
  *   **Reject Outcome-Evaluation + Agent-Neutral + Thresholds:** Unexplored/Unattractive. Combines the difficulties of grounding neutral constraints without outcomes and adding arbitrary thresholds.

  ---

  **The Deontology Paradox Sorting Taxonomy**

  Start here. Answer each question based on your intuitive judgment about the core case: "Should I kill one innocent person to prevent five other innocent people from being killed by someone else?"

  1.  **Is the primary point of the constraint (e.g., 'don't kill') to ultimately *minimize* total violations of that very constraint?**
      *   **YES** -> Go to 2A
      *   **NO** -> Go to 2B

  **Branch A (Minimizing Constraint)**

  2.  **A: Are the reasons the constraint gives you fundamentally about what *you* specifically must do/not do ('I must not kill'), or about what *should happen* overall ('killing should be minimized')?**
      *   *"What I must do/not do"* -> **Incoherent Branch End** (Minimizing inherently requires focusing on outcomes, not just your own acts. No coherent position lives here.)
      *   *"What should happen overall"* -> Go to 3A

  3.  **A: Does the constraint *always* require minimizing violations, no matter how many, or is there a point where following the rule (e.g., 'don't kill') matters more than minimizing violations?**
      *   *"Always minimize violations"* -> **Leaf: Act Consequentialism** (Awkward: Requires violating the constraint whenever it minimizes total violations, making the constraint itself merely a rule of thumb.)
      *   *"Sometimes follow the rule"* -> **Leaf: Rule Consequentialism / Threshold Utilitarianism** (Awkward: Thresholds for abandoning the rule seem arbitrary or lack a principled foundation within pure outcome-minimization.)

  **Branch B (Non-Minimizing Constraint)**

  2.  **B: Are the reasons the constraint gives you fundamentally about what *you* specifically must do/not do ('I must not kill'), or about what *should happen* overall ('killing should not happen')?**
      *   *"What should happen overall"* -> Go to 3B
      *   *"What I must do/not do"* -> Go to 4B

  3.  **B: Does the constraint *absolutely forbid* you from killing the one, even to prevent a million deaths?**
      *   *"Yes, absolutely forbidden"* -> **Leaf: Scalar Consequentialism** (Awkward: Admits that not killing the one is *better* than killing, but denies there is any decisive *requirement* not to kill him, making prohibition weak/non-existent.)
      *   *"No, not absolutely"* -> **Leaf: Threshold Deontology (Agent-Neutral Variant)** (Awkward: Struggles to explain why neutral reasons against killing *in general* don't simply imply a duty to minimize *all* killings, including by others.)

  4.  **B: Is there *any* number of lives saved (or level of catastrophe prevented) where it becomes morally *required* or *permissible* for you to kill the one?**
      *   **YES** -> Go to 5B
      *   **NO** -> **Leaf: Absolutist Deontology** (Awkward: Requires letting catastrophic harm occur to avoid personally committing a single wrongful act.)

  5.  **B: What primarily justifies overriding the constraint at the threshold?**
      *   *"Preventing an extremely large number of violations/overwhelming harm"* -> **Leaf: Moderate Deontology (Numbers-Based)** (Awkward: Difficulty in non-arbitrarily setting *where* the threshold number lies.)
      *   *"Preventing a genuine catastrophe (collapse of society, existential threat)"* -> **Leaf: Moderate Deontology (Catastrophe-Based)** (Awkward: Defining 'catastrophe' precisely enough to avoid slippery slopes or under-protection.)
      *   *"Avoiding my own severe moral corruption by becoming a killer"* -> **Leaf: Agent-Centered Prerogative** (Awkward: Allows you to cause significant harm to others primarily to preserve your own moral purity.)
      *   *"None of these – the constraint isn't about outcomes or my state"* -> **Leaf: Unnamed (Kantian Constructivism Focus)** (Awkward: Abstract justifications (e.g., universalizability) can feel disconnected from the concrete horror of catastrophic outcomes.)

  **Branch C (Rejecting Outcome-Evaluation Premise)**

  *(If you strongly reject the idea that the *point* of morality is to produce good outcomes, start here)*

  1.  **C: Are the constraints fundamentally about what *you* personally must do/not do?**
      *   **YES** -> **Leaf: Kantian Constructivism** (Awkward: Rationalist procedures (e.g., Categorical Imperative) can sometimes yield counter-intuitive results in complex, high-stakes scenarios.)
      *   **NO** -> Go to 2C

  2.  **C: Are the constraints grounded in something outside rational agency (e.g., divine command, cultural tradition)?**
      *   **YES** -> **Leaf: Divine Command Theory / Cultural Relativism** (Awkward: Makes moral truth dependent on potentially arbitrary authority or variable social norms.)
      *   **NO** -> **Incoherent/Unstable Branch End** (Rejecting outcome-focus while also rejecting agent-relativity and external grounding leaves no clear basis for constraints. Might default to Scalar Consequentialism or Absolutism.)

  ---

  **Notes on the Taxonomy:**

  *   **Leaves (12):** Act Consequentialism, Rule Consequentialism / Threshold Utilitarianism, Scalar Consequentialism, Threshold Deontology (Agent-Neutral), Absolutist Deontology, Moderate Deontology (Numbers-Based), Moderate Deontology (Catastrophe-Based), Agent-Centered Prerogative, Unnamed (Kantian Constructivism Focus), Kantian Constructivism, Divine Command Theory, Cultural Relativism.
  *   **Hard to Pull Apart:** Distinguishing **"Kantian Constructivism"** from **Absolutist Deontology** can be fuzzy, as Kantianism often *implies* absolutism. The tree tries to split them based on the *primary reason* for rejecting outcome-focus (rational procedure vs. foundational constraint). Similarly, the line between **Agent-Centered Prerogative** and **Moderate Deontology** blurs if the "corruption" is tied to the *amount* of harm caused.
  *   **Unexplored/Unattractive:** The "Non-Minimizing + Agent-Neutral + No Thresholds" space is noted as leading to Scalar Consequentialism or being unstable/unattractive.
  *   **Incoherent:** The "Minimizing + Agent-Relative" combination is flagged as incoherent.
