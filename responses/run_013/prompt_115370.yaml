  Let me break this down. First, I need questions attacking whether non-binding declarations have real bite. If the government can just pay damages and keep violating rights (as the UK sometimes does), is this more than theater? Second, does the last-word/final-authority distinction hold when legislatures can repeatedly re-enact overrides? Third, isn't the whole model circular - it assumes democratic responsiveness precisely where it often fails? Fourth, Canada's non-overridable core rights ironically recreate the countermajoritarian problem for fundamental rights.

