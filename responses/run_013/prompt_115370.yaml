  For the closing, I'll push the guest to name falsifying conditions - what would actually make them doubt weak-form review? That prevents them from just defining the problem away. 

  The challenge is sequencing these to escalate pressure. Start with operational weaknesses (UK declarations), then move to override mechanics undermining "final authority," then expose circular assumptions about democracy, then show how non-overridable cores backfire. Save the empirical and paradox questions for when the guest's defenses are fatigued. End with the falsification question as a knockout punch.

  Better avoid any softballs - no "how did you get interested in this" questions. Every query must corner the thesis. And each main question needs a razor-sharp follow-up anticipating their dodge. For example, if they say declarations influence Parliament through dialogue, the follow-up should cite cases like prisoner voting where the UK ignored declarations for years.
answer: |-
  Here are ten rigorously sequenced questions with targeted follow-ups, designed to progressively challenge the guest's core claims while adhering to your specifications:

  ### Core Question Set
  1. **Operational Force Question**  
     *Your book argues that declarations of incompatibility (like under the UK HRA) shift a burden of justification to the legislature. But when a court declares a statute incompatible yet it remains fully operative—as with the UK’s prisoner voting ban upheld for 17 years post-declaration—how is this more than an advisory opinion? What tangible constitutional *force* does the court’s judgment carry?*  
     → *Likely Reply:* "It triggers democratic dialogue and political accountability."  
     **Follow-up:** *If the state’s response is to pay damages to victims (e.g., HRA s.8) while deliberately maintaining the rights-violating law—as the UK did with prisoner voting—doesn’t that reduce rights to a priced externality rather than imposing a justificatory burden?*

  2. **Final Authority vs. Last Word Distinction**  
     *You distinguish courts having the "last word" on a statute from "final authority" on constitutional meaning. In Canada, if a legislature pre-emptively invokes s.33 (as Quebec did in 2019) or re-enacts it every 5 years indefinitely, what observable difference remains between this and a legislature holding final constitutional authority?*  
     → *Likely Reply:* "The override is politically costly, preserving judicial primacy in normal operation."  
     **Follow-up:** *Doesn’t pre-emptive or sustained s.33 use—where legislatures *anticipate* and nullify judicial review—demonstrate that courts lack not just the last word but *any* durable authority to settle constitutional questions?*

  3. **Democratic Responsiveness & Circularity**  
     *Your model’s legitimacy hinges on legislatures being democratically responsive to rights-based critiques. But when majorities support rights-violating laws (e.g., Quebec’s Bill 21 targeting religious minorities), doesn’t this presuppose the very responsiveness that’s absent in the cases where rights need protection most?*  
     → *Likely Reply:* "Elections allow citizens to punish rights-abusive governments."  
     **Follow-up:** *If a law enjoys persistent popular support *despite* rights violations (e.g., Bill 21’s sustained 65%+ approval), doesn’t the model collapse into majoritarianism precisely where countermajoritarian checks are needed?*

  4. **Non-Overridable Core & Reinstated Difficulty**  
     *Canada’s s.33 cannot override democratic, language, or gender equality rights. If these "non-overridable" rights require strong-form review to protect them from majorities, haven’t you conceded that the countermajoritarian difficulty isn’t dissolved—just relocated to the rights deemed most fundamental?*  
     → *Likely Reply:* "These reflect foundational commitments where override is inappropriate."  
     **Follow-up:** *Doesn’t this imply that *all* rights needing insulation from majorities require strong-form review? Why is gender equality (s.28) non-overridable but not religious freedom (subject to s.33)?*

  ---

  ### Supplemental & Closing Questions
  5. **Empirical Legitimacy Threshold**  
     *What empirical evidence would decisively show weak-form review enhances legitimacy? If override use is rare (e.g., s.33 invoked 0.1% of cases) but declarations of incompatibility are routinely ignored (e.g., 40% of UK declarations unresolved after 5 years), does that vindicate or undermine the model?*  
     → *Likely Reply:* "Legitimacy stems from balanced institutional dialogue."  
     **Follow-up:** *If legislatures ignore declarations without electoral penalty (e.g., UK prisoner voting) or deploy s.33 without backlash (e.g., Bill 21), doesn’t the data suggest weak-form review *fails* to create meaningful dialogue?*

  6. **Safety Valve or Escape Hatch?**  
     *Is the notwithstanding clause a "safety valve" for rare legislative disagreements—or an "escape hatch" enabling persistent rights evasion? If you argue its use *should* be rare, doesn’t that concede the model’s legitimacy depends on its distinctive feature (override power) remaining dormant?*  
     → *Likely Reply:* "Rarity proves it’s a reserved power, not a first resort."  
     **Follow-up:** *But if override is legitimate *only* when rare, doesn’t that imply weak-form review functionally approximates strong-form review in practice—surrendering the core claim of dissolving the countermajoritarian difficulty?*

  7. **Falsifiability Threshold**  
     *What evidence would falsify your thesis that weak-form review *dissolves* (not merely softens) the countermajoritarian difficulty? For example, if legislatures systematically pre-empt review (s.33) or ignore declarations *without* electoral consequences, would that show courts lack final authority?*  
     → *Likely Reply:* "Persistent defiance would challenge but not refute the model."  
     **Follow-up:** *If dissolution requires legislatures to *engage* with judicial reasoning, but empirical work shows they often override/ignore courts *without* substantive justification (e.g., Quebec’s boilerplate s.33 invocations), does this suggest the "burden-shifting" mechanism is theoretical rather than operational?*

  ---

  ### Sequence Rationale
  - **Q1–Q2** test institutional mechanics: Can declarations constrain? Does final authority exist if legislatures can nullify review?  
  - **Q3–Q4** target theoretical coherence: Is the model circular? Does the non-overridable core concede the game?  
  - **Q5–Q6** demand empirical accountability: What proves legitimacy? Does rare override use undermine the thesis?  
  - **Q7** forces falsifiability: What would make the guest reconsider?  

  Each follow-up preempts common defenses by citing real-world constraints (preemptive overrides, ignored declarations, popular rights violations). The sequence systematically isolates whether "dissolving" the countermajoritarian difficulty is sustained when the model faces legislatures actively resisting judicial input.
