prompt: |-
  I'm trying to specify what a system that learns what people want from what they do may legitimately infer, and my hand-labelled verdicts on cases don't come from any one rule I can state. When a colleague always takes the stairs, even carrying heavy bags, I take her choices as evidence that she prefers the stairs to the elevator. When a man orders the same dish every visit but insists he has no particular liking for it, I still think his choices reveal a preference he would deny. But when someone drinks a bitter tea he says he dislikes, because he believes it is good for his stomach, I do not infer that he likes the taste; I infer only what he wants given what he believes. When a person with agoraphobia never leaves the house, I resist saying she prefers staying in, even though staying in is what she repeatedly does, and I would call the behavior a symptom rather than a preference. When a colleague attends a weekly gathering out of habit and family expectation, and would rather be asleep, I treat his attendance as weak evidence at best. Two cases I cannot reconcile: a man who says he wants to stop drinking and does not, and a man who hands over his wallet at knifepoint. Both contradict what the person says he wants, and my instinct is that the second tells me nothing about his preferences while the first tells me something important — though by what right, I cannot say. My rough rule has been that a behavior is evidence of a preference when it is the person's own, repeated, and performed with full knowledge of the options, but that rule makes the akratic case and the case of the dish he denies liking come out alike, and I feel they should not.

  Is there a principle that gets all of these, or close? State it precisely, say which case motivates each clause, and give its verdicts on cases I have not listed — choices made when the stakes are trivial, choices that reverse when the options are presented in a different order, and choices that change once the person learns more about the options. Tell me which of my verdicts I must give up, and whether the principle is meant as a claim about what people actually want or about what we are entitled to infer.
reasoning: |-
  Hmm, the user is grappling with how to infer preferences from behavior and actions. They've provided several examples where their intuitive judgments about what someone "really wants" conflict with simple behavioral rules. They're looking for a precise principle that can reconcile cases like habitual stair-taking, akratic behavior (wanting to stop drinking but not doing so), and coerced actions (handing over a wallet at knifepoint).

  Looking at their examples, several key distinctions emerge. When someone chooses stairs repeatedly, that seems to reveal a preference, but when someone drinks bitter tea for health reasons, that's about instrumental value rather than enjoyment. The agoraphobia case shows that constraints matter - staying home isn't a preference when driven by fear. The weekly gathering case reveals that habits and social pressures can obscure true preferences.

  The two puzzling cases are particularly interesting. For the alcoholic who wants to quit but doesn't, their behavior reveals something important about their underlying desires despite their stated intention. But for the wallet-at-kifepoint scenario, we don't infer any preference from the compliance since it's purely coerced.

  The user's rough rule (own, repeated, full knowledge) fails because it can't distinguish between the alcoholic case and the coerced wallet case - both involve contradictory behavior to stated preferences. Their intuition rightly distinguishes them, but they can't articulate why.

  I need to propose a principle that captures these nuances. A good framework might involve:
  - Distinguishing between terminal and instrumental preferences
  - Accounting for constraints (physical, psychological, social)
  - Recognizing when behavior reveals stable dispositions versus situational responses
  - Considering the counterfactual - what they would choose under different conditions

  The principle should also handle the additional cases they mentioned: trivial choices, framing effects, and choices after learning more. And importantly, I need to clarify whether this is about actual preferences or just what we can infer.

  For the alcoholic case, the behavior reveals a conflict between higher-order desires and immediate impulses. For the wallet case, no preference is revealed because it's purely situational compliance. This distinction should be central to the principle.

  I'll formulate a precise definition with necessary clauses, explain which cases motivate each part, and then apply it consistently to all their examples and the new scenarios they mentioned. I'll also be clear about which of their judgments might need adjustment under this framework.
answer: |-
  Here’s a precise principle that reconciles your cases, grounded in decision theory and philosophy of action. It distinguishes between **revealed terminal preferences** (what a person intrinsically values) and **instrumental actions** (what they do to achieve those values given beliefs/constraints).

  ---

  ### **Principle of Revealed Terminal Preference (RTP)**  
  *A person's choice reveals a terminal preference only if:*  
  1. **The action is *intrinsically motivated*:** It reflects a direct valuation of the outcome, not solely its instrumental role in achieving a further goal.  
  2. **The agent is *cognitively unconstrained*:** They are not under coercion, pathological compulsion, or severe cognitive distortion (e.g., delusion, phobia).  
  3. **The agent has *stable epistemic access*:** They understand the options and consequences, and their choice is consistent across similar contexts.  

  ---

  ### **How the Principle Resolves Your Cases**  
  | **Case**                          | **RTP Verdict**                                                                 | **Motivating Clause**                                                                 |  
  |-----------------------------------|---------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|  
  | **Colleague takes stairs**        | **Reveals preference** (for stairs).                                            | Intrinsically motivated (no ulterior goal), cognitively unconstrained, stable.       |  
  | **Man orders dish but denies liking** | **Reveals preference** (for the dish).                                         | Actions are intrinsically motivated (enjoyment), not instrumental. Denial may reflect lack of introspection. |  
  | **Drinks bitter tea for health**  | **Does NOT reveal liking the taste.** Reveals instrumental action (health goal). | Not intrinsically motivated (taste is a cost, not the goal). Clause 1 violated.      |  
  | **Agoraphobic stays home**        | **Does NOT reveal preference.** Reveals pathological constraint.               | Cognitively constrained (phobia distorts valuation). Clause 2 violated.              |  
  | **Colleague attends gathering reluctantly** | **Weak/no evidence** of preference for attendance.                             | Not intrinsically motivated (driven by habit/external pressure). Clause 1 violated. |  
  | **Alcoholic fails to quit**       | **Reveals preference** (for immediate relief of craving).                          | Intrinsically motivated (relief is terminal), cognitively unconstrained* (akrasia ≠ compulsion). |  
  | **Hands over wallet at knifepoint** | **Does NOT reveal preference.** Reveals instrumental action (survival).        | Cognitively constrained (coercion overrides intrinsic preferences). Clause 2 violated. |  

  **Key Reconciliation of Akrasia vs. Coercion:**  
  - **Akrasia (alcoholic):** The choice *is* intrinsically motivated (immediate craving relief) and unconstrained (no external force). His denial reflects conflict between short/long-term preferences.  
  - **Coercion (robbery):** The choice is purely instrumental (survival), not intrinsic. The robber’s threat *imposes* a constraint.  

  ---

  ### **Verdicts on New Cases**  
  1. **Trivial stakes (e.g., choosing a pen color):**  
     - **Reveals terminal preference** if consistent (e.g., always blue). Meets all clauses.  
     - *Exception:* If chosen randomly, no preference revealed.  

  2. **Framing effects (e.g., prefers 90% lean meat over 10% fat):**  
     - **Does NOT reveal terminal preference.** Violates Clause 3 (epistemic access distorted). Preferences should be invariant to description.  

  3. **Choices change after learning (e.g., avoids food upon discovering allergens):**  
     - Original choice **revealed terminal preference** (taste/enjoyment). New choice reveals *updated* preference (health > taste). No violation if epistemic access was complete at each stage.  

  ---

  ### **Adjustments to Your Verdicts**  
  You must refine **one intuition**:  
  - **The alcoholic case** reveals a *terminal preference for immediate gratification*, not a preference for drinking *per se*. Your instinct was correct, but RTP clarifies *why*: akrasia exposes a conflict between short-term (revealed) and long-term (stated) preferences.  

  ---

  ### **Nature of the Principle**  
  This is a principle of **epistemic justification** (what we can infer), not ontology (what people "actually" want). It defines when behavior licenses inferences about terminal preferences, acknowledging that:  
  - People may have conflicting preferences (e.g., short vs. long-term).  
  - "True" preferences are often inferred from patterns, not single acts.  
  - We can be wrong (e.g., if hidden constraints exist).  

  ---

  ### **Philosophical Grounding**  
  - **Clause 1** draws from **Bernoulli** (intrinsic vs. instrumental value) and **hedonic psychology**.  
  - **Clause 2** reflects **Frankfurt's** coercion criteria and **clinical definitions** of pathology.  
  - **Clause 3** aligns with **rational choice theory** (invariance, consistency).  

  This principle avoids over-ascribing preferences (e.g., to coerced/phobic actions) while capturing genuine conflicts (akrasia). It treats preferences as *dispositions revealed in unconstrained, intrinsic choices*, not mere behavior.
