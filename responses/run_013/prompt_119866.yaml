prompt: |-
  ok so i have a weird job. I sit on a small committee in my city that hands out a hardship top-up — extra cash each month — and we have maybe 40% of what we'd need to cover everyone who applies. Right now the ranking is: income below a line, then whoever has the biggest medical bills. Everyone on the committee hates the rule, nobody can say exactly why, so before we redesign the thing I want to know what a good answer to "who is worst off" would even have to look like. Not a slogan — the actual spec.

  So: write me the desiderata for a measure of who's worse off, i.e. what any adequate answer to the equality-of-what question would have to deliver if it's going to be used to rank real households for a real program. The list, with the case behind each item, then your honest read on which items are non-negotiable and which are just one camp's taste, and which pairs can't be had together. That last part is what I most want.

  Some things I keep tripping over, but dont just take my list as the list:

  - people who've adapted to a bad situation and report that they're fine. I visit a guy in his sixties, dialysis three times a week, says his life is good. I don't believe the survey and I also don't want to tell him he's wrong about his own life.
  - broke because of a diagnosis vs broke because of gambling. Our current rule treats them identically and half the committee thinks that's obviously right and half thinks it's obviously insane.
  - we can only use data we can actually collect, and people shouldn't be able to game it. We had a run of applications that were, lets say, creative.
  - and "worst off" seems like a different question from "how equal is everything," which I think matters here but I can't articulate why.

  Also: does the choice of currency actually change the ranking much, or is that mostly an academic worry? And if a measure satisfied everything on your list except one item, which item would you rather lose, and which single item do you think rules out the most of the popular answers? If you want, a short line at the end on whether the usual currency options — welfare, resources, capabilities — really come apart on this list or all fail the same items. Keep that part short, the list is the thing.

  Dont need the literature, I'm not writing a paper, I just want the spec. Long is fine.
reasoning: |-
  Okay, the user is on a committee that distributes hardship funds with limited resources. They need a solid framework to determine who is "worst off" because their current system—ranking by income and then medical bills—isn't working well. The committee hates it but can't articulate why, so the user wants desiderata for a better measure.

  First, I need to unpack their specific pain points. They mentioned adapted preferences (like the guy on dialysis who says he's fine), moral judgments (gambling vs medical debt), data constraints, and the difference between "worst off" versus equality. They also asked about how much the currency choice affects rankings and which desiderata are non-negotiable versus trade-offs.

  The user's explicit request is for a list of desiderata with cases, highlighting must-haves, negotiables, and impossible pairs. But deeper, they need practical guidance to navigate committee disagreements and design a feasible system. They’re likely frustrated with abstract theory and want actionable steps, hence the emphasis on real-world application and data constraints.

  Starting with desiderata, the core is capturing genuine disadvantage. The dialysis example points to preference distortion—people adapting to hardship might underreport suffering. So any measure must correct for this, perhaps by using objective indicators. But how? Surveys might be unreliable, so maybe third-party data or expert assessments. However, that conflicts with practicality and anti-gaming concerns.

  Next, responsibility vs. luck. Gambling versus medical bills highlights moral dimensions. A good measure should distinguish between unavoidable misfortune and avoidable choices, but that's tricky. Committees might have differing views, so the system needs a transparent way to handle this without imposing personal biases. Perhaps using categories of causes or severity, but that risks subjectivity.

  Data and gaming are critical. If applications are "creative," the measure must rely on verifiable data. Self-reports are problematic, so leaning on tax records, bills, or agency data is better. But that might exclude those in informal economies, creating another fairness issue. The desiderata must balance accuracy with inclusivity.

  "Worst off" vs. equality: the user senses they’re distinct but can’t articulate why. Equality is about distribution across society, while "worst off" targets the most deprived. The measure should focus on absolute deprivation thresholds, not relative gaps. This means defining a floor below which no one should fall, which aligns with the hardship fund’s goal.

  Now, the impossible trade-offs. For example, objectivity vs. sensitivity: using only verifiable data might miss nuances like mental health or social isolation. Or fairness vs. practicality: distinguishing responsibility requires detailed context, which is hard to collect at scale. Also, avoiding moralism might clash with societal expectations—if the public views gamblers as less deserving, ignoring that could cause backlash.

  Currency choice: resources (income) are easy to measure but ignore needs. Capabilities account for personal factors but are hard to operationalize. Welfare is subjective and manipulable. In practice, resources plus adjustments (like equivalence scales) might be the most feasible, even if imperfect. The ranking might shift based on currency—e.g., someone with high medical needs might rank lower on income but higher on capability deprivation.

  Non-negotiables: objectivity, verifiability, and focusing on absolute deprivation are essential. Without these, the system is manipulable or unfair. Negotiable items include how to handle responsibility—some committees might want to exclude self-inflicted hardship, others not. Also, the level of sensitivity to individual differences might vary based on data capacity.

  If sacrificing one item, I’d drop the responsibility component. It’s the most subjective and hardest to implement fairly. Prioritizing non-discrimination and focusing on current need, regardless of cause, might be more practical and humane.

  Finally, popular approaches fail on different points. Resource-based measures miss needs, capabilities are ideal but unworkable, welfare is unreliable. A hybrid with verifiable needs and resources, using thresholds, might satisfy most desiderata except maybe sensitivity or responsibility handling.
answer: |-
  Here’s a no-nonsense desiderata list for ranking "worst off" in a real-world hardship program, grounded in your operational constraints and ethical dilemmas. I’ll flag the non-negotiables, taste-based items, and impossible trade-offs, then tackle your specific questions.

  ---

  ### **Desiderata for a "Worst Off" Measure**  
  *(With rationale and classification)*

  1. **Objective Anchoring**  
     - **Case:** Dialysis patient reporting high life satisfaction. Self-assessed well-being can be distorted by adaptation, stigma, or cognitive bias.  
     - **Rationale:** The measure must identify deprivation even when self-reports don’t align with observable hardship.  
     - **Classification:** **Non-negotiable.** Without this, the measure ignores hidden suffering.  

  2. **Verifiable & Auditable Inputs**  
     - **Case:** "Creative" applications (e.g., inflated bills, hidden income).  
     - **Rationale:** Data must be cross-checked via tax records, bills, or third-party sources. Self-reported data alone invites fraud.  
     - **Classification:** **Non-negotiable.** Legal/practical necessity for public funds.  

  3. **Non-Discrimination by Cause**  
     - **Case:** Medical debt vs. gambling debt.  
     - **Rationale:** Judging "deservedness" of hardship injects moral bias and requires intrusive investigations. Focus on *current need*, not past choices.  
     - **Classification:** **Negotiable/Taste.** Some committees insist on "responsibility," others reject paternalism.  

  4. **Sensitivity to Heterogeneous Needs**  
     - **Case:** Two families with identical income; one has a disabled child requiring costly care.  
     - **Rationale:** Deprivation isn’t just low income—it’s income minus unavoidable costs to achieve basic functioning.  
     - **Classification:** **Non-negotiable.** Core to defining "worse off."  

  5. **Resistance to Strategic Behavior**  
     - **Case:** Applicants hiding assets or over-consuming medical services to qualify.  
     - **Rationale:** Measures shouldn’t incentivize harmful actions to "win" the ranking.  
     - **Classification:** **Non-negotiable.** Prevents program failure via exploitation.  

  6. **Focus on Absolute Deprivation**  
     - **Case:** "Worst off" vs. "inequality." A middle-class family with high debt may be unequal to peers but not absolutely deprived.  
     - **Rationale:** Hardship funds target survival, not relative status.  
     - **Classification:** **Non-negotiable.** Distinguishes poverty alleviation from equality goals.  

  7. **Practical Feasibility**  
     - **Case:** Needing disability data but lacking access to medical records.  
     - **Rationale:** If you can’t collect/verify it, it can’t be used.  
     - **Classification:** **Non-negotiable.** Operational reality.  

  8. **Dynamic Assessment**  
     - **Case:** Someone with temporary job loss vs. chronic illness.  
     - **Rationale:** Duration of hardship matters—a 6-month crisis vs. lifelong need.  
     - **Classification:** **Taste.** Some prioritize acute emergencies, others chronic sufferers.  

  ---

  ### **Impossible Trade-Offs**  
  *(These pairs cannot be fully satisfied simultaneously)*  

  - **Objective Anchoring vs. Sensitivity to Heterogeneous Needs**  
    - **Conflict:** Truly capturing diverse needs (e.g., mental health, social isolation) requires qualitative/subjective inputs, undermining objectivity.  
    - **Resolution:** Use *proxies* (e.g., "diagnosis + cost data" for health needs) but accept gaps.  

  - **Non-Discrimination by Cause vs. Resistance to Gaming**  
    - **Conflict:** Ignoring causes (e.g., gambling) may incentivize reckless behavior; policing causes requires intrusive verification.  
    - **Resolution:** Exclude *actively harmful* behavior (e.g., ongoing substance abuse) if verifiable, but ignore past choices.  

  - **Sensitivity to Needs vs. Practical Feasibility**  
    - **Conflict:** Perfect needs-assessment (e.g., home visits) is resource-intensive; simple proxies (e.g., disability status) overlook nuance.  
    - **Resolution:** Tiered approach—crude initial screen (income/assets), then deeper dives for borderline cases.  

  ---

  ### **Your Specific Questions**  

  **1. Does currency choice change rankings?**  
     - **Yes, significantly.** Welfare (happiness) ranks the dialysis patient as "fine"; resources (income) ignore medical costs; capabilities (freedom to achieve) capture constraints but are hard to measure.  
     - **Practical Implication:** Income + cost adjustments will differ from pure income or subjective well-being.  

  **2. If sacrificing one desideratum, which to drop?**  
     - **Drop:** *Non-Discrimination by Cause* (Desideratum 3).  
     - **Why:** While morally fraught, it’s less critical than verifiability or need-sensitivity. Focus on *current* material deprivation, not moral audits.  

  **3. Which single item rules out most popular answers?**  
     - **Objective Anchoring** (Desideratum 1).  
     - **Why:** Popular "welfare" or "happiness" metrics fail here (e.g., dialysis patient). Resource-based approaches (e.g., income) fail Desideratum 4 (need-sensitivity).  

  **4. Do currencies all fail the same way?**  
     - **Resources** fail on sensitivity to needs (dialysis costs aren’t reflected).  
     - **Welfare** fails objectivity (adapted preferences).  
     - **Capabilities** fail practicality (can’t measure "freedom" reliably).  
     - **Verdict:** All fail *differently*, but **resources + cost adjustments** come closest *if* needs are verifiable.  

  ---

  ### **Bottom Line for Your Committee**  
  **Non-negotiables in bold:**  
  - **Objective inputs** (not self-reports).  
  - **Verifiable data** (audit-proof).  
  - **Sensitivity to needs** (cost-of-living adjustments).  
  - **Anti-gaming design**.  
  - **Absolute deprivation focus**.  

  **Start here:**  
  1. Define "basic functioning" (e.g., food, shelter, healthcare).  
  2. Calculate a **Residual Income Index**:  
     `(Income - Unavoidable Costs to Achieve Basics) / Poverty Threshold`  
     - *Income*: Tax data + asset checks.  
     - *Unavoidable Costs*: Medical bills (verified), disability aids, childcare for single parents.  
     - *Exclusions*: Debt from gambling/luxuries (if provable).  

  **Trade-off to watch:** You’ll miss non-material hardships (loneliness, dignity)—but that’s unavoidable without violating objectivity. This system prioritizes the silently suffering dialysis patient over the "happy" one, avoids moral debates about past choices, and crushes most gaming. It’s brutal, but implementable.
