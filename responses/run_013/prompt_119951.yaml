  Okay, the user runs a philosophy-of-mind reading group and podcast, and they've booked a guest who defends a specific version of epiphenomenalism. The guest's unique angle is his response to the paradox of phenomenal judgment. The user wants interview questions structured to challenge the guest's position effectively. 

  Hmm, the user is clearly well-versed in the topic—they’ve covered base epiphenomenalism before and now want to drill into the guest’s two-part reply. Their request is hyper-specific: framing, then sections on common cause, constitution, cost, and a closing. They also want bracketed follow-ups for each question to keep the conversation tight. 

  First, the framing needs to be concise but set up the paradox clearly for listeners. The guest’s core moves (common cause + constitution) must be highlighted without jargon. Got it—focus on the "small miracle" worry and his dual strategy. 

  For the common cause section: Reliability is key. The user explicitly wants a question about neural causes firing without experience. That’s where the paradox might resurface—if the judgment is "accurate" only when experience is present, but the cause alone can’t guarantee that, what stops it from being luck? The follow-up should push whether reliability collapses into correlation without causation. 

  Constitution section: Trickiest part. If experience *constitutes* the judgment, can it still be false? The guest might say no (infallibility), but that clashes with real-world cases like hallucinations. The follow-up needs to challenge whether "constitution" is just causal glue in disguise. Metaphysical vs. epistemic roles here. 

  The cost section: User wants authority vs. confabulation. If reports are just neural outputs, how do we distinguish genuine from mistaken reports? The guest might appeal to neural signatures, but that feels circular. Strongest objection question is smart—forces him to admit where his view is vulnerable. 

  Closing: User wants the "big picture." The guest loves comparing this to externalist perception theories, so the question should nudge him to frame it as a clash over what counts as satisfying explanation. 

  Follow-ups: Must anticipate his likely answers. He’s combative and concedes zombies/conceivability, so follow-ups should exploit that—e.g., "If reliability is just correlation, is it any better than chance?" for common cause. For constitution, if he claims infallibility, hit him with the hallucination case. 

  Overall, keep questions concrete. No literature or name-drops. User wants the guest reasoning from his own position, not debating others. The tone should be rigorous but not hostile—he’s their guest, after all. 

  *Pauses* Did I miss anything? User emphasized avoiding "double standards" with perception externalism, so the closing question should loop that in. Also, the hallucination follow-up is critical—it’s the biggest threat to his constitution move. 

  Alright, structuring now...
answer: |-
  Here's a tightly focused interview structure designed to probe the core tensions in your guest's position, with follow-ups anticipating likely responses:

  **Framing:**  
  "Our guest defends epiphenomenalism: conscious experiences are caused by the brain but have no causal powers themselves. This raises a famous worry—the 'paradox of phenomenal judgment': if my experience doesn’t cause my report about it, why is my report accurate? Our guest has a two-part solution: shared neural causes ground reliability, and the experience partly *constitutes* my first-person judgment. Let’s press those ideas."

  ---

  **I. The Common Cause Reply:**  
  1.  **Question:** You say the reliability of my judgment "I see red" stems from the neural cause *jointly* producing both the experience and the judgment. But reliability typically involves a *counterfactual* link: if the experience weren’t present, the judgment wouldn’t occur (or would be different). If the experience is epiphenomenal, how can the common cause alone establish *this* kind of counterfactual dependence? Isn't the judgment just locked onto the neural state, not the experience?  
      *[Likely Answer: Denies need for counterfactual dependence on the experience; reliability = lawful covariance between neural state N and judgment J, grounded in N causing both.]*  
      **Follow-up:** If reliability is *only* about the neural state reliably causing the judgment, doesn't that make the judgment reliable *about the neural state*, not about the experience? Why call it a judgment *about the experience* then, if its accuracy conditions aren't anchored to the experience's presence?  

  2.  **Question:** Suppose the neural common cause fires, producing the judgment "I see red," but due to some anomaly, *no* red experience occurs. Is the judgment: (a) *False* (it claims an experience that isn't there)? (b) *Unjustified* (lacking its usual ground)? Or (c) still *true/justified* because it tracks the neural state? Why?  
      *[Likely Answer: The judgment is false because it refers to the experience, which is absent, even though caused by the same neural state. Its justification might be intact if the neural state is its usual justifier.]*  
      **Follow-up:** Doesn't this reveal the paradox isn't solved? If the judgment is false *despite* the neural cause firing correctly, the accuracy of the judgment is *not* guaranteed by the common cause alone. The connection between the judgment's content (about the experience) and the experience itself still looks contingent and unexplained by your model – the "small miracle" you aimed to avoid.  

  3.  **Question:** You liken this to externalist theories of perception, where a brain state caused by a red apple causes the judgment "That's red," and its reliability is grounded in the causal chain. But in that case, the *redness of the apple* is a causal link in the chain justifying the judgment. In your model, the *phenomenal redness* is *not* a link in the causal chain justifying "I see red." How is this not a disanalogy that undermines the comparison?  
      *[Likely Answer: Insists the analogy holds because justification for perceptual judgments is also ultimately grounded in the physical cause (brain state caused by apple), not the phenomenal properties of the apple itself.]*  
      **Follow-up:** But isn't the crucial difference that in perception, the *property judged* (redness) *is* causally efficacious (it reflects light, causing the chain), whereas the phenomenal property judged *isn't*? Doesn't this mean the externalist has a causal connection to the *referent* of the judgment that you lack?

  ---

  **II. Constitution and the First Person:**  
  4.  **Question:** You say the experience of red partly *constitutes* my judgment "I see red" in the first-person case. If they are constitutively linked, does this mean such judgments are *infallible*? Could I ever sincerely judge "I see red" when I'm *not* having a red experience?  
      *[Likely Answer: Probably claims infallibility for canonical, present-tense, first-person phenomenal judgments.]*  
      **Follow-up:** What about cases of subtle misidentification or conceptual confusion? For example, someone unfamiliar with "mauve" might sincerely judge "I see purple" when experiencing mauve. If the experience constitutes the judgment, how can the judgment be *wrong* about the specific quality experienced? Doesn't constitution imply identity of content?  

  5.  **Question:** How does the constitutive relation between experience and judgment *explain justification*? If the experience is literally part of the judgment, does that mean the judgment justifies itself? Or is the justification still coming only from the neural substrate?  
      *[Likely Answer: Justification comes directly from the constitutive presence of the experience; it's manifest, not inferred.]*  
      **Follow-up:** But if the experience is epiphenomenal, isn't its "presence" in the judgment metaphysically inert? How does its mere constitutive inclusion *do any epistemic work* like providing evidence or grounds, without smuggling in causal efficacy? Isn't this just saying "it's justified because it's there," which doesn't explain *how* its presence justifies?  

  6.  **Question:** Isn't the appeal to constitution effectively abandoning epiphenomenalism for the *specific case* of first-person judgments? If the experience is part of the judgment, and the judgment is causally efficacious (e.g., causing me to speak), doesn't that make the experience causally efficacious *by proxy*?  
      *[Likely Answer: Denies this; the judgment is a hybrid state, but only its physical constituents are causally efficacious. The phenomenal aspect remains inert.]*  
      **Follow-up:** But if the phenomenal aspect is truly inert, how does its inclusion in the judgment change the judgment's causal powers or representational content compared to an otherwise identical neural state *without* the experience (like in a zombie)? If it *doesn't* change anything, why invoke constitution? If it *does*, how is that change inert?

  ---

  **III. The Cost:**  
  7.  **Question:** On your view, both a truthful report of a vivid experience and a complete confabulation (say, under hypnosis) are ultimately caused by neural states. What resources does your view offer to distinguish them as *epistemically* different? What makes one report authoritative and the other mistaken, if not a causal connection to the experience itself?  
      *[Likely Answer: Points to differences in the neural causes/history; the "confabulated" report lacks the specific neural state normally constitutive/correlated with the experience reported.]*  
      **Follow-up:** But the subject in both cases *sincerely* takes themselves to be reporting an experience. If the authority of the truthful report comes solely from its neural cause reliably correlating with the experience, doesn't this reduce first-person authority to a *third-person* observable fact about neural correlations, undermining the unique first-person perspective?  

  8.  **Question:** You readily concede conceivability arguments and that you can't explain *why* the correlations hold. Setting aside standard objections, what do you see as the *single strongest consideration* against your specific version of epiphenomenalism? Relatedly, what kind of evidence *could* convince you that phenomenal properties *do* have causal powers?  
      *[Likely Answer: Might cite the deep intuition of mental causation ("I raise my arm because it hurts") or the challenge of explaining evolution of consciousness if inert. Evidence: Maybe rigorous evidence of non-physical causation or neural states that clearly lack physical differences correlating with distinct causal outcomes for reports.]*  
      **Follow-up:** If strong evidence emerged that a specific micro-qualia difference (undetectable physically) reliably caused a distinct behavioral report difference, would that falsify your view, or could you reinterpret it as a hitherto unknown physical difference causing both?  

  ---

  **IV. The Last Word:**  
  9.  **Question:** Once we set aside the paradox of phenomenal judgment as you've addressed it, what do you believe is the *core* disagreement between epiphenomenalists like yourself and those who insist on causal efficacy for consciousness? Is it about the nature of causation, the demands of explanation, the weight of intuition, or something else entirely?  
      *[No follow-up needed. Let him summarize the stakes.]*  

  ---
  **Key to Approach:**  
  *   **Concreteness:** Questions focus on specific scenarios (neural cause without experience, hallucination, confabulation) and demand answers *from within* his framework's resources.
  *   **Pressure Points:** Questions target the *explanatory gap* for reliability/judgment content (Q1, Q2, Q4 follow-up), the *epistemic inertness* of constituted experience (Q5, Q5 follow-up), and the *cost* to first-person authority/explanation (Q7, Q8).
  *   **Combative Anticipation:** Follow-ups directly challenge potential answers ("doesn't this just relocate the paradox?", "isn't that smuggling in causation?", "doesn't this undermine first-person authority?") forcing him to defend the coherence and explanatory power of his core moves.
  *   **His Framing:** Closing question (Q9) lets him restate his "double standard" charge against perception externalism if he wishes, framing the debate on his terms.
