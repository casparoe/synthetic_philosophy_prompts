  The user cares about reasoning, so I’ll emphasize dependency: Why Question 1 unlocks everything, why Question 3’s tractability depends on formalism, and why the rest might be premature. If "right but early" collapses under scrutiny, the funder should know before backing auxiliary projects.
answer: |-
  Your group has identified the core tension brilliantly: **the epistemic status of "not yet falsified" when "not yet" spans generations.** This isn't just about Malthus; it applies to climate tipping points, AI singularity forecasts, or even secular theological predictions. Below is a prioritized research agenda for your funder, grounded in logical dependencies, tractability for philosophers, and potential for decisive progress. The top priority fundamentally challenges your framing – and that's where the highest conceptual leverage lies.

  **Core Insight:** "Right but early" is not a *stable* epistemic category. It's a *provisional placeholder* awaiting resolution into either "falsified by accumulated non-occurrence" or "vindicated by eventual occurrence." The critical work is defining the conditions under which that resolution *must* happen, and how we assess theories *while* waiting.

  ### Priority 1: Define the Conditions for "Effectively Falsified by Non-Occurrence" (Attacking "Right but Early" Head-On)
  *   **Why Upstream?** This is the keystone. If "right but early" is merely a shield, it's epistemically bankrupt. If it's sometimes legitimate, we *must* define the boundary where "early" becomes "wrong." Without this, auxiliary repairs, credence decay, and unit of appraisal debates float in a void. **This question directly determines whether your recurring example (Malthus) is salvageable science or persistent pseudoscience.**
  *   **Tractability:** Pure conceptual work. Requires analyzing:
      *   **Time-Indexing & Theory Structure:** Must the theory specify *when* the prediction *should* be observable? (e.g., "Population collapse *within 300 years* of industrialization" vs. "Population *will eventually* outstrip food"). Implicit timeframes must be made explicit.
      *   **Causal Mechanism & Process Evidence:** Does the theory describe observable *processes* leading to the outcome *before* the outcome occurs? (e.g., rising food prices, declining birth rates *before* collapse). Failure to observe *process evidence* becomes crucial falsification.
      *   **Defining the "Runway":** What constitutes sufficient time/resources/conditions for the prediction to manifest? How do we know when the runway is definitively exhausted *without* the outcome? (e.g., "If agricultural productivity doubles without triggering collapse by 2100, Malthus is falsified *even if collapse happens in 2200*").
  *   **Evidence/Argument to Move Ranking:**
      *   *Up:* Develop a rigorous, broadly applicable framework defining "effective falsification by non-occurrence + absence of process evidence" that withstands counterexamples.
      *   *Down:* Conclusively demonstrate that *all* attempts to define such a boundary are inherently arbitrary or collapse into conventionalism.
  *   **Connection to Your List:** Directly addresses whether "right but early" is coherent or a shield. Determines whether auxiliary repairs are even permissible (Priority 2) and the basis for credence decay (Priority 3).

  ### Priority 2: Formalizing Credence Decay Under Temporal Uncertainty
  *   **Why Next?** If Priority 1 establishes that non-occurrence *can* lower credence (even before "final" falsification), we need rigorous rules for *how much* and *how fast*. This makes the "probation" status quantifiable and accountable.
  *   **Tractability:** Conceptual, leaning formal (Bayesian probability, confirmation theory). Philosophers excel here. Requires modeling:
      *   **Prior Probability & Initial Timeframe:** How initial credence and implied timeframe set the baseline.
      *   **The Decay Function:** How credence decreases as time passes *without* the event or supporting process evidence. Is it linear, exponential, dependent on auxiliary assumptions? How does it interact with evidence *against* the predicted causal process?
      *   **Double-Counting Time?** Clarify this: Passing time *itself* isn't evidence; it's the *absence of the predicted event/process* at points where it *could* have been observed that constitutes the evidence. Each passing observation point without the event *is* a new piece of disconfirming evidence.
  *   **Evidence/Argument to Move Ranking:**
      *   *Up:* Develop robust, non-arbitrary decay models applicable to diverse long-horizon predictions that avoid paradoxes and align with intuitive scientific judgments in clear cases.
      *   *Down:* Show that any formal decay model is too sensitive to arbitrary prior assumptions to be useful, or that "absence of evidence" truly isn't "evidence of absence" in these temporally extended cases.
  *   **Connection to Your List:** Directly tackles your credence decay/double-counting question. Provides the quantitative backbone for judging a theory "on probation." Depends on Priority 1 establishing *that* decay is justified.

  ### Priority 3: Criteria for Legitimate vs. Ad Hoc Auxiliary Repairs (When the Clock is Still Running)
  *   **Why Third?** Only meaningful *if* the core prediction hasn't been "effectively falsified" (Priority 1) and retains some credence (Priority 2). Focuses on how theories *adapt* while awaiting vindication/falsification.
  *   **Tractability:** Conceptual analysis of theory development. Requires:
      *   **Distinguishing Rescue from Development:** Building on Lakatos, but with a temporal twist. What makes an adjustment (e.g., "Green Revolution bought time, but soil depletion is the *real* Malthusian trigger") *progressive* (predicts *new* phenomena, explains *more*) vs. *degenerative* (only explains away past misses without new testable content)?
      *   **Novel Predictions & Process Evidence:** The gold standard for legitimacy: Does the repair generate *new, testable* predictions (especially about *processes* observable *before* the long-term outcome) that are *independent* of the original failure? (e.g., Repair predicts specific soil degradation rates *now*).
      *   **Fecundity vs. Immunization:** Does the repair open new research avenues, or just close off criticism?
  *   **Evidence/Argument to Move Ranking:**
      *   *Up:* Develop clear, operational criteria for "progressive repair" specific to long-horizon theories, validated against historical case studies (e.g., Malthusianism vs. Darwinian evolution's adjustments).
      *   *Down:* Show that distinguishing legitimate from ad hoc repairs is inherently subjective or impossible before the final outcome.
  *   **Connection to Your List:** Directly addresses your auxiliary repair question. Depends on Priorities 1 & 2 to define the context where repairs are even being considered.

  ### Priority 4 (Wildcard): The Epistemology of "Zombie Theories" & Non-Epistemic Persistence
  *   **Why Last (But Important)?** Explains why some long-refuted (or perpetually "early") theories persist *despite* failing Priorities 1-3. This moves beyond pure logic into sociology/philosophy of science but is crucial for understanding the *phenomenon* your group grapples with.
  *   **Tractability:** Conceptual/empirical mix, but philosophers can lead on conceptual frameworks. Requires:
      *   **Identifying Persistence Mechanisms:** How do ideological commitment, institutional inertia, rhetorical strategies ("the crisis is *deeper* now!"), or moral framing ("precautionary principle demands we believe!") keep theories alive when epistemic warrants fade?
      *   **Interaction with Epistemic Status:** How do non-epistemic factors exploit the *ambiguities* inherent in long time horizons (identified in Priorities 1-3) to resist falsification?
      *   **Normative Implications:** When *should* non-epistemic values (e.g., precaution) legitimately override weakening epistemic warrant for a long-horizon threat?
  *   **Evidence/Argument to Move Ranking:**
      *   *Up:* Develop a compelling typology of persistence mechanisms linked to specific epistemic vulnerabilities of long-horizon predictions, validated by case studies.
      *   *Down:* Find that non-epistemic persistence is fully explained by failures already covered in Priorities 1-3, or that it's too context-dependent for general analysis.
  *   **Connection to Your List:** Explains the *reality* behind theories that seem to have "stopped making contact with the world." Provides the "why" for cases failing the criteria from Priorities 1-3.

  **Why Not Your Unit of Appraisal Question?** This is important but likely *distributed* across the priorities:
  *   Priority 1 forces clarifying the prediction's scope (specific dated forecast vs. core mechanism).
  *   Priority 2 requires specifying *what* credence decays (the specific prediction? the core mechanism?).
  *   Priority 3 evaluates how repairs affect the *programme*.
  *   Trying to isolate "the" unit upfront is less productive than seeing how the unit matters *within* the analysis of falsification, decay, and repair.

  **Conclusion for the Funder:** Support 3-4 researchers focusing **first and foremost** on rigorously defining when "not yet" becomes "effectively falsified" for long-horizon predictions (Priority 1). This is the linchpin. Progress here will decisively advance the field, either validating "right but early" as a coherent (but bounded) status or exposing it as an epistemic evasion. Fund **simultaneous but linked work** on formalizing credence decay (Priority 2) and criteria for auxiliary repairs (Priority 3). The "zombie theory" question (Priority 4) is a valuable supplement, explaining persistence when epistemic status weakens. This agenda provides the conceptual tools needed to cut through the fog surrounding theories like Malthusianism, transforming "right but early" from a mysterious placeholder into a status subject to rational assessment.
