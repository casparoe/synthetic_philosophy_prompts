prompt: |-
  For about a year now, a reading group I belong to — a mix of lawyers, a couple of historians, and three or four people who did graduate work in philosophy — has been arguing about referendums, and the argument has stopped moving even though nobody disputes any of the facts. The shape of it is this. When a national referendum returns a narrow majority, one camp holds that the result expresses the will of the people, and that a legislature which then thwarts or dilutes it is usurping a decision that belongs to the people themselves. The other camp holds that there is no such thing as a popular will to be expressed: there are individual preferences, aggregated by whichever rule happened to be in force, and the same electorate with the same preferences would have returned a different result under a different agenda, a different threshold, a different wording of the question, or a different sequencing of votes. On that view, talk of the will of the people is a rhetorical way of claiming a victory that the arithmetic alone does not confer. A third member of the group insists that the first two are answering different questions — one about who ought to have final authority, the other about whether a certain kind of collective entity exists — and that the disagreement only looks intractable because both are filed under a single heading. My own hunch, which I offer as a hypothesis rather than as a premise, is that the impasse is neither a straightforward factual dispute nor a merely verbal one, and that it partly dissolves once we separate three claims that keep getting run together: that a collective will exists, that voting reveals it, and that it ought to govern.

  I want a diagnosis rather than a verdict, and I want it to engage the positions as I have stated them rather than to survey the literature — we have all read the standard material on aggregation and on populism, which is precisely why the argument has stalled. Tell me what kind of disagreement this actually is, and be specific about what each side is committed to: whether the dispute is about the metaphysics of collective agency, about the epistemology of what elections can reveal, about which institution holds final authority, or about standards of legitimacy that each side is applying without acknowledging. Where a party is equivocating, say so and say on what. Then tell me what, if anything, would count as progress given your diagnosis — a distinction, a formal result about aggregation, a change of question, or the exposure of an unstated empirical premise on one side — and whether any of it could actually move people who have dug in. If your honest conclusion is that nothing short of a change of subject would end it, say that plainly, and explain why the dispute is worth having anyway.

  Lead with your bottom line in the first sentence, then give your reasoning. No preamble, no restating of my question.
reasoning: |-
  Okay, the user describes a long-standing debate in their reading group about referendums and the concept of the "will of the people." The group consists of lawyers, historians, and people with philosophy backgrounds, so they're likely well-versed in arguments but stuck. One camp believes a narrow majority in a referendum expresses the popular will and should be respected. The other camp argues that there's no such thing as a collective will; it's just aggregated individual preferences influenced by procedural factors. A third person thinks these are separate issues: one about authority, the other about the existence of a collective entity. The user suspects the impasse involves conflating three claims: existence of collective will, voting revealing it, and its authority. They want a diagnosis, not a verdict, focusing on the positions stated, not literature. They need specifics on the type of disagreement, what each side is committed to, equivocations, and possible paths to progress.

  First, I need to determine the core of the disagreement. The first camp is concerned with legitimacy and authority—why should a referendum result be binding? They might be invoking a Rousseau-like general will, where the majority decision reflects the collective interest. The second camp is more about social choice theory, like Arrow's Impossibility Theorem, showing that aggregation methods affect outcomes. The third person points out they're talking past each other. The user’s hypothesis is that three claims are conflated: existence, revelation, and authority.

  The key is to untangle these aspects. The debate is meta-ethical and conceptual. The first group cares about political legitimacy: if people vote, that decision should be final, implying that the process confers legitimacy. The second group is positivist, denying the metaphysical existence of a collective will. They see referendums as mechanistic, where outcomes depend on procedural choices. 

  Equivocation might be happening. The first camp might slide between "will" as a normative claim (should be respected) and an empirical one (exists). The second camp could be conflating the impossibility of perfect revelation with the non-existence of a collective entity. Both might not clearly separate whether they're talking about ontology, epistemology, or normativity.

  Possible progress could involve distinguishing these dimensions. Using formal results from social choice theory to show how procedures affect outcomes might sway the second camp, but the first camp might dismiss it as irrelevant to legitimacy. Introducing a distinction between different types of collective entities (like Gilbert's plural subjects vs. statistical aggregates) could help. Or, questioning if the referendum was a one-off event versus part of an ongoing process. However, deep commitments might prevent movement. The first camp values direct democracy, the second is skeptical of populism. The dispute persists because it touches on core values about democracy and authority, making it worth engaging despite the impasse.
answer: |-
  **The dispute is a meta-ethical disagreement about the normative foundations of democracy, disguised as a factual or metaphysical debate about collective agency, with both main camps equivocating between descriptive and prescriptive claims while ignoring their core commitments.**  

  ### Diagnosis of Positions & Equivocations:  
  1.  **"Will of the People" Camp (Camp 1):**  
      - **Core Commitment:** A normative claim about *legitimacy*: Final authority *ought* to reside with the electorate in major decisions, and referendum results (even narrow) are the unique expression of that authority.  
      - **Equivocation:** Conflates *legitimacy* ("the people *should* rule") with *ontology* ("a collective will *exists*") and *epistemology* ("voting *reveals* it"). They treat "will of the people" as a normative trump card (legitimacy) while presenting it as a discovered fact (ontology/epistemology).  
      - **Unstated Premise:** Direct popular voting is the *only* procedurally legitimate source of sovereignty for fundamental decisions. Legislatures are mere delegates.  

  2.  **"No Collective Will" Camp (Camp 2):**  
      - **Core Commitment:** A positivist claim about *social choice mechanics*: Preferences are individual; aggregation rules are arbitrary/contingent; no stable "will" exists independently of the voting procedure.  
      - **Equivocation:** Conflates the *epistemological limitation* ("voting cannot *reveal* a pre-existing will") with the *ontological claim* ("no collective entity exists") and smuggles in a *normative dismissal* ("therefore, the result lacks special legitimacy"). Denies ontology to undermine legitimacy.  
      - **Unstated Premise:** Legitimacy requires robust, procedure-independent outcomes (impossible here), so legislatures *should* override "contingent" results.  

  3.  **The Third Member:** Correctly identifies the questions are distinct (authority vs. ontology) but underestimates their entanglement. The camps aren’t *just* answering different questions—they weaponize their answers against each other’s core commitments.  

  ### Nature of the Disagreement:  
  - **Fundamentally Normative:** The dispute appears metaphysical (does a collective will exist?) but is driven by conflicting intuitions about democratic legitimacy. Camp 1 prioritizes *source* (popular origin = legitimate). Camp 2 prioritizes *stability/resilience* (resistant to procedural manipulation = legitimate).  
  - **Meta-Ethical Stalemate:** Neither side acknowledges their core normative premise, treating their view as "fact." Camp 1’s legitimacy claim is untestable; Camp 2’s social-choice critique cannot disprove Camp 1’s *normative* prioritization of direct voting.  

  ### Paths to Progress:  
  1.  **Force Acknowledgement of Normative Premises:**  
      - Ask Camp 1: "If social choice theory proved referendums *never* reveal a coherent 'will,' should legislatures still obey narrow results? Why?"  
      - Ask Camp 2: "If a referendum used a flawless aggregation rule, would the result *then* be binding? If not, is your objection really about ontology, or authority?"  
      - **Effect:** Might expose that Camp 1 values popular *agency* regardless of epistemological flaws, while Camp 2 trusts *elite deliberation* to "correct" unstable outcomes.  

  2.  **Introduce a Formal Distinction (Collective Agency Types):**  
      - Distinguish *aggregative* collectives (statistical sum of individuals) from *deliberative* collectives (group identity formed through discourse). Camp 2 critiques only the former; Camp 1 invokes the latter rhetorically.  
      - **Effect:** Camp 1 must defend if/why a one-off vote creates a deliberative collective will. Camp 2 must admit that stable deliberative wills *can* exist (e.g., constitutional conventions), changing the debate to institutional design.  

  3.  **Reframe as "Tie-Breaker" Problem:**  
      - In a narrow referendum, both sides have equal democratic claims. The dispute is really: *Which institution breaks ties?*  
      - Present data: Legislatures/politicians consistently interpret close results as "mandates" when they agree and "no will" when they disagree.  
      - **Effect:** Shifts focus from metaphysics to institutional incentives/honesty, potentially depolarizing.  

  ### Why Progress Is Hard but Worthwhile:  
  - **Dug-in Positions:** Camp 1 fears elite usurpation; Camp 2 fears populist instability. These are deep-seated anxieties resistant to logic. Formal results (e.g., Arrow’s Theorem) won’t move them, as both camps already accept the facts but draw opposing normative conclusions.  
  - **Value of the Dispute:** It forces scrutiny of democratic myths. Is "the people" a legitimizing fiction? Can any procedure overcome social choice limitations? Engaging this reveals what each side truly values: Camp 1 values unmediated popular voice; Camp 2 values error-correction. Recognizing this clarifies trade-offs in constitutional design.  
  - **Bottom Line:** The argument will persist until both camps explicitly debate their *normative* priorities for legitimacy. Until then, it remains a proxy war over who deserves trust: the People or the Legislature. Changing the subject might pause it, but the underlying tension—direct vs. mediated democracy—is foundational and worth confronting.
