answer: |-
  Judy lands somewhere in the grid: Blue or Red Territory, each with HQ or Second Company. Radio crackles: "If you're in Blue, you're in HQ! Over."

  "Great!" thinks Judy. "So, I can rule out Blue-Second Company."

  She starts updating her credences. Using the *material conditional* (¬Blue ∨ HQ) makes Red-HQ *less* likely – absurd! Why should learning about *Blue* affect her belief about *Red*-HQ?

  Minimizing relative entropy gives a different, more intuitive answer... but feels like cheating. Judy groans. "Just tell me *where* I am, not what *would* be true *if* I were somewhere else! Updating on a conditional is giving me a headache!"

