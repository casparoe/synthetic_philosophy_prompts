  Hmm... the key insight from Dana is fascinating: that the future self judging the decision can't be objective because their perspective is shaped by the decision itself. That's the philosophical knot to untangle without using jargon.

  The speech structure should probably:
  Start with warmth to establish affection
  Acknowledge both viewpoints neutrally 
  Share Dana's insight in plain language
  End with something portable - maybe about courage in uncertainty?

  Biggest risks to avoid:
