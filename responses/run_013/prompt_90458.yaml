  ## Dana's Send-Off Speech

  **(Clears throat lightly, adjusts the mic, looks around the room with a small, affectionate smile)**

  Well. Here we are. Dana’s last Saturday. Feels strange to say that. Feels strange to be the one saying it, honestly. Most of you know I’ve known Dana longer than almost anyone here – since we were kids stealing biscuits from the tin. So, they handed me the microphone. Probably because I know both halves of this room… and let’s be honest, both halves know I’m generally harmless. Mostly.

  **(Pauses, looks at Dana)**

  Dana. You’re leaving. You’re packing up a life here – a good life, by any measure. The job you built, that flat you finally got exactly how you wanted it... things people work years for. You’re leaving people who love you deeply, who worry – understandably – that you’re dismantling something solid for… well, for the unknown. A place where the language sounds like music you haven’t learned yet, where faces are mostly unfamiliar. It’s a big leap. A terrifying one, frankly. And that worry, that love… it’s real. It’s sitting right there. **(Nods gently towards family)**

  But you’re also leaving because something else feels real. To this half of the room **(Gestures towards climbers)**, this isn’t dismantling. It’s building. It’s finally… breathing. It’s stopping the pretending, like shedding an old skin that didn’t fit anymore. They see the spark, the sheer guts of it. That excitement? That’s real too. It’s sitting right here.

  So, here I am, stuck in the middle. The designated speaker. And the usual script for these things? It’s pretty straightforward. “You’ll be brilliant!” “This is the best decision you ever made!” “You’re going to find exactly what you’re looking for!” Promises about happiness, about futures neatly made.

  **(Leans slightly towards the mic, voice quieter, more intimate)**

  I can’t make those promises. Not because I doubt *you*, Dana. Not for a second. But because… well, because a few weeks ago you said something that stuck with me. Really stuck. You were wrestling with this whole thing, and you said you couldn’t figure out how to decide, because the person who’ll *judge* whether it was the right choice – that future Dana over there – isn’t the same person making the choice right now. She won’t want the same things. She’ll have lived a different life, seen different skies. And you can’t exactly phone her up and ask for advice, can you? Because she doesn’t exist yet. And when she *does* exist… well, she’ll be shaped by the very choice you’re making now.

  **(Pauses, lets that sink in, voice remains plain, thoughtful)**

  It’s a bit of a head-spinner, isn’t it? If future Dana is thrilled, dancing under foreign stars, that joy is tied up in having *gone*. It doesn’t prove this was the *only* right path, just that it’s the path that *made* her thrilled. And if future Dana is… well, if it’s hard? If she’s homesick or lost? She’ll likely have spent years adapting, building walls or bridges, finding ways to cope. That sadness might not be a simple verdict on the choice itself, just the weather on a particular day on that particular path. The witness… the future you… she can’t really give us an unbiased report. She’s already part of the experiment.

  **(Shifts focus back to Dana, warmth returning)**

  So what *can* I say? What can I give you that isn’t a flimsy promise about an ending I can’t see?

  I can tell you what I see *right now*. I see my oldest friend, standing on the edge of something vast. I see someone who looked at a perfectly good map and decided she needed to draw her own, even if parts of it are blank. I see the courage it takes to admit that the life you *have* isn’t necessarily the life you *need*, even when it looks good from the outside. Especially then.

  **(Looks around the room again, inclusive)**

  Both halves of this room love you. We just see different parts of the picture. The family sees the roots, deep and strong. The climbers see the reach, the yearning for the next handhold. Both are true. Both are you. And maybe that’s the point. This choice? It’s not about proving one side right and the other wrong. It’s not about guarantees. It’s about *you* needing to find out.

  **(Turns fully to Dana, steady gaze)**

  So here’s what I hope you take with you, Dana, onto that plane. Not reassurance about the ending – because honestly, who knows? Take this instead: **The absolute clarity of why you’re going *now*.** You’re not running *away*. You’re stepping *towards* something you can’t quite name yet, but you feel it pulling you. That feeling, right here, right now? That restless, terrifying, exhilarating certainty that this is the leap you *have* to make? *That’s* real. That’s yours. Hold onto *that*. It’s the truest compass you’ve got.

  Wherever that compass leads, whatever person it helps you become… we’ll be here. Curious. Hoping. Loving the Dana we know now, and ready to meet the ones you become next.

  **(Raises glass)**

  To Dana. To the leap. To the blank spaces on the map. May you fill them with a story that’s entirely, unmistakably, yours.

  **(Smiles warmly, genuinely)** Cheers, D. We’ll miss you. Go find out.

  **(Clinks glass, steps back)**
