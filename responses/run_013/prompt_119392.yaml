prompt: |-
  I sit on the ethics committee of a mid-sized teaching hospital — I'm the non-clinician member — and I've spent enough years reading rationalist blogs and forums to get suspicious whenever someone says that hard cases simply have to be judged "case by case." Our consult notes go back about a decade, and read in a batch they have convinced me that we are in fact running a decision rule that nobody has ever written down. Our policy requires the committee to name the closest prior consult whenever it makes a recommendation, which is how I first noticed the pattern; the recommendations are advisory, so the attending sometimes does whatever he had already decided to do, and that is part of why I care more about getting the rule right than about winning this particular vote.

  Our track record, as compactly as I can put it. (1) A 68-year-old woman with metastatic pancreatic cancer had a directive refusing "CPR, a breathing machine, and the ICU." She came in with pneumonia and respiratory failure, awake and frightened, and the committee recommended against intubation and against transfer to the ICU; she died on the ward two days later. (2) A 59-year-old man with severe COPD had a directive refusing "being kept on a machine when there's no getting off it." He came in with a pneumonia the team judged treatable, needed nine days of ventilation, was weaned, went home, and told us afterwards that he was glad we hadn't gone by the form; the committee had recommended treating him. (3) A 74-year-old woman with advanced dementia had a directive refusing "a feeding tube and antibiotics for infections once I no longer know my own family." She no longer recognized her son; when the aspiration pneumonia came she was moaning and pulling at her gown; her son demanded that everything be done; the committee recommended comfort care only, and she died. (4) A 51-year-old man with no serious diagnoses had filled out a form twelve years earlier at an employer health fair saying that he did not want "heroic measures in a terminal condition." He arrived with a severe but fully treatable sepsis, and his brother insisted that we honor the form and let him die; the committee recommended full treatment, and he walked out of the hospital three weeks later.

  The new consult is a 63-year-old woman with a progressive motor neuron disease. Three years ago, while she was still working, she wrote: "If I reach the point where I cannot breathe on my own, I do not want to be kept alive on a ventilator." She is now in the ICU on a ventilator after a chest infection. The team's view is that with two to four weeks of support she has roughly even odds of being weaned and going home with worse lungs than before, and that if weaning fails she would need a tracheostomy and long-term ventilation. She is at most lightly sedated, oriented, and not depressed; asked directly, she says she wants to live, and she asks about her garden and her granddaughter's wedding. During her worst spells of breathlessness she says she has had enough. The psychiatric consultant says she can state a choice and give reasons, but that her capacity fluctuates with her oxygenation, and the team is split on whether she is currently able to revoke a directive she wrote while well. Her brother is her proxy and wants everything done; her daughter says her mother never wanted to be on a machine. What should we recommend if we want to be consistent with ourselves? Which of the four prior consults is the closest analog, and which ones look closest without actually being so? I am less interested in the verdict than in the decision rule: give me the two or three rules that fit our four rulings equally well, say what each one predicts here, tell me which you would adopt and why, and — if the precedents genuinely underdetermine the case — spell out what principle we would be committing ourselves to with each choice, and name the next case that would tell the rules apart. I don't need a literature review or citations; reason from the track record.
reasoning: |-
  Okay, I need to help this ethics committee member figure out their unwritten decision rule. They've given four prior cases and a new one, and they want me to identify consistent patterns without getting into external literature. Let me start by summarizing the key elements from each past case to spot commonalities.

  First, in Case 1, the patient had metastatic cancer and a directive refusing CPR, ventilator, and ICU. She was awake but in respiratory failure, and the committee recommended against intubation. She died soon after. Here, the directive was followed strictly, likely because her condition was terminal with no recovery chance.

  Case 2 involved a COPD patient who refused long-term ventilation. He had a treatable pneumonia, was ventilated temporarily, recovered, and was glad he was treated. The committee overrode the directive because the treatment was temporary and successful. The key difference was the reversibility of his condition.

  In Case 3, the dementia patient refused feeding tubes and antibiotics once she didn't recognize family. When she got pneumonia, the committee upheld the directive for comfort care, even with her discomfort and the son's objections. Her condition was irreversible, aligning with the directive's intent.

  Case 4 was a healthy man with an old directive refusing heroic measures in terminal illness. He had treatable sepsis, so the committee ignored the directive and treated him. The directive didn't apply because his condition wasn't terminal, and the form was outdated.

  Looking at these, the common factors are: the patient's current medical condition (reversible or terminal), the specificity and relevance of the directive, and the patient's current capacity or preferences. The committee seems to prioritize current prognosis and applicability of directives over strict adherence, especially if the directive's conditions aren't met.

  Now, the new case: a woman with motor neuron disease who refused long-term ventilation if she couldn't breathe on her own. She's currently on a vent with a 50% chance of weaning. She's alert, wants to live, but fluctuates in capacity. The team debates if she can revoke her directive. The proxy (brother) wants treatment; the daughter wants the directive followed.

  To be consistent, which prior cases align? Case 2 is similar because both involve a temporary ventilation period with a chance of recovery. The directive's condition ("cannot breathe on my own") might not be fully met yet—she could potentially be weaned. Her current expressed desire to live also mirrors the recovered patient in Case 2 who was glad he was treated. However, unlike Case 2, her underlying condition is progressive, so long-term ventilation might be needed if weaning fails. That complicates things.

  Case 3 is different because the dementia patient's condition was irreversible, similar to Case 1's terminal cancer. Here, even if weaning fails, she could live with a trach, so it's not necessarily terminal. Case 4 is similar in that the treatment was curative, and the directive was too vague or outdated. Here, the directive is specific and recent, but the condition—being unable to breathe—is ambiguous. Is she currently unable, or would she be if weaned? Her current state on the vent with a chance of recovery adds nuance.

  Possible decision rules: 

  1. **Prognosis Override Rule**: Override directives if the acute condition is reversible with good prognosis, even if the directive applies. This fits Cases 2 and 4. Case 1 and 3 had poor prognoses, so directives were followed. Here, the prognosis is moderate (50% chance), so this rule might lean towards treatment.

  2. **Directive Applicability Rule**: Follow the directive only if current conditions match its exact terms. In Case 1, the conditions matched (respiratory failure, terminal). Case 2 didn't match because ventilation was temporary, not permanent. Case 3 matched (dementia advanced). Case 4 didn't (not terminal). Here, she's on a vent now, but the directive specified "cannot breathe on my own," which might imply permanent dependence. If she's weaned, she might not need long-term support. However, if she can't be weaned, it applies. Since the outcome is uncertain, this rule might require assessing if the current state meets the directive's trigger.

  3. **Current Preference Rule**: Prioritize current expressed wishes if the patient has capacity. In Case 2, the patient was treated and later agreed; in Case 4, he couldn't consent, but treatment was given. Case 1 and 3 had no current dissent. Here, she currently wants to live, but her capacity fluctuates. The psych consult says she can state choices, but it's unstable. This rule might support continuing treatment while she's capable, but it's tricky with fluctuating capacity.

  Consistency check: All rules fit the past cases. For the new case, each rule gives different recommendations. Prognosis Override suggests treatment due to 50% recovery chance. Directive Applicability is ambiguous—depends on defining "cannot breathe on my own" and whether temporary vent use triggers the directive. Current Preference supports treatment since she's currently expressing a desire to live.

  The closest prior is Case 2 due to the temporary ventilation need and chance of recovery. But key differences: the underlying disease here is progressive, and if weaning fails, long-term vent is needed, which aligns with her directive. Case 2 had a one-time recovery without long-term implications.

  To resolve ambiguity, the committee might need to decide if the directive applies only if she's permanently dependent. Since she has a 50% chance of not needing long-term support, the directive might not be triggered yet. Her current wishes could tip the balance towards continuing treatment.

  The next case to distinguish rules: If a patient with a directive refusing long-term vent develops a reversible acute issue but expresses a wish to die during distress. Would they override based on prognosis or follow current preference? Or if a patient with a clear directive regains capacity and changes their mind—how would that be handled?

  For the recommendation: Based on consistency with Case 2, recommend continuing treatment. The decision rule would be a mix of prognosis and directive applicability, emphasizing that directives are overridden when the acute condition is reversible and doesn't match the directive's permanent scenario.
answer: |-
  Based solely on your committee's track record, I identify two equally consistent decision rules that explain all four prior rulings. A third rule is plausible but slightly less consistent. I'll define each rule, apply it to the new case, explain the verdict, and specify the principle being committed to. Finally, I'll outline a hypothetical "next case" to distinguish between the rules.

  ### Core Pattern from Precedents
  Your rulings consistently **override advance directives when ALL of the following are true**:  
  - (A) The *current acute condition* is reversible/treatable  
  - (B) The *directive's stated trigger* doesn't perfectly match the clinical reality  
  - (C) The *outcome* could restore meaningful function (not merely prolong dying)  

  **Where directives were followed (Cases 1 & 3)**:  
  - Irreversible underlying disease (metastatic cancer, advanced dementia)  
  - Directive trigger exactly matched (respiratory failure = "breathing machine"; unrecognizing family = "no longer know my family")  
  - Intervention would only delay imminent death  

  **Where directives were overridden (Cases 2 & 4)**:  
  - Treatable acute problem (pneumonia, sepsis)  
  - Trigger mismatch:  
    - Case 2: "No getting off machine" ≠ *temporary* ventilation with weaning  
    - Case 4: "Terminal condition" ≠ *treatable* sepsis; "heroic measures" was vague  
  - Good functional recovery possible  

  ---

  ### Rule 1: **The Reversible Pathway Test**  
  *"Honor the directive only if there is no credible pathway to restore baseline or near-baseline function."*  

  - **Prediction for new case**: **Recommend continuing ventilation**  
    - *Why*: Her pneumonia is treatable (reversible acute condition), and 50% chance of returning home (meaningful function). Her directive trigger—"cannot breathe on my own"—doesn't match current reality because she *might* be weaned. Precedent: Case 2 (COPD patient weaned) and Case 4 (non-terminal sepsis treated).  
  - **Principle committed to**: Directives are binding only for *irreversible* decline. Reversible acute crises are medical decisions, not advance directive triggers.  
  - **Closest analog**: **Case 2** (both involve pneumonia/ventilation with weaning potential).  
  - **False analog**: Case 3 (dementia was irreversible; baseline could not be restored).  

  ### Rule 2: **The Trigger Literalism Rule**  
  *"Honor the directive only if the patient's current state *precisely* matches the directive's wording *and* the intervention falls under its explicit scope."*  

  - **Prediction for new case**: **Recommend continuing ventilation**  
    - *Why*: Directive refuses ventilation only if she "cannot breathe on her own"—but she *can* breathe with temporary support and may wean. "Cannot breathe on my own" implies *permanent* dependence (like Case 3's feeding tube), not trial ventilation. Precedent: Case 4 (vague "heroic measures" didn’t cover antibiotics for sepsis) and Case 2 ("no getting off" ≠ temporary ventilation).  
  - **Principle committed to**: Directives are interpreted narrowly. Ambiguity or clinical mismatch defaults to life-preserving treatment.  
  - **Closest analog**: **Case 4** (both directives used conditional language that didn’t fit the acute scenario).  
  - **False analog**: Case 1 (directive explicitly covered "breathing machine" in respiratory failure).  

  ### Rule 3: **Fluctuating Capacity Priority Rule** (Less Consistent)  
  *"Prioritize current expressed wishes over past directives if the patient has *any* periods of decision-making capacity, unless the directive trigger is unambiguously met."*  
  - **Prediction for new case**: **Recommend continuing ventilation**  
    - *Why*: She currently expresses a desire to live during lucid periods. Precedent: Case 2 (patient later affirmed treatment) and Case 4 (incapacitated patient’s vague directive overridden; no current objection).  
  - **Why weaker fit**: Inconsistent with Case 3 (patient moaned/pulled gown—a potential distress signal—but committee ignored this and followed directive). Also, Case 1 had no documented current objection but directive was followed.  
  - **Principle**: Capacity fluctuations create a presumption for current observable preferences.  

  ---

  ### Which Rule Would I Adopt?  
  **Rule 1 (Reversible Pathway)**, because:  
  1. It best explains *all* overrides (Cases 2 & 4) and honors (Cases 1 & 3) without exceptions.  
  2. It aligns with medical ethics' focus on prognosis while respecting directives *when irreversible*.  
  3. It avoids the pitfalls of Rule 2 (overly literal interpretations may ignore intent) and Rule 3 (inconsistent with Case 3).  

  **For this patient**:  
  - **Recommend continuing ventilation** for 2–4 weeks to assess weaning potential.  
  - If she cannot be weaned, *then* her directive ("cannot breathe on my own") is triggered, and tracheostomy should be refused.  

  ---

  ### If Precedents Underdetermine the Case  
  Your committee would commit to one of two principles:  
  - **Choosing Rule 1**: You prioritize *prognostic certainty* over directive triggers. This implies directives only apply when recovery is impossible (e.g., metastatic cancer).  
  - **Choosing Rule 2**: You prioritize *textual precision* over intent. Directives bind only if wording exactly matches the clinical scenario.  

  **Next Case to Distinguish Rules**:  
  A 70-year-old with severe heart failure has a directive: "No CPR if my heart stops." He arrests during a routine procedure but is *immediately* resuscitated. With prompt defibrillation, he has a 90% chance of full recovery.  
  - **Rule 1 predicts OVERRIDE**: Arrest was reversible; CPR isn’t futile.  
  - **Rule 2 predicts HONOR**: Directive explicitly refuses CPR for cardiac arrest.  
  *(This tests whether "reversible pathway" trumps explicit wording)*  

  ### Final Note on Consistency  
  Your pattern suggests the committee implicitly rejects directives when:  
  - The acute crisis is curable *and*  
  - The directive’s language is conditional or imprecise *and*  
  - Death is not imminent without the directive’s intervention.  
  The new case fits this: treatable pneumonia, ambiguous trigger ("cannot breathe"), and death not imminent with ventilation. **Recommend treatment**, aligning with Cases 2 and 4.
