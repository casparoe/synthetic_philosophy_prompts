  ### Restatement of Madhyamaka Concepts in Formal Vocabulary  
  **Core Framework:** Bilattice with values: **T** (true), **F** (false), **B** (both), **N** (neither). Truth order: \(F \leq_t T\), \(F \leq_t B\), \(F \leq_t N\), \(B \leq_t T\), \(N \leq_t T\). Information order: \(N \leq_i T\), \(N \leq_i F\), \(T \leq_i B\), \(F \leq_i B\). Operations:  
  - Negation: \(\neg T = F\), \(\neg F = T\), \(\neg B = B\), \(\neg N = N\).  
  - Disjunction: \(X \lor Y = \sup_{\leq_t}(X, Y)\).  
  - Conjunction: \(X \land Y = \inf_{\leq_t}(X, Y)\).  

  #### Tetralemma (Catuṣkoṭi)  
  For proposition \(P\) (e.g., "Phenomenon \(x\) has svabhāva"):  
  1. **First Corner (Affirmation):** \(P = T\).  
  2. **Second Corner (Negation):** \(P = F\).  
  3. **Third Corner (Both):** \(P = B\) (implying \(P \land \neg P = B\)).  
  4. **Fourth Corner (Neither):** \(P = N\) (implying \(\neg(P \lor \neg P) = N\)).  
  **Translation:** Each corner assigns a truth value to \(P\). The tetralemma exhausts all possible assignments in this 4-valued logic.  

  #### Emptiness (Śūnyatā)  
  - **Svabhāva as Type Error:** Svabhāva (inherent existence) is a type error. Let \(\text{has\_svabhāva}: \text{Entity} \to \text{Prop}\) be a predicate. Emptiness states:  
    \(\forall x , \text{has\_svabhāva}(x) = \text{undefined}.\)  
    "Undefined" is **not** a value in \(\{T, F, B, N\}\) but a **failure of denotation** (e.g., a non-terminating function in operational semantics).  
  - **Dependent Origination (Pratītyasamutpāda):** Phenomena are computational terms defined by their dependencies. For entity \(x\):  
    \(x = \lambda (y_1, y_2, \dots, y_n) . f(y_1, \dots, y_n)\),  
    where \(f\) is a function in typed lambda calculus. \(x\) has no independent denotation; its "value" is contextually reduced via operational semantics.  

  #### Two Truths  
  - **Conventional Truth (Saṃvṛti):** Defined within the 4-valued bilattice. Assigns values \(T, F, B, N\) to propositions pragmatically.  
  - **Ultimate Truth (Paramārtha):** Meta-claim that all propositions about svabhāva are **undefined**. Not a value in the bilattice but a **judgment** (e.g., \(\vdash \text{has\_svabhāva}(x) \uparrow\) in sequent calculus, meaning "does not compute").  

  ---

  ### Residue Report  
  **Criteria:**  
  - **Clean Translation:** Minimal distortion; captures logical structure and intent.  
  - **Distortion:** Preserves form but loses therapeutic/soteriological effect.  
  - **No Expression:** Inexpressible in the vocabulary; reveals limits.  
  - **Fatal Residue:** Blocks the soteriological aim; reduces to formal puzzle.  

  #### 1. Tetralemma Corners  
  - **First Corner (P = T):**  
    - **Translation:** Assigns definite truth. Clean for conventional use.  
    - **Residue:** Distortion. In ultimate analysis, \(P = T\) is rejected, but the bilattice forces an assignment. Loses the therapeutic shock of "no ground."  
  - **Second Corner (P = F):**  
    - **Translation:** Mirrors classical negation. Clean in isolation.  
    - **Residue:** Distortion. Rejection of \(F\) (e.g., "things don’t not exist") isn’t captured; the bilattice lacks a mechanism to invalidate the assignment itself.  
  - **Third Corner (P = B):**  
    - **Translation:** Paraconsistent "both" exists formally.  
    - **Residue:** **Fatal.** Madhyamaka rejects contradictions; \(B\) reifies a state to cling to. The therapeutic aim (to abandon all views) is lost when \(B\) is a value.  
  - **Fourth Corner (P = N):**  
    - **Translation:** Paracomplete "neither" mirrors indeterminacy.  
    - **Residue:** **Fatal.** \(N\) is still a value! Assigning \(N\) to \(P\) contradicts emptiness—it implies \(P\) is meaningfully "neither," but emptiness says \(P\) is **undefined**.  

  **Summary for Tetralemma:**  
  - **Clean:** Surface structure of corners.  
  - **Distortion:** Rejection of corners becomes a valuation exercise, not insight.  
  - **Fatal Residue:** \(B\) and \(N\) are admissible values, undermining the deconstructive goal.  

  #### 2. Emptiness of Svabhāva  
  - **Translation:** Svabhāva as a type error is clean. "Undefined" halts reification.  
  - **Residue:** **Distortion.** "Undefined" in computation is a technical failure; emptiness is a soteriological insight. The visceral release of "no inherent existence" becomes a dry type-check.  
  - **No Expression:** The **why** of the type error. Emptiness isn’t arbitrary—it’s revealed by dependent origination.  

  #### 3. Dependent Origination  
  - **Translation:** Lambda terms with dependencies are clean. Mirrors conditionality.  
  - **Residue:** None. This is the strongest fit.  

  #### 4. Two Truths  
  - **Conventional Truth:**  
    - **Translation:** Bilattice valuations cleanly model pragmatic, context-dependent truth.  
  - **Ultimate Truth:**  
    - **Translation:** Judgment of "undefined" is clean for svabhāva propositions.  
    - **Residue:** **Fatal.** The ultimate truth itself cannot be expressed without reification. Saying "all is undefined" assigns a meta-value, violating emptiness. The vocabulary forces a choice: accept this or fall silent.  

  **Paraconsistent vs. Paracomplete Choice:**  
  - **Defended Choice: Paracomplete.**  
    Madhyamaka rejects contradictions (no \(P \land \neg P\)), so paraconsistency (\(B\)) is invalid. Emptiness aligns with gaps (paracompleteness: "neither" as lack of truth value). **But:** Assigning \(N\) is still wrong! Ultimate truth is **not** \(N\)—it’s beyond the bilattice.  

  ---

  ### Verdict: Translation Fails; Fatal Residue in Therapeutic Aim  
  **Successes:**  
  - Dependent origination maps cleanly to computational dependencies.  
  - Conventional truth fits bilattice pragmatism.  
  - Svabhāva as type error blocks reification.  

  **Fatal Failures:**  
  1. **Tetralemma Corners \(B\) and \(N\):**  
     - Assigning \(B\) or \(N\) contradicts emptiness. The logic forces you to choose a value, but emptiness rejects all values. This reduces the tetralemma to a puzzle about negation, losing its soteriological power to liberate from views.  
  2. **Ultimate Truth Reifies:**  
     - Stating "all is undefined" creates a meta-truth, violating emptiness. Your vocabulary lacks a self-undermining mechanism (e.g., a fixed-point that dissolves itself).  

  **Why It’s Fatal:**  
  The apparatus is **ontologically committed**. Bilattice values exist; lambda terms compute; undefinedness is a technical state. Madhyamaka denies all commitments. The residue isn’t a clarity issue—it’s intrinsic to formal systems. The therapeutic point (freedom from conceptualization) dies when reduced to truth assignments.  

  **What’s Needed:**  
  A vocabulary with **self-applicable negation** that can:  
  - Invalidate its own judgments (e.g., "this sentence has no truth value").  
  - Model "truth" as a purely operational, context-bound tool without metalogic.  
  - For now, your tools formalize the scaffold, not the dissolution.  

  **Final Position:**  
  The translation fails where it matters most. It renders Madhyamaka a formal game, not a path to insight. The residue is a defect of your vocabulary—but also a sign that logic, by nature, cannot capture the ungrounded. Use it to see the limits, then let go.
